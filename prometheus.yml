# prometheus.yml

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/alerts/*.yml"

scrape_configs:
  - job_name: "legalmas-api"
    metrics_path: /metrics
    scrape_interval: 15s
    static_configs:
      - targets: ["host.docker.internal:8000"]
    relabel_configs:
      - target_label: service
        replacement: legalmas-api

  - job_name: "office-converter"
    metrics_path: /metrics
    scrape_interval: 15s
    static_configs:
      - targets: ["host.docker.internal:8080"]
    relabel_configs:
      - target_label: service
        replacement: office-converter


        