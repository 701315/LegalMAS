server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /tmp/positions.yaml
  sync_period: 10s

clients:
  - url: http://loki:3100/loki/api/v1/push
    backoff_config:
      min_period: 500ms
      max_period: 5m
      max_retries: 10
    batchsize: 1048576
    batchwait: 1s

scrape_configs:
  - job_name: legalmas-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: legalmas
          service: legalmas
          __path__: /var/log/legalmas/app.log*

    pipeline_stages:
      - json:
          expressions:
            log_level: level
            log_logger: logger
            log_timestamp: timestamp
            log_environment: environment
            log_stage: stage
            log_queue: queue

      - labels:
          level: log_level
          logger: log_logger
          environment: log_environment
          stage: log_stage
          queue: log_queue

      - timestamp:
          source: log_timestamp
          format: RFC3339Nano
          fallback_formats:
            - "2006-01-02T15:04:05.999999Z07:00"
            - RFC3339
          action_on_failure: fudge

      - drop:
          expression: '.*GET /metrics.*|.*GET /health.*'
          drop_counter_reason: "noisy_healthcheck"

          