# ===========================================================================
# Grafana Tempo 2.4.1 — конфигурация для локальной/dev среды.
#
# Простым языком:
# Этот файл говорит Tempo:
# - на каких портах слушать входящие трейсы
# - куда сохранять трейсы на диск
# - как долго хранить трейсы
# - как принимать данные от нашего Python backend
# ===========================================================================

# ---------------------------------------------------------------------------
# server — настройки HTTP и gRPC серверов Tempo.
#
# HTTP порт 3200 — для Grafana (читает трейсы для отображения).
# gRPC порт 9095 — внутренний порт компонентов Tempo.
# ---------------------------------------------------------------------------
server:
  http_listen_port: 3200
  grpc_listen_port: 9095
  log_level: warn

# ---------------------------------------------------------------------------
# distributor — настройки приёма трейсов от внешних источников.
#
# Простым языком:
# Это "входная дверь" для трейсов.
# Наш Python backend отправляет трейсы по протоколу OTLP HTTP (порт 4318).
# ---------------------------------------------------------------------------
distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: "0.0.0.0:4318"
        grpc:
          endpoint: "0.0.0.0:4317"

# ---------------------------------------------------------------------------
# ingester — буферизация трейсов перед записью на диск.
#
# Простым языком:
# Tempo накапливает трейсы в памяти и сбрасывает их блоками каждые 5 минут.
# ---------------------------------------------------------------------------
ingester:
  max_block_duration: 5m

# ---------------------------------------------------------------------------
# compactor — сжатие и уплотнение данных на диске.
#
# Простым языком:
# Объединяет мелкие файлы в крупные блоки и удаляет старые трейсы.
# block_retention: 24h — трейсы хранятся 24 часа, потом удаляются.
# ---------------------------------------------------------------------------
compactor:
  compaction:
    block_retention: 24h

# ---------------------------------------------------------------------------
# storage — где Tempo хранит трейсы на диске.
#
# backend: local — хранить в обычных файлах (в Docker volume).
# /var/tempo/traces — папка для готовых блоков.
# /var/tempo/wal    — Write-Ahead Log, защита от потери данных при рестарте.
# ---------------------------------------------------------------------------
storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal
    pool:
      max_workers: 100
      queue_depth: 10000

# ---------------------------------------------------------------------------
# querier — настройки поиска трейсов.
# ---------------------------------------------------------------------------
querier:
  max_concurrent_queries: 10

# ---------------------------------------------------------------------------
# query_frontend — фронтенд для запросов от Grafana.
# ---------------------------------------------------------------------------
query_frontend:
  search:
    duration_slo: 5s
    throughput_bytes_slo: 1.073741824e+09
  trace_by_id:
    duration_slo: 5s

# ---------------------------------------------------------------------------
# metrics_generator — генерация RED-метрик из трейсов.
#
# Простым языком:
# Tempo автоматически создаёт метрики на основе трейсов и отправляет
# их в Prometheus. Это нужно для Service Map (карты зависимостей) в Grafana.
#
# service-graphs — граф зависимостей между сервисами.
# span-metrics   — RED-метрики для каждого span.
# ---------------------------------------------------------------------------
metrics_generator:
  registry:
    external_labels:
      source: tempo
      cluster: legalmas-local
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true
  processor:
    service_graphs:
      dimensions:
        - http.method
        - http.status_code
    span_metrics:
      dimensions:
        - http.method
        - http.status_code
        - http.target

# ---------------------------------------------------------------------------
# overrides — глобальные лимиты в новом формате (Tempo 2.4+).
#
# Простым языком:
# Включаем генерацию метрик из трейсов для всех входящих данных.
# "defaults" — настройки применяемые ко всем tenant по умолчанию.
# Это новый формат вместо устаревшего "inline unscoped" формата.
# ---------------------------------------------------------------------------
overrides:
  defaults:
    metrics_generator:
      processors:
        - service-graphs
        - span-metrics

        