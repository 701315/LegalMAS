[project]
name = "mas-dd"
version = "0.1.0"
description = "MAS MVP for M&A Legal Due Diligence"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
# полностью отдаём управление anyio, pytest-asyncio не нужен
# asyncio_mode = "auto"
# asyncio_default_fixture_loop_scope = "function"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short -p no:pytest_asyncio"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

