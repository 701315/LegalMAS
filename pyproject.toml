[project]
name = "mas-dd"
version = "0.1.0"
description = "MAS MVP for M&A Legal Due Diligence"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short -p no:pytest_asyncio --strict-markers -m 'not llm_integration'"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: integration tests",
    "phase7: Phase 7 cross-reference tests",
    "regression: regression tests for stable artifact outputs",
    "llm_integration: tests that require a live LLM (excluded from default pytest run)",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
