checks_v8:
  - id: "land_subject_extraction"
    name: "Предмет: земельный участок (извлечение ключевых данных)"
    description: "Тестовый check для предмета земли"
    severity: "high"

    conditional:
      triggers:
        - name: "land_plot_sale"
          state: "on"
      when:
        - field: "property_kind"
          op: "=="
          value: "land_plot"

    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "cadastral_number"
          type: "string"
          description: "Кадастровый номер"
          regex_patterns:
            - "(?i)\\b\\d{2}:\\d{2}:\\d{6,7}:\\d+\\b"
          keyword_hints:
            - "кадастровый номер"
