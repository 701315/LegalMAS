        - "строительно-техническая экспертиза"
        - "совместное обследование"
        - "независимая экспертиза"
        - "расходы на экспертизу"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)претензионный\\s+порядок"
        - "(?i)строительно.техническ.*экспертиз"
        - "(?i)совместное\\s+обследование"

  - id: "construction_site_safety"
    name: "Охрана труда и безопасность на строительной площадке (ТК РФ)"
    description: "Подрядчик несёт ответственность за безопасность работ на площадке. Несчастный случай без соответствующего регулирования — неограниченная ответственность перед работниками и третьими лицами"
    legal_base: "Трудовой кодекс РФ; Правила охраны труда в строительстве"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "охрана труда"
        - "безопасность на строительной площадке"
        - "несчастный случай"
        - "ответственность за безопасность"
        - "инструктаж"
        - "средства защиты"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)подрядчик.*обеспечивает.*безопасность.*работ"
        - "(?i)охрана.*труда.*на\\s+объекте"

  - id: "materials_supply_responsibility"
    name: "Обеспечение строительства материалами и оборудованием (ст. 745 ГК РФ)"
    description: "Обязанность по обеспечению материалами может быть возложена на любую из сторон. Риск качества материалов — на той стороне, которая их предоставляет"
    legal_base: "ст. 745 ГК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "материалы обеспечивает подрядчик"
        - "материалы предоставляет заказчик"
        - "давальческие материалы"
        - "оборудование заказчика"
        - "ответственность за качество материалов"
        - "приёмка материалов"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)ст\\.?\\s*745\\s+ГК\\s+РФ"
        - "(?i)(материал|оборудование).*(обеспечивает|предоставляет).*(подрядчик|заказчик)"
    extraction:
      enabled: true
      mode: "rules"
      fields:
        - name: "materials_provider"
          type: "string"
          allowed_values: ["contractor", "customer", "mixed", "not_specified", "not_found"]
          keyword_hints: ["материалы подрядчика", "материалы заказчика", "иждивение"]
          description: "Кто обеспечивает строительство материалами"
      store_payload: true

  - id: "commissioning_and_operating_permit"
    name: "Ввод объекта в эксплуатацию и разрешение на ввод (ст. 55 ГрадК РФ)"
    description: "Завершённое строительство оформляется разрешением на ввод в эксплуатацию (ст. 55 ГрадК РФ). Без него объект юридически не существует. Важно определить, кто несёт расходы и ответственность"
    legal_base: "ст. 55 Градостроительного кодекса РФ; ст. 753 ГК РФ"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "разрешение на ввод в эксплуатацию"
        - "ввод объекта в эксплуатацию"
        - "акт ввода в эксплуатацию"
        - "получение разрешения на ввод"
        - "передача объекта"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)разрешени.*на.*ввод.*в\\s+эксплуатацию"
        - "(?i)ст\\.?\\s*55\\s+Градостроительного\\s+кодекса"

  - id: "inflation_price_adjustment_mechanism"
    name: "Механизм индексации цены при длительных сроках строительства"
    description: "При длительном строительстве (1-5+ лет) инфляция и изменение цен на материалы существенно влияют на рентабельность. Без механизма индексации подрядчик несёт убытки"
    legal_base: "ст. 744, 709 ГК РФ"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
      any: ["milestone_schedule_present"]
    rules:
      keywords:
        - "индексация цены"
        - "корректировка стоимости"
        - "изменение цен на материалы"
        - "инфляционная корректировка"
        - "актуализация сметы"
        - "ценовые индексы"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)индексаци.*цен"
        - "(?i)ценов.*индекс"

  - id: "termination_grounds_settlement"
    name: "Расторжение: основания, взаиморасчёты, право одностороннего отказа (ст. 715, 717 ГК РФ)"
    description: "Чёткие основания расторжения и порядок взаиморасчётов — ключевые условия при многомиллиардных контрактах. Без регулирования — длительные судебные разбирательства"
    legal_base: "ст. 715, 717, 723 ГК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "расторжение договора"
        - "право на односторонний отказ"
        - "возмещение понесённых расходов"
        - "компенсация упущенной выгоды"
        - "взаиморасчёты при расторжении"
        - "передача объекта в незавершённом виде"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)расторж(ение|ении)\\s+договора"
        - "(?i)ст\\.?\\s*(715|717)\\s+ГК\\s+РФ"
        - "(?i)объект.*в.*незавершённом.*виде"

  - id: "parties_identification"
    name: "Стороны договора: идентификация заказчика и подрядчика"
    description: "Проверяет наличие и достаточность идентификации сторон, полномочия подписантов"
    legal_base: "ст. 432, 740 ГК РФ"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "заказчик"
        - "подрядчик"
        - "генподрядчик"
        - "именуем"
        - "в лице"
        - "действующего на основании"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(заказчик|подрядчик|генподрядчик).*именуем"
    extraction:
      enabled: true
      mode: "rules"
      fields:
        - name: "customer_type"
          type: "string"
          allowed_values: ["legal_entity", "state_entity", "individual", "unclear"]
          keyword_hints: ["ООО", "ПАО", "АО", "государственное", "муниципальное", "застройщик"]
          description: "Тип заказчика"
        - name: "contractor_type"
          type: "string"
          allowed_values: ["legal_entity", "individual", "unclear"]
          keyword_hints: ["ООО", "ПАО", "АО", "ИП", "генподрядчик"]
          description: "Тип подрядчика"
      store_payload: true

  - id: "confidentiality_nda"
    name: "Конфиденциальность и неразглашение (ФЗ-98)"
    description: "Проверяет наличие условий о конфиденциальности проектной документации и условий договора"
    legal_base: "ФЗ № 98-ФЗ «О коммерческой тайне»"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "конфиденциальность"
        - "неразглашение"
        - "коммерческая тайна"
        - "не раскрывать третьим лицам"
        - "режим конфиденциальности"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)конфиденциал"
        - "(?i)не\\s+разглаш"

  - id: "assignment_restriction"
    name: "Уступка прав / перевод долга: ограничения"
    description: "Проверяет ограничения на уступку прав и перевод долга"
    legal_base: "ГК РФ"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "уступка"
        - "переуступка"
        - "перевод долга"
        - "без согласия"
        - "с согласия другой стороны"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)уступк(а|и).*прав"
        - "(?i)перевод\\s+долга"

  - id: "anticorruption_clause"
    name: "Антикоррупционная оговорка"
    description: "Проверяет наличие антикоррупционных заверений"
    legal_base: "ФЗ № 273-ФЗ"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "антикоррупционная оговорка"
        - "противодействие коррупции"
        - "взятка"
        - "коммерческий подкуп"
        - "compliance"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)антикоррупц"
        - "(?i)противодейств.*коррупц"

  - id: "governing_law"
    name: "Применимое право и подсудность"
    description: "Проверяет указание применимого законодательства"
    legal_base: "ГК РФ"
    severity: "low"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "применимое право"
        - "регулируется законодательством"
        - "Российской Федерации"
        - "арбитражный суд"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)законодательств(о|ом)\\s+Российск"

  - id: "incoming_materials_quality_control"
    name: "Входной контроль качества материалов и оборудования (ст. 745, 748 ГК РФ)"
    description: "Проверяет наличие процедуры входного контроля, сертификации материалов, отбраковки"
    legal_base: "ст. 745, 748 ГК РФ; СП 48.13330.2019"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "входной контроль"
        - "сертификат на материалы"
        - "паспорт качества"
        - "протокол испытаний"
        - "качество материалов"
        - "отбраковка"
        - "замена материалов"
        - "согласование замены"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)входн(ой|ого)\\s+контрол"
        - "(?i)сертификат.*на.*материал"
        - "(?i)паспорт.*качеств"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 7: DD_REQUEST_TEMPLATES
#  Читается: DDRequestTemplateLoader
#  Ключи = check_id из checks_v8 и doc_type_checks выше.
#  DDRequestTemplateLoader.render() матчит по exact или prefix.
# ════════════════════════════════════════════════════════════════════════════

dd_request_templates:

  construction_object_description:
    text: >
      Просим подтвердить по {doc_names}: (а) полное наименование объекта строительства;
      (б) адрес/местоположение; (в) кадастровый номер земельного участка;
      (г) основные технико-экономические показатели (площадь, этажность, назначение)
      (ст. 743 ГК РФ, ст. 48 ГрадК РФ). Без чёткого описания — риск признания договора
      незаключённым.
    addressee: "Обе стороны"

  design_documentation_integration:
    text: >
      Просим уточнить в {doc_names}: (а) статус проектной документации — приложение к
      договору или ссылка с реквизитами; (б) прошла ли ПД государственную экспертизу
      (ст. 49 ГрадК РФ) — номер и дата заключения; (в) наличие разрешения на
      строительство (ст. 51 ГрадК РФ). Без утверждённой ПД невозможен ввод объекта.
    addressee: "Заказчик"

  contract_price_and_estimate:
    text: >
      Просим уточнить в {doc_names}: (а) итоговую цену договора цифрами и прописью;
      (б) тип сметы — твёрдая или приблизительная; (в) включает ли цена НДС;
      (г) смета как приложение (ст. 746, 709 ГК РФ).
    addressee: "Обе стороны"

  construction_start_and_end_dates:
    text: >
      Просим указать в {doc_names} конкретные даты начала и окончания работ (ст. 708, 740
      ГК РФ). Размытые формулировки («в течение разумного срока», «по готовности проекта»)
      существенно осложняют взыскание неустойки при просрочке.
    addressee: "Обе стороны"

  calendar_plan_and_milestones:
    text: >
      Просим предоставить/приложить к {doc_names} календарный план (график производства
      работ) с промежуточными вехами и датами завершения этапов (ст. 708 ГК РФ).
      Особенно критично при этапном строительстве, пусковых комплексах и очередях.
    addressee: "Подрядчик"

  customer_site_and_permits_obligations:
    text: >
      Просим подтвердить по {doc_names}: (а) наличие и статус прав на земельный участок
      (собственность/аренда); (б) кто получает разрешение на строительство и в какие сроки;
      (в) технические условия подключения к инженерным сетям (ст. 747 ГК РФ).
      Отсутствие прав на землю — основание для немедленной приостановки работ.
    addressee: "Заказчик"

  technical_supervision_right:
    text: >
      Просим уточнить в {doc_names}: (а) объём права на технический надзор и строительный
      контроль; (б) доступ представителя заказчика на площадку; (в) право отбора проб и
      образцов; (г) ведение журнала строительного контроля (ст. 748 ГК РФ).
      Условие о невмешательстве в хоздеятельность подрядчика (ст. 748 п. 3).
    addressee: "Заказчик"

  acceptance_procedure_ks2_ks3:
    text: >
      Просим уточнить в {doc_names}: (а) форматы актов — КС-2 и КС-3 или эквивалентные;
      (б) срок для подписания акта или предъявления мотивированного отказа;
      (в) механизм одностороннего подписания при уклонении (ст. 753 ГК РФ);
      (г) порядок рассмотрения возражений. Одностороннее подписание — ключевой инструмент
      подрядчика для взыскания оплаты.
    addressee: "Обе стороны"

  hidden_works_certification:
    text: >
      Просим предусмотреть в {doc_names}: (а) перечень работ, подлежащих освидетельствованию
      как скрытые; (б) срок вызова представителя заказчика для освидетельствования;
      (в) последствия неявки — право подписать акт односторонне; (г) ссылку на СП
      48.13330.2019. Без актов освидетельствования — риск дорогостоящего вскрытия.
    addressee: "Подрядчик"

  subcontracting_rights_and_responsibility:
    text: >
      Просим уточнить в {doc_names}: (а) право привлечения субподрядчиков и нужно ли
      согласование заказчика; (б) перечень ключевых субподрядчиков как приложение;
      (в) ответственность генподрядчика за работу субподрядчиков (ст. 706 ГК РФ);
      (г) право заказчика отклонить субподрядчика при наличии разумных оснований.
    addressee: "Подрядчик"

  sro_membership_requirement:
    text: >
      Просим подтвердить по {doc_names}: (а) членство подрядчика в СРО в области
      строительства; (б) наличие допуска к соответствующим видам работ; (в) срок действия
      свидетельства (ст. 55.8 ГрадК РФ; 315-ФЗ). Работы без допуска — административная
      ответственность и риск приостановки строительства.
    addressee: "Подрядчик"

  insurance_construction_risks:
    text: >
      Просим уточнить в {doc_names}: (а) кто и в какой срок оформляет страхование
      строительных рисков; (б) страховые суммы (объект, ГО, несчастные случаи);
      (в) выгодоприобретатель; (г) порядок предоставления полиса заказчику (ст. 742
      ГК РФ). Отсутствие страхования — катастрофические риски при гибели объекта или
      несчастном случае.
    addressee: "Подрядчик"

  warranty_period_and_defect_procedure:
    text: >
      Просим уточнить в {doc_names}: (а) гарантийный срок на объект (не менее 5 лет по
      ст. 756 ГК РФ) и на инженерные сети (не менее 2 лет); (б) порядок предъявления
      претензий по гарантийным случаям; (в) срок устранения недостатков; (г) последствия
      неустранения (право заказчика на независимый ремонт с возмещением расходов).
    addressee: "Обе стороны"

  retention_money_guarantee_deposit:
    text: >
      Рекомендуем предусмотреть в {doc_names} гарантийный депозит (удержание 3-10% от цены)
      до истечения гарантийного срока. Это реальный инструмент стимулирования к устранению
      дефектов: просим согласовать размер удержания, порядок и сроки возврата по истечении
      гарантийного срока (ст. 746 ГК РФ).
    addressee: "Заказчик"

  advance_and_staged_payments:
    text: >
      Просим уточнить в {doc_names}: (а) размер аванса (% от цены); (б) порядок погашения
      аванса из промежуточных платежей; (в) периодичность оплаты по КС-2/КС-3;
      (г) срок оплаты счёта после подписания актов; (д) порядок удержания при авансовой
      гарантии (ст. 711, 746 ГК РФ).
    addressee: "Обе стороны"

  customer_obligations_breach_consequences:
    text: >
      Просим включить в {doc_names}: (а) право подрядчика приостановить работы при
      задержке финансирования или непредоставлении площадки/разрешений (ст. 719 ГК РФ);
      (б) автоматическое продление сроков на период просрочки заказчика; (в) компенсацию
      прямых расходов на простой (аренда техники, оплата рабочих).
    addressee: "Юридический советник подрядчика"

  liquidated_damages_delay_contractor:
    text: >
      Просим уточнить в {doc_names}: (а) ставку неустойки за просрочку сдачи объекта
      (рекомендуется 0.01-0.1% от цены/стоимости этапа за каждый день); (б) максимальный
      размер (cap) неустойки; (в) условие о зачёте неустойки в счёт убытков (ст. 330, 394
      ГК РФ). Срыв сроков влечёт каскадные убытки заказчика.
    addressee: "Обе стороны"

  price_firmness_change_orders:
    text: >
      Просим предусмотреть в {doc_names} обязательный порядок оформления дополнительных
      работ: (а) уведомление заказчика о необходимости (ст. 743 п. 3 ГК РФ); (б) срок
      ответа заказчика; (в) дополнительное соглашение как единственное основание для
      оплаты; (г) право подрядчика на приостановку при неполучении ответа в срок.
    addressee: "Юридический советник"

  risk_distribution_construction:
    text: >
      Просим уточнить в {doc_names}: (а) момент перехода риска случайной гибели к заказчику
      (подписание итогового акта или каждого этапного акта) (ст. 741, 753 ГК РФ);
      (б) страхование рисков гибели объекта в период строительства; (в) режим риска при
      повреждении в период приёмки (промежуток между уведомлением и подписанием акта).
    addressee: "Юридический советник"

  force_majeure_long_term_construction:
    text: >
      Просим уточнить в {doc_names}: (а) перечень форс-мажорных обстоятельств (включая
      погодные условия, санкции, перебои в цепочках поставок); (б) порядок и срок
      уведомления (справка ТПП); (в) последствия — продление сроков пропорционально
      периоду действия; (г) максимальный период действия форс-мажора, после которого
      возникает право на расторжение; (д) компенсация дополнительных расходов подрядчика
      (ст. 401, 416, 417 ГК РФ).
    addressee: "Юридический советник"

  construction_object_and_design_docs_extraction:
    text: >
      Просим подтвердить по {doc_names}: (а) полное наименование и адрес объекта;
      (б) кадастровый номер земельного участка; (в) реквизиты проектной документации
      и заключения экспертизы; (г) номер и дату разрешения на строительство.
    addressee: "Заказчик"

  construction_timeline_and_penalty_risk:
    text: >
      Просим подтвердить по {doc_names}: (а) конкретные даты начала и окончания работ;
      (б) наличие календарного плана с промежуточными вехами; (в) ставку и cap
      неустойки за просрочку; (г) оценку каскадных рисков при срыве сроков.
    addressee: "Обе стороны"

  estimate_type_and_change_order_analysis:
    text: >
      Просим подтвердить по {doc_names}: (а) тип сметы (твёрдая/приблизительная);
      (б) порядок согласования дополнительных работ (ст. 743 ГК РФ);
      (в) механизм пересмотра цены при превышении 10% (ст. 744 ГК РФ);
      (г) форму дополнительного соглашения.
    addressee: "Юридический советник"

  technical_supervision_rights_check:
    text: >
      Просим подтвердить по {doc_names}: (а) объём права заказчика на технический
      надзор (ст. 748 ГК РФ); (б) доступ на площадку; (в) право отбора проб;
      (г) кто осуществляет строительный контроль (заказчик / технический заказчик);
      (д) ведение журнала строительного контроля.
    addressee: "Заказчик"

  warranty_and_hidden_defects_analysis:
    text: >
      Просим подтвердить по {doc_names}: (а) гарантийный срок ≥ 5 лет на объект,
      ≥ 2 лет на инженерные сети (ст. 756 ГК РФ); (б) порядок уведомления
      о скрытых дефектах; (в) срок устранения; (г) размер и порядок возврата
      гарантийного удержания; (д) право заказчика на независимый ремонт с возмещением.
    addressee: "Обе стороны"

  environmental_obligations_check:
    text: >
      Просим включить в {doc_names}: (а) обязанность подрядчика по утилизации
      строительных отходов (лицензированная организация); (б) рекультивацию
      территории после завершения; (в) соблюдение экологических нормативов;
      (г) ответственность за загрязнение (ФЗ-89, ФЗ-7).
    addressee: "Юридический советник"

  ip_rights_construction_documentation:
    text: >
      Просим уточнить в {doc_names}: (а) кому принадлежат права на исполнительную
      документацию и as-built чертежи; (б) передаётся ли BIM-модель и в каком
      формате; (в) вправе ли заказчик использовать документацию для реконструкции
      и расширения без дополнительного согласия подрядчика.
    addressee: "Юридический советник"

  construction_without_permit:
    text: >
      Просим подтвердить по {doc_names}: (а) наличие разрешения на строительство
      (ст. 51 ГрК РФ) — номер, дата, орган выдачи; (б) условие о начале работ
      только после получения разрешения; (в) последствия отсутствия разрешения
      (самовольная постройка — ст. 222 ГК РФ, штрафы по ст. 9.5 КоАП).
    addressee: "Заказчик"

  parties_identification:
    text: >
      Просим подтвердить полные реквизиты сторон по {doc_names}: наименование/ФИО,
      ИНН, ОГРН, адрес, документы уполномоченных лиц, подтверждение полномочий.
    addressee: "Обе стороны"

  confidentiality_nda:
    text: >
      Просим включить в {doc_names}: перечень конфиденциальных сведений,
      срок неразглашения, исключения, ответственность за нарушение.
    addressee: "Юридический советник"

  assignment_restriction:
    text: >
      Просим уточнить в {doc_names}: допустимость уступки прав / перевода долга,
      требуется ли согласие другой стороны.
    addressee: "Юридический советник"

  anticorruption_clause:
    text: >
      Просим включить в {doc_names} антикоррупционную оговорку (ФЗ-273):
      заверения сторон, порядок уведомления, последствия нарушения.
    addressee: "Юридический советник"

  governing_law:
    text: >
      Просим подтвердить в {doc_names} применимое право (законодательство РФ),
      подсудность, язык договора.
    addressee: "Юридический советник"

  incoming_materials_quality_control:
    text: >
      Просим включить в {doc_names}: (а) процедуру входного контроля материалов
      и оборудования; (б) требования к сертификатам/паспортам качества;
      (в) порядок отбраковки и замены; (г) согласование замены материалов
      на аналоги (ст. 745 ГК РФ).
    addressee: "Подрядчик"

  consumer_household_construction_warning:
    text: >
      ВНИМАНИЕ: в {doc_names} заказчиком является гражданин. К договору дополнительно
      применяются правила § 2 Главы 37 ГК РФ (бытовой подряд) и Закон о ЗПП
      (ст. 740 п. 3 ГК РФ). Просим проверить: (а) отсутствие ничтожных условий
      (ст. 16 ЗоЗПП); (б) информирование о свойствах работ; (в) право потребителя
      на отказ в любое время (ст. 717, 731 ГК РФ); (г) подсудность по выбору
      потребителя (ст. 17 ЗоЗПП).
    addressee: "Юридический советник"

  # Generic fallback
  _default:
    text: >
      Просим предоставить дополнительную информацию по вопросу «{check_name}»
      применительно к {doc_names}.
    addressee: "Юридический советник"
