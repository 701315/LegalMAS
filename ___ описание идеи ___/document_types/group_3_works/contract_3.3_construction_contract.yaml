        - "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|тыс|млн|млрд)"
    extraction:
      enabled: true
      mode: "rules"
      fields:
        - name: "contract_price"
          type: "number"
          keyword_hints: ["цена договора", "стоимость работ", "рублей"]
