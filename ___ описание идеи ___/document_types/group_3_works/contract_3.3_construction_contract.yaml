          description: "Строительно-монтажные работы как профильный предмет договора"

        - pattern: "(?i)возведен[иеия]\\s+здани[яй]"
          weight: 0.85
          distinctiveness: high
          context: any
          description: "Возведение здания как результат строительного подряда"

        - pattern: "(?i)капитальн[оеое]\\s+строительств[о]"
          weight: 0.85
          distinctiveness: high
          context: any
          description: "Упоминание капитального строительства"

        - pattern: "(?i)акт\\s+ввод[ауы]\\s+в\\s+эксплуатац[июии]"
          weight: 0.9
          distinctiveness: high
          context: any
          description: "Акт ввода объекта в эксплуатацию"

        - pattern: "(?i)разрешен[иеия]\\s+на\\s+строительств[о]"
          weight: 0.85
          distinctiveness: high
          context: any
          description: "Разрешение на строительство по градостроительному законодательству"

        - pattern: "(?i)проектн[аяое]\\s+документац[ияи]"
          weight: 0.8
          distinctiveness: high
          context: any
          description: "Проектная документация в составе строительного проекта"

        - pattern: "(?i)план\\s+организац[ияи]\\s+строительств[а]"
          weight: 0.8
          distinctiveness: high
          context: any
          description: "План организации строительства (ПОС)"

        - pattern: "(?i)смет[аы]\\s+строительств[а]"
          weight: 0.8
          distinctiveness: high
          context: any
          description: "Строительная смета на объект"

        - pattern: "(?i)\\bСМР\\b"
          weight: 0.85
          distinctiveness: high
          context: any
          description: "Аббревиатура строительно-монтажных работ (СМР)"

        - pattern: "(?i)\\bКС-?2\\b"
          weight: 0.85
          distinctiveness: high
          context: any
          description: "Форма КС-2 — акт приёмки выполненных строительных работ"

        - pattern: "(?i)\\bКС-?3\\b"
          weight: 0.8
          distinctiveness: high
          context: any
          description: "Форма КС-3 — справка о стоимости выполненных строительных работ"

        - pattern: "(?i)генподрядчик"
          weight: 0.8
          distinctiveness: high
          context: any
          description: "Генеральный подрядчик по строительству"

        - pattern: "(?i)исполнительн[ая]\\s+документаци[яи]"
          weight: 0.85
          distinctiveness: high
          context: any
          description: "Исполнительная документация — специфична для строительства"

        - pattern: "(?i)журнал\\s+производства\\s+работ"
          weight: 0.85
          distinctiveness: high
          context: any
          description: "Журнал производства работ — обязательный строительный документ"

        - pattern: "(?i)акт\\s+(приёмки|приема)\\s+выполненных\\s+работ"
          weight: 0.80
          distinctiveness: high
          context: any
          description: "Акт приёмки — специфичен для подряда, в т.ч. строительного"

        - pattern: "(?i)реконструкци[яи]\\s+.{0,60}(нежилого|нежилой|производственн|административн)"
          weight: 0.85
          distinctiveness: high
          context: any
          description: "Реконструкция нежилого здания — строго строительный контекст"

      medium:
        - pattern: "(?i)строительств"
          weight: 0.7
          distinctiveness: medium
          context: any
          description: "Общий термин строительства, встречается и вне подрядных договоров"

        - pattern: "(?i)general\\s+contractor|contractor.{0,20}customer"
          weight: 0.70
          distinctiveness: high
          context: any
          description: "EN-форма: general contractor / contractor+customer — признак EN-версии строительного договора"

        - pattern: "(?i)construction\\s+(work|site|project|agreement)"
          weight: 0.65
          distinctiveness: high
          context: any
          description: "EN-форма строительного контракта"

        - pattern: "(?i)реконструкци[яи]"
          weight: 0.65
          distinctiveness: medium
          context: any
          description: "Реконструкция объекта, может присутствовать и в других типах документов"

        - pattern: "(?i)монтажн[ыо]е\\s+работ[ыа]"
          weight: 0.6
          distinctiveness: medium
          context: any
          description: "Монтажные работы — характерны для строительства, но не уникальны"

        - pattern: "(?i)пусконаладочн[ыо]е\\s+работ[ыа]"
          weight: 0.6
          distinctiveness: medium
          context: any
          description: "Пусконаладочные работы при запуске объекта"

        - pattern: "(?i)техническ[иоя]+\\s+надзор"
          weight: 0.6
          distinctiveness: medium
          context: any
          description: "Технический надзор за строительством"

        - pattern: "(?i)скрыт[ыо]е\\s+работ[ыа]"
          weight: 0.6
          distinctiveness: medium
          context: any
          description: "Скрытые работы — важный элемент строительного контроля"

        - pattern: "(?i)гарантийн[ыо]е\\s+обязательств[аа]"
          weight: 0.55
          distinctiveness: medium
          context: any
          description: "Гарантийные обязательства по качеству строительных работ"

        - pattern: "(?i)техническ[иоя]+\\s+заказчик"
          weight: 0.6
          distinctiveness: medium
          context: any
          description: "Технический заказчик как участник строительного проекта"

        - pattern: "(?i)акт\\s+освидетельствовани[яя]"
          weight: 0.6
          distinctiveness: medium
          context: any
          description: "Акт освидетельствования скрытых или ответственных конструкций"

        - pattern: "(?i)\\bсубподрядчик\\b"
          weight: 0.55
          distinctiveness: medium
          context: any
          description: "Субподрядчик в строительстве, важен, но не уникален"

      low:
        - pattern: "(?i)объект\\s+недвижимост[ии]"
          weight: 0.3
          distinctiveness: low
          context: any
          description: "Объект недвижимости как результат строительства"

        - pattern: "(?i)рабоч[а-яё]+\\s+документаци[яи]"
          weight: 0.25
          distinctiveness: low
          context: any
          description: "Рабочая документация — более общий технический термин"

        - pattern: "(?i)строительн[а-яё]+\\s+площадк[аи]"
          weight: 0.3
          distinctiveness: low
          context: any
          description: "Строительная площадка, может встречаться и в иных документах"

        - pattern: "(?i)\\bСРО\\b"
          weight: 0.25
          distinctiveness: low
          context: any
          description: "Саморегулируемая организация в строительстве"

    exclusions:
