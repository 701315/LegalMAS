    name: "Начальный и конечный сроки — существенные условия (ст. 708, 740 ГК РФ)"
    description: "Конкретные даты начала и окончания работ. Размытые сроки существенно усложняют взыскание неустойки"
    legal_base: "ст. 708, 740 ГК РФ"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
