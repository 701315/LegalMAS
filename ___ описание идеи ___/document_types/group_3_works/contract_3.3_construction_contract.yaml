doc_type_checks:

  - id: "construction_object_description"
    name: "Описание объекта строительства (ст. 743 ГК РФ, ст. 48 ГрадК РФ)"
    description: "Наименование, адрес, кадастровый номер участка, основные технико-экономические показатели. Без чёткого описания договор может быть признан незаключённым"
    legal_base: "ст. 743 ГК РФ; ст. 48 Градостроительного кодекса РФ"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "объект строительства"
        - "наименование объекта"
        - "адрес объекта"
        - "кадастровый номер"
        - "технико-экономические показатели"
        - "здание"
        - "сооружение"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)объект.*капитального.*строительства"
        - "(?i)\\d{2}:\\d{2}:\\d{6,7}:\\d+"

