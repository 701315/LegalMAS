    name: "Проектная документация как приложение (ст. 743 ГК РФ)"
    description: "ПД должна быть приложением к договору или содержать реквизиты утверждения и ссылку на экспертизу. Без утверждённой ПД невозможно получить разрешение на строительство и ввод в эксплуатацию"
    legal_base: "ст. 743 ГК РФ; ст. 49, 51 Градостроительного кодекса РФ"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "проектная документация"
        - "рабочая документация"
        - "техническое задание"
        - "чертежи"
        - "технические условия"
        - "является неотъемлемой частью договора"
        - "положительное заключение экспертизы"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(проектн|рабоч).*документаци.*прилагается"
        - "(?i)приложение.*№.*проектная.*документация"
    extraction:
      enabled: true
      mode: "rules"
      fields:
        - name: "docs_status"
          type: "string"
          allowed_values: ["attached", "referenced", "absent", "not_found"]
          keyword_hints: ["является приложением", "прилагается", "указана в приложении"]
          description: "Статус проектной документации в договоре"
      store_payload: true

