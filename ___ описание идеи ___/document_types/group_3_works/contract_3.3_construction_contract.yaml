# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 3: SHARED PATTERNS
#  Читается: DocTypeCheckLoader через _resolve_yaml_templates()
# ════════════════════════════════════════════════════════════════════════════

shared_patterns:

  money_amount: "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|тыс|млн|млрд)"
  date_pattern: "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"
  date_period: "(?i)(не\\s+позднее|в\\s+течение)\\s+\\d+\\s*(календарн|рабоч|дн)"
  percent_pattern: "(?i)\\b\\d+([,.]\\d+)?\\s*%\\s*(в\\s+(день|месяц|год|квартал))?"
  ks2_ks3_pattern: "(?i)(КС-2|форма.*КС-2|акт.*о.*при[её]мк[ееи].*выполненн[ыо]х.*работ)"
  sro_pattern: "(?i)(СРО|саморегулируемая\\s+организация|свидетельств[оа].*о.*допуске)"
  cadastral_pattern: "(?i)(кадастров[а-яё]+\\s+номер|\\b\\d{2}:\\d{2}:\\d{6,7}:\\d+\\b)"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: COMPLIANCE RULES
#  Читается: DocTypeCheckLoader._exclusion_logic_to_checks()
# ════════════════════════════════════════════════════════════════════════════

compliance_rules:

  - id: "design_works_only_disqualification"
    name: "Дисквалификация: только проектные/изыскательские работы (не строительный подряд)"
    description: |
      Договор строительного подряда предполагает создание овеществлённого объекта —
      здания, сооружения или выполнение строительных работ (ст. 740 ГК РФ).
      Договор на выполнение только ПИР (проектных и изыскательских работ) — отдельный
      вид (§ 4 Главы 37 ГК РФ, ст. 758-762). Строительный подряд к нему не применяется.
    legal_base: "ст. 740, 758 ГК РФ"
    required_triggers: ["design_works_only"]
    severity: "critical"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      keywords:
        - "проектные работы"
        - "изыскательские работы"
        - "ПИР"
        - "только проектирование"
        - "проектно-изыскательские работы"
      keyword_mode: "any"
    retrieval:
      context_k: 4
      boost_keywords:
        - "предмет договора"
        - "проектные работы"
        - "строительные работы"
      rerank: true

  - id: "consumer_household_construction_warning"
    name: "Строительство для гражданина-потребителя: дополнительное применение § 2 Главы 37 и ЗоЗПП (ст. 740 п. 3 ГК РФ)"
    description: |
      Если заказчик — гражданин, заказывающий строительные работы для личных нужд,
      договор остаётся строительным подрядом (§ 3 Главы 37), но дополнительно
      применяются правила § 2 (бытовой подряд) о правах заказчика и Закон о ЗПП
      (ст. 740 п. 3 ГК РФ). Ничтожны условия, ухудшающие положение потребителя.
    legal_base: "ст. 740 п. 3 ГК РФ; ст. 730 ГК РФ; Закон РФ от 07.02.1992 № 2300-1"
    required_triggers: ["consumer_as_customer"]
    severity: "critical"
    result_if_triggered: "warning"
    detector_type: "rules"
    rules:
      keywords:
        - "гражданин"
        - "потребитель"
        - "для личных нужд"
        - "для бытовых нужд"
        - "физическое лицо"
      keyword_mode: "any"
    retrieval:
      context_k: 4
      boost_keywords:
        - "заказчик"
        - "физическое лицо"
        - "для личных нужд"
        - "потребитель"
      rerank: true

  - id: "unauthorized_additional_works"
    name: "Несогласованные дополнительные работы без письменного одобрения заказчика (ст. 743 ГК РФ)"
    description: |
      Подрядчик, обнаружив необходимость дополнительных работ, обязан немедленно сообщить заказчику
      и ждать его решения (ст. 743 ГК РФ). Выполнение дополнительных работ без согласования
      лишает подрядчика права требовать оплаты и возмещения убытков по ним.
      Критически опасно при твёрдой смете.
    legal_base: "ст. 743 ГК РФ"
    required_triggers: []
    severity: "critical"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      keywords:
        - "выполнено без согласования"
        - "дополнительные работы выполнены самостоятельно"
        - "без предварительного уведомления заказчика"
        - "без письменного согласия заказчика"
      keyword_mode: "any"
      negative_keywords:
        - "с письменного согласия заказчика"
        - "по дополнительному соглашению"
        - "уведомил заказчика"
    retrieval:
      context_k: 5
      boost_keywords:
        - "дополнительные работы"
        - "согласование"
        - "уведомление заказчика"
      rerank: true

  - id: "construction_without_permit"
    name: "Строительство без разрешения на строительство (ст. 51 ГрК РФ)"
    description: |
      Начало строительства объекта капитального строительства без разрешения
      на строительство влечёт признание объекта самовольной постройкой (ст. 222 ГК РФ),
      административную ответственность (ст. 9.5 КоАП РФ) и обязанность сноса.
      Договор должен содержать условие о наличии разрешения до начала работ.
    legal_base: "ст. 51 ГрК РФ; ст. 222 ГК РФ; ст. 9.5 КоАП РФ"
    required_triggers: ["capital_construction_object"]
    severity: "critical"
    result_if_triggered: "warning"
    detector_type: "rules"
    rules:
      keywords:
        - "разрешение на строительство"
        - "до получения разрешения"
        - "без разрешения"
        - "самовольная постройка"
      keyword_mode: "any"
      negative_keywords:
        - "разрешение на строительство получено"
        - "разрешение на строительство №"
        - "разрешение на строительство выдано"
    retrieval:
      context_k: 5
      boost_keywords:
        - "разрешение на строительство"
        - "начало работ"
        - "ст. 51 ГрК"
      rerank: true

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 5: CHECKS_V8 — LLM/hybrid проверки
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  - id: construction_object_and_design_docs_extraction
    name: "Объект строительства и проектная документация (ст. 740, 743, 748 ГК РФ)"
    description: "Извлекает описание объекта, его местоположение, ссылки на проектную и рабочую документацию. Отсутствие чёткого описания объекта или ПД → риск признания договора незаключённым"
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "объект капитального строительства"
        - "проектная документация"
        - "рабочая документация"
        - "наименование объекта"
        - "адрес объекта"
        - "техническое задание"
        - "кадастровый номер"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)объект.*капитального.*строительства"
        - "(?i)(проектн|рабоч).*документаци"
        - "(?i)\\d{2}:\\d{2}:\\d{6,7}:\\d+"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор строительного подряда (§ 3 Главы 37 ГК РФ).
        Извлеки сведения об объекте строительства и проектной документации.

        Ответь строго в JSON:
        {
          "object_name": "<наименование объекта или not_found>",
          "object_address": "<адрес/местоположение или not_found>",
          "cadastral_number": "<кадастровый номер участка или not_found>",
          "design_docs_referenced": "<yes / partial / no / not_found>",
          "design_docs_approval": "<утверждена / не указано / not_found>",
          "expertise_passed": "<yes / no / not_mentioned / not_found>",
          "construction_permit_mentioned": "<yes / no / not_found>",
          "object_snippet": "<цитата из договора или not_found>"
        }

        - "design_docs_referenced": "yes" — ПД прямо упоминается или является приложением;
        - "expertise_passed": прошла ли ПД государственную экспертизу (ст. 49 ГрадК РФ).

        ВАЖНО: Если значение явно не указано в тексте — пиши "not_found".
      prompt_file: null
      context_k: 7
      temperature: 0.0
      max_tokens: 600
    retrieval:
      context_k: 7
      max_chunks: 10
      boost_keywords:
        - "предмет договора"
        - "объект строительства"
        - "проектная документация"
        - "кадастровый номер"
        - "разрешение на строительство"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 60
      max_snippet_length: 700
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "object_name"
          type: "string"
          keyword_hints: ["объект", "наименование", "здание", "сооружение"]
          description: "Наименование объекта строительства"
        - name: "design_docs_referenced"
          type: "string"
          allowed_values: ["yes", "partial", "no", "not_found"]
          description: "Наличие ссылки на проектную документацию"
        - name: "expertise_passed"
          type: "string"
          allowed_values: ["yes", "no", "not_mentioned", "not_found"]
          description: "Пройдена ли государственная экспертиза ПД"
      store_payload: true

  - id: construction_timeline_and_penalty_risk
    name: "Сроки строительства, календарный план и риск каскадных убытков (ст. 708, 740 ГК РФ)"
    description: "Проверяет наличие конкретных дат начала/окончания, промежуточных вех. Срыв сроков в строительстве влечёт каскадные убытки — потеря коммерческой выгоды, штрафы перед конечными покупателями, рост стоимости кредита"
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "срок начала работ"
        - "срок окончания работ"
        - "календарный план"
        - "график производства работ"
        - "не позднее"
        - "в течение"
        - "этапы строительства"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"
        - "(?i)(не\\s+позднее|в\\s+течение)\\s+\\d+\\s*(календарн|рабоч|дн)"
        - "(?i)календарн.*план|график.*работ"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор строительного подряда.
        Проверь сроки выполнения работ и оцени риск каскадных убытков при просрочке.

        Ответь строго в JSON:
        {
          "start_date": "<дата начала или not_found>",
          "end_date": "<дата окончания или not_found>",
          "calendar_plan_attached": "<yes / referenced / no / not_found>",
          "intermediate_milestones": "<yes / no / not_found>",
          "deadlines_specific": "<yes / vague / not_found>",
          "penalty_for_delay_present": "<yes / no / not_found>",
          "penalty_rate": "<ставка неустойки или not_found>",
          "deadline_snippet": "<цитата из договора или not_found>"
        }

        - "deadlines_specific": "yes" — конкретные даты; "vague" — размытые формулировки.
        - "calendar_plan_attached": "yes" — приложен к договору; "referenced" — есть ссылка.

        ВАЖНО: Если значение явно не указано — пиши "not_found".
      prompt_file: null
      context_k: 6
      temperature: 0.0
      max_tokens: 500
    retrieval:
      context_k: 6
      max_chunks: 8
