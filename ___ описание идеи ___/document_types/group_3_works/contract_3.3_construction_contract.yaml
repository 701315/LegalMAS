    name: "Цена договора (смета) — существенное условие (ст. 746 ГК РФ)"
    description: "Цена определяется твёрдой суммой или через смету. Смета является неотъемлемой частью договора"
    legal_base: "ст. 746, 709 ГК РФ"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "цена договора"
        - "стоимость работ"
        - "смета"
        - "сметная стоимость"
        - "рублей"
        - "вознаграждение"
      keyword_mode: "any"
