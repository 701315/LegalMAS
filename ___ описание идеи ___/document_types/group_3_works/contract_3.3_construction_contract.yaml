        severity: hard
        weight: -1.0
        description: "Текущий ремонт без изменения конструкций — эксплуатационный, а не строительный договор"

      - pattern: "(?i)договор\\s+на\\s+выполнени[ея]\\s+проектн[ыо]х\\s+и\\s+изыскательск[иие]+\\s+работ"
        severity: hard
        weight: -1.0
        description: "Проектные и изыскательские работы относятся к contract_3.4_design_survey"

      - pattern: "(?i)\\bПИР\\b"
        severity: hard
        weight: -1.0
        description: "ПИР — проектно-изыскательские работы, отдельный тип договора"

      - pattern: "(?i)договор\\s+бытов[оа]го\\s+подряд[аа]"
        severity: hard
        weight: -1.0
        description: "Бытовой подряд с потребителем — это contract_3.2_service_contract"

      - pattern: "(?i)договор\\s+долев[оа]го\\s+участи[яя]\\s+в\\s+строительств[ее]"
        severity: hard
        weight: -1.0
        description: "ДДУ — отдельный тип contract_3.6_off_plan_contract"

      - pattern: "(?i)\\b214-ФЗ\\b"
        severity: hard
        weight: -1.0
        description: "214‑ФЗ однозначно указывает на договор участия в долевом строительстве"

      - pattern: "(?i)\\bНИОКР\\b"
        severity: hard
        weight: -1.0
        description: "НИОКР — договор исследовательских и опытно-конструкторских работ, не строительный подряд"

      - pattern: "(?i)научно-исследовательск[иие]+\\s+работ[ыа]"
        severity: hard
        weight: -1.0
        description: "Научно‑исследовательские работы относятся к contract_3.5_research_development"

      - pattern: "(?i)договор\\s+купл[ии]-?продаж[ии]\\s+недвижимост[ии]"
        severity: hard
        weight: -1.0
        description: "Купля‑продажа недвижимости — договор отчуждения, а не строительный подряд"

      - pattern: "(?i)договор\\s+аренд[ыа]"
        severity: hard
        weight: -1.0
        description: "Аренда — договор пользования, а не выполнения строительных работ"

      # ── Soft exclusions

      - pattern: "(?i)возмездн[оа]е\\s+оказани[ея]\\s+услуг"
        severity: soft
        weight: -0.35
        description: "Формула договора услуг без указания на объект строительства"

      - pattern: "(?i)техническ[оа]е\\s+обслуживани[ея]"
        severity: soft
        weight: -0.35
        description: "Техническое обслуживание — эксплуатационный режим, не новое строительство"

      - pattern: "(?i)\\bклининг\\b"
        severity: soft
        weight: -0.35
        description: "Клининг — услуги по уборке, не связаны с капитальным строительством"

