trigger_definitions:

  interest_bearing_loan:
    any_keywords:
      - "(?i)\\bпроцент[ыаов]?\\b"
      - "(?i)процентн[а-яё]+\\s+ставк[аа]"
      - "(?i)%\\s*годовых"
      - "(?i)вознаграждени[ея]\\s+за\\s+пользовани[ея]\\s+за[йеё]м[оа]м"

  interest_free_loan:
