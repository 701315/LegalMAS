      - "(?i)перечислени[ея]"
      - "(?i)платежн[оеая]\\s+поручени[ея]"
      - "(?i)на\\s+расч[её]тн[ыо]й\\s+сч[её]т"
      - "(?i)банковск[иоя]+\\s+перевод"

  foreign_currency_reference:
