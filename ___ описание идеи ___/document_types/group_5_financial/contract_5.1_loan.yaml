# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 6: DOC_TYPE_CHECKS — авто-конвертируемые проверки (rules)
#  Читается: DocTypeCheckConverter
# ════════════════════════════════════════════════════════════════════════════

doc_type_checks:

  - id: "loan_amount_required"
    name: "Сумма займа / количество вещей"
    description: "Проверяет наличие суммы денежного займа либо количества вещей, определенных родовыми признаками"
    legal_base: "ст. 807 ГК РФ"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "сумма займа"
        - "в размере"
        - "количество"
        - "денежные средства"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)сумм[ауы]\\s+за[её]ма"
        - "(?i)в\\s+размере\\s+\\d"
        - "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|коп|тыс|млн|млрд)\\b"

  - id: "repayment_obligation_required"
    name: "Обязанность заемщика возвратить предмет займа"
    description: "Проверяет наличие прямой обязанности заемщика возвратить сумму займа или вещи того же рода и качества"
    legal_base: "ст. 807, 810 ГК РФ"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "обязуется возвратить"
        - "возвратить сумму займа"
        - "вернуть займ"
        - "возврат займа"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)обязуетс[яь]\\s+возврат"
        - "(?i)возврат\\s+сумм[ыы]\\s+за[её]ма"

  - id: "transfer_confirmation_required"
    name: "Подтверждение передачи предмета займа"
    description: "Проверяет наличие формулировок или документов, подтверждающих фактическую передачу займа"
    legal_base: "ст. 808, 812 ГК РФ"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "переданы"
        - "получены"
        - "расписка"
        - "платежное поручение"
        - "акт передачи"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(передан|получен).{0,30}(денежн|сумм|за[её]м)"
        - "(?i)расписк|платежн(ое|ого)\\s+поручени"

  - id: "interest_terms_required_for_commercial_parties"
    name: "Проценты или беспроцентность: обязательная ясность для коммерческих сторон"
    description: "Проверяет урегулирование процентности займа при участии коммерческих субъектов"
    legal_base: "ст. 809 ГК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
      any: ["commercial_parties"]
    rules:
      keywords:
        - "проценты"
        - "процентная ставка"
        - "беспроцентный"
        - "% годовых"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)процентн(ая|ой)\\s+ставк"
        - "(?i)беспроцентн"
        - "(?i)\\b\\d+(?:[.,]\\d+)?\\s*%\\b"

  - id: "repayment_term_check"
    name: "Срок возврата займа"
    description: "Проверяет наличие срока возврата либо конструкции возврата по требованию"
    legal_base: "ст. 810 ГК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "срок возврата"
        - "не позднее"
        - "по требованию"
        - "в течение"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)срок\\s+возврат"
        - "(?i)по\\s+требован"
        - "(?i)(не\\s+позднее|в\\s+течение)\\s+\\d+"

  - id: "late_payment_penalty"
    name: "Неустойка/проценты за просрочку возврата"
    description: "Проверяет наличие санкций за просрочку возврата займа"
    legal_base: "ст. 330, 395, 811 ГК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "неустойка"
        - "пеня"
        - "штраф"
        - "за каждый день просрочки"
        - "проценты за пользование чужими денежными средствами"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)неустойк|пен[яеи]|штраф"
        - "(?i)кажд(ый|ого)\\s+день\\s+просрочк"

  - id: "acceleration_clause"
    name: "Право займодавца требовать досрочного возврата"
    description: "Проверяет наличие права займодавца требовать досрочного возврата при нарушениях"
    legal_base: "ст. 811, 813, 814 ГК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "потребовать досрочного возврата"
        - "всей суммы займа"
        - "при просрочке"
        - "при утрате обеспечения"
        - "при нецелевом использовании"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)потребовать\\s+досрочного\\s+возврата"
        - "(?i)всей\\s+сумм[ыы]\\s+за[её]ма"

  - id: "early_repayment_right"
    name: "Право заемщика на досрочный возврат"
    description: "Проверяет условия досрочного возврата займа заемщиком"
    legal_base: "ст. 810 ГК РФ"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "досрочный возврат"
        - "вернуть досрочно"
        - "без согласия займодавца"
        - "с согласия займодавца"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)досрочн(ый|ого)\\s+возврат"
        - "(?i)без\\s+согласия\\s+займодавц"

  - id: "target_loan_controls"
    name: "Целевой заем: контроль использования"
    description: "Проверяет наличие цели займа, контроля и последствий нарушения"
    legal_base: "ст. 814 ГК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
      any: ["target_loan"]
    rules:
      keywords:
        - "целевой заем"
        - "целевое использование"
        - "проверять использование"
        - "подтверждающие документы"
        - "нецелевое использование"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)целев(ой|ого)\\s+за[её]м"
        - "(?i)нецелев(ое|ого)\\s+использован"

  - id: "foreign_currency_risk_allocation"
    name: "Валютный заем: курс и порядок пересчета"
    description: "Проверяет наличие курса пересчета и распределения валютных рисков"
    legal_base: "ст. 140, 317 ГК РФ, ФЗ № 173-ФЗ"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
      any: ["foreign_currency_reference"]
    rules:
      keywords:
        - "курс цб рф"
        - "на дату платежа"
        - "валютная оговорка"
        - "доллар"
        - "евро"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)курс\\s+цб\\s*рф"
        - "(?i)на\\s+дату\\s+платежа"
        - "(?i)доллар|евро|usd|eur"

  - id: "repayment_confirmation"
    name: "Подтверждение возврата займа"
    description: "Проверяет наличие механизма подтверждения погашения долга"
    legal_base: "ст. 408, 810 ГК РФ"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "расписка в получении"
        - "подтверждение возврата"
        - "акт приема-передачи"
        - "отметка о погашении"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)подтверждени[ея]\\s+возврат"
        - "(?i)отметк[аи]\\s+о\\s+погашен"
        - "(?i)расписк[аи].{0,30}получени"

  - id: "tax_consequences_disclosure"
    name: "Налоговые последствия беспроцентного/льготного займа"
    description: "Проверяет раскрытие налоговых последствий, включая материальную выгоду, если это уместно"
    legal_base: "НК РФ ст. 212, 224"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
      any: ["interest_free_loan", "related_parties", "individual_parties"]
    rules:
      keywords:
        - "материальная выгода"
        - "ндфл"
        - "налоговые последствия"
        - "экономия на процентах"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)материальн(ая|ой)\\s+выгод"
        - "(?i)экономи[яи]\\s+на\\s+процент"

  - id: "secured_loan_terms"
    name: "Обеспечение займа: залог/поручительство/иное"
    description: "Проверяет наличие и описание обеспечения исполнения обязательства по займу"
    legal_base: "ГК РФ (общие положения об обеспечении)"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
      any: ["secured_loan"]
    rules:
      keywords:
        - "залог"
        - "поручительство"
        - "обеспечение"
        - "ипотека"
        - "залогодатель"
        - "поручитель"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)залог|поручительств|ипотек"

  - id: "related_party_disclosure"
    name: "Раскрытие аффилированности сторон"
    description: "Проверяет раскрытие информации о связанности займодавца и заёмщика"
    legal_base: "Обзор ВС РФ от 29.01.2020, ст. 19 ФЗ-127"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
      any: ["related_parties"]
    rules:
      keywords:
        - "аффилирован"
        - "взаимозависим"
        - "связанные лица"
        - "группа лиц"
        - "не являются аффилированными"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)аффилирован|взаимозависим"
        - "(?i)не\\s+являются\\s+аффилированн"

  - id: "market_terms_warranty"
    name: "Заверение о рыночности условий займа"
    description: "Проверяет наличие заверения о соответствии условий рыночным"
    legal_base: "ст. 105.3 НК РФ, ст. 61.2 ФЗ-127"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
      any: ["related_parties", "commercial_parties"]
    rules:
      keywords:
        - "рыночные условия"
        - "эквивалентность"
        - "соответствует рыночным"
        - "arm's length"
        - "независимые стороны"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)рыночн(ые|ым)\\s+услови"
        - "(?i)эквивалентност"

  - id: "novation_set_off_terms"
    name: "Новация / зачёт: порядок прекращения обязательства"
    description: "Проверяет условия новации или зачёта при наличии таких конструкций"
    legal_base: "ст. 410, 414 ГК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
      any: ["novation_or_set_off"]
    rules:
      keywords:
        - "новация"
        - "зачет"
        - "прекращение обязательства"
        - "замена обязательства"
        - "встречные требования"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)новаци[яи]"
        - "(?i)зачет\\s+встречн"

  - id: "loan_forgiveness_terms"
    name: "Прощение долга: условия и последствия"
    description: "Проверяет условия прощения долга и раскрытие последствий"
    legal_base: "ст. 415 ГК РФ, ст. 250 НК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
      any: ["loan_forgiveness"]
    rules:
      keywords:
        - "прощение долга"
        - "освобождение от обязательства"
        - "отказ от требования"
        - "налоговые последствия"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)прощени[ея]\\s+долг"
        - "(?i)освобожден(ие|ия)\\s+от\\s+обязательств"

  - id: "convertible_loan_terms"
    name: "Конвертируемый заём: условия конвертации"
    description: "Проверяет наличие условий конвертации займа в долю участия"
    legal_base: "ГК РФ, корпоративная практика"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
      any: ["convertible_loan"]
    rules:
      keywords:
        - "конвертируемый заем"
        - "конвертация"
        - "доля в уставном капитале"
        - "увеличение уставного капитала"
        - "опцион"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)конвертируем(ый|ого)"
        - "(?i)конвертац(ия|ии)"

  - id: "fungible_goods_specification"
    name: "Заём вещей: спецификация качества и количества"
    description: "Проверяет определённость предмета займа вещей"
    legal_base: "ст. 807 ГК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
      any: ["fungible_goods_loan"]
    rules:
      keywords:
        - "вещи, определенные родовыми признаками"
        - "качество"
        - "ГОСТ"
        - "спецификация"
        - "того же рода и качества"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)того\\s+же\\s+рода\\s+и\\s+качества"
        - "(?i)ГОСТ|спецификаци"

  - id: "on_demand_notice_period"
    name: "Заём до востребования: срок возврата после требования"
    description: "Проверяет наличие срока для возврата после предъявления требования"
    legal_base: "ст. 810 ГК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
      any: ["on_demand_loan"]
    rules:
      keywords:
        - "по требованию"
        - "до востребования"
        - "в течение 30 дней"
        - "после предъявления требования"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)в\\s+течение\\s+\\d+\\s+дн"
        - "(?i)после\\s+предъявлен"

  - id: "representations_and_warranties"
    name: "Заверения сторон"
    description: "Проверяет наличие заверений о правоспособности, отсутствии споров и банкротства"
    legal_base: "ст. 431.2 ГК РФ"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
      any: ["commercial_parties"]
    rules:
      keywords:
        - "заверения"
        - "гарантии"
        - "заверяет"
        - "гарантирует"
        - "правоспособность"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(займодавец|заемщик).*(заверяет|гарантирует)"

  - id: "governing_law_and_disputes"
    name: "Применимое право и разрешение споров"
    description: "Проверяет наличие арбитражной оговорки"
    legal_base: "ГК РФ, АПК РФ"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "применимое право"
        - "арбитражный суд"
        - "разрешение споров"
        - "подсудность"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)арбитражн(ый|ого)\\s+суд"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 7: DD_REQUEST_TEMPLATES
#  Читается: DDRequestTemplateLoader
#  Ключи = check_id из checks_v8 и doc_type_checks выше.
#  DDRequestTemplateLoader.render() матчит по exact или prefix.
# ════════════════════════════════════════════════════════════════════════════

dd_request_templates:

  loan_subject_extraction:
    text: >
      Просим предоставить по {doc_names}: полные параметры займа —
      займодавец, заемщик, сумма займа, валюта, срок возврата,
      процентная ставка или указание на беспроцентность,
      способ передачи и возврата денежных средств.
    addressee: "Обе стороны"

  loan_amount_required:
    text: >
      Просим уточнить по {doc_names} сумму займа (или количество вещей),
      валюту обязательства и итоговую формулировку предмета займа.
    addressee: "Займодавец"

  repayment_obligation_required:
    text: >
      Просим уточнить в {doc_names} прямую обязанность заемщика возвратить
      сумму займа (или вещи того же рода и качества), а также момент исполнения обязательства.
    addressee: "Юридический советник"

  transfer_evidence_check:
    text: >
      Просим предоставить по {doc_names} доказательства фактической передачи займа:
      расписку заемщика, платежные поручения, банковские выписки, акт передачи
      либо иную документацию, подтверждающую передачу денежных средств.
    addressee: "Займодавец"

  transfer_confirmation_required:
    text: >
      Просим включить/уточнить в {doc_names} положение о фактической передаче суммы займа
      и способе подтверждения такой передачи (расписка, платежное поручение, акт).
    addressee: "Юридический советник"

  no_transfer_evidence_red_flag:
    text: >
      В {doc_names} не выявлено достаточных признаков подтверждения передачи суммы займа.
      Просим срочно предоставить расписку, платежные документы или иные доказательства,
      иначе сохраняется высокий риск спора о безденежности по ст. 812 ГК РФ.
    addressee: "Займодавец / Юридический советник"

  interest_terms_check:
    text: >
      Просим уточнить по {doc_names}: является ли заем процентным или беспроцентным,
      какова ставка, база начисления процентов, периодичность уплаты,
      а также привести пример расчета процентов.
    addressee: "Обе стороны"

  interest_terms_required_for_commercial_parties:
    text: >
      Для {doc_names} с участием коммерческих субъектов просим прямо урегулировать:
      является ли заем процентным или беспроцентным, какова ставка и порядок начисления процентов.
    addressee: "Юридический советник"

  commercial_loan_interest_silence:
    text: >
      В {doc_names} выявлен риск отсутствия ясной оговорки о процентах при коммерческом займе.
      Просим срочно внести в договор прямое условие о процентности либо беспроцентности займа.
    addressee: "Юридический советник"

  repayment_and_acceleration_check:
    text: >
      Просим уточнить в {doc_names}: срок и структуру возврата займа,
      наличие графика погашения, право заемщика на досрочный возврат,
      а также право займодавца требовать досрочного возврата при нарушениях.
    addressee: "Обе стороны"

  repayment_term_check:
    text: >
      Просим уточнить по {doc_names}: конкретную дату возврата займа
      либо порядок возврата по требованию, включая срок исполнения после получения требования.
    addressee: "Обе стороны"

  late_payment_penalty:
    text: >
      Просим уточнить в {doc_names}: какая ответственность применяется
      при просрочке возврата займа и процентов — неустойка, пеня, штраф,
      проценты по ст. 395 ГК РФ или иная санкция.
    addressee: "Юридический советник"

  acceleration_clause:
    text: >
      Просим уточнить по {doc_names}: при каких нарушениях займодавец вправе
      потребовать досрочного возврата всей суммы займа, процентов и санкций.
    addressee: "Юридический советник"

  early_repayment_right:
    text: >
      Просим уточнить в {doc_names}, вправе ли заемщик вернуть заем досрочно,
      требуется ли согласие займодавца и применяются ли штрафные последствия.
    addressee: "Обе стороны"

  target_loan_control_check:
    text: >
      По {doc_names} (целевой заем) просим предоставить:
      точную цель использования средств, перечень подтверждающих документов,
      порядок контроля целевого использования и последствия нарушения цели.
    addressee: "Заемщик / Займодавец"

  target_loan_controls:
    text: >
      Просим включить/уточнить в {doc_names} положения о целевом использовании займа:
      цель, формы контроля, отчетность заемщика и право займодавца на досрочное взыскание
      при нецелевом использовании.
    addressee: "Юридический советник"

  foreign_currency_terms_check:
    text: >
      По {doc_names} с валютным элементом просим предоставить:
      валюту обязательства, источник курса пересчета, дату пересчета,
      механизм возврата и распределение валютных рисков между сторонами.
    addressee: "Обе стороны / Юридический советник"

  foreign_currency_risk_allocation:
    text: >
      Просим уточнить в {doc_names}: курс пересчета, дату определения курса,
      используется ли курс ЦБ РФ, а также кто несет валютный риск при колебаниях курса.
    addressee: "Юридический советник"

  foreign_currency_loan_restriction:
    text: >
      Внимание: в {doc_names} выявлен валютный элемент займа.
      Просим предоставить правовое заключение о допустимости валютной конструкции,
      статусе сторон как резидентов/нерезидентов и соблюдении требований ФЗ-173.
    addressee: "Юридический советник"

  repayment_confirmation:
    text: >
      Просим уточнить по {doc_names}: каким документом подтверждается возврат займа
      (расписка займодавца, акт, банковская выписка, отметка о погашении),
      и когда заемщик считается полностью исполнившим обязательство.
    addressee: "Обе стороны"

  tax_consequences_disclosure:
    text: >
      Просим предоставить по {doc_names} пояснение о налоговых последствиях займа,
      включая возможную материальную выгоду, НДФЛ и иные налоговые эффекты
      для заемщика и займодавца.
    addressee: "Налоговый консультант / Юридический советник"

  secured_loan_terms:
    text: >
      По {doc_names} просим предоставить документы по обеспечению займа:
      договор залога/ипотеки, поручительство, описание обеспеченного обязательства,
      порядок обращения взыскания и основания утраты обеспечения.
    addressee: "Займодавец / Юридический советник"

  loan_amount_missing:
    text: >
      В {doc_names} не выявлена достаточная и однозначная сумма займа.
      Просим срочно уточнить сумму, валюту и точную формулировку предмета займа.
    addressee: "Займодавец / Юридический советник"

  related_party_loan_check:
    text: >
      Просим предоставить по {doc_names}: раскрытие информации об аффилированности
      сторон, заверения о рыночности условий займа, экономическое обоснование сделки
      и документы, подтверждающие деловую цель.
    addressee: "Обе стороны / Юридический советник"

  related_party_disclosure:
    text: >
      Просим уточнить в {doc_names}: являются ли стороны аффилированными/взаимозависимыми,
      и если да — раскрыть характер связи и подтвердить рыночность условий.
    addressee: "Обе стороны"

  related_party_loan_bankruptcy_risk:
    text: >
      В {doc_names} выявлены признаки аффилированности сторон. Просим предоставить:
      заверения о рыночности условий, отсутствии признаков неплатёжеспособности заёмщика,
      деловую цель займа и правовую позицию по риску субординации.
    addressee: "Юридический советник"

  bankruptcy_claw_back_risk_check:
    text: >
      Просим предоставить по {doc_names}: заверения об отсутствии признаков банкротства,
      подтверждение рыночности условий, деловую цель сделки и оценку рисков
      оспаривания по ст. 61.2, 61.3 ФЗ-127.
    addressee: "Юридический советник"

  market_terms_warranty:
    text: >
      Просим включить/уточнить в {doc_names} заверение о том, что условия займа
      соответствуют рыночным и могли бы быть согласованы независимыми сторонами.
    addressee: "Юридический советник"

  convertible_loan_check:
    text: >
      По {doc_names} (конвертируемый заём) просим предоставить: событие конвертации,
      формулу определения доли, кэп оценки или дисконт, порядок корпоративных действий
      и защиту от размытия.
    addressee: "Юридический советник"

  convertible_loan_terms:
    text: >
      Просим уточнить в {doc_names}: условия и порядок конвертации займа в долю,
      включая оценку компании, размер приобретаемой доли и корпоративные решения.
    addressee: "Обе стороны"

  multiple_tranches_check:
    text: >
      По {doc_names} (траншевый заём) просим предоставить: общий лимит,
      порядок запроса транша, условия предоставления (CP), механизм учёта
      и возможность повторного использования.
    addressee: "Займодавец"

  novation_set_off_terms:
    text: >
      Просим уточнить по {doc_names}: условия новации или зачёта,
      какие обязательства прекращаются, какие возникают, и правовые последствия.
    addressee: "Юридический советник"

  loan_forgiveness_terms:
    text: >
      Просим предоставить по {doc_names}: условия прощения долга, налоговые последствия
      для заёмщика (внереализационный доход), риски оспаривания в банкротстве займодавца.
    addressee: "Налоговый консультант / Юридический советник"

  loan_forgiveness_tax_risk:
    text: >
      В {doc_names} выявлено прощение долга. Просим предоставить: расчёт налоговых
      последствий, заверения об отсутствии признаков банкротства займодавца,
      деловую цель сделки.
    addressee: "Налоговый консультант / Юридический советник"

  interest_free_commercial_loan_tax_risk:
    text: >
      В {doc_names} выявлен беспроцентный заём между юрлицами. Просим предоставить:
      налоговое заключение о рисках доначисления по ст. 269 НК РФ,
      обоснование деловой цели, позицию по трансфертному ценообразованию.
    addressee: "Налоговый консультант"

  fungible_goods_specification:
    text: >
      По {doc_names} (заём вещей) просим предоставить: спецификацию качества (ГОСТ, ТУ),
      точное количество, порядок определения качества возвращаемых вещей,
      акт приёма-передачи.
    addressee: "Обе стороны"

  fungible_goods_loan_quality_risk:
    text: >
      В {doc_names} выявлен заём вещей без достаточной спецификации.
      Просим уточнить качество, количество и способ определения соответствия
      возвращаемых вещей.
    addressee: "Юридический советник"

  on_demand_notice_period:
    text: >
      Просим уточнить в {doc_names}: срок возврата займа после предъявления требования,
      форму требования и момент, с которого начинает течь срок.
    addressee: "Обе стороны"

  representations_and_warranties:
    text: >
      Просим включить/уточнить в {doc_names}: заверения сторон о правоспособности,
      отсутствии судебных споров, отсутствии признаков банкротства.
    addressee: "Юридический советник"

  governing_law_and_disputes:
    text: >
      Просим уточнить в {doc_names}: применимое право и компетентный суд
      для разрешения споров.
    addressee: "Юридический советник"

  # Generic fallback
  _default:
    text: >
      Просим предоставить дополнительную информацию по вопросу «{check_name}»
      применительно к {doc_names}.
    addressee: "Юридический советник"
    