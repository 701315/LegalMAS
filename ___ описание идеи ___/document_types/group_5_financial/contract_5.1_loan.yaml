type: contract_5.1_loan
name: "Договор займа"

description: |
  Реальный договор, по которому одна сторона (займодавец) передает или обязуется
  передать в собственность другой стороне (заемщику) деньги или вещи, определенные
  родовыми признаками, а заемщик обязуется возвратить такую же сумму денег
  или равное количество вещей того же рода и качества. Регулируется § 1 Главы 42 ГК РФ.
  На практике ключевыми рисками являются доказанность фактической передачи предмета займа,
  споры о процентах и порядке их начисления, безденежность, валютные ограничения,
  целевой характер займа, досрочный возврат и санкции за просрочку.

version: 4.0
parent: class_5_financial_security

metadata:
  category: contract
  subcategory: financial_security
  complexity: medium
  risk_level: critical
  jurisdiction: RU
  language: ru
  legal_base: "§ 1 Главы 42 ГК РФ (ст. 807-818)"
  doc_types_supported:
    - "договор займа"
    - "договор денежного займа"
    - "договор процентного займа"
    - "договор беспроцентного займа"
    - "договор целевого займа"
    - "расписка о займе"
    - "договор займа между юридическими лицами"
    - "договор займа между физическими лицами"
    - "договор займа между ИП"
    - "договор займа в иностранной валюте"
    - "договор займа вещей, определенных родовыми признаками"
    - "заем учредителя"
    - "договор конвертируемого займа"

    - "loan agreement"
    - "convertible loan agreement"
    - "shareholder loan agreement"
    - "subordinated loan agreement"
    - "intercompany loan agreement"
    - "bridge loan agreement"
    - "mezzanine loan agreement"
    - "demand loan agreement"
    - "promissory note"
    - "loan note instrument"
    - "IOU"
    - "note purchase agreement"
    - "facility agreement"

engine_expectations:
  evidence_required: true
  evidence_style: "pinpoint"
  allow_not_found: true
  output_style: "dd_grid"
  prefer_structured_outputs: true

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 1: КЛАССИФИКАЦИЯ (L1/L2)
#  Читается: YAMLRegistry → L1FilenameClassifier, L2HeaderClassifier
# ════════════════════════════════════════════════════════════════════════════

classification_runtime_v1:

  scoring:
    accept_threshold: 0.8
    strong_signal_threshold: 0.88
    ambiguity_margin: 0.18
    input_quality_weight: 1.0

  rules:

    filename_patterns:
      # Русский — явные договоры займа / расписки

      - pattern: "(?i)договор[_\\s-]*за[её]ма"
        kind: specific_subject
        weight: 1.0
        # Базовое: договор займа

      - pattern: "(?i)договор[_\\s-]*денежн[огоой][_\\s-]*за[её]ма"
        kind: specific_subject
        weight: 0.98

      - pattern: "(?i)договор[_\\s-]*процентн[огоой][_\\s-]*за[её]ма"
        kind: specific_subject
        weight: 0.98

      - pattern: "(?i)договор[_\\s-]*беспроцентн[огоой][_\\s-]*за[её]ма"
        kind: specific_subject
        weight: 0.98

      - pattern: "(?i)договор[_\\s-]*целев[огоой][_\\s-]*за[её]ма"
        kind: specific_subject
        weight: 0.95

      - pattern: "(?i)договор[_\\s-]*за[её]ма[_\\s-]*между[_\\s-]*юридическ[имиими][_\\s-]*лиц[аеи]"
        kind: specific_subject
        weight: 0.95

      - pattern: "(?i)договор[_\\s-]*за[её]ма[_\\s-]*между[_\\s-]*физическ[имиими][_\\s-]*лиц[аеи]"
        kind: specific_subject
        weight: 0.95

      - pattern: "(?i)договор[_\\s-]*за[её]ма[_\\s-]*между[_\\s-]*ИП"
        kind: specific_subject
        weight: 0.95

      - pattern: "(?i)договор[_\\s-]*за[её]ма[_\\s-]*в[_\\s-]*иностранн[ойой][_\\s-]*валют[ееи]"
        kind: specific_subject
        weight: 0.95

      - pattern: "(?i)договор[_\\s-]*за[её]ма[_\\s-]*вещ[ейй][_\\s-]*определенн[ыхые][_\\s-]*родовым[иими][_\\s-]*признакам[иами]"
        kind: specific_subject
        weight: 0.95

      - pattern: "(?i)договор[_\\s-]*конвертируем[огоой][_\\s-]*за[её]ма"
        kind: specific_subject
        weight: 0.98

      - pattern: "(?i)за[её]м[_\\s-]*учредител[яей]"
        kind: specific_subject
        weight: 0.95
        # Заём учредителя

      - pattern: "(?i)расписк[аы][_\\s-]*о[_\\s-]*за[её]ме"
        kind: specific_subject
        weight: 0.98

      - pattern: "(?i)долгова[яэй][_\\s-]*расписк[аы]"
        kind: specific_subject
        weight: 0.95

      - pattern: "(?i)расписк[аы].*получен[ияи][_\\s-]*денежн[ыхые][_\\s-]*средств"
        kind: specific_subject
        weight: 0.9

      # Краткие русские маркеры с уточнением договора/расписки

      - pattern: "(?i)договор[_\\s-]*за[её]м[ауы]"
        kind: specific_subject
        weight: 0.95

      - pattern: "(?i)за[её]м[ауы][_\\s-]*договор"
        kind: specific_subject
        weight: 0.9

      - pattern: "(?i)договор[_\\s-]*займ[ауы]"
        kind: specific_subject
        weight: 0.95

      - pattern: "(?i)расписк[аы]"
        kind: specific_subject
        weight: 0.85
        # Почти всегда долговая расписка, но оставляем немного ниже максимумов

      # Английский — loan agreements / notes / facility

      - pattern: "(?i)loan[_\\s-]*agreement"
        kind: specific_subject
        weight: 1.0

      - pattern: "(?i)convertible[_\\s-]*loan[_\\s-]*agreement"
        kind: specific_subject
        weight: 1.0

      - pattern: "(?i)shareholder[_\\s-]*loan[_\\s-]*agreement"
        kind: specific_subject
        weight: 0.98

      - pattern: "(?i)subordinated[_\\s-]*loan[_\\s-]*agreement"
        kind: specific_subject
        weight: 0.98

      - pattern: "(?i)intercompany[_\\s-]*loan[_\\s-]*agreement"
        kind: specific_subject
        weight: 0.98

      - pattern: "(?i)bridge[_\\s-]*loan[_\\s-]*agreement"
        kind: specific_subject
        weight: 0.95

      - pattern: "(?i)mezzanine[_\\s-]*loan[_\\s-]*agreement"
        kind: specific_subject
        weight: 0.95

      - pattern: "(?i)demand[_\\s-]*loan[_\\s-]*agreement"
        kind: specific_subject
        weight: 0.95

      - pattern: "(?i)promissory[_\\s-]*note"
        kind: specific_subject
        weight: 0.95

      - pattern: "(?i)loan[_\\s-]*note[_\\s-]*instrument"
        kind: specific_subject
        weight: 0.95

      - pattern: "(?i)note[_\\s-]*purchase[_\\s-]*agreement"
        kind: specific_subject
        weight: 0.95

      - pattern: "(?i)facility[_\\s-]*agreement"
        kind: specific_subject
        weight: 0.9
        # В банковской практике — кредитная/займовая линия

      - pattern: "(?i)\\bIOU\\b"
        kind: specific_subject
        weight: 0.9

      # Общие loan/credit/cash — generic/context, чтобы не перехватывать всё подряд

      - pattern: "(?i)loan"
        kind: generic_form
        weight: 0.6
        # Голое 'loan' без agreement/contract – поддерживающий сигнал

      - pattern: "(?i)credit[_\\s-]*facility"
        kind: generic_form
        weight: 0.6

      - pattern: "(?i)за[её]м"
        kind: generic_form
        weight: 0.6
        # Просто 'заём' в имени файла без слова 'договор/расписка' – требует поддержки L2/L3

      - pattern: "(?i)займ"
        kind: generic_form
        weight: 0.6

    folder_patterns:
      - pattern: "(?i)за[её]м[ыы]?"
        kind: specific_subject
        weight: 0.8
        # Папка "займы/займ"

      - pattern: "(?i)займ"
        kind: specific_subject
        weight: 0.8

      - pattern: "(?i)loan[s]?"
        kind: specific_subject
        weight: 0.8

      - pattern: "(?i)intercompany[_\\s-]*loans?"
        kind: specific_subject
        weight: 0.8

      - pattern: "(?i)shareholder[_\\s-]*loans?"
        kind: specific_subject
        weight: 0.8

      - pattern: "(?i)debt"
        kind: context
        weight: 0.4
        # Общий долг, может содержать и облигации/кредиты

      - pattern: "(?i)financing"
        kind: context
        weight: 0.4

    keywords:

      high:
        - pattern: "(?i)займодавец"
          weight: 0.95
          distinctiveness: high
          context: any
          description: "Займодавец как сторона по ст. 807 ГК РФ"

        - pattern: "(?i)заемщик"
          weight: 0.95
          distinctiveness: high
          context: any
          description: "Заемщик как сторона по договору займа"

        - pattern: "(?i)договор\\s+займ[ауы]"
          weight: 1.0
          distinctiveness: high
          context: header
          description: "Общее название договора займа"

        - pattern: "(?i)договор\\s+денежн[огоой]\\s+займ[ауы]"
          weight: 1.0
          distinctiveness: high
          context: header
          description: "Договор денежного займа"

        - pattern: "(?i)договор\\s+процентн[огоой]\\s+займ[ауы]"
          weight: 0.95
          distinctiveness: high
          context: header
          description: "Договор процентного займа"

        - pattern: "(?i)договор\\s+беспроцентн[огоой]\\s+займ[ауы]"
          weight: 0.95
          distinctiveness: high
          context: header
          description: "Беспроцентный договор займа"

        - pattern: "(?i)договор\\s+целев[огоой]\\s+займ[ауы]"
          weight: 0.9
          distinctiveness: high
          context: header
          description: "Целевой заём с указанием цели использования"

        - pattern: "(?i)договор\\s+займ[ауы]\\s+между\\s+юридическ[имиими]\\s+лиц[ами]"
          weight: 0.9
          distinctiveness: high
          context: header
          description: "Заем между юридическими лицами"

        - pattern: "(?i)договор\\s+займ[ауы]\\s+между\\s+физическ[имиими]\\s+лиц[ами]"
          weight: 0.9
          distinctiveness: high
          context: header
          description: "Заем между физическими лицами"

        - pattern: "(?i)договор\\s+займ[ауы]\\s+между\\s+ип\\b"
          weight: 0.9
          distinctiveness: high
          context: header
          description: "Заем с участием индивидуальных предпринимателей"

        - pattern: "(?i)договор\\s+займ[ауы]\\s+в\\s+иностранн[ойой]\\s+валют[еуы]"
          weight: 0.95
          distinctiveness: high
          context: header
          description: "Заем в иностранной валюте (валютные ограничения ст. 140, 141, 317 ГК РФ)"

        - pattern: "(?i)договор\\s+займ[ауы]\\s+вещей,?\\s+определенн[ыхые]\\s+родов[ымиые]\\s+признак[ами]"
          weight: 0.95
          distinctiveness: high
          context: header
          description: "Заем вещей, определённых родовыми признаками"

        - pattern: "(?i)расписк[аыу]\\s+о\\s+займ[ееу]"
          weight: 0.95
          distinctiveness: high
          context: any
          description: "Расписка о получении суммы займа"

        - pattern: "(?i)расписк[аыу]\\b"
          weight: 0.8
          distinctiveness: medium
          context: any
          description: "Долговая расписка, часто подтверждающая передачу суммы займа"

        - pattern: "(?i)сумм[аыу]\\s+займ[ауы]"
          weight: 0.9
          distinctiveness: high
          context: any
          description: "Сумма займа как предмет обязательства"

        - pattern: "(?i)возврат\\s+сумм[ыы]\\s+займ[ауы]"
          weight: 0.9
          distinctiveness: high
          context: any
          description: "Обязанность возврата суммы займа"

        - pattern: "(?i)процент[ыо]\\s+по\\s+займ[уые]"
          weight: 0.9
          distinctiveness: high
          context: any
          description: "Проценты по договору займа"

      medium:
        - pattern: "(?i)целев[оа]й\\s+за[её]м"
          weight: 0.7
          distinctiveness: medium
          context: any
          description: "Упоминание целевого займа в теле документа"

        - pattern: "(?i)беспроцентн[ыо]й\\s+за[её]м"
          weight: 0.7
          distinctiveness: medium
          context: any
          description: "Беспроцентный заём без явного заголовка"

        - pattern: "(?i)процентн[а-яё]+\\s+ставк[аа]"
          weight: 0.65
          distinctiveness: medium
          context: any
          description: "Процентная ставка по сумме займа"

        - pattern: "(?i)досрочн[ыо]й\\s+возврат"
          weight: 0.6
          distinctiveness: medium
          context: any
          description: "Досрочный возврат суммы займа"

        - pattern: "(?i)\\bнеустойк[ааы]\\b"
          weight: 0.5
          distinctiveness: low
          context: any
          description: "Неустойка за просрочку исполнения обязательств по займу"

        - pattern: "(?i)график\\s+погашени[яя]"
          weight: 0.6
          distinctiveness: medium
          context: any
          description: "График погашения займа"

        - pattern: "(?i)\\bтранш\\b"
          weight: 0.55
          distinctiveness: medium
          context: any
          description: "Предоставление займа траншами"

        - pattern: "(?i)валютн[а-яё]+\\s+оговорк[аа]"
          weight: 0.6
          distinctiveness: medium
          context: any
          description: "Валютная оговорка в договоре займа"

        - pattern: "(?i)безденежност[ьи]"
          weight: 0.6
          distinctiveness: medium
          context: any
          description: "Оспаривание действительности займа по мотиву безденежности"

      low:
        - pattern: "(?i)за[её]мн[ыо]е\\s+средств[аа]"
          weight: 0.35
          distinctiveness: low
          context: any
          description: "Упоминание заемных средств"

        - pattern: "(?i)долгов[оа]е\\s+обязательств[оо]"
          weight: 0.3
          distinctiveness: low
          context: any
          description: "Общая ссылка на долговые обязательства"

        - pattern: "(?i)\\bпен[яи]\\b"
          weight: 0.25
          distinctiveness: low
          context: any
          description: "Пеня за просрочку платежей по займу"

        - pattern: "(?i)\\bштраф\\b"
          weight: 0.25
          distinctiveness: low
          context: any
          description: "Штрафные санкции за нарушение условий займа"

        - pattern: "(?i)остат[оа]к\\s+задолженност[ии]"
          weight: 0.3
          distinctiveness: low
          context: any
          description: "Остаток задолженности по сумме займа"

        - pattern: "(?i)материальн[а-яё]+\\s+выгод[аа]"
          weight: 0.25
          distinctiveness: low
          context: any
          description: "Материальная выгода от пользования заемными средствами"

    exclusions:
      - pattern: "(?i)кредитн[ыо]й\\s+договор"
        severity: hard
        weight: -1.0
        description: "Кредитный договор с участием банка/кредитной организации, отдельный тип по Главе 42 ГК РФ"

      - pattern: "(?i)договор\\s+ссуд[ыа]"
        severity: hard
        weight: -1.0
        description: "Ссуда предполагает безвозмездное пользование вещью, а не возврат однородных вещей как при займе"

      - pattern: "(?i)товарн[ыо]й\\s+кредит"
        severity: hard
        weight: -1.0
        description: "Товарный кредит — отдельный договор по ст. 822 ГК РФ, хотя и близок к займу [web:84]"

      - pattern: "(?i)коммерческ[иоя]+\\s+кредит"
        severity: hard
        weight: -1.0
        description: "Коммерческий кредит как акцессорное обязательство к основному договору (поставка/подряд и т.п.) [web:81]"

      # ── Soft exclusions

      - pattern: "(?i)кредитн[ыо]е\\s+соглашени[ея]"
        severity: soft
        weight: -0.3
        description: "Кредитное соглашение может относиться к банковскому кредиту, а не к займу"

      - pattern: "(?i)линия\\s+кредит[аа]"
        severity: soft
        weight: -0.3
        description: "Кредитная линия как банковский продукт"

      - pattern: "(?i)овердрафт"
        severity: soft
        weight: -0.3
        description: "Овердрафт — особый банковский кредитный режим"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 2: ТРИГГЕРЫ
