  consumer_like_borrower:
    any_keywords:
      - "(?i)за[её]мщик\\s*[-—]\\s*физическ[оеая]\\s+лиц[оо]"
      - "(?i)\\bгражданин\\b"
      - "(?i)личн[ыо]е\\s+нужд[ыа]"
      - "(?i)не\\s+связанн[ыо]е\\s+с\\s+предпринимательск[оа]й\\s+деятельност[ьюи]"

  convertible_loan:
    any_keywords:
      - "(?i)конвертируем[ыо]й\\s+за[её]м"
      - "(?i)конвертаци[яи]\\s+в\\s+дол[юьи]"
      - "(?i)прав[оа]\\s+конвертаци[ии]"
      - "(?i)\\bconvertible\\s+loan\\b"
      - "(?i)опцион\\s+на\\s+дол[юьи]"
      - "(?i)в\\s+сч[её]т\\s+оплат[ыы]\\s+дол[ии]"

  novation_or_set_off:
    any_keywords:
      - "(?i)\\bноваци[яи]\\b"
      - "(?i)\\bзач[её]т\\b"
      - "(?i)прекращени[ея]\\s+обязательств[аа]"
      - "(?i)зач[её]т\\s+встречн[ыо]х\\s+требовани[йя]"
      - "(?i)замен[аа]\\s+обязательств[аа]"

  loan_forgiveness:
    any_keywords:
      - "(?i)прощени[ея]\\s+долг[аа]"
      - "(?i)освобождени[ея]\\s+от\\s+обязательств[аа]"
      - "(?i)отказ\\s+от\\s+требовани[яя]"
      - "(?i)\\bдарени[ея]\\b"

  fungible_goods_loan:
    any_keywords:
      - "(?i)вещ[ии],?\\s+определенн[ыо]е\\s+родов[ыо]ми\\s+признак[аа]ми"
      - "(?i)товарн[ыо]й\\s+за[её]м"
      - "(?i)за[её]м\\s+вещ[ее]й"
      - "(?i)того\\s+же\\s+род[аа]\\s+и\\s+качеств[аа]"
      - "(?i)\\bзерн[оо]\\b"
      - "(?i)\\bтоплив[оо]\\b"
      - "(?i)\\bматериал[ыо]\\b"

  promissory_note:
    any_keywords:
      - "(?i)\\bвексел[ья]\\b"
      - "(?i)прост[оа]й\\s+вексел[ья]"
      - "(?i)переводн[оа]й\\s+вексел[ья]"
      - "(?i)вексельн[оа]е\\s+обязательств[оо]"

  multiple_tranches:
    any_keywords:
      - "(?i)\\bтранш\\b"
      - "(?i)\\bчастями\\b"
      - "(?i)поэтапн[оа]е\\s+предоставлени[ея]"
      - "(?i)лимит\\s+за[йеё]м[аа]"
      - "(?i)в\\s+пределах\\s+лимит[аа]"

  on_demand_loan:
    any_keywords:
      - "(?i)по\\s+требовани[юя]"
      - "(?i)до\\s+востребовани[яя]"
      - "(?i)в\\s+течени[еи]\\s+30\\s+дней"
      - "(?i)после\\s+предъявлени[яя]\\s+требовани[яя]"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 3: SHARED PATTERNS
#  Читается: DocTypeCheckLoader через _resolve_yaml_templates()
# ════════════════════════════════════════════════════════════════════════════

shared_patterns:

  money_amount: "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|коп|тыс|млн|млрд)"
  date_pattern: "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"
  percentage_pattern: "(?i)\\b\\d+(?:[.,]\\d+)?\\s*%\\b"
  deadline_pattern: "(?i)(?:в течение|не позднее)\\s+\\d+\\s+(?:календарн|рабоч|банковск|дн|дня|дней)"
  currency_pattern: "(?i)\\b(?:руб|рублей|₽|usd|eur|доллар(?:ов)?|евро)\\b"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: COMPLIANCE RULES
#  Читается: DocTypeCheckLoader._exclusion_logic_to_checks()
# ════════════════════════════════════════════════════════════════════════════

compliance_rules:

  - id: "foreign_currency_loan_restriction"
    name: "Валютные ограничения для займа между резидентами"
    description: "При наличии валютной конструкции необходимо проверить соблюдение правил валютного регулирования"
    legal_base: "ст. 140, 317 ГК РФ, ФЗ № 173-ФЗ"
    required_triggers: ["foreign_currency_reference"]
    severity: "critical"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      keywords:
        - "доллар"
        - "евро"
        - "usd"
        - "eur"
        - "иностранная валюта"
        - "курс цб рф"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "валюта займа"
        - "курс цб"
        - "резидент"
        - "валютное регулирование"
      rerank: true

  - id: "no_transfer_evidence_red_flag"
    name: "Отсутствуют явные признаки передачи суммы займа"
    description: "Для договора займа критично наличие доказательств передачи денег/вещей; иначе возникает риск спора о безденежности"
    legal_base: "ст. 808, 812 ГК РФ"
    required_triggers: []
    severity: "critical"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      negative_keywords:
        - "переданы"
        - "получены"
        - "расписка"
        - "платежное поручение"
        - "зачислены на счет"
        - "акт передачи"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "передача денег"
        - "расписка"
        - "платежное поручение"
        - "получил"
      rerank: true

  - id: "commercial_loan_interest_silence"
    name: "Коммерческий заем без ясного урегулирования процентов"
    description: "Для займов между коммерческими субъектами отсутствие ясной оговорки о процентности/беспроцентности создает существенный спорный риск"
    legal_base: "ст. 809 ГК РФ"
    required_triggers: ["commercial_parties"]
    severity: "high"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      negative_keywords:
        - "беспроцентный"
        - "проценты"
        - "процентная ставка"
        - "% годовых"
      keyword_mode: "any"
    retrieval:
      context_k: 4
      boost_keywords:
        - "проценты"
        - "беспроцентный"
        - "коммерческие организации"
      rerank: true

  - id: "loan_amount_missing"
    name: "Не выявлена ясная сумма займа"
    description: "Отсутствие четко определенной суммы или количества вещей делает конструкцию займа дефектной"
    legal_base: "ст. 807, 808 ГК РФ"
    required_triggers: []
    severity: "critical"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      negative_keywords:
        - "сумма займа"
        - "в размере"
        - "рублей"
        - "евро"
        - "долларов"
        - "количество"
      keyword_mode: "any"
    retrieval:
      context_k: 4
      boost_keywords:
        - "сумма займа"
        - "в размере"
        - "рублей"
      rerank: true

  - id: "related_party_loan_bankruptcy_risk"
    name: "Заём между аффилированными лицами — риск субординации"
    description: |
      Заём между аффилированными/взаимозависимыми лицами может быть 
      переквалифицирован в корпоративное финансирование и субординирован 
      в банкротстве заёмщика (Обзор ВС РФ от 29.01.2020).
    legal_base: "Обзор ВС РФ от 29.01.2020, ст. 2 ФЗ-127"
    required_triggers: ["related_parties"]
    severity: "critical"
    result_if_triggered: "warning"
    detector_type: "rules"
    rules:
      keywords:
        - "аффилирован"
        - "взаимозависим"
        - "участник общества"
        - "директор"
        - "контролирующее лицо"
        - "бенефициар"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "аффилированность"
        - "взаимозависимость"
        - "корпоративное финансирование"
      rerank: true

  - id: "loan_forgiveness_tax_risk"
    name: "Прощение долга — налоговые и банкротные риски"
    description: |
      Прощение долга влечёт налоговые последствия для заёмщика (доход) 
      и риск оспаривания в банкротстве займодавца как безвозмездной сделки.
    legal_base: "ст. 415 ГК РФ, ст. 250 НК РФ, ст. 61.2 ФЗ-127"
    required_triggers: ["loan_forgiveness"]
    severity: "critical"
    result_if_triggered: "warning"
    detector_type: "rules"
    rules:
      keywords:
        - "прощение долга"
        - "освобождение от обязательства"
        - "отказ от требования"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "прощение долга"
        - "налоговые последствия"
        - "безвозмездная сделка"
      rerank: true

  - id: "interest_free_commercial_loan_tax_risk"
    name: "Беспроцентный заём между юрлицами — налоговые риски"
    description: |
      Беспроцентный заём между коммерческими организациями создаёт риск 
      доначисления налога на прибыль по ст. 269 НК РФ (внереализационный доход) 
      и признания сделки нерыночной.
    legal_base: "ст. 269 НК РФ, ст. 105.3 НК РФ"
    required_triggers: ["interest_free_loan", "commercial_parties"]
    severity: "high"
    result_if_triggered: "warning"
    detector_type: "rules"
    rules:
      keywords:
        - "беспроцентный"
        - "без начисления процентов"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "беспроцентный заём"
        - "налоговые риски"
        - "внереализационный доход"
      rerank: true

  - id: "fungible_goods_loan_quality_risk"
    name: "Заём вещей: риск спора о качестве и количестве"
    description: |
      При займе вещей, определённых родовыми признаками, критично 
      зафиксировать качество, количество и способ определения возвращаемых вещей.
    legal_base: "ст. 807 ГК РФ"
    required_triggers: ["fungible_goods_loan"]
    severity: "high"
    result_if_triggered: "warning"
    detector_type: "rules"
    rules:
      keywords:
        - "вещи, определенные родовыми признаками"
        - "того же рода и качества"
        - "товарный заем"
      keyword_mode: "any"
      negative_keywords:
        - "качество"
        - "ГОСТ"
        - "спецификация"
        - "акт приёма-передачи"
    retrieval:
      context_k: 5
      boost_keywords:
        - "качество"
        - "количество"
        - "спецификация"
      rerank: true

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 5: CHECKS_V8 — LLM/hybrid проверки
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  - id: loan_subject_extraction
    name: "Базовое извлечение параметров займа"
    description: "Извлекает сумму, валюту, срок, процентность, стороны, порядок передачи и возврата займа"
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "займодавец"
        - "заемщик"
        - "сумма займа"
        - "проценты"
        - "срок возврата"
        - "беспроцентный"
        - "переданы"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(займодавец|заемщик|договор\\s+займа)"
        - "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|коп|тыс|млн|млрд)\\b"
        - "(?i)\\b\\d+(?:[.,]\\d+)?\\s*%\\b"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор займа.
        Извлеки ключевые параметры договора строго по тексту.

        Ответь строго в JSON:
        {
          "lender": "<займодавец или not_found>",
          "borrower": "<заемщик или not_found>",
          "loan_kind": "<money / fungible_goods / mixed / unclear / not_found>",
          "loan_amount": "<сумма/количество или not_found>",
          "currency": "<RUB / USD / EUR / other / not_found>",
          "interest_status": "<interest_bearing / interest_free / unclear / not_found>",
          "interest_rate": "<ставка или not_found>",
          "repayment_term": "<срок возврата или on_demand / not_found>",
          "transfer_method": "<cash / bank_transfer / mixed / unclear / not_found>",
          "repayment_method": "<cash / bank_transfer / mixed / unclear / not_found>"
        }

        Используй только данные из текста.
        Если сведений нет — пиши "not_found".
      prompt_file: null
      context_k: 6
      temperature: 0.0
      max_tokens: 700
    retrieval:
      context_k: 6
      max_chunks: 10
      boost_keywords:
        - "сумма займа"
        - "проценты"
        - "срок возврата"
        - "расписка"
        - "платежное поручение"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 50
      max_snippet_length: 700
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "lender"
          type: "string"
          keyword_hints: ["займодавец"]
          description: "Займодавец"
        - name: "borrower"
          type: "string"
          keyword_hints: ["заемщик"]
          description: "Заемщик"
        - name: "loan_kind"
          type: "string"
          allowed_values: ["money", "fungible_goods", "mixed", "unclear", "not_found"]
          description: "Предмет займа"
        - name: "loan_amount"
          type: "string"
          keyword_hints: ["сумма займа", "в размере", "количество"]
          description: "Сумма или количество предмета займа"
        - name: "currency"
          type: "string"
          allowed_values: ["RUB", "USD", "EUR", "other", "not_found"]
          description: "Валюта займа"
        - name: "interest_status"
          type: "string"
          allowed_values: ["interest_bearing", "interest_free", "unclear", "not_found"]
          description: "Процентность займа"
        - name: "interest_rate"
          type: "string"
          regex_patterns:
            - "(?i)\\b\\d+(?:[.,]\\d+)?\\s*%\\b"
          description: "Процентная ставка"
        - name: "repayment_term"
          type: "string"
          keyword_hints: ["срок возврата", "по требованию", "не позднее"]
          description: "Срок возврата"
        - name: "transfer_method"
          type: "string"
          allowed_values: ["cash", "bank_transfer", "mixed", "unclear", "not_found"]
          description: "Способ передачи займа"
        - name: "repayment_method"
          type: "string"
          allowed_values: ["cash", "bank_transfer", "mixed", "unclear", "not_found"]
          description: "Способ возврата займа"
      store_payload: true

  - id: transfer_evidence_check
    name: "Подтверждение фактической передачи суммы займа"
    description: "Проверяет наличие доказательств передачи займа: расписка, акт, платежное поручение, указание на передачу при подписании"
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "денежные средства переданы"
        - "получены заемщиком"
        - "расписка"
        - "платежное поручение"
        - "зачислены на счет"
        - "переданы при подписании"
        - "акт передачи"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)денежн(ые|ых)\\s+средств[ао].{0,40}(передан|получен)"
        - "(?i)расписк"
        - "(?i)платежн(ое|ого)\\s+поручени"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор займа.
        Проверь, содержит ли документ достаточные признаки фактической передачи суммы займа.

        Ответь строго в JSON:
        {
          "transfer_evidence_status": "<strong / medium / weak / not_found>",
          "transfer_evidence_type": ["<расписка>", "<платежное поручение>", "<указание в договоре>", "<акт>", "<иное>"],
          "cash_transfer_risk": "<high / medium / low / not_found>",
          "transfer_snippet": "<цитата или not_found>"
        }

        - "strong" — есть конкретный документ/прямое подтверждение передачи
        - "medium" — есть формула в договоре, но без внешнего подтверждения
        - "weak" — есть лишь косвенные указания
        - "not_found" — подтверждение не найдено
      prompt_file: null
      context_k: 5
      temperature: 0.0
      max_tokens: 420
    retrieval:
      context_k: 5
      max_chunks: 8
      boost_keywords:
        - "расписка"
        - "платежное поручение"
        - "переданы"
        - "получены"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "transfer_evidence_status"
          type: "string"
          allowed_values: ["strong", "medium", "weak", "not_found"]
          description: "Сила подтверждения передачи займа"
        - name: "cash_transfer_risk"
          type: "string"
          allowed_values: ["high", "medium", "low", "not_found"]
          description: "Риск безденежности при наличной передаче"
      store_payload: true

  - id: interest_terms_check
    name: "Проценты по займу и методика их расчета"
    description: "Проверяет наличие процентной ставки, беспроцентности и понятной базы начисления процентов"
    triggers: {}
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "проценты"
        - "процентная ставка"
        - "% годовых"
        - "беспроцентный"
        - "на остаток задолженности"
        - "на фактический остаток"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)\\b\\d+(?:[.,]\\d+)?\\s*%\\b"
        - "(?i)беспроцентн"
        - "(?i)остат(ок|ка)\\s+задолженн"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор займа.
        Проверь условия о процентах и методике их расчета.

        Ответь строго в JSON:
        {
          "interest_status": "<interest_bearing / interest_free / unclear / not_found>",
          "interest_rate": "<ставка или not_found>",
          "calculation_base": "<principal / outstanding_balance / unclear / not_found>",
          "payment_frequency": "<monthly / at_maturity / other / not_found>",
          "interest_clause_clarity": "<clear / unclear / not_found>"
        }

        Используй только текст документа.
      prompt_file: null
      context_k: 5
      temperature: 0.0
      max_tokens: 420
    retrieval:
      context_k: 5
      max_chunks: 8
      boost_keywords:
        - "проценты"
        - "процентная ставка"
        - "остаток задолженности"
        - "беспроцентный"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "interest_status"
          type: "string"
          allowed_values: ["interest_bearing", "interest_free", "unclear", "not_found"]
          description: "Статус процентности займа"
        - name: "interest_rate"
          type: "string"
          regex_patterns:
            - "(?i)\\b\\d+(?:[.,]\\d+)?\\s*%\\b"
          description: "Процентная ставка"
        - name: "calculation_base"
          type: "string"
          allowed_values: ["principal", "outstanding_balance", "unclear", "not_found"]
          description: "База начисления процентов"
        - name: "payment_frequency"
          type: "string"
          allowed_values: ["monthly", "at_maturity", "other", "not_found"]
          description: "Периодичность уплаты процентов"
      store_payload: true

