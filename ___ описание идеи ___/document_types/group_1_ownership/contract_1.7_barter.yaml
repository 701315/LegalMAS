doc_type_checks:

  - id: "parties_identification"
    name: "Стороны договора мены: идентификация"
    description: "Проверяет наличие и достаточность идентификации обеих сторон"
    legal_base: "ст. 432, 567 ГК РФ"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "Сторона 1"
        - "Сторона 2"
        - "именуем"
        - "в лице"
        - "действующего на основании"
        - "продавец"
        - "покупатель"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(сторона\\s+[12]|первая\\s+сторона|вторая\\s+сторона).*именуем"
        - "(?i)\\b(?:ИНН|ОГРН|ОГРНИП)\\s*:?\\s*\\d{10,15}\\b"
    extraction:
      enabled: true
      mode: "rules"
      fields:
        - name: "party_A_type"
          type: "string"
          allowed_values: ["legal_entity", "individual_entrepreneur", "individual", "unclear"]
          keyword_hints: ["ООО", "АО", "ИП", "гражданин", "физическое лицо"]
          description: "Тип Стороны 1"
        - name: "party_B_type"
          type: "string"
          allowed_values: ["legal_entity", "individual_entrepreneur", "individual", "unclear"]
          keyword_hints: ["ООО", "АО", "ИП", "гражданин", "физическое лицо"]
          description: "Тип Стороны 2"
      store_payload: true

  - id: "subject_both_goods"
    name: "Предмет: описание обоих обмениваемых товаров (ст. 567, 455 ГК РФ)"
    description: "Проверяет наличие чёткого описания обоих товаров с наименованием, количеством, характеристиками"
    legal_base: "ст. 567, 455 ГК РФ"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "товар"
        - "наименование"
        - "количество"
        - "обмениваемый"
        - "передаёт в собственность"
        - "получает в собственность"
        - "характеристики"
        - "описание товара"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)товар\\s+[«\"]"
        - "(?i)передаёт.*в.*собственность.*другой\\s+сторон"

  - id: "transfer_procedure_and_timing"
    name: "Порядок и сроки взаимной передачи товаров (ст. 570 ГК РФ)"
    description: "Проверяет наличие порядка и сроков передачи товаров (одновременно или последовательно)"
    legal_base: "ст. 570 ГК РФ"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "порядок передачи"
        - "срок передачи"
        - "одновременно"
        - "последовательно"
        - "не позднее"
        - "в течение"
        - "дата передачи"
        - "передаточный акт"
        - "акт приёма-передачи"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(не\\s+позднее|в\\s+течение)\\s+\\d+"
        - "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"
        - "(?i)передач(а|и|у)\\s+товар"

  - id: "goods_valuation"
    name: "Стоимость обмениваемых товаров и метод оценки (ст. 568 ГК РФ)"
    description: "Проверяет указание стоимости обоих товаров и/или метода оценки"
    legal_base: "ст. 568 ГК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "стоимость"
        - "оценка"
        - "рыночная стоимость"
        - "равноценный"
        - "неравноценный"
        - "рублей"
        - "метод оценки"
        - "оценщик"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)стоимост(ь|и|ью)\\s+.*?\\d"
        - "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|тыс|млн)"
        - "(?i)оценива(ется|ются)\\s+в"

  - id: "surcharge_terms"
    name: "Доплата при неравноценности: размер, срок, порядок (ст. 568 ГК РФ)"
    description: "Проверяет наличие условий о доплате при неравноценном обмене"
    legal_base: "ст. 568 ГК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
      any: ["unequal_exchange"]
    rules:
      keywords:
        - "доплата"
        - "разница в стоимости"
        - "компенсация разницы"
        - "менее ценный товар"
        - "сторона обязана доплатить"
        - "денежная компенсация"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)доплат(а|у|ы|ить)\\s+.*?\\d"
        - "(?i)разниц(а|у)\\s+в\\s+стоимости"
    extraction:
      enabled: true
      mode: "rules"
      fields:
        - name: "surcharge_amount"
          type: "number"
          keyword_hints: ["доплата", "разница", "компенсация", "рублей"]
          unit: "RUB"
          description: "Сумма доплаты"
        - name: "surcharge_deadline"
          type: "string"
          keyword_hints: ["не позднее", "в течение", "до"]
          description: "Срок доплаты"
      store_payload: true

  - id: "goods_quality_warranty"
    name: "Гарантии качества обмениваемых товаров (ст. 469-477 ГК РФ)"
    description: "Проверяет наличие гарантий качества для обоих товаров"
    legal_base: "ст. 469-477, 567 ГК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "гарантия качества"
        - "соответствие товара"
        - "отсутствие недостатков"
        - "технические характеристики"
        - "проверка качества"
        - "претензия по качеству"
        - "скрытые недостатки"
        - "гарантийный срок"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)гарантиру(ет|ют).*качеств"
        - "(?i)соответств(ует|ие).*требовани"

  - id: "defects_claims_procedure"
    name: "Порядок предъявления претензий по недостаткам (ст. 475-477 ГК РФ)"
    description: "Проверяет наличие порядка предъявления претензий при обнаружении недостатков товара"
    legal_base: "ст. 475-477, 567 ГК РФ"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "претензия"
        - "рекламация"
        - "недостатки товара"
        - "обнаружение недостатков"
        - "срок предъявления претензий"
        - "акт о недостатках"
        - "замена товара"
        - "соразмерное уменьшение"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)претензи(я|и|ю).*по\\s+(качеств|недостатк)"
        - "(?i)обнаружен(ие|ии)\\s+недостатк"

  - id: "encumbrances_warranty_both_goods"
    name: "Гарантия отсутствия обременений и прав третьих лиц на оба товара (ст. 460 ГК РФ)"
    description: "Проверяет наличие гарантий отсутствия обременений для каждого из обмениваемых товаров"
    legal_base: "ст. 460, 567 ГК РФ"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "не обременён"
        - "отсутствие обременений"
        - "не заложен"
        - "не находится под арестом"
        - "свободен от прав третьих лиц"
        - "не сдан в аренду"
        - "никаких прав третьих лиц"
        - "гарантирует"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)сторон(а|ы).*гарантиру(ет|ют).*отсутствие.*обременений"
        - "(?i)(не\\s+обременён|свободен\\s+от.*прав)"

  - id: "eviction_warranty"
    name: "Гарантия от эвикции / изъятия товара (ст. 461, 571 ГК РФ)"
    description: "Проверяет наличие гарантий защиты при изъятии товара, полученного по мене, третьим лицом"
    legal_base: "ст. 461, 571 ГК РФ"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "эвикция"
        - "изъятие товара"
        - "истребование"
        - "виндикация"
        - "возврат товара и возмещение убытков"
        - "ст. 571"
        - "ст. 461"
        - "права на товар принадлежат"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)изъят(ие|ии)\\s+товар"
        - "(?i)эвикци"
        - "(?i)истребован(ие|ии)\\s+товар"

  - id: "transfer_act_both_goods"
    name: "Акт приёма-передачи для каждого товара (ст. 556, 567 ГК РФ)"
    description: "Проверяет наличие условий о подписании актов приёма-передачи для обоих товаров"
    legal_base: "ст. 556, 567 ГК РФ"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "передаточный акт"
        - "акт приёма-передачи"
        - "подписывают акт"
        - "при передаче составляется акт"
        - "состояние товара фиксируется"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)акт\\s+(приём|передач)"

  - id: "risk_of_loss_allocation"
    name: "Риск случайной гибели / повреждения товара (ст. 459, 570 ГК РФ)"
    description: "Проверяет распределение рисков случайной гибели или повреждения обмениваемых товаров"
    legal_base: "ст. 459, 570 ГК РФ"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "риск случайной гибели"
        - "риск случайного повреждения"
        - "несёт риск"
        - "переход риска"
        - "до передачи"
        - "после передачи"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)риск\\s+случайн(ой|ого)\\s+(гибел|поврежден)"

  - id: "force_majeure"
    name: "Форс-мажор / обстоятельства непреодолимой силы"
    description: "Проверяет наличие оговорки о форс-мажоре"
    legal_base: "ст. 401, 416 ГК РФ"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "форс-мажор"
        - "непреодолимая сила"
        - "обстоятельства непреодолимой силы"
        - "освобождение от ответственности"
        - "невозможность исполнения"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)форс[\\s-]?мажор"
        - "(?i)непреодолим(ая|ой)\\s+сил"

  - id: "termination_and_consequences"
    name: "Расторжение: основания и последствия (ст. 450-453 ГК РФ)"
    description: "Проверяет наличие оснований расторжения и последствий для обеих сторон"
    legal_base: "ст. 450-453 ГК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "расторжение"
        - "отказ от договора"
        - "односторонний отказ"
        - "возврат товаров"
        - "возмещение убытков"
        - "существенное нарушение"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)расторж(ение|ении)"
        - "(?i)односторонн(ий|ем)\\s+отказ"

  - id: "economic_justification_clause"
    name: "Деловая цель и экономическое обоснование мены (ст. 170, 421 ГК РФ)"
    description: "Проверяет наличие экономического обоснования / деловой цели для защиты от притворности"
    legal_base: "ст. 170 ГК РФ, ст. 54.1 НК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
      any: ["legal_entity_party"]
    rules:
      keywords:
        - "деловая цель"
        - "экономическая обоснованность"
        - "хозяйственный смысл"
        - "взаимная выгода"
        - "не является притворной"
        - "имеет экономическое обоснование"
      keyword_mode: "any"
      negative_keywords:
        - "дарение"
        - "безвозмездная передача"
        - "фиктивная сделка"
      regex_patterns:
        - "(?i)делов(ая|ой)\\s+цел"
        - "(?i)экономическ(ое|ая|ого)\\s+обоснован"

  - id: "corporate_approval"
    name: "Корпоративное одобрение (крупная сделка / сделка с заинтересованностью)"
    description: "Проверяет наличие корпоративного одобрения для юридических лиц"
    legal_base: "ФЗ-14, ФЗ-208"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
      any: ["legal_entity_party"]
    rules:
      keywords:
        - "крупная сделка"
        - "сделка с заинтересованностью"
        - "одобрение общего собрания"
        - "одобрение совета директоров"
        - "протокол одобрения"
        - "решение единственного участника"
        - "не является крупной сделкой"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)крупн(ая|ой)\\s+сделк"
        - "(?i)одобрен(ие|а).*собрани"

  - id: "spousal_consent_barter"
    name: "Согласие супруга при мене имущества физлица (ст. 35 СК РФ)"
    description: "Проверяет наличие согласия супруга при обмене имущества, являющегося совместной собственностью"
    legal_base: "ст. 35 СК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
      any: ["individual_party"]
    rules:
      keywords:
        - "согласие супруга"
        - "нотариальное согласие"
        - "не состоит в браке"
        - "брачный договор"
        - "личная собственность"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)согласи(е|я)\\s+супруг"
        - "(?i)не\\s+состоит?\\s+в\\s+браке"

  - id: "assignment_restriction"
    name: "Уступка прав / перевод долга: ограничения"
    description: "Проверяет наличие ограничений на уступку прав и перевод долга"
    legal_base: "ст. 382-392 ГК РФ"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "уступка"
        - "переуступка"
        - "перевод долга"
        - "без согласия"
        - "с согласия другой стороны"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)уступк(а|и).*без\\s+соглас"
        - "(?i)перевод\\s+долга"

  - id: "confidentiality"
    name: "Конфиденциальность условий сделки"
    description: "Проверяет наличие условий о конфиденциальности"
    legal_base: "ст. 421 ГК РФ"
    severity: "low"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "конфиденциальность"
        - "неразглашение"
        - "коммерческая тайна"
        - "не раскрывать третьим лицам"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)конфиденциал"
        - "(?i)не\\s+разглаш"

  - id: "dispute_resolution_jurisdiction"
    name: "Подсудность и порядок разрешения споров"
    description: "Проверяет наличие условий о подсудности и досудебном порядке"
    legal_base: "АПК РФ, ГПК РФ"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "подсудность"
        - "арбитражный суд"
        - "претензионный порядок"
        - "досудебный порядок"
        - "медиация"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)арбитражн(ый|ого)\\s+суд"
        - "(?i)претензионн(ый|ого)\\s+поряд"

  - id: "insurance_of_goods"
    name: "Страхование обмениваемых товаров"
    description: "Проверяет наличие условий о страховании товаров при хранении/транспортировке"
    legal_base: "ГК РФ (общие положения)"
    severity: "low"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "страхование"
        - "страховой полис"
        - "застраховать"
        - "страховая сумма"
        - "выгодоприобретатель"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)страхов(ание|ой\\s+полис)"

  - id: "transport_and_delivery"
    name: "Транспортировка и доставка обмениваемых товаров"
    description: "Проверяет наличие условий о порядке доставки, расходах на транспортировку и рисках при перевозке"
    legal_base: "ст. 458, 459, 567 ГК РФ"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
      any: ["goods_transport_required"]
    rules:
      keywords:
        - "доставка"
        - "транспортировка"
        - "перевозка"
        - "расходы на доставку"
        - "самовывоз"
        - "отгрузка"
        - "грузополучатель"
        - "транспортная накладная"
        - "место передачи"
        - "пункт назначения"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)доставк(а|у|и)\\s+за\\s+счёт"
        - "(?i)расход(ы|ов)\\s+на\\s+(доставк|транспортировк)"
    extraction:
      enabled: true
      mode: "rules"
      fields:
        - name: "delivery_responsibility"
          type: "string"
          allowed_values: ["party_A", "party_B", "each_own", "third_party", "not_found"]
          keyword_hints: ["за счёт", "обязуется доставить", "самовывоз"]
          description: "Кто несёт расходы/обязанность по доставке"
      store_payload: true

  - id: "cross_border_barter_clause"
    name: "ВЭД-бартер: валютный контроль и таможенные обязательства"
    description: "Проверяет наличие условий о валютном контроле, таможне и сроках встречных поставок"
    legal_base: "ФЗ-173, ТК ЕАЭС"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
      any: ["cross_border_barter"]
    rules:
      keywords:
        - "валютный контроль"
        - "таможенное оформление"
        - "таможенная декларация"
        - "уполномоченный банк"
        - "ВЭД"
        - "Incoterms"
        - "экспорт"
        - "импорт"
        - "срок встречной поставки"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)валютн(ый|ого)\\s+контрол"
        - "(?i)таможенн(ое|ого|ая)\\s+(оформлен|декларац)"
        - "(?i)Incoterms"

  - id: "governing_law"
    name: "Применимое право"
    description: "Проверяет указание применимого права, критично при трансграничном элементе"
    legal_base: "ст. 1210, 1211 ГК РФ"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "применимое право"
        - "законодательство Российской Федерации"
        - "регулируется правом"
        - "governing law"
        - "право Российской Федерации"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)применим(ое|ого)\\s+прав"
        - "(?i)governing\\s+law"
        - "(?i)регулируется.*прав(ом|о)"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 7: DD_REQUEST_TEMPLATES
#  Читается: DDRequestTemplateLoader
#  Ключи = check_id из checks_v8 и doc_type_checks выше.
#  DDRequestTemplateLoader.render() матчит по exact или prefix.
# ════════════════════════════════════════════════════════════════════════════

dd_request_templates:

  parties_identification:
    text: >
      Просим подтвердить полные реквизиты обеих сторон по {doc_names}:
      наименование/ФИО, ИНН, ОГРН/ОГРНИП, адрес, полномочия подписантов.
    addressee: "Обе стороны"

  subject_both_goods:
    text: >
      Просим уточнить в {doc_names}: детальное описание обоих обмениваемых товаров —
      наименование, количество, характеристики, индивидуализирующие признаки
      (серийные номера, VIN, кадастровые номера и т.п.).
    addressee: "Обе стороны"

  transfer_procedure_and_timing:
    text: >
      Просим согласовать в {doc_names}: порядок и сроки передачи товаров
      (одновременно / последовательно), место передачи, форму акта.
    addressee: "Обе стороны"

  barter_subject_extraction:
    text: >
      Просим предоставить полные данные об обмениваемых товарах по {doc_names}:
      наименование, количество, стоимость, характеристики каждого товара,
      а также заявление о равноценности/неравноценности и размере доплаты.
    addressee: "Обе стороны"

  simultaneous_transfer_mechanism_check:
    text: >
      В {doc_names} недостаточно проработан механизм обеспечения одновременности
      передачи товаров. Просим предложить: (а) одновременную передачу через
      нотариуса/агента; (б) эскроу/аккредитив; (в) задаток/банковскую гарантию;
      (г) иной механизм защиты стороны, передающей первой.
    addressee: "Юридический советник"

  ownership_transfer_timing_check:
    text: >
      Просим уточнить в {doc_names}: момент перехода права собственности
      на каждый из товаров (по умолчанию — после исполнения обеими сторонами
      по ст. 570 ГК РФ), а также момент перехода рисков случайной гибели.
    addressee: "Юридический советник"

  valuation_and_surcharge_check:
    text: >
      Просим уточнить в {doc_names}: (а) метод оценки стоимости каждого товара;
      (б) заявление о равноценности / неравноценности; (в) при неравноценности —
      размер, срок и порядок доплаты; (г) порядок разрешения споров об оценке
      (независимый оценщик / экспертиза).
    addressee: "Обе стороны"

  goods_valuation:
    text: >
      Просим указать в {doc_names} стоимость каждого из обмениваемых товаров
      и метод определения стоимости (рыночная / договорная / оценщик).
    addressee: "Обе стороны"

  surcharge_terms:
    text: >
      Просим уточнить в {doc_names}: размер доплаты, срок и порядок её уплаты,
      последствия просрочки доплаты, реквизиты для перечисления.
    addressee: "Юридический советник"

  tax_consequences_disclosure_check:
    text: >
      Просим уточнить в {doc_names}: (а) порядок исчисления НДС при мене
      (ст. 154 НК РФ); (б) стоимость товаров для целей налогообложения;
      (в) обязанность выставления счетов-фактур; (г) НДФЛ для физлиц.
    addressee: "Налоговый консультант / Юридический советник"

  real_estate_barter_specifics_check:
    text: >
      Для {doc_names} (мена недвижимости) просим предоставить:
      (а) кадастровые номера обоих объектов; (б) выписки ЕГРН;
      (в) правоустанавливающие документы; (г) подтверждение отсутствия
      обременений; (д) перечень зарегистрированных лиц (для жилья);
      (е) порядок одновременной регистрации в Росреестре.
    addressee: "Обе стороны"

  non_performance_consequences_check:
    text: >
      Просим уточнить в {doc_names}: последствия неисполнения обязательств
      одной из сторон — (а) право на расторжение; (б) возврат переданного товара;
      (в) возмещение убытков; (г) неустойка; (д) удержание товара.
    addressee: "Юридический советник"

  goods_quality_warranty:
    text: >
      Просим уточнить в {doc_names}: гарантии качества для каждого товара,
      гарантийные сроки, порядок предъявления претензий по недостаткам.
    addressee: "Обе стороны"

  defects_claims_procedure:
    text: >
      Просим уточнить в {doc_names}: порядок и сроки предъявления претензий
      по недостаткам, порядок проведения экспертизы, последствия обнаружения
      недостатков (замена / уменьшение стоимости / возврат).
    addressee: "Юридический советник"

  encumbrances_warranty_both_goods:
    text: >
      Просим предоставить по {doc_names}: заверения обеих сторон об отсутствии
      обременений, прав третьих лиц, арестов на каждый из обмениваемых товаров.
    addressee: "Обе стороны"

  eviction_warranty:
    text: >
      Просим уточнить в {doc_names}: гарантии от эвикции (ст. 571 ГК РФ) —
      последствия изъятия полученного товара третьим лицом, право требовать
      возврата своего товара и возмещения убытков.
    addressee: "Юридический советник"

  transfer_act_both_goods:
    text: >
      Просим согласовать в {doc_names}: форму и содержание актов приёма-передачи
      для каждого товара, перечень фиксируемых параметров, порядок подписания.
    addressee: "Обе стороны"

  risk_of_loss_allocation:
    text: >
      Просим уточнить в {doc_names}: момент перехода рисков случайной гибели
      для каждого товара и порядок действий при повреждении товара до передачи.
    addressee: "Юридический советник"

  force_majeure:
    text: >
      Просим уточнить в {doc_names}: перечень форс-мажорных обстоятельств,
      порядок уведомления, доказательства, последствия для обязательств сторон.
    addressee: "Юридический советник"

  termination_and_consequences:
    text: >
      Просим уточнить в {doc_names}: основания расторжения, порядок возврата
      товаров при расторжении, компенсация убытков, судьба доплаты.
    addressee: "Юридический советник"

  economic_justification_clause:
    text: >
      Рекомендуем включить в {doc_names} указание на деловую цель и экономическое
      обоснование мены для защиты от оспаривания по ст. 170 ГК РФ и претензий
      налоговых органов по ст. 54.1 НК РФ.
    addressee: "Юридический советник"

  corporate_approval:
    text: >
      Просим предоставить по {doc_names}: документы о корпоративном одобрении
      (протокол общего собрания / решение единственного участника / одобрение
      совета директоров) или заключение о том, что сделка не является крупной
      и не имеет заинтересованности.
    addressee: "Юридический советник каждой стороны"

  spousal_consent_barter:
    text: >
      Просим предоставить по {doc_names}: нотариальное согласие супруга/супруги
      на отчуждение имущества (ст. 35 СК РФ) либо подтверждение отсутствия брака /
      личной собственности / брачного договора.
    addressee: "Сторона — физическое лицо"

  assignment_restriction:
    text: >
      Просим добавить в {doc_names} ограничения на уступку прав / перевод долга
      без согласия другой стороны.
    addressee: "Юридический советник"

  confidentiality:
    text: >
      Просим добавить в {doc_names} условия о конфиденциальности:
      перечень конфиденциальных сведений, срок действия, исключения.
    addressee: "Юридический советник"

  dispute_resolution_jurisdiction:
    text: >
      Просим уточнить в {doc_names}: подсудность, претензионный порядок,
      сроки рассмотрения претензий.
    addressee: "Юридический советник"

  insurance_of_goods:
    text: >
      Просим уточнить в {doc_names}: необходимость страхования товаров
      при хранении/транспортировке, кто несёт расходы, выгодоприобретатель.
    addressee: "Юридический советник"

  sham_transaction_risk:
    text: >
      Внимание: для {doc_names} выявлен риск квалификации как притворная сделка.
      Рекомендуем: (а) включить обоснование деловой цели; (б) подтвердить
      рыночность оценки обоих товаров; (в) раскрыть аффилированность сторон
      (при наличии); (г) получить заключение оценщика.
    addressee: "Юридический советник"

  real_estate_barter_registration_required:
    text: >
      Внимание: для {doc_names} (мена недвижимости) переход права собственности
      подлежит обязательной государственной регистрации. Просим согласовать
      порядок подачи документов в Росреестр, распределение расходов на
      госпошлину и последствия отказа в регистрации.
    addressee: "Обе стороны / Юридический советник"

  interested_party_transaction_approval:
    text: >
      Внимание: для {doc_names} может потребоваться корпоративное одобрение
      (крупная сделка / сделка с заинтересованностью). Просим предоставить
      протокол одобрения или заключение о ненужности одобрения.
    addressee: "Юридический советник каждой стороны"

  cross_border_barter_check:
    text: >
      Для {doc_names} (внешнеторговый бартер) просим предоставить:
      (а) подтверждение постановки контракта на учёт в уполномоченном банке;
      (б) порядок таможенного оформления и декларирования для каждого товара;
      (в) согласованный срок встречной поставки с учётом требований ФЗ-173;
      (г) базис поставки по Incoterms (если применимо);
      (д) анализ санкционных ограничений по контрагенту/товару.
    addressee: "Юридический советник / Таможенный брокер / Банк"

  cross_border_barter_clause:
    text: >
      Просим включить в {doc_names}: условия о валютном контроле,
      таможенном оформлении, сроках встречных поставок и базисе поставки.
    addressee: "Юридический советник"

  vehicle_barter_specifics_check:
    text: >
      Для {doc_names} (мена транспортных средств) просим предоставить:
      (а) VIN и основные характеристики каждого ТС;
      (б) оригиналы ПТС / электронные ПТС;
      (в) справки об отсутствии обременений и ограничений из ГИБДД;
      (г) порядок перерегистрации; (д) действующий полис ОСАГО;
      (е) диагностическую карту / акт технического осмотра;
      (ж) заверения о техническом состоянии и отсутствии скрытых дефектов.
    addressee: "Обе стороны"

  transport_and_delivery:
    text: >
      Просим уточнить в {doc_names}: порядок и место передачи каждого товара,
      кто несёт расходы на доставку/транспортировку, перечень сопроводительных
      документов (ТТН, CMR), риски при перевозке.
    addressee: "Обе стороны"

  governing_law:
    text: >
      Просим подтвердить в {doc_names} применимое право, особенно при наличии
      трансграничного элемента.
    addressee: "Юридический советник"

  cross_border_barter_compliance:
    text: >
      Внимание: {doc_names} содержит признаки внешнеторгового бартера.
      Просим предоставить: (а) анализ соответствия ФЗ-173 (валютный контроль);
      (б) проект таможенных деклараций; (в) подтверждение постановки на учёт
      в уполномоченном банке; (г) расчёт сроков встречных поставок;
      (д) санкционный скрининг контрагента.
    addressee: "Юридический советник / Таможенный брокер"

  unequal_exchange_disguised_gift_risk:
    text: >
      Внимание: {doc_names} содержит признаки неравноценного обмена без доплаты
      между коммерческими организациями. Это создаёт риск квалификации
      как частичное дарение (запрещено ст. 575 ГК РФ). Просим:
      (а) обосновать равноценность или включить доплату;
      (б) получить независимую оценку обоих товаров;
      (в) задокументировать деловую цель сделки.
    addressee: "Юридический советник / Оценщик"

  # Generic fallback
  _default:
    text: >
      Просим предоставить дополнительную информацию по вопросу «{check_name}»
      применительно к {doc_names}.
    addressee: "Юридический советник"