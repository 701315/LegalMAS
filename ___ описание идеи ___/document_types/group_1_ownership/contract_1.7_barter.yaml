type: contract_1.7_barter
name: "Договор мены (Бартер)"

description: |
  Двусторонняя сделка, при которой каждая из сторон обязуется передать в собственность другой стороны
  один товар в обмен на другой. Характеризуется отсутствием денежного встречного предоставления
  в чистом виде, возможной доплатой при неравноценности товаров и особым моментом перехода
  права собственности (после исполнения обязательств обеими сторонами, ст. 570 ГК РФ).
  К договору мены субсидиарно применяются правила о купле-продаже (ст. 567 ГК РФ), при этом
  каждая сторона признаётся продавцом передаваемого и покупателем получаемого товара.
  Для целей налогообложения бартер приравнивается к двум встречным реализациям.

version: 4.1
parent: class_1_transfer_of_ownership

metadata:
  category: contract
  subcategory: ownership_transfer
  complexity: medium
  risk_level: high
  jurisdiction: RU
  language: ru
  legal_base: "Глава 31 ГК РФ (ст. 567-571)"
  doc_types_supported:
    - "договор мены"
    - "договор бартера"
    - "договор товарообмена"
    - "договор мены недвижимости"
    - "договор мены транспортных средств"
    - "договор мены акций"
    - "договор мены долей"
    - "смешанный договор мены с доплатой"
    - "соглашение о встречных поставках"

    - "barter agreement"
    - "countertrade agreement"
    - "exchange agreement"
    - "reciprocal trade agreement"
    - "swap deal"
    - "exchange transaction agreement"

engine_expectations:
  evidence_required: true
  evidence_style: "pinpoint"
  allow_not_found: true
  output_style: "dd_grid"
  prefer_structured_outputs: true

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 1: КЛАССИФИКАЦИЯ (L1/L2)
#  Читается: YAMLRegistry → L1FilenameClassifier, L2HeaderClassifier
# ════════════════════════════════════════════════════════════════════════════

classification_runtime_v1:

  scoring:
    accept_threshold: 0.80
    strong_signal_threshold: 0.88
    ambiguity_margin: 0.18
    input_quality_weight: 1.0

  rules:

    filename_patterns:
      - pattern: "(?i)\\bдоговор[\\s_.-]*мены\\b"
        kind: specific_subject
        weight: 1.0
        # Прямое наименование договора мены

      - pattern: "(?i)\\bдоговор[\\s_.-]*бартера\\b"
        kind: specific_subject
        weight: 0.98
        # Прямое наименование договора бартера

      - pattern: "(?i)\\bдоговор[\\s_.-]*товарообмена\\b"
        kind: specific_subject
        weight: 0.97
        # Прямое наименование договора товарообмена

      - pattern: "(?i)\\bмен(?:а|ы|е|у|ой)\\b"
        kind: specific_subject
        weight: 0.88
        # Базовый русский маркер мены как правовой формы

      - pattern: "(?i)\\bбартер\\b"
        kind: specific_subject
        weight: 0.90
        # Бартер — прямой синоним данного типа

      - pattern: "(?i)\\bтоварообмен\\b"
        kind: specific_subject
        weight: 0.90
        # Товарообмен — прямой синоним barter/exchange of goods

      - pattern: "(?i)(?:\\bмен(?:а|ы|е|у|ой)\\b.*\\b(?:недвижимост|квартир|земельн|жил[а-я]*[\\s_.-]*дом|нежил[а-я]*[\\s_.-]*помещени|здани|сооружени)\\b|\\b(?:недвижимост|квартир|земельн|жил[а-я]*[\\s_.-]*дом|нежил[а-я]*[\\s_.-]*помещени|здани|сооружени)\\b.*\\bмен(?:а|ы|е|у|ой)\\b)"
        kind: specific_subject
        weight: 0.95
        # Мена недвижимости: должен побеждать barter, а не real_estate sale

      - pattern: "(?i)(?:\\bмен(?:а|ы|е|у|ой)\\b.*\\b(?:транспортн[а-я]*[\\s_.-]*средств|автомобил|машин[аы]|тс)\\b|\\b(?:транспортн[а-я]*[\\s_.-]*средств|автомобил|машин[аы]|тс)\\b.*\\bмен(?:а|ы|е|у|ой)\\b)"
        kind: specific_subject
        weight: 0.92
        # Мена транспортных средств — поддерживаемый subtype

      - pattern: "(?i)(?:\\bмен(?:а|ы|е|у|ой)\\b.*\\b(?:акци[яйи]|дол(?:я|и|ей)|share[s]?|stock|equity|participation[\\s_.-]*interest)\\b|\\b(?:акци[яйи]|дол(?:я|и|ей)|share[s]?|stock|equity|participation[\\s_.-]*interest)\\b.*\\bмен(?:а|ы|е|у|ой)\\b)"
        kind: specific_subject
        weight: 0.94
        # Мена акций/долей: должен побеждать barter, а не shares_sale

      - pattern: "(?i)(?:\\bмен(?:а|ы|е|у|ой)\\b.*\\bдоплат[аы]\\b|\\bдоплат[аы]\\b.*\\bмен(?:а|ы|е|у|ой)\\b)"
        kind: specific_subject
        weight: 0.86
        # Смешанный договор мены с доплатой

      - pattern: "(?i)\\bbarter[\\s_.-]*agreement\\b"
        kind: specific_subject
        weight: 0.96
        # Прямой англоязычный маркер barter agreement

      - pattern: "(?i)\\bcountertrade[\\s_.-]*agreement\\b"
        kind: specific_subject
        weight: 0.88
        # Countertrade agreement обычно ближе к barter/counter-exchange

      - pattern: "(?i)\\breciprocal[\\s_.-]*trade[\\s_.-]*agreement\\b"
        kind: specific_subject
        weight: 0.84
        # Reciprocal trade agreement — сильный, но менее каноничный barter marker

      - pattern: "(?i)\\bgoods[\\s_.-]*exchange\\b"
        kind: specific_subject
        weight: 0.86
        # Обмен товарами — хороший англоязычный маркер barter

      - pattern: "(?i)\\bexchange[\\s_.-]*transaction[\\s_.-]*agreement\\b"
        kind: generic_form
        weight: 0.62
        # Exchange transaction agreement поддерживается, но формулировка шире barter

      - pattern: "(?i)\\bexchange[\\s_.-]*agreement\\b"
        kind: generic_form
        weight: 0.52
        # Exchange agreement слишком широк: может относиться не только к barter

      - pattern: "(?i)\\bсоглашени[а-я]*[\\s_.-]*о[\\s_.-]*встречн[а-я]*[\\s_.-]*поставк[а-я]*\\b"
        kind: generic_form
        weight: 0.64
        # Встречные поставки близки к barter/countertrade, но могут пересекаться с supply

      - pattern: "(?i)\\bswap[\\s_.-]*deal\\b"
        kind: context
        weight: 0.20
        # Swap deal слишком неоднозначен из-за сильного конфликта с финансовыми инструментами


    folder_patterns:
      - pattern: "(?i)мен[аы]"
        kind: specific_subject
        weight: 0.82
        # Явная папка по договорам мены

      - pattern: "(?i)бартер|barter"
        kind: specific_subject
        weight: 0.84
        # Прямой folder-marker barter

      - pattern: "(?i)товарообмен|goods[_\\s-]*exchange"
        kind: specific_subject
        weight: 0.82
        # Папка по товарообменным сделкам

      - pattern: "(?i)countertrade|reciprocal[_\\s-]*trade"
        kind: specific_subject
        weight: 0.72
        # Countertrade taxonomy обычно относится к barter-like сделкам

      - pattern: "(?i)exchange[_\\s-]*transaction"
        kind: generic_form
        weight: 0.48
        # Exchange transaction folder полезен, но шире чистой мены

      - pattern: "(?i)встречн[а-я]*[_\\s-]*постав"
        kind: generic_form
        weight: 0.46
        # Встречные поставки — слабее прямой мены, возможен конфликт с supply

      - pattern: "(?i)exchange"
        kind: context
        weight: 0.22
        # Exchange сам по себе слишком широкий folder-marker

      - pattern: "(?i)swap"
        kind: context
        weight: 0.16
        # Swap-folder может относиться к деривативам и иным не-barter документам

    keywords:

      high:
        - pattern: "(?i)\\bдоговор[\\s\\n\\r]+мены\\b"
          weight: 1.0
          distinctiveness: high
          context: header
          description: "Базовое наименование договора мены (гл. 31 ГК РФ)"

        - pattern: "(?i)\\bдоговор[\\s\\n\\r]+бартера\\b"
          weight: 0.98
          distinctiveness: high
          context: header
          description: "Прямое указание на бартерный договор"

        - pattern: "(?i)\\bдоговор[\\s\\n\\r]+товарообмена\\b"
          weight: 0.96
          distinctiveness: high
          context: header
          description: "Заголовок с термином договор товарообмена"

        - pattern: "(?i)\\bдоговор[\\s\\n\\r]+мены\\s+недвижимости\\b"
          weight: 0.95
          distinctiveness: high
          context: header
          description: "Специальная конструкция мены недвижимости"

        - pattern: "(?i)\\bдоговор[\\s\\n\\r]+мены\\s+транспортных\\s+средств\\b"
          weight: 0.95
          distinctiveness: high
          context: header
          description: "Специальная конструкция мены транспортных средств"

        - pattern: "(?i)\\bдоговор[\\s\\n\\r]+мены\\s+долей(?:\\s*/\\s*акций)?\\b"
          weight: 0.94
          distinctiveness: high
          context: header
          description: "Мена долей или акций как особый вид бартерной сделки"

        - pattern: "(?i)смешанный\\s+договор[\\s\\n\\r]+мены\\s+с\\s+доплатой"
          weight: 0.92
          distinctiveness: high
          context: header
          description: "Смешанный договор мены с доплатой при неравноценности"

        - pattern: "(?i)\\bбартер\\b(?!н[а-я])"
          weight: 0.90
          distinctiveness: high
          context: any
          description: "Упоминание бартерной модели расчётов"

        - pattern: "(?i)\\bобмен\\s+товарами\\b"
          weight: 0.90
          distinctiveness: high
          context: body
          description: "Прямое указание на обмен товарами вместо денежной оплаты"

        - pattern: "(?i)\\bтовар\\s+на\\s+товар\\b"
          weight: 0.90
          distinctiveness: high
          context: body
          description: "Формула товар на товар — классический признак бартерной сделки"

        - pattern: "(?i)взаимная\\s+передача\\s+товаров?"
          weight: 0.88
          distinctiveness: high
          context: body
          description: "Взаимная передача товаров обеими сторонами"

        - pattern: "(?i)каждая\\s+из\\s+сторон\\s+признаётся\\s+продавцом|каждая\\s+из\\s+сторон\\s+признается\\s+продавц[еом]"
          weight: 0.87
          distinctiveness: high
          context: body
          description: "Формула ст. 567 ГК РФ о двойственной роли сторон"

        - pattern: "(?i)каждая\\s+сторона\\s+(?:является\\s+)?продавцом\\s+и\\s+покупателем"
          weight: 0.87
          distinctiveness: high
          context: body
          description: "Каждая сторона одновременно продавец и покупатель — ст. 567 ГК"

        - pattern: "(?i)\\bтоварообменный\\s+договор\\b"
          weight: 0.88
          distinctiveness: high
          context: any
          description: "Товарообменный договор — синоним договора мены в деловом обороте"

        - pattern: "(?i)обмениваемые\\s+товары?"
          weight: 0.85
          distinctiveness: high
          context: body
          description: "Обмениваемые товары как предмет договора мены"

        - pattern: "(?i)равноценность\\s+товаров?"
          weight: 0.85
          distinctiveness: high
          context: body
          description: "Равноценность товаров — ключевой вопрос договора мены (ст. 568 ГК)"

        - pattern: "(?i)встречное\\s+предоставление"
          weight: 0.82
          distinctiveness: high
          context: body
          description: "Встречное предоставление в неденежной форме — признак мены"

        - pattern: "(?i)ст(?:атья|\\.)?\\s*567\\s+ГК"
          weight: 0.95
          distinctiveness: high
          context: any
          description: "Ст. 567 ГК РФ — основная норма о договоре мены"

        - pattern: "(?i)ст(?:атья|\\.)?\\s*568\\s+ГК"
          weight: 0.90
          distinctiveness: high
          context: any
          description: "Ст. 568 ГК РФ — цены и расходы при мене"

        - pattern: "(?i)ст(?:атья|\\.)?\\s*570\\s+ГК"
          weight: 0.92
          distinctiveness: high
          context: any
          description: "Ст. 570 ГК РФ — момент перехода права собственности при мене"

        - pattern: "(?i)ст(?:атья|\\.)?\\s*571\\s+ГК"
          weight: 0.88
          distinctiveness: high
          context: any
          description: "Ст. 571 ГК РФ — последствия изъятия товара у покупателя"

        - pattern: "(?i)глав[аы]\\s*31\\s+ГК"
          weight: 0.90
          distinctiveness: high
          context: any
          description: "Прямая ссылка на главу 31 ГК РФ — нормативная база договора мены"

        - pattern: "(?i)приравнивается\\s+к\\s+(?:двум\\s+)?встречным\\s+реализациям?"
          weight: 0.88
          distinctiveness: high
          context: body
          description: "Квалификация бартера как двух встречных реализаций — ст. 39 НК РФ"

        - pattern: "(?i)НДС\\s+при\\s+бартере|налогообложение\\s+бартер"
          weight: 0.80
          distinctiveness: high
          context: body
          description: "Налогообложение бартерной сделки — специфика, упомянутая в description"

      medium:
        - pattern: "(?i)переход\\s+права\\s+собственности\\s+при\\s+мене"
          weight: 0.70
          distinctiveness: medium
          context: body
          description: "Специальное правило о моменте перехода права при мене"

        - pattern: "(?i)доплата\\s+при\\s+неравноценности"
          weight: 0.68
          distinctiveness: medium
          context: body
          description: "Указание на доплату при неравноценном обмене"

        - pattern: "(?i)неравноценный\\s+обмен"
          weight: 0.65
          distinctiveness: medium
          context: body
          description: "Неравноценность предметов обмена как профильный риск мены"

        - pattern: "(?i)компенсация\\s+разницы\\s+в\\s+стоимости"
          weight: 0.63
          distinctiveness: medium
          context: body
          description: "Компенсация разницы в стоимости как доплата при бартере"

        - pattern: "(?i)одновременная\\s+передача\\s+товаров?"
          weight: 0.60
          distinctiveness: medium
          context: body
          description: "Одновременность исполнения взаимных обязанностей"

        - pattern: "(?i)оценка\\s+обмениваемых\\s+товаров?"
          weight: 0.58
          distinctiveness: medium
          context: body
          description: "Оценка обмениваемых товаров для целей равноценности и налогообложения"

        - pattern: "(?i)бартерная\\s+сделка"
          weight: 0.60
          distinctiveness: medium
          context: any
          description: "Бартерная сделка как термин налогового/бухгалтерского учёта"

        - pattern: "(?i)субсидиарно\\s+применяются\\s+правила\\s+купли-?продажи"
          weight: 0.58
          distinctiveness: medium
          context: body
          description: "Субсидиарное применение норм купли-продажи к договору мены"

        - pattern: "(?i)встречная\\s+реализация"
          weight: 0.65
          distinctiveness: medium
          context: body
          description: "Встречная реализация — бухгалтерская квалификация бартера"

        - pattern: "(?i)рыночная\\s+стоимость\\s+обмениваемого"
          weight: 0.62
          distinctiveness: medium
          context: body
          description: "Рыночная стоимость обмениваемых товаров — ориентир при неравноценности"

      low:
        - pattern: "(?i)неденежный\\s+расчёт|неденежный\\s+расчет"
          weight: 0.35
          distinctiveness: low
          context: any
          description: "Общий указатель на неденежную форму расчётов"

        - pattern: "(?i)обменный\\s+договор"
          weight: 0.32
          distinctiveness: low
          context: any
          description: "Фоновое указание на обменный характер договора"

        - pattern: "(?i)натуральный\\s+обмен"
          weight: 0.30
          distinctiveness: low
          context: any
          description: "Натуральный обмен без денежного встречного предоставления"

    exclusions:
      - pattern: "(?i)купля-?продажа\\s+за\\s+денежные\\s+средства"
        severity: hard
        weight: -1.0
        description: "Прямое указание на денежную куплю-продажу вместо мены"

      - pattern: "(?i)оплата\\s+товар[аоу]\\s+денежными\\s+средствами"
        severity: hard
        weight: -1.0
        description: "Денежная оплата товара исключает бартерную модель"

      - pattern: "(?i)\\bцессия\\b|уступка\\s+права\\s+требования"
        severity: hard
        weight: -1.0
        description: "Цессия — уступка права требования (гл. 24 ГК), не мена товарами"

      - pattern: "(?i)\\bдоговор[\\s\\n\\r]+поставки\\b"
        severity: hard
        weight: -1.0
        description: "Договор поставки — § 3 гл. 30 ГК, не мена"

      - pattern: "(?i)\\bдоговор[\\s\\n\\r]+аренды\\b"
        severity: hard
        weight: -1.0
        description: "Аренда — временное пользование, не обмен собственностью"

      - pattern: "(?i)\\bдоговор[\\s\\n\\r]+дарения\\b"
        severity: hard
        weight: -1.0
        description: "Дарение — безвозмездная передача, не взаимный обмен"

      - pattern: "(?i)безвозмездная\\s+передача"
        severity: hard
        weight: -1.0
        description: "Безвозмездная передача исключает встречное предоставление"

      - pattern: "(?i)\\bрента\\b"
        severity: hard
        weight: -1.0
        description: "Рента — особый тип обязательства (гл. 33 ГК), не мена"

      - pattern: "(?i)\\bфакторинг\\b"
        severity: hard
        weight: -1.0
        description: "Факторинг — финансовая услуга, не обмен товарами"

      - pattern: "(?i)взнос\\s+в\\s+уставный\\s+капитал"
        severity: hard
        weight: -1.0
        description: "Взнос в уставный капитал — корпоративная конструкция, не бартер"

      # ── Soft exclusions

      - pattern: "(?i)денежный\\s+расчёт|денежный\\s+расчет"
        severity: soft
        weight: -0.40
        description: "Общий денежный расчёт снижает уверенность в бартере"

      - pattern: "(?i)денежные\\s+средства"
        severity: soft
        weight: -0.30
        description: "Многократные упоминания денежных средств ближе к классической купле-продаже"

      - pattern: "(?i)зачёт\\s+встречных\\s+требований|зачет\\s+встречных\\s+требований"
        severity: soft
        weight: -0.35
        description: "Зачёт встречных требований указывает на расчёты иного рода"

      - pattern: "(?i)\\bотступное\\b"
        severity: soft
        weight: -0.35
        description: "Отступное — иная форма прекращения обязательства (ст. 409 ГК)"

      - pattern: "(?i)вклад\\s+в\\s+имущество"
        severity: soft
        weight: -0.35
        description: "Вклад в имущество общества конкурирует с моделью мены"

      - pattern: "(?i)\\bновация\\b|\\bдоговор[\\s\\n\\r]+о\\s+новации\\b"
        severity: soft
        weight: -0.40
        description: "Новация заменяет обязательство новым, но не является обменом товарами"

      - pattern: "(?i)прекращение\\s+обязательства\\s+передачей\\s+имущества"
        severity: soft
        weight: -0.38
        description: "Прекращение обязательства передачей имущества — конструкция отступного (ст. 409 ГК), не мены"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 2: ТРИГГЕРЫ
#  Читается: TriggerDetector → doc.applicable_triggers
# ════════════════════════════════════════════════════════════════════════════

trigger_definitions:

  real_estate_barter:
    any_keywords:
      - "(?i)\\bнедвижимост[ьи]\\b"
      - "(?i)\\bквартир[аеиу]\\b"
      - "(?i)земельн[а-яё]+\\s+участ[оа]к"
      - "(?i)\\bздани[ея]\\b"
      - "(?i)\\bсооружени[ея]\\b"
      - "(?i)нежил[оаоеые]+\\s+помещени[ея]"
      - "(?i)кадастров[а-яё]+\\s+номер"
      - "(?i)государственн[а-яё]+\\s+регистраци[яи]"
      - "(?i)\\bЕГРН\\b"
      - "(?i)\\bРосреестр\\b"
      - "(?i)жил[оаые]+\\s+дом"
