# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 3: SHARED PATTERNS
#  Читается: DocTypeCheckLoader через _resolve_yaml_templates()
# ════════════════════════════════════════════════════════════════════════════

shared_patterns:
  money_amount: "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|тыс|млн|млрд)"
  date_pattern: "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"
  cadastral_number: "(?i)\\b\\d{2}:\\d{2}:\\d{6,7}:\\d+\\b"
  vin_number: "(?i)\\b[A-HJ-NPR-Z0-9]{17}\\b"
  inn_ogrn: "(?i)\\b(?:ИНН|ОГРН|ОГРНИП)\\s*:?\\s*\\d{10,15}\\b"
  percentage: "(?i)\\b\\d+[,.]?\\d*\\s*%"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: COMPLIANCE RULES
#  Читается: DocTypeCheckLoader._exclusion_logic_to_checks()
# ════════════════════════════════════════════════════════════════════════════

compliance_rules:

  - id: "sham_transaction_risk"
    name: "Риск притворности сделки (ст. 170 ГК РФ)"
    description: >
      Договор мены может быть признан притворной сделкой, если прикрывает дарение
      (при существенно неравноценном обмене без доплаты), куплю-продажу по заниженной
      цене или иную сделку. Особенно критично между аффилированными лицами
      и при значительном расхождении рыночной стоимости товаров.
    legal_base: "ст. 170 ГК РФ, ст. 54.1 НК РФ"
    required_triggers: ["legal_entity_party"]
    severity: "critical"
    result_if_triggered: "warning"
    detector_type: "rules"
    rules:
      keywords:
        - "рыночная стоимость"
        - "деловая цель"
        - "экономическое обоснование"
        - "аффилированные лица"
        - "взаимозависимые лица"
        - "притворная сделка"
        - "необоснованная налоговая выгода"
      keyword_mode: "any"
      negative_keywords:
        - "безвозмездная передача"
        - "дарение"
    retrieval:
      context_k: 5
      boost_keywords:
        - "притворная сделка"
        - "деловая цель"
        - "рыночная стоимость"
        - "аффилированность"
      rerank: true

  - id: "real_estate_barter_registration_required"
    name: "Мена недвижимости: обязательная госрегистрация перехода права (ФЗ-218)"
    description: >
      При мене недвижимого имущества переход права собственности подлежит
      обязательной государственной регистрации. Без регистрации право собственности
      не переходит, несмотря на фактическую передачу.
    legal_base: "ст. 551, 567 ГК РФ, ФЗ от 13.07.2015 № 218-ФЗ"
    required_triggers: ["real_estate_barter"]
    severity: "critical"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      keywords:
        - "государственная регистрация"
        - "Росреестр"
        - "ЕГРН"
        - "регистрация перехода права"
        - "регистрация права собственности"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "государственная регистрация"
        - "переход права собственности"
        - "Росреестр"
        - "ЕГРН"
      rerank: true

  - id: "interested_party_transaction_approval"
    name: "Одобрение сделки с заинтересованностью (ФЗ-14/ФЗ-208)"
    description: >
      Если сторонами мены являются юридические лица и сделка может быть
      квалифицирована как сделка с заинтересованностью или крупная сделка,
      требуется корпоративное одобрение.
    legal_base: "ФЗ от 08.02.1998 № 14-ФЗ (ст. 45-46), ФЗ от 26.12.1995 № 208-ФЗ (ст. 78-84)"
    required_triggers: ["legal_entity_party"]
    severity: "high"
    result_if_triggered: "warning"
    detector_type: "rules"
    rules:
      keywords:
        - "сделка с заинтересованностью"
        - "крупная сделка"
        - "одобрение общего собрания"
        - "одобрение совета директоров"
        - "корпоративное одобрение"
        - "протокол одобрения"
        - "решение единственного участника"
      keyword_mode: "any"
    retrieval:
      context_k: 4
      boost_keywords:
        - "крупная сделка"
        - "сделка с заинтересованностью"
        - "корпоративное одобрение"
      rerank: true

  - id: "cross_border_barter_compliance"
    name: "ВЭД-бартер: валютный контроль и таможенное оформление (ФЗ-173, ТК ЕАЭС)"
    description: >
      Внешнеторговые бартерные сделки подлежат специальному режиму:
      постановка на учёт в уполномоченном банке (валютный контроль),
      таможенное декларирование товаров, соблюдение сроков встречных поставок.
      Нарушение может повлечь штрафы, административную и уголовную ответственность.
    legal_base: "ФЗ-173 «О валютном регулировании», ТК ЕАЭС, КоАП РФ ст. 15.25"
    required_triggers: ["cross_border_barter"]
    severity: "critical"
    result_if_triggered: "warning"
    detector_type: "rules"
    rules:
      keywords:
        - "валютный контроль"
        - "таможенное оформление"
        - "таможенная декларация"
        - "уполномоченный банк"
        - "паспорт сделки"
        - "постановка на учёт"
        - "внешнеторговый бартер"
        - "репатриация"
        - "контракт учтён в банке"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "валютный контроль"
        - "таможенное оформление"
        - "ФЗ-173"
        - "внешнеторговый бартер"
      rerank: true

  - id: "unequal_exchange_disguised_gift_risk"
    name: "Неравноценный обмен без доплаты: риск дарения между коммерческими (ст. 575 ГК РФ)"
    description: >
      Если товары существенно неравноценны, а доплата не предусмотрена и не обоснована,
      такая мена между коммерческими организациями может быть квалифицирована как
      частичное дарение (в части разницы стоимости), что запрещено ст. 575 ГК РФ.
    legal_base: "ст. 575, 170 ГК РФ"
    required_triggers: ["unequal_exchange", "legal_entity_party"]
    severity: "critical"
    result_if_triggered: "warning"
    detector_type: "rules"
    rules:
      keywords:
        - "неравноценный"
        - "без доплаты"
        - "разница в стоимости"
        - "существенное расхождение"
        - "заниженная стоимость"
        - "завышенная стоимость"
        - "дарение"
        - "запрет дарения"
      keyword_mode: "any"
      negative_keywords:
        - "доплата предусмотрена"
        - "доплата в размере"
        - "компенсация разницы"
    retrieval:
      context_k: 5
      boost_keywords:
        - "неравноценный обмен"
        - "без доплаты"
        - "ст. 575 ГК"
        - "дарение между коммерческими"
      rerank: true

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 5: CHECKS_V8 — LLM/hybrid проверки
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  - id: barter_subject_extraction
    name: "Мена: извлечение предмета договора (оба товара)"
    description: >
      Извлекает наименование, количество, характеристики и стоимость
      обоих обмениваемых товаров, определяет равноценность/неравноценность.
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "товар"
        - "обмениваемый"
        - "передаёт"
        - "получает"
        - "наименование"
        - "количество"
        - "стоимость"
        - "равноценный"
        - "неравноценный"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|тыс|млн)"
        - "(?i)товар\\s+[«\"]?[А-Яа-яA-Za-z]"
        - "(?i)сторон(а|ы)\\s+[12].*передаёт"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор мены (бартера).
        Твоя задача — найти в тексте описание ОБОИХ обмениваемых товаров.

        Ответь строго в JSON-формате:
        {
          "good_A": {
            "name": "<наименование товара A или not_found>",
            "quantity": "<количество с единицей или not_found>",
            "value": "<стоимость или not_found>",
            "description": "<краткое описание или not_found>"
          },
          "good_B": {
            "name": "<наименование товара B или not_found>",
            "quantity": "<количество с единицей или not_found>",
            "value": "<стоимость или not_found>",
            "description": "<краткое описание или not_found>"
          },
          "equivalence": "<equal / unequal / not_specified / not_found>",
          "surcharge_amount": "<сумма доплаты или not_applicable / not_found>",
          "surcharge_payer": "<сторона, обязанная доплатить, или not_applicable / not_found>"
        }

        ВАЖНО: Возвращай only_found_in_text. Если значение явно не указано — пиши "not_found".
      prompt_file: null
      context_k: 8
      temperature: 0.0
      max_tokens: 700
    retrieval:
      context_k: 8
      max_chunks: 10
      boost_keywords:
        - "обмениваемый товар"
        - "передаёт"
        - "получает"
        - "стоимость"
        - "равноценность"
        - "доплата"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 50
      max_snippet_length: 800
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "good_A_name"
          type: "string"
          keyword_hints: ["товар", "передаёт", "Сторона 1", "первый товар"]
          description: "Наименование товара A"
        - name: "good_B_name"
          type: "string"
          keyword_hints: ["товар", "передаёт", "Сторона 2", "второй товар"]
          description: "Наименование товара B"
        - name: "good_A_value"
          type: "number"
          keyword_hints: ["стоимость", "оценивается", "рублей"]
          unit: "RUB"
          description: "Стоимость товара A"
        - name: "good_B_value"
          type: "number"
          keyword_hints: ["стоимость", "оценивается", "рублей"]
          unit: "RUB"
          description: "Стоимость товара B"
        - name: "equivalence"
          type: "string"
          allowed_values: ["equal", "unequal", "not_specified", "not_found"]
          description: "Равноценность/неравноценность товаров"
        - name: "surcharge_amount"
          type: "number"
          keyword_hints: ["доплата", "разница", "компенсация"]
          unit: "RUB"
          description: "Сумма доплаты при неравноценности"
      store_payload: true

  - id: simultaneous_transfer_mechanism_check
    name: "Механизм обеспечения одновременности передачи / встречного предоставления (ст. 328, 570 ГК РФ)"
    description: >
      Проверяет наличие механизма защиты при обмене: одновременная передача,
      эскроу, аккредитив, задаток, банковская гарантия и т.п.
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "одновременная передача"
        - "одновременно"
        - "аккредитив"
        - "эскроу"
        - "банковская ячейка"
        - "обеспечительный платеж"
        - "задаток"
        - "встречное исполнение"
        - "передача через третье лицо"
        - "депозит нотариуса"
        - "банковская гарантия"
        - "поручительство"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)передача.*осуществляется.*одновременно"
        - "(?i)исполнение.*обеими.*сторонами.*одновременно"
        - "(?i)встречно(е|го)\\s+исполнен"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор мены (бартера).
        Проверь наличие механизма обеспечения одновременности передачи или защиты при последовательном исполнении.

        Ответь строго в JSON:
        {
          "transfer_mode": "<simultaneous / sequential / not_specified / not_found>",
          "security_mechanism": "<escrow / accreditive / bank_cell / deposit / guarantee / notary_deposit / none / not_found>",
          "who_transfers_first": "<party_A / party_B / simultaneous / not_specified / not_found>",
          "snippet": "<цитата из договора или not_found>"
        }

        ВАЖНО: Если условие явно не указано — пиши "not_found".
      prompt_file: null
      context_k: 6
      temperature: 0.0
      max_tokens: 400
    retrieval:
      context_k: 6
      max_chunks: 8
      boost_keywords:
        - "одновременная передача"
        - "встречное исполнение"
        - "обеспечение"
        - "эскроу"
        - "аккредитив"
        - "ст. 328"
        - "ст. 570"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "transfer_mode"
          type: "string"
          allowed_values: ["simultaneous", "sequential", "not_specified", "not_found"]
          description: "Режим передачи товаров"
        - name: "security_mechanism"
          type: "string"
          allowed_values: ["escrow", "accreditive", "bank_cell", "deposit", "guarantee", "notary_deposit", "none", "not_found"]
          description: "Механизм обеспечения"
      store_payload: true

  - id: ownership_transfer_timing_check
    name: "Момент перехода права собственности (ст. 570 ГК РФ)"
    description: >
      Проверяет чёткое определение момента перехода права собственности на обмениваемые
