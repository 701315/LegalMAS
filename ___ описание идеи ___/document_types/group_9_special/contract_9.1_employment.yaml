type: contract_9.1_employment
name: "Трудовой договор"

description: |
  Соглашение между работодателем (юридическим/физическим лицом, ИП) и работником (физическим лицом),
  по которому работник обязуется ЛИЧНО ВЫПОЛНЯТЬ трудовую функцию (работу по должности/профессии/специальности)
  С ПОДЧИНЕНИЕМ ПРАВИЛАМ ВНУТРЕННЕГО ТРУДОВОГО РАСПОРЯДКА,
  а работодатель обязуется предоставлять работу, обеспечивать условия труда,
  СВОЕВРЕМЕННО И В ПОЛНОМ РАЗМЕРЕ ВЫПЛАЧИВАТЬ ЗАРАБОТНУЮ ПЛАТУ
  и соблюдать права работника, предусмотренные трудовым законодательством.
  
  Регулируется ИМПЕРАТИВНЫМИ НОРМАМИ ТК РФ — условия договора не могут ухудшать
  положение работника по сравнению с установленным трудовым законодательством (ст. 9 ТК РФ).
  Широкий спектр социальных гарантий: оплачиваемый отпуск, больничный, МРОТ,
  защита от необоснованного увольнения.
  
  РИСК ПЕРЕКВАЛИФИКАЦИИ: ГПХ-договоры (подряда, услуг) могут быть переквалифицированы
  в трудовые при наличии признаков трудовых отношений (ст. 15, 19.1 ТК РФ) →
  доначисление налогов, взносов, штрафы.

version: 4.0
parent: class_9_special_imperative

metadata:
  category: contract
  subcategory: employment
  complexity: high
  risk_level: critical
  jurisdiction: RU
  language: ru
  legal_base: "ТК РФ Раздел III (ст. 56–90)"
  doc_types_supported:
    - "трудовой договор"
    - "срочный трудовой договор"
    - "договор о дистанционной работе"
    - "договор дистанционной работы"
    - "трудовой договор по совместительству"
    - "договор по совместительству"
    - "трудовой договор с руководителем организации"
    - "трудовой контракт"
    - "контракт с генеральным директором"
    - "трудовой договор с генеральным директором"
    - "соглашение о неполном рабочем времени"

    - "employment agreement"
    - "contract of employment"
    - "executive employment contract"
    - "executive service agreement"
    - "labor contract"
    - "fixed-term employment agreement"
    - "part-time employment agreement"
    - "remote work agreement"
    - "probation period agreement"
    - "secondment agreement"

engine_expectations:
  evidence_required: true
  evidence_style: "pinpoint"
  allow_not_found: true
  output_style: "dd_grid"
  prefer_structured_outputs: true

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 1: КЛАССИФИКАЦИЯ (L1/L2)
#  Читается: YAMLRegistry → L1FilenameClassifier, L2HeaderClassifier
# ════════════════════════════════════════════════════════════════════════════

classification_runtime_v1:

  scoring:
    accept_threshold: 0.8
    strong_signal_threshold: 0.9
    ambiguity_margin: 0.18
    input_quality_weight: 1.0

  rules:

    filename_patterns:
      - pattern: "(?i)\\bтрудов[а-я]*[\\s_.-]*договор\\b"
        kind: specific_subject
        weight: 1.0
        # Прямое наименование трудового договора

      - pattern: "(?i)\\bтрудов[а-я]*[\\s_.-]*контракт\\b"
        kind: specific_subject
        weight: 0.98
        # Трудовой контракт — синоним трудового договора из supported types

      - pattern: "(?i)\\bсрочн[а-я]*[\\s_.-]*трудов[а-я]*[\\s_.-]*договор\\b"
        kind: specific_subject
        weight: 0.98
        # Срочный трудовой договор — из supported types

      - pattern: "(?i)\\bдоговор[\\s_.-]*(?:о[\\s_.-]*)?дистанционн[а-я]*[\\s_.-]*работ[а-я]*\\b"
        kind: specific_subject
        weight: 0.96
        # Договор дистанционной работы — из supported types; прямой трудовой режим

      - pattern: "(?i)\\bтрудов[а-я]*[\\s_.-]*договор[\\s_.-]*по[\\s_.-]*совместительств[аую]\\b|\\bдоговор[\\s_.-]*по[\\s_.-]*совместительств[аую]\\b"
        kind: specific_subject
        weight: 0.96
        # Трудовой договор по совместительству — из supported types

      - pattern: "(?i)\\b(?:трудов[а-я]*[\\s_.-]*)?договор[\\s_.-]*с[\\s_.-]*(?:генеральн[а-я]*[\\s_.-]*директор[а-я]*|руководител[а-я]*[\\s_.-]*организаци[яи])\\b|\\bконтракт[\\s_.-]*с[\\s_.-]*генеральн[а-я]*[\\s_.-]*директор[а-я]*\\b"
        kind: specific_subject
        weight: 0.96
        # Трудовой договор с руководителем / генеральным директором — из supported types

      - pattern: "(?i)\\bсоглашени[ея][\\s_.-]*о[\\s_.-]*неполн[а-я]*[\\s_.-]*рабочем[\\s_.-]*времен[аи]\\b"
        kind: specific_subject
        weight: 0.92
        # Соглашение о неполном рабочем времени — из supported types

      - pattern: "(?i)\\bemployment[\\s_.-]*(?:agreement|contract)\\b"
        kind: specific_subject
        weight: 0.96
        # Employment agreement / contract — прямые английские маркеры трудового договора

      - pattern: "(?i)\\bcontract[\\s_.-]*of[\\s_.-]*employment\\b"
        kind: specific_subject
        weight: 0.97
        # Contract of employment — классическая английская форма

      - pattern: "(?i)\\b(?:fixed[\\s_.-]*term|part[\\s_.-]*time|remote[\\s_.-]*work)[\\s_.-]*employment[\\s_.-]*(?:agreement|contract)?\\b"
        kind: specific_subject
        weight: 0.94
        # Fixed-term / part-time / remote work employment — из supported types

      - pattern: "(?i)\\bprobation[\\s_.-]*period[\\s_.-]*(?:agreement|contract)?\\b"
        kind: specific_subject
        weight: 0.88
        # Probation period agreement — из supported types; испытательный срок характерен для трудового договора

      - pattern: "(?i)\\bexecutive[\\s_.-]*employment[\\s_.-]*(?:agreement|contract)?\\b"
        kind: specific_subject
        weight: 0.92
        # Executive employment contract — из supported types; employment-qualifier указывает на трудовой режим

      - pattern: "(?i)\\bexecutive[\\s_.-]*service[\\s_.-]*(?:agreement|contract)?\\b"
        kind: generic_form
        weight: 0.58
        # Executive service agreement — из supported types, но в ряде юрисдикций это service contract, а не трудовой договор

      - pattern: "(?i)\\bsecondment[\\s_.-]*(?:agreement|contract)?\\b"
        kind: generic_form
        weight: 0.54
        # Secondment agreement — из supported types; временное откомандирование, потенциально отдельный тип

      - pattern: "(?i)\\blabor[\\s_.-]*(?:agreement|contract)\\b"
        kind: generic_form
        weight: 0.62
        # Labor agreement / contract — из supported types; в международном контексте может быть шире employment

      - pattern: "(?i)\\bwork[\\s_.-]*contract\\b"
        kind: generic_form
        weight: 0.48
        # Work contract без employment-квалификатора: может быть works contract / подряд

      - pattern: "(?i)\\bтрудов[а-я]*\\b"
        kind: context
        weight: 0.22
        # Трудовой без договор/контракт: трудовая книжка, трудовое законодательство и т.п.

      - pattern: "(?i)\\bemployment\\b"
        kind: context
        weight: 0.20
        # Employment без agreement/contract: employment policy, employment law и т.п.

      - pattern: "(?i)\\bwork(?:place|force|er)?\\b"
        kind: context
        weight: 0.12
        # Work/workplace/worker без contract-квалификатора слишком широко


    folder_patterns:
      - pattern: "(?i)трудов[а-я]*[_\\s-]*(?:договор|контракт)|employment[_\\s-]*(?:agreement|contract)"
        kind: specific_subject
        weight: 0.86
        # Прямая taxonomy трудовых договоров

      - pattern: "(?i)(?:срочн[а-я]*[_\\s-]*трудов|совместительств|дистанционн[а-я]*[_\\s-]*работ|неполн[а-я]*[_\\s-]*рабочее[_\\s-]*врем)"
        kind: specific_subject
        weight: 0.82
        # Subtype папки трудовых договоров из supported types

      - pattern: "(?i)(?:fixed[_\\s-]*term|part[_\\s-]*time|remote[_\\s-]*work|probation[_\\s-]*period)[_\\s-]*employment"
        kind: specific_subject
        weight: 0.82
        # Англоязычные employment subtype папки

      - pattern: "(?i)(?:генеральн[а-я]*[_\\s-]*директор|руководител[а-я]*|executive)[_\\s-]*(?:трудов|employment|contract)"
        kind: specific_subject
        weight: 0.80
        # Папки по договорам с руководителями / executives

      - pattern: "(?i)executive[_\\s-]*service[_\\s-]*(?:agreement)?|secondment[_\\s-]*(?:agreement)?"
        kind: generic_form
        weight: 0.50
        # Executive service / secondment — полезны в HR-контексте, но шире трудового договора

      - pattern: "(?i)labor[_\\s-]*(?:agreement|contract|relations)|трудов[а-я]*[_\\s-]*отношени"
        kind: generic_form
        weight: 0.52
        # Labor relations / трудовые отношения — шире трудового договора как документа

      - pattern: "(?i)employment|трудов"
        kind: context
        weight: 0.24
        # Общие employment / трудовой папки без уточнения типа документа

      - pattern: "(?i)hr|кадр|personnel|персонал"
        kind: context
        weight: 0.16
        # HR/кадровая папка охватывает всю кадровую документацию, не только трудовые договоры

    keywords:

      high:
        - pattern: "(?i)трудов[ойое]\\s+договор"
          weight: 1.0
          distinctiveness: high
          context: header
          description: "Основное название трудового договора"

        - pattern: "(?i)срочн[ыйое]\\s+трудов[ойое]\\s+договор"
          weight: 0.95
          distinctiveness: high
          context: any
          description: "Срочный трудовой договор"

        - pattern: "(?i)договор\\s+о\\s+дистанционн[ойой]\\s+работ[еы]"
          weight: 0.9
          distinctiveness: high
          context: any
          description: "Договор о дистанционной/удалённой работе в трудовом формате"

        - pattern: "(?i)трудов[ойое]\\s+договор\\s+по\\s+совместительств[уы]"
          weight: 0.9
          distinctiveness: high
          context: any
          description: "Трудовой договор по совместительству"

        - pattern: "(?i)трудов[ойое]\\s+договор\\s+с\\s+руководител[емя]\\s+организац[иии]"
          weight: 0.9
          distinctiveness: high
          context: any
          description: "Трудовой договор с руководителем организации"

        - pattern: "(?i)трудов[ойое]\\s+контракт"
          weight: 0.9
          distinctiveness: high
          context: header
          description: "Трудовой контракт как форма трудового договора"

        - pattern: "(?i)работник[ауы]"
          weight: 0.85
          distinctiveness: high
          context: any
          description: "Работник как сторона трудового договора"

        - pattern: "(?i)работодател[ьяеи]"
          weight: 0.85
          distinctiveness: high
          context: any
          description: "Работодатель как сторона трудового договора"

        - pattern: "(?i)трудов[аяое]\\s+функц[ияи]"
          weight: 0.9
          distinctiveness: high
          context: any
          description: "Трудовая функция — признак трудовых отношений"

        - pattern: "(?i)должност[ьью]"
          weight: 0.85
          distinctiveness: high
          context: any
          description: "Должность в штатной структуре работодателя"

        - pattern: "(?i)заработн[аяое]\\s+плат[ауы]"
          weight: 0.9
          distinctiveness: high
          context: any
          description: "Заработная плата как форма оплаты труда"

        - pattern: "(?i)оплат[ауы]\\s+труд[ауы]"
          weight: 0.9
          distinctiveness: high
          context: any
          description: "Оплата труда, а не вознаграждение по ГПХ"

        - pattern: "(?i)правил[аы]\\s+внутренн[егоей\\s]*трудов[огоой\\s]*распорядк[ауы]"
          weight: 0.95
          distinctiveness: high
          context: any
          description: "Подчинение правилам внутреннего трудового распорядка"

        - pattern: "(?i)подчинен[иеия]"
          weight: 0.85
          distinctiveness: high
          context: any
          description: "Подчинение работника работодателю по процессу труда"

        - pattern: "(?i)личн[оеая]\\s+выполнен[иеия]\\s+трудов[ойой\\s]*функц[иии]"
          weight: 0.95
          distinctiveness: high
          context: any
          description: "Личное выполнение трудовой функции — отличие от подряда/услуг"

        - pattern: "(?i)ст\\.?\\s*56\\s+тк\\s+рф"
          weight: 0.9
          distinctiveness: high
          context: any
          description: "Прямая ссылка на определение трудового договора"

        - pattern: "(?i)ст\\.?\\s*57\\s+тк\\s+рф"
          weight: 0.85
          distinctiveness: high
          context: any
          description: "Статья ТК РФ о содержании трудового договора"

      medium:
        - pattern: "(?i)должностн[а-яё]+\\s+инструкци[яяи]"
          weight: 0.65
          distinctiveness: medium
          context: any
          description: "Должностная инструкция как приложение к трудовому договору"

        - pattern: "(?i)рабоч[еое]\\s+мест[оо]"
          weight: 0.55
          distinctiveness: medium
          context: any
          description: "Рабочее место работника"

        - pattern: "(?i)график\\s+работ[ыы]"
          weight: 0.55
          distinctiveness: medium
          context: any
          description: "График работы, режим рабочего времени"

        - pattern: "(?i)\\bоклад\\b"
          weight: 0.6
          distinctiveness: medium
          context: any
          description: "Оклад как фиксированная часть заработной платы"

        - pattern: "(?i)тарифн[а-яё]+\\s+ставк[аа]"
          weight: 0.55
          distinctiveness: medium
          context: any
          description: "Тарифная ставка по должности"

        - pattern: "(?i)\\bотпуск\\b"
          weight: 0.6
          distinctiveness: medium
          context: any
          description: "Оплачиваемый отпуск как трудовая гарантия"

        - pattern: "(?i)больничн[ыо]й\\s+лист"
          weight: 0.55
          distinctiveness: medium
          context: any
          description: "Больничный лист (лист нетрудоспособности)"

        - pattern: "(?i)испытательн[ыо]й\\s+срок"
          weight: 0.6
          distinctiveness: medium
          context: any
          description: "Испытательный срок при приёме на работу"

        - pattern: "(?i)срочн[ыо]й\\s+трудов[оа]й\\s+договор"
          weight: 0.6
          distinctiveness: medium
          context: any
          description: "Уточнение режима срочного трудового договора"

        - pattern: "(?i)обязательн[оа]е\\s+социальн[оа]е\\s+страховани[ея]"
          weight: 0.55
          distinctiveness: medium
          context: any
          description: "Обязательное социальное страхование работников"

        - pattern: "(?i)\\bСОУТ\\b"
          weight: 0.5
          distinctiveness: medium
          context: any
          description: "Специальная оценка условий труда (СОУТ)"

      low:
        - pattern: "(?i)коллективн[ыо]й\\s+договор"
          weight: 0.35
          distinctiveness: low
          context: any
          description: "Коллективный договор в сфере труда"

        - pattern: "(?i)трудов[а-яё]+\\s+книжк[аа]"
          weight: 0.3
          distinctiveness: low
          context: any
          description: "Трудовая книжка"

        - pattern: "(?i)приказ\\s+о\\s+при[её]м[ее]"
          weight: 0.3
          distinctiveness: low
          context: any
          description: "Приказ о приёме на работу"

        - pattern: "(?i)материальн[а-яё]+\\s+ответственност[ьи]"
          weight: 0.3
          distinctiveness: low
          context: any
          description: "Материальная ответственность работника"

        - pattern: "(?i)\\bсовместительств[оо]\\b"
          weight: 0.3
          distinctiveness: low
          context: any
          description: "Совместительство как режим работы"

        - pattern: "(?i)дистанционн[а-яё]+\\s+работ[аа]"
          weight: 0.3
          distinctiveness: low
          context: any
          description: "Упоминание дистанционной работы в общем виде"

        - pattern: "(?i)вахтов[ыо]й\\s+метод"
          weight: 0.25
          distinctiveness: low
          context: any
          description: "Вахтовый метод работы"

    exclusions:
      - pattern: "(?i)договор\\s+подряд[аа]"
        severity: hard
        weight: -1.0
        description: "Договор подряда — гражданско-правовой, а не трудовой"

      - pattern: "(?i)договор\\s+возмездн[оа]го\\s+оказани[яя]\\s+услуг"
        severity: hard
        weight: -1.0
        description: "Договор услуг относится к ГПХ, а не к трудовым отношениям"

      - pattern: "(?i)гражданско-?правов[оа]й\\s+договор"
        severity: hard
        weight: -1.0
        description: "Прямое указание на гражданско-правовой характер договора"

      - pattern: "(?i)агентск[иоя]+\\s+договор"
        severity: hard
        weight: -1.0
        description: "Агентский договор — посреднический ГПХ, а не трудовой"

      # ── Soft exclusions

      - pattern: "(?i)договор\\s+о\\s+прохождени[ии]\\s+практик[ии]"
        severity: soft
        weight: -0.35
        description: "Договор о практике ближе к учебным/стажёрским формам, а не к штатному трудовому договору"

      - pattern: "(?i)волонт[её]рств[оо]"
        severity: soft
        weight: -0.35
        description: "Волонтёрство предполагает безвозмездный труд, не классический трудовой договор"

      - pattern: "(?i)ученическ[иоя]+\\s+договор"
        severity: soft
        weight: -0.3
        description: "Ученический договор имеет особый режим, отличающийся от стандартного трудового договора"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 2: ТРИГГЕРЫ
#  Читается: TriggerDetector → doc.applicable_triggers
# ════════════════════════════════════════════════════════════════════════════

trigger_definitions:

  indefinite_term:
    any_keywords:
      - "(?i)\\bбессрочн[ыо]й\\b"
      - "(?i)на\\s+неопредел[её]нн[ыо]й\\s+срок"
      - "(?i)без\\s+указани[яя]\\s+срока"

  fixed_term:
    any_keywords:
      - "(?i)срочн[ыо]й\\s+трудов[оа]й\\s+договор"
      - "(?i)заключ[её]н\\s+на\\s+срок"
      - "(?i)на\\s+период"
      - "(?i)временн[а-яё]+\\s+работ[аа]"
      - "(?i)сезонн[а-яё]+\\s+работ[аа]"
      - "(?i)ст\\.\\s*59\\s*ТК\\s*РФ"

  probation_period:
    any_keywords:
      - "(?i)испытательн[ыо]й\\s+срок"
      - "(?i)\\bиспытани[ея]\\b"
      - "(?i)срок\\s+испытани[яя]"

  remote_work:
    any_keywords:
      - "(?i)дистанционн[а-яё]+\\s+работ[аа]"
      - "(?i)удал[её]нн[а-яё]+\\s+работ[аа]"
      - "(?i)вне\\s+мест[аа]\\s+нахождени[яя]\\s+работодател[яя]"
      - "(?i)ст\\.\\s*312\\.1\\s*ТК\\s*РФ"

  harmful_conditions:
    any_keywords:
      - "(?i)вредн[ыо]е\\s+услови[яя]"
      - "(?i)опасн[ыо]е\\s+услови[яя]"
      - "(?i)спецоценк[аа]\\s+услови[йя]\\s+труда"
      - "(?i)\\bСОУТ\\b"
      - "(?i)класс\\s+услови[йя]\\s+труда\\s*3"
      - "(?i)класс\\s+услови[йя]\\s+труда\\s*4"

  part_time:
    any_keywords:
      - "(?i)неполн[оа]е\\s+рабоч[ео]е\\s+время"
      - "(?i)неполн[ыо]й\\s+рабоч[иоя]+\\s+день"
      - "(?i)неполн[а-яё]+\\s+рабоч[а-яё]+\\s+недел[яя]"

  shift_work:
    any_keywords:
      - "(?i)сменн[ыо]й\\s+график"
      - "(?i)сменн[а-яё]+\\s+работ[аа]"
