      mode: "hybrid"
      fields:
        - name: "overtime_allowed"
          type: "string"
          allowed_values: ["yes", "no", "unclear"]
          description: "Допускается ли сверхурочная работа"
      store_payload: true

  - id: discrimination_check
    name: "Проверка на дискриминационные условия (ст. 3 ТК РФ)"
    description: |
      Выявляет условия, содержащие прямую или косвенную дискриминацию
      по полу, возрасту, национальности, вероисповеданию и иным основаниям.
    triggers:
      any: ["discrimination_risk"]
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "дискриминация"
        - "запрет дискриминации"
        - "равная оплата"
        - "не допускается ограничение"
      keyword_mode: "any"
      negative_keywords:
        - "только мужчины"
        - "только женщины"
        - "возраст не старше"
        - "возраст не моложе"
        - "без инвалидности"
      regex_patterns: []
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий трудовой договор.
        Проверь наличие дискриминационных условий (ст. 3 ТК РФ).

        Ответь строго в JSON:
        {
          "discrimination_detected": "<yes / no / unclear>",
          "discrimination_details": "<описание или not_found>",
          "equal_pay_mentioned": "<yes / no / not_found>"
        }

        ВАЖНО: Любые ограничения прав по полу, возрасту, национальности — дискриминация (ст. 3 ТК РФ).
        Если значение явно не указано — пиши "not_found".
      prompt_file: null
      context_k: 6
      temperature: 0.0
      max_tokens: 400
    retrieval:
      context_k: 6
      max_chunks: 8
      boost_keywords:
        - "дискриминация"
        - "равная оплата"
        - "ограничение прав"
        - "ст. 3 ТК РФ"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "discrimination_detected"
          type: "string"
          allowed_values: ["yes", "no", "unclear"]
          description: "Выявлены ли дискриминационные условия"
      store_payload: true

  - id: employee_rights_restriction_check
    name: "Ограничение прав работника (ст. 9 ТК РФ)"
    description: |
      Выявляет условия, ухудшающие положение работника по сравнению с ТК РФ:
      отказ от отпуска, снижение зарплаты ниже МРОТ, отказ от обращения в суд.
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "отказ от отпуска"
        - "отказ от больничного"
        - "работник не вправе обращаться в суд"
        - "снижение гарантий"
        - "ухудшение положения"
        - "запрет на обращение в ГИТ"
      keyword_mode: "any"
      negative_keywords:
        - "работник отказывается от права на отпуск"
        - "работник обязуется не обращаться"
        - "компенсация отпуска деньгами"
      regex_patterns: []
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий трудовой договор.
        Проверь, нет ли условий, ухудшающих положение работника (ст. 9 ТК РФ).

        Ответь строго в JSON:
        {
          "rights_restriction_detected": "<yes / no / unclear>",
          "restriction_details": "<описание или not_found>"
        }

        ВАЖНО: Условия, ограничивающие права работника, — ничтожны (ст. 9 ТК РФ).
        Если значение явно не указано — пиши "not_found".
      prompt_file: null
      context_k: 8
      temperature: 0.0
      max_tokens: 400
    retrieval:
      context_k: 8
      max_chunks: 10
      boost_keywords:
        - "ухудшение положения"
        - "отказ от права"
        - "ст. 9 ТК РФ"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "rights_restriction_detected"
          type: "string"
          allowed_values: ["yes", "no", "unclear"]
          description: "Выявлено ли ограничение прав"
      store_payload: true

  - id: non_compete_clause_check
    name: "Запрет конкуренции после увольнения (non-compete)"
    description: |
      Проверяет наличие условий о запрете конкуренции или переманивания
      клиентов/сотрудников после увольнения. В российском трудовом праве такие
      условия НЕ ИМЕЮТ ЮРИДИЧЕСКОЙ СИЛЫ (не предусмотрены ТК РФ),
      но часто включаются в договоры.
    triggers: {}
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "запрет конкуренции"
        - "non-compete"
        - "не конкурировать"
        - "запрет переманивания"
        - "non-solicitation"
        - "не трудоустраиваться в конкурирующую"
        - "не работать у конкурентов"
        - "ограничение трудоустройства"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)запрет.*конкуренц"
        - "(?i)non[\\s-]?compete"
        - "(?i)не\\s+(трудоустраиваться|работать).*конкурент"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий трудовой договор.
        Проверь наличие условий о запрете конкуренции (non-compete) после увольнения.

        Ответь строго в JSON:
        {
          "non_compete_clause": "<present / not_found>",
          "non_solicitation_clause": "<present / not_found>",
          "enforceability_risk": "<unenforceable_under_russian_law / enforceable / unclear / not_applicable>",
          "non_compete_snippet": "<цитата или not_found>"
        }

        ВАЖНО: В России условия о запрете конкуренции после увольнения
        НЕ ИМЕЮТ юридической силы — они не предусмотрены ТК РФ и ограничивают
        конституционное право на труд (ст. 37 Конституции РФ).
        Если значение явно не указано — пиши "not_found".
      prompt_file: null
      context_k: 5
      temperature: 0.0
      max_tokens: 400
    retrieval:
      context_k: 5
      max_chunks: 8
      boost_keywords:
        - "запрет конкуренции"
        - "non-compete"
        - "не трудоустраиваться"
        - "конкурент"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "non_compete_clause"
          type: "string"
          allowed_values: ["present", "not_found"]
          description: "Наличие условия о запрете конкуренции"
        - name: "enforceability_risk"
          type: "string"
          allowed_values: ["unenforceable_under_russian_law", "enforceable", "unclear", "not_applicable"]
          description: "Юридическая сила условия"
      store_payload: true

  - id: dispute_resolution
    name: "Процедура разрешения трудовых споров"
    description: |
      Досудебное урегулирование: переговоры, КТС, медиация.
    triggers: {}
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "досудебный порядок"
        - "переговоры"
        - "комиссия по трудовым спорам"
        - "КТС"
        - "медиация"
      keyword_mode: "any"
      regex_patterns: []
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий трудовой договор.
        Проверь процедуру разрешения споров.

        Ответь строго в JSON:
        {
          "dispute_resolution": "<процедура или not_found>"
        }

        Если значение явно не указано — пиши "not_found".
      prompt_file: null
      context_k: 4
      temperature: 0.0
      max_tokens: 200
    retrieval:
      context_k: 4
      max_chunks: 6
      boost_keywords:
        - "споры"
        - "разрешение"
        - "КТС"
      rerank: true
      filters: {}
    evidence:
      required: false
      min_snippet_length: 30
      max_snippet_length: 400
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "dispute_resolution"
          type: "string"
          description: "Процедура разрешения споров"
      store_payload: true

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 6: DOC_TYPE_CHECKS — авто-конвертируемые проверки (rules)
#  Читается: DocTypeCheckConverter
# ════════════════════════════════════════════════════════════════════════════

doc_type_checks:

  - id: "parties_employer_employee"
    name: "Стороны: работодатель и работник"
    description: "Проверка наличия сторон"
    legal_base: "ст. 56 ТК РФ"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "работодатель"
        - "работник"
      keyword_mode: "any"
      regex_patterns: []

  - id: "labor_function_mandatory_rule"
    name: "Трудовая функция (обязательна)"
    description: "Без трудовой функции договор незаключён"
    legal_base: "ст. 57 ТК РФ"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "трудовая функция"
        - "работа по должности"
        - "профессия"
        - "специальность"
      keyword_mode: "any"
      regex_patterns: []

  - id: "place_of_work_mandatory_rule"
    name: "Место работы (обязательно)"
    description: "С указанием адреса и подразделения"
    legal_base: "ст. 57 ТК РФ"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "место работы"
        - "адрес"
        - "структурное подразделение"
      keyword_mode: "any"
      regex_patterns: []

  - id: "start_date_mandatory"
    name: "Дата начала работы (обязательна)"
    description: "Проверка наличия даты начала"
    legal_base: "ст. 57, 61 ТК РФ"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "дата начала работы"
        - "приступить к работе"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"

  - id: "fixed_term_basis"
    name: "Срочный договор: основание по ст. 59 ТК РФ"
    description: "Без основания → бессрочный"
    legal_base: "ст. 58, 59 ТК РФ"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
      any: ["fixed_term"]
    rules:
      keywords:
        - "основание"
        - "ст. 59"
        - "срочный"
      keyword_mode: "any"
      regex_patterns: []

  - id: "payment_terms_mandatory"
    name: "Условия оплаты труда (обязательны)"
    description: "Оклад, надбавки, сроки"
    legal_base: "ст. 57, 136 ТК РФ"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "оклад"
        - "тарифная ставка"
        - "заработная плата"
        - "выплата"
      keyword_mode: "any"
      regex_patterns: []

  - id: "working_hours_clause"
    name: "Режим рабочего времени"
    description: "Продолжительность, график"
    legal_base: "ст. 57, 91 ТК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "режим рабочего времени"
        - "продолжительность"
        - "график"
      keyword_mode: "any"
      regex_patterns: []

  - id: "annual_leave_clause"
    name: "Ежегодный оплачиваемый отпуск"
    description: "Не менее 28 дней"
    legal_base: "ст. 114, 115 ТК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "ежегодный оплачиваемый отпуск"
        - "отпуск продолжительностью"
        - "28 календарных дней"
      keyword_mode: "any"
      regex_patterns: []

  - id: "harmful_conditions_clause"
    name: "Гарантии за вредные условия (если применимо)"
    description: "Обязательны при вредных условиях"
    legal_base: "ст. 57, 92, 117, 147 ТК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
      any: ["harmful_conditions"]
    rules:
      keywords:
        - "вредные условия"
        - "гарантии"
        - "компенсации"
        - "доплата"
      keyword_mode: "any"
      regex_patterns: []

  - id: "social_insurance_clause"
    name: "Обязательное социальное страхование"
    description: "Обязательное условие"
    legal_base: "ст. 57 ТК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "социальное страхование"
        - "обязательное страхование"
        - "пенсионное страхование"
      keyword_mode: "any"
      regex_patterns: []

  - id: "work_nature_clause"
    name: "Характер работы (разъездной, в пути, подвижной)"
    description: "Обязательно указать, если характер работы особый"
    legal_base: "ст. 57 ТК РФ"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "характер работы"
        - "разъездной"
        - "в пути"
        - "подвижной"
        - "в полевых условиях"
      keyword_mode: "any"
      regex_patterns: []

  - id: "workplace_conditions_sout"
    name: "Условия труда на рабочем месте по результатам СОУТ"
    description: "Обязательное условие с 2014 года (ФЗ-426)"
    legal_base: "ст. 57 ТК РФ, ФЗ-426"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "условия труда на рабочем месте"
        - "результаты СОУТ"
        - "класс условий труда"
        - "допустимые условия"
        - "оптимальные условия"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)класс\\s+условий\\s+труда\\s+\\d"

  - id: "pension_insurance_clause"
    name: "Обязательное пенсионное страхование"
    description: "Проверка наличия условия об ОПС"
    legal_base: "ст. 57 ТК РФ"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "пенсионное страхование"
        - "обязательное пенсионное"
        - "ОПС"
        - "СНИЛС"
      keyword_mode: "any"
      regex_patterns: []

  - id: "personal_data_clause"
    name: "Согласие на обработку персональных данных"
    description: "Проверка наличия условия об обработке персональных данных"
    legal_base: "ФЗ-152, ст. 86–90 ТК РФ"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "персональные данные"
        - "обработка персональных данных"
        - "согласие на обработку"
        - "ФЗ-152"
      keyword_mode: "any"
      regex_patterns: []

  - id: "termination_procedure"
    name: "Порядок расторжения трудового договора"
    description: "Основания и процедура расторжения"
    legal_base: "ст. 77–84.1 ТК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "расторжение трудового договора"
        - "прекращение"
        - "увольнение"
        - "основания расторжения"
        - "по инициативе работника"
        - "по инициативе работодателя"
        - "по соглашению сторон"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)расторжени(е|я)\\s+трудов(ого|ого)"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 7: DD_REQUEST_TEMPLATES
#  Читается: DDRequestTemplateLoader
#  Ключи = check_id из checks_v8 и doc_type_checks выше.
#  DDRequestTemplateLoader.render() матчит по exact или prefix.
# ════════════════════════════════════════════════════════════════════════════

dd_request_templates:

  labor_function_extraction:
    text: >
      Просим чётко указать в {doc_names} трудовую функцию:
      должность/профессию/специальность с квалификацией ИЛИ конкретный вид работы.
      Приложить должностную инструкцию. Без трудовой функции договор незаключён (ст. 57 ТК РФ).
    addressee: "Отдел кадров / Работодатель"

  place_of_work_extraction:
    text: >
      Просим указать в {doc_names} место работы: адрес, подразделение, филиал.
      Для дистанционной — указание на характер работы (ст. 312.1 ТК РФ).
    addressee: "Отдел кадров"

  start_date_and_term:
    text: >
      Просим указать в {doc_names}: (а) дату начала работы;
      (б) для срочного — срок и основание по ст. 59 ТК РФ.
      Без основания → бессрочный (ст. 58 ТК РФ).
    addressee: "Отдел кадров"

  payment_structure:
    text: >
      Просим согласовать для {doc_names}: (а) оклад (не ниже МРОТ, ст. 133 ТК РФ);
      (б) доплаты, надбавки, премии; (в) конкретные даты выплаты
      (не реже 2 раз в месяц, ст. 136 ТК РФ).
    addressee: "Финансовый отдел / Отдел кадров"

  working_hours_and_rest:
    text: >
      Просим согласовать для {doc_names}: (а) продолжительность (≤ 40 ч/нед, ст. 91 ТК РФ);
      (б) график, перерывы, выходные; (в) ненормированный день (если применимо).
    addressee: "Отдел кадров"

  annual_leave:
    text: >
      Просим указать в {doc_names} отпуск: ≥ 28 календарных дней (ст. 115 ТК РФ).
      Дополнительные отпуска (за вредные условия, ненормированный день).
    addressee: "Отдел кадров"

  harmful_conditions_guarantees:
    text: >
      Для {doc_names} (вредные/опасные условия): (а) класс по СОУТ;
      (б) гарантии: сокращённый день, допотпуск, доплата, молоко, СИЗ (ст. 92, 117, 147 ТК РФ).
    addressee: "Отдел охраны труда"

  written_form_two_copies:
    text: >
      {doc_names}: два экземпляра (ст. 67 ТК РФ). Один — работнику.
      Получение подтверждается подписью на экземпляре работодателя.
    addressee: "Отдел кадров"

  probation_period_check:
    text: >
      Если в {doc_names} есть испытание: (а) ≤ 3 мес. (6 для руководителей);
      (б) критерии оценки; (в) проверить запреты (ст. 70 ТК РФ).
    addressee: "Отдел кадров"

  material_liability:
    text: >
      Если для {doc_names} нужна полная МО: (а) должность в перечне (ст. 244 ТК РФ);
      (б) отдельный договор; (в) порядок возмещения.
    addressee: "Юридический отдел"

  confidentiality_trade_secrets:
    text: >
      При доступе к коммерческой тайне: включить в {doc_names} условие о неразглашении
      (ст. 57 ТК РФ, ФЗ-98), ответственность за разглашение.
    addressee: "Юридический отдел"

  dismissal_protection:
    text: >
      Просим в {doc_names}: (а) увольнение только по ст. 81 ТК РФ;
      (б) процедура; (в) выходное пособие; (г) запрет увольнения беременных.
    addressee: "Юридический отдел"

  contract_modification_procedure:
    text: >
      Просим в {doc_names}: (а) изменение по соглашению (ст. 72 ТК РФ);
      (б) по инициативе работодателя — уведомление за 2 мес. (ст. 74 ТК РФ).
    addressee: "Юридический отдел"

  workplace_safety:
    text: >
      Просим в {doc_names}: (а) безопасные условия (ст. 214 ТК РФ);
      (б) СОУТ (ФЗ-426); (в) СИЗ; (г) инструктаж.
    addressee: "Отдел охраны труда"

  overtime_compensation:
    text: >
      Просим в {doc_names}: (а) согласие работника (ст. 99 ТК РФ);
      (б) оплата ≥ 1.5x (ст. 152 ТК РФ); (в) выходные — 2x (ст. 153 ТК РФ).
    addressee: "Отдел кадров"

  dispute_resolution:
    text: >
      Рекомендуем в {doc_names}: переговоры, КТС, медиация.
    addressee: "Юридический отдел"

  discrimination_check:
    text: >
      ВНИМАНИЕ: в {doc_names} выявлены дискриминационные условия (ст. 3 ТК РФ).
      Просим исключить ограничения по полу, возрасту, национальности.
    addressee: "Юридический отдел"

  employee_rights_restriction_check:
    text: >
      ВНИМАНИЕ: в {doc_names} выявлены условия, ограничивающие права работника
      (ст. 9 ТК РФ). Такие условия ничтожны. Просим исключить.
    addressee: "Юридический отдел"

  non_compete_clause_check:
    text: >
      В {doc_names} выявлено условие о запрете конкуренции (non-compete).
      В российском трудовом праве такие условия не имеют юридической силы
      (не предусмотрены ТК РФ, ограничивают право на труд — ст. 37 Конституции РФ).
      Просим получить правовое заключение и рассмотреть альтернативы
      (условие о конфиденциальности, NDA).
    addressee: "Юридический отдел"

  parties_employer_employee:
    text: >
      Просим подтвердить реквизиты сторон по {doc_names}.
    addressee: "Отдел кадров"

  labor_function_mandatory_rule:
    text: >
      КРИТИЧНО: В {doc_names} не указана трудовая функция. Незамедлительно дополнить (ст. 57 ТК РФ).
    addressee: "Отдел кадров"

  place_of_work_mandatory_rule:
    text: >
      Просим указать место работы для {doc_names} (ст. 57 ТК РФ).
    addressee: "Отдел кадров"

  start_date_mandatory:
    text: >
      Просим указать дату начала работы для {doc_names}.
    addressee: "Отдел кадров"

  fixed_term_basis:
    text: >
      {doc_names} — срочный. Указать основание по ст. 59 ТК РФ.
      Без основания → бессрочный (ст. 58 ТК РФ).
    addressee: "Юридический отдел"

  payment_terms_mandatory:
    text: >
      Просим указать условия оплаты для {doc_names}.
    addressee: "Финансовый отдел"

  working_hours_clause:
    text: >
      Просим указать режим рабочего времени для {doc_names}.
    addressee: "Отдел кадров"

  annual_leave_clause:
    text: >
      Просим указать отпуск для {doc_names}.
    addressee: "Отдел кадров"

  harmful_conditions_clause:
    text: >
      Для {doc_names} (вредные условия) указать гарантии.
    addressee: "Отдел охраны труда"

  social_insurance_clause:
    text: >
      Просим указать условие об обязательном соцстраховании для {doc_names}.
    addressee: "Отдел кадров"

  work_nature_clause:
    text: >
      Если работа разъездная/в пути/подвижная — указать в {doc_names} (ст. 57 ТК РФ).
    addressee: "Отдел кадров"

  workplace_conditions_sout:
    text: >
      Просим указать в {doc_names} условия труда на рабочем месте
      по результатам СОУТ (класс условий труда).
    addressee: "Отдел охраны труда"

  pension_insurance_clause:
    text: >
      Просим указать условие об ОПС для {doc_names}.
    addressee: "Отдел кадров"

  personal_data_clause:
    text: >
      Просим включить в {doc_names} согласие на обработку персональных данных (ФЗ-152).
    addressee: "Юридический отдел"

  termination_procedure:
    text: >
      Просим указать в {doc_names} порядок расторжения: основания,
      процедура, сроки предупреждения.
    addressee: "Юридический отдел"

  written_form_mandatory:
    text: >
      {doc_names}: письменная форма, два экземпляра (ст. 67 ТК РФ).
    addressee: "Отдел кадров"

  labor_function_mandatory:
    text: >
      КРИТИЧНО: Трудовая функция — обязательное условие (ст. 57 ТК РФ).
      Проверьте наличие в {doc_names}.
    addressee: "Отдел кадров"

  place_of_work_mandatory:
    text: >
      Место работы — обязательное условие (ст. 57 ТК РФ).
      Проверьте наличие в {doc_names}.
    addressee: "Отдел кадров"

  fixed_term_basis_required:
    text: >
      Срочный договор {doc_names} требует основания по ст. 59 ТК РФ.
    addressee: "Юридический отдел"

  salary_not_below_mrot:
    text: >
      Зарплата в {doc_names} НЕ МОЖЕТ быть ниже МРОТ (ст. 133 ТК РФ).
    addressee: "Финансовый отдел"

  requalification_gpkh_to_labor_warning:
    text: >
      РИСК: При признаках трудовых отношений ГПХ → трудовой (ст. 15, 19.1 ТК РФ).
      Последствия: доначисления, штрафы. Правовое заключение для {doc_names}.
    addressee: "Юридический отдел"

  employee_rights_cannot_be_reduced:
    text: >
      ВНИМАНИЕ: условия {doc_names} не могут ухудшать положение работника
      по сравнению с ТК РФ (ст. 9 ТК РФ). Ничтожные условия подлежат исключению.
    addressee: "Юридический отдел"

  # Generic fallback
  _default:
    text: >
      Просим предоставить дополнительную информацию по вопросу «{check_name}»
      применительно к {doc_names}.
    addressee: "Юридический консультант"