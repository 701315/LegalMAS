# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: COMPLIANCE RULES
#  Читается: DocTypeCheckLoader._exclusion_logic_to_checks()
# ════════════════════════════════════════════════════════════════════════════

compliance_rules:

  - id: "written_form_mandatory"
    name: "Письменная форма обязательна (ст. 67 ТК РФ)"
    description: |
      Трудовой договор заключается в письменной форме, в двух экземплярах,
      каждый подписывается сторонами. Один экземпляр — работнику.
    legal_base: "ст. 67 ТК РФ"
    required_triggers: []
    severity: "critical"
    result_if_triggered: "warn"
    detector_type: "rules"
    rules:
      keywords:
        - "в двух экземплярах"
        - "экземпляр для работника"
        - "получение экземпляра подтверждается"
      keyword_mode: "any"
    retrieval:
      context_k: 3
      boost_keywords:
        - "два экземпляра"
        - "письменная форма"
      rerank: true

  - id: "labor_function_mandatory"
    name: "Трудовая функция обязательна (ст. 57 ТК РФ)"
    description: |
      Трудовая функция — обязательное условие. Должна быть указана: работа по должности/
      профессии/специальности с указанием квалификации ИЛИ конкретный вид поручаемой работы.
    legal_base: "ст. 57 ТК РФ"
    required_triggers: []
    severity: "critical"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      keywords:
        - "трудовая функция"
        - "работа по должности"
        - "профессия"
        - "специальность"
        - "должностная инструкция"
      keyword_mode: "any"
    retrieval:
      context_k: 4
      boost_keywords:
        - "трудовая функция"
        - "должность"
      rerank: true

  - id: "place_of_work_mandatory"
    name: "Место работы обязательно (ст. 57 ТК РФ)"
    description: |
      Место работы — обязательное условие. С указанием обособленного подразделения
      и его адреса (если работа в филиале/представительстве).
    legal_base: "ст. 57 ТК РФ"
    required_triggers: []
    severity: "critical"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      keywords:
        - "место работы"
        - "адрес"
        - "структурное подразделение"
        - "филиал"
      keyword_mode: "any"
    retrieval:
      context_k: 4
      boost_keywords:
        - "место работы"
        - "адрес"
      rerank: true

  - id: "fixed_term_basis_required"
    name: "Срочный договор требует основания (ст. 58, 59 ТК РФ)"
    description: |
      Срочный трудовой договор — только при наличии оснований из ст. 59 ТК РФ.
      Без основания → бессрочный.
    legal_base: "ст. 58, 59 ТК РФ"
    required_triggers: ["fixed_term"]
    severity: "critical"
    result_if_triggered: "warn"
    detector_type: "rules"
    rules:
      keywords:
        - "срочный"
        - "на срок"
        - "основание"
        - "ст. 59"
      keyword_mode: "any"
    retrieval:
      context_k: 4
      boost_keywords:
        - "срочный"
        - "основание"
      rerank: true

  - id: "salary_not_below_mrot"
    name: "Зарплата не ниже МРОТ (ст. 133 ТК РФ)"
    description: |
      Заработная плата не может быть ниже МРОТ при полной норме рабочего времени.
    legal_base: "ст. 133 ТК РФ"
    required_triggers: []
    severity: "critical"
    result_if_triggered: "warn"
    detector_type: "rules"
    rules:
      keywords:
        - "МРОТ"
        - "минимальный размер оплаты труда"
        - "не ниже"
      keyword_mode: "any"
    retrieval:
      context_k: 3
      boost_keywords:
        - "МРОТ"
        - "зарплата"
      rerank: true

  - id: "requalification_gpkh_to_labor_warning"
    name: "Риск переквалификации ГПХ в трудовой (ст. 15, 19.1 ТК РФ)"
    description: |
      ГИТ и суды переквалифицируют ГПХ в трудовые при наличии признаков:
      подчинение ПВТР, рабочее место, регулярная оплата за процесс, личное выполнение.
      Последствия: доначисление налогов, взносов, штрафы.
    legal_base: "ст. 15, 19.1 ТК РФ, ст. 5.27 КоАП РФ"
    required_triggers: ["requalification_risk"]
    severity: "critical"
    result_if_triggered: "warn"
    detector_type: "rules"
    rules:
      keywords:
        - "признаки трудовых отношений"
        - "подчинение"
        - "рабочее место"
        - "регулярная оплата"
      keyword_mode: "any"
    retrieval:
      context_k: 4
      boost_keywords:
        - "переквалификация"
        - "трудовые отношения"
      rerank: true

  - id: "employee_rights_cannot_be_reduced"
    name: "Условия не могут ухудшать положение работника (ст. 9 ТК РФ)"
    description: |
      Условия трудового договора, ограничивающие права или снижающие уровень гарантий
      по сравнению с ТК РФ, не подлежат применению.
    legal_base: "ст. 9 ТК РФ"
    required_triggers: []
    severity: "critical"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      keywords:
        - "отказ от права"
        - "снижение гарантий"
        - "ухудшение положения"
        - "ниже установленных ТК"
        - "работник отказывается от отпуска"
        - "работник не вправе"
      keyword_mode: "any"
    retrieval:
      context_k: 4
      boost_keywords:
        - "ухудшение положения"
        - "ст. 9 ТК РФ"
      rerank: true

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 5: CHECKS_V8 — LLM/hybrid проверки
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  - id: labor_function_extraction
    name: "Трудовая функция (должность/профессия/специальность)"
    description: |
      Извлекает трудовую функцию: должность, профессию, специальность, квалификацию,
      конкретный вид поручаемой работы, ссылку на должностную инструкцию.
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "трудовая функция"
        - "работа по должности"
        - "профессия"
        - "специальность"
        - "должностная инструкция"
        - "квалификация"
      keyword_mode: "any"
      regex_patterns: []
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий трудовой договор.
        Определи трудовую функцию работника.

        Ответь строго в JSON:
        {
          "position": "<должность или not_found>",
          "profession": "<профессия или not_found>",
          "specialization": "<специальность или not_found>",
          "qualification": "<квалификация или not_found>",
          "job_description_reference": "<ссылка на должностную инструкцию или not_found>"
        }

        ВАЖНО: Без трудовой функции договор незаключён (ст. 57 ТК РФ).
        Если значение явно не указано — пиши "not_found".
      prompt_file: null
      context_k: 6
      temperature: 0.0
      max_tokens: 400
    retrieval:
      context_k: 6
      max_chunks: 8
      boost_keywords:
        - "трудовая функция"
        - "должность"
        - "профессия"
        - "специальность"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "position"
          type: "string"
          keyword_hints: ["должность", "работа по должности"]
          description: "Должность"
        - name: "profession"
          type: "string"
          keyword_hints: ["профессия", "по профессии"]
          description: "Профессия"
        - name: "job_description_reference"
          type: "string"
          keyword_hints: ["должностная инструкция", "приложение"]
          description: "Ссылка на должностную инструкцию"
      store_payload: true

  - id: place_of_work_extraction
    name: "Место работы (адрес, структурное подразделение)"
    description: |
      Извлекает место работы: адрес, структурное подразделение, филиал.
      Для дистанционной работы — указание на характер работы.
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "место работы"
        - "адрес"
        - "структурное подразделение"
        - "филиал"
        - "представительство"
        - "дистанционная работа"
      keyword_mode: "any"
      regex_patterns: []
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий трудовой договор.
        Определи место работы.

        Ответь строго в JSON:
        {
          "address": "<адрес или not_found>",
          "structural_unit": "<структурное подразделение или not_found>",
          "remote_work": "<yes / no>",
          "remote_work_description": "<описание дистанционной работы или not_found>"
        }

        ВАЖНО: Место работы — обязательное условие (ст. 57 ТК РФ).
        Если значение явно не указано — пиши "not_found".
      prompt_file: null
      context_k: 5
      temperature: 0.0
      max_tokens: 300
    retrieval:
      context_k: 5
      max_chunks: 8
      boost_keywords:
        - "место работы"
        - "адрес"
        - "структурное подразделение"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 400
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "address"
          type: "string"
          keyword_hints: ["адрес", "расположен по адресу", "место работы"]
          description: "Адрес места работы"
        - name: "remote_work"
          type: "string"
          allowed_values: ["yes", "no"]
          keyword_hints: ["дистанционная", "удалённая"]
          description: "Дистанционная работа"
      store_payload: true

  - id: start_date_and_term
    name: "Дата начала работы и срок договора"
    description: |
      Извлекает дату начала работы. Для срочного — срок и основание по ст. 59 ТК РФ.
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "дата начала работы"
        - "приступить к работе"
        - "срочный"
        - "на срок"
        - "основание"
        - "ст. 59"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий трудовой договор.
        Определи дату начала работы и срок договора.

        Ответь строго в JSON:
        {
          "start_date": "<дата или not_found>",
          "contract_type": "<indefinite / fixed_term / unclear>",
          "term": "<срок для срочного или not_found>",
          "fixed_term_basis": "<основание по ст. 59 ТК РФ или not_found>"
        }

        ВАЖНО: Срочный без основания → бессрочный (ст. 58 ТК РФ).
        Если значение явно не указано — пиши "not_found".
      prompt_file: null
      context_k: 6
      temperature: 0.0
      max_tokens: 400
    retrieval:
      context_k: 6
      max_chunks: 8
      boost_keywords:
        - "дата начала"
        - "срок"
        - "срочный"
        - "основание"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "start_date"
          type: "string"
          keyword_hints: ["дата начала", "приступить", "с"]
          description: "Дата начала работы"
        - name: "contract_type"
          type: "string"
          allowed_values: ["indefinite", "fixed_term", "unclear"]
          description: "Тип договора"
        - name: "fixed_term_basis"
          type: "string"
          keyword_hints: ["основание", "ст. 59", "в связи с"]
          description: "Основание срочности"
      store_payload: true

  - id: payment_structure
    name: "Структура оплаты труда (оклад, надбавки, премии, сроки)"
    description: |
      Извлекает: оклад/тарифная ставка, доплаты, надбавки, премии, сроки выплаты.
      Проверяет соответствие МРОТ и выплату не реже 2 раз в месяц.
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "оклад"
        - "тарифная ставка"
        - "заработная плата"
        - "премия"
        - "надбавка"
        - "доплата"
        - "два раза в месяц"
        - "не реже чем каждые полмесяца"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽)"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий трудовой договор.
        Определи структуру оплаты труда.

        Ответь строго в JSON:
        {
          "base_salary": "<оклад/тарифная ставка или not_found>",
          "bonuses": "<премии или not_found>",
          "allowances": "<надбавки/доплаты или not_found>",
          "payment_frequency": "<периодичность выплаты или not_found>",
          "payment_dates": "<конкретные даты или not_found>",
          "below_mrot_risk": "<yes / no / unclear>"
        }

        ВАЖНО: Не ниже МРОТ (ст. 133 ТК РФ), не реже 2 раз в месяц (ст. 136 ТК РФ).
        Если значение явно не указано — пиши "not_found".
      prompt_file: null
      context_k: 8
      temperature: 0.0
      max_tokens: 600
    retrieval:
      context_k: 8
      max_chunks: 12
      boost_keywords:
        - "оклад"
        - "заработная плата"
        - "выплата"
        - "МРОТ"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 50
      max_snippet_length: 700
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "base_salary"
          type: "number"
          keyword_hints: ["оклад", "тарифная ставка", "в размере"]
          unit: "RUB"
          description: "Базовый оклад"
        - name: "payment_frequency"
