  vin_number: "(?i)\\b[A-HJ-NPR-Z0-9]{17}\\b"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: COMPLIANCE RULES
#  Читается: DocTypeCheckLoader._exclusion_logic_to_checks()
# ════════════════════════════════════════════════════════════════════════════

compliance_rules:

  - id: "long_term_real_estate_lease_registration"
    name: "Долгосрочная аренда недвижимости: государственная регистрация"
    description: >
      Договор аренды здания, сооружения, помещения или иного объекта недвижимости,
      заключенный на срок, подлежащий государственной регистрации по закону,
      требует надлежащего урегулирования регистрационной процедуры.
    legal_base: "ст. 609, 651 ГК РФ, ФЗ-218"
    required_triggers: ["real_estate_lease", "long_term_lease"]
    severity: "critical"
    result_if_triggered: "warning"
    detector_type: "rules"
    rules:
      keywords:
        - "государственная регистрация"
        - "Росреестр"
        - "ЕГРН"
        - "регистрация договора аренды"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "государственная регистрация"
        - "Росреестр"
        - "ЕГРН"
        - "долгосрочная аренда"
      rerank: true

  - id: "lessor_title_risk"
    name: "Риск отсутствия титула или полномочий у арендодателя"
    description: >
      Арендодатель должен быть собственником имущества либо иным лицом,
      управомоченным законом или собственником сдавать имущество в аренду.
    legal_base: "ст. 608 ГК РФ"
    required_triggers: []
    severity: "critical"
    result_if_triggered: "warning"
    detector_type: "rules"
    rules:
      keywords:
        - "право собственности"
        - "выписка из ЕГРН"
        - "действует на основании"
        - "право сдачи в аренду"
        - "собственник"
        - "арендодатель"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "право собственности"
        - "право сдачи в аренду"
        - "ст. 608 ГК РФ"
      rerank: true

  - id: "land_use_vri_compliance"
    name: "Земля: соответствие использования ВРИ и категории земель"
    description: >
      Использование земельного участка не по ВРИ или не по целевому назначению
      создает административные и договорные риски.
    legal_base: "ст. 42 ЗК РФ, ст. 8.8 КоАП РФ"
    required_triggers: ["land_lease"]
    severity: "critical"
    result_if_triggered: "warning"
    detector_type: "rules"
    rules:
      keywords:
        - "вид разрешенного использования"
        - "ВРИ"
        - "категория земель"
        - "целевое использование"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "ВРИ"
        - "вид разрешенного использования"
        - "категория земель"
      rerank: true

  - id: "eleven_month_auto_renewal_registration_risk"
    name: "«11-месячный трюк»: обход регистрации через автопродление"
    description: >
      Массовая практика: стороны заключают договор аренды недвижимости на 11 месяцев
      с автоматическим продлением на тот же срок, чтобы избежать государственной
      регистрации. Суды неоднозначно оценивают такую конструкцию: при многократном
      продлении суд может квалифицировать отношения как долгосрочную аренду,
      требующую регистрации (п. 10 Информационного письма Президиума ВАС РФ № 59).
      Незарегистрированный долгосрочный договор не имеет силы для третьих лиц.
    legal_base: "ст. 609, 651 ГК РФ, п. 10 ИП ВАС РФ № 59 от 16.02.2001"
    required_triggers: ["real_estate_lease"]
    severity: "high"
    result_if_triggered: "warning"
    detector_type: "rules"
    rules:
      keywords:
        - "11 месяцев"
        - "одиннадцать месяцев"
        - "менее одного года"
        - "менее года"
        - "автоматическое продление"
        - "пролонгация на тот же срок"
        - "возобновляется на тех же условиях"
        - "продлевается автоматически"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "11 месяцев"
        - "автоматическое продление"
        - "пролонгация"
        - "государственная регистрация"
      rerank: true

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 5: CHECKS_V8 — LLM/hybrid проверки
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  - id: lease_subject_extraction
    name: "Аренда: извлечение предмета, срока и базовых условий"
    description: >
      Извлекает описание объекта аренды, срок, арендную плату,
      назначение использования и ключевые параметры передачи.
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "арендодатель"
        - "арендатор"
        - "предмет аренды"
        - "арендная плата"
        - "срок аренды"
        - "акт приема-передачи"
        - "помещение"
        - "оборудование"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)\\b\\d{2}:\\d{2}:\\d{6,7}:\\d+\\b"
        - "(?i)\\b\\d[\\d\\s,.]*\\s*(?:кв\\.?м|м2|м²)\\b"
        - "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|тыс|млн|млрд)"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор аренды.
        Извлеки ключевые условия аренды.

        Ответь строго в JSON:
        {
          "asset_type": "<real_estate / land / equipment / other / mixed / not_found>",
          "asset_description": "<описание объекта или not_found>",
          "lease_term": "<срок аренды или not_found>",
          "rent_amount": "<размер арендной платы или not_found>",
          "use_purpose": "<целевое использование или not_found>",
          "handover_document": "<act / invoice / other / not_found>"
        }

        ВАЖНО: Возвращай only_found_in_text.
      prompt_file: null
      context_k: 6
      temperature: 0.0
      max_tokens: 450
    retrieval:
      context_k: 6
      max_chunks: 8
      boost_keywords:
        - "предмет аренды"
        - "срок аренды"
        - "арендная плата"
        - "акт приема-передачи"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "asset_type"
          type: "string"
          allowed_values: ["real_estate", "land", "equipment", "other", "mixed", "not_found"]
          description: "Тип объекта аренды"
        - name: "lease_term"
          type: "string"
          description: "Срок аренды"
        - name: "rent_amount"
          type: "string"
          description: "Размер арендной платы"
        - name: "use_purpose"
          type: "string"
          description: "Цель использования объекта"
      store_payload: true

  - id: lease_subject_identification_check
    name: "Индивидуализация предмета аренды"
    description: >
      Проверяет достаточную определенность объекта аренды, особенно для недвижимости,
      земли и оборудования.
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "кадастровый номер"
        - "адрес"
        - "площадь"
        - "этаж"
        - "номер помещения"
        - "серийный номер"
        - "VIN"
        - "технический паспорт"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)\\b\\d{2}:\\d{2}:\\d{6,7}:\\d+\\b"
        - "(?i)\\b\\d[\\d\\s,.]*\\s*(?:кв\\.?м|м2|м²)\\b"
        - "(?i)\\b[A-HJ-NPR-Z0-9]{17}\\b"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор аренды.
        Проверь, достаточно ли индивидуализирован предмет аренды.

        Ответь строго в JSON:
        {
          "subject_identified": "<yes / partial / no>",
          "real_estate_identifiers": "<present / partial / not_applicable / not_found>",
          "equipment_identifiers": "<present / partial / not_applicable / not_found>",
          "risk_of_unenforceability": "<high / medium / low>",
          "snippet": "<цитата из договора или not_found>"
        }
      prompt_file: null
      context_k: 6
      temperature: 0.0
      max_tokens: 420
    retrieval:
      context_k: 6
      max_chunks: 8
      boost_keywords:
        - "кадастровый номер"
        - "адрес"
        - "площадь"
        - "серийный номер"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "subject_identified"
          type: "string"
          allowed_values: ["yes", "partial", "no"]
          description: "Достаточно ли индивидуализирован объект"
        - name: "risk_of_unenforceability"
          type: "string"
          allowed_values: ["high", "medium", "low"]
          description: "Риск незаключенности/спора"
      store_payload: true

  - id: rent_payment_and_indexation_check
    name: "Арендная плата, структура платежей и индексация"
    description: >
      Проверяет размер арендной платы, периодичность, переменную часть,
      индексацию и структуру дополнительных платежей.
    triggers: {}
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "арендная плата"
        - "ежемесячно"
        - "индексация"
        - "переменная часть"
        - "эксплуатационные расходы"
        - "коммунальные услуги"
        - "обеспечительный платеж"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)индексаци"
        - "(?i)переменн(ая|ой)\\s+част"
        - "(?i)обеспечительн(ый|ого)\\s+плат"
        - "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|тыс|млн|млрд)"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор аренды.
        Проверь блок арендной платы и платежей.

        Ответь строго в JSON:
        {
          "fixed_rent_present": "<yes / no / partial>",
          "variable_rent_present": "<yes / no / not_found>",
          "indexation_mechanism": "<yes / no / not_found>",
          "utilities_allocation": "<landlord / tenant / mixed / not_found>",
          "security_deposit": "<yes / no / not_found>",
          "snippet": "<цитата из договора или not_found>"
        }
      prompt_file: null
      context_k: 6
      temperature: 0.0
      max_tokens: 450
    retrieval:
      context_k: 6
      max_chunks: 8
      boost_keywords:
        - "арендная плата"
        - "индексация"
        - "коммунальные услуги"
        - "обеспечительный платеж"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "fixed_rent_present"
          type: "string"
          allowed_values: ["yes", "no", "partial"]
          description: "Есть ли фиксированная арендная плата"
        - name: "variable_rent_present"
          type: "string"
          allowed_values: ["yes", "no", "not_found"]
          description: "Есть ли переменная часть"
        - name: "security_deposit"
          type: "string"
          allowed_values: ["yes", "no", "not_found"]
          description: "Есть ли обеспечительный платеж"
      store_payload: true

  - id: handover_condition_and_fitness_check
    name: "Передача объекта, его состояние и пригодность к использованию"
    description: >
      Проверяет наличие акта передачи, описания состояния объекта,
      недостатков и пригодности для согласованного использования.
    triggers: {}
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "акт приема-передачи"
        - "техническое состояние"
        - "исправное состояние"
        - "пригодно для использования"
        - "недостатки"
        - "дефекты"
        - "соответствие назначению"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)акт\\s+(приема|приёма|передач)"
        - "(?i)исправн(ое|ом)\\s+состояни"
        - "(?i)пригодн(о|ость)\\s+для\\s+использован"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор аренды.
        Проверь, как урегулирована передача объекта и его состояние.

        Ответь строго в JSON:
        {
          "handover_act_required": "<yes / no / not_found>",
          "condition_description": "<detailed / general / not_found>",
          "fitness_warranty": "<yes / no / not_found>",
          "defect_disclosure": "<yes / no / not_found>",
          "snippet": "<цитата из договора или not_found>"
        }
      prompt_file: null
      context_k: 5
      temperature: 0.0
      max_tokens: 420
    retrieval:
      context_k: 5
      max_chunks: 7
      boost_keywords:
        - "акт приема-передачи"
        - "исправное состояние"
        - "пригодность для использования"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "handover_act_required"
          type: "string"
          allowed_values: ["yes", "no", "not_found"]
          description: "Предусмотрен ли акт передачи"
        - name: "fitness_warranty"
          type: "string"
          allowed_values: ["yes", "no", "not_found"]
          description: "Есть ли гарантия пригодности"
      store_payload: true

  - id: repairs_and_operational_costs_check
    name: "Ремонт, содержание имущества и эксплуатационные расходы"
    description: >
      Проверяет распределение капитального и текущего ремонта,
      OPEX, коммунальных расходов и maintenance duties.
    triggers:
      any: ["utility_charges_related", "equipment_lease", "real_estate_lease"]
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "капитальный ремонт"
        - "текущий ремонт"
        - "эксплуатационные расходы"
        - "коммунальные услуги"
        - "техническое обслуживание"
        - "обязанность по содержанию"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)капитальн(ый|ого)\\s+ремонт"
        - "(?i)текущ(ий|его)\\s+ремонт"
        - "(?i)эксплуатационн(ые|ых)\\s+расход"
        - "(?i)коммунальн(ые|ых)\\s+услуг"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор аренды.
        Проверь распределение ремонтных и эксплуатационных обязанностей.

        Ответь строго в JSON:
        {
          "capital_repairs": "<landlord / tenant / mixed / not_found>",
          "current_repairs": "<landlord / tenant / mixed / not_found>",
          "operational_costs": "<landlord / tenant / mixed / not_found>",
          "maintenance_detailed": "<yes / no / partial>",
          "snippet": "<цитата из договора или not_found>"
        }
      prompt_file: null
      context_k: 6
      temperature: 0.0
      max_tokens: 450
    retrieval:
      context_k: 6
      max_chunks: 8
      boost_keywords:
        - "капитальный ремонт"
        - "текущий ремонт"
        - "эксплуатационные расходы"
        - "коммунальные услуги"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "capital_repairs"
          type: "string"
          allowed_values: ["landlord", "tenant", "mixed", "not_found"]
          description: "Кто делает капремонт"
        - name: "current_repairs"
          type: "string"
          allowed_values: ["landlord", "tenant", "mixed", "not_found"]
          description: "Кто делает текущий ремонт"
        - name: "operational_costs"
          type: "string"
          allowed_values: ["landlord", "tenant", "mixed", "not_found"]
          description: "Кто несет OPEX/коммуналку"
      store_payload: true

  - id: improvements_and_sublease_check
    name: "Улучшения, перепланировка и субаренда"
    description: >
      Проверяет порядок согласования улучшений, судьбу отделимых/неотделимых улучшений,
      субаренду и передачу прав третьим лицам.
    triggers:
      any: ["sublease_related", "real_estate_lease", "equipment_lease"]
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "улучшения"
        - "неотделимые улучшения"
        - "отделимые улучшения"
        - "перепланировка"
        - "переоборудование"
        - "субаренда"
        - "перенаем"
        - "с письменного согласия"
      keyword_mode: "any"
      regex_patterns:
