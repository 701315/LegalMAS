  - id: preemptive_right_and_renewal_check
    name: "Преимущественное право на новый договор и продление (ст. 621 ГК РФ)"
    description: >
      Проверяет, как урегулировано преимущественное право арендатора на заключение
      нового договора, условия продления/пролонгации и их соответствие ст. 621 ГК РФ.
      При долгосрочной аренде — одна из ключевых защитных оговорок арендатора.
    triggers:
      any: ["renewal_and_preemptive_right", "long_term_lease"]
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "преимущественное право"
        - "продление договора"
        - "возобновление"
        - "пролонгация"
        - "автоматическое продление"
        - "на тех же условиях"
        - "уведомление о продлении"
        - "отказ от продления"
        - "на новый срок"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)преимущест(венное|во)\\s+право"
        - "(?i)автоматическ(ое|ого|ая|ой)\\s+продлен"
        - "(?i)пролонгац"
        - "(?i)уведомлени(е|я).*за\\s+\\d+\\s*(дней|месяц)"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор аренды.
        Проверь условия продления/возобновления договора и преимущественное право арендатора.

        По ст. 621 ГК РФ:
        - Арендатор, надлежащим образом исполнявший обязанности, имеет ПРЕИМУЩЕСТВЕННОЕ
          право на заключение нового договора на новый срок
        - Стороны могут изменить условия нового договора, но арендодатель не вправе
          отказать и заключить договор с другим лицом
        - Если после истечения срока арендатор продолжает пользоваться — договор считается
          возобновлённым на тех же условиях на неопределённый срок

        Ответь строго в JSON:
        {
          "preemptive_right_mentioned": "<yes / no / not_found>",
          "auto_renewal_clause": "<yes / no / not_found>",
          "renewal_notice_period": "<срок уведомления или not_found>",
          "renewal_terms": "<same_terms / negotiable / not_specified / not_found>",
          "waiver_of_preemptive_right": "<yes / no / not_found>",
          "eleven_month_trick_detected": "<yes / no / unclear>",
          "snippet": "<цитата из договора или not_found>"
        }
      prompt_file: null
      context_k: 6
      temperature: 0.0
      max_tokens: 450
    retrieval:
      context_k: 6
      max_chunks: 8
      boost_keywords:
        - "преимущественное право"
        - "продление"
        - "пролонгация"
        - "возобновление"
        - "ст. 621"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "preemptive_right_mentioned"
          type: "string"
          allowed_values: ["yes", "no", "not_found"]
          description: "Упомянуто ли преимущественное право"
        - name: "auto_renewal_clause"
          type: "string"
          allowed_values: ["yes", "no", "not_found"]
          description: "Есть ли автопродление"
        - name: "eleven_month_trick_detected"
          type: "string"
          allowed_values: ["yes", "no", "unclear"]
          description: "Обнаружен ли 11-месячный трюк"
      store_payload: true

  - id: landlord_access_and_inspection_check
    name: "Доступ арендодателя в помещение и порядок осмотра"
    description: >
      Проверяет условия доступа арендодателя в арендуемое помещение —
      частый источник споров в коммерческой аренде. Баланс между правом
      собственника контролировать состояние имущества и правом арендатора
      на спокойное пользование.
    triggers:
      any: ["access_to_premises", "real_estate_lease"]
    severity: "medium"
