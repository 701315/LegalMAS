        - "(?i)осмотр.*помещени"
        - "(?i)предварительн(ое|ого)\\s+уведомлен"
        - "(?i)в\\s+присутствии\\s+арендатор"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор аренды.
        Проверь условия доступа арендодателя в помещение.

        Ответь строго в JSON:
        {
          "access_regulated": "<yes / no / not_found>",
          "prior_notice_required": "<yes / no / not_specified / not_found>",
          "notice_period": "<срок уведомления или not_found>",
          "tenant_presence_required": "<yes / no / not_specified / not_found>",
          "access_frequency_limit": "<ограничение частоты или not_found>",
          "emergency_access": "<yes / no / not_found>",
          "access_hours": "<рабочее время / any / not_specified / not_found>",
          "snippet": "<цитата из договора или not_found>"
        }
      prompt_file: null
      context_k: 5
      temperature: 0.0
      max_tokens: 400
    retrieval:
      context_k: 5
      max_chunks: 6
      boost_keywords:
        - "доступ"
        - "осмотр"
        - "посещение"
        - "уведомление"
        - "ключи"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "access_regulated"
          type: "string"
          allowed_values: ["yes", "no", "not_found"]
          description: "Регламентирован ли доступ арендодателя"
        - name: "prior_notice_required"
          type: "string"
