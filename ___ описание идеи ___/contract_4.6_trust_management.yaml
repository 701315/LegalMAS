# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: COMPLIANCE RULES
#  Читается: DocTypeCheckLoader._exclusion_logic_to_checks()
# ════════════════════════════════════════════════════════════════════════════

compliance_rules:

  - id: "trustee_status_non_compliant"
    name: "Неподходящий статус доверительного управляющего"
    description: "Доверительный управляющий по общему правилу должен быть ИП или коммерческой организацией, если иное не установлено законом"
    legal_base: "ст. 1015 ГК РФ"
    required_triggers: ["professional_trustee_required"]
    severity: "critical"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      keywords:
        - "унитарное предприятие"
        - "государственное унитарное предприятие"
        - "муниципальное унитарное предприятие"
        - "физическое лицо"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "доверительный управляющий"
        - "ип"
        - "коммерческая организация"
        - "унитарное предприятие"
      rerank: true

  - id: "cash_in_trust_without_legal_basis"
    name: "Денежные средства передаются в ДУ без явного законного основания"
    description: "Денежные средства могут быть самостоятельным объектом доверительного управления не во всех случаях; требуется специальное законное основание"
    legal_base: "ст. 1013 ГК РФ, специальное регулирование"
    required_triggers: ["cash_in_trust"]
    severity: "critical"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      keywords:
        - "денежные средства"
      negative_keywords:
        - "предусмотрено законом"
        - "управляющая компания"
        - "инвестиционный фонд"
        - "профессиональный участник рынка ценных бумаг"
        - "специальный закон"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "денежные средства"
        - "ст. 1013"
        - "специальный закон"
      rerank: true

  - id: "term_exceeds_five_years"
    name: "Срок договора превышает 5 лет"
    description: "По общему правилу срок договора доверительного управления не должен превышать пяти лет, если иное не установлено законом"
    legal_base: "ст. 1016 ГК РФ"
    required_triggers: []
    severity: "critical"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      keywords:
        - "6 лет"
        - "7 лет"
        - "8 лет"
        - "9 лет"
        - "10 лет"
        - "десять лет"
      keyword_mode: "any"
    retrieval:
      context_k: 4
      boost_keywords:
        - "срок договора"
        - "лет"
        - "ст. 1016"
      rerank: true

  - id: "real_estate_trust_without_registration"
    name: "Недвижимость в ДУ без механизма государственной регистрации"
    description: "Передача недвижимого имущества в доверительное управление требует государственной регистрации"
    legal_base: "ст. 1017 ГК РФ, ФЗ-218"
    required_triggers: ["real_estate_in_trust"]
    severity: "critical"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      negative_keywords:
        - "государственная регистрация"
        - "егрн"
        - "регистрация доверительного управления"
        - "обременение"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "государственная регистрация"
        - "доверительное управление недвижимостью"
        - "егрн"
      rerank: true

  - id: "securities_trust_without_license"
    name: "ДУ ценными бумагами без лицензии профучастника"
    description: |
      Доверительное управление ценными бумагами требует наличия у управляющего 
      лицензии профессионального участника рынка ценных бумаг (ФЗ-39).
    legal_base: "ст. 5 ФЗ № 39-ФЗ «О рынке ценных бумаг»"
    required_triggers: ["securities_in_trust"]
    severity: "critical"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      keywords:
        - "ценные бумаги"
        - "акции"
        - "облигации"
      keyword_mode: "any"
      negative_keywords:
        - "лицензия"
        - "профессиональный участник"
        - "управляющая компания"
        - "брокер"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "лицензия"
        - "профессиональный участник"
        - "ценные бумаги"
      rerank: true

  - id: "trustee_beneficiary_same_person"
    name: "Доверительный управляющий не может быть выгодоприобретателем"
    description: |
      По ст. 1015 ГК РФ доверительный управляющий не может быть 
      выгодоприобретателем по договору доверительного управления.
    legal_base: "ст. 1015 ГК РФ"
    required_triggers: []
    severity: "critical"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      keywords:
        - "доверительный управляющий является выгодоприобретателем"
        - "управляющий в свою пользу"
        - "в интересах управляющего"
      keyword_mode: "any"
    retrieval:
      context_k: 4
      boost_keywords:
        - "выгодоприобретатель"
        - "доверительный управляющий"
      rerank: true

  - id: "delegation_without_authorization"
    name: "Передача управления третьему лицу без полномочий"
    description: |
      По ст. 1021 ГК РФ управляющий должен осуществлять управление лично, 
      кроме случаев, когда договор или обстоятельства допускают иное.
    legal_base: "ст. 1021 ГК РФ"
    required_triggers: ["delegation_to_third_party"]
    severity: "high"
    result_if_triggered: "warning"
    detector_type: "rules"
    rules:
      keywords:
        - "передача управления"
        - "поручение третьему лицу"
        - "привлечение третьих лиц"
      keyword_mode: "any"
      negative_keywords:
        - "с согласия учредителя"
        - "вправе привлекать"
        - "допускается привлечение"
    retrieval:
      context_k: 5
      boost_keywords:
        - "передача управления"
        - "третье лицо"
        - "личное исполнение"
      rerank: true

  - id: "no_liability_limitation_clause"
    name: "Недопустимое ограничение ответственности управляющего"
    description: |
      Условия, полностью освобождающие управляющего от ответственности 
      за убытки, противоречат существу фидуциарных обязанностей.
    legal_base: "ст. 1022 ГК РФ, ст. 10 ГК РФ"
    required_triggers: []
    severity: "critical"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      keywords:
        - "управляющий освобождается от ответственности"
        - "не несет ответственности за убытки"
        - "ответственность ограничена вознаграждением"
        - "полное освобождение от ответственности"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "освобождение от ответственности"
        - "ограничение ответственности"
        - "убытки"
      rerank: true

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 5: CHECKS_V8 — LLM/hybrid проверки
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  - id: trust_subject_extraction
    name: "Базовое извлечение структуры договора доверительного управления"
    description: "Извлекает стороны, выгодоприобретателя, состав имущества, срок, вознаграждение и ключевые параметры доверительного управления"
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "учредитель управления"
        - "доверительный управляющий"
        - "выгодоприобретатель"
        - "имущество в доверительном управлении"
        - "вознаграждение управляющего"
        - "срок договора"
        - "доверительное управление"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(учредитель\\s+управления|доверительный\\s+управляющий|выгодоприобретател)"
        - "(?i)(доверительн(ое|ого)\\s+управлен)"
        - "(?i)\\bД[.]?\\s?У[.]?\\b"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор доверительного управления имуществом.
        Извлеки ключевые сведения строго по тексту документа.

        Ответь строго в JSON:
        {
          "settlor": "<учредитель управления или not_found>",
          "trustee": "<доверительный управляющий или not_found>",
          "beneficiary": "<выгодоприобретатель или not_found>",
          "beneficiary_relation": "<settlor_self / third_party / unclear / not_found>",
          "trust_property": "<имущество, передаваемое в управление, или not_found>",
          "property_type": "<real_estate / securities / rights / cash / mixed / other / not_found>",
          "term": "<срок договора или not_found>",
          "term_exceeds_5_years": "<yes / no / unclear / not_found>",
          "trustee_remuneration": "<условия вознаграждения или not_found>"
        }

        Используй только явно указанные в тексте сведения.
        Если данных нет — пиши "not_found".
      prompt_file: null
      context_k: 6
      temperature: 0.0
      max_tokens: 700
    retrieval:
      context_k: 6
      max_chunks: 10
      boost_keywords:
        - "учредитель управления"
        - "доверительный управляющий"
        - "выгодоприобретатель"
        - "имущество"
        - "срок"
        - "вознаграждение"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 50
      max_snippet_length: 700
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "settlor"
          type: "string"
          keyword_hints: ["учредитель управления"]
          description: "Учредитель управления"
        - name: "trustee"
          type: "string"
          keyword_hints: ["доверительный управляющий", "управляющая компания"]
          description: "Доверительный управляющий"
        - name: "beneficiary"
          type: "string"
          keyword_hints: ["выгодоприобретатель"]
          description: "Выгодоприобретатель"
        - name: "beneficiary_relation"
          type: "string"
          allowed_values: ["settlor_self", "third_party", "unclear", "not_found"]
          description: "Соотношение выгодоприобретателя и учредителя"
        - name: "trust_property"
          type: "string"
          keyword_hints: ["состав имущества", "имущество, передаваемое", "предмет договора"]
          description: "Имущество, передаваемое в доверительное управление"
        - name: "property_type"
          type: "string"
          allowed_values: ["real_estate", "securities", "rights", "cash", "mixed", "other", "not_found"]
          description: "Тип имущества"
        - name: "term"
          type: "string"
          keyword_hints: ["срок договора", "договор заключен на срок"]
          description: "Срок договора"
        - name: "term_exceeds_5_years"
          type: "string"
          allowed_values: ["yes", "no", "unclear", "not_found"]
          description: "Превышает ли срок 5 лет"
        - name: "trustee_remuneration"
          type: "string"
          keyword_hints: ["вознаграждение управляющего", "вознаграждение доверительного управляющего"]
          description: "Условия вознаграждения"
      store_payload: true

  - id: trust_property_segregation_check
    name: "Обособление имущества: отдельный учет, баланс и счета"
    description: "Проверяет наличие механизма обособления имущества в доверительном управлении"
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "обособление имущества"
        - "отдельный баланс"
        - "отдельный банковский счет"
        - "обособленный учет"
        - "имущество учитывается отдельно"
        - "не является собственностью управляющего"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)отдельн(ый|ом)\\s+баланс"
        - "(?i)отдельн(ый|ом)\\s+банковск(ий|ом)\\s+счет"
        - "(?i)обособлен(ный|ного)\\s+учет"
    llm:
      prompt_template: |
