        - "(?i)банкротств|несостоятельност"
        - "(?i)конкурсн(ая|ой)\\s+масс"

  - id: "pledge_of_trust_rights"
    name: "Залог прав из договора ДУ"
    description: "Проверяет условия залога прав требования из договора ДУ"
    legal_base: "ст. 358.1-358.8 ГК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
      any: ["pledge_of_trust_rights"]
    rules:
      keywords:
        - "залог прав"
        - "залог требования"
        - "обременение прав"
        - "права из договора"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)залог\\s+прав"
        - "(?i)обременен(ие|ия)\\s+прав"

  - id: "force_majeure_clause"
    name: "Форс-мажор и освобождение от ответственности"
    description: "Проверяет условия об обстоятельствах непреодолимой силы"
    legal_base: "ст. 401 ГК РФ"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "форс-мажор"
        - "обстоятельства непреодолимой силы"
        - "освобождение от ответственности"
        - "чрезвычайные обстоятельства"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)форс[- ]?мажор"
        - "(?i)непреодолим(ая|ой)\\s+сил"

  - id: "confidentiality_clause"
    name: "Конфиденциальность информации о ДУ"
    description: "Проверяет условия о конфиденциальности"
    legal_base: "ст. 421 ГК РФ"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "конфиденциальность"
        - "неразглашение"
        - "коммерческая тайна"
        - "банковская тайна"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)конфиденциал"
        - "(?i)неразглашен"

  - id: "governing_law_and_disputes"
    name: "Применимое право и разрешение споров"
    description: "Проверяет наличие арбитражной оговорки"
    legal_base: "ГК РФ, АПК РФ"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "применимое право"
        - "арбитражный суд"
        - "разрешение споров"
        - "подсудность"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)арбитражн(ый|ого)\\s+суд"

  - id: "automatic_renewal_clause"
    name: "Автоматическое продление договора"
    description: "Проверяет условия автоматического продления"
    legal_base: "ст. 1016 ГК РФ"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "автоматическое продление"
        - "пролонгация"
        - "возобновление договора"
        - "на тех же условиях"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)автоматическ(ое|ого|и)\\s+(продлен|пролонгац)"
        - "(?i)возобновл(ение|яется)"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 7: DD_REQUEST_TEMPLATES
#  Читается: DDRequestTemplateLoader
#  Ключи = check_id из checks_v8 и doc_type_checks выше.
#  DDRequestTemplateLoader.render() матчит по exact или prefix.
# ════════════════════════════════════════════════════════════════════════════

dd_request_templates:

  trust_subject_extraction:
    text: >
      Просим предоставить по {doc_names}: полную структуру доверительного управления —
      состав передаваемого имущества, сведения об учредителе управления,
      доверительном управляющем, выгодоприобретателе, срок договора,
      размер и порядок выплаты вознаграждения управляющего.
    addressee: "Учредитель управления / Доверительный управляющий"

  trust_property_identification:
    text: >
      Просим предоставить по {doc_names} точный перечень имущества,
      передаваемого в доверительное управление, с индивидуализирующими признаками,
      приложениями-описями и подтверждающими правами учредителя документами.
    addressee: "Учредитель управления"

  beneficiary_identification_required:
    text: >
      Просим уточнить по {doc_names}, кто является выгодоприобретателем:
      сам учредитель управления или третье лицо, и предоставить полные
      идентификационные данные выгодоприобретателя.
    addressee: "Учредитель управления"

  trustee_remuneration_required:
    text: >
      Просим уточнить в {doc_names}: размер, форму и порядок выплаты
      вознаграждения доверительного управляющего, а также отдельно раскрыть
      базу расчета переменной части вознаграждения, если она предусмотрена.
    addressee: "Доверительный управляющий / Юридический советник"

  contract_term_required:
    text: >
      Просим уточнить по {doc_names} срок договора доверительного управления,
      дату начала и окончания управления, а также основания продления/возобновления договора.
    addressee: "Обе стороны"

  term_exceeds_five_years:
    text: >
      В {doc_names} выявлен риск превышения общего предельного срока доверительного управления.
      Просим предоставить правовое обоснование срока свыше 5 лет
      со ссылкой на специальный закон или скорректировать договор.
    addressee: "Юридический советник"

  trustee_status_required:
    text: >
      Просим предоставить по {doc_names}: документы, подтверждающие допустимый статус
      доверительного управляющего (ИП/коммерческая организация), а также регистрационные данные.
    addressee: "Доверительный управляющий"

  trustee_status_non_compliant:
    text: >
      В {doc_names} выявлен риск несоответствия статуса доверительного управляющего требованиям закона.
      Просим предоставить правовое заключение о допустимости данного субъекта
      и подтверждающие документы.
    addressee: "Юридический советник / Доверительный управляющий"

  trust_property_segregation_check:
    text: >
      Просим предоставить по {doc_names}: описание механизма обособления имущества,
      сведения об отдельном балансе, отдельном банковском счете,
      правилах раздельного учета и подтверждение, что имущество не смешивается
      с собственным имуществом управляющего.
    addressee: "Доверительный управляющий"

  asset_segregation_required:
    text: >
      Просим включить/уточнить в {doc_names} положения об обособлении имущества:
      отдельный баланс, отдельный банковский счет, раздельный учет,
      запрет смешения активов и последствия нарушения этих требований.
    addressee: "Юридический советник / Доверительный управляющий"

  trustee_powers_and_investment_limits_check:
    text: >
      Просим предоставить по {doc_names}: инвестиционную декларацию,
      перечень разрешенных и запрещенных операций, лимиты по рискам,
      а также список действий управляющего, требующих предварительного согласия учредителя.
    addressee: "Доверительный управляющий / Учредитель управления"

  trustee_reporting_check:
    text: >
      Просим уточнить по {doc_names}: периодичность отчетности управляющего,
      форму отчета, обязательное содержание, сроки направления отчета,
      порядок утверждения/оспаривания отчета и право учредителя запрашивать дополнительную информацию.
    addressee: "Доверительный управляющий"

  trustee_reporting_required:
    text: >
      Просим включить в {doc_names} подробные условия отчетности управляющего:
      периодичность, содержание, подтверждающие документы и право учредителя на проверку.
    addressee: "Юридический советник"

  expenses_reimbursement_mechanism:
    text: >
      Просим уточнить по {doc_names}: какие расходы доверительного управляющего
      подлежат возмещению, за счет каких источников они покрываются,
      какие расходы требуют предварительного согласования и как подтверждаются документально.
    addressee: "Доверительный управляющий / Учредитель управления"

  trustee_liability_standard:
    text: >
      Просим уточнить в {doc_names}: стандарт поведения доверительного управляющего,
      основания ответственности за убытки, возможность взыскания упущенной выгоды,
      а также перечень недопустимых ограничений ответственности управляющего.
    addressee: "Юридический советник"

  du_mark_usage_check:
    text: >
      Просим подтвердить по {doc_names}, что доверительный управляющий
      обязан использовать обозначение "Д.У." или иное ясное указание на свой статус
      во всех сделках и документах, связанных с имуществом в управлении.
    addressee: "Доверительный управляющий"

  du_mark_required:
    text: >
      Просим включить в {doc_names} прямую обязанность доверительного управляющего
      указывать свой статус ("Д.У.") во всех документах и сделках,
      а также последствия неисполнения этого требования.
    addressee: "Юридический советник"

  real_estate_registration_check:
    text: >
      По {doc_names} (недвижимость в доверительном управлении) просим предоставить:
      порядок государственной регистрации, сведения о подаче документов в Росреестр,
      распределение расходов на регистрацию и перечень необходимых регистрационных документов.
    addressee: "Учредитель управления / Доверительный управляющий"

  real_estate_registration_required:
    text: >
      Просим включить/уточнить в {doc_names} условия о государственной регистрации
      доверительного управления недвижимостью в ЕГРН, включая порядок подачи документов,
      распределение расходов и последствия уклонения стороны от регистрации.
    addressee: "Юридический советник"

  real_estate_trust_without_registration:
    text: >
      В {doc_names} выявлено отсутствие достаточного регистрационного механизма
      при передаче недвижимости в доверительное управление.
      Просим срочно предоставить проект регистрационной оговорки и комплект документов для ЕГРН.
    addressee: "Юридический советник / Учредитель управления"

  cash_subject_legal_basis:
    text: >
      По {doc_names} просим предоставить правовое основание допустимости передачи
      денежных средств в доверительное управление со ссылкой на специальный закон,
      статус управляющего и применимый режим регулирования.
    addressee: "Юридический советник / Доверительный управляющий"

  cash_in_trust_without_legal_basis:
    text: >
      В {doc_names} выявлен риск передачи денежных средств в доверительное управление
      без достаточного законного основания. Просим предоставить правовое заключение
      о допустимости такой конструкции и специальное нормативное основание.
    addressee: "Юридический советник"

  conflict_of_interest_check:
    text: >
      Просим предоставить по {doc_names}: политику управления конфликтом интересов,
      правила сделок с аффилированными лицами, порядок раскрытия конфликта
      и механизмы защиты интересов учредителя и выгодоприобретателя.
    addressee: "Доверительный управляющий"

  conflict_of_interest_management:
    text: >
      Просим включить/уточнить в {doc_names} положения о конфликте интересов:
      раскрытие аффилированности, ограничения на сделки с самим собой,
      предварительное согласование конфликтных сделок и последствия нарушения.
    addressee: "Юридический советник"

  termination_and_return_of_property:
    text: >
      Просим уточнить по {doc_names}: основания прекращения доверительного управления,
      порядок составления окончательного отчета, сроки возврата имущества,
      передачи документов и распределения доходов/расходов на дату прекращения.
    addressee: "Обе стороны"

  trustee_personal_liability_check:
    text: >
      Просим предоставить по {doc_names}: условия ответственности управляющего
      личным имуществом, включая последствия превышения полномочий,
      неиспользования обозначения "Д.У." и субсидиарную ответственность
      при недостаточности имущества в управлении.
    addressee: "Юридический советник / Доверительный управляющий"

  personal_liability_for_excess_powers:
    text: >
      Просим уточнить в {doc_names}: какие действия управляющего считаются
      превышением полномочий, каковы последствия и как распределяется
      ответственность между имуществом в ДУ и личным имуществом управляющего.
    addressee: "Юридический советник"

  delegation_and_subcontracting_check:
    text: >
      Просим предоставить по {doc_names}: условия привлечения третьих лиц
      к осуществлению управления, требуется ли согласие учредителя,
      как распределяется ответственность за действия таких лиц.
    addressee: "Доверительный управляющий / Юридический советник"

  delegation_restrictions:
    text: >
      Просим уточнить в {doc_names}: вправе ли управляющий привлекать
      третьих лиц к управлению, при каких условиях, и кто несёт
      ответственность за их действия.
    addressee: "Юридический советник"

  delegation_without_authorization:
    text: >
      В {doc_names} выявлен риск делегирования управления без надлежащих
      полномочий. Просим уточнить основания привлечения третьих лиц
      и ответственность управляющего за их действия.
    addressee: "Юридический советник / Доверительный управляющий"

  bankruptcy_protection_check:
    text: >
      Просим предоставить по {doc_names}: условия о последствиях банкротства
      учредителя, управляющего и выгодоприобретателя, включая защиту
      имущества от включения в конкурсную массу и порядок прекращения ДУ.
    addressee: "Юридический советник"

  bankruptcy_consequences_clause:
    text: >
      Просим включить/уточнить в {doc_names}: последствия банкротства
      каждой из сторон, порядок прекращения ДУ и возврата имущества,
      очерёдность удовлетворения требований.
    addressee: "Юридический советник"

  securities_management_license_check:
    text: >
      По {doc_names} (ДУ ценными бумагами) просим предоставить: реквизиты
      лицензии профессионального участника рынка ценных бумаг,
      подтверждение соответствия требованиям ФЗ-39 и Банка России.
    addressee: "Доверительный управляющий"

  securities_license_required:
    text: >
      Просим предоставить по {doc_names}: лицензию на осуществление
      деятельности по управлению ценными бумагами и подтверждение
      статуса профессионального участника рынка ценных бумаг.
    addressee: "Доверительный управляющий"

  securities_trust_without_license:
    text: >
      В {doc_names} выявлен риск ДУ ценными бумагами без лицензии.
      Просим срочно предоставить лицензию профучастника или
      скорректировать предмет договора.
    addressee: "Юридический советник / Доверительный управляющий"

  termination_consequences_check:
    text: >
      Просим предоставить по {doc_names}: исчерпывающий перечень оснований
      прекращения ДУ, право на односторонний отказ, сроки уведомления,
      порядок составления окончательного отчёта и возврата имущества.
    addressee: "Обе стороны / Юридический советник"

  pledge_of_trust_rights:
    text: >
      Просим уточнить по {doc_names}: допустим ли залог прав из договора ДУ,
      каковы условия и ограничения, требуется ли согласие управляющего.
    addressee: "Юридический советник"

  force_majeure_clause:
    text: >
      Просим включить/уточнить в {doc_names}: перечень обстоятельств
      непреодолимой силы, порядок уведомления, последствия для
      обязательств сторон.
    addressee: "Юридический советник"

  confidentiality_clause:
    text: >
      Просим включить/уточнить в {doc_names}: условия о конфиденциальности
      информации, связанной с договором ДУ, срок неразглашения, исключения.
    addressee: "Юридический советник"

  governing_law_and_disputes:
    text: >
      Просим уточнить в {doc_names}: применимое право и компетентный суд
      для разрешения споров.
    addressee: "Юридический советник"

  automatic_renewal_clause:
    text: >
      Просим уточнить в {doc_names}: условия автоматического продления
      договора, порядок отказа от продления и последствия.
    addressee: "Обе стороны"

  no_liability_limitation_clause:
    text: >
      В {doc_names} выявлен риск недопустимого ограничения ответственности
      управляющего. Просим привести условия в соответствие со ст. 1022 ГК РФ
      и фидуциарным характером отношений.
    addressee: "Юридический советник"

  trustee_beneficiary_same_person:
    text: >
      В {doc_names} выявлен риск совпадения управляющего и выгодоприобретателя,
      что запрещено ст. 1015 ГК РФ. Просим скорректировать структуру сторон.
    addressee: "Юридический советник"

  # Generic fallback
  _default:
    text: >
      Просим предоставить дополнительную информацию по вопросу «{check_name}»
      применительно к {doc_names}.
    addressee: "Юридический советник"