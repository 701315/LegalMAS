type: contract_4.6_trust_management
name: "Договор доверительного управления имуществом"

description: |
  Соглашение, по которому учредитель управления передает доверительному управляющему
  имущество на определенный срок, а доверительный управляющий обязуется осуществлять
  управление этим имуществом в интересах учредителя управления или указанного им
  выгодоприобретателя. Регулируется Главой 53 ГК РФ.
  Характеризуется фидуциарным характером, обязательным обособлением имущества,
  специальными требованиями к статусу управляющего, обязанностью действовать от своего
  имени с указанием статуса доверительного управляющего ("Д.У."), а для отдельных видов
  имущества — специальными требованиями закона, включая государственную регистрацию
  доверительного управления недвижимостью.

version: 4.0
parent: class_4_service_provision

