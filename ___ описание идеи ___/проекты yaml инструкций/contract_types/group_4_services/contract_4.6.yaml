type: contract_4.6
name: Договор доверительного управления имуществом
description: |
  Соглашение, по которому учредитель управления передает доверительному управляющему имущество на срок, 
  а управляющий обязуется осуществлять управление этим имуществом в интересах учредителя или выгодоприобретателя.
  Цель — эффективное использование имущества и извлечение прибыли. Особенности: обособление имущества 
  (отдельный баланс/счет), фидуциарный характер отношений. Управляющий действует от своего имени с пометкой "Д.У.".
  Максимальный срок договора - 5 лет (ст. 1016 ГК РФ). Передача недвижимости подлежит государственной регистрации.
version: 2.1
parent: class_4_service_provision
sibling_contracts:
  - contract_2.1 # Аренда (пользование для себя)
  - contract_5.1 # Агентирование (поручения)
  - contract_4.4 # Хранение (цель — сохранность, а не доход)
metadata:
  category: contract
  subcategory: asset_management
  complexity: high
  risk_level: high
  legal_base: Глава 53 ГК РФ (ст. 1012-1026)
  hierarchy_position: "specialized_fiduciary"

# ════════════════════════════════════════════════════════════
# БАЗОВАЯ ИНФОРМАЦИЯ (HYBRID OPTIMIZED)
# ════════════════════════════════════════════════════════════
rules:
  keywords:
    high:
      - "Доверительный управляющий"
      - "Учредитель управления"
      - "Выгодоприобретатель"
      - "Д.У."
      - "доверительное управление"
      - "имущество в управлении"
      - "обособление имущества"
    medium:
      - "инвестиционная декларация"
      - "отдельный банковский счет"
      - "вознаграждение управляющего"
      - "отчет управляющего"
      - "фидуциарные отношения"
      - "заботливость добросовестного управляющего"
    low:
      - "ценные бумаги"
      - "паевой фонд"
      - "недвижимость"
      - "ПИФ"
      - "управляющая компания"
      - "отдельный баланс"
  phrases:
    high:
      - Учредитель передает в доверительное управление
      - Управляющий действует от своего имени с пометкой Д.У.
      - Имущество учитывается на отдельном балансе
      - Вознаграждение выплачивается за счет доходов от использования
      - Доверительный управляющий обязан осуществлять управление с заботливостью добросовестного управляющего
      - Максимальный срок договора не может превышать пять лет
    medium:
      - Управляющий обязан представлять учредителю отчет о своей деятельности
      - Имущество обособляется от другого имущества учредителя и управляющего
      - Денежные средства могут быть предметом ДУ только в случаях, предусмотренных законом
  patterns:
    required:
      - (?i)(доверительн.*управлени|учредитель.*управления|доверительный.*управляющий|имущество.*в.*управлении)
    optional:
      - (?i)(выгодоприобретатель|Д\.У\.|инвестиционн.*деклараци|отдельный.*баланс)
  exclusions:
    - управление многоквартирным домом (особый договор по ЖК РФ)
    - аренда с правом субаренды (арендатор платит фикс и забирает прибыль себе)
    - хранение (цель — сохранность, а не доход)
    - поручение/комиссия (представительство или сделки от имени)
  exclusion_logic:
    - condition: "mkd_management AND housing_code_reference"
      target: "reject:housing_services"
      confidence: 0.95
      description: "Если предметом является управление многоквартирным домом - это особый договор по ЖК РФ"
    - condition: "rent_payments AND profit_to_tenant"
      target: "reclassify:contract_2.1"
      confidence: 0.90
      description: "Если плательщик получает всю прибыль от использования имущества - это аренда с правом субаренды"
  weights:
    keyword_high: 3.5
    keyword_medium: 1.5
    keyword_low: 0.5
    phrase_high: 4.0
    phrase_medium: 1.0
    pattern_required: 5.0
    pattern_optional: 1.0
  classification:
    min_confidence: 0.90
    max_matches: 2

party_roles:
  - Учредитель управления (Settlor) — собственник активов, передающий имущество
  - Доверительный управляющий (Trustee) — профессионал (ИП или коммерческая организация, кроме унитарного предприятия)
  - Выгодоприобретатель (Beneficiary) — получатель дохода (может совпадать с учредителем)

essential_terms:
  - Состав имущества, передаваемого в доверительное управление (предмет договора)
  - Наименование выгодоприобретателя (в чьих интересах осуществляется управление)
  - Размер и форма вознаграждения управляющего (ст. 1016 ГК РФ)
  - Срок действия договора (не более 5 лет)

specific_risks:
  - Смешение активов (риск взыскания по личным долгам управляющего)
  - Превышение полномочий (сделки без пометки "Д.У." обязывают управляющего лично)
  - Убытки от управления (управляющий отвечает всем своим имуществом, если не проявил должной заботливости)
  - Недобросовестность или некомпетентность управляющего
  - Споры о размере и распределении полученных доходов
  - Конфликт интересов при управлении имуществом нескольких учредителей

aliases:
  - Договор ДУ
  - Asset Management Agreement
  - Trust Management
  - Договор управления активами
  - Доверительное управление ценными бумагами

section_markers:
  - Предмет договора (состав имущества)
  - Права и обязанности сторон (инвестиционная декларация)
  - Обособление имущества (отдельные счета, учет)
  - Вознаграждение управляющего и возмещение расходов
  - Отчетность управляющего
  - Ответственность сторон (ст. 1022 ГК РФ)
  - Порядок прекращения договора
  - Конфиденциальность
  - Разрешение споров
  - Заключительные положения

notes: |
  ОСОБЕННОСТИ И ПРАВИЛА ПРИМЕНЕНИЯ:
  1. Доверительный управляющий должен быть ИП или коммерческой организацией (ст. 1015 ГК РФ)
  2. Денежные средства могут быть предметом ДУ только в случаях, предусмотренных законом (банки, ПИФы, профучастники)
  3. Передача недвижимости в ДУ подлежит государственной регистрации (как обременение права собственности)
  4. Управляющий обязан указывать "Д.У." во всех документах, иначе отвечает личным имуществом (ст. 1012 п. 3 ГК РФ)
  5. Имущество учитывается на отдельном балансе и банковском счете (ст. 1018 ГК РФ)

# ════════════════════════════════════════════════════════════
# 🆕 ВАЛИДАЦИОННЫЕ СЕКЦИИ (VALIDATION ENGINE v2.0) - HYBRID PRO
# ════════════════════════════════════════════════════════════

validation_metadata:
  validation_version: "2.1"
  last_updated: "2026-02-07"
  author: "Legal AI Team (Fiduciary Hybrid Pro)"

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 1: ПРИМЕНИМОЕ ЗАКОНОДАТЕЛЬСТВО (оптимизированное)
  # ──────────────────────────────────────────────────────────
  legal_base:
    primary:
      - "Глава 53 ГК РФ (ст. 1012-1026) - доверительное управление имуществом"
      - "ст. 1015 ГК РФ - доверительный управляющий"
      - "ст. 1016 ГК РФ - существенные условия договора"
    secondary:
      - "ст. 1018 ГК РФ - обособление имущества"
      - "ст. 1022 ГК РФ - ответственность управляющего"
      - "ст. 1023 ГК РФ - вознаграждение и расходы"
    related:
      - "Федеральный закон от 29.11.2001 № 156-ФЗ 'Об инвестиционных фондах' (для ПИФ)"
      - "Федеральный закон от 22.04.1996 № 39-ФЗ 'О рынке ценных бумаг'"
      - "Федеральный закон от 13.07.2015 № 218-ФЗ 'О государственной регистрации недвижимости'"

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 2: ОБЯЗАТЕЛЬНЫЕ ЭЛЕМЕНТЫ (ESSENTIALIA NEGOTII)
  # ──────────────────────────────────────────────────────────
  essential_elements:
    - element: "trust_property_inventory"
      name: "Состав передаваемого имущества"
      required: true
      legal_base: "ст. 1016 ГК РФ"
      description: "Точный перечень активов (недвижимость, ценные бумаги, имущественные права). Деньги - только для специальных субъектов."
      validation_rules:
        - "presence_check"
        - "inventory_attachment_check"
        - "specific_identification"
    
    - element: "beneficiary_identification"
      name: "Идентификация выгодоприобретателя"
      required: true
      legal_base: "ст. 1016 ГК РФ"
      description: "Лицо, в чьих интересах осуществляется управление. Может быть сам учредитель или третье лицо. Должно быть четко названо."
      validation_rules:
        - "presence_check"
        - "beneficiary_identified"
    
    - element: "trustee_remuneration_terms"
      name: "Вознаграждение управляющего"
      required: true
      legal_base: "ст. 1016, 1023 ГК РФ"
      description: "Размер, форма и порядок выплаты вознаграждения. Если не указано - договор может считаться незаключенным. Важно для профессионального управляющего."
      validation_rules:
        - "presence_check"
        - "fee_structure_check"
        - "payment_procedure_specified"
    
    - element: "contract_term_limitation"
      name: "Срок договора (максимум 5 лет)"
      required: true
      legal_base: "ст. 1016 ГК РФ"
      description: "Не более 5 лет, если законом не установлено иное. При отсутствии срока считается заключенным на 5 лет."
      validation_rules:
        - "term_max_5_years_check"
        - "automatic_5_years_if_absent"

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 3: ЗАЩИТНЫЕ УСЛОВИЯ (PROTECTIVE CLAUSES) - OPTIMIZED
  # ──────────────────────────────────────────────────────────
  protective_clauses:
    
    # --- ЗАЩИТА УЧРЕДИТЕЛЯ (Settlor Protection) ---
    settlor_protection:
      - clause_id: "asset_segregation_requirement"
        name: "Требование обособления имущества"
        risk_if_missing: |
          Если активы не обособлены (нет отдельного счета, баланса), кредиторы управляющего могут наложить на них взыскание.
          Это ключевая защита активов в ДУ (ст. 1018 ГК РФ). Без обособления теряется смысл доверительного управления.
        legal_base: "ст. 1018 ГК РФ"
        severity: "critical"
        affected_party: "settlor"
        detection:
          positive_keywords:
            - "отдельный банковский счет"
            - "отдельный баланс"
            - "обособленный учет"
            - "знак Д.У."
            - "имущество не является собственностью управляющего"
            - "имущество не подлежит взысканию по долгам управляющего"
          context_patterns:
            - '(?i)имущество.*учитывается.*на.*отдельном.*балансе.*управляющего'
      
      - clause_id: "investment_policy_limitations"
        name: "Инвестиционная декларация и ограничения полномочий"
        risk_if_missing: |
          Учредитель должен ограничить полномочия управляющего: "не покупать высокорискованные активы", "не продавать недвижимость без согласия".
          Без инвестиционной декларации управляющий может делать что угодно, формально "управляя", но с нежелательными рисками.
        legal_base: "Свобода договора, принцип определенности условий"
        severity: "high"
        affected_party: "settlor"
        detection:
          positive_keywords:
            - "инвестиционная декларация"
            - "ограничение полномочий"
            - "согласование сделок"
            - "стратегия управления"
            - "запрещенные операции"
            - "лимиты по рискам"
            - "диверсификация портфеля"
          context_patterns:
            - '(?i)управляющий.*обязан.*осуществлять.*управление.*в.*соответствии.*с.*инвестиционной.*декларацией'
      
      - clause_id: "trustee_full_liability"
        name: "Полная ответственность управляющего за убытки"
        risk_if_missing: |
          Управляющий отвечает за любое уменьшение стоимости имущества, если не докажет форс-мажор или действия учредителя (ст. 1022).
          Нельзя ограничивать ответственность формулой "только за вину". Он профессионал и несет повышенную ответственность.
        legal_base: "ст. 1022 ГК РФ"
        severity: "high"
        affected_party: "settlor"
        detection:
          positive_keywords:
            - "возместить реальный ущерб"
            - "упущенная выгода"
            - "если не проявил должной заботливости"
            - "отвечает всем своим имуществом"
            - "стандарт добросовестного управляющего"
          negative_keywords:
            - "только за вину"
            - "ограничение ответственности суммой вознаграждения"
          context_patterns:
            - '(?i)управляющий.*несет.*ответственность.*за.*убытки.*если.*не.*докажет.*что.*они.*произошли.*вследствие'
    
    # --- ЗАЩИТА УПРАВЛЯЮЩЕГО (Trustee Protection) ---
    trustee_protection:
      - clause_id: "expenses_reimbursement_mechanism"
        name: "Механизм возмещения необходимых расходов"
        risk_if_missing: |
          Управляющий имеет право на возмещение необходимых расходов за счет имущества (ст. 1023). 
          Без определения лимита и состава этих расходов учредитель может оспорить их как необоснованные.
          Особенно важно при управлении недвижимостью (ремонт, налоги).
        legal_base: "ст. 1023 ГК РФ"
        severity: "high"
        affected_party: "trustee"
        detection:
          positive_keywords:
            - "возмещение необходимых расходов"
            - "за счет доходов от использования"
            - "до получения вознаграждения"
            - "лимит расходов без согласования"
            - "перечень возмещаемых расходов"
          context_patterns:
            - '(?i)расходы.*превышающие.*\d+.*рублей.*подлежат.*предварительному.*согласованию'
      
      - clause_id: "du_mark_obligation"
        name: "Обязанность указания статуса Д.У. в документах"
        risk_if_missing: |
          Управляющий обязан указывать "Д.У." во всех документах и сделках. Если забыл — отвечает ЛИЧНЫМ имуществом (ст. 1012 п. 3).
          Это критичное требование, нарушение которого ведет к персональной ответственности управляющего.
        legal_base: "ст. 1012 п. 3 ГК РФ"
        severity: "critical"
        affected_party: "trustee"
        detection:
          positive_keywords:
            - "действует в качестве управляющего"
            - "пометка Д.У."
            - "сообщить контрагентам"
            - "указание на доверительное управление"
            - "все документы подписываются с пометкой"
          context_patterns:
            - '(?i)управляющий.*обязан.*указывать.*в.*документах.*что.*действует.*в.*качестве.*доверительного.*управляющего'

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 4: ДОПОЛНИТЕЛЬНЫЕ PROTECTIVE CLAUSES
  # ──────────────────────────────────────────────────────────
  additional_protective_clauses:
    
    # Регистрация для недвижимости
    settlor_protection:
      - clause_id: "real_estate_registration_requirement"
        name: "Требование государственной регистрации для недвижимости"
        risk_if_missing: |
          Передача недвижимости в ДУ подлежит регистрации в ЕГРН как обременение права собственности.
          Без регистрации договор недействителен для третьих лиц. Особенно критично для защиты от претензий кредиторов управляющего.
        legal_base: "ст. 1017 ГК РФ, ФЗ-218"
        severity: "critical"
        affected_party: "settlor"
        detection:
          positive_keywords:
            - "государственная регистрация передачи"
            - "обременение права собственности"
            - "регистрация в ЕГРН"
            - "внесение записи в реестр"
          context_patterns:
            - '(?i)передача.*недвижимости.*в.*доверительное.*управление.*подлежит.*государственной.*регистрации'
        conditional_checks:
          - trigger: "real_estate_subject"
            keywords: ["недвижимость", "здание", "помещение", "квартира", "земельный участок"]
            rule: "registration_clause_required"
            severity: "critical"
    
    # Конфликт интересов
    settlor_protection:
      - clause_id: "conflict_of_interest_management"
        name: "Управление конфликтом интересов"
        risk_if_missing: |
          Управляющий может одновременно управлять имуществом нескольких учредителей, иметь собственные активы.
          Возникает конфликт интересов: выгодные сделки для одного в ущерб другому. Без процедур раскрытия учредитель несет убытки.
        legal_base: "ст. 10 ГК РФ (добросовестность)"
        severity: "high"
        affected_party: "settlor"
        detection:
          positive_keywords:
            - "конфликт интересов"
            - "раскрытие конфликта интересов"
            - "сделки с аффилированными лицами"
            - "запрет на сделки с самим собой"
            - "приоритет интересов учредителя"
            - "китайская стена (Chinese wall)"
          context_patterns:
            - '(?i)управляющий.*обязан.*раскрывать.*информацию.*о.*возможном.*конфликте.*интересов'
    
    # Отчетность и контроль
    settlor_protection:
      - clause_id: "trustee_reporting_transparency"
        name: "Прозрачная отчетность и право контроля"
        risk_if_missing: |
          Управляющий обязан представлять отчеты (ст. 1020). Без четкого формата и сроков отчеты могут быть формальными.
          Учредитель не сможет оценить эффективность управления и выявить нарушения. Особенно важно для финансовых активов.
        legal_base: "ст. 1020 ГК РФ"
        severity: "high"
        affected_party: "settlor"
        detection:
          positive_keywords:
            - "отчет управляющего"
            - "периодичность отчетности"
            - "форма отчета"
            - "перечень информации в отчете"
            - "отчет о совершенных сделках"
            - "право запроса дополнительной информации"
            - "аудиторское подтверждение отчета"
          context_patterns:
            - '(?i)управляющий.*представляет.*учредителю.*ежеквартальный.*отчет.*содержащий.*следующую.*информацию'