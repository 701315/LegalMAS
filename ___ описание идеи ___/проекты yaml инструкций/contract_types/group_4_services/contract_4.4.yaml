type: contract_4.4
name: Договор хранения
description: |
  Соглашение, по которому хранитель обязуется хранить вещь, переданную ему поклажедателем, 
  и возвратить эту вещь в сохранности (ст. 886 ГК РФ). Ключевой признак: цель — обеспечение 
  сохранности, а не пользование (как в аренде). Хранитель не вправе пользоваться вещью без 
  согласия поклажедателя. Может быть возмездным (товарный склад) или безвозмездным (гардероб). 
  Профессиональное хранение (осуществляемое как предпринимательская деятельность) предполагает 
  повышенную ответственность хранителя (ст. 901 ГК РФ). Особые виды: хранение в ломбарде, 
  камерах хранения, банковских ячейках, гостиницах, секвестр.
version: 2.1
parent: class_4_service_provision
sibling_contracts:
  - contract_2.1 # Аренда (пользование имуществом)
  - contract_4.3 # Экспедиция (часто включает хранение)
  - contract_4.5 # Страхование (передача рисков, а не вещи)
metadata:
  category: contract
  subcategory: custodial_services
  complexity: medium
  risk_level: medium-high
  legal_base: Глава 47 ГК РФ (ст. 886-926)
  hierarchy_position: "specialized_custodial"

# ════════════════════════════════════════════════════════════
# БАЗОВАЯ ИНФОРМАЦИЯ (HYBRID OPTIMIZED)
# ════════════════════════════════════════════════════════════
rules:
  keywords:
    high:
      - "хранен"
      - "хранитель"
      - "поклажедатель"
      - "принять на хранение"
      - "складское свидетельство"
      - "сохранная расписка"
      - "ответственное хранение"
      - "возврат в сохранности"
    medium:
      - "обеспечение сохранности"
      - "возврат в том же состоянии"
      - "естественная убыль"
      - "товарный склад"
      - "условия хранения"
      - "срок хранения"
      - "платное хранение"
      - "безвозмездное хранение"
    low:
      - "ломбард"
      - "камера хранения"
      - "гардероб"
      - "банковская ячейка"
      - "секвестр"
      - "иррегулярное хранение"
      - "именная складская расписка"
      - "двойное складское свидетельство"
  phrases:
    high:
      - Хранитель обязуется хранить вещь и возвратить ее в сохранности
      - Вещь передается на ответственное хранение
      - Хранитель не вправе пользоваться вещью без согласия поклажедателя
      - Риск случайной гибели несет Хранитель (профессиональный)
      - Поклажедатель имеет право забрать вещь по первому требованию
    medium:
      - Хранитель обязан принять все предусмотренные договором меры для сохранности вещи
      - При иррегулярном хранении вещи смешиваются с вещами того же рода и качества
      - По истечении срока хранения невостребованная вещь подлежит реализации
      - Хранитель вправе удерживать вещь до уплаты вознаграждения и возмещения расходов
  patterns:
    required:
      - (?i)(хранен|хранитель.*обязуется.*хранить|поклажедатель.*передает.*на.*хранение)
    optional:
      - (?i)(складск.*свидетельств|сохранн.*расписка|ответственн.*хранен|иррегулярн.*хранен)
  exclusions:
    - договор аренды (цель — пользование, а не сохранность) → contract_2.1
    - договор охраны (услуга по защите объекта, а не принятие вещи)
    - договор доверительного управления (управление активами)
    - договор займа (деньги или родовые вещи с обязательством возврата такого же количества)
  exclusion_logic:
    - condition: "use_right_specified AND payment_for_use"
      target: "subclass:contract_2.1"
      confidence: 0.95
      description: "Если предоставляется право пользования имуществом за плату - это аренда"
    - condition: "only_protection_services AND no_physical_transfer"
      target: "reject:security_services"
      confidence: 0.90
      description: "Если оказываются только услуги по охране без приема вещи - это охранные услуги"
  weights:
    keyword_high: 3.5
    keyword_medium: 1.5
    keyword_low: 0.5
    phrase_high: 4.0
    phrase_medium: 1.0
    pattern_required: 5.0
    pattern_optional: 1.0
  classification:
    min_confidence: 0.85
    max_matches: 2

party_roles:
  - Хранитель (Custodian) — лицо, принимающее вещь, обязанное обеспечить ее сохранность
  - Поклажедатель (Depositor) — лицо, сдающее вещь, имеющее право на ее получение обратно

essential_terms:
  - Предмет договора (вещь, передаваемая на хранение с индивидуальными или родовыми признаками)
  - Факт принятия вещи на хранение (акт приема-передачи по форме МХ-1, сохранная расписка)

specific_risks:
  - Утрата, недостача или повреждение хранимого имущества (особенно при пожаре, затоплении)
  - Смешение вещей при иррегулярном хранении (можно получить чужое зерно худшего качества)
  - Невыборка вещи поклажедателем (хранитель вынужден продавать невостребованный груз)
  - Несанкционированное использование вещи хранителем или третьими лицами
  - Споры о размере вознаграждения и расходах на хранение
  - Риск отказа в выдаче вещи при предъявлении прав третьими лицами (арест, залог)

aliases:
  - Договор складского хранения
  - Договор ответственного хранения
  - Договор хранения товаров
  - Storage Agreement
  - Договор ответхранения
  - Договор хранения с выдачей складского свидетельства

section_markers:
  - Предмет договора (описание вещи, количество, качество)
  - Условия хранения (температура, влажность, специальные требования)
  - Срок хранения (определенный срок или "до востребования")
  - Порядок приема и выдачи вещи (акты МХ-1, МХ-3)
  - Права и обязанности сторон
  - Вознаграждение хранителя и возмещение расходов
  - Ответственность сторон (пределы, исключения)
  - Порядок реализации невостребованной вещи
  - Конфиденциальность
  - Разрешение споров
  - Заключительные положения

notes: |
  ОСОБЕННОСТИ И ПРАВИЛА ПРИМЕНЕНИЯ:
  1. Профессиональный хранитель (коммерческая организация) отвечает за утрату вещи независимо от вины, кроме случаев непреодолимой силы (ст. 901 ГК РФ)
  2. Договор хранения, предусматривающий обязанность хранителя принять вещь, является публичным для профессиональных хранителей (ст. 886, 426 ГК РФ)
  3. Передача вещи на хранение подтверждается актами по формам МХ-1 (прием) и МХ-3 (выдача), утвержденными Постановлением Росстата № 66
  4. При иррегулярном хранении (родовые вещи) хранитель вправе смешивать вещи разных поклажедателей (ст. 890 ГК РФ)
  5. Хранитель вправе удерживать вещь до уплаты вознаграждения и возмещения расходов (ст. 899, 920 ГК РФ)
  6. В ломбарде залогодатель не отвечает за вещь после ее продажи (ст. 358 ГК РФ)

# ════════════════════════════════════════════════════════════
# 🆕 ВАЛИДАЦИОННЫЕ СЕКЦИИ (VALIDATION ENGINE v2.0) - HYBRID
# ════════════════════════════════════════════════════════════

validation_metadata:
  validation_version: "2.1"
  last_updated: "2026-02-07"
  author: "Legal AI Team (Custody Hybrid)"

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 1: ПРИМЕНИМОЕ ЗАКОНОДАТЕЛЬСТВО (объединенное)
  # ──────────────────────────────────────────────────────────
  legal_base:
    primary:
      - "Глава 47 ГК РФ (ст. 886-926) - общие положения о хранении"
      - "ст. 901 ГК РФ - основания ответственности хранителя"
    secondary:
      - "ст. 358 ГК РФ - особенности хранения в ломбарде"
      - "ст. 904 ГК РФ - досрочное истребование вещи"
      - "ст. 912-916 ГК РФ - складские документы"
    related:
      - "Постановление Росстата № 66 'Об утверждении унифицированных форм первичной учетной документации' (формы МХ-1, МХ-3)"
      - "Федеральный закон от 19.07.2007 № 196-ФЗ 'О ломбардах'"
      - "Закон РФ от 07.02.1992 № 2300-1 'О защите прав потребителей' (при хранении вещей граждан)"
      - "Глава 25 ГК РФ - ответственность за нарушение обязательств"

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 2: ОБЯЗАТЕЛЬНЫЕ ЭЛЕМЕНТЫ (ESSENTIALIA NEGOTII)
  # ──────────────────────────────────────────────────────────
  essential_elements:
    - element: "storage_object_description"
      name: "Предмет хранения (детальное описание)"
      required: true
      legal_base: "ст. 886, 887 ГК РФ"
      description: |
        Индивидуально-определенная вещь (с серийным номером, уникальными признаками) или 
        родовые вещи (зерно, песок) с указанием количества, качества, стоимости.
        Для родовых вещей при иррегулярном хранении - качественные характеристики.
      validation_rules:
        - "presence_check"
        - "quantity_and_quality_check"
        - "value_specification_recommended"
      conditional_checks:
        - trigger: "irregular_storage_keywords"
          keywords: ["иррегулярное", "родовые вещи", "смешение", "элеватор", "нефтехранилище"]
          rule: "quality_grade_required"
          legal_base: "ст. 890 ГК РФ"
          severity: "high"
    
    - element: "storage_term_condition"
      name: "Срок хранения или условие 'до востребования'"
      required: false
      legal_base: "ст. 889, 904 ГК РФ"
      description: |
        Срок может быть определен или не определен. При отсутствии срока хранение считается 
        'до востребования'. Поклажедатель вправе истребовать вещь в любой момент.
      validation_rules:
        - "term_clarity_check"
        - "demand_basis_if_no_term"
    
    - element: "acceptance_documentation"
      name: "Документальное подтверждение приема вещи"
      required: true
      legal_base: "ст. 887 ГК РФ, Постановление Росстата № 66"
      description: |
        Факт передачи вещи должен подтверждаться актом (форма МХ-1), сохранной распиской, 
        складским свидетельством. Без документального подтверждения сложно доказать передачу.
      validation_rules:
        - "acceptance_doc_specified"
        - "form_reference_if_professional"

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 3: ЗАЩИТНЫЕ УСЛОВИЯ (PROTECTIVE CLAUSES) - ГИБРИД
  # ──────────────────────────────────────────────────────────
  protective_clauses:
    
    # --- ЗАЩИТА ПОКЛАЖЕДАТЕЛЯ (Depositor Protection) ---
    depositor_protection:
      - clause_id: "professional_custodian_full_liability"
        name: "Полная ответственность профессионального хранителя"
        risk_if_missing: |
          Профессиональный хранитель (товарный склад, ломбард) отвечает за утрату, недостачу, 
          повреждение вещи независимо от вины (ст. 901 ГК РФ). В договоре могут попытаться 
          ограничить ответственность формулировками "только при наличии вины", что незаконно.
          Поклажедатель рискует не получить полного возмещения.
        legal_base: "ст. 901 ГК РФ"
        severity: "critical"
        affected_party: "depositor"
        detection:
          positive_keywords:
            - "независимо от вины"
            - "полная материальная ответственность"
            - "профессиональный хранитель отвечает"
            - "возмещение полной стоимости"
            - "за исключением непреодолимой силы"
          negative_keywords:
            - "только при наличии вины"
            - "отвечает только за виновные действия"
            - "ограничение ответственности суммой вознаграждения"
          context_patterns:
            - '(?i)хранитель.*несет.*ответственность.*за.*утрату.*недостачу.*повреждение.*вещи.*независимо.*от.*вины'
      
      - clause_id: "return_on_first_demand_right"
        name: "Право на возврат вещи по первому требованию"
        risk_if_missing: |
          Поклажедатель имеет право забрать вещь в любой момент, даже если договор срочный 
          (ст. 904 ГК РФ). Любые штрафы за досрочный возврат ничтожны для потребителей и 
          оспоримы для бизнеса. Без явного указания хранитель может задерживать выдачу.
        legal_base: "ст. 904 ГК РФ"
        severity: "high"
        affected_party: "depositor"
        detection:
          positive_keywords:
            - "по первому требованию"
            - "возвратить вещь немедленно"
            - "досрочное прекращение"
            - "право истребовать в любой момент"
            - "без уплаты штрафа за досрочный возврат"
          context_patterns:
            - '(?i)поклажедатель.*вправе.*истребовать.*вещь.*в.*любое.*время.*независимо.*от.*срока.*договора'
      
      - clause_id: "item_identification_return_procedure"
        name: "Четкая процедура идентификации и возврата вещи"
        risk_if_missing: |
          При возврате, особенно при иррегулярном хранении, возможны споры: не то количество, 
          не то качество. Без акта выдачи (форма МХ-3) поклажедатель не сможет доказать 
          недостачу или повреждение, полученные при возврате.
        legal_base: "ст. 887, 900 ГК РФ, Постановление Росстата № 66"
        severity: "high"
        affected_party: "depositor"
        detection:
          positive_keywords:
            - "акт выдачи (МХ-3)"
            - "проверка при возврате"
            - "идентификация по номеру"
            - "маркировка вещи"
            - "описание состояния при возврате"
            - "фотографирование"
            - "подписание акта о возврате"
          context_patterns:
            - '(?i)возврат.*вещи.*оформляется.*актом.*по.*форме.*МХ.*3'
            - '(?i)при.*возврате.*составляется.*акт.*с.*указанием.*состояния.*вещи.*и.*количества'
    
    # --- ЗАЩИТА ХРАНИТЕЛЯ (Custodian Protection) ---
    custodian_protection:
      - clause_id: "uncollected_goods_disposal_procedure"
        name: "Процедура реализации невостребованной вещи"
        risk_if_missing: |
          Поклажедатель может не забрать вещь и не платить за хранение. Хранитель не может 
          вечно хранить вещь. Ст. 899 ГК РФ разрешает продать вещь после письменного 
          предупреждения. Без процедуры хранитель несет убытки.
        legal_base: "ст. 899 ГК РФ"
        severity: "high"
        affected_party: "custodian"
        detection:
          positive_keywords:
            - "продать невостребованную вещь"
            - "самостоятельная реализация"
            - "по цене, сложившейся в месте хранения"
            - "предупредив письменно"
            - "уведомление за 30 дней"
            - "возмещение расходов из выручки"
            - "остаток возвращается поклажедателю"
          context_patterns:
            - '(?i)по.*истечении.*\d+.*дней.*после.*направления.*уведомления.*невостребованная.*вещь.*подлежит.*реализации'
      
      - clause_id: "extraordinary_expenses_reimbursement"
        name: "Возмещение чрезвычайных расходов на сохранность"
        risk_if_missing: |
          При угрозе сохранности вещи (болезнь животного, порча продуктов) хранитель вынужден 
          нести чрезвычайные расходы (ст. 898 ГК РФ). Без условия о возмещении и лимитов 
          эти расходы ложатся на хранителя, хотя он действовал в интересах поклажедателя.
        legal_base: "ст. 898 ГК РФ"
        severity: "medium"
        affected_party: "custodian"
        detection:
          positive_keywords:
            - "чрезвычайные расходы"
            - "согласие поклажедателя"
            - "возмещение затрат"
            - "лимит расходов без согласования"
            - "расходы на предотвращение ущерба"
            - "неотложные меры"
          context_patterns:
            - '(?i)расходы.*превышающие.*\d+.*рублей.*подлежат.*предварительному.*согласованию.*с.*поклажедателем'
      
      - clause_id: "item_properties_danger_warranty"
        name: "Гарантия раскрытия свойств вещи и отсутствия опасности"
        risk_if_missing: |
          Поклажедатель может передать опасную вещь (легковоспламеняющуюся, токсичную, 
          биологически опасную) без предупреждения. Это создает угрозу персоналу, другим 
          вещам, помещению. Хранитель несет ответственность и убытки.
        legal_base: "ст. 893, 894 ГК РФ"
        severity: "critical"
        affected_party: "custodian"
        detection:
          positive_keywords:
            - "раскрытие свойств вещи"
            - "опасные свойства"
            - "предупреждение об опасности"
            - "гарантия безопасности"
            - "отсутствие запрещенных веществ"
            - "ответственность за сокрытие информации"
            - "право на уничтожение опасной вещи"
            - "штраф за сокрытие"
          context_patterns:
            - '(?i)поклажедатель.*обязан.*предупредить.*хранителя.*об.*опасных.*свойствах.*вещи'
            - '(?i)в.*случае.*обнаружения.*опасных.*свойств.*хранитель.*вправе.*уничтожить.*вещь.*за.*счет.*поклажедателя'

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 4: ДОПОЛНИТЕЛЬНЫЕ PROTECTIVE CLAUSES
  # ──────────────────────────────────────────────────────────
  additional_protective_clauses:
    
    # Для иррегулярного хранения (смешение вещей)
    depositor_protection:
      - clause_id: "irregular_storage_commingling_rules"
        name: "Условия обезличения при иррегулярном хранении"
        risk_if_missing: |
          При иррегулярном хранении (зерно в элеваторе, нефть в резервуаре) вещи смешиваются. 
          Поклажедатель получает право на долю в общей массе. Без указания качества 
          ("того же рода и качества") можно получить худшее качество при возврате.
        legal_base: "ст. 890 ГК РФ"
        severity: "high"
        affected_party: "depositor"
        detection:
          positive_keywords:
            - "хранение с обезличением"
            - "иррегулярное хранение"
            - "смешиваются с вещами других поклажедателей"
            - "того же рода и качества"
            - "доля в общем имуществе"
            - "качество возвращаемых вещей"
            - "сортность, класс, категория"
          context_patterns:
            - '(?i)при.*иррегулярном.*хранении.*хранитель.*вправе.*смешивать.*вещи.*одного.*рода.*и.*качества'
            - '(?i)возвращается.*количество.*вещей.*того.*же.*рода.*и.*качества'
        conditional_checks:
          - trigger: "bulk_storage_keywords"
            keywords: ["зерно", "песок", "нефть", "уголь", "элеватор", "резервуар", "силос"]
            rule: "irregular_storage_clauses_required"
            severity: "high"
    
    # Для складских свидетельств
    depositor_protection:
      - clause_id: "warehouse_certificate_issuance_terms"
        name: "Условия выдачи и обращения складских свидетельств"
        risk_if_missing: |
          Складское свидетельство - ценная бумага (ст. 912 ГК РФ). Без четких условий о порядке 
          выдачи, передаче, залоге возникают споры о правах на товар. Особенно критично при 
          использовании двойного складского свидетельства для привлечения финансирования.
        legal_base: "ст. 912-916 ГК РФ"
        severity: "high"
        affected_party: "depositor"
        detection:
          positive_keywords:
            - "складское свидетельство"
            - "именная складская расписка"
            - "двойное складское свидетельство"
            - "варрант"
            - "залоговое свидетельство"
            - "передача прав по свидетельству"
            - "выдача товара по предъявлении свидетельства"
          context_patterns:
            - '(?i)хранитель.*выдает.*двойное.*складское.*свидетельство.*состоящее.*из.*складского.*и.*залогового.*свидетельства'
    
    # Для профессиональных хранителей - разумное ограничение ответственности
    custodian_protection:
      - clause_id: "reasonable_liability_limitation_professional"
        name: "Разумное ограничение ответственности для профессионального хранителя"
        risk_if_missing: |
          Профессиональный хранитель отвечает независимо от вины, что может привести к 
          катастрофическим выплатам. Разумное ограничение (кратное вознаграждение, 
          заявленная стоимость) делает бизнес устойчивым. Важно: не должно нарушать 
          права потребителей.
        legal_base: "ст. 400, 901, 902 ГК РФ"
        severity: "critical"
        affected_party: "custodian"
        detection:
          positive_keywords:
            - "ограничение ответственности"
            - "в размере заявленной стоимости"
            - "кратное вознаграждение"
            - "не более реальной стоимости"
            - "для предпринимательской деятельности"
            - "при отсутствии заявленной стоимости"
          context_patterns:
            - '(?i)ответственность.*хранителя.*ограничена.*\d+.*кратным.*размером.*вознаграждения.*но.*не.*более.*реальной.*стоимости'
        conditional_checks:
          - trigger: "professional_custodian_keywords"
            keywords: ["профессиональный хранитель", "товарный склад", "складское хозяйство"]
            rule: "liability_limitation_clause_recommended"
            severity: "high"
    
    # Для третьих лиц требований
    custodian_protection:
      - clause_id: "third_party_claims_suspension_procedure"
        name: "Приостановление выдачи при требованиях третьих лиц"
        risk_if_missing: |
          На хранимую вещь могут быть предъявлены права третьими лицами (арест, залог). 
          Без процедуры приостановления выдачи и уведомления поклажедателя хранитель может 
          быть привлечен к ответственности за неправомерную выдачу.
        legal_base: "ст. 895, 896 ГК РФ"
        severity: "high"
        affected_party: "custodian"
        detection:
          positive_keywords:
            - "требования третьих лиц"
            - "арест имущества"
            - "судебные приставы"
            - "уведомление поклажедателя"
            - "приостановление выдачи"
            - "судебное решение"
            - "исполнительный документ"
          context_patterns:
            - '(?i)при.*предъявлении.*требований.*третьими.*лицами.*хранитель.*обязан.*уведомить.*поклажедателя.*и.*приостановить.*выдачу'
    
    # Для естественной убыли
    both_protection:
      - clause_id: "natural_loss_norms_application"
        name: "Применение норм естественной убыли"
        risk_if_missing: |
          При хранении некоторых товаров (продукты, жидкости) возможна естественная убыль 
          (усушка, утруска). Без ссылки на утвержденные нормы возникают споры о недостаче: 
          поклажедатель считает это утратой, хранитель - естественным процессом.
        legal_base: "Нормы естественной убыли, утвержденные Минэкономразвития"
        severity: "medium"
        affected_party: "both"
        detection:
          positive_keywords:
            - "естественная убыль"
            - "нормы естественной убыли"
            - "усушка, утруска"
            - "утрата в пределах норм"
            - "нормативные потери"
          context_patterns:
            - '(?i)ответственность.*за.*недостачу.*в.*пределах.*норм.*естественной.*убыли.*не.*возлагается'