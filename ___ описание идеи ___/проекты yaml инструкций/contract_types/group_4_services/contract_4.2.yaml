type: contract_4.2
name: Договор перевозки груза
description: |
  Соглашение, по которому перевозчик обязуется доставить вверенный ему грузоотправителем груз в пункт назначения 
  и выдать его управомоченному лицу (грузополучателю), а грузоотправитель обязуется уплатить провозную плату.
  Регулируется Гл. 40 ГК РФ и специальными транспортными уставами/кодексами (УАТ, КТМ, УЖТ, Воздушный кодекс).
  Характеризуется реальным характером (договор подтверждается транспортной накладной/коносаментом), 
  ограниченной ответственностью перевозчика (независимо от вины) и обязательным претензионным порядком.
version: 2.1
parent: class_4_service_provision
sibling_contracts:
  - contract_4.1 # Возмездное оказание услуг (родственная категория)
  - contract_4.3 # Транспортная экспедиция (организация перевозки)
  - contract_2.3 # Аренда ТС с экипажем (плата за время, а не за доставку)
metadata:
  category: contract
  subcategory: logistics_transport
  complexity: medium-high
  risk_level: high
  legal_base: Глава 40 ГК РФ (ст. 784-800) + транспортные уставы
  hierarchy_position: "specialized_transport"

# ════════════════════════════════════════════════════════════
# БАЗОВАЯ ИНФОРМАЦИЯ (HYBRID OPTIMIZED)
# ════════════════════════════════════════════════════════════
rules:
  keywords:
    high:
      - "перевозк"
      - "перевозчик"
      - "грузоотправитель"
      - "грузополучатель"
      - "груз"
      - "пункт назначения"
      - "транспортная накладная"
      - "коносамент"
      - "провозная плата"
    medium:
      - "доставка груза"
      - "выдача груза"
      - "путевой лист"
      - "заявка на перевозку"
      - "погрузка"
      - "выгрузка"
      - "срок доставки"
      - "транспортное средство"
    low:
      - "водитель"
      - "маршрут"
      - "логистика"
      - "автоперевозка"
      - "железнодорожная перевозка"
      - "авиаперевозка"
      - "морская перевозка"
      - "фрахт"
  phrases:
    high:
      - Перевозчик обязуется доставить вверенный ему груз в пункт назначения и выдать его грузополучателю
      - Заключение договора подтверждается транспортной накладной (коносаментом)
      - Перевозчик несет ответственность за утрату, недостачу и повреждение груза
      - Грузоотправитель обязуется уплатить за перевозку груза установленную плату
      - Право на предъявление иска возникает после предварительного предъявления претензии
    medium:
      - Перевозчик обязан подать транспортные средства в срок, установленный договором
      - Грузоотправитель обязан подготовить груз к перевозке и оформить документы
      - Ответственность перевозчика ограничена и наступает независимо от вины
      - Срок доставки груза определяется правилами перевозок соответствующего вида транспорта
  patterns:
    required:
      - (?i)(перевозк.*груз|перевозчик.*обязуется.*доставить|транспортн.*накладн|грузоотправител)
    optional:
      - (?i)(доставка.*груз|пункт.*назначения|выдача.*груз|провозн.*плата|срок.*доставки)
  exclusions:
    - договор транспортной экспедиции (организация перевозки, но не сама перевозка) → contract_4.3
    - договор аренды транспортного средства с экипажем (плата за время пользования) → contract_2.3
    - договор фрахтования (чартер) - особый вид перевозки
    - перевозка пассажиров и багажа (отдельный подвид)
  exclusion_logic:
    - condition: "organizing_transportation AND no_own_vehicles"
      target: "subclass:contract_4.3"
      confidence: 0.85
      description: "Если сторона организует перевозку, но не осуществляет ее собственными силами - это экспедиция"
    - condition: "vehicle_provided_for_use WITH driver AND payment_per_time"
      target: "reclassify:contract_2.3"
      confidence: 0.90
      description: "Если ТС предоставляется с экипажем и оплата взимается за время использования - это аренда с экипажем"
  weights:
    keyword_high: 3.5
    keyword_medium: 1.5
    keyword_low: 0.5
    phrase_high: 4.0
    phrase_medium: 1.0
    pattern_required: 5.0
    pattern_optional: 1.0
  classification:
    min_confidence: 0.85
    max_matches: 2

party_roles:
  - Перевозчик (Carrier) — транспортная организация или ИП, осуществляющие перевозку на профессиональной основе
  - Грузоотправитель (Shipper/Consignor) — лицо, сдающее груз к перевозке и оплачивающее провозную плату
  - Грузополучатель (Consignee) — лицо, управомоченное на получение груза в пункте назначения (часто не подписывает договор, но имеет права)

essential_terms:
  - Предмет (услуга по доставке конкретного груза из пункта отправления в пункт назначения)
  - Пункт назначения (существенное условие по ст. 785 ГК РФ)
  - Срок доставки (существенное условие по судебной практике, ст. 792 ГК РФ)

specific_risks:
  - Утрата, повреждение, недостача груза с ограниченной ответственностью перевозчика
  - Срыв сроков подачи транспортных средств под погрузку (штрафы по транспортным уставам)
  - Удержание груза перевозчиком при неоплате провозной платы (право удержания)
  - Неправильное оформление транспортных документов, ведущее к спорам о приеме груза
  - Обязательный претензионный порядок с короткими сроками (пропуск срока лишает права на иск)
  - Риск конфискации или задержания груза таможенными органами (для международных перевозок)

aliases:
  - Договор перевозки грузов автомобильным транспортом
  - Транспортный договор
  - Договор об организации перевозок (рамочный)
  - Договор автомобильной перевозки грузов
  - Договор железнодорожной перевозки
  - Договор воздушной перевозки грузов
  - Договор морской перевозки

section_markers:
  - Предмет договора (груз, пункты отправления и назначения)
  - Подача транспортных средств (сроки, тип ТС)
  - Погрузка и выгрузка (обязанности сторон, нормативное время)
  - Срок доставки груза
  - Провозная плата и порядок расчетов
  - Ответственность сторон (за груз, за сроки подачи ТС и доставки)
  - Претензионный порядок (обязательный досудебный)
  - Обстоятельства, освобождающие от ответственности
  - Разрешение споров
  - Срок действия договора

notes: |
  ОСОБЕННОСТИ И ПРАВИЛА ПРИМЕНЕНИЯ:
  1. Договор перевозки груза считается заключенным с момента оформления транспортной накладной (ст. 785 ГК РФ)
  2. Ответственность перевозчика за утрату, недостачу и повреждение груза наступает независимо от вины (ст. 796 ГК РФ)
  3. Обязательный претензионный порядок урегулирования споров (ст. 797 ГК РФ)
  4. Срок исковой давности по требованиям к перевозчику — 1 год (ст. 797 ГК РФ)
  5. Перевозчик вправе удерживать груз до уплаты причитающихся платежей (ст. 790 ГК РФ)
  6. Размер ответственности различается в зависимости от вида транспорта и регулируется специальными уставами

# ════════════════════════════════════════════════════════════
# 🆕 ВАЛИДАЦИОННЫЕ СЕКЦИИ (VALIDATION ENGINE v2.0) - HYBRID
# ════════════════════════════════════════════════════════════

validation_metadata:
  validation_version: "2.1"
  last_updated: "2026-02-07"
  author: "Legal AI Team (Transport Hybrid)"

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 1: ПРИМЕНИМОЕ ЗАКОНОДАТЕЛЬСТВО (объединенное)
  # ──────────────────────────────────────────────────────────
  legal_base:
    primary:
      - "Глава 40 ГК РФ (ст. 784-800) — общие положения о перевозке"
      - "Устав автомобильного транспорта (УАТ) — для автомобильных перевозок"
    secondary:
      - "Кодекс торгового мореплавания РФ (КТМ РФ) — для морских перевозок"
      - "Устав железнодорожного транспорта РФ (УЖТ РФ)"
      - "Воздушный кодекс РФ — для авиаперевозок"
      - "Кодекс внутреннего водного транспорта РФ (КВВТ РФ)"
    related:
      - "Постановление Правительства РФ № 2200 'Об утверждении Правил перевозок грузов автомобильным транспортом'"
      - "ст. 15, 393, 401, 790, 791, 792, 793, 794, 795, 796, 797 ГК РФ (специальные нормы)"
      - "Конвенция о договоре международной дорожной перевозки грузов (КДПГ/CMR)"
      - "Монреальская конвенция 1999 г. (для международных авиаперевозок)"

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 2: ОБЯЗАТЕЛЬНЫЕ ЭЛЕМЕНТЫ (ESSENTIALIA NEGOTII)
  # ──────────────────────────────────────────────────────────
  essential_elements:
    - element: "parties_transport"
      required: true
      legal_base: "ст. 785 ГК РФ"
      description: "Перевозчик должен иметь соответствующую лицензию/разрешение на осуществление перевозок"
      validation_rules:
        - "presence_check"
        - "carrier_license_check"
    
    - element: "cargo_and_route_details"
      name: "Груз и маршрут"
      required: true
      legal_base: "ст. 785 ГК РФ"
      description: "Характеристики груза (наименование, вес, объем, свойства) и четкое указание пунктов отправления и назначения. В рамочном договоре — ссылка на Заявки/Накладные."
      validation_rules:
        - "presence_check"
        - "route_check"
        - "cargo_description_specified"
      conditional_checks:
        - trigger: "dangerous_or_perishable"
          keywords: ["опасный", "скоропортящийся", "негабаритный", "тяжеловесный"]
          rule: "special_cargo_documentation_required"
          legal_base: "ДОПОГ, специальные правила перевозок"
          severity: "critical"
    
    - element: "freight_charge_payment"
      name: "Провозная плата"
      required: true
      legal_base: "ст. 790 ГК РФ"
      description: "Размер платы, тарифы или порядок определения стоимости. Перевозка всегда возмездна."
      validation_rules:
        - "price_specified"
        - "payment_terms_specified"
    
    - element: "delivery_timing"
      required: true
      legal_base: "ст. 792 ГК РФ, транспортные уставы"
      description: "Срок доставки груза — существенное условие по судебной практике"
      validation_rules:
        - "delivery_timing_specified"
        - "reasonable_timing_check"

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 3: ЗАЩИТНЫЕ УСЛОВИЯ (PROTECTIVE CLAUSES) - ГИБРИД
  # ──────────────────────────────────────────────────────────
  protective_clauses:
    
    # --- ЗАЩИТА ГРУЗООТПРАВИТЕЛЯ (Shipper Protection) ---
    shipper_protection:
      - clause_id: "cargo_value_declaration_insurance"
        name: "Объявленная ценность груза и условия страхования"
        risk_if_missing: |
          При утрате/повреждении груза перевозчик возмещает только действительную стоимость (ст. 796 ГК РФ), 
          но не более объявленной ценности. Без объявленной ценности придется доказывать стоимость в суде.
          Для дорогих грузов критично наличие страхования.
        legal_base: "ст. 796 ГК РФ, транспортные уставы"
        severity: "high"
        affected_party: "shipper"
        detection:
          positive_keywords:
            - "объявленная ценность"
            - "стоимость груза"
            - "страхование груза"
            - "страховая сумма"
            - "объявленная стоимость"
          context_patterns:
            - '(?i)грузоотправитель.*вправе.*объявить.*ценность.*груза'
            - '(?i)ответственность.*перевозчика.*ограничена.*объявленной.*стоимостью'
      
      - clause_id: "delivery_deadline_penalty_enhanced"
        name: "Штрафные санкции за просрочку доставки (сверх уставных)"
        risk_if_missing: |
          Транспортные уставы предусматривают мизерные штрафы за просрочку (9% провозной платы в сутки по УАТ).
          Без договорной неустойки грузоотправитель не компенсирует реальные убытки от срыва сроков.
        legal_base: "ст. 792, 793 ГК РФ, ст. 34 УАТ"
        severity: "high"
        affected_party: "shipper"
        detection:
          positive_keywords:
            - "штраф за опоздание"
            - "неустойка за задержку доставки"
            - "пеня за просрочку"
            - "срок доставки"
            - "возмещение убытков от задержки"
          context_patterns:
            - '(?i)за.*нарушение.*срока.*доставки.*перевозчик.*уплачивает.*неустойку.*в.*размере'
            - '(?i)при.*просрочке.*доставки.*свыше.*\d+.*дней.*грузоотправитель.*вправе.*требовать'
      
      - clause_id: "claim_procedure_mandatory_detailed"
        name: "Детализированный обязательный претензионный порядок"
        risk_if_missing: |
          До подачи иска к перевозчику ОБЯЗАТЕЛЬНО предъявление претензии (ст. 797 ГК РФ).
          Сроки короткие: 30 дней для недостачи/повреждения, 45 дней для просрочки (УАТ).
          Пропуск срока лишает права на иск. Без явного указания грузоотправитель может пропустить.
        legal_base: "ст. 797 ГК РФ, транспортные уставы"
        severity: "critical"
        affected_party: "shipper"
        detection:
          positive_keywords:
            - "претензионный порядок"
            - "срок предъявления претензии"
            - "30 дней"
            - "45 дней"
            - "6 месяцев"
            - "обязательный досудебный порядок"
            - "ответ на претензию в течение"
            - "исковое заявление подается после"
          context_patterns:
            - '(?i)претензии.*предъявляются.*в.*течение.*\d+.*дней.*со.*дня.*наступления.*события'
            - '(?i)иск.*может.*быть.*предъявлен.*после.*получения.*ответа.*на.*претензию.*или.*по.*истечении.*\d+.*дней'
    
    # --- ЗАЩИТА ПЕРЕВОЗЧИКА (Carrier Protection) ---
    carrier_protection:
      - clause_id: "lien_right_procedural"
        name: "Право удержания груза с порядком реализации"
        risk_if_missing: |
          При неоплате провозной платы перевозчик вправе удерживать груз (ст. 790, 359 ГК РФ).
          Без процедуры реализации удержанного груза перевозчик вынужден хранить его неопределенно долго,
          неся расходы. Риск споров о правомерности удержания и размере требований.
        legal_base: "ст. 790, 359, 360 ГК РФ"
        severity: "high"
        affected_party: "carrier"
        detection:
          positive_keywords:
            - "право удержания груза"
            - "до уплаты провозных платежей"
            - "удерживать груз"
            - "реализация удержанного груза"
            - "покрытие задолженности"
            - "хранение за счет грузоотправителя"
          context_patterns:
            - '(?i)перевозчик.*вправе.*удерживать.*груз.*до.*полной.*оплаты.*причитающихся.*платежей'
            - '(?i)в.*случае.*неоплаты.*груз.*подлежит.*реализации.*в.*порядке.*установленном.*законом'
      
      - clause_id: "demurrage_clause_detailed"
        name: "Плата за простой (демередж) с четкими нормативами"
        risk_if_missing: |
          Превышение нормативного времени погрузки/выгрузки ведет к простоям транспорта, убыткам перевозчика.
          Без штрафных санкций грузоотправитель/грузополучатель могут затягивать процессы без последствий.
        legal_base: "УАТ ст. 35, ст. 791 ГК РФ"
        severity: "high"
        affected_party: "carrier"
        detection:
          positive_keywords:
            - "штраф за простой"
            - "плата за простой"
            - "демередж"
            - "сверхнормативный простой"
            - "нормативное время погрузки"
            - "нормативное время выгрузки"
            - "время на погрузку/выгрузку"
          context_patterns:
            - '(?i)нормативное.*время.*погрузки.*составляет.*\d+.*часов.*при.*превышении.*взимается.*плата'
            - '(?i)за.*каждый.*час.*простоя.*сверх.*нормативного.*времени.*грузоотправитель.*уплачивает'
      
      - clause_id: "liability_limitation_explicit"
        name: "Явное ограничение ответственности в соответствии с уставами"
        risk_if_missing: |
          Без ссылки на ограничения транспортных уставов суд может применить общие нормы ГК РФ 
          о полном возмещении убытков (ст. 15 ГК РФ). Это приведет к выплатам, превышающим 
          установленные транспортными актами лимиты. Критичный финансовый риск для перевозчика.
        legal_base: "ст. 796 ГК РФ, транспортные уставы"
        severity: "critical"
        affected_party: "carrier"
        detection:
          positive_keywords:
            - "ответственность ограничена"
            - "в размере объявленной стоимости"
            - "не более реальной стоимости"
            - "согласно Уставу автомобильного транспорта"
            - "в соответствии с Воздушным кодексом"
            - "лимит ответственности"
            - "специальное право МФР"
          context_patterns:
            - '(?i)ответственность.*перевозчика.*ограничена.*в.*соответствии.*с.*(УАТ|УЖТ|Воздушным.*кодексом|КТМ)'

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 4: ДОПОЛНИТЕЛЬНЫЕ PROTECTIVE CLAUSES
  # ──────────────────────────────────────────────────────────
  additional_protective_clauses:
    
    # Для специальных категорий грузов
    both_protection:
      - clause_id: "special_cargo_regulations"
        name: "Специальные условия для опасных, скоропортящихся, негабаритных грузов"
        risk_if_missing: |
          Перевозка особых категорий грузов требует соблюдения специальных правил (ДОПОГ для опасных, 
          температурный режим для скоропортящихся, специальные разрешения для негабаритных).
          Нарушение влечет административную ответственность, конфискацию груза, повышенные риски.
        legal_base: "ДОПОГ, Правила перевозок опасных грузов, санитарные правила"
        severity: "critical"
        affected_party: "both"
        detection:
          positive_keywords:
            - "опасный груз"
            - "скоропортящийся груз"
            - "негабаритный"
            - "тяжеловесный"
            - "крупногабаритный"
            - "температурный режим"
            - "особые условия перевозки"
            - "специальное разрешение"
            - "документы ДОПОГ"
            - "свидетельство о безопасности"
          context_patterns:
            - '(?i)перевозка.*опасных.*грузов.*осуществляется.*в.*соответствии.*с.*требованиями.*ДОПОГ'
            - '(?i)скоропортящийся.*груз.*перевозится.*с.*соблюдением.*температурного.*режима'
        conditional_checks:
          - trigger: "special_cargo_keywords"
            keywords: ["опасн", "скоропортящ", "температур", "негабарит", "тяжеловес", "крупногабарит"]
            rule: "special_cargo_clauses_required"
            severity: "critical"
    
    # Для международных перевозок
    both_protection:
      - clause_id: "international_transport_provisions"
        name: "Условия для международных перевозок (конвенции, таможня, юрисдикция)"
        risk_if_missing: |
          При международных перевозках автоматически применяются конвенции (КДПГ для авто, 
          Монреальская для авиа). Неясность в вопросах таможенного оформления, применимого права, 
          подсудности ведет к задержкам, штрафам, сложностям взыскания.
        legal_base: "Конвенция КДПГ, Монреальская конвенция, Таможенный кодекс ЕАЭС"
        severity: "critical"
        affected_party: "both"
        detection:
          positive_keywords:
            - "международная перевозка"
            - "Конвенция КДПГ"
            - "Монреальская конвенция"
            - "таможенное оформление"
            - "экспортные формальности"
            - "импортные формальности"
            - "применимое право"
            - "подсудность споров"
            - "инкотермс"
            - "условия поставки"
          context_patterns:
            - '(?i)к.*настоящему.*договору.*применяются.*положения.*Конвенции.*о.*договоре.*международной.*дорожной.*перевозки.*грузов'
            - '(?i)грузоотправитель.*обеспечивает.*таможенное.*оформление.*в.*стране.*отправления'
        conditional_checks:
          - trigger: "international_keywords"
            keywords: ["международная", "экспорт", "импорт", "таможня", "госграница", "зарубеж"]
            rule: "international_clauses_required"
            severity: "critical"
    
    # Для подачи транспортных средств
    shipper_protection:
      - clause_id: "vehicle_supply_timing_penalties_detailed"
        name: "Санкции за несвоевременную подачу транспортных средств"
        risk_if_missing: |
          Просрочка подачи ТС под погрузку ведет к простоям, срыву производственных процессов, 
          убыткам грузоотправителя. Без штрафных санкций перевозчик может систематически нарушать сроки.
        legal_base: "ст. 794 ГК РФ, транспортные уставы"
        severity: "high"
        affected_party: "shipper"
        detection:
          positive_keywords:
            - "штраф за несвоевременную подачу"
            - "пеня за просрочку подачи ТС"
            - "срок подачи транспортных средств"
            - "график подачи"
            - "ответственность за простой под погрузкой"
            - "возмещение убытков от простоя"
          context_patterns:
            - '(?i)при.*нарушении.*срока.*подачи.*транспортных.*средств.*перевозчик.*уплачивает.*штраф'
            - '(?i)за.*каждый.*час.*опоздания.*с.*подачей.*ТС.*взимается.*пеня'
    
    # Для освобождения от ответственности
    carrier_protection:
      - clause_id: "exclusions_from_liability_comprehensive"
        name: "Исчерпывающий перечень обстоятельств, освобождающих от ответственности"
        risk_if_missing: |
          Без четкого перечня освобождающих обстоятельств перевозчик несет риск ответственности 
          за события, за которые не должен отвечать: непреодолимая сила, свойства груза, 
          вина грузоотправителя/грузополучателя, действия таможенных или государственных органов.
        legal_base: "ст. 796, 401 ГК РФ, транспортные уставы"
        severity: "high"
        affected_party: "carrier"
        detection:
          positive_keywords:
            - "непреодолимая сила"
            - "обстоятельства, которые перевозчик не мог предотвратить"
            - "вина грузоотправителя"
            - "свойства груза"
            - "дефекты тары или упаковки"
            - "действия таможенных органов"
            - "обстоятельства, не зависящие от воли перевозчика"
            - "форс-мажор"
            - "военные действия"
            - "забастовки"
          context_patterns:
            - '(?i)перевозчик.*освобождается.*от.*ответственности.*при.*наступлении.*следующих.*обстоятельств'