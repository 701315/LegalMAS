type: contract_4.3
name: Договор транспортной экспедиции
description: |
  Соглашение, по которому экспедитор обязуется за вознаграждение и за счет клиента выполнить или организовать 
  выполнение услуг, связанных с перевозкой груза (поиск перевозчика, оформление документов, страхование, 
  таможенное оформление), а клиент обязуется оплатить вознаграждение и возместить понесенные расходы.
  Экспедитор действует как организатор логистической цепочки, принимая груз (подтверждается экспедиторской 
  распиской) и отвечая за его сохранность и действия привлеченных третьих лиц. Регулируется Гл. 41 ГК РФ 
  и ФЗ-87 «О транспортно-экспедиционной деятельности». Отличается от перевозки организационным характером, 
  а от агентирования — ответственностью за груз.
version: 2.1
parent: class_4_service_provision
sibling_contracts:
  - contract_4.2 # Перевозка (самостоятельное исполнение перевозки)
  - contract_5.1 # Агентирование (посредничество без ответственности за груз)
  - contract_4.1 # Возмездное оказание услуг (родственная категория)
metadata:
  category: contract
  subcategory: logistics_forwarding
  complexity: medium-high
  risk_level: medium-high
  legal_base: Глава 41 ГК РФ (ст. 801-806) + ФЗ-87
  hierarchy_position: "specialized_forwarding"

# ════════════════════════════════════════════════════════════
# БАЗОВАЯ ИНФОРМАЦИЯ (HYBRID OPTIMIZED)
# ════════════════════════════════════════════════════════════
rules:
  keywords:
    high:
      - "экспедици"
      - "экспедитор"
      - "экспедировани"
      - "организация перевозки"
      - "экспедиторск услуг"
      - "экспедиторск расписк"
      - "вознаграждени экспедитор"
      - "транспортно-экспедиционн деятельност"
    medium:
      - "клиент экспедитор"
      - "транспортно-экспедиционные услуги"
      - "ТЭУ"
      - "логистика"
      - "возмещение расходов"
      - "поручение экспедитору"
      - "выбор перевозчика"
      - "таможенное оформление"
    low:
      - "страхование груза"
      - "упаковка"
      - "логистический оператор"
      - "3PL"
      - "мультимодальные перевозки"
      - "складская расписка"
      - "экспедиторское свидетельство"
  phrases:
    high:
      - Экспедитор обязуется организовать перевозку груза
      - Экспедитор действует от своего имени, но за счет Клиента
      - Экспедитор выдает экспедиторскую расписку
      - Экспедитор заключает договоры перевозки с третьими лицами
      - Клиент обязан оплатить вознаграждение экспедитора и возместить понесенные расходы
      - Экспедитор отвечает за действия привлеченных им третьих лиц как за свои собственные
    medium:
      - Экспедитор вправе привлечь к исполнению других лиц, но отвечает за них как за себя
      - Клиент обязан предоставить все необходимые документы и информацию о грузе
      - Экспедитор освобождается от ответственности, если докажет, что нарушение вызвано действиями Клиента
      - Претензии предъявляются в порядке, установленном договором и законодательством
  patterns:
    required:
      - (?i)(экспедици|экспедитор.*обязуется.*организовать|транспортно.*экспедиционн.*деятельность)
    optional:
      - (?i)(экспедиторская.*расписка|поручение.*экспедитору|организаци.*перевозк|возмещение.*расходов)
  exclusions:
    - договор перевозки (исполнитель везет сам своим транспортом и выдает ТН, а не расписку) → contract_4.2
    - договор агентирования (только поиск контрагентов без ответственности за груз) → contract_5.1
    - договор поручения/комиссии (только юридические действия без логистики)
  exclusion_logic:
    - condition: "actual_transportation_performed AND own_vehicles_used AND tn_issued"
      target: "subclass:contract_4.2"
      confidence: 0.95
      description: "Если сторона осуществляет перевозку собственными силами и выдает транспортную накладную - это перевозка"
    - condition: "only_finding_counterparties AND no_cargo_liability AND no_forwarding_receipt"
      target: "reclassify:contract_5.1"
      confidence: 0.90
      description: "Если оказываются только услуги по поиску контрагентов без ответственности за груз и выдачи расписки - это агентирование"
  weights:
    keyword_high: 3.5
    keyword_medium: 1.5
    keyword_low: 0.5
    phrase_high: 4.0
    phrase_medium: 1.0
    pattern_required: 5.0
    pattern_optional: 1.0
  classification:
    min_confidence: 0.85
    max_matches: 2

party_roles:
  - Экспедитор (Freight Forwarder) — лицо, осуществляющее транспортно-экспедиционную деятельность, принимающее груз и отвечающее за его сохранность
  - Клиент (Client) — заказчик услуг, грузоотправитель или грузополучатель, чей груз перевозится

essential_terms:
  - Предмет договора (перечень экспедиторских услуг по организации перевозки - ст. 801 ГК РФ)
  - Указание груза и маршрута (в Поручении экспедитору или как приложение)
  - Вознаграждение экспедитора и порядок возмещения расходов

specific_risks:
  - Утрата, повреждение груза привлеченным перевозчиком, за которого отвечает экспедитор (ст. 803 ГК РФ)
  - Непредоставление клиентом необходимых документов, ведущее к задержкам отправки и штрафам (ст. 804 ГК РФ)
  - Односторонний отказ клиента с выплатой штрафа в размере 10% стоимости услуг (ст. 806 ГК РФ, ст. 6 ФЗ-87)
  - Выбор экспедитором ненадежного или аффилированного перевозчика с завышенными тарифами
  - Неправильное таможенное оформление при международных перевозках с риском штрафов и конфискации
  - Превышение экспедитором сметы расходов без согласования с клиентом

aliases:
  - Договор ТЭО (Транспортно-экспедиционного обслуживания)
  - Договор на организацию перевозок
  - Логистический контракт
  - Договор экспедиторского обслуживания
  - Договор с логистическим оператором
  - 3PL договор

section_markers:
  - Предмет договора (перечень экспедиторских услуг)
  - Поручение экспедитору (форма, порядок направления)
  - Права и обязанности сторон
  - Порядок оказания услуг и взаимодействия
  - Вознаграждение экспедитора и возмещение расходов
  - Отчет экспедитора
  - Ответственность сторон (пределы, исключения)
  - Порядок предъявления претензий и исков
  - Обстоятельства непреодолимой силы
  - Срок действия договора
  - Заключительные положения

notes: |
  ОСОБЕННОСТИ И ПРАВИЛА ПРИМЕНЕНИЯ:
  1. Экспедитор вправе привлечь к исполнению других лиц, но отвечает за них как за себя (ст. 805 ГК РФ)
  2. Обязательные документы: Поручение экспедитору, Экспедиторская расписка (ст. 2 ФЗ-87, Приказ Минтранса № 23)
  3. Экспедитор освобождается от ответственности, если докажет, что нарушение вызвано недостатками груза или действиями клиента (ст. 803 ГК РФ)
  4. Клиент вправе отказаться от договора при условии возмещения фактически понесенных расходов и уплаты 10% штрафа (ст. 806 ГК РФ, ст. 6 ФЗ-87)
  5. Срок исковой давности по требованиям, связанным с транспортной экспедицией, составляет 1 год (ст. 197 ГК РФ)
  6. Экспедитор имеет право удержания груза до полной оплаты причитающихся платежей (ст. 3 ФЗ-87)

# ════════════════════════════════════════════════════════════
# 🆕 ВАЛИДАЦИОННЫЕ СЕКЦИИ (VALIDATION ENGINE v2.0) - HYBRID
# ════════════════════════════════════════════════════════════

validation_metadata:
  validation_version: "2.1"
  last_updated: "2026-02-07"
  author: "Legal AI Team (Forwarding Hybrid)"

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 1: ПРИМЕНИМОЕ ЗАКОНОДАТЕЛЬСТВО (объединенное)
  # ──────────────────────────────────────────────────────────
  legal_base:
    primary:
      - "Глава 41 ГК РФ (ст. 801-806) — общие положения о транспортной экспедиции"
      - "Федеральный закон от 30.06.2003 № 87-ФЗ «О транспортно-экспедиционной деятельности»"
    secondary:
      - "Постановление Правительства РФ № 554 «Правила транспортно-экспедиционной деятельности»"
      - "Приказ Минтранса РФ от 11.02.2008 № 23 «Об утверждении порядка оформления и форм экспедиторских документов»"
      - "ст. 971-979 ГК РФ (правила о договоре поручения, применяемые субсидиарно)"
      - "ст. 990-1004 ГК РФ (правила о договоре комиссии, применяемые субсидиарно)"
    related:
      - "Глава 40 ГК РФ (перевозка) — для понимания предмета организации"
      - "Таможенный кодекс ЕАЭС — при осуществлении таможенного оформления"
      - "Конвенция КДПГ (CMR) — для международных автомобильных перевозок"
      - "Варшавская/Монреальская конвенции — для авиаперевозок"

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 2: ОБЯЗАТЕЛЬНЫЕ ЭЛЕМЕНТЫ (ESSENTIALIA NEGOTII)
  # ──────────────────────────────────────────────────────────
  essential_elements:
    - element: "services_list_specific"
      name: "Детальный перечень экспедиторских услуг"
      required: true
      legal_base: "ст. 801 ГК РФ, ст. 2 ФЗ-87"
      description: |
        Конкретный перечень услуг: организация перевозки, выбор перевозчика, оформление документов, 
        таможенное оформление, страхование, информирование о движении груза и т.д.
        Рамочный договор должен содержать ссылку на Поручение экспедитору, где конкретизируются услуги.
      validation_rules:
        - "presence_check"
        - "services_definition_check"
        - "minimum_3_services_specified"
    
    - element: "forwarder_remuneration_expenses"
      name: "Вознаграждение экспедитора и порядок возмещения расходов"
      required: true
      legal_base: "ст. 801, 804 ГК РФ, ст. 3 ФЗ-87"
      description: |
        Вознаграждение экспедитора (фиксированное или процент) и четкий порядок возмещения его расходов 
        (предварительное согласование, лимиты, отчетность с приложением документов).
      validation_rules:
        - "remuneration_specified"
        - "expenses_procedure_specified"
        - "advance_payment_mechanism_if_present"
      conditional_checks:
        - trigger: "expenses_reimbursement"
          keywords: ["возмещение расходов", "за счет клиента", "фактические расходы"]
          rule: "expenses_approval_mechanism_required"
          legal_base: "ст. 804 ГК РФ"
          severity: "high"
    
    - element: "forwarder_instructions_reference"
      name: "Ссылка на Поручение экспедитору как неотъемлемую часть"
      required: true
      legal_base: "Приказ Минтранса № 23, ст. 2 ФЗ-87"
      description: |
        Конкретные условия по каждой перевозке (груз, маршрут, сроки, особые требования) определяются 
        в Поручении экспедитору, которое является неотъемлемой частью договора.
      validation_rules:
        - "order_reference_check"
        - "order_as_integral_part"

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 3: ЗАЩИТНЫЕ УСЛОВИЯ (PROTECTIVE CLAUSES) - ГИБРИД
  # ──────────────────────────────────────────────────────────
  protective_clauses:
    
    # --- ЗАЩИТА КЛИЕНТА (Client Protection) ---
    client_protection:
      - clause_id: "full_liability_for_third_parties"
        name: "Полная ответственность экспедитора за действия привлеченных лиц"
        risk_if_missing: |
          Экспедитор может пытаться ограничить ответственность формулировками "только посредник", 
          "не отвечает за перевозчика". Это противоречит ст. 803 ГК РФ и ст. 7 ФЗ-87.
          Клиент рискует остаться без возмещения при утрате груза перевозчиком.
        legal_base: "ст. 803 ГК РФ, ст. 7 ФЗ-87"
        severity: "critical"
        affected_party: "client"
        detection:
          positive_keywords:
            - "отвечает за действия третьих лиц"
            - "как за свои собственные"
            - "полная ответственность за выбор перевозчика"
            - "ответственность за сохранность груза"
            - "независимо от вины привлеченных лиц"
          negative_keywords:
            - "не несет ответственности за перевозчика"
            - "только в пределах агентского вознаграждения"
            - "ограничение ответственности за действия третьих лиц"
          context_patterns:
            - '(?i)экспедитор.*несет.*ответственность.*за.*действия.*привлеченных.*им.*третьих.*лиц.*как.*за.*свои.*собственные'
      
      - clause_id: "cargo_insurance_obligation_detailed"
        name: "Обязанность застраховать груз от всех рисков"
        risk_if_missing: |
          Экспедитор часто страхует только свою ответственность (на небольшую сумму) или вообще ничего.
          При утрате дорогостоящего груза страховая выплата не покрывает реальную стоимость.
          Клиент несет убытки.
        legal_base: "ст. 4 ФЗ-87, Глава 48 ГК РФ"
        severity: "high"
        affected_party: "client"
        detection:
          positive_keywords:
            - "застраховать груз"
            - "в пользу клиента"
            - "от всех рисков"
            - "страховая сумма не менее стоимости груза"
            - "полис страхования груза"
            - "риски утраты, повреждения, хищения"
            - "обязательное страхование"
          context_patterns:
            - '(?i)экспедитор.*обязуется.*застраховать.*груз.*от.*всех.*рисков.*на.*время.*перевозки'
            - '(?i)страховая.*сумма.*должна.*составлять.*не.*менее.*\d+.*%.*стоимости.*груза'
      
      - clause_id: "carrier_selection_approval_mechanism"
        name: "Механизм согласования выбора перевозчика"
        risk_if_missing: |
          Экспедитор может выбрать ненадежного, финансово несостоятельного перевозчика или аффилированную компанию.
          При утрате груза такой перевозчик не возместит ущерб. Клиент теряет контроль над логистической цепочкой.
        legal_base: "ст. 10 ГК РФ (добросовестность), ст. 53.2 ГК РФ (аффилированность)"
        severity: "high"
        affected_party: "client"
        detection:
          positive_keywords:
            - "согласование перевозчика"
            - "право вето на выбор перевозчика"
            - "критерии выбора перевозчика"
            - "раскрытие аффилированности"
            - "финансовая устойчивость перевозчика"
            - "проверка лицензий перевозчика"
            - "представление информации о перевозчике"
          context_patterns:
            - '(?i)экспедитор.*обязан.*предоставить.*клиенту.*информацию.*о.*предлагаемом.*перевозчике'
            - '(?i)клиент.*вправе.*отклонить.*предложенного.*перевозчика.*в.*течение.*\d+.*дней'
    
    # --- ЗАЩИТА ЭКСПЕДИТОРА (Forwarder Protection) ---
    forwarder_protection:
      - clause_id: "client_documents_provision_suspension"
        name: "Право не приступать к исполнению при непредоставлении документов"
        risk_if_missing: |
          Клиент может задержать предоставление необходимых документов (инвойсы, сертификаты, разрешения).
          Экспедитор не может начать перевозку, но несет риск штрафов за просрочку.
          Без явного права на приостановку исполнения экспедитор будет нести ответственность.
        legal_base: "ст. 804 ГК РФ, ст. 328 ГК РФ"
        severity: "high"
        affected_party: "forwarder"
        detection:
          positive_keywords:
            - "не приступать к исполнению"
            - "до предоставления документов"
            - "приостановка исполнения обязательств"
            - "ответственность клиента за задержку"
            - "полный комплект документов"
            - "своевременное предоставление"
            - "достоверность сведений"
          context_patterns:
            - '(?i)экспедитор.*вправе.*не.*приступать.*к.*исполнению.*обязательств.*до.*предоставления.*полного.*комплекта.*документов'
      
      - clause_id: "forwarder_lien_right_procedural"
        name: "Право удержания груза с процедурой реализации"
        risk_if_missing: |
          При неоплате вознаграждения и расходов экспедитор вправе удерживать груз (ст. 3 ФЗ-87).
          Без процедуры реализации удержанного груза экспедитор вынужден хранить его неопределенно долго,
          неся расходы по хранению и рискуя ответственностью за порчу.
        legal_base: "ст. 3 ФЗ-87, ст. 359, 360 ГК РФ"
        severity: "high"
        affected_party: "forwarder"
        detection:
          positive_keywords:
            - "право удерживать груз"
            - "до уплаты вознаграждения"
            - "возмещения расходов"
            - "реализация удержанного груза"
            - "хранение за счет клиента"
            - "покрытие задолженности"
            - "уведомление о реализации"
          context_patterns:
            - '(?i)экспедитор.*вправе.*удерживать.*груз.*до.*полной.*оплаты.*причитающихся.*платежей'
            - '(?i)в.*случае.*неоплаты.*груз.*подлежит.*реализации.*через.*\d+.*дней.*после.*уведомления'
      
      - clause_id: "liability_exclusions_proof_burden"
        name: "Исключения из ответственности и бремя доказывания"
        risk_if_missing: |
          Экспедитор несет ответственность за утрату груза, если не докажет, что это вызвано обстоятельствами, 
          за которые отвечает клиент (ст. 803 ГК РФ). Без четкого перечня таких обстоятельств суд может 
          истолковать их расширительно. Критично указать бремя доказывания на клиенте в определенных случаях.
        legal_base: "ст. 803, 401 ГК РФ, ст. 4 ФЗ-87"
        severity: "high"
        affected_party: "forwarder"
        detection:
          positive_keywords:
            - "освобождается от ответственности"
            - "обстоятельства, которые экспедитор не мог предотвратить"
            - "вина клиента"
            - "недостатки груза"
            - "непредоставление документов"
            - "действия таможенных органов"
            - "непреодолимая сила"
            - "бремя доказывания"
            - "клиент обязан доказать"
          context_patterns:
            - '(?i)экспедитор.*освобождается.*от.*ответственности.*при.*наступлении.*следующих.*обстоятельств'
            - '(?i)клиент.*обязан.*доказать.*что.*утрата.*груза.*произошла.*не.*по.*его.*вине'

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 4: ДОПОЛНИТЕЛЬНЫЕ PROTECTIVE CLAUSES
  # ──────────────────────────────────────────────────────────
  additional_protective_clauses:
    
    # Для одностороннего отказа (из второй версии, детализировано)
    client_protection:
      - clause_id: "unilateral_refusal_penalty_10_percent"
        name: "Штраф 10% при одностороннем отказе клиента"
        risk_if_missing: |
          Клиент вправе отказаться от договора (ст. 806 ГК РФ), но обязан возместить убытки и уплатить 
          штраф в размере 10% от стоимости услуг (ст. 6 ФЗ-87). Без этого условия экспедитор может требовать 
          только фактически понесенные расходы, что может быть меньше.
        legal_base: "ст. 806 ГК РФ, ст. 6 п. 5 ФЗ-87"
        severity: "high"
        affected_party: "client"
        detection:
          positive_keywords:
            - "штраф в размере 10%"
            - "односторонний отказ"
            - "возмещение убытков"
            - "фактически понесенные расходы"
            - "уведомление об отказе"
            - "досрочное расторжение"
          context_patterns:
            - '(?i)при.*одностороннем.*отказе.*клиента.*от.*договора.*клиент.*уплачивает.*штраф.*в.*размере.*10%'
            - '(?i)штраф.*взимается.*в.*дополнение.*к.*возмещению.*фактически.*понесенных.*расходов'
    
    # Для таможенного оформления (из первой версии, улучшено)
    both_protection:
      - clause_id: "customs_liability_allocation"
        name: "Распределение ответственности за таможенное оформление"
        risk_if_missing: |
          Ошибки в таможенном оформлении ведут к штрафам, конфискации груза, уголовной ответственности.
          Без четкого распределения клиент несет все риски, хотя экспедитор осуществлял оформление.
          Особенно критично при предоставлении клиентом недостоверных данных.
        legal_base: "Таможенный кодекс ЕАЭС, КоАП РФ"
        severity: "critical"
        affected_party: "both"
        detection:
          positive_keywords:
            - "таможенное оформление"
            - "ответственность за таможенные нарушения"
            - "штрафы таможенных органов"
            - "таможенный брокер"
            - "правильность таможенной декларации"
            - "возмещение штрафов"
            - "сертификаты соответствия"
            - "разрешительная документация"
            - "недостоверные сведения клиента"
          context_patterns:
            - '(?i)экспедитор.*несет.*ответственность.*за.*правильность.*таможенного.*оформления.*при.*условии.*предоставления.*клиентом.*достоверных.*сведений'
            - '(?i)штрафы.*наложенные.*таможенными.*органами.*по.*вине.*клиента.*несет.*клиент'
        conditional_checks:
          - trigger: "customs_keywords"
            keywords: ["таможен", "экспорт", "импорт", "таможенная декларация", "таможенный брокер"]
            rule: "customs_liability_clause_required"
            severity: "critical"
    
    # Для отчетности экспедитора
    forwarder_protection:
      - clause_id: "report_approval_deemed_acceptance"
        name: "Механизм утверждения отчета экспедитора (молчаливое согласие)"
        risk_if_missing: |
          Экспедитор обязан представить отчет (ст. 804 ГК РФ). Клиент может затягивать утверждение, 
          чтобы отсрочить оплату. Без механизма "молчаливого согласия" отчет считается неутвержденным, 
          что блокирует получение вознаграждения.
        legal_base: "ст. 804 ГК РФ, ст. 438 ГК РФ (акцепт)"
        severity: "high"
        affected_party: "forwarder"
        detection:
          positive_keywords:
            - "отчет считается утвержденным"
            - "молчаливое согласие"
            - "отсутствие возражений в течение срока"
            - "отчет направляется в срок"
            - "возражения по отчету в течение срока"
            - "оплата после утверждения отчета"
            - "документальное подтверждение расходов"
          context_patterns:
            - '(?i)отчет.*считается.*утвержденным.*при.*непоступлении.*возражений.*в.*течение.*\d+.*дней'
    
    # Для контроля расходов
    client_protection:
      - clause_id: "expenses_approval_limitation"
        name: "Предварительное согласование расходов и лимиты"
        risk_if_missing: |
          Экспедитор может необоснованно увеличивать расходы (завышенные тарифы перевозчиков, скрытые комиссии).
          Клиент обязан возместить все фактические расходы (ст. 804 ГК РФ). Без лимитов и процедуры 
          согласования бюджет выходит из-под контроля.
        legal_base: "ст. 804 ГК РФ"
        severity: "high"
        affected_party: "client"
        detection:
          positive_keywords:
            - "предварительное согласование расходов"
            - "смета расходов"
            - "лимит расходов"
            - "превышение сметы согласовывается"
            - "обоснование расходов"
            - "отчет о расходах с приложением документов"
            - "несогласованные расходы не возмещаются"
            - "авансирование расходов"
          context_patterns:
            - '(?i)расходы.*превышающие.*\d+.*рублей.*подлежат.*предварительному.*согласованию.*с.*клиентом'
    
    # Для долгосрочных отношений
    both_protection:
      - clause_id: "long_term_cooperation_provisions"
        name: "Условия для долгосрочного экспедиторского обслуживания"
        risk_if_missing: |
          При долгосрочном обслуживании без четких условий о порядке изменения тарифов, расторжения, 
          уведомительных сроках возникают споры. Клиент может внезапно расторгнуть договор, оставив 
          экспедитора с неокупаемыми затратами (персонал, ПО, долгосрочные договоры с перевозчиками).
        legal_base: "ст. 310, 421 ГК РФ, ст. 6 ФЗ-87"
        severity: "medium"
        affected_party: "both"
        detection:
          positive_keywords:
            - "долгосрочное сотрудничество"
            - "уведомительный срок расторжения"
            - "изменение тарифов"
            - "пересмотр условий"
            - "минимальный срок действия"
            - "ежегодная индексация"
            - "льготные условия при продлении"
          context_patterns:
            - '(?i)договор.*заключается.*на.*неопределенный.*срок.*с.*правом.*расторжения.*при.*уведомлении.*за.*\d+.*дней'