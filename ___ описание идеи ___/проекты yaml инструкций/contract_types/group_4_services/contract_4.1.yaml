type: contract_4.1
name: Договор возмездного оказания услуг
description: |
  Базовая (родовая) конструкция для всех договоров, где ценность представляет сам процесс деятельности
  (консультирование, обучение, охрана, связь, IT-обслуживание, маркетинг), а не материальный результат.
  Услуга потребляется в момент оказания. Исполнитель обязан приложить разумные усилия и проявить
  профессиональную осмотрительность, но не гарантирует достижение конкретного результата (ст. 779 ГК РФ).
  Регулируется § 1 Главы 39 ГК РФ, к отдельным видам услуг применяются специальные законы.
version: 2.1
parent: class_4_service_provision
sibling_contracts:
  - contract_3.1 # Подряд (создание материального результата)
  - contract_3.8 # Перевозка (специальный вид услуг)
  - contract_4.2 # Хранение
  - contract_4.5 # Страхование
metadata:
  category: contract
  subcategory: service_provision
  complexity: medium
  risk_level: medium-high
  legal_base: Глава 39 ГК РФ (ст. 779-783)
  hierarchy_position: "general_parent_service"

# ════════════════════════════════════════════════════════════
# БАЗОВАЯ ИНФОРМАЦИЯ (OPTIMIZED HYBRID)
# ════════════════════════════════════════════════════════════
rules:
  keywords:
    high:
      - "услуги"
      - "исполнитель"
      - "заказчик"
      - "возмездное оказание услуг"
      - "совершение действий"
      - "осуществление деятельности"
      - "нематериальный результат"
      - "акт об оказании услуг"
    medium:
      - "техническое задание"
      - "отчет исполнителя"
      - "акт сдачи-приемки услуг"
      - "абонентская плата"
      - "почасовая оплата"
      - "консультационные услуги"
      - "консалтинг"
      - "обслуживание"
    low:
      - "консультация"
      - "обучение"
      - "аудит"
      - "сопровождение"
      - "сервисный договор"
      - "аутсорсинг"
      - "сопровождение сделок"
  phrases:
    high:
      - Исполнитель обязуется по заданию Заказчика оказать услуги, а Заказчик обязуется оплатить эти услуги
      - Услуги считаются оказанными с момента подписания Акта об оказании услуг
      - Исполнитель оказывает услуги лично, если иное не предусмотрено договором
      - Заказчик обязан в срок [срок] подписать Акт либо направить мотивированный отказ
      - Оплата производится на основании подписанного Акта об оказании услуг
    medium:
      - Качество услуг должно соответствовать условиям договора, а при их отсутствии - обычно предъявляемым требованиям
      - Заказчик вправе отказаться от исполнения договора при условии оплаты фактически понесенных расходов
      - Исполнитель вправе привлекать для оказания услуг третьих лиц, если иное не предусмотрено договором
  patterns:
    required:
      - (?i)(возмездное.*оказание.*услуг|исполнитель.*обязуется.*оказать.*услуги|заказчик.*обязуется.*оплатить.*услуги)
    optional:
      - (?i)(акт.*оказания.*услуг|отчет.*исполнителя|техническое.*задание|сдача.*приемка.*услуг|абонентск.*плата)
  exclusions:
    - подряд (создание материального результата) → contract_3.1
    - перевозка (специальный вид услуг) → contract_3.8
    - агентирование (действия от имени другого лица) → contract_5.1
    - трудовой договор (трудовые отношения)
    - договор поручения/комиссии (юридические действия)
  exclusion_logic:
    - condition: "material_result_specified AND work_process_specified"
      target: "subclass:contract_3.1"
      confidence: 0.85
      description: "Если договор предусматривает создание конкретного материального результата (вещи) - это подряд"
    - condition: "labor_function_specified AND subordination_present"
      target: "rejection:labor_law"
      confidence: 0.90
      description: "Если указана трудовая функция, подчинение правилам внутреннего трудового распорядка - трудовые отношения"
    - condition: "representation_powers_specified"
      target: "subclass:contract_5.1"
      confidence: 0.80
      description: "Если исполнитель действует от имени и за счет заказчика - это поручение/агентирование"
  weights:
    keyword_high: 3.0
    keyword_medium: 1.5
    keyword_low: 0.5
    phrase_high: 2.5
    phrase_medium: 1.0
    pattern_required: 4.0
    pattern_optional: 1.0
  classification:
    min_confidence: 0.70
    max_matches: 5

party_roles:
  - Исполнитель (Service Provider) — лицо, оказывающее услуги, обязано проявить профессиональную осмотрительность
  - Заказчик (Client) — лицо, получающее и оплачивающее услуги, обязан сотрудничать и предоставлять необходимую информацию

essential_terms:
  - Предмет договора (конкретный перечень действий, видов деятельности, объем услуг — ст. 779 ГК РФ)
  - Стоимость услуг и порядок расчетов (цена, аванс, поэтапная оплата — ст. 781 ГК РФ)
  - Срок оказания услуг (период или календарные сроки, существенность по судебной практике)

specific_risks:
  - Споры о надлежащем исполнении из-за размытого, неконкретного описания предмета
  - Отказ Заказчика от оплаты из-за "отсутствия результата" (нужно доказывать факт оказания)
  - Односторонний отказ Заказчика в любой момент с оплатой фактически понесенных расходов (ст. 782)
  - Переквалификация в трудовой договор (для физлиц-исполнителей) с налоговыми последствиями
  - Невозможность объективной проверки качества и полноты оказанных услуг (особенно консультационных)
  - Недобросовестность исполнителя (формальное оказание услуг без приложения должных усилий)

aliases:
  - Договор оказания услуг
  - Service Agreement
  - Договор на обслуживание
  - Консалтинговый договор
  - Сервисный договор
  - Договор аутсорсинга
  - Абонентский договор на услуги

section_markers:
  - Предмет договора (детальное описание услуг, объема, стандартов качества)
  - Сроки оказания услуг (график, этапы)
  - Права и обязанности сторон
  - Порядок оказания услуг и взаимодействия сторон
  - Стоимость услуг и порядок расчетов
  - Порядок сдачи-приемки услуг (акт об оказании услуг, порядок подписания/отказа)
  - Ответственность сторон
  - Основания и порядок одностороннего отказа от исполнения договора
  - Конфиденциальность и защита информации
  - Интеллектуальная собственность
  - Разрешение споров
  - Заключительные положения

notes: |
  ОСОБЕННОСТИ И ПРАВИЛА ПРИМЕНЕНИЯ:
  1. К договору возмездного оказания услуг субсидиарно применяются правила о подряде (ст. 783 ГК РФ)
  2. Исполнитель обязан оказывать услуги лично, если иное не предусмотрено договором (ст. 780 ГК РФ)
  3. Заказчик обязан оплатить услуги после их приемки, если иное не предусмотрено договором (ст. 781 ГК РФ)
  4. Заказчик вправе отказаться от договора при условии оплаты фактически понесенных исполнителем расходов (ст. 782 ГК РФ)
  5. Исполнитель вправе отказаться при условии полного возмещения заказчику убытков (ст. 782 ГК РФ)
  6. Для абонентских договоров действуют специальные правила ст. 429.4 ГК РФ
  7. К услугам для граждан-потребителей применяется Закон о защите прав потребителей

# ════════════════════════════════════════════════════════════
# 🆕 ВАЛИДАЦИОННЫЕ СЕКЦИИ (VALIDATION ENGINE v2.0) - HYBRID
# ════════════════════════════════════════════════════════════

validation_metadata:
  validation_version: "2.1"
  last_updated: "2026-02-07"
  author: "Legal AI Team (Hybrid Edition)"

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 1: ПРИМЕНИМОЕ ЗАКОНОДАТЕЛЬСТВО (объединенное)
  # ──────────────────────────────────────────────────────────
  legal_base:
    primary:
      - "Глава 39 ГК РФ (ст. 779-783) — общие положения о возмездном оказании услуг"
      - "ст. 782 ГК РФ — односторонний отказ от исполнения договора"
    secondary:
      - "ст. 702, 703, 721, 723, 724, 725, 726 ГК РФ (правила о подряде, применяемые субсидиарно)"
      - "ст. 429.4 ГК РФ — особенности абонентского договора"
      - "ст. 309, 310, 328, 330, 393, 395, 406 ГК РФ (общие положения об обязательствах)"
    related:
      - "Закон РФ от 07.02.1992 № 2300-1 'О защите прав потребителей' (при оказании услуг гражданам)"
      - "Глава 21 НК РФ — налог на добавленную стоимость при оказании услуг"
      - "Информационное письмо Президиума ВАС РФ № 48 от 29.09.1999"
      - "Постановление Пленума ВАС РФ № 33 от 14.03.2014 (о подряде, применимо по аналогии)"
      - "Федеральный закон от 27.07.2006 № 149-ФЗ 'Об информации' (для IT-услуг)"
      - "Федеральный закон от 27.07.2006 № 152-ФЗ 'О персональных данных'"

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 2: ОБЯЗАТЕЛЬНЫЕ ЭЛЕМЕНТЫ (ESSENTIALIA NEGOTII)
  # ──────────────────────────────────────────────────────────
  essential_elements:
    - element: "parties"
      required: true
      legal_base: "ст. 779, 780 ГК РФ"
      validation_rules:
        - "presence_check"
        - "legal_capacity_indicators"
        - "service_provider_qualification_check"
    
    - element: "subject_specific_description"
      name: "Предмет услуг (детализированный)"
      required: true
      legal_base: "ст. 779, 432 ГК РФ"
      description: |
        Конкретное описание услуг: какие действия/деятельность, в каком объеме, стандарты качества.
        Формулировки 'оказать услуги' без конкретики делают договор незаключенным (судебная практика).
      validation_rules:
        - "presence_check"
        - "definiteness_check"
        - "non_vagueness_check"
        - "activity_list_check"
      conditional_checks:
        - trigger: "consulting_services_keywords"
          keywords: ["консалтинг", "консультаци", "юридические услуги", "аудиторские услуги", "маркетинг"]
          rule: "subject_maximum_specificity_required"
          legal_base: "ст. 779 ГК РФ, судебная практика ВС РФ"
          severity: "critical"
          validation_rules:
            - "deliverables_specified"
            - "work_methodology_described"
            - "success_criteria_avoidance"
    
    - element: "price_and_payment_terms"
      name: "Стоимость услуг"
      required: true
      legal_base: "ст. 781 ГК РФ"
      description: "Цена за час, за этап, абонентская плата или фиксированная сумма. Порядок расчетов."
      validation_rules:
        - "price_specified"
        - "payment_terms_specified"
        - "advance_justification_if_present"
      conditional_checks:
        - trigger: "subscription_model"
          keywords: ["абонентск", "ежемесячн", "подписка", "регулярн"]
          rule: "subscription_terms_complete"
          legal_base: "ст. 429.4 ГК РФ"
          severity: "high"
    
    - element: "service_period_timing"
      required: true
      legal_base: "ст. 708 ГК РФ (по аналогии), ст. 190 ГК РФ"
      description: "Срок (период) оказания услуг должен быть определен (требуется по судебной практике)"
      validation_rules:
        - "timing_specified"
        - "reasonable_timing_check"

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 3: ЗАЩИТНЫЕ УСЛОВИЯ (PROTECTIVE CLAUSES) - ГИБРИД
  # ──────────────────────────────────────────────────────────
  protective_clauses:
    
    # --- ЗАЩИТА ЗАКАЗЧИКА (Customer Protection) ---
    customer_protection:
      - clause_id: "detailed_service_specification"
        name: "Детальная спецификация услуг (ТЗ) как неотъемлемая часть договора"
        risk_if_missing: |
          Без детальной спецификации невозможно доказать ненадлежащее исполнение. 
          Исполнитель может ограничиться формальными действиями. Заказчик не сможет обосновать 
          отказ от приемки или требование об уменьшении цены. Критично для консультационных, IT-услуг.
        legal_base: "ст. 432, 779 ГК РФ, Постановление Пленума ВАС РФ № 33"
        severity: "critical"
        affected_party: "customer"
        detection:
          positive_keywords:
            - "техническое задание"
            - "спецификация услуг"
            - "перечень конкретных действий"
            - "объем услуг"
            - "стандарты качества"
            - "методология оказания"
            - "ключевые показатели"
            - "регламент оказания услуг"
          context_patterns:
            - '(?i)перечень.*услуг.*определен.*в.*приложении.*№'
            - '(?i)услуги.*оказываются.*в.*соответствии.*с.*техническим.*заданием'
      
      - clause_id: "unilateral_refusal_limited_liability"
        name: "Ограничение платежей при одностороннем отказе заказчика"
        risk_if_missing: |
          Заказчик может отказаться в любой момент (ст. 782), но обязан оплатить "фактические расходы".
          Исполнители часто вписывают "штраф 100% цены" или "оплата полной стоимости". 
          Для потребителей это ничтожно. Для бизнеса — спорно (может быть плата за выход).
        legal_base: "ст. 782 ГК РФ, Постановление Пленума ВАС РФ № 16"
        severity: "high"
        affected_party: "customer"
        detection:
          positive_keywords:
            - "оплатив фактические расходы"
            - "отказ от исполнения"
            - "прямые затраты"
          negative_keywords:
            - "штраф за расторжение"
            - "неустойка в размере цены"
            - "оплата полной стоимости договора"
          context_patterns:
            - '(?i)при.*отказе.*заказчик.*оплачивает.*фактически.*понесенные.*исполнителем.*расходы'
      
      - clause_id: "reporting_duty_detailed"
        name: "Подробная отчетность исполнителя (для налогов и приемки)"
        risk_if_missing: |
          Услуга нематериальна. Чтобы доказать факт оказания (для налоговой и суда), нужен Отчет или Акт с детализацией.
          "Акт на сумму X рублей" без расшифровки — риск снятия расходов налоговой как необоснованных.
        legal_base: "НК РФ ст. 252, ст. 9 ФЗ № 402-ФЗ 'О бухучете'"
        severity: "high"
        affected_party: "customer"
        detection:
          positive_keywords:
            - "отчет об оказанных услугах"
            - "детализация услуг"
            - "акт сдачи-приемки с расшифровкой"
            - "почасовой отчет"
            - "перечень выполненных действий"
            - "документальное подтверждение"
          context_patterns:
            - '(?i)исполнитель.*представляет.*ежемесячный.*отчет.*с.*детализацией.*оказанных.*услуг'
    
    # --- ЗАЩИТА ИСПОЛНИТЕЛЯ (Service Provider Protection) ---
    service_provider_protection:
      - clause_id: "payment_for_downtime_customer_fault"
        name: "Оплата простоя/неоказания по вине заказчика"
        risk_if_missing: |
          Если услуги не оказаны по вине Заказчика (не дал доступ, не пришел на консультацию, не предоставил информацию),
          они подлежат оплате в полном объеме (ст. 781 п. 2). Без этого условия исполнитель несет убытки.
        legal_base: "ст. 781 ГК РФ, ст. 406 ГК РФ"
        severity: "high"
        affected_party: "service_provider"
        detection:
          positive_keywords:
            - "по вине заказчика подлежат оплате"
            - "в полном объеме"
            - "оплата простоя"
            - "неоказание услуг по вине заказчика"
            - "компенсация за простой"
          context_patterns:
            - '(?i)в.*случае.*непредоставления.*заказчиком.*информации.*услуги.*подлежат.*оплате.*в.*полном.*объеме'
      
      - clause_id: "subcontracting_right_explicit"
        name: "Явное право на привлечение субподрядчиков"
        risk_if_missing: |
          По умолчанию Исполнитель обязан оказывать услуги ЛИЧНО (ст. 780 ГК РФ). Если вы — агентство или фирма,
          вам нужно явное право привлекать третьих лиц. Без этого пункта привлечение субподрядчиков незаконно.
        legal_base: "ст. 780 ГК РФ"
        severity: "critical"
        affected_party: "service_provider"
        detection:
          positive_keywords:
            - "вправе привлекать третьих лиц"
            - "без согласия заказчика"
            - "своими силами или с привлечением"
            - "субподрядчики"
            - "соисполнители"
          negative_keywords:
            - "лично"
            - "без права привлечения"
            - "исполнитель не вправе привлекать"
          context_patterns:
            - '(?i)исполнитель.*вправе.*привлекать.*для.*оказания.*услуг.*третьих.*лиц'
      
      - clause_id: "retention_of_rights_until_payment"
        name: "Сохранение прав на результаты до полной оплаты"
        risk_if_missing: |
          Исполнитель передает заказчику результаты (отчеты, документы, ПО) до полной оплаты. 
          В случае неоплаты сложно истребовать обратно. Заказчик может использовать результат без оплаты.
        legal_base: "ст. 712, 359 ГК РФ (по аналогии)"
        severity: "high"
        affected_party: "service_provider"
        detection:
          positive_keywords:
            - "право удержания"
            - "передача результатов после оплаты"
            - "сохранение прав до оплаты"
            - "непредоставление документов при неоплате"
            - "исполнитель вправе не передавать результат"
          context_patterns:
            - '(?i)исполнитель.*вправе.*удерживать.*результаты.*до.*полной.*оплаты.*услуг'

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 4: ДОПОЛНИТЕЛЬНЫЕ PROTECTIVE CLAUSES (специфика)
  # ──────────────────────────────────────────────────────────
  additional_protective_clauses:
    
    # Для абонентского договора (из второй версии, улучшено)
    service_provider_protection:
      - clause_id: "take_or_pay_subscription"
        name: "Условие 'Take or Pay' для абонентского договора"
        risk_if_missing: |
          В абонентском договоре Заказчик платит за *возможность* воспользоваться услугой.
          Если он не обращался за услугой, деньги не возвращаются (ст. 429.4 ГК РФ).
          Без четкого условия заказчик потребует возврата аванса как неосновательного обогащения.
        legal_base: "ст. 429.4 ГК РФ"
        severity: "high"
        affected_party: "service_provider"
        detection:
          positive_keywords:
            - "абонентская плата"
            - "независимо от фактического объема"
            - "фиксированный платеж"
            - "оплата за доступ"
            - "подписка на услуги"
          context_patterns:
            - '(?i)абонентская.*плата.*вносится.*независимо.*от.*фактического.*использования.*услуг'
        conditional_checks:
          - trigger: "subscription_keywords"
            keywords: ["абонент", "сопровождение", "подписка", "ежемесячная плата"]
            rule: "take_or_pay_clause_required"
            severity: "high"
    
    # Для конфиденциальности (из первой версии)
    customer_protection:
      - clause_id: "confidentiality_nda_protection"
        name: "Конфиденциальность, NDA, защита коммерческой тайны"
        risk_if_missing: |
          Исполнитель получает доступ к коммерческой тайне, ноу-хау, персональным данным заказчика.
          Без NDA высок риск утечки, репутационных и финансовых потерь. 
          Административная ответственность по ст. 13.11 КоАП РФ за нарушение ФЗ-152.
        legal_base: "ФЗ № 98-ФЗ 'О коммерческой тайне', ФЗ-152 'О персональных данных'"
        severity: "high"
        affected_party: "customer"
        detection:
          positive_keywords:
            - "конфиденциальная информация"
            - "коммерческая тайна"
            - "обязательство о неразглашении"
            - "персональные данные"
            - "NDA"
            - "режим конфиденциальности"
            - "санкции за разглашение"
          context_patterns:
            - '(?i)стороны.*обязуются.*не.*разглашать.*конфиденциальную.*информацию'
    
    # Для интеллектуальной собственности (из первой версии)
    customer_protection:
      - clause_id: "ip_rights_transfer"
        name: "Переход прав на интеллектуальную собственность"
        risk_if_missing: |
          При оказании услуг (разработка, дизайн, контент) создаются объекты ИС. 
          Без условия о переходе прав заказчик не сможет использовать результат. 
          Права остаются у исполнителя. Риск претензий о нарушении авторских прав.
        legal_base: "Глава 70 ГК РФ, ст. 1295 ГК РФ"
        severity: "high"
        affected_party: "customer"
        detection:
          positive_keywords:
            - "исключительные права"
            - "переход прав"
            - "интеллектуальная собственность"
            - "результаты интеллектуальной деятельности"
            - "отчуждение прав"
            - "служебное произведение"
          context_patterns:
            - '(?i)исключительные.*права.*на.*результаты.*интеллектуальной.*деятельности.*переходят.*к.*заказчику'
    
    # Для гарантии качества (из первой версии, адаптировано)
    customer_protection:
      - clause_id: "quality_standards_warranty"
        name: "Стандарты качества и гарантии исполнения"
        risk_if_missing: |
          При отсутствии стандартов качества к услугам применяются "обычно предъявляемые требования",
          которые крайне расплывчаты. Невозможно доказать нарушение. 
          Исполнитель не обязан исправлять недостатки.
        legal_base: "ст. 721, 723, 783 ГК РФ"
        severity: "medium"
        affected_party: "customer"
        detection:
          positive_keywords:
            - "стандарты качества"
            - "требования к качеству"
            - "гарантийные обязательства"
            - "устранение недостатков"
            - "соразмерное уменьшение цены"
            - "профессиональный стандарт"
          context_patterns:
            - '(?i)услуги.*должны.*соответствовать.*требованиям.*установленным.*в.*договоре'