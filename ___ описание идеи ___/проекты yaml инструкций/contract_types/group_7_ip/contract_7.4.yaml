type: contract_7.4
name: Соглашение о неразглашении конфиденциальной информации (NDA)
description: |
  Соглашение, по которому одна или обе стороны обязуются сохранять конфиденциальность информации, полученной в ходе переговоров, сотрудничества или иного взаимодействия. Может быть односторонним (только одна сторона раскрывает информацию) или двусторонним/взаимным (обе стороны обмениваются конфиденциальной информацией). Цель - защита коммерческой тайны, ноу-хау, персональных данных и иных ценных сведений от несанкционированного разглашения. Является ключевым инструментом для защиты интересов при обсуждении потенциальных сделок (M&A, инвестиции, партнерства). Регулируется нормами о коммерческой тайне (ФЗ-98) и общими положениями ГК РФ.
version: 2.1
parent: class_7_intellectual_property
metadata:
  category: agreement
  subcategory: intellectual_property
  complexity: medium-high
  risk_level: medium-high
  legal_base: "Федеральный закон от 29.07.2004 № 98-ФЗ 'О коммерческой тайне', ст. 1465-1472 ГК РФ"

# ════════════════════════════════════════════════════════════
# БАЗОВАЯ ИНФОРМАЦИЯ (LEGACY SECTIONS - ОПТИМИЗИРОВАНО)
# ════════════════════════════════════════════════════════════
rules:
  keywords:
    high:
      - "неразглашение"
      - "конфиденциальность"
      - "конфиденциальная информация"
      - "соглашение о неразглашении"
      - "NDA"
      - "коммерческая тайна"
      - "режим конфиденциальности"
    medium:
      - "одностороннее соглашение"
      - "двустороннее соглашение"
      - "взаимное соглашение"
      - "disclosing party"
      - "receiving party"
      - "protected information"
      - "ноу-хау"
      - "секрет производства"
    low:
      - "confidential disclosure agreement"
      - "non-disclosure agreement"
      - "возврат информации"
      - "исключения из конфиденциальности"
      - "персональные данные"
      - "служебная тайна"
  phrases:
    high:
      - Стороны обязуются не разглашать конфиденциальную информацию третьим лицам
      - Конфиденциальная информация включает, но не ограничивается: [перечень]
      - Не считается конфиденциальной информация, которая стала общедоступной
      - Срок действия обязательств о неразглашении составляет [срок]
      - Раскрывающая сторона предоставляет информацию в целях [цель]
    medium:
      - Получающая сторона обязана принимать разумные меры для защиты информации
      - Информация должна быть помечена как "Конфиденциально" или аналогично
      - Ограничения на использование информации только в оговоренных целях
      - Обязанность вернуть или уничтожить информацию по требованию
      - Раскрытие информации по требованию государственных органов
  patterns:
    required:
      - (?i)(соглашение\s+о\s+неразглашении|NDA|конфиденциальн\w+\s+информация|режим\s+конфиденциальности)
    optional:
      - (?i)(односторонн\w+|двусторонн\w+|взаимн\w+).*соглашение
      - (?i)(коммерческая\s+тайна|ноу-хау|секрет\s+производства)
      - (?i)(не\s+разглашать|сохранять\s+конфиденциальность)
  exclusions:
    - трудовой договор (может содержать положение о конфиденциальности)
    - договор коммерческой концессии (включает защиту ноу-хау как часть комплекса)
    - лицензионный договор (может включать конфиденциальность)
  exclusion_logic:
    - condition: "employment_contract AND confidentiality_clause_only"
      target: "rejection"
      confidence: 0.75
      description: "Если соглашение о конфиденциальности является частью трудового договора - это не самостоятельное NDA"
    - condition: "franchise_agreement AND knowhow_protection_included"
      target: "rejection"
      confidence: 0.80
      description: "Если защита конфиденциальной информации является частью договора коммерческой концессии - это не самостоятельное NDA"
  weights:
    keyword_high: 3.0
    keyword_medium: 1.5
    keyword_low: 0.5
    phrase_high: 2.5
    phrase_medium: 1.0
    pattern_required: 4.0
    pattern_optional: 1.0
  classification:
    min_confidence: 0.75
    max_matches: 3

party_roles:
  - Раскрывающая сторона (Disclosing Party) - сторона, которая раскрывает конфиденциальную информацию
  - Получающая сторона (Receiving Party) - сторона, которая получает конфиденциальную информацию и обязуется ее защищать

essential_terms:
  - Определение конфиденциальной информации (предмет соглашения)
  - Цели раскрытия информации (ограничение использования)
  - Срок действия обязательств о неразглашении
  - Обязанности получающей стороны по защите информации

specific_risks:
  - Нечеткое определение конфиденциальной информации, что приводит к спорам о том, что является защищаемым
  - Отсутствие или слишком широкие исключения из конфиденциальности (особенно для информации, ставшей общедоступной)
  - Слишком короткий срок действия (менее 3-5 лет для коммерчески значимой информации)
  - Неясный механизм ответственности за нарушение (сложность доказывания ущерба)
  - Риск "ловушки" для получающей стороны (обязательства в отношении информации, которую она уже знала или разработала самостоятельно)
  - Отсутствие порядка раскрытия информации по требованию государственных органов

aliases:
  - NDA (Non-Disclosure Agreement)
  - Соглашение о конфиденциальности
  - Договор о неразглашении
  - Confidential Disclosure Agreement (CDA)
  - Соглашение о защите коммерческой тайны

section_markers:
  - Преамбула (стороны, цели соглашения)
  - Определения (конфиденциальная информация, раскрывающая/получающая сторона)
  - Предмет соглашения (цели раскрытия информации)
  - Обязанности получающей стороны
  - Исключения из конфиденциальности
  - Срок действия обязательств
  - Возврат или уничтожение информации
  - Ответственность за нарушение
  - Порядок раскрытия информации по требованию государственных органов
  - Разрешение споров
  - Заключительные положения

notes: |
  КРИТИЧЕСКИ ВАЖНЫЕ АСПЕКТЫ:
  1. Для защиты информации в режиме коммерческой тайны необходимо выполнение требований ФЗ-98: определение перечня информации, ограничение доступа, учет лиц с доступом, маркировка носителей.
  2. Взаимное (двустороннее) NDA уравнивает стороны в обязательствах и защищает интересы обеих при взаимном обмене информацией.
  3. Срок действия обязательств должен быть разумным и соответствовать ценности информации (обычно 3-5 лет, для ноу-хау - может быть бессрочным).
  4. Исключения из конфиденциальности должны быть четко определены (информация, ставшая общедоступной, известная получающей стороне ранее, независимо разработанная).
  5. Ответственность за нарушение должна включать как возмещение убытков, так и возможность взыскания договорной неустойки (штрафа) для упрощения доказывания.
  6. NDA не создает лицензию на использование информации, только обязанность неразглашения.

# ════════════════════════════════════════════════════════════
# 🆕 ВАЛИДАЦИОННЫЕ СЕКЦИИ (VALIDATION ENGINE v2.1)
# ════════════════════════════════════════════════════════════

validation_metadata:
  validation_version: "2.1"
  last_updated: "2026-02-07"
  author: "Legal AI Team"
  
  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 1: ПРИМЕНИМОЕ ЗАКОНОДАТЕЛЬСТВО
  # ──────────────────────────────────────────────────────────
  legal_base:
    primary:
      - "Федеральный закон от 29.07.2004 № 98-ФЗ 'О коммерческой тайне'"
      - "ст. 1465-1472 ГК РФ — секрет производства (ноу-хау)"
    secondary:
      - "ст. 421, 422 ГК РФ — свобода договора"
      - "ст. 307-310 ГК РФ — общие положения об обязательствах"
      - "ст. 393, 330, 333 ГК РФ — ответственность за нарушение обязательств"
    related:
      - "Федеральный закон от 27.07.2006 № 152-ФЗ 'О персональных данных' (если информация содержит ПДн)"
      - "Трудовой кодекс РФ ст. 57, 81, 243 (конфиденциальность в трудовых отношениях)"
      - "УК РФ ст. 183 (незаконное получение и разглашение коммерческой тайны)"
      - "КоАП РФ ст. 13.14 (разглашение информации с ограниченным доступом)"
      - "Постановление Пленума ВС РФ № 10 от 23.04.2019 (практика по защите коммерческой тайны)"

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 2: ОБЯЗАТЕЛЬНЫЕ ЭЛЕМЕНТЫ ДОГОВОРА
  # ──────────────────────────────────────────────────────────
  essential_elements:
    - element: "parties"
      required: true
      legal_base: "ст. 432 ГК РФ"
      description: "Стороны NDA: раскрывающая и получающая сторона (или обе в двустороннем NDA)"
      validation_rules:
        - "presence_check"
        - "legal_capacity_indicators"
        - "party_roles_defined"

    - element: "confidential_information_definition"
      required: true
      legal_base: "ФЗ-98 ст. 3, ст. 1465 ГК РФ"
      description: "Определение конфиденциальной информации — что именно защищается"
      validation_rules:
        - "presence_check"
        - "definiteness_check"
        - "scope_specified"
      conditional_checks:
        - trigger: "nda_agreement"
          keywords: ["NDA", "неразглашение", "конфиденциальность"]
          rule: "confidential_info_must_be_defined"
          legal_base: "ФЗ-98 ст. 3"
          severity: "critical"
          risk_msg: "Без четкого определения конфиденциальной информации NDA неработоспособно"
          validation_rules:
            - "definition_present"
            - "categories_or_list_specified"

    - element: "purpose_of_disclosure"
      required: true
      legal_base: "ст. 421 ГК РФ"
      description: "Цель раскрытия информации — для каких целей она передается и может использоваться"
      validation_rules:
        - "purpose_specified"
        - "permitted_use_defined"

    - element: "exceptions"
      required: true
      legal_base: "ФЗ-98 ст. 3, судебная практика"
      description: "Исключения — информация, которая не считается конфиденциальной"
      validation_rules:
        - "exceptions_listed"
      conditional_checks:
        - trigger: "standard_exceptions"
          keywords: ["общедоступная", "от третьих лиц", "независимо разработанная", "была известна"]
          rule: "standard_exceptions_present"
          legal_base: "ФЗ-98, международная практика"
          severity: "high"
          validation_rules:
            - "public_domain_exception"
            - "third_party_lawful_source"
            - "independent_development"
            - "prior_knowledge"

    - element: "term"
      required: true
      legal_base: "ст. 425 ГК РФ"
      description: "Срок действия NDA и срок действия режима конфиденциальности (могут различаться)"
      validation_rules:
        - "term_specified"
        - "confidentiality_period_specified"

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 3: ЗАЩИТНЫЕ УСЛОВИЯ (PROTECTIVE CLAUSES)
  # ──────────────────────────────────────────────────────────
  protective_clauses:
    
    # --- ЗАЩИТА РАСКРЫВАЮЩЕЙ СТОРОНЫ (Discloser Protection) ---
    seller_protection:
      - clause_id: "strict_protection_obligations"
        name: "Строгие обязательства по защите информации"
        risk_if_missing: |
          Общее обязательство «не разглашать» недостаточно. Получающая сторона должна применять конкретные меры защиты: 
          ограничение доступа, хранение, использование не ниже мер для собственной информации. Без детализации сложно 
          доказать нарушение обязательств. Особенно критично для защиты ноу-хау и коммерческой тайны.
        legal_base: "ФЗ-98 ст. 10, ст. 1467 ГК РФ"
        severity: "critical"
        affected_party: "seller"
        detection:
          positive_keywords:
            - "меры защиты"
            - "ограничение доступа"
            - "не ниже мер для собственной информации"
            - "надлежащая защита"
            - "физическая безопасность"
            - "информационная безопасность"
            - "need-to-know basis"
            - "перечень допущенных лиц"
          context_patterns:
            - '(?i)получающая\s+сторона\s+обязуется\s+обеспечить\s+защиту'
            - '(?i)применять\s+меры\s+защиты.*не\s+ниже'
      
      - clause_id: "affiliate_and_advisor_binding"
        name: "Распространение обязательств на аффилированных лиц и консультантов"
        risk_if_missing: |
          Получающая сторона может передать информацию своим консультантам (юристам, аудиторам, инвесторам), 
          аффилированным лицам без их связывания обязательствами. Без условия об обязательности NDA для таких лиц 
          информация может быть разглашена через них. Особенно важно при привлечении внешних экспертов для due diligence.
        legal_base: "ФЗ-98 ст. 11, судебная практика"
        severity: "high"
        affected_party: "seller"
        detection:
          positive_keywords:
            - "аффилированные лица"
            - "консультанты"
            - "юристы"
            - "аудиторы"
            - "инвесторы"
            - "подрядчики"
            - "обязательство о неразглашении"
            - "связывание третьих лиц"
          context_patterns:
            - '(?i)получающая\s+сторона\s+вправе\s+раскрыть.*консультантам.*при\s+условии'
            - '(?i)аффилированные\s+лица\s+обязаны\s+соблюдать.*режим\s+конфиденциальности'

    # --- ЗАЩИТА ПОЛУЧАЮЩЕЙ СТОРОНЫ (Recipient Protection) ---
    buyer_protection:
      - clause_id: "clear_exceptions"
        name: "Четкие исключения из конфиденциальности"
        risk_if_missing: |
          Без стандартных исключений получающая сторона может нести ответственность за информацию, которая была ей известна ранее, 
          получена законно от третьих лиц, стала общедоступной не по ее вине или разработана независимо. Отсутствие исключений 
          создает неоправданные риски и может ограничить законную деятельность получающей стороны.
        legal_base: "ФЗ-98 ст. 3, международная практика"
        severity: "critical"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "не является конфиденциальной"
            - "исключения"
            - "общедоступная информация"
            - "была известна до раскрытия"
            - "получена от третьих лиц"
            - "независимо разработана"
            - "раскрыта без нарушения"
          context_patterns:
            - '(?i)не\s+(является|считается)\s+конфиденциальной\s+информация.*которая'
            - '(?i)обязательство\s+о\s+неразглашении\s+не\s+распространяется\s+на'
      
      - clause_id: "government_disclosure_procedure"
        name: "Порядок раскрытия по требованию государственных органов"
        risk_if_missing: |
          Получающая сторона может быть обязана раскрыть информацию по запросу суда, налоговых органов, следствия. 
          Без четкого порядка (уведомление раскрывающей стороны, попытка ограничить объем раскрытия) получающая сторона 
          рискует нарушить NDA или подвергнуться санкциям за неисполнение требований госорганов. Риск конфликта юридических обязанностей.
        legal_base: "Процессуальное законодательство, ФЗ-98 ст. 6"
        severity: "high"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "раскрытие по требованию суда"
            - "по требованию государственных органов"
            - "обязательное раскрытие"
            - "уведомление о запросе"
            - "минимально необходимый объем"
            - "содействие в защите"
            - "судебный запрос"
          context_patterns:
            - '(?i)если\s+получающая\s+сторона\s+обязана\s+раскрыть.*по\s+требованию'
            - '(?i)уведомить\s+раскрывающую\s+сторону.*о\s+получении\s+запроса'

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 4: ДОПОЛНИТЕЛЬНЫЕ PROTECTIVE CLAUSES
  # ──────────────────────────────────────────────────────────
  additional_protective_clauses:
    
    seller_protection:
      - clause_id: "breach_liability_and_penalties"
        name: "Ответственность и штрафные санкции за нарушение"
        risk_if_missing: |
          Доказать убытки от разглашения конфиденциальной информации крайне сложно. Без штрафной неустойки (penalty clause) 
          раскрывающая сторона может остаться без компенсации даже при явном нарушении. Штраф создает дополнительный стимул 
          к соблюдению обязательств и упрощает процедуру взыскания.
        legal_base: "ст. 330, 393 ГК РФ, ст. 1472 ГК РФ"
        severity: "critical"
        affected_party: "seller"
        detection:
          positive_keywords:
            - "штраф"
            - "неустойка"
            - "штрафные санкции"
            - "компенсация убытков"
            - "ответственность за нарушение"
            - "penalty"
            - "liquidated damages"
          context_patterns:
            - '(?i)за\s+нарушение.*получающая\s+сторона\s+уплачивает\s+штраф'
            - '(?i)неустойка\s+за\s+разглашение\s+составляет'
      
      - clause_id: "breach_notification"
        name: "Обязанность уведомления о нарушении или утечке"
        risk_if_missing: |
          Получающая сторона может обнаружить утечку (взлом, кража, ошибка сотрудника), но не уведомить раскрывающую сторону. 
          Без обязательства немедленного уведомления раскрывающая сторона не сможет принять меры по минимизации ущерба 
          (отзыв информации, предупреждение контрагентов, обращение в правоохранительные органы).
        legal_base: "ФЗ-152 ст. 21 (для ПД), практика кибербезопасности"
        severity: "high"
        affected_party: "seller"
        detection:
          positive_keywords:
            - "уведомление о нарушении"
            - "уведомление об утечке"
            - "breach notification"
            - "немедленное уведомление"
            - "сообщить о несанкционированном доступе"
          context_patterns:
            - '(?i)получающая\s+сторона\s+обязана\s+немедленно\s+уведомить.*об\s+(утечке|нарушении|несанкционированном)'

    buyer_protection:
      - clause_id: "residuals_clause"
        name: "Оговорка о неосязаемых остатках (Residuals Clause)"
        risk_if_missing: |
          Сотрудники получающей стороны неизбежно запоминают часть информации. Без residuals clause получающая сторона 
          формально нарушает NDA, если ее сотрудники используют общие знания и навыки, приобретенные при работе с конфиденциальной 
          информацией. Особенно важно в IT, R&D и других знания-интенсивных отраслях.
        legal_base: "Международная практика (США, ЕС), договорная практика"
        severity: "medium"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "residuals"
            - "неосязаемые остатки"
            - "общие знания и навыки"
            - "запомненная информация"
            - "unaided memory"
            - "general knowledge"
          context_patterns:
            - '(?i)не\s+распространяется\s+на.*общие\s+знания\s+и\s+навыки'
            - '(?i)residuals.*не\s+является\s+нарушением'
      
      - clause_id: "no_warranty_of_accuracy"
        name: "Отсутствие гарантий полноты и достоверности информации"
        risk_if_missing: |
          Раскрывающая сторона может передать неполную или неточную информацию. Получающая сторона, полагаясь на нее, 
          может принять неверные решения. Без оговорки об отсутствии гарантий получающая сторона может требовать компенсации 
          за ненадлежащую информацию. Особенно важно при due diligence и оценке потенциальных инвестиций.
        legal_base: "ст. 431.2 ГК РФ"
        severity: "medium"
        affected_party: "both"
        detection:
          positive_keywords:
            - "без гарантий"
            - "as is"
            - "отказ от гарантий"
            - "не гарантирует полноту"
            - "не гарантирует достоверность"
            - "disclaimer"
          context_patterns:
            - '(?i)раскрывающая\s+сторона\s+не\s+гарантирует.*полноту\s+или\s+достоверность'
            - '(?i)информация\s+предоставляется.*as\s+is|без\s+гарантий'

    both_protection:
      - clause_id: "return_or_destruction_procedure"
        name: "Порядок возврата или уничтожения информации"
        risk_if_missing: |
          По окончании срока или при досрочном прекращении обязательств по хранению информации должны быть четкие процедуры 
          возврата или уничтожения носителей. Без этого получающая сторона может невольно нарушать соглашение, храня информацию, 
          а раскрывающая сторона не может подтвердить прекращение доступа. Споры о том, что было возвращено/уничтожено.
        legal_base: "ФЗ-98 ст. 10, судебная практика"
        severity: "high"
        affected_party: "both"
        detection:
          positive_keywords:
            - "возврат информации"
            - "уничтожение информации"
            - "срок возврата"
            - "подтверждение уничтожения"
            - "сертификат об уничтожении"
            - "право сохранять копии для архивных целей"
            - "исключения для электронных резервных копий"
          context_patterns:
            - '(?i)в\s+течение\s+\d+\s+дней\s+после\s+прекращения.*(вернуть|уничтожить).*информацию'
            - '(?i)получающая\s+сторона\s+предоставляет\s+письменное\s+подтверждение.*уничтожения'
      
      - clause_id: "governing_law_and_dispute_resolution"
        name: "Применимое право и порядок разрешения споров"
        risk_if_missing: |
          Споры о нарушении конфиденциальности часто требуют оперативного разрешения и специальных знаний. Без указания применимого права, 
          подсудности (особенно важно для иностранных сторон) и возможности обращения в суд за обеспечительными мерами процесс защиты 
          прав становится длительным и неэффективным.
        legal_base: "ст. 1210 ГК РФ, АПК РФ, ГПК РФ"
        severity: "medium"
        affected_party: "both"
        detection:
          positive_keywords:
            - "применимое право"
            - "подсудность"
            - "разрешение споров"
            - "арбитраж"
            - "третейский суд"
            - "обеспечительные меры"
            - "претензионный порядок"
          context_patterns:
            - '(?i)споры.*подлежат\s+разрешению.*в\s+(арбитражном|третейском)\s+суде'
            - '(?i)применимым\s+правом\s+является.*законодательство.*Российской\s+Федерации'