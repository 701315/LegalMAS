type: contract_7.3
name: Договор коммерческой концессии (франчайзинг)
description: |
  Комплексное соглашение, по которому правообладатель (франчайзер) предоставляет пользователю (франчайзи) за вознаграждение комплекс исключительных прав на объекты интеллектуальной собственности (товарный знак, коммерческое обозначение, ноу-хау и др.) для использования в предпринимательской деятельности с соблюдением правил и стандартов франчайзера. Представляет собой модель "клонирования бизнеса" под единым брендом. Включает не только передачу прав, но и систему ведения деятельности, обучение, поддержку. Подлежит обязательной государственной регистрации в Роспатенте. Регулируется Главой 54 ГК РФ.
version: 2.1
parent: class_7_intellectual_property
metadata:
  category: contract
  subcategory: intellectual_property
  complexity: very_high
  risk_level: high
  legal_base: Глава 54 ГК РФ (ст. 1027-1040)

# ════════════════════════════════════════════════════════════
# БАЗОВАЯ ИНФОРМАЦИЯ (LEGACY SECTIONS - ОПТИМИЗИРОВАНО)
# ════════════════════════════════════════════════════════════
rules:
  keywords:
    high:
      - "коммерческая концессия"
      - "франчайзинг"
      - "франшиза"
      - "франчайзер"
      - "франчайзи"
      - "комплекс исключительных прав"
      - "система ведения бизнеса"
      - "ноу-хау"
      - "товарный знак"
      - "коммерческое обозначение"
    medium:
      - "паушальный взнос"
      - "роялти"
      - "рекламные отчисления"
      - "стандарты качества"
      - "руководство по эксплуатации"
      - "технологические карты"
      - "обучение персонала"
      - "территориальная исключительность"
    low:
      - "субконцессия"
      - "солидарная ответственность"
      - "минимальный объем закупок"
      - "сетевые стандарты"
      - "контроль качества"
      - "Роспатент"
      - "антимонопольные ограничения"
  phrases:
    high:
      - Франчайзер предоставляет Франчайзи за вознаграждение комплекс исключительных прав
      - Франчайзи обязуется использовать комплекс прав при осуществлении предпринимательской деятельности
      - Стороны обязуются зарегистрировать договор в Роспатенте
      - Франчайзи обязуется соблюдать стандарты и методы ведения бизнеса Франчайзера
      - Франчайзер оказывает Франчайзи постоянное консультационное и техническое содействие
    medium:
      - Франчайзи выплачивает паушальный взнос при заключении договора
      - Ежемесячные платежи (роялти) в размере процента от выручки
      - Франчайзи не вправе заключать аналогичные договоры с конкурентами
      - Франчайзер имеет право осуществлять контроль за деятельностью Франчайзи
      - Ответственность Франчайзера по требованиям к качеству товаров Франчайзи
  patterns:
    required:
      - (?i)(коммерческая\s+концессия|франчайзинг|франшиза|комплекс\s+исключительных\s+прав|система\s+ведения\s+бизнеса)
    optional:
      - (?i)(паушальный\s+взнос|роялти|стандарты\s+качества|руководство\s+по\s+эксплуатации)
      - (?i)(франчайзер.*обязуется.*оказывать.*поддержку|франчайзи.*обязуется.*соблюдать.*стандарты)
  exclusions:
    - лицензионный договор (только право использования без системы бизнеса)
    - договор об отчуждении исключительного права
    - агентский договор
    - договор возмездного оказания услуг
  exclusion_logic:
    - condition: "single_right_transfer AND no_business_system"
      target: "rejection"
      confidence: 0.85
      description: "Если передается только одно исключительное право без системы ведения бизнеса - это лицензионный договор"
    - condition: "no_trademark_or_commercial_designation"
      target: "rejection"
      confidence: 0.80
      description: "Если в комплексе прав отсутствуют средства индивидуализации (товарный знак, коммерческое обозначение) - не является коммерческой концессией"
  weights:
    keyword_high: 3.0
    keyword_medium: 1.5
    keyword_low: 0.5
    phrase_high: 2.5
    phrase_medium: 1.0
    pattern_required: 4.0
    pattern_optional: 1.0
  classification:
    min_confidence: 0.75
    max_matches: 3

party_roles:
  - Правообладатель (Франчайзер) - владелец комплекса исключительных прав и бизнес-системы
  - Пользователь (Франчайзи) - лицо, получающее право использовать комплекс прав и бизнес-систему

essential_terms:
  - Состав передаваемого комплекса исключительных прав (минимум: товарный знак/коммерческое обозначение + ноу-хау/секреты производства)
  - Сфера деятельности франчайзи (конкретные виды товаров/работ/услуг)
  - Территория использования и срок действия договора
  - Размер и порядок выплаты вознаграждения (паушальный платеж и/или периодические платежи)

specific_risks:
  - Для франчайзи: высокие инвестиции с риском неокупаемости, жесткая зависимость от франчайзера, риск досрочного прекращения договора с потерей вложений
  - Для франчайзера: солидарная ответственность по требованиям к качеству товаров/услуг франчайзи (ст. 1034 ГК РФ), риск ущерба репутации бренда
  - Недействительность договора при отсутствии государственной регистрации в Роспатенте
  - Риск признания ограничительных условий недействительными по антимонопольному законодательству (ФЗ-135)
  - Налоговые риски при трансфертном ценообразовании (роялти между взаимозависимыми лицами)
  - Риск раскрытия и утраты ноу-хау при прекращении договора

aliases:
  - Франчайзинг
  - Договор франчайзинга
  - Франшиза
  - Коммерческая концессия
  - Сетевой лицензионный договор

section_markers:
  - Предмет договора (детальное описание комплекса исключительных прав и бизнес-системы)
  - Права и обязанности сторон
  - Вознаграждение (паушальный взнос, роялти, рекламные отчисления)
  - Территория и срок действия договора
  - Ограничения прав сторон (территориальная исключительность, non-compete)
  - Стандарты и методы ведения деятельности (технологические карты, руководства, требования)
  - Обучение, поддержка и консультационное содействие
  - Контроль качества и аудит деятельности франчайзи
  - Ответственность сторон (включая солидарную ответственность франчайзера)
  - Условие о субконцессии
  - Порядок изменения и расторжения договора
  - Последствия прекращения договора (пост-контрактные обязательства)
  - Конфиденциальность (защита ноу-хау)
  - Порядок разрешения споров
  - Заключительные положения (обязательная регистрация)

notes: |
  КРИТИЧЕСКИ ВАЖНЫЕ АСПЕКТЫ:
  1. Договор подлежит обязательной государственной регистрации в Роспатенте (п. 2 ст. 1028 ГК РФ). Без регистрации считается недействительным.
  2. Должен включать минимум два элемента: право на использование товарного знака/коммерческого обозначения и охраняемую коммерческую информацию (ноу-хау).
  3. Франчайзер несет субсидиарную ответственность по требованиям к франчайзи о несоответствии качества товаров (работ, услуг) (ст. 1034 ГК РФ).
  4. Ограничительные условия (территориальная исключительность, non-compete) должны соответствовать антимонопольному законодательству (ФЗ-135).
  5. При прекращении договора франчайзи обязан прекратить использование всех элементов комплекса прав и ноу-хау.
  6. Франчайзер обязан оказывать франчайзи постоянное консультационное и техническое содействие, включая обучение персонала (ст. 1031 ГК РФ).
  7. Франчайзи, как правило, обязан закупать сырье, товары у франчайзера или указанных им поставщиков, если это не ограничивает конкуренцию.

# ════════════════════════════════════════════════════════════
# 🆕 ВАЛИДАЦИОННЫЕ СЕКЦИИ (VALIDATION ENGINE v2.1)
# ════════════════════════════════════════════════════════════

validation_metadata:
  validation_version: "2.1"
  last_updated: "2026-02-07"
  author: "Legal AI Team"
  
  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 1: ПРИМЕНИМОЕ ЗАКОНОДАТЕЛЬСТВО
  # ──────────────────────────────────────────────────────────
  legal_base:
    primary:
      - "Глава 54 ГК РФ (ст. 1027–1040) — договор коммерческой концессии"
    secondary:
      - "ст. 1027 ГК РФ — определение договора коммерческой концессии"
      - "ст. 1028 ГК РФ — форма и регистрация договора"
      - "ст. 1031 ГК РФ — обязанности правообладателя"
      - "ст. 1032 ГК РФ — обязанности пользователя"
      - "ст. 1033 ГК РФ — ограничения прав сторон"
      - "ст. 1034 ГК РФ — ответственность за качество"
      - "ст. 1035 ГК РФ — преимущественное право на заключение нового договора"
    related:
      - "Федеральный закон от 26.07.2006 № 135-ФЗ 'О защите конкуренции' (антимонопольные ограничения)"
      - "Закон РФ от 07.02.1992 № 2300-1 'О защите прав потребителей' (ответственность за качество)"
      - "НК РФ ст. 264, 346.16 (расходы на франчайзинг)"
      - "НК РФ ст. 309 (налогообложение роялти иностранным франчайзерам)"
      - "НК РФ ст. 105.3 (трансфертное ценообразование для роялти)"
      - "Постановление Пленума ВС РФ № 10 от 23.04.2019 (судебная практика)"
      - "Административный регламент Роспатента (Приказ Минэкономразвития № 707)"

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 2: ОБЯЗАТЕЛЬНЫЕ ЭЛЕМЕНТЫ ДОГОВОРА
  # ──────────────────────────────────────────────────────────
  essential_elements:
    - element: "parties"
      required: true
      legal_base: "ст. 1027, 432 ГК РФ"
      description: "Франчайзер (правообладатель) и Франчайзи (пользователь). Обе стороны должны быть коммерческими организациями или ИП."
      validation_rules:
        - "presence_check"
        - "commercial_entity_status"
        - "legal_capacity_indicators"
      conditional_checks:
        - trigger: "party_status"
          keywords: ["ООО", "АО", "ПАО", "ИП", "индивидуальный предприниматель"]
          rule: "both_parties_commercial"
          legal_base: "ст. 1027 ГК РФ"
          severity: "critical"
          risk_msg: "Стороны договора коммерческой концессии должны быть коммерческими организациями или ИП"

    - element: "rights_complex"
      required: true
      legal_base: "ст. 1027 ГК РФ"
      description: "Комплекс исключительных прав — обязательно включает товарный знак или коммерческое обозначение"
      validation_rules:
        - "presence_check"
        - "trademark_or_designation_present"
        - "knowhow_recommended"
      conditional_checks:
        - trigger: "franchise_contract"
          keywords: ["коммерческая концессия", "франчайзинг", "франшиза"]
          rule: "trademark_mandatory_in_complex"
          legal_base: "ст. 1027 ГК РФ"
          severity: "critical"
          risk_msg: "Комплекс исключительных прав должен включать товарный знак или коммерческое обозначение"
          validation_rules:
            - "trademark_or_commercial_designation_present"

    - element: "business_activity_sphere"
      required: true
      legal_base: "ст. 1027 ГК РФ"
      description: "Сфера предпринимательской деятельности, в которой используется комплекс прав"
      validation_rules:
        - "presence_check"
        - "activity_type_specified"
        - "usage_methods_specified"

    - element: "remuneration"
      required: true
      legal_base: "ст. 1030 ГК РФ"
      description: "Вознаграждение — паушальный взнос и/или роялти; форма, размер, порядок уплаты"
      validation_rules:
        - "remuneration_specified"
        - "payment_form_specified"
        - "calculation_method_if_royalty"
      conditional_checks:
        - trigger: "royalty_payment"
          keywords: ["роялти", "процент от выручки", "периодические платежи"]
          rule: "royalty_base_and_rate_required"
          legal_base: "ст. 1030 ГК РФ"
          severity: "high"
          validation_rules:
            - "royalty_base_specified"
            - "royalty_rate_specified"

    - element: "registration_obligation"
      required: true
      legal_base: "ст. 1028 ГК РФ"
      description: "Обязательная государственная регистрация в Роспатенте"
      validation_rules:
        - "registration_clause_present"
        - "responsibility_for_registration_specified"
      conditional_checks:
        - trigger: "franchise_contract"
          keywords: ["коммерческая концессия", "франчайзинг"]
          rule: "registration_mandatory"
          legal_base: "ст. 1028 ГК РФ"
          severity: "critical"
          risk_msg: "Без государственной регистрации договор считается недействительным"

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 3: ЗАЩИТНЫЕ УСЛОВИЯ (PROTECTIVE CLAUSES)
  # ──────────────────────────────────────────────────────────
  protective_clauses:
    
    # --- ЗАЩИТА ФРАНЧАЙЗИ (Franchisee Protection) ---
    buyer_protection:
      - clause_id: "pre_contractual_disclosure"
        name: "Преддоговорное раскрытие информации (Disclosure Document)"
        risk_if_missing: |
          Франчайзи принимает решение об инвестициях без полной информации о франчайзере, 
          его финансовом положении, судебных спорах, количестве действующих и закрытых точек, 
          реальных показателях бизнеса. Без раскрытия информации франчайзи может войти 
          в неработающую или убыточную систему. Особенно критично при значительных инвестициях.
        legal_base: "Принципы добросовестности (ст. 1, 10 ГК РФ), международная практика"
        severity: "critical"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "преддоговорное раскрытие"
            - "disclosure document"
            - "FDD"
            - "информация о франчайзере"
            - "история франшизы"
            - "количество точек"
            - "финансовые показатели"
            - "судебные споры франчайзера"
          context_patterns:
            - '(?i)франчайзер\s+предоставил\s+франчайзи\s+информацию\s+о'
            - '(?i)до\s+заключения\s+договора\s+франчайзи\s+ознакомлен\s+с'
      
      - clause_id: "territory_protection"
        name: "Защита территории (эксклюзивность)"
        risk_if_missing: |
          Без территориальной защиты франчайзер может открыть собственные точки или выдать 
          франшизу другим франчайзи на той же территории, создавая конкуренцию. Франчайзи 
          инвестирует в развитие территории, но может потерять клиентов из-за соседних точек той же сети.
        legal_base: "ст. 1033 ГК РФ"
        severity: "critical"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "эксклюзивная территория"
            - "защита территории"
            - "запрет открытия точек на территории"
            - "территориальная эксклюзивность"
            - "франчайзер не вправе предоставлять права другим"
            - "радиус защиты"
          context_patterns:
            - '(?i)франчайзер\s+обязуется\s+не\s+предоставлять.*права.*на\s+территории\s+франчайзи'
            - '(?i)территория\s+франчайзи\s+является\s+эксклюзивной'

    # --- ЗАЩИТА ФРАНЧАЙЗЕРА (Franchisor Protection) ---
    seller_protection:
      - clause_id: "quality_control_rights"
        name: "Право контроля качества и соблюдения стандартов"
        risk_if_missing: |
          Франчайзер несет субсидиарную ответственность за качество товаров/услуг франчайзи (ст. 1034 ГК РФ). 
          Без права контроля и инспекций франчайзер не может предотвратить нарушения, которые ударят по 
          репутации бренда и повлекут его ответственность перед потребителями.
        legal_base: "ст. 1031, 1034 ГК РФ"
        severity: "critical"
        affected_party: "seller"
        detection:
          positive_keywords:
            - "контроль качества"
            - "инспекции"
            - "проверки точек"
            - "соблюдение стандартов"
            - "право доступа"
            - "аудит"
            - "тайный покупатель"
            - "мониторинг качества"
          context_patterns:
            - '(?i)франчайзер\s+вправе\s+проводить\s+проверки\s+соблюдения\s+стандартов'
            - '(?i)франчайзи\s+обязан\s+допускать\s+представителей\s+франчайзера\s+для\s+инспекции'
      
      - clause_id: "knowhow_confidentiality"
        name: "Защита ноу-хау и конфиденциальности"
        risk_if_missing: |
          Ноу-хау (секрет производства) — ключевой актив франчайзера. После прекращения договора 
          франчайзи может использовать полученные знания для конкурирующего бизнеса. Без строгих 
          обязательств о неразглашении и неконкуренции франчайзер теряет конкурентное преимущество.
        legal_base: "ст. 1032, 1469 ГК РФ, ФЗ-98 'О коммерческой тайне'"
        severity: "critical"
        affected_party: "seller"
        detection:
          positive_keywords:
            - "ноу-хау"
            - "секрет производства"
            - "конфиденциальность"
            - "неразглашение"
            - "коммерческая тайна"
            - "запрет раскрытия"
            - "ответственность за разглашение"
            - "срок конфиденциальности"
          context_patterns:
            - '(?i)франчайзи\s+обязуется\s+не\s+разглашать\s+ноу-хау'
            - '(?i)конфиденциальность\s+сохраняется.*после\s+прекращения\s+договора'

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 4: ДОПОЛНИТЕЛЬНЫЕ PROTECTIVE CLAUSES
  # ──────────────────────────────────────────────────────────
  additional_protective_clauses:
    
    buyer_protection:
      - clause_id: "renewal_and_preferential_right"
        name: "Право на продление и преимущественное право"
        risk_if_missing: |
          По окончании срока договора франчайзи может потерять все инвестиции. Статья 1035 ГК РФ дает 
          преимущественное право на заключение нового договора, но условия могут быть изменены. 
          Без четкого механизма продления франчайзи находится в неопределенности и зависимости.
        legal_base: "ст. 1035 ГК РФ"
        severity: "high"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "продление договора"
            - "преимущественное право"
            - "возобновление договора"
            - "новый срок"
            - "условия продления"
            - "право на перезаключение"
          context_patterns:
            - '(?i)франчайзи\s+имеет\s+преимущественное\s+право\s+на\s+заключение\s+договора\s+на\s+новый\s+срок'
            - '(?i)продление\s+договора\s+осуществляется\s+на\s+условиях'
      
      - clause_id: "standards_change_limitation"
        name: "Ограничение на односторонние изменения стандартов"
        risk_if_missing: |
          Франчайзер может в одностороннем порядке изменять стандарты, требуя дорогостоящего ремонта, 
          замены оборудования, изменения меню/ассортимента. Без ограничений или компенсации франчайзи 
          несет все затраты на изменения.
        legal_base: "ст. 1031, 1032, 1036 ГК РФ"
        severity: "high"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "изменение стандартов"
            - "уведомление об изменениях"
            - "срок на внедрение"
            - "компенсация затрат на изменения"
            - "существенные изменения"
            - "право отказа при изменениях"
          context_patterns:
            - '(?i)франчайзер\s+вправе\s+изменять\s+стандарты\s+с\s+уведомлением\s+за'
            - '(?i)при\s+существенных\s+изменениях\s+стандартов\s+франчайзи\s+вправе'

    seller_protection:
      - clause_id: "rebranding_and_signage_removal"
        name: "Обязанность ребрендинга и демонтажа вывесок после прекращения"
        risk_if_missing: |
          После прекращения договора франчайзи должен прекратить использование бренда, демонтировать вывески, 
          удалить упоминания из интернета. Без четких сроков и штрафов бывший франчайзи может продолжать 
          использование, вводя потребителей в заблуждение.
        legal_base: "ст. 1037, 1040 ГК РФ"
        severity: "critical"
        affected_party: "seller"
        detection:
          positive_keywords:
            - "ребрендинг"
            - "демонтаж вывесок"
            - "прекращение использования бренда"
            - "удаление из интернета"
            - "срок на ребрендинг"
            - "штраф за продолжение использования"
          context_patterns:
            - '(?i)в\s+течение\s+\d+\s+дней\s+после\s+прекращения.*демонтировать\s+вывески'
            - '(?i)прекратить\s+использование\s+товарного\s+знака\s+и\s+фирменного\s+стиля'
      
      - clause_id: "subfranchising_control"
        name: "Контроль субконцессии (субфранчайзинга)"
        risk_if_missing: |
          Субконцессия допускается с согласия франчайзера (ст. 1029 ГК РФ). Без четких условий франчайзи 
          (мастер-франчайзи) может выдавать субфраншизы ненадлежащим лицам, что создает риски для бренда. 
          Франчайзер должен контролировать качество субфранчайзи.
        legal_base: "ст. 1029 ГК РФ"
        severity: "high"
        affected_party: "seller"
        detection:
          positive_keywords:
            - "субконцессия"
            - "субфранчайзинг"
            - "согласие на субконцессию"
            - "мастер-франчайзи"
            - "контроль субфранчайзи"
            - "запрет субконцессии"
          context_patterns:
            - '(?i)субконцессия\s+(допускается|возможна)\s+только\s+с\s+согласия\s+франчайзера'
            - '(?i)франчайзер\s+вправе\s+одобрять\s+субфранчайзи'

    both_protection:
      - clause_id: "registration_procedure_and_costs"
        name: "Порядок государственной регистрации и распределение расходов"
        risk_if_missing: |
          Договор недействителен без регистрации в Роспатенте. Без четкого распределения обязанностей 
          стороны могут затягивать процесс, и франчайзи не сможет легально использовать бренд.
        legal_base: "ст. 1028 ГК РФ"
        severity: "critical"
        affected_party: "both"
        detection:
          positive_keywords:
            - "регистрация договора"
            - "Роспатент"
            - "государственная регистрация"
            - "расходы на регистрацию"
            - "обязанность по регистрации"
            - "срок регистрации"
          context_patterns:
            - '(?i)расходы\s+на\s+регистрацию.*несет\s+(франчайзер|франчайзи|стороны\s+поровну)'
            - '(?i)регистрация\s+договора\s+осуществляется.*в\s+течение'
      
      - clause_id: "liability_for_consumers"
        name: "Распределение ответственности перед потребителями"
        risk_if_missing: |
          Франчайзер несет субсидиарную ответственность за качество товаров/услуг (ст. 1034 ГК РФ). 
          Без четкого регулирования порядка предъявления требований, уведомления, возмещения между 
          сторонами возникают споры при претензиях потребителей.
        legal_base: "ст. 1034 ГК РФ, Закон о защите прав потребителей"
        severity: "high"
        affected_party: "both"
        detection:
          positive_keywords:
            - "ответственность за качество"
            - "субсидиарная ответственность"
            - "претензии потребителей"
            - "уведомление о претензиях"
            - "возмещение между сторонами"
            - "регресс"
          context_patterns:
            - '(?i)франчайзер\s+несет\s+субсидиарную\s+ответственность'
            - '(?i)франчайзи\s+обязан\s+немедленно\s+уведомить.*о\s+претензиях\s+потребителей'