type: contract_7.2
name: Лицензионный договор
description: |
  Соглашение, по которому правообладатель (лицензиар) предоставляет или обязуется предоставить другой стороне (лицензиату) право использования результата интеллектуальной деятельности или средства индивидуализации в установленных пределах. Исключительное право не отчуждается, лицензиар остается правообладателем. Лицензия бывает исключительной (лицензиар не может выдавать лицензии другим и может быть ограничен в собственном использовании) и неисключительной (простой). Для объектов, подлежащих регистрации (патенты, товарные знаки), договор подлежит государственной регистрации в Роспатенте. Регулируется § 6 Главы 69, § 5 Главы 71 и § 5 Главы 72 ГК РФ.
version: 2.1
parent: class_7_intellectual_property
metadata:
  category: contract
  subcategory: intellectual_property
  complexity: high
  risk_level: medium-high
  legal_base: ГК РФ, ч. 4, ст. 1235

# ════════════════════════════════════════════════════════════
# БАЗОВАЯ ИНФОРМАЦИЯ (LEGACY SECTIONS - ОПТИМИЗИРОВАНО)
# ════════════════════════════════════════════════════════════
rules:
  keywords:
    high:
      - "лицензионный договор"
      - "лицензия"
      - "лицензиар"
      - "лицензиат"
      - "право использования"
      - "исключительная лицензия"
      - "неисключительная лицензия"
      - "предоставление права использования"
    medium:
      - "сублицензия"
      - "роялти"
      - "паушальный платеж"
      - "территория действия"
      - "способы использования"
      - "срок действия лицензии"
      - "отчетность"
      - "контроль качества"
    low:
      - "лицензионное вознаграждение"
      - "минимальные гарантированные платежи"
      - "право на инспекцию"
      - "прединфрингинг"
      - "отзыв лицензии"
      - "Роспатент"
  phrases:
    high:
      - Лицензиар предоставляет Лицензиату право использования [объект ИС] на условиях настоящего договора
      - Лицензия является исключительной/неисключительной (простой)
      - Лицензиат выплачивает вознаграждение в виде [фиксированного платежа / роялти]
      - Право использования предоставляется на срок [срок] и на территории [территория]
      - Лицензиар гарантирует наличие исключительного права
    medium:
      - Лицензиат обязуется предоставлять регулярные отчеты об использовании
      - Лицензиат не вправе заключать сублицензионные договоры без письменного согласия Лицензиара
      - За нарушение условий договора предусмотрена неустойка
      - Срок действия лицензии привязан к сроку действия патента
  patterns:
    required:
      - (?i)(лицензионн\w+\s+договор|лицензи\w+.*предоставл\w+.*прав\w+.*использовани\w+|лицензиар.*лицензиат)
    optional:
      - (?i)(исключительн\w+|неисключительн\w+|простая).*лицензи\w+
      - (?i)вознаграждение\s+в\s+виде\s+(роялти|паушальн\w+\s+платеж\w+)
      - (?i)срок\s+действия\s+лицензи\w+.*территори\w+
  exclusions:
    - договор об отчуждении исключительного права (полная передача)
    - договор коммерческой концессии (комплекс исключительных прав + ноу-хау)
    - договор авторского заказа
    - агентский договор
  exclusion_logic:
    - condition: "full_transfer_keywords AND no_license_type"
      target: "rejection"
      confidence: 0.85
      description: "Если присутствует указание на передачу права в полном объеме без упоминания лицензии - это отчуждение"
    - condition: "franchise_elements_present AND know_how_transfer"
      target: "rejection"
      confidence: 0.80
      description: "Если помимо права использования передаются коммерческая тайна, ноу-хау и право на фирменное наименование - это коммерческая концессия"
  weights:
    keyword_high: 3.0
    keyword_medium: 1.5
    keyword_low: 0.5
    phrase_high: 2.5
    phrase_medium: 1.0
    pattern_required: 4.0
    pattern_optional: 1.0
  classification:
    min_confidence: 0.75
    max_matches: 3

party_roles:
  - Лицензиар (правообладатель, предоставляющий право использования)
  - Лицензиат (лицо, получающее право использования)

essential_terms:
  - Предмет договора: четкое указание на объект ИС, право использования которого предоставляется (с реквизитами регистрации, если есть)
  - Способы использования: исчерпывающий перечень действий, которые лицензиат вправе совершать с объектом ИС (существенное условие)
  - Территория, на которой допускается использование (если не указана - на всей территории РФ)
  - Срок действия лицензии (если не указан - 5 лет, для товарных знаков - не более срока действия исключительного права)

specific_risks:
  - Выход лицензиата за пределы предоставленных прав (по способам, территории, сроку) - риск судебных споров и требований о возмещении убытков
  - Несоблюдение требования о государственной регистрации для регистрируемых объектов (патенты, товарные знаки) - недействительность договора
  - Для лицензиара: риск недобросовестности лицензиата (неотчетность, неуплата роялти, ухудшение репутации бренда, конкуренция с другими лицензиатами)
  - Для лицензиата: риск прекращения действия патента/товарного знака или оспаривания прав лицензиара третьими лицами
  - Налоговые риски при расчете и удержании роялти (НДС, налог на прибыль, НДФЛ для физических лиц)
  - Риск банкротства лицензиара и прекращения действия лицензии (ст. 1237 ГК РФ)

aliases:
  - Лицензионное соглашение
  - Договор о предоставлении права использования
  - Лицензия на использование
  - Патентная лицензия
  - Лицензия на товарный знак
  - Авторский лицензионный договор

section_markers:
  - Предмет договора (объект ИС, реквизиты патента/свидетельства, вид лицензии)
  - Объем предоставляемых прав (способы использования, территория, срок)
  - Лицензионное вознаграждение (размер, форма, порядок выплаты, отчетность)
  - Права и обязанности сторон
  - Гарантии лицензиара
  - Контроль качества (для товарных знаков)
  - Порядок предоставления сублицензии
  - Ответственность сторон
  - Основания и порядок досрочного расторжения
  - Последствия прекращения действия исключительного права
  - Конфиденциальность
  - Порядок разрешения споров
  - Заключительные положения (о регистрации, применимое право)

notes: |
  КРИТИЧЕСКИ ВАЖНЫЕ АСПЕКТЫ:
  1. Договор подлежит государственной регистрации в Роспатенте для объектов, требующих регистрации (патенты, товарные знаки). Без регистрации договор считается недействительным (п. 2 ст. 1235 ГК РФ).
  2. При отсутствии в договоре указания на его вид (исключительная/неисключительная) лицензия считается простой (неисключительной) (п. 3 ст. 1236 ГК РФ).
  3. Если срок действия лицензии не указан, договор считается заключенным на пять лет, кроме случая, когда срок действия исключительного права менее пяти лет (п. 4 ст. 1235 ГК РФ).
  4. Если территория, на которой допускается использование, не указана, лицензиат вправе осуществлять использование на всей территории РФ (п. 3 ст. 1235 ГК РФ).
  5. Способы использования - существенное условие; права, не указанные в договоре, считаются непредоставленными (п. 1 ст. 1235 ГК РФ).
  6. Лицензиат не вправе предоставлять сублицензии третьим лицам, если это прямо не разрешено договором (п. 1 ст. 1238 ГК РФ).
  7. Действие лицензионного договора прекращается при прекращении исключительного права, если договором не предусмотрено иное (ст. 1237 ГК РФ).
  8. При исключительной лицензии лицензиар не вправе выдавать лицензии другим лицам, но может сохранить право собственного использования, если это предусмотрено договором (ст. 1236 ГК РФ).

