validation_metadata:
  validation_version: "2.1"
  last_updated: "2026-02-07"
  author: "Legal AI Team"
  
  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 1: ПРИМЕНИМОЕ ЗАКОНОДАТЕЛЬСТВО
  # ──────────────────────────────────────────────────────────
  legal_base:
    primary:
      - "ст. 1234 ГК РФ — договор об отчуждении исключительного права (общие положения)"
    secondary:
      - "ст. 1285 ГК РФ — отчуждение исключительного права на произведение"
      - "ст. 1365 ГК РФ — отчуждение исключительного права на изобретение, полезную модель, промышленный образец"
      - "ст. 1488 ГК РФ — отчуждение исключительного права на товарный знак"
      - "ст. 1468 ГК РФ — отчуждение исключительного права на секрет производства (ноу-хау)"
      - "ст. 1226–1227 ГК РФ — интеллектуальные права, соотношение исключительного права и права собственности"
      - "ст. 1232 ГК РФ — государственная регистрация результатов интеллектуальной деятельности"
    related:
      - "НК РФ ст. 149 п. 2 пп. 26 (освобождение от НДС при отчуждении исключительных прав)"
      - "НК РФ ст. 257 (учет нематериальных активов)"
      - "ФЗ от 29.07.1998 № 135-ФЗ «Об оценочной деятельности» (оценка стоимости ИС)"
      - "Постановление Пленума ВС РФ № 10 от 23.04.2019 (судебная практика по интеллектуальным правам)"
      - "Административный регламент Роспатента (Приказ Минэкономразвития России от 30.09.2015 № 707)"

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 2: ОБЯЗАТЕЛЬНЫЕ ЭЛЕМЕНТЫ ДОГОВОРА
  # ──────────────────────────────────────────────────────────
  essential_elements:
    - element: "parties"
      required: true
      legal_base: "ст. 432, 1234 ГК РФ"
      description: "Правообладатель (отчуждатель) и приобретатель; проверка правоспособности"
      validation_rules:
        - "presence_check"
        - "legal_capacity_indicators"
        - "rightsholder_status_confirmation"

    - element: "subject_ip_object"
      required: true
      legal_base: "ст. 1234 ГК РФ"
      description: "Конкретный объект интеллектуальной собственности с идентифицирующими признаками"
      validation_rules:
        - "presence_check"
        - "definiteness_check"
        - "ip_object_identification"
      conditional_checks:
        - trigger: "registered_ip_objects"
          keywords: ["патент", "товарный знак", "полезная модель", "промышленный образец", "НМПТ"]
          rule: "registration_details_required"
          legal_base: "ст. 1232, 1353, 1480 ГК РФ"
          severity: "critical"
          validation_rules:
            - "registration_number_present"
            - "registration_date_present"
            - "validity_period_present"
        - trigger: "copyright_objects"
          keywords: ["произведение", "программа для ЭВМ", "база данных", "авторское право"]
          rule: "description_sufficient_for_identification"
          legal_base: "ст. 1259, 1261, 1285 ГК РФ"
          severity: "critical"
          validation_rules:
            - "work_description_present"
            - "author_identification"

    - element: "full_transfer_scope"
      required: true
      legal_base: "ст. 1234 п. 1 ГК РФ"
      description: "Указание на передачу исключительного права в полном объеме (отличие от лицензии)"
      validation_rules:
        - "full_scope_explicitly_stated"
        - "no_partial_transfer_indicators"

    - element: "remuneration"
      required: true
      legal_base: "ст. 1234 п. 3 ГК РФ"
      description: "Для возмездного договора — размер вознаграждения или порядок его определения (существенное условие)"
      validation_rules:
        - "remuneration_specified_or_gratuitous"
        - "calculation_method_if_variable"
      conditional_checks:
        - trigger: "commercial_parties"
          keywords: ["ООО", "АО", "ЗАО", "ПАО", "ИП", "юридическое лицо"]
          rule: "gratuitous_between_commercial_prohibited"
          legal_base: "ст. 1234 п. 3, 575 ГК РФ"
          severity: "critical"
          risk_msg: "Безвозмездное отчуждение между коммерческими организациями не допускается"
          validation_rules:
            - "remuneration_must_be_present"

    - element: "transfer_moment"
      required: true
      legal_base: "ст. 1234 п. 4 ГК РФ"
      description: "Момент перехода исключительного права (при подписании / при оплате / при регистрации)"
      validation_rules:
        - "transfer_moment_specified"
      conditional_checks:
        - trigger: "registered_objects"
          keywords: ["патент", "товарный знак", "регистрация"]
          rule: "transfer_upon_registration"
          legal_base: "ст. 1234 п. 4 ГК РФ"
          severity: "critical"
          risk_msg: "Для регистрируемых объектов переход права — с момента государственной регистрации"

    - element: "registration_obligation"
      required: true
      legal_base: "ст. 1232, 1234 ГК РФ"
      description: "Обязанность сторон обеспечить государственную регистрацию (для регистрируемых объектов)"
      validation_rules:
        - "registration_clause_present"
        - "responsibility_for_registration_specified"
        - "registration_costs_allocated"
      conditional_checks:
        - trigger: "registrable_ip"
          keywords: ["патент", "товарный знак", "полезная модель", "промышленный образец", "НМПТ", "Роспатент"]
          rule: "registration_mandatory"
          legal_base: "ст. 1232 ГК РФ"
          severity: "critical"
          validation_rules:
            - "registration_obligation_present"
            - "party_responsible_for_filing"

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 3: ЗАЩИТНЫЕ УСЛОВИЯ (PROTECTIVE CLAUSES)
  # ──────────────────────────────────────────────────────────
  protective_clauses:
    
    # --- ЗАЩИТА ПРИОБРЕТАТЕЛЯ (Acquirer Protection) ---
    buyer_protection:
      - clause_id: "rightsholder_warranties"
        name: "Гарантии и заверения правообладателя"
        risk_if_missing: |
          Без явных гарантий приобретатель рискует получить право, которое: не принадлежит отчуждателю (отчуждение «чужих» прав), обременено лицензиями или залогом, является предметом судебного спора, может быть признано недействительным. Отсутствие заверений лишает приобретателя механизма взыскания убытков при обнаружении дефектов права.
        legal_base: "ст. 431.2, 1234 ГК РФ"
        severity: "critical"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "гарантирует"
            - "заверяет"
            - "подтверждает принадлежность права"
            - "является единственным правообладателем"
            - "отсутствие обременений"
            - "право не оспаривается"
            - "отсутствие лицензий"
            - "свободно от прав третьих лиц"
            - "не заложено"
            - "не арестовано"
          context_patterns:
            - '(?i)правообладатель\s+гарантирует.*что\s+исключительн\w+\s+прав\w+\s+принадлежит\s+ему'
            - '(?i)правообладатель\s+заверяет.*отсутстви\w+\s+обременени\w+'
      
      - clause_id: "third_party_claims_indemnity"
        name: "Ответственность за претензии третьих лиц"
        risk_if_missing: |
          После приобретения права третьи лица (истинные авторы, соавторы, работодатели, предыдущие правообладатели, лицензиаты) могут предъявить претензии. Без условия об освобождении приобретателя от таких требований и компенсации убытков приобретатель несет все риски самостоятельно.
        legal_base: "ст. 393, 431.2, 1234 ГК РФ"
        severity: "critical"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "претензии третьих лиц"
            - "освобождение от ответственности"
            - "возмещение убытков"
            - "индемнити"
            - "защита от требований"
            - "оспаривание права"
            - "урегулирование претензий"
          context_patterns:
            - '(?i)правообладатель\s+обязуется\s+(освободить|защитить)\s+приобретател\w+\s+от\s+претензий\s+третьих\s+лиц'
            - '(?i)в\s+случае\s+предъявления\s+требований\s+третьими\s+лицами.*правообладатель\s+(возмещает|компенсирует)'

    # --- ЗАЩИТА ПРАВООБЛАДАТЕЛЯ (Seller Protection) ---
    seller_protection:
      - clause_id: "payment_security"
        name: "Обеспечение оплаты / гарантия получения вознаграждения"
        risk_if_missing: |
          После передачи права (особенно при регистрации перехода до оплаты) отчуждатель рискует не получить вознаграждение. Без механизма обеспечения (аккредитив, эскроу, задаток) отчуждатель утрачивает право и может столкнуться с неплатежеспособностью приобретателя.
        legal_base: "ст. 1234, 329 ГК РФ"
        severity: "critical"
        affected_party: "seller"
        detection:
          positive_keywords:
            - "обеспечение оплаты"
            - "аккредитив"
            - "эскроу"
            - "задаток"
            - "предоплата"
            - "банковская гарантия"
            - "залог"
            - "неустойка за просрочку оплаты"
          context_patterns:
            - '(?i)оплата.*обеспечивается.*аккредитив\w+|эскроу|банковск\w+\s+гарант'
            - '(?i)приобретатель\s+(перечисляет|вносит)\s+предоплат\w+\s+в\s+размере'
      
      - clause_id: "retention_until_payment"
        name: "Сохранение права до полной оплаты"
        risk_if_missing: |
          Без условия о том, что переход права происходит после полной оплаты, отчуждатель утрачивает право при подписании договора или регистрации, не получив вознаграждения. Для регистрируемых объектов можно предусмотреть подачу заявления на регистрацию после оплаты.
        legal_base: "ст. 1234 п. 4 ГК РФ"
        severity: "high"
        affected_party: "seller"
        detection:
          positive_keywords:
            - "право переходит после оплаты"
            - "условие о полной оплате"
            - "регистрация после оплаты"
            - "сохранение права до оплаты"
            - "отлагательное условие"
          context_patterns:
            - '(?i)исключительн\w+\s+прав\w+\s+переходит.*после\s+(полной\s+)?оплаты'
            - '(?i)регистрация\s+перехода\s+права.*осуществляется\s+после\s+получения.*вознаграждения'

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 4: ДОПОЛНИТЕЛЬНЫЕ PROTECTIVE CLAUSES
  # ──────────────────────────────────────────────────────────
  additional_protective_clauses:
    
    buyer_protection:
      - clause_id: "license_disclosure"
        name: "Раскрытие информации о действующих лицензиях"
        risk_if_missing: |
          Если на отчуждаемое право выданы лицензии, они сохраняют силу при переходе права (ст. 1235 п. 7 ГК РФ). Приобретатель должен знать об их существовании, условиях, сроках. Без раскрытия приобретатель может обнаружить неожиданных лицензиатов, имеющих право использования объекта.
        legal_base: "ст. 1235 п. 7, 1234 ГК РФ"
        severity: "critical"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "действующие лицензии"
            - "лицензионные договоры"
            - "перечень лицензий"
            - "лицензиаты"
            - "обременения лицензиями"
            - "условия лицензий"
            - "отсутствие лицензий"
          context_patterns:
            - '(?i)правообладатель\s+(раскрывает|уведомляет).*о\s+действующих\s+лицензи\w+'
            - '(?i)на\s+момент\s+заключения\s+договора\s+(отсутствуют|имеются)\s+лицензи\w+'
      
      - clause_id: "service_invention_clearance"
        name: "Урегулирование прав на служебные РИД"
        risk_if_missing: |
          Если объект создан работником (служебное произведение, служебное изобретение), права работодателя и автора должны быть надлежаще урегулированы. Автор сохраняет право на вознаграждение (ст. 1295, 1370 ГК РФ). Без подтверждения урегулирования автор может предъявить требования к приобретателю.
        legal_base: "ст. 1295, 1370 ГК РФ"
        severity: "high"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "служебное произведение"
            - "служебное изобретение"
            - "права работодателя"
            - "вознаграждение автору"
            - "трудовые отношения с автором"
            - "согласие автора"
            - "урегулирование с автором"
          context_patterns:
            - '(?i)права\s+на\s+служебн\w+\s+(произведени|изобретени|РИД).*урегулированы'
            - '(?i)автор.*получил.*вознаграждение|права\s+автора.*учтены'
        conditional_checks:
          - trigger: "service_work_indicators"
            keywords: ["служебное", "создано работником", "в рамках трудовых обязанностей"]
            rule: "author_rights_settlement_required"
            severity: "high"

    seller_protection:
      - clause_id: "reservation_of_use_right"
        name: "Сохранение права использования за отчуждателем (обратная лицензия)"
        risk_if_missing: |
          После отчуждения правообладатель утрачивает право использования. Если продолжение использования необходимо (например, для собственного производства), это должно быть явно согласовано. Без такого условия бывший правообладатель становится нарушителем при любом использовании.
        legal_base: "ст. 1234, 1235 ГК РФ"
        severity: "medium"
        affected_party: "seller"
        detection:
          positive_keywords:
            - "обратная лицензия"
            - "право использования сохраняется"
            - "лицензия отчуждателю"
            - "продолжение использования"
            - "неисключительное право отчуждателя"
          context_patterns:
            - '(?i)за\s+правообладател\w+\s+сохраняется\s+право\s+использования'
            - '(?i)приобретатель\s+предоставляет.*лицензию.*бывшему\s+правообладател'

    both_protection:
      - clause_id: "registration_procedure_and_costs"
        name: "Порядок регистрации и распределение расходов"
        risk_if_missing: |
          Для регистрируемых объектов переход права происходит с момента регистрации. Без четкого распределения обязанностей по подготовке документов, подаче заявления и оплате пошлин стороны могут затягивать процесс, и право не перейдет. Споры о расходах на регистрацию — частая проблема.
        legal_base: "ст. 1232, 1234 ГК РФ"
        severity: "high"
        affected_party: "both"
        detection:
          positive_keywords:
            - "регистрация перехода права"
            - "расходы на регистрацию"
            - "государственная пошлина"
            - "подготовка документов"
            - "подача заявления в Роспатент"
            - "распределение расходов"
            - "сторона, ответственная за регистрацию"
          context_patterns:
            - '(?i)расходы\s+на\s+государственную\s+регистраци\w+\s+несет'
            - '(?i)заявление\s+о\s+регистрации.*подается.*стороной'