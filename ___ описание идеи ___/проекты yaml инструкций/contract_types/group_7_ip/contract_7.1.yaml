type: contract_7.1
name: Договор об отчуждении исключительного права
description: |
  Соглашение, по которому правообладатель передает или обязуется передать принадлежащее ему исключительное право на результат интеллектуальной деятельности или средство индивидуализации в полном объеме приобретателю. По сути является «продажей права». Влечет безвозвратную утрату права первоначальным обладателем. Для объектов, требующих государственной регистрации (патенты, товарные знаки), переход права подлежит обязательной регистрации в Роспатенте. Регулируется § 1 Главы 70 и § 1 Главы 72 ГК РФ.
version: 2.1
parent: class_7_intellectual_property
metadata:
  category: contract
  subcategory: intellectual_property
  complexity: high
  risk_level: high
  legal_base: ГК РФ, ч. 4, ст. 1234

# ════════════════════════════════════════════════════════════
# БАЗОВАЯ ИНФОРМАЦИЯ (LEGACY SECTIONS - ОПТИМИЗИРОВАНО)
# ════════════════════════════════════════════════════════════
rules:
  keywords:
    high:
      - "отчуждение исключительного права"
      - "передача исключительного права"
      - "уступка исключительного права"
      - "правообладатель"
      - "приобретатель"
      - "исключительное право в полном объеме"
      - "переход исключительного права"
    medium:
      - "патент"
      - "товарный знак"
      - "изобретение"
      - "полезная модель"
      - "промышленный образец"
      - "программа для ЭВМ"
      - "ноу-хау"
      - "база данных"
      - "авторское право"
    low:
      - "государственная регистрация перехода права"
      - "Роспатент"
      - "паушальный платеж"
      - "вознаграждение за отчуждение"
      - "свидетельство"
      - "патентное ведомство"
  phrases:
    high:
      - Правообладатель передает, а Приобретатель принимает исключительное право в полном объеме
      - Правообладатель отчуждает принадлежащее ему исключительное право
      - исключительное право переходит к Приобретателю в полном объеме
      - Приобретатель становится единственным правообладателем
      - Правообладатель утрачивает право использования объекта
    medium:
      - вознаграждение за передачу исключительного права
      - момент перехода исключительного права
      - государственная регистрация перехода права
      - правообладатель гарантирует отсутствие обременений
      - переход права подлежит регистрации в Роспатенте
      - единовременный платеж
  patterns:
    required:
      - (?i)(отчуждени\w+\s+исключительн\w+\s+прав|передач\w+\s+исключительн\w+\s+прав|уступк\w+\s+исключительн\w+\s+прав)
    optional:
      - (?i)(правообладател\w+|приобретател\w+|патент\w*|товарн\w+\s+знак|авторск\w+\s+прав)
      - (?i)(в\s+полном\s+объем\w+|переход\s+прав\w+|регистраци\w+\s+в\s+роспатент)
  exclusions:
    - лицензионный договор (частичная передача прав на использование)
    - договор коммерческой концессии (франчайзинг)
    - договор залога исключительного права
    - предоставление права использования
  exclusion_logic:
    - condition: "license_grant_only AND no_full_transfer"
      target: "rejection"
      confidence: 0.90
      description: "Если передается только право использования без отчуждения — это лицензионный договор"
    - condition: "partial_rights_transfer AND not_full_ownership"
      target: "rejection"
      confidence: 0.85
      description: "Частичная передача прав — лицензия, а не отчуждение"
  weights:
    keyword_high: 3.0
    keyword_medium: 1.5
    keyword_low: 0.5
    phrase_high: 2.5
    phrase_medium: 1.0
    pattern_required: 4.0
    pattern_optional: 1.0
  classification:
    min_confidence: 0.75
    max_matches: 3

party_roles:
  - Правообладатель (Отчуждатель) — лицо, передающее исключительное право
  - Приобретатель — лицо, получающее исключительное право в полном объеме

essential_terms:
  - Предмет — конкретный объект интеллектуальной собственности (с реквизитами патента/свидетельства, описанием)
  - Объем передаваемого права (в полном объеме — обязательно для отчуждения)
  - Вознаграждение — размер или порядок определения (для возмездного договора — существенное условие)
  - Момент перехода исключительного права (при подписании / при регистрации / при оплате)

specific_risks:
  - Недействительность договора — отсутствие исключительного права у отчуждателя (продажа "чужих" прав)
  - Недействительность — несоблюдение требования о государственной регистрации (для регистрируемых объектов)
  - Для приобретателя: скрытые лицензии, обременения, претензии третьих лиц (истинных авторов/правообладателей)
  - Для приобретателя: оспаривание патента, товарного знака после приобретения
  - Для отчуждателя: неполучение вознаграждения, особенно при поэтапной оплате
  - Для отчуждателя: потеря права использования без надлежащей компенсации
  - Налоговые риски: сложность оценки стоимости нематериальных активов
  - Неопределенность территории и срока (для патентов — срок действия патента)
  - Споры о соавторстве, правах работодателя на служебные РИД

aliases:
  - Отчуждение исключительного права
  - Продажа прав
  - Уступка исключительного права
  - Договор передачи патента
  - Договор передачи товарного знака
  - Договор уступки авторских прав
  - Договор об отчуждении прав на программу для ЭВМ

section_markers:
  - Предмет договора (детальное описание объекта ИС, реквизиты патента/свидетельства, регистрационные данные)
  - Гарантии и заверения правообладателя (подтверждение прав, отсутствие обременений, лицензий, споров)
  - Вознаграждение (размер, форма, сроки, порядок выплаты — единовременно/поэтапно)
  - Переход исключительного права (момент перехода, условия, порядок)
  - Государственная регистрация (обязанности сторон, распределение расходов)
  - Права и обязанности сторон
  - Ответственность сторон (за нарушение гарантий, просрочку платежа, недействительность права)
  - Конфиденциальность
  - Порядок разрешения споров
  - Заключительные положения (применимое право, регистрация)

notes: |
  КРИТИЧЕСКИ ВАЖНЫЕ АСПЕКТЫ:
  1. Договор подлежит государственной регистрации в Роспатенте для регистрируемых объектов (патенты, товарные знаки) — без регистрации переход права не состоится (ст. 1232, 1234 ГК РФ).
  2. Для объектов авторского права (произведения, программы для ЭВМ) регистрация договора не обязательна, но возможна добровольная регистрация.
  3. Исключительное право переходит в полном объеме — отчуждатель утрачивает все права (ст. 1234 ГК РФ).
  4. При отсутствии в возмездном договоре условия о вознаграждении договор считается незаключенным (п. 3 ст. 1234 ГК РФ).
  5. Безвозмездное отчуждение между коммерческими организациями не допускается (п. 3 ст. 1234, ст. 575 ГК РФ).
  6. Автор сохраняет неотчуждаемые личные неимущественные права (право авторства, право на имя) — ст. 1265 ГК РФ.
  7. Право на вознаграждение за служебный РИД принадлежит автору-работнику и не отчуждается (ст. 1295, 1370 ГК РФ).
  8. Рекомендуется проведение due diligence перед приобретением: проверка действительности права, обременений, споров.

