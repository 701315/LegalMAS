type: contract_6.3
name: Агентский договор
description: |
  Универсальный возмездный посреднический договор, объединяющий черты поручения и комиссии.
  Агент обязуется за вознаграждение совершать по поручению принципала юридические и иные (фактические) действия
  либо от своего имени, но за счет принципала (модель комиссии), либо от имени и за счет принципала (модель поручения).
  Стороны выбирают модель. Договор носит рамочный, длящийся характер. Широко применяется в дистрибуции, маркетинге, продвижении.
  Регулируется Главой 52 ГК РФ с субсидиарным применением норм о поручении или комиссии.
version: 2.0
parent: class_6_intermediary
metadata:
  category: contract
  subcategory: intermediary
  complexity: high
  risk_level: medium-high
  legal_base: "Глава 52 ГК РФ (ст. 1005–1011)"

# ════════════════════════════════════════════════════════════
# БАЗОВАЯ ИНФОРМАЦИЯ (LEGACY SECTIONS — ОПТИМИЗИРОВАНО)
# ════════════════════════════════════════════════════════════
rules:
  keywords:
    high:
      - "агентский договор"
      - "принципал"
      - "агент"
      - "агентское вознаграждение"
      - "от имени принципала"
      - "от своего имени"
      - "юридические и фактические действия"
      - "субагент"
    medium:
      - "отчет агента"
      - "территория действия"
      - "исключительные права"
      - "эксклюзивность"
      - "продвижение товаров"
      - "дистрибуция"
      - "поиск клиентов"
      - "маркетинговые услуги"
    low:
      - "рамочный договор"
      - "tail commission"
      - "постконтрактное вознаграждение"
      - "конфиденциальность"
      - "переквалификация в трудовой"
      - "коммерческое представительство"
  phrases:
    high:
      - Агент обязуется за вознаграждение совершать по поручению Принципала юридические и иные действия
      - Агент действует [от имени Принципала / от своего имени, но за счет Принципала]
      - Агент обязан представлять Принципалу отчеты в порядке и сроки, предусмотренные договором
      - Принципал обязан уплатить Агенту вознаграждение в размере и порядке, установленных договором
      - При отсутствии указания Агент действует от своего имени
    medium:
      - Агент вправе привлекать субагентов, если это не запрещено договором
      - Принципал не вправе заключать аналогичные договоры с другими агентами на данной территории
      - Агент обязуется не представлять интересы конкурентов Принципала
      - Вознаграждение выплачивается по сделкам, заключенным в период действия договора, даже если оплата поступила позднее
      - Отношения сторон не являются трудовыми
  patterns:
    required:
      - (?i)(агентский\s+договор|принципал|агент|агентское\s+вознаграждение|совершение\s+действий\s+по\s+поручению)
    optional:
      - (?i)(от\s+имени\s+принципала|от\s+своего\s+имени|субагент|исключительные\s+права|постконтрактное\s+вознаграждение)
  exclusions:
    - трудовой договор (подчиненность, график, социальные гарантии)
    - договор возмездного оказания услуг (без элементов посредничества)
    - разовая сделка (скорее поручение или комиссия)
    - договор коммерческой концессии (франчайзинг)
  exclusion_logic:
    - condition: "labor_law_indicators AND subordination_present"
      target: "reclassification_to_labor"
      confidence: 0.85
      description: "Признаки трудовых отношений ведут к переквалификации со всеми налоговыми и социальными последствиями"
    - condition: "single_transaction AND no_continuing_relationship"
      target: "reclassification_to_commission_or_mandate"
      confidence: 0.75
      description: "Разовая сделка указывает на комиссию или поручение, а не на длящийся агентский договор"
  weights:
    keyword_high: 3.0
    keyword_medium: 1.5
    keyword_low: 0.5
    phrase_high: 2.5
    phrase_medium: 1.0
    pattern_required: 4.0
    pattern_optional: 1.0
  classification:
    min_confidence: 0.75
    max_matches: 2

party_roles:
  - Принципал (Клиент/Заказчик) - сторона, дающая поручения, определяющая цели и оплачивающая результат
  - Агент (Исполнитель/Посредник) - сторона, совершающая действия по поручению принципала за вознаграждение

essential_terms:
  - "Предмет: характер (юридические/фактические) и общая сфера действий, которые агент обязуется совершать (ст. 1005 ГК РФ)"
  - "Определение модели действий агента: от имени принципала или от своего имени (при отсутствии - модель комиссии)"
  - "Размер, порядок исчисления и сроки выплаты агентского вознаграждения (договор всегда возмездный, ст. 1006 ГК РФ)"

specific_risks:
  - "Критический риск переквалификации в трудовой договор с доначислением налогов, взносов и предоставлением социальных гарантий"
  - "Для принципала: нечеткий предмет ведет к спорам об объеме работ и качестве исполнения"
  - "Для принципала: при модели 'от своего имени' - риск задержки/неперечисления выручки и сложности во взыскании с третьих лиц"
  - "Для агента: риск невыплаты вознаграждения, особенно по сделкам, оплаченным после окончания договора ('tail commission')"
  - "Для обеих сторон: конфликты из-за нарушения условий об исключительности (территория, конкуренты)"
  - "Для принципала: риск неконтролируемого субагентства и снижения качества услуг"
  - "Налоговые риски: сложности в документировании расходов агента и обосновании вознаграждения"

aliases:
  - Агентский договор
  - Договор на оказание агентских услуг
  - Дистрибьюторский агентский договор
  - Маркетинговый агентский договор
  - Договор на продвижение товаров/услуг
  - Рамочный агентский договор

section_markers:
  - Предмет договора (характер и общая сфера действий агента)
  - Модель действий агента (от чьего имени)
  - Права и обязанности принципала
  - Права и обязанности агента
  - Порядок выдачи и выполнения поручений (заданий)
  - Территория исполнения договора
  - Условия об исключительности (для принципала и/или агента)
  - Агентское вознаграждение и порядок расчетов
  - Порядок представления отчетов агентом и их утверждения принципалом
  - Субагентский договор (допустимость, условия)
  - Конфиденциальность и использование интеллектуальной собственности
  - Срок действия договора и порядок его продления
  - Ответственность сторон
  - Расторжение договора и переходные положения (постконтрактные расчеты)
  - Разрешение споров

notes: |
  ОСОБЕННОСТИ И ПРАВИЛА ПРИМЕНЕНИЯ:
  1. Две модели: от имени принципала (аналогия поручения) или от своего имени (аналогия комиссии). По умолчанию — от своего имени (ст. 1005 ГК РФ).
  2. Всегда возмездный: вознаграждение обязательно (ст. 1006 ГК РФ), расходы по умолчанию в него не включены.
  3. Рамочный характер: детализация часто в отдельных заданиях (поручениях) принципала.
  4. Отчетность: агент обязан представлять отчет, принципал — утвердить или оспорить в срок (ст. 1008 ГК РФ).
  5. Субагентство: допускается, если не запрещено договором (ст. 1009 ГК РФ).
  6. Исключительность: возможны условия о запрете принципалу работать с другими агентами, а агенту — представлять конкурентов (ст. 1007 ГК РФ).
  7. Прекращение: после окончания договора принципал обязан оплатить сделки, совершенные агентом, но расчеты по которым проведены позже (ст. 1010 ГК РФ).
  8. Субсидиарное применение: к модели "от имени принципала" — нормы о поручении (гл. 49 ГК РФ), к модели "от своего имени" — нормы о комиссии (гл. 51 ГК РФ).

