validation_metadata:
  validation_version: "2.0"
  last_updated: "2026-02-07"
  author: "Legal AI Team (Final Integrated)"

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 1: ПРИМЕНИМОЕ ЗАКОНОДАТЕЛЬСТВО
  # ──────────────────────────────────────────────────────────
  legal_base:
    primary:
      - "Глава 52 ГК РФ (ст. 1005–1011) — агентский договор"
    secondary:
      - "ст. 1006 ГК РФ — вознаграждение агента"
      - "ст. 1007 ГК РФ — условия об исключительности"
      - "ст. 1008 ГК РФ — отчет агента"
      - "ст. 1009 ГК РФ — субагентский договор"
      - "ст. 1010 ГК РФ — прекращение агентского договора"
      - "ст. 1011 ГК РФ — субсидиарное применение норм о поручении или комиссии"
    related:
      - "Глава 49 ГК РФ — поручение (для модели 'от имени принципала')"
      - "Глава 51 ГК РФ — комиссия (для модели 'от своего имени')"
      - "Трудовой кодекс РФ (для исключения признаков трудовых отношений)"
      - "Постановление Пленума ВС РФ от 17.03.2004 № 2 'О разграничении трудовых и гражданско-правовых отношений'"
      - "НК РФ ст. 156 (НДС), ст. 251 п. 1 пп. 9 (средства принципала не доход агента)"

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 2: ОБЯЗАТЕЛЬНЫЕ ЭЛЕМЕНТЫ ДОГОВОРА
  # ──────────────────────────────────────────────────────────
  essential_elements:
    - element: "subject_actions_scope"
      required: true
      legal_base: "ст. 432, 1005 ГК РФ"
      description: "Определение характера (юридические/фактические) и общей сферы действий агента"
      validation_rules:
        - "actions_scope_defined"
        - "scope_is_clear_and_not_labor_like"
      risk_if_missing: "Неопределенный предмет ведет к признанию договора незаключенным или к спорам об объеме обязательств"
      conditional_checks:
        - trigger: "agency_keywords"
          keywords: ["агентский договор", "совершать действия", "по поручению принципала"]
          rule: "subject_must_be_defined"
          legal_base: "ст. 1005 ГК РФ"
          severity: "critical"

    - element: "agency_model_specification"
      required: false
      legal_base: "ст. 1005 ГК РФ"
      description: "Указание, от чьего имени действует агент: от имени принципала или от своего имени"
      validation_rules:
        - "action_model_specified"
      risk_if_missing: "При отсутствии указания считается, что агент действует от своего имени (модель комиссии), что может не соответствовать намерениям принципала."
      conditional_checks:
        - trigger: "principal_control_required"
          keywords: ["непосредственное взыскание", "прямые отношения с клиентами", "контроль над сделками"]
          rule: "model_specification_recommended"
          legal_base: "ст. 1005 ГК РФ"
          severity: "high"
          risk_msg: "Для прямого контроля принципалу выгодна модель 'от имени принципала'"

    - element: "agency_remuneration"
      required: true
      legal_base: "ст. 1005, 1006 ГК РФ"
      description: "Размер, порядок исчисления и сроки выплаты агентского вознаграждения (договор всегда возмездный)"
      validation_rules:
        - "remuneration_amount_or_calculation_specified"
        - "payment_procedure_defined"
      risk_if_missing: "Отсутствие условия о вознаграждении не делает договор безвозмездным; вознаграждение определяется по правилам ст. 424 ГК РФ, что порождает споры."

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 3: ЗАЩИТНЫЕ УСЛОВИЯ (PROTECTIVE CLAUSES)
  # ──────────────────────────────────────────────────────────
  protective_clauses:
    
    # --- ЗАЩИТА ПРИНЦИПАЛА (Principal Protection) ---
    principal_protection:
      - clause_id: "clear_action_model_and_risks"
        name: "Четкое определение модели действий и связанных с ней рисков"
        risk_if_missing: |
          Неопределенность в модели ведет к применению модели по умолчанию (от своего имени).
          Принципал теряет возможность прямого взыскания долгов, усложняется контроль и
          возрастает риск недобросовестности агента. Критично для контроля финансовых потоков.
        legal_base: "ст. 1005 ГК РФ"
        severity: "critical"
        affected_party: "principal"
        detection:
          positive_keywords:
            - "Агент действует от имени Принципала"
            - "Агент действует от своего имени, но за счет Принципала"
            - "Права и обязанности по сделкам возникают непосредственно у Принципала"
            - "последствия выбора модели"
          context_patterns:
            - '(?i)агент\s+действует\s+(от\s+имени\s+принципала|от\s+своего\s+имени).*в\s+соответствии\s+со\s+ст\.\s+1005\s+ГК\s+РФ'

      - clause_id: "funds_and_assets_control"
        name: "Контроль за денежными средствами и имуществом принципала у агента"
        risk_if_missing: |
          При модели «от своего имени» агент получает средства от третьих лиц на свой счет.
          Без четких сроков и порядка перечисления выручки принципалу агент может задерживать
          средства, используя их в обороте. При банкротстве агента средства принципала рискуют
          попасть в конкурсную массу.
        legal_base: "ст. 1005, 1011 ГК РФ (субсидиарно — ст. 996, 999 ГК РФ)"
        severity: "critical"
        affected_party: "principal"
        detection:
          positive_keywords:
            - "перечисление выручки"
            - "срок перечисления"
            - "обособленный учет средств принципала"
            - "специальный счет"
            - "отчет о полученных средствах"
            - "не позднее X рабочих дней"
          context_patterns:
            - '(?i)агент\s+обязан\s+перечислить\s+средства\s+принципалу\s+в\s+течение\s+[0-9]+\s+(дней|рабочих\s+дней)'

      - clause_id: "exclusivity_and_non_competition"
        name: "Условия об исключительности и запрете конкуренции"
        risk_if_missing: |
          Без условий об исключительности принципал может нанимать других агентов на той же территории,
          а агент — представлять интересы конкурентов. Это приводит к конфликтам интересов, размыванию
          усилий агента и утечке клиентской базы.
        legal_base: "ст. 1007 ГК РФ"
        severity: "high"
        affected_party: "principal"
        detection:
          positive_keywords:
            - "исключительные права"
            - "Принципал не вправе заключать аналогичные договоры с другими агентами"
            - "Агент не вправе представлять интересы конкурентов Принципала"
            - "территория действия договора"
            - "запрет на конкуренцию"
          context_patterns:
            - '(?i)принципал\s+предоставляет\s+агенту\s+исключительные\s+права\s+на\s+территории'
            - '(?i)агент\s+не\s+вправе\s+представлять\s+интересы\s+лиц,\s+являющихся\s+конкурентами\s+принципала'

    # --- ЗАЩИТА АГЕНТА (Agent Protection) ---
    agent_protection:
      - clause_id: "remuneration_guarantee_and_payment_terms"
        name: "Гарантия вознаграждения и четкие условия оплаты"
        risk_if_missing: |
          Без четкого порядка и сроков выплаты (аванс, периодические платежи, проценты от сделок)
          агент рискует выполнить объем работы без оплаты. Особенно критично при долгосрочных
          проектах с отсроченным результатом.
        legal_base: "ст. 1006 ГК РФ"
        severity: "critical"
        affected_party: "agent"
        detection:
          positive_keywords:
            - "агентское вознаграждение"
            - "размер вознаграждения"
            - "сроки выплаты вознаграждения"
            - "порядок расчета вознаграждения"
            - "авансовые платежи"
            - "процент от суммы заключенных сделок"
            - "паушальное вознаграждение"
          context_patterns:
            - '(?i)вознаграждение\s+агента\s+составляет\s+[0-9]+%.*от\s+суммы\s+заключенных\s+сделок'

      - clause_id: "post_termination_remuneration"
        name: "Вознаграждение по сделкам, оплаченным после окончания договора (Tail Commission)"
        risk_if_missing: |
          Агент часто заключает сделки, оплата по которым поступает уже после окончания договора.
          Без явного условия о праве на вознаграждение по таким сделкам агент рискует не получить
          оплату за свою работу. Это ключевой риск в дистрибьюторских и маркетинговых договорах.
        legal_base: "ст. 1006 ГК РФ, судебная практика"
        severity: "high"
        affected_party: "agent"
        detection:
          positive_keywords:
            - "вознаграждение по сделкам после окончания договора"
            - "tail commission"
            - "постконтрактное вознаграждение"
            - "сделки, заключенные в период действия"
            - "расчеты после окончания"
          context_patterns:
            - '(?i)принципал\s+обязан\s+выплатить\s+вознаграждение\s+по\s+сделкам.*оплаченным\s+после\s+окончания'
            - '(?i)право\s+на\s+вознаграждение\s+сохраняется\s+по\s+сделкам.*заключенным\s+в\s+период\s+действия'

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 4: ДОПОЛНИТЕЛЬНЫЕ PROTECTIVE CLAUSES
  # ──────────────────────────────────────────────────────────
  additional_protective_clauses:
    
    # Защита принципала
    principal_protection:
      - clause_id: "subagency_control"
        name: "Контроль привлечения субагентов"
        risk_if_missing: |
          Агент вправе привлечь субагента, если это не запрещено договором (ст. 1009 ГК РФ).
          Без ограничений или требования предварительного согласования принципал может
          столкнуться с неизвестными субагентами, качество работы которых он не контролирует.
        legal_base: "ст. 1009 ГК РФ"
        severity: "high"
        affected_party: "principal"
        detection:
          positive_keywords:
            - "субагентский договор"
            - "привлечение субагентов допускается с согласия принципала"
            - "запрет на субагентство"
            - "агент отвечает за действия субагента"
          context_patterns:
            - '(?i)привлечение\s+субагентов\s+допускается\s+только\s+с\s+предварительного\s+письменного\s+согласия\s+принципала'

    # Защита агента
    agent_protection:
      - clause_id: "clear_payment_triggers"
        name: "Четкие основания (триггеры) для выплаты вознаграждения"
        risk_if_missing: |
          Без определения момента возникновения права на вознаграждение (заключение сделки,
          оплата клиентом, поставка) возникают споры. Принципал может отказывать в оплате,
          ссылаясь на неисполнение сделки клиентом, хотя агент выполнил свою часть.
        legal_base: "ст. 1006 ГК РФ"
        severity: "high"
        affected_party: "agent"
        detection:
          positive_keywords:
            - "момент возникновения права на вознаграждение"
            - "триггер оплаты"
            - "вознаграждение начисляется при"
            - "оплата за заключенную сделку"
            - "независимо от оплаты клиентом"
          context_patterns:
            - '(?i)право\s+на\s+вознаграждение\s+возникает\s+с\s+момента\s+(заключения\s+сделки|поступления\s+оплаты)'

      - clause_id: "principal_exclusivity_for_agent"
        name: "Исключительность территории/сегмента для агента (запрет принципалу работать с другими агентами)"
        risk_if_missing: |
          Принципал может использовать других агентов на той же территории, что снижает
          эффективность работы агента и создает конкуренцию. Для агента это условие важно
          для защиты инвестиций в развитие территории.
        legal_base: "ст. 1007 ГК РФ"
        severity: "medium"
        affected_party: "agent"
        detection:
          positive_keywords:
            - "исключительные права на территорию"
            - "эксклюзивный агент"
            - "запрет другим агентам"
            - "единственный агент на территории"
          context_patterns:
            - '(?i)принципал\s+не\s+вправе\s+заключать.*договоры\s+с\s+другими\s+агентами\s+на\s+(данной\s+)?территории'

    # Общие защитные условия (КРИТИЧЕСКИЕ)
    both_parties_protection:
      - clause_id: "anti_requalification_measures"
        name: "Положения, исключающие переквалификацию в трудовой договор"
        risk_if_missing: |
          При наличии признаков трудовых отношений (фиксированный график, подчинение правилам
          внутреннего распорядка, социальные гарантии) договор может быть переквалифицирован
          в трудовой. Последствия: доначисление НДФЛ, страховых взносов, штрафы, оплата отпусков.
        legal_base: "ст. 15, 16 ТК РФ, Постановление Пленума ВС РФ № 2"
        severity: "critical"
        affected_party: "both"
        detection:
          positive_keywords:
            - "агент действует самостоятельно и на свой риск"
            - "свободный график работы"
            - "отсутствие подчинения правилам внутреннего трудового распорядка"
            - "не является трудовыми отношениями"
          negative_keywords:
            - "рабочий день с ... до ..."
            - "подчиняется правилам внутреннего трудового распорядка"
            - "ежегодный оплачиваемый отпуск"
            - "должностная инструкция"
          context_patterns:
            - '(?i)отношения\s+сторон\s+не\s+являются\s+трудовыми\s+и\s+регулируются\s+исключительно\s+гражданским\s+законодательством'

      - clause_id: "report_approval_and_dispute_resolution"
        name: "Порядок утверждения отчета и разрешения разногласий"
        risk_if_missing: |
          Агент обязан представлять отчеты (ст. 1008 ГК РФ). Без четких сроков и процедуры утверждения
          принципал может затягивать согласование, блокируя выплату вознаграждения, либо молчанием
          принимать невыгодные условия. Споры о качестве отчета становятся неразрешимыми.
        legal_base: "ст. 1008 ГК РФ"
        severity: "high"
        affected_party: "both"
        detection:
          positive_keywords:
            - "срок представления отчета"
            - "порядок утверждения отчета"
            - "срок для заявления возражений"
            - "молчание считается согласием"
            - "процедура урегулирования разногласий по отчету"
          context_patterns:
            - '(?i)принципал\s+обязан\s+рассмотреть\s+отчет\s+и\s+направить\s+возражения\s+в\s+течение\s+[0-9]+\s+дней'

      - clause_id: "applicable_law_and_model_clarification"
        name: "Субсидиарное применение норм о поручении или комиссии"
        risk_if_missing: |
          В зависимости от выбранной модели к агентскому договору применяются нормы о поручении
          (гл. 49 ГК РФ) или о комиссии (гл. 51 ГК РФ). Без указания на это возникают сложности
          в толковании прав и обязанностей сторон в ситуациях, не урегулированных главой 52 ГК РФ.
        legal_base: "ст. 1011 ГК РФ"
        severity: "medium"
        affected_party: "both"
        detection:
          positive_keywords:
            - "к отношениям сторон применяются нормы о договоре поручения/комиссии"
            - "субсидиарное применение главы 49/51 ГК РФ"
          context_patterns:
            - '(?i)в\s+части,\s+не\s+урегулированной\s+настоящим\s+договором,\s+применяются\s+правила\s+о\s+договоре\s+(поручения|комиссии)'