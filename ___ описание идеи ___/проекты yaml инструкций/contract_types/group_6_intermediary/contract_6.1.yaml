type: contract_6.1
name: Договор поручения
description: |
  Фидуциарный (лично-доверительный) договор, по которому поверенный обязуется совершить от имени и за счет доверителя определенные юридические действия.
  Права и обязанности по сделкам возникают непосредственно у доверителя. Для совершения юридически значимых действий требуется доверенность.
  Каждая сторона вправе в одностороннем порядке отказаться от договора в любое время. Регулируется Главой 49 ГК РФ.
version: 2.0
parent: class_6_intermediary
metadata:
  category: contract
  subcategory: intermediary
  complexity: medium
  risk_level: medium-high
  legal_base: "Глава 49 ГК РФ (ст. 971–979)"

# ════════════════════════════════════════════════════════════
# БАЗОВАЯ ИНФОРМАЦИЯ (LEGACY SECTIONS — ОПТИМИЗИРОВАНО)
# ════════════════════════════════════════════════════════════
rules:
  keywords:
    high:
      - "поручение"
      - "доверитель"
      - "поверенный"
      - "от имени доверителя"
      - "за счет доверителя"
      - "доверенность"
      - "фидуциарный"
      - "юридические действия"
    medium:
      - "отмена поручения"
      - "отказ от поручения"
      - "отчет поверенного"
      - "возмещение расходов"
      - "вознаграждение поверенного"
      - "представительство"
      - "передоверие"
      - "указания доверителя"
    low:
      - "лично-доверительные отношения"
      - "коммерческий представитель"
      - "одобрение сделки"
      - "оправдательные документы"
      - "судебное представительство"
  phrases:
    high:
      - Поверенный обязуется совершать от имени и за счет Доверителя юридические действия
      - Доверитель обязан выдать Поверенному доверенность на совершение действий
      - все права и обязанности по сделкам возникают непосредственно у Доверителя
      - Поверенный обязан представлять Доверителю отчеты о выполнении поручения
      - договор поручения прекращается смертью любой из сторон
    medium:
      - Доверитель вправе отменить поручение, а Поверенный - отказаться от него в любое время
      - Поверенный обязан действовать в соответствии с указаниями Доверителя
      - вознаграждение выплачивается после исполнения поручения
      - передоверие допускается только с согласия Доверителя
      - Поверенный обязан передать Доверителю все полученное по сделкам
  patterns:
    required:
      - (?i)(договор\s+поручения|поверенн\w+.*от\s+имени.*доверител|доверител\w+.*выдать\s+доверенность)
    optional:
      - (?i)(фидуциарн\w+.*характер|отмена\s+поручения|отчет\s+поверенного|передовери\w+|указания\s+доверителя)
  exclusions:
    - действие от своего имени (комиссия)
    - агентский договор по модели комиссии
    - трудовой договор
    - договор возмездного оказания услуг (без представительства)
  exclusion_logic:
    - condition: "acts_in_own_name AND not_principals_name"
      target: "reclassification_to_commission"
      confidence: 0.85
      description: "Действие от своего имени — признак договора комиссии, а не поручения"
    - condition: "no_power_of_attorney_requirement AND no_legal_representation"
      target: "reclassification_to_services"
      confidence: 0.75
      description: "Если действия не требуют представительства, это услуги, а не поручение"
  weights:
    keyword_high: 3.0
    keyword_medium: 1.5
    keyword_low: 0.5
    phrase_high: 2.5
    phrase_medium: 1.0
    pattern_required: 4.0
    pattern_optional: 1.0
  classification:
    min_confidence: 0.75
    max_matches: 2

party_roles:
  - Доверитель (Принципал) - сторона, дающая поручение и несущая все риски и выгоды по сделкам
  - Поверенный (Агент/Представитель) - сторона, принимающая поручение действовать от имени доверителя

essential_terms:
  - "Четко определенный предмет: исчерпывающий перечень конкретных юридических действий поверенного (ст. 432, 971 ГК РФ)"
  - "Обязанность доверителя выдать доверенность, соответствующую объему полномочий по договору"
  - "Правомерные, конкретные и осуществимые указания доверителя (ст. 973 ГК РФ)"
  - "Вознаграждение и порядок его выплаты (если договор возмездный, особенно при предпринимательской деятельности)"

specific_risks:
  - "Для доверителя: риск действий поверенного с превышением полномочий или в конфликте интересов"
  - "Для доверителя: фидуциарный характер позволяет поверенному отказаться от поручения в любой момент"
  - "Для поверенного: риск невозмещения фактически понесенных расходов при досрочной отмене поручения"
  - "Для поверенного: солидарная ответственность с доверителем перед третьими лицами при отсутствии полномочий (ст. 183 ГК РФ)"
  - "Для обеих сторон: автоматическое прекращение договора при смерти, ликвидации, утрате дееспособности (ст. 977, 978 ГК РФ)"
  - "Для третьих лиц: риск заключения сделки с представителем, чьи полномочия прекращены"
  - "Налоговые риски: вознаграждение облагается НДФЛ/НП, расходы должны быть документально подтверждены"

aliases:
  - Поручение
  - Договор представительства
  - Договор на совершение юридических действий
  - Договор на представление интересов

section_markers:
  - Предмет договора (детальный перечень поручаемых юридических действий)
  - Полномочия поверенного и порядок выдачи доверенности
  - Указания доверителя и порядок их изменения
  - Права и обязанности сторон
  - Вознаграждение и порядок расчетов
  - Порядок возмещения расходов поверенного
  - Отчетность поверенного (форма, сроки, подтверждающие документы)
  - Передоверие (допустимость, условия, ответственность)
  - Ответственность сторон
  - Срок действия договора и доверенности
  - Порядок отмены поручения и отказа от исполнения
  - Последствия прекращения договора
  - Конфиденциальность
  - Разрешение споров

notes: |
  ОСОБЕННОСТИ И ПРАВИЛА ПРИМЕНЕНИЯ:
  1. Фидуциарный характер: отношения основаны на доверии, прекращаются смертью, ликвидацией, банкротством стороны.
  2. Требование доверенности: для совершения действий, требующих представительства перед третьими лицами.
  3. Действия от имени доверителя: все права/обязанности по сделкам возникают непосредственно у доверителя.
  4. Возмездность: предполагается, если договор связан с предпринимательской деятельностью хотя бы одной стороны (ст. 972 ГК РФ).
  5. Односторонний отказ: доверитель вправе отменить, поверенный - отказаться в любое время (ст. 977, 978 ГК РФ).
  6. Отчетность: поверенный обязан представить отчет с доказательствами, доверитель - принять или оспорить.
  7. Коммерческое представительство: особый режим (ст. 184 ГК РФ), представитель может действовать в интересах обеих сторон сделки.

# ════════════════════════════════════════════════════════════
# 🆕 ВАЛИДАЦИОННЫЕ СЕКЦИИ (VALIDATION ENGINE v2.0)
# ════════════════════════════════════════════════════════════

validation_metadata:
  validation_version: "2.0"
  last_updated: "2026-02-07"
  author: "Legal AI Team (Integrated)"

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 1: ПРИМЕНИМОЕ ЗАКОНОДАТЕЛЬСТВО
  # ──────────────────────────────────────────────────────────
  legal_base:
    primary:
      - "Глава 49 ГК РФ (ст. 971–979) — договор поручения"
    secondary:
      - "Глава 10 ГК РФ (ст. 182–189) — представительство и доверенность"
      - "ст. 183 ГК РФ — последствия действий без полномочий или с их превышением"
      - "ст. 184 ГК РФ — коммерческое представительство"
      - "ст. 310 ГК РФ — недопустимость одностороннего отказа (исключение для фидуциарных договоров)"
    related:
      - "ГПК РФ (Глава 6), АПК РФ (Глава 5) — судебное представительство"
      - "Основы законодательства РФ о нотариате — нотариальная форма доверенности"
      - "ФЗ от 31.05.2002 № 63-ФЗ 'Об адвокатской деятельности'"
      - "НК РФ (гл. 23, 25) — налогообложение вознаграждений"
      - "Постановление Пленума ВС РФ от 23.06.2015 № 25"

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 2: ОБЯЗАТЕЛЬНЫЕ ЭЛЕМЕНТЫ ДОГОВОРА
  # ──────────────────────────────────────────────────────────
  essential_elements:
    - element: "subject_legal_actions"
      required: true
      legal_base: "ст. 432, 971 ГК РФ"
      description: "Исчерпывающий перечень конкретных юридических действий, которые поверенный обязуется совершить"
      validation_rules:
        - "actions_list_present"
        - "actions_are_juridical"
        - "definiteness_check"
      risk_if_missing: "Без четкого перечня действий предмет договора является несогласованным, что может повлечь его недействительность"
      conditional_checks:
        - trigger: "mandate_keywords"
          keywords: ["поручение", "совершить действия", "от имени доверителя"]
          rule: "subject_must_be_specific"
          legal_base: "ст. 971 ГК РФ"
          severity: "critical"

    - element: "power_of_attorney_obligation"
      required: true
      legal_base: "ст. 975 ГК РФ"
      description: "Прямая обязанность доверителя выдать доверенность, соответствующую полномочиям по договору"
      validation_rules:
        - "power_of_attorney_mentioned"
        - "correspondence_to_mandate"
      conditional_checks:
        - trigger: "representation_required"
          keywords: ["заключение договора", "подписание", "государственная регистрация", "распоряжение имуществом"]
          rule: "power_of_attorney_mandatory"
          legal_base: "ст. 182, 185.1 ГК РФ"
          severity: "critical"
          risk_msg: "Для действий, требующих представительства, нотариальная доверенность может быть обязательна"

    - element: "instructions_of_principal"
      required: true
      legal_base: "ст. 973 ГК РФ"
      description: "Правомерные, конкретные и осуществимые указания доверителя, определяющие действия поверенного"
      validation_rules:
        - "instructions_specified"
        - "lawfulness_check"
        - "clarity_check"

    - element: "reporting_obligations"
      required: true
      legal_base: "ст. 974 ГК РФ"
      description: "Обязанность поверенного отчитываться перед доверителем, форма, сроки и приложение документов"
      validation_rules:
        - "reporting_clause_present"
        - "reporting_period_specified"
        - "supporting_docs_mentioned"

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 3: ЗАЩИТНЫЕ УСЛОВИЯ (PROTECTIVE CLAUSES)
  # ──────────────────────────────────────────────────────────
  protective_clauses:
    
    # --- ЗАЩИТА ДОВЕРИТЕЛЯ (Principal Protection) ---
    principal_protection:
      - clause_id: "scope_of_authority_limitation"
        name: "Четкое ограничение объема и целей полномочий поверенного"
        risk_if_missing: |
          Без детальных ограничений поверенный, действуя в рамках доверенности, может совершать любые сделки,
          в том числе невыгодные. Доверитель будет связан ими, если не докажет, что третье лицо знало
          о превышении полномочий (ст. 183 ГК РФ). Риск существенных финансовых потерь.
        legal_base: "ст. 971, 183 ГК РФ"
        severity: "critical"
        affected_party: "principal"
        detection:
          positive_keywords:
            - "поверенный вправе совершать только следующие действия"
            - "запрещается совершать сделки, не указанные в договоре"
            - "пределы полномочий"
            - "максимальная сумма сделки"
            - "требуется предварительное письменное согласование"
          negative_keywords:
            - "вправе совершать любые необходимые действия"
          context_patterns:
            - '(?i)поверенный\s+не\s+вправе\s+совершать\s+сделки\s+на\s+сумму\s+свыше\s+[0-9]+'
            - '(?i)совершение\s+сделок,\s+не\s+предусмотренных\s+в\s+п\.\s+[0-9]+\s+, запрещено'

      - clause_id: "conflict_of_interest_prohibition"
        name: "Запрет конфликта интересов и двойного представительства"
        risk_if_missing: |
          Поверенный может совершить сделку с самим собой или представлять интересы обеих сторон в одной сделке
          в ущерб доверителю. Без прямого запрета такие сделки оспариваются только в суде как злоупотребление доверием.
        legal_base: "ст. 10, 182 ГК РФ"
        severity: "critical"
        affected_party: "principal"
        detection:
          positive_keywords:
            - "запрет действовать в собственных интересах"
            - "конфликт интересов"
            - "не может представлять интересы другой стороны"
            - "запрет на сделки с аффилированными лицами"
            - "обязанность уведомлять о потенциальном конфликте"
          context_patterns:
            - '(?i)поверенный\s+не\s+вправе\s+совершать\s+сделки\s+от\s+имени\s+доверителя\s+с\s+самим\s+собой'
            - '(?i)при\s+возникновении\s+конфликта\s+интересов\s+поверенный\s+обязан\s+немедленно\s+уведомить'

      - clause_id: "power_of_attorney_revocation_mechanism"
        name: "Механизм отмены доверенности и уведомления третьих лиц"
        risk_if_missing: |
          При отмене поручения доверенность должна быть отозвана. Без уведомления третьих лиц они вправе
          полагаться на ее действительность, и сделки поверенного будут связывать доверителя.
          Риск сохранения обязательств по сделкам, о которых доверитель не знает.
        legal_base: "ст. 188, 189 ГК РФ"
        severity: "critical"
        affected_party: "principal"
        detection:
          positive_keywords:
            - "обязанность возврата доверенности"
            - "уведомление третьих лиц об отмене"
            - "публикация в реестре отмененных доверенностей"
            - "срок для уведомления"
            - "ответственность за неотзыв"
          context_patterns:
            - '(?i)при\s+прекращении\s+договора\s+поверенный\s+обязан\s+немедленно\s+вернуть\s+доверенность'
            - '(?i)доверитель\s+обязуется\s+уведомить\s+известных\s+третьих\s+лиц\s+об\s+отмене\s+доверенности'

    # --- ЗАЩИТА ПОВЕРЕННОГО (Agent Protection) ---
    agent_protection:
      - clause_id: "expense_reimbursement_procedure"
        name: "Детальный порядок возмещения расходов и авансирования"
        risk_if_missing: |
          Доверитель обязан возмещать понесенные издержки (ст. 975 ГК РФ). Без процедуры (смета, аванс, отчет)
          поверенный рискует финансировать исполнение поручения из своих средств и столкнуться с отказом
          в возмещении, особенно при досрочной отмене поручения.
        legal_base: "ст. 975 ГК РФ"
        severity: "critical"
        affected_party: "agent"
        detection:
          positive_keywords:
            - "доверитель обязан возместить все документально подтвержденные расходы"
            - "аванс на расходы"
            - "смета расходов"
            - "оправдательные документы"
            - "срок возмещения"
          context_patterns:
            - '(?i)доверитель\s+обязуется\s+возместить\s+поверенному\s+фактически\s+понесенные\s+расходы\s+на\s+основании\s+отчета'

      - clause_id: "remuneration_on_early_termination"
        name: "Компенсация вознаграждения при досрочном прекращении договора"
        risk_if_missing: |
          Доверитель вправе отменить поручение в любое время (ст. 977 ГК РФ). Без условия о компенсации
          поверенный не получит вознаграждения за уже выполненную работу, что лишает его экономического
          интереса и создает риск неполучения оплаты.
        legal_base: "ст. 978 ГК РФ"
        severity: "high"
        affected_party: "agent"
        detection:
          positive_keywords:
            - "вознаграждение при досрочной отмене"
            - "пропорциональная оплата выполненного"
            - "компенсация фактически понесенных расходов"
            - "выходное вознаграждение"
          context_patterns:
            - '(?i)в\s+случае\s+отмены\s+поручения\s+доверителем\s+поверенному\s+выплачивается\s+вознаграждение\s+соразмерно'

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 4: ДОПОЛНИТЕЛЬНЫЕ PROTECTIVE CLAUSES
  # ──────────────────────────────────────────────────────────
  additional_protective_clauses:
    
    # Защита доверителя
    principal_protection:
      - clause_id: "transfer_of_proceeds_obligation"
        name: "Обязанность незамедлительной передачи всего полученного по сделкам"
        risk_if_missing: |
          Поверенный обязан передавать доверителю все полученное (ст. 974 ГК РФ). Без конкретного срока и порядка
          поверенный может удерживать денежные средства или имущество, создавая риск их присвоения или утраты.
        legal_base: "ст. 974 ГК РФ"
        severity: "critical"
        affected_party: "principal"
        detection:
          positive_keywords:
            - "передача полученного"
            - "всё полученное по сделкам"
            - "немедленная передача"
            - "срок передачи денежных средств"
            - "запрет удержания"
          context_patterns:
            - '(?i)поверенный\s+обязан\s+передать\s+доверителю\s+всё\s+полученное\s+в\s+течение\s+[0-9]+\s+дней'

      - clause_id: "subdelegation_control"
        name: "Контроль передоверия полномочий"
        risk_if_missing: |
          Передоверие допускается с согласия доверителя (ст. 976 ГК РФ). Без контроля доверитель может получить
          непредсказуемого субповеренного, за действия которого первоначальный поверенный отвечает как за свои.
        legal_base: "ст. 976 ГК РФ"
        severity: "high"
        affected_party: "principal"
        detection:
          positive_keywords:
            - "передоверие допускается только с письменного согласия"
            - "запрет передоверия"
            - "ответственность за выбор заместителя"
            - "требование к квалификации заместителя"
          context_patterns:
            - '(?i)передоверие\s+исполнения\s+поручения\s+допускается\s+только\s+при\s+наличии\s+письменного\s+согласия'

    # Защита поверенного
    agent_protection:
      - clause_id: "clear_instructions_right"
        name: "Право на получение четких и исполнимых указаний"
        risk_if_missing: |
          Поверенный обязан следовать указаниям доверителя (ст. 973 ГК РФ). При нечетких или противоречивых
          указаниях поверенный рискует быть привлеченным к ответственности за ненадлежащее исполнение.
          Необходимо право требовать разъяснений.
        legal_base: "ст. 973 ГК РФ"
        severity: "high"
        affected_party: "agent"
        detection:
          positive_keywords:
            - "указания должны быть конкретными и осуществимыми"
            - "право требовать разъяснения указаний"
            - "срок для дачи разъяснений"
            - "ответственность за нечеткие указания"
          context_patterns:
            - '(?i)при\s+неясности\s+указаний\s+поверенный\s+вправе\s+приостановить\s+исполнение\s+до\s+получения\s+разъяснений'

    # Общая защита
    both_parties_protection:
      - clause_id: "termination_settlement_procedure"
        name: "Порядок завершения расчетов и передачи документов при прекращении"
        risk_if_missing: |
          При прекращении (отмена, отказ, смерть) не урегулированы вопросы: возврат доверенностей, передача
          документов, окончательный расчет. Это создает риски споров и невозможности завершить отношения.
        legal_base: "ст. 977-979 ГК РФ"
        severity: "critical"
        affected_party: "both"
        detection:
          positive_keywords:
            - "последствия прекращения договора"
            - "возврат доверенностей и документов"
            - "окончательный расчет в течение X дней"
            - "действия по завершению текущих дел"
            - "обязанности правопреемников"
          context_patterns:
            - '(?i)при\s+прекращении\s+договора\s+поверенный\s+обязан\s+вернуть\s+все\s+документы\s+и\s+произвести\s+окончательный\s+расчет'

      - clause_id: "commercial_representation_specifics"
        name: "Специальные условия для коммерческого представительства"
        risk_if_missing: |
          Коммерческий представитель (ст. 184 ГК РФ) имеет особый статус (действует в предпринимательских целях,
          может представлять обе стороны сделки). Без учета этого статуса могут быть нарушены специальные нормы.
        legal_base: "ст. 184 ГК РФ"
        severity: "high"
        affected_party: "both"
        detection:
          positive_keywords:
            - "коммерческий представитель"
            - "предпринимательская деятельность"
            - "право представлять обе стороны сделки с согласия"
            - "требование письменной формы"
            - "вознаграждение во всех случаях"
          context_patterns:
            - '(?i)поверенный\s+является\s+коммерческим\s+представителем\s+в\s+смысле\s+ст\.\s+184\s+ГК\s+РФ'
        conditional_checks:
          - trigger: "commercial_rep_keywords"
            keywords: ["коммерческий представитель", "предприниматель", "ИП", "ООО", "в рамках предпринимательской деятельности"]
            rule: "commercial_rep_clauses_required"
            severity: "high"