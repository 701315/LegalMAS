type: contract_1.5
name: "Договор энергоснабжения"
description: |
  Специализированный вид купли-продажи, регулируемый § 6 Главы 30 ГК РФ, для поставки энергии
  (электрической, тепловой, газа, воды) через присоединенную сеть. Является публичным договором,
  характеризуется особым способом передачи товара и специальными правилами учета потребления.
version: 2.0
parent: class_1_transfer_of_ownership
metadata:
  category: contract
  subcategory: ownership_transfer
  complexity: medium
  risk_level: medium
  legal_base: § 6 Главы 30 ГК РФ (ст. 539-548)

# ════════════════════════════════════════════════════════════
# БАЗОВАЯ ИНФОРМАЦИЯ (LEGACY SECTIONS)
# ════════════════════════════════════════════════════════════
rules:
  keywords:
    high:
      - "энергоснабжен"
      - "энергоснабжающ организаци"
      - "абонент"
      - "энергия"
      - "через присоединенную сеть"
    medium:
      - "электроэнергия"
      - "тепло"
      - "вода"
      - "газ"
      - "потребитель"
      - "подача энергии"
    low:
      - "снабжение"
      - "тариф"
      - "счетчик"
      - "ОДН"
      - "прибор учета"
  phrases:
    high:
      - Энергоснабжающая организация обязуется подавать энергию через присоединенную сеть
      - Расчеты производятся на основании показаний приборов учета
      - При неоплате энергоснабжающая организация вправе ограничить или приостановить подачу энергии
      - подача энергии
      - прибор учета (счетчик)
    medium:
      - Абонент обязуется оплачивать принятую энергию
      - Качество энергии должно соответствовать установленным требованиям
  patterns:
    required:
      - (?i)(энергоснабжени|энергоснабжающ.*организац|электроэнерг|тепло.*энерг|энерги.*через.*присоединенн.*сеть)  # → contract_1.5
    optional:
      - (?i)(электроэнергия|тепло.*энергия|водоснабжение|газоснабжение|потребитель)
  exclusions:
    - продажа в емкостях
    - разовая передача
    - договор подряда
  weights:
    keyword_high: 3.0
    keyword_medium: 1.5
    keyword_low: 0.5
    phrase_high: 2.5
    phrase_medium: 1.0
    pattern_required: 4.0
    pattern_optional: 1.0
  classification:
    min_confidence: 0.70
    max_matches: 3

party_roles:
  - Энергоснабжающая организация (Energy Supplier) — продавец, осуществляющий подачу энергии
  - Абонент (Subscriber) — потребитель, приобретающий энергию для использования

essential_terms:
  - Количество энергии, принимаемой абонентом (или порядок его определения)
  - Режим потребления (для некоторых категорий абонентов)
  - Качество энергии (соответствие ГОСТ, параметрам)

specific_risks:
  - Несанкционированное подключение и бездоговорное потребление
  - Неисправность приборов учета и расчеты по нормативу
  - Перерывы в подаче энергии и ответственность за них
  - Необоснованное ограничение/отключение подачи энергии

aliases:
  - Энергоснабжение
  - Договор на снабжение энергией
  - Договор на поставку электроэнергии
  - Договор теплоснабжения
  - Договор водоснабжения
  - Договор газоснабжения

section_markers:
  - Предмет договора (вид энергии, точки поставки)
  - Обязанности энергоснабжающей организации (подача, качество)
  - Обязанности абонента (оплата, соблюдение режима, содержание сетей и приборов учета)
  - Порядок расчетов (тарифы, учет)
  - Ответственность сторон
  - Порядок ограничения и прекращения подачи энергии

notes: |
  Публичный договор (ст. 426 ГК РФ) — энергоснабжающая организация обязана заключить его с любым обратившимся.
  Для граждан отношения часто регулируются как договор возмездного оказания коммунальных услуг.
  Существует множество подзаконных актов, регулирующих технические аспекты подключения, учета и подачи ресурсов.

