# ════════════════════════════════════════════════════════════

validation_metadata:
  validation_version: "2.0"
  last_updated: "2026-02-06"
  author: "Legal AI Team"
  
  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 1: ПРИМЕНИМОЕ ЗАКОНОДАТЕЛЬСТВО
  # ──────────────────────────────────────────────────────────
  legal_base:
    primary:
      - "§ 6 Главы 30 ГК РФ (ст. 539-548)"
    secondary:
      - "Федеральный закон от 26.03.2003 № 35-ФЗ «Об электроэнергетике»"
      - "Федеральный закон от 27.07.2010 № 190-ФЗ «О теплоснабжении»"
      - "Федеральный закон от 07.12.2011 № 416-ФЗ «О водоснабжении и водоотведении»"
    related:
      - "Правила недискриминационного доступа к услугам по передаче электрической энергии"
      - "Правила поставки газа"
      - "Постановление Правительства РФ № 354 от 06.05.2011 (Правила предоставления коммунальных услуг)"

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 2: ОБЯЗАТЕЛЬНЫЕ ЭЛЕМЕНТЫ ДОГОВОРА
  # ──────────────────────────────────────────────────────────
  essential_elements:
    - element: "parties"
      required: true
      legal_base: "ст. 432, 539 ГК РФ"
      validation_rules:
        - "presence_check"
        - "legal_capacity_indicators"
    
    - element: "subject"
      required: true
      legal_base: "ст. 539, 541 ГК РФ"
      description: "Вид энергии (электрическая, тепловая, газ, вода), подаваемой через присоединенную сеть"
      validation_rules:
        - "presence_check"
        - "energy_type_specified"
      conditional_checks:
        - trigger: "specific_energy_type"
          keywords: ["электроэнергия", "тепловая энергия", "газ", "вода", "водоснабжение"]
          rule: "technical_specifications_required"
          legal_base: "ст. 542 ГК РФ"
          severity: "high"
    
    - element: "price"
      required: true
      legal_base: "ст. 424, 544 ГК РФ"
      description: "Тариф на энергию или порядок его определения"
      validation_rules:
        - "presence_check"
        - "tariff_specified_or_reference"
    
    - element: "metering_procedure"
      required: true
      legal_base: "ст. 544, 13 ФЗ-35 «Об электроэнергетике»"
      description: "Порядок учета потребления энергии с использованием приборов учета"
      validation_rules:
        - "presence_check"
        - "metering_requirements_specified"
      conditional_checks:
        - trigger: "energy_supply_keywords"
          keywords: ["энергоснабжение", "подача энергии", "потребление энергии"]
          rule: "metering_clause_required"
          legal_base: "ст. 544 ГК РФ"
          severity: "critical"

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 3: ЗАЩИТНЫЕ УСЛОВИЯ (PROTECTIVE CLAUSES)
  # ──────────────────────────────────────────────────────────
  protective_clauses:
    
    # --- ЗАЩИТА АБОНЕНТА (Subscriber Protection) ---
    subscriber_protection:
      - clause_id: "energy_quality_requirements"
        name: "Требования к качеству подаваемой энергии"
        risk_if_missing: |
          Без четких требований к качеству энергии (напряжение, частота для электроэнергии,
          температура для тепловой энергии, давление для газа) абонент не сможет доказать
          нарушение условий договора при подаче некачественного ресурса. Это может привести
          к повреждению оборудования и убыткам абонента.
        legal_base: "ст. 542 ГК РФ"
        severity: "high"
        affected_party: "subscriber"
        detection:
          positive_keywords:
            - "качество энергии"
            - "параметры качества"
            - "соответствие ГОСТ"
            - "напряжение"
            - "частота"
            - "температура"
            - "давление"
            - "технические условия"
          context_patterns:
            - '(?i)энергия.*должна.*соответствовать.*требованиям.*качества'
            - '(?i)параметры.*качества.*электроэнергии'
      
      - clause_id: "limitation_procedure"
        name: "Порядок ограничения и прекращения подачи энергии"
        risk_if_missing: |
          Без четкой процедуры ограничения или отключения подачи энергии абонент может быть
          лишен доступа к ресурсу без предупреждения или по необоснованным причинам.
          По ст. 546 ГК РФ ограничение допускается только при неоплате или нарушении
          условий использования, с предварительным уведомлением.
        legal_base: "ст. 546 ГК РФ"
        severity: "critical"
        affected_party: "subscriber"
        detection:
          positive_keywords:
            - "ограничение подачи"
            - "прекращение подачи"
            - "отключение энергии"
            - "предварительное уведомление"
            - "срок для устранения нарушений"
            - "при неоплате"
          context_patterns:
            - '(?i)ограничение.*подачи.*энергии.*допускается.*при.*неоплате'
            - '(?i)предварительное.*уведомление.*об.*отключении'
      
      - clause_id: "liability_for_interruptions"
        name: "Ответственность за перерывы в подаче энергии"
        risk_if_missing: |
          Без условий об ответственности за несанкционированные перерывы в подаче энергии
          абонент не сможет взыскать убытки, вызванные простоями оборудования или
          нарушением технологических процессов. Энергоснабжающая организация может
          уклоняться от компенсации ущерба.
        legal_base: "ст. 547 ГК РФ"
        severity: "medium"
        affected_party: "subscriber"
        detection:
          positive_keywords:
            - "ответственность за перерывы"
            - "возмещение ущерба"
            - "простой оборудования"
            - "несанкционированное отключение"
            - "компенсация убытков"
            - "прерывание подачи"
          context_patterns:
            - '(?i)энергоснабжающая.*организация.*несет.*ответственность.*за.*перерывы'
    
    # --- ЗАЩИТА ЭНЕРГОСНАБЖАЮЩЕЙ ОРГАНИЗАЦИИ (Supplier Protection) ---
    supplier_protection:
      - clause_id: "payment_obligations"
        name: "Обязанность абонента своевременно оплачивать потребленную энергию"
        risk_if_missing: |
          Без четких условий о сроках и порядке оплаты энергоснабжающая организация
          может столкнуться с просрочками платежей, что приводит к кассовым разрывам
          и необходимости судебного взыскания задолженности.
        legal_base: "ст. 544 ГК РФ"
        severity: "high"
        affected_party: "supplier"
        detection:
          positive_keywords:
            - "обязанность оплачивать"
            - "срок оплаты"
            - "ежемесячная оплата"
            - "на основании показаний счетчиков"
            - "расчетный период"
            - "пени за просрочку"
          context_patterns:
            - '(?i)абонент.*обязан.*оплачивать.*потребленную.*энергию.*в.*срок'
      
      - clause_id: "meter_maintenance"
        name: "Обязанность абонента содержать приборы учета"
        risk_if_missing: |
          Без условия об обязанности абонента обеспечивать сохранность, исправность
          и своевременную поверку приборов учета энергоснабжающая организация
          не сможет корректно рассчитывать объем потребления, что ведет к потерям
          и спорам о размере задолженности.
        legal_base: "ст. 544, 13 ФЗ-35 «Об электроэнергетике»"
        severity: "medium"
        affected_party: "supplier"
        detection:
          positive_keywords:
            - "содержание приборов учета"
            - "поверка счетчиков"
            - "исправность приборов учета"
            - "обеспечение доступа к счетчикам"
            - "замена приборов учета"
            - "расчет по нормативу"
          context_patterns:
            - '(?i)абонент.*обязан.*обеспечивать.*исправность.*приборов.*учета'
      
      - clause_id: "unauthorized_consumption"
        name: "Ответственность за бездоговорное и безучетное потребление"
        risk_if_missing: |
          Без условия о последствиях бездоговорного или безучетного потребления энергии
          энергоснабжающая организация не сможет эффективно бороться с хищениями
          энергии и взыскивать убытки в полном объеме.
        legal_base: "ст. 7.19 КоАП РФ, ст. 165 УК РФ"
        severity: "high"
        affected_party: "supplier"
        detection:
          positive_keywords:
            - "бездоговорное потребление"
            - "безучетное потребление"
            - "несанкционированное подключение"
            - "хищение энергии"
            - "взыскание ущерба"
            - "расчет объема потребления"
          context_patterns:
            - '(?i)при.*обнаружении.*бездоговорного.*потребления.*абонент.*обязан'

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 4: ДОПОЛНИТЕЛЬНЫЕ PROTECTIVE CLAUSES
  # ──────────────────────────────────────────────────────────
  additional_protective_clauses:
    
    # Для промышленных потребителей
    subscriber_protection:
      - clause_id: "industrial_consumer_protection"
        name: "Особые условия для промышленных потребителей"
        risk_if_missing: |
          Для промышленных предприятий перерывы в подаче энергии могут привести
          к значительным убыткам. Отсутствие особых условий о гарантиях надежности
          снабжения и компенсации ущерба лишает промышленного потребителя
          адекватной защиты его интересов.
        legal_base: "ст. 547 ГК РФ"
        severity: "high"
        affected_party: "subscriber"
        detection:
          positive_keywords:
            - "промышленный потребитель"
            - "надежность энергоснабжения"
            - "бесперебойная подача"
            - "технологическое присоединение"
            - "резервные источники питания"
            - "убытки от простоя"
          context_patterns:
            - '(?i)для.*промышленных.*потребителей.*гарантируется.*бесперебойная'
        conditional_checks:
          - trigger: "industrial_keywords"
            keywords: ["промышленный", "производство", "предприятие", "завод", "цех"]
            rule: "industrial_consumer_clause_required"
            severity: "medium"
    
    # Для многоквартирных домов
    supplier_protection:
      - clause_id: "mcd_obligations"
        name: "Обязанности по обслуживанию внутридомовых сетей в МКД"
        risk_if_missing: |
          В многоквартирных домах отсутствие четкого разграничения ответственности
          за внутридомовые сети может привести к спорам о том, кто должен устранять
          аварии и нести расходы на содержание общедомового имущества.
        legal_base: "ст. 36, 161 ЖК РФ"
        severity: "medium"
        affected_party: "supplier"
        detection:
          positive_keywords:
            - "многоквартирный дом"
            - "внутридомовые сети"
            - "общедомовые нужды"
            - "ОДН"
            - "обслуживание общедомового имущества"
            - "граница балансовой принадлежности"
          context_patterns:
            - '(?i)в.*многоквартирных.*домах.*обслуживание.*внутридомовых.*сетей'
        conditional_checks:
          - trigger: "mcd_keywords"
            keywords: ["многоквартирный", "МКД", "квартира", "жилой дом", "ТСЖ", "УК"]
            rule: "mcd_specific_clause_recommended"
            severity: "medium"
    
    # Для объектов с особым режимом потребления
    subscriber_protection:
      - clause_id: "special_consumption_regime"
        name: "Условия для объектов с особым режимом потребления"
        risk_if_missing: |
          Для медицинских учреждений, объектов связи, объектов с непрерывным
          технологическим циклом отсутствие особых условий о приоритетном
          восстановлении снабжения может привести к угрозе жизни и здоровью
          людей или значительным экономическим потерям.
        legal_base: "ст. 546, 547 ГК РФ, ФЗ-35 «Об электроэнергетике»"
        severity: "high"
        affected_party: "subscriber"
        detection:
          positive_keywords:
            - "особый режим потребления"
            - "объекты первой категории надежности"
            - "медицинское учреждение"
            - "непрерывный технологический цикл"
            - "приоритетное восстановление"
            - "резервное энергоснабжение"
          context_patterns:
            - '(?i)для.*объектов.*первой.*категории.*надежности.*гарантируется'
        conditional_checks:
          - trigger: "critical_infrastructure_keywords"
            keywords: ["больница", "поликлиника", "родильный дом", "диспетчерская", "связь", "транспорт"]
            rule: "special_regime_clause_required"
            severity: "high"