type: contract_1.12
name: "Соглашение об отступном"
description: |
  Реальная сделка, прекращающая существующее обязательство (полностью или частично) путем предоставления
  кредитору иного исполнения (уплаты денег, передачи имущества, уступки права) взамен первоначального.
  Регулируется ст. 409 ГК РФ. Характеризуется реальным характером: обязательство прекращается с момента
  фактической передачи отступного, а не с момента подписания соглашения. Отличается от новации (замена
  обязательства) и прощения долга (безвозмездное прекращение).
version: 2.0
parent: class_2_modification_of_obligations
sibling_contracts:
  - contract_1.1  # Купля-продажа (если отступное - имущество)
  - contract_1.6  # Купля-продажа недвижимости (если отступное - недвижимость)
  - contract_1.10 # Цессия (если отступное - право требования)
  - contract_2.1  # Новация (альтернативный способ прекращения обязательства)
metadata:
  category: contract
  subcategory: obligation_termination
  complexity: medium-high
  risk_level: high  # Риск оспаривания при банкротстве, налоговые риски, риск несоразмерности
  legal_base: "ст. 409 ГК РФ"
  hierarchy_position: "child_specialized"

# ════════════════════════════════════════════════════════════
# БАЗОВАЯ ИНФОРМАЦИЯ (LEGACY SECTIONS - ОПТИМИЗИРОВАНО)
# ════════════════════════════════════════════════════════════
rules:
  keywords:
    high:
      - "отступно"
      - "прекращен обязательств"
      - "взамен исполнени"
      - "в счет погашения долг"
      - "предоставлени отступног"
      - "реальная сделка"
    medium:
      - "первоначальное обязательство"
      - "передача имущества"
      - "погашение задолженности"
      - "остаток долга"
      - "момент прекращения обязательства"
      - "акт приема-передачи"
    low:
      - "кредитный договор"
      - "расписка"
      - "займ"
      - "денежное обязательство"
      - "имущественное обязательство"
      - "прекращение в полном объеме"
  phrases:
    high:
      - Стороны договорились о прекращении обязательства предоставлением отступного
      - Обязательство прекращается с момента передачи отступного
      - Взамен исполнения обязательств по Договору № ___ от ___
      - Должник предоставляет, а Кредитор принимает отступное
    medium:
      - Первоначальное обязательство возникает из Договора № ___ от ___
      - Стоимость отступного согласована Сторонами в размере ___ рублей
      - Передача отступного оформляется актом приема-передачи
      - После предоставления отступного обязательство считается прекращенным
  patterns:
    required:
      - (?i)(отступн|прекращен.*обязательств.*предоставлени|взамен.*исполнен|в.*счет.*погашен.*долг)  # → contract_1.12
    optional:
      - (?i)(погашени.*долг.*полность|передач.*имуществ.*взамен|акт.*приема.*передач.*отступн)
  exclusions:
    - новация (замена одного обязательства другим по ст. 414 ГК РФ)
    - прощение долга (безвозмездное прекращение по ст. 415 ГК РФ)
    - зачет встречных требований (ст. 410-411 ГК РФ)
    - отступное в будущем (обещание предоставить)
  exclusion_logic:
    - condition: "obligation_replacement_keywords AND new_obligation_created"
      target: "reclassify"
      confidence: 0.85
      description: "Создание нового обязательства вместо прекращения существующего - это новация (ст. 414 ГК РФ)"
    - condition: "gratuitous_termination AND no_consideration"
      target: "reclassify"
      confidence: 0.90
      description: "Безвозмездное прекращение обязательства без встречного предоставления - это прощение долга"
  weights:
    keyword_high: 3.5
    keyword_medium: 1.5
    keyword_low: 0.5
    phrase_high: 4.0
    phrase_medium: 1.5
    pattern_required: 5.0
    pattern_optional: 1.0
  classification:
    min_confidence: 0.85
    max_matches: 1

party_roles:
  - Должник (Debtor) — лицо, предоставляющее отступное в счет прекращения своего обязательства
  - Кредитор (Creditor) — лицо, принимающее отступное и прекращающее требование к должнику

essential_terms:
  - Четкое указание первоначального обязательства (договор, основание, сумма, срок)
  - Предмет отступного (деньги, имущество, право требования) с индивидуализацией
  - Размер и стоимость отступного (полное или частичное прекращение долга)

specific_risks:
  - Оспаривание в процедуре банкротства как сделки с предпочтением (ст. 61.3 ФЗ-127)
  - Налоговые риски (переоценка стоимости отступного для целей НДС/налога на прибыль)
  - Риск признания притворной сделкой (прикрытие дарения или купли-продажи)
  - Непрекращение обязательства при непередаче отступного (реальный характер сделки)
  - Риск несоразмерности отступного (кабальность сделки по ст. 179 ГК РФ)

aliases:
  - Соглашение о предоставлении отступного
  - Соглашение о погашении долга имуществом
  - Отступное
  - Dation in payment
  - Deed in lieu of foreclosure

section_markers:
  - Прекращаемое обязательство (реквизиты, сумма, основания)
  - Предмет отступного (детальное описание передаваемого)
  - Стоимость отступного и объем погашения долга
  - Порядок и сроки передачи отступного
  - Момент прекращения обязательства
  - Переход рисков и расходов
  - Гарантии и заверения сторон
  - Ответственность сторон
  - Заключительные положения (о регистрации для недвижимости)

notes: |
  КРИТИЧЕСКИЕ ОСОБЕННОСТИ СОГЛАШЕНИЯ ОБ ОТСТУПНОМ:
  1. Реальный характер: обязательство прекращается только с момента фактической передачи отступного
  2. До передачи кредитор сохраняет право требовать исполнения первоначального обязательства
  3. Для недвижимости как отступного требуется государственная регистрация перехода права
  4. Риск оспаривания при банкротстве должника в течение 6 месяцев как предпочтительного удовлетворения
  5. Налоговые последствия: стоимость отступного должна быть экономически обоснована
  6. Отличие от новации: отступное прекращает обязательство, новация заменяет его новым

# ════════════════════════════════════════════════════════════
# 🆕 ВАЛИДАЦИОННЫЕ СЕКЦИИ (VALIDATION ENGINE v2.0)
# ════════════════════════════════════════════════════════════

validation_metadata:
  validation_version: "2.0"
  last_updated: "2026-02-06"
  author: "Legal AI Team"
  
  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 1: ПРИМЕНИМОЕ ЗАКОНОДАТЕЛЬСТВО
  # ──────────────────────────────────────────────────────────
  legal_base:
    primary:
      - "ст. 409 ГК РФ (Отступное)"
    secondary:
      - "Постановление Пленума ВАС РФ № 35 от 14.03.2014 (о свободе договора)"
      - "Постановление Пленума ВС РФ № 6 от 11.06.2020 (о прекращении обязательств)"
      - "ст. 431.2 ГК РФ (заверения об обстоятельствах)"
    related:
      - "ФЗ-127 от 26.10.2002 «О несостоятельности (банкротстве)» ст. 61.2, 61.3 (оспоримость сделок)"
      - "Налоговый кодекс РФ ст. 146 (НДС), ст. 249 (доходы), ст. 268 (расходы)"
      - "ФЗ-218 от 13.07.2015 «О государственной регистрации недвижимости»"
      - "ст. 179 ГК РФ (недействительность кабальной сделки)"
      - "ст. 414 ГК РФ (новация - для отличия)"

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 2: ОБЯЗАТЕЛЬНЫЕ ЭЛЕМЕНТЫ ДОГОВОРА
  # ──────────────────────────────────────────────────────────
  essential_elements:
    - element: "original_obligation_identification"
      name: "Идентификация прекращаемого обязательства"
      required: true
      legal_base: "ст. 409 ГК РФ"
      description: |
        Должно быть четко указано, какое именно обязательство прекращается: реквизиты договора
        (номер, дата), сумма основного долга, неустойки, проценты, срок исполнения.
        Неопределенность в описании первоначального обязательства может привести к спорам
        о том, какой именно долг погашен.
      validation_rules:
        - "obligation_details_specified"
        - "debt_amount_clear"
      conditional_checks:
        - trigger: "set_off_keywords"
          keywords: ["отступное", "прекращение обязательства", "взамен исполнения"]
          rule: "obligation_specificity_required"
          legal_base: "ст. 432 ГК РФ"
          severity: "critical"
          risk_msg: "Неопределенность первоначального обязательства может сделать соглашение незаключенным"
    
    - element: "set_off_subject_description"
      name: "Описание предмета отступного"
      required: true
      legal_base: "ст. 409 ГК РФ"
      description: |
        Предмет отступного должен быть индивидуализирован: для денег - сумма и валюта,
        для имущества - индивидуальные признаки, для прав - содержание и основания.
        Неопределенность предмета делает невозможным реальное исполнение.
      validation_rules:
        - "set_off_subject_specified"
        - "subject_identifiable"
      conditional_checks:
        - trigger: "property_as_set_off"
          keywords: ["имущество", "оборудование", "товар", "автомобиль", "ценные бумаги"]
          rule: "property_specification_required"
          severity: "critical"
          validation_rules:
            - "property_details_specific"
            - "identification_parameters"
        
        - trigger: "real_estate_as_set_off"
          keywords: ["квартира", "земельный участок", "недвижимость", "здание", "помещение"]
          rule: "real_estate_specification_required"
          legal_base: "ст. 554 ГК РФ"
          severity: "critical"
          validation_rules:
            - "cadastral_number_specified"
            - "address_specified"
    
    - element: "termination_scope_and_value"
      name: "Объем прекращения и стоимость отступного"
      required: true
      legal_base: "ст. 409 ГК РФ, Постановление Пленума ВС РФ № 6"
      description: |
        Должно быть четко указано, прекращается ли обязательство полностью или частично,
        какая сумма долга погашается, покрываются ли проценты и неустойки.
        Стоимость отступного должна быть указана для налоговых целей и во избежание
        признания кабальной сделкой.
      validation_rules:
        - "termination_scope_specified"
        - "set_off_value_specified"
      conditional_checks:
        - trigger: "partial_settlement_indicated"
          keywords: ["частично", "в размере", "остаток долга", "неполное погашение"]
          rule: "remaining_debt_clarity_required"
          severity: "high"
          risk_msg: "При частичном прекращении неясность в размере остатка долга ведет к спорам"

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 3: ЗАЩИТНЫЕ УСЛОВИЯ (PROTECTIVE CLAUSES)
  # ──────────────────────────────────────────────────────────
  protective_clauses:
    
    # --- ЗАЩИТА ДОЛЖНИКА (Debtor Protection) ---
    seller_protection:
      - clause_id: "full_and_final_settlement"
        name: "Полное и окончательное прекращение обязательств"
        risk_if_missing: |
          Если стоимость отступного меньше суммы первоначального долга и не указано,
          что обязательство прекращается полностью, кредитор сохраняет право требовать
          остаток. Должник рискует заплатить дважды: передачей отступного и доплатой
          разницы. Особенно критично при передаче имущества, стоимость которого
          оценена ниже номинала долга.
        legal_base: "ст. 409 ГК РФ, принцип свободы договора"
        severity: "critical"
        affected_party: "seller"
        detection:
          positive_keywords:
            - "прекращается полностью"
            - "в полном объеме"
            - "стороны не имеют претензий"
            - "долг считается погашенным"
            - "обязательство считается исполненным"
            - "прекращаются все обязательства"
            - "отсутствуют дополнительные требования"
            - "претензии сторон удовлетворены"
            - "окончательное прекращение"
            - "без права на предъявление дальнейших требований"
          context_patterns:
            - '(?i)обязательство.*прекращается.*в.*полном.*объеме.*независимо.*от.*стоимости.*отступного'
            - '(?i)после.*передачи.*отступного.*стороны.*не.*имеют.*друг.*к.*другу.*претензий'
      
      - clause_id: "agreed_valuation_and_tax_clarity"
        name: "Согласованная оценка отступного и налоговые последствия"
        risk_if_missing: |
          Без согласованной стоимости отступного возникают налоговые риски: налоговые органы
          могут доначислить налоги исходя из рыночной стоимости. Также может возникнуть риск
          признания сделки дарением при значительной разнице между стоимостью отступного
          и суммой долга. Должнику важно зафиксировать согласованную оценку.
        legal_base: "НК РФ ст. 40, 105.3"
        severity: "high"
        affected_party: "seller"
        detection:
          positive_keywords:
            - "стоимость отступного согласована"
            - "оценивается сторонами в размере"
            - "рыночная стоимость определена"
            - "налоговые последствия определены"
            - "стоимость для целей налогообложения"
            - "не является дарением"
            - "экономическая обоснованность"
            - "согласованная цена"
            - "отсутствие скрытого дарения"
          context_patterns:
            - '(?i)стороны.*согласовали.*стоимость.*отступного.*в.*размере.*\\d+.*рублей'
            - '(?i)стоимость.*определена.*по.*соглашению.*сторон.*и.*является.*окончательной'
      
      - clause_id: "protection_against_recharacterization"
        name: "Защита от переквалификации в иную сделку"
        risk_if_missing: |
          Соглашение об отступном может быть переквалифицировано в куплю-продажу, дарение
          или новацию, особенно если отсутствует четкая ссылка на прекращение конкретного
          обязательства. Это влечет иные налоговые и правовые последствия, невыгодные должнику.
        legal_base: "ст. 170, 414, 572 ГК РФ"
        severity: "medium"
        affected_party: "seller"
        detection:
          positive_keywords:
            - "не является куплей-продажей"
            - "не является дарением"
            - "не является новацией"
            - "цель - прекращение обязательства"
            - "основание прекращения - ст. 409 ГК РФ"
            - "отличие от иных сделок"
            - "характер сделки - отступное"
          context_patterns:
            - '(?i)настоящее.*соглашение.*не.*является.*договором.*купли.*продажи.*дарения.*или.*новации'

    # --- ЗАЩИТА КРЕДИТОРА (Creditor Protection) ---
    buyer_protection:
      - clause_id: "termination_moment_upon_transfer"
        name: "Момент прекращения обязательства при фактической передаче"
        risk_if_missing: |
          По умолчанию обязательство прекращается с момента фактической передачи отступного
          (п. 1 ст. 409 ГК РФ). Если соглашение указывает иной момент (например, подписание),
          кредитор рискует: обязательство прекратится, а отступное не будет передано.
          Особенно критично при передаче недвижимости, требующей регистрации.
        legal_base: "п. 1 ст. 409 ГК РФ"
        severity: "critical"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "с момента передачи отступного"
            - "с момента фактической передачи"
            - "после подписания акта приема-передачи"
            - "с момента государственной регистрации права"
            - "после зачисления денежных средств"
            - "при условии фактического получения"
            - "обязательство прекращается по исполнении"
          negative_keywords:
            - "с момента подписания настоящего соглашения"
            - "с даты заключения договора"
          context_patterns:
            - '(?i)обязательство.*прекращается.*с.*момента.*фактической.*передачи.*отступного'
            - '(?i)право.*требования.*сохраняется.*до.*момента.*полного.*получения.*отступного'
      
      - clause_id: "warranties_for_set_off_subject"
        name: "Гарантии в отношении предмета отступного"
        risk_if_missing: |
          Кредитор принимает отступное вынужденно (вместо денег). Если имущество окажется
          обремененным (залог, арест), низкокачественным или с пороками права, кредитор
          получит неэквивалентную замену. Без гарантий невозможно взыскать убытки.
        legal_base: "ст. 460, 469, 475 ГК РФ"
        severity: "high"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "свободно от прав третьих лиц"
            - "не заложено"
            - "не арестовано"
            - "надлежащее качество"
            - "отсутствие скрытых недостатков"
            - "право собственности принадлежит"
            - "не обременено сервитутами"
            - "годно к использованию"
            - "соответствует назначению"
            - "гарантии продавца"
          context_patterns:
            - '(?i)должник.*гарантирует.*что.*отступное.*не.*обременено.*правами.*третьих.*лиц'
            - '(?i)имущество.*является.*годным.*для.*использования.*и.*соответствует.*установленным.*требованиям'

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 4: ДОПОЛНИТЕЛЬНЫЕ PROTECTIVE CLAUSES
  # ──────────────────────────────────────────────────────────
  additional_protective_clauses:
    
    # Банкротный риск для кредитора
    buyer_protection:
      - clause_id: "bankruptcy_preference_risk_mitigation"
        name: "Минимизация риска оспаривания при банкротстве"
        risk_if_missing: |
          Если должник станет банкротом в течение 6 месяцев (1 год для аффилированных лиц)
          после предоставления отступного, сделка может быть оспорена как предоставление
          предпочтения (ст. 61.3 ФЗ-127). Кредитор вернет отступное в конкурсную массу,
          а его требование восстановится как необеспеченное.
        legal_base: "ст. 61.2, 61.3 ФЗ-127 «О несостоятельности (банкротстве)»"
        severity: "critical"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "отсутствие признаков банкротства"
            - "должник является платежеспособным"
            - "не находится в процедуре банкротства"
            - "сделка не нарушает права кредиторов"
            - "не является сделкой с предпочтением"
            - "финансовая устойчивость должника"
            - "отсутствие оснований для оспаривания"
            - "соразмерность отступного"
          context_patterns:
            - '(?i)должник.*подтверждает.*отсутствие.*признаков.*несостоятельности.*банкротства'
            - '(?i)сделка.*не.*может.*быть.*оспорена.*в.*рамках.*процедуры.*банкротства'
    
    # Условия для недвижимости как отступного
    buyer_protection:
      - clause_id: "real_estate_set_off_specifics"
        name: "Специальные условия для недвижимости как отступного"
        risk_if_missing: |
          При передаче недвижимости в качестве отступного требуется государственная
          регистрация перехода права в ЕГРН. Без условий о порядке регистрации,
          распределении расходов и сроках кредитор может не получить право собственности,
          но обязательство уже прекратится.
        legal_base: "ст. 131 ГК РФ, ФЗ-218 «О государственной регистрации недвижимости»"
        severity: "critical"
        affected_party: "both"
        detection:
          positive_keywords:
            - "государственная регистрация перехода права"
            - "внесение записи в ЕГРН"
            - "расходы на регистрацию"
            - "обязанность подать документы на регистрацию"
            - "срок для регистрации"
            - "переход права после регистрации"
            - "документы для регистрации"
            - "нотариальное удостоверение (если требуется)"
          context_patterns:
            - '(?i)переход.*права.*собственности.*на.*недвижимость.*подлежит.*государственной.*регистрации'
            - '(?i)должник.*обязуется.*совершить.*действия.*для.*регистрации.*перехода.*права'
        conditional_checks:
          - trigger: "real_estate_subject"
            keywords: ["квартира", "земельный участок", "недвижимость", "здание", "помещение"]
            rule: "registration_clauses_required"
            severity: "critical"
    
    # Возврат отступного при недействительности
    buyer_protection:
      - clause_id: "return_of_set_off_on_invalidity"
        name: "Возврат отступного при недействительности первоначального обязательства"
        risk_if_missing: |
          Если первоначальное обязательство окажется недействительным (никогда не существовало
          или прекратилось ранее), отступное было предоставлено без основания. Без условия
          о возврате кредитор может оказаться обязанным вернуть полученное по неосновательному
          обогащению, но уже после распоряжения им.
        legal_base: "ст. 1102, 1104 ГК РФ (неосновательное обогащение)"
        severity: "high"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "возврат отступного"
            - "при недействительности обязательства"
            - "обязанность вернуть полученное"
            - "неосновательное обогащение"
            - "прекращение обязательства не состоялось"
            - "реституция"
            - "возмещение стоимости"
            - "срок возврата"
          context_patterns:
            - '(?i)в.*случае.*недействительности.*первоначального.*обязательства.*отступное.*подлежит.*возврату'
            - '(?i)если.*обязательство.*прекратилось.*до.*предоставления.*отступного.*стороны.*осуществляют.*возврат'
    
    # Распределение рисков до передачи
    buyer_protection:
      - clause_id: "risk_allocation_before_transfer"
        name: "Распределение рисков до момента передачи отступного"
        risk_if_missing: |
          В период между подписанием соглашения и фактической передачей отступного
          возможна гибель или повреждение имущества. Без четкого распределения рисков
          возникают споры о том, кто несет убытки и продолжает ли существовать первоначальное
          обязательство.
        legal_base: "ст. 211, 459 ГК РФ (переход риска)"
        severity: "medium"
        affected_party: "both"
        detection:
          positive_keywords:
            - "риск случайной гибели"
            - "риск повреждения"
            - "несет должник до передачи"
            - "ответственность за сохранность"
            - "страхование отступного"
            - "обязанность возместить убытки"
            - "переход риска с момента передачи"
            - "сохранение обязательства при гибели"
          context_patterns:
            - '(?i)риск.*случайной.*гибели.*отступного.*несет.*должник.*до.*момента.*его.*передачи'
            - '(?i)в.*случае.*гибели.*отступного.*до.*передачи.*первоначальное.*обязательство.*не.*прекращается'
    
    # Налоговые обязательства сторон
    buyer_protection:
      - clause_id: "tax_liabilities_and_reporting"
        name: "Распределение налоговых обязательств и отчетности"
        risk_if_missing: |
          Предоставление отступного имеет налоговые последствия: у кредитора возникает доход
          (стоимость отступного), у должника - расход (стоимость переданного имущества).
          Неясность в распределении налоговых обязательств ведет к рискам доначислений.
        legal_base: "НК РФ ст. 41 (доход), ст. 252 (расходы), ст. 146 (НДС)"
        severity: "high"
        affected_party: "both"
        detection:
          positive_keywords:
            - "налоговые обязательства"
            - "НДС при передаче имущества"
            - "доход кредитора"
            - "расход должника"
            - "налоговая отчетность"
            - "стороны несут налоговые обязательства самостоятельно"
            - "стоимость для целей налогообложения"
            - "первичные документы"
            - "акт приема-передачи для налогов"
          context_patterns:
            - '(?i)каждая.*из.*сторон.*несет.*ответственность.*за.*свои.*налоговые.*обязательства'
            - '(?i)стоимость.*отступного.*для.*целей.*налогообложения.*признается.*равной.*согласованной.*стоимости'

