validation_metadata:
  validation_version: "2.0"
  last_updated: "2026-02-06"
  author: "Legal AI Team"
  
  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 1: ПРИМЕНИМОЕ ЗАКОНОДАТЕЛЬСТВО
  # ──────────────────────────────────────────────────────────
  legal_base:
    primary:
      - "§ 8 Главы 30 ГК РФ (ст. 559-566)"
    secondary:
      - "ст. 560 ГК РФ (государственная регистрация договора)"
      - "ст. 561 ГК РФ (документы о составе предприятия)"
      - "ст. 562 ГК РФ (права кредиторов при продаже предприятия)"
      - "ст. 565 ГК РФ (ответственность продавца и покупателя)"
    related:
      - "ФЗ-218 от 13.07.2015 «О государственной регистрации недвижимости»"
      - "Трудовой кодекс РФ ст. 75 (трудовые отношения при смене собственника)"
      - "Налоговый кодекс РФ ст. 146 (НДС при продаже предприятия), ст. 268 (учет расходов)"
      - "ФЗ-127 от 26.10.2002 «О несостоятельности (банкротстве)» ст. 61.3 (оспоримость сделок)"
      - "ФЗ-135 от 26.07.2006 «О защите конкуренции» (согласие ФАС для крупных сделок)"
      - "ФЗ-129 от 08.08.2001 «О государственной регистрации юридических лиц» (для реорганизации)"

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 2: ОБЯЗАТЕЛЬНЫЕ ЭЛЕМЕНТЫ ДОГОВОРА
  # ──────────────────────────────────────────────────────────
  essential_elements:
    - element: "enterprise_composition_documents"
      name: "Документы, определяющие состав предприятия"
      required: true
      legal_base: "ст. 561 ГК РФ"
      description: |
        Договор продажи предприятия должен содержать или иметь в качестве приложений:
        1) акт инвентаризации,
        2) бухгалтерский баланс,
        3) заключение независимого аудитора о составе и стоимости предприятия,
        4) перечень всех долгов (обязательств), включаемых в состав предприятия, с указанием кредиторов.
        Отсутствие этих документов делает договор незаключенным.
      validation_rules:
        - "inventory_act_present"
        - "balance_sheet_present"
        - "auditor_report_present"
        - "debt_list_present"
      conditional_checks:
        - trigger: "enterprise_sale_keywords"
          keywords: ["предприятие", "имущественный комплекс", "продажа предприятия"]
          rule: "mandatory_attachments_required"
          legal_base: "ст. 561 ГК РФ"
          severity: "critical"
          risk_msg: "Отсутствие обязательных приложений (инвентаризации, баланса, заключения аудитора, перечня долгов) делает договор незаключенным"
    
    - element: "state_registration_requirement"
      name: "Условие о государственной регистрации договора"
      required: true
      legal_base: "ст. 560 ГК РФ"
      description: |
        Договор продажи предприятия подлежит государственной регистрации и считается заключенным
        с момента такой регистрации. Без государственной регистрации договор не влечет правовых последствий.
        Должен содержать явное указание на необходимость регистрации в Росреестре.
      validation_rules:
        - "registration_clause_present"
        - "registration_authority_specified"
      conditional_checks:
        - trigger: "enterprise_as_real_estate"
          rule: "state_registration_clause_required"
          legal_base: "ст. 560 ГК РФ"
          severity: "critical"
          risk_msg: "Без государственной регистрации договор продажи предприятия считается незаключенным"
    
    - element: "enterprise_price_specification"
      name: "Цена предприятия как имущественного комплекса"
      required: true
      legal_base: "ст. 555 ГК РФ"
      description: |
        Цена предприятия является существенным условием договора. Должна быть определена
        с учетом всех активов и пассивов предприятия. Может отличаться от балансовой стоимости.
        Важно указать распределение цены между отдельными видами имущества для налоговых целей.
      validation_rules:
        - "price_specified"
        - "payment_terms_specified"
      conditional_checks:
        - trigger: "enterprise_valuation_context"
          keywords: ["оценка предприятия", "стоимость активов", "балансовая стоимость"]
          rule: "price_allocation_recommended"
          severity: "high"
          validation_rules:
            - "price_allocation_by_assets"

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 3: ЗАЩИТНЫЕ УСЛОВИЯ (PROTECTIVE CLAUSES)
  # ──────────────────────────────────────────────────────────
  protective_clauses:
    
    # --- ЗАЩИТА ПОКУПАТЕЛЯ (Buyer Protection) ---
    buyer_protection:
      - clause_id: "creditor_notification_procedure"
        name: "Порядок уведомления кредиторов предприятия"
        risk_if_missing: |
          Кредиторы предприятия должны быть письменно уведомлены о его продаже до передачи предприятия
          покупателю (ст. 562 ГК РФ). При неуведомлении кредитор вправе в течение 3 месяцев потребовать:
          1) прекращения обязательства и возмещения убытков, либо
          2) признания договора продажи предприятия недействительным полностью или частично.
          Покупатель несет солидарную ответственность по долгам при неуведомлении кредиторов.
        legal_base: "ст. 562 ГК РФ"
        severity: "critical"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "уведомление кредиторов"
            - "письменное уведомление кредиторов"
            - "реестр кредиторов предприятия"
            - "согласие кредитора на перевод долга"
            - "обязанность уведомить до передачи"
            - "срок для уведомления кредиторов"
            - "способ уведомления кредиторов"
            - "ответственность за неуведомление"
            - "права кредиторов при продаже предприятия"
            - "трехмесячный срок для предъявления требований"
          context_patterns:
            - '(?i)продавец.*обязан.*уведомить.*кредиторов.*о.*продаже.*предприятия.*в.*письменной.*форме'
            - '(?i)кредиторы.*вправе.*в.*течение.*трех.*месяцев.*потребовать.*прекращения.*обязательств'
      
      - clause_id: "completeness_of_debt_disclosure"
        name: "Полнота раскрытия долгов и обязательств"
        risk_if_missing: |
          Покупатель принимает на себя только те долги, которые включены в перечень, прилагаемый к договору.
          Без гарантии продавца об отсутствии иных (скрытых) обязательств покупатель рискует получить
          предприятие с неучтенными долгами, по которым будет нести ответственность вместе с продавцом.
        legal_base: "ст. 565 ГК РФ"
        severity: "critical"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "перечень всех обязательств"
            - "отсутствие иных долгов"
            - "гарантия полноты перечня"
            - "скрытые обязательства"
            - "ответственность за нераскрытые долги"
            - "реестр кредиторов является полным"
            - "продавец гарантирует отсутствие"
            - "обязательства, не включенные в перечень"
            - "возмещение убытков по нераскрытым долгам"
            - "индемнификация по скрытым обязательствам"
          context_patterns:
            - '(?i)продавец.*гарантирует.*что.*перечень.*обязательств.*является.*полным.*и.*исчерпывающим'
            - '(?i)все.*долги.*и.*обязательства.*предприятия.*включены.*в.*прилагаемый.*перечень'
      
      - clause_id: "transfer_of_intellectual_property_rights"
        name: "Переход исключительных прав и средств индивидуализации"
        risk_if_missing: |
          В состав предприятия входят права на средства индивидуализации (товарные знаки, коммерческие обозначения)
          и другие исключительные права. Без явного указания на их переход эти права могут остаться у продавца,
          что лишает покупатель возможности использовать бренд и ноу-хау предприятия.
        legal_base: "ст. 559 п. 2 ГК РФ, ст. 1480, 1539 ГК РФ"
        severity: "high"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "коммерческое обозначение"
            - "товарный знак"
            - "исключительные права"
            - "средства индивидуализации"
            - "ноу-хау"
            - "переход прав на фирменное наименование"
            - "права на секреты производства"
            - "лицензионные соглашения"
            - "доменные имена"
            - "авторские права"
          context_patterns:
            - '(?i)в.*состав.*предприятия.*включаются.*права.*на.*средства.*индивидуализации'
            - '(?i)исключительные.*права.*на.*объекты.*интеллектуальной.*собственности.*переходят.*к.*покупателю'

    # --- ЗАЩИТА ПРОДАВЦА (Seller Protection) ---
    seller_protection:
      - clause_id: "limitation_of_liability_for_hidden_defects"
        name: "Ограничение ответственности за скрытые недостатки"
        risk_if_missing: |
          Предприятие передается в том состоянии, в котором оно находится на момент передачи.
          Без ограничения ответственности продавец может нести неограниченную ответственность
          за любые скрытые недостатки активов, которые невозможно было обнаружить при инвентаризации.
          Особенно рискованно для старых производственных предприятий.
        legal_base: "ст. 460, 475, 565 ГК РФ"
        severity: "high"
        affected_party: "seller"
        detection:
          positive_keywords:
            - "предприятие передается как есть"
            - "покупатель принял на себя риск недостатков"
            - "ограничение ответственности за скрытые дефекты"
            - "срок для заявления претензий по качеству"
            - "ответственность только за явные недостатки"
            - "исключение косвенных убытков"
            - "порог существенности для претензий"
            - "покупатель провел due diligence"
            - "осмотр предприятия перед покупкой"
          context_patterns:
            - '(?i)покупатель.*принимает.*предприятие.*в.*том.*состоянии.*в.*котором.*оно.*находится'
            - '(?i)ответственность.*продавца.*за.*скрытые.*недостатки.*ограничивается.*суммой.*договора'
      
      - clause_id: "protection_against_creditor_claims"
        name: "Защита от требований кредиторов по непереведенным долгам"
        risk_if_missing: |
          При наличии долгов, не включенных в перечень, но перешедших к покупателю в силу закона
          (например, текущие налоговые обязательства), продавец может оказаться солидарно ответственным.
          Важно предусмотреть механизм индемнификации покупателем продавца по таким требованиям.
        legal_base: "ст. 562, 565 ГК РФ"
        severity: "high"
        affected_party: "seller"
        detection:
          positive_keywords:
            - "индемнификация по требованиям кредиторов"
            - "возмещение убытков продавцу"
            - "ответственность покупателя за перешедшие долги"
            - "право регресса к покупателю"
            - "солидарная ответственность с регрессом"
            - "обязанность покупателя урегулировать требования"
            - "освобождение продавца от ответственности"
            - "покупатель принимает на себя все риски"
          context_patterns:
            - '(?i)покупатель.*обязуется.*возместить.*продавцу.*все.*убытки.*связанные.*с.*требованиями.*кредиторов'
            - '(?i)по.*долгам.*перешедшим.*к.*покупателю.*последний.*несет.*ответственность.*перед.*продавцом'

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 4: ДОПОЛНИТЕЛЬНЫЕ PROTECTIVE CLAUSES
  # ──────────────────────────────────────────────────────────
  additional_protective_clauses:
    
    # Трудовые отношения при смене собственника
    buyer_protection:
      - clause_id: "labor_relations_transition"
        name: "Переход трудовых отношений при смене собственника"
        risk_if_missing: |
          При продаже предприятия трудовые отношения с работниками сохраняются (ст. 75 ТК РФ).
          Новый собственник обязан сохранять условия трудовых договоров. Отсутствие условий
          о порядке перехода трудовых отношений создает риски трудовых споров и исков о восстановлении.
        legal_base: "ст. 75 Трудового кодекса РФ"
        severity: "high"
        affected_party: "both"
        detection:
          positive_keywords:
            - "трудовые отношения"
            - "переход прав и обязанностей работодателя"
            - "сохранение условий трудовых договоров"
            - "реестр работников предприятия"
            - "трудовые книжки"
            - "обязанность уведомить работников"
            - "согласие работников на продолжение работы"
            - "гарантии для работников"
            - "коллективный договор"
            - "ответственность за трудовые споры"
          context_patterns:
            - '(?i)трудовые.*отношения.*с.*работниками.*предприятия.*сохраняются.*в.*соответствии.*со.*ст.*75.*ТК.*РФ'
            - '(?i)покупатель.*принимает.*на.*себя.*все.*права.*и.*обязанности.*работодателя'
    
    # Налоговые последствия сделки
    buyer_protection:
      - clause_id: "tax_implications_and_liabilities"
        name: "Налоговые последствия и обязательства"
        risk_if_missing: |
          Продажа предприятия имеет сложные налоговые последствия: НДС при продаже, налог на прибыль,
          вопросы восстановления НДС по приобретенным активам. Также переходят налоговые обязательства
          предприятия. Неучет налоговых аспектов ведет к доначислениям и штрафам.
        legal_base: "Налоговый кодекс РФ ст. 146, 167, 268, 346.16"
        severity: "critical"
        affected_party: "both"
        detection:
          positive_keywords:
            - "налоговые обязательства предприятия"
            - "НДС при продаже предприятия"
            - "налоговые последствия сделки"
            - "распределение налоговых рисков"
            - "налоговые проверки"
            - "обязанность по уплате налогов"
            - "восстановление НДС"
            - "стоимость для целей налогообложения"
            - "налоговый due diligence"
            - "индемнификация по налоговым претензиям"
          context_patterns:
            - '(?i)стороны.*определили.*следующий.*порядок.*распределения.*налоговых.*обязательств'
            - '(?i)продавец.*несет.*ответственность.*за.*налоговые.*обязательства.*возникшие.*до.*передачи'
    
    # Due diligence и заверения
    buyer_protection:
      - clause_id: "due_diligence_and_representations"
        name: "Проведение Due Diligence и заверения продавца"
        risk_if_missing: |
          Продажа предприятия требует всесторонней проверки (юридической, финансовой, налоговой).
          Без условий о проведении Due Diligence и соответствующих заверений продавца покупатель
          принимает на себя все риски, включая скрытые обязательства, судебные споры, экологические проблемы.
        legal_base: "ст. 431.2 ГК РФ"
        severity: "critical"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "due diligence"
            - "проверка предприятия"
            - "заверения и гарантии продавца"
            - "раскрытие информации"
            - "виртуальная комната данных"
            - "отсутствие судебных споров"
            - "экологические обязательства"
            - "разрешительная документация"
            - "финансовая отчетность"
            - "обязательства по ст. 431.2 ГК РФ"
          context_patterns:
            - '(?i)продавец.*предоставляет.*покупателю.*возможность.*проведения.*всесторонней.*проверки'
            - '(?i)продавец.*заверяет.*что.*предприятие.*не.*имеет.*скрытых.*обязательств.*и.*судебных.*споров'
    
    # Антимонопольное регулирование
    buyer_protection:
      - clause_id: "antimonopoly_clearance_requirements"
        name: "Требования антимонопольного регулирования"
        risk_if_missing: |
          Крупные сделки по продаже предприятия могут требовать предварительного согласия
          антимонопольного органа (ФАС России). Неполучение согласия при необходимости
          влечет недействительность сделки и административную ответственность.
        legal_base: "ФЗ-135 от 26.07.2006 «О защите конкуренции» ст. 27-32"
        severity: "critical"
        affected_party: "both"
        detection:
          positive_keywords:
            - "согласие антимонопольного органа"
            - "предварительное согласие ФАС"
            - "уведомление ФАС России"
            - "контроль за экономической концентрацией"
            - "требуется согласие на концентрацию"
            - "обязанность уведомить ФАС"
            - "сделка не требует согласия ФАС"
            - "пороговые значения для уведомления"
            - "ответственность за нарушение антимонопольного законодательства"
          context_patterns:
            - '(?i)сделка.*подлежит.*согласованию.*с.*Федеральной.*антимонопольной.*службой'
            - '(?i)стороны.*обязуются.*получить.*предварительное.*согласие.*ФАС.*России'
        conditional_checks:
          - trigger: "large_enterprise_sale"
            rule: "antitrust_clearance_check_required"
            severity: "critical"
    
    # Закрытие сделки и передаточный акт
    buyer_protection:
      - clause_id: "closing_and_transfer_act_procedures"
        name: "Процедура закрытия сделки и передаточного акта"
        risk_if_missing: |
          Передача предприятия оформляется передаточным актом, который подписывается обеими сторонами.
          Без детальной процедуры закрытия (closing) и четких требований к передаточному акту
          возможны споры о моменте перехода права и составе переданного имущества.
        legal_base: "ст. 563 ГК РФ"
        severity: "high"
        affected_party: "both"
        detection:
          positive_keywords:
            - "передаточный акт"
            - "процедура закрытия сделки"
            - "момент перехода права собственности"
            - "подписание передаточного акта"
            - "условия precedent для закрытия"
            - "передача ключей и документации"
            - "физический доступ к предприятию"
            - "дата закрытия сделки"
            - "акт приема-передачи предприятия"
            - "переход рисков с момента подписания акта"
          context_patterns:
            - '(?i)передача.*предприятия.*оформляется.*передаточным.*актом.*подписываемым.*сторонами'
            - '(?i)право.*собственности.*на.*предприятие.*переходит.*с.*момента.*подписания.*передаточного.*акта'
