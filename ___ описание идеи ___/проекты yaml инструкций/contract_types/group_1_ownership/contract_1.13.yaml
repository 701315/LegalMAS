type: contract_1.13
name: "Договор продажи предприятия"
description: |
  Сделка по продаже предприятия в целом как имущественного комплекса, включающего все виды имущества,
  предназначенные для осуществления предпринимательской деятельности: недвижимость, оборудование,
  сырье, продукцию, права требования, долги, права на средства индивидуализации, другие исключительные права.
  Самый сложный вид купли-продажи, характеризующийся обязательной государственной регистрацией,
  специальными процедурами уведомления кредиторов и солидарной ответственностью сторон по не переведенным долгам.
  Регулируется § 8 Главы 30 ГК РФ.
version: 2.0
parent: class_1_transfer_of_ownership
sibling_contracts:
  - contract_1.6  # Продажа недвижимости (элемент предприятия)
  - contract_1.11 # Продажа корпоративных прав (альтернатива - share deal)
  - contract_1.12 # Отступное (может включать предприятие)
metadata:
  category: contract
  subcategory: ownership_transfer
  complexity: critical
  risk_level: critical
  legal_base: "§ 8 Главы 30 ГК РФ (ст. 559-566)"
  hierarchy_position: "child_specialized"

# ════════════════════════════════════════════════════════════
# БАЗОВАЯ ИНФОРМАЦИЯ (LEGACY SECTIONS - ОПТИМИЗИРОВАНО)
# ════════════════════════════════════════════════════════════
rules:
  keywords:
    high:
      - "продаж предприяти"
      - "имущественн комплекс"
      - "состав предприяти"
      - "акт инвентаризации"
      - "государственн регистрац предприят"
      - "уведомление кредиторов"
    medium:
      - "заключение независимого аудитора"
      - "бухгалтерский баланс"
      - "права требования в составе предприятия"
      - "исключительные права"
      - "средства индивидуализации"
      - "солидарная ответственность"
      - "передача предприятия по акту"
    low:
      - "коммерческое обозначение"
      - "товарный знак"
      - "гудвилл деловая репутация"
      - "ноу-хау"
      - "клиентская база"
      - "имущественный комплекс как недвижимость"
      - "реестр кредиторов"
  phrases:
    high:
      - Продавец обязуется передать предприятие в целом как имущественный комплекс
      - Состав предприятия определяется на основе акта инвентаризации
      - Перевод долгов, включенных в состав предприятия
      - Договор подлежит государственной регистрации и считается заключенным с момента регистрации
      - Стороны несут солидарную ответственность перед кредиторами по обязательствам, не переведенным на покупателя
    medium:
      - Передача предприятия оформляется передаточным актом, подписываемым сторонами
      - Покупатель принимает предприятие с учетом его действительного состояния на момент передачи
      - Стоимость предприятия определяется на основе заключения независимого оценщика
      - Кредиторы предприятия должны быть письменно уведомлены о продаже
      - Состав предприятия включает все активы и пассивы, необходимые для его деятельности
  patterns:
    required:
      - (?i)(продаж.*предприяти|предприяти.*как.*имущественн.*комплекс|имущественн.*комплекс.*предприяти|состав.*предприяти|инвентариз.*предприяти)  # → contract_1.13
    optional:
      - (?i)(акт.*инвентаризаци.*предприяти|баланс.*предприяти|аудитор.*предприяти|передаточн.*акт.*предприяти)
  exclusions:
    - продажа 100% долей/акций компании (contract_1.11 - корпоративная сделка)
    - продажа отдельных активов компании (contract_1.1, contract_1.6)
    - аренда предприятия (contract_2.7)
  exclusion_logic:
    - condition: "share_transfer_keywords AND corporate_entity_mentioned"
      target: "reclassify"
      confidence: 0.90
      description: "Продажа долей/акций юридического лица - это корпоративная сделка (contract_1.11), а не продажа имущественного комплекса"
    - condition: "individual_assets_sale AND no_complex_transfer"
      target: "rejection"
      confidence: 0.85
      description: "Продажа отдельных активов без передачи предприятия как целого - это обычная купля-продажа"
  weights:
    keyword_high: 3.5
    keyword_medium: 1.5
    keyword_low: 0.5
    phrase_high: 4.0
    phrase_medium: 1.5
    pattern_required: 5.0
    pattern_optional: 1.0
  classification:
    min_confidence: 0.90
    max_matches: 1

party_roles:
  - Продавец (Seller) — собственник предприятия как имущественного комплекса
  - Покупатель (Buyer) — приобретатель предприятия (только индивидуальный предприниматель или коммерческая организация)

essential_terms:
  - Состав предприятия, определенный на основе акта инвентаризации (ст. 561 ГК РФ)
  - Цена предприятия как имущественного комплекса (существенное условие по ст. 555 ГК РФ)
  - Перечень включаемых в состав предприятия долгов (обязательств) с указанием кредиторов

specific_risks:
  - Солидарная ответственность продавца и покупателя по долгам, не переведенным на покупателя (ст. 562 ГК РФ)
  - Недействительность договора при отсутствии государственной регистрации (ст. 560 ГК РФ)
  - Недействительность перевода долгов без согласия кредиторов (ст. 391, 562 ГК РФ)
  - Трудовые споры при смене собственника имущества (ст. 75 ТК РФ)
  - Налоговые риски (НДС при продаже предприятия как имущественного комплекса)
  - Риск оспаривания сделки кредиторами при неуведомлении

aliases:
  - Продажа бизнеса как активов (Asset Deal)
  - Договор купли-продажи предприятия
  - Sale of Enterprise
  - Asset Purchase Agreement
  - Сделка по приобретению активов

section_markers:
  - Предмет договора (предприятие как имущественный комплекс)
  - Состав предприятия (детальный перечень активов и пассивов)
  - Цена и порядок расчетов
  - Обязательные приложения (акт инвентаризации, баланс, заключение аудитора)
  - Порядок уведомления кредиторов
  - Передача предприятия (передаточный акт)
  - Государственная регистрация перехода права
  - Ответственность сторон (включая солидарную ответственность по долгам)
  - Гарантии и заверения
  - Трудовые отношения (судьба работников)
  - Конфиденциальность
  - Разрешение споров
  - Заключительные положения

notes: |
  КРИТИЧЕСКИЕ ОСОБЕННОСТИ ПРОДАЖИ ПРЕДПРИЯТИЯ:
  1. Государственная регистрация: договор подлежит регистрации и считается заключенным с момента регистрации (ст. 560 ГК РФ)
  2. Обязательные приложения: акт инвентаризации, бухгалтерский баланс, заключение независимого аудитора, перечень долгов (ст. 561 ГК РФ)
  3. Уведомление кредиторов: кредиторы должны быть письменно уведомлены о продаже; при неуведомлении вправе требовать прекращения обязательств или признания сделки недействительной
  4. Солидарная ответственность: продавец и покупатель несут солидарную ответственность по долгам, не переведенным на покупателя (ст. 562 ГК РФ)
  5. Трудовые отношения: работники сохраняют трудовые отношения с новым собственником (ст. 75 ТК РФ)
  6. Налоговые последствия: продажа предприятия облагается НДС, если продавец является плательщиком НДС

