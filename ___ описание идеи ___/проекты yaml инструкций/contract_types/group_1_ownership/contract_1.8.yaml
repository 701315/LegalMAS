type: contract_1.8
name: "Договор дарения"
description: |
  Договор, по которому одна сторона (даритель) безвозмездно передает или обязуется передать 
  другой стороне (одаряемому) вещь в собственность, имущественное право либо освобождает от обязанности.
  Основан на animus donandi (намерении одарить). Главный признак: полная безвозмездность.
  Любое встречное предоставление переквалифицирует сделку в куплю-продажу, мену или ренту.
version: 2.0
parent: class_1_transfer_of_ownership
sibling_contracts:
  - contract_1.1 # Купля-продажа
  - contract_1.7 # Мена
metadata:
  category: contract
  subcategory: ownership_transfer
  complexity: medium
  risk_level: high # Высокий риск оспаривания (притворность, банкротство, отмена)
  legal_base: Глава 32 ГК РФ (ст. 572-582)
  hierarchy_position: "child_specialized"

# ════════════════════════════════════════════════════════════
# БАЗОВАЯ ИНФОРМАЦИЯ (LEGACY SECTIONS)
# ════════════════════════════════════════════════════════════
rules:
  keywords:
    high:
      - "дарение"
      - "безвозмездно"
      - "в дар"
      - "Даритель"
      - "Одаряемый"
      - "animus donandi"
      - "дарственная"
    medium:
      - "пожертвование"
      - "обещание дарения"
      - "освобождение от обязанности"
      - "отмена дарения"
      - "подарок"
    low:
      - "благотворительность"
      - "презент"
      - "дарственная сделка"
      - "безвозмездная передача"
  phrases:
    high:
      - Даритель безвозмездно передает Одаряемому
      - Одаряемый с благодарностью принимает дар
      - Договор не предусматривает встречного предоставления
      - передается в собственность безвозмездно
    medium:
      - В случае смерти Дарителя обещание дарения отменяется
      - Право собственности переходит с момента государственной регистрации
      - Стороны подтверждают отсутствие встречных обязательств
      - не является притворной сделкой
  patterns:
    required:
      - (?i)(дарени|дарител.*одаряем|безвозмездн.*передач|в.*дар|пожертвовани)  # → contract_1.8
    optional:
      - (?i)(пожертвовани|отмен.*дарени|обещан.*дарени)
  exclusions:
    - цена (упоминание цены как условия)
    - встречное обязательство (уход, содержание, передача вещи)
    - оплата
    - компенсация
    - в обмен на
  exclusion_logic:
    - condition: "commercial_entity_both AND gift_value_over_3000"
      target: "rejection"
      confidence: 0.95
      description: "Дарение между коммерческими организациями на сумму свыше 3000 рублей запрещено ст. 575 ГК РФ"
    - condition: "counter_performance_keywords AND gratuitous_keywords"
      target: "reclassify"
      confidence: 0.90
      description: "Наличие встречного предоставления при указании на безвозмездность требует переквалификации"
  weights:
    keyword_high: 3.5
    keyword_medium: 1.5
    keyword_low: 0.5
    phrase_high: 4.0
    phrase_medium: 1.5
    pattern_required: 5.0
    pattern_optional: 1.0
  classification:
    min_confidence: 0.85
    max_matches: 1

party_roles:
  - Даритель (Donor) — лицо, безвозмездно передающее имущество или право
  - Одаряемый (Donee) — лицо, принимающее дар без встречных обязательств

essential_terms:
  - Конкретный предмет дарения (вещь, право, освобождение от обязанности)
  - Явное и недвусмысленное условие о безвозмездности (существенный признак)
  - Для обещания дарения — письменная форма и определенность предмета

specific_risks:
  - Переквалификация в мену/куплю-продажу/ренту при наличии встречного предоставления
  - Оспаривание сделки кредиторами дарителя при банкротстве (ст. 61.3 ФЗ-127)
  - Начисление НДФЛ 13% одаряемому при дарении от неблизких родственников
  - Отмена дарения по основаниям ст. 578 ГК РФ (покушение на жизнь, ненадлежащее обращение)
  - Признание сделки ничтожной при дарении между коммерческими организациями (>3000 руб.)
  - Недействительность при дарении от имени малолетних и недееспособных

aliases:
  - Дарственная
  - Договор пожертвования
  - Соглашение о безвозмездной передаче
  - Обещание дарения
  - Дарение в будущем

section_markers:
  - Предмет договора (конкретное описание дара)
  - Безвозмездность (отсутствие встречного предоставления)
  - Порядок передачи дара
  - Права и обязанности сторон
  - Отмена дарения (условия и порядок)
  - Ответственность сторон
  - Заключительные положения (о регистрации для недвижимости)

notes: |
  КРИТИЧЕСКИЕ ОСОБЕННОСТИ ДОГОВОРА ДАРЕНИЯ:
  1. Любое встречное предоставление (даже символическое "за 1 рубль" или "в обмен на уход") убивает дарение
  2. Запрещено между коммерческими организациями, кроме обычных подарков стоимостью до 3000 рублей (ст. 575 ГК РФ)
  3. Обещание подарить "всё свое имущество" без конкретики ничтожно (п. 2 ст. 572 ГК РФ)
  4. Обещание дарения требует обязательной письменной формы
  5. Дарение недвижимости подлежит государственной регистрации перехода права
  6. Одаряемый платит НДФЛ 13% при дарении от лиц, не являющихся близкими родственниками

# ════════════════════════════════════════════════════════════
# 🆕 ВАЛИДАЦИОННЫЕ СЕКЦИИ (VALIDATION ENGINE v2.0)
# ════════════════════════════════════════════════════════════

validation_metadata:
  validation_version: "2.0"
  last_updated: "2026-02-06"
  author: "Legal AI Team"
  
  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 1: ПРИМЕНИМОЕ ЗАКОНОДАТЕЛЬСТВО
  # ──────────────────────────────────────────────────────────
  legal_base:
    primary:
      - "Глава 32 ГК РФ (ст. 572-582)"
    secondary:
      - "ст. 574 ГК РФ (форма договора дарения)"
      - "ст. 578 ГК РФ (отмена дарения)"
      - "ст. 578.1 ГК РФ (оспоримость дарения кредиторами)"
    related:
      - "Налоговый кодекс РФ ст. 217 п. 18.1 (освобождение от НДФЛ при дарении между близкими родственниками)"
      - "Налоговый кодекс РФ ст. 224 (налоговая ставка НДФЛ)"
      - "ФЗ-127 «О несостоятельности (банкротстве)» ст. 61.2, 61.3 (оспоримость сделок)"
      - "Семейный кодекс РФ ст. 14 (близкие родственники), ст. 35 (согласие супруга)"
      - "ФЗ-218 «О государственной регистрации недвижимости»"

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 2: ОБЯЗАТЕЛЬНЫЕ ЭЛЕМЕНТЫ (ESSENTIALIA NEGOTII)
  # ──────────────────────────────────────────────────────────
  essential_elements:
    - element: "gratuitous_nature"
      name: "Безвозмездность передачи"
      required: true
      legal_base: "ст. 572 ГК РФ"
      description: "Явное указание на отсутствие встречного предоставления. Существенный признак договора дарения."
      validation_rules:
        - "explicit_gratuitous_declaration"
        - "no_counter_obligations_detected"
      conditional_checks:
        - trigger: "gratuitous_keywords"
          keywords: ["безвозмездно", "в дар", "дарение"]
          rule: "counter_performance_check_required"
          legal_base: "ст. 572 ГК РФ"
          severity: "critical"
          validation_rules:
            - "absence_of_price_references"
            - "absence_of_exchange_keywords"
            - "absence_of_service_obligations"
    
    - element: "subject_donation"
      name: "Предмет дарения"
      required: true
      legal_base: "ст. 572 ГК РФ"
      description: "Конкретная вещь, имущественное право или освобождение от обязанности. Должен быть определенно индивидуализирован."
      validation_rules:
        - "subject_specified"
        - "subject_identifiable"
      conditional_checks:
        - trigger: "promise_of_future_gift"
          keywords: ["обязуется передать", "обещает подарить", "в будущем", "после наступления условия"]
          rule: "written_form_and_specificity_required"
          legal_base: "ст. 572 п. 2 ГК РФ"
          severity: "critical"
          risk_msg: "Обещание дарения требует письменной формы и определенности предмета. Обещание подарить 'всё имущество' ничтожно."
          validation_rules:
            - "written_form_verification"
            - "subject_specificity_check"
    
    - element: "parties_qualification_check"
      name: "Проверка правоспособности сторон"
      required: true
      legal_base: "ст. 575, 576 ГК РФ"
      description: "Стороны должны иметь право на совершение дарения. Особые ограниения для коммерческих организаций, малолетних, недееспособных."
      validation_rules:
        - "parties_capacity_verification"
      conditional_checks:
        - trigger: "commercial_entities_both"
          keywords: ["ООО", "АО", "ЗАО", "ПАО", "коммерческая организация", "хозяйственное общество"]
          rule: "commercial_donation_restriction_check"
          legal_base: "ст. 575 ГК РФ"
          severity: "critical"
          risk_msg: "Дарение между коммерческими организациями запрещено, кроме обычных подарков стоимостью до 3000 рублей. Сделка ничтожна."

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 3: ЗАЩИТНЫЕ УСЛОВИЯ (PROTECTIVE CLAUSES)
  # ──────────────────────────────────────────────────────────
  protective_clauses:
    
    # --- ЗАЩИТА ДАРИТЕЛЯ (Donor Protection) ---
    seller_protection:
      - clause_id: "donation_revocation_rights"
        name: "Право на отмену дарения по законным основаниям"
        risk_if_missing: |
          Даритель лишается специальных прав на отмену дарения в экстраординарных случаях:
          1) покушение одаряемого на жизнь дарителя или членов его семьи (ст. 578 п. 1)
          2) обращение с даром, создающее угрозу его безвозвратной утраты (ст. 578 п. 2)
          3) переживание одаряемым дарителя при обещании дарения (ст. 578 п. 3)
          Отсутствие ссылок на эти основания усложняет защиту прав дарителя.
        legal_base: "ст. 578 ГК РФ"
        severity: "high"
        affected_party: "seller"
        detection:
          positive_keywords:
            - "отмена дарения"
            - "покушение на жизнь дарителя"
            - "ненадлежащее обращение с даром"
            - "создает угрозу безвозвратной утраты"
            - "переживет одаряемого"
            - "основания предусмотрены статьей 578 ГК РФ"
            - "право дарителя отменить дарение"
            - "недостойное поведение одаряемого"
          context_patterns:
            - '(?i)даритель.*вправе.*отменить.*дарение.*в.*случаях.*предусмотренных.*ст.*578'
            - '(?i)дарение.*может.*быть.*отменено.*если.*одаряемый.*совершил.*покушение.*на.*жизнь'
      
      - clause_id: "reversion_on_donee_death"
        name: "Возврат дара при смерти одаряемого"
        risk_if_missing: |
          По умолчанию при обещании дарения право требования не переходит к наследникам одаряемого (ст. 581).
          Если стороны хотят иного (чтобы дар возвращался дарителю при смерти одаряемого), это нужно
          специально прописать. Без такого условия дар уйдет наследникам одаряемого.
        legal_base: "ст. 578 п. 4, ст. 581 ГК РФ"
        severity: "medium"
        affected_party: "seller"
        detection:
          positive_keywords:
            - "возвращается дарителю"
            - "в случае смерти одаряемого"
            - "переживет одаряемого"
            - "не переходит к наследникам"
            - "обязательство прекращается смертью одаряемого"
            - "право на получение дара не переходит"
          context_patterns:
            - '(?i)в.*случае.*смерти.*одаряемого.*дар.*возвращается.*дарителю'
            - '(?i)право.*на.*получение.*дара.*не.*переходит.*к.*наследникам'
      
      - clause_id: "donee_obligations_for_donation"
        name: "Целевое использование пожертвования"
        risk_if_missing: |
          При пожертвовании (дарении в общеполезных целях) одаряемый обязан использовать имущество
          строго по целевому назначению. Отсутствие условий о целевом использовании и отчетности
          позволяет одаряемому использовать пожертвование произвольно, что нарушает волю дарителя.
        legal_base: "ст. 582 ГК РФ"
        severity: "high"
        affected_party: "seller"
        detection:
          positive_keywords:
            - "пожертвование"
            - "общеполезные цели"
            - "целевое использование"
            - "отчет об использовании"
            - "использование по целевому назначению"
            - "благотворительные цели"
            - "изменение цели использования только с согласия дарителя"
            - "контроль за использованием"
          context_patterns:
            - '(?i)одаряемый.*обязуется.*использовать.*имущество.*в.*целях.*указанных.*в.*договоре'
            - '(?i)пожертвование.*осуществляется.*для.*достижения.*определенных.*общеполезных.*целей'
        conditional_checks:
          - trigger: "donation_type_charity"
            keywords: ["пожертвование", "благотворительность", "общеполезные цели", "социальные цели"]
            rule: "target_use_and_reporting_required"
            severity: "high"

    # --- ЗАЩИТА ОДАРЯЕМОГО (Donee Protection) ---
    buyer_protection:
      - clause_id: "irrevocability_declaration"
        name: "Безотзывность дарения (кроме законных оснований)"
        risk_if_missing: |
          Одаряемый может столкнуться с необоснованными требованиями о возврате дара.
          Четкое указание на безотзывность (с исключением только законных оснований по ст. 578)
          защищает одаряемого от произвольных действий дарителя.
        legal_base: "ст. 577, 578 ГК РФ"
        severity: "medium"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "дарение является безотзывным"
            - "даритель не вправе требовать возврата дара"
            - "отмена возможна только по основаниям ст. 578 ГК РФ"
            - "право собственности переходит окончательно"
            - "безвозвратная передача"
            - "даритель отказывается от права одностороннего отказа"
          context_patterns:
            - '(?i)дарение.*не.*может.*быть.*отменено.*по.*иным.*основаниям.*кроме.*предусмотренных.*законом'
            - '(?i)даритель.*не.*вправе.*требовать.*возврата.*дара.*после.*его.*передачи'
      
      - clause_id: "succession_rights_for_promise"
        name: "Правопреемство при обещании дарения"
        risk_if_missing: |
          По умолчанию право на получение дара по обещанию не переходит к наследникам одаряемого (ст. 581).
          Если стороны желают иного, это должно быть явно оговорено. Отсутствие условия лишает
          наследников одаряемого права требования.
        legal_base: "ст. 581 ГК РФ"
        severity: "low"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "переходит к наследникам"
            - "правопреемство"
            - "наследники одаряемого вправе требовать"
            - "право требования переходит"
            - "в случае смерти одаряемого право переходит"
          context_patterns:
            - '(?i)право.*на.*получение.*дара.*переходит.*к.*наследникам.*одаряемого'
            - '(?i)обязательство.*дарителя.*не.*прекращается.*смертью.*одаряемого'

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 4: ДОПОЛНИТЕЛЬНЫЕ PROTECTIVE CLAUSES
  # ──────────────────────────────────────────────────────────
  additional_protective_clauses:
    
    # Налоговые риски для одаряемого
    buyer_protection:
      - clause_id: "tax_consequences_warning"
        name: "Предупреждение о налоговых последствиях (НДФЛ)"
        risk_if_missing: |
          Одаряемый может не знать об обязанности уплатить НДФЛ 13% при дарении от лиц,
          не являющихся близкими родственниками (супруги, родители, дети, бабушки, дедушки, внуки,
          полнородные братья и сестры). Непредвиденный налоговый платеж становится финансовым бременем
          и может привести к конфликту между сторонами.
        legal_base: "НК РФ ст. 217 п. 18.1, ст. 224"
        severity: "high"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "близкие родственники"
            - "НДФЛ"
            - "налоговые обязательства одаряемого"
            - "степень родства"
            - "освобождение от налога"
            - "доход в натуральной форме"
            - "налоговая декларация 3-НДФЛ"
            - "обязанность уплатить налог"
            - "рыночная стоимость для целей налогообложения"
          context_patterns:
            - '(?i)одаряемый.*несет.*ответственность.*за.*уплату.*налогов.*в.*соответствии.*с.*законодательством'
            - '(?i)дар.*не.*является.*доходом.*для.*целей.*налогообложения.*если.*стороны.*являются.*близкими.*родственниками'
        conditional_checks:
          - trigger: "non_relative_parties_indicated"
            rule: "explicit_tax_warning_required"
            severity: "high"
    
    # Согласие супруга при дарении совместного имущества
    buyer_protection:
      - clause_id: "spousal_consent_requirement"
        name: "Согласие супруга дарителя при дарении совместного имущества"
        risk_if_missing: |
          Дарение имущества, нажитого в браке, требует нотариального согласия супруга (ст. 35 СК РФ).
          Отсутствие такого согласия дает право супругу оспорить сделку в течение 1 года.
          Особенно критично для недвижимости и дорогостоящего имущества.
        legal_base: "ст. 35 СК РФ, ст. 576 ГК РФ"
        severity: "critical"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "согласие супруга дарителя"
            - "не состоит в браке"
            - "нотариальное согласие супруга"
            - "имущество является личной собственностью"
            - "брачный договор определяет режим собственности"
            - "супруг не имеет прав на передаваемое имущество"
            - "отсутствие претензий со стороны супруга"
          context_patterns:
            - '(?i)даритель.*подтверждает.*что.*имущество.*не.*является.*совместной.*собственностью.*супругов'
            - '(?i)к.*договору.*прилагается.*нотариально.*удостоверенное.*согласие.*супруга.*дарителя'
        conditional_checks:
          - trigger: "married_donor_indicated"
            keywords: ["состоит в браке", "супруг", "брачные отношения", "семейное положение"]
            rule: "spousal_consent_verification_required"
            severity: "critical"
    
    # Защита от оспаривания при банкротстве дарителя
    buyer_protection:
      - clause_id: "bankruptcy_contest_protection"
        name: "Подтверждение отсутствия признаков банкротства дарителя"
        risk_if_missing: |
          Дарение, совершенное в течение 6 месяцев до возбуждения дела о банкротстве дарителя,
          может быть оспорено арбитражным управляющим как предпочтительное удовлетворение
          требований одного кредитора (одаряемого) перед другими.
          Сделка признается недействительной, дар возвращается в конкурсную массу.
        legal_base: "ФЗ-127 «О несостоятельности (банкротстве)» ст. 61.2, 61.3"
        severity: "high"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "отсутствие признаков банкротства"
            - "даритель не находится в процедуре банкротства"
            - "сделка не нарушает права кредиторов"
            - "платежеспособность дарителя подтверждена"
            - "не является сделкой с предпочтением"
            - "дарение не совершено в ущерб кредиторам"
            - "финансовое состояние дарителя устойчиво"
          context_patterns:
            - '(?i)даритель.*подтверждает.*отсутствие.*признаков.*несостоятельности.*банкротства'
            - '(?i)сделка.*не.*может.*быть.*оспорена.*кредиторами.*в.*рамках.*процедуры.*банкротства'
        conditional_checks:
          - trigger: "commercial_donor_entity"
            keywords: ["ООО", "АО", "ИП", "юридическое лицо", "предприниматель", "коммерческая организация"]
            rule: "bankruptcy_status_verification_required"
            severity: "high"
    
    # Защита от притворности сделки
    buyer_protection:
      - clause_id: "simulated_transaction_prevention"
        name: "Подтверждение реальности дарения (неприкрытие возмездной сделки)"
        risk_if_missing: |
          Сделка может быть признана притворной по ст. 170 ГК РФ, если скрывает куплю-продажу,
          мену, ренту или иную возмездную сделку (например, для ухода от налогов или обхода
          запрета дарения между коммерческими организациями).
          Признание притворности влечет недействительность и налоговые последствия.
        legal_base: "ст. 170 ГК РФ, НК РФ ст. 54.1"
        severity: "critical"
        affected_party: "both"
        detection:
          positive_keywords:
            - "не является притворной сделкой"
            - "не прикрывает возмездную передачу"
            - "отсутствие скрытых условий"
            - "стороны подтверждают безвозмездный характер"
            - "не является способом уклонения от налогов"
            - "реальная воля на безвозмездную передачу"
            - "не скрывает куплю-продажу, мену или ренту"
          negative_keywords:
            - "встречное предоставление"
            - "оплата"
            - "компенсация"
            - "обмен"
            - "взаимные обязательства"
          context_patterns:
            - '(?i)настоящий.*договор.*не.*является.*притворной.*сделкой.*и.*не.*скрывает.*возмездных.*обязательств'
            - '(?i)стороны.*подтверждают.*что.*передача.*осуществляется.*исключительно.*безвозмездно.*без.*каких.*либо.*встречных.*условий'
    
    # Специальные условия для дарения недвижимости
    buyer_protection:
      - clause_id: "real_estate_donation_specifics"
        name: "Специальные условия для дарения недвижимого имущества"
        risk_if_missing: |
          Дарение недвижимости требует государственной регистрации перехода права.
          Отсутствие условий о порядке регистрации, распределении расходов, состоянии объекта
          и проверке обременений может привести к спорам, отказу в регистрации или получению
          обремененного имущества.
        legal_base: "ст. 574, 131 ГК РФ, ФЗ-218"
        severity: "critical"
        affected_party: "both"
        detection:
          positive_keywords:
            - "недвижимое имущество"
            - "кадастровый номер"
            - "государственная регистрация перехода права"
            - "расходы на государственную регистрацию"
            - "выписка из ЕГРН об отсутствии обременений"
            - "технический паспорт"
            - "право собственности подтверждено выпиской"
            - "отсутствие арестов, залогов, сервитутов"
          context_patterns:
            - '(?i)дарение.*недвижимого.*имущества.*подлежит.*государственной.*регистрации.*в.*Росреестре'
            - '(?i)стороны.*обязуются.*совершить.*все.*необходимые.*действия.*для.*регистрации.*перехода.*права.*собственности'
        conditional_checks:
          - trigger: "real_estate_subject"
            keywords: ["квартира", "земельный участок", "дом", "здание", "сооружение", "недвижимость"]
            rule: "real_estate_specific_clauses_required"
            severity: "critical"
