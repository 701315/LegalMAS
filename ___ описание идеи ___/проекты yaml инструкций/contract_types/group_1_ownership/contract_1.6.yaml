validation_metadata:
  validation_version: "2.0"
  last_updated: "2026-02-06"
  author: "Legal AI Team"
  
  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 1: ПРИМЕНИМОЕ ЗАКОНОДАТЕЛЬСТВО
  # ──────────────────────────────────────────────────────────
  legal_base:
    primary:
      - "§ 7 Главы 30 ГК РФ (ст. 549-558)"
    secondary:
      - "Федеральный закон от 13.07.2015 № 218-ФЗ «О государственной регистрации недвижимости»"
      - "ст. 131 ГК РФ (государственная регистрация прав на недвижимость)"
      - "ст. 550 ГК РФ (форма договора продажи недвижимости)"
    related:
      - "Семейный кодекс РФ ст. 35 (распоряжение общим имуществом супругов)"
      - "Жилищный кодекс РФ ст. 30-32 (права и обязанности собственника жилого помещения)"
      - "Земельный кодекс РФ ст. 37 (особенности купли-продажи земельных участков)"
      - "Федеральный закон № 101-ФЗ «Об обороте земель сельскохозяйственного назначения»"
      - "Федеральный закон № 73-ФЗ «Об объектах культурного наследия»"

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 2: ОБЯЗАТЕЛЬНЫЕ ЭЛЕМЕНТЫ ДОГОВОРА
  # ──────────────────────────────────────────────────────────
  essential_elements:
    - element: "parties"
      required: true
      legal_base: "ст. 432, 549 ГК РФ"
      validation_rules:
        - "presence_check"
        - "legal_capacity_indicators"
    
    - element: "subject"
      required: true
      legal_base: "ст. 554 ГК РФ"
      description: "Объект недвижимости должен быть индивидуализирован с обязательным указанием кадастрового номера"
      validation_rules:
        - "presence_check"
        - "definiteness_check"
      conditional_checks:
        - trigger: "real_estate_keywords"
          keywords: ["недвижимость", "квартира", "участок", "здание", "сооружение"]
          rule: "cadastral_number_required"
          legal_base: "ст. 554 ГК РФ, ст. 5 ФЗ-218"
          severity: "critical"
          validation_rules:
            - "cadastral_number_check"
            - "address_specified"
            - "area_specified"
    
    - element: "price"
      required: true
      legal_base: "ст. 555 ГК РФ"
      description: "Цена недвижимости является существенным условием договора"
      validation_rules:
        - "presence_check"
        - "amount_specified"
    
    - element: "residents_list"
      required: false
      legal_base: "ст. 558 ГК РФ"
      description: "Для жилых помещений: список лиц, сохраняющих право пользования после продажи"
      validation_rules:
        - "residents_clause_check"
      conditional_checks:
        - trigger: "residential_property"
          keywords: ["квартира", "жилой дом", "комната", "жилое помещение"]
          rule: "residents_list_required"
          legal_base: "ст. 558 ГК РФ"
          severity: "critical"
          risk_msg: "Для жилых помещений отсутствие списка лиц (или указания на их отсутствие) делает договор незаключенным"

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 3: ЗАЩИТНЫЕ УСЛОВИЯ (PROTECTIVE CLAUSES)
  # ──────────────────────────────────────────────────────────
  protective_clauses:
    
    # --- ЗАЩИТА ПОКУПАТЕЛЯ (Buyer Protection) ---
    buyer_protection:
      - clause_id: "encumbrances_warranty"
        name: "Гарантия отсутствия обременений и прав третьих лиц"
        risk_if_missing: |
          Без явной гарантии продавца об отсутствии обременений (ипотека, аренда, арест, сервитуты) и прав третьих лиц
          покупатель рискует получить недвижимость, которая может быть изъята или обременена.
          По ст. 460 ГК РФ продавец обязан передать товар свободным от прав третьих лиц.
        legal_base: "ст. 460, 556 ГК РФ"
        severity: "critical"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "не обременен правами третьих лиц"
            - "отсутствие обременений"
            - "не находится под арестом"
            - "не заложен"
            - "гарантия продавца"
            - "свободен от прав третьих лиц"
            - "не состоит в споре"
            - "не сдан в аренду"
          context_patterns:
            - '(?i)продавец.*гарантирует.*отсутствие.*обременений'
            - '(?i)объект.*недвижимости.*не.*обременен.*правами'
      
      - clause_id: "foreign_ownership_restrictions"
        name: "Проверка ограничений для иностранных покупателей"
        risk_if_missing: |
          Для сельскохозяйственных земель и земель в приграничных территориях действуют ограничения
          на приобретение иностранными гражданами и компаниями. Непроверка этого ограничения может
          привести к отказу в регистрации перехода права и признанию сделки недействительной.
        legal_base: "ФЗ-101 «Об обороте земель сельскохозяйственного назначения», ст. 15 ЗК РФ"
        severity: "critical"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "ограничения для иностранцев"
            - "приграничная территория"
            - "земли сельскохозяйственного назначения"
            - "иностранный гражданин"
            - "иностранная компания"
            - "не является иностранным гражданином"
          context_patterns:
            - '(?i)покупатель.*не.*является.*иностранным.*гражданином'
        conditional_checks:
          - trigger: "agricultural_land"
            keywords: ["сельхозземли", "земли сельхозназначения", "пашня", "сенокос", "пастбище"]
            rule: "foreigner_restriction_check_required"
            severity: "critical"
          - trigger: "border_area"
            keywords: ["приграничная зона", "пограничная территория", "граница государства"]
            rule: "border_restriction_check_required"
            severity: "critical"
      
      - clause_id: "heritage_and_protection_zones"
        name: "Отсутствие охранного статуса и ограничительных зон"
        risk_if_missing: |
          Объект может иметь охранный статус (ОКН — объект культурного наследия) или находиться
          в охранной зоне (водоохранная, санитарная, защитная), что накладывает существенные
          ограничения на использование и реконструкцию. Незнание этих ограничений может сделать
          объект непригодным для планируемого использования.
        legal_base: "ФЗ-73 «Об объектах культурного наследия», Водный кодекс РФ, Градостроительный кодекс РФ"
        severity: "high"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "не является объектом культурного наследия"
            - "отсутствуют ограничительные зон"
            - "не находится в водоохранной зоне"
            - "не входит в зону с особыми условиями использования"
            - "выписка из ЕГРН об ограничениях"
          negative_keywords:
            - "объект культурного наследия"
            - "ОКН"
            - "охранная зона"
            - "санитарно-защитная зона"
          context_patterns:
            - '(?i)объект.*не.*имеет.*охранного.*статуса'
    
    # --- ЗАЩИТА ПРОДАВЦА (Seller Protection) ---
    seller_protection:
      - clause_id: "payment_security"
        name: "Безопасные расчеты (Аккредитив/Ячейка/Эскроу)"
        risk_if_missing: |
          Если переход права зарегистрирован, а деньги еще не получены, продавец рискует остаться без всего.
          Использование аккредитива, эскроу-счета или банковской ячейки защищает от неплатежа.
        legal_base: "ст. 860.7 ГК РФ (Эскроу), ст. 867 ГК РФ (Аккредитив)"
        severity: "high"
        affected_party: "seller"
        detection:
          positive_keywords:
            - "аккредитив"
            - "эскроу"
            - "банковская ячейка"
            - "сервис безопасных расчетов"
            - "номинальный счет"
            - "депозит нотариуса"
          context_patterns:
            - '(?i)расчеты.*производятся.*через.*аккредитив'
      
      - clause_id: "retention_of_ownership"
        name: "Залог в силу закона (при рассрочке платежа)"
        risk_if_missing: |
          Если оплата производится после регистрации (рассрочка), объект автоматически находится в залоге у продавца (ст. 488 ГК РФ).
          Но иногда стороны отменяют это правило договором. Продавцу важно НЕ отменять залог до полной оплаты.
        legal_base: "ст. 488 п. 5 ГК РФ"
        severity: "high"
        affected_party: "seller"
        detection:
          positive_keywords:
            - "находится в залоге у продавца"
            - "ипотека в силу закона"
            - "сохранение права залога"
            - "до полной оплаты"
          negative_keywords:
            - "залог не возникает"
            - "право залога не применяется"
          context_patterns:
            - '(?i)объект.*считается.*находящимся.*в.*залоге.*у.*продавца'
      
      - clause_id: "eviction_obligation"
        name: "Обязанность покупателя принять объект и подписать передаточный акт"
        risk_if_missing: |
          Без условия об обязанности покупателя подписать передаточный акт и принять объект
          продавец не сможет документально подтвердить исполнение обязанности по передаче.
          Это может привести к спорам о моменте передачи и состоянии объекта.
        legal_base: "ст. 556 ГК РФ"
        severity: "medium"
        affected_party: "seller"
        detection:
          positive_keywords:
            - "передаточный акт"
            - "акт приема-передачи"
            - "подписание акта"
            - "фактическая передача"
            - "передача ключей"
            - "обязан принять объект"
          context_patterns:
            - '(?i)покупатель.*обязан.*подписать.*акт.*приема.*передачи'

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 4: ДОПОЛНИТЕЛЬНЫЕ PROTECTIVE CLAUSES
  # ──────────────────────────────────────────────────────────
  additional_protective_clauses:
    
    # Для сделок с участием юридических лиц
    buyer_protection:
      - clause_id: "corporate_approval_check"
        name: "Подтверждение одобрения крупной сделки"
        risk_if_missing: |
          Если продавцом или покупателем является юридическое лицо, сделка может требовать
          одобрения как крупная. Отсутствие такого одобрения делает сделку оспоримой
          в течение года, что ставит под угрозу право собственности покупателя.
        legal_base: "ст. 46 ФЗ-14 (для ООО), ст. 78 ФЗ-208 (для АО)"
        severity: "critical"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "одобрение крупной сделки"
            - "решение общего собрания"
            - "решение совета директоров"
            - "сделка не является крупной"
            - "стоимость объекта не превышает"
          context_patterns:
            - '(?i)сделка.*одобрена.*в.*соответствии.*с.*требованиями.*законодательства'
        conditional_checks:
          - trigger: "legal_entity_seller_or_buyer"
            keywords: ["ООО", "АО", "ПАО", "ЗАО", "общество", "акционерное общество"]
            rule: "corporate_approval_check_required"
            severity: "critical"
    
    # Для проверки брачных отношений и согласия супруга
    buyer_protection:
      - clause_id: "marital_status_and_spousal_consent"
        name: "Раскрытие семейного положения и согласие супруга"
        risk_if_missing: |
          Продавец может состоять в браке, что требует нотариального согласия супруга,
          либо иметь брачный договор, изменяющий режим собственности. Сокрытие этой
          информации может привести к оспариванию сделки супругом продавца.
        legal_base: "ст. 35 СК РФ, ст. 40-44 СК РФ (брачный договор)"
        severity: "critical"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "не состоит в браке"
            - "брачный договор отсутствует"
            - "нотариальное согласие супруга приложено"
            - "общая совместная собственность супругов"
            - "режим собственности определен брачным договором"
            - "справка о семейном положении"
          context_patterns:
            - '(?i)продавец.*представляет.*справку.*о.*семейном.*положении'
            - '(?i)согласие.*супруга.*удостоверено.*нотариусом'
        conditional_checks:
          - trigger: "individual_seller"
            keywords: ["гражданин", "физическое лицо", "ИП", "индивидуальный предприниматель"]
            rule: "marital_status_disclosure_required"
            severity: "critical"
    
    # Для проверки долгосрочной аренды
    buyer_protection:
      - clause_id: "long_term_lease_check"
        name: "Отсутствие долгосрочных договоров аренды"
        risk_if_missing: |
          На объекте недвижимости могут действовать долгосрочные договоры аренды, которые
          сохраняют силу при смене собственника ("аренда следует за вещью"). Покупатель
          может получить недвижимость с арендатором, которого не сможет выселить годами.
        legal_base: "ст. 617 ГК РФ (сохранение аренды при переходе права собственности)"
        severity: "high"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "не сдан в аренду"
            - "отсутствуют договоры аренды"
            - "арендные отношения прекращены"
            - "акт о прекращении аренды"
            - "арендаторы выселены"
          negative_keywords:
            - "сдан в аренду"
            - "действует договор аренды"
            - "арендатор"
          context_patterns:
            - '(?i)на.*момент.*подписания.*договор.*аренды.*не.*заключен'
    
    # Для единства судьбы земли и строения
    buyer_protection:
      - clause_id: "land_building_unity"
        name: "Единство судьбы земли и строения"
        risk_if_missing: |
          Нельзя продать здание без земли под ним (ст. 35 ЗК РФ, ст. 552 ГК РФ).
          Договор должен четко указывать, что право на землю переходит вместе с объектом.
          Отсутствие этого условия может привести к невозможности использования здания.
        legal_base: "ст. 552 ГК РФ, ст. 35 ЗК РФ"
        severity: "critical"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "вместе с земельным участком"
            - "право аренды земельного участка"
            - "права на землю"
            - "единый имущественный комплекс"
            - "земельно-имущественный комплекс"
          context_patterns:
            - '(?i)право.*на.*земельный.*участок.*переходит.*вместе.*с.*зданием'
        conditional_checks:
          - trigger: "building_sale"
            keywords: ["здание", "дом", "сооружение", "строение", "нежилое помещение"]
            rule: "land_rights_clause_required"
            severity: "critical"
    
    # Для проверки залоговых обременений
    buyer_protection:
      - clause_id: "mortgage_and_pledge_clearance"
        name: "Подтверждение отсутствия залоговых обременений"
        risk_if_missing: |
          Объект может быть заложен в банке или у иных кредиторов. Даже если залог
          не зарегистрирован в ЕГРН, он может существовать на основании договора.
          При наличии залога объект может быть изъят у покупателя для удовлетворения
          требований залогодержателя.
        legal_base: "ст. 334-356 ГК РФ (залог)"
        severity: "critical"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "не заложен"
            - "отсутствуют залоговые обременения"
            - "справка об отсутствии залога"
            - "выписка из реестра залогов"
            - "договор залога расторгнут"
            - "ипотека погашена"
          negative_keywords:
            - "заложен"
            - "в залоге"
            - "ипотека"
            - "залогодержатель"
          context_patterns:
            - '(?i)объект.*не.*является.*предметом.*залога'
    
    # Для сделок с участием несовершеннолетних
    buyer_protection:
      - clause_id: "guardianship_consent"
        name: "Согласие органа опеки и попечительства"
        risk_if_missing: |
          При продаже жилого помещения, в котором проживают несовершеннолетние или недееспособные,
          без согласия органа опеки договор может быть признан недействительным.
          Покупатель рискует не получить право собственности на жилье.
        legal_base: "ст. 292 ГК РФ, ст. 20 Федерального закона № 48-ФЗ"
        severity: "critical"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "согласие органа опеки"
            - "проживают несовершеннолетние"
            - "разрешение опеки"
            - "недееспособные"
            - "зарегистрированы несовершеннолетние"
            - "отсутствие несовершеннолетних"
          context_patterns:
            - '(?i)продавец.*представляет.*разрешение.*органа.*опеки'
        conditional_checks:
          - trigger: "minor_keywords"
            keywords: ["несовершеннолетний", "опека", "попечительство", "проживает ребенок", "дети"]
            rule: "guardianship_consent_required"
            severity: "critical"

    # Для проверки инженерных коммуникаций и сервитутов
        buyer_protection:
          - clause_id: "utilities_and_servitudes"
            name: "Права на инженерные коммуникации и наличие сервитутов"
            risk_if_missing: |
              Электрические кабели, газопроводы, водопроводы и иные коммуникации, проходящие по участку,
              могут принадлежать сторонним организациям (сетевые компании, ресурсоснабжающие организации).
              Это создает сервитут — право ограниченного пользования чужим земельным участком.
              Покупатель рискует получить участок, обремененный обязательствами по допуску к коммуникациям
              и невозможностью строительства в охранных зонах этих объектов.
            legal_base: "ст. 274 ГК РФ (сервитут), Земельный кодекс РФ, Правила определения охранных зон"
            severity: "high"
            affected_party: "buyer"
            detection:
              positive_keywords:
                - "инженерные коммуникации"
                - "принадлежность коммуникаций"
                - "сервитут зарегистрирован"
                - "охранная зона коммуникаций"
                - "право прохода (проезда)"
                - "обременение в виде сервитута"
                - "выписка из ЕГРН о сервитутах"
                - "коммуникации принадлежат собственнику"
              negative_keywords:
                - "отсутствуют сервитуты"
                - "сервитуты не зарегистрированы"
              context_patterns:
                - '(?i)сервитут.*зарегистрирован.*в.*ЕГРН'
                - '(?i)коммуникации.*находятся.*в.*собственности.*продавца'
            conditional_checks:
              - trigger: "land_plot_sale"
                keywords: ["земельный участок", "участок земли", "надел"]
                rule: "servitude_disclosure_required"
                severity: "high"
      
      # Для проверки санитарно-защитных зон и охранных зон
      - clause_id: "sanitary_and_security_zones"
        name: "Отсутствие санитарно-защитных зон промышленных предприятий"
        risk_if_missing: |
          Земельный участок может попадать в санитарно-защитную зону (СЗЗ) промышленного объекта,
          где запрещено или ограничено жилищное строительство, размещение детских и медицинских учреждений.
          Также существуют охранные зоны объектов культурного наследия, трубопроводов, ЛЭП и др.
          Наложение таких зон может сделать невозможным использование участка по целевому назначению.
        legal_base: "СанПиН 2.2.1/2.1.1.1200-03, Градостроительный кодекс РФ, ФЗ-52 «О санитарно-эпидемиологическом благополучии»"
        severity: "critical"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "не находится в санитарно-защитной зоне"
            - "отсутствуют ограничения по СЗЗ"
            - "охранная зона предприятия"
            - "выписка из ПЗЗ (правил землепользования и застройки)"
            - "санитарный разрыв"
            - "нормативы по шуму, загрязнениям"
            - "не входит в зону с особыми условиями использования территории"
          negative_keywords:
            - "санитарно-защитная зона"
            - "СЗЗ"
            - "охранная зона ЛЭП"
            - "охранная зона газопровода"
            - "зона санитарной охраны"
          context_patterns:
            - '(?i)участок.*не.*попадает.*в.*санитарно.*защитную.*зону'
            - '(?i)отсутствуют.*ограничения.*связанные.*с.*близостью.*промышленных.*объектов'
      
      # Для проверки экологического состояния
      - clause_id: "ecological_condition"
        name: "Надлежащее экологическое состояние объекта"
        risk_if_missing: |
          Земельный участок может быть загрязнен химическими веществами, радиацией, биологическими отходами.
          На нем или под ним могут находиться несанкционированные свалки, захоронения отходов, могильники.
          Приобретение такого объекта влечет обязанность по его рекультивации за свой счет,
          административную ответственность и существенное снижение стоимости.
        legal_base: "ФЗ-7 «Об охране окружающей среды», Земельный кодекс РФ (ст. 13), ФЗ-89 «Об отходах производства и потребления»"
        severity: "critical"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "экологическое состояние"
            - "отсутствие загрязнений"
            - "нет свалок и захоронений"
            - "результаты экоаудита"
            - "акт обследования земельного участка"
            - "не является объектом накопленного экологического вреда"
            - "санитарно-эпидемиологическое заключение"
            - "радиационный фон в норме"
          negative_keywords:
            - "захоронение отходов"
            - "свалка"
            - "загрязнение почв"
            - "радиационное загрязнение"
            - "химическое загрязнение"
            - "объект накопленного экологического вреда"
          context_patterns:
            - '(?i)продавец.*гарантирует.*надлежащее.*экологическое.*состояние'
            - '(?i)участок.*не.*является.*местом.*размещения.*отходов'
        conditional_checks:
          - trigger: "industrial_or_agricultural_history"
            keywords: ["бывшее промпредприятие", "сельхозугодья", "техногенная нагрузка", "мелиорация"]
            rule: "ecological_warranty_required"
            severity: "critical"


