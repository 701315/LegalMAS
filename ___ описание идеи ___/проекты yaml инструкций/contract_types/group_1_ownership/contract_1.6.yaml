type: contract_1.6
name: "Договор купли-продажи недвижимости"
description: |
  Специализированный вид купли-продажи недвижимого имущества, регулируемый § 7 Главы 30 ГК РФ.
  Характеризуется обязательной письменной формой, государственной регистрацией перехода права собственности,
  специальными гарантиями для покупателя и множеством практических ограничений и рисков.
version: 2.0
parent: class_1_transfer_of_ownership
metadata:
  category: contract
  subcategory: ownership_transfer
  complexity: high
  risk_level: critical
  legal_base: § 7 Главы 30 ГК РФ (ст. 549-558)

# ════════════════════════════════════════════════════════════
# БАЗОВАЯ ИНФОРМАЦИЯ (LEGACY SECTIONS)
# ════════════════════════════════════════════════════════════
rules:
  keywords:
    high:
      - "недвижимост"
      - "квартир"
      - "земельн участ"
      - "здани"
      - "сооружени"
      - "государственн регистрац"
      - "ЕГРН"
      - "кадастров номер"
    medium:
      - "купля-продажа недвижимости"
      - "право собственности"
      - "объект недвижимости"
      - "переход права собственности"
      - "обременение"
      - "залог"
    low:
      - "дом"
      - "помещение"
      - "ипотека"
      - "арест"
      - "сервитут"
  phrases:
    high:
      - Право собственности на объект недвижимости переходит к Покупателю с момента государственной регистрации в ЕГРН
      - Продавец гарантирует, что на момент заключения договора объект не обременен правами третьих лиц
      - Расчеты производятся путем внесения денежных средств в банковскую ячейку с последующей их выдачей Продавцу после регистрации
      - кадастровый номер
      - адрес объекта
    medium:
      - Стороны обязуются совершить все необходимые действия для государственной регистрации перехода права собственности
      - Передача объекта недвижимости оформляется передаточным актом
      - Объект не является предметом залога и не сдан в долгосрочную аренду
  patterns:
    required:
      - (?i)(недвижимост|квартир|земельн.*участ|здани|сооружен|кадастров|государственн.*регистрац)  # → contract_1.6
    optional:
      - (?i)(кадастровый.*номер|ЕГРН|объект.*недвижимости|право.*собственности|обременен)
  exclusions:
    - движимое имущество
    - аренда
    - договор мены недвижимости
    - долевое участие в строительстве
  exclusion_logic:
    - condition: "agricultural_land_keywords AND foreign_buyer_keywords"
      target: "rejection"
      confidence: 0.95
      description: "Иностранцы не могут приобретать сельскохозяйственные земли по ФЗ-101"
    - condition: "border_zone_keywords AND foreign_buyer_keywords"
      target: "rejection"
      confidence: 0.90
      description: "Иностранцы не могут приобретать земли в приграничных зонах по ст. 15 ЗК РФ"
  weights:
    keyword_high: 3.5
    keyword_medium: 1.5
    keyword_low: 0.5
    phrase_high: 3.0
    phrase_medium: 1.5
    pattern_required: 4.5
    pattern_optional: 1.0
  classification:
    min_confidence: 0.80
    max_matches: 3

party_roles:
  - Продавец (Seller) — собственник недвижимого имущества
  - Покупатель (Buyer) — приобретатель права собственности на недвижимость

essential_terms:
  - Данные, позволяющие определенно установить недвижимое имущество (кадастровый номер, адрес, площадь)
  - Цена недвижимости (существенное условие по ст. 555 ГК РФ)
  - Перечень лиц, сохраняющих право пользования (для жилых помещений по ст. 558 ГК РФ)

specific_risks:
  - Признание договора недействительным из-за пороков воли или несоблюдения формы
  - Обременения или права третьих лиц на объект, о которых не было известно
  - Риск утраты или повреждения объекта до регистрации перехода права
  - Отказ в государственной регистрации перехода права
  - Появление "скрытых" жильцов или арендаторов
  - Нарушение ограничений для иностранных покупателей

aliases:
  - Продажа недвижимости
  - ДКП недвижимости
  - Договор отчуждения недвижимости
  - Договор купли-продажи квартиры
  - Договор купли-продажи земельного участка
  - Договор купли-продажи здания

section_markers:
  - Предмет договора (детальное описание объекта)
  - Цена и порядок расчетов (часто через аккредитив или банковскую ячейку)
  - Права и обязанности сторон
  - Передача недвижимости и подписание передаточного акта
  - Гарантии продавца (отсутствие обременений, прав третьих лиц)
  - Ответственность сторон
  - Порядок разрешения споров
  - Заключительные положения (о регистрации)

notes: |
  ОСОБЕННОСТИ И ОГРАНИЧЕНИЯ (ДОПОЛНЕНО):
  1. Договор считается заключенным с момента подписания (регистрация самого договора для жилья отменена)
  2. Для долей в праве и сделок с участием несовершеннолетних обязательно нотариальное удостоверение
  3. Продажа жилья с проживающими несовершеннолетними требует согласия органов опеки
  4. Иностранные граждане не могут приобретать сельхозземли и земли в приграничных зонах
  5. Продажа здания требует одновременной передачи прав на земельный участок
  6. Обязательная государственная регистрация перехода права собственности в Росреестре
  7. **КРИТИЧНО ПРОВЕРИТЬ:** Принадлежность инженерных коммуникаций (могут создавать сервитуты)
  8. **КРИТИЧНО ПРОВЕРИТЬ:** Наличие санитарно-защитных зон (СЗЗ) промышленных объектов
  9. **КРИТИЧНО ПРОВЕРИТЬ:** Экологическое состояние (отсутствие свалок, загрязнений, могильников)
  10. **ВАЖНО:** Зарегистрированные сервитуты (права прохода, проезда, использования коммуникаций)

  ПРАКТИЧЕСКИЕ РЕКОМЕНДАЦИИ ПО ПРОВЕРКЕ:
  - Запросить выписку из ЕГРН об ограничениях (сервитуты, СЗЗ)
  - Запросить справку о принадлежности инженерных коммуникаций
  - Проверить ПЗЗ (правила землепользования и застройки) муниципалитета
  - Запросить санитарно-эпидемиологическое заключение по участку
  - При покупке бывших промышленных земель - провести экологический аудит

