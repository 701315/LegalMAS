validation_metadata:
  validation_version: "2.0"
  last_updated: "2026-02-06"
  author: "Legal AI Team"
  
  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 1: ПРИМЕНИМОЕ ЗАКОНОДАТЕЛЬСТВО
  # ──────────────────────────────────────────────────────────
  legal_base:
    primary:
      - "§ 3 Главы 30 ГК РФ (ст. 506-524)"
    secondary:
      - "ст. 465-485 ГК РФ (общие положения о купле-продаже, применяемые субсидиарно)"
      - "Постановление Пленума ВАС РФ № 18 от 22.10.1997 (О практике применения норм о поставке)"
      - "ст. 309-310 ГК РФ (принципы исполнения обязательств)"
    related:
      - "ст. 330-333 ГК РФ (неустойка)"
      - "ст. 15 ГК РФ (возмещение убытков)"
      - "ст. 395 ГК РФ (ответственность за неисполнение денежного обязательства)"

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 2: ОБЯЗАТЕЛЬНЫЕ ЭЛЕМЕНТЫ ДОГОВОРА
  # ──────────────────────────────────────────────────────────
  essential_elements:
    - element: "parties"
      name: "Стороны договора"
      required: true
      legal_base: "ст. 432, 506 ГК РФ"
      validation_rules:
        - "presence_check"
        - "legal_capacity_indicators"
    
    - element: "subject"
      name: "Предмет договора (товар)"
      required: true
      legal_base: "ст. 455, 506 ГК РФ"
      description: "Товар должен быть определен наименованием и количеством, может поставляться партиями"
      validation_rules:
        - "presence_check"
        - "definiteness_check"
      conditional_checks:
        - trigger: "multiple_items_keywords"
          keywords: ["ассортимент", "номенклатура", "перечень", "спецификация", "приложение"]
          rule: "specification_reference_required"
          legal_base: "ст. 467 ГК РФ"
          severity: "medium"
    
    - element: "price"
      name: "Цена товара"
      required: true
      legal_base: "ст. 485, 424 ГК РФ"
      description: "Цена товара может быть установлена за единицу или за партию"
      validation_rules:
        - "presence_check"
        - "amount_specified"
    
    - element: "term"
      name: "Срок поставки"
      required: true
      legal_base: "ст. 506, 508 ГК РФ"
      description: "Срок поставки является существенным условием договора поставки"
      validation_rules:
        - "presence_check"
        - "term_clarity_if_present"
      conditional_checks:
        - trigger: "periodic_delivery_keywords"
          keywords: ["период", "ежеквартально", "ежемесячно", "по графику", "партиями"]
          rule: "delivery_schedule_required"
          legal_base: "ст. 508 ГК РФ"
          severity: "high"

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 3: ЗАЩИТНЫЕ УСЛОВИЯ (PROTECTIVE CLAUSES)
  # ──────────────────────────────────────────────────────────
  protective_clauses:
    
    # --- ЗАЩИТА ПОКУПАТЕЛЯ (Buyer Protection) ---
    buyer_protection:
      - clause_id: "shortfall_replenishment"
        name: "Обязанность восполнения недопоставки товара"
        risk_if_missing: |
          Без этого условия покупатель может столкнуться с дефицитом товара при недопоставке.
          Поставщик не будет обязан восполнить недостачу в следующем периоде,
          что может привести к срыву производственного процесса и убыткам покупателя.
        legal_base: "ст. 511 ГК РФ"
        severity: "high"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "восполнение недопоставки"
            - "допоставка товара"
            - "недопоставленный товар"
            - "в следующем периоде поставки"
            - "обязанность поставщика восполнить"
      
      - clause_id: "acceptance_procedure"
        name: "Процедура и сроки приемки товара"
        risk_if_missing: |
          Без четкой процедуры и сроков приемки товара покупатель может пропустить момент
          для заявления претензий по качеству и количеству. По ст. 513 ГК РФ покупатель
          обязан проверить товар, но без договорных сроков доказывание нарушений в суде затруднено.
        legal_base: "ст. 513 ГК РФ"
        severity: "critical"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "приемка товара"
            - "акт приемки"
            - "проверка качества"
            - "проверка количества"
            - "в течение рабочих дней"
            - "срок для заявления претензий"
          context_patterns:
            - '(?i)приемк.*товар.*осуществляет.*в.*течение.*раб.*дн'
            - '(?i)проверк.*качеств.*производится.*в.*срок'
      
      - clause_id: "penalty_delivery_delay"
        name: "Неустойка за просрочку поставки товара"
        risk_if_missing: |
          Без договорной неустойки покупатель сможет взыскать только проценты по ст. 395 ГК РФ,
          что часто не покрывает реальные убытки от простоя производства или срыва сделок.
          Специальная неустойка стимулирует поставщика к соблюдению сроков поставки.
        legal_base: "ст. 330, 521 ГК РФ"
        severity: "high"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "неустойка за просрочку поставки"
            - "пеня за несвоевременную поставку"
            - "штраф за нарушение сроков"
            - "0,1% от стоимости товара"
            - "за каждый день просрочки"
          context_patterns:
            - '(?i)за.*просрочку.*поставки.*уплачивается.*неустойка'
    
    # --- ЗАЩИТА ПОСТАВЩИКА (Supplier Protection) ---
    supplier_protection:
      - clause_id: "obligation_to_collect"
        name: "Обязанность выборки (самовывоза) товара"
        risk_if_missing: |
          Без условия об обязанности покупателя забрать товар поставщик несет расходы
          на хранение и риски порчи товара после его готовности к отгрузке.
          По ст. 510 ГК РФ выборка товара может быть возложена на покупателя.
        legal_base: "ст. 510, 515 ГК РФ"
        severity: "medium"
        affected_party: "supplier"
        detection:
          positive_keywords:
            - "выборка товара"
            - "самовывоз"
            - "со склада поставщика"
            - "обязан вывезти товар"
            - "принять товар на складе поставщика"
          context_patterns:
            - '(?i)покупатель.*обязан.*вывезти.*товар.*со.*склад'
      
      - clause_id: "penalty_payment_delay"
        name: "Неустойка за просрочку оплаты товара"
        risk_if_missing: |
          Без договорной неустойки поставщик сможет взыскать только проценты по ст. 395 ГК РФ,
          что часто ниже стоимости коммерческого кредитования. Договорная неустойка
          обеспечивает адекватную компенсацию за пользование чужими денежными средствами.
        legal_base: "ст. 330, 395 ГК РФ"
        severity: "high"
        affected_party: "supplier"
        detection:
          positive_keywords:
            - "неустойка за просрочку оплаты"
            - "пеня за несвоевременную оплату"
            - "штраф за просрочку платежа"
            - "проценты за просрочку"
            - "0,1% в день от суммы долга"
          context_patterns:
            - '(?i)за.*просрочку.*оплаты.*уплачивается.*неустойка'
      
      - clause_id: "force_majeure_clause"
        name: "Оговорка о форс-мажорных обстоятельствах"
        risk_if_missing: |
          Без детализированной оговорки о форс-мажоре поставщик может нести ответственность
          за непоставку товара по причинам, не зависящим от его воли (санкции, транспортные
          ограничения, действия государственных органов, природные явления).
        legal_base: "ст. 401, 416 ГК РФ"
        severity: "medium"
        affected_party: "supplier"
        detection:
          positive_keywords:
            - "форс-мажор"
            - "непреодолимая сила"
            - "обстоятельства непреодолимой силы"
            - "освобождение от ответственности"
            - "свидетельство ТПП"
            - "перечень форс-мажорных обстоятельств"
          context_patterns:
            - '(?i)форс.*мажор.*освобожда.*от.*ответственности.*поставк'

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 4: ДОПОЛНИТЕЛЬНЫЕ PROTECTIVE CLAUSES
  # ──────────────────────────────────────────────────────────
  additional_protective_clauses:
    
    # Для международных поставок
    supplier_protection:
      - clause_id: "incoterms_clause"
        name: "Определение условий поставки по правилам Инкотермс"
        risk_if_missing: |
          В международных контрактах отсутствие ссылки на правила Инкотермс создает неопределенность
          в распределении расходов, рисков и обязанностей по доставке товара, таможенному оформлению
          и страхованию. Это может привести к значительным финансовым потерям и спорам.
        legal_base: "Международные правила толкования торговых терминов Инкотермс"
        severity: "critical"
        affected_party: "supplier"
        detection:
          positive_keywords:
            - "Incoterms"
            - "FCA"
            - "FOB"
            - "CIF"
            - "EXW"
            - "DAP"
            - "DDP"
            - "условия поставки"
            - "базис поставки"
          context_patterns:
            - '(?i)поставк.*осуществляется.*на.*условиях.*Incoterms'
        conditional_checks:
          - trigger: "international_trade_keywords"
            keywords: ["международная", "иностранный", "импорт", "экспорт", "валютный", "таможня"]
            rule: "incoterms_clause_required"
            severity: "critical"
    
    # Для поставки товаров, изготовленных под заказ
    supplier_protection:
      - clause_id: "custom_order_protection"
        name: "Защита при поставке товаров, изготовленных под заказ"
        risk_if_missing: |
          При поставке товаров, изготовленных по спецификации покупателя, отсутствие условий
          о последствиях отказа покупателя от товара может привести к существенным убыткам поставщика,
          который не сможет реализовать специфичный товар другим покупателям.
        legal_base: "ст. 475, 480, 717 ГК РФ"
        severity: "high"
        affected_party: "supplier"
        detection:
          positive_keywords:
            - "изготовлено по заказу"
            - "спецификация покупателя"
            - "нестандартные характеристики"
            - "индивидуальный заказ"
            - "по чертежам заказчика"
            - "уникальный товар"
          context_patterns:
            - '(?i)товар.*изготовлен.*по.*спецификации.*покупателя'
        conditional_checks:
          - trigger: "custom_order_keywords"
            keywords: ["под заказ", "по спецификации", "нестандартный", "индивидуальный", "по чертежам"]
            rule: "cancellation_protection_required"
            severity: "high"
    
    # Для долгосрочных договоров поставки
    buyer_protection:
      - clause_id: "price_adjustment_mechanism"
        name: "Механизм изменения цены при долгосрочных поставках"
        risk_if_missing: |
          При долгосрочных договорах поставки (более года) отсутствие механизма изменения цены
          может привести к существенным убыткам покупателя при росте рыночных цен или,
          наоборот, к убыткам поставщика при снижении себестоимости производства.
        legal_base: "ст. 424, 451 ГК РФ"
        severity: "medium"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "индексация цены"
            - "изменение цены"
            - "корректировка стоимости"
            - "пересмотр цены"
            - "в зависимости от рыночных цен"
            - "ежеквартальный пересмотр"
          context_patterns:
            - '(?i)цена.*может.*быть.*пересмотрена.*раз.*в.*квартал'
        conditional_checks:
          - trigger: "long_term_keywords"
            keywords: ["на год", "на два года", "длительный", "долгосрочный", "бессрочный"]
            rule: "price_adjustment_clause_recommended"
            severity: "medium"