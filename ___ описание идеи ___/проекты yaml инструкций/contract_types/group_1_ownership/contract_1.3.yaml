type: contract_1.3
name: "Договор поставки"
description: |
  Специализированный вид купли-продажи для предпринимательских отношений (B2B), регулируемый § 3 Главы 30 ГК РФ.
  Характеризуется особым субъектным составом (обе стороны — предприниматели), целью использования товара
  (для предпринимательской деятельности) и длящимся характером отношений с поставками партиями.
version: 2.0
parent: class_1_transfer_of_ownership
metadata:
  category: contract
  subcategory: ownership_transfer
  complexity: medium
  risk_level: medium
  legal_base: § 3 Главы 30 ГК РФ (ст. 506-524)

# ════════════════════════════════════════════════════════════
# БАЗОВАЯ ИНФОРМАЦИЯ (LEGACY SECTIONS)
# ════════════════════════════════════════════════════════════
rules:
  keywords:
    high:
      - "поставк"
      - "поставщик"
      - "покупател"
      - "товар"
      - "оплат"
    medium:
      - "поставка"
      - "получатель"
      - "партия"
      - "график"
      - "отгрузка"
      - "накладная"
    low:
      - "УПД"
      - "товар для бизнеса"
      - "предпринимательская деятельность"
  phrases:
    high:
      - Поставка товара осуществляется партиями в соответствии со спецификациями/графиком
      - Покупатель обязан совершить все необходимые действия для принятия товара
      - Приемка товара по количеству и качеству осуществляется в срок, указанный в договоре
      - предпринимательская деятельность
      - партия товара
    medium:
      - Товар передается покупателю для использования в предпринимательской деятельности
      - Сторонами договора являются субъекты предпринимательской деятельности
  patterns:
    required:
      - (?i)(поставк|поставщик.*получател|договор.*поставк)   # → contract_1.3
    optional:
      - (?i)(поставка|получатель|партия|график|отгрузк)
  exclusions:
    - для личных нужд
    - розница
    - гражданин-потребитель
    - физлицо
  weights:
    keyword_high: 3.0
    keyword_medium: 1.5
    keyword_low: 0.5
    phrase_high: 2.5
    phrase_medium: 1.0
    pattern_required: 4.0
    pattern_optional: 1.0
  classification:
    min_confidence: 0.70
    max_matches: 3

party_roles:
  - Поставщик (Supplier) — продавец, осуществляющий предпринимательскую деятельность
  - Покупатель (Buyer) — получатель товара, использующий товар для предпринимательской деятельности

essential_terms:
  - Срок поставки (может быть определен периодами)
  - Наименование и количество товара

specific_risks:
  - Нарушение сроков поставки или оплаты
  - Недопоставка товара
  - Нарушение правил приемки товара (пропуск сроков для заявления претензий)
  - Несоответствие товара условиям об ассортименте или комплектности

aliases:
  - Поставка
  - Договор поставки товара
  - Рамочный договор поставки
  - Договор на поставку товаров

section_markers:
  - Предмет договора (наименование, ассортимент, количество)
  - Сроки и порядок поставки
  - Порядок отгрузки, доставки, выборки
  - Цена и порядок расчетов
  - Приемка товара по количеству и качеству
  - Ответственность сторон (неустойка за недопоставку)
  - Порядок разрешения споров

notes: |
  Часто заключается как рамочный договор с отдельными спецификациями на каждую партию.
  Ключевое значение имеет процедура приемки товара и сроки для заявления претензий по качеству/количеству (ст. 513 ГК РФ).
  Сторонами могут быть только предприниматели (юридические лица или индивидуальные предприниматели).

