type: contract_1.11
name: "Договор купли-продажи корпоративных прав (долей/акций)"
description: |
  Договор отчуждения корпоративных прав участия в коммерческих организациях.
  Включает продажу долей в уставном капитале ООО (имущественное право) и продажу акций АО (ценные бумаги).
  Характеризуется строгими формальными требованиями (нотариальное удостоверение для ООО, учет у регистратора для АО),
  специальными корпоративными процедурами (преимущественное право, одобрение крупных сделок) и высокими рисками
  Due Diligence (проверка компании). Квинтэссенция сделок M&A (слияний и поглощений).
version: 2.0
parent: class_1_transfer_of_ownership
sibling_contracts:
  - contract_1.1  # Общие положения купли-продажи
  - contract_1.6  # Купля-продажа недвижимости (часто активы компании)
  - contract_1.10 # Цессия (уступка права требования - иное имущественное право)
metadata:
  category: contract
  subcategory: corporate_transactions
  complexity: critical  # Самый сложный тип: Due Diligence, заверения, нотариат, корпоративные процедуры
  risk_level: critical  # Риск потери бизнеса, ничтожности сделки, оспаривания
  legal_base: "§ 1 Главы 30 ГК РФ, ФЗ-14 «Об ООО», ФЗ-208 «Об АО», ФЗ-39 «О рынке ценных бумаг»"
  hierarchy_position: "child_specialized"

# ════════════════════════════════════════════════════════════
# БАЗОВАЯ ИНФОРМАЦИЯ (LEGACY SECTIONS - ОПТИМИЗИРОВАНО)
# ════════════════════════════════════════════════════════════
rules:
  keywords:
    high:
      - "доля в уставном капитале"
      - "уставн капитал ООО"
      - "акции"
      - "бездокументарн ценны бумаг"
      - "эмитент"
      - "номинальн стоимост"
      - "корпоративны прав"
      - "сделк M&A"
      - "сделк слияни и поглащени"
      - "договор купли-продажи доле ООО"
      - "договор купли продажи доле ООО"
      - "купли-продажи доле"
      - "доле в ООО"
    medium:
      - "обществ с ограниченно ответственность"
      - "акционерн обществ"
      - "преимущественн прав покупк"
      - "нотариальн удостоверени"
      - "реестродержател"
      - "регистратор"
      - "заверения и гарантии"
      - "due diligence"
    low:
      - "выписка из ЕГРЮЛ"
      - "дивиденды"
      - "участник общества"
      - "акционер"
      - "пакет акций"
      - "контрольный пакет"
      - "миноритарный пакет"
      - "выкупная стоимость"
  phrases:
    high:
      - Продавец обязуется передать в собственность Покупателя долю в уставном капитале
      - Продавец обязуется передать акции, а Покупатель обязуется оплатить их стоимость
      - Переход права на долю подлежит нотариальному удостоверению
      - Право собственности на акции переходит с момента внесения записи по лицевому счету
      - Стороны подтверждают, что ознакомились с результатами Due Diligence
    medium:
      - Цена Доли/Акций определяется Сторонами в размере ___ рублей
      - Продавец заверяет, что Доля/Акции не обременены правами третьих лиц
      - Сделка не требует одобрения антимонопольного органа
      - Продавец предоставил Покупателю возможность проведения Due Diligence
  patterns:
    required:
      - (?i)(дол[яи].*уставн.*капитал|акци[ияй].*общест|пакет.*акци|корпоративн.*прав|бездокументарн.*ценн.*бумаг)  # → contract_1.11
    optional:
      - (?i)(номинальн.*стоимость|ООО.*№.*|АО.*№.*|ПАО.*№.*|рег.*номер.*выпуск)
  exclusions:
    - продажа имущества предприятия (не долей, а активов компании - contract_1.1/1.6)
    - выход участника из общества (выплата действительной стоимости доли)
    - дарение доли/акций (contract_1.8)
    - уступка права требования (contract_1.10)
  exclusion_logic:
    - condition: "gratuitous_transfer AND corporate_rights"
      target: "reclassify"
      confidence: 0.90
      description: "Безвозмездная передача доли/акций - это дарение (contract_1.8), имеет ограничения для коммерческих организаций"
    - condition: "assignment_to_creditor AND debt_settlement"
      target: "reclassify"
      confidence: 0.85
      description: "Передача доли в счет погашения долга может квалифицироваться как отступное или новация"
  weights:
    keyword_high: 3.5
    keyword_medium: 1.5
    keyword_low: 0.5
    phrase_high: 4.0
    phrase_medium: 1.5
    pattern_required: 5.0
    pattern_optional: 1.0
  classification:
    min_confidence: 0.90  # Высокий порог для специфичного договора
    max_matches: 1

party_roles:
  - Продавец (Seller) — текущий участник/акционер, отчуждающий корпоративные права
  - Покупатель (Buyer) — приобретатель бизнеса или доли участия
  - Общество/Эмитент (Target Company) — компания, доли/акции которой продаются (часто третья сторона, но не участник договора)

essential_terms:
  - Предмет: точное описание доли (размер в % и в денежном выражении, номер записи в ЕГРЮЛ) или акций (количество, тип, категория, номер выпуска)
  - Цена: существенное условие, определяется сторонами (может отличаться от номинальной стоимости)
  - Реквизиты общества: наименование, ИНН, ОГРН, размер уставного капитала

specific_risks:
  - Ничтожность сделки при отсутствии нотариального удостоверения для ООО (ст. 21 ФЗ-14)
  - Нарушение преимущественного права покупки других участников (сделка может быть оспорена и переведена на них)
  - Недостоверность заверений (Reps & Warranties) о состоянии бизнеса (скрытые долги, судебные споры, налоговые риски)
  - Отсутствие согласия супруга при продаже совместно нажитого имущества (ст. 35 СК РФ)
  - Неполучение необходимых корпоративных одобрений (крупная сделка, сделка с заинтересованностью)
  - Риск невнесения записи в реестр акционеров или ЕГРЮЛ (формальный переход права не состоялся)

aliases:
  - SPA (Share Purchase Agreement)
  - Договор купли-продажи доли в ООО
  - Договор отчуждения акций
  - Договор продажи корпоративных прав
  - Соглашение о приобретении доли участия
  - M&A сделка

section_markers:
  - Предмет договора (детальные характеристики актива)
  - Цена и порядок расчетов (эскроу, аккредитив, поэтапная оплата)
  - Заверения и гарантии (Reps & Warranties)
  - Due Diligence (проведение и последствия)
  - Порядок закрытия сделки (Closing - условия precedent)
  - Переход права собственности и регистрация перехода
  - Ответственность сторон (компенсация убытков, неустойка)
  - Конфиденциальность
  - Разрешение споров
  - Заключительные положения

notes: |
  КРИТИЧЕСКИЕ ОСОБЕННОСТИ КОРПОРАТИВНЫХ СДЕЛОК:
  1. Для ООО: момент перехода права — внесение записи в ЕГРЮЛ (нотариус подает заявление). Без нотариуса сделка ничтожна.
  2. Для АО: момент перехода права — запись в реестре акционеров (нужно передаточное распоряжение регистратору).
  3. Преимущественное право: участники ООО имеют право купить долю на тех же условиях. Продавец должен доказать соблюдение процедуры.
  4. Заверения и гарантии (Reps & Warranties) — ключевой механизм распределения рисков. Без них покупатель принимает компанию "как есть".
  5. Due Diligence (юридическая, финансовая, налоговая проверка) — обязательный этап серьезных M&A сделок.
  6. Условные сделки (Closing Conditions) — переход права может зависеть от выполнения условий (получение разрешений, одобрений).

# ════════════════════════════════════════════════════════════
# 🆕 ВАЛИДАЦИОННЫЕ СЕКЦИИ (VALIDATION ENGINE v2.0)
# ════════════════════════════════════════════════════════════

validation_metadata:
  validation_version: "2.0"
  last_updated: "2026-02-06"
  author: "Legal AI Team"
  
  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 1: ПРИМЕНИМОЕ ЗАКОНОДАТЕЛЬСТВО
  # ──────────────────────────────────────────────────────────
  legal_base:
    primary:
      - "§ 1 Главы 30 ГК РФ (купля-продажа, ст. 454-491)"
      - "ФЗ-14 от 08.02.1998 «Об обществах с ограниченной ответственностью» (ст. 21 - отчуждение доли)"
      - "ФЗ-208 от 26.12.1995 «Об акционерных обществах» (ст. 72.1 - приобретение более 30% акций)"
    secondary:
      - "ФЗ-39 от 22.04.1996 «О рынке ценных бумаг» (обращение бездокументарных ценных бумаг)"
      - "ст. 431.2 ГК РФ (заверения об обстоятельствах)"
      - "ст. 428.1 ГК РФ (рамочный договор, опцион)"
    related:
      - "Семейный кодекс РФ ст. 35 (согласие супруга на распоряжение общим имуществом)"
      - "ФЗ-135 от 26.07.2006 «О защите конкуренции» (предварительное согласие ФАС на концентрацию)"
      - "Налоговый кодекс РФ (налогообложение доходов от продажи долей/акций)"
      - "ФЗ-115 от 07.08.2001 «О противодействии легализации доходов» (проверка бенефициаров)"

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 2: ОБЯЗАТЕЛЬНЫЕ ЭЛЕМЕНТЫ ДОГОВОРА
  # ──────────────────────────────────────────────────────────
  essential_elements:
    - element: "corporate_asset_identification"
      name: "Идентификация корпоративного актива"
      required: true
      legal_base: "ст. 455 ГК РФ, ст. 21 ФЗ-14, ст. 72 ФЗ-208"
      description: |
        Доля в ООО: размер в процентах и денежном выражении, номер записи в ЕГРЮЛ о доле.
        Акции: количество, тип (обыкновенные/привилегированные), категория, номер государственной регистрации выпуска.
        Реквизиты общества: полное наименование, ИНН, ОГРН, размер уставного капитала.
      validation_rules:
        - "company_details_specified"
        - "share_or_stock_details_specified"
      conditional_checks:
        - trigger: "llc_share_keywords"
          keywords: ["доля", "уставный капитал", "ООО", "общество с ограниченной ответственностью"]
          rule: "llc_share_specification_required"
          legal_base: "ст. 21 ФЗ-14"
          severity: "critical"
          validation_rules:
            - "share_percentage_specified"
            - "share_nominal_value_specified"
            - "egrul_record_reference"
        
        - trigger: "joint_stock_keywords"
          keywords: ["акции", "АО", "ПАО", "акционерное общество", "эмитент", "выпуск ценных бумаг"]
          rule: "stock_specification_required"
          legal_base: "ст. 142 ГК РФ, ФЗ-39"
          severity: "critical"
          validation_rules:
            - "stock_quantity_specified"
            - "stock_type_specified"
            - "issue_registration_number"
    
    - element: "purchase_price_specification"
      name: "Цена покупки корпоративных прав"
      required: true
      legal_base: "ст. 424, 454 ГК РФ"
      description: |
        Цена является существенным условием для возмездной сделки. Может определяться:
        - фиксированной суммой
        - формулой (кратной EBITDA, выручке)
        - с учетом корректировок (working capital adjustment)
        Особенно важно для сделок M&A, где цена часто отличается от номинальной стоимости.
      validation_rules:
        - "price_specified"
        - "payment_currency_specified"
      conditional_checks:
        - trigger: "business_sale_context"
          keywords: ["M&A", "приобретение бизнеса", "контрольный пакет", "due diligence"]
          rule: "price_mechanism_detailed"
          severity: "high"
          validation_rules:
            - "price_adjustment_mechanism"
            - "earn_out_provisions"
            - "deferred_payment_terms"
    
    - element: "corporate_procedures_compliance"
      name: "Соблюдение корпоративных процедур"
      required: true
      legal_base: "ст. 21 ФЗ-14, ст. 7, 78-84 ФЗ-208"
      description: |
        Проверка соблюдения всех необходимых корпоративных процедур:
        - Для ООО: соблюдение преимущественного права покупки
        - Для АО: возможные ограничения в уставе
        - Для всех: одобрение крупной сделки, сделки с заинтересованностью
      validation_rules:
        - "corporate_approvals_mentioned"
      conditional_checks:
        - trigger: "llc_share_sale"
          keywords: ["доля в ООО", "уставный капитал ООО"]
          rule: "preemptive_right_procedure_required"
          legal_base: "ст. 21 ФЗ-14"
          severity: "critical"
          risk_msg: "Нарушение преимущественного права покупки участников ООО дает им право оспорить сделку в течение 3 месяцев"
        
        - trigger: "large_transaction_value"
          rule: "corporate_approval_check_required"
          legal_base: "ст. 46 ФЗ-14, ст. 78-84 ФЗ-208"
          severity: "critical"
          risk_msg: "Сделка может требовать одобрения как крупная или сделка с заинтересованностью"

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 3: ЗАЩИТНЫЕ УСЛОВИЯ (PROTECTIVE CLAUSES)
  # ──────────────────────────────────────────────────────────
  protective_clauses:
    
    # --- ЗАЩИТА ПОКУПАТЕЛЯ (Buyer Protection) ---
    buyer_protection:
      - clause_id: "representations_and_warranties"
        name: "Заверения и гарантии Продавца (Representations & Warranties)"
        risk_if_missing: |
          Покупая долю/акции, Покупатель приобретает все риски компании: скрытые долги,
          налоговые обязательства, судебные споры, экологические проблемы. Без детальных
          заверений по ст. 431.2 ГК РФ невозможно взыскать убытки при обнаружении проблем
          после сделки. Это ключевой механизм распределения рисков в M&A.
        legal_base: "ст. 431.2 ГК РФ"
        severity: "critical"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "заверения об обстоятельствах"
            - "гарантии и заверения"
            - "отсутствуют скрытые обязательства"
            - "все налоги уплачены"
            - "отсутствуют судебные споры"
            - "финансовая отчетность достоверна"
            - "права на интеллектуальную собственность"
            - "трудовые отношения урегулированы"
            - "экологическое законодательство соблюдено"
            - "все необходимые лицензии получены"
          context_patterns:
            - '(?i)продавец.*заверяет.*и.*гарантирует.*следующее'
            - '(?i)в.*отношении.*общества.*и.*его.*деятельности.*действительны.*следующие.*заверения'
      
      - clause_id: "due_diligence_and_disclosure"
        name: "Проведение Due Diligence и раскрытие информации"
        risk_if_missing: |
          Без возможности провести всестороннюю проверку компании (юридическую, финансовую,
          налоговую) Покупатель принимает решение вслепую. Отсутствие условий о предоставлении
          документов, доступе к информации создает риск приобретения компании со скрытыми проблемами.
        legal_base: "ст. 10 ГК РФ (добросовестность), ст. 431.2 ГК РФ"
        severity: "critical"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "due diligence"
            - "проверка компании"
            - "раскрытие информации"
            - "предоставление документов"
            - "доступ к информации"
            - "виртуальная комната данных"
            - "право на проверку"
            - "конфиденциальное исследование"
            - "финансовая проверка"
            - "юридическая проверка"
          context_patterns:
            - '(?i)продавец.*предоставляет.*покупателю.*возможность.*проведения.*due diligence'
            - '(?i)все.*документы.*общества.*предоставляются.*для.*проверки'
      
      - clause_id: "indemnification_for_breaches"
        name: "Возмещение убытков при нарушении заверений (Indemnity)"
        risk_if_missing: |
          Даже при наличии заверений без механизма возмещения убытков (indemnity) взыскание
          может быть сложным и длительным. Особенно важно для налоговых, экологических,
          трудовых рисков, которые могут возникнуть после сделки.
        legal_base: "ст. 15, 393, 431.2 ГК РФ"
        severity: "high"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "возмещение убытков"
            - "indemnity"
            - "ответственность за нарушение заверений"
            - "компенсация потерь"
            - "гарантийные обязательства"
            - "удержание из цены"
            - "эскроу-счет для гарантий"
            - "срок гарантийных обязательств"
            - "ограничение ответственности"
          context_patterns:
            - '(?i)продавец.*несет.*ответственность.*за.*нарушение.*заверений'
            - '(?i)в.*случае.*обнаружения.*скрытых.*обязательств.*продавец.*обязан.*возместить'

    # --- ЗАЩИТА ПРОДАВЦА (Seller Protection) ---
    seller_protection:
      - clause_id: "limitation_of_liability_seller"
        name: "Ограничение ответственности Продавца"
        risk_if_missing: |
          Без ограничений ответственности Продавец может нести неограниченную ответственность
          за любые, даже незначительные, нарушения заверений. Особенно рискованно при продаже
          старых компаний с длительной историей, где невозможно гарантировать все аспекты.
        legal_base: "ст. 15, 393 ГК РФ"
        severity: "high"
        affected_party: "seller"
        detection:
          positive_keywords:
            - "ограничение ответственности"
            - "порог существенности"
            - "дединимум"
            - "капа"
            - "срок исковой давности для требований"
            - "исключение косвенных убытков"
            - "ответственность ограничена ценой сделки"
            - "период действия гарантий"
            - "уведомление о претензиях"
          context_patterns:
            - '(?i)ответственность.*продавца.*ограничивается.*суммой.*равной.*цене.*сделки'
            - '(?i)требования.*по.*нарушению.*заверений.*могут.*быть.*предъявлены.*в.*течение.*\\d+.*лет'
      
      - clause_id: "closing_conditions_precedent"
        name: "Условия совершения сделки (Conditions Precedent)"
        risk_if_missing: |
          Без условий precedent Продавец обязан совершить сделку даже если не получены
          необходимые разрешения (ФАС, корпоративные одобрения), что может привести к
          нарушению законодательства и оспариванию сделки.
        legal_base: "ст. 157, 421 ГК РФ"
        severity: "high"
        affected_party: "seller"
        detection:
          positive_keywords:
            - "условия precedent"
            - "условия совершения сделки"
            - "получение согласия ФАС"
            - "корпоративные одобрения"
            - "отсутствие запретительных мер"
            - "выполнение условий до закрытия"
            - "право отказа от сделки"
            - "срок выполнения условий"
            - "уведомление о выполнении условий"
          context_patterns:
            - '(?i)обязательства.*сторон.*по.*закрытию.*сделки.*возникают.*после.*выполнения.*следующих.*условий'
            - '(?i)сделка.*подлежит.*закрытию.*при.*выполнении.*всех.*условий.*precedent'

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 4: ДОПОЛНИТЕЛЬНЫЕ PROTECTIVE CLAUSES
  # ──────────────────────────────────────────────────────────
  additional_protective_clauses:
    
    # Формальные требования для ООО
    buyer_protection:
      - clause_id: "notarization_requirement_llc"
        name: "Нотариальное удостоверение сделки с долей ООО"
        risk_if_missing: |
          Сделка по отчуждению доли в ООО подлежит обязательному нотариальному удостоверению
          (ст. 21 ФЗ-14). Простая письменная форма делает сделку ничтожной. Нотариус также
          подает заявление о внесении изменений в ЕГРЮЛ.
        legal_base: "ст. 21 ФЗ-14 «Об ООО»"
        severity: "critical"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "нотариальное удостоверение"
            - "удостоверяется нотариусом"
            - "нотариус подает заявление в ЕГРЮЛ"
            - "обязательная нотариальная форма"
            - "внесение записи нотариусом"
            - "нотариальная сделка"
          context_patterns:
            - '(?i)договор.*подлежит.*обязательному.*нотариальному.*удостоверению'
            - '(?i)переход.*права.*на.*долю.*оформляется.*нотариально.*удостоверенной.*сделкой'
        conditional_checks:
          - trigger: "llc_share_transfer"
            keywords: ["доля в ООО", "уставный капитал ООО", "общество с ограниченной ответственностью"]
            rule: "notarization_clause_required"
            severity: "critical"
    
    # Формальные требования для АО
    buyer_protection:
      - clause_id: "stock_transfer_registration"
        name: "Регистрация перехода прав на акции"
        risk_if_missing: |
          Для перехода права на бездокументарные акции недостаточно договора. Необходимо:
          - Передаточное распоряжение Продавца регистратору
          - Внесение записи в реестр акционеров
          Без этого Покупатель формально не становится акционером.
        legal_base: "ст. 29 ФЗ-39 «О рынке ценных бумаг»"
        severity: "critical"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "передаточное распоряжение"
            - "внесение записи в реестр"
            - "лицевой счет приобретателя"
            - "регистратор"
            - "реестродержатель"
            - "депозитарный учет"
            - "списание с лицевого счета"
            - "зачисление на лицевой счет"
          context_patterns:
            - '(?i)переход.*права.*собственности.*на.*акции.*осуществляется.*путем.*внесения.*записи.*в.*реестр'
            - '(?i)продавец.*обязуется.*направить.*передаточное.*распоряжение.*регистратору'
        conditional_checks:
          - trigger: "joint_stock_transfer"
            keywords: ["акции", "АО", "ПАО", "бездокументарные ценные бумаги", "эмитент"]
            rule: "stock_registration_clause_required"
            severity: "critical"
    
    # Согласие супруга
    buyer_protection:
      - clause_id: "spousal_consent_corporate"
        name: "Согласие супруга на отчуждение корпоративных прав"
        risk_if_missing: |
          Если доля/акции приобретены в браке, они являются совместной собственностью супругов.
          Отчуждение требует нотариального согласия супруга (ст. 35 СК РФ). Отсутствие согласия
          дает право супругу оспорить сделку в течение года.
        legal_base: "ст. 35 Семейного кодекса РФ, ст. 253 ГК РФ"
        severity: "high"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "согласие супруга"
            - "нотариальное согласие супруга"
            - "имущество не является совместной собственностью"
            - "продавец не состоит в браке"
            - "брачный договор"
            - "режим раздельной собственности"
            - "отсутствие претензий со стороны супруга"
          context_patterns:
            - '(?i)продавец.*подтверждает.*что.*отчуждаемые.*доли.*акции.*не.*являются.*совместной.*собственностью.*супругов'
            - '(?i)к.*договору.*прилагается.*нотариально.*удостоверенное.*согласие.*супруга.*продавца'
    
    # Неконкуренция после сделки
    buyer_protection:
      - clause_id: "non_compete_and_non_solicit"
        name: "Обязательства о неконкуренции и непереманивании (Non-compete, Non-solicit)"
        risk_if_missing: |
          После продажи бизнеса Продавец может открыть аналогичное предприятие и переманить
          ключевых сотрудников, клиентов, поставщиков. Хотя в России такие ограничения
          трактуются судами строго, их наличие дисциплинирует Продавца.
        legal_base: "ст. 10 ГК РФ (недобросовестная конкуренция)"
        severity: "medium"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "неконкуренция"
            - "non-compete"
            - "непереманивание сотрудников"
            - "non-solicit"
            - "запрет на аналогичную деятельность"
            - "географическое ограничение"
            - "срок ограничения"
            - "штраф за нарушение"
            - "конфиденциальная информация"
            - "клиентская база"
          context_patterns:
            - '(?i)продавец.*обязуется.*не.*осуществлять.*конкурирующую.*деятельность.*в.*течение.*\\d+.*лет'
            - '(?i)запрещается.*переманивание.*сотрудников.*и.*клиентов.*общества'
    
    # Налоговые обязательства
    buyer_protection:
      - clause_id: "tax_liabilities_allocation"
        name: "Распределение налоговых обязательств"
        risk_if_missing: |
          Продажа доли/акций имеет налоговые последствия: НДФЛ (13%) для физических лиц,
          налог на прибыль (20%) для организаций. Также могут быть налоговые обязательства
          самой компании, обнаруженные после сделки. Неясность в распределении этих рисков
          ведет к спорам.
        legal_base: "Налоговый кодекс РФ"
        severity: "high"
        affected_party: "both"
        detection:
          positive_keywords:
            - "налоговые обязательства"
            - "НДФЛ с дохода от продажи"
            - "налог на прибыль"
            - "ответственность за налоговые риски"
            - "налоговые проверки"
            - "распределение налоговых обязательств"
            - "продавец несет налоговые обязательства"
            - "налоговые последствия сделки"
          context_patterns:
            - '(?i)продавец.*несет.*ответственность.*за.*уплату.*налогов.*с.*дохода.*от.*продажи'
            - '(?i)стороны.*определили.*следующий.*порядок.*распределения.*налоговых.*рисков'
