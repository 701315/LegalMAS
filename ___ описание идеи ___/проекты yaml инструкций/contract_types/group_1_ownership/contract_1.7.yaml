type: contract_1.7
name: Договор мены (Бартер)
description: |
  Двусторонняя сделка, при которой каждая из сторон обязуется передать в собственность другой стороны один товар в обмен на другой.
  Характеризуется отсутствием денежного встречного предоставления в чистом виде, возможной доплатой при неравноценности товаров
  и особым моментом перехода права собственности. Регулируется § 1 Главы 31 ГК РФ.
version: 2.0
parent: class_1_transfer_of_ownership
metadata:
  category: contract
  subcategory: ownership_transfer
  complexity: medium
  risk_level: medium-high
  legal_base: § 1 Главы 31 ГК РФ (ст. 567-571)

# ════════════════════════════════════════════════════════════
# БАЗОВАЯ ИНФОРМАЦИЯ (LEGACY SECTIONS - ОПТИМИЗИРОВАНО)
# ════════════════════════════════════════════════════════════
rules:
  keywords:
    high:
      - "мена"
      - "бартер"
      - "обмен"
      - "товар на товар"
      - "взаимная передача"
      - "равноценность товаров"
      - "встречное предоставление"
    medium:
      - "товарообмен"
      - "обмениваемые товары"
      - "переход права собственности"
      - "доплата при неравноценности"
      - "встречная передача"
    low:
      - "компенсационная сделка"
      - "неденежный расчет"
      - "обменный договор"
      - "товарообменная операция"
  phrases:
    high:
      - Стороны обязуются передать в собственность друг другу товары в обмен
      - Товары признаются равноценными/неравноценными
      - Право собственности на обмениваемые товары переходит одновременно после исполнения обязательств обеими сторонами
      - каждая из сторон признается продавцом товара
      - обмен одного товара на другой
    medium:
      - В случае неравноценности товаров предусмотрена доплата разницы в стоимости
      - К договору мены применяются правила о купле-продаже
      - Сторона, передающая менее ценный товар, обязана оплатить разницу
      - товары передаются по передаточным актам
  patterns:
    required:
      - (?i)(договор.*мены|бартер|обмен.*товар|товар.*на.*товар|взаимн.*передач.*товар) # → contract_1.7
    optional:
      - (?i)(равноценн|неравноценн|доплат.*разниц|обменива.*товар)
  exclusions:
    - купля-продажа за деньги
    - дарение
    - договор поставки
    - договор аренды
  exclusion_logic:
    - condition: "payment_in_money_only AND no_goods_exchange"
      target: "rejection"
      confidence: 0.90
      description: "Если присутствует только денежное предоставление без обмена товарами - это купля-продажа"
  weights:
    keyword_high: 3.0
    keyword_medium: 1.5
    keyword_low: 0.5
    phrase_high: 2.5
    phrase_medium: 1.0
    pattern_required: 4.0
    pattern_optional: 1.0
  classification:
    min_confidence: 0.70
    max_matches: 3

party_roles:
  - Сторона 1 (продавец товара А и покупатель товара Б)
  - Сторона 2 (продавец товара Б и покупатель товара А)

essential_terms:
  - Наименование, количество и индивидуализирующие признаки обмениваемых товаров с обеих сторон
  - Порядок определения стоимости/равноценности товаров (существенное условие при доплате)
  - Порядок и сроки взаимной передачи товаров

specific_risks:
  - Споры о стоимости и равноценности обмениваемых товаров
  - Неодновременность исполнения (риск передачи своего товара без получения встречного)
  - Ненадлежащее качество полученного товара (требования по ст. 475 ГК РФ)
  - Налоговые риски (для целей НДС бартер приравнивается к реализации)
  - Риск признания сделки притворной (прикрытие купли-продажи, дарения)

aliases:
  - Мена
  - Бартер
  - Обмен товарами
  - Товарообменный договор
  - Договор товарообмена
  - Компенсационная сделка

section_markers:
  - Предмет договора (детальное описание обмениваемых товаров с обеих сторон)
  - Стоимость товаров и оценка равноценности
  - Порядок и сроки взаимной передачи товаров
  - Переход права собственности и распределение рисков
  - Качество товаров и гарантии сторон
  - Ответственность сторон за нарушение условий
  - Порядок разрешения споров
  - Заключительные положения

notes: |
  ОСОБЕННОСТИ И ПРАВИЛА ПРИМЕНЕНИЯ:
  1. К договору мены субсидиарно применяются правила о купле-продаже (ст. 567 ГК РФ)
  2. Каждая из сторон признается продавцом товара, который она передает, и покупателем товара, который получает
  3. При неравноценности товаров сторона, передающая менее ценный товар, обязана доплатить разницу
  4. Момент перехода права собственности по умолчанию - после исполнения обязательств обеими сторонами
  5. Для недвижимости требуется государственная регистрация перехода права собственности
  6. Налоговые последствия: каждая сторона отражает выручку от реализации своего товара

# ════════════════════════════════════════════════════════════
# 🆕 ВАЛИДАЦИОННЫЕ СЕКЦИИ (VALIDATION ENGINE v2.0)
# ════════════════════════════════════════════════════════════

validation_metadata:
  validation_version: "2.0"
  last_updated: "2026-02-06"
  author: "Legal AI Team"
  
  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 1: ПРИМЕНИМОЕ ЗАКОНОДАТЕЛЬСТВО
  # ──────────────────────────────────────────────────────────
  legal_base:
    primary:
      - "§ 1 Главы 31 ГК РФ (ст. 567-571)"
    secondary:
      - "ст. 454 ГК РФ (правила о купле-продаже, применяемые субсидиарно)"
      - "ст. 223, 224 ГК РФ (момент перехода права собственности)"
      - "ст. 328 ГК РФ (встречное исполнение обязательств)"
    related:
      - "Налоговый кодекс РФ ст. 39 (реализация товаров при мене)"
      - "Налоговый кодекс РФ ст. 154 (определение налоговой базы по НДС при мене)"
      - "Федеральный закон от 26.12.2008 № 294-ФЗ (защита прав потребителей, если применимо)"

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 2: ОБЯЗАТЕЛЬНЫЕ ЭЛЕМЕНТЫ ДОГОВОРА
  # ──────────────────────────────────────────────────────────
  essential_elements:
    - element: "parties"
      required: true
      legal_base: "ст. 432, 567 ГК РФ"
      validation_rules:
        - "presence_check"
        - "legal_capacity_indicators"
    
    - element: "subject_both_sides"
      required: true
      legal_base: "ст. 567, 455 ГК РФ"
      description: "Должны быть четко определены оба обмениваемых товара с каждой стороны"
      validation_rules:
        - "presence_check"
        - "definiteness_check"
      conditional_checks:
        - trigger: "barter_keywords"
          keywords: ["мена", "бартер", "обмен", "товар на товар"]
          rule: "two_goods_required"
          legal_base: "ст. 567 ГК РФ"
          severity: "critical"
          validation_rules:
            - "goods_specified_both_sides"
            - "quantity_specified_both_sides"
    
    - element: "price_or_valuation_method"
      required: false
      legal_base: "ст. 568 ГК РФ"
      description: "При неравноценности товаров цена или метод оценки обязательны"
      validation_rules:
        - "price_or_valuation_present"
      conditional_checks:
        - trigger: "unequal_exchange_keywords"
          keywords: ["неравноценн", "доплат", "разница в стоимости", "компенсация разницы"]
          rule: "price_specification_required"
          legal_base: "ст. 568 ГК РФ"
          severity: "critical"
          risk_msg: "При неравноценном обмене отсутствие цены/метода оценки делает условие о доплате неопределенным"
    
    - element: "transfer_procedure"
      required: true
      legal_base: "ст. 570 ГК РФ"
      description: "Порядок передачи товаров (одновременно или последовательно)"
      validation_rules:
        - "transfer_procedure_specified"
        - "timing_specified"

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 3: ЗАЩИТНЫЕ УСЛОВИЯ (PROTECTIVE CLAUSES)
  # ──────────────────────────────────────────────────────────
  protective_clauses:
    
    # --- ЗАЩИТА ОБЕИХ СТОРОН (Dual Protection) ---
    buyer_seller_protection:
      - clause_id: "simultaneous_or_secured_transfer"
        name: "Механизм обеспечения одновременности передачи или встречного предоставления"
        risk_if_missing: |
          При отсутствии механизма обеспечения одновременности передачи сторона, первой передавшая товар,
          рискует не получить встречное предоставление. Особенно критично при обмене дорогостоящими товарами
          или недвижимостью. Риск дефолта одной из сторон.
        legal_base: "ст. 328, 570 ГК РФ"
        severity: "critical"
        affected_party: "both"
        detection:
          positive_keywords:
            - "одновременная передача"
            - "аккредитив"
            - "эскроу-счет"
            - "банковская ячейка"
            - "обеспечительный платеж"
            - "задаток"
            - "встречное исполнение"
            - "передача через третье лицо"
            - "депозит нотариуса"
          context_patterns:
            - '(?i)передача.*товаров.*осуществляется.*одновременно'
            - '(?i)исполнение.*обязательств.*обеими.*сторонами.*одновременно'
      
      - clause_id: "goods_quality_warranty"
        name: "Гарантии качества обмениваемых товаров"
        risk_if_missing: |
          Без явных гарантий качества к полученному товару будут применяться общие положения о качестве.
          Сторона не сможет предъявить требования, характерные для договора купли-продажи
          (соразмерное уменьшение цены, безвозмездное устранение недостатков и т.д.).
        legal_base: "ст. 469-477, 567 ГК РФ"
        severity: "high"
        affected_party: "both"
        detection:
          positive_keywords:
            - "гарантия качества"
            - "соответствие товара"
            - "отсутствие недостатков"
            - "технические характеристики"
            - "проверка качества"
            - "акт приема-передачи"
            - "претензия по качеству"
            - "скрытые недостатки"
          context_patterns:
            - '(?i)сторона.*гарантирует.*качество.*передаваемого.*товара'
            - '(?i)к.*полученному.*товару.*применяются.*правила.*о.*качестве'
      
      - clause_id: "ownership_transfer_timing"
        name: "Четкое определение момента перехода права собственности"
        risk_if_missing: |
          По умолчанию право собственности переходит после исполнения обеими сторонами (ст. 570 ГК РФ).
          Неясность в этом вопросе приводит к спорам о моменте возникновения риска случайной гибели
          и возможности распоряжения товаром до получения встречного предоставления.
        legal_base: "ст. 223, 224, 570 ГК РФ"
        severity: "high"
        affected_party: "both"
        detection:
          positive_keywords:
            - "право собственности переходит"
            - "после исполнения обеими сторонами"
            - "момент перехода права"
            - "риск случайной гибели"
            - "с момента передачи"
            - "после подписания акта"
          context_patterns:
            - '(?i)право.*собственности.*переходит.*после.*исполнения.*обязательств.*обеими.*сторонами'

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 4: ДОПОЛНИТЕЛЬНЫЕ PROTECTIVE CLAUSES
  # ──────────────────────────────────────────────────────────
  additional_protective_clauses:
    
    # Для предотвращения налоговых рисков
    buyer_seller_protection:
      - clause_id: "tax_consequences_disclosure"
        name: "Раскрытие налоговых последствий сделки"
        risk_if_missing: |
          При мене каждая сторона обязана исчислить НДС и налог на прибыль с рыночной стоимости
          полученного товара. Непонимание этого приводит к налоговым доначислениям, пеням и штрафам.
          Особенно критично для юридических лиц и ИП.
        legal_base: "НК РФ ст. 39, 154, 249"
        severity: "high"
        affected_party: "both"
        detection:
          positive_keywords:
            - "налоговые последствия"
            - "НДС при мене"
            - "рыночная стоимость для налогов"
            - "налоговая база"
            - "стороны осведомлены о налоговых обязательствах"
            - "стоимость для целей налогообложения"
          context_patterns:
            - '(?i)стороны.*признают.*что.*мена.*влечет.*налоговые.*последствия'
            - '(?i)стоимость.*товаров.*для.*целей.*исчисления.*НДС'
        conditional_checks:
          - trigger: "legal_entity_party"
            keywords: ["ООО", "АО", "ЗАО", "ИП", "юридическое лицо"]
            rule: "tax_disclosure_required"
            severity: "high"
    
    # Для защиты от притворности сделки
    buyer_seller_protection:
      - clause_id: "economic_justification"
        name: "Экономическое обоснование и деловая цель мены"
        risk_if_missing: |
          Сделка может быть признана притворной (ст. 170 ГК РФ), если скрывает иную правовую форму
          (дарение, куплю-продажу по заниженной цене). Это ведет к недействительности и налоговым
          последствиям (доначисление налогов, штрафы).
        legal_base: "ст. 170 ГК РФ, НК РФ ст. 54.1"
        severity: "critical"
        affected_party: "both"
        detection:
          positive_keywords:
            - "деловая цель"
            - "экономическая обоснованность"
            - "рыночная стоимость"
            - "не является притворной сделкой"
            - "имеет хозяйственный смысл"
            - "взаимная выгода"
          negative_keywords:
            - "дарение"
            - "безвозмездная передача"
            - "фиктивная сделка"
          context_patterns:
            - '(?i)сделка.*имеет.*экономическое.*обоснование'
            - '(?i)обмен.*осуществляется.*в.*рамках.*хозяйственной.*деятельности'
    
    # Для недвижимости в мене
    buyer_seller_protection:
      - clause_id: "real_estate_barter_specifics"
        name: "Специальные условия для мены недвижимости"
        risk_if_missing: |
          При мене недвижимости требуются дополнительные условия: регистрация перехода прав,
          проверка обременений, состояние объектов. Отсутствие этих условий приводит к риску
          получения обремененной недвижимости или отказу в регистрации.
        legal_base: "ст. 550, 551, 567 ГК РФ, ФЗ-218"
        severity: "critical"
        affected_party: "both"
        detection:
          positive_keywords:
            - "недвижимое имущество"
            - "кадастровый номер"
            - "государственная регистрация"
            - "отсутствие обременений"
            - "выписка из ЕГРН"
            - "технический паспорт"
            - "право собственности подтверждено"
          context_patterns:
            - '(?i)обмениваемое.*имущество.*является.*недвижимым'
            - '(?i)переход.*права.*собственности.*подлежит.*государственной.*регистрации'
        conditional_checks:
          - trigger: "real_estate_keywords"
            keywords: ["квартира", "земельный участок", "здание", "сооружение", "недвижимость"]
            rule: "real_estate_barter_clauses_required"
            severity: "critical"
    
    # Для обеспечения равноценности
    buyer_seller_protection:
      - clause_id: "valuation_method_and_disputes"
        name: "Метод оценки товаров и порядок разрешения споров о стоимости"
        risk_if_missing: |
          При отсутствии четкого метода оценки возникают споры о равноценности. Стороны могут
          по-разному оценивать рыночную стоимость, что приводит к конфликтам и судебным разбирательствам
          о размере доплаты или несоответствии товаров.
        legal_base: "ст. 568 ГК РФ"
        severity: "high"
        affected_party: "both"
        detection:
          positive_keywords:
            - "метод оценки"
            - "рыночная стоимость"
            - "независимый оценщик"
            - "справедливая стоимость"
            - "оценочная комиссия"
            - "порядок определения стоимости"
            - "разрешение споров об оценке"
          context_patterns:
            - '(?i)стоимость.*товаров.*определяется.*на.*основании'
            - '(?i)в.*случае.*спора.*стоимость.*определяется.*независимым.*оценщиком'
    
    # Для защиты от неисполнения
    buyer_seller_protection:
      - clause_id: "consequences_of_non_performance"
        name: "Последствия неисполнения одной из сторон"
        risk_if_missing: |
          При неисполнении одной стороной (отказ от передачи товара) у другой стороны отсутствуют
          четкие механизмы защиты: требовать передачи товара в натуре или расторжения договора
          с возмещением убытков. Неясность влечет судебные споры.
        legal_base: "ст. 328, 450, 463 ГК РФ"
        severity: "high"
        affected_party: "both"
        detection:
          positive_keywords:
            - "ответственность за неисполнение"
            - "расторжение договора"
            - "возмещение убытков"
            - "отказ от исполнения"
            - "неустойка"
            - "штрафные санкции"
            - "право отказаться от договора"
          context_patterns:
            - '(?i)в.*случае.*неисполнения.*сторона.*вправе.*расторгнуть.*договор'
            - '(?i)при.*отказе.*от.*передачи.*товара.*применяются.*последствия'
