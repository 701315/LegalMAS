type: contract_1.9
name: "Договор ренты"
description: |
  Алеаторный (рисковый) договор, по которому получатель ренты передает имущество в собственность плательщику ренты,
  а плательщик обязуется в обмен периодически выплачивать получателю ренту в виде денежной суммы либо предоставлять
  содержание в иной форме. Характеризуется элементом случайности (продолжительность жизни получателя),
  императивным регулированием в защиту "слабой стороны" (получателя) и обязательной нотариальной формой.
  Виды: постоянная рента (бессрочная), пожизненная рента (денежная), пожизненное содержание с иждивением (натуральная).
  Регулируется Главой 33 ГК РФ.
version: 2.0
parent: class_1_transfer_of_ownership
sibling_contracts:
  - contract_1.6  # Договор купли-продажи недвижимости (связь по передаче имущества)
  - contract_1.8  # Договор дарения (альтернатива безвозмездной передаче)
metadata:
  category: contract
  subcategory: ownership_transfer
  complexity: high
  risk_level: critical  # Высокий риск расторжения, оспаривания наследниками, ничтожности при нарушении формы
  legal_base: Глава 33 ГК РФ (ст. 583-605)
  hierarchy_position: "child_specialized"

# ════════════════════════════════════════════════════════════
# БАЗОВАЯ ИНФОРМАЦИЯ (LEGACY SECTIONS)
# ════════════════════════════════════════════════════════════
rules:
  keywords:
    high:
      - "рента"
      - "пожизненная рента"
      - "постоянная рента"
      - "пожизненное содержание"
      - "иждивение"
      - "получатель ренты"
      - "плательщик ренты"
      - "алеаторный договор"
    medium:
      - "рентные платежи"
      - "периодические выплаты"
      - "прожиточный минимум"
      - "обеспечение потребностей"
      - "содержание с иждивением"
      - "нотариальное удостоверение"
      - "залог в силу закона"
    low:
      - "выкупная цена"
      - "обременение рентой"
      - "ритуальные услуги"
      - "индексация ренты"
      - "рентный договор"
      - "договор содержания"
  phrases:
    high:
      - передает в собственность под выплату ренты
      - обязуется осуществлять пожизненное содержание с иждивением
      - имущество считается находящимся в залоге у получателя ренты
      - право требовать выкупа ренты при существенном нарушении
      - риск случайной гибели имущества несет плательщик ренты
    medium:
      - договор подлежит обязательному нотариальному удостоверению
      - размер ренты индексируется пропорционально росту прожиточного минимума
      - плательщик вправе заменить предоставление содержания выплатой денежной суммы
      - получатель вправе расторгнуть договор при просрочке выплаты ренты
      - переход права собственности подлежит государственной регистрации
  patterns:
    required:
      - (?i)(рент|пожизненн.*содержан|иждивенц|иждивени|получател.*ренты|плательщ.*ренты)  # → contract_1.9
    optional:
      - (?i)(прожиточн.*минимум|индексаци.*рент|выкуп.*рент|ренто.*обременен)
  exclusions:
    - аренда (временное пользование)
    - купля-продажа с рассрочкой платежа
    - договор дарения
    - единовременная оплата
  exclusion_logic:
    - condition: "gratuitous_transfer AND no_periodic_payments"
      target: "reclassify"
      confidence: 0.90
      description: "Безвозмездная передача без периодических платежей - это дарение, а не рента"
    - condition: "single_payment_only AND property_transfer"
      target: "rejection"
      confidence: 0.85
      description: "Единовременная оплата при передаче имущества - это купля-продажа"
  weights:
    keyword_high: 3.5
    keyword_medium: 1.5
    keyword_low: 0.5
    phrase_high: 4.0
    phrase_medium: 1.5
    pattern_required: 5.0
    pattern_optional: 1.0
  classification:
    min_confidence: 0.90  # Высокий порог для специфичного договора
    max_matches: 1

party_roles:
  - Получатель ренты (Rent Receiver) - "слабая сторона", лицо, передающее имущество и получающее ренту (часто пожилой гражданин)
  - Плательщик ренты (Rent Payer) - лицо, приобретающее имущество и несущее бремя периодических выплат или содержания

essential_terms:
  - Конкретное имущество, передаваемое под выплату ренты (обычно недвижимость)
  - Вид ренты: постоянная, пожизненная или пожизненное содержание с иждивением
  - Размер, форма (деньги/натура) и периодичность рентных платежей (привязка к прожиточному минимуму)
  - Обеспечение выплаты ренты (залог в силу закона для недвижимости, иное обеспечение)

specific_risks:
  - Ничтожность договора при отсутствии нотариального удостоверения (ст. 584 ГК РФ)
  - Расторжение договора получателем при "несущественных" нарушениях (просрочка, недостаточный уход)
  - Возврат имущества получателю без компенсации расходов плательщика (ст. 605 ГК РФ)
  - Риск случайной гибели имущества лежит на плательщике (продолжает платить ренту)
  - Оспаривание договора наследниками получателя как кабальной сделки
  - Судебные споры о качестве содержания при договоре с иждивением

aliases:
  - Договор пожизненного содержания
  - Договор постоянной ренты
  - Договор пожизненной ренты
  - Рентный договор
  - Договор содержания с иждивением
  - Алеаторный договор ренты

section_markers:
  - Предмет договора (имущество, передаваемое под выплату ренты)
  - Вид, размер и форма рентных платежей
  - Порядок и сроки выплаты ренты (индексация, привязка к ПМ)
  - Условия содержания при договоре с иждивением (детальное описание)
  - Обременение имущества рентой (залог в силу закона)
  - Права и обязанности сторон
  - Условия и порядок выкупа ренты
  - Ответственность сторон и основания расторжения
  - Заключительные положения (нотариальное удостоверение, регистрация)

notes: |
  КРИТИЧЕСКИЕ ТРЕБОВАНИЯ И ОСОБЕННОСТИ ДОГОВОРА РЕНТЫ:
  1. Обязательное нотариальное удостоверение - отсутствие делает договор ничтожным (ст. 584 ГК РФ)
  2. Залог в силу закона - недвижимость автоматически обременяется залогом в пользу получателя (ст. 587 ГК РФ)
  3. Минимальный размер ренты привязан к прожиточному минимуму (ПМ) в соответствующем регионе
  4. Виды ренты и их особенности:
     - Постоянная рента: бессрочная, может выплачиваться деньгами/вещами, право требования переходит по наследству
     - Пожизненная рента: только денежная форма, выплачивается в течение жизни получателя
     - Пожизненное содержание с иждивением: натуральная форма (жилье, питание, уход, лечение, ритуальные услуги)
  5. "Драконовские" меры защиты получателя: право расторжения при малейших нарушениях, возврат имущества без компенсации
  6. Алеаторный (рисковый) характер: продолжительность выплат зависит от продолжительности жизни получателя

# ════════════════════════════════════════════════════════════
# 🆕 ВАЛИДАЦИОННЫЕ СЕКЦИИ (VALIDATION ENGINE v2.0)
# ════════════════════════════════════════════════════════════

validation_metadata:
  validation_version: "2.0"
  last_updated: "2026-02-06"
  author: "Legal AI Team"
  
  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 1: ПРИМЕНИМОЕ ЗАКОНОДАТЕЛЬСТВО
  # ──────────────────────────────────────────────────────────
  legal_base:
    primary:
      - "Глава 33 ГК РФ (ст. 583-605)"
    secondary:
      - "ст. 584 ГК РФ (нотариальная форма договора ренты)"
      - "ст. 587 ГК РФ (обеспечение выплаты ренты, залог в силу закона)"
      - "ст. 590, 597, 602 ГК РФ (минимальный размер ренты и индексация)"
      - "ст. 594, 599, 605 ГК РФ (выкуп ренты и расторжение договора)"
    related:
      - "Основы законодательства РФ о нотариате (требования к нотариальному удостоверению)"
      - "ФЗ-218 «О государственной регистрации недвижимости» (регистрация перехода права и обременения)"
      - "ФЗ-134 «О прожиточном минимуме в РФ» (определение минимального размера ренты)"
      - "ст. 179 ГК РФ (недействительность кабальной сделки)"
      - "ст. 603 ГК РФ (замена содержания денежными выплатами)"

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 2: ОБЯЗАТЕЛЬНЫЕ ЭЛЕМЕНТЫ ДОГОВОРА
  # ──────────────────────────────────────────────────────────
  essential_elements:
    - element: "notarization_requirement"
      name: "Нотариальное удостоверение договора"
      required: true
      legal_base: "ст. 584 ГК РФ"
      description: "Договор ренты, предусматривающий отчуждение имущества под выплату ренты, подлежит обязательному нотариальному удостоверению. Отсутствие нотариальной формы влечет ничтожность договора."
      validation_rules:
        - "notarial_certification_mention"
        - "notary_details_present"
      conditional_checks:
        - trigger: "rent_keywords"
          keywords: ["рента", "пожизненное содержание", "иждивение"]
          rule: "notarization_clause_required"
          legal_base: "ст. 584 ГК РФ"
          severity: "critical"
          risk_msg: "Отсутствие нотариального удостоверения делает договор ренты ничтожным. Нет нотариуса = нет договора."
    
    - element: "rent_type_and_amount"
      name: "Вид, размер и форма рентных платежей"
      required: true
      legal_base: "ст. 590, 597, 602 ГК РФ"
      description: "Должны быть четко определены: вид ренты (постоянная/пожизненная/содержание), размер платежей с привязкой к прожиточному минимуму, форма выплат (денежная/натуральная)."
      validation_rules:
        - "rent_type_specified"
        - "payment_amount_defined"
        - "subsistence_minimum_link"
      conditional_checks:
        - trigger: "lifetime_maintenance"
          keywords: ["пожизненное содержание", "иждивение", "уход", "забота"]
          rule: "detailed_maintenance_standards_required"
          legal_base: "ст. 602 ГК РФ"
          severity: "critical"
          validation_rules:
            - "maintenance_scope_detailed"
            - "funeral_services_included"
        
        - trigger: "monetary_rent"
          keywords: ["пожизненная рента", "постоянная рента", "денежные выплаты"]
          rule: "indexation_mechanism_required"
          legal_base: "ст. 590, 597 ГК РФ"
          severity: "critical"
          validation_rules:
            - "inflation_protection_present"
            - "subsistence_minimum_reference"
    
    - element: "property_description_and_encumbrance"
      name: "Описание имущества и обременение рентой"
      required: true
      legal_base: "ст. 583, 586, 587 ГК РФ"
      description: "Имущество должно быть индивидуально определено. При передаче недвижимости возникает залог в силу закона в пользу получателя ренты. Обременение подлежит государственной регистрации."
      validation_rules:
        - "property_specified"
        - "property_identifiable"
      conditional_checks:
        - trigger: "real_estate_transfer"
          keywords: ["квартира", "дом", "земельный участок", "недвижимость"]
          rule: "statutory_pledge_automatic"
          legal_base: "ст. 587 ГК РФ"
          severity: "critical"
          risk_msg: "Недвижимость, переданная под выплату ренты, автоматически считается находящейся в залоге у получателя. Это залог в силу закона."
          validation_rules:
            - "statutory_pledge_clause"
            - "encumbrance_registration_required"
    
    - element: "rent_payment_security"
      name: "Обеспечение выплаты ренты"
      required: true
      legal_base: "ст. 587 ГК РФ"
      description: "Помимо залога в силу закона для недвижимости, договор может предусматривать дополнительные меры обеспечения: поручительство, страхование, неустойку. Для движимого имущества обеспечение обязательно."
      validation_rules:
        - "security_mechanism_specified"
      conditional_checks:
        - trigger: "movable_property"
          keywords: ["автомобиль", "ценные бумаги", "движимое имущество", "не являются недвижимостью"]
          rule: "additional_security_required"
          legal_base: "ст. 587 п. 2 ГК РФ"
          severity: "high"
          validation_rules:
            - "collateral_or_guarantee_present"

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 3: ЗАЩИТНЫЕ УСЛОВИЯ (PROTECTIVE CLAUSES)
  # ──────────────────────────────────────────────────────────
  protective_clauses:
    
    # --- ЗАЩИТА ПОЛУЧАТЕЛЯ РЕНТЫ (Rent Receiver Protection) ---
    seller_protection:
      - clause_id: "indexation_and_subsistence_link"
        name: "Индексация ренты и привязка к прожиточному минимуму"
        risk_if_missing: |
          По закону размер ренты должен индексироваться пропорционально росту прожиточного минимума.
          Фиксированная сумма без индексации ущемляет права получателя, особенно при длительных сроках.
          Суд может применить индексацию принудительно и взыскать недоплаченные суммы за весь период.
        legal_base: "ст. 590, 597, 602 ГК РФ"
        severity: "critical"
        affected_party: "seller"
        detection:
          positive_keywords:
            - "прожиточный минимум"
            - "индексация размера ренты"
            - "пропорционально росту"
            - "ежегодное увеличение"
            - "индекс потребительских цен"
            - "корректировка размера выплат"
            - "привязка к величине ПМ"
            - "инфляционная защита"
          context_patterns:
            - '(?i)размер.*ренты.*подлежит.*индексации.*пропорционально.*росту.*прожиточного.*минимума'
            - '(?i)ежегодно.*увеличивается.*в.*соответствии.*с.*изменением.*величины.*прожиточного.*минимума'
      
      - clause_id: "redemption_right_on_breach"
        name: "Право требовать выкупа ренты при нарушении плательщиком"
        risk_if_missing: |
          При существенном нарушении плательщиком своих обязательств (просрочка выплат, ненадлежащее содержание)
          получатель имеет право потребовать выкупа ренты либо возврата имущества. Отсутствие этого условия
          не лишает получателя права по закону, но создает неопределенность в процедуре и размере выкупа.
        legal_base: "ст. 594, 599, 605 ГК РФ"
        severity: "critical"
        affected_party: "seller"
        detection:
          positive_keywords:
            - "право требовать выкупа ренты"
            - "при существенном нарушении обязательств"
            - "выкупная цена ренты"
            - "просрочка выплаты ренты"
            - "ненадлежащее исполнение"
            - "возврат имущества"
            - "расторжение договора"
            - "требование о выкупе"
            - "выкуп по требованию получателя"
          context_patterns:
            - '(?i)получатель.*ренты.*вправе.*потребовать.*выкупа.*ренты.*при.*нарушении.*плательщиком'
            - '(?i)в.*случае.*просрочки.*выплаты.*ренты.*более.*чем.*на.*\\d+.*дней.*рента.*подлежит.*выкупу'
      
      - clause_id: "detailed_maintenance_standards"
        name: "Детальные стандарты содержания при договоре с иждивением"
        risk_if_missing: |
          Общие фразы "обеспечивать потребности" или "предоставлять содержание" трактуются судами в максимальном
          объеме в пользу получателя. Плательщик может оказаться обязанным предоставлять услуги и товары,
          которые он не планировал. Детализация защищает обе стороны от субъективных трактовок.
        legal_base: "ст. 602 ГК РФ"
        severity: "high"
        affected_party: "seller"
        detection:
          positive_keywords:
            - "питание (завтрак, обед, ужин)"
            - "лекарства и медицинская помощь"
            - "одежда и обувь"
            - "уборка помещения"
            - "гигиенические процедуры"
            - "прогулки и досуг"
            - "ритуальные услуги"
            - "перечень предоставляемых услуг"
            - "график посещений врача"
            - "нормы питания"
          context_patterns:
            - '(?i)содержание.*включает.*в.*себя.*следующие.*конкретные.*услуги'
            - '(?i)плательщик.*обязуется.*ежемесячно.*предоставлять.*продуктовый.*набор.*в.*составе'
        conditional_checks:
          - trigger: "dependency_contract_type"
            keywords: ["пожизненное содержание", "иждивение", "содержание с иждивением"]
            rule: "detailed_scope_required"
            severity: "critical"

    # --- ЗАЩИТА ПЛАТЕЛЬЩИКА РЕНТЫ (Rent Payer Protection) ---
    buyer_protection:
      - clause_id: "buyout_right_permanent_rent"
        name: "Право на выкуп постоянной ренты"
        risk_if_missing: |
          Плательщик постоянной ренты имеет право выкупить ее в любое время, уведомив получателя за 3 месяца.
          Это право является императивным - отказ от него ничтожен. Отсутствие условия о выкупе не лишает права,
          но создает неопределенность в процедуре и расчете выкупной цены.
        legal_base: "ст. 592-593 ГК РФ"
        severity: "high"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "право плательщика на выкуп"
            - "выкуп постоянной ренты"
            - "отказ от дальнейшей выплаты"
            - "выкупная цена"
            - "уведомление за 3 месяца"
            - "прекращение ренты путем выкупа"
            - "выкуп по инициативе плательщика"
            - "право прекратить обязательство"
          context_patterns:
            - '(?i)плательщик.*постоянной.*ренты.*вправе.*отказаться.*от.*дальнейшей.*выплаты.*путем.*выкупа'
            - '(?i)выкуп.*ренты.*осуществляется.*по.*цене.*равной.*годовой.*сумме.*ренты'
        conditional_checks:
          - trigger: "permanent_rent_type"
            keywords: ["постоянная рента", "бессрочная рента"]
            rule: "buyout_clause_required"
            severity: "high"
      
      - clause_id: "substitution_of_care_with_money"
        name: "Замена содержания денежными выплатами"
        risk_if_missing: |
          При договоре с иждивением возникают субъективные споры о качестве услуг ("плохо помыли пол").
          Право (или обязанность) заменить натуральный уход на фиксированную денежную сумму снижает
          риск расторжения договора из-за субъективных претензий. Это защищает плательщика от злоупотреблений.
        legal_base: "ст. 603 ГК РФ"
        severity: "high"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "замена содержания"
            - "денежный эквивалент"
            - "выплата денежных сумм вместо содержания"
            - "право плательщика заменить содержание"
            - "фиксированная денежная компенсация"
            - "альтернатива натуральному предоставлению"
          context_patterns:
            - '(?i)плательщик.*вправе.*заменить.*предоставление.*содержания.*выплатой.*денежной.*суммы'
            - '(?i)по.*соглашению.*сторон.*натуральное.*содержание.*может.*быть.*заменено.*денежными.*выплатами'

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 4: ДОПОЛНИТЕЛЬНЫЕ PROTECTIVE CLAUSES
  # ──────────────────────────────────────────────────────────
  additional_protective_clauses:
    
    # Защита от оспаривания как кабальной сделки
    seller_protection:
      - clause_id: "unconscionability_protection"
        name: "Защита от признания кабальной сделкой"
        risk_if_missing: |
          Договоры ренты с пожилыми получателями часто оспариваются наследниками как кабальные
          (крайне невыгодные при стечении тяжелых обстоятельств). Отсутствие доказательств
          справедливости условий, нотариального разъяснения последствий и независимой оценки
          может привести к признанию сделки недействительной по ст. 179 ГК РФ.
        legal_base: "ст. 179 ГК РФ"
        severity: "critical"
        affected_party: "seller"
        detection:
          positive_keywords:
            - "не является кабальной сделкой"
            - "стороны действуют добровольно"
            - "получатель осознает последствия"
            - "нотариальное разъяснение предоставлено"
            - "независимая оценка имущества проведена"
            - "условия являются справедливыми"
            - "рыночная стоимость имущества"
            - "отсутствие стечения тяжелых обстоятельств"
          context_patterns:
            - '(?i)стороны.*подтверждают.*что.*договор.*не.*является.*кабальной.*сделкой'
            - '(?i)нотариус.*разъяснил.*получателю.*ренты.*все.*правовые.*последствия.*договора'
        conditional_checks:
          - trigger: "elderly_recipient"
            keywords: ["пенсионер", "пожилой", "преклонный возраст", "инвалид", "нуждающийся"]
            rule: "unconscionability_protections_required"
            severity: "critical"
    
    # Ритуальные услуги как обязательный элемент
    seller_protection:
      - clause_id: "funeral_services_inclusion"
        name: "Включение оплаты ритуальных услуг"
        risk_if_missing: |
          Для договора пожизненного содержания с иждивением оплата ритуальных услуг является
          обязательным элементом содержания по смыслу ст. 602 ГК РФ. Отсутствие этого условия
          не освобождает плательщика от обязанности, но создает неопределенность в объеме и стоимости.
        legal_base: "ст. 602 ГК РФ"
        severity: "medium"
        affected_party: "seller"
        detection:
          positive_keywords:
            - "ритуальные услуги"
            - "погребение"
            - "похороны"
            - "организация похорон"
            - "оплата ритуальных услуг"
            - "обеспечение достойных похорон"
            - "расходы на погребение"
          context_patterns:
            - '(?i)плательщик.*ренты.*обязуется.*обеспечить.*организацию.*и.*оплату.*ритуальных.*услуг'
            - '(?i)в.*случае.*смерти.*получателя.*ренты.*плательщик.*осуществляет.*его.*погребение'
        conditional_checks:
          - trigger: "lifetime_maintenance_type"
            keywords: ["пожизненное содержание", "иждивение"]
            rule: "funeral_clause_required"
            severity: "medium"
    
    # Распределение риска случайной гибели
    buyer_protection:
      - clause_id: "risk_of_accidental_loss_allocation"
        name: "Распределение риска случайной гибели имущества"
        risk_if_missing: |
          По умолчанию риск случайной гибели или повреждения переданного имущества несет плательщик ренты,
          который продолжает выплачивать ренту. Отсутствие явного указания на это правило может привести
          к спорам при наступлении страхового случая. Особенно важно предусмотреть страхование имущества.
        legal_base: "ст. 595, 600 ГК РФ"
        severity: "high"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "риск случайной гибели"
            - "риск повреждения имущества"
            - "несет плательщик ренты"
            - "обязанность по сохранению имущества"
            - "страхование имущества"
            - "ответственность за сохранность"
            - "гибель имущества не освобождает от выплаты ренты"
            - "обязательное страхование"
          context_patterns:
            - '(?i)риск.*случайной.*гибели.*имущества.*несет.*плательщик.*ренты'
            - '(?i)плательщик.*ренты.*обязан.*застраховать.*имущество.*от.*случайной.*гибели'
    
    # Защита от злоупотреблений при содержании
    seller_protection:
      - clause_id: "protection_against_abuse_in_care"
        name: "Защита от злоупотреблений при пожизненном содержании"
        risk_if_missing: |
          При договоре пожизненного содержания существует риск злоупотреблений со стороны плательщика:
          изоляция получателя от родственников, ограничение доступа к медицинской помощи, психологическое давление.
          Отсутствие механизмов контроля и права на посещение создает опасные условия для получателя.
        legal_base: "ст. 602 ГК РФ"
        severity: "critical"
        affected_party: "seller"
        detection:
          positive_keywords:
            - "право на посещение родственниками"
            - "независимый контроль качества ухода"
            - "запрет на изоляцию получателя"
            - "право на общение с внешним миром"
            - "периодические проверки условий"
            - "участие социальных служб"
            - "запрет на психологическое давление"
            - "право получателя на жалобы"
            - "доступ медицинских работников"
          context_patterns:
            - '(?i)получатель.*ренты.*имеет.*право.*на.*посещение.*родственниками.*и.*друзьями'
            - '(?i)качество.*ухода.*может.*проверяться.*социальными.*службами.*или.*уполномоченными.*лицами'
        conditional_checks:
          - trigger: "lifetime_maintenance_contract"
            keywords: ["пожизненное содержание", "иждивение", "уход", "забота"]
            rule: "abuse_protection_mechanisms_required"
            severity: "critical"
    
    # Условия прекращения ренты
    buyer_protection:
      - clause_id: "termination_conditions_and_procedure"
        name: "Условия и порядок прекращения рентных обязательств"
        risk_if_missing: |
          Неясность в условиях прекращения ренты (смерть получателя, выкуп, существенное нарушение)
          создает неопределенность для обеих сторон. Особенно важно для пожизненной ренты -
          какие доказательства смерти требуются, сроки уведомления, порядок снятия обременения.
        legal_base: "ст. 596, 605 ГК РФ"
        severity: "high"
        affected_party: "both"
        detection:
          positive_keywords:
            - "прекращение ренты"
            - "в случае смерти получателя"
            - "предоставление свидетельства о смерти"
            - "уведомление о смерти"
            - "обязанности плательщика после смерти"
            - "возврат документов"
            - "прекращение обременения"
            - "снятие с регистрационного учета"
            - "срок для предоставления документов"
          context_patterns:
            - '(?i)ренточные.*обязательства.*прекращаются.*в.*случае.*смерти.*получателя.*ренты'
            - '(?i)плательщик.*ренты.*обязан.*предоставить.*свидетельство.*о.*смерти.*для.*снятия.*обременения'
