type: contract_9.3
name: Брачный договор (брачный контракт)
description: |
  Соглашение лиц, вступающих в брак, или супругов, определяющее **исключительно имущественные права
  и обязанности** супругов в браке и (или) в случае его расторжения. Позволяет изменить установленный
  законом режим совместной собственности супругов на режим раздельной, долевой или смешанной собственности.
  **Не может регулировать личные неимущественные отношения** (любовь, уважение), права и обязанности
  в отношении детей, ограничивать правоспособность или дееспособность супругов, содержать условия,
  ставящие одного из супругов в крайне неблагоприятное положение или противоречащие основам
  семейного законодательства. Требует обязательного нотариального удостоверения; несоблюдение формы
  влечет ничтожность договора. Является инструментом планирования имущественных последствий брака
  и его возможного распада. Регулируется Главой 8 Семейного кодекса РФ (ст. 40–44).
version: 2.0
parent: class_9_special_imperative
metadata:
  category: contract
  subcategory: family_law
  complexity: high
  risk_level: high
  legal_base: "Семейный кодекс РФ (Глава 8, ст. 40-46)"

