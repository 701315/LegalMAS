# БАЗОВАЯ ИНФОРМАЦИЯ (LEGACY SECTIONS — ОПТИМИЗИРОВАНО)
# ════════════════════════════════════════════════════════════
rules:
  keywords:
    high:
      - "брачный договор"
      - "брачный контракт"
      - "супруги"
      - "лица, вступающие в брак"
      - "имущественные права и обязанности"
      - "нотариальное удостоверение"
      - "режим имущества супругов"
    medium:
      - "совместная собственность супругов"
      - "раздельная собственность супругов"
      - "долевая собственность супругов"
      - "имущество, нажитое в браке"
      - "добрачное имущество"
      - "расторжение брака"
      - "раздел имущества"
    low:
      - "семейные расходы"
      - "взаимное содержание"
      - "алиментные обязательства"
      - "кредитные обязательства супругов"
      - "изменение брачного договора"
      - "унаследованное имущество"
  phrases:
    high:
      - Брачный договор заключен между лицами, вступающими в брак (или супругами)
      - Имущество, нажитое супругами во время брака, является совместной собственностью
      - Стороны устанавливают режим раздельной собственности на имущество, приобретаемое каждым из супругов
      - В случае расторжения брака квартира, приобретенная в период брака, переходит в собственность [ФИО супруга]
      - Настоящий договор подлежит нотариальному удостоверению
    medium:
      - Каждый из супругов самостоятельно несет ответственность по своим обязательствам
      - Стороны вправе изменить установленный настоящим договором режим собственности
      - Расходы на содержание жилого помещения несут супруги пропорционально их доходам
      - Доходы от предпринимательской деятельности являются собственностью супруга, осуществляющего такую деятельность
      - Драгоценности, предметы роскоши, приобретенные в браке, являются собственностью того супруга, который ими пользовался
  patterns:
    required:
      - (?i)(брачн\w+\s+(договор|контракт)|супруг\w+|имущественн\w+\s+прав\w+\s+и\s+обязанност\w+|режим\s+собственност\w+\s+супруг\w+)
    optional:
      - (?i)(нотариальн\w+\s+удостоверени\w+|раздел\w+\s+имуществ\w+|расторжени\w+\s+брак\w+)
      - (?i)(долев\w+\s+собственност\w+|раздельн\w+\s+собственност\w+|совместн\w+\s+собственност\w+)
  exclusions:
    - соглашение о разделе общего имущества супругов (одноразовый акт)
    - соглашение об уплате алиментов (особенно на детей)
    - соглашение о порядке осуществления родительских прав
    - договор дарения между супругами
    - предварительный договор купли-продажи
  exclusion_logic:
    - condition: "child_custody_keywords OR parental_rights"
      target: "rejection"
      confidence: 0.95
      description: "Если документ регулирует вопросы детей (место жительства, алименты детям, общение) — это не брачный договор"
    - condition: "one_time_division AND existing_property_only"
      target: "rejection"
      confidence: 0.85
      description: "Если документ касается раздела уже нажитого имущества без регулирования будущего режима — это соглашение о разделе"
  weights:
    keyword_high: 3.0
    keyword_medium: 1.5
    keyword_low: 0.5
    phrase_high: 2.5
    phrase_medium: 1.0
    pattern_required: 4.0
    pattern_optional: 1.0
  classification:
    min_confidence: 0.75
    max_matches: 3

party_roles:
  - "Супруг(а) 1 (или лицо, вступающее в брак)"
  - "Супруг(а) 2 (или лицо, вступающее в брак)"

essential_terms:
  - "Стороны договора (ФИО, паспортные данные)."
  - "Предмет договора — имущественные отношения супругов, подлежащие регулированию."
  - "Режим собственности на имущество супругов (совместная, долевая, раздельная или смешанная)."
  - "Права и обязанности супругов по взаимному содержанию, порядок несения семейных расходов."
  - "Порядок раздела имущества в случае расторжения брака."
  - "Условия об ответственности сторон за нарушение договора."

specific_risks:
  - "**КРИТИЧЕСКИЙ:** Риск признания договора недействительным (ничтожным) полностью или в части, если его условия ставят одного из супругов в крайне неблагоприятное положение (ст. 44 СК РФ). Например, полный отказ от имущественных прав при наличии детей или длительном браке."
  - "**Для более слабой стороны:** Риск заключения договора под влиянием обмана, заблуждения, угрозы, стечения тяжелых обстоятельств (кабальная сделка по ст. 179 ГК РФ), особенно накануне брака."
  - "**Для более слабой стороны:** Невозможность ограничить право нетрудоспособного нуждающегося супруга на получение содержания (ст. 42 СК РФ). Такие условия ничтожны."
  - "**Для обеих сторон:** Споры о толковании условий договора при расторжении брака, особенно при нечетких формулировках, отсутствии идентификации имущества."
  - "**Для обеих сторон:** Риски, связанные с кредиторами: изменение режима собственности не влияет на права кредиторов, которые могли не знать об условиях договора (ст. 46 СК РФ). Супруг-должник обязан уведомить кредиторов."
  - "**Для супруга-предпринимателя:** Риск обращения взыскания кредиторов на общее имущество, несмотря на режим раздельности, установленный договором, если кредиторы не были уведомлены."
  - "**Процедурный риск:** Несоблюдение обязательной нотариальной формы влечет недействительность (ничтожность) договора (ст. 41 СК РФ)."
  - "**Для кредиторов:** Риск сокрытия имущества должника через брачный договор, что может быть основанием для оспаривания в рамках банкротства."

aliases:
  - Брачный договор
  - Брачный контракт
  - Antenuptial agreement / Prenuptial agreement (Prenup)
  - Postnuptial agreement
  - Договор о режиме имущества супругов

section_markers:
  - Преамбула (стороны, основание заключения)
  - Предмет договора
  - Режим собственности на добрачное имущество каждого из супругов
  - Режим собственности на имущество, нажитое супругами в период брака
  - Права и обязанности супругов по взаимному содержанию (алименты)
  - Порядок несения семейных расходов
  - Ответственность супругов по обязательствам
  - Порядок раздела имущества в случае расторжения брака
  - Порядок изменения и расторжения брачного договора
  - Ответственность сторон за нарушение условий договора
  - Заключительные положения (вступление в силу, нотариальные расходы)
  - Подписи сторон

notes: |
  КРИТИЧЕСКИ ВАЖНЫЕ АСПЕКТЫ (императивные ограничения):
  1.  **Обязательная нотариальная форма** (ст. 41 СК РФ). Без нотариального удостоверения договор ничтожен.
  2.  **Предмет ограничен:** Только имущественные отношения. Нельзя включать условия:
      * О личных неимущественных отношениях (любовь, верность, выбор фамилии).
      * О правах и обязанностях в отношении детей (алименты, место жительства, общение).
      * Ограничивающие право на обращение в суд.
      * Ограничивающие правоспособность или дееспособность супруга.
  3.  **Запрет крайне неблагоприятного положения:** Условия, ставящие одного из супругов в крайне неблагоприятное положение (например, полный отказ от имущества при наличии детей), ничтожны (ст. 44 СК РФ).
  4.  **Невозможность отказа от алиментов:** Нельзя ограничить право нетрудоспособного нуждающегося супруга на получение содержания (ст. 42 СК РФ).
  5.  **Момент вступления в силу:** Заключенный до брака вступает в силу со дня государственной регистрации брака (ст. 41 СК РФ). Заключенный в браке — с момента нотариального удостоверения.
  6.  **Изменение/расторжение:** Только по взаимному согласию супругов, в нотариальной форме. Односторонний отказ не допускается. Через суд — по основаниям, предусмотренным ГК РФ для изменения/расторжения договоров.
  7.  **Обращение взыскания кредиторов:** Супруг-должник обязан уведомить своих кредиторов о заключении, изменении или расторжении брачного договора (ст. 46 СК РФ). В противном случае супруг отвечает по своим обязательствам независимо от содержания договора.

