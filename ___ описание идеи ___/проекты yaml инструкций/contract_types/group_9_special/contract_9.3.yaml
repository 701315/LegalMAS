validation_metadata:
  validation_version: "2.0"
  last_updated: "2026-02-07"
  author: "Legal AI Team"

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 1: ПРИМЕНИМОЕ ЗАКОНОДАТЕЛЬСТВО
  # ──────────────────────────────────────────────────────────
  legal_base:
    primary:
      - "Семейный кодекс РФ, Глава 8 (ст. 40–44) — договорный режим имущества супругов"
    secondary:
      - "ст. 40 СК РФ — понятие брачного договора"
      - "ст. 41 СК РФ — заключение брачного договора, форма"
      - "ст. 42 СК РФ — содержание брачного договора (что можно и нельзя включать)"
      - "ст. 43 СК РФ — изменение и расторжение брачного договора"
      - "ст. 44 СК РФ — признание брачного договора недействительным"
      - "ст. 45 СК РФ — обращение взыскания на имущество супругов"
      - "ст. 46 СК РФ — гарантии прав кредиторов при заключении, изменении и расторжении брачного договора"
      - "ст. 33–39 СК РФ — законный режим имущества супругов (для сравнения)"
    related:
      - "Гражданский кодекс РФ (Глава 9 — сделки, Глава 29 — изменение и расторжение договора)"
      - "Гражданский кодекс РФ (ст. 179 — недействительность сделки, совершенной под влиянием обмана, насилия, угрозы, стечения тяжелых обстоятельств)"
      - "Основы законодательства РФ о нотариате (требования к нотариальной форме)"
      - "Федеральный закон от 26.10.2002 № 127-ФЗ «О банкротстве» (оспаривание брачного договора в банкротстве)"
      - "Постановление Пленума Верховного Суда РФ от 05.11.1998 № 15 «О применении судами законодательства при рассмотрении дел о расторжении брака»"

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 2: ОБЯЗАТЕЛЬНЫЕ ЭЛЕМЕНТЫ ДОГОВОРА
  # ──────────────────────────────────────────────────────────
  essential_elements:
    - element: "notarial_certification_and_form"
      required: true
      legal_base: "ст. 41 СК РФ"
      description: "Явное указание на то, что договор подлежит нотариальному удостоверению. Без нотариального удостоверения и соответствующей отметки нотариуса договор является ничтожным."
      validation_rules:
        - "notarial_certification_mentioned"
        - "notarial_form_required_statement"
      conditional_checks:
        - trigger: "prenuptial_agreement_keywords"
          keywords: ["брачный договор", "брачный контракт", "супруги", "лица, вступающие в брак"]
          rule: "notarial_form_mandatory"
          legal_base: "ст. 41 СК РФ"
          severity: "critical"
          risk_msg: "Брачный договор, не удостоверенный нотариусом, является ничтожной сделкой и не порождает правовых последствий."

    - element: "property_regime_definition"
      required: true
      legal_base: "ст. 42 СК РФ"
      description: "Определение правового режима имущества супругов: на добрачное имущество, на имущество, нажитое в браке (совместная, долевая, раздельная собственность). Должно быть конкретно и ясно, с возможностью указания отдельных объектов."
      validation_rules:
        - "property_regime_specified"
        - "clear_distinction_premarital_vs_marital"
      conditional_checks:
        - trigger: "vague_property_regime"
          keywords: ["по договоренности", "по справедливости", "по усмотрению супругов", "по решению сторон"]
          rule: "property_regime_must_be_concrete"
          legal_base: "ст. 42 СК РФ"
          severity: "high"
          risk_msg: "Режим собственности должен быть определен четко и недвусмысленно, иначе при споре будет применяться законный режим совместной собственности."

    - element: "exclusion_of_personal_and_child_related_matters"
      required: true
      legal_base: "ст. 42 СК РФ"
      description: "В договоре не должно быть условий, регулирующих личные неимущественные отношения (любовь, верность), а также права и обязанности в отношении детей (место жительства, порядок общения, алименты на детей)."
      validation_rules:
        - "no_child_custody_provisions"
        - "no_personal_relationship_conditions"
      conditional_checks:
        - trigger: "personal_or_child_related_keywords"
          keywords: ["воспитание детей", "место жительства ребенка", "порядок общения с детьми", "верность", "любовь", "уважение", "выбор фамилии"]
          rule: "personal_matters_prohibited"
          legal_base: "ст. 42 СК РФ"
          severity: "critical"
          risk_msg: "Включение условий о личных неимущественных отношениях или правах в отношении детей делает эти условия ничтожными. В судебной практике это также может негативно повлиять на оценку договора в целом."

    - element: "prohibition_of_extremely_unfavorable_conditions"
      required: true
      legal_base: "ст. 44 СК РФ"
      description: "В договоре не должно быть условий, которые ставят одного из супругов в крайне неблагоприятное положение. Нотариус обязан проверять это при удостоверении. Оценка производится на момент заключения договора, но с учетом возможных будущих обстоятельств."
      validation_rules:
        - "check_for_gross_disparity"
      conditional_checks:
        - trigger: "total_waiver_of_property_rights"
          keywords: ["отказывается от всего имущества", "не претендует на имущество", "вся собственность переходит", "лишается права на долю"]
          rule: "no_extremely_unfavorable_position"
          legal_base: "ст. 44 СК РФ"
          severity: "critical"
          risk_msg: "Условие, по которому один супруг полностью отказывается от прав на общее имущество или лишается жилья, может быть признано ставящим его в крайне неблагоприятное положение и ничтожным, особенно в длительном браке или при наличии детей."

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 3: ЗАЩИТНЫЕ УСЛОВИЯ (PROTECTIVE CLAUSES)
  # ──────────────────────────────────────────────────────────
  protective_clauses:
    # --- ЗАЩИТА ЭКОНОМИЧЕСКИ БОЛЕЕ СЛАБОЙ СТОРОНЫ (Часто супруг(а), не имеющий(ая) собственного дохода / Buyer Protection) ---
    buyer_protection:
      - clause_id: "protection_from_gross_imbalance_and_housing"
        name: "Защита от грубого дисбаланса и гарантии жилищных прав"
        risk_if_missing: |
          Супруг, не имеющий собственного дохода (занимающийся домашним хозяйством, воспитанием детей)
          или существенно меньший доход, может согласиться на режим раздельности, который лишит его
          прав на имущество, нажитое в браке. Особенно критично лишение права на жилье. При разводе
          такой супруг останется без средств к существованию и крыши над головой. Договор должен
          содержать компенсационные механизмы (фиксированные выплаты, право пользования жильем,
          долю в конкретных активах).
        legal_base: "ст. 44 СК РФ, ст. 31 ЖК РФ"
        severity: "critical"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "независимо от режима собственности"
            - "в случае расторжения брака [Супруг А] выплачивает [Супругу Б] компенсацию"
            - "право на долю в квартире/бизнесе"
            - "компенсация за ведение домашнего хозяйства"
            - "гарантированный минимум при разделе"
            - "сохранение права пользования жилым помещением"
            - "обеспечение жильём при расторжении брака"
          context_patterns:
            - '(?i)несмотря\s+на\s+режим\s+раздельной\s+собственности.*супруг\s+имеет\s+право\s+на'
            - '(?i)в\s+целях\s+защиты\s+интересов.*устанавливается\s+фиксированная\s+выплата'

      - clause_id: "alimony_rights_preservation_for_disabled_spouse"
        name: "Сохранение права на алименты для нетрудоспособного нуждающегося супруга"
        risk_if_missing: |
          Брачный договор не может ограничить право супруга на получение содержания (алиментов), если он
          стал нетрудоспособным и нуждается в помощи (ст. 42 СК РФ). Эта норма императивна. Условия об
          отказе от алиментов в таких случаях ничтожны. Стороны могут конкретизировать размер, порядок
          и сроки выплаты алиментов, улучшив положение слабой стороны по сравнению с законом.
        legal_base: "ст. 42, 89-92 СК РФ"
        severity: "critical"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "право на содержание (алименты)"
            - "в случае нетрудоспособности и нуждаемости"
            - "размер алиментов устанавливается в сумме"
            - "обязанность по содержанию супруга-инвалида"
            - "алиментные обязательства сохраняются"
            - "не ограничивает право на содержание"
          context_patterns:
            - '(?i)в\s+случае\s+нуждаемости\s+и\s+нетрудоспособности.*супруг\s+обязан\s+уплачивать\s+содержание'
            - '(?i)право\s+на\s+алименты.*в\s+соответствии\s+со\s+ст.\s+89\s+СК\s+РФ'

      - clause_id: "compensation_for_homemaker_and_childcare"
        name: "Компенсация супругу, ведущему домашнее хозяйство и воспитывающему детей"
        risk_if_missing: |
          Супруг, посвятивший себя семье (ведение домашнего хозяйства, уход за детьми), не имеет
          самостоятельного дохода и накоплений. Его вклад в благосостояние семьи не выражен в деньгах,
          но имеет огромную ценность. При режиме раздельной собственности такой супруг может остаться
          без имущества при разводе. Справедливо предусмотреть компенсацию за этот вклад.
        legal_base: "ст. 39, 42, 44 СК РФ (принцип справедливости)"
        severity: "high"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "ведение домашнего хозяйства"
            - "уход за детьми"
            - "вклад в семью"
            - "компенсация неработающему супругу"
            - "учёт вклада в благосостояние семьи"
            - "возмещение затрат на содержание семьи"
          context_patterns:
            - '(?i)супруг.*ведущий\s+домашнее\s+хозяйство.*имеет\s+право\s+на\s+компенсацию'
            - '(?i)при\s+расторжении\s+брака\s+учитывается\s+вклад.*не\s+имевшего\s+дохода'

    # --- ЗАЩИТА ИНТЕРЕСОВ СУПРУГА-ПРЕДПРИНИМАТЕЛЯ / ОБЛАДАТЕЛЯ КАПИТАЛА (Seller Protection) ---
    seller_protection:
      - clause_id: "clear_separation_of_business_assets_and_corporate_rights"
        name: "Четкое отделение бизнес-активов, корпоративных прав и доходов от них"
        risk_if_missing: |
          При законном режиме совместной собственности супруг, не участвующий в бизнесе, имеет право на
          половину долей/акций и доходов от предпринимательской деятельности. Это создает риски для
          управления, возможности привлечения инвесторов и раздела бизнеса при разводе. Брачный договор
          должен однозначно отнести бизнес, его доли, акции, интеллектуальную собственность и будущие
          доходы к раздельной собственности супруга-предпринимателя.
        legal_base: "ст. 42 СК РФ, ФЗ-14 «Об ООО»"
        severity: "critical"
        affected_party: "seller"
        detection:
          positive_keywords:
            - "доли в уставном капитале ООО"
            - "акции"
            - "доходы от предпринимательской деятельности"
            - "бизнес (предприятие)"
            - "интеллектуальная собственность"
            - "корпоративные права"
            - "являются раздельной собственностью супруга-предпринимателя"
            - "не подлежат разделу"
          context_patterns:
            - '(?i)акции\s+и\s+доли\s+в\s+коммерческих\s+организациях.*признаются\s+собственностью\s+супруга'
            - '(?i)бизнес.*и\s+все\s+связанные\s+с\s+ним\s+активы.*являются\s+раздельной\s+собственностью'

      - clause_id: "protection_of_inherited_and_gifted_property"
        name: "Защита имущества, полученного по безвозмездным сделкам (наследство, дар)"
        risk_if_missing: |
          По закону имущество, полученное одним супругом по наследству или в дар, является его личной
          собственностью (ст. 36 СК РФ). Однако на практике при смешении средств, совместном
          использовании или вложениях в улучшение такого имущества за счет общих средств могут
          возникать споры. Прямое подтверждение этого правила в брачном договоре, а также отказ второго
          супруга от любых претензий на такое имущество в будущем, усиливает защиту.
        legal_base: "ст. 36, 42 СК РФ"
        severity: "high"
        affected_party: "seller"
        detection:
          positive_keywords:
            - "имущество, полученное по наследству"
            - "имущество, полученное в дар"
            - "по безвозмездным сделкам"
            - "является раздельной собственностью получившего супруга"
            - "второй супруг не претендует"
            - "доходы от личного имущества"
          context_patterns:
            - '(?i)имущество,\s+полученное\s+по\s+наследству\s+или\s+в\s+дар.*является\s+собственностью\s+получившего'
            - '(?i)супруги\s+подтверждают,\s+что.*не\s+является\s+общим\s+имуществом\s+супругов'

      - clause_id: "detailed_division_scenario_and_debt_allocation"
        name: "Детальный сценарий раздела при разводе и распределение долгов"
        risk_if_missing: |
          Без четко прописанного механизма раздела (конкретные объекты, кому переходят, порядок
          передачи, оценка, сроки, компенсации) и распределения долговых обязательств процесс развода
          может превратиться в затяжной судебный конфликт с дорогостоящими экспертизами. Детализация
          дает предсказуемость, снижает конфликтность и издержки.
        legal_base: "ст. 42, 45 СК РФ"
        severity: "high"
        affected_party: "seller"
        detection:
          positive_keywords:
            - "приложение с перечнем имущества"
            - "порядок оценки имущества при разделе"
            - "срок передачи имущества/выплаты компенсации"
            - "конкретные объекты переходят к конкретному супругу"
            - "независимый оценщик"
            - "личные долги"
            - "общие долги"
            - "ответственность по обязательствам"
          context_patterns:
            - '(?i)в\s+случае\s+расторжения\s+брака.*квартира.*переходит\s+в\s+собственность\s+супруга\s+А'
            - '(?i)раздел\s+осуществляется\s+в\s+соответствии\s+с\s+приложением\s+№'

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 4: ДОПОЛНИТЕЛЬНЫЕ PROTECTIVE CLAUSES
  # ──────────────────────────────────────────────────────────
  additional_protective_clauses:
    both_protection:
      - clause_id: "procedure_for_amendment_termination_and_disputes"
        name: "Процедура изменения, расторжения и разрешения споров"
        risk_if_missing: |
          Жизненные обстоятельства меняются. Без предусмотренной процедуры внесения изменений
          (требуется нотариальная форма по ст. 43 СК РФ) супруги могут оказаться связаны устаревшими
          условиями. Отсутствие порядка разрешения споров (подсудность, досудебное урегулирование)
          ведет к неопределенности и дополнительным издержкам при конфликте.
        legal_base: "ст. 43 СК РФ, ГПК РФ"
        severity: "high"
        affected_party: "both"
        detection:
          positive_keywords:
            - "изменение брачного договора"
            - "по взаимному согласию супругов"
            - "в нотариальной форме"
            - "расторжение договора"
            - "односторонний отказ не допускается"
            - "разрешение споров"
            - "подсудность"
            - "досудебный порядок"
          context_patterns:
            - '(?i)договор\s+может\s+быть\s+изменен\s+или\s+расторгнут.*по\s+соглашению\s+сторон'
            - '(?i)споры\s+подлежат\s+разрешению\s+в\s+суде.*по\s+месту\s+нахождения\s+имущества'

      - clause_id: "creditor_notification_obligation"
        name: "Обязанность уведомления кредиторов о брачном договоре"
        risk_if_missing: |
          Супруг-должник обязан уведомить своих кредиторов о заключении, изменении или расторжении
          брачного договора (ст. 46 СК РФ). При неуведомлении супруг отвечает по своим обязательствам
          перед кредитором независимо от содержания договора. Это критически важное правило для защиты
          прав кредиторов и избежания оспаривания договора как притворной сделки.
        legal_base: "ст. 46 СК РФ"
        severity: "high"
        affected_party: "both"
        detection:
          positive_keywords:
            - "уведомление кредиторов"
            - "обязанность уведомить кредиторов"
            - "кредиторы извещаются"
            - "статья 46 СК РФ"
            - "ответственность перед кредиторами"
          context_patterns:
            - '(?i)супруг.*обязан\s+уведомить\s+своих\s+кредиторов\s+о\s+заключении\s+договора'
            - '(?i)в\s+соответствии\s+со\s+ст.\s+46\s+СК\s+РФ.*осуществляется\s+уведомление'

      - clause_id: "severability_clause_partial_invalidity"
        name: "Оговорка о делимости договора (сохранение действия при частичной недействительности)"
        risk_if_missing: |
          Если отдельные условия брачного договора будут признаны судом недействительными (например,
          как ставящие в крайне неблагоприятное положение), это может поставить под угрозу весь договор.
          Оговорка о том, что недействительность отдельных положений не влечет недействительности
          договора в целом, позволяет сохранить действующими остальные, законные условия.
        legal_base: "ст. 180 ГК РФ"
        severity: "medium"
        affected_party: "both"
        detection:
          positive_keywords:
            - "частичная недействительность"
            - "сохранение действия"
            - "severability"
            - "делимость договора"
            - "остальные условия сохраняют силу"
            - "независимость положений"
          context_patterns:
            - '(?i)недействительность\s+отдельных\s+условий\s+не\s+влечёт\s+недействительности\s+договора\s+в\s+целом'
            - '(?i)положения\s+договора\s+являются\s+автономными\s+и\s+независимыми'

    buyer_protection:
      - clause_id: "protection_from_future_creditors_of_other_spouse"
        name: "Защита имущества одного супруга от взыскания по долгам другого"
        risk_if_missing: |
          Если супруг ведет рискованную предпринимательскую деятельность или берет крупные кредиты,
          его кредиторы могут обратить взыскание на общее имущество супругов. Установление режима
          раздельной собственности на определенные активы (квартира, дача, сбережения) может защитить
          их от взыскания по долгам второго супруга, но только если будет доказано, что кредитор
          знал или должен был знать о брачном договоре.
        legal_base: "ст. 45, 46 СК РФ"
        severity: "high"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "имущество, являющееся раздельной собственностью супруга"
            - "не отвечает по обязательствам другого супруга"
            - "кредиторы вправе требовать выдела доли"
            - "обращение взыскания только на имущество должника"
            - "уведомление кредиторов о брачном договоре"
          context_patterns:
            - '(?i)имущество,\s+указанное\s+в\s+приложении.*не\s+может\s+быть\s+обращено\s+взыскание\s+по\s+долгам'
            - '(?i)супруг\s+несет\s+ответственность\s+по\s+своим\s+обязательствам\s+только\s+своим\s+раздельным\s+имуществом'