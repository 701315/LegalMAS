# БАЗОВАЯ ИНФОРМАЦИЯ (LEGACY SECTIONS — ОПТИМИЗИРОВАНО)
# ════════════════════════════════════════════════════════════
rules:
  keywords:
    high:
      - "коллективный договор"
      - "коллективные переговоры"
      - "социальное партнерство"
      - "работодатель и работники"
      - "представители работников"
      - "профсоюз"
      - "нормативный правовой акт"
    medium:
      - "комиссия по переговорам"
      - "уведомительная регистрация"
      - "дополнительные гарантии"
      - "социально-трудовые отношения"
      - "взаимные обязательства"
      - "локальный нормативный акт"
      - "индексация заработной платы"
    low:
      - "соглашение сторон"
      - "контроль за выполнением"
      - "коллективный трудовой спор"
      - "забастовка"
      - "примирительные процедуры"
      - "отраслевое соглашение"
  phrases:
    high:
      - Коллективный договор заключается между работодателем и работниками в лице их представителей
      - Стороны обязуются соблюдать условия коллективного договора
      - Настоящий коллективный договор является правовым актом социального партнерства
      - Условия коллективного договора не могут ухудшать положение работников по сравнению с трудовым законодательством
      - Коллективный договор распространяется на всех работников организации
    medium:
      - Стороны создают комиссию для ведения коллективных переговоров
      - Коллективный договор заключается на срок не более трех лет
      - Работодатель обеспечивает представителям работников возможность участия в переговорах
      - Контроль за выполнением коллективного договора осуществляют стороны социального партнерства
      - Изменения и дополнения в коллективный договор вносятся по взаимному согласию сторон
  patterns:
    required:
      - (?i)(коллективн\w+\s+договор\w*|социальн\w+\s+партнерств\w+|коллективн\w+\s+переговор\w+|представител\w+\s+работник\w+)
    optional:
      - (?i)(профсоюз\w*|уведомительн\w+\s+регистраци\w+|комисси\w+\s+по\s+переговор\w+)
      - (?i)(локальн\w+\s+нормативн\w+\s+акт|взаимн\w+\s+обязательств\w+|индексаци\w+\s+заработн\w+\s+плат)
  exclusions:
    - индивидуальный трудовой договор
    - соглашение (отраслевое, межотраслевое, региональное, территориальное)
    - локальный нормативный акт, принимаемый работодателем единолично (правила внутреннего трудового распорядка)
    - гражданско-правовой договор
  exclusion_logic:
    - condition: "individual_employment_indicators AND single_worker"
      target: "rejection"
      confidence: 0.95
      description: "Если регулируются отношения с одним работником — это индивидуальный трудовой договор"
    - condition: "multiple_employers OR industry_level_keywords"
      target: "rejection"
      confidence: 0.85
      description: "Если сторонами являются несколько работодателей или договор регулирует отношения на отраслевом уровне — это соглашение, а не коллективный договор"
  weights:
    keyword_high: 3.0
    keyword_medium: 1.5
    keyword_low: 0.5
    phrase_high: 2.5
    phrase_medium: 1.0
    pattern_required: 4.0
    pattern_optional: 1.0
  classification:
    min_confidence: 0.75
    max_matches: 3

party_roles:
  - "Работодатель (юридическое лицо или ИП в лице уполномоченных представителей: руководитель организации, иные лица по доверенности)"
  - "Работники организации (в лице представительного органа: первичная профсоюзная организация, иной представительный орган, избранные представители)"

essential_terms:
  - "Стороны коллективного договора и их представители (с указанием документов, подтверждающих полномочия)."
  - "Срок действия договора (не более трех лет)."
  - "Сфера действия (организация в целом, филиал, представительство, иное обособленное структурное подразделение)."
  - "Предмет договора (конкретные взаимные обязательства сторон по вопросам, согласованным в ходе переговоров)."
  - "Порядок применения, изменения и контроля за выполнением коллективного договора."
  - "Ответственность сторон за невыполнение принятых обязательств."

specific_risks:
  - "**Для работодателя:** Финансовые обязательства по дополнительным социальным гарантиям и льготам (доплаты, компенсации, оздоровление, индексация), которые могут существенно увеличить фонд оплаты труда."
  - "**Для работодателя:** Сложность и длительность процедуры коллективных переговоров, риск перерастания в коллективный трудовой спор с возможностью забастовки."
  - "**Для работодателя:** Ограничение свободы управления в вопросах, урегулированных коллективным договором (например, в установлении систем оплаты труда, графиков работы, критериев премирования)."
  - "**Для работодателя:** Административная ответственность за уклонение от участия в коллективных переговорах (ст. 5.28 КоАП РФ) и за невыполнение обязательств по коллективному договору (ст. 5.31 КоАП РФ)."
  - "**Для работников/профсоюза:** Риск включения условий, ухудшающих положение работников по сравнению с законом, которые будут признаны недействительными."
  - "**Для работников/профсоюза:** Сложность реального контроля за исполнением договора работодателем и привлечения его к ответственности за нарушения."
  - "**Для обеих сторон:** Риск возникновения разногласий при толковании условий договора, что может привести к коллективному трудовому спору и дорогостоящим примирительным процедурам."
  - "**Для обеих сторон:** Правовые последствия реорганизации или ликвидации организации в период действия договора (сохранение действия на срок реорганизации, переход обязательств к правопреемнику)."

aliases:
  - Коллективный договор
  - Колдоговор (сокращенно)
  - Договор социального партнерства (в конкретной организации)
  - Collective bargaining agreement (CBA)

section_markers:
  - Общие положения (стороны, принципы, сфера действия, срок)
  - Права и обязанности сторон в сфере социального партнерства
  - Трудовые отношения (прием, перевод, увольнение, гарантии занятости)
  - Оплата, нормирование и стимулирование труда (системы оплаты, премирование, индексация)
  - Гарантии и компенсации
  - Рабочее время и время отдыха (режимы работы, графики сменности, отпуска)
  - Охрана труда и экологическая безопасность
  - Социальные гарантии, льготы и компенсации (оздоровление, питание, проезд, материальная помощь, ДМС)
  - Обеспечение занятости работников (профессиональное обучение, переподготовка)
  - Гарантии профсоюзной деятельности
  - Контроль за выполнением коллективного договора, отчетность сторон
  - Ответственность сторон за нарушение условий договора
  - Порядок внесения изменений и дополнений в коллективный договор
  - Разрешение разногласий и коллективных трудовых споров
  - Заключительные положения

notes: |
  КРИТИЧЕСКИ ВАЖНЫЕ АСПЕКТЫ:
  1.  **Нельзя ухудшать:** Условия коллективного договора не могут ухудшать положение работников по сравнению с установленным трудовым законодательством (ст. 9, 50 ТК РФ). Ухудшающие условия являются недействительными.
  2.  **Процедура заключения:** Сложный, регламентированный законом процесс коллективных переговоров (Глава 6 ТК РФ) с созданием комиссии, составлением протоколов разногласий и т.д.
  3.  **Срок действия:** Заключается на срок не более трех лет (ст. 43 ТК РФ). Может быть продлен на тот же срок. Продлевается автоматически, если ни одна из сторон не заявит о начале переговоров по заключению нового.
  4.  **Уведомительная регистрация:** Подлежит уведомительной регистрации в соответствующем органе по труду (ст. 50 ТК РФ) в 7-дневный срок. Несоблюдение не влечет недействительности, но может повлечь административную ответственность.
  5.  **Сфера действия:** Действует в отношении всех работников организации, ее филиала, представительства и иного обособленного структурного подразделения (ст. 43 ТК РФ).
  6.  **Реорганизация/ликвидация:** При реорганизации организации коллективный договор сохраняет действие в течение всего срока реорганизации. При смене формы собственности — в течение 3 месяцев. При ликвидации — прекращает действие (ст. 43 ТК РФ).
  7.  **Ответственность:** За уклонение от переговоров, непредоставление информации и невыполнение обязательств предусмотрена административная ответственность по ст. 5.28–5.31 КоАП РФ.

