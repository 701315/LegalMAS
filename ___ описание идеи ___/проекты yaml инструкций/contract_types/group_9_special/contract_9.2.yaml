type: contract_9.2
name: Коллективный договор
description: |
  Правовой акт социального партнерства, регулирующий социально-трудовые отношения в организации или
  у индивидуального предпринимателя. Заключается между работодателем (в лице уполномоченных представителей)
  и работниками (в лице их представителей — профсоюзной организации, иного представительного органа
  или непосредственно избранных представителей) в результате коллективных переговоров.
  Устанавливает взаимные обязательства сторон, которые **дополняют, конкретизируют и улучшают**
  гарантии, установленные трудовым законодательством, но ни в коем случае не могут их ухудшать.
  Действует в отношении всех работников организации (филиала, представительства), независимо от
  членства в профсоюзе или участия в переговорах. Обладает нормативным характером, является
  локальным нормативным актом организации. Заключается на срок не более трех лет с возможностью
  продления. Регулируется императивными нормами Трудового кодекса РФ (Раздел II).
version: 2.0
parent: class_9_special_imperative
metadata:
  category: contract
  subcategory: collective_labor
  complexity: high
  risk_level: high
  legal_base: "Трудовой кодекс РФ (Раздел II, ст. 40-51)"

