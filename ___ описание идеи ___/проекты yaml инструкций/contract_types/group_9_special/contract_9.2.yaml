# ВАЛИДАЦИОННЫЕ СЕКЦИИ (VALIDATION ENGINE v2.0) - ИНТЕГРИРОВАННЫЕ
# ════════════════════════════════════════════════════════════
validation_metadata:
  validation_version: "2.0"
  last_updated: "2026-02-07"
  author: "Legal AI Team"

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 1: ПРИМЕНИМОЕ ЗАКОНОДАТЕЛЬСТВО
  # ──────────────────────────────────────────────────────────
  legal_base:
    primary:
      - "Трудовой кодекс РФ (Раздел II, Главы 3-9) — социальное партнерство в сфере труда"
      - "ТК РФ Глава 6 (ст. 36-39) — ведение коллективных переговоров"
      - "ТК РФ Глава 7 (ст. 40-44) — коллективные договоры"
    secondary:
      - "ст. 40 ТК РФ — понятие и стороны коллективного договора"
      - "ст. 41 ТК РФ — содержание и структура коллективного договора"
      - "ст. 42 ТК РФ — порядок разработки проекта и заключения коллективного договора"
      - "ст. 43 ТК РФ — действие коллективного договора"
      - "ст. 44 ТК РФ — изменение и дополнение коллективного договора"
      - "ст. 45-51 ТК РФ — соглашения (для разграничения с коллективным договором)"
      - "ст. 29-30 ТК РФ — представители работников и работодателей"
      - "ст. 37 ТК РФ — порядок ведения коллективных переговоров"
      - "ст. 50 ТК РФ — регистрация коллективного договора"
      - "ст. 51 ТК РФ — контроль за выполнением"
      - "ст. 134 ТК РФ — индексация заработной платы"
    related:
      - "Федеральный закон от 12.01.1996 № 10-ФЗ «О профессиональных союзах, их правах и гарантиях деятельности»"
      - "Кодекс РФ об административных правонарушениях (ст. 5.28-5.31, 5.34)"
      - "Конституция РФ ст. 30 (право на объединение), ст. 37 (право на коллективные споры)"
      - "Постановление Пленума Верховного Суда РФ от 17.03.2004 № 2 (о рассмотрении дел, связанных с коллективными договорами)"

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 2: ОБЯЗАТЕЛЬНЫЕ ЭЛЕМЕНТЫ ДОГОВОРА
  # ──────────────────────────────────────────────────────────
  essential_elements:
    - element: "parties_and_their_representatives"
      required: true
      legal_base: "ст. 40 ТК РФ"
      description: "Четкое указание сторон: работодатель (наименование организации/ФИО ИП) и работники (в лице какого именно представительного органа). Указание уполномоченных представителей с приложением документов, подтверждающих их полномочия (приказ, протокол собрания, доверенность)."
      validation_rules:
        - "employer_identified"
        - "employee_representative_body_identified"
        - "representative_authority_documents_referenced"
      conditional_checks:
        - trigger: "collective_agreement_keywords"
          keywords: ["коллективный договор", "представители работников", "профсоюз"]
          rule: "parties_and_representatives_mandatory"
          legal_base: "ст. 40 ТК РФ"
          severity: "critical"
          risk_msg: "Без четкого указания сторон и их представителей документ не может быть признан коллективным договором"

    - element: "subject_matter_and_agreed_issues"
      required: true
      legal_base: "ст. 41 ТК РФ"
      description: "Конкретные взаимные обязательства сторон по вопросам, согласованным в ходе переговоров. Перечень вопросов открытый, но должен быть конкретным и определенным (не просто отсылка к законодательству)."
      validation_rules:
        - "specific_obligations_listed"
        - "not_only_reference_to_law"
      conditional_checks:
        - trigger: "collective_agreement_empty_terms"
          keywords: ["в соответствии с законодательством", "устанавливается законом"]
          rule: "must_contain_concrete_improvements"
          legal_base: "ст. 41 ТК РФ"
          severity: "high"
          risk_msg: "Коллективный договор должен содержать конкретные обязательства, улучшающие положение работников по сравнению с законом, а не просто дублировать его нормы."

    - element: "term_of_agreement"
      required: true
      legal_base: "ст. 43 ТК РФ"
      description: "Срок действия коллективного договора. Не может превышать трех лет. Начало и окончание срока действия должны быть указаны."
      validation_rules:
        - "term_specified"
        - "term_not_exceeding_3_years"
      conditional_checks:
        - trigger: "term_exceeds_limit"
          keywords: ["сроком на 4 года", "сроком на 5 лет"]
          rule: "max_term_3_years"
          legal_base: "ст. 43 ТК РФ"
          severity: "critical"
          risk_msg: "Срок действия коллективного договора не может превышать трех лет. Условие о большем сроке ничтожно."

    - element: "scope_of_application"
      required: true
      legal_base: "ст. 43 ТК РФ"
      description: "Сфера действия договора: организация в целом или ее обособленное структурное подразделение (филиал, представительство)."
      validation_rules:
        - "scope_specified"

    - element: "wage_indexation_mechanism"
      required: true
      legal_base: "ст. 134 ТК РФ"
      description: "Механизм индексации заработной платы в связи с ростом потребительских цен. Коммерческие организации устанавливают порядок индексации в коллективном договоре."
      validation_rules:
        - "indexation_mechanism_specified_or_reference_to_local_act"
      conditional_checks:
        - trigger: "commercial_organization"
          keywords: ["ООО", "АО", "ПАО", "общество с ограниченной ответственностью", "акционерное общество"]
          rule: "wage_indexation_required"
          legal_base: "ст. 134 ТК РФ"
          severity: "high"
          risk_msg: "Коммерческая организация обязана установить в коллективном договоре порядок индексации заработной платы."

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 3: ЗАЩИТНЫЕ УСЛОВИЯ (PROTECTIVE CLAUSES)
  # ──────────────────────────────────────────────────────────
  protective_clauses:
    # --- ЗАЩИТА ИНТЕРЕСОВ РАБОТНИКОВ (Workers / Buyer Protection) ---
    buyer_protection:
      - clause_id: "no_worsening_principle_explicit"
        name: "Явное указание на принцип недопустимости ухудшения положения работников"
        risk_if_missing: |
          Работодатель может попытаться включить условия, которые формально улучшают, но фактически
          ухудшают положение (например, увеличение отпуска за счет снижения премии). Явная отсылка к
          ст. 9 ТК РФ и запрет на ухудшение создает дополнительный правовой барьер и упрощает
          оспаривание таких условий в суде.
        legal_base: "ст. 9, 50 ТК РФ"
        severity: "critical"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "не могут ухудшать положение работников"
            - "в соответствии с трудовым законодательством"
            - "не ниже установленных ТК РФ гарантий"
            - "дополнительные гарантии и льготы"
            - "улучшение положения работников"
          negative_keywords:
            - "взамен [гарантии по закону]"
            - "с согласия работника [на ухудшение]"
          context_patterns:
            - '(?i)условия\s+настоящего\s+договора\s+не\s+могут\s+ухудшать\s+положение\s+работников'
            - '(?i)установленные\s+договором\s+гарантии\s+являются\s+дополнительными\s+к\s+гарантиям\s+тк\s+рф'

      - clause_id: "universal_coverage_for_all_employees"
        name: "Распространение договора на всех работников организации"
        risk_if_missing: |
          Коллективный договор распространяется на всех работников организации (филиала, представительства)
          независимо от членства в профсоюзе, даты приема на работу, вида трудового договора (ст. 43 ТК РФ).
          Ограничение действия только на членов профсоюза незаконно и лишает части работников гарантий.
        legal_base: "ст. 43 ТК РФ"
        severity: "critical"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "распространяется на всех работников"
            - "действует в отношении всех работников"
            - "независимо от членства в профсоюзе"
            - "для всех работников организации"
            - "включая работников, принятых после заключения договора"
          context_patterns:
            - '(?i)распространяется\s+на\s+всех\s+работников\s+(организации|филиала)'
            - '(?i)действует\s+в\s+отношении\s+всех\s+работников.*независимо'

      - clause_id: "detailed_financial_and_social_benefits"
        name: "Детализированные финансовые и социальные льготы с порядком реализации"
        risk_if_missing: |
          Работодатель может давать расплывчатые обещания ("материальная помощь по возможности",
          "премии по итогам работы"), которые невозможно взыскать. Без четких формулировок (размер,
          условия, сроки выплаты, круг получателей) социальные обязательства становятся фикцией.
        legal_base: "ст. 41 ТК РФ"
        severity: "high"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "ежегодная материальная помощь в размере"
            - "выплата к юбилею/рождению ребенка в сумме"
            - "компенсация стоимости проезда к месту отпуска"
            - "оплата занятий в спортивных секциях"
            - "оздоровительный отдых для детей работников"
            - "конкретный размер доплаты"
            - "ежеквартальная премия в размере"
            - "добровольное медицинское страхование (ДМС)"
          context_patterns:
            - '(?i)работодатель\s+обязуется\s+выплачивать.*в\s+размере\s+\d+\s+рублей'
            - '(?i)ежегодно\s+выделяется\s+средства\s+на\s+оздоровление\s+в\s+объеме'

      - clause_id: "guarantees_for_union_activity"
        name: "Гарантии для профсоюзной деятельности"
        risk_if_missing: |
          Без закрепленных гарантий (предоставление помещения, освобождение профсоюзных работников от
          основной работы с сохранением зарплаты, защита от увольнения) профсоюз не сможет эффективно
          представлять интересы работников и контролировать исполнение договора.
        legal_base: "ст. 374-377 ТК РФ, ФЗ-10"
        severity: "high"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "гарантии профсоюзной деятельности"
            - "профсоюзные работники"
            - "освобождение для профсоюзной работы"
            - "помещение для профсоюза"
            - "информация для профсоюза"
            - "профсоюзные взносы"
            - "непрерывный трудовой стаж"
          context_patterns:
            - '(?i)работодатель\s+обязуется\s+предоставить\s+профсоюзу'
            - '(?i)гарантии\s+для\s+выборных\s+профсоюзных\s+работников'

    # --- ЗАЩИТА ИНТЕРЕСОВ РАБОТОДАТЕЛЯ (Employer / Seller Protection) ---
    seller_protection:
      - clause_id: "limits_on_financial_obligations_and_conditionality"
        name: "Ограничения финансовых обязательств и их условный характер"
        risk_if_missing: |
          Работодатель берет на себя безусловные финансовые обязательства, которые могут стать
          непосильными в период кризиса или снижения доходов. Без привязки выплат к финансово-экономическому
          положению организации или установления максимального лимита фонда на социальные нужды
          возникает риск банкротства из-за социальных обязательств.
        legal_base: "ст. 41 ТК РФ"
        severity: "critical"
        affected_party: "seller"
        detection:
          positive_keywords:
            - "при наличии финансово-экономических возможностей"
            - "в пределах средств, предусмотренных на социальные нужды"
            - "с учетом результатов финансово-хозяйственной деятельности"
            - "лимит расходов на материальную помощь"
            - "если иное не предусмотрено бюджетом"
            - "право работодателя пересмотреть размер выплат"
          context_patterns:
            - '(?i)выплата\s+производится\s+при\s+наличии\s+финансовых\s+возможностей'
            - '(?i)расходы\s+на\s+социальные\s+гарантии\s+не\s+могут\s+превышать\s+\d+%\s+от\s+прибыли'

      - clause_id: "peace_obligation_and_no_strike_clause"
        name: "Обязательство социального мира и запрет забастовок по урегулированным вопросам"
        risk_if_missing: |
          Профсоюз сохраняет право объявлять забастовку по любым вопросам, даже уже урегулированным
          коллективным договором. Без условия о воздержании от забастовок при добросовестном исполнении
          договора работодателем, последний лишается стабильности и предсказуемости.
        legal_base: "ст. 41, 409 ТК РФ"
        severity: "high"
        affected_party: "seller"
        detection:
          positive_keywords:
            - "обязательство мира"
            - "воздержание от забастовок"
            - "социальный мир"
            - "не объявлять забастовку"
            - "мирное урегулирование"
            - "примирительные процедуры"
          context_patterns:
            - '(?i)работники\s+обязуются\s+не\s+объявлять\s+забастовку\s+по\s+вопросам.*урегулированным\s+договором'
            - '(?i)при\s+условии\s+выполнения\s+работодателем.*стороны\s+воздерживаются\s+от\s+забастовок'

      - clause_id: "employee_obligations_and_discipline"
        name: "Обязательства работников по повышению производительности и соблюдению дисциплины"
        risk_if_missing: |
          Коллективный договор становится односторонним документом, налагающим обязательства только на
          работодателя. Без закрепления встречных обязательств работников (добросовестный труд,
          соблюдение правил, бережное отношение к имуществу, участие в повышении эффективности)
          нарушается баланс социального партнерства.
        legal_base: "ст. 41 ТК РФ"
        severity: "medium"
        affected_party: "seller"
        detection:
          positive_keywords:
            - "работники обязуются"
            - "обязанности работников"
            - "добросовестное выполнение"
            - "соблюдение трудовой дисциплины"
            - "бережное отношение к имуществу"
            - "повышение производительности"
            - "рационализаторские предложения"
          context_patterns:
            - '(?i)работники\s+обязуются\s+добросовестно\s+выполнять\s+трудовые\s+обязанности'
            - '(?i)обязанности\s+работников\s+по\s+настоящему\s+договору'

      - clause_id: "detailed_procedure_for_amendments"
        name: "Сложная процедура внесения изменений и дополнений"
        risk_if_missing: |
          Профсоюз может требовать частого пересмотра условий в свою пользу. Без установления
          сложной процедуры (инициатива не чаще раза в год, необходимость обоснования,
          длительные согласования) коллективный договор становится инструментом постоянного давления.
        legal_base: "ст. 44 ТК РФ"
        severity: "medium"
        affected_party: "seller"
        detection:
          positive_keywords:
            - "изменения вносятся не чаще одного раза в год"
            - "требуется обоснование экономической целесообразности"
            - "процедура согласования поправок занимает не менее [X] месяцев"
            - "инициатива одной из стороны должна быть поддержана [квалифицированным большинством]"
          context_patterns:
            - '(?i)предложения\s+об\s+изменении\s+могут\s+вноситься\s+не\s+чаще\s+одного\s+раза\s+в\s+год'
            - '(?i)для\s+внесения\s+изменений\s+требуется\s+письменное\s+обоснование'

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 4: ДОПОЛНИТЕЛЬНЫЕ PROTECTIVE CLAUSES
  # ──────────────────────────────────────────────────────────
  additional_protective_clauses:
    both_protection:
      - clause_id: "joint_control_commission_and_reporting"
        name: "Создание совместной контрольной комиссии и порядок отчетности"
        risk_if_missing: |
          Без созданного органа контроля и четкого графика отчетов исполнение договора пускается на самотек.
          Работники не могут эффективно отслеживать выполнение обязательств, а работодатель лишается
          инструмента для демонстрации своей добросовестности. Возрастает взаимное недоверие и риск споров.
        legal_base: "ст. 51 ТК РФ"
        severity: "high"
        affected_party: "both"
        detection:
          positive_keywords:
            - "создается совместная комиссия по контролю"
            - "состав комиссии из равного числа представителей"
            - "ежеквартальный (полугодовой) отчет работодателя"
            - "право комиссии запрашивать документы"
            - "протоколы заседаний контрольной комиссии"
          context_patterns:
            - '(?i)для\s+контроля\s+за\s+выполнением\s+создается\s+совместная\s+комиссия'
            - '(?i)работодатель\s+предоставляет\s+отчет\s+о\s+выполнении.*ежеквартально'

      - clause_id: "dispute_resolution_escalation_ladder"
        name: "Лестница эскалации для разрешения разногласий"
        risk_if_missing: |
          Любое разногласие по применению договора сразу перерастает в коллективный трудовой спор с
          угрозой забастовки. Без поэтапной процедуры (переговоры руководителей -> рассмотрение в
          комиссии -> медиация -> трудовой арбитраж) стороны лишаются инструментов для мирного урегулирования.
        legal_base: "ст. 398-418 ТК РФ"
        severity: "high"
        affected_party: "both"
        detection:
          positive_keywords:
            - "досудебный порядок разрешения разногласий"
            - "переговоры на уровне руководителей подразделений"
            - "рассмотрение в примирительной комиссии"
            - "возможность обращения к посреднику (медиатору)"
            - "трудовой арбитраж"
            - "забастовка как крайняя мера"
          context_patterns:
            - '(?i)споры\s+по\s+применению\s+договора\s+разрешаются.*в\s+соответствии\s+со\s+следующей\s+процедурой'
            - '(?i)обязательным\s+этапом\s+является\s+рассмотрение\s+в\s+примирительной\s+комиссии'

      - clause_id: "succession_clause_for_new_owners_mergers"
        name: "Положение о правопреемстве для новых собственников и при слияниях"
        risk_if_missing: |
          При продаже бизнеса или слиянии компаний новый собственник может отказаться от выполнения
          коллективного договора, ссылаясь на то, что он не был стороной его заключения. Это порождает
          правовую неопределенность, массовые увольнения или споры. Положение о правопреемстве защищает
          стабильность трудовых отношений.
        legal_base: "ст. 43, 75 ТК РФ"
        severity: "high"
        affected_party: "both"
        detection:
          positive_keywords:
            - "правопреемник работодателя принимает на себя все обязательства"
            - "условия договора обязательны для любого нового собственника"
            - "в случае реорганизации в форме слияния договор переходит к правопреемнику"
            - "гарантии сохранения действия договора"
          context_patterns:
            - '(?i)в\s+случае\s+смены\s+собственника.*все\s+обязательства\s+переходят\s+к\s+новому\s+работодателю'
            - '(?i)правопреемник\s+несет\s+ответственность\s+за\s+неисполнение\s+обязательств'

    buyer_protection:
      - clause_id: "occupational_safety_and_health_measures"
        name: "Конкретные мероприятия по охране труда и улучшению условий"
        risk_if_missing: |
          Улучшение условий и охраны труда работников — одно из основных направлений
          коллективных договоров (ст. 41 ТК РФ). Без конкретных мероприятий, финансирования,
          ответственных лиц и сроков положения остаются декларативными.
        legal_base: "ст. 41, 212-231 ТК РФ"
        severity: "high"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "мероприятия по охране труда"
            - "финансирование охраны труда"
            - "средства индивидуальной защиты"
            - "специальная оценка условий труда (СОУТ)"
            - "аттестация рабочих мест"
            - "оздоровительные мероприятия"
          context_patterns:
            - '(?i)работодатель\s+обязуется\s+ежегодно\s+выделять\s+средства\s+на\s+охрану\s+труда'
            - '(?i)проведение\s+специальной\s+оценки\s+условий\s+труда'

      - clause_id: "job_security_and_retraining_guarantees"
        name: "Гарантии занятости и профессиональной переподготовки"
        risk_if_missing: |
          При внедрении новых технологий или реструктуризации работники рискуют быть уволенными по
          причине несоответствия. Без обязательств работодателя по организации переподготовки,
          приоритетному трудоустройству при сокращении и выплате повышенных выходных пособий
          работники остаются без защиты в период организационных изменений.
        legal_base: "ст. 41, 180, 196 ТК РФ"
        severity: "high"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "гарантии занятости"
            - "переобучение работников"
            - "трудоустройство при сокращении"
            - "дополнительное выходное пособие"
            - "повышение квалификации за счет работодателя"
            - "сохранение рабочих мест"
          context_patterns:
            - '(?i)при\s+внедрении\s+новых\s+технологий\s+работодатель\s+организует\s+переобучение'
            - '(?i)работникам,\s+уволенным\s+по\s+сокращению.*выплачивается\s+дополнительное\s+пособие'

    seller_protection:
      - clause_id: "information_access_limits_and_confidentiality"
        name: "Ограничения доступа к информации и конфиденциальность"
        risk_if_missing: |
          Представители работников имеют право на получение информации для ведения переговоров и контроля,
          но это право не абсолютно. Без положений о защите коммерческой тайны, персональных данных,
          порядке и объеме предоставляемой информации работодатель рискует раскрытием стратегически
          важных сведений.
        legal_base: "ст. 53 ТК РФ, ФЗ-98 «О коммерческой тайне»"
        severity: "medium"
        affected_party: "seller"
        detection:
          positive_keywords:
            - "конфиденциальная информация"
            - "коммерческая тайна"
            - "порядок предоставления информации"
            - "объем предоставляемых сведений"
            - "ответственность за разглашение"
          context_patterns:
            - '(?i)предоставление\s+информации\s+не\s+должно\s+нарушать\s+режим\s+коммерческой\s+тайны'
            - '(?i)представители\s+работников\s+несут\s+ответственность\s+за\s+разглашение'