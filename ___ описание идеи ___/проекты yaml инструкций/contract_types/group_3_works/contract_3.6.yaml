# 🆕 ВАЛИДАЦИОННЫЕ СЕКЦИИ (VALIDATION ENGINE v2.0 - ГИБРИД)
# ════════════════════════════════════════════════════════════

validation_metadata:
  validation_version: "2.0"
  last_updated: "2026-02-07"
  author: "Legal AI Team"

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 1: ПРИМЕНИМОЕ ЗАКОНОДАТЕЛЬСТВО (ОБЪЕДИНЕНО)
  # ──────────────────────────────────────────────────────────
  legal_base:
    primary:
      - "Федеральный закон от 30.12.2004 № 214-ФЗ (ред. от 24.02.2023) 'Об участии в долевом строительстве...'"
    secondary:
      - "Гражданский кодекс РФ (общие положения)"
      - "Закон РФ от 07.02.1992 № 2300-1 'О защите прав потребителей' (для Участников-граждан)"
      - "Федеральный закон от 13.07.2015 № 218-ФЗ 'О государственной регистрации недвижимости'"
    related:
      - "Постановление Пленума Верховного Суда РФ от 04.12.2020 № 4 'О некоторых вопросах применения судами законодательства об участии в долевом строительстве...'"
      - "Положение ЦБ РФ № 662-П 'О порядке ведения эскроу-счетов...'"
      - "Федеральный закон от 26.10.2002 № 127-ФЗ 'О несостоятельности (банкротстве)' (особенности банкротства застройщиков)"

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 2: ОБЯЗАТЕЛЬНЫЕ ЭЛЕМЕНТЫ (ESSENTIAL ELEMENTS - ГИБРИД)
  # ──────────────────────────────────────────────────────────
  essential_elements:
    - element: "ddu_object_description"
      name: "Детальное описание Объекта долевого строительства (ОДС)"
      required: true
      legal_base: "ст. 4 ч. 4 214-ФЗ"
      description: "Должны быть указаны: местоположение, условный номер, этаж, номер, площадь (общая/жилая), планировка. Обязательна ссылка на приложение — поэтажный план."
      validation_rules:
        - "object_location_and_number_specified"
        - "floor_and_area_specified"
        - "layout_description_present"
        - "plan_attachment_referenced"

    - element: "contract_price_payment_escrow"
      name: "Цена Договора, порядок и сроки ее уплаты (эскроу-счет)"
      required: true
      legal_base: "ст. 5, 15.4 214-ФЗ"
      description: "Цена является твердой. Оплата производится после государственной регистрации ДДУ. Для граждан — строго на эскроу-счет. Должен быть график платежей."
      validation_rules:
        - "price_fixed_and_specified"
        - "payment_after_registration_specified"
        - "escrow_account_details_present_for_individuals"
        - "payment_schedule_attached"
      conditional_checks:
        - trigger: "participant_is_individual"
          keywords: ["гражданин", "физическое лицо", "паспорт"]
          rule: "escrow_mandatory"
          legal_base: "ст. 15.1 214-ФЗ"
          severity: "critical"
          risk_msg: "Отсутствие условий об эскроу для гражданина делает договор ничтожным. Ст. 5 ч. 3 214-ФЗ запрещает прием денег до регистрации."

    - element: "deadline_for_object_transfer_calendar"
      name: "Срок передачи Объекта (календарная дата или определенный период)"
      required: true
      legal_base: "ст. 6 214-ФЗ"
      description: "Должна быть указана конкретная календарная дата передачи Объекта или определенный срок (например, в течение X месяцев со дня регистрации ДДУ). Не может быть определен 'моментом ввода в эксплуатацию'."
      validation_rules:
        - "transfer_deadline_specified"
        - "deadline_is_certain_date_or_period"
        - "not_dependent_on_vague_events"

    - element: "state_registration_requirement"
      name: "Указание на обязательность государственной регистрации Договора"
      required: true
      legal_base: "ст. 1, 4 214-ФЗ"
      description: "Договор подлежит государственной регистрации в Росреестре и считается заключенным с момента такой регистрации. Это должно быть прямо указано."
      validation_rules:
        - "state_registration_clause_present"
        - "contract_effective_from_registration"

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 3: ЗАЩИТНЫЕ УСЛОВИЯ (PROTECTIVE CLAUSES - ГИБРИД)
  # ──────────────────────────────────────────────────────────
  protective_clauses:
    
    # --- ЗАЩИТА УЧАСТНИКА (PARTICIPANT PROTECTION) ---
    buyer_protection:
      - clause_id: "penalty_for_delay_214_fz"
        name: "Неустойка за просрочку передачи в размере 1/300 (1/150) ключевой ставки ЦБ РФ"
        risk_if_missing: |
          Условие действует и без упоминания (ст. 6 214-ФЗ). Для граждан размер увеличен до 1/150.
          Попытки снизить размер, установить фиксированную сумму или исключить неустойку ничтожны.
          Наличие условия информирует Участника.
        legal_base: "ст. 6 214-ФЗ"
        severity: "critical"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "неустойка за просрочку передачи"
            - "1/300 (1/150) ключевой ставки ЦБ РФ"
            - "за каждый день просрочки"
            - "в соответствии с п. 2 ст. 6 214-ФЗ"
          negative_keywords:
            - "фиксированная сумма неустойки"
            - "0.01%"
            - "не применяется"
          context_patterns:
            - '(?i)застройщик.*уплачивает.*неустойку.*в.*размере.*1/150.*ключевой.*ставки.*ЦБ.*РФ.*от.*цены.*договора.*\\(для.*граждан\\)'
      
      - clause_id: "payment_after_registration_prohibition"
        name: "Запрет оплаты ДО государственной регистрации ДДУ"
        risk_if_missing: |
          Ст. 5 ч. 3 214-ФЗ прямо запрещает Застройщику принимать денежные средства до регистрации ДДУ.
          Условия "оплата в день подписания", "внести аванс" до регистрации являются незаконными и создают
          риск потери средств, если регистрация не состоится (например, при двойной продаже).
        legal_base: "ст. 5 ч. 3 214-ФЗ"
        severity: "critical"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "оплата после государственной регистрации договора"
            - "в течение X рабочих дней с даты регистрации"
            - "в соответствии с ч. 3 ст. 5 214-ФЗ"
          negative_keywords:
            - "оплата в день подписания"
            - "внести аванс до регистрации"
            - "оплатить при заключении"
          context_patterns:
            - '(?i)оплата.*цены.*договора.*производится.*после.*государственной.*регистрации.*настоящего.*договора'
      
      - clause_id: "area_discrepancy_recalculation"
        name: "Перерасчет цены при отклонении фактической площади от проектной"
        risk_if_missing: |
          Фактическая площадь квартиры после обмера БТИ часто отличается. При уменьшении площади Застройщик обязан
          вернуть разницу. Условия "перерасчет не производится при отклонении менее 1 кв.м." или "производится
          только при отклонении более 5%" могут быть признаны недействительными как ущемляющие права потребителя.
        legal_base: "ст. 6 214-ФЗ, ст. 28 Закона о защите прав потребителей"
        severity: "high"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "перерасчет цены при отклонении площади"
            - "возврат разницы в цене"
            - "фактическая площадь по данным БТИ"
          negative_keywords:
            - "перерасчет не производится"
            - "при отклонении менее"
          context_patterns:
            - '(?i)в.*случае.*отклонения.*фактической.*площади.*объекта.*от.*указанной.*в.*договоре.*производится.*перерасчет.*цены'
      
      - clause_id: "participant_unilateral_refusal_right"
        name: "Право Участника-гражданина на односторонний отказ в любое время до передачи"
        risk_if_missing: |
          Право предусмотрено ст. 9 214-ФЗ и не может быть ограничено. Отсутствие напоминания не лишает права,
          но Участник может не знать о нем. Застройщик обязан вернуть деньги с процентами.
          Условия о "штрафе за отказ" ничтожны.
        legal_base: "ст. 9 214-ФЗ"
        severity: "high"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "право на односторонний отказ от договора"
            - "в любое время до передачи объекта"
            - "возврат уплаченных денежных средств с процентами"
            - "в соответствии со ст. 9 214-ФЗ"
          negative_keywords:
            - "штраф за отказ"
            - "неустойка за расторжение"
            - "запрет на отказ"
          context_patterns:
            - '(?i)участник.*гражданин.*вправе.*в.*одностороннем.*порядке.*отказаться.*от.*договора.*в.*любое.*время.*до.*передачи.*объекта'
      
      - clause_id: "assignment_right_no_unlawful_restrictions"
        name: "Право на уступку (цессию) без незаконных ограничений и комиссий"
        risk_if_missing: |
          Участник вправе уступить права по ДДУ (ст. 11 214-ФЗ). После полной оплаты уступка не требует согласия Застройщика.
          Незаконны: требование "согласия", взимание "комиссии за уступку", запрет на уступку.
          Допустимо: уведомление, возмещение разумных расходов Застройщика на переоформление.
        legal_base: "ст. 11 214-ФЗ"
        severity: "medium"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "уступка прав требований допускается"
            - "без согласия застройщика (после полной оплаты)"
            - "уведомление застройщика"
          negative_keywords:
            - "комиссия за согласование уступки"
            - "только с письменного согласия застройщика"
            - "запрещено"
          context_patterns:
            - '(?i)уступка.*прав.*требований.*по.*договору.*допускается.*после.*полной.*оплаты.*цены.*договора.*без.*согласия.*застройщика'
    
    # --- ЗАЩИТА ЗАСТРОЙЩИКА (DEVELOPER PROTECTION) ---
    seller_protection:
      - clause_id: "unilateral_transfer_act_after_2_months"
        name: "Право на односторонний акт передачи при уклонении Участника от приемки"
        risk_if_missing: |
          Участники могут уклоняться от подписания передаточного акта, накапливая неустойку или надеясь на лучшие условия.
          Ст. 8 ч. 6 214-ФЗ дает Застройщику право составить односторонний акт через 2 месяца после уведомления.
          Без этого условия в договоре Застройщик не может снять с себя риски и коммунальные платежи.
        legal_base: "ст. 8 ч. 6 214-ФЗ"
        severity: "high"
        affected_party: "seller"
        detection:
          positive_keywords:
            - "односторонний передаточный акт"
            - "при уклонении участника от приемки"
            - "по истечении 2 месяцев"
            - "уведомление о готовности объекта"
          context_patterns:
            - '(?i)если.*участник.*уклоняется.*от.*подписания.*передаточного.*акта.*в.*течение.*2.*месяцев.*застройщик.*вправе.*составить.*акт.*односторонне'
      
      - clause_id: "limitation_of_liability_force_majeure"
        name: "Освобождение от ответственности (в т.ч. от неустойки) при форс-мажоре"
        risk_if_missing: |
          Строительство подвержено внешним воздействиям (санкции, изменение законов, природные катаклизмы).
          Без условия о форс-мажоре Застройщик будет нести ответственность за просрочку, вызванную непреодолимыми
          причинами, что несправедливо и может привести к банкротству.
        legal_base: "ст. 401 ГК РФ"
        severity: "high"
        affected_party: "seller"
        detection:
          positive_keywords:
            - "обстоятельства непреодолимой силы (форс-мажор)"
            - "освобождение от ответственности"
            - "продление срока исполнения"
            - "уведомление о наступлении"
          context_patterns:
            - '(?i)стороны.*освобождаются.*от.*ответственности.*за.*неисполнение.*обязательств.*если.*оно.*вызвано.*обстоятельствами.*непреодолимой.*силы'
      
      - clause_id: "participant_breach_consequences"
        name: "Последствия нарушения Участником обязанности по оплате"
        risk_if_missing: |
          При отказе Участника от оплаты (в схемах без эскроу) Застройщик лишен мер воздействия.
          Необходимо право на взыскание законной неустойки и на одностороннее расторжение договора
          с удержением части уплаченного в счет убытков.
        legal_base: "ст. 310, 328, 450 ГК РФ"
        severity: "medium"
        affected_party: "seller"
        detection:
          positive_keywords:
            - "ответственность за просрочку оплаты"
            - "пеня за несвоевременную оплату"
            - "право застройщика на односторонний отказ от договора"
          context_patterns:
            - '(?i)при.*просрочке.*оплаты.*участник.*уплачивает.*пеню.*в.*размере.*[0-9]+%.*от.*неуплаченной.*суммы'

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 4: ДОПОЛНИТЕЛЬНЫЕ PROTECTIVE CLAUSES (ГИБРИД)
  # ──────────────────────────────────────────────────────────
  additional_protective_clauses:
    
    buyer_seller_protection:
      - clause_id: "finishing_works_specification"
        name: "Детальное описание отделки (для договоров 'с отделкой')"
        risk_if_missing: |
          Если квартира продается "с отделкой", формулировки "евроремонт", "качественные материалы" ничего не значат.
          Без детального технического задания (ТЗ) на отделку с указанием конкретных материалов, производителей,
          марок и объемов работ Застройщик использует самые дешевые материалы, что приведет к спорам и судам.
        legal_base: "ст. 7 214-ФЗ, ст. 10 Закона о защите прав потребителей"
        severity: "high"
        affected_party: "both"
        detection:
          positive_keywords:
            - "перечень работ по отделке"
            - "техническое задание на отделку"
            - "спецификация материалов (марка, производитель)"
            - "чистовая отделка"
            - "приложение с описанием отделки"
          context_patterns:
            - '(?i)детальное.*описание.*отделочных.*работ.*и.*материалов.*приведено.*в.*приложении.*№.*к.*договору'
        conditional_checks:
          - trigger: "with_finishing"
            keywords: ["с отделкой", "под ключ", "чистовая отделка"]
            rule: "finishing_specification_required"
            severity: "high"
      
      - clause_id: "shared_property_contributions_procedure"
        name: "Порядок и размер взносов на содержание общего имущества МКД"
        risk_if_missing: |
          После передачи объекта Участник становится собственником и обязан нести расходы на содержание общего имущества.
          Неопределенность в порядке и размере первоначальных взносов (на регистрацию права, подключение к сетям,
          формирование фонда капремонта) приводит к конфликтам между дольщиками и застройщиком после сдачи дома.
        legal_base: "Жилищный кодекс РФ"
        severity: "medium"
        affected_party: "both"
        detection:
          positive_keywords:
            - "взносы на содержание общего имущества"
            - "паевой взнос"
            - "взнос на капитальный ремонт"
            - "порядок оплаты коммунальных услуг до регистрации права"
          context_patterns:
            - '(?i)участник.*обязуется.*уплатить.*взнос.*на.*формирование.*фонда.*капитального.*ремонта.*в.*размере.*установленном.*жилищным.*законодательством'
      
      - clause_id: "dispute_resolution_jurisdiction_consumer"
        name: "Подсудность споров по месту жительства Участника-гражданина"
        risk_if_missing: |
          Для Участника-гражданина важно, чтобы споры рассматривались по месту его жительства (ст. 17 ЗоЗПП).
          Условие о подсудности по месту нахождения Застройщика является ничтожным для потребителя.
          Досудебный претензионный порядок экономит время и ресурсы обеих сторон.
        legal_base: "ст. 17 Закона о защите прав потребителей, ГПК РФ"
        severity: "medium"
        affected_party: "both"
        detection:
          positive_keywords:
            - "споры рассматриваются по месту жительства участника (потребителя)"
            - "претензионный порядок урегулирования споров"
            - "срок для ответа на претензию"
          negative_keywords:
            - "подсудность по месту нахождения застройщика"
            - "исключительная подсудность"
          context_patterns:
            - '(?i)все.*споры.*подлежат.*рассмотрению.*в.*суде.*по.*месту.*жительства.*участника.*\\(потребителя\\)'