type: contract_3.6
name: "Договор участия в долевом строительстве (ДДУ)"
description: |
  Специализированный публичный договор, жестко регулируемый Федеральным законом № 214-ФЗ. Сочетает элементы
  подряда (обязанность построить объект) и купли-продажи будущей недвижимости.
  Характеризуется максимальной защитой прав дольщиков: обязательная государственная регистрация договора,
  расчет через эскроу-счета, фиксированная законом неустойка, гарантии Фонда защиты прав.
  Отклонение от императивных норм 214-ФЗ не допускается. Любые "серые" схемы привлечения средств (ПДКП, займы) незаконны.
version: 2.1
parent: class_3_work_performance
sibling_contracts:
  - contract_3.3 # Строительный подряд (ДДУ — привлечение средств, а не подрядные отношения)
  - contract_1.6 # Купля-продажа готовой недвижимости
metadata:
  category: contract
  subcategory: real_estate_development
  complexity: high # Строгие требования 214-ФЗ, банковское сопровождение, регистрация
  risk_level: critical # Риски долгостроя, банкротства застройщика, потери средств
  legal_base: Федеральный закон от 30.12.2004 № 214-ФЗ «Об участии в долевом строительстве...»
  hierarchy_position: "child_specialized_high_risk"

# ════════════════════════════════════════════════════════════
# КВАЛИФИКАЦИЯ И ПРИЗНАКИ (ОПТИМИЗИРОВАНО)
# ════════════════════════════════════════════════════════════
rules:
  keywords:
    high:
      - "долевое строительство"
      - "ДДУ"
      - "застройщик"
      - "участник долевого строительства"
      - "объект долевого строительства ОДС"
      - "проектная декларация"
      - "эскроу-счет"
      - "214-ФЗ"
      - "разрешение на строительство"
    medium:
      - "условный номер объекта"
      - "передаточный акт"
      - "неустойка по 214-ФЗ"
      - "разрешение на ввод в эксплуатацию"
      - "кадастровые работы"
      - "экспликация"
      - "взнос в компенсационный фонд"
    low:
      - "многоквартирный дом"
      - "квартира в новостройке"
      - "паевый взнос"
      - "фонд защиты прав дольщиков"
  phrases:
    high:
      - Застройщик обязуется построить многоквартирный дом и после получения разрешения на ввод передать Участнику Объект долевого строительства
      - Участник обязуется уплатить обусловленную цену Договора и принять Объект
      - Цена Договора уплачивается путем перечисления на счет эскроу в банке
      - Оплата цены Договора производится после государственной регистрации Договора
    medium:
      - В случае нарушения срока передачи Объекта Застройщик уплачивает неустойку
      - Участник-гражданин вправе в одностороннем порядке отказаться от Договора
      - Гарантийный срок на конструктивные элементы составляет 5 лет, на инженерное оборудование — 3 года
  patterns:
    required:
      - (?i)(договор.*участия.*в.*долевом.*строительстве|ДДУ|214.*ФЗ|эскроу.*счет|застройщик.*обязуется.*построить)
    optional:
      - (?i)(проектная.*декларация|объект.*долевого.*строительства|участник.*долевого.*строительства|неустойка.*1/300.*ставки)
  exclusions:
    - ЖСК (жилищно-строительный кооператив)
    - инвестиционный договор без соблюдения 214-ФЗ
    - предварительный договор купли-продажи (ПДКП) — "серая" схема
    - договор купли-продажи готовой недвижимости
    - договор займа или вексельная схема привлечения средств
  exclusion_logic:
    - condition: "illegal_scheme OR ready_real_estate"
      target: "rejection"
      confidence: 0.97
      description: "Если используются схемы, обходящие 214-ФЗ, или объект уже построен и введен в эксплуатацию"
  weights:
    keyword_high: 4.0
    keyword_medium: 2.0
    keyword_low: 0.8
    phrase_high: 4.5
    phrase_medium: 1.5
    pattern_required: 5.0
    pattern_optional: 1.0
  classification:
    min_confidence: 0.92  # Очень высокий порог, так как последствия ошибки в квалификации катастрофичны
    max_matches: 3

party_roles:
  - Застройщик (Developer) — юридическое лицо с правами на землю, разрешением на строительство, внесенное в реестр Минстроя
  - Участник долевого строительства (Participant) — гражданин или юридическое лицо, приобретающее право на будущий объект
  - Банк-эскроу-агент (обязателен для договоров с гражданами после 01.07.2019)

essential_terms:
  - Предмет: Объект долевого строительства (ОДС) с детальным описанием (план, площадь, этаж, номер, планировка)
  - Срок передачи Объекта (конкретная календарная дата или четко определенный период)
  - Цена Договора, порядок и сроки ее уплаты (эскроу-счет, график платежей)
  - Гарантийный срок (не менее 5 лет на объект, 3 года на инженерное оборудование — ст. 7 214-ФЗ)

specific_risks:
  - Для Участника: риск банкротства застройщика и замораживания строительства (снижен эскроу)
  - Нарушение срока передачи на годы (фиксированная неустойка 1/300 ставки ЦБ РФ, для граждан — 1/150)
  - Несоответствие фактической площади проектной (необходимость перерасчета)
  - Низкое качество строительства и отделки (особенно в договорах "с отделкой")
  - Незаконное требование оплаты ДО государственной регистрации ДДУ
  - Для Застройщика: административная и субсидиарная ответственность за нарушения 214-ФЗ
  - Риски, связанные с банковским сопровождением и эскроу-счетами

aliases:
  - ДДУ
  - Договор долевого участия
  - Договор с Застройщиком на квартиру в новостройке
  - Соглашение о долевке

section_markers:
  - Предмет Договора (характеристики ОДС, ссылка на проектную декларацию)
  - Цена Договора и порядок расчетов (эскроу-счет, график платежей)
  - Срок передачи Объекта долевого строительства
  - Порядок передачи Объекта (передаточный акт, сроки подписания)
  - Гарантийные обязательства Застройщика (сроки, порядок устранения недостатков)
  - Права и обязанности сторон
  - Ответственность сторон (неустойка, возмещение убытков)
  - Порядок изменения и расторжения Договора
  - Порядок разрешения споров
  - Заключительные положения (адреса, реквизиты, регистрация)
  - Приложения (поэтажный план, планировка, график платежей, описание отделки)

notes: |
  ОБЯЗАТЕЛЬНЫЕ ИМПЕРАТИВНЫЕ ТРЕБОВАНИЯ 214-ФЗ (НЕИЗМЕНИМЫ):
  1. Государственная регистрация ДДУ в Росреестре — условие заключенности.
  2. Оплата цены ДО регистрации ДДУ запрещена (ст. 5 ч. 3 214-ФЗ).
  3. Для Участников-граждан обязателен расчет через эскроу-счета в банке (с 01.07.2019).
  4. Цена ДДУ является твердой и не может быть изменена.
  5. Размер неустойки за просрочку передачи фиксирован: 1/300 ключевой ставки ЦБ РФ за день (для граждан — 1/150).
  6. Право Участника-гражданина на односторонний отказ от Договора в любое время до передачи объекта.
  7. Застройщик вправе передать объект по одностороннему акту, если Участник уклоняется от приемки 2 месяца (ст. 8 ч. 6).

