type: contract_3.2
name: Договор бытового подряда
description: |
  Специальный вид подряда, где Заказчиком всегда выступает гражданин (потребитель), 
  заказывающий работу для удовлетворения бытовых, семейных, личных и иных нужд, 
  не связанных с предпринимательской деятельностью. Подрядчик — предприниматель или организация, 
  осуществляющая соответствующую деятельность. Регулируется § 2 Главы 37 ГК РФ и Законом о защите 
  прав потребителей, что создает повышенный уровень защиты прав Заказчика.
version: 2.0
parent: class_3_work_performance
metadata:
  category: contract
  subcategory: work_performance
  complexity: medium
  risk_level: high  # Высокий риск для подрядчика из-за потребительского законодательства
  legal_base: § 2 Главы 37 ГК РФ (ст. 730-739)

# ════════════════════════════════════════════════════════════
# КВАЛИФИКАЦИЯ И ПРИЗНАКИ
# ════════════════════════════════════════════════════════════
rules:
  keywords:
    high:
      - "бытовой подряд"
      - "заказчик-потребитель"
      - "для личных бытовых нужд"
      - "гражданин"
      - "потребитель"
      - "закон о защите прав потребителей"
      - "публичный договор"
    medium:
      - "ремонт для граждан"
      - "услуги населению"
      - "смета для потребителя"
      - "гарантийный срок"
      - "претензия потребителя"
      - "бытовые услуги"
    low:
      - "подрядчик-предприниматель"
      - "ИП"
      - "для семьи"
      - "не для предпринимательской деятельности"
      - "розничные услуги"
  phrases:
    high:
      - Заказчик-гражданин заказывает, а Подрядчик обязуется выполнить работу для удовлетворения личных (бытовых) потребностей
      - Договор является публичным и регулируется Законом РФ "О защите прав потребителей"
      - Подрядчик обязан предоставить Заказчику достоверную информацию о работе и себе
      - Заказчик вправе в любое время до сдачи работы отказаться от договора, оплатив выполненную часть
    medium:
      - Работы выполняются из материалов Подрядчика и его силами
      - Цена работы определяется сметой, представленной Подрядчиком
      - Смета является твердой и может быть изменена только с согласия Заказчика
      - Гарантийный срок на результат работы устанавливается договором
  patterns:
    required:
      - (?i)(бытовой.*подряд|заказчик.*гражданин|для.*личных.*нужд|потребитель.*заказчик)
    optional:
      - (?i)(ремонт.*квартир|пошив.*одежд|изготовление.*мебели.*для.*граждан)
      - (?i)(публичный.*договор|смета.*твердая|гарантийный.*срок.*месяц)
  exclusions:
    - работы для предпринимательской деятельности заказчика
    - работы для юридического лица
    - строительный подряд между организациями
    - договор возмездного оказания услуг (неовеществленный результат)
  exclusion_logic:
    - condition: "customer_is_legal_entity OR work_for_business_purposes"
      target: "rejection"
      confidence: 0.95
      description: "Если заказчик — юрлицо или работа заказывается для предпринимательской деятельности"
  weights:
    keyword_high: 3.5  # Повышенный вес из-за специфики потребительского договора
    keyword_medium: 1.5
    keyword_low: 0.5
    phrase_high: 3.0
    phrase_medium: 1.0
    pattern_required: 4.5
    pattern_optional: 1.0
  classification:
    min_confidence: 0.80  # Высокий порог из-за рисков потребительского законодательства
    max_matches: 3

party_roles:
  - Подрядчик (ИП или организация, выполняющая работы для граждан)
  - Заказчик (гражданин-потребитель, физическое лицо)

essential_terms:
  - Предмет договора: конкретная работа для удовлетворения личных, семейных, бытовых нужд
  - Цена работы (смета) — существенное условие, должно быть четко определено
  - Срок выполнения работ — существенное условие для потребительского договора

specific_risks:
  - Судебные иски по ЗоЗПП: неустойка 3% за день просрочки, возмещение убытков, моральный вред
  - Административная ответственность по КоАП РФ (штрафы до 500 тыс. руб. для юрлиц)
  - Проверки Роспотребнадзора и прокуратуры по жалобам потребителей
  - Право заказчика на односторонний отказ в любой момент до сдачи работы
  - Обязанность предоставления полной информации о работе, подрядчике, правах потребителя
  - Риск признания договора присоединения недействительным по ст. 428 ГК РФ

aliases:
  - Бытовой подряд
  - Договор на выполнение работ для граждан
  - Потребительский подряд
  - Договор на оказание бытовых услуг
  - Публичный договор подряда

section_markers:
  - Предмет договора (детальное описание работ и результата)
  - Сведения о Заказчике и Подрядчике (паспортные данные, реквизиты)
  - Срок выполнения работ (начало, окончание, график)
  - Цена работ и порядок расчетов (смета, аванс, окончательный расчет)
  - Информация о работе и Подрядчике (обязательная информация по ЗоЗПП)
  - Порядок сдачи и приемки работ (акт, сроки приемки)
  - Качество работ и гарантийные обязательства
  - Права и обязанности сторон (с акцентом на права потребителя)
  - Ответственность сторон (особенно подрядчика)
  - Порядок предъявления претензий и разрешения споров
  - Прочие условия
  - Подписи и реквизиты сторон

notes: |
  ОСОБЕННОСТИ БЫТОВОГО ПОДРЯДА (КРИТИЧЕСКИ ВАЖНО):
  1. Договор является ПУБЛИЧНЫМ (ст. 426 ГК РФ) — подрядчик не может отказать в заключении при возможности выполнить работу.
  2. Применяется Закон РФ от 07.02.1992 № 2300-1 "О защите прав потребителей" (ЗоЗПП).
  3. Подрядчик обязан предоставить полную информацию: о себе (регистрация, лицензия), о работе (содержание, материалы), о порядке расчетов, о правах потребителя.
  4. Смета, представленная подрядчиком, является ТВЕРДОЙ и не может быть увеличена без согласия заказчика.
  5. Заказчик имеет право на односторонний отказ в ЛЮБОЕ время до сдачи работы с оплатой фактически выполненного.
  6. Ответственность подрядчика усиливается: неустойка за просрочку — 3% цены работы за каждый день (ст. 28 ЗоЗПП).
  7. Подсудность — по выбору потребителя (по месту жительства, нахождения подрядчика или заключения договора).

# ════════════════════════════════════════════════════════════
# 🆕 ВАЛИДАЦИОННЫЕ СЕКЦИИ (VALIDATION ENGINE v2.0)
# ════════════════════════════════════════════════════════════

validation_metadata:
  validation_version: "2.0"
  last_updated: "2026-02-07"
  author: "Legal AI Team"

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 1: ПРИМЕНИМОЕ ЗАКОНОДАТЕЛЬСТВО (С ПРИОРИТЕТОМ ЗоЗПП)
  # ──────────────────────────────────────────────────────────
  legal_base:
    primary:
      - "§ 2 Главы 37 ГК РФ (ст. 730-739)"
      - "Закон РФ от 07.02.1992 № 2300-1 'О защите прав потребителей'"
    secondary:
      - "ст. 426 ГК РФ (публичный договор)"
      - "ст. 428 ГК РФ (договор присоединения)"
      - "Правила бытового обслуживания населения (утв. Постановлением Правительства РФ от 15.08.1997 № 1025)"
    related:
      - "КоАП РФ ст. 14.4, 14.7, 14.8 (административная ответственность за нарушение прав потребителей)"
      - "Гражданский процессуальный кодекс РФ ст. 29 (подсудность по выбору потребителя)"
      - "Постановление Пленума Верховного Суда РФ от 28.06.2012 № 17 (о применении судами ЗоЗПП)"

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 2: ОБЯЗАТЕЛЬНЫЕ ЭЛЕМЕНТЫ (ESSENTIAL ELEMENTS)
  # ──────────────────────────────────────────────────────────
  essential_elements:
    - element: "parties_info_consumer"
      required: true
      legal_base: "ст. 9, 10 ЗоЗПП, ст. 732 ГК РФ"
      description: "Для заказчика-гражданина: ФИО, паспортные данные, адрес. Для подрядчика: полное наименование, реквизиты, регистрационные данные"
      validation_rules:
        - "consumer_name_present"
        - "consumer_passport_info"
        - "contractor_full_info"
        - "contractor_registration_data"
      conditional_checks:
        - trigger: "consumer_contract"
          keywords: ["гражданин", "потребитель", "для личных нужд"]
          rule: "consumer_info_mandatory"
          legal_base: "ст. 9 ЗоЗПП"
          severity: "critical"
          risk_msg: "Отсутствие паспортных данных потребителя может затруднить взыскание задолженности и выполнение гарантийных обязательств"

    - element: "subject_consumer_work"
      required: true
      legal_base: "ст. 4, 10 ЗоЗПП, ст. 732 ГК РФ"
      description: "Четкое описание работы и результата, предназначенных для удовлетворения личных, семейных, домашних нужд"
      validation_rules:
        - "work_description_specific"
        - "personal_purpose_indicated"
        - "material_result_check"
      conditional_checks:
        - trigger: "business_purpose_keywords"
          keywords: ["для бизнеса", "для предпринимательской деятельности", "для коммерческого использования"]
          rule: "reject_consumer_contract"
          legal_base: "ст. 730 ГК РФ"
          severity: "critical"
          risk_msg: "Если работа предназначена для предпринимательской деятельности, это не бытовой подряд"

    - element: "price_consumer_contract"
      required: true
      legal_base: "ст. 37 ЗоЗПП, ст. 735 ГК РФ"
      description: "Цена должна быть определена в твердой сумме или через смету. Смета является твердой и не может быть изменена без согласия потребителя"
      validation_rules:
        - "price_fixed_or_estimate"
        - "price_clearly_defined"
      conditional_checks:
        - trigger: "estimate_present"
          keywords: ["смета", "калькуляция", "расчет стоимости"]
          rule: "estimate_firmness_check"
          legal_base: "ст. 735 ГК РФ"
          severity: "high"
          validation_rules:
            - "estimate_is_firm"
            - "change_procedure_specified"

    - element: "performance_deadlines_consumer"
      required: true
      legal_base: "ст. 27, 28 ЗоЗПП, ст. 708 ГК РФ"
      description: "Сроки выполнения работ — существенное условие. Должны быть указаны конкретные даты начала и окончания"
      validation_rules:
        - "start_date_present"
        - "end_date_present"
        - "date_specificity_check"
      conditional_checks:
        - trigger: "consumer_contract"
          keywords: ["гражданин", "потребитель"]
          rule: "penalty_for_delay_applies"
          legal_base: "ст. 28 ЗоЗПП"
          severity: "high"
          risk_msg: "За просрочку подрядчик уплачивает неустойку 3% цены работы за каждый день просрочки"

    - element: "mandatory_information_provision"
      required: true
      legal_base: "ст. 8-10 ЗоЗПП, ст. 732 ГК РФ"
      description: "Подрядчик обязан предоставить полную информацию о себе, работе, порядке исполнения договора, правах потребителя"
      validation_rules:
        - "contractor_info_provided"
        - "work_info_provided"
        - "consumer_rights_info_provided"
        - "performance_procedure_info"
      conditional_checks:
        - trigger: "consumer_contract"
          keywords: ["гражданин", "потребитель"]
          rule: "information_mandatory"
          legal_base: "ст. 8 ЗоЗПП"
          severity: "critical"
          risk_msg: "Непредоставление информации влечет административную ответственность и право потребителя на отказ от договора"

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 3: ЗАЩИТНЫЕ УСЛОВИЯ (PROTECTIVE CLAUSES)
  # ──────────────────────────────────────────────────────────
  protective_clauses:
    
    # --- ЗАЩИТА ЗАКАЗЧИКА-ПОТРЕБИТЕЛЯ (CONSUMER PROTECTION) ---
    buyer_protection:
      - clause_id: "consumer_unilateral_refusal_right"
        name: "Право потребителя на односторонний отказ в любой момент до сдачи работы"
        risk_if_missing: |
          Даже если условие не прописано, оно действует в силу ст. 731, 782 ГК РФ и ст. 32 ЗоЗПП.
          Однако отсутствие в договоре приводит к спорам о сумме оплаты за выполненное.
          Подрядчики часто пытаются ввести "штрафы за отказ", которые незаконны.
        legal_base: "ст. 731 ГК РФ, ст. 32 ЗоЗПП"
        severity: "critical"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "право отказаться от договора"
            - "в любое время до сдачи работы"
            - "оплата фактически выполненной работы"
            - "уведомление об отказе"
            - "без применения штрафных санкций"
          negative_keywords:
            - "штраф за отказ"
            - "неустойка за расторжение"
            - "запрет на односторонний отказ"
          context_patterns:
            - '(?i)заказчик.*вправе.*отказаться.*от.*договора.*в.*любое.*время.*до.*сдачи.*работы'
            - '(?i)ст.*731.*ГК.*РФ.*и.*ст.*32.*ЗоЗПП.*сохраняют.*свою.*силу'
      
      - clause_id: "penalty_for_delay_consumer"
        name: "Неустойка 3% цены работы за каждый день просрочки"
        risk_if_missing: |
          Условие действует и без упоминания в договоре (ст. 28 ЗоЗПП).
          Однако потребитель может не знать о своем праве.
          Рекомендуется прямое указание для информирования потребителя.
        legal_base: "ст. 28 ЗоЗПП"
        severity: "high"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "неустойка за просрочку"
            - "3% цены работы"
            - "за каждый день просрочки"
            - "ответственность за нарушение сроков"
            - "пеня по закону о защите прав потребителей"
          context_patterns:
            - '(?i)за.*нарушение.*сроков.*подрядчик.*уплачивает.*неустойку.*3%.*цены.*работы'
            - '(?i)в.*соответствии.*со.*ст.*28.*ЗоЗПП.*за.*просрочку.*начисляется.*неустойка'
      
      - clause_id: "warranty_quality_consumer_rights"
        name: "Гарантийный срок и права потребителя при обнаружении недостатков"
        risk_if_missing: |
          Без четкого описания потребитель может не знать о своих правах: бесплатное устранение недостатков,
          соразмерное уменьшение цены, возмещение расходов на исправление, отказ от договора с возвратом денег.
          Подрядчики часто устанавливают сокращенные сроки для претензий, что незаконно.
        legal_base: "ст. 29, 30, 31 ЗоЗПП, ст. 722, 723, 737 ГК РФ"
        severity: "high"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "гарантийный срок"
            - "устранение недостатков бесплатно"
            - "право на соразмерное уменьшение цены"
            - "возмещение расходов на устранение недостатков"
            - "право отказаться от договора при существенных недостатках"
            - "срок для предъявления претензий по качеству"
          negative_keywords:
            - "претензии принимаются только в течение 7 дней"
            - "гарантия не распространяется на"
            - "отсутствие гарантии"
          context_patterns:
            - '(?i)в.*течение.*гарантийного.*срока.*обнаруженные.*недостатки.*устраняются.*бесплатно'
            - '(?i)потребитель.*вправе.*предъявить.*требования.*установленные.*ст.*29.*ЗоЗПП'
      
      - clause_id: "information_provision_requirement"
        name: "Требование о предоставлении полной и достоверной информации"
        risk_if_missing: |
          Непредоставление информации является самостоятельным нарушением, влекущим административную ответственность.
          Потребитель вправе отказаться от договора, если ему не предоставлена информация.
          Особенно критично для информации о материалах, их производителе, свойствах, безопасности.
        legal_base: "ст. 8-12 ЗоЗПП, ст. 732 ГК РФ"
        severity: "critical"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "подрядчик предоставляет информацию"
            - "сведения о материалах"
            - "техническая документация"
            - "памятка потребителя"
            - "информация о порядке и сроках выполнения"
            - "рекомендации по эксплуатации"
            - "предупреждение о возможных последствиях"
          context_patterns:
            - '(?i)подрядчик.*обязан.*предоставить.*полную.*и.*достоверную.*информацию'
            - '(?i)приложение.*№.*информация.*для.*потребителя'
      
      - clause_id: "jurisdiction_consumer_choice"
        name: "Подсудность по выбору потребителя"
        risk_if_missing: |
          Даже если в договоре указана подсудность по месту нахождения подрядчика, это условие ничтожно.
          Потребитель всегда может выбрать: суд по своему месту жительства, месту нахождения подрядчика 
          или месту заключения договора. Отсутствие напоминания об этом праве не лишает его.
        legal_base: "ст. 17 ЗоЗПП, ст. 29 ГПК РФ"
        severity: "medium"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "подсудность по выбору потребителя"
            - "споры рассматриваются по месту жительства потребителя"
            - "право выбора суда"
            - "в соответствии со ст. 17 ЗоЗПП"
          negative_keywords:
            - "исключительная подсудность"
            - "только по месту нахождения подрядчика"
            - "арбитражный суд"
          context_patterns:
            - '(?i)все.*споры.*рассматриваются.*в.*суде.*по.*месту.*жительства.*потребителя'
            - '(?i)потребитель.*вправе.*обратиться.*в.*суд.*по.*своему.*выбору'
    
    # --- ЗАЩИТА ПОДРЯДЧИКА (CONTRACTOR PROTECTION В УСЛОВИЯХ ЗоЗПП) ---
    seller_protection:
      - clause_id: "advance_payment_consumer"
        name: "Авансовый платеж и порядок расчетов с потребителем"
        risk_if_missing: |
          При отказе потребителя от договора подрядчик может требовать оплаты только фактически выполненного.
          Без условия об авансе рискует нести расходы на материалы без гарантии оплаты.
          Важно четко определить размер аванса и условия его невозврата.
        legal_base: "ст. 731 ГК РФ, ст. 32 ЗоЗПП"
        severity: "high"
        affected_party: "seller"
        detection:
          positive_keywords:
            - "авансовый платеж"
            - "предоплата"
            - "размер аванса"
            - "оплата по этапам"
            - "расчет за фактически выполненное"
            - "невозврат аванса при отказе после"
          context_patterns:
            - '(?i)заказчик.*уплачивает.*аванс.*в.*размере.*[0-9]+%.*от.*цены.*договора'
            - '(?i)при.*отказе.*заказчика.*аванс.*подлежит.*возврату.*за.*вычетом.*фактически.*понесенных.*расходов'
      
      - clause_id: "acceptance_procedure_consumer"
        name: "Порядок приемки работ потребителем и последствия уклонения"
        risk_if_missing: |
          Потребитель может уклоняться от приемки, затягивая окончательный расчет.
          Без механизма односторонней приемки подрядчик не может считать обязательство исполненным.
          Важно установить разумный срок для приемки и последствия его пропуска.
        legal_base: "ст. 720 ГК РФ"
        severity: "high"
        affected_party: "seller"
        detection:
          positive_keywords:
            - "срок для приемки работ"
            - "работы считаются принятыми"
            - "односторонний акт при уклонении"
            - "уведомление о готовности работ"
            - "отсутствие возражений в течение"
          context_patterns:
            - '(?i)если.*заказчик.*не.*явился.*для.*приемки.*в.*течение.*[0-9]+.*дней.*работы.*считаются.*принятыми'
            - '(?i)при.*уклонении.*от.*приемки.*подрядчик.*составляет.*односторонний.*акт'
      
      - clause_id: "material_selection_approval"
        name: "Согласование выбора материалов и дизайнерских решений"
        risk_if_missing: |
          Потребитель может впоследствии заявить, что результат не соответствует ожиданиям.
          Без письменного подтверждения выбора материалов, цветов, моделей подрядчик рискует
          понести расходы на переделку или столкнуться с претензиями по качеству.
        legal_base: "ст. 721 ГК РФ"
        severity: "medium"
        affected_party: "seller"
        detection:
          positive_keywords:
            - "выбор материалов согласовывается"
            - "образцы материалов"
            - "утверждение дизайн-проекта"
            - "письменное подтверждение выбора"
            - "акт выбора материалов"
            - "ответственность за выбор заказчика"
          context_patterns:
            - '(?i)заказчик.*утверждает.*образцы.*материалов.*путем.*подписания.*соответствующего.*акта'
            - '(?i)изменение.*выбранных.*материалов.*после.*утверждения.*влечет.*дополнительные.*расходы'
      
      - clause_id: "claim_procedure_timeframe"
        name: "Процедура и сроки предъявления претензий"
        risk_if_missing: |
          Без установленного порядка потребитель может предъявить претензию в любой момент
          в течение гарантийного срока (до 2 лет), что создает неопределенность.
          Важно установить разумный срок для осмотра и письменного оформления претензии.
        legal_base: "ст. 29 ЗоЗПП"
        severity: "medium"
        affected_party: "seller"
        detection:
          positive_keywords:
            - "претензия в письменной форме"
            - "срок для предъявления претензий"
            - "акт о недостатках"
            - "осмотр совместно с подрядчиком"
            - "экспертиза качества"
          context_patterns:
            - '(?i)претензии.*по.*качеству.*предъявляются.*в.*письменной.*форме.*в.*течение.*[0-9]+.*дней.*с.*момента.*обнаружения'
            - '(?i)осмотр.*объекта.*и.*составление.*акта.*осуществляется.*совместно.*со.*специалистом.*подрядчика'

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 4: ДОПОЛНИТЕЛЬНЫЕ PROTECTIVE CLAUSES (СПЕЦИФИКА ПОТРЕБИТЕЛЬСКОГО ПОДРЯДА)
  # ──────────────────────────────────────────────────────────
  additional_protective_clauses:
    
    buyer_seller_protection:
      - clause_id: "estimate_firmness_no_surcharge"
        name: "Твердость сметы и запрет на требование доплат"
        risk_if_missing: |
          Подрядчик не вправе требовать увеличения твердой цены, а потребитель — уменьшения.
          Исключение — если потребитель согласен на изменение характера работ.
          Нарушение этого правила — основание для отказа потребителя от договора и возврата уплаченного.
        legal_base: "ст. 735 ГК РФ, ст. 33 ЗоЗПП"
        severity: "critical"
        affected_party: "both"
        detection:
          positive_keywords:
            - "смета является твердой"
            - "цена не подлежит изменению"
            - "запрет на требование доплат"
            - "изменение цены только с согласия заказчика"
            - "дополнительные работы по отдельному соглашению"
          context_patterns:
            - '(?i)цена.*договора.*является.*твердой.*и.*не.*подлежит.*изменению.*в.*одностороннем.*порядке'
            - '(?i)смета.*составленная.*подрядчиком.*является.*твердой.*и.*не.*может.*быть.*превышена'
      
      - clause_id: "consequences_of_improper_operation"
        name: "Последствия нарушения правил эксплуатации и самостоятельного ремонта"
        risk_if_missing: |
          Потребитель может нарушать правила эксплуатации, что приведет к повреждениям.
          Без условия подрядчик будет нести гарантийные обязательства за повреждения, вызванные
          неправильной эксплуатацией. Важно разграничить ответственность.
        legal_base: "ст. 18 ЗоЗПП"
        severity: "medium"
        affected_party: "seller"
        detection:
          positive_keywords:
            - "нарушение правил эксплуатации"
            - "самостоятельный ремонт"
            - "гарантия не распространяется"
            - "акт о нарушении условий эксплуатации"
            - "техническая документация и инструкции"
          context_patterns:
            - '(?i)гарантийные.*обязательства.*не.*распространяются.*на.*повреждения.*вызванные.*нарушением.*правил.*эксплуатации'
            - '(?i)при.*самостоятельном.*ремонте.*гарантия.*прекращается'
      
      - clause_id: "moral_harm_compensation_acknowledgment"
        name: "Указание на возможность компенсации морального вреда"
        risk_if_missing: |
          Суды часто взыскивают моральный вред с подрядчиков по делам о защите прав потребителей.
          Отсутствие упоминания не освобождает от ответственности, но потребитель может не знать о своем праве.
          Для подрядчика — сигнал о повышенных рисках.
        legal_base: "ст. 15 ЗоЗПП"
        severity: "medium"
        affected_party: "both"
        detection:
          positive_keywords:
            - "компенсация морального вреда"
            - "право на возмещение морального вреда"
            - "в соответствии со ст. 15 ЗоЗПП"
            - "причинение нравственных страданий"
          context_patterns:
            - '(?i)при.*нарушении.*прав.*потребитель.*вправе.*требовать.*компенсации.*морального.*вреда'
            - '(?i)подрядчик.*осознает.*что.*нарушение.*сроков.*или.*качества.*может.*повлечь.*взыскание.*морального.*вреда'