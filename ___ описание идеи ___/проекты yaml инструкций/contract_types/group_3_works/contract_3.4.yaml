type: contract_3.4
name: "Договор на выполнение проектных и изыскательских работ (ПИР)"
description: |
  Специализированный вид подряда, направленный на создание интеллектуального продукта: проектной и рабочей документации для строительства (стадии «П» и «Р») и/или отчетов по инженерным изысканиям.
  Результат имеет документарную форму и служит основой для последующих строительных работ, определяя их стоимость, безопасность и реализуемость.
  Отличается от подряда отсутствием вещественного результата, но сохраняет признаки работы по заданию. Регулируется § 4 Главы 37 ГК РФ и Градостроительным кодексом РФ.
version: 2.1
parent: class_3_work_performance
sibling_contracts:
  - contract_3.3 # Строительный подряд (следующий этап)
  - contract_1.12 # Авторский заказ (если только дизайн)
metadata:
  category: contract
  subcategory: work_performance
  complexity: high # Требует знаний ГрК РФ, норм проектирования и авторского права
  risk_level: high # Ошибки в проекте ведут к каскадным убыткам на стадии строительства
  legal_base: § 4 Главы 37 ГК РФ (ст. 758-762)
  hierarchy_position: "child_specialized"

# ════════════════════════════════════════════════════════════
# КВАЛИФИКАЦИЯ И ПРИЗНАКИ (ОПТИМИЗИРОВАНО)
# ════════════════════════════════════════════════════════════
rules:
  keywords:
    high:
      - "проектирование"
      - "изыскания"
      - "проектная документация"
      - "рабочая документация"
      - "стадия П"
      - "стадия Р"
      - "техническое задание на проектирование"
      - "отчет по изысканиям"
    medium:
      - "инженерные изыскания"
      - "экспертиза проекта"
      - "исходные данные"
      - "авторский надзор"
      - "ГПЗУ градостроительный план земельного участка"
      - "согласование в органах"
    low:
      - "чертежи"
      - "сметная стоимость"
      - "пояснительная записка"
      - "разделы проектной документации"
      - "СБЦ справочник базовых цен"
  phrases:
    high:
      - разработать проектную и рабочую документацию на объект
      - выполнить инженерные изыскания
      - получить положительное заключение экспертизы
      - передать исключительные права на документацию
    medium:
      - Подрядчик гарантирует соответствие документации исходным данным, ТЗ и нормативам
      - Ответственность Подрядчика ограничивается недостатками документации, но не распространяется на ошибки строителей
      - Проектная документация подлежит экспертизе в установленном законом порядке
  patterns:
    required:
      - (?i)(проектн.*документаци|инженерн.*изыскани|стади.*(П|Р)|техническ.*задани.*на.*проектирование)
    optional:
      - (?i)(экспертиз.*проектн.*документаци|исходн.*данны|авторск.*надзор|положительн.*заключени)
  exclusions:
    - строительно-монтажные работы (строительный подряд)
    - научно-исследовательские работы (НИОКР) без проектного результата
    - разработка программного обеспечения
    - дизайн-проект интерьера как самостоятельный объект авторского права (для квартир — может быть бытовым подрядом)
  exclusion_logic:
    - condition: "physical_construction_works OR pure_research_without_design"
      target: "rejection"
      confidence: 0.90
      description: "Если договор предполагает физическое создание объекта или фундаментальные научные исследования без проектного результата"
  weights:
    keyword_high: 3.5
    keyword_medium: 1.8
    keyword_low: 0.7
    phrase_high: 4.0
    phrase_medium: 1.2
    pattern_required: 5.0
    pattern_optional: 1.0
  classification:
    min_confidence: 0.85  # Высокий порог из-за специализации и серьезных последствий
    max_matches: 3

party_roles:
  - Заказчик (Client) — инвестор, застройщик, технический заказчик
  - Подрядчик (Designer) — проектная или изыскательская организация (проектировщик, изыскатель)
  - Генеральный проектировщик (при наличии субподрядчиков по разделам)

essential_terms:
  - Предмет: конкретный вид работ (проектирование/изыскания), наименование объекта, стадия («П» или «Р»)
  - Техническое задание (ТЗ) — обязательное приложение, определяющее объем и требования
  - Сроки выполнения работ по этапам (исходные данные -> эскиз -> стадия П -> экспертиза -> стадия Р)

specific_risks:
  - Отрицательное заключение экспертизы (работа выполнена, но результат непригоден для строительства)
  - Ошибки в исходных данных Заказчика, ведущие к необходимости переделки проекта (споры о том, кто платит)
  - Отсутствие у Заказчика прав на повторное использование проекта (для типовой застройки)
  - Ограниченность ответственности проектировщика (часто суммой договора) при потенциально гигантских убытках от ошибки
  - Просрочка разработки документации, срыв сроков всего инвестиционно-строительного проекта
  - Споры об интеллектуальных правах на проектную документацию и условиях ее использования

aliases:
  - Договор подряда на проектирование
  - Контракт на инженерные изыскания
  - Договор ПИР
  - Design Contract
  - Договор на разработку проектно-сметной документации

section_markers:
  - Предмет договора (объект, вид и стадия работ)
  - Техническое задание (приложение, требования, нормативы)
  - Исходные данные (перечень, сроки и порядок предоставления)
  - Стоимость работ и порядок расчетов (твердая цена, % от СМР, по СБЦ)
  - Сроки выполнения работ (календарный план, этапы, график)
  - Права и обязанности сторон (предоставление данных, согласование этапов)
  - Порядок сдачи-приемки результатов работ (комплектность документации, акты)
  - Экспертиза проектной документации (порядок прохождения, распределение обязанностей)
  - Качество работ и ответственность за недостатки
  - Права на результаты интеллектуальной деятельности
  - Авторский надзор (опционально)
  - Конфиденциальность
  - Ответственность сторон
  - Разрешение споров
  - Заключительные положения

notes: |
  КРИТИЧЕСКИЕ АСПЕКТЫ ДОГОВОРА ПИР:
  1. Стадийность: «П» (Проектная документация) — для экспертизы и получения разрешения на строительство; «Р» (Рабочая документация) — для производства строительно-монтажных работ.
  2. Техническое задание (ТЗ) — краеугольный камень. Его нечеткость — источник большинства споров.
  3. Экспертиза: положительное заключение — ключевой критерий приемки для Заказчика. Часто окончательный расчет привязан к его получению.
  4. Интеллектуальные права: по умолчанию принадлежат исполнителю (ст. 1298 ГК РФ). Для свободного использования проекта Заказчиком требуется передача исключительных прав.
  5. Ответственность проектировщика ограничивается документацией и обычно суммой договора, что несопоставимо с рисками от ошибок на стадии строительства.

# ════════════════════════════════════════════════════════════
# 🆕 ВАЛИДАЦИОННЫЕ СЕКЦИИ (VALIDATION ENGINE v2.0 - ГИБРИД)
# ════════════════════════════════════════════════════════════

validation_metadata:
  validation_version: "2.0"
  last_updated: "2026-02-07"
  author: "Legal AI Team"

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 1: ПРИМЕНИМОЕ ЗАКОНОДАТЕЛЬСТВО (ОБЪЕДИНЕНО)
  # ──────────────────────────────────────────────────────────
  legal_base:
    primary:
      - "§ 4 Главы 37 ГК РФ (ст. 758-762)"
      - "Градостроительный кодекс РФ (ст. 47, 48, 49, 55.8)"
    secondary:
      - "Федеральный закон от 30.12.2009 № 384-ФЗ 'Технический регламент о безопасности зданий и сооружений'"
      - "Постановление Правительства РФ от 16.02.2008 № 87 'О составе разделов проектной документации'"
      - "Часть IV ГК РФ (ст. 1296, 1298, 1299 — права на служебные произведения и результаты проектирования)"
    related:
      - "Постановление Правительства РФ от 24.03.2021 № 438 'Об инженерных изысканиях'"
      - "СП (Своды правил), ГОСТ, СНиП — действующие нормативы проектирования"
      - "Методика применения справочников базовых цен на проектные работы (СБЦ)"

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 2: ОБЯЗАТЕЛЬНЫЕ ЭЛЕМЕНТЫ (ESSENTIAL ELEMENTS - ГИБРИД)
  # ──────────────────────────────────────────────────────────
  essential_elements:
    - element: "design_task_specification"
      name: "Техническое задание на проектирование (ТЗ)"
      required: true
      legal_base: "ст. 759 ГК РФ"
      description: "Утверждается Заказчиком. Основной документ, определяющий параметры объекта, объем работ, требования. Должно быть приложением к договору."
      risk_msg: "Без детального ТЗ границы требований к результату не определены, спор о качестве и объеме работ неизбежен."
      validation_rules:
        - "technical_specification_referenced"
        - "specification_attachment_check"
        - "norms_and_standards_specified"

    - element: "object_and_stage_description"
      required: true
      legal_base: "ст. 758 ГК РФ"
      description: "Четкое описание объекта проектирования/изысканий, местоположения, стадии проектирования («П» - проектная, «Р» - рабочая)"
      validation_rules:
        - "object_name_present"
        - "location_specified"
        - "design_stage_defined"
      conditional_checks:
        - trigger: "capital_construction_object"
          keywords: ["объект капитального строительства", "здание", "сооружение"]
          rule: "design_stage_specification_required"
          legal_base: "ст. 48 Градостроительного кодекса"
          severity: "high"
          risk_msg: "Для объектов капстроительства необходимо указание стадии проектирования (П, Р или «проектная и рабочая документация»)"

    - element: "initial_data_provision_terms"
      required: true
      legal_base: "ст. 759 ГК РФ"
      description: "Сроки и порядок предоставления Заказчиком исходных данных (ГПЗУ, ТУ, материалы изысканий). Последствия задержки."
      validation_rules:
        - "initial_data_list_present"
        - "provision_deadlines_specified"
        - "consequences_of_delay_defined"

    - element: "performance_deadlines_milestones"
      required: true
      legal_base: "ст. 708, 760 ГК РФ"
      description: "Сроки выполнения работ, включая ключевые этапы (согласование эскиза, представление на экспертизу, сдача РД). График должен быть привязан к предоставлению исходных данных."
      validation_rules:
        - "start_date_present"
        - "end_date_present"
        - "milestone_schedule_referenced"
      conditional_checks:
        - trigger: "expertise_required"
          keywords: ["экспертиза проектной документации", "положительное заключение"]
          rule: "expertise_milestone_required"
          legal_base: "ст. 49 ГрК РФ"
          severity: "critical"
          risk_msg: "Для проектов, подлежащих экспертизе, в графике должен быть отдельный этап/срок для ее прохождения"

    - element: "contract_price_calculation_basis"
      required: true
      legal_base: "ст. 709 ГК РФ"
      description: "Цена работ (твердая или приблизительная) и основание для ее определения (смета по СБЦ, % от стоимости строительства, фиксированная сумма)."
      validation_rules:
        - "price_or_calculation_method_present"
        - "price_basis_specified"

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 3: ЗАЩИТНЫЕ УСЛОВИЯ (PROTECTIVE CLAUSES - ОБЪЕДИНЕНО)
  # ──────────────────────────────────────────────────────────
  protective_clauses:
    
    # --- ЗАЩИТА ЗАКАЗЧИКА (CUSTOMER PROTECTION) ---
    buyer_protection:
      - clause_id: "expertise_approval_payment_condition"
        name: "Оплата (окончательный расчет) привязана к положительному заключению экспертизы"
        risk_if_missing: |
          Проектная документация без положительного заключения экспертизы не имеет ценности для строительства.
          Если окончательная оплата не зависит от успешного прохождения экспертизы, Заказчик рискует заплатить за непригодный результат.
        legal_base: "ст. 760 ГК РФ, ст. 49 ГрК РФ"
        severity: "critical"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "оплата после получения положительного заключения экспертизы"
            - "окончательный расчет производится в течение X дней с даты получения заключения"
            - "условием окончательной приемки является положительное заключение экспертизы"
          context_patterns:
            - '(?i)окончательная.*оплата.*осуществляется.*после.*предоставления.*положительного.*заключения.*экспертизы'
      
      - clause_id: "ip_rights_full_transfer"
        name: "Полный переход исключительных прав на документацию к Заказчику"
        risk_if_missing: |
          Архитектурный проект — объект авторского права. Без передачи исключительных прав Заказчик получает лишь право на однократную реализацию проекта.
          Он не сможет использовать проект повторно (для типовой застройки), вносить изменения или передавать другим без согласия автора, что резко снижает ценность результата.
        legal_base: "ст. 1296, 1298 ГК РФ"
        severity: "high"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "исключительные права переходят к Заказчику"
            - "отчуждение исключительного права в полном объеме"
            - "право на любое использование, включая тиражирование и модификацию"
            - "проектная документация является собственностью Заказчика"
          negative_keywords:
            - "лицензия"
            - "право использования в ограниченных целях"
            - "права остаются у Подрядчика"
          context_patterns:
            - '(?i)исключительные.*права.*на.*результаты.*работ.*передаются.*заказчику.*в.*момент.*полной.*оплаты'
      
      - clause_id: "stagewise_approval_rejection_right"
        name: "Поэтапное согласование и право отклонения промежуточных результатов"
        risk_if_missing: |
          Без поэтапного согласования Заказчик увидит готовый проект, который может кардинально не соответствовать ожиданиям.
          Требование переделки всего объема приведет к конфликту. Право на отказ от промежуточного результата с указанием замечаний — ключевой инструмент управления процессом и качеством.
        legal_base: "ст. 760 ГК РФ"
        severity: "high"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "поэтапное согласование"
            - "представление эскизного проекта на утверждение"
            - "право заказчика вносить замечания"
            - "срок на рассмотрение этапа"
            - "отклонение промежуточного результата"
          context_patterns:
            - '(?i)подрядчик.*представляет.*эскизный.*проект.*на.*согласование.*заказчику.*в.*течение.*[0-9]+.*дней'
            - '(?i)заказчик.*вправе.*отклонить.*представленный.*этап.*с.*предоставлением.*мотивированных.*замечаний'
      
      - clause_id: "contractor_liability_for_design_errors"
        name: "Ответственность Подрядчика за ошибки в документации, включая расходы на переделку СМР"
        risk_if_missing: |
          Ошибки проектировщика часто всплывают только при строительстве или даже эксплуатации. Ст. 761 ГК РФ устанавливает ответственность, но она может толковаться узко.
          Без прямого указания на возмещение убытков, включая затраты на устранение дефектов в уже построенном, Заказчик рискует остаться с огромными расходами.
        legal_base: "ст. 15, 393, 761, 762 ГК РФ"
        severity: "critical"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "возместить убытки, вызванные ошибками в документации"
            - "ответственность за недостатки, обнаруженные в ходе строительства"
            - "обязанность компенсировать затраты на переделку строительных работ"
            - "возмещение ущерба, возникшего в результате реализации ошибочного проекта"
          context_patterns:
            - '(?i)подрядчик.*несет.*ответственность.*за.*все.*убытки.*заказчика.*возникшие.*вследствие.*недостатков.*проектной.*документации'
    
    # --- ЗАЩИТА ПОДРЯДЧИКА (CONTRACTOR PROTECTION) ---
    seller_protection:
      - clause_id: "initial_data_quality_disclaimer"
        name: "Непроверка и освобождение от ответственности за недостоверность исходных данных"
        risk_if_missing: |
          Проектировщик основывается на данных Заказчика (геология, техусловия, ГПЗУ). Если эти данные окажутся ложными или неполными, проект будет нереализуем или ошибочен.
          Без прямой оговорки проектировщик может быть привлечен к ответственности за последствия, возникшие не по его вине.
        legal_base: "ст. 759 ГК РФ, принцип добросовестности"
        severity: "high"
        affected_party: "seller"
        detection:
          positive_keywords:
            - "исходные данные предоставляются заказчиком"
            - "подрядчик не проверяет достоверность исходных данных"
            - "ответственность за достоверность исходных данных лежит на заказчике"
            - "освобождение от ответственности при недостоверных данных"
            - "право на дополнительную оплату при изменении исходных данных"
          context_patterns:
            - '(?i)подрядчик.*не.*проверяет.*и.*не.*несет.*ответственности.*за.*достоверность.*исходных.*данных.*предоставленных.*заказчиком'
      
      - clause_id: "limitation_of_liability_proportional"
        name: "Ограничение ответственности суммой договора или его частью"
        risk_if_missing: |
          Убытки от ошибки в проекте могут в десятки/сотни раз превышать стоимость проектных работ. Без ограничения ответственности проектная организация рискует банкротством из-за одного проекта.
          Ограничение является отраслевым стандартом, но должно быть разумным и соотноситься со стоимостью работ.
        legal_base: "ст. 15, 393, 401 ГК РФ"
        severity: "critical"
        affected_party: "seller"
        detection:
          positive_keywords:
            - "ответственность ограничена стоимостью договора"
            - "совокупная ответственность не превышает [X]% цены договора"
            - "не возмещаются косвенные убытки и упущенная выгода"
            - "ограничение ответственности суммой выплат по договору"
          context_patterns:
            - '(?i)совокупная.*ответственность.*подрядчика.*по.*любым.*претензиям.*не.*может.*превышать.*[0-9]+%.*от.*цены.*договора'
      
      - clause_id: "approval_deadlines_auto_extension"
        name: "Автоматическое продление сроков при задержке согласования Заказчиком"
        risk_if_missing: |
          Проектирование — итеративный процесс. Заказчик должен согласовывать планировки, фасады, решения. Если он затягивает рассмотрение, сроки срываются по его вине.
          Без условия о продлении сроков Подрядчик несет риски и может быть оштрафован за просрочку, которая фактически вызвана действиями Заказчика.
        legal_base: "ст. 328, 719 ГК РФ"
        severity: "high"
        affected_party: "seller"
        detection:
          positive_keywords:
            - "срок выполнения продлевается на время задержки согласования"
            - "автоматическое продление сроков"
            - "время рассмотрения документации Заказчиком не включается в срок выполнения"
            - "обязанность Заказчика предоставить замечания в течение X дней"
          context_patterns:
            - '(?i)срок.*выполнения.*работ.*продлевается.*на.*срок.*фактической.*задержки.*согласования.*со.*стороны.*заказчика'
      
      - clause_id: "stage_payment_upon_approval"
        name: "Поэтапная оплата, привязанная к согласованию и подписанию актов этапов"
        risk_if_missing: |
          Проектные работы требуют значительных интеллектуальных затрат на начальных стадиях. Без аванса и четкой привязки платежей к согласованию этапов Подрядчик финансирует процесс.
          Заказчик может затягивать согласование, не оплачивая выполненную работу, создавая кассовый разрыв у Подрядчика.
        legal_base: "ст. 711, 762 ГК РФ"
        severity: "high"
        affected_party: "seller"
        detection:
          positive_keywords:
            - "оплата по этапам"
            - "авансовый платеж"
            - "оплата после согласования эскиза"
            - "счет выставляется после подписания акта сдачи-приемки этапа"
          context_patterns:
            - '(?i)оплата.*производится.*поэтапно.*после.*подписания.*сторонами.*акта.*сдачи-приемки.*соответствующего.*этапа'

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 4: ДОПОЛНИТЕЛЬНЫЕ PROTECTIVE CLAUSES (ГИБРИД)
  # ──────────────────────────────────────────────────────────
  additional_protective_clauses:
    
    buyer_seller_protection:
      - clause_id: "sro_membership_representation"
        name: "Подтверждение членства в СРО проектировщиков (при необходимости)"
        risk_if_missing: |
          Проектировщик обязан быть членом СРО для выполнения работ на объектах, требующих экспертизы (ст. 55.8 ГрК РФ).
          Отсутствие допуска СРО делает невозможным получение положительного заключения экспертизы, что аннулирует ценность работ и является нарушением лицензионных требований.
        legal_base: "ст. 55.8 Градостроительного кодекса РФ"
        severity: "critical"
        affected_party: "both"
        detection:
          positive_keywords:
            - "подрядчик подтверждает членство в СРО"
            - "действующий допуск СРО на проектирование"
            - "реквизиты свидетельства СРО"
            - "обязанность поддерживать членство в СРО на весь срок действия договора"
          context_patterns:
            - '(?i)подрядчик.*гарантирует.*наличие.*действующего.*допуска.*СРО.*на.*выполнение.*проектных.*работ'
        conditional_checks:
          - trigger: "object_requires_expertise"
            keywords: ["экспертиза проектной документации", "объект капитального строительства"]
            rule: "sro_clause_mandatory"
            severity: "critical"
      
      - clause_id: "liability_delimitation_from_constructor"
        name: "Разграничение ответственности проектировщика и строителя"
        risk_if_missing: |
          Заказчик может пытаться возложить на проектировщика ответственность за ошибки строителей, неправильную интерпретацию чертежей, использование не тех материалов.
          Без четкого разграничения проектировщик втягивается в споры, к которым не имеет отношения, и несет необоснованные расходы. Авторский надзор — отдельная услуга.
        legal_base: "ст. 761 ГК РФ"
        severity: "high"
        affected_party: "seller"
        detection:
          positive_keywords:
            - "ответственность ограничивается качеством документации"
            - "не несет ответственности за действия строителей"
            - "отклонения от проекта без согласования с проектировщиком"
            - "авторский надзор осуществляется по отдельному договору"
          context_patterns:
            - '(?i)подрядчик.*несет.*ответственность.*только.*за.*соответствие.*проектной.*документации.*нормам.*и.*не.*отвечает.*за.*ее.*реализацию.*строителями'
      
      - clause_id: "confidentiality_and_data_return"
        name: "Конфиденциальность проектной информации и возврат материалов"
        risk_if_missing: |
          Проектная документация содержит коммерчески ценную информацию, исходные данные Заказчика могут быть ноу-хау. Утечка конкурентам или несанкционированное использование проектировщиком в других проектах наносит ущерб.
          Неопределенность в судьбе черновиков и промежуточных материалов после завершения работ создает почву для конфликтов.
        legal_base: "ст. 139 ГК РФ (устар.), Федеральный закон № 98-ФЗ 'О коммерческой тайне'"
        severity: "medium"
        affected_party: "both"
        detection:
          positive_keywords:
            - "конфиденциальная информация"
            - "обязательство неразглашения"
            - "возврат или уничтожение всех материалов после завершения работ"
            - "промежуточные материалы и черновики остаются собственностью подрядчика"
            - "штраф за разглашение коммерческой тайны"
          context_patterns:
            - '(?i)стороны.*обязуются.*сохранять.*конфиденциальность.*всех.*полученных.*в.*рамках.*договора.*материалов.*и.*информации'