type: contract_3.3
name: Договор строительного подряда
description: |
  Регулирует отношения по созданию или реконструкции объектов недвижимости (зданий, сооружений), 
  а также выполнению неразрывно связанных с ними монтажных, пусконаладочных и иных работ. 
  Характеризуется сложной технической документацией, длительными сроками, высокими рисками 
  и особым порядком приемки. Балансирует между общими нормами подряда и специальным строительным 
  законодательством. Регулируется § 3 Главы 37 ГК РФ.
version: 2.0
parent: class_3_work_performance
metadata:
  category: contract
  subcategory: work_performance
  complexity: high  # Высокая сложность из-за технических и юридических аспектов
  risk_level: high  # Высокий риск из-за стоимости объектов, длительности и регулирования
  legal_base: § 3 Главы 37 ГК РФ (ст. 740-757)

# ════════════════════════════════════════════════════════════
# КВАЛИФИКАЦИЯ И ПРИЗНАКИ
# ════════════════════════════════════════════════════════════
rules:
  keywords:
    high:
      - "строительный подряд"
      - "строительств"
      - "объект капитального строительства"
      - "генподрядчик"
      - "проектная документация"
      - "строительно-монтажные работы"
      - "возведение здания"
      - "капитальное строительство"
      - "ПОС"
      - "план организации строительства"
      - "смета"
      - "разрешение на строительство"
      - "акт ввода в эксплуатацию"
    medium:
      - "реконструкция"
      - "монтажные работы"
      - "пусконаладочные работы"
      - "технический надзор"
      - "скрытые работы"
      - "КС-2"
      - "КС-3"
      - "гарантийные обязательства"
    low:
      - "строительно-монтажные работы"
      - "объект недвижимости"
      - "рабочая документация"
      - "строительная площадка"
      - "субподрядчик"
      - "акт освидетельствования"
  phrases:
    high:
      - Подрядчик обязуется построить по заданию Заказчика определенный объект либо выполнить иные строительные работы
      - Заказчик обязуется создать Подрядчику необходимые условия для выполнения работ, принять результат и оплатить
      - Стороны руководствуются проектной документацией и сметой, являющимися неотъемлемыми частями договора
      - Приемка результата работ оформляется актом, подписанным обеими сторонами
    medium:
      - Подрядчик вправе привлекать к исполнению субподрядчиков, оставаясь ответственным перед Заказчиком
      - Заказчик осуществляет контроль и надзор, но не вмешивается в оперативно-хозяйственную деятельность Подрядчика
      - Обязанность по обеспечению строительства материалами может быть возложена на любую из сторон
      - Гарантийный срок на объект в целом составляет 5 лет, на инженерные сети — 2 года
  patterns:
    required:
      - (?i)(строительный.*подряд|объект.*капитального.*строительства|генподрядчик|проектн.*документация|разрешен.*на.*строительство)
    optional:
      - (?i)(акт.*выполненн.*работ.*КС|смет.*стоимост|гарантийн.*срок.*(5|пять).*лет)
      - (?i)(реконструкция.*здания|монтаж.*оборудования|пусконаладочн.*работ)
  exclusions:
    - текущий ремонт без изменения конструктивных характеристик
    - договор на выполнение проектных и изыскательских работ (ПИР)
    - договор бытового подряда на строительные работы для гражданина
    - договор долевого участия в строительстве (214-ФЗ)
  exclusion_logic:
    - condition: "repair_without_structural_changes OR design_works_only"
      target: "rejection"
      confidence: 0.90
      description: "Если работы не являются капитальным строительством или это только проектирование"
  weights:
    keyword_high: 3.5  # Повышенный вес из-за специфики
    keyword_medium: 1.8
    keyword_low: 0.7
    phrase_high: 3.0
    phrase_medium: 1.2
    pattern_required: 4.5
    pattern_optional: 1.0
  classification:
    min_confidence: 0.82  # Высокий порог из-за серьезных правовых последствий
    max_matches: 3

party_roles:
  - Заказчик (технический заказчик, инвестор, будущий собственник/балансодержатель)
  - Генеральный подрядчик (организация, несущая ответственность за весь комплекс работ)
  - Субподрядчик (исполнитель отдельных видов работ по договору с генподрядчиком)

essential_terms:
  - Предмет: конкретный объект капитального строительства или комплекс строительных работ
  - Проектная документация (утвержденная, с положительным заключением экспертизы)
  - Цена договора (твердая или приблизительная смета) и сроки выполнения

specific_risks:
  - Срыв сроков ввода объекта из-за организационных, финансовых или технических проблем
  - Превышение сметной стоимости при отсутствии механизма контроля изменений
  - Обнаружение скрытых дефектов и недостатков в период гарантийной эксплуатации
  - Риск неполучения разрешения на ввод объекта в эксплуатацию (градостроительные нарушения)
  - Ответственность за несчастные случаи на строительной площадке
  - Сложность и дороговизна судебных строительно-технических экспертиз
  - Риск приостановки или запрета строительства контролирующими органами
  - Валютные и инфляционные риски при длительных сроках строительства

aliases:
  - Строительный подряд
  - Договор на выполнение строительно-монтажных работ
  - Генеральный подряд в строительстве
  - Договор капитального строительства
  - Реконструкция объекта

section_markers:
  - Предмет договора (наименование, характеристика, местоположение объекта)
  - Исходные данные и документация (проектная, рабочая документация, техзадание)
  - Стоимость работ и порядок расчетов (смета, этапы, авансирование)
  - Сроки выполнения работ (календарный план, график)
  - Обязанности Заказчика (предоставление площадки, разрешений, финансирование)
  - Обязанности Подрядчика (выполнение работ, качество, охрана труда, отчетность)
  - Контроль и технический надзор
  - Порядок сдачи-приемки работ (промежуточная, окончательная, форма актов)
  - Гарантийные обязательства (сроки, объем, порядок устранения недостатков)
  - Распределение рисков (гибели объекта, материалов, форс-мажор)
  - Ответственность сторон (неустойки, возмещение убытков)
  - Разрешение споров и подсудность
  - Заключительные положения

notes: |
  КЛЮЧЕВЫЕ ОСОБЕННОСТИ СТРОИТЕЛЬНОГО ПОДРЯДА:
  1. Обязательность проектной документации, прошедшей экспертизу (для объектов, требующих разрешения на строительство).
  2. Широкое использование субподрядных схем — генподрядчик отвечает за работу субподрядчиков.
  3. Специальные формы первичной документации (КС-2, КС-3, акты освидетельствования скрытых работ).
  4. Длительные гарантийные сроки (5 лет на объект в целом, 2 года на инженерные сети — ст. 756 ГК РФ).
  5. Право Заказчика на осуществление контроля и надзора без вмешательства в хозяйственную деятельность.
  6. Возможность привлечения инженера (технического заказчика) для управления проектом.
  7. Строгое соблюдение градостроительного, технического и экологического законодательства.

# ════════════════════════════════════════════════════════════
# 🆕 ВАЛИДАЦИОННЫЕ СЕКЦИИ (VALIDATION ENGINE v2.0)
# ════════════════════════════════════════════════════════════

validation_metadata:
  validation_version: "2.0"
  last_updated: "2026-02-07"
  author: "Legal AI Team"

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 1: ПРИМЕНИМОЕ ЗАКОНОДАТЕЛЬСТВО (КОМПЛЕКСНОЕ)
  # ──────────────────────────────────────────────────────────
  legal_base:
    primary:
      - "§ 3 Главы 37 ГК РФ (ст. 740-757)"
      - "Градостроительный кодекс РФ (особенно ст. 51, 55)"
    secondary:
      - "Федеральный закон от 30.12.2009 № 384-ФЗ 'Технический регламент о безопасности зданий и сооружений'"
      - "Федеральный закон от 25.02.1999 № 39-ФЗ 'Об инвестиционной деятельности'"
      - "Постановление Госстроя РФ от 05.03.2004 № 15/1 'Об утверждении и введении в действие Методики определения стоимости строительной продукции'"
    related:
      - "Федеральный закон от 01.12.2007 № 315-ФЗ 'О саморегулируемых организациях' (требования к допускам)"
      - "Постановление Правительства РФ от 16.02.2008 № 87 'О составе разделов проектной документации'"
      - "Положение о проведении экспертизы проектной документации (утв. Постановлением Правительства РФ № 145)"
      - "Трудовой кодекс РФ, правила охраны труда в строительстве"

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 2: ОБЯЗАТЕЛЬНЫЕ ЭЛЕМЕНТЫ (ESSENTIAL ELEMENTS)
  # ──────────────────────────────────────────────────────────
  essential_elements:
    - element: "construction_object_description"
      required: true
      legal_base: "ст. 743 ГК РФ, ст. 48 Градостроительного кодекса"
      description: "Полное описание объекта строительства: наименование, адрес, кадастровый номер участка, основные технико-экономические показатели"
      validation_rules:
        - "object_name_present"
        - "location_specified"
        - "technical_parameters_specified"
        - "cadastral_number_referenced"
      conditional_checks:
        - trigger: "capital_construction"
          keywords: ["объект капитального строительства", "здание", "сооружение"]
          rule: "technical_indicators_mandatory"
          legal_base: "ст. 743 ГК РФ"
          severity: "critical"
          risk_msg: "Без четкого описания объекта договор может быть признан незаключенным"

    - element: "design_documentation_integration"
      required: true
      legal_base: "ст. 743 ГК РФ"
      description: "Проектная и рабочая документация должны быть приложением к договору или ссылка на них с указанием реквизитов утверждения"
      validation_rules:
        - "design_docs_referenced"
        - "docs_approval_data"
        - "expertise_approval_mentioned"
      conditional_checks:
        - trigger: "requires_construction_permit"
          keywords: ["разрешение на строительство", "экспертиза проектной документации"]
          rule: "approved_design_docs_required"
          legal_base: "ст. 49, 51 Градостроительного кодекса"
          severity: "critical"
          risk_msg: "Без утвержденной проектной документации невозможно получение разрешения на строительство и ввод в эксплуатацию"

    - element: "contract_price_and_estimate"
      required: true
      legal_base: "ст. 746 ГК РФ"
      description: "Цена должна быть определена в твердой сумме или через смету. Смета является неотъемлемой частью договора"
      validation_rules:
        - "price_or_estimate_present"
        - "estimate_attached_or_referenced"
      conditional_checks:
        - trigger: "estimate_present"
          keywords: ["смета", "стоимость работ", "калькуляция"]
          rule: "estimate_firmness_clarification"
          legal_base: "ст. 744 ГК РФ"
          severity: "high"
          validation_rules:
            - "firm_or_approximate_specified"
            - "change_procedure_defined"

    - element: "construction_timeline"
      required: true
      legal_base: "ст. 740, 742 ГК РФ"
      description: "Сроки начала и окончания работ, а также ключевые вехи (календарный план, график)"
      validation_rules:
        - "start_date_present"
        - "end_date_present"
        - "milestone_schedule_referenced"
      conditional_checks:
        - trigger: "complex_project"
          keywords: ["этапы строительства", "пусковой комплекс", "очередь строительства"]
          rule: "detailed_schedule_required"
          legal_base: "ст. 708 ГК РФ"
          severity: "high"
          risk_msg: "Для сложных объектов необходим детальный календарный план с промежуточными сроками"

    - element: "customer_support_obligations"
      required: true
      legal_base: "ст. 747 ГК РФ"
      description: "Заказчик обязан обеспечить условия для работ: предоставить участок, разрешения, финансирование, материалы (если предусмотрено)"
      validation_rules:
        - "site_provision_specified"
        - "permits_responsibility_defined"
        - "financing_schedule_defined"
      conditional_checks:
        - trigger: "land_plot_required"
          keywords: ["земельный участок", "стройплощадка", "территория строительства"]
          rule: "land_rights_confirmation_required"
          legal_base: "ст. 747 ГК РФ"
          severity: "critical"
          risk_msg: "Отсутствие прав на земельный участок — основание для приостановки строительства"

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 3: ЗАЩИТНЫЕ УСЛОВИЯ (PROTECTIVE CLAUSES)
  # ──────────────────────────────────────────────────────────
  protective_clauses:
    
    # --- ЗАЩИТА ЗАКАЗЧИКА (CUSTOMER PROTECTION) ---
    buyer_protection:
      - clause_id: "technical_supervision_rights"
        name: "Права Заказчика на технический надзор и контроль"
        risk_if_missing: |
          Без закрепления прав на контроль Заказчик не сможет своевременно выявлять отклонения от проекта,
          нарушения технологии, использование некачественных материалов. Это приводит к принятию объекта
          со скрытыми недостатками и сложностям в доказывании нарушений.
        legal_base: "ст. 748 ГК РФ"
        severity: "high"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "право осуществлять контроль и надзор"
            - "технический надзор Заказчика"
            - "доступ на строительную площадку"
            - "проверка соответствия проекту"
            - "отбор проб и образцов"
            - "ведение журнала строительного контроля"
            - "представитель Заказчика на объекте"
          context_patterns:
            - '(?i)заказчик.*вправе.*осуществлять.*контроль.*и.*надзор.*за.*ходом.*и.*качеством.*работ'
            - '(?i)технический.*надзор.*осуществляется.*представителем.*заказчика.*на.*объекте'
      
      - clause_id: "unilateral_acceptance_construction"
        name: "Механизм односторонней сдачи-приемки (подписание актов КС-2, КС-3)"
        risk_if_missing: |
          Подрядчик может задерживать сдачу этапов, а Заказчик — уклоняться от подписания актов для отсрочки оплаты.
          Отсутствие процедуры одностороннего подписания приводит к "зависанию" объектов и судебным спорам
          о фактическом выполнении работ.
        legal_base: "ст. 753, 720 ГК РФ"
        severity: "high"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "одностороннее подписание акта"
            - "акт считается подписанным"
            - "при уклонении от приемки"
            - "срок для подписания акта КС-2"
            - "мотивированный отказ"
          context_patterns:
            - '(?i)если.*сторона.*уклоняется.*от.*подписания.*акта.*другая.*сторона.*вправе.*подписать.*его.*односторонне'
            - '(?i)акт.*КС-2.*считается.*подписанным.*при.*отсутствии.*мотивированного.*возражения.*в.*течение.*[0-9]+.*дней'
      
      - clause_id: "warranty_period_defects_liability"
        name: "Гарантийные сроки и ответственность за скрытые недостатки"
        risk_if_missing: |
          Без четких гарантийных обязательств применяются общие сроки (5 лет на объект, 2 года на сети).
          Однако порядок предъявления претензий, сроки устранения, последствия неисполнения остаются неясными.
          Заказчик рискует остаться с дефектным объектом без реальных механизмов воздействия.
        legal_base: "ст. 724, 725, 756, 757 ГК РФ"
        severity: "critical"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "гарантийный срок на объект"
            - "ответственность за скрытые недостатки"
            - "устранение недостатков за счет подрядчика"
            - "гарантия 5 лет на объект в целом"
            - "гарантия 2 года на инженерные сети"
            - "возмещение расходов на устранение"
            - "право на удержание гарантийной суммы"
          context_patterns:
            - '(?i)гарантийный.*срок.*на.*объект.*в.*целом.*составляет.*5.*лет.*со.*дня.*ввода.*в.*эксплуатацию'
            - '(?i)обнаруженные.*в.*течение.*гарантийного.*срока.*недостатки.*подлежат.*безвозмездному.*устранению'
      
      - clause_id: "price_firmness_change_orders"
        name: "Твердость цены и порядок оформления дополнительных работ"
        risk_if_missing: |
          В строительстве неизбежны изменения. Без процедуры оформления дополнительных работ (Дополнительных
          Соглашений, Изменений) Заказчик рискует столкнуться с требованиями оплаты незапланированных работ.
          Подрядчик может выполнять "неучтенку" без согласования, а затем требовать оплаты.
        legal_base: "ст. 743, 744 ГК РФ"
        severity: "high"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "твердая цена"
            - "дополнительные работы по согласованию"
            - "изменение проектной документации"
            - "дополнительное соглашение на изменения"
            - "лимит на дополнительные расходы"
            - "предварительное письменное одобрение"
          context_patterns:
            - '(?i)цена.*является.*твердой.*и.*изменяется.*только.*по.*дополнительному.*соглашению'
            - '(?i)выполнение.*работ.*не.*предусмотренных.*проектом.*требует.*письменного.*согласия.*заказчика'
      
      - clause_id: "liquidated_damages_delay"
        name: "Неустойка за просрочку сдачи объекта (пени, штрафы)"
        risk_if_missing: |
          Срыв сроков в строительстве влечет каскадные убытки (утрата коммерческой выгоды, рост стоимости
          кредита, штрафы перед конечными покупателями). Без адекватной неустойки взыскание убытков
          крайне затруднительно из-за сложности доказывания и расчета.
        legal_base: "ст. 330, 393 ГК РФ"
        severity: "high"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "неустойка за просрочку"
            - "пеня за каждый день задержки"
            - "штрафные санкции"
            - "процент от цены договора"
            - "ответственность за нарушение сроков"
            - "возмещение убытков"
          context_patterns:
            - '(?i)за.*нарушение.*сроков.*сдачи.*объекта.*подрядчик.*уплачивает.*неустойку.*в.*размере.*[0-9]+%.*от.*цены.*договора'
            - '(?i)пеня.*начисляется.*за.*каждый.*день.*просрочки.*вплоть.*до.*фактической.*сдачи'
    
    # --- ЗАЩИТА ПОДРЯДЧИКА (CONTRACTOR PROTECTION) ---
    seller_protection:
      - clause_id: "customer_obligations_risk_transfer"
        name: "Последствия неисполнения Заказчиком обязанностей (просрочка обеспечения)"
        risk_if_missing: |
          Срыв сроков Заказчиком (не предоставил участок, разрешения, не оплатил этап) перекладывает
          риски на Подрядчика. Без условия о продлении сроков и компенсации дополнительных расходов
          Подрядчик несет убытки из-за простоя, роста цен на материалы, штрафов перед субподрядчиками.
        legal_base: "ст. 328, 719 ГК РФ"
        severity: "critical"
        affected_party: "seller"
        detection:
          positive_keywords:
            - "продление срока при нарушении заказчиком"
            - "возмещение дополнительных расходов"
            - "право приостановить работы"
            - "простой по вине заказчика"
            - "компенсация убытков из-за задержки"
          context_patterns:
            - '(?i)при.*нарушении.*заказчиком.*обязанности.*по.*предоставлению.*участка.*срок.*исполнения.*продлевается'
            - '(?i)подрядчик.*вправе.*приостановить.*работы.*при.*неоплате.*выполненного.*этапа'
      
      - clause_id: "advance_payment_interim_payments"
        name: "Авансирование и поэтапная оплата (против счета и актов КС-2, КС-3)"
        risk_if_missing: |
          Строительство требует значительных предварительных затрат на материалы, оборудование, мобилизацию.
          Без аванса и четкого графика платежей Подрядчик вынужден кредитовать проект за свой счет,
          что увеличивает финансовые риски и стоимость работ.
        legal_base: "ст. 711, 746 ГК РФ"
        severity: "high"
        affected_party: "seller"
        detection:
          positive_keywords:
            - "авансовый платеж"
            - "поэтапная оплата"
            - "график платежей"
            - "оплата по актам КС-2"
            - "счет на оплату"
            - "отсрочка платежа"
          context_patterns:
            - '(?i)заказчик.*уплачивает.*аванс.*в.*размере.*[0-9]+%.*от.*цены.*договора.*в.*течение.*[0-9]+.*дней'
            - '(?i)оплата.*производится.*ежемесячно.*на.*основании.*подписанных.*актов.*КС-2.*и.*счетов'
      
      - clause_id: "hidden_work_inspection_certification"
        name: "Обязательность освидетельствования скрытых работ и актов"
        risk_if_missing: |
          Скрытые работы (фундамент, армирование, скрытые сети) после закрытия последующими слоями
          невозможно проверить. Без подписанных актов освидетельствования Заказчик может оспорить
          их качество на любом этапе, требуя вскрытия. Это приводит к конфликтам и судебным экспертизам.
        legal_base: "ст. 753 ГК РФ, строительные нормы"
        severity: "high"
        affected_party: "seller"
        detection:
          positive_keywords:
            - "акт освидетельствования скрытых работ"
            - "обязанность присутствия на приемке"
            - "скрытые работы принимаются до закрытия"
            - "журнал производства работ"
            - "отказ от подписания акта скрытых работ"
          context_patterns:
            - '(?i)скрытые.*работы.*подлежат.*освидетельствованию.*и.*оформлению.*актом.*до.*начала.*последующих.*работ'
            - '(?i)при.*отсутствии.*представителя.*заказчика.*в.*течение.*[0-9]+.*дней.*акт.*может.*быть.*подписан.*односторонне'
      
      - clause_id: "subcontracting_right_responsibility"
        name: "Право привлекать субподрядчиков и ограничение ответственности"
        risk_if_missing: |
          Строительство комплексно, требует разных специалистов. Без права привлекать субподрядчиков
          Генподрядчик ограничен своими ресурсами. Однако важно разграничить ответственность:
          Генподрядчик отвечает перед Заказчиком, но должен иметь регресс к субподрядчику.
        legal_base: "ст. 706 ГК РФ"
        severity: "medium"
        affected_party: "seller"
        detection:
          positive_keywords:
            - "право привлекать субподрядчиков"
            - "генподрядчик отвечает перед заказчиком"
            - "согласование субподрядчиков"
            - "регрессные требования к субподрядчику"
            - "ответственность за выбор субподрядчика"
          context_patterns:
            - '(?i)подрядчик.*вправе.*привлекать.*для.*выполнения.*работ.*субподрядчиков.*оставаясь.*ответственным.*перед.*заказчиком'
            - '(?i)заказчик.*вправе.*отклонить.*кандидатуру.*субподрядчика.*при.*наличии.*разумных.*оснований'

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 4: ДОПОЛНИТЕЛЬНЫЕ PROTECTIVE CLAUSES (СТРОИТЕЛЬНАЯ СПЕЦИФИКА)
  # ──────────────────────────────────────────────────────────
  additional_protective_clauses:
    
    buyer_seller_protection:
      - clause_id: "force_majeure_long_term_impact"
        name: "Форс-мажор в строительстве и его последствия (продление сроков)"
        risk_if_missing: |
          Строительство длится годами, риски форс-мажора высоки (погода, изменения законодательства,
          санкции, цепочки поставок). Без детального регулирования стороны спорят, является ли событие
          форс-мажором, как продлевать сроки, кто несет дополнительные расходы.
        legal_base: "ст. 401, 416, 417 ГК РФ"
        severity: "high"
        affected_party: "both"
        detection:
          positive_keywords:
            - "обстоятельства непреодолимой силы"
            - "форс-мажор"
            - "продление сроков пропорционально времени действия"
            - "уведомление о наступлении форс-мажора"
            - "справка ТПП"
            - "погодные условия, препятствующие работам"
          context_patterns:
            - '(?i)при.*наступлении.*обстоятельств.*непреодолимой.*силы.*срок.*исполнения.*продлевается.*пропорционально.*времени.*действия'
            - '(?i)сторона.*обязана.*уведомить.*о.*форс-мажоре.*в.*течение.*[0-9]+.*дней.*с.*момента.*наступления'
      
      - clause_id: "insurance_construction_risks"
        name: "Страхование строительных рисков (ГО, имущества, ответственности)"
        risk_if_missing: |
          Строительство связано с рисками гибели объекта, повреждения соседних строений, несчастных случаев.
          Без страхования убытки могут быть катастрофическими для обеих сторон. Обязательное страхование
          гражданской ответственности застройщика/подрядчика предусмотрено законом (214-ФЗ, если применимо).
        legal_base: "Глава 48 ГК РФ, 214-ФЗ, 401-ФЗ"
        severity: "critical"
        affected_party: "both"
        detection:
          positive_keywords:
            - "страхование строительных рисков"
            - "страхование гражданской ответственности"
            - "страхование объекта строительства"
            - "полис страхования"
            - "страхование от несчастных случаев"
            - "застраховано на сумму"
          context_patterns:
            - '(?i)подрядчик.*обязан.*застраховать.*риск.*своей.*гражданской.*ответственности.*перед.*третьими.*лицами'
            - '(?i)объект.*строительства.*подлежит.*страхованию.*на.*случай.*гибели.*или.*повреждения'
        conditional_checks:
          - trigger: "construction_activity"
            keywords: ["строительство", "генподрядчик", "объект капитального строительства"]
            rule: "insurance_clause_required"
            severity: "critical"
      
      - clause_id: "dispute_resolution_technical_expertise"
        name: "Досудебный порядок урегулирования и строительно-техническая экспертиза"
        risk_if_missing: |
          Строительные споры технически сложны и дороги. Без обязательного досудебного порядка (претензии,
          совместные обследования) стороны сразу идут в суд, неся высокие издержки. Порядок назначения
          и оплаты экспертизы должен быть определен заранее.
        legal_base: "АПК РФ, ГПК РФ"
        severity: "medium"
        affected_party: "both"
        detection:
          positive_keywords:
            - "досудебный порядок урегулирования споров"
            - "претензионный порядок"
            - "строительно-техническая экспертиза"
            - "совместное обследование"
            - "экспертная организация по согласованию"
            - "распределение расходов на экспертизу"
          context_patterns:
            - '(?i)все.*споры.*разрешаются.*в.*претензионном.*порядке.*путем.*направления.*письменной.*претензии'
            - '(?i)для.*разрешения.*технических.*вопросов.*стороны.*назначают.*независимую.*экспертизу'