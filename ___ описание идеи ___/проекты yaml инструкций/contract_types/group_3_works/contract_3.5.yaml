type: contract_3.5
name: "Договор на выполнение научно-исследовательских, опытно-конструкторских и технологических работ (НИОКР)"
description: |
  Регулирует отношения по проведению научных исследований (НИР), направленных на получение новых знаний,
  и опытно-конструкторских работ (ОКР), направленных на создание новых изделий, технологий или материалов.
  Ключевое отличие от подряда: принципиальная невозможность гарантировать успех. Заказчик финансирует поисковый процесс
  и, по умолчанию, несет риск недостижения запланированного результата (ст. 769 ГК РФ). Результатом являются
  интеллектуальные активы (отчеты, ноу-хау, прототипы), права на которые требуют детального распределения.
version: 2.1
parent: class_3_work_performance
sibling_contracts:
  - contract_3.4 # ПИР (результат документации гарантирован нормами)
  - contract_3.1 # Подряд (гарантированный материальный результат)
metadata:
  category: contract
  subcategory: work_performance
  complexity: very_high # Патентное право, конфиденциальность, риск неудачи
  risk_level: very_high # Риск отрицательного результата при полной затрате средств
  legal_base: Глава 38 ГК РФ (ст. 769-778)
  hierarchy_position: "child_specialized_high_risk"

# ════════════════════════════════════════════════════════════
# КВАЛИФИКАЦИЯ И ПРИЗНАКИ (ОПТИМИЗИРОВАНО)
# ════════════════════════════════════════════════════════════
rules:
  keywords:
    high:
      - "НИОКР"
      - "научно-исследовательские работы НИР"
      - "опытно-конструкторские работы ОКР"
      - "риск недостижения результата"
      - "техническое задание на НИОКР"
      - "патентная чистота"
    medium:
      - "технологические работы"
      - "создание образца прототипа"
      - "научный отчет"
      - "экспериментальные работы"
      - "ноу-хау секрет производства"
      - "конфиденциальность сведений"
    low:
      - "роялти"
      - "стендовые испытания"
      - "предварительные результаты"
      - "фонд фундаментальных исследований"
  phrases:
    high:
      - Исполнитель обязуется провести научные исследования / разработки по заданию Заказчика
      - Риск случайной невозможности исполнения договора несет Заказчик (ст. 769 ГК РФ)
      - Права на результаты интеллектуальной деятельности подлежат распределению
      - Отрицательный результат также является результатом работ
    medium:
      - Заказчик финансирует работы поэтапно на основании представляемых отчетов
      - Стороны обязуются сохранять конфиденциальность информации, полученной в ходе работ
      - Результат не должен нарушать исключительные права третьих лиц
  patterns:
    required:
      - (?i)(НИОКР|научно.*исследовательск.*работ|опытно.*конструкторск.*работ|риск.*недостижения.*результата)
    optional:
      - (?i)(техническ.*задани.*на.*НИОКР|патентн.*чистота|ноу.*хау|отчет.*о.*НИОКР)
  exclusions:
    - серийное производство или изготовление по готовой документации (поставка/подряд)
    - стандартное проектирование (ПИР) с гарантированным результатом
    - консультационные услуги без исследовательской составляющей
    - рутинные испытания или измерения
  exclusion_logic:
    - condition: "guaranteed_result OR routine_work_without_research"
      target: "rejection"
      confidence: 0.90
      description: "Если результат гарантирован технически или работа не содержит элемента научного поиска/неизвестности"
  weights:
    keyword_high: 4.0
    keyword_medium: 2.0
    keyword_low: 0.8
    phrase_high: 4.0
    phrase_medium: 1.5
    pattern_required: 5.0
    pattern_optional: 1.2
  classification:
    min_confidence: 0.88  # Высокий порог, чтобы не спутать с проектированием или подрядом
    max_matches: 3

party_roles:
  - Заказчик (Sponsor) — инвестор, финансирующая сторона, несущая основной риск
  - Исполнитель (Developer/Researcher) — научная организация, КБ, ВУЗ, разработчик
  - Соисполнители (по согласованию с Заказчиком)

essential_terms:
  - Предмет: четкое указание вида работ (НИР, ОКР или комплекс), научно-техническая проблема, цель
  - Техническое задание (ТЗ) — программа исследований/разработок, методы, ожидаемые результаты
  - Сроки выполнения работ (общие и поэтапные)
  - Цена (смета) и порядок финансирования (с учетом неопределенности)

specific_risks:
  - Отрицательный или бесполезный результат при полной затрате финансирования
  - Утечка конфиденциальной информации до подачи заявки на патент (потеря новизны)
  - Нарушение патентных прав третьих лиц ("патентный троллинг") при коммерциализации
  - Нечеткое распределение прав на РИД, блокирующее использование или доработку результатов
  - Риск дублирования исследований (трата средств на уже известное)
  - Финансовые риски для Исполнителя при условии "оплата только по успешному результату", противоречащем ст. 775 ГК РФ

aliases:
  - Договор НИОКР
  - R&D Contract (Research and Development)
  - Договор на выполнение НИР и ОКР
  - Договор на научно-техническую разработку
  - Соглашение о технологическом партнерстве

section_markers:
  - Предмет договора (вид работ: НИР, ОКР, технологические)
  - Техническое задание (неотъемлемое приложение)
  - Сроки выполнения работ (календарный план, этапы)
  - Стоимость работ и порядок финансирования (смета, график платежей)
  - Права и обязанности сторон
  - Порядок сдачи-приемки результатов работ (отчеты, прототипы, акты)
  - Конфиденциальность
  - Распределение прав на результаты интеллектуальной деятельности (РИД)
  - Распределение рисков (в т.ч. риска недостижения результата)
  - Ответственность сторон
  - Порядок разрешения споров
  - Заключительные положения

notes: |
  КРИТИЧЕСКИЕ ОТЛИЧИЯ И ПРАВИЛА:
  1. Различие НИР и ОКР: В НИР риск недостижения цели всегда на Заказчике, и при невозможности достижения результата он оплачивает стоимость фактически выполненных работ (ст. 775 ГК РФ). В ОКР риск может быть распределен иначе.
  2. Личное исполнение: Для НИР установлена презумпция личного исполнения Исполнителем (ст. 770 ГК РФ). Привлечение соисполнителей требует согласия Заказчика.
  3. Права на РИД: По умолчанию исключительные права принадлежат Исполнителю (ст. 772 ГК РФ). Для перехода к Заказчику требуется прямое условие в договоре.
  4. Патентная чистота: Исполнитель обязан провести проверку и гарантировать, что результат не нарушает права третьих лиц (ст. 773 ГК РФ).

# ════════════════════════════════════════════════════════════
# 🆕 ВАЛИДАЦИОННЫЕ СЕКЦИИ (VALIDATION ENGINE v2.0 - ГИБРИД)
# ════════════════════════════════════════════════════════════

validation_metadata:
  validation_version: "2.0"
  last_updated: "2026-02-07"
  author: "Legal AI Team"

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 1: ПРИМЕНИМОЕ ЗАКОНОДАТЕЛЬСТВО (ОБЪЕДИНЕНО)
  # ──────────────────────────────────────────────────────────
  legal_base:
    primary:
      - "Глава 38 ГК РФ (ст. 769-778)"
    secondary:
      - "Часть IV ГК РФ (ст. 1225, 1350, 1354, 1465 — интеллектуальная собственность, патенты, ноу-хау)"
      - "Федеральный закон от 23.08.1996 № 127-ФЗ 'О науке и государственной научно-технической политике'"
      - "ГОСТ 15.101-98 'Система разработки и постановки продукции на производство. Порядок выполнения НИР'"
    related:
      - "Налоговый кодекс РФ ст. 262 (учет расходов на НИОКР для налога на прибыль)"
      - "Федеральный закон от 05.04.2013 № 44-ФЗ (особенности госзаказа на НИОКР)"

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 2: ОБЯЗАТЕЛЬНЫЕ ЭЛЕМЕНТЫ (ESSENTIAL ELEMENTS - ГИБРИД)
  # ──────────────────────────────────────────────────────────
  essential_elements:
    - element: "technical_assignment_research_program"
      name: "Техническое задание (программа, план научных работ)"
      required: true
      legal_base: "ст. 773 ГК РФ"
      description: "Детальное описание целей, задач, направлений поиска, методов исследований, ожидаемых результатов (включая возможность отрицательного). Является неотъемлемой частью договора."
      risk_msg: "Без детального ТЗ невозможно оценить, выполнена ли работа и соответствует ли результат ожиданиям. Споры о качестве и объеме неизбежны."
      validation_rules:
        - "technical_specification_referenced"
        - "research_goals_and_methods_specified"
        - "expected_results_listed"

    - element: "risk_allocation_failure_explicit"
      name: "Явное распределение риска недостижения положительного результата"
      required: true
      legal_base: "ст. 769 ГК РФ"
      description: "Должно быть прямо указано, что риск случайной невозможности исполнения договора (в т.ч. недостижения запланированных результатов) несет Заказчик, если иное не предусмотрено."
      validation_rules:
        - "risk_of_failure_specified"
        - "risk_bearer_clearly_identified"
      conditional_checks:
        - trigger: "nir_keywords"
          keywords: ["научно-исследовательские", "НИР", "фундаментальные исследования"]
          rule: "customer_bears_risk_mandatory"
          legal_base: "ст. 769, 775 ГК РФ"
          severity: "critical"
          risk_msg: "Для НИР риск недостижения результата по умолчанию несет Заказчик. Исключение этого правила договором может быть оспорено."

    - element: "performance_deadlines_stages"
      required: true
      legal_base: "ст. 708, 773 ГК РФ"
      description: "Сроки выполнения работ (начало, окончание) и этапы (предварительные исследования, эксперименты, отчетность). Должны быть реалистичными с учетом неопределенности."
      validation_rules:
        - "start_date_present"
        - "end_date_present"
        - "milestone_schedule_referenced"

    - element: "cost_estimate_and_payment_terms"
      name: "Стоимость (смета) и порядок финансирования"
      required: true
      legal_base: "ст. 709, 774 ГК РФ"
      description: "Цена работ (твердая или приблизительная) и график платежей, учитывающий поэтапный характер работ и риск недостижения результата."
      validation_rules:
        - "price_or_calculation_method_present"
        - "payment_schedule_defined"
      conditional_checks:
        - trigger: "customer_bears_risk"
          keywords: ["риск несет заказчик", "ст. 769 ГК РФ"]
          rule: "payment_not_contingent_on_success"
          legal_base: "ст. 775 ГК РФ"
          severity: "critical"
          validation_rules:
            - "advance_or_stage_payment_provided"
            - "no_success_based_payment_clause"

    - element: "ip_rights_allocation_principles"
      name: "Принципы распределения прав на РИД"
      required: true
      legal_base: "ст. 772 ГК РФ"
      description: "Четкое определение, кому принадлежат исключительные права на создаваемые результаты (по умолчанию — Исполнителю), порядок их оформления и использования."
      validation_rules:
        - "ip_ownership_principles_specified"
        - "background_ip_addressed"

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 3: ЗАЩИТНЫЕ УСЛОВИЯ (PROTECTIVE CLAUSES - ОБЪЕДИНЕНО)
  # ──────────────────────────────────────────────────────────
  protective_clauses:
    
    # --- ЗАЩИТА ЗАКАЗЧИКА (CUSTOMER PROTECTION) ---
    buyer_protection:
      - clause_id: "exclusive_ip_rights_transfer"
        name: "Переход исключительных прав на РИД к Заказчику"
        risk_if_missing: |
          По умолчанию исключительные права на РИД, созданные по договору, принадлежат Исполнителю (ст. 772 ГК РФ).
          Без прямого условия о переходе Заказчик, финансирующий работы, может остаться лишь с правом использования
          на условиях лицензии, что не позволит ему полноценно коммерциализировать разработку, запрещать использование
          конкурентам или свободно дорабатывать результат.
        legal_base: "ст. 772, 1296, 1371 ГК РФ"
        severity: "critical"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "исключительные права переходят к Заказчику"
            - "отчуждение исключительного права в полном объеме"
            - "патент выдается на имя Заказчика"
            - "право Заказчика на подачу заявки на патент"
          negative_keywords:
            - "права остаются у Исполнителя"
            - "лицензия простого (неисключительного) пользования"
          context_patterns:
            - '(?i)исключительные.*права.*на.*результаты.*интеллектуальной.*деятельности.*созданные.*по.*договору.*принадлежат.*заказчику'
      
      - clause_id: "patent_purity_warranty"
        name: "Гарантия патентной чистоты и отсутствия нарушений прав третьих лиц"
        risk_if_missing: |
          Исполнитель может (непреднамеренно) использовать в разработке запатентованные решения третьих лиц.
          При коммерциализации результата Заказчик столкнется с исками о нарушении прав ("патентный троллинг"),
          что приведет к запрету производства, изъятию продукции и огромным убыткам.
        legal_base: "ст. 773 ГК РФ"
        severity: "high"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "гарантирует патентную чистоту"
            - "результат не нарушает права третьих лиц"
            - "проведение патентных исследований"
            - "отсутствие известных патентных ограничений"
            - "ответственность за нарушение гарантии"
          context_patterns:
            - '(?i)исполнитель.*гарантирует.*что.*результаты.*работ.*не.*нарушают.*исключительные.*права.*третьих.*лиц'
      
      - clause_id: "stagewise_funding_and_approval_right"
        name: "Поэтапное финансирование и право на отказ от дальнейшего финансирования"
        risk_if_missing: |
          Без поэтапного финансирования Заказчик перечисляет всю сумму авансом, теряя контроль.
          Если промежуточные результаты показывают бесперспективность направления, Заказчик должен иметь право
          прекратить финансирование, минимизировав потери, без признания себя нарушившим договор.
        legal_base: "ст. 310, 450.1, 775 ГК РФ"
        severity: "critical"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "поэтапное финансирование"
            - "оплата по результатам этапа"
            - "право приостановить или прекратить финансирование"
            - "отчетность перед очередным платежом"
            - "отказ от финансирования следующего этапа"
          context_patterns:
            - '(?i)заказчик.*вправе.*приостановить.*финансирование.*следующего.*этапа.*при.*неудовлетворительных.*результатах.*предыдущего'
      
      - clause_id: "confidentiality_strong_nda_pre_patent"
        name: "Строгие обязательства по конфиденциальности до подачи заявки на патент"
        risk_if_missing: |
          Публичное раскрытие сущности разработки до подачи заявки на патент уничтожает новизну (ст. 1350 ГК РФ),
          делая невозможным получение патента. Утечка ноу-хау к конкурентам лишает результат коммерческой тайны.
        legal_base: "ст. 771, 1350, 1465 ГК РФ"
        severity: "critical"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "конфиденциальность до подачи заявки"
            - "режим коммерческой тайны (ноу-хау)"
            - "запрет на публикации без согласия"
            - "санкции за разглашение"
            - "круг лиц с доступом"
          context_patterns:
            - '(?i)стороны.*обязуются.*не.*разглашать.*сведения.*о.*результатах.*работ.*до.*подачи.*заявки.*на.*промышленный.*образец.*или.*изобретение'
    
    # --- ЗАЩИТА ИСПОЛНИТЕЛЯ (CONTRACTOR PROTECTION) ---
    seller_protection:
      - clause_id: "payment_for_negative_result"
        name: "Оплата работ при недостижении положительного результата (для НИР)"
        risk_if_missing: |
          Для НИР риск недостижения цели лежит на Заказчике (ст. 769 ГК РФ). Если результат не достигнут не по вине Исполнителя,
          работы должны быть оплачены (ст. 775). Условие "оплата только за успешный результат" или "оплата по факту работающего образца"
          для НИР является незаконным и может быть признано недействительным.
        legal_base: "ст. 769, 775 ГК РФ"
        severity: "critical"
        affected_party: "seller"
        detection:
          positive_keywords:
            - "оплата фактически выполненных работ"
            - "оплата независимо от достижения положительного результата"
            - "риск недостижения результата несет заказчик"
            - "отрицательный результат является результатом работ"
          context_patterns:
            - '(?i)в.*случае.*недостижения.*положительного.*результата.*не.*по.*вине.*исполнителя.*заказчик.*оплачивает.*стоимость.*фактически.*выполненных.*работ'
      
      - clause_id: "limitation_of_liability_consequential_loss"
        name: "Ограничение ответственности прямыми убытками"
        risk_if_missing: |
          Затраты на НИОКР значительны, но потенциальные убытки Заказчика от неполучения коммерческого продукта (упущенная выгода)
          могут быть колоссальными. Без ограничения ответственности Исполнитель может быть привлечен к непосильной финансовой
          ответственности за риски, которые по закону должен нести Заказчик.
        legal_base: "ст. 15, 393, 401 ГК РФ"
        severity: "critical"
        affected_party: "seller"
        detection:
          positive_keywords:
            - "ответственность ограничена суммой договора"
            - "не возмещаются косвенные убытки"
            - "не возмещается упущенная выгода"
            - "ответственность только за прямой реальный ущерб"
          context_patterns:
            - '(?i)исполнитель.*не.*несет.*ответственности.*за.*косвенные.*убытки.*и.*упущенную.*выгоду.*заказчика'
      
      - clause_id: "personal_performance_nir_exception"
        name: "Условие о личном исполнении НИР и порядке привлечения соисполнителей"
        risk_if_missing: |
          Для НИР установлена презумпция личного исполнения Исполнителем (ст. 770 ГК РФ). Без условия, разрешающего привлечение
          соисполнителей (особенно для узкоспециализированных задач), Исполнитель несет неоправданный риск или нарушает закон,
          привлекая третьих лиц. Необходимо согласие Заказчика.
        legal_base: "ст. 770 ГК РФ"
        severity: "high"
        affected_party: "seller"
        detection:
          positive_keywords:
            - "привлечение соисполнителей с согласия заказчика"
            - "право привлекать третьих лиц для отдельных задач"
            - "личное исполнение обязательно для НИР"
          context_patterns:
            - '(?i)исполнитель.*вправе.*привлекать.*третьих.*лиц.*для.*выполнения.*отдельных.*задач.*только.*с.*письменного.*согласия.*заказчика'
        conditional_checks:
          - trigger: "nir_keywords"
            keywords: ["научно-исследовательские", "НИР"]
            rule: "personal_performance_clause_recommended"
            legal_base: "ст. 770 ГК РФ"
            severity: "high"
      
      - clause_id: "retention_of_background_ip_rights"
        name: "Сохранение прав на фоновые РИД и право на использование для дальнейших исследований"
        risk_if_missing: |
          Исполнитель использует в работе ранее созданные им знания, методики, ноу-хау (фоновые РИД). Они не должны переходить Заказчику.
          Также Исполнитель должен иметь право использовать полученные новые знания (не передавая их третьим лицам) для своих будущих некоммерческих исследований.
        legal_base: "ст. 772 ГК РФ"
        severity: "high"
        affected_party: "seller"
        detection:
          positive_keywords:
            - "права на фоновые РИД сохраняются за исполнителем"
            - "исполнитель вправе использовать полученные результаты для дальнейших научных исследований"
            - "не подлежат передаче ранее созданные ноу-хау"
          context_patterns:
            - '(?i)исполнитель.*сохраняет.*права.*на.*фоновую.*интеллектуальную.*собственность.*использованную.*при.*выполнении.*работ'

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 4: ДОПОЛНИТЕЛЬНЫЕ PROTECTIVE CLAUSES (ГИБРИД)
  # ──────────────────────────────────────────────────────────
  additional_protective_clauses:
    
    buyer_seller_protection:
      - clause_id: "publication_rights_and_patent_filing_procedure"
        name: "Порядок публикаций и подачи заявок на патент"
        risk_if_missing: |
          Научные сотрудники стремятся публиковать статьи. Публикация до подачи заявки на патент губит новизну.
          Необходим баланс: право Исполнителя на публикацию после одобрения Заказчиком или по истечении срока для патентования.
          Также нужно определить, кто подает заявку и несет расходы.
        legal_base: "ст. 1350, 1354, 1371 ГК РФ"
        severity: "high"
        affected_party: "both"
        detection:
          positive_keywords:
            - "публикации согласовываются с заказчиком"
            - "срок для подачи заявки на патент до публикации"
            - "право на анонимное рецензирование"
            - "затраты на патентование"
            - "порядок определения патентоспособности"
          context_patterns:
            - '(?i)исполнитель.*вправе.*публиковать.*результаты.*только.*с.*письменного.*согласия.*заказчика.*или.*по.*истечении.*[0-9]+.*месяцев.*для.*подачи.*заявки'
      
      - clause_id: "side_results_ownership_and_reporting"
        name: "Права на побочные результаты и обязанность по их отчетности"
        risk_if_missing: |
          В ходе исследований могут быть случайно получены ценные результаты, не связанные напрямую с целью ТЗ.
          Без регулирования возникают споры об их принадлежности. Исполнитель может скрыть такие результаты.
          Заказчик может упустить выгоду.
        legal_base: "ст. 772 ГК РФ"
        severity: "medium"
        affected_party: "both"
        detection:
          positive_keywords:
            - "побочные (незапланированные) результаты"
            - "права на побочные РИД принадлежат исполнителю"
            - "обязанность уведомить о побочных результатах"
            - "преимущественное право заказчика на лицензию"
          context_patterns:
            - '(?i)права.*на.*побочные.*результаты.*не.*предусмотренные.*ТЗ.*принадлежат.*исполнителю.*но.*заказчик.*имеет.*преимущественное.*право.*на.*получение.*лицензии'
      
      - clause_id: "termination_for_convenience_and_settlement"
        name: "Право Заказчика на односторонний отказ и расчеты"
        risk_if_missing: |
          Заказчик может потерять интерес к теме, изменить стратегию. Право на отказ от договора с оплатой фактически
          выполненных работ и возмещением неотвратимых расходов — важный инструмент управления рисками для обеих сторон.
          Без этого условия отказ будет рассматриваться как нарушение с полным возмещением убытков Исполнителю.
        legal_base: "ст. 310, 450.1, 782 ГК РФ (аналогия)"
        severity: "high"
        affected_party: "both"
        detection:
          positive_keywords:
            - "право на односторонний отказ от договора"
            - "прекращение договора по инициативе заказчика"
            - "оплата фактически выполненных работ"
            - "возмещение документально подтвержденных расходов"
            - "уведомление за X месяцев"
          context_patterns:
            - '(?i)заказчик.*вправе.*в.*одностороннем.*порядке.*отказаться.*от.*договора.*уплатив.*исполнителю.*стоимость.*фактически.*выполненных.*работ.*и.*возместив.*понесенные.*расходы'