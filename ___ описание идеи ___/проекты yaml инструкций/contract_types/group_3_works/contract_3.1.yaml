type: contract_3.1
name: "Договор подряда (общий)"
description: |
  Базовая конструкция (locatio-conductio operis) для договоров, направленных на создание или изменение вещи 
  (материальный результат). Подрядчик действует своим иждивением, самостоятельно определяя способы выполнения.
  Заказчик оплачивает принятый результат. Ключевое отличие от услуг: результат овеществлен и передаваем
  (пошив костюма, ремонт станка, изготовление мебели). Регулируется § 1 Главы 37 ГК РФ.
version: 2.1
parent: class_3_work_performance
sibling_contracts:
  - contract_3.2 # Строительный подряд
  - contract_3.3 # Бытовой подряд
  - contract_3.4 # Возмездное оказание услуг (процесс)
metadata:
  category: contract
  subcategory: work_performance
  complexity: medium
  risk_level: medium-high
  legal_base: § 1 Главы 37 ГК РФ (ст. 702-729)
  hierarchy_position: "parent_general"

# ════════════════════════════════════════════════════════════
# КВАЛИФИКАЦИЯ И ПРИЗНАКИ (ОПТИМИЗИРОВАНО)
# ════════════════════════════════════════════════════════════
rules:
  keywords:
    high:
      - "подрядчик"
      - "заказчик"
      - "результат работ"
      - "сдача-приемка"
      - "техническое задание"
      - "акт выполненных работ"
    medium:
      - "выполнение работ"
      - "изготовление"
      - "переработка"
      - "обработка"
      - "ремонт"
      - "смета"
      - "гарантийный срок"
    low:
      - "иждивение подрядчика"
      - "давальческие материалы"
      - "этап работ"
      - "скрытые работы"
  phrases:
    high:
      - Подрядчик обязуется выполнить по заданию Заказчика определенную работу и сдать ее результат
      - Заказчик обязуется принять результат работы и оплатить его
      - Риск случайной гибели результата до приемки несет Подрядчик
      - Работы выполняются иждивением подрядчика (его силами и материалами)
    medium:
      - Качество работ должно соответствовать условиям договора
      - Заказчик вправе во всякое время проверять ход и качество работ
      - Цена работы может быть определена путем составления сметы
  patterns:
    required:
      - (?i)(подряд|подрядчик.*обязуется.*выполнить|результат.*работ.*сдать.*заказчику)
    optional:
      - (?i)(акт.*сдачи.*приемки|техническое.*задание|риск.*случайной.*гибели|смет.*стоимост)
  exclusions:
    - возмездное оказание услуг (консультации, обучение, охрана)
    - трудовой договор (подчинение правилам внутреннего распорядка)
    - договор на создание произведения (авторский заказ)
    - безвозмездное выполнение работ
  exclusion_logic:
    - condition: "personal_labor_subordination OR no_material_result"
      target: "rejection"
      confidence: 0.85
      description: "Если работы выполняются в рамках трудовых отношений или результат не имеет вещественной формы"
  weights:
    keyword_high: 3.0
    keyword_medium: 1.5
    keyword_low: 0.5
    phrase_high: 3.5
    phrase_medium: 1.0
    pattern_required: 5.0
    pattern_optional: 1.0
  classification:
    min_confidence: 0.78
    max_matches: 3

party_roles:
  - Подрядчик (Contractor) — исполнитель работ, несущий риск до приемки
  - Заказчик (Customer) — определяет задание, принимает и оплачивает результат

essential_terms:
  - Предмет договора: содержание работ + конкретный овеществленный результат
  - Сроки выполнения работ (начальный и конечный - существенные условия)
  - Цена работ или порядок ее определения (существенно для коммерческих организаций)

specific_risks:
  - Несоответствие результата ожиданиям заказчика из-за нечеткого ТЗ
  - Переквалификация в трудовой договор (при отношениях подчинения с физлицом-подрядчиком)
  - Необоснованный отказ заказчика от приемки и оплаты
  - Превышение сметы при отсутствии твердой цены
  - Риск гибели материалов и результата до приемки (на подрядчике)
  - Неуведомление о приостановке работ лишает права ссылаться на обстоятельства (ст. 716 ГК РФ)

aliases:
  - Договор на выполнение работ
  - Подряд
  - Ремонтный договор
  - Договор подряда на изготовление

section_markers:
  - Предмет договора (работы + результат, ТЗ/спецификация)
  - Срок выполнения работ
  - Цена работ и порядок расчетов (твердая/приблизительная смета)
  - Порядок сдачи и приемки работ (процедура, сроки, форма акта)
  - Качество работ и гарантийные обязательства
  - Материалы и оборудование (свои/давальческие)
  - Распределение рисков (случайной гибели/повреждения)
  - Ответственность сторон
  - Порядок изменения и расторжения договора
  - Разрешение споров

notes: |
  КРИТИЧЕСКИЕ ОТЛИЧИЯ И ПРАВИЛА:
  1. Овеществленный результат — ключевой признак, отличающий от услуг (ст. 779 ГК РФ)
  2. При работе с давальческими материалами риск их гибели несет заказчик (ст. 705 ГК РФ)
  3. Цена не является существенным условием для договоров между физлицами, но является таковой для коммерческих организаций
  4. Право заказчика на односторонний отказ (ст. 717 ГК РФ) не может быть полностью исключено договором
  5. Презумпция вины подрядчика в недостатках, выявленных в гарантийный срок (ст. 724 ГК РФ)

# ════════════════════════════════════════════════════════════
# 🆕 ВАЛИДАЦИОННЫЕ СЕКЦИИ (VALIDATION ENGINE v2.0 - ГИБРИД)
# ════════════════════════════════════════════════════════════

validation_metadata:
  validation_version: "2.0"
  last_updated: "2026-02-07"
  author: "Legal AI Team"

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 1: ПРИМЕНИМОЕ ЗАКОНОДАТЕЛЬСТВО (ОБЪЕДИНЕНО)
  # ──────────────────────────────────────────────────────────
  legal_base:
    primary:
      - "§ 1 Главы 37 ГК РФ (ст. 702-729)"
    secondary:
      - "ст. 432, 450, 451 ГК РФ (существенные условия, изменение и расторжение)"
      - "ст. 309, 310, 328 ГК РФ (общие принципы исполнения, встречное исполнение)"
      - "ст. 15, 393, 395 ГК РФ (убытки, ответственность, проценты)"
    related:
      - "Постановление Пленума ВАС РФ от 06.06.2014 № 35 (возмещение убытков)"
      - "Информационное письмо Президиума ВАС РФ № 51 (Обзор практики по подряду)"
      - "Закон РФ от 07.02.1992 № 2300-1 (если Заказчик — гражданин-потребитель)"
      - "Глава 39 ГК РФ (для разграничения с возмездным оказанием услуг)"

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 2: ОБЯЗАТЕЛЬНЫЕ ЭЛЕМЕНТЫ (ESSENTIAL ELEMENTS - ГИБРИД)
  # ──────────────────────────────────────────────────────────
  essential_elements:
    - element: "parties_identification"
      required: true
      legal_base: "ст. 432 ГК РФ"
      validation_rules:
        - "presence_check"
        - "legal_capacity_indicators"

    - element: "subject_work_and_result"
      name: "Предмет (Работа + Результат)"
      required: true
      legal_base: "ст. 702, 703, 432 ГК РФ"
      description: "Должны быть описаны как содержание работ, так и конкретный овеществленный результат"
      risk_msg: "Отсутствие четкого описания результата может привести к признанию договора незаключенным"
      validation_rules:
        - "presence_check"
        - "material_result_check"
        - "definiteness_check"
      conditional_checks:
        - trigger: "contractor_keywords"
          keywords: ["подрядчик", "исполнитель работ", "обязуется выполнить"]
          rule: "result_specification_required"
          legal_base: "ст. 703 ГК РФ"
          severity: "critical"
          validation_rules:
            - "result_description_specific"
            - "technical_task_referenced"

    - element: "performance_deadlines"
      name: "Сроки выполнения работ"
      required: true
      legal_base: "ст. 708, 432 ГК РФ"
      description: "Начальный и конечный сроки — существенные условия. Промежуточные сроки — если имеют значение"
      validation_rules:
        - "start_date_present"
        - "end_date_present"
        - "date_consistency_check"
      conditional_checks:
        - trigger: "commercial_parties"
          keywords: ["ООО", "АО", "ЗАО", "ИП", "коммерческая организация"]
          rule: "deadlines_mandatory_for_commercial"
          legal_base: "ст. 432, 708 ГК РФ"
          severity: "critical"
          risk_msg: "Для договоров между юрлицами/ИП отсутствие сроков ведет к незаключенности договора"

    - element: "price_or_estimation_method"
      name: "Цена (Смета) или способ ее определения"
      required: false
      legal_base: "ст. 709 ГК РФ"
      description: "Цена может быть твердой или приблизительной. Если не указано — считается твердой"
      validation_rules:
        - "price_or_method_present"
      conditional_checks:
        - trigger: "commercial_parties"
          keywords: ["ООО", "АО", "ЗАО", "ИП", "коммерческая организация"]
          rule: "price_mandatory_for_commercial"
          legal_base: "ст. 432, 709 ГК РФ"
          severity: "critical"
          risk_msg: "Для коммерческих организаций отсутствие цены или способа ее определения влечет незаключенность договора"

    - element: "acceptance_procedure"
      required: true
      legal_base: "ст. 720 ГК РФ"
      description: "Порядок сдачи результата и приемки заказчиком — ключевой для перехода рисков и оплаты"
      validation_rules:
        - "acceptance_procedure_specified"
        - "acceptance_deadlines_specified"

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 3: ЗАЩИТНЫЕ УСЛОВИЯ (PROTECTIVE CLAUSES - ОБЪЕДИНЕНО)
  # ──────────────────────────────────────────────────────────
  protective_clauses:
    
    # --- ЗАЩИТА ПОДРЯДЧИКА (CONTRACTOR PROTECTION) ---
    seller_protection:
      - clause_id: "suspension_and_notification_right"
        name: "Право на приостановку и обязанность уведомления (ст. 716, 719 ГК РФ)"
        risk_if_missing: |
          При неисполнении заказчиком встречных обязанностей (не предоставил материалы, не оплатил аванс) 
          или при получении неверных указаний подрядчик ОБЯЗАН приостановить работы и уведомить заказчика.
          Продолжение работ без уведомления лишает права ссылаться на эти обстоятельства при спорах о качестве/сроках.
        legal_base: "ст. 716, 719 ГК РФ"
        severity: "critical"
        affected_party: "seller"
        detection:
          positive_keywords:
            - "право приостановить выполнение работ"
            - "обязан немедленно предупредить заказчика"
            - "непригодность или недоброкачественность материалов"
            - "продление сроков при нарушении заказчиком"
            - "уведомление в письменной форме"
          context_patterns:
            - '(?i)при.*получении.*неверных.*указаний.*подрядчик.*обязан.*приостановить'
            - '(?i)в.*случае.*неоплаты.*аванса.*подрядчик.*вправе.*приостановить.*работы'
      
      - clause_id: "unilateral_acceptance_mechanism"
        name: "Механизм односторонней приемки (автоматическая приемка)"
        risk_if_missing: |
          Заказчики часто уклоняются от подписания актов, чтобы задержать оплату. Без условия об автоматической приемке
          подрядчик вынужден обращаться в суд для принудительной приемки, что требует времени и расходов.
        legal_base: "ст. 720, 753 п. 4 ГК РФ (аналогия)"
        severity: "high"
        affected_party: "seller"
        detection:
          positive_keywords:
            - "работы считаются принятыми"
            - "односторонний акт сдачи-приемки"
            - "при отсутствии мотивированного отказа"
            - "автоматическая приемка"
            - "молчание означает согласие"
          context_patterns:
            - '(?i)если.*заказчик.*не.*направил.*отказ.*в.*течение.*[0-9]+.*дней.*работы.*считаются.*принятыми'
            - '(?i)при.*уклонении.*от.*приемки.*подрядчик.*вправе.*составить.*акт.*односторонне'
      
      - clause_id: "retention_right_payment_security"
        name: "Право удержания результата работ до полной оплаты"
        risk_if_missing: |
          После передачи результата подрядчик теряет основной рычаг воздействия на недобросовестного заказчика.
          Право удержания — ключевой обеспечительный механизм, позволяющий гарантировать оплату.
        legal_base: "ст. 712, 359 ГК РФ"
        severity: "high"
        affected_party: "seller"
        detection:
          positive_keywords:
            - "право удержания результата работ"
            - "до полной оплаты"
            - "не передается до оплаты"
            - "обеспечение исполнения обязательств"
            - "удерживает результат"
          context_patterns:
            - '(?i)подрядчик.*вправе.*удерживать.*результат.*работ.*до.*полного.*исполнения.*обязательства.*по.*оплате'
      
      - clause_id: "payment_terms_penalty_delay"
        name: "Конкретные сроки оплаты и неустойка за просрочку"
        risk_if_missing: |
          Нечеткие формулировки ("оплата после приемки") позволяют заказчику затягивать оплату на неопределенный срок.
          Отсутствие неустойки лишает подрядчика компенсации за задержку платежа и снижает дисциплину оплаты.
        legal_base: "ст. 314, 395, 711 ГК РФ"
        severity: "high"
        affected_party: "seller"
        detection:
          positive_keywords:
            - "срок оплаты"
            - "в течение банковских дней"
            - "неустойка за просрочку оплаты"
            - "проценты по ст. 395 ГК РФ"
            - "штраф за неоплату"
          context_patterns:
            - '(?i)оплата.*производится.*в.*течение.*[0-9]+.*(дней|рабочих.*дней).*с.*момента.*подписания.*акта'
            - '(?i)за.*нарушение.*сроков.*оплаты.*заказчик.*уплачивает.*неустойку.*в.*размере'
    
    # --- ЗАЩИТА ЗАКАЗЧИКА (BUYER PROTECTION) ---
    buyer_protection:
      - clause_id: "detailed_technical_specification"
        name: "Детальное техническое задание/спецификация как неотъемлемая часть"
        risk_if_missing: |
          Без детального ТЗ невозможно доказать несоответствие результата требованиям. Подрядчик может сдать формально
          соответствующий, но бесполезный для заказчика результат. Судебные споры сводятся к экспертизам с непредсказуемым исходом.
        legal_base: "ст. 721 ГК РФ"
        severity: "critical"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "техническое задание"
            - "спецификация"
            - "требования к результату"
            - "технические параметры"
            - "неотъемлемое приложение"
            - "стандарты и нормы"
            - "проектная документация"
          context_patterns:
            - '(?i)техническое.*задание.*является.*неотъемлемой.*частью.*договора'
            - '(?i)работы.*выполняются.*в.*соответствии.*со.*спецификацией.*приложение.*№'
          negative_keywords:
            - "на усмотрение подрядчика"
            - "по согласованию сторон в процессе"
      
      - clause_id: "price_firmness_additional_works"
        name: "Твердая цена и порядок согласования дополнительных работ"
        risk_if_missing: |
          При отсутствии твердой цены подрядчик вправе требовать увеличения оплаты при росте стоимости материалов/работ.
          Отсутствие процедуры согласования допработ ведет к спорам об их необходимости и стоимости.
          Заказчик оказывается в зависимости от требований подрядчика.
        legal_base: "ст. 709, 743, 744 ГК РФ"
        severity: "high"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "твердая цена"
            - "твердая смета"
            - "цена не подлежит изменению"
            - "дополнительные работы согласовываются"
            - "предварительное письменное согласие заказчика"
            - "лимит дополнительных расходов"
          context_patterns:
            - '(?i)цена.*является.*твердой.*и.*изменению.*не.*подлежит'
            - '(?i)выполнение.*дополнительных.*работ.*только.*по.*письменному.*согласованию.*заказчика'
      
      - clause_id: "contractor_liability_for_delay"
        name: "Неустойка (пеня) за просрочку выполнения работ"
        risk_if_missing: |
          Без договорной неустойки заказчик сможет взыскать только убытки от просрочки, которые крайне сложно доказать
          и обосновать в суде. Фактически, подрядчик не несет финансовой ответственности за нарушение сроков.
        legal_base: "ст. 330, 708 ГК РФ"
        severity: "high"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "неустойка за просрочку"
            - "пеня"
            - "штрафные санкции за нарушение сроков"
            - "процент за каждый день просрочки"
            - "фиксированная сумма штрафа"
          context_patterns:
            - '(?i)за.*нарушение.*сроков.*подрядчик.*уплачивает.*неустойку'
            - '(?i)пеня.*начисляется.*за.*каждый.*день.*просрочки.*в.*размере'
      
      - clause_id: "quality_warranty_period_procedure"
        name: "Гарантийный срок и порядок предъявления претензий по качеству"
        risk_if_missing: |
          Без договорного гарантийного срока действует общий 2-летний срок (ст. 724 ГК РФ), но бремя доказывания,
          что недостатки возникли до передачи результата, лежит на заказчике. Укороченные сроки для заявления претензий
          лишают возможности выявить скрытые недостатки.
        legal_base: "ст. 722, 724 ГК РФ"
        severity: "high"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "гарантийный срок"
            - "гарантия качества"
            - "устранение недостатков"
            - "безвозмездное исправление"
            - "претензия по качеству"
            - "срок для заявления претензий"
            - "скрытые недостатки"
          context_patterns:
            - '(?i)гарантийный.*срок.*составляет.*[0-9]+.*(месяц|год|день).*со.*дня.*приемки'
            - '(?i)обнаруженные.*недостатки.*подлежат.*устранению.*подрядчиком.*в.*течение.*[0-9]+.*дней'
      
      - clause_id: "customer_unilateral_refusal_right"
        name: "Право заказчика на односторонний отказ (ст. 717 ГК РФ)"
        risk_if_missing: |
          Подрядчики часто пытаются исключить это право или ввести запретительные штрафы. Сохранение права на отказ
          до сдачи работ с оплатой фактически выполненного — важный инструмент управления рисками заказчика.
        legal_base: "ст. 717 ГК РФ"
        severity: "high"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "право отказаться от исполнения договора"
            - "в любое время до сдачи результата"
            - "оплатив фактически выполненную часть работ"
            - "уплатив подрядчику часть установленной цены"
          negative_keywords:
            - "запрет на односторонний отказ"
            - "штраф за расторжение"
            - "неустойка за отказ от договора"
          context_patterns:
            - '(?i)заказчик.*вправе.*отказаться.*от.*исполнения.*договора.*в.*любое.*время'
            - '(?i)ст.*717.*ГК.*РФ.*сохраняет.*свою.*силу'

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 4: ДОПОЛНИТЕЛЬНЫЕ PROTECTIVE CLAUSES (SPECIFIC RISKS)
  # ──────────────────────────────────────────────────────────
  additional_protective_clauses:
    
    # Общие для обеих сторон
    buyer_seller_protection:
      - clause_id: "risk_allocation_before_acceptance"
        name: "Распределение рисков случайной гибели материалов и результата ДО приемки"
        risk_if_missing: |
          По умолчанию риск несет подрядчик (ст. 705 ГК РФ). Однако при использовании давальческих материалов
          риск их гибели лежит на заказчике. Неясность приводит к спорам о возмещении ущерба при форс-мажоре.
        legal_base: "ст. 705 ГК РФ"
        severity: "critical"
        affected_party: "both"
        detection:
          positive_keywords:
            - "риск случайной гибели"
            - "несет подрядчик"
            - "несет заказчик"
            - "до момента приемки"
            - "материалы заказчика"
            - "страхование рисков"
          context_patterns:
            - '(?i)риск.*случайной.*гибели.*результата.*до.*приемки.*несет.*подрядчик'
            - '(?i)материалы.*предоставленные.*заказчиком.*риск.*их.*гибели.*несет.*заказчик'
      
      - clause_id: "customer_materials_scheme"
        name: "Режим работы с давальческими материалами (отчетность, норма расхода, возврат остатков)"
        risk_if_missing: |
          При работе с материалами заказчика подрядчик несет повышенную ответственность за их сохранность.
          Отсутствие условия о норме расхода и отчетности создает риск нецелевого использования.
          Не предусмотрен возврат остатков ведет к их безвозмездному переходу к подрядчику.
        legal_base: "ст. 713, 714 ГК РФ"
        severity: "high"
        affected_party: "both"
        detection:
          positive_keywords:
            - "материалы заказчика"
            - "давальческое сырье"
            - "норма расхода"
            - "отчет об использовании материалов"
            - "возврат остатков"
            - "ответственность за сохранность"
          context_patterns:
            - '(?i)подрядчик.*предоставляет.*отчет.*об.*использовании.*давальческих.*материалов'
            - '(?i)остатки.*материалов.*подлежат.*возврату.*заказчику'
        conditional_checks:
          - trigger: "customer_supplies_materials"
            keywords: ["предоставляются заказчиком", "давальческое", "материалы заказчика"]
            rule: "materials_reporting_required"
            severity: "high"
      
      - clause_id: "subcontracting_rights_limitations"
        name: "Условия о привлечении субподрядчиков (запрет, ограничения, согласование)"
        risk_if_missing: |
          Для заказчика: подрядчик может привлечь ненадежного субподрядчика, что скажется на качестве и сроках.
          Для подрядчика: отсутствие права привлекать субподрядчиков ограничивает операционную гибкость и повышает риски.
        legal_base: "ст. 706 ГК РФ"
        severity: "medium"
        affected_party: "both"
        detection:
          positive_keywords:
            - "привлечение субподрядчиков"
            - "только с согласия заказчика"
            - "запрещено привлекать"
            - "ответственность за действия субподрядчика"
            - "генеральный подрядчик"
          context_patterns:
            - '(?i)привлечение.*субподрядчиков.*допускается.*только.*с.*письменного.*согласия.*заказчика'
            - '(?i)подрядчик.*несет.*ответственность.*за.*действия.*привлеченных.*субподрядчиков'