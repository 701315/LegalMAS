type: contract_5.2
name: Кредитный договор
description: |
  Консенсуальный возмездный договор, по которому банк или иная кредитная организация (кредитор)
  обязуется предоставить денежные средства (кредит) заемщику в размере и на условиях договора,
  а заемщик обязуется возвратить полученную сумму и уплатить проценты за пользование кредитом.
  Кредитором может быть исключительно лицензированная кредитная организация.
  Несоблюдение письменной формы влечет ничтожность договора.
version: 3.0
parent: class_5_financial_security
metadata:
  category: contract
  subcategory: financial_security
  complexity: high
  risk_level: high
  legal_base: § 2 Главы 42 ГК РФ (ст. 819-821)

# ════════════════════════════════════════════════════════════
# БАЗОВАЯ ИНФОРМАЦИЯ (LEGACY SECTIONS)
# ════════════════════════════════════════════════════════════
rules:
  keywords:
    high:
      - "кредитный договор"
      - "кредит"
      - "кредитная организация"
      - "заемщик"
      - "кредитор"
      - "процентная ставка"
      - "полная стоимость кредита"
      - "банк"
    medium:
      - "проценты за пользование"
      - "график платежей"
      - "аннуитетный платеж"
      - "дифференцированный платеж"
      - "погашение кредита"
      - "транш"
      - "кредитная линия"
    low:
      - "обеспечение кредита"
      - "потребительский кредит"
      - "ипотечный кредит"
      - "овердрафт"
      - "рефинансирование"
      - "реструктуризация долга"
  phrases:
    high:
      - Банк обязуется предоставить Заемщику кредит в размере и на условиях договора
      - Заемщик обязуется возвратить полученную сумму кредита и уплатить проценты
      - Кредит предоставляется на срок и под процентную ставку
      - полная стоимость кредита составляет
      - график погашения кредита является неотъемлемой частью договора
    medium:
      - Заемщик вправе досрочно возвратить кредит с уплатой процентов
      - Банк вправе потребовать досрочного возврата кредита в случае нарушения
      - обеспечением исполнения обязательств Заемщика является
      - начисление процентов производится на остаток задолженности
  patterns:
    required:
      - (?i)(кредитный\s+договор|банк.*предоставля.*кредит|кредит.*заемщик|заемщик.*кредит)
      - (?i)(процент.*за.*пользование.*кредит|ставка.*процент.*годовых)
    optional:
      - (?i)(график.*платеж|аннуитет|дифференцированн|полная.*стоимость.*кредита|ПСК)
      - (?i)(кредитная.*линия|транш|овердрафт|лимит.*кредитования)
  exclusions:
    - договор займа между физическими лицами
    - беспроцентный заем
    - микрозаем от МФО
    - договор ссуды
  exclusion_logic:
    - condition: "no_bank_license AND no_credit_organization"
      target: "rejection"
      confidence: 0.85
      description: "Кредитором может быть только банк или кредитная организация с лицензией ЦБ РФ"
  weights:
    keyword_high: 4.0
    keyword_medium: 2.0
    keyword_low: 0.5
    phrase_high: 3.5
    phrase_medium: 1.5
    pattern_required: 5.0
    pattern_optional: 1.0
  classification:
    min_confidence: 0.80
    max_matches: 2

party_roles:
  - Кредитор (банк или иная кредитная организация, имеющая лицензию ЦБ РФ)
  - Заемщик (физическое лицо, юридическое лицо, ИП)

essential_terms:
  - Размер кредита (сумма, валюта)
  - Процентная ставка и порядок начисления/уплаты процентов
  - Срок возврата кредита и график погашения
  - Цель кредита (для целевых кредитов)
  - Полная стоимость кредита - ПСК (для потребительских кредитов)

specific_risks:
  - Для заемщика: скрытые комиссии и навязанные услуги
  - Для заемщика: потеря заложенного имущества при дефолте
  - Для заемщика: одностороннее изменение банком условий договора
  - Для банка: кредитный риск (дефолт заемщика)
  - Для обеих сторон: споры о правомерности начисления штрафных санкций

aliases:
  - Кредит
  - Банковский кредит
  - Кредитное соглашение
  - Потребительский кредит
  - Ипотечный кредит

section_markers:
  - Предмет договора (сумма, валюта, цель кредита)
  - Условия и порядок предоставления кредита
  - Проценты за пользование кредитом и порядок их уплаты
  - График погашения кредита
  - Полная стоимость кредита (ПСК)
  - Обеспечение исполнения обязательств
  - Права и обязанности сторон
  - Ответственность сторон
  - Порядок разрешения споров

notes: |
  ОСОБЕННОСТИ И ПРАВИЛА ПРИМЕНЕНИЯ:
  1. Кредитором может быть ТОЛЬКО банк или кредитная организация с лицензией ЦБ РФ
  2. Договор ВСЕГДА возмездный - беспроцентный кредитный договор невозможен
  3. Консенсуальный характер: заключен с момента соглашения
  4. Несоблюдение письменной формы влечет НИЧТОЖНОСТЬ договора
  5. Для потребительских кредитов обязательно раскрытие ПСК

# ════════════════════════════════════════════════════════════
# ВАЛИДАЦИОННЫЕ СЕКЦИИ (VALIDATION METADATA v2.0)
# ════════════════════════════════════════════════════════════
validation_metadata:
  validation_version: "2.0"
  last_updated: "2026-02-07"
  author: "Contract Validation System"
  
  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 1: ПРИМЕНИМОЕ ЗАКОНОДАТЕЛЬСТВО
  # ──────────────────────────────────────────────────────────
  legal_base:
    primary:
      - "§ 2 Главы 42 ГК РФ (ст. 819-821) - Кредитный договор"
    secondary:
      - "§ 1 Главы 42 ГК РФ (ст. 807-818) - Заем (субсидиарно)"
      - "ст. 820 ГК РФ - Форма кредитного договора (ничтожность при несоблюдении)"
      - "ст. 821 ГК РФ - Отказ от предоставления/получения кредита"
      - "ст. 432 ГК РФ - Существенные условия договора"
    related:
      - "Федеральный закон от 21.12.2013 № 353-ФЗ 'О потребительском кредите (займе)'"
      - "Федеральный закон от 02.12.1990 № 395-1 'О банках и банковской деятельности'"
      - "Федеральный закон от 16.07.1998 № 102-ФЗ 'Об ипотеке (залоге недвижимости)'"
      - "Федеральный закон от 30.12.2004 № 218-ФЗ 'О кредитных историях'"
      - "Указание Банка России от 21.07.2023 № 6506-У 'О порядке расчета ПСК'"
      - "Закон РФ от 07.02.1992 № 2300-1 'О защите прав потребителей'"

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 2: ОБЯЗАТЕЛЬНЫЕ ЭЛЕМЕНТЫ ДОГОВОРА
  # ──────────────────────────────────────────────────────────
  essential_elements:
    - element: "lender_license"
      required: true
      legal_base: "ст. 819 ГК РФ, ФЗ-3951 ст. 1, 5"
      description: "Кредитор - банк или кредитная организация с лицензией ЦБ РФ"
      validation_rules:
        - "lender_is_licensed_bank"
        - "license_number_present"
      conditional_checks:
        - trigger: "foreign_bank_keywords"
          keywords: ["иностранный банк", "foreign bank", "банк-нерезидент"]
          rule: "russian_license_or_branch_required"
          legal_base: "ФЗ-3951 ст. 17"
          severity: "critical"
          risk_msg: "Иностранные банки могут осуществлять деятельность только через дочерние организации с российской лицензией"
    
    - element: "credit_amount"
      required: true
      legal_base: "ст. 819, 432 ГК РФ"
      description: "Размер кредита с указанием валюты"
      validation_rules:
        - "amount_specified_numerically"
        - "amount_in_words_present"
        - "currency_specified"
      conditional_checks:
        - trigger: "credit_line_keywords"
          keywords: ["кредитная линия", "лимит кредитования", "транш"]
          rule: "credit_limit_and_tranches_specified"
          legal_base: "ст. 819 ГК РФ"
          severity: "high"
          risk_msg: "Для кредитной линии необходимо указать общий лимит и условия предоставления траншей"
    
    - element: "interest_rate"
      required: true
      legal_base: "ст. 819 ГК РФ"
      description: "Процентная ставка (кредитный договор всегда возмездный)"
      validation_rules:
        - "interest_rate_specified"
        - "not_zero_percent"
        - "calculation_method_specified"
      conditional_checks:
        - trigger: "variable_rate_keywords"
          keywords: ["плавающая ставка", "ключевая ставка +", "переменная ставка"]
          rule: "variable_rate_conditions_required"
          legal_base: "ст. 819 ГК РФ, ФЗ-353"
          severity: "critical"
          risk_msg: "При плавающей ставке необходимо указать порядок пересмотра и уведомления заемщика"
    
    - element: "repayment_schedule"
      required: true
      legal_base: "ст. 810, 819 ГК РФ"
      description: "Срок возврата и график погашения кредита"
      validation_rules:
        - "repayment_terms_specified"
        - "schedule_or_dates_provided"
    
    - element: "psk_disclosure"
      required: false
      legal_base: "ст. 6 ФЗ-353"
      description: "Полная стоимость кредита для потребительских кредитов"
      validation_rules:
        - "psk_value_present"
      conditional_checks:
        - trigger: "consumer_credit_keywords"
          keywords: ["потребительский кредит", "физическое лицо", "гражданин", "потребитель"]
          rule: "psk_mandatory"
          legal_base: "ст. 6 ФЗ-353"
          severity: "critical"
          risk_msg: "Для потребительских кредитов обязательно указание полной стоимости кредита (ПСК)"

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 3: ЗАЩИТНЫЕ УСЛОВИЯ (PROTECTIVE CLAUSES)
  # ──────────────────────────────────────────────────────────
  protective_clauses:
    buyer_seller_protection:
      # Защита заемщика: прозрачность комиссий
      - clause_id: "hidden_fees_transparency"
        name: "Прозрачность комиссий и дополнительных платежей"
        risk_if_missing: |
          Банк может включить скрытые комиссии (за выдачу, обслуживание счета, досрочное погашение),
          существенно увеличивающие реальную стоимость кредита. Судебная практика: комиссии за
          стандартные банковские операции признаются недействительными (Информационное письмо
          Президиума ВАС РФ № 147).
        legal_base: "ст. 819 ГК РФ, ст. 5 ФЗ-353"
        severity: "critical"
        affected_party: "borrower"
        detection:
          positive_keywords:
            - "отсутствие скрытых комиссий"
            - "все платежи указаны"
            - "полный перечень платежей"
            - "комиссия не взимается"
            - "без дополнительных сборов"
          negative_keywords:
            - "комиссия за ведение ссудного счета"
            - "комиссия за выдачу кредита"
            - "комиссия за рассмотрение заявки"
          context_patterns:
            - '(?i)все.*комиссии.*и.*платежи.*указаны.*в.*договоре'
            - '(?i)иные.*платежи.*помимо.*указанных.*не.*взимаются'
      
      # Защита заемщика: право на досрочное погашение
      - clause_id: "early_repayment_right"
        name: "Право на досрочное погашение кредита"
        risk_if_missing: |
          Без четкого указания условий досрочного погашения банк может установить запретительные штрафы
          или мораторий на досрочный возврат. Для потребительских кредитов право на досрочный возврат
          гарантировано законом (ст. 11 ФЗ-353).
        legal_base: "ст. 810 ГК РФ, ст. 11 ФЗ-353"
        severity: "high"
        affected_party: "borrower"
        detection:
          positive_keywords:
            - "досрочное погашение"
            - "досрочный возврат кредита"
            - "частичное досрочное погашение"
            - "без штрафа за досрочное погашение"
            - "уведомление о досрочном погашении"
          context_patterns:
            - '(?i)заемщик.*вправе.*досрочно.*возвратить.*кредит'
            - '(?i)досрочное.*погашение.*осуществляется.*при.*условии.*уведомления'
      
      # Защита заемщика: запрет навязывания услуг
      - clause_id: "no_forced_services"
        name: "Запрет навязывания дополнительных услуг"
        risk_if_missing: |
          Банк может обусловить выдачу кредита приобретением страховки, открытием дополнительных счетов.
          Это нарушает ст. 16 Закона о защите прав потребителей и ФЗ-353. Навязанные услуги подлежат
          возврату в течение 14 дней (период охлаждения).
        legal_base: "ст. 7 ФЗ-353, ст. 16 ЗоЗПП"
        severity: "critical"
        affected_party: "borrower"
        detection:
          positive_keywords:
            - "добровольное страхование"
            - "не является обязательным условием"
            - "заемщик вправе отказаться"
            - "без обязательного приобретения"
          negative_keywords:
            - "обязательное страхование жизни"
            - "кредит предоставляется при условии"
            - "обязательное подключение услуги"
          context_patterns:
            - '(?i)выдача.*кредита.*не.*обусловлена.*приобретением.*дополнительных.*услуг'
      
      # Защита банка: обеспечение возврата
      - clause_id: "collateral_security"
        name: "Обеспечение возврата кредита"
        risk_if_missing: |
          Без обеспечения банк несет повышенный кредитный риск. При дефолте заемщика возможно только
          общее взыскание, что малоэффективно при недостаточности активов.
        legal_base: "Глава 23 ГК РФ, ФЗ-102 'Об ипотеке'"
        severity: "high"
        affected_party: "lender"
        detection:
          positive_keywords:
            - "залог"
            - "поручительство"
            - "банковская гарантия"
            - "обеспечение исполнения"
            - "предмет залога"
          context_patterns:
            - '(?i)обеспечением.*исполнения.*обязательств.*является'
            - '(?i)в.*качестве.*обеспечения.*заемщик.*предоставляет'
      
      # Защита банка: досрочное истребование
      - clause_id: "early_demand_triggers"
        name: "Основания для досрочного истребования кредита"
        risk_if_missing: |
          Без перечня оснований для досрочного истребования банк лишен оперативного механизма
          защиты при ухудшении финансового состояния заемщика или нецелевом использовании кредита.
        legal_base: "ст. 811, 813, 814, 821 ГК РФ"
        severity: "critical"
        affected_party: "lender"
        detection:
          positive_keywords:
            - "досрочное истребование"
            - "досрочный возврат по требованию банка"
            - "основания для досрочного требования"
            - "ухудшение финансового состояния"
            - "нецелевое использование"
          context_patterns:
            - '(?i)банк.*вправе.*потребовать.*досрочного.*возврата.*в.*случае'
            - '(?i)основания.*для.*досрочного.*истребования.*кредита'

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 4: ДОПОЛНИТЕЛЬНЫЕ PROTECTIVE CLAUSES
  # ──────────────────────────────────────────────────────────
  additional_protective_clauses:
    buyer_seller_protection:
      # Период охлаждения для потребительских кредитов
      - clause_id: "cooling_off_period"
        name: "Период охлаждения - право отказа от кредита"
        risk_if_missing: |
          Заемщик-потребитель имеет право отказаться от кредита в течение 14 дней (30 дней для целевого)
          без объяснения причин. Если это право не указано, заемщик может не знать о нем.
        legal_base: "ст. 11 ФЗ-353"
        severity: "high"
        affected_party: "borrower"
        detection:
          positive_keywords:
            - "период охлаждения"
            - "отказ от кредита в течение 14 дней"
            - "право на возврат кредита без объяснения причин"
            - "30 дней для целевого кредита"
          context_patterns:
            - '(?i)заемщик.*вправе.*отказаться.*от.*кредита.*в.*течение.*14'
            - '(?i)в.*течение.*четырнадцати.*календарных.*дней.*заемщик.*вправе'
        conditional_checks:
          - trigger: "consumer_credit_keywords"
            keywords: ["потребительский", "физическое лицо", "гражданин"]
            rule: "cooling_off_disclosure_required"
            severity: "high"
      
      # Ограничение штрафных санкций
      - clause_id: "penalty_proportionality"
        name: "Соразмерность неустойки и штрафных санкций"
        risk_if_missing: |
          Банк может установить чрезмерно высокие штрафы и пени за просрочку. Суды снижают такие
          неустойки по ст. 333 ГК РФ. Для потребительских кредитов максимум пени - 20% годовых.
        legal_base: "ст. 333 ГК РФ, ст. 21 ФЗ-353"
        severity: "high"
        affected_party: "borrower"
        detection:
          positive_keywords:
            - "неустойка не более"
            - "пени в размере"
            - "соразмерная неустойка"
            - "штраф не превышает"
            - "двадцать процентов годовых"
          context_patterns:
            - '(?i)размер.*неустойки.*не.*может.*превышать'
            - '(?i)пени.*начисляются.*в.*размере.*не.*более.*\\d+.*процент'
      
      # Согласие на обработку данных и передачу в БКИ
      - clause_id: "personal_data_and_credit_history"
        name: "Согласие на обработку данных и передачу в БКИ"
        risk_if_missing: |
          Банк обязан уведомить заемщика о передаче информации в бюро кредитных историй.
          Без согласия передача данных может быть оспорена.
        legal_base: "ФЗ-218 'О кредитных историях', ФЗ-152 'О персональных данных'"
        severity: "medium"
        affected_party: "borrower"
        detection:
          positive_keywords:
            - "бюро кредитных историй"
            - "БКИ"
            - "кредитная история"
            - "согласие на обработку персональных данных"
            - "передача информации"
          context_patterns:
            - '(?i)заемщик.*дает.*согласие.*на.*передачу.*информации.*в.*бюро.*кредитных.*историй'
      
      # Очерёдность списания платежей
      - clause_id: "payment_priority_order"
        name: "Очерёдность списания денежных средств"
        risk_if_missing: |
          Без определенной очередности банк может направлять платежи сначала на штрафы и пени,
          а не на основной долг и проценты, что увеличивает задолженность.
        legal_base: "ст. 319 ГК РФ, ст. 5 ФЗ-353"
        severity: "high"
        affected_party: "both"
        detection:
          positive_keywords:
            - "очередность списания"
            - "порядок погашения"
            - "направление платежей"
            - "в первую очередь - проценты"
            - "приоритет погашения"
          context_patterns:
