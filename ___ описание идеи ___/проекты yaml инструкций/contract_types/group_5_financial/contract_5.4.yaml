type: contract_5.4
name: Договор банковского вклада (депозита) и банковского счета
description: |
  Два смежных банковских договора:
  1. Договор банковского вклада - реальный договор, по которому банк принимает денежные средства
     от вкладчика и обязуется возвратить сумму вклада с процентами.
  2. Договор банковского счета - консенсуальный договор, по которому банк обязуется открыть счет
     и осуществлять операции по нему в соответствии с распоряжениями клиента.
version: 3.0
parent: class_5_financial_security
metadata:
  category: contract
  subcategory: financial_security
  complexity: medium-high
  risk_level: medium-high
  legal_base: Глава 44-45 ГК РФ

# ════════════════════════════════════════════════════════════
# БАЗОВАЯ ИНФОРМАЦИЯ (LEGACY SECTIONS)
# ════════════════════════════════════════════════════════════
rules:
  keywords:
    high:
      - "банковский вклад"
      - "банковский счет"
      - "депозит"
      - "вкладчик"
      - "владелец счета"
      - "расчетный счет"
      - "проценты по вкладу"
      - "договор на РКО"
    medium:
      - "срочный вклад"
      - "до востребования"
      - "процентная ставка"
      - "капитализация процентов"
      - "текущий счет"
      - "депозитный сертификат"
      - "начисление процентов"
    low:
      - "выписка по счету"
      - "РКО"
      - "банковская тайна"
      - "дистанционное банковское обслуживание"
      - "интернет-банк"
      - "овердрафт"
  phrases:
    high:
      - Банк принимает сумму вклада и обязуется возвратить сумму вклада и выплатить проценты
      - Банк обязуется принимать и зачислять поступающие на счет Клиента денежные средства
      - Банк гарантирует тайну банковского счета и операций по нему
      - вклад застрахован в соответствии с Федеральным законом о страховании вкладов
    medium:
      - процентная ставка составляет
      - начисление процентов производится
      - досрочное расторжение вклада
      - тарифы на расчетно-кассовое обслуживание
  patterns:
    required:
      - (?i)(банковский\s+вклад|банковский\s+счет|депозит\s+в\s+банк|вкладчик|владелец\s+счета)
    optional:
      - (?i)(расчетный\s+счет|текущий\s+счет|срочный\s+вклад|вклад\s+до\s+востребования)
      - (?i)(процент.*по\s+вклад|капитализаци|РКО|расчетно-кассов)
  exclusions:
    - кредитный договор
    - договор займа (не от банка)
    - простое хранение денег
  exclusion_logic:
    - condition: "loan_issuance AND no_deposit_acceptance"
      target: "rejection"
      confidence: 0.90
      description: "Если банк выдает деньги клиенту - это кредит, а не вклад/счет"
  weights:
    keyword_high: 4.0
    keyword_medium: 2.0
    keyword_low: 0.5
    phrase_high: 3.5
    phrase_medium: 1.5
    pattern_required: 5.0
    pattern_optional: 1.0
  classification:
    min_confidence: 0.80
    max_matches: 2

party_roles:
  - Банк (кредитная организация с лицензией ЦБ РФ)
  - Вкладчик / Клиент (физическое или юридическое лицо)

essential_terms:
  - Для вклада: сумма, валюта, вид вклада (срочный/до востребования)
  - Для счета: вид счета (расчетный, текущий), валюта
  - Размер и порядок начисления процентов (для вклада - обязательно)
  - Срок вклада / срок действия договора
  - Порядок возврата вклада / закрытия счета

specific_risks:
  - Риск отзыва лицензии у банка (для физлиц смягчается страхованием вкладов)
  - Блокировка счета по 115-ФЗ (ПОД/ФТ)
  - Несанкционированное списание средств со счета
  - Споры о начислении и выплате процентов
  - Одностороннее снижение процентной ставки банком

aliases:
  - Депозит
  - Банковский вклад
  - Расчетный счет
  - Депозитный договор
  - Договор РКО
  - Договор на открытие счета

section_markers:
  deposit:
    sections:
      - Предмет договора (сумма, валюта, вид вклада)
      - Процентная ставка и порядок начисления/выплаты процентов
      - Порядок внесения и пополнения вклада
      - Порядок возврата вклада (в т.ч. досрочного)
      - Страхование вклада (для физических лиц)
  account:
    sections:
      - Предмет договора (вид счета, валюта)
      - Порядок осуществления операций по счету
      - Тарифы и стоимость услуг банка
      - Проценты за пользование средствами на счете (если предусмотрено)
      - Овердрафт (если предусмотрен)
      - Порядок расторжения договора и закрытия счета

notes: |
  ОСОБЕННОСТИ И ПРАВИЛА ПРИМЕНЕНИЯ:
  1. Договор банковского вклада с гражданином - публичный договор
  2. Банк не вправе односторонне уменьшать ставку по срочному вкладу гражданина
  3. Страхование вкладов физлиц - возмещение до 1,4 млн руб.
  4. Обязательная идентификация клиента при открытии счета/вклада (115-ФЗ)

# ════════════════════════════════════════════════════════════
# ВАЛИДАЦИОННЫЕ СЕКЦИИ (VALIDATION METADATA v2.0)
# ════════════════════════════════════════════════════════════
validation_metadata:
  validation_version: "2.0"
  last_updated: "2026-02-07"
  author: "Contract Validation System"
  
  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 1: ПРИМЕНИМОЕ ЗАКОНОДАТЕЛЬСТВО
  # ──────────────────────────────────────────────────────────
  legal_base:
    primary:
      - "Глава 44 ГК РФ (ст. 834-844) - банковский вклад"
      - "Глава 45 ГК РФ (ст. 845-860.15) - банковский счет"
    secondary:
      - "ст. 838 ГК РФ - проценты по вкладу"
      - "ст. 857 ГК РФ - банковская тайна"
      - "ст. 859 ГК РФ - расторжение договора банковского счета"
    related:
      - "Федеральный закон от 02.12.1990 № 395-1 'О банках и банковской деятельности'"
      - "Федеральный закон от 23.12.2003 № 177-ФЗ 'О страховании вкладов'"
      - "Федеральный закон от 07.08.2001 № 115-ФЗ 'О противодействии легализации'"
      - "Федеральный закон от 02.10.2007 № 229-ФЗ 'Об исполнительном производстве'"
      - "Налоговый кодекс РФ ст. 214.2 - налогообложение процентов по вкладам"

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 2: ОБЯЗАТЕЛЬНЫЕ ЭЛЕМЕНТЫ ДОГОВОРА
  # ──────────────────────────────────────────────────────────
  essential_elements:
    - element: "bank_license"
      required: true
      legal_base: "ст. 834, 845 ГК РФ, ФЗ-3951"
      description: "Банк должен иметь лицензию ЦБ РФ"
      validation_rules:
        - "bank_license_present"
        - "license_scope_covers_deposits_or_accounts"
    
    - element: "deposit_amount_and_terms"
      required: true
      legal_base: "ст. 836, 837 ГК РФ"
      description: "Для вклада: сумма, валюта, вид вклада"
      validation_rules:
        - "deposit_amount_specified"
        - "currency_specified"
        - "deposit_type_specified"
      conditional_checks:
        - trigger: "term_deposit_keywords"
          keywords: ["срочный вклад", "на срок", "депозит на [срок]"]
          rule: "deposit_term_specified"
          legal_base: "ст. 837 ГК РФ"
          severity: "high"
          risk_msg: "Для срочного вклада должен быть указан срок размещения"
    
    - element: "account_type_and_currency"
      required: true
      legal_base: "ст. 845, 846 ГК РФ"
      description: "Для счета: тип счета и валюта"
      validation_rules:
        - "account_type_specified"
        - "account_currency_specified"
    
    - element: "deposit_interest_rate"
      required: true
      legal_base: "ст. 838 ГК РФ"
      description: "Процентная ставка по вкладу"
      validation_rules:
        - "interest_rate_specified"
        - "interest_calculation_method_defined"
    
    - element: "return_procedure"
      required: true
      legal_base: "ст. 837, 859 ГК РФ"
      description: "Порядок возврата вклада / закрытия счета"
      validation_rules:
        - "return_conditions_specified"
        - "early_withdrawal_terms_specified"

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 3: ЗАЩИТНЫЕ УСЛОВИЯ (PROTECTIVE CLAUSES)
  # ──────────────────────────────────────────────────────────
  protective_clauses:
    
    # --- ЗАЩИТА ВКЛАДЧИКА/КЛИЕНТА ---
    client_protection:
      - clause_id: "deposit_insurance_disclosure"
        name: "Раскрытие информации о страховании вклада"
        risk_if_missing: |
          Вкладчик-физлицо может не знать о страховании вкладов. При отзыве лицензии у банка
          вкладчик рискует потерять средства свыше 1,4 млн руб. Отсутствие информации -
          нарушение прав потребителя.
        legal_base: "ФЗ-177 'О страховании вкладов', ст. 840 ГК РФ"
        severity: "critical"
        affected_party: "depositor"
        detection:
          positive_keywords:
            - "страхование вкладов"
            - "АСВ"
            - "застрахован"
            - "страховое возмещение"
            - "1 400 000"
            - "1,4 млн"
          context_patterns:
            - '(?i)вклад.*застрахован.*в.*соответствии.*с.*федеральным.*законом'
            - '(?i)страховое.*возмещение.*выплачивается.*в.*размере.*не.*более'
        conditional_checks:
          - trigger: "individual_depositor"
            keywords: ["физическое лицо", "гражданин", "вкладчик"]
            rule: "insurance_disclosure_mandatory"
            severity: "critical"
      
      - clause_id: "interest_rate_fixation"
        name: "Фиксация процентной ставки"
        risk_if_missing: |
          Без явной фиксации банк может снизить ставку в одностороннем порядке.
          Для срочных вкладов граждан это запрещено ст. 838 ГК РФ.
        legal_base: "ст. 838 ГК РФ"
        severity: "critical"
        affected_party: "depositor"
        detection:
          positive_keywords:
            - "фиксированная ставка"
            - "процентная ставка не подлежит изменению"
            - "ставка на весь срок вклада"
            - "банк не вправе уменьшать"
          context_patterns:
            - '(?i)процентная.*ставка.*по.*вкладу.*составляет.*и.*не.*подлежит.*изменению'
      
      - clause_id: "early_withdrawal_rights"
        name: "Право на досрочное изъятие вклада"
        risk_if_missing: |
          Вкладчик-физлицо имеет право на досрочный возврат вклада, но проценты обычно
          пересчитываются по ставке вклада до востребования. Отсутствие условий ведет к спорам.
        legal_base: "ст. 837 ГК РФ"
        severity: "high"
        affected_party: "depositor"
        detection:
          positive_keywords:
            - "досрочное расторжение"
            - "досрочный возврат вклада"
            - "пересчет процентов"
            - "ставка до востребования"
          context_patterns:
            - '(?i)вкладчик.*вправе.*потребовать.*возврата.*вклада.*до.*истечения.*срока'
    
    # --- ЗАЩИТА БАНКА ---
    bank_protection:
      - clause_id: "aml_ctf_compliance"
        name: "Условия о соблюдении требований ПОД/ФТ"
        risk_if_missing: |
          Банк обязан соблюдать 115-ФЗ. Отсутствие условий о праве банка запрашивать документы
          и приостанавливать операции создает правовую неопределенность.
        legal_base: "ФЗ-115 'О противодействии легализации'"
        severity: "critical"
        affected_party: "bank"
        detection:
          positive_keywords:
            - "идентификация клиента"
            - "противодействие легализации"
            - "115-ФЗ"
            - "подозрительные операции"
            - "документы для идентификации"
          context_patterns:
            - '(?i)клиент.*обязуется.*предоставлять.*документы.*для.*идентификации'
      
      - clause_id: "account_closure_procedure"
        name: "Порядок расторжения договора и закрытия счета"
        risk_if_missing: |
          При отсутствии порядка возникают споры о моменте прекращения обязательств,
          судьбе остатка на счете. Банк несет риск продолжения обслуживания.
        legal_base: "ст. 859 ГК РФ"
        severity: "high"
        affected_party: "bank"
        detection:
          positive_keywords:
            - "расторжение договора"
            - "закрытие счета"
            - "остаток средств при закрытии"
            - "уведомление о расторжении"
          context_patterns:
            - '(?i)договор.*может.*быть.*расторгнут.*по.*заявлению.*клиента.*в.*любое.*время'

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 4: ДОПОЛНИТЕЛЬНЫЕ PROTECTIVE CLAUSES
  # ──────────────────────────────────────────────────────────
  additional_protective_clauses:
    
    # Защита клиента
    client_protection:
      - clause_id: "account_blocking_transparency"
        name: "Прозрачность оснований блокировки счета"
        risk_if_missing: |
          Банк обязан приостанавливать операции по 115-ФЗ, но клиент должен быть уведомлен
          об основаниях. Отсутствие условий о разблокировке лишает клиента механизма защиты.
        legal_base: "ст. 858 ГК РФ, ФЗ-115"
        severity: "high"
        affected_party: "client"
        detection:
          positive_keywords:
            - "блокировка счета"
            - "приостановление операций"
            - "ограничение распоряжения"
            - "разблокировка"
            - "уведомление о блокировке"
          context_patterns:
            - '(?i)банк.*вправе.*приостановить.*операции.*по.*счету.*в.*случаях'
      
      - clause_id: "unauthorized_debit_protection"
        name: "Защита от несанкционированного списания средств"
        risk_if_missing: |
          Без условий о порядке безакцептного списания банк может списывать средства
          по инкассовым поручениям без предварительного уведомления клиента.
        legal_base: "ст. 854 ГК РФ"
        severity: "high"
        affected_party: "client"
        detection:
          positive_keywords:
            - "безакцептное списание"
            - "списание без распоряжения"
            - "инкассовое поручение"
            - "уведомление о списании"
          context_patterns:
            - '(?i)списание.*средств.*со.*счета.*производится.*по.*распоряжению.*клиента'
      
      - clause_id: "tariff_transparency"
        name: "Прозрачность тарифов и комиссий банка"
        risk_if_missing: |
          Банки устанавливают скрытые комиссии. Клиент должен знать полный перечень
          и размер комиссий до заключения договора.
        legal_base: "ст. 851 ГК РФ, ЗоЗПП"
        severity: "high"
        affected_party: "client"
        detection:
          positive_keywords:
            - "тарифы банка"
            - "комиссия за обслуживание"
            - "стоимость услуг"
            - "плата за ведение счета"
            - "перечень комиссий"
          context_patterns:
            - '(?i)стоимость.*услуг.*банка.*определяется.*в.*соответствии.*с.*тарифами'
      
      - clause_id: "electronic_banking_security"
        name: "Безопасность дистанционного банковского обслуживания"
        risk_if_missing: |
          При использовании интернет-банка возникают риски несанкционированного доступа.
          Отсутствие условий о распределении ответственности приводит к спорам.
        legal_base: "ФЗ-161 'О национальной платежной системе'"
        severity: "high"
        affected_party: "client"
        detection:
          positive_keywords:
            - "дистанционное банковское обслуживание"
            - "интернет-банк"
            - "мобильное приложение"
            - "электронная подпись"
            - "несанкционированный доступ"
          context_patterns:
            - '(?i)клиент.*обязуется.*обеспечить.*конфиденциальность.*средств.*доступа'
      
      - clause_id: "overdraft_terms"
        name: "Условия овердрафта"
        risk_if_missing: |
          При наличии овердрафта без четких условий клиент может нести неожиданные расходы
          на проценты. Неясность условий влечет споры.
        legal_base: "ст. 850 ГК РФ"
        severity: "high"
        affected_party: "both"
        detection:
          positive_keywords:
            - "овердрафт"
            - "кредитование счета"
            - "лимит овердрафта"
            - "проценты за овердрафт"
          context_patterns:
            - '(?i)банк.*вправе.*осуществлять.*кредитование.*счета.*клиента'
        conditional_checks:
          - trigger: "overdraft_keywords"
            keywords: ["овердрафт", "кредитование счета"]
            rule: "overdraft_terms_required"
            severity: "high"
    
    # Защита банка
    bank_protection:
      - clause_id: "tax_agent_obligations"
        name: "Обязанности банка как налогового агента"
        risk_if_missing: |
          Банки обязаны удерживать НДФЛ с процентов по вкладам физлиц, превышающим
          необлагаемый минимум. Отсутствие упоминания создает правовую неопределенность.
        legal_base: "НК РФ ст. 214.2"
        severity: "medium"
        affected_party: "bank"
        detection:
          positive_keywords:
            - "налоговый агент"
            - "НДФЛ с процентов"
            - "удержание налога"
            - "необлагаемый минимум"
          context_patterns:
            - '(?i)банк.*является.*налоговым.*агентом.*по.*НДФЛ.*с.*процентов.*по.*вкладу'
        conditional_checks:
          - trigger: "individual_depositor_interest"
            keywords: ["вклад", "физическое лицо", "проценты"]
            rule: "tax_agent_disclosure"
            severity: "medium"
      
      - clause_id: "court_and_enforcement_orders"
        name: "Порядок исполнения судебных актов"
        risk_if_missing: |
          Банк обязан исполнять исполнительные документы. Отсутствие порядка уведомления
          клиента создает конфликты и претензии.
        legal_base: "ФЗ-229 'Об исполнительном производстве', ст. 855 ГК РФ"
        severity: "high"
        affected_party: "both"
        detection:
          positive_keywords:
            - "исполнительный документ"
            - "судебный акт"
            - "инкассовое поручение"
            - "арест счета"
            - "исполнительное производство"
          context_patterns:
            - '(?i)банк.*обязан.*исполнить.*исполнительный.*документ.*в.*порядке'