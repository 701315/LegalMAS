type: contract_5.1
name: Договор займа
description: |
  Реальный договор, по которому одна сторона (займодавец) передает в собственность другой стороне (заемщику) 
  деньги или вещи, определенные родовыми признаками, а заемщик обязуется возвратить такую же сумму денег 
  или равное количество вещей того же рода и качества.
version: 3.0
parent: class_5_financial_security
metadata:
  category: contract
  subcategory: financial_security
  complexity: medium
  risk_level: high
  legal_base: § 1 Главы 42 ГК РФ (ст. 807-818)

# ════════════════════════════════════════════════════════════
# БАЗОВАЯ ИНФОРМАЦИЯ (LEGACY SECTION)
# ════════════════════════════════════════════════════════════
rules:
  keywords:
    high:
      - "заем"
      - "займ"
      - "займодавец"
      - "заемщик"
      - "сумма займа"
      - "возврат"
      - "проценты"
    medium:
      - "целевой заем"
      - "беспроцентный"
      - "расписка"
      - "неустойка"
    low:
      - "заемные средства"
      - "долговое обязательство"
  phrases:
    high:
      - Займодавец передает в собственность Заемщику деньги
      - Заемщик обязуется возвратить сумму займа
      - Договор считается заключенным с момента передачи денег
  patterns:
    required:
      - (?i)(за[её]м|займ|займодавец|заемщик)
    optional:
      - (?i)(процент|расписка|возврат.*сумм)
  exclusions:
    - кредитный договор
    - договор ссуды
  weights:
    keyword_high: 3.0
    keyword_medium: 1.5
    keyword_low: 0.5
    phrase_high: 2.5
    pattern_required: 4.0
  classification:
    min_confidence: 0.75
    max_matches: 2

party_roles:
  - Займодавец (лицо, предоставляющее заем)
  - Заемщик (лицо, получающее заем)

essential_terms:
  - Сумма займа
  - Обязанность возврата
  - Срок возврата (если не указан - по требованию)

specific_risks:
  - Невозврат суммы займа
  - Отсутствие доказательств передачи денег
  - Споры о размере процентов

aliases:
  - Заем
  - Договор денежного займа
  - Расписка

section_markers:
  - Предмет договора
  - Порядок предоставления и возврата
  - Проценты по займу
  - Ответственность сторон
  - Заключительные положения

notes: |
  Для договоров между гражданами на сумму до 10 000 руб. допускается устная форма.
  Для юрлиц и ИП договор предполагается возмездным.

# ════════════════════════════════════════════════════════════
# ВАЛИДАЦИОННЫЕ СЕКЦИИ (VALIDATION METADATA v2.0)
# ════════════════════════════════════════════════════════════
validation_metadata:
  validation_version: "2.0"
  last_updated: "2026-02-07"
  author: "Contract Validation System"
  
  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 1: ПРИМЕНИМОЕ ЗАКОНОДАТЕЛЬСТВО
  # Минимум 5 пунктов с иерархией primary/secondary/related
  # ──────────────────────────────────────────────────────────
  legal_base:
    primary:
      - "§ 1 Главы 42 ГК РФ (ст. 807-818) - общие положения о займе"
    secondary:
      - "ст. 809 ГК РФ (проценты по договору займа)"
      - "ст. 810 ГК РФ (обязанность возврата займа)"
      - "ст. 811 ГК РФ (последствия нарушения обязательств заемщиком)"
      - "ст. 812 ГК РФ (оспоривание договора займа по безденежности)"
    related:
      - "Налоговый кодекс РФ ст. 212 (материальная выгода от экономии на процентах)"
      - "Федеральный закон от 10.12.2003 № 173-ФЗ 'О валютном регулировании'"
      - "Указание ЦБ РФ от 11.08.2014 № 3328-У 'О максимальной процентной ставке'"
      - "Постановление Пленума ВС РФ № 54 от 22.11.2016 (о некоторых вопросах применения ст. 809 ГК РФ)"

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 2: ОБЯЗАТЕЛЬНЫЕ ЭЛЕМЕНТЫ ДОГОВОРА
  # Минимум 4 элемента с conditional_checks
  # ──────────────────────────────────────────────────────────
  essential_elements:
    - element: "loan_amount"
      required: true
      legal_base: "ст. 807 ГК РФ"
      description: "Сумма денежного займа или количество вещей"
      validation_rules:
        - "numerical_amount_specified"
        - "currency_specified"
      conditional_checks:
        - trigger: "foreign_currency"
          keywords: ["доллар", "евро", "USD", "EUR", "иностранная валюта"]
          rule: "currency_restrictions_check"
          legal_base: "ФЗ-173 ст. 9"
          severity: "critical"
          risk_msg: "Валютные займы между резидентами РФ ограничены законом"
    
    - element: "repayment_obligation"
      required: true
      legal_base: "ст. 810 ГК РФ"
      description: "Обязанность заемщика возвратить полученное"
      validation_rules:
        - "return_clause_exists"
        - "no_donation_indicators"
    
    - element: "interest_rate_specification"
      required: false
      legal_base: "ст. 809 ГК РФ"
      description: "Условие о процентах или беспроцентности"
      validation_rules:
        - "interest_specified_or_free"
      conditional_checks:
        - trigger: "commercial_parties"
          keywords: ["ООО", "АО", "ИП", "юридическое лицо", "индивидуальный предприниматель"]
          rule: "interest_presumed_for_commercial"
          legal_base: "ст. 809 ГК РФ"
          severity: "high"
          risk_msg: "Для договоров между юрлицами/ИП заем предполагается возмездным"
    
    - element: "transfer_confirmation"
      required: true
      legal_base: "ст. 808, 812 ГК РФ"
      description: "Подтверждение фактической передачи предмета займа"
      validation_rules:
        - "transfer_confirmation_exists"
      conditional_checks:
        - trigger: "cash_transfer"
          keywords: ["наличными", "передача из рук в руки", "наличный расчет"]
          rule: "receipt_or_witnesses_required"
          legal_base: "ст. 808 ГК РФ"
          severity: "critical"

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 3: ЗАЩИТНЫЕ УСЛОВИЯ (PROTECTIVE CLAUSES)
  # Минимум 5 защитных условий с detection механизмами
  # ──────────────────────────────────────────────────────────
  protective_clauses:
    buyer_seller_protection:
      # 1. Защита займодавца: неустойка за просрочку
      - clause_id: "penalty_for_late_payment"
        name: "Неустойка за просрочку возврата займа"
        risk_if_missing: |
          Без договорной неустойки займодавец может требовать только проценты по ст. 395 ГК РФ,
          что может быть недостаточной компенсацией при длительной просрочке.
        legal_base: "ст. 330, 811 ГК РФ"
        severity: "high"
        affected_party: "lender"
        detection:
          positive_keywords:
            - "неустойка за просрочку"
            - "штраф за несвоевременный возврат"
            - "пеня за каждый день просрочки"
            - "договорная неустойка"
            - "санкции за нарушение срока"
          context_patterns:
            - '(?i)при.*просрочке.*возврата.*начисляется.*неустойка'
            - '(?i)заемщик.*уплачивает.*штраф.*в.*размере'
      
      # 2. Защита займодавца: досрочный возврат при нарушениях
      - clause_id: "acceleration_clause"
        name: "Право требовать досрочного возврата при нарушениях"
        risk_if_missing: |
          Отсутствие явного права на досрочный возврат при нарушениях затрудняет защиту
          интересов займодавца при существенных нарушениях условий договора.
        legal_base: "ст. 811, 813 ГК РФ"
        severity: "high"
        affected_party: "lender"
        detection:
          positive_keywords:
            - "потребовать досрочного возврата всей суммы"
            - "в случае просрочки более [X] дней"
            - "при утрате обеспечения"
            - "при нарушении целевого использования"
          context_patterns:
            - '(?i)займодавец.*вправе.*потребовать.*досрочного.*возврата.*все[йе]й.*сумм[ыы]'
      
      # 3. Защита займодавца: контроль целевого использования
      - clause_id: "target_loan_control"
        name: "Контроль целевого использования заемных средств"
        risk_if_missing: |
          Для целевого займа отсутствие контроля лишает займодавца возможности
          проверять использование средств и требовать досрочного возврата при нецелевом использовании.
        legal_base: "ст. 814 ГК РФ"
        severity: "medium"
        affected_party: "lender"
        detection:
          positive_keywords:
            - "целевой заем"
            - "право контроля целевого использования"
            - "предоставление отчетов об использовании"
            - "документы, подтверждающие использование"
          context_patterns:
            - '(?i)займодавец.*вправе.*проверять.*целевое.*использование.*средств'
      
      # 4. Защита заемщика: право на досрочный возврат
      - clause_id: "early_repayment_right"
        name: "Право заемщика на досрочный возврат займа"
        risk_if_missing: |
          Для заемщиков-юридических лиц отсутствие права на досрочный возврат означает,
          что они не могут вернуть заем без согласия займодавца, даже при наличии средств.
        legal_base: "ст. 810 п. 2 ГК РФ"
        severity: "high"
        affected_party: "borrower"
        detection:
          positive_keywords:
            - "право на досрочный возврат"
            - "вернуть досрочно без согласия займодавца"
            - "без штрафных санкций при досрочном возврате"
          context_patterns:
            - '(?i)заемщик.*вправе.*досрочно.*вернуть.*за[её]м.*без.*согласия.*займодавца'
      
      # 5. Защита заемщика: прозрачность расчета процентов
      - clause_id: "interest_calculation_transparency"
        name: "Прозрачность расчета и начисления процентов"
        risk_if_missing: |
          Нечеткие условия расчета процентов могут привести к их начислению на первоначальную
          сумму даже после частичного погашения, что является кабальным условием.
        legal_base: "ст. 10, 809 ГК РФ"
        severity: "medium"
        affected_party: "borrower"
        detection:
          positive_keywords:
            - "на остаток ссудной задолженности"
            - "фактический остаток долга"
            - "проценты начисляются на непогашенную часть"
          context_patterns:
            - '(?i)проценты.*начисляются.*на.*остаток.*задолженности'

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 4: ДОПОЛНИТЕЛЬНЫЕ PROTECTIVE CLAUSES
  # Для специфических рисков
  # ──────────────────────────────────────────────────────────
  additional_protective_clauses:
    buyer_seller_protection:
      # 1. Подтверждение передачи денег
      - clause_id: "money_transfer_proof"
        name: "Подтверждение фактической передачи денежных средств"
        risk_if_missing: |
          Отсутствие доказательств передачи денег делает договор уязвимым для оспаривания
          по безденежности (ст. 812 ГК РФ). Особенно критично при наличных расчетах.
        legal_base: "ст. 812 ГК РФ"
        severity: "critical"
        affected_party: "lender"
        detection:
          positive_keywords:
            - "Денежные средства переданы при подписании"
            - "расписка является неотъемлемой частью договора"
            - "факт передачи денег подтверждается"
            - "переданы до подписания договора"
          context_patterns:
            - '(?i)денежные.*средства.*переданы.*заемщику.*при.*подписании'
      
      # 2. Ограничение процентной ставки
      - clause_id: "interest_rate_cap"
        name: "Ограничение размера процентной ставки"
        risk_if_missing: |
          Чрезмерно высокая процентная ставка может быть признана ростовщической
          и снижена судом по иску заемщика.
        legal_base: "ст. 809 ГК РФ, Постановление Пленума ВС РФ № 54"
        severity: "medium"
        affected_party: "borrower"
        detection:
          positive_keywords:
            - "процентная ставка не превышает"
            - "ограничение размера процентов"
            - "максимальная процентная ставка"
            - "годовых не более"
          context_patterns:
            - '(?i)процентная.*ставка.*не.*должна.*превышать.*[0-9]+%'
      
      # 3. Налоговые последствия
      - clause_id: "tax_consequences_disclosure"
        name: "Раскрытие налоговых последствий для сторон"
        risk_if_missing: |
          Беспроцентные займы между физлицами создают материальную выгоду, облагаемую НДФЛ.
          Неинформированность сторон ведет к налоговым доначислениям, пеням и штрафам.
        legal_base: "НК РФ ст. 212, 224"
        severity: "medium"
        affected_party: "borrower"
        detection:
          positive_keywords:
            - "стороны осведомлены о налоговых последствиях"
            - "материальная выгода по беспроцентному займу"
            - "налоговые обязательства заемщика"
            - "НДФЛ с материальной выгоды"
          context_patterns:
            - '(?i)заемщик.*осведомлен.*о.*налоговых.*последствиях.*беспроцентного.*займа'
      
      # 4. Распределение валютных рисков
      - clause_id: "currency_risk_allocation"
        name: "Распределение валютных рисков при займе в иностранной валюте"
        risk_if_missing: |
          При займе в иностранной валюте колебания курса могут существенно изменить
          сумму обязательства. Неопределенность ведет к спорам о сумме возврата.
        legal_base: "ст. 317, 140 ГК РФ, ФЗ-173"
        severity: "critical"
        affected_party: "both"
        detection:
          positive_keywords:
            - "курс пересчета на дату возврата"
            - "валютная оговорка"
            - "курс ЦБ РФ на дату платежа"
            - "распределение валютных рисков"
          context_patterns:
            - '(?i)возврат.*осуществляется.*по.*курсу.*ЦБ.*РФ.*на.*дату.*платежа'
      
      # 5. Подтверждение возврата займа
      - clause_id: "repayment_confirmation"
        name: "Подтверждение факта возврата займа"
        risk_if_missing: |
          Без письменного подтверждения возврата займодавец может потребовать
          повторного возврата. Особенно рискованно при наличных расчетах.
        legal_base: "ст. 408, 810 ГК РФ"
        severity: "high"
        affected_party: "borrower"
        detection:
          positive_keywords:
            - "расписка в получении возврата"
            - "акт приема-передачи возвращенных средств"
            - "подтверждение возврата займа"
            - "отметка о погашении долга"
          context_patterns:
            - '(?i)факт.*возврата.*займа.*подтверждается.*распиской.*займодавца'