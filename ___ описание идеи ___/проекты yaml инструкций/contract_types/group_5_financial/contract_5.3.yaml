type: contract_5.3
name: Договор финансирования под уступку денежного требования (факторинг)
description: |
  Договор, по которому финансовый агент (фактор) передает или обязуется передать денежные средства
  клиенту в счет денежного требования клиента к третьему лицу (должнику), а клиент уступает или
  обязуется уступить фактору это денежное требование. Является способом мобилизации оборотных средств
  поставщика за счет будущих платежей покупателей. Регулируется главой 43 ГК РФ.
version: 3.0
parent: class_5_financial_security
metadata:
  category: contract
  subcategory: financial_security
  complexity: high
  risk_level: high
  legal_base: Глава 43 ГК РФ (ст. 824-833)

# ════════════════════════════════════════════════════════════
# БАЗОВАЯ ИНФОРМАЦИЯ (LEGACY SECTIONS)
# ════════════════════════════════════════════════════════════
rules:
  keywords:
    high:
      - "факторинг"
      - "финансирование под уступку"
      - "финансовый агент"
      - "фактор"
      - "уступка денежного требования"
      - "дебиторская задолженность"
      - "регресс"
      - "безрегрессный факторинг"
    medium:
      - "клиент-поставщик"
      - "должник-дебитор"
      - "финансирование поставщика"
      - "уступка будущего требования"
      - "факторинговая комиссия"
      - "реестр уступленных требований"
    low:
      - "управление дебиторской задолженностью"
      - "инкассирование задолженности"
      - "скрытый факторинг"
      - "открытый факторинг"
      - "международный факторинг"
  phrases:
    high:
      - Клиент уступает Финансовому агенту денежное требование к Должнику
      - Финансовый агент обязуется предоставить Клиенту финансирование
      - финансирование под уступку денежного требования
      - факторинг с регрессом / без регресса
    medium:
      - Финансовый агент выплачивает Клиенту сумму финансирования в размере процента
      - Должник обязан произвести платеж Финансовому агенту после уведомления
      - В случае неисполнения Должником требования Фактор вправе предъявить регресс
  patterns:
    required:
      - (?i)(факторинг|финансирование.*под.*уступку|финансовый.*агент|фактор.*уступ)
      - (?i)(уступ.*денежн.*требован|дебиторск.*задолженност|денежн.*требован.*к.*должник)
    optional:
      - (?i)(с.*регресс|без.*регресс|факторинговая.*комисси|будущ.*требовани)
  exclusions:
    - договор цессии по иным основаниям
    - договор займа
    - договор поручительства
  exclusion_logic:
    - condition: "simple_cession AND no_financing_element"
      target: "rejection"
      confidence: 0.85
      description: "Если отсутствует элемент финансирования - это цессия, а не факторинг"
  weights:
    keyword_high: 4.0
    keyword_medium: 2.0
    keyword_low: 0.5
    phrase_high: 3.5
    phrase_medium: 1.5
    pattern_required: 5.0
    pattern_optional: 1.0
  classification:
    min_confidence: 0.80
    max_matches: 2

party_roles:
  - Финансовый агент (фактор) - коммерческая организация (банк, факторинговая компания)
  - Клиент (поставщик товаров/услуг, первоначальный кредитор)
  - Должник (дебитор клиента) - третье лицо, обязанное произвести платеж

essential_terms:
  - Предмет уступаемого денежного требования (описание, основание, сумма, должник)
  - Размер и порядок предоставления финансирования
  - Размер и порядок уплаты вознаграждения финансового агента
  - Вид факторинга (с регрессом или без регресса)
  - Порядок уведомления должника об уступке

specific_risks:
  - Для клиента: регрессное требование фактора при неплатеже должника
  - Для фактора: кредитный риск должника при факторинге без регресса
  - Для фактора: риск недействительности уступаемого требования
  - Для обеих сторон: споры о моменте перехода требования
  - Для обеих сторон: нарушение порядка уведомления должника

aliases:
  - Факторинг
  - Договор факторинга
  - Финансирование под дебиторскую задолженность
  - Факторинг с регрессом
  - Факторинг без регресса

section_markers:
  - Предмет договора (описание уступаемых требований)
  - Размер и порядок предоставления финансирования
  - Порядок уступки требования и передачи документов
  - Уведомление должника об уступке
  - Вознаграждение финансового агента
  - Распределение рисков (с регрессом / без регресса)
  - Права и обязанности сторон
  - Конфиденциальность
  - Ответственность сторон
  - Срок действия договора

notes: |
  ОСОБЕННОСТИ И ПРАВИЛА ПРИМЕНЕНИЯ:
  1. Два основных вида: с регрессом и без регресса
  2. Финансовым агентом может быть любая коммерческая организация
  3. Уступка будущего денежного требования допускается
  4. Должник обязан произвести платеж фактору при условии уведомления
  5. Клиент несет ответственность за действительность уступаемого требования

# ════════════════════════════════════════════════════════════
# ВАЛИДАЦИОННЫЕ СЕКЦИИ (VALIDATION METADATA v2.0)
# ════════════════════════════════════════════════════════════
validation_metadata:
  validation_version: "2.0"
  last_updated: "2026-02-07"
  author: "Contract Validation System"
  
  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 1: ПРИМЕНИМОЕ ЗАКОНОДАТЕЛЬСТВО
  # ──────────────────────────────────────────────────────────
  legal_base:
    primary:
      - "Глава 43 ГК РФ (ст. 824-833) - финансирование под уступку денежного требования"
    secondary:
      - "ст. 382-390 ГК РФ - общие положения об уступке права требования"
      - "ст. 825 ГК РФ - финансовый агент (требования к субъекту)"
      - "ст. 826 ГК РФ - денежное требование как предмет уступки"
      - "ст. 827 ГК РФ - ответственность клиента за действительность требования"
      - "ст. 830 ГК РФ - исполнение денежного требования должником"
    related:
      - "Федеральный закон от 26.10.2002 № 127-ФЗ 'О несостоятельности (банкротстве)'"
      - "Налоговый кодекс РФ ст. 155, 279 - налогообложение операций факторинга"
      - "Федеральный закон от 02.12.1990 № 395-1 'О банках и банковской деятельности'"
      - "Конвенция УНИДРУА о международном факторинге (Оттава, 1988)"

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 2: ОБЯЗАТЕЛЬНЫЕ ЭЛЕМЕНТЫ ДОГОВОРА
  # ──────────────────────────────────────────────────────────
  essential_elements:
    - element: "assigned_claim_description"
      required: true
      legal_base: "ст. 826 ГК РФ"
      description: "Описание уступаемого денежного требования"
      validation_rules:
        - "claim_description_specified"
        - "claim_amount_specified"
        - "debtor_identified"
      conditional_checks:
        - trigger: "future_claim_keywords"
          keywords: ["будущее требование", "требование, которое возникнет", "после поставки"]
          rule: "future_claim_identification_required"
          legal_base: "ст. 826 ГК РФ"
          severity: "critical"
          risk_msg: "Будущее требование должно быть определимо - указан должник, основание и срок"
    
    - element: "financing_amount_and_procedure"
      required: true
      legal_base: "ст. 824 ГК РФ"
      description: "Размер финансирования и порядок выплаты"
      validation_rules:
        - "financing_amount_specified"
        - "payment_procedure_defined"
        - "payment_timeline_specified"
    
    - element: "factor_remuneration"
      required: true
      legal_base: "ст. 824 ГК РФ"
      description: "Вознаграждение фактора (комиссия, дисконт)"
      validation_rules:
        - "remuneration_amount_specified"
        - "fee_calculation_method_specified"
    
    - element: "factoring_type"
      required: true
      legal_base: "ст. 831 ГК РФ"
      description: "Вид факторинга: с регрессом или без регресса"
      validation_rules:
        - "recourse_type_specified"
      conditional_checks:
        - trigger: "recourse_factoring_keywords"
          keywords: ["с регрессом", "регрессное требование", "возврат финансирования"]
          rule: "recourse_conditions_specified"
          legal_base: "ст. 831 ГК РФ"
          severity: "critical"
          risk_msg: "При факторинге с регрессом должны быть четко определены условия регресса"
    
    - element: "debtor_notification_procedure"
      required: true
      legal_base: "ст. 830 ГК РФ"
      description: "Порядок уведомления должника об уступке"
      validation_rules:
        - "notification_procedure_specified"
        - "notification_responsibility_assigned"

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 3: ЗАЩИТНЫЕ УСЛОВИЯ (PROTECTIVE CLAUSES)
  # ──────────────────────────────────────────────────────────
  protective_clauses:
    
    # --- ЗАЩИТА КЛИЕНТА (Client Protection) ---
    client_protection:
      - clause_id: "transparent_commission_structure"
        name: "Прозрачная структура вознаграждения фактора"
        risk_if_missing: |
          Без четкого описания всех комиссий клиент рискует столкнуться со скрытыми платежами:
          комиссия за обработку, управление дебиторской задолженностью, штрафы за просрочку.
          Реальная стоимость факторинга может оказаться значительно выше заявленной.
        legal_base: "ст. 824 ГК РФ"
        severity: "critical"
        affected_party: "client"
        detection:
          positive_keywords:
            - "полный перечень комиссий"
            - "комиссия за финансирование"
            - "дисконт"
            - "факторинговое вознаграждение включает"
            - "иные платежи не взимаются"
          negative_keywords:
            - "дополнительные платежи по тарифам"
            - "комиссии определяются фактором в одностороннем порядке"
          context_patterns:
            - '(?i)вознаграждение.*фактора.*включает.*исключительно'
            - '(?i)все.*комиссии.*и.*платежи.*указаны.*в.*приложении'
      
      - clause_id: "excess_collection_return"
        name: "Возврат клиенту суммы, превышающей размер финансирования"
        risk_if_missing: |
          Если фактор получает от должника сумму, превышающую размер финансирования и комиссии,
          излишек должен быть возвращен клиенту. Без этого условия фактор может неосновательно
          обогатиться за счет клиента.
        legal_base: "ст. 831 п. 2 ГК РФ"
        severity: "high"
        affected_party: "client"
        detection:
          positive_keywords:
            - "возврат излишка"
            - "сумма, превышающая финансирование"
            - "разница подлежит возврату клиенту"
            - "обязанность перечислить остаток"
          context_patterns:
            - '(?i)если.*полученная.*от.*должника.*сумма.*превышает.*размер.*финансирования'
      
      - clause_id: "recourse_limitation"
        name: "Ограничение регрессных требований фактора"
        risk_if_missing: |
          При факторинге с регрессом неограниченное регрессное требование ставит клиента в крайне
          невыгодное положение. Без ограничения сумма регресса может многократно превысить
          полученное финансирование.
        legal_base: "ст. 831 ГК РФ"
        severity: "critical"
        affected_party: "client"
        detection:
          positive_keywords:
            - "ограничение регресса"
            - "максимальная сумма регрессного требования"
            - "регресс не превышает"
            - "лимит ответственности клиента"
          context_patterns:
            - '(?i)регрессное.*требование.*не.*может.*превышать.*сумму.*финансирования'
    
    # --- ЗАЩИТА ФАКТОРА (Factor Protection) ---
    factor_protection:
      - clause_id: "claim_validity_warranty"
        name: "Гарантия клиента о действительности уступаемого требования"
        risk_if_missing: |
          Без гарантий фактор рискует приобрести несуществующее, оспоримое или уже погашенное
          требование. Клиент должен нести ответственность за действительность требования.
        legal_base: "ст. 827 ГК РФ"
        severity: "critical"
        affected_party: "factor"
        detection:
          positive_keywords:
            - "действительность требования"
            - "клиент гарантирует"
            - "требование существует"
            - "обязательство не исполнено"
            - "клиент несет ответственность за действительность"
          context_patterns:
            - '(?i)клиент.*гарантирует.*действительность.*уступаемого.*требования'
      
      - clause_id: "anti_dilution_and_setoff_protection"
        name: "Защита от зачета встречных требований должника"
        risk_if_missing: |
          Должник вправе предъявить к зачету встречные требования к клиенту, что может полностью
          обнулить требование фактора. Без механизмов защиты фактор несет значительный риск.
        legal_base: "ст. 832 ГК РФ"
        severity: "critical"
        affected_party: "factor"
        detection:
          positive_keywords:
            - "отсутствие встречных требований"
            - "зачет встречных требований"
            - "клиент гарантирует отсутствие зачета"
            - "компенсация при зачете"
          context_patterns:
            - '(?i)клиент.*гарантирует.*отсутствие.*встречных.*требований.*должника'

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 4: ДОПОЛНИТЕЛЬНЫЕ PROTECTIVE CLAUSES
  # ──────────────────────────────────────────────────────────
  additional_protective_clauses:
    
    # Защита клиента при безрегрессном факторинге
    client_protection:
      - clause_id: "non_recourse_confirmation"
        name: "Подтверждение безрегрессного характера"
        risk_if_missing: |
          При факторинге без регресса фактор принимает на себя кредитный риск должника.
          Без явного указания фактор может попытаться предъявить скрытые регрессные требования.
        legal_base: "ст. 831 п. 1 ГК РФ"
        severity: "high"
        affected_party: "client"
        detection:
          positive_keywords:
            - "без регресса"
            - "безрегрессный факторинг"
            - "риск неплатежа несет фактор"
            - "фактор не вправе требовать возврата финансирования"
          context_patterns:
            - '(?i)факторинг.*осуществляется.*без.*права.*регресса'
        conditional_checks:
          - trigger: "non_recourse_keywords"
            keywords: ["без регресса", "безрегрессный"]
            rule: "explicit_non_recourse_confirmation_required"
            severity: "high"
      
      - clause_id: "debtor_relationship_preservation"
        name: "Сохранение отношений клиента с должником"
        risk_if_missing: |
          Агрессивное взыскание фактором может нарушить деловые отношения клиента с должником.
          Без согласования действий клиент рискует потерять контрагента.
        legal_base: "ст. 824 ГК РФ"
        severity: "medium"
        affected_party: "client"
        detection:
          positive_keywords:
            - "согласование действий по взысканию"
            - "уведомление клиента о контактах с должником"
            - "корректное взыскание"
            - "сохранение деловых отношений"
          context_patterns:
            - '(?i)фактор.*обязуется.*информировать.*клиента.*о.*действиях.*по.*взысканию'
    
    # Защита фактора от ключевых рисков
    factor_protection:
      - clause_id: "prohibition_of_subsequent_assignment"
        name: "Запрет последующей уступки клиентом"
        risk_if_missing: |
          Клиент может повторно уступить то же требование третьему лицу, создав конкуренцию прав.
          Фактор рискует утратить приоритет и не получить платеж.
        legal_base: "ст. 829 ГК РФ"
        severity: "critical"
        affected_party: "factor"
        detection:
          positive_keywords:
            - "запрет последующей уступки"
            - "клиент не вправе уступать"
            - "исключительное право фактора"
            - "запрет повторной уступки"
          context_patterns:
            - '(?i)клиент.*не.*вправе.*уступать.*требование.*третьим.*лицам'
      
      - clause_id: "bankruptcy_claw_back_protection"
        name: "Защита от оспаривания сделки при банкротстве клиента"
        risk_if_missing: |
          При банкротстве клиента уступка может быть оспорена как сделка с предпочтением
          или подозрительная сделка. Фактор рискует утратить приобретенное требование.
        legal_base: "ст. 61.2, 61.3 ФЗ-127 'О несостоятельности'"
        severity: "critical"
        affected_party: "factor"
        detection:
          positive_keywords:
            - "заверение об отсутствии признаков банкротства"
            - "клиент не находится в процедуре банкротства"
            - "рыночные условия сделки"
            - "эквивалентность встречного предоставления"
          context_patterns:
            - '(?i)клиент.*заверяет.*что.*не.*имеет.*признаков.*банкротства'
      
      - clause_id: "tax_risk_allocation"
        name: "Распределение налоговых рисков"
        risk_if_missing: |
          Уступка денежного требования имеет налоговые последствия: НДС на вознаграждение,
          определение налоговой базы при уступке. Неопределенность ведет к доначислениям.
        legal_base: "НК РФ ст. 155, 279"
        severity: "high"
        affected_party: "both"
        detection:
          positive_keywords:
            - "налоговые последствия уступки"
            - "НДС на услуги фактора"
            - "убыток от уступки"
            - "налоговая база при уступке"
            - "стороны несут налоговые обязательства"
          context_patterns:
            - '(?i)стороны.*самостоятельно.*исполняют.*свои.*налоговые.*обязательства'
      
      - clause_id: "document_transfer_obligation"
        name: "Обязанность клиента передать подтверждающие документы"
        risk_if_missing: |
          Без первичных документов фактор не сможет подтвердить требование в суде или при взыскании.
          Отсутствие документов - основание для отказа должника в платеже.
        legal_base: "ст. 826, 830 ГК РФ"
        severity: "high"
        affected_party: "factor"
        detection:
          positive_keywords:
            - "передача документов"
            - "оригиналы документов"
            - "акт приема-передачи документов"
            - "накладные"
            - "счета-фактуры"
            - "подтверждающая документация"
          context_patterns:
            - '(?i)клиент.*обязуется.*передать.*фактору.*документы.*подтверждающие'