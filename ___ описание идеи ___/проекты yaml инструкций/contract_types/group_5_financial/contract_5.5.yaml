type: contract_5.5
name: Договор поручительства / Договор залога
description: |
  Акцессорные (обеспечительные) договоры, действительность и существование которых зависят от основного обязательства (кредит, заём, поставка и др.). Призваны снизить риск кредитора путём предоставления дополнительного источника удовлетворения требований.
  1. Поручительство — обязательство поручителя отвечать перед кредитором должника за исполнение последним его обязательства полностью или в части. По умолчанию — солидарная ответственность (ст. 363 ГК РФ).
  2. Залог — право кредитора (залогодержателя) получить удовлетворение из стоимости заложенного имущества преимущественно перед другими кредиторами залогодателя (ст. 334 ГК РФ).
version: 2.0
parent: class_5_financial_security
metadata:
  category: contract
  subcategory: financial_security
  complexity: high
  risk_level: high
  legal_base: "§ 5 Главы 23 ГК РФ (ст. 361–367) — поручительство; § 3 Главы 23 ГК РФ (ст. 334–358.18) — залог"

# ════════════════════════════════════════════════════════════
# БАЗОВАЯ ИНФОРМАЦИЯ (OPTIMIZED LEGACY SECTIONS)
# ════════════════════════════════════════════════════════════
rules:
  keywords:
    high:
      - "поручительство"
      - "поручитель"
      - "залог"
      - "залогодатель"
      - "залогодержатель"
      - "обеспечение обязательства"
      - "основное обязательство"
      - "солидарная ответственность"
      - "предмет залога"
      - "ипотека"
      - "обращение взыскания"
    medium:
      - "обеспечительный договор"
      - "акцессорное обязательство"
      - "закладная"
      - "заложенное имущество"
      - "реализация предмета залога"
      - "субсидиарная ответственность"
      - "регрессное требование"
      - "последующий залог"
      - "оценка залога"
    low:
      - "имущественное обеспечение"
      - "обременение имущества"
      - "реестр залогов"
      - "созалогодержатель"
      - "удержание"
      - "обеспечительный платеж"
  phrases:
    high:
      - Поручитель обязуется отвечать перед Кредитором за исполнение Должником обязательства
      - Залогодатель передаёт в залог следующее имущество в обеспечение исполнения обязательств
      - Поручитель несёт солидарную ответственность с Должником
      - Залогодержатель имеет право получить удовлетворение из стоимости заложенного имущества
      - обращение взыскания на заложенное имущество
    medium:
      - Поручительство обеспечивает исполнение обязательства по договору
      - оценка предмета залога составляет
      - Залогодатель гарантирует, что имущество не обременено правами третьих лиц
      - поручитель, исполнивший обязательство, приобретает права кредитора
      - реализация предмета залога осуществляется путём
  patterns:
    required:
      - (?i)(поручительств|поручитель|залог\w*|залогодатель|залогодержатель|обеспечени\w+\s+обязательств|ипотек\w+)
    optional:
      - (?i)(солидарн\w+\s+ответственност|субсидиарн\w+\s+ответственност|обращени\w+\s+взыскани|регрессн\w+\s+требовани|предмет\s+залог|последующ\w+\s+залог)
  exclusions:
    - самостоятельное обязательство без основного долга
    - купля-продажа
    - дарение
    - договор страхования
    - банковская (независимая) гарантия
  exclusion_logic:
    - condition: "no_main_obligation_reference"
      target: "rejection"
      confidence: 0.90
      description: "Если отсутствует ссылка на основное обязательство — это не акцессорный договор"
    - condition: "independent_payment_obligation AND no_accessory_nature"
      target: "reclassification_to_guarantee"
      confidence: 0.85
      description: "Независимая гарантия (ст. 368 ГК РФ) — отдельный тип, не поручительство"
  weights:
    keyword_high: 3.0
    keyword_medium: 1.5
    keyword_low: 0.5
    phrase_high: 2.5
    phrase_medium: 1.0
    pattern_required: 4.0
    pattern_optional: 1.0
  classification:
    min_confidence: 0.75
    max_matches: 2

party_roles:
  guaranty:
    description: "Для поручительства"
    roles:
      - Поручитель (лицо, принимающее на себя обязательство отвечать за должника)
      - Кредитор (лицо, перед которым поручитель принимает обязательство)
      - Должник по основному обязательству (сторона, за которую поручаются; может не быть стороной договора поручительства)
  pledge:
    description: "Для залога"
    roles:
      - Залогодатель (должник или третье лицо, предоставляющее имущество в залог)
      - Залогодержатель (кредитор по основному обязательству)

essential_terms:
  guaranty:
    description: "Существенные условия поручительства"
    terms:
      - "Указание на основное обязательство, за исполнение которого поручитель отвечает"
      - "Указание должника по основному обязательству"
      - "Объём ответственности поручителя (полный / частичный / ограниченный суммой)"
      - "Вид ответственности (солидарная / субсидиарная)"
  pledge:
    description: "Существенные условия залога"
    terms:
      - "Предмет залога (индивидуально-определённое имущество или имущественные права)"
      - "Оценка предмета залога"
      - "Существо, размер и срок исполнения обязательства, обеспеченного залогом"
      - "Указание на то, у какой из сторон находится заложенное имущество"

specific_risks:
  - "Акцессорность: прекращение основного обязательства влечёт прекращение обеспечительного"
  - "Для поручителя: риск солидарной ответственности по умолчанию (кредитор может предъявить требование напрямую)"
  - "Для поручителя: риск увеличения объёма ответственности при изменении условий основного обязательства без согласия"
  - "Для залогодателя: утрата имущества при обращении взыскания, в т.ч. во внесудебном порядке"
  - "Для залогодателя-третьего лица: обязательство возникает без получения прямой выгоды"
  - "Для кредитора: риск утраты или обесценивания предмета залога"
  - "Для кредитора: пропуск срока предъявления требования к поручителю (1 год по умолчанию, ст. 367 ГК РФ)"
  - "Для всех сторон: риск оспаривания сделки в рамках банкротства (ст. 61.2, 61.3 ФЗ-127)"
  - "Для залогодержателя: риск утраты преимущественного права при нарушении порядка регистрации залога"

aliases:
  - Поручительство
  - Залог
  - Ипотека
  - Залог недвижимости
  - Обеспечительный договор
  - Залог движимого имущества
  - Залог прав
  - Залог товаров в обороте
  - Заклад

section_markers:
  guaranty:
    description: "Секции для договора поручительства"
    sections:
      - Предмет договора (основное обязательство, за которое поручитель отвечает)
      - Объём и вид ответственности поручителя (солидарная/субсидиарная, лимит суммы)
      - Срок поручительства
      - Права и обязанности сторон
      - Порядок предъявления требований к поручителю
      - Регрессные права поручителя к должнику
      - Прекращение поручительства
  pledge:
    description: "Секции для договора залога"
    sections:
      - Предмет залога (описание, индивидуализация имущества)
      - Оценка предмета залога
      - Обеспечиваемое обязательство
      - Права и обязанности сторон
      - Порядок обращения взыскания (судебный / внесудебный)
      - Порядок реализации предмета залога
      - Последующий залог (допустимость, условия)
      - Страхование предмета залога
      - Прекращение залога

notes: |
  ОСОБЕННОСТИ И ПРАВИЛА ПРИМЕНЕНИЯ:
  1. Акцессорная природа: обеспечительный договор следует судьбе основного обязательства.
  2. Поручительство по умолчанию — солидарное (ст. 363 ГК РФ). Субсидиарное — только если прямо указано.
  3. Поручитель, исполнивший обязательство, получает права кредитора (суброгация, ст. 365 ГК РФ).
  4. Поручительство прекращается, если кредитор не предъявил иск в течение 1 года с даты исполнения (ст. 367 ГК РФ).
  5. Для залога недвижимости (ипотеки) обязательна государственная регистрация.
  6. Обращение взыскания на залог — по общему правилу в судебном порядке; внесудебный — только при наличии соглашения (ст. 349 ГК РФ).
  7. В банкротстве обеспечительные сделки могут быть оспорены как сделки с предпочтением (ст. 61.3 ФЗ-127).

# ════════════════════════════════════════════════════════════
# ВАЛИДАЦИОННЫЕ СЕКЦИИ (VALIDATION ENGINE v2.0)
# ════════════════════════════════════════════════════════════

validation_metadata:
  validation_version: "2.0"
  last_updated: "2026-02-07"
  author: "Legal AI Team (Enhanced)"

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 1: ПРИМЕНИМОЕ ЗАКОНОДАТЕЛЬСТВО
  # ──────────────────────────────────────────────────────────
  legal_base:
    primary:
      - "§ 5 Главы 23 ГК РФ (ст. 361–367) — поручительство"
      - "§ 3 Главы 23 ГК РФ (ст. 334–358.18) — залог"
    secondary:
      - "ст. 329 ГК РФ — общие способы обеспечения исполнения обязательств"
      - "ст. 339.1 ГК РФ — государственная регистрация и учёт залога"
      - "ст. 349–350.2 ГК РФ — обращение взыскания и реализация предмета залога"
    related:
      - "Федеральный закон от 16.07.1998 № 102-ФЗ 'Об ипотеке (залоге недвижимости)'"
      - "Федеральный закон от 26.10.2002 № 127-ФЗ 'О несостоятельности (банкротстве)' (ст. 61.2, 61.3, 138)"
      - "Федеральный закон от 02.10.2007 № 229-ФЗ 'Об исполнительном производстве'"
      - "Постановление Пленума ВС РФ от 24.12.2020 № 45 'О поручительстве'"
      - "Постановление Пленума ВАС РФ от 17.02.2011 № 10 'О залоге'"

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 2: ОБЯЗАТЕЛЬНЫЕ ЭЛЕМЕНТЫ ДОГОВОРА
  # ──────────────────────────────────────────────────────────
  essential_elements:
    - element: "secured_obligation_reference"
      required: true
      legal_base: "ст. 339, 361, 432 ГК РФ"
      description: "Ссылка на основное обеспечиваемое обязательство (номер, дата, стороны, сумма, срок)"
      validation_rules:
        - "main_contract_reference_present"
        - "obligation_amount_and_term_specified"
      risk_if_missing: "Без указания основного обязательства договор является недействительным как непоименованный"

    - element: "guarantor_liability_scope"
      required: true
      legal_base: "ст. 361, 363 ГК РФ"
      description: "Объем и вид ответственности поручителя (полная/частичная, солидарная/субсидиарная)"
      validation_rules:
        - "liability_scope_specified"
        - "liability_amount_or_limit_defined"
      conditional_checks:
        - trigger: "guaranty_keywords"
          keywords: ["поручительство", "поручитель", "отвечать за должника"]
          rule: "liability_details_required"
          legal_base: "ст. 361 ГК РФ"
          severity: "critical"
          risk_msg: "Для поручительства должен быть четко определен объем и вид ответственности"

    - element: "pledged_property_description"
      required: true
      legal_base: "ст. 339 ГК РФ"
      description: "Индивидуализация предмета залога и его оценка"
      validation_rules:
        - "property_description_specific"
        - "property_identification_data_present"
        - "valuation_specified"
      conditional_checks:
        - trigger: "pledge_keywords"
          keywords: ["залог", "заложенное имущество", "предмет залога", "ипотека"]
          rule: "property_description_required"
          legal_base: "ст. 339 ГК РФ"
          severity: "critical"
          risk_msg: "Предмет залога должен быть четко индивидуализирован"

    - element: "pledge_subject_location"
      required: true
      legal_base: "ст. 338 ГК РФ"
      description: "Указание, у кого остается предмет залога (залогодатель / залогодержатель)"
      validation_rules:
        - "possession_party_specified"

    - element: "enforcement_procedure"
      required: true
      legal_base: "ст. 349, 366 ГК РФ"
      description: "Порядок обращения взыскания на предмет залога / предъявления требований к поручителю"
      validation_rules:
        - "enforcement_conditions_specified"
        - "enforcement_procedure_defined"

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 3: ЗАЩИТНЫЕ УСЛОВИЯ (PROTECTIVE CLAUSES)
  # ──────────────────────────────────────────────────────────
  protective_clauses:

    # --- ЗАЩИТА ПОРУЧИТЕЛЯ (Guarantor Protection) ---
    guarantor_protection:
      - clause_id: "limitation_of_guarantor_liability"
        name: "Ограничение ответственности поручителя (лимит суммы)"
        risk_if_missing: |
          По умолчанию поручитель несет солидарную ответственность в полном объеме (основной долг, проценты, неустойки, судебные издержки). Без лимита поручитель рискует выплатить сумму, значительно превышающую первоначальный долг.
        legal_base: "ст. 363 ГК РФ"
        severity: "critical"
        affected_party: "guarantor"
        detection:
          positive_keywords:
            - "ответственность поручителя ограничена суммой"
            - "лимит по поручительству"
            - "поручитель отвечает в пределах"
            - "максимальная сумма поручительства"
          context_patterns:
            - '(?i)ответственность.*поручителя.*ограничена.*суммой.*[0-9]+'
            - '(?i)поручитель.*несет.*ответственность.*только.*в.*пределах.*основного.*долга'

      - clause_id: "subsidiary_liability_clause"
        name: "Установление субсидиарной (а не солидарной) ответственности"
        risk_if_missing: |
          По умолчанию поручитель несет солидарную ответственность. Без этой оговорки кредитор может требовать исполнения сразу с поручителя, не обращаясь сначала к должнику.
        legal_base: "ст. 363 ГК РФ"
        severity: "high"
        affected_party: "guarantor"
        detection:
          positive_keywords:
            - "субсидиарная ответственность"
            - "поручитель отвечает после должника"
            - "обязанность кредитора сначала потребовать с должника"
          negative_keywords:
            - "солидарная ответственность"
          context_patterns:
            - '(?i)поручитель.*несет.*субсидиарную.*ответственность'

      - clause_id: "guarantor_consent_to_changes"
        name: "Согласие поручителя на изменение основного обязательства"
        risk_if_missing: |
          Кредитор и должник могут изменить основное обязательство (сумму, срок), увеличивая риск поручителя. Поручительство может прекратиться (ст. 367 ГК РФ), но на практике кредители включают "бланкетное согласие".
        legal_base: "ст. 367 ГК РФ"
        severity: "critical"
        affected_party: "guarantor"
        detection:
          positive_keywords:
            - "согласие поручителя на изменение"
            - "прекращение поручительства при изменении без согласия"
            - "уведомление поручителя об изменениях"
          negative_keywords:
            - "поручитель заранее дает согласие на любые изменения"
            - "безусловное согласие"
          context_patterns:
            - '(?i)изменение.*основного.*обязательства.*без.*согласия.*поручителя.*влечет.*прекращение'

      - clause_id: "guarantor_subrogation_rights"
        name: "Право регресса (суброгации) поручителя к должнику"
        risk_if_missing: |
          Поручитель, исполнивший обязательство, приобретает права кредитора (ст. 365 ГК РФ). Без явного порядка реализации этих прав поручитель может не возместить свои расходы.
        legal_base: "ст. 365 ГК РФ"
        severity: "high"
        affected_party: "guarantor"
        detection:
          positive_keywords:
            - "регрессное требование поручителя"
            - "суброгация"
            - "права кредитора переходят к поручителю"
            - "возмещение поручителю"
          context_patterns:
            - '(?i)поручитель.*исполнивший.*обязательство.*приобретает.*права.*кредитора'

    # --- ЗАЩИТА ЗАЛОГОДАТЕЛЯ (Pledgor Protection) ---
    pledgor_protection:
      - clause_id: "judicial_enforcement_requirement"
        name: "Требование судебного порядка обращения взыскания"
        risk_if_missing: |
          Без требования судебного порядка залогодержатель может обратить взыскание во внесудебном порядке (если это предусмотрено договором), лишая залогодателя возможности оспорить требования в суде до реализации.
        legal_base: "ст. 349 ГК РФ"
        severity: "critical"
        affected_party: "pledgor"
        detection:
          positive_keywords:
            - "обращение взыскания только в судебном порядке"
            - "запрет внесудебного обращения взыскания"
            - "требуется решение суда"
          context_patterns:
            - '(?i)обращение.*взыскания.*на.*предмет.*залога.*осуществляется.*только.*по.*решению.*суда'

      - clause_id: "pledge_valuation_fairness"
        name: "Справедливая (независимая) оценка предмета залога"
        risk_if_missing: |
          Заниженная оценка ведет к утрате имущества стоимостью выше долга. При реализации имущество может быть продано по заниженной цене.
        legal_base: "ст. 340 ГК РФ"
        severity: "critical"
        affected_party: "pledgor"
        detection:
          positive_keywords:
            - "независимая оценка"
            - "оценщик"
            - "отчёт об оценке"
            - "рыночная стоимость"
          context_patterns:
            - '(?i)оценка.*предмета.*залога.*произведена.*независимым.*оценщиком'

      - clause_id: "pledgor_right_to_use_property"
        name: "Право залогодателя на пользование заложенным имуществом"
        risk_if_missing: |
          Без явного права залогодатель может быть лишен возможности использовать заложенное имущество, особенно если оно является средством производства или источником дохода.
        legal_base: "ст. 346 ГК РФ"
        severity: "medium"
        affected_party: "pledgor"
        detection:
          positive_keywords:
            - "право пользования предметом залога"
            - "залогодатель сохраняет право владения и пользования"
            - "извлечение доходов из заложенного имущества"
          context_patterns:
            - '(?i)залогодатель.*вправе.*пользоваться.*предметом.*залога.*в.*соответствии.*с.*его.*назначением'

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 4: ДОПОЛНИТЕЛЬНЫЕ PROTECTIVE CLAUSES
  # ──────────────────────────────────────────────────────────
  additional_protective_clauses:

    # Защита поручителя
    guarantor_protection:
      - clause_id: "guarantor_notification_of_default"
        name: "Обязанность кредитора уведомить поручителя о неисполнении"
        risk_if_missing: |
          Поручитель может узнать о дефолте слишком поздно, когда долг вырос за счет процентов и штрафов, лишаясь возможности своевременно принять меры.
        legal_base: "ст. 366 ГК РФ"
        severity: "high"
        affected_party: "guarantor"
        detection:
          positive_keywords:
            - "уведомление поручителя о неисполнении"
            - "кредитор обязан сообщить поручителю о просрочке"
            - "извещение о дефолте"
          context_patterns:
            - '(?i)кредитор.*обязан.*уведомить.*поручителя.*о.*неисполнении.*должником'

    # Защита залогодателя
    pledgor_protection:
      - clause_id: "pledge_no_encumbrances"
        name: "Гарантия отсутствия иных обременений на предмет залога"
        risk_if_missing: |
          Если имущество уже обременено, залогодержатель может не получить приоритета. Для залогодателя — риск ответственности за недостоверные заверения.
        legal_base: "ст. 342, 345 ГК РФ"
        severity: "critical"
        affected_party: "both"
        detection:
          positive_keywords:
            - "отсутствие обременений"
            - "не находится в залоге"
            - "свободно от прав третьих лиц"
            - "выписка из ЕГРН"
          context_patterns:
            - '(?i)залогодатель.*гарантирует.*что.*имущество.*не.*обременено'

      - clause_id: "subsequent_pledge_control"
        name: "Контроль/запрет последующего залога"
        risk_if_missing: |
          Залогодатель может заложить имущество другим кредиторам, создавая конкуренцию и риск недостаточности стоимости для удовлетворения всех требований.
        legal_base: "ст. 342 ГК РФ"
        severity: "high"
        affected_party: "creditor"
        detection:
          positive_keywords:
            - "запрет последующего залога"
            - "последующий залог не допускается"
            - "согласие на последующий залог"
          context_patterns:
            - '(?i)последующий.*залог.*предмета.*залога.*(не.*допускается|запрещен)'

    # Защита кредитора/залогодержателя
    creditor_protection:
      - clause_id: "pledge_insurance_obligation"
        name: "Обязанность страхования предмета залога"
        risk_if_missing: |
          При гибели или повреждении предмета залога кредитор утрачивает обеспечение без компенсации.
        legal_base: "ст. 343 ГК РФ, ст. 31 ФЗ-102"
        severity: "critical"
        affected_party: "creditor"
        detection:
          positive_keywords:
            - "страхование предмета залога"
            - "выгодоприобретатель — залогодержатель"
            - "обязанность застраховать"
          context_patterns:
            - '(?i)залогодатель.*обязан.*застраховать.*предмет.*залога'

      - clause_id: "mortgage_registration_obligation"
        name: "Обязательная государственная регистрация ипотеки"
        risk_if_missing: |
          Без регистрации в ЕГРН ипотека не возникает, кредитор не приобретает преимущественного права.
        legal_base: "ст. 339.1 ГК РФ, ФЗ-102"
        severity: "critical"
        affected_party: "creditor"
        detection:
          positive_keywords:
            - "государственная регистрация ипотеки"
            - "регистрация в ЕГРН"
            - "закладная"
          context_patterns:
            - '(?i)ипотека.*подлежит.*государственной.*регистрации'
        conditional_checks:
          - trigger: "real_estate_pledge"
            keywords: ["ипотека", "залог недвижимости", "квартира", "земельный участок"]
            rule: "mortgage_registration_required"
            severity: "critical"

      - clause_id: "bankruptcy_risks_awareness"
        name: "Информирование о рисках оспаривания в банкротстве"
        risk_if_missing: |
          Обеспечительные сделки, заключенные в период подозрительности (до 6 месяцев до банкротства), могут быть оспорены и признаны недействительными.
        legal_base: "ст. 61.2, 61.3 ФЗ-127"
        severity: "critical"
        affected_party: "both"
        detection:
          positive_keywords:
            - "риски оспаривания в банкротстве"
            - "сделка с предпочтением"
            - "период подозрительности"
          context_patterns:
            - '(?i)стороны.*осведомлены.*о.*рисках.*оспаривания.*сделки.*в.*банкротстве'