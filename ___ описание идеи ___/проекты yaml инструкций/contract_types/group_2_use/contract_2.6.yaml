type: contract_2.6
name: Договор безвозмездного пользования (ссуды)
description: |
  Договор, по которому ссудодатель передает, а ссудополучатель принимает в безвозмездное временное пользование
  индивидуально-определенную вещь с обязательством вернуть ее в том же состоянии (с учетом нормального износа).
  Характеризуется: 1) полным отсутствием платы за пользование, 2) обязанностью ссудополучателя нести все расходы
  на содержание и ремонт, 3) особыми налоговыми рисками (внереализационный доход), 4) запретом на передачу
  аффилированным лицам в коммерческих организациях. Регулируется Главы 36 ГК РФ.
version: 2.1
parent: class_2_transfer_for_use
sibling_contracts:
  - contract_2.1 # Договор аренды (возмездная аренда)
  - contract_1.8 # Договор дарения (переход собственности)
  - contract_4.3 # Договор займа (денежная ссуда)

metadata:
  category: contract
  subcategory: use_transfer
  complexity: medium-high # Налоговые риски, ограничения для аффилированных лиц
  risk_level: high # Налоговые доначисления, риск признания ничтожным для аффилированных лиц
  legal_base: Глава 36 ГК РФ (ст. 689-701), НК РФ ст. 250
  hierarchy_position: "child_specialized_gratuitous"

# ════════════════════════════════════════════════════════════
# БАЗОВАЯ ИНФОРМАЦИЯ (LEGACY SECTIONS - ОПТИМИЗИРОВАНО)
# ════════════════════════════════════════════════════════════
rules:
  keywords:
    high:
      - "безвозмездное пользование"
      - "ссуда имущества"
      - "ссудодатель"
      - "ссудополучатель"
      - "бесплатно"
      - "вернуть ту же вещь"
    medium:
      - "нормальный износ"
      - "расходы на содержание"
      - "текущий и капитальный ремонт"
      - "риск случайной гибели"
      - "передать безвозмездно"
    low:
      - "оборудование"
      - "помещение"
      - "автомобиль"
      - "внереализационный доход"
      - "рыночная стоимость аренды"
      - "аффилированные лица"
      - "учредитель"
      - "директор"
  phrases:
    high:
      - передает вещь в безвозмездное временное пользование
      - обязуется вернуть вещь в том же состоянии с учетом нормального износа
      - Ссудополучатель несет все расходы на содержание и ремонт
      - договор является безвозмездным, плата за пользование не взимается
    medium:
      - риск случайной гибели переходит на Ссудополучателя при использовании не по назначению
      - Ссудодатель отвечает за недостатки, которые умышленно не оговорил
      - право на отказ от бессрочного договора с уведомлением за 1 месяц
  patterns:
    required:
      - (?i)(безвозмездн.*пользовани|ссуд.*имуществ|ссудодател|ссудополучател)
    optional:
      - (?i)(бесплатно|расходы.*на.*содержание|нормальн.*износ)
      - (?i)риск.*случайн.*гибели
  exclusions:
    - арендная плата
    - ежемесячный платеж
    - заем денежных средств (денежная ссуда — contract_4.3)
    - дарение (переход права собственности — contract_1.8)
  exclusion_logic:
    - condition: "payment_obligation_present"
      target: "reclassify_to_contract_2.1"
      confidence: 0.95
      description: "При наличии платы за пользование — это договор аренды"
    - condition: "money_as_subject"
      target: "reclassify_to_contract_4.3"
      confidence: 0.90
      description: "Если предмет — денежные средства, это договор займа"
    - condition: "ownership_transfer"
      target: "reclassify_to_contract_1.8"
      confidence: 0.90
      description: "Если предусмотрен переход права собственности — это дарение"
  weights:
    keyword_high: 4.0
    keyword_medium: 1.5
    keyword_low: 0.5
    phrase_high: 4.5
    phrase_medium: 1.5
    pattern_required: 5.0
    pattern_optional: 1.0
  classification:
    min_confidence: 0.85
    max_matches: 3

party_roles:
  - Ссудодатель (Lender) — собственник вещи или управомоченное лицо
  - Ссудополучатель (Borrower) — сторона, принимающая вещь в безвозмездное пользование

essential_terms:
  - Предмет (индивидуально-определенная непотребляемая вещь)
  - Явное указание на безвозмездный характер (отсутствие платы)
  - Срок пользования (или указание на бессрочность)

specific_risks:
  - Налоговые доначисления ссудополучателю (налог на прибыль с рыночной стоимости аренды — ст. 250 НК РФ)
  - Признание договора ничтожным при передаче учредителю/руководителю коммерческой организации (ст. 690 ГК РФ)
  - Ответственность за случайную гибель при использовании не по назначению (ст. 696 ГК РФ)
  - Обязанность ссудополучателя нести все расходы на содержание и ремонт (текущий и капитальный)
  - Налоговые риски признания необоснованной налоговой выгоды при передаче между взаимозависимыми лицами

aliases:
  - Договор ссуды имущества
  - Соглашение о бесплатном пользовании
  - Free Loan Agreement
  - Безвозмездное пользование

section_markers:
  - Предмет ссуды (имущество, его индивидуальные признаки)
  - Срок пользования (определенный или бессрочный)
  - Права и обязанности сторон
  - Расходы на содержание и ремонт
  - Риск случайной гибели или повреждения
  - Ответственность за недостатки вещи
  - Порядок досрочного расторжения и возврата имущества
  - Заключительные положения

notes: |
  КРИТИЧЕСКИЕ ОСОБЕННОСТИ ССУДЫ (Глава 36 ГК РФ):
  1. НАЛОГОВЫЕ РИСКИ: Для ссудополучателя-организации безвозмездное пользование образует внереализационный доход,
     облагаемый налогом на прибыль по рыночной стоимости аренды аналогичного имущества (ст. 250 НК РФ)
  
  2. ЗАПРЕТ ДЛЯ АФФИЛИРОВАННЫХ ЛИЦ: Коммерческая организация не вправе передавать имущество в ссуду
     своему учредителю, руководителю, члену органов управления (ст. 690 п. 2 ГК РФ) — договор ничтожен
  
  3. РАСПРЕДЕЛЕНИЕ РАСХОДОВ: Ссудополучатель обязан нести ВСЕ расходы на содержание вещи, включая
     текущий И капитальный ремонт (ст. 695 ГК РФ) — отличие от аренды
  
  4. РИСК СЛУЧАЙНОЙ ГИБЕЛИ: По умолчанию — на ссудодателе, но переходит на ссудополучателя, если
     вещь использовалась не по назначению или передана третьему лицу (ст. 696 ГК РФ)
  
  ПРАВИЛА АРЕНДЫ, ПРИМЕНЯЕМЫЕ СУБСИДИАРНО: ст. 607, 610, 615, 621, 623 ГК РФ

# ════════════════════════════════════════════════════════════
# 🆕 ВАЛИДАЦИОННЫЕ СЕКЦИИ (VALIDATION ENGINE v2.0)
# ════════════════════════════════════════════════════════════

validation_metadata:
  validation_version: "2.1"
  last_updated: "2026-02-07"
  author: "Legal AI Team"
  
  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 1: ПРИМЕНИМОЕ ЗАКОНОДАТЕЛЬСТВО
  # ──────────────────────────────────────────────────────────
  legal_base:
    primary:
      - "Глава 36 ГК РФ (ст. 689-701) — Безвозмездное пользование"
    secondary:
      - "Налоговый кодекс РФ ст. 250 п. 8 (Внереализационные доходы)"
      - "Налоговый кодекс РФ ст. 54.1 (Недопустимость злоупотребления правом)"
      - "Информационное письмо Президиума ВАС РФ № 66 от 11.01.2002 (применение правил аренды к ссуде)"
    related:
      - "Глава 34 ГК РФ (ст. 607, 610, 615, 621, 623) — применяются субсидиарно"
      - "Глава 42 ГК РФ (Договор займа) — для разграничения с денежной ссудой"

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 2: ОБЯЗАТЕЛЬНЫЕ ЭЛЕМЕНТЫ ДОГОВОРА
  # ──────────────────────────────────────────────────────────
  essential_elements:
    - element: "loan_subject_identification"
      name: "Идентификация предмета ссуды"
      required: true
      legal_base: "ст. 689, 607 ГК РФ"
      risk_msg: |
        Недостаточная индивидуализация вещи (отсутствие уникальных признаков) делает договор незаключенным.
        Особенно критично для дорогостоящего оборудования, транспортных средств, недвижимости. Также важно
        для разрешения споров о состоянии при возврате.
      validation_rules:
        - "presence_check"
        - "definiteness_check"
        - "unique_identifiers_if_available"
        - "technical_state_description"
    
    - element: "gratuitous_nature_explicit"
      name: "Явное указание на безвозмездный характер"
      required: true
      legal_base: "ст. 689 ГК РФ"
      risk_msg: |
        Отсутствие явного указания на безвозмездность может привести к переквалификации договора в аренду
        с применением норм о возмездности и налоговых последствий (НДС, налог на прибыль). Также создает
        риск споров о наличии скрытой платы.
      validation_rules:
        - "presence_check"
        - "gratuitous_keywords_present"
        - "no_payment_provisions"
        - "explicit_free_use_declaration"
    
    - element: "term_of_gratuitous_use"
      name: "Срок безвозмездного пользования"
      required: false
      legal_base: "ст. 610, 692 ГК РФ"
      description: "Если срок не указан, договор считается заключенным на неопределенный срок (бессрочным)"
      risk_msg: |
        Бессрочный договор дает ссудополучателю право пользоваться имуществом неограниченно долго, а
        ссудодателю усложняет возврат (требуется уведомление за 1 месяц). Для коммерческих отношений
        неопределенность срока создает значительные риски.
      validation_rules:
        - "term_clarity_if_present"
        - "start_end_date_consistency"

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 3: ЗАЩИТНЫЕ УСЛОВИЯ (PROTECTIVE CLAUSES)
  # ──────────────────────────────────────────────────────────

  protective_clauses:
    
    # --- ЗАЩИТА ССУДОДАТЕЛЯ (Lender Protection) ---
    seller_protection:
      - clause_id: "maintenance_and_repair_obligation"
        name: "Обязанность по содержанию и всем видам ремонта"
        risk_if_missing: |
          По ст. 695 ГК РФ ссудополучатель обязан нести ВСЕ расходы на содержание вещи, включая текущий
          и капитальный ремонт. Если договор перекладывает эти расходы на ссудодателя или не упоминает
          о них, ссудодатель понесет непредвиденные затраты.
        legal_base: "ст. 695 ГК РФ"
        severity: "high"
        affected_party: "seller"
        detection:
          positive_keywords:
            - "текущий и капитальный ремонт"
            - "несет все расходы на содержание"
            - "поддерживать в исправном состоянии"
            - "эксплуатационные расходы"
            - "обязанность по ремонту"
          context_patterns:
            - '(?i)ссудополучатель.*обязуется.*осуществлять.*текущий.*и.*капитальный.*ремонт'
            - '(?i)все.*расходы.*по.*содержанию.*имущества.*несет.*ссудополучатель'
      
      - clause_id: "risk_of_loss_transfer"
        name: "Переход риска случайной гибели при нарушении"
        risk_if_missing: |
          По умолчанию риск случайной гибели несет ссудодатель, но он переходит на ссудополучателя,
          если тот использовал вещь не по назначению или передал третьему лицу без согласия (ст. 696 ГК РФ).
          Без явного условия о таком переходе риска ссудодатель может потерять имущество без компенсации.
        legal_base: "ст. 696 ГК РФ"
        severity: "high"
        affected_party: "seller"
        detection:
          positive_keywords:
            - "риск случайной гибели"
            - "несет ссудополучатель при использовании не по назначению"
            - "передача третьим лицам запрещена"
            - "ответственность за гибель"
            - "использование только по назначению"
          context_patterns:
            - '(?i)риск.*случайной.*гибели.*переходит.*на.*ссудополучателя.*если.*вещь.*использовалась.*не.*по.*назначению'
            - '(?i)при.*передаче.*третьим.*лицам.*без.*согласия.*ссудополучатель.*несет.*риск.*гибели'
      
      - clause_id: "unauthorized_transfer_prohibition"
        name: "Запрет на передачу третьим лицам"
        risk_if_missing: |
          Ссудополучатель может передать имущество субпользователю без ведома ссудодателя, что увеличивает
          риски повреждения, утраты, несанкционированного использования. Явный запрет усиливает защиту
          и служит основанием для перехода риска случайной гибели.
        legal_base: "ст. 695, 696 ГК РФ"
        severity: "medium"
        affected_party: "seller"
        detection:
          positive_keywords:
            - "запрет передачи третьим лицам"
            - "без согласия ссудодателя"
            - "только личное использование"
            - "запрет субпользования"
            - "санкции за нарушение запрета"
          context_patterns:
            - '(?i)ссудополучатель.*не.*вправе.*передавать.*имущество.*третьим.*лицам.*без.*письменного.*согласия'
    
    # --- ЗАЩИТА ССУДОПОЛУЧАТЕЛЯ (Borrower Protection) ---
    buyer_protection:
      - clause_id: "termination_notice_right"
        name: "Право на отказ от бессрочного договора"
        risk_if_missing: |
          При бессрочном договоре любая сторона вправе отказаться, предупредив за 1 месяц (ст. 699 ГК РФ).
          Если этот срок не указан или установлен длиннее, ссудополучатель может быть вынужден пользоваться
          имуществом дольше необходимого или нести необоснованные расходы на содержание.
        legal_base: "ст. 699 ГК РФ"
        severity: "medium"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "отказаться от договора"
            - "предупредив за 1 месяц"
            - "в любое время"
            - "уведомление о расторжении"
            - "срок уведомления"
          context_patterns:
            - '(?i)каждая.*из.*сторон.*вправе.*отказаться.*от.*договора.*предупредив.*об.*этом.*за.*1.*месяц'
      
      - clause_id: "defects_responsibility_clause"
        name: "Ответственность ссудодателя за недостатки"
        risk_if_missing: |
          Ссудодатель отвечает за недостатки вещи, которые он умышленно или по грубой неосторожности
          не оговорил (ст. 693 ГК РФ). Без явного условия ссудополучатель может не получить компенсацию
          за убытки, вызванные скрытыми дефектами, или будет вынужден доказывать умысел ссудодателя.
        legal_base: "ст. 693 ГК РФ"
        severity: "medium"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "отвечает за недостатки"
            - "скрытые недостатки"
            - "умышленно не оговорил"
            - "грубая неосторожность"
            - "возместить реальный ущерб"
            - "недостатки, о которых не предупредил"
          context_patterns:
            - '(?i)ссудодатель.*отвечает.*за.*недостатки.*вещи.*которые.*умышленно.*или.*по.*грубой.*неосторожности.*не.*оговорены'
      
      - clause_id: "normal_wear_and_tear_protection"
        name: "Защита от претензий по нормальному износу"
        risk_if_missing: |
          Ссудодатель может предъявить претензии по естественному износу имущества от эксплуатации,
          требуя возмещения. Без явного указания, что нормальный износ не является основанием для
          ответственности, ссудополучатель рискует компенсировать стоимость "устаревшего" имущества.
        legal_base: "ст. 689 ГК РФ"
        severity: "medium"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "нормальный износ"
            - "естественный износ"
            - "не является основанием для ответственности"
            - "возникающий при правильной эксплуатации"
            - "не подлежит возмещению"
          context_patterns:
            - '(?i)ссудополучатель.*не.*несет.*ответственности.*за.*нормальный.*износ.*имущества'

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 4: ДОПОЛНИТЕЛЬНЫЕ PROTECTIVE CLAUSES (СПЕЦИФИКА ССУДЫ)
  # ──────────────────────────────────────────────────────────
  additional_protective_clauses:
    
    # Налоговые риски (критически важно для организаций)
    buyer_protection:
      - clause_id: "tax_consequences_warning"
        name: "Предупреждение о налоговых последствиях"
        risk_if_missing: |
          Для ссудополучателя-организации безвозмездное пользование образует внереализационный доход,
          облагаемый налогом на прибыль по рыночной стоимости аренды аналогичного имущества (п. 8 ст. 250 НК РФ).
          Отсутствие предупреждения может привести к неожиданным налоговым доначислениям, пеням и штрафам.
        legal_base: "НК РФ ст. 250 п. 8"
        severity: "critical"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "налоговые последствия"
            - "внереализационный доход"
            - "рыночная стоимость аренды"
            - "обязанность исчислить налог"
            - "ссудополучатель осведомлен о налоговых обязательствах"
          context_patterns:
            - '(?i)ссудополучатель.*признает.*что.*безвозмездное.*пользование.*образует.*внереализационный.*доход'
            - '(?i)стороны.*осведомлены.*о.*необходимости.*исчисления.*налога.*на.*прибыль.*с.*рыночной.*стоимости.*аренды'
        conditional_checks:
          - trigger: "corporate_borrower"
            keywords: ["ООО", "АО", "ЗАО", "юридическое лицо", "организация"]
            rule: "tax_warning_required"
            severity: "critical"
    
    # Для ссуды между взаимозависимыми лицами
    buyer_seller_protection:
      - clause_id: "related_party_transfer_risks"
        name: "Риски передачи между взаимозависимыми лицами"
        risk_if_missing: |
          При передаче между аффилированными компаниями или родственниками налоговики могут оспорить
          безвозмездность и доначислить налоги. Также высок риск признания сделки недействительной
          по ст. 690 п. 2 ГК РФ (передача учредителю/руководителю).
        legal_base: "ст. 690 п. 2 ГК РФ, ст. 54.1 НК РФ"
        severity: "critical"
        affected_party: "both"
        detection:
          positive_keywords:
            - "аффилированные лица"
            - "взаимозависимые лица"
            - "группа компаний"
            - "родственные отношения"
            - "экономическое обоснование"
            - "деловая цель"
          context_patterns:
            - '(?i)передача.*осуществляется.*между.*взаимозависимыми.*лицами.*в.*рамках.*деловой.*цели'
        conditional_checks:
          - trigger: "related_parties"
            keywords: ["аффилированные", "взаимозависимые", "группа компаний", "родственники"]
            rule: "business_justification_required"
            legal_base: "ст. 54.1 НК РФ"
            severity: "critical"
    
    # Порядок возврата имущества
    buyer_seller_protection:
      - clause_id: "return_procedure_detailed"
        name: "Детальная процедура возврата имущества"
        risk_if_missing: |
          При возврате возникают споры о состоянии, комплектности, наличии повреждений. Без четкой процедуры
          с участием комиссии, составлением акта, фотофиксацией разрешение споров становится затруднительным,
          ведет к судебным разбирательствам о возмещении ущерба.
        legal_base: "ст. 689, 692 ГК РФ"
        severity: "medium"
        affected_party: "both"
        detection:
          positive_keywords:
            - "порядок возврата имущества"
            - "акт возврата"
            - "комиссия по приемке"
            - "фотофиксация состояния"
            - "срок возврата"
            - "место возврата"
            - "комплектность"
          context_patterns:
            - '(?i)возврат.*имущества.*оформляется.*двусторонним.*актом.*с.*описанием.*технического.*состояния'
            - '(?i)при.*возврате.*создается.*комиссия.*из.*представителей.*сторон.*для.*оценки.*состояния'
    
    # Право на улучшения
    buyer_protection:
      - clause_id: "improvements_compensation_right"
        name: "Право на компенсацию произведенных улучшений"
        risk_if_missing: |
          Ссудополучатель может произвести неотделимые улучшения (ремонт, модернизация), повышающие
          стоимость имущества. Без условия о компенсации эти затраты не возмещаются, что создает
          неосновательное обогащение ссудодателя. По аналогии применяется ст. 623 ГК РФ.
        legal_base: "ст. 623 ГК РФ (по аналогии)"
        severity: "medium"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "компенсация улучшений"
            - "неотделимые улучшения"
            - "возмещение затрат"
            - "с согласия ссудодателя"
            - "стоимость улучшений"
            - "право на отделимые улучшения"
          context_patterns:
            - '(?i)произведенные.*ссудополучателем.*неотделимые.*улучшения.*подлежат.*компенсации.*при.*наличии.*согласия.*ссудодателя'