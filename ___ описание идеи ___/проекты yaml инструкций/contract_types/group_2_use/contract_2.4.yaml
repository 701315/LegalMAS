type: contract_2.4
name: Договор лизинга (финансовой аренды)
description: |
  Трехсторонняя финансовая сделка, при которой лизингодатель (финансовая компания) приобретает у продавца имущество,
  выбранное лизингополучателем, и предоставляет его последнему за плату во временное владение и пользование для 
  предпринимательских целей с правом последующего выкупа. Характеризуется: выбором продавца лизингополучателем, 
  переходом рисков с момента приемки, целью выкупа имущества. Земля и природные объекты не могут быть предметом лизинга.
  Регулируется § 6 Главы 34 ГК РФ и Федеральным законом от 29.10.1998 № 164-ФЗ «О финансовой аренде (лизинге)».
version: 2.1
parent: class_2_transfer_for_use
sibling_contracts:
  - contract_2.1 # Договор аренды (общая коммерческая)
  - contract_2.3 # Договор аренды транспортного средства
  - contract_1.1 # Договор купли-продажи

metadata:
  category: contract
  subcategory: use_transfer
  complexity: high # Трехсторонняя конструкция, финансовые графики, налогообложение
  risk_level: high # Риск изъятия предмета при просрочке, риск гибели имущества, кредитные риски
  legal_base: § 6 Главы 34 ГК РФ (ст. 665-670), ФЗ № 164-ФЗ «О финансовой аренде (лизинге)»
  hierarchy_position: "child_complex_financial"

# ════════════════════════════════════════════════════════════
# БАЗОВАЯ ИНФОРМАЦИЯ (LEGACY SECTIONS - ОПТИМИЗИРОВАНО)
# ════════════════════════════════════════════════════════════
rules:
  keywords:
    high:
      - "лизинг"
      - "финансовая аренда"
      - "лизингодатель"
      - "лизингополучатель"
      - "продавец"
      - "выкупная цена"
      - "выбор продавца"
    medium:
      - "предмет лизинга"
      - "график лизинговых платежей"
      - "балансодержатель"
      - "ускоренная амортизация"
      - "авансовый платеж"
      - "лизинговые платежи"
      - "остаточная стоимость"
    low:
      - "страхование КАСКО"
      - "изъятие предмета"
      - "бесспорное списание"
      - "исполнительная надпись"
      - "сублизинг"
      - "возвратный лизинг"
  phrases:
    high:
      - Лизингодатель обязуется приобрести в собственность указанное имущество у определенного Продавца
      - предоставить имущество Лизингополучателю за плату во временное владение и пользование
      - риск случайной гибели переходит к Лизингополучателю в момент передачи
      - право выкупа предмета лизинга по окончании срока
      - Лизингодатель не отвечает за недостатки товара, если продавца выбрал Лизингополучатель
    medium:
      - предмет лизинга передается Продавцом непосредственно Лизингополучателю
      - обязанность по страхованию предмета лизинга
      - лизинговые платежи включают возмещение затрат и доход Лизингодателя
      - возможность бесспорного списания долга при просрочке
      - изъятие предмета лизинга при неоднократной просрочке
  patterns:
    required:
      - (?i)(лизинг|финансов.*аренд|лизингодател|лизингополучател)
    optional:
      - (?i)(выкуп.*цен|график.*платеж|балансодержател|ускорен.*амортизац)
      - (?i)бесспорн.*списан
      - (?i)исполнительн.*надпис
  exclusions:
    - аренда с правом выкупа (без элемента покупки специально для арендатора)
    - прокат (бытовая аренда)
    - аренда земельных участков (земля не может быть предметом лизинга - ст. 666 ГК РФ)
    - купля-продажа в рассрочку (без временного пользования)
  exclusion_logic:
    - condition: "no_purchase_obligation"
      target: "reclassify_to_contract_2.1"
      confidence: 0.85
      description: "Если лизингодатель не обязуется приобрести имущество у продавца — это обычная аренда"
    - condition: "consumer_purpose"
      target: "reclassify_to_prokat_or_general_lease"
      confidence: 0.90
      description: "Лизинг возможен только для предпринимательских целей (ст. 665 ГК РФ)"
    - condition: "land_as_subject"
      target: "critical_warning_illegal_subject"
      confidence: 0.95
      description: "Земельные участки не могут быть предметом лизинга (ст. 666 ГК РФ)"
  weights:
    keyword_high: 4.0
    keyword_medium: 1.5
    keyword_low: 0.5
    phrase_high: 4.5
    phrase_medium: 1.5
    pattern_required: 5.0
    pattern_optional: 1.0
  classification:
    min_confidence: 0.85
    max_matches: 3

party_roles:
  - Лизингодатель (Lessor) — лизинговая компания, банк, финансовая организация
  - Лизингополучатель (Lessee) — предприниматель или юридическое лицо, пользователь имущества
  - Продавец (Vendor) — поставщик оборудования/ТС, выбранный Лизингополучателем

essential_terms:
  - Предмет лизинга (имущество, его детальные характеристики)
  - Продавец (кто выбран и кем выбрал)
  - Общая сумма лизинговых платежей и график выплат
  - Срок договора лизинга
  - Выкупная стоимость или порядок ее определения (при лизинге с выкупом)

specific_risks:
  - Безакцептное списание денег со счета при просрочке платежей
  - Изъятие предмета без суда (по исполнительной надписи нотариуса)
  - Гибель предмета: обязанность выплатить все платежи даже при отсутствии имущества (нестраховой случай)
  - Кредитный риск лизингодателя (неплатежеспособность лизингополучателя)
  - Налоговые риски (учет лизинговых платежей, НДС, амортизация)
  - Риск получения некачественного имущества и сложности в предъявлении претензий

aliases:
  - Лизинговый контракт
  - Соглашение о финансовой аренде
  - Лизинг с правом выкупа
  - Leasing Agreement
  - Финансовая аренда

section_markers:
  - Предмет лизинга (детальное описание имущества)
  - Выбор Продавца и предмета (кто выбирал)
  - Передача и приемка (момент перехода рисков)
  - Лизинговые платежи (график, валюта, аванс)
  - Выкупная стоимость и переход права собственности
  - Страхование предмета лизинга
  - Балансовый учет (балансодержатель)
  - Ответственность сторон
  - Бесспорное взыскание и изъятие
  - Заключительные положения
  - Приложения (график платежей, спецификация)

notes: |
  ОСОБЕННОСТИ ЛИЗИНГА:
  1. Земля и природные объекты НЕ могут быть предметом лизинга (ст. 666 ГК РФ)
  2. Лизингодатель обычно не отвечает за качество предмета лизинга (ст. 670 ГК РФ)
  3. Лизингополучатель вправе предъявлять требования к Продавцу напрямую
  4. Риск случайной гибели переходит на Лизингополучателя с момента приемки
  5. Возможность ускоренной амортизации с коэффициентом до 3
  6. Лизинговые платежи включают возмещение затрат Лизингодателя и его доход
  
  ПРАКТИЧЕСКИЕ РИСКИ:
  - Исполнительная надпись нотариуса для бесспорного взыскания
  - Изъятие предмета при просрочке платежей
  - Налоговая переквалификация при символической выкупной цене
  - Регистрационные вопросы (для ТС, недвижимости)

