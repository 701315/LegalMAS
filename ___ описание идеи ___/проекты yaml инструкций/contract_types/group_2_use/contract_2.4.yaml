validation_metadata:
  validation_version: "2.1"
  last_updated: "2026-02-07"
  author: "Legal AI Team"
  
  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 1: ПРИМЕНИМОЕ ЗАКОНОДАТЕЛЬСТВО
  # ──────────────────────────────────────────────────────────
  legal_base:
    primary:
      - "§ 6 Главы 34 ГК РФ (ст. 665-670) — Финансовая аренда (лизинг)"
      - "Федеральный закон от 29.10.1998 № 164-ФЗ «О финансовой аренде (лизинге)»"
    secondary:
      - "Налоговый кодекс РФ (особенно ст. 258 — амортизация, ст. 172 — НДС)"
      - "Постановление Пленума ВАС РФ № 17 от 14.03.2014 (сальдо встречных обязательств)"
      - "Основы законодательства РФ о нотариате (исполнительная надпись)"
    related:
      - "Гражданский кодекс РФ § 1 Главы 34 (Общие положения об аренде) — субсидиарно"
      - "Федеральный закон от 02.12.1990 № 395-1 «О банках и банковской деятельности»"
      - "Приказы МВД России о регистрации транспортных средств"

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 2: ОБЯЗАТЕЛЬНЫЕ ЭЛЕМЕНТЫ ДОГОВОРА
  # ──────────────────────────────────────────────────────────
  essential_elements:
    - element: "parties_and_vendor_specification"
      name: "Стороны и конкретизация Продавца"
      required: true
      legal_base: "ст. 665 ГК РФ"
      risk_msg: |
        Отсутствие указания на конкретного Продавца или нечеткая его идентификация лишает лизингодателя 
        возможности исполнить обязательство по приобретению, а лизингополучателя — предъявлять требования по качеству.
        Также критично для определения ответственности за выбор Продавца.
      validation_rules:
        - "presence_check"
        - "vendor_specification_check"
        - "who_chose_vendor_specified"
    
    - element: "leasing_subject_detailed"
      name: "Предмет лизинга (детальная спецификация)"
      required: true
      legal_base: "ст. 666 ГК РФ"
      risk_msg: |
        Недостаточная индивидуализация предмета лизинга делает договор незаключенным. Особенно критично для 
        дорогостоящего оборудования, недвижимости, транспортных средств. Также важно для налогообложения 
        и правильного учета на балансе.
      validation_rules:
        - "presence_check"
        - "definiteness_check"
        - "technical_specifications_present"
        - "value_specified"
    
    - element: "leasing_payments_structure"
      name: "Структура лизинговых платежей и график"
      required: true
      legal_base: "ст. 28 ФЗ № 164-ФЗ"
      risk_msg: |
        Нечеткая структура платежей приводит к спорам об их составе (амортизация, проценты, маржа), что критично 
        для налогообложения и бухгалтерского учета. Отсутствие графика платежей создает неопределенность 
        в обязательствах сторон.
      validation_rules:
        - "presence_check"
        - "schedule_link_check"
        - "total_amount_calculable"
        - "currency_specified"
        - "advance_payment_specified"
    
    - element: "purchase_option_clear_terms"
      name: "Условия опциона на выкуп (при наличии)"
      required: false
      legal_base: "ст. 19, 31 ФЗ № 164-ФЗ"
      description: "Лизинг может быть с правом или без права выкупа. При наличии выкупа — условия обязательны"
      risk_msg: |
        Неопределенность выкупной цены или процедуры выкупа дает Лизингодателю возможность требовать рыночную цену 
        по окончании срока. Символическая цена (1 рубль) без надлежащего оформления может привести к налоговой 
        переквалификации сделки.
      validation_rules:
        - "option_terms_clear_if_present"
        - "purchase_price_specified"
        - "option_exercise_procedure"
      conditional_checks:
        - trigger: "purchase_option_keywords"
          keywords: ["выкуп", "переход права собственности", "остаточная стоимость", "номинальная стоимость", "выкупная цена"]
          rule: "purchase_terms_required"
          legal_base: "ст. 19 ФЗ № 164-ФЗ"
          severity: "critical"

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 3: ЗАЩИТНЫЕ УСЛОВИЯ (PROTECTIVE CLAUSES)
  # ──────────────────────────────────────────────────────────

  protective_clauses:
    
    # --- ЗАЩИТА ЛИЗИНГОПОЛУЧАТЕЛЯ (Lessee Protection) ---
    buyer_protection:
      - clause_id: "vendor_selection_responsibility"
        name: "Определение ответственности за выбор Продавца"
        risk_if_missing: |
          По умолчанию (ст. 670 ГК РФ) Лизингодатель НЕ отвечает за недостатки товара, если продавца выбрал 
          Лизингополучатель. Однако если продавца выбрал сам Лизингодатель (например, в автосалоне-партнере), 
          он несет солидарную ответственность. Неопределенность приводит к спорам при обнаружении недостатков.
        legal_base: "ст. 670 ГК РФ"
        severity: "high"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "выбор продавца осуществлен лизингодателем"
            - "солидарная ответственность лизингодателя"
            - "лизингодатель отвечает за качество"
            - "лизингополучатель выбрал продавца самостоятельно"
            - "ответственность за выбор"
          context_patterns:
            - '(?i)выбор.*продавца.*осуществлен.*лизингополучателем.*самостоятельно'
            - '(?i)лизингодатель.*отвечает.*за.*качество.*только.*если.*выбрал.*продавца'
        conditional_checks:
          - trigger: "lessor_chose_vendor"
            keywords: ["лизингодатель рекомендовал", "лизингодатель выбрал", "партнер лизингодателя"]
            rule: "solidary_liability_clause_required"
            severity: "high"
      
      - clause_id: "buyout_price_definition"
        name: "Четкое определение выкупной цены"
        risk_if_missing: |
          Если выкупная цена символическая (1 рубль) или включена в лизинговые платежи, но это не прописано явно, 
          налоговая может переквалифицировать сделку в куплю-продажу с рассрочкой платежа. Если цена не определена, 
          Лизингодатель может потребовать рыночную стоимость в конце срока.
        legal_base: "Постановление Пленума ВАС РФ № 17"
        severity: "critical"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "выкупная стоимость"
            - "остаточная стоимость"
            - "номинальная стоимость"
            - "переходит в собственность при условии выплаты"
            - "включена в лизинговые платежи"
            - "символическая плата"
          context_patterns:
            - '(?i)выкупная.*стоимость.*составляет.*[0-9]+.*рубл'
            - '(?i)по.*окончании.*срока.*лизинга.*право.*собственности.*переходит.*при.*условии.*выплаты'
      
      - clause_id: "balance_holder_specification"
        name: "Определение балансодержателя"
        risk_if_missing: |
          От того, на чьем балансе учитывается имущество, зависит налог на имущество и порядок начисления амортизации.
          Если не прописать — по умолчанию имущество учитывается на балансе Лизингодателя. Это может быть невыгодно 
          Лизингополучателю, желающему применять ускоренную амортизацию.
        legal_base: "ст. 31 ФЗ № 164-ФЗ"
        severity: "medium"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "учитывается на балансе"
            - "балансодержатель"
            - "на балансе лизингополучателя"
            - "на балансе лизингодателя"
            - "передача на баланс"
          context_patterns:
            - '(?i)предмет.*лизинга.*учитывается.*на.*балансе.*лизингополучателя'
            - '(?i)лизингополучатель.*является.*балансодержателем'
    
    # --- ЗАЩИТА ЛИЗИНГОДАТЕЛЯ (Lessor Protection) ---
    seller_protection:
      - clause_id: "risk_transfer_moment"
        name: "Момент перехода риска случайной гибели"
        risk_if_missing: |
          В лизинге риск случайной гибели переходит к Лизингополучателю в момент передачи вещи (ст. 669 ГК РФ).
          Если момент передачи не зафиксирован Актом, возникают споры. При гибели имущества Лизингополучатель 
          обязан продолжать платить или погасить остаток сразу, что должно быть явно оговорено.
        legal_base: "ст. 669 ГК РФ"
        severity: "high"
        affected_party: "seller"
        detection:
          positive_keywords:
            - "риск случайной гибели"
            - "несет лизингополучатель"
            - "с момента подписания акта приема-передачи"
            - "обязанность платить при гибели"
            - "не освобождает от платежей"
          context_patterns:
            - '(?i)риск.*случайной.*гибели.*переходит.*к.*лизингополучателю.*с.*момента.*подписания.*акта'
            - '(?i)гибель.*предмета.*лизинга.*не.*освобождает.*от.*обязанности.*по.*уплате.*платежей'
      
      - clause_id: "insurance_requirement_detailed"
        name: "Детальные требования к страхованию"
        risk_if_missing: |
          Учитывая переход рисков на Лизингополучателя, предмет должен быть застрахован (КАСКО, имущественное страхование).
          Выгодоприобретателем должен назначаться Лизингодатель (в части долга) и/или Лизингополучатель. 
          Отсутствие страхования ставит под угрозу возврат инвестиций.
        legal_base: "ст. 21 ФЗ № 164-ФЗ"
        severity: "critical"
        affected_party: "seller"
        detection:
          positive_keywords:
            - "обязанность застраховать"
            - "предмет лизинга подлежит страхованию"
            - "КАСКО"
            - "имущественное страхование"
            - "выгодоприобретатель — лизингодатель"
            - "страховая сумма не ниже остаточной стоимости"
            - "копия полиса"
          context_patterns:
            - '(?i)лизингополучатель.*обязуется.*застраховать.*предмет.*лизинга.*на.*случай'
            - '(?i)выгодоприобретателем.*по.*страхованию.*является.*лизингодатель'
      
      - clause_id: "uncontested_recovery_right"
        name: "Право на бесспорное списание и изъятие"
        risk_if_missing: |
          Лизингодатель лишается важного инструмента защиты — права списывать просроченные платежи инкассо 
          (без суда) и изымать технику при неоднократной просрочке. Это стандартная защита интересов инвестора 
          в лизинговой сделке.
        legal_base: "ст. 13 ФЗ № 164-ФЗ, Основы законодательства о нотариате"
        severity: "high"
        affected_party: "seller"
        detection:
          positive_keywords:
            - "бесспорное списание"
            - "без акцепта"
            - "исполнительная надпись нотариуса"
            - "изъятие предмета лизинга"
            - "при просрочке более"
            - "инкассовое поручение"
            - "право на одностороннее расторжение"
          context_patterns:
            - '(?i)лизингодатель.*вправе.*списать.*долг.*в.*бесспорном.*порядке'
            - '(?i)при.*просрочке.*более.*[0-9]+.*дней.*лизингодатель.*вправе.*изъять.*предмет'

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 4: ДОПОЛНИТЕЛЬНЫЕ PROTECTIVE CLAUSES (СПЕЦИФИКА ЛИЗИНГА)
  # ──────────────────────────────────────────────────────────
  additional_protective_clauses:
    
    # Налоговые аспекты и амортизация
    buyer_seller_protection:
      - clause_id: "tax_and_depreciation_clarity"
        name: "Ясность налоговых последствий и амортизации"
        risk_if_missing: |
          Налоговые риски лизинга сложны: учет лизинговых платежей, вычет НДС, применение ускоренной амортизации.
          Неясность приводит к налоговым доначислениям, спорам с налоговыми органами, двойному налогообложению.
          Особенно важно при ускоренной амортизации с коэффициентом до 3.
        legal_base: "НК РФ ст. 172, 258, 259; ст. 31 ФЗ № 164-ФЗ"
        severity: "high"
        affected_party: "both"
        detection:
          positive_keywords:
            - "ускоренная амортизация"
            - "коэффициент ускорения"
            - "налоговые последствия"
            - "НДС по лизинговым платежам"
            - "вычет НДС"
            - "лизинговые платежи относятся на расходы"
            - "счет-фактура на лизинговые платежи"
          context_patterns:
            - '(?i)лизингополучатель.*вправе.*применять.*ускоренную.*амортизацию.*с.*коэффициентом'
            - '(?i)лизинговые.*платежи.*включают.*НДС.*который.*предъявляется.*к.*вычету'
    
    # Регистрационные вопросы для ТС и недвижимости
    seller_protection:
      - clause_id: "registration_procedure"
        name: "Порядок регистрации предмета (ГИБДД, Росреестр)"
        risk_if_missing: |
          ТС можно зарегистрировать на Лизингодателя или Лизингополучателя (временно). Штрафы с камер придут тому, 
          на кого зарегистрировано. Лизингодателю часто выгодна регистрация на Лизингополучателя, чтобы избежать 
          административной ответственности. Для недвижимости требуется регистрация обременения.
        legal_base: "Приказы МВД о регистрации ТС, ФЗ № 218-ФЗ о регистрации недвижимости"
        severity: "medium"
        affected_party: "seller"
        detection:
          positive_keywords:
            - "регистрация в органах ГИБДД"
            - "временный учет"
            - "на имя лизингополучателя"
            - "регистрация в Росреестре"
            - "обременение права"
            - "расходы на регистрацию"
            - "штрафы за нарушение ПДД"
          context_patterns:
            - '(?i)транспортное.*средство.*регистрируется.*на.*имя.*лизингополучателя'
            - '(?i)расходы.*по.*регистрации.*несет.*лизингополучатель'
        conditional_checks:
          - trigger: "vehicle_leasing"
            keywords: ["автомобиль", "транспортное средство", "ТС", "спецтехника"]
            rule: "registration_clause_recommended"
            severity: "medium"
    
    # Защита от банкротства контрагента
    buyer_seller_protection:
      - clause_id: "bankruptcy_protection_mechanisms"
        name: "Механизмы защиты на случай банкротства"
        risk_if_missing: |
          При банкротстве Лизингополучателя имущество может быть включено в конкурсную массу. При банкротстве 
          Лизингодателя — проблемы с переходом права собственности при выкупе. Специальные условия защищают 
          интересы сторон и обеспечивают изъятие имущества из конкурсной массы.
        legal_base: "ФЗ № 127-ФЗ «О несостоятельности (банкротстве)»"
        severity: "medium"
        affected_party: "both"
        detection:
          positive_keywords:
            - "последствия банкротства"
            - "не включается в конкурсную массу"
            - "право на изъятие при банкротстве"
            - "обеспечение обязательств"
            - "досрочное расторжение при банкротстве"
            - "конкурсный управляющий"
          context_patterns:
            - '(?i)в.*случае.*банкротства.*лизингополучателя.*лизингодатель.*вправе.*изъять.*предмет.*лизинга'
            - '(?i)предмет.*лизинга.*не.*является.*составом.*конкурсной.*массы.*лизингополучателя'
    
    # Для международного лизинга
    seller_protection:
      - clause_id: "cross_border_leasing_protection"
        name: "Защита при международном лизинге"
        risk_if_missing: |
          При лизинге с иностранным элементом возникают валютные риски, риски юрисдикции, проблемы с регистрацией 
          прав, сложности налогового учета. Без специальных условий стороны подвергаются непредсказуемым рискам.
        legal_base: "Раздел VI ГК РФ, ст. 7 ФЗ № 164-ФЗ"
        severity: "high"
        affected_party: "seller"
        detection:
          positive_keywords:
            - "иностранная валюта"
            - "применимое право"
            - "подсудность споров"
            - "международный лизинг"
            - "валютные риски"
            - "арбитражная оговорка"
            - "юрисдикция"
          context_patterns:
            - '(?i)споры.*подлежат.*рассмотрению.*в.*арбитраже.*[А-Яа-я]+'
            - '(?i)платежи.*осуществляются.*в.*[A-Z]{3}'
        conditional_checks:
          - trigger: "cross_border_indicators"
            keywords: ["иностранный", "оффшор", "международный", "валютный", "арбитраж", "иностранная валюта"]
            rule: "cross_border_clauses_required"
            severity: "critical"