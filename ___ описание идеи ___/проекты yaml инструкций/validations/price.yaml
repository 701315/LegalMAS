validation_type: "contract_element"
element: "price"
description: |
  Цена договора — денежное выражение стоимости предмета договора или встречного предоставления.
  Включает цену товара, арендную плату, вознаграждение за работы/услуги.
  Для договоров продажи недвижимости и аренды зданий ≥ 1 года цена является существенным условием.
legal_base_general: "ст. 424 ГК РФ (цена договора); ст. 485, 555 ГК РФ (цена товара, недвижимости)"

# ══════════════════════════════════════════════════════════════════
# СЕКЦИЯ 1: ОБЯЗАТЕЛЬНЫЕ ПРОВЕРКИ (mandatory_checks)
# ══════════════════════════════════════════════════════════════════
mandatory_checks:

  # ── 1. Наличие раздела «Цена / Оплата» ────────────────────
  - check_id: "price_presence"
    rule: "В договоре должен присутствовать раздел, определяющий цену (стоимость, размер оплаты, арендную плату, вознаграждение)"
    severity: "critical"
    legal_base: "ст. 424 ГК РФ (цена); ст. 555 ГК РФ (цена в договоре продажи недвижимости — существенное условие)"
    validation:
      type: "presence"
      keywords:
        - "цена договора"
        - "цена"
        - "стоимость"
        - "общая стоимость"
        - "оплата"
        - "порядок оплаты"
        - "арендная плата"
        - "размер арендной платы"
        - "вознаграждение"
        - "размер вознаграждения"
        - "платёж"
        - "платеж"
        - "размер платы"
        - "сумма договора"
        - "стоимость работ"
        - "стоимость услуг"
        - "цена товара"
        - "цена работ"
        - "общая сумма"
        - "порядок расчетов"
      pattern_ref: "AMOUNT_WITH_WORDS_IN_PARENS"
      min_length: 20
    failure_message: "Не найден раздел с указанием цены (стоимости, арендной платы, вознаграждения). Для договоров продажи недвижимости отсутствие цены влечёт незаключённость договора."

  # ── 2. Конкретная сумма в денежном выражении ───────────────
  - check_id: "amount_specified"
    rule: "Размер цены (платежа, вознаграждения) должен быть выражен в конкретной денежной сумме с указанием валюты"
    severity: "critical"
    legal_base: "ст. 317, 424 ГК РФ (валюта денежных обязательств, цена договора)"
    validation:
      type: "regex_ref"
      pattern_ref: "AMOUNT_WITH_CURRENCY"
      message: "Конкретная сумма в денежном выражении не найдена. Ожидается числовое значение с указанием валюты (например: «100 000 (Сто тысяч) рублей 00 копеек», «50 000 руб.», «10 000 USD»)."

  # ── 3. Сумма прописью ─────────────────────────────────────
  - check_id: "amount_in_words"
    rule: "Сумма цены (платежа) должна быть указана прописью во избежание разночтений"
    severity: "medium"
    legal_base: "Обычай делового оборота; п. 1 ст. 5, ст. 431 ГК РФ (толкование договора)"
    validation:
      type: "regex_ref"
      keywords:
        - "прописью"
        - "сумма прописью"
      pattern_ref: "AMOUNT_WITH_WORDS_IN_PARENS"
      min_length: 0
    failure_message: "Сумма не продублирована прописью. Рекомендуется указывать сумму цифрами и прописью (например: «100 000 (Сто тысяч) рублей») для исключения разночтений при толковании."

  # ── 4. Периодичность платежей ──────────────────────────────
  - check_id: "payment_frequency"
    rule: "Периодичность внесения платежей должна быть определена (для договоров с регулярными платежами)"
    severity: "high"
    legal_base: "ст. 614 ГК РФ (порядок, условия и сроки внесения арендной платы); ст. 781 ГК РФ (оплата услуг)"
    validation:
      type: "keyword_extraction"
      keywords:
        - "ежемесячно"
        - "ежеквартально"
        - "ежегодно"
        - "каждый месяц"
        - "раз в месяц"
        - "раз в квартал"
        - "раз в год"
        - "до числа"
        - "до 5 числа"
        - "до 10 числа"
        - "до 15 числа"
        - "до 25 числа"
        - "не позднее"
        - "в срок до"
        - "в течение"
        - "банковских дней"
        - "рабочих дней"
        - "единовременно"
        - "единым платежом"
        - "разовый платёж"
        - "разовый платеж"
        - "поэтапно"
        - "по графику"
        - "авансом"
        - "предоплата"
        - "100% предоплата"
        - "по факту"
        - "отсрочка платежа"
      min_matches: 1
      optional: true
    failure_message: "Не указаны сроки и периодичность внесения платежей. Для аренды — обязательное условие (ст. 614 ГК РФ). Для иных договоров — рекомендуется указать конкретные сроки оплаты."

# ══════════════════════════════════════════════════════════════════
# СЕКЦИЯ 2: УСЛОВНЫЕ ПРОВЕРКИ (conditional_checks)
# ══════════════════════════════════════════════════════════════════
conditional_checks:

  # ── 1. Переменная часть платежа ────────────────────────────
  - check_id: "variable_payment_detected"
    trigger:
      keywords:
        - "переменная часть"
        - "переменная составляющая"
        - "постоянная и переменная"
        - "доля выручки"
        - "процент от выручки"
        - "процент от дохода"
        - "процент от оборота"
        - "процент от"
        - "индексирование"
        - "индексация"
        - "изменение размера"
        - "плавающая ставка"
        - "корректировка цены"
        - "ставка рефинансирования"
    rule: "Механизм расчёта переменной части платежа должен быть детально описан, включая формулу, базу расчёта и порядок подтверждения данных"
    severity: "high"
    legal_base: "ст. 614 ГК РФ (формы арендной платы); п. 11 Информационного письма Президиума ВАС РФ от 11.01.2002 № 66"
    sub_checks:

      - check_id: "calculation_formula"
        rule: "Формула или порядок расчёта переменной части должны быть указаны"
        severity: "high"
        validation:
          type: "keyword_extraction"
          keywords:
            - "формула"
            - "формула расчёта"
            - "формула расчета"
            - "порядок расчёта"
            - "порядок расчета"
            - "рассчитывается"
            - "определяется как"
            - "исчисляется"
            - "составляет"
            - "процент"
            - "%"
            - "коэффициент"
            - "пропорционально"
            - "умножается"
            - "умноженн"
          min_matches: 2
          message: "Не указана формула или порядок расчёта переменной части платежа. Без формулы невозможно определить размер обязательства."

      - check_id: "calculation_base"
        rule: "База расчёта переменной части должна быть определена (выручка, площадь, объём потребления)"
        severity: "high"
        validation:
          type: "keyword_extraction"
          keywords:
            - "выручка"
            - "товарооборот"
            - "оборот"
            - "доход"
            - "объём потребления"
            - "объем потребления"
            - "фактическое потребление"
            - "показания приборов учёта"
            - "показания приборов учета"
            - "показания счётчиков"
            - "показания счетчиков"
            - "площадь"
            - "тариф"
            - "данные о выручке"
          min_matches: 1
          message: "Не определена база для расчёта переменной части (выручка, объём потребления, тарифы и т. д.)."

      - check_id: "reporting_mechanism"
        rule: "Порядок подтверждения данных для расчёта переменной части должен быть установлен"
        severity: "medium"
        validation:
          type: "keyword_extraction"
          keywords:
            - "отчёт"
            - "отчет"
            - "подтверждение"
            - "документы"
            - "справка"
            - "выписка"
            - "акт сверки"
            - "предоставляет данные"
            - "предоставляет сведения"
            - "счета-фактуры"
            - "показания"
            - "подтверждающие документы"
            - "подтверждающий документ"
            - "предоставляет отчет"
            - "предоставляет отчёт"
            - "предоставить отчет"
            - "предоставить отчёт"
          min_matches: 1
          message: "Не указан порядок подтверждения данных для расчёта переменной части платежа (отчёт, справка, акт сверки). Это может привести к спорам о размере платежа."

  # ── 2. Рассрочка / поэтапная оплата ───────────────────────
  - check_id: "installment_detected"
    trigger:
      keywords:
        - "рассрочка"
        - "в рассрочку"
        - "частичная оплата"
        - "частями"
        - "платёж частями"
        - "график платежей"
        - "график оплаты"
        - "этапы оплаты"
        - "поэтапная оплата"
        - "транш"
        - "первый платёж"
        - "второй платёж"
    rule: "При оплате в рассрочку должны быть определены размер и сроки каждого платежа"
    severity: "high"
    legal_base: "ст. 489 ГК РФ (оплата товара в рассрочку); ст. 711 ГК РФ (оплата работ)"
    sub_checks:

      - check_id: "installment_schedule"
        rule: "График платежей должен содержать размеры и даты каждого платежа"
        severity: "high"
        validation:
          type: "structure_check"
          required_elements:
            - element: "installment_amounts"
              patterns:
                - '(?i)(\\d{1,3}([\\s.]\\d{3})*)\\s*(руб|₽|RUB|USD|EUR)[\\s\\S]{0,60}(\\d{2}[./]\\d{2}[./]\\d{2,4}|не\\s+позднее|до\\s+\\d)'
                - '(?i)(первый|второй|третий|1-й|2-й|3-й|I|II|III)[\\s\\S]{0,30}(платёж|платеж|транш|этап)[\\s\\S]{0,60}(\\d+[\\s,.]?\\d*)\\s*(руб|₽|%)'
                - '(?i)(\\d+)\\s*(руб|₽|%)'
            - element: "installment_dates"
              patterns:
                - '(?i)(\\d{2}[./]\\d{2}[./]\\d{2,4})'
                - '(?i)(до\\s+\\d{1,2}\\s+(числа|января|февраля|марта|апреля|мая|июня|июля|августа|сентября|октября|ноября|декабря))'
                - '(?i)(в\\s+течение\\s+\\d+\\s+(дней|рабочих\\s+дней|календарных\\s+дней))'
                - '(?i)(\\d{2}\\.\\d{2}\\.\\d{4}|не позднее|в срок до)'
          min_matches: 2
          message: "График платежей не конкретизирован. Необходимо указать размер и дату каждого платежа. При продаже товара в рассрочку отсутствие графика может повлечь признание условия о рассрочке несогласованным (ст. 489 ГК РФ)."

      - check_id: "installment_default_consequences"
        rule: "Должны быть указаны последствия нарушения графика платежей"
        severity: "medium"
        validation:
          type: "keyword_extraction"
          keywords:
            - "просрочка"
            - "нарушение графика"
            - "неоплата"
            - "неисполнение обязательства по оплате"
            - "право потребовать"
            - "досрочное погашение"
            - "расторжение"
            - "возврат"
          min_matches: 1
          message: "Не указаны последствия нарушения графика платежей (право требовать досрочной оплаты, расторжение и т. д.)."

  # ── 3. Аванс / предоплата / обеспечительный платёж ─────────
  - check_id: "advance_payment_detected"
    trigger:
      keywords:
        - "аванс"
        - "авансовый платёж"
        - "авансовый платеж"
        - "предоплата"
        - "предварительная оплата"
        - "задаток"
        - "обеспечительный платёж"
        - "обеспечительный платеж"
        - "гарантийный взнос"
        - "депозит"
        - "страховой депозит"
    rule: "Условия аванса (предоплаты, обеспечительного платежа) должны быть конкретизированы: размер, срок внесения, порядок зачёта или возврата"
    severity: "high"
    legal_base: "ст. 380, 381 ГК РФ (задаток); ст. 381.1 ГК РФ (обеспечительный платёж); ст. 487 ГК РФ (предварительная оплата товара)"
    sub_checks:

      - check_id: "advance_amount"
        rule: "Размер аванса (предоплаты, обеспечительного платежа) должен быть указан"
        severity: "high"
        validation:
          type: "regex_ref"
          pattern_ref: "ADVANCE_AMOUNT_WITH_CURRENCY"
          message: "Не указан размер аванса (предоплаты, обеспечительного платежа). Необходимо конкретное числовое значение."

      - check_id: "advance_payment_deadline"
        rule: "Срок внесения аванса (предоплаты) должен быть указан"
        severity: "high"
        validation:
          type: "keyword_extraction"
          keywords:
            - "в течение"
            - "не позднее"
            - "до"
            - "в срок"
            - "до подписания"
            - "до начала"
            - "при заключении"
            - "в момент подписания"
            - "до передачи"
          min_matches: 1
          message: "Не указан срок внесения аванса (предоплаты, обеспечительного платежа)."

      - check_id: "advance_return_conditions"
        rule: "Условия зачёта или возврата аванса (предоплаты, обеспечительного платежа) должны быть определены"
        severity: "high"
        validation:
          type: "keyword_extraction"
          keywords:
            - "зачёт"
            - "зачет"
            - "засчитывается"
            - "зачитывается"
            - "возврат"
            - "возвращается"
            - "подлежит возврату"
            - "не подлежит возврату"
            - "удержание"
            - "удерживается"
            - "в счёт"
            - "в счет"
            - "за вычетом"
          min_matches: 1
          message: "Не определены условия зачёта или возврата аванса (предоплаты, обеспечительного платежа). Рекомендуется указать: при каких обстоятельствах аванс зачитывается, возвращается или удерживается."

  # ── 4. НДС ────────────────────────────────────────────────
  - check_id: "vat_detected"
    trigger:
      keywords:
        - "НДС"
        - "с НДС"
        - "без НДС"
        - "в том числе НДС"
        - "кроме того НДС"
        - "налог на добавленную стоимость"
        - "освобождён от НДС"
        - "освобожден от НДС"
        - "не облагается НДС"
    rule: "Условие о НДС должно быть однозначным: указано, включён ли НДС в цену, и если да — его сумма"
    severity: "medium"
    legal_base: "Глава 21 НК РФ (НДС); п. 17 Постановления Пленума ВАС РФ от 30.05.2014 № 33"
    sub_checks:

      - check_id: "vat_inclusion_clarity"
        rule: "Должно быть однозначно указано, включён ли НДС в цену или начисляется сверх неё"
        severity: "high"
        validation:
          type: "keyword_extraction"
          keywords:
            - "в том числе НДС"
            - "включая НДС"
            - "с учётом НДС"
            - "с учетом НДС"
            - "НДС включён"
            - "НДС включен"
            - "без НДС"
            - "НДС не облагается"
            - "НДС не предусмотрен"
            - "освобождён от НДС"
            - "освобожден от НДС"
            - "кроме того НДС"
            - "плюс НДС"
            - "сверх цены НДС"
            - "НДС начисляется дополнительно"
            - "в т.ч. НДС"
            - "УСН"
          min_matches: 1
          message: "Не указано однозначно, включён ли НДС в цену. При отсутствии такого указания суд может признать, что цена указана с НДС (п. 17 Постановления Пленума ВАС РФ № 33)."

      - check_id: "vat_amount_specified"
        rule: "При включении НДС в цену должна быть указана сумма НДС"
        severity: "medium"
        validation:
          type: "regex_ref"
          pattern_ref: "VAT_AMOUNT_WITH_CURRENCY"
          message: "НДС упомянут, но его сумма не выделена. Рекомендуется: «в том числе НДС ХХ% — ХХ Х ХХ руб.»"

      - check_id: "vat_rate_specified"
        rule: "Ставка НДС должна быть указана"
        severity: "low"
        validation:
          type: "regex_ref"
          pattern_ref: "VAT_RATE_PATTERN"
          message: "Не указана ставка НДС (20%, 10%, 0%). Рекомендуется указать для ясности."

  # ── 5. Иностранная валюта / валютная оговорка ──────────────
  - check_id: "currency_other_than_rub"
    trigger:
      keywords:
        - "USD"
        - "EUR"
        - "доллар"
        - "евро"
        - "фунт стерлингов"
        - "GBP"
        - "CHF"
        - "швейцарский франк"
        - "юань"
        - "CNY"
        - "иностранная валюта"
        - "иностранной валюте"
        - "условные единицы"
        - "у.е."
        - "условных единицах"
        - "валютный эквивалент"
    rule: "При указании цены в иностранной валюте или условных единицах должна быть определена валютная оговорка: курс пересчёта, дата определения курса, порядок оплаты в рублях"
    severity: "high"
    legal_base: "ст. 317 ГК РФ (валюта денежных обязательств); ФЗ-173 «О валютном регулировании и валютном контроле»; п. 27–32 Постановления Пленума ВС РФ от 22.11.2016 № 54"
    sub_checks:

      - check_id: "ruble_payment_clause"
        rule: "Для расчётов между резидентами РФ оплата должна производиться в рублях"
        severity: "high"
        validation:
          type: "keyword_extraction"
          keywords:
            - "в рублях"
            - "в рублях по курсу"
            - "рублёвый эквивалент"
            - "рублевый эквивалент"
            - "пересчёт"
            - "пересчет"
            - "перерасчёт"
            - "перерасчет"
            - "оплата производится в рублях"
            - "оплата в рублях"
            - "по курсу ЦБ"
            - "по курсу Банка России"
            - "на дату платежа"
            - "рублевый эквивалент"
          min_matches: 1
          message: "Цена указана в иностранной валюте, но не предусмотрена оплата в рублях. Расчёты между резидентами РФ должны осуществляться в рублях (ст. 317 ГК РФ, ФЗ-173)."

      - check_id: "exchange_rate_determination"
        rule: "Должен быть определён курс пересчёта и дата его фиксации"
        severity: "high"
        validation:
          type: "keyword_extraction"
          keywords:
            - "курс ЦБ РФ"
            - "курс Центрального банка"
            - "курс Банка России"
            - "официальный курс"
            - "курс на дату"
            - "курс на день"
            - "на дату оплаты"
            - "на день оплаты"
            - "на дату платежа"
            - "на день платежа"
            - "на дату выставления счёта"
            - "на дату выставления счета"
            - "курс коммерческого банка"
            - "внутренний курс"
          min_matches: 1
          message: "Не указан курс пересчёта иностранной валюты в рубли и/или дата его определения. Рекомендуется: «по курсу ЦБ РФ на дату оплаты»."

      - check_id: "currency_corridor"
        rule: "Рекомендуется установить валютный коридор (минимальный/максимальный курс)"
        severity: "low"
        validation:
          type: "keyword_extraction"
          keywords:
            - "минимальный курс"
            - "максимальный курс"
            - "не менее"
            - "не более"
            - "коридор"
            - "диапазон"
            - "граница"
            - "предельный курс"
          min_matches: 1
          message: "Отсутствует валютный коридор (минимальный/максимальный курс). Рекомендуется для снижения валютных рисков."

  # ── 6. Неустойка / штраф за нарушение сроков оплаты ───────
  - check_id: "late_payment_penalty_detected"
    trigger:
      keywords:
        - "неустойка"
        - "пеня"
        - "пени"
        - "штраф"
        - "штрафная санкция"
        - "проценты за пользование"
        - "просрочка оплата"
        - "нарушение сроков оплаты"
        - "ответственность за просрочку"
        - "за каждый день просрочки"
        - "за задержку оплаты"
    rule: "Условия о неустойке (пене, штрафе) за нарушение сроков оплаты должны содержать размер, порядок начисления и предельный размер"
    severity: "medium"
    legal_base: "ст. 330, 331, 333 ГК РФ (неустойка); ст. 395 ГК РФ (проценты за пользование чужими денежными средствами)"
    sub_checks:

      - check_id: "penalty_rate_specified"
        rule: "Размер (ставка) неустойки должен быть указан"
        severity: "high"
        validation:
          type: "regex_ref"
          pattern_ref: "PENALTY_RATE_PATTERN"
          message: "Упомянута неустойка (пеня, штраф), но не указан её размер (ставка). Необходимо: «пеня в размере 0,1% от суммы задолженности за каждый день просрочки»."

      - check_id: "penalty_calculation_base"
        rule: "Должна быть определена база начисления неустойки (от какой суммы считается)"
        severity: "medium"
        validation:
          type: "keyword_extraction"
          keywords:
            - "от суммы"
            - "от стоимости"
            - "от размера"
            - "от неоплаченной"
            - "от задолженности"
            - "от просроченной суммы"
            - "от цены договора"
            - "от суммы долга"
            - "за каждый день"
            - "за каждый календарный день"
          min_matches: 1
          message: "Не определена база начисления неустойки (от какой суммы рассчитывается: от суммы задолженности, от цены договора и т. д.)."

      - check_id: "penalty_cap"
        rule: "Рекомендуется установить предельный размер неустойки"
        severity: "low"
        validation:
          type: "keyword_extraction"
          keywords:
            - "но не более"
            - "не может превышать"
            - "не должна превышать"
            - "максимальный размер"
            - "предельный размер"
            - "ограничение неустойки"
            - "совокупный размер"
          min_matches: 1
          message: "Не установлен предельный размер неустойки. Рекомендуется: «но не более ХХ% от цены договора». Отсутствие лимита может привести к несоразмерности (ст. 333 ГК РФ)."

  # ── 7. Изменение цены / индексация ────────────────────────
  - check_id: "price_change_mechanism_detected"
    trigger:
      keywords:
        - "изменение цены"
        - "изменение стоимости"
        - "изменение арендной платы"
        - "пересмотр цены"
        - "индексация"
        - "индексирование"
        - "повышение цены"
        - "увеличение арендной платы"
        - "корректировка цены"
        - "корректировка стоимости"
        - "ИПЦ"
        - "индекс потребительских цен"
        - "дополнительная оплата"
        - "доплата"
    rule: "Механизм изменения цены (индексации) должен быть детально регламентирован: основание, порядок, ограничения"
    severity: "high"
    legal_base: "ст. 424, 450, 451 ГК РФ (изменение цены, изменение и расторжение договора); п. 3 ст. 614 ГК РФ (пересмотр арендной платы не чаще 1 раза в год)"
    sub_checks:

      - check_id: "price_change_basis"
        rule: "Должно быть указано основание для изменения цены (индексация по ИПЦ, соглашение сторон, изменение тарифов)"
        severity: "high"
        validation:
          type: "keyword_extraction"
          keywords:
            - "на основании"
            - "в связи с"
            - "в случае"
            - "при изменении"
            - "ИПЦ"
            - "индекс потребительских цен"
            - "инфляция"
            - "Росстат"
            - "тариф"
            - "рыночная стоимость"
            - "кадастровая стоимость"
            - "соглашение сторон"
            - "дополнительное соглашение"
            - "одностороннее изменение"
            - "уведомление"
            - "предупреждение"
          min_matches: 1
          message: "Не указано основание для изменения цены (индексации). Необходимо определить, на основании каких показателей или событий цена может быть изменена."

      - check_id: "price_change_frequency"
        rule: "Должна быть указана допустимая периодичность изменения цены"
        severity: "medium"
        validation:
          type: "keyword_extraction"
          keywords:
            - "не чаще"
            - "раз в год"
            - "ежегодно"
            - "1 раз в год"
            - "один раз в год"
            - "раз в квартал"
            - "не ранее"
            - "по истечении"
            - "с даты"
            - "индексация"
          min_matches: 1
          message: "Не указана периодичность допустимого изменения цены. Для аренды: арендная плата может пересматриваться не чаще 1 раза в год (п. 3 ст. 614 ГК РФ)."

      - check_id: "price_change_limit"
        rule: "Рекомендуется установить предельный размер индексации"
        severity: "low"
        validation:
          type: "keyword_extraction"
          keywords:
            - "не более"
            - "не выше"
            - "максимальный размер индексации"
            - "предельный размер"
            - "лимит"
            - "ограничение"
          min_matches: 1
          message: "Не установлен предельный размер индексации (изменения цены). Рекомендуется: «но не более ХХ% в год» для защиты от чрезмерного роста."

  # ── 8. Способ оплаты ──────────────────────────────────────
  - check_id: "payment_method_detected"
    trigger:
      keywords:
        - "безналичный"
        - "наличный"
        - "расчётный счёт"
        - "расчетный счет"
        - "перечисление"
        - "банковский перевод"
        - "платёжное поручение"
        - "платежное поручение"
        - "касса"
        - "аккредитив"
        - "инкассо"
        - "вексель"
        - "чек"
        - "зачёт встречных требований"
        - "зачет встречных требований"
        - "бартер"
        - "взаимозачёт"
        - "взаимозачет"
    rule: "Способ оплаты должен быть определён и соответствовать требованиям законодательства"
    severity: "medium"
    legal_base: "ст. 861, 862 ГК РФ (наличные и безналичные расчёты); Указание Банка России от 09.12.2019 № 5348-У (лимит наличных расчётов между юрлицами — 100 000 руб.)"
    sub_checks:

      - check_id: "payment_method_clarity"
        rule: "Способ оплаты должен быть явно указан (безналичный перевод, наличными, аккредитив и т. д.)"
        severity: "medium"
        validation:
          type: "keyword_extraction"
          keywords:
            - "безналичный расчёт"
            - "безналичный расчет"
            - "безналичным путём"
            - "безналичным путем"
            - "путём перечисления"
            - "путем перечисления"
            - "на расчётный счёт"
            - "на расчетный счет"
            - "платёжным поручением"
            - "платежным поручением"
            - "наличными"
            - "через кассу"
            - "аккредитив"
            - "банковская ячейка"
            - "эскроу"
          min_matches: 1
          message: "Не указан способ оплаты (безналичный перевод, наличными и т. д.)."

      - check_id: "cash_limit_warning"
        rule: "При наличных расчётах между юрлицами/ИП сумма не должна превышать лимит ЦБ РФ"
        severity: "high"
        validation:
          type: "keyword_extraction"
          keywords:
            - "наличными"
            - "наличный расчёт"
            - "наличный расчет"
            - "через кассу"
            - "наличные денежные средства"
          min_matches: 1
          message: "Предусмотрена оплата наличными. Внимание: лимит наличных расчётов между юрлицами/ИП — 100 000 руб. по одному договору (Указание Банка России № 5348-У)."

# ══════════════════════════════════════════════════════════════════
# СЕКЦИЯ 3: СПРАВОЧНЫЕ ДАННЫЕ (reference_data)
# ══════════════════════════════════════════════════════════════════
reference_data:

  common_payment_terms:
    frequency:
      - "единовременно"
      - "разовый платёж"
      - "ежемесячно"
      - "ежеквартально"
      - "ежегодно"
      - "поэтапно"
      - "по графику"
    types:
      - "авансовый платёж"
      - "предоплата"
      - "задаток"
      - "по факту"
      - "по завершении"
      - "по результатам"
      - "в течение"
      - "не позднее"
      - "30% аванс, 70% по факту"
      - "отсрочка платежа"
      - "100% предоплата"

  payment_methods:
    - type: "bank_transfer"
      keywords: ["безналичный", "перечисление", "платёжное поручение", "расчётный счёт", "банковский перевод"]
      description: "Безналичный перевод — основной способ расчётов между юрлицами"
    - type: "cash"
      keywords: ["наличный", "касса", "наличными", "наличные денежные средства"]
      description: "Наличные расчёты — лимит 100 000 руб. между юрлицами/ИП"
      limit: 100000
      limit_legal_base: "Указание Банка России от 09.12.2019 № 5348-У"
    - type: "letter_of_credit"
      keywords: ["аккредитив"]
      description: "Аккредитив — безотзывный/отзывный, покрытый/непокрытый"
    - type: "escrow"
      keywords: ["эскроу", "счёт эскроу"]
      description: "Счёт эскроу — для расчётов с условием (ст. 860.7 ГК РФ)"

  currencies:
    - code: "RUB"
      symbols: ["руб", "₽", "рубль", "российский рубль", "рос. руб.", "RUB"]
    - code: "USD"
      symbols: ["USD", "доллар", "долл.", "долларов США", "$"]
    - code: "EUR"
      symbols: ["EUR", "евро", "€"]
    - code: "GBP"
      symbols: ["GBP", "фунт стерлингов", "£"]
    - code: "CNY"
      symbols: ["CNY", "юань", "китайский юань", "¥"]
    - code: "UE"
      symbols: ["у.е.", "условная единица", "условных единиц", "у.е"]

  vat_rates:
    - rate: "20%"
      description: "Основная ставка НДС (с 01.01.2019)"
    - rate: "10%"
      description: "Пониженная ставка (продовольствие, детские товары, книги, лекарства)"
    - rate: "0%"
      description: "Экспорт, международные перевозки"
    - rate: "без НДС"
      description: "Операции, не подлежащие налогообложению (ст. 149 НК РФ), или лица на спецрежимах (УСН, патент)"

  advance_payment_types:
    - type: "advance"
      description: "Аванс — предварительный платёж, подлежащий возврату при неисполнении (ст. 487 ГК РФ)"
    - type: "deposit"
      description: "Задаток — обеспечительная мера, при отказе заказчика — остаётся у исполнителя (ст. 380, 381 ГК РФ)"
    - type: "security_payment"
      description: "Обеспечительный платёж — зачитывается или возвращается при наступлении/ненаступлении обстоятельств (ст. 381.1 ГК РФ)"

  negative_indicators:
    - "цена не определена"
    - "цена не установлена"
    - "будет согласована"
    - "будет согласована дополнительно"
    - "по договорённости"
    - "по договоренности"
    - "по рыночной цене"
    - "по согласованию сторон"
    - "ориентировочная стоимость"
    - "приблизительная стоимость"
    - "подлежит уточнению"
    - "определяется протоколом о намерениях"
    - "_____"
    - "[указать]"
    - "[сумма]"
    - "[цена]"
    - "будет установлена дополнительно"
    - "по дополнительному соглашению"