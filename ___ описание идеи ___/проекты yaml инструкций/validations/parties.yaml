validation_type: "contract_element"
element: "parties"
description: |
  Проверка полной и корректной идентификации сторон договора: наличие наименований/ФИО,
  организационно-правовых форм, реквизитов (ИНН, ОГРН/ОГРНИП, паспортные данные),
  а также полномочий лиц, подписывающих договор от имени сторон.
  Охватывает юридические лица, ИП, физические и иностранные лица.
legal_base_general: "ст. 420, 432 ГК РФ (понятие и существенные условия договора)"

# ══════════════════════════════════════════════════════════════════
# СЕКЦИЯ 1: ОБЯЗАТЕЛЬНЫЕ ПРОВЕРКИ (mandatory_checks)
# ══════════════════════════════════════════════════════════════════
mandatory_checks:

  # ── 1. Наличие раздела «Стороны» ────────────────────────────
  - check_id: "parties_presence"
    rule: "В договоре должен присутствовать раздел, идентифицирующий стороны"
    severity: "high"
    legal_base: "ст. 432 ГК РФ (договор считается заключённым при согласовании существенных условий)"
    validation:
      type: "presence"
      keywords:
        - "сторон"
        - "договор заключен"
        - "заключили настоящий"
        - "между"
        - "контрагент"
        - "заключили договор"
        - "далее именуем"
        - "адреса и реквизиты"
        - "подписи сторон"
      patterns:
        - '(?i)(^|\n)\s*(сторон|между|мы, нижеподписавшиеся)'
        - '(?i)(договор[\s\S]{0,30}заключ[её]н[\s\S]{0,20}между)'
        - '(?i)(далее\s+(именуем|называем))'
      min_length: 50
    failure_message: "Критическая ошибка: Не найден раздел с идентификацией сторон договора. Договор должен содержать преамбулу или раздел, в котором указаны наименования и реквизиты сторон."

  # ── 2. Наименования / имена обеих сторон ────────────────────
  - check_id: "party_names_present"
    rule: "Должны быть указаны наименования (для юрлиц) или ФИО (для физлиц) обеих сторон договора"
    severity: "high"
    legal_base: "ст. 432 ГК РФ"
    validation:
      type: "structure_check"
      required_elements:
        - element: "party_1_identification"
          patterns:
            - '(?i)(арендодатель|арендатор|продавец|покупатель|заказчик|подрядчик|исполнитель|поставщик|заимодавец|заёмщик|лицензиар|лицензиат|комитент|комиссионер|доверитель|поверенный|принципал|агент|страховщик|страхователь|залогодатель|залогодержатель|цедент|цессионарий|даритель|одаряемый)'
            - '(?i)(именуем[а-яё]{0,5}\s+(в\s+)?дальнейшем)'
            - "(?i)(ООО|АО|ПАО|ЗАО|НАО|ИП|ГУП|МУП|ФГУП)\\s+['«]"
        - element: "party_2_identification"
          patterns:
            - '(?i)(с\s+друг[а-я]+\s+стороны)'
            - '(?i)(арендодатель|арендатор|продавец|покупатель|заказчик|подрядчик|исполнитель|поставщик)'
            - '(?i)(а\s+также|и\s+гражданин|и\s+ООО|и\s+АО)'
      min_parties: 2
    failure_message: "Не удалось идентифицировать обе стороны договора. Для заключённости договора необходимо указание минимум двух сторон с их договорными обозначениями (например, «Арендодатель» и «Арендатор»)."

  # ── 3. Договорные роли сторон ──────────────────────────────
  - check_id: "party_role_designation"
    rule: "Каждой стороне должна быть присвоена договорная роль (наименование), используемая далее по тексту договора"
    severity: "high"
    legal_base: "ст. 420, 432 ГК РФ (определение сторон обязательства)"
    validation:
      type: "keyword_extraction"
      keywords:
        - "именуемый в дальнейшем"
        - "именуемое в дальнейшем"
        - "именуемая в дальнейшем"
        - "далее именуемый"
        - "далее именуемое"
        - "далее именуемая"
        - "далее —"
        - "далее –"
        - "далее -"
        - "далее по тексту"
      min_matches: 2
    failure_message: "Не определены договорные роли сторон. Рекомендуется указать обозначения (например: «именуемый в дальнейшем Арендодатель»), используемые по тексту договора."

  # ── 4. Реквизиты правоспособности ──────────────────────────
  - check_id: "legal_capacity_indicators"
    rule: "Должны присутствовать реквизиты, позволяющие однозначно идентифицировать стороны и подтвердить их правоспособность"
    severity: "high"
    legal_base: "ст. 49, 51, 53 ГК РФ (правоспособность юридических лиц, государственная регистрация)"
    validation:
      type: "keyword_extraction"
      required_keywords:
        legal_entity_indicators:
          - "ИНН"
          - "ОГРН"
          - "ОГРНИП"
          - "КПП"
          - "ОКПО"
          - "юридический адрес"
          - "место нахождения"
          - "р/с"
          - "расчётный счёт"
          - "расчетный счет"
          - "в лице"
          - "БИК"
          - "к/с"
        individual_indicators:
          - "паспорт"
          - "серия"
          - "выдан"
          - "дата рождения"
          - "место рождения"
          - "зарегистрирован"
          - "адрес регистрации"
          - "ИНН"
          - "СНИЛС"
          - "код подразделения"
      min_matches: 2
    failure_message: "Недостаточно реквизитов для идентификации сторон. Необходимо указать минимум 2 идентифицирующих реквизита для каждой стороны (ИНН, ОГРН, паспортные данные и т. д.)."

# ══════════════════════════════════════════════════════════════════
# СЕКЦИЯ 2: УСЛОВНЫЕ ПРОВЕРКИ (conditional_checks)
# ══════════════════════════════════════════════════════════════════
conditional_checks:

  # ── 1. Юридическое лицо ────────────────────────────────────
  - check_id: "legal_entity_detected"
    trigger:
      keywords:
        - "ООО"
        - "АО"
        - "ПАО"
        - "ЗАО"
        - "НАО"
        - "общество с ограниченной ответственностью"
        - "акционерное общество"
        - "публичное акционерное общество"
        - "государственное унитарное предприятие"
        - "муниципальное унитарное предприятие"
        - "ГУП"
        - "МУП"
        - "ФГУП"
        - "в лице генерального директора"
    rule: "Для юридических лиц обязательно указание ОГРН, ИНН и юридического адреса"
    severity: "high"
    legal_base: "ст. 51, 54 ГК РФ; ФЗ-129 «О государственной регистрации юридических лиц и индивидуальных предпринимателей»"
    sub_checks:

      - check_id: "ogrn_present"
        rule: "ОГРН юридического лица должен быть указан (13 цифр)"
        severity: "high"
        validation:
          type: "regex_ref"
          pattern_ref: "OGRN_PATTERN"
          message: "ОГРН не найден или указан в неверном формате. Ожидается: ОГРН XXXXXXXXXXXXX (13 цифр, первая ≠ 0)"

      - check_id: "inn_present"
        rule: "ИНН юридического лица должен быть указан (10 цифр)"
        severity: "high"
        validation:
          type: "regex_ref"
          pattern_ref: "INN_LEGAL_PATTERN"
          message: "ИНН юридического лица не найден или указан в неверном формате. Ожидается: ИНН XXXXXXXXXX (10 цифр)"

      - check_id: "kpp_present"
        rule: "КПП юридического лица должен быть указан (9 цифр)"
        severity: "medium"
        validation:
          type: "regex_ref"
          pattern_ref: "KPP_PATTERN"
          message: "КПП не найден или указан в неверном формате. Ожидается: КПП XXXXXXXXX (9 цифр)"

      - check_id: "legal_address_present"
        rule: "Юридический адрес (место нахождения) юридического лица должен быть указан"
        severity: "high"
        validation:
          type: "keyword_extraction"
          keywords:
            - "юридический адрес"
            - "юр. адрес"
            - "место нахождения"
            - "местонахождение"
            - "адрес:"
            - "зарегистрировано по адресу"
          min_matches: 1
          message: "Юридический адрес (место нахождения) юридического лица не найден"

      - check_id: "bank_details_present"
        rule: "Банковские реквизиты юридического лица должны быть указаны"
        severity: "medium"
        validation:
          type: "keyword_extraction"
          keywords:
            - "р/с"
            - "расчётный счёт"
            - "расчетный счет"
            - "р/счёт"
            - "р/счет"
            - "к/с"
            - "корр. счёт"
            - "корр. счет"
            - "БИК"
          min_matches: 2
          message: "Банковские реквизиты юридического лица не указаны или указаны не полностью. Рекомендуется: р/с, БИК, к/с, наименование банка"

  # ── 2. Индивидуальный предприниматель ──────────────────────
  - check_id: "ip_detected"
    trigger:
      keywords:
        - "ИП"
        - "индивидуальный предприниматель"
        - "ОГРНИП"
    rule: "Для индивидуальных предпринимателей требуется ОГРНИП, ИНН и адрес регистрации"
    severity: "high"
    legal_base: "ст. 23 ГК РФ; ФЗ-129 «О государственной регистрации юридических лиц и индивидуальных предпринимателей»"
    sub_checks:


      - check_id: "ogrnip_present"
        rule: "ОГРНИП индивидуального предпринимателя должен быть указан (15 цифр)"
        severity: "high"
        validation:
          type: "regex_ref"
          pattern_ref: "OGRNIP_PATTERN"
          message: "ОГРНИП не найден или указан в неверном формате. Ожидается: ОГРНИП XXXXXXXXXXXXXXX (15 цифр, первая = 3)"

      - check_id: "inn_ip_present"
        rule: "ИНН индивидуального предпринимателя должен быть указан (12 цифр)"
        severity: "high"
        validation:
          type: "regex_ref"
          pattern_ref: "INN_IP_PATTERN"
          message: "ИНН индивидуального предпринимателя не найден или указан в неверном формате. Ожидается: ИНН XXXXXXXXXXXX (12 цифр)"

      - check_id: "ip_registration_address"
        rule: "Адрес регистрации индивидуального предпринимателя должен быть указан"
        severity: "medium"
        validation:
          type: "keyword_extraction"
          keywords:
            - "адрес регистрации"
            - "зарегистрирован"
            - "место жительства"
            - "адрес:"
          min_matches: 1
          message: "Не указан адрес регистрации индивидуального предпринимателя"

  # ── 3. Физическое лицо ────────────────────────────────────
  - check_id: "individual_detected"
    trigger:
      keywords:
        - "паспорт"
        - "гражданин"
        - "гражданка"
        - "проживающий"
        - "проживающая"
        - "зарегистрирован по адресу"
        - "физическое лицо"
        - "дата рождения"
        - "пол:"
    rule: "Для физических лиц обязательно указание паспортных данных и адреса регистрации"
    severity: "high"
    legal_base: "ст. 17, 19 ГК РФ (правоспособность и имя гражданина)"
    sub_checks:

      - check_id: "full_name_present"
        rule: "ФИО физического лица должно быть указано полностью"
        severity: "critical"
        validation:
          type: "regex"
          pattern: '(?i)(гражданин[а-яё]{0,2}\\s+(Российской\\s+Федерации\\s+)?[А-ЯЁ][а-яё]+\\s+[А-ЯЁ][а-яё]+\\s+[А-ЯЁ][а-яё]+)'
          message: "ФИО физического лица не указано или указано не полностью (ожидается: Фамилия Имя Отчество)"

      - check_id: "passport_series_number"
        rule: "Серия и номер паспорта физического лица должны быть указаны"
        severity: "high"
        validation:
          type: "regex"
          pattern: '(?i)(паспорт|серия)[:\\s]*(\\d{2})[\\s]*(\\d{2})[\\s]*(№|номер|н\\.)?[:\\s]*(\\d{6})'
          message: "Паспортные данные не найдены или указаны в неверном формате. Ожидается: серия XX XX номер XXXXXX"

      - check_id: "passport_issued_by"
        rule: "Орган, выдавший паспорт, и дата выдачи должны быть указаны"
        severity: "high"
        validation:
          type: "keyword_extraction"
          keywords:
            - "выдан"
            - "кем выдан"
            - "дата выдачи"
            - "ОВД"
            - "УФМС"
            - "МВД"
            - "ГУ МВД"
            - "отдел"
            - "отделение"
            - "код подразделения"
          min_matches: 2
          message: "Не указан орган, выдавший паспорт, и/или дата выдачи"

      - check_id: "registration_address_present"
        rule: "Адрес регистрации (место жительства) физического лица должен быть указан"
        severity: "medium"
        validation:
          type: "keyword_extraction"
          keywords:
            - "зарегистрирован"
            - "адрес регистрации"
            - "место жительства"
            - "проживающий по адресу"
            - "проживающая по адресу"
            - "прописан"
          min_matches: 1
          message: "Не указан адрес регистрации (место жительства) физического лица"

  # ── 4. Представитель (лицо, подписывающее договор) ─────────
  - check_id: "representative_detected"
    trigger:
      keywords:
        - "в лице"
        - "действующего"
        - "действующей"
        - "действующий"
        - "на основании"
        - "директор"
        - "генеральный директор"
        - "доверенность"
        - "уполномоченный"
        - "представитель"
        - "по доверенности"
    rule: "При подписании договора представителем должны быть указаны основание и объём полномочий"
    severity: "high"
    legal_base: "ст. 53, 174, 182, 185 ГК РФ (органы юридического лица, представительство, доверенность)"
    sub_checks:

      - check_id: "authority_basis"
        rule: "Основание полномочий подписанта (устав, доверенность, решение/протокол) должно быть указано"
        severity: "critical"
        validation:
          type: "regex"
          pattern: '(?i)(действующ.*на основании|в лице).{1,100}(Устав|Доверенност|Положени|Свидетельств|Протокол|Решение|Приказ)'
          message: "Не указано основание полномочий лица, подписывающего договор (устав, доверенность и т. д.). Риск признания сделки недействительной."

      - check_id: "power_of_attorney_details"
        rule: "При действии по доверенности должны быть указаны её номер и дата"
        severity: "medium"
        validation:
          type: "regex"
          pattern: '(?i)доверенност[а-яё]{0,3}[\\s]*(№|номер|от)?[:\\s]*(\\d|[А-Яа-яA-Za-z])[\\s\\S]{0,40}(от\\s+)?\\d{1,2}[\\s./]\\d{1,2}[\\s./]\\d{2,4}'
          message: "Указана доверенность, но не найдены её номер и/или дата. Рекомендуется: «доверенности № ___ от __.__.____»"

      - check_id: "signatory_position"
        rule: "Должность лица, подписывающего договор, должна быть указана"
        severity: "medium"
        validation:
          type: "keyword_extraction"
          keywords:
            - "генеральный директор"
            - "директор"
            - "президент"
            - "управляющий"
            - "председатель"
            - "заместитель"
            - "начальник"
            - "руководитель"
          min_matches: 1
          message: "Не указана должность лица, подписывающего договор от имени стороны"

  # ── 5. Иностранное лицо ───────────────────────────────────
  - check_id: "foreign_entity_detected"
    trigger:
      keywords:
        - "иностранное"
        - "нерезидент"
        - "зарубежн"
        - "Ltd"
        - "LLC"
        - "GmbH"
        - "Inc"
        - "Corp"
        - "S.A."
        - "иностранного государства"
        - "апостиль"
        - "легализ"
        - "foreign"
        - "incorporated"
    rule: "Для иностранных лиц требуются сведения о регистрации в стране происхождения и статусе налогового резидентства"
    severity: "high"
    legal_base: "ст. 1202 ГК РФ (личный закон юридического лица); ФЗ-160 «Об иностранных инвестициях в РФ»"
    sub_checks:

      - check_id: "foreign_registration_info"
        rule: "Должны быть указаны страна регистрации и регистрационный номер иностранного лица"
        severity: "high"
        validation:
          type: "keyword_extraction"
          keywords:
            - "зарегистрировано в"
            - "место регистрации"
            - "страна регистрации"
            - "регистрационный номер"
            - "registration number"
            - "incorporated"
            - "registered in"
          min_matches: 1
          message: "Не указаны сведения о государственной регистрации иностранного лица (страна, номер)"

      - check_id: "foreign_legal_address"
        rule: "Должен быть указан адрес иностранного лица"
        severity: "medium"
        validation:
          type: "keyword_extraction"
          keywords:
            - "адрес"
            - "address"
            - "местонахождение"
            - "юридический адрес"
            - "registered office"
          min_matches: 1
          message: "Не указан адрес (место нахождения) иностранного лица"

# ══════════════════════════════════════════════════════════════════
