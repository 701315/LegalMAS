validation_type: "contract_element"
element: "subject"
description: |
  Предмет договора — объект гражданских прав (вещь, имущество, работы, услуги, права), 
  по поводу которого заключается договор, и характер действий сторон в отношении этого объекта.
  Предмет должен быть определён или определяем с достаточной степенью конкретности,
  позволяющей установить, какое именно обязательство возникает.
legal_base_general: "ст. 432, 455, 607, 702, 779 ГК РФ (существенные условия договора, предмет отдельных видов договоров)"

# ══════════════════════════════════════════════════════════════════
# СЕКЦИЯ 1: ОБЯЗАТЕЛЬНЫЕ ПРОВЕРКИ (mandatory_checks)
# ══════════════════════════════════════════════════════════════════
mandatory_checks:

  # ── 1. Наличие раздела «Предмет договора» ──────────────────
  - check_id: "subject_presence"
    rule: "В договоре должен присутствовать раздел, описывающий предмет договора"
    severity: "critical"
    legal_base: "ст. 432 ГК РФ (договор считается заключённым при согласовании всех существенных условий)"
    validation:
      type: "presence"
      keywords:
        - "предмет договора"
        - "предмет соглашения"
        - "предмет контракта"
        - "объект договора"
        - "объект аренды"
        - "имущество"
        - "товар"
        - "работы"
        - "услуги"
        - "обязуется передать"
        - "обязуется выполнить"
        - "обязуется оказать"
        - "наименование товара"
      patterns:
        - '(?i)(^|\n)\s*1\.\s*предмет\s*(договора|контракта|соглашения)'
        - '(?i)(предмет|объект)[\s]*(договор|аренд|купл|подряд|оказан|поставк)'
        - '(?i)(продавец|исполнитель|арендодатель).{1,50}(передает|обязуется).{1,50}(товар|услуги|работы|объект)'
        - '(?i)(обязу[её]тся[\s\S]{0,30}(передать|выполнить|оказать|поставить|предоставить))'
      min_length: 30
    failure_message: "Критическая ошибка: Не найден раздел с описанием предмета договора. Без определения предмета договор считается незаключённым (ст. 432 ГК РФ)."

  # ── 2. Определённость предмета ─────────────────────────────
  - check_id: "subject_definiteness"
    rule: "Предмет договора должен быть определён или определяем — содержать достаточно признаков для индивидуализации объекта или результата"
    severity: "critical"
    legal_base: "ст. 432 ГК РФ; п. 1 Постановления Пленума ВАС РФ от 14.03.2014 № 16"
    validation:
      type: "structure_check"
      required_elements:
        - element: "subject_description"
          min_length: 25
          patterns:
            - '(?i)(наименование|описание|характеристик|спецификация|параметр)'
            - '(?i)(расположен|находится|по адресу|местонахождение|адрес)'
            - '(?i)(количество|размер|площадь|объём|объем|длина|масса|вес|габарит)'
            - '(?i)(марка|модель|тип|вид|сорт|артикул|серийный номер|артикул)'
            - '(?i)(кадастровый|регистрационный|инвентарный|идентификационный)'
      negative_keywords:
        - "будет определено позднее"
        - "будет определён позднее"
        - "по согласованию сторон"
        - "по дополнительному согласованию"
        - "по дополнительному соглашению"
        - "в дальнейшем"
        - "не определено"
        - "не определён"
        - "подлежит уточнению"
        - "уточняется сторонами"
        - "предмет не определен"
        - "ориентировочная площадь"
        - "ориентировочно"
        - "приблизительно"
        - "_____"
        - "[указать]"
        - "[заполнить]"
        - "[описание предмета]"
    failure_message: "Предмет договора недостаточно определён. Отсутствуют конкретные характеристики объекта (наименование, количество, адрес, площадь и т. д.). Риск признания договора незаключённым."

  # ── 3. Характер обязательства сторон ───────────────────────
  - check_id: "obligation_type_present"
    rule: "Должен быть определён характер действий сторон в отношении предмета (передача, выполнение работ, оказание услуг и т. д.)"
    severity: "high"
    legal_base: "ст. 307, 420 ГК РФ (понятие обязательства и договора)"
    validation:
      type: "keyword_extraction"
      keywords:
        - "передаёт"
        - "передает"
        - "обязуется передать"
        - "продаёт"
        - "продает"
        - "обязуется продать"
        - "сдаёт в аренду"
        - "сдает в аренду"
        - "обязуется выполнить"
        - "выполняет"
        - "оказывает"
        - "обязуется оказать"
        - "предоставляет"
        - "обязуется предоставить"
        - "поставляет"
        - "обязуется поставить"
        - "передаёт во временное пользование"
        - "передает во временное пользование"
        - "передаёт в собственность"
        - "передает в собственность"
      min_matches: 1
    failure_message: "Не определён характер обязательства сторон в отношении предмета (передача в собственность, во временное пользование, выполнение работ, оказание услуг и т. д.)."

# ══════════════════════════════════════════════════════════════════
# СЕКЦИЯ 2: УСЛОВНЫЕ ПРОВЕРКИ (conditional_checks)
# ══════════════════════════════════════════════════════════════════
conditional_checks:

  # ── 1. Объект недвижимости ─────────────────────────────────
  - check_id: "real_estate_detected"
    trigger:
      keywords:
        - "недвижимость"
        - "недвижимое имущество"
        - "здание"
        - "сооружение"
        - "помещение"
        - "нежилое помещение"
        - "жилое помещение"
        - "квартира"
        - "комната"
        - "офис"
        - "склад"
        - "гараж"
        - "машино-место"
        - "машиноместо"
        - "объект незавершённого строительства"
        - "объект незавершенного строительства"
        - "участок"
    rule: "Объект недвижимости должен быть индивидуализирован кадастровым номером, адресом и площадью"
    severity: "critical"
    legal_base: "ст. 554, 607 ГК РФ; ФЗ-218 «О государственной регистрации недвижимости»; п. 3 ст. 607 ГК РФ (данные, позволяющие определённо установить имущество)"
    sub_checks:

      - check_id: "cadastral_number_present"
        rule: "Кадастровый номер объекта недвижимости должен быть указан"
        severity: "critical"
        validation:
          type: "regex_ref"
          pattern_ref: "CADASTRAL_NUMBER_PATTERN"
          message: "Кадастровый номер не найден или указан в неверном формате. Ожидаемый формат: XX:XX:XXXXXXX:XXX (например, 77:01:0001234:567). Без кадастрового номера договор об отчуждении недвижимости может быть признан незаключённым."

      - check_id: "address_present"
        rule: "Полный адрес объекта недвижимости должен быть указан"
        severity: "high"
        validation:
          type: "keyword_extraction"
          keywords:
            - "адрес:"
            - "расположен по адресу"
            - "находится по адресу"
            - "по адресу:"
            - "местонахождение:"
            - "местоположение"
            - "г."
            - "город"
            - "ул."
            - "улица"
            - "пр."
            - "проспект"
            - "пер."
            - "переулок"
            - "д."
            - "дом"
            - "корп."
            - "корпус"
            - "стр."
            - "строение"
            - "область"
          min_matches: 3
          message: "Адрес объекта недвижимости не найден или указан не полностью. Необходимо указать: субъект РФ, населённый пункт, улицу, дом (корпус/строение при наличии)."

      - check_id: "area_specification"
        rule: "Площадь объекта недвижимости должна быть указана"
        severity: "high"
        validation:
          type: "regex_ref"
          pattern_ref: "AREA_REAL_ESTATE_PATTERN"
          message: "Площадь объекта недвижимости не указана или указана без единиц измерения. Ожидаемый формат: «площадью ХХХ,Х кв. м»"

      - check_id: "encumbrances_info"
        rule: "Должна быть указана информация об обременениях объекта недвижимости (или об их отсутствии)"
        severity: "medium"
        validation:
          type: "keyword_extraction"
          keywords:
            - "обременен"
            - "обременение"
            - "залог"
            - "ипотека"
            - "арест"
            - "сервитут"
            - "ограничение"
            - "права третьих лиц"
            - "не обременено"
            - "не обременён"
            - "свободно от прав"
            - "свободно от притязаний"
          min_matches: 1
          message: "Не указана информация об обременениях (ограничениях) объекта недвижимости или об их отсутствии. Рекомендуется включить соответствующее условие"

  # ── 2. Земельный участок ───────────────────────────────────
  - check_id: "land_plot_detected"
    trigger:
      keywords:
        - "земельный участок"
        - "земля"
        - "участок земли"
        - "участок площадью"
        - "земельная доля"
        - "пай"
        - "доля в праве"
    rule: "Земельный участок должен быть идентифицирован с указанием категории земель, вида разрешённого использования и площади"
    severity: "high"
    legal_base: "ст. 7, 37, 39.1 ЗК РФ; ст. 11.1 ЗК РФ (понятие земельного участка)"
    sub_checks:

      - check_id: "land_category_present"
        rule: "Категория земель должна быть указана"
        severity: "high"
        validation:
          type: "keyword_extraction"
          required_keywords:
            categories:
              - "земли сельскохозяйственного назначения"
              - "земли населённых пунктов"
              - "земли населенных пунктов"
              - "земли промышленности"
              - "земли промышленного назначения"
              - "земли энергетики"
              - "земли транспорта"
              - "земли особо охраняемых территорий"
              - "земли особо охраняемых территорий и объектов"
              - "земли лесного фонда"
              - "земли водного фонда"
              - "земли запаса"
              - "категория земель"
              - "категория:"
          min_matches: 1
          message: "Не указана категория земель. Категория обязательна в соответствии со ст. 7 ЗК РФ (7 категорий: сельскохозяйственного назначения, населённых пунктов, промышленности и т. д.)"

      - check_id: "vri_present"
        rule: "Вид разрешённого использования (ВРИ) земельного участка должен быть указан"
        severity: "high"
        validation:
          type: "keyword_extraction"
          keywords:
            - "вид разрешённого использования"
            - "вид разрешенного использования"
            - "ВРИ"
            - "разрешённое использование"
            - "разрешенное использование"
            - "целевое назначение"
            - "целевое использование"
            - "ИЖС"
            - "для индивидуального жилищного строительства"
            - "ЛПХ"
            - "личное подсобное хозяйство"
            - "садоводство"
            - "огородничество"
            - "для ведения садоводства"
            - "для размещения"
            - "коммерческое использование"
            - "для сельскохозяйственного производства"
            - "под размещение"
          min_matches: 1
          message: "Не указан вид разрешённого использования (ВРИ) земельного участка. ВРИ обязателен в соответствии со ст. 37 ЗК РФ"

      - check_id: "land_area_present"
        rule: "Площадь земельного участка должна быть указана"
        severity: "high"
        validation:
          type: "regex_ref"
          pattern_ref: "AREA_LAND_PATTERN"
          message: "Площадь земельного участка не указана. Ожидаемый формат: «площадью ХХХ кв. м» или «ХХ га»"

  # ── 3. Транспортное средство ───────────────────────────────
  - check_id: "vehicle_detected"
    trigger:
      keywords:
        - "автомобиль"
        - "транспортное средство"
        - "транспорт"
        - "прицеп"
        - "полуприцеп"
        - "мотоцикл"
        - "автобус"
        - "грузовой автомобиль"
        - "легковой автомобиль"
        - "спецтехника"
        - "самоходная машина"
        - "техника"
        - "машина"
        - "VIN"
        - "госномер"
    rule: "Транспортное средство должно быть идентифицировано по марке, модели, VIN, году выпуска и регистрационным данным"
    severity: "high"
    legal_base: "ст. 455, 632 ГК РФ; Приказ МВД РФ от 21.12.2019 № 950 (регистрация транспортных средств)"
    sub_checks:

      - check_id: "vehicle_identification"
        rule: "Марка, модель и идентификационные номера (VIN) должны быть указаны"
        severity: "high"
        validation:
          type: "keyword_extraction"
          keywords:
            - "марка"
            - "модель"
            - "марка/модель"
            - "наименование ТС"
            - "тип ТС"
            - "тип транспортного средства"
            - "VIN"
            - "идентификационный номер"
            - "год выпуска"
            - "года выпуска"
            - "г.в."
            - "гос. номер"
            - "государственный регистрационный номер"
            - "государственный регистрационный знак"
          min_matches: 4
          message: "Недостаточно данных для идентификации транспортного средства. Требуются VIN, марка, модель, год выпуска, госномер."

      - check_id: "vin_present"
        rule: "VIN (идентификационный номер) транспортного средства должен быть указан"
        severity: "high"
        validation:
          type: "regex_ref"
          pattern_ref: "VIN_PATTERN"
          message: "VIN-номер не найден или указан в неверном формате. Ожидается: 17 символов (латинские буквы и цифры, без I, O, Q)"

      - check_id: "vehicle_registration"
        rule: "Регистрационные данные транспортного средства должны быть указаны"
        severity: "medium"
        validation:
          type: "keyword_extraction"
          keywords:
            - "государственный регистрационный номер"
            - "госномер"
            - "гос. номер"
            - "г/н"
            - "регистрационный знак"
            - "ПТС"
            - "паспорт транспортного средства"
            - "свидетельство о регистрации"
            - "СТС"
          min_matches: 1
          message: "Не указаны регистрационные данные транспортного средства (госномер, ПТС, СТС)"

  # ── 4. Товары (купля-продажа, поставка) ────────────────────
  - check_id: "goods_detected"
    trigger:
      keywords:
        - "товар"
        - "продукция"
        - "изделие"
        - "материалы"
        - "сырьё"
        - "сырье"
        - "комплектующие"
        - "оборудование"
        - "запасные части"
        - "спецификация"
        - "партия товара"
        - "поставка"
    rule: "Товар должен быть определён по наименованию, количеству и качественным характеристикам"
    severity: "high"
    legal_base: "ст. 455, 465, 467, 469 ГК РФ (предмет, количество, ассортимент, качество товара)"
    sub_checks:

      - check_id: "goods_name"
        rule: "Наименование (ассортимент) товара должно быть указано"
        severity: "high"
        validation:
          type: "keyword_extraction"
          keywords:
            - "наименование"
            - "наименование товара"
            - "ассортимент"
            - "перечень"
            - "номенклатура"
            - "артикул"
            - "спецификация"
            - "приложение"
            - "согласно спецификации"
            - "в приложении"
          min_matches: 1
          message: "Наименование (ассортимент) товара не указано. Договор купли-продажи считается незаключённым, если невозможно определить наименование и количество товара (ст. 455 ГК РФ)"

      - check_id: "goods_quantity"
        rule: "Количество товара должно быть определено в соответствующих единицах измерения"
        severity: "high"
        validation:
          type: "regex"
          pattern: '(?i)(количество|объём|объем|в количестве|партия|вес|масса)[:\\s]*(\\d+[\\s,.]?\\d*)\\s*(шт\\.?|штук|кг|килограмм|т\\.?|тонн|л\\.?|литр|м\\.?|метр|п\\.?\\s?м|пог\\.?\\s?м|упак|комплект|ед\\.?|единиц|м3|м³|куб\\.?\\s?м|упаков|паллет)'
          message: "Количество товара не указано или указано без единиц измерения. Условие о количестве является существенным (ст. 465 ГК РФ). Ожидаемый формат: «количество: ХХХ шт./кг/т»"

      - check_id: "goods_quality"
        rule: "Требования к качеству товара должны быть определены (ГОСТ, ТУ, образец, описание)"
        severity: "medium"
        validation:
          type: "keyword_extraction"
          keywords:
            - "качество"
            - "ГОСТ"
            - "ТУ"
            - "технические условия"
            - "стандарт"
            - "сертификат"
            - "сертификат качества"
            - "сертификат соответствия"
            - "образец"
            - "эталон"
            - "характеристики"
            - "требования к качеству"
          min_matches: 1
          message: "Не определены требования к качеству товара (ГОСТ, ТУ, описание). Рекомендуется указать стандарт качества или описание характеристик (ст. 469 ГК РФ)"

  # ── 5. Работы (подряд, строительный подряд) ────────────────
  - check_id: "works_detected"
    trigger:
      keywords:
        - "работы"
        - "подряд"
        - "строительство"
        - "ремонт"
        - "монтаж"
        - "демонтаж"
        - "проектирование"
        - "изготовление"
        - "техническое задание"
        - "проектная документация"
        - "смета"
    rule: "Для договоров на выполнение работ должны быть определены содержание, объём работ и их результат"
    severity: "high"
    legal_base: "ст. 702, 708, 740, 743 ГК РФ (предмет договора подряда, техническая документация)"
    sub_checks:

      - check_id: "works_scope_defined"
        rule: "Содержание и объём работ должны быть определены (техническое задание, смета, перечень)"
        severity: "high"
        validation:
          type: "keyword_extraction"
          keywords:
            - "техническое задание"
            - "ТЗ"
            - "объём работ"
            - "объем работ"
            - "перечень работ"
            - "виды работ"
            - "состав работ"
            - "смета"
            - "сметная документация"
            - "проектная документация"
            - "проект"
            - "рабочая документация"
            - "спецификация"
            - "приложение"
            - "задание на проектирование"
          min_matches: 1
          message: "Не определены содержание и объём работ. Необходимо техническое задание, смета или иной документ, описывающий состав работ (ст. 702, 743 ГК РФ)"

      - check_id: "works_result_defined"
        rule: "Результат работ должен быть определён"
        severity: "high"
        validation:
          type: "keyword_extraction"
          keywords:
            - "результат"
            - "результат работ"
            - "объект"
            - "передать результат"
            - "акт выполненных работ"
            - "акт приёмки"
            - "акт приемки"
            - "сдать результат"
            - "готовый объект"
            - "завершение работ"
          min_matches: 1
          message: "Не определён результат работ, подлежащий передаче заказчику (ст. 702 ГК РФ)"

      - check_id: "works_location"
        rule: "Место выполнения работ должно быть указано (для строительного подряда)"
        severity: "medium"
        validation:
          type: "keyword_extraction"
          keywords:
            - "место выполнения"
            - "объект строительства"
            - "строительная площадка"
            - "по адресу"
            - "на объекте"
            - "расположенном"
          min_matches: 1
          message: "Не указано место выполнения работ. Для строительного подряда указание места обязательно"

  # ── 6. Услуги ──────────────────────────────────────────────
  - check_id: "services_detected"
    trigger:
      keywords:
        - "услуги"
        - "оказание услуг"
        - "возмездное оказание"
        - "обслуживание"
        - "консультирование"
        - "консультационные"
        - "юридические услуги"
        - "бухгалтерские услуги"
        - "аудиторские услуги"
        - "транспортные услуги"
        - "охранные услуги"
    rule: "Для договоров оказания услуг должны быть определены вид, содержание и объём услуг"
    severity: "high"
    legal_base: "ст. 779, 781 ГК РФ (предмет договора возмездного оказания услуг)"
    sub_checks:

      - check_id: "services_type_defined"
        rule: "Вид и содержание услуг должны быть конкретно определены"
        severity: "high"
        validation:
          type: "keyword_extraction"
          keywords:
            - "перечень услуг"
            - "виды услуг"
            - "содержание услуг"
            - "состав услуг"
            - "объём услуг"
            - "объем услуг"
            - "техническое задание"
            - "ТЗ"
            - "описание услуг"
            - "наименование услуг"
            - "спецификация"
            - "приложение"
          min_matches: 1
          message: "Не определены вид и содержание услуг. Без конкретизации услуг договор может быть признан незаключённым (ст. 779 ГК РФ)"

      - check_id: "services_deliverables"
        rule: "Должен быть определён порядок фиксации факта оказания услуг (акт, отчёт)"
        severity: "medium"
        validation:
          type: "keyword_extraction"
          keywords:
            - "акт оказанных услуг"
            - "акт об оказании"
            - "акт приёмки"
            - "акт приемки"
            - "отчёт"
            - "отчет"
            - "акт сдачи-приёмки"
            - "акт сдачи-приемки"
            - "подтверждение оказания"
          min_matches: 1
          message: "Не определён порядок подтверждения факта оказания услуг (акт, отчёт). Рекомендуется предусмотреть подписание акта оказанных услуг"

  # ── 7. Объект интеллектуальной собственности ───────────────
  - check_id: "ip_object_detected"
    trigger:
      keywords:
        - "интеллектуальная собственность"
        - "исключительное право"
        - "исключительные права"
        - "лицензия"
        - "лицензионный"
        - "патент"
        - "товарный знак"
        - "программа для ЭВМ"
        - "программное обеспечение"
        - "ПО"
        - "ноу-хау"
        - "секрет производства"
        - "авторское право"
        - "произведение"
        - "изобретение"
        - "полезная модель"
        - "промышленный образец"
        - "база данных"
    rule: "Объект интеллектуальной собственности должен быть индивидуализирован с указанием вида права и объёма передаваемых прав"
    severity: "high"
    legal_base: "ст. 1225, 1233, 1235 ГК РФ (объекты интеллектуальных прав, распоряжение исключительным правом, лицензионный договор)"
    sub_checks:

      - check_id: "ip_object_identification"
        rule: "Объект интеллектуальной собственности должен быть идентифицирован (наименование, номер регистрации, описание)"
        severity: "high"
        validation:
          type: "keyword_extraction"
          keywords:
            - "наименование"
            - "название"
            - "номер патента"
            - "номер свидетельства"
            - "свидетельство о регистрации"
            - "номер регистрации"
            - "дата регистрации"
            - "реестр"
            - "Роспатент"
            - "ФИПС"
            - "описание"
          min_matches: 1
          message: "Объект интеллектуальной собственности не идентифицирован (не указаны наименование, номер регистрации или описание)"

      - check_id: "ip_rights_scope"
        rule: "Должен быть определён объём передаваемых/предоставляемых прав (исключительная/неисключительная лицензия, территория, срок, способы использования)"
        severity: "high"
        validation:
          type: "keyword_extraction"
          keywords:
            - "исключительная лицензия"
            - "неисключительная лицензия"
            - "простая лицензия"
            - "отчуждение исключительного права"
            - "передача исключительного права"
            - "способы использования"
            - "право использования"
            - "территория действия"
            - "территория использования"
            - "сублицензия"
            - "объём прав"
            - "объем прав"
            - "пределы использования"
          min_matches: 1
          message: "Не определён объём передаваемых прав на объект интеллектуальной собственности. Для лицензионного договора обязательно указание вида лицензии и способов использования (ст. 1235 ГК РФ)"

