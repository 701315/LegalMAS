    - "будет согласован дополнительно"
    - "будет согласован сторонами позднее"
    - "по согласованию сторон"
    - "по договорённости"
    - "по договоренности"
    - "подлежит уточнению"
    - "ориентировочный срок"
    - "приблизительный срок"
    - "примерный срок"
    - "срок определяется дополнительным соглашением"
    - "_____"
    - "[указать]"
    - "[срок]"
    - "[дата]"