validation_type: "contract_element"
element: "term"
description: |
  Срок договора — период времени, в течение которого действуют права и обязанности сторон.
  Для договоров подряда (ст. 708 ГК РФ) и аренды зданий (ст. 651 ГК РФ) срок является существенным условием.
  Срок может быть определён календарной датой, истечением периода времени или указанием на неизбежное событие.
legal_base_general: "ст. 190–194 ГК РФ (исчисление сроков); ст. 425 ГК РФ (действие договора); ст. 610 ГК РФ (срок аренды); ст. 708 ГК РФ (сроки выполнения работ)"

# ══════════════════════════════════════════════════════════════════
# СЕКЦИЯ 1: ОБЯЗАТЕЛЬНЫЕ ПРОВЕРКИ (mandatory_checks)
# ══════════════════════════════════════════════════════════════════
mandatory_checks:

  # ── 1. Наличие раздела «Срок действия» ─────────────────────
  - check_id: "term_presence_check"
    rule: "В договоре должен присутствовать раздел, определяющий срок действия договора или порядок его определения"
    severity: "medium"
    legal_base: "ст. 190 ГК РФ (определение срока); ст. 425 ГК РФ (действие договора)"
    validation:
      type: "presence"
      keywords:
        - "срок действия"
        - "срок договора"
        - "период действия"
        - "действует"
        - "вступает в силу"
        - "прекращает действие"
        - "срок действия договора"
        - "действует с"
        - "действует до"
        - "настоящий договор действует"
        - "заключён на срок"
        - "сроком на"
        - "настоящий договор заключен на срок"
      patterns:
        - '(?i)(срок|период).*(договор|действи|оказани|аренд)'
        - '(?i)(действует|вступает).*(с\\s+момент|с\\s+дат|с\\s+\\d)'
        - '(?i)договор.*вступает в силу'
        - '(?i)(заключ[её]н|заключается).*(на\\s+срок|сроком)'
      min_length: 15
    failure_message: "Не найден раздел о сроке действия договора. Рекомендуется определить срок действия, момент вступления в силу и порядок прекращения. Для подряда отсутствие сроков влечёт незаключённость (ст. 708 ГК РФ)."

  # ── 2. Определённость срока ────────────────────────────────
  - check_id: "term_clarity"
    rule: "Срок договора должен быть определён календарной датой, истечением периода времени или указанием на неизбежное событие"
    severity: "high"
    legal_base: "ст. 190 ГК РФ (способы определения срока); п. 1 ст. 314 ГК РФ (срок исполнения обязательства)"
    validation:
      type: "structure_check"
      required_elements:
        - element: "term_definition"
          patterns:
            - '(?i)(с|от)\\s*(\\d{1,2}[\\s./]\\d{1,2}[\\s./]\\d{2,4})'
            - '(?i)(до|по)\\s*(\\d{1,2}[\\s./]\\d{1,2}[\\s./]\\d{2,4})'
            - '(?i)(\\d+|один|два|три|пять|десять)\\s*(лет|год[а-яё]*|месяц[а-яё]*|недел[а-яё]*|дн[а-яё]*|календарн[а-яё]*\\s+дн[а-яё]*|рабоч[а-яё]*\\s+дн[а-яё]*)'
            - '(?i)(срок.*(составляет|равен)\\s*(\\d+)\\s*(лет|год|месяц|дней))'
            - '(?i)(бессрочн|неопределённ.*срок|неопределенн.*срок|без указания срока|неограниченный срок)'
            - '(?i)(до\\s+момента|до\\s+полного|до\\s+исполнения|до\\s+завершения|до полного исполнения сторонами обязательств)'
            - '(?i)(с\\s+момента\\s+подписания|со\\s+дня\\s+подписания|с\\s+даты\\s+подписания)'
            - '(?i)(с\\s+момента\\s+регистрации|со\\s+дня\\s+регистрации|с\\s+даты\\s+регистрации)'
      negative_keywords:
        - "будет определено"
        - "будет определён"
        - "будет определен позднее"
        - "по согласованию сторон"
        - "по договорённости"
        - "по договоренности"
        - "подлежит уточнению"
        - "срок не установлен"
        - "срок определяется дополнительным соглашением"
        - "будет согласован сторонами позднее"
        - "_____"
        - "[указать]"
        - "[срок]"
      min_matches: 1
    failure_message: "Срок договора недостаточно определён. Отсутствуют конкретная дата, период или указание на событие. Срок должен быть установлен одним из способов, предусмотренных ст. 190 ГК РФ."

  # ── 3. Момент вступления договора в силу ───────────────────
  - check_id: "effectiveness_moment"
    rule: "Должен быть определён момент, с которого договор вступает в силу и порождает права и обязанности сторон"
    severity: "medium"
    legal_base: "ст. 425 ГК РФ (действие договора); ст. 433 ГК РФ (момент заключения договора)"
    validation:
      type: "keyword_extraction"
      keywords:
        - "вступает в силу"
        - "с момента подписания"
        - "с момента заключения"
        - "со дня подписания"
        - "с даты подписания"
        - "с момента регистрации"
        - "с момента государственной регистрации"
        - "с момента получения"
        - "с момента передачи"
        - "действует с"
        - "начинает действовать"
        - "считается заключённым"
        - "считается заключенным"
        - "с даты"
        - "начало действия"
        - "вступает в силу с момента подписания"
      min_matches: 1
    failure_message: "Не определён момент вступления договора в силу. Рекомендуется указать: «Настоящий договор вступает в силу с момента подписания / с даты ДД.ММ.ГГГГ / с момента государственной регистрации»."

# ══════════════════════════════════════════════════════════════════
# СЕКЦИЯ 2: УСЛОВНЫЕ ПРОВЕРКИ (conditional_checks)
# ══════════════════════════════════════════════════════════════════
conditional_checks:

  # ── 1. Срочный договор (определённый срок) ─────────────────
  - check_id: "fixed_term_detected"
    trigger:
      keywords:
        - "сроком на"
        - "на срок"
        - "действует до"
        - "действует по"
        - "заключён на"
        - "заключен на"
        - "лет"
        - "год"
        - "месяц"
      patterns:
        - '(?i)\\d{1,2}[\\s./]\\d{1,2}[\\s./]\\d{2,4}'
        - '(?i)\\d+\\s*(лет|год[а-яё]*|месяц[а-яё]*)'
        - '(?i)(\\d+|один|два|три|пять|десять)\\s*(лет|год)'
        - '(?i)(с|от)[\\s\\S]{0,5}\\d{1,2}[\\s./]\\d{1,2}[\\s./]\\d{2,4}[\\s\\S]{0,30}(до|по)[\\s\\S]{0,5}\\d{1,2}[\\s./]\\d{1,2}[\\s./]\\d{2,4}'
    rule: "Для срочного договора должны быть определены дата начала, дата окончания (или период), и даты должны быть логически согласованы"
    severity: "medium"
    legal_base: "ст. 190, 191 ГК РФ (определение и начало течения срока); ст. 190-192 ГК РФ"
    sub_checks:

      - check_id: "start_date_present"
        rule: "Дата начала действия договора должна быть указана (конкретная дата или событие)"
        severity: "medium"
        validation:
          type: "regex"
          pattern: '(?i)(вступает\\s+в\\s+силу|действует\\s+с|начинает\\s+действовать|с\\s+момента\\s+подписания|с\\s+даты\\s+подписания|со\\s+дня\\s+подписания|начало\\s+действия|срок исчисляется|вступает в силу|действует|срок исчисляется)\\s*(с|со)?\\s*(\\d{1,2}[\\s./]\\d{1,2}[\\s./]\\d{2,4}|момент[а-яё]*\\s+(подписания|регистрации|передачи|получения|дат[а-яё]*\\s+подписания))'
          message: "Дата (момент) начала действия договора не указана. Ожидается: «действует с ДД.ММ.ГГГГ» или «с момента подписания»."

      - check_id: "end_date_present"
        rule: "Дата окончания действия договора или период действия должны быть указаны"
        severity: "medium"
        validation:
          type: "regex"
          pattern: '(?i)((до|по)\\s*(\\d{1,2}[\\s./]\\d{1,2}[\\s./]\\d{2,4})|(сроком\\s+)?на\\s+(\\d+|один|два|три|пять|десять)\\s*(лет|год[а-яё]*|месяц[а-яё]*|недел[а-яё]*|дн[а-яё]*|календарн[а-яё]*\\s+дн[а-яё]*|рабоч[а-яё]*\\s+дн[а-яё]*)|(до\\s+момента\\s+(исполнения|завершения|выполнения|окончания))|(действует\\s+(до|по)|до\\s+окончания|сроком\\s+на)\\s*(\\d{2}\\.\\d{2}\\.\\d{4}|\\d+\\s*(год|лет|месяц)))'
          message: "Дата окончания или период действия договора не указаны. Ожидается: «до ДД.ММ.ГГГГ» или «сроком на X лет/месяцев»."

      - check_id: "dates_consistency"
        rule: "Дата окончания договора должна быть позже даты начала"
        severity: "low"
        validation:
          type: "logic_check"
          message: "Проверьте корректность указанных дат: дата окончания (прекращения) должна быть позже даты начала действия. Несогласованность дат может повлечь споры о сроке действия."

      - check_id: "term_maximum_compliance"
        rule: "Срок договора не должен превышать установленные законом максимальные сроки"
        severity: "medium"
        validation:
          type: "logic_check"
          message: "Проверьте соответствие срока договора законодательным ограничениям: аренда земли сельхозназначения — до 49 лет (ст. 9 ФЗ-101); аренда лесного участка — до 49 лет (ст. 72 ЛК РФ); аренда водного объекта — до 20 лет (ст. 14 ВК РФ)."

  # ── 2. Долгосрочная аренда недвижимости (> 1 года) ─────────
  - check_id: "long_term_lease_detected"
    trigger:
      keywords:
        - "аренда"
        - "арендодатель"
        - "арендатор"
        - "арендная плата"
        - "наём"
        - "пользование"
        - "лет"
        - "год"
        - "месяцев"
      patterns:
        - '(?i)(\\d+)\\s*лет'
        - '(?i)([1-9]\\d*|один|два|три|пять|десять)\\s*(год|лет)'
        - '(?i)(1[2-9]|[2-9]\\d)\\s*месяц'
        - '(?i)(аренд)[а-яё]*[\\s\\S]{0,100}(\\d+)\\s*(лет|год)'
        - '(?i)(более года|свыше года)'
    rule: "Договор аренды недвижимости сроком 1 год и более подлежит обязательной государственной регистрации"
    severity: "high"
    legal_base: "п. 2 ст. 651 ГК РФ (аренда здания/сооружения ≥ 1 года подлежит госрегистрации); п. 2 ст. 26 ЗК РФ (аренда земельного участка ≥ 1 года подлежит госрегистрации); Информационное письмо Президиума ВАС РФ от 01.06.2000 № 53"
    sub_checks:

      - check_id: "registration_clause_present"
        rule: "Договор должен содержать условие об обязательной государственной регистрации"
        severity: "high"
        validation:
          type: "keyword_extraction"
          keywords:
            - "государственная регистрация"
            - "госрегистрация"
            - "гос. регистрация"
            - "подлежит регистрации"
            - "подлежит государственной регистрации"
            - "регистрируется"
            - "Росреестр"
            - "Управление Росреестра"
            - "регистрирующий орган"
            - "орган регистрации прав"
            - "ЕГРН"
            - "Единый государственный реестр недвижимости"
            - "регистрация права"
            - "регистрация договора"
            - "с момента государственной регистрации"
            - "органе регистрации прав"
          min_matches: 1
          message: "Не указано условие о государственной регистрации договора аренды недвижимости. Договор аренды здания (сооружения) сроком ≥ 1 года считается заключённым с момента госрегистрации (п. 2 ст. 651 ГК РФ)."

      - check_id: "registration_costs"
        rule: "Должно быть определено, какая сторона несёт расходы на государственную регистрацию"
        severity: "medium"
        validation:
          type: "keyword_extraction"
          keywords:
            - "расходы на регистрацию"
            - "расходы по регистрации"
            - "затраты на регистрацию"
            - "госпошлина"
            - "государственная пошлина"
            - "несёт расходы"
            - "несет расходы"
            - "оплачивает регистрацию"
            - "за счёт"
            - "за счет"
            - "расходы по государственной регистрации"
            - "расходы возлагаются"
            - "расходы распределяются"
            - "оплачивает госпошлину"
            - "несет расходы"
            - "обязанность по регистрации"
          min_matches: 1
          message: "Не определено, какая сторона несёт расходы на государственную регистрацию договора (госпошлина). Рекомендуется: «Расходы по государственной регистрации несёт [сторона]»."

      - check_id: "registration_obligation"
        rule: "Должно быть определено, какая сторона обязана обеспечить подачу документов на регистрацию"
        severity: "medium"
        validation:
          type: "keyword_extraction"
          keywords:
            - "обязуется обеспечить регистрацию"
            - "обязан подать"
            - "обязана подать"
            - "обязуется предоставить документы"
            - "содействовать регистрации"
            - "совместно обратиться"
            - "совместное обращение"
            - "подача документов"
            - "подать заявление"
            - "обеспечить регистрацию"
          min_matches: 1
          message: "Не определено, какая сторона обязана обеспечить подачу документов на государственную регистрацию."

  # ── 3. Бессрочный договор (неопределённый срок) ────────────
  - check_id: "indefinite_term_detected"
    trigger:
      keywords:
        - "бессрочн"
        - "неопределённый срок"
        - "неопределенный срок"
        - "на неопределённый срок"
        - "на неопределенный срок"
        - "без указания срока"
        - "без ограничения срока"
        - "срок действия не ограничен"
        - "срок не определён"
        - "срок не определен"
        - "неопределенного срока"
        - "неопределенном сроке"
    rule: "Для бессрочного (заключённого на неопределённый срок) договора должен быть установлен порядок одностороннего отказа с указанием срока предварительного уведомления"
    severity: "medium"
    legal_base: "п. 2 ст. 610 ГК РФ (право отказа от бессрочной аренды с предупреждением за 3 месяца для недвижимости, за 1 месяц — для движимого имущества); ст. 450.1, 610, 620 ГК РФ (односторонний отказ от договора, расторжение бессрочной аренды)"
    sub_checks:

      - check_id: "termination_notice_period"
        rule: "Срок предварительного уведомления о расторжении (отказе от договора) должен быть указан"
        severity: "high"
        validation:
          type: "regex"
          pattern: '(?i)(уведом|предупредив|известив|уведомив|уведомление|предупреждение).{1,50}(за|не позднее).{1,20}(\\d+|один|два|три).{1,20}(дн|месяц|дней|месяцев|календарных дней)'
          message: "Не указан срок предварительного уведомления о расторжении бессрочного договора. По закону: для недвижимости — за 3 месяца, для движимого имущества — за 1 месяц (п. 2 ст. 610 ГК РФ), если иное не установлено договором."

      - check_id: "termination_procedure"
        rule: "Должен быть определён порядок направления уведомления о расторжении (форма, способ доставки)"
        severity: "medium"
        validation:
          type: "keyword_extraction"
          keywords:
            - "в письменной форме"
            - "письменное уведомление"
            - "заказное письмо"
            - "заказным письмом"
            - "с уведомлением о вручении"
            - "нарочным"
            - "курьером"
            - "по электронной почте"
            - "способом, подтверждающим"
            - "направить уведомление"
            - "вручить уведомление"
            - "уведомление в письменной форме"
          min_matches: 1
          message: "Не определён порядок направления уведомления о расторжении (письменная форма, способ доставки). Рекомендуется: «путём направления письменного уведомления заказным письмом с уведомлением о вручении»."

  # ── 4. Автоматическое продление (пролонгация) ─────────────
  - check_id: "auto_renewal_detected"
    trigger:
      keywords:
        - "автоматически продлевается"
        - "автоматически пролонгируется"
        - "пролонгация"
        - "продление"
        - "продлевается"
        - "возобновляется"
        - "считается продлённым"
        - "считается продленным"
        - "если ни одна из сторон"
        - "если ни одна сторона"
        - "при отсутствии возражений"
        - "на тех же условиях"
        - "на новый срок"
        - "автоматическое продление"
    rule: "Условие об автоматическом продлении (пролонгации) договора должно содержать: срок продления, количество пролонгаций, порядок уведомления о непродлении"
    severity: "low"
    legal_base: "п. 2 ст. 621 ГК РФ (возобновление аренды на неопределённый срок); ст. 425 ГК РФ (действие договора); ст. 621 ГК РФ"
    sub_checks:

      - check_id: "renewal_period"
        rule: "Должен быть указан срок, на который договор продлевается при пролонгации"
        severity: "medium"
        validation:
          type: "keyword_extraction"
          keywords:
            - "на тот же срок"
            - "на аналогичный срок"
            - "на такой же срок"
            - "каждый раз на"
            - "на один год"
            - "на 1 год"
            - "на очередной"
            - "на следующий"
            - "на новый срок"
            - "на неопределённый срок"
            - "на неопределенный срок"
            - "на аналогичных условиях"
            - "аналогичный период"
          min_matches: 1
          message: "Не указан срок, на который договор продлевается при автоматической пролонгации. Рекомендуется: «продлевается на тот же срок» или «на 1 (один) год»."

      - check_id: "non_renewal_notice"
        rule: "Должен быть определён порядок уведомления о непродлении (отказе от пролонгации)"
        severity: "medium"
        validation:
          type: "keyword_extraction"
          keywords:
            - "уведомление о непродлении"
            - "уведомление об отказе"
            - "заявит о расторжении"
            - "заявит о прекращении"
            - "направит уведомление"
            - "предупредит"
            - "письменно сообщит"
            - "если ни одна из сторон не заявит"
            - "если ни одна из сторон не уведомит"
            - "не позднее чем за"
            - "за 30 дней до"
            - "за месяц до"
          min_matches: 1
          message: "Не определён порядок уведомления о непродлении (отказе от пролонгации). Рекомендуется: «если ни одна из сторон не направит письменное уведомление о расторжении не позднее чем за ХХ дней до окончания срока»."

      - check_id: "renewal_limit"
        rule: "Рекомендуется установить ограничение количества автоматических пролонгаций"
        severity: "low"
        validation:
          type: "keyword_extraction"
          keywords:
            - "не более"
            - "количество продлений"
            - "однократно"
            - "неограниченное число раз"
            - "неоднократно"
            - "каждый раз"
            - "многократно"
          min_matches: 1
          message: "Не указано ограничение количества автоматических пролонгаций. Рекомендуется определить: «продлевается неограниченное количество раз» или «не более X раз»."

  # ── 5. Сроки выполнения работ (подряд) ────────────────────
  - check_id: "works_deadlines_detected"
    trigger:
      keywords:
        - "срок выполнения"
        - "сроки выполнения"
        - "срок начала работ"
        - "срок окончания работ"
        - "начало работ"
        - "окончание работ"
        - "завершение работ"
        - "график выполнения"
        - "график производства работ"
        - "промежуточные сроки"
        - "этап"
        - "этапы работ"
        - "подряд"
        - "подрядчик обязуется"
        - "выполнение работ"
        - "оказание услуг"
        - "срок оказания"
    rule: "Для договоров подряда сроки начала и окончания работ являются существенным условием и должны быть определены"
    severity: "critical"
    legal_base: "ст. 708 ГК РФ (сроки выполнения работы — существенное условие подряда); п. 1 ст. 740 ГК РФ (строительный подряд); ст. 783, 779 ГК РФ (срок оказания услуг)"
    sub_checks:

      - check_id: "works_start_date"
        rule: "Дата (момент) начала выполнения работ должна быть указана"
        severity: "critical"
        validation:
          type: "regex"
          pattern: '(?i)(начало\\s+(работ|выполнения)|срок\\s+начала|приступить\\s+к\\s+(работ|выполнению)|начать\\s+(работ|выполнени))[\\s\\S]{0,40}(\\d{1,2}[\\s./]\\d{1,2}[\\s./]\\d{2,4}|в\\s+течение|с\\s+момент[а-яё]*|со\\s+дня|после\\s+(подписания|получения|передачи))'
          message: "Не указана дата (момент) начала выполнения работ. Для подряда — существенное условие (ст. 708 ГК РФ). Ожидается: «начало работ: ДД.ММ.ГГГГ» или «в течение X дней с момента подписания»."

      - check_id: "works_end_date"
        rule: "Дата (момент) окончания выполнения работ должна быть указана"
        severity: "critical"
        validation:
          type: "regex"
          pattern: '(?i)(окончание\\s+(работ|выполнения)|срок\\s+окончания|завершение\\s+работ|завершить\\s+(работ|выполнени)|выполнить\\s+(работ|в\\s+срок))[\\s\\S]{0,40}(\\d{1,2}[\\s./]\\d{1,2}[\\s./]\\d{2,4}|в\\s+течение|не\\s+позднее)'
          message: "Не указана дата (момент) окончания выполнения работ. Для подряда — существенное условие (ст. 708 ГК РФ). Ожидается: «окончание работ: ДД.ММ.ГГГГ» или «не позднее ДД.ММ.ГГГГ»."

      - check_id: "intermediate_deadlines"
        rule: "Для комплексных работ рекомендуется установить промежуточные сроки (этапы)"
        severity: "low"
        validation:
          type: "keyword_extraction"
          keywords:
            - "промежуточные сроки"
            - "этап"
            - "этапы"
            - "график выполнения"
            - "график производства"
            - "календарный план"
            - "календарный график"
            - "план-график"
            - "этапы работ"
          min_matches: 1
          message: "Не установлены промежуточные сроки (этапы) выполнения работ. Рекомендуется для комплексных работ (ст. 708 ГК РФ допускает промежуточные сроки)."

  # ── 6. Досрочное расторжение ──────────────────────────────
  - check_id: "early_termination_detected"
    trigger:
      keywords:
        - "досрочное расторжение"
        - "досрочно расторгнуть"
        - "расторжение договора"
        - "прекращение договора"
        - "односторонний отказ"
        - "одностороннее расторжение"
        - "право расторгнуть"
        - "отказаться от договора"
        - "отказ от исполнения"
        - "расторгнут по инициативе"
    rule: "Условия досрочного расторжения должны содержать основания, порядок уведомления и последствия расторжения"
    severity: "medium"
    legal_base: "ст. 450, 450.1, 451, 452 ГК РФ (основания и порядок изменения и расторжения договора); ст. 619, 620 ГК РФ (расторжение аренды)"
    sub_checks:

      - check_id: "termination_grounds"
        rule: "Должны быть указаны основания для досрочного расторжения (нарушение обязательств, обстоятельства)"
        severity: "medium"
        validation:
          type: "keyword_extraction"
          keywords:
            - "в случае"
            - "при нарушении"
            - "при существенном нарушении"
            - "в случае неисполнения"
            - "в случае ненадлежащего исполнения"
            - "основания расторжения"
            - "вправе расторгнуть"
            - "имеет право расторгнуть"
            - "по основаниям"
            - "существенное нарушение"
            - "неоднократное нарушение"
            - "просрочка более"
          min_matches: 1
          message: "Не указаны конкретные основания для досрочного расторжения договора. Рекомендуется перечислить основания (существенное нарушение, просрочка и т. д.)."

      - check_id: "termination_notice_requirement"
        rule: "Должен быть определён порядок уведомления о расторжении (срок, форма)"
        severity: "medium"
        validation:
          type: "keyword_extraction"
          keywords:
            - "уведомление о расторжении"
            - "письменное уведомление"
            - "направить уведомление"
            - "предупредить за"
            - "уведомить за"
            - "предварительно уведомив"
            - "в письменной форме"
            - "не менее чем за"
            - "не позднее чем за"
          min_matches: 1
          message: "Не определён порядок уведомления о досрочном расторжении (срок предупреждения, форма уведомления)."

      - check_id: "termination_consequences"
        rule: "Должны быть определены последствия досрочного расторжения (возврат имущества, взаиморасчёты, компенсации)"
        severity: "medium"
        validation:
          type: "keyword_extraction"
          keywords:
            - "последствия расторжения"
            - "при расторжении"
            - "в случае расторжения"
            - "возврат"
            - "возвратить"
            - "взаиморасчёты"
            - "взаиморасчеты"
            - "окончательный расчёт"
            - "окончательный расчет"
            - "компенсация"
            - "штраф за досрочное"
            - "возмещение убытков"
            - "неустойка за расторжение"
          min_matches: 1
          message: "Не определены последствия досрочного расторжения (порядок возврата имущества, взаиморасчётов, компенсаций). Рекомендуется во избежание споров."

  # ── 7. Гарантийный срок ───────────────────────────────────
  - check_id: "guarantee_period_detected"
    trigger:
      keywords:
        - "гарантийный срок"
        - "гарантия"
        - "гарантийный период"
        - "гарантийное обязательство"
        - "гарантия качества"
        - "гарантийные обязательства"
        - "гарантийное обслуживание"
    rule: "Гарантийный срок должен быть конкретно определён: продолжительность, момент начала, порядок предъявления требований"
    severity: "medium"
    legal_base: "ст. 470, 471 ГК РФ (гарантия качества товара); ст. 722, 724 ГК РФ (гарантия качества в подряде); ст. 755, 756 ГК РФ (гарантии качества в строительном подряде)"
    sub_checks:

      - check_id: "guarantee_duration"
        rule: "Продолжительность гарантийного срока должна быть указана"
        severity: "medium"
        validation:
          type: "regex"
          pattern: '(?i)(гарантийн[а-яё]*\\s+(срок|период))[\\s\\S]{0,40}(\\d+)\\s*(лет|год[а-яё]*|месяц[а-яё]*|дн[а-яё]*)'
          message: "Не указана продолжительность гарантийного срока. Ожидается: «гарантийный срок составляет X лет/месяцев»."

      - check_id: "guarantee_start_moment"
        rule: "Должен быть определён момент начала течения гарантийного срока"
        severity: "medium"
        validation:
          type: "keyword_extraction"
          keywords:
            - "с момента передачи"
            - "с даты передачи"
            - "со дня передачи"
            - "с момента подписания акта"
            - "с даты подписания акта"
            - "со дня подписания акта"
            - "с момента приёмки"
            - "с момента приемки"
            - "с даты приёмки"
            - "с даты приемки"
            - "с момента ввода в эксплуатацию"
            - "с даты ввода в эксплуатацию"
            - "со дня ввода"
          min_matches: 1
          message: "Не определён момент начала течения гарантийного срока. Рекомендуется: «с момента подписания акта приёмки / с даты передачи товара»."

      - check_id: "guarantee_claim_procedure"
        rule: "Должен быть определён порядок предъявления требований в гарантийный период"
        severity: "low"
        validation:
          type: "keyword_extraction"
          keywords:
            - "гарантийное обращение"
            - "гарантийная рекламация"
            - "рекламация"
            - "претензия"
            - "уведомить о недостатках"
            - "сообщить о дефектах"
            - "обнаружение недостатков"
            - "выявление дефектов"
            - "устранение недостатков"
            - "замена"
            - "ремонт"
            - "безвозмездное устранение"
            - "срок устранения"
          min_matches: 1
          message: "Не определён порядок предъявления гарантийных требований (форма обращения, срок устранения недостатков, способ устранения)."

  # ── 8. Приостановление / продление сроков ──────────────────
  - check_id: "term_suspension_detected"
    trigger:
      keywords:
        - "приостановление"
        - "приостанавливается"
        - "приостановить"
        - "продление срока"
        - "продлевается на"
        - "перенос срока"
        - "переносится"
        - "форс-мажор"
        - "обстоятельства непреодолимой силы"
        - "непреодолимая сила"
    rule: "Условия приостановления или продления сроков должны содержать основания, порядок уведомления и последствия"
    severity: "low"
    legal_base: "ст. 401 ГК РФ (основания ответственности — непреодолимая сила); ст. 328 ГК РФ (встречное исполнение)"
    sub_checks:

      - check_id: "suspension_grounds"
        rule: "Должны быть указаны основания для приостановления / продления сроков"
        severity: "medium"
        validation:
          type: "keyword_extraction"
          keywords:
            - "в случае"
            - "при наступлении"
            - "обстоятельства непреодолимой силы"
            - "форс-мажор"
            - "не по вине"
            - "по причинам, не зависящим"
            - "по вине заказчика"
            - "при задержке"
            - "при невыполнении"
            - "стихийное бедствие"
            - "пандемия"
            - "санкции"
          min_matches: 1
          message: "Упомянуто приостановление/продление сроков, но не указаны конкретные основания."

      - check_id: "suspension_notification"
        rule: "Должен быть определён порядок уведомления о наступлении обстоятельств, влияющих на сроки"
        severity: "medium"
        validation:
          type: "keyword_extraction"
          keywords:
            - "уведомить"
            - "сообщить"
            - "известить"
            - "в течение"
            - "незамедлительно"
            - "не позднее"
            - "подтверждающие документы"
            - "доказательства"
          min_matches: 1
          message: "Не определён порядок уведомления о наступлении обстоятельств, влекущих приостановление/продление сроков (срок уведомления, подтверждающие документы)."

# ══════════════════════════════════════════════════════════════════
# СЕКЦИЯ 3: СПРАВОЧНЫЕ ДАННЫЕ (reference_data)
# ══════════════════════════════════════════════════════════════════
reference_data:

  term_determination_methods:
    - method: "calendar_date"
      description: "Определение срока календарной датой (ст. 190 ГК РФ)"
      examples: ["с 01.01.2025", "до 31.12.2025", "с 01.01.2024", "до 31.12.2026"]
    - method: "time_period"
      description: "Определение срока истечением периода времени (годы, месяцы, недели, дни)"
      examples: ["сроком на 3 года", "на 12 месяцев", "в течение 30 дней", "на 11 месяцев", "на 5 лет"]
    - method: "inevitable_event"
      description: "Определение срока указанием на событие, которое должно неизбежно наступить"
      examples: ["до момента полного исполнения обязательств", "до ввода объекта в эксплуатацию", "до полного исполнения сторонами обязательств"]
    - method: "indefinite"
      description: "Договор заключён на неопределённый срок"
      examples: ["на неопределённый срок", "бессрочно", "без ограничения срока", "неопределенный срок"]

  common_term_phrases:
    - "с момента подписания"
    - "со дня подписания"
    - "с даты подписания"
    - "с момента государственной регистрации"
    - "до момента исполнения обязательств"
    - "до полного исполнения"
    - "на неопределённый срок"
    - "бессрочный"
    - "сроком на"
    - "на срок"
    - "вступает в силу"
    - "прекращает действие"
    - "считается расторгнутым"
    - "вступает в силу с момента подписания"
    - "действует до полного исполнения обязательств"
    - "заключен на неопределенный срок"
    - "заключен сроком на 11 месяцев"

  period_keywords:
    - "лет"
    - "год"
    - "года"
    - "месяц"
    - "месяцев"
    - "месяца"
    - "неделя"
    - "недель"
    - "день"
    - "дней"
    - "дня"
    - "календарных дней"
    - "рабочих дней"
    - "квартал"
    - "кварталов"

  maximum_terms_by_law:
    - type: "Аренда земли сельхозназначения"
      max_term: "49 лет"
      legal_base: "п. 3 ст. 9 ФЗ-101 «Об обороте земель сельскохозяйственного назначения»"
    - type: "Аренда лесного участка"
      max_term: "49 лет"
      legal_base: "ч. 3 ст. 72 Лесного кодекса РФ"
    - type: "Аренда водного объекта"
      max_term: "20 лет"
      legal_base: "ч. 2 ст. 14 Водного кодекса РФ"
    - type: "Договор доверительного управления"
      max_term: "5 лет"
      legal_base: "ст. 1016 ГК РФ"
    - type: "Договор найма жилого помещения"
      max_term: "5 лет"
      legal_base: "ст. 683 ГК РФ"

  registration_requirements:
    - type: "Аренда здания/сооружения"
      threshold: "≥ 1 года"
      legal_base: "п. 2 ст. 651 ГК РФ"
      consequence: "Без регистрации договор считается незаключённым"
    - type: "Аренда земельного участка"
      threshold: "≥ 1 года"
      legal_base: "п. 2 ст. 26 ЗК РФ"
      consequence: "Без регистрации договор считается незаключённым"
    - type: "Аренда предприятия"
      threshold: "Любой срок"
      legal_base: "ст. 658 ГК РФ"
      consequence: "Без регистрации договор считается незаключённым"

  termination_notice_defaults:
