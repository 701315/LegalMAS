# docker-compose.yml

version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: mas_dd_postgres
    environment:
      POSTGRES_DB: mas_dd
      POSTGRES_USER: mas
      POSTGRES_PASSWORD: mas_dev_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mas -d mas_dd"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mas_dd_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: mas_dd_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  office-converter:
    build:
      context: ./office-converter
      dockerfile: Dockerfile
    container_name: mas_dd_office_converter
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis
      - minio


volumes:
  pgdata:
  redis_data:
  minio_data:
