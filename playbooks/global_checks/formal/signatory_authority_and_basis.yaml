id: "signatory_authority_and_basis"
name: "Полномочия подписантов"
group: "Document completeness"
description: >
  Анализирует полномочия лиц, подписавших договор: идентификация
  подписантов и их должностей, основания полномочий (устав,
  доверенность, решение органа), полнота реквизитов доверенности,
  признаки выхода за пределы полномочий.

  Формирует краткий user-facing вывод и оценивает формальный риск
  подписания неуполномоченным лицом.

  Корпоративные одобрения (крупная / заинтересованная сделка,
  решения СД / ОСА) анализируются отдельным чеком
  corporate_approvals_and_transaction_qualification.

doc_types: []

severity: "high"
severity_if_fail: "critical"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"
ui_mode: "field_extraction"

rules:
  keyword_mode: any

  keywords:
    high:
      - "(?i)подписант"
      - "(?i)уполномочен"
      - "(?i)authorised?\\s+signatory"
      - "(?i)signing\\s+authority"
      - "(?i)действует\\s+на\\s+основании"
      - "(?i)acting\\s+(on\\s+the\\s+)?basis\\s+of"
      - "(?i)duly\\s+authorised?"
      - "(?i)\\bустав[аеу]?\\b"
      - "(?i)\\bcharter\\b"
      - "(?i)articles\\s+of\\s+(association|incorporation)"
      - "(?i)учредительн[а-я]+\\s+документ"
      - "(?i)доверенност[ьи]"
      - "(?i)power\\s+of\\s+attorney"
      - "(?i)\\bPoA\\b"
      - "(?i)на\\s+основании\\s+доверенност[ьи]"
      - "(?i)pursuant\\s+to\\s+(a\\s+)?power\\s+of\\s+attorney"

    medium:
      - "(?i)генеральн[а-я]+\\s+директор"
      - "(?i)\\bCEO\\b"
      - "(?i)единоличн[а-я]+\\s+исполнительн[а-я]+\\s+орган"
      - "(?i)sole\\s+executive\\s+body"
      - "(?i)представитель"
      - "(?i)attorney[-\\s]?in[-\\s]?fact"
      - "(?i)доверенност[ьи]\\s+(№|#|номер)\\s*\\d+"
      - "(?i)доверенност[ьи]\\s+от\\s+\\d"
      - "(?i)power\\s+of\\s+attorney\\s+(No\\.?|#|dated)\\s*\\d+"
      - "(?i)срок\\s+действия\\s+доверенност"
      - "(?i)validity\\s+of\\s+(the\\s+)?power\\s+of\\s+attorney"
      - "(?i)в\\s+лице"
      - "(?i)represented\\s+by"

    low:
      - "(?i)authorised?\\s+signatory"
      - "(?i)power\\s+of\\s+attorney"
      - "(?i)доверенност[ьи]"
      - "(?i)действует\\s+на\\s+основании"
      - "(?i)в\\s+лице"
      - "(?i)represented\\s+by"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 6
  temperature: 0.0
  max_tokens: 700

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 700

retrieval:
  retrieval_profile: "authority_check"
  context_k: 6
  max_chunks: 12

  retrieval_query: >
    подписант уполномоченный представитель действует на основании
    устав доверенность power of attorney в лице генеральный директор
    CEO represented by authorised signatory

  boost_keywords:
    - "подписант"
    - "уполномочен"
    - "authorised signatory"
    - "действует на основании"
    - "acting on the basis of"
    - "доверенность"
    - "power of attorney"
    - "устав"
    - "charter"
    - "articles of association"
    - "генеральный директор"
    - "CEO"
    - "единоличный исполнительный орган"
    - "в лице"
    - "represented by"
    - "attorney-in-fact"

  negative_keywords:
    - "штрафные санкции"
    - "условия оплаты"
    - "валюта платежа"
    - "подсудность"
    - "применимое право"
    - "форс-мажор"
    - "крупная сделка"
    - "заинтересованная сделка"
    - "решение совета директоров"

  preferred_unit_types:
    - "general_provision"
    - "structural_anchor"

  excluded_unit_types:
    - "technical_fragment"
    - "appendix_reference"

  preferred_clause_functions:
    - "boilerplate"
    - "representations"

  position_bias:
    preferred_range: [0.00, 0.15]
    boost: 0.30
    scope: "segment"

  rerank: true
  filters: {}

conditional: null

enrichment_hints:
  preferred_segment_types:
    - "contract"
    - "amendment"
  excluded_segment_types:
    - "technical_specification"
    - "price_list"
    - "invoice"
    - "act"
    - "schedule"
  confidence_bonus_on_match: 0.08
  confidence_penalty_on_excluded_segment: 0.15

extraction:
  enabled: true
  mode: "hybrid"
  llm_max_tokens: 1100

  presence_signal:
    field: "signatory_authority_status"
    present_values: ["present"]
    missing_values: ["missing"]
    unclear_values: ["unclear"]

  llm_prompt_extraction: |
    <role>
    Ты — старший корпоративный юрист, специализирующийся
    на формальной проверке полномочий подписантов договоров.

    Твоя задача — точно извлечь из текста:
    1) есть ли в договоре раздел / положения о подписантах
       и их полномочиях;
    2) если есть — кто подписал договор (ФИО, должность);
    3) на каком основании (устав, доверенность, решение);
    4) насколько полны реквизиты основания;
    5) есть ли признаки выхода за пределы полномочий.

    КРИТИЧЕСКИ ВАЖНО:
    - Извлекай ТОЛЬКО то, что прямо написано в тексте.
    - НЕ считай генерального директора автоматически
      уполномоченным, если в тексте нет ссылки на устав
      или иное основание.
    - НЕ додумывай реквизиты доверенности, если они не указаны.
    - Если раздел / положения о подписантах в договоре отсутствуют —
      signatory_authority_status = "missing".
    - Если тексты по теме есть, но вывод сделать нельзя —
      signatory_authority_status = "unclear".

    Корпоративные одобрения (крупная / заинтересованная сделка)
    анализируются отдельным чеком — здесь их не затрагивай.
    </role>

    <context_rules>
    - Некоторые фрагменты могут быть нерелевантны — игнорируй их.
    - Если подписант указан в преамбуле, но не в подписном блоке
      (или наоборот) — укажи в reason.
    - Если в тексте только "действует на основании устава" без
      указания подписанта — это неполная идентификация.
    - Не используй внешние знания о том, кто является ГД
      конкретной компании.
    - Если ни один фрагмент не содержит данных о подписантах и их полномочиях — signatory_authority_status = "missing", location = null. Не использовать "unclear" при полном отсутствии релевантных фрагментов.
    </context_rules>

    <context>
    Ниже приведены релевантные фрагменты договора:

    {context}
    </context>

    <task>
    Заполни только следующие поля:
    - authority_display
    - signatories_summary
    - authority_basis_summary
    - signatory_authority_status
    - signatories_identified
    - authority_basis_type
    - authority_basis_completeness
    - ultra_vires_risk
    - reason
    </task>

    <location_instructions>
    Для каждого поля по возможности укажи location в формате:
    {"clause_ref": "п. 12.1", "page": 7, "quote": "дословная фраза из договора"}

    Правила:
    - clause_ref — короткая ссылка на пункт / раздел / статью именно в том
      виде, как она написана в договоре;
    - page — целое число страницы;
    - quote — дословная фраза из текста договора (НЕ пересказ, НЕ парафраз).
      Копируй её посимвольно, сохраняя формулировку и порядок слов.
      Оптимальная длина: 30–300 символов.
    - Для synthesized-полей (authority_display, signatories_summary,
      authority_basis_summary, reason) location ВСЕГДА null.
    - Для signatory_authority_status = "missing" — location = null.
    - Для signatory_authority_status = "present" / "unclear" — quote
      с наиболее релевантной фразой (подписной блок, преамбула,
      раздел реквизитов).
    - Для signatories_identified — quote с подписным блоком или преамбулой.
    - Для authority_basis_type / authority_basis_completeness — quote
      с фразой «действует на основании …» / «по доверенности №… от…».
    - Для not_mentioned / no — различай два случая:
      * если договор ПРЯМО исключает наличие («Стороны действуют
        без ограничений полномочий», «Доверенность не требуется») —
        quote ОБЯЗАТЕЛЬНА и должна содержать эту фразу;
      * если просто отсутствует упоминание (договор молчит) —
        location = null.
    - Не выдумывай location или quote. Если дословную фразу определить
      нельзя — location = null.
    </location_instructions>

    <instructions>
    Шаг 0 — НАЛИЧИЕ РАЗДЕЛА / ПОЛОЖЕНИЙ О ПОДПИСАНТАХ

    Заполни "signatory_authority_status".

    Значения:
    - "present" — если хотя бы одно содержательное signal-поле
      указывает на наличие информации по теме:
      * signatories_identified ∈ {"yes", "partial"};
      * authority_basis_type ∈ {"charter", "power_of_attorney",
        "board_resolution", "combined"};
      * authority_basis_completeness ∈ {"complete", "incomplete"};
      * ultra_vires_risk ∈ {"yes", "no"};
      * ЛИБО любое поле = "no" / "not_mentioned", но с заполненным
        location с прямой цитатой (см. RF3).
    - "missing" — если все содержательные поля =
      "no" / "not_mentioned" БЕЗ цитат, ЛИБО фрагментов
      по теме нет вообще.
    - "unclear" — если все содержательные = "unclear" при наличии
      фрагментов, но невозможности вывода.

    Шаг 1 — ИДЕНТИФИКАЦИЯ ПОДПИСАНТОВ

    Заполни "signatories_identified".

    Значения:
    - "yes" — подписанты обеих (или всех) сторон идентифицированы:
      есть ФИО и/или должность.
    - "partial" — подписант только одной стороны указан,
      или указана только должность без ФИО.
    - "no" — подписанты не идентифицированы.
    - "unclear" — нельзя надёжно определить.

    Шаг 2 — КРАТКОЕ ОПИСАНИЕ ПОДПИСАНТОВ

    Заполни "signatories_summary".
    - Кратко, через " / " для разных сторон.
    - Формат: "ФИО, должность" для каждой стороны.
    - Примеры: "Иванов И.И., Генеральный директор / Smith J., CEO",
      "Петрова А.А., по доверенности / подписант не указан".
    - Если не идентифицированы: "Подписанты не идентифицированы".
    - Если нельзя определить: "Не удалось определить".

    Шаг 3 — ТИП ОСНОВАНИЯ ПОЛНОМОЧИЙ

    Заполни "authority_basis_type".

    Значения: charter / power_of_attorney / board_resolution /
    combined / not_mentioned / unclear.

    Шаг 4 — ПОЛНОТА РЕКВИЗИТОВ ОСНОВАНИЯ

    Заполни "authority_basis_completeness".

    Значения:
    - "complete" — основание с реквизитами:
      устав + дата/номер регистрации, или PoA с № и датой.
    - "incomplete" — основание упоминается, но без реквизитов.
    - "not_mentioned" — основание не указано вообще.
    - "unclear" — нельзя определить.

    Шаг 5 — КРАТКИЙ СТАТУС ОСНОВАНИЯ ПОЛНОМОЧИЙ

    Заполни "authority_basis_summary".

    Правила:
    - complete → "На основании устава (с реквизитами)" /
      "По доверенности №… от …"
    - incomplete → "На основании устава (без реквизитов)" /
      "По доверенности (без № и даты)"
    - not_mentioned → "Основание полномочий не указано"
    - unclear → "Не удалось определить"

    Шаг 6 — ПРИЗНАКИ ВЫХОДА ЗА ПРЕДЕЛЫ ПОЛНОМОЧИЙ

    Заполни "ultra_vires_risk".

    Значения:
    - "yes" — есть прямые признаки из текста:
      доверенность с ограниченным предметом / суммой,
      противоречие между полномочиями и предметом договора.
    - "no" — прямых признаков нет.
    - "unclear" — нельзя определить.

    Шаг 7 — НОРМАЛИЗОВАННЫЙ DISPLAY ДЛЯ DD GRID

    Заполни "authority_display".
    Строй его ТОЛЬКО на основе уже заполненных полей выше.

    Правила:
    - Если signatory_authority_status = "missing":
      "Подписанты не идентифицированы; основание полномочий не указано"
    - Если signatories_identified = "no":
      "Подписанты не идентифицированы"
    - Если authority_basis_completeness = "not_mentioned":
      "Основание полномочий не указано"
    - Если ultra_vires_risk = "yes":
      добавь "признаки выхода за пределы полномочий"
    - Иначе:
      * начни с "Полномочия подтверждены" (complete) или
        "Подписант указан" (incomplete / partial)
      * добавь краткое основание
    - Не более 3 коротких фактов через ";".

    Шаг 8 — ОБОСНОВАНИЕ

    Заполни "reason": первое предложение — вывод, второе — цитата
    (до 100 символов). Пиши по-русски.
    </instructions>

    <edge_cases>
    - Только "действует на основании устава" без ФИО и должности:
      * signatory_authority_status = "present"
      * signatories_identified = "partial"
      * authority_basis_type = "charter"
      * authority_basis_completeness = "incomplete"

    - ГД указан, ссылка на устав с реквизитами:
      * signatory_authority_status = "present"
      * signatories_identified = "yes"
      * authority_basis_type = "charter"
      * authority_basis_completeness = "complete"

    - Доверенность без номера и даты:
      * signatory_authority_status = "present"
      * authority_basis_type = "power_of_attorney"
      * authority_basis_completeness = "incomplete"
      * authority_basis_summary = "По доверенности (без № и даты)"

    - Подписанты вообще не указаны в документе, но есть иные
      фрагменты с упоминанием полномочий:
      * signatory_authority_status = "present"
      * signatories_identified = "no"
      * signatories_summary = "Подписанты не идентифицированы"
      * authority_display = "Подписанты не идентифицированы"

    - Договор прямо указывает, что ограничений полномочий нет:
      * signatory_authority_status = "present"
      * authority_basis_completeness = "complete"
      * location с прямой цитатой об отсутствии ограничений.

    - Нет релевантных фрагментов / раздел о подписантах
      в договоре отсутствует:
      * signatory_authority_status = "missing"
      * signatories_identified = "no"
      * authority_basis_type = "not_mentioned"
      * authority_basis_completeness = "not_mentioned"
      * ultra_vires_risk = "no"
      * signatories_summary = "Подписанты не идентифицированы"
      * authority_basis_summary = "Основание полномочий не указано"
      * authority_display =
        "Подписанты не идентифицированы; основание полномочий не указано"
      * location у всех полей = null.

    - Формулировки есть, но вывод невозможен:
      * signatory_authority_status = "unclear"
      * соответствующие поля = "unclear"
    </edge_cases>

    <output_expectations>
    - Верни результат строго в формате JSON.
    - Не оборачивай в markdown-блоки (без ```).
    - Не добавляй комментариев вне JSON.
    - Все значения полей с allowed_values — на английском.
    - Свободные текстовые поля (authority_display, signatories_summary,
      authority_basis_summary, reason) — на русском языке.
    - Не добавляй полей, кроме указанных.
    - Для каждого поля возвращай объект с ключами
      "value", "confidence", "location".

    Пример структуры ответа:
    {
      "authority_display": {"value": "Полномочия подтверждены; на основании устава", "confidence": 0.95, "location": null},
      "signatories_summary": {"value": "Иванов И.И., Генеральный директор / Smith J., CEO", "confidence": 0.95, "location": null},
      "authority_basis_summary": {"value": "На основании устава (без реквизитов)", "confidence": 0.90, "location": null},
      "signatory_authority_status": {"value": "present", "confidence": 0.95, "location": {"clause_ref": "Подписной блок", "page": 12, "quote": "Иванов И.И., Генеральный директор, действует на основании Устава"}},
      "signatories_identified": {"value": "yes", "confidence": 0.95, "location": {"clause_ref": "Подписной блок", "page": 12, "quote": "Иванов И.И., Генеральный директор"}},
      "authority_basis_type": {"value": "charter", "confidence": 0.95, "location": {"clause_ref": "Подписной блок", "page": 12, "quote": "действует на основании Устава"}},
      "authority_basis_completeness": {"value": "incomplete", "confidence": 0.85, "location": {"clause_ref": "Подписной блок", "page": 12, "quote": "действует на основании Устава"}},
      "ultra_vires_risk": {"value": "no", "confidence": 0.75, "location": null},
      "reason": {"value": "...", "confidence": 0.90, "location": null}
    }
    </output_expectations>

  fields:
    - name: "authority_display"
      type: "string"
      presentation: "fact"
      label: "Полномочия подписанта"
      description: "Нормализованный user-facing вывод для DD Grid"
      display_in_grid: true
      display_priority: 1

    - name: "signatories_summary"
      type: "string"
      presentation: "fact"
      label: "Подписанты"
      description: "Краткое описание подписантов и их должностей"
      display_in_grid: true
      display_priority: 2

    - name: "authority_basis_summary"
      type: "string"
      presentation: "fact"
      label: "Основание полномочий"
      description: "Краткий статус основания полномочий"
      display_in_grid: true
      display_priority: 3

    - name: "signatory_authority_status"
      type: "string"
      presentation: "signal"
      risk_weight: "info"
      description: "Наличие информации о полномочиях подписантов в тексте договора"
      display_in_grid: false
      allowed_values:
        - "present"
        - "missing"
        - "unclear"

    - name: "signatories_identified"
      type: "string"
      presentation: "signal"
      risk_weight: "high"
      description: "Идентификация подписантов"
      allowed_values:
        - "yes"
        - "partial"
        - "no"
        - "unclear"
      display_in_grid: false

    - name: "authority_basis_type"
      type: "string"
      presentation: "signal"
      risk_weight: "medium"
      description: "Тип основания полномочий"
      allowed_values:
        - "charter"
        - "power_of_attorney"
        - "board_resolution"
        - "combined"
        - "not_mentioned"
        - "unclear"
      display_in_grid: false

    - name: "authority_basis_completeness"
      type: "string"
      presentation: "signal"
      risk_weight: "high"
      description: "Полнота реквизитов основания"
      allowed_values:
        - "complete"
        - "incomplete"
        - "not_mentioned"
        - "unclear"
      display_in_grid: false

    - name: "ultra_vires_risk"
      type: "string"
      presentation: "signal"
      risk_weight: "high"
      description: "Признаки выхода за пределы полномочий"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
      display_in_grid: false

    - name: "reason"
      type: "string"
      presentation: "diagnostic"
      description: "Обоснование"
      display_in_grid: false

  store_payload: true


  