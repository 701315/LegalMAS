id: "party_identification_and_requisites"
name: "Идентификация сторон и реквизиты"
group: "Document completeness"
description: >
  Анализирует, идентифицированы ли стороны договора и насколько
  полно указаны их реквизиты: наименование, организационно-правовая
  форма, регистрационные / налоговые идентификаторы, адрес и иные
  ключевые реквизиты. Выявляет неполноту и возможные несоответствия
  между преамбулой, разделом реквизитов и подписным блоком.

  Формирует краткий user-facing вывод и оценивает формальный риск
  неполной или противоречивой идентификации сторон.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"
ui_mode: "field_extraction"

rules:
  keyword_mode: any

  keywords:
    high:
      - "(?i)именуем[а-я]+\\s+в\\s+дальнейшем"
      - "(?i)hereinafter\\s+referred\\s+to\\s+as"
      - "(?i)между\\s+.*\\s+и\\s+.*"
      - "(?i)by\\s+and\\s+between"
      - "(?i)полное\\s+фирменное\\s+наименование"
      - "(?i)legal\\s+name"
      - "(?i)organizational[-\\s]?legal\\s+form"
      - "(?i)организационно[-\\s]?правов[а-я]+\\s+форм"
      - "(?i)\\bОГРН\\b"
      - "(?i)\\bИНН\\b"
      - "(?i)\\bКПП\\b"
      - "(?i)company\\s+registration\\s+number"
      - "(?i)tax\\s+identification\\s+number"
      - "(?i)registered\\s+office"
      - "(?i)legal\\s+address"
      - "(?i)место\\s+нахождения"
      - "(?i)юридическ[а-я]+\\s+адрес"
      - "(?i)реквизиты\\s+сторон"
      - "(?i)details\\s+of\\s+the\\s+parties"

    medium:
      - "(?i)bank\\s+details"
      - "(?i)payment\\s+details"
      - "(?i)банковские\\s+реквизиты"
      - "(?i)расч[её]тный\\s+сч[её]т"
      - "(?i)\\bIBAN\\b"
      - "(?i)\\bSWIFT\\b"
      - "(?i)\\bBIC\\b"
      - "(?i)корреспондентский\\s+сч[её]т"
      - "(?i)почтовый\\s+адрес"
      - "(?i)mailing\\s+address"
      - "(?i)VAT\\s+number"
      - "(?i)registration\\s+number"
      - "(?i)идентификационн[а-я]+\\s+номер"
      - "(?i)passport\\s+details"
      - "(?i)паспортн[а-я]+\\s+данн"

    low:
      - "(?i)hereinafter\\s+referred\\s+to\\s+as"
      - "(?i)legal\\s+address"
      - "(?i)bank\\s+details"
      - "(?i)реквизиты\\s+сторон"
      - "(?i)\\bОГРН\\b"
      - "(?i)\\bИНН\\b"
      - "(?i)registered\\s+office"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 6
  temperature: 0.0
  max_tokens: 700

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 700

retrieval:
  retrieval_profile: "authority_check"
  context_k: 6
  max_chunks: 12

  retrieval_query: >
    стороны договора реквизиты сторон наименование ОГРН ИНН КПП
    юридический адрес bank details registered office legal name
    hereinafter referred to as details of the parties

  boost_keywords:
    - "именуемое в дальнейшем"
    - "hereinafter referred to as"
    - "реквизиты сторон"
    - "details of the parties"
    - "полное фирменное наименование"
    - "legal name"
    - "ОГРН"
    - "ИНН"
    - "КПП"
    - "company registration number"
    - "tax identification number"
    - "registered office"
    - "legal address"
    - "место нахождения"
    - "юридический адрес"
    - "bank details"
    - "банковские реквизиты"
    - "SWIFT"
    - "IBAN"

  negative_keywords:
    - "штрафные санкции"
    - "условия оплаты"
    - "валюта платежа"
    - "подсудность"
    - "применимое право"
    - "форс-мажор"

  preferred_unit_types:
    - "general_provision"
    - "structural_anchor"

  excluded_unit_types:
    - "technical_fragment"
    - "appendix_reference"

  preferred_clause_functions:
    - "boilerplate"
    - "representations"

  position_bias:
    preferred_range: [0.00, 1.00]
    boost: 0.10
    scope: "segment"

  rerank: true
  filters: {}

conditional: null

enrichment_hints:
  preferred_segment_types:
    - "contract"
    - "amendment"
  excluded_segment_types:
    - "technical_specification"
    - "price_list"
    - "invoice"
    - "act"
    - "schedule"
  confidence_bonus_on_match: 0.08
  confidence_penalty_on_excluded_segment: 0.15

extraction:
  enabled: true
  mode: "hybrid"
  llm_max_tokens: 1100

  presence_signal:
    field: "party_identification_status"
    present_values: ["present"]
    missing_values: ["missing"]
    unclear_values: ["unclear"]

  llm_prompt_extraction: |
    <role>
    Ты — юрист по договорной формалистике и идентификации сторон.
    Твоя задача — точно извлечь из текста:
    1) есть ли в договоре раздел / положения об идентификации сторон
       и их реквизитах;
    2) если есть — насколько полны реквизиты;
    3) есть ли явные несоответствия между преамбулой,
       реквизитами и подписным блоком.

    КРИТИЧЕСКИ ВАЖНО:
    - Извлекай ТОЛЬКО то, что прямо написано в тексте.
    - НЕ восстанавливай реквизиты по догадке.
    - НЕ считай отсутствие банковских реквизитов автоматическим
      дефектом, если по тексту есть иная достаточная идентификация.
    - Если раздел / положения о сторонах в договоре отсутствуют
      (ни преамбулы, ни реквизитов, ни подписного блока
      с идентификацией) — party_identification_status = "missing".
    - Если тексты по теме есть, но вывод сделать нельзя —
      party_identification_status = "unclear".
    </role>

    <context_rules>
    - Некоторые фрагменты могут быть нерелевантны — игнорируй их.
    - Если стороны названы в преамбуле, но реквизиты отсутствуют,
      это не равно полной идентификации.
    - Если название стороны в разных местах отличается так,
      что это может быть и та же сторона, и другая —
      используй "unclear" или укажи несоответствие.
    - Если есть сокращённое и полное наименование одной и той же
      стороны, это не несоответствие само по себе.
    - Не используй внешние источники и не дополняй реквизиты
      из общих знаний.
    - Если ни один фрагмент не содержит данных о сторонах
      (преамбула, раздел реквизитов, подписной блок недоступны) —
      party_identification_status = "missing", location = null.
      Не использовать "unclear" при полном отсутствии релевантных
      фрагментов.
    </context_rules>

    <context>
    Ниже приведены релевантные фрагменты договора:

    {context}
    </context>

    <task>
    Заполни только следующие поля:
    - parties_display
    - parties_summary
    - requisites_status
    - party_identification_status
    - parties_identified
    - party_details_consistent
    - core_requisites_completeness
    - reason
    </task>

    <location_instructions>
    Для каждого поля по возможности укажи location в формате:
    {"clause_ref": "п. 12.1", "page": 7, "quote": "дословная фраза из договора"}

    Правила:
    - clause_ref — короткая ссылка на пункт / раздел / статью именно в том
      виде, как она написана в договоре;
    - page — целое число страницы;
    - quote — дословная фраза из текста договора (НЕ пересказ, НЕ парафраз).
      Копируй её посимвольно, сохраняя формулировку и порядок слов.
      Оптимальная длина: 30–300 символов.
    - Для synthesized-полей (parties_display, parties_summary,
      requisites_status, reason) location ВСЕГДА null.
    - Для party_identification_status = "missing" — location = null.
    - Для party_identification_status = "present" / "unclear" — quote
      с наиболее релевантной фразой (наименование стороны,
      фрагмент раздела реквизитов, фрагмент подписного блока).
    - Для parties_identified — quote с преамбулой или разделом реквизитов.
    - Для party_details_consistent = "no" — quote с наиболее показательным
      несоответствием (одно из conflicting написаний).
    - Для core_requisites_completeness — quote с фрагментом раздела
      реквизитов.
    - Не выдумывай location или quote. Если дословную фразу определить
      нельзя — location = null.
    </location_instructions>

    <instructions>
    Шаг 0 — НАЛИЧИЕ РАЗДЕЛА / ПОЛОЖЕНИЙ О СТОРОНАХ

    Заполни "party_identification_status".

    Значения:
    - "present" — если хотя бы одно содержательное signal-поле указывает
      на наличие идентификации:
      * parties_identified ∈ {"yes", "partial"};
      * core_requisites_completeness ∈ {"complete", "incomplete", "minimal"};
      * ЛИБО любое поле = "no", но с заполненным location с прямой
        цитатой (см. RF3). Это касается, в частности,
        party_details_consistent = "no" — учитывается как признак
        наличия регулирования ТОЛЬКО при наличии прямой цитаты
        о несоответствии (например, разные написания наименования).
        Без цитаты "no" не считается сигналом наличия.
    - "missing" — если parties_identified = "no" (без цитаты об исключении),
      core_requisites_completeness = "unclear",
      party_details_consistent = "unclear",
      ЛИБО фрагментов по теме нет вообще.
    - "unclear" — если все содержательные = "unclear" при наличии
      фрагментов, но невозможности вывода.

    Шаг 1 — ИДЕНТИФИКАЦИЯ СТОРОН

    Заполни "parties_identified".

    Значения:
    - "yes" — все основные стороны идентифицируются по тексту.
    - "partial" — идентифицируется только часть сторон или
      идентификация одной из сторон заметно неполная.
    - "no" — стороны не удаётся идентифицировать по существу.
    - "unclear" — нельзя надёжно определить из-за противоречий
      или недостатка данных.

    Шаг 2 — КРАТКОЕ ОПИСАНИЕ СТОРОН

    Заполни "parties_summary".
    - Не более 2 сторон в строке, через " / ".
    - Примеры: "ООО «Альфа» / Beta Ltd.",
      "АО «Ромашка» / вторая сторона не идентифицирована".
    - Если стороны не идентифицированы: "Стороны не идентифицированы".
    - Если нельзя определить: "Не удалось определить стороны".

    Шаг 3 — СОГЛАСОВАННОСТЬ ДАННЫХ О СТОРОНАХ

    Заполни "party_details_consistent":
    yes / no / unclear.

    Шаг 4 — ПОЛНОТА КЛЮЧЕВЫХ РЕКВИЗИТОВ

    Заполни "core_requisites_completeness":
    - "complete" — ключевые реквизиты в достаточном объёме;
    - "incomplete" — часть важных реквизитов отсутствует;
    - "minimal" — только базовое наименование;
    - "unclear" — нельзя определить.

    Шаг 5 — USER-FACING СТАТУС РЕКВИЗИТОВ

    Заполни "requisites_status".

    Правила:
    - complete → "Реквизиты полные"
    - incomplete → "Реквизиты неполные"
    - minimal → "Только базовая идентификация"
    - Стороны не идентифицированы →
      "Реквизиты не позволяют идентифицировать стороны"
    - Нельзя определить → "Не удалось определить"

    Шаг 6 — НОРМАЛИЗОВАННЫЙ DISPLAY ДЛЯ DD GRID

    Заполни "parties_display".
    Строй его ТОЛЬКО на основе уже заполненных полей выше.

    Правила:
    - Если party_identification_status = "missing":
      "Стороны не идентифицированы"
    - Если parties_identified = "no":
      "Стороны не идентифицированы"
    - Иначе:
      * начни с "Стороны идентифицированы" / "Стороны идентифицированы
        частично";
      * затем добавь requisites_status в кратком виде;
      * если party_details_consistent = "no", добавь "есть несоответствия".
    - Не более 3 коротких фактов через ";".

    Шаг 7 — ОБОСНОВАНИЕ

    Заполни "reason": первое предложение — вывод, второе — цитата
    (до 100 символов). Пиши по-русски.
    </instructions>

    <edge_cases>
    - Есть только наименование сторон без реквизитов:
      * party_identification_status = "present"
      * parties_identified = "yes"
      * core_requisites_completeness = "minimal"
      * requisites_status = "Только базовая идентификация"

    - Одна сторона названа полно, вторая — нет:
      * party_identification_status = "present"
      * parties_identified = "partial"

    - В преамбуле и реквизитах разные наименования без ясного
      объяснения:
      * party_identification_status = "present"
      * party_details_consistent = "no"

    - Есть полное и сокращённое наименование одной стороны:
      * party_details_consistent = "yes"

    - Нет релевантных фрагментов / раздел о сторонах отсутствует:
      * party_identification_status = "missing"
      * parties_identified = "no"
      * party_details_consistent = "unclear"
      * core_requisites_completeness = "unclear"
      * parties_summary = "Стороны не идентифицированы"
      * requisites_status = "Реквизиты не позволяют идентифицировать стороны"
      * parties_display = "Стороны не идентифицированы"
      * location у всех полей = null.
    </edge_cases>

    <output_expectations>
    - Верни результат строго в формате JSON.
    - Не оборачивай в markdown-блоки (без ```).
    - Не добавляй комментариев вне JSON.
    - Все значения полей с allowed_values — на английском.
    - Свободные текстовые поля (parties_display, parties_summary,
      requisites_status, reason) — на русском языке.
    - Не добавляй полей, кроме указанных.
    - Для каждого поля возвращай объект с ключами
      "value", "confidence", "location".

    Пример структуры ответа:
    {
      "parties_display": {"value": "Стороны идентифицированы; реквизиты полные", "confidence": 0.95, "location": null},
      "parties_summary": {"value": "ООО «Альфа» / Beta Ltd.", "confidence": 0.95, "location": null},
      "requisites_status": {"value": "Реквизиты полные", "confidence": 0.95, "location": null},
      "party_identification_status": {"value": "present", "confidence": 0.95, "location": {"clause_ref": "Преамбула", "page": 1, "quote": "Общество с ограниченной ответственностью «Альфа», именуемое в дальнейшем «Поставщик»"}},
      "parties_identified": {"value": "yes", "confidence": 0.95, "location": {"clause_ref": "Преамбула", "page": 1, "quote": "Общество с ограниченной ответственностью «Альфа», именуемое в дальнейшем «Поставщик»"}},
      "party_details_consistent": {"value": "yes", "confidence": 0.90, "location": null},
      "core_requisites_completeness": {"value": "complete", "confidence": 0.90, "location": {"clause_ref": "Раздел 12", "page": 8, "quote": "ООО «Альфа»; ОГРН 1234567890123; ИНН 7712345678; адрес: 123456, г. Москва, ул. Примерная, д. 1"}},
      "reason": {"value": "...", "confidence": 0.90, "location": null}
    }
    </output_expectations>

  fields:
    - name: "parties_display"
      type: "string"
      presentation: "fact"
      label: "Стороны и реквизиты"
      description: "Нормализованный user-facing вывод для DD Grid"
      display_in_grid: true
      display_priority: 1

    - name: "parties_summary"
      type: "string"
      presentation: "fact"
      label: "Стороны"
      description: "Краткое наименование сторон договора"
      display_in_grid: true
      display_priority: 2

    - name: "requisites_status"
      type: "string"
      presentation: "fact"
      label: "Реквизиты"
      description: "Краткий статус полноты реквизитов сторон"
      display_in_grid: true
      display_priority: 3

    - name: "party_identification_status"
      type: "string"
      presentation: "signal"
      risk_weight: "info"
      description: "Наличие идентификации сторон в тексте договора"
      display_in_grid: false
      allowed_values:
        - "present"
        - "missing"
        - "unclear"

    - name: "parties_identified"
      type: "string"
      presentation: "signal"
      risk_weight: "high"
      description: "Идентификация сторон"
      allowed_values:
        - "yes"
        - "partial"
        - "no"
        - "unclear"
      display_in_grid: false

    - name: "party_details_consistent"
      type: "string"
      presentation: "signal"
      risk_weight: "high"
      description: "Согласованность данных о сторонах"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
      display_in_grid: false

    - name: "core_requisites_completeness"
      type: "string"
      presentation: "signal"
      risk_weight: "medium"
      description: "Полнота ключевых реквизитов"
      allowed_values:
        - "complete"
        - "incomplete"
        - "minimal"
        - "unclear"
      display_in_grid: false

    - name: "reason"
      type: "string"
      presentation: "diagnostic"
      description: "Обоснование"
      display_in_grid: false

  store_payload: true


