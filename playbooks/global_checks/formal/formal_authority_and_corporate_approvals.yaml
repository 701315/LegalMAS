id: "formal_authority_and_corporate_approvals"
name: "Полномочия подписантов и корпоративные одобрения"
description: >
  Анализирует полномочия подписантов договора и корпоративные одобрения:
  идентификация подписантов и должностей, основания полномочий
  (устав, доверенность, решение органа), тип и срок доверенности,
  признаки крупной и заинтересованной сделки по российскому праву,
  наличие решений СД / ОСА. Оценивает формальный риск недействительности
  или оспоримости сделки.

doc_types: []

severity: "high"
severity_if_fail: "critical"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"

rules:
  keyword_mode: any

  keywords:
    high:
      # Подписант и полномочия
      - "(?i)подписант"
      - "(?i)уполномочен"
      - "(?i)authorised?\\s+signatory"
      - "(?i)signing\\s+authority"
      - "(?i)действует\\s+на\\s+основании"
      - "(?i)acting\\s+(on\\s+the\\s+)?basis\\s+of"
      - "(?i)duly\\s+authorised?"

      # Устав / учредительные документы
      - "(?i)\\bустав[аеу]?\\b"
      - "(?i)\\bcharter\\b"
      - "(?i)\\bbylaws?\\b"
      - "(?i)articles\\s+of\\s+(association|incorporation)"
      - "(?i)учредительн[а-я]+\\s+документ"

      # Доверенность
      - "(?i)доверенност[ьи]"
      - "(?i)power\\s+of\\s+attorney"
      - "(?i)\\bPoA\\b"
      - "(?i)на\\s+основании\\s+доверенност[ьи]"
      - "(?i)pursuant\\s+to\\s+(a\\s+)?power\\s+of\\s+attorney"

      # Решения органов управления
      - "(?i)board\\s+resolution"
      - "(?i)решени[ея]\\s+совета\\s+директоров"
      - "(?i)решени[ея]\\s+СД"
      - "(?i)shareholders['']?\\s+resolution"
      - "(?i)решени[ея]\\s+общего\\s+собрани[яи]"
      - "(?i)решени[ея]\\s+ОС[АУ]"
      - "(?i)протокол\\s+(заседания\\s+)?(СД|совета|собрания)"

      # Крупная сделка
      - "(?i)крупн[а-я]+\\s+сделк"
      - "(?i)major\\s+transaction"
      - "(?i)significant\\s+transaction"
      - "(?i)exceeds?\\s+25\\s*%"
      - "(?i)превышает\\s+25\\s*%"
      - "(?i)балансов[а-я]+\\s+стоимост[ьи]\\s+актив"

      # Заинтересованная сделка
      - "(?i)заинтересованн[а-я]+\\s+сделк"
      - "(?i)interested\\s+party\\s+transaction"
      - "(?i)related\\s+party\\s+transaction"
      - "(?i)\\bRPT\\b"
      - "(?i)сделк[аи]\\s+с\\s+заинтересованност"
      - "(?i)аффилированн[а-я]+\\s+лиц"

    medium:
      # Одобрение сделки
      - "(?i)одобрени[ея]\\s+сделк"
      - "(?i)approval\\s+of\\s+(the\\s+)?transaction"
      - "(?i)corporate\\s+approval"
      - "(?i)корпоративн[а-я]+\\s+одобрени"
      - "(?i)consent\\s+of\\s+(the\\s+)?(board|shareholders)"

      # Генеральный директор
      - "(?i)генеральн[а-я]+\\s+директор"
      - "(?i)\\bCEO\\b"
      - "(?i)chief\\s+executive\\s+officer"
      - "(?i)единоличн[а-я]+\\s+исполнительн[а-я]+\\s+орган"
      - "(?i)sole\\s+executive\\s+body"

      # Представитель
      - "(?i)представитель"
      - "(?i)representative"
      - "(?i)attorney[-\\s]?in[-\\s]?fact"
      - "(?i)proxy"

      # Номер / дата доверенности
      - "(?i)доверенност[ьи]\\s+(№|#|номер)\\s*\\d+"
      - "(?i)доверенност[ьи]\\s+от\\s+\\d"
      - "(?i)power\\s+of\\s+attorney\\s+(No\\.?|#|dated)\\s*\\d+"

    low:
      # Общие термины
      - "(?i)подпис"
      - "(?i)sign"
      - "(?i)полномочи"
      - "(?i)authority"
      - "(?i)директор"
      - "(?i)director"
      - "(?i)решени"
      - "(?i)resolution"
      - "(?i)одобрени"
      - "(?i)approval"
      - "(?i)consent"
      - "(?i)сделк"
      - "(?i)transaction"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 7
  temperature: 0.0
  max_tokens: 800

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 700

retrieval:
  context_k: 6
  max_chunks: 12
  boost_keywords:
    - "подписант"
    - "уполномочен"
    - "authorised signatory"
    - "действует на основании"
    - "acting on the basis of"
    - "доверенность"
    - "power of attorney"
    - "устав"
    - "charter"
    - "bylaws"
    - "board resolution"
    - "решение совета директоров"
    - "решение СД"
    - "shareholders resolution"
    - "решение общего собрания"
    - "одобрение сделки"
    - "approval of the transaction"
    - "крупная сделка"
    - "major transaction"
    - "заинтересованная сделка"
    - "interested party transaction"
    - "related party transaction"
    - "аффилированное лицо"
    - "генеральный директор"
    - "CEO"
  rerank: true
  filters: {}

conditional: null

extraction:
  llm_prompt_extraction: |
    <role>
    Ты — старший корпоративный юрист с глубокой экспертизой
    в российском корпоративном праве. Твоя специализация —
    анализ рисков, связанных с полномочиями подписантов
    и корпоративными одобрениями сделок в рамках юридического
    due diligence.
    </role>

    <context>
    Ниже приведены фрагменты договора и/или корпоративных документов,
    связанных с подписанием договора:

    {context}
    </context>

    <instructions>
    Проведи анализ по шагам. Каждый шаг логически соответствует одному
    или нескольким полям итоговой оценки риска.

    Шаг 1 — ИДЕНТИФИКАЦИЯ ПОДПИСАНТОВ
    (используется для заполнения поля "signatories_summary"):
    - Определи всех подписантов:
      * ФИО (если указано);
      * должность;
      * от имени какой стороны подписали.
    - Если подписант не идентифицирован — зафиксируй это.
    - Сформируй краткое резюме (например: «Иванов И.И.,
      Генеральный директор, ООО "Альфа"; Smith J., CEO, Beta Ltd.»).

    Шаг 2 — ОСНОВАНИЯ ПОЛНОМОЧИЙ
    (используется для заполнения поля "authority_basis_mentioned"):
    - Для каждого подписанта определи, указано ли основание
      полномочий:
      * устав (charter, bylaws);
      * доверенность (power of attorney) — с номером/датой
        или без;
      * решение органа управления;
      * иной документ.
    - Оцени:
      * "yes_complete" — основание указано с реквизитами
        (номер, дата);
      * "yes_incomplete" — основание указано, но без реквизитов;
      * "no" — основание не указано;
      * "unclear" — неясно.

    Шаг 3 — ПРИЗНАКИ КРУПНОЙ СДЕЛКИ
    (используется для заполнения поля "major_transaction_indicators"):
    - Проверь, есть ли признаки крупной сделки по ст. 46 14-ФЗ /
      ст. 78–79 208-ФЗ:
      * прямое упоминание «крупная сделка»;
      * указание на сумму > 25% балансовой стоимости активов;
      * ссылки на порог существенности.
    - Оцени:
      * "yes" — признаки есть;
      * "no" — признаков нет;
      * "unclear" — данных недостаточно.

    Шаг 4 — ПРИЗНАКИ ЗАИНТЕРЕСОВАННОЙ СДЕЛКИ
    (используется для заполнения поля "interested_party_transaction_indicators"):
    - Проверь, есть ли признаки заинтересованности по ст. 45 14-ФЗ /
      ст. 81–84 208-ФЗ:
      * прямое упоминание «заинтересованная сделка», RPT;
      * аффилированность сторон;
      * совпадение лиц в органах управления сторон.
    - Оцени:
      * "yes" — признаки есть;
      * "no" — признаков нет;
      * "unclear" — данных недостаточно.

    Шаг 5 — КОРПОРАТИВНЫЕ ОДОБРЕНИЯ
    (используется для заполнения поля "corporate_approvals_mentioned"):
    - Если есть признаки крупной / заинтересованной сделки:
      * упоминаются ли решения СД / ОСА / протоколы одобрения;
      * указаны ли реквизиты (дата, номер).
    - Оцени corporate_approvals_mentioned:
      * "yes" — одобрения упоминаются;
      * "no" — не упоминаются;
      * "not_required" — признаков крупной/заинтересованной нет,
        одобрение не требуется;
      * "unclear" — неясно.

    Шаг 6 — RED FLAGS
    (используется для заполнения поля "red_flags"):
    Присвой один или несколько кодов из списка ниже.
    Если ни один код не применим — верни "NONE".
    Если данных недостаточно для оценки — верни "UNCLEAR".

    Коды:
    • AUTH1 — Подписант без явного указания основания
      полномочий (нет ссылки на устав / доверенность).
    • AUTH2 — Доверенность без номера и/или даты —
      невозможно верифицировать полномочия.
    • AUTH3 — Признаки крупной сделки, но нет упоминания
      одобрения СД / ОСА.
    • AUTH4 — Признаки заинтересованной сделки, но нет
      упоминания одобрения.
    • AUTH5 — Доверенность с истёкшим или неуказанным
      сроком действия.
    • AUTH6 — Специальная / разовая доверенность, которая
      может не покрывать данный тип сделки.

    Формат ответа: коды через запятую без комментариев
    (например: "AUTH1, AUTH3").
    Вся аргументация — в поле reason.

    Шаг 7 — ОБОСНОВАНИЕ
    (используется для заполнения поля "reason"):

    - В reason кратко обоснуй вывод, опираясь на ключевые
      формулировки из текста (с цитатами в кавычках), и укажи:
      * кто подписал и на каком основании;
      * есть ли признаки крупной/заинтересованной сделки;
      * упоминаются ли корпоративные одобрения;
      * если выставлены red_flags — обоснуй каждый код;
      * если red_flags = "NONE" — укажи, почему формальные
        требования соблюдены.
    </instructions>

    <edge_cases>
    Обрабатывай пограничные ситуации так:

    - Только преамбула без подписных блоков:
      signatories_summary = "not identified";
      authority_basis_mentioned = "unclear";
      в reason укажи, что подписанты не идентифицированы.

    - Подписант указан без должности и без основания:
      зафиксируй AUTH1; в reason укажи отсутствие
      информации о полномочиях.

    - Доверенность без номера и даты:
      authority_basis_mentioned = "yes_incomplete";
      зафиксируй AUTH2; risk не ниже MEDIUM.

    - Неизвестная сумма сделки:
      major_transaction_indicators = "unclear";
      не делай вывода, что сделка не крупная.

    - Генеральный директор без ссылки на устав:
      authority_basis_mentioned = "no";
      зафиксируй AUTH1 — ГД не считается автоматически
      уполномоченным без подтверждения устава.

    - Противоречивые фрагменты (разные основания полномочий
      для одного лица):
      в reason опиши противоречие; risk не ниже MEDIUM.

    - Ретроспективное одобрение («сделка одобрена решением
      СД от [дата после подписания]»):
      approval_status = "post_factum";
      risk MEDIUM; в reason укажи, что одобрение получено
      задним числом.

    - Пустые или явно нерелевантные фрагменты:
      red_flags = "UNCLEAR"; в reason укажи недостаток данных.
    </edge_cases>

    <output_expectations>
    На основе твоего анализа отдельный механизм извлечения сформирует
    структурированные поля по заранее заданной схеме. Твоя задача —
    давать чёткие юридические выводы и указывать конкретные
    формулировки из текста, на которых они основаны.
    </output_expectations>

  enabled: true
  mode: "hybrid"
  fields:
    - name: "signatories_summary"
      type: "string"

    - name: "authority_basis_mentioned"
      type: "string"
      allowed_values:
        - "yes_complete"
        - "yes_incomplete"
        - "no"
        - "unclear"

    - name: "major_transaction_indicators"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "interested_party_transaction_indicators"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "corporate_approvals_mentioned"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "not_required"
        - "unclear"

    - name: "red_flags"
      type: "string"

    - name: "reason"
      type: "string"

  store_payload: true

red_flags:
  items:
    - code: "AUTH1"
      description: >
        Подписант без явного указания основания полномочий
        (нет ссылки на устав / доверенность).
    - code: "AUTH2"
      description: >
        Доверенность без номера и/или даты —
        невозможно верифицировать полномочия.
    - code: "AUTH3"
      description: >
        Признаки крупной сделки, но нет упоминания
        одобрения СД / ОСА.
    - code: "AUTH4"
      description: >
        Признаки заинтересованной сделки, но нет упоминания
        одобрения.
    - code: "AUTH5"
      description: >
        Доверенность с истёкшим или неуказанным сроком
        действия.
    - code: "AUTH6"
      description: >
        Специальная / разовая доверенность, которая может
        не покрывать данный тип сделки.
