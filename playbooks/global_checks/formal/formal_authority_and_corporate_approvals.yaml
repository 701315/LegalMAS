id: "formal_authority_and_corporate_approvals"
name: "Полномочия подписантов и корпоративные одобрения"
description: >
  Анализирует полномочия подписантов договора, наличие корпоративных одобрений
  (решения органов управления) и соответствие этим требованиям по крупным и
  заинтересованным сделкам.

doc_types: []

severity: "high"
severity_if_fail: "critical"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"

rules:
  keywords:
    - "подписант"
    - "уполномочен"
    - "authorised signatory"
    - "signing authority"
    - "действует на основании"
    - "bylaws"
    - "устав"
    - "charter"
    - "board resolution"
    - "решение совета директоров"
    - "решение общего собрания"
    - "shareholders' resolution"
    - "одобрение сделки"
    - "approval of the transaction"
    - "крупная сделка"
    - "заинтересованная сделка"
    - "interested party transaction"
  keyword_mode: "any"
  regex_patterns: []
  clause_patterns: []

llm:
  prompt_template: |
    <role>
    Ты — старший корпоративный юрист с глубокой экспертизой в российском
    корпоративном праве. 
    Твоя специализация — анализ рисков, связанных с полномочиями
    подписантов и корпоративными одобрениями сделок в рамках юридического
    due diligence.
    </role>

    <context>
    Ниже приведены фрагменты договора и/или корпоративных документов,
    связанных с подписанием договора:

    {context}
    </context>

    <instructions>
    Проведи анализ строго по следующим шагам:

    Шаг 1 — ИДЕНТИФИКАЦИЯ ПОДПИСАНТОВ:
    Выпиши всех подписантов, их должности и от имени какой стороны
    они подписали. Если подписант не идентифицирован — зафиксируй это.

    Шаг 2 — ОСНОВАНИЯ ПОЛНОМОЧИЙ:
    Для каждого подписанта определи, указано ли основание полномочий:
    устав, доверенность (с номером/датой или без), решение органа
    управления, иной документ. Если основание не указано — зафиксируй.

    Шаг 3 — ПРИЗНАКИ КРУПНОЙ / ЗАИНТЕРЕСОВАННОЙ СДЕЛКИ:
    Проверь, есть ли в тексте прямые или косвенные признаки:
    — крупной сделки (сумма, указание на процент от активов, прямое
      упоминание «крупная сделка»);
    — заинтересованной сделки (аффилированность, совпадение лиц
      в органах управления сторон, прямое упоминание).
    Если информации недостаточно для вывода — ставь "unclear",
    НЕ делай предположений.

    Шаг 4 — КОРПОРАТИВНЫЕ ОДОБРЕНИЯ:
    Если выявлены признаки крупной/заинтересованной сделки —
    проверь, упоминаются ли решения СД, ОСА, протоколы одобрения.
    Если признаков крупной/заинтересованной сделки нет — укажи,
    что проверка одобрений нерелевантна (но risk = не выше "low").

    Шаг 5 — ИТОГОВАЯ ОЦЕНКА РИСКА:
    Сопоставь результаты шагов 1–4 и определи совокупный формальный
    риск с точки зрения применимого законодательства. 
    Обоснуй конкретными фактами из фрагментов.

    Если разные фрагменты противоречат друг другу (например, в одном
    есть указание на корпоративное одобрение, а в другом — явное
    отсутствие одобрения), не пытайся усреднить. Отрази противоречие
    в поле "reason" и установи уровень риска не ниже "medium".
    </instructions>

    <edge_cases>
    ВАЖНО — как обрабатывать пограничные ситуации:

    — Если фрагменты содержат ТОЛЬКО преамбулу без подписных блоков:
      mentions_basis_of_signing_authority = "unclear",
      authority_and_approvals_risk_level = "unclear".

    — Если подписант указан, но без должности и без основания
      полномочий: mentions_basis_of_signing_authority = "no" (НЕ "unclear").

    — Если доверенность упомянута, но без номера и даты:
      authority_and_approvals_risk_level = не ниже "medium".

    — Если сумма сделки неизвестна из контекста — НЕ предполагай,
      что сделка не является крупной. Ставь
      mentions_corporate_approvals_for_transaction = "unclear".

    — Генеральный директор ≠ автоматически полные полномочия.
      У ГД могут быть ограничения по уставу. Если устав не приложен —
      отрази это в reason.

    — Если фрагменты противоречат друг другу (например, в одном месте
      указана доверенность, в другом — устав для того же лица) —
      отрази противоречие в reason, risk = не ниже "medium".

    — Пустые или нерелевантные фрагменты: если из контекста невозможно
      извлечь никакой информации о подписантах — все поля = "unclear"
      или пустые строки, overall_risk_level = "high",
      reason = "Недостаточно данных для анализа".
    </edge_cases>

    <examples>
    ПРИМЕР 1 — НИЗКИЙ РИСК:

    Фрагмент: "Настоящий Договор подписан от имени ООО 'Альфа'
    Генеральным директором Ивановым И.И., действующим на основании
    Устава (в ред. от 15.03.2023), и от имени ООО 'Бета'
    Генеральным директором Сидоровым С.С., действующим на основании
    Устава. Сделка одобрена решением Совета директоров ООО 'Альфа'
    (протокол №5 от 10.01.2024) как крупная сделка."

    {{
      "signatories_and_titles_summary": "ООО 'Альфа': Генеральный директор Иванов И.И. (устав в ред. от 15.03.2023); ООО 'Бета': Генеральный директор Сидоров С.С. (устав)",
      "mentions_basis_of_signing_authority": "yes",
      "mentions_corporate_approvals_for_transaction": "yes",
      "authority_and_approvals_risk_level": "low",
      "overall_risk_level": "low",
      "reason": "Полномочия обоих подписантов подтверждены уставами. Сделка квалифицирована как крупная и одобрена решением СД (протокол №5 от 10.01.2024)."
    }}

    ПРИМЕР 2 — ВЫСОКИЙ РИСК:

    Фрагмент: "Договор купли-продажи недвижимости на сумму
    450 000 000 руб. подписан от имени ООО 'Гамма' Коммерческим
    директором Петровым П.П. Основание полномочий не указано.
    Информация об одобрении сделки органами управления отсутствует."

    {{
      "signatories_and_titles_summary": "ООО 'Гамма': Коммерческий директор Петров П.П. (основание полномочий не указано)",
      "mentions_basis_of_signing_authority": "no",
      "mentions_corporate_approvals_for_transaction": "no",
      "authority_and_approvals_risk_level": "high",
      "overall_risk_level": "high",
      "reason": "Подписант — не единоличный исполнительный орган, основание полномочий не указано. Значительная сумма сделки (450 млн руб.) указывает на возможную крупную сделку, но одобрение отсутствует. Риск оспаривания по ст. 173.1 ГК РФ и ст. 46 Закона об ООО."
    }}

    ПРИМЕР 3 — СРЕДНИЙ РИСК (НЕПОЛНЫЕ ДАННЫЕ):

    Фрагмент: "Договор заключён между АО 'Дельта' в лице
    Генерального директора Козлова А.В., действующего на основании
    Устава, и ООО 'Эпсилон' в лице представителя по доверенности.
    Номер и дата доверенности не указаны."

    {{
      "signatories_and_titles_summary": "АО 'Дельта': Генеральный директор Козлов А.В. (устав); ООО 'Эпсилон': представитель по доверенности (реквизиты доверенности не указаны, ФИО не указано)",
      "mentions_basis_of_signing_authority": "yes",
      "mentions_corporate_approvals_for_transaction": "unclear",
      "authority_and_approvals_risk_level": "medium",
      "overall_risk_level": "medium",
      "reason": "Полномочия ГД АО 'Дельта' подтверждены уставом. Однако представитель ООО 'Эпсилон' не идентифицирован, реквизиты доверенности отсутствуют — невозможно проверить объём полномочий. Информации о характере сделки недостаточно для оценки необходимости корпоративных одобрений."
    }}
    </examples>

    <output_format>
    Твой ответ ДОЛЖЕН быть строго валидным JSON-объектом со следующими
    полями:

    {{
      "signatories_and_titles_summary": "string — краткое описание подписантов, их должностей и оснований полномочий для каждой стороны",
      "mentions_basis_of_signing_authority": "one of: yes | no | unclear (строка, только одно из этих значений)",
      "mentions_corporate_approvals_for_transaction": "one of: yes | no | unclear (строка, только одно из этих значений)",
      "authority_and_approvals_risk_level": "one of: low | medium | high | unclear",
      "overall_risk_level": "one of: low | medium | high",
      "reason": "string — конкретное обоснование со ссылками на факты из фрагментов и желательно с короткими цитатами в кавычках"
    }}

    Все перечисленные поля ДОЛЖНЫ присутствовать в JSON, даже если их значение равно null.
    </output_format>

    <constraints>
    ЖЁСТКИЕ ПРАВИЛА:
    1. Выведи ТОЛЬКО один JSON-объект. Никакого текста до или после.
    2. Не пиши "Вот JSON", "Here is the JSON" и т.п.
    3. Не используй Markdown, бэктики ``` или любые обёртки.
    4. Все строки — в двойных кавычках.
    5. Значения перечислимых полей — СТРОГО из указанных вариантов.
    6. Ключи — точно как указано, без добавления новых.
    7. Поле "reason" ДОЛЖНО содержать конкретные факты из фрагментов,
       а не общие фразы вроде "всё в порядке" или "есть риски". Желательно
       включать короткие цитаты из текста в кавычках.
    8. Начни ответ сразу с символа {{
    9. Если по какому‑то полю нет достаточно информации в тексте —
       верни для него null. НЕ придумывай значения, не интерполируй,
       не используй формулировки вроде "не указано", "N/A", "не найдено".
    </constraints>
  prompt_file: null
  context_k: 7
  temperature: 0.0
  max_tokens: 800

evidence:
  required: false
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  context_k: 5
  max_chunks: 10
  boost_keywords:
    - "authorised signatory"
    - "действует на основании"
    - "board resolution"
    - "решение совета директоров"
    - "одобрение сделки"
    - "крупная сделка"
  rerank: true
  filters: {}

conditional: null

extraction:
  enabled: true
  mode: "hybrid"
  fields:
    - name: "signatories_and_titles_summary"
      type: "string"

    - name: "mentions_basis_of_signing_authority"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "mentions_corporate_approvals_for_transaction"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "authority_and_approvals_risk_level"
      type: "string"
      allowed_values:
        - "low"
        - "medium"
        - "high"
        - "unclear"

    - name: "overall_risk_level"
      type: "string"
      allowed_values:
        - "low"
        - "medium"
        - "high"

    - name: "reason"
      type: "string"

  store_payload: true

red_flags:
  items:
    - code: "FORM1"
      description: "Подписанты без явно подтверждённых полномочий по крупной/заинтересованной сделке."
    - code: "FORM2"
      description: "Отсутствие упоминаний о корпоративных одобрениях там, где они явно требуются."