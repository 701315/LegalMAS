id: "formal_authority_and_corporate_approvals"
name: "Полномочия подписантов и корпоративные одобрения"
description: >
  Анализирует полномочия подписантов договора, наличие корпоративных одобрений
  (решения органов управления) и соответствие этим требованиям по крупным и
  заинтересованным сделкам.

doc_types: []

severity: "high"
severity_if_fail: "critical"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"

rules:
  keywords:
    - "подписант"
    - "уполномочен"
    - "authorised signatory"
    - "signing authority"
    - "действует на основании"
    - "bylaws"
    - "устав"
    - "charter"
    - "board resolution"
    - "решение совета директоров"
    - "решение общего собрания"
    - "shareholders' resolution"
    - "одобрение сделки"
    - "approval of the transaction"
    - "крупная сделка"
    - "заинтересованная сделка"
    - "interested party transaction"
  keyword_mode: "any"
  regex_patterns: []
  clause_patterns: []

llm:
  prompt_template: |
    <role>
    Ты — старший корпоративный юрист с глубокой экспертизой в российском
    корпоративном праве. Твоя специализация — анализ рисков, связанных
    с полномочиями подписантов и корпоративными одобрениями сделок
    в рамках юридического due diligence.
    </role>

    <context>
    Ниже приведены фрагменты договора и/или корпоративных документов,
    связанных с подписанием договора:

    {context}
    </context>

    <instructions>
    Проведи анализ строго по следующим шагам.
    Каждый шаг логически соответствует одному или нескольким
    полям итоговой оценки риска:

    Шаг 1 — ИДЕНТИФИКАЦИЯ ПОДПИСАНТОВ
    (используется для заполнения поля "signatories_and_titles_summary"):
    - Определи всех подписантов, их должности и от имени какой стороны
      они подписали.
    - Если подписант не идентифицирован, явно зафиксируй это.

    Шаг 2 — ОСНОВАНИЯ ПОЛНОМОЧИЙ
    (используется для заполнения поля "mentions_basis_of_signing_authority"):
    - Для каждого подписанта определи, указано ли основание полномочий:
      устав, доверенность (с номером/датой или без), решение органа
      управления, иной документ.
    - Если основание не указано, отрази это как отсутствие указания
      основания полномочий.

    Шаг 3 — ПРИЗНАКИ КРУПНОЙ / ЗАИНТЕРЕСОВАННОЙ СДЕЛКИ
    (используется для заполнения поля
     "mentions_corporate_approvals_for_transaction"):
    - Проверь, есть ли признаки крупной сделки:
      сумма, указание на процент от активов, прямое упоминание
      «крупная сделка».
    - Проверь, есть ли признаки заинтересованной сделки:
      аффилированность, совпадение лиц в органах управления сторон,
      прямые упоминания заинтересованности.
    - Если информации недостаточно, используй вывод "unclear" и не
      делай предположений.

    Шаг 4 — КОРПОРАТИВНЫЕ ОДОБРЕНИЯ
    (используется для формирования "authority_and_approvals_risk_level"):
    - Если есть признаки крупной/заинтересованной сделки, проверь,
      упоминаются ли решения совета директоров, общего собрания,
      протоколы одобрения.
    - Если признаков нет или данных недостаточно, отрази это явно
      в своём анализе и уровне риска.

    Шаг 5 — ИТОГОВАЯ ОЦЕНКА РИСКА
    (используется для формирования "overall_risk_level" и "reason"):
    - Сопоставь результаты шагов 1–4 и определи общий формальный риск
      по полномочиям и корпоративным одобрениям.
    - Обоснуй вывод ссылками на конкретные формулировки из фрагментов.
    - Если фрагменты противоречат друг другу, явно зафиксируй
      противоречия и оцени риск не ниже "medium".
    </instructions>

    <edge_cases>
    Обрабатывай пограничные ситуации так:

    - Только преамбула без подписных блоков:
      информация о полномочиях и одобрениях считается "unclear".
    - Подписант указан без должности и без основания полномочий:
      трактуй это как отсутствие указания основания полномочий.
    - Доверенность без номера и даты: оцени связанный риск не ниже "medium".
    - Неизвестная сумма сделки: не делай вывода, что сделка не крупная;
      используй "unclear" там, где не хватает данных.
    - Генеральный директор не считается автоматически имеющим полные
      полномочия при отсутствии устава в материалах.
    - При противоречивых фрагментах (разные основания полномочий или
      сведения об одобрениях по одному лицу) явно описывай противоречие
      и не занижай риск ниже "medium".
    </edge_cases>

    <output_expectations>
    На основе твоего анализа отдельный механизм извлечения сформирует
    структурированный JSON с полями по заранее заданной схеме.
    Твоя задача — давать чёткие юридические выводы и указывать
    конкретные формулировки из текста, на которых они основаны.
    </output_expectations>
  prompt_file: null
  context_k: 7
  temperature: 0.0
  max_tokens: 800

evidence:
  required: false
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  context_k: 5
  max_chunks: 10
  boost_keywords:
    - "authorised signatory"
    - "действует на основании"
    - "board resolution"
    - "решение совета директоров"
    - "одобрение сделки"
    - "крупная сделка"
  rerank: true
  filters: {}

conditional: null

extraction:
  enabled: true
  mode: "hybrid"
  fields:
    - name: "signatories_and_titles_summary"
      type: "string"

    - name: "mentions_basis_of_signing_authority"
      type: "string"
      allowed_values: ["yes", "no", "unclear"]

    - name: "mentions_corporate_approvals_for_transaction"
      type: "string"
      allowed_values: ["yes", "no", "unclear"]

    - name: "authority_and_approvals_risk_level"
      type: "string"
      allowed_values: ["low", "medium", "high", "unclear"]

    - name: "overall_risk_level"
      type: "string"
      allowed_values: ["low", "medium", "high"]

    - name: "reason"
      type: "string"

  store_payload: true

red_flags:
  items:
    - code: "FORM1"
      description: "Подписанты без явно подтверждённых полномочий по крупной/заинтересованной сделке."
    - code: "FORM2"
      description: "Отсутствие упоминаний о корпоративных одобрениях там, где они явно требуются."