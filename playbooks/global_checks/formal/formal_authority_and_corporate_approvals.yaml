id: "formal_authority_and_corporate_approvals"
name: "Полномочия подписантов и корпоративные одобрения"
description: >
  Анализирует полномочия подписантов договора и корпоративные
  одобрения: идентификация подписантов и их должностей, основания
  полномочий (устав, доверенность, решение органа), тип и реквизиты
  доверенности, признаки крупной и заинтересованной сделки по
  российскому праву (14-ФЗ / 208-ФЗ), наличие решений СД / ОСА,
  статус одобрения (до / после подписания).

  Формирует краткий user-facing вывод и оценивает формальный риск
  недействительности или оспоримости сделки.

doc_types: []

severity: "high"
severity_if_fail: "critical"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"
ui_mode: "field_extraction"

rules:
  keyword_mode: any

  keywords:
    high:
      # Подписант и полномочия
      - "(?i)подписант"
      - "(?i)уполномочен"
      - "(?i)authorised?\\s+signatory"
      - "(?i)signing\\s+authority"
      - "(?i)действует\\s+на\\s+основании"
      - "(?i)acting\\s+(on\\s+the\\s+)?basis\\s+of"
      - "(?i)duly\\s+authorised?"

      # Устав / учредительные документы
      - "(?i)\\bустав[аеу]?\\b"
      - "(?i)\\bcharter\\b"
      - "(?i)articles\\s+of\\s+(association|incorporation)"
      - "(?i)учредительн[а-я]+\\s+документ"

      # Доверенность
      - "(?i)доверенност[ьи]"
      - "(?i)power\\s+of\\s+attorney"
      - "(?i)\\bPoA\\b"
      - "(?i)на\\s+основании\\s+доверенност[ьи]"
      - "(?i)pursuant\\s+to\\s+(a\\s+)?power\\s+of\\s+attorney"

      # Решения органов
      - "(?i)board\\s+resolution"
      - "(?i)решени[ея]\\s+совета\\s+директоров"
      - "(?i)решени[ея]\\s+СД"
      - "(?i)shareholders['']?\\s+resolution"
      - "(?i)решени[ея]\\s+общего\\s+собрани[яи]"
      - "(?i)решени[ея]\\s+ОС[АУ]"
      - "(?i)протокол\\s+(заседания\\s+)?(СД|совета|собрания)"

      # Крупная сделка
      - "(?i)крупн[а-я]+\\s+сделк"
      - "(?i)major\\s+transaction"
      - "(?i)significant\\s+transaction"
      - "(?i)exceeds?\\s+25\\s*%"
      - "(?i)превышает\\s+25\\s*%"
      - "(?i)балансов[а-я]+\\s+стоимост[ьи]\\s+актив"

      # Заинтересованная сделка
      - "(?i)заинтересованн[а-я]+\\s+сделк"
      - "(?i)interested\\s+party\\s+transaction"
      - "(?i)related\\s+party\\s+transaction"
      - "(?i)\\bRPT\\b"
      - "(?i)сделк[аи]\\s+с\\s+заинтересованност"

    medium:
      # Одобрение
      - "(?i)одобрени[ея]\\s+сделк"
      - "(?i)approval\\s+of\\s+(the\\s+)?transaction"
      - "(?i)corporate\\s+approval"
      - "(?i)корпоративн[а-я]+\\s+одобрени"
      - "(?i)consent\\s+of\\s+(the\\s+)?(board|shareholders)"

      # Генеральный директор / единоличный орган
      - "(?i)генеральн[а-я]+\\s+директор"
      - "(?i)\\bCEO\\b"
      - "(?i)единоличн[а-я]+\\s+исполнительн[а-я]+\\s+орган"
      - "(?i)sole\\s+executive\\s+body"

      # Представитель / доверенное лицо
      - "(?i)представитель"
      - "(?i)attorney[-\\s]?in[-\\s]?fact"

      # Реквизиты доверенности
      - "(?i)доверенност[ьи]\\s+(№|#|номер)\\s*\\d+"
      - "(?i)доверенност[ьи]\\s+от\\s+\\d"
      - "(?i)power\\s+of\\s+attorney\\s+(No\\.?|#|dated)\\s*\\d+"

      # Аффилированность
      - "(?i)аффилированн[а-я]+\\s+лиц"
      - "(?i)affiliated\\s+(persons?|entities?|parties?)"

    low:
      - "(?i)authorised?\\s+signatory"
      - "(?i)power\\s+of\\s+attorney"
      - "(?i)доверенност[ьи]"
      - "(?i)board\\s+resolution"
      - "(?i)крупная\\s+сделка"
      - "(?i)заинтересованная\\s+сделка"
      - "(?i)related\\s+party"
      - "(?i)протокол\\s+(СД|собрания)"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 7
  temperature: 0.0
  max_tokens: 800

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 700

retrieval:
  context_k: 6
  max_chunks: 12
  boost_keywords:
    - "подписант"
    - "уполномочен"
    - "authorised signatory"
    - "действует на основании"
    - "acting on the basis of"
    - "доверенность"
    - "power of attorney"
    - "устав"
    - "charter"
    - "articles of association"
    - "board resolution"
    - "решение совета директоров"
    - "решение СД"
    - "shareholders resolution"
    - "решение общего собрания"
    - "одобрение сделки"
    - "approval of the transaction"
    - "крупная сделка"
    - "major transaction"
    - "заинтересованная сделка"
    - "interested party transaction"
    - "related party transaction"
    - "аффилированное лицо"
    - "генеральный директор"
    - "CEO"
  rerank: true
  filters: {}

conditional: null

enrichment_hints:
  preferred_segment_types:
    - "contract"
    - "amendment"
  excluded_segment_types:
    - "technical_specification"
    - "price_list"
    - "invoice"
    - "act"
    - "schedule"
  preferred_clause_functions:
    - "general_provisions"
    - "representations_warranties"
  confidence_bonus_on_match: 0.08
  confidence_penalty_on_excluded_segment: 0.15

extraction:
  enabled: true
  mode: "hybrid"
  llm_max_tokens: 500
  llm_prompt_extraction: |
    <role>
    Ты — старший корпоративный юрист.
    Твоя задача — точно извлечь из текста:
    1) кто подписал договор и на каком основании;
    2) есть ли признаки крупной или заинтересованной сделки;
    3) есть ли упоминания корпоративных одобрений;
    4) каков статус одобрения (до / после подписания).
    </role>

    <context>
    Ниже приведены релевантные фрагменты договора:

    {context}
    </context>

    <task>
    Заполни только следующие поля:
    - authority_display
    - signatories_summary
    - authority_basis_mentioned
    - major_transaction_indicators
    - interested_party_transaction_indicators
    - corporate_approvals_mentioned
    - approval_timing
    - red_flags
    - reason

    Важно:
    - не делай вывода о размере сделки если данных нет;
    - не считай ГД автоматически уполномоченным без ссылки
      на устав или иное основание;
    - пиши user-facing значения коротко и по-русски.
    </task>

    <instructions>
    Шаг 1 — ИДЕНТИФИКАЦИЯ ПОДПИСАНТОВ

    Заполни поле "signatories_summary".

    Правила:
    - Кратко опиши всех подписантов через ";":
      * "Иванов И.И., Генеральный директор, ООО 'Альфа';
         Smith J., CEO, Beta Ltd."
    - Если подписанты не идентифицированы:
      "Подписанты не идентифицированы"

    Шаг 2 — ОСНОВАНИЯ ПОЛНОМОЧИЙ

    Заполни поле "authority_basis_mentioned".

    Значения:
    - "yes_complete" — основание указано с реквизитами
      (устав + дата регистрации, или доверенность №/дата).
    - "yes_incomplete" — основание указано, но без реквизитов
      (просто "на основании устава" или "по доверенности"
      без номера/даты).
    - "no" — основание не указано вообще.
    - "unclear" — неясно.

    Шаг 3 — ПРИЗНАКИ КРУПНОЙ СДЕЛКИ

    Заполни поле "major_transaction_indicators".

    Значения:
    - "yes" — есть признаки по ст. 46 14-ФЗ / ст. 78–79 208-ФЗ:
      прямое упоминание "крупная сделка", сумма > 25%
      балансовой стоимости активов, ссылки на порог.
    - "no" — признаков нет.
    - "unclear" — данных недостаточно.

    Шаг 4 — ПРИЗНАКИ ЗАИНТЕРЕСОВАННОЙ СДЕЛКИ

    Заполни поле "interested_party_transaction_indicators".

    Значения:
    - "yes" — есть признаки по ст. 45 14-ФЗ / ст. 81–84 208-ФЗ:
      прямое упоминание "заинтересованная сделка", RPT,
      аффилированность сторон, совпадение лиц в органах
      управления.
    - "no" — признаков нет.
    - "unclear" — данных недостаточно.

    Шаг 5 — КОРПОРАТИВНЫЕ ОДОБРЕНИЯ

    Заполни поле "corporate_approvals_mentioned".

    Значения:
    - "yes" — упоминаются решения СД / ОСА / протоколы
      одобрения (с реквизитами или без).
    - "no" — не упоминаются при наличии признаков
      крупной / заинтересованной сделки.
    - "not_required" — признаков крупной / заинтересованной
      нет, одобрение формально не требуется.
    - "unclear" — неясно.

    Шаг 6 — СТАТУС ОДОБРЕНИЯ

    Заполни поле "approval_timing".

    Значения:
    - "pre_signing" — одобрение получено до подписания.
    - "post_factum" — одобрение получено задним числом
      (дата решения после даты подписания договора).
    - "not_applicable" — одобрения нет или не требуется.
    - "unclear" — невозможно определить.

    Шаг 7 — RED FLAGS

    Заполни поле "red_flags".

    Используй:
    - "NONE" — если существенных риск-факторов нет.
    - "UNCLEAR" — если данных недостаточно.
    - Коды через запятую:
      * AUTH1 — подписант без явного основания полномочий
        (нет ссылки на устав / доверенность).
      * AUTH2 — доверенность без номера и/или даты.
      * AUTH3 — признаки крупной сделки, нет упоминания
        одобрения СД / ОСА.
      * AUTH4 — признаки заинтересованной сделки, нет
        упоминания одобрения.
      * AUTH5 — доверенность с истёкшим или неуказанным
        сроком действия.
      * AUTH6 — специальная / разовая доверенность, которая
        может не покрывать данный тип сделки.
      * AUTH7 — одобрение получено задним числом
        (post factum).

    Шаг 8 — USER-FACING SUMMARY

    Заполни поле "authority_display".

    Примеры:
    - "Иванов И.И., ГД, на основании устава; крупная сделка —
       одобрение СД от 01.01.2024"
    - "Smith J., CEO, на основании PoA №123 от 01.01.2024;
       RPT — одобрение не упоминается"
    - "Подписант без основания полномочий; признаки крупной
       сделки; одобрение не упоминается"
    - "Не удалось определить полномочия подписантов"

    Правила:
    - Отрази максимум 3 ключевых факта через ";".
    - Приоритизируй самые критичные находки.
    - Если нет проблем:
      "Полномочия подтверждены; [тип основания]"
    - Если все unclear:
      "Не удалось определить полномочия подписантов"

    Шаг 9 — ОБОСНОВАНИЕ

    Заполни поле "reason".

    Правила:
    - 1–2 коротких предложения.
    - Укажи: кто подписал, на каком основании, признаки
      крупной / заинтересованной сделки, состояние одобрений,
      почему выставлены red_flags.
    - Приведи короткую цитату в кавычках.
    - Если NONE — почему формальные требования соблюдены.
    </instructions>

    <edge_cases>
    - Только преамбула без подписных блоков:
      * signatories_summary = "Подписанты не идентифицированы"
      * authority_basis_mentioned = "unclear"

    - ГД без ссылки на устав:
      * authority_basis_mentioned = "no"
      * red_flags включает "AUTH1"
      * в reason: ГД не считается автоматически уполномоченным

    - Доверенность без номера и даты:
      * authority_basis_mentioned = "yes_incomplete"
      * red_flags включает "AUTH2"

    - Неизвестная сумма сделки:
      * major_transaction_indicators = "unclear"
      * не делай вывода, что сделка не крупная

    - Признаки крупной сделки, нет одобрения:
      * corporate_approvals_mentioned = "no"
      * red_flags включает "AUTH3"

    - Ретроспективное одобрение:
      * approval_timing = "post_factum"
      * red_flags включает "AUTH7"

    - Всё в порядке:
      * red_flags = "NONE"
      * в reason: почему формальные требования соблюдены

    - Нет релевантных фрагментов:
      * все поля = "unclear"
      * red_flags = "UNCLEAR"
      * authority_display =
        "Не удалось определить полномочия подписантов"
    </edge_cases>

    <output_expectations>
    Все значения должны быть короткими, точными и пригодными
    для отображения пользователю в DD Grid.
    Не добавляй никаких полей, кроме указанных в схеме extraction.
    </output_expectations>

  fields:
    - name: "authority_display"
      type: "string"
      description: "Полномочия подписантов: краткий вывод"

    - name: "signatories_summary"
      type: "string"
      description: "Краткое описание подписантов"

    - name: "authority_basis_mentioned"
      type: "string"
      description: "Основание полномочий"
      allowed_values:
        - "yes_complete"
        - "yes_incomplete"
        - "no"
        - "unclear"

    - name: "major_transaction_indicators"
      type: "string"
      description: "Признаки крупной сделки"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "interested_party_transaction_indicators"
      type: "string"
      description: "Признаки заинтересованной сделки"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "corporate_approvals_mentioned"
      type: "string"
      description: "Корпоративные одобрения"
      allowed_values:
        - "yes"
        - "no"
        - "not_required"
        - "unclear"

    - name: "approval_timing"
      type: "string"
      description: "Момент получения одобрения"
      allowed_values:
        - "pre_signing"
        - "post_factum"
        - "not_applicable"
        - "unclear"

    - name: "red_flags"
      type: "string"
      description: "Коды рисков"

    - name: "reason"
      type: "string"
      description: "Обоснование"

  store_payload: true


  
