id: "corporate_approvals_and_transaction_qualification"
name: "Корпоративные одобрения и квалификация сделки"
group: "Document completeness"
description: >
  Анализирует необходимость и наличие корпоративных одобрений
  для заключения договора: признаки крупной сделки
  (ст. 46 14-ФЗ / ст. 78–79 208-ФЗ), признаки сделки
  с заинтересованностью (ст. 45 14-ФЗ / ст. 81–84 208-ФЗ),
  наличие решений СД / ОСА, соблюдение сроков одобрения
  (до или после подписания).

  Формирует краткий user-facing вывод и оценивает формальный риск
  оспоримости сделки из-за отсутствия корпоративного одобрения.

  Полномочия подписантов анализируются отдельным чеком
  signatory_authority_and_basis.

doc_types: []

severity: "high"
severity_if_fail: "critical"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"
ui_mode: "field_extraction"

rules:
  keyword_mode: any

  keywords:
    high:
      - "(?i)крупн[а-я]+\\s+сделк"
      - "(?i)major\\s+transaction"
      - "(?i)significant\\s+transaction"
      - "(?i)exceeds?\\s+25\\s*%"
      - "(?i)превышает\\s+25\\s*%"
      - "(?i)балансов[а-я]+\\s+стоимост[ьи]\\s+актив"
      - "(?i)заинтересованн[а-я]+\\s+сделк"
      - "(?i)interested\\s+party\\s+transaction"
      - "(?i)related\\s+party\\s+transaction"
      - "(?i)\\bRPT\\b"
      - "(?i)сделк[аи]\\s+с\\s+заинтересованност"
      - "(?i)board\\s+resolution"
      - "(?i)решени[ея]\\s+совета\\s+директоров"
      - "(?i)решени[ея]\\s+СД"
      - "(?i)shareholders['']?\\s+resolution"
      - "(?i)решени[ея]\\s+общего\\s+собрани[яи]"
      - "(?i)решени[ея]\\s+ОС[АУ]"
      - "(?i)протокол\\s+(заседания\\s+)?(СД|совета|собрания)"

    medium:
      - "(?i)одобрени[ея]\\s+сделк"
      - "(?i)approval\\s+of\\s+(the\\s+)?transaction"
      - "(?i)corporate\\s+approval"
      - "(?i)корпоративн[а-я]+\\s+одобрени"
      - "(?i)consent\\s+of\\s+(the\\s+)?(board|shareholders)"
      - "(?i)аффилированн[а-я]+\\s+лиц"
      - "(?i)affiliated\\s+(persons?|entities?|parties?)"
      - "(?i)бенефициарн[а-я]+\\s+владел"
      - "(?i)beneficial\\s+owner"
      - "(?i)контролирующ[а-я]+\\s+лиц"
      - "(?i)controlling\\s+person"
      - "(?i)\\b14[-\\s]?ФЗ\\b"
      - "(?i)\\b208[-\\s]?ФЗ\\b"
      - "(?i)Федеральн[а-я]+\\s+закон[\\s\\S]{0,20}(об\\s+обществ|акционерн)"

    low:
      - "(?i)крупная\\s+сделка"
      - "(?i)заинтересованная\\s+сделка"
      - "(?i)related\\s+party"
      - "(?i)board\\s+resolution"
      - "(?i)протокол\\s+(СД|собрания)"
      - "(?i)corporate\\s+approval"
      - "(?i)аффилированн[а-я]+\\s+лиц"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 6
  temperature: 0.0
  max_tokens: 700

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 700

retrieval:
  retrieval_profile: "authority_check"
  context_k: 6
  max_chunks: 12

  retrieval_query: >
    крупная сделка заинтересованная сделка одобрение совет директоров
    общее собрание акционеров решение СД протокол одобрение сделки
    аффилированные лица related party transaction corporate approval
    board resolution shareholders resolution

  boost_keywords:
    - "крупная сделка"
    - "major transaction"
    - "заинтересованная сделка"
    - "interested party transaction"
    - "related party transaction"
    - "RPT"
    - "board resolution"
    - "решение совета директоров"
    - "решение СД"
    - "shareholders resolution"
    - "решение общего собрания"
    - "одобрение сделки"
    - "approval of the transaction"
    - "corporate approval"
    - "корпоративное одобрение"
    - "аффилированное лицо"
    - "affiliated person"
    - "протокол заседания"
    - "14-ФЗ"
    - "208-ФЗ"
    - "балансовая стоимость активов"

  negative_keywords:
    - "штрафные санкции"
    - "условия оплаты"
    - "валюта платежа"
    - "подсудность"
    - "применимое право"
    - "форс-мажор"
    - "доверенность"
    - "power of attorney"

  preferred_unit_types:
    - "general_provision"
    - "structural_anchor"

  excluded_unit_types:
    - "technical_fragment"
    - "appendix_reference"

  preferred_clause_functions:
    - "boilerplate"
    - "representations"

  position_bias:
    preferred_range: [0.00, 1.00]
    boost: 0.10
    scope: "segment"

  rerank: true
  filters: {}

conditional: null

enrichment_hints:
  preferred_segment_types:
    - "contract"
    - "amendment"
  excluded_segment_types:
    - "technical_specification"
    - "price_list"
    - "invoice"
    - "act"
    - "schedule"
  confidence_bonus_on_match: 0.08
  confidence_penalty_on_excluded_segment: 0.15

extraction:
  enabled: true
  mode: "hybrid"
  llm_max_tokens: 1100

  presence_signal:
    field: "corporate_approvals_status"
    present_values: ["present"]
    missing_values: ["missing"]
    unclear_values: ["unclear"]

  llm_prompt_extraction: |
    <role>
    Ты — старший корпоративный юрист, специализирующийся
    на корпоративных одобрениях и квалификации сделок по
    российскому корпоративному праву.

    Твоя задача — точно извлечь из текста:
    1) есть ли в договоре раздел / положения по теме корпоративных
       одобрений и квалификации сделки;
    2) если есть — какие условия установлены:
       - признаки крупной сделки;
       - признаки сделки с заинтересованностью;
       - статус корпоративных одобрений;
       - момент получения одобрения (до / после подписания).

    КРИТИЧЕСКИ ВАЖНО:
    - Извлекай ТОЛЬКО то, что прямо написано в тексте.
    - НЕ делай вывод о крупности сделки по одному только
      предмету договора — нужны прямые маркеры.
    - НЕ считай отсутствие упоминания одобрения автоматическим
      нарушением — если нет признаков крупной / заинтересованной
      сделки, одобрение может быть не нужно.
    - Если раздел / положения по теме в договоре отсутствуют —
      corporate_approvals_status = "missing".
    - Если тексты по теме есть, но вывод сделать нельзя —
      corporate_approvals_status = "unclear".

    Полномочия подписантов анализируются отдельным чеком —
    здесь их не затрагивай.
    </role>

    <context_rules>
    - Некоторые фрагменты могут быть нерелевантны — игнорируй их.
    - Если есть ссылка на решение СД / ОСА, но без реквизитов —
      это упоминание, но неполное.
    - Признаки крупной сделки:
      * прямое упоминание "крупная сделка" / "major transaction";
      * упоминание порога 25% балансовой стоимости активов;
      * иные прямые маркеры по тексту.
    - Признаки заинтересованности:
      * прямое упоминание "сделка с заинтересованностью" / RPT;
      * упоминание аффилированных лиц;
      * бенефициарного владельца;
      * контролирующего лица.
    - Не делай выводов на основании предположений о размере сделки.
    - Если ни один фрагмент не содержит информации по теме
      корпоративных одобрений и квалификации сделки —
      corporate_approvals_status = "missing", location = null.
      Не использовать "unclear" при полном отсутствии
      релевантных фрагментов.
    </context_rules>

    <context>
    Ниже приведены релевантные фрагменты договора:

    {context}
    </context>

    <task>
    Заполни только следующие поля:
    - approvals_display
    - transaction_qualification
    - approval_status_summary
    - corporate_approvals_status
    - major_transaction_indicators
    - interested_party_indicators
    - corporate_approvals_mentioned
    - approval_body
    - approval_timing
    - reason
    </task>

    <location_instructions>
    Для каждого поля по возможности укажи location в формате:
    {"clause_ref": "п. 12.1", "page": 7, "quote": "дословная фраза из договора"}

    Правила:
    - clause_ref — короткая ссылка на пункт / раздел / статью именно в том виде,
      как она написана в договоре;
    - page — целое число страницы;
    - quote — дословная фраза из текста договора (НЕ пересказ, НЕ парафраз).
      Копируй её посимвольно, сохраняя формулировку и порядок слов.
      Оптимальная длина: 30–300 символов.
    - Для synthesized-полей (approvals_display, transaction_qualification,
      approval_status_summary, reason) location ВСЕГДА null.
    - Для corporate_approvals_status = "missing" — location = null.
    - Для corporate_approvals_status = "present" / "unclear" — quote
      с наиболее релевантной фразой договора.
    - Для major_transaction_indicators = "no" или
      interested_party_indicators = "no":
      * если договор ПРЯМО исключает крупность / заинтересованность
        («не является крупной сделкой», «не является сделкой
        с заинтересованностью») — quote ОБЯЗАТЕЛЬНА и должна содержать
        эту фразу;
      * если просто нет признаков (договор молчит) — location = null.
    - Для approval_body, approval_timing — quote с фразой о решении /
      протоколе.
    - Не выдумывай location или quote. Если дословную фразу
      определить нельзя — location = null.
    </location_instructions>

    <instructions>
    Шаг 0 — НАЛИЧИЕ РАЗДЕЛА / ПОЛОЖЕНИЙ ПО ТЕМЕ

    Заполни "corporate_approvals_status".

    Значения:
    - "present" — если хотя бы одно содержательное поле указывает на наличие информации по теме:
      * major_transaction_indicators = "yes";
      * interested_party_indicators = "yes";
      * corporate_approvals_mentioned = "yes";
      * ЛИБО любое поле = "no" / "not_required" / "not_applicable", но с заполненным location с прямой цитатой (см. RF3).
    - "missing" — если все содержательные поля = "no" / "not_required" / "not_applicable" БЕЗ цитат, ЛИБО фрагментов по теме нет вообще.
    - "unclear" — если все содержательные = "unclear" при наличии фрагментов, но невозможности вывода.

    Шаг 1 — ПРИЗНАКИ КРУПНОЙ СДЕЛКИ

    Заполни "major_transaction_indicators".

    Значения:
    - "yes" — есть прямые признаки по ст. 46 14-ФЗ /
      ст. 78–79 208-ФЗ.
    - "no" — прямых признаков нет.
    - "unclear" — данных недостаточно.

    Шаг 2 — ПРИЗНАКИ ЗАИНТЕРЕСОВАННОЙ СДЕЛКИ

    Заполни "interested_party_indicators".

    Значения:
    - "yes" — есть прямые признаки по ст. 45 14-ФЗ /
      ст. 81–84 208-ФЗ.
    - "no" — прямых признаков нет.
    - "unclear" — данных недостаточно.

    Шаг 3 — USER-FACING КВАЛИФИКАЦИЯ СДЕЛКИ

    Заполни "transaction_qualification".

    Правила:
    - Если оба "no":
      "Признаков крупной / заинтересованной сделки не выявлено"
    - Если major = "yes", interested = "no":
      "Признаки крупной сделки"
    - Если major = "no", interested = "yes":
      "Признаки заинтересованной сделки"
    - Если оба "yes":
      "Признаки крупной и заинтересованной сделки"
    - Если нельзя определить:
      "Не удалось определить"

    Шаг 4 — НАЛИЧИЕ КОРПОРАТИВНЫХ ОДОБРЕНИЙ

    Заполни "corporate_approvals_mentioned".

    Значения:
    - "yes" — решения / одобрения СД / ОСА упоминаются.
    - "no" — не упоминаются при наличии признаков
      крупной / заинтересованной сделки.
    - "not_required" — признаков необходимости одобрения не выявлено.
    - "unclear" — нельзя определить.

    Шаг 5 — ОРГАН ОДОБРЕНИЯ

    Заполни "approval_body".

    Значения: board / shareholders / both / not_applicable / unclear.

    Шаг 6 — МОМЕНТ ОДОБРЕНИЯ

    Заполни "approval_timing".

    Значения: pre_signing / post_factum / not_applicable / unclear.

    Шаг 7 — USER-FACING СТАТУС ОДОБРЕНИЯ

    Заполни "approval_status_summary".

    Правила:
    - corporate_approvals_mentioned = "not_required":
      "Одобрение не требуется"
    - = "yes" и approval_timing = "pre_signing":
      "Одобрение получено (до подписания)"
    - = "yes" и approval_timing = "post_factum":
      "Одобрение получено (после подписания)"
    - = "yes" и approval_timing = "unclear":
      "Одобрение упоминается (момент не определён)"
    - = "no":
      "Одобрение не упоминается"
    - = "unclear":
      "Не удалось определить"

    Шаг 8 — НОРМАЛИЗОВАННЫЙ DISPLAY ДЛЯ DD GRID

    Заполни "approvals_display".

    Строй его ТОЛЬКО на основе уже заполненных полей выше.

    Правила:
    - Если corporate_approvals_status = "missing":
      "Положения о корпоративных одобрениях в договоре отсутствуют"
    - Если major = "no" и interested = "no":
      "Признаков крупной / заинтересованной сделки не выявлено"
    - Иначе:
      * начни с transaction_qualification
      * затем добавь approval_status_summary
    - Не более 3 коротких фактов через ";".

    Шаг 9 — ОБОСНОВАНИЕ

    Заполни "reason": первое предложение — вывод, второе — цитата
    (до 100 символов). Пиши по-русски.
    </instructions>

    <edge_cases>
    - "Настоящий договор является крупной сделкой":
      * corporate_approvals_status = "present"
      * major_transaction_indicators = "yes"

    - Упоминание аффилированных лиц / RPT:
      * corporate_approvals_status = "present"
      * interested_party_indicators = "yes"

    - Протокол СД от ... одобрил сделку:
      * corporate_approvals_status = "present"
      * corporate_approvals_mentioned = "yes"
      * approval_body = "board"
      * approval_timing = "pre_signing"

    - Признаки крупной сделки, одобрение не упоминается:
      * corporate_approvals_status = "present"
      * corporate_approvals_mentioned = "no"

    - Договор прямо исключает крупность / заинтересованность:
      * corporate_approvals_status = "present"
      * major_transaction_indicators = "no"
      * interested_party_indicators = "no"
      * location с прямой цитатой об исключении.

    - Нет релевантных фрагментов / раздел по теме отсутствует:
      * corporate_approvals_status = "missing"
      * major_transaction_indicators = "no"
      * interested_party_indicators = "no"
      * corporate_approvals_mentioned = "not_required"
      * approval_body = "not_applicable"
      * approval_timing = "not_applicable"
      * transaction_qualification =
        "Признаков крупной / заинтересованной сделки не выявлено"
      * approval_status_summary = "Одобрение не требуется"
      * approvals_display =
        "Положения о корпоративных одобрениях в договоре отсутствуют"
      * location у всех полей = null.

    - Формулировки есть, но вывод невозможен:
      * corporate_approvals_status = "unclear"
      * соответствующие поля = "unclear"
    </edge_cases>

    <output_expectations>
    - Верни результат строго в формате JSON.
    - Не оборачивай в markdown-блоки (без ```).
    - Не добавляй комментариев вне JSON.
    - Все значения полей с allowed_values — на английском.
    - Свободные текстовые поля — на русском.
    - Не добавляй полей, кроме указанных.
    - Для каждого поля возвращай объект с ключами
      "value", "confidence", "location".

    Пример структуры ответа:
    {
      "approvals_display": {"value": "Крупная сделка; одобрение СД получено до подписания", "confidence": 0.95, "location": null},
      "transaction_qualification": {"value": "Признаки крупной сделки", "confidence": 0.95, "location": null},
      "approval_status_summary": {"value": "Одобрение получено (до подписания)", "confidence": 0.90, "location": null},
      "corporate_approvals_status": {"value": "present", "confidence": 0.95, "location": {"clause_ref": "п. 12.1", "page": 7, "quote": "Настоящий договор является крупной сделкой"}},
      "major_transaction_indicators": {"value": "yes", "confidence": 0.95, "location": {"clause_ref": "п. 12.1", "page": 7, "quote": "Настоящий договор является крупной сделкой"}},
      "interested_party_indicators": {"value": "no", "confidence": 0.85, "location": null},
      "corporate_approvals_mentioned": {"value": "yes", "confidence": 0.90, "location": {"clause_ref": "п. 12.2", "page": 7, "quote": "Сделка одобрена решением Совета директоров от 15.08.2024"}},
      "approval_body": {"value": "board", "confidence": 0.95, "location": {"clause_ref": "п. 12.2", "page": 7, "quote": "Сделка одобрена решением Совета директоров"}},
      "approval_timing": {"value": "pre_signing", "confidence": 0.85, "location": {"clause_ref": "п. 12.2", "page": 7, "quote": "Сделка одобрена решением Совета директоров от 15.08.2024"}},
      "reason": {"value": "...", "confidence": 0.90, "location": null}
    }
    </output_expectations>

  fields:
    - name: "approvals_display"
      type: "string"
      presentation: "fact"
      label: "Корпоративные одобрения"
      description: "Нормализованный user-facing вывод для DD Grid"
      display_in_grid: true
      display_priority: 1

    - name: "transaction_qualification"
      type: "string"
      presentation: "fact"
      label: "Квалификация сделки"
      description: "Краткая квалификация по признакам крупной / заинтересованной"
      display_in_grid: true
      display_priority: 2

    - name: "approval_status_summary"
      type: "string"
      presentation: "fact"
      label: "Статус одобрения"
      description: "Краткий статус корпоративного одобрения"
      display_in_grid: true
      display_priority: 3

    - name: "corporate_approvals_status"
      type: "string"
      presentation: "signal"
      risk_weight: "info"
      description: "Наличие регулирования по теме корпоративных одобрений и квалификации сделки"
      display_in_grid: false
      allowed_values:
        - "present"
        - "missing"
        - "unclear"

    - name: "major_transaction_indicators"
      type: "string"
      presentation: "signal"
      risk_weight: "high"
      description: "Признаки крупной сделки"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
      display_in_grid: false

    - name: "interested_party_indicators"
      type: "string"
      presentation: "signal"
      risk_weight: "high"
      description: "Признаки заинтересованной сделки"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
      display_in_grid: false

    - name: "corporate_approvals_mentioned"
      type: "string"
      presentation: "signal"
      risk_weight: "high"
      description: "Упоминание корпоративных одобрений"
      allowed_values:
        - "yes"
        - "no"
        - "not_required"
        - "unclear"
      display_in_grid: false

    - name: "approval_body"
      type: "string"
      presentation: "signal"
      risk_weight: "low"
      description: "Орган, давший одобрение"
      allowed_values:
        - "board"
        - "shareholders"
        - "both"
        - "not_applicable"
        - "unclear"
      display_in_grid: false

    - name: "approval_timing"
      type: "string"
      presentation: "signal"
