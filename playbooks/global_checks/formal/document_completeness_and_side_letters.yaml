id: "document_completeness_and_side_letters"
name: "Полнота документации и side letters"
group: "Document completeness"
description: >
  Анализирует полноту пакета документов по сделке в контексте
  M&A due diligence: наличие всех приложений, допсоглашений,
  протоколов разногласий, side letters, disclosure schedules.

  Извлекает: признаки отсутствующих документов, риск side letters
  и скрытых договорённостей, наличие entire agreement clause,
  качество disclosure schedules, наличие amendments и их
  консолидацию, соответствие реестрам.

  Формирует краткий user-facing вывод и оценивает риск скрытых
  условий и неполноты информации.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"
ui_mode: "field_extraction"

rules:
  keyword_mode: any

  keywords:
    high:
      # Приложения и schedules с конкретной ссылкой
      - "(?i)\\bschedule\\s+[A-Z0-9]"
      - "(?i)\\bexhibit\\s+[A-Z0-9]"
      - "(?i)\\bappendix\\s+[A-Z0-9]"
      - "(?i)\\bannex\\s+[A-Z0-9]"
      - "(?i)Приложение\\s+[№#]?\\s*\\d+"
      - "(?i)Приложение\\s+[А-Яа-я]"
      - "(?i)as\\s+set\\s+(out|forth)\\s+in\\s+(Schedule|Exhibit|Appendix)"
      - "(?i)согласно\\s+Приложени[юя]"

      # Side letters
      - "(?i)side\\s+letter"
      - "(?i)сайд[-\\s]?леттер"
      - "(?i)отдельное\\s+соглашение[\\s\\S]{0,30}(сторонами|заключен)"
      - "(?i)separate\\s+agreement[\\s\\S]{0,30}(parties|entered|executed)"
      - "(?i)сторонами\\s+также\\s+заключено"
      - "(?i)parties\\s+have\\s+also\\s+(entered|executed)"
      - "(?i)supplemental\\s+agreement"
      - "(?i)дополнительное\\s+письмо"

      # Disclosure schedules
      - "(?i)disclosure\\s+schedule"
      - "(?i)disclosure\\s+letter"
      - "(?i)disclosed\\s+in\\s+(the\\s+)?Schedule"
      - "(?i)раскрыт[оы]\\s+в\\s+Приложении"

      # Допсоглашения / amendments
      - "(?i)дополнительное\\s+соглашение\\s+(№|#|\\d)"
      - "(?i)amendment\\s+(№|#|No\\.?\\s*\\d)"
      - "(?i)изменени[ея]\\s+к\\s+договору\\s+(№|#|\\d)"
      - "(?i)протокол\\s+разногласий"
      - "(?i)protocol\\s+of\\s+disagreements?"

    medium:
      # Entire agreement
      - "(?i)entire\\s+agreement"
      - "(?i)whole\\s+agreement"
      - "(?i)полное\\s+соглашение"
      - "(?i)настоящий\\s+договор[\\s\\S]{0,30}представляет\\s+собой\\s+полн"
      - "(?i)supersedes?\\s+(all\\s+)?prior\\s+(agreements?|understandings?)"
      - "(?i)заменяет\\s+все\\s+предшествующие\\s+договорённости"

      # Реестры
      - "(?i)contract\\s+register"
      - "(?i)реестр\\s+договоров"
      - "(?i)litigation\\s+register"
      - "(?i)реестр\\s+(судебных\\s+)?споров"
      - "(?i)data\\s+room\\s+index"
      - "(?i)document\\s+list"
      - "(?i)перечень\\s+документов"

      # Ссылки на приложения
      - "(?i)attached\\s+hereto"
      - "(?i)прилага(ется|ются)\\s+к\\s+настоящему"
      - "(?i)incorporated\\s+(herein\\s+)?by\\s+reference"
      - "(?i)является\\s+неотъемлемой\\s+частью"

      # Версионность
      - "(?i)consolidated\\s+version"
      - "(?i)консолидированн[а-я]+\\s+версия"
      - "(?i)amended\\s+and\\s+restated"
      - "(?i)в\\s+редакции[\\s\\S]{0,20}(допсоглашени|изменени|amendment)"

    low:
      - "(?i)side\\s+letter"
      - "(?i)disclosure\\s+schedule"
      - "(?i)entire\\s+agreement"
      - "(?i)contract\\s+register"
      - "(?i)протокол\\s+разногласий"
      - "(?i)amended\\s+and\\s+restated"
      - "(?i)consolidated\\s+version"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 6
  temperature: 0.0
  max_tokens: 750

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 700

retrieval:
  context_k: 6
  max_chunks: 12

  retrieval_query: >
    приложения schedule exhibit annex side letter отдельное соглашение 
    дополнительное соглашение amendment протокол разногласий disclosure schedule 
    entire agreement исчерпывающий характер договора реестр договоров

  boost_keywords:
    - "schedule"
    - "exhibit"
    - "appendix"
    - "Приложение"
    - "as set out in Schedule"
    - "side letter"
    - "отдельное соглашение"
    - "дополнительное соглашение"
    - "amendment"
    - "протокол разногласий"
    - "disclosure schedule"
    - "disclosure letter"
    - "entire agreement"
    - "полное соглашение"
    - "supersedes prior agreements"
    - "contract register"
    - "реестр договоров"
    - "litigation register"
    - "реестр споров"
    - "consolidated version"
    - "amended and restated"
    - "сторонами также заключено"
    - "parties have also entered"

  negative_keywords:
    - "условия оплаты"
    - "валюта платежа"
    - "финансовые ковенанты"
    - "take-or-pay"
    - "штрафные санкции"

  preferred_unit_types:
    - "general_provision"
    - "appendix_reference"

  excluded_unit_types:
    - "structural_anchor"
    - "technical_fragment"

  preferred_clause_functions:
    - "boilerplate"

  position_bias:
    preferred_range: [0.70, 1.00]
    boost: 0.20
    scope: "segment"

  rerank: true
  filters: {}

conditional: null

enrichment_hints:
  preferred_segment_types:
    - "contract"
    - "amendment"
    - "annex"
    - "appendix"
  excluded_segment_types:
    - "technical_specification"
    - "price_list"
    - "invoice"
    - "act"
  confidence_bonus_on_match: 0.08
  confidence_penalty_on_excluded_segment: 0.15

extraction:
  enabled: true
  mode: "hybrid"
  llm_max_tokens: 1150

  llm_prompt_extraction: |
    <role>
    Ты — юрист по M&A due diligence.
    Твоя задача — точно извлечь из текста:
    1) признаки отсутствующих документов в пакете;
    2) наличие side letters и скрытых договорённостей;
    3) наличие entire agreement clause;
    4) качество disclosure schedules;
    5) наличие amendments и их консолидацию;
    6) соответствие реестрам.

    Не придумывай данные, которых нет в тексте.
    </role>

    <context>
    Ниже приведены релевантные фрагменты договора:

    {context}
    </context>

    <task>
    Заполни только следующие поля:
    - document_completeness_display
    - has_suspected_missing_documents
    - missing_documents_list
    - side_letters_risk
    - has_entire_agreement_clause
    - disclosure_schedules_assessment
    - has_amendments
    - consolidation_status
    - registers_gap_risk
    - reason

    Важно:
    - пиши коротко и по-русски.
    </task>

    <instructions>
    Шаг 1 — ОТСУТСТВУЮЩИЕ ДОКУМЕНТЫ

    Заполни "has_suspected_missing_documents".

    Значения:
    - "yes" — обоснованное подозрение:
      ссылки "as set out in Schedule X" без текста Schedule X;
      пропуски в нумерации приложений;
      упоминание side letter без его текста;
      ссылки на amendments без содержания.
    - "no" — все упомянутые документы присутствуют.
    - "unclear" — невозможно определить.

    Шаг 2 — СПИСОК ПРЕДПОЛОЖИТЕЛЬНО ОТСУТСТВУЮЩИХ ДОКУМЕНТОВ

    Заполни "missing_documents_list".

    Правила:
    - Если "yes": перечисли через ";":
      "Schedule A; Amendment #2; Disclosure Schedule"
    - Если "no": "Не применимо"
    - Если unclear: "Не удалось определить"

    Шаг 3 — РИСК SIDE LETTERS

    Заполни "side_letters_risk".

    Значения:
    - "high" — side letter упоминается, но не предоставлен.
    - "medium" — косвенные признаки скрытых договорённостей.
    - "low" — нет признаков side letters.
    - "unclear" — невозможно определить.

    Шаг 4 — ENTIRE AGREEMENT CLAUSE

    Заполни "has_entire_agreement_clause".

    Значения:
    - "yes" — договор = полная договорённость,
      замещает предшествующие соглашения.
    - "no" — нет.
    - "unclear" — неясно.

    Шаг 5 — DISCLOSURE SCHEDULES

    Заполни "disclosure_schedules_assessment".

    Значения:
    - "adequate" — детализированные, содержательные.
    - "weak" — формальные, blanket statements.
    - "empty" — пустые или "Nothing to disclose".
    - "not_present" — не упоминаются.
    - "unclear" — невозможно оценить.

    Шаг 6 — AMENDMENTS И ВЕРСИОННОСТЬ

    Заполни "has_amendments" и "consolidation_status".

    Значения для has_amendments:
    - "yes" / "no" / "unclear"

    Значения для consolidation_status:
    - "consolidated" — есть консолидированная / restated версия.
    - "not_consolidated" — amendments без консолидации.
    - "not_applicable" — amendments нет.
    - "unclear" — неясно.

    Шаг 7 — СООТВЕТСТВИЕ РЕЕСТРАМ

    Заполни "registers_gap_risk".

    Значения:
    - "high" — очевидный разрыв между реестрами и пакетом.
    - "medium" — отдельные несоответствия.
    - "low" — реестры соответствуют пакету или не упоминаются.
    - "unclear" — невозможно определить.

    Шаг 8 — НОРМАЛИЗОВАННЫЙ DISPLAY ДЛЯ DD GRID

    Заполни "document_completeness_display".

    Это не свободное summary.
    Строй display по следующей логике:

    Базовые случаи:
    - все поля unclear:
      "Не удалось оценить полноту документации"
    - нет признаков проблем:
      "Пакет выглядит полным"

    Если есть конкретные данные — комбинируй через ";":
    - начни с наиболее критичного факта
    - has_suspected_missing_documents = "yes":
      "Отсутствует {missing_documents_list}"
    - side_letters_risk = "high":
      "упоминается side letter без текста"
    - disclosure_schedules_assessment = "empty":
      "disclosure schedules пустые"
    - consolidation_status = "not_consolidated":
      "amendments без консолидации"

    Примеры:
    - "Пакет выглядит полным; entire agreement есть; amendments консолидированы"
    - "Отсутствует Schedule A; упоминается side letter; disclosure schedules формальные"
    - "Amendments без консолидации"
    - "Не удалось оценить полноту документации"

    Ограничение: не более 3 фактов через ";".

    Шаг 9 — КРАТКОЕ ОБОСНОВАНИЕ

    Заполни "reason".

    Правила:
    - 1–2 коротких предложения.
    - Укажи: отсутствующие документы, признаки side letters,
      disclosure schedules, amendments, реестры.
    - Приведи цитату в кавычках.
    </instructions>

    <edge_cases>
    - "As set out in Schedule X", текста нет:
      * has_suspected_missing_documents = "yes"
      * missing_documents_list = "Schedule X"

    - "Сторонами также заключено отдельное соглашение":
      * side_letters_risk = "high"

    - Нет ссылок на приложения и schedules:
      * has_suspected_missing_documents = "no"
      * side_letters_risk = "low"

    - "Nothing to disclose":
      * disclosure_schedules_assessment = "empty"

    - Amendment #1, #2, #3 без consolidated version:
      * has_amendments = "yes"
      * consolidation_status = "not_consolidated"

    - Нет релевантных фрагментов:
      * все поля = "unclear"
      * document_completeness_display =
        "Не удалось оценить полноту документации"
    </edge_cases>

    <output_expectations>
    Все значения коротко и по-русски.
    Не добавляй никаких полей, кроме указанных в схеме extraction.
    </output_expectations>

  fields:
    - name: "document_completeness_display"
      type: "string"
      presentation: "fact"
      label: "Полнота документации"
      description: "Нормализованный user-facing вывод для DD Grid"

    - name: "has_suspected_missing_documents"
      type: "string"
      presentation: "signal"
      description: "Подозрение на отсутствующие документы"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "missing_documents_list"
      type: "string"
      presentation: "fact"
      label: "Отсутствующие документы"
      description: "Перечень предположительно отсутствующих документов"

    - name: "side_letters_risk"
      type: "string"
      presentation: "signal"
      description: "Риск side letters / скрытых договорённостей"
      allowed_values:
        - "high"
        - "medium"
        - "low"
        - "unclear"

    - name: "has_entire_agreement_clause"
      type: "string"
      presentation: "signal"
      description: "Entire agreement clause"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "disclosure_schedules_assessment"
      type: "string"
      presentation: "signal"
      description: "Качество disclosure schedules"
      allowed_values:
        - "adequate"
        - "weak"
        - "empty"
        - "not_present"
        - "unclear"

    - name: "has_amendments"
      type: "string"
      presentation: "signal"
      description: "Наличие amendments / допсоглашений"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "consolidation_status"
      type: "string"
      presentation: "signal"
      description: "Статус консолидации amendments"
      allowed_values:
        - "consolidated"
        - "not_consolidated"
        - "not_applicable"
        - "unclear"

    - name: "registers_gap_risk"
      type: "string"
      presentation: "signal"
      description: "Риск расхождения с реестрами"
      allowed_values:
        - "high"
        - "medium"
        - "low"
        - "unclear"

    - name: "reason"
      type: "string"
      presentation: "diagnostic"
      description: "Обоснование"

  store_payload: true

  