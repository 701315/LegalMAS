id: "document_completeness_and_side_letters"
name: "Полнота документации и side letters"
group: "Document completeness"
description: >
  Анализирует полноту документального пакета по договору:
  наличие приложений, допсоглашений, протоколов разногласий,
  side letters, disclosure schedules, consolidated / restated
  версий и признаки расхождения с реестрами или перечнями.

  Извлекает: признаки отсутствующих документов, риск side letters
  и скрытых договорённостей, наличие entire agreement clause,
  качество disclosure schedules, наличие amendments и их
  консолидацию, соответствие реестрам.

  Формирует краткий user-facing вывод и оценивает риск скрытых
  условий и неполноты информации.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"
ui_mode: "field_extraction"

rules:
  keyword_mode: any

  keywords:
    high:
      - "(?i)\\bschedule\\s+[A-Z0-9]"
      - "(?i)\\bexhibit\\s+[A-Z0-9]"
      - "(?i)\\bappendix\\s+[A-Z0-9]"
      - "(?i)\\bannex\\s+[A-Z0-9]"
      - "(?i)Приложение\\s+[№#]?\\s*\\d+"
      - "(?i)Приложение\\s+[А-Яа-я]"
      - "(?i)as\\s+set\\s+(out|forth)\\s+in\\s+(Schedule|Exhibit|Appendix)"
      - "(?i)согласно\\s+Приложени[юя]"
      - "(?i)side\\s+letter"
      - "(?i)сайд[-\\s]?леттер"
      - "(?i)отдельное\\s+соглашение[\\s\\S]{0,30}(сторонами|заключен)"
      - "(?i)separate\\s+agreement[\\s\\S]{0,30}(parties|entered|executed)"
      - "(?i)сторонами\\s+также\\s+заключено"
      - "(?i)parties\\s+have\\s+also\\s+(entered|executed)"
      - "(?i)supplemental\\s+agreement"
      - "(?i)дополнительное\\s+письмо"
      - "(?i)disclosure\\s+schedule"
      - "(?i)disclosure\\s+letter"
      - "(?i)disclosed\\s+in\\s+(the\\s+)?Schedule"
      - "(?i)раскрыт[оы]\\s+в\\s+Приложении"
      - "(?i)дополнительное\\s+соглашение\\s+(№|#|\\d)"
      - "(?i)amendment\\s+(№|#|No\\.?\\s*\\d)"
      - "(?i)изменени[ея]\\s+к\\s+договору\\s+(№|#|\\d)"
      - "(?i)протокол\\s+разногласий"
      - "(?i)protocol\\s+of\\s+disagreements?"

    medium:
      - "(?i)entire\\s+agreement"
      - "(?i)whole\\s+agreement"
      - "(?i)полное\\s+соглашение"
      - "(?i)настоящий\\s+договор[\\s\\S]{0,30}представляет\\s+собой\\s+полн"
      - "(?i)supersedes?\\s+(all\\s+)?prior\\s+(agreements?|understandings?)"
      - "(?i)заменяет\\s+все\\s+предшествующие\\s+договорённости"
      - "(?i)contract\\s+register"
      - "(?i)реестр\\s+договоров"
      - "(?i)litigation\\s+register"
      - "(?i)реестр\\s+(судебных\\s+)?споров"
      - "(?i)data\\s+room\\s+index"
      - "(?i)document\\s+list"
      - "(?i)перечень\\s+документов"
      - "(?i)attached\\s+hereto"
      - "(?i)прилага(ется|ются)\\s+к\\s+настоящему"
      - "(?i)incorporated\\s+(herein\\s+)?by\\s+reference"
      - "(?i)является\\s+неотъемлемой\\s+частью"
      - "(?i)consolidated\\s+version"
      - "(?i)консолидированн[а-я]+\\s+версия"
      - "(?i)amended\\s+and\\s+restated"
      - "(?i)в\\s+редакции[\\s\\S]{0,20}(допсоглашени|изменени|amendment)"

    low:
      - "(?i)side\\s+letter"
      - "(?i)disclosure\\s+schedule"
      - "(?i)entire\\s+agreement"
      - "(?i)contract\\s+register"
      - "(?i)протокол\\s+разногласий"
      - "(?i)amended\\s+and\\s+restated"
      - "(?i)consolidated\\s+version"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 6
  temperature: 0.0
  max_tokens: 750

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 700

retrieval:
  retrieval_profile: "definitions_check"
  context_k: 6
  max_chunks: 12

  retrieval_query: >
    приложения schedule exhibit annex side letter отдельное соглашение
    дополнительное соглашение amendment протокол разногласий disclosure schedule
    entire agreement исчерпывающий характер договора реестр договоров
    consolidated version amended and restated

  boost_keywords:
    - "schedule"
    - "exhibit"
    - "appendix"
    - "Приложение"
    - "as set out in Schedule"
    - "side letter"
    - "отдельное соглашение"
    - "дополнительное соглашение"
    - "amendment"
    - "протокол разногласий"
    - "disclosure schedule"
    - "disclosure letter"
    - "entire agreement"
    - "полное соглашение"
    - "supersedes prior agreements"
    - "contract register"
    - "реестр договоров"
    - "litigation register"
    - "реестр споров"
    - "consolidated version"
    - "amended and restated"
    - "сторонами также заключено"
    - "parties have also entered"

  negative_keywords:
    - "условия оплаты"
    - "валюта платежа"
    - "финансовые ковенанты"
    - "take-or-pay"
    - "штрафные санкции"

  preferred_unit_types:
    - "general_provision"
    - "appendix_reference"

  excluded_unit_types:
    - "structural_anchor"
    - "technical_fragment"

  preferred_clause_functions:
    - "boilerplate"

  position_bias:
    preferred_range: [0.70, 1.00]
    boost: 0.20
    scope: "segment"

  rerank: true
  filters: {}

conditional: null

enrichment_hints:
  preferred_segment_types:
    - "contract"
    - "amendment"
    - "annex"
    - "appendix"
  excluded_segment_types:
    - "technical_specification"
    - "price_list"
    - "invoice"
    - "act"
  confidence_bonus_on_match: 0.08
  confidence_penalty_on_excluded_segment: 0.15

extraction:
  enabled: true
  mode: "hybrid"
  llm_max_tokens: 1350

  presence_signal:
    field: "document_completeness_status"
    present_values: ["present"]
    missing_values: ["missing"]
    unclear_values: ["unclear"]

  llm_prompt_extraction: |
    <role>
    Ты — юрист по договорной документации и проверке полноты пакета.
    Твоя задача — точно извлечь из текста:
    1) есть ли в договоре раздел / положения о полноте пакета
       (приложения, side letters, disclosure schedules, amendments,
       entire agreement, реестры);
    2) если есть — какие условия / сигналы установлены:
       - признаки отсутствующих документов;
       - риск side letters и скрытых договорённостей;
       - наличие entire agreement clause;
       - качество disclosure schedules;
       - наличие amendments и их консолидацию;
       - риск расхождений с реестрами.

    КРИТИЧЕСКИ ВАЖНО:
    - Извлекай ТОЛЬКО то, что прямо написано в тексте.
    - НЕ придумывай отсутствующие документы, если в тексте нет
      явной или разумно обоснованной ссылки на них.
    - НЕ делай вывод о полноте всего data room по одному фрагменту.
    - Если раздел / положения по теме в договоре отсутствуют —
      document_completeness_status = "missing".
    - Если тексты по теме есть, но вывод сделать нельзя —
      document_completeness_status = "unclear".
    </role>

    <context_rules>
    - Некоторые фрагменты могут быть нерелевантны — игнорируй их.
    - Если есть противоречия между фрагментами — используй "unclear"
      и кратко опиши это в reason.
    - Подозрение на отсутствующий документ допустимо только если
      текст прямо ссылается на него или есть явный разрыв
      в нумерации / версии.
    - Если текст не позволяет надёжно оценить disclosure schedules,
      реестры или консолидацию — используй "unclear".
    - Не используй внешние предположения о том, какие документы
      "должны были бы" существовать.
    - Если ни один фрагмент не содержит информации по теме полноты
      пакета (нет ссылок на приложения / side letters / disclosure
      schedules / amendments / entire agreement / реестры) —
      document_completeness_status = "missing", location = null.
      Не использовать "unclear" при полном отсутствии релевантных
      фрагментов.
    </context_rules>

    <context>
    Ниже приведены релевантные фрагменты договора:

    {context}
    </context>

    <task>
    Заполни только следующие поля:
    - document_completeness_display
    - document_completeness_status
    - has_suspected_missing_documents
    - missing_documents_list
    - side_letters_risk
    - has_entire_agreement_clause
    - disclosure_schedules_assessment
    - has_amendments
    - consolidation_status
    - registers_gap_risk
    - reason
    </task>

    <location_instructions>
    Для каждого поля по возможности укажи location в формате:
    {"clause_ref": "п. 12.1", "page": 7, "quote": "дословная фраза из договора"}

    Правила:
    - clause_ref — короткая ссылка на пункт / раздел / статью именно в том
      виде, как она написана в договоре;
    - page — целое число страницы;
    - quote — дословная фраза из текста договора (НЕ пересказ, НЕ парафраз).
      Копируй её посимвольно, сохраняя формулировку и порядок слов.
      Оптимальная длина: 30–300 символов.
    - Для synthesized-полей (document_completeness_display,
      missing_documents_list, reason) location ВСЕГДА null.
    - Для document_completeness_status = "missing" — location = null.
    - Для document_completeness_status = "present" / "unclear" — quote
      с наиболее релевантной фразой договора.
    - Для has_* = "no" — различай два случая:
      * если договор ПРЯМО исключает наличие («Иных приложений к настоящему
        Договору не имеется», «Стороны не заключали side letter») — quote
        ОБЯЗАТЕЛЬНА и должна содержать эту фразу;
      * если просто отсутствует упоминание (договор молчит) —
        location = null.
    - Для side_letters_risk, disclosure_schedules_assessment,
      consolidation_status, registers_gap_risk — quote с фразой,
      на которой основана оценка.
    - Не выдумывай location или quote. Если дословную фразу определить
      нельзя — location = null.
    </location_instructions>

    <instructions>
    Шаг 0 — НАЛИЧИЕ РАЗДЕЛА / ПОЛОЖЕНИЙ О ПОЛНОТЕ ПАКЕТА

    Заполни "document_completeness_status".

    Значения:
    - "present" — если хотя бы одно содержательное поле сигнализирует
      о наличии информации по теме:
      * has_suspected_missing_documents = "yes";
      * side_letters_risk ∈ {"high", "medium"};
      * has_entire_agreement_clause = "yes";
      * disclosure_schedules_assessment ∈ {"adequate", "weak", "empty"};
      * has_amendments = "yes";
      * consolidation_status ∈ {"consolidated", "not_consolidated"};
      * registers_gap_risk ∈ {"high", "medium"};
      * ЛИБО любое поле = "no" / "low" / "not_present" / "not_applicable",
        но с заполненным location с прямой цитатой об исключении.
    - "missing" — если все содержательные поля =
      "no" / "low" / "not_present" / "not_applicable" БЕЗ цитаты,
      либо фрагментов по теме нет вообще.
    - "unclear" — если все содержательные = "unclear".

    Шаг 1 — ОТСУТСТВУЮЩИЕ ДОКУМЕНТЫ

    Заполни "has_suspected_missing_documents".

    Значения:
    - "yes" — есть обоснованное подозрение: ссылка на Schedule / Exhibit /
      Appendix без текста; разрыв в amendments; упоминание side letter /
      отдельного соглашения без текста; ссылка на disclosure schedule
      без самого schedule.
    - "no" — явных признаков отсутствующих документов не выявлено.
    - "unclear" — нельзя надёжно определить.

    Шаг 2 — СПИСОК ПРЕДПОЛОЖИТЕЛЬНО ОТСУТСТВУЮЩИХ ДОКУМЕНТОВ

    Заполни "missing_documents_list".
    - Если "yes" — до 3 позиций через ";".
    - Если "no" — "Не выявлены".
    - Если "unclear" — "Не удалось определить".

    Шаг 3 — РИСК SIDE LETTERS

    Заполни "side_letters_risk": high / medium / low / unclear.

    Шаг 4 — ENTIRE AGREEMENT CLAUSE

    Заполни "has_entire_agreement_clause": yes / no / unclear.

    Шаг 5 — DISCLOSURE SCHEDULES

    Заполни "disclosure_schedules_assessment":
    adequate / weak / empty / not_present / unclear.

    Шаг 6 — AMENDMENTS И КОНСОЛИДАЦИЯ

    Заполни "has_amendments": yes / no / unclear.
    Заполни "consolidation_status":
    consolidated / not_consolidated / not_applicable / unclear.

    Шаг 7 — РИСК РАСХОЖДЕНИЯ С РЕЕСТРАМИ

    Заполни "registers_gap_risk": high / medium / low / unclear.

    Шаг 8 — НОРМАЛИЗОВАННЫЙ DISPLAY ДЛЯ DD GRID

    Заполни "document_completeness_display".
    Строй его ТОЛЬКО на основе уже заполненных полей выше.

    Правила:
    - Если document_completeness_status = "missing":
      "Положения о полноте пакета в договоре отсутствуют"
    - Если нет признаков missing documents, side_letters_risk = "low",
      disclosure_schedules_assessment в ["adequate", "not_present", "unclear"],
      consolidation_status в ["consolidated", "not_applicable", "unclear"],
      registers_gap_risk in ["low", "unclear"]:
      "Пакет выглядит полным"
    - Если has_suspected_missing_documents = "yes":
      добавь "Отсутствует {missing_documents_list}"
    - Если side_letters_risk = "high": добавь "side letter не представлен"
    - Если disclosure_schedules_assessment = "weak":
      добавь "disclosure schedules формальные"
    - Если disclosure_schedules_assessment = "empty":
      добавь "disclosure schedules пустые"
    - Если consolidation_status = "not_consolidated":
      добавь "amendments без консолидации"
    - Не более 3 коротких фактов через ";".

    Шаг 9 — ОБОСНОВАНИЕ

    Заполни "reason": первое предложение — вывод, второе — цитата
    (до 100 символов). Пиши по-русски.
    </instructions>

    <edge_cases>
    - "As set out in Schedule X", но текста Schedule X нет:
      * document_completeness_status = "present"
      * has_suspected_missing_documents = "yes"
      * missing_documents_list = "Schedule X"

    - "Сторонами также заключено отдельное соглашение":
      * document_completeness_status = "present"
      * side_letters_risk = "high"

    - Нет ссылок на приложения / schedules / отдельные соглашения:
      * document_completeness_status = "present"
      * has_suspected_missing_documents = "no"
      * side_letters_risk = "low"

    - "Nothing to disclose":
      * document_completeness_status = "present"
      * disclosure_schedules_assessment = "empty"

    - Amendment #1, #2, #3 без consolidated version:
      * document_completeness_status = "present"
      * has_amendments = "yes"
      * consolidation_status = "not_consolidated"

    - Договор прямо исключает наличие внешних документов
      («Иных приложений к настоящему Договору не имеется»):
      * document_completeness_status = "present"
      * has_suspected_missing_documents = "no"
      * side_letters_risk = "low"
      * location у has_suspected_missing_documents с прямой цитатой.

    - Нет релевантных фрагментов / раздел по теме отсутствует:
      * document_completeness_status = "missing"
      * has_suspected_missing_documents = "no"
      * missing_documents_list = "Не выявлены"
      * side_letters_risk = "low"
      * has_entire_agreement_clause = "no"
      * disclosure_schedules_assessment = "not_present"
      * has_amendments = "no"
      * consolidation_status = "not_applicable"
      * registers_gap_risk = "low"
      * document_completeness_display =
        "Положения о полноте пакета в договоре отсутствуют"
      * location у всех полей = null.

    - Формулировки есть, но вывод невозможен:
      * document_completeness_status = "unclear"
      * соответствующие поля = "unclear"
    </edge_cases>

    <output_expectations>
    - Верни результат строго в формате JSON.
    - Не оборачивай в markdown-блоки (без ```).
    - Не добавляй комментариев вне JSON.
    - Все значения полей с allowed_values — на английском.
    - Свободные текстовые поля (document_completeness_display,
      missing_documents_list, reason) — на русском языке.
    - Не добавляй полей, кроме указанных.
    - Для каждого поля возвращай объект с ключами
      "value", "confidence", "location".

    Пример структуры ответа:
    {
      "document_completeness_display": {"value": "Отсутствует Schedule A; side letter не представлен", "confidence": 0.92, "location": null},
      "document_completeness_status": {"value": "present", "confidence": 0.92, "location": {"clause_ref": "п. 5", "page": 3, "quote": "Сторонами также заключено отдельное соглашение"}},
      "has_suspected_missing_documents": {"value": "yes", "confidence": 0.85, "location": {"clause_ref": "п. 5", "page": 3, "quote": "As set out in Schedule X"}},
      "missing_documents_list": {"value": "Schedule X", "confidence": 0.85, "location": null},
      "side_letters_risk": {"value": "high", "confidence": 0.90, "location": {"clause_ref": "п. 5", "page": 3, "quote": "Сторонами также заключено отдельное соглашение"}},
      "has_entire_agreement_clause": {"value": "yes", "confidence": 0.95, "location": {"clause_ref": "п. 14.1", "page": 12, "quote": "Настоящий Договор представляет собой полное соглашение Сторон и заменяет все предшествующие договорённости"}},
      "disclosure_schedules_assessment": {"value": "not_present", "confidence": 0.80, "location": null},
      "has_amendments": {"value": "yes", "confidence": 0.90, "location": {"clause_ref": "п. 1", "page": 1, "quote": "в редакции Дополнительного соглашения № 2 от 15.03.2024"}},
      "consolidation_status": {"value": "not_consolidated", "confidence": 0.75, "location": null},
      "registers_gap_risk": {"value": "low", "confidence": 0.70, "location": null},
      "reason": {"value": "...", "confidence": 0.90, "location": null}
    }
    </output_expectations>

  fields:
    - name: "document_completeness_display"
      type: "string"
      presentation: "fact"
      label: "Полнота документации"
      description: "Нормализованный user-facing вывод для DD Grid"
      display_in_grid: true
      display_priority: 1

    - name: "document_completeness_status"
      type: "string"
      presentation: "signal"
      risk_weight: "info"
      description: "Наличие информации о полноте пакета в тексте договора"
      display_in_grid: false
      allowed_values:
        - "present"
        - "missing"
        - "unclear"

    - name: "has_suspected_missing_documents"
      type: "string"
      presentation: "signal"
      risk_weight: "high"
      description: "Подозрение на отсутствующие документы"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
      display_in_grid: false

    - name: "missing_documents_list"
      type: "string"
      presentation: "fact"
      label: "Отсутствующие документы"
      description: "Перечень предположительно отсутствующих документов"
      display_in_grid: true
      display_priority: 2

    - name: "side_letters_risk"
      type: "string"
      presentation: "signal"
      risk_weight: "high"
      description: "Риск side letters / скрытых договорённостей"
      allowed_values:
        - "high"
        - "medium"
        - "low"
        - "unclear"
      display_in_grid: false

    - name: "has_entire_agreement_clause"
      type: "string"
      presentation: "signal"
      risk_weight: "medium"
      description: "Entire agreement clause"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
      display_in_grid: false

    - name: "disclosure_schedules_assessment"
      type: "string"
      presentation: "signal"
      risk_weight: "medium"
      description: "Качество disclosure schedules"
      allowed_values:
        - "adequate"
        - "weak"
        - "empty"
        - "not_present"
        - "unclear"
      display_in_grid: false

    - name: "has_amendments"
      type: "string"
      presentation: "signal"
      risk_weight: "low"
      description: "Наличие amendments / допсоглашений"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
      display_in_grid: false

