id: "document_completeness_and_side_letters"
name: "Полнота документации и side letters"
description: >
  Анализирует полноту пакета по сделке: наличие всех приложений, допсоглашений,
  протоколов разногласий и side letters, а также соответствие предоставленного
  пакета внутренним реестрам (contract/litigation register).

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"

rules:
  keywords:
    - "Приложение"
    - "schedule"
    - "exhibit"
    - "appendix"
    - "application"
    - "side letter"
    - "сторонами также заключено"
    - "отдельное соглашение"
    - "supplemental agreement"
    - "дополнительное соглашение"
    - "protocol of disagreements"
    - "протокол разногласий"
    - "disclosure schedule"
    - "раскрытие"
    - "contract register"
    - "реестр договоров"
    - "litigation register"
    - "реестр судебных споров"
  keyword_mode: "any"
  regex_patterns: []
  clause_patterns: []

llm:
  prompt_template: |
    <role>
    Ты — юрист по сделкам и due diligence.
    Твоя специализация — анализ полноты документации по сделке, side letters
    и соответствия пакета внутренним реестрам.
    </role>

    <context>
    Ниже приведены фрагменты основного договора и, возможно, ссылки на приложения,
    допсоглашения, side letters и внутренние реестры:

    {context}
    </context>

    <instructions>
    Проведи анализ по шагам. Каждый шаг логически соответствует одному или
    нескольким полям итоговой оценки риска.

    Шаг 1 — УПОМИНАЕМЫЕ ДОПОЛНИТЕЛЬНЫЕ ДОКУМЕНТЫ
    (используется для заполнения поля "referenced_ancillary_documents_summary"):
    - Определи, на какие приложения, допсоглашения, протоколы разногласий,
      side letters и disclosure schedules ссылается основной договор.
    - Сформулируй краткое текстовое резюме этих ссылок.

    Шаг 2 — ПОДОЗРЕНИЯ НА ОТСУТСТВУЮЩИЕ ДОКУМЕНТЫ / SCHEDULES
    (используется для заполнения поля "suspected_missing_documents_or_schedules"):
    - Оцени, есть ли признаки того, что часть таких документов отсутствует
      в предоставленном пакете (упоминания без текста, пропуски в нумерации,
      ссылки вида "as set out in Schedule X" без самого Schedule X в доступных
      материалах).
    - Сформируй вывод по сути: есть ли обоснованное подозрение на неполный
      пакет документов или нет, либо данных недостаточно.

    Шаг 3 — ПОЛНОТА DISCLOSURE SCHEDULES
    (используется для заполнения поля "disclosure_schedules_completeness_assessment"):
    - Определи, упоминаются ли disclosure schedules.
    - По содержанию фрагментов оцени, выглядят ли раскрытия:
      * достаточно детализированными и полными,
      * слабыми/формальными,
      * отсутствующими,
      * либо оценка невозможна по доступным данным.

    Шаг 4 — РАЗРЫВ МЕЖДУ РЕЕСТРАМИ И ФАКТИЧЕСКИМИ ДОКУМЕНТАМИ
    (используется для заполнения поля "registers_vs_actual_docs_gap_risk_level"):
    - Проверь, упоминаются ли внутренние реестры (contract register,
      litigation register и аналогичные).
    - Оцени, есть ли признаки расхождений между указанными в реестрах
      договорами/спорами и фактически представленным пакетом документов.

    Шаг 5 — ОБЩИЙ РИСК ДЛЯ TARGET
    (используется для формирования "overall_risk_level" и "reason"):
    - На основе выводов по шагам 1–4 оцени общий риск неполноты пакета
      и возможных скрытых условий (приложения, side letters, раскрытия,
      несоответствие реестрам).
    - В объяснении опирайся на конкретные формулировки из текста, а не
      на абстрактные фразы. Явно укажи, какие именно документы или
      ссылки вызывают риск.
    </instructions>

    <edge_cases>
    Обрабатывай пограничные ситуации так:

    - Если договор упоминает множество приложений/раскрытий, но в доступных
      фрагментах нет их текста:
      считай, что есть риск отсутствующих документов, а полноту раскрытий
      оценить сложно.

    - Если side letter упоминается фразами вроде
      «сторонами также заключено отдельное соглашение», но текста нет:
      учитывай это как существенный риск скрытых условий и фиксируй
      этот факт в своём анализе.

    - Если вообще нет ссылок ни на приложения, ни на schedules, ни на реестры:
      это само по себе не признак риска, но отметь, что дополнительных
      документов и реестров по тексту не видно.

    - Если фрагменты пустые или явно нерелевантные:
      большинство оценок будет "unclear", но в объяснении укажи, что
      данных недостаточно для уверенного вывода о полноте документации.
    </edge_cases>

    <output_expectations>
    На основе твоего анализа отдельный механизм извлечения сформирует
    структурированные поля по заранее заданной схеме. Твоя задача —
    давать чёткие юридические выводы и указывать конкретные формулировки
    из текста, на которых они основаны.
    </output_expectations>
  prompt_file: null
  context_k: 6
  temperature: 0.0
  max_tokens: 768

evidence:
  required: false
  min_snippet_length: 20
  max_snippet_length: 700

retrieval:
  context_k: 6
  max_chunks: 12
  boost_keywords:
    - "schedule"
    - "exhibit"
    - "side letter"
    - "Приложение"
    - "disclosure schedule"
    - "contract register"
    - "litigation register"
  rerank: true
  filters: {}

conditional: null

extraction:
  enabled: true
  mode: "hybrid"
  fields:
    - name: "referenced_ancillary_documents_summary"
      type: "string"

    - name: "suspected_missing_documents_or_schedules"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "disclosure_schedules_completeness_assessment"
      type: "string"
      allowed_values:
        - "adequate"
        - "weak"
        - "unclear"
        - "none"

    - name: "registers_vs_actual_docs_gap_risk_level"
      type: "string"
      allowed_values:
        - "low"
        - "medium"
        - "high"
        - "unclear"

    - name: "overall_risk_level"
      type: "string"
      allowed_values:
        - "low"
        - "medium"
        - "high"

    - name: "reason"
      type: "string"

  store_payload: true

red_flags:
  items:
    - code: "FORM3"
      description: "Отсутствие приложений/side letters, на которые прямо ссылается договор."
    - code: "FORM4"
      description: "Очевидный разрыв между реестрами договоров/споров и фактически представленными документами."
