id: "cybersecurity_policies_and_incidents"
name: "Кибербезопасность, ИБ и инциденты"
description: >
  Анализирует наличие и качество политик по ИБ/кибербезопасности,
  описание технических и организационных мер защиты, процедуры
  реагирования на инциденты и журналирование, обязательства
  по уведомлению об инцидентах, а также упоминания прошлых утечек
  данных и реакцию на них. Оценивает общий уровень киберриска
  для Target.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"

rules:
  keyword_mode: any

  keywords:
    high:
      # Политики ИБ — конкретные маркеры
      - "(?i)security\\s+policy"
      - "(?i)политик[аи]\\s+(информационн[а-я]+\\s+)?безопасност[ьи]"
      - "(?i)\\bISMS\\b"
      - "(?i)information\\s+security\\s+management\\s+system"
      - "(?i)систем[аы]\\s+управлени[яе]\\s+информационн[а-я]+\\s+безопасност"
      - "(?i)\\bISO\\s*27001\\b"
      - "(?i)\\bSOC\\s*2\\b"
      - "(?i)\\bPCI[-\\s]?DSS\\b"
      - "(?i)\\bNIST\\b"
      - "(?i)\\bCIS\\s+Controls\\b"

      # Инциденты и утечки — конкретные формулировки
      - "(?i)security\\s+incident"
      - "(?i)security\\s+breach"
      - "(?i)data\\s+breach"
      - "(?i)утечк[аи]\\s+данных"
      - "(?i)киберинцидент"
      - "(?i)cyber[-\\s]?incident"
      - "(?i)нарушени[ея]\\s+безопасност[ьи]\\s+данных"
      - "(?i)несанкционированн[а-я]+\\s+доступ"
      - "(?i)unauthorized\\s+access"
      - "(?i)compromise[d]?\\s+(of\\s+)?(data|system|security)"

      # Incident response
      - "(?i)incident\\s+response"
      - "(?i)реагировани[ея]\\s+на\\s+инцидент"
      - "(?i)incident\\s+management"
      - "(?i)управлени[ея]\\s+инцидентам[ьи]"
      - "(?i)incident\\s+log"
      - "(?i)журнал\\s+инцидентов"
      - "(?i)breach\\s+notification"
      - "(?i)уведомлени[ея]\\s+о[б]?\\s+(утечк|инцидент|нарушени)"

    medium:
      # Технические и организационные меры
      - "(?i)security\\s+measures?"
      - "(?i)мер[аы]\\s+(информационн[а-я]+\\s+)?безопасност[ьи]"
      - "(?i)техническ[а-я]+\\s+и\\s+организационн[а-я]+\\s+мер"
      - "(?i)technical\\s+and\\s+organizational\\s+measures?"
      - "(?i)encryption"
      - "(?i)шифровани[ея]"
      - "(?i)access\\s+control"
      - "(?i)контроль\\s+доступ[а]"
      - "(?i)authentication"
      - "(?i)аутентификаци[яи]"
      - "(?i)\\bMFA\\b"
      - "(?i)multi[-\\s]?factor\\s+authentication"
      - "(?i)двухфакторн[а-я]+\\s+аутентификаци"

      # Мониторинг и логирование
      - "(?i)\\bSIEM\\b"
      - "(?i)\\bDLP\\b"
      - "(?i)data\\s+loss\\s+prevention"
      - "(?i)логировани[ея]"
      - "(?i)logging"
      - "(?i)мониторинг"
      - "(?i)monitoring"
      - "(?i)audit\\s+trail"
      - "(?i)журнал\\s+аудит[а]"

      # Тестирование и резервирование
      - "(?i)penetration\\s+test(ing)?"
      - "(?i)тест(ировани[ея])?\\s+на\\s+(проникновени[ея]|уязвимост)"
      - "(?i)vulnerability\\s+(assessment|scan(ning)?)"
      - "(?i)backup"
      - "(?i)резервн[а-я]+\\s+копи"
      - "(?i)disaster\\s+recovery"
      - "(?i)восстановлени[ея]\\s+после\\s+(сбо[яе]в|катастроф)"
      - "(?i)\\bBCP\\b"
      - "(?i)business\\s+continuity"

      # Регуляторные ссылки
      - "(?i)\\bGDPR\\b"
      - "(?i)\\b152[-\\s]?ФЗ\\b"
      - "(?i)персональн[а-я]+\\s+данн[ыхе]"
      - "(?i)personal\\s+data"

    low:
      # Общие термины ИБ
      - "(?i)информационн[а-я]+\\s+безопасност[ьи]"
      - "(?i)\\bИБ\\b"
      - "(?i)cybersecurity"
      - "(?i)кибербезопасност[ьи]"
      - "(?i)information\\s+security"
      - "(?i)security"
      - "(?i)безопасност[ьи]"
      - "(?i)защит[аы]\\s+(информаци|данных)"
      - "(?i)data\\s+protection"
      - "(?i)конфиденциальност[ьи]"
      - "(?i)confidentiality"
      - "(?i)incident"
      - "(?i)инцидент"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 700

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  context_k: 5
  max_chunks: 10
  boost_keywords:
    - "security policy"
    - "политика информационной безопасности"
    - "ISMS"
    - "ISO 27001"
    - "SOC 2"
    - "PCI DSS"
    - "cybersecurity"
    - "кибербезопасность"
    - "information security"
    - "информационная безопасность"
    - "security incident"
    - "security breach"
    - "data breach"
    - "утечка данных"
    - "киберинцидент"
    - "incident response"
    - "реагирование на инциденты"
    - "incident management"
    - "incident log"
    - "журнал инцидентов"
    - "breach notification"
    - "уведомление об утечке"
    - "security measures"
    - "технические и организационные меры"
    - "encryption"
    - "шифрование"
    - "access control"
    - "контроль доступа"
    - "penetration testing"
    - "vulnerability assessment"
  rerank: true
  filters: {}

conditional: null

extraction:
  llm_prompt_extraction: |
    <role>
    Ты — юрист по информационной безопасности и кибербезопасности.
    Твоя специализация — анализ договорного оформления требований ИБ,
    политик безопасности, технических и организационных мер защиты,
    процедур реагирования на инциденты и обязательств по уведомлению
    об утечках данных.
    </role>

    <context>
    Ниже приведены фрагменты договора и/или политик компании,
    связанные с информационной безопасностью:

    {context}
    </context>

    <instructions>
    Проведи анализ по шагам. Каждый шаг логически соответствует одному
    или нескольким полям итоговой оценки риска.

    Шаг 1 — НАЛИЧИЕ ФОРМАЛИЗОВАННЫХ ПОЛИТИК ИБ
    (используется для заполнения поля "has_documented_security_policies"):
    - Определи, упоминаются ли формализованные документы по ИБ:
      * security policy, политика информационной безопасности;
      * ISMS (Information Security Management System);
      * внутренние регламенты, стандарты, программы по ИБ/кибербезопасности;
      * ссылки на сертификации (ISO 27001, SOC 2, PCI DSS, NIST и т.п.).
    - Оцени:
      * "yes" — есть упоминание утверждённых политик или сертификаций;
      * "no" — политики явно отсутствуют или не упоминаются;
      * "unclear" — формулировки общие, невозможно определить.

    Шаг 2 — ОПИСАНИЕ ТЕХНИЧЕСКИХ И ОРГАНИЗАЦИОННЫХ МЕР
    (используется для заполнения поля "describes_security_measures"):
    - Проверь, описаны ли конкретные меры защиты:
      * шифрование (encryption) — at rest, in transit;
      * контроль доступа (access control), аутентификация, MFA;
      * логирование, мониторинг, SIEM, DLP;
      * тестирование на уязвимости (penetration testing, vulnerability
        assessment);
      * резервное копирование (backup), disaster recovery;
      * сегментация сети, firewall, IDS/IPS.
    - Оцени:
      * "yes" — меры описаны конкретно;
      * "no" — мер нет или только декларативные заявления;
      * "unclear" — по фрагментам оценка невозможна.

    Шаг 3 — ПРОЦЕДУРЫ РЕАГИРОВАНИЯ НА ИНЦИДЕНТЫ
    (используется для заполнения поля "has_incident_response_procedures"):
    - Определи, есть ли в договоре или политике:
      * процессы выявления, регистрации и расследования инцидентов
        (incident response, incident management);
      * журналирование инцидентов (incident log);
      * правила эскалации и документирования;
      * сроки реагирования и восстановления.
    - Оцени:
      * "yes" — процедуры явно описаны;
      * "no" — процедуры отсутствуют;
      * "unclear" — формулировки неопределённые.

    Шаг 4 — ОБЯЗАТЕЛЬСТВА ПО УВЕДОМЛЕНИЮ ОБ ИНЦИДЕНТАХ
    (используется для заполнения поля "has_breach_notification_obligations"):
    - Определи, содержит ли договор обязательства по уведомлению:
      * клиента (Target) об инцидентах и утечках;
      * регуляторов (в соответствии с GDPR, 152-ФЗ и т.п.);
      * пострадавших субъектов данных.
    - Проверь:
      * установлены ли сроки уведомления (например, 72 часа по GDPR);
      * требуется ли описание характера инцидента и принятых мер.
    - Оцени:
      * "yes" — обязательства явно установлены;
      * "no" — обязательств нет;
      * "unclear" — формулировки неопределённые.

    Шаг 5 — УПОМИНАНИЯ ПРОШЛЫХ ИНЦИДЕНТОВ / УТЕЧЕК
    (используется для заполнения поля "mentions_past_incidents"):
    - Проверь, содержат ли фрагменты ссылки на прошлые:
      * security incidents, data breaches, утечки данных, киберинциденты;
      * описания последствий;
      * меры remediation и улучшения защиты после инцидентов.
    - Оцени:
      * "yes" — инциденты упоминаются;
      * "no" — не упоминаются;
      * "unclear" — неопределённо.

    Шаг 6 — RED FLAGS
    (используется для заполнения поля "red_flags"):
    Присвой один или несколько кодов из списка ниже.
    Если ни один код не применим — верни "NONE".
    Если данных недостаточно для оценки — верни "UNCLEAR".

    Коды:
    • CYB1 — Отсутствие формализованной политики ИБ при работе
      с чувствительными данными или большим массивом ПДн.
    • CYB2 — Упоминания прошлых инцидентов/утечек без описания
      мер remediation и предотвращения повторов.
    • CYB3 — Отсутствие процедур реагирования на инциденты
      (incident response) и журналирования.
    • CYB4 — Меры защиты описаны только декларативно
      («обеспечивает конфиденциальность», «принимает меры»)
      без конкретики.
    • CYB5 — Нет обязательства уведомлять клиента и/или регулятора
      об инцидентах и утечках.
    • CYB6 — Ссылка на устаревшие или неактуальные стандарты/
      сертификаты (например, ISO 27001 без указания года
      или с явно истекшим сроком).

    Формат ответа: коды через запятую без комментариев
    (например: "CYB1, CYB3").
    Вся аргументация — в поле reason.

    Шаг 7 — ОБОСНОВАНИЕ
    (используется для заполнения поля "reason"):

    - В reason кратко обоснуй вывод, опираясь на ключевые
      формулировки из текста (с цитатами в кавычках), и укажи:
      * какие политики и стандарты упоминаются;
      * какие меры защиты описаны (или не описаны);
      * есть ли процедуры реагирования и уведомления;
      * упоминаются ли прошлые инциденты и какова реакция;
      * если выставлены red_flags — обоснуй каждый код;
      * если red_flags = "NONE" — укажи, почему ИБ-риск
        контролируем.
    </instructions>

    <edge_cases>
    Обрабатывай пограничные ситуации так:

    - Только общие заявления («обеспечивает конфиденциальность»,
      «принимает меры защиты») без описания конкретных мер
      и политик:
      has_documented_security_policies = "unclear" или "no";
      describes_security_measures = "no";
      зафиксируй CYB4; в reason укажи, что декларативные
      формулировки не дают уверенности в реальном уровне защиты.

    - Меры защиты описаны (шифрование, контроль доступа),
      но нет ничего про реагирование на инциденты:
      has_incident_response_procedures = "no";
      зафиксируй CYB3; в reason укажи, что это значимый пробел
      в управлении киберрисками.

    - Упоминаются прошлые инциденты/утечки, но не описаны
      меры remediation:
      зафиксируй CYB2; в reason акцентируй, что отсутствие
      описания корректирующих мер повышает риск повторения.

    - Ссылка на ISO 27001 без указания года сертификации
      или с явно устаревшим сроком:
      зафиксируй CYB6; в reason укажи, что актуальность
      сертификации не подтверждена.

    - Нет обязательств уведомлять об инцидентах:
      зафиксируй CYB5; в reason укажи, что это противоречит
      требованиям GDPR (72 часа) и 152-ФЗ и создаёт риск
      несвоевременного реагирования.

    - Договор касается обработки ПДн, но политики ИБ
      не упоминаются:
      зафиксируй CYB1; в reason акцентируй несоответствие
      регуляторным ожиданиям.

    - Пустые или явно нерелевантные фрагменты:
      укажи, что данных недостаточно для оценки уровня
      кибербезопасности; red_flags = "UNCLEAR"; в reason
      объясни, что невозможность оценить ИБ-зрелость
      сама по себе создаёт неопределённость и риск.
    </edge_cases>

    <output_expectations>
    На основе твоего анализа отдельный механизм извлечения сформирует
    структурированные поля по заранее заданной схеме. Твоя задача —
    давать чёткие юридические выводы и указывать конкретные
    формулировки из текста, на которых они основаны.
    </output_expectations>

  enabled: true
  mode: "hybrid"
  fields:
    - name: "has_documented_security_policies"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "describes_security_measures"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "has_incident_response_procedures"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "has_breach_notification_obligations"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "mentions_past_incidents"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "red_flags"
      type: "string"

    - name: "reason"
      type: "string"

  store_payload: true

red_flags:
  items:
    - code: "CYB1"
      description: >
        Отсутствие формализованной политики ИБ/кибербезопасности
        при работе с чувствительными данными или большим массивом ПДн.
    - code: "CYB2"
      description: >
        Упоминания прошлых инцидентов/утечек без описания мер
        remediation и предотвращения повторов.
    - code: "CYB3"
      description: >
        Отсутствие процедур реагирования на инциденты
        (incident response) и журналирования.
    - code: "CYB4"
      description: >
        Меры защиты описаны только декларативно
        («обеспечивает конфиденциальность») без конкретики.
    - code: "CYB5"
      description: >
        Нет обязательства уведомлять клиента и/или регулятора
        об инцидентах и утечках данных.
    - code: "CYB6"
      description: >
        Ссылка на устаревшие или неактуальные стандарты/сертификаты
        (например, ISO 27001 без указания года или с истекшим сроком).