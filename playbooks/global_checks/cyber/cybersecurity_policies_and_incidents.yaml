id: "cybersecurity_policies_and_incidents"
name: "Кибербезопасность, ИБ и инциденты"
group: "Cybersecurity"
description: >
  Анализирует договорное оформление требований информационной
  безопасности: наличие формализованных политик ИБ и сертификаций
  (ISO 27001, SOC 2, PCI DSS), описание технических и организационных
  мер защиты, процедуры реагирования на инциденты и журналирование,
  обязательства по уведомлению об инцидентах и утечках данных,
  а также упоминания прошлых инцидентов.

  Формирует краткий user-facing вывод и оценивает общий уровень
  киберриска для Target.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"
ui_mode: "field_extraction"

rules:
  keyword_mode: any

  keywords:
    high:
      - "(?i)security\\s+policy"
      - "(?i)политик[аи]\\s+(информационн[а-я]+\\s+)?безопасност[ьи]"
      - "(?i)\\bISMS\\b"
      - "(?i)information\\s+security\\s+management\\s+system"
      - "(?i)систем[аы]\\s+управлени[яе]\\s+информационн[а-я]+\\s+безопасност"
      - "(?i)\\bISO\\s*27001\\b"
      - "(?i)\\bSOC\\s*2\\b"
      - "(?i)\\bPCI[-\\s]?DSS\\b"
      - "(?i)\\bNIST\\b"
      - "(?i)\\bCIS\\s+Controls\\b"
      - "(?i)security\\s+incident"
      - "(?i)security\\s+breach"
      - "(?i)data\\s+breach"
      - "(?i)утечк[аи]\\s+данных"
      - "(?i)киберинцидент"
      - "(?i)cyber[-\\s]?incident"
      - "(?i)нарушени[ея]\\s+безопасност[ьи]\\s+данных"
      - "(?i)несанкционированн[а-я]+\\s+доступ"
      - "(?i)unauthorized\\s+access"
      - "(?i)compromise[d]?\\s+(of\\s+)?(data|system|security)"
      - "(?i)incident\\s+response"
      - "(?i)реагировани[ея]\\s+на\\s+инцидент"
      - "(?i)incident\\s+management"
      - "(?i)управлени[ея]\\s+инцидентам[ьи]"
      - "(?i)incident\\s+log"
      - "(?i)журнал\\s+инцидентов"
      - "(?i)breach\\s+notification"
      - "(?i)уведомлени[ея]\\s+о[б]?\\s+(утечк|инцидент|нарушени)[аи]"

    medium:
      - "(?i)security\\s+measures?"
      - "(?i)мер[аы]\\s+(информационн[а-я]+\\s+)?безопасност[ьи]"
      - "(?i)техническ[а-я]+\\s+и\\s+организационн[а-я]+\\s+мер"
      - "(?i)technical\\s+and\\s+organizational\\s+measures?"
      - "(?i)encryption"
      - "(?i)шифровани[ея]"
      - "(?i)access\\s+control"
      - "(?i)контроль\\s+доступ[а]"
      - "(?i)authentication"
      - "(?i)аутентификаци[яи]"
      - "(?i)\\bMFA\\b"
      - "(?i)multi[-\\s]?factor\\s+authentication"
      - "(?i)двухфакторн[а-я]+\\s+аутентификаци"
      - "(?i)\\bSIEM\\b"
      - "(?i)\\bDLP\\b"
      - "(?i)data\\s+loss\\s+prevention"
      - "(?i)логировани[ея]\\s+(событий|доступ|действий)"
      - "(?i)audit\\s+trail"
      - "(?i)журнал\\s+аудит[а]"
      - "(?i)мониторинг\\s+(безопасност|инцидент|доступ)"
      - "(?i)penetration\\s+test(ing)?"
      - "(?i)тест(ировани[ея])?\\s+на\\s+(проникновени[ея]|уязвимост)"
      - "(?i)vulnerability\\s+(assessment|scan(ning)?)"
      - "(?i)backup\\s+(copies|data|systems?)"
      - "(?i)резервн[а-я]+\\s+копи[яиях]\\s+(данных|систем)"
      - "(?i)disaster\\s+recovery"
      - "(?i)восстановлени[ея]\\s+после\\s+(сбо[яе]в|катастроф)"
      - "(?i)\\bBCP\\b"
      - "(?i)business\\s+continuity"

    low:
      - "(?i)cybersecurity"
      - "(?i)кибербезопасност[ьи]"
      - "(?i)information\\s+security"
      - "(?i)информационн[а-я]+\\s+безопасност[ьи]"
      - "(?i)\\bИБ\\b"
      - "(?i)data\\s+protection"
      - "(?i)защит[аы]\\s+данных"
      - "(?i)security\\s+breach"
      - "(?i)data\\s+breach"
      - "(?i)incident\\s+response"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 700

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  retrieval_profile: "cybersecurity_check"
  context_k: 6
  max_chunks: 10

  retrieval_query: >
    информационная безопасность политика ИБ кибербезопасность
    ISO 27001 SOC 2 incident response реагирование на инциденты
    утечка данных breach notification уведомление об инциденте
    технические меры защиты шифрование контроль доступа

  boost_keywords:
    - "политика информационной безопасности"
    - "security policy"
    - "ISO 27001"
    - "SOC 2"
    - "PCI DSS"
    - "incident response"
    - "реагирование на инциденты"
    - "утечка данных"
    - "data breach"
    - "breach notification"
    - "уведомление об утечке"
    - "технические и организационные меры"
    - "technical and organizational measures"
    - "шифрование"
    - "encryption"
    - "контроль доступа"

  negative_keywords:
    - "персональные данные"
    - "personal data"
    - "конфиденциальная информация"
    - "коммерческая тайна"
    - "означает"
    - "в целях настоящего"
    - "споры"
    - "подсудность"
    - "применимое право"

  preferred_unit_types:
    - "obligation"
    - "general_provision"

  excluded_unit_types:
    - "definition"
    - "structural_anchor"
    - "technical_fragment"
    - "appendix_reference"

  preferred_clause_functions:
    - "obligations"
    - "procedures"
    - "representations"

  position_bias:
    preferred_range: [0.30, 1.00]
    boost: 0.20
    scope: "segment"

  rerank: true
  filters: {}

conditional: null

enrichment_hints:
  preferred_segment_types:
    - "contract"
    - "annex"
    - "appendix"
    - "amendment"
  excluded_segment_types:
    - "price_list"
    - "invoice"
    - "act"
  confidence_bonus_on_match: 0.10
  confidence_penalty_on_excluded_segment: 0.15

extraction:
  enabled: true
  mode: "hybrid"
  llm_max_tokens: 850

  llm_prompt_extraction: |
    <role>
    Ты — юрист по информационной безопасности.
    Твоя задача — точно извлечь из текста договора:
    1) наличие формализованных политик ИБ и сертификаций;
    2) наличие конкретных технических и организационных мер;
    3) наличие процедур реагирования на инциденты;
    4) наличие обязательств по уведомлению об инцидентах;
    5) упоминание прошлых инцидентов / утечек.

    КРИТИЧЕСКИ ВАЖНО:
    - Извлекай ТОЛЬКО то, что прямо написано в тексте.
    - НЕ считай декларативные фразы ("обеспечивает защиту",
      "принимает все необходимые меры") конкретными мерами.
    - НЕ додумывай сертификации, если они не упомянуты.
    - Если информация отсутствует — используй "no" или "unclear".
    </role>

    <context>
    Ниже приведены релевантные фрагменты договора:

    {context}
    </context>

    <context_rules>
    - Некоторые фрагменты могут быть нерелевантны — игнорируй их.
    - Если фрагменты противоречат друг другу — используй "unclear"
      и кратко объясни в reason.
    - Конкретные меры ИБ = шифрование, контроль доступа, MFA,
      логирование, SIEM, DLP, penetration testing, backup,
      disaster recovery — с явным упоминанием.
    - Декларативные меры = "обеспечивает конфиденциальность",
      "принимает разумные меры" без конкретики = "no".
    - Incident response procedures = явное описание процессов:
      выявление, регистрация, сроки, журналирование инцидентов.
    </context_rules>

    <task>
    Заполни только следующие поля:
    - cybersecurity_display
    - has_documented_security_policies
    - describes_security_measures
    - has_incident_response_procedures
    - has_breach_notification_obligations
    - mentions_past_incidents
    - reason
    </task>

    <instructions>
    Шаг 1 — ФОРМАЛИЗОВАННЫЕ ПОЛИТИКИ ИБ И СЕРТИФИКАЦИИ

    Заполни "has_documented_security_policies".

    Значения:
    - "yes" — упоминаются утверждённые политики ИБ или
      конкретные сертификации: security policy, ISMS,
      ISO 27001, SOC 2, PCI DSS, NIST, CIS Controls.
    - "no" — не упоминаются.
    - "unclear" — формулировки слишком общие.

    Шаг 2 — ТЕХНИЧЕСКИЕ И ОРГАНИЗАЦИОННЫЕ МЕРЫ

    Заполни "describes_security_measures".

    Значения:
    - "yes" — описаны конкретные меры: шифрование,
      контроль доступа, аутентификация / MFA, логирование,
      SIEM, DLP, penetration testing, backup, disaster recovery.
    - "no" — меры отсутствуют или только декларативные
      ("принимает все необходимые меры" без конкретики).
    - "unclear" — нельзя определить.

    Шаг 3 — ПРОЦЕДУРЫ РЕАГИРОВАНИЯ НА ИНЦИДЕНТЫ

    Заполни "has_incident_response_procedures".

    Значения:
    - "yes" — явно описаны: процессы выявления, регистрации,
      расследования; журнал инцидентов; сроки реагирования.
    - "no" — процедуры отсутствуют.
    - "unclear" — нельзя определить.

    Шаг 4 — ОБЯЗАТЕЛЬСТВА ПО УВЕДОМЛЕНИЮ ОБ ИНЦИДЕНТАХ

    Заполни "has_breach_notification_obligations".

    Значения:
    - "yes" — явно установлены обязательства уведомить:
      клиента, регулятора, субъектов данных.
    - "no" — обязательств нет.
    - "unclear" — нельзя определить.

    Шаг 5 — УПОМИНАНИЯ ПРОШЛЫХ ИНЦИДЕНТОВ

    Заполни "mentions_past_incidents".

    Значения:
    - "yes" — упоминаются прошлые инциденты / утечки / компрометация.
    - "no" — не упоминаются.
    - "unclear" — нельзя определить.

    Шаг 6 — НОРМАЛИЗОВАННЫЙ DISPLAY ДЛЯ DD GRID

    Заполни "cybersecurity_display".

    Это итоговое поле для таблицы.
    Строй его ТОЛЬКО на основе уже заполненных полей выше.
    Не добавляй информацию сверх них.

    Возможные состояния:
    1. Полноценный ИБ-контур:
       "Политики ИБ задокументированы (ISO 27001); меры описаны;
        уведомление предусмотрено"
    2. Частичный контур:
       "Меры ИБ только декларативные; нет incident response"
    3. ИБ не урегулирована:
       "Требования ИБ не установлены"
    4. Не удалось определить:
       "Не удалось определить уровень ИБ"

    Правила:
    - Если все поля "unclear":
      "Не удалось определить уровень ИБ"
    - Если has_documented_security_policies = "no"
      и describes_security_measures = "no"
      и has_breach_notification_obligations = "no":
      "Требования ИБ не установлены"
    - Иначе комбинируй через ";":
      * если has_documented_security_policies = "yes":
        "Политики ИБ задокументированы"
      * если describes_security_measures = "yes":
        "меры защиты описаны"
      * если describes_security_measures = "no":
        "меры защиты не описаны"
      * если has_breach_notification_obligations = "yes":
        "уведомление об инцидентах предусмотрено"
      * если has_breach_notification_obligations = "no"
        и has_documented_security_policies = "yes":
        "уведомление не предусмотрено"
      * если mentions_past_incidents = "yes":
        добавь "упоминаются прошлые инциденты"
    - Не более 3 коротких фактов через ";".

    Шаг 7 — КРАТКОЕ ОБОСНОВАНИЕ

    Заполни "reason".

    Правила:
    - Первое предложение — краткий вывод.
    - Второе — конкретные сертификации / меры /
      отсутствие меры + цитата (до 100 символов).
    - Пиши по-русски.
    </instructions>

    <edge_cases>
    - Только декларативные заявления:
      * describes_security_measures = "no"
      * has_incident_response_procedures = "no"

    - ISO 27001 упоминается, меры описаны:
      * has_documented_security_policies = "yes"
      * describes_security_measures = "yes"

    - Прошлые инциденты упомянуты без remediation:
      * mentions_past_incidents = "yes"

    - Нет обязательств по уведомлению:
      * has_breach_notification_obligations = "no"

    - Полное отсутствие ИБ-требований:
      * has_documented_security_policies = "no"
      * describes_security_measures = "no"
      * has_breach_notification_obligations = "no"
      * cybersecurity_display = "Требования ИБ не установлены"

    - Нет релевантных фрагментов:
      * все поля = "unclear"
      * cybersecurity_display = "Не удалось определить уровень ИБ"
    </edge_cases>

    <output_expectations>
    - Верни результат строго в формате JSON.
    - Не оборачивай ответ в markdown-блоки.
    - Не добавляй комментариев вне JSON.
    - Для полей с allowed_values используй строго значения из списка.
    - Свободные текстовые поля (cybersecurity_display, reason)
      заполняй на русском языке.
    - Не добавляй никаких полей, кроме указанных.

    Пример структуры ответа:
    {
      "cybersecurity_display": "Политики ИБ задокументированы (ISO 27001); меры защиты описаны; уведомление об инцидентах предусмотрено",
      "has_documented_security_policies": "yes",
      "describes_security_measures": "yes",
      "has_incident_response_procedures": "yes",
      "has_breach_notification_obligations": "yes",
      "mentions_past_incidents": "no",
      "reason": "..."
    }
    </output_expectations>

  fields:
    - name: "cybersecurity_display"
      type: "string"
      presentation: "fact"
      label: "Информационная безопасность"
      description: "Нормализованный user-facing вывод для DD Grid"
      display_in_grid: true
      display_priority: 1

    - name: "has_documented_security_policies"
      type: "string"
      presentation: "signal"
      description: "Формализованные политики ИБ / сертификации"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
      display_in_grid: false

    - name: "describes_security_measures"
      type: "string"
      presentation: "signal"
      description: "Конкретные технические и организационные меры"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
      display_in_grid: false

    - name: "has_incident_response_procedures"
      type: "string"
      presentation: "signal"
      description: "Процедуры реагирования на инциденты"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
      display_in_grid: false

    - name: "has_breach_notification_obligations"
      type: "string"
      presentation: "signal"
      description: "Обязательства по уведомлению об инцидентах"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
      display_in_grid: false

    - name: "mentions_past_incidents"
      type: "string"
      presentation: "signal"
      description: "Упоминания прошлых инцидентов / утечек"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
      display_in_grid: false

    - name: "reason"
      type: "string"
      presentation: "diagnostic"
      description: "Обоснование"
      display_in_grid: false

  store_payload: true


  
