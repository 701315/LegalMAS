id: "cybersecurity_policies_and_incidents"
name: "Кибербезопасность, ИБ и инциденты"
description: >
  Анализирует договорное оформление требований информационной
  безопасности: наличие формализованных политик ИБ и сертификаций
  (ISO 27001, SOC 2, PCI DSS), описание технических и организационных
  мер защиты, процедуры реагирования на инциденты и журналирование,
  обязательства по уведомлению об инцидентах и утечках данных,
  а также упоминания прошлых инцидентов.

  Формирует краткий user-facing вывод и оценивает общий уровень
  киберриска для Target.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"
ui_mode: "field_extraction"

rules:
  keyword_mode: any

  keywords:
    high:
      # Политики ИБ — конкретные маркеры
      - "(?i)security\\s+policy"
      - "(?i)политик[аи]\\s+(информационн[а-я]+\\s+)?безопасност[ьи]"
      - "(?i)\\bISMS\\b"
      - "(?i)information\\s+security\\s+management\\s+system"
      - "(?i)систем[аы]\\s+управлени[яе]\\s+информационн[а-я]+\\s+безопасност"
      - "(?i)\\bISO\\s*27001\\b"
      - "(?i)\\bSOC\\s*2\\b"
      - "(?i)\\bPCI[-\\s]?DSS\\b"
      - "(?i)\\bNIST\\b"
      - "(?i)\\bCIS\\s+Controls\\b"

      # Инциденты и утечки — конкретные формулировки
      - "(?i)security\\s+incident"
      - "(?i)security\\s+breach"
      - "(?i)data\\s+breach"
      - "(?i)утечк[аи]\\s+данных"
      - "(?i)киберинцидент"
      - "(?i)cyber[-\\s]?incident"
      - "(?i)нарушени[ея]\\s+безопасност[ьи]\\s+данных"
      - "(?i)несанкционированн[а-я]+\\s+доступ"
      - "(?i)unauthorized\\s+access"
      - "(?i)compromise[d]?\\s+(of\\s+)?(data|system|security)"

      # Incident response
      - "(?i)incident\\s+response"
      - "(?i)реагировани[ея]\\s+на\\s+инцидент"
      - "(?i)incident\\s+management"
      - "(?i)управлени[ея]\\s+инцидентам[ьи]"
      - "(?i)incident\\s+log"
      - "(?i)журнал\\s+инцидентов"
      - "(?i)breach\\s+notification"
      - "(?i)уведомлени[ея]\\s+о[б]?\\s+(утечк|инцидент|нарушени)[аи]"

    medium:
      # Технические и организационные меры
      - "(?i)security\\s+measures?"
      - "(?i)мер[аы]\\s+(информационн[а-я]+\\s+)?безопасност[ьи]"
      - "(?i)техническ[а-я]+\\s+и\\s+организационн[а-я]+\\s+мер"
      - "(?i)technical\\s+and\\s+organizational\\s+measures?"
      - "(?i)encryption"
      - "(?i)шифровани[ея]"
      - "(?i)access\\s+control"
      - "(?i)контроль\\s+доступ[а]"
      - "(?i)authentication"
      - "(?i)аутентификаци[яи]"
      - "(?i)\\bMFA\\b"
      - "(?i)multi[-\\s]?factor\\s+authentication"
      - "(?i)двухфакторн[а-я]+\\s+аутентификаци"

      # Мониторинг и логирование
      - "(?i)\\bSIEM\\b"
      - "(?i)\\bDLP\\b"
      - "(?i)data\\s+loss\\s+prevention"
      - "(?i)логировани[ея]\\s+(событий|доступ|действий)"
      - "(?i)audit\\s+trail"
      - "(?i)журнал\\s+аудит[а]"
      - "(?i)мониторинг\\s+(безопасност|инцидент|доступ)"

      # Тестирование и резервирование
      - "(?i)penetration\\s+test(ing)?"
      - "(?i)тест(ировани[ея])?\\s+на\\s+(проникновени[ея]|уязвимост)"
      - "(?i)vulnerability\\s+(assessment|scan(ning)?)"
      - "(?i)backup\\s+(copies|data|systems?)"
      - "(?i)резервн[а-я]+\\s+копи[яиях]\\s+(данных|систем)"
      - "(?i)disaster\\s+recovery"
      - "(?i)восстановлени[ея]\\s+после\\s+(сбо[яе]в|катастроф)"
      - "(?i)\\bBCP\\b"
      - "(?i)business\\s+continuity"

    low:
      - "(?i)cybersecurity"
      - "(?i)кибербезопасност[ьи]"
      - "(?i)information\\s+security"
      - "(?i)информационн[а-я]+\\s+безопасност[ьи]"
      - "(?i)\\bИБ\\b"
      - "(?i)data\\s+protection"
      - "(?i)защит[аы]\\s+данных"
      - "(?i)security\\s+breach"
      - "(?i)data\\s+breach"
      - "(?i)incident\\s+response"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 700

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  context_k: 5
  max_chunks: 10
  boost_keywords:
    - "security policy"
    - "политика информационной безопасности"
    - "ISMS"
    - "ISO 27001"
    - "SOC 2"
    - "PCI DSS"
    - "NIST"
    - "cybersecurity"
    - "кибербезопасность"
    - "information security"
    - "информационная безопасность"
    - "security incident"
    - "security breach"
    - "data breach"
    - "утечка данных"
    - "киберинцидент"
    - "incident response"
    - "реагирование на инциденты"
    - "incident management"
    - "incident log"
    - "журнал инцидентов"
    - "breach notification"
    - "уведомление об утечке"
    - "security measures"
    - "технические и организационные меры"
    - "encryption"
    - "шифрование"
    - "access control"
    - "контроль доступа"
    - "penetration testing"
    - "vulnerability assessment"
  rerank: true
  filters: {}

conditional: null

enrichment_hints:
  preferred_segment_types:
    - "contract"
    - "annex"
    - "appendix"
    - "amendment"
  excluded_segment_types:
    - "price_list"
    - "invoice"
    - "act"
  preferred_clause_functions:
    - "data_protection"
    - "confidentiality"
  confidence_bonus_on_match: 0.10
  confidence_penalty_on_excluded_segment: 0.15

extraction:
  enabled: true
  mode: "hybrid"
  llm_max_tokens: 480
  llm_prompt_extraction: |
    <role>
    Ты — юрист по информационной безопасности и кибербезопасности.
    Твоя задача — точно извлечь из текста договора:
    1) есть ли формализованные политики ИБ и сертификации;
    2) описаны ли конкретные меры защиты;
    3) есть ли процедуры реагирования на инциденты;
    4) есть ли обязательства по уведомлению об инцидентах;
    5) упоминаются ли прошлые инциденты / утечки.
    </role>

    <context>
    Ниже приведены релевантные фрагменты договора:

    {context}
    </context>

    <task>
    Заполни только следующие поля:
    - cybersecurity_display
    - has_documented_security_policies
    - describes_security_measures
    - has_incident_response_procedures
    - has_breach_notification_obligations
    - mentions_past_incidents
    - red_flags
    - reason

    Важно:
    - не анализируй тему шире текста;
    - не придумывай данные, которых нет в фрагментах;
    - пиши user-facing значения коротко и по-русски.
    </task>

    <instructions>
    Шаг 1 — НАЛИЧИЕ ФОРМАЛИЗОВАННЫХ ПОЛИТИК ИБ

    Заполни поле "has_documented_security_policies".

    Значения:
    - "yes" — упоминаются утверждённые политики ИБ или сертификации:
      security policy, политика информационной безопасности,
      ISMS, ISO 27001, SOC 2, PCI DSS, NIST, CIS Controls.
    - "no" — политики или сертификации явно не упоминаются.
    - "unclear" — формулировки общие, определить невозможно.

    Шаг 2 — ОПИСАНИЕ ТЕХНИЧЕСКИХ И ОРГАНИЗАЦИОННЫХ МЕР

    Заполни поле "describes_security_measures".

    Значения:
    - "yes" — описаны конкретные меры:
      * шифрование (encryption) at rest и/или in transit;
      * контроль доступа (access control), аутентификация, MFA;
      * логирование, мониторинг, SIEM, DLP;
      * penetration testing, vulnerability assessment;
      * backup, disaster recovery, BCP.
    - "no" — мер нет или только декларативные заявления
      ("обеспечивает конфиденциальность", "принимает меры")
      без конкретики.
    - "unclear" — оценка невозможна по фрагментам.

    Шаг 3 — ПРОЦЕДУРЫ РЕАГИРОВАНИЯ НА ИНЦИДЕНТЫ

    Заполни поле "has_incident_response_procedures".

    Значения:
    - "yes" — явно описаны:
      * процессы выявления, регистрации, расследования инцидентов;
      * журналирование (incident log);
      * сроки реагирования и восстановления.
    - "no" — процедуры отсутствуют.
    - "unclear" — формулировки неопределённые.

    Шаг 4 — ОБЯЗАТЕЛЬСТВА ПО УВЕДОМЛЕНИЮ ОБ ИНЦИДЕНТАХ

    Заполни поле "has_breach_notification_obligations".

    Значения:
    - "yes" — явно установлены обязательства уведомить:
      * клиента об инцидентах и утечках;
      * регуляторов (GDPR, 152-ФЗ и т.п.);
      * субъектов данных.
      Плюс/минус: указаны ли сроки (72 часа по GDPR).
    - "no" — обязательств нет.
    - "unclear" — формулировки неопределённые.

    Шаг 5 — УПОМИНАНИЯ ПРОШЛЫХ ИНЦИДЕНТОВ / УТЕЧЕК

    Заполни поле "mentions_past_incidents".

    Значения:
    - "yes" — есть ссылки на прошлые security incidents,
      data breaches, утечки данных, киберинциденты.
    - "no" — не упоминаются.
    - "unclear" — неопределённо.

    Шаг 6 — RED FLAGS

    Заполни поле "red_flags".

    Используй:
    - "NONE" — если существенных риск-факторов нет.
    - "UNCLEAR" — если данных недостаточно.
    - Коды через запятую:
      * CYB1 — отсутствие формализованной политики ИБ при работе
        с чувствительными данными или большим массивом ПДн.
      * CYB2 — упоминания прошлых инцидентов без описания мер
        remediation и предотвращения повторов.
      * CYB3 — отсутствие процедур реагирования на инциденты
        (incident response) и журналирования.
      * CYB4 — меры защиты описаны только декларативно
        без конкретики.
      * CYB5 — нет обязательства уведомлять клиента и/или
        регулятора об инцидентах и утечках.
      * CYB6 — ссылка на устаревшие или неактуальные стандарты /
        сертификаты без подтверждения актуальности.

    Шаг 7 — USER-FACING SUMMARY

    Заполни поле "cybersecurity_display".

    Строй display как краткий factual вывод:

    Примеры:
    - "Политики ИБ задокументированы (ISO 27001);
       меры защиты описаны; уведомление об инцидентах предусмотрено"
    - "Меры ИБ только декларативные; нет incident response;
       нет обязательства уведомлять"
    - "Политики ИБ отсутствуют; меры защиты не описаны"
    - "Не удалось определить уровень ИБ"

    Правила:
    - Отрази максимум 3 ключевых факта через точку с запятой.
    - Если все параметры unclear: "Не удалось определить уровень ИБ"
    - Приоритизируй наиболее критичные findings.

    Шаг 8 — ОБОСНОВАНИЕ

    Заполни поле "reason".

    Правила:
    - 1–2 коротких предложения.
    - Укажи: какие политики / сертификации упоминаются,
      какие меры описаны, есть ли incident response
      и уведомление об инцидентах, почему выставлены red_flags.
    - Приведи короткую цитату из текста в кавычках.
    - Если red_flags = "NONE" — укажи, почему ИБ-риск
      контролируем.
    </instructions>

    <edge_cases>
    - Только декларативные заявления без конкретных мер
      и политик:
      * has_documented_security_policies = "unclear" или "no"
      * describes_security_measures = "no"
      * red_flags включает "CYB4"

    - Меры описаны (шифрование, контроль доступа), но нет
      ничего про incident response:
      * has_incident_response_procedures = "no"
      * red_flags включает "CYB3"

    - Упоминаются прошлые инциденты без мер remediation:
      * mentions_past_incidents = "yes"
      * red_flags включает "CYB2"

    - Ссылка на ISO 27001 без года или с устаревшим сроком:
      * has_documented_security_policies = "yes"
      * red_flags включает "CYB6"

    - Нет обязательств уведомлять об инцидентах:
      * has_breach_notification_obligations = "no"
      * red_flags включает "CYB5"

    - Договор касается ПДн, но политики ИБ не упоминаются:
      * has_documented_security_policies = "no"
      * red_flags включает "CYB1"

    - Нет релевантных фрагментов:
      * все поля = "unclear"
      * red_flags = "UNCLEAR"
      * cybersecurity_display = "Не удалось определить уровень ИБ"

    - Всё в порядке:
      * red_flags = "NONE"
      * в reason объясни, почему ИБ-риск контролируем
    </edge_cases>

    <output_expectations>
    Все значения должны быть короткими, точными и пригодными
    для отображения пользователю в DD Grid.
    Не добавляй никаких полей, кроме указанных в схеме extraction.
    </output_expectations>

  fields:
    - name: "cybersecurity_display"
      type: "string"
      description: "Уровень ИБ: краткий вывод"

    - name: "has_documented_security_policies"
      type: "string"
      description: "Формализованные политики ИБ / сертификации"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "describes_security_measures"
      type: "string"
      description: "Конкретные меры защиты описаны"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "has_incident_response_procedures"
      type: "string"
      description: "Процедуры реагирования на инциденты"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "has_breach_notification_obligations"
      type: "string"
      description: "Обязательства по уведомлению об инцидентах"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "mentions_past_incidents"
      type: "string"
      description: "Упоминания прошлых инцидентов / утечек"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "red_flags"
      type: "string"
      description: "Коды киберрисков"

    - name: "reason"
      type: "string"
      description: "Обоснование"

  store_payload: true


  