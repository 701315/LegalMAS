id: "cybersecurity_policies_and_incidents"
name: "Кибербезопасность, ИБ и инциденты"
description: >
  Анализирует наличие политик по ИБ/кибербезопасности, журналов инцидентов,
  требований к защите, а также упоминания утечек данных и реакцию на них.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"

rules:
  keywords:
    - "информационная безопасность"
    - "ИБ"
    - "cybersecurity"
    - "information security"
    - "security policy"
    - "политика безопасности"
    - "security incident"
    - "security breach"
    - "data breach"
    - "утечка данных"
    - "киберинцидент"
    - "cyber incident"
    - "журнал инцидентов"
    - "incident log"
    - "security measures"
    - "технические и организационные меры"
  keyword_mode: "any"
  regex_patterns: []
  clause_patterns: []

llm:
  prompt_template: |
    <role>
    Ты — юрист по информационной безопасности и кибербезопасности.
    Твоя специализация — договорное оформление требований ИБ, планов реагирования
    и управления инцидентами.
    </role>

    <context>
    Ниже приведены фрагменты договора и/или политик компании:

    {context}
    </context>

    <instructions>
    Проведи анализ по шагам. Каждый шаг логически связан с одним или
    несколькими полями итоговой оценки.

    Шаг 1 — НАЛИЧИЕ ФОРМАЛИЗОВАННЫХ ПОЛИТИК ИБ/КИБЕРБЕЗОПАСНОСТИ
    (используется для заполнения поля "has_documented_security_policies"):
    - Определи, упоминаются ли формализованные документы:
      * security policy, политика информационной безопасности, ISMS и аналогичные;
      * внутренние регламенты, стандарты и программы по ИБ/кибербезопасности.
    - Оцени, можно ли по тексту сделать вывод о наличии утверждённых политики/политик,
      или формулировки остаются общими.

    Шаг 2 — ОПИСАНИЕ ТЕХНИЧЕСКИХ И ОРГАНИЗАЦИОННЫХ МЕР
    (используется для заполнения поля "describes_security_measures"):
    - Проверь, описаны ли конкретные меры защиты, например:
      * шифрование, управление доступом, аутентификация;
      * логирование, мониторинг, SIEM/DLP;
      * тестирование на уязвимости, резервное копирование, сегментация.
    - Сделай вывод: меры описаны конкретно, не описаны или по фрагментам
      оценка невозможна.

    Шаг 3 — ПРОЦЕДУРЫ РЕАГИРОВАНИЯ НА ИНЦИДЕНТЫ И ЖУРНАЛИРОВАНИЕ
    (используется для заполнения поля "has_incident_response_and_logging"):
    - Определи, есть ли в договоре или политике:
      * процессы выявления, регистрации и расследования инцидентов (incident log,
        incident management);
      * правила эскалации и документирования;
      * обязанности по уведомлению клиентов и/или регуляторов об инцидентах/утечках.
    - Оцени, присутствуют ли такие процедуры и насколько явно они сформулированы.

    Шаг 4 — УПОМИНАНИЯ ПРОШЛЫХ ИНЦИДЕНТОВ/УТЕЧЕК
    (используется для заполнения поля "mentions_past_security_or_data_breach_incidents"):
    - Проверь, содержат ли фрагменты ссылки на прошлые:
      * security incidents, data breaches, утечки данных, киберинциденты;
      * описания последствий и принятых мер remediation/улучшений.
    - Отрази, упоминаются ли такие события и насколько прозрачно описана реакция
      и последующая доработка защиты.

    Шаг 5 — УРОВЕНЬ КИБЕРРИСКА
    (используется для заполнения поля "cyber_risk_level"):
    - На основе шагов 1–4 оцени уровень киберриска как:
      * low — есть формализованные политики, понятные меры и процедуры реагирования;
      * medium — часть элементов есть, но есть пробелы (например, меры описаны,
        а процессы реагирования не урегулированы);
      * high — меры и процедуры практически не описаны или есть негативные сигналы
        (инциденты без понятного remediation);
      * unclear — по фрагментам нельзя надёжно оценить уровень киберриска.
    - Внутренне сопоставь степень формализованности, наличие процедур и упоминания
      инцидентов.

    Шаг 6 — ОБЩИЙ УРОВЕНЬ РИСКА ДЛЯ TARGET
    (используется для заполнения поля "overall_risk_level" и "reason"):
    - Оцени общий риск для Target с учётом:
      * уровня киберриска,
      * возможного влияния инцидентов на бизнес и клиентов,
      * регуляторных требований (особенно при работе с ПДн и чувствительными данными).
    - Сформулируй итоговый уровень риска как low / medium / high.
    - Обоснуй вывод, опираясь на конкретные формулировки (желательно с короткими
      цитатами в кавычках), явно поясняя, какие элементы снижают или повышают риск.
    </instructions>

    <edge_cases>
    Обрабатывай пограничные ситуации так:

    - Если указано только, что стороны обязуются обеспечивать конфиденциальность
      или "защиту информации" без описания мер и процедур:
      отражай неопределённость по наличию формализованных политик и процедур.

    - Если меры (шифрование, контроль доступа и т.п.) описаны, но нет ничего
      про реагирование на инциденты и журналирование:
      учитывай это как значимый пробел в управлении киберрисками и отмечай
      это в объяснении.

    - Если упоминаются прошлые утечки или инциденты, но не описано, какие меры
      были приняты для предотвращения повторов:
      обращай на это особое внимание и учитывай как фактор повышенного риска.

    - Пустые или явно нерелевантные фрагменты:
      укажи, что данных недостаточно для оценки уровня кибербезопасности и
      управления инцидентами, и поясни, как это влияет на неопределённость
      и риск для Target.
    </edge_cases>

    <output_expectations>
    На основе твоего анализа отдельный механизм извлечения сформирует
    структурированные поля по заранее заданной схеме. Твоя задача —
    давать чёткие юридические выводы и указывать конкретные формулировки
    из текста, на которых они основаны.
    </output_expectations>
  prompt_file: null
  context_k: 5
  temperature: 0.0
  max_tokens: 640

evidence:
  required: false
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  context_k: 5
  max_chunks: 10
  boost_keywords:
    - "cybersecurity"
    - "information security"
    - "утечка данных"
    - "security incident"
    - "security policy"
  rerank: true
  filters: {}

conditional: null

extraction:
  enabled: true
  mode: "hybrid"
  fields:
    - name: "has_documented_security_policies"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "describes_security_measures"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "has_incident_response_and_logging"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "mentions_past_security_or_data_breach_incidents"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "cyber_risk_level"
      type: "string"
      allowed_values:
        - "low"
        - "medium"
        - "high"
        - "unclear"

    - name: "overall_risk_level"
      type: "string"
      allowed_values:
        - "low"
        - "medium"
        - "high"

    - name: "reason"
      type: "string"

  store_payload: true

red_flags:
  items:
    - code: "CYB1"
      description: "Отсутствие формализированной политики ИБ/кибербезопасности при очевидно большом массиве данных."
    - code: "CYB2"
      description: "Упоминания инцидентов без должного описания мер по устранению и предотвращению повторов."
