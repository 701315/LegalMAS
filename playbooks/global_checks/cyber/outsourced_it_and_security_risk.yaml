id: "outsourced_it_and_security_risk"
name: "Внешние ИТ-провайдеры, обработчики и ИБ-риск"
description: >
  Анализирует договоры с облачными провайдерами, CRM/ERP, колл-центрами,
  HR-аутсорсом и другими обработчиками, с точки зрения защиты данных и
  риска отключения сервисов.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"

rules:
  keywords:
    - "облачный провайдер"
    - "cloud provider"
    - "SaaS"
    - "software as a service"
    - "CRM"
    - "ERP"
    - "колл-центр"
    - "call center"
    - "outsourcing"
    - "аутсорсинг"
    - "data processor"
    - "обработчик данных"
    - "service suspension"
    - "приостановление услуг"
    - "termination of service"
    - "security obligations"
    - "обязанности по безопасности"
    - "data processing"
    - "обработка данных"
  keyword_mode: "any"
  regex_patterns: []
  clause_patterns: []

llm:
  prompt_template: |
    <role>
    Ты — юрист по ИТ-аутсорсингу и безопасности.
    Твоя специализация — договоры с облачными провайдерами, SaaS и сторонними
    обработчиками данных.
    </role>

    <context>
    Ниже приведены фрагменты договора с ИТ-провайдером/обработчиком данных:

    {context}
    </context>

    <instructions>
    Проведи анализ по шагам. Каждый шаг логически связан с одним или
    несколькими полями итоговой оценки.

    Шаг 1 — КЛЮЧЕВЫЕ ИТ-СЕРВИСЫ НА АУТСОРСИНГЕ
    (используется для заполнения поля "outsourced_it_functions_summary"):
    - Определи, какие функции и сервисы переданы провайдеру:
      * облачный хостинг, CRM/ERP, колл-центр, HR, платёжная инфраструктура,
        система биллинга и т.п.
    - Кратко опиши эти функции в виде сжатого резюме, отдавая приоритет
      наиболее бизнес-критичным сервисам.

    Шаг 2 — ОБЯЗАТЕЛЬСТВА ПРОВАЙДЕРА ПО БЕЗОПАСНОСТИ
    (используется для заполнения поля "provider_security_obligations_present"):
    - Определи, содержит ли договор требования к провайдеру по ИБ и защите данных:
      * ссылки на стандарты (например, ISO 27001) или внутренние политики;
      * описание технических и организационных мер (шифрование, контроль доступа,
        резервное копирование, мониторинг и т.д.).
    - Сделай вывод, прописаны ли такие обязательства явно, отсутствуют или
      по фрагментам это неясно.

    Шаг 3 — УСЛОВИЯ ПРИОСТАНОВКИ/ПРЕКРАЩЕНИЯ СЕРВИСА
    (используется для заполнения поля "provider_can_suspend_or_terminate_service_easily"):
    - Проанализируй, в каких случаях провайдер вправе:
      * приостановить сервис,
      * ограничить доступ,
      * удалить или заблокировать данные клиента.
    - Оцени, можно ли считать, что провайдер может сделать это "легко":
      * при небольшой просрочке,
      * при споре,
      * по собственному усмотрению при размытых основаниях.
    - Сформулируй вывод: yes / no / unclear.

    Шаг 4 — ЭКСПОРТ ДАННЫХ И МЕХАНИЗМЫ ПЕРЕХОДА
    (используется для заполнения поля "has_clear_data_export_and_transition_mechanisms"):
    - Определи, предусмотрены ли:
      * право клиента на экспорт своих данных, формат и сроки экспорта;
      * помощь провайдера при миграции к другому поставщику;
      * период, в течение которого данные доступны после расторжения.
    - Оцени, есть ли понятный и реализуемый exit-механизм или он отсутствует/
      описан крайне общо.

    Шаг 5 — УРОВЕНЬ РИСКА ИТ-ЗАВИСИМОСТИ
    (используется для заполнения поля "it_dependency_risk_level"):
    - Сопоставь:
      * критичность отданных на аутсорсинг функций,
      * жёсткость условий приостановки/удаления данных,
      * наличие/отсутствие механизмов экспорта и перехода.
    - На основе этого оцени риск как:
      * low — зависимость управляемая, условия отключения мягкие, exit механизмы понятны;
      * medium — есть зависимость и отдельные риски, но существуют разумные
        ограничения на приостановку и понятный экспорт;
      * high — критичные функции завязаны на провайдера, условия отключения жёсткие,
        exit-механизмы слабые или отсутствуют;
      * unclear — по тексту нельзя надёжно оценить уровень риска.

    Шаг 6 — ОБЩИЙ УРОВЕНЬ РИСКА
    (используется для формирования "overall_risk_level" и "reason"):
    - Оцени общий риск для Target, учитывая:
      * ИБ-обязательства провайдера и их конкретность,
      * риск отключения сервисов и потери доступа к данным,
      * наличие выходных механизмов и возможностей миграции.
    - Сформулируй итоговый уровень риска как low / medium / high
      и обоснуй его ссылками на ключевые формулировки (желательно с короткими
      цитатами в кавычках) в поле "reason".
    </instructions>

    <edge_cases>
    Обрабатывай пограничные ситуации так:

    - Критически важные функции (например, CRM/ERP) полностью завязаны на провайдера,
      условия приостановки жёсткие (быстрая блокировка при небольшой просрочке,
      право приостановить при споре), при этом нет ясных механизмов экспорта
      и перехода:
      учитывай это как сценарий повышенного риска зависимости для Target.

    - Провайдер описывает только базовые меры безопасности без ссылок на стандарты,
      но при этом:
      * предусмотрен разумный экспорт данных,
      * условия приостановки ограничены серьёзными нарушениями и сопровождаются
        уведомлением,
      — оцени риск как умеренный, с акцентом на зависимость от практики провайдера.

    - Договор не описывает ни меры безопасности, ни правила приостановки,
      ни экспорт/переход:
      фиксируй высокую неопределённость и указывай, что ключевые элементы
      управления рисками отсутствуют в доступных фрагментах.

    - Пустые или явно нерелевантные фрагменты:
      опиши, что данных недостаточно для анализа аутсорсинга ИТ-функций
      и связанных рисков, и объясни, как это влияет на оценку риска для Target.
    </edge_cases>

    <output_expectations>
    На основе твоего анализа отдельный механизм извлечения сформирует
    структурированные поля по заранее заданной схеме. Твоя задача —
    давать чёткие юридические выводы и указывать конкретные формулировки
    из текста, на которых они основаны.
    </output_expectations>
  prompt_file: null
  context_k: 5
  temperature: 0.0
  max_tokens: 640

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  context_k: 5
  max_chunks: 10
  boost_keywords:
    - "cloud provider"
    - "SaaS"
    - "outsourcing"
    - "service suspension"
    - "обработчик данных"
    - "security obligations"
  rerank: true
  filters: {}

conditional: null

extraction:
  enabled: true
  mode: "hybrid"
  fields:
    - name: "outsourced_it_functions_summary"
      type: "string"

    - name: "provider_security_obligations_present"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "provider_can_suspend_or_terminate_service_easily"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "has_clear_data_export_and_transition_mechanisms"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "it_dependency_risk_level"
      type: "string"
      allowed_values:
        - "low"
        - "medium"
        - "high"
        - "unclear"

    - name: "overall_risk_level"
      type: "string"
      allowed_values:
        - "low"
        - "medium"
        - "high"

    - name: "reason"
      type: "string"

  store_payload: true

red_flags:
  items:
    - code: "CYB3"
      description: "Критические функции и данные у внешнего провайдера без чётких требований по ИБ."
    - code: "CYB4"
      description: "Провайдер может быстро отключить сервис/удалить данные при споре или небольшой просрочке."
