id: "outsourced_it_and_security_risk"
name: "Внешние ИТ-провайдеры, обработчики и ИБ-риск"
description: >
  Анализирует договоры с облачными провайдерами, SaaS, CRM/ERP,
  колл-центрами, HR-аутсорсом и другими ИТ-обработчиками с точки зрения:
  защиты данных и ИБ-обязательств провайдера, риска приостановки
  или прекращения сервисов, наличия механизмов экспорта данных
  и перехода к другому поставщику, а также общего уровня
  ИТ-зависимости (vendor lock-in) Target.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"

rules:
  keyword_mode: any

  keywords:
    high:
      # Облачные провайдеры и SaaS — конкретные маркеры
      - "(?i)cloud\\s+provider"
      - "(?i)облачн[а-я]+\\s+провайдер"
      - "(?i)\\bSaaS\\b"
      - "(?i)software\\s+as\\s+a\\s+service"
      - "(?i)\\bIaaS\\b"
      - "(?i)\\bPaaS\\b"
      - "(?i)infrastructure\\s+as\\s+a\\s+service"
      - "(?i)platform\\s+as\\s+a\\s+service"

      # CRM/ERP и критичные системы
      - "(?i)\\bCRM\\b"
      - "(?i)\\bERP\\b"
      - "(?i)customer\\s+relationship\\s+management"
      - "(?i)enterprise\\s+resource\\s+planning"
      - "(?i)биллинг[а-я]*\\s+(систем|платформ)"
      - "(?i)billing\\s+(system|platform)"
      - "(?i)payment\\s+(gateway|processor|infrastructure)"
      - "(?i)платёжн[а-я]+\\s+(шлюз|инфраструктур)"

      # Обработчик данных — конкретные формулировки
      - "(?i)data\\s+processor"
      - "(?i)обработчик\\s+(персональных\\s+)?данных"
      - "(?i)sub[-\\s]?processor"
      - "(?i)субобработчик"

      # Приостановка / прекращение сервиса
      - "(?i)service\\s+suspension"
      - "(?i)приостановлени[ея]\\s+(услуг|сервис)"
      - "(?i)suspend\\s+(the\\s+)?service"
      - "(?i)приостанов[ия]ть\\s+сервис"
      - "(?i)termination\\s+of\\s+service"
      - "(?i)прекращени[ея]\\s+(услуг|сервис)"
      - "(?i)discontinue\\s+(the\\s+)?service"
      - "(?i)right\\s+to\\s+(suspend|terminate|discontinue)"

      # Экспорт данных / переход
      - "(?i)data\\s+export"
      - "(?i)экспорт\\s+данных"
      - "(?i)data\\s+portability"
      - "(?i)переносимость\\s+данных"
      - "(?i)transition\\s+assistance"
      - "(?i)помощь\\s+при\\s+переход[еа]"
      - "(?i)exit\\s+(assistance|plan|strategy)"

    medium:
      # Аутсорсинг — общие маркеры
      - "(?i)outsourcing"
      - "(?i)аутсорсинг"
      - "(?i)outsourced\\s+(services?|functions?)"
      - "(?i)managed\\s+services?"
      - "(?i)колл[-\\s]?центр"
      - "(?i)call[-\\s]?center"
      - "(?i)contact\\s+center"
      - "(?i)HR[-\\s]?аутсорс"
      - "(?i)HR\\s+outsourcing"

      # ИБ-обязательства — общие
      - "(?i)security\\s+obligations?"
      - "(?i)обязанност[ьи]\\s+по\\s+безопасност[ьи]"
      - "(?i)information\\s+security"
      - "(?i)информационн[а-я]+\\s+безопасност[ьи]"
      - "(?i)data\\s+security"
      - "(?i)безопасност[ьи]\\s+данных"
      - "(?i)\\bISO\\s*27001\\b"
      - "(?i)\\bSOC\\s*2\\b"
      - "(?i)\\bGDPR\\b"
      - "(?i)\\b152[-\\s]?ФЗ\\b"

      # SLA
      - "(?i)\\bSLA\\b"
      - "(?i)service\\s+level\\s+agreement"
      - "(?i)соглашени[ея]\\s+об\\s+уровне\\s+(услуг|сервис)"
      - "(?i)uptime"
      - "(?i)availability"
      - "(?i)доступност[ьи]\\s+сервис"

      # Обработка данных — общие
      - "(?i)data\\s+processing"
      - "(?i)обработк[аи]\\s+данных"
      - "(?i)processing\\s+of\\s+(personal\\s+)?data"

      # Изменение условий
      - "(?i)unilateral\\s+(change|modification|amendment)"
      - "(?i)одностороннее\\s+изменени[ея]"
      - "(?i)right\\s+to\\s+(modify|amend|change)\\s+the\\s+(terms|agreement)"

    low:
      # Общие термины
      - "(?i)provider"
      - "(?i)провайдер"
      - "(?i)vendor"
      - "(?i)поставщик"
      - "(?i)service"
      - "(?i)услуг[аи]"
      - "(?i)сервис"
      - "(?i)hosting"
      - "(?i)хостинг"
      - "(?i)storage"
      - "(?i)хранени[ея]\\s+данных"
      - "(?i)backup"
      - "(?i)резервн[а-я]+\\s+копи"
      - "(?i)access"
      - "(?i)доступ"
      - "(?i)terminate"
      - "(?i)расторж"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 700

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  context_k: 5
  max_chunks: 10
  boost_keywords:
    - "cloud provider"
    - "облачный провайдер"
    - "SaaS"
    - "software as a service"
    - "CRM"
    - "ERP"
    - "outsourcing"
    - "аутсорсинг"
    - "data processor"
    - "обработчик данных"
    - "sub-processor"
    - "субобработчик"
    - "service suspension"
    - "приостановление услуг"
    - "termination of service"
    - "прекращение сервиса"
    - "data export"
    - "экспорт данных"
    - "data portability"
    - "переносимость данных"
    - "transition assistance"
    - "exit assistance"
    - "security obligations"
    - "обязанности по безопасности"
    - "ISO 27001"
    - "SOC 2"
    - "SLA"
    - "service level agreement"
    - "uptime"
    - "availability"
  rerank: true
  filters: {}

conditional: null

extraction:
  llm_prompt_extraction: |
    <role>
    Ты — юрист по ИТ-контрактам, аутсорсингу и информационной безопасности.
    Твоя специализация — анализ договоров с облачными провайдерами,
    SaaS-платформами, CRM/ERP-системами, колл-центрами, HR-аутсорсом
    и другими внешними обработчиками данных с точки зрения защиты данных,
    ИБ-обязательств провайдера, рисков приостановки сервисов и vendor lock-in.
    </role>

    <context>
    Ниже приведены фрагменты договора с ИТ-провайдером / обработчиком данных:

    {context}
    </context>

    <instructions>
    Проведи анализ по шагам. Каждый шаг логически соответствует одному
    или нескольким полям итоговой оценки риска.

    Шаг 1 — КЛЮЧЕВЫЕ ИТ-ФУНКЦИИ НА АУТСОРСИНГЕ
    (используется для заполнения поля "outsourced_it_functions_summary"):
    - Определи, какие функции и сервисы переданы провайдеру:
      * облачный хостинг, инфраструктура (IaaS/PaaS);
      * SaaS-приложения (CRM, ERP, биллинг, аналитика);
      * колл-центр, контакт-центр;
      * HR-аутсорсинг, расчёт зарплат;
      * платёжная инфраструктура, процессинг;
      * хранение и обработка данных.
    - Кратко опиши выявленные функции, отдавая приоритет наиболее
      бизнес-критичным.
    - Если из фрагментов неясно, какие именно функции переданы —
      укажи «Конкретные функции не определены».

    Шаг 2 — ИБ-ОБЯЗАТЕЛЬСТВА ПРОВАЙДЕРА
    (используется для заполнения поля "provider_security_obligations_present"):
    - Определи, содержит ли договор требования к провайдеру по ИБ
      и защите данных:
      * ссылки на стандарты (ISO 27001, SOC 2, PCI DSS и т.п.);
      * ссылки на законодательство (GDPR, 152-ФЗ);
      * описание конкретных технических и организационных мер:
        шифрование, контроль доступа, резервное копирование,
        мониторинг, аудит, уведомление о нарушениях.
    - Если обязательства явно прописаны — "yes".
    - Если обязательств нет или они отсутствуют в доступных
      фрагментах — "no".
    - Если формулировки общие и неконкретные — "unclear".
    - Кратко опиши выявленные обязательства в
      security_obligations_description.

    Шаг 3 — СУБПОДРЯДЧИКИ ПРОВАЙДЕРА
    (используется для заполнения поля "subprocessor_controls"):
    - Определи, вправе ли провайдер привлекать субподрядчиков
      (sub-processors) для обработки данных:
      * требуется ли согласие клиента;
      * распространяются ли на субподрядчиков ИБ-требования;
      * ведётся ли реестр субподрядчиков.
    - Если контроль субподрядчиков явно предусмотрен — "yes".
    - Если провайдер может привлекать субподрядчиков без
      ограничений — "no".
    - Если из текста неясно — "unclear".

    Шаг 4 — УСЛОВИЯ ПРИОСТАНОВКИ / ПРЕКРАЩЕНИЯ СЕРВИСА
    (используется для заполнения поля "provider_can_suspend_easily"):
    - Проанализируй, в каких случаях провайдер вправе:
      * приостановить сервис;
      * ограничить доступ;
      * удалить или заблокировать данные клиента.
    - Оцени, может ли провайдер сделать это «легко»:
      * при небольшой просрочке оплаты (например, < 30 дней);
      * при споре между сторонами;
      * по собственному усмотрению при размытых основаниях;
      * без предварительного уведомления или с коротким сроком
        уведомления (< 7 дней).
    - Если да — "yes".
    - Если условия приостановки ограничены серьёзными нарушениями
      и предусмотрено разумное уведомление — "no".
    - Если из текста неясно — "unclear".

    Шаг 5 — ЭКСПОРТ ДАННЫХ И МЕХАНИЗМЫ ПЕРЕХОДА
    (используется для заполнения поля "has_data_export_and_transition_mechanisms"):
    - Определи, предусмотрены ли:
      * право клиента на экспорт своих данных;
      * формат экспорта (машиночитаемый, стандартный);
      * сроки предоставления данных после запроса;
      * помощь провайдера при миграции к другому поставщику
        (transition assistance);
      * период, в течение которого данные доступны после
        расторжения (grace period).
    - Если механизмы чётко прописаны — "yes".
    - Если механизмов нет или они описаны крайне общо — "no".
    - Если из текста неясно — "unclear".

    Шаг 6 — SLA И ОТВЕТСТВЕННОСТЬ ЗА ПРОСТОЙ
    (используется для заполнения поля "sla_quality"):
    - Определи, содержит ли договор SLA с измеримыми показателями:
      * uptime / availability (например, 99.9%);
      * время реагирования на инциденты;
      * время восстановления (RTO);
      * ответственность провайдера за несоблюдение SLA
        (service credits, штрафы, право на расторжение).
    - Если SLA содержит конкретные метрики и ответственность — "strong".
    - Если SLA есть, но без ответственности или с размытыми
      метриками — "weak".
    - Если SLA отсутствует — "absent".
    - Если из текста неясно — "unclear".

    Шаг 7 — ОДНОСТОРОННЕЕ ИЗМЕНЕНИЕ УСЛОВИЙ
    (используется для заполнения поля "provider_can_change_terms_unilaterally"):
    - Определи, вправе ли провайдер в одностороннем порядке
      изменять условия договора, включая:
      * функциональность сервиса;
      * уровень ИБ и SLA;
      * ценообразование;
      * условия обработки данных.
    - Если провайдер может изменять условия без согласия клиента
      или с минимальным уведомлением — "yes".
    - Если изменения требуют согласия клиента или ограничены
      разумными рамками — "no".
    - Если из текста неясно — "unclear".

    Шаг 8 — RED FLAGS
    (используется для заполнения поля "red_flags"):
    Присвой один или несколько кодов из списка ниже.
    Если ни один код не применим — верни "NONE".
    Если данных недостаточно для оценки — верни "UNCLEAR".

    Коды:
    • ITOUT1 — Критические функции/данные у внешнего провайдера
      без чётких ИБ-требований: нет ссылок на стандарты,
      нет описания технических и организационных мер.
    • ITOUT2 — Провайдер может быстро приостановить сервис
      или удалить данные: при небольшой просрочке (< 30 дней),
      при споре, по усмотрению, без/с коротким уведомлением.
    • ITOUT3 — Vendor lock-in: отсутствуют или размыты
      механизмы экспорта данных и перехода к другому поставщику.
    • ITOUT4 — Провайдер вправе привлекать субподрядчиков
      без согласия клиента и без требований к их ИБ.
    • ITOUT5 — Провайдер вправе в одностороннем порядке
      изменять условия сервиса, включая уровень ИБ и SLA.
    • ITOUT6 — Нет SLA или SLA не содержит измеримых показателей
      и ответственности за простой.

    Формат ответа: коды через запятую без комментариев
    (например: "ITOUT1, ITOUT3").
    Вся аргументация — в поле reason.

    Шаг 9 — ОБОСНОВАНИЕ
    (используется для заполнения поля "reason"):
    - В reason кратко обоснуй вывод, опираясь на ключевые
      формулировки из текста (с цитатами в кавычках), и укажи:
      * какие функции переданы провайдеру и насколько они критичны;
      * какие ИБ-требования установлены (или не установлены);
      * каковы условия приостановки и exit-механизмы;
      * если выставлены red_flags — обоснуй каждый код;
      * если red_flags = "NONE" — укажи, почему риск контролируем.
    </instructions>

    <edge_cases>
    Обрабатывай пограничные ситуации так:

    - Критически важные функции (CRM, ERP, биллинг, платёжный
      процессинг) полностью завязаны на провайдера, условия
      приостановки жёсткие, exit-механизмов нет:
      зафиксируй ITOUT1 + ITOUT2 + ITOUT3; overall_risk_level = "high";
      в reason объясни совокупность факторов зависимости.

    - Провайдер описывает только базовые меры безопасности
      без ссылок на стандарты, но при этом:
      * предусмотрен разумный экспорт данных,
      * условия приостановки ограничены серьёзными нарушениями:
      оцени риск как "medium" с акцентом на неопределённость
      уровня ИБ; ITOUT1 может быть «под вопросом» — отрази
      в reason.

    - Провайдер вправе привлекать субподрядчиков без согласия
      клиента:
      зафиксируй ITOUT4; в reason укажи риск потери контроля
      над цепочкой обработки данных.

    - Провайдер может в одностороннем порядке изменять условия:
      зафиксируй ITOUT5; в reason укажи риск деградации сервиса
      и ИБ без возможности возражения.

    - SLA отсутствует или содержит только декларативные
      формулировки («мы стремимся обеспечить доступность»):
      зафиксируй ITOUT6; sla_quality = "absent" или "weak".

    - Договор не описывает ни меры безопасности, ни правила
      приостановки, ни экспорт/переход:
      red_flags = "UNCLEAR" или совокупность ITOUT-кодов
      по умолчанию (в зависимости от критичности функций);
      в reason зафиксируй высокую неопределённость.

    - Пустые или явно нерелевантные фрагменты:
      укажи, что данных недостаточно для анализа ИТ-аутсорсинга;
      red_flags = "UNCLEAR"; в reason объясни, что невозможность
      оценить ИБ и условия зависимости сама по себе создаёт риск.
    </edge_cases>

    <output_expectations>
    На основе твоего анализа отдельный механизм извлечения сформирует
    структурированные поля по заранее заданной схеме. Твоя задача —
    давать чёткие юридические выводы и указывать конкретные
    формулировки из текста, на которых они основаны.
    </output_expectations>

  enabled: true
  mode: "hybrid"
  fields:
    - name: "outsourced_it_functions_summary"
      type: "string"

    - name: "provider_security_obligations_present"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "subprocessor_controls"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "provider_can_suspend_easily"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "has_data_export_and_transition_mechanisms"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "sla_quality"
      type: "string"
      allowed_values:
        - "strong"
        - "weak"
        - "absent"
        - "unclear"

    - name: "provider_can_change_terms_unilaterally"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "red_flags"
      type: "string"

    - name: "reason"
      type: "string"

  store_payload: true

red_flags:
  items:
    - code: "ITOUT1"
      description: >
        Критические функции/данные у внешнего провайдера
        без чётких ИБ-требований: нет ссылок на стандарты,
        нет описания технических и организационных мер.
    - code: "ITOUT2"
      description: >
        Провайдер может быстро приостановить сервис или удалить
        данные: при небольшой просрочке (< 30 дней), при споре,
        по усмотрению, без/с коротким уведомлением.
    - code: "ITOUT3"
      description: >
        Vendor lock-in: отсутствуют или размыты механизмы
        экспорта данных и перехода к другому поставщику.
    - code: "ITOUT4"
      description: >
        Провайдер вправе привлекать субподрядчиков без согласия
        клиента и без требований к их ИБ.
    - code: "ITOUT5"
      description: >
        Провайдер вправе в одностороннем порядке изменять
        условия сервиса, включая уровень ИБ и SLA.
    - code: "ITOUT6"
      description: >
        Нет SLA или SLA не содержит измеримых показателей
        (uptime, время восстановления) и ответственности
        за простой.
        