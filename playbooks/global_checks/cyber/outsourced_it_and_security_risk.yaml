id: "outsourced_it_and_security_risk"
name: "Внешние ИТ-провайдеры, обработчики и ИБ-риск"
description: >
  Анализирует договоры с облачными провайдерами, SaaS, CRM/ERP,
  колл-центрами, HR-аутсорсом и другими внешними ИТ-обработчиками.

  Извлекает: ключевые функции на аутсорсинге, ИБ-обязательства
  провайдера, контроль субподрядчиков, условия приостановки /
  прекращения сервиса, механизмы экспорта данных и перехода
  к другому поставщику, качество SLA и право провайдера
  на одностороннее изменение условий.

  Формирует краткий user-facing вывод и оценивает общий уровень
  ИТ-зависимости (vendor lock-in) Target.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"
ui_mode: "field_extraction"

rules:
  keyword_mode: any

  keywords:
    high:
      # Облачные провайдеры и SaaS
      - "(?i)cloud\\s+provider"
      - "(?i)облачн[а-я]+\\s+провайдер"
      - "(?i)\\bSaaS\\b"
      - "(?i)software\\s+as\\s+a\\s+service"
      - "(?i)\\bIaaS\\b"
      - "(?i)\\bPaaS\\b"
      - "(?i)infrastructure\\s+as\\s+a\\s+service"
      - "(?i)platform\\s+as\\s+a\\s+service"

      # CRM/ERP и критичные системы
      - "(?i)\\bCRM\\b"
      - "(?i)\\bERP\\b"
      - "(?i)customer\\s+relationship\\s+management"
      - "(?i)enterprise\\s+resource\\s+planning"
      - "(?i)биллинг[а-я]*\\s+(систем|платформ)"
      - "(?i)billing\\s+(system|platform)"
      - "(?i)payment\\s+(gateway|processor|infrastructure)"
      - "(?i)платёжн[а-я]+\\s+(шлюз|инфраструктур)"

      # Обработчик данных
      - "(?i)data\\s+processor"
      - "(?i)обработчик\\s+(персональных\\s+)?данных"
      - "(?i)sub[-\\s]?processor"
      - "(?i)субобработчик"

      # Приостановка / прекращение сервиса
      - "(?i)service\\s+suspension"
      - "(?i)приостановлени[ея]\\s+(услуг|сервис)"
      - "(?i)suspend\\s+(the\\s+)?service"
      - "(?i)приостанов[ия]ть\\s+сервис"
      - "(?i)termination\\s+of\\s+service"
      - "(?i)прекращени[ея]\\s+(услуг|сервис)"
      - "(?i)discontinue\\s+(the\\s+)?service"
      - "(?i)right\\s+to\\s+(suspend|terminate|discontinue)[\\s\\S]{0,30}service"

      # Экспорт данных / переход
      - "(?i)data\\s+export"
      - "(?i)экспорт\\s+данных"
      - "(?i)data\\s+portability"
      - "(?i)переносимость\\s+данных"
      - "(?i)transition\\s+assistance"
      - "(?i)помощь\\s+при\\s+переход[еа]"
      - "(?i)exit\\s+(assistance|plan|strategy)"

    medium:
      # Аутсорсинг
      - "(?i)outsourcing"
      - "(?i)аутсорсинг"
      - "(?i)outsourced\\s+(services?|functions?)"
      - "(?i)managed\\s+services?"
      - "(?i)колл[-\\s]?центр"
      - "(?i)call[-\\s]?center"
      - "(?i)contact\\s+center"
      - "(?i)HR[-\\s]?(аутсорс|outsourcing)"

      # ИБ-обязательства
      - "(?i)security\\s+obligations?"
      - "(?i)обязанност[ьи]\\s+по\\s+(информационн[а-я]+\\s+)?безопасност[ьи]"
      - "(?i)\\bISO\\s*27001\\b"
      - "(?i)\\bSOC\\s*2\\b"
      - "(?i)\\bGDPR\\b"
      - "(?i)\\b152[-\\s]?ФЗ\\b"
      - "(?i)security\\s+audit"
      - "(?i)аудит\\s+безопасност[ьи]"

      # SLA
      - "(?i)\\bSLA\\b"
      - "(?i)service\\s+level\\s+agreement"
      - "(?i)соглашени[ея]\\s+об\\s+уровне\\s+(услуг|сервис)"
      - "(?i)uptime"
      - "(?i)availability\\s+(guarantee|level|target)"
      - "(?i)доступност[ьи]\\s+сервис"
      - "(?i)service\\s+credits?"
      - "(?i)кредит[аов]?\\s+за\\s+(простой|недоступност)"

      # Изменение условий
      - "(?i)unilateral\\s+(change|modification|amendment)[\\s\\S]{0,30}(terms|agreement)"
      - "(?i)одностороннее\\s+изменени[ея]\\s+условий"
      - "(?i)right\\s+to\\s+(modify|amend|change)\\s+the\\s+(terms|agreement)"

    low:
      - "(?i)cloud\\s+(storage|hosting|infrastructure)"
      - "(?i)облачн[а-я]+\\s+(хранени|хостинг|инфраструктур)"
      - "(?i)software\\s+as\\s+a\\s+service"
      - "(?i)managed\\s+service"
      - "(?i)data\\s+export"
      - "(?i)vendor\\s+lock"
      - "(?i)exit\\s+strategy"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 700

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  context_k: 5
  max_chunks: 10
  boost_keywords:
    - "cloud provider"
    - "облачный провайдер"
    - "SaaS"
    - "software as a service"
    - "CRM"
    - "ERP"
    - "outsourcing"
    - "аутсорсинг"
    - "data processor"
    - "обработчик данных"
    - "sub-processor"
    - "субобработчик"
    - "service suspension"
    - "приостановление услуг"
    - "termination of service"
    - "прекращение сервиса"
    - "right to suspend"
    - "data export"
    - "экспорт данных"
    - "data portability"
    - "переносимость данных"
    - "transition assistance"
    - "exit assistance"
    - "vendor lock-in"
    - "security obligations"
    - "обязанности по безопасности"
    - "ISO 27001"
    - "SOC 2"
    - "SLA"
    - "service level agreement"
    - "uptime"
    - "service credits"
    - "unilateral change of terms"
    - "одностороннее изменение условий"
  rerank: true
  filters: {}

conditional: null

enrichment_hints:
  preferred_segment_types:
    - "contract"
    - "annex"
    - "appendix"
    - "amendment"
  excluded_segment_types:
    - "price_list"
    - "invoice"
    - "act"
  preferred_clause_functions:
    - "data_protection"
    - "termination"
    - "liability"
  confidence_bonus_on_match: 0.10
  confidence_penalty_on_excluded_segment: 0.15

extraction:
  enabled: true
  mode: "hybrid"
  llm_max_tokens: 520
  llm_prompt_extraction: |
    <role>
    Ты — юрист по ИТ-контрактам, аутсорсингу и информационной
    безопасности. Твоя задача — точно извлечь из текста договора:
    1) какие функции переданы внешнему провайдеру;
    2) какие ИБ-обязательства установлены;
    3) как контролируются субподрядчики провайдера;
    4) каковы условия приостановки / прекращения сервиса;
    5) есть ли механизмы экспорта данных и перехода;
    6) каково качество SLA;
    7) может ли провайдер менять условия в одностороннем порядке.
    </role>

    <context>
    Ниже приведены релевантные фрагменты договора:

    {context}
    </context>

    <task>
    Заполни только следующие поля:
    - it_outsourcing_display
    - outsourced_it_functions_summary
    - provider_security_obligations_present
    - subprocessor_controls
    - provider_can_suspend_easily
    - has_data_export_and_transition_mechanisms
    - sla_quality
    - provider_can_change_terms_unilaterally
    - red_flags
    - reason

    Важно:
    - не анализируй тему шире текста;
    - не придумывай данные, которых нет в фрагментах;
    - пиши user-facing значения коротко и по-русски.
    </task>

    <instructions>
    Шаг 1 — КЛЮЧЕВЫЕ ИТ-ФУНКЦИИ НА АУТСОРСИНГЕ

    Заполни поле "outsourced_it_functions_summary".

    Определи, какие функции переданы провайдеру:
    * облачный хостинг, инфраструктура (IaaS/PaaS);
    * SaaS-приложения (CRM, ERP, биллинг, аналитика);
    * колл-центр, контакт-центр;
    * HR-аутсорсинг, расчёт зарплат;
    * платёжная инфраструктура, процессинг;
    * хранение и обработка данных.

    Правила:
    - Кратко перечисли выявленные функции через точку с запятой.
    - Приоритизируй наиболее бизнес-критичные.
    - Если неясно: "Конкретные функции не определены".

    Шаг 2 — ИБ-ОБЯЗАТЕЛЬСТВА ПРОВАЙДЕРА

    Заполни поле "provider_security_obligations_present".

    Значения:
    - "yes" — явно прописаны ИБ-требования:
      * ссылки на стандарты (ISO 27001, SOC 2, PCI DSS);
      * ссылки на законодательство (GDPR, 152-ФЗ);
      * конкретные меры (шифрование, контроль доступа, резервное
        копирование, мониторинг, аудит, уведомление о нарушениях).
    - "no" — ИБ-обязательства отсутствуют или явно отсутствуют
      в доступных фрагментах.
    - "unclear" — формулировки общие и неконкретные.

    Шаг 3 — СУБПОДРЯДЧИКИ ПРОВАЙДЕРА

    Заполни поле "subprocessor_controls".

    Значения:
    - "yes" — контроль субподрядчиков предусмотрен:
      требуется согласие клиента и/или ИБ-требования
      распространяются на субподрядчиков.
    - "no" — провайдер может привлекать субподрядчиков
      без ограничений.
    - "unclear" — из текста неясно.

    Шаг 4 — УСЛОВИЯ ПРИОСТАНОВКИ / ПРЕКРАЩЕНИЯ СЕРВИСА

    Заполни поле "provider_can_suspend_easily".

    Значения:
    - "yes" — провайдер может приостановить / прекратить сервис
      при мягких условиях:
      * небольшая просрочка оплаты (< 30 дней);
      * при споре между сторонами;
      * по усмотрению при размытых основаниях;
      * без уведомления или с коротким уведомлением (< 7 дней).
    - "no" — приостановка ограничена серьёзными нарушениями
      и предусмотрено разумное уведомление.
    - "unclear" — из текста неясно.

    Шаг 5 — ЭКСПОРТ ДАННЫХ И МЕХАНИЗМЫ ПЕРЕХОДА

    Заполни поле "has_data_export_and_transition_mechanisms".

    Значения:
    - "yes" — чётко прописаны:
      * право на экспорт данных в машиночитаемом формате;
      * сроки предоставления данных после запроса;
      * transition assistance при переходе к другому провайдеру;
      * grace period после расторжения.
    - "no" — механизмов нет или они описаны крайне общо.
    - "unclear" — из текста неясно.

    Шаг 6 — SLA И ОТВЕТСТВЕННОСТЬ ЗА ПРОСТОЙ

    Заполни поле "sla_quality".

    Значения:
    - "strong" — SLA содержит конкретные метрики и ответственность:
      uptime % / availability, RTO, service credits или штрафы.
    - "weak" — SLA есть, но без ответственности или с размытыми
      метриками.
    - "absent" — SLA отсутствует.
    - "unclear" — из текста неясно.

    Шаг 7 — ОДНОСТОРОННЕЕ ИЗМЕНЕНИЕ УСЛОВИЙ

    Заполни поле "provider_can_change_terms_unilaterally".

    Значения:
    - "yes" — провайдер вправе без согласия клиента менять
      условия договора: функциональность сервиса, уровень ИБ,
      SLA, ценообразование, условия обработки данных.
    - "no" — изменения требуют согласия клиента или ограничены
      разумными рамками.
    - "unclear" — из текста неясно.

    Шаг 8 — RED FLAGS

    Заполни поле "red_flags".

    Используй:
    - "NONE" — если существенных риск-факторов нет.
    - "UNCLEAR" — если данных недостаточно.
    - Коды через запятую:
      * ITOUT1 — критические функции / данные у провайдера
        без чётких ИБ-требований: нет ссылок на стандарты,
        нет описания мер защиты.
      * ITOUT2 — провайдер может быстро приостановить сервис
        или удалить данные при мягких условиях.
      * ITOUT3 — vendor lock-in: нет или размыты механизмы
        экспорта данных и перехода к другому поставщику.
      * ITOUT4 — провайдер вправе привлекать субподрядчиков
        без согласия клиента и без ИБ-требований к ним.
      * ITOUT5 — провайдер вправе в одностороннем порядке
        менять условия сервиса, включая уровень ИБ и SLA.
      * ITOUT6 — нет SLA или SLA не содержит измеримых
        показателей и ответственности за простой.

    Шаг 9 — USER-FACING SUMMARY

    Заполни поле "it_outsourcing_display".

    Строй display как краткий factual вывод:

    Примеры:
    - "CRM + ERP на аутсорсинге; ИБ-обязательства есть
       (ISO 27001); SLA strong; нет exit-механизмов"
    - "SaaS-платформа; ИБ-обязательства не описаны;
       провайдер вправе приостановить при просрочке"
    - "Колл-центр; субподрядчики без контроля;
       одностороннее изменение условий"
    - "Не удалось определить ИТ-аутсорсинг риски"

    Правила:
    - Отрази максимум 3–4 ключевых факта через точку с запятой.
    - Если все параметры unclear:
      "Не удалось определить ИТ-аутсорсинг риски"
    - Начинай с типа функции если он известен.

    Шаг 10 — ОБОСНОВАНИЕ

    Заполни поле "reason".

    Правила:
    - 1–2 коротких предложения.
    - Укажи: какие функции переданы, какие ИБ-требования
      установлены, каковы условия приостановки и exit-механизмы,
      почему выставлены red_flags.
    - Приведи короткую цитату из текста в кавычках.
    - Если red_flags = "NONE" — укажи, почему риск контролируем.
    </instructions>

    <edge_cases>
    - Критические функции (CRM, ERP, биллинг, платёжный
      процессинг) без ИБ-требований, жёсткая приостановка,
      нет exit-механизмов:
      * red_flags = "ITOUT1, ITOUT2, ITOUT3"
      * в reason: совокупность факторов зависимости

    - Базовые меры безопасности без стандартов, но разумные
      условия приостановки и экспорт данных предусмотрен:
      * provider_security_obligations_present = "unclear"
      * ITOUT1 под вопросом — отрази в reason
      * общий риск "medium"

    - Провайдер привлекает субподрядчиков без согласия:
      * subprocessor_controls = "no"
      * red_flags включает "ITOUT4"

    - Одностороннее изменение условий:
      * provider_can_change_terms_unilaterally = "yes"
      * red_flags включает "ITOUT5"

    - SLA только декларативный ("стремимся обеспечить
      доступность"):
      * sla_quality = "weak" или "absent"
      * red_flags включает "ITOUT6"

    - Нет релевантных фрагментов:
      * все поля = "unclear"
      * red_flags = "UNCLEAR"
      * it_outsourcing_display =
        "Не удалось определить ИТ-аутсорсинг риски"

    - Всё в порядке:
      * red_flags = "NONE"
      * в reason объясни, почему риск контролируем
    </edge_cases>

    <output_expectations>
    Все значения должны быть короткими, точными и пригодными
    для отображения пользователю в DD Grid.
    Не добавляй никаких полей, кроме указанных в схеме extraction.
    </output_expectations>

  fields:
    - name: "it_outsourcing_display"
      type: "string"
      description: "ИТ-аутсорсинг: краткий вывод"

    - name: "outsourced_it_functions_summary"
      type: "string"
      description: "Ключевые функции на аутсорсинге"

    - name: "provider_security_obligations_present"
      type: "string"
      description: "ИБ-обязательства провайдера"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "subprocessor_controls"
      type: "string"
      description: "Контроль субподрядчиков провайдера"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "provider_can_suspend_easily"
      type: "string"
      description: "Риск лёгкой приостановки сервиса"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "has_data_export_and_transition_mechanisms"
      type: "string"
      description: "Механизмы экспорта данных и перехода"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "sla_quality"
      type: "string"
      description: "Качество SLA"
      allowed_values:
        - "strong"
        - "weak"
        - "absent"
        - "unclear"

    - name: "provider_can_change_terms_unilaterally"
      type: "string"
      description: "Одностороннее изменение условий провайдером"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "red_flags"
      type: "string"
      description: "Коды ИТ-аутсорсинг рисков"

    - name: "reason"
      type: "string"
      description: "Обоснование"

  store_payload: true

  