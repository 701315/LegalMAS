id: "outsourced_it_and_security_risk"
name: "Внешние ИТ-провайдеры, обработчики и ИБ-риск"
group: "Cybersecurity"
description: >
  Анализирует договоры с облачными провайдерами, SaaS, CRM/ERP,
  колл-центрами, HR-аутсорсом и другими внешними ИТ-обработчиками.

  Извлекает: ключевые функции на аутсорсинге, ИБ-обязательства
  провайдера, контроль субподрядчиков, условия приостановки /
  прекращения сервиса, механизмы экспорта данных и перехода
  к другому поставщику, качество SLA и право провайдера
  на одностороннее изменение условий.

  Формирует краткий user-facing вывод и оценивает общий уровень
  ИТ-зависимости (vendor lock-in) Target.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"
ui_mode: "field_extraction"

rules:
  keyword_mode: any

  keywords:
    high:
      - "(?i)cloud\\s+provider"
      - "(?i)облачн[а-я]+\\s+провайдер"
      - "(?i)\\bSaaS\\b"
      - "(?i)software\\s+as\\s+a\\s+service"
      - "(?i)\\bIaaS\\b"
      - "(?i)\\bPaaS\\b"
      - "(?i)infrastructure\\s+as\\s+a\\s+service"
      - "(?i)platform\\s+as\\s+a\\s+service"
      - "(?i)\\bCRM\\b"
      - "(?i)\\bERP\\b"
      - "(?i)customer\\s+relationship\\s+management"
      - "(?i)enterprise\\s+resource\\s+planning"
      - "(?i)биллинг[а-я]*\\s+(систем|платформ)"
      - "(?i)billing\\s+(system|platform)"
      - "(?i)payment\\s+(gateway|processor|infrastructure)"
      - "(?i)платёжн[а-я]+\\s+(шлюз|инфраструктур)"
      - "(?i)data\\s+processor"
      - "(?i)обработчик\\s+(персональных\\s+)?данных"
      - "(?i)sub[-\\s]?processor"
      - "(?i)субобработчик"
      - "(?i)service\\s+suspension"
      - "(?i)приостановлени[ея]\\s+(услуг|сервис)"
      - "(?i)suspend\\s+(the\\s+)?service"
      - "(?i)приостанов[ия]ть\\s+сервис"
      - "(?i)termination\\s+of\\s+service"
      - "(?i)прекращени[ея]\\s+(услуг|сервис)"
      - "(?i)discontinue\\s+(the\\s+)?service"
      - "(?i)right\\s+to\\s+(suspend|terminate|discontinue)[\\s\\S]{0,30}service"
      - "(?i)data\\s+export"
      - "(?i)экспорт\\s+данных"
      - "(?i)data\\s+portability"
      - "(?i)переносимость\\s+данных"
      - "(?i)transition\\s+assistance"
      - "(?i)помощь\\s+при\\s+переход[еа]"
      - "(?i)exit\\s+(assistance|plan|strategy)"

    medium:
      - "(?i)outsourcing"
      - "(?i)аутсорсинг"
      - "(?i)outsourced\\s+(services?|functions?)"
      - "(?i)managed\\s+services?"
      - "(?i)колл[-\\s]?центр"
      - "(?i)call[-\\s]?center"
      - "(?i)contact\\s+center"
      - "(?i)HR[-\\s]?(аутсорс|outsourcing)"
      - "(?i)security\\s+obligations?"
      - "(?i)обязанност[ьи]\\s+по\\s+(информационн[а-я]+\\s+)?безопасност[ьи]"
      - "(?i)\\bISO\\s*27001\\b"
      - "(?i)\\bSOC\\s*2\\b"
      - "(?i)\\bGDPR\\b"
      - "(?i)\\b152[-\\s]?ФЗ\\b"
      - "(?i)security\\s+audit"
      - "(?i)аудит\\s+безопасност[ьи]"
      - "(?i)\\bSLA\\b"
      - "(?i)service\\s+level\\s+agreement"
      - "(?i)соглашени[ея]\\s+об\\s+уровне\\s+(услуг|сервис)"
      - "(?i)uptime"
      - "(?i)availability\\s+(guarantee|level|target)"
      - "(?i)доступност[ьи]\\s+сервис"
      - "(?i)service\\s+credits?"
      - "(?i)кредит[аов]?\\s+за\\s+(простой|недоступност)"
      - "(?i)unilateral\\s+(change|modification|amendment)[\\s\\S]{0,30}(terms|agreement)"
      - "(?i)одностороннее\\s+изменени[ея]\\s+условий"
      - "(?i)right\\s+to\\s+(modify|amend|change)\\s+the\\s+(terms|agreement)"

    low:
      - "(?i)cloud\\s+(storage|hosting|infrastructure)"
      - "(?i)облачн[а-я]+\\s+(хранени|хостинг|инфраструктур)"
      - "(?i)software\\s+as\\s+a\\s+service"
      - "(?i)managed\\s+service"
      - "(?i)data\\s+export"
      - "(?i)vendor\\s+lock"
      - "(?i)exit\\s+strategy"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 700

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  retrieval_profile: "cybersecurity_check"
  context_k: 7
  max_chunks: 15

  retrieval_query: >
    облачные услуги SaaS CRM ERP аутсорс ИТ-провайдер
    SLA уровень сервиса uptime приостановление услуг прекращение сервиса
    экспорт данных переносимость данных transition assistance
    одностороннее изменение условий ИБ требования

  boost_keywords:
    - "cloud provider"
    - "SaaS"
    - "облачные услуги"
    - "SLA"
    - "service level agreement"
    - "uptime"
    - "service suspension"
    - "приостановление услуг"
    - "data export"
    - "экспорт данных"
    - "transition assistance"
    - "unilateral change"
    - "одностороннее изменение"
    - "security obligations"
    - "security measures"

  negative_keywords:
    - "означает"
    - "в целях настоящего"
    - "споры"
    - "подсудность"
    - "применимое право"
    - "переход права собственности"
    - "купли-продажи товара"

  preferred_unit_types:
    - "obligation"
    - "payment_term"
    - "termination_provision"
    - "general_provision"

  excluded_unit_types:
    - "definition"
    - "structural_anchor"
    - "technical_fragment"
    - "appendix_reference"

  preferred_clause_functions:
    - "obligations"
    - "procedures"
    - "limitations"

  position_bias:
    preferred_range: [0.10, 0.90]
    boost: 0.20
    scope: "segment"

  rerank: true
  filters: {}

conditional: null

enrichment_hints:
  preferred_segment_types:
    - "contract"
    - "annex"
    - "appendix"
    - "amendment"
  excluded_segment_types:
    - "act"
    - "invoice"
  confidence_bonus_on_match: 0.10
  confidence_penalty_on_excluded_segment: 0.15

extraction:
  enabled: true
  mode: "hybrid"
  llm_max_tokens: 1050

  llm_prompt_extraction: |
    <role>
    Ты — юрист по ИТ-контрактам и аутсорсингу.
    Твоя задача — точно извлечь из текста договора:
    1) какие функции переданы внешнему провайдеру;
    2) какие ИБ-обязательства провайдера установлены;
    3) как контролируются субподрядчики;
    4) каковы условия приостановки / прекращения сервиса;
    5) есть ли механизмы экспорта данных и перехода;
    6) каково качество SLA;
    7) может ли провайдер менять условия в одностороннем порядке.

    КРИТИЧЕСКИ ВАЖНО:
    - Извлекай ТОЛЬКО то, что прямо написано в тексте.
    - НЕ придумывай функции на аутсорсинге, если они не указаны.
    - НЕ предполагай наличие SLA или exit-механизмов без явного упоминания.
    - Если информация отсутствует — используй "no", "absent" или "unclear".
    </role>

    <context>
    Ниже приведены релевантные фрагменты договора:

    {context}
    </context>

    <context_rules>
    - Некоторые фрагменты могут быть нерелевантны — игнорируй их.
    - Если фрагменты противоречат друг другу — используй "unclear"
      и кратко объясни в reason.
    - Если речь идёт о поставке товаров или обычном сервисном договоре
      без ИТ-аутсорсинга — это может быть не в scope данного check.
    - "provider_can_suspend_easily" = "yes" только если основания
      мягкие: просрочка < 30 дней без cure, по усмотрению провайдера.
    - SLA "strong" = конкретный uptime %, service credits / penalties.
      SLA "weak" = есть SLA, но без метрик или кредитов.
    - "outsourced_it_functions_summary" — только функции, явно
      переданные внешнему ИТ-провайдеру. Не угадывай по отрасли.
    </context_rules>

    <task>
    Заполни только следующие поля:
    - it_outsourcing_display
    - outsourced_it_functions_summary
    - provider_security_obligations_present
    - subprocessor_controls
    - provider_can_suspend_easily
    - has_data_export_and_transition_mechanisms
    - sla_quality
    - provider_can_change_terms_unilaterally
    - reason
    </task>

    <instructions>
    Шаг 1 — ФУНКЦИИ НА АУТСОРСИНГЕ

    Заполни "outsourced_it_functions_summary".

    Правила:
    - Кратко через ";", не более 3 позиций:
      "CRM; ERP", "SaaS + колл-центр", "облачная инфраструктура"
    - Если нет ИТ-аутсорсинга: "Не выявлено"
    - Если нельзя определить: "Не удалось определить"

    Категории для распознавания:
    - облачный хостинг / инфраструктура (IaaS / PaaS / cloud)
    - SaaS-приложения (CRM, ERP, биллинг, HR-система, аналитика)
    - колл-центр / контакт-центр
    - платёжная инфраструктура / процессинг
    - хранение и обработка данных

    Шаг 2 — ИБ-ОБЯЗАТЕЛЬСТВА ПРОВАЙДЕРА

    Заполни "provider_security_obligations_present".

    Значения:
    - "yes" — явно прописаны ИБ-требования: ссылки на стандарты
      (ISO 27001, SOC 2), конкретные меры (шифрование, аудит,
      penetration testing).
    - "no" — ИБ-обязательства отсутствуют.
    - "unclear" — формулировки общие без конкретики.

    Шаг 3 — КОНТРОЛЬ СУБПОДРЯДЧИКОВ

    Заполни "subprocessor_controls".

    Значения:
    - "yes" — контроль предусмотрен: согласие клиента
      на привлечение субподрядчиков или право на аудит.
    - "no" — провайдер может привлекать субподрядчиков
      без ограничений / согласия.
    - "unclear" — нельзя определить.

    Шаг 4 — УСЛОВИЯ ПРИОСТАНОВКИ СЕРВИСА

    Заполни "provider_can_suspend_easily".

    Значения:
    - "yes" — провайдер может приостановить сервис
      при мягких условиях: просрочка < 30 дней без cure period,
      немедленно, по субъективному усмотрению.
    - "no" — приостановка ограничена серьёзными нарушениями
      с cure period или уведомлением.
    - "unclear" — нельзя определить.

    Шаг 5 — МЕХАНИЗМЫ ЭКСПОРТА ДАННЫХ И ПЕРЕХОДА

    Заполни "has_data_export_and_transition_mechanisms".

    Значения:
    - "yes" — явно предусмотрены: право на экспорт данных,
      transition assistance, exit plan, переход к другому
      провайдеру с помощью текущего.
    - "no" — механизмов нет или описаны только в общих чертах.
    - "unclear" — нельзя определить.

    Шаг 6 — КАЧЕСТВО SLA

    Заполни "sla_quality".

    Значения:
    - "strong" — конкретные метрики: uptime %, SLA credits /
      penalties, конкретные сроки восстановления.
    - "weak" — SLA упоминается, но без конкретных метрик
      или кредитов.
    - "absent" — SLA отсутствует или не упоминается.
    - "unclear" — нельзя определить.

    Шаг 7 — ОДНОСТОРОННЕЕ ИЗМЕНЕНИЕ УСЛОВИЙ

    Заполни "provider_can_change_terms_unilaterally".

    Значения:
    - "yes" — провайдер вправе изменять условия без согласия
      клиента: notice-only или без уведомления.
    - "no" — изменения требуют согласия клиента.
    - "unclear" — нельзя определить.

    Шаг 8 — НОРМАЛИЗОВАННЫЙ DISPLAY ДЛЯ DD GRID

    Заполни "it_outsourcing_display".

    Это итоговое поле для таблицы.
    Строй его ТОЛЬКО на основе уже заполненных полей выше.
    Не добавляй информацию сверх них.

    Возможные состояния:
    1. Аутсорсинг выявлен, параметры известны:
       "CRM; ИБ-обязательства есть; SLA strong; exit-механизм есть"
    2. Аутсорсинг выявлен, есть риски:
       "SaaS-платформа; ИБ не описана; риск лёгкой приостановки"
    3. ИТ-аутсорсинг не выявлен:
       "ИТ-аутсорсинг не выявлен"
    4. Не удалось определить:
       "Не удалось определить условия ИТ-аутсорсинга"

    Правила:
    - Если все поля unclear:
      "Не удалось определить условия ИТ-аутсорсинга"
    - Если outsourced_it_functions_summary = "Не выявлено":
      "ИТ-аутсорсинг не выявлен"
    - Иначе комбинируй через ";":
      * начни с outsourced_it_functions_summary (кратко)
      * если provider_security_obligations_present = "yes":
        "ИБ-обязательства есть"
      * если provider_security_obligations_present = "no":
        "ИБ не описана"
      * если sla_quality = "strong":
        "SLA strong"
      * если sla_quality = "absent":
        "SLA отсутствует"
      * если provider_can_suspend_easily = "yes":
        "риск лёгкой приостановки"
      * если has_data_export_and_transition_mechanisms = "no":
        "нет exit-механизма"
      * если provider_can_change_terms_unilaterally = "yes":
        "одностороннее изменение условий"
    - Не более 4 коротких фактов через ";".

    Шаг 9 — КРАТКОЕ ОБОСНОВАНИЕ

    Заполни "reason".

    Правила:
    - Первое предложение — краткий вывод по функциям и ИБ.
    - Второе — SLA / приостановка / exit + цитата (до 100 символов).
    - Пиши по-русски.
    </instructions>

    <edge_cases>
    - ИТ-аутсорсинга нет в договоре:
      * outsourced_it_functions_summary = "Не выявлено"
      * все сигналы = "unclear" или "no"
      * it_outsourcing_display = "ИТ-аутсорсинг не выявлен"

    - Декларативные ИБ без конкретики:
      * provider_security_obligations_present = "unclear"

    - Провайдер может менять условия с 30-дневным notice:
      * provider_can_change_terms_unilaterally = "yes"

    - Есть uptime 99.9% + service credits:
      * sla_quality = "strong"

    - SLA упомянут без метрик:
      * sla_quality = "weak"

    - Нет transition assistance и data export:
      * has_data_export_and_transition_mechanisms = "no"

    - Нет релевантных фрагментов:
      * все поля = "unclear"
      * outsourced_it_functions_summary = "Не удалось определить"
      * it_outsourcing_display =
        "Не удалось определить условия ИТ-аутсорсинга"
    </edge_cases>

    <output_expectations>
    - Верни результат строго в формате JSON.
    - Не оборачивай ответ в markdown-блоки.
    - Не добавляй комментариев вне JSON.
    - Для полей с allowed_values используй строго значения из списка.
    - Свободные текстовые поля
      (it_outsourcing_display, outsourced_it_functions_summary, reason)
      заполняй на русском языке.
    - Не добавляй никаких полей, кроме указанных.

    Пример структуры ответа:
    {
      "it_outsourcing_display": "CRM; ИБ-обязательства есть; SLA strong; нет exit-механизма",
      "outsourced_it_functions_summary": "CRM",
      "provider_security_obligations_present": "yes",
      "subprocessor_controls": "yes",
      "provider_can_suspend_easily": "no",
      "has_data_export_and_transition_mechanisms": "no",
      "sla_quality": "strong",
      "provider_can_change_terms_unilaterally": "no",
      "reason": "..."
    }
    </output_expectations>

  fields:
    - name: "it_outsourcing_display"
      type: "string"
      presentation: "fact"
      label: "ИТ-аутсорсинг"
      description: "Нормализованный user-facing вывод для DD Grid"
      display_in_grid: true
      display_priority: 1

    - name: "outsourced_it_functions_summary"
      type: "string"
      presentation: "fact"
      label: "Функции на аутсорсинге"
      description: "Краткий перечень ключевых функций у провайдера"
      display_in_grid: true
      display_priority: 2

    - name: "provider_security_obligations_present"
      type: "string"
      presentation: "signal"
      description: "ИБ-обязательства провайдера"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
      display_in_grid: false

    - name: "subprocessor_controls"
      type: "string"
      presentation: "signal"
      description: "Контроль субподрядчиков провайдера"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
      display_in_grid: false

    - name: "provider_can_suspend_easily"
      type: "string"
      presentation: "signal"
      description: "Риск лёгкой приостановки сервиса"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
      display_in_grid: false

    - name: "has_data_export_and_transition_mechanisms"
      type: "string"
      presentation: "signal"
      description: "Механизмы экспорта данных и перехода"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
      display_in_grid: false

    - name: "sla_quality"
      type: "string"
      presentation: "signal"
      description: "Качество SLA"
      allowed_values:
        - "strong"
        - "weak"
        - "absent"
        - "unclear"
      display_in_grid: false

    - name: "provider_can_change_terms_unilaterally"
      type: "string"
      presentation: "signal"
      description: "Одностороннее изменение условий провайдером"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
      display_in_grid: false

    - name: "reason"
      type: "string"
      presentation: "diagnostic"
      description: "Обоснование"
      display_in_grid: false

  store_payload: true


  
