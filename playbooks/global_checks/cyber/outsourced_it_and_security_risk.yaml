id: "outsourced_it_and_security_risk"
name: "Внешние ИТ-провайдеры, обработчики и ИБ-риск"
description: >
  Анализирует договоры с облачными провайдерами, CRM/ERP, колл-центрами,
  HR-аутсорсом и другими обработчиками, с точки зрения защиты данных и
  риска отключения сервисов.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"

rules:
  keywords:
    - "облачный провайдер"
    - "cloud provider"
    - "SaaS"
    - "software as a service"
    - "CRM"
    - "ERP"
    - "колл-центр"
    - "call center"
    - "outsourcing"
    - "аутсорсинг"
    - "data processor"
    - "обработчик данных"
    - "service suspension"
    - "приостановление услуг"
    - "termination of service"
    - "security obligations"
    - "обязанности по безопасности"
    - "data processing"
    - "обработка данных"
  keyword_mode: "any"
  regex_patterns: []
  clause_patterns: []

llm:
  prompt_template: |
    <role>
    Ты — юрист по ИТ-аутсорсингу и безопасности.
    Твоя специализация — договоры с облачными провайдерами, SaaS и сторонними
    обработчиками данных.
    </role>

    <context>
    Ниже приведены фрагменты договора с ИТ-провайдером/обработчиком данных:

    {context}
    </context>

    <instructions>
    Определи:

    1) Какие ключевые ИТ-сервисы и функции отданы на аутсорсинг:
       - облачный хостинг, CRM/ERP, колл-центр, HR, платёжная инфраструктура и т.п.
       Сформулируй краткое резюме в outsourced_it_functions_summary.

    2) Какие обязательства по безопасности и защите данных возложены на провайдера:
       - наличие security obligations, ссылок на стандарты (ISO 27001 и др.),
         технические и организационные меры (шифрование, контроль доступа,
         резервное копирование и т.п.).
       Отрази факт их наличия в provider_security_obligations_present.

    3) В каких случаях провайдер может:
       - приостановить сервис,
       - ограничить доступ,
       - удалить или заблокировать данные.
       Оцени, может ли провайдер делать это "легко":
       * при небольшой просрочке,
       * при споре,
       * по своему усмотрению без чёткого перечня оснований.
       Это отрази в provider_can_suspend_or_terminate_service_easily.

    4) Есть ли достаточные гарантии доступа/экспорта данных и механизмы перехода:
       - право и формат экспорта данных, сроки,
       - помощь в миграции к другому провайдеру,
       - сохранение доступности данных после расторжения на ограниченный срок.
       Отрази это в has_clear_data_export_and_transition_mechanisms.

    5) Оцени уровень ИТ-зависимости и риска отключения (it_dependency_risk_level:
       low / medium / high / unclear) с точки зрения Target:
       - учитывай критичность функций, жёсткость условий приостановки/удаления данных
         и наличие/отсутствие exit-механизмов.

    6) Оцени общий уровень риска (overall_risk_level: low / medium / high),
       исходя из ИБ-обязательств и зависимости от провайдера.
    </instructions>

    <edge_cases>
    ВАЖНО — пограничные случаи:

    — Если критически важные функции (например, CRM/ERP) полностью завязаны на
      провайдера, а условия приостановки услуги жёсткие (быстрая блокировка при
      небольшой просрочке, право приостановить при споре) и нет ясных механизмов
      экспорта/перехода:
      provider_can_suspend_or_terminate_service_easily = "yes",
      has_clear_data_export_and_transition_mechanisms = "no",
      it_dependency_risk_level, как правило, "high".

    — Если провайдер описывает только базовые технические меры без упоминания
      стандартов, но при этом есть разумные условия экспорта данных и мягкие
      условия приостановки:
      provider_security_obligations_present = "yes",
      it_dependency_risk_level обычно "medium" (обоснуй в reason).

    — Если договор явно не описывает ни меры безопасности, ни правила
      приостановки, ни экспорт данных:
      provider_security_obligations_present = "unclear",
      provider_can_suspend_or_terminate_service_easily = "unclear",
      has_clear_data_export_and_transition_mechanisms = "unclear",
      it_dependency_risk_level = "unclear".

    — Пустые или нерелевантные фрагменты:
      большинство полей = "unclear" или пустые строки,
      overall_risk_level = "medium",
      reason = "Недостаточно данных для анализа аутсорсинга ИТ-функций и связанных рисков."
    </edge_cases>

    <examples>
    ПРИМЕР 1 — ВЫСОКИЙ РИСК ЗАВИСИМОСТИ:

    Фрагмент: "Поставщик вправе приостановить оказание Услуг и заблокировать
    доступ Клиента к Сервису при любой просрочке оплаты более 5 (пяти) дней.
    В случае расторжения Договора данные Клиента подлежат удалению немедленно
    без обязательства предоставления резервной копии."

    {{
      "outsourced_it_functions_summary": "Критичный облачный сервис (например, CRM/ERP) полностью на стороне провайдера.",
      "provider_security_obligations_present": "unclear",
      "provider_can_suspend_or_terminate_service_easily": "yes",
      "has_clear_data_export_and_transition_mechanisms": "no",
      "it_dependency_risk_level": "high",
      "overall_risk_level": "high",
      "reason": "Провайдер может быстро заблокировать доступ и удалить данные при небольшой просрочке, отсутствуют механизмы экспорта и перехода к другому провайдеру."
    }}

    ПРИМЕР 2 — УМЕРЕННЫЙ РИСК, ЕСТЬ EXIT:

    Фрагмент: "Поставщик предоставляет облачный CRM-сервис. Клиент вправе
    экспортировать свои данные в машиночитаемом формате в течение 30 дней
    после расторжения Договора. Приостановление услуг допускается только
    при существенном нарушении условий, после предварительного уведомления."

    {{
      "outsourced_it_functions_summary": "Облачный CRM-сервис у внешнего провайдера.",
      "provider_security_obligations_present": "unclear",
      "provider_can_suspend_or_terminate_service_easily": "no",
      "has_clear_data_export_and_transition_mechanisms": "yes",
      "it_dependency_risk_level": "medium",
      "overall_risk_level": "medium",
      "reason": "Есть понятный механизм экспорта данных и ограниченный перечень оснований для приостановки, но требования ИБ описаны не детально."
    }}

    ПРИМЕР 3 — ФОРМАЛИЗОВАННЫЙ ИБ, НИЗКИЙ РИСК:

    Фрагмент: "Поставщик обязан соблюдать Политику информационной безопасности,
    включающую ISO 27001, и предоставлять Клиенту отчёты о независимых аудиторских
    проверках. Клиент имеет право на экспорт данных и помощь Поставщика
    при миграции к другому провайдеру в течение 60 дней после расторжения."

    {{
      "outsourced_it_functions_summary": "Облачная платформа с критичными данными Клиента.",
      "provider_security_obligations_present": "yes",
      "provider_can_suspend_or_terminate_service_easily": "no",
      "has_clear_data_export_and_transition_mechanisms": "yes",
      "it_dependency_risk_level": "medium",
      "overall_risk_level": "low",
      "reason": "Существует формализованная ИБ-политика и аудит, а также предусмотрен экспорт данных и миграция; риск связан в основном с самой моделью зависимости от внешнего провайдера."
    }}
    </examples>

    <output_format>
    Твой ответ ДОЛЖЕН быть строго валидным JSON-объектом со следующими
    полями:

    {{
      "outsourced_it_functions_summary": "string — краткое описание ключевых ИТ-функций на аутсорсинге",
      "provider_security_obligations_present": "one of: yes | no | unclear",
      "provider_can_suspend_or_terminate_service_easily": "one of: yes | no | unclear",
      "has_clear_data_export_and_transition_mechanisms": "one of: yes | no | unclear",
      "it_dependency_risk_level": "one of: low | medium | high | unclear",
      "overall_risk_level": "one of: low | medium | high",
      "reason": "string — краткое объяснение на русском с указанием ключевых формулировок и оценки рисков"
    }}

    Все перечисленные поля ДОЛЖНЫ присутствовать в JSON, даже если их значение равно null.
    </output_format>

    <constraints>
    ЖЁСТКИЕ ПРАВИЛА:
    1. Выведи ТОЛЬКО один JSON-объект. Никакого текста до или после.
    2. Не пиши "Вот JSON", "Here is the JSON" и т.п.
    3. Не используй Markdown, бэктики ``` или любые обёртки.
    4. Все строки — в двойных кавычках.
    5. Значения перечислимых полей — СТРОГО из указанных вариантов.
    6. Ключи — точно как указано, без добавления новых.
    7. Поле "reason" ДОЛЖНО содержать конкретные факты и формулировки
       из фрагментов, а не общие фразы вроде "есть риски".
    8. Начни ответ сразу с символа {{
    9. Если по какому‑то полю нет достаточно информации в тексте —
       верни для него 'unclear' или null (для reason пустое значение
       недопустимо — нужно объяснение). НЕ придумывай значения, не интерполируй.
    </constraints>
  prompt_file: null
  context_k: 5
  temperature: 0.0
  max_tokens: 640

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  context_k: 5
  max_chunks: 10
  boost_keywords:
    - "cloud provider"
    - "SaaS"
    - "outsourcing"
    - "service suspension"
    - "обработчик данных"
    - "security obligations"
  rerank: true
  filters: {}

conditional: null

extraction:
  enabled: true
  mode: "hybrid"
  fields:
    - name: "outsourced_it_functions_summary"
      type: "string"
    - name: "provider_security_obligations_present"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
    - name: "provider_can_suspend_or_terminate_service_easily"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
    - name: "has_clear_data_export_and_transition_mechanisms"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
    - name: "it_dependency_risk_level"
      type: "string"
      allowed_values:
        - "low"
        - "medium"
        - "high"
        - "unclear"
    - name: "overall_risk_level"
      type: "string"
      allowed_values:
        - "low"
        - "medium"
        - "high"
    - name: "reason"
      type: "string"
  store_payload: true

red_flags:
  items:
    - code: "CYB3"
      description: "Критические функции и данные у внешнего провайдера без чётких требований по ИБ."
    - code: "CYB4"
      description: "Провайдер может быстро отключить сервис/удалить данные при споре или небольшой просрочке."

      