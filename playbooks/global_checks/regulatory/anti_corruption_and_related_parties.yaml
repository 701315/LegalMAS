id: "anti_corruption_and_related_parties"
name: "Антикоррупция и сделки с аффилированными лицами"
group: "Regulatory"
description: >
  Анализирует антикоррупционные положения (запрет взяток, откатов,
  неподобающих подарков / hospitality, ссылки на FCPA / UK Bribery
  Act / ФЗ-273, кодексы этики, права аудита, whistleblowing) и
  регулирование сделок с аффилированными лицами (раскрытие,
  arm's length, корпоративные одобрения).

  Формирует краткий user-facing вывод и оценивает комплаенс-зрелость
  и риски конфликтов интересов.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"
ui_mode: "field_extraction"

rules:
  keyword_mode: any

  keywords:
    high:
      # Прямые антикоррупционные запреты
      - "(?i)anti[-\\s]?corruption"
      - "(?i)anti[-\\s]?bribery"
      - "(?i)запрет[\\s\\S]{0,20}(взяток|взятки|откатов|откат)"
      - "(?i)prohibit[\\s\\S]{0,20}(bribe|bribery|kickback|corrupt)"
      - "(?i)shall\\s+not\\s+[\\s\\S]{0,30}(bribe|kickback|corrupt\\s+payment)"
      - "(?i)не\\s+(допуска[ею]т|вправе)[\\s\\S]{0,30}(взятк|откат|коррупц)"

      # Ссылки на законы
      - "(?i)FCPA"
      - "(?i)Foreign\\s+Corrupt\\s+Practices\\s+Act"
      - "(?i)UK\\s+Bribery\\s+Act"
      - "(?i)Bribery\\s+Act\\s+2010"
      - "(?i)антикоррупционн[а-я]+\\s+законодательств"
      - "(?i)ФЗ[-\\s]*(о\\s+)?противодействи[ия]\\s+коррупц"
      - "(?i)273[-\\s]?ФЗ"

      # Код этики с обязательством соблюдения
      - "(?i)code\\s+of\\s+(conduct|ethics)\\s+[\\s\\S]{0,40}(comply|adhere|bound)"
      - "(?i)обязу[ею]тся\\s+соблюдать\\s+[\\s\\S]{0,30}кодекс\\s+(этик|поведени)"
      - "(?i)ethics\\s+(&|and)\\s+compliance\\s+polic(y|ies)"

      # Права аудита комплаенса
      - "(?i)audit\\s+rights?\\s+[\\s\\S]{0,40}(compliance|anti[-\\s]?corruption)"
      - "(?i)право\\s+(на\\s+)?аудит[\\s\\S]{0,40}(комплаенс|антикоррупц)"
      - "(?i)inspection\\s+rights?\\s+[\\s\\S]{0,40}(records|compliance)"
      - "(?i)право\\s+провер[кяи][\\s\\S]{0,40}(соблюдени|комплаенс)"

      # Related party — arm's length
      - "(?i)arm['']?s[-\\s]?length\\s+(terms?|basis|conditions?|pricing)"
      - "(?i)на\\s+рыночн[а-я]+\\s+условиях"
      - "(?i)по\\s+рыночн[а-я]+\\s+цен[аы]"
      - "(?i)fair\\s+market\\s+(value|terms|conditions)"

      # Корпоративные одобрения заинтересованных сделок
      - "(?i)board\\s+(of\\s+directors\\s+)?approval\\s+[\\s\\S]{0,40}(related|interested|affiliate)"
      - "(?i)одобрени[ея]\\s+[\\s\\S]{0,40}(совет[оа]?\\s+директор|собрани[яем]\\s+участник)[\\s\\S]{0,40}(аффилированн|заинтересован)"
      - "(?i)(related|interested)\\s+party\\s+transaction\\s+[\\s\\S]{0,40}approv"
      - "(?i)заинтересованн[а-я]+\\s+сделк[аи]\\s+[\\s\\S]{0,40}одобрен"
      - "(?i)independent\\s+director\\s+approval"

    medium:
      # Антикоррупция — термины
      - "(?i)bribe"
      - "(?i)bribery"
      - "(?i)kickback"
      - "(?i)corrupt\\s+(payment|practice)"
      - "(?i)взятк[аи]"
      - "(?i)откат[ыа]?"
      - "(?i)коррупц[ия]"

      # Подарки и hospitality
      - "(?i)gift[s]?\\s+(and\\s+)?hospitalit(y|ies)"
      - "(?i)подарк[иов]\\s+(и\\s+)?гостеприимств"
      - "(?i)improper\\s+(gift|payment|benefit)"
      - "(?i)facilitation\\s+payment"

      # Код этики / политики
      - "(?i)code\\s+of\\s+conduct"
      - "(?i)code\\s+of\\s+ethics"
      - "(?i)кодекс\\s+(этик|поведени)"
      - "(?i)compliance\\s+polic(y|ies)"
      - "(?i)антикоррупционн[а-я]+\\s+политик"
      - "(?i)anti[-\\s]?corruption\\s+polic(y|ies)"

      # Whistleblowing
      - "(?i)whistleblow(ing|er)"
      - "(?i)hotline"
      - "(?i)горяч[а-я]+\\s+лини[яи]"
      - "(?i)report(ing)?\\s+(suspected\\s+)?violation"
      - "(?i)сообщ[а-я]+\\s+о\\s+нарушени[яих]"

      # Related party / affiliate transactions
      - "(?i)related\\s+party\\s+transaction"
      - "(?i)affiliate\\s+transaction"
      - "(?i)interested\\s+party\\s+transaction"
      - "(?i)сделк[аи]\\s+с\\s+аффилированн"
      - "(?i)сделк[аи]\\s+с\\s+заинтересованност"
      - "(?i)заинтересованн[а-я]+\\s+сделк"

      # Раскрытие
      - "(?i)disclos(e|ure)\\s+[\\s\\S]{0,30}(related|affiliate|interested)"
      - "(?i)раскры[тв][а-я]+\\s+[\\s\\S]{0,30}(аффилированн|заинтересован)"

    low:
      - "(?i)anti[-\\s]?corruption"
      - "(?i)anti[-\\s]?bribery"
      - "(?i)FCPA"
      - "(?i)UK\\s+Bribery\\s+Act"
      - "(?i)code\\s+of\\s+conduct"
      - "(?i)whistleblow"
      - "(?i)related\\s+party\\s+transaction"
      - "(?i)arm['']?s[-\\s]?length"
      - "(?i)антикоррупц"
      - "(?i)кодекс\\s+этик"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 640

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  context_k: 5
  max_chunks: 10

  retrieval_query: >
    антикоррупция взятки FCPA кодекс этики комплаенс аудит whistleblowing 
    сделки с аффилированными лицами arm's length заинтересованные сделки

  boost_keywords:
    - "anti-corruption"
    - "anti-bribery"
    - "FCPA"
    - "UK Bribery Act"
    - "bribe"
    - "kickback"
    - "взятка"
    - "откат"
    - "антикоррупционный"
    - "code of conduct"
    - "code of ethics"
    - "кодекс этики"
    - "compliance policy"
    - "антикоррупционная политика"
    - "audit rights"
    - "право на аудит"
    - "whistleblowing"
    - "hotline"
    - "related party transaction"
    - "affiliate transaction"
    - "заинтересованная сделка"
    - "сделка с аффилированными лицами"
    - "arm's length"
    - "на рыночных условиях"
    - "board approval"
    - "одобрение совета директоров"

  negative_keywords:
    - "коммерческая тайна"
    - "форс-мажор"
    - "условия оплаты"
    - "интеллектуальная собственность"

  preferred_unit_types:
    - "general_provision"
    - "obligation"

  excluded_unit_types:
    - "technical_fragment"
    - "appendix_reference"
    - "structural_anchor"

  preferred_clause_functions:
    - "representations"
    - "obligations"
    - "procedures"

  position_bias:
    preferred_range: [0.0, 1.0]
    boost: 0.10
    scope: "segment"

  rerank: true
  filters: {}

conditional: null

enrichment_hints:
  preferred_segment_types:
    - "contract"
    - "annex"
    - "appendix"
    - "amendment"
  excluded_segment_types:
    - "technical_specification"
    - "price_list"
    - "invoice"
    - "act"
    - "schedule"
  confidence_bonus_on_match: 0.08
  confidence_penalty_on_excluded_segment: 0.15

extraction:
  enabled: true
  mode: "hybrid"
  llm_max_tokens: 1050

  llm_prompt_extraction: |
    <role>
    Ты — юрист по комплаенсу и корпоративному праву.
    Твоя задача — точно извлечь из текста:
    1) наличие антикоррупционных положений;
    2) ссылки на кодексы этики и политики;
    3) права аудита комплаенса;
    4) механизмы whistleblowing;
    5) регулирование сделок с аффилированными лицами.

    Не считай достаточным общие фразы "соблюдать применимое
    законотельство" без конкретики по антикоррупции.
    </role>

    <context>
    Ниже приведены релевантные фрагменты договора:

    {context}
    </context>

    <task>
    Заполни только следующие поля:
    - anti_corruption_display
    - has_anti_corruption_clauses
    - has_code_of_conduct_reference
    - has_audit_rights
    - has_whistleblowing_mechanism
    - has_related_party_regulation
    - requires_arms_length
    - requires_corporate_approvals
    - reason

    Важно:
    - пиши коротко и по-русски.
    </task>

    <instructions>
    Шаг 1 — АНТИКОРРУПЦИОННЫЕ ПОЛОЖЕНИЯ

    Заполни "has_anti_corruption_clauses".

    Значения:
    - "yes" — явные антикоррупционные нормы:
      прямые запреты взяток, откатов, коррупционных платежей;
      ссылки на FCPA, UK Bribery Act, ФЗ-273;
      representations о соблюдении с конкретикой.
    - "no" — нет.
    - "unclear" — только декларативные формулировки
      "соблюдать законодательство" без конкретики.

    Шаг 2 — КОДЕКСЫ ЭТИКИ И ПОЛИТИКИ

    Заполни "has_code_of_conduct_reference".

    Значения:
    - "yes" — упоминается code of conduct / code of ethics /
      антикоррупционная политика с обязательством соблюдения.
    - "no" — нет.
    - "unclear" — неясно.

    Шаг 3 — ПРАВА АУДИТА КОМПЛАЕНСА

    Заполни "has_audit_rights".

    Значения:
    - "yes" — явное право проводить аудит соблюдения
      антикоррупционных требований / инспектировать документы.
    - "no" — нет.
    - "unclear" — неясно.

    Шаг 4 — WHISTLEBLOWING

    Заполни "has_whistleblowing_mechanism".

    Значения:
    - "yes" — есть: hotline, механизм сообщения о нарушениях,
      защита информаторов.
    - "no" — нет.
    - "unclear" — неясно.

    Шаг 5 — РЕГУЛИРОВАНИЕ RELATED PARTY TRANSACTIONS

    Заполни "has_related_party_regulation".

    Значения:
    - "yes" — специальные правила: disclosure, ограничения,
      запреты для related party / affiliate / interested party.
    - "no" — нет.
    - "unclear" — неясно.

    Шаг 6 — ТРЕБОВАНИЕ ARM'S LENGTH

    Заполни "requires_arms_length".

    Значения:
    - "yes" — сделки с аффилированными лицами должны быть
      на рыночных условиях (arm's length, fair market value).
    - "no" — нет.
    - "unclear" — неясно.

    Шаг 7 — КОРПОРАТИВНЫЕ ОДОБРЕНИЯ ДЛЯ RPT

    Заполни "requires_corporate_approvals".

    Значения:
    - "yes" — требуется одобрение СД / ОСА / независимых
      директоров для related party transactions.
    - "no" — нет.
    - "unclear" — неясно.

    Шаг 8 — НОРМАЛИЗОВАННЫЙ DISPLAY ДЛЯ DD GRID

    Заполни "anti_corruption_display".

    Это не свободное summary.
    Строй display по следующей логике:

    Базовый случай:
    - все поля unclear:
      "Не удалось определить антикоррупционный комплаенс"

    Если данные есть — комбинируй через ";":
    - has_anti_corruption_clauses (yes: "Антикоррупционные положения"; no: "Нет")
    - has_code_of_conduct_reference (если "yes": "код этики")
    - has_audit_rights (если "yes": "аудит")
    - has_related_party_regulation (если "no": "нет контроля RPT")

    Примеры:
    - "Антикоррупционные положения (FCPA / UK Bribery Act); код этики; аудит; RPT на рыночных условиях"
    - "Декларативные положения; нет аудита; нет контроля RPT"
    - "Антикоррупционных положений нет; нет контроля аффилированных сделок"
    - "Не удалось определить антикоррупционный комплаенс"

    Ограничение: не более 4 фактов через ";".

    Шаг 9 — КРАТКОЕ ОБОСНОВАНИЕ

    Заполни "reason".

    Правила:
    - 1–2 коротких предложения.
    - Укажи: ключевые положения, ссылки на законы, аудит,
      RPT regulation.
    - Приведи цитату в кавычках.
    </instructions>

    <edge_cases>
    - "Компания соблюдает законодательство" без конкретики:
      * has_anti_corruption_clauses = "unclear"

    - Anti-bribery + FCPA + code of conduct + audit + whistleblowing:
      * has_anti_corruption_clauses = "yes"

    - Нет RPT-регулирования при групповой структуре:
      * has_related_party_regulation = "no"

    - Нет релевантных фрагментов:
      * все поля = "unclear"
      * anti_corruption_display =
        "Не удалось определить антикоррупционный комплаенс"
    </edge_cases>

    <output_expectations>
    Все значения коротко и по-русски.
    Не добавляй никаких полей, кроме указанных в схеме extraction.
    </output_expectations>

  fields:
    - name: "anti_corruption_display"
      type: "string"
      presentation: "fact"
      label: "Антикоррупция и related party"
      description: "Нормализованный user-facing вывод для DD Grid"

    - name: "has_anti_corruption_clauses"
      type: "string"
      presentation: "signal"
      description: "Антикоррупционные положения"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "has_code_of_conduct_reference"
      type: "string"
      presentation: "signal"
      description: "Код этики / антикоррупционная политика"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "has_audit_rights"
      type: "string"
      presentation: "signal"
      description: "Права аудита комплаенса"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "has_whistleblowing_mechanism"
      type: "string"
      presentation: "signal"
      description: "Механизм whistleblowing"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "has_related_party_regulation"
      type: "string"
      presentation: "signal"
      description: "Регулирование related party transactions"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "requires_arms_length"
      type: "string"
      presentation: "signal"
      description: "Требование arm's length для RPT"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "requires_corporate_approvals"
      type: "string"
      presentation: "signal"
      description: "Корпоративные одобрения для RPT"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "reason"
      type: "string"
      presentation: "diagnostic"
      description: "Обоснование"

  store_payload: true


  