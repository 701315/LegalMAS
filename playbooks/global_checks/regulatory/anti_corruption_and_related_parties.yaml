id: "anti_corruption_and_related_parties"
name: "Антикоррупция и сделки с аффилированными лицами"
description: >
  Анализирует антикоррупционные положения (запрет взяток, откатов,
  неподобающих подарков/hospitality, ссылки на FCPA/UK Bribery Act,
  кодексы этики, права аудита, whistleblowing) и регулирование сделок
  с аффилированными лицами (раскрытие, arm's length, корпоративные
  одобрения). Оценивает комплаенс-зрелость и риски конфликтов интересов.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"

rules:
  keyword_mode: any

  keywords:
    high:
      # Прямые антикоррупционные запреты
      - "(?i)anti[-\\s]?corruption"
      - "(?i)anti[-\\s]?bribery"
      - "(?i)запрет[\\s\\S]{0,20}(взяток|взятки|откатов|откат)"
      - "(?i)prohibit[\\s\\S]{0,20}(bribe|bribery|kickback|corrupt)"
      - "(?i)shall\\s+not\\s+[\\s\\S]{0,30}(bribe|kickback|corrupt\\s+payment)"
      - "(?i)не\\s+(допуска[ею]т|вправе)[\\s\\S]{0,30}(взятк|откат|коррупц)"

      # Ссылки на законы
      - "(?i)FCPA"
      - "(?i)Foreign\\s+Corrupt\\s+Practices\\s+Act"
      - "(?i)UK\\s+Bribery\\s+Act"
      - "(?i)Bribery\\s+Act\\s+2010"
      - "(?i)антикоррупционн[а-я]+\\s+законодательств"
      - "(?i)ФЗ[-\\s]*(о\\s+)?противодействи[ия]\\s+коррупц"
      - "(?i)273[-\\s]?ФЗ"

      # Код этики с обязательством соблюдения
      - "(?i)code\\s+of\\s+(conduct|ethics)\\s+[\\s\\S]{0,40}(comply|adhere|bound)"
      - "(?i)обязу[ею]тся\\s+соблюдать\\s+[\\s\\S]{0,30}кодекс\\s+(этик|поведени)"
      - "(?i)ethics\\s+(&|and)\\s+compliance\\s+polic(y|ies)"

      # Права аудита комплаенса
      - "(?i)audit\\s+rights?\\s+[\\s\\S]{0,40}(compliance|anti[-\\s]?corruption)"
      - "(?i)право\\s+(на\\s+)?аудит[\\s\\S]{0,40}(комплаенс|антикоррупц)"
      - "(?i)inspection\\s+rights?\\s+[\\s\\S]{0,40}(records|compliance)"
      - "(?i)право\\s+провер[кяи][\\s\\S]{0,40}(соблюдени|комплаенс)"

      # Related party — arm's length
      - "(?i)arm['']?s[-\\s]?length\\s+(terms?|basis|conditions?|pricing)"
      - "(?i)на\\s+рыночн[а-я]+\\s+условиях"
      - "(?i)по\\s+рыночн[а-я]+\\s+цен[аы]"
      - "(?i)fair\\s+market\\s+(value|terms|conditions)"

      # Корпоративные одобрения заинтересованных сделок
      - "(?i)board\\s+(of\\s+directors\\s+)?approval\\s+[\\s\\S]{0,40}(related|interested|affiliate)"
      - "(?i)одобрени[ея]\\s+[\\s\\S]{0,40}(совет[оа]?\\s+директор|собрани[яем]\\s+участник)"
      - "(?i)(related|interested)\\s+party\\s+transaction\\s+[\\s\\S]{0,40}approv"
      - "(?i)заинтересованн[а-я]+\\s+сделк[аи]\\s+[\\s\\S]{0,40}одобрен"
      - "(?i)independent\\s+director\\s+approval"

    medium:
      # Антикоррупция — общие термины
      - "(?i)bribe"
      - "(?i)bribery"
      - "(?i)kickback"
      - "(?i)corrupt\\s+(payment|practice)"
      - "(?i)взятк[аи]"
      - "(?i)откат[ыа]?"
      - "(?i)коррупц[ия]"
      - "(?i)corruption"

      # Подарки и hospitality
      - "(?i)gift[s]?\\s+(and\\s+)?hospitalit(y|ies)"
      - "(?i)подарк[иов]\\s+(и\\s+)?гостеприимств"
      - "(?i)improper\\s+(gift|payment|benefit)"
      - "(?i)facilitation\\s+payment"
      - "(?i)grease\\s+payment"

      # Код этики / политики
      - "(?i)code\\s+of\\s+conduct"
      - "(?i)code\\s+of\\s+ethics"
      - "(?i)кодекс\\s+(этик|поведени)"
      - "(?i)compliance\\s+polic(y|ies)"
      - "(?i)антикоррупционн[а-я]+\\s+политик"
      - "(?i)anti[-\\s]?corruption\\s+polic(y|ies)"

      # Whistleblowing
      - "(?i)whistleblow(ing|er)"
      - "(?i)сообщ[а-я]+\\s+о\\s+нарушени[яих]"
      - "(?i)hotline"
      - "(?i)горяч[а-я]+\\s+лини[яи]"
      - "(?i)report(ing)?\\s+(suspected\\s+)?violation"

      # Related party / affiliate transactions
      - "(?i)related\\s+party\\s+transaction"
      - "(?i)affiliate\\s+transaction"
      - "(?i)interested\\s+party\\s+transaction"
      - "(?i)сделк[аи]\\s+с\\s+аффилированн"
      - "(?i)сделк[аи]\\s+с\\s+заинтересованност"
      - "(?i)заинтересованн[а-я]+\\s+сделк"

      # Раскрытие / disclosure
      - "(?i)disclos(e|ure)\\s+[\\s\\S]{0,30}(related|affiliate|interested)"
      - "(?i)раскры[тв][а-я]+\\s+[\\s\\S]{0,30}(аффилированн|заинтересован)"

    low:
      # Общие compliance-термины
      - "(?i)compliance"
      - "(?i)комплаенс"
      - "(?i)соблюдени[ея]\\s+(применим[а-я]+\\s+)?законодательств"
      - "(?i)applicable\\s+law"
      - "(?i)применим[оеа]+\\s+законодательств"

      # Общие ссылки на аффилированность
      - "(?i)affiliate"
      - "(?i)related\\s+party"
      - "(?i)аффилированн[а-я]+\\s+лиц"
      - "(?i)связанн[а-я]+\\s+сторон"

      # Общие ссылки на одобрения
      - "(?i)approval"
      - "(?i)одобрени[ея]"
      - "(?i)consent"
      - "(?i)согласи[ея]"

      # Общие ссылки на аудит/проверки
      - "(?i)audit"
      - "(?i)аудит"
      - "(?i)inspection"
      - "(?i)проверк[аи]"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 640

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  context_k: 5
  max_chunks: 10
  boost_keywords:
    - "anti-corruption"
    - "anti-bribery"
    - "FCPA"
    - "UK Bribery Act"
    - "bribe"
    - "kickback"
    - "взятка"
    - "откат"
    - "антикоррупционный"
    - "code of conduct"
    - "code of ethics"
    - "кодекс этики"
    - "compliance policy"
    - "audit rights"
    - "право на аудит"
    - "whistleblowing"
    - "related party transaction"
    - "affiliate transaction"
    - "заинтересованная сделка"
    - "сделка с аффилированными лицами"
    - "arm's length"
    - "на рыночных условиях"
    - "board approval"
    - "одобрение совета директоров"
  rerank: true
  filters: {}

conditional: null

extraction:
  llm_prompt_extraction: |
    <role>
    Ты — юрист по комплаенсу и корпоративному праву.
    Твоя специализация — антикоррупционные политики (FCPA, UK Bribery Act,
    российское антикоррупционное законодательство), кодексы этики,
    корпоративное управление и контроль сделок с аффилированными лицами
    (related party transactions).
    </role>

    <context>
    Ниже приведены фрагменты договора и/или политик с возможными
    антикоррупционными положениями и регулированием сделок
    с аффилированными лицами:

    {context}
    </context>

    <instructions>
    Проведи анализ по шагам. Каждый шаг логически соответствует одному
    или нескольким полям итоговой оценки риска.

    Шаг 1 — НАЛИЧИЕ АНТИКОРРУПЦИОННЫХ ПОЛОЖЕНИЙ
    (используется для заполнения поля "has_anti_corruption_clauses"):
    - Определи, есть ли в тексте специальные антикоррупционные нормы:
      * прямые запреты взяток, откатов, коррупционных платежей,
        неподобающих подарков и hospitality;
      * запрет facilitation/grease payments;
      * запрет платежей госслужащим/чиновникам вне рамок закона;
      * ссылки на FCPA, UK Bribery Act, ФЗ-273 и аналогичные законы;
      * representations/warranties о соблюдении антикоррупционного
        законодательства.
    - Не считай достаточным общие фразы "соблюдать применимое
      законодательство" без конкретики по антикоррупции.
    - Если специальные антикоррупционные нормы явно есть — вывод "yes".
    - Если их нет — вывод "no".
    - Если формулировки общие/декларативные — вывод "unclear".

    Шаг 2 — КОДЕКСЫ ЭТИКИ И ПОЛИТИКИ
    (используется для заполнения поля "has_code_of_conduct_reference"):
    - Определи, упоминаются ли:
      * code of conduct / code of ethics;
      * ethics & compliance policy;
      * антикоррупционная политика группы / компании;
      * обязательство контрагента соблюдать политики Target
        (или наоборот).
    - Если такие ссылки есть — вывод "yes".
    - Если нет — вывод "no".
    - Если неясно — вывод "unclear".

    Шаг 3 — ПРАВА НА АУДИТ И ПРОВЕРКИ КОМПЛАЕНСА
    (используется для заполнения поля "has_audit_rights"):
    - Определи, предоставляют ли положения:
      * право одной из сторон проводить аудит соблюдения
        антикоррупционных требований;
      * право инспектировать документы, записи, требовать
        отчётности или сертификатов комплаенса;
      * право привлекать третьих лиц для проверки.
    - Если такие права явно прописаны — вывод "yes".
    - Если нет — вывод "no".
    - Если неясно — вывод "unclear".

    Шаг 4 — WHISTLEBLOWING / СООБЩЕНИЕ О НАРУШЕНИЯХ
    (используется для заполнения поля "has_whistleblowing_mechanism"):
    - Определи, упоминаются ли:
      * механизмы сообщения о нарушениях (hotline, горячая линия);
      * защита информаторов (whistleblower protection);
      * обязанность сообщать о подозрительных действиях.
    - Если такие механизмы есть — вывод "yes".
    - Если нет — вывод "no".
    - Если неясно — вывод "unclear".

    Шаг 5 — РЕГУЛИРОВАНИЕ СДЕЛОК С АФФИЛИРОВАННЫМИ ЛИЦАМИ
    (используется для заполнения поля "has_related_party_regulation"):
    - Определи, есть ли специальные правила для:
      * related party / affiliate / interested party transactions;
      * раскрытия таких сделок (disclosure requirements);
      * ограничений или запретов на определённые виды сделок
        с аффилированными лицами.
    - Если такое регулирование есть — вывод "yes".
    - Если нет — вывод "no".
    - Если неясно — вывод "unclear".

    Шаг 6 — ТРЕБОВАНИЯ ARM'S LENGTH
    (используется для заполнения поля "requires_arms_length"):
    - Определи, есть ли прямые требования, что сделки
      с аффилированными лицами должны заключаться:
      * на рыночных условиях (arm's length, on market terms,
        fair market value);
      * с применением рыночного ценообразования.
    - Если такие требования есть — вывод "yes".
    - Если нет — вывод "no".
    - Если неясно — вывод "unclear".

    Шаг 7 — КОРПОРАТИВНЫЕ ОДОБРЕНИЯ
    (используется для заполнения поля "requires_corporate_approvals"):
    - Определи, упоминается ли необходимость:
      * одобрения органами управления (board of directors,
        совет директоров, собрание участников/акционеров);
      * одобрения независимыми директорами;
      * следования корпоративным процедурам согласования
        related party / interested party transactions.
    - Если такие требования есть — вывод "yes".
    - Если нет — вывод "no".
    - Если неясно — вывод "unclear".

    Шаг 8 — RED FLAGS
    (используется для заполнения поля "red_flags"):
    - Оцени наличие следующих рисковых факторов:

      * «COMPL1» — Слабые или отсутствующие антикоррупционные
        положения при очевидном комплаенс-риск профиле. Признаки:
        - has_anti_corruption_clauses = "no" или "unclear";
        - нет ссылок на FCPA/UK Bribery Act/ФЗ-273;
        - нет конкретных запретов взяток/откатов;
        - нет прав аудита комплаенса;
        - при этом контекст предполагает взаимодействие с госсектором,
          международные операции или высокорисковые юрисдикции.

      * «COMPL2» — Отсутствие контроля за сделками с аффилированными
        лицами. Признаки:
        - has_related_party_regulation = "no";
        - requires_arms_length = "no";
        - requires_corporate_approvals = "no";
        - при этом контекст предполагает наличие аффилированных лиц
          или групповую структуру.

      * «COMPL3» — Формальные/декларативные антикоррупционные
        положения без механизмов контроля. Признаки:
        - есть общие representations "соблюдаем законодательство",
          но нет конкретных запретов, прав аудита, code of conduct;
        - has_anti_corruption_clauses = "unclear" при отсутствии
          has_audit_rights = "yes" и has_code_of_conduct_reference = "yes".

    - Если антикоррупционные положения развёрнутые (конкретные
      запреты, ссылки на законы, права аудита, code of conduct)
      И сделки с аффилированными лицами регулируются (disclosure,
      arm's length, approvals) — верни "NONE".
    - Если данных недостаточно для оценки или текст противоречив —
      верни "UNCLEAR".
    - Формат: один или несколько кодов через запятую
      ("COMPL1", "COMPL2", "COMPL1, COMPL2, COMPL3"),
      "NONE" или "UNCLEAR".
      Без комментариев в этом поле — всё объясняющее в reason.

    Шаг 9 — ОБОСНОВАНИЕ
    (используется для заполнения поля "reason"):

    - В "reason" кратко обоснуй вывод:
      * ссылайся на ключевые формулировки (по возможности
        с короткими цитатами);
      * поясни, как структура положений влияет на комплаенс-риски
        и риски конфликтов интересов для Target;
      * если выставлены red_flags — объясни, почему именно эти коды.
    </instructions>

    <edge_cases>
    Обрабатывай пограничные ситуации так:

    - Антикоррупционные положения минимальны или декларативны
      (общие фразы "соблюдать применимое законодательство"
      без конкретики по взяткам/откатам):
      has_anti_corruption_clauses = "unclear";
      фиксируй как фактор повышения риска; рассматривай COMPL3.

    - Есть развитый anti-bribery раздел, ссылка на FCPA/UK Bribery Act,
      code of conduct, права аудита, whistleblowing hotline:
      воспринимай как сильную комплаенс-конфигурацию;
      has_anti_corruption_clauses = "yes", has_code_of_conduct_reference = "yes",
      has_audit_rights = "yes", has_whistleblowing_mechanism = "yes";
      overall_risk_level может быть "low" при адекватном
      регулировании related party transactions.

    - По сделкам с аффилированными лицами нет упоминаний раскрытия,
      arm's length, корпоративных одобрений:
      has_related_party_regulation = "no", requires_arms_length = "no",
      requires_corporate_approvals = "no";
      ставь COMPL2, особенно если контекст предполагает
      групповую структуру или известных аффилированных лиц.

    - Есть только representations "Сторона соблюдает
      антикоррупционное законодательство", но нет механизмов
      аудита/контроля/конкретных запретов:
      has_anti_corruption_clauses = "unclear";
      has_audit_rights = "no";
      рассматривай COMPL3.

    - Договор содержит обязательства по compliance для Target,
      но не для контрагента (односторонние):
      отрази этот дисбаланс в reason; это может влиять на
      overall_risk_level.

    - Code of conduct упомянут, но не приложен и не детализирован:
      has_code_of_conduct_reference = "yes", но отметь в reason,
      что содержание политики неизвестно.

    - Пустые или явно нерелевантные фрагменты:
      укажи, что данных недостаточно для анализа антикоррупционных
      положений и регулирования сделок с аффилированными лицами.
      Поставь все поля в "unclear", red_flags = "UNCLEAR",
      overall_risk_level = "medium".
    </edge_cases>

    <output_expectations>
    На основе твоего анализа отдельный механизм извлечения сформирует
    структурированные поля по заранее заданной схеме. Твоя задача —
    давать чёткие юридические выводы и указывать конкретные формулировки
    из текста, на которых они основаны. Не генерируй JSON —
    просто излагай выводы структурированно и однозначно.
    </output_expectations>

  enabled: true
  mode: "hybrid"
  fields:
    - name: "has_anti_corruption_clauses"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "has_code_of_conduct_reference"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "has_audit_rights"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "has_whistleblowing_mechanism"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "has_related_party_regulation"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "requires_arms_length"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "requires_corporate_approvals"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "red_flags"
      type: "string"

    - name: "reason"
      type: "string"

  store_payload: true

red_flags:
  items:
    - code: "COMPL1"
      description: "Слабые или отсутствующие антикоррупционные положения."
    - code: "COMPL2"
      description: "Отсутствие контроля за сделками с аффилированными лицами."
    - code: "COMPL3"
      description: "Формальные антикоррупционные положения без механизмов контроля."