id: "anti_corruption_and_related_parties"
name: "Антикоррупция и сделки с аффилированными лицами"
description: >
  Анализирует антикоррупционные положения (запрет взяток, откатов, подарков,
  кодексы этики, права аудита) и регулирование сделок с аффилированными лицами,
  включая требования arm's length и корпоративные одобрения.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"

rules:
  keywords:
    - "антикоррупция"
    - "anti-corruption"
    - "anti-bribery"
    - "взятка"
    - "bribe"
    - "kickback"
    - "откат"
    - "подарки"
    - "hospitality"
    - "кодекс этики"
    - "code of conduct"
    - "право на аудит"
    - "audit rights"
    - "сообщать о нарушениях"
    - "whistleblowing"
    - "аффилированные лица"
    - "related party"
    - "affiliate"
    - "arm's length"
    - "заинтересованная сделка"
    - "interested party transaction"
    - "corporate approval"
    - "одобрение"
  keyword_mode: "any"
  regex_patterns: []
  clause_patterns: []

llm:
  prompt_template: |
    <role>
    Ты — юрист по комплаенсу и корпоративному праву.
    Твоя специализация — антикоррупционные политики, корпоративное управление
    и контроль сделок с аффилированными лицами.
    </role>

    <context>
    Ниже приведены фрагменты договора и/или политик, где могут упоминаться
    антикоррупционные положения и сделки с аффилированными лицами:

    {context}
    </context>

    <instructions>
    Проведи анализ по шагам. Каждый шаг логически связан с одним или
    несколькими полями итоговой оценки.

    Шаг 1 — АНТИКОРРУПЦИОННЫЕ ПОЛОЖЕНИЯ
    (используется для "has_anti_corruption_clauses"):
    - Определи, есть ли в тексте:
      * прямые запреты взяток, откатов, незаконных платежей, неподобающих подарков и hospitality;
      * запрет оплат в пользу госслужащих/чиновников вне рамок закона;
      * ссылки на anti-corruption / anti-bribery законы (FCPA, UK Bribery Act и др.).
    - Сформулируй вывод: yes / no / unclear, опираясь на наличие именно специальных
      антикоррупционных норм, а не только общих фраз о соблюдении закона.

    Шаг 2 — КОДЕКСЫ И ПОЛИТИКИ
    (используется для "has_code_of_conduct_or_policy_reference"):
    - Проверь, упоминаются ли:
      * code of conduct, ethics & compliance policy, антикоррупционная политика группы;
      * внутренние регламенты и обязательство контрагента соблюдать такие политики
        (свои или Target).
    - Сделай вывод: yes / no / unclear.

    Шаг 3 — ПРАВА НА АУДИТ И ПРОВЕРКИ
    (используется для "has_audit_or_inspection_rights"):
    - Определи, предоставляют ли положения:
      * право одной из сторон (обычно покупателя/инвестора) проводить аудит,
        проверки соблюдения антикоррупционных требований;
      * право инспектировать документы и записи, требовать отчётности или
        сертификатов комплаенса.
    - Зафиксируй наличие таких прав как yes / no / unclear.

    Шаг 4 — РЕГУЛИРОВАНИЕ СДЕЛОК С АФФИЛИРОВАННЫМИ ЛИЦАМИ
    (используется для "has_related_party_transactions_regulation"):
    - Оцени, есть ли специальные правила для:
      * related party / affiliate / interested party transactions;
      * раскрытия таких сделок и ограничений на их заключение.
    - Сделай вывод: yes / no / unclear.

    Шаг 5 — ТРЕБОВАНИЯ ARM'S LENGTH
    (используется для "requires_arms_length_terms_for_related_parties"):
    - Определи, есть ли прямые требования, что сделки с аффилированными лицами
      должны заключаться:
      * на рыночных условиях (arm's length, on market terms и т.п.).
    - Зафиксируй наличие/отсутствие таких требований как yes / no / unclear.

    Шаг 6 — КОРПОРАТИВНЫЕ ОДОБРЕНИЯ
    (используется для "requires_corporate_approvals_for_interested_transactions"):
    - Выяви, упоминается ли необходимость:
      * одобрения органами управления (совет директоров, собрание участников,
        независимые директора) для крупных или заинтересованных сделок;
      * следования корпоративным процедурам согласования related party transactions.
    - Сформулируй вывод: yes / no / unclear.

    Шаг 7 — ОБЩИЙ КОМПЛАЕНС-РИСК ДЛЯ TARGET
    (используется для "overall_risk_level" и "reason"):
    - Оцени общий риск, учитывая:
      * наличие/отсутствие развернутых антикоррупционных норм;
      * ссылки на кодексы/политики и права на аудит;
      * наличие или отсутствие контроля за сделками с аффилированными лицами,
        требований arm's length и корпоративных одобрений.
    - Сформулируй общий уровень риска как low / medium / high.
    - В "reason" кратко обоснуй вывод, ссылаясь на ключевые формулировки
      (желательно с короткими цитатами) и пояснив, как структура положений
      влияет на комплаенс‑риски и риски конфликтов интересов для Target.
    </instructions>

    <edge_cases>
    Обрабатывай пограничные ситуации так:

    - Антикоррупционные положения минимальны или декларативны
      (общие фразы "Стороны обязуются соблюдать применимое законодательство")
      без конкретики по взяткам/откатам:
      фиксируй неопределённость по специализированным anti-corruption нормам
      и учитывай это как фактор повышения риска.

    - Текст содержит развитый anti-bribery раздел, ссылку на code of conduct,
      права аудита и обязанность уведомлять о нарушениях:
      воспринимай это как сильную комплаенс-конфигурацию, снижающую риск,
      при условии разумного контроля за related party transactions.

    - По сделкам с аффилированными лицами нет упоминаний раскрытия, arm's length
      или корпоративных одобрений:
      отражай отсутствие такого регулирования как фактор повышенного риска,
      особенно при высоком риске конфликтов интересов.

    - Есть только заверения "Сторона соблюдает антикоррупционное законодательство",
      но нет механизмов аудита/контроля:
      учитывай наличие заверений, но флаги по audit/code-of-conduct ставь только
      по прямым формулировкам.

    - Пустые или явно нерелевантные фрагменты:
      укажи, что данных недостаточно для анализа антикоррупционных положений
      и регулирования сделок с аффилированными лицами, и поясни, как это
      влияет на неопределённость и оценку риска.
    </edge_cases>

    <output_expectations>
    На основе твоего анализа отдельный механизм извлечения сформирует
    структурированные поля по заранее заданной схеме. Твоя задача —
    давать чёткие юридические выводы и указывать конкретные формулировки
    из текста, на которых они основаны.
    </output_expectations>
  prompt_file: null
  context_k: 5
  temperature: 0.0
  max_tokens: 640

evidence:
  required: false
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  context_k: 5
  max_chunks: 10
  boost_keywords:
    - "anti-corruption"
    - "anti-bribery"
    - "кодекс этики"
    - "related party"
    - "заинтересованная сделка"
    - "arm's length"
  rerank: true
  filters: {}

conditional: null

extraction:
  enabled: true
  mode: "hybrid"
  fields:
    - name: "has_anti_corruption_clauses"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "has_code_of_conduct_or_policy_reference"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "has_audit_or_inspection_rights"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "has_related_party_transactions_regulation"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "requires_arms_length_terms_for_related_parties"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "requires_corporate_approvals_for_interested_transactions"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "overall_risk_level"
      type: "string"
      allowed_values:
        - "low"
        - "medium"
        - "high"

    - name: "reason"
      type: "string"

  store_payload: true

red_flags:
  items:
    - code: "REG5"
      description: "Слабые или отсутствующие антикоррупционные положения при высоком комплаенс-риск профиле."
    - code: "REG6"
      description: "Отсутствие контроля за сделками с аффилированными лицами и корпоративных одобрений."
