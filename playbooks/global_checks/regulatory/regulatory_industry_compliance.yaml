id: "regulatory_industry_compliance"
name: "Отраслевой комплаенс и регуляторные нарушения"
group: "Regulatory"
description: >
  Анализирует обязательства соблюдать отраслевые требования
  (финансы, медицина, телеком, энергетика, образование, защита
  данных и др.), наличие упоминаний о проверках, расследованиях,
  предписаниях, штрафах, заверения об отсутствии нарушений,
  а также статус remedial-мер.

  Формирует краткий user-facing вывод и оценивает уровень
  регуляторного риска для Target.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"
ui_mode: "field_extraction"

rules:
  keyword_mode: any

  keywords:
    high:
      # Конкретные регуляторные события
      - "(?i)enforcement\\s+action"
      - "(?i)regulatory\\s+(investigation|inquiry|proceeding)"
      - "(?i)регуляторн[а-я]+\\s+(расследовани[ея]|проверк[аи])"
      - "(?i)надзорн[а-я]+\\s+проверк[аи]"
      - "(?i)предписани[ея]\\s+(регулятор|надзорн)"
      - "(?i)(штраф|fine|penalty)\\s+[\\s\\S]{0,30}(регулятор|надзорн|authority)"
      - "(?i)administrative\\s+(fine|penalty|sanction)"
      - "(?i)административн[а-я]+\\s+(штраф|санкц[ия])"
      - "(?i)settlement\\s+(agreement|with)\\s+[\\s\\S]{0,30}(regulator|authority)"
      - "(?i)consent\\s+order"
      - "(?i)cease\\s+and\\s+desist"

      # Заверения о нарушениях
      - "(?i)no\\s+material\\s+violation"
      - "(?i)no\\s+pending\\s+(investigation|proceeding|enforcement)"
      - "(?i)no\\s+ongoing\\s+investigation"
      - "(?i)отсутстви[ея]\\s+существенн[а-я]+\\s+нарушени[йя]"
      - "(?i)нет\\s+текущих\\s+(расследовани[йя]|проверок)"

      # Конкретные регуляторы
      - "(?i)(ЦБ|Центральный\\s+банк|Банк\\s+России)"
      - "(?i)(SEC|FINRA|FCA|PRA|BaFin|CFTC)"
      - "(?i)(FDA|EMA|Росздравнадзор)"
      - "(?i)(FCC|Роскомнадзор|OFCOM)"
      - "(?i)(ФАС|Антимонопольн[а-я]+\\s+служб)"
      - "(?i)(EPA|Росприроднадзор)"
      - "(?i)(DOJ|Department\\s+of\\s+Justice)"

    medium:
      # Compliance-обязательства
      - "(?i)compliance\\s+with\\s+(all\\s+)?applicable\\s+(laws?|regulations?)"
      - "(?i)соответств[а-я]+\\s+(применим[а-я]+\\s+)?законодательств"
      - "(?i)regulatory\\s+requirements?"
      - "(?i)регуляторн[а-я]+\\s+требовани[яй]"
      - "(?i)отраслев[а-я]+\\s+требовани[яй]"

      # Лицензии и разрешения — регуляторный контекст
      - "(?i)licens(e|ing|ed)\\s+[\\s\\S]{0,30}(regulatory|authority)"
      - "(?i)лицензи[яию]\\s+[\\s\\S]{0,30}(регулятор|надзорн)"

      # Проверки и инспекции
      - "(?i)inspection[\\s\\S]{0,20}(regulator|authority|надзорн)"
      - "(?i)audit\\s+by\\s+[\\s\\S]{0,30}(regulator|authority)"
      - "(?i)регуляторн[а-я]+\\s+аудит"

      # Штрафы и penalties (общие)
      - "(?i)\\bfine[s]?\\b[\\s\\S]{0,20}(regulator|authority)"
      - "(?i)\\bpenalt(y|ies)\\b[\\s\\S]{0,20}(regulator|authority)"
      - "(?i)\\bштраф[ыа]?\\b[\\s\\S]{0,20}(регулятор|надзорн)"
      - "(?i)administrative\\s+liability"

      # Remedial
      - "(?i)remedial\\s+(action|measure|plan)"
      - "(?i)corrective\\s+(action|measure)"
      - "(?i)устранени[ея]\\s+нарушени[йя]"
      - "(?i)исправительн[а-я]+\\s+мер[ыа]"

    low:
      - "(?i)enforcement\\s+action"
      - "(?i)regulatory\\s+investigation"
      - "(?i)no\\s+material\\s+violation"
      - "(?i)no\\s+ongoing\\s+investigation"
      - "(?i)consent\\s+order"
      - "(?i)cease\\s+and\\s+desist"
      - "(?i)settlement\\s+with\\s+regulator"
      - "(?i)надзорная\\s+проверка"
      - "(?i)предписание\\s+регулятора"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 640

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  retrieval_profile: "warranties_check"
  context_k: 5
  max_chunks: 10

  retrieval_query: >
    регуляторные требования надзорная проверка расследование штраф предписание 
    соответствие законодательству отсутствие нарушений remedial action

  boost_keywords:
    - "compliance with applicable laws"
    - "regulatory requirements"
    - "соответствовать требованиям"
    - "отраслевые требования"
    - "enforcement action"
    - "regulatory investigation"
    - "регуляторное расследование"
    - "надзорная проверка"
    - "предписание"
    - "штраф"
    - "fine"
    - "penalty"
    - "no material violation"
    - "no ongoing investigation"
    - "отсутствие нарушений"
    - "remedial action"
    - "устранение нарушений"
    - "settlement agreement"
    - "consent order"
    - "ЦБ"
    - "SEC"
    - "FDA"
    - "ФАС"

  negative_keywords:
    - "интеллектуальная собственность"
    - "коммерческая тайна"
    - "форс-мажор"
    - "арбитраж"
    - "условия оплаты"

  preferred_unit_types:
    - "general_provision"
    - "obligation"

  excluded_unit_types:
    - "technical_fragment"
    - "appendix_reference"
    - "structural_anchor"

  preferred_clause_functions:
    - "representations"
    - "obligations"
    - "limitations"

  position_bias:
    preferred_range: [0.0, 1.0]
    boost: 0.10
    scope: "segment"

  rerank: true
  filters: {}

conditional: null

enrichment_hints:
  preferred_segment_types:
    - "contract"
    - "annex"
    - "appendix"
    - "amendment"
  excluded_segment_types:
    - "technical_specification"
    - "price_list"
    - "invoice"
    - "act"
  confidence_bonus_on_match: 0.08
  confidence_penalty_on_excluded_segment: 0.15

extraction:
  enabled: true
  mode: "hybrid"
  llm_max_tokens: 900

  llm_prompt_extraction: |
    <role>
    Ты — юрист по регуляторному и отраслевому комплаенсу.
    Твоя задача — точно извлечь из текста:
    1) наличие и характер compliance-обязательств;
    2) упоминания регуляторных событий (расследования, штрафы, проверки);
    3) заверения об отсутствии нарушений;
    4) наличие remedial-мер;
    5) отраслевую принадлежность.

    КРИТИЧЕСКИ ВАЖНО:
    - Извлекай ТОЛЬКО то, что прямо написано в тексте.
    - НЕ придумывай отрасли без явных данных.
    - НЕ считай общую фразу "compliance with applicable laws"
      отраслевым регулированием без специальной конкретики.
    - Если информация отсутствует — используй "none", "no",
      "none_mentioned" или "unclear" согласно allowed_values.
    - Если текст неоднозначен — используй "unclear".
    </role>

    <context>
    Ниже приведены релевантные фрагменты договора:

    {context}
    </context>

    <context_rules>
    - Некоторые фрагменты могут быть нерелевантны — игнорируй их.
    - Если фрагменты противоречат друг другу — используй "unclear"
      и кратко объясни это в reason.
    - Отрасль считай идентифицированной только если прямо есть
      указание на сферу деятельности, профильный регулятор
      или специальный отраслевой режим.
    - Если есть только общие compliance-обязательства без отрасли,
      это "general_only", а identified_industries = "Не применимо".
    - Не подменяй regulatory events обычными коммерческими спорами.
    </context_rules>

    <task>
    Заполни только следующие поля:
    - regulatory_compliance_display
    - has_compliance_obligations
    - identified_industries
    - mentions_regulatory_events
    - has_no_violations_representations
    - has_remedial_measures
    - reason
    </task>

    <instructions>
    Шаг 1 — ХАРАКТЕР COMPLIANCE-ОБЯЗАТЕЛЬСТВ

    Заполни "has_compliance_obligations".

    Значения:
    - "industry_specific" — есть специальные отраслевые требования:
      финансы, медицина / фарма, телеком, энергетика,
      образование, защита данных и т.п.
    - "general_only" — только общая обязанность соблюдать
      применимое законодательство без отраслевой конкретики.
    - "none" — compliance-обязательства не выявлены.
    - "unclear" — нельзя надёжно определить.

    Шаг 2 — ИДЕНТИФИКАЦИЯ ОТРАСЛЕЙ

    Заполни "identified_industries".

    Правила:
    - Кратко через ";", не более 3 отраслей:
      "финансы; медицина; защита данных"
    - Если отрасли не определены и обязательства только общие:
      "Не применимо"
    - Если отрасль нельзя определить:
      "Не определено"

    Шаг 3 — РЕГУЛЯТОРНЫЕ СОБЫТИЯ

    Заполни "mentions_regulatory_events".

    Значения:
    - "yes" — упоминаются проверки, расследования,
      предписания, штрафы, enforcement actions, settlement,
      consent orders и т.п.
    - "none_mentioned" — прямо указано их отсутствие.
    - "no" — события не упоминаются.
    - "unclear" — нельзя определить.

    Шаг 4 — ЗАВЕРЕНИЯ ОБ ОТСУТСТВИИ НАРУШЕНИЙ

    Заполни "has_no_violations_representations".

    Значения:
    - "yes" — есть формулы вроде no material violations,
      no ongoing/pending investigations, отсутствие существенных штрафов.
    - "no" — нет.
    - "unclear" — нельзя определить.

    Шаг 5 — REMEDIAL-МЕРЫ

    Заполни "has_remedial_measures".

    Значения:
    - "yes" — есть remedial actions, corrective measures,
      устранение нарушений, исполнение предписаний.
    - "no" — нет.
    - "unclear" — нельзя определить.

    Шаг 6 — НОРМАЛИЗОВАННЫЙ DISPLAY ДЛЯ DD GRID

    Заполни "regulatory_compliance_display".

    Это итоговое поле для таблицы.
    Строй его ТОЛЬКО на основе уже заполненных полей выше.
    Не добавляй информацию сверх них.

    Возможные состояния:
    1. Есть отраслевой контур:
       "Финансы; отраслевые требования; заверения об отсутствии нарушений"
    2. Только общий комплаенс:
       "Только общие compliance-обязательства"
    3. Есть регуляторные события:
       "Медицина; отраслевые требования; регуляторные события упомянуты"
    4. Нет данных:
       "Не удалось определить отраслевой комплаенс"

    Правила:
    - Если все поля unclear:
      "Не удалось определить отраслевой комплаенс"
    - Если has_compliance_obligations = "none"
      и mentions_regulatory_events in ["no", "none_mentioned"]
      и has_no_violations_representations = "no":
      "Отраслевой регуляторный контур не выявлен"
    - Если has_compliance_obligations = "general_only"
      и identified_industries = "Не применимо":
      "Только общие compliance-обязательства"
    - Иначе комбинируй через ";":
      * identified_industries, если это не "Не применимо"
        и не "Не определено"
      * "отраслевые требования", если has_compliance_obligations = "industry_specific"
      * "только общие compliance-обязательства", если has_compliance_obligations = "general_only"
      * "регуляторные события упомянуты", если mentions_regulatory_events = "yes"
      * "заверения об отсутствии нарушений", если has_no_violations_representations = "yes"
      * "remedial-меры", если has_remedial_measures = "yes"
    - Не более 4 коротких фактов через ";".

    Шаг 7 — КРАТКОЕ ОБОСНОВАНИЕ

    Заполни "reason".

    Правила:
    - Первое предложение — краткий вывод.
    - Второе — короткая цитата из текста (до 100 символов).
    - Пиши по-русски.
    </instructions>

    <edge_cases>
    - "Соблюдает применимое законодательство" без конкретики:
      * has_compliance_obligations = "general_only"
      * identified_industries = "Не применимо"

    - Расследования упомянуты, статус неясен, remedial нет:
      * mentions_regulatory_events = "yes"
      * has_remedial_measures = "no"

    - "No material violations" + "no ongoing investigations":
      * has_no_violations_representations = "yes"
      * mentions_regulatory_events = "none_mentioned"

    - Нет релевантных фрагментов:
      * все поля = "unclear"
      * identified_industries = "Не определено"
      * regulatory_compliance_display =
        "Не удалось определить отраслевой комплаенс"
    </edge_cases>

    <output_expectations>
    - Верни результат строго в формате JSON.
    - Не оборачивай ответ в markdown-блоки.
    - Не добавляй комментариев вне JSON.
    - Для полей с allowed_values используй строго значения из списка.
    - Свободные текстовые поля
      (regulatory_compliance_display, identified_industries, reason)
      заполняй на русском языке.
    - Не добавляй никаких полей, кроме указанных.

    Пример структуры ответа:
    {
      "regulatory_compliance_display": "Финансы; отраслевые требования; заверения об отсутствии нарушений",
      "has_compliance_obligations": "industry_specific",
      "identified_industries": "финансы",
      "mentions_regulatory_events": "none_mentioned",
      "has_no_violations_representations": "yes",
      "has_remedial_measures": "no",
      "reason": "..."
    }
    </output_expectations>

  fields:
    - name: "regulatory_compliance_display"
      type: "string"
      presentation: "fact"
      label: "Отраслевой комплаенс"
      description: "Нормализованный user-facing вывод для DD Grid"
      display_in_grid: true
      display_priority: 1

    - name: "has_compliance_obligations"
      type: "string"
      presentation: "signal"
      description: "Характер compliance-обязательств"
      allowed_values:
        - "industry_specific"
        - "general_only"
        - "none"
        - "unclear"
      display_in_grid: false

    - name: "identified_industries"
      type: "string"
      presentation: "fact"
      label: "Отрасли"
      description: "Идентифицированные отрасли регулирования"
      display_in_grid: true
      display_priority: 2

    - name: "mentions_regulatory_events"
      type: "string"
      presentation: "signal"
      description: "Упоминания регуляторных событий"
      allowed_values:
        - "yes"
        - "none_mentioned"
        - "no"
        - "unclear"
      display_in_grid: false

    - name: "has_no_violations_representations"
      type: "string"
      presentation: "signal"
      description: "Заверения об отсутствии нарушений"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
      display_in_grid: false

    - name: "has_remedial_measures"
      type: "string"
      presentation: "signal"
      description: "Наличие remedial-мер"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
      display_in_grid: false

    - name: "reason"
      type: "string"
      presentation: "diagnostic"
      description: "Обоснование"
      display_in_grid: false

  store_payload: true


  
