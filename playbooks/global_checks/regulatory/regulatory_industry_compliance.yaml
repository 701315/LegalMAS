id: "regulatory_industry_compliance"
name: "Отраслевой комплаенс и регуляторные нарушения"
description: >
  Анализирует обязательства соблюдать отраслевые требования (финансы,
  медицина, телеком, энергетика, образование, защита данных и др.),
  наличие упоминаний о проверках, расследованиях, предписаниях, штрафах,
  заверения об отсутствии нарушений, а также статус remedial-мер.
  Оценивает уровень регуляторного риска для Target.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"

rules:
  keyword_mode: any

  keywords:
    high:
      # Конкретные регуляторные события — расследования, штрафы
      - "(?i)enforcement\\s+action"
      - "(?i)regulatory\\s+(investigation|inquiry|proceeding)"
      - "(?i)регуляторн[а-я]+\\s+(расследовани[ея]|проверк[аи])"
      - "(?i)надзорн[а-я]+\\s+проверк[аи]"
      - "(?i)предписани[ея]\\s+(регулятор|надзорн)"
      - "(?i)(штраф|fine|penalty)\\s+[\\s\\S]{0,30}(регулятор|надзорн|authority)"
      - "(?i)administrative\\s+(fine|penalty|sanction)"
      - "(?i)административн[а-я]+\\s+(штраф|санкц[ия])"
      - "(?i)settlement\\s+(agreement|with)\\s+[\\s\\S]{0,30}(regulator|authority)"
      - "(?i)consent\\s+order"
      - "(?i)cease\\s+and\\s+desist"

      # Заверения о нарушениях
      - "(?i)no\\s+material\\s+violation"
      - "(?i)no\\s+pending\\s+(investigation|proceeding|enforcement)"
      - "(?i)no\\s+ongoing\\s+investigation"
      - "(?i)отсутстви[ея]\\s+существенн[а-я]+\\s+нарушени[йя]"
      - "(?i)нет\\s+текущих\\s+(расследовани[йя]|проверок)"

      # Конкретные отраслевые регуляторы
      - "(?i)(ЦБ|Центральный\\s+банк|Банк\\s+России)"
      - "(?i)(SEC|FINRA|FCA|PRA|BaFin|CFTC)"
      - "(?i)(FDA|EMA|Росздравнадзор)"
      - "(?i)(FCC|Роскомнадзор|OFCOM)"
      - "(?i)(ФАС|Антимонопольн[а-я]+\\s+служб)"
      - "(?i)(EPA|Росприроднадзор)"
      - "(?i)(DOJ|Department\\s+of\\s+Justice)"

    medium:
      # Общие compliance-обязательства
      - "(?i)compliance\\s+with\\s+(all\\s+)?applicable\\s+(laws?|regulations?)"
      - "(?i)соответств[а-я]+\\s+(применим[а-я]+\\s+)?законодательств"
      - "(?i)соблюд[а-я]+\\s+(все[хм]?\\s+)?применим[а-я]+\\s+требовани[яй]"
      - "(?i)regulatory\\s+requirements?"
      - "(?i)регуляторн[а-я]+\\s+требовани[яй]"
      - "(?i)отраслев[а-я]+\\s+требовани[яй]"

      # Лицензии и разрешения
      - "(?i)licens(e|ing|ed)\\s+[\\s\\S]{0,30}(regulatory|authority)"
      - "(?i)лицензи[яию]\\s+[\\s\\S]{0,30}(регулятор|надзорн)"
      - "(?i)permit[s]?\\s+[\\s\\S]{0,30}(regulatory|government)"
      - "(?i)разрешени[ея]\\s+[\\s\\S]{0,30}(регулятор|государств)"

      # Проверки и инспекции
      - "(?i)inspection"
      - "(?i)инспекци[яи]"
      - "(?i)проверк[аи]"
      - "(?i)audit\\s+by\\s+[\\s\\S]{0,30}(regulator|authority)"
      - "(?i)regulatory\\s+audit"
      - "(?i)регуляторн[а-я]+\\s+аудит"

      # Штрафы и penalties (общие)
      - "(?i)\\bfine[s]?\\b"
      - "(?i)\\bpenalt(y|ies)\\b"
      - "(?i)\\bштраф[ыа]?\\b"
      - "(?i)administrative\\s+liability"
      - "(?i)административн[а-я]+\\s+ответственност"

      # Расследования (общие)
      - "(?i)investigation"
      - "(?i)расследовани[ея]"
      - "(?i)inquiry"
      - "(?i)proceeding"

      # Remedial / устранение нарушений
      - "(?i)remedial\\s+(action|measure|plan)"
      - "(?i)corrective\\s+(action|measure)"
      - "(?i)устранени[ея]\\s+нарушени[йя]"
      - "(?i)исправительн[а-я]+\\s+мер[ыа]"

    low:
      # Общие ссылки на регуляторов
      - "(?i)regulator"
      - "(?i)регулятор"
      - "(?i)надзорн[а-я]+\\s+орган"
      - "(?i)supervisory\\s+authority"
      - "(?i)competent\\s+authority"
      - "(?i)government\\s+agency"
      - "(?i)государственн[а-я]+\\s+орган"

      # Отраслевые термины (общие)
      - "(?i)financial\\s+services"
      - "(?i)финансов[а-я]+\\s+услуг"
      - "(?i)healthcare"
      - "(?i)здравоохранени"
      - "(?i)telecommunications"
      - "(?i)телеком"
      - "(?i)energy\\s+sector"
      - "(?i)энергетик"
      - "(?i)education"
      - "(?i)образовани"

      # Общие compliance-термины
      - "(?i)compliance"
      - "(?i)комплаенс"
      - "(?i)compliant"
      - "(?i)соответству[ею]т"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 640

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  context_k: 5
  max_chunks: 10
  boost_keywords:
    - "compliance with applicable laws"
    - "regulatory requirements"
    - "соответствовать требованиям"
    - "отраслевые требования"
    - "enforcement action"
    - "regulatory investigation"
    - "регуляторное расследование"
    - "надзорная проверка"
    - "предписание"
    - "штраф"
    - "fine"
    - "penalty"
    - "investigation"
    - "расследование"
    - "no material violation"
    - "no ongoing investigation"
    - "отсутствие нарушений"
    - "remedial action"
    - "устранение нарушений"
    - "settlement agreement"
    - "consent order"
    - "ЦБ"
    - "SEC"
    - "FDA"
    - "ФАС"
  rerank: true
  filters: {}

conditional: null

extraction:
  llm_prompt_extraction: |
    <role>
    Ты — юрист по регуляторному комплаенсу.
    Твоя специализация — отраслевое регулирование (финансы, медицина,
    телеком, энергетика, образование, защита данных и др.),
    взаимодействие с надзорными органами, анализ регуляторных рисков
    и комплаенс-истории компаний.
    </role>

    <context>
    Ниже приведены фрагменты договора и/или заявлений сторон,
    где могут упоминаться отраслевые требования, отношения
    с регуляторами, проверки, нарушения и штрафы:

    {context}
    </context>

    <instructions>
    Проведи анализ по шагам. Каждый шаг логически соответствует одному
    или нескольким полям итоговой оценки риска.

    Шаг 1 — ОБЯЗАТЕЛЬСТВА ПО КОМПЛАЕНСУ
    (используется для заполнения поля "has_compliance_obligations"):
    - Определи, содержатся ли в тексте:
      * общие формулировки "compliance with all applicable laws
        and regulations";
      * специальные отраслевые требования:
        - финансовое регулирование (banking, securities, insurance),
        - медицина/фарма (healthcare, FDA, clinical trials),
        - телеком (telecommunications, spectrum, broadcasting),
        - энергетика (energy, utilities, environmental),
        - образование (education, accreditation),
        - защита данных (GDPR, 152-ФЗ, CCPA);
      * ссылки на конкретные регуляторы (ЦБ, SEC, FDA, FCC, ФАС и др.)
        и их нормативные акты.
    - Если специальные отраслевые требования явно прописаны —
      вывод "industry_specific".
    - Если только общие формулировки — вывод "general_only".
    - Если обязательства отсутствуют — вывод "none".
    - Если неясно — вывод "unclear".

    Шаг 2 — УПОМИНАНИЯ ПРОВЕРОК, РАССЛЕДОВАНИЙ, ШТРАФОВ
    (используется для заполнения поля "mentions_regulatory_events"):
    - Определи, есть ли в фрагментах упоминания:
      * прошлых или текущих проверок, инспекций;
      * расследований (investigations, inquiries, proceedings);
      * предписаний, enforcement actions;
      * штрафов, penalties, fines;
      * settlement agreements с регуляторами;
      * consent orders, cease and desist orders.
    - Если такие события упоминаются — вывод "yes".
    - Если явно указано их отсутствие — вывод "none_mentioned".
    - Если не упоминаются и нет заверений — вывод "no".
    - Если неясно — вывод "unclear".

    Шаг 3 — ЗАВЕРЕНИЯ ОБ ОТСУТСТВИИ НАРУШЕНИЙ
    (используется для заполнения поля "has_no_violations_representations"):
    - Определи, есть ли representations/warranties о том, что:
      * нет существенных нарушений регуляторных требований
        (no material violations);
      * нет текущих расследований (no ongoing/pending investigations);
      * отсутствуют существенные непогашенные штрафы.
    - Учитывай:
      * упоминается ли материальность (material);
      * указан ли период (за последние X лет);
      * есть ли квалификации/исключения.
    - Если такие заверения есть — вывод "yes".
    - Если нет — вывод "no".
    - Если неясно — вывод "unclear".

    Шаг 4 — REMEDIAL-МЕРЫ
    (используется для заполнения поля "has_remedial_measures"):
    - Определи, упоминаются ли:
      * remedial actions / corrective measures;
      * устранение нарушений;
      * закрытие предписаний;
      * compliance enhancement programs;
      * settlement и выполнение его условий.
    - Если да — вывод "yes".
    - Если нет — вывод "no".
    - Если неясно — вывод "unclear".

    Шаг 5 — RED FLAGS
    (используется для заполнения поля "red_flags"):
    - Оцени наличие следующих рисковых факторов:

      * «REG1» — Упоминания расследований/штрафов/enforcement actions
        без ясного статуса и remedial-плана. Признаки:
        - mentions_regulatory_events = "yes";
        - has_remedial_measures = "no" или "unclear";
        - статус события неясен (в процессе? урегулировано?);
        - размер штрафов значительный или не указан.

      * «REG2» — Формальные/декларативные комплаенс-положения
        при очевидно высокорискованной отрасли. Признаки:
        - identified_industries включает финансы, медицину,
          телеком, энергетику;
        - has_compliance_obligations = "general_only";
        - нет ссылок на конкретные отраслевые требования
          или регуляторов;
        - нет заверений об отсутствии нарушений.

      * «REG3» — Отсутствие заверений об отсутствии нарушений
        при наличии отраслевого регулирования. Признаки:
        - identified_industries не пуст;
        - has_no_violations_representations = "no";
        - это создаёт неопределённость о регуляторной истории.

    - Если комплаенс-положения развёрнутые, нет упоминаний
      нарушений/штрафов (или они урегулированы), есть заверения
      об отсутствии нарушений — верни "NONE".
    - Если данных недостаточно для оценки или текст противоречив —
      верни "UNCLEAR".
    - Формат: один или несколько кодов через запятую
      ("REG1", "REG2", "REG1, REG3"), "NONE" или "UNCLEAR".
      Без комментариев в этом поле — всё объясняющее в reason.

    Шаг 6 — ОБОСНОВАНИЕ
    (используется для заполнения поля "reason"):

    - В "reason" кратко обоснуй вывод:
      * ссылайся на ключевые формулировки (по возможности
        с короткими цитатами);
      * поясни, как сочетание обязательств, событий, заверений
        и remedial-мер влияет на риск для Target;
      * если выставлены red_flags — объясни, почему именно эти коды.
    </instructions>

    <edge_cases>
    Обрабатывай пограничные ситуации так:

    - Только стандартная фраза "компания соблюдает применимое
      законодательство" без отраслевой конкретики:
      has_compliance_obligations = "general_only";
      в reason отмечай отсутствие отраслевой детализации;
      если отрасль высокорисковая — рассматривай REG2.

    - Прямо указано, что против компании ведутся расследования
      или есть крупные штрафы, при этом неясно, устранены ли
      нарушения:
      mentions_regulatory_events = "yes";
      has_remedial_measures = "unclear" или "no";
      ставь REG1; regulatory_risk_level = "high".

    - В тексте есть заверения "no material violations" и
      "no ongoing investigations", но ничего не говорится
      про прошлые штрафы:
      has_no_violations_representations = "yes";
      учитывай как фактор снижения риска;
      regulatory_risk_level может быть "low" или "medium".

    - Упоминаются прошлые штрафы/предписания, но явно описан
      remedial-план и закрытие вопросов с регулятором:
      mentions_regulatory_events = "yes";
      has_remedial_measures = "yes";
      отмечай факт нарушений, но в reason указывай, что
      вопросы урегулированы; regulatory_risk_level = "medium".

    - Договор касается высокорегулируемой отрасли (финансы,
      медицина), но нет ни отраслевых требований, ни заверений:
      has_compliance_obligations = "none" или "general_only";
      has_no_violations_representations = "no";
      ставь REG2 и REG3; regulatory_risk_level = "high".

    - Есть settlement agreement с регулятором, все условия
      выполнены, штраф уплачен:
      mentions_regulatory_events = "yes";
      has_remedial_measures = "yes";
      в reason укажи, что settlement закрыт;
      это может снижать regulatory_risk_level до "medium".

    - Пустые или явно нерелевантные фрагменты:
      укажи, что данных недостаточно для анализа отраслевого
      комплаенса и регуляторных событий.
      regulatory_risk_level = "unclear";
      overall_risk_level = "medium";
      red_flags = "UNCLEAR".
    </edge_cases>

    <output_expectations>
    На основе твоего анализа отдельный механизм извлечения сформирует
    структурированные поля по заранее заданной схеме. Твоя задача —
    давать чёткие юридические выводы и указывать конкретные формулировки
    из текста, на которых они основаны. Не генерируй JSON —
    просто излагай выводы структурированно и однозначно.
    </output_expectations>

  enabled: true
  mode: "hybrid"
  fields:
    - name: "has_compliance_obligations"
      type: "string"
      allowed_values:
        - "industry_specific"
        - "general_only"
        - "none"
        - "unclear"

    - name: "mentions_regulatory_events"
      type: "string"
      allowed_values:
        - "yes"
        - "none_mentioned"
        - "no"
        - "unclear"

    - name: "has_no_violations_representations"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "has_remedial_measures"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "red_flags"
      type: "string"

    - name: "reason"
      type: "string"

  store_payload: true

red_flags:
  items:
    - code: "REG1"
      description: "Упоминания расследований/штрафов/enforcement actions без ясного статуса."
    - code: "REG2"
      description: "Формальные комплаенс-положения."
    - code: "REG3"
      description: "Отсутствие заверений об отсутствии нарушений (no material violations)."