id: "regulatory_industry_compliance"
name: "Отраслевой комплаенс и регуляторные нарушения"
description: >
  Анализирует обязательства соблюдать отраслевые требования (финансы, медицина,
  телеком, энергетика, образование и др.), а также наличие упоминаний о
  нарушениях, проверках, предписаниях и штрафах.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"

rules:
  keywords:
    - "соответствовать требованиям"
    - "compliance with"
    - "applicable regulations"
    - "отраслевые требования"
    - "regulatory requirements"
    - "надзорный орган"
    - "regulator"
    - "инспекция"
    - "проверка"
    - "inspection"
    - "предписание"
    - "enforcement action"
    - "штраф"
    - "penalty"
    - "fine"
    - "расследование"
    - "investigation"
  keyword_mode: "any"
  regex_patterns: []
  clause_patterns: []

llm:
  prompt_template: |
    <role>
    Ты — юрист по регуляторному комплаенсу.
    Твоя специализация — отраслевое регулирование (финансы, медицина, телеком,
    энергетика, образование и т.п.) и взаимодействие с надзорными органами.
    </role>

    <context>
    Ниже приведены фрагменты договора и/или заявлений сторон, где могут
    упоминаться отраслевые требования и отношения с регуляторами:

    {context}
    </context>

    <instructions>
    Проведи анализ по шагам. Каждый шаг логически связан с одним или
    несколькими полями итоговой оценки.

    Шаг 1 — ОБЯЗАТЕЛЬСТВА ПО КОМПЛАЕНСУ
    (используется для "has_industry_or_general_compliance_obligations"):
    - Определи, содержатся ли в тексте:
      * общие формулировки вида "compliance with all applicable laws and regulations";
      * специальные отраслевые требования (банковское, страховое,
        медицинское, телеком, энергетика, образование, защита данных и др.);
      * отсылки к конкретным регуляторам и их нормативным актам.
    - Сформулируй вывод: yes / no / unclear в зависимости от того,
      насколько явно эти обязательства закреплены.

    Шаг 2 — УПОМИНАНИЯ ПРОВЕРОК, РАССЛЕДОВАНИЙ И ШТРАФОВ
    (используется для "mentions_regulatory_investigations_or_fines"):
    - Проверь, есть ли в фрагментах:
      * факты прошлых или текущих проверок, расследований, инспекций;
      * предписания, enforcement actions, штрафы, penalties, fines;
      * settlement agreements с регуляторами.
    - Любое содержательное упоминание таких событий отмечай как yes,
      отсутствие — no, неопределённость — unclear.

    Шаг 3 — ЗАВЕРЕНИЯ ОБ ОТСУТСТВИИ НАРУШЕНИЙ
    (используется для "has_representations_about_no_material_violations"):
    - Определи, есть ли reps & warranties о том, что:
      * нет существенных нарушений применимых регуляторных требований
        (no material violations);
      * нет текущих расследований (no ongoing investigations);
      * отсутствуют существенные непогашенные штрафы.
    - Учитывай, упоминается ли материальность (material) и период
      (например, за последние X лет).
    - Сформулируй вывод: yes / no / unclear.

    Шаг 4 — РЕГУЛЯТОРНЫЙ РИСК
    (используется для "regulatory_risk_level"):
    - Оцени уровень регуляторного риска как low / medium / high / unclear,
      принимая во внимание:
      * наличие или отсутствие расследований, штрафов, предписаний;
      * наличие/отсутствие заверений об отсутствии существенных нарушений;
      * указание remedial‑мер (устранение нарушений, закрытие предписаний);
      * общую стабильность комплаенс‑истории, если она просматривается
        из фрагментов.
    - "unclear" используй только если по тексту объективно неясно,
      есть ли нарушения и каков их масштаб.

    Шаг 5 — ОБЩИЙ РИСК ДЛЯ СДЕЛКИ / TARGET
    (используется для "overall_risk_level" и "reason"):
    - Оцени общий риск для Target с точки зрения регуляторного профиля:
      * насколько серьёзны или вероятны претензии регуляторов;
      * как отсутствие/наличие нарушений и обязательств по комплаенсу
        влияет на устойчивость бизнеса;
      * есть ли признаки системных проблем или, наоборот, зрелого комплаенса.
    - Сформулируй общий уровень риска как low / medium / high.
    - В "reason" кратко обоснуй вывод, ссылаясь на ключевые формулировки
      (желательно с короткими цитатами) и пояснив, как сочетание обязательств,
      проверок/штрафов и заверений влияет на риск для Target.
    </instructions>

    <edge_cases>
    Обрабатывай пограничные ситуации так:

    - Есть только стандартная фраза "компания соблюдает применимое законодательство"
      без отраслевой конкретики:
      фиксируй наличие общих обязательств по комплаенсу, но в reason отмечай
      отсутствие отраслевой детализации.

    - Прямо указано, что против компании ведутся расследования или есть крупные
      штрафы, при этом неясно, устранены ли нарушения:
      отражай наличие расследований/штрафов и, при отсутствии данных о remedial‑мер,
      склоняйся к повышенному уровню регуляторного риска.

    - В тексте есть заверения "no material violations" и "no ongoing investigations",
      но ничего не говорится про штрафы:
      учитывай такие заверения как фактор снижения риска, особенно если речь
      об отрасли с жёстким регулированием.

    - Упоминаются прошлые штрафы/предписания, но явно описан remedial‑план
      и закрытие вопросов с регулятором:
      отмечай сам факт нарушений, но в reason указывай, что вопросы урегулированы,
      что может снижать текущий уровень риска.

    - Пустые или явно нерелевантные фрагменты:
      укажи, что данных недостаточно для анализа отраслевого комплаенса
      и регуляторных нарушений; regulatory_risk_level в таком случае
      логично оставить "unclear", а общий риск — не ниже "medium" из-за
      высокой неопределённости.
    </edge_cases>

    <output_expectations>
    На основе твоего анализа отдельный механизм извлечения сформирует
    структурированные поля по заранее заданной схеме. Твоя задача —
    давать чёткие юридические выводы и указывать конкретные формулировки
    из текста, на которых они основаны.
    </output_expectations>
  prompt_file: null
  context_k: 5
  temperature: 0.0
  max_tokens: 640

evidence:
  required: false
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  context_k: 5
  max_chunks: 10
  boost_keywords:
    - "compliance with"
    - "regulatory requirements"
    - "инспекция"
    - "предписание"
    - "штраф"
    - "investigation"
  rerank: true
  filters: {}

conditional: null

extraction:
  enabled: true
  mode: "hybrid"
  fields:
    - name: "has_industry_or_general_compliance_obligations"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "mentions_regulatory_investigations_or_fines"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "has_representations_about_no_material_violations"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "regulatory_risk_level"
      type: "string"
      allowed_values:
        - "low"
        - "medium"
        - "high"
        - "unclear"

    - name: "overall_risk_level"
      type: "string"
      allowed_values:
        - "low"
        - "medium"
        - "high"

    - name: "reason"
      type: "string"

  store_payload: true

red_flags:
  items:
    - code: "REG3"
      description: "Упоминания расследований/штрафов без ясного статуса и remedial-плана."
    - code: "REG4"
      description: "Чисто формальные комплаенс-положения при очевидно высокорискованной отрасли."
