id: "regulatory_industry_compliance"
name: "Отраслевой комплаенс и регуляторные нарушения"
description: >
  Анализирует обязательства соблюдать отраслевые требования
  (финансы, медицина, телеком, энергетика, образование, защита
  данных и др.), наличие упоминаний о проверках, расследованиях,
  предписаниях, штрафах, заверения об отсутствии нарушений,
  а также статус remedial-мер.

  Формирует краткий user-facing вывод и оценивает уровень
  регуляторного риска для Target.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"
ui_mode: "field_extraction"

rules:
  keyword_mode: any

  keywords:
    high:
      # Конкретные регуляторные события
      - "(?i)enforcement\\s+action"
      - "(?i)regulatory\\s+(investigation|inquiry|proceeding)"
      - "(?i)регуляторн[а-я]+\\s+(расследовани[ея]|проверк[аи])"
      - "(?i)надзорн[а-я]+\\s+проверк[аи]"
      - "(?i)предписани[ея]\\s+(регулятор|надзорн)"
      - "(?i)(штраф|fine|penalty)\\s+[\\s\\S]{0,30}(регулятор|надзорн|authority)"
      - "(?i)administrative\\s+(fine|penalty|sanction)"
      - "(?i)административн[а-я]+\\s+(штраф|санкц[ия])"
      - "(?i)settlement\\s+(agreement|with)\\s+[\\s\\S]{0,30}(regulator|authority)"
      - "(?i)consent\\s+order"
      - "(?i)cease\\s+and\\s+desist"

      # Заверения о нарушениях
      - "(?i)no\\s+material\\s+violation"
      - "(?i)no\\s+pending\\s+(investigation|proceeding|enforcement)"
      - "(?i)no\\s+ongoing\\s+investigation"
      - "(?i)отсутстви[ея]\\s+существенн[а-я]+\\s+нарушени[йя]"
      - "(?i)нет\\s+текущих\\s+(расследовани[йя]|проверок)"

      # Конкретные регуляторы
      - "(?i)(ЦБ|Центральный\\s+банк|Банк\\s+России)"
      - "(?i)(SEC|FINRA|FCA|PRA|BaFin|CFTC)"
      - "(?i)(FDA|EMA|Росздравнадзор)"
      - "(?i)(FCC|Роскомнадзор|OFCOM)"
      - "(?i)(ФАС|Антимонопольн[а-я]+\\s+служб)"
      - "(?i)(EPA|Росприроднадзор)"
      - "(?i)(DOJ|Department\\s+of\\s+Justice)"

    medium:
      # Compliance-обязательства
      - "(?i)compliance\\s+with\\s+(all\\s+)?applicable\\s+(laws?|regulations?)"
      - "(?i)соответств[а-я]+\\s+(применим[а-я]+\\s+)?законодательств"
      - "(?i)regulatory\\s+requirements?"
      - "(?i)регуляторн[а-я]+\\s+требовани[яй]"
      - "(?i)отраслев[а-я]+\\s+требовани[яй]"

      # Лицензии и разрешения — регуляторный контекст
      - "(?i)licens(e|ing|ed)\\s+[\\s\\S]{0,30}(regulatory|authority)"
      - "(?i)лицензи[яию]\\s+[\\s\\S]{0,30}(регулятор|надзорн)"

      # Проверки и инспекции
      - "(?i)inspection[\\s\\S]{0,20}(regulator|authority|надзорн)"
      - "(?i)audit\\s+by\\s+[\\s\\S]{0,30}(regulator|authority)"
      - "(?i)регуляторн[а-я]+\\s+аудит"

      # Штрафы и penalties (общие)
      - "(?i)\\bfine[s]?\\b[\\s\\S]{0,20}(regulator|authority)"
      - "(?i)\\bpenalt(y|ies)\\b[\\s\\S]{0,20}(regulator|authority)"
      - "(?i)\\bштраф[ыа]?\\b[\\s\\S]{0,20}(регулятор|надзорн)"
      - "(?i)administrative\\s+liability"

      # Remedial
      - "(?i)remedial\\s+(action|measure|plan)"
      - "(?i)corrective\\s+(action|measure)"
      - "(?i)устранени[ея]\\s+нарушени[йя]"
      - "(?i)исправительн[а-я]+\\s+мер[ыа]"

    low:
      - "(?i)enforcement\\s+action"
      - "(?i)regulatory\\s+investigation"
      - "(?i)no\\s+material\\s+violation"
      - "(?i)no\\s+ongoing\\s+investigation"
      - "(?i)consent\\s+order"
      - "(?i)cease\\s+and\\s+desist"
      - "(?i)settlement\\s+with\\s+regulator"
      - "(?i)надзорная\\s+проверка"
      - "(?i)предписание\\s+регулятора"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 640

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  context_k: 5
  max_chunks: 10
  boost_keywords:
    - "compliance with applicable laws"
    - "regulatory requirements"
    - "соответствовать требованиям"
    - "отраслевые требования"
    - "enforcement action"
    - "regulatory investigation"
    - "регуляторное расследование"
    - "надзорная проверка"
    - "предписание"
    - "штраф"
    - "fine"
    - "penalty"
    - "no material violation"
    - "no ongoing investigation"
    - "отсутствие нарушений"
    - "remedial action"
    - "устранение нарушений"
    - "settlement agreement"
    - "consent order"
    - "ЦБ"
    - "SEC"
    - "FDA"
    - "ФАС"
  rerank: true
  filters: {}

conditional: null

enrichment_hints:
  preferred_segment_types:
    - "contract"
    - "annex"
    - "appendix"
    - "amendment"
  excluded_segment_types:
    - "technical_specification"
    - "price_list"
    - "invoice"
    - "act"
  preferred_clause_functions:
    - "representations_warranties"
    - "general_provisions"
  confidence_bonus_on_match: 0.08
  confidence_penalty_on_excluded_segment: 0.15

extraction:
  enabled: true
  mode: "hybrid"
  llm_max_tokens: 440
  llm_prompt_extraction: |
    <role>
    Ты — юрист по регуляторному комплаенсу.
    Твоя задача — точно извлечь из текста:
    1) наличие и характер compliance-обязательств;
    2) упоминания регуляторных событий (расследования, штрафы);
    3) заверения об отсутствии нарушений;
    4) наличие remedial-мер;
    5) отраслевую принадлежность для оценки риска.
    </role>

    <context>
    Ниже приведены релевантные фрагменты договора:

    {context}
    </context>

    <task>
    Заполни только следующие поля:
    - regulatory_compliance_display
    - has_compliance_obligations
    - identified_industries
    - mentions_regulatory_events
    - has_no_violations_representations
    - has_remedial_measures
    - regulatory_risk_level
    - red_flags
    - reason

    Важно:
    - не придумывай отрасли без явных данных;
    - пиши user-facing значения коротко и по-русски.
    </task>

    <instructions>
    Шаг 1 — ОБЯЗАТЕЛЬСТВА ПО КОМПЛАЕНСУ

    Заполни поле "has_compliance_obligations".

    Значения:
    - "industry_specific" — специальные отраслевые требования:
      финансовое регулирование, медицина / фарма, телеком,
      энергетика, образование, защита данных; ссылки на
      конкретных регуляторов (ЦБ, SEC, FDA, FCC, ФАС и др.).
    - "general_only" — только общие формулировки "compliance
      with all applicable laws" без отраслевой конкретики.
    - "none" — обязательства отсутствуют.
    - "unclear" — неясно.

    Шаг 2 — ИДЕНТИФИКАЦИЯ ОТРАСЛЕЙ

    Заполни поле "identified_industries".

    Правила:
    - Кратко перечисли отрасли через ";":
      * "финансы; медицина; защита данных"
      * "телеком; энергетика"
    - Если отрасль неясна: "Не определено"
    - Если нет отраслевой специфики: "Не применимо"

    Шаг 3 — УПОМИНАНИЯ РЕГУЛЯТОРНЫХ СОБЫТИЙ

    Заполни поле "mentions_regulatory_events".

    Значения:
    - "yes" — упоминаются: проверки, расследования,
      предписания, штрафы, enforcement actions, settlement,
      consent orders.
    - "none_mentioned" — явно указано их отсутствие.
    - "no" — не упоминаются и нет заверений.
    - "unclear" — неясно.

    Шаг 4 — ЗАВЕРЕНИЯ ОБ ОТСУТСТВИИ НАРУШЕНИЙ

    Заполни поле "has_no_violations_representations".

    Значения:
    - "yes" — есть representations: no material violations,
      no ongoing / pending investigations, отсутствие
      существенных штрафов.
    - "no" — нет.
    - "unclear" — неясно.

    Шаг 5 — REMEDIAL-МЕРЫ

    Заполни поле "has_remedial_measures".

    Значения:
    - "yes" — упоминаются: remedial actions, corrective
      measures, устранение нарушений, закрытие предписаний,
      settlement выполнен.
    - "no" — нет.
    - "unclear" — неясно.

    Шаг 6 — УРОВЕНЬ РЕГУЛЯТОРНОГО РИСКА

    Заполни поле "regulatory_risk_level".

    Значения:
    - "low" — compliance-положения развёрнутые, нет упоминаний
      нарушений (или они урегулированы), есть заверения.
    - "medium" — есть отдельные факторы риска, управляемые.
    - "high" — упоминаются расследования / штрафы без ясного
      статуса, нет заверений, высокорисковая отрасль без
      отраслевых требований.
    - "unclear" — данных недостаточно.

    Шаг 7 — RED FLAGS

    Заполни поле "red_flags".

    Используй:
    - "NONE" — compliance-положения развёрнутые, нет нарушений
      или они урегулированы, есть заверения.
    - "UNCLEAR" — данных недостаточно.
    - Коды через запятую:
      * REG1 — расследования / штрафы / enforcement actions
        без ясного статуса и remedial-плана.
      * REG2 — формальные compliance-положения при
        высокорисковой отрасли (финансы, медицина, телеком,
        энергетика) без отраслевой конкретики.
      * REG3 — нет заверений об отсутствии нарушений при
        наличии отраслевого регулирования.

    Шаг 8 — USER-FACING SUMMARY

    Заполни поле "regulatory_compliance_display".

    Примеры:
    - "Финансы; отраслевые требования ЦБ; нет нарушений
       (заверения); remedial план закрыт"
    - "Медицина; только общие compliance-обязательства;
       упоминаются расследования без статуса"
    - "Телеком; нет отраслевых требований; нет заверений"
    - "Не удалось определить отраслевой комплаенс"

    Правила:
    - Отрази максимум 3–4 ключевых факта через ";".
    - Если всё unclear:
      "Не удалось определить отраслевой комплаенс"

    Шаг 9 — ОБОСНОВАНИЕ

    Заполни поле "reason".

    Правила:
    - 1–2 коротких предложения.
    - Укажи: отрасль, характер compliance-обязательств,
      регуляторные события, заверения, remedial-меры,
      почему red_flags.
    - Приведи короткую цитату в кавычках.
    - Если NONE — почему регуляторный риск приемлем.
    </instructions>

    <edge_cases>
    - "Компания соблюдает применимое законодательство"
      без отраслевой конкретики:
      * has_compliance_obligations = "general_only"
      * если высокорисковая отрасль: red_flags включает "REG2"

    - Расследования упомянуты, статус неясен, remedial нет:
      * mentions_regulatory_events = "yes"
      * has_remedial_measures = "no" или "unclear"
      * red_flags = "REG1"

    - "No material violations" + "no ongoing investigations":
      * has_no_violations_representations = "yes"
      * это снижает риск

    - Прошлые штрафы, remedial план закрыт, settlement выполнен:
      * mentions_regulatory_events = "yes"
      * has_remedial_measures = "yes"
      * regulatory_risk_level = "medium"
      * в reason: вопросы урегулированы

    - Финансовая отрасль, нет отраслевых требований, нет заверений:
      * has_compliance_obligations = "general_only" или "none"
      * has_no_violations_representations = "no"
      * red_flags = "REG2, REG3"

    - Нет релевантных фрагментов:
      * все поля = "unclear"
      * red_flags = "UNCLEAR"
      * regulatory_compliance_display =
        "Не удалось определить отраслевой комплаенс"
    </edge_cases>

    <output_expectations>
    Все значения должны быть короткими, точными и пригодными
    для отображения пользователю в DD Grid.
    Не добавляй никаких полей, кроме указанных в схеме extraction.
    </output_expectations>

  fields:
    - name: "regulatory_compliance_display"
      type: "string"
      description: "Отраслевой комплаенс: краткий вывод"

    - name: "has_compliance_obligations"
      type: "string"
      description: "Характер compliance-обязательств"
      allowed_values:
        - "industry_specific"
        - "general_only"
        - "none"
        - "unclear"

    - name: "identified_industries"
      type: "string"
      description: "Идентифицированные отрасли"

    - name: "mentions_regulatory_events"
      type: "string"
      description: "Упоминания регуляторных событий"
      allowed_values:
        - "yes"
        - "none_mentioned"
        - "no"
        - "unclear"

    - name: "has_no_violations_representations"
      type: "string"
      description: "Заверения об отсутствии нарушений"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "has_remedial_measures"
      type: "string"
      description: "Наличие remedial-мер"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "regulatory_risk_level"
      type: "string"
      description: "Уровень регуляторного риска"
      allowed_values:
        - "low"
        - "medium"
        - "high"
        - "unclear"

    - name: "red_flags"
      type: "string"
      description: "Коды рисков"

    - name: "reason"
      type: "string"
      description: "Обоснование"

  store_payload: true
  
