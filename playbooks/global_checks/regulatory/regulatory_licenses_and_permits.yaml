id: "regulatory_licenses_and_permits"
name: "Лицензии, разрешения и аккредитации"
description: >
  Анализирует положения о наличии лицензий, разрешений, аккредитаций:
  на кого оформлены, зависят ли от структуры владения/контроля,
  каков риск утраты при M&A-сделке. Оценивает критичность лицензий
  для деятельности Target и наличие механизмов их сохранения.

doc_types: []

severity: "high"
severity_if_fail: "critical"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"

rules:
  keyword_mode: any

  keywords:
    high:
      # Конкретные типы критичных лицензий
      - "(?i)банковск[а-я]+\\s+лицензи[яию]"
      - "(?i)banking\\s+licen[cs]e"
      - "(?i)лицензи[яи]\\s+на\\s+(осуществлени[ея]\\s+)?банковск"
      - "(?i)лицензи[яи]\\s+ЦБ"
      - "(?i)лицензи[яи]\\s+Центральн[а-я]+\\s+банк"
      - "(?i)страхов[а-я]+\\s+лицензи[яию]"
      - "(?i)insurance\\s+licen[cs]e"
      - "(?i)медицинск[а-я]+\\s+лицензи[яию]"
      - "(?i)лицензи[яи]\\s+на\\s+медицинск[а-я]+\\s+деятельность"
      - "(?i)pharmaceutical\\s+licen[cs]e"
      - "(?i)фармацевтическ[а-я]+\\s+лицензи[яию]"
      - "(?i)телеком[а-я]*\\s+лицензи[яию]"
      - "(?i)telecommunications?\\s+licen[cs]e"
      - "(?i)лицензи[яи]\\s+на\\s+связь"
      - "(?i)лицензи[яи]\\s+Роскомнадзор"
      - "(?i)energy\\s+(generation|supply)\\s+licen[cs]e"
      - "(?i)лицензи[яи]\\s+на\\s+(генераци|добыч|переработк)"
      - "(?i)образовательн[а-я]+\\s+лицензи[яию]"
      - "(?i)education(al)?\\s+licen[cs]e"

      # Change of control и лицензии
      - "(?i)change\\s+of\\s+control\\s+[\\s\\S]{0,40}(licen[cs]e|permit|approval)"
      - "(?i)смен[аы]\\s+контрол[яи]\\s+[\\s\\S]{0,40}лицензи"
      - "(?i)(licen[cs]e|permit)\\s+[\\s\\S]{0,40}(revoke|suspend|terminate|cancel)\\s+[\\s\\S]{0,40}(change|transfer)"
      - "(?i)лицензи[яи]\\s+[\\s\\S]{0,40}(аннулир|приостанов|прекращ)\\s+[\\s\\S]{0,40}смен"
      - "(?i)re[-\\s]?licen[cs]ing"
      - "(?i)перелицензирован[иея]"
      - "(?i)переоформлени[ея]\\s+лицензи"

      # Регуляторное согласие
      - "(?i)regulatory\\s+(consent|approval)\\s+[\\s\\S]{0,40}(transfer|change)"
      - "(?i)согласи[ея]\\s+регулятор[ау]\\s+[\\s\\S]{0,40}(смен|передач|отчужден)"
      - "(?i)notification\\s+to\\s+[\\s\\S]{0,30}(regulator|authority)\\s+[\\s\\S]{0,30}(change|transfer)"
      - "(?i)уведомлени[ея]\\s+регулятор[ау]"

    medium:
      # Лицензии и разрешения — общие упоминания
      - "(?i)\\bлицензи[яию]\\b"
      - "(?i)\\blicen[cs]e[sd]?\\b"
      - "(?i)\\bpermit[s]?\\b"
      - "(?i)\\bразрешени[ея]\\b"
      - "(?i)\\bаккредитаци[яию]\\b"
      - "(?i)\\baccreditation\\b"
      - "(?i)разрешительн[а-я]+\\s+документаци"
      - "(?i)регистрационн[а-я]+\\s+удостоверени"
      - "(?i)registration\\s+certificate"
      - "(?i)operating\\s+licen[cs]e"
      - "(?i)лицензи[яи]\\s+на\\s+осуществлени[ея]"

      # Сертификаты и допуски
      - "(?i)сертификат\\s+соответстви[яи]"
      - "(?i)certificate\\s+of\\s+conformity"
      - "(?i)допуск\\s+СРО"
      - "(?i)SRO\\s+(membership|admission)"
      - "(?i)членств[оа]\\s+в\\s+СРО"
      - "(?i)свидетельств[оа]\\s+о\\s+допуск"

      # Держатель лицензии
      - "(?i)licen[cs]e\\s+holder"
      - "(?i)держатель\\s+лицензи"
      - "(?i)лицензиат"
      - "(?i)licensee"
      - "(?i)issued\\s+to"
      - "(?i)выдан[ао]?\\s+[\\s\\S]{0,20}(компании|обществу|организации)"

      # Срок действия лицензий
      - "(?i)licen[cs]e\\s+(validity|term|expir)"
      - "(?i)срок\\s+действи[яи]\\s+лицензи"
      - "(?i)продлени[ея]\\s+лицензи"
      - "(?i)renewal\\s+of\\s+licen[cs]e"
      - "(?i)истечени[ея]\\s+срока\\s+лицензи"

      # Зависимость от владения
      - "(?i)ownership\\s+structure\\s+[\\s\\S]{0,40}licen[cs]e"
      - "(?i)структур[аы]\\s+владени[яи]\\s+[\\s\\S]{0,40}лицензи"
      - "(?i)beneficial\\s+owner\\s+[\\s\\S]{0,40}licen[cs]e"
      - "(?i)бенефициар[а-я]*\\s+[\\s\\S]{0,40}лицензи"

    low:
      # Общие ссылки на регулирование
      - "(?i)regulatory\\s+requirement"
      - "(?i)регуляторн[а-я]+\\s+требовани"
      - "(?i)applicable\\s+licen[cs]ing"
      - "(?i)лицензионн[а-я]+\\s+требовани"
      - "(?i)licensing\\s+authority"
      - "(?i)лицензирующ[а-я]+\\s+орган"

      # Общие compliance-термины
      - "(?i)compliance"
      - "(?i)комплаенс"
      - "(?i)authorization"
      - "(?i)авторизаци"

      # Общие ссылки на регуляторов
      - "(?i)regulator"
      - "(?i)регулятор"
      - "(?i)authority"
      - "(?i)орган[ы]?\\s+(власти|надзора)"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 640

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  context_k: 5
  max_chunks: 10
  boost_keywords:
    - "лицензия"
    - "лицензии"
    - "license"
    - "licenses"
    - "permit"
    - "permits"
    - "разрешение"
    - "аккредитация"
    - "accreditation"
    - "регистрационное удостоверение"
    - "банковская лицензия"
    - "медицинская лицензия"
    - "телеком лицензия"
    - "license holder"
    - "держатель лицензии"
    - "change of control"
    - "смена контроля"
    - "re-licensing"
    - "переоформление лицензии"
    - "regulatory consent"
    - "согласие регулятора"
    - "revocation"
    - "аннулирование"
    - "suspension"
    - "приостановление"
  rerank: true
  filters: {}

conditional: null

extraction:
  llm_prompt_extraction: |
    <role>
    Ты — юрист по регуляторному комплаенсу и M&A.
    Твоя специализация — лицензируемые виды деятельности, разрешения
    и аккредитации, их зависимость от структуры владения и контроля,
    а также риски утраты лицензий при M&A-сделках.
    </role>

    <context>
    Ниже приведены фрагменты договора или связанных документов,
    где могут упоминаться лицензии, разрешения, аккредитации
    и их держатели:

    {context}
    </context>

    <instructions>
    Проведи анализ по шагам. Каждый шаг логически соответствует одному
    или нескольким полям итоговой оценки риска.

    Шаг 1 — НАЛИЧИЕ КЛЮЧЕВЫХ ЛИЦЕНЗИЙ/РАЗРЕШЕНИЙ
    (используется для заполнения поля "has_key_licenses"):
    - Определи, упоминаются ли лицензии, разрешения, аккредитации,
      регистрационные удостоверения, сертификаты, без которых
      деятельность Target невозможна или существенно ограничена.
    - Обращай внимание на:
      * отраслевые лицензии (банковские, страховые, медицинские,
        фармацевтические, телеком, энергетические, образовательные);
      * допуски СРО;
      * специальные разрешения (на работу с гостайной, оружием,
        опасными веществами и т.п.).
    - Если лицензии упоминаются — вывод "yes".
    - Если лицензии не упоминаются — вывод "no".
    - Если неясно — вывод "unclear".

    Шаг 2 — НА КОГО ОФОРМЛЕНЫ ЛИЦЕНЗИИ
    (используется для заполнения поля "license_holder_type"):
    - Определи, на кого оформлены лицензии:
      * "target" — на Target (основное юрлицо сделки);
      * "subsidiary" — на дочернюю/зависимую компанию Target;
      * "parent" — на материнскую компанию;
      * "third_party" — на третье лицо (аутсорсер, «прокладка»,
        не связанная компания,на индивидуального лицензированного
        специалиста (врач, адвокат и т.п.), на несколько разных держателей);
      * "unclear" — неясно из текста.

    Шаг 3 — ЗАВИСИМОСТЬ ЛИЦЕНЗИЙ ОТ СТРУКТУРЫ ВЛАДЕНИЯ/КОНТРОЛЯ
    (используется для заполнения поля "depends_on_ownership"):
    - Определи, есть ли указания, что:
      * лицензия выдана с учётом конкретных бенефициаров,
        структуры группы, контролирующего лица;
      * при смене контроля/владения требуется:
        - согласие или уведомление регулятора,
        - re-licensing / переоформление,
        - повторная аккредитация;
      * изменение состава участников, контрольных пакетов
        или бенефициаров является условием сохранения лицензии.
    - Если такие зависимости есть — вывод "yes".
    - Если явно указано, что лицензии не зависят от структуры —
      вывод "no".
    - Если неясно — вывод "unclear".

    Шаг 4 — МЕХАНИЗМ СОХРАНЕНИЯ ЛИЦЕНЗИЙ ПРИ СДЕЛКЕ
    (используется для заполнения поля "preservation_mechanism"):
    - Определи, предусмотрен ли механизм сохранения лицензий
      при M&A-сделке:
      * согласованный с регулятором порядок перехода;
      * waiver от регулятора;
      * структура сделки, не требующая re-licensing;
      * transitional arrangements;
      * обязательства по переоформлению с временным продолжением
        деятельности.
    - Если такой механизм есть — вывод "yes".
    - Если нет — вывод "no".
    - Если неясно — вывод "unclear".

    Шаг 5 — РИСК УТРАТЫ ЛИЦЕНЗИЙ ИЗ-ЗА СДЕЛКИ
    (используется для заполнения поля "license_loss_risk"):
    - Оцени риск того, что сделка (change of control, реорганизация,
      отчуждение активов) приведёт к:
      * приостановке или аннулированию лицензий;
      * необходимости получать новую лицензию / проходить
        повторную аккредитацию;
      * существенным ограничениям лицензируемой деятельности.
    - Классифицируй риск:
      * "no" — явных рисков нет, либо предусмотрены понятные
        механизмы сохранения/переоформления;
      * "medium" — есть условия/риски, но с возможностью
        управляемого перехода;
      * "yes" — велика вероятность утраты/приостановки
        ключевых лицензий без понятного плана;
      * "unclear" — по фрагментам нельзя надёжно оценить.

    Шаг 6 — RED FLAGS
    (используется для заполнения поля "red_flags"):
    - Оцени наличие следующих рисковых факторов:

      * «REG4» — Критичные лицензии оформлены не на Target.
        Признаки:
        - has_key_licenses = "yes";
        - license_holder_type = "third_party" или "individual"
          (не аффилированное с Target лицо);
        - нет долгосрочных договоров / обеспечения доступа
          к лицензированной деятельности;
        - лицензия может быть «уведена» от Target.

      * «REG5» — Лицензии жёстко зависят от структуры
        владения (change of control trigger). Признаки:
        - depends_on_ownership = "yes";
        - при смене контроля требуется согласие регулятора
          или re-licensing;
        - preservation_mechanism = "no" или "unclear";
        - это создаёт существенный риск задержек или отказа
          в согласовании сделки.

      * «REG6» — Высокий риск утраты ключевых лицензий
        при сделке без ясного плана. Признаки:
        - license_loss_risk = "high";
        - has_key_licenses = "yes";
        - preservation_mechanism = "no";
        - нет заверений о сохранении лицензий.

    - Если лицензии оформлены на Target, не зависят от структуры
      владения (или есть ясный механизм сохранения), риск утраты
      низкий — верни "NONE".
    - Если данных недостаточно для оценки или текст противоречив —
      верни "UNCLEAR".
    - Формат: один или несколько кодов через запятую
      ("REG4", "REG5", "REG4, REG5, REG6"), "NONE" или "UNCLEAR".
      Без комментариев в этом поле — всё объясняющее в reason.

    Шаг 7 — ОБОСНОВАНИЕ
    (используется для заполнения поля "reason"):

    - В "reason" кратко обоснуй вывод:
      * ссылайся на ключевые формулировки (по возможности
        с короткими цитатами);
      * поясни, как лицензии и их привязка влияют на
        жизнеспособность Target после сделки;
      * если выставлены red_flags — объясни, почему именно
        эти коды.
    </instructions>

    <edge_cases>
    Обрабатывай пограничные ситуации так:

    - Ключевая лицензия оформлена на третье лицо (не Target,
      не аффилированное) или на «прокладку» без долгосрочного
      контроля:
      license_holder_type = "third_party";
      ставь REG4; это повышенный риск для устойчивости
      лицензируемой деятельности.

    - Лицензия оформлена на ключевого специалиста (врач,
      адвокат), который не является собственником/сотрудником
      Target:
      license_holder_type = "individual";
      ставь REG4; поясни риск в reason.

    - Лицензия принадлежит Target, но при смене контроля
      требуется согласие регулятора или существует риск
      аннулирования:
      depends_on_ownership = "yes";
      оценивай preservation_mechanism;
      если механизма нет — ставь REG5.

    - В договоре только общая формулировка "все необходимые
      лицензии и разрешения имеются" без конкретики:
      has_key_licenses = "unclear";
      отражай неопределённость как фактор риска;
      red_flags = "UNCLEAR" или REG4/REG5 в зависимости
      от контекста.

    - Явно сказано, что сделка не требует переоформления
      лицензий и не влияет на их действие (есть waiver,
      структура не триггерит change of control):
      preservation_mechanism = "yes";
      license_loss_risk = "low";
      это фактор снижения риска; red_flags = "NONE"
      (если нет других проблем).

    - Лицензии на дочернюю компанию, которая остаётся
      в периметре сделки:
      license_holder_type = "subsidiary";
      если контроль над дочкой сохраняется — это обычно
      приемлемо; риск "low" или "medium" в зависимости
      от структуры.

    - Упоминаются прошедшие сроки действия лицензий или
      необходимость продления:
      отметь это в licenses_list и reason;
      это может повышать license_loss_risk.

    - Пустые или явно нерелевантные фрагменты:
      укажи, что данных недостаточно для анализа лицензий.
      has_key_licenses = "unclear";
      red_flags = "UNCLEAR";
      overall_risk_level = "medium".
    </edge_cases>

    <output_expectations>
    На основе твоего анализа отдельный механизм извлечения сформирует
    структурированные поля по заранее заданной схеме. Твоя задача —
    давать чёткие юридические выводы и указывать конкретные формулировки
    из текста, на которых они основаны. Не генерируй JSON —
    просто излагай выводы структурированно и однозначно.
    </output_expectations>

  enabled: true
  mode: "hybrid"
  fields:
    - name: "has_key_licenses"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "license_holder_type"
      type: "string"
      allowed_values:
        - "target"
        - "subsidiary"
        - "parent"
        - "third_party"
        - "unclear"

    - name: "depends_on_ownership"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "preservation_mechanism"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "license_loss_risk"
      type: "string"
      allowed_values:
        - "low"
        - "medium"
        - "high"
        - "unclear"

    - name: "red_flags"
      type: "string"

    - name: "reason"
      type: "string"

  store_payload: true

red_flags:
  items:
    - code: "REG4"
      description: "Критичные лицензии оформлены не на Target."
    - code: "REG5"
      description: "Лицензии жёстко зависят от структуры владения (change of control trigger)."
    - code: "REG6"
      description: "Высокий риск утраты ключевых лицензий при M&A-сделке."