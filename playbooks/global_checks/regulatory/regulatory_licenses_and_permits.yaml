id: "regulatory_licenses_and_permits"
name: "Лицензии, разрешения и аккредитации"
description: >
  Анализирует положения о наличии лицензий, разрешений,
  аккредитаций: на кого оформлены, зависят ли от структуры
  владения / контроля, каков риск утраты при M&A-сделке.

  Извлекает: наличие ключевых лицензий, держателя лицензии,
  зависимость от структуры владения, механизмы сохранения
  лицензий при сделке, уровень риска утраты.

  Формирует краткий user-facing вывод и оценивает критичность
  лицензий для деятельности Target.

doc_types: []

severity: "high"
severity_if_fail: "critical"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"
ui_mode: "field_extraction"

rules:
  keyword_mode: any

  keywords:
    high:
      # Конкретные типы критичных лицензий
      - "(?i)банковск[а-я]+\\s+лицензи[яию]"
      - "(?i)banking\\s+licen[cs]e"
      - "(?i)лицензи[яи]\\s+ЦБ"
      - "(?i)страхов[а-я]+\\s+лицензи[яию]"
      - "(?i)insurance\\s+licen[cs]e"
      - "(?i)медицинск[а-я]+\\s+лицензи[яию]"
      - "(?i)лицензи[яи]\\s+на\\s+медицинск[а-я]+\\s+деятельность"
      - "(?i)pharmaceutical\\s+licen[cs]e"
      - "(?i)фармацевтическ[а-я]+\\s+лицензи[яию]"
      - "(?i)телеком[а-я]*\\s+лицензи[яию]"
      - "(?i)telecommunications?\\s+licen[cs]e"
      - "(?i)лицензи[яи]\\s+на\\s+связь"
      - "(?i)лицензи[яи]\\s+Роскомнадзор"
      - "(?i)energy\\s+(generation|supply)\\s+licen[cs]e"
      - "(?i)лицензи[яи]\\s+на\\s+(генераци|добыч|переработк)"
      - "(?i)образовательн[а-я]+\\s+лицензи[яию]"

      # Change of control и лицензии
      - "(?i)change\\s+of\\s+control\\s+[\\s\\S]{0,40}(licen[cs]e|permit|approval)"
      - "(?i)смен[аы]\\s+контрол[яи]\\s+[\\s\\S]{0,40}лицензи"
      - "(?i)(licen[cs]e|permit)\\s+[\\s\\S]{0,40}(revoke|suspend|terminate|cancel)\\s+[\\s\\S]{0,40}(change|transfer)"
      - "(?i)re[-\\s]?licen[cs]ing"
      - "(?i)перелицензирован[иея]"
      - "(?i)переоформлени[ея]\\s+лицензи"

      # Регуляторное согласие
      - "(?i)regulatory\\s+(consent|approval)\\s+[\\s\\S]{0,40}(transfer|change)"
      - "(?i)согласи[ея]\\s+регулятор[ау]\\s+[\\s\\S]{0,40}(смен|передач)"
      - "(?i)notification\\s+to\\s+[\\s\\S]{0,30}(regulator|authority)\\s+[\\s\\S]{0,30}(change|transfer)"
      - "(?i)уведомлени[ея]\\s+регулятор[ау][\\s\\S]{0,30}(смен|передач)"

    medium:
      # Лицензии и разрешения — общие упоминания
      - "(?i)\\bлицензи[яию]\\b"
      - "(?i)\\blicen[cs]e[sd]?\\b"
      - "(?i)\\bpermit[s]?\\b"
      - "(?i)\\bразрешени[ея]\\b"
      - "(?i)\\bаккредитаци[яию]\\b"
      - "(?i)\\baccreditation\\b"
      - "(?i)разрешительн[а-я]+\\s+документаци"
      - "(?i)регистрационн[а-я]+\\s+удостоверени"
      - "(?i)operating\\s+licen[cs]e"

      # Сертификаты и допуски
      - "(?i)сертификат\\s+соответстви[яи]"
      - "(?i)допуск\\s+СРО"
      - "(?i)членств[оа]\\s+в\\s+СРО"
      - "(?i)свидетельств[оа]\\s+о\\s+допуск"

      # Держатель лицензии
      - "(?i)licen[cs]e\\s+holder"
      - "(?i)держатель\\s+лицензи"
      - "(?i)лицензиат"
      - "(?i)licensee"
      - "(?i)issued\\s+to"
      - "(?i)выдан[ао]?\\s+[\\s\\S]{0,20}(компании|обществу|организации)"

      # Срок действия
      - "(?i)licen[cs]e\\s+(validity|term|expir)"
      - "(?i)срок\\s+действи[яи]\\s+лицензи"
      - "(?i)продлени[ея]\\s+лицензи"
      - "(?i)renewal\\s+of\\s+licen[cs]e"

      # Зависимость от владения
      - "(?i)ownership\\s+structure\\s+[\\s\\S]{0,40}licen[cs]e"
      - "(?i)структур[аы]\\s+владени[яи]\\s+[\\s\\S]{0,40}лицензи"
      - "(?i)beneficial\\s+owner\\s+[\\s\\S]{0,40}licen[cs]e"
      - "(?i)бенефициар[а-я]*\\s+[\\s\\S]{0,40}лицензи"

    low:
      - "(?i)change\\s+of\\s+control[\\s\\S]{0,20}licen[cs]e"
      - "(?i)re[-\\s]?licen[cs]ing"
      - "(?i)переоформление\\s+лицензи"
      - "(?i)regulatory\\s+consent[\\s\\S]{0,20}(transfer|change)"
      - "(?i)согласие\\s+регулятора"
      - "(?i)банковская\\s+лицензия"
      - "(?i)медицинская\\s+лицензия"
      - "(?i)лицензия\\s+Роскомнадзор"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 640

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  context_k: 5
  max_chunks: 10
  boost_keywords:
    - "лицензия"
    - "лицензии"
    - "license"
    - "licenses"
    - "permit"
    - "permits"
    - "разрешение"
    - "аккредитация"
    - "accreditation"
    - "регистрационное удостоверение"
    - "банковская лицензия"
    - "медицинская лицензия"
    - "телеком лицензия"
    - "license holder"
    - "держатель лицензии"
    - "change of control"
    - "смена контроля"
    - "re-licensing"
    - "переоформление лицензии"
    - "regulatory consent"
    - "согласие регулятора"
    - "revocation"
    - "аннулирование"
    - "suspension"
    - "приостановление"
    - "ownership structure"
    - "beneficial owner"
  rerank: true
  filters: {}

conditional: null

enrichment_hints:
  preferred_segment_types:
    - "contract"
    - "annex"
    - "appendix"
    - "amendment"
  excluded_segment_types:
    - "technical_specification"
    - "price_list"
    - "invoice"
    - "act"
  preferred_clause_functions:
    - "representations_warranties"
    - "change_of_control"
    - "general_provisions"
  confidence_bonus_on_match: 0.10
  confidence_penalty_on_excluded_segment: 0.15

extraction:
  enabled: true
  mode: "hybrid"
  llm_max_tokens: 440
  llm_prompt_extraction: |
    <role>
    Ты — юрист по регуляторному комплаенсу и M&A.
    Твоя задача — точно извлечь из текста:
    1) есть ли упоминания ключевых лицензий / разрешений;
    2) на кого они оформлены;
    3) зависят ли от структуры владения / контроля;
    4) есть ли механизм сохранения при M&A;
    5) каков уровень риска утраты лицензий.
    </role>

    <context>
    Ниже приведены релевантные фрагменты договора:

    {context}
    </context>

    <task>
    Заполни только следующие поля:
    - licenses_display
    - has_key_licenses
    - licenses_summary
    - license_holder_type
    - depends_on_ownership
    - preservation_mechanism
    - license_loss_risk
    - red_flags
    - reason

    Важно:
    - не придумывай данные о лицензиях если их нет в тексте;
    - пиши user-facing значения коротко и по-русски.
    </task>

    <instructions>
    Шаг 1 — НАЛИЧИЕ КЛЮЧЕВЫХ ЛИЦЕНЗИЙ

    Заполни поле "has_key_licenses".

    Значения:
    - "yes" — упоминаются лицензии, разрешения, аккредитации,
      без которых деятельность невозможна или существенно
      ограничена.
    - "no" — лицензии не упоминаются.
    - "unclear" — неясно.

    Шаг 2 — ОПИСАНИЕ ЛИЦЕНЗИЙ

    Заполни поле "licenses_summary".

    Правила:
    - Кратко опиши выявленные лицензии через ";":
      * "Банковская лицензия ЦБ; страховая лицензия"
      * "Медицинская лицензия; образовательная лицензия"
    - Если не упоминаются: "Не выявлено"
    - Если неясно: "Не удалось определить"

    Шаг 3 — НА КОГО ОФОРМЛЕНЫ ЛИЦЕНЗИИ

    Заполни поле "license_holder_type".

    Значения:
    - "target" — на Target (основное юрлицо сделки).
    - "subsidiary" — на дочернюю / зависимую компанию Target.
    - "parent" — на материнскую компанию.
    - "third_party" — на третье лицо или индивидуального
      лицензированного специалиста, не аффилированного
      с Target.
    - "mixed" — на нескольких разных держателей.
    - "not_applicable" — лицензий нет.
    - "unclear" — неясно.

    Шаг 4 — ЗАВИСИМОСТЬ ОТ СТРУКТУРЫ ВЛАДЕНИЯ

    Заполни поле "depends_on_ownership".

    Значения:
    - "yes" — при смене контроля / владения требуется:
      согласие или уведомление регулятора, re-licensing,
      повторная аккредитация; или лицензия выдана с учётом
      конкретных бенефициаров / структуры.
    - "no" — явно указано, что лицензии не зависят
      от структуры.
    - "unclear" — неясно.

    Шаг 5 — МЕХАНИЗМ СОХРАНЕНИЯ ЛИЦЕНЗИЙ

    Заполни поле "preservation_mechanism".

    Значения:
    - "yes" — предусмотрен механизм: согласованный с
      регулятором порядок, waiver, transitional arrangements,
      обязательства по переоформлению.
    - "no" — механизма нет.
    - "not_applicable" — лицензий нет или не зависят от CoC.
    - "unclear" — неясно.

    Шаг 6 — РИСК УТРАТЫ ЛИЦЕНЗИЙ

    Заполни поле "license_loss_risk".

    Значения:
    - "low" — нет явных рисков или есть ясные механизмы
      сохранения / переоформления.
    - "medium" — есть условия / риски, но с возможностью
      управляемого перехода.
    - "high" — велика вероятность утраты / приостановки
      ключевых лицензий без понятного плана.
    - "unclear" — нельзя надёжно оценить.

    Шаг 7 — RED FLAGS

    Заполни поле "red_flags".

    Используй:
    - "NONE" — лицензии на Target, не зависят от CoC
      или есть ясный механизм сохранения, риск утраты низкий.
    - "UNCLEAR" — данных недостаточно.
    - Коды через запятую:
      * REG4 — критичные лицензии оформлены не на Target
        (third_party или individual), нет долгосрочного
        обеспечения доступа.
      * REG5 — лицензии жёстко зависят от структуры владения
        (CoC trigger), нет механизма сохранения.
      * REG6 — высокий риск утраты ключевых лицензий при
        сделке без ясного плана.

    Шаг 8 — USER-FACING SUMMARY

    Заполни поле "licenses_display".

    Примеры:
    - "Банковская лицензия ЦБ; на Target; зависит от CoC;
       согласие ЦБ необходимо"
    - "Медицинская лицензия; на дочерней компании;
       нет CoC-зависимости"
    - "Лицензия на третье лицо; без механизма сохранения"
    - "Лицензии не выявлены"
    - "Не удалось определить наличие лицензий"

    Правила:
    - Отрази максимум 4 ключевых факта через ";".
    - Если лицензий нет: "Лицензии не выявлены"
    - Если всё unclear:
      "Не удалось определить наличие лицензий"

    Шаг 9 — ОБОСНОВАНИЕ

    Заполни поле "reason".

    Правила:
    - 1–2 коротких предложения.
    - Укажи: тип лицензий, держатель, CoC-зависимость,
      механизм сохранения, риск утраты, почему red_flags.
    - Приведи короткую цитату в кавычках.
    - Если NONE — почему риск приемлем.
    </instructions>

    <edge_cases>
    - Лицензия на третье лицо без долгосрочного контроля:
      * license_holder_type = "third_party"
      * red_flags включает "REG4"

    - Лицензия на индивидуального специалиста:
      * license_holder_type = "third_party"
      * red_flags включает "REG4"
      * в reason: риск ухода ключевого лицензиата

    - Лицензия на Target, при CoC требуется согласие
      регулятора, механизма нет:
      * depends_on_ownership = "yes"
      * preservation_mechanism = "no"
      * red_flags включает "REG5"

    - Только "все необходимые лицензии имеются" без конкретики:
      * has_key_licenses = "unclear"
      * в reason: неопределённость как фактор риска

    - Структура сделки не триггерит CoC, waiver от регулятора:
      * depends_on_ownership = "no" или "yes"
      * preservation_mechanism = "yes"
      * license_loss_risk = "low"
      * red_flags = "NONE"

    - Лицензия на дочернюю компанию, контроль сохраняется:
      * license_holder_type = "subsidiary"
      * license_loss_risk = "low" или "medium"

    - Упоминаются истёкшие лицензии или необходимость продления:
      * в licenses_summary и reason — отметить
      * может повышать license_loss_risk

    - Нет релевантных фрагментов:
      * has_key_licenses = "unclear"
      * red_flags = "UNCLEAR"
      * licenses_display =
        "Не удалось определить наличие лицензий"
    </edge_cases>

    <output_expectations>
    Все значения должны быть короткими, точными и пригодными
    для отображения пользователю в DD Grid.
    Не добавляй никаких полей, кроме указанных в схеме extraction.
    </output_expectations>

  fields:
    - name: "licenses_display"
      type: "string"
      description: "Лицензии и разрешения: краткий вывод"

    - name: "has_key_licenses"
      type: "string"
      description: "Наличие ключевых лицензий"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "licenses_summary"
      type: "string"
      description: "Перечень выявленных лицензий"

    - name: "license_holder_type"
      type: "string"
      description: "Держатель лицензии"
      allowed_values:
        - "target"
        - "subsidiary"
        - "parent"
        - "third_party"
        - "mixed"
        - "not_applicable"
        - "unclear"

    - name: "depends_on_ownership"
      type: "string"
      description: "Зависимость лицензий от структуры владения"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "preservation_mechanism"
      type: "string"
      description: "Механизм сохранения лицензий при сделке"
      allowed_values:
        - "yes"
        - "no"
        - "not_applicable"
        - "unclear"

    - name: "license_loss_risk"
      type: "string"
      description: "Риск утраты лицензий при M&A"
      allowed_values:
        - "low"
        - "medium"
        - "high"
        - "unclear"

    - name: "red_flags"
      type: "string"
      description: "Коды рисков"

    - name: "reason"
      type: "string"
      description: "Обоснование"

  store_payload: true


  