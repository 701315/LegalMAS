id: "regulatory_licenses_and_permits"
name: "Лицензии, разрешения и аккредитации"
description: >
  Анализирует положения о наличии лицензий, разрешений, аккредитаций и их
  привязке к конкретным лицам, объектам и структуре владения.

doc_types: []

severity: "high"
severity_if_fail: "critical"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"

rules:
  keywords:
    - "лицензия"
    - "лицензии"
    - "license"
    - "permit"
    - "разрешение"
    - "разрешения"
    - "accreditation"
    - "аккредитация"
    - "разрешительная документация"
    - "регистрационное удостоверение"
    - "certificate"
  keyword_mode: "any"
  regex_patterns: []
  clause_patterns: []

llm:
  prompt_template: |
    <role>
    Ты — юрист по регуляторному комплаенсу.
    Твоя специализация — лицензируемые виды деятельности, разрешения и аккредитации,
    а также их зависимость от структуры владения и контроля.
    </role>

    <context>
    Ниже приведены фрагменты договора или связанных документов, где могут
    упоминаться лицензии, разрешения, аккредитации и иная разрешительная документация:

    {context}
    </context>

    <instructions>
    Проведи анализ по шагам. Каждый шаг логически связан с одним или
    несколькими полями итоговой оценки.

    Шаг 1 — НАЛИЧИЕ КЛЮЧЕВЫХ ЛИЦЕНЗИЙ/РАЗРЕШЕНИЙ
    (используется для "mentions_key_licenses_or_permits"):
    - Определи, упоминаются ли лицензии, разрешения, аккредитации,
      регистрационные удостоверения, сертификаты:
      * без которых деятельность Target или объекта сделки невозможна
        или существенно ограничена;
      * отраслевые (банковские/финансовые, медицинские, образовательные,
        телеком, энергетика и т.п.).
    - Сформулируй вывод: yes / no / unclear.

    Шаг 2 — НА КОГО ОФОРМЛЕНЫ ЛИЦЕНЗИИ
    (используется для "license_holder_description"):
    - Опиши, на кого по тексту оформлены такие лицензии/разрешения:
      * конкретное юрлицо (Target, дочерняя, материнская компания);
      * филиал/подразделение;
      * индивидуальный лицензируемый специалист;
      * третье лицо (аутсорсер, «прокладка» и т.п.).
    - Дай краткое текстовое резюме без домыслов, опираясь на формулировки фрагментов.

    Шаг 3 — ЗАВИСИМОСТЬ ЛИЦЕНЗИЙ ОТ СТРУКТУРЫ ВЛАДЕНИЯ/КОНТРОЛЯ
    (используется для "licenses_depend_on_ownership_or_control_structure"):
    - Определи, есть ли указания, что:
      * лицензия выдана с учётом конкретных бенефициаров, структуры группы,
        контролирующего лица;
      * при смене контроля/владения требуется согласие или уведомление регулятора,
        re-licensing, повторная аккредитация;
      * изменение состава участников, контрольных пакетов или бенефициаров
        является условием сохранения лицензии.
    - Сформулируй вывод: yes / no / unclear.

    Шаг 4 — РИСК УТРАТЫ ЛИЦЕНЗИЙ ИЗ-ЗА СДЕЛКИ
    (используется для "risk_of_license_loss_on_transaction"):
    - Оцени риск того, что сделка (change of control, реорганизация, отчуждение активов)
      приведёт к:
      * приостановке или аннулированию лицензий;
      * необходимости получать новую лицензию или проходить повторную аккредитацию;
      * существенным ограничениям по лицензируемой деятельности.
    - Классифицируй риск как:
      * low — явных рисков нет, либо предусмотрены понятные механизмы
        сохранения/переоформления;
      * medium — есть условия/риски, но с возможностью управляемого перехода;
      * high — велика вероятность утраты/приостановки ключевых лицензий
        без понятного плана;
      * unclear — по фрагментам нельзя надёжно оценить.

    Шаг 5 — ОБЩИЙ РИСК ДЛЯ TARGET
    (используется для "overall_risk_level" и "reason"):
    - Оцени общий риск для Target, учитывая:
      * наличие и ясность описания ключевых лицензий;
      * на кого они оформлены и насколько структура под контролем группы;
      * зависимость лицензий от структуры владения/контроля;
      * риск утраты лицензий в связи со сделкой.
    - Сформулируй общий уровень риска как low / medium / high.
    - В "reason" кратко обоснуй вывод, ссылаясь на ключевые формулировки
      (желательно с короткими цитатами) и пояснив, как лицензии и их
      привязка к структуре владения влияют на жизнеспособность Target после сделки.
    </instructions>

    <edge_cases>
    Обрабатывай пограничные ситуации так:

    - Ключевая лицензия оформлена на третье лицо (не Target) или на отдельную
      "прокладку" без долгосрочного контроля и без ясной схемы обеспечения доступа:
      учитывай это как повышенный риск для устойчивости лицензируемой деятельности.

    - Лицензия принадлежит Target, но при смене контроля требуется согласие
      регулятора или существует риск аннулирования:
      отмечай зависимость от структуры владения и учитывай повышенный риск
      при планировании сделки.

    - В договоре только общая формулировка "все необходимые лицензии и разрешения имеются"
      без конкретики и без привязки к структуре владения:
      отражай неопределённость как отдельный фактор риска, особенно если
      лицензии потенциально критичны.

    - Явно сказано, что сделка не требует переоформления лицензий и не влияет
      на их действие (есть согласованный с регулятором механизм или структура группы):
      учитывай это как фактор снижения риска потери лицензий.

    - Пустые или явно нерелевантные фрагменты:
      укажи, что данных недостаточно для анализа лицензий, их держателей и влияния
      сделки на их сохранность, и поясни, как это повышает неопределённость
      общего риска.
    </edge_cases>

    <output_expectations>
    На основе твоего анализа отдельный механизм извлечения сформирует
    структурированные поля по заранее заданной схеме. Твоя задача —
    давать чёткие юридические выводы и указывать конкретные формулировки
    из текста, на которых они основаны.
    </output_expectations>
  prompt_file: null
  context_k: 5
  temperature: 0.0
  max_tokens: 640

evidence:
  required: false
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  context_k: 5
  max_chunks: 10
  boost_keywords:
    - "лицензия"
    - "license"
    - "permit"
    - "аккредитация"
    - "регистрационное удостоверение"
  rerank: true
  filters: {}

conditional: null

extraction:
  enabled: true
  mode: "hybrid"
  fields:
    - name: "mentions_key_licenses_or_permits"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "license_holder_description"
      type: "string"

    - name: "licenses_depend_on_ownership_or_control_structure"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "risk_of_license_loss_on_transaction"
      type: "string"
      allowed_values:
        - "low"
        - "medium"
        - "high"
        - "unclear"

    - name: "overall_risk_level"
      type: "string"
      allowed_values:
        - "low"
        - "medium"
        - "high"

    - name: "reason"
      type: "string"

  store_payload: true

red_flags:
  items:
    - code: "REG1"
      description: "Критичные лицензии оформлены не на Target или жестко завязаны на текущую структуру владения."
    - code: "REG2"
      description: "Есть риск утраты ключевых лицензий при смене контроля/структуры без ясного плана."
