id: "regulatory_licenses_and_permits"
name: "Лицензии, разрешения и аккредитации"
group: "Regulatory"
description: >
  Анализирует положения о наличии лицензий, разрешений,
  аккредитаций: на кого оформлены, зависят ли от структуры
  владения / контроля, каков риск утраты при M&A-сделке.

  Извлекает: наличие ключевых лицензий, держателя лицензии,
  зависимость от структуры владения, механизмы сохранения
  лицензий при сделке, уровень риска утраты.

  Формирует краткий user-facing вывод и оценивает критичность
  лицензий для деятельности Target.

doc_types: []

severity: "high"
severity_if_fail: "critical"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"
ui_mode: "field_extraction"

rules:
  keyword_mode: any

  keywords:
    high:
      # Конкретные типы критичных лицензий
      - "(?i)банковск[а-я]+\\s+лицензи[яию]"
      - "(?i)banking\\s+licen[cs]e"
      - "(?i)лицензи[яи]\\s+ЦБ"
      - "(?i)страхов[а-я]+\\s+лицензи[яию]"
      - "(?i)insurance\\s+licen[cs]e"
      - "(?i)медицинск[а-я]+\\s+лицензи[яию]"
      - "(?i)лицензи[яи]\\s+на\\s+медицинск[а-я]+\\s+деятельность"
      - "(?i)pharmaceutical\\s+licen[cs]e"
      - "(?i)фармацевтическ[а-я]+\\s+лицензи[яию]"
      - "(?i)телеком[а-я]*\\s+лицензи[яию]"
      - "(?i)telecommunications?\\s+licen[cs]e"
      - "(?i)лицензи[яи]\\s+на\\s+связь"
      - "(?i)лицензи[яи]\\s+Роскомнадзор"
      - "(?i)energy\\s+(generation|supply)\\s+licen[cs]e"
      - "(?i)лицензи[яи]\\s+на\\s+(генераци|добыч|переработк)"
      - "(?i)образовательн[а-я]+\\s+лицензи[яию]"

      # Change of control и лицензии
      - "(?i)change\\s+of\\s+control\\s+[\\s\\S]{0,40}(licen[cs]e|permit|approval)"
      - "(?i)смен[аы]\\s+контрол[яи]\\s+[\\s\\S]{0,40}лицензи"
      - "(?i)(licen[cs]e|permit)\\s+[\\s\\S]{0,40}(revoke|suspend|terminate|cancel)\\s+[\\s\\S]{0,40}(change|transfer)"
      - "(?i)re[-\\s]?licen[cs]ing"
      - "(?i)перелицензирован[иея]"
      - "(?i)переоформлени[ея]\\s+лицензи"

      # Регуляторное согласие
      - "(?i)regulatory\\s+(consent|approval)\\s+[\\s\\S]{0,40}(transfer|change)"
      - "(?i)согласи[ея]\\s+регулятор[ау]\\s+[\\s\\S]{0,40}(смен|передач)"
      - "(?i)notification\\s+to\\s+[\\s\\S]{0,30}(regulator|authority)\\s+[\\s\\S]{0,30}(change|transfer)"
      - "(?i)уведомлени[ея]\\s+регулятор[ау][\\s\\S]{0,30}(смен|передач)"

    medium:
      # Лицензии и разрешения — общие упоминания
      - "(?i)\\bлицензи[яию]\\b"
      - "(?i)\\blicen[cs]e[sd]?\\b"
      - "(?i)\\bpermit[s]?\\b"
      - "(?i)\\bразрешени[ея]\\b"
      - "(?i)\\bаккредитаци[яию]\\b"
      - "(?i)\\baccreditation\\b"
      - "(?i)разрешительн[а-я]+\\s+документаци"
      - "(?i)регистрационн[а-я]+\\s+удостоверени"
      - "(?i)operating\\s+licen[cs]e"

      # Сертификаты и допуски
      - "(?i)сертификат\\s+соответстви[яи]"
      - "(?i)допуск\\s+СРО"
      - "(?i)членств[оа]\\s+в\\s+СРО"
      - "(?i)свидетельств[оа]\\s+о\\s+допуск"

      # Держатель лицензии
      - "(?i)licen[cs]e\\s+holder"
      - "(?i)держатель\\s+лицензи"
      - "(?i)лицензиат"
      - "(?i)licensee"
      - "(?i)issued\\s+to"
      - "(?i)выдан[ао]?\\s+[\\s\\S]{0,20}(компании|обществу|организации)"

      # Срок действия
      - "(?i)licen[cs]e\\s+(validity|term|expir)"
      - "(?i)срок\\s+действи[яи]\\s+лицензи"
      - "(?i)продлени[ея]\\s+лицензи"
      - "(?i)renewal\\s+of\\s+licen[cs]e"

      # Зависимость от владения
      - "(?i)ownership\\s+structure\\s+[\\s\\S]{0,40}licen[cs]e"
      - "(?i)структур[аы]\\s+владени[яи]\\s+[\\s\\S]{0,40}лицензи"
      - "(?i)beneficial\\s+owner\\s+[\\s\\S]{0,40}licen[cs]e"
      - "(?i)бенефициар[а-я]*\\s+[\\s\\S]{0,40}лицензи"

    low:
      - "(?i)change\\s+of\\s+control[\\s\\S]{0,20}licen[cs]e"
      - "(?i)re[-\\s]?licen[cs]ing"
      - "(?i)переоформление\\s+лицензи"
      - "(?i)regulatory\\s+consent[\\s\\S]{0,20}(transfer|change)"
      - "(?i)согласие\\s+регулятора"
      - "(?i)банковская\\s+лицензия"
      - "(?i)медицинская\\s+лицензия"
      - "(?i)лицензия\\s+Роскомнадзор"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 640

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  retrieval_profile: "registration_check"
  context_k: 5
  max_chunks: 10
  
  retrieval_query: >
    лицензия лицензиат разрешение аккредитация license permit regulatory consent 
    переоформление смена контроля change of control ownership

  boost_keywords:
    - "лицензия"
    - "лицензии"
    - "license"
    - "licenses"
    - "permit"
    - "permits"
    - "разрешение"
    - "аккредитация"
    - "accreditation"
    - "регистрационное удостоверение"
    - "банковская лицензия"
    - "медицинская лицензия"
    - "телеком лицензия"
    - "license holder"
    - "держатель лицензии"
    - "change of control"
    - "смена контроля"
    - "re-licensing"
    - "переоформление лицензии"
    - "regulatory consent"
    - "согласие регулятора"
    - "revocation"
    - "аннулирование"
    - "suspension"
    - "приостановление"
    - "ownership structure"
    - "beneficial owner"

  negative_keywords:
    - "интеллектуальная собственность"
    - "авторские права"
    - "условия оплаты"
    - "форс-мажор"
    - "коммерческая тайна"

  preferred_unit_types:
    - "general_provision"
    - "obligation"

  excluded_unit_types:
    - "technical_fragment"
    - "appendix_reference"
    - "structural_anchor"

  preferred_clause_functions:
    - "representations"
    - "procedures"
    - "obligations"

  position_bias:
    preferred_range: [0.0, 1.0]
    boost: 0.10
    scope: "segment"

  rerank: true
  filters: {}

conditional: null

enrichment_hints:
  preferred_segment_types:
    - "contract"
    - "annex"
    - "appendix"
    - "amendment"
  excluded_segment_types:
    - "technical_specification"
    - "price_list"
    - "invoice"
    - "act"
  confidence_bonus_on_match: 0.10
  confidence_penalty_on_excluded_segment: 0.15

extraction:
  enabled: true
  mode: "hybrid"
  llm_max_tokens: 1100

  presence_signal:
    field: "regulatory_licenses_status"
    present_values: ["present"]
    missing_values: ["missing"]
    unclear_values: ["unclear"]

  llm_prompt_extraction: |
    <role>
    Ты — юрист по регуляторному комплаенсу, лицензированию и M&A.
    Твоя задача — точно извлечь из текста:
    1) есть ли в договоре регулирование лицензий / разрешений;
    2) если есть — какие условия установлены:
       - наличие ключевых лицензий / разрешений / аккредитаций;
       - на кого они оформлены;
       - зависят ли они от структуры владения / контроля;
       - есть ли механизм сохранения при изменении контроля
         или ином корпоративном событии.

    КРИТИЧЕСКИ ВАЖНО:
    - Извлекай ТОЛЬКО то, что прямо написано в тексте.
    - НЕ придумывай лицензии, если их нет в тексте.
    - НЕ считай общую фразу "все необходимые лицензии имеются"
      достаточным подтверждением конкретных ключевых лицензий.
    - Если раздел о лицензиях / разрешениях в договоре отсутствует
      полностью — regulatory_licenses_status = "missing".
    - Если тексты по теме есть, но надёжный вывод сделать нельзя —
      regulatory_licenses_status = "unclear".
    </role>

    <context_rules>
    - Некоторые фрагменты могут быть нерелевантны — игнорируй их.
    - Если фрагменты противоречат друг другу — используй "unclear"
      и кратко объясни это в reason.
    - К ключевым лицензиям относись только если по тексту видно,
      что они существенны для деятельности или прямо перечислены.
    - Если есть только абстрактная фраза про наличие лицензий
      без конкретики, не ставь "yes" автоматически.
    - Зависимость от ownership / control считай только если
      это прямо указано: согласие регулятора, переоформление,
      re-licensing, change of control condition.
    - Если ни один фрагмент не содержит информации о лицензиях /
      разрешениях (нет упоминаний licen[cs]e / permit / accreditation /
      regulatory consent) — regulatory_licenses_status = "missing",
      location = null. Не использовать "unclear" при полном отсутствии
      релевантных фрагментов.
    </context_rules>

    <context>
    Ниже приведены релевантные фрагменты договора:

    {context}
    </context>

    <task>
    Заполни только следующие поля:
    - licenses_display
    - regulatory_licenses_status
    - has_key_licenses
    - licenses_summary
    - license_holder_type
    - depends_on_ownership
    - preservation_mechanism
    - reason
    </task>

    <location_instructions>
    Для каждого поля по возможности укажи location в формате:
    {"clause_ref": "п. 12.1", "page": 7, "quote": "дословная фраза из договора"}

    Правила:
    - clause_ref — короткая ссылка на пункт / раздел / статью именно в том
      виде, как она написана в договоре;
    - page — целое число страницы;
    - quote — дословная фраза из текста договора (НЕ пересказ, НЕ парафраз).
      Копируй её посимвольно, сохраняя формулировку и порядок слов.
      Оптимальная длина: 30–300 символов.
    - Для synthesized-полей (licenses_display, licenses_summary,
      reason) location ВСЕГДА null.
    - Для regulatory_licenses_status = "missing" — location = null.
    - Для regulatory_licenses_status = "present" / "unclear" — quote
      с наиболее релевантной фразой договора.
    - Для has_key_licenses:
      * если "yes" — quote с упоминанием конкретной лицензии;
      * если "no" — различай два случая:
        - договор ПРЯМО фиксирует отсутствие лицензий — quote
          ОБЯЗАТЕЛЬНА;
        - просто отсутствует упоминание — location = null;
      * если "unclear" — location = null или quote с общей
        фразой без конкретики.
    - Для license_holder_type, depends_on_ownership,
      preservation_mechanism:
      * если значение определённое ("target" / "subsidiary" /
        "parent" / "third_party" / "mixed" / "yes") — quote
        с фразой-основанием;
      * если значение = "no" / "not_applicable" — различай:
        - договор ПРЯМО фиксирует отсутствие / неприменимость —
          quote ОБЯЗАТЕЛЬНА;
        - просто отсутствует упоминание — location = null;
      * если значение = "unclear" — location = null.
    - Не выдумывай location или quote. Если дословную фразу определить
      нельзя — location = null.
    </location_instructions>

    <instructions>
    Шаг 0 — НАЛИЧИЕ РЕГУЛИРОВАНИЯ ЛИЦЕНЗИЙ

    Заполни "regulatory_licenses_status".

    Значения:
    - "present" — если хотя бы одно содержательное поле указывает
      на наличие информации по теме:
      * has_key_licenses = "yes";
      * license_holder_type ∈ {"target", "subsidiary", "parent",
        "third_party", "mixed"};
      * depends_on_ownership = "yes";
      * preservation_mechanism = "yes";
      * ЛИБО любое поле = "no" / "not_applicable", но с заполненным
        location с прямой цитатой (см. RF3).
    - "missing" — если все содержательные поля = "no" /
      "not_applicable" БЕЗ цитат, ЛИБО фрагментов по теме нет вообще.
    - "unclear" — если все содержательные = "unclear" при наличии
      фрагментов, но невозможности вывода.

    Шаг 1 — НАЛИЧИЕ КЛЮЧЕВЫХ ЛИЦЕНЗИЙ

    Заполни "has_key_licenses".

    Значения:
    - "yes" — упоминаются конкретные лицензии, разрешения,
      аккредитации или иные критичные допуски.
    - "no" — лицензии не упоминаются.
    - "unclear" — есть только общие фразы или вывод ненадёжен.

    Шаг 2 — ОПИСАНИЕ ЛИЦЕНЗИЙ

    Заполни "licenses_summary".

    Правила:
    - Кратко через ";", не более 3 позиций:
      "Банковская лицензия ЦБ; страховая лицензия"
      "Медицинская лицензия; образовательная лицензия"
    - Если лицензий нет: "Не выявлено"
    - Если нельзя определить: "Не удалось определить"

    Шаг 3 — ДЕРЖАТЕЛЬ ЛИЦЕНЗИЙ

    Заполни "license_holder_type".

    Значения:
    - "target" — лицензии оформлены на Target.
    - "subsidiary" — на дочернюю / зависимую компанию.
    - "parent" — на материнскую компанию.
    - "third_party" — на третье лицо или лицензированного специалиста.
    - "mixed" — несколько держателей.
    - "not_applicable" — лицензий нет.
    - "unclear" — нельзя определить.

    Шаг 4 — ЗАВИСИМОСТЬ ОТ СТРУКТУРЫ ВЛАДЕНИЯ

    Заполни "depends_on_ownership".

    Значения:
    - "yes" — при смене контроля / владения требуется
      согласие регулятора, переоформление, re-licensing,
      повторная аккредитация или аналогичное действие.
    - "no" — по тексту такой зависимости нет.
    - "unclear" — нельзя определить.

    Шаг 5 — МЕХАНИЗМ СОХРАНЕНИЯ

    Заполни "preservation_mechanism".

    Значения:
    - "yes" — предусмотрен механизм сохранения:
      согласование с регулятором, waiver, transitional arrangements,
      обязательство по переоформлению.
    - "no" — механизма нет.
    - "not_applicable" — лицензий нет или зависимость от ownership
      не выявлена.
    - "unclear" — нельзя определить.

    Шаг 6 — НОРМАЛИЗОВАННЫЙ DISPLAY ДЛЯ DD GRID

    Заполни "licenses_display".

    Это итоговое поле для таблицы.
    Строй его ТОЛЬКО на основе уже заполненных полей выше.
    Не добавляй информацию сверх них.

    Правила:
    - Если regulatory_licenses_status = "missing":
      "Лицензии не выявлены"
    - Если all поля unclear:
      "Не удалось определить наличие лицензий"
    - Если has_key_licenses = "no":
      "Лицензии не выявлены"
    - Иначе комбинируй через ";":
      * licenses_summary
      * если license_holder_type = "subsidiary":
        "на дочерней компании"
      * если license_holder_type = "parent":
        "на материнской компании"
      * если license_holder_type = "third_party":
        "на третьем лице"
      * если license_holder_type = "mixed":
        "смешанный держатель"
      * если depends_on_ownership = "yes":
        "зависят от структуры владения"
      * если depends_on_ownership = "no":
        "не зависят от структуры владения"
      * если preservation_mechanism = "yes":
        "есть механизм сохранения"
      * если preservation_mechanism = "no" и depends_on_ownership = "yes":
        "механизм сохранения не указан"
    - Не более 4 коротких фактов через ";".

    Шаг 7 — КРАТКОЕ ОБОСНОВАНИЕ

    Заполни "reason".

    Правила:
    - Первое предложение — краткий вывод.
    - Второе — короткая цитата из текста (до 100 символов).
    - Пиши по-русски.
    </instructions>

    <edge_cases>
    - Лицензия на третье лицо:
      * regulatory_licenses_status = "present"
      * license_holder_type = "third_party"

    - Лицензия на Target, есть CoC-зависимость, механизма нет:
      * regulatory_licenses_status = "present"
      * depends_on_ownership = "yes"
      * preservation_mechanism = "no"

    - "Все необходимые лицензии имеются" без конкретики:
      * regulatory_licenses_status = "present"
      * has_key_licenses = "unclear"
      * licenses_summary = "Не удалось определить"

    - Waiver / transitional arrangement предусмотрены:
      * regulatory_licenses_status = "present"
      * preservation_mechanism = "yes"

    - Договор прямо фиксирует отсутствие лицензий:
      * regulatory_licenses_status = "present"
      * has_key_licenses = "no"
      * location с прямой цитатой об отсутствии.

    - Нет релевантных фрагментов / раздел о лицензиях
      в договоре отсутствует:
      * regulatory_licenses_status = "missing"
      * has_key_licenses = "no"
      * licenses_summary = "Не выявлено"
      * license_holder_type = "not_applicable"
      * depends_on_ownership = "no"
      * preservation_mechanism = "not_applicable"
      * licenses_display = "Лицензии не выявлены"
      * location у всех полей = null.

    - Формулировки есть, но вывод невозможен:
      * regulatory_licenses_status = "unclear"
      * соответствующие поля = "unclear"
    </edge_cases>

    <output_expectations>
    - Верни результат строго в формате JSON.
    - Не оборачивай в markdown-блоки (без ```).
    - Не добавляй комментариев вне JSON.
    - Все значения полей с allowed_values — на английском.
    - Свободные текстовые поля (licenses_display, licenses_summary,
      reason) — на русском языке.
    - Не добавляй полей, кроме указанных.
    - Для каждого поля возвращай объект с ключами
      "value", "confidence", "location".

    Пример структуры ответа:
    {
      "licenses_display": {"value": "Банковская лицензия ЦБ; на Target; зависят от структуры владения; есть механизм сохранения", "confidence": 0.92, "location": null},
      "regulatory_licenses_status": {"value": "present", "confidence": 0.95, "location": {"clause_ref": "п. 6.1", "page": 4, "quote": "Компания имеет банковскую лицензию ЦБ РФ № 1234"}},
