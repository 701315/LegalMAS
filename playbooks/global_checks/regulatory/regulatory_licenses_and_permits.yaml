id: "regulatory_licenses_and_permits"
name: "Лицензии, разрешения и аккредитации"
group: "Regulatory"
description: >
  Анализирует положения о наличии лицензий, разрешений,
  аккредитаций: на кого оформлены, зависят ли от структуры
  владения / контроля, каков риск утраты при M&A-сделке.

  Извлекает: наличие ключевых лицензий, держателя лицензии,
  зависимость от структуры владения, механизмы сохранения
  лицензий при сделке, уровень риска утраты.

  Формирует краткий user-facing вывод и оценивает критичность
  лицензий для деятельности Target.

doc_types: []

severity: "high"
severity_if_fail: "critical"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"
ui_mode: "field_extraction"

rules:
  keyword_mode: any

  keywords:
    high:
      # Конкретные типы критичных лицензий
      - "(?i)банковск[а-я]+\\s+лицензи[яию]"
      - "(?i)banking\\s+licen[cs]e"
      - "(?i)лицензи[яи]\\s+ЦБ"
      - "(?i)страхов[а-я]+\\s+лицензи[яию]"
      - "(?i)insurance\\s+licen[cs]e"
      - "(?i)медицинск[а-я]+\\s+лицензи[яию]"
      - "(?i)лицензи[яи]\\s+на\\s+медицинск[а-я]+\\s+деятельность"
      - "(?i)pharmaceutical\\s+licen[cs]e"
      - "(?i)фармацевтическ[а-я]+\\s+лицензи[яию]"
      - "(?i)телеком[а-я]*\\s+лицензи[яию]"
      - "(?i)telecommunications?\\s+licen[cs]e"
      - "(?i)лицензи[яи]\\s+на\\s+связь"
      - "(?i)лицензи[яи]\\s+Роскомнадзор"
      - "(?i)energy\\s+(generation|supply)\\s+licen[cs]e"
      - "(?i)лицензи[яи]\\s+на\\s+(генераци|добыч|переработк)"
      - "(?i)образовательн[а-я]+\\s+лицензи[яию]"

      # Change of control и лицензии
      - "(?i)change\\s+of\\s+control\\s+[\\s\\S]{0,40}(licen[cs]e|permit|approval)"
      - "(?i)смен[аы]\\s+контрол[яи]\\s+[\\s\\S]{0,40}лицензи"
      - "(?i)(licen[cs]e|permit)\\s+[\\s\\S]{0,40}(revoke|suspend|terminate|cancel)\\s+[\\s\\S]{0,40}(change|transfer)"
      - "(?i)re[-\\s]?licen[cs]ing"
      - "(?i)перелицензирован[иея]"
      - "(?i)переоформлени[ея]\\s+лицензи"

      # Регуляторное согласие
      - "(?i)regulatory\\s+(consent|approval)\\s+[\\s\\S]{0,40}(transfer|change)"
      - "(?i)согласи[ея]\\s+регулятор[ау]\\s+[\\s\\S]{0,40}(смен|передач)"
      - "(?i)notification\\s+to\\s+[\\s\\S]{0,30}(regulator|authority)\\s+[\\s\\S]{0,30}(change|transfer)"
      - "(?i)уведомлени[ея]\\s+регулятор[ау][\\s\\S]{0,30}(смен|передач)"

    medium:
      # Лицензии и разрешения — общие упоминания
      - "(?i)\\bлицензи[яию]\\b"
      - "(?i)\\blicen[cs]e[sd]?\\b"
      - "(?i)\\bpermit[s]?\\b"
      - "(?i)\\bразрешени[ея]\\b"
      - "(?i)\\bаккредитаци[яию]\\b"
      - "(?i)\\baccreditation\\b"
      - "(?i)разрешительн[а-я]+\\s+документаци"
      - "(?i)регистрационн[а-я]+\\s+удостоверени"
      - "(?i)operating\\s+licen[cs]e"

      # Сертификаты и допуски
      - "(?i)сертификат\\s+соответстви[яи]"
      - "(?i)допуск\\s+СРО"
      - "(?i)членств[оа]\\s+в\\s+СРО"
      - "(?i)свидетельств[оа]\\s+о\\s+допуск"

      # Держатель лицензии
      - "(?i)licen[cs]e\\s+holder"
      - "(?i)держатель\\s+лицензи"
      - "(?i)лицензиат"
      - "(?i)licensee"
      - "(?i)issued\\s+to"
      - "(?i)выдан[ао]?\\s+[\\s\\S]{0,20}(компании|обществу|организации)"

      # Срок действия
      - "(?i)licen[cs]e\\s+(validity|term|expir)"
      - "(?i)срок\\s+действи[яи]\\s+лицензи"
      - "(?i)продлени[ея]\\s+лицензи"
      - "(?i)renewal\\s+of\\s+licen[cs]e"

      # Зависимость от владения
      - "(?i)ownership\\s+structure\\s+[\\s\\S]{0,40}licen[cs]e"
      - "(?i)структур[аы]\\s+владени[яи]\\s+[\\s\\S]{0,40}лицензи"
      - "(?i)beneficial\\s+owner\\s+[\\s\\S]{0,40}licen[cs]e"
      - "(?i)бенефициар[а-я]*\\s+[\\s\\S]{0,40}лицензи"

    low:
      - "(?i)change\\s+of\\s+control[\\s\\S]{0,20}licen[cs]e"
      - "(?i)re[-\\s]?licen[cs]ing"
      - "(?i)переоформление\\s+лицензи"
      - "(?i)regulatory\\s+consent[\\s\\S]{0,20}(transfer|change)"
      - "(?i)согласие\\s+регулятора"
      - "(?i)банковская\\s+лицензия"
      - "(?i)медицинская\\s+лицензия"
      - "(?i)лицензия\\s+Роскомнадзор"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 640

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  retrieval_profile: "registration_check"
  context_k: 5
  max_chunks: 10
  
  retrieval_query: >
    лицензия лицензиат разрешение аккредитация license permit regulatory consent 
    переоформление смена контроля change of control ownership

  boost_keywords:
    - "лицензия"
    - "лицензии"
    - "license"
    - "licenses"
    - "permit"
    - "permits"
    - "разрешение"
    - "аккредитация"
    - "accreditation"
    - "регистрационное удостоверение"
    - "банковская лицензия"
    - "медицинская лицензия"
    - "телеком лицензия"
    - "license holder"
    - "держатель лицензии"
    - "change of control"
    - "смена контроля"
    - "re-licensing"
    - "переоформление лицензии"
    - "regulatory consent"
    - "согласие регулятора"
    - "revocation"
    - "аннулирование"
    - "suspension"
    - "приостановление"
    - "ownership structure"
    - "beneficial owner"

  negative_keywords:
    - "интеллектуальная собственность"
    - "авторские права"
    - "условия оплаты"
    - "форс-мажор"
    - "коммерческая тайна"

  preferred_unit_types:
    - "general_provision"
    - "obligation"

  excluded_unit_types:
    - "technical_fragment"
    - "appendix_reference"
    - "structural_anchor"

  preferred_clause_functions:
    - "representations"
    - "procedures"
    - "obligations"

  position_bias:
    preferred_range: [0.0, 1.0]
    boost: 0.10
    scope: "segment"

  rerank: true
  filters: {}

conditional: null

enrichment_hints:
  preferred_segment_types:
    - "contract"
    - "annex"
    - "appendix"
    - "amendment"
  excluded_segment_types:
    - "technical_specification"
    - "price_list"
    - "invoice"
    - "act"
  confidence_bonus_on_match: 0.10
  confidence_penalty_on_excluded_segment: 0.15

extraction:
  enabled: true
  mode: "hybrid"
  llm_max_tokens: 900

  llm_prompt_extraction: |
    <role>
    Ты — юрист по регуляторному комплаенсу и M&A.
    Твоя задача — точно извлечь из текста:
    1) наличие ключевых лицензий / разрешений;
    2) на кого они оформлены;
    3) зависят ли от структуры владения / контроля;
    4) есть ли механизм сохранения при M&A.

    Не придумывай данные о лицензиях если их нет в тексте.
    </role>

    <context>
    Ниже приведены релевантные фрагменты договора:

    {context}
    </context>

    <task>
    Заполни только следующие поля:
    - licenses_display
    - has_key_licenses
    - licenses_summary
    - license_holder_type
    - depends_on_ownership
    - preservation_mechanism
    - reason

    Важно:
    - пиши коротко и по-русски.
    </task>

    <instructions>
    Шаг 1 — НАЛИЧИЕ КЛЮЧЕВЫХ ЛИЦЕНЗИЙ

    Заполни "has_key_licenses".

    Значения:
    - "yes" — упоминаются лицензии, разрешения, аккредитации,
      без которых деятельность невозможна или существенно
      ограничена.
    - "no" — не упоминаются.
    - "unclear" — неясно.

    Шаг 2 — ОПИСАНИЕ ЛИЦЕНЗИЙ

    Заполни "licenses_summary".

    Правила:
    - Кратко через ";":
      "Банковская лицензия ЦБ; страховая лицензия"
      "Медицинская лицензия; образовательная лицензия"
    - Если нет: "Не выявлено"
    - Если неясно: "Не удалось определить"

    Шаг 3 — ДЕРЖАТЕЛЬ ЛИЦЕНЗИЙ

    Заполни "license_holder_type".

    Значения:
    - "target" — на Target.
    - "subsidiary" — на дочернюю / зависимую компанию.
    - "parent" — на материнскую компанию.
    - "third_party" — на третье лицо или индивидуального
      лицензированного специалиста.
    - "mixed" — несколько держателей.
    - "not_applicable" — лицензий нет.
    - "unclear" — неясно.

    Шаг 4 — ЗАВИСИМОСТЬ ОТ СТРУКТУРЫ ВЛАДЕНИЯ

    Заполни "depends_on_ownership".

    Значения:
    - "yes" — при смене контроля / владения требуется
      согласие регулятора, re-licensing, переаккредитация;
      или лицензия выдана с учётом конкретных бенефициаров.
    - "no" — явно указано, что лицензии не зависят
      от структуры.
    - "unclear" — неясно.

    Шаг 5 — МЕХАНИЗМ СОХРАНЕНИЯ

    Заполни "preservation_mechanism".

    Значения:
    - "yes" — предусмотрен механизм: согласованный с
      регулятором порядок, waiver, transitional arrangements,
      обязательства по переоформлению.
    - "no" — механизма нет.
    - "not_applicable" — лицензий нет или не зависят от CoC.
    - "unclear" — неясно.

    Шаг 6 — НОРМАЛИЗОВАННЫЙ DISPLAY ДЛЯ DD GRID

    Заполни "licenses_display".

    Это не свободное summary.
    Строй display по следующей логике:

    Базовые случаи:
    - has_key_licenses = "no":
      "Лицензии не выявлены"
    - все поля unclear:
      "Не удалось определить наличие лицензий"

    Если лицензии есть — комбинируй через ";":
    - licenses_summary (кратко)
    - license_holder_type (если не "target")
    - depends_on_ownership (если "yes")
    - preservation_mechanism (если "no" и depends = "yes")

    Примеры:
    - "Банковская лицензия ЦБ; на Target; зависит от CoC; согласие ЦБ необходимо"
    - "Медицинская лицензия; на дочерней компании; нет CoC-зависимости"
    - "Лицензия на третье лицо; нет механизма сохранения"
    - "Лицензии не выявлены"
    - "Не удалось определить наличие лицензий"

    Ограничение: не более 4 фактов через ";".

    Шаг 7 — КРАТКОЕ ОБОСНОВАНИЕ

    Заполни "reason".

    Правила:
    - 1–2 коротких предложения.
    - Укажи: тип лицензий, держатель, CoC-зависимость,
      механизм сохранения.
    - Приведи цитату в кавычках.
    </instructions>

    <edge_cases>
    - Лицензия на третье лицо без контроля:
      * license_holder_type = "third_party"

    - Лицензия на Target, CoC-зависимость, нет механизма:
      * depends_on_ownership = "yes"
      * preservation_mechanism = "no"

    - "Все необходимые лицензии имеются" без конкретики:
      * has_key_licenses = "unclear"

    - Waiver от регулятора предусмотрен:
      * preservation_mechanism = "yes"

    - Нет релевантных фрагментов:
      * has_key_licenses = "unclear"
      * licenses_display = "Не удалось определить наличие лицензий"
    </edge_cases>

    <output_expectations>
    Все значения коротко и по-русски.
    Не добавляй никаких полей, кроме указанных в схеме extraction.
    </output_expectations>

  fields:
    - name: "licenses_display"
      type: "string"
      presentation: "fact"
      label: "Лицензии и разрешения"
      description: "Нормализованный user-facing вывод для DD Grid"

    - name: "has_key_licenses"
      type: "string"
      presentation: "signal"
      description: "Наличие ключевых лицензий"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "licenses_summary"
      type: "string"
      presentation: "fact"
      label: "Перечень лицензий"
      description: "Краткий перечень выявленных лицензий"

    - name: "license_holder_type"
      type: "string"
      presentation: "signal"
      description: "Держатель лицензии"
      allowed_values:
        - "target"
        - "subsidiary"
        - "parent"
        - "third_party"
        - "mixed"
        - "not_applicable"
        - "unclear"

    - name: "depends_on_ownership"
      type: "string"
      presentation: "signal"
      description: "Зависимость от структуры владения"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "preservation_mechanism"
      type: "string"
      presentation: "signal"
      description: "Механизм сохранения лицензий"
      allowed_values:
        - "yes"
        - "no"
        - "not_applicable"
        - "unclear"

    - name: "reason"
      type: "string"
      presentation: "diagnostic"
      description: "Обоснование"

  store_payload: true

  
