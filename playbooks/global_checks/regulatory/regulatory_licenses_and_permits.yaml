id: "regulatory_licenses_and_permits"
name: "Лицензии, разрешения и аккредитации"
description: >
  Анализирует положения о наличии лицензий, разрешений, аккредитаций и их
  привязке к конкретным лицам, объектам и структуре владения.

doc_types: []

severity: "high"
severity_if_fail: "critical"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"

rules:
  keywords:
    - "лицензия"
    - "лицензии"
    - "license"
    - "permit"
    - "разрешение"
    - "разрешения"
    - "accreditation"
    - "аккредитация"
    - "разрешительная документация"
    - "регистрационное удостоверение"
    - "certificate"
  keyword_mode: "any"
  regex_patterns: []
  clause_patterns: []

llm:
  prompt_template: |
    <role>
    Ты — юрист по регуляторному комплаенсу.
    Твоя специализация — лицензируемые виды деятельности, разрешения и аккредитации,
    а также их зависимость от структуры владения и контроля.
    </role>

    <context>
    Ниже приведены фрагменты договора или связанных документов, где могут
    упоминаться лицензии, разрешения, аккредитации и иная разрешительная документация:

    {context}
    </context>

    <instructions>
    Определи:

    1) Упоминаются ли ключевые лицензии/разрешения (mentions_key_licenses_or_permits):
       - лицензии, разрешения, аккредитации, регистрационные удостоверения, сертификаты,
         без которых деятельность Target или объекта сделки невозможна или существенно
         ограничена;
       - отраслевые: банковские/финансовые, медицинские, образовательные, телеком,
         энергетика и т.п.

    2) На кого оформлены эти лицензии (license_holder_description):
       - конкретное юридическое лицо (Target, дочерняя компания, материнская компания);
       - филиал/подразделение;
       - индивидуальный лицензируемый специалист;
       - опиши это кратко текстом.

    3) Зависимость лицензий от структуры владения/контроля
       (licenses_depend_on_ownership_or_control_structure):
       - есть ли формулировки, что лицензия выдана с учётом конкретных бенефициаров,
         структуры группы, контролирующего лица;
       - требуется ли согласие регулятора на смену контроля/владения,
         уведомление о смене бенефициаров, re-licensing и т.п.
       Если в тексте это явно следует — "yes"; если явных указаний нет — "no" или "unclear"
       в зависимости от объёма информации.

    4) Риск утраты лицензий в связи со сделкой (risk_of_license_loss_on_transaction):
       - есть ли прямые указания на то, что сделка (change of control, реорганизация,
         отчуждение активов) может привести к приостановке/аннулированию лицензии,
         необходимости получать новую лицензию или проходить повторную аккредитацию;
       - оцени риск как:
         * low — если явных рисков нет или есть механизмы сохранения/переоформления,
         * medium — если есть условия/риски, но с возможностью управляемого перехода,
         * high — если велика вероятность утраты/приостановки ключевых лицензий
           без понятного плана.

    5) Оцени общий риск для Target (overall_risk_level: low / medium / high):
       - учитывай наличие/отсутствие описаний ключевых лицензий,
         на кого они оформлены, зависимость от владения и риски при сделке.
    </instructions>

    <edge_cases>
    ВАЖНО — пограничные случаи:

    — Если явно сказано, что ключевая лицензия оформлена на третье лицо
      (не Target) или на отдельную "прокладку" без долгосрочного контроля,
      и нет ясной схемы обеспечения доступа:
      mentions_key_licenses_or_permits = "yes",
      licenses_depend_on_ownership_or_control_structure = "yes" (если завязано на структуру),
      риск обычно не ниже "medium"/"high" (обоснуй).

    — Если лицензия формально принадлежит Target, но прямо указано, что при смене
      контроля требуется предварительное согласие регулятора или есть риск аннулирования:
      licenses_depend_on_ownership_or_control_structure = "yes",
      risk_of_license_loss_on_transaction, как правило, "medium" или "high".

    — Если в договоре только общее упоминание "все необходимые лицензии и разрешения
      имеются" без конкретики и без привязки к структуре владения:
      mentions_key_licenses_or_permits = "unclear" или "yes" (по смыслу фрагмента),
      license_holder_description — максимально нейтральное краткое описание,
      risk_of_license_loss_on_transaction чаще "unclear".

    — Если явно сказано, что сделка не требует переоформления лицензий и не влияет
      на их действие (например, в группе есть выстроенная структура владения
      и механизм передачи контроля согласован с регулятором):
      risk_of_license_loss_on_transaction = "low",
      overall_risk_level может быть "low" при условии, что лицензии критичны
      и описаны.

    — Пустые или нерелевантные фрагменты:
      большинство полей = "unclear" или пустые строки,
      risk_of_license_loss_on_transaction = "unclear",
      overall_risk_level = "medium",
      reason = "Недостаточно данных для анализа лицензий, их держателей и влияния сделки на их сохранность."
    </edge_cases>

    <examples>
    ПРИМЕР 1 — КРИТИЧНАЯ ЛИЦЕНЗИЯ НА ТРЕТЬЕ ЛИЦО (HIGH):

    Фрагмент: "Медицинская деятельность осуществляется на основании лицензии,
    выданной Обществу 'Клиника А', которая не входит в периметр сделки. Target
    использует данную лицензию на основании договора аренды медицинских помещений."

    {{
      "mentions_key_licenses_or_permits": "yes",
      "license_holder_description": "Ключевая медицинская лицензия оформлена на отдельное юрлицо, не входящее в периметр сделки.",
      "licenses_depend_on_ownership_or_control_structure": "yes",
      "risk_of_license_loss_on_transaction": "high",
      "overall_risk_level": "high",
      "reason": "Критичная лицензия принадлежит стороннему лицу вне периметра сделки, что создаёт высокий риск утраты или ограничения доступа к лицензируемой деятельности."
    }}

    ПРИМЕР 2 — ЛИЦЕНЗИЯ НА TARGET, РИСК УМЕРЕННЫЙ (MEDIUM):

    Фрагмент: "Банковская лицензия выдана непосредственно Target. При этом
    изменение состава участников, владеющих более 10% долей, подлежит согласованию
    с Центральным банком, без чего изменение контроля может быть признано
    нарушением лицензионных требований."

    {{
      "mentions_key_licenses_or_permits": "yes",
      "license_holder_description": "Банковская лицензия оформлена на Target.",
      "licenses_depend_on_ownership_or_control_structure": "yes",
      "risk_of_license_loss_on_transaction": "medium",
      "overall_risk_level": "medium",
      "reason": "Ключевая лицензия принадлежит Target, но смена контроля требует согласования с регулятором, что создаёт средний риск при сделке."
    }}

    ПРИМЕР 3 — ОБЩАЯ ФОРМУЛИРОВКА БЕЗ ДЕТАЛЕЙ (MEDIUM/UNCLEAR):

    Фрагмент: "Сторона заявляет, что обладает всеми необходимыми лицензиями
    и разрешениями для осуществления своей деятельности."

    {{
      "mentions_key_licenses_or_permits": "unclear",
      "license_holder_description": "Указано наличие всех необходимых лицензий без детализации держателя.",
      "licenses_depend_on_ownership_or_control_structure": "unclear",
      "risk_of_license_loss_on_transaction": "unclear",
      "overall_risk_level": "medium",
      "reason": "Есть только общая декларация о наличии лицензий без указания держателя и влияния сделки, что не позволяет оценить риск утраты лицензий."
    }}
    </examples>

    <output_format>
    Твой ответ ДОЛЖЕН быть строго валидным JSON-объектом со следующими
    полями:

    {{
      "mentions_key_licenses_or_permits": "one of: yes | no | unclear",
      "license_holder_description": "string — краткое описание, на кого оформлены ключевые лицензии/разрешения",
      "licenses_depend_on_ownership_or_control_structure": "one of: yes | no | unclear",
      "risk_of_license_loss_on_transaction": "one of: low | medium | high | unclear",
      "overall_risk_level": "one of: low | medium | high",
      "reason": "string — краткое объяснение на русском с указанием ключевых формулировок и оценки риска для Target"
    }}

    Все перечисленные поля ДОЛЖНЫ присутствовать в JSON, даже если их значение равно null.
    </output_format>

    <constraints>
    ЖЁСТКИЕ ПРАВИЛА:
    1. Выведи ТОЛЬКО один JSON-объект. Никакого текста до или после.
    2. Не пиши "Вот JSON", "Here is the JSON" и т.п.
    3. Не используй Markdown, бэктики ``` или любые обёртки.
    4. Все строки — в двойных кавычках.
    5. Значения перечислимых полей — СТРОГО из указанных вариантов.
    6. Ключи — точно как указано, без добавления новых.
    7. Поле "reason" ДОЛЖНО содержать конкретные формулировки из фрагментов
       и вывод по рискам, а не общие фразы вроде "есть риски".
    8. Начни ответ сразу с символа {{
    9. Если по какому‑то полю нет достаточно информации в тексте —
       верни для него 'unclear' или null (для reason пустое значение
       недопустимо — нужно объяснение). НЕ придумывай значения, не интерполируй.
    </constraints>
  prompt_file: null
  context_k: 5
  temperature: 0.0
  max_tokens: 640

evidence:
  required: false
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  context_k: 5
  max_chunks: 10
  boost_keywords:
    - "лицензия"
    - "license"
    - "permit"
    - "аккредитация"
    - "регистрационное удостоверение"
  rerank: true
  filters: {}

conditional: null

extraction:
  enabled: true
  mode: "hybrid"
  fields:
    - name: "mentions_key_licenses_or_permits"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
    - name: "license_holder_description"
      type: "string"
    - name: "licenses_depend_on_ownership_or_control_structure"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
    - name: "risk_of_license_loss_on_transaction"
      type: "string"
      allowed_values:
        - "low"
        - "medium"
        - "high"
        - "unclear"
    - name: "overall_risk_level"
      type: "string"
      allowed_values:
        - "low"
        - "medium"
        - "high"
    - name: "reason"
      type: "string"
  store_payload: true

red_flags:
  items:
    - code: "REG1"
      description: "Критичные лицензии оформлены не на Target или жестко завязаны на текущую структуру владения."
    - code: "REG2"
      description: "Есть риск утраты ключевых лицензий при смене контроля/структуры без ясного плана."