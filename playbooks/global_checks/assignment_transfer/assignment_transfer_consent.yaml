id: "assignment_transfer_consent"
name: "Условия согласия при уступке / переводе долга"
group: "ASSIGNMENT_TRANSFER"
description: >
  Анализирует механику получения согласия контрагента при уступке
  прав / переводе долга / передаче обязательств: требуется ли
  согласие, в какой форме, установлен ли срок ответа, предусмотрен
  ли deemed consent (молчание = согласие), ограничен ли отказ
  стандартом разумности или возможен по sole discretion.

  Check не анализирует:
  - наличие / тип базового режима (prohibited / consent_required /
    freely_permitted) — это задача assignment_transfer_regime;
  - смену контроля (CoC) — это задача coc_consent_terms;
  - substantive consequences отказа;
  - carve-out и исключения;
  - кто именно даёт согласие.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"
ui_mode: "field_extraction"

rules:
  keyword_mode: any

  keywords:
    high:
      - "(?i)consent\\s+to\\s+(assignment|transfer)"
      - "(?i)согласи[ея]\\s+на\\s+(уступк|перевод|передач)"
      - "(?i)without\\s+(the\\s+)?(prior\\s+)?(written\\s+)?consent[\\s\\S]{0,40}(assign|transfer)"
      - "(?i)без\\s+(предварительного\\s+)?(письменного\\s+)?согласи[яи][\\s\\S]{0,40}(уступ|перевод|передач)"
      - "(?i)not\\s+(to\\s+be\\s+)?unreasonably\\s+(withheld|delayed|conditioned)"
      - "(?i)sole\\s+(and\\s+absolute\\s+)?discretion"
      - "(?i)deemed\\s+(to\\s+be\\s+)?(given|granted|obtained)"
      - "(?i)считается\\s+(данным|полученным|предоставленным)"
      - "(?i)молчани[ея][\\s\\S]{0,40}(означает|считается)"

    medium:
      - "(?i)prior\\s+written\\s+consent"
      - "(?i)предварительн[а-я]+\\s+письменн[а-я]+\\s+согласи[ея]"
      - "(?i)within\\s+\\d+\\s+(business\\s+|working\\s+)?days?"
      - "(?i)в\\s+течение\\s+\\d+\\s+(рабочих\\s+)?(дней|календарных)"
      - "(?i)срок\\s+рассмотрени[яи]"
      - "(?i)response\\s+(period|time)"
      - "(?i)не\\s+может\\s+быть\\s+необоснованно"
      - "(?i)по\\s+(своему\\s+)?(исключительному\\s+)?усмотрению"

    low:
      - "(?i)уступк[аи]"
      - "(?i)перевод\\s+долга"
      - "(?i)assignment"
      - "(?i)deemed\\s+consent"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 420

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 500

retrieval:
  retrieval_profile: "consent_check"
  context_k: 6
  max_chunks: 12

  retrieval_query: >
    уступка прав перевод долга согласие на уступку consent
    предварительное письменное согласие prior written consent
    deemed consent молчание считается согласием
    sole discretion unreasonably withheld срок ответа

  boost_keywords:
    - "consent to assignment"
    - "consent to transfer"
    - "согласие на уступку"
    - "согласие на перевод долга"
    - "prior written consent"
    - "предварительное письменное согласие"
    - "deemed consent"
    - "считается данным"
    - "not unreasonably withheld"
    - "не может быть необоснованно"
    - "sole discretion"
    - "по своему усмотрению"
    - "срок рассмотрения"
    - "response period"

  negative_keywords:
    - "change of control"
    - "смена контроля"
    - "означает"
    - "в целях настоящего"
    - "споры"
    - "подсудность"
    - "применимое право"

  preferred_unit_types:
    - "obligation"
    - "general_provision"

  excluded_unit_types:
    - "definition"
    - "structural_anchor"
    - "technical_fragment"
    - "appendix_reference"

  preferred_clause_functions:
    - "limitations"
    - "procedures"
    - "rights"
    - "obligations"

  position_bias:
    preferred_range: [0.60, 1.00]
    boost: 0.30
    scope: "segment"

  rerank: true
  filters: {}

conditional: null

enrichment_hints:
  preferred_segment_types:
    - "contract"
    - "amendment"
  excluded_segment_types:
    - "technical_specification"
    - "price_list"
    - "invoice"
    - "act"
  confidence_bonus_on_match: 0.10
  confidence_penalty_on_excluded_segment: 0.15

extraction:
  enabled: true
  mode: "hybrid"
  llm_max_tokens: 900

  # Presence gate: отделяет факт наличия пункта (at_status) от его содержания
  # (at_consent_required, at_consent_form, at_response_period, at_deemed_consent,
  # at_reasonableness_standard). missing -> missing_required_clause.
  # Контракт: present + missing + unclear = at_status.allowed_values.
  presence_signal:
    field: "at_status"
    present_values: ["present"]
    missing_values: ["missing"]
    unclear_values: ["unclear"]

  llm_prompt_extraction: |
    <role>
    Ты — юрист по коммерческим договорам.
    Твоя задача — точно извлечь механику получения согласия
    контрагента при уступке прав / переводе долга / передаче
    обязательств.

    КРИТИЧЕСКИ ВАЖНО:
    - Извлекай ТОЛЬКО то, что прямо написано в тексте.
    - НЕ делай выводов "по умолчанию" из общих норм права.
    - НЕ додумывай условия, которых нет в тексте.
    - Если информация отсутствует — ставь "not_specified",
      а не предполагай наиболее вероятный вариант.
    - Если текст неоднозначен — ставь "unclear",
      а не выбирай один из вариантов.

    Не анализируй смену контроля (CoC).
    Не анализируй базовый режим (запрет / consent_required / free) —
    это задача другого check.
    Не анализируй последствия отказа.
    Не анализируй carve-out.
    Не анализируй, кто именно даёт согласие.
    Не оценивай риск.
    </role>

    <context_rules>
    - Ниже приведены фрагменты, отобранные автоматически.
    - Некоторые фрагменты могут быть нерелевантны данному
      check — игнорируй их.
    - Если среди фрагментов есть противоречия — укажи "unclear"
      и объясни в reason.
    - Если ни один фрагмент не содержит информации по теме —
      at_status = "missing"; остальные поля — согласно Шагу 0.
    - Не используй информацию из определений (definitions),
      преамбулы или приложений, если они не содержат
      substantive условий по теме check.
    </context_rules>

    <context>
    {context}
    </context>

    <task>
    Заполни только следующие поля:
    - at_status
    - at_consent_display
    - at_consent_required
    - at_consent_form
    - at_response_period
    - at_deemed_consent
    - at_reasonableness_standard
    - reason

    Общие правила:
    - используй только то, что прямо следует из текста;
    - пиши коротко и по-русски.
    </task>

    <location_instructions>
    Для каждого поля по возможности укажи location в формате:
    {"clause_ref": "п. 9.2", "page": 12, "quote": "дословная фраза из договора"}

    Правила:
    - clause_ref — короткая ссылка на пункт / раздел / статью именно в том виде,
      как она написана в договоре;
    - page — целое число страницы;
    - quote — дословная фраза из текста договора (НЕ пересказ, НЕ парафраз),
      которая является источником значения поля. Копируй её посимвольно,
      сохраняя формулировку и порядок слов. Оптимальная длина: 30–300 символов.
      Если значение поля выведено из конкретной фразы договора — quote ДОЛЖЕН
      содержать эту фразу без изменений.
      Примеры хорошего quote:
      * для at_consent_required (yes): "Ни одна из Сторон не вправе уступить свои права по настоящему Договору без предварительного письменного согласия другой Стороны";
      * для at_consent_form (prior_written): "Согласие должно быть выражено в письменной форме и предоставлено до совершения уступки";
      * для at_response_period: "Сторона, получившая запрос о согласии, обязана ответить в течение 10 (десяти) рабочих дней";
      * для at_deemed_consent (yes): "Если ответ не получен в указанный срок, согласие считается предоставленным";
      * для at_reasonableness_standard (sole_discretion): "Согласие может быть предоставлено или не предоставлено по усмотрению другой Стороны".
    - не выдумывай location или quote;
    - если точную ссылку или дословную фразу определить нельзя,
      верни location = null;
    - для at_status, at_consent_display и reason location всегда null
      (они синтезированы и не имеют прямого источника в тексте);
    - для at_consent_required, at_consent_form, at_response_period,
      at_deemed_consent, at_reasonableness_standard location с quote особенно важна;
    - для at_consent_required при значении "no":
      * quote, если договор прямо говорит "согласие не требуется" /
        "уступка допускается без согласия" / "без согласия контрагента";
      * location = null, если тема не раскрыта (значение "not_specified");
    - для at_consent_form, at_deemed_consent, at_reasonableness_standard
      при значении "not_applicable" / "not_specified" — location = null;
    - если at_status = "missing" (тема не раскрыта в договоре) —
      для всех полей location = null.
    </location_instructions>

    <instructions>
    Шаг 0 — НАЛИЧИЕ ПОЛОЖЕНИЙ

    Заполни "at_status".

    Значения:
    - "present" — если договор прямо регулирует уступку / перевод долга
      и условия получения согласия по этому вопросу.
    - "missing" — если таких положений нет.
    - "unclear" — если формулировки есть, но надёжно определить
      режим согласия нельзя.

    Если at_status = "missing":
    - at_consent_required = "not_specified"
    - at_consent_form = "not_specified"
    - at_response_period = "Не установлено"
    - at_deemed_consent = "not_specified"
    - at_reasonableness_standard = "not_specified"
    - at_consent_display = "Положения о согласии при уступке отсутствуют"
    - reason = "Положения о согласии при уступке не обнаружены в представленных фрагментах."
    - для всех полей location = null
    - переходи сразу к Шагу 6 (формирование display) и Шагу 7 (reason)
      на основе этих значений.

    Если at_status = "unclear":
    - at_consent_display = "Не удалось определить наличие и условия согласия при уступке"
    - reason = "Формулировки по уступке / согласию присутствуют, но режим надёжно определить нельзя."
    - переходи к Шагам 1–5 и заполни их значением "unclear" там,
      где применимо.

    Если at_status = "present" — переходи к Шагам 1–5.

    Шаг 1 — ТРЕБОВАНИЕ СОГЛАСИЯ

    Заполни "at_consent_required".

    Значения:
    - "yes" — согласие прямо требуется при уступке / переводе долга.
    - "no" — согласие прямо не требуется.
    - "not_specified" — тема не урегулирована (но пункт по уступке в
      договоре присутствует).
    - "unclear" — вывод сделать нельзя.

    Шаг 2 — ФОРМА СОГЛАСИЯ

    Заполни "at_consent_form".

    Значения:
    - "prior_written" — предварительное письменное согласие.
    - "written" — письменное без требования предварительности.
    - "any_form" — форма не ограничена.
    - "not_specified" — форма не установлена.
    - "not_applicable" — согласие не требуется.
    - "unclear" — нельзя определить.

    Шаг 3 — СРОК ОТВЕТА

    Заполни "at_response_period".

    Правила:
    - Если срок установлен: извлеки как есть
      ("10 рабочих дней", "30 календарных дней").
    - Если согласие требуется, но срок не установлен:
      "Не установлен".
    - Если согласие не требуется: "Не применимо".
    - Если нельзя определить: "Не удалось определить".

    Шаг 4 — DEEMED CONSENT

    Заполни "at_deemed_consent".

    Значения:
    - "yes" — молчание / отсутствие ответа считается согласием.
    - "no" — прямо требуется явное согласие.
    - "not_specified" — тема не урегулирована.
    - "not_applicable" — согласие не требуется.
    - "unclear" — нельзя определить.

    Шаг 5 — СТАНДАРТ ОТКАЗА

    Заполни "at_reasonableness_standard".

    Значения:
    - "not_unreasonably_withheld" — отказ не может быть необоснованным.
    - "sole_discretion" — отказ по усмотрению.
    - "not_specified" — стандарт не установлен.
    - "not_applicable" — согласие не требуется.
    - "unclear" — нельзя определить.

    Шаг 6 — DISPLAY ДЛЯ DD GRID

    Заполни "at_consent_display".

    Это поле — краткий итог для таблицы.
    Сформируй его на основе уже заполненных полей:
    - at_status
    - at_consent_required
    - at_consent_form
    - at_response_period
    - at_deemed_consent
    - at_reasonableness_standard
    Не добавляй информацию, которой нет в этих полях.

    Примеры:
    - at_status = "missing":
      "Положения о согласии при уступке отсутствуют"
    - at_status = "unclear":
      "Не удалось определить наличие и условия согласия при уступке"
    - at_status = "present" и at_consent_required = "yes":
      "Для уступки требуется предварительное письменное согласие;
      срок ответа не установлен"
      "Для уступки требуется согласие; 30 дней;
      молчание считается согласием"
      "Для уступки требуется согласие; отказ по sole discretion"
    - at_status = "present" и at_consent_required = "no":
      "Для уступки согласие не требуется"

    Шаг 7 — ОБОСНОВАНИЕ

    Заполни "reason".

    Формат:
    - Первое предложение: краткий вывод
      (что найдено или не найдено).
    - Второе предложение: цитата из текста в кавычках
      (самый релевантный фрагмент, до 100 символов).

    Примеры:
    - "Договор требует предварительного письменного согласия
      на уступку. «Ни одна из Сторон не вправе уступить
      права без предварительного письменного согласия»."
    - "Положения о согласии при уступке не обнаружены
      в представленных фрагментах."
    </instructions>

    <edge_cases>
    - "Assignment requires prior written consent":
      * at_status = "present"
      * at_consent_required = "yes"
      * at_consent_form = "prior_written"
      * at_response_period = "Не установлен"
      * at_deemed_consent = "not_specified"
      * at_reasonableness_standard = "not_specified"
      * at_consent_display =
        "Для уступки требуется предварительное письменное согласие;
        срок ответа не установлен"

    - "Consent shall not be unreasonably withheld":
      * at_status = "present"
      * at_reasonableness_standard = "not_unreasonably_withheld"

    - "In its sole discretion":
      * at_status = "present"
      * at_reasonableness_standard = "sole_discretion"

    - Согласие прямо не требуется:
      * at_status = "present"
      * at_consent_required = "no"
      * at_consent_form = "not_applicable"
      * at_response_period = "Не применимо"
      * at_deemed_consent = "not_applicable"
      * at_reasonableness_standard = "not_applicable"
      * at_consent_display = "Для уступки согласие не требуется"

    - Тема уступки вообще не урегулирована:
      * at_status = "missing"
      * at_consent_required = "not_specified"
      * at_consent_form = "not_specified"
      * at_response_period = "Не установлено"
      * at_deemed_consent = "not_specified"
      * at_reasonableness_standard = "not_specified"
      * at_consent_display =
        "Положения о согласии при уступке отсутствуют"

    - Нет релевантных фрагментов:
      * at_status = "missing"
      * at_consent_display =
        "Положения о согласии при уступке отсутствуют"

    - Формулировки есть, но вывод нельзя:
      * at_status = "unclear"
      * at_consent_display =
        "Не удалось определить наличие и условия согласия при уступке"
    </edge_cases>

    <output_expectations>
    - Верни результат строго в формате JSON.
    - Не оборачивай в markdown-блоки (без ```).
    - Не добавляй комментариев вне JSON.
    - Все значения полей с allowed_values — на английском
      (как указано в списке).
    - Свободные текстовые поля (at_consent_display,
      at_response_period, reason) — на русском языке.
    - Не добавляй никаких полей, кроме указанных.
    - Для каждого поля возвращай объект с ключами
      "value", "confidence", "location".

    Пример структуры ответа:
    {
      "at_status": {"value": "present", "confidence": 0.95, "location": null},
      "at_consent_display": {"value": "Для уступки требуется предварительное письменное согласие; срок ответа не установлен", "confidence": 0.95, "location": null},
      "at_consent_required": {"value": "yes", "confidence": 0.95, "location": {"clause_ref": "п. 9.2", "page": 12, "quote": "Ни одна из Сторон не вправе уступить свои права по настоящему Договору без предварительного письменного согласия другой Стороны"}},
      "at_consent_form": {"value": "prior_written", "confidence": 0.92, "location": {"clause_ref": "п. 9.2", "page": 12, "quote": "Согласие должно быть выражено в письменной форме и предоставлено до совершения уступки"}},
      "at_response_period": {"value": "Не установлен", "confidence": 0.90, "location": null},
      "at_deemed_consent": {"value": "not_specified", "confidence": 0.90, "location": null},
      "at_reasonableness_standard": {"value": "not_specified", "confidence": 0.90, "location": null},
      "reason": {"value": "Договор требует предварительного письменного согласия на уступку. «Ни одна из Сторон не вправе уступить свои права ... без предварительного письменного согласия другой Стороны».", "confidence": 0.90, "location": null}
    }
    </output_expectations>

  fields:
    - name: "at_status"
      type: "string"
      presentation: "signal"
      risk_weight: "info"
      description: "Наличие положений о согласии при уступке / переводе долга"
      display_in_grid: false
      allowed_values:
        - "present"
        - "missing"
        - "unclear"

    - name: "at_consent_display"
      type: "string"
      presentation: "fact"
      label: "Согласие при уступке"
      description: "Нормализованный user-facing вывод для DD Grid"
      display_in_grid: true
      display_priority: 1

    - name: "at_consent_required"
      type: "string"
      presentation: "signal"
      risk_weight: "high"
      description: "Требуется ли согласие при уступке"
      display_in_grid: false
      allowed_values:
        - "yes"
        - "no"
        - "not_specified"
        - "unclear"

    - name: "at_consent_form"
      type: "string"
      presentation: "signal"
      risk_weight: "medium"
      description: "Форма согласия"
      display_in_grid: false
      allowed_values:
        - "prior_written"
        - "written"
        - "any_form"
        - "not_specified"
        - "not_applicable"
        - "unclear"

    - name: "at_response_period"
      type: "string"
      presentation: "fact"
      label: "Срок ответа"
