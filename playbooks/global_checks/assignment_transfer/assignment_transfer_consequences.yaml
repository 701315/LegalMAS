id: "assignment_transfer_consequences"
name: "Последствия уступки прав / перевода долга"
group: "ASSIGNMENT_TRANSFER"
description: >
  Анализирует substantive последствия, которые наступают при
  уступке прав, переводе долга или передаче обязательств:
  право на расторжение и его механизм, акселерацию обязательств,
  изменение цены / условий, наличие смягчающих механизмов
  (cure period, waiver).

  Check не анализирует:
  - наличие / тип базового режима — это задача
    assignment_transfer_regime;
  - механику получения согласия — это задача
    assignment_transfer_consent;
  - последствия смены контроля (CoC) — это задача
    coc_consequences;
  - definition of control / CoC trigger;
  - оценку общего M&A-риска.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"
ui_mode: "field_extraction"

rules:
  keyword_mode: any

  keywords:
    high:
      - "(?i)right\\s+to\\s+terminate[\\s\\S]{0,40}(assign|transfer|уступк|перевод)"
      - "(?i)terminat(e|ion)\\s+upon[\\s\\S]{0,20}(assign|transfer)"
      - "(?i)право\\s+(на\\s+)?расторжени[ея][\\s\\S]{0,40}(уступк|перевод|передач)"
      - "(?i)automatic(ally)?\\s+terminat(e|ion|ed)"
      - "(?i)автоматическ[а-я]+\\s+(прекращени|расторжени)"
      - "(?i)acceleration\\s+of[\\s\\S]{0,30}(payment|obligation|debt)"
      - "(?i)досрочн[а-я]+\\s+(исполнени|взыскани|погашени)"
      - "(?i)all\\s+outstanding\\s+amounts?\\s+(shall\\s+)?become\\s+due"
      - "(?i)step[-\\s]?up"
      - "(?i)увеличени[ея]\\s+(ставк|марж|процент)"
      - "(?i)отмен[аы]\\s+(скид[а-я]+|льгот|преференц)"

    medium:
      - "(?i)right\\s+to\\s+terminate"
      - "(?i)termination\\s+(right|option)"
      - "(?i)право\\s+расторгнуть"
      - "(?i)cure\\s+period"
      - "(?i)срок\\s+(для\\s+)?устранени[яи]"
      - "(?i)grace\\s+period"
      - "(?i)waiver"
      - "(?i)уступка\\s+прав"
      - "(?i)assignment\\s+of\\s+rights"

    low:
      - "(?i)automatic(ally)?\\s+terminat"
      - "(?i)досрочн[а-я]+\\s+погашени"
      - "(?i)step[-\\s]?up"
      - "(?i)cure\\s+period"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 420

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  retrieval_profile: "assignment_check"
  context_k: 6
  max_chunks: 12

  retrieval_query: >
    уступка прав assignment расторжение termination
    автоматическое прекращение акселерация acceleration
    досрочное исполнение step-up изменение условий cure period

  boost_keywords:
    - "termination upon assignment"
    - "расторжение при уступке"
    - "automatic termination"
    - "автоматическое прекращение"
    - "right to terminate"
    - "право расторгнуть"
    - "acceleration"
    - "досрочное исполнение"
    - "step-up"
    - "cure period"
    - "grace period"

  negative_keywords:
    - "change of control"
    - "смена контроля"
    - "consent"
    - "согласие"
    - "означает"
    - "в целях настоящего"
    - "споры"
    - "подсудность"
    - "применимое право"

  preferred_unit_types:
    - "termination_provision"
    - "liability_provision"
    - "obligation"
    - "general_provision"

  excluded_unit_types:
    - "definition"
    - "structural_anchor"
    - "technical_fragment"
    - "appendix_reference"

  preferred_clause_functions:
    - "rights"
    - "limitations"
    - "procedures"
    - "obligations"

  position_bias:
    preferred_range: [0.55, 1.00]
    boost: 0.30
    scope: "segment"

  rerank: true
  filters: {}

conditional: null

enrichment_hints:
  preferred_segment_types:
    - "contract"
    - "amendment"
  excluded_segment_types:
    - "technical_specification"
    - "price_list"
    - "invoice"
    - "act"
  confidence_bonus_on_match: 0.10
  confidence_penalty_on_excluded_segment: 0.15

extraction:
  enabled: true
  mode: "hybrid"
  llm_max_tokens: 850

  # Presence gate: отделяет факт наличия положений об уступке (at_consequences_status)
  # от их содержания (at_termination_right, at_termination_mechanism, at_acceleration,
  # at_price_terms_change, at_cure_or_waiver). missing -> missing_required_clause.
  # Контракт: present + missing + unclear = at_consequences_status.allowed_values.
  presence_signal:
    field: "at_consequences_status"
    present_values: ["present"]
    missing_values: ["missing"]
    unclear_values: ["unclear"]

  llm_prompt_extraction: |
    <role>
    Ты — юрист по коммерческим договорам.
    Твоя задача — точно извлечь substantive последствия,
    которые наступают при уступке прав / переводе долга /
    передаче обязательств.

    КРИТИЧЕСКИ ВАЖНО:
    - Извлекай ТОЛЬКО то, что прямо написано в тексте.
    - НЕ делай выводов "по умолчанию" из общих норм права.
    - НЕ додумывай последствия, которых нет в тексте.
    - Если информация отсутствует — ставь "no" / "none" /
      "not_applicable" для содержательных полей, а для поля
      at_consequences_status используй "missing".
    - Если текст неоднозначен — ставь "unclear",
      а не выбирай один из вариантов.

    Не анализируй смену контроля (CoC).
    Не анализируй механику согласия.
    Не анализируй базовый режим (prohibited / consent_required).
    Не оценивай общий M&A-риск.
    </role>

    <context_rules>
    - Ниже приведены фрагменты, отобранные автоматически.
    - Некоторые фрагменты могут быть нерелевантны данному
      check — игнорируй их.
    - Если среди фрагментов есть противоречия — укажи "unclear"
      и объясни в reason.
    - Если ни один фрагмент не содержит информации по теме —
      at_consequences_status = "missing"; остальные поля — согласно Шагу 0.
    - Не используй информацию из определений (definitions),
      преамбулы или приложений, если они не содержат
      substantive условий по теме check.
    </context_rules>

    <context>
    Ниже приведены релевантные фрагменты договора:

    {context}
    </context>

    <task>
    Заполни только следующие поля:
    - at_consequences_status
    - at_consequences_display
    - at_termination_right
    - at_termination_mechanism
    - at_acceleration
    - at_price_terms_change
    - at_cure_or_waiver
    - reason

    Общие правила:
    - используй только то, что прямо следует из текста;
    - не придумывай последствий, которых нет;
    - пиши коротко и по-русски.
    </task>

    <location_instructions>
    Для каждого поля по возможности укажи location в формате:
    {"clause_ref": "п. 12.4", "page": 15, "quote": "дословная фраза из договора"}

    Правила:
    - clause_ref — короткая ссылка на пункт / раздел / статью именно в том виде,
      как она написана в договоре;
    - page — целое число страницы;
    - quote — дословная фраза из текста договора (НЕ пересказ, НЕ парафраз),
      которая является источником значения поля. Копируй её посимвольно,
      сохраняя формулировку и порядок слов. Оптимальная длина: 30–300 символов.
      Примеры хорошего quote:
      * для at_termination_right (broad): "В случае уступки прав без предварительного согласия Поставщик вправе расторгнуть настоящий Договор в одностороннем порядке";
      * для at_termination_mechanism (automatic): "При уступке прав без согласия Поставщика настоящий Договор считается расторгнутым";
      * для at_acceleration (yes): "В случае уступки прав все неоплаченные суммы становятся немедленно подлежащими уплате";
      * для at_price_terms_change (yes): "При уступке прав базовая цена увеличивается на 15%";
      * для at_cure_or_waiver (yes): "Уступка без согласия допускается при условии устранения нарушения в течение 10 рабочих дней с момента уведомления".
    - не выдумывай location или quote;
    - если точную ссылку или дословную фразу определить нельзя,
      верни location = null;
    - для at_consequences_status, at_consequences_display и reason location всегда null
      (они синтезированы и не имеют прямого источника в тексте);
    - для at_termination_right, at_termination_mechanism, at_acceleration,
      at_price_terms_change, at_cure_or_waiver location с quote особенно важна;
    - для at_termination_right при значении "none":
      * quote, если договор прямо говорит об отсутствии права расторжения;
      * location = null, если право расторжения не раскрыто;
    - для at_acceleration, at_price_terms_change, at_cure_or_waiver
      при значении "no" — то же правило: quote при прямом исключении,
      null при отсутствии регулирования;
    - для at_termination_mechanism при значении "not_applicable" — location = null;
    - если at_consequences_status = "missing" — для всех полей location = null.
    </location_instructions>

    <instructions>
    Шаг 0 — НАЛИЧИЕ ПОЛОЖЕНИЙ ОБ УСТУПКЕ

    Заполни "at_consequences_status".

    Значения:
    - "present" — договор содержит положения об уступке прав /
      переводе долга (режим, согласие, запрет или последствия —
      любое из этого). Даже если специальных последствий нет.
    - "missing" — тема уступки в договоре вообще не упоминается.
    - "unclear" — формулировки есть, но надёжно определить нельзя.

    Если at_consequences_status = "missing":
    - at_termination_right = "none"
    - at_termination_mechanism = "not_applicable"
    - at_acceleration = "no"
    - at_price_terms_change = "no"
    - at_cure_or_waiver = "no"
    - at_consequences_display = "Положения об уступке / последствиях отсутствуют"
    - reason = "Положения о последствиях уступки не обнаружены в представленных фрагментах."
    - для всех полей location = null
    - не выполняй Шаги 1–5.

    Если at_consequences_status = "unclear":
    - at_termination_right = "unclear"
    - at_termination_mechanism = "unclear"
    - at_acceleration = "unclear"
    - at_price_terms_change = "unclear"
    - at_cure_or_waiver = "unclear"
    - at_consequences_display = "Не удалось определить последствия уступки"
    - reason = "Формулировки по уступке присутствуют, но вывод надёжно сделать нельзя."
    - для всех полей location = null

    Если at_consequences_status = "present" — переходи к Шагам 1–5.

    Шаг 1 — ПРАВО НА РАСТОРЖЕНИЕ

    Заполни "at_termination_right".

    Значения:
    - "none" — нет специального права на расторжение.
    - "limited" — право есть, но ограниченное: только при
      определённых условиях или с cure period.
    - "broad" — широкое право расторгнуть.
    - "unclear" — нельзя определить.

    Шаг 2 — МЕХАНИЗМ РАСТОРЖЕНИЯ

    Заполни "at_termination_mechanism".

    Значения:
    - "optional" — расторжение по выбору стороны.
    - "automatic" — договор прекращается автоматически.
    - "with_cure" — расторжение только после cure period.
    - "not_applicable" — at_termination_right = "none".
    - "unclear" — нельзя определить.

    Шаг 3 — АКСЕЛЕРАЦИЯ

    Заполни "at_acceleration".

    Значения:
    - "yes" — предусмотрено досрочное исполнение обязательств.
    - "no" — не предусмотрено.
    - "unclear" — нельзя определить.

    Шаг 4 — ИЗМЕНЕНИЕ ЦЕНЫ / УСЛОВИЙ

    Заполни "at_price_terms_change".

    Значения:
    - "yes" — предусмотрено ухудшение условий: step-up,
      отмена скидок / льгот, иные ухудшения.
    - "no" — не предусмотрено.
    - "unclear" — нельзя определить.

    Шаг 5 — СМЯГЧАЮЩИЕ МЕХАНИЗМЫ

    Заполни "at_cure_or_waiver".

    Значения:
    - "yes" — есть cure period, grace period или waiver.
    - "no" — смягчающих механизмов нет.
    - "unclear" — нельзя определить.

    Шаг 6 — DISPLAY ДЛЯ DD GRID

    Заполни "at_consequences_display".

    Это поле — краткий итог для таблицы.
    Сформируй его на основе уже заполненных полей:
    - at_consequences_status
    - at_termination_right
    - at_termination_mechanism
    - at_acceleration
    - at_price_terms_change
    - at_cure_or_waiver
    Не добавляй информацию, которой нет в этих полях.

    Примеры:
    - status = "missing":
      "Положения об уступке / последствиях отсутствуют"
    - status = "unclear":
      "Не удалось определить последствия уступки"
    - status = "present" и at_termination_mechanism = "automatic":
      "Для уступки — автоматическое прекращение договора"
    - status = "present" и at_termination_mechanism = "with_cure":
      "Для уступки — право расторгнуть; cure period предусмотрен"
    - status = "present" и at_termination_right = "broad":
      "Для уступки — право расторгнуть; акселерация"
    - status = "present" и at_price_terms_change = "yes":
      "Для уступки — ухудшение условий / step-up"
    - status = "present", но все последствия = no/none:
      "Для уступки — только режим (согласие / запрет); специальных последствий нет"

    Шаг 7 — ОБОСНОВАНИЕ

    Заполни "reason".

    Формат:
    - Первое предложение: краткий вывод
      (какие последствия предусмотрены или не предусмотрены).
    - Второе предложение: цитата из текста в кавычках
      (самый релевантный фрагмент, до 100 символов).

    Примеры:
    - "При уступке без согласия договор прекращается автоматически.
      «В случае уступки прав без согласия Поставщика
      договор считается расторгнутым»."
    - "Специальные последствия уступки не обнаружены
      в представленных фрагментах."
    </instructions>

    <edge_cases>
    - Договор прекращается автоматически:
      * at_consequences_status = "present"
      * at_termination_right = "broad"
      * at_termination_mechanism = "automatic"
      * at_cure_or_waiver = "no"
      * at_consequences_display =
        "Для уступки — автоматическое прекращение договора"

    - Право расторгнуть с cure period:
      * at_consequences_status = "present"
      * at_termination_right = "limited"
      * at_termination_mechanism = "with_cure"
      * at_cure_or_waiver = "yes"
      * at_consequences_display =
        "Для уступки — право расторгнуть; cure period предусмотрен"

    - Только режим, без расторжения / акселерации:
      * at_consequences_status = "present"
      * at_termination_right = "none"
      * at_termination_mechanism = "not_applicable"
      * at_acceleration = "no"
      * at_price_terms_change = "no"
      * at_cure_or_waiver = "no"
      * at_consequences_display =
        "Для уступки — только режим (согласие / запрет); специальных последствий нет"

    - Тема уступки вообще не урегулирована:
      * at_consequences_status = "missing"
      * at_termination_right = "none"
      * at_termination_mechanism = "not_applicable"
      * at_acceleration = "no"
      * at_price_terms_change = "no"
      * at_cure_or_waiver = "no"
      * at_consequences_display =
        "Положения об уступке / последствиях отсутствуют"

    - Нет релевантных фрагментов:
      * at_consequences_status = "missing"
      * at_consequences_display =
        "Положения об уступке / последствиях отсутствуют"

    - Фрагменты есть, но вывод нельзя:
      * at_consequences_status = "unclear"
      * at_termination_right = "unclear"
      * at_termination_mechanism = "unclear"
      * at_acceleration = "unclear"
      * at_price_terms_change = "unclear"
      * at_cure_or_waiver = "unclear"
      * at_consequences_display =
        "Не удалось определить последствия уступки"
    </edge_cases>

    <output_expectations>
    - Верни результат строго в формате JSON.
    - Не оборачивай в markdown-блоки (без ```).
    - Не добавляй комментариев вне JSON.
    - Все значения полей с allowed_values — на английском
      (как указано в списке).
    - Свободные текстовые поля (at_consequences_display,
      reason) — на русском языке.
    - Не добавляй никаких полей, кроме указанных.
    - Для каждого поля возвращай объект с ключами
      "value", "confidence", "location".

    Пример структуры ответа:
    {
      "at_consequences_status": {"value": "present", "confidence": 0.95, "location": null},
      "at_consequences_display": {"value": "Для уступки — право расторгнуть; cure period предусмотрен", "confidence": 0.95, "location": null},
      "at_termination_right": {"value": "limited", "confidence": 0.92, "location": {"clause_ref": "п. 12.4", "page": 15, "quote": "При уступке прав без согласия Поставщик вправе расторгнуть настоящий Договор, если нарушение не устранено в течение 10 рабочих дней"}},
      "at_termination_mechanism": {"value": "with_cure", "confidence": 0.92, "location": {"clause_ref": "п. 12.4", "page": 15, "quote": "При уступке прав без согласия Поставщик вправе расторгнуть настоящий Договор, если нарушение не устранено в течение 10 рабочих дней"}},
      "at_acceleration": {"value": "no", "confidence": 0.90, "location": null},
      "at_price_terms_change": {"value": "no", "confidence": 0.90, "location": null},
      "at_cure_or_waiver": {"value": "yes", "confidence": 0.92, "location": {"clause_ref": "п. 12.4", "page": 15, "quote": "если нарушение не устранено в течение 10 рабочих дней"}},
      "reason": {"value": "При уступке без согласия предусмотрено право расторжения с cure period. «При уступке прав без согласия Поставщик вправе расторгнуть ... если нарушение не устранено в течение 10 рабочих дней».", "confidence": 0.90, "location": null}
    }
    </output_expectations>

  fields:
    - name: "at_consequences_status"
      type: "string"
      presentation: "signal"
      risk_weight: "info"
      description: "Наличие положений об уступке / переводе долга (тема check)"
      display_in_grid: false
      allowed_values:
        - "present"
        - "missing"
        - "unclear"

    - name: "at_consequences_display"
      type: "string"
      presentation: "fact"
      label: "Последствия уступки"
      description: "Нормализованный user-facing вывод для DD Grid"
      display_in_grid: true
      display_priority: 1

    - name: "at_termination_right"
      type: "string"
      presentation: "signal"
      risk_weight: "high"
      description: "Право на расторжение при уступке"
      display_in_grid: false
      allowed_values:
        - "none"
        - "limited"
        - "broad"
        - "unclear"

    - name: "at_termination_mechanism"
      type: "string"
      presentation: "signal"
      risk_weight: "high"
      description: "Механизм расторжения при уступке"
      display_in_grid: false
      allowed_values:
        - "optional"
        - "automatic"
        - "with_cure"
        - "not_applicable"
        - "unclear"

    - name: "at_acceleration"
      type: "string"
      presentation: "signal"
      risk_weight: "medium"
      description: "Акселерация при уступке"
      display_in_grid: false
      allowed_values:
        - "yes"
        - "no"
