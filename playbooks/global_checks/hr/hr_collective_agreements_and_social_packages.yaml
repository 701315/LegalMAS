id: "hr_collective_agreements_and_social_packages"
name: "Коллективные договоры и социальные обязательства"
description: >
  Анализирует коллективные договоры (CBA), соглашения с профсоюзами
  и социальные обязательства работодателя: наличие и срок CBA,
  социальные пакеты и дополнительные гарантии (ДМС, отпуска,
  enhanced severance), процедуры консультаций при реорганизации
  или CoC, ограничения на сокращение штата. Оценивает влияние
  на гибкость, затраты и возможности оптимизации Target после M&A.

doc_types: []

severity: "medium"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"

rules:
  keyword_mode: any

  keywords:
    high:
      # Коллективные договоры
      - "(?i)коллективн[а-я]+\\s+договор"
      - "(?i)collective\\s+(bargaining\\s+)?agreement"
      - "(?i)\\bCBA\\b"
      - "(?i)соглашени[ея]\\s+с\\s+профсоюз"
      - "(?i)agreement\\s+with\\s+(the\\s+)?(trade\\s+)?union"

      # Профсоюзы
      - "(?i)профсоюз"
      - "(?i)trade\\s+union"
      - "(?i)labor\\s+union"
      - "(?i)works?\\s+council"
      - "(?i)совет\\s+трудового\\s+коллектива"
      - "(?i)представительн[а-я]+\\s+орган\\s+работников"

      # Консультации при реорганизации
      - "(?i)consultation\\s+with\\s+(employees?|workers?|union)"
      - "(?i)консультаци[яи]\\s+с\\s+(работниками|профсоюзом)"
      - "(?i)уведомлени[ея]\\s+работников"
      - "(?i)notification\\s+to\\s+(employees?|workers?)"
      - "(?i)обязательн[а-я]+\\s+консультаци"
      - "(?i)mandatory\\s+consultation"

      # Enhanced severance
      - "(?i)enhanced\\s+severance"
      - "(?i)повышенн[а-я]+\\s+(выходн[а-я]+\\s+)?пособи"
      - "(?i)severance\\s+(pay(ment)?|package)\\s+exceed"
      - "(?i)выплат[аы]\\s+сверх\\s+(установленных|ТК|закон)"
      - "(?i)дополнительн[а-я]+\\s+компенсаци[яи]\\s+при\\s+(увольнении|сокращении)"

    medium:
      # Социальный пакет
      - "(?i)социальн[а-я]+\\s+пакет"
      - "(?i)social\\s+package"
      - "(?i)benefits?\\s+package"
      - "(?i)fringe\\s+benefits?"
      - "(?i)социальн[а-я]+\\s+льгот"
      - "(?i)employee\\s+benefits?"

      # Конкретные льготы
      - "(?i)\\bДМС\\b"
      - "(?i)добровольн[а-я]+\\s+медицинск[а-я]+\\s+страховани"
      - "(?i)health\\s+insurance"
      - "(?i)medical\\s+insurance"
      - "(?i)дополнительн[а-я]+\\s+отпуск"
      - "(?i)additional\\s+(paid\\s+)?leave"
      - "(?i)пенсионн[а-я]+\\s+(план|программ)"
      - "(?i)pension\\s+(plan|scheme)"
      - "(?i)housing\\s+(allowance|benefit)"
      - "(?i)жилищн[а-я]+\\s+(компенсаци|субсиди)"

      # Ограничения на сокращения
      - "(?i)no[-\\s]?redundanc(y|ies)"
      - "(?i)запрет\\s+(на\\s+)?сокращени"
      - "(?i)job\\s+security\\s+(guarantee|clause)"
      - "(?i)гаранти[яи]\\s+сохранени[яи]\\s+(рабочих\\s+)?мест"
      - "(?i)moratorium\\s+on\\s+(layoffs?|redundancies)"

      # Срок CBA
      - "(?i)срок\\s+действия\\s+(коллективного\\s+)?договор"
      - "(?i)term\\s+of\\s+(the\\s+)?(collective\\s+)?agreement"
      - "(?i)valid\\s+until"
      - "(?i)действует\\s+до"

      # Обязательства перед работниками
      - "(?i)обязательств[аоы]\\s+перед\\s+работниками"
      - "(?i)obligations?\\s+to(wards?)?\\s+(employees?|workers?)"

    low:
      # Общие термины
      - "(?i)работник"
      - "(?i)employee"
      - "(?i)worker"
      - "(?i)персонал"
      - "(?i)staff"
      - "(?i)льгот"
      - "(?i)benefit"
      - "(?i)компенсаци"
      - "(?i)compensation"
      - "(?i)увольнени"
      - "(?i)termination"
      - "(?i)сокращени"
      - "(?i)redundancy"
      - "(?i)layoff"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 700

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  context_k: 5
  max_chunks: 10
  boost_keywords:
    - "коллективный договор"
    - "collective agreement"
    - "collective bargaining agreement"
    - "CBA"
    - "профсоюз"
    - "trade union"
    - "works council"
    - "социальный пакет"
    - "social package"
    - "benefits package"
    - "ДМС"
    - "health insurance"
    - "дополнительный отпуск"
    - "enhanced severance"
    - "повышенное выходное пособие"
    - "консультации с работниками"
    - "consultation with employees"
    - "уведомление работников"
    - "no-redundancy"
    - "запрет сокращений"
    - "job security"
    - "гарантия сохранения рабочих мест"
    - "pension plan"
    - "пенсионная программа"
  rerank: true
  filters: {}

conditional: null

extraction:
  llm_prompt_extraction: |
    <role>
    Ты — юрист по трудовому праву и HR due diligence.
    Твоя специализация — анализ коллективных договоров,
    соглашений с профсоюзами, социальных обязательств
    работодателя и их влияния на гибкость компании
    при M&A-сделках.
    </role>

    <context>
    Ниже приведены фрагменты коллективных договоров, соглашений
    с профсоюзами или иных документов, содержащих социальные
    обязательства:

    {context}
    </context>

    <instructions>
    Проведи анализ по шагам. Каждый шаг логически соответствует одному
    или нескольким полям итоговой оценки риска.

    Шаг 1 — НАЛИЧИЕ КОЛЛЕКТИВНЫХ ДОГОВОРОВ / СОГЛАШЕНИЙ С ПРОФСОЮЗАМИ
    (используется для заполнения поля "has_collective_agreement"):
    - Определи, есть ли:
      * коллективный договор (CBA);
      * соглашение с профсоюзом / trade union;
      * соглашение с works council / советом трудового коллектива.
    - Оцени:
      * "yes" — есть;
      * "no" — нет;
      * "unclear" — неясно (упоминается профсоюз, но нет текста CBA).

    Шаг 2 — СРОК И УСЛОВИЯ ИЗМЕНЕНИЯ CBA
    (используется для заполнения поля "cba_term"):
    - Определи срок действия CBA:
      * конкретный период (например, «до 31.12.2026»);
      * бессрочный;
      * не указан.

    Шаг 3 — СОЦИАЛЬНЫЙ ПАКЕТ
    (используется для заполнения поля "social_benefits_summary"):
    - Определи ключевые элементы соцпакета:
      * ДМС / медицинское страхование;
      * дополнительные отпуска;
      * пенсионные программы;
      * жилищные субсидии;
      * дотации на питание, проезд;
      * иные льготы.

    Шаг 4 — ОГРАНИЧЕНИЯ НА СОКРАЩЕНИЯ
    (используется для заполнения поля "has_redundancy_restrictions"):
    - Определи, есть ли:
      * no-redundancy clauses (запрет сокращений);
      * job security guarantees (гарантии сохранения рабочих мест);
      * moratorium on layoffs;
      * ограничения на аутсорсинг / offshoring.
    - Оцени:
      * "yes" — есть;
      * "no" — нет;
      * "unclear" — неясно.

    Шаг 5 — КОНСУЛЬТАЦИИ ПРИ РЕОРГАНИЗАЦИИ / CoC
    (используется для заполнения поля "requires_consultation_on_restructuring"):
    - Определи, есть ли требования:
      * консультации с работниками / профсоюзом
        при реорганизации;
      * уведомление / согласование при массовых увольнениях;
      * специальные процедуры при смене контроля (CoC).
    - Оцени:
      * "yes" — обязательные консультации предусмотрены;
      * "no" — не предусмотрены;
      * "unclear" — неясно.

    Шаг 6 — ОХВАТ И СИЛА ПРОФСОЮЗА
    (используется для заполнения поля "union_coverage_strength"):
    - Если профсоюз упоминается, оцени:
      * долю работников, охваченных CBA (если указана);
      * силу переговорной позиции профсоюза.
    - Оцени:
      * "high" — высокий охват (> 50%) или сильный профсоюз;
      * "medium" — умеренный охват / влияние;
      * "low" — низкий охват / слабый профсоюз;
      * "none" — профсоюз отсутствует;
      * "unclear" — неясно.

    Шаг 7 — RED FLAGS
    (используется для заполнения поля "red_flags"):
    Присвой один или несколько кодов из списка ниже.
    Если ни один код не применим — верни "NONE".
    Если данных недостаточно для оценки — верни "UNCLEAR".

    Коды:
    • CBA1 — Коллективный договор с широким соцпакетом
      и повышенными выплатами, существенно увеличивающими
      затраты.
    • CBA2 — Обязательные консультации / согласования
      с профсоюзом при реорганизации, массовых увольнениях
      или CoC.
    • CBA3 — Enhanced severance (повышенные выходные пособия
      сверх ТК РФ / законодательства).
    • CBA4 — No-redundancy clause или ограничения
      на сокращение штата.
    • CBA5 — Долгосрочный CBA (> 3 лет) без чёткой процедуры
      досрочного прекращения / пересмотра.
    • CBA6 — Высокая доля работников, охваченных CBA,
      или сильный профсоюз с переговорной силой.

    Формат ответа: коды через запятую без комментариев
    (например: "CBA1, CBA3").
    Вся аргументация — в поле reason.

    Шаг 8 — ОБОСНОВАНИЕ
    (используется для заполнения поля "reason"):

    - В reason кратко обоснуй вывод, опираясь на ключевые
      формулировки из текста (с цитатами в кавычках), и укажи:
      * есть ли CBA и его срок;
      * какие льготы и гарантии предусмотрены;
      * есть ли ограничения на сокращения;
      * требуются ли консультации при реорганизации;
      * если выставлены red_flags — обоснуй каждый код;
      * если red_flags = "NONE" — укажи, почему HR-риск
        минимален.
    </instructions>

    <edge_cases>
    Обрабатывай пограничные ситуации так:

    - Упоминается профсоюз, но нет текста CBA:
      has_collective_agreement = "unclear";
      union_coverage_strength оцени по доступным данным;
      в reason укажи неопределённость.

    - Описан расширенный соцпакет, но неясно,
      закреплён ли он CBA:
      social_benefits_summary заполни по содержанию;
      has_collective_agreement = "unclear";
      в reason отрази условия соцпакета как факт.

    - Явные обязанности по консультации при реорганизации / CoC:
      requires_consultation_on_restructuring = "yes";
      зафиксируй CBA2; risk не ниже MEDIUM.

    - Enhanced severance (например, «3 месячных оклада
      сверх установленных законом»):
      has_enhanced_severance = "yes";
      зафиксируй CBA3; в reason укажи размер.

    - No-redundancy clause:
      has_redundancy_restrictions = "yes";
      зафиксируй CBA4; risk HIGH.

    - CBA действует до 2030 года, процедура пересмотра
      не указана:
      cba_term = «до 2030»;
      cba_modification_procedure = "unclear" или "no";
      зафиксируй CBA5.

    - Фрагменты не содержат упоминаний профсоюзов,
      CBA, соцпакетов:
      has_collective_agreement = "no";
      red_flags = "NONE"; risk LOW;
      в reason отметь отсутствие упоминаний.

    - Пустые или явно нерелевантные фрагменты:
      red_flags = "UNCLEAR"; в reason укажи недостаток данных.
    </edge_cases>

    <output_expectations>
    На основе твоего анализа отдельный механизм извлечения сформирует
    структурированные поля по заранее заданной схеме. Твоя задача —
    давать чёткие юридические выводы и указывать конкретные
    формулировки из текста, на которых они основаны.
    </output_expectations>

  enabled: true
  mode: "hybrid"
  fields:
    - name: "has_collective_agreement"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "cba_term"
      type: "string"

    - name: "social_benefits_summary"
      type: "string"

    - name: "has_redundancy_restrictions"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "requires_consultation_on_restructuring"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "union_coverage_strength"
      type: "string"
      allowed_values:
        - "high"
        - "medium"
        - "low"
        - "none"
        - "unclear"

    - name: "red_flags"
      type: "string"

    - name: "reason"
      type: "string"

  store_payload: true

red_flags:
  items:
    - code: "CBA1"
      description: >
        Коллективный договор с широким соцпакетом и повышенными
        выплатами, существенно увеличивающими затраты.
    - code: "CBA2"
      description: >
        Обязательные консультации / согласования с профсоюзом
        при реорганизации, массовых увольнениях или CoC.
    - code: "CBA3"
      description: >
        Enhanced severance (повышенные выходные пособия
        сверх ТК РФ / законодательства).
    - code: "CBA4"
      description: >
        No-redundancy clause или ограничения на сокращение штата.
    - code: "CBA5"
      description: >
        Долгосрочный CBA (> 3 лет) без чёткой процедуры
        досрочного прекращения / пересмотра.
    - code: "CBA6"
      description: >
        Высокая доля работников, охваченных CBA, или сильный
        профсоюз с переговорной силой.