id: "hr_collective_agreements_and_social_packages"
name: "Коллективные договоры и социальные обязательства"
description: >
  Анализирует коллективные договоры, соглашения с профсоюзами и социальные
  пакеты, которые могут создать дополнительные обязательства или ограничения
  для работодателя после сделки.

doc_types: []

severity: "medium"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"

rules:
  keywords:
    - "коллективный договор"
    - "collective agreement"
    - "collective bargaining agreement"
    - "соглашение с профсоюзом"
    - "trade union"
    - "профсоюз"
    - "социальный пакет"
    - "benefits"
    - "fringe benefits"
    - "социальные льготы"
    - "уведомление работников"
    - "consultation with employees"
    - "обязательства перед работниками"
  keyword_mode: "any"
  regex_patterns: []
  clause_patterns: []

llm:
  prompt_template: |
    <role>
    Ты — юрист по трудовому праву.
    Твоя специализация — коллективные договоры, соглашения с профсоюзами
    и связанные с ними социальные обязательства работодателя.
    </role>

    <context>
    Ниже приведены фрагменты договоров и соглашений, которые могут быть
    коллективными договорами или соглашениями с профсоюзами:

    {context}
    </context>

    <instructions>
    Проведи анализ по шагам. Каждый шаг логически связан с одним или
    несколькими полями итоговой оценки.

    Шаг 1 — НАЛИЧИЕ КОЛЛЕКТИВНЫХ/ПРОФСОЮЗНЫХ СОГЛАШЕНИЙ
    (используется для заполнения "has_collective_or_union_agreements"):
    - Определи, есть ли у компании:
      * коллективные договоры (collective agreement, collective bargaining agreement);
      * соглашения с профсоюзами или trade union;
      * иные формализованные соглашения с представительным органом работников.
    - Сделай вывод: да / нет / по тексту неясно, не предполагая наличие
      договора без прямых указаний.

    Шаг 2 — СОЦИАЛЬНЫЕ ПАКЕТЫ И ДОПОЛНИТЕЛЬНЫЕ ГАРАНТИИ
    (используется для "social_benefits_summary"):
    - Определи, какие ключевые элементы соцпакета и дополнительных гарантий
      предусмотрены:
      * дополнительные отпуска, ДМС, страхование;
      * дополнительные компенсации и выплаты (при сокращении, к праздникам,
        на питание, жильё и т.п.);
      * программы обучения, пенсионные планы, иные льготы.
    - Кратко опиши объём и характер этих benefits, не уходя в излишние детали.

    Шаг 3 — ПРОЦЕДУРЫ УВЕДОМЛЕНИЯ/КОНСУЛЬТАЦИЙ ПРИ РЕОРГАНИЗАЦИИ И CoC
    (используется для "requires_employee_consultation_on_restructuring_or_coc"):
    - Выяви, есть ли специальные требования:
      * consultation with employees / консультации с работниками или профсоюзами;
      * особые процедуры уведомления при реорганизации, массовых увольнениях,
        смене контроля или акционеров;
      * сроки и форматы таких консультаций или согласований.
    - Сделай вывод: да / нет / неясно, исходя только из прямых формулировок.

    Шаг 4 — РИСК ДОПЗАТРАТ И ПРОЦЕДУРНЫХ ОГРАНИЧЕНИЙ
    (используется для "hr_collective_obligations_risk_level"):
    - Оцени, насколько социальные пакеты и коллективные обязательства:
      * увеличивают прямые расходы работодателя (широкие соцпакеты, повышенные пособия);
      * усложняют и удлиняют процедуры реструктуризации, сокращений, смены
        контроля (обязательные консультации, согласования, дополнительные выплаты);
      * ограничивают гибкость в оптимизации штата.
    - Сформулируй уровень риска как:
      * low — стандартный или минимальный соцпакет, без жёстких процедур;
      * medium — заметные допзатраты или отдельные процедурные ограничения;
      * high — значительные дополнительные выплаты и/или строгие процедуры
        консультаций и согласований;
      * unclear — по фрагментам нельзя надёжно оценить масштаб.

    Шаг 5 — ОБЩИЙ РИСК ДЛЯ ГИБКОСТИ TARGET
    (используется для "overall_risk_level" и "reason"):
    - Учитывая наличие коллективных договоров, соцпакетов и процедур консультаций,
      оцени общий риск для гибкости Target после сделки:
      * насколько коллективные договоры и льготы «забетонируют» структуру затрат;
      * осложнят ли они изменения оргструктуры, массовые увольнения, закрытие
        площадок или смену бизнес-модели;
      * есть ли концентрация рисков в отдельных юрисдикциях или ключевых
        подразделениях.
    - Сформулируй общий риск как low / medium / high.
    - В "reason" кратко обоснуй вывод, ссылаясь на ключевые формулировки
      (желательно с короткими цитатами) и пояснив влияние на затраты и гибкость Target.
    </instructions>

    <edge_cases>
    Обрабатывай пограничные ситуации так:

    - Упоминается профсоюз, но нет явного текста коллективного договора:
      не предполагай его существование автоматически, фиксируй неопределённость.

    - Описан расширенный соцпакет (ДМС, доп. отпуска, значимые доплаты),
      но не ясно, закреплён ли он именно коллективным договором:
      отражай условия соцпакета как факт, при этом статус коллективного договора
      можешь оставить "unclear".

    - Явно указаны обязанности по консультации/уведомлению работников или
      профсоюза при реорганизации или CoC:
      учитывай, что это повышает процедурную нагрузку и может увеличивать
      уровень риска как минимум до умеренного.

    - Фрагменты не содержат ни слов о профсоюзах, ни о коллективных договорах,
      ни о соцпакетах:
      аккуратно фиксируй отсутствие упоминаний, не предполагая наличие
      скрытых обязательств.

    - Пустые или явно нерелевантные фрагменты:
      укажи, что данных недостаточно для анализа коллективных договоров и
      социальных обязательств, и объясни, как это влияет на неопределённость
      и оценку риска.
    </edge_cases>

    <output_expectations>
    На основе твоего анализа отдельный механизм извлечения сформирует
    структурированные поля по заранее заданной схеме. Твоя задача —
    давать чёткие юридические выводы и указывать конкретные формулировки
    из текста, на которых они основаны.
    </output_expectations>
  prompt_file: null
  context_k: 4
  temperature: 0.0
  max_tokens: 512

evidence:
  required: false
  min_snippet_length: 20
  max_snippet_length: 500

retrieval:
  context_k: 4
  max_chunks: 8
  boost_keywords:
    - "коллективный договор"
    - "collective agreement"
    - "trade union"
    - "социальный пакет"
    - "benefits"
  rerank: true
  filters: {}

conditional: null

extraction:
  enabled: true
  mode: "hybrid"
  fields:
    - name: "has_collective_or_union_agreements"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "social_benefits_summary"
      type: "string"

    - name: "requires_employee_consultation_on_restructuring_or_coc"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "hr_collective_obligations_risk_level"
      type: "string"
      allowed_values:
        - "low"
        - "medium"
        - "high"
        - "unclear"

    - name: "overall_risk_level"
      type: "string"
      allowed_values:
        - "low"
        - "medium"
        - "high"

    - name: "reason"
      type: "string"

  store_payload: true

red_flags:
  items:
    - code: "HR3"
      description: "Существенные дополнительные социальные обязательства, усложняющие оптимизацию штата."
    - code: "HR4"
      description: "Строгие требования по консультациям/одобрениям работников при реорганизации или смене контроля."
