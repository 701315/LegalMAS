id: "hr_collective_agreements_and_social_packages"
name: "Коллективные договоры и социальные обязательства"
group: "HR"
description: >
  Анализирует коллективные договоры (CBA), соглашения с профсоюзами
  и социальные обязательства работодателя: наличие и срок CBA,
  социальные пакеты и дополнительные гарантии (ДМС, отпуска,
  enhanced severance), ограничения на сокращение штата, процедуры
  обязательных консультаций при реорганизации или CoC.

  Формирует краткий user-facing вывод и оценивает влияние на
  гибкость, затраты и возможности оптимизации Target после M&A.

doc_types: []

severity: "medium"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"
ui_mode: "field_extraction"

rules:
  keyword_mode: any

  keywords:
    high:
      # Коллективные договоры
      - "(?i)коллективн[а-я]+\\s+договор"
      - "(?i)collective\\s+(bargaining\\s+)?agreement"
      - "(?i)\\bCBA\\b"
      - "(?i)соглашени[ея]\\s+с\\s+профсоюз"
      - "(?i)agreement\\s+with\\s+(the\\s+)?(trade\\s+)?union"

      # Профсоюзы
      - "(?i)профсоюз"
      - "(?i)trade\\s+union"
      - "(?i)labor\\s+union"
      - "(?i)works?\\s+council"
      - "(?i)совет\\s+трудового\\s+коллектива"
      - "(?i)представительн[а-я]+\\s+орган\\s+работников"

      # Консультации при реорганизации
      - "(?i)consultation\\s+with\\s+(employees?|workers?|union)[\\s\\S]{0,30}(restructur|reorganiz|CoC)"
      - "(?i)консультаци[яи]\\s+с\\s+(работниками|профсоюзом)[\\s\\S]{0,30}(реорганизаци|CoC|сделк)"
      - "(?i)уведомлени[ея]\\s+работников[\\s\\S]{0,30}(реорганизаци|увольнени|CoC)"
      - "(?i)mandatory\\s+consultation[\\s\\S]{0,30}(redundanc|restructur|union)"
      - "(?i)обязательн[а-я]+\\s+консультаци[яи][\\s\\S]{0,30}(профсоюз|работник)"

      # Enhanced severance
      - "(?i)enhanced\\s+severance"
      - "(?i)повышенн[а-я]+\\s+(выходн[а-я]+\\s+)?пособи"
      - "(?i)severance\\s+(pay|package)[\\s\\S]{0,20}(exceed|above|multiple)"
      - "(?i)выплат[аы]\\s+сверх\\s+(установленных|ТК|закон)"
      - "(?i)дополнительн[а-я]+\\s+компенсаци[яи]\\s+при\\s+(увольнении|сокращении)"

    medium:
      # Социальный пакет
      - "(?i)социальн[а-я]+\\s+пакет"
      - "(?i)social\\s+package"
      - "(?i)benefits?\\s+package"
      - "(?i)fringe\\s+benefits?"
      - "(?i)employee\\s+benefits?"

      # Конкретные льготы
      - "(?i)\\bДМС\\b"
      - "(?i)добровольн[а-я]+\\s+медицинск[а-я]+\\s+страховани"
      - "(?i)health\\s+insurance[\\s\\S]{0,20}(employer|работодател)"
      - "(?i)дополнительн[а-я]+\\s+отпуск[аи]?"
      - "(?i)additional\\s+(paid\\s+)?leave[\\s\\S]{0,20}(employee|above)"
      - "(?i)пенсионн[а-я]+\\s+(план|программ)"
      - "(?i)pension\\s+(plan|scheme)"

      # Ограничения на сокращения
      - "(?i)no[-\\s]?redundanc(y|ies)"
      - "(?i)запрет\\s+(на\\s+)?сокращени[яе]"
      - "(?i)job\\s+security\\s+(guarantee|clause)"
      - "(?i)гаранти[яи]\\s+сохранени[яи]\\s+(рабочих\\s+)?мест"
      - "(?i)moratorium\\s+on\\s+(layoffs?|redundancies)"
      - "(?i)ограничени[яе]\\s+на\\s+(аутсорсинг|offshoring|outsourcing)"

      # Срок CBA
      - "(?i)срок\\s+действия\\s+(коллективного\\s+)?договор"
      - "(?i)term\\s+of\\s+(the\\s+)?(collective\\s+)?agreement"
      - "(?i)valid\\s+until"
      - "(?i)действует\\s+до"

    low:
      - "(?i)коллективн[а-я]+\\s+договор"
      - "(?i)collective\\s+(bargaining\\s+)?agreement"
      - "(?i)профсоюз"
      - "(?i)trade\\s+union"
      - "(?i)enhanced\\s+severance"
      - "(?i)повышенн[а-я]+\\s+пособи"
      - "(?i)no[-\\s]?redundancy"
      - "(?i)запрет\\s+сокращени"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 700

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  retrieval_profile: "employment_benefits_check"
  context_k: 5
  max_chunks: 10

  retrieval_query: >
    коллективный договор профсоюз социальный пакет ДМС пенсионная программа 
    выходное пособие гарантия рабочих мест консультации с профсоюзом

  boost_keywords:
    - "коллективный договор"
    - "collective agreement"
    - "collective bargaining agreement"
    - "CBA"
    - "профсоюз"
    - "trade union"
    - "works council"
    - "социальный пакет"
    - "social package"
    - "benefits package"
    - "ДМС"
    - "добровольное медицинское страхование"
    - "health insurance"
    - "дополнительный отпуск"
    - "enhanced severance"
    - "повышенное выходное пособие"
    - "консультации с работниками"
    - "consultation with employees"
    - "уведомление работников"
    - "no-redundancy"
    - "запрет сокращений"
    - "job security"
    - "гарантия сохранения рабочих мест"
    - "pension plan"
    - "пенсионная программа"
    - "moratorium on layoffs"

  negative_keywords:
    - "коммерческая тайна"
    - "интеллектуальная собственность"
    - "подсудность"
    - "применимое право"
    - "штрафные санкции"

  preferred_unit_types:
    - "obligation"
    - "general_provision"
    
  excluded_unit_types:
    - "definition"
    - "structural_anchor"
    - "technical_fragment"
    - "appendix_reference"

  preferred_clause_functions:
    - "obligations"
    - "procedures"
    - "limitations"
    - "remedies"

  position_bias:
    preferred_range: [0.0, 1.0]
    boost: 0.10
    scope: "segment"

  rerank: true
  filters: {}

conditional: null

enrichment_hints:
  preferred_segment_types:
    - "contract"
    - "annex"
    - "appendix"
    - "amendment"
  excluded_segment_types:
    - "technical_specification"
    - "price_list"
    - "invoice"
    - "act"
    - "schedule"
  confidence_bonus_on_match: 0.08
  confidence_penalty_on_excluded_segment: 0.15

extraction:
  enabled: true
  mode: "hybrid"
  llm_max_tokens: 1200

  llm_prompt_extraction: |
    <role>
    Ты — юрист по трудовому праву.
    Твоя задача — точно извлечь из текста:
    1) есть ли коллективный договор / соглашение с профсоюзом;
    2) какие социальные льготы предусмотрены;
    3) есть ли enhanced severance;
    4) есть ли ограничения на сокращения;
    5) требуются ли обязательные консультации при реорганизации
       или CoC.

    КРИТИЧЕСКИ ВАЖНО:
    - Извлекай ТОЛЬКО то, что прямо написано в тексте.
    - НЕ придумывай CBA, если упоминается только профсоюз
      без текста коллективного договора или соглашения.
    - НЕ выводи срок CBA по умолчанию, если он не указан.
    - Если информация отсутствует — используй "no", "unclear"
      или соответствующее текстовое состояние.
    </role>

    <context>
    Ниже приведены релевантные фрагменты договора:

    {context}
    </context>

    <context_rules>
    - Некоторые фрагменты могут быть нерелевантны — игнорируй их.
    - Если фрагменты противоречат друг другу — используй "unclear"
      и кратко объясни это в reason.
    - Профсоюз или works council без текста CBA не означает
      автоматически наличие коллективного договора.
    - `union_coverage_strength` заполняй только если охват
      или сила профсоюза прямо видны из текста.
    - Если есть только общие упоминания соцпакета без перечня,
      не придумывай элементы пакета.
    </context_rules>

    <task>
    Заполни только следующие поля:
    - hr_cba_display
    - has_collective_agreement
    - cba_term
    - cba_modification_procedure
    - social_benefits_summary
    - has_enhanced_severance
    - has_redundancy_restrictions
    - requires_consultation_on_restructuring
    - union_coverage_strength
    - reason
    </task>

    <instructions>
    Шаг 1 — НАЛИЧИЕ CBA / СОГЛАШЕНИЯ С ПРОФСОЮЗОМ

    Заполни "has_collective_agreement".

    Значения:
    - "yes" — есть CBA / соглашение с профсоюзом /
      works council arrangement.
    - "no" — нет.
    - "unclear" — профсоюз упоминается, но наличие самого
      CBA / соглашения не подтверждено.

    Шаг 2 — СРОК CBA

    Заполни "cba_term".

    Правила:
    - Если срок указан: "до 31.12.2026", "3 года"
    - Если CBA есть, но срок не указан: "Не указан"
    - Если CBA нет: "Не применимо"
    - Если нельзя определить: "Не удалось определить"

    Шаг 3 — ПРОЦЕДУРА ПЕРЕСМОТРА CBA

    Заполни "cba_modification_procedure".

    Значения:
    - "yes" — процедура пересмотра / изменения предусмотрена.
    - "no" — не предусмотрена.
    - "not_applicable" — CBA нет.
    - "unclear" — нельзя определить.

    Шаг 4 — СОЦИАЛЬНЫЙ ПАКЕТ

    Заполни "social_benefits_summary".

    Правила:
    - Кратко через ";", не более 3 элементов:
      "ДМС; дополнительный отпуск 5 дней; пенсионная программа"
    - Если нет: "Не предусмотрен"
    - Если нельзя определить: "Не удалось определить"

    Шаг 5 — ENHANCED SEVERANCE

    Заполни "has_enhanced_severance".

    Значения:
    - "yes" — есть выплаты сверх ТК РФ / закона:
      повышенные пособия, дополнительные компенсации.
    - "no" — нет.
    - "unclear" — нельзя определить.

    Шаг 6 — ОГРАНИЧЕНИЯ НА СОКРАЩЕНИЯ

    Заполни "has_redundancy_restrictions".

    Значения:
    - "yes" — есть no-redundancy clause, job security,
      moratorium on layoffs, ограничения на аутсорсинг.
    - "no" — нет.
    - "unclear" — нельзя определить.

    Шаг 7 — ОБЯЗАТЕЛЬНЫЕ КОНСУЛЬТАЦИИ

    Заполни "requires_consultation_on_restructuring".

    Значения:
    - "yes" — обязательные консультации с работниками /
      профсоюзом при реорганизации, сокращениях, CoC.
    - "no" — не предусмотрены.
    - "unclear" — нельзя определить.

    Шаг 8 — СИЛА ПРОФСОЮЗА / ОХВАТ CBA

    Заполни "union_coverage_strength".

    Значения:
    - "high" — охват > 50% или прямо высокий.
    - "medium" — умеренный охват / влияние.
    - "low" — низкий охват / слабое влияние.
    - "none" — профсоюз отсутствует.
    - "unclear" — охват не указан или нельзя определить.

    Шаг 9 — НОРМАЛИЗОВАННЫЙ DISPLAY ДЛЯ DD GRID

    Заполни "hr_cba_display".

    Это итоговое поле для таблицы.
    Строй его ТОЛЬКО на основе уже заполненных полей выше.
    Не добавляй информацию сверх них.

    Возможные состояния:
    1. CBA есть:
       "CBA до 2026 г.; ДМС + доп. отпуск; обязательные консультации"
    2. CBA нет:
       "CBA не обнаружен; профсоюза нет"
    3. Частичная картина:
       "CBA есть; срок не указан; no-redundancy"
    4. Не удалось определить:
       "Не удалось определить наличие CBA"

    Правила:
    - Если все поля unclear:
      "Не удалось определить наличие CBA"
    - Если has_collective_agreement = "no" и union_coverage_strength = "none":
      "CBA не обнаружен; профсоюза нет"
    - Если has_collective_agreement = "no":
      "CBA не обнаружен"
    - Если has_collective_agreement = "yes":
      * начни с:
        - "CBA {cba_term}", если cba_term не "Не указан"
        - "CBA есть", если cba_term = "Не указан"
      * если social_benefits_summary не "Не предусмотрен"
        и не "Не удалось определить" — добавь кратко соцпакет
      * если has_enhanced_severance = "yes":
        добавь "enhanced severance"
      * если has_redundancy_restrictions = "yes":
        добавь "ограничения на сокращения"
      * если requires_consultation_on_restructuring = "yes":
        добавь "обязательные консультации"
    - Если has_collective_agreement = "unclear":
      "Не удалось определить наличие CBA"
    - Не более 3 коротких фактов через ";".

    Шаг 10 — КРАТКОЕ ОБОСНОВАНИЕ

    Заполни "reason".

    Правила:
    - Первое предложение — краткий вывод по CBA.
    - Второе — срок / льготы / ограничения + короткая цитата
      (до 100 символов).
    - Пиши по-русски.
    </instructions>

    <edge_cases>
    - Профсоюз упоминается, текста CBA нет:
      * has_collective_agreement = "unclear"

    - Явные консультации при CoC:
      * requires_consultation_on_restructuring = "yes"

    - Enhanced severance "3 оклада сверх закона":
      * has_enhanced_severance = "yes"

    - No-redundancy clause:
      * has_redundancy_restrictions = "yes"

    - CBA до 2030 г., пересмотр не предусмотрен:
      * cba_term = "до 2030"
      * cba_modification_procedure = "no"

    - Нет CBA / профсоюза:
      * has_collective_agreement = "no"
      * union_coverage_strength = "none"
      * cba_term = "Не применимо"
      * hr_cba_display = "CBA не обнаружен; профсоюза нет"

    - Нет релевантных фрагментов:
      * все поля = "unclear"
      * cba_term = "Не удалось определить"
      * social_benefits_summary = "Не удалось определить"
      * hr_cba_display = "Не удалось определить наличие CBA"
    </edge_cases>

    <output_expectations>
    - Верни результат строго в формате JSON.
    - Не оборачивай ответ в markdown-блоки.
    - Не добавляй комментариев вне JSON.
    - Для полей с allowed_values используй строго значения из списка.
    - Свободные текстовые поля
      (hr_cba_display, cba_term, social_benefits_summary, reason)
      заполняй на русском языке.
    - Не добавляй никаких полей, кроме указанных.

    Пример структуры ответа:
    {
      "hr_cba_display": "CBA до 31.12.2026; ДМС; обязательные консультации",
      "has_collective_agreement": "yes",
      "cba_term": "до 31.12.2026",
      "cba_modification_procedure": "yes",
      "social_benefits_summary": "ДМС",
      "has_enhanced_severance": "no",
      "has_redundancy_restrictions": "no",
      "requires_consultation_on_restructuring": "yes",
      "union_coverage_strength": "medium",
      "reason": "..."
    }
    </output_expectations>

  fields:
    - name: "hr_cba_display"
      type: "string"
      presentation: "fact"
      label: "Коллективный договор и соцпакет"
      description: "Нормализованный user-facing вывод для DD Grid"
      display_in_grid: true
      display_priority: 1

    - name: "has_collective_agreement"
      type: "string"
      presentation: "signal"
      description: "Наличие CBA / соглашения с профсоюзом"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
      display_in_grid: false

    - name: "cba_term"
      type: "string"
      presentation: "fact"
      label: "Срок CBA"
      description: "Срок действия коллективного договора"
      display_in_grid: true
      display_priority: 2

    - name: "cba_modification_procedure"
      type: "string"
      presentation: "signal"
      description: "Процедура пересмотра CBA"
      allowed_values:
        - "yes"
        - "no"
        - "not_applicable"
        - "unclear"
      display_in_grid: false

    - name: "social_benefits_summary"
      type: "string"
      presentation: "fact"
      label: "Социальный пакет"
      description: "Ключевые элементы социального пакета"
      display_in_grid: false

    - name: "has_enhanced_severance"
      type: "string"
      presentation: "signal"
      description: "Enhanced severance сверх закона"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
      display_in_grid: false

    - name: "has_redundancy_restrictions"
      type: "string"
      presentation: "signal"
      description: "Ограничения на сокращения"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
      display_in_grid: false

    - name: "requires_consultation_on_restructuring"
      type: "string"
      presentation: "signal"
      description: "Обязательные консультации при реорганизации / CoC"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
      display_in_grid: false

    - name: "union_coverage_strength"
      type: "string"
      presentation: "signal"
      description: "Охват CBA / сила профсоюза"
      allowed_values:
        - "high"
        - "medium"
        - "low"
        - "none"
        - "unclear"
      display_in_grid: false

    - name: "reason"
      type: "string"
      presentation: "diagnostic"
      description: "Обоснование"
      display_in_grid: false

  store_payload: true


  
