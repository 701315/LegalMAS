id: "hr_collective_agreements_and_social_packages"
name: "Коллективные договоры и социальные обязательства"
description: >
  Анализирует коллективные договоры, соглашения с профсоюзами и социальные
  пакеты, которые могут создать дополнительные обязательства или ограничения
  для работодателя после сделки.

doc_types: []

severity: "medium"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"

rules:
  keywords:
    - "коллективный договор"
    - "collective agreement"
    - "collective bargaining agreement"
    - "соглашение с профсоюзом"
    - "trade union"
    - "профсоюз"
    - "социальный пакет"
    - "benefits"
    - "fringe benefits"
    - "социальные льготы"
    - "уведомление работников"
    - "consultation with employees"
    - "обязательства перед работниками"
  keyword_mode: "any"
  regex_patterns: []
  clause_patterns: []

llm:
  prompt_template: |
    <role>
    Ты — юрист по трудовому праву.
    Твоя специализация — коллективные договоры, соглашения с профсоюзами
    и связанные с ними социальные обязательства работодателя.
    </role>

    <context>
    Ниже приведены фрагменты договоров и соглашений, которые могут быть
    коллективными договорами или соглашениями с профсоюзами:

    {context}
    </context>

    <instructions>
    Определи:

    1) Есть ли у компании коллективные договоры и/или соглашения с профсоюзами:
       - прямые упоминания collective agreement, collective bargaining agreement,
         соглашения с профсоюзом, договор с trade union и т.п.
       Отрази это в has_collective_or_union_agreements.

    2) Какие ключевые обязательства по соцпакетам и дополнительным гарантиям
       (benefits, льготы, компенсации) они устанавливают:
       - дополнительные отпуска, ДМС, страхование, компенсации, социальные выплаты,
         повышенные пособия, программы обучения и т.п.
       Кратко опиши это в social_benefits_summary.

    3) Есть ли особые требования по уведомлению/консультациям с работниками
       при реорганизации, смене контроля (change of control), массовых увольнениях:
       - consultation with employees, информирование/согласование с профсоюзом,
         специальные процедуры уведомления.
       Отрази это в requires_employee_consultation_on_restructuring_or_coc.

    4) Насколько эти обязательства создают риск дополнительных затрат или
       ограничений для Target после сделки:
       - оцени hr_collective_obligations_risk_level: low / medium / high / unclear,
         исходя из масштаба соцпакетов и процедурных ограничений.

    5) Оцени общий риск (overall_risk_level: low / medium / high) с точки зрения
       влияния коллективных договоров и соцпакетов на гибкость Target после сделки.
    </instructions>

    <edge_cases>
    ВАЖНО — пограничные случаи:

    — Если упоминается профсоюз, но нет явного текста коллективного договора
      в предоставленных фрагментах:
      has_collective_or_union_agreements = "unclear" (НЕ предполагаем по умолчанию, что договор есть).

    — Если описан расширенный соцпакет (ДМС, доп. отпуска, значимые доплаты),
      но не ясно, закреплён ли он именно коллективным договором:
      social_benefits_summary заполни по тексту,
      has_collective_or_union_agreements может быть "unclear".

    — Если явно указаны обязанности по консультации/уведомлению работников/
      профсоюза при реорганизации или CoC:
      requires_employee_consultation_on_restructuring_or_coc = "yes",
      hr_collective_obligations_risk_level обычно не ниже "medium" (обоснуй в reason).

    — Если фрагменты не содержат ни слов о профсоюзах, ни о коллективных договорах,
      ни о соцпакетах:
      has_collective_or_union_agreements = "no" или "unclear" (если объём текста мал),
      social_benefits_summary может быть пустым/минимальным.

    — Пустые или нерелевантные фрагменты:
      большинство полей = "unclear" или пустые строки,
      overall_risk_level = "medium",
      reason = "Недостаточно данных для анализа коллективных договоров и социальных обязательств."
    </edge_cases>

    <examples>
    ПРИМЕР 1 — РАСШИРЕННЫЙ КОЛЛЕКТИВНЫЙ ДОГОВОР, СРЕДНИЙ/ВЫСОКИЙ РИСК:

    Фрагмент: "В Обществе действует Коллективный договор, заключённый с
    первичной профсоюзной организацией, предусматривающий дополнительные
    оплачиваемые отпуска, программу добровольного медицинского страхования
    и выплаты при сокращении сверх установленных законом. При массовых
    увольнениях Работодатель обязан проводить консультации с профсоюзом
    не менее чем за 60 дней до начала мероприятий."

    {{
      "has_collective_or_union_agreements": "yes",
      "social_benefits_summary": "Коллективный договор с профсоюзом: доп. отпуска, ДМС, повышенные выплаты при сокращении.",
      "requires_employee_consultation_on_restructuring_or_coc": "yes",
      "hr_collective_obligations_risk_level": "high",
      "overall_risk_level": "high",
      "reason": "Существуют значительные дополнительные соцгарантии и обязательные консультации с профсоюзом при сокращениях, что увеличивает затраты и снижает гибкость Target."
    }}

    ПРИМЕР 2 — ОГРАНИЧЕННЫЙ СОЦПАКЕТ, УМЕРЕННЫЙ РИСК:

    Фрагмент: "Коллективный договор Общества устанавливает дополнительные
    ежегодные выплаты к праздникам и частичную компенсацию питания,
    без специальных процедур согласования реорганизации с работниками."

    {{
      "has_collective_or_union_agreements": "yes",
      "social_benefits_summary": "Коллективный договор с ограниченным пакетом доп. выплат (праздники, питание).",
      "requires_employee_consultation_on_restructuring_or_coc": "no",
      "hr_collective_obligations_risk_level": "medium",
      "overall_risk_level": "medium",
      "reason": "Есть дополнительные социальные выплаты, но отсутствуют жёсткие процедуры консультаций по реорганизации; риск в основном в области допзатрат."
    }}

    ПРИМЕР 3 — ОТСУТСТВИЕ УКАЗАНИЙ НА КОЛЛЕКТИВНЫЕ ДОГОВОРЫ (LOW/MEDIUM):

    Фрагмент: "Трудовые отношения регулируются индивидуальными трудовыми
    договорами и правилами внутреннего трудового распорядка. Коллективный
    договор не заключён."

    {{
      "has_collective_or_union_agreements": "no",
      "social_benefits_summary": "Коллективный договор отсутствует, соцпакет определяется индивидуальными договорами.",
      "requires_employee_consultation_on_restructuring_or_coc": "unclear",
      "hr_collective_obligations_risk_level": "low",
      "overall_risk_level": "low",
      "reason": "Прямо указано, что коллективный договор не заключён; специальных коллективных обязательств и процедур консультации не предусмотрено."
    }}
    </examples>

    <output_format>
    Твой ответ ДОЛЖЕН быть строго валидным JSON-объектом со следующими
    полями:

    {{
      "has_collective_or_union_agreements": "one of: yes | no | unclear",
      "social_benefits_summary": "string — краткое описание соцпакетов и льгот (если они упомянуты)",
      "requires_employee_consultation_on_restructuring_or_coc": "one of: yes | no | unclear",
      "hr_collective_obligations_risk_level": "one of: low | medium | high | unclear",
      "overall_risk_level": "one of: low | medium | high",
      "reason": "string — краткое объяснение на русском с указанием ключевых формулировок и влияния на затраты/гибкость Target"
    }}

    Все перечисленные поля ДОЛЖНЫ присутствовать в JSON, даже если их значение равно null.
    </output_format>

    <constraints>
    ЖЁСТКИЕ ПРАВИЛА:
    1. Выведи ТОЛЬКО один JSON-объект. Никакого текста до или после.
    2. Не пиши "Вот JSON", "Here is the JSON" и т.п.
    3. Не используй Markdown, бэктики ``` или любые обёртки.
    4. Все строки — в двойных кавычках.
    5. Значения перечислимых полей — СТРОГО из указанных вариантов.
    6. Ключи — точно как указано, без добавления новых.
    7. Поле "reason" ДОЛЖНО содержать конкретные факты и формулировки
       из фрагментов, а не общие фразы вроде "есть риски".
    8. Начни ответ сразу с символа {{
    9. Если по какому‑то полю нет достаточно информации в тексте —
       верни для него 'unclear' или null (для reason пустое значение
       недопустимо — нужно объяснение). НЕ придумывай значения, не интерполируй.
    </constraints>
  prompt_file: null
  context_k: 4
  temperature: 0.0
  max_tokens: 512

evidence:
  required: false
  min_snippet_length: 20
  max_snippet_length: 500

retrieval:
  context_k: 4
  max_chunks: 8
  boost_keywords:
    - "коллективный договор"
    - "collective agreement"
    - "trade union"
    - "социальный пакет"
    - "benefits"
  rerank: true
  filters: {}

conditional: null

extraction:
  enabled: true
  mode: "hybrid"
  fields:
    - name: "has_collective_or_union_agreements"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
    - name: "social_benefits_summary"
      type: "string"
    - name: "requires_employee_consultation_on_restructuring_or_coc"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
    - name: "hr_collective_obligations_risk_level"
      type: "string"
      allowed_values:
        - "low"
        - "medium"
        - "high"
        - "unclear"
    - name: "overall_risk_level"
      type: "string"
      allowed_values:
        - "low"
        - "medium"
        - "high"
    - name: "reason"
      type: "string"
  store_payload: true

red_flags:
  items:
    - code: "HR3"
      description: "Существенные дополнительные социальные обязательства, усложняющие оптимизацию штата."
    - code: "HR4"
      description: "Строгие требования по консультациям/одобрениям работников при реорганизации или смене контроля."