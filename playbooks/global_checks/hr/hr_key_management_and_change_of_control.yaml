id: "hr_key_management_and_change_of_control"
name: "Топ-менеджмент, key employees и смена контроля"
description: >
  Анализирует трудовые договоры и соглашения с топ-менеджментом
  и key employees в контексте M&A: golden parachutes, выплаты
  при смене контроля или увольнении, severance, retention bonuses,
  single-trigger / double-trigger CoC payments, good leaver / bad leaver,
  vesting / equity awards, non-compete / non-solicit и риск ухода
  ключевых лиц. Оценивает финансовую нагрузку на покупателя
  и влияние на удержание менеджмента после сделки.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"

rules:
  keyword_mode: any

  keywords:
    high:
      # Employment / key management
      - "(?i)employment\\s+agreement"
      - "(?i)трудов(ой|ого)\\s+договор"
      - "(?i)служебн(ый|ого)\\s+контракт"
      - "(?i)top\\s+management"
      - "(?i)топ[-\\s]?менеджмент"
      - "(?i)key\\s+employee"
      - "(?i)ключев(ой|ого)\\s+сотрудник"
      - "(?i)senior\\s+management"
      - "(?i)executive\\s+officer"

      # Golden parachute / CoC payments
      - "(?i)golden\\s+parachute"
      - "(?i)change\\s+of\\s+control\\s+payment"
      - "(?i)bonus\\s+upon\\s+change\\s+of\\s+control"
      - "(?i)change\\s+of\\s+control\\s+bonus"
      - "(?i)выплат[аы]\\s+при\\s+смене\\s+контрол"
      - "(?i)бонус\\s+при\\s+смене\\s+контрол"
      - "(?i)single[-\\s]?trigger"
      - "(?i)double[-\\s]?trigger"

      # Severance / exit
      - "(?i)severance"
      - "(?i)выходн(ое|ого)\\s+пособи"
      - "(?i)termination\\s+payment"
      - "(?i)exit\\s+payment"
      - "(?i)компенсаци[яи]\\s+при\\s+увольнении"
      - "(?i)несколько\\s+окладов"
      - "(?i)multiple\\s+of\\s+(salary|base\\s+salary)"

      # Retention
      - "(?i)retention\\s+bonus"
      - "(?i)retention\\s+award"
      - "(?i)удерживающ(ий|его)\\s+бонус"
      - "(?i)bonus\\s+for\\s+remaining"
      - "(?i)stay\\s+bonus"

      # Non-compete / non-solicit
      - "(?i)non[-\\s]?compete"
      - "(?i)non[-\\s]?solicit"
      - "(?i)restrictive\\s+covenants?"
      - "(?i)ограничени[ея]\\s+конкуренци"
      - "(?i)запрет\\s+переманивани"
      - "(?i)запрет\\s+работать\\s+у\\s+конкурент"

    medium:
      # Good leaver / bad leaver
      - "(?i)good\\s+leaver"
      - "(?i)bad\\s+leaver"
      - "(?i)good\\s+reason"
      - "(?i)constructive\\s+dismissal"
      - "(?i)по\\s+уважительной\\s+причине"
      - "(?i)без\\s+вины\\s+работника"

      # Equity / vesting
      - "(?i)vesting"
      - "(?i)vested"
      - "(?i)unvested"
      - "(?i)equity\\s+award"
      - "(?i)stock\\s+option"
      - "(?i)phantom\\s+shares?"
      - "(?i)опцион\\s+на\\s+акции"
      - "(?i)долгосрочн(ая|ого)\\s+мотиваци"

      # Trigger terms
      - "(?i)upon\\s+(a\\s+)?change\\s+of\\s+control"
      - "(?i)в\\s+случае\\s+смены\\s+контрол"
      - "(?i)upon\\s+termination\\s+without\\s+cause"
      - "(?i)при\\s+увольнении\\s+без\\s+основан"
      - "(?i)without\\s+cause"
      - "(?i)for\\s+good\\s+reason"

      # Restrictive covenant details
      - "(?i)duration\\s+of\\s+(the\\s+)?non[-\\s]?compete"
      - "(?i)территори[яи]\\s+действи[яе]"
      - "(?i)срок\\s+действи[яе]\\s+ограничени"
      - "(?i)liquidated\\s+damages"
      - "(?i)штраф\\s+за\\s+нарушени[ея]\\s+non[-\\s]?compete"

    low:
      # Общие термины
      - "(?i)employee"
      - "(?i)работник"
      - "(?i)manager"
      - "(?i)менеджер"
      - "(?i)bonus"
      - "(?i)бонус"
      - "(?i)payment"
      - "(?i)выплат"
      - "(?i)termination"
      - "(?i)увольнени"
      - "(?i)retention"
      - "(?i)удержан"
      - "(?i)competition"
      - "(?i)конкуренц"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 750

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 700

retrieval:
  context_k: 5
  max_chunks: 10
  boost_keywords:
    - "golden parachute"
    - "change of control payment"
    - "bonus upon change of control"
    - "single-trigger"
    - "double-trigger"
    - "severance"
    - "выходное пособие"
    - "retention bonus"
    - "stay bonus"
    - "non-compete"
    - "non-solicit"
    - "good leaver"
    - "bad leaver"
    - "vesting"
    - "stock option"
    - "phantom shares"
    - "ключевой сотрудник"
    - "топ-менеджмент"
    - "employment agreement"
    - "смена контроля"
  rerank: true
  filters: {}

conditional: null

extraction:
  llm_prompt_extraction: |
    <role>
    Ты — юрист по трудовому праву и M&A.
    Твоя специализация — анализ условий договоров с топ-менеджментом
    и key employees в контексте смены контроля, удержания персонала
    и оценки финансовой нагрузки на покупателя.
    </role>

    <context>
    Ниже приведены фрагменты трудовых договоров / соглашений
    с топ-менеджментом и ключевыми сотрудниками:

    {context}
    </context>

    <instructions>
    Проведи анализ по шагам. Каждый шаг логически соответствует одному
    или нескольким полям итоговой оценки.

    Шаг 1 — CoC / EXIT ВЫПЛАТЫ
    (используется для заполнения поля "has_change_of_control_or_exit_payments"):
    - Определи, предусмотрены ли:
      * специальные выплаты при смене контроля
        (golden parachute, change of control bonus);
      * увеличенные severance / выходные пособия;
      * exit payments, завязанные на сделку или увольнение.
    - Укажи:
      * триггер выплаты;
      * размер (если указан: количество окладов, фиксированная
        сумма, бонус);
      * single-trigger или double-trigger, если это видно.
    - Оцени:
      * "yes" — есть;
      * "no" — нет;
      * "unclear" — неясно.

    Шаг 2 — RETENTION-МЕХАНИЗМЫ
    (используется для заполнения поля "has_retention_bonuses"):
    - Проверь, есть ли retention-механизмы:
      * retention bonus / stay bonus;
      * выплаты за продолжение работы до/после сделки;
      * vesting, delayed bonus, long-term incentive plans.
    - Оцени наличие:
      * has_retention_bonuses = "yes" / "no" / "unclear"

    Шаг 3 — NON-COMPETE / NON-SOLICIT
    (используется для заполнения поля "has_non_compete_or_non_solicit"):
    - Определи, содержатся ли:
      * non-compete;
      * non-solicit сотрудников / клиентов;
      * иные restrictive covenants.
    - Оцени наличие:
      * "yes" / "no" / "unclear"

    Шаг 4 — GOOD LEAVER / BAD LEAVER / VESTING
    (используется для заполнения поля "has_leaver_or_vesting_terms"):
    - Определи, предусмотрены ли:
      * good leaver / bad leaver;
      * vesting / forfeiture;
      * потеря бонусов / опционов при уходе;
      * acceleration vesting при CoC.
    - Оцени:
      * "yes" — положения есть;
      * "no" — нет;
      * "unclear" — неясно.

    Шаг 5 — RED FLAGS
    (используется для заполнения поля "red_flags"):
    Присвой один или несколько кодов из списка ниже.
    Если ни один код не применим — верни "NONE".
    Если данных недостаточно для оценки — верни "UNCLEAR".

    Коды:
    • KEY1 — Крупные CoC / severance выплаты нескольким
      key persons.
    • KEY2 — Single-trigger CoC payment: выплата наступает
      только из-за смены контроля, без увольнения.
    • KEY3 — Key persons могут легко уйти после CoC
      с существенной компенсацией.
    • KEY4 — Retention mechanisms отсутствуют или слабы.
    • KEY5 — Non-compete / non-solicit формально есть,
      но выглядит слабым / трудноприменимым.
    • KEY6 — Good leaver / bad leaver или vesting создают
      существенный payout / loss scenario для покупателя.

    Формат ответа: коды через запятую без комментариев
    (например: "KEY1, KEY3").
    Вся аргументация — в поле reason.

    Шаг 6 — ОБОСНОВАНИЕ
    (используется для заполнения поля "reason"):

    - В reason кратко обоснуй вывод, опираясь на ключевые
      формулировки из текста (с цитатами в кавычках), и укажи:
      * есть ли CoC / exit выплаты и их триггеры;
      * насколько сильны retention-механизмы;
      * насколько исполнимы non-compete / non-solicit;
      * есть ли leaver / vesting terms;
      * если выставлены red_flags — обоснуй каждый код;
      * если red_flags = "NONE" — укажи, почему риск
        для покупателя умеренный / низкий.
    </instructions>

    <edge_cases>
    Обрабатывай пограничные ситуации так:

    - Топ-менеджер вправе расторгнуть договор при CoC
      с крупным severance:
      has_change_of_control_or_exit_payments = "yes";
      coc_payment_trigger_type = "single_trigger" или "mixed";
      зафиксируй KEY1 и/или KEY2, KEY3.

    - Только стандартные выплаты по закону:
      financial_impact_risk_level = "low";
      red_flags могут быть "NONE".

    - Non-compete / non-solicit есть, но без срока,
      территории или санкций:
      has_non_compete_or_non_solicit = "yes";
      restrictive_covenants_strength = "weak";
      зафиксируй KEY5.

    - Текст прямо говорит, что при CoC дополнительных
      выплат нет:
      has_change_of_control_or_exit_payments = "no";
      KEY1/KEY2 не выставляются.

    - Есть strong retention bonus на 12–24 месяца
      после closing:
      has_retention_bonuses = "yes";
      retention_strength = "strong";
      это снижает departure risk.

    - Acceleration vesting акций / phantom shares при CoC:
      has_leaver_or_vesting_terms = "yes";
      зафиксируй KEY6; financial impact может быть HIGH.

    - Пустые или нерелевантные фрагменты:
      red_flags = "UNCLEAR"; в reason укажи недостаток данных.
    </edge_cases>

    <output_expectations>
    На основе твоего анализа отдельный механизм извлечения сформирует
    структурированные поля по заранее заданной схеме. Твоя задача —
    давать чёткие юридические выводы и указывать конкретные
    формулировки из текста, на которых они основаны.
    </output_expectations>

  enabled: true
  mode: "hybrid"
  fields:
    - name: "has_change_of_control_or_exit_payments"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "has_retention_bonuses"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "has_non_compete_or_non_solicit"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "has_leaver_or_vesting_terms"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "red_flags"
      type: "string"

    - name: "reason"
      type: "string"

  store_payload: true

red_flags:
  items:
    - code: "KEY1"
      description: >
        Крупные CoC / severance выплаты нескольким
        key persons.
    - code: "KEY2"
      description: >
        Single-trigger CoC payment: выплата наступает
        только из-за смены контроля, без увольнения.
    - code: "KEY3"
      description: >
        Key persons могут легко уйти после CoC
        с существенной компенсацией.
    - code: "KEY4"
      description: >
        Retention mechanisms отсутствуют или слабы.
    - code: "KEY5"
      description: >
        Non-compete / non-solicit формально есть,
        но выглядит слабым / трудноприменимым.
    - code: "KEY6"
      description: >
        Good leaver / bad leaver или vesting создают
        существенный payout / loss scenario для покупателя.