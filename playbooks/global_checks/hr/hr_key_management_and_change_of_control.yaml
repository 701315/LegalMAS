id: "hr_key_management_and_change_of_control"
name: "Топ-менеджмент, key employees и смена контроля"
group: "HR"
description: >
  Анализирует условия договоров с топ-менеджментом и key employees
  в контексте M&A: golden parachutes и выплаты при смене контроля
  (single-trigger / double-trigger), severance и exit payments,
  retention bonuses, good leaver / bad leaver и vesting /
  acceleration, non-compete / non-solicit.

  Формирует краткий user-facing вывод и оценивает финансовую
  нагрузку на покупателя, риск ухода ключевых лиц и силу
  удерживающих механизмов.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"
ui_mode: "field_extraction"

rules:
  keyword_mode: any

  keywords:
    high:
      # Golden parachute / CoC payments
      - "(?i)golden\\s+parachute"
      - "(?i)change\\s+of\\s+control\\s+payment"
      - "(?i)bonus\\s+upon\\s+change\\s+of\\s+control"
      - "(?i)change\\s+of\\s+control\\s+bonus"
      - "(?i)выплат[аы]\\s+при\\s+смене\\s+контрол"
      - "(?i)бонус\\s+при\\s+смене\\s+контрол"
      - "(?i)single[-\\s]?trigger"
      - "(?i)double[-\\s]?trigger"

      # Severance / exit
      - "(?i)enhanced\\s+severance"
      - "(?i)severance\\s+(pay(ment)?|package)[\\s\\S]{0,20}(exceed|multiple|months?)"
      - "(?i)выходн(ое|ого)\\s+пособи[ея][\\s\\S]{0,20}(несколько|кратн|размер)"
      - "(?i)termination\\s+payment[\\s\\S]{0,20}(multiple|months?|salary)"
      - "(?i)компенсаци[яи]\\s+при\\s+увольнении[\\s\\S]{0,20}(сверх|кратн|несколько)"
      - "(?i)multiple\\s+of\\s+(salary|base\\s+salary)"

      # Retention
      - "(?i)retention\\s+bonus"
      - "(?i)retention\\s+award"
      - "(?i)stay\\s+bonus"
      - "(?i)удерживающ(ий|его)\\s+бонус"

      # Non-compete / non-solicit
      - "(?i)non[-\\s]?compete"
      - "(?i)non[-\\s]?solicit"
      - "(?i)restrictive\\s+covenants?"
      - "(?i)ограничени[ея]\\s+конкуренци"
      - "(?i)запрет\\s+работать\\s+у\\s+конкурент"
      - "(?i)запрет\\s+переманивани"

      # Employment / key management context
      - "(?i)employment\\s+agreement"
      - "(?i)трудов(ой|ого)\\s+договор"
      - "(?i)key\\s+employee"
      - "(?i)ключев(ой|ого)\\s+сотрудник"
      - "(?i)top\\s+management"
      - "(?i)топ[-\\s]?менеджмент"

    medium:
      # Good leaver / bad leaver
      - "(?i)good\\s+leaver"
      - "(?i)bad\\s+leaver"
      - "(?i)good\\s+reason"
      - "(?i)constructive\\s+dismissal"
      - "(?i)без\\s+вины\\s+работника"

      # Equity / vesting
      - "(?i)vesting"
      - "(?i)unvested"
      - "(?i)equity\\s+award"
      - "(?i)stock\\s+option"
      - "(?i)phantom\\s+shares?"
      - "(?i)опцион\\s+на\\s+акции"
      - "(?i)долгосрочн(ая|ого)\\s+мотиваци"
      - "(?i)long[-\\s]?term\\s+incentive"

      # Trigger / termination context
      - "(?i)upon\\s+(a\\s+)?change\\s+of\\s+control"
      - "(?i)в\\s+случае\\s+смены\\s+контрол"
      - "(?i)upon\\s+termination\\s+without\\s+cause"
      - "(?i)при\\s+увольнении\\s+без\\s+основан"
      - "(?i)without\\s+cause"
      - "(?i)for\\s+good\\s+reason"

      # Restrictive covenant details
      - "(?i)duration\\s+of\\s+(the\\s+)?non[-\\s]?compete"
      - "(?i)срок\\s+действи[яе]\\s+ограничени[яе]\\s+(конкуренци|non)"
      - "(?i)liquidated\\s+damages[\\s\\S]{0,20}(non[-\\s]?compete|restrictive)"

    low:
      - "(?i)golden\\s+parachute"
      - "(?i)single[-\\s]?trigger"
      - "(?i)double[-\\s]?trigger"
      - "(?i)retention\\s+bonus"
      - "(?i)non[-\\s]?compete"
      - "(?i)non[-\\s]?solicit"
      - "(?i)good\\s+leaver"
      - "(?i)bad\\s+leaver"
      - "(?i)phantom\\s+shares?"
      - "(?i)vesting"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 750

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 700

retrieval:
  retrieval_profile: "change_of_control_check"
  context_k: 5
  max_chunks: 10

  retrieval_query: >
    смена контроля выплата выходное пособие золотой парашют бонус за удержание 
    ограничение конкуренции запрет переманивания топ-менеджмент vesting опцион

  boost_keywords:
    - "golden parachute"
    - "change of control payment"
    - "bonus upon change of control"
    - "single-trigger"
    - "double-trigger"
    - "enhanced severance"
    - "выходное пособие"
    - "retention bonus"
    - "stay bonus"
    - "non-compete"
    - "non-solicit"
    - "good leaver"
    - "bad leaver"
    - "vesting"
    - "stock option"
    - "phantom shares"
    - "ключевой сотрудник"
    - "топ-менеджмент"
    - "employment agreement"
    - "трудовой договор"
    - "смена контроля"
    - "upon change of control"
    - "termination without cause"

  negative_keywords:
    - "коммерческая тайна"
    - "форс-мажор"
    - "применимое право"
    - "штрафные санкции"
    - "интеллектуальная собственность"

  preferred_unit_types:
    - "obligation"
    - "general_provision"

  excluded_unit_types:
    - "technical_fragment"
    - "appendix_reference"

  preferred_clause_functions:
    - "limitations"
    - "procedures"
    - "obligations"

  position_bias:
    preferred_range: [0.0, 1.0]
    boost: 0.10
    scope: "segment"

  rerank: true
  filters: {}

conditional: null

enrichment_hints:
  preferred_segment_types:
    - "contract"
    - "annex"
    - "appendix"
    - "amendment"
  excluded_segment_types:
    - "technical_specification"
    - "price_list"
    - "invoice"
    - "act"
    - "schedule"
  confidence_bonus_on_match: 0.10
  confidence_penalty_on_excluded_segment: 0.15

extraction:
  enabled: true
  mode: "hybrid"
  llm_max_tokens: 1350

  presence_signal:
    field: "key_management_status"
    present_values: ["present"]
    missing_values: ["missing"]
    unclear_values: ["unclear"]

  llm_prompt_extraction: |
    <role>
    Ты — юрист по трудовому праву и M&A.
    Твоя задача — точно извлечь из текста:
    1) есть ли в договоре раздел / положения о топ-менеджменте
       и key employees;
    2) если есть — какие условия установлены:
       - CoC / exit выплаты топ-менеджменту;
       - retention-механизмы;
       - non-compete / non-solicit;
       - good leaver / bad leaver и vesting.

    КРИТИЧЕСКИ ВАЖНО:
    - Извлекай ТОЛЬКО то, что прямо написано в тексте.
    - НЕ придумывай размеры выплат, если они не указаны явно.
    - НЕ подменяй обычные законные выплаты severance
      специальными CoC / exit выплатами.
    - Если раздел / положения по теме в договоре отсутствуют —
      key_management_status = "missing".
    - Если тексты по теме есть, но вывод сделать нельзя —
      key_management_status = "unclear".
    </role>

    <context_rules>
    - Некоторые фрагменты могут быть нерелевантны — игнорируй их.
    - Если фрагменты противоречат друг другу — используй "unclear"
      и кратко объясни это в reason.
    - `single_trigger` = выплата только из-за CoC.
    - `double_trigger` = CoC + увольнение / ухудшение роли /
      termination without cause / good reason.
    - Обычные выплаты по закону не считаются CoC / exit выплатами.
    - Не добавляй в display длительность retention или non-compete,
      если она не отражена в extracted fields.
    - Если ни один фрагмент не содержит информации по теме top management /
      key employees (нет упоминаний CoC-выплат / retention / non-compete /
      vesting / leaver) — key_management_status = "missing", location = null.
      Не использовать "unclear" при полном отсутствии релевантных
      фрагментов.
    </context_rules>

    <context>
    Ниже приведены релевантные фрагменты договора:

    {context}
    </context>

    <task>
    Заполни только следующие поля:
    - key_management_display
    - key_management_status
    - has_change_of_control_or_exit_payments
    - coc_payment_trigger_type
    - coc_payment_size_summary
    - has_retention_bonuses
    - retention_strength
    - has_non_compete_or_non_solicit
    - restrictive_covenants_strength
    - has_leaver_or_vesting_terms
    - reason
    </task>

    <location_instructions>
    Для каждого поля по возможности укажи location в формате:
    {"clause_ref": "п. 12.1", "page": 7, "quote": "дословная фраза из договора"}

    Правила:
    - clause_ref — короткая ссылка на пункт / раздел / статью именно в том
      виде, как она написана в договоре;
    - page — целое число страницы;
    - quote — дословная фраза из текста договора (НЕ пересказ, НЕ парафраз).
      Копируй её посимвольно, сохраняя формулировку и порядок слов.
      Оптимальная длина: 30–300 символов.
    - Для synthesized-полей (key_management_display,
      coc_payment_size_summary, reason) location ВСЕГДА null.
    - Для key_management_status = "missing" — location = null.
    - Для key_management_status = "present" / "unclear" — quote
      с наиболее релевантной фразой договора (CoC-выплата, retention,
      non-compete, vesting).
    - Для has_* и *_strength / coc_payment_trigger_type:
      * если значение = "yes" / "strong" / "moderate" / "weak" /
        "single_trigger" / "double_trigger" / "termination_only" — quote
        с фразой-основанием;
      * если значение = "no" / "not_applicable" —
        различай два случая:
        - договор ПРЯМО исключает наличие («Выплаты при смене контроля
          не предусмотрены», «Non-compete не применяется») —
          quote ОБЯЗАТЕЛЬНА и должна содержать эту фразу;
        - просто отсутствует упоминание (договор молчит) —
          location = null.
    - Не выдумывай location или quote. Если дословную фразу определить
      нельзя — location = null.
    </location_instructions>

    <instructions>
    Шаг 0 — НАЛИЧИЕ РАЗДЕЛА / ПОЛОЖЕНИЙ О KEY MANAGEMENT

    Заполни "key_management_status".

    Значения:
    - "present" — если хотя бы одно содержательное поле указывает
      на наличие информации по теме:
      * has_change_of_control_or_exit_payments = "yes";
      * coc_payment_trigger_type ∈ {"single_trigger", "double_trigger",
        "termination_only"};
      * has_retention_bonuses = "yes";
      * retention_strength ∈ {"strong", "moderate", "weak"};
      * has_non_compete_or_non_solicit = "yes";
      * restrictive_covenants_strength ∈ {"strong", "moderate", "weak"};
      * has_leaver_or_vesting_terms = "yes";
      * ЛИБО любое поле = "no" / "not_applicable", но с заполненным
        location с прямой цитатой (см. RF3).
    - "missing" — если все содержательные поля =
      "no" / "not_applicable" БЕЗ цитат, ЛИБО фрагментов
      по теме нет вообще.
    - "unclear" — если все содержательные = "unclear" при наличии
      фрагментов, но невозможности вывода.

    Шаг 1 — CoC / EXIT ВЫПЛАТЫ

    Заполни "has_change_of_control_or_exit_payments",
    "coc_payment_trigger_type", "coc_payment_size_summary".

    Значения для has_change_of_control_or_exit_payments:
    - "yes" — есть golden parachute, CoC bonus,
      enhanced severance, exit payment.
    - "no" — нет.
    - "unclear" — нельзя определить.

    Значения для coc_payment_trigger_type:
    - "single_trigger" — выплата только из-за CoC.
    - "double_trigger" — CoC + увольнение / change of role.
    - "termination_only" — только при увольнении без CoC.
    - "not_applicable" — выплат нет.
    - "unclear" — нельзя определить.

    Правила для coc_payment_size_summary:
    - Если размер указан явно: "3 оклада", "USD 500K", "18 мес."
    - Если выплата есть, но размер не указан: "Размер не указан"
    - Если выплат нет: "Не применимо"
    - Если нельзя определить: "Не удалось определить"

    Шаг 2 — RETENTION-МЕХАНИЗМЫ

    Заполни "has_retention_bonuses" и "retention_strength".

    Значения для has_retention_bonuses:
    - "yes" — есть retention bonus, stay bonus, vesting,
      LTIP retention, удерживающие выплаты.
    - "no" — нет.
    - "unclear" — нельзя определить.

    Значения для retention_strength:
    - "strong" — явно существенный retention.
    - "moderate" — умеренный.
    - "weak" — формальный / слабый.
    - "not_applicable" — retention нет.
    - "unclear" — нельзя определить.

    Шаг 3 — NON-COMPETE / NON-SOLICIT

    Заполни "has_non_compete_or_non_solicit"
    и "restrictive_covenants_strength".

    Значения для has_non_compete_or_non_solicit:
    - "yes" — есть non-compete / non-solicit /
      restrictive covenants.
    - "no" — нет.
    - "unclear" — нельзя определить.

    Значения для restrictive_covenants_strength:
    - "strong" — есть срок, территория, санкции / enforceability.
    - "moderate" — часть элементов есть.
    - "weak" — ограничения описаны слабо.
    - "not_applicable" — ограничений нет.
    - "unclear" — нельзя определить.

    Шаг 4 — GOOD LEAVER / BAD LEAVER / VESTING

    Заполни "has_leaver_or_vesting_terms".

    Значения:
    - "yes" — есть good/bad leaver, vesting, forfeiture,
      acceleration при CoC.
    - "no" — нет.
    - "unclear" — нельзя определить.

    Шаг 5 — НОРМАЛИЗОВАННЫЙ DISPLAY ДЛЯ DD GRID

    Заполни "key_management_display".

    Это итоговое поле для таблицы.
    Строй его ТОЛЬКО на основе уже заполненных полей выше.
    Не добавляй информацию сверх них.

    Правила:
    - Если key_management_status = "missing":
      "CoC выплат не обнаружено; retention нет"
    - Если все поля unclear:
      "Не удалось определить условия для топ-менеджмента"
    - Если has_change_of_control_or_exit_payments = "no"
      и has_retention_bonuses = "no"
      и has_non_compete_or_non_solicit = "no"
      и has_leaver_or_vesting_terms = "no":
      "CoC выплат не обнаружено; retention нет"
    - Иначе комбинируй через ";":
      * если has_change_of_control_or_exit_payments = "yes":
        "CoC / exit выплаты: {coc_payment_size_summary}"
      * если coc_payment_trigger_type != "not_applicable"
        и != "unclear":
        добавь trigger_type кратко:
        "single-trigger", "double-trigger", "termination only"
      * если has_retention_bonuses = "yes":
        добавь "retention сильный/умеренный/слабый"
      * если has_non_compete_or_non_solicit = "yes":
        добавь "non-compete сильный/умеренный/слабый"
      * если has_leaver_or_vesting_terms = "yes":
        добавь "leaver / vesting есть"
    - Не более 3 коротких фактов через ";".

    Шаг 6 — КРАТКОЕ ОБОСНОВАНИЕ

    Заполни "reason".

    Правила:
    - Первое предложение — краткий вывод.
    - Второе — trigger / размер / retention / covenants
      + короткая цитата (до 100 символов).
    - Пиши по-русски.
    </instructions>

    <edge_cases>
    - 6 окладов при CoC + увольнении:
      * key_management_status = "present"
      * has_change_of_control_or_exit_payments = "yes"
      * coc_payment_trigger_type = "double_trigger"
      * coc_payment_size_summary = "6 окладов"

    - Выплата только из-за CoC без увольнения:
      * key_management_status = "present"
      * coc_payment_trigger_type = "single_trigger"

    - Только стандартные выплаты по закону:
      * has_change_of_control_or_exit_payments = "no"
      * coc_payment_trigger_type = "not_applicable"
      * coc_payment_size_summary = "Не применимо"

    - Non-compete без срока и санкций:
      * key_management_status = "present"
      * has_non_compete_or_non_solicit = "yes"
      * restrictive_covenants_strength = "weak"

    - Acceleration vesting при CoC:
      * key_management_status = "present"
      * has_leaver_or_vesting_terms = "yes"

    - Договор прямо исключает CoC / exit выплаты:
      * key_management_status = "present"
      * has_change_of_control_or_exit_payments = "no"
      * location с прямой цитатой об отсутствии.

    - Нет релевантных фрагментов / раздел о key management / CoC
      в договоре отсутствует:
      * key_management_status = "missing"
      * has_change_of_control_or_exit_payments = "no"
      * coc_payment_trigger_type = "not_applicable"
      * coc_payment_size_summary = "Не применимо"
      * has_retention_bonuses = "no"
      * retention_strength = "not_applicable"
      * has_non_compete_or_non_solicit = "no"
      * restrictive_covenants_strength = "not_applicable"
      * has_leaver_or_vesting_terms = "no"
      * key_management_display =
        "CoC выплат не обнаружено; retention нет"
      * location у всех полей = null.

    - Формулировки есть, но вывод невозможен:
      * key_management_status = "unclear"
      * соответствующие поля = "unclear"
    </edge_cases>

    <output_expectations>
    - Верни результат строго в формате JSON.
    - Не оборачивай ответ в markdown-блоки (без ```).
    - Не добавляй комментариев вне JSON.
    - Все значения полей с allowed_values — на английском.
    - Свободные текстовые поля (key_management_display,
      coc_payment_size_summary, reason) — на русском языке.
    - Не добавляй полей, кроме указанных.
    - Для каждого поля возвращай объект с ключами
      "value", "confidence", "location".

    Пример структуры ответа:
    {
      "key_management_display": {"value": "CoC / exit выплаты: 3 оклада; double-trigger; retention сильный", "confidence": 0.92, "location": null},
      "key_management_status": {"value": "present", "confidence": 0.95, "location": {"clause_ref": "п. 4.2", "page": 3, "quote": "В случае смены контроля и последующего увольнения без оснований Топ-менеджеру выплачивается вознаграждение в размере 3 окладов"}},
      "has_change_of_control_or_exit_payments": {"value": "yes", "confidence": 0.95, "location": {"clause_ref": "п. 4.2", "page": 3, "quote": "В случае смены контроля и последующего увольнения без оснований Топ-менеджеру выплачивается вознаграждение"}},
      "coc_payment_trigger_type": {"value": "double_trigger", "confidence": 0.90, "location": {"clause_ref": "п. 4.2", "page": 3, "quote": "В случае смены контроля и последующего увольнения без оснований"}},
      "coc_payment_size_summary": {"value": "3 оклада", "confidence": 0.90, "location": {"clause_ref": "п. 4.2", "page": 3, "quote": "вознаграждение в размере 3 окладов"}},
      "has_retention_bonuses": {"value": "yes", "confidence": 0.85, "location": {"clause_ref": "п. 4.5", "page": 4, "quote": "Топ-менеджеру выплачивается retention bonus в размере 50% годового оклада при сохранении занятости в течение 12 месяцев после closing"}},
      "retention_strength": {"value": "strong", "confidence": 0.80, "location": null},
