id: "hr_key_management_and_change_of_control"
name: "Топ-менеджмент, key employees и смена контроля"
group: "HR"
description: >
  Анализирует условия договоров с топ-менеджментом и key employees
  в контексте M&A: golden parachutes и выплаты при смене контроля
  (single-trigger / double-trigger), severance и exit payments,
  retention bonuses, good leaver / bad leaver и vesting /
  acceleration, non-compete / non-solicit.

  Формирует краткий user-facing вывод и оценивает финансовую
  нагрузку на покупателя, риск ухода ключевых лиц и силу
  удерживающих механизмов.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"
ui_mode: "field_extraction"

rules:
  keyword_mode: any

  keywords:
    high:
      # Golden parachute / CoC payments
      - "(?i)golden\\s+parachute"
      - "(?i)change\\s+of\\s+control\\s+payment"
      - "(?i)bonus\\s+upon\\s+change\\s+of\\s+control"
      - "(?i)change\\s+of\\s+control\\s+bonus"
      - "(?i)выплат[аы]\\s+при\\s+смене\\s+контрол"
      - "(?i)бонус\\s+при\\s+смене\\s+контрол"
      - "(?i)single[-\\s]?trigger"
      - "(?i)double[-\\s]?trigger"

      # Severance / exit
      - "(?i)enhanced\\s+severance"
      - "(?i)severance\\s+(pay(ment)?|package)[\\s\\S]{0,20}(exceed|multiple|months?)"
      - "(?i)выходн(ое|ого)\\s+пособи[ея][\\s\\S]{0,20}(несколько|кратн|размер)"
      - "(?i)termination\\s+payment[\\s\\S]{0,20}(multiple|months?|salary)"
      - "(?i)компенсаци[яи]\\s+при\\s+увольнении[\\s\\S]{0,20}(сверх|кратн|несколько)"
      - "(?i)multiple\\s+of\\s+(salary|base\\s+salary)"

      # Retention
      - "(?i)retention\\s+bonus"
      - "(?i)retention\\s+award"
      - "(?i)stay\\s+bonus"
      - "(?i)удерживающ(ий|его)\\s+бонус"

      # Non-compete / non-solicit
      - "(?i)non[-\\s]?compete"
      - "(?i)non[-\\s]?solicit"
      - "(?i)restrictive\\s+covenants?"
      - "(?i)ограничени[ея]\\s+конкуренци"
      - "(?i)запрет\\s+работать\\s+у\\s+конкурент"
      - "(?i)запрет\\s+переманивани"

      # Employment / key management context
      - "(?i)employment\\s+agreement"
      - "(?i)трудов(ой|ого)\\s+договор"
      - "(?i)key\\s+employee"
      - "(?i)ключев(ой|ого)\\s+сотрудник"
      - "(?i)top\\s+management"
      - "(?i)топ[-\\s]?менеджмент"

    medium:
      # Good leaver / bad leaver
      - "(?i)good\\s+leaver"
      - "(?i)bad\\s+leaver"
      - "(?i)good\\s+reason"
      - "(?i)constructive\\s+dismissal"
      - "(?i)без\\s+вины\\s+работника"

      # Equity / vesting
      - "(?i)vesting"
      - "(?i)unvested"
      - "(?i)equity\\s+award"
      - "(?i)stock\\s+option"
      - "(?i)phantom\\s+shares?"
      - "(?i)опцион\\s+на\\s+акции"
      - "(?i)долгосрочн(ая|ого)\\s+мотиваци"
      - "(?i)long[-\\s]?term\\s+incentive"

      # Trigger / termination context
      - "(?i)upon\\s+(a\\s+)?change\\s+of\\s+control"
      - "(?i)в\\s+случае\\s+смены\\s+контрол"
      - "(?i)upon\\s+termination\\s+without\\s+cause"
      - "(?i)при\\s+увольнении\\s+без\\s+основан"
      - "(?i)without\\s+cause"
      - "(?i)for\\s+good\\s+reason"

      # Restrictive covenant details
      - "(?i)duration\\s+of\\s+(the\\s+)?non[-\\s]?compete"
      - "(?i)срок\\s+действи[яе]\\s+ограничени[яе]\\s+(конкуренци|non)"
      - "(?i)liquidated\\s+damages[\\s\\S]{0,20}(non[-\\s]?compete|restrictive)"

    low:
      - "(?i)golden\\s+parachute"
      - "(?i)single[-\\s]?trigger"
      - "(?i)double[-\\s]?trigger"
      - "(?i)retention\\s+bonus"
      - "(?i)non[-\\s]?compete"
      - "(?i)non[-\\s]?solicit"
      - "(?i)good\\s+leaver"
      - "(?i)bad\\s+leaver"
      - "(?i)phantom\\s+shares?"
      - "(?i)vesting"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 750

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 700

retrieval:
  retrieval_profile: "change_of_control_check"
  context_k: 5
  max_chunks: 10

  retrieval_query: >
    смена контроля выплата выходное пособие золотой парашют бонус за удержание 
    ограничение конкуренции запрет переманивания топ-менеджмент vesting опцион

  boost_keywords:
    - "golden parachute"
    - "change of control payment"
    - "bonus upon change of control"
    - "single-trigger"
    - "double-trigger"
    - "enhanced severance"
    - "выходное пособие"
    - "retention bonus"
    - "stay bonus"
    - "non-compete"
    - "non-solicit"
    - "good leaver"
    - "bad leaver"
    - "vesting"
    - "stock option"
    - "phantom shares"
    - "ключевой сотрудник"
    - "топ-менеджмент"
    - "employment agreement"
    - "трудовой договор"
    - "смена контроля"
    - "upon change of control"
    - "termination without cause"

  negative_keywords:
    - "коммерческая тайна"
    - "форс-мажор"
    - "применимое право"
    - "штрафные санкции"
    - "интеллектуальная собственность"

  preferred_unit_types:
    - "obligation"
    - "general_provision"

  excluded_unit_types:
    - "technical_fragment"
    - "appendix_reference"

  preferred_clause_functions:
    - "limitations"
    - "procedures"
    - "obligations"
    - "procedures"

  position_bias:
    preferred_range: [0.0, 1.0]
    boost: 0.10
    scope: "segment"

  rerank: true
  filters: {}

conditional: null

enrichment_hints:
  preferred_segment_types:
    - "contract"
    - "annex"
    - "appendix"
    - "amendment"
  excluded_segment_types:
    - "technical_specification"
    - "price_list"
    - "invoice"
    - "act"
    - "schedule"
  confidence_bonus_on_match: 0.10
  confidence_penalty_on_excluded_segment: 0.15

extraction:
  enabled: true
  mode: "hybrid"
  llm_max_tokens: 1150

  llm_prompt_extraction: |
    <role>
    Ты — юрист по трудовому праву и M&A.
    Твоя задача — точно извлечь из текста:
    1) CoC / exit выплаты топ-менеджменту;
    2) retention-механизмы;
    3) non-compete / non-solicit;
    4) good leaver / bad leaver и vesting.

    КРИТИЧЕСКИ ВАЖНО:
    - Извлекай ТОЛЬКО то, что прямо написано в тексте.
    - НЕ придумывай размеры выплат, если они не указаны явно.
    - НЕ подменяй обычные законные выплаты severance
      специальными CoC / exit выплатами.
    - Если информация отсутствует — используй "no", "unclear"
      или соответствующее текстовое состояние.
    </role>

    <context>
    Ниже приведены релевантные фрагменты договора:

    {context}
    </context>

    <context_rules>
    - Некоторые фрагменты могут быть нерелевантны — игнорируй их.
    - Если фрагменты противоречат друг другу — используй "unclear"
      и кратко объясни это в reason.
    - `single_trigger` = выплата только из-за CoC.
    - `double_trigger` = CoC + увольнение / ухудшение роли /
      termination without cause / good reason.
    - Обычные выплаты по закону не считаются CoC / exit выплатами.
    - Не добавляй в display длительность retention или non-compete,
      если она не отражена в extracted fields.
    </context_rules>

    <task>
    Заполни только следующие поля:
    - key_management_display
    - has_change_of_control_or_exit_payments
    - coc_payment_trigger_type
    - coc_payment_size_summary
    - has_retention_bonuses
    - retention_strength
    - has_non_compete_or_non_solicit
    - restrictive_covenants_strength
    - has_leaver_or_vesting_terms
    - reason
    </task>

    <instructions>
    Шаг 1 — CoC / EXIT ВЫПЛАТЫ

    Заполни "has_change_of_control_or_exit_payments",
    "coc_payment_trigger_type", "coc_payment_size_summary".

    Значения для has_change_of_control_or_exit_payments:
    - "yes" — есть golden parachute, CoC bonus,
      enhanced severance, exit payment.
    - "no" — нет.
    - "unclear" — нельзя определить.

    Значения для coc_payment_trigger_type:
    - "single_trigger" — выплата только из-за CoC.
    - "double_trigger" — CoC + увольнение / change of role.
    - "termination_only" — только при увольнении без CoC.
    - "not_applicable" — выплат нет.
    - "unclear" — нельзя определить.

    Правила для coc_payment_size_summary:
    - Если размер указан явно: "3 оклада", "USD 500K", "18 мес."
    - Если выплата есть, но размер не указан: "Размер не указан"
    - Если выплат нет: "Не применимо"
    - Если нельзя определить: "Не удалось определить"

    Шаг 2 — RETENTION-МЕХАНИЗМЫ

    Заполни "has_retention_bonuses" и "retention_strength".

    Значения для has_retention_bonuses:
    - "yes" — есть retention bonus, stay bonus, vesting,
      LTIP retention, удерживающие выплаты.
    - "no" — нет.
    - "unclear" — нельзя определить.

    Значения для retention_strength:
    - "strong" — явно существенный retention.
    - "moderate" — умеренный.
    - "weak" — формальный / слабый.
    - "not_applicable" — retention нет.
    - "unclear" — нельзя определить.

    Шаг 3 — NON-COMPETE / NON-SOLICIT

    Заполни "has_non_compete_or_non_solicit"
    и "restrictive_covenants_strength".

    Значения для has_non_compete_or_non_solicit:
    - "yes" — есть non-compete / non-solicit /
      restrictive covenants.
    - "no" — нет.
    - "unclear" — нельзя определить.

    Значения для restrictive_covenants_strength:
    - "strong" — есть срок, территория, санкции / enforceability.
    - "moderate" — часть элементов есть.
    - "weak" — ограничения описаны слабо.
    - "not_applicable" — ограничений нет.
    - "unclear" — нельзя определить.

    Шаг 4 — GOOD LEAVER / BAD LEAVER / VESTING

    Заполни "has_leaver_or_vesting_terms".

    Значения:
    - "yes" — есть good/bad leaver, vesting, forfeiture,
      acceleration при CoC.
    - "no" — нет.
    - "unclear" — нельзя определить.

    Шаг 5 — НОРМАЛИЗОВАННЫЙ DISPLAY ДЛЯ DD GRID

    Заполни "key_management_display".

    Это итоговое поле для таблицы.
    Строй его ТОЛЬКО на основе уже заполненных полей выше.
    Не добавляй информацию сверх них.

    Возможные состояния:
    1. Есть CoC / exit выплаты:
       "CoC / exit выплаты: 3 оклада; double-trigger; retention сильный"
    2. Выплат нет, но есть ограничения:
       "CoC выплат не обнаружено; retention есть; non-compete умеренный"
    3. Есть vesting / leaver:
       "CoC / exit выплаты: размер не указан; leaver / vesting есть"
    4. Не удалось определить:
       "Не удалось определить условия для топ-менеджмента"

    Правила:
    - Если все поля unclear:
      "Не удалось определить условия для топ-менеджмента"
    - Если has_change_of_control_or_exit_payments = "no"
      и has_retention_bonuses = "no"
      и has_non_compete_or_non_solicit = "no"
      и has_leaver_or_vesting_terms = "no":
      "CoC выплат не обнаружено; retention нет"
    - Иначе комбинируй через ";":
      * если has_change_of_control_or_exit_payments = "yes":
        "CoC / exit выплаты: {coc_payment_size_summary}"
      * если coc_payment_trigger_type != "not_applicable"
        и != "unclear":
        добавь trigger_type кратко:
        "single-trigger", "double-trigger", "termination only"
      * если has_retention_bonuses = "yes":
        добавь "retention сильный/умеренный/слабый"
      * если has_non_compete_or_non_solicit = "yes":
        добавь "non-compete сильный/умеренный/слабый"
      * если has_leaver_or_vesting_terms = "yes":
        добавь "leaver / vesting есть"
    - Не более 3 коротких фактов через ";".

    Шаг 6 — КРАТКОЕ ОБОСНОВАНИЕ

    Заполни "reason".

    Правила:
    - Первое предложение — краткий вывод.
    - Второе — trigger / размер / retention / covenants
      + короткая цитата (до 100 символов).
    - Пиши по-русски.
    </instructions>

    <edge_cases>
    - 6 окладов при CoC + увольнении:
      * has_change_of_control_or_exit_payments = "yes"
      * coc_payment_trigger_type = "double_trigger"
      * coc_payment_size_summary = "6 окладов"

    - Выплата только из-за CoC без увольнения:
      * coc_payment_trigger_type = "single_trigger"

    - Только стандартные выплаты по закону:
      * has_change_of_control_or_exit_payments = "no"
      * coc_payment_trigger_type = "not_applicable"
      * coc_payment_size_summary = "Не применимо"

    - Non-compete без срока и санкций:
      * has_non_compete_or_non_solicit = "yes"
      * restrictive_covenants_strength = "weak"

    - Acceleration vesting при CoC:
      * has_leaver_or_vesting_terms = "yes"

    - Нет релевантных фрагментов:
      * все поля = "unclear"
      * coc_payment_size_summary = "Не удалось определить"
      * key_management_display =
        "Не удалось определить условия для топ-менеджмента"
    </edge_cases>

    <output_expectations>
    - Верни результат строго в формате JSON.
    - Не оборачивай ответ в markdown-блоки.
    - Не добавляй комментариев вне JSON.
    - Для полей с allowed_values используй строго значения из списка.
    - Свободные текстовые поля
      (key_management_display, coc_payment_size_summary, reason)
      заполняй на русском языке.
    - Не добавляй никаких полей, кроме указанных.

    Пример структуры ответа:
    {
      "key_management_display": "CoC / exit выплаты: 3 оклада; double-trigger; retention сильный",
      "has_change_of_control_or_exit_payments": "yes",
      "coc_payment_trigger_type": "double_trigger",
      "coc_payment_size_summary": "3 оклада",
      "has_retention_bonuses": "yes",
      "retention_strength": "strong",
      "has_non_compete_or_non_solicit": "yes",
      "restrictive_covenants_strength": "moderate",
      "has_leaver_or_vesting_terms": "yes",
      "reason": "..."
    }
    </output_expectations>

  fields:
    - name: "key_management_display"
      type: "string"
      presentation: "fact"
      label: "Топ-менеджмент и CoC"
      description: "Нормализованный user-facing вывод для DD Grid"
      display_in_grid: true
      display_priority: 1

    - name: "has_change_of_control_or_exit_payments"
      type: "string"
      presentation: "signal"
      description: "CoC / exit выплаты топ-менеджменту"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
      display_in_grid: false

    - name: "coc_payment_trigger_type"
      type: "string"
      presentation: "signal"
      description: "Триггер CoC-выплаты"
      allowed_values:
        - "single_trigger"
        - "double_trigger"
        - "termination_only"
        - "not_applicable"
        - "unclear"
      display_in_grid: false

    - name: "coc_payment_size_summary"
      type: "string"
      presentation: "fact"
      label: "Размер CoC / severance выплат"
      description: "Размер выплат при CoC или увольнении"
      display_in_grid: true
      display_priority: 2

    - name: "has_retention_bonuses"
      type: "string"
      presentation: "signal"
      description: "Retention-механизмы"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
      display_in_grid: false

    - name: "retention_strength"
      type: "string"
      presentation: "signal"
      description: "Сила retention-механизмов"
      allowed_values:
        - "strong"
        - "moderate"
        - "weak"
        - "not_applicable"
        - "unclear"
      display_in_grid: false

    - name: "has_non_compete_or_non_solicit"
      type: "string"
      presentation: "signal"
      description: "Non-compete / non-solicit"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
      display_in_grid: false

    - name: "restrictive_covenants_strength"
      type: "string"
      presentation: "signal"
      description: "Сила restrictive covenants"
      allowed_values:
        - "strong"
        - "moderate"
        - "weak"
        - "not_applicable"
        - "unclear"
      display_in_grid: false

    - name: "has_leaver_or_vesting_terms"
      type: "string"
      presentation: "signal"
      description: "Good / bad leaver; vesting / acceleration"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
      display_in_grid: false

    - name: "reason"
      type: "string"
      presentation: "diagnostic"
      description: "Обоснование"
      display_in_grid: false

  store_payload: true


  
