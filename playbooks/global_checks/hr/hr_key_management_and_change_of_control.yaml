id: "hr_key_management_and_change_of_control"
name: "Топ-менеджмент, key employees и смена контроля"
description: >
  Анализирует условия договоров с топ-менеджментом и key employees
  в контексте M&A: golden parachutes и выплаты при смене контроля
  (single-trigger / double-trigger), severance и exit payments,
  retention bonuses, good leaver / bad leaver и vesting /
  acceleration, non-compete / non-solicit.

  Формирует краткий user-facing вывод и оценивает финансовую
  нагрузку на покупателя, риск ухода ключевых лиц и силу
  удерживающих механизмов.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"
ui_mode: "field_extraction"

rules:
  keyword_mode: any

  keywords:
    high:
      # Golden parachute / CoC payments
      - "(?i)golden\\s+parachute"
      - "(?i)change\\s+of\\s+control\\s+payment"
      - "(?i)bonus\\s+upon\\s+change\\s+of\\s+control"
      - "(?i)change\\s+of\\s+control\\s+bonus"
      - "(?i)выплат[аы]\\s+при\\s+смене\\s+контрол"
      - "(?i)бонус\\s+при\\s+смене\\s+контрол"
      - "(?i)single[-\\s]?trigger"
      - "(?i)double[-\\s]?trigger"

      # Severance / exit
      - "(?i)enhanced\\s+severance"
      - "(?i)severance\\s+(pay(ment)?|package)[\\s\\S]{0,20}(exceed|multiple|months?)"
      - "(?i)выходн(ое|ого)\\s+пособи[ея][\\s\\S]{0,20}(несколько|кратн|размер)"
      - "(?i)termination\\s+payment[\\s\\S]{0,20}(multiple|months?|salary)"
      - "(?i)компенсаци[яи]\\s+при\\s+увольнении[\\s\\S]{0,20}(сверх|кратн|несколько)"
      - "(?i)multiple\\s+of\\s+(salary|base\\s+salary)"

      # Retention
      - "(?i)retention\\s+bonus"
      - "(?i)retention\\s+award"
      - "(?i)stay\\s+bonus"
      - "(?i)удерживающ(ий|его)\\s+бонус"

      # Non-compete / non-solicit
      - "(?i)non[-\\s]?compete"
      - "(?i)non[-\\s]?solicit"
      - "(?i)restrictive\\s+covenants?"
      - "(?i)ограничени[ея]\\s+конкуренци"
      - "(?i)запрет\\s+работать\\s+у\\s+конкурент"
      - "(?i)запрет\\s+переманивани"

      # Employment / key management context
      - "(?i)employment\\s+agreement"
      - "(?i)трудов(ой|ого)\\s+договор"
      - "(?i)key\\s+employee"
      - "(?i)ключев(ой|ого)\\s+сотрудник"
      - "(?i)top\\s+management"
      - "(?i)топ[-\\s]?менеджмент"

    medium:
      # Good leaver / bad leaver
      - "(?i)good\\s+leaver"
      - "(?i)bad\\s+leaver"
      - "(?i)good\\s+reason"
      - "(?i)constructive\\s+dismissal"
      - "(?i)без\\s+вины\\s+работника"

      # Equity / vesting
      - "(?i)vesting"
      - "(?i)unvested"
      - "(?i)equity\\s+award"
      - "(?i)stock\\s+option"
      - "(?i)phantom\\s+shares?"
      - "(?i)опцион\\s+на\\s+акции"
      - "(?i)долгосрочн(ая|ого)\\s+мотиваци"
      - "(?i)long[-\\s]?term\\s+incentive"

      # Trigger / termination context
      - "(?i)upon\\s+(a\\s+)?change\\s+of\\s+control"
      - "(?i)в\\s+случае\\s+смены\\s+контрол"
      - "(?i)upon\\s+termination\\s+without\\s+cause"
      - "(?i)при\\s+увольнении\\s+без\\s+основан"
      - "(?i)without\\s+cause"
      - "(?i)for\\s+good\\s+reason"

      # Restrictive covenant details
      - "(?i)duration\\s+of\\s+(the\\s+)?non[-\\s]?compete"
      - "(?i)срок\\s+действи[яе]\\s+ограничени[яе]\\s+(конкуренци|non)"
      - "(?i)liquidated\\s+damages[\\s\\S]{0,20}(non[-\\s]?compete|restrictive)"

    low:
      - "(?i)golden\\s+parachute"
      - "(?i)single[-\\s]?trigger"
      - "(?i)double[-\\s]?trigger"
      - "(?i)retention\\s+bonus"
      - "(?i)non[-\\s]?compete"
      - "(?i)non[-\\s]?solicit"
      - "(?i)good\\s+leaver"
      - "(?i)bad\\s+leaver"
      - "(?i)phantom\\s+shares?"
      - "(?i)vesting"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 750

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 700

retrieval:
  context_k: 5
  max_chunks: 10
  boost_keywords:
    - "golden parachute"
    - "change of control payment"
    - "bonus upon change of control"
    - "single-trigger"
    - "double-trigger"
    - "enhanced severance"
    - "выходное пособие"
    - "retention bonus"
    - "stay bonus"
    - "non-compete"
    - "non-solicit"
    - "good leaver"
    - "bad leaver"
    - "vesting"
    - "stock option"
    - "phantom shares"
    - "ключевой сотрудник"
    - "топ-менеджмент"
    - "employment agreement"
    - "трудовой договор"
    - "смена контроля"
    - "upon change of control"
    - "termination without cause"
  rerank: true
  filters: {}

conditional: null

enrichment_hints:
  preferred_segment_types:
    - "contract"
    - "annex"
    - "appendix"
    - "amendment"
  excluded_segment_types:
    - "technical_specification"
    - "price_list"
    - "invoice"
    - "act"
    - "schedule"
  preferred_clause_functions:
    - "non_compete"
    - "non_solicitation"
    - "change_of_control"
    - "termination"
  confidence_bonus_on_match: 0.10
  confidence_penalty_on_excluded_segment: 0.15

extraction:
  enabled: true
  mode: "hybrid"
  llm_max_tokens: 500
  llm_prompt_extraction: |
    <role>
    Ты — юрист по трудовому праву и M&A.
    Твоя задача — точно извлечь из текста:
    1) CoC / exit выплаты топ-менеджменту (golden parachute,
       severance), их тип и триггер;
    2) retention-механизмы;
    3) non-compete / non-solicit;
    4) good leaver / bad leaver и vesting conditions.
    </role>

    <context>
    Ниже приведены релевантные фрагменты договора:

    {context}
    </context>

    <task>
    Заполни только следующие поля:
    - key_management_display
    - has_change_of_control_or_exit_payments
    - coc_payment_trigger_type
    - coc_payment_size_summary
    - has_retention_bonuses
    - retention_strength
    - has_non_compete_or_non_solicit
    - restrictive_covenants_strength
    - has_leaver_or_vesting_terms
    - financial_impact_risk_level
    - red_flags
    - reason

    Важно:
    - не придумывай размеры выплат если они не указаны;
    - пиши user-facing значения коротко и по-русски.
    </task>

    <instructions>
    Шаг 1 — CoC / EXIT ВЫПЛАТЫ

    Заполни поля "has_change_of_control_or_exit_payments",
    "coc_payment_trigger_type", "coc_payment_size_summary".

    Значения для has_change_of_control_or_exit_payments:
    - "yes" — есть: golden parachute, CoC bonus, enhanced
      severance, exit payment.
    - "no" — нет.
    - "unclear" — неясно.

    Значения для coc_payment_trigger_type:
    - "single_trigger" — выплата только из-за CoC.
    - "double_trigger" — CoC + увольнение / change of role.
    - "termination_only" — только при увольнении без CoC.
    - "not_applicable" — выплат нет.
    - "unclear" — нельзя определить.

    Значения для coc_payment_size_summary:
    - Если размер указан: "3 оклада", "USD 500K", "18 месяцев"
    - Если не указан: "Размер не указан"
    - Если не применимо: "Не применимо"

    Шаг 2 — RETENTION-МЕХАНИЗМЫ

    Заполни поля "has_retention_bonuses" и "retention_strength".

    Значения для has_retention_bonuses:
    - "yes" — есть: retention bonus, stay bonus, vesting,
      long-term incentive.
    - "no" — нет.
    - "unclear" — неясно.

    Значения для retention_strength:
    - "strong" — существенный retention (> 12 месяцев,
      значительная сумма).
    - "moderate" — умеренный retention.
    - "weak" — формальный / незначительный.
    - "not_applicable" — retention нет.
    - "unclear" — неясно.

    Шаг 3 — NON-COMPETE / NON-SOLICIT

    Заполни поля "has_non_compete_or_non_solicit"
    и "restrictive_covenants_strength".

    Значения для has_non_compete_or_non_solicit:
    - "yes" — есть.
    - "no" — нет.
    - "unclear" — неясно.

    Значения для restrictive_covenants_strength:
    - "strong" — есть срок (> 1 года), территория,
      санкции / liquidated damages.
    - "moderate" — частично: есть срок или санкции.
    - "weak" — нет срока, территории или санкций.
    - "not_applicable" — ограничений нет.
    - "unclear" — нельзя оценить.

    Шаг 4 — GOOD LEAVER / BAD LEAVER / VESTING

    Заполни поле "has_leaver_or_vesting_terms".

    Значения:
    - "yes" — есть:
      * good leaver / bad leaver;
      * vesting / forfeiture;
      * acceleration vesting при CoC;
      * потеря бонусов / опционов при уходе.
    - "no" — нет.
    - "unclear" — неясно.

    Шаг 5 — ФИНАНСОВАЯ НАГРУЗКА НА ПОКУПАТЕЛЯ

    Заполни поле "financial_impact_risk_level".

    Значения:
    - "low" — стандартные выплаты по закону, нет CoC bonus,
      нет significant retention.
    - "medium" — есть CoC payments или severance, но в
      разумных пределах.
    - "high" — существенные CoC payments нескольким лицам,
      single-trigger, acceleration vesting.
    - "unclear" — данных недостаточно.

    Шаг 6 — RED FLAGS

    Заполни поле "red_flags".

    Используй:
    - "NONE" — если существенных риск-факторов нет.
    - "UNCLEAR" — если данных недостаточно.
    - Коды через запятую:
      * KEY1 — крупные CoC / severance выплаты нескольким
        key persons.
      * KEY2 — single-trigger CoC payment.
      * KEY3 — key persons могут уйти после CoC с существенной
        компенсацией (single-trigger + значительный размер).
      * KEY4 — retention mechanisms отсутствуют или слабы.
      * KEY5 — non-compete / non-solicit формально есть,
        но слабый: нет срока, территории или санкций.
      * KEY6 — acceleration vesting / good leaver создают
        существенный payout / loss scenario.

    Шаг 7 — USER-FACING SUMMARY

    Заполни поле "key_management_display".

    Примеры:
    - "Golden parachute: 3 оклада; single-trigger; retention 18 мес."
    - "CoC bonus при double-trigger; non-compete 2 года;
       нет vesting"
    - "CoC выплат не обнаружено; retention bonus есть;
       non-compete слабый"
    - "Не удалось определить условия для топ-менеджмента"

    Правила:
    - Отрази максимум 3 ключевых факта через ";".
    - Если нет CoC выплат:
      "CoC выплат не обнаружено; [retention / non-compete если есть]"
    - Если всё unclear:
      "Не удалось определить условия для топ-менеджмента"

    Шаг 8 — ОБОСНОВАНИЕ

    Заполни поле "reason".

    Правила:
    - 1–2 коротких предложения.
    - Укажи: CoC payments и триггер, размер severance,
      retention, non-compete, leaver/vesting, финансовая
      нагрузка, почему выставлены red_flags.
    - Приведи короткую цитату в кавычках.
    - Если NONE — почему риск умеренный / низкий.
    </instructions>

    <edge_cases>
    - Топ-менеджер при CoC + увольнении получает 6 окладов:
      * has_change_of_control_or_exit_payments = "yes"
      * coc_payment_trigger_type = "double_trigger"
      * coc_payment_size_summary = "6 окладов"
      * red_flags включает "KEY1"

    - Выплата только из-за CoC без увольнения:
      * coc_payment_trigger_type = "single_trigger"
      * red_flags включает "KEY2, KEY3"

    - Только стандартные выплаты по закону:
      * financial_impact_risk_level = "low"
      * red_flags = "NONE"

    - Non-compete без срока и санкций:
      * has_non_compete_or_non_solicit = "yes"
      * restrictive_covenants_strength = "weak"
      * red_flags включает "KEY5"

    - Acceleration vesting акций при CoC:
      * has_leaver_or_vesting_terms = "yes"
      * red_flags включает "KEY6"
      * financial_impact_risk_level = "high"

    - Сильный retention bonus 18 месяцев после closing:
      * has_retention_bonuses = "yes"
      * retention_strength = "strong"
      * в reason: снижает departure risk

    - Нет релевантных фрагментов:
      * все поля = "unclear"
      * red_flags = "UNCLEAR"
      * key_management_display =
        "Не удалось определить условия для топ-менеджмента"
    </edge_cases>

    <output_expectations>
    Все значения должны быть короткими, точными и пригодными
    для отображения пользователю в DD Grid.
    Не добавляй никаких полей, кроме указанных в схеме extraction.
    </output_expectations>

  fields:
    - name: "key_management_display"
      type: "string"
      description: "Топ-менеджмент и CoC: краткий вывод"

    - name: "has_change_of_control_or_exit_payments"
      type: "string"
      description: "CoC / exit выплаты топ-менеджменту"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "coc_payment_trigger_type"
      type: "string"
      description: "Триггер CoC-выплаты"
      allowed_values:
        - "single_trigger"
        - "double_trigger"
        - "termination_only"
        - "not_applicable"
        - "unclear"

    - name: "coc_payment_size_summary"
      type: "string"
      description: "Размер CoC / severance выплат"

    - name: "has_retention_bonuses"
      type: "string"
      description: "Retention-механизмы"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "retention_strength"
      type: "string"
      description: "Сила retention-механизмов"
      allowed_values:
        - "strong"
        - "moderate"
        - "weak"
        - "not_applicable"
        - "unclear"

    - name: "has_non_compete_or_non_solicit"
      type: "string"
      description: "Non-compete / non-solicit"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "restrictive_covenants_strength"
      type: "string"
      description: "Сила restrictive covenants"
      allowed_values:
        - "strong"
        - "moderate"
        - "weak"
        - "not_applicable"
        - "unclear"

    - name: "has_leaver_or_vesting_terms"
      type: "string"
      description: "Good / bad leaver; vesting / acceleration"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "financial_impact_risk_level"
      type: "string"
      description: "Финансовая нагрузка на покупателя"
      allowed_values:
        - "low"
        - "medium"
        - "high"
        - "unclear"

    - name: "red_flags"
      type: "string"
      description: "Коды рисков"

    - name: "reason"
      type: "string"
      description: "Обоснование"

  store_payload: true


  