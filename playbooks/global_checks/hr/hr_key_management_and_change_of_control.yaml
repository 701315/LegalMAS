id: "hr_key_management_and_change_of_control"
name: "Топ-менеджмент, key employees и смена контроля"
description: >
  Анализирует трудовые договоры и соглашения с топ-менеджментом и ключевыми
  сотрудниками: golden parachutes, выплаты при смене контроля или увольнении,
  основания расторжения, non-compete/non-solicit, retention-бонусы.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"

rules:
  keywords:
    - "трудовой договор"
    - "employment agreement"
    - "служебный контракт"
    - "top management"
    - "топ-менеджмент"
    - "key employee"
    - "ключевой сотрудник"
    - "golden parachute"
    - "change of control"
    - "смена контроля"
    - "severance"
    - "выходное пособие"
    - "retention bonus"
    - "bonus upon change of control"
    - "non-compete"
    - "ограничение конкуренции"
    - "non-solicit"
    - "запрет переманивания"
  keyword_mode: "any"
  regex_patterns: []
  clause_patterns: []

llm:
  prompt_template: |
    <role>
    Ты — юрист по трудовому праву и M&A.
    Твоя специализация — условия договоров с топ-менеджментом и key employees
    в контексте смены контроля и сделок.
    </role>

    <context>
    Ниже приведены фрагменты трудовых договоров/соглашений с топ-менеджментом
    и ключевыми сотрудниками:

    {context}
    </context>

    <instructions>
    Проведи анализ по шагам. Каждый шаг логически связан с одним или
    несколькими полями итоговой оценки.

    Шаг 1 — СПЕЦИАЛЬНЫЕ ВЫПЛАТЫ ПРИ CoC/УВОЛЬНЕНИИ
    (используется для "has_change_of_control_or_exit_payments"
     и "coc_or_exit_payments_description"):
    - Определи, предусмотрены ли:
      * специальные выплаты при смене контроля (golden parachute, bonus upon change of control);
      * увеличенные выходные пособия (severance) при увольнении, особенно без вины работника;
      * exit-платежи, завязанные на совершение сделки или CoC.
    - Кратко опиши структуру таких выплат (мультипликаторы окладов, бонусы и триггеры).

    Шаг 2 — RETENTION-БОНУСЫ
    (используется для "has_retention_bonuses"):
    - Проверь, есть ли retention-бонусы:
      * выплаты за продолжение работы до/после сделки;
      * условия, при которых они сохраняются или утрачиваются (срок работы после CoC и т.п.).
    - Сделай вывод: да / нет / неясно.

    Шаг 3 — NON-COMPETE / NON-SOLICIT
    (используется для "has_non_compete_or_non_solicit" и влияет на оценку рисков):
    - Определи, содержатся ли:
      * запрет работать у конкурентов или создавать конкурирующий бизнес (non-compete);
      * запрет переманивать работников/клиентов (non-solicit);
      * срок и территория действия, если указаны, а также механизмы обеспечения.
    - Отметь в выводах, насколько эти ограничения выглядят жёсткими или, наоборот, слабыми/сомнительными.

    Шаг 4 — РИСК УХОДА КЛЮЧЕВЫХ ЛИЦ
    (используется для "key_person_departure_risk_level"):
    - Оцени риск ухода key persons с учётом:
      * наличия или отсутствия удерживающих механизмов (retention, vesting, долгосрочные бонусы);
      * привлекательности «выхода» с крупной компенсацией после CoC;
      * силы/слабости non-compete/non-solicit (насколько они реально препятствуют уходу к конкурентам).
    - Классифицируй риск как low / medium / high / unclear и отрази ключевые факторы в reason.

    Шаг 5 — ФИНАНСОВОЕ ВОЗДЕЙСТВИЕ НА СДЕЛКУ
    (используется для "financial_impact_risk_level"):
    - Оцени потенциальную финансовую нагрузку на покупателя/инвестора:
      * размер возможных разовых выплат (severance, CoC-бонусы, retention);
      * количество лиц, на которых такие условия распространяются;
      * легкость наступления триггеров (простая смена контроля, увольнение без вины и т.п.).
    - Определи уровень финансового риска как low / medium / high / unclear.

    Шаг 6 — ОБЩИЙ РИСК ДЛЯ ПОКУПАТЕЛЯ
    (используется для "overall_risk_level" и "reason"):
    - Сведи воедино:
      * риск потери ключевых лиц (и возможный ущерб для бизнеса);
      * размер и вероятность крупных выплат;
      * силу договорных ограничений (non-compete/non-solicit).
    - Оцени общий уровень риска для покупателя бизнеса/инвестора как low / medium / high.
    - В "reason" кратко обоснуй вывод, ссылаясь на конкретные формулировки
      (желательно с короткими цитатами), и поясни, как условия влияют на
      удержание key persons и финансовую нагрузку при сделке.
    </instructions>

    <edge_cases>
    Обрабатывай пограничные ситуации так:

    - Явно указано, что при смене контроля топ-менеджер вправе расторгнуть
      договор с крупным severance (несколько окладов, бонус и т.п.):
      учитывай это как сочетание повышенного риска ухода и высокой финнагрузки.

    - Есть только стандартные выходные пособия по закону, без специальных
      CoC/exit-условий:
      не завышай финансовый риск, если нет иных крупных выплат.

    - Non-compete/non-solicit упомянуты, но без срока, территории или
      механизма исполнения:
      отмечай их формальное наличие, но учитывай возможную слабую исполнимость
      при оценке риска ухода.

    - Текст прямо говорит, что при смене контроля дополнительных выплат нет
      и условия не меняются:
      не завышай финансовый риск только из-за факта CoC.

    - Пустые или нерелевантные фрагменты:
      укажи, что данных недостаточно для анализа условий договоров с топ-менеджментом
      и key employees, и поясни, как это влияет на неопределённость и риск.
    </edge_cases>

    <output_expectations>
    На основе твоего анализа отдельный механизм извлечения сформирует
    структурированные поля по заранее заданной схеме. Твоя задача —
    давать чёткие юридические выводы и указывать конкретные формулировки
    из текста, на которых они основаны.
    </output_expectations>
  prompt_file: null
  context_k: 5
  temperature: 0.0
  max_tokens: 640

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 700

retrieval:
  context_k: 5
  max_chunks: 10
  boost_keywords:
    - "golden parachute"
    - "change of control"
    - "severance"
    - "retention bonus"
    - "non-compete"
    - "non-solicit"
  rerank: true
  filters: {}

conditional: null

extraction:
  enabled: true
  mode: "hybrid"
  fields:
    - name: "has_change_of_control_or_exit_payments"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "coc_or_exit_payments_description"
      type: "string"

    - name: "has_retention_bonuses"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "has_non_compete_or_non_solicit"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "key_person_departure_risk_level"
      type: "string"
      allowed_values:
        - "low"
        - "medium"
        - "high"
        - "unclear"

    - name: "financial_impact_risk_level"
      type: "string"
      allowed_values:
        - "low"
        - "medium"
        - "high"
        - "unclear"

    - name: "overall_risk_level"
      type: "string"
      allowed_values:
        - "low"
        - "medium"
        - "high"

    - name: "reason"
      type: "string"

  store_payload: true

red_flags:
  items:
    - code: "HR1"
      description: "Крупные выплаты при смене контроля/увольнении нескольких key persons."
    - code: "HR2"
      description: "Права ключевых лиц легко уйти при смене контроля с значительной компенсацией."
