id: "liability_exclusions"
name: "Исключения из ответственности (indirect, loss of profit)"
description: >
  Анализирует исключения из ответственности: indirect, consequential,
  punitive, loss of profit, loss of business, и их реальное влияние
  на риск-профиль Target.

doc_types: []

severity: "medium"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"

rules:
  keywords:
    - "косвенные убытки"
    - "опосредованные убытки"
    - "последующие убытки"
    - "indirect damages"
    - "consequential damages"
    - "special damages"
    - "punitive damages"
    - "loss of profit"
    - "упущенная выгода"
    - "loss of business"
    - "loss of revenue"
  keyword_mode: "any"
  regex_patterns: []
  clause_patterns: []

llm:
  prompt_template: |
    <role>
    Ты — юрист по коммерческим контрактам.
    Твоя специализация — ограничения и исключения договорной ответственности
    (indirect / consequential loss, loss of profit и т.п.).
    </role>

    <context>
    Ниже приведены фрагменты договора с положениями об исключениях из ответственности:

    {context}
    </context>

    <instructions>
    Проведи анализ по шагам. Каждый шаг логически связан с одним или
    несколькими полями итоговой оценки.

    Шаг 1 — ИСКЛЮЧЕНИЕ КОСВЕННЫХ/ПОСЛЕДУЮЩИХ УБЫТКОВ
    (используется для "excludes_indirect_or_consequential"):
    - Определи, исключены ли:
      * косвенные, опосредованные, последующие убытки;
      * indirect, consequential, special, punitive damages и аналогичные категории.
    - Сформулируй вывод: yes / no / unclear, опираясь только на прямые формулировки
      или очевидные эквиваленты.

    Шаг 2 — ИСКЛЮЧЕНИЕ УПУЩЕННОЙ ВЫГОДЫ И ПОТЕРИ БИЗНЕСА
    (используется для "excludes_loss_of_profit_or_business"):
    - Проверь, исключена ли ответственность за:
      * loss of profit, loss of business, loss of revenue,
      * loss of anticipated savings и аналогичные формулировки.
    - Зафиксируй наличие такого исключения как yes / no / unclear, ориентируясь
      прежде всего на прямые упоминания этих категорий.

    Шаг 3 — ОБЩИЙ РИСК ДЛЯ TARGET С УЧЁТОМ БИЗНЕС-ПРОФИЛЯ
    (используется для "overall_risk_level" и "reason"):
    - Оцени влияние исключений на риск-профиль Target:
      * для моделей, завязанных на непрерывность сервиса и выручку (SaaS,
        маркетплейс, дистрибуция, сервисы с высокой стоимостью простоя),
        исключение косвенных убытков и упущенной выгоды часто критично;
      * учти наличие в тексте иных механизмов смягчения (страхование, специальные
        компенсации, сервис-кредиты, SLA-кредиты и т.п., если они видны во фрагментах).
    - Сформулируй общий уровень риска как low / medium / high.
    - В "reason" кратко обоснуй вывод, ссылаясь на ключевые формулировки
      (желательно с короткими цитатами) и пояснив, почему структура исключений
      снижает/повышает защищённость Target с учётом характера её бизнеса.
    </instructions>

    <edge_cases>
    Обрабатывай пограничные ситуации так:

    - Стандартная оговорка "no liability for indirect, consequential or special damages":
      как правило означает excludes_indirect_or_consequential = "yes".
      Если loss of profit не упомянута прямо, но может быть косвенно отнесена к
      consequential damages, отметь это в reason, но флаг
      "excludes_loss_of_profit_or_business" оцени по прямому тексту.

    - Формулировки "including but not limited to loss of profit, loss of business,
      loss of revenue" обычно означают, что упущенная выгода и потеря бизнеса
      прямо исключены:
      учитывай это как повышенный риск, особенно если Target критично зависит
      от выручки/маржи.

    - Исключения сформулированы симметрично для обеих сторон, но Target фактически
      более уязвима (например, как покупатель критичного сервиса):
      это укажи в reason и можешь оценить риск как "medium" вместо "low".

    - Текст фрагментарный и непонятно, какие именно категории убытков исключены:
      используй "unclear" для соответствующих полей и объясни в reason, какие
      формулировки отсутствуют.

    - Пустые или явно нерелевантные фрагменты:
      укажи, что данных недостаточно для анализа исключений из ответственности
      (indirect/loss of profit), и отрази эту неопределённость в оценке риска.
    </edge_cases>

    <output_expectations>
    На основе твоего анализа отдельный механизм извлечения сформирует
    структурированные поля по заранее заданной схеме. Твоя задача —
    давать чёткие юридические выводы и указывать конкретные формулировки
    из текста, на которых они основаны.
    </output_expectations>
  prompt_file: null
  context_k: 3
  temperature: 0.0
  max_tokens: 384

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 400

retrieval:
  context_k: 3
  max_chunks: 6
  boost_keywords:
    - "indirect damages"
    - "consequential damages"
    - "упущенная выгода"
    - "loss of profit"
  rerank: true
  filters: {}

conditional: null

extraction:
  enabled: true
  mode: "hybrid"
  fields:
    - name: "excludes_indirect_or_consequential"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "excludes_loss_of_profit_or_business"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "overall_risk_level"
      type: "string"
      allowed_values:
        - "low"
        - "medium"
        - "high"

    - name: "reason"
      type: "string"

  store_payload: true

red_flags:
  items:
    - code: "LIAB5"
      description: "Исключена ответственность за loss of profit/loss of business при бизнес-модели, завязанной на такие показатели."
