id: "liability_exclusions"
name: "Исключения из ответственности (indirect, loss of profit)"
group: "Liability"
description: >
  Анализирует исключения из ответственности: indirect, consequential,
  special, punitive damages, loss of profit, loss of business,
  loss of revenue.

  Оценивает, в чью пользу работают исключения (симметричные или
  односторонние), и их реальное влияние на риск-профиль Target
  с учётом бизнес-модели.

  Формирует краткий user-facing вывод.

  Верхнеуровневый анализ объёма ответственности и indemnity
  выполняется чеком liability_and_indemnity_scope.
  Анализ структуры caps / basket / carve-out выполняется чеком
  liability_caps_and_baskets.

doc_types: []

severity: "medium"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"
ui_mode: "field_extraction"

rules:
  keyword_mode: any

  keywords:
    high:
      # Прямые исключения indirect/consequential
      - "(?i)shall\\s+not\\s+be\\s+liable\\s+for[\\s\\S]{0,40}(indirect|consequential|special|punitive)"
      - "(?i)exclud(e|es|ed|ing)[\\s\\S]{0,30}(indirect|consequential|special|punitive)\\s+damages"
      - "(?i)neither\\s+party[\\s\\S]{0,40}liable\\s+for[\\s\\S]{0,40}(indirect|consequential)"
      - "(?i)не\\s+(несёт|несет)\\s+ответственност[ьи]\\s+за[\\s\\S]{0,40}(косвенн|опосредованн|последующ)"
      - "(?i)исключ[а-я]+\\s+ответственность\\s+за[\\s\\S]{0,40}(косвенн|опосредованн)"

      # Прямые исключения loss of profit/business
      - "(?i)shall\\s+not\\s+be\\s+liable\\s+for[\\s\\S]{0,40}loss\\s+of\\s+(profit|business|revenue)"
      - "(?i)exclud(e|es|ed|ing)[\\s\\S]{0,30}loss\\s+of\\s+(profit|business|revenue)"
      - "(?i)including[\\s\\S]{0,20}loss\\s+of\\s+(profit|business|revenue|anticipated\\s+savings)"
      - "(?i)не\\s+(несёт|несет)\\s+ответственност[ьи]\\s+за[\\s\\S]{0,40}упущенн[а-я]+\\s+выгод"
      - "(?i)не\\s+возмеща[ею]тся[\\s\\S]{0,30}упущенн[а-я]+\\s+выгод"

    medium:
      # Категории убытков — упоминания
      - "(?i)indirect\\s+damages?"
      - "(?i)consequential\\s+damages?"
      - "(?i)special\\s+damages?"
      - "(?i)punitive\\s+damages?"
      - "(?i)incidental\\s+damages?"
      - "(?i)косвенн[а-я]+\\s+убытк[иов]"
      - "(?i)опосредованн[а-я]+\\s+убытк[иов]"

      # Loss of profit/business — упоминания
      - "(?i)loss\\s+of\\s+profit"
      - "(?i)lost\\s+profit"
      - "(?i)loss\\s+of\\s+business"
      - "(?i)loss\\s+of\\s+revenue"
      - "(?i)loss\\s+of\\s+anticipated\\s+savings"
      - "(?i)loss\\s+of\\s+goodwill"
      - "(?i)упущенн[а-я]+\\s+выгод[аыу]"
      - "(?i)потер[яию]\\s+дохода"
      - "(?i)потер[яию]\\s+прибыл[ьи]"
      - "(?i)недополученн[а-я]+\\s+(доход|прибыль|выручка)"

      # Симметричность
      - "(?i)neither\\s+party"
      - "(?i)each\\s+party"
      - "(?i)ни\\s+одна\\s+из\\s+сторон"
      - "(?i)обе\\s+стороны"

    low:
      - "(?i)indirect\\s+damages?"
      - "(?i)consequential\\s+damages?"
      - "(?i)loss\\s+of\\s+profit"
      - "(?i)lost\\s+profit"
      - "(?i)упущенн[а-я]+\\s+выгод"
      - "(?i)neither\\s+party\\s+shall\\s+be\\s+liable"
      - "(?i)exclud[a-z]+\\s+indirect"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 640

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  retrieval_profile: "liability_cap_check"
  context_k: 5
  max_chunks: 10

  retrieval_query: >
    исключение ответственности косвенные убытки упущенная выгода потеря дохода 
    indirect damages consequential damages loss of profit liability exclusion

  boost_keywords:
    - "shall not be liable for indirect"
    - "shall not be liable for consequential"
    - "excludes indirect damages"
    - "excludes consequential damages"
    - "indirect damages"
    - "consequential damages"
    - "special damages"
    - "punitive damages"
    - "loss of profit"
    - "lost profit"
    - "loss of business"
    - "loss of revenue"
    - "loss of anticipated savings"
    - "упущенная выгода"
    - "косвенные убытки"
    - "потеря дохода"
    - "недополученная прибыль"
    - "neither party shall be liable"
    - "ни одна из сторон не несёт ответственности"

  negative_keywords:
    - "форс-мажор"
    - "интеллектуальная собственность"
    - "конфиденциальная информация"
    - "персональные данные"
    - "налоговые обязательства"

  preferred_unit_types:
    - "general_provision"
    - "obligation"

  excluded_unit_types:
    - "technical_fragment"
    - "appendix_reference"
    - "structural_anchor"

  preferred_clause_functions:
    - "limitations"
    - "limitations"

  position_bias:
    preferred_range: [0.0, 1.0]
    boost: 0.10
    scope: "segment"

  rerank: true
  filters: {}

conditional: null

enrichment_hints:
  preferred_segment_types:
    - "contract"
    - "amendment"
    - "annex"
  excluded_segment_types:
    - "technical_specification"
    - "price_list"
    - "invoice"
    - "act"
    - "schedule"
  confidence_bonus_on_match: 0.10
  confidence_penalty_on_excluded_segment: 0.15

extraction:
  enabled: true
  mode: "hybrid"
  llm_max_tokens: 700

  llm_prompt_extraction: |
    <role>
    Ты — юрист по коммерческим договорам и исключениям из ответственности.
    Твоя задача — точно извлечь:
    1) исключена ли ответственность за indirect / consequential damages;
    2) исключена ли ответственность за loss of profit / business / revenue;
    3) в чью пользу работают исключения.

    КРИТИЧЕСКИ ВАЖНО:
    - Извлекай ТОЛЬКО то, что прямо написано в тексте.
    - НЕ додумывай симметричность или односторонность исключений.
    - НЕ смешивай этот check с cap / basket / carve-out
      и не подменяй его общим анализом indemnity.
    - Если из фрагментов нельзя уверенно сделать вывод —
      ставь "unclear".
    </role>

    <context>
    Ниже приведены релевантные фрагменты договора:

    {context}
    </context>

    <context_rules>
    - Некоторые фрагменты могут быть нерелевантны — игнорируй их.
    - Если фрагменты противоречат друг другу — используй "unclear"
      и объясни это в reason.
    - Используй "no" только если из релевантного блока ответственности
      видно, что соответствующее исключение не предусмотрено.
    - Если релевантной информации недостаточно — используй "unclear".
    - Не используй рыночные предположения о стандартности таких исключений.
    </context_rules>

    <task>
    Заполни только следующие поля:
    - exclusions_display
    - excludes_indirect_or_consequential
    - excludes_loss_of_profit
    - exclusions_beneficiary
    - reason
    </task>

    <instructions>
    Шаг 1 — ИСКЛЮЧЕНИЕ КОСВЕННЫХ УБЫТКОВ

    Заполни "excludes_indirect_or_consequential".

    Значения:
    - "yes" — явно исключены indirect, consequential,
      special, punitive, incidental или аналогичные damages.
    - "no" — такого исключения нет по тексту.
    - "unclear" — нельзя определить.

    Шаг 2 — ИСКЛЮЧЕНИЕ УПУЩЕННОЙ ВЫГОДЫ И ПОХОЖИХ КАТЕГОРИЙ

    Заполни "excludes_loss_of_profit".

    Значения:
    - "yes" — явно исключены loss of profit, loss of business,
      loss of revenue, anticipated savings, goodwill и т.п.
    - "no" — такого исключения нет по тексту.
    - "unclear" — нельзя определить.

    Шаг 3 — НАПРАВЛЕННОСТЬ ИСКЛЮЧЕНИЙ

    Заполни "exclusions_beneficiary".

    Значения:
    - "mutual" — исключения работают симметрично для обеих сторон.
    - "counterparty" — исключения преимущественно защищают контрагента.
    - "target" — исключения преимущественно защищают Target.
    - "unclear" — нельзя определить.

    Шаг 4 — НОРМАЛИЗОВАННЫЙ DISPLAY ДЛЯ DD GRID

    Заполни "exclusions_display".

    Это итоговое поле для таблицы.
    Строй его ТОЛЬКО на основе уже заполненных полей выше.
    Не добавляй информацию сверх них.

    Возможные состояния:
    1. Исключения установлены:
       "Симметричное исключение indirect и loss of profit"
       "Исключение loss of profit в пользу контрагента"
       "Исключение indirect damages в пользу Target"
    2. Исключений нет:
       "Исключений из ответственности не обнаружено"
    3. Не удалось определить:
       "Не удалось определить исключения из ответственности"

    Правила:
    - Если excludes_indirect_or_consequential = "no"
      и excludes_loss_of_profit = "no":
      "Исключений из ответственности не обнаружено"
    - Если все поля unclear:
      "Не удалось определить исключения из ответственности"
    - Если есть исключения:
      * если оба поля = "yes":
        - "Исключение indirect и loss of profit"
      * если только excludes_indirect_or_consequential = "yes":
        - "Исключение indirect damages"
      * если только excludes_loss_of_profit = "yes":
        - "Исключение loss of profit"
      * если exclusions_beneficiary определён и не unclear —
        добавь:
        - "симметричное"
        - "в пользу контрагента"
        - "в пользу Target"
    - Не более 3 коротких фактов.

    Шаг 5 — ОБОСНОВАНИЕ

    Заполни "reason".

    Правила:
    - Первое предложение — краткий вывод.
    - Второе — короткая цитата из текста (до 100 символов).
    - Пиши по-русски.
    </instructions>

    <edge_cases>
    - "Neither party shall be liable for indirect":
      * excludes_indirect_or_consequential = "yes"
      * exclusions_beneficiary = "mutual"

    - Исключение только loss of profit в пользу контрагента:
      * excludes_loss_of_profit = "yes"
      * exclusions_beneficiary = "counterparty"

    - Исключения отсутствуют:
      * excludes_indirect_or_consequential = "no"
      * excludes_loss_of_profit = "no"
      * exclusions_display = "Исключений из ответственности не обнаружено"

    - Нет релевантных фрагментов:
      * excludes_indirect_or_consequential = "unclear"
      * excludes_loss_of_profit = "unclear"
      * exclusions_beneficiary = "unclear"
      * exclusions_display =
        "Не удалось определить исключения из ответственности"
    </edge_cases>

    <output_expectations>
    - Верни результат строго в формате JSON.
    - Не оборачивай ответ в markdown-блоки.
    - Не добавляй комментариев вне JSON.
    - Для полей с allowed_values используй строго значения из списка.
    - Свободные текстовые поля (exclusions_display, reason)
      заполняй на русском языке.
    - Не добавляй никаких полей, кроме указанных.

    Пример структуры ответа:
    {
      "exclusions_display": "Симметричное исключение indirect и loss of profit",
      "excludes_indirect_or_consequential": "yes",
      "excludes_loss_of_profit": "yes",
      "exclusions_beneficiary": "mutual",
      "reason": "..."
    }
    </output_expectations>

  fields:
    - name: "exclusions_display"
      type: "string"
      presentation: "fact"
      label: "Исключения из ответственности"
      description: "Нормализованный user-facing вывод для DD Grid"
      display_in_grid: true
      display_priority: 1

    - name: "excludes_indirect_or_consequential"
      type: "string"
      presentation: "signal"
      description: "Исключение indirect / consequential damages"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
      display_in_grid: false

    - name: "excludes_loss_of_profit"
      type: "string"
      presentation: "signal"
      description: "Исключение loss of profit / business"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
      display_in_grid: false

    - name: "exclusions_beneficiary"
      type: "string"
      presentation: "signal"
      description: "В чью пользу работают исключения"
      allowed_values:
        - "mutual"
        - "counterparty"
        - "target"
        - "unclear"
      display_in_grid: false

    - name: "reason"
      type: "string"
      presentation: "diagnostic"
      description: "Обоснование"
      display_in_grid: false

  store_payload: true


