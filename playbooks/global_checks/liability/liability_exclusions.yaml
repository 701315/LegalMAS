id: "liability_exclusions"
name: "Исключения из ответственности (indirect, loss of profit)"
description: >
  Анализирует исключения из ответственности: indirect, consequential,
  punitive, loss of profit, loss of business, и их реальное влияние
  на риск-профиль Target.

doc_types: []

severity: "medium"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"

rules:
  keywords:
    - "косвенные убытки"
    - "опосредованные убытки"
    - "последующие убытки"
    - "indirect damages"
    - "consequential damages"
    - "special damages"
    - "punitive damages"
    - "loss of profit"
    - "упущенная выгода"
    - "loss of business"
    - "loss of revenue"
  keyword_mode: "any"
  regex_patterns: []
  clause_patterns: []

llm:
  prompt_template: |
    <role>
    Ты — юрист по коммерческим контрактам.
    Твоя специализация — ограничения и исключения договорной ответственности
    (indirect / consequential loss, loss of profit и т.п.).
    </role>

    <context>
    Ниже приведены фрагменты договора с положениями об исключениях из ответственности:

    {context}
    </context>

    <instructions>
    Определи:

    1) Какие виды убытков исключены:
       - косвенные, опосредованные, consequential, special, punitive damages и т.п.
       Отрази это в excludes_indirect_or_consequential: yes / no / unclear.

    2) Исключена ли ответственность за упущенную выгоду и смежные категории:
       - loss of profit, loss of business, loss of revenue, loss of anticipated savings
         и аналогичные формулировки.
       Отрази это в excludes_loss_of_profit_or_business: yes / no / unclear.

    3) Оцени общий риск для Target в контексте профиля бизнеса:
       - учитывай, что для некоторых моделей (SaaS, маркетплейс, дистрибуция,
         сервисы с высокой зависимостью от простоя) непрямые потери и упущенная
         выгода могут составлять значимую часть ущерба;
       - смотри, есть ли иные механизмы смягчения (страхование, специальные
         компенсации, сервис-кредиты и т.п. — если они явно видны во фрагментах).

       На основе этого оцени overall_risk_level: low / medium / high.
    </instructions>

    <edge_cases>
    ВАЖНО — пограничные случаи:

    — Стандартная оговорка "no liability for indirect, consequential or special damages":
      обычно означает excludes_indirect_or_consequential = "yes".
      Если loss of profit прямо не упомянута, но косвенно включена в список
      consequential damages, это укажи в reason, но флаг loss_of_profit оцени
      по прямому тексту.

    — Формулировки "including but not limited to loss of profit, loss of business,
      loss of revenue" часто означают, что упущенная выгода и потеря бизнеса
      прямо исключены:
      excludes_loss_of_profit_or_business = "yes",
      риск может быть "high", если Target критично зависит от этих показателей.

    — Если исключения сформулированы симметрично, но при этом у Target меньше
      рычагов перераспределить риск (например, он покупатель в зависимости от
      критичного сервиса):
      это укажи в reason и можешь оценить риск как "medium" вместо "low".

    — Если текст фрагментарный и непонятно, что именно исключено:
      используй "unclear" для соответствующих полей и объясни в reason,
      что не хватает формулировок.

    — Пустые или нерелевантные фрагменты:
      большинство полей = "unclear",
      overall_risk_level = "medium",
      reason = "Недостаточно данных для анализа исключений из ответственности (indirect/loss of profit)."
    </edge_cases>

    <examples>
    ПРИМЕР 1 — ШИРОКОЕ ИСКЛЮЧЕНИЕ, ВКЛЮЧАЯ LOSS OF PROFIT (HIGH):

    Фрагмент: "Ни при каких обстоятельствах ни одна из Сторон не несет
    ответственности за любые косвенные, опосредованные, специальные или
    последующие убытки, включая, помимо прочего, loss of profit, loss of
    business и loss of revenue."

    {{
      "excludes_indirect_or_consequential": "yes",
      "excludes_loss_of_profit_or_business": "yes",
      "overall_risk_level": "high",
      "reason": "Исключены indirect/consequential убытки и прямо указаны loss of profit, loss of business и loss of revenue, что может не покрывать основной экономический ущерб Target."
    }}

    ПРИМЕР 2 — ИСКЛЮЧЕНЫ ТОЛЬКО КОСВЕННЫЕ УБЫТКИ, БЕЗ ПРЯМОГО LOSS OF PROFIT (MEDIUM):

    Фрагмент: "Стороны освобождаются от ответственности за любые косвенные
    (consequential) убытки. Настоящее ограничение не применяется к прямым
    убыткам Покупателя."

    {{
      "excludes_indirect_or_consequential": "yes",
      "excludes_loss_of_profit_or_business": "unclear",
      "overall_risk_level": "medium",
      "reason": "Прямо исключены consequential убытки, но loss of profit не упомянута; риск зависит от того, насколько значимы для Target именно косвенные потери."
    }}

    ПРИМЕР 3 — НЕТ ЯВНЫХ ИСКЛЮЧЕНИЙ (LOW):

    Фрагмент: "Сторона, нарушившая обязательства, обязана возместить другой
    Стороне причиненные убытки в полном объеме в соответствии с применимым правом."

    {{
      "excludes_indirect_or_consequential": "no",
      "excludes_loss_of_profit_or_business": "no",
      "overall_risk_level": "low",
      "reason": "Отсутствуют договорные исключения косвенных убытков и упущенной выгоды; применяются общие правила возмещения убытков."
    }}
    </examples>

    <output_format>
    Твой ответ ДОЛЖЕН быть строго валидным JSON-объектом со следующими
    полями:

    {{
      "excludes_indirect_or_consequential": "one of: yes | no | unclear",
      "excludes_loss_of_profit_or_business": "one of: yes | no | unclear",
      "overall_risk_level": "one of: low | medium | high",
      "reason": "string — краткое объяснение на русском с указанием ключевых формулировок и оценки влияния исключений на риск для Target"
    }}

    Все перечисленные поля ДОЛЖНЫ присутствовать в JSON, даже если их значение равно null.
    </output_format>

    <constraints>
    ЖЁСТКИЕ ПРАВИЛА:
    1. Выведи ТОЛЬКО один JSON-объект. Никакого текста до или после.
    2. Не пиши "Вот JSON", "Here is the JSON" и т.п.
    3. Не используй Markdown, бэктики ``` или любые обёртки.
    4. Все строки — в двойных кавычках.
    5. Значения перечислимых полей — СТРОГО из указанных вариантов.
    6. Ключи — точно как указано, без добавления новых.
    7. Поле "reason" ДОЛЖНО содержать конкретные формулировки из фрагментов
       и оценку их влияния на риск, а не общие фразы вроде "есть риски".
    8. Начни ответ сразу с символа {{
    9. Если по какому‑то полю нет достаточно информации в тексте —
       верни для него 'unclear' или null (для reason пустое значение
       недопустимо — нужно объяснение). НЕ придумывай значения, не интерполируй.
    </constraints>
  prompt_file: null
  context_k: 3
  temperature: 0.0
  max_tokens: 384

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 400

retrieval:
  context_k: 3
  max_chunks: 6
  boost_keywords:
    - "indirect damages"
    - "consequential damages"
    - "упущенная выгода"
    - "loss of profit"
  rerank: true
  filters: {}

conditional: null

extraction:
  enabled: true
  mode: "hybrid"
  fields:
    - name: "excludes_indirect_or_consequential"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
    - name: "excludes_loss_of_profit_or_business"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
    - name: "overall_risk_level"
      type: "string"
      allowed_values:
        - "low"
        - "medium"
        - "high"
    - name: "reason"
      type: "string"
  store_payload: true

red_flags:
  items:
    - code: "LIAB5"
      description: "Исключена ответственность за loss of profit/loss of business при бизнес-модели, завязанной на такие показатели."
      