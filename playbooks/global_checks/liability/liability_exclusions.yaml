id: "liability_exclusions"
name: "Исключения из ответственности (indirect, loss of profit)"
description: >
  Анализирует исключения из ответственности: indirect, consequential,
  special, punitive damages, loss of profit, loss of business,
  loss of revenue.

  Оценивает, в чью пользу работают исключения (симметричные или
  односторонние), и их реальное влияние на риск-профиль Target
  с учётом бизнес-модели.

  Формирует краткий user-facing вывод.

  Верхнеуровневый анализ объёма ответственности и indemnity
  выполняется чеком liability_and_indemnity_scope.
  Анализ структуры caps / basket / carve-out выполняется чеком
  liability_caps_and_baskets.

doc_types: []

severity: "medium"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"
ui_mode: "field_extraction"

rules:
  keyword_mode: any

  keywords:
    high:
      # Прямые исключения indirect/consequential
      - "(?i)shall\\s+not\\s+be\\s+liable\\s+for[\\s\\S]{0,40}(indirect|consequential|special|punitive)"
      - "(?i)exclud(e|es|ed|ing)[\\s\\S]{0,30}(indirect|consequential|special|punitive)\\s+damages"
      - "(?i)neither\\s+party[\\s\\S]{0,40}liable\\s+for[\\s\\S]{0,40}(indirect|consequential)"
      - "(?i)не\\s+(несёт|несет)\\s+ответственност[ьи]\\s+за[\\s\\S]{0,40}(косвенн|опосредованн|последующ)"
      - "(?i)исключ[а-я]+\\s+ответственность\\s+за[\\s\\S]{0,40}(косвенн|опосредованн)"

      # Прямые исключения loss of profit/business
      - "(?i)shall\\s+not\\s+be\\s+liable\\s+for[\\s\\S]{0,40}loss\\s+of\\s+(profit|business|revenue)"
      - "(?i)exclud(e|es|ed|ing)[\\s\\S]{0,30}loss\\s+of\\s+(profit|business|revenue)"
      - "(?i)including[\\s\\S]{0,20}loss\\s+of\\s+(profit|business|revenue|anticipated\\s+savings)"
      - "(?i)не\\s+(несёт|несет)\\s+ответственност[ьи]\\s+за[\\s\\S]{0,40}упущенн[а-я]+\\s+выгод"
      - "(?i)не\\s+возмеща[ею]тся[\\s\\S]{0,30}упущенн[а-я]+\\s+выгод"

    medium:
      # Категории убытков — упоминания
      - "(?i)indirect\\s+damages?"
      - "(?i)consequential\\s+damages?"
      - "(?i)special\\s+damages?"
      - "(?i)punitive\\s+damages?"
      - "(?i)incidental\\s+damages?"
      - "(?i)косвенн[а-я]+\\s+убытк[иов]"
      - "(?i)опосредованн[а-я]+\\s+убытк[иов]"

      # Loss of profit/business — упоминания
      - "(?i)loss\\s+of\\s+profit"
      - "(?i)lost\\s+profit"
      - "(?i)loss\\s+of\\s+business"
      - "(?i)loss\\s+of\\s+revenue"
      - "(?i)loss\\s+of\\s+anticipated\\s+savings"
      - "(?i)loss\\s+of\\s+goodwill"
      - "(?i)упущенн[а-я]+\\s+выгод[аыу]"
      - "(?i)потер[яию]\\s+дохода"
      - "(?i)потер[яию]\\s+прибыл[ьи]"
      - "(?i)недополученн[а-я]+\\s+(доход|прибыль|выручка)"

      # Симметричность
      - "(?i)neither\\s+party"
      - "(?i)each\\s+party"
      - "(?i)ни\\s+одна\\s+из\\s+сторон"
      - "(?i)обе\\s+стороны"

    low:
      - "(?i)indirect\\s+damages?"
      - "(?i)consequential\\s+damages?"
      - "(?i)loss\\s+of\\s+profit"
      - "(?i)lost\\s+profit"
      - "(?i)упущенн[а-я]+\\s+выгод"
      - "(?i)neither\\s+party\\s+shall\\s+be\\s+liable"
      - "(?i)exclud[a-z]+\\s+indirect"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 640

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  context_k: 5
  max_chunks: 10
  boost_keywords:
    - "shall not be liable for indirect"
    - "shall not be liable for consequential"
    - "excludes indirect damages"
    - "excludes consequential damages"
    - "indirect damages"
    - "consequential damages"
    - "special damages"
    - "punitive damages"
    - "loss of profit"
    - "lost profit"
    - "loss of business"
    - "loss of revenue"
    - "loss of anticipated savings"
    - "упущенная выгода"
    - "косвенные убытки"
    - "потеря дохода"
    - "недополученная прибыль"
    - "neither party shall be liable"
    - "ни одна из сторон не несёт ответственности"
  rerank: true
  filters: {}

conditional: null

enrichment_hints:
  preferred_segment_types:
    - "contract"
    - "amendment"
    - "annex"
  excluded_segment_types:
    - "technical_specification"
    - "price_list"
    - "invoice"
    - "act"
    - "schedule"
  preferred_clause_functions:
    - "liability"
    - "limitation_of_liability"
  confidence_bonus_on_match: 0.10
  confidence_penalty_on_excluded_segment: 0.15

extraction:
  enabled: true
  mode: "hybrid"
  llm_max_tokens: 400
  llm_prompt_extraction: |
    <role>
    Ты — юрист по коммерческим контрактам.
    Твоя задача — точно извлечь из текста:
    1) исключена ли ответственность за indirect / consequential damages;
    2) исключена ли ответственность за loss of profit / business;
    3) в чью пользу работают исключения.
    </role>

    <context>
    Ниже приведены релевантные фрагменты договора:

    {context}
    </context>

    <task>
    Заполни только следующие поля:
    - exclusions_display
    - excludes_indirect_or_consequential
    - excludes_loss_of_profit
    - exclusions_beneficiary
    - red_flags
    - reason

    Важно:
    - не анализируй caps / basket / carve-out —
      это задача чека liability_caps_and_baskets;
    - не анализируй общий объём indemnity —
      это задача чека liability_and_indemnity_scope;
    - пиши user-facing значения коротко и по-русски.
    </task>

    <instructions>
    Шаг 1 — ИСКЛЮЧЕНИЕ КОСВЕННЫХ / ПОСЛЕДУЮЩИХ УБЫТКОВ

    Заполни поле "excludes_indirect_or_consequential".

    Значения:
    - "yes" — явно исключены:
      indirect, consequential, special, punitive,
      incidental, exemplary damages.
    - "no" — исключения нет, ответственность за эти
      категории сохранена.
    - "unclear" — неясно.

    Шаг 2 — ИСКЛЮЧЕНИЕ УПУЩЕННОЙ ВЫГОДЫ И ПОТЕРИ БИЗНЕСА

    Заполни поле "excludes_loss_of_profit".

    Значения:
    - "yes" — явно исключены (в том числе в перечне
      "including but not limited to"):
      loss of profit, loss of business, loss of revenue,
      loss of anticipated savings, loss of goodwill.
    - "no" — исключения нет.
    - "unclear" — неясно.

    Шаг 3 — НАПРАВЛЕННОСТЬ ИСКЛЮЧЕНИЙ

    Заполни поле "exclusions_beneficiary".

    Значения:
    - "mutual" — симметрично ("neither party shall be liable").
    - "counterparty" — преимущественно защищает контрагента
      (Target несёт ответственность, контрагент нет).
    - "target" — преимущественно защищает Target.
    - "unclear" — невозможно определить.

    Шаг 4 — RED FLAGS

    Заполни поле "red_flags".

    Используй:
    - "NONE" — исключения симметричные и разумные, или
      отсутствуют вообще (при ограниченной ответственности).
    - "UNCLEAR" — данных недостаточно.
    - Коды через запятую:
      * LIAB8 — исключена ответственность за loss of profit /
        loss of business в пользу контрагента (но не Target)
        при бизнес-модели, критично зависящей от выручки /
        непрерывности сервиса.
      * LIAB9 — асимметричные исключения indirect /
        consequential: контрагент защищён, Target нет.

    Шаг 5 — USER-FACING SUMMARY

    Заполни поле "exclusions_display".

    Примеры:
    - "Симметричное исключение indirect и loss of profit"
    - "Контрагент исключил loss of profit; Target не защищена"
    - "Target исключила indirect damages; loss of profit сохранена"
    - "Исключений из ответственности не обнаружено"
    - "Не удалось определить исключения из ответственности"

    Правила:
    - Отрази максимум 2–3 факта через ";".
    - Явно указывай в чью пользу если асимметрия.
    - Если нет исключений:
      "Исключений из ответственности не обнаружено"
    - Если всё unclear:
      "Не удалось определить исключения из ответственности"

    Шаг 6 — ОБОСНОВАНИЕ

    Заполни поле "reason".

    Правила:
    - 1–2 коротких предложения.
    - Укажи: какие категории исключены, в чью пользу,
      почему выставлены red_flags.
    - Приведи короткую цитату в кавычках.
    - Если NONE — почему исключения приемлемы.
    </instructions>

    <edge_cases>
    - "Neither party shall be liable for indirect, consequential
       or special damages":
      * excludes_indirect_or_consequential = "yes"
      * exclusions_beneficiary = "mutual"
      * red_flags = "NONE" (если контекст нормальный)

    - "Including but not limited to loss of profit, loss of business"
      только для Provider (контрагента):
      * excludes_loss_of_profit = "yes"
      * exclusions_beneficiary = "counterparty"
      * если Target критично зависит от сервиса:
        red_flags включает "LIAB8"

    - Симметричное исключение, но Target = покупатель
      критичного SaaS:
      * exclusions_beneficiary = "mutual"
      * в reason: контекст повышает фактический риск
      * red_flags = "NONE" или "LIAB8" по бизнес-контексту

    - Исключения только для контрагента, Target подвержена
      indirect claims:
      * exclusions_beneficiary = "counterparty"
      * red_flags включает "LIAB9"

    - Нет упоминаний исключений:
      * excludes_indirect_or_consequential = "no"
      * excludes_loss_of_profit = "no"
      * red_flags = "NONE"
      * exclusions_display =
        "Исключений из ответственности не обнаружено"

    - Нет релевантных фрагментов:
      * все поля = "unclear"
      * red_flags = "UNCLEAR"
      * exclusions_display =
        "Не удалось определить исключения из ответственности"
    </edge_cases>

    <output_expectations>
    Все значения должны быть короткими, точными и пригодными
    для отображения пользователю в DD Grid.
    Не добавляй никаких полей, кроме указанных в схеме extraction.
    </output_expectations>

  fields:
    - name: "exclusions_display"
      type: "string"
      description: "Исключения из ответственности: краткий вывод"

    - name: "excludes_indirect_or_consequential"
      type: "string"
      description: "Исключение indirect / consequential damages"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "excludes_loss_of_profit"
      type: "string"
      description: "Исключение loss of profit / business"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "exclusions_beneficiary"
      type: "string"
      description: "В чью пользу работают исключения"
      allowed_values:
        - "mutual"
        - "counterparty"
        - "target"
        - "unclear"

    - name: "red_flags"
      type: "string"
      description: "Коды рисков"

    - name: "reason"
      type: "string"
      description: "Обоснование"

  store_payload: true

      