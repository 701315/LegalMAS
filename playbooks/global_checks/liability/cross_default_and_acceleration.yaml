id: "cross_default_and_acceleration"
name: "Cross-default и cross-acceleration"
group: "Liability"
description: >
  Анализирует положения о cross-default / cross-acceleration:
  дефолт или акселерация по другим договорам / обязательствам
  как основание для дефолта или досрочного погашения по данному
  договору.

  Оценивает охват (scope): охватывают ли условия только финансовые
  обязательства или любые договоры; наличие порогового значения
  (threshold); grace period / cure period; автоматичность триггера.

  Формирует краткий user-facing вывод и оценивает общий риск
  цепной реакции дефолтов для Target.

  Наличие cross-default как ковенанта также фиксируется
  чеком financial_covenants. Данный check анализирует механику
  и риски детально.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"
ui_mode: "field_extraction"

rules:
  keyword_mode: any

  keywords:
    high:
      # Cross-default — прямые термины
      - "(?i)cross[-\\s]?default"
      - "(?i)кросс[-\\s]?дефолт"
      - "(?i)дефолт\\s+по\\s+(другим|иным)\\s+обязательствам"
      - "(?i)event\\s+of\\s+default\\s+under\\s+any\\s+other\\s+agreement"
      - "(?i)событие\\s+дефолта\\s+по\\s+(любому|иному|другому)\\s+договору"
      - "(?i)default\\s+under\\s+any\\s+other\\s+(loan|credit|finance|indebtedness)"

      # Cross-acceleration — прямые термины
      - "(?i)cross[-\\s]?acceleration"
      - "(?i)кросс[-\\s]?акселерация"
      - "(?i)досрочн[а-я]+\\s+(истребовани[ея]|погашени[ея])\\s+по\\s+(другим|иным)"
      - "(?i)acceleration\\s+of\\s+(any\\s+other|indebtedness|obligations)"

      # Широкий охват без порога
      - "(?i)any\\s+default\\s+under\\s+any\\s+(agreement|obligation|indebtedness)"
      - "(?i)любо[ей]\\s+(нарушени[ея]|дефолт[ае])\\s+по\\s+любому\\s+договору"

    medium:
      # Акселерация — общие
      - "(?i)acceleration\\s+of\\s+(debt|indebtedness|obligations)"
      - "(?i)declare[sd]?\\s+(all|the)\\s+(loans?|amounts?)\\s+(immediately\\s+)?due"
      - "(?i)досрочн[а-я]+\\s+(погашени[ея]|истребовани[ея])[\\s\\S]{0,30}(другим|иным|перекрёстн)"

      # Пороговые значения
      - "(?i)threshold\\s+amount[\\s\\S]{0,30}(default|cross)"
      - "(?i)пороговая\\s+сумм[аы][\\s\\S]{0,30}(дефолт|кросс)"
      - "(?i)aggregate\\s+amount\\s+(exceed|in\\s+excess)[\\s\\S]{0,30}(default|obligation)"
      - "(?i)совокупн[а-я]+\\s+сумм[аы]\\s+(превышает|более)[\\s\\S]{0,30}(дефолт|обязательств)"

      # Event of Default
      - "(?i)event\\s+of\\s+default"
      - "(?i)событие\\s+дефолта"

      # Grace period / cure period
      - "(?i)grace\\s+period[\\s\\S]{0,30}(default|cross)"
      - "(?i)cure\\s+period[\\s\\S]{0,30}(default|cross)"
      - "(?i)льготн[а-я]+\\s+период[\\s\\S]{0,30}(дефолт|кросс)"

    low:
      - "(?i)cross[-\\s]?default"
      - "(?i)cross[-\\s]?acceleration"
      - "(?i)кросс[-\\s]?дефолт"
      - "(?i)event\\s+of\\s+default\\s+under\\s+any\\s+other"
      - "(?i)acceleration\\s+of\\s+indebtedness"
      - "(?i)threshold\\s+amount"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 640

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  retrieval_profile: "event_of_default_check"
  context_k: 5
  max_chunks: 10

  retrieval_query: >
    кросс-дефолт cross-default кросс-акселерация досрочное погашение 
    дефолт по другим обязательствам threshold grace period

  boost_keywords:
    - "cross-default"
    - "cross default"
    - "cross-acceleration"
    - "cross acceleration"
    - "кросс-дефолт"
    - "кросс-акселерация"
    - "event of default under any other agreement"
    - "default under any other loan"
    - "default under any other indebtedness"
    - "событие дефолта по любому договору"
    - "дефолт по другим обязательствам"
    - "acceleration of indebtedness"
    - "досрочное погашение по другим"
    - "threshold amount"
    - "пороговая сумма"
    - "grace period"
    - "cure period"
    - "any default under any agreement"
    - "любой дефолт по любому договору"

  negative_keywords:
    - "интеллектуальная собственность"
    - "авторские права"
    - "коммерческая тайна"
    - "персональные данные"

  preferred_unit_types:
    - "general_provision"
    - "obligation"
    
  excluded_unit_types:
    - "technical_fragment"
    - "appendix_reference"

  preferred_clause_functions:
    - "procedures"
    - "remedies"
    - "obligations"

  position_bias:
    preferred_range: [0.0, 1.0]
    boost: 0.10
    scope: "segment"

  rerank: true
  filters: {}

conditional: null

enrichment_hints:
  preferred_segment_types:
    - "contract"
    - "amendment"
    - "annex"
  excluded_segment_types:
    - "technical_specification"
    - "price_list"
    - "invoice"
    - "act"
    - "schedule"
  confidence_bonus_on_match: 0.10
  confidence_penalty_on_excluded_segment: 0.15

extraction:
  enabled: true
  mode: "hybrid"
  llm_max_tokens: 1050

  llm_prompt_extraction: |
    <role>
    Ты — юрист по финансированию и договорным дефолтным механизмам.
    Твоя задача — точно извлечь из текста:
    1) есть ли cross-default;
    2) есть ли cross-acceleration;
    3) каков scope, threshold, grace period и механизм триггера.

    КРИТИЧЕСКИ ВАЖНО:
    - Извлекай ТОЛЬКО то, что прямо написано в тексте.
    - Чётко различай cross-default
      (триггер = факт дефолта по другому обязательству)
      и cross-acceleration
      (триггер = досрочное предъявление / акселерация другого долга).
    - НЕ додумывай threshold, grace period или scope, если они не указаны.
    - Если формулировка неоднозначна — ставь "unclear".
    - Если фрагменты не позволяют надёжно установить отсутствие положения,
      не ставь "no" по умолчанию — ставь "unclear".
    </role>

    <context>
    Ниже приведены релевантные фрагменты договора:

    {context}
    </context>

    <context_rules>
    - Некоторые фрагменты могут быть нерелевантны — игнорируй их.
    - Если фрагменты противоречат друг другу — используй "unclear"
      и кратко объясни это в reason.
    - Используй "no" только если из текста прямо следует отсутствие
      такого механизма или если релевантный блок событий дефолта
      раскрыт достаточно полно и cross-default / cross-acceleration
      там не предусмотрены.
    - Если нет релевантной информации по существу — используй "unclear".
    - Не опирайся на общие рыночные ожидания или типовые практики.
    </context_rules>

    <task>
    Заполни только следующие поля:
    - cross_default_display
    - has_cross_default
    - has_cross_acceleration
    - cross_default_scope
    - has_threshold
    - threshold_value
    - has_grace_period
    - trigger_mechanism
    - reason
    </task>

    <instructions>
    Шаг 1 — НАЛИЧИЕ CROSS-DEFAULT

    Заполни "has_cross_default".

    Значения:
    - "yes" — дефолт / нарушение по другим договорам или обязательствам
      прямо указан как триггер по данному договору.
    - "no" — такой механизм отсутствует по тексту.
    - "unclear" — нельзя надёжно определить.

    Шаг 2 — НАЛИЧИЕ CROSS-ACCELERATION

    Заполни "has_cross_acceleration".

    Значения:
    - "yes" — акселерация / досрочное истребование другого долга
      прямо указаны как триггер по данному договору.
    - "no" — такой механизм отсутствует по тексту.
    - "unclear" — нельзя надёжно определить.

    Шаг 3 — ОХВАТ

    Заполни "cross_default_scope".

    Значения:
    - "financial_only" — только финансовые обязательства / debt / loans.
    - "any_obligation" — любые обязательства / любые договоры.
    - "specified" — только конкретно перечисленные категории.
    - "not_applicable" — ни cross-default, ни cross-acceleration нет.
    - "unclear" — нельзя определить.

    Шаг 4 — ПОРОГОВОЕ ЗНАЧЕНИЕ

    Заполни "has_threshold" и "threshold_value".

    Значения для has_threshold:
    - "yes" — порог прямо указан.
    - "no" — механизм есть, но порог не установлен;
      либо механизмов нет и threshold неприменим.
    - "unclear" — нельзя определить.

    Правила для threshold_value:
    - Если порог указан: "USD 1M", "RUB 50M", "5% от активов"
    - Если механизм есть, но порог не установлен: "Не установлен"
    - Если ни cross-default, ни cross-acceleration нет: "Не применимо"
    - Если нельзя определить: "Не удалось определить"

    Шаг 5 — GRACE PERIOD / CURE PERIOD

    Заполни "has_grace_period".

    Значения:
    - "yes" — есть grace period / cure period до срабатывания.
    - "no" — нет.
    - "unclear" — нельзя определить.

    Шаг 6 — МЕХАНИЗМ ТРИГГЕРА

    Заполни "trigger_mechanism".

    Значения:
    - "automatic" — срабатывает автоматически по факту условия.
    - "declaratory" — требует уведомления, объявления,
      требования или иной формальной активации.
    - "not_applicable" — ни cross-default, ни cross-acceleration нет.
    - "unclear" — нельзя определить.

    Шаг 7 — НОРМАЛИЗОВАННЫЙ DISPLAY ДЛЯ DD GRID

    Заполни "cross_default_display".

    Это итоговое поле для таблицы.
    Строй его ТОЛЬКО на основе уже заполненных полей выше.
    Не добавляй информацию сверх них.

    Возможные состояния:
    1. Есть конкретный механизм:
       "Cross-default: любые обязательства; threshold не установлен; нет grace period"
       "Cross-acceleration: только финансовые; threshold USD 1M"
    2. Механизмов нет:
       "Cross-default и cross-acceleration не обнаружены"
    3. Не удалось определить:
       "Не удалось определить наличие cross-default"

    Правила:
    - Если has_cross_default = "no" и has_cross_acceleration = "no":
      "Cross-default и cross-acceleration не обнаружены"
    - Если оба поля "unclear" и остальное не определено:
      "Не удалось определить наличие cross-default"
    - Если есть один или оба механизма:
      * сначала укажи тип:
        - "Cross-default"
        - "Cross-acceleration"
        - "Cross-default и cross-acceleration"
      * затем scope, если он определён
      * затем threshold, если он определён или не установлен
      * затем отсутствие grace period, если это значимо
    - Не более 4 коротких фактов через ";".

    Шаг 8 — ОБОСНОВАНИЕ

    Заполни "reason".

    Правила:
    - Первое предложение — краткий вывод.
    - Второе предложение — короткая цитата из текста
      (до 100 символов).
    - Пиши по-русски.
    </instructions>

    <edge_cases>
    - "Any default under any agreement" без threshold:
      * has_cross_default = "yes"
      * cross_default_scope = "any_obligation"
      * has_threshold = "no"
      * threshold_value = "Не установлен"

    - Только акселерация другого долга как триггер:
      * has_cross_default = "no"
      * has_cross_acceleration = "yes"

    - Механизмов нет:
      * has_cross_default = "no"
      * has_cross_acceleration = "no"
      * cross_default_scope = "not_applicable"
      * threshold_value = "Не применимо"
      * trigger_mechanism = "not_applicable"
      * cross_default_display =
        "Cross-default и cross-acceleration не обнаружены"

    - Нет релевантных фрагментов:
      * has_cross_default = "unclear"
      * has_cross_acceleration = "unclear"
      * cross_default_scope = "unclear"
      * has_threshold = "unclear"
      * threshold_value = "Не удалось определить"
      * has_grace_period = "unclear"
      * trigger_mechanism = "unclear"
      * cross_default_display =
        "Не удалось определить наличие cross-default"
    </edge_cases>

    <output_expectations>
    - Верни результат строго в формате JSON.
    - Не оборачивай ответ в markdown-блоки.
    - Не добавляй комментариев вне JSON.
    - Для полей с allowed_values используй строго значения из списка.
    - Свободные текстовые поля
      (cross_default_display, threshold_value, reason)
      заполняй на русском языке.
    - Не добавляй никаких полей, кроме указанных.

    Пример структуры ответа:
    {
      "cross_default_display": "Cross-default: только финансовые; threshold USD 1M",
      "has_cross_default": "yes",
      "has_cross_acceleration": "no",
      "cross_default_scope": "financial_only",
      "has_threshold": "yes",
      "threshold_value": "USD 1M",
      "has_grace_period": "no",
      "trigger_mechanism": "automatic",
      "reason": "..."
    }
    </output_expectations>

  fields:
    - name: "cross_default_display"
      type: "string"
      presentation: "fact"
      label: "Cross-default / cross-acceleration"
      description: "Нормализованный user-facing вывод для DD Grid"
      display_in_grid: true
      display_priority: 1

    - name: "has_cross_default"
      type: "string"
      presentation: "signal"
      description: "Наличие cross-default"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
      display_in_grid: false

    - name: "has_cross_acceleration"
      type: "string"
      presentation: "signal"
      description: "Наличие cross-acceleration"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
      display_in_grid: false

    - name: "cross_default_scope"
      type: "string"
      presentation: "signal"
      description: "Охват cross-default"
      allowed_values:
        - "financial_only"
        - "any_obligation"
        - "specified"
        - "not_applicable"
        - "unclear"
      display_in_grid: false

    - name: "has_threshold"
      type: "string"
      presentation: "signal"
      description: "Пороговое значение"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
      display_in_grid: false

    - name: "threshold_value"
      type: "string"
      presentation: "fact"
      label: "Пороговое значение"
      description: "Размер порогового значения"
      display_in_grid: true
      display_priority: 2

    - name: "has_grace_period"
      type: "string"
      presentation: "signal"
      description: "Grace period / cure period"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
      display_in_grid: false

    - name: "trigger_mechanism"
      type: "string"
      presentation: "signal"
      description: "Механизм триггера"
      allowed_values:
        - "automatic"
        - "declaratory"
        - "not_applicable"
        - "unclear"
      display_in_grid: false

    - name: "reason"
      type: "string"
      presentation: "diagnostic"
      description: "Обоснование"
      display_in_grid: false

  store_payload: true


  
