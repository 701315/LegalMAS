id: "cross_default_and_acceleration"
name: "Cross-default и cross-acceleration"
description: >
  Анализирует положения о cross-default/cross-acceleration: дефолт по
  другим договорам/обязательствам как основание для дефолта или
  акселерации по данному договору.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"

rules:
  keywords:
    - "cross-default"
    - "cross default"
    - "cross-acceleration"
    - "cross acceleration"
    - "дефолт по другим обязательствам"
    - "defaut по иным договорам"
    - "event of default under any other agreement"
    - "событие дефолта по любому договору"
    - "acceleration"
    - "досрочное взыскание"
    - "досрочное погашение"
  keyword_mode: "any"
  regex_patterns: []
  clause_patterns: []

llm:
  prompt_template: |
    <role>
    Ты — юрист по финансированию и M&A.
    Твоя специализация — кредитные договоры, события дефолта и кросс-ковенанты
    (cross-default, cross-acceleration).
    </role>

    <context>
    Ниже приведены фрагменты договора с возможными положениями о cross-default
    и cross-acceleration:

    {context}
    </context>

    <instructions>
    Проведи анализ по шагам. Каждый шаг логически связан с одним или
    несколькими полями итоговой оценки.

    Шаг 1 — НАЛИЧИЕ CROSS-DEFAULT
    (используется для "has_cross_default"):
    - Определи, предусмотрены ли условия, при которых:
      * дефолт или нарушение по другим договорам/обязательствам Заёмщика
        (включая кредиты, облигации, гарантии, иные финансовые соглашения)
        считается событием дефолта по данному договору.
    - Зафиксируй, есть ли прямая привязка к "event of default under any other agreement"
      или аналогичным формулировкам.
    - Сформулируй вывод: yes / no / unclear.

    Шаг 2 — НАЛИЧИЕ CROSS-ACCELERATION
    (используется для "has_cross_acceleration"):
    - Определи, есть ли механизмы, при которых:
      * акселерация (объявление долга досрочно подлежащим погашению) по другим
        обязательствам Заёмщика даёт право кредитору:
        - требовать досрочного погашения по данному договору,
        - или считать событие дефолта наступившим по этому договору.
    - Отличай:
      * cross-default (сам факт дефолта по другому договору как триггер);
      * cross-acceleration (триггер — именно акселерация другого долга).
    - Сформулируй вывод: yes / no / unclear.

    Шаг 3 — ОПИСАНИЕ ОХВАТА (SCOPE)
    (используется для "scope_description"):
    - Опиши, какие обязательства попадают под cross-default/cross-acceleration:
      * все обязательства или только финансовые (loans, bonds, guarantees);
      * только существенные (по сумме, с threshold);
      * только обязательства перед определённой группой кредиторов/по конкретным документам.
    - Отметь:
      * пороговые значения (threshold amount);
      * наличие grace period;
      * исключения и carve-outs.
    - Кратко зафиксируй широту и параметры охвата.

    Шаг 4 — ОБЩИЙ РИСК ЦЕПНОЙ РЕАКЦИИ
    (используется для "overall_risk_level" и "reason"):
    - Оцени, насколько положения cross-default/cross-acceleration усиливают риск для Target:
      * могут ли локальные нарушения по одному договору запустить цепную реакцию дефолтов;
      * насколько широк охват (любые договоры vs. только крупные финансовые, с порогом);
      * есть ли автоматический триггер или требуется решение/уведомление кредитора.
    - Сформулируй общий уровень риска как low / medium / high.
    - В "reason" кратко обоснуй вывод, ссылаясь на ключевые формулировки
      (желательно с короткими цитатами) и пояснив, как именно cross-default/cross-acceleration
      может повлиять на Target и её долговую структуру.
    </instructions>

    <edge_cases>
    Обрабатывай пограничные ситуации так:

    - Формулировка охватывает «любые обязательства» или «любой дефолт по любому договору»
      без порога:
      рассматривай это как очень широкий охват и повышенный риск потенциальной цепной
      реакции дефолтов.

    - Cross-default ограничен:
      * только финансовыми обязательствами;
      * только обязательствами выше определённого порога (threshold);
      * только после истечения grace period или формального объявления дефолта;
      учитывай, что это смягчает, но не устраняет риск.

    - Упоминается только acceleration других обязательств как триггер для досрочного
      погашения по данному договору:
      фиксируй наличие cross-acceleration, даже если cross-default прямо не прописан.

    - В тексте нет прямых формулировок cross-default/cross-acceleration, но есть общая
      оговорка о «существенном ухудшении финансового состояния»:
      не признавай это самостоятельно cross-default, но можешь отметить, что дефолт
      по другим договорам может рассматриваться как фактор ухудшения, не меняя
      значения полей has_cross_default / has_cross_acceleration.

    - Пустые или явно нерелевантные фрагменты:
      укажи, что данных недостаточно для анализа положений о cross-default и
      cross-acceleration, и поясни, как это влияет на неопределённость и оценку риска.
    </edge_cases>

    <output_expectations>
    На основе твоего анализа отдельный механизм извлечения сформирует
    структурированные поля по заранее заданной схеме. Твоя задача —
    давать чёткие юридические выводы и указывать конкретные формулировки
    из текста, на которых они основаны.
    </output_expectations>
  prompt_file: null
  context_k: 4
  temperature: 0.0
  max_tokens: 512

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 500

retrieval:
  context_k: 4
  max_chunks: 8
  boost_keywords:
    - "cross-default"
    - "cross-acceleration"
    - "событие дефолта по любому договору"
    - "acceleration"
  rerank: true
  filters: {}

conditional: null

extraction:
  enabled: true
  mode: "hybrid"
  fields:
    - name: "has_cross_default"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "has_cross_acceleration"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "scope_description"
      type: "string"

    - name: "overall_risk_level"
      type: "string"
      allowed_values:
        - "low"
        - "medium"
        - "high"

    - name: "reason"
      type: "string"

  store_payload: true

red_flags:
  items:
    - code: "LIAB6"
      description: "Cross-default охватывает практически любые обязательства, создавая риск цепной реакции дефолтов."
    - code: "LIAB7"
      description: "Жёсткий cross-acceleration, который может активироваться из-за локального нарушения по другому договору."
