id: "cross_default_and_acceleration"
name: "Cross-default и cross-acceleration"
description: >
  Анализирует положения о cross-default / cross-acceleration:
  дефолт или акселерация по другим договорам / обязательствам
  как основание для дефолта или досрочного погашения по данному
  договору.

  Оценивает охват (scope): охватывают ли условия только финансовые
  обязательства или любые договоры; наличие порогового значения
  (threshold); grace period / cure period; автоматичность триггера.

  Формирует краткий user-facing вывод и оценивает общий риск
  цепной реакции дефолтов для Target.

  Наличие cross-default как ковенанта также фиксируется
  чеком financial_covenants. Данный check анализирует механику
  и риски детально.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"
ui_mode: "field_extraction"

rules:
  keyword_mode: any

  keywords:
    high:
      # Cross-default — прямые термины
      - "(?i)cross[-\\s]?default"
      - "(?i)кросс[-\\s]?дефолт"
      - "(?i)дефолт\\s+по\\s+(другим|иным)\\s+обязательствам"
      - "(?i)event\\s+of\\s+default\\s+under\\s+any\\s+other\\s+agreement"
      - "(?i)событие\\s+дефолта\\s+по\\s+(любому|иному|другому)\\s+договору"
      - "(?i)default\\s+under\\s+any\\s+other\\s+(loan|credit|finance|indebtedness)"

      # Cross-acceleration — прямые термины
      - "(?i)cross[-\\s]?acceleration"
      - "(?i)кросс[-\\s]?акселерация"
      - "(?i)досрочн[а-я]+\\s+(истребовани[ея]|погашени[ея])\\s+по\\s+(другим|иным)"
      - "(?i)acceleration\\s+of\\s+(any\\s+other|indebtedness|obligations)"

      # Широкий охват без порога
      - "(?i)any\\s+default\\s+under\\s+any\\s+(agreement|obligation|indebtedness)"
      - "(?i)любо[ей]\\s+(нарушени[ея]|дефолт[ае])\\s+по\\s+любому\\s+договору"

    medium:
      # Акселерация — общие
      - "(?i)acceleration\\s+of\\s+(debt|indebtedness|obligations)"
      - "(?i)declare[sd]?\\s+(all|the)\\s+(loans?|amounts?)\\s+(immediately\\s+)?due"
      - "(?i)досрочн[а-я]+\\s+(погашени[ея]|истребовани[ея])[\\s\\S]{0,30}(другим|иным|перекрёстн)"

      # Пороговые значения
      - "(?i)threshold\\s+amount[\\s\\S]{0,30}(default|cross)"
      - "(?i)пороговая\\s+сумм[аы][\\s\\S]{0,30}(дефолт|кросс)"
      - "(?i)aggregate\\s+amount\\s+(exceed|in\\s+excess)[\\s\\S]{0,30}(default|obligation)"
      - "(?i)совокупн[а-я]+\\s+сумм[аы]\\s+(превышает|более)[\\s\\S]{0,30}(дефолт|обязательств)"

      # Event of Default
      - "(?i)event\\s+of\\s+default"
      - "(?i)событие\\s+дефолта"

      # Grace period / cure period
      - "(?i)grace\\s+period[\\s\\S]{0,30}(default|cross)"
      - "(?i)cure\\s+period[\\s\\S]{0,30}(default|cross)"
      - "(?i)льготн[а-я]+\\s+период[\\s\\S]{0,30}(дефолт|кросс)"

    low:
      - "(?i)cross[-\\s]?default"
      - "(?i)cross[-\\s]?acceleration"
      - "(?i)кросс[-\\s]?дефолт"
      - "(?i)event\\s+of\\s+default\\s+under\\s+any\\s+other"
      - "(?i)acceleration\\s+of\\s+indebtedness"
      - "(?i)threshold\\s+amount"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 640

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  context_k: 5
  max_chunks: 10
  boost_keywords:
    - "cross-default"
    - "cross default"
    - "cross-acceleration"
    - "cross acceleration"
    - "кросс-дефолт"
    - "кросс-акселерация"
    - "event of default under any other agreement"
    - "default under any other loan"
    - "default under any other indebtedness"
    - "событие дефолта по любому договору"
    - "дефолт по другим обязательствам"
    - "acceleration of indebtedness"
    - "досрочное погашение по другим"
    - "threshold amount"
    - "пороговая сумма"
    - "grace period"
    - "cure period"
    - "any default under any agreement"
    - "любой дефолт по любому договору"
  rerank: true
  filters: {}

conditional: null

enrichment_hints:
  preferred_segment_types:
    - "contract"
    - "amendment"
    - "annex"
  excluded_segment_types:
    - "technical_specification"
    - "price_list"
    - "invoice"
    - "act"
    - "schedule"
  preferred_clause_functions:
    - "liability"
    - "termination"
    - "governing_law"
  confidence_bonus_on_match: 0.10
  confidence_penalty_on_excluded_segment: 0.15

extraction:
  enabled: true
  mode: "hybrid"
  llm_max_tokens: 420
  llm_prompt_extraction: |
    <role>
    Ты — юрист по финансированию и кредитным договорам.
    Твоя задача — точно извлечь из текста:
    1) есть ли cross-default;
    2) есть ли cross-acceleration;
    3) каков охват (scope) — только финансовые обязательства
       или любые;
    4) есть ли пороговое значение (threshold);
    5) есть ли grace period / cure period.
    </role>

    <context>
    Ниже приведены релевантные фрагменты договора:

    {context}
    </context>

    <task>
    Заполни только следующие поля:
    - cross_default_display
    - has_cross_default
    - has_cross_acceleration
    - cross_default_scope
    - has_threshold
    - threshold_value
    - has_grace_period
    - trigger_mechanism
    - red_flags
    - reason

    Важно:
    - чётко различай cross-default (триггер: факт дефолта)
      и cross-acceleration (триггер: именно акселерация долга);
    - не придумывай пороги если они не указаны;
    - пиши user-facing значения коротко и по-русски.
    </task>

    <instructions>
    Шаг 1 — НАЛИЧИЕ CROSS-DEFAULT

    Заполни поле "has_cross_default".

    Значения:
    - "yes" — дефолт или нарушение по другим договорам /
      обязательствам = событие дефолта по данному договору.
    - "no" — не предусмотрено.
    - "unclear" — формулировки допускают двойное толкование.

    Шаг 2 — НАЛИЧИЕ CROSS-ACCELERATION

    Заполни поле "has_cross_acceleration".

    Значения:
    - "yes" — акселерация (досрочное истребование) другого долга
      = право требовать досрочного погашения по данному договору.
    - "no" — не предусмотрено.
    - "unclear" — неясно, идёт речь о cross-default
      или cross-acceleration.

    Шаг 3 — ОХВАТ (SCOPE)

    Заполни поле "cross_default_scope".

    Значения:
    - "financial_only" — только финансовые обязательства
      (кредиты, облигации, лизинг, гарантии).
    - "any_obligation" — любые обязательства / любые договоры.
    - "specified" — конкретно перечисленные виды обязательств.
    - "not_applicable" — ни cross-default, ни cross-acceleration нет.
    - "unclear" — неясно.

    Шаг 4 — ПОРОГОВОЕ ЗНАЧЕНИЕ

    Заполни поля "has_threshold" и "threshold_value".

    Значения для has_threshold:
    - "yes" — есть threshold amount.
    - "no" — нет порогового значения.
    - "unclear" — неясно.

    Для threshold_value:
    - Если указан: "USD 1M", "5% от активов", "RUB 50M"
    - Если нет: "Не установлен"
    - Если неясно: "Не удалось определить"

    Шаг 5 — GRACE PERIOD / CURE PERIOD

    Заполни поле "has_grace_period".

    Значения:
    - "yes" — есть grace / cure period.
    - "no" — нарушение = немедленный триггер.
    - "unclear" — неясно.

    Шаг 6 — МЕХАНИЗМ ТРИГГЕРА

    Заполни поле "trigger_mechanism".

    Значения:
    - "automatic" — триггер срабатывает автоматически.
    - "declaratory" — требует формального объявления
      дефолта кредитором.
    - "not_applicable" — нет cross-default / cross-acceleration.
    - "unclear" — неясно.

    Шаг 7 — RED FLAGS

    Заполни поле "red_flags".

    Используй:
    - "NONE" — если существенных риск-факторов нет:
      ограничено финансовыми обязательствами, есть threshold,
      есть grace period, требует формального объявления.
    - "UNCLEAR" — если данных недостаточно.
    - Коды через запятую:
      * XD1 — cross-default охватывает практически любые
        обязательства / любые договоры без порогового значения:
        высокий риск цепной реакции дефолтов.
      * XD2 — жёсткий cross-acceleration: автоматический триггер,
        нет grace period, возможен при любом объёме задолженности.

    Шаг 8 — USER-FACING SUMMARY

    Заполни поле "cross_default_display".

    Примеры:
    - "Cross-default: любые обязательства; нет threshold;
       нет grace period"
    - "Cross-default: только финансовые; threshold USD 1M;
       grace period 30 дней"
    - "Cross-acceleration: автоматический; нет порога"
    - "Cross-default и cross-acceleration не обнаружены"
    - "Не удалось определить наличие cross-default"

    Правила:
    - Отрази максимум 3 ключевых факта через ";".
    - Если нет ни cross-default, ни cross-acceleration:
      "Cross-default и cross-acceleration не обнаружены"
    - Если всё unclear:
      "Не удалось определить наличие cross-default"

    Шаг 9 — ОБОСНОВАНИЕ

    Заполни поле "reason".

    Правила:
    - 1–2 коротких предложения.
    - Укажи: есть ли cross-default / acceleration, охват, threshold,
      grace period, механизм, почему выставлены red_flags.
    - Приведи короткую цитату в кавычках.
    - Если NONE — почему риск цепной реакции ограничен.
    </instructions>

    <edge_cases>
    - "Any default under any agreement" без threshold:
      * cross_default_scope = "any_obligation"
      * has_threshold = "no"
      * red_flags = "XD1"

    - Только финансовые обязательства, threshold USD 1M,
      grace period 30 дней, declaratory:
      * cross_default_scope = "financial_only"
      * has_threshold = "yes"
      * has_grace_period = "yes"
      * trigger_mechanism = "declaratory"
      * red_flags = "NONE"

    - Только акселерация другого долга как триггер:
      * has_cross_default = "no" или "unclear"
      * has_cross_acceleration = "yes"

    - "Существенное ухудшение финансового состояния"
      без прямой привязки к дефолту по другим договорам:
      * has_cross_default = "no" или "unclear"
      * в reason: потенциальный фактор, не cross-default

    - Cross-acceleration без grace period, автоматический:
      * trigger_mechanism = "automatic"
      * has_grace_period = "no"
      * red_flags = "XD2"

    - Нет релевантных фрагментов:
      * has_cross_default = "unclear"
      * has_cross_acceleration = "unclear"
      * red_flags = "UNCLEAR"
      * cross_default_display =
        "Не удалось определить наличие cross-default"
    </edge_cases>

    <output_expectations>
    Все значения должны быть короткими, точными и пригодными
    для отображения пользователю в DD Grid.
    Не добавляй никаких полей, кроме указанных в схеме extraction.
    </output_expectations>

  fields:
    - name: "cross_default_display"
      type: "string"
      description: "Cross-default / cross-acceleration: краткий вывод"

    - name: "has_cross_default"
      type: "string"
      description: "Наличие cross-default"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "has_cross_acceleration"
      type: "string"
      description: "Наличие cross-acceleration"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "cross_default_scope"
      type: "string"
      description: "Охват cross-default"
      allowed_values:
        - "financial_only"
        - "any_obligation"
        - "specified"
        - "not_applicable"
        - "unclear"

    - name: "has_threshold"
      type: "string"
      description: "Пороговое значение"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "threshold_value"
      type: "string"
      description: "Размер порогового значения"

    - name: "has_grace_period"
      type: "string"
      description: "Grace period / cure period"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "trigger_mechanism"
      type: "string"
      description: "Механизм триггера"
      allowed_values:
        - "automatic"
        - "declaratory"
        - "not_applicable"
        - "unclear"

    - name: "red_flags"
      type: "string"
      description: "Коды рисков"

    - name: "reason"
      type: "string"
      description: "Обоснование"

  store_payload: true

  

