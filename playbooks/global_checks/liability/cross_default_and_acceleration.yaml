id: "cross_default_and_acceleration"
name: "Cross-default и cross-acceleration"
description: >
  Анализирует положения о cross-default/cross-acceleration: дефолт по
  другим договорам/обязательствам как основание для дефолта или
  акселерации по данному договору.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"

rules:
  keywords:
    - "cross-default"
    - "cross default"
    - "cross-acceleration"
    - "cross acceleration"
    - "дефолт по другим обязательствам"
    - "defaut по иным договорам"
    - "event of default under any other agreement"
    - "событие дефолта по любому договору"
    - "acceleration"
    - "досрочное взыскание"
    - "досрочное погашение"
  keyword_mode: "any"
  regex_patterns: []
  clause_patterns: []

llm:
  prompt_template: |
    <role>
    Ты — юрист по финансированию и M&A.
    Твоя специализация — кредитные договоры, события дефолта и кросс-ковенанты
    (cross-default, cross-acceleration).
    </role>

    <context>
    Ниже приведены фрагменты договора с возможными положениями о cross-default
    и cross-acceleration:

    {context}
    </context>

    <instructions>
    Определи:

    1) Есть ли положения, при которых дефолт/нарушение по другим договорам
       или обязательствам (включая кредиты, облигации, гарантии) считается
       событием дефолта по данному договору (cross-default).
       Отрази это в has_cross_default: yes / no / unclear.

    2) Есть ли механизмы cross-acceleration:
       - право кредитора требовать досрочного погашения (acceleration) по данному
         договору, если по другим обязательствам уже произошла акселерация
         (то есть соответствующий долг был объявлен досрочно подлежащим погашению);
       - отличай cross-default (дефолт по другому договору как триггер) от
         cross-acceleration (ускорение текущего договора из-за ускорения других).
       Отрази это в has_cross_acceleration: yes / no / unclear.

    3) Насколько широкий охват таких положений (scope_description):
       - какие обязательства учитываются:
         * все обязательства,
         * только существенные (по сумме / threshold),
         * только финансовые (loans, bonds, guarantees),
         * только обязательства перед определённой группой кредиторов;
       - есть ли пороговые значения (threshold amount) и исключения.

       Кратко опиши это в scope_description.

    4) Насколько такие положения рискованны для Target:
       - оцени overall_risk_level: low / medium / high, исходя из:
         * широты охвата (любые договоры vs. только крупные финансовые),
         * наличия/отсутствия threshold,
         * того, запускается ли дефолт автоматически или по усмотрению кредитора,
         * вероятности «цепной реакции» дефолтов при единичном нарушении.
    </instructions>

    <edge_cases>
    ВАЖНО — пограничные случаи:

    — Если формулировка охватывает «любые обязательства» или «любой дефолт по
      любому договору» без порога:
      has_cross_default = "yes",
      scope_description опиши как широкий охват,
      overall_risk_level обычно не ниже "high" (обоснуй).

    — Если cross-default ограничен:
      * только финансовыми обязательствами;
      * только обязательствами выше определённого порога (threshold),
      * только после истечения grace period или формального объявления дефолта,
      риск может быть "medium" (опиши критерии в scope_description).

    — Если упоминается только acceleration других обязательств как триггер
      для досрочного погашения по данному договору:
      has_cross_acceleration = "yes",
      has_cross_default = "unclear" или "no" — в зависимости от текста.

    — Если в тексте нет прямых cross-default/cross-acceleration формулировок,
      но есть общая оговорка о "существенном ухудшении финансового состояния":
      has_cross_default = "no" (если нет прямой привязки к другим договорам),
      однако в reason можно указать, что дефолт по другим договорам может
      косвенно трактоваться как ухудшение состояния.

    — Пустые или нерелевантные фрагменты:
      большинство полей = "unclear" или пустые строки,
      overall_risk_level = "medium",
      reason = "Недостаточно данных для анализа положений о cross-default и cross-acceleration."
    </edge_cases>

    <examples>
    ПРИМЕР 1 — ШИРОКИЙ CROSS-DEFAULT, ВЫСОКИЙ РИСК:

    Фрагмент: "Событием Дефолта считается любое событие дефолта по
    любому иному кредитному договору или иному финансовому обязательству
    Заёмщика, в результате которого такой долг может быть объявлен
    подлежащим досрочному погашению."

    {{
      "has_cross_default": "yes",
      "has_cross_acceleration": "yes",
      "scope_description": "Любой дефолт по любому иному финансовому обязательству, позволяющий досрочно его погасить, считается событием дефолта по данному договору.",
      "overall_risk_level": "high",
      "reason": "Широкая формулировка cross-default/cross-acceleration по всем финансовым обязательствам создаёт риск цепной реакции дефолтов при нарушении по одному договору."
    }}

    ПРИМЕР 2 — ОГРАНИЧЕННЫЙ ПО THRESHOLD CROSS-ACCELERATION (MEDIUM):

    Фрагмент: "Если любые иные обязательства Заёмщика по кредитам в сумме
    более 10 000 000 единиц валюты подлежат досрочному погашению (acceleration),
    Кредитор вправе потребовать досрочного погашения настоящего Кредита."

    {{
      "has_cross_default": "unclear",
      "has_cross_acceleration": "yes",
      "scope_description": "Cross-acceleration применяется только при акселерации иных кредитов свыше порога 10 000 000.",
      "overall_risk_level": "medium",
      "reason": "Cross-acceleration ограничен крупными кредитами и наступает только при их акселерации, что снижает, но не устраняет риск цепной реакции."
    }}

    ПРИМЕР 3 — ОТСУТСТВИЕ ПРЯМОГО CROSS-DEFAULT (LOW):

    Фрагмент: "События Дефолта ограничиваются неисполнением обязательств
    по настоящему Договору, нарушением ковенант и несостоятельностью
    Заёмщика. Дефолт по иным договорам не является самостоятельным
    Событием Дефолта."

    {{
      "has_cross_default": "no",
      "has_cross_acceleration": "no",
      "scope_description": "События дефолта ограничены нарушениями по данному договору и несостоятельностью; cross-default не предусмотрен.",
      "overall_risk_level": "low",
      "reason": "Отсутствие cross-default/cross-acceleration снижает риск цепной реакции дефолтов между договорами."
    }}
    </examples>

    <output_format>
    Твой ответ ДОЛЖЕН быть строго валидным JSON-объектом со следующими
    полями:

    {{
      "has_cross_default": "one of: yes | no | unclear",
      "has_cross_acceleration": "one of: yes | no | unclear",
      "scope_description": "string — краткое описание охвата (какие обязательства и при каких условиях попадают под cross-default/cross-acceleration)",
      "overall_risk_level": "one of: low | medium | high",
      "reason": "string — краткое объяснение на русском с указанием ключевых формулировок и оценки риска цепной реакции дефолтов"
    }}

    Все перечисленные поля ДОЛЖНЫ присутствовать в JSON, даже если их значение равно null.
    </output_format>

    <constraints>
    ЖЁСТКИЕ ПРАВИЛА:
    1. Выведи ТОЛЬКО один JSON-объект. Никакого текста до или после.
    2. Не пиши "Вот JSON", "Here is the JSON" и т.п.
    3. Не используй Markdown, бэктики ``` или любые обёртки.
    4. Все строки — в двойных кавычках.
    5. Значения перечислимых полей — СТРОГО из указанных вариантов.
    6. Ключи — точно как указано, без добавления новых.
    7. Поле "reason" ДОЛЖНО содержать конкретные факты и формулировки
       из фрагментов, а не общие фразы вроде "есть риски".
    8. Начни ответ сразу с символа {{
    9. Если по какому‑то полю нет достаточно информации в тексте —
       верни для него 'unclear' или null (для reason пустое значение
       недопустимо — нужно объяснение). НЕ придумывай значения, не интерполируй.
    </constraints>
  prompt_file: null
  context_k: 4
  temperature: 0.0
  max_tokens: 512

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 500

retrieval:
  context_k: 4
  max_chunks: 8
  boost_keywords:
    - "cross-default"
    - "cross-acceleration"
    - "событие дефолта по любому договору"
    - "acceleration"
  rerank: true
  filters: {}

conditional: null

extraction:
  enabled: true
  mode: "hybrid"
  fields:
    - name: "has_cross_default"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
    - name: "has_cross_acceleration"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
    - name: "scope_description"
      type: "string"
    - name: "overall_risk_level"
      type: "string"
      allowed_values:
        - "low"
        - "medium"
        - "high"
    - name: "reason"
      type: "string"
  store_payload: true

red_flags:
  items:
    - code: "LIAB6"
      description: "Cross-default охватывает практически любые обязательства, создавая риск цепной реакции дефолтов."
    - code: "LIAB7"
      description: "Жёсткий cross-acceleration, который может активироваться из-за локального нарушения по другому договору."