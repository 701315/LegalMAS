id: "cross_default_and_acceleration"
name: "Cross-default и cross-acceleration"
group: "Liability"
description: >
  Анализирует положения о cross-default / cross-acceleration:
  дефолт или акселерация по другим договорам / обязательствам
  как основание для дефолта или досрочного погашения по данному
  договору.

  Оценивает охват (scope): охватывают ли условия только финансовые
  обязательства или любые договоры; наличие порогового значения
  (threshold); grace period / cure period; автоматичность триггера.

  Формирует краткий user-facing вывод и оценивает общий риск
  цепной реакции дефолтов для Target.

  Наличие cross-default как ковенанта также фиксируется
  чеком financial_covenants. Данный check анализирует механику
  и риски детально.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"
ui_mode: "field_extraction"

rules:
  keyword_mode: any

  keywords:
    high:
      # Cross-default — прямые термины
      - "(?i)cross[-\\s]?default"
      - "(?i)кросс[-\\s]?дефолт"
      - "(?i)дефолт\\s+по\\s+(другим|иным)\\s+обязательствам"
      - "(?i)event\\s+of\\s+default\\s+under\\s+any\\s+other\\s+agreement"
      - "(?i)событие\\s+дефолта\\s+по\\s+(любому|иному|другому)\\s+договору"
      - "(?i)default\\s+under\\s+any\\s+other\\s+(loan|credit|finance|indebtedness)"

      # Cross-acceleration — прямые термины
      - "(?i)cross[-\\s]?acceleration"
      - "(?i)кросс[-\\s]?акселерация"
      - "(?i)досрочн[а-я]+\\s+(истребовани[ея]|погашени[ея])\\s+по\\s+(другим|иным)"
      - "(?i)acceleration\\s+of\\s+(any\\s+other|indebtedness|obligations)"

      # Широкий охват без порога
      - "(?i)any\\s+default\\s+under\\s+any\\s+(agreement|obligation|indebtedness)"
      - "(?i)любо[ей]\\s+(нарушени[ея]|дефолт[ае])\\s+по\\s+любому\\s+договору"

    medium:
      # Акселерация — общие
      - "(?i)acceleration\\s+of\\s+(debt|indebtedness|obligations)"
      - "(?i)declare[sd]?\\s+(all|the)\\s+(loans?|amounts?)\\s+(immediately\\s+)?due"
      - "(?i)досрочн[а-я]+\\s+(погашени[ея]|истребовани[ея])[\\s\\S]{0,30}(другим|иным|перекрёстн)"

      # Пороговые значения
      - "(?i)threshold\\s+amount[\\s\\S]{0,30}(default|cross)"
      - "(?i)пороговая\\s+сумм[аы][\\s\\S]{0,30}(дефолт|кросс)"
      - "(?i)aggregate\\s+amount\\s+(exceed|in\\s+excess)[\\s\\S]{0,30}(default|obligation)"
      - "(?i)совокупн[а-я]+\\s+сумм[аы]\\s+(превышает|более)[\\s\\S]{0,30}(дефолт|обязательств)"

      # Event of Default
      - "(?i)event\\s+of\\s+default"
      - "(?i)событие\\s+дефолта"

      # Grace period / cure period
      - "(?i)grace\\s+period[\\s\\S]{0,30}(default|cross)"
      - "(?i)cure\\s+period[\\s\\S]{0,30}(default|cross)"
      - "(?i)льготн[а-я]+\\s+период[\\s\\S]{0,30}(дефолт|кросс)"

    low:
      - "(?i)cross[-\\s]?default"
      - "(?i)cross[-\\s]?acceleration"
      - "(?i)кросс[-\\s]?дефолт"
      - "(?i)event\\s+of\\s+default\\s+under\\s+any\\s+other"
      - "(?i)acceleration\\s+of\\s+indebtedness"
      - "(?i)threshold\\s+amount"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 640

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  retrieval_profile: "event_of_default_check"
  context_k: 5
  max_chunks: 10

  retrieval_query: >
    кросс-дефолт cross-default кросс-акселерация досрочное погашение 
    дефолт по другим обязательствам threshold grace period

  boost_keywords:
    - "cross-default"
    - "cross default"
    - "cross-acceleration"
    - "cross acceleration"
    - "кросс-дефолт"
    - "кросс-акселерация"
    - "event of default under any other agreement"
    - "default under any other loan"
    - "default under any other indebtedness"
    - "событие дефолта по любому договору"
    - "дефолт по другим обязательствам"
    - "acceleration of indebtedness"
    - "досрочное погашение по другим"
    - "threshold amount"
    - "пороговая сумма"
    - "grace period"
    - "cure period"
    - "any default under any agreement"
    - "любой дефолт по любому договору"

  negative_keywords:
    - "интеллектуальная собственность"
    - "авторские права"
    - "коммерческая тайна"
    - "персональные данные"

  preferred_unit_types:
    - "general_provision"
    - "obligation"

  excluded_unit_types:
    - "technical_fragment"
    - "appendix_reference"

  preferred_clause_functions:
    - "procedures"
    - "remedies"
    - "obligations"

  position_bias:
    preferred_range: [0.0, 1.0]
    boost: 0.10
    scope: "segment"

  rerank: true
  filters: {}

conditional: null

enrichment_hints:
  preferred_segment_types:
    - "contract"
    - "amendment"
    - "annex"
  excluded_segment_types:
    - "technical_specification"
    - "price_list"
    - "invoice"
    - "act"
    - "schedule"
  confidence_bonus_on_match: 0.10
  confidence_penalty_on_excluded_segment: 0.15

extraction:
  enabled: true
  mode: "hybrid"
  llm_max_tokens: 1250

  presence_signal:
    field: "cross_default_status"
    present_values: ["present"]
    missing_values: ["missing"]
    unclear_values: ["unclear"]

  llm_prompt_extraction: |
    <role>
    Ты — юрист по финансированию и договорным дефолтным механизмам.
    Твоя задача — точно извлечь из текста:
    1) есть ли в договоре раздел о событиях дефолта / cross-default;
    2) если есть — каковы условия:
       - наличие cross-default;
       - наличие cross-acceleration;
       - scope, threshold, grace period, механизм триггера.

    КРИТИЧЕСКИ ВАЖНО:
    - Извлекай ТОЛЬКО то, что прямо написано в тексте.
    - Чётко различай cross-default
      (триггер = факт дефолта по другому обязательству)
      и cross-acceleration
      (триггер = досрочное предъявление / акселерация другого долга).
    - НЕ додумывай threshold, grace period или scope, если они не указаны.
    - Если формулировка неоднозначна — ставь "unclear".
    - Если фрагменты не позволяют надёжно установить отсутствие положения,
      не ставь "no" по умолчанию — ставь "unclear".
    - Если раздел о событиях дефолта / cross-default в договоре
      отсутствует полностью — cross_default_status = "missing".
    - Если тексты по теме есть, но надёжный вывод сделать нельзя —
      cross_default_status = "unclear".
    </role>

    <context_rules>
    - Некоторые фрагменты могут быть нерелевантны — игнорируй их.
    - Если фрагменты противоречат друг другу — используй "unclear"
      и кратко объясни это в reason.
    - Используй "no" только если из текста прямо следует отсутствие
      такого механизма или если релевантный блок событий дефолта
      раскрыт достаточно полно и cross-default / cross-acceleration
      там не предусмотрены.
    - Если нет релевантной информации по существу — используй "unclear".
    - Не опирайся на общие рыночные ожидания или типовые практики.
    - Если ни один фрагмент не содержит информации о событиях дефолта /
      cross-default / cross-acceleration (нет упоминаний EoD / default /
      acceleration / threshold / grace period) —
      cross_default_status = "missing", location = null.
      Не использовать "unclear" при полном отсутствии релевантных
      фрагментов.
    </context_rules>

    <context>
    Ниже приведены релевантные фрагменты договора:

    {context}
    </context>

    <task>
    Заполни только следующие поля:
    - cross_default_display
    - cross_default_status
    - has_cross_default
    - has_cross_acceleration
    - cross_default_scope
    - has_threshold
    - threshold_value
    - has_grace_period
    - trigger_mechanism
    - reason
    </task>

    <location_instructions>
    Для каждого поля по возможности укажи location в формате:
    {"clause_ref": "п. 12.1", "page": 7, "quote": "дословная фраза из договора"}

    Правила:
    - clause_ref — короткая ссылка на пункт / раздел / статью именно в том
      виде, как она написана в договоре;
    - page — целое число страницы;
    - quote — дословная фраза из текста договора (НЕ пересказ, НЕ парафраз).
      Копируй её посимвольно, сохраняя формулировку и порядок слов.
      Оптимальная длина: 30–300 символов.
    - Для synthesized-полей (cross_default_display, reason)
      location ВСЕГДА null.
    - Для threshold_value — quote обязательна, если порог прямо указан.
    - Для cross_default_status = "missing" — location = null.
    - Для cross_default_status = "present" / "unclear" — quote
      с наиболее релевантной фразой договора (EoD / cross-default).
    - Для has_cross_default и has_cross_acceleration:
      * если значение = "yes" — quote с формулировкой cross-default /
        cross-acceleration;
      * если значение = "no" — quote ОБЯЗАТЕЛЬНА, если из текста
        прямо следует отсутствие (например, «Cross-default
        не применяется»), иначе location = null;
      * если значение = "unclear" — location = null или quote
        с противоречивой фразой.
    - Для cross_default_scope, has_threshold, has_grace_period,
      trigger_mechanism — quote с фразой-основанием для определённого
      значения; location = null при not_applicable / unclear.
    - Не выдумывай location или quote. Если дословную фразу определить
      нельзя — location = null.
    </location_instructions>

    <instructions>
    Шаг 0 — НАЛИЧИЕ РАЗДЕЛА О СОБЫТИЯХ ДЕФОЛТА

    Заполни "cross_default_status".

    Значения:
    - "present" — если хотя бы одно содержательное поле указывает
      на наличие информации по теме:
      * has_cross_default = "yes";
      * has_cross_acceleration = "yes";
      * cross_default_scope ∈ {"financial_only", "any_obligation",
        "specified"};
      * has_threshold = "yes";
      * has_grace_period = "yes";
      * trigger_mechanism ∈ {"automatic", "declaratory"};
      * ЛИБО любое поле = "no" / "not_applicable", но с заполненным
        location с прямой цитатой (см. RF3).
    - "missing" — если все содержательные поля =
      "no" / "not_applicable" БЕЗ цитат, ЛИБО фрагментов
      по теме нет вообще.
    - "unclear" — если все содержательные = "unclear" при наличии
      фрагментов, но невозможности вывода.

    Шаг 1 — НАЛИЧИЕ CROSS-DEFAULT

    Заполни "has_cross_default".

    Значения:
    - "yes" — дефолт / нарушение по другим договорам или обязательствам
      прямо указан как триггер по данному договору.
    - "no" — такой механизм отсутствует по тексту.
    - "unclear" — нельзя надёжно определить.

    Шаг 2 — НАЛИЧИЕ CROSS-ACCELERATION

    Заполни "has_cross_acceleration".

    Значения:
    - "yes" — акселерация / досрочное истребование другого долга
      прямо указаны как триггер по данному договору.
    - "no" — такой механизм отсутствует по тексту.
    - "unclear" — нельзя надёжно определить.

    Шаг 3 — ОХВАТ

    Заполни "cross_default_scope".

    Значения:
    - "financial_only" — только финансовые обязательства / debt / loans.
    - "any_obligation" — любые обязательства / любые договоры.
    - "specified" — только конкретно перечисленные категории.
    - "not_applicable" — ни cross-default, ни cross-acceleration нет.
    - "unclear" — нельзя определить.

    Шаг 4 — ПОРОГОВОЕ ЗНАЧЕНИЕ

    Заполни "has_threshold" и "threshold_value".

    Значения для has_threshold:
    - "yes" — порог прямо указан.
    - "no" — механизм есть, но порог не установлен;
      либо механизмов нет и threshold неприменим.
    - "unclear" — нельзя определить.

    Правила для threshold_value:
    - Если порог указан: "USD 1M", "RUB 50M", "5% от активов"
    - Если механизм есть, но порог не установлен: "Не установлен"
    - Если ни cross-default, ни cross-acceleration нет: "Не применимо"
    - Если нельзя определить: "Не удалось определить"

    Шаг 5 — GRACE PERIOD / CURE PERIOD

    Заполни "has_grace_period".

    Значения:
    - "yes" — есть grace period / cure period до срабатывания.
    - "no" — нет.
    - "unclear" — нельзя определить.

    Шаг 6 — МЕХАНИЗМ ТРИГГЕРА

    Заполни "trigger_mechanism".

    Значения:
    - "automatic" — срабатывает автоматически по факту условия.
    - "declaratory" — требует уведомления, объявления,
      требования или иной формальной активации.
    - "not_applicable" — ни cross-default, ни cross-acceleration нет.
    - "unclear" — нельзя определить.

    Шаг 7 — НОРМАЛИЗОВАННЫЙ DISPLAY ДЛЯ DD GRID

    Заполни "cross_default_display".

    Это итоговое поле для таблицы.
    Строй его ТОЛЬКО на основе уже заполненных полей выше.
    Не добавляй информацию сверх них.

    Правила:
    - Если cross_default_status = "missing":
      "Раздел о cross-default в договоре не обнаружен"
    - Если has_cross_default = "no" и has_cross_acceleration = "no":
      "Cross-default и cross-acceleration не обнаружены"
    - Если оба поля "unclear" и остальное не определено:
      "Не удалось определить наличие cross-default"
    - Если есть один или оба механизма:
      * сначала укажи тип:
        - "Cross-default"
        - "Cross-acceleration"
        - "Cross-default и cross-acceleration"
      * затем scope, если он определён
      * затем threshold, если он определён или не установлен
      * затем отсутствие grace period, если это значимо
    - Не более 4 коротких фактов через ";".

    Шаг 8 — ОБОСНОВАНИЕ

    Заполни "reason".

    Правила:
    - Первое предложение — краткий вывод.
    - Второе предложение — короткая цитата из текста
      (до 100 символов).
    - Пиши по-русски.
    </instructions>

    <edge_cases>
    - "Any default under any agreement" без threshold:
      * cross_default_status = "present"
      * has_cross_default = "yes"
      * cross_default_scope = "any_obligation"
      * has_threshold = "no"
      * threshold_value = "Не установлен"

    - Только акселерация другого долга как триггер:
      * cross_default_status = "present"
      * has_cross_default = "no"
      * has_cross_acceleration = "yes"

    - Механизмов нет, но раздел EoD раскрыт:
      * cross_default_status = "present"
      * has_cross_default = "no"
      * has_cross_acceleration = "no"
      * cross_default_scope = "not_applicable"
      * threshold_value = "Не применимо"
      * trigger_mechanism = "not_applicable"
      * cross_default_display =
        "Cross-default и cross-acceleration не обнаружены"

    - Договор прямо исключает cross-default:
      * cross_default_status = "present"
      * has_cross_default = "no"
      * location с прямой цитатой об исключении.

    - Нет релевантных фрагментов / раздел о событиях дефолта
      в договоре отсутствует:
      * cross_default_status = "missing"
      * has_cross_default = "no"
      * has_cross_acceleration = "no"
      * cross_default_scope = "not_applicable"
      * has_threshold = "no"
      * threshold_value = "Не применимо"
      * has_grace_period = "no"
      * trigger_mechanism = "not_applicable"
      * cross_default_display =
        "Раздел о cross-default в договоре не обнаружен"
      * location у всех полей = null.

    - Формулировки есть, но вывод невозможен:
      * cross_default_status = "unclear"
      * соответствующие поля = "unclear"
    </edge_cases>

    <output_expectations>
    - Верни результат строго в формате JSON.
    - Не оборачивай в markdown-блоки (без ```).
    - Не добавляй комментариев вне JSON.
    - Все значения полей с allowed_values — на английском.
    - Свободные текстовые поля (cross_default_display,
      threshold_value, reason) — на русском языке.
    - Не добавляй полей, кроме указанных.
    - Для каждого поля возвращай объект с ключами
      "value", "confidence", "location".

    Пример структуры ответа:
    {
      "cross_default_display": {"value": "Cross-default: только финансовые; threshold USD 1M", "confidence": 0.92, "location": null},
      "cross_default_status": {"value": "present", "confidence": 0.95, "location": {"clause_ref": "п. 14.1", "page": 8, "quote": "Любой дефолт по иным финансовым обязательствам Заёмщика на сумму свыше USD 1M является событием дефолта по настоящему Договору"}},
      "has_cross_default": {"value": "yes", "confidence": 0.95, "location": {"clause_ref": "п. 14.1", "page": 8, "quote": "Любой дефолт по иным финансовым обязательствам Заёмщика на сумму свыше USD 1M является событием дефолта"}},
      "has_cross_acceleration": {"value": "no", "confidence": 0.80, "location": null},
      "cross_default_scope": {"value": "financial_only", "confidence": 0.90, "location": {"clause_ref": "п. 14.1", "page": 8, "quote": "по иным финансовым обязательствам Заёмщика"}},
      "has_threshold": {"value": "yes", "confidence": 0.90, "location": {"clause_ref": "п. 14.1", "page": 8, "quote": "на сумму свыше USD 1M"}},
      "threshold_value": {"value": "USD 1M", "confidence": 0.95, "location": {"clause_ref": "п. 14.1", "page": 8, "quote": "на сумму свыше USD 1M"}},
      "has_grace_period": {"value": "no", "confidence": 0.75, "location": null},
      "trigger_mechanism": {"value": "automatic", "confidence": 0.85, "location": {"clause_ref": "п. 14.1", "page": 8, "quote": "является событием дефолта по настоящему Договору"}},
      "reason": {"value": "...", "confidence": 0.90, "location": null}
    }
    </output_expectations>

  fields:
    - name: "cross_default_display"
      type: "string"
      presentation: "fact"
      label: "Cross-default / cross-acceleration"
      description: "Нормализованный user-facing вывод для DD Grid"
      display_in_grid: true
      display_priority: 1

    - name: "cross_default_status"
      type: "string"
      presentation: "signal"
      risk_weight: "info"
      description: "Наличие регулирования cross-default / cross-acceleration в договоре"
      display_in_grid: false
      allowed_values:
        - "present"
        - "missing"
        - "unclear"

    - name: "has_cross_default"
      type: "string"
      presentation: "signal"
      risk_weight: "high"
      description: "Наличие cross-default"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
      display_in_grid: false

    - name: "has_cross_acceleration"
      type: "string"
      presentation: "signal"
      risk_weight: "high"
      description: "Наличие cross-acceleration"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
      display_in_grid: false

    - name: "cross_default_scope"
      type: "string"
      presentation: "signal"
      risk_weight: "high"
      description: "Охват cross-default"
      allowed_values:
        - "financial_only"
        - "any_obligation"
        - "specified"
        - "not_applicable"
        - "unclear"
      display_in_grid: false

