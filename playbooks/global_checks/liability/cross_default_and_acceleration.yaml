id: "cross_default_and_acceleration"
name: "Cross-default и cross-acceleration"
description: >
  Анализирует положения о cross-default/cross-acceleration: дефолт или
  акселерация по другим договорам/обязательствам как основание для дефолта
  или досрочного погашения по данному договору. Оценивает охват (scope),
  пороговые значения, grace periods, автоматичность триггера и общий риск
  цепной реакции дефолтов для Target.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"

rules:
  keyword_mode: any

  keywords:
    high:
      # Прямые термины cross-default
      - "(?i)cross[-\\s]?default"
      - "(?i)кросс[-\\s]?дефолт"
      - "(?i)дефолт\\s+по\\s+(другим|иным)\\s+обязательствам"
      - "(?i)event\\s+of\\s+default\\s+under\\s+any\\s+other\\s+agreement"
      - "(?i)событие\\s+дефолта\\s+по\\s+(любому|иному|другому)\\s+договору"
      - "(?i)default\\s+under\\s+any\\s+other\\s+(loan|credit|finance|indebtedness)"

      # Прямые термины cross-acceleration
      - "(?i)cross[-\\s]?acceleration"
      - "(?i)кросс[-\\s]?акселерация"
      - "(?i)досрочн[а-я]+\\s+(истребовани[ея]|погашени[ея]|взыскани[ея])\\s+по\\s+(другим|иным)"
      - "(?i)acceleration\\s+of\\s+(any\\s+other|indebtedness|obligations)"

      # Широкий охват без порога
      - "(?i)any\\s+default\\s+under\\s+any\\s+(agreement|obligation|indebtedness)"
      - "(?i)любо[ей]\\s+(нарушени[ея]|дефолт[ае])\\s+по\\s+любому\\s+договору"

    medium:
      # Acceleration / досрочное погашение (общие)
      - "(?i)acceleration\\s+of\\s+(debt|indebtedness|obligations)"
      - "(?i)accelerat(e|ed|ion)"
      - "(?i)досрочн[а-я]+\\s+(погашени[ея]|истребовани[ея]|взыскани[ея])"
      - "(?i)досрочн[а-я]+\\s+возврат"
      - "(?i)declare[sd]?\\s+(all|the)\\s+(loans?|amounts?)\\s+(immediately\\s+)?due"

      # Threshold / пороговые значения
      - "(?i)threshold\\s+amount"
      - "(?i)пороговая\\s+сумм[аы]"
      - "(?i)minimum\\s+amount"
      - "(?i)aggregate\\s+amount\\s+(exceed|in\\s+excess)"
      - "(?i)совокупн[а-я]+\\s+сумм[аы]\\s+(превышает|более)"

      # Дефолт / Event of Default (общий контекст)
      - "(?i)event\\s+of\\s+default"
      - "(?i)событие\\s+дефолта"
      - "(?i)случай\\s+неисполнени[яи]"

      # Grace period
      - "(?i)grace\\s+period"
      - "(?i)льготн[а-я]+\\s+период"
      - "(?i)период\\s+исправлени[яи]"
      - "(?i)cure\\s+period"

    low:
      # Общие ссылки на другие обязательства
      - "(?i)other\\s+(agreement|obligation|contract|indebtedness)"
      - "(?i)(другие|иные)\\s+(договор[ыа]|обязательств[аы]|соглашени[яи])"
      - "(?i)financial\\s+indebtedness"
      - "(?i)финансов[а-я]+\\s+обязательств[аы]"
      - "(?i)заёмн[а-я]+\\s+обязательств[аы]"

      # Общие ссылки на нарушения
      - "(?i)breach\\s+of\\s+(any\\s+)?other"
      - "(?i)нарушени[ея]\\s+(по\\s+)?(другим|иным)"
      - "(?i)default"
      - "(?i)дефолт"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 640

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  context_k: 5
  max_chunks: 10
  boost_keywords:
    - "cross-default"
    - "cross default"
    - "cross-acceleration"
    - "cross acceleration"
    - "кросс-дефолт"
    - "кросс-акселерация"
    - "event of default under any other agreement"
    - "default under any other loan"
    - "событие дефолта по любому договору"
    - "дефолт по другим обязательствам"
    - "acceleration of indebtedness"
    - "досрочное погашение по другим"
    - "досрочное истребование"
    - "threshold amount"
    - "пороговая сумма"
    - "grace period"
    - "cure period"
  rerank: true
  filters: {}

conditional: null

extraction:
  llm_prompt_extraction: |
    <role>
    Ты — юрист по финансированию, кредитным договорам и M&A.
    Твоя специализация — анализ событий дефолта и механизмов
    cross-default / cross-acceleration в кредитных, облигационных
    и иных финансовых соглашениях.
    </role>

    <context>
    Ниже приведены фрагменты договора с возможными положениями
    о cross-default и cross-acceleration:

    {context}
    </context>

    <instructions>
    Проведи анализ по шагам. Каждый шаг логически соответствует одному
    или нескольким полям итоговой оценки риска.

    Шаг 1 — НАЛИЧИЕ CROSS-DEFAULT
    (используется для заполнения поля "has_cross_default"):
    - Определи, предусмотрены ли условия, при которых дефолт или
      нарушение по другим договорам/обязательствам Заёмщика (включая
      кредиты, облигации, гарантии, иные финансовые соглашения)
      считается событием дефолта по данному договору.
    - Ищи формулировки типа "event of default under any other agreement",
      "default under any other indebtedness", "дефолт по другим
      обязательствам", "кросс-дефолт".
    - Если такие условия явно прописаны — вывод "yes".
    - Если их нет — вывод "no".
    - Если формулировки допускают двойное толкование (например,
      упоминается только «существенное ухудшение финансового состояния»
      без прямой привязки к дефолту по другим договорам) — вывод "unclear".

    Шаг 2 — НАЛИЧИЕ CROSS-ACCELERATION
    (используется для заполнения поля "has_cross_acceleration"):
    - Определи, есть ли механизмы, при которых акселерация (объявление
      долга досрочно подлежащим погашению) по другим обязательствам
      Заёмщика даёт право кредитору требовать досрочного погашения
      или считать наступившим событие дефолта по данному договору.
    - Чётко различай:
      * cross-default — триггер: сам факт дефолта по другому договору;
      * cross-acceleration — триггер: именно акселерация (досрочное
        истребование) другого долга.
    - Если cross-acceleration явно прописан — вывод "yes".
    - Если его нет — вывод "no".
    - Если из текста непонятно, идёт речь о cross-default или
      cross-acceleration — вывод "unclear" с пояснением в reason.

    Шаг 3 — RED FLAGS
    (используется для заполнения поля "red_flags"):
    - Оцени наличие следующих рисковых факторов:

      * «LIAB6» — Cross-default охватывает практически любые
        обязательства (не только финансовые), без порогового значения
        (threshold) или с символическим порогом, создавая высокий
        риск цепной реакции дефолтов. Признаки:
        - формулировки "any agreement", "any obligation",
          "любой договор", "любое обязательство";
        - отсутствие threshold amount;
        - отсутствие carve-outs для несущественных нарушений.

      * «LIAB7» — Жёсткий cross-acceleration, который может
        активироваться из-за локального или несущественного нарушения
        по другому договору. Признаки:
        - автоматический триггер (без дискреции кредитора);
        - отсутствие grace period / cure period;
        - акселерация возможна при любом объёме задолженности.

    - Если cross-default/cross-acceleration ограничены только
      финансовыми обязательствами, имеют разумный threshold,
      grace period и/или требуют формального решения кредитора —
      верни "NONE".
    - Если данных недостаточно для оценки охвата или текст
      противоречив — верни "UNCLEAR".
    - Формат: один или несколько кодов через запятую
      ("LIAB6", "LIAB7", "LIAB6, LIAB7"), "NONE" или "UNCLEAR".
      Без комментариев в этом поле — всё объясняющее в reason.

    Шаг 4 — ОБОСНОВАНИЕ
    (используется для заполнения поля "reason"):

    - В "reason" кратко обоснуй вывод:
      * ссылайся на ключевые формулировки (по возможности с короткими
        цитатами);
      * поясни, как cross-default/cross-acceleration может повлиять
        на Target и её долговую структуру;
      * если выставлены red_flags — объясни, почему именно эти коды.
    </instructions>

    <edge_cases>
    Обрабатывай пограничные ситуации так:

    - Формулировка охватывает «любые обязательства» или «любой дефолт
      по любому договору» без порога:
      рассматривай это как очень широкий охват и повышенный риск
      цепной реакции дефолтов; ставь "LIAB6".

    - Cross-default ограничен только финансовыми обязательствами,
      имеет threshold amount, grace period, требует формального
      объявления дефолта кредитором:
      учитывай, что это существенно смягчает риск; не ставь LIAB6,
      если ограничения реально действуют.

    - Упоминается только acceleration других обязательств как триггер
      для досрочного погашения по данному договору:
      фиксируй наличие cross-acceleration (has_cross_acceleration = "yes"),
      даже если cross-default прямо не прописан.

    - В тексте нет прямых формулировок cross-default/cross-acceleration,
      но есть общая оговорка о «существенном ухудшении финансового
      состояния» как событии дефолта:
      не признавай это самостоятельным cross-default; ставь
      has_cross_default = "no" (или "unclear", если формулировка
      косвенно охватывает дефолты по другим договорам). Можешь
      отметить это в reason как потенциальный фактор.

    - Cross-default прописан, но с исключением для оспариваемых
      (disputed/contested) обязательств:
      зафиксируй наличие carve-out в scope_description; это
      снижает риск, учти в overall_risk_level.

    - Cross-acceleration без grace period и с автоматическим
      триггером:
      ставь "LIAB7" и оцени overall_risk_level как "high",
      если нет иных смягчающих факторов.

    - Пустые или явно нерелевантные фрагменты:
      укажи, что данных недостаточно для анализа положений
      о cross-default и cross-acceleration. Поставь
      has_cross_default = "unclear", has_cross_acceleration = "unclear",
      red_flags = "UNCLEAR", overall_risk_level = "medium".
    </edge_cases>

    <output_expectations>
    На основе твоего анализа отдельный механизм извлечения сформирует
    структурированные поля по заранее заданной схеме. Твоя задача —
    давать чёткие юридические выводы и указывать конкретные формулировки
    из текста, на которых они основаны. Не генерируй JSON —
    просто излагай выводы структурированно и однозначно.
    </output_expectations>

  enabled: true
  mode: "hybrid"
  fields:
    - name: "has_cross_default"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "has_cross_acceleration"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "red_flags"
      type: "string"

    - name: "reason"
      type: "string"

  store_payload: true

red_flags:
  items:
    - code: "LIAB6"
      description: "Cross-default охватывает практически любые обязательства без порогового значения."
    - code: "LIAB7"
      description: "Жёсткий cross-acceleration без grace period и/или с автоматическим триггером."
