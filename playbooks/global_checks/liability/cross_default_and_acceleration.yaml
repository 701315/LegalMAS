id: "cross_default_and_acceleration"
name: "Cross-default и cross-acceleration"
group: "Liability"
description: >
  Анализирует положения о cross-default / cross-acceleration:
  дефолт или акселерация по другим договорам / обязательствам
  как основание для дефолта или досрочного погашения по данному
  договору.

  Оценивает охват (scope): охватывают ли условия только финансовые
  обязательства или любые договоры; наличие порогового значения
  (threshold); grace period / cure period; автоматичность триггера.

  Формирует краткий user-facing вывод и оценивает общий риск
  цепной реакции дефолтов для Target.

  Наличие cross-default как ковенанта также фиксируется
  чеком financial_covenants. Данный check анализирует механику
  и риски детально.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"
ui_mode: "field_extraction"

rules:
  keyword_mode: any

  keywords:
    high:
      # Cross-default — прямые термины
      - "(?i)cross[-\\s]?default"
      - "(?i)кросс[-\\s]?дефолт"
      - "(?i)дефолт\\s+по\\s+(другим|иным)\\s+обязательствам"
      - "(?i)event\\s+of\\s+default\\s+under\\s+any\\s+other\\s+agreement"
      - "(?i)событие\\s+дефолта\\s+по\\s+(любому|иному|другому)\\s+договору"
      - "(?i)default\\s+under\\s+any\\s+other\\s+(loan|credit|finance|indebtedness)"

      # Cross-acceleration — прямые термины
      - "(?i)cross[-\\s]?acceleration"
      - "(?i)кросс[-\\s]?акселерация"
      - "(?i)досрочн[а-я]+\\s+(истребовани[ея]|погашени[ея])\\s+по\\s+(другим|иным)"
      - "(?i)acceleration\\s+of\\s+(any\\s+other|indebtedness|obligations)"

      # Широкий охват без порога
      - "(?i)any\\s+default\\s+under\\s+any\\s+(agreement|obligation|indebtedness)"
      - "(?i)любо[ей]\\s+(нарушени[ея]|дефолт[ае])\\s+по\\s+любому\\s+договору"

    medium:
      # Акселерация — общие
      - "(?i)acceleration\\s+of\\s+(debt|indebtedness|obligations)"
      - "(?i)declare[sd]?\\s+(all|the)\\s+(loans?|amounts?)\\s+(immediately\\s+)?due"
      - "(?i)досрочн[а-я]+\\s+(погашени[ея]|истребовани[ея])[\\s\\S]{0,30}(другим|иным|перекрёстн)"

      # Пороговые значения
      - "(?i)threshold\\s+amount[\\s\\S]{0,30}(default|cross)"
      - "(?i)пороговая\\s+сумм[аы][\\s\\S]{0,30}(дефолт|кросс)"
      - "(?i)aggregate\\s+amount\\s+(exceed|in\\s+excess)[\\s\\S]{0,30}(default|obligation)"
      - "(?i)совокупн[а-я]+\\s+сумм[аы]\\s+(превышает|более)[\\s\\S]{0,30}(дефолт|обязательств)"

      # Event of Default
      - "(?i)event\\s+of\\s+default"
      - "(?i)событие\\s+дефолта"

      # Grace period / cure period
      - "(?i)grace\\s+period[\\s\\S]{0,30}(default|cross)"
      - "(?i)cure\\s+period[\\s\\S]{0,30}(default|cross)"
      - "(?i)льготн[а-я]+\\s+период[\\s\\S]{0,30}(дефолт|кросс)"

    low:
      - "(?i)cross[-\\s]?default"
      - "(?i)cross[-\\s]?acceleration"
      - "(?i)кросс[-\\s]?дефолт"
      - "(?i)event\\s+of\\s+default\\s+under\\s+any\\s+other"
      - "(?i)acceleration\\s+of\\s+indebtedness"
      - "(?i)threshold\\s+amount"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 640

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  context_k: 5
  max_chunks: 10

  retrieval_query: >
    кросс-дефолт cross-default кросс-акселерация досрочное погашение 
    дефолт по другим обязательствам threshold grace period

  boost_keywords:
    - "cross-default"
    - "cross default"
    - "cross-acceleration"
    - "cross acceleration"
    - "кросс-дефолт"
    - "кросс-акселерация"
    - "event of default under any other agreement"
    - "default under any other loan"
    - "default under any other indebtedness"
    - "событие дефолта по любому договору"
    - "дефолт по другим обязательствам"
    - "acceleration of indebtedness"
    - "досрочное погашение по другим"
    - "threshold amount"
    - "пороговая сумма"
    - "grace period"
    - "cure period"
    - "any default under any agreement"
    - "любой дефолт по любому договору"

  negative_keywords:
    - "интеллектуальная собственность"
    - "авторские права"
    - "коммерческая тайна"
    - "персональные данные"

  preferred_unit_types:
    - "general_provision"
    - "obligation"
    
  excluded_unit_types:
    - "technical_fragment"
    - "appendix_reference"

  preferred_clause_functions:
    - "termination"
    - "remedies"
    - "obligations"

  position_bias:
    preferred_range: [0.0, 1.0]
    boost: 0.10
    scope: "segment"

  rerank: true
  filters: {}

conditional: null

enrichment_hints:
  preferred_segment_types:
    - "contract"
    - "amendment"
    - "annex"
  excluded_segment_types:
    - "technical_specification"
    - "price_list"
    - "invoice"
    - "act"
    - "schedule"
  confidence_bonus_on_match: 0.10
  confidence_penalty_on_excluded_segment: 0.15

extraction:
  enabled: true
  mode: "hybrid"
  llm_max_tokens: 1050

  llm_prompt_extraction: |
    <role>
    Ты — юрист по финансированию.
    Твоя задача — точно извлечь из текста:
    1) есть ли cross-default;
    2) есть ли cross-acceleration;
    3) охват, threshold, grace period и механизм триггера.

    Чётко различай cross-default (триггер: факт дефолта)
    и cross-acceleration (триггер: акселерация долга).
    Не придумывай пороги если они не указаны.
    </role>

    <context>
    Ниже приведены релевантные фрагменты договора:

    {context}
    </context>

    <task>
    Заполни только следующие поля:
    - cross_default_display
    - has_cross_default
    - has_cross_acceleration
    - cross_default_scope
    - has_threshold
    - threshold_value
    - has_grace_period
    - trigger_mechanism
    - reason

    Важно:
    - пиши коротко и по-русски.
    </task>

    <instructions>
    Шаг 1 — НАЛИЧИЕ CROSS-DEFAULT

    Заполни "has_cross_default".

    Значения:
    - "yes" — дефолт / нарушение по другим договорам =
      событие дефолта по данному договору.
    - "no" — не предусмотрено.
    - "unclear" — двойное толкование.

    Шаг 2 — НАЛИЧИЕ CROSS-ACCELERATION

    Заполни "has_cross_acceleration".

    Значения:
    - "yes" — акселерация другого долга = право требовать
      досрочного погашения по данному договору.
    - "no" — не предусмотрено.
    - "unclear" — неясно.

    Шаг 3 — ОХВАТ

    Заполни "cross_default_scope".

    Значения:
    - "financial_only" — только финансовые обязательства.
    - "any_obligation" — любые обязательства / любые договоры.
    - "specified" — конкретно перечисленные виды.
    - "not_applicable" — ни cross-default, ни cross-acceleration.
    - "unclear" — неясно.

    Шаг 4 — ПОРОГОВОЕ ЗНАЧЕНИЕ

    Заполни "has_threshold" и "threshold_value".

    Значения для has_threshold:
    - "yes" / "no" / "unclear"

    Правила для threshold_value:
    - Если указан: "USD 1M", "5% от активов", "RUB 50M"
    - Нет: "Не установлен"
    - Неясно: "Не удалось определить"

    Шаг 5 — GRACE PERIOD

    Заполни "has_grace_period".

    Значения:
    - "yes" / "no" / "unclear"

    Шаг 6 — МЕХАНИЗМ ТРИГГЕРА

    Заполни "trigger_mechanism".

    Значения:
    - "automatic" — срабатывает автоматически.
    - "declaratory" — требует формального объявления.
    - "not_applicable" — нет cross-default / acceleration.
    - "unclear" — неясно.

    Шаг 7 — НОРМАЛИЗОВАННЫЙ DISPLAY ДЛЯ DD GRID

    Заполни "cross_default_display".

    Это не свободное summary.
    Строй display по следующей логике:

    Базовые случаи:
    - has_cross_default = "no" и has_cross_acceleration = "no":
      "Cross-default и cross-acceleration не обнаружены"
    - все поля unclear:
      "Не удалось определить наличие cross-default"

    Если есть — комбинируй через ";":
    - тип (cross-default / cross-acceleration)
    - scope (если "any_obligation": "любые обязательства")
    - threshold (если "no": "нет threshold")
    - grace period (если "no": "нет grace period")

    Примеры:
    - "Cross-default: любые обязательства; нет threshold; нет grace period"
    - "Cross-default: только финансовые; threshold USD 1M; grace period 30 дней"
    - "Cross-acceleration: автоматический; нет порога"
    - "Cross-default и cross-acceleration не обнаружены"
    - "Не удалось определить наличие cross-default"

    Ограничение: не более 3 фактов через ";".

    Шаг 8 — КРАТКОЕ ОБОСНОВАНИЕ

    Заполни "reason".

    Правила:
    - 1–2 коротких предложения.
    - Укажи: есть ли cross-default / acceleration, охват,
      threshold, grace period, механизм.
    - Приведи цитату в кавычках.
    </instructions>

    <edge_cases>
    - "Any default under any agreement" без threshold:
      * cross_default_scope = "any_obligation"
      * has_threshold = "no"

    - Только акселерация другого долга как триггер:
      * has_cross_default = "no"
      * has_cross_acceleration = "yes"

    - Автоматический cross-acceleration без grace:
      * trigger_mechanism = "automatic"
      * has_grace_period = "no"

    - Нет релевантных фрагментов:
      * has_cross_default = "unclear"
      * has_cross_acceleration = "unclear"
      * cross_default_display =
        "Не удалось определить наличие cross-default"
    </edge_cases>

    <output_expectations>
    Все значения коротко и по-русски.
    Не добавляй никаких полей, кроме указанных в схеме extraction.
    </output_expectations>

  fields:
    - name: "cross_default_display"
      type: "string"
      presentation: "fact"
      label: "Cross-default / cross-acceleration"
      description: "Нормализованный user-facing вывод для DD Grid"

    - name: "has_cross_default"
      type: "string"
      presentation: "signal"
      description: "Наличие cross-default"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "has_cross_acceleration"
      type: "string"
      presentation: "signal"
      description: "Наличие cross-acceleration"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "cross_default_scope"
      type: "string"
      presentation: "signal"
      description: "Охват cross-default"
      allowed_values:
        - "financial_only"
        - "any_obligation"
        - "specified"
        - "not_applicable"
        - "unclear"

    - name: "has_threshold"
      type: "string"
      presentation: "signal"
      description: "Пороговое значение"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "threshold_value"
      type: "string"
      presentation: "fact"
      label: "Пороговое значение"
      description: "Размер порогового значения"

    - name: "has_grace_period"
      type: "string"
      presentation: "signal"
      description: "Grace period / cure period"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "trigger_mechanism"
      type: "string"
      presentation: "signal"
      description: "Механизм триггера"
      allowed_values:
        - "automatic"
        - "declaratory"
        - "not_applicable"
        - "unclear"

    - name: "reason"
      type: "string"
      presentation: "diagnostic"
      description: "Обоснование"

  store_payload: true


  