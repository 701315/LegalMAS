id: "liability_caps_and_baskets"
name: "Лимиты ответственности и пороги (caps, baskets)"
description: >
  Анализирует наличие и структуру лимитов ответственности (caps),
  порогов (basket, de minimis) и carve-out для ключевых рисков.
  Оценивает соразмерность cap'ов масштабу договора, механику
  basket/de minimis (tipping vs. deductible), и какие категории
  рисков выведены из-под ограничений.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"

rules:
  keyword_mode: any

  keywords:
    high:
      # Cap / лимит ответственности — конкретные формулировки
      - "(?i)aggregate\\s+liability\\s+(shall\\s+)?not\\s+exceed"
      - "(?i)total\\s+liability\\s+[\\s\\S]{0,40}(shall\\s+)?not\\s+exceed"
      - "(?i)maximum\\s+(aggregate\\s+)?liability"
      - "(?i)liability\\s+cap"
      - "(?i)cap\\s+on\\s+(aggregate\\s+)?liability"
      - "(?i)лимит\\s+ответственност[ьи]"
      - "(?i)максимальн[а-я]+\\s+(размер|сумм[аы])\\s+ответственност[ьи]"
      - "(?i)совокупн[а-я]+\\s+ответственность\\s+[\\s\\S]{0,40}не\\s+(может|должна)\\s+превышать"
      - "(?i)предел[ы]?\\s+ответственност[ьи]"

      # Basket — агрегатный порог
      - "(?i)\\baggregate\\s+basket\\b"
      - "(?i)\\bbasket\\s+(threshold|amount)\\b"
      - "(?i)tipping\\s+basket"
      - "(?i)first[-\\s]?dollar\\s+basket"
      - "(?i)deductible\\s+basket"
      - "(?i)threshold\\s+basket"
      - "(?i)совокупн[а-я]+\\s+порог\\s+убытк[ов]"
      - "(?i)порог\\s+претенз[ийи]"

      # De minimis
      - "(?i)\\bde\\s+minimis\\b"
      - "(?i)minimum\\s+claim\\s+(amount|threshold)"
      - "(?i)individual\\s+claim\\s+threshold"
      - "(?i)минимальн[а-я]+\\s+(размер|сумм[аы])\\s+претенз[ийи]"
      - "(?i)минимальн[а-я]+\\s+порог\\s+требовани[яй]"

      # Carve-out для ключевых рисков
      - "(?i)carve[-\\s]?out"
      - "(?i)except(ion)?\\s+for\\s+[\\s\\S]{0,30}(fraud|willful|gross\\s+negligence)"
      - "(?i)shall\\s+not\\s+apply\\s+to\\s+[\\s\\S]{0,30}(fraud|willful|gross)"
      - "(?i)(fraud|willful\\s+misconduct|gross\\s+negligence)\\s+[\\s\\S]{0,30}(excluded?|not\\s+subject)"
      - "(?i)исключ[а-я]+\\s+из[-\\s]?под\\s+(лимит|cap|ограничен)"
      - "(?i)(мошенничество|умысел|грубая\\s+неосторожность)\\s+[\\s\\S]{0,30}не\\s+подпада[ею]т"

    medium:
      # Cap / aggregate liability — общие упоминания
      - "(?i)\\bcap\\b"
      - "(?i)aggregate\\s+liability"
      - "(?i)cumulative\\s+liability"
      - "(?i)в\\s+совокупности"
      - "(?i)совокупн[а-я]+\\s+ответственност[ьи]"

      # Basket — общие упоминания
      - "(?i)\\bbasket\\b"
      - "(?i)aggregate\\s+threshold"
      - "(?i)threshold\\s+amount"
      - "(?i)порог[аи]?\\s+(для\\s+)?претенз[ийи]"
      - "(?i)порог[аи]?\\s+убытк[ов]"

      # De minimis — общие упоминания
      - "(?i)minimum\\s+amount"
      - "(?i)minimum\\s+threshold"
      - "(?i)минимальн[а-я]+\\s+сумм[аы]"

      # Deductible / excess
      - "(?i)\\bdeductible\\b"
      - "(?i)\\bexcess\\b"
      - "(?i)франшиз[аы]"
      - "(?i)вычет\\s+из\\s+возмещени[яи]"

      # Carve-out категории — ключевые слова
      - "(?i)\\bfraud\\b"
      - "(?i)willful\\s+misconduct"
      - "(?i)gross\\s+negligence"
      - "(?i)грубая\\s+неосторожность"
      - "(?i)умышленн[а-я]+\\s+(нарушени[ея]|действи[яй])"
      - "(?i)мошенничеств[оа]"
      - "(?i)санкци[яий]"
      - "(?i)sanctions?\\s+(violation|breach)"
      - "(?i)нарушени[ея]\\s+(IP|интеллектуальн[а-я]+\\s+собственност[ьи])"
      - "(?i)(IP|intellectual\\s+property)\\s+(infringement|breach)"
      - "(?i)нарушени[ея]\\s+конфиденциальност[ьи]"
      - "(?i)breach\\s+of\\s+confidentiality"
      - "(?i)data\\s+(breach|protection)"
      - "(?i)нарушени[ея]\\s+защит[ыа]\\s+(данных|персональн)"

    low:
      # Общие ссылки на ограничения
      - "(?i)limit(ation)?\\s+of\\s+liability"
      - "(?i)ограничени[ея]\\s+ответственност[ьи]"
      - "(?i)subject\\s+to\\s+(a\\s+)?limit"
      - "(?i)в\\s+пределах"

      # Общие ссылки на исключения
      - "(?i)except(ion)?"
      - "(?i)исключ[а-яё]+"
      - "(?i)shall\\s+not\\s+apply"
      - "(?i)не\\s+распростран[яи][её]тся"

      # Общие числовые паттерны (суммы, проценты)
      - "(?i)\\d+[\\s]*%\\s+(of|от)"
      - "(?i)(USD|EUR|RUB|\\$|€|₽)\\s*[\\d,.]+"
      - "(?i)[\\d,.]+\\s*(USD|EUR|RUB|долларов|евро|рублей)"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 640

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  context_k: 5
  max_chunks: 10
  boost_keywords:
    - "aggregate liability shall not exceed"
    - "maximum liability"
    - "liability cap"
    - "cap on liability"
    - "лимит ответственности"
    - "максимальный размер ответственности"
    - "предел ответственности"
    - "aggregate basket"
    - "basket threshold"
    - "tipping basket"
    - "deductible basket"
    - "de minimis"
    - "minimum claim amount"
    - "минимальный размер претензии"
    - "carve-out"
    - "except for fraud"
    - "willful misconduct"
    - "gross negligence"
    - "грубая неосторожность"
    - "санкции"
    - "sanctions violation"
    - "IP infringement"
    - "data breach"
  rerank: true
  filters: {}

conditional: null

extraction:
  llm_prompt_extraction: |
    <role>
    Ты — юрист по M&A и коммерческим контрактам.
    Твоя специализация — структура ограничений ответственности:
    caps (лимиты), basket/de minimis пороги, механика возмещения
    (tipping vs. deductible), carve-out для ключевых рисков
    (fraud, gross negligence, санкции, IP, данные).
    </role>

    <context>
    Ниже приведены фрагменты договора с положениями об ограничении
    ответственности, порогах и исключениях:

    {context}
    </context>

    <instructions>
    Проведи анализ по шагам. Каждый шаг логически соответствует одному
    или нескольким полям итоговой оценки риска.

    Шаг 1 — НАЛИЧИЕ ЛИМИТА ОТВЕТСТВЕННОСТИ (CAP)
    (используется для заполнения поля "has_liability_cap"):
    - Определи, предусмотрен ли cap (лимит) на ответственность
      одной или обеих сторон.
    - Если cap явно установлен (фиксированная сумма, процент от цены,
      кратность годовых платежей и т.п.) — вывод "yes".
    - Если cap отсутствует или ответственность явно не ограничена —
      вывод "no".
    - Если из фрагментов невозможно определить — вывод "unclear".

    Шаг 2 — НАЛИЧИЕ DE MINIMIS (МИНИМАЛЬНЫЙ ПОРОГ ПРЕТЕНЗИИ)
    (используется для заполнения поля "has_de_minimis"):
    - Определи, установлен ли минимальный размер отдельной претензии
      (de minimis threshold), ниже которого:
      * требование не учитывается при расчёте basket, и/или
      * требование не подлежит возмещению вообще.
    - Если de minimis есть — вывод "yes".
    - Если de minimis отсутствует — вывод "no".
    - Если невозможно определить — вывод "unclear".

    Шаг 3 — CARVE-OUT ДЛЯ КЛЮЧЕВЫХ РИСКОВ
    (используется для заполнения поля "has_key_carveouts"):
    - Определи, выведены ли из-под cap, basket и/или de minimis
      отдельные категории нарушений:
      * fraud (мошенничество);
      * willful misconduct / умышленные нарушения;
      * gross negligence / грубая неосторожность;
      * нарушения санкционного режима;
      * нарушения конфиденциальности;
      * нарушения прав интеллектуальной собственности (IP);
      * нарушения защиты персональных данных;
      * нарушения compliance / антикоррупционных требований;
      * налоговые нарушения;
      * экологические нарушения.
    - Если carve-out для таких рисков явно прописан — вывод "yes".
    - Если carve-out отсутствует — вывод "no".
    - Если невозможно определить — вывод "unclear".

    Шаг 4 — RED FLAGS
    (используется для заполнения поля "red_flags"):
    - Оцени наличие следующих рисковых факторов:

      * «LIAB4» — Отсутствие разумного cap при существенных
        обязательствах или несоразмерно низкий cap. Признаки:
        - cap отсутствует вообще (has_liability_cap = "no");
        - cap установлен, но на очень низком уровне относительно
          потенциальных рисков (например, cap = 10% от цены при
          широких warranty/indemnity обязательствах);
        - cap не покрывает ключевые категории требований
          (например, только warranty, но не indemnity).

      * «LIAB5» — Отсутствие carve-out для ключевых высокорисковых
        категорий (fraud, gross negligence, санкции, IP, данные,
        compliance). Признаки:
        - cap и/или basket применяются ко ВСЕМ требованиям без
          исключений (has_key_carveouts = "no");
        - carve-out есть, но не покрывает критичные категории
          (например, только fraud, но не санкции или данные).

    - Если cap разумный, basket/de minimis адекватны масштабу
      сделки, и ключевые риски выведены из-под ограничений —
      верни "NONE".
    - Если данных недостаточно для оценки или текст противоречив —
      верни "UNCLEAR".
    - Формат: один или несколько кодов через запятую
      ("LIAB4", "LIAB5", "LIAB4, LIAB5"), "NONE" или "UNCLEAR".
      Без комментариев в этом поле — всё объясняющее в reason.

    Шаг 5 — ОБОСНОВАНИЕ
    (используется для заполнения поля "reason"):

    - В "reason" кратко обоснуй вывод:
      * ссылайся на ключевые формулировки (по возможности
        с короткими цитатами);
      * поясни, как структура caps/baskets/carve-outs влияет
        на возможности Target по получению/минимизации компенсации;
      * если выставлены red_flags — объясни, почему именно эти коды.
    </instructions>

    <edge_cases>
    Обрабатывай пограничные ситуации так:

    - Cap отсутствует, а ответственность иначе не ограничена:
      фиксируй has_liability_cap = "no", ставь LIAB4;
      учитывай это как фактор повышенного риска.

    - Cap есть, но очень низкий относительно масштаба сделки
      (например, 10% от цены при широких warranty/indemnity):
      отрази низкий уровень cap в cap_description, ставь LIAB4;
      поясни в reason, что Target может не получить адекватную
      компенсацию при существенном нарушении.

    - Cap на уровне 100% цены договора или 12-месячных платежей,
      при этом fraud, gross negligence, санкции, IP и данные
      выведены из-под cap:
      воспринимай как сбалансированную конструкцию; риск
      может быть medium или low; не ставь LIAB4/LIAB5, если
      carve-out покрывает ключевые риски.

    - Basket механика не уточнена (не ясно: tipping или deductible):
      зафиксируй неопределённость в basket_description;
      это не критично для риска, но влияет на оценку возмещаемости.

    - De minimis установлен на высоком уровне (например, $500K
      при цене контракта $2M):
      отрази это как барьер для возмещения мелких и средних
      нарушений; учитывай в overall_risk_level.

    - Carve-out только для fraud, но не для санкций, IP, данных:
      зафиксируй частичный carve-out в carveouts_list;
      рассмотри возможность LIAB5, если непокрытые категории
      критичны для Target.

    - Cap применяется только к warranty claims, а indemnity —
      без cap:
      отрази это в cap_description (указать, что cap частичный);
      оценивай риск по совокупности обязательств.

    - Ограничения применяются асимметрично (cap только для
      контрагента, но не для Target):
      зафиксируй дисбаланс в reason; учитывай в overall_risk_level.

    - Пустые или явно нерелевантные фрагменты:
      укажи, что данных недостаточно для анализа лимитов
      ответственности и порогов. Поставь has_liability_cap = "unclear",
      has_basket = "unclear", has_de_minimis = "unclear",
      has_key_carveouts = "unclear", red_flags = "UNCLEAR",
      overall_risk_level = "medium".
    </edge_cases>

    <output_expectations>
    На основе твоего анализа отдельный механизм извлечения сформирует
    структурированные поля по заранее заданной схеме. Твоя задача —
    давать чёткие юридические выводы и указывать конкретные формулировки
    из текста, на которых они основаны. Не генерируй JSON —
    просто излагай выводы структурированно и однозначно.
    </output_expectations>

  enabled: true
  mode: "hybrid"
  fields:
    - name: "has_liability_cap"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "has_de_minimis"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "has_key_carveouts"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "red_flags"
      type: "string"

    - name: "reason"
      type: "string"

  store_payload: true

red_flags:
  items:
    - code: "LIAB4"
      description: "Отсутствие разумного cap при существенных обязательствах."
    - code: "LIAB5"
      description: "Отсутствие carve-out для ключевых высокорисковых категорий."