id: "liability_caps_and_baskets"
name: "Лимиты ответственности и пороги (caps, baskets)"
group: "Liability"
description: >
  Анализирует структуру лимитов ответственности (caps), порогов
  (basket, de minimis) и carve-out для ключевых рисков.

  Извлекает: наличие и размер cap, наличие basket / de minimis,
  механику basket (tipping vs. deductible), категории рисков,
  выведенных из-под ограничений (fraud, gross negligence,
  санкции, IP, данные, compliance).

  Формирует краткий user-facing вывод и оценивает соразмерность
  ограничений масштабу договора.

  Верхнеуровневый анализ объёма ответственности и indemnity
  выполняется чеком liability_and_indemnity_scope.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"
ui_mode: "field_extraction"

rules:
  keyword_mode: any

  keywords:
    high:
      # Cap / лимит ответственности
      - "(?i)aggregate\\s+liability\\s+(shall\\s+)?not\\s+exceed"
      - "(?i)total\\s+liability\\s+[\\s\\S]{0,40}(shall\\s+)?not\\s+exceed"
      - "(?i)maximum\\s+(aggregate\\s+)?liability"
      - "(?i)liability\\s+cap"
      - "(?i)cap\\s+on\\s+(aggregate\\s+)?liability"
      - "(?i)лимит\\s+ответственност[ьи]"
      - "(?i)максимальн[а-я]+\\s+(размер|сумм[аы])\\s+ответственност[ьи]"
      - "(?i)предел[ы]?\\s+ответственност[ьи]"

      # Basket
      - "(?i)aggregate\\s+basket"
      - "(?i)basket\\s+(threshold|amount)"
      - "(?i)tipping\\s+basket"
      - "(?i)first[-\\s]?dollar\\s+basket"
      - "(?i)deductible\\s+basket"
      - "(?i)совокупн[а-я]+\\s+порог\\s+убытк[ов]"
      - "(?i)порог\\s+претенз[ийи]"

      # De minimis
      - "(?i)\\bde\\s+minimis\\b"
      - "(?i)minimum\\s+claim\\s+(amount|threshold)"
      - "(?i)individual\\s+claim\\s+threshold"
      - "(?i)минимальн[а-я]+\\s+(размер|сумм[аы])\\s+претенз[ийи]"

      # Carve-out — ключевые формулировки
      - "(?i)carve[-\\s]?out[\\s\\S]{0,30}(fraud|willful|gross\\s+negligence|санкци|IP|данных)"
      - "(?i)except(ion)?\\s+for[\\s\\S]{0,30}(fraud|willful|gross\\s+negligence)"
      - "(?i)shall\\s+not\\s+apply\\s+to[\\s\\S]{0,30}(fraud|willful|gross)"
      - "(?i)(fraud|willful\\s+misconduct|gross\\s+negligence)[\\s\\S]{0,30}(excluded?|not\\s+subject)"
      - "(?i)исключ[а-я]+\\s+из[-\\s]?под\\s+(лимит|cap|ограничен)"

    medium:
      # Cap — общие
      - "(?i)\\bcap\\b"
      - "(?i)aggregate\\s+liability"
      - "(?i)в\\s+совокупности"
      - "(?i)совокупн[а-я]+\\s+ответственност[ьи]"

      # Basket / threshold — общие
      - "(?i)\\bbasket\\b"
      - "(?i)aggregate\\s+threshold"
      - "(?i)threshold\\s+amount"
      - "(?i)порог[аи]?\\s+(для\\s+)?претенз[ийи]"

      # De minimis — общие
      - "(?i)minimum\\s+(amount|threshold)"
      - "(?i)минимальн[а-я]+\\s+сумм[аы]"

      # Deductible / excess
      - "(?i)\\bdeductible\\b"
      - "(?i)\\bexcess\\b"
      - "(?i)вычет\\s+из\\s+возмещени[яи]"

      # Carve-out категории
      - "(?i)\\bfraud\\b"
      - "(?i)willful\\s+misconduct"
      - "(?i)gross\\s+negligence"
      - "(?i)грубая\\s+неосторожность"
      - "(?i)мошенничеств[оа]"
      - "(?i)санкци[яий]"
      - "(?i)sanctions?\\s+(violation|breach)"
      - "(?i)(IP|intellectual\\s+property)\\s+(infringement|breach)"
      - "(?i)data\\s+(breach|protection)[\\s\\S]{0,20}(carve|exclude|not\\s+apply)"
      - "(?i)breach\\s+of\\s+confidentiality[\\s\\S]{0,20}(carve|exclude|not\\s+apply)"

    low:
      - "(?i)liability\\s+cap"
      - "(?i)aggregate\\s+basket"
      - "(?i)de\\s+minimis"
      - "(?i)tipping\\s+basket"
      - "(?i)carve[-\\s]?out"
      - "(?i)fraud"
      - "(?i)willful\\s+misconduct"
      - "(?i)gross\\s+negligence"
      - "(?i)sanctions?\\s+violation"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 640

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  retrieval_profile: "liability_cap_check"
  context_k: 5
  max_chunks: 10

  retrieval_query: >
    лимит ответственности ограничение предел aggregate liability cap basket de minimis 
    carve-out fraud sanctions IP data breach

  boost_keywords:
    - "aggregate liability shall not exceed"
    - "maximum liability"
    - "liability cap"
    - "cap on liability"
    - "лимит ответственности"
    - "максимальный размер ответственности"
    - "предел ответственности"
    - "aggregate basket"
    - "basket threshold"
    - "tipping basket"
    - "deductible basket"
    - "de minimis"
    - "minimum claim amount"
    - "минимальный размер претензии"
    - "carve-out"
    - "except for fraud"
    - "willful misconduct"
    - "gross negligence"
    - "грубая неосторожность"
    - "sanctions violation"
    - "IP infringement"
    - "data breach"

  negative_keywords:
    - "форс-мажор"
    - "применимое право"
    - "подсудность"
    - "арбитраж"
    - "условия оплаты"

  preferred_unit_types:
    - "general_provision"
    - "obligation"

  excluded_unit_types:
    - "technical_fragment"
    - "appendix_reference"
    - "structural_anchor"

  preferred_clause_functions:
    - "limitations"
    - "limitations"
    - "remedies"

  position_bias:
    preferred_range: [0.0, 1.0]
    boost: 0.10
    scope: "segment"

  rerank: true
  filters: {}

conditional: null

enrichment_hints:
  preferred_segment_types:
    - "contract"
    - "amendment"
    - "annex"
  excluded_segment_types:
    - "technical_specification"
    - "price_list"
    - "invoice"
    - "act"
    - "schedule"
  confidence_bonus_on_match: 0.10
  confidence_penalty_on_excluded_segment: 0.15

extraction:
  enabled: true
  mode: "hybrid"
  llm_max_tokens: 1100

  llm_prompt_extraction: |
    <role>
    Ты — юрист по коммерческим договорам и ограничениям ответственности.
    Твоя задача — точно извлечь структуру ограничений ответственности:
    cap, basket / de minimis, механику basket и carve-out
    для ключевых рисков.

    КРИТИЧЕСКИ ВАЖНО:
    - Извлекай ТОЛЬКО то, что прямо написано в тексте.
    - НЕ додумывай cap, basket, de minimis или carve-out,
      если они не указаны.
    - НЕ смешивай этот check с общим анализом indemnity
      и не подменяй его анализом исключённых видов убытков.
    - Если фрагментов недостаточно для уверенного вывода —
      ставь "unclear".
    </role>

    <context>
    Ниже приведены релевантные фрагменты договора:

    {context}
    </context>

    <context_rules>
    - Некоторые фрагменты могут быть нерелевантны — игнорируй их.
    - Если есть противоречия между фрагментами — используй "unclear"
      и опиши это в reason.
    - Используй "no" только если текст по существу показывает
      отсутствие cap / basket / carve-out, а не просто не содержит
      упоминания в коротком фрагменте.
    - Если релевантной информации недостаточно — используй "unclear".
    - Не опирайся на рыночную практику и не восстанавливай пропущенные условия.
    </context_rules>

    <task>
    Заполни только следующие поля:
    - caps_display
    - has_liability_cap
    - cap_description
    - has_basket
    - basket_type
    - has_de_minimis
    - has_key_carveouts
    - carveouts_summary
    - reason
    </task>

    <instructions>
    Шаг 1 — ЛИМИТ ОТВЕТСТВЕННОСТИ (CAP)

    Заполни "has_liability_cap" и "cap_description".

    Значения для has_liability_cap:
    - "yes" — cap прямо установлен.
    - "no" — cap отсутствует по тексту.
    - "unclear" — нельзя определить.

    Правила для cap_description:
    - Если cap есть: "USD 1M", "50% от суммы", "стоимость договора",
      "12 мес. платежей"
    - Если cap нет: "Не установлен"
    - Если нельзя определить: "Не удалось определить"

    Шаг 2 — BASKET

    Заполни "has_basket" и "basket_type".

    Значения для has_basket:
    - "yes" — basket / aggregate threshold есть.
    - "no" — basket нет.
    - "unclear" — нельзя определить.

    Значения для basket_type:
    - "tipping" — после порога возмещается весь ущерб.
    - "deductible" — возмещается только превышение порога.
    - "not_applicable" — basket нет.
    - "unclear" — тип нельзя определить.

    Шаг 3 — DE MINIMIS

    Заполни "has_de_minimis".

    Значения:
    - "yes" — минимальный размер отдельной претензии установлен.
    - "no" — нет.
    - "unclear" — нельзя определить.

    Шаг 4 — CARVE-OUT ДЛЯ КЛЮЧЕВЫХ РИСКОВ

    Заполни "has_key_carveouts" и "carveouts_summary".

    Значения для has_key_carveouts:
    - "yes" — ключевые риски выведены из-под cap / basket.
    - "no" — carve-out нет.
    - "partial" — carve-out есть только для части ключевых категорий.
    - "unclear" — нельзя определить.

    Правила для carveouts_summary:
    - Если есть или partial — перечисли категории через ";"
      и не более 4 категорий:
      "fraud; gross negligence; sanctions"
      "fraud; IP; data breach"
    - Если carve-out нет: "Не предусмотрено"
    - Если нельзя определить: "Не удалось определить"

    Шаг 5 — НОРМАЛИЗОВАННЫЙ DISPLAY ДЛЯ DD GRID

    Заполни "caps_display".

    Это итоговое поле для таблицы.
    Строй его ТОЛЬКО на основе уже заполненных полей выше.
    Не добавляй информацию сверх них.

    Возможные состояния:
    1. Конкретная структура известна:
       "Cap: стоимость договора; tipping basket; carve-out: fraud; sanctions"
       "Cap: USD 1M; de minimis есть; carve-out: fraud; IP"
    2. Ограничений нет:
       "Нет cap; нет basket; нет carve-out"
    3. Не удалось определить:
       "Не удалось определить структуру ограничений"

    Правила:
    - Если все поля unclear:
      "Не удалось определить структуру ограничений"
    - Если has_liability_cap = "no"
      и has_basket = "no"
      и has_key_carveouts = "no":
      "Нет cap; нет basket; нет carve-out"
    - Иначе:
      * если cap есть — "Cap: {cap_description}"
      * если basket есть — "tipping basket" / "deductible basket"
      * если de minimis есть — "de minimis есть"
      * если carve-out есть или partial —
        "carve-out: {краткий перечень}"
    - Не более 4 коротких фактов через ";".

    Шаг 6 — ОБОСНОВАНИЕ

    Заполни "reason".

    Правила:
    - Первое предложение — краткий вывод.
    - Второе — короткая цитата из текста (до 100 символов).
    - Пиши по-русски.
    </instructions>

    <edge_cases>
    - Cap отсутствует:
      * has_liability_cap = "no"
      * cap_description = "Не установлен"

    - Basket нет:
      * has_basket = "no"
      * basket_type = "not_applicable"

    - Carve-out только для fraud:
      * has_key_carveouts = "partial"
      * carveouts_summary = "fraud"

    - Нет cap, basket и carve-out:
      * caps_display = "Нет cap; нет basket; нет carve-out"

    - Нет релевантных фрагментов:
      * has_liability_cap = "unclear"
      * cap_description = "Не удалось определить"
      * has_basket = "unclear"
      * basket_type = "unclear"
      * has_de_minimis = "unclear"
      * has_key_carveouts = "unclear"
      * carveouts_summary = "Не удалось определить"
      * caps_display = "Не удалось определить структуру ограничений"
    </edge_cases>

    <output_expectations>
    - Верни результат строго в формате JSON.
    - Не оборачивай ответ в markdown-блоки.
    - Не добавляй комментариев вне JSON.
    - Для полей с allowed_values используй строго значения из списка.
    - Свободные текстовые поля
      (caps_display, cap_description, carveouts_summary, reason)
      заполняй на русском языке.
    - Не добавляй никаких полей, кроме указанных.

    Пример структуры ответа:
    {
      "caps_display": "Cap: стоимость договора; tipping basket; carve-out: fraud; sanctions",
      "has_liability_cap": "yes",
      "cap_description": "стоимость договора",
      "has_basket": "yes",
      "basket_type": "tipping",
      "has_de_minimis": "no",
      "has_key_carveouts": "yes",
      "carveouts_summary": "fraud; sanctions",
      "reason": "..."
    }
    </output_expectations>

  fields:
    - name: "caps_display"
      type: "string"
      presentation: "fact"
      label: "Caps / basket / carve-out"
      description: "Нормализованный user-facing вывод для DD Grid"
      display_in_grid: true
      display_priority: 1

    - name: "has_liability_cap"
      type: "string"
      presentation: "signal"
      description: "Наличие лимита ответственности"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
      display_in_grid: false

    - name: "cap_description"
      type: "string"
      presentation: "fact"
      label: "Размер и база cap"
      description: "Размер и база лимита ответственности"
      display_in_grid: true
      display_priority: 2

    - name: "has_basket"
      type: "string"
      presentation: "signal"
      description: "Наличие basket"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
      display_in_grid: false

    - name: "basket_type"
      type: "string"
      presentation: "signal"
      description: "Тип basket"
      allowed_values:
        - "tipping"
        - "deductible"
        - "not_applicable"
        - "unclear"
      display_in_grid: false

    - name: "has_de_minimis"
      type: "string"
      presentation: "signal"
      description: "Минимальный порог претензии"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
      display_in_grid: false

    - name: "has_key_carveouts"
      type: "string"
      presentation: "signal"
      description: "Carve-out для ключевых рисков"
      allowed_values:
        - "yes"
        - "no"
        - "partial"
        - "unclear"
      display_in_grid: false

    - name: "carveouts_summary"
      type: "string"
      presentation: "fact"
      label: "Carve-out категории"
      description: "Перечень выведенных категорий рисков"
      display_in_grid: true
      display_priority: 3

    - name: "reason"
      type: "string"
      presentation: "diagnostic"
      description: "Обоснование"
      display_in_grid: false

  store_payload: true


  
