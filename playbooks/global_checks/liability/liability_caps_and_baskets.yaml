id: "liability_caps_and_baskets"
name: "Лимиты ответственности и пороги (caps, baskets)"
description: >
  Аналализирует наличие и структуру лимитов ответственности (caps),
  порогов (basket, de minimis) и carve-out для ключевых рисков.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"

rules:
  keywords:
    - "лимит ответственности"
    - "максимальный размер ответственности"
    - "cap"
    - "aggregate liability"
    - "в совокупности"
    - "basket"
    - "de minimis"
    - "порог"
    - "deductible"
    - "excess"
    - "carve-out"
    - "fraud"
    - "willful misconduct"
    - "грубая неосторожность"
    - "gross negligence"
    - "санкции"
    - "нарушение конфиденциальности"
    - "нарушение прав интеллектуальной собственности"
  keyword_mode: "any"
  regex_patterns: []
  clause_patterns: []

llm:
  prompt_template: |
    <role>
    Ты — юрист по сделкам и коммерческим контрактам.
    Твоя специализация — ограничения ответственности (caps), пороги (basket, de minimis)
    и carve-out для ключевых рисков.
    </role>

    <context>
    Ниже приведены фрагменты договора с положениями об ограничении ответственности:

    {context}
    </context>

    <instructions>
    Проведи анализ по шагам. Каждый шаг логически связан с одним или
    несколькими полями итоговой оценки.

    Шаг 1 — НАЛИЧИЕ И СТРУКТУРА ЛИМИТА ОТВЕТСТВЕННОСТИ (CAP)
    (используется для "has_liability_cap" и "cap_description"):
    - Определи, предусмотрен ли лимит ответственности и как он задан:
      * фиксированной суммой (fixed amount);
      * как процент или кратность цены договора / годовых платежей;
      * как aggregate liability (в совокупности по договору) или per-claim.
    - Кратко опиши, как устроен cap и к каким требованиям он применяется.

    Шаг 2 — BASKET / AGGREGATE THRESHOLD
    (используется для "has_basket"):
    - Проверь, есть ли basket — совокупный порог убытков, при достижении которого:
      * либо компенсируется вся сумма убытков (tipping/first dollar basket),
      * либо только сумма сверх порога (deductible basket).
    - Сделай вывод: yes / no / unclear и, при наличии, учитывай механику порога в reason.

    Шаг 3 — DE MINIMIS
    (используется для "has_de_minimis"):
    - Определи, установлен ли минимальный размер отдельной претензии:
      * требования ниже определённой суммы не учитываются при расчёте basket
        и/или не подлежат возмещению.
    - Зафиксируй наличие de minimis (yes / no / unclear).

    Шаг 4 — CARVE-OUT ДЛЯ КЛЮЧЕВЫХ РИСКОВ
    (используется для "has_key_carveouts"):
    - Оцени, выводятся ли из-под:
      * cap, basket и/или de minimis отдельные категории нарушений:
        - fraud, willful misconduct, грубая неосторожность (gross negligence);
        - нарушения санкционного режима;
        - нарушения конфиденциальности, прав ИС, защиты данных, комплаенса и т.п.
    - Если carve-out для таких рисков явно прописан, укажи has_key_carveouts = "yes",
      иначе — "no" или "unclear" по тексту.

    Шаг 5 — ОБЩИЙ УРОВЕНЬ РИСКА ДЛЯ TARGET
    (используется для "overall_risk_level" и "reason"):
    - Оцени, насколько структура caps/baskets/de minimis/carve-outs защищает Target:
      * есть ли разумный cap относительно цены/масштаба договора;
      * позволяют ли basket и de minimis отсекать мелкие претензии;
      * выведены ли ключевые высокорисковые нарушения из-под лимитов.
    - Сформулируй общий риск как low / medium / high.
    - В "reason" кратко обоснуй вывод, ссылаясь на ключевые формулировки
      (желательно с короткими цитатами) и пояснив, как именно такая структура
      влияет на возможность получения компенсации Target.
    </instructions>

    <edge_cases>
    Обрабатывай пограничные ситуации так:

    - Cap отсутствует, а ответственность иначе не ограничена:
      фиксируй отсутствие cap и учитывай это как фактор повышенного риска
      для значимых по объёму договоров.

    - Cap есть, но очень низкий относительно цены/масштаба сделки, без carve-out
      для ключевых рисков:
      отрази это в cap_description и учитывай как фактор высокого риска того,
      что Target не сможет компенсировать существенный ущерб.

    - Cap на уровне 100% цены договора или 12-месячных платежей, при этом
      fraud, грубая неосторожность, нарушения санкций, IP и данных выведены
      из-под cap:
      воспринимай это как более сбалансированную конструкцию (риск может быть
      medium или low в зависимости от контекста).

    - Basket и/или de minimis явно описаны как порог для warranty/indemnity
      требований:
      отражай их наличие и механику (tipping/deductible, размер порогов) в reason.

    - Пустые или явно нерелевантные фрагменты:
      укажи, что данных недостаточно для анализа лимитов ответственности,
      порогов и carve-out, и объясни, как это влияет на неопределённость
      и оценку риска.
    </edge_cases>

    <output_expectations>
    На основе твоего анализа отдельный механизм извлечения сформирует
    структурированные поля по заранее заданной схеме. Твоя задача —
    давать чёткие юридические выводы и указывать конкретные формулировки
    из текста, на которых они основаны.
    </output_expectations>
  prompt_file: null
  context_k: 4
  temperature: 0.0
  max_tokens: 512

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 500

retrieval:
  context_k: 4
  max_chunks: 8
  boost_keywords:
    - "лимит ответственности"
    - "aggregate liability"
    - "basket"
    - "de minimis"
    - "carve-out"
  rerank: true
  filters: {}

conditional: null

extraction:
  enabled: true
  mode: "hybrid"
  fields:
    - name: "has_liability_cap"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "cap_description"
      type: "string"

    - name: "has_basket"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "has_de_minimis"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "has_key_carveouts"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "overall_risk_level"
      type: "string"
      allowed_values:
        - "low"
        - "medium"
        - "high"

    - name: "reason"
      type: "string"

  store_payload: true

red_flags:
  items:
    - code: "LIAB3"
      description: "Отсутствие разумного cap при существенных обязательствах."
    - code: "LIAB4"
      description: "Отсутствие carve-out для ключевых рисков (данные, IP, санкции, комплаенс)."
