id: "liability_caps_and_baskets"
name: "Лимиты ответственности и пороги (caps, baskets)"
group: "Liability"
description: >
  Анализирует структуру лимитов ответственности (caps), порогов
  (basket, de minimis) и carve-out для ключевых рисков.

  Извлекает: наличие и размер cap, наличие basket / de minimis,
  механику basket (tipping vs. deductible), категории рисков,
  выведенных из-под ограничений (fraud, gross negligence,
  санкции, IP, данные, compliance).

  Формирует краткий user-facing вывод и оценивает соразмерность
  ограничений масштабу договора.

  Верхнеуровневый анализ объёма ответственности и indemnity
  выполняется чеком liability_and_indemnity_scope.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"
ui_mode: "field_extraction"

rules:
  keyword_mode: any

  keywords:
    high:
      # Cap / лимит ответственности
      - "(?i)aggregate\\s+liability\\s+(shall\\s+)?not\\s+exceed"
      - "(?i)total\\s+liability\\s+[\\s\\S]{0,40}(shall\\s+)?not\\s+exceed"
      - "(?i)maximum\\s+(aggregate\\s+)?liability"
      - "(?i)liability\\s+cap"
      - "(?i)cap\\s+on\\s+(aggregate\\s+)?liability"
      - "(?i)лимит\\s+ответственност[ьи]"
      - "(?i)максимальн[а-я]+\\s+(размер|сумм[аы])\\s+ответственност[ьи]"
      - "(?i)предел[ы]?\\s+ответственност[ьи]"

      # Basket
      - "(?i)aggregate\\s+basket"
      - "(?i)basket\\s+(threshold|amount)"
      - "(?i)tipping\\s+basket"
      - "(?i)first[-\\s]?dollar\\s+basket"
      - "(?i)deductible\\s+basket"
      - "(?i)совокупн[а-я]+\\s+порог\\s+убытк[ов]"
      - "(?i)порог\\s+претенз[ийи]"

      # De minimis
      - "(?i)\\bde\\s+minimis\\b"
      - "(?i)minimum\\s+claim\\s+(amount|threshold)"
      - "(?i)individual\\s+claim\\s+threshold"
      - "(?i)минимальн[а-я]+\\s+(размер|сумм[аы])\\s+претенз[ийи]"

      # Carve-out — ключевые формулировки
      - "(?i)carve[-\\s]?out[\\s\\S]{0,30}(fraud|willful|gross\\s+negligence|санкци|IP|данных)"
      - "(?i)except(ion)?\\s+for[\\s\\S]{0,30}(fraud|willful|gross\\s+negligence)"
      - "(?i)shall\\s+not\\s+apply\\s+to[\\s\\S]{0,30}(fraud|willful|gross)"
      - "(?i)(fraud|willful\\s+misconduct|gross\\s+negligence)[\\s\\S]{0,30}(excluded?|not\\s+subject)"
      - "(?i)исключ[а-я]+\\s+из[-\\s]?под\\s+(лимит|cap|ограничен)"

    medium:
      # Cap — общие
      - "(?i)\\bcap\\b"
      - "(?i)aggregate\\s+liability"
      - "(?i)в\\s+совокупности"
      - "(?i)совокупн[а-я]+\\s+ответственност[ьи]"

      # Basket / threshold — общие
      - "(?i)\\bbasket\\b"
      - "(?i)aggregate\\s+threshold"
      - "(?i)threshold\\s+amount"
      - "(?i)порог[аи]?\\s+(для\\s+)?претенз[ийи]"

      # De minimis — общие
      - "(?i)minimum\\s+(amount|threshold)"
      - "(?i)минимальн[а-я]+\\s+сумм[аы]"

      # Deductible / excess
      - "(?i)\\bdeductible\\b"
      - "(?i)\\bexcess\\b"
      - "(?i)вычет\\s+из\\s+возмещени[яи]"

      # Carve-out категории
      - "(?i)\\bfraud\\b"
      - "(?i)willful\\s+misconduct"
      - "(?i)gross\\s+negligence"
      - "(?i)грубая\\s+неосторожность"
      - "(?i)мошенничеств[оа]"
      - "(?i)санкци[яий]"
      - "(?i)sanctions?\\s+(violation|breach)"
      - "(?i)(IP|intellectual\\s+property)\\s+(infringement|breach)"
      - "(?i)data\\s+(breach|protection)[\\s\\S]{0,20}(carve|exclude|not\\s+apply)"
      - "(?i)breach\\s+of\\s+confidentiality[\\s\\S]{0,20}(carve|exclude|not\\s+apply)"

    low:
      - "(?i)liability\\s+cap"
      - "(?i)aggregate\\s+basket"
      - "(?i)de\\s+minimis"
      - "(?i)tipping\\s+basket"
      - "(?i)carve[-\\s]?out"
      - "(?i)fraud"
      - "(?i)willful\\s+misconduct"
      - "(?i)gross\\s+negligence"
      - "(?i)sanctions?\\s+violation"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 640

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  retrieval_profile: "liability_cap_check"
  context_k: 5
  max_chunks: 10

  retrieval_query: >
    лимит ответственности ограничение предел aggregate liability cap basket de minimis 
    carve-out fraud sanctions IP data breach

  boost_keywords:
    - "aggregate liability shall not exceed"
    - "maximum liability"
    - "liability cap"
    - "cap on liability"
    - "лимит ответственности"
    - "максимальный размер ответственности"
    - "предел ответственности"
    - "aggregate basket"
    - "basket threshold"
    - "tipping basket"
    - "deductible basket"
    - "de minimis"
    - "minimum claim amount"
    - "минимальный размер претензии"
    - "carve-out"
    - "except for fraud"
    - "willful misconduct"
    - "gross negligence"
    - "грубая неосторожность"
    - "sanctions violation"
    - "IP infringement"
    - "data breach"

  negative_keywords:
    - "форс-мажор"
    - "применимое право"
    - "подсудность"
    - "арбитраж"
    - "условия оплаты"

  preferred_unit_types:
    - "general_provision"
    - "obligation"

  excluded_unit_types:
    - "technical_fragment"
    - "appendix_reference"
    - "structural_anchor"

  preferred_clause_functions:
    - "limitations"
    - "remedies"

  position_bias:
    preferred_range: [0.0, 1.0]
    boost: 0.10
    scope: "segment"

  rerank: true
  filters: {}

conditional: null

enrichment_hints:
  preferred_segment_types:
    - "contract"
    - "amendment"
    - "annex"
  excluded_segment_types:
    - "technical_specification"
    - "price_list"
    - "invoice"
    - "act"
    - "schedule"
  confidence_bonus_on_match: 0.10
  confidence_penalty_on_excluded_segment: 0.15

extraction:
  enabled: true
  mode: "hybrid"
  llm_max_tokens: 1300

  presence_signal:
    field: "liability_caps_status"
    present_values: ["present"]
    missing_values: ["missing"]
    unclear_values: ["unclear"]

  llm_prompt_extraction: |
    <role>
    Ты — юрист по коммерческим договорам и ограничениям ответственности.
    Твоя задача — точно извлечь структуру ограничений ответственности:
    cap, basket / de minimis, механику basket и carve-out
    для ключевых рисков.

    КРИТИЧЕСКИ ВАЖНО:
    - Извлекай ТОЛЬКО то, что прямо написано в тексте.
    - НЕ додумывай cap, basket, de minimis или carve-out,
      если они не указаны.
    - НЕ смешивай этот check с общим анализом indemnity
      и не подменяй его анализом исключённых видов убытков.
    - Если фрагментов недостаточно для уверенного вывода —
      ставь "unclear".
    - Если раздел о лимитах / порогах / carve-out в договоре
      отсутствует полностью — liability_caps_status = "missing".
    - Если тексты по теме есть, но надёжный вывод сделать нельзя —
      liability_caps_status = "unclear".
    </role>

    <context_rules>
    - Некоторые фрагменты могут быть нерелевантны — игнорируй их.
    - Если есть противоречия между фрагментами — используй "unclear"
      и опиши это в reason.
    - Используй "no" только если текст по существу показывает
      отсутствие cap / basket / carve-out, а не просто не содержит
      упоминания в коротком фрагменте.
    - Если релевантной информации недостаточно — используй "unclear".
    - Не опирайся на рыночную практику и не восстанавливай пропущенные условия.
    - Если ни один фрагмент не содержит информации о лимитах и порогах — liability_caps_status = "missing", location = null. Не использовать "unclear" при полном отсутствии релевантных фрагментов.
    </context_rules>

    <context>
    Ниже приведены релевантные фрагменты договора:

    {context}
    </context>

    <task>
    Заполни только следующие поля:
    - caps_display
    - liability_caps_status
    - has_liability_cap
    - cap_description
    - has_basket
    - basket_type
    - has_de_minimis
    - has_key_carveouts
    - carveouts_summary
    - reason
    </task>

    <location_instructions>
    Для каждого поля по возможности укажи location в формате:
    {"clause_ref": "п. 12.1", "page": 7, "quote": "дословная фраза из договора"}

    Правила:
    - clause_ref — короткая ссылка на пункт / раздел / статью именно в том
      виде, как она написана в договоре;
    - page — целое число страницы;
    - quote — дословная фраза из текста договора (НЕ пересказ, НЕ парафраз).
      Копируй её посимвольно, сохраняя формулировку и порядок слов.
      Оптимальная длина: 30–300 символов.
    - Для synthesized-поля caps_display и reason
      location ВСЕГДА null.
    - Для cap_description — quote обязательна, если cap прямо указан.
    - Для carveouts_summary — quote с наиболее репрезентативной
      фразой carve-out (если категорий несколько, выбери одну).
    - Для liability_caps_status = "missing" — location = null.
    - Для liability_caps_status = "present" / "unclear" — quote
      с наиболее релевантной фразой договора.
    - Для has_liability_cap, has_basket, has_de_minimis, has_key_carveouts
      и basket_type:
      * если значение определённое ("yes" / "tipping" / "deductible" /
        "partial") — quote с фразой-основанием;
      * если значение = "no" — различай два случая:
        - договор ПРЯМО фиксирует отсутствие («Ответственность
          не ограничена», «Basket не применяется», «Carve-out
          не предусмотрены») — quote ОБЯЗАТЕЛЬНА;
        - просто отсутствует упоминание — location = null;
      * если значение = "unclear" — location = null.
    - Не выдумывай location или quote. Если дословную фразу определить
      нельзя — location = null.
    </location_instructions>

    <instructions>
    Шаг 0 — НАЛИЧИЕ РЕГУЛИРОВАНИЯ ОГРАНИЧЕНИЙ ОТВЕТСТВЕННОСТИ

    Заполни "liability_caps_status".

    Значения:
    - "present" — если хотя бы одно содержательное поле указывает на наличие информации по теме:
      * has_liability_cap = "yes";
      * has_basket = "yes";
      * basket_type ∈ {"tipping", "deductible"};
      * has_de_minimis = "yes";
      * has_key_carveouts ∈ {"yes", "partial"};
      * ЛИБО любое поле = "no" / "partial" / "tipping" / "deductible", но с заполненным location с прямой цитатой (см. RF3).
    - "missing" — если все содержательные поля = "no" / "not_applicable" / "Не предусмотрен" БЕЗ цитат, ЛИБО фрагментов по теме нет вообще.
    - "unclear" — если все содержательные = "unclear" при наличии фрагментов, но невозможности вывода.

    Шаг 1 — ЛИМИТ ОТВЕТСТВЕННОСТИ (CAP)

    Заполни "has_liability_cap" и "cap_description".

    Значения для has_liability_cap:
    - "yes" — cap прямо установлен.
    - "no" — cap отсутствует по тексту.
    - "unclear" — нельзя определить.

    Правила для cap_description:
    - Если cap есть: "USD 1M", "50% от суммы", "стоимость договора",
      "12 мес. платежей"
    - Если cap нет: "Не установлен"
    - Если нельзя определить: "Не удалось определить"

    Шаг 2 — BASKET

    Заполни "has_basket" и "basket_type".

    Значения для has_basket:
    - "yes" — basket / aggregate threshold есть.
    - "no" — basket нет.
    - "unclear" — нельзя определить.

    Значения для basket_type:
    - "tipping" — после порога возмещается весь ущерб.
    - "deductible" — возмещается только превышение порога.
    - "not_applicable" — basket нет.
    - "unclear" — тип нельзя определить.

    Шаг 3 — DE MINIMIS

    Заполни "has_de_minimis".

    Значения:
    - "yes" — минимальный размер отдельной претензии установлен.
    - "no" — нет.
    - "unclear" — нельзя определить.

    Шаг 4 — CARVE-OUT ДЛЯ КЛЮЧЕВЫХ РИСКОВ

    Заполни "has_key_carveouts" и "carveouts_summary".

    Значения для has_key_carveouts:
    - "yes" — ключевые риски выведены из-под cap / basket.
    - "no" — carve-out нет.
    - "partial" — carve-out есть только для части ключевых категорий.
    - "unclear" — нельзя определить.

    Правила для carveouts_summary:
    - Если есть или partial — перечисли категории через ";"
      и не более 4 категорий:
      "fraud; gross negligence; sanctions"
      "fraud; IP; data breach"
    - Если carve-out нет: "Не предусмотрено"
    - Если нельзя определить: "Не удалось определить"

    Шаг 5 — НОРМАЛИЗОВАННЫЙ DISPLAY ДЛЯ DD GRID

    Заполни "caps_display".

    Это итоговое поле для таблицы.
    Строй его ТОЛЬКО на основе уже заполненных полей выше.
    Не добавляй информацию сверх них.

    Правила:
    - Если liability_caps_status = "missing":
      "Раздел о лимитах и порогах в договоре не обнаружен"
    - Если все поля unclear:
      "Не удалось определить структуру ограничений"
    - Если has_liability_cap = "no"
      и has_basket = "no"
      и has_key_carveouts = "no":
      "Нет cap; нет basket; нет carve-out"
    - Иначе:
      * если cap есть — "Cap: {cap_description}"
      * если basket есть — "tipping basket" / "deductible basket"
      * если de minimis есть — "de minimis есть"
      * если carve-out есть или partial —
        "carve-out: {краткий перечень}"
    - Не более 4 коротких фактов через ";".

    Шаг 6 — ОБОСНОВАНИЕ

    Заполни "reason".

    Правила:
    - Первое предложение — краткий вывод.
    - Второе — короткая цитата из текста (до 100 символов).
    - Пиши по-русски.
    </instructions>

    <edge_cases>
    - Cap отсутствует:
      * liability_caps_status = "present"
      * has_liability_cap = "no"
      * cap_description = "Не установлен"

    - Basket нет:
      * liability_caps_status = "present"
      * has_basket = "no"
      * basket_type = "not_applicable"

    - Carve-out только для fraud:
      * liability_caps_status = "present"
      * has_key_carveouts = "partial"
      * carveouts_summary = "fraud"

    - Нет cap, basket и carve-out:
      * liability_caps_status = "present"
      * caps_display = "Нет cap; нет basket; нет carve-out"

    - Договор прямо фиксирует отсутствие cap:
      * liability_caps_status = "present"
      * has_liability_cap = "no"
      * location с прямой цитатой об отсутствии cap.

    - Нет релевантных фрагментов / раздел о лимитах в договоре отсутствует:
      * liability_caps_status = "missing"
      * has_liability_cap = "no"
      * cap_description = "Не установлен"
      * has_basket = "no"
      * basket_type = "not_applicable"
      * has_de_minimis = "no"
      * has_key_carveouts = "no"
      * carveouts_summary = "Не предусмотрено"
      * caps_display = "Раздел о лимитах и порогах в договоре не обнаружен"
      * location у всех полей = null.

    - Формулировки есть, но вывод невозможен:
      * liability_caps_status = "unclear"
      * соответствующие поля = "unclear"
    </edge_cases>

    <output_expectations>
    - Верни результат строго в формате JSON.
    - Не оборачивай в markdown-блоки (без ```).
    - Не добавляй комментариев вне JSON.
    - Все значения полей с allowed_values — на английском.
    - Свободные текстовые поля (caps_display, cap_description,
      carveouts_summary, reason) — на русском языке.
    - Не добавляй полей, кроме указанных.
    - Для каждого поля возвращай объект с ключами
      "value", "confidence", "location".

    Пример структуры ответа:
    {
      "caps_display": {"value": "Cap: стоимость договора; tipping basket; carve-out: fraud; sanctions", "confidence": 0.92, "location": null},
      "liability_caps_status": {"value": "present", "confidence": 0.95, "location": {"clause_ref": "п. 11.1", "page": 7, "quote": "Совокупная ответственность Исполнителя ограничена стоимостью договора"}},
      "has_liability_cap": {"value": "yes", "confidence": 0.95, "location": {"clause_ref": "п. 11.1", "page": 7, "quote": "Совокупная ответственность Исполнителя ограничена стоимостью договора"}},
      "cap_description": {"value": "стоимость договора", "confidence": 0.90, "location": {"clause_ref": "п. 11.1", "page": 7, "quote": "ограничена стоимостью договора"}},
      "has_basket": {"value": "yes", "confidence": 0.85, "location": {"clause_ref": "п. 11.2", "page": 7, "quote": "Претензии рассматриваются только при превышении совокупного порога 5% от стоимости договора"}},
      "basket_type": {"value": "tipping", "confidence": 0.85, "location": {"clause_ref": "п. 11.2", "page": 7, "quote": "при превышении совокупного порога 5% от стоимости договора"}},
      "has_de_minimis": {"value": "no", "confidence": 0.70, "location": null},
      "has_key_carveouts": {"value": "yes", "confidence": 0.90, "location": {"clause_ref": "п. 11.4", "page": 7, "quote": "Ограничения не применяются к случаям мошенничества и нарушения санкционного законодательства"}},
      "carveouts_summary": {"value": "fraud; sanctions", "confidence": 0.85, "location": {"clause_ref": "п. 11.4", "page": 7, "quote": "не применяются к случаям мошенничества и нарушения санкционного законодательства"}},
      "reason": {"value": "...", "confidence": 0.90, "location": null}
    }
    </output_expectations>

  fields:
    - name: "caps_display"
      type: "string"
      presentation: "fact"
      label: "Caps / basket / carve-out"
      description: "Нормализованный user-facing вывод для DD Grid"
      display_in_grid: true
      display_priority: 1

    - name: "liability_caps_status"
      type: "string"
      presentation: "signal"
      risk_weight: "info"
      description: "Наличие регулирования лимитов и порогов ответственности в договоре"
      display_in_grid: false
      allowed_values:
        - "present"
        - "missing"
        - "unclear"

    - name: "has_liability_cap"
      type: "string"
      presentation: "signal"
      risk_weight: "high"
      description: "Наличие лимита ответственности"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
      display_in_grid: false

    - name: "cap_description"
      type: "string"
      presentation: "fact"
      label: "Размер и база cap"
      description: "Размер и база лимита ответственности"
      display_in_grid: true
      display_priority: 2

    - name: "has_basket"
      type: "string"
      presentation: "signal"
      risk_weight: "medium"
      description: "Наличие basket"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
      display_in_grid: false

    - name: "basket_type"
      type: "string"
      presentation: "signal"
      risk_weight: "medium"
      description: "Тип basket"
      allowed_values:
        - "tipping"
        - "deductible"
        - "not_applicable"
        - "unclear"
      display_in_grid: false

    - name: "has_de_minimis"
