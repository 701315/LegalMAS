id: "liability_caps_and_baskets"
name: "Лимиты ответственности и пороги (caps, baskets)"
description: >
  Анализирует структуру лимитов ответственности (caps), порогов
  (basket, de minimis) и carve-out для ключевых рисков.

  Извлекает: наличие и размер cap, наличие basket / de minimis,
  механику basket (tipping vs. deductible), категории рисков,
  выведенных из-под ограничений (fraud, gross negligence,
  санкции, IP, данные, compliance).

  Формирует краткий user-facing вывод и оценивает соразмерность
  ограничений масштабу договора.

  Верхнеуровневый анализ объёма ответственности и indemnity
  выполняется чеком liability_and_indemnity_scope.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"
ui_mode: "field_extraction"

rules:
  keyword_mode: any

  keywords:
    high:
      # Cap / лимит ответственности
      - "(?i)aggregate\\s+liability\\s+(shall\\s+)?not\\s+exceed"
      - "(?i)total\\s+liability\\s+[\\s\\S]{0,40}(shall\\s+)?not\\s+exceed"
      - "(?i)maximum\\s+(aggregate\\s+)?liability"
      - "(?i)liability\\s+cap"
      - "(?i)cap\\s+on\\s+(aggregate\\s+)?liability"
      - "(?i)лимит\\s+ответственност[ьи]"
      - "(?i)максимальн[а-я]+\\s+(размер|сумм[аы])\\s+ответственност[ьи]"
      - "(?i)предел[ы]?\\s+ответственност[ьи]"

      # Basket
      - "(?i)aggregate\\s+basket"
      - "(?i)basket\\s+(threshold|amount)"
      - "(?i)tipping\\s+basket"
      - "(?i)first[-\\s]?dollar\\s+basket"
      - "(?i)deductible\\s+basket"
      - "(?i)совокупн[а-я]+\\s+порог\\s+убытк[ов]"
      - "(?i)порог\\s+претенз[ийи]"

      # De minimis
      - "(?i)\\bde\\s+minimis\\b"
      - "(?i)minimum\\s+claim\\s+(amount|threshold)"
      - "(?i)individual\\s+claim\\s+threshold"
      - "(?i)минимальн[а-я]+\\s+(размер|сумм[аы])\\s+претенз[ийи]"

      # Carve-out — ключевые формулировки
      - "(?i)carve[-\\s]?out[\\s\\S]{0,30}(fraud|willful|gross\\s+negligence|санкци|IP|данных)"
      - "(?i)except(ion)?\\s+for[\\s\\S]{0,30}(fraud|willful|gross\\s+negligence)"
      - "(?i)shall\\s+not\\s+apply\\s+to[\\s\\S]{0,30}(fraud|willful|gross)"
      - "(?i)(fraud|willful\\s+misconduct|gross\\s+negligence)[\\s\\S]{0,30}(excluded?|not\\s+subject)"
      - "(?i)исключ[а-я]+\\s+из[-\\s]?под\\s+(лимит|cap|ограничен)"

    medium:
      # Cap — общие
      - "(?i)\\bcap\\b"
      - "(?i)aggregate\\s+liability"
      - "(?i)в\\s+совокупности"
      - "(?i)совокупн[а-я]+\\s+ответственност[ьи]"

      # Basket / threshold — общие
      - "(?i)\\bbasket\\b"
      - "(?i)aggregate\\s+threshold"
      - "(?i)threshold\\s+amount"
      - "(?i)порог[аи]?\\s+(для\\s+)?претенз[ийи]"

      # De minimis — общие
      - "(?i)minimum\\s+(amount|threshold)"
      - "(?i)минимальн[а-я]+\\s+сумм[аы]"

      # Deductible / excess
      - "(?i)\\bdeductible\\b"
      - "(?i)\\bexcess\\b"
      - "(?i)вычет\\s+из\\s+возмещени[яи]"

      # Carve-out категории
      - "(?i)\\bfraud\\b"
      - "(?i)willful\\s+misconduct"
      - "(?i)gross\\s+negligence"
      - "(?i)грубая\\s+неосторожность"
      - "(?i)мошенничеств[оа]"
      - "(?i)санкци[яий]"
      - "(?i)sanctions?\\s+(violation|breach)"
      - "(?i)(IP|intellectual\\s+property)\\s+(infringement|breach)"
      - "(?i)data\\s+(breach|protection)[\\s\\S]{0,20}(carve|exclude|not\\s+apply)"
      - "(?i)breach\\s+of\\s+confidentiality[\\s\\S]{0,20}(carve|exclude|not\\s+apply)"

    low:
      - "(?i)liability\\s+cap"
      - "(?i)aggregate\\s+basket"
      - "(?i)de\\s+minimis"
      - "(?i)tipping\\s+basket"
      - "(?i)carve[-\\s]?out"
      - "(?i)fraud"
      - "(?i)willful\\s+misconduct"
      - "(?i)gross\\s+negligence"
      - "(?i)sanctions?\\s+violation"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 640

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  context_k: 5
  max_chunks: 10
  boost_keywords:
    - "aggregate liability shall not exceed"
    - "maximum liability"
    - "liability cap"
    - "cap on liability"
    - "лимит ответственности"
    - "максимальный размер ответственности"
    - "предел ответственности"
    - "aggregate basket"
    - "basket threshold"
    - "tipping basket"
    - "deductible basket"
    - "de minimis"
    - "minimum claim amount"
    - "минимальный размер претензии"
    - "carve-out"
    - "except for fraud"
    - "willful misconduct"
    - "gross negligence"
    - "грубая неосторожность"
    - "sanctions violation"
    - "IP infringement"
    - "data breach"
  rerank: true
  filters: {}

conditional: null

enrichment_hints:
  preferred_segment_types:
    - "contract"
    - "amendment"
    - "annex"
  excluded_segment_types:
    - "technical_specification"
    - "price_list"
    - "invoice"
    - "act"
    - "schedule"
  preferred_clause_functions:
    - "liability"
    - "limitation_of_liability"
    - "indemnification"
  confidence_bonus_on_match: 0.10
  confidence_penalty_on_excluded_segment: 0.15

extraction:
  enabled: true
  mode: "hybrid"
  llm_max_tokens: 440
  llm_prompt_extraction: |
    <role>
    Ты — юрист по M&A и коммерческим контрактам.
    Твоя задача — точно извлечь из текста структуру ограничений
    ответственности: caps, basket / de minimis, механику basket,
    carve-out для ключевых рисков.
    </role>

    <context>
    Ниже приведены релевантные фрагменты договора:

    {context}
    </context>

    <task>
    Заполни только следующие поля:
    - caps_display
    - has_liability_cap
    - cap_description
    - has_basket
    - basket_type
    - has_de_minimis
    - has_key_carveouts
    - carveouts_summary
    - red_flags
    - reason

    Важно:
    - не анализируй общий объём ответственности и indemnity —
      это задача чека liability_and_indemnity_scope;
    - не анализируй исключения видов убытков (indirect, loss of
      profit) — это задача чека liability_exclusions;
    - пиши user-facing значения коротко и по-русски.
    </task>

    <instructions>
    Шаг 1 — НАЛИЧИЕ ЛИМИТА ОТВЕТСТВЕННОСТИ (CAP)

    Заполни поле "has_liability_cap".

    Значения:
    - "yes" — cap явно установлен.
    - "no" — cap отсутствует.
    - "unclear" — неясно.

    Заполни поле "cap_description".

    Правила:
    - Если cap есть: "Стоимость договора", "12-месячные платежи",
      "USD 1M", "50% от суммы договора"
    - Если нет: "Не установлен"
    - Если неясно: "Не удалось определить"

    Шаг 2 — НАЛИЧИЕ BASKET

    Заполни поля "has_basket" и "basket_type".

    Значения для has_basket:
    - "yes" — basket есть.
    - "no" — нет.
    - "unclear" — неясно.

    Значения для basket_type:
    - "tipping" — tipping basket (первый доллар возмещается
      с момента превышения порога).
    - "deductible" — deductible basket (только сумма превышения).
    - "not_applicable" — basket нет.
    - "unclear" — тип неясен.

    Шаг 3 — НАЛИЧИЕ DE MINIMIS

    Заполни поле "has_de_minimis".

    Значения:
    - "yes" — минимальный порог отдельной претензии установлен.
    - "no" — нет.
    - "unclear" — неясно.

    Шаг 4 — CARVE-OUT ДЛЯ КЛЮЧЕВЫХ РИСКОВ

    Заполни поля "has_key_carveouts" и "carveouts_summary".

    Значения для has_key_carveouts:
    - "yes" — ключевые риски выведены из-под cap / basket.
    - "no" — carve-out нет, ограничения применяются ко всему.
    - "partial" — часть ключевых рисков выведена, часть нет.
    - "unclear" — неясно.

    Для carveouts_summary перечисли выведенные категории через ";":
    - "fraud; willful misconduct; gross negligence"
    - "fraud; sanctions; IP; data breach"
    - Если нет: "Не предусмотрено"
    - Если неясно: "Не удалось определить"

    Шаг 5 — RED FLAGS

    Заполни поле "red_flags".

    Используй:
    - "NONE" — cap разумный, basket / de minimis адекватны,
      ключевые риски выведены из-под ограничений.
    - "UNCLEAR" — данных недостаточно.
    - Коды через запятую:
      * LIAB4 — нет разумного cap при существенных обязательствах,
        или cap несоразмерно низкий.
      * LIAB5 — нет carve-out для ключевых высокорисковых категорий
        (fraud, gross negligence, санкции, IP, данные, compliance).

    Шаг 6 — USER-FACING SUMMARY

    Заполни поле "caps_display".

    Примеры:
    - "Cap: стоимость договора; tipping basket 1%; de minimis есть;
       carve-out: fraud, sanctions"
    - "Нет cap; нет basket; нет carve-out"
    - "Cap: 12 мес. платежей; deductible basket;
       carve-out: fraud, IP"
    - "Не удалось определить структуру ограничений"

    Правила:
    - Отрази максимум 4 ключевых факта через ";".
    - Если нет ни cap, ни basket, ни carve-out:
      "Нет cap; нет basket; нет carve-out"
    - Если всё unclear:
      "Не удалось определить структуру ограничений"

    Шаг 7 — ОБОСНОВАНИЕ

    Заполни поле "reason".

    Правила:
    - 1–2 коротких предложения.
    - Укажи: cap, basket, de minimis, carve-out, почему red_flags.
    - Приведи короткую цитату в кавычках.
    - Если NONE — почему структура сбалансирована.
    </instructions>

    <edge_cases>
    - Нет cap, ответственность иначе не ограничена:
      * has_liability_cap = "no"
      * red_flags включает "LIAB4"

    - Cap низкий (10% от цены) при широких warranty:
      * has_liability_cap = "yes"
      * cap_description = "10% от цены договора"
      * red_flags включает "LIAB4"
      * в reason: cap несоразмерен потенциальным рискам

    - Cap 100% цены, carve-out для fraud, gross negligence,
      sanctions, IP, data breach:
      * сбалансированная конструкция
      * red_flags = "NONE"

    - Basket механика не уточнена:
      * basket_type = "unclear"
      * в reason: неопределённость механики

    - Carve-out только для fraud, но не для sanctions / IP:
      * has_key_carveouts = "partial"
      * carveouts_summary = "fraud"
      * red_flags может включать "LIAB5"

    - Cap только для warranty, indemnity без cap:
      * cap_description = "только warranty claims"
      * в reason: частичный cap

    - Нет релевантных фрагментов:
      * все поля = "unclear"
      * red_flags = "UNCLEAR"
      * caps_display =
        "Не удалось определить структуру ограничений"
    </edge_cases>

    <output_expectations>
    Все значения должны быть короткими, точными и пригодными
    для отображения пользователю в DD Grid.
    Не добавляй никаких полей, кроме указанных в схеме extraction.
    </output_expectations>

  fields:
    - name: "caps_display"
      type: "string"
      description: "Caps / basket / carve-out: краткий вывод"

    - name: "has_liability_cap"
      type: "string"
      description: "Наличие лимита ответственности"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "cap_description"
      type: "string"
      description: "Размер и база cap"

    - name: "has_basket"
      type: "string"
      description: "Наличие basket (агрегатный порог)"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "basket_type"
      type: "string"
      description: "Тип basket"
      allowed_values:
        - "tipping"
        - "deductible"
        - "not_applicable"
        - "unclear"

    - name: "has_de_minimis"
      type: "string"
      description: "Минимальный порог претензии"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "has_key_carveouts"
      type: "string"
      description: "Carve-out для ключевых рисков"
      allowed_values:
        - "yes"
        - "no"
        - "partial"
        - "unclear"

    - name: "carveouts_summary"
      type: "string"
      description: "Перечень выведенных категорий рисков"

    - name: "red_flags"
      type: "string"
      description: "Коды рисков"

    - name: "reason"
      type: "string"
      description: "Обоснование"

  store_payload: true

      