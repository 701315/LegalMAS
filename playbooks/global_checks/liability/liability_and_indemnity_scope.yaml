id: "liability_and_indemnity_scope"
name: "Общий объём ответственности и indemnity"
description: >
  Анализирует общий объём ответственности сторон и формулировки
  indemnity: наличие и уровень caps (ограничений по сумме),
  исключения видов убытков, широту обязательств indemnify /
  hold harmless, значимые штрафы и liquidated damages, баланс
  защиты между Target и контрагентом.

  Формирует краткий user-facing вывод и оценивает риск-профиль
  ответственности Target.

  Детальный анализ структуры caps / basket / de minimis /
  carve-out выполняется чеком liability_caps_and_baskets.
  Детальный анализ исключений видов убытков выполняется чеком
  liability_exclusions.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"
ui_mode: "field_extraction"

rules:
  keyword_mode: any

  keywords:
    high:
      # Неограниченная ответственность
      - "(?i)unlimited\\s+liability"
      - "(?i)неограниченн[а-я]+\\s+ответственност[ьи]"
      - "(?i)без\\s+ограничени[яий]\\s+ответственност[ьи]"
      - "(?i)shall\\s+be\\s+liable\\s+without\\s+(any\\s+)?limit(ation)?"
      - "(?i)полн[а-я]+\\s+ответственност[ьи]\\s+без\\s+ограничени[яй]"

      # Широкая indemnity
      - "(?i)indemnif(y|ies|ied|ication)[\\s\\S]{0,40}any\\s+and\\s+all\\s+(loss|damage|claim|cost|expense)"
      - "(?i)возмест(ить|ит|ят)[\\s\\S]{0,20}любые\\s+(и\\s+все\\s+)?(убытки|потери|расходы|ущерб)"
      - "(?i)any\\s+and\\s+all\\s+loss(es)?[,\\s]+(damage|cost|expense|claim|liability)"
      - "(?i)все\\s+без\\s+исключени[яи]\\s+(убытки|потери|расходы)"

      # Hold harmless
      - "(?i)hold\\s+harmless"
      - "(?i)indemnif(y|ies)[,\\s]+defend[,\\s]+and\\s+hold\\s+harmless"
      - "(?i)defend[,\\s]+indemnif(y|ies)"

      # Cap — точные формулировки
      - "(?i)aggregate\\s+liability\\s+(shall\\s+)?not\\s+exceed"
      - "(?i)maximum\\s+(aggregate\\s+)?liability"
      - "(?i)liability\\s+cap"
      - "(?i)лимит\\s+ответственност[ьи]"
      - "(?i)максимальн[а-я]+\\s+(размер|сумм[аы])\\s+ответственност[ьи]"

    medium:
      # Indemnity / indemnification — общие
      - "(?i)indemnif(y|ies|ied|ication)"
      - "(?i)indemnity"
      - "(?i)возмещени[ея]\\s+(убытков|потерь|ущерба|расходов)"

      # Cap — общие
      - "(?i)cap\\s+on\\s+liability"
      - "(?i)total\\s+liability[\\s\\S]{0,40}not\\s+exceed"
      - "(?i)ограничени[ея]\\s+ответственност[ьи]"
      - "(?i)предел[ы]?\\s+ответственност[ьи]"
      - "(?i)ответственность[\\s\\S]{0,40}не\\s+(может|должна)\\s+превышать"

      # Exclusion косвенных убытков
      - "(?i)exclud(e|es|ed|ing)[\\s\\S]{0,30}(indirect|consequential|special|incidental)"
      - "(?i)не\\s+отвеча[еюя]т\\s+за\\s+упущенн[а-я]+\\s+выгод"
      - "(?i)lost\\s+profits"
      - "(?i)упущенн[а-я]+\\s+выгод[аыу]"

      # Liquidated damages
      - "(?i)liquidated\\s+damages"
      - "(?i)заранее\\s+оценённ[а-я]+\\s+убытк[иов]"
      - "(?i)agreed\\s+damages"

      # Штрафы / неустойки (в контексте ответственности)
      - "(?i)без\\s+(какого[-\\s]?либо\\s+)?лимит[аов][\\s\\S]{0,30}(штраф|неустойк|пен[яи])"
      - "(?i)штраф[\\s\\S]{0,20}(неограниченн|без\\s+предела|без\\s+cap)"
      - "(?i)кумулятивн[а-я]+\\s+(штраф|неустойк)"

    low:
      - "(?i)unlimited\\s+liability"
      - "(?i)hold\\s+harmless"
      - "(?i)indemnif(y|ies)"
      - "(?i)any\\s+and\\s+all\\s+losses"
      - "(?i)liability\\s+cap"
      - "(?i)liquidated\\s+damages"
      - "(?i)лимит\\s+ответственност"
      - "(?i)неограниченн[а-я]+\\s+ответственност"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 640

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  context_k: 5
  max_chunks: 10
  boost_keywords:
    - "unlimited liability"
    - "неограниченная ответственность"
    - "indemnify"
    - "indemnity"
    - "indemnification"
    - "hold harmless"
    - "any and all losses"
    - "возместить любые убытки"
    - "liability cap"
    - "aggregate liability shall not exceed"
    - "ограничение ответственности"
    - "предел ответственности"
    - "indirect damages"
    - "consequential damages"
    - "косвенные убытки"
    - "упущенная выгода"
    - "liquidated damages"
    - "заранее оценённые убытки"
  rerank: true
  filters: {}

conditional: null

enrichment_hints:
  preferred_segment_types:
    - "contract"
    - "amendment"
    - "annex"
  excluded_segment_types:
    - "technical_specification"
    - "price_list"
    - "invoice"
    - "act"
    - "schedule"
  preferred_clause_functions:
    - "liability"
    - "indemnification"
    - "limitation_of_liability"
  confidence_bonus_on_match: 0.10
  confidence_penalty_on_excluded_segment: 0.15

extraction:
  enabled: true
  mode: "hybrid"
  llm_max_tokens: 420
  llm_prompt_extraction: |
    <role>
    Ты — юрист по контрактному праву и управлению рисками.
    Твоя задача — точно извлечь из текста:
    1) ограничена ли ответственность Target (limited / unlimited);
    2) каков объём и характер indemnity;
    3) есть ли значимые штрафы / liquidated damages.

    Детальный анализ caps / basket / de minimis / carve-out
    выполняется отдельным чеком liability_caps_and_baskets.
    Детальный анализ исключений видов убытков выполняется
    отдельным чеком liability_exclusions.
    </role>

    <context>
    Ниже приведены релевантные фрагменты договора:

    {context}
    </context>

    <task>
    Заполни только следующие поля:
    - liability_display
    - liability_general
    - indemnity_scope
    - indemnity_beneficiary
    - has_significant_penalties
    - red_flags
    - reason

    Важно:
    - не анализируй детально caps / basket / de minimis —
      это задача чека liability_caps_and_baskets;
    - не анализируй детально исключения видов убытков —
      это задача чека liability_exclusions;
    - пиши user-facing значения коротко и по-русски.
    </task>

    <instructions>
    Шаг 1 — ОБЩИЙ ХАРАКТЕР ОТВЕТСТВЕННОСТИ

    Заполни поле "liability_general".

    Значения:
    - "limited" — есть явные ограничения: caps, исключения
      косвенных убытков, иные чётко прописанные ограничения.
    - "unlimited" — прямые формулировки о неограниченной
      ответственности, или любые убытки без видимых caps /
      exclusions.
    - "unclear" — невозможно надёжно определить.

    Шаг 2 — МАСШТАБ INDEMNITY

    Заполни поле "indemnity_scope".

    Значения:
    - "none" — indemnity-обязательства отсутствуют.
    - "narrow" — indemnity ограничено конкретными рисками:
      нарушение IP, налоговые претензии, regulatory claims.
    - "broad" — "any and all losses, damages, fines, penalties,
      costs and expenses" без существенных carve-out.
    - "unclear" — неясно.

    Шаг 3 — В ЧЬЮ ПОЛЬЗУ INDEMNITY

    Заполни поле "indemnity_beneficiary".

    Значения:
    - "mutual" — обязательства симметричны для обеих сторон.
    - "counterparty" — преимущественно в пользу контрагента
      (Target обязана indemnify контрагента).
    - "target" — преимущественно в пользу Target.
    - "not_applicable" — indemnity нет.
    - "unclear" — неясно.

    Шаг 4 — ЗНАЧИМЫЕ ШТРАФЫ / LIQUIDATED DAMAGES

    Заполни поле "has_significant_penalties".

    Значения:
    - "yes" — есть: крупные liquidated damages, высокая дневная
      ставка без cap, кумулятивные штрафы без ограничения.
    - "no" — штрафы умеренные или отсутствуют.
    - "unclear" — невозможно оценить.

    Шаг 5 — RED FLAGS

    Заполни поле "red_flags".

    Используй:
    - "NONE" — если ответственность ограничена разумным cap,
      indemnity узкое или симметричное, штрафы умеренные.
    - "UNCLEAR" — если данных недостаточно.
    - Коды через запятую:
      * LIAB1 — неограниченная или непропорциональная
        ответственность Target при ограниченной ответственности
        контрагента.
      * LIAB2 — очень широкая indemnity в пользу контрагента
        (any and all losses, включая косвенные убытки и штрафы)
        без существенных carve-out или caps.
      * LIAB3 — значительные liquidated damages или штрафные
        неустойки без разумного cap, несоразмерные характеру
        нарушения.

    Шаг 6 — USER-FACING SUMMARY

    Заполни поле "liability_display".

    Примеры:
    - "Ответственность ограничена; indemnity широкая в пользу
       контрагента; значимые штрафы"
    - "Ответственность неограниченная; hold harmless без cap"
    - "Ответственность ограничена; indemnity узкое; штрафы умеренные"
    - "Не удалось определить объём ответственности"

    Правила:
    - Отрази максимум 3 ключевых факта через ";".
    - Если всё unclear:
      "Не удалось определить объём ответственности"

    Шаг 7 — ОБОСНОВАНИЕ

    Заполни поле "reason".

    Правила:
    - 1–2 коротких предложения.
    - Укажи: тип ответственности, характер indemnity, штрафы,
      почему выставлены red_flags.
    - Приведи короткую цитату в кавычках.
    - Если NONE — почему конструкция ответственности приемлема.
    </instructions>

    <edge_cases>
    - "Unlimited liability" или "any and all losses" без caps:
      * liability_general = "unlimited"
      * red_flags включает "LIAB1"

    - Cap на уровне стоимости договора + исключение косвенных:
      * liability_general = "limited"
      * в reason: разумное ограничение

    - "Any and all losses" в indemnity без carve-out:
      * indemnity_scope = "broad"
      * если в пользу контрагента: red_flags включает "LIAB2"

    - Кумулятивные штрафы без cap:
      * has_significant_penalties = "yes"
      * red_flags включает "LIAB3"

    - Ответственность ограничена, indemnity узкое, штрафы 0.1%/день
      с cap 10%:
      * red_flags = "NONE"

    - Нет релевантных фрагментов:
      * все поля = "unclear"
      * red_flags = "UNCLEAR"
      * liability_display =
        "Не удалось определить объём ответственности"
    </edge_cases>

    <output_expectations>
    Все значения должны быть короткими, точными и пригодными
    для отображения пользователю в DD Grid.
    Не добавляй никаких полей, кроме указанных в схеме extraction.
    </output_expectations>

  fields:
    - name: "liability_display"
      type: "string"
      description: "Ответственность и indemnity: краткий вывод"

    - name: "liability_general"
      type: "string"
      description: "Общий характер ответственности"
      allowed_values:
        - "limited"
        - "unlimited"
        - "unclear"

    - name: "indemnity_scope"
      type: "string"
      description: "Масштаб indemnity"
      allowed_values:
        - "none"
        - "narrow"
        - "broad"
        - "unclear"

    - name: "indemnity_beneficiary"
      type: "string"
      description: "В чью пользу работает indemnity"
      allowed_values:
        - "mutual"
        - "counterparty"
        - "target"
        - "not_applicable"
        - "unclear"

    - name: "has_significant_penalties"
      type: "string"
      description: "Значимые штрафы / liquidated damages"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "red_flags"
      type: "string"
      description: "Коды рисков"

    - name: "reason"
      type: "string"
      description: "Обоснование"

  store_payload: true

      