id: "liability_and_indemnity_scope"
name: "Общий объём ответственности и indemnity"
group: "Liability"
description: >
  Анализирует общий объём ответственности сторон и формулировки
  indemnity: наличие и уровень caps (ограничений по сумме),
  исключения видов убытков, широту обязательств indemnify /
  hold harmless, значимые штрафы и liquidated damages, баланс
  защиты между Target и контрагентом.

  Формирует краткий user-facing вывод и оценивает риск-профиль
  ответственности Target.

  Детальный анализ структуры caps / basket / de minimis /
  carve-out выполняется чеком liability_caps_and_baskets.
  Детальный анализ исключений видов убытков выполняется чеком
  liability_exclusions.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"
ui_mode: "field_extraction"

rules:
  keyword_mode: any

  keywords:
    high:
      # Неограниченная ответственность
      - "(?i)unlimited\\s+liability"
      - "(?i)неограниченн[а-я]+\\s+ответственност[ьи]"
      - "(?i)без\\s+ограничени[яий]\\s+ответственност[ьи]"
      - "(?i)shall\\s+be\\s+liable\\s+without\\s+(any\\s+)?limit(ation)?"
      - "(?i)полн[а-я]+\\s+ответственност[ьи]\\s+без\\s+ограничени[яй]"

      # Широкая indemnity
      - "(?i)indemnif(y|ies|ied|ication)[\\s\\S]{0,40}any\\s+and\\s+all\\s+(loss|damage|claim|cost|expense)"
      - "(?i)возмест(ить|ит|ят)[\\s\\S]{0,20}любые\\s+(и\\s+все\\s+)?(убытки|потери|расходы|ущерб)"
      - "(?i)any\\s+and\\s+all\\s+loss(es)?[,\\s]+(damage|cost|expense|claim|liability)"
      - "(?i)все\\s+без\\s+исключени[яи]\\s+(убытки|потери|расходы)"

      # Hold harmless
      - "(?i)hold\\s+harmless"
      - "(?i)indemnif(y|ies)[,\\s]+defend[,\\s]+and\\s+hold\\s+harmless"
      - "(?i)defend[,\\s]+indemnif(y|ies)"

      # Cap — точные формулировки
      - "(?i)aggregate\\s+liability\\s+(shall\\s+)?not\\s+exceed"
      - "(?i)maximum\\s+(aggregate\\s+)?liability"
      - "(?i)liability\\s+cap"
      - "(?i)лимит\\s+ответственност[ьи]"
      - "(?i)максимальн[а-я]+\\s+(размер|сумм[аы])\\s+ответственност[ьи]"

    medium:
      # Indemnity / indemnification — общие
      - "(?i)indemnif(y|ies|ied|ication)"
      - "(?i)indemnity"
      - "(?i)возмещени[ея]\\s+(убытков|потерь|ущерба|расходов)"

      # Cap — общие
      - "(?i)cap\\s+on\\s+liability"
      - "(?i)total\\s+liability[\\s\\S]{0,40}not\\s+exceed"
      - "(?i)ограничени[ея]\\s+ответственност[ьи]"
      - "(?i)предел[ы]?\\s+ответственност[ьи]"
      - "(?i)ответственность[\\s\\S]{0,40}не\\s+(может|должна)\\s+превышать"

      # Exclusion косвенных убытков
      - "(?i)exclud(e|es|ed|ing)[\\s\\S]{0,30}(indirect|consequential|special|incidental)"
      - "(?i)не\\s+отвеча[еюя]т\\s+за\\s+упущенн[а-я]+\\s+выгод"
      - "(?i)lost\\s+profits"
      - "(?i)упущенн[а-я]+\\s+выгод[аыу]"

      # Liquidated damages
      - "(?i)liquidated\\s+damages"
      - "(?i)заранее\\s+оценённ[а-я]+\\s+убытк[иов]"
      - "(?i)agreed\\s+damages"

      # Штрафы / неустойки (в контексте ответственности)
      - "(?i)без\\s+(какого[-\\s]?либо\\s+)?лимит[аов][\\s\\S]{0,30}(штраф|неустойк|пен[яи])"
      - "(?i)штраф[\\s\\S]{0,20}(неограниченн|без\\s+предела|без\\s+cap)"
      - "(?i)кумулятивн[а-я]+\\s+(штраф|неустойк)"

    low:
      - "(?i)unlimited\\s+liability"
      - "(?i)hold\\s+harmless"
      - "(?i)indemnif(y|ies)"
      - "(?i)any\\s+and\\s+all\\s+losses"
      - "(?i)liability\\s+cap"
      - "(?i)liquidated\\s+damages"
      - "(?i)лимит\\s+ответственност"
      - "(?i)неограниченн[а-я]+\\s+ответственност"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 640

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  retrieval_profile: "indemnification_check"
  context_k: 5
  max_chunks: 10

  retrieval_query: >
    неограниченная ответственность возмещение убытков indemnity ограничение 
    ответственности лимит штрафы упущенная выгода liquidated damages

  boost_keywords:
    - "unlimited liability"
    - "неограниченная ответственность"
    - "indemnify"
    - "indemnity"
    - "indemnification"
    - "hold harmless"
    - "any and all losses"
    - "возместить любые убытки"
    - "liability cap"
    - "aggregate liability shall not exceed"
    - "ограничение ответственности"
    - "предел ответственности"
    - "indirect damages"
    - "consequential damages"
    - "косвенные убытки"
    - "упущенная выгода"
    - "liquidated damages"
    - "заранее оценённые убытки"

  negative_keywords:
    - "интеллектуальная собственность"
    - "персональные данные"
    - "конфиденциальная информация"
    - "форс-мажор"
    - "подсудность"

  preferred_unit_types:
    - "general_provision"
    - "obligation"

  excluded_unit_types:
    - "technical_fragment"
    - "appendix_reference"
    - "structural_anchor"

  preferred_clause_functions:
    - "limitations"
    - "remedies"

  position_bias:
    preferred_range: [0.0, 1.0]
    boost: 0.10
    scope: "segment"

  rerank: true
  filters: {}

conditional: null

enrichment_hints:
  preferred_segment_types:
    - "contract"
    - "amendment"
    - "annex"
  excluded_segment_types:
    - "technical_specification"
    - "price_list"
    - "invoice"
    - "act"
    - "schedule"
  confidence_bonus_on_match: 0.10
  confidence_penalty_on_excluded_segment: 0.15

extraction:
  enabled: true
  mode: "hybrid"
  llm_max_tokens: 1000

  presence_signal:
    field: "liability_status"
    present_values: ["present"]
    missing_values: ["missing"]
    unclear_values: ["unclear"]

  llm_prompt_extraction: |
    <role>
    Ты — юрист по коммерческим договорам и ответственности сторон.
    Твоя задача — точно извлечь из текста:
    1) есть ли в договоре регулирование ответственности и indemnity;
    2) если есть — каков общий объём:
       - характер ответственности (limited / unlimited);
       - масштаб indemnity;
       - в чью пользу работает indemnity;
       - наличие значимых штрафов / liquidated damages.

    КРИТИЧЕСКИ ВАЖНО:
    - Извлекай ТОЛЬКО то, что прямо написано в тексте.
    - НЕ делай выводов "по умолчанию" о наличии cap, indemnity
      или штрафов, если текст этого прямо не подтверждает.
    - НЕ подменяй этот check детальным анализом caps / basket / carve-out.
    - Если информация неоднозначна или фрагментов недостаточно —
      ставь "unclear".
    - Если раздел об ответственности / indemnity в договоре
      отсутствует полностью — liability_status = "missing".
    - Если тексты по теме есть, но надёжный вывод сделать нельзя —
      liability_status = "unclear".
    </role>

    <context_rules>
    - Некоторые фрагменты могут быть нерелевантны — игнорируй их.
    - Если фрагменты противоречат друг другу — используй "unclear"
      и объясни это в reason.
    - Используй "none" или "no" только если из текста
      по существу видно отсутствие indemnity / значимых штрафов,
      а не просто отсутствует упоминание в коротком фрагменте.
    - Если нет достаточной информации о блоке ответственности —
      используй "unclear".
    - Не используй информацию из definitions, если там нет
      substantive условий об ответственности.
    - Если ни один фрагмент не содержит информации об ответственности /
      indemnity / штрафах (нет упоминаний liability / indemnify /
      hold harmless / cap / liquidated damages) —
      liability_status = "missing", location = null.
      Не использовать "unclear" при полном отсутствии релевантных
      фрагментов.
    </context_rules>

    <context>
    Ниже приведены релевантные фрагменты договора:

    {context}
    </context>

    <task>
    Заполни только следующие поля:
    - liability_display
    - liability_status
    - liability_general
    - indemnity_scope
    - indemnity_beneficiary
    - has_significant_penalties
    - reason
    </task>

    <location_instructions>
    Для каждого поля по возможности укажи location в формате:
    {"clause_ref": "п. 12.1", "page": 7, "quote": "дословная фраза из договора"}

    Правила:
    - clause_ref — короткая ссылка на пункт / раздел / статью именно в том
      виде, как она написана в договоре;
    - page — целое число страницы;
    - quote — дословная фраза из текста договора (НЕ пересказ, НЕ парафраз).
      Копируй её посимвольно, сохраняя формулировку и порядок слов.
      Оптимальная длина: 30–300 символов.
    - Для synthesized-поля liability_display и reason
      location ВСЕГДА null.
    - Для liability_status = "missing" — location = null.
    - Для liability_status = "present" / "unclear" — quote
      с наиболее релевантной фразой договора.
    - Для liability_general:
      * если "limited" — quote с формулировкой cap / лимита;
      * если "unlimited" — quote с формулировкой неограниченной
        ответственности;
      * если "unclear" — location = null.
    - Для indemnity_scope и indemnity_beneficiary:
      * если значение определённое ("narrow" / "broad" / "mutual" /
        "counterparty" / "target") — quote с формулировкой indemnity;
      * если значение = "none" / "not_applicable" — quote ОБЯЗАТЕЛЬНА,
        только если из текста прямо следует отсутствие
        («Indemnity не применяется»), иначе location = null;
      * если "unclear" — location = null.
    - Для has_significant_penalties:
      * если "yes" — quote с формулировкой штрафа / liquidated damages;
      * если "no" — различай два случая:
        - договор прямо исключает существенные штрафы — quote
          ОБЯЗАТЕЛЬНА;
        - просто отсутствует упоминание — location = null;
      * если "unclear" — location = null.
    - Не выдумывай location или quote. Если дословную фразу определить
      нельзя — location = null.
    </location_instructions>

    <instructions>
    Шаг 0 — НАЛИЧИЕ РЕГУЛИРОВАНИЯ ОТВЕТСТВЕННОСТИ

    Заполни "liability_status".

    Значения:
    - "present" — если хотя бы одно содержательное поле указывает на наличие информации по теме:
      * liability_general = "limited";
      * indemnity_scope ∈ {"narrow", "broad"};
      * has_significant_penalties = "yes";
      * ЛИБО любое поле = "unlimited" / "none" / "not_applicable" / "no", но с заполненным location с прямой цитатой (см. RF3).
    - "missing" — если все содержательные поля = "unlimited" / "none" / "not_applicable" / "no" БЕЗ цитат, ЛИБО фрагментов по теме нет вообще.
    - "unclear" — если все содержательные = "unclear" при наличии фрагментов, но невозможности вывода.

    Шаг 1 — ОБЩИЙ ХАРАКТЕР ОТВЕТСТВЕННОСТИ

    Заполни "liability_general".

    Значения:
    - "limited" — есть явные ограничения ответственности:
      caps, исключения категорий убытков или иные текстовые лимитаторы.
    - "unlimited" — прямо указана неограниченная ответственность
      либо очень широкая формула ответственности без видимого
      ограничителя в самом релевантном блоке.
    - "unclear" — нельзя надёжно определить.

    Шаг 2 — МАСШТАБ INDEMNITY

    Заполни "indemnity_scope".

    Значения:
    - "none" — indemnity-обязательство отсутствует по существу.
    - "narrow" — indemnity ограничено конкретными рисками
      или узкими категориями требований.
    - "broad" — формула охватывает "любые и все убытки / расходы /
      требования" без существенных внутренних ограничений.
    - "unclear" — нельзя определить.

    Шаг 3 — В ЧЬЮ ПОЛЬЗУ РАБОТАЕТ INDEMNITY

    Заполни "indemnity_beneficiary".

    Значения:
    - "mutual" — симметрично для обеих сторон.
    - "counterparty" — преимущественно в пользу контрагента.
    - "target" — преимущественно в пользу Target.
    - "not_applicable" — indemnity нет.
    - "unclear" — нельзя определить.

    Шаг 4 — ЗНАЧИМЫЕ ШТРАФЫ / LIQUIDATED DAMAGES

    Заполни "has_significant_penalties".

    Значения:
    - "yes" — есть существенные штрафы, liquidated damages,
      высокая ставка без видимого ограничения
      или кумулятивные штрафы.
    - "no" — существенных штрафов нет или штрафы выглядят умеренными.
    - "unclear" — нельзя определить.

    Шаг 5 — НОРМАЛИЗОВАННЫЙ DISPLAY ДЛЯ DD GRID

    Заполни "liability_display".

    Это итоговое поле для таблицы.
    Строй его ТОЛЬКО на основе уже заполненных полей выше.
    Не добавляй информацию сверх них.

    Правила:
    - Если liability_status = "missing":
      "Раздел об ответственности и indemnity не обнаружен"
    - Если все поля unclear:
      "Не удалось определить объём ответственности"
    - Иначе:
      * сначала укажи liability_general:
        - "Ответственность ограничена"
        - "Ответственность неограниченная"
        - "Характер ответственности не удалось определить"
      * затем indemnity:
        - "indemnity отсутствует"
        - "indemnity узкая"
        - "indemnity широкая"
        - при необходимости добавь бенефициара:
          "в пользу контрагента", "в пользу Target", "взаимная"
      * затем добавь "значимые штрафы", если
        has_significant_penalties = "yes"
    - Не более 3 коротких фактов через ";".

    Шаг 6 — ОБОСНОВАНИЕ

    Заполни "reason".

    Правила:
    - Первое предложение — краткий вывод.
    - Второе — короткая цитата из текста (до 100 символов).
    - Пиши по-русски.
    </instructions>

    <edge_cases>
    - "Unlimited liability" или аналогичная прямая формулировка:
      * liability_status = "present"
      * liability_general = "unlimited"

    - "Any and all losses" в пользу контрагента
      без видимого внутреннего ограничителя:
      * liability_status = "present"
      * indemnity_scope = "broad"
      * indemnity_beneficiary = "counterparty"

    - Indemnity отсутствует по существу:
      * liability_status = "present"
      * indemnity_scope = "none"
      * indemnity_beneficiary = "not_applicable"

    - Значимые штрафы:
      * liability_status = "present"
      * has_significant_penalties = "yes"

    - Договор прямо фиксирует отсутствие indemnity:
      * liability_status = "present"
      * indemnity_scope = "none"
      * location с прямой цитатой об отсутствии.

    - Нет релевантных фрагментов / раздел об ответственности в договоре отсутствует:
      * liability_status = "missing"
      * liability_general = "unlimited"
      * indemnity_scope = "none"
      * indemnity_beneficiary = "not_applicable"
      * has_significant_penalties = "no"
      * liability_display = "Раздел об ответственности и indemnity не обнаружен"
      * location у всех полей = null.

    - Формулировки есть, но вывод невозможен:
      * liability_status = "unclear"
      * соответствующие поля = "unclear"
    </edge_cases>

    <output_expectations>
    - Верни результат строго в формате JSON.
    - Не оборачивай в markdown-блоки (без ```).
    - Не добавляй комментариев вне JSON.
    - Все значения полей с allowed_values — на английском.
    - Свободные текстовые поля (liability_display, reason) —
      на русском языке.
    - Не добавляй полей, кроме указанных.
    - Для каждого поля возвращай объект с ключами
      "value", "confidence", "location".

    Пример структуры ответа:
    {
      "liability_display": {"value": "Ответственность ограничена; indemnity широкая в пользу контрагента", "confidence": 0.92, "location": null},
      "liability_status": {"value": "present", "confidence": 0.95, "location": {"clause_ref": "п. 11.1", "page": 7, "quote": "Совокупная ответственность Исполнителя ограничена суммой фактически уплаченного вознаграждения"}},
      "liability_general": {"value": "limited", "confidence": 0.90, "location": {"clause_ref": "п. 11.1", "page": 7, "quote": "Совокупная ответственность Исполнителя ограничена суммой фактически уплаченного вознаграждения"}},
      "indemnity_scope": {"value": "broad", "confidence": 0.85, "location": {"clause_ref": "п. 11.3", "page": 7, "quote": "Заказчик возмещает Исполнителю любые и все убытки, расходы и требования"}},
      "indemnity_beneficiary": {"value": "counterparty", "confidence": 0.85, "location": {"clause_ref": "п. 11.3", "page": 7, "quote": "Заказчик возмещает Исполнителю любые и все убытки"}},
      "has_significant_penalties": {"value": "no", "confidence": 0.70, "location": null},
      "reason": {"value": "...", "confidence": 0.90, "location": null}
    }
    </output_expectations>

  fields:
    - name: "liability_display"
      type: "string"
      presentation: "fact"
      label: "Ответственность и indemnity"
      description: "Нормализованный user-facing вывод для DD Grid"
      display_in_grid: true
      display_priority: 1

    - name: "liability_status"
      type: "string"
      presentation: "signal"
      risk_weight: "info"
      description: "Наличие регулирования ответственности и indemnity в договоре"
      display_in_grid: false
      allowed_values:
        - "present"
        - "missing"
        - "unclear"

    - name: "liability_general"
      type: "string"
      presentation: "signal"
      risk_weight: "high"
      description: "Общий характер ответственности"
      allowed_values:
        - "limited"
        - "unlimited"
        - "unclear"
      display_in_grid: false

    - name: "indemnity_scope"
      type: "string"
      presentation: "signal"
      risk_weight: "high"
      description: "Масштаб indemnity"
      allowed_values:
        - "none"
        - "narrow"
        - "broad"
        - "unclear"
      display_in_grid: false

    - name: "indemnity_beneficiary"
      type: "string"
      presentation: "signal"
      risk_weight: "high"
      description: "В чью пользу работает indemnity"
      allowed_values:
        - "mutual"
        - "counterparty"
        - "target"
        - "not_applicable"
        - "unclear"
      display_in_grid: false

    - name: "has_significant_penalties"
      type: "string"
      presentation: "signal"
      risk_weight: "high"
      description: "Значимые штрафы / liquidated damages"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
      display_in_grid: false

    - name: "reason"
      type: "string"
      presentation: "diagnostic"
      description: "Обоснование"
      display_in_grid: false

  store_payload: true


  