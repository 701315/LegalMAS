id: "liability_and_indemnity_scope"
name: "Общий объём ответственности и indemnity"
description: >
  Анализирует общий объём ответственности сторон и формулировки indemnity:
  наличие и уровень caps (ограничений по сумме), исключения видов убытков,
  широту обязательств indemnify/hold harmless, фиксированные штрафы и
  liquidated damages, баланс защиты между Target и контрагентом.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"

rules:
  keyword_mode: any

  keywords:
    high:
      # Неограниченная ответственность
      - "(?i)unlimited\\s+liability"
      - "(?i)неограниченн[а-я]+\\s+ответственност[ьи]"
      - "(?i)без\\s+ограничени[яий]\\s+ответственност[ьи]"
      - "(?i)полн[а-я]+\\s+ответственност[ьи]\\s+без\\s+ограничени[яй]"
      - "(?i)shall\\s+be\\s+liable\\s+without\\s+(any\\s+)?limit(ation)?"

      # Широкая indemnity (any and all)
      - "(?i)indemnif(y|ies|ied|ication)\\s+[\\s\\S]{0,40}any\\s+and\\s+all\\s+(loss|damage|claim|cost|expense)"
      - "(?i)возмест(ить|ит|ят)\\s+любые\\s+(и\\s+все\\s+)?(убытки|потери|расходы|ущерб)"
      - "(?i)any\\s+and\\s+all\\s+loss(es)?[,\\s]+(damage|cost|expense|claim|liability)"
      - "(?i)все\\s+без\\s+исключени[яи]\\s+(убытки|потери|расходы)"

      # Hold harmless
      - "(?i)hold\\s+harmless"
      - "(?i)defend[,\\s]+indemnif(y|ies)"
      - "(?i)indemnif(y|ies)[,\\s]+defend[,\\s]+and\\s+hold\\s+harmless"

      # Отсутствие cap при широкой ответственности
      - "(?i)without\\s+(any\\s+)?cap"
      - "(?i)no\\s+(monetary\\s+)?cap"
      - "(?i)без\\s+(какого[-\\s]?либо\\s+)?лимит[аов]"

    medium:
      # Indemnity / indemnification (общие)
      - "(?i)indemnif(y|ies|ied|ication)"
      - "(?i)indemnity"
      - "(?i)возмещени[ея]\\s+(убытков|потерь|ущерба|расходов)"
      - "(?i)обязательств[оа]\\s+по\\s+возмещени[юя]"

      # Cap / ограничение ответственности
      - "(?i)liability\\s+(cap|limit)"
      - "(?i)cap\\s+on\\s+liability"
      - "(?i)aggregate\\s+liability\\s+shall\\s+not\\s+exceed"
      - "(?i)total\\s+liability\\s+[\\s\\S]{0,40}(not|shall\\s+not)\\s+exceed"
      - "(?i)ограничени[ея]\\s+ответственност[ьи]"
      - "(?i)максимальн[а-я]+\\s+(размер|сумм[аы])\\s+ответственност[ьи]"
      - "(?i)предел[ы]?\\s+ответственност[ьи]"
      - "(?i)ответственность\\s+[\\s\\S]{0,40}не\\s+(может|должна)\\s+превышать"

      # Exclusion косвенных убытков
      - "(?i)exclud(e|es|ed|ing)\\s+[\\s\\S]{0,30}(indirect|consequential|special|incidental)"
      - "(?i)shall\\s+not\\s+be\\s+liable\\s+for\\s+[\\s\\S]{0,30}(indirect|consequential)"
      - "(?i)исключ[а-я]+\\s+(косвенн|непрям)[а-я]+\\s+убытк[иов]"
      - "(?i)не\\s+отвеча[еюя]т\\s+за\\s+упущенн[а-я]+\\s+выгод[уы]"
      - "(?i)lost\\s+profits"
      - "(?i)упущенн[а-я]+\\s+выгод[аыу]"

      # Liquidated damages
      - "(?i)liquidated\\s+damages"
      - "(?i)заранее\\s+оценённ[а-я]+\\s+убытк[иов]"
      - "(?i)agreed\\s+damages"
      - "(?i)predetermined\\s+amount\\s+of\\s+damages"

      # Штрафы / неустойки
      - "(?i)штраф\\b"
      - "(?i)penalt(y|ies)"
      - "(?i)неустойк[аи]"
      - "(?i)пен[яи]"
      - "(?i)fixed\\s+(fee|penalty|amount)"
      - "(?i)фиксированн[а-я]+\\s+(штраф|неустойк|сумм)"

    low:
      # Общие ссылки на ответственность
      - "(?i)несёт\\s+ответственность"
      - "(?i)несет\\s+ответственность"
      - "(?i)ответственность\\s+сторон"
      - "(?i)полностью\\s+отвечает"
      - "(?i)shall\\s+be\\s+(solely\\s+)?liable"
      - "(?i)liability\\s+of\\s+the\\s+parties"
      - "(?i)liability"
      - "(?i)ответственност[ьи]"

      # Общие ссылки на убытки / damages
      - "(?i)damages"
      - "(?i)убытк[иов]"
      - "(?i)losses"
      - "(?i)потер[ьи]"
      - "(?i)ущерб"

      # Общие ссылки на возмещение
      - "(?i)compensat(e|ion)"
      - "(?i)компенсац[ия]"
      - "(?i)reimburse"
      - "(?i)возмест(ить|ят|ит)"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 640

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  context_k: 5
  max_chunks: 10
  boost_keywords:
    - "unlimited liability"
    - "неограниченная ответственность"
    - "indemnify"
    - "indemnity"
    - "indemnification"
    - "hold harmless"
    - "any and all losses"
    - "возместить любые убытки"
    - "liability cap"
    - "aggregate liability shall not exceed"
    - "ограничение ответственности"
    - "предел ответственности"
    - "indirect damages"
    - "consequential damages"
    - "косвенные убытки"
    - "упущенная выгода"
    - "liquidated damages"
    - "штраф"
    - "неустойка"
    - "penalty"
  rerank: true
  filters: {}

conditional: null

extraction:
  llm_prompt_extraction: |
    <role>
    Ты — юрист по контрактному праву и управлению рисками.
    Твоя специализация — анализ объёма ответственности сторон,
    обязательств indemnity/hold harmless, договорных штрафов,
    liquidated damages и баланса рисков между сторонами
    в коммерческих договорах.
    </role>

    <context>
    Ниже приведены фрагменты договора с положениями об ответственности,
    indemnity, штрафах и/или ограничениях убытков:

    {context}
    </context>

    <instructions>
    Проведи анализ по шагам. Каждый шаг логически соответствует одному
    или нескольким полям итоговой оценки риска.

    Шаг 1 — ОБЩИЙ ХАРАКТЕР ОТВЕТСТВЕННОСТИ
    (используется для заполнения поля "liability_general"):
    - Определи, является ли ответственность Target по договору:
      * "limited" — если в договоре явно есть ограничения:
        - caps (лимиты по сумме: например, стоимость договора,
          платежи за определённый период, фиксированная сумма),
        - исключения косвенных убытков (indirect, consequential,
          special, incidental damages),
        - исключения упущенной выгоды (lost profits),
        - иные чётко прописанные ограничения видов или объёма убытков;
      * "unlimited" — если:
        - есть прямые формулировки о неограниченной ответственности
          ("unlimited liability", "без ограничения"),
        - либо допускается возмещение любых убытков без видимых caps,
          exclusions или carve-outs;
      * "unclear" — если по доступным фрагментам невозможно надёжно
        отнести ответственность к limited или unlimited.
    - Сформулируй вывод:
      * "limited";
      * "unlimited";
      * "unclear" — невозможно оценить масштаб.

    Шаг 2 — МАСШТАБ И ХАРАКТЕР INDEMNITY
    (используется для заполнения поля "indemnity_scope"):
    - Определи, присутствуют ли обязательства indemnify / hold harmless
      и насколько они широкие:
      * "none" — indemnity-обязательства отсутствуют в доступных
        фрагментах;
      * "narrow" — indemnity ограничено конкретными и узкими рисками:
        - нарушение IP-прав,
        - налоговые претензии по конкретному периоду,
        - конкретные regulatory claims,
        - иные чётко очерченные основания;
      * "broad" — indemnity охватывает широкий спектр последствий:
        - "any and all losses, damages, fines, penalties, costs
          and expenses",
        - широкие основания (любые претензии третьих лиц, любые
          нарушения договора, любые действия/бездействия),
        - включение косвенных убытков, штрафов, судебных расходов
          без существенных carve-out;
      * "unclear" — если indemnity упомянуто, но объём не удаётся
        однозначно квалифицировать.

    Шаг 3 — ЗНАЧИМЫЕ ШТРАФЫ И LIQUIDATED DAMAGES
    (используется для заполнения поля "has_significant_penalties"):
    - Оцени, есть ли:
      * крупные фиксированные штрафы/penalties;
      * liquidated damages в значительном размере или с высокой
        ставкой (например, крупный процент от цены контракта
        или высокая дневная ставка без разумного cap);
      * штрафные неустойки, несоразмерные нарушению.
    - Контекст для оценки «значительности»:
      * соотношение штрафа с ценой договора (если известна);
      * наличие cap на штрафы;
      * кумулятивный характер (штрафы суммируются без ограничения).
    - Сформулируй вывод:
      * "yes" — штрафы/liquidated damages значительны;
      * "no" — штрафы умеренны или отсутствуют;
      * "unclear" — невозможно оценить масштаб по доступным
        фрагментам.

    Шаг 5 — RED FLAGS
    (используется для заполнения поля "red_flags"):
    - Оцени наличие следующих рисковых факторов:

      * «LIAB1» — Неограниченная или непропорциональная
        ответственность Target при одновременно ограниченной
        ответственности контрагента. Признаки:
        - формулировки "unlimited liability" / "без ограничения
          ответственности" применительно к Target;
        - cap на ответственность контрагента, но не на Target;
        - контрагент исключает косвенные убытки в свою сторону,
          но Target такого исключения не получает.

      * «LIAB2» — Очень широкая indemnity в пользу контрагента,
        покрывающая "any and all losses, damages, fines, penalties,
        costs and expenses" (включая косвенные убытки и штрафы)
        без существенных carve-out или caps. Признаки:
        - формулировки "indemnify, defend and hold harmless"
          с перечнем "any and all …";
        - отсутствие исключений из объёма indemnity;
        - indemnity односторонняя (только от Target).

      * «LIAB3» — Значительные liquidated damages или штрафные
        неустойки без разумного cap, несоразмерные характеру
        возможного нарушения. Признаки:
        - высокая дневная/недельная ставка без верхнего предела;
        - штраф за расторжение или досрочное прекращение в размере,
          кратно превышающем разумные потери;
        - кумулятивные штрафы (суммируются без ограничения).

    - Если ответственность ограничена разумным cap'ом, indemnity
      узкое или симметричное, штрафы умеренные — верни "NONE".
    - Если данных недостаточно для оценки или текст противоречив —
      верни "UNCLEAR".
    - Формат: один или несколько кодов через запятую
      ("LIAB1", "LIAB2", "LIAB1, LIAB2, LIAB3"),
      "NONE" или "UNCLEAR".
      Без комментариев в этом поле — всё объясняющее в reason.

    Шаг 6 — ОБОСНОВАНИЕ
    (используется для заполнения поля "reason"):

    - В "reason" кратко обоснуй вывод:
      * ссылайся на ключевые формулировки (по возможности
        с короткими цитатами);
      * поясни, как конструкция ответственности влияет на Target;
      * если выставлены red_flags — объясни, почему именно
        эти коды.
    </instructions>

    <edge_cases>
    Обрабатывай пограничные ситуации так:

    - Прямая оговорка "unlimited liability" или возмещение
      "any and all losses" без caps:
      рассматривай это как неограниченную ответственность;
      при широком indemnity в пользу контрагента — ставь
      LIAB1 и/или LIAB2.

    - Ответственность ограничена cap'ом (стоимость договора,
      платежи за 12 месяцев и т.п.), исключены косвенные убытки
      и упущенная выгода:
      отражай как "limited"; не завышай риск, если cap разумный
      и indemnity отсутствует или узкое.

    - Indemnity в пользу контрагента покрывает "any and all
      losses, damages, fines, penalties, costs and expenses"
      без существенных carve-out:
      квалифицируй как "broad", ставь LIAB2; учитывай это
      как значительный фактор повышенного риска.

    - Только стандартные неустойки/штрафы в умеренных размерах
      (например, 0,1% в день с cap'ом в 10% от суммы) без
      широкого indemnity:
      не завышай риск; has_significant_penalties = "no",
      если cap разумный.

    - Штрафы кумулятивные (суммируются без ограничения)
      или с высокой ставкой без верхнего предела:
      ставь has_significant_penalties = "yes" и LIAB3.

    - Cap на ответственность есть, но он применяется только
      к прямым убыткам, а indemnity по отдельным основаниям
      (например, IP infringement, data breach) — без cap'а:
      отражай nuance в scope_description; liability_general
      может быть "limited", но indemnity_scope — "broad"
      по конкретным рискам. Оценивай общий уровень по
      совокупности.

    - Ответственность сторон описана симметрично, но для Target
      предусмотрены дополнительные штрафы, которых нет
      для контрагента:
      отражай дисбаланс в beneficiary_of_indemnity и reason.

    - Пустые или явно нерелевантные фрагменты:
      укажи, что данных недостаточно для анализа объёма
      ответственности и indemnity. Поставь liability_general =
      "unclear", indemnity_scope = "unclear",
      red_flags = "UNCLEAR", overall_risk_level = "medium".
    </edge_cases>

    <output_expectations>
    На основе твоего анализа отдельный механизм извлечения сформирует
    структурированные поля по заранее заданной схеме. Твоя задача —
    давать чёткие юридические выводы и указывать конкретные формулировки
    из текста, на которых они основаны. Не генерируй JSON —
    просто излагай выводы структурированно и однозначно.
    </output_expectations>

  enabled: true
  mode: "hybrid"
  fields:
    - name: "liability_general"
      type: "string"
      allowed_values:
        - "limited"
        - "unlimited"
        - "unclear"

    - name: "indemnity_scope"
      type: "string"
      allowed_values:
        - "none"
        - "narrow"
        - "broad"
        - "unclear"

    - name: "has_significant_penalties"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "red_flags"
      type: "string"

    - name: "reason"
      type: "string"

  store_payload: true

red_flags:
  items:
    - code: "LIAB1"
      description: "Неограниченная или непропорциональная ответственность Target при ограниченной ответственности контрагента."
    - code: "LIAB2"
      description: "Очень широкая indemnity в пользу контрагента (any and all losses, включая косвенные убытки и штрафы) без существенных carve-out или caps."
    - code: "LIAB3"
      description: "Значительные liquidated damages или штрафные неустойки без разумного cap, несоразмерные характеру возможного нарушения."