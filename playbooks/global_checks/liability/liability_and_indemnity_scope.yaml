id: "liability_and_indemnity_scope"
name: "Общий объём ответственности и indemnity"
description: >
  Анализирует общий объём ответственности и формулировки indemnity:
  неограниченная ответственность, широкие обязательства возмещения любых потерь,
  фиксированные штрафы и liquidated damages.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"

rules:
  keywords:
    - "несет ответственность"
    - "ответственность сторон"
    - "полностью отвечает"
    - "неограниченная ответственность"
    - "unlimited liability"
    - "indemnify"
    - "indemnity"
    - "hold harmless"
    - "возместить любые убытки"
    - "any and all losses"
    - "liquidated damages"
    - "штраф"
    - "penalty"
    - "fixed fee"
  keyword_mode: "any"
  regex_patterns: []
  clause_patterns: []

llm:
  prompt_template: |
    <role>
    Ты — юрист по контрактам.
    Твоя специализация — ответственность сторон, indemnity и договорные штрафы.
    </role>

    <context>
    Ниже приведены фрагменты договора с положениями об ответственности и indemnity:

    {context}
    </context>

    <instructions>
    Проведи анализ по шагам. Каждый шаг логически связан с одним или
    несколькими полями итоговой оценки.

    Шаг 1 — ОБЩИЙ ХАРАКТЕР ОТВЕТСТВЕННОСТИ
    (используется для "liability_general"):
    - Определи, является ли ответственность:
      * limited — если в договоре явно есть ограничения:
        - caps (лимиты по сумме, например сумма договора/платежей за период),
        - исключения косвенных убытков, упущенной выгоды, специальных убытков и т.п.,
        - иные чётко прописанные ограничения видов/объёма убытков;
      * unlimited — если:
        - есть прямые формулировки о неограниченной ответственности,
        - либо допускается возмещение любых убытков без видимых caps и carve-out
          (при условии, что из фрагментов это разумно следует);
      * unclear — если по доступным фрагментам невозможно надёжно отнести
        ответственность к limited или unlimited.
    - Зафиксируй ключевые формулировки (caps, exclusions, "any and all losses") для обоснования.

    Шаг 2 — МАСШТАБ И ХАРАКТЕР INDEMNITY
    (используется для "indemnity_scope"):
    - Определи, присутствуют ли обязательства indemnify / hold harmless и насколько они широкие:
      * none — indemnity-обязательства отсутствуют;
      * narrow — indemnity ограничено конкретными и узкими рисками:
        - например, нарушение IP-прав, налоговые претензии по конкретному периоду и т.п.;
      * broad — indemnity охватывает широкий спектр последствий:
        - "any and all losses, damages, fines, penalties, costs and expenses",
        - широкие основания (любые претензии третьих лиц, любые нарушения договора и т.д.);
      * unclear — если indemnity упомянуто, но объём не удаётся однозначно квалифицировать.
    - Отрази ключевые слова и перечни в выводе.

    Шаг 3 — ЗНАЧИМЫЕ ШТРАФЫ И LIQUIDATED DAMAGES
    (используется для "has_significant_liquidated_damages_or_fines"):
    - Оцени, есть ли:
      * крупные фиксированные штрафы/penalties;
      * liquidated damages в значительном размере или с высокой ставкой
        (например, крупный процент от цены или высокая дневная ставка без разумного cap).
    - Сформулируй вывод: yes / no / unclear, учитывая масштаб обязательств и контекста.

    Шаг 4 — КОГО ЗАЩИЩАЕТ INDEMNITY
    (используется для "beneficiary_of_indemnity"):
    - Определи, в чью пользу в основном дано indemnity:
      * target — если преимущественно защищается Target;
      * counterparty — если преимущественно защищается другая сторона;
      * mutual — если оговорки симметричны и работают в пользу обеих сторон;
      * unclear — если по фрагментам нельзя понять баланс.
    - Отметь, если есть явный дисбаланс в пользу одной стороны.

    Шаг 5 — ОБЩИЙ УРОВЕНЬ РИСКА
    (используется для "overall_risk_level" и "reason"):
    - Оцени общий риск для Target, учитывая:
      * характер ответственности (limited vs. unlimited);
      * широту indemnity и того, в чью пользу она действует;
      * наличие и размер значимых liquidated damages/штрафов.
    - Сформулируй общий уровень риска как low / medium / high.
    - В "reason" кратко обоснуй вывод, ссылаясь на ключевые формулировки
      (желательно с короткими цитатами), и поясни, почему такая конструкция
      ответственности может быть приемлемой или проблемной для Target.
    </instructions>

    <edge_cases>
    Обрабатывай пограничные ситуации так:

    - Прямая оговорка "unlimited liability" или возмещение "any and all losses"
      без caps:
      рассматривай это как признак неограниченной ответственности и, при наличии
      широкого indemnity, как фактор повышенного риска.

    - Ответственность ограничена cap'ом (например, стоимость договора или
      платежи за 12 месяцев), исключены косвенные убытки и упущенная выгода:
      отражай это как ограниченную ответственность, даже при наличии
      разумных штрафов.

    - Indemnity в пользу контрагента покрывает "any and all losses, damages,
      fines, penalties, costs and expenses" без существенных carve-out:
      квалифицируй indemnity как "broad" и учитывай это как фактор
      значительно повышенного риска для Target.

    - Только стандартные неустойки/штрафы в умеренных размерах
      (например, 0,1% в день с cap'ом), без широкого indemnity:
      не завышай риск только из-за наличия таких штрафов.

    - Пустые или явно нерелевантные фрагменты:
      укажи, что данных недостаточно для анализа объёма ответственности и indemnity,
      и поясни, как это влияет на неопределённость и оценку риска.
    </edge_cases>

    <output_expectations>
    На основе твоего анализа отдельный механизм извлечения сформирует
    структурированные поля по заранее заданной схеме. Твоя задача —
    давать чёткие юридические выводы и указывать конкретные формулировки
    из текста, на которых они основаны.
    </output_expectations>
  prompt_file: null
  context_k: 4
  temperature: 0.0
  max_tokens: 512

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 500

retrieval:
  context_k: 4
  max_chunks: 8
  boost_keywords:
    - "несет ответственность"
    - "unlimited liability"
    - "indemnify"
    - "indemnity"
    - "liquidated damages"
  rerank: true
  filters: {}

conditional: null

extraction:
  enabled: true
  mode: "hybrid"
  fields:
    - name: "liability_general"
      type: "string"
      allowed_values:
        - "limited"
        - "unlimited"
        - "unclear"

    - name: "indemnity_scope"
      type: "string"
      allowed_values:
        - "none"
        - "narrow"
        - "broad"
        - "unclear"

    - name: "has_significant_liquidated_damages_or_fines"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "beneficiary_of_indemnity"
      type: "string"
      allowed_values:
        - "target"
        - "counterparty"
        - "mutual"
        - "unclear"

    - name: "overall_risk_level"
      type: "string"
      allowed_values:
        - "low"
        - "medium"
        - "high"

    - name: "reason"
      type: "string"

  store_payload: true

red_flags:
  items:
    - code: "LIAB1"
      description: "Неограниченная ответственность Target при ограниченной ответственности контрагента."
    - code: "LIAB2"
      description: "Очень широкая indemnity в пользу контрагента (any and all losses, включая косвенные и штрафы)."
