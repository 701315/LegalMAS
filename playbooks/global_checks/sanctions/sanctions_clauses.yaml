id: "sanctions_clauses"
name: "Санкционные оговорки"
description: >
  Анализирует наличие и содержание санкционных оговорок: заверения об отсутствии
  санкций, соблюдении режимов (США, ЕС, UK, ООН, локальные), обязанности уведомлять
  о санкционных событиях и последствия таких событий.

doc_types: []

severity: "critical"
severity_if_fail: "critical"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"

rules:
  keywords:
    - "санкции"
    - "санкционн"
    - "sanctions"
    - "OFAC"
    - "EU sanctions"
    - "UK sanctions"
    - "UN sanctions"
    - "санкционные режимы"
    - "санкционные ограничения"
    - "embargo"
    - "restricted party"
    - "sanctioned person"
    - "санкционный список"
    - "лист санкций"
  keyword_mode: "any"
  regex_patterns: []
  clause_patterns: []

llm:
  prompt_template: |
    <role>
    Ты — юрист по международным санкциям.
    Твоя специализация — договорные санкционные оговорки и распределение санкционного риска.
    </role>

    <context>
    Ниже приведены фрагменты договора, где могут быть санкционные положения:

    {context}
    </context>

    <instructions>
    Определи:

    1) Заверения и гарантии об отсутствии санкций (has_sanctions_representations):
       - заверения о том, что стороны, их аффилированные лица, бенефициарные владельцы (UBO),
         банки и иные задействованные лица:
         * не являются sanctioned person / restricted party,
         * не включены в санкционные списки (OFAC, ЕС, UK, ООН, локальные),
         * не подпадают под санкционные запреты на операции.
       Значения:
       - "yes" — такие заверения явно есть;
       - "no" — из фрагментов видно, что их нет;
       - "unclear" — недостаточно данных.

    2) Обязательства соблюдать санкционные режимы (has_sanctions_compliance_obligations):
       - прямые обязательства соблюдать санкции США, ЕС, UK, ООН, локальных органов,
         а также любые применимые restrictive measures, embargo и т.п.;
       - обязательства не совершать сделки с лицами из санкционных списков,
         не направлять платежи через санкционные банки и т.д.

    3) Обязанность уведомлять о санкционных событиях
       (requires_sanctions_event_notification):
       - обязанность стороны незамедлительно уведомить контрагента:
         * о включении в санкционный список,
         * о блокировке счетов,
         * о введении запрета на операции или иных санкционных событиях,
         которые влияют на исполнение договора.

    4) Последствия санкционного события (sanctions_event_consequences):
       - какие права/последствия предусмотрены при наступлении санкционного события:
         * приостановление исполнения — "suspension";
         * право расторгнуть договор — "termination";
         * право отказать в платеже / payment refusal (например, банк/контрагент
           отказывается платить, ссылаясь на санкции) — "payment_refusal";
         * сочетание нескольких мер — "mixed";
         * отсутствие специальных последствий — "none";
         * если по тексту неясно — "unclear".

    5) Оцени общий санкционный риск для Target (overall_risk_level: low / medium / high):
       - учитывай:
         * наличие/отсутствие внятных заверений и обязательств по санкциям;
         * наличие обязанностей уведомлять о санкционных событиях;
         * жёсткость последствий (особенно права на одностороннее расторжение
           и отказ от платежей при «риске нарушения санкций», а не фактическом запрете).
    </instructions>

    <edge_cases>
    ВАЖНО — пограничные случаи:

    — Если санкционные положения позволяют контрагенту отказаться от платежей
      или расторгнуть договор уже при "риске нарушения санкций" или на основе
      собственной risk-based оценки, без объективного запрета:
      sanctions_event_consequences чаще "payment_refusal" или "mixed",
      overall_risk_level обычно "high" — отрази это в reason.

    — Если есть только общая ссылка "стороны соблюдают применимое законодательство",
      но нет конкретных санкционных заверений и механизмов:
      has_sanctions_representations и has_sanctions_compliance_obligations
      могут быть "unclear"; риск не ниже "medium" при очевидном санкционном/международном элементе.

    — Если предусмотрены балансные санкционные оговорки:
      * четкие заверения об отсутствии санкций,
      * обязанность уведомлять,
      * право приостановить/переструктурировать исполнение, но не произвольно
        удерживать авансы или навсегда отказываться от платежей без фактического
        запрета,
      риск может быть "low" или "medium" в зависимости от формулировок.

    — Если договор допускает освобождение стороны от ответственности
      (illegality / force majeure) только в той мере, в какой санкции реально
      делают исполнение незаконным, и предусматривает механизмы good faith
      сотрудничества для обходных путей (альтернативные банки, валюта и т.п.):
      это снижает риск для Target (отрази в reason).

    — Пустые или нерелевантные фрагменты:
      большинство полей = "unclear",
      overall_risk_level = "medium",
      reason = "Недостаточно данных для анализа санкционных оговорок и распределения санкционного риска."
    </edge_cases>

    <examples>
    ПРИМЕР 1 — ЖЁСТКОЕ ПРАВО НА ОТКАЗ ОТ ПЛАТЕЖА/РАСТОРЖЕНИЕ (HIGH):

    Фрагмент: "Банк вправе отказать в осуществлении платежа и расторгнуть Договор
    в случае, если по его мнению существует риск нарушения любых применимых
    санкционных режимов, включая санкции OFAC, ЕС или Великобритании."

    {{
      "has_sanctions_representations": "unclear",
      "has_sanctions_compliance_obligations": "yes",
      "requires_sanctions_event_notification": "unclear",
      "sanctions_event_consequences": "mixed",
      "overall_risk_level": "high",
      "reason": "Санкционная оговорка даёт Банку право отказать в платеже и расторгнуть договор при субъективно оцениваемом 'риске нарушения санкций', что создаёт высокий риск для Target."
    }}

    ПРИМЕР 2 — СБАЛАНСИРОВАННАЯ САНКЦИОННАЯ ОГОВОРКА (MEDIUM/LOW):

    Фрагмент: "Каждая Сторона заявляет и гарантирует, что ни она, ни ее аффилированные
    лица и бенефициарные владельцы не являются лицами, включенными в санкционные
    списки OFAC, ЕС или ООН. Стороны обязуются соблюдать применимые санкционные
    режимы и незамедлительно уведомлять друг друга о включении в санкционный список
    или введении запрета на операции, влияющего на исполнение настоящего Договора.
    В случае такого события исполнение приостанавливается на срок до 90 дней для
    поиска законного способа исполнения; по истечении этого срока каждая Сторона
    вправе расторгнуть договор без штрафов."

    {{
      "has_sanctions_representations": "yes",
      "has_sanctions_compliance_obligations": "yes",
      "requires_sanctions_event_notification": "yes",
      "sanctions_event_consequences": "mixed",
      "overall_risk_level": "medium",
      "reason": "Договор содержит четкие санкционные заверения, обязанности по соблюдению режимов и уведомлению, а также механизм временной приостановки с последующим правом расторжения, что балансирует интересы сторон."
    }}

    ПРИМЕР 3 — ОТСУТСТВИЕ СПЕЦИАЛЬНЫХ САНКЦИОННЫХ ОГОВОРОК (HIGH ПРИ МЕЖДУНАРОДНОМ ЭЛЕМЕНТЕ):

    Фрагмент: "Стороны обязуются соблюдать применимое законодательство. Специальные
    положения о санкциях настоящим Договором не предусмотрены."

    {{
      "has_sanctions_representations": "no",
      "has_sanctions_compliance_obligations": "unclear",
      "requires_sanctions_event_notification": "no",
      "sanctions_event_consequences": "none",
      "overall_risk_level": "high",
      "reason": "При отсутствии специальных санкционных оговорок в договоре с международным элементом риск непредсказуемого влияния санкций и споров по исполнению для Target остаётся высоким."
    }}
    </examples>

    <output_format>
    Твой ответ ДОЛЖЕН быть строго валидным JSON-объектом со следующими
    полями:

    {{
      "has_sanctions_representations": "one of: yes | no | unclear",
      "has_sanctions_compliance_obligations": "one of: yes | no | unclear",
      "requires_sanctions_event_notification": "one of: yes | no | unclear",
      "sanctions_event_consequences": "one of: none | suspension | termination | payment_refusal | mixed | unclear",
      "overall_risk_level": "one of: low | medium | high",
      "reason": "string — краткое объяснение на русском с указанием ключевых формулировок санкционных оговорок и их влияния на риск для Target"
    }}

    Все перечисленные поля ДОЛЖНЫ присутствовать в JSON, даже если их значение равно null.
    </output_format>

    <constraints>
    ЖЁСТКИЕ ПРАВИЛА:
    1. Выведи ТОЛЬКО один JSON-объект. Никакого текста до или после.
    2. Не пиши "Вот JSON", "Here is the JSON" и т.п.
    3. Не используй Markdown, бэктики ``` или любые обёртки.
    4. Все строки — в двойных кавычках.
    5. Значения перечислимых полей — СТРОГО из указанных вариантов.
    6. Ключи — точно как указано, без добавления новых.
    7. Поле "reason" ДОЛЖНО содержать конкретные формулировки из фрагментов
       и вывод по рискам, а не общие фразы вроде "есть риски".
    8. Начни ответ сразу с символа {{
    9. Если по какому‑то полю нет достаточно информации в тексте —
       верни для него 'unclear' или null (для reason пустое значение
       недопустимо — нужно объяснение). НЕ придумывай значения, не интерполируй.
    </constraints>
  prompt_file: null
  context_k: 5
  temperature: 0.0
  max_tokens: 640

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  context_k: 5
  max_chunks: 10
  boost_keywords:
    - "sanctions"
    - "санкции"
    - "sanctioned person"
    - "restricted party"
  rerank: true
  filters: {}

conditional: null

extraction:
  enabled: true
  mode: "hybrid"
  fields:
    - name: "has_sanctions_representations"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
    - name: "has_sanctions_compliance_obligations"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
    - name: "requires_sanctions_event_notification"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
    - name: "sanctions_event_consequences"
      type: "string"
      allowed_values:
        - "none"
        - "suspension"
        - "termination"
        - "payment_refusal"
        - "mixed"
        - "unclear"
    - name: "overall_risk_level"
      type: "string"
      allowed_values:
        - "low"
        - "medium"
        - "high"
    - name: "reason"
      type: "string"
  store_payload: true

red_flags:
  items:
    - code: "SAN1"
      description: "Отсутствие санкционных положений в договоре с очевидным международным/банковским элементом."
    - code: "SAN2"
      description: "Формулировки, позволяющие контрагенту расторгнуть договор и отказаться от платежей при любом 'риске нарушения санкций'."
      