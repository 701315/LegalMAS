id: "sanctions_clauses"
name: "Санкционные оговорки"
description: >
  Анализирует наличие и содержание санкционных оговорок: заверения
  об отсутствии санкций, соблюдение режимов (OFAC, ЕС, UK, ООН, локальные),
  обязанности уведомлять о санкционных событиях, последствия таких событий,
  распределение санкционного риска и наличие механизмов смягчения.

doc_types: []

severity: "critical"
severity_if_fail: "critical"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"

rules:
  keyword_mode: any

  keywords:
    high:
      # Прямые санкционные термины
      - "(?i)\\bsanctions?\\b"
      - "(?i)\\bсанкци[яийю]\\b"
      - "(?i)санкционн[а-яые]+"
      - "(?i)restrictive\\s+measures?"
      - "(?i)ограничительн[а-яые]+\\s+мер[ыа]"

      # Конкретные санкционные органы и списки
      - "(?i)\\bOFAC\\b"
      - "(?i)Office\\s+of\\s+Foreign\\s+Assets\\s+Control"
      - "(?i)\\bSDN\\b"
      - "(?i)SDN\\s+list"
      - "(?i)Specially\\s+Designated\\s+Nationals?"
      - "(?i)EU\\s+sanctions?"
      - "(?i)EU\\s+consolidated\\s+list"
      - "(?i)UK\\s+sanctions?"
      - "(?i)HM\\s+Treasury"
      - "(?i)UN\\s+sanctions?"
      - "(?i)Security\\s+Council\\s+sanctions?"
      - "(?i)санкционн[а-яый]+\\s+списо?к"
      - "(?i)лист\\s+санкций"
      - "(?i)перечень\\s+[\\s\\S]{0,20}санкци"

      # Sanctioned person / restricted party
      - "(?i)sanctioned\\s+(person|party|entity)"
      - "(?i)restricted\\s+part(y|ies)"
      - "(?i)blocked\\s+(person|party|entity)"
      - "(?i)designated\\s+(person|party|entity)"
      - "(?i)санкционн[а-яое]+\\s+(лиц[оа]|сторон|организаци)"
      - "(?i)лиц[оа]\\s+под\\s+санкциями"

      # Санкционные заверения
      - "(?i)(represent|warrant)[\\s\\S]{0,40}(sanction|sanctioned|restricted)"
      - "(?i)(заверя|гарантир)[\\s\\S]{0,40}санкци"
      - "(?i)not\\s+(a\\s+)?sanctioned\\s+(person|party)"
      - "(?i)не\\s+являе?тся\\s+[\\s\\S]{0,20}санкционн"

      # Последствия санкционных событий
      - "(?i)(suspend|terminat|block)[\\s\\S]{0,40}sanction"
      - "(?i)sanction[\\s\\S]{0,40}(suspend|terminat|block)"
      - "(?i)(приостанов|расторг|заблокир)[\\s\\S]{0,40}санкци"
      - "(?i)санкци[\\s\\S]{0,40}(приостанов|расторг|заблокир)"

    medium:
      # Embargo
      - "(?i)\\bembargo\\b"
      - "(?i)\\bэмбарго\\b"
      - "(?i)trade\\s+embargo"
      - "(?i)торгов[а-яое]+\\s+эмбарго"

      # Уведомления о санкционных событиях
      - "(?i)notif(y|ication)\\s+[\\s\\S]{0,30}sanction"
      - "(?i)уведоми[тьла]?\\s+[\\s\\S]{0,30}санкци"
      - "(?i)sanction[s]?\\s+event"
      - "(?i)санкционн[а-яое]+\\s+событи"

      # Compliance with sanctions
      - "(?i)sanctions?\\s+compliance"
      - "(?i)comply\\s+with\\s+[\\s\\S]{0,30}sanctions?"
      - "(?i)соблюд[а-я]+\\s+[\\s\\S]{0,30}санкци"
      - "(?i)sanctions?\\s+polic(y|ies)"
      - "(?i)санкционн[а-яая]+\\s+политик"

      # Screening
      - "(?i)sanctions?\\s+screening"
      - "(?i)проверк[аи]\\s+[\\s\\S]{0,20}санкционн"
      - "(?i)sanctions?\\s+check"
      - "(?i)sanctions?\\s+list\\s+check"

      # Illegality / force majeure по санкциям
      - "(?i)illegality\\s+[\\s\\S]{0,40}sanction"
      - "(?i)force\\s+majeure\\s+[\\s\\S]{0,40}sanction"
      - "(?i)невозможность\\s+исполнения\\s+[\\s\\S]{0,40}санкци"

      # Payment refusal
      - "(?i)refus(e|al)\\s+[\\s\\S]{0,20}(payment|transfer)\\s+[\\s\\S]{0,30}sanction"
      - "(?i)отказ[а-я]*\\s+[\\s\\S]{0,20}(платеж|перевод)[\\s\\S]{0,30}санкци"
      - "(?i)block[ed]?\\s+(funds?|payment|transfer)"
      - "(?i)заблокир[а-я]+\\s+(средств|платеж|перевод)"

    low:
      # Общие ссылки на ограничения
      - "(?i)restricted"
      - "(?i)ограничен"
      - "(?i)prohibited"
      - "(?i)запрещён"

      # Общие ссылки на списки
      - "(?i)\\blist\\b"
      - "(?i)\\bсписок\\b"
      - "(?i)\\bперечень\\b"

      # Общие ссылки на международное регулирование
      - "(?i)international\\s+(law|regulation)"
      - "(?i)международн[а-яое]+\\s+(прав|регулировани)"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 700

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  context_k: 5
  max_chunks: 10
  boost_keywords:
    - "sanctions"
    - "санкции"
    - "sanctions clause"
    - "санкционная оговорка"
    - "OFAC"
    - "SDN list"
    - "EU sanctions"
    - "UK sanctions"
    - "UN sanctions"
    - "sanctioned person"
    - "restricted party"
    - "санкционный список"
    - "embargo"
    - "sanctions compliance"
    - "соблюдение санкций"
    - "sanctions event"
    - "санкционное событие"
    - "notify sanctions"
    - "уведомить о санкциях"
    - "suspension sanctions"
    - "termination sanctions"
    - "payment refusal sanctions"
    - "block funds"
    - "illegality"
  rerank: true
  filters: {}

conditional: null

extraction:
  llm_prompt_extraction: |
    <role>
    Ты — юрист по международным санкциям.
    Твоя специализация — договорные санкционные оговорки, распределение
    санкционного риска, соблюдение режимов OFAC, ЕС, UK, ООН
    и локальных санкций, а также механизмы смягчения санкционных
    последствий в коммерческих и финансовых договорах.
    </role>

    <context>
    Ниже приведены фрагменты договора, где могут быть санкционные
    положения:

    {context}
    </context>

    <instructions>
    Проведи анализ по шагам. Каждый шаг логически соответствует одному
    или нескольким полям итоговой оценки риска.

    Шаг 1 — САНКЦИОННЫЕ ЗАВЕРЕНИЯ И ГАРАНТИИ
    (используется для заполнения поля "has_sanctions_reps"):
    - Определи, есть ли заверения о том, что:
      * стороны, их аффилированные лица и бенефициарные владельцы
        (UBO) не являются sanctioned person / restricted party;
      * не включены в санкционные списки (OFAC SDN, EU consolidated
        list, UK HM Treasury, ООН);
      * на них не распространяются санкционные запреты
        на операции по договору.
    - Сформулируй вывод:
      * "yes" — заверения с указанием конкретных
        санкционных списков и охватом UBO/аффилированных лиц;
      * "none" — заверения отсутствуют;
      * "unclear" — невозможно определить.

    Шаг 2 — ПОКРЫВАЕМЫЕ САНКЦИОННЫЕ РЕЖИМЫ
    (используется для заполнения поля "covered_regimes"):
    - Определи, какие санкционные режимы явно упоминаются:
      * OFAC / USA (SDN, SSI, CAPTA и др.);
      * EU sanctions (Regulation 269/2014 и др.);
      * UK sanctions (OFSI / HM Treasury);
      * UN Security Council sanctions;
      * локальные (российские контрсанкции, другие);
      * другие.
    - Перечисли через запятую.
    - Если конкретные режимы не указаны — укажи "Не указаны".

    Шаг 3 — ОБЯЗАТЕЛЬСТВА ПО СОБЛЮДЕНИЮ САНКЦИЙ
    (используется для заполнения поля "has_compliance_obligations"):
    - Определи, есть ли прямые обязательства:
      * соблюдать санкционные режимы;
      * не совершать сделки с sanctioned persons;
      * не направлять платежи через санкционные банки;
      * проводить sanctions screening.
    - Сформулируй вывод: "yes" / "no" / "unclear".

    Шаг 4 — ОБЯЗАННОСТЬ УВЕДОМЛЯТЬ О САНКЦИОННЫХ СОБЫТИЯХ
    (используется для заполнения поля "requires_notification"):
    - Определи, предусмотрена ли обязанность уведомить
      контрагента о:
      * включении стороны/UBO/аффилированных лиц
        в санкционный список;
      * блокировке счетов или запрете на операции;
      * иных санкционных событиях, влияющих на исполнение.
    - Сформулируй вывод: "yes" / "no" / "unclear".

    Шаг 5 — ПОСЛЕДСТВИЯ САНКЦИОННОГО СОБЫТИЯ
    (используется для заполнения поля "event_consequences"):
    - Определи, какие последствия предусмотрены:
      * "suspension" — приостановление исполнения;
      * "termination" — право расторгнуть договор;
      * "payment_refusal" — право отказать в платеже /
        заблокировать средства;
      * "mixed" — комбинация мер;
      * "none" — отсутствие специальных последствий;
      * "unclear" — неясно.

    Шаг 6 — RED FLAGS
    (используется для заполнения поля "red_flags"):
    - Оцени наличие следующих рисковых факторов:

      * «SAN1» — Отсутствие санкционных положений в договоре
        с очевидным международным/банковским элементом. Признаки:
        - has_sanctions_reps = "none";
        - has_compliance_obligations = "no";
        - при этом контекст предполагает трансграничные операции,
          банковское обслуживание, международную торговлю.

      * «SAN2» — Формулировки, позволяющие контрагенту
        расторгнуть договор и/или отказаться от платежей
        при любом «риске нарушения санкций» (risk-based trigger).
        Признаки:
        - consequences_trigger = "risk_based";
        - event_consequences включает "payment_refusal"
          или "termination";
        - has_mitigation_mechanisms = "no";
        - Target де-факто несёт весь санкционный риск.

      * «SAN3» — Санкционные заверения не покрывают UBO
        и аффилированных лиц. Признаки:
        - has_sanctions_reps = "general" (без охвата UBO);
        - при этом контекст предполагает сложную корпоративную
          структуру с международными бенефициарами;
        - «дыра» в заверениях может быть использована.

    - Если санкционные оговорки сбалансированы (развёрнутые
      заверения, actual designation trigger, механизмы
      смягчения) — верни "NONE".
    - Если данных недостаточно для оценки или текст противоречив —
      верни "UNCLEAR".
    - Формат: один или несколько кодов через запятую
      ("SAN1", "SAN2", "SAN1, SAN2, SAN3"),
      "NONE" или "UNCLEAR".
      Без комментариев в этом поле — всё объясняющее в reason.

    Шаг 7 — ОБОСНОВАНИЕ
    (используется для заполнения поля "reason"):

    - В "reason" кратко обоснуй вывод:
      * какие санкционные заверения/обязательства
        присутствуют/отсутствуют;
      * какие последствия предусмотрены и при каком триггере;
      * как распределён санкционный риск;
      * ссылайся на ключевые формулировки (по возможности
        с короткими цитатами);
      * если выставлены red_flags — объясни, почему именно
        эти коды.
    </instructions>

    <edge_cases>
    Обрабатывай пограничные ситуации так:

    - Санкционные положения позволяют контрагенту отказаться
      от платежей или расторгнуть при "risk of sanctions violation"
      или собственной risk-based оценке, без фактического запрета:
      consequences_trigger = "risk_based";
      ставь SAN2; overall_risk_level = "high".

    - Только общая ссылка "Стороны обязуются соблюдать
      применимое законодательство" без санкционных заверений:
      has_sanctions_reps = "none";
      has_compliance_obligations = "unclear";
      рассматривай SAN1 при международном контексте.

    - Балансные санкционные оговорки: заверения об отсутствии
      санкций, обязанность уведомлять, право приостановить
      (но не произвольно удерживать средства), механизмы
      сотрудничества для поиска решений:
      overall_risk_level = "low" или "medium";
      red_flags = "NONE".

    - Illegality / force majeure clause только в той мере,
      в какой санкции реально делают исполнение незаконным,
      + механизмы добросовестного сотрудничества
      (альтернативные банки, валюта):
      has_mitigation_mechanisms = "yes";
      это фактор снижения риска.

    - Санкционные заверения не покрывают UBO/аффилированных лиц
      (только сама сторона):
      has_sanctions_reps = "general";
      рассматривай SAN3 при сложной корпоративной структуре.

    - Договор чисто внутрироссийский, без международного
      элемента:
      отсутствие санкционных оговорок может быть оправдано;
      red_flags = "NONE";
      overall_risk_level = "low".

    - Пустые или явно нерелевантные фрагменты:
      все поля = "unclear";
      red_flags = "UNCLEAR";
      overall_risk_level = "medium";
      reason = "Недостаточно данных для анализа санкционных
      оговорок."
    </edge_cases>

    <output_expectations>
    На основе твоего анализа отдельный механизм извлечения сформирует
    структурированные поля по заранее заданной схеме. Твоя задача —
    давать чёткие юридические выводы и указывать конкретные формулировки
    из текста, на которых они основаны. Не генерируй JSON —
    просто излагай выводы структурированно и однозначно.
    </output_expectations>

  enabled: true
  mode: "hybrid"
  fields:
    - name: "has_sanctions_reps"
      type: "string"
      allowed_values:
        - "yes"
        - "none"
        - "unclear"

    - name: "covered_regimes"
      type: "string"

    - name: "has_compliance_obligations"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "requires_notification"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "event_consequences"
      type: "string"
      allowed_values:
        - "none"
        - "suspension"
        - "termination"
        - "payment_refusal"
        - "mixed"
        - "unclear"

    - name: "red_flags"
      type: "string"

    - name: "reason"
      type: "string"

  store_payload: true

red_flags:
  items:
    - code: "SAN1"
      description: "Отсутствие санкционных положений."
    - code: "SAN2"
      description: "Risk-based trigger: контрагент может расторгнуть/отказать."
    - code: "SAN3"
      description: "Санкционные заверения не покрывают UBO и аффилированных лиц."