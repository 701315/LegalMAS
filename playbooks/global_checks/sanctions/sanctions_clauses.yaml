id: "sanctions_clauses"
name: "Санкционные оговорки"
description: >
  Анализирует наличие и содержание санкционных оговорок: заверения об отсутствии
  санкций, соблюдении режимов (США, ЕС, UK, ООН, локальные), обязанности уведомлять
  о санкционных событиях и последствия таких событий.

doc_types: []

severity: "critical"
severity_if_fail: "critical"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"

rules:
  keywords:
    - "санкции"
    - "санкционн"
    - "sanctions"
    - "OFAC"
    - "EU sanctions"
    - "UK sanctions"
    - "UN sanctions"
    - "санкционные режимы"
    - "санкционные ограничения"
    - "embargo"
    - "restricted party"
    - "sanctioned person"
    - "санкционный список"
    - "лист санкций"
  keyword_mode: "any"
  regex_patterns: []
  clause_patterns: []

llm:
  prompt_template: |
    <role>
    Ты — юрист по международным санкциям.
    Твоя специализация — договорные санкционные оговорки и распределение санкционного риска.
    </role>

    <context>
    Ниже приведены фрагменты договора, где могут быть санкционные положения:

    {context}
    </context>

    <instructions>
    Проведи анализ по шагам. Каждый шаг логически связан с одним или
    несколькими полями итоговой оценки.

    Шаг 1 — САНКЦИОННЫЕ ЗАВЕРЕНИЯ И ГАРАНТИИ
    (используется для "has_sanctions_representations"):
    - Определи, есть ли заверения о том, что:
      * стороны, их аффилированные лица и бенефициарные владельцы (UBO)
        не являются sanctioned person / restricted party;
      * они не включены в санкционные списки (OFAC, ЕС, UK, ООН, локальные);
      * на них не распространяются санкционные запреты на операции по договору.
    - Сформулируй вывод:
      * "yes" — такие заверения явно есть;
      * "no" — из фрагментов видно, что их нет;
      * "unclear" — недостаточно данных.

    Шаг 2 — ОБЯЗАТЕЛЬСТВА ПО СОБЛЮДЕНИЮ САНКЦИОННЫХ РЕЖИМОВ
    (используется для "has_sanctions_compliance_obligations"):
    - Определи, есть ли прямые обязательства:
      * соблюдать санкции США, ЕС, UK, ООН и локальных органов,
        а также иные restrictive measures и embargo;
      * не совершать сделки с лицами из санкционных списков,
        не направлять платежи через санкционные банки и т.п.
    - Установи значение "has_sanctions_compliance_obligations": "yes" / "no" / "unclear".

    Шаг 3 — ОБЯЗАННОСТЬ УВЕДОМЛЯТЬ О САНКЦИОННЫХ СОБЫТИЯХ
    (используется для "requires_sanctions_event_notification"):
    - Проверь, предусмотрена ли обязанность стороны незамедлительно уведомить контрагента:
      * о включении самой стороны или её UBO/аффилированных лиц в санкционный список;
      * о блокировке счетов или запрете на операции;
      * о других санкционных событиях, влияющих на исполнение договора.
    - Сформулируй вывод: "yes" / "no" / "unclear" для
      "requires_sanctions_event_notification".

    Шаг 4 — ПОСЛЕДСТВИЯ САНКЦИОННОГО СОБЫТИЯ
    (используется для "sanctions_event_consequences"):
    - Определи, какие последствия наступают при санкционном событии:
      * приостановление исполнения обязательств — "suspension";
      * право расторгнуть договор — "termination";
      * право отказать в платеже / payment refusal (в т.ч. банком) — "payment_refusal";
      * сочетание нескольких мер (например, приостановка + возможное расторжение) — "mixed";
      * отсутствие специальных последствий — "none";
      * если по тексту неясно — "unclear".
    - Установи соответствующее значение для "sanctions_event_consequences".

    Шаг 5 — ОБЩИЙ САНКЦИОННЫЙ РИСК ДЛЯ TARGET
    (используется для "overall_risk_level" и "reason"):
    - Оцени общий санкционный риск, учитывая:
      * наличие и качество санкционных заверений и обязательств по соблюдению режимов;
      * наличие обязанности уведомлять о санкционных событиях;
      * жёсткость последствий (особенно права одностороннего отказа от платежей
        и расторжения при оценке "риска нарушения санкций", а не фактическом запрете);
      * распределение санкционного риска между сторонами (кто de facto несёт последствия).
    - Сформулируй общий риск как:
      * "low" — сбалансированные оговорки, чёткие заверения и уведомления,
        последствия привязаны к фактическому запрету и предусматривают добросовестный поиск решений;
      * "medium" — положения есть, но сформулированы общо или дают стороне
        умеренно широкие права при санкционных событиях;
      * "high" — отсутствие специальных санкционных оговорок при международном элементе
        или формулировки, позволяющие легко отказаться от платежей/исполнения
        по субъективному "риску".
    - В "reason" кратко опиши:
      * какие санкционные заверения и обязательства присутствуют/отсутствуют;
      * какие последствия предусмотрены (с указанием ключевых формулировок);
      * почему такая конструкция создаёт низкий/средний/высокий риск для Target.
    </instructions>

    <edge_cases>
    Обрабатывай пограничные ситуации так:

    - Санкционные положения позволяют контрагенту отказаться от платежей
      или расторгнуть договор уже при "риске нарушения санкций" или на основе
      собственной risk-based оценки, без объективного запрета:
      рассматривай это как усиленный риск для Target и отражай в
      "sanctions_event_consequences" (обычно "payment_refusal" или "mixed")
      и в высоком "overall_risk_level".

    - Есть только общая ссылка "Стороны обязуются соблюдать применимое законодательство"
      без конкретных санкционных заверений и механизмов:
      по "has_sanctions_representations" и "has_sanctions_compliance_obligations"
      часто ставь "unclear" и указывай в reason, что такой подход слаб для санкционных рисков.

    - Предусмотрены балансные санкционные оговорки:
      * чёткие заверения об отсутствии санкций;
      * обязанность уведомлять;
      * право временно приостановить или реструктурировать исполнение,
        но без произвольного удержания средств или бессрочного отказа от платежа;
      это может означать "low" или "medium" риск в зависимости от деталей.

    - Договор допускает освобождение стороны от ответственности (illegality / force majeure)
      только в той мере, в какой санкции реально делают исполнение незаконным,
      и предусматривает механизмы добросовестного сотрудничества
      (альтернативные банки, валюта и т.п.):
      учитывай это как фактор снижения санкционного риска для Target.

    - Пустые или нерелевантные фрагменты:
      по большинству полей используй "unclear",
      "overall_risk_level" — "medium" из‑за неопределённости,
      reason — "Недостаточно данных для анализа санкционных оговорок и распределения санкционного риска."
    </edge_cases>

    <output_expectations>
    На основе твоего анализа отдельный механизм извлечения сформирует
    структурированные поля по заранее заданной схеме. Твоя задача —
    давать чёткие юридические выводы и указывать конкретные формулировки
    из текста, на которых они основаны.
    </output_expectations>
  prompt_file: null
  context_k: 5
  temperature: 0.0
  max_tokens: 640

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  context_k: 5
  max_chunks: 10
  boost_keywords:
    - "sanctions"
    - "санкции"
    - "sanctioned person"
    - "restricted party"
  rerank: true
  filters: {}

conditional: null

extraction:
  enabled: true
  mode: "hybrid"
  fields:
    - name: "has_sanctions_representations"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "has_sanctions_compliance_obligations"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "requires_sanctions_event_notification"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "sanctions_event_consequences"
      type: "string"
      allowed_values:
        - "none"
        - "suspension"
        - "termination"
        - "payment_refusal"
        - "mixed"
        - "unclear"

    - name: "overall_risk_level"
      type: "string"
      allowed_values:
        - "low"
        - "medium"
        - "high"

    - name: "reason"
      type: "string"

  store_payload: true

red_flags:
  items:
    - code: "SAN1"
      description: "Отсутствие санкционных положений в договоре с очевидным международным/банковским элементом."
    - code: "SAN2"
      description: "Формулировки, позволяющие контрагенту расторгнуть договор и отказаться от платежей при любом 'риске нарушения санкций'."
