id: "sanctions_clauses"
name: "Санкционные оговорки"
group: "Compliance"
description: >
  Анализирует наличие и содержание санкционных оговорок: заверения
  об отсутствии санкций, охват (UBO, аффилированные лица), соблюдение
  режимов (OFAC, ЕС, UK, ООН, локальные), обязанности уведомлять о
  санкционных событиях, последствия (приостановка, расторжение, отказ
  в платеже), триггер последствий (risk-based vs. actual designation),
  наличие механизмов смягчения.

  Формирует краткий user-facing вывод и оценивает распределение
  санкционного риска между сторонами.

doc_types: []

severity: "critical"
severity_if_fail: "critical"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"
ui_mode: "field_extraction"

rules:
  keyword_mode: any

  keywords:
    high:
      - "(?i)\\bsanctions?\\b"
      - "(?i)\\bсанкци[яийю]\\b"
      - "(?i)санкционн[а-яые]+"
      - "(?i)restrictive\\s+measures?"
      - "(?i)ограничительн[а-яые]+\\s+мер[ыа]"
      - "(?i)\\bOFAC\\b"
      - "(?i)\\bSDN\\b"
      - "(?i)SDN\\s+list"
      - "(?i)Specially\\s+Designated\\s+Nationals?"
      - "(?i)EU\\s+sanctions?"
      - "(?i)EU\\s+consolidated\\s+list"
      - "(?i)UK\\s+sanctions?"
      - "(?i)HM\\s+Treasury"
      - "(?i)UN\\s+sanctions?"
      - "(?i)Security\\s+Council\\s+sanctions?"
      - "(?i)санкционн[а-яый]+\\s+списо?к"
      - "(?i)перечень\\s+[\\s\\S]{0,20}санкци"
      - "(?i)sanctioned\\s+(person|party|entity)"
      - "(?i)restricted\\s+part(y|ies)[\\s\\S]{0,20}sanction"
      - "(?i)designated\\s+(person|party|entity)"
      - "(?i)санкционн[а-яое]+\\s+(лиц[оа]|сторон|организаци)"
      - "(?i)(represent|warrant)[\\s\\S]{0,40}(sanction|sanctioned|restricted\\s+party)"
      - "(?i)(заверя|гарантир)[\\s\\S]{0,40}санкци"
      - "(?i)not\\s+(a\\s+)?sanctioned\\s+(person|party|entity)"
      - "(?i)не\\s+являе?тся\\s+[\\s\\S]{0,20}санкционн"
      - "(?i)(suspend|terminat|block)[\\s\\S]{0,40}sanction"
      - "(?i)sanction[\\s\\S]{0,40}(suspend|terminat|block)"
      - "(?i)(приостанов|расторг|заблокир)[\\s\\S]{0,40}санкци"

    medium:
      - "(?i)\\bembargo\\b"
      - "(?i)\\bэмбарго\\b"
      - "(?i)trade\\s+embargo"
      - "(?i)notif(y|ication)\\s+[\\s\\S]{0,30}sanction"
      - "(?i)уведоми[тьла]?\\s+[\\s\\S]{0,30}санкци"
      - "(?i)sanction[s]?\\s+event"
      - "(?i)sanctions?\\s+compliance"
      - "(?i)comply\\s+with\\s+[\\s\\S]{0,30}sanctions?"
      - "(?i)соблюд[а-я]+\\s+[\\s\\S]{0,30}санкци"
      - "(?i)sanctions?\\s+screening"
      - "(?i)проверк[аи]\\s+(по\\s+)?санкционн[а-яый]+\\s+списк"
      - "(?i)risk\\s+of\\s+(sanctions?|violat)"
      - "(?i)риск\\s+(санкции|нарушени[ея])"
      - "(?i)in\\s+its?\\s+reasonable\\s+(opinion|judgment)[\\s\\S]{0,30}sanction"
      - "(?i)по\\s+(разумному\\s+)?усмотрени[юя][\\s\\S]{0,30}санкци"
      - "(?i)illegality[\\s\\S]{0,40}sanction"
      - "(?i)force\\s+majeure[\\s\\S]{0,40}sanction"
      - "(?i)невозможность\\s+исполнения[\\s\\S]{0,40}санкци"
      - "(?i)refus[a-z]+\\s+(payment|transfer)[\\s\\S]{0,30}sanction"
      - "(?i)block[ed]?\\s+(funds?|payment)[\\s\\S]{0,30}sanction"
      - "(?i)заблокир[а-я]+\\s+(средств|платеж)[\\s\\S]{0,30}санкци"

    low:
      - "(?i)\\bOFAC\\b"
      - "(?i)\\bSDN\\s+list\\b"
      - "(?i)EU\\s+sanctions"
      - "(?i)UK\\s+sanctions"
      - "(?i)UN\\s+sanctions"
      - "(?i)sanctioned\\s+person"
      - "(?i)санкционная\\s+оговорка"
      - "(?i)sanctions\\s+compliance"
      - "(?i)соблюдение\\s+санкций"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 700

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  retrieval_profile: "sanctions_compliance_check"
  context_k: 5
  max_chunks: 10
  
  retrieval_query: >
    санкции санкционная оговорка sanctions OFAC SDN compliance restrictive measures 
    санкционный список embargo риск санкций illegality

  boost_keywords:
    - "sanctions"
    - "санкции"
    - "OFAC"
    - "SDN list"
    - "EU sanctions"
    - "UK sanctions"
    - "UN sanctions"
    - "sanctioned person"
    - "restricted party"
    - "санкционный список"
    - "embargo"
    - "sanctions compliance"
    - "соблюдение санкций"
    - "sanctions event"
    - "санкционное событие"
    - "notify sanctions"
    - "уведомить о санкциях"
    - "suspension sanctions"
    - "termination sanctions"
    - "payment refusal"
    - "block funds"
    - "risk of sanctions"
    - "риск санкций"
    - "illegality"

  negative_keywords:
    - "интеллектуальная собственность"
    - "коммерческая тайна"
    - "персональные данные"
    - "гарантийный срок"

  preferred_unit_types:
    - "general_provision"
    - "obligation"

  excluded_unit_types:
    - "technical_fragment"
    - "appendix_reference"
    - "structural_anchor"

  preferred_clause_functions:
    - "obligations"
    - "representations"
    - "procedures"

  position_bias:
    preferred_range: [0.0, 1.0]
    boost: 0.10
    scope: "segment"

  rerank: true
  filters: {}

conditional: null

enrichment_hints:
  preferred_segment_types:
    - "contract"
    - "amendment"
    - "annex"
  excluded_segment_types:
    - "technical_specification"
    - "price_list"
    - "invoice"
    - "act"
    - "schedule"
  preferred_clause_functions:
    - "representations"
    - "boilerplate"
    - "procedures"
  confidence_bonus_on_match: 0.10
  confidence_penalty_on_excluded_segment: 0.15

extraction:
  enabled: true
  mode: "hybrid"
  llm_max_tokens: 1450

  presence_signal:
    field: "sanctions_status"
    present_values: ["present"]
    missing_values: ["missing"]
    unclear_values: ["unclear"]

  llm_prompt_extraction: |
    <role>
    Ты — юрист по международным санкциям и compliance.
    Твоя задача — точно извлечь из текста:
    1) есть ли в договоре регулирование санкционных оговорок;
    2) если есть — какие условия установлены:
       - санкционные заверения и их охват;
       - покрываемые санкционные режимы;
       - обязательства по соблюдению и уведомлению;
       - последствия санкционного события и их триггер;
       - механизмы смягчения.

    КРИТИЧЕСКИ ВАЖНО:
    - Извлекай ТОЛЬКО то, что прямо написано в тексте.
    - НЕ додумывай санкционные режимы, если они не упоминаются.
    - НЕ считай общие compliance-фразы санкционными заверениями
      без явного упоминания санкций.
    - Если ни один фрагмент не содержит информации о санкциях
      (нет упоминаний sanctions / OFAC / SDN / санкций) —
      sanctions_status = "missing", location = null.
    - Если тексты по теме есть, но вывод сделать нельзя —
      sanctions_status = "unclear".
    </role>

    <context_rules>
    - Некоторые фрагменты могут быть нерелевантны — игнорируй их.
    - Если фрагменты противоречат друг другу — используй "unclear"
      и объясни в reason.
    - Для covered_regimes — перечисляй только те режимы,
      которые прямо названы в тексте.
    - Различай "actual_designation" (фактическое включение в список)
      и "risk_based" (субъективная оценка риска контрагентом).
    - Внутрироссийские договоры без международного элемента
      обычно не имеют санкционных оговорок — это нормально,
      используй "no", а не "unclear".
    - Если ни один фрагмент не содержит информации о санкциях —
      sanctions_status = "missing", location = null.
      Не использовать "unclear" при полном отсутствии релевантных
      фрагментов.
    </context_rules>

    <context>
    Ниже приведены релевантные фрагменты договора:

    {context}
    </context>

    <task>
    Заполни только следующие поля:
    - sanctions_display
    - sanctions_status
    - has_sanctions_reps
    - sanctions_reps_coverage
    - covered_regimes
    - has_compliance_obligations
    - requires_notification
    - event_consequences
    - consequences_trigger
    - has_mitigation_mechanisms
    - reason
    </task>

    <location_instructions>
    Для каждого поля по возможности укажи location в формате:
    {"clause_ref": "п. 12.1", "page": 7, "quote": "дословная фраза из договора"}

    Правила:
    - clause_ref — короткая ссылка на пункт / раздел / статью именно в том
      виде, как она написана в договоре;
    - page — целое число страницы;
    - quote — дословная фраза из текста договора (НЕ пересказ, НЕ парафраз).
      Копируй её посимвольно, сохраняя формулировку и порядок слов.
      Оптимальная длина: 30–300 символов.
    - Для synthesized-полей (sanctions_display, covered_regimes,
      reason) location ВСЕГДА null.
    - Для sanctions_status = "missing" — location = null.
    - Для sanctions_status = "present" / "unclear" — quote
      с наиболее релевантной фразой договора.
    - Для has_sanctions_reps, has_compliance_obligations,
      requires_notification, has_mitigation_mechanisms:
      * если "yes" — quote с фразой-основанием;
      * если "no" — различай: прямое исключение (quote обязательна)
        vs отсутствие упоминания (location = null);
      * если "unclear" — location = null.
    - Для sanctions_reps_coverage — quote с фразой, показывающей
      охват (UBO, аффилированные лица, списки).
    - Для event_consequences — quote с фразой-последствием.
    - Для consequences_trigger — quote с фразой-триггером
      (actual designation vs risk-based).
    - Не выдумывай location или quote. Если дословную фразу определить
      нельзя — location = null.
    </location_instructions>

    <instructions>
    Шаг 0 — НАЛИЧИЕ РЕГУЛИРОВАНИЯ САНКЦИОННЫХ ОГОВОРОК

    Заполни "sanctions_status".

    Значения:
    - "present" — если хотя бы одно содержательное signal-поле
      указывает на наличие информации по теме:
      * has_sanctions_reps = "yes";
      * has_compliance_obligations = "yes";
      * requires_notification = "yes";
      * has_mitigation_mechanisms = "yes";
      * event_consequences ∈ {"suspension", "termination",
        "payment_refusal", "mixed"};
      * sanctions_reps_coverage ∈ {"full", "partial"};
      * ЛИБО любое поле = "no" / "not_applicable" / "none", но
        с заполненным location с прямой цитатой (см. RF3).
    - "missing" — если все содержательные поля = "no" /
      "not_applicable" / "none" БЕЗ цитат, ЛИБО фрагментов по теме
      нет вообще.
    - "unclear" — если все содержательные = "unclear" при наличии
      фрагментов, но невозможности вывода.

    Шаг 1 — САНКЦИОННЫЕ ЗАВЕРЕНИЯ

    Заполни "has_sanctions_reps".

    Значения:
    - "yes" — явные заверения об отсутствии санкций
      (represent, warrant, заверяет, гарантирует).
    - "no" — заверения отсутствуют.
    - "unclear" — нельзя надёжно определить.

    Шаг 2 — ОХВАТ ЗАВЕРЕНИЙ

    Заполни "sanctions_reps_coverage".

    Значения:
    - "full" — охватывает сторону + UBO + аффилированных лиц
      + конкретные списки (SDN, EU consolidated, HM Treasury).
    - "partial" — только сама сторона без UBO / аффилированных.
    - "not_applicable" — заверений нет.
    - "unclear" — нельзя определить.

    Шаг 3 — ПОКРЫВАЕМЫЕ РЕЖИМЫ

    Заполни "covered_regimes".

    Правила:
    - Только те режимы, которые прямо названы в тексте.
    - Формат — через ";": "OFAC; EU sanctions; UK sanctions"
    - Если режимы не указаны: "Не указаны"
    - Если санкционных положений нет: "Не применимо"
    - Если нельзя определить: "Не удалось определить"

    Шаг 4 — ОБЯЗАТЕЛЬСТВА ПО СОБЛЮДЕНИЮ

    Заполни "has_compliance_obligations".

    Значения:
    - "yes" — прямые обязательства: не совершать сделки с
      sanctioned persons, проводить screening, соблюдать режимы.
    - "no" — нет.
    - "unclear" — нельзя определить.

    Шаг 5 — УВЕДОМЛЕНИЕ О САНКЦИОННЫХ СОБЫТИЯХ

    Заполни "requires_notification".

    Значения:
    - "yes" — есть явная обязанность уведомить о санкционных
      событиях (попадании в список, изменении статуса).
    - "no" — нет.
    - "unclear" — нельзя определить.

    Шаг 6 — ПОСЛЕДСТВИЯ САНКЦИОННОГО СОБЫТИЯ

    Заполни "event_consequences".

    Значения:
    - "none" — нет специальных последствий.
    - "suspension" — приостановление исполнения.
    - "termination" — право расторгнуть договор.
    - "payment_refusal" — право отказать в платеже / переводе.
    - "mixed" — комбинация мер.
    - "unclear" — нельзя определить.

    Шаг 7 — ТРИГГЕР ПОСЛЕДСТВИЙ

    Заполни "consequences_trigger".

    Значения:
    - "actual_designation" — только при фактическом включении
      в санкционный список — объективный критерий.
    - "risk_based" — при "риске нарушения" или "reasonable opinion"
      контрагента — субъективный критерий.
    - "not_applicable" — нет последствий.
    - "unclear" — нельзя определить.

    Шаг 8 — МЕХАНИЗМЫ СМЯГЧЕНИЯ

    Заполни "has_mitigation_mechanisms".

    Значения:
    - "yes" — есть: альтернативные банки / валюты, разумный срок
      для поиска решений, обязанность сотрудничать.
    - "no" — нет.
    - "unclear" — нельзя определить.

    Шаг 9 — НОРМАЛИЗОВАННЫЙ DISPLAY ДЛЯ DD GRID

    Заполни "sanctions_display".

    Это итоговое поле для таблицы.
    Строй его ТОЛЬКО на основе уже заполненных полей выше.
    Не добавляй информацию сверх них.

    Правила:
    - Если sanctions_status = "missing":
      "Нет санкционных заверений; нет compliance обязательств"
    - Если все поля unclear:
      "Не удалось определить санкционные оговорки"
    - Если has_sanctions_reps = "no"
      и has_compliance_obligations = "no":
      "Нет санкционных заверений; нет compliance обязательств"
    - Иначе комбинируй через ";":
      * sanctions_reps_coverage (full / partial)
      * covered_regimes (кратко)
      * consequences_trigger (если "risk_based": предупредить)
      * has_mitigation_mechanisms (если "yes": "смягчение")
    - Не более 5 фактов через ";".

    Шаг 10 — КРАТКОЕ ОБОСНОВАНИЕ

    Заполни "reason".

    Правила:
    - Первое предложение — краткий вывод.
    - Второе — короткая цитата из текста (до 100 символов).
    - Пиши по-русски.
    </instructions>

    <edge_cases>
    - Risk-based trigger ("reasonable opinion"):
      * sanctions_status = "present"
      * consequences_trigger = "risk_based"

    - Заверения только для стороны без UBO:
      * sanctions_status = "present"
      * sanctions_reps_coverage = "partial"

    - Actual designation + уведомление + альтернативные банки:
      * sanctions_status = "present"
      * consequences_trigger = "actual_designation"
      * has_mitigation_mechanisms = "yes"

    - Внутрироссийский договор без международного элемента:
      * sanctions_status = "missing"
      * has_sanctions_reps = "no"
      * has_compliance_obligations = "no"
      * sanctions_reps_coverage = "not_applicable"
      * covered_regimes = "Не применимо"
      * requires_notification = "no"
      * event_consequences = "none"
      * consequences_trigger = "not_applicable"
      * has_mitigation_mechanisms = "no"
      * sanctions_display =
        "Нет санкционных заверений; нет compliance обязательств"
      * location у всех полей = null.

    - Договор прямо фиксирует отсутствие санкционных оговорок:
      * sanctions_status = "present"
      * has_sanctions_reps = "no"
      * location с прямой цитатой об отсутствии.

    - Формулировки есть, но вывод невозможен:
      * sanctions_status = "unclear"
      * covered_regimes = "Не удалось определить"
      * sanctions_display =
        "Не удалось определить санкционные оговорки"
    </edge_cases>

    <output_expectations>
    - Верни результат строго в формате JSON.
    - Не оборачивай в markdown-блоки (без ```).
    - Не добавляй комментариев вне JSON.
    - Все значения полей с allowed_values — на английском.
    - Свободные текстовые поля (sanctions_display, covered_regimes,
      reason) — на русском языке.
    - Не добавляй полей, кроме указанных.
    - Для каждого поля возвращай объект с ключами
      "value", "confidence", "location".

    Пример структуры ответа:
    {
      "sanctions_display": {"value": "Заверения (full: UBO + аффилированные); OFAC + EU + UK; actual designation; смягчение", "confidence": 0.92, "location": null},
      "sanctions_status": {"value": "present", "confidence": 0.95, "location": {"clause_ref": "п. 14.1", "page": 8, "quote": "Neither party nor any of its affiliates or beneficial owners is a sanctioned person under OFAC, EU or UK sanctions"}},
      "has_sanctions_reps": {"value": "yes", "confidence": 0.95, "location": {"clause_ref": "п. 14.1", "page": 8, "quote": "Neither party nor any of its affiliates is a sanctioned person"}},
      "sanctions_reps_coverage": {"value": "full", "confidence": 0.85, "location": {"clause_ref": "п. 14.1", "page": 8, "quote": "nor any of its affiliates or beneficial owners"}},
      "covered_regimes": {"value": "OFAC; EU sanctions; UK sanctions", "confidence": 0.90, "location": null},
      "has_compliance_obligations": {"value": "yes", "confidence": 0.90, "location": {"clause_ref": "п. 14.2", "page": 8, "quote": "Each party shall comply with all applicable sanctions regimes"}},
      "requires_notification": {"value": "yes", "confidence": 0.85, "location": {"clause_ref": "п. 14.3", "page": 8, "quote": "a party shall notify the other of any sanctions event within 5 business days"}},
      "event_consequences": {"value": "mixed", "confidence": 0.85, "location": null},
      "consequences_trigger": {"value": "actual_designation", "confidence": 0.90, "location": {"clause_ref": "п. 14.4", "page": 8, "quote": "upon actual designation of a party on a sanctions list"}},
      "has_mitigation_mechanisms": {"value": "yes", "confidence": 0.80, "location": {"clause_ref": "п. 14.5", "page": 8, "quote": "parties shall cooperate to find alternative payment channels"}},
      "reason": {"value": "...", "confidence": 0.90, "location": null}
    }
    </output_expectations>

  fields:
    - name: "sanctions_display"
      type: "string"
      presentation: "fact"
      label: "Санкционные оговорки"
      description: "Нормализованный user-facing вывод для DD Grid"
      display_in_grid: true
      display_priority: 1

    - name: "sanctions_status"
      type: "string"
