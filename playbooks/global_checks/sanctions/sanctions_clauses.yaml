id: "sanctions_clauses"
name: "Санкционные оговорки"
group: "Compliance"
description: >
  Анализирует наличие и содержание санкционных оговорок: заверения
  об отсутствии санкций, охват (UBO, аффилированные лица), соблюдение
  режимов (OFAC, ЕС, UK, ООН, локальные), обязанности уведомлять о
  санкционных событиях, последствия (приостановка, расторжение, отказ
  в платеже), триггер последствий (risk-based vs. actual designation),
  налиличие механизмов смягчения.

  Формирует краткий user-facing вывод и оценивает распределение
  санкционного риска между сторонами.

doc_types: []

severity: "critical"
severity_if_fail: "critical"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"
ui_mode: "field_extraction"

rules:
  keyword_mode: any

  keywords:
    high:
      # Прямые санкционные термины
      - "(?i)\\bsanctions?\\b"
      - "(?i)\\bсанкци[яийю]\\b"
      - "(?i)санкционн[а-яые]+"
      - "(?i)restrictive\\s+measures?"
      - "(?i)ограничительн[а-яые]+\\s+мер[ыа]"

      # Санкционные органы и списки
      - "(?i)\\bOFAC\\b"
      - "(?i)\\bSDN\\b"
      - "(?i)SDN\\s+list"
      - "(?i)Specially\\s+Designated\\s+Nationals?"
      - "(?i)EU\\s+sanctions?"
      - "(?i)EU\\s+consolidated\\s+list"
      - "(?i)UK\\s+sanctions?"
      - "(?i)HM\\s+Treasury"
      - "(?i)UN\\s+sanctions?"
      - "(?i)Security\\s+Council\\s+sanctions?"
      - "(?i)санкционн[а-яый]+\\s+списо?к"
      - "(?i)перечень\\s+[\\s\\S]{0,20}санкци"

      # Sanctioned person
      - "(?i)sanctioned\\s+(person|party|entity)"
      - "(?i)restricted\\s+part(y|ies)[\\s\\S]{0,20}sanction"
      - "(?i)designated\\s+(person|party|entity)"
      - "(?i)санкционн[а-яое]+\\s+(лиц[оа]|сторон|организаци)"

      # Санкционные заверения
      - "(?i)(represent|warrant)[\\s\\S]{0,40}(sanction|sanctioned|restricted\\s+party)"
      - "(?i)(заверя|гарантир)[\\s\\S]{0,40}санкци"
      - "(?i)not\\s+(a\\s+)?sanctioned\\s+(person|party|entity)"
      - "(?i)не\\s+являе?тся\\s+[\\s\\S]{0,20}санкционн"

      # Последствия санкционных событий
      - "(?i)(suspend|terminat|block)[\\s\\S]{0,40}sanction"
      - "(?i)sanction[\\s\\S]{0,40}(suspend|terminat|block)"
      - "(?i)(приостанов|расторг|заблокир)[\\s\\S]{0,40}санкци"

    medium:
      # Embargo
      - "(?i)\\bembargo\\b"
      - "(?i)\\bэмбарго\\b"
      - "(?i)trade\\s+embargo"

      # Уведомления о санкционных событиях
      - "(?i)notif(y|ication)\\s+[\\s\\S]{0,30}sanction"
      - "(?i)уведоми[тьла]?\\s+[\\s\\S]{0,30}санкци"
      - "(?i)sanction[s]?\\s+event"

      # Compliance with sanctions
      - "(?i)sanctions?\\s+compliance"
      - "(?i)comply\\s+with\\s+[\\s\\S]{0,30}sanctions?"
      - "(?i)соблюд[а-я]+\\s+[\\s\\S]{0,30}санкци"
      - "(?i)sanctions?\\s+screening"
      - "(?i)проверк[аи]\\s+(по\\s+)?санкционн[а-яый]+\\s+списк"

      # Risk-based trigger
      - "(?i)risk\\s+of\\s+(sanctions?|violat)"
      - "(?i)риск\\s+(санкции|нарушени[ея])"
      - "(?i)in\\s+its?\\s+reasonable\\s+(opinion|judgment)[\\s\\S]{0,30}sanction"
      - "(?i)по\\s+(разумному\\s+)?усмотрени[юя][\\s\\S]{0,30}санкци"

      # Illegality / force majeure
      - "(?i)illegality[\\s\\S]{0,40}sanction"
      - "(?i)force\\s+majeure[\\s\\S]{0,40}sanction"
      - "(?i)невозможность\\s+исполнения[\\s\\S]{0,40}санкци"

      # Payment refusal
      - "(?i)refus[a-z]+\\s+(payment|transfer)[\\s\\S]{0,30}sanction"
      - "(?i)block[ed]?\\s+(funds?|payment)[\\s\\S]{0,30}sanction"
      - "(?i)заблокир[а-я]+\\s+(средств|платеж)[\\s\\S]{0,30}санкци"

    low:
      - "(?i)\\bOFAC\\b"
      - "(?i)\\bSDN\\s+list\\b"
      - "(?i)EU\\s+sanctions"
      - "(?i)UK\\s+sanctions"
      - "(?i)UN\\s+sanctions"
      - "(?i)sanctioned\\s+person"
      - "(?i)санкционная\\s+оговорка"
      - "(?i)sanctions\\s+compliance"
      - "(?i)соблюдение\\s+санкций"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 700

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  context_k: 5
  max_chunks: 10
  
  retrieval_query: >
    санкции санкционная оговорка sanctions OFAC SDN compliance restrictive measures 
    санкционный список embargo риск санкций illegality

  boost_keywords:
    - "sanctions"
    - "санкции"
    - "OFAC"
    - "SDN list"
    - "EU sanctions"
    - "UK sanctions"
    - "UN sanctions"
    - "sanctioned person"
    - "restricted party"
    - "санкционный список"
    - "embargo"
    - "sanctions compliance"
    - "соблюдение санкций"
    - "sanctions event"
    - "санкционное событие"
    - "notify sanctions"
    - "уведомить о санкциях"
    - "suspension sanctions"
    - "termination sanctions"
    - "payment refusal"
    - "block funds"
    - "risk of sanctions"
    - "риск санкций"
    - "illegality"

  negative_keywords:
    - "интеллектуальная собственность"
    - "коммерческая тайна"
    - "персональные данные"
    - "гарантийный срок"

  preferred_unit_types:
    - "general_provision"
    - "obligation"

  excluded_unit_types:
    - "technical_fragment"
    - "appendix_reference"
    - "structural_anchor"

  preferred_clause_functions:
    - "compliance"
    - "representations"
    - "termination"

  position_bias:
    preferred_range: [0.0, 1.0]
    boost: 0.10
    scope: "segment"

  rerank: true
  filters: {}

conditional: null

enrichment_hints:
  preferred_segment_types:
    - "contract"
    - "amendment"
    - "annex"
  excluded_segment_types:
    - "technical_specification"
    - "price_list"
    - "invoice"
    - "act"
    - "schedule"
  preferred_clause_functions:
    - "representations_warranties"
    - "general_provisions"
    - "termination"
  confidence_bonus_on_match: 0.10
  confidence_penalty_on_excluded_segment: 0.15

extraction:
  enabled: true
  mode: "hybrid"
  llm_max_tokens: 1150

  llm_prompt_extraction: |
    <role>
    Ты — юрист по международным санкциям.
    Твоя задача — точно извлечь из текста:
    1) санкционные заверения и их охват;
    2) покрываемые санкционные режимы;
    3) обязательства по соблюдению и уведомлению;
    4) последствия санкционного события и их триггер;
    5) механизмы смягчения.

    Не придумывай режимы если они не упоминаются.
    </role>

    <context>
    Ниже приведены релевантные фрагменты договора:

    {context}
    </context>

    <task>
    Заполни только следующие поля:
    - sanctions_display
    - has_sanctions_reps
    - sanctions_reps_coverage
    - covered_regimes
    - has_compliance_obligations
    - requires_notification
    - event_consequences
    - consequences_trigger
    - has_mitigation_mechanisms
    - reason

    Важно:
    - пиши коротко и по-русски.
    </task>

    <instructions>
    Шаг 1 — САНКЦИОННЫЕ ЗАВЕРЕНИЯ

    Заполни "has_sanctions_reps".

    Значения:
    - "yes" — явные заверения об отсутствии санкций.
    - "no" — заверения отсутствуют.
    - "unclear" — неясно.

    Шаг 2 — ОХВАТ ЗАВЕРЕНИЙ

    Заполни "sanctions_reps_coverage".

    Значения:
    - "full" — охватывает сторону + UBO + аффилированных лиц
      + конкретные списки (SDN, EU consolidated, HM Treasury).
    - "partial" — только сама сторона без UBO / аффилированных.
    - "not_applicable" — заверений нет.
    - "unclear" — неясно.

    Шаг 3 — ПОКРЫВАЕМЫЕ РЕЖИМЫ

    Заполни "covered_regimes".

    Правила:
    - Конкретные режимы через ";":
      "OFAC; EU sanctions; UK sanctions"
    - Если не указаны: "Не указаны"
    - Нет санкционных положений: "Не применимо"

    Шаг 4 — ОБЯЗАТЕЛЬСТВА ПО СОБЛЮДЕНИЮ

    Заполни "has_compliance_obligations".

    Значения:
    - "yes" — прямые обязательства: не совершать сделки с
      sanctioned persons, проводить screening.
    - "no" / "unclear"

    Шаг 5 — УВЕДОМЛЕНИЕ О САНКЦИОННЫХ СОБЫТИЯХ

    Заполни "requires_notification".

    Значения:
    - "yes" — обязанность уведомить о санкционных событиях.
    - "no" / "unclear"

    Шаг 6 — ПОСЛЕДСТВИЯ САНКЦИОННОГО СОБЫТИЯ

    Заполни "event_consequences".

    Значения:
    - "none" — нет специальных последствий.
    - "suspension" — приостановление исполнения.
    - "termination" — право расторгнуть.
    - "payment_refusal" — право отказать в платеже.
    - "mixed" — комбинация мер.
    - "unclear" — неясно.

    Шаг 7 — ТРИГГЕР ПОСЛЕДСТВИЙ

    Заполни "consequences_trigger".

    Значения:
    - "actual_designation" — только при фактическом включении
      в санкционный список — объективный.
    - "risk_based" — при "риске нарушения санкций" или
      "reasonable opinion" контрагента — субъективный.
    - "not_applicable" — нет последствий.
    - "unclear" — неясно.

    Шаг 8 — МЕХАНИЗМЫ СМЯГЧЕНИЯ

    Заполни "has_mitigation_mechanisms".

    Значения:
    - "yes" — есть: альтернативные банки / валюты, разумный
      срок для поиска решений, сотрудничество сторон.
    - "no" / "unclear"

    Шаг 9 — НОРМАЛИЗОВАННЫЙ DISPLAY ДЛЯ DD GRID

    Заполни "sanctions_display".

    Это не свободное summary.
    Строй display по следующей логике:

    Базовые случаи:
    - has_sanctions_reps = "no" и has_compliance_obligations = "no":
      "Нет санкционных заверений; нет compliance обязательств"
    - все поля unclear:
      "Не удалось определить санкционные оговорки"

    Если есть — комбинируй через ";":
    - sanctions_reps_coverage (full / partial)
    - covered_regimes (кратко)
    - consequences_trigger (если "risk_based": предупредить)
    - has_mitigation_mechanisms (если "yes": смягчение)

    Примеры:
    - "Заверения (full: UBO + аффилированные); OFAC + EU + UK; actual designation; смягчение"
    - "Заверения (только сторона); OFAC; risk-based trigger; нет смягчения"
    - "Нет санкционных заверений; нет compliance обязательств"
    - "Не удалось определить санкционные оговорки"

    Ограничение: не более 4–5 фактов через ";".

    Шаг 10 — КРАТКОЕ ОБОСНОВАНИЕ

    Заполни "reason".

    Правила:
    - 1–2 коротких предложения.
    - Укажи: заверения и охват, режимы, последствия и триггер,
      смягчение.
    - Приведи цитату в кавычках.
    </instructions>

    <edge_cases>
    - Risk-based trigger ("reasonable opinion"):
      * consequences_trigger = "risk_based"

    - Нет заверений при международных платежах:
      * has_sanctions_reps = "no"

    - Заверения только для стороны без UBO:
      * sanctions_reps_coverage = "partial"

    - Actual designation + уведомление + альтернативные банки:
      * consequences_trigger = "actual_designation"
      * has_mitigation_mechanisms = "yes"

    - Внутрироссийский договор без международного элемента:
      * has_sanctions_reps = "no"

    - Нет релевантных фрагментов:
      * все поля = "unclear"
      * sanctions_display = "Не удалось определить санкционные оговорки"
    </edge_cases>

    <output_expectations>
    Все значения коротко и по-русски.
    Не добавляй никаких полей, кроме указанных в схеме extraction.
    </output_expectations>

  fields:
    - name: "sanctions_display"
      type: "string"
      presentation: "fact"
      label: "Санкционные оговорки"
      description: "Нормализованный user-facing вывод для DD Grid"

    - name: "has_sanctions_reps"
      type: "string"
      presentation: "signal"
      description: "Санкционные заверения"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "sanctions_reps_coverage"
      type: "string"
      presentation: "signal"
      description: "Охват санкционных заверений"
      allowed_values:
        - "full"
        - "partial"
        - "not_applicable"
        - "unclear"

    - name: "covered_regimes"
      type: "string"
      presentation: "fact"
      label: "Покрываемые режимы"
      description: "Покрываемые санкционные режимы"

    - name: "has_compliance_obligations"
      type: "string"
      presentation: "signal"
      description: "Обязательства по соблюдению санкций"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "requires_notification"
      type: "string"
      presentation: "signal"
      description: "Обязанность уведомлять о санкционных событиях"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "event_consequences"
      type: "string"
      presentation: "signal"
      description: "Последствия санкционного события"
      allowed_values:
        - "none"
        - "suspension"
        - "termination"
        - "payment_refusal"
        - "mixed"
        - "unclear"

    - name: "consequences_trigger"
      type: "string"
      presentation: "signal"
      description: "Триггер последствий"
      allowed_values:
        - "actual_designation"
        - "risk_based"
        - "not_applicable"
        - "unclear"

    - name: "has_mitigation_mechanisms"
      type: "string"
      presentation: "signal"
      description: "Механизмы смягчения"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "reason"
      type: "string"
      presentation: "diagnostic"
      description: "Обоснование"

  store_payload: true


  