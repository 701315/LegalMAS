id: "export_control"
name: "Экспортный контроль и dual-use"
description: >
  Анализирует положения об экспортном контроле: ограничения на передачу
  технологий, ПО, оборудования, необходимость экспортных лицензий,
  соблюдение ITAR / EAR / EU dual-use / локальных режимов,
  ограничения на re-export и влияние на операционную модель Target.

  Формирует краткий user-facing вывод и оценивает регуляторный и
  операционный риск для Target.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"
ui_mode: "field_extraction"

rules:
  keyword_mode: any

  keywords:
    high:
      # Прямые экспортно-контрольные термины
      - "(?i)export\\s+control"
      - "(?i)экспортн[а-яый]+\\s+контрол"
      - "(?i)dual[-\\s]?use"
      - "(?i)двойного\\s+назначения"
      - "(?i)controlled\\s+(items?|goods?|technology|software)"
      - "(?i)контролируем[а-яые]+\\s+(товар|технолог|продукц)"

      # Конкретные режимы — США
      - "(?i)\\bITAR\\b"
      - "(?i)International\\s+Traffic\\s+in\\s+Arms\\s+Regulations?"
      - "(?i)\\bEAR\\b"
      - "(?i)Export\\s+Administration\\s+Regulations?"
      - "(?i)Commerce\\s+Control\\s+List"
      - "(?i)\\bCCL\\b"
      - "(?i)\\bUSML\\b"
      - "(?i)\\bECCN\\b"
      - "(?i)Export\\s+Control\\s+Classification\\s+Number"
      - "(?i)\\bBIS\\b"

      # Конкретные режимы — ЕС
      - "(?i)EU\\s+dual[-\\s]?use"
      - "(?i)Regulation\\s+\\(EU\\)\\s+2021/821"
      - "(?i)Council\\s+Regulation\\s+\\(EC\\)\\s+No\\s+428"

      # Конкретные режимы — Россия
      - "(?i)ФЗ[-\\s]?183"
      - "(?i)183[-\\s]?ФЗ"
      - "(?i)\\bФСТЭК\\b"
      - "(?i)контрольн[а-яые]+\\s+списк[иа][\\s\\S]{0,20}(экспорт|двойн)"

      # Экспортные лицензии
      - "(?i)export\\s+licen[cs]e"
      - "(?i)экспортн[а-яая]+\\s+лицензи[яию]"
      - "(?i)export\\s+permit"
      - "(?i)разрешени[ея]\\s+на\\s+экспорт"

      # Re-export
      - "(?i)re[-\\s]?export"
      - "(?i)реэкспорт"
      - "(?i)deemed\\s+export"

    medium:
      # Technology transfer
      - "(?i)technology\\s+transfer[\\s\\S]{0,20}(control|restrict|licen)"
      - "(?i)передач[аи]\\s+технолог[\\s\\S]{0,20}(контрол|ограничен|лицензи)"
      - "(?i)technical\\s+data[\\s\\S]{0,20}(export|control|restrict)"

      # Контролируемые страны/получатели
      - "(?i)restricted\\s+(countr|destination|part)[\\s\\S]{0,20}(export|control)"
      - "(?i)denied\\s+part(y|ies)"
      - "(?i)entity\\s+list"
      - "(?i)embargoed\\s+(countr|destination)"
      - "(?i)запрещённ[а-яые]+\\s+(страны|получател)[\\s\\S]{0,20}(экспорт|контрол)"

      # End-use / end-user
      - "(?i)end[-\\s]?use\\s+(certificate|restriction|verification)"
      - "(?i)end[-\\s]?user\\s+(certificate|verification|check)"
      - "(?i)конечн[а-яое]+\\s+использовани[ея][\\s\\S]{0,20}(сертификат|контрол)"
      - "(?i)сертификат\\s+конечного\\s+пользовател"

      # Ограничения на передачу
      - "(?i)transfer\\s+restriction[\\s\\S]{0,20}(export|technology)"
      - "(?i)shall\\s+not\\s+(export|re[-\\s]?export)"
      - "(?i)prior\\s+(written\\s+)?consent[\\s\\S]{0,30}(export|re[-\\s]?export)"
      - "(?i)не\\s+(вправе|допускается)\\s+экспортировать"

    low:
      - "(?i)export\\s+control"
      - "(?i)dual[-\\s]?use"
      - "(?i)\\bITAR\\b"
      - "(?i)\\bEAR\\b"
      - "(?i)re[-\\s]?export"
      - "(?i)экспортный\\s+контроль"
      - "(?i)двойного\\s+назначения"
      - "(?i)export\\s+licen[cs]e"
      - "(?i)ФСТЭК"
      - "(?i)ФЗ[-\\s]?183"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 640

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  context_k: 5
  max_chunks: 10
  boost_keywords:
    - "export control"
    - "экспортный контроль"
    - "dual-use"
    - "двойного назначения"
    - "ITAR"
    - "EAR"
    - "Export Administration Regulations"
    - "Commerce Control List"
    - "ECCN"
    - "EU dual-use"
    - "ФЗ-183"
    - "ФСТЭК"
    - "export license"
    - "экспортная лицензия"
    - "re-export"
    - "реэкспорт"
    - "technology transfer"
    - "передача технологий"
    - "end-user certificate"
    - "конечный пользователь"
    - "restricted countries"
    - "denied parties"
    - "entity list"
    - "deemed export"
  rerank: true
  filters: {}

conditional: null

enrichment_hints:
  preferred_segment_types:
    - "contract"
    - "annex"
    - "appendix"
    - "amendment"
  excluded_segment_types:
    - "price_list"
    - "invoice"
    - "act"
  preferred_clause_functions:
    - "representations_warranties"
    - "general_provisions"
  confidence_bonus_on_match: 0.10
  confidence_penalty_on_excluded_segment: 0.15

extraction:
  enabled: true
  mode: "hybrid"
  llm_max_tokens: 440
  llm_prompt_extraction: |
    <role>
    Ты — юрист по экспортному контролю и товарам двойного назначения.
    Твоя задача — точно извлечь из текста:
    1) есть ли положения об экспортном контроле и их детализацию;
    2) применимые режимы (ITAR, EAR, EU dual-use, ФЗ-183);
    3) обязательства по соблюдению и лицензированию;
    4) ограничения на re-export и передачу третьим лицам;
    5) влияние на бизнес-модель Target.
    </role>

    <context>
    Ниже приведены релевантные фрагменты договора:

    {context}
    </context>

    <task>
    Заполни только следующие поля:
    - export_control_display
    - has_export_control_provisions
    - export_control_detail_level
    - applicable_regimes
    - requires_export_compliance
    - requires_export_licenses
    - reexport_restrictions
    - reexport_restriction_severity
    - business_model_impact
    - red_flags
    - reason

    Важно:
    - не придумывай режимы если они не упоминаются;
    - пиши user-facing значения коротко и по-русски.
    </task>

    <instructions>
    Шаг 1 — НАЛИЧИЕ ЭКСПОРТНО-КОНТРОЛЬНЫХ ПОЛОЖЕНИЙ

    Заполни поле "has_export_control_provisions".

    Значения:
    - "yes" — есть: экспортный контроль, dual-use,
      controlled items, конкретные режимы.
    - "no" — экспортно-контрольных положений нет.
    - "unclear" — неясно.

    Шаг 2 — УРОВЕНЬ ДЕТАЛИЗАЦИИ

    Заполни поле "export_control_detail_level".

    Значения:
    - "detailed" — конкретные режимы (ITAR/EAR/ФЗ-183),
      процедуры, лицензии, end-user.
    - "general" — только общие фразы "соблюдать
      законодательство" без конкретных режимов.
    - "not_applicable" — экспортный контроль нет.
    - "unclear" — неясно.

    Шаг 3 — ПРИМЕНИМЫЕ РЕЖИМЫ

    Заполни поле "applicable_regimes".

    Правила:
    - Перечисли конкретные режимы через ";":
      * "ITAR; EAR"
      * "EU dual-use; ФЗ-183"
      * "ITAR; EAR; EU dual-use; ФЗ-183"
    - Если режимы не указаны: "Не указаны"
    - Если нет экспортного контроля: "Не применимо"

    Шаг 4 — ОБЯЗАТЕЛЬСТВА ПО СОБЛЮДЕНИЮ

    Заполни поле "requires_export_compliance".

    Значения:
    - "yes" — прямые обязательства соблюдать конкретные
      экспортно-контрольные режимы.
    - "no" — нет.
    - "unclear" — неясно.

    Шаг 5 — НЕОБХОДИМОСТЬ ЭКСПОРТНЫХ ЛИЦЕНЗИЙ

    Заполни поле "requires_export_licenses".

    Значения:
    - "yes" — экспорт / реэкспорт только при наличии лицензий.
    - "no" — нет.
    - "unclear" — неясно.

    Шаг 6 — ОГРАНИЧЕНИЯ НА RE-EXPORT

    Заполни поля "reexport_restrictions"
    и "reexport_restriction_severity".

    Значения для reexport_restrictions:
    - "yes" — есть ограничения на реэкспорт / передачу.
    - "no" — нет.
    - "unclear" — неясно.

    Значения для reexport_restriction_severity:
    - "strict" — полный запрет или prior written consent
      для любой передачи.
    - "moderate" — ограничения для определённых стран /
      получателей.
    - "mild" — только информационные требования.
    - "not_applicable" — ограничений нет.
    - "unclear" — неясно.

    Шаг 7 — ВЛИЯНИЕ НА БИЗНЕС-МОДЕЛЬ TARGET

    Заполни поле "business_model_impact".

    Значения:
    - "high" — ограничения существенно мешают бизнес-модели:
      Target занимается дистрибуцией, resale, sublicensing,
      а ограничения блокируют или требуют серьёзной перестройки.
    - "medium" — есть ограничения, но управляемые.
    - "low" — ограничения пропорциональны и не мешают.
    - "not_applicable" — экспортного контроля нет.
    - "unclear" — неясно.

    Шаг 8 — RED FLAGS

    Заполни поле "red_flags".

    Используй:
    - "NONE" — положения детализированы, режимы указаны,
      ограничения пропорциональны и не мешают бизнес-модели.
    - "UNCLEAR" — данных недостаточно.
    - Коды через запятую:
      * EXP1 — нет экспортно-контрольных положений при
        поставке dual-use / технологий / ПО / оборудования.
      * EXP2 — жёсткие ограничения на re-export, мешающие
        дистрибуции / resale (business_model_impact = "high").
      * EXP3 — формальные / общие положения без детализации
        при чувствительном предмете договора.

    Шаг 9 — USER-FACING SUMMARY

    Заполни поле "export_control_display".

    Примеры:
    - "ITAR + EAR; обязанность лицензировать; strict re-export;
       влияние на дистрибуцию — высокое"
    - "EU dual-use; общие обязательства; умеренные re-export
       ограничения"
    - "Экспортный контроль не обнаружен"
    - "Не удалось определить экспортный контроль"

    Правила:
    - Отрази максимум 4 ключевых факта через ";".
    - Если нет экспортного контроля:
      "Экспортный контроль не обнаружен"
    - Если всё unclear:
      "Не удалось определить экспортный контроль"

    Шаг 10 — ОБОСНОВАНИЕ

    Заполни поле "reason".

    Правила:
    - 1–2 коротких предложения.
    - Укажи: режимы, обязательства, re-export, влияние
      на бизнес-модель, почему red_flags.
    - Приведи короткую цитату в кавычках.
    - Если NONE — почему риск приемлем.
    </instructions>

    <edge_cases>
    - Поставка ПО / технологий без экспортно-контрольных положений:
      * has_export_control_provisions = "no"
      * red_flags включает "EXP1"

    - Только "соблюдать применимое законодательство" без режимов:
      * export_control_detail_level = "general"
      * red_flags может включать "EXP3"

    - ITAR + EAR, strict re-export, Target = дистрибьютор:
      * reexport_restriction_severity = "strict"
      * business_model_impact = "high"
      * red_flags включает "EXP2"

    - EU dual-use, moderate ограничения, Target = разработчик:
      * business_model_impact = "low"
      * red_flags = "NONE"

    - Договор на консалтинг без передачи технологий:
      * has_export_control_provisions = "no"
      * red_flags = "NONE"
      * export_control_display = "Экспортный контроль не обнаружен"

    - Нет релевантных фрагментов:
      * все поля = "unclear"
      * red_flags = "UNCLEAR"
      * export_control_display =
        "Не удалось определить экспортный контроль"
    </edge_cases>

    <output_expectations>
    Все значения должны быть короткими, точными и пригодными
    для отображения пользователю в DD Grid.
    Не добавляй никаких полей, кроме указанных в схеме extraction.
    </output_expectations>

  fields:
    - name: "export_control_display"
      type: "string"
      description: "Экспортный контроль: краткий вывод"

    - name: "has_export_control_provisions"
      type: "string"
      description: "Наличие экспортно-контрольных положений"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "export_control_detail_level"
      type: "string"
      description: "Уровень детализации"
      allowed_values:
        - "detailed"
        - "general"
        - "not_applicable"
        - "unclear"

    - name: "applicable_regimes"
      type: "string"
      description: "Применимые режимы экспортного контроля"

    - name: "requires_export_compliance"
      type: "string"
      description: "Обязательства по соблюдению"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "requires_export_licenses"
      type: "string"
      description: "Необходимость экспортных лицензий"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "reexport_restrictions"
      type: "string"
      description: "Ограничения на re-export"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "reexport_restriction_severity"
      type: "string"
      description: "Жёсткость re-export ограничений"
      allowed_values:
        - "strict"
        - "moderate"
        - "mild"
        - "not_applicable"
        - "unclear"

    - name: "business_model_impact"
      type: "string"
      description: "Влияние на бизнес-модель Target"
      allowed_values:
        - "high"
        - "medium"
        - "low"
        - "not_applicable"
        - "unclear"

    - name: "red_flags"
      type: "string"
      description: "Коды рисков"

    - name: "reason"
      type: "string"
      description: "Обоснование"

  store_payload: true


  