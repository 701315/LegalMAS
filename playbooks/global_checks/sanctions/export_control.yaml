id: "export_control"
name: "Экспортный контроль и dual-use"
description: >
  Анализирует положения об экспортном контроле: ограничения на передачу
  технологий, софта, оборудования, необходимость лицензий и соблюдение
  ITAR/EAR/аналогичных режимов.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"

rules:
  keywords:
    - "export control"
    - "экспортный контроль"
    - "dual-use"
    - "двойного назначения"
    - "controlled items"
    - "ITAR"
    - "EAR"
    - "export license"
    - "экспортная лицензия"
    - "re-export"
    - "reexport"
    - "technology transfer"
    - "передача технологий"
  keyword_mode: "any"
  regex_patterns: []
  clause_patterns: []

llm:
  prompt_template: |
    <role>
    Ты — юрист по экспортному контролю и товарам двойного назначения.
    Твоя специализация — ITAR/EAR, dual-use и локальные режимы экспортного контроля.
    </role>

    <context>
    Ниже приведены фрагменты договора, где могут быть положения об экспортном контроле:

    {context}
    </context>

    <instructions>
    Проведи анализ по шагам. Каждый шаг логически связан с одним или
    несколькими полями итоговой оценки.

    Шаг 1 — УПОМИНАНИЯ ЭКСПОРТНОГО КОНТРОЛЯ / DUAL-USE
    (используется для "mentions_export_control_or_dual_use"):
    - Определи, есть ли в тексте:
      * прямые ссылки на export control, экспортный контроль, dual-use, controlled items;
      * упоминания ITAR, EAR, EU dual-use или локальных списков контролируемых товаров/технологий;
      * указание, что предмет договора подпадает под режим экспортного контроля.
    - Сформулируй вывод:
      * "yes" — если такие упоминания явно есть;
      * "no" — если по фрагментам видно, что тема не затрагивается;
      * "unclear" — если нельзя сделать надёжный вывод.

    Шаг 2 — ОБЯЗАТЕЛЬСТВА ПО СОБЛЮДЕНИЮ ЭКСПОРТНОГО ЗАКОНОДАТЕЛЬСТВА
    (используется для "requires_export_compliance"):
    - Определи, предусмотрены ли:
      * прямые формулировки о соблюдении ITAR/EAR, EU dual-use, локальных законов
        об экспортном контроле;
      * обязанности не нарушать экспортные ограничения, санкционные режимы,
        списки контролируемых стран и получателей.
    - Установи значение "requires_export_compliance": "yes" / "no" / "unclear".

    Шаг 3 — НЕОБХОДИМОСТЬ ЭКСПОРТНЫХ ЛИЦЕНЗИЙ
    (используется для "requires_export_licenses"):
    - Проверь, указано ли, что:
      * экспорт/реэкспорт оборудования, ПО или технологий возможен только
        при наличии соответствующих экспортных лицензий/разрешений;
      * какая сторона обязана получать такие лицензии или содействовать их получению.
    - Сформулируй вывод: "yes" / "no" / "unclear" для "requires_export_licenses".

    Шаг 4 — ОГРАНИЧЕНИЯ НА RE-EXPORT / ПЕРЕДАЧУ ТРЕТЬИМ ЛИЦАМ
    (используется для "restricts_reexport_or_third_party_transfers"):
    - Определи, есть ли:
      * запреты или ограничения на реэкспорт полученных товаров, ПО или технологий
        третьим лицам или в определённые страны;
      * требования получать согласие контрагента или регулятора для таких передач.
    - Установи значение "restricts_reexport_or_third_party_transfers": "yes" / "no" / "unclear".

    Шаг 5 — ОБЩИЙ УРОВЕНЬ РИСКА ДЛЯ TARGET
    (используется для "overall_risk_level" и "reason"):
    - Оцени общий риск для Target, учитывая:
      * наличие или отсутствие экспортно‑контрольных положений при очевидной
        связи предмета договора с технологиями / dual-use товарами;
      * уровень детализации обязанностей по соблюдению экспортного права;
      * наличие требований по лицензированию;
      * жёсткость ограничений на использование и re-export и их влияние
        на операционную модель Target (дистрибуция, интеграция, resale и т.п.).
    - Сформулируй общий риск как:
      * "low" — если обязанности по экспортному контролю чётко прописаны,
        лицензии и ограничения адекватны бизнес‑модели Target;
      * "medium" — если положения есть, но частично общие или создают
        умеренные операционные ограничения;
      * "high" — если для потенциально dual-use / чувствительных технологий
        положения экспортного контроля отсутствуют либо ограничения
        серьёзно мешают обычной бизнес‑модели.
    - В "reason" кратко объясни вывод, ссылаясь на ключевые формулировки
      (желательно с короткими цитатами) и пояснив, как описанные положения
      влияют на регуляторный и операционный риск Target.
    </instructions>

    <edge_cases>
    Обрабатывай пограничные ситуации так:

    - По описанию предмета договора явно видно, что речь о ПО, оборудовании
      или технологиях, потенциально подпадающих под dual-use/ITAR/EAR,
      но экспортно‑контрольные положения отсутствуют:
      указывай отсутствие соответствующих обязательств как фактор
      высокого регуляторного риска.

    - В договоре есть только общая фраза "Стороны обязуются соблюдать
      применимое законодательство" без прямого указания на экспортный контроль:
      по ключевым флагам допустимо ставить "unclear", при этом в reason
      отмечать слабость такого подхода для экспортно‑чувствительных технологий.

    - Подробно прописаны обязанности по соблюдению ITAR/EAR/EU dual‑use,
      необходимость лицензий и запреты на re-export без согласия:
      учитывай это как снижение регуляторного риска, но отражай в reason
      возможные операционные ограничения для Target.

    - Жёсткие ограничения на re-export и передачу третьим лицам конфликтуют
      с обычной бизнес‑моделью Target (дистрибуция, интеграция, resale):
      отмечай это в "restricts_reexport_or_third_party_transfers" и reason
      как фактор повышенного операционного риска (часто "high").

    - Пустые или нерелевантные фрагменты:
      по большинству полей используй "unclear",
      "overall_risk_level" — "medium" из‑за неопределённости,
      reason — "Недостаточно данных для анализа положений об экспортном контроле и dual-use."
    </edge_cases>

    <output_expectations>
    На основе твоего анализа отдельный механизм извлечения сформирует
    структурированные поля по заранее заданной схеме. Твоя задача —
    давать чёткие юридические выводы и указывать конкретные формулировки
    из текста, на которых они основаны.
    </output_expectations>
  prompt_file: null
  context_k: 4
  temperature: 0.0
  max_tokens: 512

evidence:
  required: false
  min_snippet_length: 20
  max_snippet_length: 500

retrieval:
  context_k: 4
  max_chunks: 8
  boost_keywords:
    - "export control"
    - "экспортный контроль"
    - "dual-use"
    - "ITAR"
    - "EAR"
    - "export license"
  rerank: true
  filters: {}

conditional: null

extraction:
  enabled: true
  mode: "hybrid"
  fields:
    - name: "mentions_export_control_or_dual_use"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "requires_export_compliance"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "requires_export_licenses"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "restricts_reexport_or_third_party_transfers"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "overall_risk_level"
      type: "string"
      allowed_values:
        - "low"
        - "medium"
        - "high"

    - name: "reason"
      type: "string"

  store_payload: true

red_flags:
  items:
    - code: "EXP1"
      description: "Отсутствие экспортно-контрольных положений при очевидной поставке dual-use/технологий."
    - code: "EXP2"
      description: "Жёсткие ограничения на re-export, мешающие обычной операционной модели Target."
