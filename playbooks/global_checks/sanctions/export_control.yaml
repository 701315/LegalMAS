id: "export_control"
name: "Экспортный контроль и dual-use"
group: "Compliance"
description: >
  Анализирует положения об экспортном контроле: ограничения на передачу
  технологий, ПО, оборудования, необходимость экспортных лицензий,
  соблюдение ITAR / EAR / EU dual-use / локальных режимов,
  ограничения на re-export и влияние на операционную модель Target.

  Формирует краткий user-facing вывод и оценивает регуляторный и
  операционный риск для Target.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"
ui_mode: "field_extraction"

rules:
  keyword_mode: any

  keywords:
    high:
      - "(?i)export\\s+control"
      - "(?i)экспортн[а-яый]+\\s+контрол"
      - "(?i)dual[-\\s]?use"
      - "(?i)двойного\\s+назначения"
      - "(?i)controlled\\s+(items?|goods?|technology|software)"
      - "(?i)контролируем[а-яые]+\\s+(товар|технолог|продукц)"
      - "(?i)\\bITAR\\b"
      - "(?i)International\\s+Traffic\\s+in\\s+Arms\\s+Regulations?"
      - "(?i)\\bEAR\\b"
      - "(?i)Export\\s+Administration\\s+Regulations?"
      - "(?i)Commerce\\s+Control\\s+List"
      - "(?i)\\bCCL\\b"
      - "(?i)\\bUSML\\b"
      - "(?i)\\bECCN\\b"
      - "(?i)Export\\s+Control\\s+Classification\\s+Number"
      - "(?i)\\bBIS\\b"
      - "(?i)EU\\s+dual[-\\s]?use"
      - "(?i)Regulation\\s+\\(EU\\)\\s+2021/821"
      - "(?i)Council\\s+Regulation\\s+\\(EC\\)\\s+No\\s+428"
      - "(?i)ФЗ[-\\s]?183"
      - "(?i)183[-\\s]?ФЗ"
      - "(?i)\\bФСТЭК\\b"
      - "(?i)контрольн[а-яые]+\\s+списк[иа][\\s\\S]{0,20}(экспорт|двойн)"
      - "(?i)export\\s+licen[cs]e"
      - "(?i)экспортн[а-яая]+\\s+лицензи[яию]"
      - "(?i)export\\s+permit"
      - "(?i)разрешени[ея]\\s+на\\s+экспорт"
      - "(?i)re[-\\s]?export"
      - "(?i)реэкспорт"
      - "(?i)deemed\\s+export"

    medium:
      - "(?i)technology\\s+transfer[\\s\\S]{0,20}(control|restrict|licen)"
      - "(?i)передач[аи]\\s+технолог[\\s\\S]{0,20}(контрол|ограничен|лицензи)"
      - "(?i)technical\\s+data[\\s\\S]{0,20}(export|control|restrict)"
      - "(?i)restricted\\s+(countr|destination|part)[\\s\\S]{0,20}(export|control)"
      - "(?i)denied\\s+part(y|ies)"
      - "(?i)entity\\s+list"
      - "(?i)embargoed\\s+(countr|destination)"
      - "(?i)запрещённ[а-яые]+\\s+(страны|получател)[\\s\\S]{0,20}(экспорт|контрол)"
      - "(?i)end[-\\s]?use\\s+(certificate|restriction|verification)"
      - "(?i)end[-\\s]?user\\s+(certificate|verification|check)"
      - "(?i)конечн[а-яое]+\\s+использовани[ея][\\s\\S]{0,20}(сертификат|контрол)"
      - "(?i)сертификат\\s+конечного\\s+пользовател"
      - "(?i)transfer\\s+restriction[\\s\\S]{0,20}(export|technology)"
      - "(?i)shall\\s+not\\s+(export|re[-\\s]?export)"
      - "(?i)prior\\s+(written\\s+)?consent[\\s\\S]{0,30}(export|re[-\\s]?export)"
      - "(?i)не\\s+(вправе|допускается)\\s+экспортировать"

    low:
      - "(?i)export\\s+control"
      - "(?i)dual[-\\s]?use"
      - "(?i)\\bITAR\\b"
      - "(?i)\\bEAR\\b"
      - "(?i)re[-\\s]?export"
      - "(?i)экспортный\\s+контроль"
      - "(?i)двойного\\s+назначения"
      - "(?i)export\\s+licen[cs]e"
      - "(?i)ФСТЭК"
      - "(?i)ФЗ[-\\s]?183"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 640

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  retrieval_profile: "sanctions_compliance_check"
  context_k: 5
  max_chunks: 10
  
  retrieval_query: >
    экспортный контроль export control EAR ITAR dual-use двойное назначение 
    лицензия реэкспорт re-export CCL ФСТЭК ФЗ-183 ограничения передачи

  boost_keywords:
    - "export control"
    - "экспортный контроль"
    - "dual-use"
    - "двойного назначения"
    - "ITAR"
    - "EAR"
    - "Export Administration Regulations"
    - "Commerce Control List"
    - "ECCN"
    - "EU dual-use"
    - "ФЗ-183"
    - "ФСТЭК"
    - "export license"
    - "экспортная лицензия"
    - "re-export"
    - "реэкспорт"
    - "technology transfer"
    - "передача технологий"
    - "end-user certificate"
    - "конечный пользователь"
    - "restricted countries"
    - "denied parties"
    - "entity list"
    - "deemed export"

  negative_keywords:
    - "персональные данные"
    - "интеллектуальная собственность"
    - "антикоррупция"
    - "коммерческая тайна"
    - "условия оплаты"

  preferred_unit_types:
    - "general_provision"
    - "obligation"

  excluded_unit_types:
    - "technical_fragment"
    - "appendix_reference"
    - "structural_anchor"

  preferred_clause_functions:
    - "obligations"
    - "representations"

  position_bias:
    preferred_range: [0.0, 1.0]
    boost: 0.10
    scope: "segment"

  rerank: true
  filters: {}

conditional: null

enrichment_hints:
  preferred_segment_types:
    - "contract"
    - "annex"
    - "appendix"
    - "amendment"
  excluded_segment_types:
    - "price_list"
    - "invoice"
    - "act"
  preferred_clause_functions:
    - "representations"
    - "boilerplate"
    - "obligations"
  confidence_bonus_on_match: 0.10
  confidence_penalty_on_excluded_segment: 0.15

extraction:
  enabled: true
  mode: "hybrid"
  llm_max_tokens: 1250

  presence_signal:
    field: "has_export_control_provisions"
    present_values: ["yes"]
    missing_values: ["no"]
    unclear_values: ["unclear"]

  llm_prompt_extraction: |
    <role>
    Ты — юрист по экспортному контролю и dual-use регулированию.
    Твоя задача — точно извлечь из текста:
    1) есть ли в договоре положения об экспортном контроле;
    2) если есть — какие условия установлены:
       - применимые режимы (ITAR, EAR, EU dual-use, ФЗ-183 и др.);
       - обязательства по соблюдению и лицензированию;
       - ограничения на re-export.

    КРИТИЧЕСКИ ВАЖНО:
    - Извлекай ТОЛЬКО то, что прямо написано в тексте.
    - НЕ додумывай применимые режимы, если они не упоминаются.
    - НЕ считай общие compliance-фразы экспортным контролем
      без конкретных упоминаний контролируемых товаров / технологий
      или конкретных режимов.
    - Если договор касается услуг без передачи технологий —
      экспортный контроль, как правило, не применим, используй "no".
    - Если ни один фрагмент не содержит информации об экспортном
      контроле (нет упоминаний export control / dual-use / ITAR /
      EAR / ФЗ-183 / экспортной лицензии) —
      has_export_control_provisions = "no", location = null.
    - Если тексты по теме есть, но вывод сделать нельзя —
      has_export_control_provisions = "unclear".
    </role>

    <context_rules>
    - Некоторые фрагменты могут быть нерелевантны — игнорируй их.
    - Если фрагменты противоречат друг другу — используй "unclear"
      и объясни в reason.
    - Для applicable_regimes — перечисляй только те режимы,
      которые прямо названы или явно следуют из контекста
      (например, упоминание ECCN → EAR).
    - Различай:
      * "detailed" — конкретные режимы, ECCN-коды, лицензии,
        end-user certificates, ограниченные страны;
      * "general" — только "соблюдать экспортное законодательство"
        без режимов.
    - Re-export "strict" — полный запрет или prior written consent
      для любой передачи.
    - Re-export "moderate" — ограничения для определённых
      стран / получателей.
    - Если ни один фрагмент не содержит информации об экспортном
      контроле — has_export_control_provisions = "no", location = null.
      Не использовать "unclear" при полном отсутствии релевантных
      фрагментов.
    </context_rules>

    <context>
    Ниже приведены релевантные фрагменты договора:

    {context}
    </context>

    <task>
    Заполни только следующие поля:
    - export_control_display
    - has_export_control_provisions
    - export_control_detail_level
    - applicable_regimes
    - requires_export_compliance
    - requires_export_licenses
    - reexport_restrictions
    - reexport_restriction_severity
    - reason
    </task>

    <location_instructions>
    Для каждого поля по возможности укажи location в формате:
    {"clause_ref": "п. 12.1", "page": 7, "quote": "дословная фраза из договора"}

    Правила:
    - clause_ref — короткая ссылка на пункт / раздел / статью именно в том
      виде, как она написана в договоре;
    - page — целое число страницы;
    - quote — дословная фраза из текста договора (НЕ пересказ, НЕ парафраз).
      Копируй её посимвольно, сохраняя формулировку и порядок слов.
      Оптимальная длина: 30–300 символов.
    - Для synthesized-полей (export_control_display, applicable_regimes,
      reason) location ВСЕГДА null.
    - Для has_export_control_provisions = "no" — различай:
      * договор ПРЯМО фиксирует отсутствие положений — quote
        ОБЯЗАТЕЛЬНА;
      * просто отсутствует упоминание — location = null.
    - Для has_export_control_provisions = "yes" / "unclear" — quote
      с фразой-основанием.
    - Для export_control_detail_level, requires_export_compliance,
      requires_export_licenses, reexport_restrictions:
      * "yes" / "detailed" / "general" — quote с фразой-основанием;
      * "no" / "not_applicable" — различай: прямое исключение
        (quote обязательна) vs отсутствие упоминания (location = null);
      * "unclear" — location = null.
    - Для reexport_restriction_severity — quote с фразой-основанием
      ограничения, если severity определена.
    - Не выдумывай location или quote. Если дословную фразу определить
      нельзя — location = null.
    </location_instructions>

    <instructions>
    Шаг 0 — НАЛИЧИЕ ПОЛОЖЕНИЙ ОБ ЭКСПОРТНОМ КОНТРОЛЕ

    Заполни "has_export_control_provisions".

    Значения:
    - "yes" — есть: экспортный контроль, dual-use,
      controlled items / technology, конкретные режимы.
    - "no" — нет.
    - "unclear" — нельзя надёжно определить.

    Шаг 1 — УРОВЕНЬ ДЕТАЛИЗАЦИИ

    Заполни "export_control_detail_level".

    Значения:
    - "detailed" — конкретные режимы (ITAR / EAR / ФЗ-183 и др.),
      ECCN-коды, лицензии, end-user certificates.
    - "general" — только общие фразы без конкретных режимов.
    - "not_applicable" — экспортного контроля нет.
    - "unclear" — нельзя определить.

    Шаг 2 — ПРИМЕНИМЫЕ РЕЖИМЫ

    Заполни "applicable_regimes".

    Правила:
    - Только те режимы, которые прямо названы в тексте.
    - Формат — через ";": "ITAR; EAR", "EU dual-use; ФЗ-183"
    - Если не указаны конкретные режимы: "Не указаны"
    - Если экспортного контроля нет: "Не применимо"
    - Если нельзя определить: "Не удалось определить"

    Шаг 3 — ОБЯЗАТЕЛЬСТВА ПО СОБЛЮДЕНИЮ

    Заполни "requires_export_compliance".

    Значения:
    - "yes" — есть прямые обязательства по соблюдению
      экспортно-контрольного законодательства.
    - "no" — нет.
    - "unclear" — нельзя определить.

    Шаг 4 — НЕОБХОДИМОСТЬ ЭКСПОРТНЫХ ЛИЦЕНЗИЙ

    Заполни "requires_export_licenses".

    Значения:
    - "yes" — экспорт / реэкспорт только при наличии
      соответствующих лицензий / разрешений.
    - "no" — нет.
    - "unclear" — нельзя определить.

    Шаг 5 — ОГРАНИЧЕНИЯ НА RE-EXPORT

    Заполни "reexport_restrictions"
    и "reexport_restriction_severity".

    Значения для reexport_restrictions:
    - "yes" — ограничения на re-export есть.
    - "no" — нет.
    - "unclear" — нельзя определить.

    Значения для reexport_restriction_severity:
    - "strict" — полный запрет или prior written consent
      для любой передачи третьим лицам.
    - "moderate" — ограничения для определённых стран
      или категорий получателей.
    - "mild" — только информационные требования.
    - "not_applicable" — ограничений нет.
    - "unclear" — нельзя определить.

    Шаг 6 — НОРМАЛИЗОВАННЫЙ DISPLAY ДЛЯ DD GRID

    Заполни "export_control_display".

    Это итоговое поле для таблицы.
    Строй его ТОЛЬКО на основе уже заполненных полей выше.
    Не добавляй информацию сверх них.

    Правила:
    - Если has_export_control_provisions = "no":
      "Экспортный контроль не обнаружен"
    - Если все поля unclear:
      "Не удалось определить экспортный контроль"
    - Иначе комбинируй через ";":
      * applicable_regimes (если конкретные)
      * export_control_detail_level (detailed / general)
      * requires_export_licenses (если "yes": "лицензии")
      * reexport_restriction_severity (если strict / moderate)
    - Не более 4 фактов через ";".

    Шаг 7 — КРАТКОЕ ОБОСНОВАНИЕ

    Заполни "reason".

    Правила:
    - Первое предложение — краткий вывод.
    - Второе — короткая цитата из текста (до 100 символов).
    - Пиши по-русски.
    </instructions>

    <edge_cases>
    - Договор на поставку ПО без экспортно-контрольных положений:
      * has_export_control_provisions = "no"
      * export_control_detail_level = "not_applicable"
      * applicable_regimes = "Не применимо"
      * requires_export_compliance = "no"
      * requires_export_licenses = "no"
      * reexport_restrictions = "no"
      * reexport_restriction_severity = "not_applicable"
      * export_control_display = "Экспортный контроль не обнаружен"
      * location у всех полей = null.

    - Только "соблюдать применимое экспортное законодательство":
      * has_export_control_provisions = "yes"
      * export_control_detail_level = "general"
      * applicable_regimes = "Не указаны"

    - ITAR + EAR, strict re-export:
      * has_export_control_provisions = "yes"
      * applicable_regimes = "ITAR; EAR"
      * reexport_restriction_severity = "strict"

    - Консалтинговый договор без передачи технологий:
      * has_export_control_provisions = "no"
      * export_control_display = "Экспортный контроль не обнаружен"

    - Договор прямо фиксирует отсутствие экспортного контроля:
      * has_export_control_provisions = "no"
      * location с прямой цитатой об отсутствии.

    - Формулировки есть, но вывод невозможен:
      * has_export_control_provisions = "unclear"
      * applicable_regimes = "Не удалось определить"
      * export_control_display =
        "Не удалось определить экспортный контроль"
    </edge_cases>

    <output_expectations>
    - Верни результат строго в формате JSON.
    - Не оборачивай в markdown-блоки (без ```).
    - Не добавляй комментариев вне JSON.
    - Все значения полей с allowed_values — на английском.
    - Свободные текстовые поля (export_control_display,
      applicable_regimes, reason) — на русском языке.
    - Не добавляй полей, кроме указанных.
    - Для каждого поля возвращай объект с ключами
      "value", "confidence", "location".

    Пример структуры ответа:
    {
      "export_control_display": {"value": "ITAR + EAR; обязанность лицензировать; strict re-export", "confidence": 0.92, "location": null},
      "has_export_control_provisions": {"value": "yes", "confidence": 0.95, "location": {"clause_ref": "п. 10.1", "page": 6, "quote": "Поставка Товара осуществляется в соответствии с требованиями экспортного контроля"}},
      "export_control_detail_level": {"value": "detailed", "confidence": 0.90, "location": {"clause_ref": "п. 10.2", "page": 6, "quote": "Товары классифицированы по ECCN в соответствии с EAR"}},
      "applicable_regimes": {"value": "ITAR; EAR", "confidence": 0.85, "location": null},
      "requires_export_compliance": {"value": "yes", "confidence": 0.90, "location": {"clause_ref": "п. 10.1", "page": 6, "quote": "в соответствии с требованиями экспортного контроля"}},
      "requires_export_licenses": {"value": "yes", "confidence": 0.90, "location": {"clause_ref": "п. 10.3", "page": 6, "quote": "Экспорт возможен только при наличии экспортной лицензии"}},
      "reexport_restrictions": {"value": "yes", "confidence": 0.90, "location": {"clause_ref": "п. 10.4", "page": 6, "quote": "Реэкспорт допускается только с предварительного письменного согласия"}},
      "reexport_restriction_severity": {"value": "strict", "confidence": 0.85, "location": {"clause_ref": "п. 10.4", "page": 6, "quote": "с предварительного письменного согласия"}},
      "reason": {"value": "...", "confidence": 0.90, "location": null}
    }
    </output_expectations>

  fields:
    - name: "export_control_display"
      type: "string"
      presentation: "fact"
      label: "Экспортный контроль"
      description: "Нормализованный user-facing вывод для DD Grid"
      display_in_grid: true
      display_priority: 1

    - name: "has_export_control_provisions"
      type: "string"
      presentation: "signal"
      risk_weight: "info"
      description: "Наличие экспортно-контрольных положений"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
      display_in_grid: false

    - name: "export_control_detail_level"
      type: "string"
      presentation: "signal"
      risk_weight: "medium"
      description: "Уровень детализации"
      allowed_values:
        - "detailed"
        - "general"
        - "not_applicable"
        - "unclear"
      display_in_grid: false

    - name: "applicable_regimes"
      type: "string"
      presentation: "fact"
      label: "Применимые режимы"
      description: "Применимые режимы экспортного контроля"
      display_in_grid: true
      display_priority: 2

    - name: "requires_export_compliance"
      type: "string"
      presentation: "signal"
      risk_weight: "medium"
      description: "Обязательства по соблюдению"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
      display_in_grid: false

    - name: "requires_export_licenses"
      type: "string"
      presentation: "signal"
      risk_weight: "high"
      description: "Необходимость экспортных лицензий"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
      display_in_grid: false

    - name: "reexport_restrictions"
      type: "string"
      presentation: "signal"
      risk_weight: "high"
      description: "Ограничения на re-export"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
      display_in_grid: false

    - name: "reexport_restriction_severity"
      type: "string"
      presentation: "signal"
      risk_weight: "high"
