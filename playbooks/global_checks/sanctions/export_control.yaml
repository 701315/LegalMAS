id: "export_control"
name: "Экспортный контроль и dual-use"
group: "Compliance"
description: >
  Анализирует положения об экспортном контроле: ограничения на передачу
  технологий, ПО, оборудования, необходимость экспортных лицензий,
  соблюдение ITAR / EAR / EU dual-use / локальных режимов,
  ограничения на re-export и влияние на операционную модель Target.

  Формирует краткий user-facing вывод и оценивает регуляторный и
  операционный риск для Target.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"
ui_mode: "field_extraction"

rules:
  keyword_mode: any

  keywords:
    high:
      # Прямые экспортно-контрольные термины
      - "(?i)export\\s+control"
      - "(?i)экспортн[а-яый]+\\s+контрол"
      - "(?i)dual[-\\s]?use"
      - "(?i)двойного\\s+назначения"
      - "(?i)controlled\\s+(items?|goods?|technology|software)"
      - "(?i)контролируем[а-яые]+\\s+(товар|технолог|продукц)"

      # Конкретные режимы — США
      - "(?i)\\bITAR\\b"
      - "(?i)International\\s+Traffic\\s+in\\s+Arms\\s+Regulations?"
      - "(?i)\\bEAR\\b"
      - "(?i)Export\\s+Administration\\s+Regulations?"
      - "(?i)Commerce\\s+Control\\s+List"
      - "(?i)\\bCCL\\b"
      - "(?i)\\bUSML\\b"
      - "(?i)\\bECCN\\b"
      - "(?i)Export\\s+Control\\s+Classification\\s+Number"
      - "(?i)\\bBIS\\b"

      # Конкретные режимы — ЕС
      - "(?i)EU\\s+dual[-\\s]?use"
      - "(?i)Regulation\\s+\\(EU\\)\\s+2021/821"
      - "(?i)Council\\s+Regulation\\s+\\(EC\\)\\s+No\\s+428"

      # Конкретные режимы — Россия
      - "(?i)ФЗ[-\\s]?183"
      - "(?i)183[-\\s]?ФЗ"
      - "(?i)\\bФСТЭК\\b"
      - "(?i)контрольн[а-яые]+\\s+списк[иа][\\s\\S]{0,20}(экспорт|двойн)"

      # Экспортные лицензии
      - "(?i)export\\s+licen[cs]e"
      - "(?i)экспортн[а-яая]+\\s+лицензи[яию]"
      - "(?i)export\\s+permit"
      - "(?i)разрешени[ея]\\s+на\\s+экспорт"

      # Re-export
      - "(?i)re[-\\s]?export"
      - "(?i)реэкспорт"
      - "(?i)deemed\\s+export"

    medium:
      # Technology transfer
      - "(?i)technology\\s+transfer[\\s\\S]{0,20}(control|restrict|licen)"
      - "(?i)передач[аи]\\s+технолог[\\s\\S]{0,20}(контрол|ограничен|лицензи)"
      - "(?i)technical\\s+data[\\s\\S]{0,20}(export|control|restrict)"

      # Контролируемые страны/получатели
      - "(?i)restricted\\s+(countr|destination|part)[\\s\\S]{0,20}(export|control)"
      - "(?i)denied\\s+part(y|ies)"
      - "(?i)entity\\s+list"
      - "(?i)embargoed\\s+(countr|destination)"
      - "(?i)запрещённ[а-яые]+\\s+(страны|получател)[\\s\\S]{0,20}(экспорт|контрол)"

      # End-use / end-user
      - "(?i)end[-\\s]?use\\s+(certificate|restriction|verification)"
      - "(?i)end[-\\s]?user\\s+(certificate|verification|check)"
      - "(?i)конечн[а-яое]+\\s+использовани[ея][\\s\\S]{0,20}(сертификат|контрол)"
      - "(?i)сертификат\\s+конечного\\s+пользовател"

      # Ограничения на передачу
      - "(?i)transfer\\s+restriction[\\s\\S]{0,20}(export|technology)"
      - "(?i)shall\\s+not\\s+(export|re[-\\s]?export)"
      - "(?i)prior\\s+(written\\s+)?consent[\\s\\S]{0,30}(export|re[-\\s]?export)"
      - "(?i)не\\s+(вправе|допускается)\\s+экспортировать"

    low:
      - "(?i)export\\s+control"
      - "(?i)dual[-\\s]?use"
      - "(?i)\\bITAR\\b"
      - "(?i)\\bEAR\\b"
      - "(?i)re[-\\s]?export"
      - "(?i)экспортный\\s+контроль"
      - "(?i)двойного\\s+назначения"
      - "(?i)export\\s+licen[cs]e"
      - "(?i)ФСТЭК"
      - "(?i)ФЗ[-\\s]?183"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 640

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  context_k: 5
  max_chunks: 10
  
  retrieval_query: >
    экспортный контроль export control EAR ITAR dual-use двойное назначение 
    лицензия реэкспорт re-export CCL ФСТЭК ФЗ-183 ограничения передачи

  boost_keywords:
    - "export control"
    - "экспортный контроль"
    - "dual-use"
    - "двойного назначения"
    - "ITAR"
    - "EAR"
    - "Export Administration Regulations"
    - "Commerce Control List"
    - "ECCN"
    - "EU dual-use"
    - "ФЗ-183"
    - "ФСТЭК"
    - "export license"
    - "экспортная лицензия"
    - "re-export"
    - "реэкспорт"
    - "technology transfer"
    - "передача технологий"
    - "end-user certificate"
    - "конечный пользователь"
    - "restricted countries"
    - "denied parties"
    - "entity list"
    - "deemed export"

  negative_keywords:
    - "персональные данные"
    - "интеллектуальная собственность"
    - "антикоррупция"
    - "коммерческая тайна"
    - "условия оплаты"

  preferred_unit_types:
    - "general_provision"
    - "obligation"

  excluded_unit_types:
    - "technical_fragment"
    - "appendix_reference"
    - "structural_anchor"

  preferred_clause_functions:
    - "compliance"
    - "obligations"
    - "representations"

  position_bias:
    preferred_range: [0.0, 1.0]
    boost: 0.10
    scope: "segment"

  rerank: true
  filters: {}

conditional: null

enrichment_hints:
  preferred_segment_types:
    - "contract"
    - "annex"
    - "appendix"
    - "amendment"
  excluded_segment_types:
    - "price_list"
    - "invoice"
    - "act"
  preferred_clause_functions:
    - "representations_warranties"
    - "general_provisions"
    - "compliance"
  confidence_bonus_on_match: 0.10
  confidence_penalty_on_excluded_segment: 0.15

extraction:
  enabled: true
  mode: "hybrid"
  llm_max_tokens: 420
  llm_prompt_extraction: |
    <role>
    Ты — юрист по экспортному контролю.
    Твоя задача — точно извлечь из текста:
    1) наличие положений об экспортном контроле;
    2) применимые режимы (ITAR, EAR, EU dual-use, ФЗ-183);
    3) обязательства по соблюдению и лицензированию;
    4) ограничения на re-export.

    Не придумывай режимы если они не упоминаются.
    </role>

    <context>
    Ниже приведены релевантные фрагменты договора:

    {context}
    </context>

    <task>
    Заполни только следующие поля:
    - export_control_display
    - has_export_control_provisions
    - export_control_detail_level
    - applicable_regimes
    - requires_export_compliance
    - requires_export_licenses
    - reexport_restrictions
    - reexport_restriction_severity
    - reason

    Важно:
    - пиши коротко и по-русски.
    </task>

    <instructions>
    Шаг 1 — НАЛИЧИЕ ПОЛОЖЕНИЙ

    Заполни "has_export_control_provisions".

    Значения:
    - "yes" — есть: экспортный контроль, dual-use,
      controlled items, конкретные режимы.
    - "no" — нет.
    - "unclear" — неясно.

    Шаг 2 — УРОВЕНЬ ДЕТАЛИЗАЦИИ

    Заполни "export_control_detail_level".

    Значения:
    - "detailed" — конкретные режимы (ITAR/EAR/ФЗ-183),
      процедуры, лицензии, end-user.
    - "general" — только общие фразы без конкретных режимов.
    - "not_applicable" — экспортного контроля нет.
    - "unclear" — неясно.

    Шаг 3 — ПРИМЕНИМЫЕ РЕЖИМЫ

    Заполни "applicable_regimes".

    Правила:
    - Конкретные режимы через ";": "ITAR; EAR", "EU dual-use; ФЗ-183"
    - Если не указаны: "Не указаны"
    - Нет экспортного контроля: "Не применимо"

    Шаг 4 — ОБЯЗАТЕЛЬСТВА ПО СОБЛЮДЕНИЮ

    Заполни "requires_export_compliance".

    Значения:
    - "yes" / "no" / "unclear"

    Шаг 5 — НЕОБХОДИМОСТЬ ЛИЦЕНЗИЙ

    Заполни "requires_export_licenses".

    Значения:
    - "yes" — экспорт / реэкспорт только при наличии лицензий.
    - "no" / "unclear"

    Шаг 6 — ОГРАНИЧЕНИЯ НА RE-EXPORT

    Заполни "reexport_restrictions"
    и "reexport_restriction_severity".

    Значения для reexport_restrictions:
    - "yes" / "no" / "unclear"

    Значения для reexport_restriction_severity:
    - "strict" — полный запрет или prior written consent
      для любой передачи.
    - "moderate" — ограничения для определённых стран /
      получателей.
    - "mild" — только информационные требования.
    - "not_applicable" — ограничений нет.
    - "unclear" — неясно.

    Шаг 7 — НОРМАЛИЗОВАННЫЙ DISPLAY ДЛЯ DD GRID

    Заполни "export_control_display".

    Это не свободное summary.
    Строй display по следующей логике:

    Базовые случаи:
    - has_export_control_provisions = "no":
      "Экспортный контроль не обнаружен"
    - все поля unclear:
      "Не удалось определить экспортный контроль"

    Если положения есть — комбинируй через ";":
    - applicable_regimes (если конкретные)
    - export_control_detail_level (detailed / general)
    - requires_export_licenses (если "yes")
    - reexport_restriction_severity (если strict / moderate)

    Примеры:
    - "ITAR + EAR; обязанность лицензировать; strict re-export"
    - "EU dual-use; общие обязательства; умеренные re-export"
    - "Экспортный контроль не обнаружен"
    - "Не удалось определить экспортный контроль"

    Ограничение: не более 4 фактов через ";".

    Шаг 8 — КРАТКОЕ ОБОСНОВАНИЕ

    Заполни "reason".

    Правила:
    - 1–2 коротких предложения.
    - Укажи: режимы, обязательства, re-export.
    - Приведи цитату в кавычках.
    </instructions>

    <edge_cases>
    - Поставка ПО без экспортно-контрольных положений:
      * has_export_control_provisions = "no"

    - Только "соблюдать законодательство" без режимов:
      * export_control_detail_level = "general"

    - ITAR + EAR, strict re-export:
      * reexport_restriction_severity = "strict"

    - Консалтинг без передачи технологий:
      * has_export_control_provisions = "no"
      * export_control_display = "Экспортный контроль не обнаружен"

    - Нет релевантных фрагментов:
      * все поля = "unclear"
      * export_control_display = "Не удалось определить экспортный контроль"
    </edge_cases>

    <output_expectations>
    Все значения коротко и по-русски.
    Не добавляй никаких полей, кроме указанных в схеме extraction.
    </output_expectations>

  fields:
    - name: "export_control_display"
      type: "string"
      presentation: "fact"
      label: "Экспортный контроль"
      description: "Нормализованный user-facing вывод для DD Grid"

    - name: "has_export_control_provisions"
      type: "string"
      presentation: "signal"
      description: "Наличие экспортно-контрольных положений"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "export_control_detail_level"
      type: "string"
      presentation: "signal"
      description: "Уровень детализации"
      allowed_values:
        - "detailed"
        - "general"
        - "not_applicable"
        - "unclear"

    - name: "applicable_regimes"
      type: "string"
      presentation: "fact"
      label: "Применимые режимы"
      description: "Применимые режимы экспортного контроля"

    - name: "requires_export_compliance"
      type: "string"
      presentation: "signal"
      description: "Обязательства по соблюдению"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "requires_export_licenses"
      type: "string"
      presentation: "signal"
      description: "Необходимость экспортных лицензий"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "reexport_restrictions"
      type: "string"
      presentation: "signal"
      description: "Ограничения на re-export"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "reexport_restriction_severity"
      type: "string"
      presentation: "signal"
      description: "Жёсткость ограничений на re-export"
      allowed_values:
        - "strict"
        - "moderate"
        - "mild"
        - "not_applicable"
        - "unclear"

    - name: "reason"
      type: "string"
      presentation: "diagnostic"
      description: "Обоснование"

  store_payload: true


  