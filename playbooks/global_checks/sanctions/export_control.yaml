id: "export_control"
name: "Экспортный контроль и dual-use"
description: >
  Анализирует положения об экспортном контроле: ограничения на передачу
  технологий, софта, оборудования, необходимость лицензий и соблюдение
  ITAR/EAR/аналогичных режимов.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"

rules:
  keywords:
    - "export control"
    - "экспортный контроль"
    - "dual-use"
    - "двойного назначения"
    - "controlled items"
    - "ITAR"
    - "EAR"
    - "export license"
    - "экспортная лицензия"
    - "re-export"
    - "reexport"
    - "technology transfer"
    - "передача технологий"
  keyword_mode: "any"
  regex_patterns: []
  clause_patterns: []

llm:
  prompt_template: |
    <role>
    Ты — юрист по экспортному контролю и товарам двойного назначения.
    Твоя специализация — ITAR/EAR, dual-use и локальные режимы экспортного контроля.
    </role>

    <context>
    Ниже приведены фрагменты договора, где могут быть положения об экспортном контроле:

    {context}
    </context>

    <instructions>
    Определи:

    1) Упоминания экспортного контроля и/или товаров/технологий двойного назначения
       (mentions_export_control_or_dual_use):
       - прямые ссылки на export control, экспортный контроль, dual-use, controlled items,
         ITAR, EAR, локальные списки контролируемых товаров/технологий;
       - указание, что предмет договора подпадает под режим экспортного контроля.
       Значения:
       - "yes" — если такие упоминания явно есть;
       - "no" — если из фрагментов видно, что тема не затрагивается;
       - "unclear" — если нельзя сделать вывод.

    2) Обязательства соблюдать экспортное законодательство (requires_export_compliance):
       - прямые формулировки о соблюдении ITAR/EAR, EU dual-use, локальных законов
         об экспортном контроле;
       - упоминания обязанностей не нарушать экспортные ограничения, санкции,
         контролируемые списки получателей/стран.

    3) Необходимость экспортных лицензий (requires_export_licenses):
       - указание, что экспорт/реэкспорт оборудования, ПО или технологий возможен
         только при наличии соответствующих лицензий/разрешений;
       - обязанности стороны получить такие лицензии или содействовать их получению.

    4) Ограничения на re-export/передачу третьим лицам
       (restricts_reexport_or_third_party_transfers):
       - запреты или ограничения на реэкспорт/передачу полученных товаров,
         ПО или технологий третьим лицам или в определённые страны;
       - необходимость согласия/лицензии для таких передач.

    5) Оцени общий риск для Target (overall_risk_level: low / medium / high):
       - учитывая наличие/отсутствие экспортно‑контрольных положений при
         очевидной связи предмета договора с технологиями/dual-use;
       - жёсткость ограничений на использование и реэкспорт и их влияние
         на операционную модель Target.
    </instructions>

    <edge_cases>
    ВАЖНО — пограничные случаи:

    — Если по описанию предмета договора явно видно, что речь о ПО, оборудовании
      или технологиях, потенциально подпадающих под dual-use/ITAR/EAR, но
      никаких экспортно‑контрольных положений нет:
      mentions_export_control_or_dual_use = "no",
      requires_export_compliance = "no",
      риск обычно не ниже "high" (укажи в reason).

    — Если договор содержит только общую фразу "Стороны обязуются соблюдать
      применимое законодательство" без прямого указания на экспортный контроль:
      по ключевым флагам чаще "unclear", но в reason стоит отметить слабость
      такого подхода при экспорте технологий.

    — Если подробно прописаны обязанности по соблюдению ITAR/EAR/EU dual‑use,
      необходимость лицензий и запреты на re-export без согласия:
      это снижает регуляторный риск, но может создавать операционные ограничения
      для Target (отрази это в reason и overall_risk_level).

    — Если есть жёсткие ограничения на re-export и передачу третьим лицам,
      которые конфликтуют с обычной бизнес‑моделью Target (дистрибуция,
      интеграция, resale):
      restricts_reexport_or_third_party_transfers = "yes",
      риск может быть "high" из‑за ограничений для бизнеса.

    — Пустые или нерелевантные фрагменты:
      большинство полей = "unclear",
      overall_risk_level = "medium",
      reason = "Недостаточно данных для анализа положений об экспортном контроле и dual-use."
    </edge_cases>

    <examples>
    ПРИМЕР 1 — ПОЛНЫЙ EXPORT CONTROL БЛОК (MEDIUM):

    Фрагмент: "Стороны признают, что поставляемое оборудование и программное обеспечение
    могут подпадать под действие правил экспортного контроля США (EAR) и ЕС о товарах
    двойного назначения. Клиент обязуется соблюдать применимые правила export control
    и не осуществлять re-export или передачу третьим лицам без необходимых лицензий
    и согласия Поставщика."

    {{
      "mentions_export_control_or_dual_use": "yes",
      "requires_export_compliance": "yes",
      "requires_export_licenses": "yes",
      "restricts_reexport_or_third_party_transfers": "yes",
      "overall_risk_level": "medium",
      "reason": "Договор прямо упоминает EAR/dual-use и возлагает на клиента обязанности по соблюдению экспортного контроля, лицензированию и ограничениям re-export, что снижает регуляторный риск, но накладывает операционные ограничения."
    }}

    ПРИМЕР 2 — ОТСУТСТВИЕ EXPORT CONTROL ПРИ DUAL-USE (HIGH):

    Фрагмент: "Поставщик поставляет оборудование и программное обеспечение, которые
    могут использоваться в гражданских и военных целях. Специальные положения
    об экспортном контроле и лицензиях Договором не предусмотрены."

    {{
      "mentions_export_control_or_dual_use": "yes",
      "requires_export_compliance": "no",
      "requires_export_licenses": "no",
      "restricts_reexport_or_third_party_transfers": "no",
      "overall_risk_level": "high",
      "reason": "Указано потенциально dual-use оборудование, но отсутствуют положения об экспортном контроле, лицензиях и ограничениях re-export, что создаёт высокий регуляторный риск."
    }}

    ПРИМЕР 3 — ОБЩАЯ ОГОВОРКА БЕЗ ДЕТАЛЕЙ (MEDIUM/UNCLEAR):

    Фрагмент: "Стороны обязуются соблюдать применимые законы об экспортном контроле
    и не допускать нарушений экспортных ограничений."

    {{
      "mentions_export_control_or_dual_use": "yes",
      "requires_export_compliance": "yes",
      "requires_export_licenses": "unclear",
      "restricts_reexport_or_third_party_transfers": "unclear",
      "overall_risk_level": "medium",
      "reason": "Есть общая ссылка на необходимость соблюдать экспортный контроль, но не раскрыты требования по лицензированию и ограничениям re-export, что оставляет часть рисков неурегулированными."
    }}
    </examples>

    <output_format>
    Твой ответ ДОЛЖЕН быть строго валидным JSON-объектом со следующими
    полями:

    {{
      "mentions_export_control_or_dual_use": "one of: yes | no | unclear",
      "requires_export_compliance": "one of: yes | no | unclear",
      "requires_export_licenses": "one of: yes | no | unclear",
      "restricts_reexport_or_third_party_transfers": "one of: yes | no | unclear",
      "overall_risk_level": "one of: low | medium | high",
      "reason": "string — краткое объяснение на русском с указанием ключевых формулировок по экспортному контролю и их влияния на риск для Target"
    }}

    Все перечисленные поля ДОЛЖНЫ присутствовать в JSON, даже если их значение равно null.
    </output_format>

    <constraints>
    ЖЁСТКИЕ ПРАВИЛА:
    1. Выведи ТОЛЬКО один JSON-объект. Никакого текста до или после.
    2. Не пиши "Вот JSON", "Here is the JSON" и т.п.
    3. Не используй Markdown, бэктики ``` или любые обёртки.
    4. Все строки — в двойных кавычках.
    5. Значения перечислимых полей — СТРОГО из указанных вариантов.
    6. Ключи — точно как указано, без добавления новых.
    7. Поле "reason" ДОЛЖНО содержать конкретные формулировки из фрагментов
       и оценку рисков, а не общие фразы вроде "есть риски".
    8. Начни ответ сразу с символа {{
    9. Если по какому‑то полю нет достаточно информации в тексте —
       верни для него 'unclear' или null (для reason пустое значение
       недопустимо — нужно объяснение). НЕ придумывай значения, не интерполируй.
    </constraints>
  prompt_file: null
  context_k: 4
  temperature: 0.0
  max_tokens: 512

evidence:
  required: false
  min_snippet_length: 20
  max_snippet_length: 500

retrieval:
  context_k: 4
  max_chunks: 8
  boost_keywords:
    - "export control"
    - "экспортный контроль"
    - "dual-use"
    - "ITAR"
    - "EAR"
    - "export license"
  rerank: true
  filters: {}

conditional: null

extraction:
  enabled: true
  mode: "hybrid"
  fields:
    - name: "mentions_export_control_or_dual_use"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
    - name: "requires_export_compliance"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
    - name: "requires_export_licenses"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
    - name: "restricts_reexport_or_third_party_transfers"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
    - name: "overall_risk_level"
      type: "string"
      allowed_values:
        - "low"
        - "medium"
        - "high"
    - name: "reason"
      type: "string"
  store_payload: true

red_flags:
  items:
    - code: "EXP1"
      description: "Отсутствие экспортно-контрольных положений при очевидной поставке dual-use/технологий."
    - code: "EXP2"
      description: "Жёсткие ограничения на re-export, мешающие обычной операционной модели Target."
      