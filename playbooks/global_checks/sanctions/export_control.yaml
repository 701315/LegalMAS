id: "export_control"
name: "Экспортный контроль и dual-use"
description: >
  Анализирует положения об экспортном контроле: ограничения на передачу
  технологий, софта, оборудования, необходимость лицензий, соблюдение
  ITAR/EAR/EU dual-use/локальных режимов, ограничения на re-export
  и влияние на операционную модель Target.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"

rules:
  keyword_mode: any

  keywords:
    high:
      # Прямые экспортно-контрольные термины
      - "(?i)export\\s+control"
      - "(?i)экспортн[а-яый]+\\s+контрол"
      - "(?i)dual[-\\s]?use"
      - "(?i)двойного\\s+назначения"
      - "(?i)controlled\\s+(items?|goods?|technology|software)"
      - "(?i)контролируем[а-яые]+\\s+(товар|технолог|продукц)"

      # Конкретные режимы — США
      - "(?i)\\bITAR\\b"
      - "(?i)International\\s+Traffic\\s+in\\s+Arms\\s+Regulations?"
      - "(?i)\\bEAR\\b"
      - "(?i)Export\\s+Administration\\s+Regulations?"
      - "(?i)\\bBIS\\b"
      - "(?i)Bureau\\s+of\\s+Industry\\s+and\\s+Security"
      - "(?i)Commerce\\s+Control\\s+List"
      - "(?i)\\bCCL\\b"
      - "(?i)USML"
      - "(?i)United\\s+States\\s+Munitions\\s+List"
      - "(?i)\\bECCN\\b"
      - "(?i)Export\\s+Control\\s+Classification\\s+Number"

      # Конкретные режимы — ЕС
      - "(?i)EU\\s+dual[-\\s]?use"
      - "(?i)Council\\s+Regulation\\s+\\(EC\\)\\s+No\\s+428"
      - "(?i)Regulation\\s+\\(EU\\)\\s+2021/821"
      - "(?i)EU\\s+export\\s+control"

      # Конкретные режимы — Россия
      - "(?i)ФЗ[-\\s]?183"
      - "(?i)183[-\\s]?ФЗ"
      - "(?i)Федеральн[а-яый]+\\s+закон[\\s\\S]{0,30}экспортн[а-яом]+\\s+контрол"
      - "(?i)ФСТЭК"
      - "(?i)контрольн[а-яые]+\\s+списк[иа]"

      # Экспортные лицензии
      - "(?i)export\\s+licen[cs]e"
      - "(?i)экспортн[а-яая]+\\s+лицензи[яию]"
      - "(?i)export\\s+permit"
      - "(?i)разрешени[ея]\\s+на\\s+экспорт"

      # Re-export
      - "(?i)re[-\\s]?export"
      - "(?i)реэкспорт"
      - "(?i)deemed\\s+export"

    medium:
      # Technology transfer
      - "(?i)technology\\s+transfer"
      - "(?i)передач[аи]\\s+технолог"
      - "(?i)technical\\s+data"
      - "(?i)техническ[а-яие]+\\s+данн"
      - "(?i)technical\\s+assistance"
      - "(?i)техническ[а-яая]+\\s+помощь"

      # Контролируемые страны/получатели
      - "(?i)restricted\\s+(countr|destination|part)"
      - "(?i)denied\\s+part(y|ies)"
      - "(?i)entity\\s+list"
      - "(?i)embargoed\\s+(countr|destination)"
      - "(?i)запрещённ[а-яые]+\\s+(страны|получател|направлени)"
      - "(?i)санкционн[а-яые]+\\s+(страны|юрисдикц)"

      # End-use / end-user
      - "(?i)end[-\\s]?use"
      - "(?i)end[-\\s]?user"
      - "(?i)конечн[а-яое]+\\s+использовани"
      - "(?i)конечн[а-яый]+\\s+пользовател"
      - "(?i)end[-\\s]?user\\s+certificate"
      - "(?i)сертификат\\s+конечного\\s+пользовател"

      # Общие ограничения на передачу
      - "(?i)transfer\\s+restriction"
      - "(?i)ограничени[яе]\\s+на\\s+передач"
      - "(?i)shall\\s+not\\s+(export|transfer|disclose)"
      - "(?i)не\\s+(вправе|допускается)\\s+(экспортировать|передавать)"
      - "(?i)prior\\s+(written\\s+)?consent\\s+[\\s\\S]{0,30}(export|transfer)"
      - "(?i)предварительн[а-яое]+\\s+согласи[ея]\\s+[\\s\\S]{0,30}(экспорт|передач)"

    low:
      # Общие ссылки на регулирование
      - "(?i)export"
      - "(?i)экспорт"
      - "(?i)import"
      - "(?i)импорт"
      - "(?i)controlled"
      - "(?i)контролируем"

      # Общие ссылки на технологии
      - "(?i)technology"
      - "(?i)технолог"
      - "(?i)software"
      - "(?i)програмн[а-яое]+\\s+обеспечени"
      - "(?i)equipment"
      - "(?i)оборудовани"

      # Общие compliance-термины
      - "(?i)compliance"
      - "(?i)комплаенс"
      - "(?i)restriction"
      - "(?i)ограничени"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 640

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  context_k: 5
  max_chunks: 10
  boost_keywords:
    - "export control"
    - "экспортный контроль"
    - "dual-use"
    - "двойного назначения"
    - "ITAR"
    - "EAR"
    - "Export Administration Regulations"
    - "Commerce Control List"
    - "ECCN"
    - "EU dual-use"
    - "ФЗ-183"
    - "ФСТЭК"
    - "export license"
    - "экспортная лицензия"
    - "re-export"
    - "реэкспорт"
    - "technology transfer"
    - "передача технологий"
    - "end-user"
    - "конечный пользователь"
    - "restricted countries"
    - "denied parties"
    - "entity list"
  rerank: true
  filters: {}

conditional: null

extraction:
  llm_prompt_extraction: |
    <role>
    Ты — юрист по экспортному контролю и товарам двойного назначения.
    Твоя специализация — ITAR, EAR, EU dual-use Regulation,
    российский экспортный контроль (ФЗ-183, ФСТЭК),
    лицензирование экспорта и ограничения на re-export.
    </role>

    <context>
    Ниже приведены фрагменты договора, где могут быть положения
    об экспортном контроле:

    {context}
    </context>

    <instructions>
    Проведи анализ по шагам. Каждый шаг логически соответствует одному
    или нескольким полям итоговой оценки риска.

    Шаг 1 — УПОМИНАНИЯ ЭКСПОРТНОГО КОНТРОЛЯ / DUAL-USE
    (используется для заполнения поля "has_export_control_provisions"):
    - Определи, есть ли в тексте:
      * прямые ссылки на export control, экспортный контроль,
        dual-use, controlled items;
      * упоминания конкретных режимов (ITAR, EAR, EU dual-use,
        ФЗ-183, ФСТЭК);
      * указание, что предмет договора подпадает под режим
        экспортного контроля.
    - Сформулируй вывод:
      * "yes" — экспортно-контрольные
        положения с ссылками на конкретные режимы;
      * "none" — экспортно-контрольные положения отсутствуют;
      * "unclear" — невозможно определить.

    Шаг 2 — ПРИМЕНИМЫЕ РЕЖИМЫ
    (используется для заполнения поля "applicable_regimes"):
    - Определи, какие конкретные режимы экспортного контроля
      упоминаются:
      * ITAR (США, военные товары);
      * EAR (США, dual-use);
      * EU dual-use Regulation;
      * ФЗ-183 / ФСТЭК (Россия);
      * Wassenaar Arrangement;
      * другие.
    - Перечисли через запятую.
    - Если режимы не указаны — укажи "Не указаны".

    Шаг 3 — ОБЯЗАТЕЛЬСТВА ПО СОБЛЮДЕНИЮ
    (используется для заполнения поля "requires_export_compliance"):
    - Определи, предусмотрены ли:
      * прямые обязательства соблюдать ITAR/EAR/EU dual-use/
        локальные законы об экспортном контроле;
      * запреты на нарушение экспортных ограничений;
      * обязательства проверять end-user/end-use.
    - Сформулируй вывод: "yes" / "no" / "unclear".

    Шаг 4 — НЕОБХОДИМОСТЬ ЭКСПОРТНЫХ ЛИЦЕНЗИЙ
    (используется для заполнения поля "requires_export_licenses"):
    - Определи, указано ли:
      * экспорт/реэкспорт возможен только при наличии
        соответствующих лицензий/разрешений;
      * какая сторона обязана получать лицензии;
      * процедура получения лицензий.
    - Сформулируй вывод: "yes" / "no" / "unclear".

    Шаг 5 — ОГРАНИЧЕНИЯ НА RE-EXPORT И ПЕРЕДАЧУ ТРЕТЬИМ ЛИЦАМ
    (используется для заполнения поля "reexport_restrictions"):
    - Определи, есть ли:
      * запреты на реэкспорт товаров/ПО/технологий;
      * ограничения на передачу третьим лицам;
      * запреты на экспорт в определённые страны/получателям;
      * требования получать согласие для передачи.
    - Сформулируй вывод:
      * "yes" — ограничения (запрет или требование 
        prior written consent для любой передачи);
      * "none" — ограничений нет;
      * "unclear" — невозможно определить.

    Шаг 6 — RED FLAGS
    (используется для заполнения поля "red_flags"):
    - Оцени наличие следующих рисковых факторов:

      * «EXP1» — Отсутствие экспортно-контрольных положений
        при очевидной поставке dual-use/технологий. Признаки:
        - has_export_control_provisions = "none";
        - при этом предмет договора — ПО, оборудование,
          технологии, которые потенциально подпадают
          под экспортный контроль;
        - отсутствие положений создаёт регуляторный риск.

      * «EXP2» — Жёсткие ограничения на re-export, мешающие
        обычной операционной модели Target. Признаки:
        - reexport_restrictions = "strict";
        - business_model_impact = "high";
        - Target занимается дистрибуцией, интеграцией,
          resale, sublicensing;
        - ограничения делают бизнес-модель неработоспособной
          или требуют существенной перестройки.

      * «EXP3» — Формальные/общие положения об экспортном
        контроле без детализации при очевидной необходимости.
        Признаки:
        - has_export_control_provisions = "general";
        - applicable_regimes = "Не указаны";
        - requires_export_compliance = "unclear" или "no";
        - при этом предмет договора чувствителен
          к экспортному контролю.

    - Если экспортно-контрольные положения детализированы,
      режимы указаны, ограничения пропорциональны и не мешают
      бизнес-модели Target — верни "NONE".
    - Если данных недостаточно для оценки или текст противоречив —
      верни "UNCLEAR".
    - Формат: один или несколько кодов через запятую
      ("EXP1", "EXP2", "EXP1, EXP3"), "NONE" или "UNCLEAR".
      Без комментариев в этом поле — всё объясняющее в reason.

    Шаг 7 — ОБОСНОВАНИЕ
    (используется для заполнения поля "reason"):

    - В "reason" кратко обоснуй вывод:
      * ссылайся на ключевые формулировки (по возможности
        с короткими цитатами);
      * поясни, как положения влияют на регуляторный
        и операционный риск Target;
      * если выставлены red_flags — объясни, почему именно
        эти коды.
    </instructions>

    <edge_cases>
    Обрабатывай пограничные ситуации так:

    - Предмет договора — ПО, оборудование или технологии,
      потенциально подпадающие под dual-use/ITAR/EAR,
      но экспортно-контрольные положения отсутствуют:
      has_export_control_provisions = "none";
      ставь EXP1; overall_risk_level = "high".

    - Только общая фраза "Стороны обязуются соблюдать
      применимое законодательство" без указания на экспортный
      контроль:
      has_export_control_provisions = "general" или "none";
      рассматривай EXP3 при чувствительном предмете договора.

    - Подробно прописаны ITAR/EAR/EU dual-use, необходимость
      лицензий, запреты на re-export в определённые страны:
      has_export_control_provisions = "detailed";
      это снижает регуляторный риск;
      но оцени business_model_impact.

    - Жёсткие ограничения на re-export (полный запрет
      без согласия) при бизнес-модели Target, основанной
      на дистрибуции/resale:
      reexport_restrictions = "strict";
      business_model_impact = "high";
      ставь EXP2; overall_risk_level = "high".

    - Договор на услуги/консалтинг, не связанный с передачей
      товаров/технологий — экспортный контроль не релевантен:
      has_export_control_provisions = "none";
      red_flags = "NONE" (если нет чувствительного контекста);
      overall_risk_level = "low".

    - Пустые или явно нерелевантные фрагменты:
      все поля = "unclear";
      red_flags = "UNCLEAR";
      overall_risk_level = "medium";
      reason = "Недостаточно данных для анализа положений
      об экспортном контроле."
    </edge_cases>

    <output_expectations>
    На основе твоего анализа отдельный механизм извлечения сформирует
    структурированные поля по заранее заданной схеме. Твоя задача —
    давать чёткие юридические выводы и указывать конкретные формулировки
    из текста, на которых они основаны. Не генерируй JSON —
    просто излагай выводы структурированно и однозначно.
    </output_expectations>

  enabled: true
  mode: "hybrid"
  fields:
    - name: "has_export_control_provisions"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "applicable_regimes"
      type: "string"

    - name: "requires_export_compliance"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "requires_export_licenses"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "reexport_restrictions"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "red_flags"
      type: "string"

    - name: "reason"
      type: "string"

  store_payload: true

red_flags:
  items:
    - code: "EXP1"
      description: "Отсутствие экспортно-контрольных положений."
    - code: "EXP2"
      description: "Жёсткие ограничения на re-export."
    - code: "EXP3"
      description: "Формальные/общие положения об экспортном контроле без детализации."