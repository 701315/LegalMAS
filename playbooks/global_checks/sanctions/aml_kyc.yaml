id: "aml_kyc"
name: "AML/KYC требования"
description: >
  Анализирует положения об AML/KYC: идентификация клиентов и бенефициаров,
  подозрительные транзакции, мониторинг и сообщения, последствия нарушений.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"

rules:
  keywords:
    - "AML"
    - "anti-money laundering"
    - "противодействие легализации доходов"
    - "борьба с отмыванием денег"
    - "KYC"
    - "know your customer"
    - "идентификация клиентов"
    - "beneficial owner"
    - "бенефициарный владелец"
    - "подозрительные транзакции"
    - "suspicious transactions"
    - "reporting obligations"
    - "обязанности по сообщению"
  keyword_mode: "any"
  regex_patterns: []
  clause_patterns: []

llm:
  prompt_template: |
    <role>
    Ты — юрист по AML/KYC и финансовому комплаенсу.
    Твоя специализация — договорные обязательства по идентификации клиентов,
    мониторингу транзакций и последствиям нарушений AML/KYC.
    </role>

    <context>
    Ниже приведены фрагменты договора, где могут быть положения AML/KYC:

    {context}
    </context>

    <instructions>
    Определи:

    1) Обязательства по идентификации клиентов и бенефициаров (has_kyc_obligations):
       - требования по KYC/know your customer, идентификации клиентов и бенефициарных
         владельцев, сбор KYC‑документов;
       - периодическое обновление KYC‑информации.
       Выбери:
       - "yes" — явно прописанные KYC‑обязательства;
       - "no" — явное отсутствие таких требований при наличии других комплаенс‑блоков;
       - "unclear" — если по фрагментам нельзя понять.

    2) AML‑мониторинг и сообщения (has_aml_monitoring_and_reporting):
       - требования мониторить операции на предмет подозрительных транзакций;
       - обязанности по сообщению в уполномоченные органы или контрагенту
         о suspicious transactions, unusual activity, red flags.

    3) Раскрытие бенефициаров (requires_beneficial_owner_disclosure):
       - прямые требования раскрывать и/или подтверждать beneficial owner,
         конечных бенефициаров, контролирующих лиц;
       - обновление информации при изменении бенефициаров.

    4) Последствия нарушений AML/KYC (aml_kyc_breach_consequences):
       - какие меры предусмотрены при невыполнении AML/KYC:
         * приостановление операций / блокировка транзакций — "suspension";
         * отказ в обслуживании или расторжение договора — "termination";
         * сочетание нескольких видов мер — "mixed";
         * если специальных последствий нет — "none";
         * если по тексту неясно — "unclear".

    5) Оцени общий риск для Target (overall_risk_level: low / medium / high):
       - учитывая полноту KYC, наличие мониторинга/репортинга, раскрытие бенефициаров
         и жёсткость последствий при нарушении (особенно одностороннее право
         блокировки/расторжения).
    </instructions>

    <edge_cases>
    ВАЖНО — пограничные случаи:

    — Если договор содержит только общую фразу "стороны соблюдают применимое
      AML/KYC законодательство" без конкретики по KYC, бенефициарам и последствиям:
      has_kyc_obligations и другие флаги часто = "unclear",
      риск не ниже "medium" при высокорисковой юрисдикции/структуре.

    — Если AML/KYC блок очень жёсткий в пользу банка/поставщика услуг:
      - широкое право одностороннего приостановления или расторжения при
        "reasonable suspicion" или отказе предоставить документы;
      - это повышает риск для Target, особенно при критичности услуг.

    — Если есть детализированные процедуры KYC, явное требование раскрытия
      бенефициаров и прописанные обязанности по мониторингу и сообщениям
      (включая соблюдение требований локального законодательства):
      это обычно снижает регуляторный риск, но может увеличивать операционный
      риск при неисполнении (отрази это в reason).

    — Если текст фрагментарный: видно слово "AML" или "KYC", но непонятны
      ни обязанности, ни последствия:
      используй "unclear" для соответствующих полей, поясни в reason,
      что данных недостаточно.

    — Пустые или нерелевантные фрагменты:
      большинство полей = "unclear",
      overall_risk_level = "medium",
      reason = "Недостаточно данных для анализа AML/KYC-обязательств и последствий их нарушения."
    </edge_cases>

    <examples>
    ПРИМЕР 1 — ДЕТАЛЬНЫЙ AML/KYC БЛОК (MEDIUM/LOW):

    Фрагмент: "Клиент обязуется проходить процедуры KYC, предоставлять информацию
    о бенефициарных владельцах и обновлять ее по запросу Банка. Банк осуществляет
    мониторинг операций и вправе уведомлять компетентные органы о подозрительных
    транзакциях. В случае отказа Клиента предоставить запрошенные KYC‑документы
    Банк вправе приостановить проведение операций до устранения нарушений."

    {{
      "has_kyc_obligations": "yes",
      "has_aml_monitoring_and_reporting": "yes",
      "requires_beneficial_owner_disclosure": "yes",
      "aml_kyc_breach_consequences": "suspension",
      "overall_risk_level": "medium",
      "reason": "Есть детальный KYC, раскрытие бенефициаров и AML‑мониторинг; последствия ограничены приостановкой операций до устранения нарушений, что создаёт управляемый, умеренный риск для Target."
    }}

    ПРИМЕР 2 — ЖЁСТКОЕ ПРАВО НА РАСТОРЖЕНИЕ (HIGH):

    Фрагмент: "В случае непредоставления Клиентом информации, запрошенной для
    целей AML/KYC, либо при наличии подозрений в отмывании доходов Банк вправе
    немедленно прекратить обслуживание и расторгнуть Договор."

    {{
      "has_kyc_obligations": "yes",
      "has_aml_monitoring_and_reporting": "yes",
      "requires_beneficial_owner_disclosure": "unclear",
      "aml_kyc_breach_consequences": "termination",
      "overall_risk_level": "high",
      "reason": "Наличие KYC/AML‑обязательств сочетается с правом Банка немедленно расторгнуть договор при подозрениях или непредоставлении информации, что создаёт высокий операционный риск для Target."
    }}

    ПРИМЕР 3 — ФОРМАЛЬНАЯ ОГОВОРКА БЕЗ ДЕТАЛЕЙ (MEDIUM):

    Фрагмент: "Стороны обязуются соблюдать применимые законы о противодействии
    легализации доходов и идентификации клиентов."

    {{
      "has_kyc_obligations": "unclear",
      "has_aml_monitoring_and_reporting": "unclear",
      "requires_beneficial_owner_disclosure": "unclear",
      "aml_kyc_breach_consequences": "unclear",
      "overall_risk_level": "medium",
      "reason": "Имеется только общая ссылка на AML/KYC‑законодательство без конкретных обязанностей и последствий, что не позволяет оценить реальный уровень защиты и рисков."
    }}
    </examples>

    <output_format>
    Твой ответ ДОЛЖЕН быть строго валидным JSON-объектом со следующими
    полями:

    {{
      "has_kyc_obligations": "one of: yes | no | unclear",
      "has_aml_monitoring_and_reporting": "one of: yes | no | unclear",
      "requires_beneficial_owner_disclosure": "one of: yes | no | unclear",
      "aml_kyc_breach_consequences": "one of: none | suspension | termination | mixed | unclear",
      "overall_risk_level": "one of: low | medium | high",
      "reason": "string — краткое объяснение на русском с указанием ключевых AML/KYC-обязательств, последствий и их влияния на риск для Target"
    }}

    Все перечисленные поля ДОЛЖНЫ присутствовать в JSON, даже если их значение равно null.
    </output_format>

    <constraints>
    ЖЁСТКИЕ ПРАВИЛА:
    1. Выведи ТОЛЬКО один JSON-объект. Никакого текста до или после.
    2. Не пиши "Вот JSON", "Here is the JSON" и т.п.
    3. Не используй Markdown, бэктики ``` или любые обёртки.
    4. Все строки — в двойных кавычках.
    5. Значения перечислимых полей — СТРОГО из указанных вариантов.
    6. Ключи — точно как указано, без добавления новых.
    7. Поле "reason" ДОЛЖНО содержать конкретные формулировки из фрагментов
       и вывод по рискам, а не общие фразы вроде "есть риски".
    8. Начни ответ сразу с символа {{
    9. Если по какому‑то полю нет достаточно информации в тексте —
       верни для него 'unclear' или null (для reason пустое значение
       недопустимо — нужно объяснение). НЕ придумывай значения, не интерполируй.
    </constraints>
  prompt_file: null
  context_k: 4
  temperature: 0.0
  max_tokens: 512

evidence:
  required: false
  min_snippet_length: 20
  max_snippet_length: 500

retrieval:
  context_k: 4
  max_chunks: 8
  boost_keywords:
    - "AML"
    - "KYC"
    - "beneficial owner"
    - "подозрительные транзакции"
  rerank: true
  filters: {}

conditional: null

extraction:
  enabled: true
  mode: "hybrid"
  fields:
    - name: "has_kyc_obligations"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
    - name: "has_aml_monitoring_and_reporting"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
    - name: "requires_beneficial_owner_disclosure"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
    - name: "aml_kyc_breach_consequences"
      type: "string"
      allowed_values:
        - "none"
        - "suspension"
        - "termination"
        - "mixed"
        - "unclear"
    - name: "overall_risk_level"
      type: "string"
      allowed_values:
        - "low"
        - "medium"
        - "high"
    - name: "reason"
      type: "string"
  store_payload: true

red_flags:
  items:
    - code: "AML1"
      description: "Отсутствие AML/KYC-положений при явно высокорискованной структуре/юрисдикции контрагентов."