id: "aml_kyc"
name: "AML/KYC требования"
description: >
  Анализирует положения об AML/KYC: идентификация клиентов и бенефициаров,
  мониторинг подозрительных транзакций, обязанности по сообщениям,
  ссылки на законодательство (ФЗ-115, FATF, EU AML Directives),
  последствия нарушений и баланс прав между сторонами.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"

rules:
  keyword_mode: any

  keywords:
    high:
      # Прямые AML/KYC термины
      - "(?i)\\bAML\\b"
      - "(?i)anti[-\\s]?money\\s+laundering"
      - "(?i)противодействи[ея]\\s+(легализаци[ия]|отмывани[юя])"
      - "(?i)борьб[аы]\\s+с\\s+отмывани[ея]м"
      - "(?i)\\bKYC\\b"
      - "(?i)know\\s+your\\s+customer"
      - "(?i)идентификаци[яию]\\s+клиент[аов]"
      - "(?i)customer\\s+(identification|due\\s+diligence)"
      - "(?i)CDD"
      - "(?i)EDD"
      - "(?i)enhanced\\s+due\\s+diligence"

      # Бенефициары
      - "(?i)beneficial\\s+owner"
      - "(?i)ultimate\\s+beneficial\\s+owner"
      - "(?i)UBO"
      - "(?i)бенефициарн[а-яый]+\\s+(владелец|собственник)"
      - "(?i)контролирующ[а-яее]+\\s+лиц[оа]"
      - "(?i)конечн[а-яый]+\\s+бенефициар"

      # Подозрительные транзакции
      - "(?i)suspicious\\s+(transaction|activity|operation)"
      - "(?i)SAR"
      - "(?i)STR"
      - "(?i)подозрительн[а-яые]+\\s+(транзакц|операц|сделк)"
      - "(?i)необычн[а-яые]+\\s+(операц|сделк)"
      - "(?i)сомнительн[а-яые]+\\s+операц"

      # Законодательство
      - "(?i)ФЗ[-\\s]?115"
      - "(?i)115[-\\s]?ФЗ"
      - "(?i)Федеральн[а-яый]+\\s+закон[\\s\\S]{0,30}противодействи[ия]\\s+легализаци"
      - "(?i)FATF"
      - "(?i)Financial\\s+Action\\s+Task\\s+Force"
      - "(?i)EU\\s+AML\\s+Directive"
      - "(?i)4AMLD|5AMLD|6AMLD"
      - "(?i)Bank\\s+Secrecy\\s+Act"
      - "(?i)BSA"
      - "(?i)FinCEN"

    medium:
      # Мониторинг и reporting
      - "(?i)transaction\\s+monitoring"
      - "(?i)мониторинг\\s+(операц|транзакц)"
      - "(?i)reporting\\s+obligations?"
      - "(?i)обязанност[ьи]\\s+по\\s+сообщени[юя]"
      - "(?i)report\\s+to\\s+[\\s\\S]{0,30}(authority|regulator|Росфинмониторинг)"
      - "(?i)сообщ[а-я]+\\s+в\\s+[\\s\\S]{0,30}(Росфинмониторинг|уполномоченн)"
      - "(?i)file\\s+a\\s+report"
      - "(?i)financial\\s+intelligence\\s+unit"
      - "(?i)FIU"
      - "(?i)Росфинмониторинг"

      # KYC процедуры
      - "(?i)KYC\\s+(documents?|information|data|procedures?)"
      - "(?i)документ[ыа]\\s+KYC"
      - "(?i)KYC[-\\s]?процедур"
      - "(?i)identity\\s+verification"
      - "(?i)верификаци[яию]\\s+личност"
      - "(?i)проверк[аи]\\s+клиент[аов]"
      - "(?i)customer\\s+onboarding"

      # Обновление информации
      - "(?i)update[d]?\\s+[\\s\\S]{0,20}(KYC|customer|beneficial)"
      - "(?i)обновлени[ея]\\s+[\\s\\S]{0,20}(KYC|информаци[ия]|данн)"
      - "(?i)periodic\\s+(review|update)"
      - "(?i)периодическ[а-яое]+\\s+(обновлени|проверк)"

      # Последствия нарушений
      - "(?i)suspend[ed]?\\s+(account|operation|transaction|service)"
      - "(?i)приостанов[а-я]+\\s+(счёт|операц|обслуживани)"
      - "(?i)block[ed]?\\s+(account|transaction|funds)"
      - "(?i)заблокировать\\s+(счёт|средств|операц)"
      - "(?i)refuse[d]?\\s+to\\s+(process|execute)"
      - "(?i)отказ[а-я]*\\s+в\\s+(обслуживании|проведении)"
      - "(?i)terminate[d]?\\s+[\\s\\S]{0,30}(AML|KYC|compliance)"

    low:
      # Общие compliance-термины
      - "(?i)compliance"
      - "(?i)комплаенс"
      - "(?i)due\\s+diligence"
      - "(?i)надлежащ[а-яая]+\\s+проверк"

      # Общие ссылки на клиентов
      - "(?i)customer"
      - "(?i)клиент"
      - "(?i)counterparty"
      - "(?i)контрагент"

      # Общие ссылки на идентификацию
      - "(?i)identification"
      - "(?i)идентификаци"
      - "(?i)verification"
      - "(?i)верификаци"

      # Общие ссылки на транзакции
      - "(?i)transaction"
      - "(?i)транзакц"
      - "(?i)операци"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 640

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  context_k: 5
  max_chunks: 10
  boost_keywords:
    - "AML"
    - "anti-money laundering"
    - "противодействие легализации"
    - "KYC"
    - "know your customer"
    - "идентификация клиентов"
    - "beneficial owner"
    - "бенефициарный владелец"
    - "UBO"
    - "suspicious transaction"
    - "подозрительные транзакции"
    - "transaction monitoring"
    - "мониторинг операций"
    - "reporting obligations"
    - "Росфинмониторинг"
    - "ФЗ-115"
    - "FATF"
    - "suspend account"
    - "приостановить обслуживание"
    - "customer due diligence"
    - "CDD"
    - "EDD"
  rerank: true
  filters: {}

conditional: null

extraction:
  llm_prompt_extraction: |
    <role>
    Ты — юрист по AML/KYC и финансовому комплаенсу.
    Твоя специализация — договорные обязательства по идентификации
    клиентов (KYC), мониторингу транзакций (AML), раскрытию
    бенефициаров, а также последствия нарушений AML/KYC-требований.
    </role>

    <context>
    Ниже приведены фрагменты договора, где могут быть положения
    AML/KYC:

    {context}
    </context>

    <instructions>
    Проведи анализ по шагам. Каждый шаг логически соответствует одному
    или нескольким полям итоговой оценки риска.

    Шаг 1 — ОБЯЗАТЕЛЬСТВА ПО ИДЕНТИФИКАЦИИ КЛИЕНТОВ (KYC)
    (используется для заполнения поля "has_kyc_obligations"):
    - Определи, есть ли в тексте:
      * требования по KYC / know your customer;
      * обязанности по идентификации клиентов;
      * сбор и предоставление KYC-документов;
      * customer due diligence (CDD) / enhanced due diligence (EDD).
    - Сформулируй вывод:
      * "yes" — явно прописанные и детализированные
        KYC-обязательства;
      * "none" — явное отсутствие KYC-требований;
      * "unclear" — невозможно определить.

    Шаг 2 — ПЕРИОДИЧЕСКОЕ ОБНОВЛЕНИЕ KYC
    (используется для заполнения поля "requires_kyc_update"):
    - Определи, предусмотрено ли:
      * периодическое обновление KYC-информации;
      * обязанность уведомлять об изменениях;
      * regular review / periodic update.
    - Сформулируй вывод: "yes" / "no" / "unclear".

    Шаг 3 — РАСКРЫТИЕ БЕНЕФИЦИАРОВ
    (используется для заполнения поля "requires_ubo_disclosure"):
    - Определи, есть ли требования:
      * раскрывать beneficial owner / UBO / бенефициарных владельцев;
      * раскрывать контролирующих лиц;
      * обновлять информацию при изменении бенефициаров.
    - Сформулируй вывод: "yes" / "no" / "unclear".

    Шаг 4 — AML-МОНИТОРИНГ И СООБЩЕНИЯ
    (используется для заполнения поля "has_aml_monitoring"):
    - Определи, предусмотрены ли:
      * обязанности мониторить операции на предмет
        подозрительных/необычных транзакций;
      * transaction monitoring;
      * обязанности по сообщению (reporting obligations)
        в уполномоченные органы (Росфинмониторинг, FinCEN, FIU).
    - Сформулируй вывод:
      * "yes" — детализированные обязанности по мониторингу
        и reporting;
      * "none" — отсутствуют;
      * "unclear" — невозможно определить.

    Шаг 5 — ССЫЛКИ НА ЗАКОНОДАТЕЛЬСТВО
    (используется для заполнения поля "references_legislation"):
    - Определи, есть ли ссылки на конкретное AML-законодательство:
      * ФЗ-115 (Россия);
      * FATF рекомендации;
      * EU AML Directives (4AMLD, 5AMLD, 6AMLD);
      * Bank Secrecy Act / FinCEN (США);
      * другое.
    - Сформулируй вывод: "yes" / "no" / "unclear".

    Шаг 6 — RED FLAGS
    (используется для заполнения поля "red_flags"):
    - Оцени наличие следующих рисковых факторов:

      * «AML1» — Отсутствие AML/KYC-положений при явно
        высокорискованной структуре или юрисдикции. Признаки:
        - has_kyc_obligations = "none";
        - has_aml_monitoring = "none";
        - при этом контекст предполагает финансовые операции,
          трансграничные платежи или высокорисковые юрисдикции.

      * «AML2» — Чрезмерно жёсткие AML/KYC-права контрагента
        с высокой асимметрией. Признаки:
        - rights_asymmetry = "high";
        - контрагент может приостановить/расторгнуть при
          "reasonable suspicion" без объективных критериев;
        - Target не имеет права оспорить или получить
          уведомление;
        - это создаёт операционный риск блокировки критичных
          услуг.

      * «AML3» — Формальные/декларативные AML/KYC-положения
        без детализации при необходимости развёрнутого комплаенса.
        Признаки:
        - has_kyc_obligations = "general";
        - has_aml_monitoring = "general";
        - references_legislation = "no";
        - при этом контекст требует детализированного
          AML/KYC-комплаенса.

    - Если AML/KYC-положения детализированы, сбалансированы
      и содержат ссылки на законодательство — верни "NONE".
    - Если данных недостаточно для оценки или текст противоречив —
      верни "UNCLEAR".
    - Формат: один или несколько кодов через запятую
      ("AML1", "AML2", "AML1, AML3"), "NONE" или "UNCLEAR".
      Без комментариев в этом поле — всё объясняющее в reason.

    Шаг 7 — ОБОСНОВАНИЕ
    (используется для заполнения поля "reason"):

    - В "reason" кратко обоснуй вывод:
      * ссылайся на ключевые формулировки (по возможности
        с короткими цитатами);
      * поясни, как структура AML/KYC-обязательств влияет
        на регуляторный и операционный риск Target;
      * если выставлены red_flags — объясни, почему именно
        эти коды.
    </instructions>

    <edge_cases>
    Обрабатывай пограничные ситуации так:

    - В договоре только общая фраза "Стороны соблюдают применимое
      AML/KYC законодательство" без конкретики:
      has_kyc_obligations = "general";
      has_aml_monitoring = "general";
      рассматривай AML3, если контекст требует детализации.

    - AML/KYC-блок очень жёсткий: широкое право одностороннего
      приостановления при "reasonable suspicion" без критериев,
      без права Target оспорить:
      rights_asymmetry = "high";
      ставь AML2; overall_risk_level = "high" или "medium"
      в зависимости от критичности услуг.

    - Детализированные KYC-процедуры, требования по бенефициарам,
      ссылки на ФЗ-115 и FATF, пропорциональные последствия:
      has_kyc_obligations = "detailed";
      references_legislation = "yes";
      overall_risk_level = "low";
      red_flags = "NONE".

    - Есть мониторинг и reporting obligations, но последствия
      включают только "notify authorities" без блокировок:
      breach_consequences = "reporting";
      rights_asymmetry = "low";
      это менее рискованно для Target.

    - Текст фрагментарный: упоминается "AML" или "KYC",
      но обязанности и последствия неясны:
      соответствующие поля = "unclear";
      red_flags = "UNCLEAR";
      overall_risk_level = "medium".

    - Договор с нефинансовой организацией, AML/KYC не упоминаются:
      это может быть нормально (не все договоры требуют AML);
      has_kyc_obligations = "none";
      has_aml_monitoring = "none";
      red_flags = "NONE" (если нет высокорискованного контекста);
      overall_risk_level = "low".

    - Пустые или явно нерелевантные фрагменты:
      все поля = "unclear";
      red_flags = "UNCLEAR";
      overall_risk_level = "medium";
      reason = "Недостаточно данных для анализа AML/KYC-обязательств."
    </edge_cases>

    <output_expectations>
    На основе твоего анализа отдельный механизм извлечения сформирует
    структурированные поля по заранее заданной схеме. Твоя задача —
    давать чёткие юридические выводы и указывать конкретные формулировки
    из текста, на которых они основаны. Не генерируй JSON —
    просто излагай выводы структурированно и однозначно.
    </output_expectations>

  enabled: true
  mode: "hybrid"
  fields:
    - name: "has_kyc_obligations"
      type: "string"
      allowed_values:
        - "yes"
        - "none"
        - "unclear"

    - name: "requires_kyc_update"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "requires_ubo_disclosure"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "has_aml_monitoring"
      type: "string"
      allowed_values:
        - "yes"
        - "none"
        - "unclear"

    - name: "references_legislation"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "red_flags"
      type: "string"

    - name: "reason"
      type: "string"

  store_payload: true

red_flags:
  items:
    - code: "AML1"
      description: "Отсутствие AML/KYC-положений ."
    - code: "AML2"
      description: "Чрезмерно жёсткие AML/KYC-права контрагента."
    - code: "AML3"
      description: "Формальные AML/KYC-положения без детализации при контексте."