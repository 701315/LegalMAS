id: "aml_kyc"
name: "AML/KYC требования"
group: "Compliance"
description: >
  Анализирует положения об AML/KYC: идентификация клиентов и
  бенефициаров, мониторинг подозрительных транзакций, обязанности
  по сообщениям, ссылки на законодательство (ФЗ-115, FATF, EU AML
  Directives), последствия нарушений и асимметрия прав между сторонами.

  Формирует краткий user-facing вывод и оценивает регуляторный и
  операционный риск для Target.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"
ui_mode: "field_extraction"

rules:
  keyword_mode: any

  keywords:
    high:
      - "(?i)\\bAML\\b"
      - "(?i)anti[-\\s]?money\\s+laundering"
      - "(?i)противодействи[ея]\\s+(легализаци[ия]|отмывани[юя])"
      - "(?i)\\bKYC\\b"
      - "(?i)know\\s+your\\s+customer"
      - "(?i)идентификаци[яию]\\s+клиент[аов]"
      - "(?i)customer\\s+(identification|due\\s+diligence)"
      - "(?i)\\bCDD\\b"
      - "(?i)\\bEDD\\b"
      - "(?i)enhanced\\s+due\\s+diligence"
      - "(?i)beneficial\\s+owner[\\s\\S]{0,20}(AML|KYC|identify|disclose)"
      - "(?i)ultimate\\s+beneficial\\s+owner"
      - "(?i)\\bUBO\\b"
      - "(?i)бенефициарн[а-яый]+\\s+(владелец|собственник)[\\s\\S]{0,20}(KYC|идентификац)"
      - "(?i)конечн[а-яый]+\\s+бенефициар[\\s\\S]{0,20}(идентификац|раскры)"
      - "(?i)suspicious\\s+(transaction|activity|operation)"
      - "(?i)\\bSAR\\b"
      - "(?i)\\bSTR\\b"
      - "(?i)подозрительн[а-яые]+\\s+(транзакц|операц|сделк)"
      - "(?i)необычн[а-яые]+\\s+(операц|сделк)"
      - "(?i)ФЗ[-\\s]?115"
      - "(?i)115[-\\s]?ФЗ"
      - "(?i)FATF"
      - "(?i)Financial\\s+Action\\s+Task\\s+Force"
      - "(?i)EU\\s+AML\\s+Directive"
      - "(?i)4AMLD|5AMLD|6AMLD"
      - "(?i)Bank\\s+Secrecy\\s+Act"
      - "(?i)\\bFinCEN\\b"
      - "(?i)Росфинмониторинг"

    medium:
      - "(?i)transaction\\s+monitoring"
      - "(?i)мониторинг\\s+(операц|транзакц)"
      - "(?i)reporting\\s+obligations?[\\s\\S]{0,20}(AML|KYC|suspicious)"
      - "(?i)report\\s+to\\s+[\\s\\S]{0,30}(Росфинмониторинг|FIU|FinCEN)"
      - "(?i)сообщ[а-я]+\\s+в\\s+Росфинмониторинг"
      - "(?i)KYC\\s+(documents?|procedures?|information)"
      - "(?i)identity\\s+verification"
      - "(?i)верификаци[яию]\\s+личност"
      - "(?i)customer\\s+onboarding"
      - "(?i)sanctions?\\s+screening"
      - "(?i)проверк[аи]\\s+(по\\s+)?санкционн[а-яый]+\\s+списк"
      - "(?i)periodic\\s+(review|update)[\\s\\S]{0,20}(KYC|customer|beneficial)"
      - "(?i)обновлени[ея]\\s+[\\s\\S]{0,20}KYC"
      - "(?i)update[d]?\\s+[\\s\\S]{0,20}(KYC|beneficial|UBO)"
      - "(?i)(suspend|block|terminat)[\\s\\S]{0,30}(AML|KYC|compliance)"
      - "(?i)(приостанов|заблокир|расторг)[\\s\\S]{0,30}(AML|KYC|комплаенс)"
      - "(?i)refus[a-z]+\\s+to\\s+(process|execute)[\\s\\S]{0,20}(AML|KYC)"

    low:
      - "(?i)\\bAML\\b"
      - "(?i)\\bKYC\\b"
      - "(?i)anti[-\\s]?money\\s+laundering"
      - "(?i)противодействие\\s+отмыванию"
      - "(?i)beneficial\\s+owner"
      - "(?i)бенефициарный\\s+владелец"
      - "(?i)suspicious\\s+transaction"
      - "(?i)подозрительная\\s+транзакция"
      - "(?i)ФЗ[-\\s]?115"
      - "(?i)FATF"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 640

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  retrieval_profile: "sanctions_compliance_check"
  context_k: 5
  max_chunks: 10

  retrieval_query: >
    AML KYC противодействие легализации отмыванию идентификация клиента 
    beneficial owner бенефициар UBO ФЗ-115 FATF transaction monitoring 
    suspicious подозрительная транзакция Росфинмониторинг

  boost_keywords:
    - "AML"
    - "anti-money laundering"
    - "противодействие легализации"
    - "KYC"
    - "know your customer"
    - "идентификация клиентов"
    - "beneficial owner"
    - "бенефициарный владелец"
    - "UBO"
    - "suspicious transaction"
    - "подозрительные транзакции"
    - "transaction monitoring"
    - "мониторинг операций"
    - "reporting obligations"
    - "Росфинмониторинг"
    - "ФЗ-115"
    - "FATF"
    - "customer due diligence"
    - "CDD"
    - "EDD"
    - "sanctions screening"
    - "suspend account"
    - "приостановить обслуживание"

  negative_keywords:
    - "интеллектуальная собственность"
    - "коммерческая тайна"
    - "форс-мажор"
    - "условия оплаты"

  preferred_unit_types:
    - "general_provision"
    - "obligation"

  excluded_unit_types:
    - "technical_fragment"
    - "appendix_reference"
    - "structural_anchor"

  preferred_clause_functions:
    - "obligations"
    - "procedures"

  position_bias:
    preferred_range: [0.0, 1.0]
    boost: 0.10
    scope: "segment"

  rerank: true
  filters: {}

conditional: null

enrichment_hints:
  preferred_segment_types:
    - "contract"
    - "annex"
    - "appendix"
    - "amendment"
  excluded_segment_types:
    - "technical_specification"
    - "price_list"
    - "invoice"
    - "act"
    - "schedule"
  preferred_clause_functions:
    - "obligations"
    - "representations"
    - "boilerplate"
  confidence_bonus_on_match: 0.08
  confidence_penalty_on_excluded_segment: 0.15

extraction:
  enabled: true
  mode: "hybrid"
  llm_max_tokens: 1250

  presence_signal:
    field: "aml_kyc_status"
    present_values: ["present"]
    missing_values: ["missing"]
    unclear_values: ["unclear"]

  llm_prompt_extraction: |
    <role>
    Ты — юрист по AML/KYC и финансовому комплаенсу.
    Твоя задача — точно извлечь из текста:
    1) есть ли в договоре регулирование AML/KYC;
    2) если есть — какие обязательства установлены:
       - характер AML/KYC-обязательств и их детализация;
       - требования по раскрытию бенефициаров (UBO);
       - AML-мониторинг и reporting;
       - ссылки на законодательство;
       - право контрагента заблокировать / приостановить сервис.

    КРИТИЧЕСКИ ВАЖНО:
    - Извлекай ТОЛЬКО то, что прямо написано в тексте.
    - НЕ додумывай AML/KYC-обязательства, если в тексте только
      общие compliance-фразы без конкретики.
    - НЕ считай санкционный скрининг автоматически AML-мониторингом —
      это разные вещи.
    - Если в договоре нет финансовых операций —
      AML/KYC, как правило, не применимы, используй "no".
    - Если ни один фрагмент не содержит информации об AML/KYC
      (нет упоминаний AML / KYC / противодействия легализации /
      идентификации клиентов / UBO) — aml_kyc_status = "missing".
    - Если тексты по теме есть, но вывод сделать нельзя —
      aml_kyc_status = "unclear".
    </role>

    <context_rules>
    - Некоторые фрагменты могут быть нерелевантны — игнорируй их.
    - Если фрагменты противоречат друг другу — используй "unclear"
      и объясни в reason.
    - Различай:
      * "detailed" KYC — конкретные процедуры, перечень документов,
        ссылки на ФЗ-115, FATF, CDD/EDD;
      * "general" KYC — только фраза "соблюдать AML/KYC"
        без конкретики.
    - Право приостановки "broad" — если основание субъективное
      ("reasonable suspicion", по усмотрению контрагента).
    - Право приостановки "proportionate" — только при реальном
      нарушении или фактическом попадании в список.
    - Если ни один фрагмент не содержит информации об AML/KYC
      (нет упоминаний AML / KYC / anti-money laundering /
      идентификации клиентов / UBO), aml_kyc_status = "missing",
      location = null. Не использовать "unclear" при полном отсутствии
      релевантных фрагментов.
    </context_rules>

    <context>
    Ниже приведены релевантные фрагменты договора:

    {context}
    </context>

    <task>
    Заполни только следующие поля:
    - aml_kyc_display
    - aml_kyc_status
    - has_kyc_obligations
    - kyc_detail_level
    - requires_kyc_update
    - requires_ubo_disclosure
    - has_aml_monitoring
    - references_legislation
    - counterparty_suspension_rights
    - reason
    </task>

    <location_instructions>
    Для каждого поля по возможности укажи location в формате:
    {"clause_ref": "п. 12.1", "page": 7, "quote": "дословная фраза из договора"}

    Правила:
    - clause_ref — короткая ссылка на пункт / раздел / статью именно в том
      виде, как она написана в договоре;
    - page — целое число страницы;
    - quote — дословная фраза из текста договора (НЕ пересказ, НЕ парафраз).
      Копируй её посимвольно, сохраняя формулировку и порядок слов.
      Оптимальная длина: 30–300 символов.
    - Для synthesized-поля aml_kyc_display и reason
      location ВСЕГДА null.
    - Для aml_kyc_status = "missing" — location = null.
    - Для aml_kyc_status = "present" / "unclear" — quote
      с наиболее релевантной фразой договора.
    - Для has_kyc_obligations, requires_kyc_update,
      requires_ubo_disclosure, has_aml_monitoring,
      references_legislation:
      * если "yes" — quote с фразой-основанием;
      * если "no" — различай: прямое исключение (quote обязательна)
        vs отсутствие упоминания (location = null);
      * если "unclear" — location = null.
    - Для kyc_detail_level — quote с фрагментом процедур KYC,
      если уровень определён.
    - Для counterparty_suspension_rights — quote с фразой-основанием
      права приостановки.
    - Не выдумывай location или quote. Если дословную фразу определить
      нельзя — location = null.
    </location_instructions>

    <instructions>
    Шаг 0 — НАЛИЧИЕ РЕГУЛИРОВАНИЯ AML/KYC

    Заполни "aml_kyc_status".

    Значения:
    - "present" — если хотя бы одно содержательное signal-поле
      указывает на наличие информации по теме:
      * has_kyc_obligations = "yes";
      * requires_kyc_update = "yes";
      * requires_ubo_disclosure = "yes";
      * has_aml_monitoring = "yes";
      * references_legislation = "yes";
      * counterparty_suspension_rights ∈ {"broad", "proportionate"};
      * ЛИБО любое поле = "no", но с заполненным location
        с прямой цитатой об исключении (см. RF3).
    - "missing" — если все содержательные поля = "no" БЕЗ цитат,
      ЛИБО фрагментов по теме нет вообще.
    - "unclear" — если все содержательные = "unclear" при наличии
      фрагментов, но невозможности вывода.

    Шаг 1 — KYC-ОБЯЗАТЕЛЬСТВА

    Заполни "has_kyc_obligations".

    Значения:
    - "yes" — явные KYC-требования: идентификация клиентов,
      сбор KYC-документов, CDD / EDD.
    - "no" — отсутствуют.
    - "unclear" — нельзя надёжно определить.

    Шаг 2 — УРОВЕНЬ ДЕТАЛИЗАЦИИ KYC

    Заполни "kyc_detail_level".

    Значения:
    - "detailed" — конкретные процедуры, ссылки на законы,
      перечень документов, упоминание CDD / EDD.
    - "general" — только общие фразы без процедур.
    - "not_applicable" — KYC нет.
    - "unclear" — нельзя определить.

    Шаг 3 — ПЕРИОДИЧЕСКОЕ ОБНОВЛЕНИЕ KYC

    Заполни "requires_kyc_update".

    Значения:
    - "yes" — periodic review / update KYC прямо предусмотрен.
    - "no" — нет.
    - "unclear" — нельзя определить.

    Шаг 4 — РАСКРЫТИЕ UBO

    Заполни "requires_ubo_disclosure".

    Значения:
    - "yes" — требуется раскрыть beneficial owner / UBO /
      контролирующих лиц.
    - "no" — нет.
    - "unclear" — нельзя определить.

    Шаг 5 — AML-МОНИТОРИНГ И REPORTING

    Заполни "has_aml_monitoring".

    Значения:
    - "yes" — есть мониторинг транзакций или reporting в
      уполномоченные органы (Росфинмониторинг, FinCEN, FIU).
    - "no" — нет.
    - "unclear" — нельзя определить.

    Шаг 6 — ССЫЛКИ НА ЗАКОНОДАТЕЛЬСТВО

    Заполни "references_legislation".

    Значения:
    - "yes" — прямые ссылки: ФЗ-115, FATF,
      EU AML Directives (4AMLD/5AMLD/6AMLD),
      Bank Secrecy Act / FinCEN.
    - "no" — нет.
    - "unclear" — нельзя определить.

    Шаг 7 — ПРАВО КОНТРАГЕНТА НА ПРИОСТАНОВКУ

    Заполни "counterparty_suspension_rights".

    Значения:
    - "broad" — субъективное основание: "reasonable suspicion",
      по усмотрению контрагента без объективного критерия.
    - "proportionate" — только при реальном нарушении /
      фактическом включении в список.
    - "none" — нет права на приостановку.
    - "unclear" — нельзя определить.

    Шаг 8 — НОРМАЛИЗОВАННЫЙ DISPLAY ДЛЯ DD GRID

    Заполни "aml_kyc_display".

    Это итоговое поле для таблицы.
    Строй его ТОЛЬКО на основе уже заполненных полей выше.
    Не добавляй информацию сверх них.

    Правила:
    - Если aml_kyc_status = "missing":
      "AML/KYC не обнаружены"
    - Если все поля unclear:
      "Не удалось определить AML/KYC"
    - Иначе комбинируй через ";":
      * kyc_detail_level: "детализированы" / "декларативно"
      * references_legislation (если "yes": конкретные законы)
      * requires_ubo_disclosure (если "yes": "UBO раскрытие")
      * counterparty_suspension_rights (если "broad":
        "право приостановки широкое")
    - Не более 4 фактов через ";".

    Шаг 9 — КРАТКОЕ ОБОСНОВАНИЕ

    Заполни "reason".

    Правила:
    - Первое предложение — краткий вывод.
    - Второе — короткая цитата из текста (до 100 символов).
    - Пиши по-русски.
    </instructions>

    <edge_cases>
    - "Соблюдать AML/KYC законодательство" без конкретики:
      * aml_kyc_status = "present"
      * has_kyc_obligations = "yes"
      * kyc_detail_level = "general"

    - Детализированные KYC + UBO + ФЗ-115 + пропорциональная
      приостановка:
      * aml_kyc_status = "present"
      * kyc_detail_level = "detailed"
      * references_legislation = "yes"
      * requires_ubo_disclosure = "yes"
      * counterparty_suspension_rights = "proportionate"

    - "Reasonable suspicion" как основание приостановки:
      * aml_kyc_status = "present"
      * counterparty_suspension_rights = "broad"

    - Договор без финансовых операций (консалтинг, аренда):
      * aml_kyc_status = "missing"
      * has_kyc_obligations = "no"
      * kyc_detail_level = "not_applicable"
      * requires_kyc_update = "no"
      * requires_ubo_disclosure = "no"
      * has_aml_monitoring = "no"
      * references_legislation = "no"
      * counterparty_suspension_rights = "none"
      * aml_kyc_display = "AML/KYC не обнаружены"
      * location у всех полей = null.

    - Договор прямо фиксирует отсутствие AML/KYC:
      * aml_kyc_status = "present"
      * has_kyc_obligations = "no"
      * location с прямой цитатой об отсутствии.

    - Формулировки есть, но вывод невозможен:
      * aml_kyc_status = "unclear"
      * aml_kyc_display = "Не удалось определить AML/KYC"
    </edge_cases>

    <output_expectations>
    - Верни результат строго в формате JSON.
    - Не оборачивай в markdown-блоки (без ```).
    - Не добавляй комментариев вне JSON.
    - Все значения полей с allowed_values — на английском.
    - Свободные текстовые поля (aml_kyc_display, reason) —
      на русском языке.
    - Не добавляй полей, кроме указанных.
    - Для каждого поля возвращай объект с ключами
      "value", "confidence", "location".

    Пример структуры ответа:
    {
      "aml_kyc_display": {"value": "AML/KYC детализированы (ФЗ-115); UBO раскрытие; мониторинг", "confidence": 0.92, "location": null},
      "aml_kyc_status": {"value": "present", "confidence": 0.95, "location": {"clause_ref": "п. 8.1", "page": 5, "quote": "Стороны обязуются соблюдать требования ФЗ-115 о противодействии легализации"}},
      "has_kyc_obligations": {"value": "yes", "confidence": 0.95, "location": {"clause_ref": "п. 8.1", "page": 5, "quote": "Стороны обязуются соблюдать требования ФЗ-115"}},
      "kyc_detail_level": {"value": "detailed", "confidence": 0.85, "location": {"clause_ref": "п. 8.2", "page": 5, "quote": "Идентификация клиентов производится в порядке, установленном ФЗ-115"}},
      "requires_kyc_update": {"value": "yes", "confidence": 0.85, "location": {"clause_ref": "п. 8.3", "page": 5, "quote": "KYC обновляется не реже одного раза в год"}},
      "requires_ubo_disclosure": {"value": "yes", "confidence": 0.90, "location": {"clause_ref": "п. 8.4", "page": 5, "quote": "Стороны раскрывают сведения о бенефициарных владельцах"}},
      "has_aml_monitoring": {"value": "yes", "confidence": 0.85, "location": {"clause_ref": "п. 8.5", "page": 5, "quote": "мониторинг подозрительных операций с сообщением в Росфинмониторинг"}},
      "references_legislation": {"value": "yes", "confidence": 0.95, "location": {"clause_ref": "п. 8.1", "page": 5, "quote": "требования ФЗ-115"}},
      "counterparty_suspension_rights": {"value": "proportionate", "confidence": 0.80, "location": {"clause_ref": "п. 8.7", "page": 5, "quote": "при фактическом включении в перечень"}},
      "reason": {"value": "...", "confidence": 0.90, "location": null}
    }
    </output_expectations>

  fields:
    - name: "aml_kyc_display"
      type: "string"
      presentation: "fact"
      label: "AML/KYC"
      description: "Нормализованный user-facing вывод для DD Grid"
      display_in_grid: true
      display_priority: 1

    - name: "aml_kyc_status"
      type: "string"
      presentation: "signal"
      risk_weight: "info"
      description: "Наличие регулирования AML/KYC в договоре"
      display_in_grid: false
      allowed_values:
        - "present"
        - "missing"
        - "unclear"

    - name: "has_kyc_obligations"
      type: "string"
      presentation: "signal"
      risk_weight: "high"
      description: "Наличие KYC-обязательств"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
      display_in_grid: false

    - name: "kyc_detail_level"
