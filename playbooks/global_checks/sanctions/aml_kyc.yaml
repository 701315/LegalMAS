id: "aml_kyc"
name: "AML/KYC требования"
description: >
  Анализирует положения об AML/KYC: идентификация клиентов и бенефициаров,
  подозрительные транзакции, мониторинг и сообщения, последствия нарушений.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"

rules:
  keywords:
    - "AML"
    - "anti-money laundering"
    - "противодействие легализации доходов"
    - "борьба с отмыванием денег"
    - "KYC"
    - "know your customer"
    - "идентификация клиентов"
    - "beneficial owner"
    - "бенефициарный владелец"
    - "подозрительные транзакции"
    - "suspicious transactions"
    - "reporting obligations"
    - "обязанности по сообщению"
  keyword_mode: "any"
  regex_patterns: []
  clause_patterns: []

llm:
  prompt_template: |
    <role>
    Ты — юрист по AML/KYC и финансовому комплаенсу.
    Твоя специализация — договорные обязательства по идентификации клиентов,
    мониторингу транзакций и последствиям нарушений AML/KYC.
    </role>

    <context>
    Ниже приведены фрагменты договора, где могут быть положения AML/KYC:

    {context}
    </context>

    <instructions>
    Проведи анализ по шагам. Каждый шаг логически связан с одним или
    несколькими полями итоговой оценки.

    Шаг 1 — ОБЯЗАТЕЛЬСТВА ПО ИДЕНТИФИКАЦИИ КЛИЕНТОВ (KYC)
    (используется для "has_kyc_obligations"):

    - Определи, есть ли в тексте:
      * требования по KYC / know your customer;
      * обязанности по идентификации клиентов и бенефициарных владельцев;
      * сбор и предоставление KYC‑документов;
      * периодическое обновление KYC‑информации.
    - Сформулируй вывод:
      * "yes" — явно прописанные KYC‑обязательства;
      * "no" — явное отсутствие таких требований при наличии других комплаенс‑блоков;
      * "unclear" — если по фрагментам нельзя сделать уверенный вывод.

    Шаг 2 — AML‑МОНИТОРИНГ И СООБЩЕНИЯ
    (используется для "has_aml_monitoring_and_reporting"):

    - Определи, предусмотрены ли:
      * обязанности мониторить операции клиентов на предмет подозрительных транзакций
        и необычной активности;
      * обязанности по сообщению (reporting obligations) в уполномоченные органы
        или контрагенту о suspicious / unusual transactions.
    - Установи значение "has_aml_monitoring_and_reporting": "yes" / "no" / "unclear".

    Шаг 3 — РАСКРЫТИЕ БЕНЕФИЦИАРОВ
    (используется для "requires_beneficial_owner_disclosure"):

    - Проверь, есть ли прямые требования:
      * раскрывать и/или подтверждать beneficial owner / бенефициарных владельцев
        и контролирующих лиц;
      * обновлять информацию при изменении бенефициаров.
    - Сделай вывод: "yes" / "no" / "unclear" для поля
      "requires_beneficial_owner_disclosure".

    Шаг 4 — ПОСЛЕДСТВИЯ НАРУШЕНИЙ AML/KYC
    (используется для "aml_kyc_breach_consequences"):

    - Определи, какие меры предусмотрены в случае невыполнения AML/KYC‑обязательств,
      отказа предоставить документы или наличия подозрений в отмывании:
      * приостановление операций / блокировка транзакций — "suspension";
      * отказ в обслуживании или расторжение договора — "termination";
      * сочетание нескольких видов мер (например, приостановка + последующее
        расторжение) — "mixed";
      * отсутствие специальных последствий — "none";
      * если по тексту неясно — "unclear".
    - Установи соответствующее значение для "aml_kyc_breach_consequences".

    Шаг 5 — ОБЩИЙ УРОВЕНЬ РИСКА ДЛЯ TARGET
    (используется для "overall_risk_level" и "reason"):

    - Оцени общий риск для Target, учитывая:
      * полноту и детальность KYC‑обязательств;
      * наличие или отсутствие AML‑мониторинга и обязанностей по сообщениям;
      * требования по раскрытию бенефициаров;
      * жёсткость последствий за нарушения (особенно одностороннее право
        приостановки или немедленного расторжения при "подозрениях").
    - Сформулируй общий уровень риска как "low" / "medium" / "high".
    - В "reason" кратко обоснуй вывод, ссылаясь на ключевые формулировки
      (желательно с короткими цитатами), и поясни, как структура AML/KYC‑обязательств
      и санкций за их нарушение влияет на регуляторный и операционный риск Target.
    </instructions>

    <edge_cases>
    Обрабатывай пограничные ситуации так:

    - В договоре только общая фраза "Стороны соблюдают применимое AML/KYC законодательство"
      без конкретики по KYC, бенефициарам и последствиям:
      по основным флагам ("has_kyc_obligations", "has_aml_monitoring_and_reporting",
      "requires_beneficial_owner_disclosure", "aml_kyc_breach_consequences")
      допустимо использовать "unclear" с пояснением, что детализация отсутствует.

    - AML/KYC‑блок очень жёсткий в пользу банка/поставщика услуг
      (широкое право одностороннего приостановления или расторжения при
      "reasonable suspicion" или отказе предоставить документы):
      учитывай это как фактор повышенного операционного риска для Target,
      особенно если услуги критичны, и отражай это в "overall_risk_level" и reason.

    - Наличие детализированных процедур KYC, явного требования раскрытия
      бенефициаров и прописанных обязанностей по мониторингу и сообщениям
      в соответствии с локальными законами:
      учитывай это как снижение регуляторного риска, но указывай в reason,
      что при нарушении возможны серьёзные последствия (блокировки, штрафы).

    - Текст фрагментарный: упоминается "AML" или "KYC", но неясны обязанности
      и последствия:
      по соответствующим полям используй "unclear" и в reason явно укажи,
      какие элементы недостают для оценки.

    - Пустые или явно нерелевантные фрагменты:
      большинство полей оставь "unclear",
      "overall_risk_level" — "medium" из‑за высокой неопределённости,
      reason — "Недостаточно данных для анализа AML/KYC-обязательств и последствий их нарушения."
    </edge_cases>

    <output_expectations>
    На основе твоего анализа отдельный механизм извлечения сформирует
    структурированные поля по заранее заданной схеме. Твоя задача —
    давать чёткие юридические выводы и указывать конкретные формулировки
    из текста, на которых они основаны.
    </output_expectations>
  prompt_file: null
  context_k: 4
  temperature: 0.0
  max_tokens: 512

evidence:
  required: false
  min_snippet_length: 20
  max_snippet_length: 500

retrieval:
  context_k: 4
  max_chunks: 8
  boost_keywords:
    - "AML"
    - "KYC"
    - "beneficial owner"
    - "подозрительные транзакции"
  rerank: true
  filters: {}

conditional: null

extraction:
  enabled: true
  mode: "hybrid"
  fields:
    - name: "has_kyc_obligations"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "has_aml_monitoring_and_reporting"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "requires_beneficial_owner_disclosure"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "aml_kyc_breach_consequences"
      type: "string"
      allowed_values:
        - "none"
        - "suspension"
        - "termination"
        - "mixed"
        - "unclear"

    - name: "overall_risk_level"
      type: "string"
      allowed_values:
        - "low"
        - "medium"
        - "high"

    - name: "reason"
      type: "string"

  store_payload: true

red_flags:
  items:
    - code: "AML1"
      description: "Отсутствие AML/KYC-положений при явно высокорискованной структуре/юрисдикции контрагентов."
