id: "rw_financial_and_operational"
name: "Финансовые и операционные заверения (Financials, Liabilities, HR)"
group: "Represents and warrants"
description: >
  Анализирует R&W в отношении достоверности финансовой отчетности,
  отсутствия скрытых обязательств (undisclosed liabilities), статуса
  существенных договоров (material contracts) и трудовых отношений / HR.

  Оценивает риски выявления неучтенных долгов, скрытых дефолтов
  по ключевым контрактам и операционных проблем с персоналом.

  Фундаментальные R&W анализируются чеком rw_fundamental. 
  Специфические R&W (налоги, санкции, суды, IP) анализируются чеком 
  rw_specific_and_survival.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"
ui_mode: "field_extraction"

rules:
  keyword_mode: any

  keywords:
    high:
      - "(?i)financial\\s+statements\\s+[\\s\\S]{0,30}(fairly\\s+present|true\\s+and\\s+fair)"
      - "(?i)финансовая\\s+отчетность\\s+[\\s\\S]{0,40}(достоверно|соответствует)"
      - "(?i)prepared\\s+in\\s+accordance\\s+with\\s+(GAAP|IFRS|МСФО|РСБУ)"
      - "(?i)no\\s+undisclosed\\s+liabilities"
      - "(?i)отсутстви[ея]\\s+неучтенн[а-я]+\\s+обязательств"
      - "(?i)отсутстви[ея]\\s+скрыт[а-я]+\\s+обязательств"
      - "(?i)liabilities\\s+not\\s+reflected\\s+on\\s+the\\s+balance\\s+sheet"
      - "(?i)material\\s+contracts\\s+[\\s\\S]{0,30}(valid|binding|full\\s+force)"
      - "(?i)no\\s+default\\s+[\\s\\S]{0,30}material\\s+contracts"
      - "(?i)существенн[а-я]+\\s+договор[а-я]*\\s+[\\s\\S]{0,30}(действительн|отсутстви[ея]\\s+нарушен)"
      - "(?i)employment\\s+[\\s\\S]{0,30}(represent|warrant|compliance)"
      - "(?i)labor\\s+relations\\s+[\\s\\S]{0,30}(represent|warrant)"
      - "(?i)трудовы[ех]\\s+отношени[яйх]\\s+[\\s\\S]{0,30}(заверени|отсутстви[ея]\\s+спор)"
      - "(?i)no\\s+(strike|labor\\s+dispute|work\\s+stoppage)"

    medium:
      - "(?i)balance\\s+sheet"
      - "(?i)income\\s+statement"
      - "(?i)бухгалтерск[а-я]+\\s+отчетность"
      - "(?i)ordinary\\s+course\\s+of\\s+business"
      - "(?i)contingent\\s+liabilities"
      - "(?i)условн[а-я]+\\s+обязательств[а-я]*"
      - "(?i)material\\s+agreements"
      - "(?i)major\\s+contracts"
      - "(?i)основн[а-я]+\\s+договор"
      - "(?i)employee\\s+benefits"
      - "(?i)collective\\s+bargaining\\s+agreement"
      - "(?i)коллективн[а-я]+\\s+договор"
      - "(?i)задолженност[ьи]\\s+по\\s+заработной\\s+плате"

    low:
      - "(?i)financial\\s+statements"
      - "(?i)liabilities"
      - "(?i)material\\s+contracts"
      - "(?i)employees"
      - "(?i)labor"
      - "(?i)IFRS"
      - "(?i)GAAP"
      - "(?i)МСФО"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 640

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  retrieval_profile: "warranties_check"
  context_k: 5
  max_chunks: 10

  retrieval_query: >
    финансовая отчетность скрытые обязательства существенные договоры трудовые отношения 
    financial statements undisclosed liabilities material contracts employment labor

  boost_keywords:
    - "financial statements"
    - "fairly present"
    - "true and fair view"
    - "no undisclosed liabilities"
    - "отсутствие неучтенных обязательств"
    - "скрытые обязательства"
    - "GAAP"
    - "IFRS"
    - "МСФО"
    - "material contracts"
    - "существенные договоры"
    - "no default"
    - "отсутствие нарушений"
    - "employment"
    - "labor disputes"
    - "трудовые отношения"
    - "коллективный договор"

  negative_keywords:
    - "интеллектуальная собственность"
    - "санкции"
    - "OFAC"
    - "налоги"
    - "tax"

  preferred_unit_types:
    - "general_provision"
    - "obligation"

  excluded_unit_types:
    - "technical_fragment"
    - "appendix_reference"
    - "structural_anchor"

  preferred_clause_functions:
    - "representations"

  position_bias:
    preferred_range: [0.0, 1.0]
    boost: 0.10
    scope: "segment"

  rerank: true
  filters: {}

conditional: null

enrichment_hints:
  preferred_segment_types:
    - "contract"
    - "amendment"
    - "annex"
  excluded_segment_types:
    - "technical_specification"
    - "price_list"
    - "invoice"
    - "act"
    - "schedule"
  preferred_clause_functions:
    - "representations"
  confidence_bonus_on_match: 0.10
  confidence_penalty_on_excluded_segment: 0.15

extraction:
  enabled: true
  mode: "hybrid"
  llm_max_tokens: 1000

  presence_signal:
    field: "rw_fin_ops_status"
    present_values: ["present"]
    missing_values: ["missing"]
    unclear_values: ["unclear"]

  llm_prompt_extraction: |
    <role>
    Ты — юрист по M&A и операционным заверениям.
    Твоя задача — точно извлечь из текста наличие и характер
    финансовых и операционных R&W:
    1) есть ли в договоре регулирование по теме финансовых /
       операционных R&W;
    2) если есть — какие заверения установлены:
       - достоверность финансовой отчётности;
       - отсутствие скрытых / неучтённых обязательств;
       - действительность существенных договоров;
       - трудовые отношения / HR.

    КРИТИЧЕСКИ ВАЖНО:
    - Извлекай ТОЛЬКО то, что прямо написано в тексте.
    - НЕ додумывай R&W, которых нет в тексте.
    - НЕ смешивай с фундаментальными R&W (статус, полномочия,
      title, no conflict) и специальными R&W (налоги, санкции, IP).
    - Если раздел о финансовых / операционных R&W в договоре
      отсутствует — rw_fin_ops_status = "missing".
    - Если тексты по теме есть, но вывод сделать нельзя —
      rw_fin_ops_status = "unclear".
    </role>

    <context_rules>
    - Некоторые фрагменты могут быть нерелевантны — игнорируй их.
    - Если фрагменты противоречат друг другу — используй "unclear"
      и объясни в reason.
    - R&W об отсутствии скрытых обязательств: "except for liabilities
      reflected on the balance sheet" — это классическая формулировка
      ограничения, считается "present".
    - Упоминание коллективного договора / CBA без споров — это
      косвенный признак HR R&W, но только если есть заверения
      о соблюдении трудового законодательства.
    - Не путай R&W о financial statements с обычным
      предоставлением отчётности без заверений.
    - Если ни один фрагмент не содержит информации о финансовых /
      операционных R&W (нет упоминаний financial statements /
      undisclosed liabilities / material contracts / employment) —
      rw_fin_ops_status = "missing", location = null.
      Не использовать "unclear" при полном отсутствии релевантных
      фрагментов.
    </context_rules>

    <context>
    Ниже приведены релевантные фрагменты договора:

    {context}
    </context>

    <task>
    Заполни только следующие поля:
    - rw_fin_ops_display
    - rw_fin_ops_status
    - rw_financial_statements
    - rw_undisclosed_liabilities
    - rw_material_contracts
    - rw_employment_hr
    - reason
    </task>

    <location_instructions>
    Для каждого поля по возможности укажи location в формате:
    {"clause_ref": "п. 12.1", "page": 7, "quote": "дословная фраза из договора"}

    Правила:
    - clause_ref — короткая ссылка на пункт / раздел / статью именно в том
      виде, как она написана в договоре;
    - page — целое число страницы;
    - quote — дословная фраза из текста договора (НЕ пересказ, НЕ парафраз).
      Копируй её посимвольно, сохраняя формулировку и порядок слов.
      Оптимальная длина: 30–300 символов.
    - Для synthesized-поля rw_fin_ops_display и reason
      location ВСЕГДА null.
    - Для rw_fin_ops_status = "missing" — location = null.
    - Для rw_fin_ops_status = "present" / "unclear" — quote
      с наиболее релевантной фразой договора.
    - Для rw_financial_statements, rw_undisclosed_liabilities,
      rw_material_contracts, rw_employment_hr:
      * если "present" — quote с фразой-заверением;
      * если "missing" — различай два случая:
        - договор ПРЯМО фиксирует отсутствие заверения — quote
          ОБЯЗАТЕЛЬНА;
        - просто отсутствует упоминание — location = null;
      * если "unclear" — location = null.
    - Не выдумывай location или quote. Если дословную фразу определить
      нельзя — location = null.
    </location_instructions>

    <instructions>
    Шаг 0 — НАЛИЧИЕ РЕГУЛИРОВАНИЯ ФИНАНСОВЫХ И ОПЕРАЦИОННЫХ R&W

    Заполни "rw_fin_ops_status".

    Значения:
    - "present" — если хотя бы одно содержательное signal-поле
      указывает на наличие информации по теме:
      * rw_financial_statements = "present";
      * rw_undisclosed_liabilities = "present";
      * rw_material_contracts = "present";
      * rw_employment_hr = "present";
      * ЛИБО любое поле = "missing", но с заполненным location
        с прямой цитатой об исключении (см. RF3).
    - "missing" — если все содержательные поля = "missing" БЕЗ цитат,
      ЛИБО фрагментов по теме нет вообще.
    - "unclear" — если все содержательные = "unclear" при наличии
      фрагментов, но невозможности вывода.

    Шаг 1 — ФИНАНСОВАЯ ОТЧЁТНОСТЬ

    Заполни "rw_financial_statements".

    Значения:
    - "present" — есть заверения о том, что финансовая отчётность
      достоверна (fairly presents / true and fair view),
      подготовлена в соответствии с GAAP / IFRS / МСФО / РСБУ.
    - "missing" — отсутствуют.
    - "unclear" — нельзя определить.

    Шаг 2 — СКРЫТЫЕ ОБЯЗАТЕЛЬСТВА

    Заполни "rw_undisclosed_liabilities".

    Значения:
    - "present" — есть заверения об отсутствии обязательств,
      кроме тех, что раскрыты в балансе или возникли в ходе
      обычной хозяйственной деятельности.
    - "missing" — отсутствуют.
    - "unclear" — нельзя определить.

    Шаг 3 — СУЩЕСТВЕННЫЕ ДОГОВОРЫ

    Заполни "rw_material_contracts".

    Значения:
    - "present" — есть заверения, что все существенные договоры
      действительны, и нет дефолтов / нарушений.
    - "missing" — отсутствуют.
    - "unclear" — нельзя определить.

    Шаг 4 — ТРУДОВЫЕ ОТНОШЕНИЯ / HR

    Заполни "rw_employment_hr".

    Значения:
    - "present" — есть заверения об отсутствии трудовых споров,
      забастовок, долгов по зарплате, соблюдении ТК
      и норм охраны труда.
    - "missing" — отсутствуют.
    - "unclear" — нельзя определить.

    Шаг 5 — НОРМАЛИЗОВАННЫЙ DISPLAY ДЛЯ DD GRID

    Заполни "rw_fin_ops_display".

    Это итоговое поле для таблицы.
    Строй его ТОЛЬКО на основе уже заполненных полей выше.
    Не добавляй информацию сверх них.

    Правила:
    - Если rw_fin_ops_status = "missing":
      "Финансовые и операционные R&W не выявлены"
    - Если все поля unclear:
      "Не удалось определить финансовые и операционные R&W"
    - Если все 4 = "present":
      "Покрытие полное: отчётность, обязательства, контракты, HR"
    - Если есть хотя бы одно "present":
      * перечисли только "present" через "; ":
        "Присутствуют: {список present}"
      * список: "Отчётность", "Скрытые обязательства",
        "Существенные договоры", "Трудовые отношения"
    - Если все = "missing" (без present) и без unclear:
      "Финансовые и операционные R&W не выявлены"

    Шаг 6 — КРАТКОЕ ОБОСНОВАНИЕ

    Заполни "reason".

    Правила:
    - Первое предложение — краткий вывод.
    - Второе — короткая цитата из текста (до 100 символов).
    - Пиши по-русски.
    </instructions>

    <edge_cases>
    - "Except for liabilities reflected on the balance sheet":
      * rw_fin_ops_status = "present"
      * rw_undisclosed_liabilities = "present"

    - Упоминание CBA без заверений об отсутствии споров:
      * rw_fin_ops_status = "present"
      * rw_employment_hr = "unclear"

    - Только GAAP/IFRS ссылка без R&W-формулы:
      * rw_fin_ops_status = "present"
      * rw_financial_statements = "unclear"

    - Полное покрытие:
      * rw_fin_ops_status = "present"
      * rw_financial_statements = "present"
      * rw_undisclosed_liabilities = "present"
      * rw_material_contracts = "present"
      * rw_employment_hr = "present"

    - Договор прямо фиксирует отсутствие финансовых R&W:
      * rw_fin_ops_status = "present"
      * rw_financial_statements = "missing"
      * location с прямой цитатой об отсутствии.

    - Нет релевантных фрагментов / раздел о финансовых
      и операционных R&W в договоре отсутствует:
      * rw_fin_ops_status = "missing"
      * rw_financial_statements = "missing"
      * rw_undisclosed_liabilities = "missing"
      * rw_material_contracts = "missing"
      * rw_employment_hr = "missing"
      * rw_fin_ops_display =
        "Финансовые и операционные R&W не выявлены"
      * location у всех полей = null.

    - Формулировки есть, но вывод невозможен:
      * rw_fin_ops_status = "unclear"
      * соответствующие поля = "unclear"
    </edge_cases>

    <output_expectations>
    - Верни результат строго в формате JSON.
    - Не оборачивай в markdown-блоки (без ```).
    - Не добавляй комментариев вне JSON.
    - Все значения полей с allowed_values — на английском.
    - Свободные текстовые поля (rw_fin_ops_display, reason) —
      на русском языке.
    - Не добавляй полей, кроме указанных.
    - Для каждого поля возвращай объект с ключами
      "value", "confidence", "location".

    Пример структуры ответа:
    {
      "rw_fin_ops_display": {"value": "Покрытие полное: отчётность, обязательства, контракты, HR", "confidence": 0.92, "location": null},
      "rw_fin_ops_status": {"value": "present", "confidence": 0.95, "location": {"clause_ref": "п. 4.1", "page": 3, "quote": "The Company represents and warrants that the Financial Statements fairly present the financial condition of the Company"}},
      "rw_financial_statements": {"value": "present", "confidence": 0.95, "location": {"clause_ref": "п. 4.1", "page": 3, "quote": "the Financial Statements fairly present the financial condition of the Company"}},
      "rw_undisclosed_liabilities": {"value": "present", "confidence": 0.90, "location": {"clause_ref": "п. 4.3", "page": 3, "quote": "no undisclosed liabilities except as reflected on the Balance Sheet"}},
      "rw_material_contracts": {"value": "present", "confidence": 0.90, "location": {"clause_ref": "п. 4.5", "page": 4, "quote": "each Material Contract is valid and binding and in full force and effect"}},
      "rw_employment_hr": {"value": "present", "confidence": 0.85, "location": {"clause_ref": "п. 4.7", "page": 4, "quote": "no labor disputes, strikes or work stoppages"}},
      "reason": {"value": "...", "confidence": 0.90, "location": null}
    }
    </output_expectations>

  fields:
    - name: "rw_fin_ops_display"
      type: "string"
      presentation: "fact"
      label: "Финансовые и операционные R&W"
      description: "Нормализованный user-facing вывод для DD Grid"
      display_in_grid: true
      display_priority: 1

    - name: "rw_fin_ops_status"
      type: "string"
      presentation: "signal"
      risk_weight: "info"
      description: "Наличие регулирования финансовых и операционных R&W в договоре"
      display_in_grid: false
      allowed_values:
        - "present"
        - "missing"
        - "unclear"

    - name: "rw_financial_statements"
      type: "string"
      presentation: "signal"
      risk_weight: "high"
      description: "R&W о достоверности финансовой отчётности"
      allowed_values:
        - "present"
        - "missing"
        - "unclear"
      display_in_grid: false

    - name: "rw_undisclosed_liabilities"
      type: "string"
      presentation: "signal"
      risk_weight: "high"
      description: "R&W об отсутствии скрытых обязательств"
      allowed_values:
        - "present"
        - "missing"
        - "unclear"
      display_in_grid: false

    - name: "rw_material_contracts"
      type: "string"
      presentation: "signal"
      risk_weight: "high"
      description: "R&W по существенным договорам"
      allowed_values:
        - "present"
        - "missing"
        - "unclear"
      display_in_grid: false

    - name: "rw_employment_hr"
      type: "string"
      presentation: "signal"
      risk_weight: "high"
      description: "R&W по трудовым отношениям"
      allowed_values:
        - "present"
        - "missing"
        - "unclear"
      display_in_grid: false

    - name: "reason"
      type: "string"
      presentation: "diagnostic"
      description: "Обоснование"
      display_in_grid: false

  store_payload: true


  