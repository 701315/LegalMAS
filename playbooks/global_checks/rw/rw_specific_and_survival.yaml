id: "rw_specific_and_survival"
name: "Специальные R&W и срок их действия"
description: >
  Анализирует специальные R&W по ключевым зонам риска (налоги, санкции,
  судебные споры, комплаенс, IP, обременения), наличие и влияние
  knowledge qualifiers, а также структуру и длину сроков действия
  (survival) R&W. Оценивает полноту покрытия рисков и адекватность
  survival periods.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"

rules:
  keyword_mode: any

  keywords:
    high:
      # R&W формулировки
      - "(?i)represents?\\s+and\\s+warrants?"
      - "(?i)заверя[ею]т\\s+и\\s+гарантиру[ею]т"
      - "(?i)representations?\\s+and\\s+warranties"
      - "(?i)заверени[яи]\\s+и\\s+гарантии"

      # Survival
      - "(?i)survival\\s+(period|of)"
      - "(?i)shall\\s+survive\\s+(for|until|the\\s+closing)"
      - "(?i)срок\\s+действи[яи]\\s+(заверени|гарантий)"
      - "(?i)действу[ею]т\\s+в\\s+течени[ие]"
      - "(?i)\\d+\\s+(months?|years?)\\s+(after|from|following)\\s+(closing|completion)"
      - "(?i)\\d+\\s+(месяц|год|лет)\\s+(после|с\\s+момента)\\s+(закрытия|завершения)"

      # Налоговые R&W
      - "(?i)tax(es)?\\s+[\\s\\S]{0,40}(represent|warrant|заверя|гарантир)"
      - "(?i)(represent|warrant)[\\s\\S]{0,40}tax(es)?"
      - "(?i)налог[а-я]*\\s+[\\s\\S]{0,40}(заверени|гарантии)"
      - "(?i)no\\s+(material\\s+)?tax\\s+(liability|deficiency|claim)"
      - "(?i)отсутстви[ея]\\s+налогов[а-я]*\\s+(задолженност|претензи|спор)"

      # Санкционные R&W
      - "(?i)sanctions?\\s+[\\s\\S]{0,40}(represent|warrant|compliance)"
      - "(?i)(represent|warrant)[\\s\\S]{0,40}sanctions?"
      - "(?i)санкци[а-яё]*\\s+[\\s\\S]{0,40}(заверени|соответстви|соблюдени)"
      - "(?i)not\\s+(a\\s+)?sanctioned\\s+(person|party|entity)"
      - "(?i)OFAC"
      - "(?i)SDN\\s+list"

      # Споры/litigation R&W
      - "(?i)litigation\\s+[\\s\\S]{0,40}(represent|warrant)"
      - "(?i)no\\s+(material\\s+)?(pending|threatened)\\s+(litigation|lawsuit|claim|proceeding)"
      - "(?i)отсутстви[ея]\\s+[\\s\\S]{0,40}(судебн|спор|иск|разбирательств)"
      - "(?i)(судебн|спор|иск)[а-я]*\\s+[\\s\\S]{0,40}(заверени|гарантии)"

    medium:
      # Knowledge qualifiers
      - "(?i)to\\s+the\\s+(best\\s+of\\s+)?(its?|seller'?s?|target'?s?)\\s+knowledge"
      - "(?i)по\\s+(наилучшему\\s+)?сведени[яиям]"
      - "(?i)насколько\\s+известно"
      - "(?i)so\\s+far\\s+as\\s+[\\s\\S]{0,20}(aware|known)"
      - "(?i)to\\s+[\\s\\S]{0,20}knowledge"

      # Комплаенс R&W
      - "(?i)compliance\\s+[\\s\\S]{0,40}(represent|warrant)"
      - "(?i)anti[-\\s]?corruption\\s+[\\s\\S]{0,40}(represent|warrant|compliance)"
      - "(?i)AML\\s+[\\s\\S]{0,40}(represent|warrant|compliance)"
      - "(?i)антикорруп[а-яё]*\\s+[\\s\\S]{0,40}(заверени|соответстви)"
      - "(?i)комплаенс[а-я]*\\s+[\\s\\S]{0,40}(заверени|гарантии)"

      # IP R&W
      - "(?i)intellectual\\s+property\\s+[\\s\\S]{0,40}(represent|warrant|own)"
      - "(?i)\\bIP\\b\\s+[\\s\\S]{0,40}(represent|warrant|own)"
      - "(?i)интеллектуальн[а-я]+\\s+собственност[ьи]\\s+[\\s\\S]{0,40}(заверени|принадлеж)"
      - "(?i)patent|trademark|copyright"
      - "(?i)патент|товарн[а-я]+\\s+знак|авторск"

      # Обременения R&W
      - "(?i)encumbrance[s]?\\s+[\\s\\S]{0,40}(represent|warrant|free)"
      - "(?i)lien[s]?\\s+[\\s\\S]{0,40}(represent|warrant|free)"
      - "(?i)обременени[яие]\\s+[\\s\\S]{0,40}(заверени|отсутстви|свободн)"
      - "(?i)залог[а-я]*\\s+[\\s\\S]{0,40}(заверени|отсутстви)"

      # Общие специальные R&W категории
      - "(?i)tax(es)?\\b"
      - "(?i)налог"
      - "(?i)sanctions?"
      - "(?i)санкци"
      - "(?i)litigation"
      - "(?i)судебн[а-яые]+\\s+спор"
      - "(?i)compliance"
      - "(?i)комплаенс"

    low:
      # Общие R&W термины
      - "(?i)represents?"
      - "(?i)warrants?"
      - "(?i)заверя"
      - "(?i)гарантир"

      # Общие сроки
      - "(?i)survival"
      - "(?i)срок\\s+действи"
      - "(?i)период"
      - "(?i)months?"
      - "(?i)years?"
      - "(?i)месяц"
      - "(?i)год"

      # Общие ссылки на области
      - "(?i)intellectual\\s+property"
      - "(?i)encumbrance"
      - "(?i)lien"
      - "(?i)обременени"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 700

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 700

retrieval:
  context_k: 5
  max_chunks: 10
  boost_keywords:
    - "represents and warrants"
    - "заверяет и гарантирует"
    - "survival"
    - "shall survive"
    - "срок действия заверений"
    - "tax"
    - "налог"
    - "sanctions"
    - "санкции"
    - "OFAC"
    - "litigation"
    - "судебные споры"
    - "no pending litigation"
    - "compliance"
    - "комплаенс"
    - "anti-corruption"
    - "intellectual property"
    - "IP"
    - "encumbrance"
    - "обременение"
    - "lien"
    - "to the best of knowledge"
    - "по сведениям"
    - "12 months"
    - "24 months"
    - "18 months"
  rerank: true
  filters: {}

conditional: null

extraction:
  llm_prompt_extraction: |
    <role>
    Ты — юрист по M&A.
    Твоя специализация — структура специальных заверений и гарантий
    (Specific R&W) и сроки их действия (Survival) в сделках
    купли-продажи бизнеса. Специальные R&W покрывают конкретные
    зоны риска: налоги, санкции, судебные споры, комплаенс, IP,
    обременения.
    </role>

    <context>
    Ниже приведены фрагменты договора с заверениями и гарантиями (R&W)
    и возможными положениями о сроках их действия (Survival):

    {context}
    </context>

    <instructions>
    Проведи анализ по шагам. Каждый шаг логически соответствует одному
    или нескольким полям итоговой оценки риска.

    Шаг 1 — НАЛОГОВЫЕ R&W
    (используется для заполнения поля "rw_tax"):
    - Определи, есть ли специальные заверения по налогам:
      * уплата всех налогов в срок;
      * отсутствие существенных доначислений, налоговых претензий,
        споров, штрафов, расследований;
      * отсутствие нераскрытых налоговых обязательств;
      * своевременная подача налоговых деклараций.
    - Обрати внимание на knowledge qualifiers:
      * если налоговые R&W завешены "to the best of knowledge" —
        это существенное ослабление.
    - Классифицируй: present / missing / unclear.

    Шаг 2 — САНКЦИОННЫЕ R&W
    (используется для заполнения поля "rw_sanctions"):
    - Определи, есть ли специальные заверения по санкциям:
      * отсутствие нарушений санкционного законодательства
        (OFAC, EU sanctions, UK sanctions, российские санкции);
      * статус не-санкционного лица (не включён в SDN list,
        EU consolidated list и т.п.);
      * неприменимость ограничительных мер к Target/группе;
      * отсутствие операций с санкционными лицами/юрисдикциями.
    - Классифицируй: present / missing / unclear.

    Шаг 3 — R&W ПО СУДЕБНЫМ СПОРАМ И РАССЛЕДОВАНИЯМ
    (используется для заполнения поля "rw_litigation"):
    - Определи, есть ли специальные заверения:
      * отсутствие существенных pending или threatened
        судебных споров, арбитражей;
      * отсутствие административных и уголовных дел;
      * отсутствие расследований регуляторов;
      * раскрытие существующих споров в Disclosure Schedule.
    - Классифицируй: present / missing / unclear.

    Шаг 4 — КОМПЛАЕНС R&W
    (используется для заполнения поля "rw_compliance"):
    - Определи, есть ли специальные заверения:
      * соблюдение антикоррупционного законодательства
        (FCPA, UK Bribery Act, ФЗ-273);
      * соблюдение AML-законодательства;
      * соблюдение отраслевого регуляторного комплаенса;
      * отсутствие существенных нарушений внутренних политик.
    - Классифицируй: present / missing / unclear.

    Шаг 5 — IP И ОБРЕМЕНЕНИЯ R&W
    (используется для заполнения поля "rw_ip_encumbrances"):
    - Определи, есть ли специальные заверения:
      * принадлежность ключевых прав IP Target
        (патенты, товарные знаки, авторские права);
      * наличие необходимых лицензий на IP;
      * отсутствие нарушений IP третьих лиц;
      * отсутствие нераскрытых обременений, залогов, liens
        на активы и IP.
    - Классифицируй: present / missing / unclear.

    Шаг 6 — ИСПОЛЬЗОВАНИЕ KNOWLEDGE QUALIFIERS
    (используется для заполнения поля "knowledge_qualifiers_scope"):
    - Определи, используются ли knowledge qualifiers:
      * "to the best of Seller's knowledge";
      * "so far as Seller is aware";
      * "по сведениям Продавца", "насколько известно".
    - Оцени масштаб применения:
      * "none" — knowledge qualifiers не используются;
      * "yes" — применяются к большинству специальных R&W,
        включая налоги, санкции, комплаенс, что существенно
        ослабляет защиту;
      * "unclear" — невозможно определить.

    Шаг 7 — RED FLAGS
    (используется для заполнения поля "red_flags"):
    - Оцени наличие следующих рисковых факторов:

      * «RW4» — Отсутствуют специальные R&W по критичным зонам
        риска. Признаки:
        - rw_tax = "missing";
        - и/или rw_sanctions = "missing";
        - и/или rw_litigation = "missing";
        - отсутствие R&W по этим зонам создаёт существенный
          непокрытый риск.

      * «RW5» — Очень короткие survival-сроки по критичным R&W.
        Признаки:
        - survival_general_months < 18 (или < 12 для
          высокорисковых сделок);
        - нет дифференцированных более длинных сроков для
          налогов, санкций, комплаенса;
        - короткий срок не позволит выявить скрытые проблемы.

      * «RW6» — Специальные R&W чрезмерно ослаблены knowledge
        qualifiers. Признаки:
        - knowledge_qualifiers_scope = "extensive";
        - knowledge qualifiers применяются к налоговым,
          санкционным, комплаенс R&W;
        - продавец может уйти от ответственности, заявив
          "не знал".

    - Если специальные R&W по критичным зонам присутствуют
      (present или qualified с limited qualifiers),
      survival-сроки разумные и дифференцированные —
      верни "NONE".
    - Если данных недостаточно для оценки или текст противоречив —
      верни "UNCLEAR".
    - Формат: один или несколько кодов через запятую
      ("RW4", "RW5", "RW4, RW5, RW6"), "NONE" или "UNCLEAR".
      Без комментариев в этом поле — всё объясняющее в reason.

    Шаг 8 — ОБОСНОВАНИЕ
    (используется для заполнения поля "reason"):

    - В "reason" кратко обоснуй вывод:
      * перечисли, какие специальные R&W покрыты/не покрыты;
      * опиши масштаб knowledge qualifiers;
      * опиши структуру survival;
      * ссылайся на ключевые формулировки (по возможности
        с короткими цитатами);
      * если выставлены red_flags — объясни, почему именно
        эти коды.
    </instructions>

    <edge_cases>
    Обрабатывай пограничные ситуации так:

    - Специальные R&W по налогам, санкциям, комплаенсу формально
      широкие, но почти все завешены knowledge qualifiers:
      соответствующие поля = "qualified";
      knowledge_qualifiers_scope = "extensive";
      ставь RW6; overall_risk_level = "medium" или "high".

    - По критичным областям (налоги, санкции, существенные споры)
      нет специальных R&W:
      соответствующие поля = "missing";
      ставь RW4; overall_risk_level = "high".

    - Survival по большинству R&W очень короткий (6–12 месяцев),
      без дифференциации для налогов и санкций:
      survival_general_months = 6/12;
      ставь RW5; overall_risk_level = "high".

    - Дифференцированные survival-сроки: налоги 4 года,
      санкции/антикоррупция unlimited, прочие 18 месяцев:
      survival_structure отражает это;
      это снижает риск; не ставь RW5.

    - Knowledge qualifiers применяются только к IP infringement
      by third parties и hidden claims (объективно оправдано):
      knowledge_qualifiers_scope = "limited";
      это стандартно; не ставь RW6.

    - Survival = "until the statute of limitations expires":
      интерпретируй как длинный срок (зависит от юрисдикции);
      укажи в survival_structure.

    - Текст фрагментарный: видно упоминание отдельных R&W,
      но нет полной картины:
      по недостающим блокам = "unclear";
      red_flags = "UNCLEAR";
      overall_risk_level = "medium".

    - Пустые или явно нерелевантные фрагменты:
      все поля = "unclear";
      red_flags = "UNCLEAR";
      overall_risk_level = "medium";
      reason = "Недостаточно данных для анализа специальных R&W
      и сроков их действия."
    </edge_cases>

    <output_expectations>
    На основе твоего анализа отдельный механизм извлечения сформирует
    структурированные поля по заранее заданной схеме. Твоя задача —
    давать чёткие юридические выводы и указывать конкретные формулировки
    из текста, на которых они основаны. Не генерируй JSON —
    просто излагай выводы структурированно и однозначно.
    </output_expectations>

  enabled: true
  mode: "hybrid"
  fields:
    - name: "rw_tax"
      type: "string"
      allowed_values:
        - "present"
        - "missing"
        - "unclear"

    - name: "rw_sanctions"
      type: "string"
      allowed_values:
        - "present"
        - "missing"
        - "unclear"

    - name: "rw_litigation"
      type: "string"
      allowed_values:
        - "present"
        - "missing"
        - "unclear"

    - name: "rw_compliance"
      type: "string"
      allowed_values:
        - "present"
        - "missing"
        - "unclear"

    - name: "rw_ip_encumbrances"
      type: "string"
      allowed_values:
        - "present"
        - "missing"
        - "unclear"

    - name: "knowledge_qualifiers_scope"
      type: "string"
      allowed_values:
        - "none"
        - "yes"
        - "unclear"

    - name: "red_flags"
      type: "string"

    - name: "reason"
      type: "string"

  store_payload: true

red_flags:
  items:
    - code: "RW4"
      description: "Отсутствуют специальные R&W по критичным зонам риска."
    - code: "RW5"
      description: "Очень короткие survival-сроки по критичным R&W."
    - code: "RW6"
      description: "Специальные R&W чрезмерно ослаблены knowledge qualifiers."