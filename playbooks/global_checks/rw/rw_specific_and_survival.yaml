id: "rw_specific_and_survival"
name: "Специальные R&W и срок их действия"
description: >
  Анализирует специальные R&W по ключевым зонам риска (налоги,
  санкции, судебные споры, комплаенс / AML / антикоррупция, IP,
  обременения), наличие и масштаб knowledge qualifiers, а также
  структуру и длину сроков действия (survival) R&W.

  Оценивает полноту покрытия рисков и адекватность survival periods.

  Фундаментальные R&W (статус, полномочия, title, no conflict,
  general compliance) анализируются чеком rw_fundamental.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"
ui_mode: "field_extraction"

rules:
  keyword_mode: any

  keywords:
    high:
      # R&W формулировки
      - "(?i)represents?\\s+and\\s+warrants?"
      - "(?i)заверя[ею]т\\s+и\\s+гарантиру[ею]т"
      - "(?i)representations?\\s+and\\s+warranties"
      - "(?i)заверени[яи]\\s+и\\s+гарантии"

      # Survival
      - "(?i)survival\\s+(period|of)"
      - "(?i)shall\\s+survive\\s+(for|until|the\\s+closing)"
      - "(?i)срок\\s+действи[яи]\\s+(заверени|гарантий)"
      - "(?i)\\d+\\s+(months?|years?)\\s+(after|from|following)\\s+(closing|completion)"
      - "(?i)\\d+\\s+(месяц|год|лет)\\s+(после|с\\s+момента)\\s+(закрытия|завершения)"
      - "(?i)unlimited\\s+survival"
      - "(?i)indefinite\\s+survival"
      - "(?i)survive\\s+indefinitely"
      - "(?i)бессрочн[а-я]+\\s+действи[ея]\\s+заверени"

      # Налоговые R&W
      - "(?i)tax(es)?[\\s\\S]{0,40}(represent|warrant|заверя|гарантир)"
      - "(?i)no\\s+(material\\s+)?tax\\s+(liability|deficiency|claim)"
      - "(?i)отсутстви[ея]\\s+налогов[а-я]*\\s+(задолженност|претензи|спор)"
      - "(?i)all\\s+taxes\\s+(have\\s+been\\s+)?paid"
      - "(?i)все\\s+налог[а-яи]\\s+(уплачен|перечислен)"

      # Санкционные R&W
      - "(?i)sanctions?[\\s\\S]{0,40}(represent|warrant|compliance)"
      - "(?i)not\\s+(a\\s+)?sanctioned\\s+(person|party|entity)"
      - "(?i)\\bOFAC\\b"
      - "(?i)\\bSDN\\b"
      - "(?i)санкци[а-яё]*[\\s\\S]{0,40}(заверени|соответстви)"

      # Litigation R&W
      - "(?i)no\\s+(material\\s+)?(pending|threatened)\\s+(litigation|lawsuit|claim|proceeding)"
      - "(?i)отсутстви[ея][\\s\\S]{0,40}(судебн|спор|иск|разбирательств)"

    medium:
      # Knowledge qualifiers
      - "(?i)to\\s+the\\s+(best\\s+of\\s+)?(its?|seller'?s?)\\s+knowledge"
      - "(?i)по\\s+(наилучшему\\s+)?сведени[яиям]"
      - "(?i)насколько\\s+известно"
      - "(?i)so\\s+far\\s+as\\s+[\\s\\S]{0,20}(aware|known)"

      # Комплаенс / AML / антикоррупция R&W
      - "(?i)anti[-\\s]?corruption[\\s\\S]{0,40}(represent|warrant|compliance)"
      - "(?i)\\bAML\\b[\\s\\S]{0,40}(represent|warrant)"
      - "(?i)антикорруп[а-яё]*[\\s\\S]{0,40}(заверени|соответстви)"
      - "(?i)FCPA[\\s\\S]{0,20}(comply|represent|warrant)"
      - "(?i)UK\\s+Bribery\\s+Act[\\s\\S]{0,20}(comply|represent)"

      # IP R&W
      - "(?i)intellectual\\s+property[\\s\\S]{0,40}(represent|warrant|own)"
      - "(?i)patent[\\s\\S]{0,20}(represent|warrant)"
      - "(?i)trademark[\\s\\S]{0,20}(represent|warrant)"
      - "(?i)интеллектуальн[а-я]+\\s+собственност[ьи][\\s\\S]{0,40}(заверени|принадлеж)"

      # Обременения R&W
      - "(?i)encumbrance[s]?[\\s\\S]{0,40}(represent|warrant|free)"
      - "(?i)lien[s]?[\\s\\S]{0,40}(represent|warrant|free)"
      - "(?i)обременени[яие][\\s\\S]{0,40}(заверени|отсутстви|свободн)"

    low:
      - "(?i)survival\\s+period"
      - "(?i)shall\\s+survive"
      - "(?i)срок\\s+действи[яи]\\s+заверени"
      - "(?i)no\\s+(material\\s+)?tax\\s+(liability|claim)"
      - "(?i)not\\s+a\\s+sanctioned\\s+(person|entity)"
      - "(?i)no\\s+pending\\s+litigation"
      - "(?i)anti[-\\s]?corruption[\\s\\S]{0,20}represent"
      - "(?i)OFAC"
      - "(?i)knowledge[\\s\\S]{0,10}qualifier"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 700

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 700

retrieval:
  context_k: 5
  max_chunks: 10
  boost_keywords:
    - "represents and warrants"
    - "заверяет и гарантирует"
    - "survival"
    - "shall survive"
    - "срок действия заверений"
    - "tax"
    - "налог"
    - "no material tax liability"
    - "all taxes have been paid"
    - "sanctions"
    - "санкции"
    - "OFAC"
    - "SDN"
    - "no pending litigation"
    - "litigation"
    - "судебные споры"
    - "compliance"
    - "anti-corruption"
    - "AML"
    - "FCPA"
    - "intellectual property"
    - "IP"
    - "encumbrance"
    - "обременение"
    - "lien"
    - "to the best of knowledge"
    - "по сведениям"
    - "18 months"
    - "24 months"
    - "unlimited survival"
    - "indefinite survival"
  rerank: true
  filters: {}

conditional: null

enrichment_hints:
  preferred_segment_types:
    - "contract"
    - "amendment"
    - "annex"
  excluded_segment_types:
    - "technical_specification"
    - "price_list"
    - "invoice"
    - "act"
    - "schedule"
  preferred_clause_functions:
    - "representations_warranties"
    - "liability"
    - "intellectual_property"
  confidence_bonus_on_match: 0.10
  confidence_penalty_on_excluded_segment: 0.15

extraction:
  enabled: true
  mode: "hybrid"
  llm_max_tokens: 480
  llm_prompt_extraction: |
    <role>
    Ты — юрист по M&A.
    Твоя задача — точно извлечь из текста:
    1) наличие специальных R&W по критичным зонам риска;
    2) масштаб knowledge qualifiers;
    3) структуру и сроки действия (survival) R&W.
    </role>

    <context>
    Ниже приведены релевантные фрагменты договора:

    {context}
    </context>

    <task>
    Заполни только следующие поля:
    - rw_specific_display
    - rw_tax
    - rw_sanctions
    - rw_litigation
    - rw_compliance_specific
    - rw_ip_encumbrances
    - knowledge_qualifiers_scope
    - has_survival_period
    - survival_general_value
    - survival_structure_summary
    - red_flags
    - reason

    Важно:
    - не анализируй фундаментальные R&W (статус, полномочия,
      title, no conflict, general compliance) — это задача
      чека rw_fundamental;
    - не придумывай сроки если они не указаны;
    - пиши user-facing значения коротко и по-русски.
    </task>

    <instructions>
    Шаг 1 — НАЛОГОВЫЕ R&W

    Заполни поле "rw_tax".

    Значения:
    - "present" — явные заверения: все налоги уплачены,
      нет существенных налоговых претензий / задолженностей /
      доначислений.
    - "missing" — отсутствуют.
    - "unclear" — неясно.

    Шаг 2 — САНКЦИОННЫЕ R&W

    Заполни поле "rw_sanctions".

    Значения:
    - "present" — есть: не является санкционным лицом (OFAC,
      EU, UK), нет нарушений санкционного законодательства,
      нет операций с санкционными лицами / юрисдикциями.
    - "missing" — отсутствуют.
    - "unclear" — неясно.

    Шаг 3 — R&W ПО СУДЕБНЫМ СПОРАМ

    Заполни поле "rw_litigation".

    Значения:
    - "present" — есть: нет существенных pending / threatened
      споров, арбитражей, административных дел, расследований.
    - "missing" — отсутствуют.
    - "unclear" — неясно.

    Шаг 4 — КОМПЛАЕНС / AML / АНТИКОРРУПЦИЯ R&W

    Заполни поле "rw_compliance_specific".

    Это специальные R&W — не general compliance with law.

    Значения:
    - "present" — есть: соблюдение антикоррупционного
      законодательства (FCPA, UK Bribery Act, ФЗ-273),
      AML-требований, отраслевого регуляторного комплаенса.
    - "missing" — отсутствуют.
    - "unclear" — неясно.

    Шаг 5 — IP И ОБРЕМЕНЕНИЯ R&W

    Заполни поле "rw_ip_encumbrances".

    Значения:
    - "present" — есть: принадлежность ключевых IP,
      наличие лицензий, нет нарушений IP третьих лиц,
      нет нераскрытых обременений / liens.
    - "missing" — отсутствуют.
    - "unclear" — неясно.

    Шаг 6 — KNOWLEDGE QUALIFIERS

    Заполни поле "knowledge_qualifiers_scope".

    Значения:
    - "none" — knowledge qualifiers не используются.
    - "limited" — применяются только к объективно сложным
      категориям (IP infringement by third parties, скрытые
      pretensions) — стандартно и приемлемо.
    - "extensive" — применяются к налоговым, санкционным,
      комплаенс R&W — существенно ослабляет защиту.
    - "unclear" — неясно.

    Шаг 7 — НАЛИЧИЕ SURVIVAL PERIOD

    Заполни поле "has_survival_period".

    Значения:
    - "yes" — сроки действия R&W явно установлены.
    - "no" — не установлены.
    - "unclear" — неясно.

    Шаг 8 — ОБЩИЙ СРОК SURVIVAL

    Заполни поле "survival_general_value".

    Правила:
    - Если общий срок указан: "12 месяцев", "18 месяцев",
      "24 месяца", "2 года"
    - Если бессрочно / unlimited: "Бессрочно"
    - Если не установлен: "Не установлен"
    - Если неясно: "Не удалось определить"

    Шаг 9 — СТРУКТУРА SURVIVAL

    Заполни поле "survival_structure_summary".

    Правила:
    - Кратко опиши дифференцированную структуру через ";":
      * "18 мес. — общий; 4 года — налоги; бессрочно — санкции"
      * "18 мес. для всех R&W без дифференциации"
    - Если нет survival: "Не установлен"
    - Если неясно: "Не удалось определить"

    Шаг 10 — RED FLAGS

    Заполни поле "red_flags".

    Используй:
    - "NONE" — специальные R&W по критичным зонам присутствуют,
      knowledge qualifiers limited или none, survival разумный.
    - "UNCLEAR" — данных недостаточно.
    - Коды через запятую:
      * RW4 — отсутствуют специальные R&W по критичным зонам:
        налоги и/или санкции и/или litigation missing.
      * RW5 — очень короткие survival-сроки (< 18 месяцев общий,
        нет дифференцированных длинных сроков для налогов /
        санкций).
      * RW6 — специальные R&W чрезмерно ослаблены knowledge
        qualifiers (extensive) — особенно на налоги, санкции,
        комплаенс.

    Шаг 11 — USER-FACING SUMMARY

    Заполни поле "rw_specific_display".

    Примеры:
    - "Налоги: да; Санкции: да; Споры: да; Комплаенс: да;
       Survival: 18 мес. общий / 4 года налоги / бессрочно санкции"
    - "Налоги: нет; Санкции: нет; Остальные: да;
       Survival: 12 мес. без дифференциации"
    - "Knowledge qualifiers на санкции и налоги (extensive);
       Survival: 18 мес."
    - "Не удалось определить специальные R&W"

    Правила:
    - Отрази максимум 4 ключевых факта через ";".
    - Если всё unclear:
      "Не удалось определить специальные R&W"

    Шаг 12 — ОБОСНОВАНИЕ

    Заполни поле "reason".

    Правила:
    - 1–2 коротких предложения.
    - Укажи: покрытие по зонам риска, knowledge qualifiers,
      структуру survival, почему red_flags.
    - Приведи короткую цитату в кавычках.
    - Если NONE — почему покрытие достаточное.
    </instructions>

    <edge_cases>
    - Налоговые и санкционные R&W завешены knowledge qualifiers:
      * rw_tax = "present"
      * rw_sanctions = "present"
      * knowledge_qualifiers_scope = "extensive"
      * red_flags включает "RW6"

    - По налогам и санкциям нет R&W:
      * rw_tax = "missing"
      * rw_sanctions = "missing"
      * red_flags включает "RW4"

    - Survival 12 месяцев для всех R&W без дифференциации:
      * survival_general_value = "12 месяцев"
      * survival_structure_summary = "12 мес. для всех R&W"
      * red_flags включает "RW5"

    - Дифференцированные сроки: 18 мес. общий, 4 года налоги,
      бессрочно санкции:
      * survival_general_value = "18 месяцев"
      * survival_structure_summary =
        "18 мес. — общий; 4 года — налоги; бессрочно — санкции"
      * red_flags не включает "RW5"

    - Knowledge qualifiers только на IP infringement by third parties:
      * knowledge_qualifiers_scope = "limited"
      * стандартно, red_flags не включает "RW6"

    - "Until the statute of limitations expires":
      * survival_general_value = "До истечения срока исковой давности"
      * это длинный срок

    - Нет релевантных фрагментов:
      * все поля = "unclear"
      * red_flags = "UNCLEAR"
      * rw_specific_display =
        "Не удалось определить специальные R&W"
    </edge_cases>

    <output_expectations>
    Все значения должны быть короткими, точными и пригодными
    для отображения пользователю в DD Grid.
    Не добавляй никаких полей, кроме указанных в схеме extraction.
    </output_expectations>

  fields:
    - name: "rw_specific_display"
      type: "string"
      description: "Специальные R&W и survival: краткий вывод"

    - name: "rw_tax"
      type: "string"
      description: "Налоговые R&W"
      allowed_values:
        - "present"
        - "missing"
        - "unclear"

    - name: "rw_sanctions"
      type: "string"
      description: "Санкционные R&W"
      allowed_values:
        - "present"
        - "missing"
        - "unclear"

    - name: "rw_litigation"
      type: "string"
      description: "R&W по судебным спорам"
      allowed_values:
        - "present"
        - "missing"
        - "unclear"

    - name: "rw_compliance_specific"
      type: "string"
      description: "R&W по комплаенсу / AML / антикоррупции"
      allowed_values:
        - "present"
        - "missing"
        - "unclear"

    - name: "rw_ip_encumbrances"
      type: "string"
      description: "R&W по IP и обременениям"
      allowed_values:
        - "present"
        - "missing"
        - "unclear"

    - name: "knowledge_qualifiers_scope"
      type: "string"
      description: "Масштаб knowledge qualifiers"
      allowed_values:
        - "none"
        - "limited"
        - "extensive"
        - "unclear"

    - name: "has_survival_period"
      type: "string"
      description: "Наличие survival period"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "survival_general_value"
      type: "string"
      description: "Общий срок survival"

    - name: "survival_structure_summary"
      type: "string"
      description: "Структура дифференцированных survival сроков"

    - name: "red_flags"
      type: "string"
      description: "Коды рисков"

    - name: "reason"
      type: "string"
      description: "Обоснование"

  store_payload: true


  