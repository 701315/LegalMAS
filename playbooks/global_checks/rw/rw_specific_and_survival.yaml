id: "rw_specific_and_survival"
name: "Специальные R&W и срок их действия"
group: "Represents and warrants"
description: >
  Анализирует специальные R&W по ключевым зонам риска (налоги,
  санкции, судебные споры, комплаенс / AML / антикоррупция, IP,
  обременения), наличие и масштаб knowledge qualifiers, а также
  структуру и длину сроков действия (survival) R&W.

  Оценивает полноту покрытия рисков и адекватность survival periods.

  Фундаментальные R&W (статус, полномочия, title, no conflict,
  general compliance) анализируются чеком rw_fundamental.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"
ui_mode: "field_extraction"

rules:
  keyword_mode: any

  keywords:
    high:
      # R&W формулировки
      - "(?i)represents?\\s+and\\s+warrants?"
      - "(?i)заверя[ею]т\\s+и\\s+гарантиру[ею]т"
      - "(?i)representations?\\s+and\\s+warranties"
      - "(?i)заверени[яи]\\s+и\\s+гарантии"

      # Survival
      - "(?i)survival\\s+(period|of)"
      - "(?i)shall\\s+survive\\s+(for|until|the\\s+closing)"
      - "(?i)срок\\s+действи[яи]\\s+(заверени|гарантий)"
      - "(?i)\\d+\\s+(months?|years?)\\s+(after|from|following)\\s+(closing|completion)"
      - "(?i)\\d+\\s+(месяц|год|лет)\\s+(после|с\\s+момента)\\s+(закрытия|завершения)"
      - "(?i)unlimited\\s+survival"
      - "(?i)indefinite\\s+survival"
      - "(?i)survive\\s+indefinitely"
      - "(?i)бессрочн[а-я]+\\s+действи[ея]\\s+заверени"

      # Налоговые R&W
      - "(?i)tax(es)?[\\s\\S]{0,40}(represent|warrant|заверя|гарантир)"
      - "(?i)no\\s+(material\\s+)?tax\\s+(liability|deficiency|claim)"
      - "(?i)отсутстви[ея]\\s+налогов[а-я]*\\s+(задолженност|претензи|спор)"
      - "(?i)all\\s+taxes\\s+(have\\s+been\\s+)?paid"
      - "(?i)все\\s+налог[а-яи]\\s+(уплачен|перечислен)"

      # Санкционные R&W
      - "(?i)sanctions?[\\s\\S]{0,40}(represent|warrant|compliance)"
      - "(?i)not\\s+(a\\s+)?sanctioned\\s+(person|party|entity)"
      - "(?i)\\bOFAC\\b"
      - "(?i)\\bSDN\\b"
      - "(?i)санкци[а-яё]*[\\s\\S]{0,40}(заверени|соответстви)"

      # Litigation R&W
      - "(?i)no\\s+(material\\s+)?(pending|threatened)\\s+(litigation|lawsuit|claim|proceeding)"
      - "(?i)отсутстви[ея][\\s\\S]{0,40}(судебн|спор|иск|разбирательств)"

    medium:
      # Knowledge qualifiers
      - "(?i)to\\s+the\\s+(best\\s+of\\s+)?(its?|seller'?s?)\\s+knowledge"
      - "(?i)по\\s+(наилучшему\\s+)?сведени[яиям]"
      - "(?i)насколько\\s+известно"
      - "(?i)so\\s+far\\s+as\\s+[\\s\\S]{0,20}(aware|known)"

      # Комплаенс / AML / антикоррупция R&W
      - "(?i)anti[-\\s]?corruption[\\s\\S]{0,40}(represent|warrant|compliance)"
      - "(?i)\\bAML\\b[\\s\\S]{0,40}(represent|warrant)"
      - "(?i)антикорруп[а-яё]*[\\s\\S]{0,40}(заверени|соответстви)"
      - "(?i)FCPA[\\s\\S]{0,20}(comply|represent|warrant)"
      - "(?i)UK\\s+Bribery\\s+Act[\\s\\S]{0,20}(comply|represent)"

      # IP R&W
      - "(?i)intellectual\\s+property[\\s\\S]{0,40}(represent|warrant|own)"
      - "(?i)patent[\\s\\S]{0,20}(represent|warrant)"
      - "(?i)trademark[\\s\\S]{0,20}(represent|warrant)"
      - "(?i)интеллектуальн[а-я]+\\s+собственност[ьи][\\s\\S]{0,40}(заверени|принадлеж)"

      # Обременения R&W
      - "(?i)encumbrance[s]?[\\s\\S]{0,40}(represent|warrant|free)"
      - "(?i)lien[s]?[\\s\\S]{0,40}(represent|warrant|free)"
      - "(?i)обременени[яие][\\s\\S]{0,40}(заверени|отсутстви|свободн)"

    low:
      - "(?i)survival\\s+period"
      - "(?i)shall\\s+survive"
      - "(?i)срок\\s+действи[яи]\\s+заверени"
      - "(?i)no\\s+(material\\s+)?tax\\s+(liability|claim)"
      - "(?i)not\\s+a\\s+sanctioned\\s+(person|entity)"
      - "(?i)no\\s+pending\\s+litigation"
      - "(?i)anti[-\\s]?corruption[\\s\\S]{0,20}represent"
      - "(?i)OFAC"
      - "(?i)knowledge[\\s\\S]{0,10}qualifier"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 700

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 700

retrieval:
  retrieval_profile: "warranties_check"
  context_k: 5
  max_chunks: 10

  retrieval_query: >
    специальные заверения и гарантии representations warranties срок действия survival period 
    налоги санкции судебные споры litigation compliance антикоррупция IP обременения

  boost_keywords:
    - "represents and warrants"
    - "заверяет и гарантирует"
    - "survival"
    - "shall survive"
    - "срок действия заверений"
    - "tax"
    - "налог"
    - "no material tax liability"
    - "all taxes have been paid"
    - "sanctions"
    - "санкции"
    - "OFAC"
    - "SDN"
    - "no pending litigation"
    - "litigation"
    - "судебные споры"
    - "compliance"
    - "anti-corruption"
    - "AML"
    - "FCPA"
    - "intellectual property"
    - "IP"
    - "encumbrance"
    - "обременение"
    - "lien"
    - "to the best of knowledge"
    - "по сведениям"
    - "18 months"
    - "24 months"
    - "unlimited survival"
    - "indefinite survival"

  negative_keywords:
    - "форс-мажор"
    - "применимое право"
    - "подсудность"
    - "условия оплаты"

  preferred_unit_types:
    - "general_provision"
    - "obligation"

  excluded_unit_types:
    - "technical_fragment"
    - "appendix_reference"
    - "structural_anchor"

  preferred_clause_functions:
    - "representations"
    - "remedies"

  position_bias:
    preferred_range: [0.0, 1.0]
    boost: 0.10
    scope: "segment"

  rerank: true
  filters: {}

conditional: null

enrichment_hints:
  preferred_segment_types:
    - "contract"
    - "amendment"
    - "annex"
  excluded_segment_types:
    - "technical_specification"
    - "price_list"
    - "invoice"
    - "act"
    - "schedule"
  preferred_clause_functions:
    - "representations"
    - "limitations"
    - "rights"
  confidence_bonus_on_match: 0.10
  confidence_penalty_on_excluded_segment: 0.15

extraction:
  enabled: true
  mode: "hybrid"
  llm_max_tokens: 1250

  llm_prompt_extraction: |
    <role>
    Ты — юрист по M&A и специальным заверениям.
    Твоя задача — точно извлечь из текста:
    1) наличие специальных R&W по критичным зонам риска;
    2) масштаб knowledge qualifiers;
    3) структуру и сроки действия (survival) R&W.

    КРИТИЧЕСКИ ВАЖНО:
    - Извлекай ТОЛЬКО то, что прямо написано в тексте.
    - НЕ додумывай сроки survival, если они не указаны явно.
    - НЕ смешивай специальные R&W с фундаментальными
      (статус, полномочия, title, no conflict, general compliance).
    - Если информация отсутствует — используй "missing" или "unclear".
    </role>

    <context>
    Ниже приведены релевантные фрагменты договора:

    {context}
    </context>

    <context_rules>
    - Некоторые фрагменты могут быть нерелевантны — игнорируй их.
    - Если фрагменты противоречат друг другу — используй "unclear"
      и объясни в reason.
    - Knowledge qualifiers "extensive" = они применяются к
      налоговым, санкционным, compliance R&W — это нестандартно
      и существенно ослабляет защиту.
    - Knowledge qualifiers "limited" = только для объективно
      сложных категорий, например IP infringement by third parties.
    - Survival период: если указан конкретный срок — используй его.
      Если только "shall survive" без срока — has_survival_period = "yes",
      survival_general_value = "Не установлен".
    </context_rules>

    <task>
    Заполни только следующие поля:
    - rw_specific_display
    - rw_tax
    - rw_sanctions
    - rw_litigation
    - rw_compliance_specific
    - rw_ip_encumbrances
    - knowledge_qualifiers_scope
    - has_survival_period
    - survival_general_value
    - survival_structure_summary
    - reason
    </task>

    <instructions>
    Шаг 1 — НАЛОГОВЫЕ R&W

    Заполни "rw_tax".

    Значения:
    - "present" — есть: все налоги уплачены, нет существенных
      налоговых претензий / задолженностей / доначислений.
    - "missing" — отсутствуют.
    - "unclear" — нельзя определить.

    Шаг 2 — САНКЦИОННЫЕ R&W

    Заполни "rw_sanctions".

    Значения:
    - "present" — есть: не является санкционным лицом
      (OFAC, EU, UK и т.п.),
      нет нарушений санкционного законодательства.
    - "missing" — отсутствуют.
    - "unclear" — нельзя определить.

    Шаг 3 — R&W ПО СУДЕБНЫМ СПОРАМ

    Заполни "rw_litigation".

    Значения:
    - "present" — есть: нет существенных pending / threatened
      споров, арбитражей, административных дел.
    - "missing" — отсутствуют.
    - "unclear" — нельзя определить.

    Шаг 4 — КОМПЛАЕНС / AML / АНТИКОРРУПЦИЯ R&W

    Заполни "rw_compliance_specific".

    Это специальные R&W, не general compliance.

    Значения:
    - "present" — есть: соблюдение FCPA, UK Bribery Act,
      ФЗ-273, AML-требований, отраслевого регуляторного комплаенса.
    - "missing" — отсутствуют.
    - "unclear" — нельзя определить.

    Шаг 5 — IP И ОБРЕМЕНЕНИЯ R&W

    Заполни "rw_ip_encumbrances".

    Значения:
    - "present" — есть: принадлежность ключевых IP, нет нарушений
      IP третьих лиц, нет нераскрытых обременений.
    - "missing" — отсутствуют.
    - "unclear" — нельзя определить.

    Шаг 6 — KNOWLEDGE QUALIFIERS

    Заполни "knowledge_qualifiers_scope".

    Значения:
    - "none" — knowledge qualifiers не используются.
    - "limited" — только для объективно сложных категорий
      (IP infringement by 3rd parties).
    - "extensive" — применяются к налогам, санкциям,
      compliance R&W — существенно ослабляет защиту.
    - "unclear" — нельзя определить.

    Шаг 7 — НАЛИЧИЕ SURVIVAL PERIOD

    Заполни "has_survival_period".

    Значения:
    - "yes" — survival упомянут явно.
    - "no" — не упомянут.
    - "unclear" — нельзя определить.

    Шаг 8 — ОБЩИЙ СРОК SURVIVAL

    Заполни "survival_general_value".

    Правила:
    - Если срок указан: "12 месяцев", "18 месяцев", "24 месяца"
    - Если бессрочно: "Бессрочно"
    - Если survival есть, но срок не установлен: "Не установлен"
    - Если survival нет: "Не применимо"
    - Если нельзя определить: "Не удалось определить"

    Шаг 9 — СТРУКТУРА SURVIVAL

    Заполни "survival_structure_summary".

    Правила:
    - Если дифференцированные сроки:
      "18 мес. — общий; 4 года — налоги; бессрочно — санкции"
    - Если единый срок:
      "18 мес. для всех R&W"
    - Если нет survival: "Не установлен"
    - Если нельзя определить: "Не удалось определить"

    Шаг 10 — НОРМАЛИЗОВАННЫЙ DISPLAY ДЛЯ DD GRID

    Заполни "rw_specific_display".

    Это итоговое поле для таблицы.
    Строй его ТОЛЬКО на основе уже заполненных полей выше.
    Не добавляй информацию сверх них.

    Возможные состояния:
    1. Полное покрытие:
       "Налоги: да; Санкции: да; Споры: да; Survival: 18 мес."
    2. Частичное покрытие:
       "Налоги: нет; Санкции: нет; Остальные: да; Survival: 12 мес."
    3. Проблемные qualifiers:
       "Extensive knowledge qualifiers на санкции; Survival: 18 мес."
    4. Не удалось определить:
       "Не удалось определить специальные R&W"

    Правила:
    - Если все поля unclear:
      "Не удалось определить специальные R&W"
    - Иначе:
      * сформируй краткую оценку покрытия:
        "Налоги: {да/нет}; Санкции: {да/нет}; Споры: {да/нет}"
        (только по тем, что "present" или "missing",
         опускай "unclear")
      * добавь survival:
        "Survival: {survival_general_value}"
      * если knowledge_qualifiers_scope = "extensive":
        добавь "extensive knowledge qualifiers"
    - Не более 4 коротких фактов через ";".

    Шаг 11 — КРАТКОЕ ОБОСНОВАНИЕ

    Заполни "reason".

    Правила:
    - Первое предложение — краткий вывод.
    - Второе — короткая цитата из текста (до 100 символов).
    - Пиши по-русски.
    </instructions>

    <edge_cases>
    - Налоговые и санкционные R&W с knowledge qualifiers:
      * knowledge_qualifiers_scope = "extensive"

    - Нет налоговых и санкционных R&W:
      * rw_tax = "missing"
      * rw_sanctions = "missing"

    - Survival 12 мес. для всех без дифференциации:
      * survival_general_value = "12 месяцев"
      * survival_structure_summary = "12 мес. для всех R&W"

    - Дифференцированные: 18 мес. / 4 года налоги / бессрочно санкции:
      * survival_general_value = "18 месяцев"
      * survival_structure_summary =
        "18 мес. — общий; 4 года — налоги; бессрочно — санкции"

    - Knowledge qualifier только на IP infringement by 3rd parties:
      * knowledge_qualifiers_scope = "limited"

    - Нет релевантных фрагментов:
      * все поля = "unclear"
      * survival_general_value = "Не удалось определить"
      * rw_specific_display =
        "Не удалось определить специальные R&W"
    </edge_cases>

    <output_expectations>
    - Верни результат строго в формате JSON.
    - Не оборачивай ответ в markdown-блоки.
    - Не добавляй комментариев вне JSON.
    - Для полей с allowed_values используй строго значения из списка.
    - Свободные текстовые поля
      (rw_specific_display, survival_general_value,
       survival_structure_summary, reason)
      заполняй на русском языке.
    - Не добавляй никаких полей, кроме указанных.

    Пример структуры ответа:
    {
      "rw_specific_display": "Налоги: да; Санкции: да; Споры: да; Survival: 18 мес.",
      "rw_tax": "present",
      "rw_sanctions": "present",
      "rw_litigation": "present",
      "rw_compliance_specific": "present",
      "rw_ip_encumbrances": "missing",
      "knowledge_qualifiers_scope": "limited",
      "has_survival_period": "yes",
      "survival_general_value": "18 месяцев",
      "survival_structure_summary": "18 мес. — общий; 4 года — налоги",
      "reason": "..."
    }
    </output_expectations>

  fields:
    - name: "rw_specific_display"
      type: "string"
      presentation: "fact"
      label: "Специальные R&W и survival"
      description: "Нормализованный user-facing вывод для DD Grid"
      display_in_grid: true
      display_priority: 1

    - name: "rw_tax"
      type: "string"
      presentation: "signal"
      description: "Налоговые R&W"
      allowed_values:
        - "present"
        - "missing"
        - "unclear"
      display_in_grid: false

    - name: "rw_sanctions"
      type: "string"
      presentation: "signal"
      description: "Санкционные R&W"
      allowed_values:
        - "present"
        - "missing"
        - "unclear"
      display_in_grid: false

    - name: "rw_litigation"
      type: "string"
      presentation: "signal"
      description: "R&W по судебным спорам"
      allowed_values:
        - "present"
        - "missing"
        - "unclear"
      display_in_grid: false

    - name: "rw_compliance_specific"
      type: "string"
      presentation: "signal"
      description: "R&W по комплаенсу / AML / антикоррупции"
      allowed_values:
        - "present"
        - "missing"
        - "unclear"
      display_in_grid: false

    - name: "rw_ip_encumbrances"
      type: "string"
      presentation: "signal"
      description: "R&W по IP и обременениям"
      allowed_values:
        - "present"
        - "missing"
        - "unclear"
      display_in_grid: false

    - name: "knowledge_qualifiers_scope"
      type: "string"
      presentation: "signal"
      description: "Масштаб knowledge qualifiers"
      allowed_values:
        - "none"
        - "limited"
        - "extensive"
        - "unclear"
      display_in_grid: false

    - name: "has_survival_period"
      type: "string"
      presentation: "signal"
      description: "Наличие survival period"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
      display_in_grid: false

    - name: "survival_general_value"
      type: "string"
      presentation: "fact"
      label: "Общий срок survival"
      description: "Общий срок действия R&W после closing"
      display_in_grid: true
      display_priority: 2

    - name: "survival_structure_summary"
      type: "string"
      presentation: "fact"
      label: "Структура survival"
      description: "Дифференцированные сроки survival по категориям R&W"
      display_in_grid: false

    - name: "reason"
      type: "string"
      presentation: "diagnostic"
      description: "Обоснование"
      display_in_grid: false

  store_payload: true


  
