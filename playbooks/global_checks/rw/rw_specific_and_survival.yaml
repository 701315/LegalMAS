id: "rw_specific_and_survival"
name: "Специальные R&W и срок их действия"
description: >
  Анализирует специальные R&W (налоги, санкции, споры, комплаенс, IP, обременения),
  наличие knowledge qualifiers и срок действия (survival) R&W.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"

rules:
  keywords:
    - "заверяет и гарантирует"
    - "represents and warrants"
    - "налог"
    - "tax"
    - "санкции"
    - "sanctions"
    - "litigation"
    - "спор"
    - "lawsuit"
    - "compliance"
    - "anti-corruption"
    - "антикорруп"
    - "intellectual property"
    - "IP"
    - "обременение"
    - "encumbrance"
    - "knowledge"
    - "to the best of its knowledge"
    - "по мере осведомленности"
    - "survival"
    - "будут действовать в течение"
  keyword_mode: "any"
  regex_patterns: []
  clause_patterns: []

llm:
  prompt_template: |
    <role>
    Ты — юрист по M&A.
    Твоя специализация — структура специальных заверений и гарантий (R&W)
    и сроки их действия (survival) в сделках купли‑продажи бизнеса.
    </role>

    <context>
    Ниже приведены фрагменты с заверениями и гарантиями (R&W):

    {context}
    </context>

    <instructions>
    Проведи анализ по шагам. Каждый шаг логически связан с одним или
    несколькими полями итоговой оценки.

    Шаг 1 — НАЛИЧИЕ СПЕЦИАЛЬНЫХ R&W ПО КЛЮЧЕВЫМ ЗОНАМ РИСКА
    (используется для "has_tax_rw", "has_sanctions_rw",
    "has_litigation_rw", "has_compliance_rw", "has_ip_and_encumbrances_rw"):

    - Определи по фрагментам, даны ли специальные заверения и гарантии:

      a) Налоги (has_tax_rw):
         * уплата налогов, отсутствие существенных доначислений,
           налоговых споров, штрафов и расследований,
         * отсутствие нераскрытых налоговых обязательств.

      b) Санкции (has_sanctions_rw):
         * отсутствие нарушений санкционного законодательства,
           статус несанкционных лиц,
           неприменимость ограничительных мер к Target/группе.

      c) Судебные споры и расследования (has_litigation_rw):
         * отсутствие или раскрытие существенных судебных споров,
           арбитражей, административных и уголовных дел, расследований,
         * отсутствие действий, которые могут привести к таким спорам.

      d) Комплаенс (has_compliance_rw):
         * соблюдение антикоррупционного, AML, санкционного,
           отраслевого и иного регуляторного комплаенса,
         * отсутствие существенных нарушений внутренних политик и процедур.

      e) IP и обременения (has_ip_and_encumbrances_rw):
         * принадлежность ключевых прав интеллектуальной собственности Target,
           наличие необходимых лицензий на IP,
         * отсутствие нераскрытых обременений, залогов и иных ограничений по IP и активам.

    - Для каждого из пяти блоков установи:
      * "yes" — если специальное R&W явно и содержательно есть;
      * "no" — если по фрагментам видно, что оно отсутствует;
      * "unclear" — если из текста нельзя сделать однозначный вывод.

    Шаг 2 — НАЛИЧИЕ KNOWLEDGE QUALIFIERS
    (используется для "uses_knowledge_qualifiers"):

    - Определи, используются ли оговорки вида:
      * "to the best of Seller's knowledge",
      * "по мере осведомленности", "насколько Продавцу известно" и аналогичные.
    - Учитывай, к каким именно R&W они применяются (по возможности отрази это затем в reason):
      * только к части специальных R&W или ко всем;
      * формулировки, которые фактически ограничивают объём ответственности знанием стороны.
    - Сформулируй вывод:
      * "yes" — если knowledge qualifiers явно применяются хотя бы к части специальных R&W;
      * "no" — если таких оговорок нет;
      * "unclear" — если по фрагментам это неясно.

    Шаг 3 — СТРУКТУРА СРОКОВ ДЕЙСТВИЯ (SURVIVAL) R&W
    (используется для "rw_survival_summary"):

    - Определи, какие сроки действия R&W указаны:
      * общий срок survival для большинства R&W (например, 12/24/36 месяцев);
      * отдельные, более длинные сроки для фундаментальных и/или специальных R&W
        (например, по налогам, санкциям, спорам, IP).
    - Кратко опиши структуру survival в одной строке, например:
      * "Общие R&W — 18 месяцев, налоговые — 4 года, санкции/коррупция — без ограничения".
    - Если про survival ничего не сказано, отрази это как отсутствие специальных сроков
      (например: "Специальные сроки survival не прописаны, применяются общие правила").

    Шаг 4 — ОБЩИЙ УРОВЕНЬ РИСКА ДЛЯ TARGET
    (используется для "overall_risk_level" и "reason"):

    - Оцени общий риск для Target, учитывая:
      * полноту специальных R&W по ключевым зонам риска (налоги, санкции, споры,
        комплаенс, IP, обременения);
      * широту или умеренность knowledge qualifiers (слишком широкие могут
        существенно ослаблять R&W);
      * длину и дифференциацию survival‑сроков, особенно по налогам, санкциям,
        комплаенсу и скрытым обременениям.
    - Сформулируй общий риск как:
      * "low" — если по критичным зонам риска есть содержательные R&W,
        knowledge qualifiers умеренные или отсутствуют, а survival‑сроки разумны и дифференцированы;
      * "medium" — если есть частичные пробелы или умеренно короткие сроки,
        но ключевые риски частично покрыты;
      * "high" — если по критичным зонам нет R&W, либо они сильно завешены
        knowledge qualifiers и/или имеют очень короткий survival.
    - В "reason" кратко объясни вывод:
      * какие специальные R&W присутствуют/отсутствуют,
      * как используются knowledge qualifiers,
      * как устроены survival‑сроки,
      * почему такая конфигурация создаёт низкий/средний/высокий риск для Target.
    </instructions>

    <edge_cases>
    Обрабатывай пограничные ситуации так:

    - Специальные R&W по налогам, санкциям, комплаенсу формально широкие,
      но почти все завешены knowledge qualifiers ("to the best of Seller's knowledge"):
      учитывай это как серьёзное ослабление защиты и отражай в reason,
      общий риск может быть "medium" или "high".

    - По критичным областям (налоги, санкции, существенные споры, IP, скрытые обременения)
      нет специальных R&W:
      соответствующие флаги отмечай как "no" и учитывай это как фактор
      повышенного риска (часто "high").

    - Survival по большинству R&W очень короткий (например, 6–12 месяцев),
      без отдельного более длительного срока для налогов и санкций:
      подробно отрази это в rw_survival_summary и при оценке риска
      склоняйся к "high" или "medium" в зависимости от контекста.

    - Предусмотрены разумные и дифференцированные survival‑сроки
      (налоги 3–5 лет, санкции/коррупция — без ограничения или длительный срок,
      прочие R&W — 18–24 месяца):
      учитывай это как фактор снижения риска при условии, что сами R&W
      по этим областям присутствуют.

    - Текст фрагментарный: видно упоминание отдельных R&W или survival,
      но нет полной картины:
      по каждому блоку, где данных мало, используй "unclear" и в reason
      явно укажи, каких элементов не хватает.

    - Пустые или явно нерелевантные фрагменты:
      по большинству полей используй "unclear",
      overall_risk_level — "medium",
      reason — "Недостаточно данных для анализа специальных R&W, knowledge qualifiers и сроков их действия."
    </edge_cases>

    <output_expectations>
    На основе твоего анализа отдельный механизм извлечения сформирует
    структурированные поля по заранее заданной схеме. Твоя задача —
    давать чёткие юридические выводы и указывать конкретные формулировки
    из текста, на которых они основаны.
    </output_expectations>
  prompt_file: null
  context_k: 5
  temperature: 0.0
  max_tokens: 640

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 700

retrieval:
  context_k: 5
  max_chunks: 10
  boost_keywords:
    - "represents and warrants"
    - "sanctions"
    - "litigation"
    - "compliance"
    - "intellectual property"
    - "knowledge"
    - "survival"
  rerank: true
  filters: {}

conditional: null

extraction:
  enabled: true
  mode: "hybrid"
  fields:
    - name: "has_tax_rw"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "has_sanctions_rw"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "has_litigation_rw"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "has_compliance_rw"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "has_ip_and_encumbrances_rw"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "uses_knowledge_qualifiers"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "rw_survival_summary"
      type: "string"

    - name: "overall_risk_level"
      type: "string"
      allowed_values:
        - "low"
        - "medium"
        - "high"

    - name: "reason"
      type: "string"

  store_payload: true

red_flags:
  items:
    - code: "RW2"
      description: "Очень широкие R&W без разумных knowledge qualifiers при объективной невозможности контроля."
    - code: "RW3"
      description: "Короткие survival-сроки по критичным специальным R&W."
