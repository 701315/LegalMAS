id: "rw_specific_and_survival"
name: "Специальные R&W и срок их действия"
description: >
  Анализирует специальные R&W (налоги, санкции, споры, комплаенс, IP, обременения),
  наличие knowledge qualifiers и срок действия (survival) R&W.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"

rules:
  keywords:
    - "заверяет и гарантирует"
    - "represents and warrants"
    - "налог"
    - "tax"
    - "санкции"
    - "sanctions"
    - "litigation"
    - "спор"
    - "lawsuit"
    - "compliance"
    - "anti-corruption"
    - "антикорруп"
    - "intellectual property"
    - "IP"
    - "обременение"
    - "encumbrance"
    - "knowledge"
    - "to the best of its knowledge"
    - "по мере осведомленности"
    - "survival"
    - "будут действовать в течение"
  keyword_mode: "any"
  regex_patterns: []
  clause_patterns: []

llm:
  prompt_template: |
    <role>
    Ты — юрист по M&A.
    Твоя специализация — структура специальных заверений и гарантий (R&W)
    и сроки их действия (survival) в сделках купли‑продажи бизнеса.
    </role>

    <context>
    Ниже приведены фрагменты с заверениями и гарантиями (R&W):

    {context}
    </context>

    <instructions>
    Определи:

    1) Какие специальные R&W даны:

       a) Налоги (has_tax_rw):
          - заверения об уплате налогов, отсутствии существенных налоговых доначислений,
            налоговых споров, штрафов и расследований;
          - отсутствие нераскрытых налоговых обязательств.

       b) Санкции (has_sanctions_rw):
          - заверения об отсутствии нарушений санкционного законодательства,
            статусе санкционных лиц, неприменимости ограничительных мер к Target/группе.

       c) Судебные споры и расследования (has_litigation_rw):
          - отсутствие (или раскрытие) существенных судебных споров, арбитражей,
            административных и уголовных дел, расследований;
          - отсутствие действий, которые могут привести к таким спорам.

       d) Комплаенс (has_compliance_rw):
          - соблюдение антикоррупционного, AML, санкционного, отраслевого и иного
            регуляторного комплаенса;
          - отсутствие существенных нарушений внутренних политик и процедур.

       e) IP и обременения (has_ip_and_encumbrances_rw):
          - принадлежность ключевых прав интеллектуальной собственности Target,
            наличие необходимых лицензий на IP;
          - отсутствие нераскрытых обременений, залогов, ограничений по IP и активам.

       Для каждого из перечисленных блоков установи:
       - "yes" — если специальное R&W явно и содержательно есть;
       - "no" — если по фрагментам видно, что оно отсутствует;
       - "unclear" — если из текста нельзя сделать однозначный вывод.

    2) Используются ли knowledge qualifiers (uses_knowledge_qualifiers):
       - формулировки вида "to the best of Seller's knowledge", "по мере осведомленности",
         "насколько Продавцу известно";
       - оцени не только наличие таких оговорок, но и то, насколько широко
         они распространяются (по возможности отрази это в reason).
       Поставь "yes", если knowledge qualifiers явно применяются хотя бы к части
       специальных R&W; "no", если их нет; "unclear", если это неясно.

    3) Срок действия (survival) R&W (rw_survival_summary):
       - какие сроки действия R&W указаны:
         * общий срок survival (например, 12/24/36 месяцев);
         * отдельные более длинные сроки для фундаментальных и/или специальных R&W
           (налоги, санкции, споры, IP и т.п.);
       - кратко опиши структуру survival в одной строке (например:
         "Общие R&W — 18 месяцев, налоговые — 4 года, санкции/коррупция — без ограничения").
       Если ничего не сказано, опиши это как отсутствие специальных survival‑сроков.

    4) Оцени общий риск для Target (overall_risk_level: low / medium / high):
       - учитывая:
         * полноту специальных R&W по ключевым зонам риска (налоги, санкции, споры,
           комплаенс, IP, обременения);
         * широту/умеренность knowledge qualifiers (слишком широкие могут сильно
           ослаблять R&W);
         * длину и структуру survival‑сроков, особенно по налогам, санкциям,
           комплаенсу и скрытым обременениям.
    </instructions>

    <edge_cases>
    ВАЖНО — пограничные случаи:

    — Если специальные R&W очень широкие (например, по налогам, санкциям, комплаенсу),
      но полностью завешены knowledge qualifiers ("to the best of Seller's knowledge"):
      отражай uses_knowledge_qualifiers = "yes" и в reason поясни, насколько это
      ослабляет защиту; общий риск может быть "medium" или "high".

    — Если по критичным областям (налоги, санкции, существенные споры, IP, скрытые
      обременения) нет специальных R&W:
      соответствующие флаги = "no",
      overall_risk_level обычно "high" (обоснуй).

    — Если survival по большинству R&W очень короткий (например, 6–12 месяцев),
      а по налогам и санкциям не предусмотрено отдельного более длительного срока:
      отрази это в rw_survival_summary и учти при оценке риска (часто "high"
      или "medium").

    — Если, наоборот, предусмотрены разумные и дифференцированные survival‑сроки
      (налоги 3–5 лет, санкции/коррупция без ограничения или долго, прочие R&W — 18–24 месяца):
      это снижает риск при условии наличия самих R&W.

    — Если текст фрагментарный, видно упоминание отдельных R&W, но нет
      полной картины всех специальных блоков или survival:
      по каждому блоку ставь "unclear", если недостаточно данных, и в reason
      явно укажи, каких элементов не хватает.

    — Пустые или нерелевантные фрагменты:
      большинство полей = "unclear",
      overall_risk_level = "medium",
      reason = "Недостаточно данных для анализа специальных R&W, knowledge qualifiers и сроков их действия."
    </edge_cases>

    <examples>
    ПРИМЕР 1 — ПОЛНЫЕ СПЕЦИАЛЬНЫЕ R&W И РАЗУМНЫЙ SURVIVAL (MEDIUM/LOW):

    Фрагмент: "Продавец заявляет и гарантирует, что (i) Общество надлежащим образом
    уплатило все налоги и не участвует в существенных налоговых спорах, (ii) ни
    Продавец, ни Общество не являются объектами санкций и не нарушают применимое
    санкционное законодательство, (iii) против Общества не ведутся существенные
    судебные споры, кроме раскрытых в Приложении, (iv) Общество соблюдает применимые
    законы и комплаенс‑политики, (v) Обществу принадлежат все существенные объекты
    IP, необходимые для его деятельности, и они свободны от нераскрытых обременений.
    Заверения по налогам действуют в течение 4 лет, по санкциям и антикоррупции —
    без ограничения, прочие R&W — 24 месяца после Closing."

    {{
      "has_tax_rw": "yes",
      "has_sanctions_rw": "yes",
      "has_litigation_rw": "yes",
      "has_compliance_rw": "yes",
      "has_ip_and_encumbrances_rw": "yes",
      "uses_knowledge_qualifiers": "no",
      "rw_survival_summary": "Налоговые R&W — 4 года, санкции/антикоррупция — без ограничения, прочие — 24 месяца.",
      "overall_risk_level": "low",
      "reason": "Присутствуют подробные специальные R&W по налогам, санкциям, спорам, комплаенсу и IP с разумно длинными и дифференцированными сроками survival, без knowledge qualifiers, что хорошо защищает покупателя."
    }}

    ПРИМЕР 2 — R&W СИЛЬНО ОГРАНИЧЕНЫ KNOWLEDGE, КОРОТКИЙ SURVIVAL (HIGH):

    Фрагмент: "Продавец, насколько ему известно, заверяет, что Общество исполнило
    свои налоговые обязательства и в настоящее время не знает о каких-либо
    существенных судебных или регуляторных спорах. Все заверения и гарантии
    действуют в течение 12 месяцев после Closing."

    {{
      "has_tax_rw": "yes",
      "has_sanctions_rw": "unclear",
      "has_litigation_rw": "yes",
      "has_compliance_rw": "unclear",
      "has_ip_and_encumbrances_rw": "unclear",
      "uses_knowledge_qualifiers": "yes",
      "rw_survival_summary": "Все R&W действуют 12 месяцев, без отдельных сроков для налогов/санкций.",
      "overall_risk_level": "high",
      "reason": "Налоговые и litigation R&W завешены knowledge qualifiers и имеют короткий общий срок survival 12 месяцев, без отдельных сроков для критичных рисков (налоги, санкции), что создаёт высокий риск для покупателя."
    }}

    ПРИМЕР 3 — ОГРАНИЧЕННЫЙ НАБОР СПЕЦИАЛЬНЫХ R&W (MEDIUM):

    Фрагмент: "Продавец гарантирует отсутствие существенных судебных споров,
    связанных с деятельностью Общества, и отсутствие обременений на ключевые
    объекты IP, кроме указанных в Приложении. Survival таких заверений —
    24 месяца после Closing."

    {{
      "has_tax_rw": "no",
      "has_sanctions_rw": "unclear",
      "has_litigation_rw": "yes",
      "has_compliance_rw": "unclear",
      "has_ip_and_encumbrances_rw": "yes",
      "uses_knowledge_qualifiers": "no",
      "rw_survival_summary": "Litigation и IP R&W действуют 24 месяца; иные R&W не описаны.",
      "overall_risk_level": "medium",
      "reason": "Есть специальные R&W по спорам и IP с разумным сроком survival, но отсутствуют явные R&W по налогам и санкциям, что оставляет значимые риски непокрытыми."
    }}
    </examples>

    <output_format>
    Твой ответ ДОЛЖЕН быть строго валидным JSON-объектом со следующими
    полями:

    {{
      "has_tax_rw": "one of: yes | no | unclear",
      "has_sanctions_rw": "one of: yes | no | unclear",
      "has_litigation_rw": "one of: yes | no | unclear",
      "has_compliance_rw": "one of: yes | no | unclear",
      "has_ip_and_encumbrances_rw": "one of: yes | no | unclear",
      "uses_knowledge_qualifiers": "one of: yes | no | unclear",
      "rw_survival_summary": "string — краткое описание структуры сроков действия R&W",
      "overall_risk_level": "one of: low | medium | high",
      "reason": "string — краткое объяснение на русском с указанием набора специальных R&W, наличия knowledge qualifiers и структуры survival, и их влияния на риски для Target"
    }}

    Все перечисленные поля ДОЛЖНЫ присутствовать в JSON, даже если их значение равно null.
    </output_format>

    <constraints>
    ЖЁСТКИЕ ПРАВИЛА:
    1. Выведи ТОЛЬКО один JSON-объект. Никакого текста до или после.
    2. Не пиши "Вот JSON", "Here is the JSON" и т.п.
    3. Не используй Markdown, бэктики ``` или любые обёртки.
    4. Все строки — в двойных кавычках.
    5. Значения перечислимых полей — СТРОГО из указанных вариантов.
    6. Ключи — точно как указано, без добавления новых.
    7. Поле "reason" ДОЛЖНО содержать конкретные выводы о специальных R&W,
       knowledge qualifiers и survival, а не общие фразы вроде "есть риски".
    8. Начни ответ сразу с символа {{
    9. Если по какому‑то полю нет достаточно информации в тексте —
       верни для него 'unclear' или null (для reason пустое значение
       недопустимо — нужно объяснение). НЕ придумывай значения, не интерполируй.
    </constraints>
  prompt_file: null
  context_k: 5
  temperature: 0.0
  max_tokens: 640

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 700

retrieval:
  context_k: 5
  max_chunks: 10
  boost_keywords:
    - "represents and warrants"
    - "sanctions"
    - "litigation"
    - "compliance"
    - "intellectual property"
    - "knowledge"
    - "survival"
  rerank: true
  filters: {}

conditional: null

extraction:
  enabled: true
  mode: "hybrid"
  fields:
    - name: "has_tax_rw"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
    - name: "has_sanctions_rw"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
    - name: "has_litigation_rw"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
    - name: "has_compliance_rw"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
    - name: "has_ip_and_encumbrances_rw"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
    - name: "uses_knowledge_qualifiers"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
    - name: "rw_survival_summary"
      type: "string"
    - name: "overall_risk_level"
      type: "string"
      allowed_values:
        - "low"
        - "medium"
        - "high"
    - name: "reason"
      type: "string"
  store_payload: true

red_flags:
  items:
    - code: "RW2"
      description: "Очень широкие R&W без разумных knowledge qualifiers при объективной невозможности контроля."
    - code: "RW3"
      description: "Короткие survival-сроки по критичным специальным R&W."
      