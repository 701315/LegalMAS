id: "rw_fundamental"
name: "Фундаментальные заверения и гарантии"
group: "Represents and warrants"
description: >
  Анализирует фундаментальные R&W: статус и существование компании,
  полномочия на заключение договора, право собственности (title),
  отсутствие конфликтов, соответствие законам.

  Оценивает полноту покрытия, наличие qualifiers (knowledge,
  materiality) и общий уровень защиты.

  Специальные R&W по конкретным зонам риска (налоги, санкции,
  судебные споры, IP) и сроки действия анализируются чеком
  rw_specific_and_survival.

doc_types: []

severity: "high"
severity_if_fail: "critical"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"
ui_mode: "field_extraction"

rules:
  keyword_mode: any

  keywords:
    high:
      - "(?i)represents?\\s+and\\s+warrants?"
      - "(?i)заверя[ею]т\\s+и\\s+гарантиру[ею]т"
      - "(?i)representations?\\s+and\\s+warranties"
      - "(?i)заверени[яи]\\s+и\\s+гарантии"
      - "(?i)\\bR&W\\b"
      - "(?i)duly\\s+(organized|incorporated|formed)"
      - "(?i)validly\\s+existing"
      - "(?i)good\\s+standing"
      - "(?i)надлежащим\\s+образом\\s+(учрежден|создан|зарегистрирован)"
      - "(?i)duly\\s+authorized"
      - "(?i)full\\s+(corporate\\s+)?(power|authority)"
      - "(?i)valid\\s+and\\s+binding\\s+obligation"
      - "(?i)enforceable\\s+against"
      - "(?i)надлежащ[а-я]+\\s+уполномочен"
      - "(?i)полномочи[яи]\\s+на\\s+заключени[ея]"
      - "(?i)good\\s+and\\s+marketable\\s+title"
      - "(?i)clear\\s+title"
      - "(?i)free\\s+and\\s+clear"
      - "(?i)право\\s+собственности[\\s\\S]{0,30}свободн"
      - "(?i)свободн[оа]\\s+от\\s+обременени[йя]"
      - "(?i)без\\s+залогов\\s+и\\s+обременени[йя]"
      - "(?i)no\\s+conflict"
      - "(?i)will\\s+not\\s+conflict"
      - "(?i)does\\s+not\\s+violate"
      - "(?i)отсутстви[ея]\\s+конфликт[ао]"
      - "(?i)не\\s+противоречит"
      - "(?i)не\\s+нарушает\\s+(устав|договор|законодательств)"
      - "(?i)compliance\\s+with\\s+(all\\s+)?applicable\\s+(laws?|legislation)"
      - "(?i)no\\s+material\\s+violation"
      - "(?i)соответств[а-я]+\\s+применим[а-я]+\\s+(прав|законодательств)"
      - "(?i)отсутстви[ея]\\s+существенн[а-я]+\\s+нарушени[йя]"

    medium:
      - "(?i)represents?"
      - "(?i)warrants?"
      - "(?i)заверя[ею]т"
      - "(?i)гарантиру[ею]т"
      - "(?i)representation"
      - "(?i)warranty"
      - "(?i)заверени[ея]"
      - "(?i)гаранти[яию]"
      - "(?i)to\\s+the\\s+(best\\s+of\\s+)?(its?|seller'?s?)\\s+knowledge"
      - "(?i)по\\s+(наилучшему\\s+)?сведени[яиям]"
      - "(?i)насколько\\s+известно"
      - "(?i)so\\s+far\\s+as\\s+[\\s\\S]{0,20}(aware|known)"
      - "(?i)in\\s+all\\s+material\\s+respects"
      - "(?i)во\\s+всех\\s+существенных\\s+отношениях"
      - "(?i)material(ly)?"
      - "(?i)except\\s+as\\s+disclosed"
      - "(?i)за\\s+исключением\\s+раскрыт"
      - "(?i)other\\s+than\\s+as\\s+set\\s+forth"
      - "(?i)encumbrance"
      - "(?i)lien"
      - "(?i)security\\s+interest"
      - "(?i)обременени[ея]"
      - "(?i)залог"

    low:
      - "(?i)represents?\\s+and\\s+warrants?"
      - "(?i)заверени[яи]\\s+и\\s+гарантии"
      - "(?i)duly\\s+authorized"
      - "(?i)good\\s+standing"
      - "(?i)free\\s+and\\s+clear"
      - "(?i)no\\s+conflict"
      - "(?i)no\\s+material\\s+violation"
      - "(?i)to\\s+the\\s+best\\s+of\\s+knowledge"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 640

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  retrieval_profile: "warranties_check"
  context_k: 5
  max_chunks: 10

  retrieval_query: >
    заверения и гарантии representations and warranties полномочия право собственности 
    отсутствие конфликта compliance authority title good standing

  boost_keywords:
    - "represents and warrants"
    - "заверяет и гарантирует"
    - "representations and warranties"
    - "заверения и гарантии"
    - "duly organized"
    - "validly existing"
    - "good standing"
    - "duly authorized"
    - "full power and authority"
    - "valid and binding"
    - "good and marketable title"
    - "free and clear"
    - "право собственности"
    - "свободно от обременений"
    - "no conflict"
    - "does not violate"
    - "отсутствие конфликта"
    - "compliance with applicable law"
    - "no material violation"
    - "to the best of knowledge"
    - "except as disclosed"

  negative_keywords:
    - "форс-мажор"
    - "арбитраж"
    - "подсудность"
    - "штрафные санкции"
    - "коммерческая тайна"

  preferred_unit_types:
    - "general_provision"
    - "obligation"

  excluded_unit_types:
    - "technical_fragment"
    - "appendix_reference"
    - "structural_anchor"

  preferred_clause_functions:
    - "representations"
    - "boilerplate"

  position_bias:
    preferred_range: [0.0, 1.0]
    boost: 0.10
    scope: "segment"

  rerank: true
  filters: {}

conditional: null

enrichment_hints:
  preferred_segment_types:
    - "contract"
    - "amendment"
    - "annex"
  excluded_segment_types:
    - "technical_specification"
    - "price_list"
    - "invoice"
    - "act"
    - "schedule"
  confidence_bonus_on_match: 0.10
  confidence_penalty_on_excluded_segment: 0.15

extraction:
  enabled: true
  mode: "hybrid"
  llm_max_tokens: 1350

  presence_signal:
    field: "rw_fundamental_status"
    present_values: ["present"]
    missing_values: ["missing"]
    unclear_values: ["unclear"]

  llm_prompt_extraction: |
    <role>
    Ты — юрист по M&A и договорным заверениям.
    Твоя задача — точно извлечь наличие и качество
    фундаментальных R&W:
    1) есть ли в договоре регулирование по теме фундаментальных R&W;
    2) если есть — какие заверения установлены:
       - статус и существование компании;
       - полномочия на заключение договора;
       - право собственности (title);
       - отсутствие конфликтов;
       - соответствие применимым законам (general);
       - qualifiers (knowledge, materiality, disclosed exceptions).

    КРИТИЧЕСКИ ВАЖНО:
    - Извлекай ТОЛЬКО то, что прямо написано в тексте.
    - НЕ додумывай заверения, если их нет явно.
    - НЕ смешивай фундаментальные R&W со специальными
      (налоги, санкции, споры, IP).
    - Если раздел о фундаментальных R&W в договоре отсутствует —
      rw_fundamental_status = "missing".
    - Если тексты по теме есть, но вывод сделать нельзя —
      rw_fundamental_status = "unclear".
    </role>

    <context_rules>
    - Некоторые фрагменты могут быть нерелевантны — игнорируй их.
    - Если фрагменты противоречат друг другу — используй "unclear"
      и объясни в reason.
    - Фундаментальные R&W = статус, полномочия, title, no conflict,
      general compliance. Налоги, санкции, IP, споры — в другом check.
    - Знание-квалификаторы на фундаментальных R&W (особенно title
      и authority) — нестандартно, фиксируй как "yes".
    - Materiality qualifier "excessive" — если он размывает ключевые
      R&W (title, authority, status) без стандартных оговорок.
    - Если ни один фрагмент не содержит информации о фундаментальных
      R&W (нет упоминаний represents and warrants / duly organized /
      authority / title / no conflict / compliance) —
      rw_fundamental_status = "missing", location = null.
      Не использовать "unclear" при полном отсутствии релевантных
      фрагментов.
    </context_rules>

    <context>
    Ниже приведены релевантные фрагменты договора:

    {context}
    </context>

    <task>
    Заполни только следующие поля:
    - rw_fundamental_display
    - rw_fundamental_status
    - rw_status_existence
    - rw_authority
    - rw_title
    - rw_no_conflicts
    - rw_compliance
    - has_knowledge_qualifiers
    - has_materiality_qualifiers
    - has_disclosed_exceptions
    - reason
    </task>

    <location_instructions>
    Для каждого поля по возможности укажи location в формате:
    {"clause_ref": "п. 12.1", "page": 7, "quote": "дословная фраза из договора"}

    Правила:
    - clause_ref — короткая ссылка на пункт / раздел / статью именно в том
      виде, как она написана в договоре;
    - page — целое число страницы;
    - quote — дословная фраза из текста договора (НЕ пересказ, НЕ парафраз).
      Копируй её посимвольно, сохраняя формулировку и порядок слов.
      Оптимальная длина: 30–300 символов.
    - Для synthesized-поля rw_fundamental_display и reason
      location ВСЕГДА null.
    - Для rw_fundamental_status = "missing" — location = null.
    - Для rw_fundamental_status = "present" / "unclear" — quote
      с наиболее релевантной фразой договора.
    - Для rw_status_existence, rw_authority, rw_title, rw_no_conflicts,
      rw_compliance:
      * если "present" — quote с фразой-заверением;
      * если "missing" — различай: прямое исключение (quote
        обязательна) vs отсутствие упоминания (location = null);
      * если "unclear" — location = null.
    - Для has_knowledge_qualifiers, has_materiality_qualifiers,
      has_disclosed_exceptions:
      * если значение определённое — quote с фразой-основанием;
      * если "no" / "none" — различай: прямое исключение vs
        отсутствие упоминания;
      * если "unclear" — location = null.
    - Не выдумывай location или quote. Если дословную фразу определить
      нельзя — location = null.
    </location_instructions>

    <instructions>
    Шаг 0 — НАЛИЧИЕ РЕГУЛИРОВАНИЯ ФУНДАМЕНТАЛЬНЫХ R&W

    Заполни "rw_fundamental_status".

    Значения:
    - "present" — если хотя бы одно содержательное signal-поле
      указывает на наличие информации по теме:
      * rw_status_existence = "present";
      * rw_authority = "present";
      * rw_title = "present";
      * rw_no_conflicts = "present";
      * rw_compliance = "present";
      * has_knowledge_qualifiers = "yes";
      * has_materiality_qualifiers ∈ {"excessive", "standard"};
      * has_disclosed_exceptions = "yes";
      * ЛИБО любое поле = "missing" / "no" / "none", но с заполненным
        location с прямой цитатой (см. RF3).
    - "missing" — если все содержательные поля = "missing" / "no" /
      "none" БЕЗ цитат, ЛИБО фрагментов по теме нет вообще.
    - "unclear" — если все содержательные = "unclear" при наличии
      фрагментов, но невозможности вывода.

    Шаг 1 — СТАТУС И СУЩЕСТВОВАНИЕ

    Заполни "rw_status_existence".

    Значения:
    - "present" — есть заверения о duly organized /
      validly existing / good standing.
    - "missing" — отсутствуют.
    - "unclear" — нельзя определить.

    Шаг 2 — ПОЛНОМОЧИЯ

    Заполни "rw_authority".

    Значения:
    - "present" — есть: duly authorized, full power and authority,
      valid and binding / enforceable obligation.
    - "missing" — отсутствуют.
    - "unclear" — нельзя определить.

    Шаг 3 — ПРАВО СОБСТВЕННОСТИ (TITLE)

    Заполни "rw_title".

    Значения:
    - "present" — good and marketable title / free and clear /
      право собственности без обременений.
    - "missing" — отсутствует.
    - "unclear" — нельзя определить.

    Шаг 4 — ОТСУТСТВИЕ КОНФЛИКТОВ

    Заполни "rw_no_conflicts".

    Значения:
    - "present" — заключение договора не нарушает устав,
      не противоречит существенным договорам, не приведёт
      к дефолту по другим обязательствам.
    - "missing" — отсутствует.
    - "unclear" — нельзя определить.

    Шаг 5 — GENERAL COMPLIANCE

    Заполни "rw_compliance".

    Только general compliance with applicable law.
    Не специальные R&W (налоги, санкции, IP, споры).

    Значения:
    - "present" — no material violations of applicable law.
    - "missing" — отсутствует.
    - "unclear" — нельзя определить.

    Шаг 6 — KNOWLEDGE QUALIFIERS

    Заполни "has_knowledge_qualifiers".

    Значения:
    - "yes" — knowledge qualifiers применяются к фундаментальным
      R&W (title, authority, status, no conflict).
    - "no" — не применяются к фундаментальным R&W.
    - "unclear" — нельзя определить.

    Шаг 7 — MATERIALITY QUALIFIERS

    Заполни "has_materiality_qualifiers".

    Значения:
    - "excessive" — qualifiers размывают ключевые фундаментальные
      R&W без стандартного обоснования.
    - "standard" — стандартные qualifiers
      (например, "no material violation" на compliance).
    - "none" — отсутствуют.
    - "unclear" — нельзя определить.

    Шаг 8 — DISCLOSED EXCEPTIONS

    Заполни "has_disclosed_exceptions".

    Значения:
    - "yes" — есть "except as disclosed in Disclosure Schedule".
    - "no" — нет.
    - "unclear" — нельзя определить.

    Шаг 9 — НОРМАЛИЗОВАННЫЙ DISPLAY ДЛЯ DD GRID

    Заполни "rw_fundamental_display".

    Это итоговое поле для таблицы.
    Строй его ТОЛЬКО на основе уже заполненных полей выше.
    Не добавляй информацию сверх них.

    Правила:
    - Если rw_fundamental_status = "missing":
      "Отсутствуют: статус, полномочия, title, no conflict, compliance"
    - Если все поля unclear:
      "Не удалось определить фундаментальные R&W"
    - Если все 5 = "present":
      "Фундаментальные R&W полные: статус, полномочия, title, no conflict, compliance"
      * если has_knowledge_qualifiers = "yes":
        добавь "; knowledge qualifiers на фундаментальных R&W"
      * если has_materiality_qualifiers = "excessive":
        добавь "; excessive materiality qualifiers"
    - Если есть отсутствующие:
      * перечисли missing через "; ":
        "Отсутствуют: {список missing}"
      * добавь "остальные есть" если часть присутствует
    - Не более 3 коротких фактов через ";".

    Шаг 10 — КРАТКОЕ ОБОСНОВАНИЕ

    Заполни "reason".

    Правила:
    - Первое предложение — краткий вывод.
    - Второе — короткая цитата из текста (до 100 символов).
    - Пиши по-русски.
    </instructions>

    <edge_cases>
    - Только status и authority, нет title и no conflict:
      * rw_fundamental_status = "present"
      * rw_title = "missing"
      * rw_no_conflicts = "missing"

    - Knowledge qualifier на title:
      * rw_fundamental_status = "present"
      * rw_title = "present"
      * has_knowledge_qualifiers = "yes"

    - "Except as disclosed in the Disclosure Schedule":
      * rw_fundamental_status = "present"
      * has_disclosed_exceptions = "yes"

    - Договор прямо фиксирует отсутствие фундаментальных R&W:
      * rw_fundamental_status = "present"
      * rw_status_existence = "missing"
      * location с прямой цитатой об отсутствии.

    - Нет релевантных фрагментов / раздел о фундаментальных R&W
      в договоре отсутствует:
      * rw_fundamental_status = "missing"
      * rw_status_existence = "missing"
      * rw_authority = "missing"
      * rw_title = "missing"
      * rw_no_conflicts = "missing"
      * rw_compliance = "missing"
      * has_knowledge_qualifiers = "no"
      * has_materiality_qualifiers = "none"
      * has_disclosed_exceptions = "no"
      * rw_fundamental_display =
        "Отсутствуют: статус, полномочия, title, no conflict, compliance"
      * location у всех полей = null.

    - Формулировки есть, но вывод невозможен:
      * rw_fundamental_status = "unclear"
      * соответствующие поля = "unclear"
    </edge_cases>

    <output_expectations>
    - Верни результат строго в формате JSON.
    - Не оборачивай в markdown-блоки (без ```).
    - Не добавляй комментариев вне JSON.
    - Все значения полей с allowed_values — на английском.
    - Свободные текстовые поля (rw_fundamental_display, reason) —
      на русском языке.
    - Не добавляй полей, кроме указанных.
    - Для каждого поля возвращай объект с ключами
      "value", "confidence", "location".

    Пример структуры ответа:
    {
      "rw_fundamental_display": {"value": "Фундаментальные R&W полные: статус, полномочия, title, no conflict, compliance", "confidence": 0.92, "location": null},
      "rw_fundamental_status": {"value": "present", "confidence": 0.95, "location": {"clause_ref": "п. 3.1", "page": 2, "quote": "The Seller represents and warrants that the Company is duly organized and validly existing"}},
      "rw_status_existence": {"value": "present", "confidence": 0.95, "location": {"clause_ref": "п. 3.1", "page": 2, "quote": "the Company is duly organized and validly existing"}},
      "rw_authority": {"value": "present", "confidence": 0.95, "location": {"clause_ref": "п. 3.2", "page": 2, "quote": "The Seller has full power and authority to enter into this Agreement"}},
      "rw_title": {"value": "present", "confidence": 0.90, "location": {"clause_ref": "п. 3.5", "page": 3, "quote": "good and marketable title, free and clear of all encumbrances"}},
      "rw_no_conflicts": {"value": "present", "confidence": 0.90, "location": {"clause_ref": "п. 3.4", "page": 3, "quote": "does not violate the charter documents or any material contract"}},
      "rw_compliance": {"value": "present", "confidence": 0.85, "location": {"clause_ref": "п. 3.7", "page": 3, "quote": "no material violation of applicable laws"}},
      "has_knowledge_qualifiers": {"value": "no", "confidence": 0.85, "location": null},
      "has_materiality_qualifiers": {"value": "standard", "confidence": 0.80, "location": null},
      "has_disclosed_exceptions": {"value": "yes", "confidence": 0.85, "location": {"clause_ref": "п. 3.1", "page": 2, "quote": "except as disclosed in the Disclosure Schedule"}},
      "reason": {"value": "...", "confidence": 0.90, "location": null}
    }
    </output_expectations>

  fields:
    - name: "rw_fundamental_display"
      type: "string"
      presentation: "fact"
      label: "Фундаментальные R&W"
      description: "Нормализованный user-facing вывод для DD Grid"
      display_in_grid: true
      display_priority: 1

    - name: "rw_fundamental_status"
      type: "string"
      presentation: "signal"
      risk_weight: "info"
      description: "Наличие регулирования фундаментальных R&W в договоре"
      display_in_grid: false
      allowed_values:
        - "present"
        - "missing"
        - "unclear"

    - name: "rw_status_existence"
      type: "string"
      presentation: "signal"
      risk_weight: "high"
      description: "Статус и существование компании"
      allowed_values:
        - "present"
        - "missing"
        - "unclear"
      display_in_grid: false

    - name: "rw_authority"
      type: "string"
      presentation: "signal"
      risk_weight: "high"
      description: "Полномочия"
      allowed_values:
        - "present"
        - "missing"
        - "unclear"
      display_in_grid: false

    - name: "rw_title"
      type: "string"
      presentation: "signal"
      risk_weight: "high"
      description: "Право собственности (title)"
      allowed_values:
        - "present"
        - "missing"
        - "unclear"
      display_in_grid: false

    - name: "rw_no_conflicts"
      type: "string"
      presentation: "signal"
      risk_weight: "high"
      description: "Отсутствие конфликтов"
      allowed_values:
        - "present"
        - "missing"
