id: "rw_fundamental"
name: "Фундаментальные заверения и гарантии"
description: >
  Анализирует фундаментальные R&W: статус, полномочия, право собственности,
  отсутствие конфликтов и существенных нарушений законов/регуляторных требований.

doc_types: []

severity: "high"
severity_if_fail: "critical"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"

rules:
  keywords:
    - "заверяет и гарантирует"
    - "represents and warrants"
    - "заверения и гарантии"
    - "R&W"
    - "право собственности"
    - "title"
    - "good and marketable title"
    - "полномочия"
    - "duly authorized"
    - "no conflict"
    - "отсутствие конфликта"
    - "соответствие применимому праву"
    - "compliance with applicable law"
  keyword_mode: "any"
  regex_patterns: []
  clause_patterns: []

llm:
  prompt_template: |
    <role>
    Ты — юрист по M&A.
    Твоя специализация — структура фундаментальных заверений и гарантий (R&W)
    в сделках по приобретению долей/активов.
    </role>

    <context>
    Ниже приведены фрагменты договора с заверениями и гарантиями (R&W):

    {context}
    </context>

    <instructions>
    Определи, есть ли фундаментальные R&W и насколько они покрывают ключевые вопросы:

    1) Статус и существование компании (rw_status_and_existence):
       - validly existing, duly organized, действующая компания,
         надлежащим образом учреждена и существует по праву своей юрисдикции.
       Оцени:
       - present — если такие заверения явно есть;
       - missing — если по фрагментам видно, что фундаментальные R&W отсутствуют;
       - unclear — если из текста невозможно сделать вывод.

    2) Полномочия на заключение договора (rw_authority_and_capacity):
       - duly authorized, необходимы корпоративные одобрения получены,
         договор является действительным и обязательным;
       - наличие указаний, что сторона имеет все полномочия и capacity
         для заключения и исполнения договора.

    3) Право собственности на продаваемые доли/активы (rw_title_to_shares_or_assets):
       - good and marketable title, полное и безобременительное право собственности,
         отсутствие прав третьих лиц, залогов и иных обременений, кроме раскрытых;
       - R&W о принадлежности долей/активов продавцу.

    4) Отсутствие конфликта (rw_no_conflicts):
       - no conflict с уставом, корпоративными документами, существенными договорами,
         решениями судов, регулирующими актами;
       - отсутствие необходимости дополнительных согласований, кроме раскрытых.

    5) Соответствие законам и регуляторным требованиям (rw_compliance_with_laws):
       - заверения об отсутствии существенных нарушений применимых законов и
         регуляторных требований, no material violations, no material proceedings.

    По каждому из пунктов выставь:
    - "present" — если R&W явно и нормально сформулированы;
    - "missing" — если по смыслу блока фундаментальное заверение по этому вопросу
      отсутствует;
    - "unclear" — если фрагменты не позволяют уверенно судить.

    Затем оцени общий риск (overall_risk_level: low / medium / high) с точки зрения
    полноты и качества фундаментальных R&W для Target.
    </instructions>

    <edge_cases>
    ВАЖНО — пограничные случаи:

    — Если R&W сгруппированы общим блоком и содержат только часть фундаментальных
      заверений (например, есть статус и полномочия, но нет явного title или no conflict):
      соответствующие поля отмечай как "present"/"missing" по каждому подпункту,
      а не ставь всем сразу одно значение.

    — Если есть сильный блок по title (good and marketable title, free and clear),
      но слабые или общие формулировки по compliance with laws:
      rw_title_to_shares_or_assets = "present",
      rw_compliance_with_laws может быть "unclear" или "present" в зависимости
      от конкретики.

    — Если фрагменты явно показывают, что R&W ограничены только не фундаментальными
      вопросами (например, операционными деталями) и не покрывают статус/полномочия/title:
      большинство фундаментальных полей будет "missing",
      overall_risk_level обычно "high".

    — Если текст фрагментарный (видно слово "represents and warrants", но непонятен
      контент фундаментальных заверений):
      по каждому полю используй "unclear", а в reason поясни, что фрагментов
      недостаточно.

    — Пустые или нерелевантные фрагменты:
      все поля по R&W = "unclear",
      overall_risk_level = "medium",
      reason = "Недостаточно данных для анализа фундаментальных заверений и гарантий."
    </edge_cases>

    <examples>
    ПРИМЕР 1 — ПОЛНЫЙ НАБОР ФУНДАМЕНТАЛЬНЫХ R&W (LOW):

    Фрагмент: "Продавец настоящим заявляет и гарантирует, что (i) надлежащим образом
    учрежден и действует в соответствии с законодательством своей юрисдикции
    (validly existing, duly organized), (ii) надлежащим образом уполномочен на
    заключение и исполнение настоящего Договора (duly authorized), (iii) обладает
    полным и свободным от обременений правом собственности на Продаваемые Доли
    (good and marketable title), (iv) заключение и исполнение настоящего Договора
    не приводит к нарушению устава, существенных договоров или применимых законов
    (no conflict), (v) Продавец и Общество соблюдают применимое законодательство
    и в настоящее время не имеют существенных нарушений."

    {{
      "rw_status_and_existence": "present",
      "rw_authority_and_capacity": "present",
      "rw_title_to_shares_or_assets": "present",
      "rw_no_conflicts": "present",
      "rw_compliance_with_laws": "present",
      "overall_risk_level": "low",
      "reason": "Наличие полного набора фундаментальных R&W по статусу, полномочиям, праву собственности, отсутствию конфликтов и соблюдению законов снижает риск для покупателя."
    }}

    ПРИМЕР 2 — СЛАБЫЕ ФУНДАМЕНТАЛЬНЫЕ R&W (HIGH):

    Фрагмент: "Продавец гарантирует только, что на дату подписания договора
    ему не известно о каких-либо обстоятельствах, которые могли бы существенно
    негативно повлиять на деятельность Общества."

    {{
      "rw_status_and_existence": "missing",
      "rw_authority_and_capacity": "missing",
      "rw_title_to_shares_or_assets": "missing",
      "rw_no_conflicts": "missing",
      "rw_compliance_with_laws": "unclear",
      "overall_risk_level": "high",
      "reason": "Фундаментальные заверения о статусе, полномочиях, праве собственности и отсутствии конфликтов отсутствуют; есть только общее знание‑based заявление, что создаёт высокий риск для покупателя."
    }}

    ПРИМЕР 3 — ЧАСТИЧНЫЙ НАБОР (MEDIUM):

    Фрагмент: "Продавец заявляет и гарантирует, что обладает правом собственности
    на Продаваемые Акции и надлежащим образом уполномочен на заключение настоящего
    Договора. Продавец также гарантирует, что заключение настоящего Договора
    не нарушает его устав и существенные договоры."

    {{
      "rw_status_and_existence": "unclear",
      "rw_authority_and_capacity": "present",
      "rw_title_to_shares_or_assets": "present",
      "rw_no_conflicts": "present",
      "rw_compliance_with_laws": "missing",
      "overall_risk_level": "medium",
      "reason": "Есть R&W по полномочиям, праву собственности и отсутствию конфликтов, но отсутствуют явные заверения о статусе Компании и соблюдении законов, что оставляет часть фундаментальных рисков непокрытыми."
    }}
    </examples>

    <output_format>
    Твой ответ ДОЛЖЕН быть строго валидным JSON-объектом со следующими
    полями:

    {{
      "rw_status_and_existence": "one of: present | missing | unclear",
      "rw_authority_and_capacity": "one of: present | missing | unclear",
      "rw_title_to_shares_or_assets": "one of: present | missing | unclear",
      "rw_no_conflicts": "one of: present | missing | unclear",
      "rw_compliance_with_laws": "one of: present | missing | unclear",
      "overall_risk_level": "one of: low | medium | high",
      "reason": "string — краткое объяснение на русском с указанием того, какие фундаментальные R&W присутствуют/отсутствуют и как это влияет на риск для Target"
    }}

    Все перечисленные поля ДОЛЖНЫ присутствовать в JSON, даже если их значение равно null.
    </output_format>

    <constraints>
    ЖЁСТКИЕ ПРАВИЛА:
    1. Выведи ТОЛЬКО один JSON-объект. Никакого текста до или после.
    2. Не пиши "Вот JSON", "Here is the JSON" и т.п.
    3. Не используй Markdown, бэктики ``` или любые обёртки.
    4. Все строки — в двойных кавычках.
    5. Значения перечислимых полей — СТРОГО из указанных вариантов.
    6. Ключи — точно как указано, без добавления новых.
    7. Поле "reason" ДОЛЖНО содержать конкретные выводы о полноте фундаментальных R&W,
       а не общие фразы вроде "есть риски".
    8. Начни ответ сразу с символа {{
    9. Если по какому‑то полю нет достаточно информации в тексте —
       верни для него 'unclear' или null (для reason пустое значение
       недопустимо — нужно объяснение). НЕ придумывай значения, не интерполируй.
    </constraints>
  prompt_file: null
  context_k: 4
  temperature: 0.0
  max_tokens: 512

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  context_k: 4
  max_chunks: 8
  boost_keywords:
    - "represents and warrants"
    - "заверяет и гарантирует"
    - "validly existing"
    - "duly authorized"
    - "good and marketable title"
    - "no conflict"
  rerank: true
  filters: {}

conditional: null

extraction:
  enabled: true
  mode: "hybrid"
  fields:
    - name: "rw_status_and_existence"
      type: "string"
      allowed_values:
        - "present"
        - "missing"
        - "unclear"
    - name: "rw_authority_and_capacity"
      type: "string"
      allowed_values:
        - "present"
        - "missing"
        - "unclear"
    - name: "rw_title_to_shares_or_assets"
      type: "string"
      allowed_values:
        - "present"
        - "missing"
        - "unclear"
    - name: "rw_no_conflicts"
      type: "string"
      allowed_values:
        - "present"
        - "missing"
        - "unclear"
    - name: "rw_compliance_with_laws"
      type: "string"
      allowed_values:
        - "present"
        - "missing"
        - "unclear"
    - name: "overall_risk_level"
      type: "string"
      allowed_values:
        - "low"
        - "medium"
        - "high"
    - name: "reason"
      type: "string"
  store_payload: true

red_flags:
  items:
    - code: "RW1"
      description: "Отсутствуют или крайне слабые фундаментальные R&W по статусу, полномочиям и праву собственности."
      