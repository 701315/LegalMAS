id: "rw_fundamental"
name: "Фундаментальные заверения и гарантии"
group: "Represents and warrants"
description: >
  Анализирует фундаментальные R&W: статус и существование компании,
  полномочия на заключение договора, право собственности (title),
  отсутствие конфликтов, соответствие законам.

  Оценивает полноту покрытия, наличие qualifiers (knowledge,
  materiality) и общий уровень защиты.

  Специальные R&W по конкретным зонам риска (налоги, санкции,
  судебные споры, IP) и сроки действия анализируются чеком
  rw_specific_and_survival.

doc_types: []

severity: "high"
severity_if_fail: "critical"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"
ui_mode: "field_extraction"

rules:
  keyword_mode: any

  keywords:
    high:
      # Прямые R&W формулировки
      - "(?i)represents?\\s+and\\s+warrants?"
      - "(?i)заверя[ею]т\\s+и\\s+гарантиру[ею]т"
      - "(?i)representations?\\s+and\\s+warranties"
      - "(?i)заверени[яи]\\s+и\\s+гарантии"
      - "(?i)\\bR&W\\b"

      # Статус и существование
      - "(?i)duly\\s+(organized|incorporated|formed)"
      - "(?i)validly\\s+existing"
      - "(?i)good\\s+standing"
      - "(?i)надлежащим\\s+образом\\s+(учрежден|создан|зарегистрирован)"

      # Полномочия
      - "(?i)duly\\s+authorized"
      - "(?i)full\\s+(corporate\\s+)?(power|authority)"
      - "(?i)valid\\s+and\\s+binding\\s+obligation"
      - "(?i)enforceable\\s+against"
      - "(?i)надлежащ[а-я]+\\s+уполномочен"
      - "(?i)полномочи[яи]\\s+на\\s+заключени[ея]"

      # Title / право собственности
      - "(?i)good\\s+and\\s+marketable\\s+title"
      - "(?i)clear\\s+title"
      - "(?i)free\\s+and\\s+clear"
      - "(?i)право\\s+собственности[\\s\\S]{0,30}свободн"
      - "(?i)свободн[оа]\\s+от\\s+обременени[йя]"
      - "(?i)без\\s+залогов\\s+и\\s+обременени[йя]"

      # No conflict
      - "(?i)no\\s+conflict"
      - "(?i)will\\s+not\\s+conflict"
      - "(?i)does\\s+not\\s+violate"
      - "(?i)отсутстви[ея]\\s+конфликт[ао]"
      - "(?i)не\\s+противоречит"
      - "(?i)не\\s+нарушает\\s+(устав|договор|законодательств)"

      # Compliance with laws (general)
      - "(?i)compliance\\s+with\\s+(all\\s+)?applicable\\s+(laws?|legislation)"
      - "(?i)no\\s+material\\s+violation"
      - "(?i)соответств[а-я]+\\s+применим[а-я]+\\s+(прав|законодательств)"
      - "(?i)отсутстви[ея]\\s+существенн[а-я]+\\s+нарушени[йя]"

    medium:
      # Общие R&W термины
      - "(?i)represents?"
      - "(?i)warrants?"
      - "(?i)заверя[ею]т"
      - "(?i)гарантиру[ею]т"
      - "(?i)representation"
      - "(?i)warranty"
      - "(?i)заверени[ея]"
      - "(?i)гаранти[яию]"

      # Knowledge qualifiers
      - "(?i)to\\s+the\\s+(best\\s+of\\s+)?(its?|seller'?s?)\\s+knowledge"
      - "(?i)по\\s+(наилучшему\\s+)?сведени[яиям]"
      - "(?i)насколько\\s+известно"
      - "(?i)so\\s+far\\s+as\\s+[\\s\\S]{0,20}(aware|known)"

      # Materiality qualifiers
      - "(?i)in\\s+all\\s+material\\s+respects"
      - "(?i)во\\s+всех\\s+существенных\\s+отношениях"
      - "(?i)material(ly)?"

      # Disclosed exceptions
      - "(?i)except\\s+as\\s+disclosed"
      - "(?i)за\\s+исключением\\s+раскрыт"
      - "(?i)other\\s+than\\s+as\\s+set\\s+forth"

      # Обременения
      - "(?i)encumbrance"
      - "(?i)lien"
      - "(?i)security\\s+interest"
      - "(?i)обременени[ея]"
      - "(?i)залог"

    low:
      - "(?i)represents?\\s+and\\s+warrants?"
      - "(?i)заверени[яи]\\s+и\\s+гарантии"
      - "(?i)duly\\s+authorized"
      - "(?i)good\\s+standing"
      - "(?i)free\\s+and\\s+clear"
      - "(?i)no\\s+conflict"
      - "(?i)no\\s+material\\s+violation"
      - "(?i)to\\s+the\\s+best\\s+of\\s+knowledge"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 640

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  context_k: 5
  max_chunks: 10

  retrieval_query: >
    заверения и гарантии representations and warranties полномочия право собственности 
    отсутствие конфликта compliance authority title good standing

  boost_keywords:
    - "represents and warrants"
    - "заверяет и гарантирует"
    - "representations and warranties"
    - "заверения и гарантии"
    - "duly organized"
    - "validly existing"
    - "good standing"
    - "duly authorized"
    - "full power and authority"
    - "valid and binding"
    - "good and marketable title"
    - "free and clear"
    - "право собственности"
    - "свободно от обременений"
    - "no conflict"
    - "does not violate"
    - "отсутствие конфликта"
    - "compliance with applicable law"
    - "no material violation"
    - "to the best of knowledge"
    - "except as disclosed"

  negative_keywords:
    - "форс-мажор"
    - "арбитраж"
    - "подсудность"
    - "штрафные санкции"
    - "коммерческая тайна"

  preferred_unit_types:
    - "general_provision"
    - "obligation"

  excluded_unit_types:
    - "technical_fragment"
    - "appendix_reference"
    - "structural_anchor"

  preferred_clause_functions:
    - "representations"
    - "boilerplate"

  position_bias:
    preferred_range: [0.0, 1.0]
    boost: 0.10
    scope: "segment"

  rerank: true
  filters: {}

conditional: null

enrichment_hints:
  preferred_segment_types:
    - "contract"
    - "amendment"
    - "annex"
  excluded_segment_types:
    - "technical_specification"
    - "price_list"
    - "invoice"
    - "act"
    - "schedule"
  confidence_bonus_on_match: 0.10
  confidence_penalty_on_excluded_segment: 0.15

extraction:
  enabled: true
  mode: "hybrid"
  llm_max_tokens: 1150

  llm_prompt_extraction: |
    <role>
    Ты — юрист по M&A.
    Твоя задача — точно извлечь наличие и качество
    фундаментальных R&W:
    1) статус и существование компании;
    2) полномочия;
    3) право собственности (title);
    4) отсутствие конфликтов;
    5) соответствие законам (general).

    Специальные R&W (налоги, санкции, споры, IP) и сроки
    действия анализируются чеком rw_specific_and_survival.
    </role>

    <context>
    Ниже приведены релевантные фрагменты договора:

    {context}
    </context>

    <task>
    Заполни только следующие поля:
    - rw_fundamental_display
    - rw_status_existence
    - rw_authority
    - rw_title
    - rw_no_conflicts
    - rw_compliance
    - has_knowledge_qualifiers
    - has_materiality_qualifiers
    - has_disclosed_exceptions
    - reason

    Важно:
    - не анализируй специальные R&W (налоги, санкции, споры, IP);
    - пиши коротко и по-русски.
    </task>

    <instructions>
    Шаг 1 — СТАТУС И СУЩЕСТВОВАНИЕ

    Заполни "rw_status_existence".

    Значения:
    - "present" — заверения о duly organized / validly existing /
      good standing есть.
    - "missing" — отсутствуют.
    - "unclear" — неясно.

    Шаг 2 — ПОЛНОМОЧИЯ

    Заполни "rw_authority".

    Значения:
    - "present" — есть: duly authorized, full power and authority,
      valid and binding / enforceable.
    - "missing" — отсутствуют.
    - "unclear" — неясно.

    Шаг 3 — ПРАВО СОБСТВЕННОСТИ (TITLE)

    Заполни "rw_title".

    Значения:
    - "present" — good and marketable title / free and clear /
      право собственности без обременений.
    - "missing" — отсутствует.
    - "unclear" — неясно.

    Шаг 4 — ОТСУТСТВИЕ КОНФЛИКТОВ

    Заполни "rw_no_conflicts".

    Значения:
    - "present" — заключение договора не нарушает устав,
      не противоречит существенным договорам, не приведёт
      к дефолту по другим обязательствам.
    - "missing" — отсутствует.
    - "unclear" — неясно.

    Шаг 5 — GENERAL COMPLIANCE

    Заполни "rw_compliance".

    Это только general compliance with applicable law,
    не специальные R&W.

    Значения:
    - "present" — no material violations of applicable law.
    - "missing" — отсутствует.
    - "unclear" — неясно.

    Шаг 6 — KNOWLEDGE QUALIFIERS

    Заполни "has_knowledge_qualifiers".

    Значения:
    - "yes" — knowledge qualifiers применяются к фундаментальным
      R&W (title, authority, status, no conflict) — нестандартно.
    - "no" — не применяются.
    - "unclear" — неясно.

    Шаг 7 — MATERIALITY QUALIFIERS

    Заполни "has_materiality_qualifiers".

    Значения:
    - "excessive" — qualifiers чрезмерны и ослабляют защиту.
    - "standard" — стандартные (например, "no material violation"
      на compliance).
    - "none" — отсутствуют.
    - "unclear" — неясно.

    Шаг 8 — DISCLOSED EXCEPTIONS

    Заполни "has_disclosed_exceptions".

    Значения:
    - "yes" — есть "except as disclosed in Disclosure Schedule".
    - "no" — нет.
    - "unclear" — неясно.

    Шаг 9 — НОРМАЛИЗОВАННЫЙ DISPLAY ДЛЯ DD GRID

    Заполни "rw_fundamental_display".

    Это не свободное summary.
    Строй display по следующей логике:

    Базовый случай:
    - все unclear:
      "Не удалось определить фундаментальные R&W"

    Если данные есть — оцени покрытие:
    - если все 5 категорий = "present":
      "Фундаментальные R&W полные"
    - если есть отсутствующие:
      "Отсутствуют: {список}; остальные есть"
    - если есть knowledge qualifiers:
      добавь "; knowledge qualifiers на фундаментальных R&W"

    Примеры:
    - "Фундаментальные R&W полные: статус, полномочия, title, no conflict, compliance"
    - "Отсутствуют: title; no conflict; остальные есть"
    - "Knowledge qualifiers на title — нестандартно"
    - "Не удалось определить фундаментальные R&W"

    Ограничение: не более 3 фактов через ";".

    Шаг 10 — КРАТКОЕ ОБОСНОВАНИЕ

    Заполни "reason".

    Правила:
    - 1–2 коротких предложения.
    - Укажи: покрытие R&W, qualifiers.
    - Приведи цитату в кавычках.
    </instructions>

    <edge_cases>
    - Только status и authority, нет title и no conflict:
      * rw_title = "missing"
      * rw_no_conflicts = "missing"

    - Knowledge qualifier на title:
      * rw_title = "present"
      * has_knowledge_qualifiers = "yes"

    - "Except as disclosed in the Disclosure Schedule":
      * has_disclosed_exceptions = "yes"
      * стандартное исключение

    - Нет ни одного R&W:
      * все поля = "missing"

    - Нет релевантных фрагментов:
      * все поля = "unclear"
      * rw_fundamental_display = "Не удалось определить фундаментальные R&W"
    </edge_cases>

    <output_expectations>
    Все значения коротко и по-русски.
    Не добавляй никаких полей, кроме указанных в схеме extraction.
    </output_expectations>

  fields:
    - name: "rw_fundamental_display"
      type: "string"
      presentation: "fact"
      label: "Фундаментальные R&W"
      description: "Нормализованный user-facing вывод для DD Grid"

    - name: "rw_status_existence"
      type: "string"
      presentation: "signal"
      description: "Статус и существование компании"
      allowed_values:
        - "present"
        - "missing"
        - "unclear"

    - name: "rw_authority"
      type: "string"
      presentation: "signal"
      description: "Полномочия"
      allowed_values:
        - "present"
        - "missing"
        - "unclear"

    - name: "rw_title"
      type: "string"
      presentation: "signal"
      description: "Право собственности (title)"
      allowed_values:
        - "present"
        - "missing"
        - "unclear"

    - name: "rw_no_conflicts"
      type: "string"
      presentation: "signal"
      description: "Отсутствие конфликтов"
      allowed_values:
        - "present"
        - "missing"
        - "unclear"

    - name: "rw_compliance"
      type: "string"
      presentation: "signal"
      description: "Соответствие применимым законам (general)"
      allowed_values:
        - "present"
        - "missing"
        - "unclear"

    - name: "has_knowledge_qualifiers"
      type: "string"
      presentation: "signal"
      description: "Knowledge qualifiers на фундаментальных R&W"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "has_materiality_qualifiers"
      type: "string"
      presentation: "signal"
      description: "Materiality qualifiers"
      allowed_values:
        - "excessive"
        - "standard"
        - "none"
        - "unclear"

    - name: "has_disclosed_exceptions"
      type: "string"
      presentation: "signal"
      description: "Disclosed exceptions (Disclosure Schedule)"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "reason"
      type: "string"
      presentation: "diagnostic"
      description: "Обоснование"

  store_payload: true


  
