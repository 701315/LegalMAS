id: "rw_fundamental"
name: "Фундаментальные заверения и гарантии"
description: >
  Анализирует фундаментальные R&W: статус, полномочия, право собственности,
  отсутствие конфликтов и существенных нарушений законов/регуляторных требований.

doc_types: []

severity: "high"
severity_if_fail: "critical"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"

rules:
  keywords:
    - "заверяет и гарантирует"
    - "represents and warrants"
    - "заверения и гарантии"
    - "R&W"
    - "право собственности"
    - "title"
    - "good and marketable title"
    - "полномочия"
    - "duly authorized"
    - "no conflict"
    - "отсутствие конфликта"
    - "соответствие применимому праву"
    - "compliance with applicable law"
  keyword_mode: "any"
  regex_patterns: []
  clause_patterns: []

llm:
  prompt_template: |
    <role>
    Ты — юрист по M&A.
    Твоя специализация — структура фундаментальных заверений и гарантий (R&W)
    в сделках по приобретению долей/активов.
    </role>

    <context>
    Ниже приведены фрагменты договора с заверениями и гарантиями (R&W):

    {context}
    </context>

    <instructions>
    Проведи анализ по шагам. Каждый шаг логически связан с одним или
    несколькими полями итоговой оценки.

    По каждому вида фундаментальных R&W используй значения:
    - "present" — заверение явно и нормально сформулировано;
    - "missing" — по смыслу блока фундаментальное заверение по этому вопросу отсутствует;
    - "unclear" — по фрагментам нельзя уверенно судить.

    Шаг 1 — СТАТУС И СУЩЕСТВОВАНИЕ КОМПАНИИ
    (используется для "rw_status_and_existence"):
    - Определи, есть ли заверения о том, что компания:
      * duly organized, validly existing, действующая и надлежащим образом учреждена;
      * существует в соответствии с правом своей юрисдикции.
    - Классифицируй поле "rw_status_and_existence" как present / missing / unclear.

    Шаг 2 — ПОЛНОМОЧИЯ И ДЕЕСПОСОБНОСТЬ ЗАКЛЮЧИТЬ ДОГОВОР
    (используется для "rw_authority_and_capacity"):
    - Проверь, есть ли заверения, что сторона:
      * duly authorized на заключение и исполнение договора;
      * получила все необходимые корпоративные одобрения;
      * договор является действительным и обязательным (valid and binding obligation).
    - Установи значение "rw_authority_and_capacity": present / missing / unclear.

    Шаг 3 — ПРАВО СОБСТВЕННОСТИ НА ДОЛИ/АКТИВЫ
    (используется для "rw_title_to_shares_or_assets"):
    - Определи, есть ли R&W о том, что:
      * продавец имеет good and marketable title к продаваемым долям/активам;
      * право собственности полное и свободное от обременений,
        кроме явно раскрытых (free and clear, except as disclosed);
      * доли/активы действительно принадлежат продавцу.
    - Установи значение "rw_title_to_shares_or_assets": present / missing / unclear.

    Шаг 4 — ОТСУТСТВИЕ КОНФЛИКТОВ
    (используется для "rw_no_conflicts"):
    - Проверь, есть ли заверения, что:
      * заключение и исполнение договора не нарушает устав, корпоративные документы;
      * не противоречит существенным договорам, судебным актам, регуляторным требованиям;
      * не требует дополнительных согласований, кроме прямо раскрытых.
    - Установи значение "rw_no_conflicts": present / missing / unclear.

    Шаг 5 — СООТВЕТСТВИЕ ЗАКОНАМ И РЕГУЛЯТОРНЫМ ТРЕБОВАНИЯМ
    (используется для "rw_compliance_with_laws"):
    - Определи, есть ли заверения:
      * об отсутствии существенных нарушений применимых законов и регуляторных требований
        (no material violations, no material proceedings);
      * о соблюдении компанией применимого законодательства.
    - Установи значение "rw_compliance_with_laws": present / missing / unclear.

    Шаг 6 — ОБЩИЙ РИСК ДЛЯ TARGET
    (используется для "overall_risk_level" и "reason"):
    - Оцени полноту и качество фундаментальных R&W в совокупности:
      * какие из пяти блоков присутствуют, какие отсутствуют;
      * есть ли пробелы по ключевым вопросам (статус, полномочия, title, no conflict, compliance).
    - Сформулируй общий риск как:
      * "low" — полный и хорошо сформулированный набор фундаментальных R&W;
      * "medium" — есть частичные пробелы, но покрыта большая часть фундаментальных рисков;
      * "high" — отсутствуют или слабо сформулированы ключевые фундаментальные заверения.
    - В "reason" кратко опиши, какие фундаментальные R&W покрыты/не покрыты
      и как это влияет на риск для Target (желательно с короткими цитатами из текста).
    </instructions>

    <edge_cases>
    Обрабатывай пограничные ситуации так:

    - R&W сгруппированы общим блоком и содержат только часть фундаментальных заверений
      (например, есть статус и полномочия, но нет явного title или no conflict):
      по каждому подпункту ставь отдельные значения present/missing/unclear,
      а не одно общее для всех.

    - Сильный блок по title (good and marketable title, free and clear), но слабые
      или общие формулировки по compliance with laws:
      rw_title_to_shares_or_assets = "present",
      rw_compliance_with_laws оцени отдельно по конкретике (present или unclear).

    - Фрагменты показывают, что R&W ограничены только не фундаментальными вопросами
      (операционные детали, мелкие риски), без охвата статуса/полномочий/title:
      большинство фундаментальных полей будет "missing",
      общий риск, как правило, "high".

    - Текст фрагментарный (видно "represents and warrants", но не раскрыт контент
      фундаментальных заверений):
      по каждому полю используй "unclear", а в reason поясни, что фрагментов недостаточно.

    - Пустые или явно нерелевантные фрагменты:
      все поля по R&W = "unclear",
      overall_risk_level = "medium",
      reason = "Недостаточно данных для анализа фундаментальных заверений и гарантий."
    </edge_cases>

    <output_expectations>
    На основе твоего анализа отдельный механизм извлечения сформирует
    структурированные поля по заранее заданной схеме. Твоя задача —
    давать чёткие юридические выводы и указывать конкретные формулировки
    из текста, на которых они основаны.
    </output_expectations>
  prompt_file: null
  context_k: 4
  temperature: 0.0
  max_tokens: 512

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  context_k: 4
  max_chunks: 8
  boost_keywords:
    - "represents and warrants"
    - "заверяет и гарантирует"
    - "validly existing"
    - "duly authorized"
    - "good and marketable title"
    - "no conflict"
  rerank: true
  filters: {}

conditional: null

extraction:
  enabled: true
  mode: "hybrid"
  fields:
    - name: "rw_status_and_existence"
      type: "string"
      allowed_values:
        - "present"
        - "missing"
        - "unclear"

    - name: "rw_authority_and_capacity"
      type: "string"
      allowed_values:
        - "present"
        - "missing"
        - "unclear"

    - name: "rw_title_to_shares_or_assets"
      type: "string"
      allowed_values:
        - "present"
        - "missing"
        - "unclear"

    - name: "rw_no_conflicts"
      type: "string"
      allowed_values:
        - "present"
        - "missing"
        - "unclear"

    - name: "rw_compliance_with_laws"
      type: "string"
      allowed_values:
        - "present"
        - "missing"
        - "unclear"

    - name: "overall_risk_level"
      type: "string"
      allowed_values:
        - "low"
        - "medium"
        - "high"

    - name: "reason"
      type: "string"

  store_payload: true

red_flags:
  items:
    - code: "RW1"
      description: "Отсутствуют или крайне слабые фундаментальные R&W по статусу, полномочиям и праву собственности."
