id: "rw_fundamental"
name: "Фундаментальные заверения и гарантии"
description: >
  Анализирует фундаментальные R&W: статус и существование компании,
  полномочия на заключение договора, право собственности (title),
  отсутствие конфликтов, соответствие законам.

  Оценивает полноту покрытия, наличие qualifiers (knowledge,
  materiality) и общий уровень защиты.

  Специальные R&W по конкретным зонам риска (налоги, санкции,
  судебные споры, IP) и сроки действия анализируются чеком
  rw_specific_and_survival.

doc_types: []

severity: "high"
severity_if_fail: "critical"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"
ui_mode: "field_extraction"

rules:
  keyword_mode: any

  keywords:
    high:
      # Прямые R&W формулировки
      - "(?i)represents?\\s+and\\s+warrants?"
      - "(?i)заверя[ею]т\\s+и\\s+гарантиру[ею]т"
      - "(?i)representations?\\s+and\\s+warranties"
      - "(?i)заверени[яи]\\s+и\\s+гарантии"
      - "(?i)\\bR&W\\b"

      # Статус и существование
      - "(?i)duly\\s+(organized|incorporated|formed)"
      - "(?i)validly\\s+existing"
      - "(?i)good\\s+standing"
      - "(?i)надлежащим\\s+образом\\s+(учрежден|создан|зарегистрирован)"

      # Полномочия
      - "(?i)duly\\s+authorized"
      - "(?i)full\\s+(corporate\\s+)?(power|authority)"
      - "(?i)valid\\s+and\\s+binding\\s+obligation"
      - "(?i)enforceable\\s+against"
      - "(?i)надлежащ[а-я]+\\s+уполномочен"
      - "(?i)полномочи[яи]\\s+на\\s+заключени[ея]"

      # Title / право собственности
      - "(?i)good\\s+and\\s+marketable\\s+title"
      - "(?i)clear\\s+title"
      - "(?i)free\\s+and\\s+clear"
      - "(?i)право\\s+собственности[\\s\\S]{0,30}свободн"
      - "(?i)свободн[оа]\\s+от\\s+обременени[йя]"
      - "(?i)без\\s+залогов\\s+и\\s+обременени[йя]"

      # No conflict
      - "(?i)no\\s+conflict"
      - "(?i)will\\s+not\\s+conflict"
      - "(?i)does\\s+not\\s+violate"
      - "(?i)отсутстви[ея]\\s+конфликт[ао]"
      - "(?i)не\\s+противоречит"
      - "(?i)не\\s+нарушает\\s+(устав|договор|законодательств)"

      # Compliance with laws (general)
      - "(?i)compliance\\s+with\\s+(all\\s+)?applicable\\s+(laws?|legislation)"
      - "(?i)no\\s+material\\s+violation"
      - "(?i)соответств[а-я]+\\s+применим[а-я]+\\s+(прав|законодательств)"
      - "(?i)отсутстви[ея]\\s+существенн[а-я]+\\s+нарушени[йя]"

    medium:
      # Общие R&W термины
      - "(?i)represents?"
      - "(?i)warrants?"
      - "(?i)заверя[ею]т"
      - "(?i)гарантиру[ею]т"
      - "(?i)representation"
      - "(?i)warranty"
      - "(?i)заверени[ея]"
      - "(?i)гаранти[яию]"

      # Knowledge qualifiers
      - "(?i)to\\s+the\\s+(best\\s+of\\s+)?(its?|seller'?s?)\\s+knowledge"
      - "(?i)по\\s+(наилучшему\\s+)?сведени[яиям]"
      - "(?i)насколько\\s+известно"
      - "(?i)so\\s+far\\s+as\\s+[\\s\\S]{0,20}(aware|known)"

      # Materiality qualifiers
      - "(?i)in\\s+all\\s+material\\s+respects"
      - "(?i)во\\s+всех\\s+существенных\\s+отношениях"
      - "(?i)material(ly)?"

      # Disclosed exceptions
      - "(?i)except\\s+as\\s+disclosed"
      - "(?i)за\\s+исключением\\s+раскрыт"
      - "(?i)other\\s+than\\s+as\\s+set\\s+forth"

      # Обременения
      - "(?i)encumbrance"
      - "(?i)lien"
      - "(?i)security\\s+interest"
      - "(?i)обременени[ея]"
      - "(?i)залог"

    low:
      - "(?i)represents?\\s+and\\s+warrants?"
      - "(?i)заверени[яи]\\s+и\\s+гарантии"
      - "(?i)duly\\s+authorized"
      - "(?i)good\\s+standing"
      - "(?i)free\\s+and\\s+clear"
      - "(?i)no\\s+conflict"
      - "(?i)no\\s+material\\s+violation"
      - "(?i)to\\s+the\\s+best\\s+of\\s+knowledge"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 640

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  context_k: 5
  max_chunks: 10
  boost_keywords:
    - "represents and warrants"
    - "заверяет и гарантирует"
    - "representations and warranties"
    - "заверения и гарантии"
    - "duly organized"
    - "validly existing"
    - "good standing"
    - "duly authorized"
    - "full power and authority"
    - "valid and binding"
    - "good and marketable title"
    - "free and clear"
    - "право собственности"
    - "свободно от обременений"
    - "no conflict"
    - "does not violate"
    - "отсутствие конфликта"
    - "compliance with applicable law"
    - "no material violation"
    - "to the best of knowledge"
    - "except as disclosed"
  rerank: true
  filters: {}

conditional: null

enrichment_hints:
  preferred_segment_types:
    - "contract"
    - "amendment"
    - "annex"
  excluded_segment_types:
    - "technical_specification"
    - "price_list"
    - "invoice"
    - "act"
    - "schedule"
  preferred_clause_functions:
    - "representations_warranties"
    - "general_provisions"
  confidence_bonus_on_match: 0.10
  confidence_penalty_on_excluded_segment: 0.15

extraction:
  enabled: true
  mode: "hybrid"
  llm_max_tokens: 440
  llm_prompt_extraction: |
    <role>
    Ты — юрист по M&A.
    Твоя задача — точно извлечь из текста наличие и качество
    фундаментальных R&W:
    1) статус и существование компании;
    2) полномочия;
    3) право собственности (title);
    4) отсутствие конфликтов;
    5) соответствие законам.

    Специальные R&W (налоги, санкции, споры, IP) и сроки
    действия анализируются отдельным чеком rw_specific_and_survival.
    </role>

    <context>
    Ниже приведены релевантные фрагменты договора:

    {context}
    </context>

    <task>
    Заполни только следующие поля:
    - rw_fundamental_display
    - rw_status_existence
    - rw_authority
    - rw_title
    - rw_no_conflicts
    - rw_compliance
    - has_knowledge_qualifiers
    - has_materiality_qualifiers
    - has_disclosed_exceptions
    - red_flags
    - reason

    Важно:
    - не анализируй специальные R&W (налоги, санкции, споры, IP) —
      это задача чека rw_specific_and_survival;
    - пиши user-facing значения коротко и по-русски.
    </task>

    <instructions>
    Шаг 1 — СТАТУС И СУЩЕСТВОВАНИЕ

    Заполни поле "rw_status_existence".

    Значения:
    - "present" — заверения о duly organized / validly existing /
      good standing есть.
    - "missing" — отсутствуют.
    - "unclear" — неясно.

    Шаг 2 — ПОЛНОМОЧИЯ

    Заполни поле "rw_authority".

    Значения:
    - "present" — есть: duly authorized, full power and authority,
      получены все корпоративные одобрения, договор является
      valid and binding / enforceable.
    - "missing" — отсутствуют.
    - "unclear" — неясно.

    Шаг 3 — ПРАВО СОБСТВЕННОСТИ (TITLE)

    Заполни поле "rw_title".

    Значения:
    - "present" — good and marketable title / free and clear /
      право собственности без обременений.
    - "missing" — отсутствует.
    - "unclear" — неясно.

    Шаг 4 — ОТСУТСТВИЕ КОНФЛИКТОВ

    Заполни поле "rw_no_conflicts".

    Значения:
    - "present" — заключение / исполнение договора: не нарушает
      устав, не противоречит существенным договорам, не приведёт
      к дефолту по другим обязательствам.
    - "missing" — отсутствует.
    - "unclear" — неясно.

    Шаг 5 — СООТВЕТСТВИЕ ЗАКОНАМ (GENERAL)

    Заполни поле "rw_compliance".

    Это именно general compliance with applicable law,
    а не специальные R&W (налоги, санкции, комплаенс).

    Значения:
    - "present" — no material violations of applicable law,
      in compliance with applicable law.
    - "missing" — отсутствует.
    - "unclear" — неясно.

    Шаг 6 — KNOWLEDGE QUALIFIERS

    Заполни поле "has_knowledge_qualifiers".

    Значения:
    - "yes" — knowledge qualifiers применяются к фундаментальным
      R&W (title, authority, status, no conflict) — это нестандартно
      и опасно.
    - "no" — не применяются.
    - "unclear" — неясно.

    Шаг 7 — MATERIALITY QUALIFIERS

    Заполни поле "has_materiality_qualifiers".

    Значения:
    - "excessive" — materiality qualifiers чрезмерны и ослабляют
      защиту.
    - "standard" — стандартные/приемлемые (например, "no material
      violation" на compliance).
    - "none" — отсутствуют.
    - "unclear" — неясно.

    Шаг 8 — DISCLOSED EXCEPTIONS

    Заполни поле "has_disclosed_exceptions".

    Значения:
    - "yes" — есть "except as disclosed in Disclosure Schedule"
      или аналогичные.
    - "no" — нет.
    - "unclear" — неясно.

    Шаг 9 — RED FLAGS

    Заполни поле "red_flags".

    Используй:
    - "NONE" — все фундаментальные R&W присутствуют,
      qualifiers стандартные.
    - "UNCLEAR" — данных недостаточно.
    - Коды через запятую:
      * RW1 — отсутствуют или крайне слабые фундаментальные R&W
        по статусу, полномочиям и праву собственности.
      * RW2 — фундаментальные R&W существенно ослаблены knowledge
        qualifiers (применяются к title, authority или status).
      * RW3 — критичные пробелы: no conflicts и/или general
        compliance R&W отсутствуют при наличии остальных.

    Шаг 10 — USER-FACING SUMMARY

    Заполни поле "rw_fundamental_display".

    Примеры:
    - "Фундаментальные R&W полные: статус, полномочия, title,
       no conflict, compliance"
    - "Отсутствуют: title; no conflict; остальные есть"
    - "Knowledge qualifiers на title — нестандартно"
    - "Не удалось определить фундаментальные R&W"

    Правила:
    - Отрази: покрытие (полное / частичное) и ключевые проблемы.
    - Если всё unclear:
      "Не удалось определить фундаментальные R&W"

    Шаг 11 — ОБОСНОВАНИЕ

    Заполни поле "reason".

    Правила:
    - 1–2 коротких предложения.
    - Укажи: какие R&W покрыты / не покрыты, qualifiers, почему
      red_flags.
    - Приведи короткую цитату в кавычках.
    - Если NONE — полный стандартный набор.
    </instructions>

    <edge_cases>
    - Только status и authority, нет title и no conflict:
      * rw_title = "missing"
      * rw_no_conflicts = "missing"
      * red_flags включает "RW3"

    - Knowledge qualifier на title ("to Seller's knowledge,
       Seller has good title"):
      * rw_title = "present"
      * has_knowledge_qualifiers = "yes"
      * red_flags включает "RW2"

    - "Except as disclosed in the Disclosure Schedule":
      * has_disclosed_exceptions = "yes"
      * стандартное исключение, не считается ослаблением

    - "In all material respects" на compliance:
      * has_materiality_qualifiers = "standard"
      * rw_compliance = "present"

    - Нет ни одного фундаментального R&W:
      * все поля = "missing"
      * red_flags = "RW1"

    - Нет релевантных фрагментов:
      * все поля = "unclear"
      * red_flags = "UNCLEAR"
      * rw_fundamental_display =
        "Не удалось определить фундаментальные R&W"
    </edge_cases>

    <output_expectations>
    Все значения должны быть короткими, точными и пригодными
    для отображения пользователю в DD Grid.
    Не добавляй никаких полей, кроме указанных в схеме extraction.
    </output_expectations>

  fields:
    - name: "rw_fundamental_display"
      type: "string"
      description: "Фундаментальные R&W: краткий вывод"

    - name: "rw_status_existence"
      type: "string"
      description: "Статус и существование компании"
      allowed_values:
        - "present"
        - "missing"
        - "unclear"

    - name: "rw_authority"
      type: "string"
      description: "Полномочия"
      allowed_values:
        - "present"
        - "missing"
        - "unclear"

    - name: "rw_title"
      type: "string"
      description: "Право собственности (title)"
      allowed_values:
        - "present"
        - "missing"
        - "unclear"

    - name: "rw_no_conflicts"
      type: "string"
      description: "Отсутствие конфликтов"
      allowed_values:
        - "present"
        - "missing"
        - "unclear"

    - name: "rw_compliance"
      type: "string"
      description: "Соответствие применимым законам (general)"
      allowed_values:
        - "present"
        - "missing"
        - "unclear"

    - name: "has_knowledge_qualifiers"
      type: "string"
      description: "Knowledge qualifiers на фундаментальных R&W"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "has_materiality_qualifiers"
      type: "string"
      description: "Materiality qualifiers"
      allowed_values:
        - "excessive"
        - "standard"
        - "none"
        - "unclear"

    - name: "has_disclosed_exceptions"
      type: "string"
      description: "Disclosed exceptions (Disclosure Schedule)"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "red_flags"
      type: "string"
      description: "Коды рисков"

    - name: "reason"
      type: "string"
      description: "Обоснование"

  store_payload: true


  