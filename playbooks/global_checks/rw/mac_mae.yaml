id: "mac_mae"
name: "MAC/MAE (существенное неблагоприятное изменение)"
description: >
  Анализирует наличие и содержание MAC/MAE-клауз:
  определение «существенного неблагоприятного изменения», исключения
  и последствия (право расторжения, пересмотр цены, приостановка).

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"

rules:
  keywords:
    - "material adverse change"
    - "material adverse effect"
    - "MAC"
    - "MAE"
    - "существенное неблагоприятное изменение"
    - "существенное неблагоприятное воздействие"
    - "adverse change"
    - "adverse effect"
  keyword_mode: "any"
  regex_patterns: []
  clause_patterns: []

llm:
  prompt_template: |
    <role>
    Ты — юрист по M&A и финансированию.
    Твоя специализация — MAC/MAE-клаузы и их влияние на сделки и финансирование.
    </role>

    <context>
    Ниже приведены фрагменты договора с возможными MAC/MAE-положениями:

    {context}
    </context>

    <instructions>
    Проведи анализ по шагам. Каждый шаг логически связан с одним или
    несколькими полями итоговой оценки.

    Шаг 1 — НАЛИЧИЕ MAC/MAE-КЛАУЗЫ
    (используется для "has_mac_or_mae"):
    - Определи, есть ли в тексте:
      * определения material adverse change / material adverse effect;
      * русские эквиваленты (существенное неблагоприятное изменение/воздействие);
      * ссылки на MAC/MAE как на отдельное условие или событие.
    - Сформулируй вывод:
      * "yes" — если определение или явная MAC/MAE-клауза присутствует;
      * "no" — если прямо указано, что специальных MAC/MAE-условий нет;
      * "unclear" — если по фрагментам это неясно.

    Шаг 2 — ОПРЕДЕЛЕНИЕ MAC/MAE
    (используется для "definition_summary"):
    - Кратко опиши, что считается MAC/MAE:
      * какие аспекты охватываются (финансовые показатели, активы, обязательства,
        правовой статус, бизнес/операции Target, способность исполнять договор);
      * есть ли:
        - тесты существенности (materiality),
        - временной горизонт,
        - количественные или качественные пороги.
    - Сделай краткое текстовое резюме определения без юридического копипаста.

    Шаг 3 — CARVE-OUT ДЛЯ ОТРАСЛЕВЫХ/МАКРОИЗМЕНЕНИЙ
    (используется для "has_industry_or_macro_carveouts"):
    - Определи, исключены ли из MAC/MAE:
      * отраслевые изменения (industry-wide);
      * общие макроэкономические изменения;
      * изменения на рынках капитала, валютный курс, инфляция, пандемии,
        политические события и т.п., если они не специфичны для Target.
    - Сформулируй вывод: "yes" / "no" / "unclear" в зависимости от явных формулировок.

    Шаг 4 — CARVE-OUT ДЛЯ ИЗМЕНЕНИЙ ЗАКОНОДАТЕЛЬСТВА
    (используется для "has_law_change_carveouts"):
    - Проверь, есть ли отдельное исключение, что:
      * изменения законов, регулирования, accounting standards и т.п.
        не считаются MAC/MAE,
      * кроме случаев, когда они непропорционально затрагивают Target
        (если это прямо оговорено).
    - Зафиксируй наличие/отсутствие carve-out как "yes" / "no" / "unclear".

    Шаг 5 — ПОСЛЕДСТВИЯ MAC/MAE
    (используется для "effects_on_deal"):
    - Определи, какие права возникают при наступлении MAC/MAE:
      * право выйти из сделки / отказаться от closing (termination);
      * право пересмотреть цену (price_adjustment);
      * право приостановить исполнение (suspension);
      * комбинация нескольких механизмов — "mixed";
      * отсутствие специальных последствий — "none";
      * если по фрагментам неясно — "unclear".
    - Учитывай, используется ли MAC/MAE как condition precedent до closing
      или также после закрытия.

    Шаг 6 — ОБЩИЙ БАЛАНС И РИСК ДЛЯ TARGET
    (используется для "overall_risk_level" и "reason"):
    - Оцени общий уровень риска для Target, учитывая:
      * широту и субъективность определения MAC/MAE (например,
        по усмотрению покупателя);
      * наличие или отсутствие carve-out для отраслевых/макроизменений
        и изменений законодательства;
      * перечень последствий и то, кто фактически получает рычаг
        (покупатель, кредитор, другая сторона).
    - Сформулируй общий риск как "low" / "medium" / "high".
    - В "reason" кратко обоснуй вывод, ссылаясь на ключевые формулировки
      (желательно с короткими цитатами), и поясни, почему конкретная
      MAC/MAE-конструкция усиливает или снижает риск для Target.
    </instructions>

    <edge_cases>
    Обрабатывай пограничные ситуации так:

    - Очень широкое и субъективное определение ("any adverse change"
      без materiality, без carve-out) плюс право контрагента свободно
      расторгнуть или пересмотреть цену:
      отражай это как повышенный риск для Target.

    - MAC/MAE ограничен существенными изменениями, специфичными для Target,
      с carve-out для отраслевых/макроизменений и изменений законов:
      воспринимай это как более сбалансированную конструкцию, риск может быть
      "medium" или "low" в зависимости от последствий.

    - MAC/MAE используется только как условие закрытия (condition precedent)
      без отдельного права одностороннего расторжения после closing:
      в "effects_on_deal" можно указать "mixed" и раскрыть детали в reason.

    - Текст фрагментарный: есть упоминание MAC/MAE, но непонятно определение
      или последствия:
      фиксируй наличие MAC/MAE, но оставляй конкретные характеристики
      и риск как "unclear", явно описывая, каких данных не хватает.

    - Пустые или явно нерелевантные фрагменты:
      укажи, что данных недостаточно для анализа MAC/MAE-клауз и их последствий,
      и объясни, как это влияет на неопределённость и оценку риска.
    </edge_cases>

    <output_expectations>
    На основе твоего анализа отдельный механизм извлечения сформирует
    структурированные поля по заранее заданной схеме. Твоя задача —
    давать чёткие юридические выводы и указывать конкретные формулировки
    из текста, на которых они основаны.
    </output_expectations>
  prompt_file: null
  context_k: 4
  temperature: 0.0
  max_tokens: 512

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 500

retrieval:
  context_k: 4
  max_chunks: 8
  boost_keywords:
    - "material adverse change"
    - "material adverse effect"
    - "существенное неблагоприятное изменение"
  rerank: true
  filters: {}

conditional: null

extraction:
  enabled: true
  mode: "hybrid"
  fields:
    - name: "has_mac_or_mae"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "definition_summary"
      type: "string"

    - name: "has_industry_or_macro_carveouts"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "has_law_change_carveouts"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "effects_on_deal"
      type: "string"
      allowed_values:
        - "none"
        - "termination"
        - "price_adjustment"
        - "suspension"
        - "mixed"
        - "unclear"

    - name: "overall_risk_level"
      type: "string"
      allowed_values:
        - "low"
        - "medium"
        - "high"

    - name: "reason"
      type: "string"

  store_payload: true

red_flags:
  items:
    - code: "MAC1"
      description: "MAC/MAE даёт контрагенту очень широкое право выйти или пересмотреть цену при любых неблагоприятных новостях."
    - code: "MAC2"
      description: "Отсутствуют carve-out для отраслевых/макроэкономических изменений."
