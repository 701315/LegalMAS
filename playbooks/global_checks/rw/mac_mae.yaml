id: "mac_mae"
name: "MAC/MAE (существенное неблагоприятное изменение)"
group: "Represents and warrants"
description: >
  Анализирует наличие и содержание MAC/MAE-клауз (Material Adverse
  Change / Material Adverse Effect): определение «существенного
  неблагоприятного изменения», охват, carve-outs (отраслевые /
  макроизменения, изменения законов), последствия (расторжение,
  пересмотр цены, приостановка) и баланс между сторонами.

  Формирует краткий user-facing вывод и оценивает риск применения
  MAC/MAE против Target.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"
ui_mode: "field_extraction"

rules:
  keyword_mode: any

  keywords:
    high:
      # Прямые MAC/MAE определения
      - "(?i)material\\s+adverse\\s+change"
      - "(?i)material\\s+adverse\\s+effect"
      - "(?i)\\bMAC\\b"
      - "(?i)\\bMAE\\b"
      - "(?i)существенн[а-я]+\\s+неблагоприятн[а-я]+\\s+(изменен|воздейств|событ)"
      - "(?i)материальн[а-я]+\\s+неблагоприятн[а-я]+\\s+(изменен|воздейств)"

      # MAC/MAE как condition / trigger
      - "(?i)MAC\\s+(condition|event|trigger)"
      - "(?i)MAE\\s+(condition|event|trigger)"
      - "(?i)(condition\\s+precedent|closing\\s+condition)[\\s\\S]{0,40}(MAC|MAE|material\\s+adverse)"
      - "(?i)(termination|right\\s+to\\s+terminate)[\\s\\S]{0,40}(MAC|MAE|material\\s+adverse)"
      - "(?i)(расторж|прекращ|отказ)[\\s\\S]{0,40}существенн[а-я]+\\s+неблагоприятн"

      # Пересмотр цены при MAC
      - "(?i)price\\s+(adjustment|reduction)[\\s\\S]{0,40}(MAC|MAE|material\\s+adverse)"
      - "(?i)(MAC|MAE)[\\s\\S]{0,40}price\\s+(adjustment|reduction)"
      - "(?i)пересмотр\\s+цен[ыи][\\s\\S]{0,40}существенн[а-я]+\\s+неблагоприятн"

    medium:
      # Adverse change — общие
      - "(?i)adverse\\s+change"
      - "(?i)adverse\\s+effect"
      - "(?i)неблагоприятн[а-я]+\\s+(изменен|воздейств|событ)"
      - "(?i)негативн[а-я]+\\s+(изменен|воздейств|влиян)"

      # Carve-outs
      - "(?i)carve[-\\s]?out[\\s\\S]{0,30}(MAC|MAE|material\\s+adverse)"
      - "(?i)exception[s]?\\s+(to|from)\\s+[\\s\\S]{0,30}(MAC|MAE|material\\s+adverse)"
      - "(?i)shall\\s+not\\s+constitute\\s+[\\s\\S]{0,20}(MAC|MAE)"
      - "(?i)не\\s+считается\\s+[\\s\\S]{0,20}существенн[а-я]+\\s+неблагоприятн"

      # Отраслевые/макро carve-outs
      - "(?i)industry[-\\s]?wide\\s+(change|effect|condition)"
      - "(?i)general\\s+(economic|market)\\s+(condition|change)"
      - "(?i)макроэкономическ[а-я]+\\s+(изменен|условия|факторы)"
      - "(?i)pandemic"
      - "(?i)force\\s+majeure"

      # Изменения законодательства carve-out
      - "(?i)change[s]?\\s+(in|of)\\s+(law|legislation|regulation)"
      - "(?i)изменени[ея]\\s+(законодательств|законов|регулировани)"

      # Materiality threshold
      - "(?i)materiality\\s+(threshold|standard|test)"
      - "(?i)порог\\s+существенност[ьи]"

    low:
      - "(?i)material\\s+adverse\\s+change"
      - "(?i)material\\s+adverse\\s+effect"
      - "(?i)\\bMAC\\b"
      - "(?i)\\bMAE\\b"
      - "(?i)существенн[а-я]+\\s+неблагоприятн"
      - "(?i)carve[-\\s]?out[\\s\\S]{0,20}(MAC|MAE)"
      - "(?i)industry[-\\s]?wide"
      - "(?i)condition\\s+precedent[\\s\\S]{0,20}(MAC|MAE)"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 640

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  retrieval_profile: "warranties_check"
  context_k: 5
  max_chunks: 10

  retrieval_query: >
    MAC MAE material adverse change effect существенное неблагоприятное изменение 
    воздействие carve-out исключение price adjustment расторжение condition precedent

  boost_keywords:
    - "material adverse change"
    - "material adverse effect"
    - "MAC"
    - "MAE"
    - "существенное неблагоприятное изменение"
    - "существенное неблагоприятное воздействие"
    - "adverse change"
    - "adverse effect"
    - "carve-out"
    - "exception to MAC"
    - "исключения из MAC"
    - "industry-wide"
    - "general economic conditions"
    - "change in law"
    - "изменение законодательства"
    - "termination right"
    - "право расторжения"
    - "price adjustment"
    - "condition precedent"
    - "closing condition"
    - "shall not constitute MAC"
    - "не считается существенным неблагоприятным"

  negative_keywords:
    - "персональные данные"
    - "интеллектуальная собственность"
    - "конфиденциальная информация"
    - "коммерческая тайна"
    - "арбитражная оговорка"

  preferred_unit_types:
    - "definition"
    - "general_provision"
    - "general_provision"

  excluded_unit_types:
    - "technical_fragment"
    - "appendix_reference"
    - "structural_anchor"

  preferred_clause_functions:
    - "definitions"
    - "procedures"
    - "boilerplate"
    - "representations"

  position_bias:
    preferred_range: [0.0, 1.0]
    boost: 0.10
    scope: "segment"

  rerank: true
  filters: {}

conditional: null

enrichment_hints:
  preferred_segment_types:
    - "contract"
    - "amendment"
    - "annex"
  excluded_segment_types:
    - "technical_specification"
    - "price_list"
    - "invoice"
    - "act"
    - "schedule"
  preferred_clause_functions:
    - "procedures"
    - "representations"
    - "procedures"
  confidence_bonus_on_match: 0.10
  confidence_penalty_on_excluded_segment: 0.15

extraction:
  enabled: true
  mode: "hybrid"
  llm_max_tokens: 1050

  llm_prompt_extraction: |
    <role>
    Ты — юрист по M&A и договорным конструкциям.
    Твоя задача — точно извлечь из текста:
    1) есть ли MAC/MAE-клауза;
    2) есть ли количественные пороги;
    3) есть ли carve-out для отраслевых / макроизменений;
    4) есть ли carve-out для изменений законодательства;
    5) каковы последствия наступления MAC/MAE;
    6) в чью пользу работает клауза.

    КРИТИЧЕСКИ ВАЖНО:
    - Извлекай ТОЛЬКО то, что прямо написано в тексте.
    - НЕ додумывай carve-outs, если они не указаны явно.
    - НЕ считай общую ссылку на "adverse changes" автоматически
      MAC/MAE-клаузой — ищи явное определение или MAC/MAE-механизм.
    - Если информация отсутствует или неоднозначна —
      используй "unclear".
    </role>

    <context>
    Ниже приведены релевантные фрагменты договора:

    {context}
    </context>

    <context_rules>
    - Некоторые фрагменты могут быть нерелевантны — игнорируй их.
    - Если фрагменты противоречат друг другу — используй "unclear"
      и кратко объясни в reason.
    - Carve-out "full" — широкое исключение без оговорки
      о непропорциональном влиянии.
    - Carve-out "partial" — есть оговорка "except to the extent
      disproportionately affecting Target".
    - Если нет ни MAC/MAE-определения, ни явного MAC-механизма,
      ставь has_mac_mae = "no", а не "unclear".
    </context_rules>

    <task>
    Заполни только следующие поля:
    - mac_mae_display
    - has_mac_mae
    - has_quantitative_thresholds
    - has_industry_macro_carveouts
    - industry_macro_carveout_type
    - has_law_change_carveouts
    - effects_on_deal
    - mac_beneficiary
    - reason
    </task>

    <instructions>
    Шаг 1 — НАЛИЧИЕ MAC/MAE

    Заполни "has_mac_mae".

    Значения:
    - "yes" — определение MAC/MAE или явный MAC/MAE-механизм есть.
    - "no" — нет специальных MAC/MAE-условий.
    - "unclear" — нельзя надёжно определить по фрагментам.

    Шаг 2 — КОЛИЧЕСТВЕННЫЕ ПОРОГИ

    Заполни "has_quantitative_thresholds".

    Значения:
    - "yes" — конкретные суммы или проценты прямо указаны
      как часть MAC/MAE-определения.
    - "no" — MAC/MAE только качественный.
    - "unclear" — нельзя определить.

    Шаг 3 — CARVE-OUT ДЛЯ ОТРАСЛЕВЫХ / МАКРОИЗМЕНЕНИЙ

    Заполни "has_industry_macro_carveouts"
    и "industry_macro_carveout_type".

    Значения для has_industry_macro_carveouts:
    - "yes" — carve-out для industry-wide / macro conditions есть.
    - "no" — нет.
    - "unclear" — нельзя определить.

    Значения для industry_macro_carveout_type:
    - "full" — широкое исключение без оговорки о непропорциональности.
    - "partial" — есть оговорка "disproportionately affecting".
    - "not_applicable" — carve-out нет.
    - "unclear" — тип нельзя определить.

    Шаг 4 — CARVE-OUT ДЛЯ ИЗМЕНЕНИЙ ЗАКОНОДАТЕЛЬСТВА

    Заполни "has_law_change_carveouts".

    Значения:
    - "yes" — есть исключение для изменений законов /
      регулирования / стандартов учёта.
    - "no" — нет.
    - "unclear" — нельзя определить.

    Шаг 5 — ПОСЛЕДСТВИЯ MAC/MAE

    Заполни "effects_on_deal".

    Значения:
    - "none" — нет специальных последствий.
    - "termination" — право выйти из сделки.
    - "price_adjustment" — право пересмотреть цену.
    - "suspension" — право приостановить исполнение.
    - "acceleration" — право требовать досрочного исполнения.
    - "condition_only" — только как condition precedent.
    - "mixed" — комбинация механизмов.
    - "unclear" — нельзя определить.

    Шаг 6 — БЕНЕФИЦИАР MAC/MAE

    Заполни "mac_beneficiary".

    Значения:
    - "buyer" — покупатель.
    - "seller" — продавец.
    - "lender" — кредитор.
    - "mutual" — обе стороны.
    - "unclear" — нельзя определить.

    Шаг 7 — НОРМАЛИЗОВАННЫЙ DISPLAY ДЛЯ DD GRID

    Заполни "mac_mae_display".

    Это итоговое поле для таблицы.
    Строй его ТОЛЬКО на основе уже заполненных полей выше.
    Не добавляй информацию сверх них.

    Возможные состояния:
    1. MAC/MAE есть с конкретными параметрами:
       "MAC/MAE есть; нет carve-outs; право расторжения у покупателя"
    2. MAC/MAE есть с carve-outs:
       "MAC/MAE есть; carve-outs macro + закон; только condition"
    3. MAC/MAE нет:
       "MAC/MAE не обнаружен"
    4. Не удалось определить:
       "Не удалось определить наличие MAC/MAE"

    Правила:
    - Если has_mac_mae = "no":
      "MAC/MAE не обнаружен"
    - Если has_mac_mae = "unclear":
      "Не удалось определить наличие MAC/MAE"
    - Если has_mac_mae = "yes":
      * начни с "MAC/MAE есть"
      * если has_industry_macro_carveouts = "no":
        добавь "нет carve-outs"
      * если has_industry_macro_carveouts = "yes":
        добавь "carve-outs есть"
        + если industry_macro_carveout_type = "partial":
          уточни "carve-outs частичные"
      * добавь effects_on_deal кратко
      * если mac_beneficiary не "unclear":
        добавь бенефициара
    - Не более 3 коротких фактов через ";".

    Шаг 8 — КРАТКОЕ ОБОСНОВАНИЕ

    Заполни "reason".

    Правила:
    - Первое предложение — краткий вывод.
    - Второе — короткая цитата из текста (до 100 символов).
    - Пиши по-русски.
    </instructions>

    <edge_cases>
    - Carve-out: industry-wide + закон, condition only:
      * has_industry_macro_carveouts = "yes"
      * has_law_change_carveouts = "yes"
      * effects_on_deal = "condition_only"

    - "disproportionately affecting Target":
      * industry_macro_carveout_type = "partial"

    - Количественный порог (EBITDA > 20%):
      * has_quantitative_thresholds = "yes"

    - Нет MAC/MAE по тексту:
      * has_mac_mae = "no"
      * industry_macro_carveout_type = "not_applicable"
      * effects_on_deal = "none"
      * mac_mae_display = "MAC/MAE не обнаружен"

    - Нет релевантных фрагментов:
      * has_mac_mae = "unclear"
      * mac_mae_display = "Не удалось определить наличие MAC/MAE"
    </edge_cases>

    <output_expectations>
    - Верни результат строго в формате JSON.
    - Не оборачивай ответ в markdown-блоки.
    - Не добавляй комментариев вне JSON.
    - Для полей с allowed_values используй строго значения из списка.
    - Свободные текстовые поля (mac_mae_display, reason)
      заполняй на русском языке.
    - Не добавляй никаких полей, кроме указанных.

    Пример структуры ответа:
    {
      "mac_mae_display": "MAC/MAE есть; carve-outs частичные; право расторжения у покупателя",
      "has_mac_mae": "yes",
      "has_quantitative_thresholds": "no",
      "has_industry_macro_carveouts": "yes",
      "industry_macro_carveout_type": "partial",
      "has_law_change_carveouts": "yes",
      "effects_on_deal": "termination",
      "mac_beneficiary": "buyer",
      "reason": "..."
    }
    </output_expectations>

  fields:
    - name: "mac_mae_display"
      type: "string"
      presentation: "fact"
      label: "MAC/MAE"
      description: "Нормализованный user-facing вывод для DD Grid"
      display_in_grid: true
      display_priority: 1

    - name: "has_mac_mae"
      type: "string"
      presentation: "signal"
      description: "Наличие MAC/MAE-клаузы"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
      display_in_grid: false

    - name: "has_quantitative_thresholds"
      type: "string"
      presentation: "signal"
      description: "Количественные пороги MAC/MAE"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
      display_in_grid: false

    - name: "has_industry_macro_carveouts"
      type: "string"
      presentation: "signal"
      description: "Carve-out для отраслевых / макроизменений"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
      display_in_grid: false

    - name: "industry_macro_carveout_type"
      type: "string"
      presentation: "signal"
      description: "Тип macro carve-out"
      allowed_values:
        - "full"
        - "partial"
        - "not_applicable"
        - "unclear"
      display_in_grid: false

    - name: "has_law_change_carveouts"
      type: "string"
      presentation: "signal"
      description: "Carve-out для изменений законодательства"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
      display_in_grid: false

    - name: "effects_on_deal"
      type: "string"
      presentation: "signal"
      description: "Последствия наступления MAC/MAE"
      allowed_values:
        - "none"
        - "termination"
        - "price_adjustment"
        - "suspension"
        - "acceleration"
        - "condition_only"
        - "mixed"
        - "unclear"
      display_in_grid: false

    - name: "mac_beneficiary"
      type: "string"
      presentation: "signal"
      description: "Бенефициар MAC/MAE"
      allowed_values:
        - "buyer"
        - "seller"
        - "lender"
        - "mutual"
        - "unclear"
      display_in_grid: false

    - name: "reason"
      type: "string"
      presentation: "diagnostic"
      description: "Обоснование"
      display_in_grid: false

  store_payload: true


  
