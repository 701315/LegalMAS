id: "mac_mae"
name: "MAC/MAE (существенное неблагоприятное изменение)"
description: >
  Анализирует наличие и содержание MAC/MAE-клауз (Material Adverse
  Change / Material Adverse Effect): определение «существенного
  неблагоприятного изменения», охват, carve-outs (отраслевые /
  макроизменения, изменения законов), последствия (расторжение,
  пересмотр цены, приостановка) и баланс между сторонами.

  Формирует краткий user-facing вывод и оценивает риск применения
  MAC/MAE против Target.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"
ui_mode: "field_extraction"

rules:
  keyword_mode: any

  keywords:
    high:
      # Прямые MAC/MAE определения
      - "(?i)material\\s+adverse\\s+change"
      - "(?i)material\\s+adverse\\s+effect"
      - "(?i)\\bMAC\\b"
      - "(?i)\\bMAE\\b"
      - "(?i)существенн[а-я]+\\s+неблагоприятн[а-я]+\\s+(изменен|воздейств|событ)"
      - "(?i)материальн[а-я]+\\s+неблагоприятн[а-я]+\\s+(изменен|воздейств)"

      # MAC/MAE как condition / trigger
      - "(?i)MAC\\s+(condition|event|trigger)"
      - "(?i)MAE\\s+(condition|event|trigger)"
      - "(?i)(condition\\s+precedent|closing\\s+condition)[\\s\\S]{0,40}(MAC|MAE|material\\s+adverse)"
      - "(?i)(termination|right\\s+to\\s+terminate)[\\s\\S]{0,40}(MAC|MAE|material\\s+adverse)"
      - "(?i)(расторж|прекращ|отказ)[\\s\\S]{0,40}существенн[а-я]+\\s+неблагоприятн"

      # Пересмотр цены при MAC
      - "(?i)price\\s+(adjustment|reduction)[\\s\\S]{0,40}(MAC|MAE|material\\s+adverse)"
      - "(?i)(MAC|MAE)[\\s\\S]{0,40}price\\s+(adjustment|reduction)"
      - "(?i)пересмотр\\s+цен[ыи][\\s\\S]{0,40}существенн[а-я]+\\s+неблагоприятн"

    medium:
      # Adverse change — общие
      - "(?i)adverse\\s+change"
      - "(?i)adverse\\s+effect"
      - "(?i)неблагоприятн[а-я]+\\s+(изменен|воздейств|событ)"
      - "(?i)негативн[а-я]+\\s+(изменен|воздейств|влиян)"

      # Carve-outs
      - "(?i)carve[-\\s]?out[\\s\\S]{0,30}(MAC|MAE|material\\s+adverse)"
      - "(?i)exception[s]?\\s+(to|from)\\s+[\\s\\S]{0,30}(MAC|MAE|material\\s+adverse)"
      - "(?i)shall\\s+not\\s+constitute\\s+[\\s\\S]{0,20}(MAC|MAE)"
      - "(?i)не\\s+считается\\s+[\\s\\S]{0,20}существенн[а-я]+\\s+неблагоприятн"

      # Отраслевые/макро carve-outs
      - "(?i)industry[-\\s]?wide\\s+(change|effect|condition)"
      - "(?i)general\\s+(economic|market)\\s+(condition|change)"
      - "(?i)макроэкономическ[а-я]+\\s+(изменен|условия|факторы)"
      - "(?i)pandemic"
      - "(?i)force\\s+majeure"

      # Изменения законодательства carve-out
      - "(?i)change[s]?\\s+(in|of)\\s+(law|legislation|regulation)"
      - "(?i)изменени[ея]\\s+(законодательств|законов|регулировани)"

      # Materiality threshold
      - "(?i)materiality\\s+(threshold|standard|test)"
      - "(?i)порог\\s+существенност[ьи]"

    low:
      - "(?i)material\\s+adverse\\s+change"
      - "(?i)material\\s+adverse\\s+effect"
      - "(?i)\\bMAC\\b"
      - "(?i)\\bMAE\\b"
      - "(?i)существенн[а-я]+\\s+неблагоприятн"
      - "(?i)carve[-\\s]?out[\\s\\S]{0,20}(MAC|MAE)"
      - "(?i)industry[-\\s]?wide"
      - "(?i)condition\\s+precedent[\\s\\S]{0,20}(MAC|MAE)"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 640

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  context_k: 5
  max_chunks: 10
  boost_keywords:
    - "material adverse change"
    - "material adverse effect"
    - "MAC"
    - "MAE"
    - "существенное неблагоприятное изменение"
    - "существенное неблагоприятное воздействие"
    - "adverse change"
    - "adverse effect"
    - "carve-out"
    - "exception to MAC"
    - "исключения из MAC"
    - "industry-wide"
    - "general economic conditions"
    - "change in law"
    - "изменение законодательства"
    - "termination right"
    - "право расторжения"
    - "price adjustment"
    - "condition precedent"
    - "closing condition"
    - "shall not constitute MAC"
    - "не считается существенным неблагоприятным"
  rerank: true
  filters: {}

conditional: null

enrichment_hints:
  preferred_segment_types:
    - "contract"
    - "amendment"
    - "annex"
  excluded_segment_types:
    - "technical_specification"
    - "price_list"
    - "invoice"
    - "act"
    - "schedule"
  preferred_clause_functions:
    - "termination"
    - "representations_warranties"
    - "change_of_control"
  confidence_bonus_on_match: 0.10
  confidence_penalty_on_excluded_segment: 0.15

extraction:
  enabled: true
  mode: "hybrid"
  llm_max_tokens: 440
  llm_prompt_extraction: |
    <role>
    Ты — юрист по M&A и финансированию.
    Твоя задача — точно извлечь из текста:
    1) есть ли MAC/MAE-клауза;
    2) есть ли количественные пороги;
    3) есть ли carve-out для отраслевых / макроизменений;
    4) есть ли carve-out для изменений законодательства;
    5) каковы последствия наступления MAC/MAE;
    6) в чью пользу работает клауза.
    </role>

    <context>
    Ниже приведены релевантные фрагменты договора:

    {context}
    </context>

    <task>
    Заполни только следующие поля:
    - mac_mae_display
    - has_mac_mae
    - has_quantitative_thresholds
    - has_industry_macro_carveouts
    - industry_macro_carveout_type
    - has_law_change_carveouts
    - effects_on_deal
    - mac_beneficiary
    - red_flags
    - reason

    Важно:
    - не придумывай carve-outs если их нет в тексте;
    - пиши user-facing значения коротко и по-русски.
    </task>

    <instructions>
    Шаг 1 — НАЛИЧИЕ MAC/MAE

    Заполни поле "has_mac_mae".

    Значения:
    - "yes" — определение или явная MAC/MAE-клауза присутствует.
    - "no" — прямо указано, что специальных MAC/MAE-условий нет.
    - "unclear" — по фрагментам неясно.

    Шаг 2 — КОЛИЧЕСТВЕННЫЕ ПОРОГИ

    Заполни поле "has_quantitative_thresholds".

    Значения:
    - "yes" — есть конкретные суммы или проценты
      (снижение выручки на X%, потери более $Y и т.п.).
    - "no" — MAC/MAE чисто качественный.
    - "unclear" — неясно.

    Шаг 3 — CARVE-OUT ДЛЯ ОТРАСЛЕВЫХ / МАКРОИЗМЕНЕНИЙ

    Заполни поля "has_industry_macro_carveouts"
    и "industry_macro_carveout_type".

    Значения для has_industry_macro_carveouts:
    - "yes" — carve-out есть.
    - "no" — отсутствует.
    - "unclear" — неясно.

    Значения для industry_macro_carveout_type:
    - "full" — широкое исключение без оговорки
      о непропорциональном влиянии.
    - "partial" — есть оговорка "except to the extent such
      changes disproportionately affect Target".
    - "not_applicable" — carve-out нет.
    - "unclear" — неясно.

    Шаг 4 — CARVE-OUT ДЛЯ ИЗМЕНЕНИЙ ЗАКОНОДАТЕЛЬСТВА

    Заполни поле "has_law_change_carveouts".

    Значения:
    - "yes" — есть исключение для изменений законов /
      регулирования / accounting standards.
    - "no" — отсутствует.
    - "unclear" — неясно.

    Шаг 5 — ПОСЛЕДСТВИЯ MAC/MAE

    Заполни поле "effects_on_deal".

    Значения:
    - "none" — специальных последствий нет.
    - "termination" — право выйти из сделки / отказаться
      от closing.
    - "price_adjustment" — право пересмотреть цену.
    - "suspension" — право приостановить исполнение.
    - "acceleration" — право требовать досрочного исполнения.
    - "condition_only" — MAC/MAE только как condition precedent
      без отдельного termination права.
    - "mixed" — комбинация нескольких механизмов.
    - "unclear" — неясно.

    Шаг 6 — БЕНЕФИЦИАР MAC/MAE

    Заполни поле "mac_beneficiary".

    Значения:
    - "buyer" — покупатель получает право при MAC у Target.
    - "seller" — продавец.
    - "lender" — кредитор.
    - "mutual" — обе стороны.
    - "unclear" — неясно.

    Шаг 7 — RED FLAGS

    Заполни поле "red_flags".

    Используй:
    - "NONE" — MAC/MAE имеет разумное определение с materiality
      threshold, carve-outs для industry-wide и macro changes,
      сбалансированные последствия.
    - "UNCLEAR" — данных недостаточно.
    - Коды через запятую:
      * MAC1 — MAC/MAE даёт контрагенту очень широкое право
        выйти или пересмотреть цену при любых неблагоприятных
        событиях: определение широкое, нет materiality threshold,
        effects_on_deal = "termination" или "price_adjustment".
      * MAC2 — нет carve-outs для отраслевых / макроэкономических
        изменений: Target может быть обвинена в MAC из-за
        общего кризиса или отраслевого спада.
      * MAC3 — MAC/MAE чисто субъективный без количественных
        порогов: нет объективных критериев для оспаривания.

    Шаг 8 — USER-FACING SUMMARY

    Заполни поле "mac_mae_display".

    Примеры:
    - "MAC/MAE есть; нет carve-outs; право расторжения
       у покупателя"
    - "MAC/MAE есть; carve-outs для macro + закона;
       только condition precedent"
    - "MAC/MAE с порогом снижения EBITDA > 20%;
       carve-outs частичные"
    - "MAC/MAE не обнаружен"
    - "Не удалось определить наличие MAC/MAE"

    Правила:
    - Отрази максимум 3 ключевых факта через ";".
    - Если нет MAC/MAE: "MAC/MAE не обнаружен"
    - Если всё unclear: "Не удалось определить наличие MAC/MAE"

    Шаг 9 — ОБОСНОВАНИЕ

    Заполни поле "reason".

    Правила:
    - 1–2 коротких предложения.
    - Укажи: есть ли MAC/MAE, carve-outs, последствия,
      бенефициар, почему red_flags.
    - Приведи короткую цитату в кавычках.
    - Если NONE — почему конструкция сбалансирована.
    </instructions>

    <edge_cases>
    - Широкое субъективное определение + право расторжения
      + нет carve-outs:
      * red_flags = "MAC1, MAC2, MAC3"

    - MAC с carve-out для отраслевых / макроизменений и законов,
      только condition precedent:
      * has_industry_macro_carveouts = "yes"
      * effects_on_deal = "condition_only"
      * red_flags = "NONE" если определение разумное

    - Carve-out с оговоркой "disproportionately affecting Target":
      * has_industry_macro_carveouts = "yes"
      * industry_macro_carveout_type = "partial"
      * в reason: защита снижена, но не устранена

    - MAC только как condition precedent без termination:
      * effects_on_deal = "condition_only"
      * это снижает риск по сравнению с правом termination

    - Количественный порог (снижение EBITDA > 20%):
      * has_quantitative_thresholds = "yes"
      * red_flags не включает "MAC3"

    - MAC симметричный (оба покупатель и продавец):
      * mac_beneficiary = "mutual"

    - Нет релевантных фрагментов:
      * has_mac_mae = "unclear"
      * red_flags = "UNCLEAR"
      * mac_mae_display = "Не удалось определить наличие MAC/MAE"
    </edge_cases>

    <output_expectations>
    Все значения должны быть короткими, точными и пригодными
    для отображения пользователю в DD Grid.
    Не добавляй никаких полей, кроме указанных в схеме extraction.
    </output_expectations>

  fields:
    - name: "mac_mae_display"
      type: "string"
      description: "MAC/MAE: краткий вывод"

    - name: "has_mac_mae"
      type: "string"
      description: "Наличие MAC/MAE-клаузы"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "has_quantitative_thresholds"
      type: "string"
      description: "Количественные пороги"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "has_industry_macro_carveouts"
      type: "string"
      description: "Carve-out для отраслевых / макроизменений"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "industry_macro_carveout_type"
      type: "string"
      description: "Тип macro carve-out"
      allowed_values:
        - "full"
        - "partial"
        - "not_applicable"
        - "unclear"

    - name: "has_law_change_carveouts"
      type: "string"
      description: "Carve-out для изменений законодательства"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "effects_on_deal"
      type: "string"
      description: "Последствия наступления MAC/MAE"
      allowed_values:
        - "none"
        - "termination"
        - "price_adjustment"
        - "suspension"
        - "acceleration"
        - "condition_only"
        - "mixed"
        - "unclear"

    - name: "mac_beneficiary"
      type: "string"
      description: "Бенефициар MAC/MAE"
      allowed_values:
        - "buyer"
        - "seller"
        - "lender"
        - "mutual"
        - "unclear"

    - name: "red_flags"
      type: "string"
      description: "Коды рисков"

    - name: "reason"
      type: "string"
      description: "Обоснование"

  store_payload: true


  