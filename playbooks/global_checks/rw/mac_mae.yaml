id: "mac_mae"
name: "MAC/MAE (существенное неблагоприятное изменение)"
description: >
  Анализирует наличие и содержание MAC/MAE-клауз:
  определение «существенного неблагоприятного изменения», исключения
  и последствия (право расторжения, пересмотр цены, приостановка).

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"

rules:
  keywords:
    - "material adverse change"
    - "material adverse effect"
    - "MAC"
    - "MAE"
    - "существенное неблагоприятное изменение"
    - "существенное неблагоприятное воздействие"
    - "adverse change"
    - "adverse effect"
  keyword_mode: "any"
  regex_patterns: []
  clause_patterns: []

llm:
  prompt_template: |
    <role>
    Ты — юрист по M&A и финансированию.
    Твоя специализация — MAC/MAE-клаузы и их влияние на сделки и финансирование.
    </role>

    <context>
    Ниже приведены фрагменты договора с возможными MAC/MAE-положениями:

    {context}
    </context>

    <instructions>
    Определи:

    1) Наличие MAC/MAE-клаузы (has_mac_or_mae):
       - ищи определения material adverse change / material adverse effect
         и их русские эквиваленты (существенное неблагоприятное изменение/воздействие);
       - если определение явно присутствует — "yes",
         если явно указано, что MAC/MAE нет — "no",
         если по тексту неясно — "unclear".

    2) Кратко опиши определение (definition_summary):
       - на что именно смотрим: финансовые показатели, активы, обязательства,
         правовой статус, бизнес/операции Target, способность исполнять договор;
       - есть ли тесты существенности (materiality), временной горизонт, пороги.

    3) Carve-out для отраслевых/макроизменений (has_industry_or_macro_carveouts):
       - исключены ли из MAC/MAE:
         * изменения отрасли (industry-wide),
         * общие макроэкономические изменения,
         * изменения на рынках капитала, валютный курс, инфляция, пандемии,
           политические события, если они не носят специфичный характер для Target;
       - если такие carve-out явно прописаны — "yes",
         если MAC/MAE без carve-out — "no",
         если текста недостаточно — "unclear".

    4) Carve-out для изменений законодательства (has_law_change_carveouts):
       - есть ли отдельное исключение, что изменения законов, регулирования,
         accounting standards и т.п. не считаются MAC/MAE (кроме случаев,
         когда они непропорционально затрагивают Target).

    5) Последствия MAC/MAE (effects_on_deal):
       - какие права возникают у контрагента при наступлении MAC/MAE:
         * право выйти из сделки (termination),
         * право пересмотреть цену (price_adjustment),
         * право приостановить исполнение (suspension),
         * комбинация нескольких — "mixed",
         * отсутствие специальных последствий — "none",
         * если по фрагментам неясно — "unclear".

    6) Оцени баланс / риск для Target (overall_risk_level: low / medium / high):
       - учитывай широту определения MAC/MAE, наличие/отсутствие carve-out,
         перечень последствий и то, кто фактически получает рычаг.
    </instructions>

    <edge_cases>
    ВАЖНО — пограничные случаи:

    — Очень широкое определение ("any adverse change" без materiality, без
      carve-out) и право контрагента свободно расторгнуть или пересмотреть цену:
      has_mac_or_mae = "yes",
      has_industry_or_macro_carveouts = "no",
      overall_risk_level обычно "high".

    — MAC/MAE ограничен существенными изменениями, специфичными для Target,
      при этом есть carve-out для отраслевых/макроизменений и изменений законов:
      has_industry_or_macro_carveouts = "yes",
      has_law_change_carveouts = "yes",
      риск может быть "medium" или "low" в зависимости от последствий.

    — Если MAC/MAE используется только как условие закрытия (condition precedent)
      без прямого права одностороннего расторжения после closing:
      в effects_on_deal это можно отразить как "mixed" и описать в reason.

    — Если текст фрагментарный: есть упоминание MAC/MAE, но непонятно определение
      или последствия:
      has_mac_or_mae = "yes",
      другие поля при необходимости = "unclear",
      в reason явно укажи, чего не хватает.

    — Пустые или нерелевантные фрагменты:
      большинство полей = "unclear",
      overall_risk_level = "medium",
      reason = "Недостаточно данных для анализа MAC/MAE-клауз и их последствий."
    </edge_cases>

    <examples>
    ПРИМЕР 1 — ШИРОКИЙ MAC, БЕЗ CARVE-OUT, ПРАВО НА РАСТОРЖЕНИЕ (HIGH):

    Фрагмент: "Покупатель вправе отказаться от Завершения сделки, если до Closing
    произойдет любое неблагоприятное изменение в финансовом положении или
    деятельности Цели, которое Покупатель по своему усмотрению сочтет
    существенным (Material Adverse Change)."

    {{
      "has_mac_or_mae": "yes",
      "definition_summary": "Любое неблагоприятное изменение в финансовом положении или деятельности Target по усмотрению Покупателя.",
      "has_industry_or_macro_carveouts": "no",
      "has_law_change_carveouts": "unclear",
      "effects_on_deal": "termination",
      "overall_risk_level": "high",
      "reason": "Очень широкое определение MAC с субъективной оценкой Покупателя и правом отказаться от сделки без carve-out для отраслевых/макроизменений."
    }}

    ПРИМЕР 2 — СБАЛАНСИРОВАННЫЙ MAE С CARVE-OUT (MEDIUM):

    Фрагмент: "Material Adverse Effect означает такое изменение в бизнесе
    или финансовом состоянии Цели, которое существенно ухудшает ее способность
    выполнять обязательства по Договору, за исключением изменений отрасли,
    общих макроэкономических условий или изменений законодательства, влияющих
    на компании отрасли в целом."

    {{
      "has_mac_or_mae": "yes",
      "definition_summary": "Существенное ухудшение бизнеса или финансового состояния Target, влияющее на ее способность выполнять Договор.",
      "has_industry_or_macro_carveouts": "yes",
      "has_law_change_carveouts": "yes",
      "effects_on_deal": "mixed",
      "overall_risk_level": "medium",
      "reason": "Определение MAE ограничено существенным влиянием на исполнение Договора и содержит carve-out для отраслевых и законодательных изменений, что снижает риск для Target."
    }}

    ПРИМЕР 3 — ОТСУТСТВИЕ MAC/MAE (LOW):

    Фрагмент: "Договор не содержит специальных условий о существенном
    неблагоприятном изменении. Стороны руководствуются только общими
    положениями о нарушении договора."

    {{
      "has_mac_or_mae": "no",
      "definition_summary": "MAC/MAE-клауза отсутствует.",
      "has_industry_or_macro_carveouts": "unclear",
      "has_law_change_carveouts": "unclear",
      "effects_on_deal": "none",
      "overall_risk_level": "low",
      "reason": "Отсутствие MAC/MAE-клауз лишает контрагента дополнительного рычага для отказа от сделки или пересмотра цены при общих неблагоприятных изменениях."
    }}
    </examples>

    <output_format>
    Твой ответ ДОЛЖЕН быть строго валидным JSON-объектом со следующими
    полями:

    {{
      "has_mac_or_mae": "one of: yes | no | unclear",
      "definition_summary": "string — краткое описание определения MAC/MAE",
      "has_industry_or_macro_carveouts": "one of: yes | no | unclear",
      "has_law_change_carveouts": "one of: yes | no | unclear",
      "effects_on_deal": "one of: none | termination | price_adjustment | suspension | mixed | unclear",
      "overall_risk_level": "one of: low | medium | high",
      "reason": "string — краткое объяснение на русском с указанием ключевых формулировок MAC/MAE и их влияния на риски Target"
    }}

    Все перечисленные поля ДОЛЖНЫ присутствовать в JSON, даже если их значение равно null.
    </output_format>

    <constraints>
    ЖЁСТКИЕ ПРАВИЛА:
    1. Выведи ТОЛЬКО один JSON-объект. Никакого текста до или после.
    2. Не пиши "Вот JSON", "Here is the JSON" и т.п.
    3. Не используй Markdown, бэктики ``` или любые обёртки.
    4. Все строки — в двойных кавычках.
    5. Значения перечислимых полей — СТРОГО из указанных вариантов.
    6. Ключи — точно как указано, без добавления новых.
    7. Поле "reason" ДОЛЖНО содержать конкретные формулировки из фрагментов
       и оценку баланса/риска, а не общие фразы вроде "есть риски".
    8. Начни ответ сразу с символа {{
    9. Если по какому‑то полю нет достаточно информации в тексте —
       верни для него 'unclear' или null (для reason пустое значение
       недопустимо — нужно объяснение). НЕ придумывай значения, не интерполируй.
    </constraints>
  prompt_file: null
  context_k: 4
  temperature: 0.0
  max_tokens: 512

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 500

retrieval:
  context_k: 4
  max_chunks: 8
  boost_keywords:
    - "material adverse change"
    - "material adverse effect"
    - "существенное неблагоприятное изменение"
  rerank: true
  filters: {}

conditional: null

extraction:
  enabled: true
  mode: "hybrid"
  fields:
    - name: "has_mac_or_mae"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
    - name: "definition_summary"
      type: "string"
    - name: "has_industry_or_macro_carveouts"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
    - name: "has_law_change_carveouts"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
    - name: "effects_on_deal"
      type: "string"
      allowed_values:
        - "none"
        - "termination"
        - "price_adjustment"
        - "suspension"
        - "mixed"
        - "unclear"
    - name: "overall_risk_level"
      type: "string"
      allowed_values:
        - "low"
        - "medium"
        - "high"
    - name: "reason"
      type: "string"
  store_payload: true

red_flags:
  items:
    - code: "MAC1"
      description: "MAC/MAE даёт контрагенту очень широкое право выйти или пересмотреть цену при любых неблагоприятных новостях."
    - code: "MAC2"
      description: "Отсутствуют carve-out для отраслевых/макроэкономических изменений."
      