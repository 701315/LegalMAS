id: "ip_license_scope_and_usage"
name: "Условия и объём лицензии"
group: "IP"
description: >
  Анализирует параметры предоставляемой лицензии на ПО, технологии
  и иные IP-права: тип лицензии (exclusive / non-exclusive / sole),
  территорию, срок, field of use и функциональные ограничения,
  право на сублицензирование.

  Передаваемость лицензии при внутригрупповых передачах, M&A
  и поведение при смене контроля анализируются отдельным чеком
  ip_license_transferability_and_change_of_control.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"
ui_mode: "field_extraction"

rules:
  keyword_mode: any

  keywords:
    high:
      - "(?i)\\blicen[cs]e\\b"
      - "(?i)лицензи[яеию]"
      - "(?i)license\\s+agreement"
      - "(?i)лицензионн(ое|ого)\\s+соглашени"
      - "(?i)technology\\s+license"
      - "(?i)software\\s+license"
      - "(?i)non[-\\s]?exclusive\\s+license"
      - "(?i)exclusive\\s+license"
      - "(?i)sole\\s+license"
      - "(?i)исключительн(ая|ого)\\s+лицензи"
      - "(?i)неисключительн(ая|ого)\\s+лицензи"
      - "(?i)term\\s+of\\s+(the\\s+)?license"
      - "(?i)срок\\s+действия\\s+лицензи"
      - "(?i)perpetual\\s+license"
      - "(?i)бессрочн(ая|ого)\\s+лицензи"
      - "(?i)worldwide\\s+license"
      - "(?i)field\\s+of\\s+use"
      - "(?i)internal\\s+use\\s+only"
      - "(?i)только\\s+для\\s+внутреннего\\s+использовани"
      - "(?i)no\\s+right\\s+to\\s+(sublicense|resell|distribute)"
      - "(?i)reverse\\s+engineering"
      - "(?i)sublicen[cs]e"
      - "(?i)сублицензи[яеию]"

    medium:
      - "(?i)auto(matic)?\\s+renewal[\\s\\S]{0,20}license"
      - "(?i)автоматическ[оея]\\s+продлени[ея]\\s+лицензи"
      - "(?i)licensor\\s+may\\s+terminate"
      - "(?i)terminate\\s+(the\\s+)?license"
      - "(?i)прекращени[ея]\\s+лицензи"

    low:
      - "(?i)exclusive\\s+license"
      - "(?i)non[-\\s]?exclusive"
      - "(?i)field\\s+of\\s+use"
      - "(?i)sublicen[cs]e"
      - "(?i)perpetual\\s+license"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 700

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  retrieval_profile: "license_scope_check"
  context_k: 5
  max_chunks: 10

  retrieval_query: >
    лицензия лицензионное соглашение тип лицензии исключительная неисключительная
    срок лицензии field of use ограничения использования сублицензия

  boost_keywords:
    - "license"
    - "лицензия"
    - "non-exclusive license"
    - "exclusive license"
    - "sole license"
    - "term of the license"
    - "срок действия лицензии"
    - "perpetual license"
    - "бессрочная лицензия"
    - "worldwide"
    - "field of use"
    - "internal use only"
    - "только для внутреннего использования"
    - "sublicense"
    - "сублицензия"
    - "no right to sublicense"
    - "reverse engineering"

  negative_keywords:
    - "change of control"
    - "смена контроля"
    - "assignment"
    - "transfer of license"
    - "non-transferable"
    - "условия оплаты"
    - "форс-мажор"

  preferred_unit_types:
    - "general_provision"
    - "obligation"

  excluded_unit_types:
    - "structural_anchor"
    - "technical_fragment"
    - "appendix_reference"

  preferred_clause_functions:
    - "rights"
    - "limitations"

  position_bias:
    preferred_range: [0.0, 1.0]
    boost: 0.10
    scope: "segment"

  rerank: true
  filters: {}

conditional: null

enrichment_hints:
  preferred_segment_types:
    - "contract"
    - "annex"
    - "appendix"
    - "amendment"
  excluded_segment_types:
    - "technical_specification"
    - "price_list"
    - "invoice"
    - "act"
  confidence_bonus_on_match: 0.10
  confidence_penalty_on_excluded_segment: 0.15

extraction:
  enabled: true
  mode: "hybrid"
  llm_max_tokens: 1100

  presence_signal:
    field: "license_scope_status"
    present_values: ["present"]
    missing_values: ["missing"]
    unclear_values: ["unclear"]

  llm_prompt_extraction: |
    <role>
    Ты — юрист по IP и лицензированию.
    Твоя задача — точно извлечь из текста:
    1) есть ли в договоре регулирование лицензии;
    2) если есть — параметры лицензии:
       - тип (exclusive / non-exclusive / sole);
       - территорию;
       - срок;
       - ограничения field of use;
       - право на сублицензирование.

    КРИТИЧЕСКИ ВАЖНО:
    - Извлекай ТОЛЬКО то, что прямо написано в тексте.
    - НЕ предполагай тип лицензии, если он не указан явно.
    - НЕ анализируй передаваемость лицензии, M&A и CoC —
      это задача отдельного чека
      ip_license_transferability_and_change_of_control.
    - Если раздел о лицензии в договоре отсутствует —
      license_scope_status = "missing".
    - Если тексты о лицензии есть, но вывод сделать нельзя —
      license_scope_status = "unclear".
    </role>

    <context_rules>
    - Некоторые фрагменты могут быть нерелевантны — игнорируй их.
    - Если фрагменты противоречат друг другу — используй "unclear"
      и объясни в reason.
    - "Exclusive" = только один лицензиат, licensor не может
      выдавать другим. "Sole" = licensor тоже может использовать.
      "Non-exclusive" = без ограничений для licensor.
    - Field of use restrictions: "internal use only", запрет SaaS /
      resale / embedding / modification / reverse engineering.
    - Сублицензирование: только если есть явное право.
    - Если ни один фрагмент не содержит информации о лицензии
      (нет упоминаний grant of license / лицензии / лицензионного
      договора) — license_scope_status = "missing", location = null.
      Не использовать "unclear" при полном отсутствии релевантных
      фрагментов.
    </context_rules>

    <context>
    Ниже приведены релевантные фрагменты договора:

    {context}
    </context>

    <task>
    Заполни только следующие поля:
    - license_scope_display
    - license_scope_status
    - license_type
    - territory_scope
    - term_type
    - term_value
    - field_of_use_restrictions
    - has_sublicense_rights
    - reason
    </task>

    <location_instructions>
    Для каждого поля по возможности укажи location в формате:
    {"clause_ref": "п. 12.1", "page": 7, "quote": "дословная фраза из договора"}

    Правила:
    - clause_ref — короткая ссылка на пункт / раздел / статью именно в том
      виде, как она написана в договоре;
    - page — целое число страницы;
    - quote — дословная фраза из текста договора (НЕ пересказ, НЕ парафраз).
      Копируй её посимвольно, сохраняя формулировку и порядок слов.
      Оптимальная длина: 30–300 символов.
    - Для synthesized-полей (license_scope_display, reason)
      location ВСЕГДА null.
    - Для term_value — quote обязательна при term_type = "fixed_term"
      или "auto_renewable" (дата / срок прямо в тексте).
    - Для license_scope_status = "missing" — location = null.
    - Для license_scope_status = "present" / "unclear" — quote
      с наиболее релевантной фразой договора (grant of license).
    - Для license_type, territory_scope, term_type,
      field_of_use_restrictions, has_sublicense_rights:
      * если значение определённое (exclusive / worldwide / perpetual /
        yes и т.п.) — quote с фразой-основанием;
      * если значение = "unclear" (не указано в тексте) — location = null;
      * для has_sublicense_rights = "no":
        - если договор ПРЯМО запрещает («Sublicensing is not permitted»,
          «Сублицензирование не допускается») — quote ОБЯЗАТЕЛЬНА;
        - если просто не упоминается — location = null.
    - Не выдумывай location или quote. Если дословную фразу определить
      нельзя — location = null.
    </location_instructions>

    <instructions>
    Шаг 0 — НАЛИЧИЕ РЕГУЛИРОВАНИЯ ЛИЦЕНЗИИ

    Заполни "license_scope_status".

    Значения:
    - "present" — если договор содержит substantive положения
      о лицензии:
      * license_type ∈ {"exclusive", "non_exclusive", "sole"};
      * territory_scope ∈ {"worldwide", "limited"};
      * term_type ∈ {"fixed_term", "perpetual",
        "tied_to_master_agreement", "auto_renewable"};
      * field_of_use_restrictions = "yes";
      * has_sublicense_rights = "yes";
      * ЛИБО в тексте есть definitive license grant
        ("grant a license" / "предоставляется право использования")
        — даже если конкретные параметры не указаны;
      * ЛИБО любое поле = "no", но с заполненным location
        с прямой цитатой (см. RF3). Учитывается как признак наличия
        ТОЛЬКО при наличии прямой цитаты («Сублицензирование
        не допускается», «Запрещено reverse engineering»).
        Без цитаты "no" не считается сигналом наличия.
    - "missing" — если ни один фрагмент не содержит упоминания
      о лицензии (договор не регулирует лицензионные отношения).
    - "unclear" — если есть упоминания лицензии, но невозможно
      сделать вывод о её наличии / отсутствии.

    Шаг 1 — ТИП ЛИЦЕНЗИИ

    Заполни "license_type".

    Значения:
    - "exclusive" — исключительная лицензия.
    - "non_exclusive" — неисключительная лицензия.
    - "sole" — единоличная (sole) лицензия.
    - "unclear" — тип прямо не указан.

    Шаг 2 — ТЕРРИТОРИЯ

    Заполни "territory_scope".

    Значения:
    - "worldwide" — по всему миру.
    - "limited" — ограничена: конкретными странами, регионами.
    - "unclear" — нельзя определить.

    Шаг 3 — СРОК ЛИЦЕНЗИИ

    Заполни "term_type" и "term_value".

    Значения для term_type:
    - "fixed_term" — фиксированный конкретный срок.
    - "perpetual" — бессрочная.
    - "tied_to_master_agreement" — пока действует основной договор.
    - "auto_renewable" — с автопродлением.
    - "unclear" — нельзя определить.

    Правила для term_value:
    - fixed_term: "5 лет", "до 31.12.2028"
    - perpetual: "Бессрочная"
    - tied_to_master_agreement: "Срок основного договора"
    - auto_renewable: "Автопродление"
    - unclear: "Не удалось определить"

    Шаг 4 — FIELD OF USE

    Заполни "field_of_use_restrictions".

    Значения:
    - "yes" — есть ограничения: internal use only,
      запрет SaaS / resale / white-label / embedding /
      modification / reverse engineering; ограничение
      по продукту / сегменту.
    - "no" — существенных ограничений нет.
    - "unclear" — нельзя определить.

    Шаг 5 — СУБЛИЦЕНЗИРОВАНИЕ

    Заполни "has_sublicense_rights".

    Значения:
    - "yes" — есть явное право на сублицензирование.
    - "no" — сублицензирование запрещено или не предусмотрено.
    - "unclear" — нельзя определить.

    Шаг 6 — НОРМАЛИЗОВАННЫЙ DISPLAY ДЛЯ DD GRID

    Заполни "license_scope_display".

    Это итоговое поле для таблицы.
    Строй его ТОЛЬКО на основе уже заполненных полей выше.
    Не добавляй информацию сверх них.

    Правила:
    - Если license_scope_status = "missing":
      "В договоре отсутствует регулирование лицензии"
    - Если все поля unclear:
      "Не удалось определить условия лицензии"
    - Иначе комбинируй через ";":
      * license_type (кратко: "Exclusive", "Non-exclusive", "Sole")
      * territory_scope (если "limited": "ограниченная территория")
      * term_value
      * если field_of_use_restrictions = "yes": "ограничения use"
      * если has_sublicense_rights = "no": "без сублицензии"
    - Не более 4 коротких фактов через ";".

    Шаг 7 — КРАТКОЕ ОБОСНОВАНИЕ

    Заполни "reason".

    Правила:
    - Первое предложение — краткий вывод.
    - Второе — короткая цитата из текста (до 100 символов).
    - Пиши по-русски.
    </instructions>

    <edge_cases>
    - Internal-use-only:
      * license_scope_status = "present"
      * field_of_use_restrictions = "yes"

    - Срок = срок основного договора:
      * license_scope_status = "present"
      * term_type = "tied_to_master_agreement"
      * term_value = "Срок основного договора"

    - Лицензия есть, тип не указан:
      * license_scope_status = "present"
      * license_type = "unclear"

    - Договор прямо исключает лицензию
      ("Лицензия не предоставляется"):
      * license_scope_status = "present"
      * license_type = "unclear"
      * location с прямой цитатой об отсутствии.

    - Нет релевантных фрагментов / раздел о лицензии
      в договоре отсутствует:
      * license_scope_status = "missing"
      * license_type = "unclear"
      * territory_scope = "unclear"
      * term_type = "unclear"
      * term_value = "Не удалось определить"
      * field_of_use_restrictions = "no"
      * has_sublicense_rights = "unclear"
      * license_scope_display =
        "В договоре отсутствует регулирование лицензии"
      * location у всех полей = null.

    - Формулировки есть, но вывод невозможен:
      * license_scope_status = "unclear"
      * соответствующие поля = "unclear"
    </edge_cases>

    <output_expectations>
    - Верни результат строго в формате JSON.
    - Не оборачивай в markdown-блоки (без ```).
    - Не добавляй комментариев вне JSON.
    - Все значения полей с allowed_values — на английском.
    - Свободные текстовые поля (license_scope_display, term_value,
      reason) — на русском языке.
    - Не добавляй полей, кроме указанных.
    - Для каждого поля возвращай объект с ключами
      "value", "confidence", "location".

    Пример структуры ответа:
    {
      "license_scope_display": {"value": "Non-exclusive; worldwide; бессрочная; internal use only", "confidence": 0.92, "location": null},
      "license_scope_status": {"value": "present", "confidence": 0.95, "location": {"clause_ref": "п. 2.1", "page": 2, "quote": "Лицензиар предоставляет Лицензиату неисключительную лицензию на использование Программного обеспечения"}},
      "license_type": {"value": "non_exclusive", "confidence": 0.95, "location": {"clause_ref": "п. 2.1", "page": 2, "quote": "неисключительную лицензию на использование Программного обеспечения"}},
      "territory_scope": {"value": "worldwide", "confidence": 0.85, "location": {"clause_ref": "п. 2.3", "page": 2, "quote": "Территория использования — все страны мира"}},
      "term_type": {"value": "perpetual", "confidence": 0.90, "location": {"clause_ref": "п. 4.1", "page": 3, "quote": "Лицензия предоставляется бессрочно"}},
      "term_value": {"value": "Бессрочная", "confidence": 0.90, "location": {"clause_ref": "п. 4.1", "page": 3, "quote": "Лицензия предоставляется бессрочно"}},
      "field_of_use_restrictions": {"value": "yes", "confidence": 0.90, "location": {"clause_ref": "п. 2.5", "page": 2, "quote": "Использование допускается исключительно для внутренних нужд Лицензиата"}},
      "has_sublicense_rights": {"value": "no", "confidence": 0.85, "location": {"clause_ref": "п. 2.7", "page": 2, "quote": "Сублицензирование не допускается"}},
      "reason": {"value": "...", "confidence": 0.90, "location": null}
    }
    </output_expectations>

  fields:
    - name: "license_scope_display"
      type: "string"
      presentation: "fact"
      label: "Условия лицензии"
      description: "Нормализованный user-facing вывод для DD Grid"
      display_in_grid: true
      display_priority: 1

    - name: "license_scope_status"
      type: "string"
      presentation: "signal"
      risk_weight: "info"
      description: "Наличие регулирования лицензии в договоре"
      display_in_grid: false
      allowed_values:
        - "present"
        - "missing"
        - "unclear"

    - name: "license_type"
      type: "string"
      presentation: "signal"
      risk_weight: "high"
      description: "Тип лицензии"
      allowed_values:
        - "exclusive"
        - "non_exclusive"
        - "sole"
        - "unclear"
      display_in_grid: false

    - name: "territory_scope"
      type: "string"
      presentation: "signal"
      risk_weight: "medium"
      description: "Территория действия лицензии"
      allowed_values:
        - "worldwide"
        - "limited"
        - "unclear"
      display_in_grid: false

    - name: "term_type"
      type: "string"
      presentation: "signal"
      risk_weight: "high"
      description: "Тип срока лицензии"
      allowed_values:
        - "fixed_term"
        - "perpetual"
        - "tied_to_master_agreement"
        - "auto_renewable"
        - "unclear"
      display_in_grid: false

    - name: "term_value"
      type: "string"
      presentation: "fact"
      label: "Срок лицензии"
      description: "Конкретный срок лицензии"
      display_in_grid: true
      display_priority: 2

    - name: "field_of_use_restrictions"
      type: "string"
      presentation: "signal"
      risk_weight: "high"
      description: "Ограничения field of use"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
      display_in_grid: false

    - name: "has_sublicense_rights"
      type: "string"
      presentation: "signal"
      risk_weight: "medium"
      description: "Право на сублицензирование"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
      display_in_grid: false

    - name: "reason"
      type: "string"
      presentation: "diagnostic"
      description: "Обоснование"
      display_in_grid: false

  store_payload: true


  