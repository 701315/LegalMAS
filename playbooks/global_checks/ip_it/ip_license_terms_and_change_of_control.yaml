id: "ip_license_terms_and_change_of_control"
name: "Лицензионные условия и смена контроля"
description: >
  Анализирует лицензионные условия: exclusive/non-exclusive, территория и срок,
  право на сублицензии, ограничения на смену контроля и передачу лицензий.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"

rules:
  keywords:
    - "license"
    - "licence"
    - "лицензия"
    - "лицензионное соглашение"
    - "non-exclusive"
    - "exclusive"
    - "territory"
    - "территория"
    - "term"
    - "срок действия лицензии"
    - "field of use"
    - "поле использования"
    - "sublicense"
    - "сублицензия"
    - "assign or transfer"
    - "не подлежит передаче"
    - "non-transferable"
    - "change of control"
    - "смена контроля"
    - "consent of licensor"
  keyword_mode: "any"
  regex_patterns: []
  clause_patterns: []

llm:
  prompt_template: |
    <role>
    Ты — юрист по IP и лицензированию.
    Твоя специализация — лицензионные соглашения на ПО, технологии и иные IP-права,
    включая их поведение при смене контроля.
    </role>

    <context>
    Ниже приведены фрагменты договора, касающиеся лицензий на ПО, технологии
    или иные IP-права:

    {context}
    </context>

    <instructions>
    Определи:

    1) Тип лицензии:
       - exclusive / non-exclusive / sole / unclear;
       - если прямо не указано, не делай предположений, ставь "unclear".
       Отрази это в license_type.

    2) Территория действия лицензии:
       - глобальная (worldwide) либо ограниченная странами/регионами;
       - наличие или отсутствие территориальных ограничений.
       Кратко опиши в territory_description.

    3) Срок действия лицензии:
       - фиксированный срок (годы, месяцы);
       - бессрочно (perpetual) или до прекращения договора;
       - есть ли автоматическое продление.
       Опиши это в term_description.

    4) Поле использования (field of use) и ключевые ограничения:
       - разрешённые виды использования (например, только internal use,
         только определённый продукт/сегмент);
       - запреты на модификацию, обратный инжиниринг, SaaS/встраивание.
       Этот анализ учти в reason (отдельного поля не требуется).

    5) Есть ли право на сублицензирование:
       - вправе ли лицензиат выдавать сублицензии третьим лицам;
       - есть ли ограничения (только аффилированные лица, только с согласия и т.п.).
       Отрази это в has_sublicense_rights: yes / no / unclear.

    6) Передаваемость лицензии:
       - можно ли передавать/уступать права по лицензии аффилированным лицам
         или в рамках M&A (слияние, продажа бизнеса);
       - есть ли запреты "non-transferable" или требования предварительного согласия.
       Отрази это в is_transferable_to_affiliates_or_on_mna.

    7) Поведение лицензии при смене контроля (change of control):
       - сохраняется ли лицензия;
       - прекращается ли автоматически;
       - требует ли CoC предварительного согласия лицензиара или даёт ему право
         расторгнуть договор.
       Отрази это в license_survives_change_of_control.

    8) Оцени общий риск (overall_risk_level: low / medium / high) для Target,
       исходя из критичности лицензии и рисков, связанных с её непередаваемостью
       или прекращением при CoC.
    </instructions>

    <edge_cases>
    ВАЖНО — пограничные случаи:

    — Если лицензия явно "non-transferable" и не допускает уступку/передачу
      при M&A без согласия лицензиара:
      is_transferable_to_affiliates_or_on_mna = "no",
      а при отсутствии carve-out для CoC риск, как правило, не ниже "medium".

    — Если указано, что любая смена контроля считается запрещённой уступкой
      и даёт лицензиару право прекратить лицензию:
      license_survives_change_of_control = "no",
      overall_risk_level обычно "high" (обоснуй в reason).

    — Если лицензия выдана "perpetual, worldwide, non-exclusive" с правом
      использования внутри группы и без ограничений при CoC:
      license_type = "non-exclusive",
      is_transferable_to_affiliates_or_on_mna = "yes",
      license_survives_change_of_control = "yes",
      риск чаще "low".

    — Если по фрагментам не удаётся определить тип лицензии, срок или правила
      при CoC:
      соответствующие поля = "unclear" или описания остаются общими,
      не додумывай по умолчанию.

    — Пустые или нерелевантные фрагменты:
      большинство полей = "unclear" или пустые строки,
      overall_risk_level = "medium",
      reason = "Недостаточно данных для анализа лицензионных условий и поведения при смене контроля."
    </edge_cases>

    <examples>
    ПРИМЕР 1 — КРИТИЧНАЯ ЭКСКЛЮЗИВНАЯ ЛИЦЕНЗИЯ, ВЫСОКИЙ РИСК:

    Фрагмент: "Лицензиар предоставляет Лицензиату исключительную
    (exclusive), непередаваемую (non-transferable) лицензию на использование
    Программы на территории РФ сроком на 5 лет. Любая смена контроля над
    Лицензиатом считается основанием для досрочного прекращения Лицензии,
    если иное не согласовано с Лицензиаром в письменной форме."

    {{
      "license_type": "exclusive",
      "territory_description": "Территория РФ.",
      "term_description": "Срок 5 лет, без указания автоматического продления.",
      "has_sublicense_rights": "no",
      "is_transferable_to_affiliates_or_on_mna": "no",
      "license_survives_change_of_control": "no",
      "overall_risk_level": "high",
      "reason": "Исключительная и непередаваемая лицензия прекращается при смене контроля без согласия Лицензиара, что создаёт высокий риск потери ключевого IP после сделки."
    }}

    ПРИМЕР 2 — ГИБКАЯ НЕИСКЛЮЧИТЕЛЬНАЯ ЛИЦЕНЗИЯ (LOW/MEDIUM):

    Фрагмент: "Лицензия предоставляется на неисключительной основе
    (non-exclusive), на территории по всему миру (worldwide), бессрочно
    (perpetual). Лицензиат вправе передавать права аффилированным лицам
    и правопреемникам в результате слияния или продажи бизнеса."

    {{
      "license_type": "non-exclusive",
      "territory_description": "Worldwide.",
      "term_description": "Perpetual, бессрочная лицензия.",
      "has_sublicense_rights": "unclear",
      "is_transferable_to_affiliates_or_on_mna": "yes",
      "license_survives_change_of_control": "yes",
      "overall_risk_level": "low",
      "reason": "Неисключительная, бессрочная, глобальная лицензия с правом передачи внутри группы и при M&A существенно снижает риск потери IP при смене контроля."
    }}

    ПРИМЕР 3 — НЕЯСНЫЕ УСЛОВИЯ, СРЕДНИЙ РИСК:

    Фрагмент: "Стороны соглашаются, что Лицензиат вправе использовать
    Продукт в рамках настоящего Договора. Дополнительные условия
    использования и территориальные ограничения могут быть согласованы
    Сторонами в отдельных соглашениях."

    {{
      "license_type": "unclear",
      "territory_description": "Территория и ограничения не определены в доступном фрагменте.",
      "term_description": "Срок действия лицензии не определён в доступном фрагменте.",
      "has_sublicense_rights": "unclear",
      "is_transferable_to_affiliates_or_on_mna": "unclear",
      "license_survives_change_of_control": "unclear",
      "overall_risk_level": "medium",
      "reason": "Тип лицензии, территория, срок и условия передачи/CoC не раскрыты, что создаёт неопределённость по критичным параметрам лицензирования."
    }}
    </examples>

    <output_format>
    Твой ответ ДОЛЖЕН быть строго валидным JSON-объектом со следующими
    полями:

    {{
      "license_type": "one of: exclusive | non-exclusive | sole | unclear",
      "territory_description": "string — краткое описание территории действия лицензии",
      "term_description": "string — краткое описание срока действия и продления",
      "has_sublicense_rights": "one of: yes | no | unclear",
      "is_transferable_to_affiliates_or_on_mna": "one of: yes | no | unclear",
      "license_survives_change_of_control": "one of: yes | no | unclear",
      "overall_risk_level": "one of: low | medium | high",
      "reason": "string — краткое объяснение на русском с указанием ключевых формулировок и рисков для Target при сделке"
    }}

    Все перечисленные поля ДОЛЖНЫ присутствовать в JSON, даже если их значение равно null.
    </output_format>

    <constraints>
    ЖЁСТКИЕ ПРАВИЛА:
    1. Выведи ТОЛЬКО один JSON-объект. Никакого текста до или после.
    2. Не пиши "Вот JSON", "Here is the JSON" и т.п.
    3. Не используй Markdown, бэктики ``` или любые обёртки.
    4. Все строки — в двойных кавычках.
    5. Значения перечислимых полей — СТРОГО из указанных вариантов.
    6. Ключи — точно как указано, без добавления новых.
    7. Поле "reason" ДОЛЖНО содержать конкретные факты и формулировки
       из фрагментов, а не общие фразы вроде "есть риски".
    8. Начни ответ сразу с символа {{
    9. Если по какому‑то полю нет достаточно информации в тексте —
       верни для него 'unclear' или null (для reason пустое значение
       недопустимо — нужно объяснение). НЕ придумывай значения, не интерполируй.
    </constraints>
  prompt_file: null
  context_k: 5
  temperature: 0.0
  max_tokens: 640

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  context_k: 5
  max_chunks: 10
  boost_keywords:
    - "license"
    - "лицензия"
    - "non-exclusive"
    - "exclusive"
    - "sublicense"
    - "non-transferable"
    - "change of control"
  rerank: true
  filters: {}

conditional: null

extraction:
  enabled: true
  mode: "hybrid"
  fields:
    - name: "license_type"
      type: "string"
      allowed_values:
        - "exclusive"
        - "non-exclusive"
        - "sole"
        - "unclear"
    - name: "territory_description"
      type: "string"
    - name: "term_description"
      type: "string"
    - name: "has_sublicense_rights"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
    - name: "is_transferable_to_affiliates_or_on_mna"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
    - name: "license_survives_change_of_control"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
    - name: "overall_risk_level"
      type: "string"
      allowed_values:
        - "low"
        - "medium"
        - "high"
    - name: "reason"
      type: "string"
  store_payload: true

red_flags:
  items:
    - code: "IP3"
      description: "Ключевые лицензии прекращаются при смене контроля или не подлежат передаче без согласия."
    - code: "IP4"
      description: "Отсутствие прав на сублицензирование/внутригрупповую передачу при модели, зависящей от этого."
      