id: "ip_license_terms_and_change_of_control"
name: "Лицензионные условия и смена контроля"
description: >
  Анализирует лицензионные условия на ПО, технологии и иные IP-права:
  тип лицензии (exclusive / non-exclusive / sole), территорию и срок,
  field of use и функциональные ограничения, право на сублицензирование,
  передаваемость лицензии при внутригрупповых передачах и M&A,
  поведение лицензии при смене контроля.

  Формирует краткий user-facing вывод и оценивает риск потери или
  ограничения критичных лицензий после сделки.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"
ui_mode: "field_extraction"

rules:
  keyword_mode: any

  keywords:
    high:
      # Лицензия
      - "(?i)\\blicen[cs]e\\b"
      - "(?i)лицензи[яеию]"
      - "(?i)лицензионн(ое|ого)\\s+соглашени"
      - "(?i)license\\s+agreement"
      - "(?i)technology\\s+license"
      - "(?i)software\\s+license"

      # Тип лицензии
      - "(?i)non[-\\s]?exclusive\\s+license"
      - "(?i)exclusive\\s+license"
      - "(?i)sole\\s+license"
      - "(?i)исключительн(ая|ого)\\s+лицензи"
      - "(?i)неисключительн(ая|ого)\\s+лицензи"

      # Территория / срок
      - "(?i)term\\s+of\\s+(the\\s+)?license"
      - "(?i)срок\\s+действия\\s+лицензи"
      - "(?i)perpetual\\s+license"
      - "(?i)бессрочн(ая|ого)\\s+лицензи"
      - "(?i)worldwide\\s+license"

      # Field of use / ограничения
      - "(?i)field\\s+of\\s+use"
      - "(?i)internal\\s+use\\s+only"
      - "(?i)только\\s+для\\s+внутреннего\\s+использовани"
      - "(?i)no\\s+right\\s+to\\s+(sublicense|resell|distribute)"
      - "(?i)reverse\\s+engineering"

      # Сублицензия / передача
      - "(?i)sublicen[cs]e"
      - "(?i)сублицензи[яеию]"
      - "(?i)non[-\\s]?transferable"
      - "(?i)не\\s+подлежит\\s+передаче"
      - "(?i)consent\\s+of\\s+(the\\s+)?licensor"
      - "(?i)согласие\\s+лицензиара"
      - "(?i)transfer\\s+of\\s+license"

      # Change of control
      - "(?i)change\\s+of\\s+control[\\s\\S]{0,40}(license|лицензи)"
      - "(?i)смен[аы]\\s+контрол[яю][\\s\\S]{0,40}лицензи"
      - "(?i)deemed\\s+assignment[\\s\\S]{0,30}(license|лицензи)"
      - "(?i)считается\\s+уступкой[\\s\\S]{0,30}лицензи"

    medium:
      # Аффилированные лица / M&A carve-out
      - "(?i)affiliate[\\s\\S]{0,30}(license|use|sublicense)"
      - "(?i)intra[-\\s]?group[\\s\\S]{0,30}(license|use)"
      - "(?i)successor[\\s\\S]{0,30}(license|лицензи)"
      - "(?i)правопреемник[\\s\\S]{0,30}лицензи"
      - "(?i)merger[\\s\\S]{0,20}(license|лицензи)"
      - "(?i)purchaser\\s+of\\s+(all|substantially\\s+all)"

      # Прекращение лицензии
      - "(?i)terminate\\s+(the\\s+)?license"
      - "(?i)termination\\s+of\\s+(the\\s+)?license"
      - "(?i)прекращени[ея]\\s+лицензи"
      - "(?i)licensor\\s+may\\s+terminate"

      # Пролонгация
      - "(?i)auto(matic)?\\s+renewal[\\s\\S]{0,20}license"
      - "(?i)автоматическ[оея]\\s+продлени[ея]\\s+лицензи"

    low:
      - "(?i)exclusive\\s+license"
      - "(?i)non[-\\s]?exclusive"
      - "(?i)field\\s+of\\s+use"
      - "(?i)sublicen[cs]e"
      - "(?i)non[-\\s]?transferable"
      - "(?i)consent\\s+of\\s+licensor"
      - "(?i)perpetual\\s+license"
      - "(?i)change\\s+of\\s+control[\\s\\S]{0,20}license"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 750

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  context_k: 5
  max_chunks: 10
  boost_keywords:
    - "license"
    - "licence"
    - "лицензия"
    - "license agreement"
    - "non-exclusive license"
    - "exclusive license"
    - "sole license"
    - "term of the license"
    - "срок действия лицензии"
    - "perpetual license"
    - "field of use"
    - "поле использования"
    - "internal use only"
    - "только для внутреннего использования"
    - "sublicense"
    - "сублицензия"
    - "non-transferable"
    - "не подлежит передаче"
    - "transfer of license"
    - "consent of licensor"
    - "согласие лицензиара"
    - "affiliate license"
    - "intra-group license"
    - "change of control"
    - "смена контроля"
    - "deemed assignment"
    - "licensor may terminate"
    - "прекращение лицензии"
  rerank: true
  filters: {}

conditional: null

enrichment_hints:
  preferred_segment_types:
    - "contract"
    - "annex"
    - "appendix"
    - "amendment"
  excluded_segment_types:
    - "technical_specification"
    - "price_list"
    - "invoice"
    - "act"
  preferred_clause_functions:
    - "intellectual_property"
    - "assignment"
  confidence_bonus_on_match: 0.10
  confidence_penalty_on_excluded_segment: 0.15

extraction:
  enabled: true
  mode: "hybrid"
  llm_max_tokens: 480
  llm_prompt_extraction: |
    <role>
    Ты — юрист по IP, лицензированию и M&A.
    Твоя задача — точно извлечь из текста:
    1) тип, территорию и срок лицензии;
    2) ограничения field of use;
    3) права на сублицензирование и передаваемость;
    4) поведение лицензии при смене контроля.
    </role>

    <context>
    Ниже приведены релевантные фрагменты договора:

    {context}
    </context>

    <task>
    Заполни только следующие поля:
    - license_display
    - license_type
    - territory_scope
    - term_type
    - term_value
    - field_of_use_restrictions
    - has_sublicense_rights
    - is_transferable_to_affiliates_or_on_mna
    - change_of_control_treatment
    - red_flags
    - reason

    Важно:
    - не делай предположений если данных нет;
    - пиши user-facing значения коротко и по-русски.
    </task>

    <instructions>
    Шаг 1 — ТИП ЛИЦЕНЗИИ

    Заполни поле "license_type".

    Значения:
    - "exclusive" — исключительная лицензия.
    - "non_exclusive" — неисключительная лицензия.
    - "sole" — единоличная лицензия.
    - "unclear" — тип прямо не указан.

    Шаг 2 — ТЕРРИТОРИЯ

    Заполни поле "territory_scope".

    Значения:
    - "worldwide" — по всему миру.
    - "limited" — ограничена странами, регионами, рынками.
    - "unclear" — неясно.

    Шаг 3 — СРОК ЛИЦЕНЗИИ

    Заполни поле "term_type".

    Значения:
    - "fixed_term" — фиксированный срок.
    - "perpetual" — бессрочная.
    - "tied_to_master_agreement" — действует пока действует
      основной договор.
    - "auto_renewable" — есть автопродление.
    - "unclear" — неясно.

    Заполни поле "term_value".

    Правила:
    - Если фиксированный срок: "5 лет", "до 31.12.2028".
    - Если бессрочная: "Бессрочная"
    - Если привязана к договору: "Срок основного договора"
    - Если неясно: "Не удалось определить"

    Шаг 4 — FIELD OF USE И ОГРАНИЧЕНИЯ

    Заполни поле "field_of_use_restrictions".

    Значения:
    - "yes" — ограничения есть:
      * только внутреннее использование;
      * запрет SaaS, resale, white-label, embedding,
        modification, reverse engineering;
      * ограничение по продукту / сегменту / индустрии.
    - "no" — существенных ограничений нет.
    - "unclear" — неясно.

    Шаг 5 — СУБЛИЦЕНЗИРОВАНИЕ

    Заполни поле "has_sublicense_rights".

    Значения:
    - "yes" — право сублицензирования есть.
    - "no" — нет.
    - "unclear" — неясно.

    Шаг 6 — ПЕРЕДАВАЕМОСТЬ ЛИЦЕНЗИИ

    Заполни поле "is_transferable_to_affiliates_or_on_mna".

    Значения:
    - "yes" — передача допустима: аффилированным лицам,
      правопреемнику при M&A / merger / reorganization.
    - "no" — non-transferable / assignment prohibited без
      consent licensor.
    - "unclear" — неясно.

    Шаг 7 — ПОВЕДЕНИЕ ЛИЦЕНЗИИ ПРИ СМЕНЕ КОНТРОЛЯ

    Заполни поле "change_of_control_treatment".

    Значения:
    - "survives" — лицензия сохраняется автоматически.
    - "consent_required" — нужен consent licensor.
    - "terminable" — лицензиар вправе прекратить лицензию.
    - "prohibited_assignment" — CoC = запрещённая передача.
    - "not_addressed" — CoC не урегулирован.
    - "unclear" — неясно.

    Шаг 8 — RED FLAGS

    Заполни поле "red_flags".

    Используй:
    - "NONE" — если существенных риск-факторов нет.
    - "UNCLEAR" — если данных недостаточно.
    - Коды через запятую:
      * IPLIC1 — лицензия прекращается или может быть
        прекращена при CoC.
      * IPLIC2 — non-transferable / assignment prohibited
        без consent licensor — блокирует M&A.
      * IPLIC3 — нет права на сублицензирование /
        внутригрупповое использование где это требуется.
      * IPLIC4 — жёсткие field-of-use / internal-use-only
        ограничения, несовместимые с бизнес-моделью Target.
      * IPLIC5 — срок лицензии короткий, привязан к
        основному договору или легко прекращаема.
      * IPLIC6 — ключевые параметры (тип, срок, CoC-режим,
        transferability) неясны.

    Шаг 9 — USER-FACING SUMMARY

    Заполни поле "license_display".

    Примеры:
    - "Non-exclusive; worldwide; perpetual; CoC — прекращение"
    - "Exclusive; ограниченная территория; 5 лет;
       non-transferable без consent licensor"
    - "Non-exclusive; internal use only; CoC не урегулирован"
    - "Не удалось определить условия лицензии"

    Правила:
    - Отрази максимум 4 ключевых факта через ";".
    - Если всё unclear:
      "Не удалось определить условия лицензии"

    Шаг 10 — ОБОСНОВАНИЕ

    Заполни поле "reason".

    Правила:
    - 1–2 коротких предложения.
    - Укажи: тип, срок, территория, sublicense, transfer,
      CoC-режим, ключевые ограничения, почему red_flags.
    - Приведи короткую цитату в кавычках.
    - Если NONE — почему лицензия комфортна для сделки.
    </instructions>

    <edge_cases>
    - Non-transferable + consent licensor + CoC = assignment:
      * is_transferable_to_affiliates_or_on_mna = "no"
      * change_of_control_treatment = "prohibited_assignment"
      * red_flags = "IPLIC1, IPLIC2"

    - Perpetual worldwide non-exclusive с affiliate use,
      без CoC ограничений:
      * сильный фактор low risk
      * red_flags = "NONE"

    - Internal-use-only при SaaS-бизнес-модели Target:
      * field_of_use_restrictions = "yes"
      * red_flags включает "IPLIC4"

    - Срок лицензии = срок основного договора (3 года):
      * term_type = "tied_to_master_agreement"
      * red_flags включает "IPLIC5"

    - Тип лицензии, срок и CoC-режим не определены:
      * license_type = "unclear"
      * change_of_control_treatment = "unclear"
      * red_flags включает "IPLIC6"

    - Нет релевантных фрагментов:
      * все поля = "unclear"
      * red_flags = "UNCLEAR"
      * license_display =
        "Не удалось определить условия лицензии"
    </edge_cases>

    <output_expectations>
    Все значения должны быть короткими, точными и пригодными
    для отображения пользователю в DD Grid.
    Не добавляй никаких полей, кроме указанных в схеме extraction.
    </output_expectations>

  fields:
    - name: "license_display"
      type: "string"
      description: "Условия лицензии: краткий вывод"

    - name: "license_type"
      type: "string"
      description: "Тип лицензии"
      allowed_values:
        - "exclusive"
        - "non_exclusive"
        - "sole"
        - "unclear"

    - name: "territory_scope"
      type: "string"
      description: "Территория действия лицензии"
      allowed_values:
        - "worldwide"
        - "limited"
        - "unclear"

    - name: "term_type"
      type: "string"
      description: "Тип срока лицензии"
      allowed_values:
        - "fixed_term"
        - "perpetual"
        - "tied_to_master_agreement"
        - "auto_renewable"
        - "unclear"

    - name: "term_value"
      type: "string"
      description: "Конкретный срок лицензии"

    - name: "field_of_use_restrictions"
      type: "string"
      description: "Ограничения field of use"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "has_sublicense_rights"
      type: "string"
      description: "Право на сублицензирование"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "is_transferable_to_affiliates_or_on_mna"
      type: "string"
      description: "Передаваемость лицензии при M&A"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "change_of_control_treatment"
      type: "string"
      description: "Поведение лицензии при CoC"
      allowed_values:
        - "survives"
        - "consent_required"
        - "terminable"
        - "prohibited_assignment"
        - "not_addressed"
        - "unclear"

    - name: "red_flags"
      type: "string"
      description: "Коды рисков"

    - name: "reason"
      type: "string"
      description: "Обоснование"

  store_payload: true


  