id: "ip_license_terms_and_change_of_control"
name: "Лицензионные условия и смена контроля"
description: >
  Анализирует лицензионные условия на ПО, технологии и иные IP-права:
  тип лицензии (exclusive / non-exclusive / sole), территорию и срок,
  field of use и иные функциональные ограничения, право на
  сублицензирование, передаваемость лицензии внутри группы и при M&A,
  а также поведение лицензии при смене контроля. Оценивает риск
  потери или ограничения критичных лицензий после сделки.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"

rules:
  keyword_mode: any

  keywords:
    high:
      # Лицензия — точные термины
      - "(?i)\\blicen[cs]e\\b"
      - "(?i)лицензи[яеию]"
      - "(?i)лицензионн(ое|ого)\\s+соглашени"
      - "(?i)license\\s+agreement"
      - "(?i)technology\\s+license"
      - "(?i)software\\s+license"

      # Тип лицензии
      - "(?i)non[-\\s]?exclusive"
      - "(?i)exclusive\\s+license"
      - "(?i)sole\\s+license"
      - "(?i)исключительн(ая|ого)\\s+лицензи"
      - "(?i)неисключительн(ая|ого)\\s+лицензи"
      - "(?i)единоличн(ая|ого)\\s+лицензи"

      # Территория / срок
      - "(?i)territory"
      - "(?i)территори[яи]"
      - "(?i)worldwide"
      - "(?i)по\\s+всему\\s+миру"
      - "(?i)term\\s+of\\s+(the\\s+)?license"
      - "(?i)срок\\s+действия\\s+лицензи"
      - "(?i)perpetual"
      - "(?i)бессрочн"

      # Field of use / ограничения
      - "(?i)field\\s+of\\s+use"
      - "(?i)поле\\s+использовани[яе]"
      - "(?i)internal\\s+use\\s+only"
      - "(?i)только\\s+для\\s+внутреннего\\s+использовани"
      - "(?i)reverse\\s+engineering"
      - "(?i)обратн(ый|ого)\\s+инжиниринг"
      - "(?i)white[-\\s]?label"
      - "(?i)resale"
      - "(?i)SaaS"
      - "(?i)embedding"

      # Сублицензия / передача
      - "(?i)sublicen[cs]e"
      - "(?i)сублицензи[яеию]"
      - "(?i)assign\\s+or\\s+transfer"
      - "(?i)assign(ment)?"
      - "(?i)transfer\\s+of\\s+license"
      - "(?i)не\\s+подлежит\\s+передаче"
      - "(?i)non[-\\s]?transferable"
      - "(?i)consent\\s+of\\s+(the\\s+)?licensor"
      - "(?i)согласие\\s+лицензиара"

      # Change of control
      - "(?i)change\\s+of\\s+control"
      - "(?i)смен[аы]\\s+контрол[яю]"
      - "(?i)upon\\s+(a\\s+)?change\\s+of\\s+control"
      - "(?i)в\\s+случае\\s+смены\\s+контрол"
      - "(?i)deemed\\s+assignment"
      - "(?i)считается\\s+уступкой"

    medium:
      # Аффилированные лица / M&A carve-out
      - "(?i)affiliate"
      - "(?i)аффилированн(ое|ым|ым\\s+лицам?)"
      - "(?i)intra[-\\s]?group"
      - "(?i)внутригруппов"
      - "(?i)successor"
      - "(?i)правопреемник"
      - "(?i)merger"
      - "(?i)слияни"
      - "(?i)reorganization"
      - "(?i)реорганизаци"
      - "(?i)purchaser\\s+of\\s+(all|substantially\\s+all)"
      - "(?i)покупател[ьяю]\\s+бизнеса"

      # Прекращение лицензии
      - "(?i)terminate\\s+(the\\s+)?license"
      - "(?i)termination\\s+of\\s+(the\\s+)?license"
      - "(?i)прекращени[ея]\\s+лицензи"
      - "(?i)licensor\\s+may\\s+terminate"
      - "(?i)лицензиар\\s+вправе\\s+расторгнуть"

      # Пролонгация
      - "(?i)auto(matic)?\\s+renewal"
      - "(?i)автоматическ(ое|ая)\\s+продлени"
      - "(?i)renews?\\s+automatically"

    low:
      # Общие термины
      - "(?i)IP"
      - "(?i)интеллектуальн(ая|ого)\\s+собственност"
      - "(?i)software"
      - "(?i)ПО"
      - "(?i)technology"
      - "(?i)технологи"
      - "(?i)rights?"
      - "(?i)прав[аоы]"
      - "(?i)use"
      - "(?i)использовани"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 750

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  context_k: 5
  max_chunks: 10
  boost_keywords:
    - "license"
    - "licence"
    - "лицензия"
    - "license agreement"
    - "non-exclusive"
    - "exclusive"
    - "sole license"
    - "territory"
    - "территория"
    - "term of the license"
    - "срок действия лицензии"
    - "perpetual"
    - "field of use"
    - "поле использования"
    - "internal use only"
    - "sublicense"
    - "сублицензия"
    - "non-transferable"
    - "assign or transfer"
    - "consent of licensor"
    - "affiliate"
    - "intra-group"
    - "change of control"
    - "смена контроля"
    - "deemed assignment"
    - "internal use only"
    - "non-transferable"
    - "consent of licensor"
    - "affiliate"
    - "successor"
    - "prohibited assignment"
  rerank: true
  filters: {}

conditional: null

extraction:
  llm_prompt_extraction: |
    <role>
    Ты — юрист по IP, лицензированию и M&A.
    Твоя специализация — анализ лицензионных соглашений на ПО,
    технологии, базы данных и иные IP-объекты, включая их
    передаваемость, сублицензирование и поведение при смене
    контроля, внутригрупповых передачах и сделках M&A.
    </role>

    <context>
    Ниже приведены фрагменты договора, касающиеся лицензий на ПО,
    технологии или иные IP-права:

    {context}
    </context>

    <instructions>
    Проведи анализ по шагам. Каждый шаг логически соответствует
    одному или нескольким полям итоговой оценки.

    Шаг 1 — ТИП ЛИЦЕНЗИИ
    (используется для заполнения поля "license_type"):
    - Определи, является ли лицензия:
      * "exclusive";
      * "non-exclusive";
      * "sole";
      * "unclear".
    - Если тип прямо не указан, не делай предположений.

    Шаг 2 — ТЕРРИТОРИЯ
    (используется для заполнения поля "territory_scope"):
    - Определи территорию действия лицензии:
      * "worldwide" — worldwide / global;
      * "limited" — ограничена странами, регионами или рынками;
      * "unclear" — неясно.

    Шаг 3 — СРОК ЛИЦЕНЗИИ
    (используется для заполнения поля "term_type"):
    - Определи срок действия лицензии:
      * "fixed_term" — фиксированный срок;
      * "perpetual" — бессрочная;
      * "tied_to_master_agreement" — действует, пока действует
        основной договор;
      * "auto_renewable" — есть автопродление;
      * "unclear" — неясно.

    Шаг 4 — FIELD OF USE И ФУНКЦИОНАЛЬНЫЕ ОГРАНИЧЕНИЯ
    (используется для заполнения поля "field_of_use_restrictions"):
    - Определи, ограничена ли лицензия:
      * только внутренним использованием;
      * определённым продуктом, сегментом, индустрией;
      * запретом на SaaS, resale, white-label, embedding,
        modification, reverse engineering.
    - Верни:
      * "yes" — ограничения есть;
      * "no" — существенных ограничений не видно;
      * "unclear" — неясно.
    - Ключевые ограничения обязательно опиши в reason.

    Шаг 5 — СУБЛИЦЕНЗИРОВАНИЕ
    (используется для заполнения поля "has_sublicense_rights"):
    - Определи, вправе ли лицензиат выдавать сублицензии
    - Верни:
      * "yes" — ограничения есть;
      * "no" — существенных ограничений не видно;
      * "unclear" — неясно.

    Шаг 6 — ПЕРЕДАВАЕМОСТЬ ЛИЦЕНЗИИ
    (используется для заполнения поля "is_transferable_to_affiliates_or_on_mna"):
    - Оцени, допускается ли передача / уступка лицензии:
      * аффилированным лицам;
      * правопреемнику при merger, reorganization,
        sale of business, M&A;
      * по общему правилу.
    - Учитывай формулировки:
      * "non-transferable";
      * "assign or transfer";
      * "consent of licensor";
      * carve-out для affiliates / successor / purchaser
        of substantially all assets.
    - Верни:
      * "yes";
      * "no";
      * "unclear".

    Шаг 7 — ПОВЕДЕНИЕ ЛИЦЕНЗИИ ПРИ СМЕНЕ КОНТРОЛЯ
    (используется для заполнения поля "change_of_control_treatment"):
    - Определи, что происходит с лицензией при CoC:
      * "survives" — лицензия сохраняется автоматически;
      * "consent_required" — нужен consent licensor;
      * "terminable" — лицензиар вправе прекратить лицензию;
      * "prohibited_assignment" — CoC приравнивается к запрещённой передаче;
      * "unclear" — неясно.

    Шаг 8 — RED FLAGS
    (используется для заполнения поля "red_flags"):
    Присвой один или несколько кодов из списка ниже.
    Если ни один код не применим — верни "NONE".
    Если данных недостаточно для оценки — верни "UNCLEAR".

    Коды:
    • IPLIC1 — Лицензия прекращается или может быть прекращена
      при смене контроля.
    • IPLIC2 — Лицензия non-transferable / assignment prohibited
      без согласия лицензиара, что блокирует M&A / реорганизацию.
    • IPLIC3 — Нет права на сублицензирование или внутригрупповое
      использование при модели, где это требуется.
    • IPLIC4 — Жёсткие field-of-use / internal-use-only ограничения,
      несовместимые с бизнес-моделью Target.
    • IPLIC5 — Срок лицензии короткий, привязан к основному договору
      или лицензия легко прекращаема.
    • IPLIC6 — Ключевые параметры лицензии (тип, срок, CoC-режим,
      transferability) неясны.

    Формат ответа: коды через запятую без комментариев
    (например: "IPLIC1, IPLIC2").
    Вся аргументация — в поле reason.

    Шаг 9 — ОБОСНОВАНИЕ
    (используется для заполнения поля "reason"):

    - В reason кратко обоснуй вывод, ссылаясь на ключевые
      формулировки из текста (с цитатами в кавычках), и укажи:
      * тип лицензии, срок и территорию;
      * права на sublicense / transfer;
      * режим при CoC;
      * ключевые ограничения field of use;
      * если выставлены red_flags — обоснуй каждый код;
      * если red_flags = "NONE" — укажи, почему лицензия
        комфортна для сделки.
    </instructions>

    <edge_cases>
    Обрабатывай пограничные ситуации так:

    - Лицензия прямо названа non-transferable и требует consent
      licensor для assignment / CoC:
      зафиксируй IPLIC2; если CoC приравнен к assignment —
      также IPLIC1.

    - Любая смена контроля считается prohibited assignment
      и даёт лицензиару право прекратить лицензию:
      change_of_control_treatment = "prohibited_assignment";
      red_flags как минимум "IPLIC1, IPLIC2".

    - Лицензия "perpetual, worldwide, non-exclusive" с affiliate use
      и без CoC-ограничений:
      это сильный фактор в пользу low risk.

    - Есть internal-use-only или запрет на SaaS / resale:
      это не нейтрально — оцени как field-of-use restriction
      и при необходимости ставь IPLIC4.

    - Нет возможности определить тип лицензии, срок или CoC-режим:
      не додумывай; используй "unclear" и при необходимости IPLIC6.

    - Пустые или явно нерелевантные фрагменты:
      укажи, что данных недостаточно для анализа лицензии;
      red_flags = "UNCLEAR"; overall_risk_level не занижай.
    </edge_cases>

    <output_expectations>
    На основе твоего анализа отдельный механизм извлечения сформирует
    структурированные поля по заранее заданной схеме. Твоя задача —
    давать чёткие юридические выводы и указывать конкретные формулировки
    из текста, на которых они основаны.
    </output_expectations>

  enabled: true
  mode: "hybrid"
  fields:
    - name: "license_type"
      type: "string"
      allowed_values:
        - "exclusive"
        - "non-exclusive"
        - "sole"
        - "unclear"

    - name: "territory_scope"
      type: "string"
      allowed_values:
        - "worldwide"
        - "limited"
        - "unclear"

    - name: "term_type"
      type: "string"
      allowed_values:
        - "fixed_term"
        - "perpetual"
        - "tied_to_master_agreement"
        - "auto_renewable"
        - "unclear"

    - name: "field_of_use_restrictions"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "has_sublicense_rights"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "is_transferable_to_affiliates_or_on_mna"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "change_of_control_treatment"
      type: "string"
      allowed_values:
        - "survives"
        - "consent_required"
        - "terminable"
        - "prohibited_assignment"
        - "unclear"

    - name: "red_flags"
      type: "string"

    - name: "reason"
      type: "string"

  store_payload: true

red_flags:
  items:
    - code: "IPLIC1"
      description: >
        Лицензия прекращается или может быть прекращена
        при смене контроля.
    - code: "IPLIC2"
      description: >
        Лицензия non-transferable / assignment prohibited
        без согласия лицензиара, что блокирует M&A
        или реорганизацию.
    - code: "IPLIC3"
      description: >
        Нет права на сублицензирование или внутригрупповое
        использование при модели, где это требуется.
    - code: "IPLIC4"
      description: >
        Жёсткие field-of-use / internal-use-only ограничения,
        несовместимые с бизнес-моделью Target.
    - code: "IPLIC5"
      description: >
        Срок лицензии короткий, привязан к основному договору
        или лицензия легко прекращаема.
    - code: "IPLIC6"
      description: >
        Ключевые параметры лицензии (тип, срок, CoC-режим,
        transferability) неясны.
