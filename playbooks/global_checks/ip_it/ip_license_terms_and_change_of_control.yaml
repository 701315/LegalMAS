id: "ip_license_terms_and_change_of_control"
name: "Лицензионные условия и смена контроля"
description: >
  Анализирует лицензионные условия: exclusive/non-exclusive, территория и срок,
  право на сублицензии, ограничения на смену контроля и передачу лицензий.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"

rules:
  keywords:
    - "license"
    - "licence"
    - "лицензия"
    - "лицензионное соглашение"
    - "non-exclusive"
    - "exclusive"
    - "territory"
    - "территория"
    - "term"
    - "срок действия лицензии"
    - "field of use"
    - "поле использования"
    - "sublicense"
    - "сублицензия"
    - "assign or transfer"
    - "не подлежит передаче"
    - "non-transferable"
    - "change of control"
    - "смена контроля"
    - "consent of licensor"
  keyword_mode: "any"
  regex_patterns: []
  clause_patterns: []

llm:
  prompt_template: |
    <role>
    Ты — юрист по IP и лицензированию.
    Твоя специализация — лицензионные соглашения на ПО, технологии и иные IP-права,
    включая их поведение при смене контроля.
    </role>

    <context>
    Ниже приведены фрагменты договора, касающиеся лицензий на ПО, технологии
    или иные IP-права:

    {context}
    </context>

    <instructions>
    Проведи анализ по шагам. Каждый шаг логически связан с одним или
    несколькими полями итоговой оценки.

    Шаг 1 — ТИП ЛИЦЕНЗИИ
    (используется для "license_type"):
    - Определи, является ли лицензия:
      * exclusive;
      * non-exclusive;
      * sole;
      * или по фрагментам это неясно (unclear).
    - Если тип прямо не указан, не делай предположений и используй "unclear".

    Шаг 2 — ТЕРРИТОРИЯ
    (используется для "territory_description"):
    - Определи территорию действия лицензии:
      * worldwide/глобальная;
      * ограниченная странами, регионами или иными территориальными признаками;
      * либо не определённая явно.
    - Кратко опиши территорию и характер ограничений (если есть).

    Шаг 3 — СРОК ДЕЙСТВИЯ
    (используется для "term_description"):
    - Определи срок действия лицензии:
      * фиксированный срок (количество лет/месяцев);
      * бессрочно (perpetual) или до прекращения основного договора;
      * есть ли автоматическое продление.
    - Кратко опиши срок и механизм пролонгации (если упомянут).

    Шаг 4 — ПОЛЕ ИСПОЛЬЗОВАНИЯ И ОГРАНИЧЕНИЯ
    (учитывается в "reason"):
    - Определи поле использования (field of use):
      * только внутреннее использование (internal use);
      * только для определённого продукта/сегмента/отрасли;
      * иные целевые ограничения.
    - Зафиксируй ключевые запреты:
      * на модификацию, обратный инжиниринг;
      * на SaaS/встраивание, resale, white-label;
      * иные важные ограничения, влияющие на бизнес-модель.
    - Эти детали опиши в объяснении риска, отдельного поля не требуется.

    Шаг 5 — ПРАВО НА СУБЛИЦЕНЗИРОВАНИЕ
    (используется для "has_sublicense_rights"):
    - Определи, вправе ли лицензиат выдавать сублицензии третьим лицам:
      * без ограничений;
      * только аффилированным лицам;
      * только с предварительным письменным согласием лицензиара;
      * либо по тексту это неясно.
    - Сформулируй вывод: yes / no / unclear.

    Шаг 6 — ПЕРЕДАВАЕМОСТЬ ПРАВ ПРИ M&A/АФФИЛИРОВАННЫМ ЛИЦАМ
    (используется для "is_transferable_to_affiliates_or_on_mna"):
    - Оцени, можно ли передавать или уступать права по лицензии:
      * аффилированным лицам;
      * правопреемникам в результате слияния, продажи бизнеса, реорганизации.
    - Обрати внимание на формулировки "non-transferable", запреты уступки,
      требования согласия лицензиара, carve-out для внутригрупповых передач и M&A.
    - Сделай вывод: yes / no / unclear.

    Шаг 7 — ПОВЕДЕНИЕ ЛИЦЕНЗИИ ПРИ СМЕНЕ КОНТРОЛЯ
    (используется для "license_survives_change_of_control"):
    - Определи, что происходит с лицензией при change of control:
      * сохраняется ли лицензия автоматически;
      * прекращается ли или даёт лицензиару право расторгнуть договор;
      * требуется ли предварительное согласие лицензиара на CoC.
    - Сделай вывод: yes / no / unclear, опираясь только на явно указанные условия.

    Шаг 8 — ОБЩИЙ РИСК ДЛЯ TARGET
    (используется для "overall_risk_level" и "reason"):
    - Оцени общий риск для Target с точки зрения:
      * критичности соответствующей лицензии для бизнеса;
      * ограничений по передаче и внутригрупповому использованию;
      * возможного прекращения или ухудшения условий при CoC.
    - Сформулируй общий уровень риска как low / medium / high.
    - В "reason" кратко обоснуй вывод, ссылаясь на ключевые формулировки
      (желательно с короткими цитатами) и пояснив, какие именно лицензионные
      ограничения важны для сделки.
    </instructions>

    <edge_cases>
    Обрабатывай пограничные ситуации так:

    - Лицензия явно non-transferable и не допускает уступку/передачу при M&A
      без согласия лицензиара:
      учитывай это как фактор повышенного риска, особенно если лицензия критична
      для операционной деятельности Target.

    - Указано, что любая смена контроля считается запрещённой уступкой и даёт
      лицензиару право прекратить лицензию:
      рассматривай такие условия как источник высокого риска потери IP после сделки.

    - Лицензия выдана "perpetual, worldwide, non-exclusive" с правом использования
      внутри группы и без ограничений при CoC:
      воспринимай это как более комфортную структуру риска.

    - По фрагментам не удаётся определить тип лицензии, срок или правила при CoC:
      не додумывай значения, сохраняй "unclear" и опиши неопределённость как
      отдельный риск.

    - Пустые или явно нерелевантные фрагменты:
      укажи, что данных недостаточно для анализа лицензионных условий и поведения
      при смене контроля, и поясни, как это влияет на неопределённость и оценку риска.
    </edge_cases>

    <output_expectations>
    На основе твоего анализа отдельный механизм извлечения сформирует
    структурированные поля по заранее заданной схеме. Твоя задача —
    давать чёткие юридические выводы и указывать конкретные формулировки
    из текста, на которых они основаны.
    </output_expectations>
  prompt_file: null
  context_k: 5
  temperature: 0.0
  max_tokens: 640

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  context_k: 5
  max_chunks: 10
  boost_keywords:
    - "license"
    - "лицензия"
    - "non-exclusive"
    - "exclusive"
    - "sublicense"
    - "non-transferable"
    - "change of control"
  rerank: true
  filters: {}

conditional: null

extraction:
  enabled: true
  mode: "hybrid"
  fields:
    - name: "license_type"
      type: "string"
      allowed_values:
        - "exclusive"
        - "non-exclusive"
        - "sole"
        - "unclear"

    - name: "territory_description"
      type: "string"

    - name: "term_description"
      type: "string"

    - name: "has_sublicense_rights"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "is_transferable_to_affiliates_or_on_mna"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "license_survives_change_of_control"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "overall_risk_level"
      type: "string"
      allowed_values:
        - "low"
        - "medium"
        - "high"

    - name: "reason"
      type: "string"

  store_payload: true

red_flags:
  items:
    - code: "IP3"
      description: "Ключевые лицензии прекращаются при смене контроля или не подлежат передаче без согласия."
    - code: "IP4"
      description: "Отсутствие прав на сублицензирование/внутригрупповую передачу при модели, зависящей от этого."
