id: "ip_license_transferability_and_change_of_control"
name: "Передаваемость лицензии и смена контроля"
group: "IP"
description: >
  Анализирует передаваемость лицензии при внутригрупповых
  передачах и M&A-событиях: допустимость передачи аффилированным
  лицам, передаваемость при реорганизации / слиянии / поглощении,
  поведение лицензии при смене контроля (CoC), необходимость
  согласия лицензиара, право на прекращение лицензии при CoC.

  Параметры лицензии (тип, территория, срок, field of use,
  сублицензирование) анализируются чеком ip_license_scope_and_usage.

doc_types: []

severity: "high"
severity_if_fail: "critical"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"
ui_mode: "field_extraction"

rules:
  keyword_mode: any

  keywords:
    high:
      - "(?i)non[-\\s]?transferable"
      - "(?i)не\\s+подлежит\\s+передаче"
      - "(?i)consent\\s+of\\s+(the\\s+)?licensor"
      - "(?i)согласие\\s+лицензиара"
      - "(?i)transfer\\s+of\\s+(the\\s+)?license"
      - "(?i)передач[аеи]\\s+лицензи"
      - "(?i)assignment\\s+of\\s+(the\\s+)?license"
      - "(?i)уступк[аеи]\\s+лицензи"
      - "(?i)change\\s+of\\s+control[\\s\\S]{0,40}(license|лицензи)"
      - "(?i)смен[аы]\\s+контрол[яю][\\s\\S]{0,40}лицензи"
      - "(?i)deemed\\s+assignment[\\s\\S]{0,30}(license|лицензи)"
      - "(?i)считается\\s+уступкой[\\s\\S]{0,30}лицензи"
      - "(?i)affiliate[\\s\\S]{0,30}(license|use|sublicense)"
      - "(?i)intra[-\\s]?group[\\s\\S]{0,30}(license|use)"
      - "(?i)successor[\\s\\S]{0,30}(license|лицензи)"
      - "(?i)правопреемник[\\s\\S]{0,30}лицензи"
      - "(?i)merger[\\s\\S]{0,20}(license|лицензи)"
      - "(?i)purchaser\\s+of\\s+(all|substantially\\s+all)"

    medium:
      - "(?i)licensor\\s+may\\s+terminate[\\s\\S]{0,30}(transfer|assign|change)"
      - "(?i)лицензиар\\s+вправе\\s+прекратить[\\s\\S]{0,30}(передач|смен)"
      - "(?i)prior\\s+(written\\s+)?consent[\\s\\S]{0,30}(transfer|assign|лицензи)"
      - "(?i)предварительн[оое]\\s+согласи[ея][\\s\\S]{0,30}(передач|лицензи)"

    low:
      - "(?i)non[-\\s]?transferable"
      - "(?i)consent\\s+of\\s+licensor"
      - "(?i)change\\s+of\\s+control[\\s\\S]{0,20}license"
      - "(?i)deemed\\s+assignment"
      - "(?i)successor"
      - "(?i)affiliate[\\s\\S]{0,20}license"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 700

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  retrieval_profile: "license_scope_check"
  context_k: 5
  max_chunks: 10

  retrieval_query: >
    передача лицензии non-transferable согласие лицензиара смена контроля 
    change of control аффилированные лица правопреемник merger assignment лицензии

  boost_keywords:
    - "non-transferable"
    - "не подлежит передаче"
    - "transfer of license"
    - "передача лицензии"
    - "consent of licensor"
    - "согласие лицензиара"
    - "change of control"
    - "смена контроля"
    - "deemed assignment"
    - "считается уступкой"
    - "affiliate license"
    - "intra-group license"
    - "successor"
    - "правопреемник"
    - "merger"
    - "purchaser of substantially all"
    - "licensor may terminate"

  negative_keywords:
    - "field of use"
    - "sublicense"
    - "term of license"
    - "срок лицензии"
    - "territory"
    - "условия оплаты"
    - "форс-мажор"

  preferred_unit_types:
    - "general_provision"
    - "obligation"

  excluded_unit_types:
    - "structural_anchor"
    - "technical_fragment"
    - "appendix_reference"

  preferred_clause_functions:
    - "rights"
    - "procedures"
    - "limitations"

  position_bias:
    preferred_range: [0.0, 1.0]
    boost: 0.10
    scope: "segment"

  rerank: true
  filters: {}

conditional: null

enrichment_hints:
  preferred_segment_types:
    - "contract"
    - "annex"
    - "appendix"
    - "amendment"
  excluded_segment_types:
    - "technical_specification"
    - "price_list"
    - "invoice"
    - "act"
  confidence_bonus_on_match: 0.10
  confidence_penalty_on_excluded_segment: 0.15

extraction:
  enabled: true
  mode: "hybrid"
  llm_max_tokens: 1050

  presence_signal:
    field: "license_transferability_status"
    present_values: ["present"]
    missing_values: ["missing"]
    unclear_values: ["unclear"]

  llm_prompt_extraction: |
    <role>
    Ты — юрист по IP, лицензированию и M&A.
    Твоя задача — точно извлечь из текста:
    1) есть ли в договоре регулирование передаваемости лицензии / CoC;
    2) если есть — какие условия установлены:
       - передаваемость лицензии аффилированным лицам;
       - передаваемость при M&A / реорганизации;
       - поведение лицензии при смене контроля (CoC);
       - необходимость согласия лицензиара.

    КРИТИЧЕСКИ ВАЖНО:
    - Извлекай ТОЛЬКО то, что прямо написано в тексте.
    - НЕ предполагай разрешение или запрет передачи,
      если они не указаны явно.
    - НЕ анализируй тип, срок, территорию и field of use —
      это задача ip_license_scope_and_usage.
    - Если передаваемость / CoC в договоре не урегулированы —
      license_transferability_status = "missing".
    - Если тексты по теме есть, но вывод сделать нельзя —
      license_transferability_status = "unclear".
    </role>

    <context_rules>
    - Некоторые фрагменты могут быть нерелевантны — игнорируй их.
    - Если фрагменты противоречат друг другу — используй "unclear"
      и объясни в reason.
    - "non-transferable" без исключений = запрет передачи в любом
      сценарии, включая M&A.
    - "deemed assignment" при CoC = смена контроля считается
      уступкой лицензии и требует согласия или прекращает её.
    - Affiliate carve-out = передача аффилированным лицам без
      согласия разрешена.
    - Если ни один фрагмент не содержит информации о передаваемости
      лицензии / CoC (нет упоминаний non-transferable / consent /
      change of control / affiliate / successor / merger) —
      license_transferability_status = "missing", location = null.
      Не использовать "unclear" при полном отсутствии релевантных
      фрагментов.
    </context_rules>

    <context>
    Ниже приведены релевантные фрагменты договора:

    {context}
    </context>

    <task>
    Заполни только следующие поля:
    - license_transfer_display
    - license_transferability_status
    - is_transferable_to_affiliates
    - is_transferable_on_mna
    - change_of_control_treatment
    - consent_requirement
    - reason
    </task>

    <location_instructions>
    Для каждого поля по возможности укажи location в формате:
    {"clause_ref": "п. 12.1", "page": 7, "quote": "дословная фраза из договора"}

    Правила:
    - clause_ref — короткая ссылка на пункт / раздел / статью именно в том
      виде, как она написана в договоре;
    - page — целое число страницы;
    - quote — дословная фраза из текста договора (НЕ пересказ, НЕ парафраз).
      Копируй её посимвольно, сохраняя формулировку и порядок слов.
      Оптимальная длина: 30–300 символов.
    - Для synthesized-поля license_transfer_display и reason
      location ВСЕГДА null.
    - Для license_transferability_status = "missing" — location = null.
    - Для license_transferability_status = "present" / "unclear" — quote
      с наиболее релевантной фразой договора о передаче / CoC.
    - Для is_transferable_to_affiliates, is_transferable_on_mna,
      change_of_control_treatment, consent_requirement:
      * если значение определённое ("yes" / "no" / "conditional" /
        "survives" / "consent_required" / "terminable" /
        "prohibited_assignment" / "always_required" /
        "required_for_mna_only" / "not_required") — quote
        с фразой-основанием;
      * если значение = "not_addressed" (тема не упомянута) —
        location = null;
      * если значение = "unclear" — location = null или quote
        с противоречивой фразой;
      * для "no" / "not_required":
        - если договор ПРЯМО запрещает / исключает
          («Передача не допускается», «Согласие не требуется») —
          quote ОБЯЗАТЕЛЬНА и должна содержать эту фразу;
        - если просто отсутствует упоминание — location = null.
    - Не выдумывай location или quote. Если дословную фразу определить
      нельзя — location = null.
    </location_instructions>

    <instructions>
    Шаг 0 — НАЛИЧИЕ РЕГУЛИРОВАНИЯ ПЕРЕДАВАЕМОСТИ ЛИЦЕНЗИИ

    Заполни "license_transferability_status".

    Значения:
    - "present" — если договор содержит substantive положения
      о передаваемости лицензии / CoC:
      * is_transferable_to_affiliates = "yes";
      * is_transferable_on_mna ∈ {"yes", "conditional"};
      * change_of_control_treatment ∈ {"survives", "consent_required",
        "terminable", "prohibited_assignment"};
      * consent_requirement ∈ {"always_required",
        "required_for_mna_only"};
      * ЛИБО любое поле = "no" / "not_required" / "not_addressed",
        но с заполненным location с прямой цитатой (см. RF3).
        Учитывается как признак наличия ТОЛЬКО при наличии
        прямой цитаты («Передача не допускается»,
        «Согласие не требуется»). Без цитаты "no" не считается
        сигналом наличия.
    - "missing" — если ни один фрагмент не содержит информации
      о передаваемости / CoC (все подчинённые поля = "not_addressed"
      или фрагментов нет вообще).
    - "unclear" — если упоминания есть, но невозможно определить
      наличие регулирования.

    Шаг 1 — ПЕРЕДАЧА АФФИЛИРОВАННЫМ ЛИЦАМ

    Заполни "is_transferable_to_affiliates".

    Значения:
    - "yes" — передача аффилированным лицам / intra-group
      прямо разрешена без дополнительного согласия.
    - "no" — передача аффилированным лицам требует согласия
      или прямо запрещена.
    - "not_addressed" — вопрос не урегулирован.
    - "unclear" — нельзя определить.

    Шаг 2 — ПЕРЕДАЧА ПРИ M&A / РЕОРГАНИЗАЦИИ

    Заполни "is_transferable_on_mna".

    Значения:
    - "yes" — передача при M&A / merger / acquisition /
      reorganization / successor прямо разрешена.
    - "conditional" — разрешена при выполнении условий
      (уведомление, согласие, ограничения).
    - "no" — передача при M&A запрещена / требует согласия
      лицензиара без гарантий его получения.
    - "not_addressed" — вопрос не урегулирован.
    - "unclear" — нельзя определить.

    Шаг 3 — ПОВЕДЕНИЕ ЛИЦЕНЗИИ ПРИ CoC

    Заполни "change_of_control_treatment".

    Значения:
    - "survives" — лицензия сохраняется при CoC
      без условий или только с уведомлением.
    - "consent_required" — CoC требует согласия лицензиара.
    - "terminable" — лицензиар вправе прекратить лицензию
      при CoC.
    - "prohibited_assignment" — CoC = запрещённая уступка
      (deemed assignment).
    - "not_addressed" — CoC не урегулирован.
    - "unclear" — нельзя определить.

    Шаг 4 — ТРЕБОВАНИЕ СОГЛАСИЯ

    Заполни "consent_requirement".

    Значения:
    - "always_required" — согласие лицензиара нужно
      при любой передаче.
    - "required_for_mna_only" — согласие нужно только
      при M&A, но не при передаче аффилированным лицам.
    - "not_required" — согласие не требуется.
    - "not_addressed" — вопрос не урегулирован.
    - "unclear" — нельзя определить.

    Шаг 5 — НОРМАЛИЗОВАННЫЙ DISPLAY ДЛЯ DD GRID

    Заполни "license_transfer_display".

    Это итоговое поле для таблицы.
    Строй его ТОЛЬКО на основе уже заполненных полей выше.
    Не добавляй информацию сверх них.

    Правила:
    - Если license_transferability_status = "missing":
      "Передаваемость не урегулирована; CoC не урегулирован"
    - Если все поля unclear:
      "Не удалось определить условия передачи лицензии"
    - Если всё not_addressed:
      "Передаваемость не урегулирована; CoC не урегулирован"
    - Иначе комбинируй через ";":
      * is_transferable_to_affiliates (кратко, если значимо)
      * is_transferable_on_mna (кратко)
      * change_of_control_treatment (кратко)
      * consent_requirement (если always_required)
    - Не более 4 коротких фактов через ";".

    Шаг 6 — КРАТКОЕ ОБОСНОВАНИЕ

    Заполни "reason".

    Правила:
    - Первое предложение — краткий вывод.
    - Второе — короткая цитата из текста (до 100 символов).
    - Пиши по-русски.
    </instructions>

    <edge_cases>
    - Non-transferable + CoC = запрещённая передача:
      * license_transferability_status = "present"
      * is_transferable_on_mna = "no"
      * change_of_control_treatment = "prohibited_assignment"
      * consent_requirement = "always_required"

    - Аффилированные разрешены, M&A — нет:
      * license_transferability_status = "present"
      * is_transferable_to_affiliates = "yes"
      * is_transferable_on_mna = "no"

    - CoC требует только уведомления, не согласия:
      * license_transferability_status = "present"
      * change_of_control_treatment = "survives"
      * consent_requirement = "not_required"

    - Ничего не урегулировано, но фрагменты по теме есть:
      * license_transferability_status = "present"
      * is_transferable_to_affiliates = "not_addressed"
      * is_transferable_on_mna = "not_addressed"
      * change_of_control_treatment = "not_addressed"
      * license_transfer_display =
        "Передаваемость не урегулирована; CoC не урегулирован"

    - Договор прямо запрещает передачу:
      * license_transferability_status = "present"
      * is_transferable_on_mna = "no"
      * location с прямой цитатой запрета.

    - Нет релевантных фрагментов / передаваемость лицензии
      в договоре не урегулирована:
      * license_transferability_status = "missing"
      * is_transferable_to_affiliates = "not_addressed"
      * is_transferable_on_mna = "not_addressed"
      * change_of_control_treatment = "not_addressed"
      * consent_requirement = "not_addressed"
      * license_transfer_display =
        "Передаваемость не урегулирована; CoC не урегулирован"
      * location у всех полей = null.

    - Формулировки есть, но вывод невозможен:
      * license_transferability_status = "unclear"
      * соответствующие поля = "unclear"
    </edge_cases>

    <output_expectations>
    - Верни результат строго в формате JSON.
    - Не оборачивай в markdown-блоки (без ```).
    - Не добавляй комментариев вне JSON.
    - Все значения полей с allowed_values — на английском.
    - Свободные текстовые поля (license_transfer_display, reason) —
      на русском языке.
    - Не добавляй полей, кроме указанных.
    - Для каждого поля возвращай объект с ключами
      "value", "confidence", "location".

    Пример структуры ответа:
    {
      "license_transfer_display": {"value": "Non-transferable; CoC — прекращение; согласие лицензиара", "confidence": 0.92, "location": null},
      "license_transferability_status": {"value": "present", "confidence": 0.95, "location": {"clause_ref": "п. 3.2", "page": 3, "quote": "Лицензия не подлежит передаче без предварительного письменного согласия Лицензиара"}},
      "is_transferable_to_affiliates": {"value": "no", "confidence": 0.90, "location": {"clause_ref": "п. 3.2", "page": 3, "quote": "Лицензия не подлежит передаче без предварительного письменного согласия Лицензиара"}},
      "is_transferable_on_mna": {"value": "no", "confidence": 0.85, "location": {"clause_ref": "п. 3.3", "page": 3, "quote": "Смена контроля над Лицензиатом считается уступкой лицензии и требует согласия Лицензиара"}},
      "change_of_control_treatment": {"value": "prohibited_assignment", "confidence": 0.90, "location": {"clause_ref": "п. 3.3", "page": 3, "quote": "Смена контроля над Лицензиатом считается уступкой лицензии"}},
      "consent_requirement": {"value": "always_required", "confidence": 0.90, "location": {"clause_ref": "п. 3.2", "page": 3, "quote": "без предварительного письменного согласия Лицензиара"}},
      "reason": {"value": "...", "confidence": 0.90, "location": null}
    }
    </output_expectations>

  fields:
    - name: "license_transfer_display"
      type: "string"
      presentation: "fact"
      label: "Передаваемость и CoC"
      description: "Нормализованный user-facing вывод для DD Grid"
      display_in_grid: true
      display_priority: 1

    - name: "license_transferability_status"
      type: "string"
      presentation: "signal"
      risk_weight: "info"
      description: "Наличие регулирования передаваемости лицензии и CoC в договоре"
      display_in_grid: false
      allowed_values:
        - "present"
        - "missing"
        - "unclear"

    - name: "is_transferable_to_affiliates"
      type: "string"
      presentation: "signal"
      risk_weight: "low"
      description: "Передача аффилированным лицам"
      allowed_values:
        - "yes"
        - "no"
        - "not_addressed"
        - "unclear"
      display_in_grid: false

    - name: "is_transferable_on_mna"
      type: "string"
      presentation: "signal"
      risk_weight: "high"
      description: "Передача при M&A / реорганизации"
      allowed_values:
        - "yes"
        - "conditional"
        - "no"
        - "not_addressed"
        - "unclear"
      display_in_grid: false

    - name: "change_of_control_treatment"
      type: "string"
      presentation: "signal"
      risk_weight: "high"
      description: "Поведение лицензии при CoC"
      allowed_values:
        - "survives"
        - "consent_required"
        - "terminable"
        - "prohibited_assignment"
        - "not_addressed"
        - "unclear"
      display_in_grid: false

    - name: "consent_requirement"
      type: "string"
      presentation: "signal"
      risk_weight: "high"
      description: "Требование согласия лицензиара"
      allowed_values:
        - "always_required"
        - "required_for_mna_only"
        - "not_required"
        - "not_addressed"
        - "unclear"
      display_in_grid: false

    - name: "reason"
      type: "string"
      presentation: "diagnostic"
      description: "Обоснование"
      display_in_grid: false

  store_payload: true


  