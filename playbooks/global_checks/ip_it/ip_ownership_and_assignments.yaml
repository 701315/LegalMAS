id: "ip_ownership_and_assignments"
name: "Принадлежность IP и assignment от разработчиков"
description: >
  Анализирует принадлежность ключевых IP-активов: ПО, результатов работ,
  контента, а также наличие договоров/актoв передачи прав от основателей
  и подрядчиков.

doc_types: []

severity: "critical"
severity_if_fail: "critical"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"

rules:
  keywords:
    - "интеллектуальная собственность"
    - "intellectual property"
    - "IP"
    - "исключительные права"
    - "exclusive rights"
    - "авторские права"
    - "copyright"
    - "патент"
    - "знаки для товаров и услуг"
    - "trademark"
    - "результаты работ"
    - "work product"
    - "служебное произведение"
    - "work made for hire"
    - "assignment"
    - "передача прав"
    - "cede"
    - "отчуждение прав"
    - "developer"
    - "подрядчик"
    - "founder"
  keyword_mode: "any"
  regex_patterns: []
  clause_patterns: []

llm:
  prompt_template: |
    <role>
    Ты — юрист по интеллектуальной собственности и технологиям.
    Твоя специализация — структурирование прав на IP в технологических компаниях,
    включая assignment от основателей и разработчиков.
    </role>

    <context>
    Ниже приведены фрагменты договора и/или соглашений, где регулируются
    права на результаты работ и IP:

    {context}
    </context>

    <instructions>
    Определи:

    1) Кому принадлежат ключевые IP-активы:
       - ПО и исходный код,
       - контент и базы данных,
       - товарные знаки/бренды и иные объекты.
       Кратко опиши это в ip_owner_description (кто формально указан владельцем).

    2) Есть ли явные положения об assignment/отчуждении прав от:
       - основателей и/или акционеров,
       - сотрудников (служебные произведения, отдельные соглашения),
       - подрядчиков/разработчиков (service providers, freelancers).
       Отрази это раздельно:
       * has_assignments_from_founders_and_employees,
       * has_assignments_from_contractors.

    3) Насколько полно выглядит объём передачи:
       - охватывает ли передача все способы использования (all fields of use),
         все территории (worldwide) и весь срок действия прав;
       - указано ли, что права передаются в полном объёме, без ограничений
         и с правом дальнейшего распоряжения (в т.ч. сublicense/assignment).
       Оцени это в assignment_scope_appears_full: yes / no / unclear.

    4) Есть ли основания считать, что часть IP фактически остаётся у
       разработчиков или третьих лиц:
       - упоминание использования сторонних библиотек/компонентов без ясного
         распределения прав;
       - отсутствие явного assignment от ключевого подрядчика;
       - указание, что права принадлежат разработчику, а Target имеет только лицензию.
       Учти это при оценке ip_ownership_risk_level.

    5) Насколько рискованна текущая конфигурация прав для Target:
       - оцени ip_ownership_risk_level: low / medium / high / unclear,
         исходя из прозрачности владения IP и полноты assignment;
       - оцени общий риск overall_risk_level: low / medium / high с точки зрения
         потенциальных претензий, невозможности свободно отчуждать IP или строить на нём бизнес.
    </instructions>

    <edge_cases>
    ВАЖНО — пограничные случаи:

    — Если в уставных документах/договорах прописано, что все служебные
      произведения принадлежат работодателю, но нет отдельных assignment
      от подрядчиков:
      has_assignments_from_founders_and_employees = "yes",
      has_assignments_from_contractors = "no" или "unclear" (по тексту),
      укажи это в reason.

    — Если ключевой продукт создан до регистрации компании и права формально
      принадлежат основателям, но отдельного договора отчуждения на Target нет:
      ip_owner_description укажи честно (права у основателей),
      ip_ownership_risk_level и overall_risk_level, как правило, "high".

    — Если есть формулировки "all rights, title and interest are hereby assigned
      to Company" в договорах с основателями, сотрудниками и всеми ключевыми
      подрядчиками, с охватом всех территорий и сроков:
      assignment_scope_appears_full = "yes",
      ip_ownership_risk_level может быть "low" (обоснуй).

    — Если по фрагментам нельзя понять, кому принадлежат права и есть только
      общие упоминания "интеллектуальная собственность компании":
      ip_owner_description формулируй как "unclear" / нейтрально,
      ip_ownership_risk_level = "unclear".

    — Пустые или нерелевантные фрагменты:
      большинство полей = "unclear" или пустые строки,
      overall_risk_level = "medium",
      reason = "Недостаточно данных для анализа принадлежности IP и наличия assignment от разработчиков."
    </edge_cases>

    <examples>
    ПРИМЕР 1 — ПОЛНЫЙ ASSIGNMENT ОТ ВСЕХ КЛЮЧЕВЫХ ЛИЦ (LOW):

    Фрагмент: "Все исключительные права на результаты работ, включая исходный
    код Продукта, отчуждаются и переходят к Обществу. Основатели и все
    сотрудники заключили договоры отчуждения прав. Подрядчики по договорам
    разработки также передают Обществу все права на созданные ими работы
    на территории всего мира на весь срок действия прав."

    {{
      "ip_owner_description": "Все ключевые IP-активы (исходный код, результаты работ) принадлежат Обществу на основании договоров отчуждения.",
      "has_assignments_from_founders_and_employees": "yes",
      "has_assignments_from_contractors": "yes",
      "assignment_scope_appears_full": "yes",
      "ip_ownership_risk_level": "low",
      "overall_risk_level": "low",
      "reason": "Есть явные договора отчуждения от основателей, сотрудников и подрядчиков с полным объёмом прав (все территории и срок). Риск споров о принадлежности IP низкий."
    }}

    ПРИМЕР 2 — НЕТ ASSIGNMENT ОТ ПОДРЯДЧИКОВ (HIGH):

    Фрагмент: "ПО разработано ООО 'ДевСтудия' по договору подряда.
    Договор предусматривает предоставление неисключительной лицензии
    Заказчику на использование результата работ. Отдельные соглашения
    об отчуждении прав не заключались."

    {{
      "ip_owner_description": "Права на ПО формально остаются у подрядчика, Общество имеет лишь лицензию.",
      "has_assignments_from_founders_and_employees": "unclear",
      "has_assignments_from_contractors": "no",
      "assignment_scope_appears_full": "no",
      "ip_ownership_risk_level": "high",
      "overall_risk_level": "high",
      "reason": "Ключевое ПО создано подрядчиком, при этом предусмотрена только неисключительная лицензия без отчуждения прав в пользу Target, что создаёт высокий риск отсутствия контроля над IP."
    }}

    ПРИМЕР 3 — НЕПОЛНАЯ ОПРЕДЕЛЁННОСТЬ (MEDIUM/UNCLEAR):

    Фрагмент: "Все права на служебные произведения сотрудников принадлежат
    Работодателю в силу закона. Использование сторонних компонентов
    регулируется отдельными соглашениями с правообладателями."

    {{
      "ip_owner_description": "Права на служебные произведения сотрудников принадлежат Работодателю; статус прав на сторонние компоненты не раскрыт.",
      "has_assignments_from_founders_and_employees": "yes",
      "has_assignments_from_contractors": "unclear",
      "assignment_scope_appears_full": "unclear",
      "ip_ownership_risk_level": "medium",
      "overall_risk_level": "medium",
      "reason": "Права на служебные произведения закреплены за работодателем, но статус сторонних компонентов и подрядчиков не ясен, что создаёт умеренный риск."
    }}
    </examples>

    <output_format>
    Твой ответ ДОЛЖЕН быть строго валидным JSON-объектом со следующими
    полями:

    {{
      "ip_owner_description": "string — краткое описание того, кому принадлежат ключевые IP-активы (компания, основатели, подрядчики и т.п.)",
      "has_assignments_from_founders_and_employees": "one of: yes | no | unclear",
      "has_assignments_from_contractors": "one of: yes | no | unclear",
      "assignment_scope_appears_full": "one of: yes | no | unclear",
      "ip_ownership_risk_level": "one of: low | medium | high | unclear",
      "overall_risk_level": "one of: low | medium | high",
      "reason": "string — краткое объяснение на русском с указанием ключевых формулировок и рисков для владения IP"
    }}

    Все перечисленные поля ДОЛЖНЫ присутствовать в JSON, даже если их значение равно null.
    </output_format>

    <constraints>
    ЖЁСТКИЕ ПРАВИЛА:
    1. Выведи ТОЛЬКО один JSON-объект. Никакого текста до или после.
    2. Не пиши "Вот JSON", "Here is the JSON" и т.п.
    3. Не используй Markdown, бэктики ``` или любые обёртки.
    4. Все строки — в двойных кавычках.
    5. Значения перечислимых полей — СТРОГО из указанных вариантов.
    6. Ключи — точно как указано, без добавления новых.
    7. Поле "reason" ДОЛЖНО содержать конкретные факты и формулировки
       из фрагментов, а не общие фразы вроде "есть риски".
    8. Начни ответ сразу с символа {{
    9. Если по какому‑то полю нет достаточно информации в тексте —
       верни для него 'unclear' или null (для reason пустое значение
       недопустимо — нужно объяснение). НЕ придумывай значения, не интерполируй.
    </constraints>
  prompt_file: null
  context_k: 5
  temperature: 0.0
  max_tokens: 640

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 700

retrieval:
  context_k: 5
  max_chunks: 10
  boost_keywords:
    - "intellectual property"
    - "результаты работ"
    - "assignment"
    - "отчуждение прав"
    - "служебное произведение"
  rerank: true
  filters: {}

conditional: null

extraction:
  enabled: true
  mode: "hybrid"
  fields:
    - name: "ip_owner_description"
      type: "string"
    - name: "has_assignments_from_founders_and_employees"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
    - name: "has_assignments_from_contractors"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
    - name: "assignment_scope_appears_full"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
    - name: "ip_ownership_risk_level"
      type: "string"
      allowed_values:
        - "low"
        - "medium"
        - "high"
        - "unclear"
    - name: "overall_risk_level"
      type: "string"
      allowed_values:
        - "low"
        - "medium"
        - "high"
    - name: "reason"
      type: "string"
  store_payload: true

red_flags:
  items:
    - code: "IP1"
      description: "Ключевые IP-активы не принадлежат Target (висят на основателях/подрядчиках/третьем лице)."
    - code: "IP2"
      description: "Отсутствуют явные assignment-документы от ключевых разработчиков."