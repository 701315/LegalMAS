id: "ip_ownership_and_assignments"
name: "Принадлежность IP и assignment от разработчиков"
group: "IP"
description: >
  Анализирует принадлежность ключевых IP-активов: ПО, исходного
  кода, результатов работ, контента, баз данных, товарных знаков
  и иных объектов интеллектуальной собственности.

  Проверяет цепочку прав (chain of title), наличие assignment /
  отчуждения прав от основателей, сотрудников и подрядчиков,
  полноту объёма передачи прав, признаки сторонних или
  pre-existing IP.

  Формирует краткий user-facing вывод и оценивает риск того,
  что ключевые IP-активы не полностью принадлежат Target или не
  могут быть свободно монетизированы / переданы в рамках сделки.

doc_types: []

severity: "critical"
severity_if_fail: "critical"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"
ui_mode: "field_extraction"

rules:
  keyword_mode: any

  keywords:
    high:
      # Общие IP-термины
      - "(?i)intellectual\\s+property"
      - "(?i)интеллектуальн(ая|ой)\\s+собственност"
      - "(?i)exclusive\\s+rights?"
      - "(?i)исключительн(ые|ых)\\s+прав"
      - "(?i)copyright"
      - "(?i)авторск(ие|их)\\s+прав"
      - "(?i)trademark"
      - "(?i)товарн(ый|ые)\\s+знак"
      - "(?i)patent"
      - "(?i)патент"
      - "(?i)database\\s+rights?"
      - "(?i)баз[аы]\\s+данных"

      # ПО / результаты работ
      - "(?i)source\\s+code"
      - "(?i)исходн(ый|ого)\\s+код"
      - "(?i)software"
      - "(?i)программн(ое|ого)\\s+обеспечени"
      - "(?i)work\\s+product"
      - "(?i)результат(ы|ов)\\s+работ"
      - "(?i)deliverables?"
      - "(?i)служебн(ое|ого)\\s+произведени"
      - "(?i)work\\s+made\\s+for\\s+hire"

      # Assignment / отчуждение — точные формулы
      - "(?i)all\\s+right,\\s*title\\s+and\\s+interest"
      - "(?i)все\\s+права\\s+передаются"
      - "(?i)hereby\\s+assigns?"
      - "(?i)assign(ed)?\\s+all\\s+(rights?|IP)"
      - "(?i)передач[аеи]\\s+прав[\\s\\S]{0,20}(ПО|IP|произведени)"
      - "(?i)отчуждени[ея]\\s+прав[\\s\\S]{0,20}(ПО|IP|произведени)"
      - "(?i)IP\\s+assignment\\s+agreement"
      - "(?i)deed\\s+of\\s+assignment"
      - "(?i)акт\\s+отчуждения"

      # Основатели / сотрудники / подрядчики
      - "(?i)founder[\\s\\S]{0,20}(IP|rights?|assign)"
      - "(?i)основател[\\s\\S]{0,20}(IP|прав|передач)"
      - "(?i)developer[\\s\\S]{0,20}(assign|rights?|IP)"
      - "(?i)разработчик[\\s\\S]{0,20}(передач|прав)"
      - "(?i)contractor[\\s\\S]{0,20}(assign|rights?|IP)"
      - "(?i)подрядчик[\\s\\S]{0,20}(передач|прав)"

    medium:
      # Chain of title / pre-existing IP
      - "(?i)chain\\s+of\\s+title"
      - "(?i)цепочк[аи]\\s+прав"
      - "(?i)pre[-\\s]?existing\\s+IP"
      - "(?i)background\\s+IP"
      - "(?i)retains?\\s+ownership"
      - "(?i)retains?\\s+all\\s+rights?"
      - "(?i)сохраняет\\s+прав[ао]"
      - "(?i)ранее\\s+созданн(ое|ые)\\s+(ПО|IP)"

      # Лицензия вместо assignment
      - "(?i)license\\s+only[\\s\\S]{0,20}(not\\s+assign|не\\s+передает)"
      - "(?i)grants?\\s+a\\s+(non[-\\s]?exclusive\\s+)?license[\\s\\S]{0,20}(no\\s+ownership|не\\s+передает\\s+прав)"

      # Полнота assignment
      - "(?i)worldwide[\\s\\S]{0,20}(irrevocable|perpetual|all\\s+rights)"
      - "(?i)for\\s+the\\s+full\\s+term[\\s\\S]{0,20}(copyright|охраны)"
      - "(?i)на\\s+весь\\s+срок\\s+охраны"
      - "(?i)irrevocable[\\s\\S]{0,20}(assignment|assign)"
      - "(?i)безотзывн[аяо]\\s+передач"

      # Акты передачи
      - "(?i)acceptance\\s+certificate"
      - "(?i)акт\\s+приема[-\\s]?передачи"

      # Open source / third-party
      - "(?i)open\\s+source"
      - "(?i)third[-\\s]?party\\s+(component|software|IP)"
      - "(?i)сторонн(ий|ие)\\s+(компонент|ПО|IP)"

    low:
      - "(?i)all\\s+right,\\s*title\\s+and\\s+interest"
      - "(?i)hereby\\s+assigns?"
      - "(?i)deed\\s+of\\s+assignment"
      - "(?i)pre[-\\s]?existing\\s+IP"
      - "(?i)background\\s+IP"
      - "(?i)chain\\s+of\\s+title"
      - "(?i)служебн[оое]\\s+произведени"
      - "(?i)work\\s+made\\s+for\\s+hire"
      - "(?i)open\\s+source"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 800

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 700

retrieval:
  retrieval_profile: "ip_ownership_check"
  context_k: 5
  max_chunks: 12

  retrieval_query: >
    интеллектуальная собственность исключительные права отчуждение передача прав 
    служебное произведение исходный код результаты работ разработчик подрядчик 
    основатель цепочка прав

  boost_keywords:
    - "intellectual property"
    - "интеллектуальная собственность"
    - "exclusive rights"
    - "исключительные права"
    - "source code"
    - "исходный код"
    - "work product"
    - "результаты работ"
    - "all right title and interest"
    - "hereby assigns"
    - "служебное произведение"
    - "work made for hire"
    - "founder"
    - "основатель"
    - "developer"
    - "разработчик"
    - "contractor"
    - "подрядчик"
    - "deed of assignment"
    - "IP assignment agreement"
    - "акт приема-передачи"
    - "pre-existing IP"
    - "background IP"
    - "chain of title"
    - "retains ownership"
    - "license only"
    - "open source"

  negative_keywords:
    - "коммерческая тайна"
    - "конфиденциальная информация"
    - "подсудность"
    - "форс-мажор"
    - "условия оплаты"

  preferred_unit_types:
    - "general_provision"
    - "obligation"

  excluded_unit_types:
    - "technical_fragment"
    - "appendix_reference"

  preferred_clause_functions:
    - "rights"
    - "procedures"
    - "representations"

  position_bias:
    preferred_range: [0.0, 1.0]
    boost: 0.10
    scope: "segment"

  rerank: true
  filters: {}

conditional: null

enrichment_hints:
  preferred_segment_types:
    - "contract"
    - "annex"
    - "appendix"
    - "amendment"
  excluded_segment_types:
    - "technical_specification"
    - "price_list"
    - "invoice"
    - "act"
  confidence_bonus_on_match: 0.10
  confidence_penalty_on_excluded_segment: 0.15

extraction:
  enabled: true
  mode: "hybrid"
  llm_max_tokens: 1150

  presence_signal:
    field: "ip_ownership_status"
    present_values: ["present"]
    missing_values: ["missing"]
    unclear_values: ["unclear"]

  llm_prompt_extraction: |
    <role>
    Ты — юрист по интеллектуальной собственности.
    Твоя задача — точно извлечь из текста:
    1) есть ли в договоре регулирование принадлежности IP;
    2) если есть — какие условия установлены:
       - кому принадлежат ключевые IP-активы;
       - есть ли assignment от основателей / сотрудников;
       - есть ли assignment от подрядчиков / разработчиков;
       - насколько полон scope передачи прав;
       - признаки third-party / pre-existing IP;
       - чистота chain of title.

    КРИТИЧЕСКИ ВАЖНО:
    - Извлекай ТОЛЬКО то, что прямо написано в тексте.
    - НЕ предполагай chain of title без явных данных.
    - НЕ считай лицензию эквивалентом assignment.
    - Если раздел об IP ownership в договоре отсутствует —
      ip_ownership_status = "missing".
    - Если тексты по теме есть, но вывод сделать нельзя —
      ip_ownership_status = "unclear".
    </role>

    <context_rules>
    - Некоторые фрагменты могут быть нерелевантны — игнорируй их.
    - Если фрагменты противоречат друг другу — используй "unclear"
      и объясни в reason.
    - Assignment = "all right, title and interest hereby assigned",
      deed of assignment, отчуждение прав. Лицензия ≠ assignment.
    - Служебные произведения / work made for hire = права
      автоматически принадлежат работодателю без отдельного
      документа — считается "yes" для employees.
    - Pre-existing IP / background IP = риск: лицензиар может
      только выдать лицензию, но не передать права.
    - Если ни один фрагмент не содержит информации об IP ownership /
      assignment (нет упоминаний IP / intellectual property / assignment /
      отчуждение / founder / employee / contractor) —
      ip_ownership_status = "missing", location = null.
      Не использовать "unclear" при полном отсутствии релевантных
      фрагментов.
    </context_rules>

    <context>
    Ниже приведены релевантные фрагменты договора:

    {context}
    </context>

    <task>
    Заполни только следующие поля:
    - ip_ownership_display
    - ip_ownership_status
    - ip_owner_status
    - has_assignments_from_founders_and_employees
    - has_assignments_from_contractors
    - assignment_scope_appears_full
    - has_third_party_or_preexisting_ip_risk
    - chain_of_title_clarity
    - reason
    </task>

    <location_instructions>
    Для каждого поля по возможности укажи location в формате:
    {"clause_ref": "п. 12.1", "page": 7, "quote": "дословная фраза из договора"}

    Правила:
    - clause_ref — короткая ссылка на пункт / раздел / статью именно в том
      виде, как она написана в договоре;
    - page — целое число страницы;
    - quote — дословная фраза из текста договора (НЕ пересказ, НЕ парафраз).
      Копируй её посимвольно, сохраняя формулировку и порядок слов.
      Оптимальная длина: 30–300 символов.
    - Для synthesized-поля ip_ownership_display и reason
      location ВСЕГДА null.
    - Для ip_ownership_status = "missing" — location = null.
    - Для ip_ownership_status = "present" / "unclear" — quote
      с наиболее релевантной фразой договора об IP / assignment.
    - Для ip_owner_status — quote с фразой о принадлежности прав
      (например, "все права принадлежат Заказчику").
    - Для has_assignments_* и assignment_scope_appears_full:
      * если значение = "yes" / "partial" — quote с формулой передачи
        ("all right, title and interest hereby assigned");
      * если значение = "no" — различай два случая:
        - договор ПРЯМО фиксирует отсутствие / только лицензию
          («Предоставляется только лицензия, права не передаются»,
          «Разработчик сохраняет права») — quote ОБЯЗАТЕЛЬНА;
        - просто отсутствует упоминание — location = null.
    - Для has_third_party_or_preexisting_ip_risk — quote с фразой
      про pre-existing IP / retained rights / open source.
    - Для chain_of_title_clarity — quote с фразой, обосновывающей
      статус (clear / partial / not_established).
    - Не выдумывай location или quote. Если дословную фразу определить
      нельзя — location = null.
    </location_instructions>

    <instructions>
    Шаг 0 — НАЛИЧИЕ РЕГУЛИРОВАНИЯ ПРИНАДЛЕЖНОСТИ IP

    Заполни "ip_ownership_status".

    Значения:
    - "present" — если договор содержит substantive положения
      о принадлежности IP / assignment:
      * ip_owner_status ∈ {"target", "founders", "contractors",
        "mixed", "third_party"};
      * has_assignments_from_founders_and_employees ∈ {"yes", "partial"};
      * has_assignments_from_contractors ∈ {"yes", "partial"};
      * assignment_scope_appears_full ∈ {"yes", "partial"};
      * has_third_party_or_preexisting_ip_risk = "yes";
      * chain_of_title_clarity ∈ {"clear", "partial"};
      * ЛИБО любое поле = "no" / "not_established", но с заполненным
        location с прямой цитатой (см. RF3). Учитывается как признак
        наличия ТОЛЬКО при наличии прямой цитаты («Разработчик
        сохраняет права», «Chain of title не установлена»).
        Без цитаты "no" не считается сигналом наличия.
    - "missing" — если ни один фрагмент не содержит информации
      об IP ownership / assignment.
    - "unclear" — если упоминания есть, но невозможно определить
      наличие регулирования.

    Шаг 1 — ФОРМАЛЬНЫЙ ВЛАДЕЛЕЦ IP

    Заполни "ip_owner_status".

    Значения:
    - "target" — IP принадлежит Target по документам.
    - "founders" — IP формально у основателей.
    - "contractors" — IP у подрядчиков / разработчиков.
    - "mixed" — частично Target, частично третьи лица.
    - "third_party" — у стороннего правообладателя.
    - "unclear" — нельзя определить.

    Шаг 2 — ASSIGNMENT ОТ ОСНОВАТЕЛЕЙ И СОТРУДНИКОВ

    Заполни "has_assignments_from_founders_and_employees".

    Значения:
    - "yes" — явный assignment или режим служебных произведений
      / work made for hire.
    - "no" — assignment отсутствует или только лицензия.
    - "partial" — для части есть, для части нет.
    - "unclear" — нельзя определить.

    Шаг 3 — ASSIGNMENT ОТ ПОДРЯДЧИКОВ

    Заполни "has_assignments_from_contractors".

    Значения:
    - "yes" — явное отчуждение прав на результаты работ.
    - "no" — нет; только лицензия или retained rights.
    - "partial" — частично есть.
    - "unclear" — нельзя определить.

    Шаг 4 — ПОЛНОТА SCOPE

    Заполни "assignment_scope_appears_full".

    Значения:
    - "yes" — worldwide / full term / all uses /
      derivative works / irrevocable.
    - "no" — scope явно ограничен.
    - "partial" — часть элементов есть, часть нет.
    - "unclear" — нельзя определить.

    Шаг 5 — THIRD-PARTY / PRE-EXISTING IP РИСК

    Заполни "has_third_party_or_preexisting_ip_risk".

    Значения:
    - "yes" — Target получает только лицензию на pre-existing IP;
      retained rights у третьих лиц; значимые open source /
      third-party компоненты без assignment.
    - "no" — признаков нет.
    - "unclear" — нельзя определить.

    Шаг 6 — CHAIN OF TITLE

    Заполни "chain_of_title_clarity".

    Значения:
    - "clear" — цепочка прав явно прослеживается.
    - "partial" — частично прослеживается.
    - "not_established" — chain of title не установлена
      или есть явные пробелы.
    - "unclear" — нельзя определить по фрагментам.

    Шаг 7 — НОРМАЛИЗОВАННЫЙ DISPLAY ДЛЯ DD GRID

    Заполни "ip_ownership_display".

    Это итоговое поле для таблицы.
    Строй его ТОЛЬКО на основе уже заполненных полей выше.
    Не добавляй информацию сверх них.

    Правила:
    - Если ip_ownership_status = "missing":
      "Принадлежность IP в договоре не урегулирована"
    - Если все поля unclear:
      "Не удалось определить принадлежность IP"
    - Иначе комбинируй через ";":
      * начни с ip_owner_status
      * если has_assignments_from_founders_and_employees = "no":
        "assignment от основателей отсутствует"
      * если has_assignments_from_contractors = "no":
        "assignment от подрядчиков отсутствует"
      * если chain_of_title_clarity = "not_established":
        "chain of title не установлена"
      * если has_third_party_or_preexisting_ip_risk = "yes":
        "риск third-party IP"
    - Не более 3 коротких фактов через ";".

    Шаг 8 — КРАТКОЕ ОБОСНОВАНИЕ

    Заполни "reason".

    Правила:
    - Первое предложение — краткий вывод.
    - Второе — короткая цитата из текста (до 100 символов).
    - Пиши по-русски.
    </instructions>

    <edge_cases>
    - Служебные произведения без assignment от подрядчиков:
      * ip_ownership_status = "present"
      * has_assignments_from_founders_and_employees = "yes"
      * has_assignments_from_contractors = "no"

    - Target только лицензиат ключевого IP:
      * ip_ownership_status = "present"
      * has_third_party_or_preexisting_ip_risk = "yes"

    - "All right, title and interest worldwide, irrevocable":
      * ip_ownership_status = "present"
      * assignment_scope_appears_full = "yes"

    - Нет данных о chain of title (фрагменты есть):
      * ip_ownership_status = "present"
      * chain_of_title_clarity = "unclear"

    - Договор прямо фиксирует сохранение прав за разработчиком:
      * ip_ownership_status = "present"
      * has_assignments_from_contractors = "no"
      * location с прямой цитатой о retained rights.

    - Нет релевантных фрагментов / раздел об IP ownership
      в договоре отсутствует:
      * ip_ownership_status = "missing"
      * ip_owner_status = "unclear"
      * has_assignments_from_founders_and_employees = "unclear"
      * has_assignments_from_contractors = "unclear"
      * assignment_scope_appears_full = "unclear"
      * has_third_party_or_preexisting_ip_risk = "no"
      * chain_of_title_clarity = "not_established"
      * ip_ownership_display =
        "Принадлежность IP в договоре не урегулирована"
      * location у всех полей = null.

    - Формулировки есть, но вывод невозможен:
      * ip_ownership_status = "unclear"
      * соответствующие поля = "unclear"
    </edge_cases>

    <output_expectations>
    - Верни результат строго в формате JSON.
    - Не оборачивай в markdown-блоки (без ```).
    - Не добавляй комментариев вне JSON.
    - Все значения полей с allowed_values — на английском.
    - Свободные текстовые поля (ip_ownership_display, reason) —
      на русском языке.
    - Не добавляй полей, кроме указанных.
    - Для каждого поля возвращай объект с ключами
      "value", "confidence", "location".

    Пример структуры ответа:
    {
      "ip_ownership_display": {"value": "IP принадлежит Target; assignment полный; chain of title чистая", "confidence": 0.92, "location": null},
      "ip_ownership_status": {"value": "present", "confidence": 0.95, "location": {"clause_ref": "п. 7.1", "page": 5, "quote": "Все исключительные права на результаты работ принадлежат Заказчику"}},
      "ip_owner_status": {"value": "target", "confidence": 0.95, "location": {"clause_ref": "п. 7.1", "page": 5, "quote": "Все исключительные права на результаты работ принадлежат Заказчику"}},
      "has_assignments_from_founders_and_employees": {"value": "yes", "confidence": 0.85, "location": null},
      "has_assignments_from_contractors": {"value": "yes", "confidence": 0.90, "location": {"clause_ref": "п. 7.3", "page": 5, "quote": "Исполнитель передает Заказчику все права, title и interest на результаты работ"}},
      "assignment_scope_appears_full": {"value": "yes", "confidence": 0.85, "location": {"clause_ref": "п. 7.4", "page": 5, "quote": "Передача прав осуществляется безотзывно, на весь срок охраны, на территории всех стран мира"}},
      "has_third_party_or_preexisting_ip_risk": {"value": "no", "confidence": 0.70, "location": null},
      "chain_of_title_clarity": {"value": "clear", "confidence": 0.85, "location": null},
      "reason": {"value": "...", "confidence": 0.90, "location": null}
    }
    </output_expectations>

  fields:
    - name: "ip_ownership_display"
      type: "string"
      presentation: "fact"
      label: "Принадлежность IP"
      description: "Нормализованный user-facing вывод для DD Grid"
