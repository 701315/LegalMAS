id: "ip_ownership_and_assignments"
name: "Принадлежность IP и assignment от разработчиков"
description: >
  Анализирует принадлежность ключевых IP-активов: ПО, исходного кода,
  результатов работ, контента, баз данных, товарных знаков и иных объектов
  интеллектуальной собственности. Проверяет цепочку прав (chain of title),
  наличие assignment / отчуждения прав от основателей, сотрудников и подрядчиков,
  полноту объёма передачи прав, а также признаки сторонних или pre-existing IP.
  Оценивает риск того, что ключевые IP-активы не полностью принадлежат Target
  или не могут быть свободно монетизированы / переданы в рамках сделки.

doc_types: []

severity: "critical"
severity_if_fail: "critical"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"

rules:
  keyword_mode: any

  keywords:
    high:
      # Общие IP-термины
      - "(?i)intellectual\\s+property"
      - "(?i)интеллектуальн(ая|ой)\\s+собственност"
      - "(?i)exclusive\\s+rights?"
      - "(?i)исключительн(ые|ых)\\s+прав"
      - "(?i)copyright"
      - "(?i)авторск(ие|их)\\s+прав"
      - "(?i)trademark"
      - "(?i)товарн(ый|ые)\\s+знак"
      - "(?i)patent"
      - "(?i)патент"
      - "(?i)database\\s+rights?"
      - "(?i)баз[аы]\\s+данных"

      # ПО / результаты работ
      - "(?i)source\\s+code"
      - "(?i)исходн(ый|ого)\\s+код"
      - "(?i)software"
      - "(?i)программн(ое|ого)\\s+обеспечени"
      - "(?i)work\\s+product"
      - "(?i)результат(ы|ов)\\s+работ"
      - "(?i)deliverables?"
      - "(?i)служебн(ое|ого)\\s+произведени"
      - "(?i)work\\s+made\\s+for\\s+hire"

      # Assignment / отчуждение
      - "(?i)assignment"
      - "(?i)assign(ed|ment)?\\s+(all\\s+)?rights?"
      - "(?i)передач[аеи]\\s+прав"
      - "(?i)отчуждени[ея]\\s+прав"
      - "(?i)cede"
      - "(?i)all\\s+right,\\s*title\\s+and\\s+interest"
      - "(?i)все\\s+права\\s+передаются"
      - "(?i)hereby\\s+assigns?"

      # Основатели / сотрудники / подрядчики
      - "(?i)founder"
      - "(?i)основател"
      - "(?i)developer"
      - "(?i)разработчик"
      - "(?i)contractor"
      - "(?i)подрядчик"
      - "(?i)employee"
      - "(?i)работник"
      - "(?i)consultant"
      - "(?i)консультант"

    medium:
      # Chain of title / pre-existing IP
      - "(?i)chain\\s+of\\s+title"
      - "(?i)цепочк[аи]\\s+прав"
      - "(?i)pre[-\\s]?existing\\s+IP"
      - "(?i)предшествующ(ая|ие)\\s+интеллектуальн"
      - "(?i)background\\s+IP"
      - "(?i)existing\\s+materials?"
      - "(?i)ранее\\s+созданн(ое|ые)\\s+ПО"
      - "(?i)retains?\\s+ownership"
      - "(?i)сохраняет\\s+прав[ао]"

      # Лицензия вместо assignment
      - "(?i)license\\s+only"
      - "(?i)non[-\\s]?exclusive\\s+license"
      - "(?i)предоставля[ею]тся\\s+права\\s+использования"
      - "(?i)лицензи[яи]\\s+вместо\\s+отчуждения"
      - "(?i)grants?\\s+a\\s+license"
      - "(?i)retains?\\s+all\\s+rights?"

      # Полнота assignment
      - "(?i)worldwide"
      - "(?i)по\\s+всему\\s+миру"
      - "(?i)for\\s+the\\s+full\\s+term"
      - "(?i)на\\s+весь\\s+срок\\s+охраны"
      - "(?i)all\\s+fields\\s+of\\s+use"
      - "(?i)во\\s+всех\\s+сферах\\s+использования"
      - "(?i)irrevocable"
      - "(?i)безотзывн"

      # Акты / подтверждение передачи
      - "(?i)acceptance\\s+certificate"
      - "(?i)акт\\s+приема[-\\s]?передачи"
      - "(?i)deed\\s+of\\s+assignment"
      - "(?i)акт\\s+отчуждения"
      - "(?i)IP\\s+assignment\\s+agreement"

      # Open source / third-party
      - "(?i)open\\s+source"
      - "(?i)opensource"
      - "(?i)открыт(ый|ого)\\s+исходн(ый|ого)\\s+код"
      - "(?i)third[-\\s]?party\\s+component"
      - "(?i)сторонн(ий|ие)\\s+компонент"

    low:
      # Общие маркеры
      - "(?i)IP"
      - "(?i)прав[ао]\\s+на\\s+ПО"
      - "(?i)ownership"
      - "(?i)принадлеж"
      - "(?i)rights?"
      - "(?i)прав[аоы]"
      - "(?i)content"
      - "(?i)контент"
      - "(?i)code"
      - "(?i)код"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 800

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 700

retrieval:
  context_k: 5
  max_chunks: 12
  boost_keywords:
    - "intellectual property"
    - "интеллектуальная собственность"
    - "exclusive rights"
    - "исключительные права"
    - "source code"
    - "исходный код"
    - "work product"
    - "результаты работ"
    - "assignment"
    - "передача прав"
    - "отчуждение прав"
    - "all right, title and interest"
    - "служебное произведение"
    - "work made for hire"
    - "founder"
    - "основатель"
    - "developer"
    - "разработчик"
    - "contractor"
    - "подрядчик"
    - "deed of assignment"
    - "акт приема-передачи"
    - "pre-existing IP"
    - "background IP"
    - "license only"
    - "open source"
  rerank: true
  filters: {}

conditional: null

extraction:
  llm_prompt_extraction: |
    <role>
    Ты — юрист по интеллектуальной собственности и технологиям.
    Твоя специализация — структурирование прав на IP
    в технологических компаниях, включая chain of title,
    assignment от основателей, сотрудников и подрядчиков,
    а также выявление пробелов в принадлежности ключевых
    IP-активов.
    </role>

    <context>
    Ниже приведены фрагменты договора и/или соглашений,
    где регулируются права на результаты работ и IP:

    {context}
    </context>

    <instructions>
    Проведи анализ по шагам. Каждый шаг логически соответствует
    одному или нескольким полям итоговой оценки.

    Шаг 1 — ФОРМАЛЬНЫЙ ВЛАДЕЛЕЦ КЛЮЧЕВЫХ IP-АКТИВОВ
    (используется для заполнения поля "ip_owner_status"):
    - Определи, кому по тексту принадлежат:
      * программное обеспечение и исходный код;
      * контент, базы данных и иные результаты работ;
      * товарные знаки, бренды и иные объекты IP.
    - Для поля ip_owner_status используй:
      * "target";
      * "founders";
      * "contractors";
      * "mixed";
      * "third_party";
      * "unclear".

    Шаг 2 — ASSIGNMENT ОТ ОСНОВАТЕЛЕЙ И СОТРУДНИКОВ
    (используется для заполнения поля "has_assignments_from_founders_and_employees"):
    - Проверь наличие явных положений об отчуждении прав:
      * от основателей / акционеров;
      * на доинкорпорационный код и pre-incorporation IP;
      * от сотрудников по служебным произведениям;
      * отдельных assignment agreements или формул
        "all right, title and interest".
    - Оцени:
      * "yes" — assignment явно есть;
      * "no" — assignment отсутствует или видна только
        лицензия / общие слова;
      * "partial" — по одной категории лиц есть,
        по другой нет;
      * "unclear" — неясно.

    Шаг 3 — ASSIGNMENT ОТ ПОДРЯДЧИКОВ / РАЗРАБОТЧИКОВ
    (используется для заполнения поля "has_assignments_from_contractors"):
    - Определи, есть ли:
      * явное отчуждение всех прав на результаты работ подрядчиков;
      * deed of assignment / IP assignment agreement;
      * акты передачи;
      * либо только лицензия без assignment.
    - Оцени:
      * "yes";
      * "no";
      * "partial";
      * "unclear".

    Шаг 4 — ПОЛНОТА ОБЪЁМА ПЕРЕДАЧИ ПРАВ
    (используется для заполнения поля "assignment_scope_appears_full"):
    - Оцени, насколько полно описан scope передачи:
      * все виды использования / all right, title and interest;
      * весь мир / worldwide;
      * весь срок охраны / full term of protection;
      * все доработки, derivative works, updates;
      * безотзывность / irrevocability.
    - Оцени:
      * "yes" — scope выглядит полным;
      * "no" — scope явно ограничен или неполон;
      * "partial" — часть элементов есть, часть отсутствует;
      * "unclear" — неясно.

    Шаг 5 — RED FLAGS
    (используется для заполнения поля "red_flags"):
    Присвой один или несколько кодов из списка ниже.
    Если ни один код не применим — верни "NONE".
    Если данных недостаточно для оценки — верни "UNCLEAR".

    Коды:
    • IPOWN1 — Ключевые IP-активы не принадлежат Target
      или принадлежат смешанно (основатели / подрядчики /
      третьи лица).
    • IPOWN2 — Отсутствуют явные assignment-документы
      от ключевых разработчиков / подрядчиков.
    • IPOWN3 — Ключевой продукт создан до регистрации
      компании и нет явного отчуждения в пользу Target.
    • IPOWN4 — Scope assignment неполный: нет worldwide /
      full term / all rights / derivative works.
    • IPOWN5 — Значимый pre-existing IP / third-party IP risk:
      Target получает только лицензию или есть retained rights.
    • IPOWN6 — Chain of title не прослеживается или
      прослеживается лишь частично.

    Формат ответа: коды через запятую без комментариев
    (например: "IPOWN1, IPOWN2").
    Вся аргументация — в поле reason.

    Шаг 6 — ОБОСНОВАНИЕ
    (используется для заполнения поля "reason"):

    - В reason кратко обоснуй вывод, ссылаясь на ключевые
      формулировки из текста (с цитатами в кавычках), и укажи:
      * кто владеет ключевыми IP;
      * есть ли assignment от founders / employees / contractors;
      * полный ли scope передачи;
      * есть ли third-party / pre-existing IP risk;
      * если выставлены red_flags — обоснуй каждый код;
      * если red_flags = "NONE" — укажи, почему структура прав
        выглядит безопасной.
    </instructions>

    <edge_cases>
    Обрабатывай пограничные ситуации так:

    - В уставных / трудовых документах видно, что служебные
      произведения принадлежат работодателю, но assignment
      от подрядчиков нет:
      has_assignments_from_founders_and_employees = "yes";
      has_assignments_from_contractors = "no" или "unclear";
      риск не занижай.

    - Ключевой продукт создан до регистрации компании
      и формально остаётся на основателях:
      зафиксируй IPOWN3 и, как правило, IPOWN1.

    - Есть формулы "all right, title and interest are hereby
      assigned to Company" по миру и на весь срок:
      это сильный фактор в пользу полного scope assignment.

    - Видно только, что Target имеет лицензию, а не ownership:
      возможно IPOWN5.

    - По фрагментам нельзя понять, кому принадлежат права,
      и есть только общие слова "IP компании":
      ip_owner_status = "unclear";
      риск не занижай.

    - Open source / third-party components упомянуты,
      но без признаков нарушения chain of title:
      это не всегда критично; оцени как medium / unclear
      в зависимости от контекста.

    - Пустые или явно нерелевантные фрагменты:
      red_flags = "UNCLEAR"; в reason укажи недостаток данных.
    </edge_cases>

    <output_expectations>
    На основе твоего анализа отдельный механизм извлечения сформирует
    структурированные поля по заранее заданной схеме. Твоя задача —
    давать чёткие юридические выводы и указывать конкретные формулировки
    из текста, на которых они основаны.
    </output_expectations>

  enabled: true
  mode: "hybrid"
  fields:
    - name: "ip_owner_status"
      type: "string"
      allowed_values:
        - "target"
        - "founders"
        - "contractors"
        - "mixed"
        - "third_party"
        - "unclear"

    - name: "has_assignments_from_founders_and_employees"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "partial"
        - "unclear"

    - name: "has_assignments_from_contractors"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "partial"
        - "unclear"

    - name: "assignment_scope_appears_full"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "partial"
        - "unclear"

    - name: "red_flags"
      type: "string"

    - name: "reason"
      type: "string"

  store_payload: true

red_flags:
  items:
    - code: "IPOWN1"
      description: >
        Ключевые IP-активы не принадлежат Target
        или принадлежат смешанно (основатели / подрядчики /
        третьи лица).
    - code: "IPOWN2"
      description: >
        Отсутствуют явные assignment-документы
        от ключевых разработчиков / подрядчиков.
    - code: "IPOWN3"
      description: >
        Ключевой продукт создан до регистрации компании
        и нет явного отчуждения в пользу Target.
    - code: "IPOWN4"
      description: >
        Scope assignment неполный: нет worldwide /
        full term / all rights / derivative works.
    - code: "IPOWN5"
      description: >
        Значимый pre-existing IP / third-party IP risk:
        Target получает только лицензию или есть retained rights.
    - code: "IPOWN6"
      description: >
        Chain of title не прослеживается или прослеживается
        лишь частично.