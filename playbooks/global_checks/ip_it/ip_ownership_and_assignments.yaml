id: "ip_ownership_and_assignments"
name: "Принадлежность IP и assignment от разработчиков"
description: >
  Анализирует принадлежность ключевых IP-активов: ПО, результатов работ,
  контента, а также наличие договоров/актoв передачи прав от основателей
  и подрядчиков.

doc_types: []

severity: "critical"
severity_if_fail: "critical"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"

rules:
  keywords:
    - "интеллектуальная собственность"
    - "intellectual property"
    - "IP"
    - "исключительные права"
    - "exclusive rights"
    - "авторские права"
    - "copyright"
    - "патент"
    - "знаки для товаров и услуг"
    - "trademark"
    - "результаты работ"
    - "work product"
    - "служебное произведение"
    - "work made for hire"
    - "assignment"
    - "передача прав"
    - "cede"
    - "отчуждение прав"
    - "developer"
    - "подрядчик"
    - "founder"
  keyword_mode: "any"
  regex_patterns: []
  clause_patterns: []

llm:
  prompt_template: |
    <role>
    Ты — юрист по интеллектуальной собственности и технологиям.
    Твоя специализация — структурирование прав на IP в технологических компаниях,
    включая assignment от основателей и разработчиков.
    </role>

    <context>
    Ниже приведены фрагменты договора и/или соглашений, где регулируются
    права на результаты работ и IP:

    {context}
    </context>

    <instructions>
    Проведи анализ по шагам. Каждый шаг логически связан с одним или
    несколькими полями итоговой оценки.

    Шаг 1 — ФОРМАЛЬНЫЙ ВЛАДЕЛЕЦ КЛЮЧЕВЫХ IP-АКТИВОВ
    (используется для "ip_owner_description"):
    - Определи, кому по тексту принадлежат:
      * программное обеспечение и исходный код;
      * контент, базы данных и иные результаты работ;
      * товарные знаки, бренды и прочие объекты IP.
    - Кратко опиши, кто указан владельцем (Target, основатели, подрядчики,
      иное лицо или неопределённо).

    Шаг 2 — ASSIGNMENT ОТ ОСНОВАТЕЛЕЙ И СОТРУДНИКОВ
    (используется для "has_assignments_from_founders_and_employees"):
    - Проверь наличие явных положений об отчуждении прав:
      * от основателей/акционеров (в т.ч. на доинкорпорационный код и на будущие разработки);
      * от сотрудников (служебные произведения, отдельные соглашения,
        формулировки work made for hire / служебное произведение и последующий assignment).
    - Сформулируй вывод: yes / no / unclear.

    Шаг 3 — ASSIGNMENT ОТ ПОДРЯДЧИКОВ/РАЗРАБОТЧИКОВ
    (используется для "has_assignments_from_contractors"):
    - Определи, есть ли:
      * явные clauses о передаче всех прав на результаты работ подрядчиков;
      * или, наоборот, только лицензия без отчуждения (подрядчик сохраняет права).
    - Сформулируй вывод: yes / no / unclear.

    Шаг 4 — ПОЛНОТА ОБЪЁМА ПЕРЕДАЧИ ПРАВ
    (используется для "assignment_scope_appears_full"):
    - Оцени, насколько полно описан scope передачи:
      * охватываются ли все виды использования (all fields of use);
      * все территории (worldwide);
      * весь срок действия прав (на весь срок охраны);
      * указано ли "all right, title and interest" или аналогичная формула.
    - Сделай вывод: yes / no / unclear, не додумывая условий, которых нет в тексте.

    Шаг 5 — ВОЗМОЖНЫЕ ПРОБЕЛЫ И СТОРОННИЕ ПРАВА
    (учитывается при "ip_ownership_risk_level" и "reason"):
    - Проверь наличие признаков того, что часть IP может принадлежать третьим лицам:
      * использование сторонних библиотек, компонентов, pre-existing IP разработчиков;
      * отсутствие assignment от ключевых подрядчиков;
      * указание, что Target получает только лицензию, а не права собственности.
    - Отметь эти факторы как отдельные источники риска.

    Шаг 6 — ОЦЕНКА РИСКА ПРИНАДЛЕЖНОСТИ IP
    (используется для "ip_ownership_risk_level" и "overall_risk_level"):
    - Оцени ip_ownership_risk_level как low / medium / high / unclear
      с учётом:
      * прозрачности и полноты цепочки прав (chain of title);
      * наличия assignment от всех ключевых лиц (founders, employees, contractors);
      * возможных противоречий или пробелов.
    - Оцени общий риск overall_risk_level: low / medium / high — исходя из
      влияния потенциальных проблем с IP на возможность сделки, монетизации
      продукта и рисков претензий.
    - В "reason" кратко обоснуй вывод, ссылаясь на ключевые формулировки
      (желательно с короткими цитатами) и пояснив, в чём именно заключается риск
      или, наоборот, относительная безопасность структуры прав.
    </instructions>

    <edge_cases>
    Обрабатывай пограничные ситуации так:

    - В уставных документах/трудовых договорах указано, что служебные
      произведения принадлежат работодателю, но нет отдельных assignment
      от подрядчиков:
      отражай уверенность по сотрудникам и неопределённость/отсутствие по подрядчикам.

    - Ключевой продукт создан до регистрации компании и формально остаётся
      на основателях без отдельного договора отчуждения в пользу Target:
      рассматривай это как высокий риск владения IP для Target.

    - Формулировки вида "all rights, title and interest are hereby assigned
      to Company" в договорах с основателями, сотрудниками и ключевыми
      подрядчиками по миру и на весь срок:
      воспринимай это как сильное, полно охватывающее решение цепочки прав.

    - По фрагментам нельзя понять, кому принадлежат права и есть только
      общие упоминания "интеллектуальная собственность компании":
      фиксируй неопределённость и указывай соответствующий уровень риска.

    - Пустые или явно нерелевантные фрагменты:
      укажи, что данных недостаточно для анализа принадлежности IP и наличия
      assignment от разработчиков, и поясни, как это влияет на неопределённость
      и оценку риска.
    </edge_cases>

    <output_expectations>
    На основе твоего анализа отдельный механизм извлечения сформирует
    структурированные поля по заранее заданной схеме. Твоя задача —
    давать чёткие юридические выводы и указывать конкретные формулировки
    из текста, на которых они основаны.
    </output_expectations>
  prompt_file: null
  context_k: 5
  temperature: 0.0
  max_tokens: 640

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 700

retrieval:
  context_k: 5
  max_chunks: 10
  boost_keywords:
    - "intellectual property"
    - "результаты работ"
    - "assignment"
    - "отчуждение прав"
    - "служебное произведение"
  rerank: true
  filters: {}

conditional: null

extraction:
  enabled: true
  mode: "hybrid"
  fields:
    - name: "ip_owner_description"
      type: "string"

    - name: "has_assignments_from_founders_and_employees"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "has_assignments_from_contractors"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "assignment_scope_appears_full"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "ip_ownership_risk_level"
      type: "string"
      allowed_values:
        - "low"
        - "medium"
        - "high"
        - "unclear"

    - name: "overall_risk_level"
      type: "string"
      allowed_values:
        - "low"
        - "medium"
        - "high"

    - name: "reason"
      type: "string"

  store_payload: true

red_flags:
  items:
    - code: "IP1"
      description: "Ключевые IP-активы не принадлежат Target (висят на основателях/подрядчиках/третьем лице)."
    - code: "IP2"
      description: "Отсутствуют явные assignment-документы от ключевых разработчиков."
