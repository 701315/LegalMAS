id: "ip_ownership_and_assignments"
name: "Принадлежность IP и assignment от разработчиков"
group: "IP"
description: >
  Анализирует принадлежность ключевых IP-активов: ПО, исходного
  кода, результатов работ, контента, баз данных, товарных знаков
  и иных объектов интеллектуальной собственности.

  Проверяет цепочку прав (chain of title), наличие assignment /
  отчуждения прав от основателей, сотрудников и подрядчиков,
  полноту объёма передачи прав, признаки сторонних или
  pre-existing IP.

  Формирует краткий user-facing вывод и оценивает риск того,
  что ключевые IP-активы не полностью принадлежат Target или не
  могут быть свободно монетизированы / переданы в рамках сделки.

doc_types: []

severity: "critical"
severity_if_fail: "critical"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"
ui_mode: "field_extraction"

rules:
  keyword_mode: any

  keywords:
    high:
      # Общие IP-термины
      - "(?i)intellectual\\s+property"
      - "(?i)интеллектуальн(ая|ой)\\s+собственност"
      - "(?i)exclusive\\s+rights?"
      - "(?i)исключительн(ые|ых)\\s+прав"
      - "(?i)copyright"
      - "(?i)авторск(ие|их)\\s+прав"
      - "(?i)trademark"
      - "(?i)товарн(ый|ые)\\s+знак"
      - "(?i)patent"
      - "(?i)патент"
      - "(?i)database\\s+rights?"
      - "(?i)баз[аы]\\s+данных"

      # ПО / результаты работ
      - "(?i)source\\s+code"
      - "(?i)исходн(ый|ого)\\s+код"
      - "(?i)software"
      - "(?i)программн(ое|ого)\\s+обеспечени"
      - "(?i)work\\s+product"
      - "(?i)результат(ы|ов)\\s+работ"
      - "(?i)deliverables?"
      - "(?i)служебн(ое|ого)\\s+произведени"
      - "(?i)work\\s+made\\s+for\\s+hire"

      # Assignment / отчуждение — точные формулы
      - "(?i)all\\s+right,\\s*title\\s+and\\s+interest"
      - "(?i)все\\s+права\\s+передаются"
      - "(?i)hereby\\s+assigns?"
      - "(?i)assign(ed)?\\s+all\\s+(rights?|IP)"
      - "(?i)передач[аеи]\\s+прав[\\s\\S]{0,20}(ПО|IP|произведени)"
      - "(?i)отчуждени[ея]\\s+прав[\\s\\S]{0,20}(ПО|IP|произведени)"
      - "(?i)IP\\s+assignment\\s+agreement"
      - "(?i)deed\\s+of\\s+assignment"
      - "(?i)акт\\s+отчуждения"

      # Основатели / сотрудники / подрядчики
      - "(?i)founder[\\s\\S]{0,20}(IP|rights?|assign)"
      - "(?i)основател[\\s\\S]{0,20}(IP|прав|передач)"
      - "(?i)developer[\\s\\S]{0,20}(assign|rights?|IP)"
      - "(?i)разработчик[\\s\\S]{0,20}(передач|прав)"
      - "(?i)contractor[\\s\\S]{0,20}(assign|rights?|IP)"
      - "(?i)подрядчик[\\s\\S]{0,20}(передач|прав)"

    medium:
      # Chain of title / pre-existing IP
      - "(?i)chain\\s+of\\s+title"
      - "(?i)цепочк[аи]\\s+прав"
      - "(?i)pre[-\\s]?existing\\s+IP"
      - "(?i)background\\s+IP"
      - "(?i)retains?\\s+ownership"
      - "(?i)retains?\\s+all\\s+rights?"
      - "(?i)сохраняет\\s+прав[ао]"
      - "(?i)ранее\\s+созданн(ое|ые)\\s+(ПО|IP)"

      # Лицензия вместо assignment
      - "(?i)license\\s+only[\\s\\S]{0,20}(not\\s+assign|не\\s+передает)"
      - "(?i)grants?\\s+a\\s+(non[-\\s]?exclusive\\s+)?license[\\s\\S]{0,20}(no\\s+ownership|не\\s+передает\\s+прав)"

      # Полнота assignment
      - "(?i)worldwide[\\s\\S]{0,20}(irrevocable|perpetual|all\\s+rights)"
      - "(?i)for\\s+the\\s+full\\s+term[\\s\\S]{0,20}(copyright|охраны)"
      - "(?i)на\\s+весь\\s+срок\\s+охраны"
      - "(?i)irrevocable[\\s\\S]{0,20}(assignment|assign)"
      - "(?i)безотзывн[аяо]\\s+передач"

      # Акты передачи
      - "(?i)acceptance\\s+certificate"
      - "(?i)акт\\s+приема[-\\s]?передачи"

      # Open source / third-party
      - "(?i)open\\s+source"
      - "(?i)third[-\\s]?party\\s+(component|software|IP)"
      - "(?i)сторонн(ий|ие)\\s+(компонент|ПО|IP)"

    low:
      - "(?i)all\\s+right,\\s*title\\s+and\\s+interest"
      - "(?i)hereby\\s+assigns?"
      - "(?i)deed\\s+of\\s+assignment"
      - "(?i)pre[-\\s]?existing\\s+IP"
      - "(?i)background\\s+IP"
      - "(?i)chain\\s+of\\s+title"
      - "(?i)служебн[оое]\\s+произведени"
      - "(?i)work\\s+made\\s+for\\s+hire"
      - "(?i)open\\s+source"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 800

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 700

retrieval:
  context_k: 5
  max_chunks: 12

  retrieval_query: >
    интеллектуальная собственность исключительные права отчуждение передача прав 
    служебное произведение исходный код результаты работ разработчик подрядчик 
    основатель цепочка прав

  boost_keywords:
    - "intellectual property"
    - "интеллектуальная собственность"
    - "exclusive rights"
    - "исключительные права"
    - "source code"
    - "исходный код"
    - "work product"
    - "результаты работ"
    - "all right title and interest"
    - "hereby assigns"
    - "служебное произведение"
    - "work made for hire"
    - "founder"
    - "основатель"
    - "developer"
    - "разработчик"
    - "contractor"
    - "подрядчик"
    - "deed of assignment"
    - "IP assignment agreement"
    - "акт приема-передачи"
    - "pre-existing IP"
    - "background IP"
    - "chain of title"
    - "retains ownership"
    - "license only"
    - "open source"

  negative_keywords:
    - "коммерческая тайна"
    - "конфиденциальная информация"
    - "подсудность"
    - "форс-мажор"
    - "условия оплаты"

  preferred_unit_types:
    - "general_provision"
    - "obligation"

  excluded_unit_types:
    - "technical_fragment"
    - "appendix_reference"

  preferred_clause_functions:
    - "intellectual_property"
    - "assignment"
    - "representations"

  position_bias:
    preferred_range: [0.0, 1.0]
    boost: 0.10
    scope: "segment"

  rerank: true
  filters: {}

conditional: null

enrichment_hints:
  preferred_segment_types:
    - "contract"
    - "annex"
    - "appendix"
    - "amendment"
  excluded_segment_types:
    - "technical_specification"
    - "price_list"
    - "invoice"
    - "act"
  confidence_bonus_on_match: 0.10
  confidence_penalty_on_excluded_segment: 0.15

extraction:
  enabled: true
  mode: "hybrid"
  llm_max_tokens: 950

  llm_prompt_extraction: |
    <role>
    Ты — юрист по интеллектуальной собственности.
    Твоя задача — точно извлечь из текста:
    1) кому принадлежат ключевые IP-активы;
    2) есть ли assignment от основателей / сотрудников;
    3) есть ли assignment от подрядчиков / разработчиков;
    4) насколько полон scope передачи прав.

    Не делай предположений о chain of title без явных данных.
    </role>

    <context>
    Ниже приведены релевантные фрагменты договора:

    {context}
    </context>

    <task>
    Заполни только следующие поля:
    - ip_ownership_display
    - ip_owner_status
    - has_assignments_from_founders_and_employees
    - has_assignments_from_contractors
    - assignment_scope_appears_full
    - has_third_party_or_preexisting_ip_risk
    - chain_of_title_clarity
    - reason

    Важно:
    - пиши коротко и по-русски.
    </task>

    <instructions>
    Шаг 1 — ФОРМАЛЬНЫЙ ВЛАДЕЛЕЦ IP

    Заполни "ip_owner_status".

    Значения:
    - "target" — IP принадлежит Target по документам.
    - "founders" — IP формально у основателей.
    - "contractors" — IP у подрядчиков / разработчиков.
    - "mixed" — частично Target, частично третьи лица.
    - "third_party" — у стороннего правообладателя.
    - "unclear" — нельзя определить.

    Шаг 2 — ASSIGNMENT ОТ ОСНОВАТЕЛЕЙ И СОТРУДНИКОВ

    Заполни "has_assignments_from_founders_and_employees".

    Значения:
    - "yes" — явный assignment: "all right, title and
      interest", служебные произведения / work made for hire,
      deed of assignment от основателей.
    - "no" — assignment отсутствует или только лицензия.
    - "partial" — для части есть, для части нет.
    - "unclear" — неясно.

    Шаг 3 — ASSIGNMENT ОТ ПОДРЯДЧИКОВ

    Заполни "has_assignments_from_contractors".

    Значения:
    - "yes" — явное отчуждение прав на результаты работ.
    - "no" — нет; только лицензия или retained rights.
    - "partial" — частично есть.
    - "unclear" — неясно.

    Шаг 4 — ПОЛНОТА SCOPE

    Заполни "assignment_scope_appears_full".

    Значения:
    - "yes" — scope полный: worldwide / full term /
      all uses / derivative works / irrevocable.
    - "no" — scope явно ограничен.
    - "partial" — часть элементов есть, часть нет.
    - "unclear" — неясно.

    Шаг 5 — THIRD-PARTY / PRE-EXISTING IP РИСК

    Заполни "has_third_party_or_preexisting_ip_risk".

    Значения:
    - "yes" — признаки: Target получает только лицензию
      на pre-existing IP; retained rights у третьих лиц;
      значимые open source / third-party компоненты.
    - "no" — признаков нет.
    - "unclear" — неясно.

    Шаг 6 — CHAIN OF TITLE

    Заполни "chain_of_title_clarity".

    Значения:
    - "clear" — цепочка прав прослеживается явно.
    - "partial" — частично прослеживается.
    - "not_established" — chain of title явно не установлена
      или есть пробелы.
    - "unclear" — нельзя прослеживать по фрагментам.

    Шаг 7 — НОРМАЛИЗОВАННЫЙ DISPLAY ДЛЯ DD GRID

    Заполни "ip_ownership_display".

    Это не свободное summary.
    Строй display по следующей логике:

    Базовые случаи:
    - все поля unclear:
      "Не удалось определить принадлежность IP"
    - нет проблем:
      "IP принадлежит Target; assignment полный; chain of title чистая"

    Если есть конкретные данные — комбинируй через ";":
    - начни с ip_owner_status (кратко)
    - добавь assignment от основателей / подрядчиков (если проблема)
    - добавь chain_of_title_clarity (если not_established)
    - добавь third_party / preexisting (если "yes")

    Примеры:
    - "IP принадлежит Target; assignment от основателей и подрядчиков есть; scope полный"
    - "IP у основателей; assignment отсутствует; chain of title не установлена"
    - "Смешанная принадлежность; assignment от подрядчиков отсутствует"
    - "Не удалось определить принадлежность IP"

    Ограничение: не более 3 фактов через ";".

    Шаг 8 — КРАТКОЕ ОБОСНОВАНИЕ

    Заполни "reason".

    Правила:
    - 1–2 коротких предложения.
    - Укажи: кому принадлежит IP, assignment, scope,
      chain of title, third-party риск.
    - Приведи цитату в кавычках.
    </instructions>

    <edge_cases>
    - Служебные произведения без assignment от подрядчиков:
      * has_assignments_from_founders_and_employees = "yes"
      * has_assignments_from_contractors = "no"

    - IP создан до регистрации компании:
      * ip_owner_status = "founders"

    - "All right, title and interest worldwide, irrevocable":
      * assignment_scope_appears_full = "yes"
      * это сильный low risk фактор

    - Target только лицензиат ключевого IP:
      * has_third_party_or_preexisting_ip_risk = "yes"

    - Нет данных о chain of title:
      * chain_of_title_clarity = "unclear"

    - Нет релевантных фрагментов:
      * все поля = "unclear"
      * ip_ownership_display = "Не удалось определить принадлежность IP"
    </edge_cases>

    <output_expectations>
    Все значения коротко и по-русски.
    Не добавляй никаких полей, кроме указанных в схеме extraction.
    </output_expectations>

  fields:
    - name: "ip_ownership_display"
      type: "string"
      presentation: "fact"
      label: "Принадлежность IP"
      description: "Нормализованный user-facing вывод для DD Grid"

    - name: "ip_owner_status"
      type: "string"
      presentation: "signal"
      description: "Формальный владелец IP"
      allowed_values:
        - "target"
        - "founders"
        - "contractors"
        - "mixed"
        - "third_party"
        - "unclear"

    - name: "has_assignments_from_founders_and_employees"
      type: "string"
      presentation: "signal"
      description: "Assignment от основателей и сотрудников"
      allowed_values:
        - "yes"
        - "no"
        - "partial"
        - "unclear"

    - name: "has_assignments_from_contractors"
      type: "string"
      presentation: "signal"
      description: "Assignment от подрядчиков / разработчиков"
      allowed_values:
        - "yes"
        - "no"
        - "partial"
        - "unclear"

    - name: "assignment_scope_appears_full"
      type: "string"
      presentation: "signal"
      description: "Полнота scope передачи прав"
      allowed_values:
        - "yes"
        - "no"
        - "partial"
        - "unclear"

    - name: "has_third_party_or_preexisting_ip_risk"
      type: "string"
      presentation: "signal"
      description: "Риск third-party / pre-existing IP"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "chain_of_title_clarity"
      type: "string"
      presentation: "signal"
      description: "Чистота цепочки прав"
      allowed_values:
        - "clear"
        - "partial"
        - "not_established"
        - "unclear"

    - name: "reason"
      type: "string"
      presentation: "diagnostic"
      description: "Обоснование"

  store_payload: true


  