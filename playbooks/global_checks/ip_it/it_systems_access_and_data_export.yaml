id: "it_systems_access_and_data_export"
name: "Доступ к ИТ-системам и экспорт данных при прекращении"
group: "IP"
description: >
  Анализирует условия доступа к критическим ИТ-системам и сервисам,
  а также порядок экспорта, хранения, резервного копирования и
  удаления данных при приостановке и расторжении договора.

  Извлекает: условия и основания приостановки / отключения сервиса,
  налиличие уведомления и grace period, право на экспорт данных и
  качество окна выгрузки, форматы экспорта, условия хранения и
  удаления данных после расторжения, прозрачность backup / restore.

  Формирует краткий user-facing вывод и оценивает операционный риск
  отключения сервиса, риск потери данных и степень vendor lock-in.

  Детальный анализ ИБ-обязательств провайдера, SLA и общих
  условий аутсорсинга выполняется чеком
  outsourced_it_and_security_risk.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"
ui_mode: "field_extraction"

rules:
  keyword_mode: any

  keywords:
    high:
      # Приостановка / отключение
      - "(?i)suspension\\s+of\\s+(access|service)"
      - "(?i)service\\s+suspension"
      - "(?i)приостановлени[ея]\\s+(услуг|сервис|доступа)"
      - "(?i)termination\\s+of\\s+(access|service)"
      - "(?i)отключени[ея]\\s+(сервис|доступа)"
      - "(?i)disable\\s+(the\\s+)?(service|access)"
      - "(?i)restrict\\s+access"
      - "(?i)ограничени[ея]\\s+доступа"
      - "(?i)immediate\\s+suspension"
      - "(?i)немедленн(ое|ого)\\s+отключени"

      # Экспорт / retrieval
      - "(?i)data\\s+export"
      - "(?i)data\\s+retrieval"
      - "(?i)export\\s+of\\s+data"
      - "(?i)экспорт\\s+данных"
      - "(?i)выгрузк[аи]\\s+данных"
      - "(?i)retrieve\\s+your\\s+(own\\s+)?data"
      - "(?i)получени[ея]\\s+своих\\s+данных"
      - "(?i)portability\\s+of\\s+data"

      # Удаление / хранение после расторжения
      - "(?i)data\\s+deletion[\\s\\S]{0,30}(terminat|расторж)"
      - "(?i)удалени[ея]\\s+данных[\\s\\S]{0,30}(расторж|прекращ)"
      - "(?i)retention\\s+period[\\s\\S]{0,30}(after|terminat)"
      - "(?i)срок\\s+хранени[яе]\\s+данных[\\s\\S]{0,30}(после|расторж)"
      - "(?i)anonymi[sz]ation[\\s\\S]{0,30}(terminat|расторж)"

      # Backup / restore
      - "(?i)backup[\\s\\S]{0,20}(data|данных)"
      - "(?i)резервн(ое|ого)\\s+копировани[ея][\\s\\S]{0,20}данных"
      - "(?i)restore[\\s\\S]{0,20}data"
      - "(?i)восстановлени[ея]\\s+данных"

    medium:
      # Уведомление / grace period
      - "(?i)prior\\s+notice[\\s\\S]{0,30}(suspend|terminat|отключ)"
      - "(?i)предварительн(ое|ого)\\s+уведомлени[ея][\\s\\S]{0,30}(приостановк|отключ)"
      - "(?i)grace\\s+period[\\s\\S]{0,30}(data|export|access)"
      - "(?i)льготн(ый|ого)\\s+период[\\s\\S]{0,30}данных"
      - "(?i)cure\\s+period[\\s\\S]{0,30}(suspend|access)"

      # Форматы / API
      - "(?i)machine[-\\s]?readable\\s+format"
      - "(?i)машиночитаем(ый|ом)\\s+формат"
      - "(?i)standard\\s+format[\\s\\S]{0,20}(export|data)"
      - "(?i)read[-\\s]?only\\s+access[\\s\\S]{0,20}(after|terminat)"
      - "(?i)\\bCSV\\b"
      - "(?i)\\bJSON\\b"
      - "(?i)\\bAPI\\b[\\s\\S]{0,20}(export|access|data)"

      # Платность экспорта
      - "(?i)export\\s+fees?"
      - "(?i)fee\\s+for\\s+data\\s+export"
      - "(?i)плат[аы]\\s+за\\s+экспорт\\s+данных"

      # Основания приостановки
      - "(?i)late\\s+payment[\\s\\S]{0,30}(suspend|terminate|отключ)"
      - "(?i)просрочк[аи]\\s+оплат[ыа][\\s\\S]{0,30}(приостановк|отключ)"
      - "(?i)breach\\s+of\\s+agreement[\\s\\S]{0,30}(suspend|terminat)"
      - "(?i)нарушени[ея]\\s+договора[\\s\\S]{0,30}(приостановк|отключ)"

    low:
      - "(?i)service\\s+suspension"
      - "(?i)data\\s+export"
      - "(?i)data\\s+retrieval"
      - "(?i)data\\s+deletion"
      - "(?i)retention\\s+period"
      - "(?i)backup"
      - "(?i)read[-\\s]?only\\s+access"
      - "(?i)grace\\s+period"
      - "(?i)prior\\s+notice[\\s\\S]{0,20}suspend"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 750

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  context_k: 5
  max_chunks: 10

  retrieval_query: >
    приостановление сервиса отключение доступа экспорт выгрузка данных 
    удаление информации срок хранения резервное копирование машиночитаемый формат

  boost_keywords:
    - "service suspension"
    - "приостановление услуг"
    - "access suspension"
    - "termination of service"
    - "отключение сервиса"
    - "immediate suspension"
    - "data export"
    - "экспорт данных"
    - "data retrieval"
    - "выгрузка данных"
    - "data portability"
    - "data deletion"
    - "удаление данных"
    - "retention period"
    - "срок хранения данных"
    - "backup"
    - "резервное копирование"
    - "grace period"
    - "prior notice"
    - "read-only access"
    - "machine-readable format"
    - "CSV"
    - "JSON"
    - "API"
    - "export fees"
    - "плата за экспорт данных"

  negative_keywords:
    - "интеллектуальная собственность"
    - "авторские права"
    - "товарные знаки"
    - "патент"
    - "коммерческая тайна"

  preferred_unit_types:
    - "general_provision"
    - "obligation"

  excluded_unit_types:
    - "structural_anchor"
    - "technical_fragment"
    - "appendix_reference"

  preferred_clause_functions:
    - "procedures"
    - "data_protection"
    - "obligations"
    - "limitations"

  position_bias:
    preferred_range: [0.0, 1.0]
    boost: 0.10
    scope: "segment"

  rerank: true
  filters: {}

conditional: null

enrichment_hints:
  preferred_segment_types:
    - "contract"
    - "annex"
    - "appendix"
    - "amendment"
  excluded_segment_types:
    - "technical_specification"
    - "price_list"
    - "invoice"
  confidence_bonus_on_match: 0.10
  confidence_penalty_on_excluded_segment: 0.15

extraction:
  enabled: true
  mode: "hybrid"
  llm_max_tokens: 1050

  llm_prompt_extraction: |
    <role>
    Ты — юрист по ИТ и SaaS-договорам.
    Твоя задача — точно извлечь из текста:
    1) условия и основания приостановки / отключения сервиса;
    2) право на экспорт данных и качество окна выгрузки;
    3) условия хранения и удаления данных после расторжения;
    4) прозрачность backup / restore.

    Не анализируй ИБ-обязательства провайдера, SLA и общие
    условия аутсорсинга — это задача outsourced_it_and_security_risk.
    Не предполагай право на экспорт если оно не указано явно.
    </role>

    <context>
    Ниже приведены релевантные фрагменты договора:

    {context}
    </context>

    <task>
    Заполни только следующие поля:
    - it_access_display
    - service_suspension_severity
    - suspension_notice_period
    - has_data_export_rights
    - export_window_quality
    - export_format_quality
    - data_retention_after_termination
    - backup_and_restore_transparency
    - reason

    Важно:
    - пиши коротко и по-русски.
    </task>

    <instructions>
    Шаг 1 — ЖЁСТКОСТЬ УСЛОВИЙ ПРИОСТАНОВКИ

    Заполни "service_suspension_severity".

    Значения:
    - "strict" — провайдер может немедленно отключить
      при небольших нарушениях (просрочка < 30 дней,
      любой спор, по усмотрению).
    - "moderate" — при серьёзных нарушениях с разумным
      уведомлением.
    - "mild" — ограниченные основания, cure period.
    - "not_addressed" — условия не описаны.
    - "unclear" — неясно.

    Шаг 2 — СРОК УВЕДОМЛЕНИЯ О ПРИОСТАНОВКЕ

    Заполни "suspension_notice_period".

    Правила:
    - Если указан: "0 дней", "5 рабочих дней", "30 дней"
    - Нет уведомления: "Без уведомления"
    - Не установлен: "Не установлен"
    - Неясно: "Не удалось определить"

    Шаг 3 — ПРАВО НА ЭКСПОРТ ДАННЫХ

    Заполни "has_data_export_rights".

    Значения:
    - "yes" — есть явное право клиента на выгрузку данных.
    - "no" — право не предусмотрено или явно отсутствует.
    - "unclear" — неясно.

    Шаг 4 — КАЧЕСТВО ОКНА ВЫГРУЗКИ

    Заполни "export_window_quality".

    Значения:
    - "good" — разумное окно (≥ 30 дней) после расторжения.
    - "limited" — окно есть, но короткое (< 30 дней).
    - "none" — окна нет.
    - "not_applicable" — права на экспорт нет.
    - "unclear" — неясно.

    Шаг 5 — КАЧЕСТВО ФОРМАТОВ ЭКСПОРТА

    Заполни "export_format_quality".

    Значения:
    - "machine_readable" — CSV, JSON, XML, API.
    - "partial" — частично машиночитаемые.
    - "poor" — только PDF / нестандартные форматы.
    - "not_specified" — форматы не указаны.
    - "not_applicable" — права на экспорт нет.
    - "unclear" — неясно.

    Шаг 6 — ХРАНЕНИЕ / УДАЛЕНИЕ ДАННЫХ

    Заполни "data_retention_after_termination".

    Значения:
    - "defined_period" — чётко установлен срок хранения
      после расторжения (укажи срок в reason).
    - "immediate_deletion" — данные удаляются немедленно.
    - "on_request" — удаление по запросу клиента.
    - "not_specified" — не урегулировано.
    - "unclear" — неясно.

    Шаг 7 — ПРОЗРАЧНОСТЬ BACKUP / RESTORE

    Заполни "backup_and_restore_transparency".

    Значения:
    - "clear" — backup с чёткими условиями: частота,
      срок хранения, процедура restore.
    - "partial" — backup упомянут без деталей.
    - "absent" — backup не упоминается.
    - "unclear" — неясно.

    Шаг 8 — НОРМАЛИЗОВАННЫЙ DISPLAY ДЛЯ DD GRID

    Заполни "it_access_display".

    Это не свободное summary.
    Строй display по следующей логике:

    Базовый случай:
    - все поля unclear:
      "Не удалось определить условия доступа и экспорта"

    Если данные есть — комбинируй через ";":
    - начни с service_suspension_severity (кратко)
    - добавь suspension_notice_period (если проблема)
    - добавь has_data_export_rights (если "no")
    - добавь export_window_quality (если limited/none)
    - добавь data_retention_after_termination (если критично)

    Примеры:
    - "Приостановка без уведомления; экспорт есть; окно 30 дней; CSV/JSON"
    - "Strict условия; нет права на экспорт; backup не описан"
    - "Умеренные условия; экспорт есть; данные удаляются через 90 дней"
    - "Не удалось определить условия доступа и экспорта"

    Ограничение: не более 4 фактов через ";".

    Шаг 9 — КРАТКОЕ ОБОСНОВАНИЕ

    Заполни "reason".

    Правила:
    - 1–2 коротких предложения.
    - Укажи: основания приостановки, notice, право
      на экспорт, окно, хранение, backup.
    - Приведи цитату в кавычках.
    </instructions>

    <edge_cases>
    - Немедленное отключение при просрочке < 30 дней:
      * service_suspension_severity = "strict"
      * suspension_notice_period = "0 дней"

    - Договор молчит о праве на экспорт:
      * has_data_export_rights = "no"
      * export_window_quality = "not_applicable"

    - Чёткое окно 30 дней, CSV/JSON:
      * export_window_quality = "good"
      * export_format_quality = "machine_readable"

    - Немедленное удаление после расторжения:
      * data_retention_after_termination = "immediate_deletion"

    - Backup упомянут без сроков и процедуры:
      * backup_and_restore_transparency = "partial"

    - Нет релевантных фрагментов:
      * все поля = "unclear"
      * it_access_display =
        "Не удалось определить условия доступа и экспорта"
    </edge_cases>

    <output_expectations>
    Все значения коротко и по-русски.
    Не добавляй никаких полей, кроме указанных в схеме extraction.
    </output_expectations>

  fields:
    - name: "it_access_display"
      type: "string"
      presentation: "fact"
      label: "Доступ и экспорт данных"
      description: "Нормализованный user-facing вывод для DD Grid"

    - name: "service_suspension_severity"
      type: "string"
      presentation: "signal"
      description: "Жёсткость условий приостановки"
      allowed_values:
        - "strict"
        - "moderate"
        - "mild"
        - "not_addressed"
        - "unclear"

    - name: "suspension_notice_period"
      type: "string"
      presentation: "fact"
      label: "Срок уведомления"
      description: "Срок уведомления о приостановке сервиса"

    - name: "has_data_export_rights"
      type: "string"
      presentation: "signal"
      description: "Право на экспорт данных"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "export_window_quality"
      type: "string"
      presentation: "signal"
      description: "Качество окна выгрузки"
      allowed_values:
        - "good"
        - "limited"
        - "none"
        - "not_applicable"
        - "unclear"

    - name: "export_format_quality"
      type: "string"
      presentation: "signal"
      description: "Качество форматов экспорта"
      allowed_values:
        - "machine_readable"
        - "partial"
        - "poor"
        - "not_specified"
        - "not_applicable"
        - "unclear"

    - name: "data_retention_after_termination"
      type: "string"
      presentation: "signal"
      description: "Хранение / удаление данных после расторжения"
      allowed_values:
        - "defined_period"
        - "immediate_deletion"
        - "on_request"
        - "not_specified"
        - "unclear"

    - name: "backup_and_restore_transparency"
      type: "string"
      presentation: "signal"
      description: "Прозрачность backup / restore"
      allowed_values:
        - "clear"
        - "partial"
        - "absent"
        - "unclear"

    - name: "reason"
      type: "string"
      presentation: "diagnostic"
      description: "Обоснование"

  store_payload: true


