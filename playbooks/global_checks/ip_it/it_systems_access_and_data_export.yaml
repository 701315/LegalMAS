id: "it_systems_access_and_data_export"
name: "Доступ к ИТ-системам и экспорт данных при прекращении"
description: >
  Анализирует условия доступа к критическим ИТ-системам и сервисам, а также
  порядок экспорта и сохранения данных при расторжении договора.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"

rules:
  keywords:
    - "доступ к системе"
    - "access to the system"
    - "access to services"
    - "service availability"
    - "SaaS"
    - "облачный сервис"
    - "cloud service"
    - "data export"
    - "экспорт данных"
    - "data retrieval"
    - "удаление данных"
    - "data deletion"
    - "backup"
    - "резервное копирование"
    - "suspension of service"
    - "приостановление услуг"
    - "termination of service"
  keyword_mode: "any"
  regex_patterns: []
  clause_patterns: []

llm:
  prompt_template: |
    <role>
    Ты — юрист по ИТ и SaaS-договорам.
    Твоя специализация — условия доступа к облачным сервисам и обращение с данными
    при приостановке и расторжении договоров.
    </role>

    <context>
    Ниже приведены фрагменты договора, касающиеся доступа к ИТ-системам и данных:

    {context}
    </context>

    <instructions>
    Определи:

    1) Как регулируется доступ к критическим ИТ-системам/сервисам:
       - в каких случаях поставщик может приостанавливать или отключать сервис
         (просрочка оплаты, нарушение условий, инциденты безопасности, спор);
       - насколько быстро и без каких уведомлений может быть отключён доступ.
       Кратко опиши это в service_suspension_conditions.

    2) Есть ли положения об экспорте данных (data export / data retrieval):
       - прямо ли указано право клиента выгрузить свои данные;
       - есть ли ограничения по объёму, формату, периодичности;
       - платная или бесплатная услуга по выгрузке/миграции.
       Отрази факт наличия в has_data_export_rights: yes / no / unclear.

    3) Как описано окно и формат экспорта данных при прекращении:
       - срок, в течение которого клиент может запросить выгрузку после
         расторжения (например, 30/60/90 дней);
       - формат (машиночитаемый, стандартные форматы, API-доступ и т.п.).
       Опиши это в data_export_window_and_format.

    4) Что происходит с данными при расторжении:
       - сроки хранения (retention), условия удаления/анонимизации;
       - наличие резервного копирования (backup) и возможность восстановления
         в течение определённого времени;
       - есть ли обязательства по окончательному удалению/анонимизации по
         запросу клиента или по истечении срока.
       Опиши это в data_deletion_or_retention_terms.

    5) Насколько условия отключения сервиса и обращения с данными рискованны
       для Target:
       - оцени overall_risk_level: low / medium / high, исходя из:
         * лёгкости/жёсткости отключения,
         * наличия/отсутствия реального права на экспорт,
         * длины окна для выгрузки и прозрачности удаления/хранения.
    </instructions>

    <edge_cases>
    ВАЖНО — пограничные случаи:

    — Если провайдер вправе немедленно приостановить или отключить сервис
      при небольшой просрочке или споре без разумного уведомления:
      опиши это в service_suspension_conditions и, как правило, это повышает
      overall_risk_level до не ниже "medium".

    — Если договор молчит о праве клиента на экспорт данных:
      has_data_export_rights = "unclear" или "no" (по смыслу фрагмента),
      а data_export_window_and_format укажи как неопределённые.

    — Если предусмотрено чёткое окно (например, 30–60 дней) для экспорта
      данных после расторжения и указаны стандартные форматы выгрузки:
      это снижает риск, даже при жёстких условиях отключения.

    — Если прямо указано, что данные удаляются немедленно при расторжении
      без периода для выгрузки:
      data_deletion_or_retention_terms опиши соответствующим образом,
      риск, как правило, высокий.

    — Пустые или нерелевантные фрагменты:
      большинство полей = "unclear" или пустые строки,
      overall_risk_level = "medium",
      reason = "Недостаточно данных для анализа условий доступа к ИТ-системам и экспорта данных при прекращении."
    </edge_cases>

    <examples>
    ПРИМЕР 1 — ЖЁСТКОЕ ОТКЛЮЧЕНИЕ, НЕТ ОКНА ДЛЯ ЭКСПОРТА (HIGH):

    Фрагмент: "Поставщик вправе приостановить доступ к Сервису и удалить
    все данные Клиента при просрочке оплаты более 5 дней. После удаления
    данные не подлежат восстановлению, экспорт данных не предусмотрен."

    {{
      "service_suspension_conditions": "Поставщик может приостановить доступ и удалить данные при просрочке более 5 дней.",
      "has_data_export_rights": "no",
      "data_export_window_and_format": "Окно для экспорта не предусмотрено.",
      "data_deletion_or_retention_terms": "Данные удаляются после 5-дневной просрочки без возможности восстановления.",
      "overall_risk_level": "high",
      "reason": "Поставщик может быстро отключить сервис и удалить данные при небольшой просрочке, без права на экспорт и без окна для восстановления, что создаёт высокий операционный и ИТ-риск."
    }}

    ПРИМЕР 2 — РАЗУМНОЕ ОКНО ДЛЯ ЭКСПОРТА (MEDIUM):

    Фрагмент: "В случае расторжения Договора Клиент сохраняет доступ к
    Сервису в режиме 'read-only' в течение 30 дней для выгрузки данных
    в формате CSV. По истечении указанного срока данные архивируются
    и хранятся ещё 60 дней, после чего подлежат удалению."

    {{
      "service_suspension_conditions": "Доступ может быть переведён в режим read-only после расторжения.",
      "has_data_export_rights": "yes",
      "data_export_window_and_format": "30 дней на выгрузку данных в формате CSV, затем 60 дней архивного хранения.",
      "data_deletion_or_retention_terms": "Данные архивируются на 60 дней после окна экспорта, затем удаляются.",
      "overall_risk_level": "medium",
      "reason": "Есть право на экспорт данных с 30-дневным окном и описаны сроки хранения и удаления; риск остаётся умеренным из-за ограниченного срока read-only доступа."
    }}

    ПРИМЕР 3 — ОБЩИЕ ФОРМУЛИРОВКИ, НЕЯСНЫЕ УСЛОВИЯ (MEDIUM/UNCLEAR):

    Фрагмент: "Поставщик вправе приостанавливать доступ к Сервису в случаях,
    предусмотренных Договором. Порядок хранения и удаления данных определяется
    внутренней политикой Поставщика."

    {{
      "service_suspension_conditions": "Указано право Поставщика приостанавливать доступ в неопределённых случаях.",
      "has_data_export_rights": "unclear",
      "data_export_window_and_format": "Условия экспорта данных не описаны в предоставленном фрагменте.",
      "data_deletion_or_retention_terms": "Порядок хранения и удаления данных отсылает к внутренней политике Поставщика.",
      "overall_risk_level": "medium",
      "reason": "Условия приостановки доступа и обращения с данными сформулированы общо и отсылают к внутренней политике, что создаёт неопределённость и потенциальный риск для Target."
    }}
    </examples>

    <output_format>
    Твой ответ ДОЛЖЕН быть строго валидным JSON-объектом со следующими
    полями:

    {{
      "service_suspension_conditions": "string — краткое описание условий приостановки/отключения сервиса",
      "has_data_export_rights": "one of: yes | no | unclear",
      "data_export_window_and_format": "string — краткое описание срока и формата экспорта данных",
      "data_deletion_or_retention_terms": "string — краткое описание условий удаления/хранения данных после расторжения",
      "overall_risk_level": "one of: low | medium | high",
      "reason": "string — краткое объяснение на русском с указанием ключевых формулировок и влияния на риски для Target"
    }}

    Все перечисленные поля ДОЛЖНЫ присутствовать в JSON, даже если их значение равно null.
    </output_format>

    <constraints>
    ЖЁСТКИЕ ПРАВИЛА:
    1. Выведи ТОЛЬКО один JSON-объект. Никакого текста до или после.
    2. Не пиши "Вот JSON", "Here is the JSON" и т.п.
    3. Не используй Markdown, бэктики ``` или любые обёртки.
    4. Все строки — в двойных кавычках.
    5. Значения перечислимых полей — СТРОГО из указанных вариантов.
    6. Ключи — точно как указано, без добавления новых.
    7. Поле "reason" ДОЛЖНО содержать конкретные факты и формулировки
       из фрагментов, а не общие фразы вроде "есть риски".
    8. Начни ответ сразу с символа {{
    9. Если по какому‑то полю нет достаточно информации в тексте —
       верни для него 'unclear' или null (для reason пустое значение
       недопустимо — нужно объяснение). НЕ придумывай значения, не интерполируй.
    </constraints>
  prompt_file: null
  context_k: 5
  temperature: 0.0
  max_tokens: 640

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  context_k: 5
  max_chunks: 10
  boost_keywords:
    - "access to the system"
    - "service suspension"
    - "data export"
    - "удаление данных"
    - "SaaS"
    - "cloud service"
  rerank: true
  filters: {}

conditional: null

extraction:
  enabled: true
  mode: "hybrid"
  fields:
    - name: "service_suspension_conditions"
      type: "string"
    - name: "has_data_export_rights"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
    - name: "data_export_window_and_format"
      type: "string"
    - name: "data_deletion_or_retention_terms"
      type: "string"
    - name: "overall_risk_level"
      type: "string"
      allowed_values:
        - "low"
        - "medium"
        - "high"
    - name: "reason"
      type: "string"
  store_payload: true

red_flags:
  items:
    - code: "IP5"
      description: "Поставщик ИТ-услуг вправе немедленно отключить сервис/удалить данные при небольших нарушениях."
    - code: "IP6"
      description: "Отсутствие реального права на экспорт данных и разумного окна после расторжения."
      