id: "it_systems_access_and_data_export"
name: "Доступ к ИТ-системам и экспорт данных при прекращении"
group: "IP"
description: >
  Анализирует условия доступа к критическим ИТ-системам и сервисам,
  а также порядок экспорта, хранения, резервного копирования и
  удаления данных при приостановке и расторжении договора.

  Извлекает: условия и основания приостановки / отключения сервиса,
  наличие уведомления и grace period, право на экспорт данных и
  качество окна выгрузки, форматы экспорта, условия хранения и
  удаления данных после расторжения, прозрачность backup / restore.

  Формирует краткий user-facing вывод и оценивает операционный риск
  отключения сервиса, риск потери данных и степень vendor lock-in.

  Детальный анализ ИБ-обязательств провайдера, SLA и общих
  условий аутсорсинга выполняется чеком
  outsourced_it_and_security_risk.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"
ui_mode: "field_extraction"

rules:
  keyword_mode: any

  keywords:
    high:
      # Приостановка / отключение
      - "(?i)suspension\\s+of\\s+(access|service)"
      - "(?i)service\\s+suspension"
      - "(?i)приостановлени[ея]\\s+(услуг|сервис|доступа)"
      - "(?i)termination\\s+of\\s+(access|service)"
      - "(?i)отключени[ея]\\s+(сервис|доступа)"
      - "(?i)disable\\s+(the\\s+)?(service|access)"
      - "(?i)restrict\\s+access"
      - "(?i)ограничени[ея]\\s+доступа"
      - "(?i)immediate\\s+suspension"
      - "(?i)немедленн(ое|ого)\\s+отключени"

      # Экспорт / retrieval
      - "(?i)data\\s+export"
      - "(?i)data\\s+retrieval"
      - "(?i)export\\s+of\\s+data"
      - "(?i)экспорт\\s+данных"
      - "(?i)выгрузк[аи]\\s+данных"
      - "(?i)retrieve\\s+your\\s+(own\\s+)?data"
      - "(?i)получени[ея]\\s+своих\\s+данных"
      - "(?i)portability\\s+of\\s+data"

      # Удаление / хранение после расторжения
      - "(?i)data\\s+deletion[\\s\\S]{0,30}(terminat|расторж)"
      - "(?i)удалени[ея]\\s+данных[\\s\\S]{0,30}(расторж|прекращ)"
      - "(?i)retention\\s+period[\\s\\S]{0,30}(after|terminat)"
      - "(?i)срок\\s+хранени[яе]\\s+данных[\\s\\S]{0,30}(после|расторж)"
      - "(?i)anonymi[sz]ation[\\s\\S]{0,30}(terminat|расторж)"

      # Backup / restore
      - "(?i)backup[\\s\\S]{0,20}(data|данных)"
      - "(?i)резервн(ое|ого)\\s+копировани[ея][\\s\\S]{0,20}данных"
      - "(?i)restore[\\s\\S]{0,20}data"
      - "(?i)восстановлени[ея]\\s+данных"

    medium:
      # Уведомление / grace period
      - "(?i)prior\\s+notice[\\s\\S]{0,30}(suspend|terminat|отключ)"
      - "(?i)предварительн(ое|ого)\\s+уведомлени[ея][\\s\\S]{0,30}(приостановк|отключ)"
      - "(?i)grace\\s+period[\\s\\S]{0,30}(data|export|access)"
      - "(?i)льготн(ый|ого)\\s+период[\\s\\S]{0,30}данных"
      - "(?i)cure\\s+period[\\s\\S]{0,30}(suspend|access)"

      # Форматы / API
      - "(?i)machine[-\\s]?readable\\s+format"
      - "(?i)машиночитаем(ый|ом)\\s+формат"
      - "(?i)standard\\s+format[\\s\\S]{0,20}(export|data)"
      - "(?i)read[-\\s]?only\\s+access[\\s\\S]{0,20}(after|terminat)"
      - "(?i)\\bCSV\\b"
      - "(?i)\\bJSON\\b"
      - "(?i)\\bAPI\\b[\\s\\S]{0,20}(export|access|data)"

      # Платность экспорта
      - "(?i)export\\s+fees?"
      - "(?i)fee\\s+for\\s+data\\s+export"
      - "(?i)плат[аы]\\s+за\\s+экспорт\\s+данных"

      # Основания приостановки
      - "(?i)late\\s+payment[\\s\\S]{0,30}(suspend|terminate|отключ)"
      - "(?i)просрочк[аи]\\s+оплат[ыа][\\s\\S]{0,30}(приостановк|отключ)"
      - "(?i)breach\\s+of\\s+agreement[\\s\\S]{0,30}(suspend|terminat)"
      - "(?i)нарушени[ея]\\s+договора[\\s\\S]{0,30}(приостановк|отключ)"

    low:
      - "(?i)service\\s+suspension"
      - "(?i)data\\s+export"
      - "(?i)data\\s+retrieval"
      - "(?i)data\\s+deletion"
      - "(?i)retention\\s+period"
      - "(?i)backup"
      - "(?i)read[-\\s]?only\\s+access"
      - "(?i)grace\\s+period"
      - "(?i)prior\\s+notice[\\s\\S]{0,20}suspend"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 750

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  retrieval_profile: "termination_check"
  context_k: 5
  max_chunks: 10

  retrieval_query: >
    приостановление сервиса отключение доступа экспорт выгрузка данных 
    удаление информации срок хранения резервное копирование машиночитаемый формат

  boost_keywords:
    - "service suspension"
    - "приостановление услуг"
    - "access suspension"
    - "termination of service"
    - "отключение сервиса"
    - "immediate suspension"
    - "data export"
    - "экспорт данных"
    - "data retrieval"
    - "выгрузка данных"
    - "data portability"
    - "data deletion"
    - "удаление данных"
    - "retention period"
    - "срок хранения данных"
    - "backup"
    - "резервное копирование"
    - "grace period"
    - "prior notice"
    - "read-only access"
    - "machine-readable format"
    - "CSV"
    - "JSON"
    - "API"
    - "export fees"
    - "плата за экспорт данных"

  negative_keywords:
    - "интеллектуальная собственность"
    - "авторские права"
    - "товарные знаки"
    - "патент"
    - "коммерческая тайна"

  preferred_unit_types:
    - "general_provision"
    - "obligation"

  excluded_unit_types:
    - "structural_anchor"
    - "technical_fragment"
    - "appendix_reference"

  preferred_clause_functions:
    - "procedures"
    - "obligations"
    - "limitations"

  position_bias:
    preferred_range: [0.0, 1.0]
    boost: 0.10
    scope: "segment"

  rerank: true
  filters: {}

conditional: null

enrichment_hints:
  preferred_segment_types:
    - "contract"
    - "annex"
    - "appendix"
    - "amendment"
  excluded_segment_types:
    - "technical_specification"
    - "price_list"
    - "invoice"
  confidence_bonus_on_match: 0.10
  confidence_penalty_on_excluded_segment: 0.15

extraction:
  enabled: true
  mode: "hybrid"
  llm_max_tokens: 1250

  presence_signal:
    field: "it_access_status"
    present_values: ["present"]
    missing_values: ["missing"]
    unclear_values: ["unclear"]

  llm_prompt_extraction: |
    <role>
    Ты — юрист по ИТ и SaaS-договорам.
    Твоя задача — точно извлечь из текста:
    1) есть ли в договоре регулирование доступа и экспорта данных;
    2) если есть — какие условия установлены:
       - условия и основания приостановки / отключения сервиса;
       - срок уведомления;
       - право на экспорт данных и качество окна выгрузки;
       - форматы экспорта;
       - условия хранения и удаления данных после расторжения;
       - прозрачность backup / restore.

    КРИТИЧЕСКИ ВАЖНО:
    - Извлекай ТОЛЬКО то, что прямо написано в тексте.
    - НЕ предполагай право на экспорт, если оно не указано явно.
    - НЕ считай упоминание backup достаточным без конкретных условий.
    - Если раздел о доступе / экспорте в договоре отсутствует —
      it_access_status = "missing".
    - Если тексты по теме есть, но вывод сделать нельзя —
      it_access_status = "unclear".

    Не анализируй ИБ-обязательства провайдера, SLA и общие
    условия аутсорсинга — это задача outsourced_it_and_security_risk.
    </role>

    <context_rules>
    - Некоторые фрагменты могут быть нерелевантны — игнорируй их.
    - Если фрагменты противоречат друг другу — используй "unclear"
      и объясни в reason.
    - "Strict" = немедленное отключение при небольших нарушениях
      без cure period.
    - "Moderate" = серьёзные нарушения + разумное уведомление.
    - "Mild" = ограниченные основания + cure period.
    - Если договор молчит о праве на экспорт — это "no",
      а не "unclear".
    - Backup "clear" = частота + срок хранения + процедура restore.
      Только упоминание backup = "partial".
    - Если ни один фрагмент не содержит информации о доступе /
      экспорте / retention / backup (нет упоминаний suspension /
      export / retention / backup / grace period) —
      it_access_status = "missing", location = null.
      Не использовать "unclear" при полном отсутствии релевантных
      фрагментов.
    </context_rules>

    <context>
    Ниже приведены релевантные фрагменты договора:

    {context}
    </context>

    <task>
    Заполни только следующие поля:
    - it_access_display
    - it_access_status
    - service_suspension_severity
    - suspension_notice_period
    - has_data_export_rights
    - export_window_quality
    - export_format_quality
    - data_retention_after_termination
    - backup_and_restore_transparency
    - reason
    </task>

    <location_instructions>
    Для каждого поля по возможности укажи location в формате:
    {"clause_ref": "п. 12.1", "page": 7, "quote": "дословная фраза из договора"}

    Правила:
    - clause_ref — короткая ссылка на пункт / раздел / статью именно в том
      виде, как она написана в договоре;
    - page — целое число страницы;
    - quote — дословная фраза из текста договора (НЕ пересказ, НЕ парафраз).
      Копируй её посимвольно, сохраняя формулировку и порядок слов.
      Оптимальная длина: 30–300 символов.
    - Для synthesized-поля it_access_display и reason
      location ВСЕГДА null.
    - Для suspension_notice_period — quote с фразой о сроке уведомления.
    - Для it_access_status = "missing" — location = null.
    - Для it_access_status = "present" / "unclear" — quote
      с наиболее релевантной фразой договора.
    - Для service_suspension_severity, has_data_export_rights,
      export_window_quality, export_format_quality,
      data_retention_after_termination, backup_and_restore_transparency:
      * если значение определённое ("strict" / "moderate" / "mild" /
        "yes" / "good" / "limited" / "machine_readable" / "clear" и т.п.) —
        quote с фразой-основанием;
      * если значение = "no" / "absent" / "not_applicable" /
        "not_specified" —
        различай два случая:
        - договор ПРЯМО исключает наличие («Право на экспорт
          не предоставляется», «Данные удаляются немедленно») —
          quote ОБЯЗАТЕЛЬНА и должна содержать эту фразу;
        - просто отсутствует упоминание (договор молчит) —
          location = null.
    - Не выдумывай location или quote. Если дословную фразу определить
      нельзя — location = null.
    </location_instructions>

    <instructions>
    Шаг 0 — НАЛИЧИЕ РЕГУЛИРОВАНИЯ ДОСТУПА И ЭКСПОРТА

    Заполни "it_access_status".

    Значения:
    - "present" — если хотя бы одно содержательное поле указывает
      на наличие информации по теме:
      * service_suspension_severity ∈ {"strict", "moderate", "mild"};
      * has_data_export_rights = "yes";
      * export_window_quality ∈ {"good", "limited"};
      * export_format_quality ∈ {"machine_readable", "partial", "poor"};
      * data_retention_after_termination ∈ {"defined_period",
        "immediate_deletion", "on_request"};
      * backup_and_restore_transparency ∈ {"clear", "partial"};
      * ЛИБО любое поле = "no" / "absent" / "none" / "not_applicable" /
        "not_specified" / "not_addressed", но с заполненным
        location с прямой цитатой (см. RF3). Учитывается как признак
        наличия ТОЛЬКО при наличии прямой цитаты. Без цитаты
        "no" / "none" не считается сигналом наличия.
    - "missing" — если все содержательные поля =
      "no" / "absent" / "not_applicable" / "not_specified" /
      "not_addressed" БЕЗ цитат, ЛИБО фрагментов по теме
      нет вообще.
    - "unclear" — если все содержательные = "unclear" при наличии
      фрагментов, но невозможности вывода.

    Шаг 1 — ЖЁСТКОСТЬ УСЛОВИЙ ПРИОСТАНОВКИ

    Заполни "service_suspension_severity".

    Значения:
    - "strict" — провайдер может немедленно отключить
      при небольших нарушениях (просрочка < 30 дней,
      по усмотрению, без cure).
    - "moderate" — при серьёзных нарушениях с разумным
      уведомлением.
    - "mild" — ограниченные основания, есть cure period.
    - "not_addressed" — условия не описаны.
    - "unclear" — нельзя определить.

    Шаг 2 — СРОК УВЕДОМЛЕНИЯ О ПРИОСТАНОВКЕ

    Заполни "suspension_notice_period".

    Правила:
    - Если указан: "0 дней", "5 рабочих дней", "30 дней"
    - Нет уведомления: "Без уведомления"
    - Не установлен: "Не установлен"
    - Нельзя определить: "Не удалось определить"

    Шаг 3 — ПРАВО НА ЭКСПОРТ ДАННЫХ

    Заполни "has_data_export_rights".

    Значения:
    - "yes" — есть явное право клиента на выгрузку данных.
    - "no" — право не предусмотрено или явно отсутствует.
    - "unclear" — нельзя определить.

    Шаг 4 — КАЧЕСТВО ОКНА ВЫГРУЗКИ

    Заполни "export_window_quality".

    Значения:
    - "good" — разумное окно (≥ 30 дней) после расторжения.
    - "limited" — окно есть, но короткое (< 30 дней).
    - "none" — окна нет.
    - "not_applicable" — права на экспорт нет.
    - "unclear" — нельзя определить.

    Шаг 5 — КАЧЕСТВО ФОРМАТОВ ЭКСПОРТА

    Заполни "export_format_quality".

    Значения:
    - "machine_readable" — CSV, JSON, XML, API.
    - "partial" — частично машиночитаемые.
    - "poor" — только PDF / нестандартные форматы.
    - "not_specified" — форматы не указаны.
    - "not_applicable" — права на экспорт нет.
    - "unclear" — нельзя определить.

    Шаг 6 — ХРАНЕНИЕ / УДАЛЕНИЕ ДАННЫХ

    Заполни "data_retention_after_termination".

    Значения:
    - "defined_period" — чётко установлен срок хранения
      (укажи срок в reason).
    - "immediate_deletion" — данные удаляются немедленно.
    - "on_request" — удаление по запросу клиента.
    - "not_specified" — не урегулировано.
    - "unclear" — нельзя определить.

    Шаг 7 — ПРОЗРАЧНОСТЬ BACKUP / RESTORE

    Заполни "backup_and_restore_transparency".

    Значения:
    - "clear" — чёткие условия: частота, срок хранения,
      процедура restore.
    - "partial" — backup упомянут без деталей.
    - "absent" — backup не упоминается.
    - "unclear" — нельзя определить.

    Шаг 8 — НОРМАЛИЗОВАННЫЙ DISPLAY ДЛЯ DD GRID

    Заполни "it_access_display".

    Это итоговое поле для таблицы.
    Строй его ТОЛЬКО на основе уже заполненных полей выше.
    Не добавляй информацию сверх них.

    Правила:
    - Если it_access_status = "missing":
      "Условия доступа и экспорта в договоре не урегулированы"
    - Если все поля unclear:
      "Не удалось определить условия доступа и экспорта"
    - Иначе комбинируй через ";":
      * service_suspension_severity (если strict: предупредить)
      * suspension_notice_period (если "Без уведомления": добавить)
      * has_data_export_rights (если "no": "нет права на экспорт")
      * export_window_quality (если limited/none)
      * data_retention_after_termination (если критично)
    - Не более 4 коротких фактов через ";".

    Шаг 9 — КРАТКОЕ ОБОСНОВАНИЕ

    Заполни "reason".

    Правила:
    - Первое предложение — краткий вывод.
    - Второе — короткая цитата из текста (до 100 символов).
    - Пиши по-русски.
    </instructions>

    <edge_cases>
    - Немедленное отключение при просрочке < 30 дней:
      * it_access_status = "present"
      * service_suspension_severity = "strict"
      * suspension_notice_period = "0 дней"

    - Договор молчит о праве на экспорт:
      * it_access_status = "present"
      * has_data_export_rights = "no"
      * export_window_quality = "not_applicable"
      * export_format_quality = "not_applicable"

    - Окно 30 дней, CSV/JSON:
      * it_access_status = "present"
      * export_window_quality = "good"
      * export_format_quality = "machine_readable"

    - Немедленное удаление после расторжения:
      * it_access_status = "present"
      * data_retention_after_termination = "immediate_deletion"

    - Backup упомянут без деталей:
      * it_access_status = "present"
      * backup_and_restore_transparency = "partial"

    - Договор прямо исключает право на экспорт:
      * it_access_status = "present"
      * has_data_export_rights = "no"
      * location с прямой цитатой об отсутствии.

    - Нет релевантных фрагментов / раздел о доступе и экспорте
      в договоре отсутствует:
      * it_access_status = "missing"
      * service_suspension_severity = "not_addressed"
      * suspension_notice_period = "Не установлен"
      * has_data_export_rights = "no"
      * export_window_quality = "not_applicable"
      * export_format_quality = "not_applicable"
      * data_retention_after_termination = "not_specified"
      * backup_and_restore_transparency = "absent"
      * it_access_display =
        "Условия доступа и экспорта в договоре не урегулированы"
      * location у всех полей = null.

    - Формулировки есть, но вывод невозможен:
      * it_access_status = "unclear"
      * соответствующие поля = "unclear"
    </edge_cases>

    <output_expectations>
    - Верни результат строго в формате JSON.
    - Не оборачивай в markdown-блоки (без ```).
    - Не добавляй комментариев вне JSON.
    - Все значения полей с allowed_values — на английском.
    - Свободные текстовые поля (it_access_display,
      suspension_notice_period, reason) — на русском языке.
    - Не добавляй полей, кроме указанных.
    - Для каждого поля возвращай объект с ключами
      "value", "confidence", "location".

    Пример структуры ответа:
    {
