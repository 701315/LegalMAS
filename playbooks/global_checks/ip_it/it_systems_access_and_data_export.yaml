id: "it_systems_access_and_data_export"
name: "Доступ к ИТ-системам и экспорт данных при прекращении"
description: >
  Анализирует условия доступа к критическим ИТ-системам и сервисам,
  а также порядок экспорта, хранения, резервного копирования и удаления
  данных при приостановке и расторжении договора. Оценивает операционный
  риск отключения сервиса, риск потери данных и степень vendor lock-in
  для Target.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"

rules:
  keyword_mode: any

  keywords:
    high:
      # Доступ / сервис
      - "(?i)access\\s+to\\s+the\\s+system"
      - "(?i)access\\s+to\\s+services?"
      - "(?i)доступ\\s+к\\s+системе"
      - "(?i)доступ\\s+к\\s+сервис"
      - "(?i)service\\s+availability"
      - "(?i)доступност[ьи]\\s+сервис"
      - "(?i)\\bSaaS\\b"
      - "(?i)облачн(ый|ого)\\s+сервис"
      - "(?i)cloud\\s+service"

      # Приостановка / отключение
      - "(?i)suspension\\s+of\\s+service"
      - "(?i)service\\s+suspension"
      - "(?i)приостановлени[ея]\\s+услуг"
      - "(?i)приостановлени[ея]\\s+сервис"
      - "(?i)termination\\s+of\\s+service"
      - "(?i)отключени[ея]\\s+сервис"
      - "(?i)disable\\s+(the\\s+)?service"
      - "(?i)restrict\\s+access"
      - "(?i)ограничени[ея]\\s+доступа"
      - "(?i)immediate\\s+suspension"
      - "(?i)немедленн(ое|ого)\\s+отключени"

      # Экспорт / retrieval
      - "(?i)data\\s+export"
      - "(?i)data\\s+retrieval"
      - "(?i)export\\s+of\\s+data"
      - "(?i)экспорт\\s+данных"
      - "(?i)выгрузк[аи]\\s+данных"
      - "(?i)retrieve\\s+your\\s+data"
      - "(?i)получени[ея]\\s+своих\\s+данных"

      # Удаление / хранение
      - "(?i)data\\s+deletion"
      - "(?i)удалени[ея]\\s+данных"
      - "(?i)delete\\s+(the\\s+)?data"
      - "(?i)retention\\s+period"
      - "(?i)срок\\s+хранени[яе]\\s+данных"
      - "(?i)anonymi[sz]ation"
      - "(?i)анонимизаци[яи]"

      # Backup / restore
      - "(?i)backup"
      - "(?i)резервн(ое|ого)\\s+копировани"
      - "(?i)restore"
      - "(?i)восстановлени[ея]\\s+данных"
      - "(?i)disaster\\s+recovery"

    medium:
      # Уведомление / grace period
      - "(?i)prior\\s+notice"
      - "(?i)предварительн(ое|ого)\\s+уведомлени"
      - "(?i)written\\s+notice"
      - "(?i)письменн(ое|ого)\\s+уведомлени"
      - "(?i)grace\\s+period"
      - "(?i)льготн(ый|ого)\\s+период"
      - "(?i)cure\\s+period"
      - "(?i)срок\\s+для\\s+устранени"

      # Форматы / API
      - "(?i)CSV"
      - "(?i)XML"
      - "(?i)JSON"
      - "(?i)API"
      - "(?i)машиночитаем(ый|ом)\\s+формат"
      - "(?i)standard\\s+format"
      - "(?i)read[-\\s]?only\\s+access"
      - "(?i)режим\\s+только\\s+чтения"

      # Платность экспорта
      - "(?i)export\\s+fees?"
      - "(?i)fee\\s+for\\s+data\\s+export"
      - "(?i)плат[аы]\\s+за\\s+экспорт\\s+данных"
      - "(?i)addition(al)?\\s+charge"

      # Нарушения / abuse / security
      - "(?i)breach\\s+of\\s+agreement"
      - "(?i)нарушени[ея]\\s+договора"
      - "(?i)security\\s+incident"
      - "(?i)инцидент\\s+безопасности"
      - "(?i)abuse\\s+of\\s+service"
      - "(?i)злоупотреблени[ея]\\s+сервис"

      # Просрочка оплаты
      - "(?i)late\\s+payment"
      - "(?i)payment\\s+default"
      - "(?i)просрочк[аи]\\s+оплат"
      - "(?i)неоплат[аы]"

    low:
      # Общие термины
      - "(?i)access"
      - "(?i)доступ"
      - "(?i)service"
      - "(?i)сервис"
      - "(?i)system"
      - "(?i)систем"
      - "(?i)data"
      - "(?i)данн"
      - "(?i)export"
      - "(?i)экспорт"
      - "(?i)delete"
      - "(?i)удал"
      - "(?i)retain"
      - "(?i)хран"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 750

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  context_k: 5
  max_chunks: 10
  boost_keywords:
    - "access to the system"
    - "доступ к системе"
    - "service suspension"
    - "приостановление услуг"
    - "termination of service"
    - "отключение сервиса"
    - "data export"
    - "экспорт данных"
    - "data retrieval"
    - "выгрузка данных"
    - "data deletion"
    - "удаление данных"
    - "retention period"
    - "срок хранения данных"
    - "backup"
    - "резервное копирование"
    - "read-only access"
    - "SaaS"
    - "cloud service"
    - "grace period"
    - "prior notice"
    - "CSV"
    - "JSON"
    - "API"
  rerank: true
  filters: {}

conditional: null

extraction:
  llm_prompt_extraction: |
    <role>
    Ты — юрист по ИТ и SaaS-договорам.
    Твоя специализация — условия доступа к облачным сервисам,
    приостановка и отключение критичных ИТ-систем, экспорт данных,
    резервное копирование и обращение с данными при прекращении
    договора.
    </role>

    <context>
    Ниже приведены фрагменты договора, касающиеся доступа
    к ИТ-системам и данным:

    {context}
    </context>

    <instructions>
    Проведи анализ по шагам. Каждый шаг логически соответствует
    одному или нескольким полям итоговой оценки.

    Шаг 1 — УСЛОВИЯ ПРИОСТАНОВКИ / ОТКЛЮЧЕНИЯ СЕРВИСА
    (используется для заполнения полей "service_suspension_conditions"):
    - Определи, наличие условий когда поставщик может приостанавливать
      или отключать сервис:
      * просрочка оплаты;
      * нарушение договора;
      * инциденты безопасности;
      * злоупотребление сервисом;
      * спор / расследование.
    - Верни:
      * "yes";
      * "no";
      * "unclear".

    Шаг 2 — ПРАВО КЛИЕНТА НА ЭКСПОРТ ДАННЫХ
    (используется для заполнения поля "has_data_export_rights"):
    - Проверь, предусмотрено ли явное право клиента
      на выгрузку / получение своих данных.
    - Учитывай:
      * прямое право export / retrieval;
      * ограничения по объёму, периодичности, каналам доступа;
      * платность услуги.
    - Верни:
      * "yes";
      * "no";
      * "unclear".

    Шаг 3 — УДАЛЕНИЕ, ХРАНЕНИЕ И BACKUP
    (используется для заполнения поля "data_deletion_or_retention_terms"):
    - Оцени, что происходит с данными клиента:
      * сроки хранения после расторжения;
      * окончательное удаление / anonymization;
      * наличие backup и возможности restore;
      * удаление по запросу клиента.
    - Верни:
      * "yes";
      * "no";
      * "unclear".

    Шаг 4 — RED FLAGS
    (используется для заполнения поля "red_flags"):
    Присвой один или несколько кодов из списка ниже.
    Если ни один код не применим — верни "NONE".
    Если данных недостаточно для оценки — верни "UNCLEAR".

    Коды:
    • ITEXIT1 — Поставщик вправе немедленно отключить сервис
      при небольших нарушениях или без разумного уведомления.
    • ITEXIT2 — Нет реального права на экспорт данных
      или оно описано формально.
    • ITEXIT3 — Нет разумного окна после расторжения
      для выгрузки данных.
    • ITEXIT4 — Данные удаляются быстро / немедленно
      после расторжения без safe exit периода.
    • ITEXIT5 — Форматы экспорта неудобны, неполны
      или не машиночитаемы, что усиливает vendor lock-in.
    • ITEXIT6 — Условия backup / restore непрозрачны,
      что повышает риск потери данных.

    Формат ответа: коды через запятую без комментариев
    (например: "ITEXIT1, ITEXIT3").
    Вся аргументация — в поле reason.

    Шаг 5 — ОБОСНОВАНИЕ
    (используется для заполнения поля "reason"):

    - В reason кратко обоснуй вывод, ссылаясь на ключевые
      формулировки из текста (с цитатами в кавычках), и укажи:
      * как и когда сервис может быть отключён;
      * есть ли export rights;
      * каково окно и формат выгрузки;
      * что происходит с данными после termination;
      * если выставлены red_flags — обоснуй каждый код;
      * если red_flags = "NONE" — укажи, почему риск
        приемлем.
    </instructions>

    <edge_cases>
    Обрабатывай пограничные ситуации так:

    - Поставщик вправе немедленно отключить сервис
      при небольшой просрочке или споре без уведомления:
      suspension_severity = "strict";
      зафиксируй ITEXIT1.

    - Договор молчит о праве клиента на экспорт данных:
      has_data_export_rights = "no" или "unclear";
      возможно ITEXIT2 — не предполагая право по умолчанию.

    - Есть чёткое окно 30–60 дней и стандартные форматы:
      export_window_quality = "good";
      это снижает риск.

    - Данные удаляются немедленно при расторжении
      без периода для выгрузки:
      зафиксируй ITEXIT4; overall_risk_level обычно HIGH.

    - Экспорт только в PDF / нестандартных отчётах:
      export_window_quality = "poor";
      зафиксируй ITEXIT5.

    - Backup упомянут, но без сроков хранения
      и условий восстановления:
      backup_and_restore_transparency = "partial" или "poor";
      возможно ITEXIT6.

    - Пустые или явно нерелевантные фрагменты:
      red_flags = "UNCLEAR"; в reason укажи недостаток данных.
    </edge_cases>

    <output_expectations>
    На основе твоего анализа отдельный механизм извлечения сформирует
    структурированные поля по заранее заданной схеме. Твоя задача —
    давать чёткие юридические выводы и указывать конкретные формулировки
    из текста, на которых они основаны.
    </output_expectations>

  enabled: true
  mode: "hybrid"
  fields:
    - name: "service_suspension_conditions"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "has_data_export_rights"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "data_deletion_or_retention_terms"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "red_flags"
      type: "string"

    - name: "reason"
      type: "string"

  store_payload: true

red_flags:
  items:
    - code: "ITEXIT1"
      description: >
        Поставщик вправе немедленно отключить сервис
        при небольших нарушениях или без разумного уведомления.
    - code: "ITEXIT2"
      description: >
        Нет реального права на экспорт данных
        или оно описано формально.
    - code: "ITEXIT3"
      description: >
        Нет разумного окна после расторжения
        для выгрузки данных.
    - code: "ITEXIT4"
      description: >
        Данные удаляются быстро / немедленно после расторжения
        без safe exit периода.
    - code: "ITEXIT5"
      description: >
        Форматы экспорта неудобны, неполны или не машиночитаемы,
        что усиливает vendor lock-in.
    - code: "ITEXIT6"
      description: >
        Условия backup / restore непрозрачны,
        что повышает риск потери данных.