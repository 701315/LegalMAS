id: "it_systems_access_and_data_export"
name: "Доступ к ИТ-системам и экспорт данных при прекращении"
description: >
  Анализирует условия доступа к критическим ИТ-системам и сервисам, а также
  порядок экспорта и сохранения данных при расторжении договора.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"

rules:
  keywords:
    - "доступ к системе"
    - "access to the system"
    - "access to services"
    - "service availability"
    - "SaaS"
    - "облачный сервис"
    - "cloud service"
    - "data export"
    - "экспорт данных"
    - "data retrieval"
    - "удаление данных"
    - "data deletion"
    - "backup"
    - "резервное копирование"
    - "suspension of service"
    - "приостановление услуг"
    - "termination of service"
  keyword_mode: "any"
  regex_patterns: []
  clause_patterns: []

llm:
  prompt_template: |
    <role>
    Ты — юрист по ИТ и SaaS-договорам.
    Твоя специализация — условия доступа к облачным сервисам и обращение с данными
    при приостановке и расторжении договоров.
    </role>

    <context>
    Ниже приведены фрагменты договора, касающиеся доступа к ИТ-системам и данных:

    {context}
    </context>

    <instructions>
    Проведи анализ по шагам. Каждый шаг логически связан с одним или
    несколькими полями итоговой оценки.

    Шаг 1 — УСЛОВИЯ ПРИОСТАНОВКИ И ОТКЛЮЧЕНИЯ СЕРВИСА
    (используется для "service_suspension_conditions"):
    - Определи, в каких случаях поставщик может приостанавливать или отключать сервис:
      * просрочка оплаты (длительность, пороги, grace period);
      * нарушение условий договора, инциденты безопасности, злоупотребление сервисом;
      * наличие спора или расследования.
    - Обрати внимание на:
      * необходимость предварительного уведомления;
      * возможность немедленного отключения;
      * различие между частичным ограничением и полным отключением.
    - Кратко опиши ключевые условия и жёсткость механизма приостановки.

    Шаг 2 — ПРАВО КЛИЕНТА НА ЭКСПОРТ ДАННЫХ
    (используется для "has_data_export_rights"):
    - Проверь, предусмотрено ли:
      * явное право клиента на выгрузку/получение своих данных (data export / retrieval);
      * условия и ограничения (объём, периодичность, форматы, API-доступ, платность услуги).
    - Сформулируй вывод: yes / no / unclear в зависимости от наличия прямых положений.

    Шаг 3 — ОКНО И ФОРМАТ ЭКСПОРТА ПРИ РАСТОРЖЕНИИ
    (используется для "data_export_window_and_format"):
    - Определи:
      * есть ли установленный срок после расторжения, в течение которого клиент может
        экспортировать данные (например, 30/60/90 дней, режим read-only и т.п.);
      * в каких форматах предоставляются данные (CSV, XML, JSON, машиночитаемые форматы,
        стандартные отчёты, API).
    - Кратко опиши окно экспорта и формат/канал доступа.

    Шаг 4 — УСЛОВИЯ УДАЛЕНИЯ И ХРАНЕНИЯ ДАННЫХ
    (используется для "data_deletion_or_retention_terms"):
    - Оцени, что происходит с данными клиента:
      * сроки хранения (retention) после расторжения и/или деактивации;
      * порядок и сроки окончательного удаления или анонимизации;
      * наличие резервного копирования (backup) и возможностей восстановления;
      * возможность удаления/анонимизации по запросу клиента.
    - Опиши, насколько прозрачны эти условия и есть ли у клиента контроль над судьбой данных.

    Шаг 5 — ОБЩИЙ РИСК ДЛЯ TARGET
    (используется для "overall_risk_level" и "reason"):
    - Оцени общий риск для Target, учитывая:
      * жёсткость и предсказуемость условий приостановки/отключения сервиса;
      * наличие и реализуемость права на экспорт данных;
      * длительность и удобство окна выгрузки;
      * прозрачность и надёжность правил хранения/удаления.
    - Сформулируй общий уровень риска как low / medium / high.
    - В "reason" кратко обоснуй вывод, ссылаясь на ключевые формулировки
      (желательно с короткими цитатами) и пояснив, как эти условия влияют
      на операционные и ИТ-риски для Target.
    </instructions>

    <edge_cases>
    Обрабатывай пограничные ситуации так:

    - Поставщик вправе немедленно приостановить или отключить сервис при небольшой
      просрочке или споре без разумного уведомления:
      фиксируй это как повышенный риск и отражай в общем уровне риска.

    - Договор молчит о праве клиента на экспорт данных:
      не предполагая по умолчанию наличие такого права, указывай "unclear" или "no"
      с пояснением неопределённости.

    - Установлено чёткое окно (например, 30–60 дней) для экспорта данных после
      расторжения и описаны стандартные форматы:
      учитывай это как фактор снижения риска, даже если условия отключения жёсткие.

    - Прямо указано, что данные удаляются немедленно при расторжении без периода
      для выгрузки:
      рассматривай это как высокий риск для непрерывности бизнеса и восстановления.

    - Пустые или явно нерелевантные фрагменты:
      укажи, что данных недостаточно для анализа условий доступа к ИТ-системам
      и экспорта данных при прекращении, и поясни, как это влияет на неопределённость
      и оценку риска.
    </edge_cases>

    <output_expectations>
    На основе твоего анализа отдельный механизм извлечения сформирует
    структурированные поля по заранее заданной схеме. Твоя задача —
    давать чёткие юридические выводы и указывать конкретные формулировки
    из текста, на которых они основаны.
    </output_expectations>
  prompt_file: null
  context_k: 5
  temperature: 0.0
  max_tokens: 640

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  context_k: 5
  max_chunks: 10
  boost_keywords:
    - "access to the system"
    - "service suspension"
    - "data export"
    - "удаление данных"
    - "SaaS"
    - "cloud service"
  rerank: true
  filters: {}

conditional: null

extraction:
  enabled: true
  mode: "hybrid"
  fields:
    - name: "service_suspension_conditions"
      type: "string"

    - name: "has_data_export_rights"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "data_export_window_and_format"
      type: "string"

    - name: "data_deletion_or_retention_terms"
      type: "string"

    - name: "overall_risk_level"
      type: "string"
      allowed_values:
        - "low"
        - "medium"
        - "high"

    - name: "reason"
      type: "string"

  store_payload: true

red_flags:
  items:
    - code: "IP5"
      description: "Поставщик ИТ-услуг вправе немедленно отключить сервис/удалить данные при небольших нарушениях."
    - code: "IP6"
      description: "Отсутствие реального права на экспорт данных и разумного окна после расторжения."
