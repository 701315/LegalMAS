id: "dispute_resolution_procedure_details"
name: "Процедурные детали разрешения споров"
description: >
  Анализирует процедурные детали dispute resolution: арбитражный институт,
  место арбитража (seat), язык процесса, interim measures и court support,
  потенциальный конфликт между судебной и арбитражной оговорками,
  а также общий уровень процессуального риска с точки зрения
  enforceability и удобства для Target.

doc_types: []

severity: "medium"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"

rules:
  keyword_mode: any

  keywords:
    high:
      # Арбитражные институты — конкретные упоминания
      - "(?i)\\bICC\\b"
      - "(?i)\\bLCIA\\b"
      - "(?i)\\bSIAC\\b"
      - "(?i)\\bHKIAC\\b"
      - "(?i)\\bICAC\\b"
      - "(?i)\\bМКАС\\b"
      - "(?i)\\bSCC\\b"
      - "(?i)\\bAAA\\b"
      - "(?i)\\bJAMS\\b"
      - "(?i)International\\s+Chamber\\s+of\\s+Commerce"
      - "(?i)London\\s+Court\\s+of\\s+International\\s+Arbitration"
      - "(?i)Международн[а-я]+\\s+коммерческ[а-я]+\\s+арбитражн[а-я]+\\s+суд"

      # Seat / место арбитража
      - "(?i)seat\\s+of\\s+(the\\s+)?arbitration"
      - "(?i)мест[оа]\\s+арбитраж[ауы]"
      - "(?i)place\\s+of\\s+arbitration"

      # Язык арбитража
      - "(?i)language\\s+of\\s+(the\\s+)?arbitration"
      - "(?i)язык\\s+арбитраж[ауы]"
      - "(?i)арбитраж[\\s\\S]{0,30}(на\\s+русском|на\\s+английском|in\\s+English|in\\s+Russian)"

      # Interim measures / обеспечительные
      - "(?i)interim\\s+measures?"
      - "(?i)interim\\s+relief"
      - "(?i)provisional\\s+measures?"
      - "(?i)временн[а-я]+\\s+обеспечительн[а-я]+\\s+мер[аы]"
      - "(?i)обеспечительн[а-я]+\\s+мер[аы]"

      # Конфликт суд/арбитраж
      - "(?i)competent\\s+court[\\s\\S]{0,40}(in\\s+support|assist|aid)"
      - "(?i)(суд|court)[\\s\\S]{0,40}(содействи[ея]|support)[\\s\\S]{0,40}арбитраж"

    medium:
      # Общие арбитражные термины
      - "(?i)arbitration\\s+rules?"
      - "(?i)арбитражн[а-я]+\\s+правил[аоы]?"
      - "(?i)арбитражн[а-я]+\\s+регламент"
      - "(?i)arbitration\\s+clause"
      - "(?i)arbitral\\s+tribunal"
      - "(?i)арбитражн[а-я]+\\s+трибунал"
      - "(?i)number\\s+of\\s+arbitrators?"
      - "(?i)количеств[оа]\\s+арбитр[аов]"
      - "(?i)sole\\s+arbitrator"
      - "(?i)единоличн[а-я]+\\s+арбитр"
      - "(?i)three\\s+arbitrators?"
      - "(?i)тр[ие]\\s+арбитр[аов]"

      # Общие ссылки на суд в контексте арбитража
      - "(?i)competent\\s+court"
      - "(?i)компетентн[а-я]+\\s+суд"
      - "(?i)court\\s+of\\s+competent\\s+jurisdiction"
      - "(?i)support\\s+of\\s+arbitration"

      # Enforcement / исполнение
      - "(?i)enforcement\\s+of[\\s\\S]{0,20}(award|решени)"
      - "(?i)исполнени[ея]\\s+арбитражн[а-я]+\\s+решени[яй]"
      - "(?i)New\\s+York\\s+Convention"
      - "(?i)Нью[-\\s]?Йоркск[а-я]+\\s+конвенци[яи]"

    low:
      # Общие термины
      - "(?i)\\barbitration\\b"
      - "(?i)\\bарбитраж\\b"
      - "(?i)\\btribunal\\b"
      - "(?i)\\baward\\b"
      - "(?i)\\bрешение\\s+арбитраж[ауы]\\b"
      - "(?i)\\bcourt\\b"
      - "(?i)\\bсуд[аеы]?\\b"
      - "(?i)dispute\\s+resolution"
      - "(?i)разрешени[ея]\\s+спор[аов]"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 640

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  context_k: 5
  max_chunks: 10
  boost_keywords:
    - "arbitration"
    - "seat of arbitration"
    - "place of arbitration"
    - "место арбитража"
    - "language of the arbitration"
    - "язык арбитража"
    - "interim measures"
    - "interim relief"
    - "временные обеспечительные меры"
    - "обеспечительные меры"
    - "competent court"
    - "компетентный суд"
    - "support of arbitration"
    - "содействие арбитражу"
    - "arbitration rules"
    - "арбитражный регламент"
    - "ICC"
    - "LCIA"
    - "SIAC"
    - "HKIAC"
    - "ICAC"
    - "МКАС"
    - "enforcement of award"
    - "исполнение арбитражного решения"
  rerank: true
  filters: {}

conditional: null

extraction:
  llm_prompt_extraction: |
    <role>
    Ты — юрист по международному арбитражу и судебным спорам.
    Твоя специализация — анализ арбитражных и юрисдикционных оговорок,
    включая процедурные детали (институт, seat, язык, interim measures,
    court support), влияющие на enforceability и удобство процедуры.
    </role>

    <context>
    Ниже приведены фрагменты договора с деталями dispute resolution:

    {context}
    </context>

    <instructions>
    Проведи анализ по шагам. Каждый шаг логически соответствует одному
    или нескольким полям итоговой оценки риска.

    Шаг 1 — АРБИТРАЖНЫЙ ИНСТИТУТ И МЕСТО (SEAT)
    (используется для заполнения поля "arbitration_institution_and_seat"):
    - Определи, выбран ли арбитраж, и если да:
      * какой арбитражный институт указан (ICC, LCIA, SIAC, HKIAC,
        ICAC/МКАС, SCC, AAA, JAMS, ad hoc и т.п.);
      * какое место арбитража (seat) установлено;
      * есть ли отсылка к конкретным арбитражным правилам/регламенту.
    - Сформулируй краткое описание (например: "ICC, seat — Paris,
      ICC Rules 2021").
    - Если арбитраж не выбран вообще (только суд) — укажи "none".
    - Если институт указан, но seat не определён — зафиксируй это
      явно (например: "ICC, seat not specified").

    Шаг 2 — ЯЗЫК АРБИТРАЖА / ПРОЦЕССА
    (используется для заполнения поля "arbitration_language"):
    - Определи, указан ли язык арбитража или судебного процесса.
    - Если язык указан — передай его в явном виде
      (например: "English", "русский", "English and Russian").
    - Если язык не указан или информация недоступна — укажи "not specified".

    Шаг 3 — RED FLAGS
    (используется для заполнения поля "red_flags"):
    Присвой один или несколько кодов из списка ниже.
    Если ни один код не применим — верни "NONE".
    Если данных недостаточно для оценки — верни "UNCLEAR".

    Коды:
    • PROC1 — Конфликт суд/арбитраж: одновременное указание
      на суд и арбитраж без ясного приоритета или разграничения
      компетенции.
    • PROC2 — Место арбитража (seat) не определено, что создаёт
      неопределённость в отношении применимого процессуального
      режима и enforceability.
    • PROC3 — Язык арбитража/процесса не указан, что может
      привести к дополнительным спорам и задержкам.
    • PROC4 — Отсутствует положение о court support (interim
      measures / содействие арбитражу), что может затруднить
      обеспечение исполнения и защиту прав сторон
      в ходе разбирательства.
    • PROC5 — Выбран ad hoc арбитраж или малоизвестный институт
      без общепризнанных институциональных правил, что повышает
      процессуальную непредсказуемость.

    Формат ответа: коды через запятую без комментариев
    (например: "PROC1, PROC3"). Вся аргументация — в reason.

    Шаг 4 — ОБОСНОВАНИЕ
    (используется для заполнения поля "reason"):
    - В reason кратко обоснуй вывод, опираясь на ключевые
      формулировки из текста (с цитатами в кавычках), и укажи,
      какие элементы повышают или снижают риск.
    </instructions>

    <edge_cases>
    Обрабатывай пограничные ситуации так:

    - Арбитраж не выбран вообще, есть только суд:
      в arbitration_institution_and_seat укажи "none",
      arbitration_language — "not applicable",
      number_of_arbitrators — "not applicable",
      has_court_support_for_arbitration — "not applicable".
      Анализируй только судебную оговорку, конфликт и риски.

    - Указан арбитражный институт, но seat не определён:
      зафиксируй PROC2 и повысь уровень риска; объясни в reason,
      почему отсутствие seat критично (определяет lex arbitri,
      влияет на enforceability).

    - Язык арбитража/процесса не указан:
      зафиксируй PROC3; объясни в reason потенциальные последствия
      (дополнительные споры, задержки, расходы на перевод).

    - Одновременно указаны и суд, и арбитраж без ясного приоритета:
      зафиксируй PROC1; укажи в reason, что это может привести
      к параллельным процессам и оспариванию компетенции.

    - Указан ad hoc арбитраж без институциональных правил:
      зафиксируй PROC5; объясни в reason повышенную
      процессуальную непредсказуемость.

    - Указана «многоуровневая» схема (переговоры → медиация →
      арбитраж):
      анализируй каждый уровень отдельно; конфликт фиксируй
      только если уровни противоречат друг другу.

    - Пустые или явно нерелевантные фрагменты:
      укажи, что данных недостаточно для анализа процедурных
      деталей; в red_flags верни "UNCLEAR"; в reason объясни,
      что отсутствие процедурных деталей само по себе создаёт
      неопределённость и повышает процессуальный риск.
    </edge_cases>

    <output_expectations>
    На основе твоего анализа отдельный механизм извлечения сформирует
    структурированные поля по заранее заданной схеме. Твоя задача —
    давать чёткие юридические выводы и указывать конкретные
    формулировки из текста, на которых они основаны.
    </output_expectations>

  enabled: true
  mode: "hybrid"
  fields:
    - name: "arbitration_institution_and_seat"
      type: "string"

    - name: "arbitration_language"
      type: "string"

    - name: "red_flags"
      type: "string"

    - name: "reason"
      type: "string"

  store_payload: true

red_flags:
  items:
    - code: "PROC1"
      description: >
        Конфликт суд/арбитраж: одновременное указание на суд
        и арбитраж без ясного приоритета или разграничения компетенции.
    - code: "PROC2"
      description: >
        Место арбитража (seat) не определено, что создаёт
        неопределённость применимого процессуального режима.
    - code: "PROC3"
      description: >
        Язык арбитража/процесса не указан, что может привести
        к дополнительным спорам и задержкам.
    - code: "PROC4"
      description: >
        Отсутствует положение о court support (interim measures,
        содействие арбитражу), что затрудняет обеспечение
        исполнения в ходе разбирательства.
    - code: "PROC5"
      description: >
        Выбран ad hoc арбитраж или малоизвестный институт
        без общепризнанных институциональных правил.