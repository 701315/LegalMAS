id: "dispute_resolution_procedure_details"
name: "Процедурные детали разрешения споров"
description: >
  Анализирует детали dispute resolution: язык процесса, interim measures,
  сочетание суда и арбитража, а также типичные процедурные особенности,
  влияющие на enforceability и удобство.

doc_types: []

severity: "medium"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"

rules:
  keywords:
    - "arbitration"
    - "арбитраж"
    - "seat of arbitration"
    - "место арбитража"
    - "arbitration rules"
    - "ICC"
    - "LCIA"
    - "SIAC"
    - "HKIAC"
    - "ICAC"
    - "язык арбитража"
    - "language of the arbitration"
    - "interim measures"
    - "interim relief"
    - "временные обеспечительные меры"
    - "competent court"
    - "support of arbitration"
  keyword_mode: "any"
  regex_patterns: []
  clause_patterns: []

llm:
  prompt_template: |
    <role>
    Ты — юрист по международному арбитражу и судебным спорам.
    Твоя специализация — анализ арбитражных и юрисдикционных оговорок,
    включая процедурные детали, влияющие на enforceability и удобство.
    </role>

    <context>
    Ниже приведены фрагменты договора с деталями dispute resolution:

    {context}
    </context>

    <instructions>
    Проведи анализ по шагам. Каждый шаг логически связан с одним или
    несколькими полями итоговой оценки.

    Шаг 1 — АРБИТРАЖНЫЙ ИНСТИТУТ И МЕСТО
    (используется для заполнения поля "arbitration_institution_and_seat"):
    - Определи, выбран ли арбитраж и, если да:
      * какой арбитражный институт указан (ICC, LCIA, SIAC, HKIAC, ICAC и т.п.);
      * какое место арбитража (seat) установлено;
      * есть ли отсылка к конкретным арбитражным правилам.
    - Сформулируй это в виде короткого описания (например, "ICC, место арбитража Париж").
    - Если арбитраж не выбран вообще, отрази это явно (например, "none").

    Шаг 2 — ЯЗЫК АРБИТРАЖА/ПРОЦЕССА
    (используется для заполнения поля "arbitration_language"):
    - Определи, указан ли язык арбитража или судебного процесса.
    - Если язык указан — передай его в явном виде (например, "English", "русский").
    - Если язык не указан или из фрагментов это непонятно — зафиксируй "unclear"
      и отрази неопределённость в анализе.

    Шаг 3 — ПОДДЕРЖИВАЮЩАЯ РОЛЬ СУДОВ
    (используется для заполнения поля "has_court_support_for_arbitration"):
    - Проверь, есть ли положения о компетентных судах для:
      * обеспечительных мер (interim measures, временные обеспечительные меры);
      * содействия арбитражу (назначение арбитров, сбор доказательств и т.п.);
      * исполнения арбитражного решения.
    - Оцени, предусмотрена ли явная "court support" арбитража или она отсутствует/
      не прослеживается по тексту.

    Шаг 4 — ПОТЕНЦИАЛЬНЫЙ КОНФЛИКТ СУД/АРБИТРАЖ
    (используется для заполнения поля "has_potential_conflict_between_court_and_arbitration_clauses"):
    - Проанализируй соотношение судебной и арбитражной оговорок:
      * есть ли параллельные указания на суд и арбитраж без приоритета;
      * присутствуют ли противоречивые формулировки компетенции.
    - Сделай вывод, создаёт ли текст риск конфликтов и параллельных процессов
      (yes / no / unclear).

    Шаг 5 — ОБЩИЙ УРОВЕНЬ ПРОЦЕССУАЛЬНОГО РИСКА
    (используется для формирования "overall_risk_level" и "reason"):
    - Оцени общую процессуальную конструкцию с точки зрения:
      * предсказуемости и удобства процедуры;
      * риска параллельных процессов в суде и арбитраже;
      * риска проблем с enforceability арбитражного решения или судебного акта.
    - Сформулируй итоговый уровень риска как low / medium / high.
    - Кратко обоснуй вывод, опираясь на ключевые формулировки из текста
      (желательно с короткими цитатами в кавычках) и укажи, какие элементы
      повышают или снижают риск.
    </instructions>

    <edge_cases>
    Обрабатывай пограничные ситуации так:

    - Арбитраж не выбран вообще, есть только суд:
      отражай это как отсутствие арбитража; поддержка арбитража судами
      не актуальна.

    - Указан арбитражный институт, но место арбитража (seat) не определено:
      отмечай отсутствие seat как фактор увеличения процессуального риска,
      так как это усложняет определение применимого процессуального режима.

    - Язык арбитража/процесса не указан:
      фиксируй неопределённость и указывай, что это может привести к
      дополнительным спорам и задержкам.

    - Одновременно указаны и суд, и арбитраж без ясного приоритета:
      обращай на это особое внимание и рассматривай как потенциальный
      конфликт юрисдикций.

    - Пустые или явно нерелевантные фрагменты:
      укажи, что данных недостаточно для анализа процедурных деталей
      разрешения споров, и объясни, как это влияет на уровень риска
      и предсказуемость процедуры.
    </edge_cases>

    <output_expectations>
    На основе твоего анализа отдельный механизм извлечения сформирует
    структурированные поля по заранее заданной схеме. Твоя задача —
    давать чёткие юридические выводы и указывать конкретные формулировки
    из текста, на которых они основаны.
    </output_expectations>
  prompt_file: null
  context_k: 5
  temperature: 0.0
  max_tokens: 640

evidence:
  required: false
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  context_k: 5
  max_chunks: 10
  boost_keywords:
    - "arbitration"
    - "seat of arbitration"
    - "language of the arbitration"
    - "interim measures"
    - "competent court"
  rerank: true
  filters: {}

conditional: null

extraction:
  enabled: true
  mode: "hybrid"
  fields:
    - name: "arbitration_institution_and_seat"
      type: "string"

    - name: "arbitration_language"
      type: "string"

    - name: "has_court_support_for_arbitration"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "has_potential_conflict_between_court_and_arbitration_clauses"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "overall_risk_level"
      type: "string"
      allowed_values:
        - "low"
        - "medium"
        - "high"

    - name: "reason"
      type: "string"

  store_payload: true

red_flags:
  items:
    - code: "LAW3"
      description: "Одновременное или конфликтующее указание суда и арбитража без ясного приоритета."
