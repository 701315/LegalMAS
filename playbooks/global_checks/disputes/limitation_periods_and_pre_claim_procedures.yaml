id: "limitation_periods_and_pre_claim_procedures"
name: "Сроки исковой давности и претензионные процедуры"
description: >
  Анализирует контрактные ограничения по срокам предъявления требований
  (contractual limitation periods), сокращённые сроки давности и специальные
  претензионные/медиационные процедуры.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"

rules:
  keywords:
    - "срок исковой давности"
    - "limitation period"
    - "time bar"
    - "в течение"
    - "no claim shall be brought"
    - "никакие претензии не могут быть предъявлены"
    - "претензионный порядок"
    - "pre-trial procedure"
    - "pre-claim procedure"
    - "mandatory mediation"
    - "обязательная медиация"
    - "cooling-off period"
  keyword_mode: "any"
  regex_patterns: []
  clause_patterns: []

llm:
  prompt_template: |
    <role>
    Ты — юрист по судебным спорам и контрактам.
    Твоя специализация — договорные ограничения по срокам предъявления требований
    и обязательные претензионные/медиационные процедуры.
    </role>

    <context>
    Ниже приведены фрагменты договора:

    {context}
    </context>

    <instructions>
    Проведи анализ по шагам. Каждый шаг логически связан с одним или
    несколькими полями итоговой оценки.

    Шаг 1 — НАЛИЧИЕ СПЕЦИАЛЬНЫХ ДОГОВОРНЫХ СРОКОВ
    (используется для заполнения поля "has_contractual_limitation_periods"
     и описания "limitation_periods_description"):
    - Определи, установлены ли в договоре специальные (изменённые или сокращённые)
      сроки для предъявления претензий или исков по сравнению с общими
      законными сроками.
    - Кратко опиши, как сформулирован(ы) срок(и) и для каких требований
      они применяются (например, "6 месяцев с даты поставки").

    Шаг 2 — СТЕПЕНЬ СЖАТОСТИ СРОКОВ
    (дополняет "limitation_periods_description" и влияет на риск):
    - Оцени, насколько договорные сроки отличаются от стандартных:
      * сильно сокращены (например, 3–6 месяцев);
      * умеренно сокращены (например, 1 год вместо существенно более долгого срока);
      * по сути совпадают с законом или близки к нему.
    - Отрази вывод в описании специальных сроков и учитывай его при оценке риска.

    Шаг 3 — НАЛИЧИЕ ОБЯЗАТЕЛЬНЫХ ПРЕТЕНЗИОННЫХ/МЕДИАЦИОННЫХ ПРОЦЕДУР
    (используется для заполнения поля
     "has_mandatory_pre_claim_or_mediation_procedures"):
    - Определи, предусматривает ли договор:
      * обязательный претензионный порядок (pre-trial/pre-claim procedure);
      * обязательную медиацию, cooling-off period или иные досудебные механизмы.
    - Обрати внимание на:
      * сроки направления претензий/запросов,
      * требуемую форму (письменная, по e-mail и т.п.),
      * последствия несоблюдения (вплоть до отказа в иске).

    Шаг 4 — ПРОЦЕССУАЛЬНЫЙ БАРЬЕР ДЛЯ ЗАЩИТЫ ПРАВ
    (используется для заполнения поля "procedural_barrier_risk_level"):
    - В совокупности оцени, насколько договорные сроки и досудебные процедуры:
      * усложняют подачу требований,
      * создают риск пропуска срока,
      * дают контрагенту дополнительные аргументы для отклонения иска.
    - Определи уровень риска:
      * low — договор не создаёт существенных дополнительных барьеров
        по сравнению с законом;
      * medium — есть дополнительные требования и сроки, но они разумны
        и управляемы;
      * high — сроки нереалистично короткие или процедуры сформулированы так,
        что легко лишиться права на иск;
      * unclear — по фрагментам нельзя надёжно оценить.

    Шаг 5 — ОБЩИЙ УРОВЕНЬ РИСКА ДЛЯ TARGET
    (используется для формирования "overall_risk_level" и "reason"):
    - Оцени общий риск, учитывая:
      * наличие и строгость договорных сроков,
      * обязательные претензионные/медиационные процедуры и их последствия,
      * потенциальное влияние на возможность Target эффективно защищать свои права.
    - Сформулируй итоговый уровень риска как low / medium / high.
    - В "reason" кратко обоснуй вывод с указанием ключевых формулировок
      (желательно с короткими цитатами в кавычках), пояснив, как именно
      сроки и процедуры влияют на доступ к защите.
    </instructions>

    <edge_cases>
    Обрабатывай пограничные ситуации так:

    - Явно сильно сокращённый срок для предъявления требований
      (например, 3–6 месяцев) при более длинном общем сроке по закону:
      учитывай это как существенный процессуальный риск для Target и
      отмечай в объяснении.

    - Разумный претензионный порядок (например, обязательная претензия
      в течение 30 дней) без жёсткой санкции в виде автоматического отказа в иске:
      фиксируй наличие процедуры, но оцени степень барьера с учётом того,
      насколько реально ей следовать.

    - В договоре нет специальных сроков и нет процедур, отличающихся от закона:
      отражай, что дополнительных договорных ограничений не установлено и риск
      процессуальных барьеров невысок.

    - Пустые или явно нерелевантные фрагменты:
      укажи, что данных недостаточно для анализа договорных сроков и процедур
      защиты прав, и объясни, как это влияет на неопределённость и риск.
    </edge_cases>

    <output_expectations>
    На основе твоего анализа отдельный механизм извлечения сформирует
    структурированные поля по заранее заданной схеме. Твоя задача —
    давать чёткие юридические выводы и указывать конкретные формулировки
    из текста, на которых они основаны.
    </output_expectations>
  prompt_file: null
  context_k: 5
  temperature: 0.0
  max_tokens: 640

evidence:
  required: false
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  context_k: 5
  max_chunks: 10
  boost_keywords:
    - "limitation period"
    - "срок исковой давности"
    - "no claim shall be brought"
    - "претензионный порядок"
    - "mandatory mediation"
  rerank: true
  filters: {}

conditional: null

extraction:
  enabled: true
  mode: "hybrid"
  fields:
    - name: "has_contractual_limitation_periods"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "limitation_periods_description"
      type: "string"

    - name: "has_mandatory_pre_claim_or_mediation_procedures"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "procedural_barrier_risk_level"
      type: "string"
      allowed_values:
        - "low"
        - "medium"
        - "high"
        - "unclear"

    - name: "overall_risk_level"
      type: "string"
      allowed_values:
        - "low"
        - "medium"
        - "high"

    - name: "reason"
      type: "string"

  store_payload: true

red_flags:
  items:
    - code: "LAW4"
      description: "Нереалистично короткие сроки на предъявление претензий."
    - code: "LAW5"
      description: "Жёсткие обязательные претензионные/медиационные процедуры, фактически блокирующие доступ к суду."
