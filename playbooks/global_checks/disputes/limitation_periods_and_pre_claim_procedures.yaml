id: "limitation_periods_and_pre_claim_procedures"
name: "Сроки исковой давности и претензионные процедуры"
description: >
  Анализирует контрактные ограничения по срокам предъявления требований
  (contractual limitation periods, time bars), сокращённые сроки давности,
  а также детали обязательных претензионных/медиационных процедур
  (сроки, форма, последствия несоблюдения). Оценивает, насколько
  эти механизмы создают процессуальные барьеры для Target.
  Примечание: сам факт наличия обязательных досудебных шагов (yes/no)
  фиксируется чеком governing_law_and_forum; данный чек углублённо
  анализирует их детали и риски.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"

rules:
  keyword_mode: any

  keywords:
    high:
      # Contractual limitation periods — точные формулы
      - "(?i)limitation\\s+period"
      - "(?i)срок\\s+исковой\\s+давност[ьи]"
      - "(?i)time\\s+bar"
      - "(?i)time[-\\s]?barred"
      - "(?i)no\\s+claim\\s+shall\\s+be\\s+(brought|made|filed)"
      - "(?i)никакие\\s+претензи[ия]\\s+не\\s+могут\\s+быть\\s+предъявлен[ыа]"
      - "(?i)claims?\\s+must\\s+be\\s+(brought|filed|submitted)\\s+within"
      - "(?i)требовани[яе]\\s+должн[оыа]\\s+быть\\s+предъявлен[оыа]\\s+в\\s+течение"

      # Сокращение сроков давности
      - "(?i)shorten(ed|ing)?\\s+(the\\s+)?limitation"
      - "(?i)сокращ[её]нн[а-я]+\\s+срок[аи]?\\s+(исковой\\s+)?давност[ьи]"
      - "(?i)reduced\\s+limitation\\s+period"
      - "(?i)contractual\\s+limitation"

      # Жёсткие последствия пропуска
      - "(?i)forfeiture\\s+of\\s+(the\\s+)?(right|claim)"
      - "(?i)утрат[аы]\\s+прав[аы]?\\s+на\\s+(иск|требовани[ея])"
      - "(?i)shall\\s+be\\s+deemed\\s+(waived|forfeited|abandoned)"
      - "(?i)считается\\s+(отказом|утраченн[а-яо]+)"
      - "(?i)precluded\\s+from\\s+(bringing|filing|making)"

      # Обязательные досудебные процедуры — детальные
      - "(?i)mandatory\\s+(pre[-\\s]?claim|pre[-\\s]?trial)\\s+procedure"
      - "(?i)обязательн[а-я]+\\s+претензионн[а-я]+\\s+порядок"
      - "(?i)condition\\s+precedent\\s+to[\\s\\S]{0,30}(claim|action|suit|proceedings)"
      - "(?i)failure\\s+to\\s+(comply|follow)[\\s\\S]{0,40}(bar|preclude|forfeit)"

    medium:
      # Сроки — общие формулировки
      - "(?i)within\\s+\\d+\\s+(days?|months?|years?)"
      - "(?i)в\\s+течение\\s+\\d+\\s+(дней|месяц[а-я]*|лет|год[а-я]*)"
      - "(?i)не\\s+позднее\\s+\\d+\\s+(дней|месяц[а-я]*)"
      - "(?i)no\\s+later\\s+than\\s+\\d+\\s+(days?|months?)"
      - "(?i)expir(ation|y|es?)\\s+of[\\s\\S]{0,30}(period|term|срок)"
      - "(?i)истечени[ея]\\s+срок[аи]"

      # Претензионный порядок — общие маркеры
      - "(?i)претензионн[а-я]+\\s+порядок"
      - "(?i)pre[-\\s]?trial\\s+procedure"
      - "(?i)pre[-\\s]?claim\\s+procedure"
      - "(?i)claim\\s+notice"
      - "(?i)notice\\s+of\\s+claim"
      - "(?i)уведомлени[ея]\\s+о\\s+претензи[ия]"
      - "(?i)письменн[а-я]+\\s+претензи[яи]"
      - "(?i)written\\s+claim"

      # Медиация / cooling-off
      - "(?i)mandatory\\s+mediation"
      - "(?i)обязательн[а-я]+\\s+медиаци[яи]"
      - "(?i)cooling[-\\s]?off\\s+period"
      - "(?i)период\\s+ожидани[яи]"
      - "(?i)amicable\\s+(settlement|resolution)\\s+period"

      # Последствия без жёсткой санкции
      - "(?i)failure\\s+to\\s+(notify|give\\s+notice)"
      - "(?i)несоблюдени[ея]\\s+претензионн[а-я]+"

    low:
      # Общие ссылки на сроки и процедуры
      - "(?i)limitation"
      - "(?i)давност[ьи]"
      - "(?i)claim\\s+period"
      - "(?i)срок\\s+предъявлени[яи]"
      - "(?i)претензи[яи]"
      - "(?i)claim"
      - "(?i)notice"
      - "(?i)уведомлени[ея]"
      - "(?i)mediation"
      - "(?i)медиаци[яи]"
      - "(?i)dispute\\s+resolution\\s+procedure"
      - "(?i)процедур[аы]\\s+урегулировани[яи]"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 640

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  context_k: 5
  max_chunks: 10
  boost_keywords:
    - "limitation period"
    - "срок исковой давности"
    - "time bar"
    - "no claim shall be brought"
    - "claims must be brought within"
    - "требования должны быть предъявлены в течение"
    - "сокращённый срок давности"
    - "contractual limitation"
    - "претензионный порядок"
    - "pre-claim procedure"
    - "pre-trial procedure"
    - "mandatory mediation"
    - "обязательная медиация"
    - "cooling-off period"
    - "notice of claim"
    - "уведомление о претензии"
    - "письменная претензия"
    - "утрата права на иск"
    - "forfeiture of the right"
    - "condition precedent to claim"
    - "failure to comply"
  rerank: true
  filters: {}

conditional: null

extraction:
  llm_prompt_extraction: |
    <role>
    Ты — юрист по судебным спорам и контрактному праву.
    Твоя специализация — анализ договорных ограничений по срокам
    предъявления требований (contractual limitation periods, time bars)
    и обязательных претензионных/медиационных процедур, включая оценку
    того, насколько они создают процессуальные барьеры для стороны.
    </role>

    <context>
    Ниже приведены фрагменты договора с положениями о сроках
    предъявления требований и/или досудебных процедурах:

    {context}
    </context>

    <instructions>
    Проведи анализ по шагам. Каждый шаг логически соответствует одному
    или нескольким полям итоговой оценки риска.

    Шаг 1 — НАЛИЧИЕ ДОГОВОРНЫХ СРОКОВ ДАВНОСТИ
    (используется для заполнения поля "has_contractual_limitation_periods"):
    - Определи, установлены ли в договоре специальные (изменённые
      или сокращённые) сроки для предъявления претензий или исков
      по сравнению с общими законными сроками.
    - Если такие сроки есть — "yes".
    - Если договор не содержит специальных сроков и опирается
      на общие нормы закона — "no".
    - Если из фрагментов невозможно определить — "unclear".

    Шаг 2 — ОПИСАНИЕ ДОГОВОРНЫХ СРОКОВ
    (используется для заполнения поля "limitation_periods_description"):
    - Если сроки найдены, кратко опиши:
      * конкретные сроки (например: «6 месяцев с даты поставки»,
        «12 months from completion»);
      * к каким типам требований они относятся
        (гарантийные, все претензии, убытки и т.п.);
      * начало течения срока (от даты поставки, обнаружения
        дефекта, подписания акта и т.п.).
    - Если сроков нет — укажи «Договорные сроки давности
      не установлены».

    Шаг 3 — СТЕПЕНЬ СЖАТОСТИ СРОКОВ
    (используется для заполнения поля "limitation_severity"):
    - Оцени, насколько договорные сроки отличаются от стандартных
      законных сроков давности (для российского права общий срок —
      3 года по ст. 196 ГК РФ; для английского права — 6 лет
      по Limitation Act 1980):
      * "significantly_shortened" — срок ≤ 6 месяцев или более чем
        вдвое короче законного;
      * "moderately_shortened" — срок сокращён, но разумен
        (например, 1–2 года при законном 3+);
      * "standard_or_close" — по сути совпадает с законом или
        близок к нему;
      * "not_applicable" — договорные сроки не установлены;
      * "unclear" — невозможно определить.

    Шаг 4 — ДЕТАЛИ ОБЯЗАТЕЛЬНЫХ ПРЕТЕНЗИОННЫХ / МЕДИАЦИОННЫХ
    ПРОЦЕДУР
    (используется для заполнения поля "has_mandatory_pre_claim_procedures"):
    - Определи, предусматривает ли договор обязательные досудебные
      процедуры:
      * претензионный порядок (pre-claim / pre-trial procedure);
      * обязательная медиация;
      * cooling-off period;
      * иные многоступенчатые схемы.
    - Если процедуры найдены, опиши:
      * сроки направления претензий/уведомлений;
      * требуемая форма (письменная, e-mail, заказное письмо и т.п.);
      * продолжительность cooling-off / медиационного периода;
      * последствия несоблюдения (утрата права на иск, отказ
        в принятии иска, отсутствие санкций).
    - Если процедур нет — укажи «Обязательные досудебные процедуры
      не предусмотрены».
    - Примечание: сам факт наличия обязательных досудебных шагов
      (yes/no/unclear) фиксируется также чеком governing_law_and_forum;
      здесь анализируются детали и риски.

    Шаг 5 — RED FLAGS
    (используется для заполнения поля "red_flags"):
    Присвой один или несколько кодов из списка ниже.
    Если ни один код не применим — верни "NONE".
    Если данных недостаточно для оценки — верни "UNCLEAR".

    Коды:
    • LIM1 — Нереалистично короткий срок предъявления требований
      (≤ 6 месяцев или существенно короче законного), создающий
      высокий риск пропуска.
    • LIM2 — Пропуск претензионного порядка влечёт автоматическую
      утрату права на иск (forfeiture / deemed waiver), без
      возможности восстановления.
    • LIM3 — Cooling-off или медиационный период чрезмерно
      длинный (> 90 дней), существенно задерживающий доступ
      к суду/арбитражу.
    • LIM4 — Разные сроки давности для разных типов требований,
      создающие путаницу и повышенный риск пропуска одного
      из сроков.
    • LIM5 — Односторонне невыгодные сроки: сокращены только
      для требований Target, но не для контрагента (или
      контрагенту установлены существенно более длинные сроки).

    Формат ответа: коды через запятую без комментариев
    (например: "LIM1" или "LIM1, LIM2").
    Вся аргументация — в поле reason.

    Шаг 6 — ОБОСНОВАНИЕ
    (используется для заполнения поля "reason"):
    - Кратко обоснуй вывод, опираясь на ключевые
      формулировки из текста (с цитатами в кавычках), и укажи:
      * какие конкретные сроки установлены и для каких требований;
      * какие процедуры обязательны и каковы последствия
        их несоблюдения;
      * если выставлены red_flags — обоснуй каждый код;
      * если red_flags = "NONE" — укажи, почему риск невысок.
    </instructions>

    <edge_cases>
    Обрабатывай пограничные ситуации так:

    - Сильно сокращённый срок (≤ 6 месяцев) при более длинном
      общем сроке по закону:
      зафиксируй LIM1; в reason объясни, что при стандартном
      законном сроке 3 года (ГК РФ) или 6 лет (Limitation Act)
      сокращение до N месяцев создаёт высокий риск пропуска.

    - Разные сроки для разных типов требований:
      зафиксируй LIM4; опиши каждый срок отдельно в
      limitation_periods_description; в reason укажи, что
      множественность сроков повышает риск путаницы.

    - Сроки сокращены только для Target, но не для контрагента:
      зафиксируй LIM5; в reason акцентируй односторонний
      характер ограничения.

    - Пропуск претензионного порядка = автоматическая утрата
      права на иск:
      зафиксируй LIM2; в reason процитируй формулировку
      о последствиях (forfeiture, deemed waiver, отказ в иске).

    - Разумный претензионный порядок (30 дней, без жёсткой
      санкции):
      has_mandatory_pre_claim_procedures = "yes", но red_flags
      могут быть "NONE"; в reason отрази, что процедура
      не создаёт существенного барьера.

    - Cooling-off / медиация > 90 дней:
      зафиксируй LIM3; в reason объясни, что чрезмерно
      длинный период задерживает доступ к принудительной
      защите прав.

    - Рекомендательные формулировки досудебной процедуры
      («стороны стремятся», «may discuss», «shall endeavour»):
      has_mandatory_pre_claim_procedures = "no" или "unclear";
      в reason явно зафиксируй рекомендательный характер.

    - Договор не содержит специальных сроков и процедур:
      has_contractual_limitation_periods = "no";
      has_mandatory_pre_claim_procedures = "no";
      limitation_severity = "not_applicable";
      red_flags = "NONE";
      в reason укажи, что договор опирается на общие нормы
      закона и дополнительных барьеров не создаёт.

    - Пустые или явно нерелевантные фрагменты:
      укажи, что данных недостаточно; red_flags = "UNCLEAR";
      в reason объясни, что невозможность определить наличие
      или отсутствие специальных сроков и процедур сама по себе
      создаёт неопределённость.
    </edge_cases>

    <output_expectations>
    На основе твоего анализа отдельный механизм извлечения сформирует
    структурированные поля по заранее заданной схеме. Твоя задача —
    давать чёткие юридические выводы и указывать конкретные
    формулировки из текста, на которых они основаны.
    </output_expectations>

  enabled: true
  mode: "hybrid"
  fields:
    - name: "has_contractual_limitation_periods"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "limitation_periods_description"
      type: "string"

    - name: "limitation_severity"
      type: "string"
      allowed_values:
        - "significantly_shortened"
        - "moderately_shortened"
        - "standard_or_close"
        - "not_applicable"
        - "unclear"

    - name: "has_mandatory_pre_claim_procedures"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "red_flags"
      type: "string"

    - name: "reason"
      type: "string"

  store_payload: true

red_flags:
  items:
    - code: "LIM1"
      description: >
        Нереалистично короткий срок предъявления требований
        (≤ 6 месяцев или существенно короче законного),
        создающий высокий риск пропуска.
    - code: "LIM2"
      description: >
        Пропуск претензионного порядка влечёт автоматическую
        утрату права на иск (forfeiture / deemed waiver)
        без возможности восстановления.
    - code: "LIM3"
      description: >
        Cooling-off или медиационный период чрезмерно длинный
        (> 90 дней), существенно задерживающий доступ
        к суду/арбитражу.
    - code: "LIM4"
      description: >
        Разные сроки давности для разных типов требований,
        создающие путаницу и повышенный риск пропуска
        одного из сроков.
    - code: "LIM5"
      description: >
        Односторонне невыгодные сроки: сокращены только
        для требований Target, но не для контрагента.