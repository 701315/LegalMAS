id: "limitation_periods_and_pre_claim_procedures"
name: "Сроки исковой давности и претензионные процедуры"
description: >
  Анализирует контрактные ограничения по срокам предъявления требований
  (contractual limitation periods), сокращённые сроки давности и специальные
  претензионные/медиационные процедуры.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"

rules:
  keywords:
    - "срок исковой давности"
    - "limitation period"
    - "time bar"
    - "в течение"
    - "no claim shall be brought"
    - "никакие претензии не могут быть предъявлены"
    - "претензионный порядок"
    - "pre-trial procedure"
    - "pre-claim procedure"
    - "mandatory mediation"
    - "обязательная медиация"
    - "cooling-off period"
  keyword_mode: "any"
  regex_patterns: []
  clause_patterns: []

llm:
  prompt_template: |
    <role>
    Ты — юрист по судебным спорам и контрактам.
    Твоя специализация — договорные ограничения по срокам предъявления требований
    и обязательные претензионные/медиационные процедуры.
    </role>

    <context>
    Ниже приведены фрагменты договора:

    {context}
    </context>

    <instructions>
    Определи:

    1) Есть ли специальные (сокращённые или изменённые) сроки для предъявления
       претензий или исков по договору (contractual limitation periods, time bar),
       по сравнению с общими законными сроками.

    2) Насколько они отличаются от стандартных сроков исковой давности:
       - явно сильно сокращены (например, 3–6 месяцев);
       - умеренно сокращены (например, 1 год вместо более длинного общего срока);
       - совпадают с законом или не отличаются.

    3) Есть ли обязательные претензионные, медиационные или иные досудебные
       процедуры перед подачей иска:
       - претензионный порядок, mandatory mediation, cooling-off period и т.п.;
       - как они сформулированы (сроки, форма, последствия несоблюдения).

    4) Насколько такие положения усложняют или ограничивают возможность Target
       эффективно защищать свои права:
       - оцени procedural_barrier_risk_level: low / medium / high / unclear,
         исходя из комбинации сокращённых сроков и процедурных барьеров.

    5) Оцени общий риск (overall_risk_level: low / medium / high) для Target
       с учётом этих ограничений.
    </instructions>

    <edge_cases>
    ВАЖНО — пограничные случаи:

    — Если указано, что "никакие претензии не могут быть предъявлены по истечении
      6 месяцев с даты события", это, как правило, высокий процедурный риск,
      особенно если общий срок по закону существенно длиннее:
      has_contractual_limitation_periods = "yes",
      procedural_barrier_risk_level обычно "high".

    — Если установлен разумный претензионный порядок (например, обязательная
      претензия в течение 30 дней, без жёсткой санкции в виде отказа в иске):
      has_mandatory_pre_claim_or_mediation_procedures = "yes",
      но procedural_barrier_risk_level может быть "low" или "medium".

    — Если в договоре нет специальных сроков или процедур, отличающихся
      от закона:
      has_contractual_limitation_periods = "no",
      has_mandatory_pre_claim_or_mediation_procedures = "no",
      procedural_barrier_risk_level = "low".

    — Пустые или нерелевантные фрагменты:
      большинство полей = "unclear" или пустые строки,
      procedural_barrier_risk_level = "unclear",
      overall_risk_level = "medium",
      reason = "Недостаточно данных для анализа договорных сроков и процедур защиты прав."
    </edge_cases>

    <examples>
    ПРИМЕР 1 — ЖЁСТКО СОКРАЩЁННЫЙ СРОК (HIGH):

    Фрагмент: "Никакие претензии по настоящему Договору не могут быть
    предъявлены по истечении шести (6) месяцев с даты поставки
    соответствующих Товаров."

    {{
      "has_contractual_limitation_periods": "yes",
      "limitation_periods_description": "Срок предъявления претензий ограничен 6 месяцами с даты поставки, что существенно короче стандартных сроков.",
      "has_mandatory_pre_claim_or_mediation_procedures": "unclear",
      "procedural_barrier_risk_level": "high",
      "overall_risk_level": "high",
      "reason": "Договор устанавливает сильно сокращённый срок для предъявления претензий (6 месяцев), что существенно ограничивает защиту прав Target."
    }}

    ПРИМЕР 2 — УМЕРЕННЫЙ ПРЕТЕНЗИОННЫЙ ПОРЯДОК (MEDIUM):

    Фрагмент: "Сторона, считающая свои права нарушенными, обязана направить
    письменную претензию в течение 30 (тридцати) дней с момента обнаружения
    нарушения. При несоблюдении претензионного порядка суд может отказать
    в иске."

    {{
      "has_contractual_limitation_periods": "unclear",
      "limitation_periods_description": "Установлен обязательный претензионный порядок с 30-дневным сроком на претензию.",
      "has_mandatory_pre_claim_or_mediation_procedures": "yes",
      "procedural_barrier_risk_level": "medium",
      "overall_risk_level": "medium",
      "reason": "Обязательный претензионный порядок с коротким сроком и санкцией в виде риска отказа в иске создаёт дополнительный процедурный барьер."
    }}

    ПРИМЕР 3 — НЕТ СПЕЦИАЛЬНЫХ ОГРАНИЧЕНИЙ (LOW):

    Фрагмент: "Споры разрешаются в соответствии с применимым законодательством.
    Стороны вправе обращаться в суд в пределах сроков исковой давности,
    установленных законом."

    {{
      "has_contractual_limitation_periods": "no",
      "limitation_periods_description": "Специальные договорные сроки не устанавливаются, применяются законные сроки.",
      "has_mandatory_pre_claim_or_mediation_procedures": "no",
      "procedural_barrier_risk_level": "low",
      "overall_risk_level": "low",
      "reason": "Договор не содержит дополнительных ограничений по срокам и обязательных процедур, сверх предусмотренных законом."
    }}
    </examples>

    <output_format>
    Твой ответ ДОЛЖЕН быть строго валидным JSON-объектом со следующими
    полями:

    {{
      "has_contractual_limitation_periods": "one of: yes | no | unclear",
      "limitation_periods_description": "string — краткое описание специальных сроков и их строгости",
      "has_mandatory_pre_claim_or_mediation_procedures": "one of: yes | no | unclear",
      "procedural_barrier_risk_level": "one of: low | medium | high | unclear",
      "overall_risk_level": "one of: low | medium | high",
      "reason": "string — краткое объяснение на русском с указанием ключевых формулировок и влияния на возможность защиты прав"
    }}

    Все перечисленные поля ДОЛЖНЫ присутствовать в JSON, даже если их значение равно null.
    </output_format>

    <constraints>
    ЖЁСТКИЕ ПРАВИЛА:
    1. Выведи ТОЛЬКО один JSON-объект. Никакого текста до или после.
    2. Не пиши "Вот JSON", "Here is the JSON" и т.п.
    3. Не используй Markdown, бэктики ``` или любые обёртки.
    4. Все строки — в двойных кавычках.
    5. Значения перечислимых полей — СТРОГО из указанных вариантов.
    6. Ключи — точно как указано, без добавления новых.
    7. Поле "reason" ДОЛЖНО содержать конкретные факты и формулировки
       из фрагментов, а не общие фразы вроде "есть риски".
    8. Начни ответ сразу с символа {{
    9. Если по какому‑то полю нет достаточно информации в тексте —
       верни для него 'unclear' или null (для reason пустое значение
       недопустимо — нужно объяснение). НЕ придумывай значения, не интерполируй.
    </constraints>
  prompt_file: null
  context_k: 5
  temperature: 0.0
  max_tokens: 640

evidence:
  required: false
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  context_k: 5
  max_chunks: 10
  boost_keywords:
    - "limitation period"
    - "срок исковой давности"
    - "no claim shall be brought"
    - "претензионный порядок"
    - "mandatory mediation"
  rerank: true
  filters: {}

conditional: null

extraction:
  enabled: true
  mode: "hybrid"
  fields:
    - name: "has_contractual_limitation_periods"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
    - name: "limitation_periods_description"
      type: "string"
    - name: "has_mandatory_pre_claim_or_mediation_procedures"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
    - name: "procedural_barrier_risk_level"
      type: "string"
      allowed_values:
        - "low"
        - "medium"
        - "high"
        - "unclear"
    - name: "overall_risk_level"
      type: "string"
      allowed_values:
        - "low"
        - "medium"
        - "high"
    - name: "reason"
      type: "string"
  store_payload: true

red_flags:
  items:
    - code: "LAW4"
      description: "Нереалистично короткие сроки на предъявление претензий."
    - code: "LAW5"
      description: "Жёсткие обязательные претензионные/медиационные процедуры, фактически блокирующие доступ к суду."

      