id: "limitation_periods_and_pre_claim_procedures"
name: "Сроки исковой давности и претензионные процедуры"
description: >
  Углублённый анализ обязательных досудебных процедур и договорных
  ограничений по срокам предъявления требований.

  Извлекает: обязательность и содержание досудебной процедуры
  (претензия / переговоры / медиация / cooling-off), режим срока
  предъявления требования / претензии / иска (договорный /
  по применимому праву / не установлен), конкретный срок и момент
  его начала.

  Оценивает, насколько эти механизмы создают процессуальные
  барьеры для Target.

  Верхнеуровневый факт наличия досудебного порядка (yes/no)
  фиксируется чеком governing_law_and_forum. Данный check
  анализирует детали и риски этих процедур.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"
ui_mode: "field_extraction"

rules:
  keyword_mode: any

  keywords:
    high:
      # Contractual limitation periods — точные формулы
      - "(?i)limitation\\s+period"
      - "(?i)срок\\s+исковой\\s+давност[ьи]"
      - "(?i)time\\s+bar"
      - "(?i)time[-\\s]?barred"
      - "(?i)no\\s+claim\\s+shall\\s+be\\s+(brought|made|filed)"
      - "(?i)никакие\\s+претензи[ия]\\s+не\\s+могут\\s+быть\\s+предъявлен[ыа]"
      - "(?i)claims?\\s+must\\s+be\\s+(brought|filed|submitted)\\s+within"
      - "(?i)требовани[яе]\\s+должн[оыа]\\s+быть\\s+предъявлен[оыа]\\s+в\\s+течение"

      # Сокращение сроков давности
      - "(?i)shorten(ed|ing)?\\s+(the\\s+)?limitation"
      - "(?i)сокращ[её]нн[а-я]+\\s+срок[аи]?\\s+(исковой\\s+)?давност[ьи]"
      - "(?i)reduced\\s+limitation\\s+period"
      - "(?i)contractual\\s+limitation"

      # Жёсткие последствия пропуска
      - "(?i)forfeiture\\s+of\\s+(the\\s+)?(right|claim)"
      - "(?i)утрат[аы]\\s+прав[аы]?\\s+на\\s+(иск|требовани[ея])"
      - "(?i)shall\\s+be\\s+deemed\\s+(waived|forfeited|abandoned)"
      - "(?i)считается\\s+(отказом|утраченн[а-яо]+)"
      - "(?i)precluded\\s+from\\s+(bringing|filing|making)"

      # Обязательные досудебные процедуры — детальные
      - "(?i)mandatory\\s+(pre[-\\s]?claim|pre[-\\s]?trial)\\s+procedure"
      - "(?i)обязательн[а-я]+\\s+претензионн[а-я]+\\s+порядок"
      - "(?i)condition\\s+precedent\\s+to[\\s\\S]{0,30}(claim|action|suit|proceedings)"
      - "(?i)failure\\s+to\\s+(comply|follow)[\\s\\S]{0,40}(bar|preclude|forfeit)"

    medium:
      # Сроки — общие формулировки
      - "(?i)within\\s+\\d+\\s+(days?|months?|years?)[\\s\\S]{0,30}(claim|notice|pretenz)"
      - "(?i)в\\s+течение\\s+\\d+\\s+(дней|месяц[а-я]*|лет)[\\s\\S]{0,30}(претензи|требовани|обращени)"
      - "(?i)не\\s+позднее\\s+\\d+\\s+(дней|месяц[а-я]*)[\\s\\S]{0,30}(претензи|требовани)"
      - "(?i)no\\s+later\\s+than\\s+\\d+\\s+(days?|months?)[\\s\\S]{0,30}(claim|notice)"
      - "(?i)истечени[ея]\\s+срок[аи][\\s\\S]{0,30}(претензи|давност|требовани)"

      # Претензионный порядок — маркеры
      - "(?i)претензионн[а-я]+\\s+порядок"
      - "(?i)pre[-\\s]?trial\\s+procedure"
      - "(?i)pre[-\\s]?claim\\s+procedure"
      - "(?i)claim\\s+notice"
      - "(?i)notice\\s+of\\s+claim"
      - "(?i)уведомлени[ея]\\s+о\\s+претензи[ия]"
      - "(?i)письменн[а-я]+\\s+претензи[яи]"
      - "(?i)written\\s+claim"

      # Медиация / cooling-off
      - "(?i)mandatory\\s+mediation"
      - "(?i)обязательн[а-я]+\\s+медиаци[яи]"
      - "(?i)cooling[-\\s]?off\\s+period"
      - "(?i)период\\s+ожидани[яи]"
      - "(?i)amicable\\s+(settlement|resolution)\\s+period"

      # Последствия несоблюдения
      - "(?i)failure\\s+to\\s+(notify|give\\s+notice)[\\s\\S]{0,30}(bar|forfeit|preclude)"
      - "(?i)несоблюдени[ея]\\s+претензионн[а-я]+[\\s\\S]{0,30}(лишает|утрата|последствия)"

    low:
      - "(?i)contractual\\s+limitation"
      - "(?i)time\\s+bar"
      - "(?i)claim\\s+deadline"
      - "(?i)срок\\s+предъявлени[яи]\\s+(претензи|требовани|иска)"
      - "(?i)претензионн[а-я]+\\s+порядок"
      - "(?i)mandatory\\s+mediation"
      - "(?i)cooling[-\\s]?off"
      - "(?i)condition\\s+precedent"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 640

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  context_k: 5
  max_chunks: 10
  boost_keywords:
    - "limitation period"
    - "срок исковой давности"
    - "time bar"
    - "no claim shall be brought"
    - "claims must be brought within"
    - "требования должны быть предъявлены в течение"
    - "сокращённый срок давности"
    - "contractual limitation"
    - "претензионный порядок"
    - "pre-claim procedure"
    - "pre-trial procedure"
    - "mandatory mediation"
    - "обязательная медиация"
    - "cooling-off period"
    - "период ожидания"
    - "notice of claim"
    - "уведомление о претензии"
    - "письменная претензия"
    - "утрата права на иск"
    - "forfeiture of the right"
    - "condition precedent to claim"
    - "failure to comply"
  rerank: true
  filters: {}

conditional: null

enrichment_hints:
  preferred_segment_types:
    - "contract"
    - "amendment"
  excluded_segment_types:
    - "technical_specification"
    - "price_list"
    - "invoice"
    - "act"
    - "schedule"
  preferred_clause_functions:
    - "dispute_resolution"
    - "governing_law"
    - "termination"
  confidence_bonus_on_match: 0.10
  confidence_penalty_on_excluded_segment: 0.20

extraction:
  enabled: true
  mode: "hybrid"
  llm_max_tokens: 460
  llm_prompt_extraction: |
    <role>
    Ты — юрист по договорным спорам.
    Твоя задача — не оценивать риск, а точно извлечь из текста:
    1) есть ли обязательная досудебная процедура и каковы её детали;
    2) установлен ли в договоре срок предъявления претензии /
       требования / иска, и если да — какой именно.
    </role>

    <context>
    Ниже приведены релевантные фрагменты договора:

    {context}
    </context>

    <task>
    Заполни только следующие поля:
    - limitation_and_procedure_display
    - pre_claim_procedure_status
    - pre_claim_procedure_value
    - claim_deadline_regime
    - claim_deadline_value
    - claim_deadline_trigger
    - claim_deadline_display
    - reason

    Важно:
    - не придумывай сроки на основе закона;
    - не смешивай статус и значение в одном поле;
    - если договор отсылает к применимому праву —
      это отдельный результат, а не "срок не установлен";
    - пиши user-facing значения коротко и по-русски.
    </task>

    <instructions>
    Шаг 1 — ОПРЕДЕЛИ НАЛИЧИЕ ОБЯЗАТЕЛЬНОЙ ДОСУДЕБНОЙ ПРОЦЕДУРЫ

    Заполни поле "pre_claim_procedure_status".

    Значения:
    - "mandatory" — договор прямо требует до обращения
      в суд/арбитраж:
      * направить претензию / written claim / notice of claim;
      * выдержать обязательный срок ожидания / cooling-off;
      * пройти обязательные переговоры / медиацию;
      * выполнить иной обязательный pre-claim step.
    - "not_mandatory" — нет обязательной досудебной процедуры,
      либо формулировки факультативные:
      ("may", "shall endeavour", "стороны стремятся",
      "могут урегулировать").
    - "unclear" — невозможно уверенно определить обязательность.

    Шаг 2 — КРАТКО ОПИШИ ДОСУДЕБНУЮ ПРОЦЕДУРУ

    Заполни поле "pre_claim_procedure_value".

    Правила:
    - Поле должно быть коротким и понятным пользователю.
    - Примеры:
      * "Обязательная письменная претензия"
      * "Обязательная претензия и 30-дневный срок урегулирования"
      * "Обязательная медиация перед обращением в арбитраж"
      * "Рекомендательный переговорный порядок"
      * "Не предусмотрена"
      * "Не удалось определить"
    - Если status = "not_mandatory" и процедуры нет:
      "Не предусмотрена"
    - Если факультативная/рекомендательная:
      "Рекомендательный переговорный порядок"
    - Если status = "unclear":
      "Не удалось определить"

    Шаг 3 — ОПРЕДЕЛИ РЕЖИМ СРОКА ПРЕДЪЯВЛЕНИЯ ПРЕТЕНЗИИ / ИСКА

    Заполни поле "claim_deadline_regime".

    Под "claim deadline" понимай:
    - срок для направления претензии / claim notice;
    - срок для предъявления требования;
    - срок для обращения с иском (limitation period / time bar),
      если он прямо установлен договором.

    Значения:
    - "contract_specified" — договор прямо устанавливает конкретный срок.
    - "applicable_law_reference" — договор не называет срок, но прямо
      отсылает к закону / применимому праву.
    - "not_specified" — срок не установлен и нет прямой отсылки.
    - "unclear" — невозможно определить.

    Важно:
    - не выводи срок из общих норм права;
    - если в договоре есть и конкретный срок, и ссылка на закон,
      выбирай "contract_specified";
    - обычные операционные уведомления (не связанные с претензией,
      требованием, спором или судом) не считай claim deadline.

    Шаг 4 — ЕСЛИ СРОК УСТАНОВЛЕН, ИЗВЛЕКИ ЕГО

    Заполни поля "claim_deadline_value" и "claim_deadline_trigger".

    Для "claim_deadline_value":
    - только сам срок без объяснений;
    - примеры: "10 дней", "30 календарных дней", "6 месяцев", "1 год";
    - если сроков несколько для разных требований:
      "10 дней; 30 дней".

    Для "claim_deadline_trigger":
    - момент начала течения срока, если указан;
    - примеры: "с даты поставки", "с момента обнаружения недостатка",
      "с даты получения товара", "до обращения в суд";
    - если момент не указан: "не указано";
    - если claim_deadline_regime ≠ "contract_specified": оставь пустым.

    Если claim_deadline_regime ≠ "contract_specified":
    - claim_deadline_value = ""
    - claim_deadline_trigger = ""

    Шаг 5 — CLAIM DEADLINE DISPLAY

    Заполни поле "claim_deadline_display".

    Правила:
    - Коротко и понятно пользователю.
    - Если срок прямо установлен:
      * "Претензия: 30 дней с момента обнаружения недостатка"
      * "Иск: 6 месяцев с даты поставки"
      * "Претензия: 30 дней" (если момент не указан)
      * "Претензия: 10 дней; 30 дней" (если несколько сроков)
    - Если срок определяется законом:
      "Определяется применимым правом"
    - Если срок не установлен:
      "Срок не установлен"
    - Если определить нельзя:
      "Не удалось определить"

    Шаг 6 — USER-FACING SUMMARY

    Заполни поле "limitation_and_procedure_display".

    Строй display как:
    {досудебная процедура} + {срок если значимый}

    Примеры:
    - "Обязательная претензия; срок — 30 дней с даты поставки"
    - "Обязательная медиация; срок иска — 1 год"
    - "Досудебный порядок не предусмотрен; срок давности по закону"
    - "Досудебный порядок не предусмотрен; срок не установлен"
    - "Не удалось определить"

    Правила:
    - Если procedure = "not_mandatory" и deadline = "not_specified":
      "Досудебный порядок не предусмотрен; срок не установлен"
    - Если оба unclear:
      "Не удалось определить"
    - Приоритизируй наиболее actionable для юриста информацию.

    Шаг 7 — ОБОСНОВАНИЕ

    Заполни поле "reason".

    Правила:
    - 1–2 коротких предложения.
    - Укажи: есть ли обязательная досудебная процедура,
      есть ли договорный срок и какой он.
    - Приведи ключевую фразу из текста в кавычках.
    - Не пиши длинный анализ и не оценивай риск.
    </instructions>

    <edge_cases>
    - Претензия обязательна и есть срок ожидания до суда:
      * pre_claim_procedure_status = "mandatory"

    - Переговоры только рекомендательные ("shall endeavour"):
      * pre_claim_procedure_status = "not_mandatory"
      * pre_claim_procedure_value = "Рекомендательный
        переговорный порядок"

    - Обязательный досудебный порядок, но срок претензии
      не установлен:
      * pre_claim_procedure_status = "mandatory"
      * claim_deadline_regime = "not_specified"
      * claim_deadline_display = "Срок не установлен"

    - Договор прямо говорит "срок определяется законом":
      * claim_deadline_regime = "applicable_law_reference"
      * claim_deadline_value = ""
      * claim_deadline_trigger = ""
      * claim_deadline_display = "Определяется применимым правом"

    - Срок обращения с иском ("no claim shall be brought after..."):
      * claim_deadline_regime = "contract_specified"
      (это тоже contract_specified)

    - Нет релевантных положений:
      * pre_claim_procedure_status = "not_mandatory"
      * pre_claim_procedure_value = "Не предусмотрена"
      * claim_deadline_regime = "not_specified"
      * claim_deadline_value = ""
      * claim_deadline_trigger = ""
      * claim_deadline_display = "Срок не установлен"
      * limitation_and_procedure_display =
        "Досудебный порядок не предусмотрен; срок не установлен"

    - Фрагменты нерелевантны или противоречивы:
      * pre_claim_procedure_status = "unclear"
      * pre_claim_procedure_value = "Не удалось определить"
      * claim_deadline_regime = "unclear"
      * claim_deadline_value = ""
      * claim_deadline_trigger = ""
      * claim_deadline_display = "Не удалось определить"
      * limitation_and_procedure_display = "Не удалось определить"
    </edge_cases>

    <output_expectations>
    Все значения должны быть короткими, точными и пригодными
    для отображения пользователю в DD Grid.
    Не добавляй никаких полей, кроме указанных в схеме extraction.
    </output_expectations>

  fields:
    - name: "limitation_and_procedure_display"
      type: "string"
      description: "Досудебный порядок и срок давности"

    - name: "pre_claim_procedure_status"
      type: "string"
      description: "Обязательность досудебной процедуры"
      allowed_values:
        - "mandatory"
        - "not_mandatory"
        - "unclear"

    - name: "pre_claim_procedure_value"
      type: "string"
      description: "Описание досудебной процедуры"

    - name: "claim_deadline_regime"
      type: "string"
      description: "Режим срока предъявления требования"
      allowed_values:
        - "contract_specified"
        - "applicable_law_reference"
        - "not_specified"
        - "unclear"

    - name: "claim_deadline_value"
      type: "string"
      description: "Конкретный срок (если установлен)"

    - name: "claim_deadline_trigger"
      type: "string"
      description: "Момент начала срока"

    - name: "claim_deadline_display"
      type: "string"
      description: "Срок предъявления требования для DD Grid"

    - name: "reason"
      type: "string"
      description: "Обоснование"

  store_payload: true


  