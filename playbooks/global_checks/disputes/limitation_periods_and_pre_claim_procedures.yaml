id: "limitation_periods_and_pre_claim_procedures"
name: "Сроки исковой давности и претензионные процедуры"
description: >
  Анализирует контрактные ограничения по срокам предъявления требований
  (contractual limitation periods, time bars), сокращённые сроки давности,
  а также детали обязательных претензионных/медиационных процедур
  (сроки, форма, последствия несоблюдения). Оценивает, насколько
  эти механизмы создают процессуальные барьеры для Target.
  Примечание: сам факт наличия обязательных досудебных шагов (yes/no)
  фиксируется чеком governing_law_and_forum; данный чек углублённо
  анализирует их детали и риски.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"

rules:
  keyword_mode: any

  keywords:
    high:
      # Contractual limitation periods — точные формулы
      - "(?i)limitation\\s+period"
      - "(?i)срок\\s+исковой\\s+давност[ьи]"
      - "(?i)time\\s+bar"
      - "(?i)time[-\\s]?barred"
      - "(?i)no\\s+claim\\s+shall\\s+be\\s+(brought|made|filed)"
      - "(?i)никакие\\s+претензи[ия]\\s+не\\s+могут\\s+быть\\s+предъявлен[ыа]"
      - "(?i)claims?\\s+must\\s+be\\s+(brought|filed|submitted)\\s+within"
      - "(?i)требовани[яе]\\s+должн[оыа]\\s+быть\\s+предъявлен[оыа]\\s+в\\s+течение"

      # Сокращение сроков давности
      - "(?i)shorten(ed|ing)?\\s+(the\\s+)?limitation"
      - "(?i)сокращ[её]нн[а-я]+\\s+срок[аи]?\\s+(исковой\\s+)?давност[ьи]"
      - "(?i)reduced\\s+limitation\\s+period"
      - "(?i)contractual\\s+limitation"

      # Жёсткие последствия пропуска
      - "(?i)forfeiture\\s+of\\s+(the\\s+)?(right|claim)"
      - "(?i)утрат[аы]\\s+прав[аы]?\\s+на\\s+(иск|требовани[ея])"
      - "(?i)shall\\s+be\\s+deemed\\s+(waived|forfeited|abandoned)"
      - "(?i)считается\\s+(отказом|утраченн[а-яо]+)"
      - "(?i)precluded\\s+from\\s+(bringing|filing|making)"

      # Обязательные досудебные процедуры — детальные
      - "(?i)mandatory\\s+(pre[-\\s]?claim|pre[-\\s]?trial)\\s+procedure"
      - "(?i)обязательн[а-я]+\\s+претензионн[а-я]+\\s+порядок"
      - "(?i)condition\\s+precedent\\s+to[\\s\\S]{0,30}(claim|action|suit|proceedings)"
      - "(?i)failure\\s+to\\s+(comply|follow)[\\s\\S]{0,40}(bar|preclude|forfeit)"

    medium:
      # Сроки — общие формулировки
      - "(?i)within\\s+\\d+\\s+(days?|months?|years?)"
      - "(?i)в\\s+течение\\s+\\d+\\s+(дней|месяц[а-я]*|лет|год[а-я]*)"
      - "(?i)не\\s+позднее\\s+\\d+\\s+(дней|месяц[а-я]*)"
      - "(?i)no\\s+later\\s+than\\s+\\d+\\s+(days?|months?)"
      - "(?i)expir(ation|y|es?)\\s+of[\\s\\S]{0,30}(period|term|срок)"
      - "(?i)истечени[ея]\\s+срок[аи]"

      # Претензионный порядок — общие маркеры
      - "(?i)претензионн[а-я]+\\s+порядок"
      - "(?i)pre[-\\s]?trial\\s+procedure"
      - "(?i)pre[-\\s]?claim\\s+procedure"
      - "(?i)claim\\s+notice"
      - "(?i)notice\\s+of\\s+claim"
      - "(?i)уведомлени[ея]\\s+о\\s+претензи[ия]"
      - "(?i)письменн[а-я]+\\s+претензи[яи]"
      - "(?i)written\\s+claim"

      # Медиация / cooling-off
      - "(?i)mandatory\\s+mediation"
      - "(?i)обязательн[а-я]+\\s+медиаци[яи]"
      - "(?i)cooling[-\\s]?off\\s+period"
      - "(?i)период\\s+ожидани[яи]"
      - "(?i)amicable\\s+(settlement|resolution)\\s+period"

      # Последствия без жёсткой санкции
      - "(?i)failure\\s+to\\s+(notify|give\\s+notice)"
      - "(?i)несоблюдени[ея]\\s+претензионн[а-я]+"

    low:
      # Общие ссылки на сроки и процедуры
      - "(?i)limitation"
      - "(?i)давност[ьи]"
      - "(?i)claim\\s+period"
      - "(?i)срок\\s+предъявлени[яи]"
      - "(?i)претензи[яи]"
      - "(?i)claim"
      - "(?i)notice"
      - "(?i)уведомлени[ея]"
      - "(?i)mediation"
      - "(?i)медиаци[яи]"
      - "(?i)dispute\\s+resolution\\s+procedure"
      - "(?i)процедур[аы]\\s+урегулировани[яи]"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 640

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  context_k: 5
  max_chunks: 10
  boost_keywords:
    - "limitation period"
    - "срок исковой давности"
    - "time bar"
    - "no claim shall be brought"
    - "claims must be brought within"
    - "требования должны быть предъявлены в течение"
    - "сокращённый срок давности"
    - "contractual limitation"
    - "претензионный порядок"
    - "pre-claim procedure"
    - "pre-trial procedure"
    - "mandatory mediation"
    - "обязательная медиация"
    - "cooling-off period"
    - "notice of claim"
    - "уведомление о претензии"
    - "письменная претензия"
    - "утрата права на иск"
    - "forfeiture of the right"
    - "condition precedent to claim"
    - "failure to comply"
  rerank: true
  filters: {}

conditional: null

extraction:
  enabled: true
  mode: "hybrid"
  llm_prompt_extraction: |
    <role>
    Ты — юрист по договорным спорам. Твоя задача — не оценивать риск, а точно извлечь из текста:
    1) есть ли между сторонами обязательная досудебная процедура;
    2) установлен ли в договоре срок предъявления претензии / требования / иска, и если да — какой именно.
    </role>

    <context>
    Ниже приведены релевантные фрагменты договора:

    {context}
    </context>

    <task>
    Заполни только поля, указанные в схеме extraction.

    Важно:
    - не придумывай сроки на основе закона;
    - не смешивай статус и значение в одном поле;
    - если договор отсылает к применимому праву, это отдельный результат, а не "срок не установлен";
    - пиши user-facing значения коротко, ясно и по-русски.
    </task>

    <instructions>
    Шаг 1 — ОПРЕДЕЛИ НАЛИЧИЕ ОБЯЗАТЕЛЬНОЙ ДОСУДЕБНОЙ ПРОЦЕДУРЫ
    Заполни поле "pre_claim_procedure_status".

    Правила:
    - "mandatory" — если договор прямо требует до обращения в суд/арбитраж:
      * направить претензию / written claim / notice of claim;
      * пройти обязательный срок ожидания / cooling-off period;
      * пройти обязательные переговоры / медиацию;
      * выполнить иной обязательный pre-claim step.
    - "not_mandatory" — если:
      * договор не содержит обязательной досудебной процедуры; или
      * формулировки носят рекомендательный/факультативный характер
        ("may", "shall endeavour", "стороны стремятся", "могут урегулировать").
    - "unclear" — если по фрагментам нельзя уверенно определить, обязательна ли процедура.

    Шаг 2 — КРАТКО ОПИШИ ДОСУДЕБНУЮ ПРОЦЕДУРУ
    Заполни поле "pre_claim_procedure_value".

    Правила:
    - Значение должно быть коротким и понятным пользователю.
    - Примеры:
      * "Обязательная письменная претензия"
      * "Обязательная претензия и 30-дневный срок урегулирования"
      * "Обязательная медиация перед обращением в арбитраж"
      * "Рекомендательный переговорный порядок"
      * "Не предусмотрена"
      * "Не удалось определить"
    - Если "pre_claim_procedure_status" = "not_mandatory" и обязательной процедуры нет, используй "Не предусмотрена".
    - Если процедура факультативная или рекомендательная, можно использовать
      "Рекомендательный переговорный порядок".
    - Если "pre_claim_procedure_status" = "unclear", используй "Не удалось определить".

    Шаг 3 — ОПРЕДЕЛИ РЕЖИМ СРОКА ПРЕДЪЯВЛЕНИЯ ПРЕТЕНЗИИ / ТРЕБОВАНИЯ / ИСКА
    Заполни поле "claim_deadline_regime".

    Под "claim deadline" понимай:
    - срок для направления претензии / claim notice / written claim;
    - срок для предъявления требования;
    - срок для обращения с иском / limitation period / time bar,
    если он прямо установлен договором.

    Правила:
    - "contract_specified" — если договор прямо устанавливает конкретный срок.
    - "applicable_law_reference" — если договор не называет конкретный срок, но прямо говорит,
      что срок определяется законом / применимым правом
      ("in accordance with applicable law", "as provided by law",
      "согласно законодательству", "в соответствии с применимым правом").
    - "not_specified" — если договор не устанавливает срок и не содержит прямой отсылки к закону.
    - "unclear" — если по фрагментам нельзя уверенно понять, есть срок или нет.

    Важно:
    - не выводи срок из общих норм права самостоятельно;
    - если в договоре есть и конкретный срок, и ссылка на закон, выбирай "contract_specified";
    - не считай обычные операционные уведомления сроком предъявления претензии, если они явно
      не связаны с претензией, требованием, спором или обращением в суд/арбитраж.

    Шаг 4 — ЕСЛИ СРОК ПРЯМО УСТАНОВЛЕН, ИЗВЛЕКИ ЕГО
    Заполни поля "claim_deadline_value" и "claim_deadline_trigger".

    Для "claim_deadline_value":
    - указывай только сам срок, без объяснений;
    - примеры: "10 дней", "30 календарных дней", "6 месяцев", "1 год";
    - если сроков несколько для разных видов претензий/требований, перечисли кратко через ";"
      в том же порядке, что и в тексте:
      "10 дней; 30 дней".

    Для "claim_deadline_trigger":
    - указывай момент начала течения срока, если он есть;
    - примеры: "с даты поставки", "с момента обнаружения недостатка",
      "с даты получения товара", "до обращения в суд";
    - если срок прямо установлен, но момент начала не указан, пиши "не указано";
    - если "claim_deadline_regime" не равен "contract_specified", оставь поле пустым.

    Если "claim_deadline_regime" не равен "contract_specified":
    - "claim_deadline_value" должно быть пустым;
    - "claim_deadline_trigger" должно быть пустым.

    Шаг 5 — СФОРМИРУЙ КОРОТКОЕ USER-FACING ПОЛЕ
    Заполни поле "claim_deadline_display".

    Правила:
    - Поле должно быть коротким и понятным пользователю.
    - Если срок прямо установлен:
      * для срока претензии используй формат:
        "Претензия: 30 дней с момента обнаружения недостатка"
      * для срока иска используй формат:
        "Иск: 6 месяцев с даты поставки"
      * если вид срока нейтральный или смешанный, можно использовать:
        "Требование: 30 дней с даты поставки"
      * если момент начала не указан:
        "Претензия: 30 дней"
    - Если срок определяется законом:
      "Определяется применимым правом"
    - Если срок не установлен:
      "Срок не установлен"
    - Если определить нельзя:
      "Не удалось определить"

    Если сроков несколько, отрази это коротко:
    - "Претензия: 10 дней по количеству; 30 дней по качеству"

    Шаг 6 — КРАТКО ОБОСНУЙ ВЫВОД
    Заполни поле "reason".

    Правила:
    - 1–3 коротких предложения;
    - укажи, есть ли обязательная досудебная процедура;
    - укажи, есть ли договорный срок и какой он;
    - приведи ключевую фразу из текста в кавычках;
    - не пиши длинный анализ и не оценивай риск.
    </instructions>

    <edge_cases>
    - Если договор требует направить претензию и выдержать срок ожидания до суда/арбитража,
      это "mandatory".

    - Если договор говорит только о переговорах в мягкой форме
      ("may", "shall endeavour", "стороны стремятся"), это "not_mandatory".

    - Если указан только обязательный досудебный порядок, но конкретный срок предъявления
      претензии / требования не установлен, тогда:
      * "pre_claim_procedure_status" = "mandatory"
      * "claim_deadline_regime" = "not_specified"
      если нет прямой отсылки к закону.

    - Если договор прямо говорит, что срок определяется законом / applicable law, тогда:
      * "claim_deadline_regime" = "applicable_law_reference"
      * "claim_deadline_value" = ""
      * "claim_deadline_trigger" = ""
      * "claim_deadline_display" = "Определяется применимым правом"

    - Если текст устанавливает срок обращения с иском
      ("no claim shall be brought within/after...", "limitation period", "time bar"),
      это тоже относится к "claim_deadline_regime = contract_specified".

    - Если фрагменты пустые, нерелевантные или противоречивые, и вывод сделать нельзя:
      * "pre_claim_procedure_status" = "unclear"
      * "pre_claim_procedure_value" = "Не удалось определить"
      * "claim_deadline_regime" = "unclear"
      * "claim_deadline_value" = ""
      * "claim_deadline_trigger" = ""
      * "claim_deadline_display" = "Не удалось определить"

    - Если релевантных положений нет:
      * "pre_claim_procedure_status" = "not_mandatory"
      * "pre_claim_procedure_value" = "Не предусмотрена"
      * "claim_deadline_regime" = "not_specified"
      * "claim_deadline_value" = ""
      * "claim_deadline_trigger" = ""
      * "claim_deadline_display" = "Срок не установлен"
    </edge_cases>

    <output_expectations>
    Верни значения строго в рамках схемы extraction.
    Все user-facing формулировки должны быть короткими, точными и удобными для отображения в DD Grid.
    </output_expectations>
  fields:
    - name: "pre_claim_procedure_status"
      type: "string"
      allowed_values:
        - "mandatory"
        - "not_mandatory"
        - "unclear"

    - name: "pre_claim_procedure_value"
      type: "string"

    - name: "claim_deadline_regime"
      type: "string"
      allowed_values:
        - "contract_specified"
        - "applicable_law_reference"
        - "not_specified"
        - "unclear"

    - name: "claim_deadline_value"
      type: "string"

    - name: "claim_deadline_trigger"
      type: "string"

    - name: "claim_deadline_display"
      type: "string"

    - name: "reason"
      type: "string"
  store_payload: true