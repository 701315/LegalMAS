id: "limitation_periods_and_pre_claim_procedures"
name: "Сроки исковой давности и претензионные процедуры"
group: "Governing law"
description: >
  Углублённый анализ обязательных досудебных процедур и договорных
  ограничений по срокам предъявления требований.

  Извлекает: обязательность и содержание досудебной процедуры
  (претензия / переговоры / медиация / cooling-off), режим срока
  предъявления требования / претензии / иска (договорный /
  по применимому праву / не установлен), конкретный срок и момент
  его начала.

  Верхнеуровневый факт наличия досудебного порядка (yes/no)
  фиксируется чеком governing_law_and_forum. Данный check
  анализирует детали и риски этих процедур.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"
ui_mode: "field_extraction"

rules:
  keyword_mode: any

  keywords:
    high:
      - "(?i)limitation\\s+period"
      - "(?i)срок\\s+исковой\\s+давност[ьи]"
      - "(?i)time\\s+bar"
      - "(?i)time[-\\s]?barred"
      - "(?i)no\\s+claim\\s+shall\\s+be\\s+(brought|made|filed)"
      - "(?i)никакие\\s+претензи[ия]\\s+не\\s+могут\\s+быть\\s+предъявлен[ыа]"
      - "(?i)claims?\\s+must\\s+be\\s+(brought|filed|submitted)\\s+within"
      - "(?i)требовани[яе]\\s+должн[оыа]\\s+быть\\s+предъявлен[оыа]\\s+в\\s+течение"
      - "(?i)shorten(ed|ing)?\\s+(the\\s+)?limitation"
      - "(?i)сокращ[её]нн[а-я]+\\s+срок[аи]?\\s+(исковой\\s+)?давност[ьи]"
      - "(?i)reduced\\s+limitation\\s+period"
      - "(?i)contractual\\s+limitation"
      - "(?i)forfeiture\\s+of\\s+(the\\s+)?(right|claim)"
      - "(?i)утрат[аы]\\s+прав[аы]?\\s+на\\s+(иск|требовани[ея])"
      - "(?i)shall\\s+be\\s+deemed\\s+(waived|forfeited|abandoned)"
      - "(?i)считается\\s+(отказом|утраченн[а-яо]+)"
      - "(?i)precluded\\s+from\\s+(bringing|filing|making)"
      - "(?i)mandatory\\s+(pre[-\\s]?claim|pre[-\\s]?trial)\\s+procedure"
      - "(?i)обязательн[а-я]+\\s+претензионн[а-я]+\\s+порядок"
      - "(?i)condition\\s+precedent\\s+to[\\s\\S]{0,30}(claim|action|suit|proceedings)"
      - "(?i)failure\\s+to\\s+(comply|follow)[\\s\\S]{0,40}(bar|preclude|forfeit)"

    medium:
      - "(?i)within\\s+\\d+\\s+(days?|months?|years?)[\\s\\S]{0,30}(claim|notice|pretenz)"
      - "(?i)в\\s+течение\\s+\\d+\\s+(дней|месяц[а-я]*|лет)[\\s\\S]{0,30}(претензи|требовани|обращени)"
      - "(?i)не\\s+позднее\\s+\\d+\\s+(дней|месяц[а-я]*)[\\s\\S]{0,30}(претензи|требовани)"
      - "(?i)no\\s+later\\s+than\\s+\\d+\\s+(days?|months?)[\\s\\S]{0,30}(claim|notice)"
      - "(?i)истечени[ея]\\s+срок[аи][\\s\\S]{0,30}(претензи|давност|требовани)"
      - "(?i)претензионн[а-я]+\\s+порядок"
      - "(?i)pre[-\\s]?trial\\s+procedure"
      - "(?i)pre[-\\s]?claim\\s+procedure"
      - "(?i)claim\\s+notice"
      - "(?i)notice\\s+of\\s+claim"
      - "(?i)уведомлени[ея]\\s+о\\s+претензи[ия]"
      - "(?i)письменн[а-я]+\\s+претензи[яи]"
      - "(?i)written\\s+claim"
      - "(?i)mandatory\\s+mediation"
      - "(?i)обязательн[а-я]+\\s+медиаци[яи]"
      - "(?i)cooling[-\\s]?off\\s+period"
      - "(?i)период\\s+ожидани[яи]"
      - "(?i)amicable\\s+(settlement|resolution)\\s+period"
      - "(?i)failure\\s+to\\s+(notify|give\\s+notice)[\\s\\S]{0,30}(bar|forfeit|preclude)"
      - "(?i)несоблюдени[ея]\\s+претензионн[а-я]+[\\s\\S]{0,30}(лишает|утрата|последствия)"

    low:
      - "(?i)contractual\\s+limitation"
      - "(?i)time\\s+bar"
      - "(?i)claim\\s+deadline"
      - "(?i)срок\\s+предъявлени[яи]\\s+(претензи|требовани|иска)"
      - "(?i)претензионн[а-я]+\\s+порядок"
      - "(?i)mandatory\\s+mediation"
      - "(?i)cooling[-\\s]?off"
      - "(?i)condition\\s+precedent"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 640

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  retrieval_profile: "dispute_resolution_check"
  context_k: 5
  max_chunks: 8

  retrieval_query: >
    срок исковой давности претензионный порядок обязательная претензия
    досудебная процедура limitation period time bar
    срок предъявления требования cooling-off медиация
    утрата права на иск condition precedent

  boost_keywords:
    - "срок исковой давности"
    - "limitation period"
    - "time bar"
    - "претензионный порядок"
    - "обязательная претензия"
    - "pre-claim procedure"
    - "condition precedent"
    - "срок предъявления требования"
    - "no claim shall be brought"
    - "cooling-off"
    - "обязательная медиация"
    - "утрата права на иск"

  negative_keywords:
    - "применимое право"
    - "governing law"
    - "арбитраж"
    - "подсудность"
    - "уступка прав"
    - "смена контроля"
    - "означает"
    - "в целях настоящего"

  preferred_unit_types:
    - "dispute_resolution"
    - "obligation"
    - "general_provision"

  excluded_unit_types:
    - "definition"
    - "structural_anchor"
    - "technical_fragment"
    - "appendix_reference"

  preferred_clause_functions:
    - "procedures"
    - "boilerplate"
    - "limitations"

  position_bias:
    preferred_range: [0.60, 1.00]
    boost: 0.35
    scope: "segment"

  rerank: true
  filters: {}

conditional: null

enrichment_hints:
  preferred_segment_types:
    - "contract"
    - "amendment"
  excluded_segment_types:
    - "technical_specification"
    - "price_list"
    - "invoice"
    - "act"
    - "schedule"
  confidence_bonus_on_match: 0.10
  confidence_penalty_on_excluded_segment: 0.20

extraction:
  enabled: true
  mode: "hybrid"
  llm_max_tokens: 1300

  # Presence gate: limitation_and_procedure_status агрегирует наличие
  # положений о досудебном порядке и/или сроке предъявления.
  # present -> pass, missing -> missing_required_clause.
  # Контракт: present + missing + unclear = allowed_values.
  presence_signal:
    field: "limitation_and_procedure_status"
    present_values: ["present"]
    missing_values: ["missing"]
    unclear_values: ["unclear"]

  llm_prompt_extraction: |
    <role>
    Ты — юрист по договорным спорам и досудебным процедурам.
    Твоя задача — точно извлечь из текста:
    1) есть ли обязательная досудебная процедура и её детали;
    2) установлен ли в договоре срок предъявления претензии /
       требования / иска, и если да — какой именно.

    КРИТИЧЕСКИ ВАЖНО:
    - Извлекай ТОЛЬКО то, что прямо написано в тексте.
    - НЕ придумывай сроки на основе общих норм закона.
    - НЕ считай обычные операционные уведомления
      (о поставке, приёмке, оплате) досудебной процедурой —
      досудебная процедура относится к спорам и претензиям.
    - Если тема досудебного порядка и срока предъявления в договоре
      вообще не раскрыта — для limitation_and_procedure_status ставь
      "missing", для pre_claim_procedure_status — "not_mandatory",
      для claim_deadline_regime — "not_specified".
    - Если текст неоднозначен — используй "unclear".
    </role>

    <context_rules>
    - Некоторые фрагменты могут быть нерелевантны — игнорируй их.
    - Если фрагменты противоречат друг другу — используй "unclear"
      и объясни это в reason.
    - Факультативные формулировки ("стороны стремятся",
      "may attempt", "shall endeavour") — это НЕ обязательная
      досудебная процедура, но это ЕСТЬ упоминание → влияет на
      limitation_and_procedure_status (present), не на
      pre_claim_procedure_status (not_mandatory).
    - Если договор отсылает к праву по вопросу сроков —
      это "applicable_law_reference", а не "not_specified".
    - Не используй внешние знания о законных сроках давности.
    - Не используй информацию из определений (definitions),
      преамбулы или приложений, если они не содержат
      substantive условий по теме check.
    - Если ни один фрагмент не содержит информации по теме —
      limitation_and_procedure_status = "missing",
      pre_claim_procedure_status = "not_mandatory",
      claim_deadline_regime = "not_specified",
      остальные поля — согласно Шагу 0, location = null у всех полей.
      Не использовать "unclear" при полном отсутствии релевантных
      фрагментов.
    </context_rules>

    <context>
    Ниже приведены релевантные фрагменты договора:

    {context}
    </context>

    <task>
    Заполни только следующие поля:
    - limitation_and_procedure_display
    - limitation_and_procedure_status
    - pre_claim_procedure_status
    - pre_claim_procedure_value
    - claim_deadline_regime
    - claim_deadline_value
    - claim_deadline_trigger
    - claim_deadline_display
    - reason

    Общие правила:
    - используй только то, что прямо следует из текста;
    - пиши коротко и по-русски.
    </task>

    <location_instructions>
    Для каждого поля по возможности укажи location в формате:
    {"clause_ref": "п. 13.4", "page": 16, "quote": "дословная фраза из договора"}

    Правила:
    - clause_ref — короткая ссылка на пункт / раздел / статью именно в том виде,
      как она написана в договоре;
    - page — целое число страницы;
    - quote — дословная фраза из текста договора (НЕ пересказ, НЕ парафраз),
      которая является источником значения поля. Копируй её посимвольно,
      сохраняя формулировку и порядок слов. Оптимальная длина: 30–300 символов.
      Примеры хорошего quote:
      * для claim_deadline_regime (contract_specified): "Никакие претензии по качеству товара не могут быть предъявлены по истечении 30 (тридцати) календарных дней с даты поставки";
      * для pre_claim_procedure_status (mandatory): "До обращения в суд Сторона обязана направить другой Стороне письменную претензию и выдержать 30-дневный срок для ответа".
    - не выдумывай location или quote;
    - если точную ссылку или дословную фразу определить нельзя,
      верни location = null;
    - для limitation_and_procedure_status, limitation_and_procedure_display,
      pre_claim_procedure_value, claim_deadline_display, reason
      location всегда null (синтезированы);
    - для claim_deadline_regime location всегда null
      (это режим, а не finding);
    - для pre_claim_procedure_status при значении "not_mandatory":
      * quote, если договор прямо говорит об отсутствии обязательной
        досудебной процедуры или о рекомендательном характере
        переговоров (например, "Стороны вправе обратиться в суд
        без соблюдения претензионного порядка");
      * location = null, если обязательная досудебная процедура
        просто не раскрыта в договоре;
    - для pre_claim_procedure_status при значении "unclear" —
      location = null;
    - для claim_deadline_value и claim_deadline_trigger location
      с quote особенно важна при claim_deadline_regime = "contract_specified";
    - если limitation_and_procedure_status = "missing" — для всех полей
      location = null.
    </location_instructions>

    <instructions>
    Шаг 0 — НАЛИЧИЕ ПОЛОЖЕНИЙ О ДОСУДЕБНОМ ПОРЯДКЕ И СРОКЕ

    Заполни "limitation_and_procedure_status".

    Значения:
    - "present" — договор содержит любое упоминание досудебного
      порядка (претензия, переговоры, медиация, cooling-off —
      включая факультативные формулировки) ИЛИ срока предъявления
      требования / иска (конкретного или через отсылку к закону).
    - "missing" — ни досудебного порядка, ни срока предъявления,
      ни отсылки к закону в договоре нет.
    - "unclear" — нельзя определить.

    Если limitation_and_procedure_status = "missing":
    - pre_claim_procedure_status = "not_mandatory"
    - pre_claim_procedure_value = "Не предусмотрена"
    - claim_deadline_regime = "not_specified"
    - claim_deadline_value = ""
    - claim_deadline_trigger = ""
    - claim_deadline_display = "Срок не установлен"
    - limitation_and_procedure_display =
      "Досудебный порядок не предусмотрен; срок не установлен"
    - reason = "Положения о досудебном порядке и сроке предъявления не обнаружены в представленных фрагментах."
    - для всех полей location = null
    - не выполняй Шаги 1–5; переходи к Шагу 6.

    Если limitation_and_procedure_status = "unclear":
    - pre_claim_procedure_status = "unclear"
    - pre_claim_procedure_value = "Не удалось определить"
    - claim_deadline_regime = "unclear"
    - claim_deadline_value = ""
    - claim_deadline_trigger = ""
    - claim_deadline_display = "Не удалось определить"
    - limitation_and_procedure_display = "Не удалось определить"
    - reason = "Формулировки присутствуют, но вывод надёжно сделать нельзя."
    - для всех полей location = null

    Если limitation_and_procedure_status = "present" — переходи к Шагам 1–5.

    Шаг 1 — ОБЯЗАТЕЛЬНОСТЬ ДОСУДЕБНОЙ ПРОЦЕДУРЫ

    Заполни "pre_claim_procedure_status".

    Значения:
    - "mandatory" — договор прямо требует до обращения
      в суд/арбитраж:
      * направить претензию / written claim / notice of claim;
      * выдержать срок ожидания / cooling-off;
      * пройти обязательные переговоры / медиацию;
      * выполнить иной обязательный pre-claim step.
    - "not_mandatory" — нет обязательной досудебной процедуры,
      либо формулировки факультативные.
    - "unclear" — невозможно уверенно определить обязательность.

    Шаг 2 — ОПИСАНИЕ ДОСУДЕБНОЙ ПРОЦЕДУРЫ

    Заполни "pre_claim_procedure_value".

    Правила:
    - Коротко и понятно.
    - Примеры:
      * "Обязательная письменная претензия"
      * "Обязательная претензия и 30-дневный срок урегулирования"
      * "Обязательная медиация перед арбитражем"
      * "Рекомендательный переговорный порядок"
      * "Не предусмотрена"
      * "Не удалось определить"
    - Если status = "not_mandatory" и процедуры нет:
      "Не предусмотрена".
    - Если факультативная:
      "Рекомендательный переговорный порядок".
    - Если status = "unclear":
      "Не удалось определить".

    Шаг 3 — РЕЖИМ СРОКА ПРЕДЪЯВЛЕНИЯ ПРЕТЕНЗИИ / ИСКА

    Заполни "claim_deadline_regime".

    Под "claim deadline" понимай:
    - срок для направления претензии / claim notice;
    - срок для предъявления требования;
    - срок для обращения с иском (time bar),
      если прямо установлен договором.

    Значения:
    - "contract_specified" — договор прямо устанавливает
      конкретный срок.
    - "applicable_law_reference" — договор не называет срок,
      но прямо отсылает к закону / применимому праву.
    - "not_specified" — срок не установлен и нет прямой отсылки.
    - "unclear" — невозможно определить.

    Важно:
    - не выводи срок из общих норм права;
    - если есть и конкретный срок, и ссылка на закон —
      выбирай "contract_specified".

    Шаг 4 — КОНКРЕТНЫЙ СРОК И МОМЕНТ ЕГО НАЧАЛА

    Заполни "claim_deadline_value" и "claim_deadline_trigger".

    Правила для claim_deadline_value:
    - Только сам срок без объяснений.
    - Примеры: "10 дней", "30 календарных дней",
      "6 месяцев", "1 год".
    - Если сроков несколько: "10 дней; 30 дней".
    - Если claim_deadline_regime ≠ "contract_specified": "".

    Правила для claim_deadline_trigger:
    - Момент начала течения срока, если указан.
    - Примеры: "с даты поставки", "с момента обнаружения
      недостатка", "с даты получения товара".
    - Если момент не указан: "не указано".
    - Если claim_deadline_regime ≠ "contract_specified": "".

    Шаг 5 — CLAIM DEADLINE DISPLAY

    Заполни "claim_deadline_display".

    Правила:
    - Если срок прямо установлен:
      * "Претензия: 30 дней с момента обнаружения недостатка"
      * "Иск: 6 месяцев с даты поставки"
      * "Претензия: 30 дней" (если момент не указан)
    - Если срок определяется законом:
      "Определяется применимым правом"
    - Если срок не установлен:
      "Срок не установлен"
    - Если определить нельзя:
      "Не удалось определить"

    Шаг 6 — НОРМАЛИЗОВАННЫЙ DISPLAY ДЛЯ DD GRID

    Заполни "limitation_and_procedure_display".

    Это итоговое поле для таблицы.
    Строй его ТОЛЬКО на основе уже заполненных полей выше.
    Не добавляй информацию сверх них.

    Возможные состояния:
    1. Конкретные данные:
       "Обязательная претензия; срок — 30 дней с даты поставки"
    2. Досудебный порядок есть, срок по закону:
       "Обязательная медиация; срок давности по закону"
    3. Ничего не предусмотрено:
       "Досудебный порядок не предусмотрен; срок не установлен"
    4. Не удалось определить:
       "Не удалось определить"

    Правила:
    - Если limitation_and_procedure_status = "missing":
      "Досудебный порядок не предусмотрен; срок не установлен"
    - Если limitation_and_procedure_status = "unclear":
      "Не удалось определить"
    - Если limitation_and_procedure_status = "present":
      начни с pre_claim_procedure_value (кратко)
      и добавь claim_deadline_display (кратко).
    - Не более 2–3 коротких фактов через ";".

    Шаг 7 — КРАТКОЕ ОБОСНОВАНИЕ

    Заполни "reason".

    Правила:
    - Первое предложение — краткий вывод.
    - Второе — короткая цитата из текста (до 100 символов).
    - Пиши по-русски.
    - Не оценивай процессуальный риск.
    </instructions>

    <edge_cases>
    - Претензия обязательна, срок ожидания указан:
      * limitation_and_procedure_status = "present"
      * pre_claim_procedure_status = "mandatory"
      * pre_claim_procedure_value =
        "Обязательная претензия и 30-дневный срок урегулирования"

    - Переговоры только рекомендательные:
      * limitation_and_procedure_status = "present"
      * pre_claim_procedure_status = "not_mandatory"
      * pre_claim_procedure_value =
        "Рекомендательный переговорный порядок"

    - Обязательный досудебный порядок, срок претензии не установлен:
      * limitation_and_procedure_status = "present"
      * pre_claim_procedure_status = "mandatory"
      * claim_deadline_regime = "not_specified"
      * claim_deadline_display = "Срок не установлен"

    - "Срок определяется законом":
      * limitation_and_procedure_status = "present"
      * claim_deadline_regime = "applicable_law_reference"
      * claim_deadline_value = ""
      * claim_deadline_trigger = ""
      * claim_deadline_display = "Определяется применимым правом"

    - "No claim shall be brought after 6 months":
      * limitation_and_procedure_status = "present"
      * claim_deadline_regime = "contract_specified"
      * claim_deadline_value = "6 месяцев"

    - Нет релевантных положений:
      * limitation_and_procedure_status = "missing"
      * pre_claim_procedure_status = "not_mandatory"
      * pre_claim_procedure_value = "Не предусмотрена"
      * claim_deadline_regime = "not_specified"
      * claim_deadline_value = ""
      * claim_deadline_trigger = ""
      * claim_deadline_display = "Срок не установлен"
      * limitation_and_procedure_display =
        "Досудебный порядок не предусмотрен; срок не установлен"

    - Фрагменты нерелевантны:
      * limitation_and_procedure_status = "unclear"
      * pre_claim_procedure_status = "unclear"
      * pre_claim_procedure_value = "Не удалось определить"
      * claim_deadline_regime = "unclear"
      * claim_deadline_value = ""
      * claim_deadline_trigger = ""
      * claim_deadline_display = "Не удалось определить"
      * limitation_and_procedure_display = "Не удалось определить"
    </edge_cases>

    <output_expectations>
    - Верни результат строго в формате JSON.
    - Не оборачивай ответ в markdown-блоки (без ```).
    - Не добавляй комментариев вне JSON.
    - Для полей с allowed_values используй строго значения из списка.
    - Свободные текстовые поля
      (limitation_and_procedure_display, pre_claim_procedure_value,
       claim_deadline_value, claim_deadline_trigger,
       claim_deadline_display, reason)
      заполняй на русском языке.
    - Не добавляй никаких полей, кроме указанных.
    - Для каждого поля возвращай объект с ключами
      "value", "confidence", "location".

    Пример структуры ответа:
    {
      "limitation_and_procedure_display": {"value": "Обязательная претензия; срок — 30 дней с даты поставки", "confidence": 0.95, "location": null},
      "limitation_and_procedure_status": {"value": "present", "confidence": 0.95, "location": null},
      "pre_claim_procedure_status": {"value": "mandatory", "confidence": 0.90, "location": null},
      "pre_claim_procedure_value": {"value": "Обязательная претензия и 30-дневный срок урегулирования", "confidence": 0.90, "location": null},
      "claim_deadline_regime": {"value": "contract_specified", "confidence": 0.92, "location": null},
      "claim_deadline_value": {"value": "30 дней", "confidence": 0.92, "location": {"clause_ref": "п. 13.4", "page": 16, "quote": "Никакие претензии по качеству товара не могут быть предъявлены по истечении 30 (тридцати) календарных дней с даты поставки"}},
      "claim_deadline_trigger": {"value": "с даты поставки", "confidence": 0.92, "location": {"clause_ref": "п. 13.4", "page": 16, "quote": "Никакие претензии по качеству товара не могут быть предъявлены по истечении 30 (тридцати) календарных дней с даты поставки"}},
      "claim_deadline_display": {"value": "Претензия: 30 дней с даты поставки", "confidence": 0.95, "location": null},
      "reason": {"value": "Договор устанавливает обязательный претензионный порядок и сокращённый 30-дневный срок предъявления претензий с даты поставки. «Никакие претензии ... не могут быть предъявлены по истечении 30 ... дней с даты поставки».", "confidence": 0.90, "location": null}
    }
    </output_expectations>

  fields:
    - name: "limitation_and_procedure_display"
      type: "string"
      presentation: "fact"
      label: "Досудебный порядок и срок давности"
      description: "Нормализованный user-facing вывод для DD Grid"
      display_in_grid: true
      display_priority: 1

    - name: "limitation_and_procedure_status"
      type: "string"
      presentation: "signal"
      risk_weight: "info"
      description: "Наличие положений о досудебном порядке и сроке предъявления"
      allowed_values:
        - "present"
        - "missing"
        - "unclear"
      display_in_grid: false

    - name: "pre_claim_procedure_status"
      type: "string"
      presentation: "signal"
      risk_weight: "medium"
      description: "Обязательность досудебной процедуры"
      allowed_values:
        - "mandatory"
        - "not_mandatory"
        - "unclear"
      display_in_grid: false

    - name: "pre_claim_procedure_value"
      type: "string"
      presentation: "fact"
      label: "Досудебная процедура"
      description: "Краткое описание досудебной процедуры"
      display_in_grid: true
      display_priority: 2

    - name: "claim_deadline_regime"
      type: "string"
      presentation: "signal"
      risk_weight: "high"
      description: "Режим срока предъявления требования"
      allowed_values:
        - "contract_specified"
        - "applicable_law_reference"
        - "not_specified"
        - "unclear"
      display_in_grid: false

    - name: "claim_deadline_value"
      type: "string"
      presentation: "fact"
      label: "Срок предъявления"
      description: "Конкретный срок (если установлен договором)"
      display_in_grid: false

    - name: "claim_deadline_trigger"
      type: "string"
      presentation: "fact"
      label: "Момент начала срока"
      description: "Момент начала течения срока"
      display_in_grid: false

    - name: "claim_deadline_display"
      type: "string"
      presentation: "fact"
      label: "Срок"
      description: "Срок предъявления требования для DD Grid"
      display_in_grid: true
      display_priority: 3

    - name: "reason"
      type: "string"
      presentation: "diagnostic"
      description: "Обоснование"
      display_in_grid: false

  store_payload: true


  