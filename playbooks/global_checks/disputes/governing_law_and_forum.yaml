id: "governing_law_and_forum"
name: "Применимое право и юрисдикция"
description: >
  Анализирует применимое право (governing law), договорную подсудность и/или
  арбитраж: место, институт, язык, а также общую предсказуемость и доступность
  форума для Target.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"

rules:
  keyword_mode: any

  keywords:
    high:
      # Английские формулы применимого права
      - "(?i)governed\\s+by\\s+the\\s+laws?\\s+of"
      - "(?i)governing\\s+law"
      - "(?i)this\\s+agreement[\\s\\S]{0,40}shall\\s+be\\s+governed"
      - "(?i)law\\s+of\\s+[A-Z][A-Za-z\\s]+"

      # Русские формулы применимого права
      - "(?i)настоящий[\\s\\S]{0,40}договор[\\s\\S]{0,40}(регулирует|регулируется)"
      - "(?i)применим[оа]\\s+право"
      - "(?i)подлежит\\s+регулировани[юя]"
      - "(?i)к\\s+данн(ому|ому\\s+договору)[\\s\\S]{0,40]применя[ею]тся\\s+законы"

      # Юрисдикция / подсудность
      - "(?i)exclusive\\s+jurisdiction"
      - "(?i)non[-\\s]?exclusive\\s+jurisdiction"
      - "(?i)мест[оа]\\s+рассмотрен[ияи]\\s+спор[аы]"
      - "(?i)подсудност[ьи]"
      - "(?i)споры[\\s\\S]{0,40}рассматрива[ею]тся[\\s\\S]{0,40}(суд|арбитраж)"

      # Арбитраж
      - "(?i)arbitration\\s+clause"
      - "(?i)arbitral\\s+tribunal"
      - "(?i)seat\\s+of\\s+arbitration"
      - "(?i)мест[оа]\\s+арбитраж[ауы]"
      - "(?i)арбитражн[а-я\\s]+суд"

    medium:
      # Общие ссылки на право/закон
      - "(?i)применим[оа]\\s+закон[ы]?"
      - "(?i)материал[ьн][оеая]\\s+право"
      - "(?i)substantive\\s+law"
      - "(?i)laws?\\s+of\\s+the\\s+Russian\\s+Federation"
      - "(?i)право\\s+Российской\\s+Федерац[ии]"
      - "(?i)право\\s+РФ"

      # Общие маркеры споров/юр. органов
      - "(?i)jurisdiction"
      - "(?i)forum"
      - "(?i)dispute\\s+resolution"
      - "(?i)settlement\\s+of\\s+disputes"
      - "(?i)разрешен[иеи]\\s+спор[аы]"
      - "(?i)разрешен[иеи]\\s+разноглас[ийия]"
      - "(?i)подведомственност[ьи]"

      # Арбитраж/суды без конкретики
      - "(?i)arbitration"
      - "(?i)arbitral"
      - "(?i)arbitration\\s+court"
      - "(?i)арбитраж"
      - "(?i)третейск[ийое]\\s+суд"
      - "(?i)коммерческ[ийое]\\s+арбитраж"

    low:
      # Общие ссылки на суды / инстанции
      - "(?i)суд[аеы]"
      - "(?i)court"
      - "(?i)tribunal"
      - "(?i)instance"
      - "(?i)competent\\s+court"
      - "(?i)компетентн[а-я\\s]+суд[ае]"

      # Общие ссылки на территорию / город (для форумов)
      - "(?i)city\\s+of\\s+[A-Z][A-Za-z\\s]+"
      - "(?i)город\\s+[А-ЯЁ][А-Яа-яЁё\\s]+"
      - "(?i)место\\s+нахождени[яия]\\s+суд[ае]"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 640

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  context_k: 5
  max_chunks: 10
  boost_keywords:
    - "governing law"
    - "governed by the laws of"
    - "настоящий договор регулируется"
    - "применимое право"
    - "exclusive jurisdiction"
    - "место рассмотрения споров"
    - "подсудность"
    - "arbitration"
    - "seat of arbitration"
  rerank: true
  filters: {}


conditional: null

extraction:
  llm_prompt_extraction: |
    <role>
    Ты — юрист по международным контрактам и разрешению споров.
    Твоя специализация — анализ оговорок о применимом праве и юрисдикции
    в коммерческих договорах (суды/арбитраж).
    </role>

    <context>
    Ниже приведены фрагменты договора с положениями о применимом праве
    и/или юрисдикции:

    {context}
    </context>

    <instructions>
    Проведи анализ по шагам. Каждый шаг логически соответствует одному
    или нескольким полям итоговой оценки риска.

    Шаг 1 — ПРИМЕНИМОЕ ПРАВО (GOVERNING LAW)
    (используется для заполнения поля "governing_law"):
    - Определи, какое право прямо выбрано в качестве применимого
      (например: "право Российской Федерации", "laws of England and Wales").
    - Если выбор права сформулирован косвенно или неоднозначно, опиши это.
    - Если в доступных фрагментах нет упоминаний применимого права,
      укажи в анализе, что выбор права не прослеживается.

    Шаг 2 — ФОРУМ ДЛЯ РАЗРЕШЕНИЯ СПОРОВ
    (используется для заполнения полей "dispute_resolution_forum"
     и "forum_description"):
    - Определи, какой форум установлен:
      * государственный суд (какой страны/города),
      * арбитраж (какой институт, место арбитража (seat), язык),
      * смешанная или альтернативная конструкция.
    - Кратко опиши форум в свободной форме (страна/город, институт,
      ключевые детали).

    Шаг 3 — ТИП ЮРИСДИКЦИОННОЙ ОГОВОРКИ
    (используется для заполнения поля "jurisdiction_clause_type"):
    - Определи, является ли выбор форума эксклюзивным или неэксклюзивным.
      Признаки эксклюзивности: формулировки об "исключительной подсудности",
      запрет обращения в иные суды/арбитражи.
      Признаки неэксклюзивности: формулировки "may be brought", "also have
      the right to", отсутствие запрета иных форумов.
    - Если из текста это невозможно определить, зафиксируй неопределённость
      в своём анализе.

    Шаг 4 — УДОБСТВО/ПРЕДСКАЗУЕМОСТЬ ФОРУМА ДЛЯ TARGET
    (используется для заполнения поля "forum_convenience_for_target"):
    - Оцени, насколько выбранный форум процессуально удобен и предсказуем
      для Target:
      * high — предсказуемый и доступный форум (юрисдикция присутствия Target,
        понятная практика, отсутствие очевидных барьеров).
      * medium — нейтральный/сбалансированный форум с отдельными нюансами.
      * low — фактически неудобный/дорогой/малодоступный форум, возможные
        трудности признания/исполнения.
      * unclear — недостаточно данных для оценки.
    - Опираться нужно только на фактические признаки из текста, не придумывай
      внешние юридические факты.

    Шаг 5 — ИТОГОВЫЙ УРОВЕНЬ РИСКА
    (используется для формирования "overall_risk_level" и "reason"):
    - Оцени общий уровень риска для Target с учётом сочетания применимого права,
      выбранного форума и их удобства для Target.
    - Сформулируй итоговый риск как low / medium / high.
    - Обоснуй вывод конкретными формулировками из фрагментов (желательно
      с короткими цитатами в кавычках).
    - Если в разных фрагментах противоречивые оговорки (например, суд и арбитраж,
      разные governing law), явно опиши противоречие и не занижай риск ниже "medium".
    </instructions>

    <edge_cases>
    Обрабатывай пограничные ситуации так:

    - Нет явного указания применимого права:
      в анализе явно зафиксируй отсутствие выбора права и свяжи это
      с повышенной неопределённостью.

    - Есть выбор суда, но нет указания применимого права:
      сосредоточься на описании форума и потенциальных рисков, связанных
      с неопределённостью governing law.

    - Общая формулировка "споры разрешаются в судах [страны]" без указания
      эксклюзивности:
      относись к типу оговорки как к неопределённому, пока текст не даёт
      явных признаков эксклюзивности.

    - Указан только арбитраж без подробностей (институт/seat/язык не ясны):
      сделай акцент на неопределённости форума и возможных процессуальных рисках.

    - Пустые или явно нерелевантные фрагменты:
      в анализе укажи, что данных недостаточно для оценки применимого права
      и форума, и объясни, что это само по себе создаёт неопределённость.
    </edge_cases>

    <output_expectations>
    На основе твоего анализа отдельный механизм извлечения сформирует
    структурированные поля по заранее заданной схеме. Твоя задача —
    давать чёткие юридические выводы и указывать конкретные формулировки
    из текста, на которых они основаны.
    </output_expectations>

  enabled: true
  mode: "hybrid"
  fields:
    - name: "governing_law"
      type: "string"

    - name: "dispute_resolution_forum"
      type: "string"
      allowed_values:
        - "court"
        - "arbitration"
        - "mixed"
        - "unclear"

    - name: "forum_description"
      type: "string"

    - name: "jurisdiction_clause_type"
      type: "string"
      allowed_values:
        - "exclusive"
        - "non-exclusive"
        - "unclear"

    - name: "forum_convenience_for_target"
      type: "string"
      allowed_values:
        - "low"
        - "medium"
        - "high"
        - "unclear"

    - name: "overall_risk_level"
      type: "string"
      allowed_values:
        - "low"
        - "medium"
        - "high"

    - name: "reason"
      type: "string"
  store_payload: true

red_flags:
  items:
    - code: "LAW1"
      description: "Форум в юрисдикции с высокой политической/правовой неопределённостью и без реального доступа для Target."
    - code: "LAW2"
      description: "Неясная или противоречивая юрисдикционная/арбитражная оговорка."
