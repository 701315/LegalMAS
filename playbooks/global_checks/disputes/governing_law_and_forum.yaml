id: "governing_law_and_forum"
name: "Применимое право и юрисдикция"
description: >
  Анализирует применимое право (governing law), договорную подсудность и/или
  арбитраж: место, институт, язык, а также общую предсказуемость и доступность
  форума для Target.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"

rules:
  keywords:
    - "governed by"
    - "governing law"
    - "настоящий договор регулируется"
    - "применимое право"
    - "подлежит регулированию"
    - "jurisdiction"
    - "exclusive jurisdiction"
    - "non-exclusive jurisdiction"
    - "место рассмотрения споров"
    - "подсудность"
    - "forum"
    - "арбитраж"
    - "arbitration"
    - "arbitral tribunal"
    - "seat of arbitration"
  keyword_mode: "any"
  regex_patterns: []
  clause_patterns: []

llm:
  prompt_template: |
    <role>
    Ты — юрист по международным контрактам и разрешению споров.
    Твоя специализация — анализ оговорок о применимом праве и юрисдикции
    в коммерческих договорах (суды/арбитраж).
    </role>

    <context>
    Ниже приведены фрагменты договора с положениями о применимом праве
    и/или юрисдикции:

    {context}
    </context>

    <instructions>
    Проведи анализ строго по следующим шагам:

    Шаг 1 — ПРИМЕНИМОЕ ПРАВО (GOVERNING LAW):
    - Определи, какое право прямо выбрано в качестве применимого
      (например: "право Российской Федерации", "laws of England and Wales").
    - Если выбор права сформулирован косвенно или неоднозначно — опиши это.
    - Если в фрагментах нет упоминаний применимого права — установи
      governing_law = "unclear".

    Шаг 2 — ФОРУМ ДЛЯ РАЗРЕШЕНИЯ СПОРОВ:
    - Определи, какой форум установлен:
      * государственный суд (какой страны/города),
      * арбитраж (какой институт, место арбитража (seat), язык).
    - Кратко опиши форум в свободной форме (forum_description).

    Шаг 3 — ТИП ЮРИСДИКЦИОННОЙ ОГОВОРКИ:
    - Определи, является ли выбор форума эксклюзивным или неэксклюзивным.
      Примеры:
      * exclusive — "исключительная подсудность", "any dispute shall be submitted exclusively to..."
      * non-exclusive — "may be brought", "also have the right to", без запрета других форумов.
    - Если из текста это невозможно определить — установи jurisdiction_clause_type = "unclear".

    Шаг 4 — УДОБСТВО/ПРЕДСКАЗУЕМОСТЬ ФОРУМА ДЛЯ TARGET:
    - Оцени forum_convenience_for_target как:
      * high — предсказуемый и доступный форум для Target (юрисдикция присутствия, понятная практика).
      * medium — нейтральный/смешанный форум, есть нюансы, но нет явной враждебности.
      * low — фактически неудобный/дорогой/малодоступный форум, сложность признания/исполнения.
      * unclear — недостаточно данных для оценки.
    - Опираться нужно на фактические признаки из текста, не придумывай юридические факты.

    Шаг 5 — ИТОГОВЫЙ УРОВЕНЬ РИСКА:
    - Определи overall_risk_level: low / medium / high.
    - Учитывай сочетание применимого права, выбранного форума и удобства для Target.
    - Обоснуй вывод в поле "reason" с указанием конкретных формулировок из фрагментов.

    Если разные фрагменты противоречат друг другу (например, один говорит о суде,
    другой — об арбитраже, или разные формулировки governing law) — не усредняй.
    Отрази противоречия в "reason" и установи риск не ниже "medium".
    </instructions>

    <edge_cases>
    ВАЖНО — как обрабатывать пограничные ситуации:

    — В тексте нет явного указания применимого права:
      governing_law = "unclear".

    — Есть выбор суда, но нет явного указания применимого права:
      dispute_resolution_forum = "court",
      jurisdiction_clause_type = "unclear" (если неясно exclusive/non-exclusive).

    — Есть общая формулировка "споры разрешаются в судах [страны]",
      но не уточнена эксклюзивность:
      jurisdiction_clause_type = "unclear".

    — Указан только арбитраж без подробностей (институт/seat/язык непонятны):
      dispute_resolution_forum = "arbitration", forum_description описывает
      неопределённость, forum_convenience_for_target = "unclear".

    — Пустые или нерелевантные фрагменты:
      все поля = "unclear" или null, overall_risk_level = "medium",
      reason = "Недостаточно данных для анализа применимого права и форума".
    </edge_cases>

    <examples>
    ПРИМЕР 1 — НИЗКИЙ РИСК:

    Фрагмент: "Настоящий Договор регулируется и толкуется в соответствии
    с правом Англии и Уэльса. Все споры подлежат окончательному рассмотрению
    в Лондонском международном арбитражном суде (LCIA), местом арбитража
    является Лондон, язык арбитража — английский."

    {{
      "governing_law": "laws of England and Wales",
      "dispute_resolution_forum": "arbitration",
      "forum_description": "LCIA, место арбитража Лондон, язык английский",
      "jurisdiction_clause_type": "exclusive",
      "forum_convenience_for_target": "medium",
      "overall_risk_level": "low",
      "reason": "Прямо выбрано право Англии и Уэльса и арбитраж LCIA с местом в Лондоне. Форум предсказуем и широко применим, риски в основном коммерческие, а не процессуальные."
    }}

    ПРИМЕР 2 — ВЫСОКИЙ РИСК:

    Фрагмент: "Настоящий Договор регулируется правом Государства X.
    Все споры подлежат рассмотрению исключительно судами города Y
    Государства X. Стороны отказываются от права обращаться в какие-либо
    иные суды или арбитраж."

    {{
      "governing_law": "право Государства X",
      "dispute_resolution_forum": "court",
      "forum_description": "исключительная подсудность судам города Y Государства X",
      "jurisdiction_clause_type": "exclusive",
      "forum_convenience_for_target": "low",
      "overall_risk_level": "high",
      "reason": "Выбран малодоступный для Target форум в Государстве X с эксклюзивной подсудностью и отказом от альтернативных форумов, что создаёт значительные процессуальные риски."
    }}

    ПРИМЕР 3 — НЕОПРЕДЕЛЁННОСТЬ (MEDIUM):

    Фрагмент: "Споры, возникающие из настоящего Договора, подлежат
    рассмотрению в компетентных судах по месту нахождения Ответчика."

    {{
      "governing_law": "unclear",
      "dispute_resolution_forum": "court",
      "forum_description": "суды по месту нахождения Ответчика, без указания страны/города",
      "jurisdiction_clause_type": "unclear",
      "forum_convenience_for_target": "medium",
      "overall_risk_level": "medium",
      "reason": "Форум указан привязкой к месту нахождения Ответчика без выбора права и без чёткой эксклюзивности, что создаёт неопределённость по месту рассмотрения споров."
    }}
    </examples>

    <output_format>
    Твой ответ ДОЛЖЕН быть строго валидным JSON-объектом со следующими
    полями:

    {{
      "governing_law": "string — указание применимого права либо 'unclear'",
      "dispute_resolution_forum": "one of: court | arbitration | mixed | unclear",
      "forum_description": "string — краткое описание выбранного суда/арбитража, места и института",
      "jurisdiction_clause_type": "one of: exclusive | non-exclusive | unclear",
      "forum_convenience_for_target": "one of: low | medium | high | unclear",
      "overall_risk_level": "one of: low | medium | high",
      "reason": "string — конкретное объяснение на русском с отсылкой к формулировкам из фрагментов"
    }}

    Все перечисленные поля ДОЛЖНЫ присутствовать в JSON, даже если их значение равно null.
    </output_format>

    <constraints>
    ЖЁСТКИЕ ПРАВИЛА:
    1. Выведи ТОЛЬКО один JSON-объект. Никакого текста до или после.
    2. Не пиши "Вот JSON", "Here is the JSON" и т.п.
    3. Не используй Markdown, бэктики ``` или любые обёртки.
    4. Все строки — в двойных кавычках.
    5. Значения перечислимых полей — СТРОГО из указанных вариантов.
    6. Ключи — точно как указано, без добавления новых.
    7. Поле "reason" ДОЛЖНО содержать конкретные факты из фрагментов,
       а не общие фразы вроде "есть риски". Желательно включать короткие
       цитаты из текста в кавычках.
    8. Начни ответ сразу с символа {{
    9. Если по какому‑то полю нет достаточно информации в тексте —
       верни для него null или 'unclear' (для полей, где это явно
       предусмотрено). НЕ придумывай значения, не интерполируй,
       не используй формулировки вроде "не указано", "N/A", "не найдено".
    </constraints>
  prompt_file: null
  context_k: 5
  temperature: 0.0
  max_tokens: 640

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  context_k: 5
  max_chunks: 10
  boost_keywords:
    - "governing law"
    - "настоящий договор регулируется"
    - "exclusive jurisdiction"
    - "место рассмотрения споров"
    - "arbitration"
  rerank: true
  filters: {}

conditional: null

extraction:
  enabled: true
  mode: "hybrid"
  fields:
    - name: "governing_law"
      type: "string"
      regex_patterns:
        - "(?i)governed by\\s+([^\\.;\\n]+)"
        - "(?i)настоящий договор регулируется\\s+([^\\.;\\n]+)"
        - "(?i)применим(?:ым|ое) прав(?:о|ом)\\s+([^\\.;\\n]+)"

    - name: "dispute_resolution_forum"
      type: "string"
      allowed_values:
        - "court"
        - "arbitration"
        - "mixed"
        - "unclear"
      keyword_hints:
        - "arbitration"
        - "arbitral tribunal"
        - "арбитраж"
        - "арбитражный суд"
        - "государственный суд"
        - "courts"
        - "competent courts"

    - name: "forum_description"
      type: "string"
      regex_patterns:
        # EN: "submitted to the exclusive jurisdiction of the courts of London, England"
        - "(?i)(courts? of [^\\.;\\n]+)"
        # RU: "судами города Москвы", "арбитражным судом г. Москвы"
        - "(?i)(судами? [^\\.;\\n]+)"
        - "(?i)(арбитражн(?:ым|ого) суд(?:а|ом) [^\\.;\\n]+)"

    - name: "jurisdiction_clause_type"
      type: "string"
      allowed_values:
        - "exclusive"
        - "non-exclusive"
        - "unclear"
      keyword_hints:
        - "exclusive jurisdiction"
        - "исключительная подсудность"
        - "non-exclusive jurisdiction"
        - "неисключительная подсудность"
        - "may be brought"
        - "also have the right to"

    - name: "forum_convenience_for_target"
      type: "string"
      allowed_values:
        - "low"
        - "medium"
        - "high"
        - "unclear"

    - name: "overall_risk_level"
      type: "string"
      allowed_values:
        - "low"
        - "medium"
        - "high"

    - name: "reason"
      type: "string"
  store_payload: true


red_flags:
  items:
    - code: "LAW1"
      description: "Форум в юрисдикции с высокой политической/правовой неопределённостью и без реального доступа для Target."
    - code: "LAW2"
      description: "Неясная или противоречивая юрисдикционная/арбитражная оговорка."