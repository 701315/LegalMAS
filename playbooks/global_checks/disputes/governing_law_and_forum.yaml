id: "governing_law_and_forum"
name: "Применимое право и юрисдикция"
description: >
  Анализирует применимое право (governing law) и форум разрешения
  споров (государственный суд или арбитражный институт).

  Извлекает: юрисдикцию применимого права (короткое название
  правопорядка), форум разрешения споров (конкретный суд /
  арбитражный институт / место арбитража).

  Также фиксирует верхнеуровневый факт наличия обязательной
  досудебной процедуры (претензия / переговоры / медиация)
  как routing-сигнал для детального анализа в чеке
  limitation_periods_and_pre_claim_procedures.

  Процедурные детали арбитража (seat, язык, количество арбитров,
  interim measures, конфликт оговорок) анализируются отдельным
  чеком dispute_resolution_procedure_details.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"
ui_mode: "field_extraction"

rules:
  keyword_mode: any

  keywords:
    high:
      # Применимое право — английские формулы
      - "(?i)governed\\s+by\\s+the\\s+laws?\\s+of"
      - "(?i)governing\\s+law"
      - "(?i)this\\s+agreement[\\s\\S]{0,40}shall\\s+be\\s+governed"
      - "(?i)law\\s+of\\s+[A-Z][A-Za-z\\s]+"

      # Применимое право — русские формулы
      - "(?i)настоящий[\\s\\S]{0,40}договор[\\s\\S]{0,40}(регулирует|регулируется)"
      - "(?i)применим[оа]\\s+право"
      - "(?i)подлежит\\s+регулировани[юя]"
      - "(?i)к\\s+данн(ому|ому\\s+договору)[\\s\\S]{0,40}применя[ею]тся\\s+законы"
      - "(?i)подлежат\\s+толкованию\\s+и\\s+регулированию"
      - "(?i)в\\s+соответствии\\s+с\\s+законодательством[\\s\\S]{0,30}(РФ|России|Российской)"

      # Юрисдикция / подсудность
      - "(?i)exclusive\\s+jurisdiction"
      - "(?i)non[-\\s]?exclusive\\s+jurisdiction"
      - "(?i)мест[оа]\\s+рассмотрен[ияи]\\s+спор[аы]"
      - "(?i)подсудност[ьи]"
      - "(?i)споры[\\s\\S]{0,40}рассматрива[ею]тся[\\s\\S]{0,40}(суд|арбитраж)"
      - "(?i)передается\\s+на\\s+рассмотрение"
      - "(?i)споры\\s+и\\s+разногласия[\\s\\S]{0,40}(суд|арбитраж)"

      # Арбитраж — выбор форума
      - "(?i)arbitration\\s+clause"
      - "(?i)arbitral\\s+tribunal"
      - "(?i)арбитражн[а-я]+\\s+суд"
      - "(?i)\\bМКАС\\b"
      - "(?i)\\bICC\\s+arbitration\\b"
      - "(?i)\\bLCIA\\b"
      - "(?i)арбитражный\\s+суд\\s+города"

      # Обязательные досудебные процедуры
      - "(?i)pre[-\\s]?arbitration\\s+procedure"
      - "(?i)mandatory\\s+pre[-\\s]?trial\\s+procedure"
      - "(?i)condition\\s+precedent"
      - "(?i)обязательн[а-я]+\\s+досудебн[а-я]+\\s+порядок"
      - "(?i)обязательн[а-я]+\\s+претензионн[а-я]+\\s+порядок"
      - "(?i)услови[ея]\\s+предварительн[а-я]+\\s+урегулировани[я]"

    medium:
      # Ссылки на право/закон
      - "(?i)применим[оа]\\s+закон[ы]?"
      - "(?i)материальн[оеая]\\s+право"
      - "(?i)substantive\\s+law"
      - "(?i)laws?\\s+of\\s+the\\s+Russian\\s+Federation"
      - "(?i)право\\s+Российской\\s+Федерац[ии]"
      - "(?i)право\\s+РФ"

      # Маркеры споров / органов
      - "(?i)jurisdiction"
      - "(?i)dispute\\s+resolution"
      - "(?i)settlement\\s+of\\s+disputes"
      - "(?i)разрешен[иеи]\\s+спор[аы]"
      - "(?i)разрешен[иеи]\\s+разноглас[ийия]"
      - "(?i)подведомственност[ьи]"

      # Арбитраж/суды — общие
      - "(?i)arbitration"
      - "(?i)arbitral"
      - "(?i)арбитраж"
      - "(?i)третейск[ийое]\\s+суд"
      - "(?i)коммерческ[ийое]\\s+арбитраж"

      # Досудебные процедуры
      - "(?i)claim\\s+procedure"
      - "(?i)pre[-\\s]?trial\\s+procedure"
      - "(?i)претензи[яи]\\s+до\\s+обращени[яи]\\s+в\\s+суд"
      - "(?i)попытк[аи]\\s+урегулировать\\s+спор"
      - "(?i)переговор[ыа]\\s+по\\s+урегулированию"
      - "(?i)mediation"
      - "(?i)amicable\\s+settlement"

    low:
      - "(?i)governing\\s+law"
      - "(?i)применимое\\s+право"
      - "(?i)dispute\\s+resolution\\s+procedure"
      - "(?i)процедур[аы]\\s+урегулировани[яи]\\s+споров"
      - "(?i)competent\\s+court"
      - "(?i)компетентн[а-я]+\\s+суд[ае]"
      - "(?i)место\\s+нахождени[яия]\\s+суд[ае]"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 640

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  context_k: 5
  max_chunks: 10
  boost_keywords:
    - "governing law"
    - "governed by the laws of"
    - "настоящий договор регулируется"
    - "применимое право"
    - "подлежит регулированию"
    - "подлежат толкованию и регулированию"
    - "в соответствии с законодательством"
    - "exclusive jurisdiction"
    - "место рассмотрения споров"
    - "подсудность"
    - "arbitration"
    - "арбитраж"
    - "арбитражный суд"
    - "МКАС"
    - "ICC arbitration"
    - "LCIA"
    - "споры и разногласия"
    - "передается на рассмотрение"
    - "pre-arbitration procedure"
    - "mandatory pre-trial"
    - "обязательный претензионный порядок"
    - "досудебный порядок"
    - "mediation"
    - "право Российской Федерации"
    - "laws of the Russian Federation"
    - "dispute resolution"
    - "разрешение споров"
  rerank: true
  filters: {}

conditional: null

enrichment_hints:
  preferred_segment_types:
    - "contract"
    - "amendment"
  excluded_segment_types:
    - "technical_specification"
    - "price_list"
    - "invoice"
    - "act"
    - "schedule"
  preferred_clause_functions:
    - "governing_law"
    - "dispute_resolution"
    - "jurisdiction"
    - "arbitration"
  confidence_bonus_on_match: 0.10
  confidence_penalty_on_excluded_segment: 0.20

extraction:
  enabled: true
  mode: "hybrid"
  llm_max_tokens: 450
  llm_prompt_extraction: |
    <role>
    Ты — юрист по международным контрактам и разрешению споров.
    Твоя задача — извлечь из текста договора:
    1) применимое право;
    2) форум разрешения споров;
    3) верхнеуровневый факт наличия обязательной досудебной процедуры.
    </role>

    <context>
    Ниже приведены релевантные фрагменты договора:

    {context}
    </context>

    <task>
    Заполни только следующие поля:
    - governing_law_and_forum_display
    - governing_law_status
    - governing_law_value
    - dispute_forum_status
    - dispute_forum_value
    - pre_claim_procedure_present
    - reason

    Важно:
    - используй только то, что прямо следует из текста;
    - не делай вывод о праве или форуме по косвенным признакам:
      языку договора, валюте, месту подписания, адресам сторон,
      месту исполнения;
    - не смешивай применимое право и форум — это разные вещи;
    - если значение отсутствует, для *_value возвращай пустую строку;
    - пиши user-facing значения коротко и по-русски.
    </task>

    <instructions>
    Шаг 1 — ОПРЕДЕЛИ ПРИМЕНИМОЕ ПРАВО

    Заполни поля "governing_law_status" и "governing_law_value".

    Значения для governing_law_status:
    - "present" — договор прямо указывает применимое право.
    - "missing" — положения о применимом праве нет.
    - "unclear" — есть ссылка на закон без конкретной юрисдикции,
      либо положения противоречат друг другу.

    Правила для governing_law_value:
    - Возвращай короткое юридически точное название правопорядка.
    - Примеры:
      * "РФ"
      * "Англия и Уэльс"
      * "Швейцария"
      * "Германия"
      * "Штат Нью-Йорк, США"
      * "Делавэр, США"
    - Не возвращай длинные фразы:
      * вместо "настоящее соглашение регулируется правом РФ" → "РФ"
      * вместо "the laws of the State of New York" → "Штат Нью-Йорк, США"
    - Не своди "England and Wales" к "Великобритания".
    - Не своди "State of New York" к "США".
    - Если только "applicable law" / "relevant law" без юрисдикции:
      * governing_law_status = "unclear"
      * governing_law_value = ""

    Шаг 2 — ОПРЕДЕЛИ ФОРУМ РАЗРЕШЕНИЯ СПОРОВ

    Заполни поля "dispute_forum_status" и "dispute_forum_value".

    Под forum понимай:
    - конкретный государственный суд;
    - систему судов определённой юрисдикции;
    - арбитражный институт или арбитраж как механизм.

    Значения для dispute_forum_status:
    - "present" — форум прямо указан.
    - "missing" — форум не указан.
    - "unclear" — формулировка неполная или противоречивая.

    Правила для dispute_forum_value:
    - Возвращай короткое user-facing название форума.
    - Примеры:
      * "Арбитражный суд г. Москвы"
      * "Арбитражный суд СПб и ЛО"
      * "Суды Англии и Уэльса"
      * "Суд штата Калифорния"
      * "МКАС при ТПП РФ"
      * "ICC arbitration"
      * "LCIA arbitration"
      * "Компетентный суд по месту нахождения ответчика"
    - Не путай форум с seat, language, number of arbitrators,
      procedural rules, interim measures.
    - Если институт назван прямо — возвращай именно институт.
    - Если институт не назван, но выбран арбитраж:
      * "Арбитраж" или "Арбитраж в Лондоне" по контексту.
    - Если несколько форумов — перечисли через " / ".

    Шаг 3 — НАЛИЧИЕ ОБЯЗАТЕЛЬНОЙ ДОСУДЕБНОЙ ПРОЦЕДУРЫ

    Заполни поле "pre_claim_procedure_present".

    Это routing-поле верхнего уровня.
    Детальный анализ выполняется чеком
    limitation_periods_and_pre_claim_procedures.

    Значения:
    - "yes" — договор прямо требует досудебного шага
      (претензия, обязательные переговоры, медиация,
      cooling-off period) перед обращением в суд/арбитраж.
    - "no" — обязательной досудебной процедуры нет.
    - "unclear" — невозможно определить.

    Шаг 4 — USER-FACING SUMMARY

    Заполни поле "governing_law_and_forum_display".

    Строй display как:
    {применимое право} + {форум} + {досудебный порядок если есть}

    Примеры:
    - "Применимое право: РФ; Форум: Арбитражный суд г. Москвы"
    - "Применимое право: Англия и Уэльс;
       Форум: LCIA arbitration; досудебный порядок предусмотрен"
    - "Применимое право: РФ; Форум: не указан"
    - "Применимое право: не указано; Форум: МКАС при ТПП РФ"
    - "Применимое право: не указано; Форум: не указан"
    - "Не удалось определить применимое право и форум"

    Правила:
    - Если governing_law_status = "present": "Применимое право: {value}"
    - Если governing_law_status = "missing": "Применимое право: не указано"
    - Если governing_law_status = "unclear": "Применимое право: не удалось определить"
    - Если dispute_forum_status = "present": "Форум: {value}"
    - Если dispute_forum_status = "missing": "Форум: не указан"
    - Если dispute_forum_status = "unclear": "Форум: не удалось определить"
    - Если pre_claim_procedure_present = "yes": добавь "; досудебный порядок предусмотрен"

    Шаг 5 — ОБОСНОВАНИЕ

    Заполни поле "reason".

    Правила:
    - 1–2 коротких предложения.
    - Укажи отдельно вывод по применимому праву и по форуму.
    - Приведи краткую цитату из текста в кавычках.
    - Не анализируй:
      * exclusive / non-exclusive nature;
      * seat, language, number of arbitrators;
      * детали досудебного порядка.
    </instructions>

    <edge_cases>
    - Применимое право указано, форум не указан:
      * governing_law_status = "present"
      * dispute_forum_status = "missing"
      * display: "Применимое право: РФ; Форум: не указан"

    - Форум указан, право не указано:
      * dispute_forum_status = "present"
      * governing_law_status = "missing"

    - Только "applicable law" / "according to law" без юрисдикции:
      * governing_law_status = "unclear"
      * governing_law_value = ""

    - Несовместимые положения о праве или форуме:
      * соответствующий status = "unclear"
      * соответствующий value = ""

    - "Courts of England and Wales" — forum present,
      даже без полного официального наименования суда.

    - "Seat of arbitration shall be London" с явным выбором арбитража:
      * dispute_forum_status = "present"
      * dispute_forum_value = "Арбитраж в Лондоне"
      (не извлекать language, состав арбитров, procedural details)

    - Нет релевантных фрагментов:
      * governing_law_status = "missing"
      * governing_law_value = ""
      * dispute_forum_status = "missing"
      * dispute_forum_value = ""
      * pre_claim_procedure_present = "unclear"
    </edge_cases>

    <output_expectations>
    Все значения должны быть короткими, точными и пригодными
    для отображения пользователю в DD Grid.
    Не добавляй никаких полей, кроме указанных в схеме extraction.
    </output_expectations>

  fields:
    - name: "governing_law_and_forum_display"
      type: "string"
      description: "Применимое право и форум"

    - name: "governing_law_status"
      type: "string"
      description: "Наличие применимого права"
      allowed_values:
        - "present"
        - "missing"
        - "unclear"

    - name: "governing_law_value"
      type: "string"
      description: "Применимое право (короткое название)"

    - name: "dispute_forum_status"
      type: "string"
      description: "Наличие форума разрешения споров"
      allowed_values:
        - "present"
        - "missing"
        - "unclear"

    - name: "dispute_forum_value"
      type: "string"
      description: "Форум разрешения споров"

    - name: "pre_claim_procedure_present"
      type: "string"
      description: "Обязательная досудебная процедура (routing)"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "reason"
      type: "string"
      description: "Обоснование"

  store_payload: true

  

  