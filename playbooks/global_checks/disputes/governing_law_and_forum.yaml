id: "governing_law_and_forum"
name: "Применимое право и юрисдикция"
description: >
  Анализирует применимое право (governing law), договорную подсудность и/или
  арбитраж (на уровне общего выбора форума), а также наличие обязательных
  досудебных шагов (претензий, переговоров, медиации) перед обращением
  в суд/арбитраж. Процедурные детали арбитража (seat, язык, количество
  арбитров, interim measures, court support, конфликт оговорок) анализируются
  отдельным чеком dispute_resolution_procedure_details.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"

rules:
  keyword_mode: any

  keywords:
    high:
      # Английские формулы применимого права
      - "(?i)governed\\s+by\\s+the\\s+laws?\\s+of"
      - "(?i)governing\\s+law"
      - "(?i)this\\s+agreement[\\s\\S]{0,40}shall\\s+be\\s+governed"
      - "(?i)law\\s+of\\s+[A-Z][A-Za-z\\s]+"

      # Русские формулы применимого права
      - "(?i)настоящий[\\s\\S]{0,40}договор[\\s\\S]{0,40}(регулирует|регулируется)"
      - "(?i)применим[оа]\\s+право"
      - "(?i)подлежит\\s+регулировани[юя]"
      - "(?i)к\\s+данн(ому|ому\\s+договору)[\\s\\S]{0,40}применя[ею]тся\\s+законы"

      # Юрисдикция / подсудность
      - "(?i)exclusive\\s+jurisdiction"
      - "(?i)non[-\\s]?exclusive\\s+jurisdiction"
      - "(?i)мест[оа]\\s+рассмотрен[ияи]\\s+спор[аы]"
      - "(?i)подсудност[ьи]"
      - "(?i)споры[\\s\\S]{0,40}рассматрива[ею]тся[\\s\\S]{0,40}(суд|арбитраж)"

      # Арбитраж (общий выбор форума)
      - "(?i)arbitration\\s+clause"
      - "(?i)arbitral\\s+tribunal"
      - "(?i)арбитражн[а-я\\s]+суд"

      # Обязательные досудебные процедуры (high)
      - "(?i)pre[-\\s]?arbitration\\s+procedure"
      - "(?i)mandatory\\s+pre[-\\s]?trial\\s+procedure"
      - "(?i)condition\\s+precedent"
      - "(?i)обязательн[а-я\\s]+досудебн[а-я\\s]+порядок"
      - "(?i)обязательн[а-я\\s]+претензионн[а-я\\s]+порядок"
      - "(?i)услови[ея]\\s+предварительн[а-я\\s]+урегулировани[я]"

    medium:
      # Общие ссылки на право/закон
      - "(?i)применим[оа]\\s+закон[ы]?"
      - "(?i)материал[ьн][оеая]\\s+право"
      - "(?i)substantive\\s+law"
      - "(?i)laws?\\s+of\\s+the\\s+Russian\\s+Federation"
      - "(?i)право\\s+Российской\\s+Федерац[ии]"
      - "(?i)право\\s+РФ"

      # Общие маркеры споров/юр. органов
      - "(?i)jurisdiction"
      - "(?i)forum"
      - "(?i)dispute\\s+resolution"
      - "(?i)settlement\\s+of\\s+disputes"
      - "(?i)разрешен[иеи]\\s+спор[аы]"
      - "(?i)разрешен[иеи]\\s+разноглас[ийия]"
      - "(?i)подведомственност[ьи]"

      # Арбитраж/суды без конкретики
      - "(?i)arbitration"
      - "(?i)arbitral"
      - "(?i)arbitration\\s+court"
      - "(?i)арбитраж"
      - "(?i)третейск[ийое]\\s+суд"
      - "(?i)коммерческ[ийое]\\s+арбитраж"

      # Досудебные процедуры (medium)
      - "(?i)claim\\s+procedure"
      - "(?i)pre[-\\s]?trial\\s+procedure"
      - "(?i)претензи[яи]\\s+до\\s+обращени[яи]\\s+в\\s+суд"
      - "(?i)попытк[аи]\\s+урегулировать\\s+спор"
      - "(?i)переговор[ыа]\\s+по\\s+урегулированию"
      - "(?i)mediation"
      - "(?i)amicable\\s+settlement"

    low:
      # Общие ссылки на суды / инстанции
      - "(?i)суд[аеы]"
      - "(?i)court"
      - "(?i)tribunal"
      - "(?i)instance"
      - "(?i)competent\\s+court"
      - "(?i)компетентн[а-я\\s]+суд[ае]"

      # Общие ссылки на территорию / город (для форумов)
      - "(?i)city\\s+of\\s+[A-Z][A-Za-z\\s]+"
      - "(?i)город\\s+[А-ЯЁ][А-Яа-яЁё\\s]+"
      - "(?i)место\\s+нахождени[яия]\\s+суд[ае]"

      # Общие формулировки процедур урегулирования (low)
      - "(?i)dispute\\s+resolution\\s+procedure"
      - "(?i)procedure\\s+for\\s+settlement\\s+of\\s+disputes"
      - "(?i)процедур[аы]\\s+урегулировани[яи]\\s+споров"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 640

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  context_k: 5
  max_chunks: 10
  boost_keywords:
    - "governing law"
    - "governed by the laws of"
    - "настоящий договор регулируется"
    - "применимое право"
    - "exclusive jurisdiction"
    - "место рассмотрения споров"
    - "подсудность"
    - "arbitration"
    - "арбитраж"
    - "pre-arbitration procedure"
    - "mandatory pre-trial"
    - "обязательный претензионный порядок"
    - "досудебный порядок"
    - "mediation"
    - "право Российской Федерации"
    - "laws of the Russian Federation"
    - "dispute resolution"
    - "разрешение споров"
  rerank: true
  filters: {}

conditional: null

extraction:
  llm_prompt_extraction: |
    <role>
    Ты — юрист по международным контрактам и разрешению споров.
    Твоя специализация — анализ оговорок о применимом праве,
    юрисдикции (суды/арбитраж) и обязательных досудебных процедур
    (претензии, переговоры, медиация) в коммерческих договорах.
    </role>

    <context>
    Ниже приведены фрагменты договора с положениями о применимом праве,
    юрисдикции/арбитраже и/или досудебных шагах по урегулированию споров:

    {context}
    </context>

    <instructions>
    Проведи анализ по шагам. Каждый шаг логически соответствует одному
    или нескольким полям итоговой оценки риска.

    Шаг 1 — ПРИМЕНИМОЕ ПРАВО (GOVERNING LAW)
    (используется для заполнения поля "governing_law"):
    - Определи, какое право прямо выбрано в качестве применимого
      (например: "право Российской Федерации", "laws of England
      and Wales", "Swiss law").
    - Если выбор права сформулирован косвенно или неоднозначно —
      опиши это и укажи наиболее вероятное толкование.
    - Если в доступных фрагментах нет упоминаний применимого права —
      зафиксируй отсутствие выбора права.

    Шаг 2 — ФОРУМ ДЛЯ РАЗРЕШЕНИЯ СПОРОВ
    (используется для заполнения поля "dispute_resolution_forum"):
    - Определи, какой форум установлен:
      * государственный суд (какой страны/города),
      * арбитраж (какой институт, если указан),
      * смешанная или альтернативная конструкция.
    - Кратко опиши форум в свободной форме (страна/город, институт,
      ключевые детали).
    - Примечание: детальный анализ арбитражной процедуры (seat, язык,
      количество арбитров, court support, конфликт оговорок)
      выполняется отдельным чеком. Здесь достаточно определить
      тип форума и его общую характеристику.

    Шаг 3 — ТИП ЮРИСДИКЦИОННОЙ ОГОВОРКИ
    (используется для заполнения поля "jurisdiction_clause_type"):
    - Определи, является ли выбор форума эксклюзивным
      или неэксклюзивным.
      Признаки эксклюзивности: формулировки об «исключительной
      подсудности», «exclusive jurisdiction», запрет обращения
      в иные суды/арбитражи.
      Признаки неэксклюзивности: формулировки «may be brought»,
      «also have the right to», отсутствие запрета иных форумов.
    - Если из текста это невозможно определить — укажи "unclear".

    Шаг 4 — ОБЯЗАТЕЛЬНЫЕ ДОСУДЕБНЫЕ ШАГИ
    (используется для заполнения поля "mandatory_pre_dispute_steps_present"):
    - Определи, есть ли в договоре обязательные шаги до обращения
      в суд/арбитраж: претензионный порядок, обязательные переговоры,
      обязательная медиация или многоступенчатая схема.
    - Если из формулировок ясно, что такая процедура является
      условием (condition precedent) для обращения в суд/арбитраж —
      укажи "yes".
    - Если из текста следует, что обязательного досудебного порядка
      нет — укажи "no".
    - Если текст допускает двойное толкование или описывает лишь
      рекомендательные шаги («стороны стремятся», «may discuss»,
      «shall endeavour») — укажи "unclear" и отрази это в reason.

    Шаг 5 — RED FLAGS
    (используется для заполнения поля "red_flags"):
    Присвой один или несколько кодов из списка ниже.
    Если ни один код не применим — верни "NONE".
    Если данных недостаточно или они противоречивы — верни "UNCLEAR".

    Коды:
    • LAW1 — Применимое право и/или форум находятся вне России
      (для российского контрагента). Примеры: суды Англии, право
      Швейцарии, арбитраж в Стокгольме и т.п.
    • LAW2 — Несоответствие применимого права и форума: например,
      применимое право — российское, но форум — иностранный суд
      (или наоборот), что создаёт коллизионную неопределённость
      и повышает расходы.
    • LAW3 — Отсутствие явного выбора применимого права, что
      создаёт неопределённость в отношении правового режима
      договора.

    Формат ответа: коды через запятую без комментариев
    (например: "LAW1" или "LAW1, LAW3").
    Вся аргументация — в поле reason.

    Шаг 6 — ОБОСНОВАНИЕ
    (используется для заполнения поля "reason"):
    - Кратко обоснуй итоговую оценку, опираясь на ключевые
      формулировки из текста (с цитатами в кавычках).
    - Укажи, какие элементы повышают или снижают риски для Target.
    - Если были выставлены red_flags — объясни причину каждого кода.
    - Если red_flags = "NONE" — укажи, почему оговорка
      оценивается положительно.
    </instructions>

    <edge_cases>
    Обрабатывай пограничные ситуации так:

    - Нет явного указания применимого права:
      зафиксируй LAW3; в reason объясни, что отсутствие выбора
      права создаёт неопределённость правового режима договора
      и может привести к коллизионным спорам.

    - Есть выбор суда, но нет указания применимого права:
      сосредоточься на описании форума; зафиксируй LAW3;
      отрази потенциальные риски неопределённости governing law.

    - Применимое право и форум в разных юрисдикциях:
      зафиксируй LAW2; в reason объясни, какие практические
      проблемы это создаёт (разные правовые традиции, расходы
      на специалистов по иностранному праву и т.п.).

    - Общая формулировка «споры разрешаются в судах [страны]»
      без указания эксклюзивности:
      jurisdiction_clause_type = "unclear"; в reason укажи,
      что текст не даёт явных признаков эксклюзивности.

    - Указан только арбитраж без подробностей (институт/seat/язык
      не ясны):
      на уровне данного чека достаточно зафиксировать
      dispute_resolution_forum = "arbitration" и кратко описать
      то, что известно; подробности — в чеке
      dispute_resolution_procedure_details.

    - Досудебная процедура описана в рекомендательных
      формулировках («стороны стремятся», «may discuss»,
      «shall endeavour»):
      mandatory_pre_dispute_steps_present = "unclear";
      в reason явно зафиксируй рекомендательный характер.

    - Пустые или явно нерелевантные фрагменты:
      укажи, что данных недостаточно для оценки применимого права,
      форума и досудебных шагов; в red_flags верни "UNCLEAR";
      в reason объясни, что отсутствие данных само по себе
      создаёт неопределённость.
    </edge_cases>

    <output_expectations>
    На основе твоего анализа отдельный механизм извлечения сформирует
    структурированные поля по заранее заданной схеме. Твоя задача —
    давать чёткие юридические выводы и указывать конкретные
    формулировки из текста, на которых они основаны.
    </output_expectations>

  enabled: true
  mode: "hybrid"
  fields:
    - name: "governing_law"
      type: "string"

    - name: "dispute_resolution_forum"
      type: "string"
      allowed_values:
        - "court"
        - "arbitration"
        - "mixed"
        - "unclear"

    - name: "jurisdiction_clause_type"
      type: "string"
      allowed_values:
        - "exclusive"
        - "non-exclusive"
        - "unclear"

    - name: "mandatory_pre_dispute_steps_present"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "red_flags"
      type: "string"

    - name: "reason"
      type: "string"

  store_payload: true

red_flags:
  items:
    - code: "LAW1"
      description: >
        Применимое право и/или форум находятся вне России
        (для российского контрагента), что повышает расходы,
        снижает предсказуемость и может затруднить защиту
        интересов Target.
    - code: "LAW2"
      description: >
        Несоответствие применимого права и форума: право одной
        юрисдикции, форум — другой, что создаёт коллизионную
        неопределённость и повышает расходы на специалистов
        по иностранному праву.
    - code: "LAW3"
      description: >
        Отсутствие явного выбора применимого права, что создаёт
        неопределённость правового режима договора и может
        привести к коллизионным спорам.