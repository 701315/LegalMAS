id: "governing_law_and_forum"
name: "Применимое право и юрисдикция"
group: "Governing law"
description: >
  Анализирует применимое право (governing law) и форум разрешения
  споров (государственный суд или арбитражный институт).

  Извлекает: юрисдикцию применимого права (короткое название
  правопорядка), форум разрешения споров (конкретный суд /
  арбитражный институт / место арбитража).

  Также фиксирует верхнеуровневый факт наличия обязательной
  досудебной процедуры (претензия / переговоры / медиация)
  как routing-сигнал для детального анализа в чеке
  limitation_periods_and_pre_claim_procedures.

  Процедурные детали арбитража (seat, язык, количество арбитров,
  interim measures, конфликт оговорок) анализируются отдельным
  чеком dispute_resolution_procedure_details.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"
ui_mode: "field_extraction"

rules:
  keyword_mode: any

  keywords:
    high:
      - "(?i)governed\\s+by\\s+the\\s+laws?\\s+of"
      - "(?i)governing\\s+law"
      - "(?i)this\\s+agreement[\\s\\S]{0,40}shall\\s+be\\s+governed"
      - "(?i)law\\s+of\\s+[A-Z][A-Za-z\\s]+"
      - "(?i)настоящий[\\s\\S]{0,40}договор[\\s\\S]{0,40}(регулирует|регулируется)"
      - "(?i)применим[оа]\\s+право"
      - "(?i)подлежит\\s+регулировани[юя]"
      - "(?i)к\\s+данн(ому|ому\\s+договору)[\\s\\S]{0,40}применя[ею]тся\\s+законы"
      - "(?i)подлежат\\s+толкованию\\s+и\\s+регулированию"
      - "(?i)в\\s+соответствии\\s+с\\s+законодательством[\\s\\S]{0,30}(РФ|России|Российской)"
      - "(?i)exclusive\\s+jurisdiction"
      - "(?i)non[-\\s]?exclusive\\s+jurisdiction"
      - "(?i)мест[оа]\\s+рассмотрен[ияи]\\s+спор[аы]"
      - "(?i)подсудност[ьи]"
      - "(?i)споры[\\s\\S]{0,40}рассматрива[ею]тся[\\s\\S]{0,40}(суд|арбитраж)"
      - "(?i)передается\\s+на\\s+рассмотрение"
      - "(?i)споры\\s+и\\s+разногласия[\\s\\S]{0,40}(суд|арбитраж)"
      - "(?i)arbitration\\s+clause"
      - "(?i)arbitral\\s+tribunal"
      - "(?i)арбитражн[а-я]+\\s+суд"
      - "(?i)\\bМКАС\\b"
      - "(?i)\\bICC\\s+arbitration\\b"
      - "(?i)\\bLCIA\\b"
      - "(?i)арбитражный\\s+суд\\s+города"
      - "(?i)pre[-\\s]?arbitration\\s+procedure"
      - "(?i)mandatory\\s+pre[-\\s]?trial\\s+procedure"
      - "(?i)condition\\s+precedent"
      - "(?i)обязательн[а-я]+\\s+досудебн[а-я]+\\s+порядок"
      - "(?i)обязательн[а-я]+\\s+претензионн[а-я]+\\s+порядок"
      - "(?i)услови[ея]\\s+предварительн[а-я]+\\s+урегулировани[я]"

    medium:
      - "(?i)применим[оа]\\s+закон[ы]?"
      - "(?i)материальн[оеая]\\s+право"
      - "(?i)substantive\\s+law"
      - "(?i)laws?\\s+of\\s+the\\s+Russian\\s+Federation"
      - "(?i)право\\s+Российской\\s+Федерац[ии]"
      - "(?i)право\\s+РФ"
      - "(?i)jurisdiction"
      - "(?i)dispute\\s+resolution"
      - "(?i)settlement\\s+of\\s+disputes"
      - "(?i)разрешен[иеи]\\s+спор[аы]"
      - "(?i)разрешен[иеи]\\s+разноглас[ийия]"
      - "(?i)подведомственност[ьи]"
      - "(?i)arbitration"
      - "(?i)arbitral"
      - "(?i)арбитраж"
      - "(?i)третейск[ийое]\\s+суд"
      - "(?i)коммерческ[ийое]\\s+арбитраж"
      - "(?i)claim\\s+procedure"
      - "(?i)pre[-\\s]?trial\\s+procedure"
      - "(?i)претензи[яи]\\s+до\\s+обращени[яи]\\s+в\\s+суд"
      - "(?i)попытк[аи]\\s+урегулировать\\s+спор"
      - "(?i)переговор[ыа]\\s+по\\s+урегулированию"
      - "(?i)mediation"
      - "(?i)amicable\\s+settlement"

    low:
      - "(?i)governing\\s+law"
      - "(?i)применимое\\s+право"
      - "(?i)dispute\\s+resolution\\s+procedure"
      - "(?i)процедур[аы]\\s+урегулировани[яи]\\s+споров"
      - "(?i)competent\\s+court"
      - "(?i)компетентн[а-я]+\\s+суд[ае]"
      - "(?i)место\\s+нахождени[яия]\\s+суд[ае]"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 640

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  retrieval_profile: "governing_law_check"
  context_k: 5
  max_chunks: 8

  retrieval_query: >
    применимое право governing law регулируется законодательством
    подсудность юрисдикция форум разрешения споров арбитраж
    МКАС ICC LCIA арбитражный суд досудебный порядок претензия

  boost_keywords:
    - "применимое право"
    - "governing law"
    - "governed by the laws of"
    - "регулируется законодательством"
    - "подсудность"
    - "exclusive jurisdiction"
    - "арбитражный суд"
    - "МКАС"
    - "ICC arbitration"
    - "LCIA"
    - "разрешение споров"
    - "dispute resolution"
    - "досудебный порядок"
    - "обязательный претензионный порядок"
    - "право Российской Федерации"

  negative_keywords:
    - "уступка прав"
    - "смена контроля"
    - "конфиденциальность"
    - "означает"
    - "в целях настоящего"

  preferred_unit_types:
    - "governing_law"
    - "jurisdiction"
    - "dispute_resolution"
    - "general_provision"

  excluded_unit_types:
    - "definition"
    - "structural_anchor"
    - "technical_fragment"
    - "appendix_reference"

  preferred_clause_functions:
    - "boilerplate"
    - "procedures"

  position_bias:
    preferred_range: [0.75, 1.00]
    boost: 0.50
    scope: "segment"

  rerank: true
  filters: {}

conditional: null

enrichment_hints:
  preferred_segment_types:
    - "contract"
    - "amendment"
  excluded_segment_types:
    - "technical_specification"
    - "price_list"
    - "invoice"
    - "act"
    - "schedule"
  confidence_bonus_on_match: 0.10
  confidence_penalty_on_excluded_segment: 0.20

extraction:
  enabled: true
  mode: "hybrid"
  # 8 полей × ~90 токенов (value+confidence+location+JSON overhead) ≈ 720.
  # С запасом 25% = 900. Берём 1100 с дополнительным запасом под длинный reason.
  llm_max_tokens: 1100
  # compact_output не задаём явно — авто-режим (None) корректно
  # определит что custom prompt уже управляет стилем вывода.
  llm_prompt_extraction: |
    <role>
    Ты — юрист по международным контрактам и разрешению споров.
    Твоя задача — извлечь из текста договора:
    1) применимое право;
    2) форум разрешения споров;
    3) верхнеуровневый факт наличия обязательной досудебной процедуры.

    Детальный анализ сроков и механики досудебного порядка
    выполняется отдельным чеком limitation_periods_and_pre_claim_procedures.
    Детали арбитражной процедуры (seat, язык, состав арбитров)
    выполняются отдельным чеком dispute_resolution_procedure_details.
    </role>

    <context>
    Ниже приведены релевантные фрагменты договора:

    {context}
    </context>

    <task>
    Заполни только следующие поля:
    - governing_law_and_forum_display
    - governing_law_status
    - governing_law_value
    - dispute_forum_status
    - dispute_forum_value
    - pre_claim_procedure_present
    - reason
    - evidence

    Важно:
    - используй только то, что прямо следует из текста;
    - не делай вывод о праве или форуме по косвенным признакам:
      языку договора, валюте, месту подписания, адресам сторон,
      месту исполнения;
    - не смешивай применимое право и форум;
    - если значение отсутствует, для *_value возвращай пустую строку;
    - пиши user-facing значения коротко и по-русски.
    </task>

    <location_instructions>
    Для каждого поля по возможности укажи location в формате:
    {"clause_ref": "п. 12.1", "page": 7}

    Правила:
    - clause_ref — короткая ссылка на пункт / раздел / статью именно в том виде,
      как она написана в договоре;
    - page — целое число страницы;
    - не выдумывай location;
    - если точную ссылку определить нельзя, верни location = null;
    - для governing_law_and_forum_display, reason и evidence location можно вернуть null;
    - для governing_law_value и dispute_forum_value location особенно важна;
    - для status-полей тоже можно вернуть location, если она очевидна из того же пункта.
    </location_instructions>

    <instructions>
    Шаг 1 — ПРИМЕНИМОЕ ПРАВО

    Заполни "governing_law_status" и "governing_law_value".

    Значения для governing_law_status:
    - "present" — договор прямо указывает применимое право.
    - "missing" — положения о применимом праве нет.
    - "unclear" — есть ссылка на закон без конкретной юрисдикции,
      либо положения противоречат друг другу.

    Правила для governing_law_value:
    - Короткое юридически точное название правопорядка.
    - Примеры: "РФ", "Англия и Уэльс", "Швейцария",
      "Штат Нью-Йорк, США", "Делавэр, США".
    - Не своди "England and Wales" → "Великобритания".
    - Не своди "State of New York" → "США".
    - Если только "applicable law" без юрисдикции:
      governing_law_status = "unclear", governing_law_value = "".

    Шаг 2 — ФОРУМ РАЗРЕШЕНИЯ СПОРОВ

    Заполни "dispute_forum_status" и "dispute_forum_value".

    Под forum понимай:
    - конкретный государственный суд;
    - систему судов определённой юрисдикции;
    - арбитражный институт или арбитраж как механизм.

    Значения для dispute_forum_status:
    - "present" — форум прямо указан.
    - "missing" — форум не указан.
    - "unclear" — формулировка неполная или противоречивая.

    Правила для dispute_forum_value:
    - Короткое user-facing название форума.
    - Примеры: "Арбитражный суд г. Москвы", "МКАС при ТПП РФ",
      "ICC arbitration", "LCIA arbitration",
      "Суды Англии и Уэльса", "Суд штата Калифорния".
    - Не путай форум с seat, language, составом арбитров.
    - Если несколько форумов — перечисли через " / ".
    - "Seat of arbitration shall be London" + явный выбор арбитража
      → dispute_forum_value = "Арбитраж в Лондоне".

    Шаг 3 — НАЛИЧИЕ ОБЯЗАТЕЛЬНОЙ ДОСУДЕБНОЙ ПРОЦЕДУРЫ

    Заполни "pre_claim_procedure_present".

    Это routing-сигнал верхнего уровня.
    Детальный анализ выполняется чеком
    limitation_periods_and_pre_claim_procedures.

    Значения:
    - "yes" — договор прямо требует досудебного шага
      (претензия, обязательные переговоры, медиация,
      cooling-off period) перед обращением в суд/арбитраж.
    - "no" — обязательной досудебной процедуры нет.
    - "unclear" — невозможно определить.

    Шаг 4 — НОРМАЛИЗОВАННЫЙ DISPLAY ДЛЯ DD GRID

    Заполни "governing_law_and_forum_display".

    Блок применимого права:
    - governing_law_status = "present":
      "Применимое право: {governing_law_value}"
    - governing_law_status = "missing":
      "Применимое право: не указано"
    - governing_law_status = "unclear":
      "Применимое право: не удалось определить"

    Блок форума:
    - dispute_forum_status = "present":
      "; Форум: {dispute_forum_value}"
    - dispute_forum_status = "missing":
      "; Форум: не указан"
    - dispute_forum_status = "unclear":
      "; Форум: не удалось определить"

    Досудебный порядок:
    - pre_claim_procedure_present = "yes":
      добавь "; досудебный порядок предусмотрен"

    Примеры:
    - "Применимое право: РФ; Форум: Арбитражный суд г. Москвы"
    - "Применимое право: Англия и Уэльс; Форум: LCIA arbitration; досудебный порядок предусмотрен"
    - "Применимое право: РФ; Форум: не указан"
    - "Применимое право: не указано; Форум: МКАС при ТПП РФ"
    - "Применимое право: не указано; Форум: не указан"

    Шаг 5 — КРАТКОЕ ОБОСНОВАНИЕ

    Заполни "reason".

    Правила:
    - 1–2 коротких предложения.
    - Укажи отдельно вывод по применимому праву и по форуму.
    - Приведи краткую цитату из текста в кавычках.
    - Не анализируй: exclusive / non-exclusive nature;
      seat, language, состав арбитров; детали досудебного порядка.

    Шаг 6 — СЛУЖЕБНОЕ ПОЛЕ EVIDENCE

    Заполни "evidence".

    Правила:
    - Это metadata-поле для трассировки опорных ссылок.
    - Верни value как массив объектов вида:
      {"field_name": "governing_law_value", "clause_ref": "п. 12.1", "page": 7}
    - field_name должен быть одним из:
      "governing_law_value", "dispute_forum_value", "pre_claim_procedure_present"
    - Включай только те поля, для которых ты точно определил ссылку на пункт.
    - Если выделить отдельные опорные ссылки нельзя, верни value = [].
    - Для самого поля evidence location верни null.
    </instructions>

    <edge_cases>
    - Применимое право указано, форум не указан:
      * governing_law_status = "present"
      * dispute_forum_status = "missing"
      * display: "Применимое право: РФ; Форум: не указан"

    - Форум указан, право не указано:
      * dispute_forum_status = "present"
      * governing_law_status = "missing"

    - Только "applicable law" без юрисдикции:
      * governing_law_status = "unclear"
      * governing_law_value = ""

    - Несовместимые положения:
      * соответствующий status = "unclear"
      * соответствующий value = ""

    - "Courts of England and Wales":
      * dispute_forum_status = "present"
      * dispute_forum_value = "Суды Англии и Уэльса"

    - Нет релевантных фрагментов:
      * governing_law_status = "missing", governing_law_value = ""
      * dispute_forum_status = "missing", dispute_forum_value = ""
      * pre_claim_procedure_present = "unclear"
      * evidence = []
    </edge_cases>

    <output_expectations>
    Все user-facing значения коротко и по-русски.
    Не добавляй никаких полей, кроме указанных в схеме extraction.
    Для каждого поля возвращай объект с ключами "value", "confidence", "location".
    </output_expectations>

  fields:
    - name: "governing_law_and_forum_display"
      type: "string"
      presentation: "fact"
      label: "Применимое право и форум"
      description: "Нормализованный user-facing вывод для DD Grid"

    - name: "governing_law_status"
      type: "string"
      presentation: "signal"
      description: "Наличие применимого права"
      allowed_values:
        - "present"
        - "missing"
        - "unclear"

    - name: "governing_law_value"
      type: "string"
      presentation: "fact"
      label: "Применимое право"
      description: "Применимое право (короткое название)"

    - name: "dispute_forum_status"
      type: "string"
      presentation: "signal"
      description: "Наличие форума разрешения споров"
      allowed_values:
        - "present"
        - "missing"
        - "unclear"

    - name: "dispute_forum_value"
      type: "string"
      presentation: "fact"
      label: "Форум"
      description: "Форум разрешения споров"

    - name: "pre_claim_procedure_present"
      type: "string"
      presentation: "signal"
      description: "Обязательная досудебная процедура (routing-сигнал)"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "reason"
      type: "string"
      presentation: "diagnostic"
      description: "Краткое обоснование вывода по применимому праву и форуму"

    - name: "evidence"
      type: "evidence_list"
      presentation: "diagnostic"
      role: "subgroup_metadata"
      description: "Список опорных ссылок по отдельным извлечённым полям"

  store_payload: true

  
