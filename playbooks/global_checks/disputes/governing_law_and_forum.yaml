id: "governing_law_and_forum"
name: "Применимое право и юрисдикция"
description: >
  Анализирует применимое право (governing law), договорную подсудность и/или
  арбитраж (на уровне общего выбора форума), а также наличие обязательных
  досудебных шагов (претензий, переговоров, медиации) перед обращением
  в суд/арбитраж. Процедурные детали арбитража (seat, язык, количество
  арбитров, interim measures, court support, конфликт оговорок) анализируются
  отдельным чеком dispute_resolution_procedure_details.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"

rules:
  keyword_mode: any

  keywords:
    high:
      # Английские формулы применимого права
      - "(?i)governed\\s+by\\s+the\\s+laws?\\s+of"
      - "(?i)governing\\s+law"
      - "(?i)this\\s+agreement[\\s\\S]{0,40}shall\\s+be\\s+governed"
      - "(?i)law\\s+of\\s+[A-Z][A-Za-z\\s]+"

      # Русские формулы применимого права
      - "(?i)настоящий[\\s\\S]{0,40}договор[\\s\\S]{0,40}(регулирует|регулируется)"
      - "(?i)применим[оа]\\s+право"
      - "(?i)подлежит\\s+регулировани[юя]"
      - "(?i)к\\s+данн(ому|ому\\s+договору)[\\s\\S]{0,40}применя[ею]тся\\s+законы"

      # Юрисдикция / подсудность
      - "(?i)exclusive\\s+jurisdiction"
      - "(?i)non[-\\s]?exclusive\\s+jurisdiction"
      - "(?i)мест[оа]\\s+рассмотрен[ияи]\\s+спор[аы]"
      - "(?i)подсудност[ьи]"
      - "(?i)споры[\\s\\S]{0,40}рассматрива[ею]тся[\\s\\S]{0,40}(суд|арбитраж)"

      # Арбитраж (общий выбор форума)
      - "(?i)arbitration\\s+clause"
      - "(?i)arbitral\\s+tribunal"
      - "(?i)арбитражн[а-я\\s]+суд"

      # Обязательные досудебные процедуры (high)
      - "(?i)pre[-\\s]?arbitration\\s+procedure"
      - "(?i)mandatory\\s+pre[-\\s]?trial\\s+procedure"
      - "(?i)condition\\s+precedent"
      - "(?i)обязательн[а-я\\s]+досудебн[а-я\\s]+порядок"
      - "(?i)обязательн[а-я\\s]+претензионн[а-я\\s]+порядок"
      - "(?i)услови[ея]\\s+предварительн[а-я\\s]+урегулировани[я]"

    medium:
      # Общие ссылки на право/закон
      - "(?i)применим[оа]\\s+закон[ы]?"
      - "(?i)материал[ьн][оеая]\\s+право"
      - "(?i)substantive\\s+law"
      - "(?i)laws?\\s+of\\s+the\\s+Russian\\s+Federation"
      - "(?i)право\\s+Российской\\s+Федерац[ии]"
      - "(?i)право\\s+РФ"

      # Общие маркеры споров/юр. органов
      - "(?i)jurisdiction"
      - "(?i)forum"
      - "(?i)dispute\\s+resolution"
      - "(?i)settlement\\s+of\\s+disputes"
      - "(?i)разрешен[иеи]\\s+спор[аы]"
      - "(?i)разрешен[иеи]\\s+разноглас[ийия]"
      - "(?i)подведомственност[ьи]"

      # Арбитраж/суды без конкретики
      - "(?i)arbitration"
      - "(?i)arbitral"
      - "(?i)arbitration\\s+court"
      - "(?i)арбитраж"
      - "(?i)третейск[ийое]\\s+суд"
      - "(?i)коммерческ[ийое]\\s+арбитраж"

      # Досудебные процедуры (medium)
      - "(?i)claim\\s+procedure"
      - "(?i)pre[-\\s]?trial\\s+procedure"
      - "(?i)претензи[яи]\\s+до\\s+обращени[яи]\\s+в\\s+суд"
      - "(?i)попытк[аи]\\s+урегулировать\\s+спор"
      - "(?i)переговор[ыа]\\s+по\\s+урегулированию"
      - "(?i)mediation"
      - "(?i)amicable\\s+settlement"

    low:
      # Общие ссылки на суды / инстанции
      - "(?i)суд[аеы]"
      - "(?i)court"
      - "(?i)tribunal"
      - "(?i)instance"
      - "(?i)competent\\s+court"
      - "(?i)компетентн[а-я\\s]+суд[ае]"

      # Общие ссылки на территорию / город (для форумов)
      - "(?i)city\\s+of\\s+[A-Z][A-Za-z\\s]+"
      - "(?i)город\\s+[А-ЯЁ][А-Яа-яЁё\\s]+"
      - "(?i)место\\s+нахождени[яия]\\s+суд[ае]"

      # Общие формулировки процедур урегулирования (low)
      - "(?i)dispute\\s+resolution\\s+procedure"
      - "(?i)procedure\\s+for\\s+settlement\\s+of\\s+disputes"
      - "(?i)процедур[аы]\\s+урегулировани[яи]\\s+споров"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 640

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  context_k: 5
  max_chunks: 10
  boost_keywords:
    - "governing law"
    - "governed by the laws of"
    - "настоящий договор регулируется"
    - "применимое право"
    - "exclusive jurisdiction"
    - "место рассмотрения споров"
    - "подсудность"
    - "arbitration"
    - "арбитраж"
    - "pre-arbitration procedure"
    - "mandatory pre-trial"
    - "обязательный претензионный порядок"
    - "досудебный порядок"
    - "mediation"
    - "право Российской Федерации"
    - "laws of the Russian Federation"
    - "dispute resolution"
    - "разрешение споров"
    - "подлежат толкованию и регулированию"   # <-- ДОБАВИТЬ
    - "в соответствии с законодательством"    # <-- ДОБАВИТЬ
    - "арбитражный суд"                       # <-- ДОБАВИТЬ
    - "споры и разногласия"                   # <-- ДОБАВИТЬ
    - "передается на рассмотрение"            # <-- ДОБАВИТЬ
  rerank: true
  filters: {}

conditional: null

extraction:
  llm_max_tokens: 450
  llm_prompt_extraction: |
    <role>
    Ты — юрист по международным контрактам и разрешению споров.
    Твоя задача — извлечь из текста договора только:
    1) применимое право;
    2) форум разрешения споров.
    </role>

    <context>
    {context}
    </context>

    <task>
    Заполни только следующие поля:
    - governing_law_value
    - governing_law_status
    - dispute_forum_value
    - dispute_forum_status
    - reason
    </task>

    <general_rules>
    Общие правила:
    - Используй только то, что прямо следует из текста.
    - Не делай вывод о применимом праве или форуме по косвенным признакам:
      языку договора, валюте, месту подписания, адресам сторон, месту исполнения.
    - Не смешивай применимое право и форум: это разные вещи.
    - Если значение отсутствует или не может быть надёжно определено, для *_value возвращай пустую строку.
    - reason должен быть коротким: 1–2 предложения с ключевой цитатой.
    </general_rules>

    <instructions>
    Шаг 1 — ОПРЕДЕЛИ ПРИМЕНИМОЕ ПРАВО

    Заполни поля "governing_law_status" и "governing_law_value".

    Правила для governing_law_status:
    - "present" — если договор прямо указывает применимое право / governing law.
    - "missing" — если положения о применимом праве нет.
    - "unclear" — если есть ссылка на закон / applicable law, но конкретная юрисдикция
      не идентифицируется, либо если положения противоречат друг другу.

    Правила для governing_law_value:
    - Возвращай короткое, но юридически точное user-facing название правопорядка.
    - Предпочитай точность над чрезмерным укрупнением.
    - Примеры корректных значений:
      * "РФ"
      * "Англия и Уэльс"
      * "Швейцария"
      * "Германия"
      * "Штат Нью-Йорк, США"
      * "Делавэр, США"
      * "Калифорния, США"
    - Не возвращай длинные фразы вроде:
      * "настоящее соглашение регулируется правом Российской Федерации"
      * "the laws of the State of New York"
    - Вместо этого возвращай короткое значение:
      * "РФ"
      * "Штат Нью-Йорк, США"
    - Если договор говорит только "applicable law", "relevant law", "according to law"
      без указания конкретной юрисдикции, то:
      * governing_law_status = "unclear"
      * governing_law_value = ""

    Важно:
    - Не своди "England and Wales" к "Великобритания", если в тексте указано именно
      "England and Wales".
    - Не своди "State of New York" к просто "США".

    Шаг 2 — ОПРЕДЕЛИ ФОРУМ РАЗРЕШЕНИЯ СПОРОВ

    Заполни поля "dispute_forum_status" и "dispute_forum_value".

    Под forum понимай:
    - конкретный государственный суд;
    - систему судов определённой юрисдикции;
    - арбитражный институт или арбитраж как выбранный механизм разрешения споров.

    Правила для dispute_forum_status:
    - "present" — если форум прямо указан.
    - "missing" — если форум не указан.
    - "unclear" — если формулировка неполная, противоречивая или не позволяет
      надёжно понять, куда именно должен передаваться спор.

    Правила для dispute_forum_value:
    - Возвращай короткое user-facing название форума.
    - Допустимы как конкретные, так и общие, но явно выбранные формулировки.
    - Примеры корректных значений:
      * "Арбитражный суд г. Москвы"
      * "Арбитражный суд СПб и ЛО"
      * "Суды Англии и Уэльса"
      * "Суд штата Калифорния"
      * "МКАС при ТПП РФ"
      * "ICC arbitration"
      * "LCIA arbitration"
      * "Компетентный суд по месту нахождения ответчика"
      * "Суды штата Нью-Йорк / федеральные суды Нью-Йорка"

    Важно:
    - Не путай forum с seat of arbitration, language, place of hearing,
      number of arbitrators, procedural rules, interim measures.
    - Если текст говорит только о procedural details, но не определяет сам форум,
      dispute_forum_status = "missing" или "unclear" по контексту.
    - Если это арбитражная оговорка и институт назван прямо, возвращай именно институт:
      * "ICC arbitration"
      * "LCIA arbitration"
      * "МКАС при ТПП РФ"
    - Если институт не назван, но прямо сказано, что спор передаётся в арбитраж,
      можно возвращать:
      * "Арбитраж"
      * либо более конкретно, если это следует из текста:
        "Арбитраж в Лондоне"
    - Если указаны альтернативные форумы, перечисли их кратко через " / ".

    Шаг 3 — reason

    Заполни поле "reason".

    Правила:
    - 1–2 коротких предложения.
    - Укажи отдельно вывод по применимому праву и по форуму.
    - Приведи краткую цитату из текста в кавычках.
    - Не анализируй:
      * exclusive / non-exclusive nature;
      * seat, language, number of arbitrators;
      * досудебный порядок;
      * red flags.
    </instructions>

    <edge_cases>
    - Если применимое право указано прямо, а форум не указан:
      * governing_law_status = "present"
      * dispute_forum_status = "missing"

    - Если форум указан прямо, а применимое право не указано:
      * dispute_forum_status = "present"
      * governing_law_status = "missing"

    - Если договор содержит фразы типа "subject to applicable law", "as provided by law"
      без указания конкретной юрисдикции:
      * governing_law_status = "unclear"
      * governing_law_value = ""

    - Если есть несколько несовместимых положений о праве или форуме
      и невозможно определить приоритет:
      * соответствующий status = "unclear"
      * соответствующий value = ""

    - Если clause говорит "courts of England and Wales", "courts of Switzerland",
      "competent courts of Moscow", это считается forum = "present",
      даже если не назван конкретный номер или полное официальное наименование суда.

    - Если clause говорит только "seat of arbitration shall be London", но из текста ясно,
      что спор передаётся в арбитраж, можно вернуть:
      * dispute_forum_status = "present"
      * dispute_forum_value = "Арбитраж в Лондоне"
      но не нужно извлекать язык, состав арбитров или procedural details.

    - Если релевантных фрагментов нет:
      * governing_law_status = "missing"
      * governing_law_value = ""
      * dispute_forum_status = "missing"
      * dispute_forum_value = ""
    </edge_cases>

    <output_expectations>
    Все значения должны быть короткими, точными и пригодными для отображения пользователю в DD Grid.
    Не добавляй никаких полей, кроме указанных в схеме extraction.
    </output_expectations>

  enabled: true
  mode: "hybrid"
  fields:
    - name: "governing_law_value"
      type: "string"

    - name: "governing_law_status"
      type: "string"
      allowed_values:
        - "present"
        - "missing"
        - "unclear"

    - name: "dispute_forum_value"
      type: "string"

    - name: "dispute_forum_status"
      type: "string"
      allowed_values:
        - "present"
        - "missing"
        - "unclear"

    - name: "reason"
      type: "string"

  store_payload: true

  