id: "personal_data_and_dpa"
name: "Персональные данные и DPA"
description: >
  Анализирует регулирование персональных данных в договоре: роли сторон
  (controller/processor/joint), наличие и качество DPA (Data Processing
  Agreement), цели и основания обработки, категории данных и субъектов,
  subprocessors, трансграничные передачи и их правовые механизмы,
  обязательства по уведомлению об инцидентах и права субъектов данных.
  Оценивает соответствие требованиям GDPR, 152-ФЗ и аналогичных режимов
  защиты данных.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"

rules:
  keyword_mode: any

  keywords:
    high:
      # Персональные данные — точные термины
      - "(?i)personal\\s+data"
      - "(?i)персональн[а-я]+\\s+данн[ыхе]"
      - "(?i)\\bПДн\\b"
      - "(?i)\\bPII\\b"
      - "(?i)personally\\s+identifiable\\s+information"

      # Роли сторон
      - "(?i)data\\s+controller"
      - "(?i)data\\s+processor"
      - "(?i)оператор\\s+(персональных\\s+)?данных"
      - "(?i)обработчик\\s+(персональных\\s+)?данных"
      - "(?i)joint\\s+controller"
      - "(?i)совместн[а-я]+\\s+(контролёр|оператор)"

      # DPA
      - "(?i)data\\s+processing\\s+agreement"
      - "(?i)\\bDPA\\b"
      - "(?i)соглашени[ея]\\s+об\\s+обработк[еи]\\s+(персональных\\s+)?данных"
      - "(?i)поручени[ея]\\s+на\\s+обработку"

      # Регуляторные режимы
      - "(?i)\\bGDPR\\b"
      - "(?i)General\\s+Data\\s+Protection\\s+Regulation"
      - "(?i)\\b152[-\\s]?ФЗ\\b"
      - "(?i)Федеральн[а-я]+\\s+закон[\\s\\S]{0,30}персональн[а-я]+\\s+данн"
      - "(?i)\\bCCPA\\b"
      - "(?i)California\\s+Consumer\\s+Privacy"

      # Трансграничная передача
      - "(?i)cross[-\\s]?border\\s+transfer"
      - "(?i)трансграничн[а-я]+\\s+передач[аи]"
      - "(?i)international\\s+data\\s+transfer"
      - "(?i)\\bSCC\\b"
      - "(?i)standard\\s+contractual\\s+clauses"
      - "(?i)стандартн[а-я]+\\s+договорн[а-я]+\\s+оговорк[аи]"
      - "(?i)\\bBCR\\b"
      - "(?i)binding\\s+corporate\\s+rules"
      - "(?i)adequacy\\s+decision"

    medium:
      # Subprocessors
      - "(?i)sub[-\\s]?processor"
      - "(?i)субобработчик"
      - "(?i)sub[-\\s]?contractor[\\s\\S]{0,30}(data|данн)"
      - "(?i)third[-\\s]?party\\s+processor"
      - "(?i)привлечени[ея]\\s+третьих\\s+лиц\\s+для\\s+обработк[ьи]"

      # Основания и цели обработки
      - "(?i)legal\\s+basis"
      - "(?i)правов[а-я]+\\s+основани[ея]"
      - "(?i)purpose\\s+of\\s+(the\\s+)?processing"
      - "(?i)цел[ьи]\\s+обработк[ьи]"
      - "(?i)consent"
      - "(?i)согласи[ея]\\s+(на\\s+обработку|субъект)"
      - "(?i)legitimate\\s+interest"
      - "(?i)законн[а-я]+\\s+интерес"

      # Категории данных и субъектов
      - "(?i)categories?\\s+of\\s+(personal\\s+)?data"
      - "(?i)категори[ияи]\\s+(персональных\\s+)?данных"
      - "(?i)data\\s+subjects?"
      - "(?i)субъект[аов]?\\s+(персональных\\s+)?данных"
      - "(?i)sensitive\\s+(personal\\s+)?data"
      - "(?i)special\\s+categories?"
      - "(?i)особ[а-я]+\\s+категори[ияи]"
      - "(?i)биометрическ[а-я]+\\s+данн"

      # Права субъектов
      - "(?i)data\\s+subject\\s+rights?"
      - "(?i)прав[аы]\\s+субъект[аов]"
      - "(?i)right\\s+to\\s+(access|erasure|portability|rectification)"
      - "(?i)право\\s+на\\s+(доступ|удалени[ея]|перенос|исправлени[ея])"
      - "(?i)right\\s+to\\s+be\\s+forgotten"

      # Инциденты и уведомления
      - "(?i)data\\s+breach"
      - "(?i)breach\\s+notification"
      - "(?i)уведомлени[ея]\\s+о[б]?\\s+(утечк|нарушени|инцидент)"
      - "(?i)notify[\\s\\S]{0,30}(supervisory\\s+authority|регулятор|Роскомнадзор)"

      # Меры защиты
      - "(?i)technical\\s+and\\s+organizational\\s+measures?"
      - "(?i)техническ[а-я]+\\s+и\\s+организационн[а-я]+\\s+мер"
      - "(?i)data\\s+protection\\s+measures?"
      - "(?i)мер[аы]\\s+защит[ыа]\\s+(персональных\\s+)?данных"

    low:
      # Общие термины
      - "(?i)data\\s+protection"
      - "(?i)защит[аы]\\s+данных"
      - "(?i)privacy"
      - "(?i)конфиденциальност[ьи]"
      - "(?i)обработк[аи]\\s+данных"
      - "(?i)data\\s+processing"
      - "(?i)data\\s+transfer"
      - "(?i)передач[аи]\\s+данных"
      - "(?i)retention"
      - "(?i)хранени[ея]\\s+данных"
      - "(?i)deletion"
      - "(?i)удалени[ея]\\s+данных"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 750

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  context_k: 5
  max_chunks: 12
  boost_keywords:
    - "personal data"
    - "персональные данные"
    - "ПДн"
    - "data controller"
    - "data processor"
    - "оператор данных"
    - "обработчик данных"
    - "data processing agreement"
    - "DPA"
    - "соглашение об обработке данных"
    - "GDPR"
    - "152-ФЗ"
    - "cross-border transfer"
    - "трансграничная передача"
    - "SCC"
    - "standard contractual clauses"
    - "sub-processor"
    - "субобработчик"
    - "legal basis"
    - "правовое основание"
    - "purpose of processing"
    - "цель обработки"
    - "data subject rights"
    - "права субъектов данных"
    - "data breach"
    - "breach notification"
    - "уведомление об утечке"
    - "technical and organizational measures"
    - "меры защиты данных"
  rerank: true
  filters: {}

conditional: null

extraction:
  llm_prompt_extraction: |
    <role>
    Ты — юрист по защите персональных данных (data protection / privacy).
    Твоя специализация — GDPR, 152-ФЗ, CCPA и аналогичные режимы защиты
    данных, включая анализ DPA (Data Processing Agreements), ролей сторон,
    трансграничных передач и compliance-рисков.
    </role>

    <context>
    Ниже приведены фрагменты договора, где могут регулироваться
    персональные данные и их обработка:

    {context}
    </context>

    <instructions>
    Проведи анализ по шагам. Каждый шаг логически соответствует одному
    или нескольким полям итоговой оценки риска.

    Шаг 1 — УПОМИНАНИЕ ПЕРСОНАЛЬНЫХ ДАННЫХ И ЗАКОНОВ
    (используется для заполнения поля "mentions_personal_data_and_laws"):
    - Определи, упоминаются ли:
      * персональные данные (personal data, ПДн, PII);
      * режимы защиты данных (GDPR, 152-ФЗ, CCPA, privacy laws).
    - Оцени:
      * "yes" — есть прямые указания на ПДн и/или законы;
      * "no" — не упоминаются;
      * "unclear" — косвенные ссылки или неопределённость.

    Шаг 2 — РОЛЬ TARGET (ЗАКАЗЧИКА / КЛИЕНТА)
    (используется для заполнения поля "role_of_target"):
    - Определи, как позиционируется Target в отношении ПДн:
      * "controller" — оператор / контролёр данных;
      * "processor" — обработчик данных;
      * "joint" — совместный контролёр;
      * "unclear" — роль не определена явно.
    - Опирайся только на формулировки договора, не делай выводов
      по умолчанию на основании «типичной» схемы.

    Шаг 3 — НАЛИЧИЕ DPA ИЛИ ЭКВИВАЛЕНТНОГО РАЗДЕЛА
    (используется для заполнения поля "has_dpa_or_equivalent"):
    - Определи, есть ли:
      * отдельное соглашение об обработке данных (DPA) как приложение;
      * детальный раздел договора с элементами DPA.
    - Проверь наличие ключевых элементов DPA:
      * цели обработки (purposes);
      * правовое основание (legal basis);
      * категории данных и субъектов;
      * срок обработки и правила удаления;
      * технические и организационные меры;
      * обязанности сторон.
    - Оцени:
      * "yes" — есть полноценный DPA или детальный раздел;
      * "partial" — есть некоторые элементы, но неполные;
      * "no" — DPA/раздел отсутствует;
      * "unclear" — невозможно определить.

    Шаг 4 — SUBPROCESSORS
    (используется для заполнения поля "subprocessor_provisions"):
    - Определи, регулирует ли договор привлечение субобработчиков:
      * требуется ли согласие Target;
      * ведётся ли реестр субобработчиков;
      * распространяются ли на них требования DPA.
    - Оцени:
      * "yes" — положения о subprocessors есть и адекватны;
      * "weak" — положения есть, но неполные
        (например, нет согласия или требований к субобработчикам);
      * "no" — положений нет;
      * "unclear" — невозможно определить.

    Шаг 5 — ТРАНСГРАНИЧНЫЕ ПЕРЕДАЧИ
    (используется для заполнения поля "mentions_cross_border_transfers"):
    - Проверь, упоминаются ли:
      * трансграничная передача / international data transfer;
      * страны назначения;
      * правовые механизмы (SCC, BCR, adequacy decision, согласие
        субъекта, исключения по ст. 49 GDPR и т.п.).
    - Оцени mentions_cross_border_transfers:
      * "yes" — трансграничные передачи упоминаются;
      * "no" — не упоминаются;
      * "unclear" — неопределённо.

    Шаг 6 — ПРАВА СУБЪЕКТОВ ДАННЫХ
    (используется для заполнения поля "data_subject_rights_provisions"):
    - Определи, содержит ли договор положения о содействии
      в реализации прав субъектов данных:
      * право на доступ (access);
      * право на удаление (erasure / right to be forgotten);
      * право на переносимость (portability);
      * право на исправление (rectification);
      * право на ограничение обработки.
    - Оцени:
      * "yes" — положения есть и адекватны;
      * "partial" — упоминаются, но неполные;
      * "no" — не упоминаются;
      * "unclear" — невозможно определить.

    Шаг 7 — УВЕДОМЛЕНИЕ ОБ ИНЦИДЕНТАХ
    (используется для заполнения поля "has_breach_notification_obligations"):
    - Определи, есть ли обязательства по уведомлению:
      * Target об инцидентах и утечках;
      * регуляторов (supervisory authority, Роскомнадзор);
      * субъектов данных.
    - Проверь сроки уведомления (например, 72 часа по GDPR).
    - Оцени:
      * "yes" — обязательства явно установлены;
      * "partial" — упоминаются, но без сроков или деталей;
      * "no" — обязательств нет;
      * "unclear" — невозможно определить.

    Шаг 8 — RED FLAGS
    (используется для заполнения поля "red_flags"):
    Присвой один или несколько кодов из списка ниже.
    Если ни один код не применим — верни "NONE".
    Если данных недостаточно для оценки — верни "UNCLEAR".

    Коды:
    • PD1 — Фактическая обработка ПДн очевидна из контекста,
      но DPA или эквивалентных положений нет.
    • PD2 — Отсутствие требований по защите данных и уведомлению
      об инцидентах при работе с ПДн.
    • PD3 — Роль Target (controller/processor) не определена
      явно, что создаёт регуляторную неопределённость.
    • PD4 — Трансграничная передача ПДн без указания правового
      механизма (SCC, BCR, adequacy decision).
    • PD5 — Право провайдера привлекать subprocessors без
      согласия Target и без требований к ним.
    • PD6 — Отсутствие положений о содействии в реализации
      прав субъектов данных.
    • PD7 — DPA ссылается на устаревшие или недействительные
      механизмы (например, Privacy Shield) или не соответствует
      актуальным требованиям.

    Формат ответа: коды через запятую без комментариев
    (например: "PD1, PD4").
    Вся аргументация — в поле reason.

    Шаг 9 — ОБОСНОВАНИЕ
    (используется для заполнения поля "reason"):

    - В reason кратко обоснуй вывод, опираясь на ключевые
      формулировки из текста (с цитатами в кавычках), и укажи:
      * какие ссылки на ПДн и законы присутствуют;
      * какова роль Target;
      * каково качество DPA;
      * есть ли трансграничные передачи и их механизм;
      * если выставлены red_flags — обоснуй каждый код;
      * если red_flags = "NONE" — укажи, почему compliance-риск
        низкий.
    </instructions>

    <edge_cases>
    Обрабатывай пограничные ситуации так:

    - Фактическая обработка ПДн очевидна из описания услуг
      (CRM, HR-аутсорс, колл-центр и т.п.), но ПДн и законы
      прямо не упоминаются:
      mentions_personal_data_and_laws = "no" или "unclear";
      зафиксируй PD1 и PD2; в reason укажи, что отсутствие
      явного регулирования при очевидной обработке ПДн
      создаёт высокий compliance-риск.

    - Общая отсылка к «применимому законодательству о защите
      данных» без DPA или детального раздела:
      has_dpa_or_equivalent = "no" или "partial";
      зафиксируй PD1; в reason укажи, что общих ссылок
      недостаточно для compliance.

    - Роль Target не определена явно, хотя схема отношений
      «типичная» (клиент — controller, исполнитель — processor):
      role_of_target = "unclear";
      зафиксируй PD3; в reason укажи, что без явного
      определения ролей невозможно установить объём
      обязанностей и ответственности.

    - Трансграничная передача упоминается, но механизм
      не указан:
      transfer_mechanism = "not specified";
      зафиксируй PD4; в reason укажи, что после
      Schrems II передача без SCC/BCR/adequacy decision
      может быть незаконной.

    - DPA ссылается на Privacy Shield или иные отменённые
      механизмы:
      зафиксируй PD7; в reason укажи, что Privacy Shield
      недействителен с 2020 года (Schrems II).

    - Subprocessors могут привлекаться без согласия и без
      требований к ним:
      зафиксируй PD5; в reason укажи риск потери контроля
      над цепочкой обработки.

    - Пустые или явно нерелевантные фрагменты:
      укажи, что данных недостаточно для анализа
      регулирования ПДн; red_flags = "UNCLEAR";
      в reason объясни, что невозможность оценить
      compliance сама по себе создаёт риск.
    </edge_cases>

    <output_expectations>
    На основе твоего анализа отдельный механизм извлечения сформирует
    структурированные поля по заранее заданной схеме. Твоя задача —
    давать чёткие юридические выводы и указывать конкретные
    формулировки из текста, на которых они основаны.
    </output_expectations>

  enabled: true
  mode: "hybrid"
  fields:
    - name: "mentions_personal_data_and_laws"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "role_of_target"
      type: "string"
      allowed_values:
        - "controller"
        - "processor"
        - "joint"
        - "unclear"

    - name: "has_dpa_or_equivalent"
      type: "string"
      allowed_values:
        - "yes"
        - "partial"
        - "no"
        - "unclear"

    - name: "subprocessor_provisions"
      type: "string"
      allowed_values:
        - "yes"
        - "weak"
        - "no"
        - "unclear"

    - name: "mentions_cross_border_transfers"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "data_subject_rights_provisions"
      type: "string"
      allowed_values:
        - "yes"
        - "partial"
        - "no"
        - "unclear"

    - name: "has_breach_notification_obligations"
      type: "string"
      allowed_values:
        - "yes"
        - "partial"
        - "no"
        - "unclear"

    - name: "red_flags"
      type: "string"

    - name: "reason"
      type: "string"

  store_payload: true

red_flags:
  items:
    - code: "PD1"
      description: >
        Фактическая обработка ПДн очевидна из контекста,
        но DPA или эквивалентных положений нет.
    - code: "PD2"
      description: >
        Отсутствие требований по защите данных и уведомлению
        об инцидентах при работе с ПДн.
    - code: "PD3"
      description: >
        Роль Target (controller/processor) не определена явно,
        что создаёт регуляторную неопределённость.
    - code: "PD4"
      description: >
        Трансграничная передача ПДн без указания правового
        механизма (SCC, BCR, adequacy decision).
    - code: "PD5"
      description: >
        Право провайдера привлекать subprocessors без согласия
        Target и без требований к ним.
    - code: "PD6"
      description: >
        Отсутствие положений о содействии в реализации
        прав субъектов данных (доступ, удаление, переносимость).
    - code: "PD7"
      description: >
        DPA ссылается на устаревшие или недействительные механизмы
        (например, Privacy Shield) или не соответствует актуальным
        требованиям.