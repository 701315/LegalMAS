id: "personal_data_and_dpa"
name: "Персональные данные и DPA"
group: "Confidentiality"
description: >
  Screening-check: определяет наличие регулирования персональных
  данных в договоре и уровень этого регулирования.

  Детально анализируется только:
  - есть ли в договоре требования по ПДн / personal data;
  - на каком уровне они закреплены: отдельное DPA / поручение
    на обработку, отдельный раздел договора или только ссылка
    на применимый закон.

  Детальный анализ ролей сторон (controller / processor / joint),
  целей и оснований обработки, категорий данных, subprocessors,
  трансграничных передач, breach notification и прав субъектов
  выполняется отдельными специализированными checks.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"
ui_mode: "field_extraction"

rules:
  keyword_mode: any

  keywords:
    high:
      - "(?i)personal\\s+data"
      - "(?i)персональн[а-я]+\\s+данн[ыхе]"
      - "(?i)\\bПДн\\b"
      - "(?i)\\bPII\\b"
      - "(?i)personally\\s+identifiable\\s+information"
      - "(?i)data\\s+controller"
      - "(?i)data\\s+processor"
      - "(?i)оператор\\s+(персональных\\s+)?данных"
      - "(?i)обработчик\\s+(персональных\\s+)?данных"
      - "(?i)joint\\s+controller"
      - "(?i)совместн[а-я]+\\s+(контролёр|оператор)"
      - "(?i)data\\s+processing\\s+agreement"
      - "(?i)\\bDPA\\b"
      - "(?i)соглашени[ея]\\s+об\\s+обработк[еи]\\s+(персональных\\s+)?данных"
      - "(?i)поручени[ея]\\s+на\\s+обработку"
      - "(?i)data\\s+processing\\s+addendum"
      - "(?i)\\bGDPR\\b"
      - "(?i)General\\s+Data\\s+Protection\\s+Regulation"
      - "(?i)\\b152[-\\s]?ФЗ\\b"
      - "(?i)Федеральн[а-я]+\\s+закон[\\s\\S]{0,30}персональн[а-я]+\\s+данн"
      - "(?i)\\bCCPA\\b"
      - "(?i)California\\s+Consumer\\s+Privacy"
      - "(?i)cross[-\\s]?border\\s+transfer"
      - "(?i)трансграничн[а-я]+\\s+передач[аи]"
      - "(?i)international\\s+data\\s+transfer"
      - "(?i)\\bSCC\\b"
      - "(?i)standard\\s+contractual\\s+clauses"
      - "(?i)стандартн[а-я]+\\s+договорн[а-я]+\\s+оговорк[аи]"

    medium:
      - "(?i)sub[-\\s]?processor"
      - "(?i)субобработчик"
      - "(?i)third[-\\s]?party\\s+processor"
      - "(?i)привлечени[ея]\\s+третьих\\s+лиц\\s+для\\s+обработк[ьи]"
      - "(?i)legal\\s+basis"
      - "(?i)правов[а-я]+\\s+основани[ея]"
      - "(?i)purpose\\s+of\\s+(the\\s+)?processing"
      - "(?i)цел[ьи]\\s+обработк[ьи]"
      - "(?i)legitimate\\s+interest"
      - "(?i)законн[а-я]+\\s+интерес"
      - "(?i)categories?\\s+of\\s+(personal\\s+)?data"
      - "(?i)категори[ияи]\\s+(персональных\\s+)?данных"
      - "(?i)data\\s+subjects?"
      - "(?i)субъект[аов]?\\s+(персональных\\s+)?данных"
      - "(?i)sensitive\\s+(personal\\s+)?data"
      - "(?i)special\\s+categories?"
      - "(?i)особ[а-я]+\\s+категори[ияи]"
      - "(?i)data\\s+breach"
      - "(?i)breach\\s+notification"
      - "(?i)уведомлени[ея]\\s+о[б]?\\s+(утечк|нарушени|инцидент)"
      - "(?i)technical\\s+and\\s+organizational\\s+measures?"
      - "(?i)техническ[а-я]+\\s+и\\s+организационн[а-я]+\\s+мер"
      - "(?i)data\\s+protection\\s+measures?"
      - "(?i)мер[аы]\\s+защит[ыа]\\s+(персональных\\s+)?данных"

    low:
      - "(?i)data\\s+protection"
      - "(?i)защит[аы]\\s+данных"
      - "(?i)privacy"
      - "(?i)обработк[аи]\\s+(персональных\\s+)?данных"
      - "(?i)data\\s+processing"
      - "(?i)retention"
      - "(?i)хранени[ея]\\s+данных"
      - "(?i)deletion"
      - "(?i)удалени[ея]\\s+данных"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 750

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  context_k: 6
  max_chunks: 12

  retrieval_query: >
    персональные данные обработка персональных данных
    поручение на обработку соглашение об обработке данных DPA
    GDPR 152-ФЗ personal data data processing agreement
    оператор данных data controller трансграничная передача

  boost_keywords:
    - "персональные данные"
    - "personal data"
    - "ПДн"
    - "DPA"
    - "data processing agreement"
    - "поручение на обработку"
    - "соглашение об обработке данных"
    - "GDPR"
    - "152-ФЗ"
    - "оператор данных"
    - "data controller"
    - "обработчик данных"
    - "data processor"
    - "трансграничная передача"
    - "cross-border transfer"

  negative_keywords:
    - "конфиденциальная информация"
    - "коммерческая тайна"
    - "означает"
    - "в целях настоящего"
    - "споры"
    - "подсудность"
    - "применимое право"
    - "смена контроля"
    - "уступка прав"

  preferred_unit_types:
    - "obligation"
    - "general_provision"

  excluded_unit_types:
    - "definition"
    - "structural_anchor"
    - "technical_fragment"
    - "appendix_reference"

  preferred_clause_functions:
    - "obligations"
    - "procedures"

  position_bias:
    preferred_range: [0.30, 1.00]
    boost: 0.20
    scope: "segment"

  rerank: true
  filters: {}

conditional: null

enrichment_hints:
  preferred_segment_types:
    - "contract"
    - "annex"
    - "appendix"
    - "amendment"
  excluded_segment_types:
    - "technical_specification"
    - "price_list"
    - "invoice"
    - "act"
  confidence_bonus_on_match: 0.10
  confidence_penalty_on_excluded_segment: 0.15

extraction:
  enabled: true
  mode: "hybrid"
  llm_max_tokens: 600

  llm_prompt_extraction: |
    <role>
    Ты — юрист по защите персональных данных.
    Твоя задача — screening: определить наличие требований
    по персональным данным в договоре и уровень их закрепления.

    Не анализируй детально роли сторон, цели обработки, категории
    данных, subprocessors, трансграничные передачи, breach
    notification или права субъектов — это задача других checks.
    </role>

    <context>
    Ниже приведены релевантные фрагменты договора:

    {context}
    </context>

    <task>
    Заполни только следующие поля:
    - personal_data_display
    - personal_data_status
    - personal_data_regulation_level
    - reason

    Важно:
    - не оценивай compliance-риск и не выставляй red flags;
    - не анализируй роли сторон, subprocessors, трансграничные
      передачи или права субъектов данных;
    - пиши user-facing значения коротко и по-русски.
    </task>

    <instructions>
    Шаг 1 — НАЛИЧИЕ ТРЕБОВАНИЙ ПО ПЕРСОНАЛЬНЫМ ДАННЫМ

    Заполни поле "personal_data_status".

    Значения:
    - "present" — если договор содержит любые из следующего:
      * прямое упоминание персональных данных / personal data /
        ПДн / PII;
      * ссылку на GDPR, 152-ФЗ, CCPA или аналогичный режим;
      * положения об обработке данных, DPA, поручение
        на обработку;
      * обязательства сторон в отношении персональных данных.
    - "missing" — если договор явно не содержит никаких
      упоминаний персональных данных и законов об их защите.
    - "unclear" — если фрагменты не позволяют уверенно
      определить наличие или отсутствие таких требований.

    Шаг 2 — УРОВЕНЬ РЕГУЛИРОВАНИЯ

    Заполни поле "personal_data_regulation_level".

    Значения:
    - "dpa_attachment" — есть отдельное соглашение об обработке
      персональных данных (DPA / поручение на обработку),
      оформленное как отдельный документ / приложение к договору
      с полноценными условиями обработки данных.
    - "dedicated_section" — в основном тексте договора есть
      отдельный раздел / статья, специально посвящённая
      персональным данным, с содержательными обязательствами
      сторон.
    - "law_reference_only" — договор только:
      * упоминает персональные данные или законы без
        содержательных обязательств;
      * содержит общую фразу "стороны обязуются соблюдать
        применимое законодательство о защите данных";
      * ссылается на GDPR / 152-ФЗ без раскрытия условий.
    - "not_specified" — если personal_data_status = "missing".
    - "unclear" — если personal_data_status = "unclear"
      или уровень невозможно определить.

    Правило приоритета:
    - Если есть и приложение, и раздел в договоре —
      выбирай "dpa_attachment" как более высокий уровень.
    - Общие формулировки о конфиденциальности без прямого
      упоминания ПДн или законов о них
      не являются регулированием персональных данных.

    Шаг 3 — НОРМАЛИЗОВАННЫЙ DISPLAY ДЛЯ DD GRID

    Заполни поле "personal_data_display".

    Базовые шаблоны:
    - status = "missing":
      "Требования по ПДн не установлены"
    - status = "unclear":
      "Не удалось определить"
    - status = "present", level = "dpa_attachment":
      "Отдельное соглашение об обработке ПДн (DPA)"
    - status = "present", level = "dedicated_section":
      "Отдельный раздел договора по ПДн"
    - status = "present", level = "law_reference_only":
      "Только ссылка на применимый закон"

    Шаг 4 — КРАТКОЕ ОБОСНОВАНИЕ

    Заполни поле "reason".

    Правила:
    - 1–2 коротких предложения.
    - Укажи отдельно вывод по наличию требований и по уровню
      регулирования.
    - Приведи краткую цитату или укажи наличие / отсутствие
      конкретного элемента (приложения, раздела, фразы).
    - Не анализируй риск, не выставляй оценки.
    </instructions>

    <edge_cases>
    - Есть приложение с DPA / поручением на обработку:
      * personal_data_status = "present"
      * personal_data_regulation_level = "dpa_attachment"
      * personal_data_display =
        "Отдельное соглашение об обработке ПДн (DPA)"

    - Есть раздел "Персональные данные" / "Data Protection"
      в теле договора с содержательными условиями,
      но без отдельного приложения:
      * personal_data_status = "present"
      * personal_data_regulation_level = "dedicated_section"
      * personal_data_display =
        "Отдельный раздел договора по ПДн"

    - Только фраза "Стороны обязуются соблюдать требования
      152-ФЗ" без детализации:
      * personal_data_status = "present"
      * personal_data_regulation_level = "law_reference_only"
      * personal_data_display =
        "Только ссылка на применимый закон"

    - Упоминание ПДн только в разделе о конфиденциальности,
      без явной отсылки к законам о персональных данных:
      * если ПДн прямо названы:
        personal_data_status = "present"
        personal_data_regulation_level = "law_reference_only"
        или "dedicated_section" по содержанию
      * если ПДн не названы явно:
        personal_data_status = "unclear"

    - Нет релевантных фрагментов:
      * personal_data_status = "missing"
      * personal_data_regulation_level = "not_specified"
      * personal_data_display =
        "Требования по ПДн не установлены"

    - Фрагменты есть, но вывод сделать нельзя:
      * personal_data_status = "unclear"
      * personal_data_regulation_level = "unclear"
      * personal_data_display = "Не удалось определить"
    </edge_cases>

    <output_expectations>
    Все значения должны быть короткими, точными и пригодными
    для отображения пользователю в DD Grid.
    Не добавляй никаких полей, кроме указанных в схеме extraction.
    </output_expectations>

  fields:
    - name: "personal_data_display"
      type: "string"
      presentation: "fact"
      label: "Персональные данные"
      description: "Нормализованный user-facing вывод для DD Grid"

    - name: "personal_data_status"
      type: "string"
      presentation: "signal"
      description: "Наличие требований по ПДн"
      allowed_values:
        - "present"
        - "missing"
        - "unclear"

    - name: "personal_data_regulation_level"
      type: "string"
      presentation: "signal"
      description: "Уровень регулирования ПДн"
      allowed_values:
        - "dpa_attachment"
        - "dedicated_section"
        - "law_reference_only"
        - "not_specified"
        - "unclear"

    - name: "reason"
      type: "string"
      presentation: "diagnostic"
      description: "Обоснование"

  store_payload: true

  