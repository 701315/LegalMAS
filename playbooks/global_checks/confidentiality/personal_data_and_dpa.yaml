id: "personal_data_and_dpa"
name: "Персональные данные и DPA"
description: >
  Анализирует обработку персональных данных: роли сторон (контролёр/процессор),
  наличие DPA, основания обработки, трансграничные передачи и требования защиты.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"

rules:
  keywords:
    - "персональные данные"
    - "персональных данных"
    - "ПДн"
    - "personal data"
    - "data controller"
    - "data processor"
    - "data protection"
    - "GDPR"
    - "152-ФЗ"
    - "data processing agreement"
    - "DPA"
    - "обработка данных"
    - "data transfer"
    - "cross-border transfer"
    - "трансграничная передача"
  keyword_mode: "any"
  regex_patterns: []
  clause_patterns: []

llm:
  prompt_template: |
    <role>
    Ты — юрист по персональным данным и data protection.
    Твоя специализация — GDPR, 152-ФЗ и аналогичные режимы защиты данных.
    </role>

    <context>
    Ниже приведены фрагменты договора, где могут регулироваться персональные данные
    и обработка данных:

    {context}
    </context>

    <instructions>
    Проведи анализ по шагам. Каждый шаг логически связан с одним или
    несколькими полями итоговой оценки.

    Шаг 1 — УПОМИНАНИЕ ПЕРСОНАЛЬНЫХ ДАННЫХ И ЗАКОНОВ
    (используется для заполнения поля "mentions_personal_data_and_laws"):
    - Определи, упоминаются ли:
      * персональные данные (personal data, ПДн и аналогичные термины),
      * режимы защиты данных и законы (GDPR, 152-ФЗ, privacy/data protection laws и т.п.).
    - Сделай вывод: есть ли прямые или косвенные указания на регулирование
      персональных данных, либо по тексту это не прослеживается.

    Шаг 2 — РОЛЬ TARGET (ЗАКАЗЧИКА/КЛИЕНТА)
    (используется для заполнения поля "role_of_target"):
    - Определи, как позиционируется Target:
      * controller / оператор данных;
      * processor / обработчик;
      * joint (совместные контролёры);
      * если по тексту нельзя однозначно понять — фиксируй неопределённость.
    - Опираться нужно только на формулировки договора, не на предположения
      по умолчанию.

    Шаг 3 — НАЛИЧИЕ DPA ИЛИ ЭКВИВАЛЕНТНОГО РАЗДЕЛА
    (используется для заполнения поля "has_dpa_or_equivalent_section"):
    - Определи, предусматривает ли договор:
      * отдельное соглашение об обработке данных (Data Processing Agreement,
        Соглашение об обработке персональных данных) в виде приложения;
      * либо детальный раздел, содержащий типичные элементы DPA: цели обработки,
        категории данных и субъектов, меры защиты, subprocessors и т.п.
    - Классифицируй: есть ли такой DPA/раздел, нет или по фрагментам это неясно.

    Шаг 4 — ТРАНСГРАНИЧНЫЕ ПЕРЕДАЧИ
    (используется для заполнения поля "mentions_cross_border_transfers"):
    - Проверь, упоминаются ли:
      * cross-border transfer / трансграничная передача персональных данных;
      * механизмы таких передач (SCC, BCR, иные механизмы, согласие субъектов
        или аналогичные инструменты).
    - Оцени, есть ли указания на трансграничные передачи и их правовые основания,
      либо тема не раскрыта.

    Шаг 5 — ИНЦИДЕНТЫ БЕЗОПАСНОСТИ И УВЕДОМЛЕНИЯ
    (используется для заполнения поля "mentions_breach_notification_and_logging"):
    - Определи, есть ли положения о:
      * уведомлении регуляторов и/или субъектов данных о нарушениях безопасности;
      * фиксации и журналировании инцидентов (logging, incident reporting).
    - Сделай вывод, предусмотрены ли такие обязанности или по тексту
      это не видно.

    Шаг 6 — ОБЩИЙ УРОВЕНЬ РИСКА
    (используется для формирования "overall_risk_level" и "reason"):
    - Оцени соответствие базовым ожиданиям защиты данных с точки зрения Target:
      * определённость ролей (controller/processor/joint),
      * наличие и качество DPA/эквивалентного раздела,
      * регулирование трансграничных передач,
      * наличие процедур уведомления и реагирования на инциденты.
    - Сформулируй итоговый риск как low / medium / high и обоснуй его
      конкретными формулировками (желательно с короткими цитатами в кавычках).
    </instructions>

    <edge_cases>
    Обрабатывай пограничные ситуации так:

    - Фактическая обработка персональных данных очевидна из описания услуг,
      но персональные данные и законы прямо не упоминаются:
      в анализе отражай отсутствие явного регулирования и указывай на
      повышенный риск из-за этого.

    - В договоре есть общая отсылка к "применимому законодательству о защите данных",
      но нет отдельного DPA или детального раздела:
      фиксируй наличие общих ссылок на законы, но указывай, что детализация
      обязанностей и ролей недостаточна.

    - Роль Target:
      * если прямо указано, что клиент — controller/оператор, а исполнитель —
        processor, исходи из этого;
      * при отсутствии явных формулировок не делай выводов по умолчанию,
        даже если схема отношений "типичная".

    - Пустые или явно нерелевантные фрагменты:
      укажи, что данных недостаточно для анализа регулирования персональных
      данных и DPA, и объясни, как это влияет на неопределённость и риск.
    </edge_cases>

    <output_expectations>
    На основе твоего анализа отдельный механизм извлечения сформирует
    структурированные поля по заранее заданной схеме. Твоя задача —
    давать чёткие юридические выводы и указывать конкретные формулировки
    из текста, на которых они основаны.
    </output_expectations>
  prompt_file: null
  context_k: 5
  temperature: 0.0
  max_tokens: 640

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  context_k: 5
  max_chunks: 10
  boost_keywords:
    - "персональные данные"
    - "personal data"
    - "GDPR"
    - "152-ФЗ"
    - "data processing agreement"
    - "DPA"
    - "cross-border transfer"
  rerank: true
  filters: {}

conditional: null

extraction:
  enabled: true
  mode: "hybrid"
  fields:
    - name: "mentions_personal_data_and_laws"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "role_of_target"
      type: "string"
      allowed_values:
        - "controller"
        - "processor"
        - "joint"
        - "unclear"

    - name: "has_dpa_or_equivalent_section"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "mentions_cross_border_transfers"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "mentions_breach_notification_and_logging"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "overall_risk_level"
      type: "string"
      allowed_values:
        - "low"
        - "medium"
        - "high"

    - name: "reason"
      type: "string"

  store_payload: true

red_flags:
  items:
    - code: "PD1"
      description: "Фактическая обработка ПДн без DPA/эквивалентных положений."
    - code: "PD2"
      description: "Отсутствие требований по защите данных и уведомлению об инцидентах при значимых объёмах ПДн."
