id: "personal_data_and_dpa"
name: "Персональные данные и DPA"
description: >
  Анализирует обработку персональных данных: роли сторон (контролёр/процессор),
  наличие DPA, основания обработки, трансграничные передачи и требования защиты.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"

rules:
  keywords:
    - "персональные данные"
    - "персональных данных"
    - "ПДн"
    - "personal data"
    - "data controller"
    - "data processor"
    - "data protection"
    - "GDPR"
    - "152-ФЗ"
    - "data processing agreement"
    - "DPA"
    - "обработка данных"
    - "data transfer"
    - "cross-border transfer"
    - "трансграничная передача"
  keyword_mode: "any"
  regex_patterns: []
  clause_patterns: []

llm:
  prompt_template: |
    <role>
    Ты — юрист по персональным данным и data protection.
    Твоя специализация — GDPR, 152-ФЗ и аналогичные режимы защиты данных.
    </role>

    <context>
    Ниже приведены фрагменты договора, где могут регулироваться персональные данные
    и обработка данных:

    {context}
    </context>

    <instructions>
    Определи:

    1) Упоминаются ли персональные данные и/или применимые режимы (GDPR, 152-ФЗ и т.п.):
       - прямые упоминания personal data, ПДн, data protection laws, privacy laws и пр.;
       - ссылки на конкретные законы и регуляции.

    2) Каковы роли Target (заказчика/клиента) и контрагента:
       - controller / оператор данных,
       - processor / обработчик,
       - joint (совместные контролёры),
       - unclear, если по тексту нельзя однозначно понять.

    3) Есть ли отдельное соглашение об обработке данных (DPA) или раздел,
       эквивалентный DPA:
       - явно названное Data Processing Agreement / Соглашение об обработке данных,
       - либо раздел, содержащий типичные элементы DPA (цели, категории данных,
         категории субъектов, технические и организационные меры, subprocessors).

    4) Упомянуты ли трансграничные передачи и основания для них:
       - cross-border transfer / трансграничная передача,
       - механизмы (SCC, BCR, аналогичные инструменты, согласие субъектов и т.п.).

    5) Предусмотрены ли уведомления регуляторов и журналирование/фиксация
       инцидентов безопасности:
       - breach notification (в т.ч. компетентному органу и/или субъектам),
       - incident logging, security incident reporting.

    6) Насколько эти положения соответствуют базовым требованиям защиты данных:
       - оцени overall_risk_level: low / medium / high с точки зрения Target,
         исходя из наличия DPA, распределения ролей и регулирования transfer/incident.
    </instructions>

    <edge_cases>
    ВАЖНО — пограничные случаи:

    — Фактическая обработка ПДн присутствует (из описания услуг), но
      персональные данные и законы прямо не упоминаются:
      mentions_personal_data_and_laws = "unclear",
      has_dpa_or_equivalent_section = "no" (если нет отдельного раздела),
      overall_risk_level не ниже "medium" (обоснуй в reason).

    — В договоре есть общая отсылка к "применимому законодательству о защите данных",
      но нет конкретного DPA/раздела с детализацией:
      has_dpa_or_equivalent_section = "unclear",
      mentions_personal_data_and_laws = "yes".

    — Роль Target:
      * если прямо указано, что клиент является controller/оператором, а исполнитель — processor,
        role_of_target = "controller";
      * если явно указаны joint controllers — role_of_target = "joint";
      * при отсутствии явных указаний — "unclear" (не додумывай по умолчанию).

    — Пустые или нерелевантные фрагменты:
      большинство полей = "unclear" или null,
      overall_risk_level = "medium",
      reason = "Недостаточно данных для анализа регулирования персональных данных и DPA."
    </edge_cases>

    <examples>
    ПРИМЕР 1 — ПОЛНОЦЕННЫЙ DPA, НИЗКИЙ/СРЕДНИЙ РИСК:

    Фрагмент: "Стороны признают, что Клиент является контролёром персональных данных,
    а Поставщик — процессором. Стороны заключили отдельное Data Processing Agreement,
    являющееся Приложением 2, определяющее цели и категории обработки, категории
    субъектов данных, а также технические и организационные меры защиты. Любая
    трансграничная передача регулируется стандартными договорными условиями (SCC)."

    {{
      "mentions_personal_data_and_laws": "yes",
      "role_of_target": "controller",
      "has_dpa_or_equivalent_section": "yes",
      "mentions_cross_border_transfers": "yes",
      "mentions_breach_notification_and_logging": "unclear",
      "overall_risk_level": "low",
      "reason": "Роли controller/processor явно определены, имеется отдельный DPA с ключевыми элементами и указаны механизмы трансграничной передачи (SCC)."
    }}

    ПРИМЕР 2 — ОБРАБОТКА ПДн БЕЗ DPA (HIGH):

    Фрагмент: "Исполнитель получает доступ к персональным данным сотрудников
    Клиента для целей расчёта заработной платы. Исполнитель обязуется соблюдать
    применимое законодательство, включая GDPR и 152-ФЗ."

    {{
      "mentions_personal_data_and_laws": "yes",
      "role_of_target": "unclear",
      "has_dpa_or_equivalent_section": "no",
      "mentions_cross_border_transfers": "unclear",
      "mentions_breach_notification_and_logging": "unclear",
      "overall_risk_level": "high",
      "reason": "Фактически происходит обработка ПДн, законы упомянуты, но нет отдельного DPA или эквивалентного раздела с детализацией ролей и мер защиты."
    }}

    ПРИМЕР 3 — ОБЩИЕ ФОРМУЛИРОВКИ, НЕЯСНОСТЬ (MEDIUM):

    Фрагмент: "Стороны обязуются соблюдать всё применимое законодательство
    в области защиты данных и конфиденциальности. Любые инциденты безопасности
    подлежат документированию и уведомлению другой Стороны без неоправданной задержки."

    {{
      "mentions_personal_data_and_laws": "yes",
      "role_of_target": "unclear",
      "has_dpa_or_equivalent_section": "unclear",
      "mentions_cross_border_transfers": "unclear",
      "mentions_breach_notification_and_logging": "yes",
      "overall_risk_level": "medium",
      "reason": "Указываются общие обязательства по защите данных и уведомлению об инцидентах, но роли и DPA не конкретизированы."
    }}
    </examples>

    <output_format>
    Твой ответ ДОЛЖЕН быть строго валидным JSON-объектом со следующими
    полями:

    {{
      "mentions_personal_data_and_laws": "one of: yes | no | unclear",
      "role_of_target": "one of: controller | processor | joint | unclear",
      "has_dpa_or_equivalent_section": "one of: yes | no | unclear",
      "mentions_cross_border_transfers": "one of: yes | no | unclear",
      "mentions_breach_notification_and_logging": "one of: yes | no | unclear",
      "overall_risk_level": "one of: low | medium | high",
      "reason": "string — краткое объяснение на русском с указанием ключевых формулировок и оценкой соответствия базовым требованиям"
    }}

    Все перечисленные поля ДОЛЖНЫ присутствовать в JSON, даже если их значение равно null.
    </output_format>

    <constraints>
    ЖЁСТКИЕ ПРАВИЛА:
    1. Выведи ТОЛЬКО один JSON-объект. Никакого текста до или после.
    2. Не пиши "Вот JSON", "Here is the JSON" и т.п.
    3. Не используй Markdown, бэктики ``` или любые обёртки.
    4. Все строки — в двойных кавычках.
    5. Значения перечислимых полей — СТРОГО из указанных вариантов.
    6. Ключи — точно как указано, без добавления новых.
    7. Поле "reason" ДОЛЖНО содержать конкретные факты и формулировки
       из фрагментов, а не общие фразы вроде "есть риски".
    8. Начни ответ сразу с символа {{
    9. Если по какому‑то полю нет достаточно информации в тексте —
       верни для него 'unclear' или null (для reason пустое значение
       недопустимо — нужно объяснение). НЕ придумывай значения, не интерполируй.
    </constraints>
  prompt_file: null
  context_k: 5
  temperature: 0.0
  max_tokens: 640

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  context_k: 5
  max_chunks: 10
  boost_keywords:
    - "персональные данные"
    - "personal data"
    - "GDPR"
    - "152-ФЗ"
    - "data processing agreement"
    - "DPA"
    - "cross-border transfer"
  rerank: true
  filters: {}

conditional: null

extraction:
  enabled: true
  mode: "hybrid"
  fields:
    - name: "mentions_personal_data_and_laws"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
    - name: "role_of_target"
      type: "string"
      allowed_values:
        - "controller"
        - "processor"
        - "joint"
        - "unclear"
    - name: "has_dpa_or_equivalent_section"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
    - name: "mentions_cross_border_transfers"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
    - name: "mentions_breach_notification_and_logging"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
    - name: "overall_risk_level"
      type: "string"
      allowed_values:
        - "low"
        - "medium"
        - "high"
    - name: "reason"
      type: "string"
  store_payload: true

red_flags:
  items:
    - code: "PD1"
      description: "Фактическая обработка ПДн без DPA/эквивалентных положений."
    - code: "PD2"
      description: "Отсутствие требований по защите данных и уведомлению об инцидентах при значимых объёмах ПДн."
      