id: "data_use_and_results_rights"
name: "Права использования данных и результатов"
description: >
  Анализирует права контрагента на использование данных, отчётов и результатов работ,
  включая риски скрытой передачи IP/аналитики и ограничения для Target.

doc_types: []

severity: "medium"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"

rules:
  keywords:
    - "право использовать данные"
    - "use of data"
    - "data analytics"
    - "анализ данных"
    - "обезличенные данные"
    - "aggregated data"
    - "de-identified data"
    - "результаты работ"
    - "work product"
    - "ownership of data"
    - "принадлежность данных"
    - "customer data"
    - "client data"
  keyword_mode: "any"
  regex_patterns: []
  clause_patterns: []

llm:
  prompt_template: |
    <role>
    Ты — юрист по ИТ и данным.
    Твоя специализация — распределение прав на данные, результаты работ и аналитику
    между заказчиком (Target) и контрагентом (поставщиком сервиса).
    </role>

    <context>
    Ниже приведены фрагменты договора, касающиеся данных и результатов работ:

    {context}
    </context>

    <instructions>
    Проведи анализ по шагам. Каждый шаг логически связан с одним или
    несколькими полями итоговой оценки.

    Шаг 1 — ПРИНАДЛЕЖНОСТЬ ИСХОДНЫХ ДАННЫХ
    (используется для заполнения поля "ownership_of_customer_data"):
    - Определи, кому принадлежат данные, предоставленные заказчиком (Customer/Client Data):
      * явно ли указано, что все клиентские данные остаются в собственности клиента,
        либо используются иные конструкции;
      * есть ли формулировки типа "all Customer Data remains the property of Customer".
    - Сделай вывод: права на исходные данные закреплены за Target, за контрагентом,
      распределены совместно или остаются неясными.

    Шаг 2 — ПРИНАДЛЕЖНОСТЬ РЕЗУЛЬТАТОВ РАБОТ (WORK PRODUCT)
    (используется для заполнения поля "ownership_of_work_results"):
    - Определи, кому принадлежат:
      * отчёты, аналитика, модели, иные результаты работ, созданные по договору;
      * отличай их от исходных данных.
    - Зафиксируй, закреплены ли права за Target, за контрагентом, распределены
      совместно или формулировки не дают ясного ответа.

    Шаг 3 — ПРАВА КОНТРАГЕНТА ИСПОЛЬЗОВАТЬ ДАННЫЕ ДЛЯ СВОИХ ЦЕЛЕЙ
    (используется для заполнения полей
     "counterparty_can_use_data_for_own_purposes" и
     "counterparty_can_use_aggregated_or_anonymized_data"):
    - Определи, может ли контрагент использовать данные:
      * для собственных целей (разработка продуктов, benchmarking, аналитика,
        обучение моделей и др.);
      * только в обезличенном/агрегированном виде, или без таких ограничений.
    - Отдельно оцени:
      * право использовать любые данные для своих целей;
      * право использовать только агрегированные/обезличенные данные.

    Шаг 4 — ОГРАНИЧЕНИЯ НА ИСПОЛЬЗОВАНИЕ ДАННЫХ
    (используется для заполнения поля "restrictions_on_data_use_summary"):
    - Опиши ключевые ограничения по:
      * цели (только для исполнения договора, только статистические цели и т.п.);
      * сроку (только в период действия договора или также после его окончания);
      * объёму (только обезличенные/агрегированные данные, запрет передачи
        третьим лицам и т.д.).
    - Сформулируй краткое текстовое резюме того, что именно разрешено и запрещено.

    Шаг 5 — ОБЩИЙ УРОВЕНЬ РИСКА
    (используется для формирования "overall_risk_level" и "reason"):
    - Оцени общий риск для Target с точки зрения:
      * возможной скрытой передачи ценной аналитики или IP контрагенту,
      * неясной или неблагоприятной принадлежности work product,
      * широких прав контрагента использовать данные (в т.ч. агрегированные).
    - Сформулируй итоговый уровень риска как low / medium / high и обоснуй его
      конкретными формулировками из текста (желательно с короткими цитатами
      в кавычках).
    </instructions>

    <edge_cases>
    Обрабатывай пограничные ситуации так:

    - Прямо указано, что все Customer Data принадлежат заказчику, но контрагент
      получает широкое право использовать anonymized/aggregated data для любых
      целей:
      в анализе отдельно отметь, что права на сырые данные сохраняются за Target,
      но остаётся риск утечки или монетизации производной аналитики контрагентом.

    - Принадлежность результатов работ прямо не определена:
      фиксируй неопределённость и не делай выводов "по умолчанию" на основе
      внешнего права или практики.

    - Указано, что контрагент может использовать данные "для улучшения своих
      продуктов и услуг", даже в обезличенном виде:
      воспринимай это как право использовать данные для собственных целей,
      независимо от наличия оговорок об анонимизации.

    - Явно запрещено использовать данные для любых иных целей, кроме исполнения
      договора, и нет carve-out для агрегированных/обезличенных данных:
      учитывай это как строгие ограничения, снижающие риск использования данных
      контрагентом вне рамок договора.

    - Пустые или явно нерелевантные фрагменты:
      укажи, что распределение прав на данные и результаты работ остаётся
      неопределённым, и объясни, как это влияет на риск для Target.
    </edge_cases>

    <output_expectations>
    На основе твоего анализа отдельный механизм извлечения сформирует
    структурированные поля по заранее заданной схеме. Твоя задача —
    давать чёткие юридические выводы и указывать конкретные формулировки
    из текста, на которых они основаны.
    </output_expectations>
  prompt_file: null
  context_k: 4
  temperature: 0.0
  max_tokens: 512

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 500

retrieval:
  context_k: 4
  max_chunks: 8
  boost_keywords:
    - "customer data"
    - "ownership of data"
    - "data analytics"
    - "aggregated data"
    - "результаты работ"
  rerank: true
  filters: {}

conditional: null

extraction:
  enabled: true
  mode: "hybrid"
  fields:
    - name: "ownership_of_customer_data"
      type: "string"
      allowed_values:
        - "target"
        - "counterparty"
        - "joint"
        - "unclear"

    - name: "ownership_of_work_results"
      type: "string"
      allowed_values:
        - "target"
        - "counterparty"
        - "joint"
        - "unclear"

    - name: "counterparty_can_use_data_for_own_purposes"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "counterparty_can_use_aggregated_or_anonymized_data"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "restrictions_on_data_use_summary"
      type: "string"

    - name: "overall_risk_level"
      type: "string"
      allowed_values:
        - "low"
        - "medium"
        - "high"

    - name: "reason"
      type: "string"

  store_payload: true

red_flags:
  items:
    - code: "DATA1"
      description: "Неограниченное право контрагента использовать данные Target для собственных целей."
    - code: "DATA2"
      description: "Неясная принадлежность результатов работ/аналитики, создающая риск утечки IP."
