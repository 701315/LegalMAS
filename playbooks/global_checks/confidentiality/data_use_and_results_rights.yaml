id: "data_use_and_results_rights"
name: "Права использования данных и результатов"
description: >
  Анализирует распределение прав на данные и результаты работ между
  Target и контрагентом: принадлежность исходных данных (Customer Data),
  результатов работ (work product, отчёты, аналитика), derived data
  и ML-моделей, права контрагента использовать данные для собственных
  целей (включая агрегированные/обезличенные), ограничения на использование,
  права после расторжения договора. Оценивает риски скрытой передачи
  IP/аналитики контрагенту.

doc_types: []

severity: "medium"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"

rules:
  keyword_mode: any

  keywords:
    high:
      # Ownership / принадлежность данных
      - "(?i)ownership\\s+of\\s+(customer\\s+|client\\s+)?data"
      - "(?i)принадлежност[ьи]\\s+(клиентских\\s+)?данных"
      - "(?i)data\\s+remains?\\s+(the\\s+)?property"
      - "(?i)данные\\s+остаются\\s+(собственностью|в\\s+собственности)"
      - "(?i)all\\s+(customer|client)\\s+data\\s+(shall\\s+)?belong"
      - "(?i)все\\s+(клиентские\\s+)?данные\\s+принадлежат"

      # Work product / результаты работ
      - "(?i)work\\s+product"
      - "(?i)результат[аы]\\s+работ"
      - "(?i)deliverables?"
      - "(?i)ownership\\s+of\\s+(work\\s+)?results?"
      - "(?i)права\\s+на\\s+результат[аы]"
      - "(?i)intellectual\\s+property\\s+rights?\\s+in\\s+(the\\s+)?deliverables?"

      # Права на использование для своих целей
      - "(?i)use\\s+(customer\\s+|client\\s+)?data\\s+for\\s+(its?\\s+own|internal|business)\\s+purposes?"
      - "(?i)использовать\\s+данные\\s+(для\\s+)?собственн[а-я]+\\s+цел"
      - "(?i)право\\s+(контрагента\\s+|исполнителя\\s+)?использовать\\s+данные"
      - "(?i)right\\s+to\\s+use\\s+(the\\s+)?data"

      # Агрегированные / обезличенные данные
      - "(?i)aggregated\\s+data"
      - "(?i)агрегированн[а-я]+\\s+данн"
      - "(?i)anonymized\\s+data"
      - "(?i)de[-\\s]?identified\\s+data"
      - "(?i)обезличенн[а-я]+\\s+данн"
      - "(?i)псевдонимизированн[а-я]+\\s+данн"

      # Derived data / insights / ML
      - "(?i)derived\\s+data"
      - "(?i)производн[а-я]+\\s+данн"
      - "(?i)insights?"
      - "(?i)аналитик[аи]"
      - "(?i)machine\\s+learning\\s+model"
      - "(?i)\\bML\\s+model"
      - "(?i)train(ing)?\\s+(of\\s+)?model"
      - "(?i)обучени[ея]\\s+модел"

    medium:
      # Customer data / client data
      - "(?i)customer\\s+data"
      - "(?i)client\\s+data"
      - "(?i)клиентск[а-я]+\\s+данн"
      - "(?i)данн[ыхе]\\s+(заказчика|клиента)"
      - "(?i)your\\s+data"
      - "(?i)ваш[иа]\\s+данн"

      # Data analytics / использование
      - "(?i)data\\s+analytics?"
      - "(?i)анализ\\s+данных"
      - "(?i)use\\s+of\\s+data"
      - "(?i)использовани[ея]\\s+данных"
      - "(?i)data\\s+usage"
      - "(?i)process(ing)?\\s+(the\\s+)?data"

      # Ограничения / restrictions
      - "(?i)restrictions?\\s+on\\s+(the\\s+)?(use|processing)\\s+of\\s+data"
      - "(?i)ограничени[яе]\\s+(на\\s+)?использовани[ея]\\s+данных"
      - "(?i)solely\\s+for\\s+(the\\s+)?purpose"
      - "(?i)исключительно\\s+для\\s+цел"
      - "(?i)only\\s+for\\s+(the\\s+)?purposes?\\s+of\\s+(this\\s+)?agreement"
      - "(?i)только\\s+для\\s+цел[а-я]+\\s+договор"

      # После расторжения
      - "(?i)upon\\s+termination"
      - "(?i)после\\s+расторжени[яи]"
      - "(?i)return\\s+or\\s+delete"
      - "(?i)вернуть\\s+или\\s+удалить"
      - "(?i)deletion\\s+of\\s+(customer\\s+)?data"
      - "(?i)удалени[ея]\\s+(клиентских\\s+)?данных"
      - "(?i)data\\s+retention\\s+after\\s+termination"

      # Третьи лица
      - "(?i)disclose\\s+to\\s+third\\s+part(y|ies)"
      - "(?i)передач[аи]\\s+третьим\\s+лицам"
      - "(?i)share\\s+with\\s+affiliates?"
      - "(?i)передач[аи]\\s+аффилированн[а-я]+\\s+лицам"

    low:
      # Общие термины
      - "(?i)data"
      - "(?i)данн[ыхе]"
      - "(?i)информаци[яи]"
      - "(?i)information"
      - "(?i)results?"
      - "(?i)результат"
      - "(?i)report"
      - "(?i)отчёт"
      - "(?i)analytics?"
      - "(?i)license"
      - "(?i)лицензи"
      - "(?i)rights?"
      - "(?i)прав[аоы]?"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 700

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  context_k: 5
  max_chunks: 10
  boost_keywords:
    - "ownership of data"
    - "принадлежность данных"
    - "customer data"
    - "client data"
    - "клиентские данные"
    - "work product"
    - "результаты работ"
    - "deliverables"
    - "use of data"
    - "использование данных"
    - "for own purposes"
    - "для собственных целей"
    - "aggregated data"
    - "агрегированные данные"
    - "anonymized data"
    - "обезличенные данные"
    - "de-identified data"
    - "derived data"
    - "производные данные"
    - "insights"
    - "аналитика"
    - "ML model"
    - "machine learning"
    - "upon termination"
    - "после расторжения"
    - "return or delete"
    - "вернуть или удалить"
    - "third party"
    - "третьим лицам"
  rerank: true
  filters: {}

conditional: null

extraction:
  llm_prompt_extraction: |
    <role>
    Ты — юрист по ИТ-контрактам и интеллектуальной собственности.
    Твоя специализация — распределение прав на данные, результаты работ,
    derived data, ML-модели и аналитику между заказчиком (Target)
    и контрагентом (поставщиком сервиса).
    </role>

    <context>
    Ниже приведены фрагменты договора, касающиеся данных,
    результатов работ и прав на них:

    {context}
    </context>

    <instructions>
    Проведи анализ по шагам. Каждый шаг логически соответствует одному
    или нескольким полям итоговой оценки риска.

    Шаг 1 — ПРИНАДЛЕЖНОСТЬ ИСХОДНЫХ ДАННЫХ (CUSTOMER DATA)
    (используется для заполнения поля "ownership_of_customer_data"):
    - Определи, кому принадлежат данные, предоставленные Target
      (Customer Data, Client Data, «данные заказчика»):
      * "target" — явно указано, что все данные остаются
        собственностью Target;
      * "counterparty" — права на данные переходят контрагенту;
      * "joint" — совместная собственность или разделённые права;
      * "unclear" — принадлежность не определена явно.
    - Ищи формулировки типа: «all Customer Data remains the property
      of Customer», «данные принадлежат заказчику» и т.п.

    Шаг 2 — ПРИНАДЛЕЖНОСТЬ РЕЗУЛЬТАТОВ РАБОТ (WORK PRODUCT)
    (используется для заполнения поля "ownership_of_work_product"):
    - Определи, кому принадлежат результаты работ, созданные
      по договору:
      * отчёты, аналитика, модели, deliverables;
      * отличай их от исходных данных Target.
    - Оцени:
      * "target" — права на work product принадлежат Target;
      * "counterparty" — права принадлежат контрагенту;
      * "joint" — совместные права;
      * "unclear" — не определено.

    Шаг 3 — DERIVED DATA, INSIGHTS, ML-МОДЕЛИ
    (используется для заполнения поля "derived_data_rights"):
    - Определи, регулирует ли договор права на:
      * derived data (производные данные);
      * insights (инсайты, выводы);
      * ML-модели, обученные на данных Target;
      * улучшения продуктов контрагента на основе данных Target.
    - Оцени:
      * "target_owns" — права на derived data принадлежат Target;
      * "counterparty_owns" — права принадлежат контрагенту;
      * "joint" — совместные права;
      * "not_addressed" — тема не затронута в договоре;
      * "unclear" — затронута, но неясно.

    Шаг 4 — ПРАВА НА АГРЕГИРОВАННЫЕ / ОБЕЗЛИЧЕННЫЕ ДАННЫЕ
    (используется для заполнения поля "counterparty_can_use_aggregated_data"):
    - Определи, есть ли carve-out для агрегированных / обезличенных
      данных:
      * право использовать anonymized / aggregated / de-identified
        data для своих целей;
      * ограничения на такое использование (только статистика,
        только в период договора и т.п.).
    - Оцени:
      * "yes_unlimited" — право использовать без ограничений;
      * "yes_limited" — право с ограничениями (укажи какими
        в reason);
      * "no" — нет такого права;
      * "unclear" — не определено.

    Шаг 5 — ПРАВА ПОСЛЕ РАСТОРЖЕНИЯ ДОГОВОРА
    (используется для заполнения поля "post_termination_data_rights"):
    - Определи, что происходит с данными Target после расторжения:
      * обязанность вернуть и/или удалить данные;
      * срок, в течение которого данные доступны;
      * право контрагента сохранить агрегированные данные
        после расторжения.
    - Оцени:
      * "return_and_delete" — данные возвращаются и удаляются;
      * "return_only" — возвращаются, но не обязательно удаляются;
      * "counterparty_retains" — контрагент сохраняет данные
        или их часть;
      * "not_addressed" — не урегулировано;
      * "unclear" — урегулировано, но неясно.

    Шаг 6 — ПЕРЕДАЧА ДАННЫХ ТРЕТЬИМ ЛИЦАМ
    (используется для заполнения поля "third_party_data_sharing"):
    - Определи, вправе ли контрагент передавать данные Target
      третьим лицам:
      * аффилированным лицам;
      * партнёрам, субподрядчикам;
      * неограниченному кругу лиц.
    - Оцени:
      * "yes_without_consent" — может передавать без согласия Target;
      * "yes_with_consent" — может, но с согласия Target;
      * "no" — запрещено;
      * "unclear" — не определено.

    Шаг 7 — RED FLAGS
    (используется для заполнения поля "red_flags"):
    Присвой один или несколько кодов из списка ниже.
    Если ни один код не применим — верни "NONE".
    Если данных недостаточно для оценки — верни "UNCLEAR".

    Коды:
    • DATA1 — Неограниченное право контрагента использовать
      данные Target для собственных целей (разработка продуктов,
      ML, аналитика, монетизация).
    • DATA2 — Неясная или невыгодная принадлежность work product
      (отчёты, аналитика) — риск утечки IP.
    • DATA3 — Право контрагента использовать агрегированные/
      обезличенные данные без ограничений по цели и сроку.
    • DATA4 — Отсутствие обязательства вернуть и удалить данные
      после расторжения договора.
    • DATA5 — Право контрагента на derived data / insights /
      ML-модели, созданные на основе данных Target.
    • DATA6 — Право контрагента передавать данные третьим лицам
      без согласия Target.

    Формат ответа: коды через запятую без комментариев
    (например: "DATA1, DATA5").
    Вся аргументация — в поле reason.

    Шаг 8 — ОБОСНОВАНИЕ
    (используется для заполнения поля "reason"):
    - Определи итоговый уровень риска на основе совокупности
      выявленных факторов:

      HIGH — если выполняется хотя бы одно из:
        • неограниченное право использовать данные для своих целей
          (DATA1);
        • права на work product у контрагента или неясны (DATA2);
        • права на derived data / ML у контрагента (DATA5);
        • передача третьим лицам без согласия (DATA6);
        • одновременно 3+ DATA-кодов.

      MEDIUM — если выполняется хотя бы одно из:
        • право на агрегированные данные без ограничений (DATA3);
        • нет обязательства удалить данные (DATA4);
        • 1–2 DATA-кода без признаков HIGH;
        • частичные пробелы в регулировании.

      LOW — если:
        • данные и work product принадлежат Target;
        • права контрагента ограничены исполнением договора;
        • агрегированные данные с ограничениями или запрещены;
        • данные возвращаются и удаляются;
        • red_flags = "NONE".

    - В reason кратко обоснуй вывод, опираясь на ключевые
      формулировки из текста (с цитатами в кавычках), и укажи:
      * кому принадлежат данные и work product;
      * какие права у контрагента на использование данных;
      * есть ли carve-out для агрегированных данных;
      * что происходит после расторжения;
      * если выставлены red_flags — обоснуй каждый код;
      * если red_flags = "NONE" — укажи, почему риск низкий.
    </instructions>

    <edge_cases>
    Обрабатывай пограничные ситуации так:

    - Customer Data принадлежит Target, но контрагент получает
      широкое право на anonymized/aggregated data для любых целей:
      ownership_of_customer_data = "target";
      counterparty_can_use_aggregated_data = "yes_unlimited";
      зафиксируй DATA3; в reason укажи, что сохраняется риск
      монетизации производной аналитики.

    - Принадлежность work product не определена:
      ownership_of_work_product = "unclear";
      зафиксируй DATA2; в reason укажи, что по умолчанию
      (без явной оговорки) права могут остаться у создателя
      (контрагента), что невыгодно для Target.

    - Контрагент может использовать данные «для улучшения
      своих продуктов», даже в обезличенном виде:
      counterparty_can_use_data_for_own_purposes = "yes";
      зафиксируй DATA1; в reason укажи, что формулировка
      «улучшение продуктов» охватывает широкий спектр целей.

    - Явно запрещено использовать данные для любых целей,
      кроме исполнения договора, без carve-out для агрегированных:
      counterparty_can_use_data_for_own_purposes = "no";
      counterparty_can_use_aggregated_data = "no";
      red_flags = "NONE"; в reason укажи, что ограничения строгие.

    - Права на derived data / ML-модели не урегулированы:
      derived_data_rights = "not_addressed";
      зафиксируй DATA5; в reason укажи, что пробел в регулировании
      создаёт риск присвоения контрагентом производной ценности.

    - Нет обязательства удалить данные после расторжения:
      post_termination_data_rights = "not_addressed"
      или "counterparty_retains";
      зафиксируй DATA4.

    - Передача данных аффилированным лицам без согласия:
      зафиксируй DATA6; в reason укажи круг лиц, которым
      могут быть переданы данные.

    - Пустые или явно нерелевантные фрагменты:
      red_flags = "UNCLEAR"; в reason укажи, что распределение
      прав на данные не определено, что само по себе создаёт
      риск для Target.
    </edge_cases>

    <output_expectations>
    На основе твоего анализа отдельный механизм извлечения сформирует
    структурированные поля по заранее заданной схеме. Твоя задача —
    давать чёткие юридические выводы и указывать конкретные
    формулировки из текста, на которых они основаны.
    </output_expectations>

  enabled: true
  mode: "hybrid"
  fields:
    - name: "ownership_of_customer_data"
      type: "string"
      allowed_values:
        - "target"
        - "counterparty"
        - "joint"
        - "unclear"

    - name: "ownership_of_work_product"
      type: "string"
      allowed_values:
        - "target"
        - "counterparty"
        - "joint"
        - "unclear"

    - name: "derived_data_rights"
      type: "string"
      allowed_values:
        - "target_owns"
        - "counterparty_owns"
        - "joint"
        - "not_addressed"
        - "unclear"

    - name: "counterparty_can_use_aggregated_data"
      type: "string"
      allowed_values:
        - "yes_unlimited"
        - "yes_limited"
        - "no"
        - "unclear"

    - name: "post_termination_data_rights"
      type: "string"
      allowed_values:
        - "return_and_delete"
        - "return_only"
        - "counterparty_retains"
        - "not_addressed"
        - "unclear"

    - name: "third_party_data_sharing"
      type: "string"
      allowed_values:
        - "yes_without_consent"
        - "yes_with_consent"
        - "no"
        - "unclear"

    - name: "red_flags"
      type: "string"

    - name: "reason"
      type: "string"

  store_payload: true

red_flags:
  items:
    - code: "DATA1"
      description: >
        Неограниченное право контрагента использовать данные Target
        для собственных целей (разработка продуктов, ML, аналитика,
        монетизация).
    - code: "DATA2"
      description: >
        Неясная или невыгодная принадлежность work product
        (отчёты, аналитика) — риск утечки IP.
    - code: "DATA3"
      description: >
        Право контрагента использовать агрегированные/обезличенные
        данные без ограничений по цели и сроку.
    - code: "DATA4"
      description: >
        Отсутствие обязательства вернуть и удалить данные
        после расторжения договора.
    - code: "DATA5"
      description: >
        Право контрагента на derived data / insights / ML-модели,
        созданные на основе данных Target.
    - code: "DATA6"
      description: >
        Право контрагента передавать данные третьим лицам
        (аффилированным лицам, партнёрам) без согласия Target.