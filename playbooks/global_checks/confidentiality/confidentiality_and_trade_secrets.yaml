id: "confidentiality_and_trade_secrets"
name: "Конфиденциальность и коммерческая тайна"
group: "Confidentiality"
description: >
  Screening-check: определяет наличие режима конфиденциальности
  в договоре (обязательства по неразглашению, NDA-положения,
  режим коммерческой тайны / trade secret) и извлекает срок
  действия обязательств по конфиденциальности.

  Детально анализируется только:
  - наличие / отсутствие требований к конфиденциальности;
  - срок (конкретный / бессрочный / по закону / не установлен).

  Детальный анализ исключений, допустимого раскрытия,
  маркировки, возврата / уничтожения информации и surviving
  obligations выполняется отдельными специализированными checks.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"
ui_mode: "field_extraction"

rules:
  keyword_mode: any

  keywords:
    high:
      - "(?i)confidential\\s+information"
      - "(?i)конфиденциальн[а-я]+\\s+информаци"
      - "(?i)proprietary\\s+information"
      - "(?i)служебн[а-я]+\\s+информаци"
      - "(?i)коммерческ[а-я]+\\s+тайн"
      - "(?i)trade\\s+secret"
      - "(?i)секрет\\s+производства"
      - "(?i)ноу[-\\s]?хау"
      - "(?i)know[-\\s]?how"
      - "(?i)\\bNDA\\b"
      - "(?i)non[-\\s]?disclosure\\s+agreement"
      - "(?i)соглашени[ея]\\s+о\\s+неразглашении"
      - "(?i)соглашени[ея]\\s+о\\s+конфиденциальност[ьи]"
      - "(?i)не\\s+разглашать"
      - "(?i)shall\\s+not\\s+disclose"
      - "(?i)обязательств[аоы]\\s+по\\s+конфиденциальност[ьи]"
      - "(?i)confidentiality\\s+obligations?"
      - "(?i)обязуется\\s+(сохранять|не\\s+раскрывать)\\s+(конфиденциальн)"
      - "(?i)surviv(e|ing|al)\\s+(termination|expiration)"
      - "(?i)shall\\s+remain\\s+in\\s+(full\\s+)?force[\\s\\S]{0,40}(confidential|конфиденциальн)"
      - "(?i)в\\s+течение[\\s\\S]{0,20}\\d+[\\s\\S]{0,20}(лет|год)[\\s\\S]{0,40}(прекращени|расторжени)"

    medium:
      - "(?i)confidentiality\\s+period"
      - "(?i)срок\\s+конфиденциальност[ьи]"
      - "(?i)for\\s+a\\s+period\\s+of\\s+\\d+\\s+years?"
      - "(?i)в\\s+течение\\s+\\d+\\s+(лет|год[а-я]*)"
      - "(?i)perpetual(ly)?"
      - "(?i)бессрочн[оа]"
      - "(?i)indefinite(ly)?"
      - "(?i)without\\s+time\\s+limit"
      - "(?i)без\\s+ограничения\\s+срока"
      - "(?i)does\\s+not\\s+include[\\s\\S]{0,30}(confidential|конфиденциальн)"
      - "(?i)не\\s+является\\s+конфиденциальн"
      - "(?i)publicly\\s+(available|known)"
      - "(?i)общедоступн[а-я]+\\s+информаци"
      - "(?i)independently\\s+developed"
      - "(?i)received\\s+from\\s+(a\\s+)?third\\s+party"
      - "(?i)получен[аоы]?\\s+от\\s+третьих\\s+лиц"
      - "(?i)disclose\\s+to\\s+(its?\\s+)?(affiliates?|advisors?|consultants?)"
      - "(?i)раскры(ть|тие|вать)\\s+(аффилированн[а-я]+|консультант|советник)"
      - "(?i)permitted\\s+disclosure"
      - "(?i)разрешённое\\s+раскрытие"
      - "(?i)due\\s+diligence"
      - "(?i)potential\\s+(buyer|investor|acquirer)"
      - "(?i)потенциальн[а-я]+\\s+(покупател|инвестор)"

    low:
      - "(?i)confidential"
      - "(?i)конфиденциальн"
      - "(?i)non[-\\s]?disclosure"
      - "(?i)неразглашени"
      - "(?i)secret"
      - "(?i)тайн[аы]"
      - "(?i)sensitive\\s+information"
      - "(?i)disclosure"
      - "(?i)раскрыти[ея]"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 700

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  retrieval_profile: "confidentiality_check"
  context_k: 6
  max_chunks: 10

  retrieval_query: >
    конфиденциальная информация обязательства по конфиденциальности
    не разглашать срок конфиденциальности бессрочно
    confidential information non-disclosure NDA trade secret
    коммерческая тайна surviving obligations

  boost_keywords:
    - "конфиденциальная информация"
    - "confidential information"
    - "обязательства по конфиденциальности"
    - "confidentiality obligations"
    - "коммерческая тайна"
    - "trade secret"
    - "NDA"
    - "non-disclosure"
    - "не разглашать"
    - "shall not disclose"
    - "срок конфиденциальности"
    - "confidentiality period"
    - "бессрочно"
    - "perpetual"
    - "survives termination"
    - "сохраняет силу после прекращения"

  negative_keywords:
    - "означает"
    - "в целях настоящего"
    - "споры"
    - "подсудность"
    - "применимое право"
    - "смена контроля"
    - "уступка прав"
    - "перевод долга"

  preferred_unit_types:
    - "confidentiality"
    - "obligation"
    - "general_provision"

  excluded_unit_types:
    - "definition"
    - "structural_anchor"
    - "technical_fragment"
    - "appendix_reference"

  preferred_clause_functions:
    - "obligations"
    - "limitations"

  position_bias:
    preferred_range: [0.45, 1.00]
    boost: 0.25
    scope: "segment"

  rerank: true
  filters: {}

conditional: null

enrichment_hints:
  preferred_segment_types:
    - "contract"
    - "amendment"
    - "annex"
  excluded_segment_types:
    - "technical_specification"
    - "price_list"
    - "invoice"
    - "act"
  confidence_bonus_on_match: 0.10
  confidence_penalty_on_excluded_segment: 0.15

extraction:
  enabled: true
  mode: "hybrid"
  llm_max_tokens: 850

  llm_prompt_extraction: |
    <role>
    Ты — юрист по коммерческим договорам.
    Твоя задача — точно извлечь из текста:
    1) есть ли в договоре требования к конфиденциальности;
    2) если есть — какой срок конфиденциальности установлен.

    Не анализируй детально определение конфиденциальной информации,
    исключения, маркировку, допустимое раскрытие третьим лицам
    или порядок возврата / уничтожения — это задача других checks.
    </role>

    <context>
    Ниже приведены релевантные фрагменты договора:

    {context}
    </context>

    <task>
    Заполни только следующие поля:
    - confidentiality_display
    - confidentiality_status
    - confidentiality_term_regime
    - confidentiality_term_value
    - confidentiality_term_display
    - reason

    Важно:
    - не оценивай риск и не выставляй red flags;
    - не анализируй определение конфиденциальной информации,
      исключения, маркировку или возврат информации;
    - если срок не указан явно, не выводи его из закона
      или общих принципов;
    - пиши user-facing значения коротко и по-русски.
    </task>

    <instructions>
    Шаг 1 — НАЛИЧИЕ ТРЕБОВАНИЙ К КОНФИДЕНЦИАЛЬНОСТИ

    Заполни поле "confidentiality_status".

    Значения:
    - "present" — если договор содержит любые обязательства
      по конфиденциальности, NDA-положения, запрет на раскрытие
      информации, режим коммерческой тайны или ссылку на то,
      что информация является конфиденциальной.
    - "missing" — если договор явно не содержит никаких
      требований к конфиденциальности.
    - "unclear" — если фрагменты не позволяют уверенно
      определить наличие или отсутствие таких требований.

    Шаг 2 — СРОК КОНФИДЕНЦИАЛЬНОСТИ

    Заполни поля "confidentiality_term_regime",
    "confidentiality_term_value", "confidentiality_term_display".

    Под сроком конфиденциальности понимай:
    - срок действия обязательств по конфиденциальности после
      прекращения / расторжения договора;
    - срок действия обязательств в период договора, если он
      прямо указан отдельно;
    - явное указание на бессрочность (perpetual confidentiality).

    Значения для confidentiality_term_regime:
    - "contract_specified" — прямо установлен конкретный срок
      в годах, месяцах или иных единицах.
    - "perpetual" — прямо указана бессрочность
      ("perpetually", "indefinitely", "бессрочно",
      "без ограничения срока").
    - "applicable_law_reference" — срок прямо отсылается
      к закону / применимому праву.
    - "not_specified" — срок не установлен и нет прямой
      отсылки к закону.
    - "unclear" — по фрагментам нельзя уверенно определить
      режим срока.

    Правила для confidentiality_term_value:
    - Если regime = "contract_specified": только сам срок,
      без объяснений.
      Примеры: "2 года", "5 лет", "36 месяцев".
    - Если срок отсчитывается от прекращения договора:
      "3 года после прекращения договора".
    - Если разные сроки для разных типов информации:
      "5 лет для коммерческой тайны; 2 года для прочей информации".
    - Если regime ≠ "contract_specified": оставь поле пустым.

    Правила для confidentiality_term_display:
    - regime = "contract_specified":
      повтори значение из confidentiality_term_value
    - regime = "perpetual": "Бессрочно"
    - regime = "applicable_law_reference":
      "Определяется применимым правом"
    - regime = "not_specified": "Срок не установлен"
    - regime = "unclear": "Не удалось определить"

    Важно:
    - Если confidentiality_status = "missing" или "unclear":
      * confidentiality_term_regime = "not_specified" или "unclear"
      * confidentiality_term_value = ""
      * confidentiality_term_display = "Срок не установлен"
        или "Не удалось определить"

    Шаг 3 — НОРМАЛИЗОВАННЫЙ DISPLAY ДЛЯ DD GRID

    Заполни поле "confidentiality_display".

    Базовые шаблоны:
    - status = "missing":
      "Требования к конфиденциальности не установлены"
    - status = "unclear":
      "Не удалось определить"

    Если status = "present":
    - term_regime = "contract_specified":
      "Обязательства по конфиденциальности предусмотрены;
       срок — {confidentiality_term_value}"
    - term_regime = "perpetual":
      "Обязательства по конфиденциальности предусмотрены;
       бессрочно"
    - term_regime = "applicable_law_reference":
      "Обязательства по конфиденциальности предусмотрены;
       срок определяется применимым правом"
    - term_regime = "not_specified":
      "Обязательства по конфиденциальности предусмотрены;
       срок не установлен"
    - term_regime = "unclear":
      "Обязательства по конфиденциальности предусмотрены;
       срок не удалось определить"

    Шаг 4 — КРАТКОЕ ОБОСНОВАНИЕ

    Заполни поле "reason".

    Правила:
    - 1–2 коротких предложения.
    - Укажи отдельно вывод по наличию режима и по сроку.
    - Приведи краткую цитату из текста в кавычках.
    - Не анализируй риск, не выставляй оценки.
    </instructions>

    <edge_cases>
    - Только общая фраза о конфиденциальности без срока:
      * confidentiality_status = "present"
      * confidentiality_term_regime = "not_specified"
      * confidentiality_term_value = ""
      * confidentiality_term_display = "Срок не установлен"
      * confidentiality_display =
        "Обязательства по конфиденциальности предусмотрены;
         срок не установлен"

    - Trade secrets — бессрочно, прочая информация — 3 года:
      * confidentiality_term_regime = "contract_specified"
      * confidentiality_term_value =
        "Бессрочно для коммерческой тайны;
         3 года для прочей информации"
      * confidentiality_term_display =
        "Бессрочно для коммерческой тайны;
         3 года для прочей информации"

    - "Perpetual" или "indefinitely" для всей информации:
      * confidentiality_term_regime = "perpetual"
      * confidentiality_term_value = ""
      * confidentiality_term_display = "Бессрочно"

    - "Срок определяется применимым правом":
      * confidentiality_term_regime = "applicable_law_reference"
      * confidentiality_term_value = ""
      * confidentiality_term_display =
        "Определяется применимым правом"

    - Нет релевантных фрагментов:
      * confidentiality_status = "missing"
      * confidentiality_term_regime = "not_specified"
      * confidentiality_term_value = ""
      * confidentiality_term_display = "Срок не установлен"
      * confidentiality_display =
        "Требования к конфиденциальности не установлены"

    - Фрагменты есть, но вывод сделать нельзя:
      * confidentiality_status = "unclear"
      * confidentiality_term_regime = "unclear"
      * confidentiality_term_value = ""
      * confidentiality_term_display = "Не удалось определить"
      * confidentiality_display = "Не удалось определить"
    </edge_cases>

    <output_expectations>
    Все значения должны быть короткими, точными и пригодными
    для отображения пользователю в DD Grid.
    Не добавляй никаких полей, кроме указанных в схеме extraction.
    </output_expectations>

  fields:
    - name: "confidentiality_display"
      type: "string"
      presentation: "fact"
      label: "Конфиденциальность"
      description: "Нормализованный user-facing вывод для DD Grid"

    - name: "confidentiality_status"
      type: "string"
      presentation: "signal"
      description: "Наличие требований к конфиденциальности"
      allowed_values:
        - "present"
        - "missing"
        - "unclear"

    - name: "confidentiality_term_regime"
      type: "string"
      presentation: "signal"
      description: "Режим срока конфиденциальности"
      allowed_values:
        - "contract_specified"
        - "perpetual"
        - "applicable_law_reference"
        - "not_specified"
        - "unclear"

    - name: "confidentiality_term_value"
      type: "string"
      presentation: "fact"
      label: "Срок конфиденциальности"
      description: "Конкретный срок (если установлен)"

    - name: "confidentiality_term_display"
      type: "string"
      presentation: "fact"
      label: "Срок"
      description: "Срок конфиденциальности для DD Grid"

    - name: "reason"
      type: "string"
      presentation: "diagnostic"
      description: "Обоснование"

  store_payload: true

  
