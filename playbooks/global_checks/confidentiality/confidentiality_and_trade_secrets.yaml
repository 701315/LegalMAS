id: "confidentiality_and_trade_secrets"
name: "Конфиденциальность и коммерческая тайна"
description: >
  Анализирует определение конфиденциальной информации, срок конфиденциальности
  и выживающие обязанности, включая коммерческую тайну.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"

rules:
  keywords:
    - "конфиденциальная информация"
    - "конфиденциальность"
    - "confidential information"
    - "confidentiality"
    - "коммерческая тайна"
    - "trade secret"
    - "не разглашать"
    - "non-disclosure"
    - "NDA"
  keyword_mode: "any"
  regex_patterns: []
  clause_patterns: []

llm:
  prompt_template: |
    <role>
    Ты — юрист по коммерческим договорам и NDA.
    Твоя специализация — анализ положений о конфиденциальности и коммерческой тайне
    в B2B-контрактах и сделках M&A.
    </role>

    <context>
    Ниже приведены фрагменты договора с положениями о конфиденциальности
    и (при наличии) коммерческой тайне:

    {context}
    </context>

    <instructions>
    Проведи анализ по шагам. Каждый шаг логически связан с одним или
    несколькими полями итоговой оценки.

    Шаг 1 — ОПРЕДЕЛЕНИЕ КОНФИДЕНЦИАЛЬНОЙ ИНФОРМАЦИИ
    (используется для заполнения поля "definition_scope"):
    - Определи, насколько широко или узко сформулировано определение
      конфиденциальной информации:
      * overbroad — охватывает "любую информацию в любой форме", без
        разумной связи с договором/бизнесом или видами информации.
      * balanced — разумно привязано к предмету договора/бизнесу, с
        типичным описанием видов информации.
      * narrow — чрезмерно узко, защищает только ограниченный набор данных
        и может не покрывать важную часть обмена.
      * unclear — по доступным фрагментам оценка невозможна.
    - Сделай вывод по сути и отрази его в "definition_scope".

    Шаг 2 — НАЛИЧИЕ СТАНДАРТНЫХ ИСКЛЮЧЕНИЙ
    (используется для заполнения поля "has_standard_exceptions"):
    - Проверь, есть ли явно прописанные исключения для:
      * общедоступной информации,
      * информации, независимо разработанной получателем,
      * информации, полученной от третьих лиц без нарушения,
      * информации, раскрытой по закону или по требованию госорганов/суда.
    - Оцени, присутствует ли такой стандартный набор исключений (yes / no / unclear).

    Шаг 3 — СРОК КОНФИДЕНЦИАЛЬНОСТИ
    (используется для заполнения поля "confidentiality_term"):
    - Отдельно от срока договора определи срок действия обязательств
      по конфиденциальности:
      * short — менее 2 лет после прекращения договора.
      * standard — примерно 2–5 лет после прекращения договора.
      * long — более 5 лет, но не бессрочно.
      * perpetual — бессрочно (как правило, для коммерческой тайны).
      * unclear — срок не указан или неясен по фрагментам.
    - Если сроки различаются для обычной конфиденциальной информации
      и для коммерческой тайны, отрази это в объяснении.

    Шаг 4 — РАЗРЕШЁННОЕ РАСКРЫТИЕ
    (используется для заполнения полей
     "allows_disclosure_to_affiliates_and_advisors" и
     "allows_disclosure_for_dd_and_mna"):
    - Определи, допускается ли раскрытие конфиденциальной информации:
      * аффилированным лицам, консультантам, аудиторам, банкам и другим
        советникам при условии соблюдения ими режима конфиденциальности;
      * потенциальным покупателям/инвесторам в рамках due diligence и M&A.
    - Для каждого из этих аспектов сделай вывод: yes / no / unclear.

    Шаг 5 — ОБЩИЙ УРОВЕНЬ РИСКА
    (используется для формирования "overall_risk_level" и "reason"):
    - Оцени общий риск исходя из сочетания:
      * широты/сбалансированности определения,
      * наличия стандартных исключений,
      * срока конфиденциальности,
      * разрешения или запретов на раскрытие аффилированным лицам,
        консультантам, инвесторам.
    - Сформулируй итоговый уровень риска как low / medium / high.
    - Обоснуй вывод с опорой на ключевые формулировки (желательно
      с короткими цитатами в кавычках), включая указание на проблемные
      или, наоборот, комфортные элементы для операционной деятельности и M&A.
    </instructions>

    <edge_cases>
    Обрабатывай пограничные ситуации так:

    - В тексте только общая фраза "Стороны обязуются соблюдать конфиденциальность"
      без определения, исключений и срока:
      в анализе фиксируй неопределённость по ключевым параметрам и оцени
      риск не ниже среднего из-за размытости режима.

    - Для коммерческой тайны установлен бессрочный срок, а для остальной
      информации — ограниченный:
      в объяснении опиши разделение, а категорию срока выбери исходя
      из того, как сформулированы обязательства для основной массы
      конфиденциальной информации.

    - Если явно запрещено раскрытие информации потенциальным покупателям
      или инвесторам без согласия другой стороны:
      учитывай это как фактор, осложняющий сделки M&A, и отражай
      в оценке риска.

    - Пустые или явно нерелевантные фрагменты:
      укажи, что данных недостаточно для анализа режима конфиденциальности,
      и объясни, как это влияет на неопределённость и риск.
    </edge_cases>

    <output_expectations>
    На основе твоего анализа отдельный механизм извлечения сформирует
    структурированные поля по заранее заданной схеме. Твоя задача —
    давать чёткие юридические выводы и указывать конкретные формулировки
    из текста, на которых они основаны.
    </output_expectations>
  prompt_file: null
  context_k: 4
  temperature: 0.0
  max_tokens: 640

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  context_k: 4
  max_chunks: 8
  boost_keywords:
    - "конфиденциальная информация"
    - "confidential information"
    - "коммерческая тайна"
    - "trade secret"
    - "не разглашать"
  rerank: true
  filters: {}

conditional: null

extraction:
  enabled: true
  mode: "hybrid"
  fields:
    - name: "definition_scope"
      type: "string"
      allowed_values:
        - "overbroad"
        - "balanced"
        - "narrow"
        - "unclear"

    - name: "has_standard_exceptions"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "confidentiality_term"
      type: "string"
      allowed_values:
        - "short"
        - "standard"
        - "long"
        - "perpetual"
        - "unclear"

    - name: "allows_disclosure_to_affiliates_and_advisors"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "allows_disclosure_for_dd_and_mna"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "overall_risk_level"
      type: "string"
      allowed_values:
        - "low"
        - "medium"
        - "high"

    - name: "reason"
      type: "string"

  store_payload: true

red_flags:
  items:
    - code: "CONF1"
      description: "Запрет на передачу информации покупателю/аффилированным лицам/консультантам без согласия."
    - code: "CONF2"
      description: "Чрезмерно широкий объём конфиденциальной информации без стандартных исключений."
