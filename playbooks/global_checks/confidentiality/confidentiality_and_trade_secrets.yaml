id: "confidentiality_and_trade_secrets"
name: "Конфиденциальность и коммерческая тайна"
description: >
  Анализирует определение конфиденциальной информации, срок конфиденциальности
  и выживающие обязанности, включая коммерческую тайну.
doc_types: []
severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"

rules:
  keywords:
    - "конфиденциальная информация"
    - "конфиденциальность"
    - "confidential information"
    - "confidentiality"
    - "коммерческая тайна"
    - "trade secret"
    - "не разглашать"
    - "non-disclosure"
    - "NDA"
  keyword_mode: "any"
  regex_patterns: []
  clause_patterns: []

llm:
  prompt_template: |
    Ты — юрист по коммерческим договорам и NDA.
    Тебе даны фрагменты договора с положениями о конфиденциальности.

    Определи:
    1) Как определена конфиденциальная информация:
       - чрезмерно широко (всё подряд) или разумно,
       - есть ли стандартные исключения (публичная информация,
         independently developed, полученная от третьих лиц без нарушения).
    2) Каков срок конфиденциальности:
       - во время действия договора и после него,
       - сколько лет после расторжения/истечения,
       - бессрочно для коммерческой тайны.
    3) Какие есть права на раскрытие:
       - аффилированным лицам,
       - консультантам, финансирующим банкам,
       - регуляторам, потенциальным покупателям (включая DD и пост-Closing).
    4) Насколько эти положения рискованны/ограничивающи для Target.

    Верни строго JSON:
    {{
      "definition_scope": "overbroad|balanced|narrow|unclear",
      "has_standard_exceptions": "yes|no|unclear",
      "confidentiality_term": "short|standard|long|perpetual|unclear",
      "allows_disclosure_to_affiliates_and_advisors": "yes|no|unclear",
      "allows_disclosure_for_dd_and_mna": "yes|no|unclear",
      "overall_risk_level": "low|medium|high",
      "reason": "краткое объяснение на русском"
    }}

    ЖЁСТКИЕ правила формата:
    - Выведи ТОЛЬКО один JSON-объект, без пояснений, комментариев и текста до или после.
    - Не пиши фразы вроде "Вот JSON", "Here is the JSON" и т.п.
    - Не используй Markdown, бэктики ``` и другие обёртки.
    - Все строки должны быть в двойных кавычках.
    - Ключи должны совпадать с указанными полями, без добавления новых.

    Начни ответ сразу с символа {{

    Не добавляй ничего, кроме JSON.
  prompt_file: null
  context_k: 4
  temperature: 0.0
  max_tokens: 640

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  context_k: 4
  max_chunks: 8
  boost_keywords:
    - "конфиденциальная информация"
    - "confidential information"
    - "коммерческая тайна"
    - "trade secret"
    - "не разглашать"
  rerank: true
  filters: {}

conditional: null

extraction:
  enabled: true
  mode: "hybrid"
  fields:
    - name: "definition_scope"
      type: "string"
    - name: "has_standard_exceptions"
      type: "string"
    - name: "confidentiality_term"
      type: "string"
    - name: "allows_disclosure_to_affiliates_and_advisors"
      type: "string"
    - name: "allows_disclosure_for_dd_and_mna"
      type: "string"
    - name: "overall_risk_level"
      type: "string"
    - name: "reason"
      type: "string"
  store_payload: true

red_flags:
  items:
    - code: "CONF1"
      description: "Запрет на передачу информации покупателю/аффилированным лицам/консультантам без согласия."
    - code: "CONF2"
      description: "Чрезмерно широкий объём конфиденциальной информации без стандартных исключений."
