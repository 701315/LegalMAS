id: "confidentiality_and_trade_secrets"
name: "Конфиденциальность и коммерческая тайна"
group: "Confidentiality"
description: >
  Screening-check: определяет наличие режима конфиденциальности
  в договоре (обязательства по неразглашению, NDA-положения,
  режим коммерческой тайны / trade secret) и извлекает срок
  действия обязательств по конфиденциальности.

  Детально анализируется только:
  - наличие / отсутствие требований к конфиденциальности;
  - срок (конкретный / бессрочный / по закону / не установлен).

  Детальный анализ исключений, допустимого раскрытия,
  маркировки, возврата / уничтожения информации и surviving
  obligations выполняется отдельными специализированными checks.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"
ui_mode: "field_extraction"

rules:
  keyword_mode: any

  keywords:
    high:
      - "(?i)confidential\\s+information"
      - "(?i)конфиденциальн[а-я]+\\s+информаци"
      - "(?i)proprietary\\s+information"
      - "(?i)служебн[а-я]+\\s+информаци"
      - "(?i)коммерческ[а-я]+\\s+тайн"
      - "(?i)trade\\s+secret"
      - "(?i)секрет\\s+производства"
      - "(?i)ноу[-\\s]?хау"
      - "(?i)know[-\\s]?how"
      - "(?i)\\bNDA\\b"
      - "(?i)non[-\\s]?disclosure\\s+agreement"
      - "(?i)соглашени[ея]\\s+о\\s+неразглашении"
      - "(?i)соглашени[ея]\\s+о\\s+конфиденциальност[ьи]"
      - "(?i)не\\s+разглашать"
      - "(?i)shall\\s+not\\s+disclose"
      - "(?i)обязательств[аоы]\\s+по\\s+конфиденциальност[ьи]"
      - "(?i)confidentiality\\s+obligations?"
      - "(?i)обязуется\\s+(сохранять|не\\s+раскрывать)\\s+(конфиденциальн)"
      - "(?i)surviv(e|ing|al)\\s+(termination|expiration)"
      - "(?i)shall\\s+remain\\s+in\\s+(full\\s+)?force[\\s\\S]{0,40}(confidential|конфиденциальн)"
      - "(?i)в\\s+течение[\\s\\S]{0,20}\\d+[\\s\\S]{0,20}(лет|год)[\\s\\S]{0,40}(прекращени|расторжени)"

    medium:
      - "(?i)confidentiality\\s+period"
      - "(?i)срок\\s+конфиденциальност[ьи]"
      - "(?i)for\\s+a\\s+period\\s+of\\s+\\d+\\s+years?"
      - "(?i)в\\s+течение\\s+\\d+\\s+(лет|год[а-я]*)"
      - "(?i)perpetual(ly)?"
      - "(?i)бессрочн[оа]"
      - "(?i)indefinite(ly)?"
      - "(?i)without\\s+time\\s+limit"
      - "(?i)без\\s+ограничения\\s+срока"
      - "(?i)does\\s+not\\s+include[\\s\\S]{0,30}(confidential|конфиденциальн)"
      - "(?i)не\\s+является\\s+конфиденциальн"
      - "(?i)publicly\\s+(available|known)"
      - "(?i)общедоступн[а-я]+\\s+информаци"
      - "(?i)independently\\s+developed"
      - "(?i)received\\s+from\\s+(a\\s+)?third\\s+party"
      - "(?i)получен[аоы]?\\s+от\\s+третьих\\s+лиц"
      - "(?i)disclose\\s+to\\s+(its?\\s+)?(affiliates?|advisors?|consultants?)"
      - "(?i)раскры(ть|тие|вать)\\s+(аффилированн[а-я]+|консультант|советник)"
      - "(?i)permitted\\s+disclosure"
      - "(?i)разрешённое\\s+раскрытие"
      - "(?i)due\\s+diligence"
      - "(?i)potential\\s+(buyer|investor|acquirer)"
      - "(?i)потенциальн[а-я]+\\s+(покупател|инвестор)"

    low:
      - "(?i)confidential"
      - "(?i)конфиденциальн"
      - "(?i)non[-\\s]?disclosure"
      - "(?i)неразглашени"
      - "(?i)secret"
      - "(?i)тайн[аы]"
      - "(?i)sensitive\\s+information"
      - "(?i)disclosure"
      - "(?i)раскрыти[ея]"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 700

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  retrieval_profile: "confidentiality_check"
  context_k: 6
  max_chunks: 10

  retrieval_query: >
    конфиденциальная информация обязательства по конфиденциальности
    не разглашать срок конфиденциальности бессрочно
    confidential information non-disclosure NDA trade secret
    коммерческая тайна surviving obligations

  boost_keywords:
    - "конфиденциальная информация"
    - "confidential information"
    - "обязательства по конфиденциальности"
    - "confidentiality obligations"
    - "коммерческая тайна"
    - "trade secret"
    - "NDA"
    - "non-disclosure"
    - "не разглашать"
    - "shall not disclose"
    - "срок конфиденциальности"
    - "confidentiality period"
    - "бессрочно"
    - "perpetual"
    - "survives termination"
    - "сохраняет силу после прекращения"

  negative_keywords:
    - "означает"
    - "в целях настоящего"
    - "споры"
    - "подсудность"
    - "применимое право"
    - "смена контроля"
    - "уступка прав"
    - "перевод долга"

  preferred_unit_types:
    - "confidentiality"
    - "obligation"
    - "general_provision"

  excluded_unit_types:
    - "definition"
    - "structural_anchor"
    - "technical_fragment"
    - "appendix_reference"

  preferred_clause_functions:
    - "obligations"
    - "limitations"

  position_bias:
    preferred_range: [0.45, 1.00]
    boost: 0.25
    scope: "segment"

  rerank: true
  filters: {}

conditional: null

enrichment_hints:
  preferred_segment_types:
    - "contract"
    - "amendment"
    - "annex"
  excluded_segment_types:
    - "technical_specification"
    - "price_list"
    - "invoice"
    - "act"
  confidence_bonus_on_match: 0.10
  confidence_penalty_on_excluded_segment: 0.15

extraction:
  enabled: true
  mode: "hybrid"
  llm_max_tokens: 850

  llm_prompt_extraction: |
    <role>
    Ты — юрист по коммерческим договорам.
    Твоя задача — точно извлечь из текста:
    1) есть ли в договоре требования к конфиденциальности;
    2) если есть — какой срок конфиденциальности установлен.

    КРИТИЧЕСКИ ВАЖНО:
    - Извлекай ТОЛЬКО то, что прямо написано в тексте.
    - НЕ выводи срок из общих норм закона или рыночных практик.
    - НЕ считай общую фразу о "защите информации" автоматически
      режимом конфиденциальности без явного запрета на раскрытие.
    - Если срок не установлен явно — используй "not_specified",
      а не предполагаемый срок.

    Не анализируй детально определение конфиденциальной информации,
    исключения, маркировку, допустимое раскрытие третьим лицам
    или порядок возврата / уничтожения — это задача других checks.
    </role>

    <context>
    Ниже приведены релевантные фрагменты договора:

    {context}
    </context>

    <context_rules>
    - Некоторые фрагменты могут быть нерелевантны — игнорируй их.
    - Если фрагменты противоречат друг другу — используй "unclear"
      и кратко объясни в reason.
    - Режим конфиденциальности = есть явный запрет раскрытия
      или обязательство хранить тайну. Простая ссылка на то,
      что информация является конфиденциальной, без обязательств —
      это "present", но слабый.
    - Срок считай "contract_specified" только если есть конкретное
      число лет / месяцев, явно привязанное к конфиденциальности.
    - "Perpetual" — только при явном указании бессрочности
      (perpetually, indefinitely, бессрочно, без ограничения срока).
    </context_rules>

    <task>
    Заполни только следующие поля:
    - confidentiality_display
    - confidentiality_status
    - confidentiality_term_regime
    - confidentiality_term_value
    - confidentiality_term_display
    - reason
    </task>

    <instructions>
    Шаг 1 — НАЛИЧИЕ ТРЕБОВАНИЙ К КОНФИДЕНЦИАЛЬНОСТИ

    Заполни "confidentiality_status".

    Значения:
    - "present" — есть любые обязательства по конфиденциальности:
      запрет на раскрытие, NDA-положения, режим коммерческой тайны.
    - "missing" — договор явно не содержит никаких требований.
    - "unclear" — фрагменты не позволяют уверенно определить.

    Шаг 2 — РЕЖИМ СРОКА КОНФИДЕНЦИАЛЬНОСТИ

    Заполни "confidentiality_term_regime".

    Значения:
    - "contract_specified" — прямо установлен конкретный срок.
    - "perpetual" — прямо указана бессрочность.
    - "applicable_law_reference" — срок прямо отсылается к закону.
    - "not_specified" — срок не установлен и нет прямой отсылки.
    - "unclear" — нельзя определить.

    Если confidentiality_status = "missing":
    * confidentiality_term_regime = "not_specified"

    Шаг 3 — КОНКРЕТНЫЙ СРОК

    Заполни "confidentiality_term_value".

    Правила:
    - Если regime = "contract_specified":
      только сам срок, без объяснений.
      Примеры: "2 года", "5 лет", "36 месяцев",
      "3 года после прекращения договора".
      Если разные сроки для разных типов информации:
      "5 лет для коммерческой тайны; 2 года для прочей"
    - Если regime ≠ "contract_specified": ""

    Шаг 4 — USER-FACING СРОК ДЛЯ DD GRID

    Заполни "confidentiality_term_display".

    Правила:
    - regime = "contract_specified":
      повтори значение из confidentiality_term_value
    - regime = "perpetual": "Бессрочно"
    - regime = "applicable_law_reference":
      "Определяется применимым правом"
    - regime = "not_specified": "Срок не установлен"
    - regime = "unclear": "Не удалось определить"

    Шаг 5 — НОРМАЛИЗОВАННЫЙ DISPLAY ДЛЯ DD GRID

    Заполни "confidentiality_display".

    Это итоговое поле для таблицы.
    Строй его ТОЛЬКО на основе уже заполненных полей выше.
    Не добавляй информацию сверх них.

    Возможные состояния:
    1. Требования есть, срок указан:
       "Обязательства по конфиденциальности предусмотрены;
        срок — 3 года после прекращения"
    2. Требования есть, бессрочно:
       "Обязательства по конфиденциальности предусмотрены;
        бессрочно"
    3. Требования есть, срок не установлен:
       "Обязательства по конфиденциальности предусмотрены;
        срок не установлен"
    4. Требований нет:
       "Требования к конфиденциальности не установлены"
    5. Не удалось определить:
       "Не удалось определить"

    Правила:
    - Если status = "missing":
      "Требования к конфиденциальности не установлены"
    - Если status = "unclear":
      "Не удалось определить"
    - Если status = "present":
      "Обязательства по конфиденциальности предусмотрены; {confidentiality_term_display}"

    Шаг 6 — КРАТКОЕ ОБОСНОВАНИЕ

    Заполни "reason".

    Правила:
    - Первое предложение — вывод по наличию режима.
    - Второе — вывод по сроку + цитата (до 100 символов).
    - Пиши по-русски.
    - Не оценивай риск, не выставляй оценки.
    </instructions>

    <edge_cases>
    - Общая фраза о конфиденциальности без срока:
      * confidentiality_status = "present"
      * confidentiality_term_regime = "not_specified"
      * confidentiality_term_value = ""
      * confidentiality_term_display = "Срок не установлен"

    - Trade secrets бессрочно, прочая информация — 3 года:
      * confidentiality_term_regime = "contract_specified"
      * confidentiality_term_value =
        "Бессрочно для коммерческой тайны; 3 года для прочей"
      * confidentiality_term_display =
        "Бессрочно для коммерческой тайны; 3 года для прочей"

    - "Perpetual" / "indefinitely" для всей информации:
      * confidentiality_term_regime = "perpetual"
      * confidentiality_term_value = ""
      * confidentiality_term_display = "Бессрочно"

    - Нет требований к конфиденциальности:
      * confidentiality_status = "missing"
      * confidentiality_term_regime = "not_specified"
      * confidentiality_term_value = ""
      * confidentiality_term_display = "Срок не установлен"
      * confidentiality_display =
        "Требования к конфиденциальности не установлены"

    - Нет релевантных фрагментов:
      * confidentiality_status = "unclear"
      * confidentiality_term_regime = "unclear"
      * confidentiality_term_value = ""
      * confidentiality_term_display = "Не удалось определить"
      * confidentiality_display = "Не удалось определить"
    </edge_cases>

    <output_expectations>
    - Верни результат строго в формате JSON.
    - Не оборачивай ответ в markdown-блоки.
    - Не добавляй комментариев вне JSON.
    - Для полей с allowed_values используй строго значения из списка.
    - Свободные текстовые поля
      (confidentiality_display, confidentiality_term_value,
       confidentiality_term_display, reason)
      заполняй на русском языке.
    - Не добавляй никаких полей, кроме указанных.

    Пример структуры ответа:
    {
      "confidentiality_display": "Обязательства по конфиденциальности предусмотрены; срок — 3 года после прекращения",
      "confidentiality_status": "present",
      "confidentiality_term_regime": "contract_specified",
      "confidentiality_term_value": "3 года после прекращения договора",
      "confidentiality_term_display": "3 года после прекращения договора",
      "reason": "..."
    }
    </output_expectations>

  fields:
    - name: "confidentiality_display"
      type: "string"
      presentation: "fact"
      label: "Конфиденциальность"
      description: "Нормализованный user-facing вывод для DD Grid"
      display_in_grid: true
      display_priority: 1

    - name: "confidentiality_status"
      type: "string"
      presentation: "signal"
      description: "Наличие требований к конфиденциальности"
      allowed_values:
        - "present"
        - "missing"
        - "unclear"
      display_in_grid: false

    - name: "confidentiality_term_regime"
      type: "string"
      presentation: "signal"
      description: "Режим срока конфиденциальности"
      allowed_values:
        - "contract_specified"
        - "perpetual"
        - "applicable_law_reference"
        - "not_specified"
        - "unclear"
      display_in_grid: false

    - name: "confidentiality_term_value"
      type: "string"
      presentation: "fact"
      label: "Срок конфиденциальности"
      description: "Конкретный срок (если установлен)"
      display_in_grid: false

    - name: "confidentiality_term_display"
      type: "string"
      presentation: "fact"
      label: "Срок"
      description: "Срок конфиденциальности для DD Grid"
      display_in_grid: true
      display_priority: 2

    - name: "reason"
      type: "string"
      presentation: "diagnostic"
      description: "Обоснование"
      display_in_grid: false

  store_payload: true

  
