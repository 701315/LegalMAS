id: "confidentiality_and_trade_secrets"
name: "Конфиденциальность и коммерческая тайна"
description: >
  Анализирует режим конфиденциальности и защиты коммерческой тайны:
  определение конфиденциальной информации, стандартные исключения,
  срок действия обязательств, разрешённое раскрытие (аффилированные
  лица, консультанты, M&A/DD), требования к маркировке, обязательства
  по возврату/уничтожению информации, surviving obligations.
  Оценивает риски для операционной деятельности и сделок M&A.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"

rules:
  keyword_mode: any

  keywords:
    high:
      # Конфиденциальная информация — точные формулы
      - "(?i)confidential\\s+information"
      - "(?i)конфиденциальн[а-я]+\\s+информаци"
      - "(?i)proprietary\\s+information"
      - "(?i)служебн[а-я]+\\s+информаци"

      # Коммерческая тайна
      - "(?i)trade\\s+secret"
      - "(?i)коммерческ[а-я]+\\s+тайн"
      - "(?i)секрет\\s+производства"
      - "(?i)ноу[-\\s]?хау"
      - "(?i)know[-\\s]?how"

      # NDA / non-disclosure
      - "(?i)\\bNDA\\b"
      - "(?i)non[-\\s]?disclosure\\s+agreement"
      - "(?i)соглашени[ея]\\s+о\\s+неразглашении"
      - "(?i)соглашени[ея]\\s+о\\s+конфиденциальност[ьи]"

      # Обязательства по конфиденциальности
      - "(?i)не\\s+разглашать"
      - "(?i)shall\\s+not\\s+disclose"
      - "(?i)обязательств[аоы]\\s+по\\s+конфиденциальност[ьи]"
      - "(?i)confidentiality\\s+obligations?"

      # Surviving / выживающие обязательства
      - "(?i)surviv(e|ing|al)\\s+(termination|expiration)"
      - "(?i)(после|при)\\s+прекращени[ияе]\\s+договора"
      - "(?i)shall\\s+remain\\s+in\\s+(full\\s+)?force"

    medium:
      # Исключения из конфиденциальности
      - "(?i)excluding\\s+(information|данные)"
      - "(?i)исключени[яе]\\s+из\\s+(режима\\s+)?конфиденциальност[ьи]"
      - "(?i)does\\s+not\\s+include"
      - "(?i)не\\s+является\\s+конфиденциальн"
      - "(?i)publicly\\s+(available|known)"
      - "(?i)общедоступн[а-я]+\\s+информаци"
      - "(?i)independently\\s+developed"
      - "(?i)независимо\\s+разработан"
      - "(?i)received\\s+from\\s+(a\\s+)?third\\s+party"
      - "(?i)получен[аоы]?\\s+от\\s+третьих\\s+лиц"

      # Срок конфиденциальности
      - "(?i)confidentiality\\s+period"
      - "(?i)срок\\s+конфиденциальност[ьи]"
      - "(?i)for\\s+a\\s+period\\s+of\\s+\\d+\\s+years?"
      - "(?i)в\\s+течение\\s+\\d+\\s+(лет|год[а-я]*)"
      - "(?i)perpetual(ly)?"
      - "(?i)бессрочн[оа]"
      - "(?i)indefinite(ly)?"

      # Раскрытие третьим лицам
      - "(?i)disclose\\s+to\\s+(its?\\s+)?(affiliates?|advisors?|consultants?)"
      - "(?i)раскры(ть|тие|вать)\\s+(аффилированн[а-я]+|консультант|советник)"
      - "(?i)permitted\\s+disclosure"
      - "(?i)разрешённое\\s+раскрытие"
      - "(?i)due\\s+diligence"
      - "(?i)potential\\s+(buyer|investor|acquirer)"
      - "(?i)потенциальн[а-я]+\\s+(покупател|инвестор)"

      # Маркировка
      - "(?i)marked\\s+(as\\s+)?confidential"
      - "(?i)помечен[аоы]?\\s+как\\s+конфиденциальн"
      - "(?i)labeling\\s+requirement"
      - "(?i)требовани[ея]\\s+к\\s+маркировк[еи]"

      # Возврат / уничтожение
      - "(?i)return\\s+or\\s+destroy"
      - "(?i)вернуть\\s+(или|и)\\s+уничтожить"
      - "(?i)destruction\\s+of\\s+confidential"
      - "(?i)уничтожени[ея]\\s+конфиденциальн"

    low:
      # Общие термины
      - "(?i)confidential"
      - "(?i)конфиденциальн"
      - "(?i)secret"
      - "(?i)тайн[аы]"
      - "(?i)disclosure"
      - "(?i)раскрыти[ея]"
      - "(?i)non[-\\s]?disclosure"
      - "(?i)неразглашени"
      - "(?i)protect(ion)?"
      - "(?i)защит"
      - "(?i)sensitive"
      - "(?i)чувствительн"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 700

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  context_k: 5
  max_chunks: 10
  boost_keywords:
    - "confidential information"
    - "конфиденциальная информация"
    - "proprietary information"
    - "trade secret"
    - "коммерческая тайна"
    - "NDA"
    - "non-disclosure"
    - "неразглашение"
    - "не разглашать"
    - "confidentiality obligations"
    - "обязательства по конфиденциальности"
    - "excluding information"
    - "исключения из конфиденциальности"
    - "publicly available"
    - "общедоступная информация"
    - "confidentiality period"
    - "срок конфиденциальности"
    - "perpetual"
    - "бессрочно"
    - "disclose to affiliates"
    - "раскрытие аффилированным лицам"
    - "due diligence"
    - "potential buyer"
    - "потенциальный покупатель"
    - "return or destroy"
    - "вернуть или уничтожить"
    - "marked as confidential"
    - "surviving obligations"
  rerank: true
  filters: {}

conditional: null

extraction:
  llm_prompt_extraction: |
    <role>
    Ты — юрист по коммерческим договорам и NDA.
    Твоя специализация — анализ положений о конфиденциальности
    и коммерческой тайне в B2B-контрактах, сделках M&A и DD.
    </role>

    <context>
    Ниже приведены фрагменты договора с положениями
    о конфиденциальности и (при наличии) коммерческой тайне:

    {context}
    </context>

    <instructions>
    Проведи анализ по шагам. Каждый шаг логически соответствует одному
    или нескольким полям итоговой оценки риска.

    Шаг 1 — ОПРЕДЕЛЕНИЕ КОНФИДЕНЦИАЛЬНОЙ ИНФОРМАЦИИ
    (используется для заполнения поля "definition_scope"):
    - Определи, насколько широко или узко сформулировано определение
      конфиденциальной информации:
      * "overbroad" — охватывает «любую информацию в любой форме»
        без разумной связи с договором/бизнесом;
      * "balanced" — разумно привязано к предмету договора,
        с типичным описанием видов информации;
      * "narrow" — чрезмерно узко, защищает только ограниченный
        набор данных;
      * "unclear" — определение отсутствует или неясно.

    Шаг 2 — ТРЕБОВАНИЯ К МАРКИРОВКЕ
    (используется для заполнения поля "marking_required"):
    - Определи, требуется ли маркировка информации как условие
      её защиты:
      * "yes" — информация защищается только если помечена
        как «конфиденциальная»;
      * "no" — защита не зависит от маркировки;
      * "partial" — маркировка требуется для письменной информации,
        но есть исключения для устной;
      * "unclear" — не определено.

    Шаг 3 — СТАНДАРТНЫЕ ИСКЛЮЧЕНИЯ
    (используется для заполнения поля "has_standard_exceptions"):
    - Проверь наличие стандартных исключений:
      * общедоступная информация (publicly available);
      * информация, известная получателю до раскрытия;
      * информация, независимо разработанная получателем;
      * информация, полученная от третьих лиц без нарушения;
      * информация, раскрытая по требованию закона/суда.
    - Оцени:
      * "yes" — полный или почти полный набор исключений;
      * "partial" — некоторые исключения отсутствуют;
      * "no" — исключения не предусмотрены;
      * "unclear" — неясно.

    Шаг 4 — СРОК КОНФИДЕНЦИАЛЬНОСТИ
    (используется для заполнения поля "confidentiality_term"):
    - Определи срок действия обязательств по конфиденциальности
      ПОСЛЕ прекращения договора:
      * "short" — менее 2 лет;
      * "standard" — 2–5 лет;
      * "long" — более 5 лет, но не бессрочно;
      * "perpetual" — бессрочно (обычно для trade secrets);
      * "unclear" — срок не указан или неясен.
    - Если сроки различаются для обычной информации и коммерческой
      тайны — опиши в term_description.

    Шаг 5 — РАЗРЕШЁННОЕ РАСКРЫТИЕ
    (используется для заполнения полей "allows_disclosure_to_affiliates_advisors"):
    - Определи, допускается ли раскрытие:
      * аффилированным лицам, консультантам, аудиторам, банкам
        (при условии соблюдения ими режима конфиденциальности);
      * потенциальным покупателям/инвесторам в рамках M&A/DD.
    - Для каждого аспекта оцени: "yes" / "no" / "unclear".

    Шаг 6 — ВОЗВРАТ / УНИЧТОЖЕНИЕ ИНФОРМАЦИИ
    (используется для заполнения поля "return_destruction_obligation"):
    - Определи, есть ли обязательство вернуть и/или уничтожить
      конфиденциальную информацию после расторжения договора
      или по запросу:
      * "return_and_destroy" — оба обязательства;
      * "return_only" — только возврат;
      * "destroy_only" — только уничтожение;
      * "at_option" — на выбор раскрывающей стороны;
      * "no" — обязательство отсутствует;
      * "unclear" — не определено.

    Шаг 7 — ВЗАИМНОСТЬ РЕЖИМА
    (используется для заполнения поля "mutual_obligations"):
    - Определи, являются ли обязательства по конфиденциальности
      взаимными:
      * "mutual" — обе стороны связаны одинаковыми обязательствами;
      * "one_sided_target" — только Target обязан
        (невыгодно для Target);
      * "one_sided_counterparty" — только контрагент обязан
        (выгодно для Target);
      * "unclear" — не определено.

    Шаг 8 — RED FLAGS
    (используется для заполнения поля "red_flags"):
    Присвой один или несколько кодов из списка ниже.
    Если ни один код не применим — верни "NONE".
    Если данных недостаточно для оценки — верни "UNCLEAR".

    Коды:
    • CONF1 — Запрет на раскрытие информации потенциальным
      покупателям/инвесторам без согласия — осложняет M&A/DD.
    • CONF2 — Чрезмерно широкое определение без стандартных
      исключений — риск нарушения при обычной деятельности.
    • CONF3 — Слишком короткий срок конфиденциальности (< 2 лет)
      — недостаточная защита информации Target.
    • CONF4 — Бессрочная конфиденциальность для всей информации
      (не только trade secrets) — чрезмерное обременение.
    • CONF5 — Маркировка как условие защиты — риск потери защиты
      при отсутствии маркировки.
    • CONF6 — Отсутствие обязательства вернуть/уничтожить
      информацию после расторжения.
    • CONF7 — Односторонний режим — только Target обязан соблюдать
      конфиденциальность, контрагент не связан.

    Формат ответа: коды через запятую без комментариев
    (например: "CONF1, CONF2").
    Вся аргументация — в поле reason.

    Шаг 9 — ОБОСНОВАНИЕ
    (используется для заполнения поля "reason"):

    - В reason кратко обоснуй вывод, опираясь на ключевые
      формулировки из текста (с цитатами в кавычках), и укажи:
      * как сформулировано определение;
      * какие исключения предусмотрены;
      * каков срок конфиденциальности;
      * разрешено ли раскрытие для M&A/DD;
      * если выставлены red_flags — обоснуй каждый код;
      * если red_flags = "NONE" — укажи, почему режим
        комфортен для Target.
    </instructions>

    <edge_cases>
    Обрабатывай пограничные ситуации так:

    - Только общая фраза «Стороны обязуются соблюдать
      конфиденциальность» без определения, исключений и срока:
      definition_scope = "unclear";
      has_standard_exceptions = "unclear";
      confidentiality_term = "unclear";
      red_flags может включать "UNCLEAR" или набор рисков
      в зависимости от контекста; в reason укажи, что
      размытость режима сама по себе создаёт риск.

    - Для trade secrets — бессрочный срок, для остальной
      информации — ограниченный:
      confidentiality_term = выбери по основной массе информации;
      в term_description опиши разделение; если бессрочность
      только для trade secrets — это не CONF4.

    - Запрещено раскрытие для M&A/DD без согласия:
      allows_disclosure_for_mna_dd = "with_consent" или "no";
      зафиксируй CONF1; в reason укажи, что это осложняет
      выход/продажу.

    - Маркировка требуется для письменной информации, но
      устная защищается без маркировки:
      marking_required = "partial";
      CONF5 может быть уместен — оцени по существу риска.

    - Односторонний режим: только Target обязан, контрагент
      свободен:
      mutual_obligations = "one_sided_target";
      зафиксируй CONF7.

    - Пустые или явно нерелевантные фрагменты:
      red_flags = "UNCLEAR"; в reason укажи, что режим
      конфиденциальности не определён в доступных фрагментах.
    </edge_cases>

    <output_expectations>
    На основе твоего анализа отдельный механизм извлечения сформирует
    структурированные поля по заранее заданной схеме. Твоя задача —
    давать чёткие юридические выводы и указывать конкретные
    формулировки из текста, на которых они основаны.
    </output_expectations>

  enabled: true
  mode: "hybrid"
  fields:
    - name: "definition_scope"
      type: "string"
      allowed_values:
        - "overbroad"
        - "balanced"
        - "narrow"
        - "unclear"

    - name: "marking_required"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "partial"
        - "unclear"

    - name: "has_standard_exceptions"
      type: "string"
      allowed_values:
        - "yes"
        - "partial"
        - "no"
        - "unclear"

    - name: "confidentiality_term"
      type: "string"
      allowed_values:
        - "short"
        - "standard"
        - "long"
        - "perpetual"
        - "unclear"

    - name: "allows_disclosure_to_affiliates_advisors"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "with_consent"
        - "unclear"

    - name: "return_destruction_obligation"
      type: "string"
      allowed_values:
        - "return_and_destroy"
        - "return_only"
        - "destroy_only"
        - "at_option"
        - "no"
        - "unclear"

    - name: "mutual_obligations"
      type: "string"
      allowed_values:
        - "mutual"
        - "one_sided_target"
        - "one_sided_counterparty"
        - "unclear"

    - name: "red_flags"
      type: "string"

    - name: "reason"
      type: "string"

  store_payload: true

red_flags:
  items:
    - code: "CONF1"
      description: >
        Запрет на раскрытие информации потенциальным покупателям/
        инвесторам без согласия — осложняет M&A и DD.
    - code: "CONF2"
      description: >
        Чрезмерно широкое определение конфиденциальной информации
        без стандартных исключений — риск нарушения при обычной
        деятельности.
    - code: "CONF3"
      description: >
        Слишком короткий срок конфиденциальности (< 2 лет) —
        недостаточная защита информации Target.
    - code: "CONF4"
      description: >
        Бессрочная конфиденциальность для всей информации
        (не только trade secrets) — чрезмерное обременение.
    - code: "CONF5"
      description: >
        Маркировка как условие защиты — риск потери защиты
        при отсутствии маркировки.
    - code: "CONF6"
      description: >
        Отсутствие обязательства вернуть/уничтожить конфиденциальную
        информацию после расторжения.
    - code: "CONF7"
      description: >
        Односторонний режим — только Target обязан соблюдать
        конфиденциальность, контрагент не связан.
