id: "confidentiality_and_trade_secrets"
name: "Конфиденциальность и коммерческая тайна"
description: >
  Анализирует режим конфиденциальности и защиты коммерческой тайны:
  определение конфиденциальной информации, стандартные исключения,
  срок действия обязательств, разрешённое раскрытие (аффилированные
  лица, консультанты, M&A/DD), требования к маркировке, обязательства
  по возврату/уничтожению информации, surviving obligations.
  Оценивает риски для операционной деятельности и сделок M&A.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"

rules:
  keyword_mode: any

  keywords:
    high:
      # Конфиденциальная информация — точные формулы
      - "(?i)confidential\\s+information"
      - "(?i)конфиденциальн[а-я]+\\s+информаци"
      - "(?i)proprietary\\s+information"
      - "(?i)служебн[а-я]+\\s+информаци"
      - "(?i)конфиденциальн[а-я]*"           # <-- РАСШИРИТЬ
      - "(?i)не\\s+разглашать"               # <-- УЖЕ ЕСТЬ, ДОЛЖНО РАБОТАТЬ
      - "(?i)коммерческ[а-я]+\\s+тайн"

      # Коммерческая тайна
      - "(?i)trade\\s+secret"
      - "(?i)коммерческ[а-я]+\\s+тайн"
      - "(?i)секрет\\s+производства"
      - "(?i)ноу[-\\s]?хау"
      - "(?i)know[-\\s]?how"

      # NDA / non-disclosure
      - "(?i)\\bNDA\\b"
      - "(?i)non[-\\s]?disclosure\\s+agreement"
      - "(?i)соглашени[ея]\\s+о\\s+неразглашении"
      - "(?i)соглашени[ея]\\s+о\\s+конфиденциальност[ьи]"

      # Обязательства по конфиденциальности
      - "(?i)не\\s+разглашать"
      - "(?i)shall\\s+not\\s+disclose"
      - "(?i)обязательств[аоы]\\s+по\\s+конфиденциальност[ьи]"
      - "(?i)confidentiality\\s+obligations?"

      # Surviving / выживающие обязательства
      - "(?i)surviv(e|ing|al)\\s+(termination|expiration)"
      - "(?i)(после|при)\\s+прекращени[ияе]\\s+договора"
      - "(?i)shall\\s+remain\\s+in\\s+(full\\s+)?force"

    medium:
      # Исключения из конфиденциальности
      - "(?i)excluding\\s+(information|данные)"
      - "(?i)исключени[яе]\\s+из\\s+(режима\\s+)?конфиденциальност[ьи]"
      - "(?i)does\\s+not\\s+include"
      - "(?i)не\\s+является\\s+конфиденциальн"
      - "(?i)publicly\\s+(available|known)"
      - "(?i)общедоступн[а-я]+\\s+информаци"
      - "(?i)independently\\s+developed"
      - "(?i)независимо\\s+разработан"
      - "(?i)received\\s+from\\s+(a\\s+)?third\\s+party"
      - "(?i)получен[аоы]?\\s+от\\s+третьих\\s+лиц"

      # Срок конфиденциальности
      - "(?i)confidentiality\\s+period"
      - "(?i)срок\\s+конфиденциальност[ьи]"
      - "(?i)for\\s+a\\s+period\\s+of\\s+\\d+\\s+years?"
      - "(?i)в\\s+течение\\s+\\d+\\s+(лет|год[а-я]*)"
      - "(?i)perpetual(ly)?"
      - "(?i)бессрочн[оа]"
      - "(?i)indefinite(ly)?"

      # Раскрытие третьим лицам
      - "(?i)disclose\\s+to\\s+(its?\\s+)?(affiliates?|advisors?|consultants?)"
      - "(?i)раскры(ть|тие|вать)\\s+(аффилированн[а-я]+|консультант|советник)"
      - "(?i)permitted\\s+disclosure"
      - "(?i)разрешённое\\s+раскрытие"
      - "(?i)due\\s+diligence"
      - "(?i)potential\\s+(buyer|investor|acquirer)"
      - "(?i)потенциальн[а-я]+\\s+(покупател|инвестор)"

      # Маркировка
      - "(?i)marked\\s+(as\\s+)?confidential"
      - "(?i)помечен[аоы]?\\s+как\\s+конфиденциальн"
      - "(?i)labeling\\s+requirement"
      - "(?i)требовани[ея]\\s+к\\s+маркировк[еи]"

      # Возврат / уничтожение
      - "(?i)return\\s+or\\s+destroy"
      - "(?i)вернуть\\s+(или|и)\\s+уничтожить"
      - "(?i)destruction\\s+of\\s+confidential"
      - "(?i)уничтожени[ея]\\s+конфиденциальн"

    low:
      # Общие термины
      - "(?i)confidential"
      - "(?i)конфиденциальн"
      - "(?i)secret"
      - "(?i)тайн[аы]"
      - "(?i)disclosure"
      - "(?i)раскрыти[ея]"
      - "(?i)non[-\\s]?disclosure"
      - "(?i)неразглашени"
      - "(?i)protect(ion)?"
      - "(?i)защит"
      - "(?i)sensitive"
      - "(?i)чувствительн"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 700

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  context_k: 5
  max_chunks: 10
  boost_keywords:
    - "confidential information"
    - "конфиденциальная информация"
    - "proprietary information"
    - "trade secret"
    - "коммерческая тайна"
    - "NDA"
    - "non-disclosure"
    - "неразглашение"
    - "не разглашать"
    - "confidentiality obligations"
    - "обязательства по конфиденциальности"
    - "excluding information"
    - "исключения из конфиденциальности"
    - "publicly available"
    - "общедоступная информация"
    - "confidentiality period"
    - "срок конфиденциальности"
    - "perpetual"
    - "бессрочно"
    - "disclose to affiliates"
    - "раскрытие аффилированным лицам"
    - "due diligence"
    - "potential buyer"
    - "потенциальный покупатель"
    - "return or destroy"
    - "вернуть или уничтожить"
    - "marked as confidential"
    - "surviving obligations"
    - "сохранять конфиденциальность"         # <-- ДОБАВИТЬ
  rerank: true
  filters: {}

conditional: null

extraction:
  llm_max_tokens: 400
  llm_prompt_extraction: |
    <role>
    Ты — юрист по коммерческим договорам.
    Твоя задача — не оценивать риск, а точно извлечь из текста:
    1) есть ли в договоре требования к конфиденциальности;
    2) если есть — какой срок конфиденциальности установлен.
    </role>

    <context>
    Ниже приведены релевантные фрагменты договора:

    {context}
    </context>

    <task>
    Заполни только следующие поля:
    - confidentiality_status
    - confidentiality_value
    - confidentiality_term_regime
    - confidentiality_term_value
    - confidentiality_term_display
    - reason

    Важно:
    - не оценивай риск и не выставляй red flags;
    - не анализируй определение, исключения, маркировку,
      взаимность или возврат информации;
    - если срок не указан явно, не выводи его из закона
      или общих принципов;
    - пиши user-facing значения коротко и по-русски.
    </task>

    <instructions>
    Шаг 1 — ОПРЕДЕЛИ НАЛИЧИЕ ТРЕБОВАНИЙ К КОНФИДЕНЦИАЛЬНОСТИ
    Заполни поля "confidentiality_status" и "confidentiality_value".

    Правила для confidentiality_status:
    - "present" — если договор содержит любые обязательства
      по конфиденциальности, NDA-положения, запрет на раскрытие
      информации, режим коммерческой тайны или ссылку на то,
      что информация является конфиденциальной.
    - "missing" — если договор явно не содержит никаких
      требований к конфиденциальности.
    - "unclear" — если фрагменты не позволяют уверенно
      определить наличие или отсутствие таких требований.

    Правила для confidentiality_value:
    - Возвращай одно из следующих значений:
      * "Обязательства по конфиденциальности предусмотрены"
      * "Требования к конфиденциальности не установлены"
      * "Не удалось определить"
    - Выбирай значение строго в соответствии
      с confidentiality_status.

    Шаг 2 — ОПРЕДЕЛИ СРОК КОНФИДЕНЦИАЛЬНОСТИ
    Заполни поля "confidentiality_term_regime",
    "confidentiality_term_value", "confidentiality_term_display".

    Под сроком конфиденциальности понимай:
    - срок действия обязательств по конфиденциальности
      после прекращения / расторжения договора;
    - срок действия обязательств в период действия договора,
      если он прямо указан отдельно;
    - любое явное указание на бессрочность или perpetual
      confidentiality.

    Правила для confidentiality_term_regime:
    - "contract_specified" — если договор прямо устанавливает
      конкретный срок в годах, месяцах или иных единицах.
    - "perpetual" — если договор прямо говорит, что обязательства
      по конфиденциальности бессрочны ("perpetually",
      "indefinitely", "бессрочно", "без ограничения срока").
    - "applicable_law_reference" — если договор не называет
      конкретный срок, но прямо указывает, что срок определяется
      законом / применимым правом.
    - "not_specified" — если срок не установлен и нет прямой
      отсылки к закону.
    - "unclear" — если по фрагментам нельзя уверенно определить
      режим срока.

    Правила для confidentiality_term_value:
    - Если confidentiality_term_regime = "contract_specified":
      указывай только сам срок без объяснений.
      Примеры: "2 года", "5 лет", "36 месяцев".
    - Если срок отсчитывается от момента прекращения договора,
      укажи это: "3 года после прекращения договора".
    - Если установлены разные сроки для разных типов
      информации, перечисли кратко через ";":
      "5 лет для коммерческой тайны; 2 года для прочей
      информации".
    - Если confidentiality_term_regime не равен
      "contract_specified", оставь поле пустым.

    Правила для confidentiality_term_display:
    - Поле должно быть коротким и понятным пользователю.
    - Если срок прямо установлен:
      * "2 года с момента прекращения договора"
      * "5 лет"
      * "5 лет для коммерческой тайны; 2 года для прочей
        информации"
    - Если бессрочно:
      "Бессрочно"
    - Если срок определяется законом:
      "Определяется применимым правом"
    - Если срок не установлен:
      "Срок не установлен"
    - Если определить нельзя:
      "Не удалось определить"

    Важно:
    - Если confidentiality_status = "missing" или "unclear",
      то поля срока должны быть:
      * confidentiality_term_regime = "not_specified"
        или "unclear" — по контексту;
      * confidentiality_term_value = "";
      * confidentiality_term_display = "Срок не установлен"
        или "Не удалось определить".

    Шаг 3 — КРАТКО ОБОСНУЙ ВЫВОД
    Заполни поле "reason".

    Правила:
    - 1–2 коротких предложения.
    - Укажи отдельно вывод по наличию режима конфиденциальности
      и по сроку.
    - Приведи краткую цитату из текста в кавычках.
    - Не анализируй риск, не выставляй оценки.
    </instructions>

    <edge_cases>
    - Если договор содержит только общую фразу о конфиденциальности
      без определения и срока:
      * confidentiality_status = "present"
      * confidentiality_term_regime = "not_specified"
      * confidentiality_term_display = "Срок не установлен"

    - Если срок установлен для trade secrets отдельно
      (например, бессрочно), а для прочей информации — конкретный:
      * confidentiality_term_regime = "contract_specified"
      * confidentiality_term_value = "Бессрочно для коммерческой
        тайны; 3 года для прочей информации"
      * confidentiality_term_display = "Бессрочно для коммерческой
        тайны; 3 года для прочей информации"

    - Если договор прямо говорит "perpetual" или "indefinitely"
      для всей информации:
      * confidentiality_term_regime = "perpetual"
      * confidentiality_term_value = ""
      * confidentiality_term_display = "Бессрочно"

    - Если договор говорит "срок определяется применимым правом"
      или "in accordance with applicable law":
      * confidentiality_term_regime = "applicable_law_reference"
      * confidentiality_term_value = ""
      * confidentiality_term_display = "Определяется применимым
        правом"

    - Если релевантных фрагментов нет:
      * confidentiality_status = "missing"
      * confidentiality_value = "Требования к конфиденциальности
        не установлены"
      * confidentiality_term_regime = "not_specified"
      * confidentiality_term_value = ""
      * confidentiality_term_display = "Срок не установлен"

    - Если фрагменты есть, но из них нельзя сделать
      уверенный вывод:
      * confidentiality_status = "unclear"
      * confidentiality_value = "Не удалось определить"
      * confidentiality_term_regime = "unclear"
      * confidentiality_term_value = ""
      * confidentiality_term_display = "Не удалось определить"
    </edge_cases>

    <output_expectations>
    Все значения должны быть короткими, точными и пригодными
    для отображения пользователю в DD Grid.
    Не добавляй никаких полей, кроме указанных в схеме extraction.
    </output_expectations>

  fields:
    - name: "confidentiality_status"
      type: "string"
      allowed_values:
        - "present"
        - "missing"
        - "unclear"

    - name: "confidentiality_value"
      type: "string"

    - name: "confidentiality_term_regime"
      type: "string"
      allowed_values:
        - "contract_specified"
        - "perpetual"
        - "applicable_law_reference"
        - "not_specified"
        - "unclear"

    - name: "confidentiality_term_value"
      type: "string"

    - name: "confidentiality_term_display"
      type: "string"

    - name: "reason"
      type: "string"

