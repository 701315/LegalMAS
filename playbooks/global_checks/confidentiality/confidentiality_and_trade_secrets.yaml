id: "confidentiality_and_trade_secrets"
name: "Конфиденциальность и коммерческая тайна"
description: >
  Анализирует определение конфиденциальной информации, срок конфиденциальности
  и выживающие обязанности, включая коммерческую тайну.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"

rules:
  keywords:
    - "конфиденциальная информация"
    - "конфиденциальность"
    - "confidential information"
    - "confidentiality"
    - "коммерческая тайна"
    - "trade secret"
    - "не разглашать"
    - "non-disclosure"
    - "NDA"
  keyword_mode: "any"
  regex_patterns: []
  clause_patterns: []

llm:
  prompt_template: |
    <role>
    Ты — юрист по коммерческим договорам и NDA.
    Твоя специализация — анализ положений о конфиденциальности и коммерческой тайне
    в B2B-контрактах и сделках M&A.
    </role>

    <context>
    Ниже приведены фрагменты договора с положениями о конфиденциальности
    и (при наличии) коммерческой тайне:

    {context}
    </context>

    <instructions>
    Проведи анализ строго по следующим шагам:

    Шаг 1 — ОПРЕДЕЛЕНИЕ КОНФИДЕНЦИАЛЬНОЙ ИНФОРМАЦИИ:
    - Определи, как сформулировано определение конфиденциальной информации:
      * overbroad — "любая информация в любой форме", без ограничений по связи с договором.
      * balanced — разумное, ограниченное по предмету договора/бизнесу, со стандартными исключениями.
      * narrow — слишком узкое, фактически защищает только небольшую часть реально важной информации.
      * unclear — по фрагментам невозможно оценить.
    - Отрази вывод в поле definition_scope.

    Шаг 2 — НАЛИЧИЕ СТАНДАРТНЫХ ИСКЛЮЧЕНИЙ:
    - Проверь, есть ли исключения для:
      * общедоступной информации,
      * информации, независимо разработанной получателем,
      * информации, полученной от третьих лиц без нарушения,
      * информации, раскрытой по закону/по требованию органа.
    - Установи has_standard_exceptions = yes / no / unclear.

    Шаг 3 — СРОК КОНФИДЕНЦИАЛЬНОСТИ:
    - Определи срок действия обязательств:
      * short — менее 2 лет после прекращения договора.
      * standard — 2–5 лет после прекращения договора.
      * long — более 5 лет, но не бессрочно.
      * perpetual — бессрочно (особенно для коммерческой тайны).
      * unclear — по фрагментам непонятно.
    - Учитывай различие между сроком договора и сроком конфиденциальности.

    Шаг 4 — РАЗРЕШЁННОЕ РАСКРЫТИЕ:
    - Определи, допускается ли раскрытие:
      * аффилированным лицам, консультантам, банкам, аудиторам,
      * потенциальным покупателям/инвесторам в рамках DD и M&A.
    - Установи:
      * allows_disclosure_to_affiliates_and_advisors = yes / no / unclear.
      * allows_disclosure_for_dd_and_mna = yes / no / unclear.

    Шаг 5 — ИТОГОВЫЙ УРОВЕНЬ РИСКА:
    - Оцени overall_risk_level: low / medium / high.
    - Учитывай баланс:
      * чрезмерно широкое определение без исключений и жёсткие ограничения раскрытия → скорее high.
      * разумный объём, стандартные исключения, нормальный срок и разрешённое раскрытие в M&A → скорее low.
    - Обоснуй оценку в поле "reason" с указанием ключевых формулировок.

    Если разные фрагменты противоречат друг другу (например, срок в одном месте
    2 года, в другом 5 лет, или разные списки исключений), не усредняй.
    Отрази противоречия в "reason" и установи риск не ниже "medium".
    </instructions>

    <edge_cases>
    ВАЖНО — как обрабатывать пограничные ситуации:

    — Если в тексте есть только общая фраза "Стороны обязуются соблюдать
      конфиденциальность", без определения и срока:
      definition_scope = "unclear",
      has_standard_exceptions = "unclear",
      confidentiality_term = "unclear",
      overall_risk_level = "medium" (обоснуй в reason).

    — Если для коммерческой тайны срок указан как бессрочный, а для остальной
      информации — ограниченный, отрази это в reason, но в поле
      confidentiality_term укажи категорию, соответствующую основной массе
      информации (например, "standard" или "long").

    — Если явно запрещено раскрытие информации потенциальным покупателям/инвесторам
      без согласия другой стороны, это повышает риск для сделок M&A
      (отрази это в overall_risk_level и reason).

    — Пустые или нерелевантные фрагменты:
      все поля = "unclear" или null, overall_risk_level = "medium",
      reason = "Недостаточно данных для анализа конфиденциальности".
    </edge_cases>

    <examples>
    ПРИМЕР 1 — СБАЛАНСИРОВАННО (LOW):

    Фрагмент: "Под конфиденциальной информацией понимается любая информация,
    раскрытая одной Стороной другой Стороне в связи с настоящим Договором,
    за исключением информации, ставшей общедоступной без нарушения, независимо
    разработанной Получателем либо полученной от третьего лица без нарушения
    обязательств по конфиденциальности. Обязательства действуют в течение пяти
    (5) лет после прекращения Договора. Стороны вправе раскрывать информацию
    аффилированным лицам, консультантам и потенциальным инвесторам при условии
    соблюдения ими режима конфиденциальности."

    {{
      "definition_scope": "balanced",
      "has_standard_exceptions": "yes",
      "confidentiality_term": "standard",
      "allows_disclosure_to_affiliates_and_advisors": "yes",
      "allows_disclosure_for_dd_and_mna": "yes",
      "overall_risk_level": "low",
      "reason": "Определение привязано к Договору и содержит стандартные исключения; срок 5 лет после прекращения; разрешено раскрытие аффилированным лицам и инвесторам при соблюдении конфиденциальности."
    }}

    ПРИМЕР 2 — ЧРЕЗМЕРНО ШИРОКО (HIGH):

    Фрагмент: "Конфиденциальной информацией является любая информация в любой форме,
    раскрытая в любой момент времени, независимо от связи с настоящим Договором.
    Обязательства по конфиденциальности действуют бессрочно. Раскрытие третьим лицам
    допускается только с предварительного письменного согласия Раскрывающей стороны."

    {{
      "definition_scope": "overbroad",
      "has_standard_exceptions": "no",
      "confidentiality_term": "perpetual",
      "allows_disclosure_to_affiliates_and_advisors": "no",
      "allows_disclosure_for_dd_and_mna": "no",
      "overall_risk_level": "high",
      "reason": "Определение охватывает любую информацию без стандартных исключений; бессрочный срок и запрет на раскрытие третьим лицам без согласия создают серьёзные ограничения для операционной деятельности и M&A."
    }}

    ПРИМЕР 3 — НЕПОЛНЫЕ ДАННЫЕ (MEDIUM/UNCLEAR):

    Фрагмент: "Стороны обязуются не раскрывать конфиденциальную информацию
    третьим лицам без согласия другой Стороны. Настоящее обязательство
    сохраняет силу после прекращения Договора."

    {{
      "definition_scope": "unclear",
      "has_standard_exceptions": "unclear",
      "confidentiality_term": "unclear",
      "allows_disclosure_to_affiliates_and_advisors": "unclear",
      "allows_disclosure_for_dd_and_mna": "unclear",
      "overall_risk_level": "medium",
      "reason": "Отсутствует детальное определение и стандартные исключения; срок и разрешённые раскрытия не конкретизированы, что создаёт неопределённость режима конфиденциальности."
    }}
    </examples>

    <output_format>
    Твой ответ ДОЛЖЕН быть строго валидным JSON-объектом со следующими
    полями:

    {{
      "definition_scope": "one of: overbroad | balanced | narrow | unclear",
      "has_standard_exceptions": "one of: yes | no | unclear",
      "confidentiality_term": "one of: short | standard | long | perpetual | unclear",
      "allows_disclosure_to_affiliates_and_advisors": "one of: yes | no | unclear",
      "allows_disclosure_for_dd_and_mna": "one of: yes | no | unclear",
      "overall_risk_level": "one of: low | medium | high",
      "reason": "string — краткое объяснение на русском с указанием ключевых формулировок из фрагментов"
    }}

    Все перечисленные поля ДОЛЖНЫ присутствовать в JSON, даже если их значение равно null.
    </output_format>

    <constraints>
    ЖЁСТКИЕ ПРАВИЛА:
    1. Выведи ТОЛЬКО один JSON-объект. Никакого текста до или после.
    2. Не пиши "Вот JSON", "Here is the JSON" и т.п.
    3. Не используй Markdown, бэктики ``` или любые обёртки.
    4. Все строки — в двойных кавычках.
    5. Значения перечислимых полей — СТРОГО из указанных вариантов.
    6. Ключи — точно как указано, без добавления новых.
    7. Поле "reason" ДОЛЖНО содержать конкретные факты из фрагментов,
       а не общие фразы вроде "есть риски". Желательно включать короткие
       цитаты из текста в кавычках.
    8. Начни ответ сразу с символа {{
    9. Если по какому‑то полю нет достаточно информации в тексте —
       верни для него null или 'unclear' (для полей, где это явно
       предусмотрено). НЕ придумывай значения, не интерполируй,
       не используй формулировки вроде "не указано", "N/A", "не найдено".
    </constraints>
  prompt_file: null
  context_k: 4
  temperature: 0.0
  max_tokens: 640

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  context_k: 4
  max_chunks: 8
  boost_keywords:
    - "конфиденциальная информация"
    - "confidential information"
    - "коммерческая тайна"
    - "trade secret"
    - "не разглашать"
  rerank: true
  filters: {}

conditional: null

extraction:
  enabled: true
  mode: "hybrid"
  fields:
    - name: "definition_scope"
      type: "string"
      allowed_values:
        - "overbroad"
        - "balanced"
        - "narrow"
        - "unclear"
    - name: "has_standard_exceptions"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
    - name: "confidentiality_term"
      type: "string"
      allowed_values:
        - "short"
        - "standard"
        - "long"
        - "perpetual"
        - "unclear"
    - name: "allows_disclosure_to_affiliates_and_advisors"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
    - name: "allows_disclosure_for_dd_and_mna"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
    - name: "overall_risk_level"
      type: "string"
      allowed_values:
        - "low"
        - "medium"
        - "high"
    - name: "reason"
      type: "string"
  store_payload: true

red_flags:
  items:
    - code: "CONF1"
      description: "Запрет на передачу информации покупателю/аффилированным лицам/консультантам без согласия."
    - code: "CONF2"
      description: "Чрезмерно широкий объём конфиденциальной информации без стандартных исключений."