id: "coc_assignment_presence"
name: "Наличие клауз об уступке и переводе долга"
description: >
  Проверяет, содержит ли договор положения об уступке прав (assignment)
  и/или переводе долга, включая ограничения и требования согласия.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"

rules:
  keywords:
    - "уступка прав"
    - "уступка требования"
    - "cession"
    - "assignment"
    - "assign"
    - "permitted assignee"
    - "перевод долга"
    - "transfer of obligations"
    - "переуступка"
  keyword_mode: "any"
  regex_patterns: []
  clause_patterns: []

llm:
  prompt_template: |
    <role>
    Ты — юрист по коммерческим договорам.
    Твоя специализация — анализ положений об уступке прав (assignment)
    и переводе долга в B2B-контрактах.
    </role>

    <context>
    Ниже приведены фрагменты договора:

    {context}
    </context>

    <instructions>
    Проведи анализ по шагам. Каждый шаг логически связан с одним или
    несколькими полями итоговой оценки.

    Шаг 1 — НАЛИЧИЕ СПЕЦИАЛЬНОЙ КЛАУЗУЛЫ ОБ УСТУПКЕ/ПЕРЕВОДЕ ДОЛГА
    (используется для заполнения поля "has_assignment_clause"):
    - Определи, есть ли в договоре специальные положения об уступке прав
      (assignment, cession, уступка требования) и/или переводе долга
      (transfer of obligations, перевод долга).
    - Отделяй специальные договорные формулировки от общей отсылки
      к законодательству о перемене лиц в обязательстве.

    Шаг 2 — ТРЕБУЕТСЯ ЛИ СОГЛАСИЕ КОНТРАГЕНТА
    (используется для заполнения поля "consent_required"):
    - Проанализируй, устанавливает ли договор:
      * прямой запрет уступки/перевода без согласия,
      * формулы "без предварительного письменного согласия",
      * либо наоборот — допускает уступку/перевод без согласия,
        возможно с обязательным уведомлением.
    - Сделай вывод по сути: требуется ли согласие контрагента или нет,
      либо данных недостаточно.

    Шаг 3 — НАЛИЧИЕ CARVE-OUT ДЛЯ ГРУППЫ / M&A
    (используется для заполнения поля "has_group_or_mna_carveout"):
    - Определи, есть ли специальные исключения (carve-out), позволяющие
      уступку/перевод:
      * внутригрупповым аффилированным лицам,
      * покупателям бизнеса или правопреемникам по сделкам M&A.
    - Обрати внимание на формулировки типа "may assign to Affiliates"
      или "to a purchaser of all or substantially all of its assets".

    Шаг 4 — ОБОСНОВАНИЕ ВЫВОДОВ
    (используется для формирования "reason"):
    - Кратко обоснуй свои выводы по шагам 1–3, ссылаясь на конкретные
      формулировки или их отсутствие.
    - Отдельно укажи, если есть только общая отсылка к закону без
      специальной клаузулы, либо если фрагменты явно недостаточны
      для уверенной оценки.
    </instructions>

    <edge_cases>
    Обрабатывай пограничные ситуации так:

    - Если есть только общая норма закона (например, ссылка на
      Гражданский кодекс) без специальной контрактной клаузулы:
      в анализе явно зафиксируй это как отсутствие ясной договорной
      регламентации уступки/перевода.

    - Если указано, что уступка/перевод допускаются "с предварительного
      письменного согласия другой Стороны":
      учитывай это как наличие специальной клаузулы и требование согласия.

    - Если прямо указано, что уступка/перевод допускаются без согласия,
      но с обязательным уведомлением:
      учитывай это как либеральный режим без требования согласия.

    - Если есть carve-out для внутригрупповых реструктуризаций или M&A
      (например, для Affiliates или покупателя бизнеса):
      обязательно зафиксируй этот факт в анализе как смягчающий фактор.

    - Пустые или нерелевантные фрагменты:
      укажи, что данных недостаточно для анализа клаузул об уступке
      и переводе долга, и отрази это в своём объяснении.
    </edge_cases>

    <output_expectations>
    На основе твоего анализа отдельный механизм извлечения сформирует
    структурированные поля по заранее заданной схеме. Твоя задача —
    давать чёткие юридические выводы и указывать конкретные формулировки
    из текста, на которых они основаны.
    </output_expectations>
  prompt_file: null
  context_k: 3
  temperature: 0.0
  max_tokens: 256

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 400

retrieval:
  context_k: 3
  max_chunks: 6
  boost_keywords:
    - "уступка"
    - "assignment"
    - "перевод долга"
  rerank: true
  filters: {}

conditional: null

extraction:
  enabled: true
  mode: "hybrid"
  fields:
    - name: "has_assignment_clause"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "consent_required"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "has_group_or_mna_carveout"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "reason"
      type: "string"

  store_payload: true

red_flags:
  items:
    - code: "A1"
      description: "Широкий запрет на уступку без carve-out для M&A и внутригрупповых реструктуризаций."
