id: "coc_assignment_presence"
name: "Наличие клауз об уступке и переводе долга"
description: >
  Проверяет, содержит ли договор положения об уступке прав (assignment)
  и/или переводе долга, включая тип запрета (полный / с согласия /
  свободный), покрытие (assignment / transfer / оба), асимметрию
  между сторонами и наличие carve-out для M&A / группы.
  Детальный анализ условий согласия (форма, сроки, deemed consent,
  reasonableness standard) выполняется чеком coc_consent_terms.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"

rules:
  keyword_mode: any

  keywords:
    high:
      # Уступка прав — точные термины
      - "(?i)assignment\\s+of\\s+(rights?|this\\s+agreement|the\\s+contract)"
      - "(?i)уступк[аи]\\s+(прав|требовани[яий])"
      - "(?i)assign\\s+(this\\s+agreement|any\\s+rights?)"
      - "(?i)уступить\\s+(прав[аы]|требовани[яие])"
      - "(?i)\\bcession\\b"
      - "(?i)переуступк[аи]"
      - "(?i)цесси[яи]"

      # Перевод долга
      - "(?i)transfer\\s+of\\s+obligations?"
      - "(?i)перевод\\s+долга"
      - "(?i)перевод\\s+обязательств"
      - "(?i)transfer\\s+of\\s+duties"
      - "(?i)delegation\\s+of\\s+(duties|obligations)"

      # Запрет уступки
      - "(?i)shall\\s+not\\s+assign"
      - "(?i)не\\s+вправе\\s+уступ(ить|ать)"
      - "(?i)no\\s+(party|side)\\s+may\\s+assign"
      - "(?i)ни\\s+одна\\s+из\\s+сторон\\s+не\\s+вправе\\s+(уступ|перевес)"
      - "(?i)without\\s+(the\\s+)?(prior\\s+)?(written\\s+)?consent[\\s\\S]{0,30}(assign|transfer)"
      - "(?i)без\\s+(предварительного\\s+)?(письменного\\s+)?согласи[яи][\\s\\S]{0,30}(уступ|перевод)"

      # Permitted assignee / разрешённая уступка
      - "(?i)permitted\\s+assign(ee|ment)"
      - "(?i)разрешённ[а-я]+\\s+уступк"
      - "(?i)may\\s+assign\\s+to\\s+(its?\\s+)?(affiliates?|group)"
      - "(?i)вправе\\s+уступить\\s+(аффилированн|групп)"

    medium:
      # Общие формулировки assignment
      - "(?i)\\bassignment\\b"
      - "(?i)\\bassign\\b"
      - "(?i)уступк"
      - "(?i)transfer\\s+of\\s+rights"
      - "(?i)передач[аи]\\s+прав"
      - "(?i)novation"
      - "(?i)новаци[яи]"

      # Согласие (общие)
      - "(?i)consent\\s+to\\s+(the\\s+)?(assignment|transfer)"
      - "(?i)согласи[ея]\\s+на\\s+(уступк|перевод|передач)"
      - "(?i)prior\\s+written\\s+consent"
      - "(?i)предварительн[а-я]+\\s+письменн[а-я]+\\s+согласи"

      # Carve-out
      - "(?i)except\\s+(for\\s+)?(assignment|transfer)\\s+to"
      - "(?i)за\\s+исключением\\s+(уступк|передач|перевод)"
      - "(?i)intra[-\\s]?group"
      - "(?i)внутригрупповой"
      - "(?i)affiliate"
      - "(?i)аффилированн"
      - "(?i)purchaser\\s+of\\s+(all\\s+or\\s+substantially\\s+all)"
      - "(?i)покупател[ьяю]\\s+(всего\\s+)?бизнес"
      - "(?i)successor"
      - "(?i)правопреемник"

    low:
      # Общие термины
      - "(?i)assign"
      - "(?i)уступ"
      - "(?i)transfer"
      - "(?i)передач"
      - "(?i)перевод"
      - "(?i)obligation"
      - "(?i)обязательств"
      - "(?i)rights?"
      - "(?i)прав[аоы]?"
      - "(?i)consent"
      - "(?i)согласи"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 512

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 500

retrieval:
  context_k: 5
  max_chunks: 8
  boost_keywords:
    - "assignment"
    - "уступка прав"
    - "уступка требования"
    - "переуступка"
    - "cession"
    - "цессия"
    - "перевод долга"
    - "transfer of obligations"
    - "shall not assign"
    - "не вправе уступить"
    - "without consent"
    - "без согласия"
    - "permitted assignee"
    - "разрешённая уступка"
    - "intra-group"
    - "внутригрупповая"
    - "affiliate"
    - "аффилированное лицо"
    - "purchaser of all or substantially all"
    - "правопреемник"
  rerank: true
  filters: {}

conditional: null

extraction:
  llm_max_tokens: 350
  llm_prompt_extraction: |
    <role>
    Ты — юрист по защите персональных данных.
    Твоя задача — не оценивать compliance-риск, а точно извлечь
    из текста:
    1) есть ли в договоре требования по управлению персональными
       данными;
    2) если есть — на каком уровне они закреплены: отдельное
       соглашение (DPA), отдельный раздел договора или только
       упоминание / ссылка на закон.
    </role>

    <context>
    Ниже приведены релевантные фрагменты договора:

    {context}
    </context>

    <task>
    Заполни только следующие поля:
    - personal_data_status
    - personal_data_regulation_level
    - personal_data_regulation_display
    - reason

    Важно:
    - не оценивай compliance-риск и не выставляй red flags;
    - не анализируй роли сторон, subprocessors, трансграничные
      передачи или права субъектов данных;
    - пиши user-facing значения коротко и по-русски.
    </task>

    <instructions>
    Шаг 1 — ОПРЕДЕЛИ НАЛИЧИЕ ТРЕБОВАНИЙ ПО ПЕРСОНАЛЬНЫМ ДАННЫМ
    Заполни поле "personal_data_status".

    Правила:
    - "present" — если договор содержит любые из следующего:
      * прямое упоминание персональных данных / personal data /
        ПДн / PII;
      * ссылку на GDPR, 152-ФЗ, CCPA или аналогичный
        регуляторный режим;
      * положения об обработке данных, DPA, поручение
        на обработку;
      * обязательства сторон в отношении персональных данных.
    - "missing" — если договор явно не содержит никаких
      упоминаний персональных данных и законов об их защите.
    - "unclear" — если фрагменты не позволяют уверенно
      определить наличие или отсутствие таких требований.

    Шаг 2 — ОПРЕДЕЛИ УРОВЕНЬ РЕГУЛИРОВАНИЯ
    Заполни поля "personal_data_regulation_level"
    и "personal_data_regulation_display".

    Правила для personal_data_regulation_level:
    - "dpa_attachment" — если есть отдельное соглашение
      об обработке персональных данных (DPA / поручение
      на обработку) оформленное как:
      * отдельный документ / приложение к договору;
      * exhibit / annex / schedule с полноценными условиями
        обработки данных.
      Признаки: наличие хотя бы части из следующего —
      цели обработки, категории данных, срок обработки,
      технические меры, обязанности сторон как отдельный
      структурированный блок в приложении.
    - "dedicated_section" — если в основном тексте договора
      есть отдельный раздел / статья, специально посвящённая
      персональным данным, с содержательными обязательствами
      сторон.
      Признаки: раздел с заголовком типа "Personal Data",
      "Персональные данные", "Data Protection", "Защита данных"
      и содержательными условиями внутри.
    - "law_reference_only" — если договор только:
      * упоминает персональные данные или законы без
        содержательных обязательств;
      * содержит общую фразу типа "стороны обязуются соблюдать
        применимое законодательство о защите данных";
      * ссылается на GDPR / 152-ФЗ без раскрытия условий.
    - "not_specified" — если personal_data_status = "missing".
    - "unclear" — если personal_data_status = "unclear"
      или уровень невозможно определить.

    Важно при разграничении уровней:
    - Если есть и отдельное приложение, и раздел в договоре,
      выбирай "dpa_attachment" как более высокий уровень.
    - Не считай общие формулировки про конфиденциальность
      информации за регулирование персональных данных, если ПДн
      или законы о них прямо не упоминаются.
    - Одна строка про "соблюдение применимого законодательства"
      без конкретики = "law_reference_only".

    Правила для personal_data_regulation_display:
    - Возвращай одно из следующих значений строго в соответствии
      с personal_data_regulation_level:
      * "dpa_attachment" →
        "Отдельное соглашение об обработке ПДн (DPA)"
      * "dedicated_section" →
        "Отдельный раздел договора по ПДн"
      * "law_reference_only" →
        "Только ссылка на применимый закон"
      * "not_specified" →
        "Требования по ПДн не установлены"
      * "unclear" →
        "Не удалось определить"

    Шаг 3 — КРАТКО ОБОСНУЙ ВЫВОД
    Заполни поле "reason".

    Правила:
    - 1–2 коротких предложения.
    - Укажи отдельно вывод по наличию требований и по уровню
      регулирования.
    - Приведи краткую цитату или укажи на наличие / отсутствие
      конкретного элемента (приложения, раздела, фразы).
    - Не анализируй риск, не выставляй оценки.
    </instructions>

    <edge_cases>
    - Если есть приложение с DPA / поручением на обработку:
      * personal_data_status = "present"
      * personal_data_regulation_level = "dpa_attachment"
      * personal_data_regulation_display =
        "Отдельное соглашение об обработке ПДн (DPA)"

    - Если есть раздел "Персональные данные" / "Data Protection"
      в теле договора с содержательными условиями, но без
      отдельного приложения:
      * personal_data_status = "present"
      * personal_data_regulation_level = "dedicated_section"
      * personal_data_regulation_display =
        "Отдельный раздел договора по ПДн"

    - Если договор содержит только фразу вида
      "Стороны обязуются соблюдать требования 152-ФЗ"
      или "The Parties shall comply with applicable data
      protection laws" без детализации:
      * personal_data_status = "present"
      * personal_data_regulation_level = "law_reference_only"
      * personal_data_regulation_display =
        "Только ссылка на применимый закон"

    - Если упоминание ПДн есть только в разделе
      о конфиденциальности, без явной отсылки к законам
      о персональных данных:
      * оцени по существу: если ПДн прямо названы —
        personal_data_status = "present",
        personal_data_regulation_level = "law_reference_only"
        или "dedicated_section" в зависимости от содержания;
      * если ПДн не названы явно — personal_data_status =
        "unclear".

    - Если релевантных фрагментов нет:
      * personal_data_status = "missing"
      * personal_data_regulation_level = "not_specified"
      * personal_data_regulation_display =
        "Требования по ПДн не установлены"

    - Если фрагменты есть, но вывод сделать нельзя:
      * personal_data_status = "unclear"
      * personal_data_regulation_level = "unclear"
      * personal_data_regulation_display =
        "Не удалось определить"
    </edge_cases>

    <output_expectations>
    Все значения должны быть короткими, точными и пригодными
    для отображения пользователю в DD Grid.
    Не добавляй никаких полей, кроме указанных в схеме extraction.
    </output_expectations>

  fields:
    - name: "personal_data_status"
      type: "string"
      allowed_values:
        - "present"
        - "missing"
        - "unclear"

    - name: "personal_data_regulation_level"
      type: "string"
      allowed_values:
        - "dpa_attachment"
        - "dedicated_section"
        - "law_reference_only"
        - "not_specified"
        - "unclear"

    - name: "personal_data_regulation_display"
      type: "string"

    - name: "reason"
      type: "string"

