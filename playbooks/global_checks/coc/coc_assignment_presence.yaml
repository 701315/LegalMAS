id: "coc_assignment_presence"
name: "Наличие клауз об уступке и переводе долга"
description: >
  Проверяет, содержит ли договор положения об уступке прав (assignment)
  и/или переводе долга, включая тип запрета (полный / с согласия /
  свободный), покрытие (assignment / transfer / оба), асимметрию
  между сторонами и наличие carve-out для M&A / группы.
  Детальный анализ условий согласия (форма, сроки, deemed consent,
  reasonableness standard) выполняется чеком coc_consent_terms.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"

rules:
  keyword_mode: any

  keywords:
    high:
      # Уступка прав — точные термины
      - "(?i)assignment\\s+of\\s+(rights?|this\\s+agreement|the\\s+contract)"
      - "(?i)уступк[аи]\\s+(прав|требовани[яий])"
      - "(?i)assign\\s+(this\\s+agreement|any\\s+rights?)"
      - "(?i)уступить\\s+(прав[аы]|требовани[яие])"
      - "(?i)\\bcession\\b"
      - "(?i)переуступк[аи]"
      - "(?i)цесси[яи]"

      # Перевод долга
      - "(?i)transfer\\s+of\\s+obligations?"
      - "(?i)перевод\\s+долга"
      - "(?i)перевод\\s+обязательств"
      - "(?i)transfer\\s+of\\s+duties"
      - "(?i)delegation\\s+of\\s+(duties|obligations)"

      # Запрет уступки
      - "(?i)shall\\s+not\\s+assign"
      - "(?i)не\\s+вправе\\s+уступ(ить|ать)"
      - "(?i)no\\s+(party|side)\\s+may\\s+assign"
      - "(?i)ни\\s+одна\\s+из\\s+сторон\\s+не\\s+вправе\\s+(уступ|перевес)"
      - "(?i)without\\s+(the\\s+)?(prior\\s+)?(written\\s+)?consent[\\s\\S]{0,30}(assign|transfer)"
      - "(?i)без\\s+(предварительного\\s+)?(письменного\\s+)?согласи[яи][\\s\\S]{0,30}(уступ|перевод)"

      # Permitted assignee / разрешённая уступка
      - "(?i)permitted\\s+assign(ee|ment)"
      - "(?i)разрешённ[а-я]+\\s+уступк"
      - "(?i)may\\s+assign\\s+to\\s+(its?\\s+)?(affiliates?|group)"
      - "(?i)вправе\\s+уступить\\s+(аффилированн|групп)"

    medium:
      # Общие формулировки assignment
      - "(?i)\\bassignment\\b"
      - "(?i)\\bassign\\b"
      - "(?i)уступк"
      - "(?i)transfer\\s+of\\s+rights"
      - "(?i)передач[аи]\\s+прав"
      - "(?i)novation"
      - "(?i)новаци[яи]"

      # Согласие (общие)
      - "(?i)consent\\s+to\\s+(the\\s+)?(assignment|transfer)"
      - "(?i)согласи[ея]\\s+на\\s+(уступк|перевод|передач)"
      - "(?i)prior\\s+written\\s+consent"
      - "(?i)предварительн[а-я]+\\s+письменн[а-я]+\\s+согласи"

      # Carve-out
      - "(?i)except\\s+(for\\s+)?(assignment|transfer)\\s+to"
      - "(?i)за\\s+исключением\\s+(уступк|передач|перевод)"
      - "(?i)intra[-\\s]?group"
      - "(?i)внутригрупповой"
      - "(?i)affiliate"
      - "(?i)аффилированн"
      - "(?i)purchaser\\s+of\\s+(all\\s+or\\s+substantially\\s+all)"
      - "(?i)покупател[ьяю]\\s+(всего\\s+)?бизнес"
      - "(?i)successor"
      - "(?i)правопреемник"

    low:
      # Общие термины
      - "(?i)assign"
      - "(?i)уступ"
      - "(?i)transfer"
      - "(?i)передач"
      - "(?i)перевод"
      - "(?i)obligation"
      - "(?i)обязательств"
      - "(?i)rights?"
      - "(?i)прав[аоы]?"
      - "(?i)consent"
      - "(?i)согласи"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 512

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 500

retrieval:
  context_k: 5
  max_chunks: 8
  boost_keywords:
    - "assignment"
    - "уступка прав"
    - "уступка требования"
    - "переуступка"
    - "cession"
    - "цессия"
    - "перевод долга"
    - "transfer of obligations"
    - "shall not assign"
    - "не вправе уступить"
    - "without consent"
    - "без согласия"
    - "permitted assignee"
    - "разрешённая уступка"
    - "intra-group"
    - "внутригрупповая"
    - "affiliate"
    - "аффилированное лицо"
    - "purchaser of all or substantially all"
    - "правопреемник"
  rerank: true
  filters: {}

conditional: null

extraction:
  llm_prompt_extraction: |
    <role>
    Ты — юрист по коммерческим договорам и M&A.
    Твоя специализация — анализ положений об уступке прав (assignment)
    и переводе долга в B2B-контрактах, включая запреты, ограничения,
    carve-out и асимметрию между сторонами.
    </role>

    <context>
    Ниже приведены фрагменты договора:

    {context}
    </context>

    <instructions>
    Проведи анализ по шагам. Каждый шаг логически соответствует одному
    или нескольким полям итоговой оценки.

    Шаг 1 — НАЛИЧИЕ КЛАУЗУЛЫ
    (используется для заполнения поля "has_assignment_clause"):
    - Определи, содержит ли договор специальные положения
      об уступке прав (assignment, cession) и/или переводе долга
      (transfer of obligations):
      * "yes" — специальная клаузула есть;
      * "no" — нет (только общая отсылка к закону
        или вообще ничего);
      * "unclear" — по фрагментам невозможно определить.
    - Отделяй специальную клаузулу от общей отсылки
      к законодательству.

    Шаг 2 — ПОКРЫТИЕ КЛАУЗУЛЫ
    (используется для заполнения поля "clause_coverage"):
    - Определи, что именно регулирует клаузула:
      * "assignment_only" — только уступка прав;
      * "transfer_only" — только перевод долга;
      * "both" — и уступка, и перевод долга;
      * "not_applicable" — клаузула отсутствует;
      * "unclear" — неясно.

    Шаг 3 — ТИП РЕЖИМА
    (используется для заполнения поля "assignment_regime"):
    - Определи, какой режим установлен:
      * "prohibited" — полный запрет уступки/перевода;
      * "consent_required" — допускается с согласия контрагента;
      * "notification_only" — допускается с уведомлением,
        без согласия;
      * "free" — свободная уступка/перевод без ограничений;
      * "not_applicable" — клаузула отсутствует;
      * "unclear" — неясно.

    Шаг 4 — АСИММЕТРИЯ МЕЖДУ СТОРОНАМИ
    (используется для заполнения поля "symmetry"):
    - Определи, одинаковы ли правила для обеих сторон:
      * "symmetric" — одинаковые ограничения для обеих сторон;
      * "asymmetric_target_restricted" — Target ограничен,
        контрагент может уступать свободнее (невыгодно
        для Target);
      * "asymmetric_counterparty_restricted" — контрагент
        ограничен, Target может уступать свободнее
        (выгодно для Target);
      * "not_applicable" — клаузула отсутствует;
      * "unclear" — неясно.

    Шаг 5 — CARVE-OUT ДЛЯ ГРУППЫ / M&A
    (используется для заполнения поля "has_carveout"):
    - Определи, есть ли исключения, позволяющие уступку/перевод
      без согласия:
      * внутригрупповым аффилированным лицам;
      * покупателям бизнеса (purchaser of all or substantially
        all assets);
      * правопреемникам по реорганизации;
      * банкам / залогодержателям.
    - Оцени:
      * "yes" — carve-out есть;
      * "no" — нет исключений;
      * "unclear" — неясно;
      * "not_applicable" — уступка свободна / клаузула
        отсутствует.

    Шаг 6 — RED FLAGS
    (используется для заполнения поля "red_flags"):
    Присвой один или несколько кодов из списка ниже.
    Если ни один код не применим — верни "NONE".
    Если данных недостаточно для оценки — верни "UNCLEAR".

    Коды:
    • ASGN1 — Полный запрет уступки и/или перевода долга
      без carve-out для M&A / внутригрупповых реструктуризаций.
    • ASGN2 — Асимметричный режим: контрагент может уступать
      свободно (или с меньшими ограничениями), Target —
      только с согласия или запрещено.
    • ASGN3 — Нет специальной клаузулы об уступке/переводе —
      режим определяется только законом, что создаёт
      неопределённость для M&A.
    • ASGN4 — Неполное покрытие: запрет распространяется
      только на уступку прав, но не на перевод долга
      (или наоборот).

    Формат ответа: коды через запятую без комментариев
    (например: "ASGN1, ASGN2").
    Вся аргументация — в поле reason.

    Шаг 7 — ОБОСНОВАНИЕ
    (используется для заполнения поля "reason"):
    - Кратко обоснуй вывод, опираясь на ключевые формулировки
      из текста (с цитатами в кавычках):
      * опиши тип клаузулы и режим;
      * укажи, симметричен ли режим;
      * опиши carve-out (если есть);
      * если выставлены red_flags — обоснуй каждый код;
      * если red_flags = "NONE" — укажи, почему режим
        приемлем для M&A.
    - Примечание: детальный анализ условий согласия (форма,
      сроки, deemed consent, reasonableness standard)
      выполняется чеком coc_consent_terms; здесь достаточно
      зафиксировать факт требования согласия.
    </instructions>

    <edge_cases>
    Обрабатывай пограничные ситуации так:

    - Только общая отсылка к закону (ГК РФ и т.п.) без
      специальной клаузулы:
      has_assignment_clause = "no";
      зафиксируй ASGN3; в reason укажи, что отсутствие
      специального регулирования создаёт неопределённость.

    - «С предварительного письменного согласия»:
      has_assignment_clause = "yes";
      assignment_regime = "consent_required";
      детали согласия → чек coc_consent_terms.

    - Уступка допускается без согласия, но с уведомлением:
      assignment_regime = "notification_only";
      red_flags может быть "NONE" (благоприятный режим).

    - Carve-out для Affiliates или покупателя бизнеса:
      has_carveout = "yes"; это снижает risk;
      ASGN1 не выставляется.

    - Запрет только на assignment, но не на transfer
      of obligations:
      clause_coverage = "assignment_only";
      зафиксируй ASGN4; в reason укажи пробел.

    - Контрагент может уступать свободно, Target — нет:
      symmetry = "asymmetric_target_restricted";
      зафиксируй ASGN2.

    - Полный запрет без исключений:
      assignment_regime = "prohibited";
      has_carveout = "no";
      зафиксируй ASGN1; в reason укажи, что это блокирует
      M&A и внутригрупповые реструктуризации.

    - Пустые или нерелевантные фрагменты:
      has_assignment_clause = "unclear";
      red_flags = "UNCLEAR"; в reason укажи недостаток данных.
    </edge_cases>

    <output_expectations>
    На основе твоего анализа отдельный механизм извлечения сформирует
    структурированные поля по заранее заданной схеме. Твоя задача —
    давать чёткие юридические выводы и указывать конкретные
    формулировки из текста, на которых они основаны.
    </output_expectations>

  enabled: true
  mode: "hybrid"
  fields:
    - name: "has_assignment_clause"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "clause_coverage"
      type: "string"
      allowed_values:
        - "assignment_only"
        - "transfer_only"
        - "both"
        - "not_applicable"
        - "unclear"

    - name: "assignment_regime"
      type: "string"
      allowed_values:
        - "prohibited"
        - "consent_required"
        - "notification_only"
        - "free"
        - "not_applicable"
        - "unclear"

    - name: "symmetry"
      type: "string"
      allowed_values:
        - "symmetric"
        - "asymmetric_target_restricted"
        - "asymmetric_counterparty_restricted"
        - "not_applicable"
        - "unclear"

    - name: "has_carveout"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
        - "not_applicable"

    - name: "red_flags"
      type: "string"

    - name: "reason"
      type: "string"

  store_payload: true

red_flags:
  items:
    - code: "ASGN1"
      description: >
        Полный запрет уступки и/или перевода долга без carve-out
        для M&A и внутригрупповых реструктуризаций.
    - code: "ASGN2"
      description: >
        Асимметричный режим: контрагент может уступать свободно,
        Target — только с согласия или запрещено.
    - code: "ASGN3"
      description: >
        Нет специальной клаузулы об уступке/переводе —
        режим определяется только законом, что создаёт
        неопределённость для M&A.
    - code: "ASGN4"
      description: >
        Неполное покрытие: запрет распространяется только
        на уступку прав, но не на перевод долга (или наоборот).
        