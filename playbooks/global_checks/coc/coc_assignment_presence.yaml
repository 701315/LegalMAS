id: "coc_assignment_presence"
name: "Режим уступки прав и перевода долга"
group: "Смена контроля"
description: >
  Анализирует режим уступки прав (assignment) и перевода долга /
  передачи обязательств в договоре: полный запрет, только с согласия,
  свободное разрешение или смешанный режим. Извлекает покрытие
  (уступка прав / перевод долга / оба), асимметрию между сторонами
  и тип carve-out (аффилированные лица / группа / правопреемник /
  M&A / банк-залогодержатель).

  Этот check относится к семейству Assignment / Transfer и не анализирует
  смену контроля (CoC) как таковую. Детальный анализ механики получения
  согласия (форма, сроки, deemed consent, reasonableness standard)
  выполняется отдельным чеком coc_consent_terms.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"
ui_mode: "field_extraction"

rules:
  keyword_mode: any

  keywords:
    high:
      # Assignment / уступка прав
      - "(?i)assignment\\s+of\\s+(rights?|this\\s+agreement|the\\s+contract)"
      - "(?i)assign\\s+(this\\s+agreement|any\\s+rights?|its?\\s+rights?)"
      - "(?i)уступк[аи]\\s+(прав|требовани[яий])"
      - "(?i)уступить\\s+(прав[аы]|требовани[яие])"
      - "(?i)переуступк[аи]"
      - "(?i)цесси[яи]"
      - "(?i)\\bcession\\b"

      # Transfer / delegation / перевод долга
      - "(?i)transfer\\s+of\\s+(obligations?|duties)"
      - "(?i)delegation\\s+of\\s+(duties|obligations)"
      - "(?i)transfer\\s+this\\s+agreement"
      - "(?i)перевод\\s+долга"
      - "(?i)перевод\\s+обязательств"
      - "(?i)передач[аи]\\s+прав\\s+и\\s+обязанностей"
      - "(?i)передач[аи]\\s+договора"

      # Restriction / consent
      - "(?i)shall\\s+not\\s+assign"
      - "(?i)no\\s+party\\s+may\\s+assign"
      - "(?i)without\\s+(the\\s+)?(prior\\s+)?(written\\s+)?consent[\\s\\S]{0,40}(assign|transfer|delegate)"
      - "(?i)не\\s+вправе\\s+уступ(ить|ать)"
      - "(?i)ни\\s+одна\\s+из\\s+сторон\\s+не\\s+вправе"
      - "(?i)без\\s+(предварительного\\s+)?(письменного\\s+)?согласи[яи][\\s\\S]{0,40}(уступ|перевод|передач)"

      # Permitted assignee / carve-out
      - "(?i)permitted\\s+assign(ee|ment)"
      - "(?i)may\\s+assign\\s+to\\s+(its?\\s+)?(affiliates?|group)"
      - "(?i)successors?\\s+and\\s+assigns?"
      - "(?i)разрешённ[а-я]+\\s+уступк"
      - "(?i)вправе\\s+уступить\\s+(аффилированн|групп)"
      - "(?i)правопреемник"

    medium:
      - "(?i)\\bassignment\\b"
      - "(?i)\\bassign(?:ment|ed|ee|s)?\\b"
      - "(?i)novation"
      - "(?i)новаци[яи]"
      - "(?i)consent\\s+to\\s+(assignment|transfer)"
      - "(?i)согласи[ея]\\s+на\\s+(уступк|перевод|передач)"
      - "(?i)prior\\s+written\\s+consent"
      - "(?i)предварительн[а-я]+\\s+письменн[а-я]+\\s+согласи"
      - "(?i)except\\s+(for\\s+)?assignment\\s+to"
      - "(?i)за\\s+исключением\\s+(уступк|передач|перевод)"
      - "(?i)intra[-\\s]?group"
      - "(?i)affiliate"
      - "(?i)аффилированн"
      - "(?i)successor"
      - "(?i)reorganization"
      - "(?i)merger"
      - "(?i)sale\\s+of\\s+(all\\s+or\\s+substantially\\s+all)"
      - "(?i)покупател[ьяю]\\s+бизнеса"
      - "(?i)pledge\\s+of\\s+(rights?|receivables?)"
      - "(?i)залог\\s+(прав|требовани)"
      - "(?i)security\\s+assignment"

    low:
      - "(?i)assignment\\s+clause"
      - "(?i)successors?\\s+and\\s+assigns?"
      - "(?i)переход\\s+прав\\s+и\\s+обязанностей"
      - "(?i)уступк[аи]"
      - "(?i)перевод\\s+долга"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 560

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 500

retrieval:
  context_k: 5
  max_chunks: 10
  boost_keywords:
    - "assignment of rights"
    - "assignment of this agreement"
    - "уступка прав"
    - "уступка требования"
    - "переуступка"
    - "цессия"
    - "перевод долга"
    - "перевод обязательств"
    - "передача прав и обязанностей"
    - "transfer of obligations"
    - "shall not assign"
    - "without prior written consent"
    - "без предварительного письменного согласия"
    - "permitted assignee"
    - "successors and assigns"
    - "правопреемник"
    - "affiliate"
    - "аффилированное лицо"
    - "intra-group"
    - "внутригрупповая уступка"
    - "merger"
    - "reorganization"
    - "sale of substantially all assets"
    - "покупатель бизнеса"
    - "security assignment"
    - "залог прав"
  rerank: true
  filters: {}

conditional: null

enrichment_hints:
  preferred_segment_types:
    - "contract"
    - "amendment"
    - "annex"
  excluded_segment_types:
    - "technical_specification"
    - "price_list"
    - "invoice"
    - "act"
  preferred_clause_functions:
    - "assignment"
  confidence_bonus_on_match: 0.10
  confidence_penalty_on_excluded_segment: 0.15

extraction:
  enabled: true
  mode: "hybrid"
  llm_max_tokens: 460
  llm_prompt_extraction: |
    <role>
    Ты — юрист по коммерческим договорам и сделкам M&A.
    Твоя задача — не оценивать риск, а точно извлечь из текста:
    1) есть ли в договоре положения об уступке прав и/или переводе долга;
    2) какой режим установлен;
    3) что именно покрывается;
    4) есть ли асимметрия между сторонами;
    5) есть ли carve-out и какого типа.

    Этот check не анализирует смену контроля (CoC) как таковую.
    Детальный анализ механики согласия (форма, сроки, deemed consent,
    reasonableness standard) выполняется отдельным чеком.
    </role>

    <context>
    Ниже приведены релевантные фрагменты договора:

    {context}
    </context>

    <task>
    Заполни только следующие поля:
    - assignment_transfer_display
    - assignment_transfer_status
    - assignment_transfer_regime_type
    - assignment_transfer_coverage
    - assignment_transfer_asymmetry
    - assignment_transfer_carveout_type
    - reason

    Важно:
    - не оценивай риск и не выставляй red flags;
    - не анализируй форму согласия, сроки ответа, deemed consent,
      reasonableness standard или последствия нарушения —
      это задача отдельного check;
    - не анализируй смену контроля (CoC) как самостоятельный триггер;
    - пиши user-facing значения коротко и по-русски.
    </task>

    <instructions>
    Шаг 1 — ОПРЕДЕЛИ НАЛИЧИЕ ПОЛОЖЕНИЙ

    Заполни поле "assignment_transfer_status".

    Правила:
    - "present" — если договор прямо регулирует уступку прав, assignment,
      перевод долга, передачу обязательств, передачу договора целиком,
      согласие на такие действия или carve-out для них.
    - "missing" — если таких положений нет.
    - "unclear" — если есть косвенные формулировки, но нельзя надёжно
      определить наличие полноценного режима.

    Шаг 2 — ОПРЕДЕЛИ ТИП РЕЖИМА

    Заполни поле "assignment_transfer_regime_type".

    Значения:
    - "prohibited" — уступка / перевод долга прямо запрещены.
    - "consent_required" — допустимы только с согласия другой стороны.
    - "freely_permitted" — прямо разрешены без требования согласия.
    - "mixed" — режим различается:
      * между уступкой прав и переводом долга;
      * между сторонами;
      * между общим правилом и carve-out.
    - "not_specified" — если assignment_transfer_status = "missing".
    - "unclear" — режим нельзя определить надёжно.

    Шаг 3 — ОПРЕДЕЛИ ПОКРЫТИЕ

    Заполни поле "assignment_transfer_coverage".

    Значения:
    - "assignment_only" — регулируется только уступка прав / требований.
    - "transfer_only" — регулируется только перевод долга /
      передача обязательств.
    - "both" — регулируются и уступка прав, и перевод долга /
      передача обязательств.
    - "not_specified" — если assignment_transfer_status = "missing".
    - "unclear" — покрытие нельзя определить.

    Шаг 4 — ОПРЕДЕЛИ АСИММЕТРИЮ

    Заполни поле "assignment_transfer_asymmetry".

    Значения:
    - "symmetric" — режим одинаков для всех сторон договора.
    - "one_sided" — одной стороне разрешено то, что другой запрещено
      или доступно только с более жёсткими условиями.
    - "not_specified" — если assignment_transfer_status = "missing".
    - "unclear" — асимметрию нельзя определить.

    Шаг 5 — ОПРЕДЕЛИ ТИП CARVE-OUT

    Заполни поле "assignment_transfer_carveout_type".

    Значения:
    - "none" — carve-out не предусмотрен.
    - "affiliate_group" — carve-out для аффилированных лиц,
      группы компаний, внутригрупповой передачи.
    - "successor_mna" — carve-out для правопреемника, merger,
      reorganization, sale of business / substantially all assets.
    - "security_financing" — carve-out для банка, залогодержателя,
      обеспечения (security assignment, залог прав требования).
    - "multiple" — есть два и более типа carve-out одновременно.
    - "not_specified" — carve-out не урегулирован при отсутствии
      положений об уступке в целом.
    - "not_applicable" — assignment_transfer_status = "missing".
    - "unclear" — carve-out упоминается, но тип нельзя определить.

    Шаг 6 — СФОРМИРУЙ КОРОТКИЙ USER-FACING RESULT

    Заполни поле "assignment_transfer_display".

    Правила:
    - Поле должно быть коротким, factual и пригодным для DD Grid.
    - Строй display по модели:
      {режим}; {carve-out если есть и материально важен}

    Примеры:
    - "Уступка прав и перевод долга запрещены"
    - "Уступка прав и перевод долга — только с письменного согласия"
    - "Уступка прав — только с письменного согласия; есть carve-out для аффилированных лиц"
    - "Уступка прав — только с письменного согласия; carve-out для правопреемника при M&A"
    - "Уступка прав разрешена свободно"
    - "Уступка прав разрешена свободно; перевод долга — только с согласия"
    - "Уступка прав запрещена; есть carve-out для аффилированных лиц и правопреемника"
    - "Положения об уступке и переводе долга не установлены"
    - "Не удалось определить режим уступки / перевода долга"

    Дополнительные правила:
    - Если regime = "mixed" — кратко отрази различие в display.
    - Если carve-out материально важен для M&A — включи его в display.
    - Если asymmetry = "one_sided" и это существенно — отрази в display или reason.
    - Если status = "missing": "Положения об уступке и переводе долга не установлены"
    - Если status = "unclear": "Не удалось определить режим уступки / перевода долга"

    Шаг 7 — КРАТКО ОБОСНУЙ ВЫВОД

    Заполни поле "reason".

    Правила:
    - 1–2 коротких предложения.
    - Укажи вывод по режиму, покрытию и carve-out.
    - Если есть asymmetry — упомяни.
    - Приведи короткую цитату из текста в кавычках.
    - Не анализируй риск и не делай правовых выводов сверх текста.
    </instructions>

    <edge_cases>
    - "Neither party may assign this Agreement without prior written consent":
      * assignment_transfer_status = "present"
      * assignment_transfer_regime_type = "consent_required"
      * assignment_transfer_coverage = "assignment_only"
      * assignment_transfer_asymmetry = "symmetric"
      * assignment_transfer_carveout_type = "none"
      * assignment_transfer_display =
        "Уступка прав — только с письменного согласия"

    - Явный запрет и assignment, и transfer of obligations:
      * assignment_transfer_regime_type = "prohibited"
      * assignment_transfer_coverage = "both"
      * assignment_transfer_display =
        "Уступка прав и перевод долга запрещены"

    - Carve-out для affiliates / group companies:
      * assignment_transfer_carveout_type = "affiliate_group"
      * assignment_transfer_display =
        "Уступка прав — только с письменного согласия; есть carve-out для аффилированных лиц"

    - Carve-out для правопреемника / merger / sale of substantially all assets:
      * assignment_transfer_carveout_type = "successor_mna"

    - Carve-out для банка / залогодержателя / security assignment:
      * assignment_transfer_carveout_type = "security_financing"

    - Есть carve-out и для группы, и для правопреемника при M&A:
      * assignment_transfer_carveout_type = "multiple"
      * в assignment_transfer_display: "есть carve-out для аффилированных лиц и правопреемника"

    - Одной стороне свободная уступка, другой — только с согласия:
      * assignment_transfer_regime_type = "mixed"
      * assignment_transfer_asymmetry = "one_sided"
      * в display отрази асимметрию кратко

    - Нет релевантных фрагментов:
      * assignment_transfer_status = "missing"
      * assignment_transfer_regime_type = "not_specified"
      * assignment_transfer_coverage = "not_specified"
      * assignment_transfer_asymmetry = "not_specified"
      * assignment_transfer_carveout_type = "not_applicable"
      * assignment_transfer_display =
        "Положения об уступке и переводе долга не установлены"

    - Фрагменты есть, но вывод сделать нельзя:
      * assignment_transfer_status = "unclear"
      * assignment_transfer_regime_type = "unclear"
      * assignment_transfer_coverage = "unclear"
      * assignment_transfer_asymmetry = "unclear"
      * assignment_transfer_carveout_type = "unclear"
      * assignment_transfer_display =
        "Не удалось определить режим уступки / перевода долга"
    </edge_cases>

    <output_expectations>
    Все значения должны быть короткими, точными и пригодными
    для отображения пользователю в DD Grid.
    Не добавляй никаких полей, кроме указанных в схеме extraction.
    </output_expectations>

  fields:
    - name: "assignment_transfer_display"
      type: "string"
      description: "Режим уступки / перевода долга"

    - name: "assignment_transfer_status"
      type: "string"
      description: "Наличие положений"
      allowed_values:
        - "present"
        - "missing"
        - "unclear"

    - name: "assignment_transfer_regime_type"
      type: "string"
      description: "Тип режима"
      allowed_values:
        - "prohibited"
        - "consent_required"
        - "freely_permitted"
        - "mixed"
        - "not_specified"
        - "unclear"

    - name: "assignment_transfer_coverage"
      type: "string"
      description: "Покрытие"
      allowed_values:
        - "assignment_only"
        - "transfer_only"
        - "both"
        - "not_specified"
        - "unclear"

    - name: "assignment_transfer_asymmetry"
      type: "string"
      description: "Асимметрия между сторонами"
      allowed_values:
        - "symmetric"
        - "one_sided"
        - "not_specified"
        - "unclear"

    - name: "assignment_transfer_carveout_type"
      type: "string"
      description: "Тип carve-out"
      allowed_values:
        - "none"
        - "affiliate_group"
        - "successor_mna"
        - "security_financing"
        - "multiple"
        - "not_specified"
        - "not_applicable"
        - "unclear"

    - name: "reason"
      type: "string"
      description: "Обоснование"

  store_payload: true

