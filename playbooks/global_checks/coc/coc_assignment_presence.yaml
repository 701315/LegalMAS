id: "coc_assignment_presence"
name: "Наличие клауз об уступке и переводе долга"
description: >
  Проверяет, содержит ли договор положения об уступке прав (assignment)
  и/или переводе долга, включая ограничения и требования согласия.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"

rules:
  keywords:
    - "уступка прав"
    - "уступка требования"
    - "cession"
    - "assignment"
    - "assign"
    - "permitted assignee"
    - "перевод долга"
    - "transfer of obligations"
    - "переуступка"
  keyword_mode: "any"
  regex_patterns: []
  clause_patterns: []

llm:
  prompt_template: |
    <role>
    Ты — юрист по коммерческим договорам.
    Твоя специализация — анализ положений об уступке прав (assignment)
    и переводе долга в B2B-контрактах.
    </role>

    <context>
    Ниже приведены фрагменты договора:

    {context}
    </context>

    <instructions>
    Определи:

    1) Есть ли в договоре положения об уступке прав (assignment) и/или переводе долга
       (transfer of obligations): общее наличие специальной клаузулы.

    2) Требуется ли согласие контрагента на уступку/перевод:
       - прямой запрет без согласия;
       - формулы типа "без предварительного письменного согласия".

    3) Есть ли carve-out для:
       - внутригрупповых сделок (assignment внутри группы компаний),
       - сделок M&A (передача прав/обязанностей покупателю бизнеса, правопреемнику).

    При недостатке данных используй "unclear". Не относись автоматически к любому
    упоминанию уступки как к жёсткому запрету — смотри формулировку.
    </instructions>

    <edge_cases>
    ВАЖНО — пограничные случаи:

    — Если есть только общая норма закона (например, ссылка на ГК) без
      специальной контрактной клаузулы:
      has_assignment_clause = "unclear" (опиши в reason).

    — Если указано, что уступка/перевод допускаются "с предварительного
      письменного согласия другой Стороны":
      has_assignment_clause = "yes",
      consent_required = "yes".

    — Если прямо указано, что уступка/перевод допускаются без согласия,
      но с обязательным уведомлением:
      has_assignment_clause = "yes",
      consent_required = "no".

    — Если есть carve-out для внутригрупповых реструктуризаций/M&A
      (например, "may assign to Affiliates or a purchaser of all or
      substantially all of its assets"):
      has_group_or_mna_carveout = "yes".

    — Пустые или нерелевантные фрагменты:
      has_assignment_clause = "unclear",
      consent_required = "unclear",
      has_group_or_mna_carveout = "unclear",
      reason = "Недостаточно данных для анализа клаузул об уступке и переводе долга".
    </edge_cases>

    <examples>
    ПРИМЕР 1 — ЖЁСТКИЙ ЗАПРЕТ БЕЗ CARVE-OUT:

    Фрагмент: "Сторона не вправе уступать права и переводить долг по
    настоящему Договору без предварительного письменного согласия
    другой Стороны."

    {{
      "has_assignment_clause": "yes",
      "consent_required": "yes",
      "has_group_or_mna_carveout": "no",
      "reason": "Прямой запрет на уступку прав и перевод долга без письменного согласия контрагента, carve-out для группы/M&A отсутствует."
    }}

    ПРИМЕР 2 — LIBERAL + CARVE-OUT:

    Фрагмент: "Сторона вправе уступать права и переводить долг по настоящему
    Договору своим аффилированным лицам или любому приобретателю всех или
    существенной части её бизнеса без согласия другой Стороны при условии
    письменного уведомления."

    {{
      "has_assignment_clause": "yes",
      "consent_required": "no",
      "has_group_or_mna_carveout": "yes",
      "reason": "Прямо разрешена уступка/перевод долга аффилированным лицам и покупателю бизнеса без согласия, предусмотрено только уведомление."
    }}

    ПРИМЕР 3 — НЕЯСНО:

    Фрагмент: "Стороны соглашаются соблюдать применимое законодательство
    о перемене лиц в обязательстве."

    {{
      "has_assignment_clause": "unclear",
      "consent_required": "unclear",
      "has_group_or_mna_carveout": "unclear",
      "reason": "Есть общая отсылка к законодательству о перемене лиц, но нет специальной клаузулы об уступке/переводе и условиях согласия."
    }}
    </examples>

    <output_format>
    Твой ответ ДОЛЖЕН быть строго валидным JSON-объектом со следующими
    полями:

    {{
      "has_assignment_clause": "one of: yes | no | unclear",
      "consent_required": "one of: yes | no | unclear",
      "has_group_or_mna_carveout": "one of: yes | no | unclear",
      "reason": "string — краткое объяснение на русском с указанием ключевых формулировок или их отсутствия"
    }}

    Все перечисленные поля ДОЛЖНЫ присутствовать в JSON, даже если их значение равно null.
    </output_format>

    <constraints>
    ЖЁСТКИЕ ПРАВИЛА:
    1. Выведи ТОЛЬКО один JSON-объект. Никакого текста до или после.
    2. Не пиши "Вот JSON", "Here is the JSON" и т.п.
    3. Не используй Markdown, бэктики ``` или любые обёртки.
    4. Все строки — в двойных кавычках.
    5. Значения перечислимых полей — СТРОГО из указанных вариантов.
    6. Ключи — точно как указано, без добавления новых.
    7. Поле "reason" ДОЛЖНО содержать конкретные отсылки к тексту
       (или указание на отсутствие формулировок), а не общие фразы.
    8. Начни ответ сразу с символа {{
    9. Если по какому‑то полю нет достаточно информации в тексте —
       верни для него 'unclear' или null (для reason пустое значение недопустимо).
       НЕ придумывай значения, не интерполируй.
    </constraints>
  prompt_file: null
  context_k: 3
  temperature: 0.0
  max_tokens: 256

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 400

retrieval:
  context_k: 3
  max_chunks: 6
  boost_keywords:
    - "уступка"
    - "assignment"
    - "перевод долга"
  rerank: true
  filters: {}

conditional: null

extraction:
  enabled: true
  mode: "hybrid"
  fields:
    - name: "has_assignment_clause"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
    - name: "consent_required"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
    - name: "has_group_or_mna_carveout"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
    - name: "reason"
      type: "string"
  store_payload: true

red_flags:
  items:
    - code: "A1"
      description: "Широкий запрет на уступку без carve-out для M&A и внутригрупповых реструктуризаций."