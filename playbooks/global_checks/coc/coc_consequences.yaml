id: "coc_consequences"
name: "Последствия смены контроля и уступки"
description: >
  Анализирует последствия, предусмотренные при смене контроля (CoC),
  уступке прав или переводе долга: право на расторжение (включая
  автоматическое прекращение), акселерация обязательств, изменение
  цены/условий, требование дополнительного обеспечения, новация,
  наличие cure period / waiver. Оценивает совокупный уровень риска
  для покупателя бизнеса / Target в контексте M&A.

doc_types: []

severity: "critical"
severity_if_fail: "critical"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"

rules:
  keyword_mode: any

  keywords:
    high:
      # Расторжение при CoC — точные маркеры
      - "(?i)right\\s+to\\s+terminate[\\s\\S]{0,40}(change\\s+of\\s+control|смен[а-я]+\\s+контрол)"
      - "(?i)право\\s+(на\\s+)?(одностороннее\\s+)?расторжени[ея][\\s\\S]{0,40}(смен[а-я]+\\s+контрол|CoC)"
      - "(?i)terminat(e|ion)\\s+upon[\\s\\S]{0,20}(change|transfer|CoC)"
      - "(?i)automatic(ally)?\\s+terminat(e|ion|ed)"
      - "(?i)автоматическ[а-я]+\\s+(прекращени|расторжени)"
      - "(?i)договор\\s+прекращает(ся)?\\s+действ"
      - "(?i)shall\\s+cease\\s+to\\s+be\\s+in\\s+(force|effect)"

      # Акселерация
      - "(?i)acceleration"
      - "(?i)акселераци"
      - "(?i)досрочн[а-я]+\\s+(исполнени|взыскани|погашени|возврат)"
      - "(?i)immediate(ly)?\\s+(repay|due|payable)"
      - "(?i)demand\\s+immediate\\s+repayment"
      - "(?i)all\\s+outstanding\\s+amounts?\\s+(shall\\s+)?become\\s+due"
      - "(?i)вся\\s+сумма\\s+задолженност[ьи]\\s+(подлежит|становится)"

      # Step-up / изменение условий
      - "(?i)step[-\\s]?up"
      - "(?i)увеличени[ея]\\s+(ставк|марж|процент)"
      - "(?i)increase\\s+in\\s+(the\\s+)?(rate|margin|interest)"
      - "(?i)изменени[ея]\\s+цен[аы]"
      - "(?i)price\\s+(adjustment|increase|change)"
      - "(?i)отмен[аы]\\s+(скид[а-я]+|льгот)"
      - "(?i)revocation\\s+of\\s+(discount|benefit|concession)"

      # Дополнительное обеспечение
      - "(?i)дополнительн[а-я]+\\s+(обеспечени|гарант|залог|поручительств)"
      - "(?i)additional\\s+(security|collateral|guarantee|pledge)"
      - "(?i)provide\\s+(additional|further)\\s+(security|collateral)"

      # Новация
      - "(?i)новаци[яи]"
      - "(?i)новировани[ея]"
      - "(?i)novation"
      - "(?i)заключ(ить|ени[ея])\\s+нов[а-я]+\\s+договор"
      - "(?i)enter\\s+into\\s+a\\s+new\\s+agreement"

    medium:
      # Расторжение — общие формулировки
      - "(?i)право\\s+расторгнуть"
      - "(?i)одностороннее\\s+расторжение"
      - "(?i)right\\s+to\\s+terminate"
      - "(?i)termination\\s+(right|option)"
      - "(?i)unilateral\\s+termination"
      - "(?i)terminat(e|ion)"

      # Cure period / waiver
      - "(?i)cure\\s+period"
      - "(?i)срок\\s+(для\\s+)?устранени[яи]"
      - "(?i)grace\\s+period"
      - "(?i)льготн[а-я]+\\s+период"
      - "(?i)waiver"
      - "(?i)отказ\\s+от\\s+права"
      - "(?i)consent\\s+not\\s+to\\s+be\\s+unreasonably\\s+withheld"

      # Break fee / компенсация при расторжении
      - "(?i)break\\s+fee"
      - "(?i)termination\\s+fee"
      - "(?i)штраф\\s+за\\s+расторжение"
      - "(?i)компенсаци[яи]\\s+при\\s+расторжении"
      - "(?i)early\\s+termination\\s+(fee|penalty|payment)"

      # Обеспечение — общие
      - "(?i)залог"
      - "(?i)mortgage"
      - "(?i)pledge"
      - "(?i)поручительств"
      - "(?i)guarantee"
      - "(?i)security\\s+interest"

      # Правопреемство
      - "(?i)правопреемник"
      - "(?i)successor"
      - "(?i)правопреемств"
      - "(?i)succession"

    low:
      # Общие термины
      - "(?i)расторж"
      - "(?i)прекращ"
      - "(?i)terminate"
      - "(?i)termination"
      - "(?i)досрочн"
      - "(?i)acceleration"
      - "(?i)обеспечени"
      - "(?i)security"
      - "(?i)условия"
      - "(?i)terms"
      - "(?i)change"
      - "(?i)изменени"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 700

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  context_k: 5
  max_chunks: 10
  boost_keywords:
    - "right to terminate"
    - "право расторгнуть"
    - "одностороннее расторжение"
    - "termination upon change of control"
    - "automatic termination"
    - "автоматическое прекращение"
    - "acceleration"
    - "досрочное исполнение"
    - "досрочное погашение"
    - "досрочное взыскание"
    - "step-up"
    - "увеличение ставки"
    - "изменение цены"
    - "отмена скидок"
    - "дополнительное обеспечение"
    - "additional security"
    - "additional collateral"
    - "новация"
    - "novation"
    - "cure period"
    - "waiver"
    - "break fee"
    - "termination fee"
    - "компенсация при расторжении"
  rerank: true
  filters: {}

conditional: null

extraction:
  llm_prompt_extraction: |
    <role>
    Ты — юрист по M&A, финансированию и коммерческим договорам.
    Твоя специализация — анализ последствий смены контроля
    (change of control), уступки прав и перевода долга,
    включая расторжение, акселерацию, изменение условий,
    дополнительное обеспечение и новацию.
    </role>

    <context>
    Ниже приведены фрагменты договора с положениями о последствиях
    смены контроля и/или уступки прав, перевода долга:

    {context}
    </context>

    <instructions>
    Проведи анализ по шагам. Каждый шаг логически соответствует одному
    или нескольким полям итоговой оценки риска.

    Шаг 1 — ПРАВО НА РАСТОРЖЕНИЕ
    (используется для заполнения поля "termination_right"):
    - Определи, предусмотрено ли право на расторжение
      при CoC/уступке:
      * "none" — нет специального права на расторжение;
      * "limited" — ограниченное (только при CoC определённой
        стороны, с условиями, с cure period);
      * "broad" — широкое, безусловное право на расторжение;
      * "unclear" — формулировки размыты.

    Шаг 2 — КОМПЕНСАЦИЯ / BREAK FEE ПРИ РАСТОРЖЕНИИ
    (используется для заполнения поля "termination_compensation"):
    - Определи, предусмотрена ли компенсация при расторжении
      по CoC-основанию:
      * "break_fee" — установлен break fee / termination fee;
      * "damages" — право на возмещение убытков;
      * "none" — компенсация не предусмотрена;
      * "not_applicable" — права на расторжение нет;
      * "unclear" — неясно.

    Шаг 3 — АКСЕЛЕРАЦИЯ
    (используется для заполнения поля "acceleration"):
    - Определи, даёт ли CoC/уступка право требовать досрочного
      исполнения обязательств:
      * досрочное погашение кредита;
      * взыскание всей суммы задолженности;
      * досрочный возврат имущества.
    - Оцени:
      * "yes" — акселерация предусмотрена;
      * "no" — не предусмотрена;
      * "unclear" — неясно.

    Шаг 4 — ИЗМЕНЕНИЕ ЦЕНЫ / УСЛОВИЙ
    (используется для заполнения поля "price_terms_change"):
    - Определи, предусмотрены ли ухудшающие изменения при CoC:
      * повышение ставки/маржи (step-up);
      * отмена скидок, льгот, преференций;
      * иные ухудшения ключевых условий.
    - Оцени:
      * "yes" — изменения предусмотрены;
      * "no" — не предусмотрены;
      * "unclear" — неясно.

    Шаг 5 — ДОПОЛНИТЕЛЬНОЕ ОБЕСПЕЧЕНИЕ
    (используется для заполнения поля "additional_security"):
    - Определи, возникает ли при CoC/уступке обязанность
      предоставить дополнительное обеспечение:
      * залог, ипотека, pledge;
      * поручительство, гарантия;
      * иные формы обеспечения.
    - Оцени:
      * "yes" — требование есть;
      * "no" — нет;
      * "unclear" — неясно.

    Шаг 6 — НОВАЦИЯ / ПЕРЕЗАКЛЮЧЕНИЕ
    (используется для заполнения поля "novation_required"):
    - Определи, требуется ли новация договора или заключение
      нового договора с правопреемником:
      * "yes" — требуется;
      * "no" — не требуется, договор сохраняется;
      * "unclear" — неясно.

    Шаг 7 — CURE PERIOD / WAIVER
    (используется для заполнения поля "cure_or_waiver_available"):
    - Определи, предусмотрены ли механизмы смягчения:
      * cure period — срок для устранения нарушения / получения
        согласия;
      * waiver — возможность отказа контрагента от права
        на расторжение / акселерацию;
      * consent not to be unreasonably withheld — согласие
        не может быть необоснованно удержано.
    - Оцени:
      * "yes" — есть cure period и/или waiver;
      * "no" — нет смягчающих механизмов;
      * "unclear" — неясно.

    Шаг 8 — RED FLAGS
    (используется для заполнения поля "red_flags"):
    Присвой один или несколько кодов из списка ниже.
    Если ни один код не применим — верни "NONE".
    Если данных недостаточно для оценки — верни "UNCLEAR".

    Коды:
    • CON1 — Право контрагента расторгнуть ключевой договор
      при CoC без компенсации / break fee.
    • CON2 — Акселерация крупных обязательств
      (досрочное погашение, взыскание всей суммы) при CoC.
    • CON3 — Ухудшение цены/условий (step-up, отмена скидок)
      при CoC.
    • CON4 — Жёсткое требование дополнительного обеспечения,
      трудновыполнимое после сделки.
    • CON5 — Автоматическое прекращение договора при CoC
      (без cure period / waiver).
    • CON6 — Обязательная новация / перезаключение договора
      с правопреемником — фактический барьер для сделки.

    Формат ответа: коды через запятую без комментариев
    (например: "CON1, CON5").
    Вся аргументация — в поле reason.

    Шаг 9 — ОБОСНОВАНИЕ
    (используется для заполнения поля "reason"):

    - В reason кратко обоснуй вывод, опираясь на ключевые
      формулировки из текста (с цитатами в кавычках), и укажи:
      * какие последствия предусмотрены и для каких событий;
      * есть ли автоматическое прекращение или право по выбору;
      * предусмотрены ли cure period, waiver, компенсация;
      * если выставлены red_flags — обоснуй каждый код;
      * если red_flags = "NONE" — укажи, почему последствия
        приемлемы для M&A.
    </instructions>

    <edge_cases>
    Обрабатывай пограничные ситуации так:

    - CoC-клауза есть, но последствия ограничиваются
      обязанностью уведомить и получить согласие:
      termination_right = "none" или "limited";
      acceleration = "no"; price_terms_change = "no";
      в reason укажи, что последствия мягкие;
      red_flags может быть "NONE".

    - Договор прекращается автоматически при CoC:
      termination_right = "broad";
      termination_mechanism = "automatic";
      зафиксируй CON5; в reason укажи, что автоматическое
      прекращение — наиболее жёсткое последствие.

    - Формулировки общие («Сторона вправе пересмотреть условия»)
      без конкретики:
      price_terms_change = "unclear";
      в reason укажи, что размытость оставляет широкое
      усмотрение контрагенту.

    - Право расторгнуть есть, но с cure period (например,
      90 дней для получения согласия):
      termination_right = "limited";
      termination_mechanism = "with_cure";
      cure_or_waiver_available = "yes";
      risk может быть снижен до MEDIUM.

    - Акселерация сформулирована как право, а не обязанность
      («may demand immediate repayment»):
      acceleration = "yes"; в reason укажи, что это право,
      а не автоматическое последствие.

    - Нет упоминаний последствий при CoC/уступке:
      все поля = "none" или "no";
      red_flags = "NONE" (или COC1 из чека coc_presence,
      если CoC-клауза вообще отсутствует — но это не
      ответственность данного чека);
      overall_risk_level = "low".

    - Пустые или явно нерелевантные фрагменты:
      red_flags = "UNCLEAR"; в reason укажи, что данных
      недостаточно для оценки последствий CoC.
    </edge_cases>

    <output_expectations>
    На основе твоего анализа отдельный механизм извлечения сформирует
    структурированные поля по заранее заданной схеме. Твоя задача —
    давать чёткие юридические выводы и указывать конкретные
    формулировки из текста, на которых они основаны.
    </output_expectations>

  enabled: true
  mode: "hybrid"
  fields:
    - name: "termination_right"
      type: "string"
      allowed_values:
        - "none"
        - "limited"
        - "broad"
        - "unclear"

    - name: "termination_compensation"
      type: "string"
      allowed_values:
        - "break_fee"
        - "damages"
        - "none"
        - "not_applicable"
        - "unclear"

    - name: "acceleration"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "price_terms_change"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "additional_security"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "novation_required"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "cure_or_waiver_available"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "red_flags"
      type: "string"

    - name: "reason"
      type: "string"

  store_payload: true

red_flags:
  items:
    - code: "CON1"
      description: >
        Право контрагента расторгнуть ключевой договор при CoC
        без компенсации / break fee.
    - code: "CON2"
      description: >
        Акселерация крупных обязательств (досрочное погашение,
        взыскание всей суммы) при CoC.
    - code: "CON3"
      description: >
        Ухудшение цены/условий (step-up, отмена скидок/льгот)
        при CoC.
    - code: "CON4"
      description: >
        Жёсткое требование дополнительного обеспечения
        (залог, поручительство), трудновыполнимое после сделки.
    - code: "CON5"
      description: >
        Автоматическое прекращение договора при CoC
        без cure period / waiver.
    - code: "CON6"
      description: >
        Обязательная новация / перезаключение договора
        с правопреемником — фактический барьер для сделки.
        