id: "coc_consequences"
name: "Последствия смены контроля"
group: "COC"
description: >
  Анализирует substantive последствия, которые наступают при смене
  контроля (Change of Control): право на расторжение и его механизм,
  акселерацию обязательств, изменение цены / условий, наличие
  смягчающих механизмов (cure period, waiver).

  Check не анализирует:
  - наличие / тип режима CoC — это задача coc_change_of_control_regime;
  - механику получения согласия — это задача coc_consent_terms;
  - последствия уступки прав / перевода долга — это задача
    assignment_transfer_consequences;
  - definition of control / CoC trigger;
  - оценку общего M&A-риска.

doc_types: []

severity: "critical"
severity_if_fail: "critical"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"
ui_mode: "field_extraction"

rules:
  keyword_mode: any

  keywords:
    high:
      - "(?i)right\\s+to\\s+terminate[\\s\\S]{0,40}(change\\s+of\\s+control|смен[а-я]+\\s+контрол)"
      - "(?i)terminat(e|ion)\\s+upon[\\s\\S]{0,20}(change|control)"
      - "(?i)право\\s+(на\\s+)?(одностороннее\\s+)?расторжени[ея][\\s\\S]{0,40}(смен[а-я]+\\s+контрол)"
      - "(?i)automatic(ally)?\\s+terminat(e|ion|ed)"
      - "(?i)автоматическ[а-я]+\\s+(прекращени|расторжени)"
      - "(?i)договор\\s+прекращает(ся)?\\s+действ"
      - "(?i)shall\\s+cease\\s+to\\s+be\\s+in\\s+(force|effect)"
      - "(?i)acceleration\\s+of[\\s\\S]{0,30}(payment|obligation|debt)"
      - "(?i)досрочн[а-я]+\\s+(исполнени|взыскани|погашени|возврат)"
      - "(?i)all\\s+outstanding\\s+amounts?\\s+(shall\\s+)?become\\s+due"
      - "(?i)step[-\\s]?up"
      - "(?i)увеличени[ея]\\s+(ставк|марж|процент)"
      - "(?i)отмен[аы]\\s+(скид[а-я]+|льгот|преференц)"

    medium:
      - "(?i)right\\s+to\\s+terminate"
      - "(?i)termination\\s+(right|option)"
      - "(?i)право\\s+расторгнуть"
      - "(?i)cure\\s+period"
      - "(?i)срок\\s+(для\\s+)?устранени[яи]"
      - "(?i)grace\\s+period"
      - "(?i)waiver"
      - "(?i)change\\s+of\\s+control"
      - "(?i)смена\\s+контроля"

    low:
      - "(?i)automatic(ally)?\\s+terminat"
      - "(?i)досрочн[а-я]+\\s+погашени"
      - "(?i)step[-\\s]?up"
      - "(?i)cure\\s+period"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 420

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  retrieval_profile: "change_of_control_check"
  context_k: 6
  max_chunks: 12

  retrieval_query: >
    смена контроля change of control расторжение termination
    автоматическое прекращение акселерация acceleration
    досрочное исполнение step-up изменение ставки cure period

  boost_keywords:
    - "termination upon change of control"
    - "расторжение при смене контроля"
    - "automatic termination"
    - "автоматическое прекращение"
    - "right to terminate"
    - "право расторгнуть"
    - "acceleration"
    - "досрочное исполнение"
    - "step-up"
    - "увеличение ставки"
    - "cure period"
    - "grace period"

  negative_keywords:
    - "уступка прав"
    - "assignment of rights"
    - "перевод долга"
    - "transfer of obligations"
    - "consent"
    - "согласие"
    - "означает"
    - "в целях настоящего"
    - "споры"
    - "подсудность"
    - "применимое право"

  preferred_unit_types:
    - "termination_provision"
    - "liability_provision"
    - "obligation"
    - "general_provision"

  excluded_unit_types:
    - "definition"
    - "structural_anchor"
    - "technical_fragment"
    - "appendix_reference"

  preferred_clause_functions:
    - "rights"
    - "limitations"
    - "procedures"
    - "obligations"

  position_bias:
    preferred_range: [0.50, 1.00]
    boost: 0.30
    scope: "segment"

  rerank: true
  filters: {}

conditional: null

enrichment_hints:
  preferred_segment_types:
    - "contract"
    - "amendment"
  excluded_segment_types:
    - "technical_specification"
    - "price_list"
    - "invoice"
    - "act"
  confidence_bonus_on_match: 0.10
  confidence_penalty_on_excluded_segment: 0.15

extraction:
  enabled: true
  mode: "hybrid"
  llm_max_tokens: 850

  llm_prompt_extraction: |
    <role>
    Ты — юрист по M&A и коммерческим договорам.
    Твоя задача — точно извлечь substantive последствия,
    которые наступают при смене контроля (Change of Control).

    Не анализируй механику согласия.
    Не анализируй definition of control или CoC trigger.
    Не анализируй последствия уступки прав / перевода долга.
    Не оценивай общий M&A-риск.
    </role>

    <context>
    Ниже приведены релевантные фрагменты договора:

    {context}
    </context>

    <task>
    Заполни только следующие поля:
    - coc_consequences_display
    - coc_termination_right
    - coc_termination_mechanism
    - coc_acceleration
    - coc_price_terms_change
    - coc_cure_or_waiver
    - reason

    Общие правила:
    - используй только то, что прямо следует из текста;
    - не придумывай последствий, которых нет;
    - пиши коротко и по-русски.
    </task>

    <instructions>
    Шаг 1 — ПРАВО НА РАСТОРЖЕНИЕ

    Заполни "coc_termination_right".

    Значения:
    - "none" — нет специального права на расторжение при CoC.
    - "limited" — право есть, но ограниченное: только при
      определённых условиях, после notice или с cure period.
    - "broad" — широкое право расторгнуть при CoC.
    - "unclear" — нельзя определить.

    Шаг 2 — МЕХАНИЗМ РАСТОРЖЕНИЯ

    Заполни "coc_termination_mechanism".

    Значения:
    - "optional" — расторжение по выбору стороны.
    - "automatic" — договор прекращается автоматически при CoC.
    - "with_cure" — расторжение только после cure period.
    - "not_applicable" — coc_termination_right = "none".
    - "unclear" — нельзя определить.

    Шаг 3 — АКСЕЛЕРАЦИЯ

    Заполни "coc_acceleration".

    Значения:
    - "yes" — предусмотрено требование досрочного исполнения
      при CoC: погашение долга, возврат имущества и т.п.
    - "no" — не предусмотрено.
    - "unclear" — нельзя определить.

    Шаг 4 — ИЗМЕНЕНИЕ ЦЕНЫ / УСЛОВИЙ

    Заполни "coc_price_terms_change".

    Значения:
    - "yes" — предусмотрено ухудшение условий при CoC:
      step-up ставки, отмена скидок / льгот, иные ухудшения.
    - "no" — не предусмотрено.
    - "unclear" — нельзя определить.

    Шаг 5 — СМЯГЧАЮЩИЕ МЕХАНИЗМЫ

    Заполни "coc_cure_or_waiver".

    Значения:
    - "yes" — есть cure period, grace period или waiver.
    - "no" — смягчающих механизмов нет.
    - "unclear" — нельзя определить.

    Шаг 6 — DISPLAY ДЛЯ DD GRID

    Заполни "coc_consequences_display".

    Правила:
    - Начинай с "Для CoC — ".
    - Перечисляй последствия через точку с запятой
      в порядке убывания материальности.
    - Если cure/waiver есть — добавь в конец.

    Примеры:
    - "Для CoC — автоматическое прекращение договора"
    - "Для CoC — право расторгнуть; cure period предусмотрен"
    - "Для CoC — право расторгнуть; акселерация; step-up ставки"
    - "Для CoC — только уведомление контрагента"
    - "Для CoC — только согласие контрагента"
    - "Последствия CoC не установлены"
    - "Не удалось определить последствия CoC"

    Если из текста видно только требование уведомления или согласия
    без расторжения / акселерации / изменения условий:
    - coc_termination_right = "none"
    - coc_acceleration = "no"
    - coc_price_terms_change = "no"
    - coc_consequences_display = "Для CoC — только согласие контрагента"
      или "Для CoC — только уведомление контрагента"

    Шаг 7 — ОБОСНОВАНИЕ

    Заполни "reason".

    Правила:
    - 1–2 коротких предложения.
    - Укажи: какие последствия предусмотрены и есть ли
      смягчающие механизмы.
    - Приведи короткую цитату в кавычках.
    </instructions>

    <edge_cases>
    - Договор прекращается автоматически:
      * coc_termination_right = "broad"
      * coc_termination_mechanism = "automatic"
      * coc_cure_or_waiver = "no"
      * coc_consequences_display =
        "Для CoC — автоматическое прекращение договора"

    - Право расторгнуть с cure period:
      * coc_termination_right = "limited"
      * coc_termination_mechanism = "with_cure"
      * coc_cure_or_waiver = "yes"
      * coc_consequences_display =
        "Для CoC — право расторгнуть; cure period предусмотрен"

    - CoC clause есть, но только требование согласия:
      * coc_termination_right = "none"
      * coc_acceleration = "no"
      * coc_price_terms_change = "no"
      * coc_consequences_display =
        "Для CoC — только согласие контрагента"

    - Нет упоминаний последствий CoC:
      * coc_termination_right = "none"
      * coc_termination_mechanism = "not_applicable"
      * coc_acceleration = "no"
      * coc_price_terms_change = "no"
      * coc_cure_or_waiver = "no"
      * coc_consequences_display = "Последствия CoC не установлены"

    - Фрагменты нерелевантны:
      * coc_termination_right = "unclear"
      * coc_termination_mechanism = "unclear"
      * coc_acceleration = "unclear"
      * coc_price_terms_change = "unclear"
      * coc_cure_or_waiver = "unclear"
      * coc_consequences_display =
        "Не удалось определить последствия CoC"
    </edge_cases>

    <output_expectations>
    Не добавляй никаких полей, кроме указанных в схеме extraction.
    </output_expectations>

  fields:
    - name: "coc_consequences_display"
      type: "string"
      presentation: "fact"
      label: "Последствия CoC"
      description: "Нормализованный user-facing вывод для DD Grid"

    - name: "coc_termination_right"
      type: "string"
      presentation: "signal"
      description: "Право на расторжение при CoC"
      allowed_values:
        - "none"
        - "limited"
        - "broad"
        - "unclear"

    - name: "coc_termination_mechanism"
      type: "string"
      presentation: "signal"
      description: "Механизм расторжения при CoC"
      allowed_values:
        - "optional"
        - "automatic"
        - "with_cure"
        - "not_applicable"
        - "unclear"

    - name: "coc_acceleration"
      type: "string"
      presentation: "signal"
      description: "Акселерация при CoC"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "coc_price_terms_change"
      type: "string"
      presentation: "signal"
      description: "Изменение цены / условий при CoC"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "coc_cure_or_waiver"
      type: "string"
      presentation: "signal"
      description: "Cure period / waiver при CoC"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "reason"
      type: "string"
      presentation: "diagnostic"
      description: "Краткое обоснование"

  store_payload: true
  
  
