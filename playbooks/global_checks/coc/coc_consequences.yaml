id: "coc_consequences"
name: "Последствия смены контроля и уступки"
description: >
  Анализирует, какие последствия предусмотрены при смене контроля,
  уступке прав или переводе долга (расторжение, акселерация, изменение условий).

doc_types: []

severity: "critical"
severity_if_fail: "critical"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"

rules:
  keywords:
    - "право расторгнуть"
    - "одностороннее расторжение"
    - "termination"
    - "terminate"
    - "acceleration"
    - "досрочное исполнение"
    - "досрочное взыскание"
    - "изменение цены"
    - "step-up"
    - "изменение скидок"
    - "отмена льгот"
    - "дополнительное обеспечение"
    - "дополнительные гарантии"
    - "залог"
    - "mortgage"
    - "новирование"
    - "новация"
  keyword_mode: "any"
  regex_patterns: []
  clause_patterns: []

llm:
  prompt_template: |
    <role>
    Ты — юрист по M&A и финансированию.
    Твоя специализация — анализ последствий смены контроля (change of control),
    уступки прав и перевода долга в кредитных и коммерческих договорах.
    </role>

    <context>
    Ниже приведены фрагменты договора с положениями о смене контроля
    и/или уступке прав, переводе долга:

    {context}
    </context>

    <instructions>
    Определи, какие последствия наступают при смене контроля,
    уступке прав или переводе долга:

    1) ПРАВО НА ОДНОСТОРОННЕЕ РАСТОРЖЕНИЕ (termination_right):
       - none — нет специальных прав на расторжение при CoC/уступке;
       - limited — право расторжения ограничено (например, только при существенных нарушениях
         или при CoC у определённой стороны, с условиями/сроками);
       - broad — широкое, практически безусловное право на одностороннее расторжение
         при смене контроля/уступке.

    2) АКСЕЛЕРАЦИЯ (acceleration):
       - есть ли право требовать досрочного исполнения/взыскания обязательств
         (досрочное погашение кредита, взыскание всей суммы и т.п.).

    3) ИЗМЕНЕНИЕ ЦЕНЫ / УСЛОВИЙ (price_or_terms_change):
       - предусмотрены ли step-up, отмена скидок, льгот, изменение маржи, других
         коммерческих параметров в случае CoC/уступки.

    4) ДОПОЛНИТЕЛЬНОЕ ОБЕСПЕЧЕНИЕ (additional_security):
       - есть ли обязанность предоставить залог, гарантию, поручительство
         или иное обеспечение при смене контроля/уступке.

    5) НОВАЦИЯ / ЗАПРЕТ ПРАВОПРЕЕМСТВА (novation_required):
       - требуется ли новация договора (заключение нового договора с правопреемником)
         или есть запрет на переход договора правопреемнику без отдельного согласия,
         фактически препятствующий сделке.

    6) ОБЩИЙ УРОВЕНЬ РИСКА:
       - Оцени overall_risk_level: low / medium / high с точки зрения покупателя бизнеса
         (Target / его акционеров).
       - Учитывай совокупность termination_right, acceleration, price_or_terms_change,
         additional_security, novation_required.

    Не придумывай последствия, если они прямо не вытекают из текста. При недостатке данных
    используй "unclear" для соответствующих полей.
    </instructions>

    <edge_cases>
    ВАЖНО — пограничные случаи:

    — Если CoC-клауза есть, но последствия ограничиваются только обязанностью
      уведомить и получить согласие, без автоматического расторжения/акселерации:
      termination_right = "limited",
      acceleration = "no".

    — Если при смене контроля/уступке договор прекращается автоматически:
      termination_right = "broad",
      overall_risk_level, как правило, не ниже "high" (укажи в reason, почему).

    — Если последствия сформулированы общими словами ("Сторона вправе пересмотреть
      условия"), без конкретики:
      соответствующие поля пометь как "unclear" и объясни неопределённость в reason.

    — Если в фрагментах нет упоминаний о последствиях именно при CoC/уступке:
      termination_right = "none",
      acceleration = "no",
      price_or_terms_change = "no",
      additional_security = "no",
      novation_required = "no" (если явно не требуется),
      overall_risk_level оцени с учётом важности договора.

    — Пустые или нерелевантные фрагменты:
      большинство полей = "unclear" или null,
      overall_risk_level = "medium",
      reason = "Недостаточно данных для анализа последствий смены контроля/уступки."
    </edge_cases>

    <examples>
    ПРИМЕР 1 — ЖЁСТКИЕ ПОСЛЕДСТВИЯ (HIGH):

    Фрагмент: "В случае смены контроля над Заёмщиком Банк вправе по своему
    усмотрению потребовать досрочного погашения всей суммы задолженности
    и расторгнуть настоящий Кредитный договор с немедленным наступлением
    срока исполнения всех обязательств Заёмщика."

    {{
      "termination_right": "broad",
      "acceleration": "yes",
      "price_or_terms_change": "no",
      "additional_security": "no",
      "novation_required": "no",
      "overall_risk_level": "high",
      "reason": "При смене контроля Банк получает практически безусловное право на расторжение и досрочное погашение всей задолженности, что создаёт высокий риск для покупателя бизнеса."
    }}

    ПРИМЕР 2 — МЯГКИЕ ПОСЛЕДСТВИЯ (MEDIUM):

    Фрагмент: "В случае смены контроля над Поставщиком последнему необходимо
    уведомить Покупателя и получить его согласие на продолжение исполнения
    настоящего Договора. При отказе в согласии Договор может быть расторгнут
    по соглашению сторон без штрафов."

    {{
      "termination_right": "limited",
      "acceleration": "no",
      "price_or_terms_change": "no",
      "additional_security": "no",
      "novation_required": "no",
      "overall_risk_level": "medium",
      "reason": "Смена контроля требует согласия Покупателя, но расторжение происходит по соглашению сторон без санкций; риск умеренный и зависит от практики взаимодействия с контрагентом."
    }}

    ПРИМЕР 3 — ИЗМЕНЕНИЕ УСЛОВИЙ И ДОП.ОБЕСПЕЧЕНИЕ (HIGH):

    Фрагмент: "В случае уступки прав требования или смены контроля над Заёмщиком
    Банк вправе увеличить процентную ставку на 3 п.п. годовых и потребовать
    предоставления дополнительного обеспечения в виде залога акций Материнской
    компании."

    {{
      "termination_right": "none",
      "acceleration": "no",
      "price_or_terms_change": "yes",
      "additional_security": "yes",
      "novation_required": "no",
      "overall_risk_level": "high",
      "reason": "Смена контроля/уступка дают Банку право ухудшить финансовые условия (повышение ставки) и потребовать дополнительное обеспечение, что существенно ухудшает положение Заёмщика/покупателя бизнеса."
    }}
    </examples>

    <output_format>
    Твой ответ ДОЛЖЕН быть строго валидным JSON-объектом со следующими
    полями:

    {{
      "termination_right": "one of: none | limited | broad",
      "acceleration": "one of: yes | no | unclear",
      "price_or_terms_change": "one of: yes | no | unclear",
      "additional_security": "one of: yes | no | unclear",
      "novation_required": "one of: yes | no | unclear",
      "overall_risk_level": "one of: low | medium | high",
      "reason": "string — краткое объяснение на русском с указанием, какие последствия предусмотрены и почему это рискованно/нерискованно"
    }}

    Все перечисленные поля ДОЛЖНЫ присутствовать в JSON, даже если их значение равно null.
    </output_format>

    <constraints>
    ЖЁСТКИЕ ПРАВИЛА:
    1. Выведи ТОЛЬКО один JSON-объект. Никакого текста до или после.
    2. Не пиши "Вот JSON", "Here is the JSON" и т.п.
    3. Не используй Markdown, бэктики ``` или любые обёртки.
    4. Все строки — в двойных кавычках.
    5. Значения перечислимых полей — СТРОГО из указанных вариантов.
    6. Ключи — точно как указано, без добавления новых.
    7. Поле "reason" ДОЛЖНО содержать конкретные факты и формулировки
       из фрагментов, а не общие фразы вроде "есть риски".
    8. Начни ответ сразу с символа {{
    9. Если по какому‑то полю нет достаточно информации в тексте —
       верни для него 'unclear' или null (для reason пустое значение
       недопустимо — нужно объяснение). НЕ придумывай последствия,
       не интерполируй.
    </constraints>
  prompt_file: null
  context_k: 4
  temperature: 0.0
  max_tokens: 512

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 500

retrieval:
  context_k: 4
  max_chunks: 8
  boost_keywords:
    - "termination"
    - "расторгнуть"
    - "acceleration"
    - "досрочное исполнение"
    - "step-up"
    - "дополнительное обеспечение"
    - "новация"
  rerank: true
  filters: {}

conditional: null

extraction:
  enabled: true
  mode: "hybrid"
  fields:
    - name: "termination_right"
      type: "string"
      allowed_values:
        - "none"
        - "limited"
        - "broad"
    - name: "acceleration"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
    - name: "price_or_terms_change"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
    - name: "additional_security"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
    - name: "novation_required"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
    - name: "overall_risk_level"
      type: "string"
      allowed_values:
        - "low"
        - "medium"
        - "high"
    - name: "reason"
      type: "string"
  store_payload: true

red_flags:
  items:
    - code: "CON1"
      description: "Право контрагента расторгнуть ключевой договор при смене контроля без компенсации."
    - code: "CON2"
      description: "Акселерация крупных обязательств при смене контроля."
    - code: "CON3"
      description: "Изменение цены/условий в сторону ухудшения для Target после смены контроля."
    - code: "CON4"
      description: "Жесткое требование доп.обеспечения, которое трудно выполнить после сделки."