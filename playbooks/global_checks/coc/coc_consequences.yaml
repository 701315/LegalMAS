id: "coc_consequences"
name: "Последствия смены контроля и уступки"
description: >
  Анализирует, какие последствия предусмотрены при смене контроля,
  уступке прав или переводе долга (расторжение, акселерация, изменение условий).

doc_types: []

severity: "critical"
severity_if_fail: "critical"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"

rules:
  keywords:
    - "право расторгнуть"
    - "одностороннее расторжение"
    - "termination"
    - "terminate"
    - "acceleration"
    - "досрочное исполнение"
    - "досрочное взыскание"
    - "изменение цены"
    - "step-up"
    - "изменение скидок"
    - "отмена льгот"
    - "дополнительное обеспечение"
    - "дополнительные гарантии"
    - "залог"
    - "mortgage"
    - "новирование"
    - "новация"
  keyword_mode: "any"
  regex_patterns: []
  clause_patterns: []

llm:
  prompt_template: |
    <role>
    Ты — юрист по M&A и финансированию.
    Твоя специализация — анализ последствий смены контроля (change of control),
    уступки прав и перевода долга в кредитных и коммерческих договорах.
    </role>

    <context>
    Ниже приведены фрагменты договора с положениями о смене контроля
    и/или уступке прав, переводе долга:

    {context}
    </context>

    <instructions>
    Проведи анализ по шагам. Каждый шаг логически связан с одним или
    несколькими полями итоговой оценки.

    Шаг 1 — ПРАВО НА ОДНОСТОРОННЕЕ РАСТОРЖЕНИЕ
    (используется для заполнения поля "termination_right"):
    - Определи, предусмотрено ли в договоре специальное право на одностороннее
      расторжение при смене контроля, уступке прав или переводе долга.
    - Классифицируй по сути:
      * none — специальных прав на расторжение при CoC/уступке нет;
      * limited — право расторжения ограничено (например, только при CoC у
        определённой стороны, при дополнительных условиях или с особыми сроками);
      * broad — широкое, по сути безусловное право на одностороннее
        расторжение при CoC/уступке.

    Шаг 2 — АКСЕЛЕРАЦИЯ
    (используется для заполнения поля "acceleration"):
    - Определи, даёт ли CoC/уступка право требовать досрочного исполнения
      или взыскания обязательств (досрочное погашение кредита, взыскание
      всей суммы задолженности и т.п.).
    - Оцени, есть ли такое право (yes / no), либо по тексту это неясно.

    Шаг 3 — ИЗМЕНЕНИЕ ЦЕНЫ / УСЛОВИЙ
    (используется для заполнения поля "price_or_terms_change"):
    - Определи, предусмотрены ли изменения коммерческих условий при CoC/уступке:
      * повышение ставки/маржи, step-up;
      * отмена скидок, льгот;
      * иные ухудшающие изменения цены или ключевых условий.
    - Отрази наличие или отсутствие таких механизмов, либо их неопределённость.

    Шаг 4 — ДОПОЛНИТЕЛЬНОЕ ОБЕСПЕЧЕНИЕ
    (используется для заполнения поля "additional_security"):
    - Проверь, возникает ли при смене контроля/уступке обязанность
      предоставить дополнительное обеспечение:
      * залог, ипотека;
      * поручительство, гарантия;
      * иные формы обеспечения.
    - Оцени, есть ли такое требование или оно не прослеживается по тексту.

    Шаг 5 — НОВАЦИЯ / ПРАВОПРЕЕМСТВО
    (используется для заполнения поля "novation_required"):
    - Определи, требуется ли новация договора или заключение нового договора
      с правопреемником, либо установлен запрет на переход договора к
      правопреемнику без отдельного соглашения.
    - Укажи, создаёт ли это фактический барьер для сделки (например,
      необходимость полной переинкарнации договора с новым лицом).

    Шаг 6 — ОБЩИЙ УРОВЕНЬ РИСКА
    (используется для формирования "overall_risk_level" и "reason"):
    - Оцени общий уровень риска для покупателя бизнеса / Target с учётом
      сочетания termination_right, acceleration, price_or_terms_change,
      additional_security и novation_required.
    - Сформулируй итоговый риск как low / medium / high.
    - Обоснуй вывод конкретными формулировками из текста (желательно
      с короткими цитатами в кавычках), указывая, какие последствия
      именно делают ситуацию рискованной или наоборот приемлемой.
    </instructions>

    <edge_cases>
    Обрабатывай пограничные ситуации так:

    - Если CoC-клауза есть, но последствия ограничиваются лишь обязанностью
      уведомить и получить согласие, без автоматического расторжения
      или акселерации:
      воспринимай право расторгнуть как ограниченное и фиксируй отсутствие
      акселерации, если она прямо не предусмотрена.

    - Если при смене контроля/уступке договор прекращается автоматически:
      относись к такому праву как к широкому (broad) и учитывай это как
      серьёзный риск в итоговой оценке.

    - Если последствия сформулированы общими словами ("Сторона вправе
      пересмотреть условия") без конкретики:
      используй "unclear" для соответствующих полей и объясни в анализе,
      что формулировка размыта и оставляет широкое усмотрение.

    - Если в фрагментах нет упоминаний о последствиях именно при CoC/уступке:
      укажи в анализе отсутствие специальных последствий и оцени риск с учётом
      значимости договора и общей конструкции.

    - Пустые или явно нерелевантные фрагменты:
      отрази, что данных недостаточно для уверенного вывода по последствиям
      смены контроля/уступки, и объясни, как это влияет на неопределённость.
    </edge_cases>

    <output_expectations>
    На основе твоего анализа отдельный механизм извлечения сформирует
    структурированные поля по заранее заданной схеме. Твоя задача —
    давать чёткие юридические выводы и указывать конкретные формулировки
    из текста, на которых они основаны.
    </output_expectations>
  prompt_file: null
  context_k: 4
  temperature: 0.0
  max_tokens: 512

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 500

retrieval:
  context_k: 4
  max_chunks: 8
  boost_keywords:
    - "termination"
    - "расторгнуть"
    - "acceleration"
    - "досрочное исполнение"
    - "step-up"
    - "дополнительное обеспечение"
    - "новация"
  rerank: true
  filters: {}

conditional: null

extraction:
  enabled: true
  mode: "hybrid"
  fields:
    - name: "termination_right"
      type: "string"
      allowed_values:
        - "none"
        - "limited"
        - "broad"

    - name: "acceleration"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "price_or_terms_change"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "additional_security"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "novation_required"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "overall_risk_level"
      type: "string"
      allowed_values:
        - "low"
        - "medium"
        - "high"

    - name: "reason"
      type: "string"

  store_payload: true

red_flags:
  items:
    - code: "CON1"
      description: "Право контрагента расторгнуть ключевой договор при смене контроля без компенсации."
    - code: "CON2"
      description: "Акселерация крупных обязательств при смене контроля."
    - code: "CON3"
      description: "Изменение цены/условий в сторону ухудшения для Target после смены контроля."
    - code: "CON4"
      description: "Жесткое требование доп.обеспечения, которое трудно выполнить после сделки."
