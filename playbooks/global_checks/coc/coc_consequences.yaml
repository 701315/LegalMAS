id: "coc_consequences"
name: "Последствия смены контроля"
group: "COC"
description: >
  Анализирует substantive последствия, которые наступают при смене
  контроля (Change of Control): право на расторжение и его механизм,
  акселерацию обязательств, изменение цены / условий, наличие
  смягчающих механизмов (cure period, waiver).

  Check не анализирует:
  - наличие / тип режима CoC — это задача coc_change_of_control_regime;
  - механику получения согласия — это задача coc_consent_terms;
  - последствия уступки прав / перевода долга — это задача
    assignment_transfer_consequences;
  - definition of control / CoC trigger;
  - оценку общего M&A-риска.

doc_types: []

severity: "critical"
severity_if_fail: "critical"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"
ui_mode: "field_extraction"

rules:
  keyword_mode: any

  keywords:
    high:
      - "(?i)right\\s+to\\s+terminate[\\s\\S]{0,40}(change\\s+of\\s+control|смен[а-я]+\\s+контрол)"
      - "(?i)terminat(e|ion)\\s+upon[\\s\\S]{0,20}(change|control)"
      - "(?i)право\\s+(на\\s+)?(одностороннее\\s+)?расторжени[ея][\\s\\S]{0,40}(смен[а-я]+\\s+контрол)"
      - "(?i)automatic(ally)?\\s+terminat(e|ion|ed)"
      - "(?i)автоматическ[а-я]+\\s+(прекращени|расторжени)"
      - "(?i)договор\\s+прекращает(ся)?\\s+действ"
      - "(?i)shall\\s+cease\\s+to\\s+be\\s+in\\s+(force|effect)"
      - "(?i)acceleration\\s+of[\\s\\S]{0,30}(payment|obligation|debt)"
      - "(?i)досрочн[а-я]+\\s+(исполнени|взыскани|погашени|возврат)"
      - "(?i)all\\s+outstanding\\s+amounts?\\s+(shall\\s+)?become\\s+due"
      - "(?i)step[-\\s]?up"
      - "(?i)увеличени[ея]\\s+(ставк|марж|процент)"
      - "(?i)отмен[аы]\\s+(скид[а-я]+|льгот|преференц)"

    medium:
      - "(?i)right\\s+to\\s+terminate"
      - "(?i)termination\\s+(right|option)"
      - "(?i)право\\s+расторгнуть"
      - "(?i)cure\\s+period"
      - "(?i)срок\\s+(для\\s+)?устранени[яи]"
      - "(?i)grace\\s+period"
      - "(?i)waiver"
      - "(?i)change\\s+of\\s+control"
      - "(?i)смена\\s+контроля"

    low:
      - "(?i)automatic(ally)?\\s+terminat"
      - "(?i)досрочн[а-я]+\\s+погашени"
      - "(?i)step[-\\s]?up"
      - "(?i)cure\\s+period"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 420

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  retrieval_profile: "change_of_control_check"
  context_k: 6
  max_chunks: 12

  retrieval_query: >
    смена контроля change of control расторжение termination
    автоматическое прекращение акселерация acceleration
    досрочное исполнение step-up изменение ставки cure period

  boost_keywords:
    - "termination upon change of control"
    - "расторжение при смене контроля"
    - "automatic termination"
    - "автоматическое прекращение"
    - "right to terminate"
    - "право расторгнуть"
    - "acceleration"
    - "досрочное исполнение"
    - "step-up"
    - "увеличение ставки"
    - "cure period"
    - "grace period"

  negative_keywords:
    - "уступка прав"
    - "assignment of rights"
    - "перевод долга"
    - "transfer of obligations"
    - "consent"
    - "согласие"
    - "означает"
    - "в целях настоящего"
    - "споры"
    - "подсудность"
    - "применимое право"

  preferred_unit_types:
    - "termination_provision"
    - "liability_provision"
    - "obligation"
    - "general_provision"

  excluded_unit_types:
    - "definition"
    - "structural_anchor"
    - "technical_fragment"
    - "appendix_reference"

  preferred_clause_functions:
    - "rights"
    - "limitations"
    - "procedures"
    - "obligations"

  position_bias:
    preferred_range: [0.50, 1.00]
    boost: 0.30
    scope: "segment"

  rerank: true
  filters: {}

conditional: null

enrichment_hints:
  preferred_segment_types:
    - "contract"
    - "amendment"
  excluded_segment_types:
    - "technical_specification"
    - "price_list"
    - "invoice"
    - "act"
  confidence_bonus_on_match: 0.10
  confidence_penalty_on_excluded_segment: 0.15

extraction:
  enabled: true
  mode: "hybrid"
  llm_max_tokens: 850

  llm_prompt_extraction: |
    <role>
    Ты — юрист по M&A и коммерческим договорам.
    Твоя задача — точно извлечь substantive последствия,
    которые наступают при смене контроля (Change of Control).

    КРИТИЧЕСКИ ВАЖНО:
    - Извлекай ТОЛЬКО то, что прямо написано в тексте.
    - НЕ делай выводов "по умолчанию" из общих норм права.
    - НЕ додумывай последствия, которых нет в тексте.
    - Если информация отсутствует — ставь "no",
      а не предполагай наиболее вероятный вариант.
    - Если текст неоднозначен — ставь "unclear".

    Не анализируй механику согласия.
    Не анализируй definition of control или CoC trigger.
    Не анализируй последствия уступки прав / перевода долга.
    Не оценивай общий M&A-риск.
    </role>

    <context_rules>
    - Ниже приведены фрагменты, отобранные автоматически.
    - Некоторые фрагменты могут быть нерелевантны данному
      check — игнорируй их.
    - Если среди фрагментов есть противоречия — укажи "unclear"
      и объясни в reason.
    - Если ни один фрагмент не содержит информации по теме —
      используй значения для случая "последствия не установлены".
    - Не используй информацию из определений (definitions),
      преамбулы или приложений, если они не содержат
      substantive условий по теме check.
    </context_rules>

    <context>
    Ниже приведены релевантные фрагменты договора:

    {context}
    </context>

    <task>
    Заполни только следующие поля:
    - coc_consequences_display
    - coc_termination_right
    - coc_termination_mechanism
    - coc_acceleration
    - coc_price_terms_change
    - coc_cure_or_waiver
    - reason

    Общие правила:
    - используй только то, что прямо следует из текста;
    - не придумывай последствий, которых нет;
    - пиши коротко и по-русски.
    </task>

    <location_instructions>
    Для каждого поля по возможности укажи location в формате:
    {"clause_ref": "п. 12.2", "page": 8, "quote": "дословная фраза из договора"}

    Правила:
    - clause_ref — короткая ссылка на пункт / раздел / статью именно в том виде,
      как она написана в договоре;
    - page — целое число страницы;
    - quote — дословная фраза из текста договора (НЕ пересказ, НЕ парафраз),
      которая является источником значения поля. Копируй её посимвольно,
      сохраняя формулировку и порядок слов. Оптимальная длина: 30–300 символов.
      Если значение поля выведено из конкретной фразы договора — quote ДОЛЖЕН
      содержать эту фразу без изменений.
      Примеры хорошего quote:
      * для coc_termination_right (broad): "В случае смены контроля Покупатель вправе расторгнуть настоящий Договор в одностороннем порядке";
      * для coc_termination_mechanism (automatic): "При наступлении смены контроля настоящий Договор автоматически прекращает своё действие";
      * для coc_acceleration (yes): "При смене контроля вся сумма задолженности подлежит досрочному погашению";
      * для coc_price_terms_change (yes): "При смене контроля процентная ставка увеличивается на 2 процентных пункта";
      * для coc_cure_or_waiver (yes): "Сторона вправе расторгнуть Договор только по истечении 30 дней с момента получения уведомления".
    - не выдумывай location или quote;
    - если точную ссылку или дословную фразу определить нельзя,
      верни location = null;
    - для coc_consequences_display и reason location всегда null;
    - для signal-полей возвращай location с quote только когда
      значение поля указывает на наличие соответствующего последствия
      (coc_termination_right ∈ {limited, broad}; coc_acceleration = yes;
       coc_price_terms_change = yes; coc_cure_or_waiver = yes;
       coc_termination_mechanism ∈ {automatic, with_cure, optional}).
      Для значений "none", "no", "not_applicable", "unclear" — location = null.
    </location_instructions>

    <instructions>
    Шаг 1 — ПРАВО НА РАСТОРЖЕНИЕ

    Заполни "coc_termination_right".

    Значения:
    - "none" — нет специального права на расторжение при CoC.
    - "limited" — право есть, но ограниченное: только при
      определённых условиях, после notice или с cure period.
    - "broad" — широкое право расторгнуть при CoC.
    - "unclear" — нельзя определить.

    Шаг 2 — МЕХАНИЗМ РАСТОРЖЕНИЯ

    Заполни "coc_termination_mechanism".

    Значения:
    - "optional" — расторжение по выбору стороны.
    - "automatic" — договор прекращается автоматически при CoC.
    - "with_cure" — расторжение только после cure period.
    - "not_applicable" — coc_termination_right = "none".
    - "unclear" — нельзя определить.

    Шаг 3 — АКСЕЛЕРАЦИЯ

    Заполни "coc_acceleration".

    Значения:
    - "yes" — предусмотрено требование досрочного исполнения
      при CoC: погашение долга, возврат имущества и т.п.
    - "no" — не предусмотрено.
    - "unclear" — нельзя определить.

    Шаг 4 — ИЗМЕНЕНИЕ ЦЕНЫ / УСЛОВИЙ

    Заполни "coc_price_terms_change".

    Значения:
    - "yes" — предусмотрено ухудшение условий при CoC:
      step-up ставки, отмена скидок / льгот, иные ухудшения.
    - "no" — не предусмотрено.
    - "unclear" — нельзя определить.

    Шаг 5 — СМЯГЧАЮЩИЕ МЕХАНИЗМЫ

    Заполни "coc_cure_or_waiver".

    Значения:
    - "yes" — есть cure period, grace period или waiver.
    - "no" — смягчающих механизмов нет.
    - "unclear" — нельзя определить.

    Шаг 6 — DISPLAY ДЛЯ DD GRID

    Заполни "coc_consequences_display".

    Это поле — краткий итог для таблицы.
    Сформируй его на основе уже заполненных полей:
    - coc_termination_right
    - coc_termination_mechanism
    - coc_acceleration
    - coc_price_terms_change
    - coc_cure_or_waiver
    Не добавляй информацию, которой нет в этих полях.

    Правила:
    - Начинай с "Для CoC — ".
    - Перечисляй последствия через точку с запятой
      в порядке убывания материальности.
    - Если cure/waiver есть — добавь в конец.

    Примеры:
    - "Для CoC — автоматическое прекращение договора"
    - "Для CoC — право расторгнуть; cure period предусмотрен"
    - "Для CoC — право расторгнуть; акселерация; step-up ставки"
    - "Для CoC — только согласие контрагента"
    - "Для CoC — только уведомление контрагента"
    - "Последствия CoC не установлены"
    - "Не удалось определить последствия CoC"

    Шаг 7 — ОБОСНОВАНИЕ

    Заполни "reason".

    Формат:
    - Первое предложение: краткий вывод
      (какие последствия предусмотрены или не предусмотрены).
    - Второе предложение: цитата из текста в кавычках
      (самый релевантный фрагмент, до 100 символов).

    Примеры:
    - "При CoC договор прекращается автоматически без cure period.
      «Upon a change of control this Agreement shall terminate»."
    - "Специальные последствия CoC не обнаружены
      в представленных фрагментах."
    </instructions>

    <edge_cases>
    - Договор прекращается автоматически:
      * coc_termination_right = "broad"
      * coc_termination_mechanism = "automatic"
      * coc_cure_or_waiver = "no"
      * coc_consequences_display =
        "Для CoC — автоматическое прекращение договора"

    - Право расторгнуть с cure period:
      * coc_termination_right = "limited"
      * coc_termination_mechanism = "with_cure"
      * coc_cure_or_waiver = "yes"
      * coc_consequences_display =
        "Для CoC — право расторгнуть; cure period предусмотрен"

    - CoC clause есть, но только требование согласия:
      * coc_termination_right = "none"
      * coc_acceleration = "no"
      * coc_price_terms_change = "no"
      * coc_consequences_display =
        "Для CoC — только согласие контрагента"

    - Только уведомление, без расторжения / акселерации:
      * coc_termination_right = "none"
      * coc_acceleration = "no"
      * coc_price_terms_change = "no"
      * coc_consequences_display =
        "Для CoC — только уведомление контрагента"

    - Нет упоминаний последствий CoC:
      * coc_termination_right = "none"
      * coc_termination_mechanism = "not_applicable"
      * coc_acceleration = "no"
      * coc_price_terms_change = "no"
      * coc_cure_or_waiver = "no"
      * coc_consequences_display =
        "Последствия CoC не установлены"

    - Фрагменты нерелевантны:
      * coc_termination_right = "unclear"
      * coc_termination_mechanism = "unclear"
      * coc_acceleration = "unclear"
      * coc_price_terms_change = "unclear"
      * coc_cure_or_waiver = "unclear"
      * coc_consequences_display =
        "Не удалось определить последствия CoC"
    </edge_cases>

    <output_expectations>
    - Верни результат строго в формате JSON.
    - Не оборачивай в markdown-блоки (без ```).
    - Не добавляй комментариев вне JSON.
    - Все значения полей с allowed_values — на английском
      (как указано в списке).
    - Свободные текстовые поля (coc_consequences_display,
      reason) — на русском языке.
    - Не добавляй никаких полей, кроме указанных.
    - Для каждого поля возвращай объект с ключами
      "value", "confidence", "location".

    Пример структуры ответа:
    {
      "coc_consequences_display": {"value": "Для CoC — автоматическое прекращение договора; акселерация", "confidence": 0.95, "location": null},
      "coc_termination_right": {"value": "broad", "confidence": 0.95, "location": {"clause_ref": "п. 12.2", "page": 8, "quote": "В случае смены контроля Покупатель вправе расторгнуть настоящий Договор в одностороннем порядке"}},
      "coc_termination_mechanism": {"value": "automatic", "confidence": 0.9, "location": {"clause_ref": "п. 12.2", "page": 8, "quote": "При наступлении смены контроля настоящий Договор автоматически прекращает своё действие"}},
      "coc_acceleration": {"value": "yes", "confidence": 0.9, "location": {"clause_ref": "п. 12.3", "page": 8, "quote": "При смене контроля вся сумма задолженности подлежит досрочному погашению"}},
      "coc_price_terms_change": {"value": "no", "confidence": 0.9, "location": null},
      "coc_cure_or_waiver": {"value": "no", "confidence": 0.9, "location": null},
      "reason": {"value": "...", "confidence": 0.90, "location": null}
    }
    </output_expectations>

  fields:
    - name: "coc_consequences_display"
      type: "string"
      presentation: "fact"
      label: "Последствия CoC"
      description: "Нормализованный user-facing вывод для DD Grid"
      display_in_grid: true
      display_priority: 1

    - name: "coc_termination_right"
      type: "string"
      presentation: "signal"
      risk_weight: "high"
      description: "Право на расторжение при CoC"
      display_in_grid: false
      allowed_values:
        - "none"
        - "limited"
        - "broad"
        - "unclear"

    - name: "coc_termination_mechanism"
      type: "string"
      presentation: "signal"
      risk_weight: "high"
      description: "Механизм расторжения при CoC"
      display_in_grid: false
      allowed_values:
        - "optional"
        - "automatic"
        - "with_cure"
        - "not_applicable"
        - "unclear"

    - name: "coc_acceleration"
      type: "string"
      presentation: "signal"
      risk_weight: "high"
      description: "Акселерация при CoC"
      display_in_grid: false
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "coc_price_terms_change"
      type: "string"
      presentation: "signal"
      risk_weight: "medium"
      description: "Изменение цены / условий при CoC"
      display_in_grid: false
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "coc_cure_or_waiver"
      type: "string"
      presentation: "signal"
      risk_weight: "low"
      description: "Cure period / waiver при CoC"
      display_in_grid: false
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "reason"
      type: "string"
      presentation: "diagnostic"
      description: "Краткое обоснование"
      display_in_grid: false

  store_payload: true
  
  
