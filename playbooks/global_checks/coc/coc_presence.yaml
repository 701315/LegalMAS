id: "coc_presence"
name: "Наличие клауз смены контроля"
description: >
  Проверяет, содержит ли договор положения о смене контроля
  (change of control, смена бенефициара, переход контроля).

doc_types: []    # пусто = все типы

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"

rules:
  keywords:
    - "смена контроля"
    - "смены контроля"
    - "смене контроля"
    - "change of control"
    - "change-of-control"
    - "переход контроля"
    - "переход права контроля"
    - "смена бенефициарного владельца"
    - "смена бенефициара"
    - "change in ownership"
    - "ultimate beneficial owner"
    - "indirect transfer"
  keyword_mode: "any"
  regex_patterns: []
  clause_patterns: []

llm:
  prompt_template: |
    <role>
    Ты — юрист по M&A и коммерческим договорам.
    Твоя специализация — выявление и анализ положений о смене контроля
    (change of control) в договорах.
    </role>

    <context>
    Ниже приведены фрагменты одного договора:

    {context}
    </context>

    <instructions>
    Проведи анализ по шагам. Каждый шаг логически связан с полем
    итоговой оценки "has_coc_clause" и объяснением в "reason".

    Шаг 1 — НАЛИЧИЕ ПОЛОЖЕНИЙ О СМЕНЕ КОНТРОЛЯ
    (используется для заполнения поля "has_coc_clause"):
    - Определи, содержит ли договор положения о смене контроля в широком смысле:
      * прямой или косвенный переход контроля над долями/акциями,
      * смена ultimate beneficial owner (UBO),
      * смена контроля через сделки с материнскими/дочерними компаниями,
      * иные формулировки, связывающие права/обязанности сторон
        с изменением структуры владения или контроля.
    - Учитывай:
      * прямое использование термина "смена контроля" или аналогов,
      * привязку прав/обязанностей к изменению состава участников/акционеров
        или бенефициаров,
      * предоставление контрагенту прав при смене владельца/контрольного пакета.
    - Сделай вывод: есть ли в договоре CoC-клауза (yes), её явно нет (no),
      либо по имеющимся фрагментам вывод невозможен (unclear).

    Шаг 2 — ОБОСНОВАНИЕ ВЫВОДА
    (используется для заполнения поля "reason"):
    - Кратко опиши, на каких формулировках основан вывод о наличии или
      отсутствии CoC-клауз:
      * процитируй ключевые выражения ("смены контроля", "change of control",
        "существенные изменения в структуре владения" и т.п.);
      * либо укажи, что таких формулировок в доступных фрагментах нет.
    - Если формулировки двусмысленные или обрывочные, явно зафиксируй
      неопределённость и объясни, что именно видно и чего не хватает.
    </instructions>

    <edge_cases>
    Обрабатывай пограничные ситуации так:

    - Есть только общие формулировки о запрете уступки прав и перевода долга
      без согласия, но нет упоминаний смены контроля/бенефициара:
      относись к этому как к отсутствию CoC-клауз, даже если риски уступки
      сами по себе высоки.

    - Есть формулировки о смене участника/акционера или бенефициара,
      но без явных последствий:
      всё равно считай, что CoC-клауза есть, и в объяснении укажи, что
      последствия не прописаны или минимальны.

    - Формулировки о "существенных изменениях в структуре владения"
      без явного термина "change of control":
      оцени по контексту — если такие изменения очевидно связаны с
      переходом контроля, допускай наличие CoC-клаузы, но опиши это
      в объяснении.

    - Фрагменты противоречивы или сильно обрывочны:
      фиксируй "unclear" и подробно опиши, какие элементы CoC-клауз
      видны, а какие — нет.

    - Пустые или явно нерелевантные фрагменты:
      укажи, что данных недостаточно для анализа наличия CoC-клауз,
      и объясни это в "reason".
    </edge_cases>

    <output_expectations>
    На основе твоего анализа отдельный механизм извлечения сформирует
    структурированные поля по заранее заданной схеме. Твоя задача —
    давать чёткие юридические выводы и указывать конкретные формулировки
    из текста, на которых они основаны.
    </output_expectations>
  prompt_file: null
  context_k: 3
  temperature: 0.0
  max_tokens: 256

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 400

retrieval:
  context_k: 3
  max_chunks: 6
  boost_keywords:
    - "change of control"
    - "смена контроля"
    - "смена бенефициарного владельца"
  rerank: true
  filters: {}

conditional: null

extraction:
  enabled: true
  mode: "hybrid"
  fields:
    - name: "has_coc_clause"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "reason"
      type: "string"

  store_payload: true

red_flags:
  items:
    - code: "C1"
      description: "Важный договор без явной CoC-клаузулы, при этом бизнес зависит от структуры владения."
