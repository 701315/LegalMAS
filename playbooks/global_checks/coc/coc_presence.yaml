id: "coc_presence"
name: "Наличие клауз смены контроля"
description: >
  Проверяет, содержит ли договор положения о смене контроля
  (change of control, смена бенефициара, переход контроля).

doc_types: []    # пусто = все типы

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"

rules:
  keywords:
    - "смена контроля"
    - "смены контроля"
    - "смене контроля"
    - "change of control"
    - "change-of-control"
    - "переход контроля"
    - "переход права контроля"
    - "смена бенефициарного владельца"
    - "смена бенефициара"
    - "change in ownership"
    - "ultimate beneficial owner"
    - "indirect transfer"
  keyword_mode: "any"
  regex_patterns: []
  clause_patterns: []

llm:
  prompt_template: |
    <role>
    Ты — юрист по M&A и коммерческим договорам.
    Твоя специализация — выявление и анализ положений о смене контроля
    (change of control) в договорах.
    </role>

    <context>
    Ниже приведены фрагменты одного договора:

    {context}
    </context>

    <instructions>
    Определи, содержит ли договор положения о смене контроля
    (change of control, смена контроля, смена бенефициарного владельца,
    переход контроля) в широком смысле, включая:
    - прямой и косвенный переход контроля над долями/акциями,
    - смену ultimate beneficial owner (UBO),
    - смену контроля через сделки с материнскими/дочерними компаниями.

    Учитывай любые формулировки, которые:
    - прямо используют термин "смена контроля" или аналог,
    - привязывают права/обязанности сторон к изменению структуры владения,
    - дают контрагенту права при смене владельца/контрольного пакета.

    Если по фрагментам невозможно сделать уверенный вывод, используй "unclear".
    Не делай предположений, если явных формулировок нет.
    </instructions>

    <edge_cases>
    ВАЖНО — пограничные случаи:

    — Если есть только общие формулировки о запрете уступки прав и
      перевода долга без согласия, но НЕТ упоминаний change of control
      или аналогичных конструкций:
      has_coc_clause = "no" (это не CoC-клауза).

    — Если есть формулировки о смене участника/акционера, но без
      последствий (прав на расторжение/согласие и т.п.), всё равно
      трактуй это как наличие CoC-клаузы (has_coc_clause = "yes"),
      а в reason опиши отсутствие последствий.

    — Если фрагменты противоречивы или обрывочны:
      has_coc_clause = "unclear" и подробно опиши, что именно видно/не видно.

    — Пустые или нерелевантные фрагменты:
      has_coc_clause = "unclear",
      reason = "Недостаточно данных для анализа наличия CoC-клаузулы".
    </edge_cases>

    <examples>
    ПРИМЕР 1 — ЯВНАЯ CoC-КЛАУЗА (YES):

    Фрагмент: "В случае смены контроля над Заёмщиком Банку предоставляется
    право потребовать досрочного погашения всей суммы задолженности в течение
    30 (тридцати) календарных дней."

    {{
      "has_coc_clause": "yes",
      "reason": "Прямо указано условие о смене контроля над Заёмщиком с последствиями в виде права Банка на досрочное погашение задолженности."
    }}

    ПРИМЕР 2 — НЕТ CoC-КЛАУЗЫ (NO):

    Фрагмент: "Сторона не вправе уступать права и переводить долг по
    настоящему Договору без предварительного письменного согласия другой
    Стороны."

    {{
      "has_coc_clause": "no",
      "reason": "Регулируется только уступка прав и перевод долга, нет упоминаний смены контроля/бенефициара или последствий смены контроля."
    }}

    ПРИМЕР 3 — НЕЯСНО (UNCLEAR):

    Фрагмент: "Сторона обязуется уведомить другую Сторону о любых
    существенных изменениях в своей структуре владения."

    {{
      "has_coc_clause": "unclear",
      "reason": "Есть упоминание существенных изменений в структуре владения, но нет ясного указания на change of control и связанные последствия."
    }}
    </examples>

    <output_format>
    Твой ответ ДОЛЖЕН быть строго валидным JSON-объектом со следующими
    полями:

    {{
      "has_coc_clause": "one of: yes | no | unclear",
      "reason": "string — краткое объяснение на русском с указанием, какие формулировки (или их отсутствие) привели к выводу"
    }}

    Все перечисленные поля ДОЛЖНЫ присутствовать в JSON, даже если их значение равно null.
    </output_format>

    <constraints>
    ЖЁСТКИЕ ПРАВИЛА:
    1. Выведи ТОЛЬКО один JSON-объект. Никакого текста до или после.
    2. Не пиши "Вот JSON", "Here is the JSON" и т.п.
    3. Не используй Markdown, бэктики ``` или любые обёртки.
    4. Все строки — в двойных кавычках.
    5. Значения перечислимых полей — СТРОГО из указанных вариантов.
    6. Ключи — точно как указано, без добавления новых.
    7. Поле "reason" ДОЛЖНО содержать конкретные отсылки к тексту
       (или указание на отсутствие формулировок), а не общие фразы.
    8. Начни ответ сразу с символа {{
    9. Если по какому‑то полю нет достаточно информации в тексте —
       верни для него 'unclear' или null (для reason недопустим пустой ответ,
       нужно объяснение). НЕ придумывай значения, не интерполируй.
    </constraints>
  prompt_file: null
  context_k: 3
  temperature: 0.0
  max_tokens: 256

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 400

retrieval:
  context_k: 3
  max_chunks: 6
  boost_keywords:
    - "change of control"
    - "смена контроля"
    - "смена бенефициарного владельца"
  rerank: true
  filters: {}

conditional: null

extraction:
  enabled: true
  mode: "hybrid"
  fields:
    - name: "has_coc_clause"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
    - name: "reason"
      type: "string"
  store_payload: true

red_flags:
  items:
    - code: "C1"
      description: "Важный договор без явной CoC-клаузулы, при этом бизнес зависит от структуры владения."