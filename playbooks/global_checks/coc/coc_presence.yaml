id: "coc_presence"
name: "Наличие клауз смены контроля"
description: >
  Проверяет, содержит ли договор положения о смене контроля
  (change of control, смена бенефициара, переход контроля).
  Определяет тип триггера (прямая/косвенная смена, UBO),
  характер последствий (уведомление, согласие, расторжение)
  и наличие пробелов в покрытии. Детальный анализ содержания
  и рисков CoC-клаузы выполняется отдельным чеком.

ui_mode: "clause_presence"
doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"

rules:
  keyword_mode: any

  keywords:
    high:
      # Смена контроля — прямые термины
      - "(?i)change\\s+of\\s+control"
      - "(?i)change[-\\s]of[-\\s]control"
      - "(?i)смен[аы]\\s+контрол[яю]"
      - "(?i)переход\\s+контрол[яю]"
      - "(?i)переход\\s+прав[аов]?\\s+контрол[яю]"

      # Бенефициарное владение
      - "(?i)смен[аы]\\s+бенефициарного\\s+владельц[аы]"
      - "(?i)смен[аы]\\s+бенефициар[аы]"
      - "(?i)ultimate\\s+beneficial\\s+owner"
      - "(?i)\\bUBO\\b"
      - "(?i)change\\s+in\\s+beneficial\\s+ownership"
      - "(?i)изменени[ея]\\s+бенефициарного\\s+владени[яи]"

      # Переход контроля через акции/доли
      - "(?i)change\\s+in\\s+ownership"
      - "(?i)change\\s+in\\s+control"
      - "(?i)transfer\\s+of\\s+controlling\\s+(interest|stake|share)"
      - "(?i)переход\\s+контрольного\\s+(пакета|интереса)"
      - "(?i)отчуждени[ея]\\s+контрольного\\s+пакета"
      - "(?i)отчуждени[ея]\\s+(более\\s+)?(50|пятидесят)"

      # Косвенная смена
      - "(?i)indirect\\s+transfer"
      - "(?i)indirect\\s+change\\s+of\\s+control"
      - "(?i)косвенн[а-я]+\\s+(смен[аы]|переход|передач[аи])"

    medium:
      # Структура владения
      - "(?i)ownership\\s+structure"
      - "(?i)структур[аы]\\s+владени[яи]"
      - "(?i)существенн[а-я]+\\s+изменени[яе]\\s+в\\s+структур"
      - "(?i)material\\s+change\\s+in\\s+(the\\s+)?(ownership|shareholding)"
      - "(?i)изменени[ея]\\s+состав[аы]\\s+(участников|акционеров)"
      - "(?i)change\\s+in\\s+(the\\s+)?(composition\\s+of\\s+)?(shareholders?|members?)"

      # Контролирующие лица
      - "(?i)controlling\\s+(person|party|shareholder|entity)"
      - "(?i)контролирующ[а-я]+\\s+(лиц[аоу]|сторон|акционер|участник)"
      - "(?i)конечн[а-я]+\\s+бенефициар"
      - "(?i)beneficial\\s+owner"
      - "(?i)бенефициарн[а-я]+\\s+владел"

      # Согласие при смене
      - "(?i)consent\\s+to\\s+(a\\s+)?(change|transfer)\\s+of\\s+control"
      - "(?i)согласи[ея]\\s+на\\s+(смену|переход)\\s+контрол"
      - "(?i)prior\\s+written\\s+consent[\\s\\S]{0,40}(change|transfer|control)"
      - "(?i)предварительн[а-я]+\\s+письменн[а-я]+\\s+согласи[ея]"

      # Право расторжения при смене контроля
      - "(?i)right\\s+to\\s+terminate[\\s\\S]{0,40}change\\s+of\\s+control"
      - "(?i)право\\s+(на\\s+)?расторжени[ея][\\s\\S]{0,40}смен[аы]\\s+контрол"

    low:
      # Общие термины
      - "(?i)control"
      - "(?i)контрол[ьяю]"
      - "(?i)ownership"
      - "(?i)владени[ея]"
      - "(?i)shareholder"
      - "(?i)акционер"
      - "(?i)participant"
      - "(?i)участник"
      - "(?i)transfer"
      - "(?i)передач"
      - "(?i)assignment"
      - "(?i)уступк"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 512

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 500

retrieval:
  context_k: 5
  max_chunks: 8
  boost_keywords:
    - "change of control"
    - "change-of-control"
    - "смена контроля"
    - "переход контроля"
    - "смена бенефициарного владельца"
    - "смена бенефициара"
    - "ultimate beneficial owner"
    - "UBO"
    - "change in ownership"
    - "indirect transfer"
    - "косвенная смена контроля"
    - "transfer of controlling interest"
    - "переход контрольного пакета"
    - "существенные изменения в структуре владения"
    - "consent to change of control"
    - "согласие на смену контроля"
    - "right to terminate"
    - "право на расторжение"
  rerank: true
  filters: {}

conditional: null

extraction:
  llm_prompt_extraction: |
    <role>
    Ты — юрист по M&A и коммерческим договорам.
    Твоя специализация — выявление и анализ положений о смене контроля
    (change of control) в договорах, включая прямую и косвенную смену
    контроля, смену UBO и различные типы последствий.
    </role>

    <context>
    Ниже приведены фрагменты одного договора:

    {context}
    </context>

    <instructions>
    Проведи анализ по шагам. Каждый шаг логически соответствует одному
    или нескольким полям итоговой оценки.

    Шаг 1 — НАЛИЧИЕ CoC-КЛАУЗЫ
    (используется для заполнения поля "has_coc_clause"):
    - Определи, содержит ли договор положения о смене контроля
      в широком смысле:
      * прямой переход контроля (продажа контрольного пакета
        акций/долей);
      * косвенный переход (через материнские/холдинговые структуры);
      * смена ultimate beneficial owner (UBO);
      * иные формулировки, связывающие права/обязанности сторон
        с изменением структуры владения или контроля.
    - Оцени:
      * "yes" — CoC-клауза есть;
      * "no" — явно отсутствует;
      * "unclear" — по фрагментам вывод невозможен.
    - ВАЖНО: не путай с общим запретом уступки прав/перевода
      долга (assignment/novation) — это разные вещи.

    Шаг 2 — ТИП ТРИГГЕРА CoC
    (используется для заполнения поля "coc_trigger_type"):
    - Если CoC-клауза найдена, определи, какие виды смены
      контроля она покрывает:
      * "direct_only" — только прямая смена контроля
        (продажа акций/долей целевой стороны);
      * "direct_and_indirect" — прямая и косвенная
        (через материнские/холдинговые структуры);
      * "includes_ubo" — охватывает смену UBO
        (ultimate beneficial owner);
      * "broad" — широкое определение, покрывающее прямую,
        косвенную смену и UBO;
      * "unclear" — тип триггера неясен;
      * "not_applicable" — CoC-клауза отсутствует.

    Шаг 3 — ХАРАКТЕР ПОСЛЕДСТВИЙ
    (используется для заполнения поля "coc_consequence_type"):
    - Если CoC-клауза найдена, определи, какие последствия
      предусмотрены при смене контроля:
      * "notification" — только обязанность уведомить;
      * "consent_required" — требуется предварительное согласие;
      * "termination_right" — право на расторжение договора;
      * "renegotiation" — право требовать пересмотра условий;
      * "multiple" — несколько типов последствий (укажи какие
        в reason);
      * "no_consequences" — смена контроля упоминается,
        но последствия не прописаны;
      * "unclear" — последствия неясны;
      * "not_applicable" — CoC-клауза отсутствует.

    Шаг 4 — RED FLAGS
    (используется для заполнения поля "red_flags"):
    Присвой один или несколько кодов из списка ниже.
    Если ни один код не применим — верни "NONE".
    Если данных недостаточно для оценки — верни "UNCLEAR".

    Коды:
    • COC1 — CoC-клауза отсутствует в договоре, что создаёт
      риск неконтролируемой смены контроля без последствий
      для контрагента.
    • COC2 — CoC-клауза покрывает только прямую смену контроля —
      косвенная смена (через материнские/холдинговые структуры)
      не затрагивается.
    • COC3 — CoC-клауза не охватывает смену UBO
      (ultimate beneficial owner).
    • COC4 — CoC-клауза упоминает смену контроля, но не определяет
      чётких последствий (нет права на расторжение, согласие
      не требуется, уведомление не предусмотрено).

    Формат ответа: коды через запятую без комментариев
    (например: "COC2, COC3").
    Вся аргументация — в поле reason.

    Шаг 5 — ОБОСНОВАНИЕ
    (используется для заполнения поля "reason"):
    - Кратко обоснуй вывод, опираясь на ключевые формулировки
      из текста (с цитатами в кавычках):
      * процитируй ключевые выражения («смена контроля»,
        «change of control», «существенные изменения
        в структуре владения» и т.п.);
      * укажи, какой тип триггера и какие последствия
        прослеживаются;
      * если CoC-клауза отсутствует — укажи, что подобных
        формулировок не обнаружено;
      * если выставлены red_flags — обоснуй каждый код;
      * если red_flags = "NONE" — укажи, почему CoC-клауза
        адекватна.
    </instructions>

    <edge_cases>
    Обрабатывай пограничные ситуации так:

    - Есть только общий запрет уступки прав / перевода долга
      (assignment/novation) без упоминаний смены контроля/
      бенефициара:
      has_coc_clause = "no"; зафиксируй COC1;
      в reason укажи, что запрет уступки не эквивалентен
      CoC-клаузе.

    - Есть формулировки о смене участника/акционера
      или бенефициара, но без явных последствий:
      has_coc_clause = "yes";
      coc_consequence_type = "no_consequences";
      зафиксируй COC4; в reason укажи, что последствия
      не прописаны.

    - «Существенные изменения в структуре владения» без
      термина «change of control»:
      оцени по контексту — если формулировка очевидно
      связана с переходом контроля, has_coc_clause = "yes";
      в reason опиши, что использована косвенная формулировка.

    - CoC-клауза покрывает только прямую смену (продажу
      акций/долей напрямую), но не косвенную:
      coc_trigger_type = "direct_only";
      зафиксируй COC2; в reason укажи пробел.

    - CoC-клауза не упоминает UBO:
      зафиксируй COC3; в reason укажи, что смена UBO
      через многоуровневую структуру может остаться
      за рамками клаузы.

    - Фрагменты противоречивы или сильно обрывочны:
      has_coc_clause = "unclear";
      red_flags = "UNCLEAR"; в reason подробно опиши,
      какие элементы CoC-клауз видны, а какие — нет.

    - Пустые или явно нерелевантные фрагменты:
      has_coc_clause = "unclear"; red_flags = "UNCLEAR";
      в reason укажи, что данных недостаточно.
    </edge_cases>

    <output_expectations>
    На основе твоего анализа отдельный механизм извлечения сформирует
    структурированные поля по заранее заданной схеме. Твоя задача —
    давать чёткие юридические выводы и указывать конкретные
    формулировки из текста, на которых они основаны.
    </output_expectations>

  enabled: true
  mode: "hybrid"
  fields:
    - name: "has_coc_clause"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "coc_trigger_type"
      type: "string"
      allowed_values:
        - "direct_only"
        - "direct_and_indirect"
        - "includes_ubo"
        - "broad"
        - "unclear"
        - "not_applicable"

    - name: "coc_consequence_type"
      type: "string"
      allowed_values:
        - "notification"
        - "consent_required"
        - "termination_right"
        - "renegotiation"
        - "multiple"
        - "no_consequences"
        - "unclear"
        - "not_applicable"

    - name: "red_flags"
      type: "string"

    - name: "reason"
      type: "string"

  store_payload: true

red_flags:
  items:
    - code: "COC1"
      description: >
        CoC-клауза отсутствует в договоре, что создаёт
        риск неконтролируемой смены контроля без последствий.
    - code: "COC2"
      description: >
        CoC-клауза покрывает только прямую смену контроля —
        косвенная смена (через материнские/холдинговые структуры)
        не затрагивается.
    - code: "COC3"
      description: >
        CoC-клауза не охватывает смену UBO
        (ultimate beneficial owner).
    - code: "COC4"
      description: >
        CoC-клауза упоминает смену контроля, но не определяет
        чётких последствий (нет права на расторжение, согласие
        не требуется).
        