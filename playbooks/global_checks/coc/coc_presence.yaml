id: "coc_presence"
name: "Наличие клауз смены контроля"
group: "COC"
description: >
  Screening-check: проверяет, содержит ли договор положения о смене
  контроля (change of control, смена бенефициара, переход контроля),
  определяет тип триггера (прямая / косвенная смена / UBO / широкое
  покрытие) и выявляет пробелы в покрытии CoC-клаузы.

  Также извлекает верхнеуровневый характер последствий
  (уведомление / согласие / расторжение / несколько) как routing-сигнал
  для drill-down чеков: детальный анализ механики согласия выполняется
  чеком coc_consent_terms, детальный анализ последствий —
  чеком coc_consequences.

  Важно: общий запрет уступки прав (assignment / novation) без
  упоминания смены контроля / бенефициара не является CoC-клаузой.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"
ui_mode: "field_extraction"

rules:
  keyword_mode: any

  keywords:
    high:
      - "(?i)change\\s+of\\s+control"
      - "(?i)change[-\\s]of[-\\s]control"
      - "(?i)change\\s+in\\s+control"
      - "(?i)смен[аы]\\s+контрол[яю]"
      - "(?i)переход\\s+контрол[яю]"
      - "(?i)переход\\s+прав[аов]?\\s+контрол[яю]"
      - "(?i)смен[аы]\\s+бенефициарного\\s+владельц[аы]"
      - "(?i)смен[аы]\\s+бенефициар[аы]"
      - "(?i)ultimate\\s+beneficial\\s+owner"
      - "(?i)\\bUBO\\b"
      - "(?i)change\\s+in\\s+beneficial\\s+ownership"
      - "(?i)изменени[ея]\\s+бенефициарного\\s+владени[яи]"
      - "(?i)transfer\\s+of\\s+controlling\\s+(interest|stake|share)"
      - "(?i)acquisition\\s+of\\s+control"
      - "(?i)переход\\s+контрольного\\s+(пакета|интереса)"
      - "(?i)отчуждени[ея]\\s+контрольного\\s+пакета"
      - "(?i)change\\s+in\\s+ownership"
      - "(?i)indirect\\s+(change\\s+of\\s+control|transfer\\s+of\\s+control)"
      - "(?i)indirect\\s+change\\s+in\\s+ownership"
      - "(?i)косвенн[а-я]+\\s+(смен[аы]|переход)[\\s\\S]{0,30}контрол"

    medium:
      - "(?i)material\\s+change\\s+in\\s+(ownership|shareholding)"
      - "(?i)существенн[а-я]+\\s+изменени[яе]\\s+в\\s+структур[ае]\\s+владени"
      - "(?i)change\\s+in\\s+(composition\\s+of\\s+)?(shareholders?|members?)"
      - "(?i)изменени[ея]\\s+состав[аы]\\s+(участников|акционеров)"
      - "(?i)controlling\\s+(person|party|shareholder|entity)"
      - "(?i)контролирующ[а-я]+\\s+(лиц[аоу]|сторон|акционер|участник)"
      - "(?i)конечн[а-я]+\\s+бенефициар"
      - "(?i)beneficial\\s+owner"
      - "(?i)consent\\s+to\\s+(a\\s+)?change\\s+(of|in)\\s+control"
      - "(?i)согласи[ея]\\s+на\\s+(смену|переход)\\s+контрол"
      - "(?i)right\\s+to\\s+terminate[\\s\\S]{0,40}change\\s+of\\s+control"
      - "(?i)право\\s+(на\\s+)?расторжени[ея][\\s\\S]{0,40}смен[аы]\\s+контрол"
      - "(?i)prior\\s+written\\s+consent[\\s\\S]{0,40}(change|control)"

    low:
      - "(?i)change\\s+of\\s+control\\s+clause"
      - "(?i)change[-\\s]of[-\\s]control\\s+event"
      - "(?i)смена\\s+контроля\\s+в\\s+случае"
      - "(?i)переход\\s+контрольного\\s+пакета"
      - "(?i)смена\\s+бенефициарного\\s+владельца"
      - "(?i)indirect\\s+change\\s+of\\s+control"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 560

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 500

retrieval:
  retrieval_profile: "change_of_control_check"
  context_k: 6
  max_chunks: 10

  retrieval_query: >
    change of control смена контроля переход контроля
    смена бенефициарного владельца UBO ultimate beneficial owner
    indirect change of control косвенная смена контроля
    transfer of controlling interest переход контрольного пакета

  boost_keywords:
    - "change of control"
    - "change in control"
    - "смена контроля"
    - "переход контроля"
    - "смена бенефициарного владельца"
    - "ultimate beneficial owner"
    - "UBO"
    - "indirect change of control"
    - "косвенная смена контроля"
    - "transfer of controlling interest"
    - "переход контрольного пакета"
    - "acquisition of control"
    - "consent to change of control"
    - "согласие на смену контроля"
    - "termination upon change of control"

  negative_keywords:
    - "уступка прав"
    - "assignment of rights"
    - "перевод долга"
    - "transfer of obligations"
    - "означает"
    - "в целях настоящего"
    - "споры"
    - "подсудность"
    - "применимое право"

  preferred_unit_types:
    - "obligation"
    - "general_provision"
    - "termination_provision"

  excluded_unit_types:
    - "definition"
    - "structural_anchor"
    - "technical_fragment"
    - "appendix_reference"

  preferred_clause_functions:
    - "rights"
    - "limitations"
    - "obligations"
    - "boilerplate"

  position_bias:
    preferred_range: [0.55, 1.00]
    boost: 0.30
    scope: "segment"

  rerank: true
  filters: {}

conditional: null

enrichment_hints:
  preferred_segment_types:
    - "contract"
    - "amendment"
  excluded_segment_types:
    - "technical_specification"
    - "price_list"
    - "invoice"
    - "act"
    - "schedule"
  confidence_bonus_on_match: 0.10
  confidence_penalty_on_excluded_segment: 0.15

extraction:
  enabled: true
  mode: "hybrid"
  llm_max_tokens: 900

  # Presence gate: has_coc_clause УЖЕ выполняет роль presence-сигнала
  # (yes/no/unclear). Отдельное coc_presence_status не вводится —
  # это было бы дублирование. Контракт: yes + no + unclear =
  # has_coc_clause.allowed_values.
  presence_signal:
    field: "has_coc_clause"
    present_values: ["yes"]
    missing_values: ["no"]
    unclear_values: ["unclear"]

  llm_prompt_extraction: |
    <role>
    Ты — юрист по M&A и коммерческим договорам.
    Твоя задача — screening-анализ: определить наличие CoC-клаузы,
    тип её триггера и верхнеуровневый характер последствий.
    Это не детальный анализ — он выполняется отдельными checks.

    КРИТИЧЕСКИ ВАЖНО:
    - Извлекай ТОЛЬКО то, что прямо написано в тексте.
    - НЕ делай выводов "по умолчанию" из общих норм права.
    - НЕ додумывай условия, которых нет в тексте.
    - Если информация отсутствует — для has_coc_clause ставь "no",
      а для остальных полей — "not_applicable",
      а не предполагай наиболее вероятный вариант.
    - Если текст неоднозначен — ставь "unclear",
      а не выбирай один из вариантов.
    </role>

    <context_rules>
    - Ниже приведены фрагменты, отобранные автоматически.
    - Некоторые фрагменты могут быть нерелевантны данному
      check — игнорируй их.
    - Если среди фрагментов есть противоречия — укажи "unclear"
      и объясни в reason.
    - Если ни один фрагмент не содержит информации по теме —
      has_coc_clause = "no"; остальные поля — согласно Шагу 1.
    - Не используй информацию из определений (definitions),
      преамбулы или приложений, если они не содержат
      substantive условий по теме check.
    - Важно: общий запрет уступки прав (assignment / novation)
      без упоминания смены контроля / бенефициара —
      это НЕ CoC-клауза.
    </context_rules>

    <context>
    Ниже приведены релевантные фрагменты договора:

    {context}
    </context>

    <task>
    Заполни только следующие поля:
    - coc_display
    - has_coc_clause
    - coc_trigger_type
    - coc_trigger_coverage_gaps
    - coc_consequence_type
    - reason

    Важно:
    - не анализируй детально условия согласия (форму, сроки,
      deemed consent, reasonableness) — это задача coc_consent_terms;
    - не анализируй детально последствия (cure period, компенсацию,
      акселерацию, step-up) — это задача coc_consequences;
    - не путай общий запрет уступки прав с CoC-клаузой;
    - пиши user-facing значения коротко и по-русски.
    </task>

    <location_instructions>
    Для каждого поля по возможности укажи location в формате:
    {"clause_ref": "п. 12.1", "page": 7, "quote": "дословная фраза из договора"}

    Правила:
    - clause_ref — короткая ссылка на пункт / раздел / статью именно в том виде,
      как она написана в договоре;
    - page — целое число страницы;
    - quote — дословная фраза из текста договора (НЕ пересказ, НЕ парафраз),
      которая является источником значения поля. Копируй её посимвольно,
      сохраняя формулировку и порядок слов. Оптимальная длина: 30–300 символов.
      Примеры хорошего quote:
      * для has_coc_clause (yes): "При смене контроля над любой из Сторон другая Сторона вправе расторгнуть настоящий Договор";
      * для coc_trigger_type (direct_and_indirect): "Смена контроля означает как прямое отчуждение акций целевой компании, так и косвенную смену через материнские структуры";
      * для coc_trigger_type (includes_ubo): "Смена контроля включает смену конечного бенефициарного владельца (UBO) любой из Сторон";
      * для coc_trigger_coverage_gaps (no_ubo): "Настоящий пункт применяется к прямой и косвенной смене контроля, но не к смене бенефициарного владельца";
      * для coc_consequence_type (consent_required): "Смена контроля допускается только с предварительного письменного согласия другой Стороны".
    - не выдумывай location или quote;
    - если точную ссылку или дословную фразу определить нельзя,
      верни location = null;
    - для coc_display, has_coc_clause и reason location всегда null
      (синтезированы или являются фактом наличия);
    - для coc_trigger_type, coc_trigger_coverage_gaps и
      coc_consequence_type location с quote особенно важна;
    - если has_coc_clause = "no" — для всех полей location = null.
    </location_instructions>

    <instructions>
    Шаг 1 — НАЛИЧИЕ CoC-КЛАУЗЫ

    Заполни поле "has_coc_clause".

    Значения:
    - "yes" — договор содержит положения о смене контроля:
      прямая продажа акций / долей целевой стороны, косвенная смена
      через материнские структуры, смена UBO, иные формулировки,
      связывающие права / обязанности сторон с изменением структуры
      контроля.
    - "no" — CoC-клаузы нет.
      Важно: общий запрет уступки прав (assignment / novation)
      без упоминания смены контроля / бенефициара не является
      CoC-клаузой.
    - "unclear" — фрагменты не позволяют сделать надёжный вывод.

    Если has_coc_clause = "no":
    - coc_trigger_type = "not_applicable"
    - coc_trigger_coverage_gaps = "not_applicable"
    - coc_consequence_type = "not_applicable"
    - coc_display = "CoC-клауза отсутствует"
    - reason = "CoC-клауза не обнаружена в представленных фрагментах."
    - для всех полей location = null
    - не выполняй Шаги 2–4; переходи сразу к Шагу 5 (display).

    Если has_coc_clause = "unclear":
    - coc_trigger_type = "unclear"
    - coc_trigger_coverage_gaps = "unclear"
    - coc_consequence_type = "unclear"
    - coc_display = "Не удалось определить наличие CoC-клаузы"
    - reason = "Формулировки присутствуют, но вывод надёжно сделать нельзя."
    - для всех полей location = null

    Если has_coc_clause = "yes" — переходи к Шагам 2–4.

    Шаг 2 — ТИП ТРИГГЕРА

    Заполни поле "coc_trigger_type".

    Значения:
    - "direct_only" — только прямая смена контроля
      (продажа акций / долей непосредственно целевой стороны).
    - "direct_and_indirect" — прямая и косвенная смена
      (через материнские / холдинговые структуры).
    - "includes_ubo" — охватывает смену UBO
      (ultimate beneficial owner).
    - "broad" — широкое определение: охватывает прямую,
      косвенную смену и UBO одновременно.
    - "not_applicable" — has_coc_clause = "no".
    - "unclear" — тип триггера нельзя определить.

    Шаг 3 — ПРОБЕЛЫ В ПОКРЫТИИ ТРИГГЕРА

    Заполни поле "coc_trigger_coverage_gaps".

    Значения:
    - "none" — пробелов в покрытии триггера не выявлено.
    - "no_indirect" — косвенная смена не охвачена.
    - "no_ubo" — смена UBO не охвачена.
    - "no_indirect_and_no_ubo" — не охвачены ни косвенная смена,
      ни UBO.
    - "not_applicable" — has_coc_clause = "no".
    - "unclear" — невозможно оценить покрытие триггера.

    Шаг 4 — ВЕРХНЕУРОВНЕВЫЙ ХАРАКТЕР ПОСЛЕДСТВИЙ

    Заполни поле "coc_consequence_type".

    Это routing-поле верхнего уровня.
    Детальный анализ выполняется чеками coc_consent_terms
    и coc_consequences. Здесь только высокоуровневая классификация.

    Значения:
    - "notification" — только обязанность уведомить.
    - "consent_required" — требуется предварительное согласие.
    - "termination_right" — предусмотрено право на расторжение.
    - "renegotiation" — право требовать пересмотра условий.
    - "multiple" — несколько типов последствий одновременно.
    - "no_consequences" — CoC-клауза есть, но последствия
      не прописаны.
    - "not_applicable" — has_coc_clause = "no".
    - "unclear" — последствия нельзя определить.

    Шаг 5 — USER-FACING SUMMARY

    Заполни поле "coc_display".

    Это поле — краткий итог для таблицы.
    Сформируй его на основе уже заполненных полей:
    - has_coc_clause
    - coc_trigger_type
    - coc_trigger_coverage_gaps
    - coc_consequence_type
    Не добавляй информацию, которой нет в этих полях.

    Структура: {наличие}; {триггер}; {последствие / пробел}

    Примеры:
    - has_coc_clause = "no":
      "CoC-клауза отсутствует"
    - has_coc_clause = "unclear":
      "Не удалось определить наличие CoC-клаузы"
    - has_coc_clause = "yes":
      "CoC-клауза есть; прямая и косвенная смена;
      последствие — согласие"
      "CoC-клауза есть; только прямая смена; UBO не покрыт"
      "CoC-клауза есть; широкое покрытие;
      расторжение + согласие"
      "CoC-клауза есть; широкое покрытие;
      последствия не установлены"

    Шаг 6 — ОБОСНОВАНИЕ

    Заполни поле "reason".

    Формат:
    - Первое предложение: краткий вывод
      (есть ли CoC-клауза, тип триггера, пробелы, последствия).
    - Второе предложение: цитата из текста в кавычках
      (самый релевантный фрагмент, до 100 символов).

    Примеры:
    - "CoC-клауза есть, покрывает прямую и косвенную смену,
      последствие — согласие контрагента.
      «Upon a change of control, prior written consent is required»."
    - "CoC-клаузы не обнаружено в представленных фрагментах."
    </instructions>

    <edge_cases>
    - Только общий запрет уступки прав без упоминания CoC:
      * has_coc_clause = "no"
      * coc_trigger_type = "not_applicable"
      * coc_trigger_coverage_gaps = "not_applicable"
      * coc_consequence_type = "not_applicable"
      * coc_display = "CoC-клауза отсутствует"
      * в reason: "запрет уступки прав ≠ CoC-клауза"

    - Формулировки о смене участника без последствий:
      * has_coc_clause = "yes"
      * coc_consequence_type = "no_consequences"
      * coc_display =
        "CoC-клауза есть; последствия не установлены"

    - CoC только для прямой смены, косвенная не охвачена:
      * has_coc_clause = "yes"
      * coc_trigger_type = "direct_only"
      * coc_trigger_coverage_gaps = "no_indirect"
      * coc_display =
        "CoC-клауза есть; только прямая смена; косвенная не покрыта"

    - CoC-клауза не упоминает UBO:
      * has_coc_clause = "yes"
      * coc_trigger_coverage_gaps = "no_ubo"
      * coc_display =
        "CoC-клауза есть; [тип триггера]; UBO не покрыт"

    - Не охвачены ни косвенная смена, ни UBO:
      * has_coc_clause = "yes"
      * coc_trigger_type = "direct_only"
      * coc_trigger_coverage_gaps = "no_indirect_and_no_ubo"
      * coc_display =
        "CoC-клауза есть; только прямая смена;
        косвенная смена и UBO не покрыты"

    - Последствий несколько:
      * has_coc_clause = "yes"
      * coc_consequence_type = "multiple"

    - Широкое покрытие, нет пробелов:
      * has_coc_clause = "yes"
      * coc_trigger_type = "broad"
      * coc_trigger_coverage_gaps = "none"

    - Нет релевантных фрагментов:
      * has_coc_clause = "no"
      * coc_trigger_type = "not_applicable"
      * coc_trigger_coverage_gaps = "not_applicable"
      * coc_consequence_type = "not_applicable"
      * coc_display = "CoC-клауза отсутствует"
    </edge_cases>

    <output_expectations>
    - Верни результат строго в формате JSON.
    - Не оборачивай в markdown-блоки (без ```).
    - Не добавляй комментариев вне JSON.
    - Все значения полей с allowed_values — на английском
      (как указано в списке).
    - Свободные текстовые поля (coc_display, reason) —
      на русском языке.
    - Не добавляй никаких полей, кроме указанных.
    - Для каждого поля возвращай объект с ключами
      "value", "confidence", "location".

    Пример структуры ответа:
    {
      "coc_display": {"value": "CoC-клауза есть; прямая и косвенная смена; последствие — согласие", "confidence": 0.95, "location": null},
      "has_coc_clause": {"value": "yes", "confidence": 0.95, "location": null},
      "coc_trigger_type": {"value": "direct_and_indirect", "confidence": 0.90, "location": {"clause_ref": "п. 12.1", "page": 7, "quote": "Смена контроля означает как прямое отчуждение акций целевой компании, так и косвенную смену через материнские структуры"}},
      "coc_trigger_coverage_gaps": {"value": "no_ubo", "confidence": 0.85, "location": {"clause_ref": "п. 12.1", "page": 7, "quote": "Настоящий пункт применяется к прямой и косвенной смене контроля, но не к смене бенефициарного владельца"}},
