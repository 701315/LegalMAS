id: "coc_consent_terms"
name: "Условия согласия при CoC / уступке"
description: >
  Анализирует механику получения согласия контрагента при смене
  контроля (CoC) и/или уступке прав / переводе долга. Определяет,
  к какому именно триггеру относится требование согласия (CoC,
  уступка или оба), кто его даёт, в какой форме, установлен ли срок
  ответа, предусмотрен ли deemed consent (молчание = согласие),
  ограничен ли отказ стандартом reasonableness или возможен
  по sole discretion, есть ли carve-out для аффилированных лиц /
  правопреемника / банка-залогодержателя, и каковы последствия отказа.

  Формирует краткий user-facing вывод с явным указанием scope
  (для CoC / для уступки / для обоих) и оценивает риск блокировки
  сделки контрагентом.

  Если договор регулирует режим уступки прав / перевода долга
  отдельно, базовый режим (prohibited / consent_required / free)
  анализируется чеком coc_assignment_presence.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"
ui_mode: "field_extraction"

rules:
  keyword_mode: any

  keywords:
    high:
      # Согласие — точные формулировки
      - "(?i)prior\\s+written\\s+consent"
      - "(?i)предварительн[а-я]+\\s+письменн[а-я]+\\s+согласи[ея]"
      - "(?i)consent\\s+of\\s+the\\s+other\\s+party"
      - "(?i)согласи[ея]\\s+(другой\\s+стороны|контрагента)"
      - "(?i)without\\s+(the\\s+)?(prior\\s+)?(written\\s+)?consent"
      - "(?i)без\\s+(получения\\s+)?(предварительного\\s+)?(письменного\\s+)?согласи[яи]"
      - "(?i)approval\\s+of\\s+the\\s+other\\s+party"
      - "(?i)одобрени[ея]\\s+(другой\\s+стороны|контрагента)"

      # Reasonableness / sole discretion
      - "(?i)not\\s+(to\\s+be\\s+)?unreasonably\\s+(withheld|delayed|conditioned)"
      - "(?i)consent\\s+shall\\s+not\\s+be\\s+unreasonably"
      - "(?i)не\\s+может\\s+быть\\s+необоснованно\\s+(удержан|отказан|задержан)"
      - "(?i)согласи[ея]\\s+не\\s+должно\\s+(необоснованно|без\\s+оснований)"
      - "(?i)sole\\s+(and\\s+absolute\\s+)?discretion"
      - "(?i)absolute\\s+discretion"
      - "(?i)по\\s+(своему\\s+)?(исключительному\\s+)?усмотрению"
      - "(?i)without\\s+giving\\s+(any\\s+)?reason"

      # Deemed consent
      - "(?i)deemed\\s+(to\\s+be\\s+)?(given|granted|obtained)"
      - "(?i)shall\\s+be\\s+deemed\\s+(to\\s+have\\s+)?consent"
      - "(?i)failure\\s+to\\s+respond[\\s\\S]{0,40}deemed"
      - "(?i)считается\\s+(данным|полученным|предоставленным)"
      - "(?i)молчани[ея][\\s\\S]{0,40}(означает|считается|равносильн)"

      # Change of control — consent context
      - "(?i)consent\\s+to\\s+(a\\s+)?change\\s+(of|in)\\s+control"
      - "(?i)согласи[ея]\\s+на\\s+(смену|переход)\\s+контрол"
      - "(?i)prior\\s+written\\s+consent[\\s\\S]{0,40}(change|control)"
      - "(?i)change\\s+of\\s+control[\\s\\S]{0,40}consent"
      - "(?i)change\\s+in\\s+control[\\s\\S]{0,40}consent"
      - "(?i)смен[аеы]\\s+контрол[яе][\\s\\S]{0,40}согласи"

      # Assignment / transfer — consent context
      - "(?i)consent\\s+to\\s+(assignment|transfer)"
      - "(?i)согласи[ея]\\s+на\\s+(уступк|перевод|передач)"
      - "(?i)without\\s+(the\\s+)?(prior\\s+)?(written\\s+)?consent[\\s\\S]{0,40}(assign|transfer)"
      - "(?i)без\\s+(предварительного\\s+)?(письменного\\s+)?согласи[яи][\\s\\S]{0,40}(уступ|перевод)"

    medium:
      # Carve-out
      - "(?i)except\\s+(for\\s+)?(transfer|assignment)[\\s\\S]{0,40}(affiliate|group|successor)"
      - "(?i)за\\s+исключением\\s+(передач|уступк)[\\s\\S]{0,40}(аффилированн|групп|правопреем)"
      - "(?i)intra[-\\s]?group\\s+transfer"
      - "(?i)permitted\\s+(transfer|assignment)"
      - "(?i)внутригрупповая\\s+передач"
      - "(?i)разрешённ[а-я]+\\s+(передач|уступк)"
      - "(?i)affiliate"
      - "(?i)аффилированн"
      - "(?i)successor"
      - "(?i)правопреемник"
      - "(?i)reorganization"
      - "(?i)реструктуризаци"
      - "(?i)merger"
      - "(?i)слияни[ея]"
      - "(?i)security\\s+assignment"
      - "(?i)залог\\s+(прав|требовани)"

      # Сроки рассмотрения
      - "(?i)within\\s+\\d+\\s+(business\\s+|working\\s+)?days?"
      - "(?i)response\\s+(period|time)"
      - "(?i)в\\s+течение\\s+\\d+\\s+(рабочих\\s+)?(дней|календарных)"
      - "(?i)срок\\s+рассмотрени[яи]"
      - "(?i)срок\\s+для\\s+ответа"

      # Последствия отказа
      - "(?i)if\\s+consent\\s+is\\s+not\\s+(given|obtained|granted)"
      - "(?i)refusal\\s+(of|to\\s+give)\\s+consent"
      - "(?i)если\\s+согласи[ея]\\s+не\\s+(получено|дано|предоставлено)"
      - "(?i)отказ\\s+в\\s+(даче\\s+)?согласи[яи]"
      - "(?i)termination\\s+right"
      - "(?i)право\\s+на\\s+расторжение"

    low:
      - "(?i)not\\s+unreasonably\\s+withheld"
      - "(?i)deemed\\s+consent"
      - "(?i)change\\s+of\\s+control"
      - "(?i)смена\\s+контроля"
      - "(?i)внутригрупповая\\s+передача"
      - "(?i)предварительное\\s+письменное\\s+согласие"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 700

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 500

retrieval:
  context_k: 5
  max_chunks: 10
  boost_keywords:
    - "prior written consent"
    - "предварительное письменное согласие"
    - "consent of the other party"
    - "согласие контрагента"
    - "without prior written consent"
    - "без получения согласия"
    - "not unreasonably withheld"
    - "не может быть необоснованно удержано"
    - "deemed consent"
    - "считается данным"
    - "sole discretion"
    - "по своему усмотрению"
    - "response period"
    - "срок рассмотрения"
    - "срок для ответа"
    - "refusal of consent"
    - "отказ в согласии"
    - "consent to change of control"
    - "согласие на смену контроля"
    - "consent to assignment"
    - "согласие на уступку"
    - "intra-group transfer"
    - "внутригрупповая передача"
    - "permitted transfer"
    - "разрешённая передача"
    - "successor"
    - "правопреемник"
    - "security assignment"
    - "залог прав"
  rerank: true
  filters: {}

conditional: null

enrichment_hints:
  preferred_segment_types:
    - "contract"
    - "amendment"
    - "annex"
  excluded_segment_types:
    - "technical_specification"
    - "price_list"
    - "invoice"
    - "act"
    - "schedule"
  preferred_clause_functions:
    - "assignment"
    - "change_of_control"
  confidence_bonus_on_match: 0.10
  confidence_penalty_on_excluded_segment: 0.15

extraction:
  enabled: true
  mode: "hybrid"
  llm_max_tokens: 560
  llm_prompt_extraction: |
    <role>
    Ты — юрист по M&A и коммерческим договорам.
    Твоя задача — точно извлечь условия получения согласия
    контрагента при смене контроля (CoC) и/или уступке прав /
    переводе долга: к чему именно относится требование согласия,
    кто его даёт, в какой форме, каковы сроки, есть ли deemed
    consent, ограничен ли отказ, есть ли carve-out.
    </role>

    <context>
    Ниже приведены релевантные фрагменты договора:

    {context}
    </context>

    <task>
    Заполни только следующие поля:
    - consent_terms_display
    - consent_trigger_scope
    - consent_required
    - consent_grantor
    - consent_form
    - response_period
    - deemed_consent
    - reasonableness_standard
    - carveout_type
    - refusal_consequences
    - red_flags
    - overall_risk_level
    - reason

    Важно:
    - не анализируй тему шире текста;
    - не придумывай условия, которых нет в фрагментах;
    - пиши user-facing значения коротко и по-русски;
    - display-поле должно быть пригодно для DD Grid.
    </task>

    <instructions>
    Шаг 1 — ОПРЕДЕЛИ SCOPE ТРЕБОВАНИЯ СОГЛАСИЯ

    Заполни поле "consent_trigger_scope".

    Определи, к чему именно относится требование согласия
    в найденных фрагментах:
    - "coc_only" — согласие требуется только при смене контроля (CoC).
    - "assignment_only" — согласие требуется только при уступке прав /
      переводе долга, но не при CoC.
    - "both" — одна и та же механика согласия применяется
      и при CoC, и при уступке / переводе долга.
    - "unclear" — невозможно разграничить.

    Важно: не объединяй разные механики в одно поле.
    Если для CoC и для assignment условия разные —
    зафиксируй это в reason и отрази в consent_terms_display.

    Шаг 2 — ТРЕБУЕТСЯ ЛИ СОГЛАСИЕ

    Заполни поле "consent_required".

    Значения:
    - "yes_always" — согласие требуется, исключений не видно.
    - "yes_with_carveout" — согласие требуется, но есть carve-out.
    - "no" — согласие прямо не требуется.
    - "not_specified" — условия согласия в тексте не установлены.
    - "unclear" — фрагменты не позволяют сделать надёжный вывод.

    Шаг 3 — КТО ДАЁТ СОГЛАСИЕ

    Заполни поле "consent_grantor".

    Значения:
    - "counterparty" — согласие даёт только контрагент.
    - "counterparty_and_internal" — нужен контрагент + внутреннее
      одобрение (совет директоров, орган управления и т.п.).
    - "counterparty_and_third_party" — нужен контрагент + третье лицо
      (банк, регулятор, залогодержатель и т.п.).
    - "multiple" — требуется более одного дополнительного
      согласующего субъекта.
    - "not_specified" — кто именно даёт согласие, не определено.
    - "not_applicable" — согласие не требуется.
    - "unclear" — невозможно определить.

    Шаг 4 — ФОРМА СОГЛАСИЯ

    Заполни поле "consent_form".

    Значения:
    - "prior_written" — предварительное письменное согласие.
    - "written" — письменное согласие без требования предварительности.
    - "any_form" — форма не ограничена.
    - "not_specified" — форма не установлена.
    - "not_applicable" — согласие не требуется.
    - "unclear" — нельзя определить.

    Шаг 5 — СРОК ОТВЕТА

    Заполни поле "response_period".

    Правила:
    - Если срок установлен: "10 рабочих дней", "30 календарных дней".
    - Если срок не установлен: "Не установлен".
    - Если согласие не требуется: "Не применимо".
    - Если вывод невозможен: "Не удалось определить".

    Шаг 6 — DEEMED CONSENT

    Заполни поле "deemed_consent".

    Значения:
    - "yes" — молчание / отсутствие ответа в срок считается согласием.
    - "no" — прямо указано, что deemed consent нет,
      либо требуется явное согласие.
    - "not_specified" — тема не урегулирована.
    - "not_applicable" — согласие не требуется.
    - "unclear" — нельзя определить.

    Шаг 7 — СТАНДАРТ ОТКАЗА

    Заполни поле "reasonableness_standard".

    Значения:
    - "not_unreasonably_withheld" — отказ / задержка / условия
      не могут быть необоснованными.
    - "sole_discretion" — отказ по исключительному усмотрению.
    - "with_criteria" — есть объективные критерии для отказа.
    - "not_specified" — стандарт не установлен.
    - "not_applicable" — согласие не требуется.
    - "unclear" — нельзя определить.

    Шаг 8 — CARVE-OUT

    Заполни поле "carveout_type".

    Значения:
    - "none" — carve-out нет.
    - "affiliate_group" — carve-out для аффилированных лиц /
      группы / внутригрупповой передачи.
    - "successor_mna" — carve-out для правопреемника, merger,
      reorganization, sale of business / M&A.
    - "security_financing" — carve-out для банка, залогодержателя,
      обеспечения (security assignment, залог прав).
    - "multiple" — есть два и более типа carve-out.
    - "not_specified" — carve-out не урегулирован.
    - "not_applicable" — согласие не требуется.
    - "unclear" — нельзя определить.

    Шаг 9 — ПОСЛЕДСТВИЯ ОТКАЗА

    Заполни поле "refusal_consequences".

    Значения:
    - "transaction_blocked" — сделка / уступка / CoC невозможны
      без согласия.
    - "termination_right" — отказ даёт право на расторжение /
      досрочное прекращение.
    - "renegotiation" — стороны должны пересмотреть условия.
    - "no_specific_consequences" — последствия отказа отдельно
      не описаны.
    - "not_specified" — условия согласия в целом не установлены.
    - "not_applicable" — согласие не требуется.
    - "unclear" — нельзя определить.

    Шаг 10 — RED FLAGS

    Заполни поле "red_flags".

    Используй:
    - "NONE" — если существенных риск-факторов нет;
    - "UNCLEAR" — если данных недостаточно;
    - коды через запятую:
      * CNS1 — согласие требуется, а отказ возможен по sole discretion
        или без разумных ограничений;
      * CNS2 — нет срока ответа и нет deemed consent —
        согласие может блокироваться бездействием;
      * CNS3 — требуется несколько согласований / approval layers
        (контрагент + регулятор / банк / совет директоров);
      * CNS4 — отказ влечёт termination / acceleration
        или иной жёсткий consequence;
      * CNS5 — согласие требуется в жёстком режиме,
        но carve-out для группы / правопреемства отсутствует.

    Шаг 11 — ОБЩИЙ УРОВЕНЬ РИСКА БЛОКИРОВКИ СДЕЛКИ

    Заполни поле "overall_risk_level".

    Значения:
    - "low" — согласие не требуется, либо есть workable режим:
      фиксированный срок ответа + deemed consent
      или reasonableness standard.
    - "medium" — согласие требуется, условия относительно управляемы:
      есть срок ответа, но нет deemed consent;
      или есть reasonableness, но нет carve-out.
    - "high" — consent может реально блокировать сделку:
      sole discretion, нет срока ответа, нет deemed consent,
      termination right при отказе, множественные approvals.
    - "unclear" — недостаточно данных.

    Шаг 12 — USER-FACING SUMMARY

    Заполни поле "consent_terms_display".

    Правила построения:
    - Всегда начинай с явного scope:
      * consent_trigger_scope = "coc_only" → "Для CoC ..."
      * consent_trigger_scope = "assignment_only" → "Для уступки ..."
      * consent_trigger_scope = "both" → "Для CoC и уступки ..."
      * consent_trigger_scope = "unclear" → без scope prefix
    - Строй display как цепочку через точку с запятой:
      {scope} + {основное условие} + {ключевая деталь если есть}

    Примеры:
    - "Для CoC требуется согласие; только предварительное письменное;
       срок ответа не установлен"
    - "Для CoC требуется согласие; 15 рабочих дней;
       молчание считается согласием"
    - "Для CoC требуется согласие; отказ не ограничен
       стандартом разумности"
    - "Для CoC и уступки требуется согласие; есть carve-out
       для аффилированных лиц"
    - "Для уступки требуется согласие; 30 дней; deemed consent нет"
    - "Для CoC согласие не требуется"
    - "Условия согласия не установлены"
    - "Не удалось определить условия согласия"

    Если для CoC и для уступки условия разные —
    опиши оба через " / " или двумя частями через ";".

    Шаг 13 — ОБОСНОВАНИЕ

    Заполни поле "reason".

    Правила:
    - 1–2 коротких предложения.
    - Укажи: к чему относится consent (scope), требуется ли,
      форма, срок ответа, deemed consent, стандарт отказа,
      carve-out, почему выставлены red_flags / risk level.
    - Приведи короткую цитату в кавычках.
    - Не добавляй ничего вне текста договора.
    </instructions>

    <edge_cases>
    - Согласие требуется при CoC, но не при уступке:
      * consent_trigger_scope = "coc_only"
      * consent_terms_display = "Для CoC требуется согласие; ..."

    - Согласие требуется при уступке, но не при CoC:
      * consent_trigger_scope = "assignment_only"
      * consent_terms_display = "Для уступки требуется согласие; ..."

    - Одна механика для CoC и уступки:
      * consent_trigger_scope = "both"
      * consent_terms_display = "Для CoC и уступки требуется согласие; ..."

    - Есть фиксированный срок ответа и deemed consent:
      * overall_risk_level = "low" или "medium"
      * CNS2 не выставляется

    - Согласие по sole discretion, без срока, без deemed consent:
      * reasonableness_standard = "sole_discretion"
      * overall_risk_level = "high"
      * red_flags = "CNS1, CNS2"

    - Только "с предварительного письменного согласия" без деталей:
      * consent_form = "prior_written"
      * response_period = "Не установлен"
      * deemed_consent = "not_specified"
      * reasonableness_standard = "not_specified"
      * red_flags = "CNS2, CNS3" или "CNS2" по контексту

    - Кроме контрагента нужно одобрение совета директоров / регулятора:
      * consent_grantor = "counterparty_and_internal"
        или "counterparty_and_third_party" / "multiple"
      * red_flags включает "CNS3"

    - Есть carve-out для внутригрупповой передачи:
      * consent_required = "yes_with_carveout"
      * carveout_type = "affiliate_group"

    - Есть carve-out для банка / залогодержателя:
      * carveout_type = "security_financing"

    - Есть два типа carve-out (группа + правопреемник):
      * carveout_type = "multiple"

    - Отказ даёт право на расторжение:
      * refusal_consequences = "termination_right"
      * red_flags включает "CNS4"
      * overall_risk_level = "high"

    - Согласие не требуется вообще:
      * consent_required = "no"
      * consent_grantor = "not_applicable"
      * consent_form = "not_applicable"
      * response_period = "Не применимо"
      * deemed_consent = "not_applicable"
      * carveout_type = "not_applicable"
      * refusal_consequences = "not_applicable"
      * red_flags = "NONE"
      * overall_risk_level = "low"
      * consent_terms_display = "Для CoC согласие не требуется"
        (или "Для уступки согласие не требуется" по scope)

    - Нет релевантных фрагментов:
      * consent_required = "not_specified"
      * consent_trigger_scope = "unclear"
      * overall_risk_level = "unclear"
      * red_flags = "UNCLEAR"
      * consent_terms_display = "Условия согласия не установлены"

    - Фрагменты есть, но вывод сделать нельзя:
      * consent_required = "unclear"
      * consent_trigger_scope = "unclear"
      * overall_risk_level = "unclear"
      * red_flags = "UNCLEAR"
      * consent_terms_display = "Не удалось определить условия согласия"
    </edge_cases>

    <output_expectations>
    Все значения должны быть короткими, точными и пригодными
    для отображения пользователю в DD Grid.
    Не добавляй никаких полей, кроме указанных в схеме extraction.
    </output_expectations>

  fields:
    - name: "consent_terms_display"
      type: "string"
      description: "Условия согласия (с указанием scope)"

    - name: "consent_trigger_scope"
      type: "string"
      description: "К чему относится требование согласия"
      allowed_values:
        - "coc_only"
        - "assignment_only"
        - "both"
        - "unclear"

    - name: "consent_required"
      type: "string"
      description: "Требование согласия"
      allowed_values:
        - "yes_always"
        - "yes_with_carveout"
        - "no"
        - "not_specified"
        - "unclear"

    - name: "consent_grantor"
      type: "string"
      description: "Кто даёт согласие"
      allowed_values:
        - "counterparty"
        - "counterparty_and_internal"
        - "counterparty_and_third_party"
        - "multiple"
        - "not_specified"
        - "not_applicable"
        - "unclear"

    - name: "consent_form"
      type: "string"
      description: "Форма согласия"
      allowed_values:
        - "prior_written"
        - "written"
        - "any_form"
        - "not_specified"
        - "not_applicable"
        - "unclear"

    - name: "response_period"
      type: "string"
      description: "Срок ответа"

    - name: "deemed_consent"
      type: "string"
      description: "Молчание = согласие"
      allowed_values:
        - "yes"
        - "no"
        - "not_specified"
        - "not_applicable"
        - "unclear"

    - name: "reasonableness_standard"
      type: "string"
      description: "Стандарт отказа"
      allowed_values:
        - "not_unreasonably_withheld"
        - "sole_discretion"
        - "with_criteria"
        - "not_specified"
        - "not_applicable"
        - "unclear"

    - name: "carveout_type"
      type: "string"
      description: "Тип carve-out от требования согласия"
      allowed_values:
        - "none"
        - "affiliate_group"
        - "successor_mna"
        - "security_financing"
        - "multiple"
        - "not_specified"
        - "not_applicable"
        - "unclear"

    - name: "refusal_consequences"
      type: "string"
      description: "Последствия отказа в согласии"
      allowed_values:
        - "transaction_blocked"
        - "termination_right"
        - "renegotiation"
        - "no_specific_consequences"
        - "not_specified"
        - "not_applicable"
        - "unclear"

    - name: "red_flags"
      type: "string"
      description: "Коды рисков блокировки сделки"

    - name: "overall_risk_level"
      type: "string"
      description: "Риск блокировки сделки контрагентом"
      allowed_values:
        - "low"
        - "medium"
        - "high"
        - "unclear"

    - name: "reason"
      type: "string"
      description: "Обоснование"

  store_payload: true
