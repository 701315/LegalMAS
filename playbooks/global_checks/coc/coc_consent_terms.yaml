id: "coc_consent_terms"
name: "Условия согласия при CoC / уступке"
description: >
  Анализирует, как именно оформлено требование согласия контрагента
  при смене контроля, уступке прав или переводе долга.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"

rules:
  keywords:
    - "письменное согласие"
    - "предварительное согласие"
    - "prior written consent"
    - "consent of the other party"
    - "согласие контрагента"
    - "approval of the other party"
    - "без получения согласия"
  keyword_mode: "any"
  regex_patterns: []
  clause_patterns: []

llm:
  prompt_template: |
    <role>
    Ты — юрист по M&A и коммерческим договорам.
    Твоя специализация — анализ условий получения согласия контрагента
    при смене контроля, уступке прав и переводе долга.
    </role>

    <context>
    Ниже приведены фрагменты с положениями о смене контроля, уступке прав
    или переводе долга:

    {context}
    </context>

    <instructions>
    Определи:

    1) Требуется ли согласие контрагента при смене контроля/уступке/переводе долга:
       - прямое требование "prior written consent", "предварительное письменное согласие";
       - отсутствие требования согласия (например, допущение уступки без согласия);
       - случаи, когда по фрагментам это непонятно.

    2) Кто должен дать согласие (consent_grantor):
       - другая сторона по договору (контрагент),
       - орган группы (board, shareholder),
       - третье лицо (кредитор, банк, государственный орган),
       - если явно не указано — опиши максимально конкретно по тексту ("unclear",
         если действительно непонятно).

    3) В какой форме и сроках даётся согласие (consent_form_and_timing):
       - письменная форма, предварительное согласие до совершения сделки,
       - срок рассмотрения запроса (N дней) и презумпция согласия/несогласия,
       - если форма/срок не урегулированы — явно указать, что это не определено.

    4) Есть ли презумпция согласия при отсутствии ответа (deemed consent):
       - yes — если прямо прописано, что при отсутствии ответа в течение N дней
         согласие считается данным;
       - no — если такой презумпции нет или прямо указано обратное;
       - unclear — если по фрагментам нельзя сделать вывод.

    5) Оцени общий уровень риска (overall_risk_level: low / medium / high) с точки зрения
       покупателя бизнеса/стороны, зависящей от сделки:
       - высокий риск, если согласие требуется всегда, нет сроков и механизма deemed consent,
         и контрагент может фактически блокировать сделку;
       - более низкий риск при наличии разумных carve-out, сроков и deemed consent.
    </instructions>

    <edge_cases>
    ВАЖНО — пограничные случаи:

    — Если согласие формально требуется, но:
      * есть фиксированный срок рассмотрения запроса и
      * прямо указано, что при отсутствии ответа считается, что согласие получено,
      то deemed_consent = "yes" и это снижает риск (учти в overall_risk_level).

    — Если согласие требуется "по усмотрению" контрагента, без критериев и сроков:
      consent_required = "yes",
      deemed_consent = "no",
      overall_risk_level, как правило, не ниже "medium" (обоснуй в reason).

    — Если текст говорит только "с предварительного письменного согласия",
      но ничего не говорит о сроках и последствиях молчания:
      deemed_consent = "no",
      consent_form_and_timing опиши как "предварительное письменное согласие без указания сроков".

    — Если упоминается необходимость одобрения органом группы (совет директоров,
      общее собрание), но при этом для самой сделки с третьим лицом также нужно
      согласие контрагента:
      укажи в consent_grantor и внутренние органы, и внешнего контрагента,
      а риск оцени с учётом этого двойного фильтра.

    — Пустые или нерелевантные фрагменты:
      consent_required = "unclear",
      consent_grantor = "",
      consent_form_and_timing = "",
      deemed_consent = "unclear",
      overall_risk_level = "medium",
      reason = "Недостаточно данных для анализа условий согласия при CoC/уступке."
    </edge_cases>

    <examples>
    ПРИМЕР 1 — ЖЁСТКОЕ СОГЛАСИЕ, БЕЗ DEEMED CONSENT (HIGH):

    Фрагмент: "Ни одна из Сторон не вправе уступать права или переводить долг
    по настоящему Договору без предварительного письменного согласия другой
    Стороны. Согласие может быть дано или отклонено по усмотрению такой Стороны."

    {{
      "consent_required": "yes",
      "consent_grantor": "другая Сторона по Договору (контрагент)",
      "consent_form_and_timing": "предварительное письменное согласие, срок и порядок рассмотрения не определены",
      "deemed_consent": "no",
      "overall_risk_level": "high",
      "reason": "Согласие контрагента требуется всегда, может быть произвольно удержано, отсутствуют сроки и механизм deemed consent, что даёт контрагенту фактическое право вето на сделку."
    }}

    ПРИМЕР 2 — РАЗУМНЫЕ УСЛОВИЯ С DEEMED CONSENT (LOW/MEDIUM):

    Фрагмент: "Сторона вправе уступать права или переводить долг при условии
    получения предварительного письменного согласия другой Стороны. Другая
    Сторона обязана уведомить о своём решении в течение 20 (двадцати) рабочих
    дней; при отсутствии ответа в указанный срок согласие считается данным."

    {{
      "consent_required": "yes",
      "consent_grantor": "другая Сторона по Договору",
      "consent_form_and_timing": "предварительное письменное согласие, 20 рабочих дней на ответ, молчание считается согласием",
      "deemed_consent": "yes",
      "overall_risk_level": "medium",
      "reason": "Есть требование согласия, но установлен разумный срок ответа и механизм deemed consent, что ограничивает возможность блокировать сделку через молчание."
    }}

    ПРИМЕР 3 — СОГЛАСИЕ НЕ ТРЕБУЕТСЯ (LOW):

    Фрагмент: "Сторона вправе уступать права и переводить долг по настоящему
    Договору своим аффилированным лицам и любому приобретателю всех или
    существенной части её бизнеса без получения согласия другой Стороны при
    условии уведомления последней."

    {{
      "consent_required": "no",
      "consent_grantor": "",
      "consent_form_and_timing": "согласие не требуется, предусмотрено только уведомление",
      "deemed_consent": "no",
      "overall_risk_level": "low",
      "reason": "Для внутригрупповых и M&A-сделок согласие контрагента не требуется, достаточно уведомления, что существенно снижает риск блокировки сделки."
    }}
    </examples>

    <output_format>
    Твой ответ ДОЛЖЕН быть строго валидным JSON-объектом со следующими
    полями:

    {{
      "consent_required": "one of: yes | no | unclear",
      "consent_grantor": "string — кто именно даёт согласие (контрагент, орган группы, третье лицо и т.п.)",
      "consent_form_and_timing": "string — описание формы и сроков согласия",
      "deemed_consent": "one of: yes | no | unclear",
      "overall_risk_level": "one of: low | medium | high",
      "reason": "string — краткое объяснение на русском с указанием ключевых формулировок и их влияния на риск"
    }}

    Все перечисленные поля ДОЛЖНЫ присутствовать в JSON, даже если их значение равно null.
    </output_format>

    <constraints>
    ЖЁСТКИЕ ПРАВИЛА:
    1. Выведи ТОЛЬКО один JSON-объект. Никакого текста до или после.
    2. Не пиши "Вот JSON", "Here is the JSON" и т.п.
    3. Не используй Markdown, бэктики ``` или любые обёртки.
    4. Все строки — в двойных кавычках.
    5. Значения перечислимых полей — СТРОГО из указанных вариантов.
    6. Ключи — точно как указано, без добавления новых.
    7. Поле "reason" ДОЛЖНО содержать конкретные факты и формулировки
       из фрагментов, а не общие фразы вроде "есть риски".
    8. Начни ответ сразу с символа {{
    9. Если по какому‑то полю нет достаточно информации в тексте —
       верни для него 'unclear' или null (для reason пустое значение
       недопустимо — нужно объяснение). НЕ придумывай значения, не интерполируй.
    </constraints>
  prompt_file: null
  context_k: 4
  temperature: 0.0
  max_tokens: 512

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 500

retrieval:
  context_k: 4
  max_chunks: 8
  boost_keywords:
    - "consent"
    - "согласие"
    - "prior written consent"
  rerank: true
  filters: {}

conditional: null

extraction:
  enabled: true
  mode: "hybrid"
  fields:
    - name: "consent_required"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
    - name: "consent_grantor"
      type: "string"
    - name: "consent_form_and_timing"
      type: "string"
    - name: "deemed_consent"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
    - name: "overall_risk_level"
      type: "string"
      allowed_values:
        - "low"
        - "medium"
        - "high"
    - name: "reason"
      type: "string"
  store_payload: true

red_flags:
  items:
    - code: "CNS1"
      description: "Согласие требуется всегда, без разумных carve-out, и может быть произвольно удержано."
    - code: "CNS2"
      description: "Нет механизма deemed consent при молчании контрагента, при этом согласие критично для сделки."