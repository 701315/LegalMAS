id: "coc_consent_terms"
name: "Условия согласия при смене контроля"
group: "COC"
description: >
  Анализирует механику получения согласия контрагента при смене
  контроля (Change of Control): требуется ли согласие, в какой форме,
  установлен ли срок ответа, предусмотрен ли deemed consent
  (молчание = согласие), ограничен ли отказ стандартом разумности
  или возможен по sole discretion.

  Check не анализирует:
  - наличие / отсутствие CoC clause и тип режима — это задача
    coc_change_of_control_regime;
  - уступку прав и перевод долга — это задача
    assignment_transfer_consent;
  - substantive consequences отказа (расторжение, акселерация);
  - carve-out и исключения из consent;
  - кто именно даёт согласие (counterparty / internal / third party).

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"
ui_mode: "field_extraction"

rules:
  keyword_mode: any

  keywords:
    high:
      - "(?i)consent\\s+to\\s+(a\\s+)?change\\s+(of|in)\\s+control"
      - "(?i)prior\\s+written\\s+consent[\\s\\S]{0,40}(change|control)"
      - "(?i)change\\s+of\\s+control[\\s\\S]{0,40}consent"
      - "(?i)согласи[ея]\\s+на\\s+(смену|переход)\\s+контрол"
      - "(?i)смен[аеы]\\s+контрол[яе][\\s\\S]{0,40}согласи"
      - "(?i)not\\s+(to\\s+be\\s+)?unreasonably\\s+(withheld|delayed|conditioned)"
      - "(?i)sole\\s+(and\\s+absolute\\s+)?discretion"
      - "(?i)deemed\\s+(to\\s+be\\s+)?(given|granted|obtained)"
      - "(?i)failure\\s+to\\s+respond[\\s\\S]{0,40}deemed"
      - "(?i)считается\\s+(данным|полученным|предоставленным)"
      - "(?i)молчани[ея][\\s\\S]{0,40}(означает|считается)"

    medium:
      - "(?i)prior\\s+written\\s+consent"
      - "(?i)предварительн[а-я]+\\s+письменн[а-я]+\\s+согласи[ея]"
      - "(?i)without\\s+(the\\s+)?(prior\\s+)?(written\\s+)?consent"
      - "(?i)без\\s+(получения\\s+)?(предварительного\\s+)?(письменного\\s+)?согласи[яи]"
      - "(?i)within\\s+\\d+\\s+(business\\s+|working\\s+)?days?"
      - "(?i)в\\s+течение\\s+\\d+\\s+(рабочих\\s+)?(дней|календарных)"
      - "(?i)срок\\s+рассмотрени[яи]"
      - "(?i)срок\\s+для\\s+ответа"
      - "(?i)response\\s+(period|time)"
      - "(?i)не\\s+может\\s+быть\\s+необоснованно"
      - "(?i)по\\s+(своему\\s+)?(исключительному\\s+)?усмотрению"

    low:
      - "(?i)change\\s+of\\s+control"
      - "(?i)смена\\s+контроля"
      - "(?i)deemed\\s+consent"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 420

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 500

retrieval:
  retrieval_profile: "consent_check"
  context_k: 6
  max_chunks: 12

  retrieval_query: >
    смена контроля change of control согласие consent
    предварительное письменное согласие prior written consent
    deemed consent молчание считается согласием
    sole discretion unreasonably withheld срок ответа

  boost_keywords:
    - "consent to change of control"
    - "согласие на смену контроля"
    - "prior written consent"
    - "предварительное письменное согласие"
    - "deemed consent"
    - "считается данным"
    - "not unreasonably withheld"
    - "не может быть необоснованно"
    - "sole discretion"
    - "по своему усмотрению"
    - "срок рассмотрения"
    - "response period"

  negative_keywords:
    - "уступка прав"
    - "assignment of rights"
    - "перевод долга"
    - "transfer of obligations"
    - "означает"
    - "в целях настоящего"
    - "споры"
    - "подсудность"
    - "применимое право"

  preferred_unit_types:
    - "obligation"
    - "general_provision"

  excluded_unit_types:
    - "definition"
    - "structural_anchor"
    - "technical_fragment"
    - "appendix_reference"

  preferred_clause_functions:
    - "limitations"
    - "procedures"
    - "rights"
    - "boilerplate"

  position_bias:
    preferred_range: [0.55, 1.00]
    boost: 0.30
    scope: "segment"

  rerank: true
  filters: {}

conditional: null

enrichment_hints:
  preferred_segment_types:
    - "contract"
    - "amendment"
  excluded_segment_types:
    - "technical_specification"
    - "price_list"
    - "invoice"
    - "act"
  confidence_bonus_on_match: 0.10
  confidence_penalty_on_excluded_segment: 0.15

extraction:
  enabled: true
  mode: "hybrid"
  llm_max_tokens: 1100

  # Presence gate: coc_consent_status отделяет факт наличия положений
  # о согласии при CoC от их содержания (coc_consent_required,
  # coc_consent_form, coc_response_period, coc_deemed_consent,
  # coc_reasonableness_standard). missing -> missing_required_clause.
  # Контракт: present + missing + unclear = coc_consent_status.allowed_values.
  presence_signal:
    field: "coc_consent_status"
    present_values: ["present"]
    missing_values: ["missing"]
    unclear_values: ["unclear"]

  llm_prompt_extraction: |
    <role>
    Ты — юрист по M&A и коммерческим договорам.
    Твоя задача — точно извлечь механику получения согласия
    контрагента при смене контроля (Change of Control).

    КРИТИЧЕСКИ ВАЖНО:
    - Извлекай ТОЛЬКО то, что прямо написано в тексте.
    - НЕ делай выводов "по умолчанию" из общих норм права.
    - НЕ додумывай условия, которых нет в тексте.
    - Если информация отсутствует — для поля
      coc_consent_status ставь "missing", а для содержательных
      полей — "not_specified".
    - Если текст неоднозначен — ставь "unclear".

    Не анализируй уступку прав и перевод долга.
    Не анализируй наличие / тип режима CoC —
    это задача другого check.
    Не анализируй последствия отказа (расторжение, акселерация).
    Не анализируй carve-out и исключения.
    Не анализируй, кто именно даёт согласие.
    Не оценивай риск.
    </role>

    <context_rules>
    - Ниже приведены фрагменты, отобранные автоматически.
    - Некоторые фрагменты могут быть нерелевантны данному
      check — игнорируй их.
    - Если среди фрагментов есть противоречия — укажи "unclear"
      и объясни в reason.
    - Если ни один фрагмент не содержит информации по теме —
      coc_consent_status = "missing"; остальные поля — согласно Шагу 0.
    - Не использовать "unclear" при полном отсутствии релевантных фрагментов.
    - Не используй информацию из определений (definitions),
      преамбулы или приложений, если они не содержат
      substantive условий по теме check.
    </context_rules>

    <context>
    Ниже приведены релевантные фрагменты договора:

    {context}
    </context>

    <task>
    Заполни только следующие поля:
    - coc_consent_status
    - coc_consent_display
    - coc_consent_required
    - coc_consent_form
    - coc_response_period
    - coc_deemed_consent
    - coc_reasonableness_standard
    - reason

    Общие правила:
    - используй только то, что прямо следует из текста;
    - пиши коротко и по-русски.
    </task>

    <location_instructions>
    Для каждого поля по возможности укажи location в формате:
    {"clause_ref": "п. 12.1", "page": 7, "quote": "дословная фраза из договора"}

    Правила:
    - clause_ref — короткая ссылка на пункт / раздел / статью именно в том виде,
      как она написана в договоре;
    - page — целое число страницы;
    - quote — дословная фраза из текста договора (НЕ пересказ, НЕ парафраз),
      которая является источником значения поля. Копируй её посимвольно,
      сохраняя формулировку и порядок слов. Оптимальная длина: 30–300 символов.
      Примеры хорошего quote:
      * для coc_consent_required (yes): "Смена контроля допускается только с предварительного письменного согласия другой Стороны";
      * для coc_consent_form (prior_written): "Согласие должно быть выражено в письменной форме и предоставлено до наступления смены контроля";
      * для coc_response_period: "Сторона обязана ответить на запрос о согласии в течение 15 (пятнадцати) рабочих дней";
      * для coc_deemed_consent (yes): "Если ответ не получен в указанный срок, согласие считается предоставленным";
      * для coc_reasonableness_standard (sole_discretion): "Согласие может быть предоставлено или не предоставлено по усмотрению другой Стороны".
    - не выдумывай location или quote;
    - если точную ссылку или дословную фразу определить нельзя,
      верни location = null;
    - для coc_consent_status, coc_consent_display и reason location всегда null;
    - для coc_consent_required, coc_consent_form, coc_response_period,
      coc_deemed_consent, coc_reasonableness_standard location с quote особенно важна;
    - для coc_consent_required при значении "no":
      * quote, если договор прямо говорит "согласие не требуется" /
        "смена контроля допускается без согласия" /
        "без согласия контрагента";
      * location = null, если тема не раскрыта (значение "not_specified");
    - для coc_consent_form, coc_deemed_consent, coc_reasonableness_standard
      при значении "not_applicable" / "not_specified" — location = null;
    - если coc_consent_status = "missing" — для всех полей location = null.
    </location_instructions>

    <instructions>
    Шаг 0 — НАЛИЧИЕ ПОЛОЖЕНИЙ О СОГЛАСИИ ПРИ COC

    Заполни "coc_consent_status".

    Значения:
    - "present" — договор прямо говорит о согласии при смене контроля
      (включая случаи "согласие не требуется" / "допускается свободно" /
      "отказ по sole discretion").
    - "missing" — договор не содержит ни CoC-clause, ни положений
      о согласии при смене контроля.
    - "unclear" — формулировки есть, но надёжно определить нельзя.

    Если coc_consent_status = "missing":
    - coc_consent_required = "not_specified"
    - coc_consent_form = "not_specified"
    - coc_response_period = "Не установлено"
    - coc_deemed_consent = "not_specified"
    - coc_reasonableness_standard = "not_specified"
    - coc_consent_display = "Положения о согласии при смене контроля отсутствуют"
    - reason = "Положения о согласии при CoC не обнаружены в представленных фрагментах."
    - для всех полей location = null
    - не выполняй Шаги 1–5.

    Если coc_consent_status = "unclear":
    - coc_consent_display = "Не удалось определить наличие и условия согласия при CoC"
    - reason = "Формулировки присутствуют, но вывод надёжно сделать нельзя."
    - coc_consent_required = "unclear"
    - coc_consent_form = "unclear"
    - coc_response_period = "Не удалось определить"
    - coc_deemed_consent = "unclear"
    - coc_reasonableness_standard = "unclear"
    - для всех полей location = null

    Если coc_consent_status = "present" — переходи к Шагам 1–5.

    Шаг 1 — ТРЕБОВАНИЕ СОГЛАСИЯ

    Заполни "coc_consent_required".

    Значения:
    - "yes" — согласие контрагента прямо требуется при CoC.
    - "no" — согласие прямо не требуется при CoC.
    - "not_specified" — тема не урегулирована.
    - "unclear" — вывод сделать нельзя.

    Шаг 2 — ФОРМА СОГЛАСИЯ

    Заполни "coc_consent_form".

    Значения:
    - "prior_written" — предварительное письменное согласие.
    - "written" — письменное без требования предварительности.
    - "any_form" — форма не ограничена.
    - "not_specified" — форма не установлена.
    - "not_applicable" — согласие не требуется.
    - "unclear" — нельзя определить.

    Шаг 3 — СРОК ОТВЕТА

    Заполни "coc_response_period".

    Правила:
    - Если срок установлен: извлеки как есть
      ("10 рабочих дней", "30 calendar days").
    - Если согласие требуется, но срок не установлен:
      "Не установлен".
    - Если тема CoC / согласия вообще не урегулирована
      в договоре: "Не установлено".
    - Если согласие не требуется: "Не применимо".
    - Если нельзя определить: "Не удалось определить".

    Шаг 4 — DEEMED CONSENT

    Заполни "coc_deemed_consent".

    Значения:
    - "yes" — молчание / отсутствие ответа в срок
      считается согласием.
    - "no" — прямо требуется явное согласие.
    - "not_specified" — тема не урегулирована.
    - "not_applicable" — согласие не требуется.
    - "unclear" — нельзя определить.

    Шаг 5 — СТАНДАРТ ОТКАЗА

    Заполни "coc_reasonableness_standard".

    Значения:
    - "not_unreasonably_withheld" — отказ не может быть
      необоснованным.
    - "sole_discretion" — отказ по усмотрению.
    - "not_specified" — стандарт не установлен.
    - "not_applicable" — согласие не требуется.
    - "unclear" — нельзя определить.

    Шаг 6 — DISPLAY ДЛЯ DD GRID

    Заполни "coc_consent_display".

    Это поле — краткий итог для таблицы.
    Сформируй его на основе уже заполненных полей:
    - coc_consent_status
    - coc_consent_required
    - coc_consent_form
    - coc_response_period
    - coc_deemed_consent
    - coc_reasonableness_standard
    Не добавляй информацию, которой нет в этих полях.

    Примеры:
    - status = "missing":
      "Положения о согласии при смене контроля отсутствуют"
    - status = "unclear":
      "Не удалось определить наличие и условия согласия при CoC"
    - status = "present" и coc_consent_required = "yes":
      "Для CoC требуется предварительное письменное согласие;
      срок ответа не установлен"
      "Для CoC требуется согласие; 15 рабочих дней;
      молчание считается согласием"
      "Для CoC требуется согласие; отказ по sole discretion"
      "Для CoC требуется согласие;
      отказ не может быть необоснованным"
    - status = "present" и coc_consent_required = "no":
      "Для CoC согласие не требуется"

    Шаг 7 — ОБОСНОВАНИЕ

    Заполни "reason".

    Формат:
    - Первое предложение: краткий вывод
      (что найдено или не найдено).
    - Второе предложение: цитата из текста в кавычках
      (самый релевантный фрагмент, до 100 символов).

    Примеры:
    - "Договор требует предварительного письменного согласия
      при CoC, стандарт отказа не установлен.
      «Prior written consent of the counterparty is required»."
    - "Положения о согласии при CoC не обнаружены
      в представленных фрагментах."
    </instructions>

    <edge_cases>
    - "A change of control requires prior written consent":
      * coc_consent_status = "present"
      * coc_consent_required = "yes"
      * coc_consent_form = "prior_written"
      * coc_response_period = "Не установлен"
      * coc_deemed_consent = "not_specified"
      * coc_reasonableness_standard = "not_specified"
      * coc_consent_display =
        "Для CoC требуется предварительное письменное согласие;
        срок ответа не установлен"

    - "Consent shall not be unreasonably withheld, delayed
      or conditioned":
      * coc_consent_status = "present"
      * coc_reasonableness_standard = "not_unreasonably_withheld"

    - "Failure to respond within 15 business days,
      consent shall be deemed given":
      * coc_consent_status = "present"
      * coc_response_period = "15 рабочих дней"
      * coc_deemed_consent = "yes"

    - "In its sole and absolute discretion":
      * coc_consent_status = "present"
      * coc_reasonableness_standard = "sole_discretion"

    - Согласие не требуется:
      * coc_consent_status = "present"
      * coc_consent_required = "no"
      * coc_consent_form = "not_applicable"
      * coc_response_period = "Не применимо"
      * coc_deemed_consent = "not_applicable"
      * coc_reasonableness_standard = "not_applicable"
      * coc_consent_display = "Для CoC согласие не требуется"

    - Тема CoC / согласия вообще не урегулирована:
      * coc_consent_status = "missing"
      * coc_consent_required = "not_specified"
      * coc_consent_form = "not_specified"
      * coc_response_period = "Не установлено"
      * coc_deemed_consent = "not_specified"
      * coc_reasonableness_standard = "not_specified"
      * coc_consent_display =
        "Положения о согласии при смене контроля отсутствуют"

    - Нет релевантных фрагментов:
      * coc_consent_status = "missing"
      * coc_consent_display =
        "Положения о согласии при смене контроля отсутствуют"

    - Фрагменты есть, но вывод сделать нельзя:
      * coc_consent_status = "unclear"
      * coc_consent_required = "unclear"
      * coc_consent_display =
        "Не удалось определить наличие и условия согласия при CoC"
    </edge_cases>

    <output_expectations>
    - Верни результат строго в формате JSON.
    - Не оборачивай в markdown-блоки (без ```).
    - Не добавляй комментариев вне JSON.
    - Все значения полей с allowed_values — на английском
      (как указано в списке).
    - Свободные текстовые поля (coc_consent_display,
      coc_response_period, reason) — на русском языке.
    - Не добавляй никаких полей, кроме указанных.
    - Для каждого поля возвращай объект с ключами
      "value", "confidence", "location".

    Пример структуры ответа:
    {
      "coc_consent_status": {"value": "present", "confidence": 0.95, "location": null},
      "coc_consent_display": {"value": "Для CoC требуется предварительное письменное согласие; срок ответа не установлен", "confidence": 0.95, "location": null},
      "coc_consent_required": {"value": "yes", "confidence": 0.95, "location": {"clause_ref": "п. 12.1", "page": 7, "quote": "Смена контроля допускается только с предварительного письменного согласия другой Стороны"}},
      "coc_consent_form": {"value": "prior_written", "confidence": 0.92, "location": {"clause_ref": "п. 12.1", "page": 7, "quote": "Согласие должно быть выражено в письменной форме и предоставлено до наступления смены контроля"}},
      "coc_response_period": {"value": "Не установлен", "confidence": 0.90, "location": null},
      "coc_deemed_consent": {"value": "not_specified", "confidence": 0.90, "location": null},
      "coc_reasonableness_standard": {"value": "not_specified", "confidence": 0.90, "location": null},
      "reason": {"value": "Договор требует предварительного письменного согласия при CoC. «Смена контроля допускается только с предварительного письменного согласия другой Стороны».", "confidence": 0.90, "location": null}
    }
    </output_expectations>

  fields:
    - name: "coc_consent_status"
      type: "string"
      presentation: "signal"
      risk_weight: "info"
      description: "Наличие положений о согласии при смене контроля"
      display_in_grid: false
      allowed_values:
        - "present"
        - "missing"
        - "unclear"

    - name: "coc_consent_display"
      type: "string"
      presentation: "fact"
      label: "Согласие при CoC"
      description: "Нормализованный user-facing вывод для DD Grid"
