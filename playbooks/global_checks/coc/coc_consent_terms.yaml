id: "coc_consent_terms"
name: "Условия согласия при CoC / уступке"
description: >
  Анализирует условия получения согласия контрагента при смене контроля,
  уступке прав или переводе долга: требуется ли согласие, кто его даёт,
  форма и сроки, наличие deemed consent, ограничения на произвольный
  отказ (not unreasonably withheld), carve-out для внутригрупповых
  передач, последствия отказа. Оценивает риск блокировки сделки
  контрагентом.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"

rules:
  keyword_mode: any

  keywords:
    high:
      # Согласие — точные формулировки
      - "(?i)prior\\s+written\\s+consent"
      - "(?i)предварительн[а-я]+\\s+письменн[а-я]+\\s+согласи[ея]"
      - "(?i)consent\\s+of\\s+the\\s+other\\s+party"
      - "(?i)согласи[ея]\\s+(другой\\s+стороны|контрагента)"
      - "(?i)without\\s+(the\\s+)?(prior\\s+)?(written\\s+)?consent"
      - "(?i)без\\s+(получения\\s+)?(предварительного\\s+)?(письменного\\s+)?согласи[яи]"
      - "(?i)approval\\s+of\\s+the\\s+other\\s+party"
      - "(?i)одобрени[ея]\\s+(другой\\s+стороны|контрагента)"

      # Not unreasonably withheld
      - "(?i)not\\s+(to\\s+be\\s+)?unreasonably\\s+(withheld|delayed|conditioned)"
      - "(?i)не\\s+может\\s+быть\\s+необоснованно\\s+(удержан|отказан|задержан)"
      - "(?i)consent\\s+shall\\s+not\\s+be\\s+unreasonably"
      - "(?i)согласи[ея]\\s+не\\s+должно\\s+(необоснованно|без\\s+оснований)"

      # Deemed consent
      - "(?i)deemed\\s+(to\\s+be\\s+)?(given|granted|obtained)"
      - "(?i)считается\\s+(данным|полученным|предоставленным)"
      - "(?i)shall\\s+be\\s+deemed\\s+(to\\s+have\\s+)?consent"
      - "(?i)молчани[ея][\\s\\S]{0,30}(означает|считается|равносильн)"
      - "(?i)failure\\s+to\\s+respond[\\s\\S]{0,30}deemed"

      # Sole discretion
      - "(?i)sole\\s+(and\\s+absolute\\s+)?discretion"
      - "(?i)по\\s+(своему\\s+)?(исключительному\\s+)?усмотрению"
      - "(?i)absolute\\s+discretion"
      - "(?i)without\\s+giving\\s+(any\\s+)?reason"

    medium:
      # Согласие — общие
      - "(?i)consent"
      - "(?i)согласи[ея]"
      - "(?i)approval"
      - "(?i)одобрени[ея]"
      - "(?i)permission"
      - "(?i)разрешени[ея]"

      # Carve-out для аффилированных лиц
      - "(?i)except\\s+(for\\s+)?(transfer|assignment)\\s+to[\\s\\S]{0,30}(affiliate|group)"
      - "(?i)за\\s+исключением\\s+передач[ьи][\\s\\S]{0,30}(аффилированн|групп)"
      - "(?i)intra[-\\s]?group\\s+transfer"
      - "(?i)внутригрупповая\\s+передач"
      - "(?i)permitted\\s+(transfer|assignment)"
      - "(?i)разрешённ[а-я]+\\s+(передач|уступк)"

      # Сроки рассмотрения
      - "(?i)within\\s+\\d+\\s+(business\\s+|working\\s+)?(days?|дней)"
      - "(?i)в\\s+течение\\s+\\d+\\s+(рабочих\\s+)?(дней|календарных)"
      - "(?i)response\\s+(period|time)"
      - "(?i)срок\\s+рассмотрени[яи]"

      # Последствия отказа
      - "(?i)if\\s+consent\\s+is\\s+not\\s+(given|obtained|granted)"
      - "(?i)если\\s+согласи[ея]\\s+не\\s+(получено|дано|предоставлено)"
      - "(?i)refusal\\s+(of|to\\s+give)\\s+consent"
      - "(?i)отказ\\s+в\\s+(даче\\s+)?согласи[яи]"

      # Уступка / перевод долга
      - "(?i)assignment"
      - "(?i)уступк[аи]"
      - "(?i)transfer\\s+of\\s+(rights?|obligations?)"
      - "(?i)передач[аи]\\s+прав"
      - "(?i)перевод\\s+долга"
      - "(?i)novation"
      - "(?i)новаци[яи]"

    low:
      # Общие термины
      - "(?i)consent"
      - "(?i)согласи"
      - "(?i)approve"
      - "(?i)одобр"
      - "(?i)permit"
      - "(?i)разреш"
      - "(?i)written"
      - "(?i)письменн"
      - "(?i)prior"
      - "(?i)предварительн"
      - "(?i)discretion"
      - "(?i)усмотрени"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 640

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 500

retrieval:
  context_k: 5
  max_chunks: 10
  boost_keywords:
    - "prior written consent"
    - "предварительное письменное согласие"
    - "consent of the other party"
    - "согласие контрагента"
    - "without consent"
    - "без получения согласия"
    - "not unreasonably withheld"
    - "не может быть необоснованно удержано"
    - "deemed consent"
    - "считается данным"
    - "sole discretion"
    - "по своему усмотрению"
    - "intra-group transfer"
    - "внутригрупповая передача"
    - "permitted transfer"
    - "разрешённая передача"
    - "response period"
    - "срок рассмотрения"
    - "refusal of consent"
    - "отказ в согласии"
    - "assignment"
    - "уступка прав"
    - "перевод долга"
  rerank: true
  filters: {}

conditional: null

extraction:
  llm_prompt_extraction: |
    <role>
    Ты — юрист по M&A и коммерческим договорам.
    Твоя специализация — анализ условий получения согласия
    контрагента при смене контроля (CoC), уступке прав и переводе
    долга, включая механизмы deemed consent, ограничения
    на произвольный отказ и carve-out.
    </role>

    <context>
    Ниже приведены фрагменты договора с положениями о согласии
    при смене контроля, уступке прав или переводе долга:

    {context}
    </context>

    <instructions>
    Проведи анализ по шагам. Каждый шаг логически соответствует одному
    или нескольким полям итоговой оценки риска.

    Шаг 1 — ТРЕБУЕТСЯ ЛИ СОГЛАСИЕ
    (используется для заполнения поля "consent_required"):
    - Определи, требуется ли согласие контрагента при CoC,
      уступке прав или переводе долга:
      * "yes_always" — согласие требуется во всех случаях,
        без исключений;
      * "yes_with_carveout" — согласие требуется, но есть
        исключения (carve-out);
      * "no" — согласие не требуется;
      * "unclear" — невозможно определить.

    Шаг 2 — КТО ДАЁТ СОГЛАСИЕ
    (используется для заполнения поля "consent_grantor"):
    - Определи, кто должен дать согласие:
      * "counterparty" — только другая сторона по договору;
      * "counterparty_and_internal" — контрагент + внутренний
        орган (совет директоров, общее собрание);
      * "counterparty_and_third_party" — контрагент + третье лицо
        (банк, регулятор, государственный орган);
      * "multiple" — несколько субъектов (укажи в reason);
      * "not_applicable" — согласие не требуется;
      * "unclear" — неясно.

    Шаг 3 — ФОРМА СОГЛАСИЯ
    (используется для заполнения поля "consent_form"):
    - Определи требуемую форму:
      * "prior_written" — предварительное письменное согласие;
      * "written" — письменное согласие (без требования
        предварительности);
      * "any_form" — без ограничений по форме;
      * "not_specified" — форма не определена;
      * "not_applicable" — согласие не требуется.

    Шаг 4 — СРОКИ РАССМОТРЕНИЯ
    (используется для заполнения поля "response_period"):
    - Определи, установлен ли срок для рассмотрения запроса
      на согласие:
      * Если да — укажи срок (например: "30 business days",
        "15 рабочих дней").
      * Если нет — укажи "not_specified".
      * Если согласие не требуется — "not_applicable".

    Шаг 5 — DEEMED CONSENT
    (используется для заполнения поля "deemed_consent"):
    - Определи, предусмотрен ли механизм, при котором
      отсутствие ответа в установленный срок считается
      согласием:
      * "yes" — механизм есть;
      * "no" — нет или прямо указано, что молчание
        не является согласием;
      * "unclear" — неясно;
      * "not_applicable" — согласие не требуется.

    Шаг 6 — ОГРАНИЧЕНИЯ НА ОТКАЗ
    (используется для заполнения поля "reasonableness_standard"):
    - Определи, ограничено ли право контрагента отказать
      в согласии:
      * "not_unreasonably_withheld" — согласие не может быть
        необоснованно удержано/задержано/обусловлено;
      * "sole_discretion" — контрагент может отказать
        по своему усмотрению без обоснования;
      * "with_criteria" — установлены объективные критерии
        для отказа;
      * "not_specified" — стандарт не определён;
      * "not_applicable" — согласие не требуется.

    Шаг 7 — CARVE-OUT (ИСКЛЮЧЕНИЯ)
    (используется для заполнения поля "has_carveout"):
    - Определи, есть ли случаи, когда согласие НЕ требуется:
      * внутригрупповые передачи (intra-group transfer);
      * передача аффилированным лицам;
      * передача в рамках реструктуризации;
      * передача банку / залогодержателю.
    - Оцени:
      * "yes" — carve-out есть;
      * "no" — нет исключений;
      * "unclear" — неясно;
      * "not_applicable" — согласие не требуется вообще.

    Шаг 8 — ПОСЛЕДСТВИЯ ОТКАЗА В СОГЛАСИИ
    (используется для заполнения поля "refusal_consequences"):
    - Определи, что происходит, если контрагент отказывает
      в согласии:
      * "transaction_blocked" — сделка/уступка невозможна;
      * "termination_right" — контрагент получает право
        на расторжение;
      * "renegotiation" — стороны обязаны пересмотреть условия;
      * "no_specific_consequences" — последствия не прописаны;
      * "not_applicable" — согласие не требуется;
      * "unclear" — неясно.

    Шаг 9 — RED FLAGS
    (используется для заполнения поля "red_flags"):
    Присвой один или несколько кодов из списка ниже.
    Если ни один код не применим — верни "NONE".
    Если данных недостаточно для оценки — верни "UNCLEAR".

    Коды:
    • CNS1 — Согласие требуется всегда (без carve-out),
      и контрагент может отказать по своему усмотрению
      (sole discretion) или без ограничений.
    • CNS2 — Нет механизма deemed consent при молчании
      контрагента — согласие может блокироваться
      бездействием.
    • CNS3 — Нет ограничения "not to be unreasonably withheld" —
      контрагент может отказать без обоснования
      (при отсутствии sole discretion — ситуация
      неопределённая, что тоже создаёт риск).
    • CNS4 — Отказ в согласии влечёт право на расторжение
      или акселерацию — каскадное ухудшение при блокировке.
    • CNS5 — Требуется согласие нескольких субъектов
      («двойной/тройной фильтр»: контрагент + регулятор /
      банк / совет директоров), что усложняет и замедляет
      процесс.

    Формат ответа: коды через запятую без комментариев
    (например: "CNS1, CNS2").
    Вся аргументация — в поле reason.

    Шаг 10 — ОБОСНОВАНИЕ
    (используется для заполнения поля "reason"):

    - В reason кратко обоснуй вывод, опираясь на ключевые
      формулировки из текста (с цитатами в кавычках), и укажи:
      * требуется ли согласие и на каких условиях;
      * кто даёт согласие;
      * есть ли deemed consent и ограничения на отказ;
      * есть ли carve-out;
      * каковы последствия отказа;
      * если выставлены red_flags — обоснуй каждый код;
      * если red_flags = "NONE" — укажи, почему условия
        согласия приемлемы для M&A.
    </instructions>

    <edge_cases>
    Обрабатывай пограничные ситуации так:

    - Согласие требуется, но есть фиксированный срок и
      deemed consent при молчании:
      deemed_consent = "yes"; это снижает риск;
      CNS2 не выставляется; в reason укажи, что механизм
      защищает от блокировки бездействием.

    - Согласие требуется «по усмотрению» (sole discretion),
      без критериев и сроков:
      reasonableness_standard = "sole_discretion";
      зафиксируй CNS1; overall_risk_level = "high".

    - Текст говорит только «с предварительного письменного
      согласия» без деталей о сроках, deemed consent,
      стандарте разумности:
      consent_required = "yes_always";
      deemed_consent = "no" или "unclear";
      reasonableness_standard = "not_specified";
      зафиксируй CNS2 + CNS3; в reason укажи пробелы.

    - Помимо согласия контрагента нужно одобрение совета
      директоров или регулятора:
      consent_grantor = "counterparty_and_internal"
      или "counterparty_and_third_party";
      зафиксируй CNS5; в reason укажи сложность процесса.

    - Есть carve-out для внутригрупповых передач:
      consent_required = "yes_with_carveout";
      has_carveout = "yes"; в carveout_description
      опиши исключения; это снижает риск.

    - Отказ в согласии → право контрагента на расторжение:
      refusal_consequences = "termination_right";
      зафиксируй CNS4; в reason укажи каскадный эффект.

    - Согласие не требуется вообще:
      consent_required = "no"; все остальные поля = "not_applicable";
      red_flags = "NONE"; overall_risk_level = "low".

    - Пустые или явно нерелевантные фрагменты:
      consent_required = "unclear"; red_flags = "UNCLEAR";
      в reason укажи, что данных недостаточно.
    </edge_cases>

    <output_expectations>
    На основе твоего анализа отдельный механизм извлечения сформирует
    структурированные поля по заранее заданной схеме. Твоя задача —
    давать чёткие юридические выводы и указывать конкретные
    формулировки из текста, на которых они основаны.
    </output_expectations>

  enabled: true
  mode: "hybrid"
  fields:
    - name: "consent_required"
      type: "string"
      allowed_values:
        - "yes_always"
        - "yes_with_carveout"
        - "no"
        - "unclear"

    - name: "consent_grantor"
      type: "string"
      allowed_values:
        - "counterparty"
        - "counterparty_and_internal"
        - "counterparty_and_third_party"
        - "multiple"
        - "not_applicable"
        - "unclear"

    - name: "consent_form"
      type: "string"
      allowed_values:
        - "prior_written"
        - "written"
        - "any_form"
        - "not_specified"
        - "not_applicable"

    - name: "response_period"
      type: "string"

    - name: "deemed_consent"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
        - "not_applicable"

    - name: "reasonableness_standard"
      type: "string"
      allowed_values:
        - "not_unreasonably_withheld"
        - "sole_discretion"
        - "with_criteria"
        - "not_specified"
        - "not_applicable"

    - name: "has_carveout"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
        - "not_applicable"

    - name: "refusal_consequences"
      type: "string"
      allowed_values:
        - "transaction_blocked"
        - "termination_right"
        - "renegotiation"
        - "no_specific_consequences"
        - "not_applicable"
        - "unclear"

    - name: "red_flags"
      type: "string"

    - name: "reason"
      type: "string"

  store_payload: true

red_flags:
  items:
    - code: "CNS1"
      description: >
        Согласие требуется всегда (без carve-out), и контрагент
        может отказать по своему усмотрению (sole discretion)
        без обоснования.
    - code: "CNS2"
      description: >
        Нет механизма deemed consent при молчании контрагента —
        согласие может блокироваться бездействием.
    - code: "CNS3"
      description: >
        Нет ограничения "not to be unreasonably withheld" —
        контрагент может отказать без обоснования,
        стандарт разумности не установлен.
    - code: "CNS4"
      description: >
        Отказ в согласии влечёт право на расторжение
        или акселерацию — каскадное ухудшение при блокировке.
    - code: "CNS5"
      description: >
        Требуется согласие нескольких субъектов (контрагент +
        регулятор / банк / совет директоров), что усложняет
        и замедляет процесс получения.
        