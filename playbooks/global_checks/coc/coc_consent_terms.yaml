id: "coc_consent_terms"
name: "Условия согласия при CoC / уступке"
description: >
  Анализирует, как именно оформлено требование согласия контрагента
  при смене контроля, уступке прав или переводе долга.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"

rules:
  keywords:
    - "письменное согласие"
    - "предварительное согласие"
    - "prior written consent"
    - "consent of the other party"
    - "согласие контрагента"
    - "approval of the other party"
    - "без получения согласия"
  keyword_mode: "any"
  regex_patterns: []
  clause_patterns: []

llm:
  prompt_template: |
    <role>
    Ты — юрист по M&A и коммерческим договорам.
    Твоя специализация — анализ условий получения согласия контрагента
    при смене контроля, уступке прав и переводе долга.
    </role>

    <context>
    Ниже приведены фрагменты с положениями о смене контроля, уступке прав
    или переводе долга:

    {context}
    </context>

    <instructions>
    Проведи анализ по шагам. Каждый шаг логически связан с одним или
    несколькими полями итоговой оценки.

    Шаг 1 — ТРЕБУЕТСЯ ЛИ СОГЛАСИЕ КОНТРАГЕНТА
    (используется для заполнения поля "consent_required"):
    - Определи, требуется ли согласие контрагента при смене контроля,
      уступке прав или переводе долга:
      * прямое требование предварительного письменного согласия
        ("prior written consent", "предварительное письменное согласие");
      * отсутствие требования согласия (допущение уступки/перевода без согласия);
      * ситуации, когда из фрагментов нельзя сделать уверенный вывод.
    - Сделай вывод по сути: согласие требуется, не требуется или
      оценка невозможна по имеющемуся тексту.

    Шаг 2 — КТО ИМЕННО ДАЁТ СОГЛАСИЕ
    (используется для заполнения поля "consent_grantor"):
    - Определи, кто должен дать согласие:
      * другая сторона по договору (контрагент),
      * орган группы (совет директоров, общее собрание и т.п.),
      * третье лицо (кредитор, банк, регулятор, государственный орган),
      * комбинация нескольких субъектов.
    - Если из текста это неочевидно, опиши максимально конкретно
      или зафиксируй неопределённость.

    Шаг 3 — ФОРМА И СРОКИ СОГЛАСИЯ
    (используется для заполнения поля "consent_form_and_timing"):
    - Проанализируй, в какой форме и в какие сроки должно быть получено согласие:
      * письменная форма, предварительное согласие до совершения сделки,
      * установленный срок рассмотрения запроса (количество дней),
      * есть ли указание на последствия отсутствия ответа.
    - Если форма и сроки не урегулированы, явно отрази это в своём описании.

    Шаг 4 — МЕХАНИЗМ DEEMED CONSENT (СЧИТАЕТСЯ СОГЛАСИЕМ)
    (используется для заполнения поля "deemed_consent"):
    - Определи, прописано ли, что при отсутствии ответа в течение
      определённого срока согласие считается данным.
    - Классифицируй ситуацию как:
      * yes — есть явный механизм deemed consent,
      * no — такого механизма нет или прямо указано иное,
      * unclear — по тексту нельзя сделать вывод.

    Шаг 5 — ОБЩИЙ УРОВЕНЬ РИСКА
    (используется для формирования "overall_risk_level" и "reason"):
    - Оцени риск для стороны, зависящей от сделки (как правило, покупателя
      бизнеса или стороны, нуждающейся в уступке/переводе):
      * высокий риск, если согласие требуется всегда, нет сроков и
        механизма deemed consent, и контрагент фактически может блокировать
        сделку;
      * более низкий риск при наличии разумных carve-out, сроков ответа
        и механизма deemed consent.
    - Обоснуй уровень риска ссылками на конкретные формулировки
      (желательно с короткими цитатами в кавычках).
    </instructions>

    <edge_cases>
    Обрабатывай пограничные ситуации так:

    - Если согласие формально требуется, но есть фиксированный срок
      рассмотрения запроса и прямо указано, что при отсутствии ответа
      согласие считается данным:
      учитывай это как наличие deemed consent и как фактор снижения риска.

    - Если согласие требуется "по усмотрению" контрагента, без критериев
      и сроков:
      воспринимай это как повышенный риск для стороны, зависящей от сделки,
      и отражай это в анализе.

    - Если текст говорит только "с предварительного письменного согласия"
      и ничего не говорит о сроках и последствиях молчания:
      учитывай отсутствие механизма deemed consent и указывай, что сроки
      и последствия молчания не урегулированы.

    - Если помимо согласия контрагента нужно ещё одобрение внутренних
      органов (совет директоров, общее собрание и т.п.):
      фиксируй наличие "двойного фильтра" и оцени риск с учётом этого.

    - Пустые или явно нерелевантные фрагменты:
      укажи, что данных недостаточно для анализа условий согласия при
      CoC/уступке, и объясни, как это влияет на уровень риска.
    </edge_cases>

    <output_expectations>
    На основе твоего анализа отдельный механизм извлечения сформирует
    структурированные поля по заранее заданной схеме. Твоя задача —
    давать чёткие юридические выводы и указывать конкретные формулировки
    из текста, на которых они основаны.
    </output_expectations>
  prompt_file: null
  context_k: 4
  temperature: 0.0
  max_tokens: 512

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 500

retrieval:
  context_k: 4
  max_chunks: 8
  boost_keywords:
    - "consent"
    - "согласие"
    - "prior written consent"
  rerank: true
  filters: {}

conditional: null

extraction:
  enabled: true
  mode: "hybrid"
  fields:
    - name: "consent_required"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "consent_grantor"
      type: "string"

    - name: "consent_form_and_timing"
      type: "string"

    - name: "deemed_consent"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "overall_risk_level"
      type: "string"
      allowed_values:
        - "low"
        - "medium"
        - "high"

    - name: "reason"
      type: "string"

  store_payload: true

red_flags:
  items:
    - code: "CNS1"
      description: "Согласие требуется всегда, без разумных carve-out, и может быть произвольно удержано."
    - code: "CNS2"
      description: "Нет механизма deemed consent при молчании контрагента, при этом согласие критично для сделки."
