id: "coc_change_of_control_regime"
name: "Смена контроля (Change of Control)"
group: "COC"
description: >
  Анализирует, регулирует ли договор смену контроля (Change of Control)
  и какой общий режим установлен: запрет, необходимость согласия,
  обязанность уведомления, право на расторжение или смешанный режим.

  Check не анализирует:
  - уступку прав и перевод долга;
  - детальную механику согласия (форма, сроки, deemed consent,
    reasonableness standard);
  - детальную процедуру уведомления;
  - последствия нарушения beyond explicit text;
  - экономическую оценку риска.

  Детальная механика согласия и процессуальные детали могут покрываться
  отдельным check, например coc_consent_terms.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"
ui_mode: "field_extraction"

rules:
  keyword_mode: any

  keywords:
    high:
      - "(?i)change\\s+of\\s+control"
      - "(?i)change\\s+in\\s+control"
      - "(?i)upon\\s+a\\s+change\\s+of\\s+control"
      - "(?i)in\\s+the\\s+event\\s+of\\s+a\\s+change\\s+of\\s+control"
      - "(?i)смен[аы]\\s+контрол[яе]"
      - "(?i)изменени[ея]\\s+контрол[яе]"
      - "(?i)переход\\s+контрол[яе]"
      - "(?i)утрат[аы]\\s+контрол[яе]"
      - "(?i)without\\s+(the\\s+)?prior\\s+written\\s+consent[\\s\\S]{0,40}change\\s+of\\s+control"
      - "(?i)в\\s+случае\\s+смены\\s+контроля"
      - "(?i)при\\s+смене\\s+контроля"

    medium:
      - "(?i)control\\s+of\\s+(a\\s+party|the\\s+company)"
      - "(?i)beneficial\\s+ownership"
      - "(?i)majority\\s+of\\s+voting\\s+shares"
      - "(?i)контролирующ"
      - "(?i)контроль\\s+над"
      - "(?i)бенефициарн"
      - "(?i)более\\s+50\\s*%\\s+голосующих\\s+акций"
      - "(?i)directly\\s+or\\s+indirectly\\s+controls?"
      - "(?i)прямо\\s+или\\s+косвенно\\s+контролирует"

    low:
      - "(?i)change\\s+of\\s+ownership"
      - "(?i)ownership\\s+change"
      - "(?i)смена\\s+владельца"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 420

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 500

retrieval:
  retrieval_profile: "change_of_control_check"
  context_k: 6
  max_chunks: 12

  retrieval_query: >
    change of control смена контроля изменение контроля
    при смене контроля согласие уведомление право на расторжение
    termination on change of control

  boost_keywords:
    - "change of control"
    - "change in control"
    - "смена контроля"
    - "изменение контроля"
    - "при смене контроля"
    - "upon a change of control"
    - "without prior written consent"
    - "право на расторжение"
    - "termination on change of control"
    - "уведомление о смене контроля"

  negative_keywords:
    - "assignment"
    - "уступка прав"
    - "перевод долга"
    - "означает"
    - "в целях настоящего"
    - "споры"
    - "подсудность"
    - "применимое право"

  preferred_unit_types:
    - "obligation"
    - "general_provision"

  excluded_unit_types:
    - "definition"
    - "structural_anchor"
    - "technical_fragment"
    - "appendix_reference"

  preferred_clause_functions:
    - "limitations"
    - "rights"
    - "obligations"
    - "boilerplate"
    - "procedures"

  position_bias:
    preferred_range: [0.55, 1.00]
    boost: 0.30
    scope: "segment"

  rerank: true
  filters: {}

conditional: null

enrichment_hints:
  preferred_segment_types:
    - "contract"
    - "amendment"
  excluded_segment_types:
    - "technical_specification"
    - "price_list"
    - "invoice"
    - "act"
  confidence_bonus_on_match: 0.10
  confidence_penalty_on_excluded_segment: 0.15

extraction:
  enabled: true
  mode: "hybrid"
  llm_max_tokens: 600

  # Declarative presence-gate: maps coc_status value to CheckResult.result.
  # present -> pass, missing -> missing_required_clause, unclear -> unclear.
  # Contract: present + missing + unclear must equal coc_status.allowed_values.
  presence_signal:
    field: "coc_status"
    present_values: ["present"]
    missing_values: ["missing"]
    unclear_values: ["unclear"]

  llm_prompt_extraction: |
    <role>
    Ты — юрист по M&A и коммерческим договорам.
    Твоя задача — точно извлечь только общий режим смены контроля
    (Change of Control, CoC) из текста договора.

    КРИТИЧЕСКИ ВАЖНО:
    - Извлекай ТОЛЬКО то, что прямо написано в тексте.
    - НЕ делай выводов "по умолчанию" из общих норм права.
    - НЕ додумывай условия, которых нет в тексте.
    - Если информация отсутствует — ставь "missing"
      или "not_specified", а не предполагай вариант.
    - Если текст неоднозначен — ставь "unclear".

    Не оценивай риск.
    Не анализируй уступку прав и перевод долга.
    Не анализируй детальную механику согласия, сроки ответа,
    deemed consent, reasonableness standard.
    </role>

    <context_rules>
    - Ниже приведены фрагменты, отобранные автоматически.
    - Некоторые фрагменты могут быть нерелевантны данному
      check — игнорируй их.
    - Если среди фрагментов есть противоречия — укажи "unclear"
      и объясни в reason.
    - Если ни один фрагмент не содержит информации по теме —
      используй значения для случая "тема не урегулирована".
    - Не используй информацию из определений (definitions),
      преамбулы или приложений, если они не содержат
      substantive условий по теме check.
    </context_rules>

    <context>
    Ниже приведены релевантные фрагменты договора:

    {context}
    </context>

    <task>
    Заполни только следующие поля:
    - coc_display
    - coc_status
    - coc_regime_type
    - reason

    Общие правила:
    - используй только то, что прямо следует из текста;
    - не смешивай CoC с assignment / transfer;
    - пиши коротко и по-русски.
    </task>

    <location_instructions>
    Для каждого поля по возможности укажи location в формате:
    {"clause_ref": "п. 12.1", "page": 7, "quote": "дословная фраза из договора"}

    Правила:
    - clause_ref — короткая ссылка на пункт / раздел / статью именно в том виде,
      как она написана в договоре;
    - page — целое число страницы;
    - quote — дословная фраза из текста договора (НЕ пересказ, НЕ парафраз),
      которая является источником значения поля. Копируй её посимвольно,
      сохраняя формулировку и порядок слов. Оптимальная длина: 30–300 символов.
      Если значение поля выведено из конкретной фразы договора — quote ДОЛЖЕН
      содержать эту фразу без изменений.
      Примеры хорошего quote:
      * для coc_regime_type (consent_required): "Смена контроля допускается только с предварительного письменного согласия другой Стороны";
      * для coc_regime_type (termination_right): "В случае изменения контроля над Стороной другая Сторона вправе расторгнуть настоящий Договор в одностороннем порядке";
      * для coc_regime_type (notice_required): "Сторона обязуется уведомить другую Сторону об изменении контроля в течение 5 рабочих дней".
    - не выдумывай location или quote;
    - если точную ссылку или дословную фразу определить нельзя,
      верни location = null;
    - для coc_display и reason location всегда null
      (они синтезированы и не имеют прямого источника в тексте);
    - для coc_regime_type location с quote особенно важна.
    - Если coc_status = "missing" (тема не раскрыта в договоре) —
      для всех полей location = null.
    </location_instructions>

    <instructions>
    Шаг 1 — НАЛИЧИЕ ПОЛОЖЕНИЙ

    Заполни "coc_status".

    Значения:
    - "present" — если договор прямо регулирует change of control /
      смену контроля.
    - "missing" — если таких положений нет.
    - "unclear" — если формулировки есть, но режим надёжно
      определить нельзя.

    Шаг 2 — ТИП РЕЖИМА

    Заполни "coc_regime_type".

    Значения:
    - "prohibited" — смена контроля прямо запрещена.
    - "consent_required" — смена контроля допускается только
      с предварительного согласия.
    - "notice_required" — при смене контроля требуется уведомление.
    - "termination_right" — при смене контроля у другой стороны
      возникает право на расторжение / отказ.
    - "mixed" — текст устанавливает более одного режима
      или не позволяет свести его к одному типу.
    - "not_specified" — если coc_status = "missing".
    - "unclear" — режим нельзя определить надёжно.

    Шаг 3 — DISPLAY ДЛЯ DD GRID

    Заполни "coc_display".

    Это поле — краткий итог для таблицы.
    Сформируй его на основе уже заполненных полей:
    - coc_status
    - coc_regime_type
    Не добавляй информацию, которой нет в этих полях.

    Базовые шаблоны:
    - status = "missing":
      "Положения о смене контроля не установлены"
    - status = "unclear":
      "Не удалось определить режим смены контроля"

    Если status = "present":
    - regime = "prohibited":
      "Смена контроля запрещена"
    - regime = "consent_required":
      "Смена контроля — только с предварительного согласия"
    - regime = "notice_required":
      "При смене контроля требуется уведомление"
    - regime = "termination_right":
      "При смене контроля у другой стороны возникает
      право на расторжение"
    - regime = "mixed":
      "Режим смены контроля смешанный"

    Шаг 4 — КРАТКОЕ ОБОСНОВАНИЕ

    Заполни "reason".

    Формат:
    - Первое предложение: краткий вывод по режиму CoC.
    - Второе предложение: цитата из текста в кавычках
      (самый релевантный фрагмент, до 100 символов).

    Примеры:
    - "Договор требует предварительного письменного согласия
      при смене контроля.
      «A change of control shall require prior written consent»."
    - "Положения о смене контроля не обнаружены
      в представленных фрагментах."
    </instructions>

    <edge_cases>
    - "A change of control shall require prior written consent":
      * coc_status = "present"
      * coc_regime_type = "consent_required"
      * coc_display =
        "Смена контроля — только с предварительного согласия"

    - "Upon a change of control, the other party may terminate":
      * coc_status = "present"
      * coc_regime_type = "termination_right"
      * coc_display =
        "При смене контроля у другой стороны возникает
        право на расторжение"

    - "The party shall notify of any change of control":
      * coc_status = "present"
      * coc_regime_type = "notice_required"
      * coc_display =
        "При смене контроля требуется уведомление"

    - Тема CoC вообще не урегулирована:
      * coc_status = "missing"
      * coc_regime_type = "not_specified"
      * coc_display =
        "Положения о смене контроля не установлены"

    - Нет релевантных фрагментов:
      * coc_status = "missing"
      * coc_regime_type = "not_specified"
      * coc_display =
        "Положения о смене контроля не установлены"

    - Формулировки есть, но режим не ясен:
      * coc_status = "unclear"
      * coc_regime_type = "unclear"
      * coc_display =
        "Не удалось определить режим смены контроля"
    </edge_cases>

    <output_expectations>
    - Верни результат строго в формате JSON.
    - Не оборачивай в markdown-блоки (без ```).
    - Не добавляй комментариев вне JSON.
    - Все значения полей с allowed_values — на английском
      (как указано в списке).
    - Свободные текстовые поля (coc_display, reason) —
      на русском языке.
    - Не добавляй никаких полей, кроме указанных.
    - Для каждого поля возвращай объект с ключами
      "value", "confidence", "location".

    Пример структуры ответа:
    {
      "coc_display": {"value": "Смена контроля — только с предварительного согласия", "confidence": 0.95, "location": null},
      "coc_status": {"value": "present", "confidence": 0.95, "location": null},
      "coc_regime_type": {"value": "consent_required", "confidence": 0.95, "location": {"clause_ref": "п. 12.1", "page": 7, "quote": "Смена контроля допускается только с предварительного письменного согласия другой Стороны"}},
      "reason": {"value": "...", "confidence": 0.90, "location": null}
    }
    </output_expectations>

  fields:
    - name: "coc_display"
      type: "string"
      presentation: "fact"
      label: "Режим CoC"
      description: "Нормализованный user-facing вывод для DD Grid"
      display_in_grid: true
      display_priority: 1

    - name: "coc_status"
      type: "string"
      presentation: "signal"
      risk_weight: "info"
      description: "Наличие положений о смене контроля"
      display_in_grid: false
      allowed_values:
        - "present"
        - "missing"
        - "unclear"

    - name: "coc_regime_type"
      type: "string"
      presentation: "signal"
      risk_weight: "high"
      description: "Тип режима смены контроля"
      display_in_grid: false
      allowed_values:
        - "prohibited"
        - "consent_required"
        - "notice_required"
        - "termination_right"
        - "mixed"
        - "not_specified"
        - "unclear"

    - name: "reason"
      type: "string"
      presentation: "diagnostic"
      description: "Краткое обоснование"
      display_in_grid: false

  store_payload: true

  
