id: "termination_consequences"
name: "Последствия расторжения"
description: >
  Анализирует последствия расторжения: судьба авансов и минимальных
  платежей, переходный период (transition), миграция данных,
  конфиденциальная информация, лицензии/IP, перечень survival-положений
  и баланс рисков для Target.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"

rules:
  keyword_mode: any

  keywords:
    high:
      # Последствия расторжения — прямые формулировки
      - "(?i)upon\\s+(termination|expir(y|ation))"
      - "(?i)при\\s+(прекращении|расторжении|истечении)\\s+(действия\\s+)?договора"
      - "(?i)consequences?\\s+of\\s+termination"
      - "(?i)последстви[яи]\\s+расторжени[яи]"
      - "(?i)following\\s+termination"
      - "(?i)после\\s+расторжени[яи]"
      - "(?i)post[-\\s]?termination"

      # Non-refundable / невозвратимые
      - "(?i)non[-\\s]?refundable"
      - "(?i)невозвратим[а-яые]+"
      - "(?i)не\\s+подлежа[тщ]\\s+возврату"
      - "(?i)shall\\s+not\\s+be\\s+(refunded|returned)"
      - "(?i)retain(ed)?\\s+as\\s+(liquidated\\s+damages|penalty)"
      - "(?i)удержива[ею]тся\\s+в\\s+качестве\\s+(неустойк|штраф)"

      # Early termination fee
      - "(?i)early\\s+termination\\s+fee"
      - "(?i)плат[аы]\\s+за\\s+досрочн[а-яое]+\\s+расторжени"
      - "(?i)termination\\s+(fee|charge|penalty)"
      - "(?i)штраф\\s+за\\s+расторжени"
      - "(?i)breakage\\s+(fee|cost)"

      # Survival
      - "(?i)\\bsurviv(e|al|es|ing)\\b"
      - "(?i)сохраня[ею]т\\s+силу"
      - "(?i)продолжа[ею]т\\s+действовать"
      - "(?i)shall\\s+(continue\\s+to\\s+)?remain\\s+in\\s+(full\\s+)?force"
      - "(?i)остаётся\\s+в\\s+силе"

    medium:
      # Авансы и минимальные платежи
      - "(?i)\\bаванс[а-я]*\\b"
      - "(?i)\\badvance\\s+payment"
      - "(?i)\\bprepayment\\b"
      - "(?i)предоплат"
      - "(?i)minimum\\s+(commitment|payment|fee)"
      - "(?i)минимальн[а-яый]+\\s+(платёж|платеж|обязательств)"
      - "(?i)за\\s+вычетом"
      - "(?i)less\\s+(any\\s+)?deductions?"

      # Переходный период / transition
      - "(?i)transition\\s+(period|plan|service|assistance)"
      - "(?i)переходн[а-яый]+\\s+период"
      - "(?i)migration\\s+(period|plan|assistance)"
      - "(?i)миграци[яию]\\s+(данных|систем)"
      - "(?i)wind[-\\s]?down\\s+period"
      - "(?i)data\\s+(export|migration|portability|return)"
      - "(?i)экспорт\\s+данных"
      - "(?i)возврат\\s+данных"

      # Конфиденциальность после расторжения
      - "(?i)confidential(ity)?\\s+[\\s\\S]{0,40}(surviv|terminat|expir|continu)"
      - "(?i)конфиденциальност[ьи]\\s+[\\s\\S]{0,40}(сохраня|продолжа|после\\s+расторж)"
      - "(?i)return\\s+[\\s\\S]{0,20}confidential"
      - "(?i)возврат[\\s\\S]{0,20}конфиденциальн"
      - "(?i)destroy\\s+[\\s\\S]{0,20}confidential"
      - "(?i)уничтожени[ея]\\s+[\\s\\S]{0,20}конфиденциальн"

      # IP / лицензии после расторжения
      - "(?i)(licen[cs]e|IP|intellectual\\s+property)\\s+[\\s\\S]{0,40}(terminat|expir|ceas|revok)"
      - "(?i)(лицензи|IP|интеллектуальн)[\\s\\S]{0,40}(прекращ|истек|аннулир|отзыв)"
      - "(?i)perpetual\\s+licen[cs]e"
      - "(?i)бессрочн[а-яая]+\\s+лицензи"
      - "(?i)(licen[cs]e|right)\\s+[\\s\\S]{0,30}surviv"

      # Обязательства по возврату
      - "(?i)return\\s+(all\\s+)?(materials?|documents?|equipment|property)"
      - "(?i)возврат\\s+(всех\\s+)?(материал|документ|оборудовани|имуществ)"

    low:
      # Общие ссылки на расторжение
      - "(?i)terminat"
      - "(?i)расторжени"
      - "(?i)прекращени"
      - "(?i)expir(y|ation)"
      - "(?i)истечени"

      # Общие ссылки на платежи
      - "(?i)payment"
      - "(?i)платёж"
      - "(?i)платеж"
      - "(?i)refund"
      - "(?i)возврат"

      # Общие ссылки на обязательства
      - "(?i)obligation"
      - "(?i)обязательств"
      - "(?i)liability"
      - "(?i)ответственност"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 640

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  context_k: 5
  max_chunks: 10
  boost_keywords:
    - "upon termination"
    - "при расторжении"
    - "последствия расторжения"
    - "consequences of termination"
    - "post-termination"
    - "non-refundable"
    - "невозвратимый"
    - "early termination fee"
    - "minimum commitment"
    - "минимальные платежи"
    - "survive"
    - "survival"
    - "сохраняют силу"
    - "transition period"
    - "переходный период"
    - "data migration"
    - "миграция данных"
    - "data export"
    - "return confidential"
    - "возврат конфиденциальной"
    - "perpetual license"
    - "license termination"
    - "wind-down"
  rerank: true
  filters: {}

conditional: null

extraction:
  llm_prompt_extraction: |
    <role>
    Ты — юрист по коммерческим договорам.
    Твоя специализация — последствия расторжения, выживающие
    обязательства (survival), переходные периоды (transition),
    судьба платежей, данных, IP и конфиденциальной информации
    после прекращения договора.
    </role>

    <context>
    Ниже приведены фрагменты договора с возможными положениями
    о последствиях расторжения:

    {context}
    </context>

    <instructions>
    Проведи анализ по шагам. Каждый шаг логически соответствует одному
    или нескольким полям итоговой оценки риска.

    Шаг 1 — СУДЬБА АВАНСОВ И МИНИМАЛЬНЫХ ПЛАТЕЖЕЙ
    (используется для заполнения поля "payments_treatment"):
    - Определи, что происходит с авансовыми и минимальными
      платежами при расторжении:
      * подлежат ли возврату (полностью или частично);
      * обозначены ли как non-refundable / невозвратимые;
      * удерживаются ли как неустойка / liquidated damages;
      * различается ли режим при виновном и безвиновном
        расторжении.
    - Оцени условия для Target:
      * "favorable" — возврат неиспользованной части,
        или pro-rata refund;
      * "unfavorable" — крупные невозвратимые суммы,
        удержание как penalty, early termination fee;
      * "unclear" — невозможно определить.

    Шаг 2 — EARLY TERMINATION FEE
    (используется для заполнения поля "has_early_termination_fee"):
    - Определи, предусмотрена ли отдельная плата за досрочное
      расторжение (early termination fee / breakage fee):
      * "yes" — прямо предусмотрена;
      * "no" — не предусмотрена;
      * "unclear" — невозможно определить.

    Шаг 3 — ПЕРЕХОДНЫЙ ПЕРИОД (TRANSITION)
    (используется для заполнения поля "has_transition_period"):
    - Определи, предусмотрен ли переходный период после
      расторжения:
      * transition services / assistance;
      * wind-down period;
      * период для миграции данных/систем;
      * период для завершения текущих проектов.
    - Сформулируй вывод: "yes" / "no" / "unclear".

    Шаг 4 — КОНФИДЕНЦИАЛЬНОСТЬ ПОСЛЕ РАСТОРЖЕНИЯ
    (используется для заполнения поля "confidentiality_survival"):
    - Определи, как регулируется конфиденциальность после
      расторжения:
      * "none" — survival нет;
      * "yes" — более 2 лет или бессрочно;
      * "unclear" — невозможно оценить.

    Шаг 5 — RED FLAGS
    (используется для заполнения поля "red_flags"):
    - Оцени наличие следующих рисковых факторов:

      * «TERM5» — Невозвратимые крупные авансы/минимальные
        платежи при досрочном расторжении. Признаки:
        - payments_treatment = "unfavorable";
        - формулировки "non-refundable", "retained as penalty",
          "early termination fee";
        - Target теряет значительные суммы при выходе
          из договора.

      * «TERM6» — Прекращение ключевых лицензий/IP без
        разумного переходного периода. Признаки:
        - ip_license_survival = "terminated";
        - has_transition_period = "no";
        - для IT/SaaS-договоров это критично:
          Target теряет доступ к системам/данным немедленно.

      * «TERM7» — Чрезмерно широкий перечень survival-
        обязательств, создающий долгосрочные ограничения
        для Target. Признаки:
        - surviving_obligations_list содержит широкие
          обязательства (non-compete, extensive indemnity,
          бессрочные платежи);
        - при этом аналогичные survival-обязательства
          контрагента минимальны;
        - Target де-факто остаётся связана обязательствами
          надолго после расторжения.

    - Если условия расторжения сбалансированы (разумный
      возврат платежей, переходный период, стандартный
      survival) — верни "NONE".
    - Если данных недостаточно для оценки — верни "UNCLEAR".
    - Формат: один или несколько кодов через запятую
      ("TERM5", "TERM6", "TERM5, TERM6, TERM7"),
      "NONE" или "UNCLEAR".
      Без комментариев в этом поле — всё объясняющее в reason.

    Шаг 6 — ОБОСНОВАНИЕ
    (используется для заполнения поля "reason"):

    - В "reason" кратко обоснуй вывод:
      * ссылайся на ключевые формулировки (по возможности
        с короткими цитатами);
      * поясни, какие именно последствия расторжения
        создают основной риск для Target;
      * если выставлены red_flags — объясни, почему именно
        эти коды.
    </instructions>

    <edge_cases>
    Обрабатывай пограничные ситуации так:

    - Крупные авансы/минимальные платежи как non-refundable
      при расторжении по инициативе Target:
      payments_treatment = "unfavorable";
      ставь TERM5; overall_risk_level = "high".

    - Конфиденциальность и IP-ограничения бессрочны
      и охватывают широкий круг информации без carve-out:
      confidentiality_survival = "long";
      ip_license_survival = "long" (если ограничения);
      overall_risk_level ≥ "medium".

    - Лицензии/IP прекращаются немедленно без transition
      period (для IT/SaaS-договоров):
      ip_license_survival = "terminated";
      has_transition_period = "no";
      ставь TERM6; overall_risk_level = "high".

    - Предусмотрен разумный transition period (30–90 дней)
      с обязательством поставщика помочь с миграцией данных:
      has_transition_period = "yes";
      data_handling = "export_provided" или "both";
      это снижает риск; не ставь TERM6.

    - Survival-перечень чрезмерно широк (non-compete,
      бессрочные платежи, широкая indemnity)
      при минимальной защите Target:
      ставь TERM7; overall_risk_level = "high".

    - Стандартный survival (конфиденциальность 3–5 лет,
      ограничение ответственности, юрисдикция):
      это типично; red_flags = "NONE";
      overall_risk_level = "low".

    - Non-refundable аванс, но только при расторжении
      по вине Target (breach); при безвиновном
      расторжении — pro-rata refund:
      payments_treatment = "neutral" (дифференцированный
      подход); это стандартно.

    - Текст фрагментарный: упомянуты отдельные аспекты,
      но нет полной картины:
      "unclear" для недостающих полей;
      red_flags = "UNCLEAR";
      overall_risk_level = "medium".

    - Пустые или нерелевантные фрагменты:
      все поля = "unclear";
      red_flags = "UNCLEAR";
      overall_risk_level = "medium".
    </edge_cases>

    <output_expectations>
    На основе твоего анализа отдельный механизм извлечения сформирует
    структурированные поля по заранее заданной схеме. Твоя задача —
    давать чёткие юридические выводы и указывать конкретные формулировки
    из текста, на которых они основаны. Не генерируй JSON —
    просто излагай выводы структурированно и однозначно.
    </output_expectations>

  enabled: true
  mode: "hybrid"
  fields:
    - name: "payments_treatment"
      type: "string"
      allowed_values:
        - "favorable"
        - "unfavorable"
        - "unclear"

    - name: "has_early_termination_fee"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "has_transition_period"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "confidentiality_survival"
      type: "string"
      allowed_values:
        - "none"
        - "short"
        - "standard"
        - "long"
        - "unclear"

    - name: "red_flags"
      type: "string"

    - name: "reason"
      type: "string"

  store_payload: true

red_flags:
  items:
    - code: "TERM5"
      description: "Невозвратимые крупные авансы/минимальные платежи или early termination fee при досрочном расторжении."
    - code: "TERM6"
      description: "Прекращение ключевых лицензий/IP без разумного переходного периода — потеря доступа к системам/данным."
    - code: "TERM7"
      description: "Чрезмерно широкий перечень survival-обязательств."