id: "termination_consequences"
name: "Последствия расторжения"
description: >
  Анализирует последствия расторжения: судьба авансов и минимальных
  платежей (возврат / невозвратимые / early termination fee),
  наличие переходного периода (transition), условия возврата данных,
  судьба IP / лицензий, перечень survival-положений и баланс рисков
  для Target.

  Формирует краткий user-facing вывод.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"
ui_mode: "field_extraction"

rules:
  keyword_mode: any

  keywords:
    high:
      # Последствия расторжения — прямые формулировки
      - "(?i)upon\\s+(termination|expir(y|ation))"
      - "(?i)при\\s+(прекращении|расторжении|истечении)\\s+(действия\\s+)?договора"
      - "(?i)consequences?\\s+of\\s+termination"
      - "(?i)последстви[яи]\\s+расторжени[яи]"
      - "(?i)following\\s+termination"
      - "(?i)after\\s+termination"
      - "(?i)после\\s+расторжени[яи]"
      - "(?i)post[-\\s]?termination"

      # Non-refundable / невозвратимые
      - "(?i)non[-\\s]?refundable"
      - "(?i)невозвратим[а-яые]+"
      - "(?i)не\\s+подлежа[тщ]\\s+возврату"
      - "(?i)shall\\s+not\\s+be\\s+(refunded|returned)"
      - "(?i)retain(ed)?\\s+as\\s+(liquidated\\s+damages|penalty)"
      - "(?i)удержива[ею]тся\\s+в\\s+качестве\\s+(неустойк|штраф)"

      # Early termination fee
      - "(?i)early\\s+termination\\s+fee"
      - "(?i)плат[аы]\\s+за\\s+досрочн[а-яое]+\\s+расторжени"
      - "(?i)termination\\s+(fee|charge|penalty)"
      - "(?i)breakage\\s+(fee|cost)"

      # Survival
      - "(?i)\\bsurviv(e|al|es|ing)\\b"
      - "(?i)сохраня[ею]т\\s+силу"
      - "(?i)shall\\s+(continue\\s+to\\s+)?remain\\s+in\\s+(full\\s+)?force"

    medium:
      # Авансы и минимальные платежи
      - "(?i)advance\\s+payment[\\s\\S]{0,30}(terminat|refund|return)"
      - "(?i)prepayment[\\s\\S]{0,30}(terminat|refund|return)"
      - "(?i)аванс[а-я]*[\\s\\S]{0,30}(расторж|возврат)"
      - "(?i)minimum\\s+(commitment|payment)[\\s\\S]{0,30}terminat"
      - "(?i)минимальн[а-яый]+\\s+(платёж|обязательств)[\\s\\S]{0,30}расторж"

      # Переходный период
      - "(?i)transition\\s+(period|plan|service|assistance)"
      - "(?i)переходн[а-яый]+\\s+период"
      - "(?i)wind[-\\s]?down\\s+period"
      - "(?i)data\\s+(export|migration|portability|return)[\\s\\S]{0,20}terminat"
      - "(?i)экспорт\\s+данных[\\s\\S]{0,20}(расторж|прекращ)"
      - "(?i)возврат\\s+данных[\\s\\S]{0,20}(расторж|прекращ)"

      # Конфиденциальность после расторжения
      - "(?i)confidential(ity)?[\\s\\S]{0,40}(surviv|terminat|continu)"
      - "(?i)конфиденциальност[ьи][\\s\\S]{0,40}(сохраня|продолжа|после\\s+расторж)"
      - "(?i)return\\s+[\\s\\S]{0,20}confidential"
      - "(?i)destroy\\s+[\\s\\S]{0,20}confidential"

      # IP / лицензии после расторжения
      - "(?i)(licen[cs]e|IP)[\\s\\S]{0,40}(terminat|expir|ceas|revok)"
      - "(?i)лицензи[яи][\\s\\S]{0,40}(прекращ|истек|аннулир|отзыв)"
      - "(?i)perpetual\\s+licen[cs]e[\\s\\S]{0,20}(surviv|terminat)"
      - "(?i)бессрочн[а-яая]+\\s+лицензи[\\s\\S]{0,20}(сохраня|расторж)"

    low:
      - "(?i)upon\\s+termination"
      - "(?i)post[-\\s]?termination"
      - "(?i)non[-\\s]?refundable"
      - "(?i)early\\s+termination\\s+fee"
      - "(?i)surviv(e|al)"
      - "(?i)сохраняют\\s+силу"
      - "(?i)transition\\s+period"
      - "(?i)переходный\\s+период"
      - "(?i)при\\s+расторжении"
      - "(?i)последствия\\s+расторжения"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 640

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  context_k: 5
  max_chunks: 10
  boost_keywords:
    - "upon termination"
    - "при расторжении"
    - "последствия расторжения"
    - "consequences of termination"
    - "post-termination"
    - "non-refundable"
    - "невозвратимый"
    - "early termination fee"
    - "плата за досрочное расторжение"
    - "survive"
    - "survival"
    - "сохраняют силу"
    - "transition period"
    - "переходный период"
    - "data migration"
    - "миграция данных"
    - "data export"
    - "return confidential"
    - "возврат конфиденциальной"
    - "license termination"
    - "perpetual license"
    - "wind-down"
  rerank: true
  filters: {}

conditional: null

enrichment_hints:
  preferred_segment_types:
    - "contract"
    - "amendment"
    - "annex"
  excluded_segment_types:
    - "technical_specification"
    - "price_list"
    - "invoice"
    - "act"
    - "schedule"
  preferred_clause_functions:
    - "termination"
    - "confidentiality"
    - "intellectual_property"
  confidence_bonus_on_match: 0.10
  confidence_penalty_on_excluded_segment: 0.15

extraction:
  enabled: true
  mode: "hybrid"
  llm_max_tokens: 440
  llm_prompt_extraction: |
    <role>
    Ты — юрист по коммерческим договорам.
    Твоя задача — точно извлечь из текста последствия расторжения:
    1) судьба авансов и минимальных платежей;
    2) early termination fee;
    3) переходный период и возврат данных;
    4) судьба IP / лицензий;
    5) конфиденциальность после расторжения.
    </role>

    <context>
    Ниже приведены релевантные фрагменты договора:

    {context}
    </context>

    <task>
    Заполни только следующие поля:
    - termination_consequences_display
    - payments_treatment
    - has_early_termination_fee
    - has_transition_period
    - transition_period_value
    - data_handling_after_termination
    - ip_license_survival
    - confidentiality_survival
    - red_flags
    - reason

    Важно:
    - не придумывай данные если их нет в тексте;
    - пиши user-facing значения коротко и по-русски.
    </task>

    <instructions>
    Шаг 1 — СУДЬБА АВАНСОВ И МИНИМАЛЬНЫХ ПЛАТЕЖЕЙ

    Заполни поле "payments_treatment".

    Значения:
    - "favorable" — возврат неиспользованной части или
      pro-rata refund при расторжении.
    - "unfavorable" — non-refundable, удержание как penalty,
      крупные невозвратимые суммы.
    - "neutral" — дифференцированный подход: зависит от причины
      расторжения (виновное / безвиновное).
    - "not_addressed" — вопрос не урегулирован.
    - "unclear" — неясно.

    Шаг 2 — EARLY TERMINATION FEE

    Заполни поле "has_early_termination_fee".

    Значения:
    - "yes" — прямо предусмотрена отдельная плата.
    - "no" — не предусмотрена.
    - "unclear" — неясно.

    Шаг 3 — ПЕРЕХОДНЫЙ ПЕРИОД

    Заполни поля "has_transition_period"
    и "transition_period_value".

    Значения для has_transition_period:
    - "yes" — transition services / wind-down / migration period.
    - "no" — не предусмотрен.
    - "unclear" — неясно.

    Для transition_period_value:
    - Если есть: "30 дней", "90 дней", "до миграции данных"
    - Если нет: "Не применимо"
    - Если неясно: "Не удалось определить"

    Шаг 4 — ВОЗВРАТ ДАННЫХ ПОСЛЕ РАСТОРЖЕНИЯ

    Заполни поле "data_handling_after_termination".

    Значения:
    - "export_provided" — явно предусмотрен экспорт /
      возврат данных клиенту.
    - "deletion_only" — данные удаляются без возможности
      экспорта.
    - "both" — и экспорт, и удаление предусмотрены.
    - "not_addressed" — не урегулировано.
    - "unclear" — неясно.

    Шаг 5 — СУДЬБА IP / ЛИЦЕНЗИЙ

    Заполни поле "ip_license_survival".

    Значения:
    - "terminated_immediately" — лицензии / IP прекращаются
      немедленно при расторжении.
    - "terminated_with_transition" — прекращаются, но после
      разумного transition period.
    - "perpetual" — лицензии сохраняются бессрочно.
    - "not_addressed" — не урегулировано.
    - "unclear" — неясно.

    Шаг 6 — КОНФИДЕНЦИАЛЬНОСТЬ ПОСЛЕ РАСТОРЖЕНИЯ

    Заполни поле "confidentiality_survival".

    Значения:
    - "none" — survival нет.
    - "short" — до 1 года.
    - "standard" — 1–3 года.
    - "long" — более 3 лет или бессрочно.
    - "unclear" — неясно.

    Шаг 7 — RED FLAGS

    Заполни поле "red_flags".

    Используй:
    - "NONE" — сбалансированные условия расторжения.
    - "UNCLEAR" — данных недостаточно.
    - Коды через запятую:
      * TERM5 — невозвратимые крупные авансы / early
        termination fee при досрочном расторжении.
      * TERM6 — прекращение ключевых лицензий / IP без
        разумного переходного периода (ip_license_survival =
        "terminated_immediately" + has_transition_period = "no").
      * TERM7 — чрезмерно широкий перечень survival-обязательств,
        создающий долгосрочные ограничения для Target.

    Шаг 8 — USER-FACING SUMMARY

    Заполни поле "termination_consequences_display".

    Примеры:
    - "Авансы не возвращаются; нет transition; лицензии
       прекращаются немедленно"
    - "Авансы pro-rata; transition 30 дней; данные экспортируются;
       конфиденциальность 3 года"
    - "Early termination fee; нет transition; лицензии бессрочные"
    - "Последствия расторжения не урегулированы"

    Правила:
    - Отрази максимум 3–4 ключевых факта через ";".
    - Если не урегулировано: "Последствия расторжения не урегулированы"
    - Если всё unclear: "Не удалось определить последствия расторжения"

    Шаг 9 — ОБОСНОВАНИЕ

    Заполни поле "reason".

    Правила:
    - 1–2 коротких предложения.
    - Укажи: платежи, переходный период, IP, конфиденциальность,
      почему red_flags.
    - Приведи короткую цитату в кавычках.
    - Если NONE — почему условия сбалансированы.
    </instructions>

    <edge_cases>
    - Non-refundable авансы + нет transition:
      * payments_treatment = "unfavorable"
      * has_transition_period = "no"
      * red_flags включает "TERM5"

    - Лицензии прекращаются немедленно, нет transition (SaaS):
      * ip_license_survival = "terminated_immediately"
      * has_transition_period = "no"
      * red_flags включает "TERM6"

    - Transition 30 дней + export данных предусмотрен:
      * has_transition_period = "yes"
      * data_handling_after_termination = "export_provided"
      * red_flags не включает "TERM6"

    - Non-refundable только при виновном расторжении:
      * payments_treatment = "neutral"
      * в reason: дифференцированный подход

    - Стандартный survival (конфиденциальность 3 года, liability
      cap, юрисдикция):
      * red_flags = "NONE"

    - Не урегулировано:
      * payments_treatment = "not_addressed"
      * has_transition_period = "unclear"
      * termination_consequences_display =
        "Последствия расторжения не урегулированы"
    </edge_cases>

    <output_expectations>
    Все значения должны быть короткими, точными и пригодными
    для отображения пользователю в DD Grid.
    Не добавляй никаких полей, кроме указанных в схеме extraction.
    </output_expectations>

  fields:
    - name: "termination_consequences_display"
      type: "string"
      description: "Последствия расторжения: краткий вывод"

    - name: "payments_treatment"
      type: "string"
      description: "Судьба авансов и минимальных платежей"
      allowed_values:
        - "favorable"
        - "unfavorable"
        - "neutral"
        - "not_addressed"
        - "unclear"

    - name: "has_early_termination_fee"
      type: "string"
      description: "Early termination fee"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "has_transition_period"
      type: "string"
      description: "Переходный период"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "transition_period_value"
      type: "string"
      description: "Длительность переходного периода"

    - name: "data_handling_after_termination"
      type: "string"
      description: "Обращение с данными после расторжения"
      allowed_values:
        - "export_provided"
        - "deletion_only"
        - "both"
        - "not_addressed"
        - "unclear"

    - name: "ip_license_survival"
      type: "string"
      description: "Судьба IP / лицензий после расторжения"
      allowed_values:
        - "terminated_immediately"
        - "terminated_with_transition"
        - "perpetual"
        - "not_addressed"
        - "unclear"

    - name: "confidentiality_survival"
      type: "string"
      description: "Конфиденциальность после расторжения"
      allowed_values:
        - "none"
        - "short"
        - "standard"
        - "long"
        - "unclear"

    - name: "red_flags"
      type: "string"
      description: "Коды рисков"

    - name: "reason"
      type: "string"
      description: "Обоснование"

  store_payload: true

  