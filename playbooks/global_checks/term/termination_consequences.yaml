id: "termination_consequences"
name: "Последствия расторжения"
description: >
  Анализирует последствия расторжения: судьба авансов и минимальных платежей,
  конфиденциальной информации, лицензий/IP, survival-положения.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"

rules:
  keywords:
    - "при прекращении действия договора"
    - "последствия расторжения"
    - "upon termination"
    - "upon expiry"
    - "за вычетом"
    - "невозвратимый аванс"
    - "non-refundable"
    - "минимальные платежи"
    - "minimum commitment"
    - "survive"
    - "survival"
    - "сохраняют силу"
    - "конфиденциальная информация"
    - "intellectual property"
    - "license"
  keyword_mode: "any"
  regex_patterns: []
  clause_patterns: []

llm:
  prompt_template: |
    <role>
    Ты — юрист по коммерческим договорам.
    Твоя специализация — последствия расторжения и выживающие обязательства.
    </role>

    <context>
    Ниже приведены фрагменты договора:

    {context}
    </context>

    <instructions>
    Определи, что происходит при расторжении/истечении договора, и оцени риски для Target:

    1) Судьба авансов и минимальных платежей (advance_and_minimum_payments_treatment):
       - подлежат ли авансы и минимальные платежи возврату при досрочном расторжении;
       - указано ли, что они non-refundable / невозвратимы / удерживаются как penalty;
       - различается ли режим при виновном и безвиновном расторжении.
       Оцени как:
       - favorable — условия выгодны для Target (например, возврат неиспользованной части аванса);
       - neutral — стандартный/сбалансированный подход;
       - unfavorable — крупные невозвратимые суммы, удержание как неустойка и т.п.;
       - unclear — если из фрагментов непонятно.

    2) Судьба конфиденциальной информации (confidentiality_survival):
       - подлежит ли конфиденциальная информация возврату/уничтожению;
       - сохраняется ли обязанность конфиденциальности после расторжения и на какой срок.
       Классифицируй:
       - none — survival нет, конфиденциальность формально не действует после расторжения;
       - short — короткий срок (например, менее 2 лет);
       - standard — типичный срок (3–5 лет или "до раскрытия/публичности");
       - long — очень длительный или бессрочный срок;
       - unclear — если невозможно оценить.

    3) Судьба лицензий и IP (ip_and_license_survival):
       - прекращаются ли лицензии/права использования немедленно или есть переходный период;
       - предусмотрен ли post-termination period для миграции/экспорта данных/софта;
       - есть ли perpetual лицензии, которые не прекращаются.
       Классифицируй аналогично: none / short / standard / long / unclear, исходя из того,
       как долго сохраняются или продолжают действовать права/ограничения по IP/лицензиям.

    4) Другие выживающие обязательства (other_surviving_obligations):
       - какие ещё положения прямо указаны как сохраняющие силу после расторжения:
         * платежные обязательства (deferred fees, неустойки),
         * ограничения ответственности,
         * R&W, indemnity,
         * комплаенс, антикоррупция, санкции,
         * юрисдикция, применимое право, разрешение споров и т.п.
       Кратко перечисли их в одной строке.

    5) Оцени общий риск (overall_risk_level: low / medium / high):
       - учитывая сочетание:
         * режим авансов/минимальных платежей,
         * продолжительность и жёсткость конфиденциальности и IP‑ограничений,
         * объём других survival‑положений.
    </instructions>

    <edge_cases>
    ВАЖНО — пограничные случаи:

    — Если крупные авансы и минимальные платежи прямо обозначены как non-refundable
      при расторжении по инициативе Target (или независимо от причин):
      advance_and_minimum_payments_treatment = "unfavorable",
      overall_risk_level часто "high".

    — Если конфиденциальность и IP‑ограничения фактически бессрочны и охватывают
      широкий круг информации/результатов без carve-out:
      confidentiality_survival и/или ip_and_license_survival = "long",
      риск может быть "medium" или "high" в зависимости от бизнеса Target.

    — Если лицензии/IP прекращаются немедленно при расторжении без разумного
      переходного периода (например, для миграции данных/систем):
      ip_and_license_survival = "none" или "short",
      overall_risk_level повышается, особенно для ИТ-/SaaS‑договоров.

    — Если survival‑перечень чрезмерно широк (сохраняются ограничения ответственности,
      штрафы, односторонние права контрагента и т.п.) при минимальной защите Target:
      отрази это в other_surviving_obligations и учитывай в risk.

    — Если текст фрагментарный: упомянуты только отдельные аспекты (например,
      конфиденциальность), но нет данных по авансам/IP:
      ставь "unclear" по недостающим полям и в reason прямо укажи,
      какая информация отсутствует.

    — Пустые или нерелевантные фрагменты:
      большинство полей = "unclear" или пустые строки,
      overall_risk_level = "medium",
      reason = "Недостаточно данных для анализа последствий расторжения и survival-положений."
    </edge_cases>

    <examples>
    ПРИМЕР 1 — ВОЗВРАТ НЕИСПОЛЬЗОВАННОГО АВАНСА, СТАНДАРТНЫЙ SURVIVAL (LOW/MEDIUM):

    Фрагмент: "В случае досрочного расторжения по инициативе Клиента Поставщик
    возвращает неиспользованную часть аванса за вычетом фактически понесенных
    расходов. Обязанности по конфиденциальности и использованию интеллектуальной
    собственности Сторон сохраняют силу в течение 3 лет после расторжения.
    Положения о применимом праве и разрешении споров также сохраняют силу."

    {{
      "advance_and_minimum_payments_treatment": "favorable",
      "confidentiality_survival": "standard",
      "ip_and_license_survival": "standard",
      "other_surviving_obligations": "Применимое право, разрешение споров.",
      "overall_risk_level": "medium",
      "reason": "Неиспользованная часть аванса возвращается, конфиденциальность и IP действуют 3 года, survival охватывает только стандартные положения, риск для Target умеренный."
    }}

    ПРИМЕР 2 — НЕВОЗВРАТИМЫЕ МИНИМАЛЬНЫЕ ПЛАТЕЖИ, ЖЁСТКИЙ IP (HIGH):

    Фрагмент: "Все уплаченные Клиентом авансовые и минимальные платежи являются
    невозвратимыми независимо от причин расторжения. По прекращении Договора
    все лицензии на Программное обеспечение немедленно прекращаются, и Клиент
    обязан прекратить любое его использование. Обязанности по конфиденциальности
    и запрету обратной разработки действуют бессрочно."

    {{
      "advance_and_minimum_payments_treatment": "unfavorable",
      "confidentiality_survival": "long",
      "ip_and_license_survival": "none",
      "other_surviving_obligations": "Запрет обратной разработки (reverse engineering).",
      "overall_risk_level": "high",
      "reason": "Крупные авансы и минимальные платежи невозвратимы, лицензии прекращаются немедленно, а конфиденциальность и запреты по IP действуют бессрочно, что создаёт высокий риск для Target."
    }}

    ПРИМЕР 3 — ЧАСТИЧНОЕ SURVIVAL БЕЗ ЯСНОСТИ ПО АВАНСАМ (MEDIUM):

    Фрагмент: "По прекращении настоящего Договора Стороны обязуются уничтожить
    конфиденциальную информацию другой Стороны или вернуть ее по требованию.
    Обязанность по конфиденциальности сохраняет силу в течение 2 лет после
    расторжения. Иные положения Договора прекращают свое действие."

    {{
      "advance_and_minimum_payments_treatment": "unclear",
      "confidentiality_survival": "short",
      "ip_and_license_survival": "unclear",
      "other_surviving_obligations": "Только конфиденциальность (2 года).",
      "overall_risk_level": "medium",
      "reason": "Ясно прописан ограниченный по сроку survival конфиденциальности, но отсутствуют данные о судьбе авансов, минимальных платежей и лицензий, что оставляет часть рисков неопределёнными."
    }}
    </examples>

    <output_format>
    Твой ответ ДОЛЖЕН быть строго валидным JSON-объектом со следующими
    полями:

    {{
      "advance_and_minimum_payments_treatment": "one of: favorable | neutral | unfavorable | unclear",
      "confidentiality_survival": "one of: none | short | standard | long | unclear",
      "ip_and_license_survival": "one of: none | short | standard | long | unclear",
      "other_surviving_obligations": "string — краткое перечисление иных выживающих положений или пустая строка",
      "overall_risk_level": "one of: low | medium | high",
      "reason": "string — краткое объяснение на русском с указанием ключевых формулировок о последствиях расторжения и их влияния на риск для Target"
    }}

    Все перечисленные поля ДОЛЖНЫ присутствовать в JSON, даже если их значение равно null или пустой строке.
    </output_format>

    <constraints>
    ЖЁСТКИЕ ПРАВИЛА:
    1. Выведи ТОЛЬКО один JSON-объект. Никакого текста до или после.
    2. Не пиши "Вот JSON", "Here is the JSON" и т.п.
    3. Не используй Markdown, бэктики ``` или любые обёртки.
    4. Все строки — в двойных кавычках.
    5. Значения перечислимых полей — СТРОГО из указанных вариантов.
    6. Ключи — точно как указано, без добавления новых.
    7. Поле "reason" ДОЛЖНО содержать конкретные формулировки из фрагментов
       и вывод по рискам, а не общие фразы вроде "есть риски".
    8. Начни ответ сразу с символа {{
    9. Если по какому‑то полю нет достаточно информации —
       используй 'unclear' или пустую строку для текстовых полей; reason
       не может быть пустым. НЕ придумывай значения, не интерполируй.
    </constraints>
  prompt_file: null
  context_k: 4
  temperature: 0.0
  max_tokens: 512

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  context_k: 4
  max_chunks: 8
  boost_keywords:
    - "upon termination"
    - "при прекращении действия"
    - "non-refundable"
    - "минимальные платежи"
    - "survive"
    - "сохраняют силу"
  rerank: true
  filters: {}

conditional: null

extraction:
  enabled: true
  mode: "hybrid"
  fields:
    - name: "advance_and_minimum_payments_treatment"
      type: "string"
      allowed_values:
        - "favorable"
        - "neutral"
        - "unfavorable"
        - "unclear"
    - name: "confidentiality_survival"
      type: "string"
      allowed_values:
        - "none"
        - "short"
        - "standard"
        - "long"
        - "unclear"
    - name: "ip_and_license_survival"
      type: "string"
      allowed_values:
        - "none"
        - "short"
        - "standard"
        - "long"
        - "unclear"
    - name: "other_surviving_obligations"
      type: "string"
    - name: "overall_risk_level"
      type: "string"
      allowed_values:
        - "low"
        - "medium"
        - "high"
    - name: "reason"
      type: "string"
  store_payload: true

red_flags:
  items:
    - code: "TERM5"
      description: "Невозвратимые крупные авансы/минимальные платежи при раннем расторжении."
    - code: "TERM6"
      description: "Прекращение ключевых лицензий/IP без разумного переходного периода."