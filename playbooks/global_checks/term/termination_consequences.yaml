id: "termination_consequences"
name: "Последствия расторжения"
group: "Terms"
description: >
  Анализирует последствия расторжения: судьба авансов и минимальных
  платежей (возврат / невозвратимые / early termination fee),
  наличие переходного периода (transition), условия возврата данных,
  судьба IP / лицензий, перечень survival-положений и баланс рисков
  для Target.

  Формирует краткий user-facing вывод.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"
ui_mode: "field_extraction"

rules:
  keyword_mode: any

  keywords:
    high:
      - "(?i)upon\\s+(termination|expir(y|ation))"
      - "(?i)при\\s+(прекращении|расторжении|истечении)\\s+(действия\\s+)?договора"
      - "(?i)consequences?\\s+of\\s+termination"
      - "(?i)последстви[яи]\\s+расторжени[яи]"
      - "(?i)following\\s+termination"
      - "(?i)after\\s+termination"
      - "(?i)после\\s+расторжени[яи]"
      - "(?i)post[-\\s]?termination"
      - "(?i)non[-\\s]?refundable"
      - "(?i)невозвратим[а-яые]+"
      - "(?i)не\\s+подлежа[тщ]\\s+возврату"
      - "(?i)shall\\s+not\\s+be\\s+(refunded|returned)"
      - "(?i)retain(ed)?\\s+as\\s+(liquidated\\s+damages|penalty)"
      - "(?i)удержива[ею]тся\\s+в\\s+качестве\\s+(неустойк|штраф)"
      - "(?i)early\\s+termination\\s+fee"
      - "(?i)плат[аы]\\s+за\\s+досрочн[а-яое]+\\s+расторжени"
      - "(?i)termination\\s+(fee|charge|penalty)"
      - "(?i)breakage\\s+(fee|cost)"
      - "(?i)\\bsurviv(e|al|es|ing)\\b"
      - "(?i)сохраня[ею]т\\s+силу"
      - "(?i)shall\\s+(continue\\s+to\\s+)?remain\\s+in\\s+(full\\s+)?force"

    medium:
      - "(?i)advance\\s+payment[\\s\\S]{0,30}(terminat|refund|return)"
      - "(?i)prepayment[\\s\\S]{0,30}(terminat|refund|return)"
      - "(?i)аванс[а-я]*[\\s\\S]{0,30}(расторж|возврат)"
      - "(?i)minimum\\s+(commitment|payment)[\\s\\S]{0,30}terminat"
      - "(?i)минимальн[а-яый]+\\s+(платёж|обязательств)[\\s\\S]{0,30}расторж"
      - "(?i)transition\\s+(period|plan|service|assistance)"
      - "(?i)переходн[а-яый]+\\s+период"
      - "(?i)wind[-\\s]?down\\s+period"
      - "(?i)data\\s+(export|migration|portability|return)[\\s\\S]{0,20}terminat"
      - "(?i)экспорт\\s+данных[\\s\\S]{0,20}(расторж|прекращ)"
      - "(?i)возврат\\s+данных[\\s\\S]{0,20}(расторж|прекращ)"
      - "(?i)confidential(ity)?[\\s\\S]{0,40}(surviv|terminat|continu)"
      - "(?i)конфиденциальност[ьи][\\s\\S]{0,40}(сохраня|продолжа|после\\s+расторж)"
      - "(?i)return\\s+[\\s\\S]{0,20}confidential"
      - "(?i)destroy\\s+[\\s\\S]{0,20}confidential"
      - "(?i)(licen[cs]e|IP)[\\s\\S]{0,40}(terminat|expir|ceas|revok)"
      - "(?i)лицензи[яи][\\s\\S]{0,40}(прекращ|истек|аннулир|отзыв)"
      - "(?i)perpetual\\s+licen[cs]e[\\s\\S]{0,20}(surviv|terminat)"
      - "(?i)бессрочн[а-яая]+\\s+лицензи[\\s\\S]{0,20}(сохраня|расторж)"

    low:
      - "(?i)upon\\s+termination"
      - "(?i)post[-\\s]?termination"
      - "(?i)non[-\\s]?refundable"
      - "(?i)early\\s+termination\\s+fee"
      - "(?i)surviv(e|al)"
      - "(?i)сохраняют\\s+силу"
      - "(?i)transition\\s+period"
      - "(?i)переходный\\s+период"
      - "(?i)при\\s+расторжении"
      - "(?i)последствия\\s+расторжения"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 640

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  retrieval_profile: "termination_check"
  context_k: 5
  max_chunks: 10
  
  retrieval_query: >
    последствия расторжения consequences of termination post-termination возврат аванса 
    non-refundable early termination fee переходный период transition period wind-down 
    судьба данных data export лицензия бессрочная

  boost_keywords:
    - "upon termination"
    - "при расторжении"
    - "последствия расторжения"
    - "consequences of termination"
    - "post-termination"
    - "non-refundable"
    - "невозвратимый"
    - "early termination fee"
    - "плата за досрочное расторжение"
    - "survive"
    - "survival"
    - "сохраняют силу"
    - "transition period"
    - "переходный период"
    - "data migration"
    - "миграция данных"
    - "data export"
    - "return confidential"
    - "возврат конфиденциальной"
    - "license termination"
    - "perpetual license"
    - "wind-down"

  negative_keywords:
    - "гарантийный срок"
    - "форс-мажор"
    - "порядок приемки"
    - "качество товаров"

  preferred_unit_types:
    - "termination_provision"
    - "general_provision"

  excluded_unit_types:
    - "technical_fragment"
    - "appendix_reference"
    - "structural_anchor"

  preferred_clause_functions:
    - "procedures"
    - "obligations"
    - "rights"

  position_bias:
    preferred_range: [0.0, 1.0]
    boost: 0.10
    scope: "segment"

  rerank: true
  filters: {}

conditional: null

enrichment_hints:
  preferred_segment_types:
    - "contract"
    - "amendment"
    - "annex"
  excluded_segment_types:
    - "technical_specification"
    - "price_list"
    - "invoice"
    - "act"
    - "schedule"
  preferred_clause_functions:
    - "procedures"
    - "obligations"
    - "rights"
  confidence_bonus_on_match: 0.10
  confidence_penalty_on_excluded_segment: 0.15

extraction:
  enabled: true
  mode: "hybrid"
  llm_max_tokens: 1350

  presence_signal:
    field: "termination_consequences_status"
    present_values: ["present"]
    missing_values: ["missing"]
    unclear_values: ["unclear"]

  llm_prompt_extraction: |
    <role>
    Ты — юрист по коммерческим договорам.
    Твоя задача — точно извлечь из текста последствия
    расторжения:
    1) есть ли в договоре регулирование последствий расторжения;
    2) если есть — какие условия установлены:
       - судьба авансов и минимальных платежей;
       - early termination fee;
       - переходный период и возврат данных;
       - судьба IP / лицензий;
       - конфиденциальность после расторжения.

    КРИТИЧЕСКИ ВАЖНО:
    - Извлекай ТОЛЬКО то, что прямо написано в тексте.
    - НЕ делай выводов "по умолчанию" из общих норм права.
    - НЕ додумывай данные если их нет в тексте.
    - Если ни один фрагмент не содержит информации о последствиях
      расторжения (нет упоминаний upon termination / post-termination /
      consequences of termination / последствий расторжения) —
      termination_consequences_status = "missing".
    - Если тексты по теме есть, но вывод сделать нельзя —
      termination_consequences_status = "unclear".
    </role>

    <context_rules>
    - Ниже приведены фрагменты, отобранные автоматически.
    - Некоторые фрагменты могут быть нерелевантны —
      игнорируй их.
    - Если среди фрагментов есть противоречия —
      укажи "unclear" и объясни в reason.
    - Не используй информацию из определений (definitions),
      преамбулы или приложений, если они не содержат
      substantive условий по теме check.
    - Если ни один фрагмент не содержит информации о последствиях
      расторжения (нет упоминаний upon termination / post-termination /
      consequences of termination / последствий расторжения) —
      termination_consequences_status = "missing", location = null.
      Не использовать "unclear" при полном отсутствии релевантных
      фрагментов.
    </context_rules>

    <context>
    Ниже приведены релевантные фрагменты договора:

    {context}
    </context>

    <task>
    Заполни только следующие поля:
    - termination_consequences_display
    - termination_consequences_status
    - payments_treatment
    - has_early_termination_fee
    - has_transition_period
    - transition_period_value
    - data_handling_after_termination
    - ip_license_survival
    - confidentiality_survival
    - reason
    </task>

    <location_instructions>
    Для каждого поля по возможности укажи location в формате:
    {"clause_ref": "п. 12.1", "page": 7, "quote": "дословная фраза из договора"}

    Правила:
    - clause_ref — короткая ссылка на пункт / раздел / статью именно в том
      виде, как она написана в договоре;
    - page — целое число страницы;
    - quote — дословная фраза из текста договора (НЕ пересказ, НЕ парафраз).
      Копируй её посимвольно, сохраняя формулировку и порядок слов.
      Оптимальная длина: 30–300 символов.
    - Для synthesized-полей (termination_consequences_display,
      transition_period_value, reason) location ВСЕГДА null.
    - Для termination_consequences_status = "missing" — location = null.
    - Для termination_consequences_status = "present" / "unclear" —
      quote с фразой-основанием.
    - Для payments_treatment, has_early_termination_fee,
      has_transition_period, data_handling_after_termination,
      ip_license_survival, confidentiality_survival:
      * если значение определённое ("favorable" / "yes" /
        "export_provided" / "perpetual" / "standard" и т.п.) —
        quote с фразой-основанием;
      * если "no" / "not_addressed" / "none" — различай: прямое
        исключение (quote обязательна) vs отсутствие упоминания
        (location = null);
      * если "unclear" — location = null.
    - Не выдумывай location или quote. Если дословную фразу определить
      нельзя — location = null.
    </location_instructions>

    <instructions>
    Шаг 0 — НАЛИЧИЕ РЕГУЛИРОВАНИЯ ПОСЛЕДСТВИЙ РАСТОРЖЕНИЯ

    Заполни "termination_consequences_status".

    Значения:
    - "present" — если хотя бы одно содержательное signal-поле
      указывает на наличие информации по теме:
      * payments_treatment ∈ {"favorable", "unfavorable", "neutral"};
      * has_early_termination_fee = "yes";
      * has_transition_period = "yes";
      * data_handling_after_termination ∈ {"export_provided",
        "deletion_only", "both"};
      * ip_license_survival ∈ {"terminated_immediately",
        "terminated_with_transition", "perpetual"};
      * confidentiality_survival ∈ {"none", "short", "standard", "long"};
      * ЛИБО любое поле = "no" / "not_addressed" / "none", но
        с заполненным location с прямой цитатой (см. RF3).
        Учитывается как признак наличия ТОЛЬКО при наличии
        прямой цитаты. Без цитаты "no" не считается сигналом
        наличия.
    - "missing" — если все содержательные поля = "no" /
      "not_addressed" / "none" БЕЗ цитат, ЛИБО фрагментов по теме
      нет вообще.
    - "unclear" — если все содержательные = "unclear" при наличии
      фрагментов, но невозможности вывода.

    Шаг 1 — СУДЬБА АВАНСОВ И ПЛАТЕЖЕЙ

    Заполни "payments_treatment".

    Значения:
    - "favorable" — возврат неиспользованной части или pro-rata refund.
    - "unfavorable" — non-refundable, удержание как penalty.
    - "neutral" — зависит от причины расторжения.
    - "not_addressed" — не урегулировано.
    - "unclear" — неясно.

    Шаг 2 — EARLY TERMINATION FEE

    Заполни "has_early_termination_fee".

    Значения:
    - "yes" — плата за досрочное расторжение предусмотрена.
    - "no" — не предусмотрена.
    - "unclear" — неясно.

    Шаг 3 — ПЕРЕХОДНЫЙ ПЕРИОД

    Заполни "has_transition_period" и "transition_period_value".

    Значения для has_transition_period:
    - "yes" — переходный период предусмотрен.
    - "no" — не предусмотрен.
    - "unclear" — неясно.

    Для transition_period_value:
    - Если указан: "30 дней", "90 дней",
      "до завершения миграции данных".
    - Есть тема, но длительность не указана: "Не указан".
    - Тема не урегулирована: "Не установлено".
    - Нет transition period: "Не применимо".
    - Нельзя определить: "Не удалось определить".

    Шаг 4 — ВОЗВРАТ ДАННЫХ

    Заполни "data_handling_after_termination".

    Значения:
    - "export_provided" — явно предусмотрен экспорт / возврат.
    - "deletion_only" — только удаление без экспорта.
    - "both" — и экспорт, и удаление.
    - "not_addressed" — не урегулировано.
    - "unclear" — неясно.

    Шаг 5 — СУДЬБА IP / ЛИЦЕНЗИЙ

    Заполни "ip_license_survival".

    Значения:
    - "terminated_immediately" — прекращаются немедленно.
    - "terminated_with_transition" — прекращаются после
      transition period.
    - "perpetual" — сохраняются бессрочно.
    - "not_addressed" — не урегулировано.
    - "unclear" — неясно.

    Шаг 6 — КОНФИДЕНЦИАЛЬНОСТЬ ПОСЛЕ РАСТОРЖЕНИЯ

    Заполни "confidentiality_survival".

    Значения:
    - "none" — нет.
    - "short" — до 1 года.
    - "standard" — 1–3 года.
    - "long" — более 3 лет или бессрочно.
    - "unclear" — неясно.

    Шаг 7 — DISPLAY ДЛЯ DD GRID

    Заполни "termination_consequences_display".

    Это итоговое поле для таблицы.
    Строй его ТОЛЬКО на основе уже заполненных полей выше.
    Не добавляй информацию сверх них.

    Правила:
    - Если termination_consequences_status = "missing":
      "Последствия расторжения не урегулированы"
    - Если все поля unclear:
      "Не удалось определить последствия расторжения"
    - Иначе комбинируй через ";":
      * payments_treatment (кратко)
      * has_transition_period + transition_period_value
      * data_handling (если значимо)
      * ip_license_survival (если критично)
    - Не более 4 фактов через ";".

    Шаг 8 — КРАТКОЕ ОБОСНОВАНИЕ

    Заполни "reason".

    Правила:
    - Первое предложение — краткий вывод.
    - Второе — короткая цитата из текста (до 100 символов).
    - Пиши по-русски.
    </instructions>

    <edge_cases>
    - Non-refundable + нет transition:
      * termination_consequences_status = "present"
      * payments_treatment = "unfavorable"
      * has_transition_period = "no"
      * transition_period_value = "Не применимо"

    - Лицензии прекращаются немедленно, нет transition:
      * termination_consequences_status = "present"
      * ip_license_survival = "terminated_immediately"
      * has_transition_period = "no"

    - Transition 30 дней + export предусмотрен:
      * termination_consequences_status = "present"
      * has_transition_period = "yes"
      * transition_period_value = "30 дней"
      * data_handling_after_termination = "export_provided"

    - Договор прямо фиксирует отсутствие последствий:
      * termination_consequences_status = "present"
      * payments_treatment = "not_addressed"
      * location с прямой цитатой об отсутствии.

    - Нет релевантных фрагментов / раздел о последствиях расторжения
      в договоре отсутствует:
      * termination_consequences_status = "missing"
      * payments_treatment = "not_addressed"
      * has_early_termination_fee = "no"
      * has_transition_period = "no"
      * transition_period_value = "Не установлено"
      * data_handling_after_termination = "not_addressed"
      * ip_license_survival = "not_addressed"
      * confidentiality_survival = "none"
      * termination_consequences_display =
        "Последствия расторжения не урегулированы"
      * location у всех полей = null.

    - Формулировки есть, но вывод невозможен:
      * termination_consequences_status = "unclear"
      * termination_consequences_display =
        "Не удалось определить последствия расторжения"
    </edge_cases>

    <output_expectations>
    - Верни результат строго в формате JSON.
    - Не оборачивай в markdown-блоки (без ```).
    - Не добавляй комментариев вне JSON.
    - Все значения полей с allowed_values — на английском.
    - Свободные текстовые поля
      (termination_consequences_display,
      transition_period_value, reason) — на русском языке.
    - Не добавляй полей, кроме указанных.
    - Для каждого поля возвращай объект с ключами
      "value", "confidence", "location".

    Пример структуры ответа:
    {
      "termination_consequences_display": {"value": "Авансы не возвращаются; нет transition; лицензии прекращаются немедленно", "confidence": 0.92, "location": null},
      "termination_consequences_status": {"value": "present", "confidence": 0.95, "location": {"clause_ref": "п. 13.1", "page": 8, "quote": "Upon termination, all fees paid are non-refundable"}},
      "payments_treatment": {"value": "unfavorable", "confidence": 0.90, "location": {"clause_ref": "п. 13.1", "page": 8, "quote": "all fees paid are non-refundable"}},
      "has_early_termination_fee": {"value": "no", "confidence": 0.80, "location": null},
      "has_transition_period": {"value": "no", "confidence": 0.85, "location": null},
      "transition_period_value": {"value": "Не применимо", "confidence": 0.90, "location": null},
      "data_handling_after_termination": {"value": "not_addressed", "confidence": 0.75, "location": null},
      "ip_license_survival": {"value": "terminated_immediately", "confidence": 0.85, "location": {"clause_ref": "п. 13.2", "page": 8, "quote": "all licenses granted hereunder shall immediately terminate"}},
      "confidentiality_survival": {"value": "standard", "confidence": 0.80, "location": null},
      "reason": {"value": "...", "confidence": 0.90, "location": null}
    }
    </output_expectations>

  fields:
    - name: "termination_consequences_display"
      type: "string"
      presentation: "fact"
      label: "Последствия расторжения"
      description: "Нормализованный user-facing вывод для DD Grid"
      display_in_grid: true
      display_priority: 1

    - name: "termination_consequences_status"
      type: "string"
      presentation: "signal"
      risk_weight: "info"
      description: "Наличие регулирования последствий расторжения"
      display_in_grid: false
      allowed_values:
        - "present"
        - "missing"
        - "unclear"

    - name: "payments_treatment"
      type: "string"
      presentation: "signal"
      risk_weight: "high"
      description: "Судьба авансов и платежей"
      display_in_grid: false
      allowed_values:
        - "favorable"
        - "unfavorable"
        - "neutral"
        - "not_addressed"
        - "unclear"

    - name: "has_early_termination_fee"
      type: "string"
      presentation: "signal"
      risk_weight: "high"
      description: "Early termination fee"
      display_in_grid: false
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "has_transition_period"
      type: "string"
      presentation: "signal"
      risk_weight: "high"
      description: "Переходный период"
      display_in_grid: false
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "transition_period_value"
      type: "string"
      presentation: "fact"
      label: "Длительность переходного периода"
      description: "Длительность переходного периода"
      display_in_grid: true
      display_priority: 2

    - name: "data_handling_after_termination"
      type: "string"
      presentation: "signal"
      risk_weight: "high"
      description: "Обращение с данными после расторжения"
      display_in_grid: false
      allowed_values:
        - "export_provided"
        - "deletion_only"
        - "both"
        - "not_addressed"
        - "unclear"

    - name: "ip_license_survival"
      type: "string"
      presentation: "signal"
      risk_weight: "high"
      description: "Судьба IP / лицензий"
