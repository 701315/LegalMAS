id: "termination_consequences"
name: "Последствия расторжения"
description: >
  Анализирует последствия расторжения: судьба авансов и минимальных платежей,
  конфиденциальной информации, лицензий/IP, survival-положения.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"

rules:
  keywords:
    - "при прекращении действия договора"
    - "последствия расторжения"
    - "upon termination"
    - "upon expiry"
    - "за вычетом"
    - "невозвратимый аванс"
    - "non-refundable"
    - "минимальные платежи"
    - "minimum commitment"
    - "survive"
    - "survival"
    - "сохраняют силу"
    - "конфиденциальная информация"
    - "intellectual property"
    - "license"
  keyword_mode: "any"
  regex_patterns: []
  clause_patterns: []

llm:
  prompt_template: |
    <role>
    Ты — юрист по коммерческим договорам.
    Твоя специализация — последствия расторжения и выживающие обязательства.
    </role>

    <context>
    Ниже приведены фрагменты договора:

    {context}
    </context>

    <instructions>
    Проведи анализ по шагам. Каждый шаг логически связан с одним или
    несколькими полями итоговой оценки.

    Шаг 1 — СУДЬБА АВАНСОВ И МИНИМАЛЬНЫХ ПЛАТЕЖЕЙ
    (используется для "advance_and_minimum_payments_treatment"):
    - Определи, что происходит с авансовыми и минимальными платежами при
      расторжении или истечении договора:
      * подлежат ли авансы и минимальные платежи возврату полностью или частично;
      * указано ли, что они non-refundable / невозвратимы / удерживаются как penalty;
      * различается ли режим при виновном и безвиновном расторжении.
    - Оцени условия для Target как:
      * "favorable" — условия выгодны (например, возврат неиспользованной части аванса
        или минимальных платежей);
      * "neutral" — стандартный/сбалансированный подход;
      * "unfavorable" — крупные невозвратимые суммы, удержание как неустойка и т.п.;
      * "unclear" — если по фрагментам непонятно.

    Шаг 2 — ВЫЖИВАНИЕ ОБЯЗАТЕЛЬСТВ ПО КОНФИДЕНЦИАЛЬНОСТИ
    (используется для "confidentiality_survival"):
    - Выяви, как регулируется конфиденциальная информация после расторжения:
      * подлежит ли конфиденциальная информация возврату или уничтожению;
      * сохраняется ли обязанность конфиденциальности и на какой срок (фиксированный
        срок, до раскрытия/публичности, бессрочно).
    - Классифицируй "confidentiality_survival" как:
      * "none" — survival нет, конфиденциальность формально не действует после расторжения;
      * "short" — короткий срок (обычно менее 2 лет);
      * "standard" — типичный срок (порядка 3–5 лет или до раскрытия/публичности);
      * "long" — очень длительный или бессрочный срок;
      * "unclear" — если невозможно оценить по тексту.

    Шаг 3 — СУДЬБА ЛИЦЕНЗИЙ И ПРАВ IP
    (используется для "ip_and_license_survival"):
    - Определи, что происходит с лицензиями и правами использования IP после расторжения:
      * прекращаются ли лицензии/права использования немедленно;
      * есть ли post-termination период для миграции данных, экспорта софта,
        завершения проектов;
      * предусмотрены ли perpetual / бессрочные лицензии, которые продолжают действовать.
    - Классифицируй "ip_and_license_survival" аналогично:
      * "none" — права использования прекращаются немедленно без переходного периода;
      * "short" — краткий переходный период;
      * "standard" — разумный стандартный период для миграции/завершения;
      * "long" — длительное или бессрочное сохранение прав/ограничений;
      * "unclear" — если нельзя определить.

    Шаг 4 — ПРОЧИЕ ВЫЖИВАЮЩИЕ ОБЯЗАТЕЛЬСТВА
    (используется для "other_surviving_obligations"):
    - Определи, какие ещё положения прямо указаны как сохраняющие силу
      после расторжения/истечения договора, например:
      * платежные обязательства (deferred fees, неустойки, минимальные commitment‑ы);
      * ограничения ответственности;
      * заверения и гарантии (R&W), indemnity;
      * санкции, комплаенс, антикоррупция;
      * юрисдикция, применимое право, разрешение споров и т.п.
    - Кратко перечисли эти выживающие обязательства в одной строке, без
      детального цитирования.

    Шаг 5 — ОБЩИЙ УРОВЕНЬ РИСКА ДЛЯ TARGET
    (используется для "overall_risk_level" и "reason"):
    - Оцени общий риск для Target, учитывая:
      * режим авансов и минимальных платежей (особенно non-refundable суммы);
      * продолжительность и жёсткость конфиденциальности и IP‑ограничений после расторжения;
      * объём и характер других survival‑положений (ограничение ответственности,
        indemnity, платежи и т.п.).
    - Сформулируй общий риск как:
      * "low" — условия по платежам и survival сбалансированы и типичны,
        без чрезмерно жёстких пост‑termination ограничений;
      * "medium" — есть отдельные неблагоприятные элементы, но общий набор survival
        ещё приемлем;
      * "high" — крупные невозвратимые платежи, немедленное прекращение ключевых лицензий
        без переходного периода, либо очень жёсткие и длительные survival‑обязательства.
    - В "reason" кратко обоснуй вывод, ссылаясь на ключевые формулировки
      (желательно с короткими цитатами), и поясни, какие именно последствия расторжения
      создают основной риск для Target.
    </instructions>

    <edge_cases>
    Обрабатывай пограничные ситуации так:

    - Крупные авансы и минимальные платежи прямо обозначены как non-refundable
      при расторжении по инициативе Target (или независимо от причин):
      устанавливай advance_and_minimum_payments_treatment = "unfavorable"
      и учитывай это как фактор высокого риска (часто overall_risk_level = "high").

    - Конфиденциальность и IP‑ограничения фактически бессрочны и охватывают
      широкий круг информации/результатов без carve‑out:
      отмечай confidentiality_survival и/или ip_and_license_survival как "long"
      и учитывай риск как минимум "medium", а при жёстких формулировках — "high".

    - Лицензии/IP прекращаются немедленно при расторжении без разумного
      переходного периода (например, для миграции данных/систем):
      ip_and_license_survival = "none" или "short"; для ИТ-/SaaS‑договоров
      это обычно повышает общий риск.

    - Survival‑перечень чрезмерно широк (сохраняются ограничения ответственности,
      штрафы, односторонние права контрагента и т.п.) при минимальной защите Target:
      отражай это в "other_surviving_obligations" и учитывай при установлении
      более высокого overall_risk_level.

    - Текст фрагментарный: упомянуты только отдельные аспекты (например,
      конфиденциальность), но нет данных по авансам или IP:
      используй "unclear" для недостающих полей и в reason прямо укажи,
      какая информация отсутствует.

    - Пустые или нерелевантные фрагменты:
      по большинству полей используй "unclear" или пустые строки,
      overall_risk_level = "medium",
      reason — "Недостаточно данных для анализа последствий расторжения и survival-положений."
    </edge_cases>

    <output_expectations>
    На основе твоего анализа отдельный механизм извлечения сформирует
    структурированные поля по заранее заданной схеме. Твоя задача —
    давать чёткие юридические выводы и указывать конкретные формулировки
    из текста, на которых они основаны.
    </output_expectations>
  prompt_file: null
  context_k: 4
  temperature: 0.0
  max_tokens: 512

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  context_k: 4
  max_chunks: 8
  boost_keywords:
    - "upon termination"
    - "при прекращении действия"
    - "non-refundable"
    - "минимальные платежи"
    - "survive"
    - "сохраняют силу"
  rerank: true
  filters: {}

conditional: null

extraction:
  enabled: true
  mode: "hybrid"
  fields:
    - name: "advance_and_minimum_payments_treatment"
      type: "string"
      allowed_values:
        - "favorable"
        - "neutral"
        - "unfavorable"
        - "unclear"

    - name: "confidentiality_survival"
      type: "string"
      allowed_values:
        - "none"
        - "short"
        - "standard"
        - "long"
        - "unclear"

    - name: "ip_and_license_survival"
      type: "string"
      allowed_values:
        - "none"
        - "short"
        - "standard"
        - "long"
        - "unclear"

    - name: "other_surviving_obligations"
      type: "string"

    - name: "overall_risk_level"
      type: "string"
      allowed_values:
        - "low"
        - "medium"
        - "high"

    - name: "reason"
      type: "string"

  store_payload: true

red_flags:
  items:
    - code: "TERM5"
      description: "Невозвратимые крупные авансы/минимальные платежи при раннем расторжении."
    - code: "TERM6"
      description: "Прекращение ключевых лицензий/IP без разумного переходного периода."
