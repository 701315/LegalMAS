id: "term_and_renewal"
name: "Срок договора и пролонгация"
description: >
  Определяет срок действия договора, наличие и условия автопродления
  (evergreen), период и условия отказа от пролонгации, сложность
  процедуры выхода и риск «залипания» в долгосрочном договоре.

doc_types: []

severity: "medium"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"

rules:
  keyword_mode: any

  keywords:
    high:
      # Автоматическая пролонгация / evergreen
      - "(?i)автоматически\\s+продлева[ею]тся"
      - "(?i)автоматическ[а-яая]+\\s+пролонгаци"
      - "(?i)пролонгируется\\s+автоматически"
      - "(?i)automatically\\s+renew(ed|s)?"
      - "(?i)auto[-\\s]?renew(al|ed|s)?"
      - "(?i)\\bevergreen\\b"
      - "(?i)shall\\s+(be\\s+)?renewed?\\s+(automatically|for\\s+(an\\s+)?additional)"
      - "(?i)продлева[ею]тся\\s+на\\s+(очередной|последующ|аналогичн|такой\\s+же)"
      - "(?i)считается\\s+продлённым"

      # Условия отказа от пролонгации
      - "(?i)notice\\s+of\\s+non[-\\s]?renewal"
      - "(?i)уведомлени[ея]\\s+об\\s+отказе\\s+от\\s+продлени"
      - "(?i)уведомлени[ея]\\s+об\\s+отказе\\s+от\\s+пролонгаци"
      - "(?i)opt[-\\s]?out\\s+notice"
      - "(?i)письменн[а-яое]+\\s+уведомлени[ея]\\s+[\\s\\S]{0,30}(продлени|пролонгаци)"
      - "(?i)не\\s+менее\\s+чем\\s+за\\s+\\d+\\s+(дн|календарн|рабоч)"
      - "(?i)at\\s+least\\s+\\d+\\s+(days?|months?)\\s+(prior|before|in\\s+advance)"

      # Бессрочность
      - "(?i)until\\s+terminat(ed|ion)"
      - "(?i)до\\s+(момента\\s+)?расторжени[яи]"
      - "(?i)бессрочн[а-яый]"
      - "(?i)indefinite\\s+term"
      - "(?i)no\\s+fixed\\s+term"

    medium:
      # Срок действия — общие формулировки
      - "(?i)срок\\s+действи[яи]\\s+(настоящего\\s+)?договор"
      - "(?i)term\\s+of\\s+this\\s+agreement"
      - "(?i)initial\\s+term"
      - "(?i)первоначальн[а-яый]+\\s+срок"
      - "(?i)договор\\s+действует\\s+(до|в\\s+течени)"
      - "(?i)договор\\s+вступает\\s+в\\s+силу"
      - "(?i)настоящий\\s+договор\\s+вступает\\s+в\\s+силу"
      - "(?i)effective\\s+date"
      - "(?i)дата\\s+вступлени[яи]\\s+в\\s+силу"
      - "(?i)сроком\\s+(до|на)"
      - "(?i)for\\s+a\\s+period\\s+of"
      - "(?i)на\\s+срок\\s+\\d+"

      # Пролонгация — общие
      - "(?i)пролонгаци"
      - "(?i)продлени[ея]"
      - "(?i)renewal"
      - "(?i)renewed?"
      - "(?i)extension"
      - "(?i)extend(ed|s)?"
      - "(?i)renewal\\s+term"
      - "(?i)successive\\s+term"
      - "(?i)последующ[а-яий]+\\s+(период|срок)"

      # Сроки уведомления
      - "(?i)\\d+\\s+(дн|календарн|рабоч)[а-я]*\\s+(до|перед|заблаговременно)"
      - "(?i)\\d+\\s+(days?|months?|calendar\\s+days?)\\s+(prior|before|advance)"
      - "(?i)notice\\s+period"
      - "(?i)срок\\s+уведомлени"

      # По событию
      - "(?i)до\\s+полного\\s+исполнени[яи]"
      - "(?i)until\\s+(full\\s+)?performance"
      - "(?i)до\\s+завершения\\s+проекта"
      - "(?i)until\\s+completion"

    low:
      # Общие ссылки на сроки
      - "(?i)срок"
      - "(?i)term"
      - "(?i)период"
      - "(?i)period"
      - "(?i)дата"
      - "(?i)date"

      # Общие ссылки на расторжение
      - "(?i)расторжени"
      - "(?i)terminat"
      - "(?i)прекращени"

      # Общие ссылки на уведомления
      - "(?i)уведомлени"
      - "(?i)notif"
      - "(?i)notice"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 640

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  context_k: 5
  max_chunks: 10
  boost_keywords:
    - "срок действия"
    - "срок действия договора"
    - "term of this agreement"
    - "initial term"
    - "вступает в силу"
    - "effective date"
    - "автоматически продлевается"
    - "автоматическая пролонгация"
    - "automatically renewed"
    - "auto-renewal"
    - "evergreen"
    - "renewal term"
    - "пролонгируется"
    - "продление"
    - "уведомление об отказе от продления"
    - "notice of non-renewal"
    - "opt-out notice"
    - "бессрочный"
    - "indefinite term"
    - "until terminated"
    - "до расторжения"
    - "до полного исполнения"
  rerank: true
  filters: {}

conditional: null

extraction:
  llm_prompt_extraction: |
    <role>
    Ты — юрист по коммерческим договорам.
    Твоя специализация — сроки действия договоров, механизмы
    пролонгации (включая evergreen), условия отказа от продления,
    и оценка риска «залипания» в долгосрочных договорных
    обязательствах.
    </role>

    <context>
    Ниже приведены фрагменты одного договора:

    {context}
    </context>

    <instructions>
    Проведи анализ по шагам. Каждый шаг логически соответствует одному
    или нескольким полям итоговой оценки риска.

    Шаг 1 — ТИП СРОКА ДЕЙСТВИЯ
    (используется для заполнения поля "term_type"):
    - Определи, как задан срок действия:
      * "fixed" — конкретная дата окончания или чётко
        определённый период ("1 год с даты подписания",
        "до 31.12.2027");
      * "indefinite" — бессрочный (until terminated,
        действует до расторжения);
      * "by_event" — до наступления события (до полного
        исполнения, до завершения проекта);
      * "unclear" — невозможно определить.

    Шаг 2 — НАЧАЛЬНЫЙ СРОК
    (используется для заполнения поля "initial_term"):
    - Укажи начальный срок действия, если определён:
      * например: "12 months", "1 год", "до 31.12.2027",
        "3 года с даты подписания".
    - Если не определён — укажи "Не определён".

    Шаг 3 — НАЛИЧИЕ АВТОМАТИЧЕСКОЙ ПРОЛОНГАЦИИ
    (используется для заполнения поля "has_auto_renewal"):
    - Определи, предусмотрено ли автоматическое продление:
      * формулировки "автоматически продлевается",
        "automatically renewed", "evergreen",
        "считается продлённым", "renewed for successive
        terms";
      * при отсутствии таких формулировок —
        автопролонгации нет.
    - Сформулируй вывод: "yes" / "no" / "unclear".

    Шаг 4 — ПЕРИОД ПРОЛОНГАЦИИ
    (используется для заполнения поля "renewal_period"):
    - Если автопродление есть, опиши период:
      * "на 1 год", "each subsequent 12-month period",
        "на аналогичный срок" и т.п.
    - Если период не указан — укажи "Не указан".
    - Если автопродления нет — укажи "N/A".

    Шаг 5 — СРОК УВЕДОМЛЕНИЯ ОБ ОТКАЗЕ
    (используется для заполнения поля "non_renewal_notice_period"):
    - Определи срок уведомления об отказе от продления:
      * например: "не менее чем за 30 дней", "90 days prior",
        "за 3 месяца до истечения" и т.п.
    - Если срок не указан — укажи "Не указан".

    Шаг 6 — ФОРМА УВЕДОМЛЕНИЯ
    (используется для заполнения поля "non_renewal_notice_form"):
    - Определи требуемую форму:
      * "written" — письменно;
      * "registered_mail" — заказное/ценное письмо;
      * "email" — по электронной почте;
      * "any" — любая форма;
      * "not_specified" — не указана.

    Шаг 7 — RED FLAGS
    (используется для заполнения поля "red_flags"):
    - Оцени наличие следующих рисковых факторов:

      * «TERM1» — Автоматическая пролонгация на длительные
        периоды без реальной возможности отказаться. Признаки:
        - has_auto_renewal = "yes";
        - renewal_period = длительный (12+ месяцев);
        - renewal_limit = "unlimited";
        - opt_out_difficulty = "difficult";
        - Target рискует «залипнуть» в долгосрочном
          контракте.

      * «TERM2» — Короткий или неясный срок уведомления
        об отказе от пролонгации. Признаки:
        - non_renewal_notice_period < 30 дней (при годовом
          сроке) или не указан;
        - Target может пропустить окно для отказа;
        - это повышает риск непроизвольного продления.

      * «TERM3» — Бессрочный договор без понятного
        механизма одностороннего выхода. Признаки:
        - term_type = "indefinite";
        - нет упоминания права на одностороннее расторжение
          (for convenience) в доступных фрагментах;
        - Target не может выйти без нарушения.

    - Если срок понятный, автопродление отсутствует
      или условия отказа разумные — верни "NONE".
    - Если данных недостаточно для оценки — верни "UNCLEAR".
    - Формат: один или несколько кодов через запятую
      ("TERM1", "TERM2", "TERM1, TERM2"), "NONE" или "UNCLEAR".
      Без комментариев в этом поле — всё объясняющее в reason.

    Шаг 8 — ОБОСНОВАНИЕ
    (используется для заполнения поля "reason"):

    - В "reason" кратко обоснуй вывод:
      * ссылайся на ключевые формулировки (по возможности
        с короткими цитатами);
      * поясни, как структура срока/пролонгации влияет
        на операционную гибкость Target;
      * если выставлены red_flags — объясни, почему именно
        эти коды.
    </instructions>

    <edge_cases>
    Обрабатывай пограничные ситуации так:

    - Evergreen с длинными периодами (3+ года) и коротким/
      сложным сроком уведомления (60–180 дней):
      has_auto_renewal = "yes";
      opt_out_difficulty = "difficult";
      ставь TERM1; overall_risk_level = "high".

    - Бессрочный договор без понятной процедуры
      одностороннего расторжения:
      term_type = "indefinite";
      ставь TERM3; overall_risk_level = "high".

    - Бессрочный договор, но с правом расторгнуть
      for convenience с 30-дневным уведомлением:
      term_type = "indefinite";
      red_flags = "NONE";
      overall_risk_level = "low" — бессрочность
      компенсируется простым выходом.

    - Договор "до полного исполнения" без календарного
      ограничения:
      term_type = "by_event";
      оценивай предсказуемость события и наличие
      других механизмов расторжения.

    - Фиксированный срок 1 год, автопродление на 1 год,
      отказ за 30 дней:
      стандартная конструкция;
      overall_risk_level = "low";
      red_flags = "NONE".

    - Автопродление с формулировкой "если ни одна
      из сторон не уведомит" без указания срока
      уведомления:
      non_renewal_notice_period = "Не указан";
      ставь TERM2; overall_risk_level = "medium".

    - Текст фрагментарный: видно, что договор вступает
      в силу, но нет данных об окончании:
      term_type = "unclear";
      has_auto_renewal = "unclear";
      red_flags = "UNCLEAR";
      overall_risk_level = "medium".

    - Пустые или нерелевантные фрагменты:
      все поля = "unclear";
      red_flags = "UNCLEAR";
      overall_risk_level = "medium".
    </edge_cases>

    <output_expectations>
    На основе твоего анализа отдельный механизм извлечения сформирует
    структурированные поля по заранее заданной схеме. Твоя задача —
    давать чёткие юридические выводы и указывать конкретные формулировки
    из текста, на которых они основаны. Не генерируй JSON —
    просто излагай выводы структурированно и однозначно.
    </output_expectations>

  enabled: true
  mode: "hybrid"
  fields:
    - name: "term_type"
      type: "string"
      allowed_values:
        - "fixed"
        - "indefinite"
        - "by_event"
        - "unclear"

    - name: "initial_term"
      type: "string"

    - name: "has_auto_renewal"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "renewal_period"
      type: "string"

    - name: "renewal_limit"
      type: "string"

    - name: "non_renewal_notice_period"
      type: "string"

    - name: "non_renewal_notice_form"
      type: "string"
      allowed_values:
        - "written"
        - "registered_mail"
        - "email"
        - "any"
        - "not_specified"
        - "unclear"

    - name: "red_flags"
      type: "string"

    - name: "reason"
      type: "string"

  store_payload: true

red_flags:
  items:
    - code: "TERM1"
      description: "Автоматическая пролонгация на длительные периоды без реальной возможности отказаться."
    - code: "TERM2"
      description: "Короткий или неясный срок уведомления об отказе от пролонгации."
    - code: "TERM3"
      description: "Бессрочный договор без понятного механизма одностороннего выхода."