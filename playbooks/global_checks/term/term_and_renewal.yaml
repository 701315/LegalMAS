id: "term_and_renewal"
name: "Срок договора и пролонгация"
group: "Terms"
description: >
  Определяет срок действия договора, наличие и условия автопродления
  (evergreen), период и условия отказа от пролонгации, сложность
  процедуры выхода и риск «залипания» в долгосрочном договоре.

  Формирует краткий user-facing вывод.

  Долгосрочные минимальные обязательства (take-or-pay, гарантированные
  объёмы) анализируются чеком sticky_long_term_obligations.

doc_types: []

severity: "medium"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"
ui_mode: "field_extraction"

rules:
  keyword_mode: any

  keywords:
    high:
      - "(?i)автоматически\\s+продлева[ею]тся"
      - "(?i)автоматическ[а-яая]+\\s+пролонгаци"
      - "(?i)пролонгируется\\s+автоматически"
      - "(?i)automatically\\s+renew(ed|s)?"
      - "(?i)auto[-\\s]?renew(al|ed|s)?"
      - "(?i)\\bevergreen\\b"
      - "(?i)shall\\s+(be\\s+)?renewed?\\s+(automatically|for\\s+(an\\s+)?additional)"
      - "(?i)продлева[ею]тся\\s+на\\s+(очередной|последующ|аналогичн|такой\\s+же)"
      - "(?i)считается\\s+продлённым"
      - "(?i)notice\\s+of\\s+non[-\\s]?renewal"
      - "(?i)уведомлени[ея]\\s+об\\s+отказе\\s+от\\s+(продлени|пролонгаци)"
      - "(?i)opt[-\\s]?out\\s+notice"
      - "(?i)не\\s+менее\\s+чем\\s+за\\s+\\d+\\s+(дн|календарн|рабоч)"
      - "(?i)at\\s+least\\s+\\d+\\s+(days?|months?)\\s+(prior|before|in\\s+advance)"
      - "(?i)until\\s+terminat(ed|ion)"
      - "(?i)до\\s+(момента\\s+)?расторжени[яи]"
      - "(?i)бессрочн[а-яый]"
      - "(?i)indefinite\\s+term"

    medium:
      - "(?i)срок\\s+действи[яи]\\s+(настоящего\\s+)?договор"
      - "(?i)term\\s+of\\s+this\\s+agreement"
      - "(?i)initial\\s+term"
      - "(?i)первоначальн[а-яый]+\\s+срок"
      - "(?i)договор\\s+действует\\s+(до|в\\s+течени)"
      - "(?i)effective\\s+date"
      - "(?i)for\\s+a\\s+period\\s+of"
      - "(?i)на\\s+срок\\s+\\d+"
      - "(?i)renewal\\s+term"
      - "(?i)successive\\s+term"
      - "(?i)последующ[а-яий]+\\s+(период|срок)"
      - "(?i)extension"
      - "(?i)\\d+\\s+(дн|календарн|рабоч)[а-я]*\\s+(до|перед)[\\s\\S]{0,20}(продлени|пролонгаци)"
      - "(?i)\\d+\\s+(days?|months?)[\\s\\S]{0,20}(prior|before)[\\s\\S]{0,20}(renewal|expir)"
      - "(?i)notice\\s+period[\\s\\S]{0,20}(renewal|non-renewal)"
      - "(?i)до\\s+полного\\s+исполнени[яи]"
      - "(?i)until\\s+(full\\s+)?performance"
      - "(?i)до\\s+завершения\\s+проекта"

    low:
      - "(?i)автоматически\\s+продлева"
      - "(?i)auto[-\\s]?renew"
      - "(?i)evergreen"
      - "(?i)notice\\s+of\\s+non[-\\s]?renewal"
      - "(?i)бессрочн"
      - "(?i)indefinite\\s+term"
      - "(?i)initial\\s+term"
      - "(?i)срок\\s+действия\\s+договора"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 640

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  retrieval_profile: "term_and_renewal_check"
  context_k: 5
  max_chunks: 10
  
  retrieval_query: >
    срок действия договора term of agreement автоматическая пролонгация auto-renewal 
    evergreen renewal term notice of non-renewal уведомление об отказе от продления бессрочный

  boost_keywords:
    - "срок действия"
    - "срок действия договора"
    - "term of this agreement"
    - "initial term"
    - "вступает в силу"
    - "effective date"
    - "автоматически продлевается"
    - "автоматическая пролонгация"
    - "automatically renewed"
    - "auto-renewal"
    - "evergreen"
    - "renewal term"
    - "пролонгируется"
    - "продление"
    - "уведомление об отказе от продления"
    - "notice of non-renewal"
    - "opt-out notice"
    - "бессрочный"
    - "indefinite term"
    - "until terminated"
    - "до расторжения"
    - "до полного исполнения"

  negative_keywords:
    - "срок оплаты"
    - "срок поставки"
    - "гарантийный срок"
    - "срок исковой давности"
    - "срок годности"

  preferred_unit_types:
    - "general_provision"
    - "termination_provision"

  excluded_unit_types:
    - "technical_fragment"
    - "appendix_reference"
    - "structural_anchor"

  preferred_clause_functions:
    - "boilerplate"
    - "procedures"

  position_bias:
    preferred_range: [0.0, 1.0]
    boost: 0.10
    scope: "segment"

  rerank: true
  filters: {}

conditional: null

enrichment_hints:
  preferred_segment_types:
    - "contract"
    - "amendment"
    - "schedule"
  excluded_segment_types:
    - "technical_specification"
    - "price_list"
    - "invoice"
    - "act"
  preferred_clause_functions:
    - "boilerplate"
    - "procedures"
  confidence_bonus_on_match: 0.10
  confidence_penalty_on_excluded_segment: 0.15

extraction:
  enabled: true
  mode: "hybrid"
  llm_max_tokens: 1450

  presence_signal:
    field: "term_and_renewal_status"
    present_values: ["present"]
    missing_values: ["missing"]
    unclear_values: ["unclear"]

  llm_prompt_extraction: |
    <role>
    Ты — юрист по коммерческим договорам.
    Твоя задача — точно извлечь из текста:
    1) есть ли в договоре регулирование срока действия;
    2) если есть — какие условия установлены:
       - тип и начальный срок договора;
       - наличие автоматической пролонгации;
       - период и количество пролонгаций;
       - срок и форма уведомления об отказе от продления.

    КРИТИЧЕСКИ ВАЖНО:
    - Извлекай ТОЛЬКО то, что прямо написано в тексте.
    - НЕ делай выводов "по умолчанию" из общих норм права.
    - НЕ додумывай сроки если они не указаны.
    - Если ни один фрагмент не содержит информации о сроке
      действия договора (нет упоминаний срока / term / renewal /
      пролонгации) — term_and_renewal_status = "missing".
    - Если тексты по теме есть, но вывод сделать нельзя —
      term_and_renewal_status = "unclear".

    Не анализируй take-or-pay и минимальные объёмы.
    </role>

    <context_rules>
    - Ниже приведены фрагменты, отобранные автоматически.
    - Некоторые фрагменты могут быть нерелевантны —
      игнорируй их.
    - Если среди фрагментов есть противоречия —
      укажи "unclear" и объясни в reason.
    - Не используй информацию из определений (definitions),
      преамбулы или приложений, если они не содержат
      substantive условий по теме check.
    - Если ни один фрагмент не содержит информации о сроке
      действия договора (нет упоминаний срока / term of agreement /
      renewal / пролонгации) — term_and_renewal_status = "missing",
      location = null. Не использовать "unclear" при полном отсутствии
      релевантных фрагментов.
    </context_rules>

    <context>
    Ниже приведены релевантные фрагменты договора:

    {context}
    </context>

    <task>
    Заполни только следующие поля:
    - term_display
    - term_and_renewal_status
    - term_type
    - initial_term
    - has_auto_renewal
    - renewal_period
    - renewal_limit
    - non_renewal_notice_period
    - non_renewal_notice_form
    - opt_out_difficulty
    - reason
    </task>

    <location_instructions>
    Для каждого поля по возможности укажи location в формате:
    {"clause_ref": "п. 12.1", "page": 7, "quote": "дословная фраза из договора"}

    Правила:
    - clause_ref — короткая ссылка на пункт / раздел / статью именно в том
      виде, как она написана в договоре;
    - page — целое число страницы;
    - quote — дословная фраза из текста договора (НЕ пересказ, НЕ парафраз).
      Копируй её посимвольно, сохраняя формулировку и порядок слов.
      Оптимальная длина: 30–300 символов.
    - Для synthesized-полей (term_display, initial_term, renewal_period,
      renewal_limit, non_renewal_notice_period, reason)
      location ВСЕГДА null.
    - Для term_and_renewal_status = "missing" — location = null.
    - Для term_and_renewal_status = "present" / "unclear" — quote
      с фразой-основанием.
    - Для term_type, has_auto_renewal, non_renewal_notice_form,
      opt_out_difficulty:
      * если значение определённое ("fixed" / "indefinite" /
        "yes" / "written" / "easy" и т.п.) — quote с фразой-основанием;
      * если "no" / "not_applicable" — различай: прямое исключение
        (quote обязательна) vs отсутствие упоминания (location = null);
      * если "unclear" — location = null.
    - Не выдумывай location или quote. Если дословную фразу определить
      нельзя — location = null.
    </location_instructions>

    <instructions>
    Шаг 0 — НАЛИЧИЕ РЕГУЛИРОВАНИЯ СРОКА ДОГОВОРА

    Заполни "term_and_renewal_status".

    Значения:
    - "present" — если хотя бы одно содержательное signal-поле
      указывает на наличие информации по теме:
      * term_type ∈ {"fixed", "indefinite", "by_event"};
      * has_auto_renewal = "yes";
      * non_renewal_notice_form ∈ {"written", "registered_mail",
        "email", "any"};
      * opt_out_difficulty ∈ {"easy", "moderate", "difficult"};
      * ЛИБО любое поле = "no" / "not_applicable", но
        с заполненным location с прямой цитатой (см. RF3).
    - "missing" — если все содержательные поля = "no" /
      "not_applicable" / "unclear" БЕЗ цитат, ЛИБО фрагментов
      по теме нет вообще.
    - "unclear" — если все содержательные = "unclear" при наличии
      фрагментов, но невозможности вывода.

    Шаг 1 — ТИП СРОКА

    Заполни "term_type".

    Значения:
    - "fixed" — конкретная дата или чётко определённый период.
    - "indefinite" — бессрочный (until terminated).
    - "by_event" — до наступления события.
    - "unclear" — невозможно определить.

    Шаг 2 — НАЧАЛЬНЫЙ СРОК

    Заполни "initial_term".

    Правила:
    - Если указан: "12 месяцев", "1 год", "до 31.12.2027".
    - Бессрочный: "Бессрочный".
    - По событию: краткое описание события.
    - Не определён в тексте: "Не определён".
    - Нельзя определить: "Не удалось определить".

    Шаг 3 — АВТОМАТИЧЕСКАЯ ПРОЛОНГАЦИЯ

    Заполни "has_auto_renewal".

    Значения:
    - "yes" — прямо указано: "автоматически продлевается",
      "auto-renewal", "evergreen".
    - "no" — прямо указано, что автопродления нет.
    - "unclear" — нет информации.

    Шаг 4 — ПЕРИОД ПРОЛОНГАЦИИ

    Заполни "renewal_period".

    Правила:
    - Если есть: "на 1 год", "12 месяцев",
      "на аналогичный срок".
    - Не указан: "Не указан".
    - Нет auto-renewal: "Не применимо".

    Шаг 5 — КОЛИЧЕСТВО ПРОЛОНГАЦИЙ

    Заполни "renewal_limit".

    Правила:
    - Ограничено: "не более 2 раз", "max 3".
    - Неограниченно: "Неограниченно".
    - Не указано: "Не указано".
    - Нет auto-renewal: "Не применимо".

    Шаг 6 — СРОК УВЕДОМЛЕНИЯ ОБ ОТКАЗЕ

    Заполни "non_renewal_notice_period".

    Правила:
    - Если указан: "30 дней", "90 days", "3 месяца".
    - Автопродление есть, но срок не указан: "Не указан".
    - Тема пролонгации вообще не урегулирована: "Не установлено".
    - Нет auto-renewal: "Не применимо".
    - Нельзя определить: "Не удалось определить".

    Шаг 7 — ФОРМА УВЕДОМЛЕНИЯ

    Заполни "non_renewal_notice_form".

    Значения:
    - "written" — письменно.
    - "registered_mail" — заказное письмо.
    - "email" — электронная почта.
    - "any" — любая форма.
    - "not_specified" — не указана.
    - "unclear" — нельзя определить.

    Шаг 8 — СЛОЖНОСТЬ ОТКАЗА

    Заполни "opt_out_difficulty".

    Значения:
    - "easy" — разумный срок (≥ 30 дней для годовых),
      простая форма.
    - "moderate" — умеренная сложность.
    - "difficult" — короткий срок (< 30 дней для годовых)
      или срок не указан при evergreen.
    - "not_applicable" — нет auto-renewal.
    - "unclear" — неясно.

    Шаг 9 — DISPLAY ДЛЯ DD GRID

    Заполни "term_display".

    Это итоговое поле для таблицы.
    Строй его ТОЛЬКО на основе уже заполненных полей выше.
    Не добавляй информацию сверх них.

    Правила:
    - Если term_and_renewal_status = "missing":
      "Срок не определён"
    - Если все поля unclear:
      "Не удалось определить срок договора"
    - Если term_type = "indefinite":
      "Бессрочный" + (если has_auto_renewal = "yes": "; автопродление")
    - Иначе комбинируй через ";":
      * initial_term
      * has_auto_renewal + renewal_period (если есть)
      * non_renewal_notice_period (если значимо)
    - Не более 4 фактов через ";".

    Шаг 10 — КРАТКОЕ ОБОСНОВАНИЕ

    Заполни "reason".

    Правила:
    - Первое предложение — краткий вывод.
    - Второе — короткая цитата из текста (до 100 символов).
    - Пиши по-русски.
    </instructions>

    <edge_cases>
    - Evergreen + нет notice или notice < 30 дней:
      * term_and_renewal_status = "present"
      * opt_out_difficulty = "difficult"

    - Бессрочный без for convenience в тексте:
      * term_and_renewal_status = "present"
      * term_type = "indefinite"
      * initial_term = "Бессрочный"
      * has_auto_renewal = "no"

    - Фиксированный 1 год, автопродление, отказ 30 дней:
      * term_and_renewal_status = "present"
      * opt_out_difficulty = "easy"
      * term_display = "1 год; автопродление на 1 год; отказ за 30 дней"

    - Автопродление без срока уведомления:
      * term_and_renewal_status = "present"
      * non_renewal_notice_period = "Не указан"
      * opt_out_difficulty = "difficult"

    - Договор прямо фиксирует отсутствие срока:
      * term_and_renewal_status = "present"
      * term_type = "indefinite"
      * location с прямой цитатой об отсутствии срока.

    - Нет релевантных фрагментов / раздел о сроке
      в договоре отсутствует:
      * term_and_renewal_status = "missing"
      * term_type = "unclear"
      * initial_term = "Не определён"
      * has_auto_renewal = "no"
      * renewal_period = "Не применимо"
      * renewal_limit = "Не применимо"
      * non_renewal_notice_period = "Не установлено"
      * non_renewal_notice_form = "not_specified"
      * opt_out_difficulty = "not_applicable"
      * term_display = "Срок не определён"
      * location у всех полей = null.

    - Формулировки есть, но вывод невозможен:
      * term_and_renewal_status = "unclear"
      * term_display = "Не удалось определить срок договора"
    </edge_cases>

    <output_expectations>
    - Верни результат строго в формате JSON.
    - Не оборачивай в markdown-блоки (без ```).
    - Не добавляй комментариев вне JSON.
    - Все значения полей с allowed_values — на английском.
    - Свободные текстовые поля (term_display, initial_term,
      renewal_period, renewal_limit, non_renewal_notice_period,
      reason) — на русском языке.
    - Не добавляй полей, кроме указанных.
    - Для каждого поля возвращай объект с ключами
      "value", "confidence", "location".

    Пример структуры ответа:
    {
      "term_display": {"value": "1 год; автопродление на 1 год; отказ за 30 дней", "confidence": 0.92, "location": null},
      "term_and_renewal_status": {"value": "present", "confidence": 0.95, "location": {"clause_ref": "п. 11.1", "page": 6, "quote": "Договор вступает в силу с даты подписания и действует 1 год"}},
      "term_type": {"value": "fixed", "confidence": 0.95, "location": {"clause_ref": "п. 11.1", "page": 6, "quote": "действует 1 год"}},
      "initial_term": {"value": "1 год", "confidence": 0.95, "location": null},
      "has_auto_renewal": {"value": "yes", "confidence": 0.95, "location": {"clause_ref": "п. 11.2", "page": 6, "quote": "Договор автоматически продлевается на 1 год"}},
      "renewal_period": {"value": "на 1 год", "confidence": 0.90, "location": null},
      "renewal_limit": {"value": "Неограниченно", "confidence": 0.85, "location": null},
      "non_renewal_notice_period": {"value": "30 дней", "confidence": 0.95, "location": null},
      "non_renewal_notice_form": {"value": "written", "confidence": 0.90, "location": {"clause_ref": "п. 11.2", "page": 6, "quote": "если ни одна из Сторон не уведомит письменно за 30 дней до истечения"}},
      "opt_out_difficulty": {"value": "easy", "confidence": 0.90, "location": null},
      "reason": {"value": "...", "confidence": 0.90, "location": null}
    }
    </output_expectations>

  fields:
    - name: "term_display"
      type: "string"
      presentation: "fact"
      label: "Срок и пролонгация"
      description: "Нормализованный user-facing вывод для DD Grid"
      display_in_grid: true
      display_priority: 1

    - name: "term_and_renewal_status"
      type: "string"
      presentation: "signal"
      risk_weight: "info"
      description: "Наличие регулирования срока договора в тексте"
      display_in_grid: false
      allowed_values:
        - "present"
        - "missing"
        - "unclear"

    - name: "term_type"
      type: "string"
      presentation: "signal"
      risk_weight: "high"
      description: "Тип срока действия"
      display_in_grid: false
      allowed_values:
        - "fixed"
        - "indefinite"
        - "by_event"
        - "unclear"

    - name: "initial_term"
      type: "string"
      presentation: "fact"
      label: "Начальный срок"
      description: "Начальный срок действия договора"
      display_in_grid: true
      display_priority: 2

    - name: "has_auto_renewal"
      type: "string"
      presentation: "signal"
      risk_weight: "high"
      description: "Автоматическая пролонгация"
      display_in_grid: false
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "renewal_period"
      type: "string"
      presentation: "fact"
      label: "Период пролонгации"
      description: "Период каждой автоматической пролонгации"
      display_in_grid: false

    - name: "renewal_limit"
      type: "string"
      presentation: "fact"
      label: "Количество пролонгаций"
