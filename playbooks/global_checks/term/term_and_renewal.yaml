id: "term_and_renewal"
name: "Срок договора и пролонгация"
group: "Terms"
description: >
  Определяет срок действия договора, наличие и условия автопродления
  (evergreen), период и условия отказа от пролонгации, сложность
  процедуры выхода и риск «залипания» в долгосрочном договоре.

  Формирует краткий user-facing вывод.

  Долгосрочные минимальные обязательства (take-or-pay, гарантированные
  объёмы) анализируются чеком sticky_long_term_obligations.

doc_types: []

severity: "medium"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"
ui_mode: "field_extraction"

rules:
  keyword_mode: any

  keywords:
    high:
      # Автоматическая пролонгация / evergreen
      - "(?i)автоматически\\s+продлева[ею]тся"
      - "(?i)автоматическ[а-яая]+\\s+пролонгаци"
      - "(?i)пролонгируется\\s+автоматически"
      - "(?i)automatically\\s+renew(ed|s)?"
      - "(?i)auto[-\\s]?renew(al|ed|s)?"
      - "(?i)\\bevergreen\\b"
      - "(?i)shall\\s+(be\\s+)?renewed?\\s+(automatically|for\\s+(an\\s+)?additional)"
      - "(?i)продлева[ею]тся\\s+на\\s+(очередной|последующ|аналогичн|такой\\s+же)"
      - "(?i)считается\\s+продлённым"

      # Условия отказа от пролонгации
      - "(?i)notice\\s+of\\s+non[-\\s]?renewal"
      - "(?i)уведомлени[ея]\\s+об\\s+отказе\\s+от\\s+(продлени|пролонгаци)"
      - "(?i)opt[-\\s]?out\\s+notice"
      - "(?i)не\\s+менее\\s+чем\\s+за\\s+\\d+\\s+(дн|календарн|рабоч)"
      - "(?i)at\\s+least\\s+\\d+\\s+(days?|months?)\\s+(prior|before|in\\s+advance)"

      # Бессрочность
      - "(?i)until\\s+terminat(ed|ion)"
      - "(?i)до\\s+(момента\\s+)?расторжени[яи]"
      - "(?i)бессрочн[а-яый]"
      - "(?i)indefinite\\s+term"

    medium:
      # Срок действия — общие формулировки
      - "(?i)срок\\s+действи[яи]\\s+(настоящего\\s+)?договор"
      - "(?i)term\\s+of\\s+this\\s+agreement"
      - "(?i)initial\\s+term"
      - "(?i)первоначальн[а-яый]+\\s+срок"
      - "(?i)договор\\s+действует\\s+(до|в\\s+течени)"
      - "(?i)effective\\s+date"
      - "(?i)for\\s+a\\s+period\\s+of"
      - "(?i)на\\s+срок\\s+\\d+"

      # Пролонгация — общие
      - "(?i)renewal\\s+term"
      - "(?i)successive\\s+term"
      - "(?i)последующ[а-яий]+\\s+(период|срок)"
      - "(?i)extension"

      # Сроки уведомления
      - "(?i)\\d+\\s+(дн|календарн|рабоч)[а-я]*\\s+(до|перед)[\\s\\S]{0,20}(продлени|пролонгаци)"
      - "(?i)\\d+\\s+(days?|months?)[\\s\\S]{0,20}(prior|before)[\\s\\S]{0,20}(renewal|expir)"
      - "(?i)notice\\s+period[\\s\\S]{0,20}(renewal|non-renewal)"

      # По событию
      - "(?i)до\\s+полного\\s+исполнени[яи]"
      - "(?i)until\\s+(full\\s+)?performance"
      - "(?i)до\\s+завершения\\s+проекта"

    low:
      - "(?i)автоматически\\s+продлева"
      - "(?i)auto[-\\s]?renew"
      - "(?i)evergreen"
      - "(?i)notice\\s+of\\s+non[-\\s]?renewal"
      - "(?i)бессрочн"
      - "(?i)indefinite\\s+term"
      - "(?i)initial\\s+term"
      - "(?i)срок\\s+действия\\s+договора"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 640

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  retrieval_profile: "term_and_renewal_check"
  context_k: 5
  max_chunks: 10
  
  retrieval_query: >
    срок действия договора term of agreement автоматическая пролонгация auto-renewal 
    evergreen renewal term notice of non-renewal уведомление об отказе от продления бессрочный

  boost_keywords:
    - "срок действия"
    - "срок действия договора"
    - "term of this agreement"
    - "initial term"
    - "вступает в силу"
    - "effective date"
    - "автоматически продлевается"
    - "автоматическая пролонгация"
    - "automatically renewed"
    - "auto-renewal"
    - "evergreen"
    - "renewal term"
    - "пролонгируется"
    - "продление"
    - "уведомление об отказе от продления"
    - "notice of non-renewal"
    - "opt-out notice"
    - "бессрочный"
    - "indefinite term"
    - "until terminated"
    - "до расторжения"
    - "до полного исполнения"

  negative_keywords:
    - "срок оплаты"
    - "срок поставки"
    - "гарантийный срок"
    - "срок исковой давности"
    - "срок годности"

  preferred_unit_types:
    - "general_provision"
    - "termination_provision"

  excluded_unit_types:
    - "technical_fragment"
    - "appendix_reference"
    - "structural_anchor"

  preferred_clause_functions:
    - "boilerplate"
    - "procedures"

  position_bias:
    preferred_range: [0.0, 1.0]
    boost: 0.10
    scope: "segment"

  rerank: true
  filters: {}

conditional: null

enrichment_hints:
  preferred_segment_types:
    - "contract"
    - "amendment"
    - "schedule"
  excluded_segment_types:
    - "technical_specification"
    - "price_list"
    - "invoice"
    - "act"
  preferred_clause_functions:
    - "boilerplate"
    - "procedures"
    - "boilerplate"
  confidence_bonus_on_match: 0.10
  confidence_penalty_on_excluded_segment: 0.15

extraction:
  enabled: true
  mode: "hybrid"
  llm_max_tokens: 1250

  llm_prompt_extraction: |
    <role>
    Ты — юрист по коммерческим договорам.
    Твоя задача — точно извлечь из текста:
    1) тип и начальный срок договора;
    2) есть ли автоматическая пролонгация;
    3) период и количество пролонгаций;
    4) срок и форму уведомления об отказе от продления.

    КРИТИЧЕСКИ ВАЖНО:
    - Извлекай ТОЛЬКО то, что прямо написано в тексте.
    - НЕ делай выводов "по умолчанию" из общих норм права.
    - НЕ додумывай сроки если они не указаны.
    - Если информация отсутствует — ставь "unclear" или
      "Не определён", а не предполагай вариант.
    - Если текст неоднозначен — ставь "unclear".

    Не анализируй take-or-pay и минимальные объёмы.
    </role>

    <context_rules>
    - Ниже приведены фрагменты, отобранные автоматически.
    - Некоторые фрагменты могут быть нерелевантны —
      игнорируй их.
    - Если среди фрагментов есть противоречия —
      укажи "unclear" и объясни в reason.
    - Если ни один фрагмент не содержит информации —
      используй значения для случая "срок не определён".
    - Не используй информацию из определений (definitions),
      преамбулы или приложений, если они не содержат
      substantive условий по теме check.
    </context_rules>

    <context>
    Ниже приведены релевантные фрагменты договора:

    {context}
    </context>

    <task>
    Заполни только следующие поля:
    - term_display
    - term_type
    - initial_term
    - has_auto_renewal
    - renewal_period
    - renewal_limit
    - non_renewal_notice_period
    - non_renewal_notice_form
    - opt_out_difficulty
    - reason

    Общие правила:
    - используй только то, что прямо следует из текста;
    - пиши коротко и по-русски.
    </task>

    <instructions>
    Шаг 1 — ТИП СРОКА

    Заполни "term_type".

    Значения:
    - "fixed" — конкретная дата или чётко определённый период.
    - "indefinite" — бессрочный (until terminated).
    - "by_event" — до наступления события.
    - "unclear" — невозможно определить.

    Шаг 2 — НАЧАЛЬНЫЙ СРОК

    Заполни "initial_term".

    Правила:
    - Если указан: "12 месяцев", "1 год", "до 31.12.2027".
    - Бессрочный: "Бессрочный".
    - По событию: краткое описание события.
    - Не определён в тексте: "Не определён".
    - Нельзя определить: "Не удалось определить".

    Шаг 3 — АВТОМАТИЧЕСКАЯ ПРОЛОНГАЦИЯ

    Заполни "has_auto_renewal".

    Значения:
    - "yes" — прямо указано: "автоматически продлевается",
      "auto-renewal", "evergreen".
    - "no" — прямо указано, что автопродления нет.
    - "unclear" — нет информации.

    Шаг 4 — ПЕРИОД ПРОЛОНГАЦИИ

    Заполни "renewal_period".

    Правила:
    - Если есть: "на 1 год", "12 месяцев",
      "на аналогичный срок".
    - Не указан: "Не указан".
    - Нет auto-renewal: "Не применимо".

    Шаг 5 — КОЛИЧЕСТВО ПРОЛОНГАЦИЙ

    Заполни "renewal_limit".

    Правила:
    - Ограничено: "не более 2 раз", "max 3".
    - Неограниченно: "Неограниченно".
    - Не указано: "Не указано".
    - Нет auto-renewal: "Не применимо".

    Шаг 6 — СРОК УВЕДОМЛЕНИЯ ОБ ОТКАЗЕ

    Заполни "non_renewal_notice_period".

    Правила:
    - Если указан: "30 дней", "90 days", "3 месяца".
    - Автопродление есть, но срок не указан: "Не указан".
    - Тема пролонгации вообще не урегулирована: "Не установлено".
    - Нет auto-renewal: "Не применимо".
    - Нельзя определить: "Не удалось определить".

    Шаг 7 — ФОРМА УВЕДОМЛЕНИЯ

    Заполни "non_renewal_notice_form".

    Значения:
    - "written" — письменно.
    - "registered_mail" — заказное письмо.
    - "email" — электронная почта.
    - "any" — любая форма.
    - "not_specified" — не указана.
    - "unclear" — нельзя определить.

    Шаг 8 — СЛОЖНОСТЬ ОТКАЗА

    Заполни "opt_out_difficulty".

    Значения:
    - "easy" — разумный срок (≥ 30 дней для годовых),
      простая форма.
    - "moderate" — умеренная сложность.
    - "difficult" — короткий срок (< 30 дней для годовых)
      или срок не указан при evergreen.
    - "not_applicable" — нет auto-renewal.
    - "unclear" — неясно.

    Шаг 9 — DISPLAY ДЛЯ DD GRID

    Заполни "term_display".

    Это поле — краткий итог для таблицы.
    Сформируй его на основе уже заполненных полей:
    - term_type
    - initial_term
    - has_auto_renewal
    - renewal_period
    - non_renewal_notice_period
    Не добавляй информацию, которой нет в этих полях.

    Базовый случай:
    - нет данных о сроке:
      "Срок не определён"

    Если данные есть — комбинируй через ";":
    - initial_term
    - has_auto_renewal + renewal_period (если есть)
    - non_renewal_notice_period (если значимо)

    Примеры:
    - "1 год; автопродление на 1 год; отказ за 30 дней"
    - "Бессрочный; нет автопродления"
    - "3 года; автопродление неограниченно; срок отказа не указан"
    - "Срок не определён"
    - "Не удалось определить срок договора"

    Ограничение: не более 4 фактов через ";".

    Шаг 10 — КРАТКОЕ ОБОСНОВАНИЕ

    Заполни "reason".

    Формат:
    - Первое предложение: краткий вывод
      (срок, автопродление, условия отказа).
    - Второе предложение: цитата из текста в кавычках
      (самый релевантный фрагмент, до 100 символов).

    Примеры:
    - "Договор заключён на 1 год с автоматическим
      продлением; отказ за 30 дней.
      «Договор продлевается на каждый последующий год,
      если ни одна из Сторон не уведомит...»."
    - "Срок действия договора не обнаружен
      в представленных фрагментах."
    </instructions>

    <edge_cases>
    - Evergreen + нет notice или notice < 30 дней:
      * opt_out_difficulty = "difficult"

    - Бессрочный без for convenience в тексте:
      * term_type = "indefinite"
      * initial_term = "Бессрочный"
      * has_auto_renewal = "no"

    - Фиксированный 1 год, автопродление, отказ 30 дней:
      * opt_out_difficulty = "easy"
      * term_display = "1 год; автопродление на 1 год;
        отказ за 30 дней"

    - Автопродление без срока уведомления:
      * non_renewal_notice_period = "Не указан"
      * opt_out_difficulty = "difficult"

    - Нет релевантных фрагментов:
      * term_type = "unclear"
      * initial_term = "Не определён"
      * has_auto_renewal = "unclear"
      * term_display = "Срок не определён"
    </edge_cases>

    <output_expectations>
    - Верни результат строго в формате JSON.
    - Не оборачивай в markdown-блоки (без ```).
    - Не добавляй комментариев вне JSON.
    - Все значения полей с allowed_values — на английском
      (как указано в списке).
    - Свободные текстовые поля (term_display, initial_term,
      renewal_period, renewal_limit, non_renewal_notice_period,
      reason) — на русском языке.
    - Не добавляй никаких полей, кроме указанных.

    Пример структуры ответа:
    {
      "term_display": "1 год; автопродление на 1 год; отказ за 30 дней",
      "term_type": "fixed",
      "initial_term": "1 год",
      "has_auto_renewal": "yes",
      "renewal_period": "на 1 год",
      "renewal_limit": "Неограниченно",
      "non_renewal_notice_period": "30 дней",
      "non_renewal_notice_form": "written",
      "opt_out_difficulty": "easy",
      "reason": "Договор на 1 год с автопродлением. «Продлевается автоматически, если не уведомить за 30 дней»."
    }
    </output_expectations>

  fields:
    - name: "term_display"
      type: "string"
      presentation: "fact"
      label: "Срок и пролонгация"
      description: "Нормализованный user-facing вывод для DD Grid"
      display_in_grid: true
      display_priority: 1

    - name: "term_type"
      type: "string"
      presentation: "signal"
      description: "Тип срока действия"
      display_in_grid: false
      allowed_values:
        - "fixed"
        - "indefinite"
        - "by_event"
        - "unclear"

    - name: "initial_term"
      type: "string"
      presentation: "fact"
      label: "Начальный срок"
      description: "Начальный срок действия договора"
      display_in_grid: true
      display_priority: 2

    - name: "has_auto_renewal"
      type: "string"
      presentation: "signal"
      description: "Автоматическая пролонгация"
      display_in_grid: false
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "renewal_period"
      type: "string"
      presentation: "fact"
      label: "Период пролонгации"
      description: "Период каждой автоматической пролонгации"
      display_in_grid: false

    - name: "renewal_limit"
      type: "string"
      presentation: "fact"
      label: "Количество пролонгаций"
      description: "Максимальное количество пролонгаций"
      display_in_grid: false

    - name: "non_renewal_notice_period"
      type: "string"
      presentation: "fact"
      label: "Срок уведомления об отказе"
      description: "Срок уведомления для отказа от автопродления"
      display_in_grid: true
      display_priority: 3

    - name: "non_renewal_notice_form"
      type: "string"
      presentation: "signal"
      description: "Форма уведомления об отказе"
      display_in_grid: false
      allowed_values:
        - "written"
        - "registered_mail"
        - "email"
        - "any"
        - "not_specified"
        - "unclear"

    - name: "opt_out_difficulty"
      type: "string"
      presentation: "signal"
      description: "Сложность отказа от пролонгации"
      display_in_grid: false
      allowed_values:
        - "easy"
        - "moderate"
        - "difficult"
        - "not_applicable"
        - "unclear"

    - name: "reason"
      type: "string"
      presentation: "diagnostic"
      description: "Обоснование"
      display_in_grid: false

  store_payload: true

  
