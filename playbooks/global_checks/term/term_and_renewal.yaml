id: "term_and_renewal"
name: "Срок договора и пролонгация"
description: >
  Определяет срок действия договора, наличие и условия автопродления
  (evergreen), а также условия отказа от пролонгации.

doc_types: []

severity: "medium"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"

rules:
  keywords:
    - "срок действия"
    - "настоящий договор вступает в силу"
    - "договор вступает в силу"
    - "договор действует до"
    - "сроком до"
    - "срок действия договора"
    - "пролонгируется"
    - "автоматически продлевается"
    - "автоматическая пролонгация"
    - "renewal"
    - "evergreen"
    - "term of this agreement"
  keyword_mode: "any"
  regex_patterns: []
  clause_patterns: []

llm:
  prompt_template: |
    <role>
    Ты — юрист по коммерческим договорам.
    Твоя специализация — сроки действия договоров, пролонгация и условия отказа.
    </role>

    <context>
    Ниже приведены фрагменты одного договора:

    {context}
    </context>

    <instructions>
    Определи:

    1) Тип срока действия договора (term_type):
       - fixed — есть конкретная дата окончания или чётко определённый период
         (например, "1 год с даты подписания", "до 31.12.2027");
       - indefinite — договор бессрочный (until terminated);
       - by_event — срок определяется наступлением события
         (до полного исполнения обязательств, до завершения проекта и т.п.);
       - unclear — если из фрагментов нельзя однозначно понять срок.

    2) Автоматическая пролонгация (has_automatic_renewal):
       - указано ли, что договор "автоматически продлевается", "renewed automatically",
         evergreen‑модель и т.п.;
       - если да, определи период пролонгации (renewal_period):
         * например, "на последующие однолетние периоды", "каждый раз на 12 месяцев" и т.п.;
         * если период явно не указан, опиши это в rw‑строке как неясность.

    3) Условия отказа от пролонгации:
       - non_renewal_notice_period:
         * какой срок уведомления об отказе (например, "не менее чем за 30 дней до истечения",
           "за 3 месяца" и т.п.);
       - non_renewal_notice_form:
         * форма уведомления (письменно, заказное письмо, e-mail, через систему и т.п.).
       Если в тексте нет явных указаний — оставь соответствующие строки пустыми или кратко
       опиши, что условия не установлены.

    4) Есть ли ограничения/условия, делающие пролонгацию проблемной:
       - очень короткий срок уведомления (например, менее 30 дней при годовом сроке);
       - длинный период автопродления без реальной возможности отказаться;
       - сложная или односторонняя процедура отказа.
       Учитывай это в оценке overall_risk_level: low / medium / high.

    Сформируй итоговый вывод по структуре срока и пролонгации и оцени риск для Target.
    </instructions>

    <edge_cases>
    ВАЖНО — пограничные случаи:

    — Evergreen с длинными периодами (например, 3 года) и коротким/сложным сроком
      уведомления (например, 60 дней до конца периода): обычно повышенный риск
      для Target, особенно если услуги критичны и смена поставщика сложна.

    — Бессрочный договор (indefinite) без понятной процедуры одностороннего
      расторжения и/или отказа от пролонгации:
      term_type = "indefinite", has_automatic_renewal = "no" (если нет явного renewal),
      risk часто "medium" или "high" в зависимости от контекста.

    — Договор "до полного исполнения обязательств" без календарного ограничения:
      term_type = "by_event", риск зависит от того, можно ли расторгнуть договор
      по иным основаниям.

    — Если текст фрагментарный: видно, что договор вступает в силу, но нет
      данных об окончании или пролонгации:
      term_type = "unclear",
      has_automatic_renewal = "unclear",
      в reason явно указать, что срок и пролонгация не описаны в предоставленных
      фрагментах.

    — Пустые или нерелевантные фрагменты:
      большинство полей = "unclear" или пустые строки,
      overall_risk_level = "medium",
      reason = "Недостаточно данных для анализа срока договора и условий пролонгации."
    </edge_cases>

    <examples>
    ПРИМЕР 1 — ФИКСИРОВАННЫЙ СРОК С ГОДОВОЙ ПРОЛОНГАЦИЕЙ (MEDIUM):

    Фрагмент: "Настоящий Договор вступает в силу с даты подписания и действует
    в течение 1 (одного) года. Если ни одна из Сторон не направит письменное
    уведомление об отказе от пролонгации не менее чем за 30 (тридцать) календарных
    дней до истечения срока действия Договора, он автоматически продлевается
    на каждый последующий год на тех же условиях."

    {{
      "term_type": "fixed",
      "has_automatic_renewal": "yes",
      "renewal_period": "Автоматическая пролонгация на последующие однолетние периоды.",
      "non_renewal_notice_period": "Не менее чем за 30 календарных дней до истечения срока.",
      "non_renewal_notice_form": "Письменное уведомление.",
      "overall_risk_level": "medium",
      "reason": "Фиксированный срок 1 год с ежегодной автоматической пролонгацией и 30-дневным сроком отказа; риск умеренный, зависит от критичности договора для Target."
    }}

    ПРИМЕР 2 — EVERGREEN С ПРОБЛЕМНОЙ ПРОЛОНГАЦИЕЙ (HIGH):

    Фрагмент: "Договор вступает в силу с даты подписания и автоматически продлевается
    на последующие трехлетние периоды, если Клиент не уведомит Поставщика об отказе
    от пролонгации не менее чем за 180 дней до окончания текущего срока."

    {{
      "term_type": "fixed",
      "has_automatic_renewal": "yes",
      "renewal_period": "Автоматическая пролонгация на трехлетние периоды.",
      "non_renewal_notice_period": "Не менее чем за 180 дней до окончания срока.",
      "non_renewal_notice_form": "Письменное уведомление (форма не детализирована).",
      "overall_risk_level": "high",
      "reason": "Длинные периоды пролонгации (3 года) и очень ранний срок уведомления (180 дней) затрудняют отказ от договора и создают высокий риск для Target."
    }}

    ПРИМЕР 3 — БЕССРОЧНЫЙ ДОГОВОР БЕЗ АВТОПРОДЛЕНИЯ (MEDIUM):

    Фрагмент: "Настоящий Договор вступает в силу с даты подписания и действует
    до момента его расторжения любой из Сторон в порядке, предусмотренном
    настоящим Договором."

    {{
      "term_type": "indefinite",
      "has_automatic_renewal": "no",
      "renewal_period": "",
      "non_renewal_notice_period": "Срок уведомления определяется общими условиями расторжения.",
      "non_renewal_notice_form": "Как указано в разделе о расторжении (не детализировано в фрагменте).",
      "overall_risk_level": "medium",
      "reason": "Бессрочный характер договора при отсутствии детализированных условий расторжения может создавать операционный риск для Target."
    }}
    </examples>

    <output_format>
    Твой ответ ДОЛЖЕН быть строго валидным JSON-объектом со следующими
    полями:

    {{
      "term_type": "one of: fixed | indefinite | by_event | unclear",
      "has_automatic_renewal": "one of: yes | no | unclear",
      "renewal_period": "string — краткое описание периода пролонгации или пустая строка",
      "non_renewal_notice_period": "string — краткое описание срока уведомления или пустая строка",
      "non_renewal_notice_form": "string — краткое описание формы уведомления или пустая строка",
      "overall_risk_level": "one of: low | medium | high",
      "reason": "string — краткое объяснение на русском с указанием структуры срока/пролонгации и их влияния на риск для Target"
    }}

    Все перечисленные поля ДОЛЖНЫ присутствовать в JSON, даже если их значение равно null или пустой строке.
    </output_format>

    <constraints>
    ЖЁСТКИЕ ПРАВИЛА:
    1. Выведи ТОЛЬКО один JSON-объект. Никакого текста до или после.
    2. Не пиши "Вот JSON", "Here is the JSON" и т.п.
    3. Не используй Markdown, бэктики ``` или любые обёртки.
    4. Все строки — в двойных кавычках.
    5. Значения перечислимых полей — СТРОГО из указанных вариантов.
    6. Ключи — точно как указано, без добавления новых.
    7. Поле "reason" ДОЛЖНО содержать конкретные выводы о сроке/пролонгации
       и рисках, а не общие фразы вроде "есть риски".
    8. Начни ответ сразу с символа {{
    9. Если по какому‑то полю нет достаточно информации —
       используй 'unclear' или пустую строку для текстовых полей; reason
       не может быть пустым. НЕ придумывай значения, не интерполируй.
    </constraints>
  prompt_file: null
  context_k: 4
  temperature: 0.0
  max_tokens: 512

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 500

retrieval:
  context_k: 4
  max_chunks: 8
  boost_keywords:
    - "срок действия"
    - "пролонгируется"
    - "автоматически продлевается"
    - "term of this agreement"
    - "renewal"
  rerank: true
  filters: {}

conditional: null

extraction:
  enabled: true
  mode: "hybrid"
  fields:
    - name: "term_type"
      type: "string"
      allowed_values:
        - "fixed"
        - "indefinite"
        - "by_event"
        - "unclear"
    - name: "has_automatic_renewal"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
    - name: "renewal_period"
      type: "string"
    - name: "non_renewal_notice_period"
      type: "string"
    - name: "non_renewal_notice_form"
      type: "string"
    - name: "overall_risk_level"
      type: "string"
      allowed_values:
        - "low"
        - "medium"
        - "high"
    - name: "reason"
      type: "string"
  store_payload: true

red_flags:
  items:
    - code: "TERM1"
      description: "Автоматическая пролонгация на длительные периоды без реальной возможности отказаться."
    - code: "TERM2"
      description: "Короткий или неясный срок уведомления об отказе от пролонгации."
      