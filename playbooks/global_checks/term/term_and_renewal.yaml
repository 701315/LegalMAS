id: "term_and_renewal"
name: "Срок договора и пролонгация"
description: >
  Определяет срок действия договора, наличие и условия автопродления
  (evergreen), а также условия отказа от пролонгации.

doc_types: []

severity: "medium"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"

rules:
  keywords:
    - "срок действия"
    - "настоящий договор вступает в силу"
    - "договор вступает в силу"
    - "договор действует до"
    - "сроком до"
    - "срок действия договора"
    - "пролонгируется"
    - "автоматически продлевается"
    - "автоматическая пролонгация"
    - "renewal"
    - "evergreen"
    - "term of this agreement"
  keyword_mode: "any"
  regex_patterns: []
  clause_patterns: []

llm:
  prompt_template: |
    <role>
    Ты — юрист по коммерческим договорам.
    Твоя специализация — сроки действия договоров, пролонгация и условия отказа.
    </role>

    <context>
    Ниже приведены фрагменты одного договора:

    {context}
    </context>

    <instructions>
    Проведи анализ по шагам. Каждый шаг логически связан с одним или
    несколькими полями итоговой оценки.

    Шаг 1 — ТИП СРОКА ДЕЙСТВИЯ ДОГОВОРА
    (используется для "term_type"):
    - Определи, как задан срок действия договора:
      * fixed — есть конкретная дата окончания или чётко определённый период
        (например, "1 год с даты подписания", "до 31.12.2027");
      * indefinite — договор бессрочный (until terminated, действует до расторжения);
      * by_event — срок определяется наступлением события
        (до полного исполнения обязательств, до завершения проекта и т.п.);
      * unclear — если из предоставленных фрагментов нельзя однозначно понять срок.
    - Зафиксируй одно из значений: fixed / indefinite / by_event / unclear.

    Шаг 2 — НАЛИЧИЕ АВТОМАТИЧЕСКОЙ ПРОЛОНГАЦИИ
    (используется для "has_automatic_renewal" и "renewal_period"):
    - Определи, указано ли, что договор:
      * "автоматически продлевается", "renewed automatically", имеет evergreen‑модель и т.п.;
      * при отсутствии специальных формулировок о продлении считай, что автоматической пролонгации нет.
    - Для "has_automatic_renewal" установи:
      * "yes" — если автопродление явно предусмотрено;
      * "no" — если из текста следует, что пролонгация не автоматическая;
      * "unclear" — если данных недостаточно.
    - Если автопродление есть, кратко опиши период пролонгации в "renewal_period":
      * например, "на последующие однолетние периоды", "каждый раз на 12 месяцев";
      * если период прямо не указан, опиши эту неопределённость.

    Шаг 3 — УСЛОВИЯ ОТКАЗА ОТ ПРОЛОНГАЦИИ
    (используется для "non_renewal_notice_period" и "non_renewal_notice_form"):
    - Выдели условия отказа от автопродления (если оно есть) или от продолжения договора:
      * non_renewal_notice_period — какой срок уведомления (например,
        "не менее чем за 30 дней до истечения", "за 3 месяца" и т.п.);
      * non_renewal_notice_form — форма уведомления
        (письменно, заказное письмо, e‑mail, через систему и т.п.).
    - Если явных указаний нет:
      * оставь соответствующие строки пустыми или укажи, что условия не установлены,
        без выдумывания конкретных сроков/форм.

    Шаг 4 — ОСОБЫЕ УСЛОВИЯ, ДЕЛАЮЩИЕ ПРОЛОНГАЦИЮ ПРОБЛЕМНОЙ
    (используется при оценке "overall_risk_level" и "reason"):
    - Определи, есть ли в структуре срока и пролонгации признаки повышенного риска:
      * очень короткий срок уведомления (например, менее 30 дней при годовом сроке),
        затрудняющий отказ;
      * длинный период автопродления (например, 3 года и более) при evergreen‑модели;
      * сложная, односторонняя или чрезмерно формализованная процедура отказа
        (например, только по оригиналу письма за 180 дней).
    - Эти факторы не отражаются в отдельных полях, но обязательно учитываются
      в итоговой оценке риска и тексте "reason".

    Шаг 5 — ОБЩИЙ РИСК ДЛЯ TARGET
    (используется для "overall_risk_level" и "reason"):
    - Учитывая результаты шагов 1–4, оцени общий риск для Target:
      * насколько структура срока (fixed / indefinite / by_event) и наличие
        автопродления ограничивают гибкость Target;
      * насколько сроки и форма уведомления об отказе от пролонгации реалистичны;
      * есть ли риск «залипания» в долгосрочном договоре без удобного выхода.
    - Сформулируй общий риск как:
      * "low" — понятный срок, отсутствие навязчивого evergreen или простые условия отказа;
      * "medium" — есть автопродление или бессрочность, но условия отказа
        выглядят управляемыми;
      * "high" — длинные периоды пролонгации, ранние и жёсткие сроки уведомления,
        отсутствие понятной возможности выйти из договора.
    - В "reason" кратко обоснуй вывод, ссылаясь на ключевые формулировки
      (желательно с короткими цитатами), и поясни, как структура срока/пролонгации
      влияет на операционную гибкость и риск для Target.
    </instructions>

    <edge_cases>
    Обрабатывай пограничные ситуации так:

    - Evergreen с длинными периодами (например, 3 года) и коротким/сложным сроком
      уведомления (например, 60–180 дней до конца периода):
      учитывай это как повышенный риск для Target, особенно если услуги критичны
      и смена поставщика сложна.

    - Бессрочный договор (indefinite) без понятной процедуры одностороннего
      расторжения и/или отказа от пролонгации:
      term_type = "indefinite", has_automatic_renewal = "no" (если нет явного renewal);
      риск часто "medium" или "high" в зависимости от иных условий расторжения.

    - Договор "до полного исполнения обязательств" без календарного ограничения:
      term_type = "by_event"; риск зависит от того, предусмотрены ли
      другие механизмы расторжения и насколько предсказуемо событие окончания.

    - Текст фрагментарный: видно, что договор вступает в силу, но нет
      данных об окончании или пролонгации:
      term_type = "unclear",
      has_automatic_renewal = "unclear",
      в reason явно укажи, что срок и пролонгация не описаны в предоставленных фрагментах.

    - Пустые или нерелевантные фрагменты:
      по большинству полей используй "unclear" или пустые строки,
      overall_risk_level = "medium",
      reason = "Недостаточно данных для анализа срока договора и условий пролонгации."
    </edge_cases>

    <output_expectations>
    На основе твоего анализа отдельный механизм извлечения сформирует
    структурированные поля по заранее заданной схеме. Твоя задача —
    давать чёткие юридические выводы и указывать конкретные формулировки
    из текста, на которых они основаны.
    </output_expectations>
  prompt_file: null
  context_k: 4
  temperature: 0.0
  max_tokens: 512

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 500

retrieval:
  context_k: 4
  max_chunks: 8
  boost_keywords:
    - "срок действия"
    - "пролонгируется"
    - "автоматически продлевается"
    - "term of this agreement"
    - "renewal"
  rerank: true
  filters: {}

conditional: null

extraction:
  enabled: true
  mode: "hybrid"
  fields:
    - name: "term_type"
      type: "string"
      allowed_values:
        - "fixed"
        - "indefinite"
        - "by_event"
        - "unclear"

    - name: "has_automatic_renewal"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "renewal_period"
      type: "string"

    - name: "non_renewal_notice_period"
      type: "string"

    - name: "non_renewal_notice_form"
      type: "string"

    - name: "overall_risk_level"
      type: "string"
      allowed_values:
        - "low"
        - "medium"
        - "high"

    - name: "reason"
      type: "string"

  store_payload: true

red_flags:
  items:
    - code: "TERM1"
      description: "Автоматическая пролонгация на длительные периоды без реальной возможности отказаться."
    - code: "TERM2"
      description: "Короткий или неясный срок уведомления об отказе от пролонгации."
