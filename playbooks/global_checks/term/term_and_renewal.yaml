id: "term_and_renewal"
name: "Срок договора и пролонгация"
description: >
  Определяет срок действия договора, наличие и условия автопродления
  (evergreen), период и условия отказа от пролонгации, сложность
  процедуры выхода и риск «залипания» в долгосрочном договоре.

  Формирует краткий user-facing вывод.

  Долгосрочные минимальные обязательства (take-or-pay, гарантированные
  объёмы) анализируются чеком sticky_long_term_obligations.

doc_types: []

severity: "medium"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"
ui_mode: "field_extraction"

rules:
  keyword_mode: any

  keywords:
    high:
      # Автоматическая пролонгация / evergreen
      - "(?i)автоматически\\s+продлева[ею]тся"
      - "(?i)автоматическ[а-яая]+\\s+пролонгаци"
      - "(?i)пролонгируется\\s+автоматически"
      - "(?i)automatically\\s+renew(ed|s)?"
      - "(?i)auto[-\\s]?renew(al|ed|s)?"
      - "(?i)\\bevergreen\\b"
      - "(?i)shall\\s+(be\\s+)?renewed?\\s+(automatically|for\\s+(an\\s+)?additional)"
      - "(?i)продлева[ею]тся\\s+на\\s+(очередной|последующ|аналогичн|такой\\s+же)"
      - "(?i)считается\\s+продлённым"

      # Условия отказа от пролонгации
      - "(?i)notice\\s+of\\s+non[-\\s]?renewal"
      - "(?i)уведомлени[ея]\\s+об\\s+отказе\\s+от\\s+(продлени|пролонгаци)"
      - "(?i)opt[-\\s]?out\\s+notice"
      - "(?i)не\\s+менее\\s+чем\\s+за\\s+\\d+\\s+(дн|календарн|рабоч)"
      - "(?i)at\\s+least\\s+\\d+\\s+(days?|months?)\\s+(prior|before|in\\s+advance)"

      # Бессрочность
      - "(?i)until\\s+terminat(ed|ion)"
      - "(?i)до\\s+(момента\\s+)?расторжени[яи]"
      - "(?i)бессрочн[а-яый]"
      - "(?i)indefinite\\s+term"

    medium:
      # Срок действия — общие формулировки
      - "(?i)срок\\s+действи[яи]\\s+(настоящего\\s+)?договор"
      - "(?i)term\\s+of\\s+this\\s+agreement"
      - "(?i)initial\\s+term"
      - "(?i)первоначальн[а-яый]+\\s+срок"
      - "(?i)договор\\s+действует\\s+(до|в\\s+течени)"
      - "(?i)effective\\s+date"
      - "(?i)for\\s+a\\s+period\\s+of"
      - "(?i)на\\s+срок\\s+\\d+"

      # Пролонгация — общие
      - "(?i)renewal\\s+term"
      - "(?i)successive\\s+term"
      - "(?i)последующ[а-яий]+\\s+(период|срок)"
      - "(?i)extension"

      # Сроки уведомления
      - "(?i)\\d+\\s+(дн|календарн|рабоч)[а-я]*\\s+(до|перед)[\\s\\S]{0,20}(продлени|пролонгаци)"
      - "(?i)\\d+\\s+(days?|months?)[\\s\\S]{0,20}(prior|before)[\\s\\S]{0,20}(renewal|expir)"
      - "(?i)notice\\s+period[\\s\\S]{0,20}(renewal|non-renewal)"

      # По событию
      - "(?i)до\\s+полного\\s+исполнени[яи]"
      - "(?i)until\\s+(full\\s+)?performance"
      - "(?i)до\\s+завершения\\s+проекта"

    low:
      - "(?i)автоматически\\s+продлева"
      - "(?i)auto[-\\s]?renew"
      - "(?i)evergreen"
      - "(?i)notice\\s+of\\s+non[-\\s]?renewal"
      - "(?i)бессрочн"
      - "(?i)indefinite\\s+term"
      - "(?i)initial\\s+term"
      - "(?i)срок\\s+действия\\s+договора"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 640

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  context_k: 5
  max_chunks: 10
  boost_keywords:
    - "срок действия"
    - "срок действия договора"
    - "term of this agreement"
    - "initial term"
    - "вступает в силу"
    - "effective date"
    - "автоматически продлевается"
    - "автоматическая пролонгация"
    - "automatically renewed"
    - "auto-renewal"
    - "evergreen"
    - "renewal term"
    - "пролонгируется"
    - "продление"
    - "уведомление об отказе от продления"
    - "notice of non-renewal"
    - "opt-out notice"
    - "бессрочный"
    - "indefinite term"
    - "until terminated"
    - "до расторжения"
    - "до полного исполнения"
  rerank: true
  filters: {}

conditional: null

enrichment_hints:
  preferred_segment_types:
    - "contract"
    - "amendment"
    - "schedule"
  excluded_segment_types:
    - "technical_specification"
    - "price_list"
    - "invoice"
    - "act"
  preferred_clause_functions:
    - "termination"
    - "general_provisions"
  confidence_bonus_on_match: 0.08
  confidence_penalty_on_excluded_segment: 0.15

extraction:
  enabled: true
  mode: "hybrid"
  llm_max_tokens: 420
  llm_prompt_extraction: |
    <role>
    Ты — юрист по коммерческим договорам.
    Твоя задача — точно извлечь из текста:
    1) тип и начальный срок договора;
    2) есть ли автоматическая пролонгация;
    3) период и количество пролонгаций;
    4) срок и форму уведомления об отказе от продления.

    Не анализируй долгосрочные минимальные обязательства
    (take-or-pay) — это задача чека sticky_long_term_obligations.
    </role>

    <context>
    Ниже приведены релевантные фрагменты договора:

    {context}
    </context>

    <task>
    Заполни только следующие поля:
    - term_display
    - term_type
    - initial_term
    - has_auto_renewal
    - renewal_period
    - renewal_limit
    - non_renewal_notice_period
    - non_renewal_notice_form
    - opt_out_difficulty
    - red_flags
    - reason

    Важно:
    - не придумывай сроки если они не указаны;
    - пиши user-facing значения коротко и по-русски.
    </task>

    <instructions>
    Шаг 1 — ТИП СРОКА ДЕЙСТВИЯ

    Заполни поле "term_type".

    Значения:
    - "fixed" — конкретная дата окончания или чётко
      определённый период.
    - "indefinite" — бессрочный (until terminated).
    - "by_event" — до наступления события (до исполнения,
      до завершения проекта).
    - "unclear" — невозможно определить.

    Шаг 2 — НАЧАЛЬНЫЙ СРОК

    Заполни поле "initial_term".

    Правила:
    - Если указан: "12 месяцев", "1 год", "до 31.12.2027",
      "3 года с даты подписания"
    - Если не определён: "Не определён"

    Шаг 3 — АВТОМАТИЧЕСКАЯ ПРОЛОНГАЦИЯ

    Заполни поле "has_auto_renewal".

    Значения:
    - "yes" — есть: "автоматически продлевается",
      "automatically renewed", "evergreen".
    - "no" — нет.
    - "unclear" — неясно.

    Шаг 4 — ПЕРИОД ПРОЛОНГАЦИИ

    Заполни поле "renewal_period".

    Правила:
    - Если есть: "на 1 год", "12 месяцев", "на аналогичный срок"
    - Если не указан: "Не указан"
    - Если нет auto-renewal: "Не применимо"

    Шаг 5 — КОЛИЧЕСТВО ПРОЛОНГАЦИЙ

    Заполни поле "renewal_limit".

    Правила:
    - Если ограничено: "не более 2 раз", "max 3 renewals"
    - Если неограничено: "Неограниченно"
    - Если не указано: "Не указано"
    - Если нет auto-renewal: "Не применимо"

    Шаг 6 — СРОК УВЕДОМЛЕНИЯ ОБ ОТКАЗЕ

    Заполни поле "non_renewal_notice_period".

    Правила:
    - Если указан: "30 дней", "90 days", "3 месяца"
    - Если не указан: "Не указан"
    - Если нет auto-renewal: "Не применимо"

    Шаг 7 — ФОРМА УВЕДОМЛЕНИЯ

    Заполни поле "non_renewal_notice_form".

    Значения:
    - "written" — письменно.
    - "registered_mail" — заказное письмо.
    - "email" — по электронной почте.
    - "any" — любая форма.
    - "not_specified" — не указана.
    - "unclear" — неясно.

    Шаг 8 — СЛОЖНОСТЬ ОТКАЗА ОТ ПРОЛОНГАЦИИ

    Заполни поле "opt_out_difficulty".

    Значения:
    - "easy" — разумный срок уведомления (≥ 30 дней для
      годовых contract), простая форма.
    - "moderate" — умеренная сложность.
    - "difficult" — короткий срок (< 30 дней для годовых)
      или сложная форма или не указан.
    - "not_applicable" — нет auto-renewal.
    - "unclear" — неясно.

    Шаг 9 — RED FLAGS

    Заполни поле "red_flags".

    Используй:
    - "NONE" — срок понятный, auto-renewal отсутствует
      или условия отказа разумные.
    - "UNCLEAR" — данных недостаточно.
    - Коды через запятую:
      * TERM1 — auto-renewal на длительные периоды без
        реальной возможности отказаться (длинный renewal +
        opt_out_difficulty = "difficult").
      * TERM2 — короткий или неясный срок уведомления об отказе:
        Target рискует пропустить окно.
      * TERM3 — бессрочный договор без понятного механизма
        одностороннего выхода (term_type = "indefinite" +
        нет for convenience в тексте).

    Шаг 10 — USER-FACING SUMMARY

    Заполни поле "term_display".

    Примеры:
    - "1 год; автопродление на 1 год; отказ за 30 дней"
    - "Бессрочный; нет автопродления; нет права выхода"
    - "3 года; автопродление неограниченно; отказ не указан"
    - "Срок не определён"

    Правила:
    - Отрази максимум 3–4 ключевых факта через ";".
    - Если нет данных: "Срок не определён"

    Шаг 11 — ОБОСНОВАНИЕ

    Заполни поле "reason".

    Правила:
    - 1–2 коротких предложения.
    - Укажи: срок, автопродление, условия отказа, почему
      red_flags.
    - Приведи короткую цитату в кавычках.
    - Если NONE — почему конструкция разумная.
    </instructions>

    <edge_cases>
    - Evergreen с длинными периодами (3+ года), короткий / не указан
      срок уведомления:
      * has_auto_renewal = "yes"
      * opt_out_difficulty = "difficult"
      * red_flags = "TERM1, TERM2"

    - Бессрочный, нет for convenience в доступных фрагментах:
      * term_type = "indefinite"
      * red_flags = "TERM3"

    - Бессрочный, но with for convenience 30 дней:
      * term_type = "indefinite"
      * red_flags = "NONE" (выход простой)

    - Фиксированный 1 год, автопродление на 1 год, отказ 30 дней:
      * opt_out_difficulty = "easy"
      * red_flags = "NONE"

    - Автопродление без указания срока уведомления:
      * non_renewal_notice_period = "Не указан"
      * red_flags включает "TERM2"

    - Нет релевантных фрагментов:
      * все поля = "unclear"
      * red_flags = "UNCLEAR"
      * term_display = "Срок не определён"
    </edge_cases>

    <output_expectations>
    Все значения должны быть короткими, точными и пригодными
    для отображения пользователю в DD Grid.
    Не добавляй никаких полей, кроме указанных в схеме extraction.
    </output_expectations>

  fields:
    - name: "term_display"
      type: "string"
      description: "Срок и пролонгация: краткий вывод"

    - name: "term_type"
      type: "string"
      description: "Тип срока действия"
      allowed_values:
        - "fixed"
        - "indefinite"
        - "by_event"
        - "unclear"

    - name: "initial_term"
      type: "string"
      description: "Начальный срок договора"

    - name: "has_auto_renewal"
      type: "string"
      description: "Автоматическая пролонгация"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "renewal_period"
      type: "string"
      description: "Период пролонгации"

    - name: "renewal_limit"
      type: "string"
      description: "Количество пролонгаций"

    - name: "non_renewal_notice_period"
      type: "string"
      description: "Срок уведомления об отказе"

    - name: "non_renewal_notice_form"
      type: "string"
      description: "Форма уведомления об отказе"
      allowed_values:
        - "written"
        - "registered_mail"
        - "email"
        - "any"
        - "not_specified"
        - "unclear"

    - name: "opt_out_difficulty"
      type: "string"
      description: "Сложность отказа от пролонгации"
      allowed_values:
        - "easy"
        - "moderate"
        - "difficult"
        - "not_applicable"
        - "unclear"

    - name: "red_flags"
      type: "string"
      description: "Коды рисков"

    - name: "reason"
      type: "string"
      description: "Обоснование"

  store_payload: true

  