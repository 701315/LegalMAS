id: "termination_grounds"
name: "Основания досрочного расторжения"
group: "Terms"
description: >
  Анализирует основания для досрочного расторжения: по вине (for cause),
  без причины (for convenience), при смене контроля, банкротстве,
  санкциях / изменении законодательства. Оценивает cure periods,
  баланс прав между сторонами и асимметрию.

  Формирует краткий user-facing вывод и оценивает риск одностороннего
  выхода контрагента или «заперания» Target в договоре.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"
ui_mode: "field_extraction"

rules:
  keyword_mode: any

  keywords:
    high:
      - "(?i)termination\\s+for\\s+convenience"
      - "(?i)terminate[d]?\\s+at\\s+(its?|any\\s+party'?s?)\\s+(sole\\s+)?discretion"
      - "(?i)terminat[e]?\\s+without\\s+cause"
      - "(?i)terminat[e]?\\s+for\\s+any\\s+reason"
      - "(?i)односторонн[а-яий]+\\s+отказ"
      - "(?i)расторгнуть\\s+[\\s\\S]{0,30}без\\s+указания\\s+причин"
      - "(?i)расторгнуть\\s+[\\s\\S]{0,30}по\\s+(собственному\\s+)?усмотрени"
      - "(?i)termination\\s+for\\s+cause"
      - "(?i)material\\s+breach"
      - "(?i)существенн[а-яое]+\\s+нарушени[ея]"
      - "(?i)terminat[e]?\\s+[\\s\\S]{0,40}(material\\s+breach|default|violation)"
      - "(?i)расторгнуть\\s+[\\s\\S]{0,40}существенн[а-яого]+\\s+нарушени[яи]"
      - "(?i)change\\s+of\\s+control[\\s\\S]{0,40}terminat"
      - "(?i)terminat[\\s\\S]{0,30}change\\s+of\\s+control"
      - "(?i)расторжени[ея]\\s+[\\s\\S]{0,30}смене\\s+контрол"
      - "(?i)\\binsolvency\\b[\\s\\S]{0,30}terminat"
      - "(?i)\\bbankruptcy\\b[\\s\\S]{0,30}terminat"
      - "(?i)банкротств[оа][\\s\\S]{0,30}расторж"
      - "(?i)liquidation[\\s\\S]{0,30}terminat"
      - "(?i)winding[-\\s]?up[\\s\\S]{0,30}terminat"
      - "(?i)ликвидаци[яи][\\s\\S]{0,30}расторж"

    medium:
      - "(?i)право\\s+расторгнуть"
      - "(?i)right\\s+to\\s+terminate"
      - "(?i)may\\s+terminate"
      - "(?i)вправе\\s+расторгнуть"
      - "(?i)cure\\s+period"
      - "(?i)grace\\s+period"
      - "(?i)срок\\s+(для\\s+)?устранени[яи]"
      - "(?i)within\\s+\\d+\\s+(days?|business\\s+days?)[\\s\\S]{0,20}(cure|remedy|rectify)"
      - "(?i)в\\s+течени[ие]\\s+\\d+\\s+(дн|рабочих)[\\s\\S]{0,20}устранить"
      - "(?i)notice\\s+of\\s+termination"
      - "(?i)уведомлени[ея]\\s+о\\s+расторжени"
      - "(?i)\\d+\\s+(days?|months?)[\\s\\S]{0,10}(prior\\s+)?notice[\\s\\S]{0,20}terminat"
      - "(?i)уведомив\\s+за\\s+\\d+\\s+(дн|рабоч)[\\s\\S]{0,20}расторж"
      - "(?i)termination[\\s\\S]{0,30}sanction"
      - "(?i)расторжени[ея][\\s\\S]{0,30}санкци"
      - "(?i)termination[\\s\\S]{0,30}(change\\s+in\\s+law|change\\s+of\\s+law)"
      - "(?i)расторжени[ея][\\s\\S]{0,30}изменени[яи]\\s+законодательств"
      - "(?i)illegality[\\s\\S]{0,30}terminat"
      - "(?i)невозможность\\s+исполнени[яи][\\s\\S]{0,30}расторж"
      - "(?i)risk\\s+of\\s+sanctions[\\s\\S]{0,30}terminat"
      - "(?i)риск\\s+санкций[\\s\\S]{0,30}расторж"

    low:
      - "(?i)termination\\s+for\\s+cause"
      - "(?i)termination\\s+for\\s+convenience"
      - "(?i)material\\s+breach"
      - "(?i)существенное\\s+нарушение"
      - "(?i)cure\\s+period"
      - "(?i)срок\\s+устранения"
      - "(?i)insolvency"
      - "(?i)bankruptcy"
      - "(?i)банкротство"
      - "(?i)sanctions[\\s\\S]{0,20}terminat"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 640

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  retrieval_profile: "termination_check"
  context_k: 5
  max_chunks: 10
  
  retrieval_query: >
    основания расторжения termination for cause convenience material breach cure period 
    односторонний отказ change of control insolvency bankruptcy sanctions 
    уведомление о расторжении

  boost_keywords:
    - "termination for cause"
    - "termination for convenience"
    - "material breach"
    - "существенное нарушение"
    - "расторгнуть договор"
    - "односторонний отказ"
    - "right to terminate"
    - "право расторгнуть"
    - "change of control"
    - "смена контроля"
    - "insolvency"
    - "bankruptcy"
    - "банкротство"
    - "sanctions"
    - "санкции"
    - "risk of sanctions"
    - "change in law"
    - "изменение законодательства"
    - "cure period"
    - "срок устранения"
    - "grace period"
    - "notice of termination"
    - "уведомление о расторжении"
    - "terminate without cause"
    - "без указания причин"

  negative_keywords:
    - "порядок приемки"
    - "условия оплаты"
    - "интеллектуальная собственность"

  preferred_unit_types:
    - "termination_provision"
    - "general_provision"

  excluded_unit_types:
    - "technical_fragment"
    - "appendix_reference"
    - "structural_anchor"

  preferred_clause_functions:
    - "procedures"

  position_bias:
    preferred_range: [0.0, 1.0]
    boost: 0.10
    scope: "segment"

  rerank: true
  filters: {}

conditional: null

enrichment_hints:
  preferred_segment_types:
    - "contract"
    - "amendment"
    - "annex"
  excluded_segment_types:
    - "technical_specification"
    - "price_list"
    - "invoice"
    - "act"
    - "schedule"
  preferred_clause_functions:
    - "procedures"
    - "boilerplate"
  confidence_bonus_on_match: 0.10
  confidence_penalty_on_excluded_segment: 0.15

extraction:
  enabled: true
  mode: "hybrid"
  llm_max_tokens: 1450

  presence_signal:
    field: "termination_grounds_status"
    present_values: ["present"]
    missing_values: ["missing"]
    unclear_values: ["unclear"]

  llm_prompt_extraction: |
    <role>
    Ты — юрист по коммерческим договорам и M&A.
    Твоя задача — точно извлечь из текста:
    1) есть ли в договоре регулирование оснований расторжения;
    2) если есть — какие основания предусмотрены:
       - for cause (по вине);
       - for convenience (без причины);
       - при смене контроля;
       - при банкротстве;
       - при санкциях / изменении закона;
       - cure period;
       - баланс прав между сторонами.

    КРИТИЧЕСКИ ВАЖНО:
    - Извлекай ТОЛЬКО то, что прямо написано в тексте.
    - НЕ делай выводов "по умолчанию" из общих норм права.
    - НЕ додумывай основания расторжения, которых нет в тексте.
    - Если ни один фрагмент не содержит информации об основаниях
      расторжения (нет упоминаний termination / расторжения /
      for cause / for convenience) — termination_grounds_status = "missing".
    - Если тексты по теме есть, но вывод сделать нельзя —
      termination_grounds_status = "unclear".

    Чётко различай for cause (за нарушение) и for convenience
    (без причины).
    Не путай cure period расторжения с FM grace period.
    </role>

    <context_rules>
    - Ниже приведены фрагменты, отобранные автоматически.
    - Некоторые фрагменты могут быть нерелевантны —
      игнорируй их.
    - Если среди фрагментов есть противоречия —
      укажи "unclear" и объясни в reason.
    - Не используй информацию из определений (definitions),
      преамбулы или приложений, если они не содержат
      substantive условий по теме check.
    - Если ни один фрагмент не содержит информации об основаниях
      расторжения (нет упоминаний termination / расторжения /
      for cause / for convenience) — termination_grounds_status = "missing",
      location = null. Не использовать "unclear" при полном отсутствии
      релевантных фрагментов.
    </context_rules>

    <context>
    Ниже приведены релевантные фрагменты договора:

    {context}
    </context>

    <task>
    Заполни только следующие поля:
    - termination_grounds_display
    - termination_grounds_status
    - for_cause
    - has_cure_period
    - cure_period_days
    - for_convenience
    - convenience_notice_days
    - on_change_of_control
    - on_insolvency
    - on_sanctions_or_law_change
    - rights_balance
    - reason
    </task>

    <location_instructions>
    Для каждого поля по возможности укажи location в формате:
    {"clause_ref": "п. 12.1", "page": 7, "quote": "дословная фраза из договора"}

    Правила:
    - clause_ref — короткая ссылка на пункт / раздел / статью именно в том
      виде, как она написана в договоре;
    - page — целое число страницы;
    - quote — дословная фраза из текста договора (НЕ пересказ, НЕ парафраз).
      Копируй её посимвольно, сохраняя формулировку и порядок слов.
      Оптимальная длина: 30–300 символов.
    - Для synthesized-полей (termination_grounds_display,
      cure_period_days, convenience_notice_days, reason)
      location ВСЕГДА null.
    - Для termination_grounds_status = "missing" — location = null.
    - Для termination_grounds_status = "present" / "unclear" — quote
      с фразой-основанием.
    - Для for_cause, has_cure_period, for_convenience,
      on_change_of_control, on_insolvency, on_sanctions_or_law_change,
      rights_balance:
      * если значение определённое ("mutual" / "yes" /
        "target_only" / "balanced" и т.п.) — quote с фразой-основанием;
      * если "no" / "none" — различай: прямое исключение
        (quote обязательна) vs отсутствие упоминания (location = null);
      * если "unclear" — location = null.
    - Не выдумывай location или quote. Если дословную фразу определить
      нельзя — location = null.
    </location_instructions>

    <instructions>
    Шаг 0 — НАЛИЧИЕ РЕГУЛИРОВАНИЯ ОСНОВАНИЙ РАСТОРЖЕНИЯ

    Заполни "termination_grounds_status".

    Значения:
    - "present" — если хотя бы одно содержательное signal-поле
      указывает на наличие информации по теме:
      * for_cause ∈ {"mutual", "target_only", "counterparty_only"};
      * for_convenience ∈ {"mutual", "target_only", "counterparty_only"};
      * on_change_of_control = "yes";
      * on_insolvency = "yes";
      * on_sanctions_or_law_change ∈ {"yes_objective", "yes_risk_based"};
      * has_cure_period = "yes";
      * ЛИБО любое поле = "no" / "none", но с заполненным location
        с прямой цитатой (см. RF3).
    - "missing" — если все содержательные поля = "no" / "none" БЕЗ цитат,
      ЛИБО фрагментов по теме нет вообще.
    - "unclear" — если все содержательные = "unclear" при наличии
      фрагментов, но невозможности вывода.

    Шаг 1 — FOR CAUSE

    Заполни "for_cause".

    Значения:
    - "mutual" — право у обеих сторон.
    - "target_only" — только у Target.
    - "counterparty_only" — только у контрагента.
    - "none" — не предусмотрено.
    - "unclear" — неясно.

    Шаг 2 — CURE PERIOD

    Заполни "has_cure_period" и "cure_period_days".

    Значения для has_cure_period:
    - "yes" — cure period предусмотрен.
    - "no" — не предусмотрен.
    - "unclear" — неясно.

    Для cure_period_days:
    - Если указан: "30 дней", "10 рабочих дней".
    - For cause есть, но cure не указан: "Не указан".
    - For cause не предусмотрен: "Не применимо".
    - Нельзя определить: "Не удалось определить".

    Шаг 3 — FOR CONVENIENCE

    Заполни "for_convenience".

    Значения:
    - "mutual" — право у обеих сторон.
    - "target_only" — только у Target.
    - "counterparty_only" — только у контрагента.
    - "none" — не предусмотрено.
    - "unclear" — неясно.

    Шаг 4 — СРОК ПРИ FOR CONVENIENCE

    Заполни "convenience_notice_days".

    Правила:
    - Если указан: "30 дней", "90 дней", "3 месяца".
    - For convenience есть, срок не указан: "Не указан".
    - For convenience не предусмотрен: "Не применимо".
    - Нельзя определить: "Не удалось определить".

    Шаг 5 — РАСТОРЖЕНИЕ ПРИ CoC

    Заполни "on_change_of_control".

    Значения:
    - "yes" — расторжение при CoC предусмотрено.
    - "no" — не предусмотрено.
    - "unclear" — неясно.

    Шаг 6 — РАСТОРЖЕНИЕ ПРИ БАНКРОТСТВЕ

    Заполни "on_insolvency".

    Значения:
    - "yes" — расторжение при банкротстве предусмотрено.
    - "no" — не предусмотрено.
    - "unclear" — неясно.

    Шаг 7 — РАСТОРЖЕНИЕ ПРИ САНКЦИЯХ / LAW CHANGE

    Заполни "on_sanctions_or_law_change".

    Значения:
    - "yes_objective" — только при фактическом запрете.
    - "yes_risk_based" — при "риске нарушения" или
      субъективной оценке контрагента.
    - "no" — не предусмотрено.
    - "unclear" — неясно.

    Шаг 8 — БАЛАНС ПРАВ

    Заполни "rights_balance".

    Значения:
    - "balanced" — права симметричны.
    - "favors_target" — Target имеет больше прав.
    - "favors_counterparty" — контрагент имеет больше прав.
    - "unclear" — неясно.

    Шаг 9 — DISPLAY ДЛЯ DD GRID

    Заполни "termination_grounds_display".

    Это итоговое поле для таблицы.
    Строй его ТОЛЬКО на основе уже заполненных полей выше.
    Не добавляй информацию сверх них.

    Правила:
    - Если termination_grounds_status = "missing":
      "Не удалось определить основания расторжения"
    - Если все поля unclear:
      "Не удалось определить основания расторжения"
    - Иначе комбинируй через ";":
      * for_cause (кратко)
      * has_cure_period + cure_period_days
      * for_convenience + convenience_notice_days
      * on_change_of_control (если "yes")
      * on_sanctions_or_law_change (если "yes_risk_based": предупредить)
      * rights_balance (если не "balanced")
    - Не более 4 фактов через ";".

    Шаг 10 — КРАТКОЕ ОБОСНОВАНИЕ

    Заполни "reason".

    Правила:
    - Первое предложение — краткий вывод.
    - Второе — короткая цитата из текста (до 100 символов).
    - Пиши по-русски.
    </instructions>

    <edge_cases>
    - For convenience только у контрагента + 30 дней:
      * termination_grounds_status = "present"
      * for_convenience = "counterparty_only"
      * rights_balance = "favors_counterparty"

    - For cause только у контрагента без cure:
      * termination_grounds_status = "present"
      * for_cause = "counterparty_only"
      * has_cure_period = "no"
      * cure_period_days = "Не применимо"

    - "Reasonable opinion" как основание санкционного расторжения:
      * termination_grounds_status = "present"
      * on_sanctions_or_law_change = "yes_risk_based"

    - Симметричный for cause, 30-дневный cure, нет for convenience:
      * termination_grounds_status = "present"
      * rights_balance = "balanced"
      * for_convenience = "none"
      * convenience_notice_days = "Не применимо"

    - Нет релевантных фрагментов / раздел об основаниях расторжения
      в договоре отсутствует:
      * termination_grounds_status = "missing"
      * for_cause = "none"
      * has_cure_period = "no"
      * cure_period_days = "Не применимо"
      * for_convenience = "none"
      * convenience_notice_days = "Не применимо"
      * on_change_of_control = "no"
      * on_insolvency = "no"
      * on_sanctions_or_law_change = "no"
      * rights_balance = "unclear"
      * termination_grounds_display =
        "Не удалось определить основания расторжения"
      * location у всех полей = null.

    - Формулировки есть, но вывод невозможен:
      * termination_grounds_status = "unclear"
      * cure_period_days = "Не удалось определить"
      * convenience_notice_days = "Не удалось определить"
      * termination_grounds_display =
        "Не удалось определить основания расторжения"
    </edge_cases>

    <output_expectations>
    - Верни результат строго в формате JSON.
    - Не оборачивай в markdown-блоки (без ```).
    - Не добавляй комментариев вне JSON.
    - Все значения полей с allowed_values — на английском.
    - Свободные текстовые поля (termination_grounds_display,
      cure_period_days, convenience_notice_days, reason) —
      на русском языке.
    - Не добавляй полей, кроме указанных.
    - Для каждого поля возвращай объект с ключами
      "value", "confidence", "location".

    Пример структуры ответа:
    {
      "termination_grounds_display": {"value": "For cause: взаимное; cure 30 дней; нет for convenience", "confidence": 0.92, "location": null},
      "termination_grounds_status": {"value": "present", "confidence": 0.95, "location": {"clause_ref": "п. 14.1", "page": 8, "quote": "Either party may terminate this Agreement for material breach"}},
      "for_cause": {"value": "mutual", "confidence": 0.95, "location": {"clause_ref": "п. 14.1", "page": 8, "quote": "Either party may terminate"}},
      "has_cure_period": {"value": "yes", "confidence": 0.90, "location": {"clause_ref": "п. 14.1", "page": 8, "quote": "if such breach is not cured within 30 days"}},
      "cure_period_days": {"value": "30 дней", "confidence": 0.95, "location": null},
      "for_convenience": {"value": "none", "confidence": 0.80, "location": null},
      "convenience_notice_days": {"value": "Не применимо", "confidence": 0.90, "location": null},
      "on_change_of_control": {"value": "no", "confidence": 0.75, "location": null},
      "on_insolvency": {"value": "yes", "confidence": 0.85, "location": {"clause_ref": "п. 14.2", "page": 8, "quote": "either party may terminate upon insolvency of the other party"}},
      "on_sanctions_or_law_change": {"value": "no", "confidence": 0.75, "location": null},
      "rights_balance": {"value": "balanced", "confidence": 0.90, "location": null},
      "reason": {"value": "...", "confidence": 0.90, "location": null}
    }
    </output_expectations>

  fields:
    - name: "termination_grounds_display"
      type: "string"
      presentation: "fact"
      label: "Основания расторжения"
      description: "Нормализованный user-facing вывод для DD Grid"
      display_in_grid: true
      display_priority: 1

    - name: "termination_grounds_status"
      type: "string"
      presentation: "signal"
      risk_weight: "info"
      description: "Наличие регулирования оснований расторжения"
      display_in_grid: false
      allowed_values:
        - "present"
        - "missing"
        - "unclear"

    - name: "for_cause"
      type: "string"
      presentation: "signal"
      risk_weight: "high"
      description: "Расторжение по вине"
      display_in_grid: false
      allowed_values:
        - "mutual"
        - "target_only"
        - "counterparty_only"
        - "none"
        - "unclear"

    - name: "has_cure_period"
      type: "string"
      presentation: "signal"
      risk_weight: "medium"
      description: "Cure period"
      display_in_grid: false
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "cure_period_days"
      type: "string"
      presentation: "fact"
