id: "termination_grounds"
name: "Основания досрочного расторжения"
description: >
  Анализирует основания для досрочного расторжения: по вине, без причины,
  при смене контроля, банкротстве, изменении законодательства, санкциях.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"

rules:
  keywords:
    - "расторгнуть договор"
    - "настоящий договор может быть расторгнут"
    - "односторонний отказ"
    - "termination for cause"
    - "termination for convenience"
    - "material breach"
    - "существенное нарушение"
    - "банкротство"
    - "insolvency"
    - "change of control"
    - "смена контроля"
    - "санкции"
    - "sanctions"
    - "изменение законодательства"
  keyword_mode: "any"
  regex_patterns: []
  clause_patterns: []

llm:
  prompt_template: |
    <role>
    Ты — юрист по коммерческим договорам и M&A.
    Твоя специализация — основания досрочного расторжения и распределение рисков.
    </role>

    <context>
    Ниже приведены фрагменты этого договора:

    {context}
    </context>

    <instructions>
    Проведи анализ по шагам. Каждый шаг логически связан с одним или
    несколькими полями итоговой оценки.

    Шаг 1 — РАСТОРЖЕНИЕ ПО ВИНЕ (FOR CAUSE)
    (используется для "termination_for_cause"):
    - Определи, какие основания досрочного расторжения по вине предусмотрены:
      * существенное нарушение / material breach;
      * иные нарушения, прямо указанные как основание расторжения.
    - Оцени, у кого есть право расторжения по этим основаниям:
      * "none" — оснований по вине не предусмотрено;
      * "one_sided" — право расторжения по вине есть только у одной стороны;
      * "mutual" — симметричное право у обеих сторон;
      * "unclear" — нельзя надёжно понять из фрагментов.
    - Зафиксируй только одно из этих значений.

    Шаг 2 — РАСТОРЖЕНИЕ БЕЗ ПРИЧИНЫ (FOR CONVENIENCE)
    (используется для "termination_for_convenience"):
    - Выяви наличие termination for convenience:
      * односторонний отказ без указания нарушения;
      * право расторгнуть «по собственному усмотрению» или аналогичные формулировки.
    - Оцени распределение этого права:
      * "none" — расторжение без причины не предусмотрено;
      * "one_sided" — такое право есть только у одной стороны;
      * "mutual" — право есть у обеих сторон;
      * "unclear" — по фрагментам нельзя установить.

    Шаг 3 — РАСТОРЖЕНИЕ ПРИ СМЕНЕ КОНТРОЛЯ
    (используется для "termination_on_coc"):
    - Определи, есть ли условие, что при смене контроля / смене собственника одной из сторон:
      * другая сторона вправе расторгнуть договор;
      * требуется согласие на смену контроля, при отсутствии которого возникает право расторжения.
    - Установи значение:
      * "yes" — право расторжения при смене контроля прямо предусмотрено;
      * "no" — специальных положений о смене контроля нет;
      * "unclear" — недостаточно данных.

    Шаг 4 — РАСТОРЖЕНИЕ ПРИ БАНКРОТСТВЕ/НЕСОСТОЯТЕЛЬНОСТИ
    (используется для "termination_on_insolvency"):
    - Проверь, упоминаются ли:
      * bankruptcy, insolvency, administration, ликвидация и аналогичные процедуры;
      * право стороны прекратить договор при наступлении таких событий у контрагента.
    - Установи "termination_on_insolvency" как "yes" / "no" / "unclear".

    Шаг 5 — РАСТОРЖЕНИЕ ПРИ ИЗМЕНЕНИИ ЗАКОНА / САНКЦИЯХ
    (используется для "termination_on_law_change_or_sanctions"):
    - Определи, есть ли основания расторжения, связанные с:
      * существенным изменением законодательства;
      * введением запретов/санкций, делающих исполнение незаконным или невозможным;
      * формулировками о праве расторгнуть договор при санкционном или регуляторном риске.
    - Установи значение "yes" / "no" / "unclear" для
      "termination_on_law_change_or_sanctions".

    Шаг 6 — СРОКИ И ПОРЯДОК УВЕДОМЛЕНИЯ
    (используется для "notice_period_summary"):
    - Выдели сроки уведомления и при необходимости cure period по разным основаниям:
      * for cause — наличие grace period / срока на устранение нарушения (например, 30 дней);
      * for convenience — срок предварительного уведомления (например, 30/60/90 дней);
      * при смене контроля, банкротстве, санкциях — специальные сроки уведомления (если есть).
    - Сформулируй краткий summary в одной строке, например:
      "For cause: 30 дней на устранение; for convenience: 60 дней уведомления".

    Шаг 7 — ОБЩИЙ БАЛАНС И РИСК ДЛЯ TARGET
    (используется для "overall_risk_level" и "reason"):
    - Оцени общий риск для Target с учётом:
      * односторонности/взаимности прав на расторжение по вине и без причины;
      * наличия или отсутствия termination for convenience у ключевого контрагента;
      * жёсткости триггеров (особенно по санкциям/изменению законодательства);
      * наличия и длительности grace period.
    - Определи "overall_risk_level" как:
      * "low" — баланс прав на расторжение в целом симметричный,
        нет одностороннего удобного выхода у ключевого контрагента;
      * "medium" — есть отдельные дисбалансы или жёсткие триггеры, но они ограничены;
      * "high" — широкий односторонний termination for convenience у контрагента,
        жёсткие санкционные/регуляторные основания без зеркальных прав Target и т.п.
    - В "reason" кратко обоснуй вывод, ссылаясь на ключевые формулировки
      (желательно с короткими цитатами), и объясни, как структура оснований
      расторжения влияет на риск для Target.
    </instructions>

    <edge_cases>
    Обрабатывай пограничные ситуации так:

    - У ключевого контрагента есть широкое право termination for convenience
      с коротким сроком уведомления (например, 30 дней), а у Target такого права нет:
      устанавливай termination_for_convenience = "one_sided" и учитывай
      высокий риск (часто overall_risk_level = "high").

    - Termination for cause прописан только в пользу одной стороны
      (например, поставщик может расторгнуть при любом нарушении, а клиент — нет):
      termination_for_cause = "one_sided"; отрази дисбаланс в reason.

    - Есть право расторжения при смене контроля Target без зеркального права
      для Target при смене контроля у контрагента:
      termination_on_coc = "yes"; отметь, в чью пользу сформулировано условие
      и учитывай это в оценке риска.

    - Триггеры по санкциям и изменению закона позволяют контрагенту
      расторгнуть договор при "риске нарушения" без объективного запрета,
      и право одностороннее:
      termination_on_law_change_or_sanctions = "yes"; обычно это тянет на высокий риск.

    - Текст фрагментарный: есть упоминание расторжения, но неясно,
      по какому основанию и у кого конкретно право:
      используй "unclear" и в reason явно укажи, каких элементов не хватает
      (например, не раскрыты стороны, сроки уведомления или триггеры).

    - Пустые или нерелевантные фрагменты:
      по большинству полей используй "unclear",
      overall_risk_level = "medium",
      reason — "Недостаточно данных для анализа оснований досрочного расторжения и их баланса между сторонами."
    </edge_cases>

    <output_expectations>
    На основе твоего анализа отдельный механизм извлечения сформирует
    структурированные поля по заранее заданной схеме. Твоя задача —
    давать чёткие юридические выводы и указывать конкретные формулировки
    из текста, на которых они основаны.
    </output_expectations>
  prompt_file: null
  context_k: 4
  temperature: 0.0
  max_tokens: 512

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 500

retrieval:
  context_k: 4
  max_chunks: 8
  boost_keywords:
    - "расторгнуть"
    - "односторонний отказ"
    - "termination"
    - "material breach"
    - "termination for convenience"
    - "банкротство"
    - "sanctions"
  rerank: true
  filters: {}

conditional: null

extraction:
  enabled: true
  mode: "hybrid"
  fields:
    - name: "termination_for_cause"
      type: "string"
      allowed_values:
        - "none"
        - "one_sided"
        - "mutual"
        - "unclear"

    - name: "termination_for_convenience"
      type: "string"
      allowed_values:
        - "none"
        - "one_sided"
        - "mutual"
        - "unclear"

    - name: "termination_on_coc"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "termination_on_insolvency"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "termination_on_law_change_or_sanctions"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "notice_period_summary"
      type: "string"

    - name: "overall_risk_level"
      type: "string"
      allowed_values:
        - "low"
        - "medium"
        - "high"

    - name: "reason"
      type: "string"

  store_payload: true

red_flags:
  items:
    - code: "TERM3"
      description: "Право ключевого контрагента расторгнуть договор без причины с коротким уведомлением."
    - code: "TERM4"
      description: "Одностороннее право расторжения/отказа, существенно дисбалансирующее позиции сторон."
