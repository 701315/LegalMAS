id: "termination_grounds"
name: "Основания досрочного расторжения"
group: "Terms"
description: >
  Анализирует основания для досрочного расторжения: по вине (for cause),
  без причины (for convenience), при смене контроля, банкротстве,
  санкциях / изменении законодательства. Оценивает cure periods,
  баланс прав между сторонами и асимметрию.

  Формирует краткий user-facing вывод и оценивает риск одностороннего
  выхода контрагента или «заперания» Target в договоре.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"
ui_mode: "field_extraction"

rules:
  keyword_mode: any

  keywords:
    high:
      # Termination for convenience
      - "(?i)termination\\s+for\\s+convenience"
      - "(?i)terminate[d]?\\s+at\\s+(its?|any\\s+party'?s?)\\s+(sole\\s+)?discretion"
      - "(?i)terminat[e]?\\s+without\\s+cause"
      - "(?i)terminat[e]?\\s+for\\s+any\\s+reason"
      - "(?i)односторонн[а-яий]+\\s+отказ"
      - "(?i)расторгнуть\\s+[\\s\\S]{0,30}без\\s+указания\\s+причин"
      - "(?i)расторгнуть\\s+[\\s\\S]{0,30}по\\s+(собственному\\s+)?усмотрени"

      # Termination for cause / material breach
      - "(?i)termination\\s+for\\s+cause"
      - "(?i)material\\s+breach"
      - "(?i)существенн[а-яое]+\\s+нарушени[ея]"
      - "(?i)terminat[e]?\\s+[\\s\\S]{0,40}(material\\s+breach|default|violation)"
      - "(?i)расторгнуть\\s+[\\s\\S]{0,40}существенн[а-яого]+\\s+нарушени[яи]"

      # Change of control
      - "(?i)change\\s+of\\s+control[\\s\\S]{0,40}terminat"
      - "(?i)terminat[\\s\\S]{0,30}change\\s+of\\s+control"
      - "(?i)расторжени[ея]\\s+[\\s\\S]{0,30}смене\\s+контрол"

      # Insolvency / bankruptcy
      - "(?i)\\binsolvency\\b[\\s\\S]{0,30}terminat"
      - "(?i)\\bbankruptcy\\b[\\s\\S]{0,30}terminat"
      - "(?i)банкротств[оа][\\s\\S]{0,30}расторж"
      - "(?i)liquidation[\\s\\S]{0,30}terminat"
      - "(?i)winding[-\\s]?up[\\s\\S]{0,30}terminat"
      - "(?i)ликвидаци[яи][\\s\\S]{0,30}расторж"

    medium:
      # Общие termination формулировки
      - "(?i)право\\s+расторгнуть"
      - "(?i)right\\s+to\\s+terminate"
      - "(?i)may\\s+terminate"
      - "(?i)вправе\\s+расторгнуть"

      # Cure period / grace period
      - "(?i)cure\\s+period"
      - "(?i)grace\\s+period"
      - "(?i)срок\\s+(для\\s+)?устранени[яи]"
      - "(?i)within\\s+\\d+\\s+(days?|business\\s+days?)[\\s\\S]{0,20}(cure|remedy|rectify)"
      - "(?i)в\\s+течени[ие]\\s+\\d+\\s+(дн|рабочих)[\\s\\S]{0,20}устранить"

      # Notice period для расторжения
      - "(?i)notice\\s+of\\s+termination"
      - "(?i)уведомлени[ея]\\s+о\\s+расторжени"
      - "(?i)\\d+\\s+(days?|months?)[\\s\\S]{0,10}(prior\\s+)?notice[\\s\\S]{0,20}terminat"
      - "(?i)уведомив\\s+за\\s+\\d+\\s+(дн|рабоч)[\\s\\S]{0,20}расторж"

      # Санкции / law change
      - "(?i)termination[\\s\\S]{0,30}sanction"
      - "(?i)расторжени[ея][\\s\\S]{0,30}санкци"
      - "(?i)termination[\\s\\S]{0,30}(change\\s+in\\s+law|change\\s+of\\s+law)"
      - "(?i)расторжени[ея][\\s\\S]{0,30}изменени[яи]\\s+законодательств"
      - "(?i)illegality[\\s\\S]{0,30}terminat"
      - "(?i)невозможность\\s+исполнени[яи][\\s\\S]{0,30}расторж"
      - "(?i)risk\\s+of\\s+sanctions[\\s\\S]{0,30}terminat"
      - "(?i)риск\\s+санкций[\\s\\S]{0,30}расторж"

    low:
      - "(?i)termination\\s+for\\s+cause"
      - "(?i)termination\\s+for\\s+convenience"
      - "(?i)material\\s+breach"
      - "(?i)существенное\\s+нарушение"
      - "(?i)cure\\s+period"
      - "(?i)срок\\s+устранения"
      - "(?i)insolvency"
      - "(?i)bankruptcy"
      - "(?i)банкротство"
      - "(?i)sanctions[\\s\\S]{0,20}terminat"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 640

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  retrieval_profile: "termination_check"
  context_k: 5
  max_chunks: 10
  
  retrieval_query: >
    основания расторжения termination for cause convenience material breach cure period 
    односторонний отказ change of control insolvency bankruptcy sanctions 
    уведомление о расторжении

  boost_keywords:
    - "termination for cause"
    - "termination for convenience"
    - "material breach"
    - "существенное нарушение"
    - "расторгнуть договор"
    - "односторонний отказ"
    - "right to terminate"
    - "право расторгнуть"
    - "change of control"
    - "смена контроля"
    - "insolvency"
    - "bankruptcy"
    - "банкротство"
    - "sanctions"
    - "санкции"
    - "risk of sanctions"
    - "change in law"
    - "изменение законодательства"
    - "cure period"
    - "срок устранения"
    - "grace period"
    - "notice of termination"
    - "уведомление о расторжении"
    - "terminate without cause"
    - "без указания причин"

  negative_keywords:
    - "порядок приемки"
    - "условия оплаты"
    - "интеллектуальная собственность"

  preferred_unit_types:
    - "termination_provision"
    - "general_provision"

  excluded_unit_types:
    - "technical_fragment"
    - "appendix_reference"
    - "structural_anchor"

  preferred_clause_functions:
    - "procedures"

  position_bias:
    preferred_range: [0.0, 1.0]
    boost: 0.10
    scope: "segment"

  rerank: true
  filters: {}

conditional: null

enrichment_hints:
  preferred_segment_types:
    - "contract"
    - "amendment"
    - "annex"
  excluded_segment_types:
    - "technical_specification"
    - "price_list"
    - "invoice"
    - "act"
    - "schedule"
  preferred_clause_functions:
    - "procedures"
    - "boilerplate"
  confidence_bonus_on_match: 0.10
  confidence_penalty_on_excluded_segment: 0.15

extraction:
  enabled: true
  mode: "hybrid"
  llm_max_tokens: 1250

  llm_prompt_extraction: |
    <role>
    Ты — юрист по коммерческим договорам и M&A.
    Твоя задача — точно извлечь из текста основания
    досрочного расторжения и баланс прав между сторонами.

    КРИТИЧЕСКИ ВАЖНО:
    - Извлекай ТОЛЬКО то, что прямо написано в тексте.
    - НЕ делай выводов "по умолчанию" из общих норм права.
    - НЕ додумывай основания расторжения, которых нет в тексте.
    - Если информация отсутствует — ставь "unclear" или "none".
    - Если текст неоднозначен — ставь "unclear".

    Чётко различай for cause (за нарушение) и for convenience
    (без причины).
    Не путай cure period расторжения с FM grace period.
    </role>

    <context_rules>
    - Ниже приведены фрагменты, отобранные автоматически.
    - Некоторые фрагменты могут быть нерелевантны —
      игнорируй их.
    - Если среди фрагментов есть противоречия —
      укажи "unclear" и объясни в reason.
    - Если ни один фрагмент не содержит информации —
      используй значения для случая "не удалось определить".
    - Не используй информацию из определений (definitions),
      преамбулы или приложений, если они не содержат
      substantive условий по теме check.
    </context_rules>

    <context>
    Ниже приведены релевантные фрагменты договора:

    {context}
    </context>

    <task>
    Заполни только следующие поля:
    - termination_grounds_display
    - for_cause
    - has_cure_period
    - cure_period_days
    - for_convenience
    - convenience_notice_days
    - on_change_of_control
    - on_insolvency
    - on_sanctions_or_law_change
    - rights_balance
    - reason

    Общие правила:
    - используй только то, что прямо следует из текста;
    - пиши коротко и по-русски.
    </task>

    <instructions>
    Шаг 1 — FOR CAUSE

    Заполни "for_cause".

    Значения:
    - "mutual" — право у обеих сторон.
    - "target_only" — только у Target.
    - "counterparty_only" — только у контрагента.
    - "none" — не предусмотрено.
    - "unclear" — неясно.

    Шаг 2 — CURE PERIOD

    Заполни "has_cure_period" и "cure_period_days".

    Значения для has_cure_period:
    - "yes" / "no" / "unclear"

    Для cure_period_days:
    - Если указан: "30 дней", "10 рабочих дней".
    - For cause есть, но cure не указан: "Не указан".
    - For cause не предусмотрен: "Не применимо".
    - Нельзя определить: "Не удалось определить".

    Шаг 3 — FOR CONVENIENCE

    Заполни "for_convenience".

    Значения:
    - "mutual" / "target_only" / "counterparty_only"
    - "none" / "unclear"

    Шаг 4 — СРОК ПРИ FOR CONVENIENCE

    Заполни "convenience_notice_days".

    Правила:
    - Если указан: "30 дней", "90 дней", "3 месяца".
    - For convenience есть, срок не указан: "Не указан".
    - For convenience не предусмотрен: "Не применимо".
    - Нельзя определить: "Не удалось определить".

    Шаг 5 — РАСТОРЖЕНИЕ ПРИ CoC

    Заполни "on_change_of_control".

    Значения:
    - "yes" / "no" / "unclear"

    Шаг 6 — РАСТОРЖЕНИЕ ПРИ БАНКРОТСТВЕ

    Заполни "on_insolvency".

    Значения:
    - "yes" / "no" / "unclear"

    Шаг 7 — РАСТОРЖЕНИЕ ПРИ САНКЦИЯХ / LAW CHANGE

    Заполни "on_sanctions_or_law_change".

    Значения:
    - "yes_objective" — только при фактическом запрете.
    - "yes_risk_based" — при "риске нарушения" или
      субъективной оценке контрагента.
    - "no" / "unclear"

    Шаг 8 — БАЛАНС ПРАВ

    Заполни "rights_balance".

    Значения:
    - "balanced" — права симметричны.
    - "favors_target" — Target имеет больше прав.
    - "favors_counterparty" — контрагент имеет больше прав.
    - "unclear" — неясно.

    Шаг 9 — DISPLAY ДЛЯ DD GRID

    Заполни "termination_grounds_display".

    Это поле — краткий итог для таблицы.
    Сформируй его на основе уже заполненных полей:
    - for_cause
    - has_cure_period + cure_period_days
    - for_convenience + convenience_notice_days
    - on_change_of_control
    - on_sanctions_or_law_change
    - rights_balance
    Не добавляй информацию, которой нет в этих полях.

    Примеры:
    - "For cause: взаимное; cure 30 дней; for convenience:
      контрагент (30 дней); CoC"
    - "For cause: взаимное; нет cure; нет for convenience;
      санкции risk-based"
    - "For cause: только контрагент; for convenience:
      только контрагент — асимметрия"
    - "Не удалось определить основания расторжения"

    Ограничение: не более 4 фактов через ";".

    Шаг 10 — КРАТКОЕ ОБОСНОВАНИЕ

    Заполни "reason".

    Формат:
    - Первое предложение: краткий вывод
      (for cause, cure, for convenience, CoC, баланс).
    - Второе предложение: цитата из текста в кавычках
      (самый релевантный фрагмент, до 100 символов).

    Примеры:
    - "Договор допускает расторжение for cause обеими
      сторонами с cure period 30 дней; for convenience
      только у контрагента.
      «Either party may terminate for material breach
      with 30-day cure period»."
    - "Основания расторжения не обнаружены
      в представленных фрагментах."
    </instructions>

    <edge_cases>
    - For convenience только у контрагента + 30 дней:
      * for_convenience = "counterparty_only"
      * rights_balance = "favors_counterparty"

    - For cause только у контрагента без cure:
      * for_cause = "counterparty_only"
      * has_cure_period = "no"
      * cure_period_days = "Не применимо"

    - "Reasonable opinion" как основание санкционного
      расторжения:
      * on_sanctions_or_law_change = "yes_risk_based"

    - Симметричный for cause, 30-дневный cure,
      нет for convenience:
      * rights_balance = "balanced"
      * for_convenience = "none"
      * convenience_notice_days = "Не применимо"

    - Нет релевантных фрагментов:
      * все сигнальные поля = "unclear"
      * cure_period_days = "Не удалось определить"
      * convenience_notice_days = "Не удалось определить"
      * termination_grounds_display =
        "Не удалось определить основания расторжения"
    </edge_cases>

    <output_expectations>
    - Верни результат строго в формате JSON.
    - Не оборачивай в markdown-блоки (без ```).
    - Не добавляй комментариев вне JSON.
    - Все значения полей с allowed_values — на английском
      (как указано в списке).
    - Свободные текстовые поля (termination_grounds_display,
      cure_period_days, convenience_notice_days, reason) —
      на русском языке.
    - Не добавляй никаких полей, кроме указанных.

    Пример структуры ответа:
    {
      "termination_grounds_display": "For cause: взаимное; cure 30 дней; нет for convenience",
      "for_cause": "mutual",
      "has_cure_period": "yes",
      "cure_period_days": "30 дней",
      "for_convenience": "none",
      "convenience_notice_days": "Не применимо",
      "on_change_of_control": "no",
      "on_insolvency": "yes",
      "on_sanctions_or_law_change": "no",
      "rights_balance": "balanced",
      "reason": "For cause взаимное с cure 30 дней. «Either party may terminate for material breach with 30-day cure»."
    }
    </output_expectations>

  fields:
    - name: "termination_grounds_display"
      type: "string"
      presentation: "fact"
      label: "Основания расторжения"
      description: "Нормализованный user-facing вывод для DD Grid"
      display_in_grid: true
      display_priority: 1

    - name: "for_cause"
      type: "string"
      presentation: "signal"
      description: "Расторжение по вине"
      display_in_grid: false
      allowed_values:
        - "mutual"
        - "target_only"
        - "counterparty_only"
        - "none"
        - "unclear"

    - name: "has_cure_period"
      type: "string"
      presentation: "signal"
      description: "Cure period"
      display_in_grid: false
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "cure_period_days"
      type: "string"
      presentation: "fact"
      label: "Cure period"
      description: "Длительность cure period"
      display_in_grid: true
      display_priority: 2

    - name: "for_convenience"
      type: "string"
      presentation: "signal"
      description: "Расторжение без причины"
      display_in_grid: false
      allowed_values:
        - "mutual"
        - "target_only"
        - "counterparty_only"
        - "none"
        - "unclear"

    - name: "convenience_notice_days"
      type: "string"
      presentation: "fact"
      label: "Срок уведомления при for convenience"
      description: "Срок уведомления при расторжении без причины"
      display_in_grid: true
      display_priority: 3

    - name: "on_change_of_control"
      type: "string"
      presentation: "signal"
      description: "Расторжение при смене контроля"
      display_in_grid: false
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "on_insolvency"
      type: "string"
      presentation: "signal"
      description: "Расторжение при банкротстве"
      display_in_grid: false
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "on_sanctions_or_law_change"
      type: "string"
      presentation: "signal"
      description: "Расторжение при санкциях / изменении закона"
      display_in_grid: false
      allowed_values:
        - "yes_objective"
        - "yes_risk_based"
        - "no"
        - "unclear"

    - name: "rights_balance"
      type: "string"
      presentation: "signal"
      description: "Баланс прав расторжения"
      display_in_grid: false
      allowed_values:
        - "balanced"
        - "favors_target"
        - "favors_counterparty"
        - "unclear"

    - name: "reason"
      type: "string"
      presentation: "diagnostic"
      description: "Обоснование"
      display_in_grid: false

  store_payload: true


  
