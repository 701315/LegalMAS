id: "termination_grounds"
name: "Основания досрочного расторжения"
description: >
  Анализирует основания для досрочного расторжения: по вине (for cause),
  без причины (for convenience), при смене контроля, банкротстве,
  изменении законодательства, санкциях. Оценивает баланс прав
  между сторонами и наличие cure periods.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"

rules:
  keyword_mode: any

  keywords:
    high:
      # Termination for convenience
      - "(?i)termination\\s+for\\s+convenience"
      - "(?i)terminate[d]?\\s+at\\s+(its?|any\\s+party'?s?)\\s+(sole\\s+)?discretion"
      - "(?i)terminat[e]?\\s+without\\s+cause"
      - "(?i)terminat[e]?\\s+for\\s+any\\s+reason\\s+or\\s+no\\s+reason"
      - "(?i)односторонн[а-яий]+\\s+отказ"
      - "(?i)расторгнуть\\s+[\\s\\S]{0,30}без\\s+указания\\s+причин"
      - "(?i)расторгнуть\\s+[\\s\\S]{0,30}по\\s+(собственному\\s+)?усмотрени"
      - "(?i)право\\s+на\\s+односторонний\\s+отказ"

      # Termination for cause / material breach
      - "(?i)termination\\s+for\\s+cause"
      - "(?i)material\\s+breach"
      - "(?i)существенн[а-яое]+\\s+нарушени[ея]"
      - "(?i)terminat[e]?\\s+[\\s\\S]{0,40}(breach|default|violation)"
      - "(?i)расторгнуть\\s+[\\s\\S]{0,40}нарушени[яи]"
      - "(?i)право\\s+расторгнуть\\s+[\\s\\S]{0,30}случае\\s+неисполнени"

      # Change of control
      - "(?i)change\\s+of\\s+control"
      - "(?i)смен[аы]\\s+контрол[яи]"
      - "(?i)change\\s+in\\s+(ownership|control|management)"
      - "(?i)смен[аы]\\s+(собственник|владелец|контролирующ)"
      - "(?i)termination\\s+[\\s\\S]{0,30}change\\s+of\\s+control"
      - "(?i)расторжени[ея]\\s+[\\s\\S]{0,30}смене\\s+контрол"

      # Insolvency / bankruptcy
      - "(?i)\\binsolvency\\b"
      - "(?i)\\bbankruptcy\\b"
      - "(?i)\\bбанкротств[оа]\\b"
      - "(?i)несостоятельност[ьи]"
      - "(?i)liquidation"
      - "(?i)ликвидаци"
      - "(?i)administration"
      - "(?i)winding[-\\s]?up"
      - "(?i)termination\\s+[\\s\\S]{0,30}(insolven|bankrupt)"
      - "(?i)расторжени[ея]\\s+[\\s\\S]{0,30}банкротств"

    medium:
      # Общие termination формулировки
      - "(?i)право\\s+расторгнуть"
      - "(?i)right\\s+to\\s+terminate"
      - "(?i)may\\s+terminate"
      - "(?i)вправе\\s+расторгнуть"
      - "(?i)может\\s+быть\\s+расторгнут"
      - "(?i)настоящий\\s+договор\\s+может\\s+быть\\s+расторгнут"

      # Cure period / grace period
      - "(?i)cure\\s+period"
      - "(?i)grace\\s+period"
      - "(?i)срок\\s+(для\\s+)?устранени[яи]"
      - "(?i)within\\s+\\d+\\s+(days?|business\\s+days?)\\s+[\\s\\S]{0,20}(cure|remedy|rectify)"
      - "(?i)в\\s+течени[ие]\\s+\\d+\\s+(дн|рабочих)\\s+[\\s\\S]{0,20}устранить"

      # Notice period
      - "(?i)notice\\s+of\\s+termination"
      - "(?i)уведомлени[ея]\\s+о\\s+расторжени"
      - "(?i)\\d+\\s+(days?'?|months?'?)\\s+(prior\\s+)?notice"
      - "(?i)уведомив\\s+за\\s+\\d+\\s+(дн|календарн|рабоч)"
      - "(?i)не\\s+менее\\s+чем\\s+за\\s+\\d+\\s+(дн|календарн)"

      # Law change / sanctions
      - "(?i)изменени[ея]\\s+законодательств"
      - "(?i)change[s]?\\s+(in|of)\\s+(law|legislation|regulation)"
      - "(?i)санкци[яий]"
      - "(?i)sanctions?"
      - "(?i)termination\\s+[\\s\\S]{0,30}sanction"
      - "(?i)расторжени[ея]\\s+[\\s\\S]{0,30}санкци"
      - "(?i)illegality"
      - "(?i)невозможность\\s+исполнени[яи]"

      # Иные основания
      - "(?i)event\\s+of\\s+default"
      - "(?i)событие\\s+дефолта"
      - "(?i)grounds?\\s+for\\s+termination"
      - "(?i)основани[яиеях]\\s+(для\\s+)?расторжени"

    low:
      # Общие ссылки на расторжение
      - "(?i)terminat"
      - "(?i)расторж"
      - "(?i)прекращ"
      - "(?i)отказ\\s+от\\s+договора"

      # Общие ссылки на нарушения
      - "(?i)breach"
      - "(?i)нарушени"
      - "(?i)default"
      - "(?i)неисполнени"

      # Общие ссылки на уведомления
      - "(?i)notice"
      - "(?i)уведомлени"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 640

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  context_k: 5
  max_chunks: 10
  boost_keywords:
    - "termination for cause"
    - "termination for convenience"
    - "material breach"
    - "существенное нарушение"
    - "расторгнуть договор"
    - "односторонний отказ"
    - "right to terminate"
    - "право расторгнуть"
    - "change of control"
    - "смена контроля"
    - "insolvency"
    - "bankruptcy"
    - "банкротство"
    - "sanctions"
    - "санкции"
    - "change in law"
    - "изменение законодательства"
    - "cure period"
    - "срок устранения"
    - "grace period"
    - "notice of termination"
    - "уведомление о расторжении"
  rerank: true
  filters: {}

conditional: null

extraction:
  llm_prompt_extraction: |
    <role>
    Ты — юрист по коммерческим договорам и M&A.
    Твоя специализация — основания досрочного расторжения,
    распределение рисков между сторонами, cure periods
    и баланс прав на выход из договора.
    </role>

    <context>
    Ниже приведены фрагменты договора с возможными положениями
    о расторжении:

    {context}
    </context>

    <instructions>
    Проведи анализ по шагам. Каждый шаг логически соответствует одному
    или нескольким полям итоговой оценки риска.

    Шаг 1 — РАСТОРЖЕНИЕ ПО ВИНЕ (FOR CAUSE)
    (используется для заполнения поля "for_cause"):
    - Определи, предусмотрено ли расторжение по вине:
      * material breach / существенное нарушение;
      * иные нарушения как основание расторжения.
    - Оцени распределение права:
      * "mutual" — симметричное право у обеих сторон;
      * "target_only" — право только у Target;
      * "counterparty_only" — право только у контрагента;
      * "none" — расторжение по вине не предусмотрено;
      * "unclear" — невозможно определить.

    Шаг 2 — CURE PERIOD (СРОК НА УСТРАНЕНИЕ)
    (используется для заполнения поля "has_cure_period"):
    - Определи, предусмотрен ли срок на устранение нарушения
      перед расторжением (cure period / grace period):
      * "yes" — есть cure period;
      * "no" — немедленное право расторжения без cure;
      * "unclear" — невозможно определить.

    Шаг 3 — ДЛИТЕЛЬНОСТЬ CURE PERIOD
    (используется для заполнения поля "cure_period_days"):
    - Если cure period есть, укажи количество дней
      (например: "30", "60", "10 рабочих дней").
    - Если нет cure period — укажи "N/A".
    - Если неясно — укажи "Не указан".

    Шаг 4 — РАСТОРЖЕНИЕ БЕЗ ПРИЧИНЫ (FOR CONVENIENCE)
    (используется для заполнения поля "for_convenience"):
    - Определи, предусмотрено ли расторжение без причины:
      * termination for convenience;
      * односторонний отказ без указания причин;
      * право расторгнуть "at sole discretion".
    - Оцени распределение права:
      * "mutual" — право у обеих сторон;
      * "target_only" — право только у Target;
      * "counterparty_only" — право только у контрагента;
      * "none" — расторжение без причины не предусмотрено;
      * "unclear" — невозможно определить.

    Шаг 5 — СРОК УВЕДОМЛЕНИЯ ПРИ FOR CONVENIENCE
    (используется для заполнения поля "convenience_notice_days"):
    - Если for convenience есть, укажи срок уведомления
      (например: "30 дней", "90 days", "3 месяца").
    - Если нет for convenience — укажи "N/A".
    - Если срок не указан — укажи "Не указан".

    Шаг 6 — РАСТОРЖЕНИЕ ПРИ СМЕНЕ КОНТРОЛЯ
    (используется для заполнения поля "on_change_of_control"):
    - Определи, есть ли право расторжения при смене контроля/
      собственника:
      * "yes" — прямо предусмотрено;
      * "no" — не предусмотрено;
      * "unclear" — невозможно определить.

    Шаг 7 — РАСТОРЖЕНИЕ ПРИ БАНКРОТСТВЕ
    (используется для заполнения поля "on_insolvency"):
    - Определи, есть ли право расторжения при банкротстве/
      несостоятельности/ликвидации:
      * "yes" — прямо предусмотрено;
      * "no" — не предусмотрено;
      * "unclear" — невозможно определить.

    Шаг 8 — РАСТОРЖЕНИЕ ПРИ САНКЦИЯХ / LAW CHANGE
    (используется для заполнения поля "on_sanctions_or_law_change"):
    - Определи, есть ли право расторжения при:
      * изменении законодательства;
      * введении санкций;
      * illegality (невозможность исполнения из-за закона).
    - Сформулируй вывод:
      * "yes" — расторжение при фактическом запрете и "risk of sanctions"
        или субъективной оценке;
      * "no" — не предусмотрено;
      * "unclear" — невозможно определить.

    Шаг 9 — RED FLAGS
    (используется для заполнения поля "red_flags"):
    - Оцени наличие следующих рисковых факторов:

      * «TERM8» — Право контрагента расторгнуть без причины
        (for convenience) с коротким уведомлением. Признаки:
        - for_convenience = "counterparty_only" или "mutual"
          (но реально используется контрагентом);
        - convenience_notice_days < 60 (при длительном договоре);
        - Target не имеет такого же права или имеет
          с бо́льшим сроком уведомления.

      * «TERM9» — Асимметричное/одностороннее распределение
        прав расторжения. Признаки:
        - for_cause = "counterparty_only";
        - for_convenience = "counterparty_only";
        - rights_balance = "favors_counterparty";
        - Target де-факто "заперта" в договоре,
          а контрагент может выйти легко.

      * «TERM10» — Расторжение при санкциях/law change
        на субъективных основаниях ("risk of"). Признаки:
        - on_sanctions_or_law_change = "yes_risk_based";
        - контрагент может расторгнуть при "risk of
          sanctions violation" без фактического запрета;
        - это создаёт произвольный рычаг для выхода.

    - Если права на расторжение сбалансированы, cure periods
      разумны, convenience взаимный или отсутствует —
      верни "NONE".
    - Если данных недостаточно для оценки — верни "UNCLEAR".
    - Формат: один или несколько кодов через запятую
      ("TERM8", "TERM9", "TERM8, TERM9, TERM10"),
      "NONE" или "UNCLEAR".
      Без комментариев в этом поле — всё объясняющее в reason.

    Шаг 10 — ОБОСНОВАНИЕ
    (используется для заполнения поля "reason"):

    - В "reason" кратко обоснуй вывод:
      * ссылайся на ключевые формулировки (по возможности
        с короткими цитатами);
      * поясни, как структура оснований расторжения
        влияет на риск для Target;
      * если выставлены red_flags — объясни, почему именно
        эти коды.
    </instructions>

    <edge_cases>
    Обрабатывай пограничные ситуации так:

    - Контрагент имеет широкое право for convenience
      с 30-дневным уведомлением, а у Target такого права нет:
      for_convenience = "counterparty_only";
      convenience_notice_days = "30 дней";
      ставь TERM8 и TERM9; overall_risk_level = "high".

    - For cause прописан только в пользу контрагента
      (контрагент может расторгнуть при любом нарушении,
      Target — нет):
      for_cause = "counterparty_only";
      ставь TERM9.

    - Право расторжения при CoC Target без зеркального права
      для Target при CoC контрагента:
      on_change_of_control = "yes";
      отметь в reason, что это асимметрично;
      учитывай в rights_balance.

    - Триггеры по санкциям/law change позволяют расторгнуть
      при "risk of violation" без объективного запрета:
      on_sanctions_or_law_change = "yes_risk_based";
      ставь TERM10; overall_risk_level ≥ "medium".

    - Симметричный for cause с 30-дневным cure period
      для обеих сторон:
      for_cause = "mutual";
      has_cure_period = "yes";
      это стандартно; red_flags = "NONE".

    - Нет for convenience ни у одной стороны:
      for_convenience = "none";
      это снижает риск; учитывай в overall_risk_level.

    - Текст фрагментарный: упоминается расторжение,
      но неясны основания и стороны:
      соответствующие поля = "unclear";
      red_flags = "UNCLEAR";
      overall_risk_level = "medium".

    - Пустые или нерелевантные фрагменты:
      все поля = "unclear";
      red_flags = "UNCLEAR";
      overall_risk_level = "medium".
    </edge_cases>

    <output_expectations>
    На основе твоего анализа отдельный механизм извлечения сформирует
    структурированные поля по заранее заданной схеме. Твоя задача —
    давать чёткие юридические выводы и указывать конкретные формулировки
    из текста, на которых они основаны. Не генерируй JSON —
    просто излагай выводы структурированно и однозначно.
    </output_expectations>

  enabled: true
  mode: "hybrid"
  fields:
    # Блок A: Основания
    - name: "for_cause"
      type: "string"
      allowed_values:
        - "mutual"
        - "target_only"
        - "counterparty_only"
        - "none"
        - "unclear"

    - name: "has_cure_period"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "cure_period_days"
      type: "string"

    - name: "for_convenience"
      type: "string"
      allowed_values:
        - "mutual"
        - "target_only"
        - "counterparty_only"
        - "none"
        - "unclear"

    - name: "convenience_notice_days"
      type: "string"

    - name: "on_change_of_control"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "on_insolvency"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "on_sanctions_or_law_change"
      type: "string"
      allowed_values:
        - "yes_objective"
        - "yes_risk_based"
        - "no"
        - "unclear"

    - name: "red_flags"
      type: "string"

    - name: "reason"
      type: "string"

  store_payload: true

red_flags:
  items:
    - code: "TERM8"
      description: "Право контрагента расторгнуть без причины (for convenience)."
    - code: "TERM9"
      description: "Асимметричное распределение прав расторжения."
    - code: "TERM10"
      description: "Расторжение при санкциях/law change на субъективных основаниях."