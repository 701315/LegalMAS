id: "termination_grounds"
name: "Основания досрочного расторжения"
description: >
  Анализирует основания для досрочного расторжения: по вине (for cause),
  без причины (for convenience), при смене контроля, банкротстве,
  санкциях / изменении законодательства. Оценивает cure periods,
  баланс прав между сторонами и асимметрию.

  Формирует краткий user-facing вывод и оценивает риск одностороннего
  выхода контрагента или «заперания» Target в договоре.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"
ui_mode: "field_extraction"

rules:
  keyword_mode: any

  keywords:
    high:
      # Termination for convenience
      - "(?i)termination\\s+for\\s+convenience"
      - "(?i)terminate[d]?\\s+at\\s+(its?|any\\s+party'?s?)\\s+(sole\\s+)?discretion"
      - "(?i)terminat[e]?\\s+without\\s+cause"
      - "(?i)terminat[e]?\\s+for\\s+any\\s+reason"
      - "(?i)односторонн[а-яий]+\\s+отказ"
      - "(?i)расторгнуть\\s+[\\s\\S]{0,30}без\\s+указания\\s+причин"
      - "(?i)расторгнуть\\s+[\\s\\S]{0,30}по\\s+(собственному\\s+)?усмотрени"

      # Termination for cause / material breach
      - "(?i)termination\\s+for\\s+cause"
      - "(?i)material\\s+breach"
      - "(?i)существенн[а-яое]+\\s+нарушени[ея]"
      - "(?i)terminat[e]?\\s+[\\s\\S]{0,40}(material\\s+breach|default|violation)"
      - "(?i)расторгнуть\\s+[\\s\\S]{0,40}существенн[а-яого]+\\s+нарушени[яи]"

      # Change of control
      - "(?i)change\\s+of\\s+control[\\s\\S]{0,40}terminat"
      - "(?i)terminat[\\s\\S]{0,30}change\\s+of\\s+control"
      - "(?i)расторжени[ея]\\s+[\\s\\S]{0,30}смене\\s+контрол"

      # Insolvency / bankruptcy
      - "(?i)\\binsolvency\\b[\\s\\S]{0,30}terminat"
      - "(?i)\\bbankruptcy\\b[\\s\\S]{0,30}terminat"
      - "(?i)банкротств[оа][\\s\\S]{0,30}расторж"
      - "(?i)liquidation[\\s\\S]{0,30}terminat"
      - "(?i)winding[-\\s]?up[\\s\\S]{0,30}terminat"
      - "(?i)ликвидаци[яи][\\s\\S]{0,30}расторж"

    medium:
      # Общие termination формулировки
      - "(?i)право\\s+расторгнуть"
      - "(?i)right\\s+to\\s+terminate"
      - "(?i)may\\s+terminate"
      - "(?i)вправе\\s+расторгнуть"

      # Cure period / grace period
      - "(?i)cure\\s+period"
      - "(?i)grace\\s+period"
      - "(?i)срок\\s+(для\\s+)?устранени[яи]"
      - "(?i)within\\s+\\d+\\s+(days?|business\\s+days?)[\\s\\S]{0,20}(cure|remedy|rectify)"
      - "(?i)в\\s+течени[ие]\\s+\\d+\\s+(дн|рабочих)[\\s\\S]{0,20}устранить"

      # Notice period для расторжения
      - "(?i)notice\\s+of\\s+termination"
      - "(?i)уведомлени[ея]\\s+о\\s+расторжени"
      - "(?i)\\d+\\s+(days?|months?)[\\s\\S]{0,10}(prior\\s+)?notice[\\s\\S]{0,20}terminat"
      - "(?i)уведомив\\s+за\\s+\\d+\\s+(дн|рабоч)[\\s\\S]{0,20}расторж"

      # Санкции / law change
      - "(?i)termination[\\s\\S]{0,30}sanction"
      - "(?i)расторжени[ея][\\s\\S]{0,30}санкци"
      - "(?i)termination[\\s\\S]{0,30}(change\\s+in\\s+law|change\\s+of\\s+law)"
      - "(?i)расторжени[ея][\\s\\S]{0,30}изменени[яи]\\s+законодательств"
      - "(?i)illegality[\\s\\S]{0,30}terminat"
      - "(?i)невозможность\\s+исполнени[яи][\\s\\S]{0,30}расторж"
      - "(?i)risk\\s+of\\s+sanctions[\\s\\S]{0,30}terminat"
      - "(?i)риск\\s+санкций[\\s\\S]{0,30}расторж"

    low:
      - "(?i)termination\\s+for\\s+cause"
      - "(?i)termination\\s+for\\s+convenience"
      - "(?i)material\\s+breach"
      - "(?i)существенное\\s+нарушение"
      - "(?i)cure\\s+period"
      - "(?i)срок\\s+устранения"
      - "(?i)insolvency"
      - "(?i)bankruptcy"
      - "(?i)банкротство"
      - "(?i)sanctions[\\s\\S]{0,20}terminat"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 640

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  context_k: 5
  max_chunks: 10
  boost_keywords:
    - "termination for cause"
    - "termination for convenience"
    - "material breach"
    - "существенное нарушение"
    - "расторгнуть договор"
    - "односторонний отказ"
    - "right to terminate"
    - "право расторгнуть"
    - "change of control"
    - "смена контроля"
    - "insolvency"
    - "bankruptcy"
    - "банкротство"
    - "sanctions"
    - "санкции"
    - "risk of sanctions"
    - "change in law"
    - "изменение законодательства"
    - "cure period"
    - "срок устранения"
    - "grace period"
    - "notice of termination"
    - "уведомление о расторжении"
    - "terminate without cause"
    - "без указания причин"
  rerank: true
  filters: {}

conditional: null

enrichment_hints:
  preferred_segment_types:
    - "contract"
    - "amendment"
    - "annex"
  excluded_segment_types:
    - "technical_specification"
    - "price_list"
    - "invoice"
    - "act"
    - "schedule"
  preferred_clause_functions:
    - "termination"
    - "general_provisions"
  confidence_bonus_on_match: 0.10
  confidence_penalty_on_excluded_segment: 0.15

extraction:
  enabled: true
  mode: "hybrid"
  llm_max_tokens: 460
  llm_prompt_extraction: |
    <role>
    Ты — юрист по коммерческим договорам и M&A.
    Твоя задача — точно извлечь из текста основания
    досрочного расторжения и баланс прав между сторонами.
    </role>

    <context>
    Ниже приведены релевантные фрагменты договора:

    {context}
    </context>

    <task>
    Заполни только следующие поля:
    - termination_grounds_display
    - for_cause
    - has_cure_period
    - cure_period_days
    - for_convenience
    - convenience_notice_days
    - on_change_of_control
    - on_insolvency
    - on_sanctions_or_law_change
    - rights_balance
    - red_flags
    - reason

    Важно:
    - чётко различай for cause и for convenience;
    - не путай cure period расторжения с FM grace period;
    - пиши user-facing значения коротко и по-русски.
    </task>

    <instructions>
    Шаг 1 — РАСТОРЖЕНИЕ ПО ВИНЕ (FOR CAUSE)

    Заполни поле "for_cause".

    Значения:
    - "mutual" — право у обеих сторон.
    - "target_only" — только у Target.
    - "counterparty_only" — только у контрагента.
    - "none" — не предусмотрено.
    - "unclear" — неясно.

    Шаг 2 — CURE PERIOD

    Заполни поля "has_cure_period" и "cure_period_days".

    Значения для has_cure_period:
    - "yes" — есть срок на устранение нарушения.
    - "no" — немедленное право расторжения без cure.
    - "unclear" — неясно.

    Для cure_period_days:
    - Если есть: "30", "60", "10 рабочих дней"
    - Если нет: "Не применимо"
    - Если неясно: "Не указан"

    Шаг 3 — РАСТОРЖЕНИЕ БЕЗ ПРИЧИНЫ (FOR CONVENIENCE)

    Заполни поле "for_convenience".

    Значения:
    - "mutual" — право у обеих сторон.
    - "target_only" — только у Target.
    - "counterparty_only" — только у контрагента.
    - "none" — не предусмотрено.
    - "unclear" — неясно.

    Шаг 4 — СРОК УВЕДОМЛЕНИЯ ПРИ FOR CONVENIENCE

    Заполни поле "convenience_notice_days".

    Правила:
    - Если есть: "30 дней", "90 дней", "3 месяца"
    - Если нет for convenience: "Не применимо"
    - Если срок не указан: "Не указан"

    Шаг 5 — РАСТОРЖЕНИЕ ПРИ СМЕНЕ КОНТРОЛЯ

    Заполни поле "on_change_of_control".

    Значения:
    - "yes" — прямо предусмотрено.
    - "no" — нет.
    - "unclear" — неясно.

    Шаг 6 — РАСТОРЖЕНИЕ ПРИ БАНКРОТСТВЕ

    Заполни поле "on_insolvency".

    Значения:
    - "yes" — прямо предусмотрено.
    - "no" — нет.
    - "unclear" — неясно.

    Шаг 7 — РАСТОРЖЕНИЕ ПРИ САНКЦИЯХ / LAW CHANGE

    Заполни поле "on_sanctions_or_law_change".

    Значения:
    - "yes_objective" — только при фактическом запрете /
      фактическом включении в санкционный список.
    - "yes_risk_based" — при "риске нарушения санкций"
      или субъективной оценке контрагента.
    - "no" — не предусмотрено.
    - "unclear" — неясно.

    Шаг 8 — БАЛАНС ПРАВ

    Заполни поле "rights_balance".

    Значения:
    - "balanced" — права расторжения симметричны.
    - "favors_target" — Target имеет больше прав.
    - "favors_counterparty" — контрагент имеет больше прав.
    - "unclear" — неясно.

    Шаг 9 — RED FLAGS

    Заполни поле "red_flags".

    Используй:
    - "NONE" — права сбалансированы, cure periods разумные.
    - "UNCLEAR" — данных недостаточно.
    - Коды через запятую:
      * TERM8 — право контрагента расторгнуть без причины
        (for convenience = "counterparty_only") с коротким
        уведомлением (< 60 дней для длительных договоров).
      * TERM9 — асимметричное распределение прав расторжения:
        контрагент имеет больше оснований / меньше ограничений.
      * TERM10 — расторжение при санкциях / law change
        на субъективных основаниях (risk-based trigger).

    Шаг 10 — USER-FACING SUMMARY

    Заполни поле "termination_grounds_display".

    Примеры:
    - "For cause: взаимное; cure 30 дней; for convenience:
       только контрагент (30 дней); расторжение при CoC"
    - "For cause: взаимное; нет cure; нет for convenience;
       санкции: risk-based"
    - "For cause: только контрагент; for convenience: только
       контрагент — асимметрия"
    - "Не удалось определить основания расторжения"

    Правила:
    - Отрази максимум 4 ключевых факта через ";".
    - Если всё unclear:
      "Не удалось определить основания расторжения"

    Шаг 11 — ОБОСНОВАНИЕ

    Заполни поле "reason".

    Правила:
    - 1–2 коротких предложения.
    - Укажи: for cause, cure period, for convenience, CoC,
      баланс прав, почему red_flags.
    - Приведи короткую цитату в кавычках.
    - Если NONE — почему права сбалансированы.
    </instructions>

    <edge_cases>
    - For convenience только у контрагента + 30 дней:
      * for_convenience = "counterparty_only"
      * convenience_notice_days = "30 дней"
      * rights_balance = "favors_counterparty"
      * red_flags = "TERM8, TERM9"

    - For cause только у контрагента без cure:
      * for_cause = "counterparty_only"
      * has_cure_period = "no"
      * red_flags включает "TERM9"

    - Sanctions trigger = "reasonable opinion":
      * on_sanctions_or_law_change = "yes_risk_based"
      * red_flags включает "TERM10"

    - Симметричный for cause, 30-дневный cure, нет for convenience:
      * rights_balance = "balanced"
      * red_flags = "NONE"

    - Расторжение при CoC только контрагента, без зеркального права:
      * on_change_of_control = "yes"
      * rights_balance = "favors_counterparty"
      * в reason: асимметрия по CoC

    - Нет релевантных фрагментов:
      * все поля = "unclear"
      * red_flags = "UNCLEAR"
      * termination_grounds_display =
        "Не удалось определить основания расторжения"
    </edge_cases>

    <output_expectations>
    Все значения должны быть короткими, точными и пригодными
    для отображения пользователю в DD Grid.
    Не добавляй никаких полей, кроме указанных в схеме extraction.
    </output_expectations>

  fields:
    - name: "termination_grounds_display"
      type: "string"
      description: "Основания расторжения: краткий вывод"

    - name: "for_cause"
      type: "string"
      description: "Расторжение по вине"
      allowed_values:
        - "mutual"
        - "target_only"
        - "counterparty_only"
        - "none"
        - "unclear"

    - name: "has_cure_period"
      type: "string"
      description: "Cure period"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "cure_period_days"
      type: "string"
      description: "Длительность cure period"

    - name: "for_convenience"
      type: "string"
      description: "Расторжение без причины"
      allowed_values:
        - "mutual"
        - "target_only"
        - "counterparty_only"
        - "none"
        - "unclear"

    - name: "convenience_notice_days"
      type: "string"
      description: "Срок уведомления при for convenience"

    - name: "on_change_of_control"
      type: "string"
      description: "Расторжение при смене контроля"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "on_insolvency"
      type: "string"
      description: "Расторжение при банкротстве"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "on_sanctions_or_law_change"
      type: "string"
      description: "Расторжение при санкциях / изменении закона"
      allowed_values:
        - "yes_objective"
        - "yes_risk_based"
        - "no"
        - "unclear"

    - name: "rights_balance"
      type: "string"
      description: "Баланс прав расторжения"
      allowed_values:
        - "balanced"
        - "favors_target"
        - "favors_counterparty"
        - "unclear"

    - name: "red_flags"
      type: "string"
      description: "Коды рисков"

    - name: "reason"
      type: "string"
      description: "Обоснование"

  store_payload: true


  