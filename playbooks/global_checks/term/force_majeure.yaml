id: "force_majeure"
name: "Форс-мажор и освобождение от ответственности"
description: >
  Анализирует форс-мажорные оговорки: перечень событий (классические,
  санкции, кибератаки, пандемии, экономические), процедуру уведомления,
  срок освобождения, охват платёжных обязательств, право на расторжение
  при длительном форс-мажоре и баланс прав между сторонами.

doc_types: []

severity: "medium"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"

rules:
  keyword_mode: any

  keywords:
    high:
      # Прямые форс-мажорные термины
      - "(?i)force\\s+majeure"
      - "(?i)форс[-\\s]?мажор"
      - "(?i)обстоятельств[аы]\\s+непреодолимой\\s+силы"
      - "(?i)act[s]?\\s+of\\s+God"

      # Расширенные основания — экономическая нецелесообразность
      - "(?i)economic\\s+(hardship|infeasibility|impossibility)"
      - "(?i)экономическ[а-яая]+\\s+(нецелесообразност|невозможност)"
      - "(?i)economic\\s+unfeasibility"
      - "(?i)market\\s+(disruption|change|collapse)"
      - "(?i)ухудшени[ея]\\s+финансов[а-яого]+\\s+положени[яи]"

      # Платёжные обязательства в FM
      - "(?i)force\\s+majeure\\s+[\\s\\S]{0,40}payment"
      - "(?i)payment\\s+[\\s\\S]{0,40}force\\s+majeure"
      - "(?i)форс[-\\s]?мажор[\\s\\S]{0,40}(платёж|платеж|оплат)"
      - "(?i)(платёж|платеж|оплат)[\\s\\S]{0,40}форс[-\\s]?мажор"
      - "(?i)shall\\s+not\\s+excuse\\s+[\\s\\S]{0,20}payment"
      - "(?i)не\\s+освобожда[ею]т\\s+от\\s+[\\s\\S]{0,20}(платёж|платеж|оплат)"

      # Расторжение при длительном FM
      - "(?i)terminat[\\s\\S]{0,30}force\\s+majeure\\s+[\\s\\S]{0,30}(exceed|continu|last)"
      - "(?i)расторж[\\s\\S]{0,30}форс[-\\s]?мажор[\\s\\S]{0,30}(свыше|более|превыш)"
      - "(?i)if\\s+force\\s+majeure\\s+(continues?|persists?)\\s+for\\s+more\\s+than"
      - "(?i)если\\s+форс[-\\s]?мажор\\s+(продолжается|длится)\\s+(более|свыше)"

    medium:
      # Классические FM-события
      - "(?i)\\bwar\\b"
      - "(?i)\\bвойн[аыу]\\b"
      - "(?i)military\\s+(action|operation|conflict)"
      - "(?i)военн[а-яые]+\\s+действи"
      - "(?i)\\bflood\\b"
      - "(?i)\\bнаводнени\\b"
      - "(?i)\\bearthquake\\b"
      - "(?i)\\bземлетрясени\\b"
      - "(?i)\\bfire\\b"
      - "(?i)\\bпожар\\b"
      - "(?i)natural\\s+disaster"
      - "(?i)стихийн[а-яое]+\\s+бедстви"

      # Пандемии/эпидемии
      - "(?i)\\bpandemic\\b"
      - "(?i)\\bпандеми\\b"
      - "(?i)\\bepidemic\\b"
      - "(?i)\\bэпидеми\\b"
      - "(?i)quarantine"
      - "(?i)карантин"

      # Санкции в FM
      - "(?i)sanctions?\\s+[\\s\\S]{0,30}force\\s+majeure"
      - "(?i)force\\s+majeure\\s+[\\s\\S]{0,30}sanctions?"
      - "(?i)sanctions?"
      - "(?i)санкци"
      - "(?i)\\bembargo\\b"
      - "(?i)\\bэмбарго\\b"

      # Государственные/регуляторные действия
      - "(?i)government(al)?\\s+(action|measure|order|restriction)"
      - "(?i)regulatory\\s+(action|measure|order|restriction)"
      - "(?i)действи[яи]\\s+(государственн|регуляторн)"
      - "(?i)(запрет|ограничени[яие])\\s+(государственн|органов\\s+власти)"

      # Забастовки
      - "(?i)\\bstrike\\b"
      - "(?i)\\bзабастовк\\b"
      - "(?i)\\blockout\\b"
      - "(?i)\\bлокаут\\b"
      - "(?i)labor\\s+dispute"
      - "(?i)трудов[а-яой]+\\s+спор"

      # Кибератаки
      - "(?i)cyber[-\\s]?(attack|incident|event)"
      - "(?i)кибератак"
      - "(?i)киберинцидент"
      - "(?i)DDoS"
      - "(?i)ransomware"

      # Уведомление о FM
      - "(?i)notif(y|ication)\\s+[\\s\\S]{0,30}force\\s+majeure"
      - "(?i)уведоми[тьла]?\\s+[\\s\\S]{0,30}форс[-\\s]?мажор"
      - "(?i)within\\s+\\d+\\s+(days?|business\\s+days?)\\s+[\\s\\S]{0,30}force\\s+majeure"
      - "(?i)в\\s+течени[ие]\\s+\\d+\\s+(дн|рабочих)\\s+[\\s\\S]{0,30}форс[-\\s]?мажор"

    low:
      # Общие ссылки на освобождение от ответственности
      - "(?i)excus(e|ed)\\s+from\\s+(performance|liability)"
      - "(?i)освобожд[а-я]+\\s+от\\s+ответственност"
      - "(?i)reliev(e|ed)\\s+of\\s+obligations?"
      - "(?i)освобожд[а-я]+\\s+от\\s+обязательств"

      # Общие события
      - "(?i)unforeseen\\s+event"
      - "(?i)непредвиденн[а-яые]+\\s+обстоятельств"
      - "(?i)beyond\\s+[\\s\\S]{0,20}(reasonable\\s+)?control"
      - "(?i)вне\\s+[\\s\\S]{0,20}контрол"

      # Общие ссылки на приостановку
      - "(?i)suspension"
      - "(?i)приостановлени"
      - "(?i)postpone"
      - "(?i)отсрочк"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 640

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  context_k: 5
  max_chunks: 10
  boost_keywords:
    - "force majeure"
    - "форс-мажор"
    - "обстоятельства непреодолимой силы"
    - "act of God"
    - "sanctions"
    - "санкции"
    - "pandemic"
    - "пандемия"
    - "cyber attack"
    - "кибератака"
    - "war"
    - "война"
    - "natural disaster"
    - "стихийное бедствие"
    - "economic hardship"
    - "payment obligations"
    - "платёжные обязательства"
    - "termination force majeure"
    - "расторжение форс-мажор"
    - "notification force majeure"
    - "уведомление форс-мажор"
    - "governmental action"
    - "regulatory action"
  rerank: true
  filters: {}

conditional: null

extraction:
  llm_prompt_extraction: |
    <role>
    Ты — юрист по контрактам и управлению рисками.
    Твоя специализация — форс-мажорные оговорки, освобождение от
    ответственности, оценка широты определений форс-мажора
    и их влияния на баланс рисков между сторонами.
    </role>

    <context>
    Ниже приведены фрагменты договора, где могут быть положения
    о форс-мажоре:

    {context}
    </context>

    <instructions>
    Проведи анализ по шагам. Каждый шаг логически соответствует одному
    или нескольким полям итоговой оценки риска.

    Шаг 1 — КЛАССИЧЕСКИЕ ФОРС-МАЖОРНЫЕ СОБЫТИЯ
    (используется для заполнения поля "covers_classic_events"):
    - Определи, включает ли оговорка классические события:
      * стихийные бедствия (пожар, наводнение, землетрясение,
        иные acts of God);
      * война, военные действия, массовые беспорядки;
      * забастовки, локауты;
      * действия/акты государственных органов.
    - Если такой перечень явно присутствует — вывод "yes".
    - Если отсутствует — вывод "no".
    - Если неясно — вывод "unclear".

    Шаг 2 — СОВРЕМЕННЫЕ РИСКИ
    (используется для заполнения поля "covers_modern_risks"):
    - Определи, включены ли в перечень:
      * пандемии, эпидемии, карантин;
      * санкции, embargo, запреты экспорта/импорта;
      * regulatory/governmental actions, блокировки счетов;
      * кибератаки, кибер-инциденты, DDoS, ransomware.
    - Сформулируй вывод:
      * "yes" — покрыты все/большинство современных
        рисков;
      * "none" — современные риски не включены;
      * "unclear" — невозможно определить.

    Шаг 3 — ЭКОНОМИЧЕСКАЯ НЕЦЕЛЕСООБРАЗНОСТЬ И РЫНОЧНЫЕ ИЗМЕНЕНИЯ
    (используется для заполнения поля "includes_economic_grounds"):
    - Определи, включает ли FM такие основания как:
      * economic hardship / infeasibility;
      * общие изменения рынка, падение спроса, изменение цен;
      * ухудшение финансового положения стороны;
      * market disruption / collapse.
    - Такие формулировки существенно расширяют FM и повышают
      риск злоупотреблений.
    - Сформулируй вывод: "yes" / "no" / "unclear".

    Шаг 4 — ОХВАТ ПЛАТЁЖНЫХ ОБЯЗАТЕЛЬСТВ
    (используется для заполнения поля "covers_payments"):
    - Определи, распространяется ли FM на денежные обязательства:
      * "yes" — FM освобождает от обязанности платить;
      * "no" — прямо указано, что платёжные обязательства
        не подпадают под FM;
      * "unclear" — не раскрыто.

    Шаг 5 — ПРАВО НА РАСТОРЖЕНИЕ ПРИ ДЛИТЕЛЬНОМ FM
    (используется для заполнения полей "has_termination_right"
     и "termination_threshold"):
    - Определи, есть ли условие о расторжении при длительном FM:
      * "yes" — право расторгнуть при FM свыше X дней/месяцев;
      * "no" — такого условия нет;
      * "unclear" — неясно.
    - Если "yes" — укажи порог (threshold) в termination_threshold:
      * например: "90 days", "6 months", "180 дней".
    - Если порог не определён — укажи "Не определён".

    Шаг 6 — RED FLAGS
    (используется для заполнения поля "red_flags"):
    - Оцени наличие следующих рисковых факторов:

      * «FM1» — Форс-мажор включает экономическую
        нецелесообразность или общие рыночные изменения.
        Признаки:
        - includes_economic_grounds = "yes";
        - формулировки "economic hardship", "market disruption",
          "ухудшение финансового положения";
        - это позволяет стороне выйти из договора
          при неблагоприятной конъюнктуре, не связанной
          с непреодолимой силой.

      * «FM2» — Форс-мажор распространяется на платёжные
        обязательства без чётких ограничений. Признаки:
        - covers_payments = "yes";
        - нет ограничений по срокам или суммам;
        - это позволяет стороне отказаться от платежей
          под предлогом FM.

      * «FM3» — FM определён слишком широко с catch-all
        формулировкой и одновременно даёт одной стороне
        асимметричное право на расторжение. Признаки:
        - includes_economic_grounds = "yes";
        - fm_beneficiary = "counterparty" (не mutual);
        - has_termination_right = "yes" с коротким threshold;
        - Target де-факто лишается контракта при ухудшении
          рынка.

    - Если FM классический, сбалансированный, не охватывает
      платежи, без экономических оснований — верни "NONE".
    - Если данных недостаточно для оценки — верни "UNCLEAR".
    - Формат: один или несколько кодов через запятую
      ("FM1", "FM2", "FM1, FM2, FM3"), "NONE" или "UNCLEAR".
      Без комментариев в этом поле — всё объясняющее в reason.

    Шаг 7 — ОБОСНОВАНИЕ
    (используется для заполнения поля "reason"):

    - В "reason" кратко обоснуй вывод:
      * какие ключевые элементы FM присутствуют/отсутствуют;
      * ссылайся на ключевые формулировки (по возможности
        с короткими цитатами);
      * если выставлены red_flags — объясни, почему именно
        эти коды.
    </instructions>

    <edge_cases>
    Обрабатывай пограничные ситуации так:

    - FM включает экономическую нецелесообразность, общие
      изменения рынка, ухудшение финансового положения:
      includes_economic_grounds = "yes";
      ставь FM1; overall_risk_level = "high".

    - FM прямо распространяется на платежи без ограничений:
      covers_payments = "yes";
      ставь FM2; overall_risk_level = "high" или "medium"
      в зависимости от других факторов.

    - Разумное право расторгнуть при длительном FM
      (свыше 3–6 месяцев) после периода приостановки:
      has_termination_right = "yes";
      если симметричное — это нормально; не ставь FM3.

    - Шаблонный FM (стихийные бедствия, война) без санкций,
      кибератак и регуляторных действий, при этом предмет
      договора чувствителен к таким рискам:
      covers_classic_events = "yes";
      covers_modern_risks = "none";
      overall_risk_level = "medium" из-за непокрытых рисков.

    - FM с catch-all формулировкой "any event beyond
      reasonable control" без конкретного перечня:
      это может покрывать всё; includes_economic_grounds
      зависит от контекста; отметь широту в reason.

    - FM прямо исключает платёжные обязательства
      ("Force majeure shall not excuse payment obligations"):
      covers_payments = "no";
      это снижает риск.

    - Текст фрагментарный: термин "форс-мажор" упомянут,
      но оговорка не приведена:
      соответствующие поля = "unclear";
      red_flags = "UNCLEAR";
      overall_risk_level = "medium".

    - Пустые или нерелевантные фрагменты:
      все поля = "unclear";
      red_flags = "UNCLEAR";
      overall_risk_level = "medium".
    </edge_cases>

    <output_expectations>
    На основе твоего анализа отдельный механизм извлечения сформирует
    структурированные поля по заранее заданной схеме. Твоя задача —
    давать чёткие юридические выводы и указывать конкретные формулировки
    из текста, на которых они основаны. Не генерируй JSON —
    просто излагай выводы структурированно и однозначно.
    </output_expectations>

  enabled: true
  mode: "hybrid"
  fields:
    - name: "covers_classic_events"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "covers_modern_risks"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "includes_economic_grounds"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "covers_payments"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "has_termination_right"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "red_flags"
      type: "string"

    - name: "reason"
      type: "string"

  store_payload: true

red_flags:
  items:
    - code: "FM1"
      description: "Форс-мажор включает экономическую нецелесообразность или общие рыночные изменения."
    - code: "FM2"
      description: "Форс-мажор распространяется на платёжные обязательства без чётких ограничений."
    - code: "FM3"
      description: "FM определён слишком широко с асимметричным правом расторжения у контрагента."