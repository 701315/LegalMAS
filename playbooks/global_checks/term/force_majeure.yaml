id: "force_majeure"
name: "Форс-мажор и освобождение от ответственности"
description: >
  Анализирует форс-мажор: перечень событий, процедуру уведомления,
  срок освобождения, право на расторжение, охват платежных обязательств.

doc_types: []

severity: "medium"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"

rules:
  keywords:
    - "форс-мажор"
    - "обстоятельства непреодолимой силы"
    - "force majeure"
    - "act of God"
    - "война"
    - "военные действия"
    - "пандемия"
    - "epidemic"
    - "pandemic"
    - "санкции"
    - "sanctions"
    - "regulatory actions"
    - "governmental actions"
    - "забастовка"
    - "страйк"
    - "кибератака"
    - "cyber attack"
    - "киберинцидент"
  keyword_mode: "any"
  regex_patterns: []
  clause_patterns: []

llm:
  prompt_template: |
    <role>
    Ты — юрист по контрактам и управлению рисками.
    Твоя специализация — форс-мажорные оговорки и освобождение от ответственности.
    </role>

    <context>
    Ниже приведены фрагменты договора, где могут быть положения о форс-мажоре:

    {context}
    </context>

    <instructions>
    Проведи анализ по шагам. Каждый шаг логически связан с одним или
    несколькими полями итоговой оценки.

    Шаг 1 — ПЕРЕЧЕНЬ КЛАССИЧЕСКИХ ФОРС-МАЖОРНЫХ СОБЫТИЙ
    (используется для "covers_classic_events"):
    - Определи, включает ли оговорка классические форс-мажорные события:
      * стихийные бедствия (пожар, наводнение, землетрясение, иные Acts of God),
      * война, военные действия, массовые беспорядки,
      * забастовки, страйки,
      * действия/акты государственных органов,
      * эпидемии/пандемии и аналогичные события.
    - Сформулируй вывод:
      * "yes" — если такой перечень явно присутствует (либо перечислен примерами),
      * "no" — если форс-мажор описан без указания таких классических событий,
      * "unclear" — если по фрагментам нельзя сделать вывод.

    Шаг 2 — ОХВАТ САНКЦИЙ И РЕГУЛЯТОРНЫХ ДЕЙСТВИЙ
    (используется для "covers_sanctions_and_regulatory_actions"):
    - Определи, включены ли в перечень форс-мажора:
      * санкции, embargo, запреты экспорта/импорта,
      * regulatory/governmental actions, блокировки счетов,
      * иные властные меры, делающие исполнение договора невозможным или незаконным.
    - Отличай такие формулировки от отдельной санкционной оговорки.
    - Сделай вывод: "yes" / "no" / "unclear" для
      "covers_sanctions_and_regulatory_actions".

    Шаг 3 — ЭКОНОМИЧЕСКАЯ НЕЦЕЛЕСООБРАЗНОСТЬ И ОБЩИЕ РЫНОЧНЫЕ ИЗМЕНЕНИЯ
    (используется для "includes_economic_unfeasibility_or_broad_market_changes"):
    - Проверь, включает ли определение форс-мажора категории вроде:
      * "economic hardship", "economic infeasibility",
      * общие изменения конъюнктуры рынка, падение спроса, изменение цен,
      * ухудшение финансового положения стороны.
    - Такие формулировки обычно сильно расширяют форс-мажор и повышают риск.
    - Установи значение: "yes" / "no" / "unclear".

    Шаг 4 — ПРОЦЕДУРА УВЕДОМЛЕНИЯ И ВЛИЯНИЕ НА СРОКИ
    (используется для "notification_procedure_summary"):
    - Определи, как описана процедура уведомления:
      * срок уведомления контрагента (например, 3/5/10 дней с момента события),
      * форма уведомления (письменно, через указанные каналы, с подтверждением),
      * какие сведения должны быть указаны (характер, предполагаемый срок действия и т.п.).
    - Опиши в одной краткой фразе:
      * требования к уведомлению,
      * то, как форс-мажор влияет на сроки исполнения (перенос, продление, приостановка).
    - Если процедура не описана в явном виде, так и укажи в summary.

    Шаг 5 — ОХВАТ ПЛАТЁЖНЫХ ОБЯЗАТЕЛЬСТВ
    (используется для "applies_to_payment_obligations"):
    - Определи, распространяется ли форс-мажор на денежные обязательства:
      * прямо указано, что форс-мажор не освобождает от обязанности платить,
      * или, наоборот, денежные обязательства также приостанавливаются/освобождаются.
    - Сформулируй вывод:
      * "yes" — если форс-мажорное освобождение применимо и к платежам,
      * "no" — если прямо указано, что денежные обязательства не подпадают под форс-мажор,
      * "unclear" — если текст неоднозначен или это не раскрыто.

    Шаг 6 — ПРАВО НА РАСТОРЖЕНИЕ ПРИ ДЛИТЕЛЬНОМ ФОРС-МАЖОРЕ
    (используется для "termination_right_on_long_fm"):
    - Проверь, есть ли условие, что при продолжительности форс-мажора свыше
      определённого срока (X дней/месяцев) одна или обе стороны:
      * вправе расторгнуть договор,
      * либо изменить его существенные условия.
    - Укажи:
      * "yes" — если такое право явно предусмотрено,
      * "no" — если такого условия нет,
      * "unclear" — если формулировки двусмысленны либо фрагмента недостаточно.

    Шаг 7 — ОБЩИЙ УРОВЕНЬ РИСКА ДЛЯ TARGET
    (используется для "overall_risk_level" и "reason"):
    - Оцени общий риск для Target, учитывая:
      * широту определения форс-мажора (особенно наличие экономических оснований),
      * охват современных рисков (санкции, регуляторные меры, кибератаки),
      * распространяется ли форс-мажор на платежные обязательства,
      * наличие и параметры права на расторжение при длительном форс-мажоре.
    - Сформулируй общий риск как:
      * "low" — классический, сбалансированный форс-мажор, не охватывающий платежи,
        без экономической нецелесообразности и с разумным правом на расторжение;
      * "medium" — стандартные положения с отдельными пробелами или умеренно
        расширенными основаниями;
      * "high" — очень широкое определение (экономические/рыночные причины),
        охват платежей и/или слишком лёгкая возможность выйти из договора.
    - В "reason" кратко опиши:
      * какие ключевые элементы форс-мажора присутствуют/отсутствуют;
      * почему такая конструкция снижает или повышает риск для Target.
    </instructions>

    <edge_cases>
    Обрабатывай пограничные ситуации так:

    - Форс-мажор формулируется очень широко и включает экономическую
      нецелесообразность, общие изменения рынка, ухудшение финансового положения:
      отмечай includes_economic_unfeasibility_or_broad_market_changes = "yes"
      и учитывай это как фактор высокого риска.

    - Форс-мажор прямо распространяется на платежные обязательства без чётких ограничений:
      applies_to_payment_obligations = "yes" и отражай повышенный риск
      для стороны, рассчитывающей на платежи (обычно Target).

    - Предусмотрено разумное право расторгнуть договор при длительном форс-мажоре
      (например, свыше 3–6 месяцев) после периода приостановки исполнения:
      termination_right_on_long_fm = "yes"; оценка риска зависит от того,
      у кого право и насколько критично продолжение договора для Target.

    - Есть только шаблонное описание форс-мажора (стихийные бедствия, война и т.п.)
      без упоминания санкций, кибератак и действий регуляторов,
      при этом предмет договора явно чувствителен к таким рискам:
      covers_classic_events = "yes", covers_sanctions_and_regulatory_actions = "no",
      что может тянуть на "medium" из‑за непокрытых современных рисков.

    - Текст фрагментарный: термин "форс-мажор" упомянут, но сама оговорка
      не приведена или неясна процедура уведомления:
      по конкретным полям ставь "unclear" и в reason укажи, каких элементов
      не хватает для полноценной оценки.

    - Пустые или нерелевантные фрагменты:
      по большинству полей используй "unclear",
      overall_risk_level — "medium",
      reason — "Недостаточно данных для анализа форс-мажорных положений и освобождения от ответственности."
    </edge_cases>

    <output_expectations>
    На основе твоего анализа отдельный механизм извлечения сформирует
    структурированные поля по заранее заданной схеме. Твоя задача —
    давать чёткие юридические выводы и указывать конкретные формулировки
    из текста, на которых они основаны.
    </output_expectations>
  prompt_file: null
  context_k: 4
  temperature: 0.0
  max_tokens: 512

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 500

retrieval:
  context_k: 4
  max_chunks: 8
  boost_keywords:
    - "force majeure"
    - "форс-мажор"
    - "обстоятельства непреодолимой силы"
    - "санкции"
    - "regulatory actions"
  rerank: true
  filters: {}

conditional: null

extraction:
  enabled: true
  mode: "hybrid"
  fields:
    - name: "covers_classic_events"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "covers_sanctions_and_regulatory_actions"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "includes_economic_unfeasibility_or_broad_market_changes"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "notification_procedure_summary"
      type: "string"

    - name: "applies_to_payment_obligations"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "termination_right_on_long_fm"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "overall_risk_level"
      type: "string"
      allowed_values:
        - "low"
        - "medium"
        - "high"

    - name: "reason"
      type: "string"

  store_payload: true

red_flags:
  items:
    - code: "FM1"
      description: "Форс-мажор включает экономическую нецелесообразность или общие изменения рынка."
    - code: "FM2"
      description: "Форс-мажор распространяется на платежные обязательства без чётких ограничений."
