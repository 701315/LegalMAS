id: "force_majeure"
name: "Форс-мажор и освобождение от ответственности"
group: "Terms"
description: >
  Анализирует форс-мажорные оговорки: перечень событий (классические,
  санкции, кибератаки, пандемии, экономические), охват платёжных
  обязательств, право на расторжение при длительном форс-мажоре,
  баланс прав между сторонами и механизм уведомления.

  Формирует краткий user-facing вывод и оценивает риск использования
  FM-оговорки как инструмента уклонения от обязательств.

doc_types: []

severity: "medium"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"
ui_mode: "field_extraction"

rules:
  keyword_mode: any

  keywords:
    high:
      # Прямые форс-мажорные термины
      - "(?i)force\\s+majeure"
      - "(?i)форс[-\\s]?мажор"
      - "(?i)обстоятельств[аы]\\s+непреодолимой\\s+силы"
      - "(?i)act[s]?\\s+of\\s+God"

      # Экономические основания
      - "(?i)economic\\s+(hardship|infeasibility|impossibility)"
      - "(?i)экономическ[а-яая]+\\s+(нецелесообразност|невозможност)"
      - "(?i)market\\s+(disruption|change|collapse)"
      - "(?i)ухудшени[ея]\\s+финансов[а-яого]+\\s+положени[яи]"

      # Платёжные обязательства в FM
      - "(?i)force\\s+majeure\\s+[\\s\\S]{0,40}payment"
      - "(?i)payment\\s+[\\s\\S]{0,40}force\\s+majeure"
      - "(?i)форс[-\\s]?мажор[\\s\\S]{0,40}(платёж|оплат)"
      - "(?i)shall\\s+not\\s+excuse\\s+[\\s\\S]{0,20}payment"
      - "(?i)не\\s+освобожда[ею]т\\s+от\\s+[\\s\\S]{0,20}(платёж|оплат)"

      # Расторжение при длительном FM
      - "(?i)terminat[\\s\\S]{0,30}force\\s+majeure\\s+[\\s\\S]{0,30}(exceed|continu|last)"
      - "(?i)расторж[\\s\\S]{0,30}форс[-\\s]?мажор[\\s\\S]{0,30}(свыше|более|превыш)"
      - "(?i)if\\s+force\\s+majeure\\s+(continues?|persists?)\\s+for\\s+more\\s+than"
      - "(?i)если\\s+форс[-\\s]?мажор\\s+(продолжается|длится)\\s+(более|свыше)"

    medium:
      # Классические FM-события
      - "(?i)\\bwar\\b"
      - "(?i)\\bвойн[аыу]\\b"
      - "(?i)military\\s+(action|operation|conflict)"
      - "(?i)natural\\s+disaster"
      - "(?i)стихийн[а-яое]+\\s+бедстви"

      # Пандемии/эпидемии
      - "(?i)\\bpandemic\\b"
      - "(?i)\\bпандеми\\b"
      - "(?i)\\bepidemic\\b"
      - "(?i)quarantine"
      - "(?i)карантин"

      # Санкции в FM
      - "(?i)sanctions?[\\s\\S]{0,30}force\\s+majeure"
      - "(?i)force\\s+majeure[\\s\\S]{0,30}sanctions?"
      - "(?i)эмбарго[\\s\\S]{0,20}форс[-\\s]?мажор"

      # Государственные действия
      - "(?i)government(al)?\\s+(action|measure|order|restriction)"
      - "(?i)regulatory\\s+(action|measure|order|restriction)"
      - "(?i)действи[яи]\\s+(государственн|регуляторн)"

      # Кибератаки
      - "(?i)cyber[-\\s]?(attack|incident|event)"
      - "(?i)кибератак"
      - "(?i)ransomware"

      # Уведомление о FM
      - "(?i)notif(y|ication)\\s+[\\s\\S]{0,30}force\\s+majeure"
      - "(?i)уведоми[тьла]?\\s+[\\s\\S]{0,30}форс[-\\s]?мажор"
      - "(?i)within\\s+\\d+\\s+(days?|business\\s+days?)[\\s\\S]{0,30}force\\s+majeure"

    low:
      - "(?i)force\\s+majeure"
      - "(?i)форс[-\\s]?мажор"
      - "(?i)обстоятельства\\s+непреодолимой\\s+силы"
      - "(?i)economic\\s+hardship"
      - "(?i)экономическая\\s+нецелесообразность"
      - "(?i)act[s]?\\s+of\\s+God"
      - "(?i)cyber[-\\s]?attack"
      - "(?i)pandemic"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 640

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  retrieval_profile: "force_majeure_check"
  context_k: 5
  max_chunks: 10

  retrieval_query: >
    форс-мажор force majeure обстоятельства непреодолимой силы act of God 
    стихийное бедствие пандемия санкции кибератака экономическая нецелесообразность 
    освобождение от ответственности payment obligations расторжение

  boost_keywords:
    - "force majeure"
    - "форс-мажор"
    - "обстоятельства непреодолимой силы"
    - "act of God"
    - "pandemic"
    - "пандемия"
    - "cyber attack"
    - "кибератака"
    - "war"
    - "война"
    - "natural disaster"
    - "стихийное бедствие"
    - "economic hardship"
    - "payment obligations"
    - "платёжные обязательства"
    - "shall not excuse payment"
    - "не освобождает от оплаты"
    - "termination force majeure"
    - "расторжение форс-мажор"
    - "notification force majeure"
    - "sanctions"
    - "embargo"
    - "governmental action"
    - "regulatory action"

  negative_keywords:
    - "интеллектуальная собственность"
    - "персональные данные"
    - "конфиденциальная информация"
    - "коммерческая тайна"

  preferred_unit_types:
    - "general_provision"
    - "general_provision"

  excluded_unit_types:
    - "technical_fragment"
    - "appendix_reference"
    - "structural_anchor"

  preferred_clause_functions:
    - "limitations"
    - "procedures"
    - "boilerplate"

  position_bias:
    preferred_range: [0.0, 1.0]
    boost: 0.10
    scope: "segment"

  rerank: true
  filters: {}

conditional: null

enrichment_hints:
  preferred_segment_types:
    - "contract"
    - "amendment"
    - "annex"
  excluded_segment_types:
    - "technical_specification"
    - "price_list"
    - "invoice"
    - "act"
    - "schedule"
  preferred_clause_functions:
    - "limitations"
    - "procedures"
    - "boilerplate"
  confidence_bonus_on_match: 0.10
  confidence_penalty_on_excluded_segment: 0.15

extraction:
  enabled: true
  mode: "hybrid"
  llm_max_tokens: 1250

  llm_prompt_extraction: |
    <role>
    Ты — юрист по контрактам.
    Твоя задача — точно извлечь из текста:
    1) перечень FM-событий;
    2) включены ли экономические основания;
    3) охватывает ли FM платёжные обязательства;
    4) есть ли право расторжения при длительном FM;
    5) в чью пользу работает FM.

    КРИТИЧЕСКИ ВАЖНО:
    - Извлекай ТОЛЬКО то, что прямо написано в тексте.
    - НЕ делай выводов "по умолчанию" из общих норм права.
    - НЕ додумывай FM-события если их нет в тексте.
    - Если информация отсутствует — ставь "unclear" или "no".
    - Если текст неоднозначен — ставь "unclear".
    </role>

    <context_rules>
    - Ниже приведены фрагменты, отобранные автоматически.
    - Некоторые фрагменты могут быть нерелевантны —
      игнорируй их.
    - Если среди фрагментов есть противоречия —
      укажи "unclear" и объясни в reason.
    - Если ни один фрагмент не содержит информации —
      используй значения для случая "FM-клауза отсутствует".
    - Не используй информацию из определений (definitions),
      преамбулы или приложений, если они не содержат
      substantive условий по теме check.
    </context_rules>

    <context>
    Ниже приведены релевантные фрагменты договора:

    {context}
    </context>

    <task>
    Заполни только следующие поля:
    - force_majeure_display
    - has_force_majeure_clause
    - covers_classic_events
    - covers_modern_risks
    - modern_risks_detail
    - includes_economic_grounds
    - covers_payments
    - has_termination_right
    - termination_threshold
    - fm_beneficiary
    - reason

    Общие правила:
    - пиши коротко и по-русски.
    </task>

    <instructions>
    Шаг 1 — НАЛИЧИЕ FM-ОГОВОРКИ

    Заполни "has_force_majeure_clause".

    Значения:
    - "yes" / "no" / "unclear"

    Шаг 2 — КЛАССИЧЕСКИЕ FM-СОБЫТИЯ

    Заполни "covers_classic_events".

    Значения:
    - "yes" — прямо указаны: стихийные бедствия, война,
      забастовки, государственные акты.
    - "no" / "unclear"

    Шаг 3 — СОВРЕМЕННЫЕ РИСКИ

    Заполни "covers_modern_risks" и "modern_risks_detail".

    Значения для covers_modern_risks:
    - "yes" / "no" / "unclear"

    Для modern_risks_detail:
    - Если есть: перечисли через ";":
      "пандемии; санкции; кибератаки".
    - Нет: "Не применимо".
    - Неясно: "Не удалось определить".

    Шаг 4 — ЭКОНОМИЧЕСКИЕ ОСНОВАНИЯ

    Заполни "includes_economic_grounds".

    Значения:
    - "yes" — прямо включены: economic hardship,
      market disruption, ухудшение финансового положения.
    - "no" / "unclear"

    Шаг 5 — ПЛАТЁЖНЫЕ ОБЯЗАТЕЛЬСТВА

    Заполни "covers_payments".

    Значения:
    - "yes" — FM освобождает от платёжных обязательств.
    - "no" — прямо указано: платежи FM не охватываются.
    - "unclear" — не раскрыто.

    Шаг 6 — ПРАВО РАСТОРЖЕНИЯ

    Заполни "has_termination_right" и "termination_threshold".

    Значения для has_termination_right:
    - "yes" / "no" / "unclear"

    Для termination_threshold:
    - Если указан: "90 дней", "6 месяцев", "180 days".
    - Право есть, порог не указан: "Не определён".
    - Нет права расторжения: "Не применимо".
    - FM-клауза отсутствует: "Не установлено".
    - Нельзя определить: "Не удалось определить".

    Шаг 7 — В ЧЬЮ ПОЛЬЗУ FM

    Заполни "fm_beneficiary".

    Значения:
    - "mutual" — симметрично.
    - "counterparty" — преимущественно контрагент.
    - "target" — преимущественно Target.
    - "unclear" — неясно.

    Шаг 8 — DISPLAY ДЛЯ DD GRID

    Заполни "force_majeure_display".

    Это поле — краткий итог для таблицы.
    Сформируй его на основе уже заполненных полей:
    - has_force_majeure_clause
    - covers_classic_events / covers_modern_risks
    - includes_economic_grounds
    - covers_payments
    - has_termination_right + termination_threshold
    - fm_beneficiary
    Не добавляй информацию, которой нет в этих полях.

    Базовые случаи:
    - has_force_majeure_clause = "no":
      "FM-оговорка не обнаружена"
    - has_force_majeure_clause = "unclear":
      "Не удалось определить наличие FM"

    Если FM есть — комбинируй через ";":
    - охват событий
    - covers_payments (если "yes": предупредить)
    - has_termination_right + termination_threshold
    - fm_beneficiary (если не "mutual")

    Примеры:
    - "FM есть; классические + пандемии + санкции;
      не освобождает от платежей; расторжение > 90 дней"
    - "FM есть; включает economic hardship;
      освобождает от платежей; расторжение у контрагента"
    - "FM-оговорка не обнаружена"
    - "Не удалось определить наличие FM"

    Ограничение: не более 4 фактов через ";".

    Шаг 9 — КРАТКОЕ ОБОСНОВАНИЕ

    Заполни "reason".

    Формат:
    - Первое предложение: краткий вывод
      (события, экономические основания, платежи,
      расторжение, бенефициар).
    - Второе предложение: цитата из текста в кавычках
      (самый релевантный фрагмент, до 100 символов).

    Примеры:
    - "FM-оговорка охватывает классические события
      и пандемии; платежи не освобождаются; расторжение
      при FM > 90 дней.
      «Force majeure shall not excuse payment obligations»."
    - "FM-оговорка не обнаружена в представленных фрагментах."
    </instructions>

    <edge_cases>
    - FM прямо исключает платёжные обязательства:
      * covers_payments = "no"

    - Нет FM-оговорки:
      * has_force_majeure_clause = "no"
      * termination_threshold = "Не установлено"
      * force_majeure_display = "FM-оговорка не обнаружена"

    - FM есть, но право расторжения не предусмотрено:
      * has_termination_right = "no"
      * termination_threshold = "Не применимо"

    - FM есть, право расторжения есть, порог не указан:
      * has_termination_right = "yes"
      * termination_threshold = "Не определён"

    - Нет релевантных фрагментов:
      * has_force_majeure_clause = "unclear"
      * termination_threshold = "Не удалось определить"
      * force_majeure_display =
        "Не удалось определить наличие FM"
    </edge_cases>

    <output_expectations>
    - Верни результат строго в формате JSON.
    - Не оборачивай в markdown-блоки (без ```).
    - Не добавляй комментариев вне JSON.
    - Все значения полей с allowed_values — на английском
      (как указано в списке).
    - Свободные текстовые поля (force_majeure_display,
      modern_risks_detail, termination_threshold, reason) —
      на русском языке.
    - Не добавляй никаких полей, кроме указанных.

    Пример структуры ответа:
    {
      "force_majeure_display": "FM есть; классические + пандемии; не освобождает от платежей; расторжение > 90 дней",
      "has_force_majeure_clause": "yes",
      "covers_classic_events": "yes",
      "covers_modern_risks": "yes",
      "modern_risks_detail": "пандемии; санкции",
      "includes_economic_grounds": "no",
      "covers_payments": "no",
      "has_termination_right": "yes",
      "termination_threshold": "90 дней",
      "fm_beneficiary": "mutual",
      "reason": "FM охватывает классические события и пандемии; платежи не освобождаются; расторжение > 90 дней. «Force majeure shall not excuse payment»."
    }
    </output_expectations>

  fields:
    - name: "force_majeure_display"
      type: "string"
      presentation: "fact"
      label: "Форс-мажор"
      description: "Нормализованный user-facing вывод для DD Grid"
      display_in_grid: true
      display_priority: 1

    - name: "has_force_majeure_clause"
      type: "string"
      presentation: "signal"
      description: "Наличие FM-оговорки"
      display_in_grid: false
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "covers_classic_events"
      type: "string"
      presentation: "signal"
      description: "Классические FM-события"
      display_in_grid: false
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "covers_modern_risks"
      type: "string"
      presentation: "signal"
      description: "Современные риски (пандемии, санкции, кибер)"
      display_in_grid: false
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "modern_risks_detail"
      type: "string"
      presentation: "fact"
      label: "Современные риски"
      description: "Перечень современных рисков в FM"
      display_in_grid: false

    - name: "includes_economic_grounds"
      type: "string"
      presentation: "signal"
      description: "Экономические основания в FM"
      display_in_grid: false
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "covers_payments"
      type: "string"
      presentation: "signal"
      description: "FM охватывает платёжные обязательства"
      display_in_grid: false
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "has_termination_right"
      type: "string"
      presentation: "signal"
      description: "Право расторжения при длительном FM"
      display_in_grid: false
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "termination_threshold"
      type: "string"
      presentation: "fact"
      label: "Порог расторжения"
      description: "Минимальный срок FM для права расторжения"
      display_in_grid: true
      display_priority: 2

    - name: "fm_beneficiary"
      type: "string"
      presentation: "signal"
      description: "В чью пользу работает FM"
      display_in_grid: false
      allowed_values:
        - "mutual"
        - "counterparty"
        - "target"
        - "unclear"

    - name: "reason"
      type: "string"
      presentation: "diagnostic"
      description: "Обоснование"
      display_in_grid: false

  store_payload: true

  
