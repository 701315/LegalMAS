id: "force_majeure"
name: "Форс-мажор и освобождение от ответственности"
group: "Terms"
description: >
  Анализирует форс-мажорные оговорки: перечень событий (классические,
  санкции, кибератаки, пандемии, экономические), охват платёжных
  обязательств, право на расторжение при длительном форс-мажоре,
  баланс прав между сторонами и механизм уведомления.

  Формирует краткий user-facing вывод и оценивает риск использования
  FM-оговорки как инструмента уклонения от обязательств.

doc_types: []

severity: "medium"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"
ui_mode: "field_extraction"

rules:
  keyword_mode: any

  keywords:
    high:
      - "(?i)force\\s+majeure"
      - "(?i)форс[-\\s]?мажор"
      - "(?i)обстоятельств[аы]\\s+непреодолимой\\s+силы"
      - "(?i)act[s]?\\s+of\\s+God"
      - "(?i)economic\\s+(hardship|infeasibility|impossibility)"
      - "(?i)экономическ[а-яая]+\\s+(нецелесообразност|невозможност)"
      - "(?i)market\\s+(disruption|change|collapse)"
      - "(?i)ухудшени[ея]\\s+финансов[а-яого]+\\s+положени[яи]"
      - "(?i)force\\s+majeure\\s+[\\s\\S]{0,40}payment"
      - "(?i)payment\\s+[\\s\\S]{0,40}force\\s+majeure"
      - "(?i)форс[-\\s]?мажор[\\s\\S]{0,40}(платёж|оплат)"
      - "(?i)shall\\s+not\\s+excuse\\s+[\\s\\S]{0,20}payment"
      - "(?i)не\\s+освобожда[ею]т\\s+от\\s+[\\s\\S]{0,20}(платёж|оплат)"
      - "(?i)terminat[\\s\\S]{0,30}force\\s+majeure\\s+[\\s\\S]{0,30}(exceed|continu|last)"
      - "(?i)расторж[\\s\\S]{0,30}форс[-\\s]?мажор[\\s\\S]{0,30}(свыше|более|превыш)"
      - "(?i)if\\s+force\\s+majeure\\s+(continues?|persists?)\\s+for\\s+more\\s+than"
      - "(?i)если\\s+форс[-\\s]?мажор\\s+(продолжается|длится)\\s+(более|свыше)"

    medium:
      - "(?i)\\bwar\\b"
      - "(?i)\\bвойн[аыу]\\b"
      - "(?i)military\\s+(action|operation|conflict)"
      - "(?i)natural\\s+disaster"
      - "(?i)стихийн[а-яое]+\\s+бедстви"
      - "(?i)\\bpandemic\\b"
      - "(?i)\\bпандеми\\b"
      - "(?i)\\bepidemic\\b"
      - "(?i)quarantine"
      - "(?i)карантин"
      - "(?i)sanctions?[\\s\\S]{0,30}force\\s+majeure"
      - "(?i)force\\s+majeure[\\s\\S]{0,30}sanctions?"
      - "(?i)эмбарго[\\s\\S]{0,20}форс[-\\s]?мажор"
      - "(?i)government(al)?\\s+(action|measure|order|restriction)"
      - "(?i)regulatory\\s+(action|measure|order|restriction)"
      - "(?i)действи[яи]\\s+(государственн|регуляторн)"
      - "(?i)cyber[-\\s]?(attack|incident|event)"
      - "(?i)кибератак"
      - "(?i)ransomware"
      - "(?i)notif(y|ication)\\s+[\\s\\S]{0,30}force\\s+majeure"
      - "(?i)уведоми[тьла]?\\s+[\\s\\S]{0,30}форс[-\\s]?мажор"
      - "(?i)within\\s+\\d+\\s+(days?|business\\s+days?)[\\s\\S]{0,30}force\\s+majeure"

    low:
      - "(?i)force\\s+majeure"
      - "(?i)форс[-\\s]?мажор"
      - "(?i)обстоятельства\\s+непреодолимой\\s+силы"
      - "(?i)economic\\s+hardship"
      - "(?i)экономическая\\s+нецелесообразность"
      - "(?i)act[s]?\\s+of\\s+God"
      - "(?i)cyber[-\\s]?attack"
      - "(?i)pandemic"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 640

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  retrieval_profile: "force_majeure_check"
  context_k: 5
  max_chunks: 10

  retrieval_query: >
    форс-мажор force majeure обстоятельства непреодолимой силы act of God 
    стихийное бедствие пандемия санкции кибератака экономическая нецелесообразность 
    освобождение от ответственности payment obligations расторжение

  boost_keywords:
    - "force majeure"
    - "форс-мажор"
    - "обстоятельства непреодолимой силы"
    - "act of God"
    - "pandemic"
    - "пандемия"
    - "cyber attack"
    - "кибератака"
    - "war"
    - "война"
    - "natural disaster"
    - "стихийное бедствие"
    - "economic hardship"
    - "payment obligations"
    - "платёжные обязательства"
    - "shall not excuse payment"
    - "не освобождает от оплаты"
    - "termination force majeure"
    - "расторжение форс-мажор"
    - "notification force majeure"
    - "sanctions"
    - "embargo"
    - "governmental action"
    - "regulatory action"

  negative_keywords:
    - "интеллектуальная собственность"
    - "персональные данные"
    - "конфиденциальная информация"
    - "коммерческая тайна"

  preferred_unit_types:
    - "general_provision"

  excluded_unit_types:
    - "technical_fragment"
    - "appendix_reference"
    - "structural_anchor"

  preferred_clause_functions:
    - "limitations"
    - "procedures"
    - "boilerplate"

  position_bias:
    preferred_range: [0.0, 1.0]
    boost: 0.10
    scope: "segment"

  rerank: true
  filters: {}

conditional: null

enrichment_hints:
  preferred_segment_types:
    - "contract"
    - "amendment"
    - "annex"
  excluded_segment_types:
    - "technical_specification"
    - "price_list"
    - "invoice"
    - "act"
    - "schedule"
  preferred_clause_functions:
    - "limitations"
    - "procedures"
    - "boilerplate"
  confidence_bonus_on_match: 0.10
  confidence_penalty_on_excluded_segment: 0.15

extraction:
  enabled: true
  mode: "hybrid"
  llm_max_tokens: 1350

  presence_signal:
    field: "has_force_majeure_clause"
    present_values: ["present"]
    missing_values: ["missing"]
    unclear_values: ["unclear"]

  llm_prompt_extraction: |
    <role>
    Ты — юрист по контрактам.
    Твоя задача — точно извлечь из текста:
    1) есть ли в договоре FM-оговорка;
    2) если есть — какие события охвачены:
       - классические FM-события;
       - современные риски (пандемии, санкции, кибератаки);
       - экономические основания;
       - охват платёжных обязательств;
       - право расторжения при длительном FM;
       - в чью пользу работает FM.

    КРИТИЧЕСКИ ВАЖНО:
    - Извлекай ТОЛЬКО то, что прямо написано в тексте.
    - НЕ делай выводов "по умолчанию" из общих норм права.
    - НЕ додумывай FM-события если их нет в тексте.
    - Если ни один фрагмент не содержит FM-оговорку
      (нет упоминаний force majeure / форс-мажор / обстоятельств
      непреодолимой силы) — has_force_majeure_clause = "missing".
    - Если тексты по теме есть, но вывод сделать нельзя —
      has_force_majeure_clause = "unclear".
    </role>

    <context_rules>
    - Ниже приведены фрагменты, отобранные автоматически.
    - Некоторые фрагменты могут быть нерелевантны —
      игнорируй их.
    - Если среди фрагментов есть противоречия —
      укажи "unclear" и объясни в reason.
    - Не используй информацию из определений (definitions),
      преамбулы или приложений, если они не содержат
      substantive условий по теме check.
    - Если ни один фрагмент не содержит информации о FM —
      has_force_majeure_clause = "missing", location = null.
      Не использовать "unclear" при полном отсутствии релевантных
      фрагментов.
    </context_rules>

    <context>
    Ниже приведены релевантные фрагменты договора:

    {context}
    </context>

    <task>
    Заполни только следующие поля:
    - force_majeure_display
    - has_force_majeure_clause
    - covers_classic_events
    - covers_modern_risks
    - modern_risks_detail
    - includes_economic_grounds
    - covers_payments
    - has_termination_right
    - termination_threshold
    - fm_beneficiary
    - reason
    </task>

    <location_instructions>
    Для каждого поля по возможности укажи location в формате:
    {"clause_ref": "п. 12.1", "page": 7, "quote": "дословная фраза из договора"}

    Правила:
    - clause_ref — короткая ссылка на пункт / раздел / статью именно в том
      виде, как она написана в договоре;
    - page — целое число страницы;
    - quote — дословная фраза из текста договора (НЕ пересказ, НЕ парафраз).
      Копируй её посимвольно, сохраняя формулировку и порядок слов.
      Оптимальная длина: 30–300 символов.
    - Для synthesized-полей (force_majeure_display, modern_risks_detail,
      termination_threshold, reason) location ВСЕГДА null.
    - Для has_force_majeure_clause = "missing" — location = null.
    - Для has_force_majeure_clause = "present" / "unclear" — quote
      с наиболее релевантной фразой договора.
    - Для covers_classic_events, covers_modern_risks,
      includes_economic_grounds, covers_payments, has_termination_right:
      * если "yes" — quote с фразой-основанием;
      * если "no" — различай: прямое исключение (quote обязательна)
        vs отсутствие упоминания (location = null);
      * если "unclear" — location = null.
    - Для fm_beneficiary — quote с фразой, показывающей сторону.
    - Не выдумывай location или quote. Если дословную фразу определить
      нельзя — location = null.
    </location_instructions>

    <instructions>
    Шаг 0 — НАЛИЧИЕ РЕГУЛИРОВАНИЯ FM

    Заполни "has_force_majeure_clause".

    Значения:
    - "present" — если хотя бы одно содержательное signal-поле
      указывает на наличие информации по теме:
      * covers_classic_events = "yes";
      * covers_modern_risks = "yes";
      * includes_economic_grounds = "yes";
      * covers_payments = "yes";
      * has_termination_right = "yes";
      * fm_beneficiary ∈ {"mutual", "counterparty", "target"};
      * ЛИБО любое поле = "no", но с заполненным location
        с прямой цитатой (см. RF3).
    - "missing" — если все содержательные поля = "no" БЕЗ цитат,
      ЛИБО фрагментов по теме нет вообще.
    - "unclear" — если все содержательные = "unclear" при наличии
      фрагментов, но невозможности вывода.

    Шаг 1 — КЛАССИЧЕСКИЕ FM-СОБЫТИЯ

    Заполни "covers_classic_events".

    Значения:
    - "yes" — прямо указаны: стихийные бедствия, война,
      забастовки, государственные акты.
    - "no" — нет.
    - "unclear" — нельзя определить.

    Шаг 2 — СОВРЕМЕННЫЕ РИСКИ

    Заполни "covers_modern_risks" и "modern_risks_detail".

    Значения для covers_modern_risks:
    - "yes" — прямо указаны современные риски (пандемии,
      санкции, кибератаки, embargo).
    - "no" — нет.
    - "unclear" — нельзя определить.

    Для modern_risks_detail:
    - Если есть: перечисли через ";":
      "пандемии; санкции; кибератаки".
    - Нет: "Не применимо".
    - Неясно: "Не удалось определить".

    Шаг 3 — ЭКОНОМИЧЕСКИЕ ОСНОВАНИЯ

    Заполни "includes_economic_grounds".

    Значения:
    - "yes" — прямо включены: economic hardship,
      market disruption, ухудшение финансового положения.
    - "no" — нет.
    - "unclear" — нельзя определить.

    Шаг 4 — ПЛАТЁЖНЫЕ ОБЯЗАТЕЛЬСТВА

    Заполни "covers_payments".

    Значения:
    - "yes" — FM освобождает от платёжных обязательств.
    - "no" — прямо указано: платежи FM не охватываются.
    - "unclear" — не раскрыто.

    Шаг 5 — ПРАВО РАСТОРЖЕНИЯ

    Заполни "has_termination_right" и "termination_threshold".

    Значения для has_termination_right:
    - "yes" — право расторжения при длительном FM есть.
    - "no" — нет.
    - "unclear" — нельзя определить.

    Для termination_threshold:
    - Если указан: "90 дней", "6 месяцев", "180 days".
    - Право есть, порог не указан: "Не определён".
    - Нет права расторжения: "Не применимо".
    - FM-клауза отсутствует: "Не установлено".
    - Нельзя определить: "Не удалось определить".

    Шаг 6 — В ЧЬЮ ПОЛЬЗУ FM

    Заполни "fm_beneficiary".

    Значения:
    - "mutual" — симметрично.
    - "counterparty" — преимущественно контрагент.
    - "target" — преимущественно Target.
    - "unclear" — неясно.

    Шаг 7 — DISPLAY ДЛЯ DD GRID

    Заполни "force_majeure_display".

    Это итоговое поле для таблицы.
    Строй его ТОЛЬКО на основе уже заполненных полей выше.
    Не добавляй информацию сверх них.

    Правила:
    - Если has_force_majeure_clause = "missing":
      "FM-оговорка не обнаружена"
    - Если has_force_majeure_clause = "unclear":
      "Не удалось определить наличие FM"
    - Если has_force_majeure_clause = "present" — комбинируй через ";":
      * охват событий (классические / пандемии / санкции)
      * includes_economic_grounds (если "yes": "экономические основания")
      * covers_payments (если "yes": "освобождает от платежей";
        если "no": "не освобождает от платежей")
      * has_termination_right + termination_threshold
      * fm_beneficiary (если не "mutual")
    - Не более 4 фактов через ";".

    Шаг 8 — КРАТКОЕ ОБОСНОВАНИЕ

    Заполни "reason".

    Правила:
    - Первое предложение — краткий вывод.
    - Второе — короткая цитата из текста (до 100 символов).
    - Пиши по-русски.
    </instructions>

    <edge_cases>
    - FM прямо исключает платёжные обязательства:
      * has_force_majeure_clause = "present"
      * covers_payments = "no"

    - FM-оговорка отсутствует:
      * has_force_majeure_clause = "missing"
      * covers_classic_events = "no"
      * covers_modern_risks = "no"
      * modern_risks_detail = "Не применимо"
      * includes_economic_grounds = "no"
      * covers_payments = "no"
      * has_termination_right = "no"
      * termination_threshold = "Не установлено"
      * fm_beneficiary = "unclear"
      * force_majeure_display = "FM-оговорка не обнаружена"
      * location у всех полей = null.

    - FM есть, право расторжения есть, порог не указан:
      * has_force_majeure_clause = "present"
      * has_termination_right = "yes"
      * termination_threshold = "Не определён"

    - Формулировки есть, но вывод невозможен:
      * has_force_majeure_clause = "unclear"
      * force_majeure_display =
        "Не удалось определить наличие FM"
    </edge_cases>

    <output_expectations>
    - Верни результат строго в формате JSON.
    - Не оборачивай в markdown-блоки (без ```).
    - Не добавляй комментариев вне JSON.
    - Все значения полей с allowed_values — на английском.
    - Свободные текстовые поля (force_majeure_display,
      modern_risks_detail, termination_threshold, reason) —
      на русском языке.
    - Не добавляй полей, кроме указанных.
    - Для каждого поля возвращай объект с ключами
      "value", "confidence", "location".

    Пример структуры ответа:
    {
      "force_majeure_display": {"value": "FM есть; классические + пандемии; не освобождает от платежей; расторжение > 90 дней", "confidence": 0.92, "location": null},
      "has_force_majeure_clause": {"value": "present", "confidence": 0.95, "location": {"clause_ref": "п. 12.1", "page": 7, "quote": "Стороны освобождаются от ответственности при наступлении обстоятельств непреодолимой силы"}},
      "covers_classic_events": {"value": "yes", "confidence": 0.90, "location": {"clause_ref": "п. 12.1", "page": 7, "quote": "стихийные бедствия, военные действия, акты органов власти"}},
      "covers_modern_risks": {"value": "yes", "confidence": 0.85, "location": {"clause_ref": "п. 12.2", "page": 7, "quote": "пандемии, эпидемии, карантинные ограничения"}},
      "modern_risks_detail": {"value": "пандемии", "confidence": 0.85, "location": null},
      "includes_economic_grounds": {"value": "no", "confidence": 0.80, "location": null},
      "covers_payments": {"value": "no", "confidence": 0.90, "location": {"clause_ref": "п. 12.3", "page": 7, "quote": "Force majeure shall not excuse payment obligations"}},
      "has_termination_right": {"value": "yes", "confidence": 0.90, "location": {"clause_ref": "п. 12.4", "page": 7, "quote": "If force majeure continues for more than 90 days, either party may terminate"}},
      "termination_threshold": {"value": "90 дней", "confidence": 0.95, "location": null},
      "fm_beneficiary": {"value": "mutual", "confidence": 0.90, "location": {"clause_ref": "п. 12.4", "page": 7, "quote": "either party may terminate"}},
      "reason": {"value": "...", "confidence": 0.90, "location": null}
    }
    </output_expectations>

  fields:
    - name: "force_majeure_display"
      type: "string"
      presentation: "fact"
      label: "Форс-мажор"
      description: "Нормализованный user-facing вывод для DD Grid"
      display_in_grid: true
      display_priority: 1

    - name: "has_force_majeure_clause"
      type: "string"
      presentation: "signal"
      risk_weight: "info"
      description: "Наличие регулирования FM в договоре"
      display_in_grid: false
      allowed_values:
        - "present"
        - "missing"
        - "unclear"

    - name: "covers_classic_events"
      type: "string"
      presentation: "signal"
      risk_weight: "medium"
      description: "Классические FM-события"
      display_in_grid: false
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "covers_modern_risks"
      type: "string"
      presentation: "signal"
      risk_weight: "medium"
      description: "Современные риски (пандемии, санкции, кибер)"
      display_in_grid: false
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "modern_risks_detail"
      type: "string"
      presentation: "fact"
      label: "Современные риски"
      description: "Перечень современных рисков в FM"
      display_in_grid: false

    - name: "includes_economic_grounds"
      type: "string"
      presentation: "signal"
      risk_weight: "high"
      description: "Экономические основания в FM"
      display_in_grid: false
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "covers_payments"
      type: "string"
      presentation: "signal"
      risk_weight: "high"
      description: "FM охватывает платёжные обязательства"
      display_in_grid: false
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "has_termination_right"
      type: "string"
      presentation: "signal"
      risk_weight: "medium"
      description: "Право расторжения при длительном FM"
      display_in_grid: false
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "termination_threshold"
      type: "string"
      presentation: "fact"
      label: "Порог расторжения"
      description: "Минимальный срок FM для права расторжения"
      display_in_grid: true
      display_priority: 2

    - name: "fm_beneficiary"
      type: "string"
