id: "force_majeure"
name: "Форс-мажор и освобождение от ответственности"
description: >
  Анализирует форс-мажор: перечень событий, процедуру уведомления,
  срок освобождения, право на расторжение, охват платежных обязательств.

doc_types: []

severity: "medium"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"

rules:
  keywords:
    - "форс-мажор"
    - "обстоятельства непреодолимой силы"
    - "force majeure"
    - "act of God"
    - "война"
    - "военные действия"
    - "пандемия"
    - "epidemic"
    - "pandemic"
    - "санкции"
    - "sanctions"
    - "regulatory actions"
    - "governmental actions"
    - "забастовка"
    - "страйк"
    - "кибератака"
    - "cyber attack"
    - "киберинцидент"
  keyword_mode: "any"
  regex_patterns: []
  clause_patterns: []

llm:
  prompt_template: |
    <role>
    Ты — юрист по контрактам и управлению рисками.
    Твоя специализация — форс-мажорные оговорки и освобождение от ответственности.
    </role>

    <context>
    Ниже приведены фрагменты договора, где могут быть положения о форс-мажоре:

    {context}
    </context>

    <instructions>
    Определи:

    1) Перечень классических форс-мажорных событий (covers_classic_events):
       - стихийные бедствия (пожар, наводнение, землетрясение, иные Acts of God),
         война, военные действия, забастовки, массовые беспорядки, действия
         государственных органов, эпидемии/пандемии и т.п.
       Значения:
       - "yes" — если такой перечень явно присутствует;
       - "no" — если форс-мажор в тексте сформулирован без таких классических событий;
       - "unclear" — если вывод сделать нельзя.

    2) Охват санкций и регуляторных действий
       (covers_sanctions_and_regulatory_actions):
       - включены ли санкции, embargo, regulatory/governmental actions,
         запреты на экспорт/импорт, блокировки счетов и иные меры властей
         в перечень форс-мажора;
       - важно отличать такие формулировки от отдельной санкционной оговорки.

    3) Включена ли экономическая нецелесообразность/общие изменения рынка
       (includes_economic_unfeasibility_or_broad_market_changes):
       - есть ли в определении форс-мажора категории вроде:
         * "economic hardship", "economic infeasibility",
         * общие изменения конъюнктуры рынка, падение спроса, изменение цен,
         * ухудшение финансового положения стороны.
       Это обычно повышает риск для контрагента.

    4) Процедура уведомления и срок освобождения
       (notification_procedure_summary):
       - прописаны ли требования:
         * в какой срок нужно уведомить контрагента (например, 3/10 дней);
         * в какой форме (письменно, с подтверждением, через определённые каналы);
         * какие сведения указать (характер события, срок действия и т.п.);
       - кратко опиши процедуру и влияние на срок исполнения (перенос, продление).

    5) Охват платежных обязательств (applies_to_payment_obligations):
       - распространяется ли форс-мажор на обязанность платить:
         * прямо указано, что денежные обязательства не освобождаются форс-мажором;
         * или, наоборот, форс-мажорное освобождение применимо и к платежам.
       Это критично для оценки риска.

    6) Право расторгнуть договор при длительном форс-мажоре
       (termination_right_on_long_fm):
       - есть ли условие, что при продолжительности форс-мажора свыше X дней/месяцев
         сторона (одна или обе) вправе расторгнуть договор;
       - укажи "yes", если такое право явно предусмотрено, "no" — если нет,
         "unclear" — если текст неоднозначен.

    7) Оцени общий риск для Target (overall_risk_level: low / medium / high):
       - учитывая широту определения форс-мажора, наличие «экономических» оснований,
         охват платежей и право на расторжение.
    </instructions>

    <edge_cases>
    ВАЖНО — пограничные случаи:

    — Если форс-мажор формулируется очень широко и включает экономическую
      нецелесообразность, общие изменения рынка, ухудшение финансового положения:
      includes_economic_unfeasibility_or_broad_market_changes = "yes",
      риск обычно "high", так как контрагент может легко ссылаться на форс-мажор.

    — Если форс-мажор прямо распространяется на платежные обязательства
      без чётких ограничений:
      applies_to_payment_obligations = "yes",
      это повышает риск для стороны, рассчитывающей на платежи (обычно Target).

    — Если предусмотрено разумное право расторгнуть договор при длительном
      форс-мажоре (например, свыше 3–6 месяцев), после периода приостановки
      исполнения:
      termination_right_on_long_fm = "yes",
      но оценка риска зависит от того, у кого именно это право и насколько
      для Target критично продолжение договора.

    — Если есть только шаблонное описание форс-мажора (стихийные бедствия,
      война и т.п.) без упоминания санкций, кибератак и действий регуляторов,
      при этом предмет договора явно чувствителен к таким рискам:
      covers_classic_events = "yes",
      covers_sanctions_and_regulatory_actions = "no",
      риск может быть "medium" из-за непокрытых современных рисков.

    — Если текст фрагментарный: термин "форс-мажор" упомянут, но сама оговорка
      не приведена или неясна процедура уведомления:
      по конкретным полям ставь "unclear" и в reason явно укажи, какого блока
      информации не хватает.

    — Пустые или нерелевантные фрагменты:
      большинство полей = "unclear",
      overall_risk_level = "medium",
      reason = "Недостаточно данных для анализа форс-мажорных положений и освобождения от ответственности."
    </edge_cases>

    <examples>
    ПРИМЕР 1 — КЛАССИЧЕСКИЙ ФОРС-МАЖОР, БЕЗ ЭКОНОМИЧЕСКИХ ОСНОВАНИЙ (MEDIUM/LOW):

    Фрагмент: "Стороны не несут ответственности за неисполнение обязательств,
    если оно вызвано обстоятельствами непреодолимой силы (форс-мажор):
    стихийными бедствиями, войной, забастовками, решениями государственных
    органов. Сторона обязана уведомить другую сторону о наступлении таких
    обстоятельств в течение 5 рабочих дней. Срок исполнения обязательств
    переносится на период действия форс-мажора. Форс-мажор не освобождает
    Стороны от обязанности исполнения денежных обязательств."

    {{
      "covers_classic_events": "yes",
      "covers_sanctions_and_regulatory_actions": "yes",
      "includes_economic_unfeasibility_or_broad_market_changes": "no",
      "notification_procedure_summary": "Уведомление в течение 5 рабочих дней; срок исполнения переносится на время действия форс-мажора.",
      "applies_to_payment_obligations": "no",
      "termination_right_on_long_fm": "unclear",
      "overall_risk_level": "low",
      "reason": "Форс-мажор ограничен классическими событиями и решениями органов власти, не распространяется на платежи, есть понятная процедура уведомления; явного права на расторжение при длительном форс-мажоре нет."
    }}

    ПРИМЕР 2 — ШИРОКИЙ ФОРС-МАЖОР С ЭКОНОМИЧЕСКОЙ НЕЦЕЛЕСООБРАЗНОСТЬЮ (HIGH):

    Фрагмент: "К обстоятельствам непреодолимой силы Стороны относят любые события,
    делающие исполнение Договора экономически нецелесообразным, включая существенные
    изменения рыночных цен, падение спроса и ухудшение финансового положения
    любой из Сторон."

    {{
      "covers_classic_events": "unclear",
      "covers_sanctions_and_regulatory_actions": "unclear",
      "includes_economic_unfeasibility_or_broad_market_changes": "yes",
      "notification_procedure_summary": "Условия уведомления не описаны во фрагменте.",
      "applies_to_payment_obligations": "unclear",
      "termination_right_on_long_fm": "unclear",
      "overall_risk_level": "high",
      "reason": "Форс-мажор включает экономическую нецелесообразность и общие изменения рынка, что позволяет стороне легко ссылаться на форс-мажор при изменении конъюнктуры и создаёт высокий риск для Target."
    }}

    ПРИМЕР 3 — ПРАВО НА РАСТОРЖЕНИЕ ПРИ ДЛИТЕЛЬНОМ ФОРС-МАЖОРЕ (MEDIUM):

    Фрагмент: "В случае, если форс-мажорные обстоятельства длятся более 90 дней
    подряд, каждая из Сторон вправе расторгнуть Договор, уведомив другую Сторону
    за 10 дней. До истечения указанного срока действия форс-мажора Сторона,
    подвергшаяся воздействию, освобождается от ответственности за просрочку
    исполнения."

    {{
      "covers_classic_events": "unclear",
      "covers_sanctions_and_regulatory_actions": "unclear",
      "includes_economic_unfeasibility_or_broad_market_changes": "no",
      "notification_procedure_summary": "Уведомление о расторжении за 10 дней по истечении 90 дней форс-мажора; освобождение от ответственности на период форс-мажора.",
      "applies_to_payment_obligations": "unclear",
      "termination_right_on_long_fm": "yes",
      "overall_risk_level": "medium",
      "reason": "Предусмотрено взаимное право расторжения при форс-мажоре свыше 90 дней и освобождение от ответственности за просрочку; риск зависит от критичности продолжения договора для Target."
    }}
    </examples>

    <output_format>
    Твой ответ ДОЛЖЕН быть строго валидным JSON-объектом со следующими
    полями:

    {{
      "covers_classic_events": "one of: yes | no | unclear",
      "covers_sanctions_and_regulatory_actions": "one of: yes | no | unclear",
      "includes_economic_unfeasibility_or_broad_market_changes": "one of: yes | no | unclear",
      "notification_procedure_summary": "string — краткое описание порядка уведомления и влияния на сроки исполнения",
      "applies_to_payment_obligations": "one of: yes | no | unclear",
      "termination_right_on_long_fm": "one of: yes | no | unclear",
      "overall_risk_level": "one of: low | medium | high",
      "reason": "string — краткое объяснение на русском с указанием ключевых формулировок форс-мажора и их влияния на риск для Target"
    }}

    Все перечисленные поля ДОЛЖНЫ присутствовать в JSON, даже если их значение равно null.
    </output_format>

    <constraints>
    ЖЁСТКИЕ ПРАВИЛА:
    1. Выведи ТОЛЬКО один JSON-объект. Никакого текста до или после.
    2. Не пиши "Вот JSON", "Here is the JSON" и т.п.
    3. Не используй Markdown, бэктики ``` или любые обёртки.
    4. Все строки — в двойных кавычках.
    5. Значения перечислимых полей — СТРОГО из указанных вариантов.
    6. Ключи — точно как указано, без добавления новых.
    7. Поле "reason" ДОЛЖНО содержать конкретные формулировки из фрагментов
       и вывод по рискам, а не общие фразы вроде "есть риски".
    8. Начни ответ сразу с символа {{
    9. Если по какому‑то полю нет достаточно информации в тексте —
       верни для него 'unclear' или null (для reason пустое значение
       недопустимо — нужно объяснение). НЕ придумывай значения, не интерполируй.
    </constraints>
  prompt_file: null
  context_k: 4
  temperature: 0.0
  max_tokens: 512

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 500

retrieval:
  context_k: 4
  max_chunks: 8
  boost_keywords:
    - "force majeure"
    - "форс-мажор"
    - "обстоятельства непреодолимой силы"
    - "санкции"
    - "regulatory actions"
  rerank: true
  filters: {}

conditional: null

extraction:
  enabled: true
  mode: "hybrid"
  fields:
    - name: "covers_classic_events"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
    - name: "covers_sanctions_and_regulatory_actions"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
    - name: "includes_economic_unfeasibility_or_broad_market_changes"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
    - name: "notification_procedure_summary"
      type: "string"
    - name: "applies_to_payment_obligations"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
    - name: "termination_right_on_long_fm"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
    - name: "overall_risk_level"
      type: "string"
      allowed_values:
        - "low"
        - "medium"
        - "high"
    - name: "reason"
      type: "string"
  store_payload: true

red_flags:
  items:
    - code: "FM1"
      description: "Форс-мажор включает экономическую нецелесообразность/общие изменения рынка."
    - code: "FM2"
      description: "Форс-мажор распространяется на платежные обязательства без чётких ограничений."
      