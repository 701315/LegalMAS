id: "force_majeure"
name: "Форс-мажор и освобождение от ответственности"
description: >
  Анализирует форс-мажорные оговорки: перечень событий (классические,
  санкции, кибератаки, пандемии, экономические), охват платёжных
  обязательств, право на расторжение при длительном форс-мажоре,
  баланс прав между сторонами и механизм уведомления.

  Формирует краткий user-facing вывод и оценивает риск использования
  FM-оговорки как инструмента уклонения от обязательств.

doc_types: []

severity: "medium"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"
ui_mode: "field_extraction"

rules:
  keyword_mode: any

  keywords:
    high:
      # Прямые форс-мажорные термины
      - "(?i)force\\s+majeure"
      - "(?i)форс[-\\s]?мажор"
      - "(?i)обстоятельств[аы]\\s+непреодолимой\\s+силы"
      - "(?i)act[s]?\\s+of\\s+God"

      # Экономические основания
      - "(?i)economic\\s+(hardship|infeasibility|impossibility)"
      - "(?i)экономическ[а-яая]+\\s+(нецелесообразност|невозможност)"
      - "(?i)market\\s+(disruption|change|collapse)"
      - "(?i)ухудшени[ея]\\s+финансов[а-яого]+\\s+положени[яи]"

      # Платёжные обязательства в FM
      - "(?i)force\\s+majeure\\s+[\\s\\S]{0,40}payment"
      - "(?i)payment\\s+[\\s\\S]{0,40}force\\s+majeure"
      - "(?i)форс[-\\s]?мажор[\\s\\S]{0,40}(платёж|оплат)"
      - "(?i)shall\\s+not\\s+excuse\\s+[\\s\\S]{0,20}payment"
      - "(?i)не\\s+освобожда[ею]т\\s+от\\s+[\\s\\S]{0,20}(платёж|оплат)"

      # Расторжение при длительном FM
      - "(?i)terminat[\\s\\S]{0,30}force\\s+majeure\\s+[\\s\\S]{0,30}(exceed|continu|last)"
      - "(?i)расторж[\\s\\S]{0,30}форс[-\\s]?мажор[\\s\\S]{0,30}(свыше|более|превыш)"
      - "(?i)if\\s+force\\s+majeure\\s+(continues?|persists?)\\s+for\\s+more\\s+than"
      - "(?i)если\\s+форс[-\\s]?мажор\\s+(продолжается|длится)\\s+(более|свыше)"

    medium:
      # Классические FM-события
      - "(?i)\\bwar\\b"
      - "(?i)\\bвойн[аыу]\\b"
      - "(?i)military\\s+(action|operation|conflict)"
      - "(?i)natural\\s+disaster"
      - "(?i)стихийн[а-яое]+\\s+бедстви"

      # Пандемии/эпидемии
      - "(?i)\\bpandemic\\b"
      - "(?i)\\bпандеми\\b"
      - "(?i)\\bepidemic\\b"
      - "(?i)quarantine"
      - "(?i)карантин"

      # Санкции в FM
      - "(?i)sanctions?[\\s\\S]{0,30}force\\s+majeure"
      - "(?i)force\\s+majeure[\\s\\S]{0,30}sanctions?"
      - "(?i)эмбарго[\\s\\S]{0,20}форс[-\\s]?мажор"

      # Государственные действия
      - "(?i)government(al)?\\s+(action|measure|order|restriction)"
      - "(?i)regulatory\\s+(action|measure|order|restriction)"
      - "(?i)действи[яи]\\s+(государственн|регуляторн)"

      # Кибератаки
      - "(?i)cyber[-\\s]?(attack|incident|event)"
      - "(?i)кибератак"
      - "(?i)ransomware"

      # Уведомление о FM
      - "(?i)notif(y|ication)\\s+[\\s\\S]{0,30}force\\s+majeure"
      - "(?i)уведоми[тьла]?\\s+[\\s\\S]{0,30}форс[-\\s]?мажор"
      - "(?i)within\\s+\\d+\\s+(days?|business\\s+days?)[\\s\\S]{0,30}force\\s+majeure"

    low:
      - "(?i)force\\s+majeure"
      - "(?i)форс[-\\s]?мажор"
      - "(?i)обстоятельства\\s+непреодолимой\\s+силы"
      - "(?i)economic\\s+hardship"
      - "(?i)экономическая\\s+нецелесообразность"
      - "(?i)act[s]?\\s+of\\s+God"
      - "(?i)cyber[-\\s]?attack"
      - "(?i)pandemic"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 640

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  context_k: 5
  max_chunks: 10
  boost_keywords:
    - "force majeure"
    - "форс-мажор"
    - "обстоятельства непреодолимой силы"
    - "act of God"
    - "pandemic"
    - "пандемия"
    - "cyber attack"
    - "кибератака"
    - "war"
    - "война"
    - "natural disaster"
    - "стихийное бедствие"
    - "economic hardship"
    - "payment obligations"
    - "платёжные обязательства"
    - "shall not excuse payment"
    - "не освобождает от оплаты"
    - "termination force majeure"
    - "расторжение форс-мажор"
    - "notification force majeure"
    - "sanctions"
    - "embargo"
    - "governmental action"
    - "regulatory action"
  rerank: true
  filters: {}

conditional: null

enrichment_hints:
  preferred_segment_types:
    - "contract"
    - "amendment"
    - "annex"
  excluded_segment_types:
    - "technical_specification"
    - "price_list"
    - "invoice"
    - "act"
    - "schedule"
  preferred_clause_functions:
    - "force_majeure"
    - "termination"
    - "general_provisions"
  confidence_bonus_on_match: 0.10
  confidence_penalty_on_excluded_segment: 0.15

extraction:
  enabled: true
  mode: "hybrid"
  llm_max_tokens: 440
  llm_prompt_extraction: |
    <role>
    Ты — юрист по контрактам и управлению рисками.
    Твоя задача — точно извлечь из текста:
    1) перечень FM-событий (классические / современные);
    2) включены ли экономические основания;
    3) охватывает ли FM платёжные обязательства;
    4) есть ли право расторжения при длительном FM;
    5) в чью пользу работает FM-оговорка.
    </role>

    <context>
    Ниже приведены релевантные фрагменты договора:

    {context}
    </context>

    <task>
    Заполни только следующие поля:
    - force_majeure_display
    - has_force_majeure_clause
    - covers_classic_events
    - covers_modern_risks
    - modern_risks_detail
    - includes_economic_grounds
    - covers_payments
    - has_termination_right
    - termination_threshold
    - fm_beneficiary
    - red_flags
    - reason

    Важно:
    - не придумывай FM-события если их нет в тексте;
    - пиши user-facing значения коротко и по-русски.
    </task>

    <instructions>
    Шаг 1 — НАЛИЧИЕ FM-ОГОВОРКИ

    Заполни поле "has_force_majeure_clause".

    Значения:
    - "yes" — FM-оговорка есть.
    - "no" — нет.
    - "unclear" — неясно.

    Шаг 2 — КЛАССИЧЕСКИЕ FM-СОБЫТИЯ

    Заполни поле "covers_classic_events".

    Значения:
    - "yes" — стихийные бедствия, война, забастовки,
      государственные акты.
    - "no" — нет.
    - "unclear" — неясно.

    Шаг 3 — СОВРЕМЕННЫЕ РИСКИ

    Заполни поля "covers_modern_risks"
    и "modern_risks_detail".

    Значения для covers_modern_risks:
    - "yes" — покрыты современные риски.
    - "no" — не включены.
    - "unclear" — неясно.

    Для modern_risks_detail перечисли через ";":
    - "пандемии; санкции; кибератаки"
    - "пандемии; государственные ограничения"
    - Если нет: "Не применимо"

    Шаг 4 — ЭКОНОМИЧЕСКИЕ ОСНОВАНИЯ

    Заполни поле "includes_economic_grounds".

    Значения:
    - "yes" — включены: economic hardship, market disruption,
      ухудшение финансового положения, изменение рыночных цен.
    - "no" — нет.
    - "unclear" — неясно.

    Шаг 5 — ПЛАТЁЖНЫЕ ОБЯЗАТЕЛЬСТВА

    Заполни поле "covers_payments".

    Значения:
    - "yes" — FM освобождает от платёжных обязательств.
    - "no" — прямо указано: платежи не освобождаются.
    - "unclear" — не раскрыто.

    Шаг 6 — ПРАВО НА РАСТОРЖЕНИЕ

    Заполни поля "has_termination_right"
    и "termination_threshold".

    Значения для has_termination_right:
    - "yes" — право расторгнуть при FM свыше X периода.
    - "no" — нет.
    - "unclear" — неясно.

    Для termination_threshold:
    - Если есть: "90 дней", "6 месяцев", "180 days"
    - Если нет: "Не определён"
    - Если нет права: "Не применимо"

    Шаг 7 — В ЧЬЮ ПОЛЬЗУ FM

    Заполни поле "fm_beneficiary".

    Значения:
    - "mutual" — FM работает симметрично для обеих сторон.
    - "counterparty" — преимущественно защищает контрагента.
    - "target" — преимущественно защищает Target.
    - "unclear" — неясно.

    Шаг 8 — RED FLAGS

    Заполни поле "red_flags".

    Используй:
    - "NONE" — FM классический, сбалансированный, не охватывает
      платежи, без экономических оснований.
    - "UNCLEAR" — данных недостаточно.
    - Коды через запятую:
      * FM1 — FM включает экономическую нецелесообразность
        или общие рыночные изменения — позволяет уклоняться
        от обязательств при неблагоприятной конъюнктуре.
      * FM2 — FM распространяется на платёжные обязательства
        без ограничений.
      * FM3 — FM широкий с асимметричным правом расторжения
        у контрагента (включает economic grounds + короткий
        termination threshold + fm_beneficiary = "counterparty").

    Шаг 9 — USER-FACING SUMMARY

    Заполни поле "force_majeure_display".

    Примеры:
    - "FM есть; классические события + пандемии + санкции;
       не освобождает от платежей; расторжение > 90 дней"
    - "FM есть; включает economic hardship; освобождает
       от платежей; право расторжения у контрагента"
    - "FM-оговорка не обнаружена"
    - "Не удалось определить наличие FM"

    Правила:
    - Отрази максимум 3–4 ключевых факта через ";".
    - Если нет FM: "FM-оговорка не обнаружена"
    - Если всё unclear: "Не удалось определить наличие FM"

    Шаг 10 — ОБОСНОВАНИЕ

    Заполни поле "reason".

    Правила:
    - 1–2 коротких предложения.
    - Укажи: перечень событий, экономические основания,
      платежи, расторжение, бенефициар, почему red_flags.
    - Приведи короткую цитату в кавычках.
    - Если NONE — почему FM сбалансированный.
    </instructions>

    <edge_cases>
    - FM включает economic hardship + освобождает платежи:
      * includes_economic_grounds = "yes"
      * covers_payments = "yes"
      * red_flags = "FM1, FM2"

    - FM классический, не освобождает от платежей,
      симметричный:
      * red_flags = "NONE"

    - FM прямо исключает платёжные обязательства:
      * covers_payments = "no"
      * это снижает риск

    - Catch-all "any event beyond reasonable control"
      без перечня:
      * covers_classic_events = "unclear"
      * в reason: широкая формулировка

    - Нет FM-оговорки:
      * has_force_majeure_clause = "no"
      * red_flags = "NONE"
      * force_majeure_display = "FM-оговорка не обнаружена"

    - Нет релевантных фрагментов:
      * has_force_majeure_clause = "unclear"
      * red_flags = "UNCLEAR"
      * force_majeure_display = "Не удалось определить наличие FM"
    </edge_cases>

    <output_expectations>
    Все значения должны быть короткими, точными и пригодными
    для отображения пользователю в DD Grid.
    Не добавляй никаких полей, кроме указанных в схеме extraction.
    </output_expectations>

  fields:
    - name: "force_majeure_display"
      type: "string"
      description: "Форс-мажор: краткий вывод"

    - name: "has_force_majeure_clause"
      type: "string"
      description: "Наличие FM-оговорки"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "covers_classic_events"
      type: "string"
      description: "Классические FM-события"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "covers_modern_risks"
      type: "string"
      description: "Современные риски (пандемии, санкции, кибер)"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "modern_risks_detail"
      type: "string"
      description: "Перечень современных рисков в FM"

    - name: "includes_economic_grounds"
      type: "string"
      description: "Экономические основания в FM"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "covers_payments"
      type: "string"
      description: "FM охватывает платёжные обязательства"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "has_termination_right"
      type: "string"
      description: "Право расторжения при длительном FM"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "termination_threshold"
      type: "string"
      description: "Порог срока для расторжения при FM"

    - name: "fm_beneficiary"
      type: "string"
      description: "В чью пользу работает FM"
      allowed_values:
        - "mutual"
        - "counterparty"
        - "target"
        - "unclear"

    - name: "red_flags"
      type: "string"
      description: "Коды рисков"

    - name: "reason"
      type: "string"
      description: "Обоснование"

  store_payload: true

  