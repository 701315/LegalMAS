id: "payment_terms_and_structures"
name: "Платежные условия и схемы"
description: >
  Анализирует основные платежные условия и схемы расчётов: валюту
  платежа и курсовые риски, структуру и сроки оплаты (авансы,
  постоплата, milestone), проценты и штрафы за просрочку,
  предоплаты / аккредитивы / escrow, set-off / netting rights,
  индексацию цен.

  Формирует краткий user-facing вывод и оценивает риск для
  ликвидности и денежных потоков Target.

  Take-or-pay схемы и долгосрочные минимальные объёмы детально
  анализируются чеком sticky_long_term_obligations.
  Финансовые ковенанты анализируются чеком financial_covenants.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"
ui_mode: "field_extraction"

rules:
  keyword_mode: any

  keywords:
    high:
      # Валюта
      - "(?i)currency\\s+of\\s+payment"
      - "(?i)валюта\\s+платежа"
      - "(?i)payment\\s+in\\s+(USD|EUR|GBP|CHF|CNY)"
      - "(?i)платёж[ьи]?\\s+в\\s+(доллар|евро|фунт|юан)"
      - "(?i)exchange\\s+rate"
      - "(?i)курс\\s+(пересчёта|обмена|валют)"

      # Проценты за просрочку
      - "(?i)late\\s+payment\\s+interest"
      - "(?i)penalty\\s+interest"
      - "(?i)default\\s+interest"
      - "(?i)проценты\\s+за\\s+просрочку"
      - "(?i)неустойк[аи]\\s+за\\s+просрочку"
      - "(?i)пен[ия]\\s+за\\s+несвоевременн"

      # Предоплата
      - "(?i)advance\\s+payment"
      - "(?i)предоплат[аы]"
      - "(?i)авансов[а-я]+\\s+платёж"
      - "(?i)prepayment"
      - "(?i)предварительн[а-я]+\\s+оплат"

      # Аккредитив / escrow
      - "(?i)letter\\s+of\\s+credit"
      - "(?i)\\bL/?C\\b"
      - "(?i)аккредитив"
      - "(?i)\\bescrow\\b"
      - "(?i)эскроу"
      - "(?i)escrow\\s+account"
      - "(?i)счёт\\s+эскроу"

    medium:
      # Сроки оплаты
      - "(?i)payment\\s+terms?"
      - "(?i)условия\\s+оплаты"
      - "(?i)порядок\\s+расчётов"
      - "(?i)payment\\s+due\\s+(within|in)\\s+\\d+"
      - "(?i)срок\\s+оплаты"
      - "(?i)within\\s+\\d+\\s+(business\\s+|calendar\\s+)?days?\\s+(of|from|after)[\\s\\S]{0,20}(invoice|payment|delivery)"
      - "(?i)в\\s+течение\\s+\\d+\\s+(рабочих\\s+|календарных\\s+)?дней[\\s\\S]{0,20}(счёт|оплат)"
      - "(?i)net\\s+\\d+\\s+days?"
      - "(?i)milestone\\s+payment"

      # Set-off / netting
      - "(?i)set[-\\s]?off"
      - "(?i)зачёт[аеу]?[\\s\\S]{0,20}(платёж|требовани|обязательств)"
      - "(?i)netting"
      - "(?i)взаимозачёт"
      - "(?i)right\\s+to\\s+(set[-\\s]?off|deduct|withhold)[\\s\\S]{0,20}payment"
      - "(?i)право\\s+на\\s+(зачёт|удержани[ея])[\\s\\S]{0,20}платёж"

      # Возврат предоплаты
      - "(?i)refund\\s+of\\s+(the\\s+)?(advance|prepayment)"
      - "(?i)возврат\\s+(аванса|предоплаты)"
      - "(?i)advance\\s+payment\\s+(guarantee|bond)"
      - "(?i)гаранти[яи]\\s+возврата\\s+аванса"

      # Индексация
      - "(?i)price\\s+(escalation|adjustment|indexation|revision)"
      - "(?i)индексаци[яи]\\s+цен"
      - "(?i)CPI\\s+adjustment"
      - "(?i)корректировк[аи]\\s+на\\s+инфляцию"

    low:
      - "(?i)advance\\s+payment"
      - "(?i)предоплат"
      - "(?i)letter\\s+of\\s+credit"
      - "(?i)аккредитив"
      - "(?i)escrow"
      - "(?i)set[-\\s]?off"
      - "(?i)зачёт"
      - "(?i)penalty\\s+interest"
      - "(?i)проценты\\s+за\\s+просрочку"
      - "(?i)exchange\\s+rate"
      - "(?i)курс\\s+валют"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 700

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  context_k: 5
  max_chunks: 10
  boost_keywords:
    - "payment terms"
    - "условия оплаты"
    - "порядок расчётов"
    - "currency of payment"
    - "валюта платежа"
    - "late payment interest"
    - "проценты за просрочку"
    - "penalty interest"
    - "неустойка за просрочку"
    - "advance payment"
    - "предоплата"
    - "letter of credit"
    - "аккредитив"
    - "escrow"
    - "эскроу"
    - "set-off"
    - "зачёт"
    - "refund of advance"
    - "возврат аванса"
    - "price escalation"
    - "индексация цен"
    - "milestone payment"
  rerank: true
  filters: {}

conditional: null

enrichment_hints:
  preferred_segment_types:
    - "contract"
    - "amendment"
    - "annex"
    - "schedule"
  excluded_segment_types:
    - "technical_specification"
    - "invoice"
    - "act"
  preferred_clause_functions:
    - "payment_terms"
    - "penalties"
  confidence_bonus_on_match: 0.10
  confidence_penalty_on_excluded_segment: 0.15

extraction:
  enabled: true
  mode: "hybrid"
  llm_max_tokens: 480
  llm_prompt_extraction: |
    <role>
    Ты — юрист по коммерческим и финансовым договорам.
    Твоя задача — точно извлечь из текста платежные условия:
    валюту и курсовые риски, структуру платежей, штрафы за
    просрочку, предоплаты / аккредитивы / escrow, set-off rights,
    индексацию цен.

    Не анализируй take-or-pay и минимальные объёмы детально —
    это задача чека sticky_long_term_obligations.
    Не анализируй финансовые ковенанты — это задача чека
    financial_covenants.
    </role>

    <context>
    Ниже приведены релевантные фрагменты договора:

    {context}
    </context>

    <task>
    Заполни только следующие поля:
    - payment_display
    - payment_currency
    - payment_schedule_type
    - has_late_payment_penalties
    - has_advance_lc_escrow
    - has_minimum_volume_commitment
    - set_off_rights
    - has_price_indexation
    - red_flags
    - reason

    Важно:
    - не анализируй детально take-or-pay и минимальные объёмы —
      только фиксируй их наличие как routing-сигнал;
    - не анализируй финансовые ковенанты;
    - пиши user-facing значения коротко и по-русски.
    </task>

    <instructions>
    Шаг 1 — ВАЛЮТА ПЛАТЕЖА

    Заполни поле "payment_currency".

    Правила:
    - Укажи конкретную валюту: "RUB", "USD", "EUR",
      "multiple: USD + EUR", "not_specified".
    - Если валюта иностранная и нет хеджирования / фиксации
      курса — отметь это в reason.

    Шаг 2 — СТРУКТУРА ПЛАТЕЖЕЙ

    Заполни поле "payment_schedule_type".

    Значения:
    - "advance_only" — только предоплата.
    - "postpayment" — только постоплата (Net 30, Net 60 и т.п.).
    - "milestone" — milestone-платежи.
    - "mixed" — аванс + постоплата или другая комбинация.
    - "periodic" — периодические (ежемесячные, квартальные).
    - "not_specified" — структура не определена.
    - "unclear" — нельзя определить.

    Шаг 3 — ПРОЦЕНТЫ И ШТРАФЫ ЗА ПРОСРОЧКУ

    Заполни поле "has_late_payment_penalties".

    Значения:
    - "yes_market_rate" — есть, ставка рыночная.
    - "yes_excessive" — есть, ставка чрезмерно высокая
      (> 0.1% в день или > 36% годовых).
    - "yes_unspecified_rate" — есть, ставка не указана.
    - "no" — нет.
    - "unclear" — неясно.

    Шаг 4 — ПРЕДОПЛАТЫ, АККРЕДИТИВЫ, ESCROW

    Заполни поле "has_advance_lc_escrow".

    Значения:
    - "yes" — есть авансы / L/C / escrow.
    - "no" — нет.
    - "unclear" — неясно.

    Если "yes" — в reason кратко опиши:
    - объём аванса (% или сумма если указана);
    - условия возврата (есть ли advance payment guarantee);
    - условия высвобождения escrow.

    Шаг 5 — МИНИМАЛЬНЫЕ ОБЪЁМЫ / TAKE-OR-PAY

    Заполни поле "has_minimum_volume_commitment".

    Это routing-поле. Детальный анализ — в чеке
    sticky_long_term_obligations.

    Значения:
    - "yes" — есть минимальные объёмы / take-or-pay.
    - "no" — нет.
    - "unclear" — неясно.

    Шаг 6 — SET-OFF / NETTING RIGHTS

    Заполни поле "set_off_rights".

    Значения:
    - "counterparty_unilateral" — контрагент может
      зачитывать суммы без согласия Target.
    - "mutual" — взаимный зачёт.
    - "prohibited" — зачёт запрещён.
    - "not_addressed" — не урегулировано.
    - "unclear" — неясно.

    Шаг 7 — ИНДЕКСАЦИЯ ЦЕН

    Заполни поле "has_price_indexation".

    Значения:
    - "yes_uncapped" — индексация без cap.
    - "yes_capped" — индексация с cap.
    - "no" — нет.
    - "unclear" — неясно.

    Шаг 8 — RED FLAGS

    Заполни поле "red_flags".

    Используй:
    - "NONE" — если существенных риск-факторов нет.
    - "UNCLEAR" — если данных недостаточно.
    - Коды через запятую:
      * PAY1 — крупная предоплата (> 30%) с жёсткими
        условиями возврата или без гарантии возврата.
      * PAY2 — минимальные объёмы / take-or-pay
        (routing: детальный анализ в sticky_long_term).
      * PAY3 — иностранная валюта без хеджирования.
      * PAY4 — чрезмерно высокие штрафные проценты.
      * PAY5 — длительная блокировка escrow (> 12 мес.)
        без чётких условий высвобождения.
      * PAY6 — односторонний set-off контрагента
        без согласия Target.

    Шаг 9 — USER-FACING SUMMARY

    Заполни поле "payment_display".

    Строй display как краткий factual вывод:

    Примеры:
    - "RUB; постоплата Net 30; штрафные проценты рыночные"
    - "USD; 30% аванс + milestone; штрафные проценты не указаны;
       есть escrow"
    - "EUR без хеджирования; предоплата 50%; set-off контрагента"
    - "Не удалось определить платежные условия"

    Правила:
    - Отрази максимум 3–4 ключевых факта через ";".
    - Если все параметры unclear:
      "Не удалось определить платежные условия"

    Шаг 10 — ОБОСНОВАНИЕ

    Заполни поле "reason".

    Правила:
    - 1–2 коротких предложения.
    - Укажи: валюту, структуру платежей, ключевые риски
      (аванс, escrow, штрафы, set-off), почему выставлены
      red_flags.
    - Приведи короткую цитату в кавычках.
    - Если NONE — почему условия приемлемы.
    </instructions>

    <edge_cases>
    - Стандартная постоплата Net 30, рыночные проценты:
      * has_late_payment_penalties = "yes_market_rate"
      * red_flags = "NONE"

    - Аванс > 50% без advance payment guarantee:
      * has_advance_lc_escrow = "yes"
      * red_flags включает "PAY1"

    - USD для российской компании без хеджирования:
      * payment_currency = "USD"
      * red_flags включает "PAY3"

    - 0.5% в день штрафные проценты:
      * has_late_payment_penalties = "yes_excessive"
      * red_flags включает "PAY4"

    - Escrow 24 месяца без trigger events:
      * has_advance_lc_escrow = "yes"
      * red_flags включает "PAY5"

    - Контрагент может зачитывать суммы без согласия:
      * set_off_rights = "counterparty_unilateral"
      * red_flags включает "PAY6"

    - Нет релевантных фрагментов:
      * все поля = "unclear" или "not_specified"
      * red_flags = "UNCLEAR"
      * payment_display =
        "Не удалось определить платежные условия"
    </edge_cases>

    <output_expectations>
    Все значения должны быть короткими, точными и пригодными
    для отображения пользователю в DD Grid.
    Не добавляй никаких полей, кроме указанных в схеме extraction.
    </output_expectations>

  fields:
    - name: "payment_display"
      type: "string"
      description: "Платежные условия: краткий вывод"

    - name: "payment_currency"
      type: "string"
      description: "Валюта платежа"

    - name: "payment_schedule_type"
      type: "string"
      description: "Структура платежей"
      allowed_values:
        - "advance_only"
        - "postpayment"
        - "milestone"
        - "mixed"
        - "periodic"
        - "not_specified"
        - "unclear"

    - name: "has_late_payment_penalties"
      type: "string"
      description: "Штрафы за просрочку"
      allowed_values:
        - "yes_market_rate"
        - "yes_excessive"
        - "yes_unspecified_rate"
        - "no"
        - "unclear"

    - name: "has_advance_lc_escrow"
      type: "string"
      description: "Предоплата / аккредитив / escrow"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "has_minimum_volume_commitment"
      type: "string"
      description: "Минимальные объёмы / take-or-pay (routing)"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "set_off_rights"
      type: "string"
      description: "Set-off / зачёт"
      allowed_values:
        - "counterparty_unilateral"
        - "mutual"
        - "prohibited"
        - "not_addressed"
        - "unclear"

    - name: "has_price_indexation"
      type: "string"
      description: "Индексация цен"
      allowed_values:
        - "yes_uncapped"
        - "yes_capped"
        - "no"
        - "unclear"

    - name: "red_flags"
      type: "string"
      description: "Коды рисков"

    - name: "reason"
      type: "string"
      description: "Обоснование"

  store_payload: true


  
        