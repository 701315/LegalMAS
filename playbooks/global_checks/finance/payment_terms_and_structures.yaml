id: "payment_terms_and_structures"
name: "Платежные условия и схемы"
description: >
  Анализирует основные платежные условия: валюту, сроки, проценты за
  просрочку, предоплаты, аккредитивы, escrow, а также необычные схемы
  (take-or-pay, минимальные объемы).

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"

rules:
  keywords:
    - "порядок расчетов"
    - "условия оплаты"
    - "payment terms"
    - "срок оплаты"
    - "оплата производится"
    - "валюта платежа"
    - "currency of payment"
    - "проценты за просрочку"
    - "late payment interest"
    - "penalty interest"
    - "предоплата"
    - "advance payment"
    - "аккредитив"
    - "letter of credit"
    - "escrow"
    - "take-or-pay"
    - "минимальный объем"
    - "minimum volume"
    - "minimum commitment"
  keyword_mode: "any"
  regex_patterns: []
  clause_patterns: []

llm:
  prompt_template: |
    <role>
    Ты — юрист по коммерческим и финансовым договорам.
    Твоя специализация — платежные условия и структуры расчётов.
    </role>

    <context>
    Ниже приведены фрагменты договора с платежными условиями:

    {context}
    </context>

    <instructions>
    Проведи анализ по шагам. Каждый шаг логически связан с одним или
    несколькими полями итоговой оценки.

    Шаг 1 — ОСНОВНЫЕ ПЛАТЕЖНЫЕ УСЛОВИЯ
    (используется для заполнения поля "currency_and_payment_schedule"
     и "has_late_payment_interest_or_penalties"):
    - Определи ключевые элементы:
      * валюту платежа (одна или несколько, при наличии — правила пересчёта курса),
      * сроки оплаты (количество дней, аванс/после поставки, milestone-платежи),
      * наличие процентов или штрафов за просрочку (late payment interest, penalty interest).
    - Сформулируй краткое текстовое резюме структуры платежей
      для "currency_and_payment_schedule".
    - Отдельно оцени, предусмотрены ли проценты/штрафы за просрочку.

    Шаг 2 — ПРЕДОПЛАТЫ, АККРЕДИТИВЫ, ESCROW
    (используется для заполнения поля "uses_advance_or_lc_or_escrow"):
    - Проверь, используются ли:
      * значимые авансовые платежи,
      * расчёты через аккредитив (letter of credit),
      * escrow-счета или аналогичные механизмы блокировки средств.
    - Сделай вывод: да, нет или по фрагментам это неясно.

    Шаг 3 — НЕОБЫЧНЫЕ СХЕМЫ (TAKE-OR-PAY, МИНИМАЛЬНЫЕ ОБЪЁМЫ)
    (используется для заполнения поля "has_take_or_pay_or_minimum_volume"):
    - Определи, есть ли:
      * обязательство платить вне зависимости от фактического объёма (take-or-pay),
      * минимальные объёмы закупки/поставки,
      * долгосрочные минимальные обязательства по объёму или сумме.
    - Отрази наличие таких условий как отдельный фактор риска.

    Шаг 4 — ОБЩИЙ РИСК ДЛЯ ЛИКВИДНОСТИ TARGET
    (используется для формирования "overall_risk_level" и "reason"):
    - Оцени общий риск для ликвидности Target, учитывая:
      * жёсткость сроков оплаты и размер санкций за просрочку,
      * объём и структуру предоплат, использование аккредитивов и escrow,
      * наличие take-or-pay и минимальных объёмов.
    - Сформулируй итоговый уровень риска как low / medium / high.
    - В "reason" кратко обоснуй вывод, ссылаясь на ключевые формулировки
      (желательно с короткими цитатами в кавычках), и поясни, как условия
      влияют на денежные потоки и гибкость Target.
    </instructions>

    <edge_cases>
    Обрабатывай пограничные ситуации так:

    - Стандартная оплата после поставки (например, 30 дней) с типичными
      процентами за просрочку:
      укажи, что условия близки к рыночным, и оцени риск с учётом
      общей нагрузки по договору.

    - Крупные предоплаты, сложные аккредитивные схемы или длительная
      блокировка средств на escrow:
      учитывай это как фактор повышенного риска для ликвидности.

    - Явная take-or-pay схема или жёсткие минимальные объёмы:
      фиксируй их как отдельный источник риска, особенно при возможной
      волатильности спроса.

    - Пустые или явно нерелевантные фрагменты:
      укажи, что данных недостаточно для анализа платежных условий и схем,
      и объясни, как это влияет на неопределённость и оценку риска.
    </edge_cases>

    <output_expectations>
    На основе твоего анализа отдельный механизм извлечения сформирует
    структурированные поля по заранее заданной схеме. Твоя задача —
    давать чёткие юридические выводы и указывать конкретные формулировки
    из текста, на которых они основаны.
    </output_expectations>
  prompt_file: null
  context_k: 4
  temperature: 0.0
  max_tokens: 512

evidence:
  required: false
  min_snippet_length: 20
  max_snippet_length: 500

retrieval:
  context_k: 4
  max_chunks: 8
  boost_keywords:
    - "payment terms"
    - "срок оплаты"
    - "проценты за просрочку"
    - "take-or-pay"
    - "minimum volume"
  rerank: true
  filters: {}

conditional: null

extraction:
  enabled: true
  mode: "hybrid"
  fields:
    - name: "currency_and_payment_schedule"
      type: "string"

    - name: "has_late_payment_interest_or_penalties"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "uses_advance_or_lc_or_escrow"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "has_take_or_pay_or_minimum_volume"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "overall_risk_level"
      type: "string"
      allowed_values:
        - "low"
        - "medium"
        - "high"

    - name: "reason"
      type: "string"

  store_payload: true

red_flags:
  items:
    - code: "FIN1"
      description: "Крупные обязательства по предоплате/аккредитиву/escrow с жесткими условиями возврата."
    - code: "FIN2"
      description: "Необычные payment-схемы, создающие нагрузку на ликвидность Target."
