id: "payment_terms_and_structures"
name: "Платежные условия и схемы"
description: >
  Анализирует основные платежные условия: валюту, сроки, проценты за
  просрочку, предоплаты, аккредитивы, escrow, а также необычные схемы
  (take-or-pay, минимальные объемы).

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"

rules:
  keywords:
    - "порядок расчетов"
    - "условия оплаты"
    - "payment terms"
    - "срок оплаты"
    - "оплата производится"
    - "валюта платежа"
    - "currency of payment"
    - "проценты за просрочку"
    - "late payment interest"
    - "penalty interest"
    - "предоплата"
    - "advance payment"
    - "аккредитив"
    - "letter of credit"
    - "escrow"
    - "take-or-pay"
    - "минимальный объем"
    - "minimum volume"
    - "minimum commitment"
  keyword_mode: "any"
  regex_patterns: []
  clause_patterns: []

llm:
  prompt_template: |
    <role>
    Ты — юрист по коммерческим и финансовым договорам.
    Твоя специализация — платежные условия и структуры расчётов.
    </role>

    <context>
    Ниже приведены фрагменты договора с платежными условиями:

    {context}
    </context>

    <instructions>
    Определи:

    1) Основные платежные условия:
       - валюта платежа (одна или несколько, курс, если указан),
       - сроки оплаты (количество дней, аванс/после поставки, milestone-платежи),
       - наличие процентов/штрафов за просрочку (late payment interest, penalty).

       Сформулируй кратко в поле currency_and_payment_schedule.

    2) Используются ли предоплаты, аккредитивы, escrow-счета:
       - значимые авансовые платежи,
       - расчёты через letter of credit,
       - escrow-структуры.
       Отрази это в uses_advance_or_lc_or_escrow.

    3) Есть ли необычные схемы:
       - take-or-pay (обязанность платить независимо от фактического объёма),
       - минимальные объемы закупки/поставки,
       - долгосрочные минимальные обязательства по объёму/сумме.
       Отрази это в has_take_or_pay_or_minimum_volume.

    4) Оцени общий риск для ликвидности Target:
       - overall_risk_level: low / medium / high,
       исходя из:
       * жёсткости сроков оплаты и санкций за просрочку,
       * размера предоплат и блокировок средств,
       * наличия take-or-pay и минимальных объёмов.
    </instructions>

    <edge_cases>
    ВАЖНО — пограничные случаи:

    — Если оплата по факту поставки с разумным сроком (например, 30 дней)
      и стандартными процентами за просрочку:
      has_late_payment_interest_or_penalties = "yes",
      overall_risk_level чаще "low" или "medium" (обоснуй в reason).

    — Если предусмотрены крупные предоплаты, сложные аккредитивные схемы
      или длительная блокировка средств на escrow:
      uses_advance_or_lc_or_escrow = "yes",
      риск для ликвидности может быть "high".

    — Если есть явная take-or-pay схема или жёсткий минимум объёмов:
      has_take_or_pay_or_minimum_volume = "yes",
      это повышает риск, особенно при волатильном спросе.

    — Пустые или нерелевантные фрагменты:
      большинство полей = "unclear" или пустые строки,
      overall_risk_level = "medium",
      reason = "Недостаточно данных для анализа платежных условий и схем."
    </edge_cases>

    <examples>
    ПРИМЕР 1 — СТАНДАРТНЫЕ УСЛОВИЯ (LOW/MEDIUM):

    Фрагмент: "Оплата производится в течение 30 (тридцати) календарных дней
    с даты выставления счета в евро. При просрочке оплаты начисляются
    проценты в размере 0,1% за каждый день просрочки."

    {{
      "currency_and_payment_schedule": "Оплата в евро в течение 30 дней после выставления счета, стандартные проценты за просрочку 0,1% в день.",
      "has_late_payment_interest_or_penalties": "yes",
      "uses_advance_or_lc_or_escrow": "no",
      "has_take_or_pay_or_minimum_volume": "no",
      "overall_risk_level": "medium",
      "reason": "Стандартные сроки и проценты за просрочку; существенных необычных схем нет, риск для ликвидности умеренный."
    }}

    ПРИМЕР 2 — КРУПНЫЕ ПРЕДОПЛАТЫ/АККРЕДИтИВ (HIGH):

    Фрагмент: "Заказчик осуществляет предоплату в размере 50% цены договора
    в течение 5 дней после подписания. Оставшиеся 50% оплачиваются по безотзывному
    аккредитиву, открываемому в пользу Поставщика."

    {{
      "currency_and_payment_schedule": "50% предоплата, 50% через безотзывный аккредитив.",
      "has_late_payment_interest_or_penalties": "unclear",
      "uses_advance_or_lc_or_escrow": "yes",
      "has_take_or_pay_or_minimum_volume": "no",
      "overall_risk_level": "high",
      "reason": "Существенная предоплата и аккредитив создают значительную нагрузку на ликвидность Target и риск блокировки средств."
    }}

    ПРИМЕР 3 — TAKE-OR-PAY (HIGH):

    Фрагмент: "Покупатель обязан ежегодно оплачивать не менее 80% годового
    контрактного объема, независимо от фактически отобранного количества
    продукции (take-or-pay)."

    {{
      "currency_and_payment_schedule": "Оплата по контрактному объёму с обязательным минимумом 80% в год.",
      "has_late_payment_interest_or_penalties": "unclear",
      "uses_advance_or_lc_or_escrow": "unclear",
      "has_take_or_pay_or_minimum_volume": "yes",
      "overall_risk_level": "high",
      "reason": "Условие take-or-pay с высоким минимальным объёмом создаёт жёсткое обязательство по оплате вне зависимости от фактического спроса."
    }}
    </examples>

    <output_format>
    Твой ответ ДОЛЖЕН быть строго валидным JSON-объектом со следующими
    полями:

    {{
      "currency_and_payment_schedule": "string — краткое описание валюты, сроков и структуры платежей",
      "has_late_payment_interest_or_penalties": "one of: yes | no | unclear",
      "uses_advance_or_lc_or_escrow": "one of: yes | no | unclear",
      "has_take_or_pay_or_minimum_volume": "one of: yes | no | unclear",
      "overall_risk_level": "one of: low | medium | high",
      "reason": "string — краткое объяснение на русском с указанием ключевых формулировок и влияния на ликвидность"
    }}

    Все перечисленные поля ДОЛЖНЫ присутствовать в JSON, даже если их значение равно null.
    </output_format>

    <constraints>
    ЖЁСТКИЕ ПРАВИЛА:
    1. Выведи ТОЛЬКО один JSON-объект. Никакого текста до или после.
    2. Не пиши "Вот JSON", "Here is the JSON" и т.п.
    3. Не используй Markdown, бэктики ``` или любые обёртки.
    4. Все строки — в двойных кавычках.
    5. Значения перечислимых полей — СТРОГО из указанных вариантов.
    6. Ключи — точно как указано, без добавления новых.
    7. Поле "reason" ДОЛЖНО содержать конкретные факты и формулировки
       из фрагментов, а не общие фразы вроде "есть риски".
    8. Начни ответ сразу с символа {{
    9. Если по какому‑то полю нет достаточно информации в тексте —
       верни для него 'unclear' или null (для reason пустое значение
       недопустимо — нужно объяснение). НЕ придумывай значения, не интерполируй.
    </constraints>
  prompt_file: null
  context_k: 4
  temperature: 0.0
  max_tokens: 512

evidence:
  required: false
  min_snippet_length: 20
  max_snippet_length: 500

retrieval:
  context_k: 4
  max_chunks: 8
  boost_keywords:
    - "payment terms"
    - "срок оплаты"
    - "проценты за просрочку"
    - "take-or-pay"
    - "minimum volume"
  rerank: true
  filters: {}

conditional: null

extraction:
  enabled: true
  mode: "hybrid"
  fields:
    - name: "currency_and_payment_schedule"
      type: "string"
    - name: "has_late_payment_interest_or_penalties"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
    - name: "uses_advance_or_lc_or_escrow"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
    - name: "has_take_or_pay_or_minimum_volume"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
    - name: "overall_risk_level"
      type: "string"
      allowed_values:
        - "low"
        - "medium"
        - "high"
    - name: "reason"
      type: "string"
  store_payload: true

red_flags:
  items:
    - code: "FIN1"
      description: "Крупные обязательства по предоплате/аккредитиву/escrow с жесткими условиями возврата."
    - code: "FIN2"
      description: "Необычные payment-схемы, создающие нагрузку на ликвидность Target."
      