id: "payment_terms_and_structures"
name: "Платежные условия и схемы"
group: "Financial"
description: >
  Анализирует основные платежные условия и схемы расчётов: валюту
  платежа и курсовые риски, структуру и сроки оплаты (авансы,
  постоплата, milestone), проценты и штрафы за просрочку,
  предоплаты / аккредитивы / escrow, set-off / netting rights,
  индексацию цен.

  Формирует краткий user-facing вывод и оценивает риск для
  ликвидности и денежных потоков Target.

  Take-or-pay схемы и долгосрочные минимальные объёмы детально
  анализируются чеком sticky_long_term_obligations.
  Финансовые ковенанты анализируются чеком financial_covenants.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"
ui_mode: "field_extraction"

rules:
  keyword_mode: any

  keywords:
    high:
      # Валюта
      - "(?i)currency\\s+of\\s+payment"
      - "(?i)валюта\\s+платежа"
      - "(?i)payment\\s+in\\s+(USD|EUR|GBP|CHF|CNY)"
      - "(?i)платёж[ьи]?\\s+в\\s+(доллар|евро|фунт|юан)"
      - "(?i)exchange\\s+rate"
      - "(?i)курс\\s+(пересчёта|обмена|валют)"

      # Проценты за просрочку
      - "(?i)late\\s+payment\\s+interest"
      - "(?i)penalty\\s+interest"
      - "(?i)default\\s+interest"
      - "(?i)проценты\\s+за\\s+просрочку"
      - "(?i)неустойк[аи]\\s+за\\s+просрочку"
      - "(?i)пен[ия]\\s+за\\s+несвоевременн"

      # Предоплата
      - "(?i)advance\\s+payment"
      - "(?i)предоплат[аы]"
      - "(?i)авансов[а-я]+\\s+платёж"
      - "(?i)prepayment"
      - "(?i)предварительн[а-я]+\\s+оплат"

      # Аккредитив / escrow
      - "(?i)letter\\s+of\\s+credit"
      - "(?i)\\bL/?C\\b"
      - "(?i)аккредитив"
      - "(?i)\\bescrow\\b"
      - "(?i)эскроу"
      - "(?i)escrow\\s+account"
      - "(?i)счёт\\s+эскроу"

    medium:
      # Сроки оплаты
      - "(?i)payment\\s+terms?"
      - "(?i)условия\\s+оплаты"
      - "(?i)порядок\\s+расчётов"
      - "(?i)payment\\s+due\\s+(within|in)\\s+\\d+"
      - "(?i)срок\\s+оплаты"
      - "(?i)within\\s+\\d+\\s+(business\\s+|calendar\\s+)?days?\\s+(of|from|after)[\\s\\S]{0,20}(invoice|payment|delivery)"
      - "(?i)в\\s+течение\\s+\\d+\\s+(рабочих\\s+|календарных\\s+)?дней[\\s\\S]{0,20}(счёт|оплат)"
      - "(?i)net\\s+\\d+\\s+days?"
      - "(?i)milestone\\s+payment"

      # Set-off / netting
      - "(?i)set[-\\s]?off"
      - "(?i)зачёт[аеу]?[\\s\\S]{0,20}(платёж|требовани|обязательств)"
      - "(?i)netting"
      - "(?i)взаимозачёт"
      - "(?i)right\\s+to\\s+(set[-\\s]?off|deduct|withhold)[\\s\\S]{0,20}payment"
      - "(?i)право\\s+на\\s+(зачёт|удержани[ея])[\\s\\S]{0,20}платёж"

      # Возврат предоплаты
      - "(?i)refund\\s+of\\s+(the\\s+)?(advance|prepayment)"
      - "(?i)возврат\\s+(аванса|предоплаты)"
      - "(?i)advance\\s+payment\\s+(guarantee|bond)"
      - "(?i)гаранти[яи]\\s+возврата\\s+аванса"

      # Индексация
      - "(?i)price\\s+(escalation|adjustment|indexation|revision)"
      - "(?i)индексаци[яи]\\s+цен"
      - "(?i)CPI\\s+adjustment"
      - "(?i)корректировк[аи]\\s+на\\s+инфляцию"

    low:
      - "(?i)advance\\s+payment"
      - "(?i)предоплат"
      - "(?i)letter\\s+of\\s+credit"
      - "(?i)аккредитив"
      - "(?i)escrow"
      - "(?i)set[-\\s]?off"
      - "(?i)зачёт"
      - "(?i)penalty\\s+interest"
      - "(?i)проценты\\s+за\\s+просрочку"
      - "(?i)exchange\\s+rate"
      - "(?i)курс\\s+валют"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 700

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  retrieval_profile: "payment_terms_check"
  context_k: 6
  max_chunks: 12

  retrieval_query: >
    условия оплаты порядок расчетов валюта платежа аванс предоплата
    штрафы за просрочку неустойка аккредитив эскроу взаимозачет индексация цен

  boost_keywords:
    - "payment terms"
    - "условия оплаты"
    - "порядок расчётов"
    - "currency of payment"
    - "валюта платежа"
    - "late payment interest"
    - "проценты за просрочку"
    - "penalty interest"
    - "неустойка за просрочку"
    - "advance payment"
    - "предоплата"
    - "letter of credit"
    - "аккредитив"
    - "escrow"
    - "эскроу"
    - "set-off"
    - "зачёт"
    - "refund of advance"
    - "возврат аванса"
    - "price escalation"
    - "индексация цен"
    - "milestone payment"

  negative_keywords:
    - "financial covenant"
    - "финансовые ковенанты"
    - "take-or-pay"
    - "minimum volume"
    - "минимальный объем"
    - "означает"
    - "в целях настоящего"
    - "споры"
    - "подсудность"
    - "применимое право"

  preferred_unit_types:
    - "payment_term"
    - "obligation"
    - "liability_provision"
    - "general_provision"

  excluded_unit_types:
    - "definition"
    - "structural_anchor"
    - "technical_fragment"
    - "appendix_reference"

  preferred_clause_functions:
    - "obligations"
    - "rights"
    - "remedies"

  position_bias:
    preferred_range: [0.05, 0.60]
    boost: 0.20
    scope: "segment"

  rerank: true
  filters: {}

conditional: null

enrichment_hints:
  preferred_segment_types:
    - "contract"
    - "amendment"
    - "annex"
    - "schedule"
  excluded_segment_types:
    - "technical_specification"
    - "invoice"
    - "act"
  confidence_bonus_on_match: 0.10
  confidence_penalty_on_excluded_segment: 0.15

extraction:
  enabled: true
  mode: "hybrid"
  llm_max_tokens: 1300

  # Presence gate: payment_terms_status агрегирует наличие любого
  # платёжного условия. present -> pass, missing -> missing_required_clause.
  # Контракт: present + missing + unclear = allowed_values.
  presence_signal:
    field: "payment_terms_status"
    present_values: ["present"]
    missing_values: ["missing"]
    unclear_values: ["unclear"]

  llm_prompt_extraction: |
    <role>
    Ты — юрист по коммерческим договорам.
    Твоя задача — точно извлечь платежные условия из текста:
    валюту, структуру платежей, штрафы за просрочку, предоплаты /
    аккредитивы / escrow, set-off rights, индексацию цен.

    КРИТИЧЕСКИ ВАЖНО:
    - Извлекай ТОЛЬКО то, что прямо написано в тексте.
    - НЕ делай выводов "по умолчанию" из общих норм права.
    - НЕ додумывай валюту, ставки или сроки, которых нет в тексте.
    - Если тема платёжных условий в договоре вообще не раскрыта —
      для payment_terms_status ставь "missing",
      для payment_schedule_type — "not_specified",
      для has_* — "no", для set_off_rights — "not_addressed".
    - Если информация неоднозначна — используй "unclear".

    Не анализируй take-or-pay, минимальные объёмы и
    финансовые ковенанты.
    </role>

    <context_rules>
    - Некоторые фрагменты могут быть нерелевантны — игнорируй их.
    - Если среди фрагментов есть противоречия — укажи "unclear"
      и объясни в reason.
    - Не используй информацию из definitions, преамбулы или приложений,
      если они не содержат substantive условий по теме check.
    - Если ни один фрагмент не содержит информации по теме —
      payment_terms_status = "missing",
      остальные поля — согласно Шагу 0, location = null у всех полей.
      Не использовать "unclear" при полном отсутствии релевантных
      фрагментов.
    </context_rules>

    <context>
    Ниже приведены релевантные фрагменты договора:

    {context}
    </context>

    <task>
    Заполни только следующие поля:
    - payment_display
    - payment_terms_status
    - payment_currency
    - payment_schedule_type
    - has_late_payment_penalties
    - has_advance_lc_escrow
    - set_off_rights
    - has_price_indexation
    - reason

    Общие правила:
    - используй только то, что прямо следует из текста;
    - пиши коротко и по-русски.
    </task>

    <location_instructions>
    Для каждого поля по возможности укажи location в формате:
    {"clause_ref": "п. 3.2", "page": 5, "quote": "дословная фраза из договора"}

    Правила:
    - clause_ref — короткая ссылка на пункт / раздел / статью именно в том виде,
      как она написана в договоре;
    - page — целое число страницы;
    - quote — дословная фраза из текста договора (НЕ пересказ, НЕ парафраз),
      которая является источником значения поля. Копируй её посимвольно,
      сохраняя формулировку и порядок слов. Оптимальная длина: 30–300 символов.
      Примеры хорошего quote:
      * для payment_currency: "Все платежи по настоящему Договору осуществляются в российских рублях";
      * для payment_schedule_type (postpayment): "Оплата производится в течение 30 (тридцати) календарных дней с даты получения счёта";
      * для payment_schedule_type (advance_only): "Заказчик обязуется перечислить 100% стоимости до начала оказания услуг";
      * для has_late_payment_penalties (yes_market_rate): "За просрочку оплаты начисляется неустойка в размере 0,05% от просроченной суммы за каждый день просрочки";
      * для has_late_payment_penalties (yes_excessive): "За просрочку оплаты начисляется неустойка в размере 0,5% от просроченной суммы за каждый день просрочки";
      * для has_advance_lc_escrow (yes): "Стороны открывают безотзывный документарный аккредитив в пользу Поставщика";
      * для set_off_rights (counterparty_unilateral): "Заказчик вправе в одностороннем порядке зачесть суммы неустойки против подлежащей оплате стоимости услуг";
      * для has_price_indexation (yes_uncapped): "Стоимость услуг подлежит ежегодной индексации на уровень инфляции без ограничения";
      * для has_price_indexation (yes_capped): "Стоимость услуг подлежит ежегодной индексации на уровень инфляции, но не более 5% в год".
    - не выдумывай location или quote;
    - если точную ссылку или дословную фразу определить нельзя,
      верни location = null;
    - для payment_display, payment_terms_status и reason
      location всегда null (синтезированы);
    - для payment_currency и 5 signal-полей возвращай location с quote
      только когда значение подтверждается конкретным условием договора,
      включая прямое исключение / неприменение / запрет условия.
      Для "not_specified", "not_addressed", "unclear" — null.
      Для "no":
      * location = null, если условие просто не раскрыто;
      * location с дословной цитатой, если договор прямо устанавливает
        отсутствие, неприменение или запрет соответствующего условия;
    - если payment_terms_status = "missing" — для всех полей
      location = null.
    </location_instructions>

    <instructions>
    Шаг 0 — НАЛИЧИЕ ПЛАТЁЖНЫХ УСЛОВИЙ

    Заполни "payment_terms_status".

    Значения:
    - "present" — договор содержит хотя бы одно платёжное условие:
      валюту платежа, структуру платежей, штрафы за просрочку,
      предоплату / L/C / escrow, set-off, индексацию цен.
    - "missing" — ни одного платёжного условия не установлено.
    - "unclear" — нельзя определить.

    Правило агрегации:
    - Если payment_currency ≠ "не указана" и ≠ "не удалось определить" →
      payment_terms_status = "present".
    - Если любое из полей payment_schedule_type, has_late_payment_penalties,
      has_advance_lc_escrow, set_off_rights, has_price_indexation
      имеет значение, отличное от "not_specified" / "not_addressed" /
      "no" / "unclear" → payment_terms_status = "present".
    - Если payment_currency = "не указана" и все 5 signal-полей =
      "not_specified" / "not_addressed" / "no" → "missing".
    - Если все = "unclear" → "unclear".
    - Дополнительно: если has_late_payment_penalties, has_advance_lc_escrow
      или has_price_indexation = "no", но для этого поля заполнен
      location с прямой цитатой об отсутствии / неприменении / запрете
      условия, то payment_terms_status = "present".
      Если location = null, такое "no" не считается наличием регулирования.

    Если payment_terms_status = "missing":
    - payment_currency = "не указана"
    - payment_schedule_type = "not_specified"
    - has_late_payment_penalties = "no"
    - has_advance_lc_escrow = "no"
    - set_off_rights = "not_addressed"
    - has_price_indexation = "no"
    - payment_display = "Платёжные условия не установлены"
    - reason = "Платёжные условия не обнаружены в представленных фрагментах."
    - для всех полей location = null
    - не выполняй Шаги 1–6; переходи к Шагу 7.

    Если payment_terms_status = "unclear":
    - payment_currency = "не удалось определить"
    - payment_schedule_type = "unclear"
    - has_late_payment_penalties = "unclear"
    - has_advance_lc_escrow = "unclear"
    - set_off_rights = "unclear"
    - has_price_indexation = "unclear"
    - payment_display = "Не удалось определить платёжные условия"
    - reason = "Формулировки присутствуют, но вывод надёжно сделать нельзя."
    - для всех полей location = null

    Если payment_terms_status = "present" — переходи к Шагам 1–6.

    Шаг 1 — ВАЛЮТА ПЛАТЕЖА

    Заполни "payment_currency".

    Правила:
    - Конкретная валюта: "RUB", "USD", "EUR",
      "USD + EUR" (если несколько).
    - Если не указана: "не указана"
    - Если неясно: "не удалось определить"

    Шаг 2 — СТРУКТУРА ПЛАТЕЖЕЙ

    Заполни "payment_schedule_type".

    Значения (строго из списка):
    - "advance_only" — только предоплата.
    - "postpayment" — только постоплата.
    - "milestone" — milestone-платежи.
    - "mixed" — аванс + постоплата или другая комбинация.
    - "periodic" — периодические платежи.
    - "not_specified" — структура не определена.
    - "unclear" — нельзя определить.

    Шаг 3 — ШТРАФЫ ЗА ПРОСРОЧКУ

    Заполни "has_late_payment_penalties".

    Значения (строго из списка):
    - "yes_market_rate" — есть, ставка рыночная
      (≤ 0.1% в день или ≤ 36% годовых).
    - "yes_excessive" — есть, ставка чрезмерная
      (> 0.1% в день или > 36% годовых).
    - "yes_unspecified_rate" — есть, ставка не указана.
    - "no" — нет штрафов за просрочку.
    - "unclear" — неясно.

    Шаг 4 — ПРЕДОПЛАТЫ, АККРЕДИТИВЫ, ESCROW

    Заполни "has_advance_lc_escrow".

    Значения:
    - "yes" — есть авансы / L/C / escrow.
    - "no" — нет.
    - "unclear" — неясно.

    Если "yes" — в reason кратко опиши объём аванса
    или условия высвобождения escrow.

    Шаг 5 — SET-OFF / NETTING

    Заполни "set_off_rights".

    Значения (строго из списка):
    - "counterparty_unilateral" — контрагент может зачитывать
      суммы в одностороннем порядке без согласия стороны.
    - "mutual" — взаимный зачёт с согласия обеих сторон.
    - "prohibited" — зачёт прямо запрещён.
    - "not_addressed" — вопрос не урегулирован.
    - "unclear" — неясно.

    Шаг 6 — ИНДЕКСАЦИЯ ЦЕН

    Заполни "has_price_indexation".

    Значения (строго из списка):
    - "yes_uncapped" — индексация без cap.
    - "yes_capped" — индексация с cap.
    - "no" — нет.
    - "unclear" — неясно.

    Шаг 7 — НОРМАЛИЗОВАННЫЙ DISPLAY ДЛЯ DD GRID

    Заполни "payment_display".

    Это итоговое поле для таблицы. Строй его ТОЛЬКО на основе
    уже заполненных полей выше. Не добавляй информацию сверх них.

    Возможные состояния:
    1. Конкретные условия известны:
       "RUB; постоплата; штрафные проценты рыночные"
    2. Частичные данные:
       "USD; структура не определена; escrow"
    3. Условия не урегулированы:
       "Платёжные условия не установлены"
    4. Не удалось определить:
       "Не удалось определить платёжные условия"

    Правила построения (если payment_terms_status = "present"):
    - начни с payment_currency
    - добавь payment_schedule_type (кратко, на русском)
    - добавь has_late_payment_penalties (если значимо)
    - добавь has_advance_lc_escrow (если есть)
    - добавь set_off_rights (если counterparty_unilateral)
    Не более 4 фактов через ";".
    Не добавляй никаких данных, которых нет в полях выше
    (например, срок оплаты в днях, если он не отражён в полях).

    Шаг 8 — КРАТКОЕ ОБОСНОВАНИЕ

    Заполни "reason".

    Правила:
    - Первое предложение — краткий вывод по платёжным условиям.
    - Второе — короткая цитата из текста (до 100 символов).
    - Пиши по-русски.
    - Не оценивай риск.
    </instructions>

    <edge_cases>
    - Стандартная постоплата Net 30, рыночные проценты:
      * payment_terms_status = "present"
      * payment_schedule_type = "postpayment"
      * has_late_payment_penalties = "yes_market_rate"

    - USD, порядок пересчёта по курсу или хеджирования не указан:
      * payment_terms_status = "present"
      * payment_currency = "USD"
      * reason: "Валюта платежа USD; условия фиксации курса
        в предоставленных фрагментах не указаны."

    - 0.5% в день штрафные проценты:
      * payment_terms_status = "present"
      * has_late_payment_penalties = "yes_excessive"

    - Контрагент зачитывает суммы без согласия:
      * payment_terms_status = "present"
      * set_off_rights = "counterparty_unilateral"

    - Платёжные условия не установлены в договоре:
      * payment_terms_status = "missing"
      * payment_currency = "не указана"
      * payment_schedule_type = "not_specified"
      * payment_display = "Платёжные условия не установлены"

    - Нет релевантных фрагментов:
      * payment_terms_status = "missing"
      * payment_currency = "не указана"
      * payment_schedule_type = "not_specified"
      * has_late_payment_penalties = "no"
      * has_advance_lc_escrow = "no"
      * set_off_rights = "not_addressed"
      * has_price_indexation = "no"
      * payment_display = "Платёжные условия не установлены"
    </edge_cases>

    <output_expectations>
    - Верни результат строго в формате JSON.
    - Не оборачивай в markdown-блоки (без ```).
    - Не добавляй комментариев вне JSON.
    - Значения allowed_values полей — строго из списка (на английском).
    - Свободные текстовые поля (payment_display, payment_currency,
      reason) — на русском языке.
    - Не добавляй никаких полей, кроме указанных.
    - Для каждого поля возвращай объект с ключами
      "value", "confidence", "location".

    Пример структуры ответа:
    {
      "payment_display": {"value": "RUB; постоплата; штрафные проценты рыночные", "confidence": 0.95, "location": null},
      "payment_terms_status": {"value": "present", "confidence": 0.95, "location": null},
      "payment_currency": {"value": "RUB", "confidence": 0.95, "location": {"clause_ref": "п. 3.2", "page": 5, "quote": "Все платежи по настоящему Договору осуществляются в российских рублях"}},
      "payment_schedule_type": {"value": "postpayment", "confidence": 0.92, "location": {"clause_ref": "п. 3.3", "page": 5, "quote": "Оплата производится в течение 30 (тридцати) календарных дней с даты получения счёта"}},
      "has_late_payment_penalties": {"value": "yes_market_rate", "confidence": 0.92, "location": {"clause_ref": "п. 3.5", "page": 5, "quote": "За просрочку оплаты начисляется неустойка в размере 0,05% от просроченной суммы за каждый день просрочки"}},
      "has_advance_lc_escrow": {"value": "no", "confidence": 0.85, "location": null},
      "set_off_rights": {"value": "not_addressed", "confidence": 0.85, "location": null},
      "has_price_indexation": {"value": "no", "confidence": 0.85, "location": null},
      "reason": {"value": "Договор устанавливает оплату в рублях с постоплатой, штрафные проценты — рыночные. «Оплата производится в течение 30 (тридцати) календарных дней с даты получения счёта».", "confidence": 0.90, "location": null}
    }
    </output_expectations>

  fields:
    - name: "payment_display"
      type: "string"
      presentation: "fact"
      label: "Платежные условия"
      description: "Нормализованный user-facing вывод для DD Grid"
      display_in_grid: true
      display_priority: 1

    - name: "payment_terms_status"
      type: "string"
      presentation: "signal"
      risk_weight: "info"
      description: "Наличие платёжных условий в договоре"
      allowed_values:
        - "present"
        - "missing"
        - "unclear"
      display_in_grid: false

    - name: "payment_currency"
      type: "string"
      presentation: "fact"
      label: "Валюта платежа"
      description: "Валюта платежа"
      display_in_grid: true
      display_priority: 2

    - name: "payment_schedule_type"
      type: "string"
      presentation: "signal"
      risk_weight: "high"
      description: "Структура платежей"
      allowed_values:
        - "advance_only"
        - "postpayment"
        - "milestone"
        - "mixed"
        - "periodic"
        - "not_specified"
        - "unclear"
      display_in_grid: false

    - name: "has_late_payment_penalties"
      type: "string"
      presentation: "signal"
      risk_weight: "high"
      description: "Штрафы за просрочку"
      allowed_values:
        - "yes_market_rate"
        - "yes_excessive"
        - "yes_unspecified_rate"
        - "no"
        - "unclear"
      display_in_grid: false

    - name: "has_advance_lc_escrow"
      type: "string"
      presentation: "signal"
      risk_weight: "medium"
      description: "Предоплата / аккредитив / escrow"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
      display_in_grid: false

    - name: "set_off_rights"
      type: "string"
      presentation: "signal"
      risk_weight: "high"
      description: "Set-off / зачёт"
      allowed_values:
        - "counterparty_unilateral"
        - "mutual"
        - "prohibited"
        - "not_addressed"
        - "unclear"
      display_in_grid: false

    - name: "has_price_indexation"
      type: "string"
      presentation: "signal"
      risk_weight: "medium"
      description: "Индексация цен"
      allowed_values:
        - "yes_uncapped"
        - "yes_capped"
        - "no"
        - "unclear"
      display_in_grid: false

    - name: "reason"
      type: "string"
      presentation: "diagnostic"
      description: "Обоснование"
      display_in_grid: false

  store_payload: true


  