id: "payment_terms_and_structures"
name: "Платежные условия и схемы"
description: >
  Анализирует основные платежные условия и схемы расчётов: валюту
  платежа и курсовые риски, сроки оплаты (авансы, постоплата,
  milestone), проценты и штрафы за просрочку, предоплаты, аккредитивы,
  escrow, необычные схемы (take-or-pay, минимальные объёмы),
  set-off / netting rights. Оценивает риск для ликвидности
  и денежных потоков Target.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"

rules:
  keyword_mode: any

  keywords:
    high:
      # Платежные условия — точные маркеры
      - "(?i)payment\\s+terms?"
      - "(?i)условия\\s+оплаты"
      - "(?i)порядок\\s+расчётов"
      - "(?i)оплата\\s+производится"

      # Валюта
      - "(?i)currency\\s+of\\s+payment"
      - "(?i)валюта\\s+платежа"
      - "(?i)payment\\s+in\\s+(USD|EUR|GBP|CHF|CNY)"
      - "(?i)платёж[ьи]?\\s+в\\s+(доллар|евро|фунт|юан)"
      - "(?i)exchange\\s+rate"
      - "(?i)курс\\s+(пересчёта|обмена|валют)"

      # Проценты за просрочку
      - "(?i)late\\s+payment\\s+interest"
      - "(?i)penalty\\s+interest"
      - "(?i)default\\s+interest"
      - "(?i)проценты\\s+за\\s+просрочку"
      - "(?i)неустойк[аи]\\s+за\\s+просрочку"
      - "(?i)пен[ия]\\s+за\\s+несвоевременн"

      # Предоплата
      - "(?i)advance\\s+payment"
      - "(?i)предоплат[аы]"
      - "(?i)авансов[а-я]+\\s+платёж"
      - "(?i)prepayment"
      - "(?i)предварительн[а-я]+\\s+оплат"

      # Аккредитив / escrow
      - "(?i)letter\\s+of\\s+credit"
      - "(?i)\\bL/?C\\b"
      - "(?i)аккредитив"
      - "(?i)\\bescrow\\b"
      - "(?i)эскроу"
      - "(?i)escrow\\s+account"
      - "(?i)счёт\\s+эскроу"

      # Take-or-pay / минимальные объёмы
      - "(?i)take[-\\s]?or[-\\s]?pay"
      - "(?i)minimum\\s+(volume|commitment|purchase|quantity)"
      - "(?i)минимальн[а-я]+\\s+(объём|обязательств|закупк|количеств)"
      - "(?i)guaranteed\\s+minimum"
      - "(?i)гарантированн[а-я]+\\s+минимум"

    medium:
      # Сроки оплаты
      - "(?i)payment\\s+due\\s+(within|in)\\s+\\d+"
      - "(?i)срок\\s+оплаты"
      - "(?i)within\\s+\\d+\\s+(business\\s+|calendar\\s+)?days?\\s+(of|from|after)"
      - "(?i)в\\s+течение\\s+\\d+\\s+(рабочих\\s+|календарных\\s+)?дней"
      - "(?i)net\\s+\\d+\\s+days?"
      - "(?i)milestone\\s+payment"

      # Set-off / netting
      - "(?i)set[-\\s]?off"
      - "(?i)зачёт"
      - "(?i)netting"
      - "(?i)взаимозачёт"
      - "(?i)right\\s+to\\s+(set[-\\s]?off|deduct|withhold)"
      - "(?i)право\\s+на\\s+(зачёт|удержани[ея])"

      # Возврат предоплаты
      - "(?i)refund\\s+of\\s+(the\\s+)?(advance|prepayment)"
      - "(?i)возврат\\s+(аванса|предоплаты)"
      - "(?i)advance\\s+payment\\s+(guarantee|bond)"
      - "(?i)гаранти[яи]\\s+возврата\\s+аванса"

      # Индексация / escalation
      - "(?i)price\\s+(escalation|adjustment|indexation|revision)"
      - "(?i)индексаци[яи]\\s+цен"
      - "(?i)пересмотр\\s+цен"
      - "(?i)CPI\\s+adjustment"
      - "(?i)корректировк[аи]\\s+на\\s+инфляцию"

      # Invoice / счёт
      - "(?i)invoice"
      - "(?i)счёт\\s+(на\\s+оплату|фактура)"
      - "(?i)billing"
      - "(?i)выставлени[ея]\\s+счёт"

    low:
      # Общие термины
      - "(?i)payment"
      - "(?i)оплат"
      - "(?i)платёж"
      - "(?i)расчёт"
      - "(?i)price"
      - "(?i)цен[аы]"
      - "(?i)fee"
      - "(?i)вознаграждени"
      - "(?i)interest"
      - "(?i)процент"
      - "(?i)penalty"
      - "(?i)штраф"
      - "(?i)неустойк"
      - "(?i)currency"
      - "(?i)валют"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 700

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  context_k: 5
  max_chunks: 10
  boost_keywords:
    - "payment terms"
    - "условия оплаты"
    - "порядок расчётов"
    - "currency of payment"
    - "валюта платежа"
    - "late payment interest"
    - "проценты за просрочку"
    - "penalty interest"
    - "неустойка за просрочку"
    - "advance payment"
    - "предоплата"
    - "letter of credit"
    - "аккредитив"
    - "escrow"
    - "эскроу"
    - "take-or-pay"
    - "minimum volume"
    - "минимальный объём"
    - "minimum commitment"
    - "set-off"
    - "зачёт"
    - "refund of advance"
    - "возврат аванса"
    - "price escalation"
    - "индексация цен"
    - "milestone payment"
  rerank: true
  filters: {}

conditional: null

extraction:
  llm_prompt_extraction: |
    <role>
    Ты — юрист по коммерческим и финансовым договорам.
    Твоя специализация — платежные условия и схемы расчётов,
    включая валютные риски, механизмы обеспечения платежей,
    take-or-pay обязательства и set-off rights.
    </role>

    <context>
    Ниже приведены фрагменты договора с платежными условиями:

    {context}
    </context>

    <instructions>
    Проведи анализ по шагам. Каждый шаг логически соответствует одному
    или нескольким полям итоговой оценки риска.

    Шаг 1 — ВАЛЮТА ПЛАТЕЖА
    (используется для заполнения поля "payment_currency"):
    - Определи валюту (валюты) платежа.
    - Если валюта иностранная для Target — проверь, есть ли:
      * фиксация курса (exchange rate fixing);
      * механизм хеджирования;
      * правила пересчёта.
    - Укажи конкретную валюту (например: "USD", "EUR", "RUB",
      "multiple: USD + EUR") или "not specified".

    Шаг 2 — СРОКИ И СТРУКТУРА ПЛАТЕЖЕЙ
    (используется для заполнения поля "payment_schedule_description"):
    - Опиши структуру платежей:
      * авансы (размер в % или абсолютном выражении);
      * постоплата (Net 30, Net 60 и т.п.);
      * milestone-платежи;
      * периодические платежи (ежемесячные, квартальные).
    - Укажи конкретные сроки (если доступны).

    Шаг 3 — ПРОЦЕНТЫ И ШТРАФЫ ЗА ПРОСРОЧКУ
    (используется для заполнения поля "has_late_payment_penalties"):
    - Определи, предусмотрены ли:
      * проценты за просрочку (late payment interest);
      * штрафные проценты (penalty interest, default interest);
      * неустойка за несвоевременную оплату.
    - Если да — укажи ставку (если указана) и базу начисления.
    - Оцени, являются ли ставки рыночными или чрезмерно
      высокими:
      * "yes_market_rate" — есть, в пределах рыночных;
      * "yes_excessive" — есть, чрезмерно высокие;
      * "yes_unspecified_rate" — есть, ставка не указана;
      * "no" — нет;
      * "unclear" — неясно.

    Шаг 4 — ПРЕДОПЛАТЫ, АККРЕДИТИВЫ, ESCROW
    (используется для заполнения поля "has_advance_lc_escrow"):
    - Определи, используются ли:
      * значимые авансовые платежи (> 20% стоимости);
      * аккредитивы (L/C);
      * escrow-счета.
    - Проверь:
      * условия возврата предоплаты (refund guarantee,
        advance payment bond);
      * условия высвобождения средств с escrow;
      * срок блокировки средств.
    - Оцени:
      * "yes" — используются;
      * "no" — нет;
      * "unclear" — неясно.

    Шаг 5 — TAKE-OR-PAY И МИНИМАЛЬНЫЕ ОБЪЁМЫ
    (используется для заполнения поля "has_take_or_pay_or_minimum_volume"):
    - Определи, есть ли:
      * take-or-pay обязательства (платить независимо
        от фактического потребления);
      * минимальные объёмы закупки / поставки;
      * guaranteed minimum commitments.
    - Оцени:
      * "yes" — есть;
      * "no" — нет;
      * "unclear" — неясно.

    Шаг 6 — SET-OFF / NETTING RIGHTS
    (используется для заполнения поля "set_off_rights"):
    - Определи, предусмотрены ли права на зачёт (set-off):
      * право контрагента удерживать / зачитывать суммы
        без согласия Target;
      * взаимный зачёт;
      * запрет зачёта.
    - Оцени:
      * "counterparty_unilateral" — контрагент может
        зачитывать односторонне;
      * "mutual" — взаимный зачёт;
      * "prohibited" — зачёт запрещён;
      * "not_addressed" — не урегулировано;
      * "unclear" — неясно.

    Шаг 7 — RED FLAGS
    (используется для заполнения поля "red_flags"):
    Присвой один или несколько кодов из списка ниже.
    Если ни один код не применим — верни "NONE".
    Если данных недостаточно для оценки — верни "UNCLEAR".

    Коды:
    • PAY1 — Крупная предоплата (> 30% стоимости) с жёсткими
      условиями возврата или без гарантии возврата.
    • PAY2 — Take-or-pay или минимальные объёмы, создающие
      безусловное платёжное обязательство независимо
      от потребления.
    • PAY3 — Валюта платежа иностранная для Target, без
      механизма хеджирования или фиксации курса.
    • PAY4 — Чрезмерно высокие штрафные проценты за просрочку
      (значительно выше рыночных).
    • PAY5 — Длительная блокировка средств на escrow
      (> 12 месяцев) без чётких условий высвобождения.
    • PAY6 — Право контрагента на односторонний set-off
      (зачёт) без согласия Target — риск одностороннего
      удержания платежей.

    Формат ответа: коды через запятую без комментариев
    (например: "PAY1, PAY3").
    Вся аргументация — в поле reason.

    Шаг 8 — ОБОСНОВАНИЕ
    (используется для заполнения поля "reason"):

    - В reason кратко обоснуй вывод, опираясь на ключевые
      формулировки из текста (с цитатами в кавычках), и укажи:
      * валюту и структуру платежей;
      * размер и условия предоплаты / escrow;
      * ставки штрафных процентов;
      * наличие take-or-pay и объёмы;
      * set-off rights;
      * если выставлены red_flags — обоснуй каждый код;
      * если red_flags = "NONE" — укажи, почему условия
        рыночные и приемлемые.
    </instructions>

    <edge_cases>
    Обрабатывай пограничные ситуации так:

    - Стандартная постоплата (Net 30) с типичными процентами
      за просрочку (ключевая ставка ЦБ + X%):
      has_late_payment_penalties = "yes_market_rate";
      red_flags = "NONE"; overall_risk_level = "low".

    - Крупная предоплата (> 50%) без advance payment guarantee:
      зафиксируй PAY1; в reason укажи объём и отсутствие
      гарантии возврата.

    - Take-or-pay с высокими минимальными объёмами при
      волатильном спросе:
      зафиксируй PAY2; в reason укажи, что безусловное
      обязательство создаёт риск при падении спроса.

    - Платёж в USD для российской компании без хеджирования:
      зафиксируй PAY3; в reason укажи валютный риск.

    - Штрафные проценты 0.5% в день (> 180% годовых):
      has_late_payment_penalties = "yes_excessive";
      зафиксируй PAY4.

    - Escrow на 24 месяца без чётких trigger events
      для высвобождения:
      зафиксируй PAY5; в reason укажи длительность
      и неопределённость условий.

    - Контрагент может зачитывать любые суммы без согласия:
      set_off_rights = "counterparty_unilateral";
      зафиксируй PAY6.

    - Пустые или явно нерелевантные фрагменты:
      red_flags = "UNCLEAR"; в reason укажи, что данных
      недостаточно для оценки платежных условий.
    </edge_cases>

    <output_expectations>
    На основе твоего анализа отдельный механизм извлечения сформирует
    структурированные поля по заранее заданной схеме. Твоя задача —
    давать чёткие юридические выводы и указывать конкретные
    формулировки из текста, на которых они основаны.
    </output_expectations>

  enabled: true
  mode: "hybrid"
  fields:
    - name: "payment_currency"
      type: "string"

    - name: "has_late_payment_penalties"
      type: "string"
      allowed_values:
        - "yes_market_rate"
        - "yes_excessive"
        - "yes_unspecified_rate"
        - "no"
        - "unclear"

    - name: "has_advance_lc_escrow"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "has_take_or_pay_or_minimum_volume"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "set_off_rights"
      type: "string"
      allowed_values:
        - "counterparty_unilateral"
        - "mutual"
        - "prohibited"
        - "not_addressed"
        - "unclear"

    - name: "red_flags"
      type: "string"

    - name: "reason"
      type: "string"

  store_payload: true

red_flags:
  items:
    - code: "PAY1"
      description: >
        Крупная предоплата (> 30% стоимости) с жёсткими
        условиями возврата или без гарантии возврата.
    - code: "PAY2"
      description: >
        Take-or-pay или минимальные объёмы, создающие
        безусловное платёжное обязательство независимо
        от потребления.
    - code: "PAY3"
      description: >
        Валюта платежа иностранная для Target, без
        механизма хеджирования или фиксации курса.
    - code: "PAY4"
      description: >
        Чрезмерно высокие штрафные проценты за просрочку
        (значительно выше рыночных).
    - code: "PAY5"
      description: >
        Длительная блокировка средств на escrow (> 12 месяцев)
        без чётких условий высвобождения.
    - code: "PAY6"
      description: >
        Право контрагента на односторонний set-off (зачёт)
        без согласия Target — риск одностороннего удержания
        платежей.
        