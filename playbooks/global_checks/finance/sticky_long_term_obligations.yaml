id: "sticky_long_term_obligations"
name: "Долгосрочные 'липкие' обязательства и минимальные уровни"
group: "Financial"
description: >
  Анализирует долгосрочные минимальные обязательства: take-or-pay
  схемы, минимальные объёмы закупки / поставки, фиксированные
  платежи. Оценивает срок действия, наличие автоматической
  пролонгации, индексацию, выживаемость при смене контроля,
  penalties за невыполнение, стоимость досрочного выхода
  (exit fee) и механизмы пересмотра условий.

  Формирует краткий user-facing вывод и определяет степень
  «липкости» обязательств для Target после M&A-сделки.

  Платежные условия (валюта, сроки, штрафы за просрочку,
  escrow) анализируются чеком payment_terms_and_structures.
  Финансовые ковенанты анализируются чеком financial_covenants.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"
ui_mode: "field_extraction"

rules:
  keyword_mode: any

  keywords:
    high:
      # Take-or-pay и минимальные объёмы
      - "(?i)take[-\\s]?or[-\\s]?pay"
      - "(?i)minimum\\s+(guaranteed\\s+)?(volume|quantity|purchase|supply)"
      - "(?i)минимальн[а-я]+\\s+(гарантированн[а-я]+\\s+)?(объём|количеств|закупк|поставк)"
      - "(?i)guaranteed\\s+minimum"
      - "(?i)гарантированн[а-я]+\\s+минимум"
      - "(?i)fixed\\s+minimum\\s+payment"
      - "(?i)фиксированн[а-я]+\\s+минимальн[а-я]+\\s+платёж"

      # Долгосрочные обязательства
      - "(?i)long[-\\s]?term\\s+(commitment|obligation|contract)"
      - "(?i)долгосрочн[а-я]+\\s+(обязательств|контракт|договор)"
      - "(?i)multi[-\\s]?year\\s+(agreement|commitment)"
      - "(?i)многолетн[а-я]+\\s+(соглашени|обязательств)"

      # Обязательство приобретать/поставлять
      - "(?i)obligation\\s+to\\s+(purchase|buy|supply|deliver)[\\s\\S]{0,20}minimum"
      - "(?i)shall\\s+(purchase|buy|supply)\\s+a\\s+minimum"
      - "(?i)обязан[аоы]?\\s+(закупать|приобретать|поставлять)\\s+не\\s+менее"

      # Выживаемость при CoC
      - "(?i)surviv(e|es|ing)\\s+(a\\s+)?(change\\s+of\\s+control|CoC)"
      - "(?i)переживает\\s+смену\\s+контрол"
      - "(?i)shall\\s+remain\\s+in\\s+(full\\s+)?force[\\s\\S]{0,30}(change|transfer|CoC)"
      - "(?i)независимо\\s+от\\s+смены\\s+(контрол|собственник|владел)"

    medium:
      # Shortfall / penalties
      - "(?i)shortfall\\s+payment"
      - "(?i)deficiency\\s+payment"
      - "(?i)платёж\\s+за\\s+недобор"
      - "(?i)penalty\\s+for\\s+(failure\\s+to\\s+)?(meet|achieve|fulfil)\\s+(the\\s+)?minimum"
      - "(?i)штраф\\s+за\\s+невыполнени[ея]\\s+минимальн"

      # Exit / termination fee
      - "(?i)exit\\s+fee"
      - "(?i)termination\\s+fee"
      - "(?i)early\\s+termination\\s+(fee|penalty|payment)"
      - "(?i)штраф\\s+за\\s+досрочн[а-я]+\\s+расторжени"
      - "(?i)плата\\s+за\\s+(выход|досрочн[а-я]+\\s+расторжени)"

      # Auto-renewal / пролонгация
      - "(?i)auto(matic)?[-\\s]?(renewal|extension)"
      - "(?i)автоматическ[а-я]+\\s+(пролонгаци|продлени)"
      - "(?i)shall\\s+(automatically\\s+)?renew"
      - "(?i)автоматически\\s+продлевается"
      - "(?i)evergreen"
      - "(?i)rolling\\s+(term|contract)"

      # Indexation / escalation
      - "(?i)price\\s+(escalation|indexation|adjustment)[\\s\\S]{0,20}(minimum|volume|commitment)"
      - "(?i)индексаци[яи]\\s+(цен|стоимост)[\\s\\S]{0,20}(минимальн|объём)"
      - "(?i)annual\\s+(price\\s+)?increase[\\s\\S]{0,20}(minimum|obligation)"
      - "(?i)CPI\\s+(adjustment|escalation)[\\s\\S]{0,20}(minimum|volume)"

      # Срок
      - "(?i)term\\s+of\\s+\\d+\\s+years?"
      - "(?i)срок\\s+(действия\\s+)?\\d+\\s+(лет|год)"
      - "(?i)initial\\s+term"
      - "(?i)первоначальн[а-я]+\\s+срок"

      # Механизм пересмотра
      - "(?i)meet[-\\s]?or[-\\s]?release"
      - "(?i)renegotiation\\s+clause"
      - "(?i)hardship\\s+clause"
      - "(?i)market\\s+reset"

    low:
      - "(?i)take[-\\s]?or[-\\s]?pay"
      - "(?i)minimum\\s+(volume|purchase|quantity)"
      - "(?i)минимальн[а-я]+\\s+(объём|закупк)"
      - "(?i)guaranteed\\s+minimum"
      - "(?i)auto[-\\s]?renewal"
      - "(?i)автоматическ[а-я]+\\s+пролонгаци"
      - "(?i)survive[\\s\\S]{0,20}(change|control)"
      - "(?i)exit\\s+fee"
      - "(?i)shortfall\\s+payment"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 700

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  retrieval_profile: "payment_terms_check"
  context_k: 6
  max_chunks: 12

  retrieval_query: >
    take-or-pay минимальные объемы закупки поставки
    гарантированный минимум долгосрочные обязательства
    штраф за недобор exit fee автоматическая пролонгация
    индексация цен survive change of control

  boost_keywords:
    - "take-or-pay"
    - "minimum volume"
    - "минимальный объем"
    - "guaranteed minimum"
    - "гарантированный минимум"
    - "long-term commitment"
    - "долгосрочные обязательства"
    - "shortfall payment"
    - "штраф за недобор"
    - "exit fee"
    - "termination fee"
    - "штраф за досрочное расторжение"
    - "auto-renewal"
    - "автоматическая пролонгация"
    - "price escalation"
    - "индексация цен"
    - "meet-or-release"
    - "hardship clause"

  negative_keywords:
    - "означает"
    - "в целях настоящего"
    - "споры"
    - "подсудность"
    - "применимое право"
    - "условия оплаты"
    - "валюта платежа"
    - "financial covenant"
    - "финансовые ковенанты"

  preferred_unit_types:
    - "obligation"
    - "termination_provision"
    - "general_provision"

  excluded_unit_types:
    - "definition"
    - "structural_anchor"
    - "technical_fragment"
    - "appendix_reference"

  preferred_clause_functions:
    - "obligations"
    - "limitations"
    - "procedures"
    - "remedies"

  position_bias:
    preferred_range: [0.10, 0.90]
    boost: 0.20
    scope: "segment"

  rerank: true
  filters: {}

conditional: null

enrichment_hints:
  preferred_segment_types:
    - "contract"
    - "amendment"
    - "annex"
    - "schedule"
  excluded_segment_types:
    - "technical_specification"
    - "price_list"
    - "invoice"
    - "act"
  confidence_bonus_on_match: 0.10
  confidence_penalty_on_excluded_segment: 0.15

extraction:
  enabled: true
  mode: "hybrid"
  llm_max_tokens: 1600

  # Presence gate: has_long_term_minimum_commitments уже выполняет роль
  # presence-сигнала (yes/no/unclear). Отдельное поле не вводится.
  # yes -> present (pass), no -> missing (missing_required_clause),
  # unclear -> unclear.
  # Контракт: present + missing + unclear = allowed_values.
  presence_signal:
    field: "has_long_term_minimum_commitments"
    present_values: ["yes"]
    missing_values: ["no"]
    unclear_values: ["unclear"]

  llm_prompt_extraction: |
    <role>
    Ты — юрист по коммерческим и долгосрочным договорам.
    Твоя задача — точно извлечь долгосрочные минимальные
    обязательства (take-or-pay, гарантированные объёмы,
    фиксированные минимальные платежи), их срок, auto-renewal,
    выживаемость при CoC, индексацию, shortfall penalties
    и стоимость досрочного выхода.

    КРИТИЧЕСКИ ВАЖНО:
    - Извлекай ТОЛЬКО то, что прямо написано в тексте.
    - НЕ делай выводов "по умолчанию" из общих норм права.
    - НЕ додумывай сроки, объёмы или штрафы, которых нет в тексте.
    - Если тема долгосрочных минимальных обязательств в договоре
      вообще не раскрыта — для has_long_term_minimum_commitments
      ставь "no", для остальных has_* — "no",
      для term_duration — "Не применимо",
      для commitments_description — "Не применимо".
    - Если информация неоднозначна — используй "unclear".

    Не анализируй базовые платёжные условия (валюту, штрафы
    за просрочку, escrow) — это задача чека
    payment_terms_and_structures.
    Не анализируй финансовые ковенанты.
    </role>

    <context_rules>
    - Некоторые фрагменты могут быть нерелевантны — игнорируй их.
    - Если среди фрагментов есть противоречия — укажи "unclear"
      и объясни в reason.
    - Если ни один фрагмент не содержит информации о минимальных
      обязательствах — has_long_term_minimum_commitments = "no";
      остальные поля — согласно Шагу 1.
    - Не используй информацию из definitions, преамбулы или приложений,
      если они не содержат substantive условий по теме check.
    - Общие обязательства без конкретных минимумов или объёмов
      НЕ считаются долгосрочными минимальными обязательствами.
    </context_rules>

    <context>
    Ниже приведены релевантные фрагменты договора:

    {context}
    </context>

    <task>
    Заполни только следующие поля:
    - sticky_obligations_display
    - has_long_term_minimum_commitments
    - commitments_description
    - term_duration
    - has_auto_renewal
    - survives_change_of_control
    - has_indexation
    - has_shortfall_penalties
    - has_exit_or_termination_fee
    - has_renegotiation_mechanism
    - reason

    Общие правила:
    - используй только то, что прямо следует из текста;
    - пиши коротко и по-русски.
    </task>

    <location_instructions>
    Для каждого поля по возможности укажи location в формате:
    {"clause_ref": "п. 7.2", "page": 10, "quote": "дословная фраза из договора"}

    Правила:
    - clause_ref — короткая ссылка на пункт / раздел / статью именно в том виде,
      как она написана в договоре;
    - page — целое число страницы;
    - quote — дословная фраза из текста договора (НЕ пересказ, НЕ парафраз),
      которая является источником значения поля. Копируй её посимвольно,
      сохраняя формулировку и порядок слов. Оптимальная длина: 30–300 символов.
      Примеры хорошего quote:
      * для has_long_term_minimum_commitments (yes): "Покупатель обязуется ежегодно приобретать не менее 1000 тонн продукции";
      * для has_auto_renewal (yes_with_notice): "Договор автоматически продлевается на следующий год, если ни одна из Сторон не направит уведомление об отказе не позднее чем за 180 дней";
      * для survives_change_of_control (yes): "Обязательства по настоящему Договору сохраняют силу независимо от смены контроля над любой из Сторон";
      * для has_indexation (yes_uncapped): "Стоимость продукции подлежит ежегодной индексации на уровень инфляции без ограничения";
      * для has_shortfall_penalties (yes): "Покупатель обязуется оплатить недостающий объём продукции по цене, установленной Договором";
      * для has_exit_or_termination_fee (yes_significant): "При досрочном расторжении Покупатель уплачивает штраф в размере 20% годового объёма закупки";
      * для has_renegotiation_mechanism (yes): "Стороны обязуются пересматривать условия настоящего Договора каждые 3 года".
    - не выдумывай location или quote;
    - если точную ссылку или дословную фразу определить нельзя,
      верни location = null;
    - для sticky_obligations_display, commitments_description,
      term_duration и reason location всегда null (синтезированы);
    - для signal-полей (has_*, survives_change_of_control) возвращай
      location с quote только когда значение подтверждается
      конкретным условием договора:
      * для "yes" / "yes_auto" / "yes_with_notice" /
        "yes_uncapped" / "yes_capped" / "yes_significant" /
        "yes_reasonable" — quote с описанием условия;
      * для "no" — quote только если договор прямо исключает или
        не предусматривает соответствующее условие;
        location = null, если условие просто не раскрыто;
      * для "unclear" — location = null;
    - если has_long_term_minimum_commitments = "no" — для всех полей
      location = null.
    </location_instructions>

    <instructions>
    Шаг 1 — НАЛИЧИЕ ДОЛГОСРОЧНЫХ МИНИМАЛЬНЫХ ОБЯЗАТЕЛЬСТВ

    Заполни "has_long_term_minimum_commitments".

    Значения:
    - "yes" — есть: take-or-pay, минимальные объёмы
      закупки/поставки, фиксированные минимальные платежи.
    - "no" — нет. Общие обязательства без минимумов = "no".
    - "unclear" — неясно.

    Если has_long_term_minimum_commitments = "no":
    - commitments_description = "Не применимо"
    - term_duration = "Не применимо"
    - has_auto_renewal = "no"
    - survives_change_of_control = "no"
    - has_indexation = "no"
    - has_shortfall_penalties = "no"
    - has_exit_or_termination_fee = "no"
    - has_renegotiation_mechanism = "no"
    - sticky_obligations_display = "Долгосрочных минимальных обязательств не обнаружено"
    - reason = "Долгосрочные минимальные обязательства не обнаружены в представленных фрагментах."
    - для всех полей location = null
    - не выполняй Шаги 2–9; переходи к Шагу 10.

    Если has_long_term_minimum_commitments = "unclear":
    - commitments_description = "Не удалось определить"
    - term_duration = "Не удалось определить"
    - has_auto_renewal = "unclear"
    - survives_change_of_control = "unclear"
    - has_indexation = "unclear"
    - has_shortfall_penalties = "unclear"
    - has_exit_or_termination_fee = "unclear"
    - has_renegotiation_mechanism = "unclear"
    - sticky_obligations_display = "Не удалось определить"
    - reason = "Формулировки присутствуют, но вывод надёжно сделать нельзя."
    - для всех полей location = null

    Если has_long_term_minimum_commitments = "yes" — переходи к Шагам 2–9.

    Шаг 2 — ОПИСАНИЕ ОБЯЗАТЕЛЬСТВ

    Заполни "commitments_description".

    ВАЖНО: поле должно быть очень коротким — 1 вид + 1 параметр.

    Формат: "[тип]: [ключевой параметр]"

    Примеры (строго такого формата):
    - "Take-or-pay: 1000 т/год"
    - "Мин. закупка: 60%"
    - "Фикс. платёж: 5 млн руб./мес."
    - "Take-or-pay: объём не указан"

    Если несколько видов — через ";", не более 2:
    - "Take-or-pay: 1000 т/год; мин. платёж: 2 млн руб."

    Если обязательств нет: "Не применимо"
    Если неясно: "Не удалось определить"

    Шаг 3 — СРОК ДЕЙСТВИЯ

    Заполни "term_duration".

    Правила:
    - Конкретный: "5 лет", "10 лет", "до 2030 года"
    - Бессрочный: "Бессрочный"
    - Не указан: "Не указан"
    - Неясно: "Не удалось определить"

    Шаг 4 — АВТОМАТИЧЕСКАЯ ПРОЛОНГАЦИЯ

    Заполни "has_auto_renewal".

    Значения (строго из списка):
    - "yes_auto" — автоматическое продление без уведомления.
    - "yes_with_notice" — продление если не направлено
      уведомление об отказе в установленный срок.
    - "no" — нет автопродления.
    - "unclear" — неясно.

    Шаг 5 — ВЫЖИВАЕМОСТЬ ПРИ CoC

    Заполни "survives_change_of_control".

    Значения:
    - "yes" — явно указано, что обязательства сохраняются
      при смене контроля.
    - "no" — при CoC контрагент вправе расторгнуть.
    - "unclear" — вопрос не урегулирован или неясно.

    Шаг 6 — ИНДЕКСАЦИЯ

    Заполни "has_indexation".

    Значения (строго из списка):
    - "yes_uncapped" — индексация без cap.
    - "yes_capped" — индексация с cap.
    - "no" — нет.
    - "unclear" — неясно.

    Шаг 7 — SHORTFALL PENALTIES

    Заполни "has_shortfall_penalties".

    Значения:
    - "yes" — есть: shortfall payment, deficiency payment,
      штрафы за недобор объёма.
    - "no" — нет.
    - "unclear" — неясно.

    Шаг 8 — СТОИМОСТЬ ДОСРОЧНОГО ВЫХОДА

    Заполни "has_exit_or_termination_fee".

    Значения (строго из списка):
    - "yes_significant" — есть, сумма значительная
      (прямо указана или явно велика относительно договора).
    - "yes_reasonable" — есть, сумма разумная.
    - "no" — нет.
    - "unclear" — неясно.

    Шаг 9 — МЕХАНИЗМ ПЕРЕСМОТРА

    Заполни "has_renegotiation_mechanism".

    Значения:
    - "yes" — есть: periodic review, market reset,
      meet-or-release, hardship clause.
    - "no" — обязательства без механизма пересмотра.
    - "unclear" — неясно.

    Шаг 10 — НОРМАЛИЗОВАННЫЙ DISPLAY ДЛЯ DD GRID

    Заполни "sticky_obligations_display".

    Это итоговое поле для таблицы. Строй его ТОЛЬКО на основе
    уже заполненных полей выше. Не добавляй информацию сверх них.

    Возможные состояния:
    1. Конкретные обязательства известны:
       "Take-or-pay: 1000 т/год; срок 7 лет; переживает CoC;
        exit fee"
    2. Обязательства есть, параметры частично неизвестны:
       "Мин. закупка 60%; срок не указан; auto-renewal"
    3. Обязательств нет:
       "Долгосрочных минимальных обязательств не обнаружено"
    4. Не удалось определить:
       "Не удалось определить"

    Правила построения (если has_long_term_minimum_commitments = "yes"):
    - начни с commitments_description (кратко)
    - добавь term_duration
    - добавь survives_change_of_control (если "yes")
    - добавь has_auto_renewal (если значимо)
    - добавь has_exit_or_termination_fee (если есть)
    Не более 4 фактов через ";".
    Не добавляй никаких данных, которых нет в полях выше
    (например, конкретные суммы платежей, если они не отражены
    в commitments_description).

    Шаг 11 — КРАТКОЕ ОБОСНОВАНИЕ

    Заполни "reason".

    Правила:
    - Первое предложение — краткий вывод по обязательствам.
    - Второе — короткая цитата из текста (до 100 символов).
    - Пиши по-русски.
    - Не оценивай риск.
    </instructions>

    <edge_cases>
    - Только общие обязанности без минимумов:
      * has_long_term_minimum_commitments = "no"
      * commitments_description = "Не применимо"
      * term_duration = "Не применимо"
      * has_auto_renewal = "no"
      * survives_change_of_control = "no"
      * has_indexation = "no"
      * has_shortfall_penalties = "no"
      * has_exit_or_termination_fee = "no"
      * has_renegotiation_mechanism = "no"
      * sticky_obligations_display =
        "Долгосрочных минимальных обязательств не обнаружено"

    - "Shall remain in full force regardless of CoC":
      * has_long_term_minimum_commitments = "yes"
      * survives_change_of_control = "yes"

    - Auto-renewal с 180-дневным notice:
      * has_long_term_minimum_commitments = "yes"
      * has_auto_renewal = "yes_with_notice"

    - Indexation CPI + 3% без cap:
      * has_long_term_minimum_commitments = "yes"
      * has_indexation = "yes_uncapped"

    - Meet-or-release clause:
      * has_long_term_minimum_commitments = "yes"
      * has_renegotiation_mechanism = "yes"

    - Нет релевантных фрагментов:
      * has_long_term_minimum_commitments = "no"
      * commitments_description = "Не применимо"
      * term_duration = "Не применимо"
      * has_auto_renewal = "no"
      * survives_change_of_control = "no"
      * has_indexation = "no"
      * has_shortfall_penalties = "no"
      * has_exit_or_termination_fee = "no"
      * has_renegotiation_mechanism = "no"
      * sticky_obligations_display =
        "Долгосрочных минимальных обязательств не обнаружено"
    </edge_cases>

    <output_expectations>
    - Верни результат строго в формате JSON.
    - Не оборачивай в markdown-блоки (без ```).
    - Не добавляй комментариев вне JSON.
    - Значения allowed_values полей — строго из списка (на английском).
    - Свободные текстовые поля (sticky_obligations_display,
      commitments_description, term_duration, reason) —
      на русском языке.
    - Не добавляй никаких полей, кроме указанных.
    - Для каждого поля возвращай объект с ключами
