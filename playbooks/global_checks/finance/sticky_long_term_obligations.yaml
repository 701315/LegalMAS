id: "sticky_long_term_obligations"
name: "Долгосрочные 'липкие' обязательства и минимальные уровни"
description: >
  Анализирует долгосрочные обязательства, минимальные платежи и гарантированные
  объемы, которые переживают смену контроля и могут существенно ограничивать
  Target после сделки.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"

rules:
  keywords:
    - "минимальный гарантированный объем"
    - "guaranteed minimum"
    - "take-or-pay"
    - "минимальный объем закупки"
    - "минимальный объем поставки"
    - "fixed minimum payment"
    - "long-term commitment"
    - "долгосрочные обязательства"
    - "обязательство приобретать"
    - "обязательство поставлять"
    - "переживает смену контроля"
    - "survive change of control"
  keyword_mode: "any"
  regex_patterns: []
  clause_patterns: []

llm:
  prompt_template: |
    <role>
    Ты — юрист по коммерческим и долгосрочным договорам.
    Твоя специализация — долгосрочные минимальные обязательства (take-or-pay,
    гарантированные объемы) и их влияние на Target после сделки.
    </role>

    <context>
    Ниже приведены фрагменты договора:

    {context}
    </context>

    <instructions>
    Определи:

    1) Есть ли долгосрочные обязательства по:
       - минимальным объемам закупки/поставки;
       - фиксированным минимальным платежам (даже при меньшем фактическом объёме);
       - схемам типа take-or-pay или аналогичным моделям.

       Отрази общий факт их наличия в has_long_term_minimum_commitments
       и кратко опиши их содержание в commitments_description.

    2) Переживают ли такие обязательства смену контроля/смену сторон:
       - прямо ли указано, что обязательства сохраняются при change of control,
         смене акционеров или переходе прав;
       - либо обязательства привязаны к договору вне зависимости от текущих владельцев.
       Отрази это в survive_change_of_control.

    3) Для какого периода и на каких условиях эти обязательства действуют:
       - длительность (годы, автоматическое продление);
       - условия изменения/пересмотра (индексация, пересмотр минимальных объемов).
       Это должно быть отражено в commitments_description (в свободной форме).

    4) Насколько такие обязательства могут быть обременительными для Target
       после сделки (особенно при изменении спроса/бизнес-модели):
       - оцени economic_risk_level: low / medium / high / unclear с точки зрения
         экономической нагрузки и «липкости» обязательств;
       - оцени общий риск overall_risk_level: low / medium / high, учитывая
         сочетание минимальных обязательств и их survivability при CoC.

    Не делай количественных прогнозов (сколько точно Target заплатит), оценивай
    только по формулировкам договора.
    </instructions>

    <edge_cases>
    ВАЖНО — пограничные случаи:

    — Если есть минимальные объёмы или фиксированные платежи, но срок договора
      короткий и отсутствуют автоматические пролонгации:
      has_long_term_minimum_commitments = "yes",
      economic_risk_level может быть "medium" (обоснуй, что срок ограничен).

    — Если обязательства явно привязаны к конкретной стороне и при смене контроля
      контрагент получает право расторгнуть договор без сохранения обязательств:
      survive_change_of_control = "no".

    — Если текст прямо говорит, что договор и его обязательства продолжают действовать
      независимо от смены контроля/владельца:
      survive_change_of_control = "yes".

    — Если фрагменты упоминают только общие обязанности "поставлять"/"покупать",
      без минимальных уровней, фиксированных платежей или длительных периодов:
      has_long_term_minimum_commitments = "no".

    — Пустые или нерелевантные фрагменты:
      большинство полей = "unclear" или пустые строки,
      overall_risk_level = "medium",
      reason = "Недостаточно данных для анализа долгосрочных минимальных обязательств."
    </edge_cases>

    <examples>
    ПРИМЕР 1 — КЛАССИЧЕСКОЕ TAKE-OR-PAY, ВЫСОКИЙ РИСК:

    Фрагмент: "Покупатель обязуется ежегодно оплачивать не менее 80% годового
    контрактного объема продукции, независимо от фактически отобранного объема
    (take-or-pay). Обязательства по настоящему Договору сохраняют силу в случае
    смены контроля над Покупателем."

    {{
      "has_long_term_minimum_commitments": "yes",
      "commitments_description": "Ежегодное обязательство оплачивать 80% контрактного объема по схеме take-or-pay, независимо от фактического отбора, с сохранением обязательств при смене контроля.",
      "survive_change_of_control": "yes",
      "economic_risk_level": "high",
      "overall_risk_level": "high",
      "reason": "Высокий минимальный объём take-or-pay, ежегодное обязательство и прямое сохранение обязательств при смене контроля создают значимую долгосрочную нагрузку для Target."
    }}

    ПРИМЕР 2 — МИНИМАЛЬНЫЕ ОБЪЁМЫ НА ОГРАНИЧЕННЫЙ СРОК (MEDIUM):

    Фрагмент: "Покупатель обязуется в течение первых двух лет договора
    приобретать не менее 60% годового объема. В случае смены контроля
    любая из Сторон вправе расторгнуть Договор."

    {{
      "has_long_term_minimum_commitments": "yes",
      "commitments_description": "Минимальный объём покупки 60% годового объёма в течение 2 лет, с правом расторжения при смене контроля.",
      "survive_change_of_control": "no",
      "economic_risk_level": "medium",
      "overall_risk_level": "medium",
      "reason": "Есть минимальные обязательства на ограниченный срок, но они не переживают смену контроля, что уменьшает долгосрочный риск для покупателя бизнеса."
    }}

    ПРИМЕР 3 — НЕТ ЯВНЫХ ДОЛГОСРОЧНЫХ ОБЯЗАТЕЛЬСТВ (LOW):

    Фрагмент: "Покупатель вправе по своему усмотрению размещать заказы
    на продукцию, а Поставщик обязуется удовлетворять такие заказы
    при наличии производственных мощностей."

    {{
      "has_long_term_minimum_commitments": "no",
      "commitments_description": "Нет минимальных объёмов или фиксированных платежей, объём закупок определяется по усмотрению Покупателя.",
      "survive_change_of_control": "unclear",
      "economic_risk_level": "low",
      "overall_risk_level": "low",
      "reason": "Отсутствуют обязательные минимальные объёмы или долгосрочные гарантированные платежи, что не создаёт жёсткой нагрузки на Target."
    }}
    </examples>

    <output_format>
    Твой ответ ДОЛЖЕН быть строго валидным JSON-объектом со следующими
    полями:

    {{
      "has_long_term_minimum_commitments": "one of: yes | no | unclear",
      "commitments_description": "string — краткое описание вида, объёма и срока минимальных обязательств (если есть)",
      "survive_change_of_control": "one of: yes | no | unclear",
      "economic_risk_level": "one of: low | medium | high | unclear",
      "overall_risk_level": "one of: low | medium | high",
      "reason": "string — краткое объяснение на русском с указанием ключевых формулировок и влияния на Target после сделки"
    }}

    Все перечисленные поля ДОЛЖНЫ присутствовать в JSON, даже если их значение равно null.
    </output_format>

    <constraints>
    ЖЁСТКИЕ ПРАВИЛА:
    1. Выведи ТОЛЬКО один JSON-объект. Никакого текста до или после.
    2. Не пиши "Вот JSON", "Here is the JSON" и т.п.
    3. Не используй Markdown, бэктики ``` или любые обёртки.
    4. Все строки — в двойных кавычках.
    5. Значения перечислимых полей — СТРОГО из указанных вариантов.
    6. Ключи — точно как указано, без добавления новых.
    7. Поле "reason" ДОЛЖНО содержать конкретные факты и формулировки
       из фрагментов, а не общие фразы вроде "есть риски".
    8. Начни ответ сразу с символа {{
    9. Если по какому‑то полю нет достаточно информации в тексте —
       верни для него 'unclear' или null (для reason пустое значение
       недопустимо — нужно объяснение). НЕ придумывай значения, не интерполируй.
    </constraints>
  prompt_file: null
  context_k: 4
  temperature: 0.0
  max_tokens: 512

evidence:
  required: false
  min_snippet_length: 20
  max_snippet_length: 500

retrieval:
  context_k: 4
  max_chunks: 8
  boost_keywords:
    - "take-or-pay"
    - "минимальный гарантированный объем"
    - "fixed minimum payment"
    - "long-term commitment"
  rerank: true
  filters: {}

conditional: null

extraction:
  enabled: true
  mode: "hybrid"
  fields:
    - name: "has_long_term_minimum_commitments"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
    - name: "commitments_description"
      type: "string"
    - name: "survive_change_of_control"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
    - name: "economic_risk_level"
      type: "string"
      allowed_values:
        - "low"
        - "medium"
        - "high"
        - "unclear"
    - name: "overall_risk_level"
      type: "string"
      allowed_values:
        - "low"
        - "medium"
        - "high"
    - name: "reason"
      type: "string"
  store_payload: true

red_flags:
  items:
    - code: "FIN7"
      description: "Крупные take-or-pay/минимальные объемы при волатильном спросе."
    - code: "FIN8"
      description: "Долгосрочные минимальные обязательства, переживающие смену контроля и ограничивающие гибкость Target."
      