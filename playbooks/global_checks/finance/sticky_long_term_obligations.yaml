id: "sticky_long_term_obligations"
name: "Долгосрочные 'липкие' обязательства и минимальные уровни"
description: >
  Анализирует долгосрочные обязательства, минимальные платежи и гарантированные
  объемы, которые переживают смену контроля и могут существенно ограничивать
  Target после сделки.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"

rules:
  keywords:
    - "минимальный гарантированный объем"
    - "guaranteed minimum"
    - "take-or-pay"
    - "минимальный объем закупки"
    - "минимальный объем поставки"
    - "fixed minimum payment"
    - "long-term commitment"
    - "долгосрочные обязательства"
    - "обязательство приобретать"
    - "обязательство поставлять"
    - "переживает смену контроля"
    - "survive change of control"
  keyword_mode: "any"
  regex_patterns: []
  clause_patterns: []

llm:
  prompt_template: |
    <role>
    Ты — юрист по коммерческим и долгосрочным договорам.
    Твоя специализация — долгосрочные минимальные обязательства (take-or-pay,
    гарантированные объемы) и их влияние на Target после сделки.
    </role>

    <context>
    Ниже приведены фрагменты договора:

    {context}
    </context>

    <instructions>
    Проведи анализ по шагам. Каждый шаг логически связан с одним или
    несколькими полями итоговой оценки.

    Шаг 1 — НАЛИЧИЕ ДОЛГОСРОЧНЫХ МИНИМАЛЬНЫХ ОБЯЗАТЕЛЬСТВ
    (используется для заполнения поля "has_long_term_minimum_commitments"
     и описания "commitments_description"):
    - Определи, содержатся ли в договоре:
      * минимальные объемы закупки или поставки;
      * фиксированные минимальные платежи независимо от фактических объёмов;
      * схемы take-or-pay или аналогичные модели.
    - Кратко опиши вид, уровень и базовую логику таких обязательств
      (например, проценты от объёма, годовые минимумы, обязательные платежи).

    Шаг 2 — СВЯЗЬ ОБЯЗАТЕЛЬСТВ СО СМЕНОЙ КОНТРОЛЯ
    (используется для заполнения поля "survive_change_of_control"):
    - Определи, переживают ли такие обязательства смену контроля/смену собственников:
      * прямо ли указано, что договор и обязательства сохраняют силу при change of control;
      * предусмотрено ли право расторжения при смене контроля вместо сохранения
        обязательств;
      * либо этот вопрос остаётся неурегулированным.
    - Сделай вывод: да, нет или по тексту это неясно.

    Шаг 3 — СРОК ДЕЙСТВИЯ И УСЛОВИЯ ПЕРЕСМОТРА
    (дополняет "commitments_description" и влияет на оценку риска):
    - Определи:
      * срок действия таких обязательств (фиксированный период, долгосрочный договор,
        наличие автоматических пролонгаций);
      * условия изменения/пересмотра (индексация, возможность пересмотра
        минимальных объёмов, триггеры для переговоров).
    - Отрази эти элементы в описании обязательств, подчеркивая, являются ли
      они по сути "забетонированными" или допускают адаптацию.

    Шаг 4 — ЭКОНОМИЧЕСКАЯ НАГРУЗКА И «ЛИПКOСТЬ» ОБЯЗАТЕЛЬСТВ
    (используется для заполнения поля "economic_risk_level"):
    - Оцени, насколько такие обязательства потенциально обременительны для Target:
      * требуют ли существенных фиксированных платежей независимо от спроса;
      * навязывают ли высокие минимальные объёмы на длительный срок;
      * насколько сложно будет сократить объёмы или выйти из договора.
    - Сформулируй уровень экономического риска как:
      * low — обязательства умеренные по объёму и/или сроку;
      * medium — обязательства требуют заметной осторожности при планировании;
      * high — обязательства жёсткие и могут серьёзно бить по экономике;
      * unclear — по фрагментам нельзя надёжно оценить нагрузку.

    Шаг 5 — ОБЩИЙ УРОВЕНЬ РИСКА ДЛЯ TARGET
    (используется для формирования "overall_risk_level" и "reason"):
    - Учитывая наличие и параметры минимальных обязательств, а также то,
      переживают ли они смену контроля, оцени общий риск для покупателя бизнеса:
      * долгосрочная неснимаемая нагрузка;
      * ограничение гибкости изменения бизнес-модели;
      * риски при падении спроса или смене продуктовой стратегии.
    - Сформулируй общий риск как low / medium / high.
    - В "reason" коротко обоснуй вывод с указанием ключевых формулировок
      (желательно с короткими цитатами в кавычках) и поясни, как именно
      эти обязательства могут повлиять на Target после сделки.
    </instructions>

    <edge_cases>
    Обрабатывай пограничные ситуации так:

    - Есть минимальные объёмы или фиксированные платежи, но срок договора
      ограничен и нет автоматических пролонгаций:
      учитывай, что риск существует, но по времени он ограничен; отражай
      это в полном описании и уровне риска.

    - Обязательства явно привязаны к конкретной стороне, а при смене контроля
      контрагент получает право расторгнуть договор:
      отмечай, что в таком случае долгосрочная «липкость» снижается, даже если
      в текущем составе собственников обязательства значимы.

    - Текст прямо говорит, что договор и его обязательства продолжают действовать
      независимо от смены контроля/владельца:
      обращай на это особое внимание как на фактор усиления долгосрочного риска.

    - Упоминаются только общие обязанности поставлять или покупать без
      минимальных уровней, фиксированных платежей или длительных периодов:
      отражай отсутствие именно долгосрочных минимальных commitments.

    - Пустые или явно нерелевантные фрагменты:
      укажи, что данных недостаточно для анализа долгосрочных минимальных
      обязательств, и поясни, как это влияет на неопределённость и риск.
    </edge_cases>

    <output_expectations>
    На основе твоего анализа отдельный механизм извлечения сформирует
    структурированные поля по заранее заданной схеме. Твоя задача —
    давать чёткие юридические выводы и указывать конкретные формулировки
    из текста, на которых они основаны.
    </output_expectations>
  prompt_file: null
  context_k: 4
  temperature: 0.0
  max_tokens: 512

evidence:
  required: false
  min_snippet_length: 20
  max_snippet_length: 500

retrieval:
  context_k: 4
  max_chunks: 8
  boost_keywords:
    - "take-or-pay"
    - "минимальный гарантированный объем"
    - "fixed minimum payment"
    - "long-term commitment"
  rerank: true
  filters: {}

conditional: null

extraction:
  enabled: true
  mode: "hybrid"
  fields:
    - name: "has_long_term_minimum_commitments"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "commitments_description"
      type: "string"

    - name: "survive_change_of_control"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "economic_risk_level"
      type: "string"
      allowed_values:
        - "low"
        - "medium"
        - "high"
        - "unclear"

    - name: "overall_risk_level"
      type: "string"
      allowed_values:
        - "low"
        - "medium"
        - "high"

    - name: "reason"
      type: "string"

  store_payload: true

red_flags:
  items:
    - code: "FIN7"
      description: "Крупные take-or-pay/минимальные объемы при волатильном спросе."
    - code: "FIN8"
      description: "Долгосрочные минимальные обязательства, переживающие смену контроля и ограничивающие гибкость Target."
