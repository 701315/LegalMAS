id: "sticky_long_term_obligations"
name: "Долгосрочные 'липкие' обязательства и минимальные уровни"
description: >
  Анализирует долгосрочные обязательства, минимальные платежи
  и гарантированные объёмы: take-or-pay схемы, минимальные объёмы
  закупки/поставки, фиксированные платежи. Оценивает срок действия,
  условия пересмотра и indexation, выживаемость при смене контроля,
  penalties за невыполнение, стоимость выхода (exit fee),
  auto-renewal. Определяет степень «липкости» обязательств
  и их влияние на Target после M&A-сделки.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"

rules:
  keyword_mode: any

  keywords:
    high:
      # Take-or-pay и минимальные объёмы
      - "(?i)take[-\\s]?or[-\\s]?pay"
      - "(?i)minimum\\s+(guaranteed\\s+)?(volume|quantity|purchase|supply)"
      - "(?i)минимальн[а-я]+\\s+(гарантированн[а-я]+\\s+)?(объём|количеств|закупк|поставк)"
      - "(?i)guaranteed\\s+minimum"
      - "(?i)гарантированн[а-я]+\\s+минимум"
      - "(?i)fixed\\s+minimum\\s+payment"
      - "(?i)фиксированн[а-я]+\\s+минимальн[а-я]+\\s+платёж"

      # Долгосрочные обязательства
      - "(?i)long[-\\s]?term\\s+(commitment|obligation|contract)"
      - "(?i)долгосрочн[а-я]+\\s+(обязательств|контракт|договор)"
      - "(?i)multi[-\\s]?year\\s+(agreement|commitment)"
      - "(?i)многолетн[а-я]+\\s+(соглашени|обязательств)"

      # Обязательство приобретать/поставлять
      - "(?i)обязательств[оа]\\s+(приобретать|закупать|поставлять)"
      - "(?i)obligation\\s+to\\s+(purchase|buy|supply|deliver)"
      - "(?i)shall\\s+(purchase|buy|supply)\\s+a\\s+minimum"
      - "(?i)обязан[аоы]?\\s+(закупать|приобретать|поставлять)\\s+не\\s+менее"

      # Выживаемость при CoC
      - "(?i)surviv(e|es|ing)\\s+(a\\s+)?(change\\s+of\\s+control|CoC)"
      - "(?i)переживает\\s+смену\\s+контрол"
      - "(?i)shall\\s+remain\\s+in\\s+(full\\s+)?force[\\s\\S]{0,30}(change|transfer|CoC)"
      - "(?i)независимо\\s+от\\s+смены\\s+(контрол|собственник|владел)"

    medium:
      # Shortfall / penalties
      - "(?i)shortfall\\s+payment"
      - "(?i)deficiency\\s+payment"
      - "(?i)платёж\\s+за\\s+недобор"
      - "(?i)penalty\\s+for\\s+(failure\\s+to\\s+)?(meet|achieve|fulfil)\\s+(the\\s+)?minimum"
      - "(?i)штраф\\s+за\\s+невыполнени[ея]\\s+минимальн"

      # Exit / termination fee
      - "(?i)exit\\s+fee"
      - "(?i)termination\\s+fee"
      - "(?i)early\\s+termination\\s+(fee|penalty|payment)"
      - "(?i)штраф\\s+за\\s+досрочн[а-я]+\\s+расторжени"
      - "(?i)плата\\s+за\\s+(выход|досрочн[а-я]+\\s+расторжени)"

      # Auto-renewal / пролонгация
      - "(?i)auto(matic)?[-\\s]?(renewal|extension)"
      - "(?i)автоматическ[а-я]+\\s+(пролонгаци|продлени)"
      - "(?i)shall\\s+(automatically\\s+)?renew"
      - "(?i)автоматически\\s+продлевается"
      - "(?i)evergreen"
      - "(?i)rolling\\s+(term|contract)"

      # Indexation / escalation
      - "(?i)price\\s+(escalation|indexation|adjustment)"
      - "(?i)индексаци[яи]\\s+(цен|стоимост)"
      - "(?i)annual\\s+(price\\s+)?increase"
      - "(?i)ежегодн[а-я]+\\s+(увеличени|повышени|рост)"
      - "(?i)CPI\\s+(adjustment|escalation)"
      - "(?i)привязка\\s+к\\s+(индексу|инфляци)"

      # Срок
      - "(?i)term\\s+of\\s+\\d+\\s+years?"
      - "(?i)срок\\s+(действия\\s+)?\\d+\\s+(лет|год)"
      - "(?i)initial\\s+term"
      - "(?i)первоначальн[а-я]+\\s+срок"

    low:
      # Общие термины
      - "(?i)minimum"
      - "(?i)минимальн"
      - "(?i)commitment"
      - "(?i)обязательств"
      - "(?i)volume"
      - "(?i)объём"
      - "(?i)purchase"
      - "(?i)закупк"
      - "(?i)supply"
      - "(?i)поставк"
      - "(?i)long[-\\s]?term"
      - "(?i)долгосрочн"
      - "(?i)renewal"
      - "(?i)пролонгац"
      - "(?i)penalty"
      - "(?i)штраф"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 700

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  context_k: 5
  max_chunks: 10
  boost_keywords:
    - "take-or-pay"
    - "minimum guaranteed volume"
    - "минимальный гарантированный объём"
    - "fixed minimum payment"
    - "фиксированный минимальный платёж"
    - "long-term commitment"
    - "долгосрочные обязательства"
    - "обязательство приобретать"
    - "obligation to purchase"
    - "survive change of control"
    - "переживает смену контроля"
    - "shortfall payment"
    - "платёж за недобор"
    - "exit fee"
    - "termination fee"
    - "штраф за досрочное расторжение"
    - "auto-renewal"
    - "автоматическая пролонгация"
    - "evergreen"
    - "price escalation"
    - "индексация цен"
    - "multi-year agreement"
    - "многолетний контракт"
  rerank: true
  filters: {}

conditional: null

extraction:
  llm_prompt_extraction: |
    <role>
    Ты — юрист по коммерческим и долгосрочным договорам.
    Твоя специализация — анализ долгосрочных минимальных обязательств
    (take-or-pay, гарантированные объёмы), их выживаемости при смене
    контроля, условий пересмотра и стоимости выхода.
    </role>

    <context>
    Ниже приведены фрагменты договора с долгосрочными обязательствами
    и/или минимальными уровнями:

    {context}
    </context>

    <instructions>
    Проведи анализ по шагам. Каждый шаг логически соответствует одному
    или нескольким полям итоговой оценки риска.

    Шаг 1 — НАЛИЧИЕ ДОЛГОСРОЧНЫХ МИНИМАЛЬНЫХ ОБЯЗАТЕЛЬСТВ
    (используется для заполнения поля "has_long_term_minimum_commitments"):
    - Определи, содержит ли договор:
      * минимальные объёмы закупки / поставки;
      * фиксированные минимальные платежи;
      * take-or-pay схемы;
      * guaranteed minimum commitments.
    - Оцени:
      * "yes" — есть;
      * "no" — нет;
      * "unclear" — неясно.
    - В commitments_description опиши:
      * вид обязательств;
      * уровень (объём, сумма, % от capacity);
      * базовую логику (годовые минимумы, ежемесячные и т.п.).

    Шаг 2 — СРОК ДЕЙСТВИЯ И ПРОЛОНГАЦИЯ
    (используется для заполнения полей "term_duration" и "has_auto_renewal"):
    - Определи срок действия обязательств:
      * конкретный период (например, "5 years");
      * бессрочный / indefinite;
      * не указан.
    - Определи, есть ли автоматическая пролонгация:
      * "yes_auto" — автоматическое продление (evergreen,
        auto-renewal);
      * "yes_with_notice" — продление, если не направлено
        уведомление об отказе;
      * "no" — нет автоматического продления;
      * "unclear" — неясно.

    Шаг 3 — ВЫЖИВАЕМОСТЬ ПРИ СМЕНЕ КОНТРОЛЯ
    (используется для заполнения поля "survives_change_of_control"):
    - Определи, переживают ли обязательства смену контроля:
      * "yes" — явно указано, что договор/обязательства
        сохраняют силу при CoC;
      * "no" — при CoC контрагент может расторгнуть договор
        или обязательства прекращаются;
      * "unclear" — не урегулировано.

    Шаг 4 — INDEXATION / ESCALATION
    (используется для заполнения поля "has_indexation"):
    - Определи, предусмотрена ли индексация / эскалация
      минимальных обязательств:
      * привязка к CPI / инфляции;
      * ежегодное увеличение на фиксированный %;
      * market reset / benchmark adjustment.
    - Оцени:
      * "yes_uncapped" — индексация без cap;
      * "yes_capped" — индексация с cap;
      * "no" — нет индексации;
      * "unclear" — неясно.

    Шаг 5 — PENALTIES ЗА НЕВЫПОЛНЕНИЕ
    (используется для заполнения поля "has_shortfall_penalties"):
    - Определи, предусмотрены ли санкции за невыполнение
      минимальных объёмов:
      * shortfall payment;
      * deficiency payment;
      * штрафы / penalties;
      * requirement to pay for unused capacity.
    - Оцени:
      * "yes" — есть;
      * "no" — нет;
      * "unclear" — неясно.

    Шаг 6 — СТОИМОСТЬ ВЫХОДА (EXIT FEE)
    (используется для заполнения поля "has_exit_or_termination_fee"):
    - Определи, предусмотрена ли плата за досрочный выход:
      * exit fee / termination fee;
      * early termination penalty;
      * liquidated damages при досрочном расторжении.
    - Оцени:
      * "yes_significant" — есть, значительный размер;
      * "yes_reasonable" — есть, разумный размер;
      * "no" — нет;
      * "unclear" — неясно.

    Шаг 7 — УСЛОВИЯ ПЕРЕСМОТРА
    (используется для заполнения поля "has_renegotiation_mechanism"):
    - Определи, предусмотрены ли механизмы пересмотра условий:
      * periodic review / renegotiation clause;
      * market reset;
      * meet-or-release;
      * hardship clause.
    - Оцени:
      * "yes" — есть механизм пересмотра;
      * "no" — обязательства «забетонированы»;
      * "unclear" — неясно.

    Шаг 8 — RED FLAGS
    (используется для заполнения поля "red_flags"):
    Присвой один или несколько кодов из списка ниже.
    Если ни один код не применим — верни "NONE".
    Если данных недостаточно для оценки — верни "UNCLEAR".

    Коды:
    • LTO1 — Крупные take-or-pay или минимальные объёмы
      при волатильном спросе / неопределённой загрузке.
    • LTO2 — Долгосрочные обязательства (> 5 лет) без права
      досрочного выхода или с высоким exit fee.
    • LTO3 — Обязательства явно переживают смену контроля
      (survive CoC), ограничивая гибкость покупателя.
    • LTO4 — Автоматическая пролонгация (auto-renewal /
      evergreen) без механизма отказа или с коротким
      notice period.
    • LTO5 — Высокие penalties / shortfall payments
      за невыполнение минимальных объёмов.
    • LTO6 — Indexation / escalation в пользу контрагента
      без cap или market reset.

    Формат ответа: коды через запятую без комментариев
    (например: "LTO1, LTO3").
    Вся аргументация — в поле reason.

    Шаг 9 — ОБОСНОВАНИЕ
    (используется для заполнения поля "reason"):

    - В reason кратко обоснуй вывод, опираясь на ключевые
      формулировки из текста (с цитатами в кавычках), и укажи:
      * какие минимальные обязательства установлены
        и на какой срок;
      * переживают ли они CoC;
      * есть ли auto-renewal, indexation, penalties, exit fee;
      * есть ли механизм пересмотра;
      * если выставлены red_flags — обоснуй каждый код;
      * если red_flags = "NONE" — укажи, почему обязательства
        не создают существенного риска.
    </instructions>

    <edge_cases>
    Обрабатывай пограничные ситуации так:

    - Минимальные объёмы есть, но срок договора ограничен
      (< 3 лет), нет auto-renewal:
      has_long_term_minimum_commitments = "yes";
      risk может быть MEDIUM или LOW в зависимости
      от объёма; в reason укажи ограниченность срока.

    - При CoC контрагент может расторгнуть договор:
      survives_change_of_control = "no";
      LTO3 не выставляется; в reason отметь, что
      долгосрочная «липкость» снижается.

    - Договор явно указывает: «shall remain in full force
      regardless of change of control»:
      survives_change_of_control = "yes";
      зафиксируй LTO3.

    - Auto-renewal с 180-дневным notice period:
      has_auto_renewal = "yes_with_notice";
      LTO4 может не выставляться, если notice разумный;
      в reason укажи детали.

    - Auto-renewal с 30-дневным notice:
      зафиксируй LTO4 — короткий notice затрудняет отказ.

    - Indexation CPI + 3% без cap:
      has_indexation = "yes_uncapped";
      зафиксируй LTO6.

    - Есть meet-or-release clause:
      has_renegotiation_mechanism = "yes";
      в reason укажи, что это снижает «липкость».

    - Только общие обязанности поставлять/покупать
      без минимальных уровней:
      has_long_term_minimum_commitments = "no";
      red_flags = "NONE".

    - Пустые или явно нерелевантные фрагменты:
      red_flags = "UNCLEAR"; в reason укажи недостаток данных.
    </edge_cases>

    <output_expectations>
    На основе твоего анализа отдельный механизм извлечения сформирует
    структурированные поля по заранее заданной схеме. Твоя задача —
    давать чёткие юридические выводы и указывать конкретные
    формулировки из текста, на которых они основаны.
    </output_expectations>

  enabled: true
  mode: "hybrid"
  fields:
    - name: "has_long_term_minimum_commitments"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "term_duration"
      type: "string"

    - name: "has_auto_renewal"
      type: "string"
      allowed_values:
        - "yes_auto"
        - "yes_with_notice"
        - "no"
        - "unclear"

    - name: "survives_change_of_control"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "has_indexation"
      type: "string"
      allowed_values:
        - "yes_uncapped"
        - "yes_capped"
        - "no"
        - "unclear"

    - name: "has_shortfall_penalties"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "has_exit_or_termination_fee"
      type: "string"
      allowed_values:
        - "yes_significant"
        - "yes_reasonable"
        - "no"
        - "unclear"

    - name: "has_renegotiation_mechanism"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "red_flags"
      type: "string"

    - name: "reason"
      type: "string"

  store_payload: true

red_flags:
  items:
    - code: "LTO1"
      description: >
        Крупные take-or-pay или минимальные объёмы при волатильном
        спросе / неопределённой загрузке.
    - code: "LTO2"
      description: >
        Долгосрочные обязательства (> 5 лет) без права досрочного
        выхода или с высоким exit fee.
    - code: "LTO3"
      description: >
        Обязательства явно переживают смену контроля (survive CoC),
        ограничивая гибкость покупателя.
    - code: "LTO4"
      description: >
        Автоматическая пролонгация (auto-renewal / evergreen)
        без механизма отказа или с коротким notice period.
    - code: "LTO5"
      description: >
        Высокие penalties / shortfall payments за невыполнение
        минимальных объёмов.
    - code: "LTO6"
      description: >
        Indexation / escalation в пользу контрагента без cap
        или market reset.