id: "sticky_long_term_obligations"
name: "Долгосрочные 'липкие' обязательства и минимальные уровни"
description: >
  Анализирует долгосрочные минимальные обязательства: take-or-pay
  схемы, минимальные объёмы закупки / поставки, фиксированные
  платежи. Оценивает срок действия, наличие автоматической
  пролонгации, индексацию, выживаемость при смене контроля,
  penalties за невыполнение, стоимость досрочного выхода
  (exit fee) и механизмы пересмотра условий.

  Формирует краткий user-facing вывод и определяет степень
  «липкости» обязательств для Target после M&A-сделки.

  Платежные условия (валюта, сроки, штрафы за просрочку,
  escrow) анализируются чеком payment_terms_and_structures.
  Финансовые ковенанты анализируются чеком financial_covenants.

doc_types: []

severity: "high"
severity_if_fail: "high"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"
ui_mode: "field_extraction"

rules:
  keyword_mode: any

  keywords:
    high:
      # Take-or-pay и минимальные объёмы
      - "(?i)take[-\\s]?or[-\\s]?pay"
      - "(?i)minimum\\s+(guaranteed\\s+)?(volume|quantity|purchase|supply)"
      - "(?i)минимальн[а-я]+\\s+(гарантированн[а-я]+\\s+)?(объём|количеств|закупк|поставк)"
      - "(?i)guaranteed\\s+minimum"
      - "(?i)гарантированн[а-я]+\\s+минимум"
      - "(?i)fixed\\s+minimum\\s+payment"
      - "(?i)фиксированн[а-я]+\\s+минимальн[а-я]+\\s+платёж"

      # Долгосрочные обязательства
      - "(?i)long[-\\s]?term\\s+(commitment|obligation|contract)"
      - "(?i)долгосрочн[а-я]+\\s+(обязательств|контракт|договор)"
      - "(?i)multi[-\\s]?year\\s+(agreement|commitment)"
      - "(?i)многолетн[а-я]+\\s+(соглашени|обязательств)"

      # Обязательство приобретать/поставлять
      - "(?i)obligation\\s+to\\s+(purchase|buy|supply|deliver)[\\s\\S]{0,20}minimum"
      - "(?i)shall\\s+(purchase|buy|supply)\\s+a\\s+minimum"
      - "(?i)обязан[аоы]?\\s+(закупать|приобретать|поставлять)\\s+не\\s+менее"

      # Выживаемость при CoC
      - "(?i)surviv(e|es|ing)\\s+(a\\s+)?(change\\s+of\\s+control|CoC)"
      - "(?i)переживает\\s+смену\\s+контрол"
      - "(?i)shall\\s+remain\\s+in\\s+(full\\s+)?force[\\s\\S]{0,30}(change|transfer|CoC)"
      - "(?i)независимо\\s+от\\s+смены\\s+(контрол|собственник|владел)"

    medium:
      # Shortfall / penalties
      - "(?i)shortfall\\s+payment"
      - "(?i)deficiency\\s+payment"
      - "(?i)платёж\\s+за\\s+недобор"
      - "(?i)penalty\\s+for\\s+(failure\\s+to\\s+)?(meet|achieve|fulfil)\\s+(the\\s+)?minimum"
      - "(?i)штраф\\s+за\\s+невыполнени[ея]\\s+минимальн"

      # Exit / termination fee
      - "(?i)exit\\s+fee"
      - "(?i)termination\\s+fee"
      - "(?i)early\\s+termination\\s+(fee|penalty|payment)"
      - "(?i)штраф\\s+за\\s+досрочн[а-я]+\\s+расторжени"
      - "(?i)плата\\s+за\\s+(выход|досрочн[а-я]+\\s+расторжени)"

      # Auto-renewal / пролонгация
      - "(?i)auto(matic)?[-\\s]?(renewal|extension)"
      - "(?i)автоматическ[а-я]+\\s+(пролонгаци|продлени)"
      - "(?i)shall\\s+(automatically\\s+)?renew"
      - "(?i)автоматически\\s+продлевается"
      - "(?i)evergreen"
      - "(?i)rolling\\s+(term|contract)"

      # Indexation / escalation
      - "(?i)price\\s+(escalation|indexation|adjustment)[\\s\\S]{0,20}(minimum|volume|commitment)"
      - "(?i)индексаци[яи]\\s+(цен|стоимост)[\\s\\S]{0,20}(минимальн|объём)"
      - "(?i)annual\\s+(price\\s+)?increase[\\s\\S]{0,20}(minimum|obligation)"
      - "(?i)CPI\\s+(adjustment|escalation)[\\s\\S]{0,20}(minimum|volume)"

      # Срок
      - "(?i)term\\s+of\\s+\\d+\\s+years?"
      - "(?i)срок\\s+(действия\\s+)?\\d+\\s+(лет|год)"
      - "(?i)initial\\s+term"
      - "(?i)первоначальн[а-я]+\\s+срок"

      # Механизм пересмотра
      - "(?i)meet[-\\s]?or[-\\s]?release"
      - "(?i)renegotiation\\s+clause"
      - "(?i)hardship\\s+clause"
      - "(?i)market\\s+reset"

    low:
      - "(?i)take[-\\s]?or[-\\s]?pay"
      - "(?i)minimum\\s+(volume|purchase|quantity)"
      - "(?i)минимальн[а-я]+\\s+(объём|закупк)"
      - "(?i)guaranteed\\s+minimum"
      - "(?i)auto[-\\s]?renewal"
      - "(?i)автоматическ[а-я]+\\s+пролонгаци"
      - "(?i)survive[\\s\\S]{0,20}(change|control)"
      - "(?i)exit\\s+fee"
      - "(?i)shortfall\\s+payment"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 700

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  context_k: 5
  max_chunks: 10
  boost_keywords:
    - "take-or-pay"
    - "minimum guaranteed volume"
    - "минимальный гарантированный объём"
    - "fixed minimum payment"
    - "фиксированный минимальный платёж"
    - "long-term commitment"
    - "долгосрочные обязательства"
    - "obligation to purchase minimum"
    - "обязательство приобретать не менее"
    - "survive change of control"
    - "переживает смену контроля"
    - "shortfall payment"
    - "платёж за недобор"
    - "exit fee"
    - "termination fee"
    - "штраф за досрочное расторжение"
    - "auto-renewal"
    - "автоматическая пролонгация"
    - "evergreen"
    - "price escalation"
    - "индексация минимального объёма"
    - "multi-year agreement"
    - "meet-or-release"
    - "hardship clause"
  rerank: true
  filters: {}

conditional: null

enrichment_hints:
  preferred_segment_types:
    - "contract"
    - "amendment"
    - "annex"
    - "schedule"
  excluded_segment_types:
    - "technical_specification"
    - "price_list"
    - "invoice"
    - "act"
  preferred_clause_functions:
    - "payment_terms"
    - "termination"
    - "change_of_control"
    - "delivery"
  confidence_bonus_on_match: 0.10
  confidence_penalty_on_excluded_segment: 0.15

extraction:
  enabled: true
  mode: "hybrid"
  llm_max_tokens: 500
  llm_prompt_extraction: |
    <role>
    Ты — юрист по коммерческим и долгосрочным договорам.
    Твоя задача — точно извлечь долгосрочные минимальные
    обязательства (take-or-pay, гарантированные объёмы),
    их срок, выживаемость при CoC, auto-renewal, indexation,
    penalties за невыполнение и стоимость досрочного выхода.

    Не анализируй базовые платежные условия (валюту, штрафы
    за просрочку, escrow) — это задача чека
    payment_terms_and_structures.
    </role>

    <context>
    Ниже приведены релевантные фрагменты договора:

    {context}
    </context>

    <task>
    Заполни только следующие поля:
    - sticky_obligations_display
    - has_long_term_minimum_commitments
    - commitments_description
    - term_duration
    - has_auto_renewal
    - survives_change_of_control
    - has_indexation
    - has_shortfall_penalties
    - has_exit_or_termination_fee
    - has_renegotiation_mechanism
    - red_flags
    - reason

    Важно:
    - не анализируй базовые платежные условия;
    - не анализируй финансовые ковенанты;
    - пиши user-facing значения коротко и по-русски.
    </task>

    <instructions>
    Шаг 1 — НАЛИЧИЕ ДОЛГОСРОЧНЫХ МИНИМАЛЬНЫХ ОБЯЗАТЕЛЬСТВ

    Заполни поле "has_long_term_minimum_commitments".

    Значения:
    - "yes" — есть: минимальные объёмы закупки/поставки,
      фиксированные минимальные платежи, take-or-pay,
      guaranteed minimum commitments.
    - "no" — нет.
    - "unclear" — неясно.

    Шаг 2 — ОПИСАНИЕ ОБЯЗАТЕЛЬСТВ

    Заполни поле "commitments_description".

    Правила:
    - Кратко опиши вид, уровень и логику обязательств:
      * "Take-or-pay: min 1000 тонн/год"
      * "Минимальная закупка: 60% от годовой потребности"
      * "Фиксированный платёж: 5M RUB/месяц"
    - Если нет: "Не применимо"
    - Если неясно: "Не удалось определить"

    Шаг 3 — СРОК ДЕЙСТВИЯ

    Заполни поле "term_duration".

    Правила:
    - Конкретный срок: "5 лет", "10 лет", "до 2030 года"
    - Бессрочный: "Бессрочный"
    - Не указан: "Не указан"
    - Если неясно: "Не удалось определить"

    Шаг 4 — АВТОМАТИЧЕСКАЯ ПРОЛОНГАЦИЯ

    Заполни поле "has_auto_renewal".

    Значения:
    - "yes_auto" — автоматическое продление (evergreen).
    - "yes_with_notice" — продление если не направлено
      уведомление об отказе.
    - "no" — нет автопродления.
    - "unclear" — неясно.

    Шаг 5 — ВЫЖИВАЕМОСТЬ ПРИ СМЕНЕ КОНТРОЛЯ

    Заполни поле "survives_change_of_control".

    Значения:
    - "yes" — явно указано, что обязательства сохраняют силу при CoC.
    - "no" — при CoC контрагент может расторгнуть или
      обязательства прекращаются.
    - "unclear" — не урегулировано.

    Шаг 6 — ИНДЕКСАЦИЯ / ESCALATION

    Заполни поле "has_indexation".

    Значения:
    - "yes_uncapped" — индексация без cap.
    - "yes_capped" — индексация с cap.
    - "no" — нет.
    - "unclear" — неясно.

    Шаг 7 — PENALTIES ЗА НЕВЫПОЛНЕНИЕ

    Заполни поле "has_shortfall_penalties".

    Значения:
    - "yes" — есть: shortfall payment, deficiency payment,
      штрафы за недобор.
    - "no" — нет.
    - "unclear" — неясно.

    Шаг 8 — СТОИМОСТЬ ДОСРОЧНОГО ВЫХОДА

    Заполни поле "has_exit_or_termination_fee".

    Значения:
    - "yes_significant" — есть, значительная сумма.
    - "yes_reasonable" — есть, разумная сумма.
    - "no" — нет.
    - "unclear" — неясно.

    Шаг 9 — МЕХАНИЗМ ПЕРЕСМОТРА

    Заполни поле "has_renegotiation_mechanism".

    Значения:
    - "yes" — есть: periodic review, market reset,
      meet-or-release, hardship clause.
    - "no" — обязательства «забетонированы».
    - "unclear" — неясно.

    Шаг 10 — RED FLAGS

    Заполни поле "red_flags".

    Используй:
    - "NONE" — если существенных риск-факторов нет.
    - "UNCLEAR" — если данных недостаточно.
    - Коды через запятую:
      * LTO1 — крупные take-or-pay или минимальные объёмы
        при волатильном спросе / неопределённой загрузке.
      * LTO2 — долгосрочные обязательства (> 5 лет) без
        права досрочного выхода или с высоким exit fee.
      * LTO3 — обязательства явно переживают CoC,
        ограничивая гибкость покупателя.
      * LTO4 — auto-renewal без механизма отказа или
        с коротким notice period (< 60 дней).
      * LTO5 — высокие shortfall penalties за невыполнение
        минимальных объёмов.
      * LTO6 — indexation без cap в пользу контрагента.

    Шаг 11 — USER-FACING SUMMARY

    Заполни поле "sticky_obligations_display".

    Примеры:
    - "Take-or-pay: min 1000 тонн/год; срок 7 лет;
       переживает CoC; auto-renewal 30 дней"
    - "Минимальная закупка 60%; срок 5 лет; есть exit fee;
       нет механизма пересмотра"
    - "Долгосрочных минимальных обязательств не обнаружено"
    - "Не удалось определить"

    Правила:
    - Отрази максимум 3–4 ключевых факта через ";".
    - Если нет обязательств:
      "Долгосрочных минимальных обязательств не обнаружено"
    - Если всё unclear: "Не удалось определить"

    Шаг 12 — ОБОСНОВАНИЕ

    Заполни поле "reason".

    Правила:
    - 1–2 коротких предложения.
    - Укажи: вид обязательств, срок, CoC-выживаемость,
      auto-renewal, indexation, penalties, exit fee, почему
      выставлены red_flags.
    - Приведи короткую цитату в кавычках.
    - Если NONE — почему обязательства не создают риска.
    </instructions>

    <edge_cases>
    - Минимальные объёмы, срок < 3 лет, нет auto-renewal:
      * overall risk: MEDIUM или LOW
      * в reason: ограниченность срока снижает риск

    - CoC: контрагент может расторгнуть:
      * survives_change_of_control = "no"
      * LTO3 не выставляется

    - "Shall remain in full force regardless of CoC":
      * survives_change_of_control = "yes"
      * red_flags включает "LTO3"

    - Auto-renewal c 180-дневным notice:
      * has_auto_renewal = "yes_with_notice"
      * LTO4 не выставляется (notice разумный)

    - Auto-renewal с 30-дневным notice:
      * red_flags включает "LTO4"

    - Indexation CPI + 3% без cap:
      * has_indexation = "yes_uncapped"
      * red_flags включает "LTO6"

    - Meet-or-release clause:
      * has_renegotiation_mechanism = "yes"
      * в reason: снижает «липкость»

    - Только общие обязанности поставлять без минимумов:
      * has_long_term_minimum_commitments = "no"
      * red_flags = "NONE"
      * sticky_obligations_display =
        "Долгосрочных минимальных обязательств не обнаружено"

    - Нет релевантных фрагментов:
      * все поля = "unclear"
      * red_flags = "UNCLEAR"
      * sticky_obligations_display = "Не удалось определить"
    </edge_cases>

    <output_expectations>
    Все значения должны быть короткими, точными и пригодными
    для отображения пользователю в DD Grid.
    Не добавляй никаких полей, кроме указанных в схеме extraction.
    </output_expectations>

  fields:
    - name: "sticky_obligations_display"
      type: "string"
      description: "Долгосрочные обязательства: краткий вывод"

    - name: "has_long_term_minimum_commitments"
      type: "string"
      description: "Наличие долгосрочных минимальных обязательств"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "commitments_description"
      type: "string"
      description: "Описание обязательств"

    - name: "term_duration"
      type: "string"
      description: "Срок действия обязательств"

    - name: "has_auto_renewal"
      type: "string"
      description: "Автоматическая пролонгация"
      allowed_values:
        - "yes_auto"
        - "yes_with_notice"
        - "no"
        - "unclear"

    - name: "survives_change_of_control"
      type: "string"
      description: "Выживаемость при CoC"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "has_indexation"
      type: "string"
      description: "Индексация / escalation"
      allowed_values:
        - "yes_uncapped"
        - "yes_capped"
        - "no"
        - "unclear"

    - name: "has_shortfall_penalties"
      type: "string"
      description: "Penalties за невыполнение"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "has_exit_or_termination_fee"
      type: "string"
      description: "Стоимость досрочного выхода"
      allowed_values:
        - "yes_significant"
        - "yes_reasonable"
        - "no"
        - "unclear"

    - name: "has_renegotiation_mechanism"
      type: "string"
      description: "Механизм пересмотра условий"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "red_flags"
      type: "string"
      description: "Коды рисков"

    - name: "reason"
      type: "string"
      description: "Обоснование"

  store_payload: true


  