id: "security_and_encumbrances_general"
name: "Обеспечение и обременения (общий уровень)"
description: >
  Анализирует обеспечительные конструкции: залоги активов и прав, поручительства,
  корпоративные гарантии, negative pledge и другие обременения, связанные с договором.

doc_types: []

severity: "high"
severity_if_fail: "critical"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"

rules:
  keywords:
    - "залог"
    - "ипотека"
    - "pledge"
    - "mortgage"
    - "поручительство"
    - "guarantee"
    - "corporate guarantee"
    - "surety"
    - "обеспечительный платеж"
    - "security interest"
    - "обременение"
    - "encumbrance"
    - "negative pledge"
    - "запрет обременения"
    - "запрет отчуждения"
  keyword_mode: "any"
  regex_patterns: []
  clause_patterns: []

llm:
  prompt_template: |
    <role>
    Ты — юрист по финансированию и обеспечительным конструкциям.
    Твоя специализация — залоги, гарантии, поручительства и ограничения на обременение активов.
    </role>

    <context>
    Ниже приведены фрагменты договора, где могут быть положения о залоге, гарантиях
    и иных обременениях:

    {context}
    </context>

    <instructions>
    Определи:

    1) Какие виды обеспечения предусмотрены:
       - залог активов/прав (в т.ч. движимого/недвижимого имущества, прав требований),
       - ипотека,
       - поручительства,
       - корпоративные гарантии,
       - обеспечительные платежи или иные формы security interest.
       Сформулируй кратко в types_of_security_summary.

    2) Есть ли negative pledge или иные ограничения на обременение/отчуждение активов:
       - запреты создавать залоги/обременения в пользу третьих лиц без согласия кредитора,
       - запреты отчуждать активы без согласия или при соблюдении ковенантов.
       Отрази это в has_negative_pledge_or_asset_disposal_limitations.

    3) Насколько эти обеспечения и ограничения ограничивают гибкость Target:
       - возможность рефинансирования,
       - возможность использования активов в будущих сделках,
       - вовлечение Target в обеспечение обязательств третьих лиц.

    4) Есть ли признаки переобремененности активов:
       - множество залогов на одни и те же активы,
       - существенные гарантии/поручительства за третьих лиц,
       - другое, указывающее на высокую нагрузку на активы.
       Отрази это в appears_overencumbered.

    5) Оцени общий риск (overall_risk_level: low / medium / high) с точки зрения
       структуры обеспечения и обременений для Target.
    </instructions>

    <edge_cases>
    ВАЖНО — пограничные случаи:

    — Если по фрагментам видно только одно стандартное обеспечение (например, залог
      купленного актива по конкретному кредиту), без дополнительных ограничений:
      has_security_interests = "yes",
      appears_overencumbered = "no",
      overall_risk_level часто "medium" или "low" (обоснуй в reason).

    — Если присутствует negative pledge, распространяющийся на существенную часть активов,
      без разумных carve-out для операционной деятельности:
      has_negative_pledge_or_asset_disposal_limitations = "yes",
      это может повышать overall_risk_level до "high".

    — Если в доступных фрагментах нет прямых указаний на залоги/гарантии, но
      упоминаются обременения или ограничения по закону:
      has_security_interests = "unclear",
      types_of_security_summary опиши как неопределённые/общие.

    — Пустые или нерелевантные фрагменты:
      большинство полей = "unclear" или пустые строки,
      overall_risk_level = "medium",
      reason = "Недостаточно данных для анализа обеспечительных конструкций и обременений."
    </edge_cases>

    <examples>
    ПРИМЕР 1 — СУЩЕСТВЕННОЕ ОБЕСПЕЧЕНИЕ, ВЫСОКИЙ РИСК:

    Фрагмент: "В обеспечение обязательств Заёмщика предоставляется ипотека
    на основное производственное здание и залог оборудования. Заёмщик и его
    дочерние общества предоставляют корпоративные гарантии по всем обязательствам
    Группы перед Банком."

    {{
      "has_security_interests": "yes",
      "types_of_security_summary": "Ипотека на ключевой объект и залог оборудования, корпоративные гарантии дочерних обществ.",
      "has_negative_pledge_or_asset_disposal_limitations": "unclear",
      "appears_overencumbered": "yes",
      "overall_risk_level": "high",
      "reason": "Ключевые активы и дочерние общества вовлечены в обеспечение, что существенно ограничивает манёвренность Target и повышает риск при рефинансировании."
    }}

    ПРИМЕР 2 — NEGATIVE PLEDGE, СРЕДНИЙ/ВЫСОКИЙ РИСК:

    Фрагмент: "Заёмщик обязуется не создавать какие-либо залоги или иные
    обременения на свои активы без предварительного письменного согласия
    Кредитора (negative pledge)."

    {{
      "has_security_interests": "no",
      "types_of_security_summary": "Явного залога не установлено, но действует negative pledge.",
      "has_negative_pledge_or_asset_disposal_limitations": "yes",
      "appears_overencumbered": "unclear",
      "overall_risk_level": "medium",
      "reason": "Negative pledge ограничивает возможность использования активов для будущего финансирования, даже при отсутствии текущего залога."
    }}

    ПРИМЕР 3 — МИНИМАЛЬНОЕ ОБЕСПЕЧЕНИЕ (LOW/MEDIUM):

    Фрагмент: "Стороны соглашаются, что для обеспечения оплаты по настоящему
    Договору Покупатель предоставляет обеспечительный платеж в размере 10% цены
    договора, подлежащий возврату после окончательного расчёта."

    {{
      "has_security_interests": "yes",
      "types_of_security_summary": "Обеспечительный платеж 10% от цены договора.",
      "has_negative_pledge_or_asset_disposal_limitations": "no",
      "appears_overencumbered": "no",
      "overall_risk_level": "medium",
      "reason": "Имеется ограниченное обеспечение в виде обеспечительного платежа, без залогов ключевых активов и без negative pledge; риск умеренный."
    }}
    </examples>

    <output_format>
    Твой ответ ДОЛЖЕН быть строго валидным JSON-объектом со следующими
    полями:

    {{
      "has_security_interests": "one of: yes | no | unclear",
      "types_of_security_summary": "string — краткое описание видов обеспечения (залог, ипотека, гарантии и т.п.)",
      "has_negative_pledge_or_asset_disposal_limitations": "one of: yes | no | unclear",
      "appears_overencumbered": "one of: yes | no | unclear",
      "overall_risk_level": "one of: low | medium | high",
      "reason": "string — краткое объяснение на русском с указанием ключевых формулировок и оценки нагрузки на активы"
    }}

    Все перечисленные поля ДОЛЖНЫ присутствовать в JSON, даже если их значение равно null.
    </output_format>

    <constraints>
    ЖЁСТКИЕ ПРАВИЛА:
    1. Выведи ТОЛЬКО один JSON-объект. Никакого текста до или после.
    2. Не пиши "Вот JSON", "Here is the JSON" и т.п.
    3. Не используй Markdown, бэктики ``` или любые обёртки.
    4. Все строки — в двойных кавычках.
    5. Значения перечислимых полей — СТРОГО из указанных вариантов.
    6. Ключи — точно как указано, без добавления новых.
    7. Поле "reason" ДОЛЖНО содержать конкретные факты и формулировки
       из фрагментов, а не общие фразы вроде "есть риски".
    8. Начни ответ сразу с символа {{
    9. Если по какому‑то полю нет достаточно информации в тексте —
       верни для него 'unclear' или null (для reason пустое значение
       недопустимо — нужно объяснение). НЕ придумывай значения, не интерполируй.
    </constraints>
  prompt_file: null
  context_k: 5
  temperature: 0.0
  max_tokens: 640

evidence:
  required: false
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  context_k: 5
  max_chunks: 10
  boost_keywords:
    - "залог"
    - "mortgage"
    - "guarantee"
    - "negative pledge"
    - "обременение"
  rerank: true
  filters: {}

conditional: null

extraction:
  enabled: true
  mode: "hybrid"
  fields:
    - name: "has_security_interests"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
    - name: "types_of_security_summary"
      type: "string"
    - name: "has_negative_pledge_or_asset_disposal_limitations"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
    - name: "appears_overencumbered"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"
    - name: "overall_risk_level"
      type: "string"
      allowed_values:
        - "low"
        - "medium"
        - "high"
    - name: "reason"
      type: "string"
  store_payload: true

red_flags:
  items:
    - code: "FIN5"
      description: "Переобременённость активов залогами и гарантиями, ограничивающая манёвренность Target."
    - code: "FIN6"
      description: "Negative pledge мешает обычным операциям или дальнейшему рефинансированию."
      