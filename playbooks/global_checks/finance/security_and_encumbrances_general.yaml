id: "security_and_encumbrances_general"
name: "Обеспечение и обременения (общий уровень)"
description: >
  Анализирует обеспечительные конструкции: залоги активов и прав, поручительства,
  корпоративные гарантии, negative pledge и другие обременения, связанные с договором.

doc_types: []

severity: "high"
severity_if_fail: "critical"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"

rules:
  keywords:
    - "залог"
    - "ипотека"
    - "pledge"
    - "mortgage"
    - "поручительство"
    - "guarantee"
    - "corporate guarantee"
    - "surety"
    - "обеспечительный платеж"
    - "security interest"
    - "обременение"
    - "encumbrance"
    - "negative pledge"
    - "запрет обременения"
    - "запрет отчуждения"
  keyword_mode: "any"
  regex_patterns: []
  clause_patterns: []

llm:
  prompt_template: |
    <role>
    Ты — юрист по финансированию и обеспечительным конструкциям.
    Твоя специализация — залоги, гарантии, поручительства и ограничения на обременение активов.
    </role>

    <context>
    Ниже приведены фрагменты договора, где могут быть положения о залоге, гарантиях
    и иных обременениях:

    {context}
    </context>

    <instructions>
    Проведи анализ по шагам. Каждый шаг логически связан с одним или
    несколькими полями итоговой оценки.

    Шаг 1 — НАЛИЧИЕ И ВИДЫ ОБЕСПЕЧЕНИЯ
    (используется для заполнения полей
     "has_security_interests" и "types_of_security_summary"):
    - Определи, какие виды обеспечения предусмотрены договором:
      * залог активов или прав требований (движимое/недвижимое имущество, права по договорам);
      * ипотека;
      * поручительства;
      * корпоративные гарантии;
      * обеспечительные платежи или иные формы security interest.
    - Сделай вывод, есть ли обеспечительные конструкции, и кратко опиши
      их набор и существенность в "types_of_security_summary".

    Шаг 2 — NEGATIVE PLEDGE И ОГРАНИЧЕНИЯ НА ОБРЕМЕНЕНИЕ/ОТЧУЖДЕНИЕ
    (используется для заполнения поля "has_negative_pledge_or_asset_disposal_limitations"):
    - Определи, есть ли в договоре:
      * запреты создавать залоги или иные обременения на активы в пользу третьих лиц
        без согласия кредитора (negative pledge);
      * ограничения или запреты на отчуждение активов без согласия или при
        соблюдении определённых условий.
    - Отрази наличие или отсутствие таких ограничений и их общий характер.

    Шаг 3 — ВЛИЯНИЕ НА ГИБКОСТЬ TARGET
    (учитывается при формировании "appears_overencumbered" и "overall_risk_level"):
    - Оцени, насколько текущие обеспечения и ограничения:
      * сужают возможности Target по рефинансированию задолженности;
      * ограничивают использование активов в будущих сделках (в том числе M&A);
      * вовлекают Target в обеспечение обязательств третьих лиц (гарантии, поручительства).
    - Отметь ситуации, когда обременения затрагивают значимую часть активов
      или ключевые компании группы.

    Шаг 4 — ПРИЗНАКИ ПЕРЕОБРЕМЕНЁННОСТИ АКТИВОВ
    (используется для заполнения поля "appears_overencumbered"):
    - Проверь, указывают ли фрагменты на:
      * множественные залоги на одни и те же активы;
      * значительные по объёму гарантии/поручительства за третьих лиц;
      * иные признаки чрезмерной нагрузки на активы.
    - Сделай вывод, выглядят ли активы переобременёнными (yes / no / unclear),
      исходя из масштаба и характера обеспечения.

    Шаг 5 — ОБЩИЙ УРОВЕНЬ РИСКА
    (используется для формирования "overall_risk_level" и "reason"):
    - Оцени общий риск для Target с точки зрения структуры обеспечения и обременений:
      * насколько обеспечение затрагивает ключевые активы или всю группу;
      * мешают ли ограничения нормальному финансированию и реструктуризации;
      * усилена ли ответственность Target за обязательства третьих лиц.
    - Сформулируй итоговый уровень риска как low / medium / high.
    - В "reason" кратко обоснуй вывод с опорой на конкретные формулировки
      (желательно с короткими цитатами в кавычках), пояснив, чем именно
      обусловлен выбранный уровень риска.
    </instructions>

    <edge_cases>
    Обрабатывай пограничные ситуации так:

    - Виден только один стандартный вид обеспечения (например, залог
      приобретаемого актива по конкретному кредиту) без дополнительных
      ограничений по другим активам:
      фиксируй наличие обеспечения, но отмечай, что его влияние ограничено
      конкретной сделкой.

    - Присутствует negative pledge на существенную часть активов без
      разумных carve-out для операционной деятельности:
      учитывай это как фактор, серьёзно ограничивающий будущие залоги и
      рефинансирование.

    - В доступных фрагментах нет прямых указаний на залоги или гарантии,
      но упоминаются обременения или ограничения по закону:
      отражай неопределённость и не делай выводов о конкретных видах
      обеспечения без прямых формулировок.

    - Пустые или явно нерелевантные фрагменты:
      укажи, что данных недостаточно для анализа обеспечительных конструкций
      и обременений, и поясни, как это влияет на неопределённость и риск.
    </edge_cases>

    <output_expectations>
    На основе твоего анализа отдельный механизм извлечения сформирует
    структурированные поля по заранее заданной схеме. Твоя задача —
    давать чёткие юридические выводы и указывать конкретные формулировки
    из текста, на которых они основаны.
    </output_expectations>
  prompt_file: null
  context_k: 5
  temperature: 0.0
  max_tokens: 640

evidence:
  required: false
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  context_k: 5
  max_chunks: 10
  boost_keywords:
    - "залог"
    - "mortgage"
    - "guarantee"
    - "negative pledge"
    - "обременение"
  rerank: true
  filters: {}

conditional: null

extraction:
  enabled: true
  mode: "hybrid"
  fields:
    - name: "has_security_interests"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "types_of_security_summary"
      type: "string"

    - name: "has_negative_pledge_or_asset_disposal_limitations"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "appears_overencumbered"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "overall_risk_level"
      type: "string"
      allowed_values:
        - "low"
        - "medium"
        - "high"

    - name: "reason"
      type: "string"

  store_payload: true

red_flags:
  items:
    - code: "FIN5"
      description: "Переобременённость активов залогами и гарантиями, ограничивающая манёвренность Target."
    - code: "FIN6"
      description: "Negative pledge мешает обычным операциям или дальнейшему рефинансированию."
