      "security_types_summary": {"value": "залог акций; корпоративная гарантия", "confidence": 0.92, "location": {"clause_ref": "п. 6.1", "page": 9, "quote": "В обеспечение исполнения обязательств Заёмщика Залогодатель предоставляет в залог Кредитору акции ООО «...»; Материнская компания предоставляет корпоративную гарантию"}},
      "security_priority": {"value": "first_lien", "confidence": 0.90, "location": {"clause_ref": "п. 6.3", "page": 9, "quote": "Залог по настоящему Договору является залогом первой очереди"}},
