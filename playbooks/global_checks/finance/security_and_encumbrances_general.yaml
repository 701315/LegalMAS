id: "security_and_encumbrances_general"
name: "Обеспечение и обременения (общий уровень)"
description: >
  Анализирует обеспечительные конструкции и обременения в договоре:
  залоги активов и прав (pledge, mortgage), поручительства и
  корпоративные гарантии, negative pledge и ограничения на
  обременение / отчуждение активов, приоритет залогов, обеспечение
  за третьих лиц (upstream / cross-stream), условия снятия
  обременений.

  Формирует краткий user-facing вывод и оценивает влияние на
  финансовую гибкость и маневренность Target.

  Финансовые ковенанты (leverage ratio, DSCR, ограничения
  на дивиденды / новый долг) анализируются чеком
  financial_covenants. Обеспечительные платежи в контексте
  платежных условий анализируются чеком payment_terms_and_structures.

doc_types: []

severity: "high"
severity_if_fail: "critical"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"
ui_mode: "field_extraction"

rules:
  keyword_mode: any

  keywords:
    high:
      # Залог — конкретные маркеры
      - "(?i)\\bpledge\\b"
      - "(?i)\\bзалог[аеуом]?\\b"
      - "(?i)\\bmortgage\\b"
      - "(?i)\\bипотек[аиу]?\\b"
      - "(?i)security\\s+interest"
      - "(?i)обеспечительн[а-я]+\\s+интерес"
      - "(?i)charge\\s+(over|on)"
      - "(?i)lien"
      - "(?i)залог\\s+(прав|активов|имущества|акций|долей)"
      - "(?i)pledge\\s+of\\s+(assets?|rights?|shares?|interests?)"

      # Поручительства и гарантии
      - "(?i)\\bguarantee\\b"
      - "(?i)\\bгарант[ия][яиюей]?\\b"
      - "(?i)corporate\\s+guarantee"
      - "(?i)корпоративн[а-я]+\\s+гаранти"
      - "(?i)\\bsurety\\b"
      - "(?i)\\bпоручительств[оау]?\\b"
      - "(?i)parent\\s+(company\\s+)?guarantee"
      - "(?i)гаранти[яи]\\s+материнской\\s+компании"

      # Negative pledge
      - "(?i)negative\\s+pledge"
      - "(?i)запрет\\s+(на\\s+)?(обременени[ея]|залог|создани[ея]\\s+залог)"
      - "(?i)restriction\\s+on\\s+(creating\\s+)?(liens?|encumbrances?|charges?)"

      # Ограничения на отчуждение активов
      - "(?i)restriction\\s+on\\s+(asset\\s+)?(sale|disposal|disposition|alienation)"
      - "(?i)запрет\\s+(на\\s+)?отчуждени[ея][\\s\\S]{0,20}(актив|имущест)"
      - "(?i)limitation\\s+on\\s+asset\\s+(sales?|dispositions?)"
      - "(?i)ограничени[яе]\\s+на\\s+распоряжени[ея]\\s+(существенн[а-я]+\\s+)?активам[ьи]"

      # Upstream / cross-stream
      - "(?i)upstream\\s+guarantee"
      - "(?i)cross[-\\s]?stream\\s+guarantee"
      - "(?i)обеспечени[ея]\\s+за\\s+(обязательств[аы]\\s+)?третьих\\s+лиц"
      - "(?i)guarantee\\s+of\\s+(the\\s+)?obligations?\\s+of\\s+(a\\s+)?third"

    medium:
      # Обременение — общие
      - "(?i)\\bencumbrance\\b"
      - "(?i)\\bобременени[ея]\\b"
      - "(?i)free\\s+(and\\s+clear\\s+)?of\\s+(all\\s+)?(liens?|encumbrances?)"
      - "(?i)свободен\\s+от\\s+(обременений|залогов)"

      # Приоритет залогов
      - "(?i)first\\s+(priority\\s+)?lien"
      - "(?i)залог\\s+первой\\s+очереди"
      - "(?i)second\\s+lien"
      - "(?i)senior\\s+(secured|lien)"
      - "(?i)junior\\s+lien"
      - "(?i)subordinated\\s+(lien|pledge)"
      - "(?i)pari\\s+passu"

      # Permitted liens / carve-out
      - "(?i)permitted\\s+liens?"
      - "(?i)разрешённ[а-я]+\\s+обременени"
      - "(?i)permitted\\s+encumbrances?"
      - "(?i)исключени[яе]\\s+из\\s+запрета\\s+(на\\s+)?залог"

      # Release conditions
      - "(?i)release\\s+of\\s+(the\\s+)?(pledge|security|lien|guarantee)"
      - "(?i)снятие\\s+(залога|обременения|обеспечения)"
      - "(?i)discharge\\s+of\\s+(the\\s+)?(security|guarantee)"
      - "(?i)прекращени[ея]\\s+(залога|поручительства|гарантии)"

      # Intercreditor
      - "(?i)intercreditor\\s+agreement"
      - "(?i)межкредиторск[а-я]+\\s+соглашени"

    low:
      - "(?i)negative\\s+pledge"
      - "(?i)pledge\\s+of\\s+shares"
      - "(?i)залог\\s+акций"
      - "(?i)залог\\s+долей"
      - "(?i)upstream\\s+guarantee"
      - "(?i)cross[-\\s]?stream"
      - "(?i)first\\s+(priority\\s+)?lien"
      - "(?i)second\\s+lien"
      - "(?i)permitted\\s+liens?"
      - "(?i)release\\s+of\\s+(pledge|security)"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 700

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  context_k: 5
  max_chunks: 10
  boost_keywords:
    - "залог"
    - "pledge"
    - "mortgage"
    - "ипотека"
    - "security interest"
    - "поручительство"
    - "guarantee"
    - "corporate guarantee"
    - "корпоративная гарантия"
    - "surety"
    - "negative pledge"
    - "запрет обременения"
    - "ограничения на отчуждение активов"
    - "restriction on asset disposal"
    - "обременение"
    - "encumbrance"
    - "first priority lien"
    - "second lien"
    - "permitted liens"
    - "разрешённые обременения"
    - "upstream guarantee"
    - "cross-stream guarantee"
    - "обеспечение за третьих лиц"
    - "release of pledge"
    - "снятие залога"
    - "intercreditor agreement"
  rerank: true
  filters: {}

conditional: null

enrichment_hints:
  preferred_segment_types:
    - "contract"
    - "amendment"
    - "annex"
  excluded_segment_types:
    - "technical_specification"
    - "price_list"
    - "invoice"
    - "act"
  preferred_clause_functions:
    - "liability"
    - "assignment"
    - "termination"
  confidence_bonus_on_match: 0.10
  confidence_penalty_on_excluded_segment: 0.15

extraction:
  enabled: true
  mode: "hybrid"
  llm_max_tokens: 500
  llm_prompt_extraction: |
    <role>
    Ты — юрист по финансированию и обеспечительным конструкциям.
    Твоя задача — точно извлечь из текста залоги, гарантии,
    поручительства, negative pledge, ограничения на отчуждение
    активов, upstream/cross-stream обеспечение, приоритет залогов
    и условия снятия обременений.

    Не анализируй финансовые ковенанты (leverage ratio, DSCR,
    ограничения на дивиденды / новый долг) — это задача чека
    financial_covenants.
    </role>

    <context>
    Ниже приведены релевантные фрагменты договора:

    {context}
    </context>

    <task>
    Заполни только следующие поля:
    - security_display
    - has_security_interests
    - security_types_summary
    - security_priority
    - has_third_party_security
    - has_negative_pledge
    - has_asset_disposal_restrictions
    - has_permitted_liens
    - has_release_conditions
    - appears_overencumbered
    - red_flags
    - reason

    Важно:
    - не анализируй финансовые ковенанты;
    - пиши user-facing значения коротко и по-русски.
    </task>

    <instructions>
    Шаг 1 — ВИДЫ ОБЕСПЕЧЕНИЯ

    Заполни поле "has_security_interests".

    Значения:
    - "yes" — есть обеспечение.
    - "no" — нет.
    - "unclear" — неясно.

    Шаг 2 — ТИПЫ ОБЕСПЕЧЕНИЯ

    Заполни поле "security_types_summary".

    Правила:
    - Кратко перечисли типы через ";":
      * "залог движимого имущества; корпоративная гарантия"
      * "ипотека; залог акций; поручительство материнской компании"
    - Если нет: "Не применимо"
    - Если неясно: "Не удалось определить"

    Шаг 3 — ПРИОРИТЕТ ЗАЛОГОВ

    Заполни поле "security_priority".

    Значения:
    - "first_lien" — первоочередной залог.
    - "second_lien" — залог второй очереди.
    - "pari_passu" — равный приоритет.
    - "mixed" — разный приоритет на разные активы.
    - "not_specified" — приоритет не указан.
    - "not_applicable" — залогов нет.
    - "unclear" — неясно.

    Шаг 4 — ОБЕСПЕЧЕНИЕ ЗА ТРЕТЬИХ ЛИЦ

    Заполни поле "has_third_party_security".

    Значения:
    - "yes" — Target предоставляет обеспечение за третьих лиц:
      upstream guarantee (дочерняя → материнская),
      cross-stream, гарантии/поручительства за аффилиатов.
    - "no" — нет.
    - "unclear" — неясно.

    Шаг 5 — NEGATIVE PLEDGE

    Заполни поле "has_negative_pledge".

    Значения:
    - "yes" — есть запрет создавать залоги / обременения
      в пользу третьих лиц без согласия.
    - "no" — нет.
    - "unclear" — неясно.

    Шаг 6 — ОГРАНИЧЕНИЯ НА ОТЧУЖДЕНИЕ АКТИВОВ

    Заполни поле "has_asset_disposal_restrictions".

    Значения:
    - "yes" — есть ограничения на продажу / отчуждение
      существенных активов.
    - "no" — нет.
    - "unclear" — неясно.

    Шаг 7 — PERMITTED LIENS / CARVE-OUT

    Заполни поле "has_permitted_liens".

    Значения:
    - "yes" — есть исключения из negative pledge:
      permitted liens, baskets, carve-out.
    - "no" — нет исключений, запрет абсолютный.
    - "not_applicable" — negative pledge отсутствует.
    - "unclear" — неясно.

    Шаг 8 — УСЛОВИЯ СНЯТИЯ ОБРЕМЕНЕНИЯ

    Заполни поле "has_release_conditions".

    Значения:
    - "yes" — прописаны: автоматическое release при погашении,
      процедура снятия залога, сроки.
    - "no" — не прописаны.
    - "not_applicable" — обеспечения нет.
    - "unclear" — неясно.

    Шаг 9 — ПЕРЕОБРЕМЕНЁННОСТЬ АКТИВОВ

    Заполни поле "appears_overencumbered".

    Значения:
    - "yes" — признаки переобременённости:
      множественные залоги, значительные гарантии за третьих лиц,
      залоги покрывают большую часть активов,
      negative pledge без permitted liens блокирует финансирование.
    - "no" — нет.
    - "unclear" — недостаточно данных.

    Шаг 10 — RED FLAGS

    Заполни поле "red_flags".

    Используй:
    - "NONE" — если существенных риск-факторов нет.
    - "UNCLEAR" — если данных недостаточно.
    - Коды через запятую:
      * SEC1 — переобременённость: залоги на существенной
        части активов, ограничена маневренность.
      * SEC2 — negative pledge без разумных permitted liens —
        блокирует рефинансирование.
      * SEC3 — Target предоставляет upstream / cross-stream
        обеспечение за обязательства третьих лиц.
      * SEC4 — нет чётких условий снятия обременения
        после погашения обязательств.
      * SEC5 — залог ключевых операционных активов или IP,
        потеря которых парализует бизнес.
      * SEC6 — множественные залоги на одни активы
        (second lien / subordinated pledge).

    Шаг 11 — USER-FACING SUMMARY

    Заполни поле "security_display".

    Примеры:
    - "Залог акций + корпоративная гарантия; first lien;
       negative pledge с permitted liens"
    - "Ипотека + upstream guarantee; second lien;
       release conditions не прописаны"
    - "Negative pledge без исключений; ограничения на активы"
    - "Обеспечения не обнаружено"
    - "Не удалось определить обеспечительные конструкции"

    Правила:
    - Отрази максимум 3–4 ключевых факта через ";".
    - Если нет обеспечения:
      "Обеспечения не обнаружено"
    - Если всё unclear:
      "Не удалось определить обеспечительные конструкции"

    Шаг 12 — ОБОСНОВАНИЕ

    Заполни поле "reason".

    Правила:
    - 1–2 коротких предложения.
    - Укажи: виды обеспечения, приоритет, negative pledge,
      upstream/cross-stream, release conditions, почему
      выставлены red_flags.
    - Приведи короткую цитату в кавычках.
    - Если NONE — почему обременения не создают риска.
    </instructions>

    <edge_cases>
    - Стандартный залог одного актива по кредиту,
      release conditions прописаны:
      * appears_overencumbered = "no"
      * red_flags = "NONE"

    - Negative pledge без permitted liens:
      * has_negative_pledge = "yes"
      * has_permitted_liens = "no"
      * red_flags включает "SEC2"

    - Upstream guarantee (дочерняя за материнскую):
      * has_third_party_security = "yes"
      * red_flags включает "SEC3"

    - First lien + second lien на одни активы:
      * security_priority = "mixed" или "second_lien"
      * appears_overencumbered = "yes"
      * red_flags включает "SEC6"

    - Залог IP / ключевого оборудования:
      * red_flags включает "SEC5"

    - Release conditions не прописаны:
      * has_release_conditions = "no"
      * red_flags включает "SEC4"

    - Нет залогов/гарантий:
      * has_security_interests = "no"
      * security_priority = "not_applicable"
      * red_flags = "NONE"
      * security_display = "Обеспечения не обнаружено"

    - Нет релевантных фрагментов:
      * все поля = "unclear"
      * red_flags = "UNCLEAR"
      * security_display =
        "Не удалось определить обеспечительные конструкции"
    </edge_cases>

    <output_expectations>
    Все значения должны быть короткими, точными и пригодными
    для отображения пользователю в DD Grid.
    Не добавляй никаких полей, кроме указанных в схеме extraction.
    </output_expectations>

  fields:
    - name: "security_display"
      type: "string"
      description: "Обеспечение и обременения: краткий вывод"

    - name: "has_security_interests"
      type: "string"
      description: "Наличие обеспечения"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "security_types_summary"
      type: "string"
      description: "Виды обеспечения"

    - name: "security_priority"
      type: "string"
      description: "Приоритет залогов"
      allowed_values:
        - "first_lien"
        - "second_lien"
        - "pari_passu"
        - "mixed"
        - "not_specified"
        - "not_applicable"
        - "unclear"

    - name: "has_third_party_security"
      type: "string"
      description: "Обеспечение за третьих лиц"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "has_negative_pledge"
      type: "string"
      description: "Negative pledge"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "has_asset_disposal_restrictions"
      type: "string"
      description: "Ограничения на отчуждение активов"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "has_permitted_liens"
      type: "string"
      description: "Permitted liens / carve-out"
      allowed_values:
        - "yes"
        - "no"
        - "not_applicable"
        - "unclear"

    - name: "has_release_conditions"
      type: "string"
      description: "Условия снятия обременения"
      allowed_values:
        - "yes"
        - "no"
        - "not_applicable"
        - "unclear"

    - name: "appears_overencumbered"
      type: "string"
      description: "Признаки переобременённости"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "red_flags"
      type: "string"
      description: "Коды рисков"

    - name: "reason"
      type: "string"
      description: "Обоснование"

  store_payload: true

  