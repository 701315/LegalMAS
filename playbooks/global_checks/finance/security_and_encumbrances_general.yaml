id: "security_and_encumbrances_general"
name: "Обеспечение и обременения (общий уровень)"
group: "Financial"
description: >
  Анализирует обеспечительные конструкции и обременения в договоре:
  залоги активов и прав (pledge, mortgage), поручительства и
  корпоративные гарантии, negative pledge и ограничения на
  обременение / отчуждение активов, приоритет залогов, обеспечение
  за третьих лиц (upstream / cross-stream), условия снятия
  обременений.

  Формирует краткий user-facing вывод и оценивает влияние на
  финансовую гибкость и маневренность Target.

  Финансовые ковенанты (leverage ratio, DSCR, ограничения
  на дивиденды / новый долг) анализируются чеком
  financial_covenants. Обеспечительные платежи в контексте
  платежных условий анализируются чеком payment_terms_and_structures.

doc_types: []

severity: "high"
severity_if_fail: "critical"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"
ui_mode: "field_extraction"

rules:
  keyword_mode: any

  keywords:
    high:
      # Залог — конкретные маркеры
      - "(?i)\\bpledge\\b"
      - "(?i)\\bзалог[аеуом]?\\b"
      - "(?i)\\bmortgage\\b"
      - "(?i)\\bипотек[аиу]?\\b"
      - "(?i)security\\s+interest"
      - "(?i)обеспечительн[а-я]+\\s+интерес"
      - "(?i)charge\\s+(over|on)"
      - "(?i)lien"
      - "(?i)залог\\s+(прав|активов|имущества|акций|долей)"
      - "(?i)pledge\\s+of\\s+(assets?|rights?|shares?|interests?)"

      # Поручительства и гарантии
      - "(?i)\\bguarantee\\b"
      - "(?i)\\bгарант[ия][яиюей]?\\b"
      - "(?i)corporate\\s+guarantee"
      - "(?i)корпоративн[а-я]+\\s+гаранти"
      - "(?i)\\bsurety\\b"
      - "(?i)\\bпоручительств[оау]?\\b"
      - "(?i)parent\\s+(company\\s+)?guarantee"
      - "(?i)гаранти[яи]\\s+материнской\\s+компании"

      # Negative pledge
      - "(?i)negative\\s+pledge"
      - "(?i)запрет\\s+(на\\s+)?(обременени[ея]|залог|создани[ея]\\s+залог)"
      - "(?i)restriction\\s+on\\s+(creating\\s+)?(liens?|encumbrances?|charges?)"

      # Ограничения на отчуждение активов
      - "(?i)restriction\\s+on\\s+(asset\\s+)?(sale|disposal|disposition|alienation)"
      - "(?i)запрет\\s+(на\\s+)?отчуждени[ея][\\s\\S]{0,20}(актив|имущест)"
      - "(?i)limitation\\s+on\\s+asset\\s+(sales?|dispositions?)"
      - "(?i)ограничени[яе]\\s+на\\s+распоряжени[ея]\\s+(существенн[а-я]+\\s+)?активам[ьи]"

      # Upstream / cross-stream
      - "(?i)upstream\\s+guarantee"
      - "(?i)cross[-\\s]?stream\\s+guarantee"
      - "(?i)обеспечени[ея]\\s+за\\s+(обязательств[аы]\\s+)?третьих\\s+лиц"
      - "(?i)guarantee\\s+of\\s+(the\\s+)?obligations?\\s+of\\s+(a\\s+)?third"

    medium:
      # Обременение — общие
      - "(?i)\\bencumbrance\\b"
      - "(?i)\\bобременени[ея]\\b"
      - "(?i)free\\s+(and\\s+clear\\s+)?of\\s+(all\\s+)?(liens?|encumbrances?)"
      - "(?i)свободен\\s+от\\s+(обременений|залогов)"

      # Приоритет залогов
      - "(?i)first\\s+(priority\\s+)?lien"
      - "(?i)залог\\s+первой\\s+очереди"
      - "(?i)second\\s+lien"
      - "(?i)senior\\s+(secured|lien)"
      - "(?i)junior\\s+lien"
      - "(?i)subordinated\\s+(lien|pledge)"
      - "(?i)pari\\s+passu"

      # Permitted liens / carve-out
      - "(?i)permitted\\s+liens?"
      - "(?i)разрешённ[а-я]+\\s+обременени"
      - "(?i)permitted\\s+encumbrances?"
      - "(?i)исключени[яе]\\s+из\\s+запрета\\s+(на\\s+)?залог"

      # Release conditions
      - "(?i)release\\s+of\\s+(the\\s+)?(pledge|security|lien|guarantee)"
      - "(?i)снятие\\s+(залога|обременения|обеспечения)"
      - "(?i)discharge\\s+of\\s+(the\\s+)?(security|guarantee)"
      - "(?i)прекращени[ея]\\s+(залога|поручительства|гарантии)"

      # Intercreditor
      - "(?i)intercreditor\\s+agreement"
      - "(?i)межкредиторск[а-я]+\\s+соглашени"

    low:
      - "(?i)negative\\s+pledge"
      - "(?i)pledge\\s+of\\s+shares"
      - "(?i)залог\\s+акций"
      - "(?i)залог\\s+долей"
      - "(?i)upstream\\s+guarantee"
      - "(?i)cross[-\\s]?stream"
      - "(?i)first\\s+(priority\\s+)?lien"
      - "(?i)second\\s+lien"
      - "(?i)permitted\\s+liens?"
      - "(?i)release\\s+of\\s+(pledge|security)"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 700

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  retrieval_profile: "security_check"
  context_k: 6
  max_chunks: 12

  retrieval_query: >
    залог pledge mortgage ипотека security interest поручительство
    corporate guarantee negative pledge запрет обременения
    restriction on asset disposal permitted liens release of pledge

  boost_keywords:
    - "залог"
    - "pledge"
    - "mortgage"
    - "ипотека"
    - "security interest"
    - "поручительство"
    - "guarantee"
    - "corporate guarantee"
    - "корпоративная гарантия"
    - "surety"
    - "negative pledge"
    - "запрет обременения"
    - "ограничения на отчуждение активов"
    - "restriction on asset disposal"
    - "обременение"
    - "encumbrance"
    - "first priority lien"
    - "second lien"
    - "permitted liens"
    - "разрешённые обременения"
    - "upstream guarantee"
    - "cross-stream guarantee"
    - "обеспечение за третьих лиц"
    - "release of pledge"
    - "снятие залога"
    - "intercreditor agreement"

  negative_keywords:
    - "financial covenant"
    - "финансовые ковенанты"
    - "leverage ratio"
    - "означает"
    - "в целях настоящего"
    - "споры"
    - "подсудность"
    - "применимое право"
    - "персональные данные"
    - "конфиденциальность"

  preferred_unit_types:
    - "obligation"
    - "liability_provision"
    - "general_provision"

  excluded_unit_types:
    - "definition"
    - "structural_anchor"
    - "technical_fragment"
    - "appendix_reference"

  preferred_clause_functions:
    - "obligations"
    - "limitations"
    - "remedies"
    - "representations"

  position_bias:
    preferred_range: [0.10, 0.90]
    boost: 0.20
    scope: "segment"

  rerank: true
  filters: {}

conditional: null

enrichment_hints:
  preferred_segment_types:
    - "contract"
    - "amendment"
    - "annex"
  excluded_segment_types:
    - "technical_specification"
    - "price_list"
    - "invoice"
    - "act"
  confidence_bonus_on_match: 0.10
  confidence_penalty_on_excluded_segment: 0.15

extraction:
  enabled: true
  mode: "hybrid"
  llm_max_tokens: 1600

  # Presence gate: security_status агрегирует наличие любого
  # обеспечения / обременения / ограничения. present -> pass,
  # missing -> missing_required_clause.
  # Контракт: present + missing + unclear = allowed_values.
  presence_signal:
    field: "security_status"
    present_values: ["present"]
    missing_values: ["missing"]
    unclear_values: ["unclear"]

  llm_prompt_extraction: |
    <role>
    Ты — юрист по обеспечительным конструкциям.
    Твоя задача — точно извлечь из текста залоги, гарантии,
    поручительства, negative pledge, ограничения на отчуждение
    активов, upstream/cross-stream обеспечение, приоритет
    залогов и условия снятия обременений.

    КРИТИЧЕСКИ ВАЖНО:
    - Извлекай ТОЛЬКО то, что прямо написано в тексте.
    - НЕ делай выводов "по умолчанию" из общих норм права.
    - НЕ додумывай виды обеспечения, которых нет в тексте.
    - Если тема обеспечения / обременений в договоре вообще не
      раскрыта — для security_status ставь "missing",
      для has_* — "no", для security_priority / has_permitted_liens /
      has_release_conditions — "not_applicable".
    - Если информация неоднозначна — используй "unclear".

    Не анализируй финансовые ковенанты (leverage ratio, DSCR,
    ограничения на дивиденды / новый долг) —
    это задача чека financial_covenants.
    </role>

    <context_rules>
    - Некоторые фрагменты могут быть нерелевантны — игнорируй их.
    - Если среди фрагментов есть противоречия — укажи "unclear"
      и объясни в reason.
    - Не используй информацию из definitions, преамбулы или приложений,
      если они не содержат substantive условий по теме check.
    - Если ни один фрагмент не содержит информации по теме —
      security_status = "missing",
      остальные поля — согласно Шагу 0, location = null у всех полей.
      Не использовать "unclear" при полном отсутствии релевантных
      фрагментов.
    </context_rules>

    <context>
    Ниже приведены релевантные фрагменты договора:

    {context}
    </context>

    <task>
    Заполни только следующие поля:
    - security_display
    - security_status
    - has_security_interests
    - security_types_summary
    - security_priority
    - has_third_party_security
    - has_negative_pledge
    - has_asset_disposal_restrictions
    - has_permitted_liens
    - has_release_conditions
    - appears_overencumbered
    - reason

    Общие правила:
    - используй только то, что прямо следует из текста;
    - пиши коротко и по-русски.
    </task>

    <location_instructions>
    Для каждого поля по возможности укажи location в формате:
    {"clause_ref": "п. 6.1", "page": 9, "quote": "дословная фраза из договора"}

    Правила:
    - clause_ref — короткая ссылка на пункт / раздел / статью именно в том виде,
      как она написана в договоре;
    - page — целое число страницы;
    - quote — дословная фраза из текста договора (НЕ пересказ, НЕ парафраз),
      которая является источником значения поля. Копируй её посимвольно,
      сохраняя формулировку и порядок слов. Оптимальная длина: 30–300 символов.
      Примеры хорошего quote:
      * для has_security_interests (yes): "В обеспечение исполнения обязательств Заёмщика Залогодатель предоставляет в залог Кредитору акции ООО «...»";
      * для security_priority (first_lien): "Залог по настоящему Договору является залогом первой очереди";
      * для has_third_party_security (yes): "Материнская компания Заёмщика предоставляет безотзывную корпоративную гарантию в отношении обязательств Заёмщика";
      * для has_negative_pledge (yes): "Заёмщик обязуется не создавать и не допускать создания каких-либо обременений на своё имущество без предварительного письменного согласия Кредитора";
      * для has_asset_disposal_restrictions (yes): "Заёмщик не вправе отчуждать существенные активы без предварительного письменного согласия Кредитора";
      * для has_permitted_liens (yes): "Запрет не применяется к залогам, возникающим в силу закона, и к залогам в пользу банков-кредиторов в рамках разрешённой задолженности";
      * для has_release_conditions (yes): "Обеспечение прекращается в течение 5 рабочих дней с даты полного погашения обязательств Заёмщика".
    - не выдумывай location или quote;
    - если точную ссылку или дословную фразу определить нельзя,
      верни location = null;
    - для security_display, security_status, appears_overencumbered и reason
      location всегда null (appears_overencumbered — синтезированное
      суждение, не имеет прямого источника в тексте);
    - для security_types_summary и 6 signal-полей (has_*, security_priority)
      возвращай location с quote только когда значение подтверждается
      конкретным условием договора:
      * для "yes" — quote с описанием условия;
      * для "no" — quote только если договор прямо исключает или
        не предусматривает соответствующее условие;
        location = null, если условие просто не раскрыто;
      * для "not_applicable" / "unclear" — location = null;
    - если security_status = "missing" — для всех полей location = null.
    </location_instructions>

    <instructions>
    Шаг 0 — НАЛИЧИЕ ОБЕСПЕЧЕНИЯ / ОБРЕМЕНЕНИЙ

    Заполни "security_status".

    Значения:
    - "present" — договор содержит любое: обеспечение (залоги,
      гарантии, поручительства), negative pledge, ограничения
      на отчуждение активов, permitted liens.
    - "missing" — ничего из перечисленного.
    - "unclear" — нельзя определить.

    Правило агрегации:
    - Если любое из полей has_security_interests, has_negative_pledge,
      has_asset_disposal_restrictions = "yes" → security_status = "present".
    - Если security_priority ∈ {first_lien, second_lien, pari_passu, mixed} →
      security_status = "present".
    - Если все содержательные поля = "no" / "not_applicable" → "missing".
    - Если все = "unclear" → "unclear".
    - Дополнительно: если has_security_interests, has_negative_pledge,
      has_asset_disposal_restrictions = "no", но для этого поля
      заполнен location с прямой цитатой об отсутствии / неприменении
      условия, то security_status = "present".

    Если security_status = "missing":
    - has_security_interests = "no"
    - security_types_summary = "Не применимо"
    - security_priority = "not_applicable"
    - has_third_party_security = "no"
    - has_negative_pledge = "no"
    - has_asset_disposal_restrictions = "no"
    - has_permitted_liens = "not_applicable"
    - has_release_conditions = "not_applicable"
    - appears_overencumbered = "no"
    - security_display = "Обеспечения не обнаружено"
    - reason = "Обеспечительные конструкции и обременения не обнаружены в представленных фрагментах."
    - для всех полей location = null
    - не выполняй Шаги 1–9; переходи к Шагу 10.

    Если security_status = "unclear":
    - has_security_interests = "unclear"
    - security_types_summary = "Не удалось определить"
    - security_priority = "unclear"
    - has_third_party_security = "unclear"
    - has_negative_pledge = "unclear"
    - has_asset_disposal_restrictions = "unclear"
    - has_permitted_liens = "unclear"
    - has_release_conditions = "unclear"
    - appears_overencumbered = "unclear"
    - security_display = "Не удалось определить обеспечительные конструкции"
    - reason = "Формулировки присутствуют, но вывод надёжно сделать нельзя."
    - для всех полей location = null

    Если security_status = "present" — переходи к Шагам 1–9.

    Шаг 1 — НАЛИЧИЕ ОБЕСПЕЧЕНИЯ

    Заполни "has_security_interests".

    Значения:
    - "yes" — есть обеспечение.
    - "no" — нет.
    - "unclear" — неясно.

    Шаг 2 — ТИПЫ ОБЕСПЕЧЕНИЯ

    Заполни "security_types_summary".

    Правила:
    - Кратко через ";", не более 3 видов:
      "залог движимого имущества; корпоративная гарантия"
      "ипотека; залог акций; поручительство"
    - Если нет обеспечения: "Не применимо"
    - Если неясно: "Не удалось определить"

    Шаг 3 — ПРИОРИТЕТ ЗАЛОГОВ

    Заполни "security_priority".

    Значения (строго из списка):
    - "first_lien" — первоочередной залог.
    - "second_lien" — залог второй очереди.
    - "pari_passu" — равный приоритет.
    - "mixed" — разный приоритет на разные активы.
    - "not_specified" — приоритет не указан.
    - "not_applicable" — залогов нет.
    - "unclear" — неясно.

    Шаг 4 — ОБЕСПЕЧЕНИЕ ЗА ТРЕТЬИХ ЛИЦ

    Заполни "has_third_party_security".

    Значения:
    - "yes" — есть upstream/cross-stream guarantee,
      гарантии или поручительства за аффилиатов.
    - "no" — нет.
    - "unclear" — неясно.

    Шаг 5 — NEGATIVE PLEDGE

    Заполни "has_negative_pledge".

    Значения:
    - "yes" — есть запрет создавать залоги / обременения
      в пользу третьих лиц без согласия.
    - "no" — нет.
    - "unclear" — неясно.

    Шаг 6 — ОГРАНИЧЕНИЯ НА ОТЧУЖДЕНИЕ АКТИВОВ

    Заполни "has_asset_disposal_restrictions".

    Значения:
    - "yes" — есть ограничения на продажу / отчуждение
      существенных активов.
    - "no" — нет.
    - "unclear" — неясно.

    Шаг 7 — PERMITTED LIENS / CARVE-OUT

    Заполни "has_permitted_liens".

    Значения (строго из списка):
    - "yes" — есть исключения: permitted liens, baskets,
      carve-out из negative pledge.
    - "no" — нет исключений, запрет абсолютный.
    - "not_applicable" — negative pledge отсутствует.
    - "unclear" — неясно.

    Шаг 8 — УСЛОВИЯ СНЯТИЯ ОБРЕМЕНЕНИЯ

    Заполни "has_release_conditions".

    Значения (строго из списка):
    - "yes" — прописаны: release при погашении,
      процедура снятия, сроки.
    - "no" — не прописаны.
    - "not_applicable" — обеспечения нет.
    - "unclear" — неясно.

    Шаг 9 — ПРИЗНАКИ ПЕРЕОБРЕМЕНЁННОСТИ

    Заполни "appears_overencumbered".

    Значения:
    - "yes" — структурные признаки из текста:
      множественные залоги на одни активы,
      значительные гарантии за третьих лиц,
      negative pledge без permitted liens.
    - "no" — признаков нет.
    - "unclear" — недостаточно данных.

    Шаг 10 — НОРМАЛИЗОВАННЫЙ DISPLAY ДЛЯ DD GRID

    Заполни "security_display".

    Это итоговое поле для таблицы. Строй его ТОЛЬКО на основе
    уже заполненных полей выше. Не добавляй информацию сверх них.

    Возможные состояния:
    1. Конкретное обеспечение известно:
       "Залог акций + корпоративная гарантия; first lien;
        negative pledge с permitted liens"
    2. Только ограничения без прямого обеспечения:
       "Negative pledge без исключений; ограничения на активы"
    3. Обеспечения нет:
       "Обеспечения не обнаружено"
    4. Не удалось определить:
       "Не удалось определить обеспечительные конструкции"

    Правила построения (если security_status = "present"):
    - начни с security_types_summary (кратко)
    - добавь security_priority (если не "not_specified")
    - добавь has_negative_pledge (если есть)
    - добавь has_third_party_security (если есть)
    - добавь has_release_conditions (если "no")
    Не более 4 фактов через ";".
    Не добавляй никаких данных, которых нет в полях выше
    (например, конкретные суммы залога, если они не отражены в полях).

    Шаг 11 — КРАТКОЕ ОБОСНОВАНИЕ

    Заполни "reason".

    Правила:
    - Первое предложение — краткий вывод по обеспечению.
    - Второе — короткая цитата из текста (до 100 символов).
    - Пиши по-русски.
    - Не оценивай риск.
    </instructions>

    <edge_cases>
    - Negative pledge без permitted liens:
      * security_status = "present"
      * has_negative_pledge = "yes"
      * has_permitted_liens = "no"
      * appears_overencumbered = "yes"

    - Upstream guarantee:
      * security_status = "present"
      * has_third_party_security = "yes"

    - Release conditions не прописаны:
      * security_status = "present"
      * has_release_conditions = "no"

    - Нет обеспечения:
      * security_status = "missing"
      * has_security_interests = "no"
      * security_types_summary = "Не применимо"
      * security_priority = "not_applicable"
      * has_permitted_liens = "not_applicable"
      * has_release_conditions = "not_applicable"
      * security_display = "Обеспечения не обнаружено"

    - Нет релевантных фрагментов:
      * security_status = "missing"
      * has_security_interests = "no"
      * security_types_summary = "Не применимо"
      * security_priority = "not_applicable"
      * has_third_party_security = "no"
      * has_negative_pledge = "no"
      * has_asset_disposal_restrictions = "no"
      * has_permitted_liens = "not_applicable"
      * has_release_conditions = "not_applicable"
      * appears_overencumbered = "no"
      * security_display = "Обеспечения не обнаружено"
    </edge_cases>

    <output_expectations>
    - Верни результат строго в формате JSON.
    - Не оборачивай в markdown-блоки (без ```).
    - Не добавляй комментариев вне JSON.
    - Значения allowed_values полей — строго из списка (на английском).
    - Свободные текстовые поля (security_display,
      security_types_summary, reason) — на русском языке.
    - Не добавляй никаких полей, кроме указанных.
    - Для каждого поля возвращай объект с ключами
      "value", "confidence", "location".

