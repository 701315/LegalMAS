id: "security_and_encumbrances_general"
name: "Обеспечение и обременения (общий уровень)"
description: >
  Анализирует обеспечительные конструкции и обременения в договоре:
  залоги активов и прав (pledge, mortgage), поручительства и корпоративные
  гарантии, обеспечительные платежи, negative pledge и ограничения
  на обременение/отчуждение, приоритет залогов, обеспечение за третьих
  лиц (upstream/cross-stream), условия снятия обременений.
  Оценивает влияние на финансовую гибкость и маневренность Target.

doc_types: []

severity: "high"
severity_if_fail: "critical"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"

rules:
  keyword_mode: any

  keywords:
    high:
      # Залог — конкретные маркеры
      - "(?i)\\bpledge\\b"
      - "(?i)\\bзалог[аеуом]?\\b"
      - "(?i)\\bmortgage\\b"
      - "(?i)\\bипотек[аиу]?\\b"
      - "(?i)security\\s+interest"
      - "(?i)обеспечительн[а-я]+\\s+интерес"
      - "(?i)charge\\s+(over|on)"
      - "(?i)lien"
      - "(?i)залог\\s+(прав|активов|имущества|акций|долей)"
      - "(?i)pledge\\s+of\\s+(assets?|rights?|shares?|interests?)"

      # Поручительства и гарантии
      - "(?i)\\bguarantee\\b"
      - "(?i)\\bгарант[ия][яиюей]?\\b"
      - "(?i)corporate\\s+guarantee"
      - "(?i)корпоративн[а-я]+\\s+гаранти"
      - "(?i)\\bsurety\\b"
      - "(?i)\\bпоручительств[оау]?\\b"
      - "(?i)parent\\s+(company\\s+)?guarantee"
      - "(?i)гаранти[яи]\\s+материнской\\s+компании"

      # Negative pledge
      - "(?i)negative\\s+pledge"
      - "(?i)запрет\\s+(на\\s+)?(обременени[ея]|залог|создани[ея]\\s+залог)"
      - "(?i)запрет\\s+(на\\s+)?отчуждени[ея]"
      - "(?i)restriction\\s+on\\s+(creating\\s+)?(liens?|encumbrances?|charges?)"

      # Upstream / cross-stream
      - "(?i)upstream\\s+guarantee"
      - "(?i)cross[-\\s]?stream\\s+guarantee"
      - "(?i)обеспечени[ея]\\s+за\\s+(обязательств[аы]\\s+)?третьих\\s+лиц"
      - "(?i)guarantee\\s+of\\s+(the\\s+)?obligations?\\s+of\\s+(a\\s+)?third"

    medium:
      # Обеспечительные платежи
      - "(?i)обеспечительн[а-я]+\\s+платёж"
      - "(?i)security\\s+deposit"
      - "(?i)deposit\\s+as\\s+security"
      - "(?i)cash\\s+collateral"
      - "(?i)денежн[а-я]+\\s+залог"

      # Обременение — общие
      - "(?i)\\bencumbrance\\b"
      - "(?i)\\bобременени[ея]\\b"
      - "(?i)\\bобременён"
      - "(?i)\\bencumbered\\b"
      - "(?i)free\\s+(and\\s+clear\\s+)?of\\s+(all\\s+)?(liens?|encumbrances?)"
      - "(?i)свободен\\s+от\\s+(обременений|залогов)"

      # Приоритет залогов
      - "(?i)first\\s+(priority\\s+)?lien"
      - "(?i)залог\\s+первой\\s+очереди"
      - "(?i)second\\s+lien"
      - "(?i)залог\\s+второй\\s+очереди"
      - "(?i)senior\\s+(secured|lien)"
      - "(?i)junior\\s+lien"
      - "(?i)subordinated\\s+(lien|pledge)"
      - "(?i)pari\\s+passu"

      # Permitted liens / carve-out
      - "(?i)permitted\\s+liens?"
      - "(?i)разрешённ[а-я]+\\s+обременени"
      - "(?i)permitted\\s+encumbrances?"
      - "(?i)carve[-\\s]?out\\s+for\\s+liens?"
      - "(?i)исключени[яе]\\s+из\\s+запрета\\s+(на\\s+)?залог"

      # Release conditions
      - "(?i)release\\s+of\\s+(the\\s+)?(pledge|security|lien|guarantee)"
      - "(?i)снятие\\s+(залога|обременения|обеспечения)"
      - "(?i)discharge\\s+of\\s+(the\\s+)?(security|guarantee)"
      - "(?i)прекращени[ея]\\s+(залога|поручительства|гарантии)"

      # Intercreditor
      - "(?i)intercreditor\\s+agreement"
      - "(?i)межкредиторск[а-я]+\\s+соглашени"

    low:
      # Общие термины
      - "(?i)залог"
      - "(?i)pledge"
      - "(?i)security"
      - "(?i)обеспечени"
      - "(?i)guarantee"
      - "(?i)гаранти"
      - "(?i)поручительств"
      - "(?i)surety"
      - "(?i)lien"
      - "(?i)encumbrance"
      - "(?i)обременени"
      - "(?i)mortgage"
      - "(?i)ипотек"
      - "(?i)collateral"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 700

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  context_k: 5
  max_chunks: 10
  boost_keywords:
    - "залог"
    - "pledge"
    - "mortgage"
    - "ипотека"
    - "security interest"
    - "поручительство"
    - "guarantee"
    - "corporate guarantee"
    - "корпоративная гарантия"
    - "surety"
    - "negative pledge"
    - "запрет обременения"
    - "запрет отчуждения"
    - "обременение"
    - "encumbrance"
    - "обеспечительный платёж"
    - "security deposit"
    - "first priority lien"
    - "second lien"
    - "permitted liens"
    - "разрешённые обременения"
    - "upstream guarantee"
    - "cross-stream guarantee"
    - "обеспечение за третьих лиц"
    - "release of pledge"
    - "снятие залога"
    - "intercreditor agreement"
  rerank: true
  filters: {}

conditional: null

extraction:
  llm_prompt_extraction: |
    <role>
    Ты — юрист по финансированию и обеспечительным конструкциям.
    Твоя специализация — анализ залогов, гарантий, поручительств,
    negative pledge и ограничений на обременение активов,
    включая оценку влияния на финансовую гибкость компании.
    </role>

    <context>
    Ниже приведены фрагменты договора с положениями об обеспечении
    и обременениях:

    {context}
    </context>

    <instructions>
    Проведи анализ по шагам. Каждый шаг логически соответствует одному
    или нескольким полям итоговой оценки риска.

    Шаг 1 — ВИДЫ ОБЕСПЕЧЕНИЯ
    (используется для заполнения поля "has_security_interests"):
    - Определи, какие виды обеспечения предусмотрены:
      * залог движимого имущества (pledge of assets);
      * залог прав требования (pledge of receivables);
      * залог акций/долей (share pledge);
      * ипотека (mortgage);
      * поручительства (surety);
      * корпоративные гарантии (corporate guarantee,
        parent company guarantee);
      * обеспечительные платежи (security deposit);
      * иные формы (cash collateral, assignment by way
        of security).
    - Оцени:
      * "yes" — обеспечение есть;
      * "no" — нет;
      * "unclear" — неясно.

    Шаг 2 — ПРИОРИТЕТ ЗАЛОГОВ
    (используется для заполнения поля "security_priority"):
    - Определи приоритет залогов:
      * "first_lien" — первоочередной залог;
      * "second_lien" — залог второй очереди;
      * "pari_passu" — равный приоритет с другими кредиторами;
      * "mixed" — разные активы с разным приоритетом;
      * "not_specified" — приоритет не указан;
      * "not_applicable" — залогов нет;
      * "unclear" — неясно.

    Шаг 3 — ОБЕСПЕЧЕНИЕ ЗА ТРЕТЬИХ ЛИЦ
    (используется для заполнения поля "has_third_party_security"):
    - Определи, предоставляет ли Target обеспечение
      за обязательства третьих лиц:
      * upstream guarantee (дочерняя → материнская);
      * cross-stream guarantee (сестринская компания);
      * гарантии/поручительства за аффилированные лица;
      * залог активов Target в обеспечение чужих долгов.
    - Оцени:
      * "yes" — есть;
      * "no" — нет;
      * "unclear" — неясно.

    Шаг 4 — NEGATIVE PLEDGE И ОГРАНИЧЕНИЯ
    (используется для заполнения полей "has_negative_pledge" и "has_asset_disposal_restrictions"):
    - Negative pledge:
      * есть ли запрет создавать залоги/обременения в пользу
        третьих лиц без согласия;
      * есть ли permitted liens / carve-out.
    - Ограничения на отчуждение:
      * запрет на продажу/отчуждение существенных активов;
      * ограничения на распоряжение.
    - Для каждого оцени: "yes" / "no" / "unclear".

    Шаг 5 — PERMITTED LIENS / CARVE-OUT
    (используется для заполнения поля "has_permitted_liens"):
    - Определи, предусмотрены ли исключения из negative pledge:
      * permitted liens (разрешённые обременения);
      * baskets для операционных залогов;
      * carve-out для обычной хозяйственной деятельности.
    - Оцени:
      * "yes" — permitted liens есть;
      * "no" — нет исключений, запрет абсолютный;
      * "not_applicable" — negative pledge отсутствует;
      * "unclear" — неясно.

    Шаг 6 — УСЛОВИЯ СНЯТИЯ ОБРЕМЕНЕНИЯ (RELEASE)
    (используется для заполнения поля "has_release_conditions"):
    - Определи, прописаны ли условия снятия обременений:
      * автоматическое release при погашении обязательств;
      * процедура снятия залога / прекращения гарантии;
      * сроки release.
    - Оцени:
      * "yes" — условия прописаны;
      * "no" — не прописаны;
      * "not_applicable" — обеспечения нет;
      * "unclear" — неясно.

    Шаг 7 — ПЕРЕОБРЕМЕНЁННОСТЬ АКТИВОВ
    (используется для заполнения поля "appears_overencumbered"):
    - Оцени на основе доступных данных, выглядят ли активы
      переобременёнными:
      * множественные залоги на одни активы;
      * значительные по объёму гарантии за третьих лиц;
      * залоги покрывают большую часть активов;
      * negative pledge без permitted liens блокирует
        дальнейшее финансирование.
    - Оцени:
      * "yes" — признаки переобременённости есть;
      * "no" — нет;
      * "unclear" — недостаточно данных.

    Шаг 8 — RED FLAGS
    (используется для заполнения поля "red_flags"):
    Присвой один или несколько кодов из списка ниже.
    Если ни один код не применим — верни "NONE".
    Если данных недостаточно для оценки — верни "UNCLEAR".

    Коды:
    • SEC1 — Переобременённость: залоги покрывают существенную
      часть активов Target, ограничивая маневренность.
    • SEC2 — Negative pledge без разумных permitted liens —
      блокирует рефинансирование и новые залоги.
    • SEC3 — Target предоставляет обеспечение за обязательства
      третьих лиц (upstream / cross-stream guarantee).
    • SEC4 — Отсутствие чётких условий снятия обременения
      (release conditions) после погашения обязательств.
    • SEC5 — Залог ключевых операционных активов или IP,
      потеря которых парализует бизнес.
    • SEC6 — Множественные залоги на одни и те же активы
      (second lien / subordinated pledge).

    Формат ответа: коды через запятую без комментариев
    (например: "SEC1, SEC3").
    Вся аргументация — в поле reason.

    Шаг 9 — ОБОСНОВАНИЕ
    (используется для заполнения поля "reason"):

    - В reason кратко обоснуй вывод, опираясь на ключевые
      формулировки из текста (с цитатами в кавычках), и укажи:
      * какие виды обеспечения установлены и их приоритет;
      * есть ли negative pledge и permitted liens;
      * есть ли обеспечение за третьих лиц;
      * есть ли release conditions;
      * если выставлены red_flags — обоснуй каждый код;
      * если red_flags = "NONE" — укажи, почему
        обременения не создают существенного риска.
    </instructions>

    <edge_cases>
    Обрабатывай пограничные ситуации так:

    - Один стандартный залог (залог приобретаемого актива
      по конкретному кредиту) без дополнительных ограничений:
      has_security_interests = "yes";
      appears_overencumbered = "no";
      red_flags может быть "NONE";
      overall_risk_level = "low" или "medium".

    - Negative pledge на существенную часть активов
      без permitted liens:
      зафиксируй SEC2; в reason укажи, что это блокирует
      будущие залоги и рефинансирование.

    - Target выступает гарантом за обязательства материнской
      компании (upstream guarantee):
      зафиксируй SEC3; в reason укажи объём и риск
      привлечения к ответственности по чужим долгам.

    - Множественные залоги (first lien + second lien)
      на одни активы:
      зафиксируй SEC6; appears_overencumbered = "yes";
      в reason укажи риск конкуренции кредиторов.

    - Залог IP или ключевого оборудования:
      зафиксируй SEC5; в reason укажи, что потеря
      актива может парализовать бизнес.

    - Release conditions не прописаны:
      зафиксируй SEC4; в reason укажи риск сохранения
      обременения после погашения обязательств.

    - Нет прямых указаний на залоги/гарантии,
      но упоминаются обременения по закону:
      has_security_interests = "unclear";
      в reason отрази неопределённость.

    - Пустые или явно нерелевантные фрагменты:
      red_flags = "UNCLEAR"; в reason укажи, что данных
      недостаточно для оценки обеспечительных конструкций.
    </edge_cases>

    <output_expectations>
    На основе твоего анализа отдельный механизм извлечения сформирует
    структурированные поля по заранее заданной схеме. Твоя задача —
    давать чёткие юридические выводы и указывать конкретные
    формулировки из текста, на которых они основаны.
    </output_expectations>

  enabled: true
  mode: "hybrid"
  fields:
    - name: "has_security_interests"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "security_priority"
      type: "string"
      allowed_values:
        - "first_lien"
        - "second_lien"
        - "pari_passu"
        - "mixed"
        - "not_specified"
        - "not_applicable"
        - "unclear"

    - name: "has_third_party_security"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "has_negative_pledge"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "has_asset_disposal_restrictions"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "has_permitted_liens"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "not_applicable"
        - "unclear"

    - name: "has_release_conditions"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "not_applicable"
        - "unclear"

    - name: "appears_overencumbered"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "red_flags"
      type: "string"

    - name: "reason"
      type: "string"

  store_payload: true

red_flags:
  items:
    - code: "SEC1"
      description: >
        Переобременённость: залоги покрывают существенную часть
        активов Target, ограничивая маневренность.
    - code: "SEC2"
      description: >
        Negative pledge без разумных permitted liens —
        блокирует рефинансирование и новые залоги.
    - code: "SEC3"
      description: >
        Target предоставляет обеспечение за обязательства
        третьих лиц (upstream / cross-stream guarantee).
    - code: "SEC4"
      description: >
        Отсутствие чётких условий снятия обременения (release
        conditions) после погашения обязательств.
    - code: "SEC5"
      description: >
        Залог ключевых операционных активов или IP,
        потеря которых парализует бизнес.
    - code: "SEC6"
      description: >
        Множественные залоги на одни и те же активы
        (second lien / subordinated pledge).
        