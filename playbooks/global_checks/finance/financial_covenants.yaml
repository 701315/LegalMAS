id: "financial_covenants"
name: "Финансовые ковенанты"
group: "Financial"
description: >
  Анализирует финансовые ковенанты в кредитных и коммерческих
  договорах: показатели левериджа и покрытия (leverage ratio,
  DSCR, interest coverage), ковенанты ликвидности, ограничения
  на дивиденды и новые заимствования.

  Определяет тип ковенантов (maintenance vs. incurrence), наличие
  cure period / equity cure, cross-default и baskets /
  permitted exceptions.

  Ограничения на распоряжение активами (asset disposal) и залоговые
  конструкции детально анализируются чеком
  security_and_encumbrances_general.
  Долгосрочные минимальные обязательства (take-or-pay, minimum
  volumes) анализируются чеком sticky_long_term_obligations.

doc_types: []

severity: "critical"
severity_if_fail: "critical"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"
ui_mode: "field_extraction"

rules:
  keyword_mode: any

  keywords:
    high:
      - "(?i)financial\\s+covenants?"
      - "(?i)финансов[а-я]+\\s+ковенант"
      - "(?i)maintenance\\s+covenants?"
      - "(?i)incurrence\\s+covenants?"
      - "(?i)leverage\\s+ratio"
      - "(?i)коэффициент\\s+левериджа"
      - "(?i)net\\s+debt[\\s/]+EBITDA"
      - "(?i)чистый\\s+долг[\\s/]+EBITDA"
      - "(?i)debt\\s+service\\s+coverage"
      - "(?i)\\bDSCR\\b"
      - "(?i)interest\\s+coverage"
      - "(?i)покрыти[ея]\\s+процент"
      - "(?i)\\bICR\\b"
      - "(?i)fixed\\s+charge\\s+coverage"
      - "(?i)dividend\\s+restriction"
      - "(?i)ограничени[яе]\\s+на\\s+(выплату\\s+)?дивиденд"
      - "(?i)restricted\\s+payment"
      - "(?i)distribution\\s+restriction"
      - "(?i)запрет\\s+на\\s+(выплату\\s+)?дивиденд"
      - "(?i)no\\s+dividends?\\s+shall"
      - "(?i)incurrence\\s+of\\s+indebtedness"
      - "(?i)ограничени[яе]\\s+на\\s+привлечени[ея]\\s+заимствовани"
      - "(?i)limitation\\s+on\\s+(the\\s+)?incurrence"
      - "(?i)shall\\s+not\\s+incur"
      - "(?i)cross[-\\s]?default"
      - "(?i)перекрёстн[а-я]+\\s+дефолт"
      - "(?i)cross[-\\s]?acceleration"
      - "(?i)перекрёстн[а-я]+\\s+акселераци"

    medium:
      - "(?i)\\bcovenant\\b"
      - "(?i)\\bковенант\\b"
      - "(?i)negative\\s+covenants?"
      - "(?i)affirmative\\s+covenants?"
      - "(?i)liquidity\\s+(ratio|requirement|covenant)"
      - "(?i)minimum\\s+cash"
      - "(?i)минимальн[а-я]+\\s+денежн[а-я]+\\s+остаток"
      - "(?i)current\\s+ratio"
      - "(?i)коэффициент\\s+текущей\\s+ликвидност"
      - "(?i)event\\s+of\\s+default"
      - "(?i)событи[ея]\\s+дефолта"
      - "(?i)случай\\s+неисполнени[яи]"
      - "(?i)default\\s+notice"
      - "(?i)cure\\s+period"
      - "(?i)equity\\s+cure"
      - "(?i)cure\\s+right"
      - "(?i)grace\\s+period"
      - "(?i)срок\\s+(для\\s+)?устранени[яи]\\s+(нарушени|ковенант)"
      - "(?i)permitted\\s+(indebtedness|investment|payment|lien)"
      - "(?i)basket"
      - "(?i)carve[-\\s]?out[\\s\\S]{0,20}(covenant|ковенант|indebtedness)"
      - "(?i)исключени[яе]\\s+из\\s+ковенант"
      - "(?i)capex\\s+(restriction|limitation|covenant)"
      - "(?i)capital\\s+expenditure\\s+(restriction|limitation)"
      - "(?i)ограничени[яе]\\s+на\\s+капитальн[а-я]+\\s+затрат"

    low:
      - "(?i)financial\\s+covenants?"
      - "(?i)финансов[а-я]+\\s+ковенант"
      - "(?i)leverage"
      - "(?i)леверидж"
      - "(?i)covenant"
      - "(?i)ковенант"
      - "(?i)maintenance\\s+covenant"
      - "(?i)incurrence\\s+covenant"
      - "(?i)cross[-\\s]?default"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 750

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  retrieval_profile: "financial_covenant_check"
  context_k: 6
  max_chunks: 12

  retrieval_query: >
    финансовые ковенанты leverage ratio Net Debt EBITDA
    DSCR interest coverage ограничения на дивиденды
    запрет заимствований cross-default event of default
    equity cure maintenance covenant incurrence covenant

  boost_keywords:
    - "финансовые ковенанты"
    - "financial covenants"
    - "leverage ratio"
    - "Net Debt/EBITDA"
    - "DSCR"
    - "interest coverage"
    - "ICR"
    - "ограничения на дивиденды"
    - "dividend restrictions"
    - "restricted payments"
    - "cross-default"
    - "перекрёстный дефолт"
    - "event of default"
    - "equity cure"
    - "cure period"

  negative_keywords:
    - "означает"
    - "в целях настоящего"
    - "споры"
    - "подсудность"
    - "применимое право"
    - "уступка прав"
    - "конфиденциальность"
    - "персональные данные"
    - "negative pledge"
    - "запрет залога"
    - "encumbrance"
    - "обременение"

  preferred_unit_types:
    - "obligation"
    - "liability_provision"
    - "payment_term"
    - "general_provision"

  excluded_unit_types:
    - "definition"
    - "structural_anchor"
    - "technical_fragment"
    - "appendix_reference"

  preferred_clause_functions:
    - "obligations"
    - "limitations"
    - "representations"
    - "remedies"

  position_bias:
    preferred_range: [0.20, 0.85]
    boost: 0.25
    scope: "segment"

  rerank: true
  filters: {}

conditional: null

enrichment_hints:
  preferred_segment_types:
    - "contract"
    - "amendment"
    - "annex"
  excluded_segment_types:
    - "technical_specification"
    - "price_list"
    - "invoice"
    - "act"
  confidence_bonus_on_match: 0.10
  confidence_penalty_on_excluded_segment: 0.15

extraction:
  enabled: true
  mode: "hybrid"
  llm_max_tokens: 1150

  llm_prompt_extraction: |
    <role>
    Ты — юрист по финансированию и кредитным договорам.
    Твоя задача — точно извлечь финансовые ковенанты из текста:
    показатели левериджа и покрытия, ограничения на дивиденды
    и новые заимствования (кроме залогов), cure mechanism,
    cross-default.

    КРИТИЧЕСКИ ВАЖНО:
    - Извлекай ТОЛЬКО то, что прямо написано в тексте.
    - НЕ делай выводов "по умолчанию" из общих норм права.
    - НЕ додумывай пороговые значения, которых нет в тексте.
    - Если информация отсутствует — используй "no", "unclear"
      или соответствующее состояние согласно allowed_values.
    - Если текст неоднозначен — ставь "unclear".

    Не анализируй залоговые конструкции, negative pledge и
    ограничения на отчуждение активов — это задача чека
    security_and_encumbrances_general.
    Не анализируй take-or-pay и минимальные объёмы —
    это задача чека sticky_long_term_obligations.
    </role>

    <context>
    Ниже приведены релевантные фрагменты договора:

    {context}
    </context>

    <context_rules>
    - Некоторые фрагменты могут быть нерелевантны — игнорируй их.
    - Если среди фрагментов есть противоречия — укажи "unclear"
      и объясни в reason.
    - Если ни один фрагмент не содержит информации о финансовых
      ковенантах — используй "no" или "unclear" согласно логике
      каждого поля.
    - Не используй информацию из definitions/преамбулы/приложений,
      если они не содержат substantive условий по теме check.
    </context_rules>

    <task>
    Заполни только следующие поля:
    - covenants_display
    - has_leverage_or_coverage_covenants
    - covenant_type
    - covenant_thresholds_summary
    - has_dividend_restrictions
    - has_new_debt_limitations
    - has_baskets_or_exceptions
    - has_cure_mechanism
    - has_cross_default
    - reason
    </task>

    <instructions>
    Шаг 1 — КОВЕНАНТЫ ПО КОЭФФИЦИЕНТАМ

    Заполни "has_leverage_or_coverage_covenants".

    Значения:
    - "yes" — есть ковенанты: leverage ratio (Net Debt/EBITDA),
      ICR, DSCR, fixed charge coverage, current ratio, min cash.
    - "no" — нет.
    - "unclear" — неясно.

    Шаг 2 — ПОРОГОВЫЕ ЗНАЧЕНИЯ

    Заполни "covenant_thresholds_summary".

    Правила:
    - Если пороги указаны — кратко через ";":
      "Net Debt/EBITDA ≤ 3.5x; ICR ≥ 2.0x"
    - Если ковенанты есть, но пороги не указаны:
      "Пороговые значения не указаны"
    - Если ковенантов нет: "Не применимо"
    - Если неясно: "Не удалось определить"

    Шаг 3 — ТИП КОВЕНАНТОВ

    Заполни "covenant_type".

    Значения:
    - "maintenance" — тестируются регулярно, нарушение = дефолт.
    - "incurrence" — тестируются только при событии.
    - "both" — оба типа.
    - "not_applicable" — ковенантов по коэффициентам нет.
    - "unclear" — нельзя определить.

    Шаг 4 — ОГРАНИЧЕНИЯ НА ДИВИДЕНДЫ

    Заполни "has_dividend_restrictions".

    Значения:
    - "yes" — запрет / ограничение на дивиденды,
      restricted payments, distributions.
    - "no" — нет.
    - "unclear" — неясно.

    Шаг 5 — ОГРАНИЧЕНИЯ НА НОВЫЙ ДОЛГ

    Заполни "has_new_debt_limitations".

    Это поле касается только ограничений на привлечение
    нового долга (new indebtedness), но НЕ залогов и
    НЕ negative pledge — их анализирует отдельный check.

    Значения:
    - "yes" — ограничения на привлечение нового долга.
    - "no" — нет.
    - "unclear" — неясно.

    Шаг 6 — BASKETS И PERMITTED EXCEPTIONS

    Заполни "has_baskets_or_exceptions".

    Значения:
    - "yes" — есть исключения: permitted indebtedness,
      permitted payments, baskets, carve-out из ковенантов.
    - "no" — ограничения абсолютные.
    - "unclear" — неясно.

    Шаг 7 — CURE PERIOD / EQUITY CURE

    Заполни "has_cure_mechanism".

    Значения:
    - "yes" — есть: cure period, equity cure, grace period.
    - "no" — нарушение = немедленный дефолт.
    - "unclear" — неясно.

    Шаг 8 — CROSS-DEFAULT / CROSS-ACCELERATION

    Заполни "has_cross_default".

    Значения:
    - "yes" — есть cross-default или cross-acceleration.
    - "no" — нет.
    - "unclear" — неясно.

    Шаг 9 — НОРМАЛИЗОВАННЫЙ DISPLAY ДЛЯ DD GRID

    Заполни "covenants_display".

    Это итоговое поле для таблицы. Строй его ТОЛЬКО на основе
    уже заполненных полей выше. Не добавляй информацию сверх них.

    Возможные состояния:
    1. Конкретные ковенанты с порогами:
       "Maintenance: Net Debt/EBITDA ≤ 3.5x, ICR ≥ 2.0x;
        запрет дивидендов; equity cure"
    2. Ковенанты есть, пороги не указаны:
       "Incurrence ковенанты; пороги не указаны; permitted indebtedness"
    3. Ковенантов нет:
       "Финансовых ковенантов не обнаружено"
    4. Тема не урегулирована:
       "Финансовых ковенантов не обнаружено"
    5. Не удалось определить:
       "Не удалось определить финансовые ковенанты"

    Правила построения (если ковенанты есть):
    - тип + пороги (если есть)
    - ограничения на дивиденды (если есть)
    - cure mechanism (если есть)
    - cross-default (если есть)
    Не более 4 фактов через ";".

    Шаг 10 — КРАТКОЕ ОБОСНОВАНИЕ

    Заполни "reason".

    Правила:
    - Первое предложение — краткий вывод по ковенантам.
    - Второе — короткая цитата из текста (до 100 символов).
    </instructions>

    <edge_cases>
    - Ковенанты есть, но пороги не указаны:
      * has_leverage_or_coverage_covenants = "yes"
      * covenant_thresholds_summary = "Пороговые значения не указаны"

    - "Поддерживать удовлетворительное финансовое состояние":
      * has_leverage_or_coverage_covenants = "unclear"
      * covenant_type = "unclear"
      * covenant_thresholds_summary = "Не удалось определить"

    - Нет ковенантов:
      * has_leverage_or_coverage_covenants = "no"
      * covenant_type = "not_applicable"
      * covenant_thresholds_summary = "Не применимо"
      * covenants_display = "Финансовых ковенантов не обнаружено"

    - Нет релевантных фрагментов:
      * все поля = "unclear"
      * covenant_thresholds_summary = "Не удалось определить"
      * covenants_display = "Не удалось определить финансовые ковенанты"
    </edge_cases>

    <output_expectations>
    - Верни результат строго в формате JSON.
    - Не оборачивай в markdown-блоки (без ```).
    - Не добавляй комментариев вне JSON.
    - Значения allowed_values полей — строго из списка (на английском).
    - Свободные текстовые поля (covenants_display,
      covenant_thresholds_summary, reason) — на русском языке.
    - Не добавляй никаких полей, кроме указанных.

    Пример структуры ответа:
    {
      "covenants_display": "...",
      "has_leverage_or_coverage_covenants": "yes",
      "covenant_type": "maintenance",
      "covenant_thresholds_summary": "Net Debt/EBITDA ≤ 3.5x; ICR ≥ 2.0x",
      "has_dividend_restrictions": "yes",
      "has_new_debt_limitations": "no",
      "has_baskets_or_exceptions": "yes",
      "has_cure_mechanism": "yes",
      "has_cross_default": "no",
      "reason": "..."
    }
    </output_expectations>

  fields:
    - name: "covenants_display"
      type: "string"
      presentation: "fact"
      label: "Финансовые ковенанты"
      description: "Нормализованный user-facing вывод для DD Grid"
      display_in_grid: true
      display_priority: 1

    - name: "has_leverage_or_coverage_covenants"
      type: "string"
      presentation: "signal"
      description: "Ковенанты по коэффициентам"
      allowed_values: ["yes", "no", "unclear"]
      display_in_grid: false

    - name: "covenant_type"
      type: "string"
      presentation: "signal"
      description: "Тип ковенантов"
      allowed_values: ["maintenance", "incurrence", "both", "not_applicable", "unclear"]
      display_in_grid: false

    - name: "covenant_thresholds_summary"
      type: "string"
      presentation: "fact"
      label: "Пороговые значения"
      description: "Пороговые значения ковенантов"
      display_in_grid: true
      display_priority: 2

    - name: "has_dividend_restrictions"
      type: "string"
      presentation: "signal"
      description: "Ограничения на дивиденды"
      allowed_values: ["yes", "no", "unclear"]
      display_in_grid: false

    - name: "has_new_debt_limitations"
      type: "string"
      presentation: "signal"
      description: "Ограничения на новый долг (не залоги)"
      allowed_values: ["yes", "no", "unclear"]
      display_in_grid: false

    - name: "has_baskets_or_exceptions"
      type: "string"
      presentation: "signal"
      description: "Baskets / permitted exceptions"
      allowed_values: ["yes", "no", "unclear"]
      display_in_grid: false

    - name: "has_cure_mechanism"
      type: "string"
      presentation: "signal"
      description: "Cure period / equity cure"
      allowed_values: ["yes", "no", "unclear"]
      display_in_grid: false

    - name: "has_cross_default"
      type: "string"
      presentation: "signal"
      description: "Cross-default / cross-acceleration"
      allowed_values: ["yes", "no", "unclear"]
      display_in_grid: false

    - name: "reason"
      type: "string"
      presentation: "diagnostic"
      description: "Обоснование"
      display_in_grid: false
      
  store_payload: true

