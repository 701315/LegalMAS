id: "financial_covenants"
name: "Финансовые ковенанты"
description: >
  Анализирует финансовые ковенанты: показатели левериджа, ликвидности,
  ограничения на дивиденды, новые заимствования и сделки с активами.

doc_types: []

severity: "critical"
severity_if_fail: "critical"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"

rules:
  keywords:
    - "financial covenants"
    - "финансовые ковенанты"
    - "covenant"
    - "leverage ratio"
    - "коэффициент левериджа"
    - "debt service coverage"
    - "DSCR"
    - "interest coverage"
    - "ликвидность"
    - "liquidity"
    - "dividend restrictions"
    - "ограничения на выплату дивидендов"
    - "negative covenants"
    - "ограничения на распоряжение активами"
    - "asset sale"
    - "asset disposition"
    - "incurrence of indebtedness"
    - "ограничения на привлечение заимствований"
  keyword_mode: "any"
  regex_patterns: []
  clause_patterns: []

llm:
  prompt_template: |
    <role>
    Ты — юрист по финансированию.
    Твоя специализация — кредитные договоры и финансовые ковенанты.
    </role>

    <context>
    Ниже приведены фрагменты договора, где могут быть финансовые ковенанты:

    {context}
    </context>

    <instructions>
    Проведи анализ по шагам. Каждый шаг логически связан с одним или
    несколькими полями итоговой оценки.

    Шаг 1 — НАЛИЧИЕ КОВЕНАНТОВ ПО КОЭФФИЦИЕНТАМ
    (используется для заполнения поля "has_leverage_or_coverage_covenants"):
    - Определи, содержатся ли в договоре финансовые ковенанты, связанные с:
      * показателями левериджа (например, Net Debt/EBITDA и аналогичные),
      * покрытием долга (DSCR, interest coverage и т.п.),
      * ликвидностью или другими финансовыми коэффициентами.
    - Сделай вывод: есть ли такие ковенанты, нет или по фрагментам это неясно.

    Шаг 2 — ОГРАНИЧЕНИЯ НА ДИВИДЕНДЫ, НОВЫЙ ДОЛГ И СДЕЛКИ С АКТИВАМИ
    (используется для заполнения полей
     "has_dividend_restrictions",
     "has_new_debt_limitations",
     "has_asset_disposition_restrictions"):
    - Определи, есть ли в договоре ограничения на:
      * выплату дивидендов (dividend restrictions, distribution restrictions);
      * привлечение новых заимствований (incurrence of indebtedness);
      * сделки с активами (asset sales, asset dispositions, ограничения на распоряжение активами).
    - Для каждого направления сделай отдельный вывод: да, нет или неопределённо.

    Шаг 3 — ВЕРОЯТНОСТЬ НАРУШЕНИЯ ПОСЛЕ СДЕЛКИ
    (используется для заполнения поля "likelihood_of_breach_after_transaction"):
    - На основе доступных формулировок оцени, насколько жёсткими выглядят ковенанты:
      * уровни допустимого левериджа и покрытия процентов;
      * степень ограничений по дивидендам, новому долгу и сделкам с активами.
    - Исходя из типовой нагрузки на бизнес после M&A/рефинансирования оцени,
      насколько реалистично соблюдение ковенантов:
      * low — ковенанты выглядят умеренными;
      * medium — существует заметный риск нарушения при стресс-сценариях;
      * high — ковенанты кажутся очень жёсткими и легко нарушимыми;
      * unclear — числовых значений и конкретики недостаточно.

    Шаг 4 — ОБЩИЙ РИСК ДЛЯ СТРУКТУРЫ ДОЛГА
    (используется для формирования "overall_risk_level" и "reason"):
    - Оцени, насколько совокупность ковенантов опасна для стабильности
      структуры долгов Target:
      * риск ускорения (acceleration) и события дефолта;
      * риск блокировки дивидендов;
      * ограничения на новые заимствования и реструктуризацию;
      * ограничения на сделки с активами.
    - Сформулируй общий риск как low / medium / high.
    - В "reason" кратко обоснуй вывод с опорой на ключевые формулировки
      (желательно с короткими цитатами в кавычках), объяснив, какие именно
      ковенанты создают угрозу или, наоборот, выглядят приемлемо.
    </instructions>

    <edge_cases>
    Обрабатывай пограничные ситуации так:

    - Ковенанты присутствуют, но числовые уровни коэффициентов в фрагментах
      не видны:
      отмечай наличие ковенантов, но фиксируй неопределённость в части
      вероятности нарушения.

    - Есть только общие обязательства "поддерживать удовлетворительное
      финансовое состояние" без конкретных метрик:
      указывай, что по вопросу именно финансовых ковенантов вывод
      однозначно сделать нельзя.

    - Ковенанты выглядят явно жёсткими (низкий допустимый leverage ratio,
      строгие запреты на дивиденды и новый долг) и по описанию бизнеса
      их соблюдение проблематично:
      учитывай это как повышенный риск события дефолта и ограничений
      на финансовую гибкость Target.

    - Пустые или явно нерелевантные фрагменты:
      укажи, что данных недостаточно для анализа финансовых ковенантов,
      и поясни, как это влияет на неопределённость и риск.
    </edge_cases>

    <output_expectations>
    На основе твоего анализа отдельный механизм извлечения сформирует
    структурированные поля по заранее заданной схеме. Твоя задача —
    давать чёткие юридические выводы и указывать конкретные формулировки
    из текста, на которых они основаны.
    </output_expectations>
  prompt_file: null
  context_k: 5
  temperature: 0.0
  max_tokens: 640

evidence:
  required: false
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  context_k: 5
  max_chunks: 10
  boost_keywords:
    - "financial covenants"
    - "leverage ratio"
    - "DSCR"
    - "dividend restrictions"
    - "asset sale"
    - "incurrence of indebtedness"
  rerank: true
  filters: {}

conditional: null

extraction:
  enabled: true
  mode: "hybrid"
  fields:
    - name: "has_leverage_or_coverage_covenants"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "has_dividend_restrictions"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "has_new_debt_limitations"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "has_asset_disposition_restrictions"
      type: "string"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "likelihood_of_breach_after_transaction"
      type: "string"
      allowed_values:
        - "low"
        - "medium"
        - "high"
        - "unclear"

    - name: "overall_risk_level"
      type: "string"
      allowed_values:
        - "low"
        - "medium"
        - "high"

    - name: "reason"
      type: "string"

  store_payload: true

red_flags:
  items:
    - code: "FIN3"
      description: "Жёсткие ковенанты, которые очевидно будут нарушены после сделки."
    - code: "FIN4"
      description: "Сильные ограничения на дивиденды/новые заимствования при планах пост-Closing реструктуризации."
