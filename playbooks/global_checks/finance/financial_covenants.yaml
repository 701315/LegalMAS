id: "financial_covenants"
name: "Финансовые ковенанты"
description: >
  Анализирует финансовые ковенанты в кредитных и коммерческих
  договорах: показатели левериджа и покрытия (leverage ratio,
  DSCR, interest coverage), ковенанты ликвидности, ограничения
  на дивиденды и новые заимствования (включая negative pledge).

  Определяет тип ковенантов (maintenance vs. incurrence), наличие
  cure period / equity cure, cross-default и baskets /
  permitted exceptions.

  Ограничения на распоряжение активами (asset disposal) и залоговые
  конструкции детально анализируются чеком
  security_and_encumbrances_general.
  Долгосрочные минимальные обязательства (take-or-pay, minimum
  volumes) анализируются чеком sticky_long_term_obligations.

  Формирует краткий user-facing вывод и оценивает вероятность
  нарушения ковенантов после M&A-сделки.

doc_types: []

severity: "critical"
severity_if_fail: "critical"
severity_if_pass: "pass"
severity_if_unclear: "medium"

detector_type: "hybrid"
ui_mode: "field_extraction"

rules:
  keyword_mode: any

  keywords:
    high:
      # Финансовые ковенанты — точные маркеры
      - "(?i)financial\\s+covenants?"
      - "(?i)финансов[а-я]+\\s+ковенант"
      - "(?i)maintenance\\s+covenants?"
      - "(?i)incurrence\\s+covenants?"

      # Leverage / покрытие
      - "(?i)leverage\\s+ratio"
      - "(?i)коэффициент\\s+левериджа"
      - "(?i)net\\s+debt[\\s/]+EBITDA"
      - "(?i)чистый\\s+долг[\\s/]+EBITDA"
      - "(?i)debt\\s+service\\s+coverage"
      - "(?i)\\bDSCR\\b"
      - "(?i)interest\\s+coverage"
      - "(?i)покрыти[ея]\\s+процент"
      - "(?i)\\bICR\\b"
      - "(?i)fixed\\s+charge\\s+coverage"

      # Ограничения на дивиденды
      - "(?i)dividend\\s+restriction"
      - "(?i)ограничени[яе]\\s+на\\s+(выплату\\s+)?дивиденд"
      - "(?i)restricted\\s+payment"
      - "(?i)distribution\\s+restriction"
      - "(?i)запрет\\s+на\\s+(выплату\\s+)?дивиденд"
      - "(?i)no\\s+dividends?\\s+shall"

      # Ограничения на новый долг
      - "(?i)incurrence\\s+of\\s+indebtedness"
      - "(?i)ограничени[яе]\\s+на\\s+привлечени[ея]\\s+заимствовани"
      - "(?i)limitation\\s+on\\s+(the\\s+)?incurrence"
      - "(?i)shall\\s+not\\s+incur"
      - "(?i)negative\\s+pledge"
      - "(?i)запрет\\s+залога"

      # Cross-default
      - "(?i)cross[-\\s]?default"
      - "(?i)перекрёстн[а-я]+\\s+дефолт"
      - "(?i)cross[-\\s]?acceleration"
      - "(?i)перекрёстн[а-я]+\\s+акселераци"

    medium:
      # Общие ковенанты
      - "(?i)\\bcovenant\\b"
      - "(?i)\\bковенант\\b"
      - "(?i)negative\\s+covenants?"
      - "(?i)affirmative\\s+covenants?"

      # Liquidity
      - "(?i)liquidity\\s+(ratio|requirement|covenant)"
      - "(?i)minimum\\s+cash"
      - "(?i)минимальн[а-я]+\\s+денежн[а-я]+\\s+остаток"
      - "(?i)current\\s+ratio"
      - "(?i)коэффициент\\s+текущей\\s+ликвидност"

      # Event of default / дефолт
      - "(?i)event\\s+of\\s+default"
      - "(?i)событи[ея]\\s+дефолта"
      - "(?i)случай\\s+неисполнени[яи]"
      - "(?i)default\\s+notice"

      # Cure period / equity cure
      - "(?i)cure\\s+period"
      - "(?i)equity\\s+cure"
      - "(?i)cure\\s+right"
      - "(?i)grace\\s+period"
      - "(?i)срок\\s+(для\\s+)?устранени[яи]\\s+(нарушени|ковенант)"

      # Baskets / permitted
      - "(?i)permitted\\s+(indebtedness|investment|payment|lien)"
      - "(?i)basket"
      - "(?i)carve[-\\s]?out[\\s\\S]{0,20}(covenant|ковенант|indebtedness)"
      - "(?i)исключени[яе]\\s+из\\s+ковенант"

      # Капитальные затраты
      - "(?i)capex\\s+(restriction|limitation|covenant)"
      - "(?i)capital\\s+expenditure\\s+(restriction|limitation)"
      - "(?i)ограничени[яе]\\s+на\\s+капитальн[а-я]+\\s+затрат"

    low:
      - "(?i)financial\\s+covenants?"
      - "(?i)финансов[а-я]+\\s+ковенант"
      - "(?i)leverage"
      - "(?i)леверидж"
      - "(?i)covenant"
      - "(?i)ковенант"
      - "(?i)maintenance\\s+covenant"
      - "(?i)incurrence\\s+covenant"
      - "(?i)cross[-\\s]?default"

  regex_patterns: []
  clause_patterns: []

llm:
  prompt_file: "detection/generic_presence.txt"
  context_k: 5
  temperature: 0.0
  max_tokens: 750

evidence:
  required: true
  min_snippet_length: 20
  max_snippet_length: 600

retrieval:
  context_k: 5
  max_chunks: 12
  boost_keywords:
    - "financial covenants"
    - "финансовые ковенанты"
    - "maintenance covenants"
    - "incurrence covenants"
    - "leverage ratio"
    - "коэффициент левериджа"
    - "Net Debt/EBITDA"
    - "DSCR"
    - "debt service coverage"
    - "interest coverage"
    - "ICR"
    - "liquidity"
    - "ликвидность"
    - "minimum cash"
    - "dividend restrictions"
    - "ограничения на дивиденды"
    - "restricted payments"
    - "incurrence of indebtedness"
    - "ограничения на заимствования"
    - "negative pledge"
    - "запрет залога"
    - "cross-default"
    - "перекрёстный дефолт"
    - "event of default"
    - "событие дефолта"
    - "cure period"
    - "equity cure"
    - "permitted indebtedness"
    - "basket"
  rerank: true
  filters: {}

conditional: null

enrichment_hints:
  preferred_segment_types:
    - "contract"
    - "amendment"
    - "annex"
  excluded_segment_types:
    - "technical_specification"
    - "price_list"
    - "invoice"
    - "act"
  preferred_clause_functions:
    - "liability"
    - "termination"
    - "payment_terms"
  confidence_bonus_on_match: 0.10
  confidence_penalty_on_excluded_segment: 0.15

extraction:
  enabled: true
  mode: "hybrid"
  llm_max_tokens: 500
  llm_prompt_extraction: |
    <role>
    Ты — юрист по финансированию и кредитным договорам.
    Твоя задача — точно извлечь из текста финансовые ковенанты:
    показатели левериджа и покрытия, ограничения на дивиденды
    и новые заимствования, cure mechanism, cross-default.

    Не анализируй залоговые конструкции и negative pledge детально —
    это задача чека security_and_encumbrances_general.
    Не анализируй take-or-pay и минимальные объёмы —
    это задача чека sticky_long_term_obligations.
    </role>

    <context>
    Ниже приведены релевантные фрагменты договора:

    {context}
    </context>

    <task>
    Заполни только следующие поля:
    - covenants_display
    - has_leverage_or_coverage_covenants
    - covenant_type
    - covenant_thresholds_summary
    - has_dividend_restrictions
    - has_new_debt_limitations
    - has_baskets_or_exceptions
    - has_cure_mechanism
    - has_cross_default
    - likelihood_of_breach_post_transaction
    - red_flags
    - reason

    Важно:
    - не анализируй ограничения на отчуждение активов —
      это задача чека security_and_encumbrances_general;
    - не анализируй take-or-pay и минимальные объёмы —
      это задача чека sticky_long_term_obligations;
    - не придумывай пороговые значения из контекста;
    - пиши user-facing значения коротко и по-русски.
    </task>

    <instructions>
    Шаг 1 — КОВЕНАНТЫ ПО КОЭФФИЦИЕНТАМ

    Заполни поле "has_leverage_or_coverage_covenants".

    Значения:
    - "yes" — есть ковенанты по коэффициентам:
      leverage ratio (Net Debt/EBITDA), ICR, DSCR,
      fixed charge coverage, current ratio, minimum cash.
    - "no" — нет.
    - "unclear" — неясно.

    Шаг 2 — ИЗВЛЕКИ ПОРОГОВЫЕ ЗНАЧЕНИЯ

    Заполни поле "covenant_thresholds_summary".

    Правила:
    - Если пороги указаны — перечисли кратко через ";":
      * "Net Debt/EBITDA ≤ 3.5x; ICR ≥ 2.0x"
      * "DSCR ≥ 1.2x; min cash = 50M RUB"
    - Если пороги не указаны, но ковенанты есть:
      "Пороговые значения не указаны"
    - Если ковенантов нет:
      "Не применимо"

    Шаг 3 — ТИП КОВЕНАНТОВ

    Заполни поле "covenant_type".

    Значения:
    - "maintenance" — тестируются регулярно (ежеквартально),
      нарушение = дефолт.
    - "incurrence" — тестируются только при событии
      (новое заимствование, дивиденд, сделка).
    - "both" — оба типа.
    - "not_applicable" — ковенантов по коэффициентам нет.
    - "unclear" — нельзя определить.

    Шаг 4 — ОГРАНИЧЕНИЯ НА ДИВИДЕНДЫ

    Заполни поле "has_dividend_restrictions".

    Значения:
    - "yes" — запрет / ограничение на дивиденды,
      restricted payments, distributions.
    - "no" — нет.
    - "unclear" — неясно.

    Шаг 5 — ОГРАНИЧЕНИЯ НА НОВЫЙ ДОЛГ

    Заполни поле "has_new_debt_limitations".

    Значения:
    - "yes" — ограничения на привлечение нового долга:
      limitation on incurrence of indebtedness,
      negative pledge, запрет залога.
    - "no" — нет.
    - "unclear" — неясно.

    Шаг 6 — BASKETS И PERMITTED EXCEPTIONS

    Заполни поле "has_baskets_or_exceptions".

    Значения:
    - "yes" — есть исключения из ковенантов:
      permitted indebtedness, permitted payments,
      permitted liens baskets, carve-out.
    - "no" — ограничения абсолютные.
    - "unclear" — неясно.

    Шаг 7 — CURE PERIOD / EQUITY CURE

    Заполни поле "has_cure_mechanism".

    Значения:
    - "yes" — есть: cure period, equity cure, grace period.
    - "no" — нарушение = немедленный дефолт.
    - "unclear" — неясно.

    Шаг 8 — CROSS-DEFAULT / CROSS-ACCELERATION

    Заполни поле "has_cross_default".

    Значения:
    - "yes" — есть cross-default или cross-acceleration.
    - "no" — нет.
    - "unclear" — неясно.

    Шаг 9 — ВЕРОЯТНОСТЬ НАРУШЕНИЯ ПОСЛЕ СДЕЛКИ

    Заполни поле "likelihood_of_breach_post_transaction".

    Значения:
    - "low" — умеренные ковенанты с разумным headroom
      или incurrence-only.
    - "medium" — заметный риск при стресс-сценариях.
    - "high" — ковенанты очевидно нарушаются при типичной
      post-closing нагрузке.
    - "unclear" — числовых значений недостаточно.

    Шаг 10 — RED FLAGS

    Заполни поле "red_flags".

    Используй:
    - "NONE" — если существенных риск-факторов нет.
    - "UNCLEAR" — если данных недостаточно.
    - Коды через запятую:
      * FIN1 — maintenance covenants с жёсткими порогами,
        минимальный headroom.
      * FIN2 — полный запрет на дивиденды / distributions
        без baskets или permitted payments.
      * FIN3 — ковенанты очевидно будут нарушены после сделки.
      * FIN4 — строгие ограничения на новые заимствования
        при планах post-closing рефинансирования.
      * FIN5 — cross-default / cross-acceleration:
        нарушение вызывает каскадный дефолт.
      * FIN6 — нет cure period / equity cure —
        нарушение немедленно = событие дефолта.

    Шаг 11 — USER-FACING SUMMARY

    Заполни поле "covenants_display".

    Строй display как краткий factual вывод:

    Примеры:
    - "Maintenance ковенанты: Net Debt/EBITDA ≤ 3.5x,
       ICR ≥ 2.0x; запрет дивидендов; есть equity cure"
    - "Incurrence ковенанты; без запрета дивидендов;
       есть permitted indebtedness"
    - "Финансовых ковенантов не обнаружено"
    - "Не удалось определить финансовые ковенанты"

    Правила:
    - Отрази максимум 3–4 ключевых факта через ";".
    - Если есть пороговые значения — включи их.
    - Если все параметры unclear:
      "Не удалось определить финансовые ковенанты"

    Шаг 12 — ОБОСНОВАНИЕ

    Заполни поле "reason".

    Правила:
    - 1–2 коротких предложения.
    - Укажи: какие ковенанты, пороги, maintenance или
      incurrence, ограничения на дивиденды/долг, cure,
      cross-default, почему выставлены red_flags.
    - Приведи короткую цитату в кавычках.
    - Если NONE — почему ковенанты не создают риска.
    </instructions>

    <edge_cases>
    - Ковенанты есть, но числовых значений нет:
      * has_leverage_or_coverage_covenants = "yes"
      * likelihood_of_breach_post_transaction = "unclear"
      * covenant_thresholds_summary =
        "Пороговые значения не указаны"

    - Только "поддерживать удовлетворительное финансовое
      состояние" без метрик:
      * has_leverage_or_coverage_covenants = "unclear"
      * covenant_type = "unclear"

    - Жёсткие ковенанты, но есть equity cure:
      * has_cure_mechanism = "yes"
      * зафиксируй FIN1 если пороги жёсткие
      * в reason: cure как смягчающий фактор

    - Incurrence с высокими порогами:
      * covenant_type = "incurrence"
      * likelihood_of_breach_post_transaction = "low"
        или "medium"

    - Cross-default + жёсткие ковенанты:
      * red_flags включает "FIN5"
      * в reason: каскадный эффект

    - Нет ковенантов:
      * has_leverage_or_coverage_covenants = "no"
      * covenant_type = "not_applicable"
      * red_flags = "NONE"
      * covenants_display = "Финансовых ковенантов не обнаружено"

    - Нет релевантных фрагментов:
      * все поля = "unclear"
      * red_flags = "UNCLEAR"
      * covenants_display =
        "Не удалось определить финансовые ковенанты"
    </edge_cases>

    <output_expectations>
    Все значения должны быть короткими, точными и пригодными
    для отображения пользователю в DD Grid.
    Не добавляй никаких полей, кроме указанных в схеме extraction.
    </output_expectations>

  fields:
    - name: "covenants_display"
      type: "string"
      description: "Финансовые ковенанты: краткий вывод"

    - name: "has_leverage_or_coverage_covenants"
      type: "string"
      description: "Ковенанты по коэффициентам"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "covenant_type"
      type: "string"
      description: "Тип ковенантов"
      allowed_values:
        - "maintenance"
        - "incurrence"
        - "both"
        - "not_applicable"
        - "unclear"

    - name: "covenant_thresholds_summary"
      type: "string"
      description: "Пороговые значения ковенантов"

    - name: "has_dividend_restrictions"
      type: "string"
      description: "Ограничения на дивиденды"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "has_new_debt_limitations"
      type: "string"
      description: "Ограничения на новый долг"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "has_baskets_or_exceptions"
      type: "string"
      description: "Baskets / permitted exceptions"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "has_cure_mechanism"
      type: "string"
      description: "Cure period / equity cure"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "has_cross_default"
      type: "string"
      description: "Cross-default / cross-acceleration"
      allowed_values:
        - "yes"
        - "no"
        - "unclear"

    - name: "likelihood_of_breach_post_transaction"
      type: "string"
      description: "Вероятность нарушения после сделки"
      allowed_values:
        - "low"
        - "medium"
        - "high"
        - "unclear"

    - name: "red_flags"
      type: "string"
      description: "Коды рисков"

    - name: "reason"
      type: "string"
      description: "Обоснование"

  store_payload: true


  