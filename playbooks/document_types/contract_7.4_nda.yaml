type: contract_7.4_nda
name: "Соглашение о неразглашении конфиденциальной информации (NDA)"

description: |
  Соглашение, по которому одна или обе стороны обязуются сохранять конфиденциальность информации, полученной в ходе переговоров, сотрудничества или иного взаимодействия. Может быть односторонним (только одна сторона раскрывает информацию) или двусторонним/взаимным (обе стороны обмениваются конфиденциальной информацией). Цель - защита коммерческой тайны, ноу-хау, персональных данных и иных ценных сведений от несанкционированного разглашения. Является ключевым инструментом для защиты интересов при обсуждении потенциальных сделок (M&A, инвестиции, партнерства). Регулируется нормами о коммерческой тайне (ФЗ-98) и общими положениями ГК РФ.

version: 2.1
parent: class_7_intellectual_property

metadata:
  category: agreement
  subcategory: intellectual_property
  complexity: medium-high
  risk_level: medium-high
  jurisdiction: RU
  language: ru
  legal_base: "Федеральный закон от 29.07.2004 № 98-ФЗ 'О коммерческой тайне', ст. 1465-1472 ГК РФ"
  doc_types_supported:
    - "NDA (Non-Disclosure Agreement)"
    - "Соглашение о конфиденциальности"
    - "Договор о неразглашении"
    - "Confidential Disclosure Agreement (CDA)"
    - "Соглашение о защите коммерческой тайны"  

engine_expectations:
  evidence_required: true
  evidence_style: "pinpoint"
  allow_not_found: true
  output_style: "dd_grid"
  prefer_structured_outputs: true

