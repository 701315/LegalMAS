# ════════════════════════════════
#  VALIDATION ENGINE v3.2
# ════════════════════════════════
validation_engine_v3_2:
  rules_enhanced:
    phrases:
      high:
        - "Стороны обязуются не разглашать конфиденциальную информацию третьим лицам"
        - "Конфиденциальная информация включает, но не ограничивается: [перечень]"
        - "Не считается конфиденциальной информация, которая стала общедоступной"
        - "Срок действия обязательств о неразглашении составляет [срок]"
        - "Раскрывающая сторона предоставляет информацию в целях [цель]"
      medium:
        - "Получающая сторона обязана принимать разумные меры для защиты информации"
        - "Информация должна быть помечена как 'Конфиденциально' или аналогично"
        - "Ограничения на использование информации только в оговоренных целях"
        - "Обязанность вернуть или уничтожить информацию по требованию"
        - "Раскрытие информации по требованию государственных органов"
    patterns:
      required:
        - "(?i)(соглашение\\s+о\\s+неразглашении|NDA|конфиденциальн\\w+\\s+информация|режим\\s+конфиденциальности)"
      optional:
        - "(?i)(односторонн\\w+|двусторонн\\w+|взаимн\\w+).*соглашение"
        - "(?i)(коммерческая\\s+тайна|ноу-хау|секрет\\s+производства)"
        - "(?i)(не\\s+разглашать|сохранять\\s+конфиденциальность)"
    exclusion_logic:
      - condition: "employment_contract AND confidentiality_clause_only"
        target: "rejection"
        confidence: 0.75
        description: "Если соглашение о конфиденциальности является частью трудового договора - это не самостоятельное NDA"
      - condition: "franchise_agreement AND knowhow_protection_included"
        target: "rejection"
        confidence: 0.80
        description: "Если защита конфиденциальной информации является частью договора коммерческой концессии - это не самостоятельное NDA"
    weights:
      keyword_high: 3.0
      keyword_medium: 1.5
      keyword_low: 0.5
      phrase_high: 2.5
      phrase_medium: 1.0
      pattern_required: 4.0
      pattern_optional: 1.0
    classification:
      min_confidence: 0.75
      max_matches: 3

    party_roles:
      - "Раскрывающая сторона (Disclosing Party) - сторона, которая раскрывает конфиденциальную информацию"
      - "Получающая сторона (Receiving Party) - сторона, которая получает конфиденциальную информацию и обязуется ее защищать"
    essential_terms:
      - "Определение конфиденциальной информации (предмет соглашения)"
      - "Цели раскрытия информации (ограничение использования)"
      - "Срок действия обязательств о неразглашении"
      - "Обязанности получающей стороны по защите информации"
    aliases:
