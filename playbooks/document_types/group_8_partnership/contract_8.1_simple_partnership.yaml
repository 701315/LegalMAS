          description: "Способ денежной оценки вкладов."
          required: false
        - name: "non_monetary_present"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Наличие неденежных вкладов."
          required: false
        - name: "non_monetary_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Неденежные вклады"
          description: "Состав неденежных вкладов (для Drawer)."
          required: false
        - name: "contribution_deadline_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
