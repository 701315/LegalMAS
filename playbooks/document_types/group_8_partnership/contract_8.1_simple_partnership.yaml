          distinctiveness: high
          context: any
          description: "Ведение общих дел товарищей"

        - pattern: "(?i)общ[ееая]\\s+имуществ[оа]\\s+товарищ[еей]"
          weight: 0.85
          distinctiveness: high
          context: any
