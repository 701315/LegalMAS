          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус требования доверенности."
          required: false
        - name: "poa_required_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Доверенность"
