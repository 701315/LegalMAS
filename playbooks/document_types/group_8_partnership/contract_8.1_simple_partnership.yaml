      - "(?i)\\bпомещени[ея]\\b"
      - "(?i)кадастров[ыо]й\\s+номер"
      - "(?i)\\bЕГРН\\b"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 3: SHARED PATTERNS
#  Читается: DocTypeCheckLoader через _resolve_yaml_templates()
# ════════════════════════════════════════════════════════════════════════════

shared_patterns:
  money_amount: "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|тыс|млн)"
  date_pattern: "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"
  percent_pattern: "(?i)\\b\\d+[.,]?\\d*\\s*%"
  inn_pattern: "(?i)\\bИНН\\s*\\d{10,12}\\b"
  ogrn_pattern: "(?i)\\bОГРН\\s*\\d{13,15}\\b"
  passport_data: "(?i)паспорт\\s+серия\\s+\\d{4}\\s+№?\\s*\\d{6}"
  article_gk_ref: "(?i)ст\\.?\\s*\\d+\\s*ГК\\s*РФ"

compliance_rules: []

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: CHECKS_V8 — единственный рабочий слой юридического анализа
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  - id: partnership_subject_extraction
    name: "Стороны, общая цель, тип деятельности и срок договора"
    description: >
      Фактографическая проверка идентификации всех товарищей, общей цели
      совместной деятельности, типа деятельности (предпринимательская /
      некоммерческая) и срока действия договора.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 10

    rules:
      keywords:
        - "товарищ"
        - "участник"
        - "стороны"
        - "общая цель"
        - "цель совместной деятельности"
        - "извлечение прибыли"
        - "коммерческая деятельность"
        - "некоммерческая цель"
        - "предпринимательская деятельность"
        - "индивидуальный предприниматель"
        - "коммерческая организация"
        - "срок действия"
        - "бессрочный"
        - "без образования юридического лица"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(товарищ|участник)\\s*\\d"
        - "(?i)общ[а-яё]+\\s+цел[ььи]"
        - "(?i)без\\s+образован[ияи]\\s+юридическ"
        - "(?i)(индивидуальн[а-яё]+\\s+предпринимател|коммерческ[а-яё]+\\s+организац)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор простого товарищества (Глава 55 ГК РФ).
        Проверяется только один вопрос: стороны, общая цель, тип деятельности
        и срок договора.
        Нормативные ориентиры:
        - ст. 1041 ГК РФ — понятие договора простого товарищества
        - п. 1 ст. 432 ГК РФ — существенные условия (предмет)
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Без общей цели договор не соответствует ст. 1041 ГК РФ.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Количество товарищей и их идентификацию (наименования / ФИО).
        2. Общую цель совместной деятельности.
        3. Тип цели: извлечение прибыли, некоммерческая или смешанная.
        4. Является ли деятельность предпринимательской.
        5. Есть ли прямое указание «без образования юридического лица».
        6. Срок действия (срочный / бессрочный).

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Для enum-полей (*_status, goal_type, entrepreneurial_activity)
           при отсутствии данных возвращай "not_defined".
        4. Для строковых *_details при отсутствии данных возвращай строго
           "Данные не определены".
        5. Не используй "None", "null", пустые строки или отсутствующие ключи.
        6. В evidence включай только прямые цитаты из текста договора.
        7. Если цель сформулирована абстрактно («в целях, не противоречащих
           закону»), common_goal_status = "defined", но goal_type = "not_defined".
        8. Верни РОВНО один валидный JSON-объект со всеми 13 ключами
           (12 полей + evidence), пригодный для парсинга через json.loads
           без предварительной обработки. Без markdown, без ```json,
           без комментариев, без текста до или после. Начни ответ сразу
           с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — данные определены:
        Фрагмент:
        "Товарищ 1 — ООО «Строй-Пример», Товарищ 2 — ИП Петров П.П.
        Стороны обязуются соединить вклады и совместно действовать
        без образования юридического лица для извлечения прибыли
        от строительства жилого комплекса.
        Договор действует до полного завершения строительства."
        Ответ:
        {
          "partners_count_status": "defined",
          "partners_count_details": "2 товарища",
          "partners_identification_status": "defined",
          "partners_identification_details": "ООО «Строй-Пример»; ИП Петров П.П.",
          "common_goal_status": "defined",
          "common_goal_details": "извлечение прибыли от строительства жилого комплекса",
          "goal_type": "profit",
          "entrepreneurial_activity": "yes",
          "no_legal_entity_status": "defined",
          "no_legal_entity_details": "без образования юридического лица",
          "contract_term_status": "defined",
          "contract_term_details": "до полного завершения строительства",
          "evidence": [
            {"clause_ref": "преамбула", "quote": "Товарищ 1 — ООО «Строй-Пример», Товарищ 2 — ИП Петров П.П."},
            {"clause_ref": "п. 1.1", "quote": "Стороны обязуются соединить вклады и совместно действовать без образования юридического лица для извлечения прибыли от строительства жилого комплекса."},
            {"clause_ref": "п. 7.1", "quote": "Договор действует до полного завершения строительства."}
          ]
        }

        Пример 2 — абстрактная цель (edge-case):
        Фрагмент:
        "Стороны объединяют усилия для достижения целей, не противоречащих закону."
        Ответ:
        {
          "partners_count_status": "not_defined",
          "partners_count_details": "Данные не определены",
          "partners_identification_status": "not_defined",
          "partners_identification_details": "Данные не определены",
          "common_goal_status": "defined",
          "common_goal_details": "достижение целей, не противоречащих закону",
          "goal_type": "not_defined",
          "entrepreneurial_activity": "not_defined",
          "no_legal_entity_status": "not_defined",
          "no_legal_entity_details": "Данные не определены",
          "contract_term_status": "not_defined",
          "contract_term_details": "Данные не определены",
          "evidence": [
            {"clause_ref": "п. 1.1", "quote": "Стороны объединяют усилия для достижения целей, не противоречащих закону."}
          ]
        }

        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Стороны заключили настоящий договор."
        Ответ:
        {
          "partners_count_status": "not_defined",
          "partners_count_details": "Данные не определены",
          "partners_identification_status": "not_defined",
          "partners_identification_details": "Данные не определены",
          "common_goal_status": "not_defined",
          "common_goal_details": "Данные не определены",
          "goal_type": "not_defined",
          "entrepreneurial_activity": "not_defined",
          "no_legal_entity_status": "not_defined",
          "no_legal_entity_details": "Данные не определены",
          "contract_term_status": "not_defined",
          "contract_term_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Все 13 ключей (12 полей + evidence) присутствуют в JSON?
        2. Найдена ли прямая цитата с идентификацией товарищей?
        3. Найдена ли прямая цитата с общей целью?
        4. Определён ли тип цели по тексту (или "not_defined")?
        5. Найдена ли прямая цитата «без образования юридического лица»?
        6. Найден ли срок действия?
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "partners_count_status": "<defined / not_defined>",
          "partners_count_details": "<количество или 'Данные не определены'>",
          "partners_identification_status": "<defined / not_defined>",
          "partners_identification_details": "<идентификация или 'Данные не определены'>",
          "common_goal_status": "<defined / not_defined>",
          "common_goal_details": "<описание или 'Данные не определены'>",
          "goal_type": "<profit / non_profit / mixed / not_defined>",
          "entrepreneurial_activity": "<yes / no / not_defined>",
          "no_legal_entity_status": "<defined / not_defined>",
          "no_legal_entity_details": "<цитата или 'Данные не определены'>",
          "contract_term_status": "<defined / not_defined>",
          "contract_term_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 650

    retrieval:
      retrieval_profile: "definitions_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "товарищ участник стороны общая цель цель совместной деятельности извлечение прибыли коммерческая деятельность некоммерческая цель без образования юридического лица срок действия бессрочный предпринимательская деятельность индивидуальный предприниматель коммерческая организация"
      preferred_unit_types:
        - obligation
        - general_provision
        - effective_date
      excluded_unit_types:
        - definition
        - technical_fragment
      preferred_clause_functions:
        - definitions
        - obligations
      negative_keywords:
        - "вклад"
        - "распределение прибыли"
        - "ведение дел"
        - "доверенность"
        - "выход из товарищества"
        - "прекращение"
        - "неустойка"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 0.25]
        boost: 0.25
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "definitions"
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1200

      compact_output: false

      presence_signal:
        field: "partnership_subject_extraction_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора простого товарищества
        сведения о сторонах, общей цели, типе деятельности и сроке договора.
        Не анализируй вклады, распределение прибыли, ведение дел или
        прекращение.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. partnership_subject_extraction_presence:
           Агрегатное signal-поле — наличие сведений о сторонах, цели
           и сроке.
           - "present" — если хотя бы одно из содержательных полей
             (partners_count_status, partners_identification_status,
              common_goal_status, no_legal_entity_status,
              contract_term_status) ≠ "not_defined";
           - "missing" — если все пять содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - partners_count_status = "not_defined";
           - partners_identification_status = "not_defined";
           - common_goal_status = "not_defined";
           - no_legal_entity_status = "not_defined";
           - contract_term_status = "not_defined";
           - goal_type = "not_defined";
           - entrepreneurial_activity = "not_defined";
           - все *_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. partners_count_status:
           - "defined" — если прямо указано количество товарищей;
           - "not_defined" — иначе.

        2. partners_count_details:
           Краткое user-facing описание количества товарищей
           (например: "2 товарища").
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        3. partners_identification_status:
           - "defined" — если прямо идентифицированы все товарищи
             (наименования юрлиц, ФИО ИП или физлиц);
           - "not_defined" — если идентификация отсутствует или неполная.

        4. partners_identification_details:
           Краткая идентификация всех товарищей (например:
           "ООО «Строй-Пример»; ИП Петров П.П.").
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        5. common_goal_status:
           - "defined" — если прямо указана общая цель совместной
             деятельности (даже абстрактная формулировка типа
             «цели, не противоречащие закону»);
           - "not_defined" — иначе.

        6. common_goal_details:
           Краткое user-facing описание общей цели.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        7. goal_type:
           Используй только одно из значений:
           - "profit" — если прямо указано извлечение прибыли;
           - "non_profit" — если прямо указана некоммерческая цель;
           - "mixed" — если указаны обе цели;
           - "not_defined" — если цель абстрактна или не определена.

        8. entrepreneurial_activity:
           Используй только одно из значений:
           - "yes" — если прямо указано, что деятельность
             предпринимательская, или среди товарищей есть ИП
             / коммерческая организация;
           - "no" — если прямо указано, что деятельность
             некоммерческая;
           - "not_defined" — если по тексту определить нельзя.

        9. no_legal_entity_status:
           - "defined" — если прямо указано «без образования
             юридического лица»;
           - "not_defined" — иначе.

        10. no_legal_entity_details:
            Дословная цитата «без образования юридического лица».
            Если данных нет — "Данные не определены".
            Если данные противоречивы — "Не удалось определить".

        11. contract_term_status:
            - "defined" — если прямо указан срок действия договора
              (датами, в годах/месяцах, «до наступления события»)
              или указано, что договор бессрочный;
            - "not_defined" — иначе.

        12. contract_term_details:
            Краткое user-facing описание срока
            (например: "до полного завершения строительства",
            "бессрочный").
            Если данных нет — "Данные не определены".
            Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни partnership_subject_extraction_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не делай выводов по типовой структуре договора.
        - Не извлекай сведения о вкладах, распределении прибыли, ведении дел, доверенностях, выходе из товарищества, прекращении, неустойках и иных нерелевантных темах.
        - goal_type: "profit" если прямо указано извлечение прибыли; "non_profit" если прямо указана некоммерческая цель; "mixed" если указаны обе; "not_defined" если цель абстрактна.
        - entrepreneurial_activity = "yes" только если прямо указана предпринимательская деятельность или участие ИП / коммерческой организации.
        - Если цель сформулирована абстрактно («в целях, не противоречащих закону»), common_goal_status = "defined", goal_type = "not_defined".
        - Если в разных фрагментах указаны противоречивые сведения и конфликт нельзя разрешить по тексту — статус → "not_defined", текстовое поле → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни идентификации товарищей, ни общей цели,
           ни указания «без образования юридического лица», ни срока.
           → presence = "missing";
             все *_status = "not_defined";
             goal_type = "not_defined";
             entrepreneurial_activity = "not_defined";
             все *_details = "Данные не определены".

        2. Неполное раскрытие или прямое исключение.
           а) Товарищи названы обобщённо («Стороны»), без идентификации
              и без количества — соответствующие *_status = "not_defined".
           б) Цель сформулирована абстрактно
              («в целях, не противоречащих закону»).
              → presence = "present";
                common_goal_status = "defined";
                common_goal_details содержит формулировку;
                goal_type = "not_defined".

        3. Противоречие между фрагментами.
           В разных частях договора указаны противоречивые цели
           или разное количество товарищей.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             соответствующий *_details = "Не удалось определить".

        4. Специфика темы — прямое отсутствие юрлица.
           Указано «без образования юридического лица» и при этом
           названы товарищи и цель.
           → presence = "present";
             no_legal_entity_status = "defined";
             no_legal_entity_details содержит дословную цитату.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для partnership_subject_extraction_presence используй только: "present", "missing", "unclear".
        - Для enum-полей *_status используй только: "defined", "not_defined".
        - Для goal_type используй только: "profit", "non_profit", "mixed", "not_defined".
        - Для entrepreneurial_activity используй только: "yes", "no", "not_defined".
        - Fallback при отсутствии данных:
          * все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "partnership_subject_extraction_presence"
          type: "string"
