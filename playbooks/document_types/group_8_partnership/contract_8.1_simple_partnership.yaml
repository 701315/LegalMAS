        - name: "disposal_procedure_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения порядка распоряжения."
          required: false

        - name: "disposal_procedure_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 4
          label: "Распоряжение имуществом"
          description: "Порядок распоряжения общим имуществом."
          required: false

        - name: "use_procedure_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения порядка пользования."
          required: false

        - name: "use_procedure_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Пользование имуществом"
          description: "Порядок пользования общим имуществом (для Drawer)."
          required: false

        - name: "state_registration_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус упоминания государственной регистрации права."
          required: false

        - name: "state_registration_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 5
          label: "Госрегистрация права"
          description: "Условие о государственной регистрации права на недвижимое имущество."
          required: false

      store_payload: true

  - id: withdrawal_and_termination_check
    name: "Выход из товарищества, прекращение и раздел имущества (ст. 1050–1052 ГК РФ)"
    description: >
      Фактографическая проверка режима выхода (свободный по бессрочному
      договору — ст. 1051 ГК РФ; только по уважительной причине
      по срочному — ст. 1052 ГК РФ), срока уведомления, порядка оценки
      и выплаты доли, оснований прекращения (ст. 1050 ГК РФ) и порядка
      раздела имущества, включая возврат вкладов в натуре.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 80

    rules:
      keywords:
        - "право на выход"
        - "выход из товарищества"
        - "уведомление о выходе"
        - "выдел доли"
        - "оценка доли при выходе"
        - "прекращение договора"
        - "расторжение договора"
        - "раздел имущества"
        - "ликвидация общего имущества"
        - "возврат вклада в натуре"
        - "денежная компенсация доли"
        - "бессрочный договор"
        - "срочный договор"
        - "уважительная причина"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)выход\\s+из\\s+товариществ"
        - "(?i)(прекращени|расторжени)[ея]\\s+договор"
        - "(?i)раздел\\s+имуществ"
        - "(?i)возврат[а-яё]*\\s+в\\s+натур"
        - "(?i)(бессрочн|срочн)[а-яё]+\\s+договор"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор простого товарищества (ст. 1050–1052 ГК РФ).
        Проверяется только один вопрос: выход из товарищества, прекращение
        договора и раздел имущества.
        Нормативные ориентиры:
        - ст. 1051 ГК РФ — БЕССРОЧНЫЙ договор: товарищ вправе в любое
          время выйти, уведомив остальных за 3 месяца (по умолчанию;
          иной срок может быть установлен договором).
        - ст. 1052 ГК РФ — СРОЧНЫЙ договор: выход только по уважительной
          причине с возмещением убытков остальным товарищам; срочный
          договор может быть расторгнут по требованию товарища
          с возмещением реального ущерба.
        - п. 2 ст. 1050 ГК РФ — вещи, переданные в общее владение
          или пользование, возвращаются предоставившим их товарищам
          без вознаграждения, если иное не установлено соглашением.
        - п. 3 ст. 1050 ГК РФ — раздел общего имущества по ст. 252 ГК РФ;
          индивидуально определённая вещь может быть истребована
          с соблюдением интересов остальных товарищей и кредиторов.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Различай: бессрочный договор = свободный выход; срочный =
          выход только по уважительной причине.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Право товарища на выход.
        2. Режим выхода: свободный (бессрочный) / только по уважительной
           причине (срочный).
        3. Срок уведомления о выходе.
        4. Способ оценки доли при выходе.
        5. Срок выплаты доли.
        6. Основания прекращения договора.
        7. Порядок раздела имущества при прекращении.
        8. Режим возврата вкладов при прекращении (в натуре / денежная
           компенсация / смешанный).

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Для enum-полей (*_status) при отсутствии данных возвращай
           "not_defined".
        4. Для строковых *_details при отсутствии данных возвращай строго
           "Данные не определены".
        5. Не используй "None", "null", пустые строки или отсутствующие ключи.
        6. В evidence включай только прямые цитаты из текста договора.
        7. withdrawal_regime_code: "free" — если договор бессрочный и товарищ
           вправе выйти в любое время; "with_cause" — если для выхода
           требуется уважительная причина или возмещение убытков;
           "mixed" — если для разных случаев установлены разные режимы.
        8. property_return_regime: "in_kind" — если прямо указан возврат
           вкладов в натуре; "monetary" — если предусмотрена денежная
           компенсация; "mixed" — сочетание.
        9. Верни РОВНО один валидный JSON-объект со всеми 16 ключами
           (15 полей + evidence), пригодный для парсинга через json.loads
           без предварительной обработки. Без markdown, без ```json,
           без комментариев, без текста до или после. Начни ответ сразу
           с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — бессрочный договор, свободный выход:
        Фрагмент:
        "Договор действует бессрочно. Товарищ вправе выйти из товарищества
        в любое время, уведомив остальных товарищей за 3 месяца. Доля
        оценивается по рыночной стоимости независимым оценщиком, выплата —
        в течение 60 дней с даты выхода. При прекращении договора имущество
        делится пропорционально вкладам, вещи, переданные в пользование,
        возвращаются в натуре."
        Ответ:
        {
          "withdrawal_right_status": "defined",
          "withdrawal_right_details": "право выйти в любое время, уведомив за 3 месяца",
          "withdrawal_regime_code": "free",
          "withdrawal_regime_details": "бессрочный договор, свободный выход",
          "notice_period_status": "defined",
          "notice_period_details": "за 3 месяца",
          "valuation_method_status": "defined",
          "valuation_method_details": "по рыночной стоимости независимым оценщиком",
          "payment_deadline_status": "defined",
          "payment_deadline_details": "в течение 60 дней с даты выхода",
          "termination_grounds_status": "not_defined",
          "termination_grounds_details": "Данные не определены",
          "property_division_status": "defined",
          "property_division_details": "пропорционально вкладам",
          "property_return_regime": "in_kind",
          "evidence": [
            {"clause_ref": "п. 8.1", "quote": "Договор действует бессрочно."},
            {"clause_ref": "п. 8.2", "quote": "Товарищ вправе выйти из товарищества в любое время, уведомив остальных товарищей за 3 месяца."},
            {"clause_ref": "п. 8.3", "quote": "Доля оценивается по рыночной стоимости независимым оценщиком, выплата — в течение 60 дней с даты выхода."},
            {"clause_ref": "п. 8.5", "quote": "При прекращении договора имущество делится пропорционально вкладам, вещи, переданные в пользование, возвращаются в натуре."}
          ]
        }

        Пример 2 — срочный договор, выход только по уважительной причине:
        Фрагмент:
        "Договор заключён на 5 лет. Досрочный выход товарища возможен
        только при наличии уважительных причин с возмещением убытков
        остальным товарищам. При прекращении договора вклады возвращаются
        в денежной форме в размере их оценки."
        Ответ:
        {
          "withdrawal_right_status": "defined",
          "withdrawal_right_details": "досрочный выход только при уважительных причинах с возмещением убытков",
          "withdrawal_regime_code": "with_cause",
          "withdrawal_regime_details": "срочный договор на 5 лет, выход только по уважительной причине",
          "notice_period_status": "not_defined",
          "notice_period_details": "Данные не определены",
          "valuation_method_status": "not_defined",
          "valuation_method_details": "Данные не определены",
          "payment_deadline_status": "not_defined",
          "payment_deadline_details": "Данные не определены",
          "termination_grounds_status": "not_defined",
          "termination_grounds_details": "Данные не определены",
          "property_division_status": "defined",
          "property_division_details": "вклады возвращаются в денежной форме в размере их оценки",
          "property_return_regime": "monetary",
          "evidence": [
            {"clause_ref": "п. 8.1", "quote": "Договор заключён на 5 лет."},
            {"clause_ref": "п. 8.2", "quote": "Досрочный выход товарища возможен только при наличии уважительных причин с возмещением убытков остальным товарищам."},
            {"clause_ref": "п. 8.5", "quote": "При прекращении договора вклады возвращаются в денежной форме в размере их оценки."}
          ]
        }

        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Договор действует до достижения цели."
        Ответ:
        {
          "withdrawal_right_status": "not_defined",
          "withdrawal_right_details": "Данные не определены",
          "withdrawal_regime_code": "not_defined",
          "withdrawal_regime_details": "Данные не определены",
          "notice_period_status": "not_defined",
          "notice_period_details": "Данные не определены",
          "valuation_method_status": "not_defined",
          "valuation_method_details": "Данные не определены",
          "payment_deadline_status": "not_defined",
          "payment_deadline_details": "Данные не определены",
          "termination_grounds_status": "not_defined",
          "termination_grounds_details": "Данные не определены",
          "property_division_status": "not_defined",
          "property_division_details": "Данные не определены",
          "property_return_regime": "not_defined",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Все 16 ключей (15 полей + evidence) присутствуют в JSON?
        2. Найдена ли прямая цитата о праве на выход?
        3. Определён ли режим выхода (бессрочный / срочный)?
        4. Найден ли срок уведомления?
        5. Найден ли способ оценки доли?
        6. Найден ли срок выплаты доли?
        7. Найдены ли основания прекращения и порядок раздела?
        8. Определён ли режим возврата вкладов?
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "withdrawal_right_status": "<defined / not_defined>",
          "withdrawal_right_details": "<текст или 'Данные не определены'>",
          "withdrawal_regime_code": "<free / with_cause / mixed / not_defined>",
          "withdrawal_regime_details": "<текст или 'Данные не определены'>",
          "notice_period_status": "<defined / not_defined>",
          "notice_period_details": "<текст или 'Данные не определены'>",
          "valuation_method_status": "<defined / not_defined>",
          "valuation_method_details": "<текст или 'Данные не определены'>",
          "payment_deadline_status": "<defined / not_defined>",
          "payment_deadline_details": "<текст или 'Данные не определены'>",
          "termination_grounds_status": "<defined / not_defined>",
          "termination_grounds_details": "<текст или 'Данные не определены'>",
          "property_division_status": "<defined / not_defined>",
          "property_division_details": "<текст или 'Данные не определены'>",
          "property_return_regime": "<in_kind / monetary / mixed / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 800

    retrieval:
      retrieval_profile: "termination_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "право на выход выход из товарищества уведомление о выходе выдел доли оценка доли при выходе срок выплаты прекращение договора расторжение договора раздел имущества ликвидация общего имущества возврат вклада в натуре денежная компенсация доли основания прекращения бессрочный срочный уважительная причина"
      preferred_unit_types:
        - termination_provision
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - technical_fragment
      preferred_clause_functions:
        - remedies
        - procedures
      negative_keywords:
        - "вклад товарища"
        - "распределение прибыли"
        - "доверенность"
        - "налоговый учёт"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.55, 1.0]
        boost: 0.15
        scope: segment
      context_k: 10
      max_chunks: 14
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "remedies"
        - "procedures"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1800

      compact_output: false

      presence_signal:
        field: "withdrawal_and_termination_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора простого товарищества
        сведения о выходе, прекращении и разделе имущества.
        Не анализируй вклады как таковые, прибыль, ведение дел или налоги.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. withdrawal_and_termination_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (withdrawal_right_status, withdrawal_regime_code,
              notice_period_status, valuation_method_status,
              payment_deadline_status, termination_grounds_status,
              property_division_status, property_return_regime)
             ≠ "not_defined";
           - "missing" — если все восемь содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - withdrawal_right_status = "not_defined";
           - withdrawal_regime_code = "not_defined";
           - notice_period_status = "not_defined";
           - valuation_method_status = "not_defined";
           - payment_deadline_status = "not_defined";
           - termination_grounds_status = "not_defined";
           - property_division_status = "not_defined";
           - property_return_regime = "not_defined";
           - все *_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. withdrawal_right_status:
           - "defined" — если прямо указано право товарища
             на выход из товарищества;
           - "not_defined" — иначе.

        2. withdrawal_right_details:
           Краткое user-facing описание условия о праве на выход.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        3. withdrawal_regime_code:
           Используй только одно из значений:
           - "free" — если договор бессрочный и товарищ вправе выйти
             в любое время;
           - "with_cause" — если для выхода требуется уважительная
             причина или возмещение убытков;
           - "mixed" — если для разных случаев установлены разные режимы;
           - "not_defined" — иначе.

        4. withdrawal_regime_details:
           Краткое user-facing обоснование режима выхода.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        5. notice_period_status:
           - "defined" — если прямо указан срок уведомления о выходе;
           - "not_defined" — иначе.

        6. notice_period_details:
           Краткое user-facing описание срока уведомления.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        7. valuation_method_status:
           - "defined" — если прямо указан способ оценки доли при выходе;
           - "not_defined" — иначе.

        8. valuation_method_details:
           Краткое user-facing описание способа оценки
           (например: "по рыночной стоимости независимым оценщиком").
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        9. payment_deadline_status:
           - "defined" — если прямо указан срок выплаты доли выходящему
             товарищу;
           - "not_defined" — иначе.

        10. payment_deadline_details:
            Краткое user-facing описание срока выплаты.
            Если данных нет — "Данные не определены".
            Если данные противоречивы — "Не удалось определить".

        11. termination_grounds_status:
            - "defined" — если прямо перечислены основания прекращения
              договора (смерть, ликвидация, банкротство, отказ,
              истечение срока и т.п.);
            - "not_defined" — иначе.

        12. termination_grounds_details:
            Краткое user-facing перечисление оснований прекращения.
            Если данных нет — "Данные не определены".
            Если данные противоречивы — "Не удалось определить".

        13. property_division_status:
            - "defined" — если прямо указан порядок раздела имущества
              при прекращении;
            - "not_defined" — иначе.

        14. property_division_details:
            Краткое user-facing описание порядка раздела.
            Если данных нет — "Данные не определены".
            Если данные противоречивы — "Не удалось определить".

        15. property_return_regime:
            Используй только одно из значений:
            - "in_kind" — если прямо указан возврат вкладов в натуре;
            - "monetary" — если предусмотрена денежная компенсация;
            - "mixed" — сочетание;
            - "not_defined" — иначе.
        </task>

        <context_rules>
        - Перед остальными полями заполни withdrawal_and_termination_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не делай выводов по типовой структуре договора.
        - Не извлекай сведения о вкладах как таковых, распределении прибыли, ведении дел, доверенностях, налоговом учёте и иных нерелевантных темах.
        - withdrawal_regime_code = "free" если договор бессрочный и товарищ вправе выйти в любое время.
        - withdrawal_regime_code = "with_cause" если для выхода требуется уважительная причина или возмещение убытков.
        - property_return_regime = "in_kind" если прямо указан возврат вкладов в натуре; "monetary" — денежная компенсация.
        - termination_grounds_details: перечислить все указанные в договоре основания (смерть, ликвидация, банкротство, отказ, истечение срока и т.п.).
        - Если в разных фрагментах указаны противоречивые сведения и конфликт нельзя разрешить по тексту — статус → "not_defined", текстовое поле → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни права на выход, ни режима выхода,
           ни срока уведомления, ни способа оценки, ни срока выплаты,
           ни оснований прекращения, ни раздела имущества,
           ни режима возврата вкладов.
           → presence = "missing";
             все *_status = "not_defined";
             withdrawal_regime_code = "not_defined";
             property_return_regime = "not_defined";
             все *_details = "Данные не определены".

        2. Неполное раскрытие или прямое исключение.
           а) Общая фраза: «Товарищ вправе выйти из товарищества»
              без указания срока уведомления и порядка выплаты доли.
              → presence = "present";
                withdrawal_right_status = "defined";
                notice_period_status = "not_defined";
                valuation_method_status = "not_defined".
           б) Прямо указано, что выход невозможен до истечения срока
              или до достижения цели.
              → presence = "present";
                withdrawal_right_status = "defined";
                withdrawal_regime_details содержит дословную
                формулировку ограничения.

        3. Противоречие между фрагментами.
           В разных частях договора указаны противоречивые сроки
           уведомления, оценки доли или порядка раздела.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             соответствующий *_details = "Не удалось определить".

        4. Специфика темы — специфический режим возврата вкладов.
           Указано, что вещи, переданные в пользование, возвращаются
           в натуре, а денежные вклады возвращаются в денежной форме.
           → presence = "present";
             property_return_regime = "mixed";
             property_division_details содержит описание механизма.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для withdrawal_and_termination_check_presence используй только: "present", "missing", "unclear".
        - Для enum-полей *_status используй только: "defined", "not_defined".
        - Для withdrawal_regime_code используй только: "free", "with_cause", "mixed", "not_defined".
        - Для property_return_regime используй только: "in_kind", "monetary", "mixed", "not_defined".
        - Fallback при отсутствии данных:
          * все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

