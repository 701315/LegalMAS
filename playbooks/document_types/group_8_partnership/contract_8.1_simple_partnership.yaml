  - id: implicit_partnership
    name: "Негласное товарищество (ст. 1054 ГК РФ)"
    description: >
      Фактографическая проверка режима раскрытия существования товарищества
      третьим лицам: открытое / негласное / смешанное. Режим ответственности
      публичного товарища, солидарная ответственность при раскрытии
      (п. 2–3 ст. 1054 ГК РФ), последствия прекращения негласного
      товарищества.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 160

    rules:
      keywords:
        - "негласное товарищество"
        - "не раскрывается"
        - "тайное товарищество"
        - "публично действует"
        - "от имени товарищества"
        - "раскрытие существования"
        - "солидарная ответственность при раскрытии"
        - "тайный товарищ"
        - "скрытое участие"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)негласн[а-яё]+\\s+товариществ"
        - "(?i)не\\s+раскрыва[а-яё]+\\s+существован"
        - "(?i)публичн[а-яё]+\\s+действу"
        - "(?i)(тайный|скрытый)\\s+товарищ"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор простого товарищества (ст. 1054 ГК РФ).
        Проверяется только один вопрос: режим раскрытия существования
        товарищества третьим лицам и ответственность в каждом режиме.
        Нормативные ориентиры:
        - п. 1 ст. 1054 ГК РФ — договором может быть предусмотрено,
          что его существование НЕ РАСКРЫВАЕТСЯ третьим лицам (негласное
          товарищество). Каждый товарищ отвечает по сделкам только
          от своего имени.
        - п. 2 ст. 1054 ГК РФ — при прекращении негласного товарищества
          товарищи отвечают СОЛИДАРНО по неисполненным общим обязательствам
          перед третьими лицами.
        - п. 3 ст. 1054 ГК РФ — если третьему лицу стало известно
          о существовании негласного товарищества, оно вправе требовать
          исполнения от всех товарищей солидарно.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Если договор прямо не указывает негласность — по умолчанию
          применяется открытый режим (НЕ выводи негласность).

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Режим раскрытия существования товарищества третьим лицам:
           открытое / негласное / смешанное.
        2. Кто публично действует от имени товарищества.
        3. Условие об ответственности при раскрытии существования
           товарищества третьему лицу.
        4. Порядок ответственности при прекращении негласного товарищества.
        5. Наличие прямого запрета на раскрытие существования
           товарищества.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Для enum-полей (*_status, disclosure_regime_code) при отсутствии
           данных возвращай "not_defined"; для non_disclosure_prohibition —
           "not_detected".
        4. Для строковых *_details при отсутствии данных возвращай строго
           "Данные не определены".
        5. Не используй "None", "null", пустые строки или отсутствующие ключи.
        6. В evidence включай только прямые цитаты из текста договора.
        7. disclosure_regime_code: "open" (открытое) / "implicit" (негласное) /
           "mixed" (смешанное) / "not_defined".
        8. Если договор прямо не указывает негласность — disclosure_regime_code
           = "not_defined" (НЕ выводи "open" автоматически).
        9. non_disclosure_prohibition = "detected" если в договоре прямо
           запрещено раскрывать существование товарищества третьим лицам.
        10. Верни РОВНО один валидный JSON-объект со всеми 10 ключами
            (9 полей + evidence), пригодный для парсинга через json.loads
            без предварительной обработки. Без markdown, без ```json,
            без комментариев, без текста до или после. Начни ответ сразу
            с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — негласное товарищество с публичным товарищем:
        Фрагмент:
        "Существование товарищества не раскрывается третьим лицам.
        Публично от имени товарищества действует Товарищ 1. Если третьему
        лицу станет известно о существовании товарищества, оно вправе
        требовать исполнения от всех товарищей солидарно. При прекращении
        товарищества товарищи отвечают солидарно по неисполненным общим
        обязательствам."
        Ответ:
        {
          "disclosure_regime_code": "implicit",
          "disclosure_regime_details": "существование товарищества не раскрывается третьим лицам",
          "public_partner_status": "defined",
          "public_partner_details": "Товарищ 1 действует публично от имени товарищества",
          "disclosed_liability_status": "defined",
          "disclosed_liability_details": "при раскрытии существования товарищества третьему лицу — солидарная ответственность всех товарищей",
          "termination_liability_status": "defined",
          "termination_liability_details": "при прекращении товарищества — солидарная ответственность по неисполненным общим обязательствам",
          "non_disclosure_prohibition": "detected",
          "evidence": [
            {"clause_ref": "п. 14.1", "quote": "Существование товарищества не раскрывается третьим лицам."},
            {"clause_ref": "п. 14.2", "quote": "Публично от имени товарищества действует Товарищ 1."},
            {"clause_ref": "п. 14.3", "quote": "Если третьему лицу станет известно о существовании товарищества, оно вправе требовать исполнения от всех товарищей солидарно."},
            {"clause_ref": "п. 14.4", "quote": "При прекращении товарищества товарищи отвечают солидарно по неисполненным общим обязательствам."}
          ]
        }

        Пример 2 — открытое товарищество:
        Фрагмент:
        "Товарищи действуют открыто, их существование не скрывается
        от третьих лиц. От имени товарищества выступает каждый товарищ."
        Ответ:
        {
          "disclosure_regime_code": "open",
          "disclosure_regime_details": "товарищи действуют открыто, существование не скрывается",
          "public_partner_status": "defined",
          "public_partner_details": "от имени товарищества выступает каждый товарищ",
          "disclosed_liability_status": "not_defined",
          "disclosed_liability_details": "Данные не определены",
          "termination_liability_status": "not_defined",
          "termination_liability_details": "Данные не определены",
          "non_disclosure_prohibition": "not_detected",
          "evidence": [
            {"clause_ref": "п. 14.1", "quote": "Товарищи действуют открыто, их существование не скрывается от третьих лиц."}
          ]
        }

        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Стороны обязуются исполнять договор."
        Ответ:
        {
          "disclosure_regime_code": "not_defined",
          "disclosure_regime_details": "Данные не определены",
          "public_partner_status": "not_defined",
          "public_partner_details": "Данные не определены",
          "disclosed_liability_status": "not_defined",
          "disclosed_liability_details": "Данные не определены",
          "termination_liability_status": "not_defined",
          "termination_liability_details": "Данные не определены",
          "non_disclosure_prohibition": "not_detected",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Все 10 ключей (9 полей + evidence) присутствуют в JSON?
        2. disclosure_regime_code — строго из allowed_values?
        3. Все *_status — строго "defined" / "not_defined"?
        4. non_disclosure_prohibition — строго "detected" / "not_detected"?
        5. Проверена ли ответственность при раскрытии и прекращении?
        6. Все *_details заполнены или "Данные не определены"?
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "disclosure_regime_code": "<open / implicit / mixed / not_defined>",
          "disclosure_regime_details": "<текст или 'Данные не определены'>",
          "public_partner_status": "<defined / not_defined>",
          "public_partner_details": "<текст или 'Данные не определены'>",
          "disclosed_liability_status": "<defined / not_defined>",
          "disclosed_liability_details": "<текст или 'Данные не определены'>",
          "termination_liability_status": "<defined / not_defined>",
          "termination_liability_details": "<текст или 'Данные не определены'>",
          "non_disclosure_prohibition": "<detected / not_detected>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 700

    retrieval:
      retrieval_profile: "definitions_check"
      corpus_scope: "primary_segment"
