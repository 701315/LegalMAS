        Не анализируй вклады как таковые, распределение прибыли,
        прекращение или неустойки.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 10 полей + evidence (всего 11 ключей):
        1. non_resident_status — "defined" или "not_defined".
        2. non_resident_details — перечень нерезидентов.
        3. currency_of_contributions_status — "defined" или "not_defined".
        4. currency_of_contributions_details — валюта вкладов и расчётов.
        5. settlement_regime_status — "defined" или "not_defined".
        6. settlement_regime_details — режим расчётов.
        7. currency_control_obligations_status — "defined" или "not_defined".
        8. currency_control_obligations_details — обязанности валютного
           контроля.
        9. repatriation_obligations_status — "defined" или "not_defined".
        10. repatriation_obligations_details — обязанности репатриации.

        Если данные отсутствуют:
        - для *_status: "not_defined"
        - для *_details: "Данные не определены"
        </task>

        <rules>
        - Используй только текст договора.
        - non_resident_status = "defined" только при прямом указании
          нерезидента среди товарищей.
        - repatriation_obligations_details — прямое условие о репатриации
          валютной выручки (ст. 19 173-ФЗ).
        - Верни РОВНО один валидный JSON-объект со всеми 11 ключами
          (10 полей + evidence), пригодный для парсинга через json.loads
          без предварительной обработки. Без markdown, без ```json,
          без комментариев, без текста до или после. Начни ответ сразу
          с { и закончи }.
        </rules>

        <cove>
