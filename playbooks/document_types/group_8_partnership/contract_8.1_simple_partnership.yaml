      - "(?i)\\bпомещени[ея]\\b"
      - "(?i)кадастров[ыо]й\\s+номер"
      - "(?i)\\bЕГРН\\b"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 3: SHARED PATTERNS
#  Читается: DocTypeCheckLoader через _resolve_yaml_templates()
# ════════════════════════════════════════════════════════════════════════════

shared_patterns:
  money_amount: "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|тыс|млн)"
  date_pattern: "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"
  percent_pattern: "(?i)\\b\\d+[.,]?\\d*\\s*%"
  inn_pattern: "(?i)\\bИНН\\s*\\d{10,12}\\b"
  ogrn_pattern: "(?i)\\bОГРН\\s*\\d{13,15}\\b"
  passport_data: "(?i)паспорт\\s+серия\\s+\\d{4}\\s+№?\\s*\\d{6}"
  article_gk_ref: "(?i)ст\\.?\\s*\\d+\\s*ГК\\s*РФ"

compliance_rules: []

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: CHECKS_V8 — единственный рабочий слой юридического анализа
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  - id: partnership_subject_extraction
    name: "Стороны, общая цель, тип деятельности и срок договора"
    description: >
      Фактографическая проверка идентификации всех товарищей, общей цели
      совместной деятельности, типа деятельности (предпринимательская /
      некоммерческая) и срока действия договора.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 10

    rules:
      keywords:
        - "товарищ"
        - "участник"
        - "стороны"
        - "общая цель"
        - "цель совместной деятельности"
        - "извлечение прибыли"
        - "коммерческая деятельность"
        - "некоммерческая цель"
        - "предпринимательская деятельность"
        - "индивидуальный предприниматель"
        - "коммерческая организация"
        - "срок действия"
        - "бессрочный"
        - "без образования юридического лица"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(товарищ|участник)\\s*\\d"
        - "(?i)общ[а-яё]+\\s+цел[ььи]"
        - "(?i)без\\s+образован[ияи]\\s+юридическ"
        - "(?i)(индивидуальн[а-яё]+\\s+предпринимател|коммерческ[а-яё]+\\s+организац)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор простого товарищества (Глава 55 ГК РФ).
        Проверяется только один вопрос: стороны, общая цель, тип деятельности
        и срок договора.
        Нормативные ориентиры:
        - ст. 1041 ГК РФ — понятие договора простого товарищества
        - п. 1 ст. 432 ГК РФ — существенные условия (предмет)
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Без общей цели договор не соответствует ст. 1041 ГК РФ.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Количество товарищей и их идентификацию (наименования / ФИО).
        2. Общую цель совместной деятельности.
        3. Тип цели: извлечение прибыли, некоммерческая или смешанная.
        4. Является ли деятельность предпринимательской.
        5. Есть ли прямое указание «без образования юридического лица».
        6. Срок действия (срочный / бессрочный).

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Для enum-полей (*_status, goal_type, entrepreneurial_activity)
           при отсутствии данных возвращай "not_defined".
        4. Для строковых *_details при отсутствии данных возвращай строго
           "Данные не определены".
        5. Не используй "None", "null", пустые строки или отсутствующие ключи.
        6. В evidence включай только прямые цитаты из текста договора.
        7. Если цель сформулирована абстрактно («в целях, не противоречащих
           закону»), common_goal_status = "defined", но goal_type = "not_defined".
        8. Верни РОВНО один валидный JSON-объект со всеми 13 ключами
           (12 полей + evidence), пригодный для парсинга через json.loads
           без предварительной обработки. Без markdown, без ```json,
           без комментариев, без текста до или после. Начни ответ сразу
           с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — данные определены:
        Фрагмент:
        "Товарищ 1 — ООО «Строй-Пример», Товарищ 2 — ИП Петров П.П.
        Стороны обязуются соединить вклады и совместно действовать
        без образования юридического лица для извлечения прибыли
        от строительства жилого комплекса.
        Договор действует до полного завершения строительства."
        Ответ:
        {
          "partners_count_status": "defined",
          "partners_count_details": "2 товарища",
          "partners_identification_status": "defined",
          "partners_identification_details": "ООО «Строй-Пример»; ИП Петров П.П.",
          "common_goal_status": "defined",
          "common_goal_details": "извлечение прибыли от строительства жилого комплекса",
          "goal_type": "profit",
          "entrepreneurial_activity": "yes",
          "no_legal_entity_status": "defined",
          "no_legal_entity_details": "без образования юридического лица",
          "contract_term_status": "defined",
          "contract_term_details": "до полного завершения строительства",
          "evidence": [
            {"clause_ref": "преамбула", "quote": "Товарищ 1 — ООО «Строй-Пример», Товарищ 2 — ИП Петров П.П."},
            {"clause_ref": "п. 1.1", "quote": "Стороны обязуются соединить вклады и совместно действовать без образования юридического лица для извлечения прибыли от строительства жилого комплекса."},
            {"clause_ref": "п. 7.1", "quote": "Договор действует до полного завершения строительства."}
          ]
        }

        Пример 2 — абстрактная цель (edge-case):
        Фрагмент:
        "Стороны объединяют усилия для достижения целей, не противоречащих закону."
        Ответ:
        {
          "partners_count_status": "not_defined",
          "partners_count_details": "Данные не определены",
          "partners_identification_status": "not_defined",
          "partners_identification_details": "Данные не определены",
          "common_goal_status": "defined",
          "common_goal_details": "достижение целей, не противоречащих закону",
          "goal_type": "not_defined",
          "entrepreneurial_activity": "not_defined",
          "no_legal_entity_status": "not_defined",
          "no_legal_entity_details": "Данные не определены",
          "contract_term_status": "not_defined",
          "contract_term_details": "Данные не определены",
          "evidence": [
            {"clause_ref": "п. 1.1", "quote": "Стороны объединяют усилия для достижения целей, не противоречащих закону."}
          ]
        }

        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Стороны заключили настоящий договор."
        Ответ:
        {
          "partners_count_status": "not_defined",
          "partners_count_details": "Данные не определены",
          "partners_identification_status": "not_defined",
          "partners_identification_details": "Данные не определены",
          "common_goal_status": "not_defined",
          "common_goal_details": "Данные не определены",
          "goal_type": "not_defined",
          "entrepreneurial_activity": "not_defined",
          "no_legal_entity_status": "not_defined",
          "no_legal_entity_details": "Данные не определены",
          "contract_term_status": "not_defined",
          "contract_term_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Все 13 ключей (12 полей + evidence) присутствуют в JSON?
        2. Найдена ли прямая цитата с идентификацией товарищей?
        3. Найдена ли прямая цитата с общей целью?
        4. Определён ли тип цели по тексту (или "not_defined")?
        5. Найдена ли прямая цитата «без образования юридического лица»?
        6. Найден ли срок действия?
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "partners_count_status": "<defined / not_defined>",
          "partners_count_details": "<количество или 'Данные не определены'>",
          "partners_identification_status": "<defined / not_defined>",
          "partners_identification_details": "<идентификация или 'Данные не определены'>",
          "common_goal_status": "<defined / not_defined>",
          "common_goal_details": "<описание или 'Данные не определены'>",
          "goal_type": "<profit / non_profit / mixed / not_defined>",
          "entrepreneurial_activity": "<yes / no / not_defined>",
          "no_legal_entity_status": "<defined / not_defined>",
          "no_legal_entity_details": "<цитата или 'Данные не определены'>",
          "contract_term_status": "<defined / not_defined>",
          "contract_term_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 650

    retrieval:
      retrieval_profile: "definitions_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "товарищ участник стороны общая цель цель совместной деятельности извлечение прибыли коммерческая деятельность некоммерческая цель без образования юридического лица срок действия бессрочный предпринимательская деятельность индивидуальный предприниматель коммерческая организация"
      preferred_unit_types:
        - obligation
        - general_provision
        - effective_date
      excluded_unit_types:
        - definition
        - technical_fragment
      preferred_clause_functions:
        - definitions
        - obligations
      negative_keywords:
        - "вклад"
        - "распределение прибыли"
        - "ведение дел"
        - "доверенность"
        - "выход из товарищества"
        - "прекращение"
        - "неустойка"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 0.25]
        boost: 0.25
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "definitions"
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1200
      compact_output: false
      store_payload: true
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора простого товарищества
        сведения о сторонах, общей цели, типе деятельности и сроке договора.
        Не анализируй вклады, распределение прибыли, ведение дел или
        прекращение.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 12 полей + evidence (всего 13 ключей):
        1. partners_count_status — "defined" или "not_defined".
        2. partners_count_details — количество товарищей.
        3. partners_identification_status — "defined" или "not_defined".
        4. partners_identification_details — идентификация всех товарищей.
        5. common_goal_status — "defined" или "not_defined".
        6. common_goal_details — описание общей цели.
        7. goal_type — "profit" / "non_profit" / "mixed" / "not_defined".
        8. entrepreneurial_activity — "yes" / "no" / "not_defined".
        9. no_legal_entity_status — "defined" или "not_defined".
        10. no_legal_entity_details — прямая цитата «без образования
            юридического лица» или "Данные не определены".
        11. contract_term_status — "defined" или "not_defined".
        12. contract_term_details — срок действия.

        Если данные отсутствуют:
        - статус = "not_defined"
        - текст = "Данные не определены"
        </task>

        <rules>
        - Используй только текст договора.
        - goal_type: "profit" если прямо указано извлечение прибыли;
          "non_profit" если прямо указана некоммерческая цель;
          "mixed" если указаны обе;
          "not_defined" если цель абстрактна.
        - entrepreneurial_activity: "yes" только если прямо указано
          предпринимательская деятельность или участие ИП/коммерческой
          организации.
        - Если цель сформулирована абстрактно («в целях, не противоречащих
          закону»), common_goal_status = "defined", goal_type = "not_defined".
        - Верни РОВНО один валидный JSON-объект со всеми 13 ключами
          (12 полей + evidence), пригодный для парсинга через json.loads
          без предварительной обработки. Без markdown, без ```json,
          без комментариев, без текста до или после. Начни ответ сразу
          с { и закончи }.
        </rules>

        <cove>
        1. Все 13 ключей (12 полей + evidence) присутствуют в JSON?
        2. Каждый *_status — строго "defined" / "not_defined"?
        3. goal_type — строго из allowed_values?
        4. entrepreneurial_activity — строго из allowed_values?
        5. Все *_details заполнены или "Данные не определены"?
        Не выводи шаги. Верни только JSON.
        </cove>
      fields:
        - name: "partners_count_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения количества товарищей."
          required: true
        - name: "partners_count_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Количество товарищей"
          description: "Количество товарищей в договоре."
          required: true
        - name: "partners_identification_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус идентификации товарищей."
          required: true
        - name: "partners_identification_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Товарищи"
          description: "Идентификация всех товарищей."
          required: true
        - name: "common_goal_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения общей цели."
          required: true
        - name: "common_goal_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Общая цель"
          description: "Описание общей цели совместной деятельности."
          required: true
        - name: "goal_type"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 4
          label: "Тип цели"
          allowed_values: ["profit", "non_profit", "mixed", "not_defined"]
          description: "Тип цели деятельности: извлечение прибыли, некоммерческая, смешанная."
          required: false
        - name: "entrepreneurial_activity"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 5
          label: "Предпринимательская деятельность"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Является ли деятельность предпринимательской (влияет на режим ответственности по п. 2 ст. 1047 ГК РФ)."
          required: false
        - name: "no_legal_entity_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания «без образования юридического лица»."
          required: false
        - name: "no_legal_entity_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Отсутствие юрлица"
          description: "Прямая цитата «без образования юридического лица» для Drawer."
          required: false
        - name: "contract_term_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения срока договора."
          required: false
        - name: "contract_term_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 6
          label: "Срок действия"
          description: "Срок действия договора."
          required: false

  - id: contributions_check
    name: "Состав, размер и денежная оценка вкладов товарищей"
    description: >
      Фактографическая проверка состава вкладов каждого товарища (денежные,
      имущественные, неденежные), их денежной оценки, способа оценки и сроков
      внесения.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 20

    rules:
      keywords:
        - "вклад товарища"
        - "соединение вкладов"
        - "размер вклада"
        - "денежный вклад"
        - "имущественный вклад"
        - "имущественное право"
        - "профессиональные знания"
        - "деловая репутация"
        - "деловые связи"
        - "денежная оценка"
        - "оценка вклада"
        - "независимая оценка"
        - "отчет об оценке"
        - "оценщик"
        - "внесение вклада"
        - "срок внесения"
        - "порядок внесения"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽)"
        - "(?i)(оценк|стоимост)\\s+вклад"
        - "(?i)(срок|порядок)\\s+внесени"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор простого товарищества (ст. 1042 ГК РФ).
        Проверяется только один вопрос: вклады товарищей, их оценка,
        способ оценки и сроки внесения.
        Нормативные ориентиры:
        - ст. 1042 ГК РФ — вклады товарищей
        - п. 2 ст. 245 ГК РФ — презумпция равенства долей при отсутствии соглашения
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Без денежной оценки неденежных вкладов невозможно определить доли.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Состав вклада каждого товарища (деньги, имущество, знания,
           репутация, связи, имущественные права).
        2. Денежную оценку каждого вклада.
        3. Способ оценки (согласование сторон / независимый оценщик / смешанный).
        4. Сроки внесения вкладов.
        5. Наличие неденежных вкладов и их состав.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Для enum-полей (*_status, non_monetary_present, valuation_method)
           при отсутствии данных возвращай "not_defined".
        4. Для строковых *_details / *_method при отсутствии данных возвращай
           строго "Данные не определены".
        5. Не используй "None", "null", пустые строки или отсутствующие ключи.
        6. В evidence включай только прямые цитаты из текста договора.
        7. Если денежная оценка отсутствует, но вклады описаны —
           contributions_status = "defined", valuation_status = "not_defined".
           Доли в таком случае считаются равными (п. 2 ст. 245 ГК РФ),
           если иное не следует из соглашения.
        8. Верни РОВНО один валидный JSON-объект со всеми 10 ключами
           (9 полей + evidence), пригодный для парсинга через json.loads
           без предварительной обработки. Без markdown, без ```json,
           без комментариев, без текста до или после. Начни ответ сразу
           с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — вклады и оценка определены:
        Фрагмент:
        "Товарищ 1 вносит денежный вклад в размере 5 000 000 рублей.
        Товарищ 2 вносит профессиональные знания и деловые связи,
        оцениваемые сторонами в 2 000 000 рублей. Вклады вносятся
        в течение 30 дней с даты подписания договора."
        Ответ:
        {
          "contributions_status": "defined",
          "contributions_details": "Товарищ 1: денежный вклад 5 000 000 рублей; Товарищ 2: профессиональные знания и деловые связи — 2 000 000 рублей",
          "valuation_status": "defined",
          "valuation_details": "Товарищ 1 — 5 000 000 рублей; Товарищ 2 — 2 000 000 рублей",
          "valuation_method": "согласование сторон",
          "non_monetary_present": "yes",
          "non_monetary_details": "профессиональные знания, деловые связи (Товарищ 2)",
          "contribution_deadline_status": "defined",
          "contribution_deadline_details": "в течение 30 дней с даты подписания",
          "evidence": [
            {"clause_ref": "п. 2.1", "quote": "Товарищ 1 вносит денежный вклад в размере 5 000 000 рублей."},
            {"clause_ref": "п. 2.1", "quote": "Товарищ 2 вносит профессиональные знания и деловые связи, оцениваемые сторонами в 2 000 000 рублей."},
            {"clause_ref": "п. 2.2", "quote": "Вклады вносятся в течение 30 дней с даты подписания договора."}
          ]
        }

        Пример 2 — вклады описаны, оценка отсутствует (edge-case):
        Фрагмент:
        "Товарищ 1 вносит денежные средства, Товарищ 2 — оборудование
        и профессиональные знания. Оценка вкладов не производится."
        Ответ:
        {
          "contributions_status": "defined",
          "contributions_details": "Товарищ 1: денежные средства; Товарищ 2: оборудование, профессиональные знания",
          "valuation_status": "not_defined",
          "valuation_details": "Данные не определены",
          "valuation_method": "not_defined",
          "non_monetary_present": "yes",
          "non_monetary_details": "оборудование, профессиональные знания (Товарищ 2)",
          "contribution_deadline_status": "not_defined",
          "contribution_deadline_details": "Данные не определены",
          "evidence": [
            {"clause_ref": "п. 2.1", "quote": "Товарищ 1 вносит денежные средства, Товарищ 2 — оборудование и профессиональные знания."},
            {"clause_ref": "п. 2.3", "quote": "Оценка вкладов не производится."}
          ]
        }

        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Стороны обязуются соединить вклады."
        Ответ:
        {
          "contributions_status": "not_defined",
          "contributions_details": "Данные не определены",
          "valuation_status": "not_defined",
          "valuation_details": "Данные не определены",
          "valuation_method": "not_defined",
          "non_monetary_present": "not_defined",
          "non_monetary_details": "Данные не определены",
          "contribution_deadline_status": "not_defined",
          "contribution_deadline_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Все 10 ключей (9 полей + evidence) присутствуют в JSON?
        2. Найдена ли прямая цитата о составе вклада каждого товарища?
        3. Найдена ли прямая цитата о денежной оценке (или её отсутствии)?
        4. Определён ли способ оценки (согласование / оценщик / смешанный)?
        5. Определён ли состав неденежных вкладов?
        6. Найдена ли прямая цитата о сроках внесения?
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "contributions_status": "<defined / not_defined>",
          "contributions_details": "<состав вкладов или 'Данные не определены'>",
          "valuation_status": "<defined / partial / not_defined>",
          "valuation_details": "<значения оценки или 'Данные не определены'>",
          "valuation_method": "<согласование сторон / независимый оценщик / смешанный / not_defined>",
          "non_monetary_present": "<yes / no / not_defined>",
          "non_monetary_details": "<состав неденежных вкладов или 'Данные не определены'>",
          "contribution_deadline_status": "<defined / not_defined>",
          "contribution_deadline_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 650

    retrieval:
      retrieval_profile: "payment_terms_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "вклад товарища соединение вкладов размер вклада денежный вклад имущественный вклад имущественное право профессиональные знания деловая репутация деловые связи денежная оценка оценка вклада независимая оценка отчет об оценке сроки внесения вкладов порядок внесения неденежный вклад"
      preferred_unit_types:
        - obligation
        - general_provision
        - payment_term
      excluded_unit_types:
        - definition
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "распределение прибыли"
        - "ведение дел"
        - "доверенность"
        - "выход из товарищества"
        - "прекращение"
        - "неустойка"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.05, 0.45]
        boost: 0.18
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
