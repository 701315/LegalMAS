          allowed_values: ["all_period", "before_exit_only", "not_defined"]
          description: "Объём сохраняемой ответственности выбывшего товарища."
          required: false

        - name: "post_term_liability_term_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус срока сохранения ответственности."
          required: false

        - name: "post_term_liability_term_details"
          type: "string"
