      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1500

      compact_output: false

      presence_signal:
        field: "death_bankruptcy_succession_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора простого товарищества
        сведения о последствиях смерти, банкротства, ликвидации товарища
        и правопреемстве.
        Не анализируй вклады как таковые, прибыль, ведение дел или налоги.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. death_bankruptcy_succession_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (trigger_type, termination_consequence_code,
              continuation_with_successors_status,
              successor_admission_status, buyout_right_status,
              buyout_deadline_status) ≠ "not_defined";
           - "missing" — если все шесть содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - trigger_type = "not_defined";
           - termination_consequence_code = "not_defined";
           - continuation_with_successors_status = "not_defined";
           - successor_admission_status = "not_defined";
           - buyout_right_status = "not_defined";
           - buyout_deadline_status = "not_defined";
           - все *_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. trigger_type:
           Используй только одно из значений:
           - "death_natural" — смерть гражданина-товарища;
           - "death_declared" — объявление умершим;
           - "missing_person" — признание безвестно отсутствующим;
           - "bankruptcy" — признание товарища банкротом;
           - "liquidation_entity" — ликвидация или реорганизация
             юридического лица-товарища;
           - "incapacity" — признание недееспособным или ограничение
             дееспособности;
           - "other" — иное событие / общая формулировка
             («выбытие товарища»);
           - "not_defined" — если событие прямо не указано.

        2. termination_consequence_code:
           Используй только одно из значений:
           - "terminate" — договор прекращается;
           - "continue_with_successors" — продолжается с правопреемниками
             автоматически;
           - "continue_with_consent" — продолжение требует согласия
             остальных товарищей или правопреемников;
           - "mixed" — сочетание;
           - "not_defined" — иначе.

        3. termination_consequence_details:
           Прямая цитата о последствии события.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        4. continuation_with_successors_status:
           - "defined" — если прямо указано условие продолжения договора
             с правопреемниками / наследниками;
           - "not_defined" — иначе.

        5. continuation_with_successors_details:
           Краткое user-facing описание условия продолжения
           с правопреемниками.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        6. successor_admission_status:
           - "defined" — если прямо указан порядок вступления
             правопреемника в товарищество;
           - "not_defined" — иначе.

        7. successor_admission_details:
           Краткое user-facing описание порядка вступления
           правопреемника.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        8. buyout_right_status:
           - "defined" — если прямо указано право остальных товарищей
             на выкуп доли выбывшего товарища;
           - "not_defined" — иначе.

        9. buyout_right_details:
           Краткое user-facing описание права выкупа доли.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        10. buyout_deadline_status:
            - "defined" — если прямо указан срок выкупа доли;
            - "not_defined" — иначе.

        11. buyout_deadline_details:
            Краткое user-facing описание срока выкупа.
            Если данных нет — "Данные не определены".
            Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни death_bankruptcy_succession_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не делай выводов по типовой структуре договора.
        - Не извлекай сведения о вкладах как таковых, распределении прибыли, ведении дел, доверенностях, налоговом учёте и иных нерелевантных темах.
        - trigger_type фиксируй по типу события, прямо указанного в договоре. При общей формулировке («выбытие товарища») — "other".
        - termination_consequence_code = "continue_with_consent" если для продолжения требуется согласие остальных товарищей или правопреемников.
        - successor_admission_details: порядок вступления правопреемника (по правилам о вступлении нового товарища / автоматически / по решению остальных).
        - Если в разных фрагментах указаны противоречивые сведения и конфликт нельзя разрешить по тексту — статус → "not_defined", текстовое поле → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни типов событий, ни последствий, ни условий
           о продолжении, ни порядка вступления, ни права и срока выкупа.
           → presence = "missing";
             trigger_type = "not_defined";
             termination_consequence_code = "not_defined";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        2. Неполное раскрытие или прямое исключение.
           а) Общая фраза: «При выбытии товарища договор прекращается»
              без указания конкретных событий и порядка.
              → presence = "present";
                trigger_type = "other";
                termination_consequence_code = "terminate";
                continuation_with_successors_status = "not_defined".
           б) Прямо указано, что договор не продолжается
              с правопреемниками ни в каком случае.
              → presence = "present";
                termination_consequence_code = "terminate";
                continuation_with_successors_status = "not_defined";
                continuation_with_successors_details содержит
                дословную формулировку.

        3. Противоречие между фрагментами.
           В разных частях договора указаны противоречивые последствия
           для одного и того же события.
           → presence = "unclear";
             termination_consequence_code = "not_defined";
             termination_consequence_details = "Не удалось определить".

        4. Комбинированная ситуация.
           Несколько типов событий перечислены в одном пункте договора
           (например, смерть, банкротство и ликвидация).
           → presence = "present";
             trigger_type фиксирует наиболее конкретное из указанных
             (по приоритету: death_natural → death_declared → missing_person
             → bankruptcy → liquidation_entity → incapacity → other);
             termination_consequence_details содержит перечень всех
             событий.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для death_bankruptcy_succession_check_presence используй только: "present", "missing", "unclear".
        - Для trigger_type используй только: "death_natural", "death_declared", "missing_person", "bankruptcy", "liquidation_entity", "incapacity", "other", "not_defined".
        - Для termination_consequence_code используй только: "terminate", "continue_with_successors", "continue_with_consent", "mixed", "not_defined".
        - Для enum-полей *_status используй только: "defined", "not_defined".
        - Fallback при отсутствии данных:
          * все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "death_bankruptcy_succession_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по последствиям смерти, банкротства, ликвидации и правопреемству. Внутреннее агрегатное signal-поле."
          required: true

        - name: "trigger_type"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Тип события"
          allowed_values:
            - "death_natural"
            - "death_declared"
            - "missing_person"
            - "bankruptcy"
            - "liquidation_entity"
            - "incapacity"
            - "other"
            - "not_defined"
          description: "Тип события (смерть, банкротство, ликвидация и т.п.), указанный в договоре как основание."
          required: true

        - name: "termination_consequence_code"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Последствие"
          allowed_values:
            - "terminate"
            - "continue_with_successors"
            - "continue_with_consent"
            - "mixed"
            - "not_defined"
          description: "Последствие события для договора: прекращение / продолжение."
          required: false

        - name: "termination_consequence_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Основание последствия"
          description: "Прямая цитата о последствии события (для Drawer)."
          required: false

        - name: "continuation_with_successors_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус условия о продолжении с правопреемниками."
          required: false

        - name: "continuation_with_successors_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Продолжение с правопреемниками"
          description: "Условие о продолжении договора с правопреемниками / наследниками."
          required: false

        - name: "successor_admission_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус порядка вступления правопреемника."
          required: false

        - name: "successor_admission_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Вступление правопреемника"
          description: "Порядок вступления правопреемника в товарищество (для Drawer)."
          required: false

        - name: "buyout_right_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус права выкупа доли остальными товарищами."
          required: false

        - name: "buyout_right_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 4
          label: "Право выкупа доли"
          description: "Право выкупа доли выбывшего товарища."
          required: false

        - name: "buyout_deadline_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус срока выкупа доли."
          required: false

        - name: "buyout_deadline_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Срок выкупа"
          description: "Срок выкупа доли (для Drawer)."
          required: false

      store_payload: true

  - id: new_partners_and_conflict_check
    name: "Принятие новых товарищей, запрет конкуренции и конфликт интересов"
    description: >
      Фактографическая проверка порядка принятия новых товарищей
      (правило решения — единогласие / большинство), запрета конкурирующей
      деятельности и его параметров (что запрещено, на какой срок,
      последствия нарушения), а также порядка раскрытия и последствий
      нераскрытия конфликта интересов.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 100

    rules:
      keywords:
        - "принятие нового товарища"
        - "вступление нового товарища"
        - "приём нового участника"
        - "единогласное решение"
        - "квалифицированное большинство"
        - "оценка вклада нового участника"
        - "запрет конкуренции"
        - "non-compete"
        - "конкурирующий бизнес"
        - "аналогичная деятельность"
        - "конфликт интересов"
        - "раскрытие конфликта"
        - "заинтересованность"
        - "аффилированность"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)приняти[ея]\\s+нов[огоых]+\\s+товарищ"
        - "(?i)вступлени[ея]\\s+нов[огоых]+"
        - "(?i)запрет\\s+конкуренц"
        - "(?i)не\\s+вправе\\s+заниматься"
        - "(?i)конфликт\\s+интерес"
        - "(?i)раскрыт[ия][ея]\\s+интерес"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор простого товарищества.
        Проверяется три вопроса: принятие новых товарищей, запрет конкуренции
        и конфликт интересов.
        Нормативные ориентиры:
        - Правило решения о приёме нового товарища в ГК РФ прямо
          не установлено; при отсутствии в договоре иного применяется
          п. 1 ст. 1044 ГК РФ (совместное ведение дел → единогласие).
        - Ограничения конкуренции (non-compete) должны быть
          конкретными (вид деятельности, территория, срок), иначе
          оспоримы по ст. 11 ФЗ №135 «О защите конкуренции».
        - Конфликт интересов — договорное условие, в ГК РФ для ПТ
          не нормирован.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Различай: запрет конкуренции без указания срока / территории —
          сам по себе факт, фиксируй его как есть.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Разрешено ли принятие новых товарищей и на каких условиях.
        2. Правило решения о приёме (единогласие / квалифицированное
           большинство / простое большинство).
        3. Наличие запрета конкурирующей деятельности и его содержание
           (что именно запрещено).
        4. Срок действия запрета конкуренции.
        5. Последствия нарушения запрета конкуренции.
        6. Порядок раскрытия конфликта интересов.
        7. Последствия нераскрытия конфликта интересов.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Для enum-полей (*_status, admission_decision_rule) при
           отсутствии данных возвращай "not_defined".
        4. Для строковых *_details при отсутствии данных возвращай строго
           "Данные не определены".
        5. Не используй "None", "null", пустые строки или отсутствующие
           ключи.
        6. В evidence включай только прямые цитаты из текста договора.
        7. admission_decision_rule: "unanimous" (единогласие) /
           "qualified_majority" (квалифицированное большинство) /
           "simple_majority" (простое большинство) / "not_defined".
        8. non_compete_term_status = "defined" ТОЛЬКО если прямо указан
           срок запрета; "not_defined" — если срок не установлен
           (это самостоятельный факт).
        9. non_compete_consequences_status = "defined" если указаны
           санкции за нарушение (неустойка, возмещение убытков,
           исключение из товарищества и т.п.).
        10. conflict_consequences_status = "defined" если указаны
            последствия нераскрытия конфликта интересов.
        11. Верни РОВНО один валидный JSON-объект со всеми 14 ключами
            (13 полей + evidence), пригодный для парсинга через json.loads
            без предварительной обработки. Без markdown, без ```json,
            без комментариев, без текста до или после. Начни ответ сразу
            с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — приём единогласно, non-compete со сроком и санкцией:
        Фрагмент:
        "Принятие новых товарищей допускается по единогласному решению
        всех товарищей. Вклад нового товарища оценивается сторонами.
        Товарищам запрещается в течение срока действия договора заниматься
        деятельностью, аналогичной совместной деятельности товарищества,
        на территории г. Москвы. За нарушение — неустойка 1 000 000 рублей.
        Конфликт интересов подлежит раскрытию в письменной форме в течение
        5 рабочих дней. Неисполнение обязанности раскрытия влечёт
        исключение из товарищества."
        Ответ:
        {
          "admission_allowed_status": "defined",
          "admission_allowed_details": "принятие допускается по единогласному решению всех товарищей",
          "admission_decision_rule": "unanimous",
          "non_compete_status": "defined",
          "non_compete_details": "запрет деятельности, аналогичной совместной деятельности, на территории г. Москвы",
          "non_compete_term_status": "defined",
          "non_compete_term_details": "в течение срока действия договора",
          "non_compete_consequences_status": "defined",
          "non_compete_consequences_details": "неустойка 1 000 000 рублей",
          "conflict_disclosure_status": "defined",
          "conflict_disclosure_details": "письменное раскрытие в течение 5 рабочих дней",
          "conflict_consequences_status": "defined",
          "conflict_consequences_details": "исключение из товарищества",
          "evidence": [
            {"clause_ref": "п. 7.1", "quote": "Принятие новых товарищей допускается по единогласному решению всех товарищей."},
            {"clause_ref": "п. 7.3", "quote": "Товарищам запрещается в течение срока действия договора заниматься деятельностью, аналогичной совместной деятельности товарищества, на территории г. Москвы."},
            {"clause_ref": "п. 7.4", "quote": "За нарушение — неустойка 1 000 000 рублей."},
            {"clause_ref": "п. 7.6", "quote": "Конфликт интересов подлежит раскрытию в письменной форме в течение 5 рабочих дней."},
            {"clause_ref": "п. 7.7", "quote": "Неисполнение обязанности раскрытия влечёт исключение из товарищества."}
          ]
        }

        Пример 2 — non-compete без срока и санкций (edge-case):
        Фрагмент:
        "Товарищи обязуются не заниматься конкурирующей деятельностью.
        Порядок раскрытия конфликта интересов определяется общим собранием."
        Ответ:
        {
          "admission_allowed_status": "not_defined",
          "admission_allowed_details": "Данные не определены",
          "admission_decision_rule": "not_defined",
          "non_compete_status": "defined",
          "non_compete_details": "обязанность не заниматься конкурирующей деятельностью",
          "non_compete_term_status": "not_defined",
          "non_compete_term_details": "Данные не определены",
          "non_compete_consequences_status": "not_defined",
          "non_compete_consequences_details": "Данные не определены",
          "conflict_disclosure_status": "defined",
          "conflict_disclosure_details": "порядок раскрытия определяется общим собранием (конкретный порядок не установлен)",
          "conflict_consequences_status": "not_defined",
          "conflict_consequences_details": "Данные не определены",
          "evidence": [
            {"clause_ref": "п. 7.2", "quote": "Товарищи обязуются не заниматься конкурирующей деятельностью."},
            {"clause_ref": "п. 7.5", "quote": "Порядок раскрытия конфликта интересов определяется общим собранием."}
          ]
        }

        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Стороны обязуются исполнять договор."
        Ответ:
        {
          "admission_allowed_status": "not_defined",
          "admission_allowed_details": "Данные не определены",
          "admission_decision_rule": "not_defined",
          "non_compete_status": "not_defined",
          "non_compete_details": "Данные не определены",
          "non_compete_term_status": "not_defined",
          "non_compete_term_details": "Данные не определены",
          "non_compete_consequences_status": "not_defined",
          "non_compete_consequences_details": "Данные не определены",
          "conflict_disclosure_status": "not_defined",
          "conflict_disclosure_details": "Данные не определены",
          "conflict_consequences_status": "not_defined",
          "conflict_consequences_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Все 14 ключей (13 полей + evidence) присутствуют в JSON?
        2. admission_decision_rule — строго из allowed_values?
        3. Все *_status — строго "defined" / "not_defined"?
        4. Проверен ли срок запрета конкуренции?
        5. Проверены ли санкции за нарушение запрета?
        6. Проверены ли последствия нераскрытия конфликта интересов?
        7. Все *_details заполнены или "Данные не определены"?
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "admission_allowed_status": "<defined / not_defined>",
          "admission_allowed_details": "<текст или 'Данные не определены'>",
          "admission_decision_rule": "<unanimous / qualified_majority / simple_majority / not_defined>",
          "non_compete_status": "<defined / not_defined>",
          "non_compete_details": "<текст или 'Данные не определены'>",
          "non_compete_term_status": "<defined / not_defined>",
          "non_compete_term_details": "<текст или 'Данные не определены'>",
          "non_compete_consequences_status": "<defined / not_defined>",
          "non_compete_consequences_details": "<текст или 'Данные не определены'>",
          "conflict_disclosure_status": "<defined / not_defined>",
          "conflict_disclosure_details": "<текст или 'Данные не определены'>",
          "conflict_consequences_status": "<defined / not_defined>",
          "conflict_consequences_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 800

    retrieval:
      retrieval_profile: "consent_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "принятие нового товарища вступление нового участника единогласное решение квалифицированное большинство оценка вклада нового участника изменение долей запрет конкуренции non-compete конкурирующий бизнес аналогичная деятельность территория срок неустойка конфликт интересов раскрытие конфликта заинтересованность аффилированность исключение"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - limitations
      negative_keywords:
        - "вклад товарища"
        - "распределение прибыли"
        - "выход из товарищества"
        - "прекращение"
        - "налоговый учёт"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.30, 0.80]
        boost: 0.12
        scope: segment
      context_k: 10
      max_chunks: 14
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "limitations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1600

      compact_output: false

      presence_signal:
        field: "new_partners_and_conflict_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора простого товарищества
        сведения о принятии новых товарищей, запрете конкуренции
        и конфликте интересов.
        Не анализируй вклады как таковые, прибыль, ведение дел,
        прекращение или налоги.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. new_partners_and_conflict_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (admission_allowed_status, admission_decision_rule,
              non_compete_status, non_compete_term_status,
              non_compete_consequences_status,
              conflict_disclosure_status,
              conflict_consequences_status) ≠ "not_defined";
           - "missing" — если все семь содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - admission_allowed_status = "not_defined";
           - admission_decision_rule = "not_defined";
           - non_compete_status = "not_defined";
           - non_compete_term_status = "not_defined";
           - non_compete_consequences_status = "not_defined";
           - conflict_disclosure_status = "not_defined";
           - conflict_consequences_status = "not_defined";
           - все *_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. admission_allowed_status:
           - "defined" — если прямо указано, разрешено ли принятие
             новых товарищей (и на каких условиях);
           - "not_defined" — иначе.

        2. admission_allowed_details:
           Краткое user-facing описание порядка принятия новых товарищей.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        3. admission_decision_rule:
           Используй только одно из значений:
           - "unanimous" — единогласие;
           - "qualified_majority" — квалифицированное большинство;
           - "simple_majority" — простое большинство;
           - "not_defined" — иначе.

        4. non_compete_status:
           - "defined" — если прямо указан запрет конкурирующей
             деятельности для товарищей;
           - "not_defined" — иначе.

        5. non_compete_details:
           Краткое user-facing описание содержания запрета
           (что именно запрещено, на какой территории).
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        6. non_compete_term_status:
           - "defined" — если прямо указан срок действия запрета;
           - "not_defined" — иначе (отсутствие срока — самостоятельный
             факт).

        7. non_compete_term_details:
           Краткое user-facing описание срока запрета.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        8. non_compete_consequences_status:
           - "defined" — если указаны санкции за нарушение запрета
             (неустойка, возмещение убытков, исключение из товарищества);
           - "not_defined" — иначе.

        9. non_compete_consequences_details:
           Краткое user-facing описание санкций.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        10. conflict_disclosure_status:
            - "defined" — если прямо указан порядок раскрытия
              конфликта интересов;
            - "not_defined" — иначе.

        11. conflict_disclosure_details:
            Краткое user-facing описание порядка раскрытия.
            Если данных нет — "Данные не определены".
            Если данные противоречивы — "Не удалось определить".

        12. conflict_consequences_status:
            - "defined" — если указаны последствия нераскрытия
              конфликта интересов;
            - "not_defined" — иначе.

        13. conflict_consequences_details:
            Краткое user-facing описание последствий нераскрытия.
            Если данных нет — "Данные не определены".
            Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни new_partners_and_conflict_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не делай выводов по типовой структуре договора.
        - Не извлекай сведения о вкладах как таковых, распределении прибыли, ведении дел, выходе из товарищества, прекращении, налоговом учёте и иных нерелевантных темах.
        - admission_decision_rule фиксирует правило решения о приёме нового товарища.
        - non_compete_term_status = "defined" только если прямо указан срок; иначе "not_defined" (сам факт отсутствия срока фиксируется).
        - non_compete_consequences_status = "defined" при указании санкций (неустойка, убытки, исключение и т.п.).
        - conflict_consequences_status = "defined" при указании последствий нераскрытия.
        - Если в разных фрагментах указаны противоречивые сведения и конфликт нельзя разрешить по тексту — статус → "not_defined", текстовое поле → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни порядка принятия новых товарищей, ни запрета
           конкуренции, ни условий о конфликте интересов.
           → presence = "missing";
             все *_status = "not_defined";
             admission_decision_rule = "not_defined";
             все *_details = "Данные не определены".

        2. Неполное раскрытие или прямое исключение.
           а) Общая фраза: «Новые товарищи принимаются в порядке,
              установленном законодательством» без конкретики.
              → presence = "present";
                admission_allowed_status = "not_defined";
                admission_decision_rule = "not_defined".
           б) Прямо указано, что принятие новых товарищей не допускается
              или что запрет конкуренции не применяется.
              → presence = "present";
                admission_allowed_status = "defined";
                non_compete_status = "not_defined";
                соответствующие *_details содержат дословную формулировку.

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные правила принятия
           новых товарищей или противоречивые условия о запрете
           конкуренции.
           → presence = "unclear";
             admission_decision_rule = "not_defined";
             non_compete_status = "not_defined";
             соответствующий *_details = "Не удалось определить".

        4. Специфика темы — запрет конкуренции без срока и санкций.
           Запрет конкурирующей деятельности установлен, но без указания
           срока действия и без санкций за нарушение.
           → presence = "present";
             non_compete_status = "defined";
             non_compete_term_status = "not_defined";
             non_compete_consequences_status = "not_defined".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для new_partners_and_conflict_check_presence используй только: "present", "missing", "unclear".
        - Для enum-полей *_status используй только: "defined", "not_defined".
        - Для admission_decision_rule используй только: "unanimous", "qualified_majority", "simple_majority", "not_defined".
        - Fallback при отсутствии данных:
          * все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "new_partners_and_conflict_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по принятию новых товарищей, запрету конкуренции и конфликту интересов. Внутреннее агрегатное signal-поле."
          required: true

        - name: "admission_allowed_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения порядка принятия новых товарищей."
          required: true

        - name: "admission_allowed_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Принятие новых товарищей"
          description: "Порядок принятия новых товарищей."
          required: true

        - name: "admission_decision_rule"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Правило приёма"
          allowed_values: ["unanimous", "qualified_majority", "simple_majority", "not_defined"]
          description: "Правило решения о приёме нового товарища."
          required: false

        - name: "non_compete_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус запрета конкурирующей деятельности."
          required: false

        - name: "non_compete_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Запрет конкуренции"
          description: "Содержание запрета конкурирующей деятельности."
          required: false

        - name: "non_compete_term_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус срока запрета конкуренции."
          required: false

        - name: "non_compete_term_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Срок запрета"
          description: "Срок действия запрета конкуренции (для Drawer)."
          required: false

        - name: "non_compete_consequences_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус санкций за нарушение запрета конкуренции."
          required: false

        - name: "non_compete_consequences_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Санкции за нарушение"
          description: "Санкции за нарушение запрета конкуренции (для Drawer)."
          required: false

        - name: "conflict_disclosure_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус порядка раскрытия конфликта интересов."
          required: false

        - name: "conflict_disclosure_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 4
          label: "Раскрытие конфликта"
          description: "Порядок раскрытия конфликта интересов."
          required: false

        - name: "conflict_consequences_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус последствий нераскрытия конфликта интересов."
          required: false

        - name: "conflict_consequences_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Последствия нераскрытия"
          description: "Последствия нераскрытия конфликта интересов (для Drawer)."
          required: false

      store_payload: true

  - id: tax_accounting_check
    name: "Налоговый и бухгалтерский учёт товарищества (ст. 278 НК РФ)"
    description: >
      Фактографическая проверка условий о налоговом режиме товарищей,
      лице, ведущем налоговый учёт (п. 1 ст. 278 НК РФ), отдельном балансе
      общего имущества (п. 2 ст. 1043 ГК РФ), порядке учёта НДС
      (ст. 174.1, п. 3 ст. 170 НК РФ), распределении налоговой базы
      (п. 2–4 ст. 278 НК РФ) и документообороте.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 110

    rules:
      keywords:
        - "налоговый учёт"
        - "бухгалтерский учёт"
        - "отдельный баланс"
        - "общее имущество товарищей"
        - "документооборот"
        - "распределение налоговых обязательств"
        - "налоговая база"
        - "отчётность товарищества"
        - "кто ведёт учёт"
        - "налоговый режим"
        - "общая система налогообложения"
        - "упрощённая система налогообложения"
        - "НДС"
        - "счёт-фактура"
        - "восстановление НДС"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)налогов[ыо]й\\s+уч[её]т"
        - "(?i)бухгалтерск[иоя]+\\s+уч[её]т"
        - "(?i)отдельн[ыо]+\\s+баланс"
        - "(?i)(ОСН|УСН|ЕСХН|НДС)"
        - "(?i)(счёт|счет)-фактур"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор простого товарищества (ст. 278 НК РФ,
        п. 2 ст. 1043 ГК РФ).
        Проверяется только один вопрос: налоговый и бухгалтерский учёт
        товарищества.
        Нормативные ориентиры:
        - п. 1 ст. 278 НК РФ — налоговый учёт ведёт участник, на которого
          возложено ведение дел товарищества.
        - п. 2 ст. 278 НК РФ — налоговая база определяется ведущим дела
          нарастающим итогом.
        - п. 3 ст. 278 НК РФ — прибыль распределяется между участниками
          пропорционально их вкладам, если иное не установлено договором.
        - п. 4 ст. 278 НК РФ — убытки НЕ распределяются между участниками.
        - п. 2 ст. 1043 ГК РФ — учёт общего имущества может быть поручен
          одному из участников-юридических лиц (отдельный баланс).
        - ст. 174.1 НК РФ — при ведении общего дела НДС исчисляется
          ведущим дела; счёт-фактуры выставляются от его имени.
        - п. 3 ст. 170 НК РФ — при передаче имущества в качестве вклада
          в простое товарищество НДС подлежит ВОССТАНОВЛЕНИЮ
          у передающей стороны.
        - п. 4 ст. 346.13 НК РФ — при наличии участника на ОСН остальные
          участники на УСН теряют право на спецрежим.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Участники товарищества уплачивают налоги САМОСТОЯТЕЛЬНО;
          «налоговых обязательств товарищества» как отдельного субъекта нет.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Кто ведёт налоговый / бухгалтерский учёт.
        2. Налоговый режим товарищей (ОСН / УСН / смешанный).
        3. Наличие отдельного баланса общего имущества.
        4. Порядок учёта НДС (кто выставляет счёт-фактуры, восстановление
           НДС при вкладе).
        5. Распределение налоговой базы между товарищами.
        6. Документооборот товарищества.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Для enum-полей (*_status, tax_regime_code) при отсутствии данных
           возвращай "not_defined".
        4. Для строковых *_details при отсутствии данных возвращай строго
           "Данные не определены".
        5. Не используй "None", "null", пустые строки или отсутствующие
           ключи.
        6. В evidence включай только прямые цитаты из текста договора.
        7. tax_regime_code: "osn" (общая система) / "usn" (упрощённая) /
           "eshn" (единый сельхозналог) / "mixed" (разные режимы
           у участников) / "not_defined".
        8. separate_balance_status = "defined" ТОЛЬКО если прямо указано
           ведение учёта общего имущества на отдельном балансе.
        9. vat_handling_status = "defined" если указан порядок учёта НДС
           (счёт-фактуры, восстановление НДС при вкладе).
        10. Верни РОВНО один валидный JSON-объект со всеми 13 ключами
            (12 полей + evidence), пригодный для парсинга через json.loads
            без предварительной обработки. Без markdown, без ```json,
            без комментариев, без текста до или после. Начни ответ сразу
            с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — ОСН, ведущий дела, отдельный баланс:
        Фрагмент:
        "Налоговый и бухгалтерский учёт общего имущества ведёт Товарищ 1 —
        ООО «Альфа», применяющее общую систему налогообложения. Учёт
        ведётся на отдельном балансе. Товарищ 1 выставляет счета-фактуры
        от своего имени. При передаче имущества в качестве вклада НДС
        восстанавливается передающей стороной. Прибыль распределяется
        между товарищами пропорционально вкладам."
        Ответ:
        {
          "accounting_responsible_status": "defined",
          "accounting_responsible_details": "Товарищ 1 — ООО «Альфа»",
          "tax_regime_code": "osn",
          "tax_regime_details": "общая система налогообложения",
          "separate_balance_status": "defined",
          "separate_balance_details": "учёт общего имущества на отдельном балансе",
          "vat_handling_status": "defined",
          "vat_handling_details": "Товарищ 1 выставляет счета-фактуры от своего имени; при передаче имущества в качестве вклада НДС восстанавливается передающей стороной",
          "tax_allocation_status": "defined",
          "tax_allocation_details": "прибыль распределяется пропорционально вкладам",
          "document_flow_status": "not_defined",
          "document_flow_details": "Данные не определены",
          "evidence": [
            {"clause_ref": "п. 10.1", "quote": "Налоговый и бухгалтерский учёт общего имущества ведёт Товарищ 1 — ООО «Альфа», применяющее общую систему налогообложения."},
            {"clause_ref": "п. 10.2", "quote": "Учёт ведётся на отдельном балансе."},
            {"clause_ref": "п. 10.3", "quote": "Товарищ 1 выставляет счета-фактуры от своего имени."},
            {"clause_ref": "п. 10.4", "quote": "При передаче имущества в качестве вклада НДС восстанавливается передающей стороной."}
          ]
        }

        Пример 2 — смешанный режим (edge-case, риск потери УСН):
        Фрагмент:
        "Товарищ 1 применяет ОСН, Товарищ 2 — УСН. Стороны несут налоговые
        обязательства самостоятельно."
        Ответ:
        {
          "accounting_responsible_status": "not_defined",
          "accounting_responsible_details": "Данные не определены",
          "tax_regime_code": "mixed",
          "tax_regime_details": "Товарищ 1 — ОСН; Товарищ 2 — УСН",
          "separate_balance_status": "not_defined",
          "separate_balance_details": "Данные не определены",
          "vat_handling_status": "not_defined",
          "vat_handling_details": "Данные не определены",
          "tax_allocation_status": "defined",
          "tax_allocation_details": "самостоятельное несение налоговых обязательств",
          "document_flow_status": "not_defined",
          "document_flow_details": "Данные не определены",
          "evidence": [
            {"clause_ref": "п. 10.1", "quote": "Товарищ 1 применяет ОСН, Товарищ 2 — УСН."},
            {"clause_ref": "п. 10.2", "quote": "Стороны несут налоговые обязательства самостоятельно."}
          ]
        }

        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Стороны обязуются исполнять договор."
        Ответ:
        {
          "accounting_responsible_status": "not_defined",
          "accounting_responsible_details": "Данные не определены",
          "tax_regime_code": "not_defined",
          "tax_regime_details": "Данные не определены",
          "separate_balance_status": "not_defined",
          "separate_balance_details": "Данные не определены",
          "vat_handling_status": "not_defined",
          "vat_handling_details": "Данные не определены",
          "tax_allocation_status": "not_defined",
          "tax_allocation_details": "Данные не определены",
          "document_flow_status": "not_defined",
          "document_flow_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Все 13 ключей (12 полей + evidence) присутствуют в JSON?
        2. tax_regime_code — строго из allowed_values?
        3. Найдено ли лицо, ведущее налоговый учёт?
        4. Определён ли налоговый режим товарищей?
        5. Проверено ли наличие отдельного баланса?
        6. Проверен ли порядок учёта НДС?
        7. Все *_details заполнены или "Данные не определены"?
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "accounting_responsible_status": "<defined / not_defined>",
          "accounting_responsible_details": "<текст или 'Данные не определены'>",
          "tax_regime_code": "<osn / usn / eshn / mixed / not_defined>",
          "tax_regime_details": "<текст или 'Данные не определены'>",
          "separate_balance_status": "<defined / not_defined>",
          "separate_balance_details": "<текст или 'Данные не определены'>",
          "vat_handling_status": "<defined / not_defined>",
          "vat_handling_details": "<текст или 'Данные не определены'>",
          "tax_allocation_status": "<defined / not_defined>",
          "tax_allocation_details": "<текст или 'Данные не определены'>",
          "document_flow_status": "<defined / not_defined>",
          "document_flow_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 800

    retrieval:
      retrieval_profile: "tax_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "налоговый учёт бухгалтерский учёт отдельный баланс общее имущество товарищей документооборот распределение налоговых обязательств налоговая база отчётность товарищества кто ведёт учёт налоговый режим общая система налогообложения упрощённая система НДС счёт-фактура восстановление НДС"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "вклад товарища"
        - "распределение прибыли"
        - "выход из товарищества"
        - "прекращение"
        - "неустойка"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.50, 0.90]
        boost: 0.12
        scope: segment
      context_k: 10
      max_chunks: 14
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1600

      compact_output: false

      presence_signal:
        field: "tax_accounting_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора простого товарищества
        сведения о налоговом и бухгалтерском учёте: налоговый режим,
        ответственное лицо, отдельный баланс, учёт НДС, распределение
        налоговой базы, документооборот.
        Не анализируй вклады как таковые, прибыль, ведение дел,
        прекращение или неустойки.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. tax_accounting_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (accounting_responsible_status, tax_regime_code,
              separate_balance_status, vat_handling_status,
              tax_allocation_status, document_flow_status)
             ≠ "not_defined";
           - "missing" — если все шесть содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - accounting_responsible_status = "not_defined";
           - tax_regime_code = "not_defined";
           - separate_balance_status = "not_defined";
           - vat_handling_status = "not_defined";
           - tax_allocation_status = "not_defined";
           - document_flow_status = "not_defined";
           - все *_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. accounting_responsible_status:
           - "defined" — если прямо указано лицо (товарищ), ведущее
             налоговый / бухгалтерский учёт;
           - "not_defined" — иначе.

        2. accounting_responsible_details:
           Краткое user-facing описание ответственного лица.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        3. tax_regime_code:
           Используй только одно из значений:
           - "osn" — общая система налогообложения;
           - "usn" — упрощённая система налогообложения;
           - "eshn" — единый сельскохозяйственный налог;
           - "mixed" — разные режимы у товарищей;
           - "not_defined" — иначе.

        4. tax_regime_details:
           Краткое user-facing описание налогового режима
           (например: "Товарищ 1 — ОСН; Товарищ 2 — УСН").
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        5. separate_balance_status:
           - "defined" — если прямо указано ведение учёта общего
             имущества на отдельном балансе (п. 2 ст. 1043 ГК РФ);
           - "not_defined" — иначе.

        6. separate_balance_details:
           Краткое user-facing описание условия об отдельном балансе.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        7. vat_handling_status:
           - "defined" — если прямо указан порядок учёта НДС
             (кто выставляет счёт-фактуры, восстановление НДС
             при вкладе, порядок возмещения);
           - "not_defined" — иначе.

        8. vat_handling_details:
           Краткое user-facing описание порядка учёта НДС.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        9. tax_allocation_status:
           - "defined" — если прямо указано распределение прибыли /
             налоговой базы между товарищами;
           - "not_defined" — иначе.

        10. tax_allocation_details:
            Краткое user-facing описание распределения прибыли /
            налоговой базы.
            Если данных нет — "Данные не определены".
            Если данные противоречивы — "Не удалось определить".

        11. document_flow_status:
            - "defined" — если прямо указан порядок документооборота
              товарищества;
            - "not_defined" — иначе.

        12. document_flow_details:
            Краткое user-facing описание документооборота.
            Если данных нет — "Данные не определены".
            Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни tax_accounting_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не делай выводов по типовой структуре договора.
        - Не извлекай сведения о вкладах как таковых, распределении прибыли (кроме налоговой базы), ведении дел, выходе из товарищества, прекращении, неустойках и иных нерелевантных темах.
        - tax_regime_code = "mixed" если у участников разные режимы.
        - separate_balance_status = "defined" только при прямом указании отдельного баланса общего имущества.
        - vat_handling_details: кто выставляет счёт-фактуры, восстановление НДС при вкладе, порядок возмещения.
        - tax_allocation_details: распределение прибыли / налоговой базы между участниками.
        - Если в разных фрагментах указаны противоречивые сведения и конфликт нельзя разрешить по тексту — статус → "not_defined", текстовое поле → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни налогового режима, ни ответственного
           за учёт лица, ни отдельного баланса, ни порядка учёта НДС,
           ни распределения налоговой базы, ни документооборота.
           → presence = "missing";
             все *_status = "not_defined";
             tax_regime_code = "not_defined";
             все *_details = "Данные не определены".

        2. Неполное раскрытие или прямое исключение.
           а) Общая фраза: «Стороны самостоятельно ведут налоговый
              учёт» без указания ответственного, режима и НДС.
              → presence = "present";
                accounting_responsible_status = "not_defined";
                tax_regime_code = "not_defined".
           б) Прямо указано, что отдельный баланс не открывается
              или что НДС не восстанавливается при вкладе.
              → presence = "present";
                separate_balance_status = "not_defined" или
                vat_handling_status = "not_defined";
                соответствующие *_details содержат дословную формулировку.

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные налоговые режимы
           или разные ответственные за учёт лица.
           → presence = "unclear";
             tax_regime_code = "not_defined";
             соответствующий *_details = "Не удалось определить".

        4. Специфика темы — смешанный режим.
           У товарищей разные налоговые режимы (например, ОСН и УСН).
           → presence = "present";
             tax_regime_code = "mixed";
             tax_regime_details содержит перечисление режимов.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для tax_accounting_check_presence используй только: "present", "missing", "unclear".
        - Для enum-полей *_status используй только: "defined", "not_defined".
        - Для tax_regime_code используй только: "osn", "usn", "eshn", "mixed", "not_defined".
        - Fallback при отсутствии данных:
          * все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "tax_accounting_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по налоговому и бухгалтерскому учёту. Внутреннее агрегатное signal-поле."
          required: true

        - name: "accounting_responsible_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения ответственного за учёт."
          required: true

        - name: "accounting_responsible_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Кто ведёт учёт"
          description: "Лицо, ответственное за налоговый / бухгалтерский учёт."
          required: true

        - name: "tax_regime_code"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Налоговый режим"
          allowed_values: ["osn", "usn", "eshn", "mixed", "not_defined"]
          description: "Налоговый режим товарищей (ОСН / УСН / ЕСХН / смешанный)."
          required: false

        - name: "tax_regime_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Детали режима"
          description: "Описание налогового режима (для Drawer)."
          required: false

        - name: "separate_balance_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания об отдельном балансе (п. 2 ст. 1043 ГК РФ)."
          required: false

        - name: "separate_balance_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Отдельный баланс"
          description: "Условие об учёте общего имущества на отдельном балансе."
          required: false

        - name: "vat_handling_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения порядка учёта НДС."
          required: false

        - name: "vat_handling_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Учёт НДС"
          description: "Порядок учёта НДС (счёт-фактуры, восстановление НДС при вкладе) (для Drawer)."
          required: false

        - name: "tax_allocation_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус распределения налоговой базы."
          required: false

        - name: "tax_allocation_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 4
          label: "Распределение налогов"
          description: "Распределение налоговой базы / прибыли между товарищами."
          required: false

        - name: "document_flow_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения документооборота."
          required: false

        - name: "document_flow_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Документооборот"
          description: "Порядок документооборота товарищества (для Drawer)."
          required: false

      store_payload: true

  - id: requalification_risk_check
    name: "Признаки скрытого создания юридического лица (риск переквалификации)"
    description: >
      Фактографическая проверка наличия в договоре признаков скрытого
      создания юридического лица: штат/персонал «товарищества», расчётный
      счёт на имя «товарищества», вывеска/офис/печать товарищества,
      отдельный баланс общего имущества как единого целого.
      Указание «без образования юридического лица» фиксируется
      в partnership_subject_extraction и здесь не дублируется.
      Признаки сопоставляются с практикой ФНС (ст. 54.1 НК РФ),
      доктриной мнимой сделки (ст. 170 ГК РФ) и составом ст. 173.1 УК РФ.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 130

    rules:
      keywords:
        - "штат сотрудников товарищества"
        - "персонал товарищества"
        - "работники товарищества"
        - "расчётный счёт товарищества"
        - "счёт товарищества"
        - "вывеска"
        - "офис товарищества"
        - "помещение товарищества"
        - "печать товарищества"
        - "отдельный баланс"
        - "обособленное имущество"
        - "органы управления товарищества"
        - "товарищество как единое целое"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)штат[а-яё]*\\s+(сотрудник|работник)"
        - "(?i)(расч[её]тн[ыо]й|банковск[ио]й)\\s+сч[её]т\\s+товарищ"
        - "(?i)(вывеск|офис|печат)[а-яё]*\\s+товарищ"
        - "(?i)отдельн[ыо]+\\s+баланс"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор простого товарищества.
        Проверяется только один вопрос: признаки скрытого создания
        юридического лица (риск переквалификации).
        Нормативные ориентиры:
        - п. 1 ст. 1041 ГК РФ — простое товарищество действует
          БЕЗ образования юридического лица.
        - ст. 2 ФЗ №129-ФЗ «О государственной регистрации юридических
          лиц» — ЮЛ подлежит госрегистрации; деятельность без регистрации
          как ЮЛ при наличии его признаков создаёт риски.
        - ст. 170 ГК РФ — мнимая сделка (если договор прикрывает
          фактически созданное ЮЛ).
        - ст. 54.1 НК РФ — неправомерная налоговая выгода (признаки
          «дробления бизнеса» через ПТ).
        - ст. 173.1 УК РФ — незаконное создание юридического лица.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Этот check фиксирует признаки; квалификация договора
          и вывод о переквалификации — вне его скоупа.
        - Признаки ЮЛ (по практике ФНС / судов): обособленное имущество,
          отдельный баланс, собственные органы, печать, собственный
          счёт, штат, вывеска/офис, длительное существование как целого.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Упоминание штата / персонала / работников «товарищества»
           как единого целого.
        2. Упоминание расчётного / банковского счёта на имя
           «товарищества».
        3. Упоминание вывески / офиса / печати «товарищества».
        4. Упоминание отдельного баланса / обособленного имущества
           товарищества как единого целого.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Для enum-полей (staff_mention_status, bank_account_mention_status,
           office_signage_mention_status, separate_balance_mention_status)
           при отсутствии данных возвращай "not_detected".
        4. Для строковых *_details при отсутствии данных возвращай строго
           "Данные не определены".
        5. Не используй "None", "null", пустые строки или отсутствующие
           ключи.
        6. В evidence включай только прямые цитаты из текста договора.
        7. *_mention_status = "detected" ТОЛЬКО если признак упоминается
           применительно к «товариществу» как единому целому, а не
           к отдельному товарищу. Например, «расчётный счёт Товарища 1» —
           НЕ признак ЮЛ; «расчётный счёт товарищества» — признак.
        8. Признак, упомянутый только для отдельного товарища, фиксируется
           в *_details со значением "не применимо: относится к отдельному
           товарищу", но status = "not_detected".
        9. Верни РОВНО один валидный JSON-объект со всеми 9 ключами
           (8 полей + evidence), пригодный для парсинга через json.loads
           без предварительной обработки. Без markdown, без ```json,
           без комментариев, без текста до или после. Начни ответ сразу
           с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — признаков ЮЛ нет (счёт на имя отдельного товарища):
        Фрагмент:
        "Стороны действуют без образования юридического лица.
        В целях исполнения договора Товарищ 1 открывает расчётный счёт
        на своё имя."
        Ответ:
        {
          "staff_mention_status": "not_detected",
          "staff_mention_details": "Данные не определены",
          "bank_account_mention_status": "not_detected",
          "bank_account_mention_details": "не применимо: счёт относится к отдельному товарищу (Товарищ 1), а не к товариществу",
          "office_signage_mention_status": "not_detected",
          "office_signage_mention_details": "Данные не определены",
          "separate_balance_mention_status": "not_detected",
          "separate_balance_mention_details": "Данные не определены",
          "evidence": [
            {"clause_ref": "п. 1.3", "quote": "Стороны действуют без образования юридического лица."},
            {"clause_ref": "п. 1.4", "quote": "В целях исполнения договора Товарищ 1 открывает расчётный счёт на своё имя."}
          ]
        }

        Пример 2 — признаки ЮЛ присутствуют:
        Фрагмент:
        "Товарищество имеет штат из 10 сотрудников, собственный офис,
        печать товарищества и расчётный счёт на имя товарищества.
        Учёт ведётся на отдельном балансе."
        Ответ:
        {
          "staff_mention_status": "detected",
          "staff_mention_details": "штат из 10 сотрудников товарищества",
          "bank_account_mention_status": "detected",
          "bank_account_mention_details": "расчётный счёт на имя товарищества",
          "office_signage_mention_status": "detected",
          "office_signage_mention_details": "собственный офис и печать товарищества",
          "separate_balance_mention_status": "detected",
          "separate_balance_mention_details": "учёт на отдельном балансе",
          "evidence": [
            {"clause_ref": "п. 1.5", "quote": "Товарищество имеет штат из 10 сотрудников, собственный офис, печать товарищества и расчётный счёт на имя товарищества."},
            {"clause_ref": "п. 10.1", "quote": "Учёт ведётся на отдельном балансе."}
          ]
        }

        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Стороны обязуются исполнять договор."
        Ответ:
        {
          "staff_mention_status": "not_detected",
          "staff_mention_details": "Данные не определены",
          "bank_account_mention_status": "not_detected",
          "bank_account_mention_details": "Данные не определены",
          "office_signage_mention_status": "not_detected",
          "office_signage_mention_details": "Данные не определены",
          "separate_balance_mention_status": "not_detected",
          "separate_balance_mention_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Все 9 ключей (8 полей + evidence) присутствуют в JSON?
        2. Все *_mention_status — строго "detected" / "not_detected"?
        3. Проверено ли, что признаки относятся к «товариществу»
           как единому целому, а не к отдельному товарищу?
        4. Проверен ли отдельный баланс?
        5. Все *_details заполнены или "Данные не определены"?
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "staff_mention_status": "<detected / not_detected>",
          "staff_mention_details": "<текст или 'Данные не определены'>",
          "bank_account_mention_status": "<detected / not_detected>",
          "bank_account_mention_details": "<текст или 'Данные не определены'>",
          "office_signage_mention_status": "<detected / not_detected>",
          "office_signage_mention_details": "<текст или 'Данные не определены'>",
          "separate_balance_mention_status": "<detected / not_detected>",
          "separate_balance_mention_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 700

    retrieval:
      retrieval_profile: "definitions_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "без образования юридического лица штат сотрудников товарищества персонал товарищества работники товарищества расчётный счёт товарищества банковский счёт товарищества вывеска офис товарищества печать товарищества отдельный баланс обособленное имущество товарищество как единое целое"
      preferred_unit_types:
        - general_provision
        - obligation
      excluded_unit_types:
        - definition
        - technical_fragment
      preferred_clause_functions:
        - boilerplate
        - definitions
      negative_keywords:
        - "вклад товарища"
        - "распределение прибыли"
        - "выход из товарищества"
        - "прекращение"
        - "налоговый учёт"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 0.40]
        boost: 0.15
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "boilerplate"
        - "definitions"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1400

      compact_output: false

      presence_signal:
        field: "requalification_risk_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора простого товарищества
        сведения о признаках скрытого создания юридического лица.
        Не анализируй вклады, прибыль, ведение дел, прекращение
        или налоговый учёт.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. requalification_risk_check_presence:
           Агрегатное signal-поле — наличие признаков скрытого создания
           юридического лица.
           - "present" — если хотя бы одно из содержательных полей
             (staff_mention_status, bank_account_mention_status,
              office_signage_mention_status,
              separate_balance_mention_status) = "detected";
           - "missing" — если все четыре содержательных поля
             = "not_detected";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - все четыре *_mention_status = "not_detected";
           - все *_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. staff_mention_status:
           Используй только одно из значений:
           - "detected" — если в тексте упоминается штат / персонал /
             работники «товарищества» как единого целого;
           - "not_detected" — иначе.

        2. staff_mention_details:
           Краткое user-facing описание упоминания штата.
           Если данных нет — "Данные не определены".
           Если упоминание относится к отдельному товарищу —
           "не применимо: относится к отдельному товарищу".
           Если данные противоречивы — "Не удалось определить".

        3. bank_account_mention_status:
           Используй только одно из значений:
           - "detected" — если в тексте упоминается расчётный / банковский
             счёт на имя «товарищества»;
           - "not_detected" — иначе.

        4. bank_account_mention_details:
           Краткое user-facing описание упоминания счёта.
           Если данных нет — "Данные не определены".
           Если счёт относится к отдельному товарищу —
           "не применимо: счёт относится к отдельному товарищу (…)".
           Если данные противоречивы — "Не удалось определить".

        5. office_signage_mention_status:
           Использужи только одно из значений:
           - "detected" — если в тексте упоминается вывеска / офис /
             печать «товарищества» как единого целого;
           - "not_detected" — иначе.

        6. office_signage_mention_details:
           Краткое user-facing описание упоминания вывески / офиса /
           печати.
           Если данных нет — "Данные не определены".
           Если относится к отдельному товарищу —
           "не применимо: относится к отдельному товарищу".
           Если данные противоречивы — "Не удалось определить".

        7. separate_balance_mention_status:
           Используй только одно из значений:
           - "detected" — если в тексте упоминается отдельный баланс
             или обособленное имущество «товарищества» как единого
             целого;
           - "not_detected" — иначе.

        8. separate_balance_mention_details:
           Краткое user-facing описание упоминания отдельного баланса.
           Если данных нет — "Данные не определены".
           Если относится к отдельному товарищу —
           "не применимо: относится к отдельному товарищу".
           Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни requalification_risk_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_mention_status = "not_detected", все *_details = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не делай выводов по типовой структуре договора.
        - Не извлекай сведения о вкладах, распределении прибыли, ведении дел, выходе из товарищества, прекращении, налоговом учёте (кроме отдельного баланса как признака) и иных нерелевантных темах.
        - Признак фиксируется как "detected" только если упомянут применительно к «товариществу» как единому целому.
        - Признак, упомянутый только для отдельного товарища, фиксируется в *_details со значением "не применимо: относится к отдельному товарищу", но status = "not_detected".
        - Если в разных фрагментах указаны противоречивые сведения — статус → "not_detected", текстовое поле → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни упоминания штата товарищества, ни счёта
           товарищества, ни вывески / офиса / печати товарищества,
           ни отдельного баланса как признака.
           → presence = "missing";
             все *_mention_status = "not_detected";
             все *_details = "Данные не определены".

        2. Неполное раскрытие — признак относится к отдельному товарищу.
           Например, «расчётный счёт Товарища 1», «штат Товарища 2»,
           «офис Товарища 3».
           → presence = "missing";
             соответствующий *_mention_status = "not_detected";
             соответствующий *_details = "не применимо: относится
             к отдельному товарищу".

        3. Противоречие между фрагментами.
           В одном фрагменте признак фиксируется за товариществом,
           в другом — за отдельным товарищем.
           → presence = "unclear";
             соответствующий *_mention_status = "not_detected";
             соответствующий *_details = "Не удалось определить".

        4. Специфика темы — признаки ЮЛ присутствуют.
           В тексте упоминаются штат, счёт, офис или отдельный баланс
           товарищества как единого целого.
           → presence = "present";
             соответствующий *_mention_status = "detected";
             соответствующий *_details содержит дословную цитату.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для requalification_risk_check_presence используй только: "present", "missing", "unclear".
        - Для всех *_mention_status используй только: "detected", "not_detected".
        - Fallback при отсутствии данных:
          * все *_details → "Данные не определены".
        - Fallback при признаке, относящемся к отдельному товарищу:
          * соответствующий *_details → "не применимо: относится к отдельному товарищу", status = "not_detected".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "requalification_risk_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие признаков скрытого создания юридического лица. Внутреннее агрегатное signal-поле."
          required: true

        - name: "staff_mention_status"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Штат товарищества"
          allowed_values: ["detected", "not_detected"]
          description: "Наличие упоминания штата/персонала товарищества."
          required: true

        - name: "staff_mention_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Описание штата"
          description: "Упоминание штата/персонала товарищества как единого целого (для Drawer)."
          required: false

        - name: "bank_account_mention_status"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Счёт товарищества"
