        - pattern: "(?i)ст\\.\\s*1044\\s*ГК\\s*РФ"
          weight: 0.55
          distinctiveness: medium
          context: any
          description: "Ссылка на статью о ведении общих дел"

        - pattern: "(?i)ст\\.\\s*1047\\s*ГК\\s*РФ"
          weight: 0.55
          distinctiveness: medium
          context: any
          description: "Ссылка на статью о ответственности по обязательствам"

      low:
        - pattern: "(?i)раздел\\s+имуществ[аа]"
          weight: 0.3
          distinctiveness: low
          context: any
          description: "Раздел общего имущества при прекращении товарищества"

        - pattern: "(?i)внутренн[я-яё]+\\s+отч[её]тност[ьи]"
          weight: 0.25
          distinctiveness: low
          context: any
          description: "Внутренняя отчетность товарищей"

        - pattern: "(?i)\\bdeadlock\\b"
          weight: 0.3
          distinctiveness: low
          context: any
          description: "Deadlock-ситуации в управлении"

        - pattern: "(?i)тупиков[а-яё]+\\s+ситуаци[яя]"
          weight: 0.3
          distinctiveness: low
          context: any
          description: "Тупиковые ситуации в принятии решений"

        - pattern: "(?i)\\bрегресс\\b"
          weight: 0.25
          distinctiveness: low
          context: any
          description: "Регрессные отношения между товарищами"

        - pattern: "(?i)правопреемств[оо]"
          weight: 0.25
          distinctiveness: low
          context: any
          description: "Правопреемство при смене участников"

    exclusions:
