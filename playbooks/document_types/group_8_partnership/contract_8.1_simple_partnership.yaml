  - id: information_and_reporting_check
    name: "Право на информацию и отчётность (ст. 1045 ГК РФ)"
    description: >
      Фактографическая проверка условий о праве товарищей на информацию,
      периодичности отчётности, доступе к документации, праве на аудит
      и наличии ничтожных условий об отказе от права на информацию
      (п. 2 ст. 1045 ГК РФ).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 60

    rules:
      keywords:
        - "право на информацию"
        - "право знакомиться"
        - "отчётность"
        - "отчет ведущего дела"
        - "доступ к документации"
        - "первичные документы"
        - "бухгалтерская отчётность"
        - "ежеквартальный отчёт"
        - "аудит"
        - "аудиторская проверка"
        - "ознакомление"
        - "отказ от права на информацию"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)право\\s+на\\s+информаци"
        - "(?i)(право\\s+)?знакомит"
        - "(?i)отч[её]тност"
        - "(?i)аудит"
        - "(?i)отказ\\s+от\\s+права"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор простого товарищества (ст. 1045 ГК РФ).
        Проверяется только один вопрос: право на информацию, отчётность,
        доступ к документации, право на аудит.
        Нормативные ориентиры:
        - п. 1 ст. 1045 ГК РФ — каждый товарищ вправе знакомиться
          со всей документацией по ведению дел. Это право не может быть
          ограничено договором.
        - п. 2 ст. 1045 ГК РФ — отказ от этого права НЕ ИМЕЕТ СИЛЫ
          (ничтожен), в том числе если он включён в договор.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Отсутствие условий об отчётности — сам по себе факт;
          применяются императивные нормы ст. 1045 ГК РФ.
        - Условия, ограничивающие право товарища на информацию или
          устанавливающие отказ от него, ничтожны — фиксируй их наличие.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Признание права товарищей на информацию.
        2. Условия об ограничении права на информацию или об отказе
           от него (признак ничтожности по п. 2 ст. 1045 ГК РФ).
        3. Периодичность отчётности ведущего дела.
        4. Доступ к первичным документам.
        5. Право на аудит / аудиторскую проверку.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Для enum-полей (*_status) при отсутствии данных возвращай
           "not_defined"; для information_right_waiver — "not_detected".
        4. Для строковых *_details при отсутствии данных возвращай строго
           "Данные не определены".
        5. Не используй "None", "null", пустые строки или отсутствующие ключи.
        6. В evidence включай только прямые цитаты из текста договора.
        7. information_right_waiver = "detected" ТОЛЬКО если в договоре
           прямо ограничивается право товарища на информацию (например,
           доступ только с согласия ведущего дела, только по решению
           собрания, отказ товарища от права) или устанавливается отказ
           от него. Общее ограничение конфиденциальности — НЕ waiver.
        8. Верни РОВНО один валидный JSON-объект со всеми 10 ключами
           (9 полей + evidence), пригодный для парсинга через json.loads
           без предварительной обработки. Без markdown, без ```json,
           без комментариев, без текста до или после. Начни ответ сразу
           с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — право на информацию, отчёт и аудит определены:
        Фрагмент:
        "Каждый товарищ имеет право знакомиться со всей документацией
        по ведению общих дел. Ведущий дела представляет ежеквартальный
        отчёт с приложением первичных документов. Товарищи вправе
        привлекать независимого аудитора."
        Ответ:
        {
          "information_right_status": "defined",
          "information_right_details": "право знакомиться со всей документацией по ведению общих дел",
          "information_right_waiver": "not_detected",
          "reporting_frequency_status": "defined",
          "reporting_frequency_details": "ежеквартальный отчёт с приложением первичных документов",
          "document_access_status": "defined",
          "document_access_details": "доступ к первичным документам",
          "audit_right_status": "defined",
          "audit_right_details": "право привлекать независимого аудитора",
          "evidence": [
            {"clause_ref": "п. 6.1", "quote": "Каждый товарищ имеет право знакомиться со всей документацией по ведению общих дел."},
            {"clause_ref": "п. 6.2", "quote": "Ведущий дела представляет ежеквартальный отчёт с приложением первичных документов."},
            {"clause_ref": "п. 6.3", "quote": "Товарищи вправе привлекать независимого аудитора."}
          ]
        }

        Пример 2 — ничтожное условие об ограничении права на информацию:
        Фрагмент:
        "Товарищ вправе знакомиться с документацией товарищества только
        с письменного согласия ведущего дела. Товарищи отказываются
        от права на аудиторскую проверку."
        Ответ:
        {
          "information_right_status": "defined",
          "information_right_details": "право знакомиться с документацией только с письменного согласия ведущего дела",
          "information_right_waiver": "detected",
          "reporting_frequency_status": "not_defined",
          "reporting_frequency_details": "Данные не определены",
          "document_access_status": "defined",
          "document_access_details": "доступ только с письменного согласия ведущего дела",
          "audit_right_status": "defined",
          "audit_right_details": "отказ от права на аудит",
          "evidence": [
            {"clause_ref": "п. 6.1", "quote": "Товарищ вправе знакомиться с документацией товарищества только с письменного согласия ведущего дела."},
            {"clause_ref": "п. 6.4", "quote": "Товарищи отказываются от права на аудиторскую проверку."}
          ]
        }

        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Стороны обязуются исполнять договор."
        Ответ:
        {
          "information_right_status": "not_defined",
          "information_right_details": "Данные не определены",
          "information_right_waiver": "not_detected",
          "reporting_frequency_status": "not_defined",
          "reporting_frequency_details": "Данные не определены",
          "document_access_status": "not_defined",
          "document_access_details": "Данные не определены",
          "audit_right_status": "not_defined",
          "audit_right_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Все 10 ключей (9 полей + evidence) присутствуют в JSON?
        2. Найдена ли прямая цитата о праве на информацию?
        3. Проверено ли наличие условий об ограничении / отказе
           от права на информацию (п. 2 ст. 1045 ГК РФ)?
        4. Найдена ли периодичность отчётности?
        5. Найден ли доступ к документам?
        6. Найдено ли право на аудит?
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "information_right_status": "<defined / not_defined>",
          "information_right_details": "<текст или 'Данные не определены'>",
          "information_right_waiver": "<detected / not_detected>",
          "reporting_frequency_status": "<defined / not_defined>",
          "reporting_frequency_details": "<текст или 'Данные не определены'>",
          "document_access_status": "<defined / not_defined>",
          "document_access_details": "<текст или 'Данные не определены'>",
          "audit_right_status": "<defined / not_defined>",
          "audit_right_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 700

    retrieval:
      retrieval_profile: "notice_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "право на информацию право знакомиться отчётность отчет ведущего дела доступ к документации первичные документы бухгалтерская отчётность ежеквартальный отчёт аудит аудиторская проверка ознакомление отказ от права на информацию ограничение права на информацию"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "вклад"
        - "распределение прибыли"
        - "выход из товарищества"
        - "прекращение"
        - "налоговый учёт"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.35, 0.75]
        boost: 0.12
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 550

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1200
      compact_output: false
      store_payload: true
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора простого товарищества
        сведения о праве на информацию, отчётности, доступе к документации,
        праве на аудит и наличии условий об отказе от права на информацию.
        Не анализируй вклады, прибыль, ведение дел или прекращение.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 9 полей + evidence (всего 10 ключей):
        1. information_right_status — "defined" или "not_defined".
        2. information_right_details — условие о праве товарищей
           на информацию.
        3. information_right_waiver — "detected" если есть условие
           об ограничении права на информацию или об отказе от него;
           иначе "not_detected".
        4. reporting_frequency_status — "defined" или "not_defined".
        5. reporting_frequency_details — периодичность отчётности.
        6. document_access_status — "defined" или "not_defined".
        7. document_access_details — доступ к документации.
        8. audit_right_status — "defined" или "not_defined".
        9. audit_right_details — право на аудит.

        Если данные отсутствуют:
        - для *_status: "not_defined"
        - для information_right_waiver: "not_detected"
        - для *_details: "Данные не определены"
        </task>

        <rules>
        - Используй только текст договора.
        - information_right_waiver = "detected" только при прямом
          ограничении права товарища на информацию или отказе от него
          (например, доступ только с согласия ведущего дела, только
          по решению собрания, отказ от аудита).
        - Общее условие конфиденциальности НЕ является waiver.
        - reporting_frequency_details: периодичность отчётности
          (ежемесячно, ежеквартально, по требованию и т.п.).
        - document_access_details: условие о доступе к первичным
          документам (кто, как, когда).
        - Верни РОВНО один валидный JSON-объект со всеми 10 ключами
          (9 полей + evidence), пригодный для парсинга через json.loads
          без предварительной обработки. Без markdown, без ```json,
          без комментариев, без текста до или после. Начни ответ сразу
          с { и закончи }.
        </rules>

        <cove>
        1. Все 10 ключей (9 полей + evidence) присутствуют в JSON?
        2. Все *_status — строго "defined" / "not_defined"?
        3. information_right_waiver — строго "detected" / "not_detected"?
        4. Все *_details заполнены или "Данные не определены"?
        Не выводи шаги. Верни только JSON.
        </cove>
      fields:
        - name: "information_right_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус признания права на информацию."
          required: true
        - name: "information_right_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Право на информацию"
          description: "Условие о праве товарищей на информацию."
          required: true
        - name: "information_right_waiver"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Ограничение права"
          allowed_values: ["detected", "not_detected"]
          description: "Наличие ничтожного условия об ограничении / отказе от права на информацию (п. 2 ст. 1045 ГК РФ)."
          required: false
        - name: "reporting_frequency_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения периодичности отчётности."
          required: false
        - name: "reporting_frequency_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Периодичность отчётности"
          description: "Периодичность представления отчётов."
          required: false
        - name: "document_access_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус доступа к документации."
          required: false
        - name: "document_access_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 4
          label: "Доступ к документам"
          description: "Условие о доступе к первичным документам."
          required: false
        - name: "audit_right_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус права на аудит."
          required: false
        - name: "audit_right_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 5
          label: "Право на аудит"
          description: "Условие о праве на аудит."
          required: false

  - id: common_property_check
    name: "Режим общей долевой собственности (ст. 1043 ГК РФ)"
    description: >
      Фактографическая проверка режима общего имущества товарищей,
      отклонений от презумпции общей долевой собственности (п. 1 ст. 1043
      ГК РФ), способа определения долей, порядка распоряжения и пользования
      общим имуществом, а также государственной регистрации права
      на недвижимое имущество.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 70

    rules:
      keywords:
        - "общая долевая собственность"
        - "общее имущество"
        - "общее имущество товарищей"
        - "доля в общем имуществе"
        - "распоряжение общим имуществом"
        - "пользование общим имуществом"
        - "определение долей"
        - "преимущественное право покупки"
        - "отчуждение доли"
        - "государственная регистрация права"
        - "внесённое имущество"
        - "имущество, переданное в пользование"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)общ[а-яё]+\\s+долев[а-яё]+\\s+собственност"
        - "(?i)общ[ео]е\\s+имуществ"
        - "(?i)дол[яю]\\s+в\\s+общ"
        - "(?i)(гос|государственн)[а-яё]*\\s+регистрац"
        - "(?i)преимущественн[а-яё]+\\s+прав"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор простого товарищества (ст. 1043 ГК РФ).
        Проверяется только один вопрос: режим общего имущества товарищей,
        доли, распоряжение и пользование.
        Нормативные ориентиры:
        - п. 1 ст. 1043 ГК РФ — внесённое товарищами имущество, которым
          они обладали на праве собственности, а также продукция и доходы
          признаются их ОБЩЕЙ ДОЛЕВОЙ собственностью, если иное не
          установлено законом, договором или не следует из существа
          обязательства.
        - п. 2 ст. 1043 ГК РФ — имущество, внесённое по иным основаниям
          (аренда, лизинг), используется в интересах всех товарищей
          и составляет их общее имущество; ведение учёта может быть
          поручено одному из товарищей — юридических лиц.
        - ст. 245 ГК РФ — доли presumed равными, если не установлено иное.
        - ст. 246 ГК РФ — распоряжение общим имуществом по соглашению всех.
        - ст. 250 ГК РФ — преимущественное право покупки доли.
        - ст. 131 ГК РФ, 218-ФЗ — госрегистрация права на недвижимость.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Отклонение от презумпции общей долевой собственности — допустимо,
          но должно быть явным.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Режим общего имущества: общая долевая собственность / иное.
        2. Отклонения от презумпции общей долевой собственности.
        3. Способ определения долей (пропорционально вкладам / иной).
        4. Порядок распоряжения общим имуществом.
        5. Порядок пользования общим имуществом.
        6. Необходимость государственной регистрации права
           (для недвижимого имущества).

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Для enum-полей (*_status, common_property_regime_code,
           regime_deviations_code) при отсутствии данных возвращай
           "not_defined" (для regime_deviations_code — "not_detected").
        4. Для строковых *_details при отсутствии данных возвращай строго
           "Данные не определены".
        5. Не используй "None", "null", пустые строки или отсутствующие ключи.
        6. В evidence включай только прямые цитаты из текста договора.
        7. common_property_regime_code = "share" ТОЛЬКО если прямо указана
           общая долевая собственность. "single_owner" — если имущество
           в собственности одного товарища. "other" — иной режим
           (совместная собственность, долевая с иными правилами).
        8. regime_deviations_code = "detected" если договором установлено
           отклонение от презумпции общей долевой собственности
           (п. 1 ст. 1043 ГК РФ), например, имущество закрепляется
           за одним товарищем или передаётся в пользование другим.
        9. state_registration_status = "defined" ТОЛЬКО если в договоре
           прямо упоминается государственная регистрация права
           на недвижимое имущество (или указано на недвижимость во вкладе).
        10. Верни РОВНО один валидный JSON-объект со всеми 13 ключами
            (12 полей + evidence), пригодный для парсинга через json.loads
            без предварительной обработки. Без markdown, без ```json,
            без комментариев, без текста до или после. Начни ответ сразу
            с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — стандартный режим общей долевой собственности:
        Фрагмент:
        "Внесённое товарищами имущество, а также продукция и доходы
        признаются их общей долевой собственностью. Доли определяются
        пропорционально стоимости вкладов. Распоряжение общим имуществом
        осуществляется по единогласному решению всех товарищей."
        Ответ:
        {
          "common_property_regime_code": "share",
          "common_property_regime_details": "общая долевая собственность на внесённое имущество, продукцию и доходы",
          "regime_deviations_code": "not_detected",
          "regime_deviations_details": "Данные не определены",
          "shares_determination_status": "defined",
          "shares_determination_details": "пропорционально стоимости вкладов",
          "disposal_procedure_status": "defined",
          "disposal_procedure_details": "по единогласному решению всех товарищей",
          "use_procedure_status": "not_defined",
          "use_procedure_details": "Данные не определены",
          "state_registration_status": "not_defined",
          "state_registration_details": "Данные не определены",
          "evidence": [
            {"clause_ref": "п. 2.5", "quote": "Внесённое товарищами имущество, а также продукция и доходы признаются их общей долевой собственностью."},
            {"clause_ref": "п. 2.6", "quote": "Доли определяются пропорционально стоимости вкладов."},
            {"clause_ref": "п. 3.1", "quote": "Распоряжение общим имуществом осуществляется по единогласному решению всех товарищей."}
          ]
        }

        Пример 2 — отклонение от презумпции (single_owner):
        Фрагмент:
        "Оборудование, внесённое Товарищем 1, остаётся в его собственности.
        Остальные товарищи вправе пользоваться им для целей товарищества."
        Ответ:
        {
          "common_property_regime_code": "single_owner",
          "common_property_regime_details": "оборудование в собственности Товарища 1 с правом пользования остальных товарищей",
          "regime_deviations_code": "detected",
          "regime_deviations_details": "отклонение от презумпции общей долевой собственности: оборудование закреплено за Товарищем 1",
          "shares_determination_status": "not_defined",
          "shares_determination_details": "Данные не определены",
          "disposal_procedure_status": "not_defined",
          "disposal_procedure_details": "Данные не определены",
          "use_procedure_status": "defined",
          "use_procedure_details": "право пользования оборудованием для целей товарищества",
          "state_registration_status": "not_defined",
          "state_registration_details": "Данные не определены",
          "evidence": [
            {"clause_ref": "п. 2.1", "quote": "Оборудование, внесённое Товарищем 1, остаётся в его собственности."},
            {"clause_ref": "п. 2.2", "quote": "Остальные товарищи вправе пользоваться им для целей товарищества."}
          ]
        }

        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Стороны вносят вклады."
        Ответ:
        {
          "common_property_regime_code": "not_defined",
          "common_property_regime_details": "Данные не определены",
          "regime_deviations_code": "not_detected",
          "regime_deviations_details": "Данные не определены",
          "shares_determination_status": "not_defined",
          "shares_determination_details": "Данные не определены",
          "disposal_procedure_status": "not_defined",
          "disposal_procedure_details": "Данные не определены",
          "use_procedure_status": "not_defined",
          "use_procedure_details": "Данные не определены",
          "state_registration_status": "not_defined",
          "state_registration_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Все 13 ключей (12 полей + evidence) присутствуют в JSON?
        2. Найдена ли прямая цитата о режиме общего имущества?
        3. Проверено ли наличие отклонений от презумпции
           общей долевой собственности?
        4. Найден ли способ определения долей?
        5. Найден ли порядок распоряжения и пользования?
        6. Упомянута ли государственная регистрация права
           (для недвижимости)?
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "common_property_regime_code": "<share / single_owner / other / not_defined>",
          "common_property_regime_details": "<текст или 'Данные не определены'>",
          "regime_deviations_code": "<detected / not_detected>",
          "regime_deviations_details": "<описание или 'Данные не определены'>",
          "shares_determination_status": "<defined / not_defined>",
          "shares_determination_details": "<текст или 'Данные не определены'>",
          "disposal_procedure_status": "<defined / not_defined>",
          "disposal_procedure_details": "<текст или 'Данные не определены'>",
          "use_procedure_status": "<defined / not_defined>",
          "use_procedure_details": "<текст или 'Данные не определены'>",
          "state_registration_status": "<defined / not_defined>",
          "state_registration_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 700

    retrieval:
      retrieval_profile: "title_transfer_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "общая долевая собственность общее имущество товарищей доля в общем имуществе распоряжение общим имуществом пользование общим имуществом определение долей пропорционально вкладам внесённое имущество продукция доходы преимущественное право покупки отчуждение доли государственная регистрация права"
      preferred_unit_types:
        - obligation
        - general_provision
        - title_transfer
      excluded_unit_types:
        - definition
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "распределение прибыли"
        - "выход из товарищества"
        - "прекращение"
        - "налоговый учёт"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.10, 0.60]
        boost: 0.15
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1400
      compact_output: false
      store_payload: true
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора простого товарищества
        сведения о режиме общего имущества: собственность, доли,
        распоряжение, пользование, государственная регистрация.
        Не анализируй вклады как таковые, прибыль, ведение дел
        или прекращение.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 12 полей + evidence (всего 13 ключей):
        1. common_property_regime_code — "share" (общая долевая собственность) /
           "single_owner" (в собственности одного товарища) / "other" /
           "not_defined".
        2. common_property_regime_details — прямая цитата о режиме
           имущества.
        3. regime_deviations_code — "detected" если есть отклонение
           от презумпции общей долевой собственности; иначе "not_detected".
        4. regime_deviations_details — описание отклонения.
        5. shares_determination_status — "defined" или "not_defined".
        6. shares_determination_details — способ определения долей.
        7. disposal_procedure_status — "defined" или "not_defined".
        8. disposal_procedure_details — порядок распоряжения.
        9. use_procedure_status — "defined" или "not_defined".
        10. use_procedure_details — порядок пользования.
        11. state_registration_status — "defined" или "not_defined".
        12. state_registration_details — условие о госрегистрации права.

        Если данные отсутствуют:
        - для *_status: "not_defined"
        - для regime_deviations_code: "not_detected"
        - для *_details: "Данные не определены"
        </task>

        <rules>
        - Используй только текст договора.
        - common_property_regime_code = "share" только при прямом указании
          общей долевой собственности.
        - common_property_regime_code = "single_owner" если имущество
          закрепляется за одним товарищем.
        - regime_deviations_code = "detected" при явном отклонении от
          презумпции п. 1 ст. 1043 ГК РФ.
        - state_registration_status = "defined" если в договоре
          упоминается госрегистрация права на недвижимость или
          наличие недвижимости во вкладе.
        - Верни РОВНО один валидный JSON-объект со всеми 13 ключами
          (12 полей + evidence), пригодный для парсинга через json.loads
          без предварительной обработки. Без markdown, без ```json,
          без комментариев, без текста до или после. Начни ответ сразу
          с { и закончи }.
        </rules>

        <cove>
        1. Все 13 ключей (12 полей + evidence) присутствуют в JSON?
        2. common_property_regime_code — строго из allowed_values?
        3. regime_deviations_code — строго "detected" / "not_detected"?
        4. Все *_status — строго "defined" / "not_defined"?
        5. Все *_details заполнены или "Данные не определены"?
        Не выводи шаги. Верни только JSON.
        </cove>
      fields:
        - name: "common_property_regime_code"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Режим имущества"
          allowed_values: ["share", "single_owner", "other", "not_defined"]
          description: "Режим общего имущества товарищей."
          required: true
        - name: "common_property_regime_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Основание режима"
          description: "Прямая цитата о режиме имущества (для Drawer)."
          required: false
        - name: "regime_deviations_code"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Отклонения от ст. 1043"
          allowed_values: ["detected", "not_detected"]
          description: "Наличие отклонений от презумпции общей долевой собственности (п. 1 ст. 1043 ГК РФ)."
          required: false
        - name: "regime_deviations_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Описание отклонений"
          description: "Описание отклонений от презумпции (для Drawer)."
          required: false
        - name: "shares_determination_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения долей."
          required: false
        - name: "shares_determination_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Определение долей"
          description: "Способ определения долей в общем имуществе."
          required: false
        - name: "disposal_procedure_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения порядка распоряжения."
          required: false
        - name: "disposal_procedure_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 4
          label: "Распоряжение имуществом"
          description: "Порядок распоряжения общим имуществом."
          required: false
        - name: "use_procedure_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения порядка пользования."
          required: false
        - name: "use_procedure_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Пользование имуществом"
          description: "Порядок пользования общим имуществом (для Drawer)."
          required: false
        - name: "state_registration_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус упоминания государственной регистрации права."
          required: false
        - name: "state_registration_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 5
          label: "Госрегистрация права"
          description: "Условие о государственной регистрации права на недвижимое имущество."
          required: false

  - id: withdrawal_and_termination_check
    name: "Выход из товарищества, прекращение и раздел имущества (ст. 1050–1052 ГК РФ)"
    description: >
      Фактографическая проверка режима выхода (свободный по бессрочному
      договору — ст. 1051 ГК РФ; только по уважительной причине
      по срочному — ст. 1052 ГК РФ), срока уведомления, порядка оценки
      и выплаты доли, оснований прекращения (ст. 1050 ГК РФ) и порядка
      раздела имущества, включая возврат вкладов в натуре.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 80

    rules:
      keywords:
        - "право на выход"
        - "выход из товарищества"
        - "уведомление о выходе"
        - "выдел доли"
        - "оценка доли при выходе"
        - "прекращение договора"
        - "расторжение договора"
        - "раздел имущества"
        - "ликвидация общего имущества"
        - "возврат вклада в натуре"
        - "денежная компенсация доли"
        - "бессрочный договор"
        - "срочный договор"
        - "уважительная причина"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)выход\\s+из\\s+товариществ"
        - "(?i)(прекращени|расторжени)[ея]\\s+договор"
        - "(?i)раздел\\s+имуществ"
        - "(?i)возврат[а-яё]*\\s+в\\s+натур"
        - "(?i)(бессрочн|срочн)[а-яё]+\\s+договор"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор простого товарищества (ст. 1050–1052 ГК РФ).
        Проверяется только один вопрос: выход из товарищества, прекращение
        договора и раздел имущества.
        Нормативные ориентиры:
        - ст. 1051 ГК РФ — БЕССРОЧНЫЙ договор: товарищ вправе в любое
          время выйти, уведомив остальных за 3 месяца (по умолчанию;
          иной срок может быть установлен договором).
        - ст. 1052 ГК РФ — СРОЧНЫЙ договор: выход только по уважительной
          причине с возмещением убытков остальным товарищам; срочный
          договор может быть расторгнут по требованию товарища
          с возмещением реального ущерба.
        - п. 2 ст. 1050 ГК РФ — вещи, переданные в общее владение
          или пользование, возвращаются предоставившим их товарищам
          без вознаграждения, если иное не установлено соглашением.
        - п. 3 ст. 1050 ГК РФ — раздел общего имущества по ст. 252 ГК РФ;
          индивидуально определённая вещь может быть истребована
          с соблюдением интересов остальных товарищей и кредиторов.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Различай: бессрочный договор = свободный выход; срочный =
          выход только по уважительной причине.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Право товарища на выход.
        2. Режим выхода: свободный (бессрочный) / только по уважительной
           причине (срочный).
        3. Срок уведомления о выходе.
        4. Способ оценки доли при выходе.
        5. Срок выплаты доли.
        6. Основания прекращения договора.
        7. Порядок раздела имущества при прекращении.
        8. Режим возврата вкладов при прекращении (в натуре / денежная
           компенсация / смешанный).

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Для enum-полей (*_status) при отсутствии данных возвращай
           "not_defined".
        4. Для строковых *_details при отсутствии данных возвращай строго
           "Данные не определены".
        5. Не используй "None", "null", пустые строки или отсутствующие ключи.
        6. В evidence включай только прямые цитаты из текста договора.
        7. withdrawal_regime_code: "free" — если договор бессрочный и товарищ
           вправе выйти в любое время; "with_cause" — если для выхода
           требуется уважительная причина или возмещение убытков;
           "mixed" — если для разных случаев установлены разные режимы.
        8. property_return_regime: "in_kind" — если прямо указан возврат
           вкладов в натуре; "monetary" — если предусмотрена денежная
           компенсация; "mixed" — сочетание.
        9. Верни РОВНО один валидный JSON-объект со всеми 16 ключами
           (15 полей + evidence), пригодный для парсинга через json.loads
           без предварительной обработки. Без markdown, без ```json,
           без комментариев, без текста до или после. Начни ответ сразу
           с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — бессрочный договор, свободный выход:
        Фрагмент:
        "Договор действует бессрочно. Товарищ вправе выйти из товарищества
        в любое время, уведомив остальных товарищей за 3 месяца. Доля
        оценивается по рыночной стоимости независимым оценщиком, выплата —
        в течение 60 дней с даты выхода. При прекращении договора имущество
        делится пропорционально вкладам, вещи, переданные в пользование,
        возвращаются в натуре."
        Ответ:
        {
          "withdrawal_right_status": "defined",
          "withdrawal_right_details": "право выйти в любое время, уведомив за 3 месяца",
          "withdrawal_regime_code": "free",
          "withdrawal_regime_details": "бессрочный договор, свободный выход",
          "notice_period_status": "defined",
          "notice_period_details": "за 3 месяца",
          "valuation_method_status": "defined",
          "valuation_method_details": "по рыночной стоимости независимым оценщиком",
          "payment_deadline_status": "defined",
          "payment_deadline_details": "в течение 60 дней с даты выхода",
          "termination_grounds_status": "not_defined",
          "termination_grounds_details": "Данные не определены",
          "property_division_status": "defined",
          "property_division_details": "пропорционально вкладам",
          "property_return_regime": "in_kind",
          "evidence": [
            {"clause_ref": "п. 8.1", "quote": "Договор действует бессрочно."},
            {"clause_ref": "п. 8.2", "quote": "Товарищ вправе выйти из товарищества в любое время, уведомив остальных товарищей за 3 месяца."},
            {"clause_ref": "п. 8.3", "quote": "Доля оценивается по рыночной стоимости независимым оценщиком, выплата — в течение 60 дней с даты выхода."},
            {"clause_ref": "п. 8.5", "quote": "При прекращении договора имущество делится пропорционально вкладам, вещи, переданные в пользование, возвращаются в натуре."}
          ]
        }

        Пример 2 — срочный договор, выход только по уважительной причине:
        Фрагмент:
        "Договор заключён на 5 лет. Досрочный выход товарища возможен
        только при наличии уважительных причин с возмещением убытков
        остальным товарищам. При прекращении договора вклады возвращаются
        в денежной форме в размере их оценки."
        Ответ:
        {
          "withdrawal_right_status": "defined",
          "withdrawal_right_details": "досрочный выход только при уважительных причинах с возмещением убытков",
          "withdrawal_regime_code": "with_cause",
          "withdrawal_regime_details": "срочный договор на 5 лет, выход только по уважительной причине",
          "notice_period_status": "not_defined",
          "notice_period_details": "Данные не определены",
          "valuation_method_status": "not_defined",
          "valuation_method_details": "Данные не определены",
          "payment_deadline_status": "not_defined",
          "payment_deadline_details": "Данные не определены",
          "termination_grounds_status": "not_defined",
          "termination_grounds_details": "Данные не определены",
          "property_division_status": "defined",
          "property_division_details": "вклады возвращаются в денежной форме в размере их оценки",
          "property_return_regime": "monetary",
          "evidence": [
            {"clause_ref": "п. 8.1", "quote": "Договор заключён на 5 лет."},
            {"clause_ref": "п. 8.2", "quote": "Досрочный выход товарища возможен только при наличии уважительных причин с возмещением убытков остальным товарищам."},
            {"clause_ref": "п. 8.5", "quote": "При прекращении договора вклады возвращаются в денежной форме в размере их оценки."}
          ]
        }

        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Договор действует до достижения цели."
        Ответ:
        {
          "withdrawal_right_status": "not_defined",
          "withdrawal_right_details": "Данные не определены",
          "withdrawal_regime_code": "not_defined",
          "withdrawal_regime_details": "Данные не определены",
          "notice_period_status": "not_defined",
          "notice_period_details": "Данные не определены",
          "valuation_method_status": "not_defined",
          "valuation_method_details": "Данные не определены",
          "payment_deadline_status": "not_defined",
          "payment_deadline_details": "Данные не определены",
          "termination_grounds_status": "not_defined",
          "termination_grounds_details": "Данные не определены",
          "property_division_status": "not_defined",
          "property_division_details": "Данные не определены",
          "property_return_regime": "not_defined",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Все 16 ключей (15 полей + evidence) присутствуют в JSON?
        2. Найдена ли прямая цитата о праве на выход?
        3. Определён ли режим выхода (бессрочный / срочный)?
        4. Найден ли срок уведомления?
        5. Найден ли способ оценки доли?
        6. Найден ли срок выплаты доли?
        7. Найдены ли основания прекращения и порядок раздела?
        8. Определён ли режим возврата вкладов?
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "withdrawal_right_status": "<defined / not_defined>",
          "withdrawal_right_details": "<текст или 'Данные не определены'>",
          "withdrawal_regime_code": "<free / with_cause / mixed / not_defined>",
          "withdrawal_regime_details": "<текст или 'Данные не определены'>",
          "notice_period_status": "<defined / not_defined>",
          "notice_period_details": "<текст или 'Данные не определены'>",
          "valuation_method_status": "<defined / not_defined>",
          "valuation_method_details": "<текст или 'Данные не определены'>",
          "payment_deadline_status": "<defined / not_defined>",
          "payment_deadline_details": "<текст или 'Данные не определены'>",
          "termination_grounds_status": "<defined / not_defined>",
          "termination_grounds_details": "<текст или 'Данные не определены'>",
          "property_division_status": "<defined / not_defined>",
