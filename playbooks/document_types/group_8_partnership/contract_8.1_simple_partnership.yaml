  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 9: Смерть/банкротство товарища, правопреемство
  # ──────────────────────────────────────────────────────────────────────────
  - id: death_bankruptcy_succession_check
    name: "Последствия смерти/банкротства товарища и правопреемство"
    description: >
      Фактографическая проверка условий о последствиях смерти или банкротства
      товарища: прекращение договора, продолжение с наследниками, право выкупа доли.
    triggers:
      any: ["death_bankruptcy_consequences"]
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "смерть товарища"
        - "банкротство"
        - "ликвидация участника"
        - "наследники"
        - "правопреемники"
        - "продолжение с наследниками"
        - "право выкупа доли"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)смерт[ьи]\\s+товарищ"
        - "(?i)наследник"
        - "(?i)правопреемник"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор простого товарищества (ст. 1050 ГК РФ).
        Проверяется только один вопрос: последствия смерти/банкротства товарища.
        Важно:
        - По умолчанию смерть/банкротство ПРЕКРАЩАЮТ договор (ст. 1050 ГК РФ).
        [ЗАДАЧА]
        Найди в тексте договора:
        1. Последствия смерти товарища для договора.
        2. Возможность продолжения с наследниками.
        3. Право выкупа доли умершего/обанкротившегося товарища.
        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если данные не указаны — "not_defined" / "Данные не определены".
        3. В evidence — только текст договора.
        4. Верни только один JSON-объект.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1:
        Фрагмент:
        "В случае смерти товарища договор продолжается с его наследниками
        при условии их согласия. Остальные товарищи имеют преимущественное
        право выкупа доли умершего товарища."
        Ответ:
        {
          "death_consequence_status": "defined",
          "death_consequence_details": "договор продолжается с наследниками при их согласии",
          "continuation_with_heirs_status": "defined",
          "continuation_with_heirs_details": "при условии согласия наследников",
          "buyout_right_status": "defined",
          "buyout_right_details": "преимущественное право выкупа доли",
          "evidence": [
            {
              "clause_ref": "п. 9.1",
              "quote": "В случае смерти товарища договор продолжается с его наследниками."
            }
          ]
        }
        Пример 2:
        Фрагмент:
        "Договор действует до достижения цели."
        Ответ:
        {
          "death_consequence_status": "not_defined",
          "death_consequence_details": "Данные не определены",
          "continuation_with_heirs_status": "not_defined",
          "continuation_with_heirs_details": "Данные не определены",
          "buyout_right_status": "not_defined",
          "buyout_right_details": "Данные не определены",
          "evidence": []
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о последствиях смерти.
        2. Найди прямую цитату о наследниках.
        3. Найди прямую цитату о выкупе доли.
        4. Если прямой цитаты нет — верни "not_defined".
        Не выводи шаги. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "death_consequence_status": "<defined / not_defined>",
          "death_consequence_details": "<текст или 'Данные не определены'>",
          "continuation_with_heirs_status": "<defined / not_defined>",
          "continuation_with_heirs_details": "<текст или 'Данные не определены'>",
          "buyout_right_status": "<defined / not_defined>",
          "buyout_right_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 550

    retrieval:
      retrieval_profile: "event_of_default_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "смерть товарища банкротство ликвидация участника наследники правопреемники продолжение с наследниками право выкупа доли прекращение договора при смерти"
      preferred_unit_types:
        - termination_provision
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - procedures
        - remedies
      negative_keywords:
        - "вклад"
        - "распределение прибыли"
        - "ведение дел"
        - "доверенность"
        - "налоговый учёт"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.60, 1.0]
        boost: 0.12
        scope: segment
      context_k: 5
      max_chunks: 6
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "procedures"
        - "remedies"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 500

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 700

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора простого товарищества сведения
        о последствиях смерти/банкротства товарища и правопреемстве.
        Не анализируй вклады, прибыль, ведение дел или налоги.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:
        1. death_consequence_status — "defined" или "not_defined".
        2. death_consequence_details — последствия смерти/банкротства.
        3. continuation_with_heirs_status — "defined" или "not_defined".
        4. continuation_with_heirs_details — продолжение с наследниками.
        5. buyout_right_status — "defined" или "not_defined".
        6. buyout_right_details — право выкупа доли.

        Если данные отсутствуют:
        - статус = "not_defined"
        - текст = "Данные не определены"
        </task>

        <rules>
        - Используй только текст договора.
        - Верни только JSON.
        </rules>
      fields:
        - name: "death_consequence_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения последствий смерти/банкротства."
          required: true
        - name: "death_consequence_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Последствия смерти/банкротства"
          description: "Последствия смерти или банкротства товарища для договора."
          required: true
        - name: "continuation_with_heirs_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус условия о продолжении с наследниками."
          required: false
        - name: "continuation_with_heirs_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Продолжение с наследниками"
          description: "Условие о продолжении договора с наследниками."
          required: false
        - name: "buyout_right_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус права выкупа доли."
          required: false
        - name: "buyout_right_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Право выкупа доли"
          description: "Право выкупа доли умершего/обанкротившегося товарища."
          required: false
      store_payload: true

