          required: false
        - name: "disclosed_liability_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус ответственности при раскрытии существования товарищества."
          required: false
        - name: "disclosed_liability_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Ответственность при раскрытии"
