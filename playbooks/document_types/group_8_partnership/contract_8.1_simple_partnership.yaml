type: contract_8.1_simple_partnership
name: "Договор простого товарищества (о совместной деятельности)"

description: |
  Договор, по которому двое или несколько лиц (товарищей) обязуются соединить свои вклады
  и совместно действовать БЕЗ ОБРАЗОВАНИЯ ЮРИДИЧЕСКОГО ЛИЦА для извлечения прибыли
  или достижения иной не противоречащей закону цели.
  Вклады: деньги, имущество, профессиональные знания, навыки, деловая репутация, связи.
  Имущество — ОБЩАЯ ДОЛЕВАЯ СОБСТВЕННОСТЬ.
  При предпринимательской деятельности и участии хотя бы одного ИП/коммерческой организации
  ВСЕ товарищи несут СОЛИДАРНУЮ ОТВЕТСТВЕННОСТЬ по общим обязательствам ВСЕМ ЛИЧНЫМ ИМУЩЕСТВОМ.
  Гибкая форма кооперации без госрегистрации, но с высокими рисками личной ответственности.
  Регулируется ГК РФ Глава 55 (ст. 1041–1054).

version: 4.0
parent: class_8_partnership

# Структура
#   classification_runtime_v1  → YAMLRegistry (L1/L2 классификация)
#   trigger_definitions        → TriggerDetector
#   checks_v8                  → DocTypeCheckLoader (прямое исполнение)
#   doc_type_checks            → DocTypeCheckConverter (авто-конверсия)
#   dd_request_templates       → DDRequestTemplateLoader
#   compliance_rules           → exclusion_logic → compliance-проверки

metadata:
  category: contract
  subcategory: partnership
  complexity: high
  risk_level: critical
  jurisdiction: RU
  language: ru
  legal_base: "ГК РФ Глава 55 (ст. 1041–1054)"
  doc_types_supported:
    - "договор простого товарищества"
    - "договор о совместной деятельности"
    - "партнёрское соглашение"
    - "consortium agreement"
    - "joint venture agreement"

engine_expectations:
  evidence_required: true
  evidence_style: "pinpoint"
  allow_not_found: true
  output_style: "dd_grid"
  prefer_structured_outputs: true

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 1: КЛАССИФИКАЦИЯ (L1/L2)
#  Читается: YAMLRegistry → L1FilenameClassifier, L2HeaderClassifier
# ════════════════════════════════════════════════════════════════════════════

classification_runtime_v1:

  rules:
    filename_patterns:
      - "(?i)товарищест"
      - "(?i)совместн[а-яё]*\\s*деятельн"
      - "(?i)партнёр[а-яё]*\\s*(соглашени|договор)"
      - "(?i)joint[\\s_.-]?venture"
      - "(?i)consortium"

    folder_patterns:
      - "(?i)partnership"
      - "(?i)товарищество"
      - "(?i)совместн"
      - "(?i)joint[\\s_]?venture"

    keywords:

      high:
        - "(?i)прост[оеая]\\s+товариществ[оа]"
        - "(?i)совместн[аяое]\\s+деятельност[ьи]"
        - "(?i)договор\\s+прост[огоой]\\s+товариществ[аы]"
        - "(?i)договор\\s+о\\s+совместн[ойой]\\s+деятельност[иью]"
        - "(?i)партн[ёе]рск[оеое]\\s+соглашен[иеия]"
        - "(?i)consortium\\s+agreement"
        - "(?i)joint\\s+venture\\s+agreement"
        - "(?i)соединен[иеия]\\s+вклад[овы]"
        - "(?i)общ[аяое]\\s+цел[ььи]"
        - "(?i)без\\s+образован[ияи]\\s+юридическ[огоого\\s]*лиц[ауы]"
        - "(?i)веден[иеия]\\s+общих\\s+дел"
        - "(?i)общ[ееая]\\s+имуществ[оа]\\s+товарищ[еей]"
        - "(?i)солидарн[аяое]\\s+ответственност[ьи]"
        - "(?i)ст\\.\\s*1041\\s+гк\\s+рф"
        - "(?i)товарищ[иья]"

      medium:
        - "вклад товарища"
        - "распределение прибыли"
        - "распределение убытков"
        - "долевая собственность"
        - "товарищ ведущий дела"
        - "выход из товарищества"
        - "негласное товарищество"
        - "общие расходы"
        - "ст. 1042 ГК РФ"
        - "ст. 1044 ГК РФ"
        - "ст. 1047 ГК РФ"

      low:
        - "раздел имущества"
        - "внутренняя отчётность"
        - "deadlock"
        - "тупиковая ситуация"
        - "регресс"
        - "правопреемство"

    exclusions:
      - "создание юридического лица"
      - "ООО"
      - "учредительный договор"
      - "трудовой договор"
      - "агентский договор"
      - "инвестиционное товарищество"
      - "договор подряда"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 2: ТРИГГЕРЫ
#  Читается: TriggerDetector → doc.applicable_triggers
# ════════════════════════════════════════════════════════════════════════════

  trigger_definitions:

    two_or_more_partners:
      any_keywords:
        - "товарищ 1"
        - "товарищ 2"
        - "участники"
        - "стороны"
        - "двое или несколько лиц"

    common_goal_profit:
      any_keywords:
        - "извлечение прибыли"
        - "коммерческая деятельность"
        - "предпринимательская деятельность"
        - "получение дохода"

    common_goal_non_profit:
      any_keywords:
        - "иная не противоречащая закону цель"
        - "некоммерческая цель"
        - "благотворительная цель"
        - "социальная цель"

    entrepreneur_present:
      any_keywords:
        - "ИП"
        - "индивидуальный предприниматель"
        - "коммерческая организация"
        - "ООО"
        - "АО"
        - "ПАО"
        - "предпринимательская деятельность"

    managing_partner_designated:
      any_keywords:
        - "ведущий дела"
        - "управляющий товарищ"
        - "ведение общих дел возлагается на"
        - "уполномоченный товарищ"

    joint_management:
      any_keywords:
        - "совместное ведение дел"
        - "все товарищи совместно"
        - "решения принимаются всеми"

    non_monetary_contributions:
      any_keywords:
        - "профессиональные знания"
        - "навыки"
        - "деловая репутация"
        - "деловые связи"
        - "неденежный вклад"
        - "нематериальный вклад"

    common_property_regime:
      any_keywords:
        - "общая долевая собственность"
        - "общее имущество товарищей"
        - "имущество товарищества"
        - "долевая собственность"

    profit_distribution_clause:
      any_keywords:
        - "распределение прибыли"
        - "прибыль распределяется"
        - "доля прибыли"
        - "пропорционально вкладам"

    withdrawal_rights:
      any_keywords:
        - "выход из товарищества"
        - "отказ от договора"
        - "выдел доли"
        - "право на выход"

    deadlock_risk:
      any_keywords:
        - "deadlock"
        - "тупиковая ситуация"
        - "невозможность принять решение"
        - "равенство голосов"

    death_bankruptcy_consequences:
      any_keywords:
        - "смерть товарища"
        - "банкротство"
        - "ликвидация участника"
        - "наследники"
        - "правопреемники"

    tacit_partnership:
      any_keywords:
        - "негласное товарищество"
        - "tacit partnership"
        - "не раскрывается третьим лицам"

    tax_coordination_required:
      any_keywords:
        - "налоговый учёт"
        - "бухгалтерский учёт"
        - "согласование учёта"
        - "налоговые обязательства"
        - "отчётность товарищества"

    construction_partnership:
      any_keywords:
        - "строительство"
        - "застройщик"
        - "генеральный подрядчик"
        - "совместное строительство"
        - "объект строительства"
        - "земельный участок"
        - "разрешение на строительство"

    foreign_partner:
      any_keywords:
        - "иностранный участник"
        - "иностранная компания"
        - "нерезидент"
        - "иностранный гражданин"
        - "применимое право"
        - "валютное регулирование"

    ip_contribution:
      any_keywords:
        - "интеллектуальная собственность"
        - "патент"
        - "товарный знак"
        - "лицензия"
        - "ноу-хау"
        - "программное обеспечение"
        - "исключительное право"

    real_estate_contribution:
      any_keywords:
        - "недвижимое имущество"
        - "земельный участок"
        - "здание"
        - "помещение"
        - "кадастровый номер"
        - "ЕГРН"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 3: SHARED PATTERNS
#  Читается: DocTypeCheckLoader через _resolve_yaml_templates()
# ════════════════════════════════════════════════════════════════════════════

shared_patterns:

  money_amount: "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|тыс|млн)"
  date_pattern: "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"
  percent_pattern: "(?i)\\b\\d+[.,]?\\d*\\s*%"
  inn_pattern: "(?i)\\bИНН\\s*\\d{10,12}\\b"
  ogrn_pattern: "(?i)\\bОГРН\\s*\\d{13,15}\\b"
  passport_data: "(?i)паспорт\\s+серия\\s+\\d{4}\\s+№?\\s*\\d{6}"
  article_gk_ref: "(?i)ст\\.?\\s*\\d+\\s*ГК\\s*РФ"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: COMPLIANCE RULES
#  Читается: DocTypeCheckLoader._exclusion_logic_to_checks()
# ════════════════════════════════════════════════════════════════════════════

compliance_rules:

  - id: "minimum_two_partners_required"
    name: "Минимум два товарища (ст. 1041 ГК РФ)"
    description: |
      Договор простого товарищества требует участия минимум двух лиц.
    legal_base: "ст. 1041 ГК РФ"
    required_triggers: []
    severity: "critical"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      keywords:
        - "товарищ 1"
        - "товарищ 2"
        - "участник 1"
        - "участник 2"
        - "стороны"
      keyword_mode: "any"
    retrieval:
      context_k: 3
      boost_keywords:
        - "товарищ"
        - "участник"
      rerank: true

  - id: "common_goal_mandatory"
    name: "Общая цель обязательна (ст. 1041 ГК РФ)"
    description: |
      Без указания общей цели совместной деятельности договор может быть
      признан незаключённым.
    legal_base: "ст. 1041 ГК РФ"
    required_triggers: []
    severity: "critical"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      keywords:
        - "общая цель"
        - "цель совместной деятельности"
        - "для достижения"
        - "извлечение прибыли"
      keyword_mode: "any"
    retrieval:
      context_k: 4
      boost_keywords:
        - "цель"
        - "совместная деятельность"
      rerank: true

  - id: "contributions_mandatory"
    name: "Соединение вкладов обязательно (ст. 1042 ГК РФ)"
    description: |
      Товарищи обязаны соединить свои вклады. Без вкладов нет товарищества.
    legal_base: "ст. 1042 ГК РФ"
    required_triggers: []
    severity: "critical"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      keywords:
        - "вклад"
        - "соединение вкладов"
        - "вносит вклад"
        - "размер вклада"
      keyword_mode: "any"
    retrieval:
      context_k: 4
      boost_keywords:
        - "вклад"
        - "соединение"
      rerank: true

  - id: "joint_and_several_liability_warning"
    name: "Солидарная ответственность при предпринимателе (ст. 1047 ГК РФ)"
    description: |
      При наличии ИП или коммерческой организации и предпринимательском характере
      деятельности ВСЕ товарищи несут СОЛИДАРНУЮ ОТВЕТСТВЕННОСТЬ ВСЕМ ИМУЩЕСТВОМ.
    legal_base: "ст. 1047 ГК РФ"
    required_triggers: ["entrepreneur_present"]
    severity: "critical"
    result_if_triggered: "warn"
    detector_type: "rules"
    rules:
      keywords:
        - "солидарная ответственность"
        - "ИП"
        - "коммерческая организация"
        - "предпринимательская деятельность"
      keyword_mode: "any"
    retrieval:
      context_k: 4
      boost_keywords:
        - "солидарная ответственность"
        - "ИП"
      rerank: true

  - id: "prohibition_of_profit_exclusion"
    name: "Запрет исключения товарища из участия в прибыли (ст. 1048 ГК РФ)"
    description: |
      Соглашение об устранении кого-либо из товарищей от участия в прибыли НИЧТОЖНО.
      Каждый товарищ имеет право на долю прибыли.
    legal_base: "ст. 1048 ГК РФ"
    required_triggers: []
    severity: "critical"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      keywords:
        - "не участвует в прибыли"
        - "исключается из распределения прибыли"
        - "лишается права на прибыль"
        - "прибыль не распределяется на"
        - "отказ от прибыли"
      keyword_mode: "any"
    retrieval:
      context_k: 4
      boost_keywords:
        - "исключение из прибыли"
        - "ст. 1048 ГК РФ"
      rerank: true

  - id: "prohibition_of_loss_exemption"
    name: "Запрет освобождения товарища от покрытия убытков (ст. 1046 ГК РФ)"
    description: |
      Соглашение, полностью освобождающее кого-либо из товарищей от участия
      в покрытии общих расходов или убытков, НИЧТОЖНО.
    legal_base: "ст. 1046 ГК РФ"
    required_triggers: []
    severity: "critical"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      keywords:
        - "освобождается от убытков"
        - "не участвует в покрытии убытков"
        - "не несёт расходов"
        - "не несет расходов"
        - "освобождается от расходов"
      keyword_mode: "any"
    retrieval:
      context_k: 4
      boost_keywords:
        - "освобождение от убытков"
        - "ст. 1046 ГК РФ"
      rerank: true

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 5: CHECKS_V8 — LLM/hybrid проверки
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  - id: common_goal_extraction
    name: "Общая цель совместной деятельности"
    description: |
      Извлекает общую цель: извлечение прибыли, некоммерческая цель, конкретное описание.
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "общая цель"
        - "цель совместной деятельности"
        - "извлечение прибыли"
        - "коммерческая деятельность"
        - "некоммерческая цель"
      keyword_mode: "any"
      regex_patterns: []
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор простого товарищества.
        Определи общую цель совместной деятельности.

        Ответь строго в JSON:
        {
          "common_goal": "<описание цели или not_found>",
          "goal_type": "<profit / non_profit / unclear>",
          "entrepreneurial_activity": "<yes / no / unclear>"
        }

        ВАЖНО: Без общей цели договор незаключён (ст. 1041 ГК РФ).
        Если значение явно не указано — пиши "not_found".
      prompt_file: null
      context_k: 6
      temperature: 0.0
      max_tokens: 400
    retrieval:
      context_k: 6
      max_chunks: 8
      boost_keywords:
        - "цель"
        - "совместная деятельность"
        - "прибыль"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "common_goal"
          type: "string"
          keyword_hints: ["цель", "совместная деятельность", "для"]
          description: "Общая цель"
        - name: "goal_type"
          type: "string"
          allowed_values: ["profit", "non_profit", "unclear"]
          description: "Тип цели"
        - name: "entrepreneurial_activity"
          type: "string"
          allowed_values: ["yes", "no", "unclear"]
          description: "Предпринимательская деятельность"
      store_payload: true

  - id: contributions_extraction
    name: "Состав и размер вкладов товарищей"
    description: |
      Извлекает вклады каждого товарища: денежные, имущественные, неимущественные.
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "вклад товарища"
        - "соединение вкладов"
        - "размер вклада"
        - "денежный вклад"
        - "имущественный вклад"
        - "профессиональные знания"
        - "деловая репутация"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽)"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор простого товарищества.
        Определи вклады каждого товарища.

        Ответь строго в JSON:
        {
          "contributions": [
            {
              "partner": "<имя товарища>",
              "type": "<money / property / non_monetary / mixed>",
              "description": "<описание вклада>",
              "value": "<денежная оценка или not_found>"
            }
          ],
          "non_monetary_contributions_present": "<yes / no>",
          "total_contributions_valued": "<yes / no / unclear>"
        }

        ВАЖНО: Без вкладов нет товарищества (ст. 1042 ГК РФ).
        Если значение явно не указано — пиши "not_found".
      prompt_file: null
      context_k: 8
      temperature: 0.0
      max_tokens: 700
    retrieval:
      context_k: 8
      max_chunks: 12
      boost_keywords:
        - "вклад"
        - "соединение"
        - "размер"
        - "оценка"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 50
      max_snippet_length: 700
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "non_monetary_contributions_present"
          type: "string"
          allowed_values: ["yes", "no"]
          keyword_hints: ["знания", "репутация", "связи", "навыки"]
          description: "Наличие неденежных вкладов"
        - name: "total_contributions_valued"
          type: "string"
          allowed_values: ["yes", "no", "unclear"]
          keyword_hints: ["оценка", "стоимость", "денежная оценка"]
          description: "Все вклады оценены в денежном выражении"
      store_payload: true

  - id: contribution_valuation
    name: "Денежная оценка вкладов (особенно неденежных)"
    description: |
      Проверяет наличие денежной оценки всех вкладов.
      Без оценки — споры о долях (ст. 1042 ГК РФ).
    triggers:
      any: ["non_monetary_contributions"]
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "денежная оценка"
        - "оценка вклада"
        - "стоимость вклада"
        - "вклад оценивается"
        - "независимая оценка"
      keyword_mode: "any"
      regex_patterns: []
    llm:
      prompt_template: |
