        4. Проверены ли признаки раздела рынка и согласования цен?
        5. Проверено ли соответствие non-compete требованиям?
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "competitors_status": "<defined / not_defined>",
          "competitors_details": "<текст или 'Данные не определены'>",
          "market_division_signs_code": "<detected / not_detected>",
          "market_division_details": "<текст или 'Данные не определены'>",
          "price_coordination_signs_code": "<detected / not_detected>",
          "price_coordination_details": "<текст или 'Данные не определены'>",
          "non_compete_compliance_status": "<defined / not_defined>",
          "non_compete_compliance_details": "<текст или 'Данные не определены'>",
          "antitrust_risk_summary": "<сводная оценка или 'Данные не определены'>",
