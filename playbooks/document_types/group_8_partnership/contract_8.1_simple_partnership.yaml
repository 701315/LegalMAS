      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1400

      compact_output: false

      presence_signal:
        field: "creditor_seizure_of_share_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора простого товарищества
        сведения о защите от выдела доли кредитором товарища: преимущественное
        право выкупа, порядок оценки, субсидиарная ответственность оставшихся
        товарищей, договорные запреты.
        Не анализируй вклады как таковые, распределение прибыли или
        прекращение товарищества.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. creditor_seizure_of_share_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (seizure_protection_status, buyout_right_status,
              buyout_valuation_method_status, subsidiary_liability_status)
             ≠ "not_defined", либо non_seizure_clause = "detected";
           - "missing" — если все четыре *_status = "not_defined"
             и non_seizure_clause = "not_detected";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - seizure_protection_status = "not_defined";
           - buyout_right_status = "not_defined";
           - buyout_valuation_method_status = "not_defined";
           - subsidiary_liability_status = "not_defined";
           - non_seizure_clause = "not_detected";
           - все *_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. seizure_protection_status:
           - "defined" — если прямо указаны договорные механизмы защиты
             от выдела доли кредитором (преимущественное право товарищей,
             порядок выкупа, уведомления) или прямо установлен запрет
             выдела;
           - "not_defined" — иначе.

        2. seizure_protection_details:
           Краткое user-facing описание механизмов защиты.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        3. buyout_right_status:
           - "defined" — если прямо указано преимущественное право
             выкупа доли остальными товарищами;
           - "not_defined" — иначе.

        4. buyout_right_details:
           Краткое user-facing описание условий преимущественного
           права выкупа.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        5. buyout_valuation_method_status:
           - "defined" — если прямо указан способ оценки доли при выкупе
             (независимый оценщик / балансовая стоимость / соглашение
             сторон);
           - "not_defined" — иначе.

        6. buyout_valuation_method_details:
           Краткое user-facing описание способа оценки.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        7. subsidiary_liability_status:
           - "defined" — если прямо указана субсидиарная ответственность
             оставшихся товарищей по личному долгу должника (п. 2
             ст. 1049 ГК РФ);
           - "not_defined" — иначе.

        8. subsidiary_liability_details:
           Краткое user-facing описание субсидиарной ответственности
           и её пределов (в пределах вкладов).
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        9. non_seizure_clause:
           Используй только одно из значений:
           - "detected" — если в договоре прямо установлен запрет
             на выдел доли кредитором (оспоримо — императивная норма);
           - "not_detected" — если такого условия в тексте нет.
        </task>

        <context_rules>
        - Перед остальными полями заполни creditor_seizure_of_share_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не делай выводов по типовой структуре договора.
        - Не извлекай сведения о вкладах как таковых, распределении прибыли, ведении дел, налоговом учёте и иных нерелевантных темах.
        - non_seizure_clause = "detected" только при прямом указании запрета на выдел доли кредитором.
        - buyout_valuation_method_details: способ оценки доли при выкупе (независимый оценщик / балансовая стоимость / соглашение сторон).
        - subsidiary_liability_details: субсидиарная ответственность оставшихся товарищей и её пределы.
        - Если в разных фрагментах указаны противоречивые сведения — статус → "not_defined", текстовое поле → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни защиты от выдела, ни преимущественного права
           выкупа, ни порядка оценки, ни субсидиарной ответственности,
           ни запрета выдела.
           → presence = "missing";
             все *_status = "not_defined";
             non_seizure_clause = "not_detected";
             все *_details = "Данные не определены".

        2. Неполное раскрытие или прямое исключение.
           а) Общая фраза: «Стороны защищают интересы товарищества
              от требований кредиторов» без конкретных механизмов.
              → presence = "present";
                seizure_protection_status = "not_defined";
                buyout_right_status = "not_defined".
           б) Прямо указано, что преимущественное право выкупа
              не применяется.
              → presence = "present";
                buyout_right_status = "not_defined";
                seizure_protection_details содержит дословную формулировку.

        3. Противоречие между фрагментами.
           В разных частях договора указаны противоречивые условия
           о защите от выдела или о способе оценки.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             соответствующий *_details = "Не удалось определить".

        4. Специфика темы — договорный запрет выдела.
           В договоре прямо установлен запрет выдела доли кредитором.
           → presence = "present";
             seizure_protection_status = "defined";
             non_seizure_clause = "detected";
             seizure_protection_details содержит дословную формулировку.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для creditor_seizure_of_share_presence используй только: "present", "missing", "unclear".
        - Для enum-полей *_status используй только: "defined", "not_defined".
        - Для non_seizure_clause используй только: "detected", "not_detected".
        - Fallback при отсутствии данных:
          * все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
