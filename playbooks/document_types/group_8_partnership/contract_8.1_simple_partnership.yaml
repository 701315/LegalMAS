  - id: antitrust_compliance
    name: "Антимонопольный комплаенс (ст. 11 ФЗ №135)"
    description: >
      Фактографическая проверка признаков нарушения антимонопольного
      законодательства при создании простого товарищества между
      конкурентами: раздел рынка, координация цен, соответствие
      ограничений non-compete требованиям ст. 11 ФЗ №135
      «О защите конкуренции» и Постановления Пленума ВС РФ №2 от 04.03.2021.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 200

    rules:
      keywords:
        - "антимонопольное законодательство"
        - "защита конкуренции"
        - "картельное соглашение"
        - "координация экономической деятельности"
        - "раздел рынка"
        - "раздел клиентов"
        - "раздел территории"
        - "согласование цен"
        - "единая ценовая политика"
        - "ограничение конкуренции"
        - "конкуренты"
        - "хозяйствующие субъекты"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)антимонопольн[а-яё]+"
        - "(?i)защит[а-яё]*\\s+конкуренц"
        - "(?i)(картельн|координац)[а-яё]+"
        - "(?i)раздел[а-яё]*\\s+(рынк|клиент|территор)"
        - "(?i)(согласовани|единая)\\s+цен"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор простого товарищества.
        Проверяется только один вопрос: соответствие договора
        антимонопольному законодательству.
        Нормативные ориентиры:
        - ст. 11 ФЗ №135 «О защите конкуренции» — запрет картельных
          соглашений и координации экономической деятельности, приводящих
          к разделу рынка, согласованию цен, ограничению конкуренции.
        - ст. 14.32 КоАП РФ — административная ответственность
          (до 15 % выручки).
        - Постановление Пленума ВС РФ №2 от 04.03.2021 — критерии
          квалификации.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - ПТ между конкурентами сам по себе не запрещено; запрещены
          конкретные ограничительные условия (раздел рынка,
          согласование цен).
        - Если товарищи не конкуренты, признаки ст. 11 не применяются.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Являются ли товарищи конкурентами / хозяйствующими субъектами
           на одном товарном рынке.
        2. Признаки раздела рынка (территория, клиенты, ассортимент).
        3. Признаки согласования / координации цен.
        4. Условия non-compete и их соответствие требованиям
           ст. 11 ФЗ №135 (срок, территория, вид деятельности).

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Для enum-полей (competitors_status, *_signs_code,
           non_compete_compliance_status) при отсутствии данных возвращай
           "not_defined" (для *_signs_code — "not_detected").
        4. Для строковых *_details при отсутствии данных возвращай строго
           "Данные не определены".
        5. Не используй "None", "null", пустые строки или отсутствующие ключи.
        6. В evidence включай только прямые цитаты из текста договора.
        7. market_division_signs_code = "detected" ТОЛЬКО при прямом
           указании на раздел рынка (территории, клиентов, ассортимента).
        8. price_coordination_signs_code = "detected" ТОЛЬКО при прямом
           указании на согласование цен / единую ценовую политику.
        9. Верни РОВНО один валидный JSON-объект со всеми 10 ключами
           (9 полей + evidence), пригодный для парсинга через json.loads
           без предварительной обработки. Без markdown, без ```json,
           без комментариев, без текста до или после. Начни ответ сразу
           с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — признаки раздела рынка между конкурентами:
        Фрагмент:
        "Товарищи — конкуренты на рынке логистических услуг. Товарищ 1
        осуществляет деятельность только на территории Московской области,
        Товарищ 2 — только на территории Ленинградской области. Товарищи
        применяют единую ценовую политику."
        Ответ:
        {
          "competitors_status": "defined",
          "competitors_details": "Товарищ 1 и Товарищ 2 — конкуренты на рынке логистических услуг",
          "market_division_signs_code": "detected",
          "market_division_details": "Товарищ 1 — Московская область, Товарищ 2 — Ленинградская область",
          "price_coordination_signs_code": "detected",
          "price_coordination_details": "применение единой ценовой политики",
          "non_compete_compliance_status": "not_defined",
          "non_compete_compliance_details": "Данные не определены",
          "antitrust_risk_summary": "признаки раздела рынка (территория) и согласования цен — риск квалификации по ст. 11 ФЗ №135",
          "evidence": [
            {"clause_ref": "п. 1.1", "quote": "Товарищи — конкуренты на рынке логистических услуг."},
            {"clause_ref": "п. 3.1", "quote": "Товарищ 1 осуществляет деятельность только на территории Московской области, Товарищ 2 — только на территории Ленинградской области."},
            {"clause_ref": "п. 3.2", "quote": "Товарищи применяют единую ценовую политику."}
          ]
        }

        Пример 2 — товарищи не конкуренты:
        Фрагмент:
        "Товарищи осуществляют деятельность на разных товарных рынках
        и не являются конкурентами."
        Ответ:
        {
          "competitors_status": "defined",
          "competitors_details": "товарищи действуют на разных товарных рынках, не конкуренты",
          "market_division_signs_code": "not_detected",
          "market_division_details": "Данные не определены",
          "price_coordination_signs_code": "not_detected",
          "price_coordination_details": "Данные не определены",
          "non_compete_compliance_status": "not_defined",
          "non_compete_compliance_details": "Данные не определены",
          "antitrust_risk_summary": "признаки нарушения ст. 11 ФЗ №135 не обнаружены",
          "evidence": [
            {"clause_ref": "п. 1.2", "quote": "Товарищи осуществляют деятельность на разных товарных рынках и не являются конкурентами."}
          ]
        }

        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Стороны обязуются исполнять договор."
        Ответ:
        {
          "competitors_status": "not_defined",
          "competitors_details": "Данные не определены",
          "market_division_signs_code": "not_detected",
          "market_division_details": "Данные не определены",
          "price_coordination_signs_code": "not_detected",
          "price_coordination_details": "Данные не определены",
          "non_compete_compliance_status": "not_defined",
          "non_compete_compliance_details": "Данные не определены",
          "antitrust_risk_summary": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Все 10 ключей (9 полей + evidence) присутствуют в JSON?
        2. market_division_signs_code / price_coordination_signs_code —
           строго "detected" / "not_detected"?
