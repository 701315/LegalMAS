shared_patterns:
  money_amount: "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|тыс|млн)"
  date_pattern: "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"
  percent_pattern: "(?i)\\b\\d+[.,]?\\d*\\s*%"
  inn_pattern: "(?i)\\bИНН\\s*\\d{10,12}\\b"
  ogrn_pattern: "(?i)\\bОГРН\\s*\\d{13,15}\\b"
  passport_data: "(?i)паспорт\\s+серия\\s+\\d{4}\\s+№?\\s*\\d{6}"
  article_gk_ref: "(?i)ст\\.?\\s*\\d+\\s*ГК\\s*РФ"

compliance_rules: []

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: CHECKS_V8 — единственный рабочий слой юридического анализа
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 1: Стороны, общая цель, тип деятельности, срок
  # ──────────────────────────────────────────────────────────────────────────
  - id: partnership_subject_extraction
    name: "Стороны, общая цель, тип деятельности и срок договора"
    description: >
      Фактографическая проверка идентификации всех товарищей, общей цели
      совместной деятельности, типа деятельности (предпринимательская /
      некоммерческая) и срока действия договора.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "товарищ"
        - "участник"
        - "стороны"
        - "общая цель"
        - "цель совместной деятельности"
        - "извлечение прибыли"
        - "коммерческая деятельность"
        - "некоммерческая цель"
        - "срок действия"
        - "бессрочный"
        - "без образования юридического лица"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(товарищ|участник)\\s*\\d"
        - "(?i)общ[а-яё]+\\s+цел[ььи]"
        - "(?i)без\\s+образован[ияи]\\s+юридическ"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор простого товарищества (Глава 55 ГК РФ, ст. 1041).
        Проверяется только один вопрос: стороны, общая цель, тип деятельности
        и срок договора.
        Нормативный ориентир:
        - ст. 1041 ГК РФ — понятие договора простого товарищества
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Без общей цели договор незаключён (ст. 1041 ГК РФ).
        [ЗАДАЧА]
        Найди в тексте договора:
        1. Количество товарищей и их идентификация (наименования/ФИО).
        2. Общую цель совместной деятельности.
        3. Тип цели: извлечение прибыли или некоммерческая.
        4. Является ли деятельность предпринимательской.
        5. Есть ли прямое указание «без образования юридического лица».
        6. Срок действия договора (срочный / бессрочный).
        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если данные не указаны прямо — возвращай "not_defined".
        4. Если текстового значения нет — возвращай строго "Данные не определены".
        5. Не используй "None", "null", "not_defined", "not_defined" или пустые строки.
        6. В evidence включай только текст договора.
        7. Верни только один JSON-объект.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — предмет определён:
        Фрагмент:
        "Товарищ 1 — ООО «Строй-Инвест» (ИНН 7700000001), Товарищ 2 — Иванов И.И.
        Стороны обязуются соединить вклады и совместно действовать без образования
        юридического лица для извлечения прибыли от строительства жилого комплекса.
        Договор действует до полного завершения строительства."
        Ответ:
        {
          "partners_count_status": "defined",
          "partners_count_details": "2 товарища",
          "partners_identification_status": "defined",
          "partners_identification_details": "ООО «Строй-Инвест» (ИНН 7700000001); Иванов И.И.",
          "common_goal_status": "defined",
          "common_goal_details": "извлечение прибыли от строительства жилого комплекса",
          "goal_type": "profit",
          "entrepreneurial_activity": "yes",
          "no_legal_entity_status": "defined",
          "contract_term_status": "defined",
          "contract_term_details": "до полного завершения строительства",
          "evidence": [
            {
              "clause_ref": "преамбула",
              "quote": "Товарищ 1 — ООО «Строй-Инвест» (ИНН 7700000001), Товарищ 2 — Иванов И.И."
            }
          ]
        }
        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Стороны заключили настоящий договор."
        Ответ:
        {
          "partners_count_status": "not_defined",
          "partners_count_details": "Данные не определены",
          "partners_identification_status": "not_defined",
          "partners_identification_details": "Данные не определены",
          "common_goal_status": "not_defined",
          "common_goal_details": "Данные не определены",
          "goal_type": "not_defined",
          "entrepreneurial_activity": "not_defined",
          "no_legal_entity_status": "not_defined",
          "contract_term_status": "not_defined",
          "contract_term_details": "Данные не определены",
          "evidence": []
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату с идентификацией товарищей.
        2. Найди прямую цитату с общей целью.
        3. Определи тип цели по тексту.
        4. Найди прямую цитату «без образования юридического лица».
        5. Найди прямую цитату о сроке.
        6. Если прямой цитаты нет — верни "not_defined". Не додумывай.
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "partners_count_status": "<defined / not_defined>",
          "partners_count_details": "<количество или 'Данные не определены'>",
          "partners_identification_status": "<defined / not_defined>",
          "partners_identification_details": "<идентификация или 'Данные не определены'>",
          "common_goal_status": "<defined / not_defined>",
          "common_goal_details": "<описание или 'Данные не определены'>",
          "goal_type": "<profit / non_profit / not_defined>",
          "entrepreneurial_activity": "<yes / no / not_defined>",
          "no_legal_entity_status": "<defined / not_defined>",
          "contract_term_status": "<defined / not_defined>",
          "contract_term_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 650

    retrieval:
      retrieval_profile: "definitions_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "товарищ участник стороны общая цель цель совместной деятельности извлечение прибыли коммерческая деятельность некоммерческая цель без образования юридического лица срок действия бессрочный предпринимательская деятельность"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - definitions
        - obligations
      negative_keywords:
        - "вклад"
        - "распределение прибыли"
        - "ведение дел"
        - "доверенность"
        - "выход из товарищества"
        - "прекращение"
        - "неустойка"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 0.25]
        boost: 0.25
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "definitions"
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 1200

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора простого товарищества сведения
        о сторонах, общей цели, типе деятельности и сроке договора.
        Не анализируй вклады, распределение прибыли, ведение дел или прекращение.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:
        1. partners_count_status — "defined" или "not_defined".
        2. partners_count_details — количество товарищей.
        3. partners_identification_status — "defined" или "not_defined".
        4. partners_identification_details — идентификация всех товарищей.
        5. common_goal_status — "defined" или "not_defined".
        6. common_goal_details — описание общей цели.
        7. goal_type — "profit" / "non_profit" / "not_defined".
        8. entrepreneurial_activity — "yes" / "no" / "not_defined".
        9. no_legal_entity_status — "defined" или "not_defined".
        10. contract_term_status — "defined" или "not_defined".
        11. contract_term_details — срок действия.

        Если данные отсутствуют:
        - статус = "not_defined"
        - текст = "Данные не определены"
        </task>

        <rules>
        - Используй только текст договора.
        - goal_type: "profit" если прямо указано извлечение прибыли;
          "non_profit" если прямо указана некоммерческая цель.
        - entrepreneurial_activity: "yes" только если прямо указано
          предпринимательская деятельность или участие ИП/коммерческой организации.
        - Верни только JSON.
        </rules>
      fields:
        - name: "partners_count_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения количества товарищей."
          required: true
        - name: "partners_count_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Количество товарищей"
          description: "Количество товарищей в договоре."
          required: true
        - name: "partners_identification_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус идентификации товарищей."
          required: true
        - name: "partners_identification_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Товарищи"
          description: "Идентификация всех товарищей."
          required: true
        - name: "common_goal_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения общей цели."
          required: true
        - name: "common_goal_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Общая цель"
          description: "Описание общей цели совместной деятельности."
          required: true
        - name: "goal_type"
          type: "string"
          presentation: "signal"
          allowed_values: ["profit", "non_profit", "not_defined"]
          description: "Тип цели деятельности."
          required: false
        - name: "entrepreneurial_activity"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Является ли деятельность предпринимательской."
          required: false
        - name: "no_legal_entity_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания «без образования юридического лица»."
          required: false
        - name: "contract_term_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения срока договора."
          required: false
        - name: "contract_term_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 4
          label: "Срок действия"
          description: "Срок действия договора."
          required: false
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 2: Состав, размер и оценка вкладов
  # ──────────────────────────────────────────────────────────────────────────
  - id: contributions_check
    name: "Состав, размер и денежная оценка вкладов товарищей"
    description: >
      Фактографическая проверка состава вкладов каждого товарища (денежные,
      имущественные, неденежные), их денежной оценки и сроков внесения.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "вклад товарища"
        - "соединение вкладов"
        - "размер вклада"
        - "денежный вклад"
        - "имущественный вклад"
        - "профессиональные знания"
        - "деловая репутация"
        - "денежная оценка"
        - "оценка вклада"
        - "независимая оценка"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽)"
        - "(?i)(оценк|стоимост)\\s+вклад"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор простого товарищества (ст. 1042 ГК РФ).
        Проверяется только один вопрос: вклады товарищей и их оценка.
        Нормативный ориентир:
        - ст. 1042 ГК РФ — вклады товарищей
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Без вкладов нет товарищества (ст. 1042 ГК РФ).
        - Без денежной оценки неденежных вкладов — споры о долях.
        [ЗАДАЧА]
        Найди в тексте договора:
        1. Состав вклада каждого товарища (деньги, имущество, знания, репутация).
        2. Денежную оценку каждого вклада.
        3. Способ оценки (согласование сторон / независимый оценщик).
        4. Сроки внесения вкладов.
        5. Наличие неденежных вкладов.
        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если данные не указаны прямо — "not_defined" / "Данные не определены".
        3. В evidence — только текст договора.
        4. Верни только один JSON-объект.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1:
        Фрагмент:
        "Товарищ 1 вносит денежный вклад в размере 5 000 000 рублей.
        Товарищ 2 вносит профессиональные знания и деловые связи,
        оцениваемые сторонами в 2 000 000 рублей. Вклады вносятся
        в течение 30 дней с даты подписания."
        Ответ:
        {
          "contributions_status": "defined",
          "contributions_details": "Товарищ 1: 5 000 000 рублей; Товарищ 2: знания и связи — 2 000 000 рублей",
          "valuation_status": "defined",
          "valuation_method": "согласование сторон",
          "non_monetary_present": "yes",
          "contribution_deadline_status": "defined",
          "contribution_deadline_details": "в течение 30 дней с даты подписания",
          "evidence": [
            {
              "clause_ref": "п. 2.1",
              "quote": "Товарищ 1 вносит денежный вклад в размере 5 000 000 рублей."
            }
          ]
        }
        Пример 2:
        Фрагмент:
        "Стороны обязуются соединить вклады."
        Ответ:
        {
          "contributions_status": "not_defined",
          "contributions_details": "Данные не определены",
          "valuation_status": "not_defined",
          "valuation_method": "not_defined",
          "non_monetary_present": "not_defined",
          "contribution_deadline_status": "not_defined",
          "contribution_deadline_details": "Данные не определены",
          "evidence": []
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о составе вклада каждого товарища.
        2. Найди прямую цитату о денежной оценке.
        3. Найди прямую цитату о сроках внесения.
        4. Если прямой цитаты нет — верни "not_defined".
        Не выводи шаги. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "contributions_status": "<defined / not_defined>",
          "contributions_details": "<состав вкладов или 'Данные не определены'>",
          "valuation_status": "<defined / partial / not_defined>",
          "valuation_method": "<текст или 'Данные не определены'>",
          "non_monetary_present": "<yes / no / not_defined>",
          "contribution_deadline_status": "<defined / not_defined>",
          "contribution_deadline_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 650

    retrieval:
      retrieval_profile: "payment_terms_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "вклад товарища соединение вкладов размер вклада денежный вклад имущественный вклад профессиональные знания деловая репутация денежная оценка оценка вклада независимая оценка сроки внесения вкладов неденежный вклад"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - definitions
        - obligations
      negative_keywords:
        - "распределение прибыли"
        - "ведение дел"
        - "доверенность"
        - "выход из товарищества"
        - "прекращение"
        - "неустойка"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.05, 0.45]
        boost: 0.18
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "definitions"
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 1000

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора простого товарищества сведения
        о вкладах товарищей: состав, оценка, способ оценки, сроки, неденежные вклады.
        Не анализируй распределение прибыли, ведение дел или прекращение.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:
        1. contributions_status — "defined" или "not_defined".
        2. contributions_details — состав вкладов каждого товарища.
        3. valuation_status — "defined" / "partial" / "not_defined".
        4. valuation_method — способ оценки.
        5. non_monetary_present — "yes" / "no" / "not_defined".
        6. contribution_deadline_status — "defined" или "not_defined".
        7. contribution_deadline_details — сроки внесения вкладов.

        Если данные отсутствуют:
        - статус = "not_defined"
        - текст = "Данные не определены"
        </task>

        <rules>
        - Используй только текст договора.
        - valuation_method: "согласование сторон" если оценка установлена сторонами;
          "независимый оценщик" если указан независимый оценщик.
        - Верни только JSON.
        </rules>
      fields:
        - name: "contributions_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения вкладов."
