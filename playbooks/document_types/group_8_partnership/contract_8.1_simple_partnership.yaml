          "unanimous_consent_status": "defined",
          "unanimous_consent_details": "единогласное решение",
          "non_compete_status": "defined",
          "non_compete_details": "запрещается конкурирующая деятельность",
          "conflict_procedure_status": "defined",
          "conflict_procedure_details": "подлежит раскрытию перед всеми товарищами",
          "evidence": [
            {
              "clause_ref": "п. 7.1",
              "quote": "Принятие новых товарищей допускается по единогласному решению."
            }
          ]
        }
        Пример 2:
        Фрагмент:
        "Стороны обязуются исполнять договор."
        Ответ:
        {
          "admission_allowed_status": "not_defined",
          "admission_allowed_details": "Данные не определены",
          "unanimous_consent_status": "not_defined",
          "unanimous_consent_details": "Данные не определены",
          "non_compete_status": "not_defined",
          "non_compete_details": "Данные не определены",
          "conflict_procedure_status": "not_defined",
          "conflict_procedure_details": "Данные не определены",
          "evidence": []
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о принятии новых товарищей.
        2. Найди прямую цитату о запрете конкуренции.
        3. Найди прямую цитату о конфликте интересов.
        4. Если прямой цитаты нет — верни "not_defined".
        Не выводи шаги. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "admission_allowed_status": "<defined / not_defined>",
          "admission_allowed_details": "<текст или 'Данные не определены'>",
          "unanimous_consent_status": "<defined / not_defined>",
          "unanimous_consent_details": "<текст или 'Данные не определены'>",
          "non_compete_status": "<defined / not_defined>",
          "non_compete_details": "<текст или 'Данные не определены'>",
          "conflict_procedure_status": "<defined / not_defined>",
          "conflict_procedure_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 600

    retrieval:
      retrieval_profile: "consent_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "принятие нового товарища требуется единогласное решение оценка вклада нового участника изменение долей запрет конкуренции non-compete конфликт интересов конкурирующий бизнес лояльность раскрытие конфликта"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
