      - "(?i)валютн[оа]е\\s+регулировани[ея]"

  ip_contribution:
    any_keywords:
      - "(?i)интеллектуальн[а-яё]+\\s+собственност[ьи]"
      - "(?i)\\bпатент\\b"
      - "(?i)товарн[ыо]й\\s+знак"
      - "(?i)\\bлицензи[яяи]\\b"
      - "(?i)\\bноу-?хау\\b"
      - "(?i)программн[оа]е\\s+обеспечени[ея]"
      - "(?i)исключительн[оа]е\\s+прав[оо]"

  real_estate_contribution:
    any_keywords:
      - "(?i)недвижим[оа]е?\\s+имуществ[оо]"
      - "(?i)земельн[ыо]й\\s+участ[оа]к"
      - "(?i)\\bздани[ея]\\b"
      - "(?i)\\bпомещени[ея]\\b"
      - "(?i)кадастров[ыо]й\\s+номер"
      - "(?i)\\bЕГРН\\b"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 3: SHARED PATTERNS
#  Читается: DocTypeCheckLoader через _resolve_yaml_templates()
# ════════════════════════════════════════════════════════════════════════════

shared_patterns:

  money_amount: "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|тыс|млн)"
  date_pattern: "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"
  percent_pattern: "(?i)\\b\\d+[.,]?\\d*\\s*%"
  inn_pattern: "(?i)\\bИНН\\s*\\d{10,12}\\b"
  ogrn_pattern: "(?i)\\bОГРН\\s*\\d{13,15}\\b"
  passport_data: "(?i)паспорт\\s+серия\\s+\\d{4}\\s+№?\\s*\\d{6}"
  article_gk_ref: "(?i)ст\\.?\\s*\\d+\\s*ГК\\s*РФ"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: COMPLIANCE RULES
#  Читается: DocTypeCheckLoader._exclusion_logic_to_checks()
# ════════════════════════════════════════════════════════════════════════════

compliance_rules:

  - id: "minimum_two_partners_required"
    name: "Минимум два товарища (ст. 1041 ГК РФ)"
    description: |
      Договор простого товарищества требует участия минимум двух лиц.
    legal_base: "ст. 1041 ГК РФ"
    required_triggers: []
    severity: "critical"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      keywords:
        - "товарищ 1"
        - "товарищ 2"
        - "участник 1"
        - "участник 2"
        - "стороны"
      keyword_mode: "any"
    retrieval:
      context_k: 3
      boost_keywords:
        - "товарищ"
        - "участник"
      rerank: true

  - id: "common_goal_mandatory"
    name: "Общая цель обязательна (ст. 1041 ГК РФ)"
    description: |
      Без указания общей цели совместной деятельности договор может быть
      признан незаключённым.
    legal_base: "ст. 1041 ГК РФ"
    required_triggers: []
    severity: "critical"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      keywords:
        - "общая цель"
        - "цель совместной деятельности"
        - "для достижения"
        - "извлечение прибыли"
      keyword_mode: "any"
    retrieval:
      context_k: 4
      boost_keywords:
        - "цель"
        - "совместная деятельность"
      rerank: true

  - id: "contributions_mandatory"
    name: "Соединение вкладов обязательно (ст. 1042 ГК РФ)"
    description: |
      Товарищи обязаны соединить свои вклады. Без вкладов нет товарищества.
    legal_base: "ст. 1042 ГК РФ"
    required_triggers: []
    severity: "critical"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      keywords:
        - "вклад"
        - "соединение вкладов"
        - "вносит вклад"
        - "размер вклада"
      keyword_mode: "any"
    retrieval:
      context_k: 4
      boost_keywords:
        - "вклад"
        - "соединение"
      rerank: true

  - id: "joint_and_several_liability_warning"
    name: "Солидарная ответственность при предпринимателе (ст. 1047 ГК РФ)"
    description: |
      При наличии ИП или коммерческой организации и предпринимательском характере
      деятельности ВСЕ товарищи несут СОЛИДАРНУЮ ОТВЕТСТВЕННОСТЬ ВСЕМ ИМУЩЕСТВОМ.
    legal_base: "ст. 1047 ГК РФ"
    required_triggers: ["entrepreneur_present"]
    severity: "critical"
    result_if_triggered: "warn"
    detector_type: "rules"
    rules:
      keywords:
        - "солидарная ответственность"
        - "ИП"
        - "коммерческая организация"
        - "предпринимательская деятельность"
      keyword_mode: "any"
    retrieval:
      context_k: 4
      boost_keywords:
        - "солидарная ответственность"
        - "ИП"
      rerank: true

  - id: "prohibition_of_profit_exclusion"
    name: "Запрет исключения товарища из участия в прибыли (ст. 1048 ГК РФ)"
    description: |
      Соглашение об устранении кого-либо из товарищей от участия в прибыли НИЧТОЖНО.
      Каждый товарищ имеет право на долю прибыли.
    legal_base: "ст. 1048 ГК РФ"
    required_triggers: []
    severity: "critical"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      keywords:
        - "не участвует в прибыли"
        - "исключается из распределения прибыли"
        - "лишается права на прибыль"
        - "прибыль не распределяется на"
        - "отказ от прибыли"
      keyword_mode: "any"
    retrieval:
      context_k: 4
      boost_keywords:
        - "исключение из прибыли"
        - "ст. 1048 ГК РФ"
      rerank: true

  - id: "prohibition_of_loss_exemption"
    name: "Запрет освобождения товарища от покрытия убытков (ст. 1046 ГК РФ)"
    description: |
      Соглашение, полностью освобождающее кого-либо из товарищей от участия
      в покрытии общих расходов или убытков, НИЧТОЖНО.
    legal_base: "ст. 1046 ГК РФ"
    required_triggers: []
    severity: "critical"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      keywords:
        - "освобождается от убытков"
        - "не участвует в покрытии убытков"
        - "не несёт расходов"
        - "не несет расходов"
        - "освобождается от расходов"
      keyword_mode: "any"
    retrieval:
      context_k: 4
      boost_keywords:
        - "освобождение от убытков"
        - "ст. 1046 ГК РФ"
      rerank: true

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 5: CHECKS_V8 — LLM/hybrid проверки
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  - id: common_goal_extraction
    name: "Общая цель совместной деятельности"
    description: |
      Извлекает общую цель: извлечение прибыли, некоммерческая цель, конкретное описание.
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "общая цель"
        - "цель совместной деятельности"
        - "извлечение прибыли"
        - "коммерческая деятельность"
        - "некоммерческая цель"
      keyword_mode: "any"
      regex_patterns: []
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор простого товарищества.
        Определи общую цель совместной деятельности.

        Ответь строго в JSON:
        {
          "common_goal": "<описание цели или not_found>",
          "goal_type": "<profit / non_profit / unclear>",
          "entrepreneurial_activity": "<yes / no / unclear>"
        }

        ВАЖНО: Без общей цели договор незаключён (ст. 1041 ГК РФ).
        Если значение явно не указано — пиши "not_found".
      prompt_file: null
      context_k: 6
      temperature: 0.0
      max_tokens: 400
    retrieval:
      retrieval_profile: "definitions_check"
      context_k: 6
      max_chunks: 8
      boost_keywords:
        - "цель"
        - "совместная деятельность"
        - "прибыль"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "common_goal"
          type: "string"
          keyword_hints: ["цель", "совместная деятельность", "для"]
          description: "Общая цель"
        - name: "goal_type"
          type: "string"
          allowed_values: ["profit", "non_profit", "unclear"]
          description: "Тип цели"
        - name: "entrepreneurial_activity"
          type: "string"
          allowed_values: ["yes", "no", "unclear"]
          description: "Предпринимательская деятельность"
      store_payload: true

  - id: contributions_extraction
    name: "Состав и размер вкладов товарищей"
    description: |
      Извлекает вклады каждого товарища: денежные, имущественные, неимущественные.
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "вклад товарища"
        - "соединение вкладов"
        - "размер вклада"
        - "денежный вклад"
        - "имущественный вклад"
        - "профессиональные знания"
        - "деловая репутация"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽)"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор простого товарищества.
        Определи вклады каждого товарища.

        Ответь строго в JSON:
        {
          "contributions": [
            {
              "partner": "<имя товарища>",
              "type": "<money / property / non_monetary / mixed>",
              "description": "<описание вклада>",
              "value": "<денежная оценка или not_found>"
            }
          ],
          "non_monetary_contributions_present": "<yes / no>",
          "total_contributions_valued": "<yes / no / unclear>"
        }

        ВАЖНО: Без вкладов нет товарищества (ст. 1042 ГК РФ).
        Если значение явно не указано — пиши "not_found".
      prompt_file: null
      context_k: 8
      temperature: 0.0
      max_tokens: 700
    retrieval:
      retrieval_profile: "payment_terms_check"
      context_k: 8
      max_chunks: 12
      boost_keywords:
        - "вклад"
        - "соединение"
        - "размер"
        - "оценка"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 50
      max_snippet_length: 700
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "non_monetary_contributions_present"
          type: "string"
          allowed_values: ["yes", "no"]
          keyword_hints: ["знания", "репутация", "связи", "навыки"]
          description: "Наличие неденежных вкладов"
        - name: "total_contributions_valued"
          type: "string"
          allowed_values: ["yes", "no", "unclear"]
          keyword_hints: ["оценка", "стоимость", "денежная оценка"]
          description: "Все вклады оценены в денежном выражении"
      store_payload: true

  - id: contribution_valuation
    name: "Денежная оценка вкладов (особенно неденежных)"
    description: |
      Проверяет наличие денежной оценки всех вкладов.
      Без оценки — споры о долях (ст. 1042 ГК РФ).
    triggers:
      any: ["non_monetary_contributions"]
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "денежная оценка"
        - "оценка вклада"
        - "стоимость вклада"
        - "вклад оценивается"
        - "независимая оценка"
      keyword_mode: "any"
      regex_patterns: []
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор простого товарищества.
        Проверь наличие денежной оценки вкладов (особенно неденежных).

        Ответь строго в JSON:
        {
          "valuation_present": "<yes / partial / no>",
          "valuation_method": "<согласование сторон / независимый оценщик / иное / not_found>",
          "non_monetary_valued": "<yes / no / unclear>"
        }

        ВАЖНО: Без оценки неденежных вкладов — споры о долях (ст. 1042 ГК РФ).
        Если значение явно не указано — пиши "not_found".
      prompt_file: null
      context_k: 6
      temperature: 0.0
      max_tokens: 400
    retrieval:
      retrieval_profile: "payment_terms_check"
      context_k: 6
      max_chunks: 8
      boost_keywords:
        - "оценка"
        - "стоимость"
        - "денежная"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "valuation_present"
          type: "string"
          allowed_values: ["yes", "partial", "no"]
          keyword_hints: ["оценка", "стоимость", "оценивается"]
          description: "Наличие денежной оценки"
      store_payload: true

  - id: management_structure
    name: "Порядок ведения общих дел товарищества"
    description: |
      Кто ведёт дела: совместно / один товарищ / несколько.
      Пределы полномочий, доверенности.
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "ведение общих дел"
        - "ведущий дела"
        - "управляющий товарищ"
        - "полномочия"
        - "доверенность"
        - "совместное ведение"
      keyword_mode: "any"
      regex_patterns: []
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор простого товарищества.
        Определи порядок ведения общих дел.

        Ответь строго в JSON:
        {
          "management_type": "<joint / single_partner / multiple_partners / unclear>",
          "managing_partner": "<имя товарища или not_found>",
          "authority_limits": "<описание ограничений или not_found>",
          "power_of_attorney_required": "<yes / no / unclear>"
        }

        ВАЖНО: Без чёткого порядка — конфликты и злоупотребления (ст. 1044 ГК РФ).
        Если значение явно не указано — пиши "not_found".
      prompt_file: null
      context_k: 6
      temperature: 0.0
      max_tokens: 400
    retrieval:
      context_k: 6
      max_chunks: 8
      retrieval_profile: "authority_check"
      boost_keywords:
        - "ведение дел"
        - "полномочия"
        - "доверенность"
        - "управляющий"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "management_type"
          type: "string"
          allowed_values: ["joint", "single_partner", "multiple_partners", "unclear"]
          keyword_hints: ["ведение дел", "совместно", "возлагается на"]
          description: "Тип управления"
      store_payload: true

  - id: decision_making_procedure
    name: "Процедура принятия решений (единогласие / большинство / deadlock)"
    description: |
      Порядок принятия решений по ключевым вопросам.
      Без процедуры — риск тупиковых ситуаций.
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "порядок принятия решений"
        - "единогласное решение"
        - "квалифицированное большинство"
        - "большинство голосов"
        - "deadlock"
        - "тупиковая ситуация"
      keyword_mode: "any"
      regex_patterns: []
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор простого товарищества.
        Проверь процедуру принятия решений.

        Ответь строго в JSON:
        {
          "decision_rule": "<unanimous / qualified_majority / simple_majority / unclear>",
          "key_issues_unanimous": "<перечень вопросов, требующих единогласия, или not_found>",
          "deadlock_mechanism": "<есть механизм или not_found>"
        }

        ВАЖНО: Без процедуры — риск блокировки деятельности (ст. 1044 ГК РФ).
        Если значение явно не указано — пиши "not_found".
      prompt_file: null
      context_k: 6
      temperature: 0.0
      max_tokens: 400
    retrieval:
      context_k: 6
      max_chunks: 8
      boost_keywords:
        - "принятие решений"
        - "единогласие"
        - "большинство"
        - "deadlock"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "decision_rule"
          type: "string"
          allowed_values: ["unanimous", "qualified_majority", "simple_majority", "unclear"]
          keyword_hints: ["единогласно", "большинство", "голосов"]
          description: "Правило принятия решений"
      store_payload: true

  - id: information_rights
    name: "Право на информацию и отчётность (ст. 1045 ГК РФ)"
    description: |
      Каждый товарищ имеет НЕОТЧУЖДАЕМОЕ право на полную информацию.
    triggers: {}
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "право на информацию"
        - "отчётность"
        - "доступ к документации"
        - "бухгалтерская отчётность"
        - "ежеквартальный отчёт"
        - "аудит"
      keyword_mode: "any"
      regex_patterns: []
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор простого товарищества.
        Проверь условия о праве на информацию.

        Ответь строго в JSON:
        {
          "information_right_acknowledged": "<yes / no / unclear>",
          "reporting_frequency": "<периодичность или not_found>",
          "access_to_documents": "<yes / no / unclear>"
        }

        ВАЖНО: Право на информацию НЕОТЧУЖДАЕМО (ст. 1045 ГК РФ).
        Если значение явно не указано — пиши "not_found".
      prompt_file: null
      context_k: 5
      temperature: 0.0
      max_tokens: 300
    retrieval:
      retrieval_profile: "notice_check"
      context_k: 5
      max_chunks: 6
      boost_keywords:
        - "право на информацию"
        - "отчётность"
        - "доступ"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 400
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "information_right_acknowledged"
          type: "string"
          allowed_values: ["yes", "no", "unclear"]
          keyword_hints: ["право на информацию", "отчётность", "ознакомление"]
          description: "Признание права на информацию"
      store_payload: true

  - id: profit_loss_distribution
    name: "Порядок распределения прибыли и покрытия убытков"
    description: |
      По умолчанию — пропорционально вкладам (ст. 1046, 1048 ГК РФ).
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "распределение прибыли"
        - "распределение убытков"
        - "пропорционально вкладам"
        - "доля прибыли"
        - "покрытие убытков"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)\\b\\d+[.,]?\\d*\\s*%"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор простого товарищества.
        Определи порядок распределения прибыли и убытков.

