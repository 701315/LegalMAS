      regex_patterns: []

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 7: DD_REQUEST_TEMPLATES
#  Читается: DDRequestTemplateLoader
#  Ключи = check_id из checks_v8 и doc_type_checks выше.
#  DDRequestTemplateLoader.render() матчит по exact или prefix.
# ════════════════════════════════════════════════════════════════════════════

dd_request_templates:

  common_goal_extraction:
    text: >
      Просим чётко определить в {doc_names} общую цель совместной деятельности:
      (а) извлечение прибыли / некоммерческая цель;
      (б) конкретное описание;
      (в) является ли деятельность предпринимательской.
      Без цели договор незаключён (ст. 1041 ГК РФ).
    addressee: "Все товарищи"

  contributions_extraction:
    text: >
      Просим предоставить по {doc_names}: (а) состав вклада каждого товарища;
      (б) денежную оценку всех вкладов; (в) сроки внесения.
      Без вкладов нет товарищества (ст. 1042 ГК РФ).
    addressee: "Все товарищи"

  contribution_valuation:
    text: >
      КРИТИЧЕСКИЙ ЗАПРОС: Просим согласовать в {doc_names} денежную оценку
      всех вкладов, особенно неденежных (знания, репутация, связи).
      Без оценки — споры о долях (ст. 1042 ГК РФ).
    addressee: "Все товарищи / Оценщик"

  management_structure:
    text: >
      Просим согласовать для {doc_names}: (а) кто ведёт дела;
      (б) пределы полномочий; (в) доверенности; (г) контроль.
      Без порядка — конфликты (ст. 1044 ГК РФ).
    addressee: "Все товарищи"

  decision_making_procedure:
    text: >
      Просим согласовать для {doc_names}: (а) правило голосования;
      (б) перечень вопросов для единогласия; (в) кворум;
      (г) механизм разрешения deadlock.
    addressee: "Все товарищи"

  information_rights:
    text: >
      Просим согласовать для {doc_names}: (а) периодичность отчётности;
      (б) состав отчёта; (в) доступ к первичным документам; (г) право на аудит.
      Право на информацию НЕОТЧУЖДАЕМО (ст. 1045 ГК РФ).
    addressee: "Все товарищи"

  profit_loss_distribution:
    text: >
      Просим согласовать для {doc_names}: (а) порядок распределения прибыли/убытков;
      (б) периодичность; (в) порядок покрытия убытков.
      Исключение из прибыли ничтожно (ст. 1048 ГК РФ).
    addressee: "Все товарищи"

  liability_and_regress:
    text: >
      КРИТИЧЕСКИЙ ЗАПРОС: (а) тип ответственности (солидарная при предпринимателе!);
      (б) порядок регресса; (в) пропорции возмещения.
      Кредитор может взыскать весь долг с любого товарища (ст. 1047 ГК РФ)!
    addressee: "Все товарищи / Юридический отдел"

  managing_partner_limitations:
    text: >
      Просим включить в {doc_names} ограничения полномочий ведущего дела:
      (а) лимит сделки; (б) перечень сделок, требующих одобрения;
      (в) вторая подпись; (г) запрет на изменение цели.
    addressee: "Все товарищи"

  withdrawal_rights_compensation:
    text: >
      Просим согласовать для {doc_names}: (а) срок уведомления о выходе;
      (б) оценка доли; (в) срок выплаты; (г) последствия для остальных.
    addressee: "Все товарищи"

  deadlock_resolution:
    text: >
      Просим включить в {doc_names} механизм разрешения deadlock:
      медиация, «русская рулетка», третейский суд.
    addressee: "Юридический отдел"

  death_bankruptcy_consequences_check:
    text: >
      Просим урегулировать в {doc_names}: (а) прекращается ли договор
      при смерти/банкротстве; (б) продолжение с наследниками;
      (в) право выкупа доли.
    addressee: "Юридический отдел"

  non_compete_conflict_of_interest:
    text: >
      Просим включить в {doc_names}: (а) запрет конкуренции;
      (б) порядок раскрытия конфликта интересов; (в) санкции.
    addressee: "Юридический отдел"

  admission_new_partners:
    text: >
      Просим урегулировать в {doc_names}: (а) единогласие для приёма;
      (б) оценка вклада нового участника; (в) пересмотр долей.
    addressee: "Все товарищи"

  tax_accounting_coordination:
    text: >
      Просим согласовать для {doc_names}: (а) кто ведёт учёт;
      (б) единые правила; (в) распределение налогов; (г) документооборот.
      Риск двойного налогообложения (НК РФ ст. 278).
    addressee: "Бухгалтерия / Налоговый консультант"

  common_property_regime_check:
    text: >
      Просим уточнить в {doc_names}: (а) порядок формирования общего имущества;
      (б) определение долей; (в) распоряжение общим имуществом;
      (г) порядок пользования (ст. 1043 ГК РФ).
    addressee: "Все товарищи"

  requalification_risk_check:
    text: >
      Просим проверить {doc_names} на признаки скрытого создания юридического лица:
      штат, расчётный счёт «товарищества», вывеска, печать.
