      store_payload: true

  - id: profit_loss_distribution_check
    name: "Распределение прибыли и покрытие убытков"
    description: >
      Фактографическая проверка порядка распределения прибыли и покрытия
      убытков, периодичности распределения и соблюдения императивных норм
      п. 1–2 ст. 1046, п. 1–2 ст. 1048 ГК РФ (порядок распределения прибыли,
      запрет полного устранения от прибыли, порядок покрытия расходов,
      запрет полного освобождения от убытков).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 40

    rules:
      keywords:
        - "распределение прибыли"
        - "распределение убытков"
        - "пропорционально вкладам"
        - "пропорционально стоимости вкладов"
        - "доля прибыли"
        - "покрытие убытков"
        - "покрытие общих расходов"
        - "общие расходы"
        - "не участвует в прибыли"
        - "устраняется от прибыли"
        - "освобождается от убытков"
        - "не несёт убытков"
        - "не несёт расходов"
        - "периодичность распределения"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)\\b\\d+[.,]?\\d*\\s*%"
        - "(?i)пропорциональн"
        - "(?i)(не\\s+участвует|устраняется)\\s+(от\\s+участия\\s+)?в\\s+прибыл"
        - "(?i)освобожда[а-яё]+\\s+от\\s+(покрытия\\s+)?(убытк|расход)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор простого товарищества (ст. 1046, 1048 ГК РФ).
        Проверяется только один вопрос: распределение прибыли и покрытие
        убытков (расходов).
        Нормативные ориентиры:
        - п. 1 ст. 1048 ГК РФ — прибыль распределяется пропорционально
          стоимости вкладов, если иное не предусмотрено соглашением.
          Иной (непропорциональный) порядок допустим.
        - п. 2 ст. 1048 ГК РФ — соглашение об устранении кого-либо
          из товарищей от участия в прибыли НИЧТОЖНО.
        - п. 1 ст. 1046 ГК РФ — порядок покрытия расходов и убытков,
          связанных с совместной деятельностью, определяется соглашением.
          При отсутствии — пропорционально стоимости вкладов.
        - п. 2 ст. 1046 ГК РФ — соглашение, полностью освобождающее
          кого-либо из товарищей от участия в покрытии общих расходов
          или убытков, НИЧТОЖНО.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Различай: непропорциональное распределение прибыли — допустимо;
          полное устранение от прибыли — ничтожно.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Порядок распределения прибыли (пропорционально вкладам /
           иной порядок).
        2. Порядок покрытия убытков и общих расходов.
        3. Периодичность распределения прибыли.
        4. Наличие условий об устранении товарища от прибыли
           (признак ничтожности по п. 2 ст. 1048 ГК РФ).
        5. Наличие условий о полном освобождении товарища от убытков
           или расходов (признак ничтожности по п. 2 ст. 1046 ГК РФ).

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Для enum-полей (*_status) при отсутствии данных возвращай
           "not_defined" (для profit_distribution_status, loss_distribution_status,
           distribution_frequency_status) или "not_detected"
           (для profit_exclusion_status, loss_exemption_status).
        4. Для строковых *_details при отсутствии данных возвращай строго
           "Данные не определены".
        5. Не используй "None", "null", пустые строки или отсутствующие ключи.
        6. В evidence включай только прямые цитаты из текста договора.
        7. profit_exclusion_status = "detected" ТОЛЬКО если прямо написано,
           что товарищ не участвует в прибыли, устраняется от участия
           в прибыли или исключается из распределения. Если порядок
           распределения иной (непропорциональный), но товарищ получает
           долю — это НЕ exclusion.
        8. loss_exemption_status = "detected" ТОЛЬКО если прямо написано,
           что товарищ полностью освобождается от убытков или расходов
           или не несёт их. Ограничение ответственности
           (например, «в пределах вклада») — НЕ полное освобождение,
           но фиксируй в loss_distribution_details.
        9. Верни РОВНО один валидный JSON-объект со всеми 11 ключами
           (10 полей + evidence), пригодный для парсинга через json.loads
           без предварительной обработки. Без markdown, без ```json,
           без комментариев, без текста до или после. Начни ответ сразу
           с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — пропорциональное распределение, ничтожных условий нет:
        Фрагмент:
        "Прибыль распределяется пропорционально стоимости вкладов товарищей
        ежеквартально. Общие расходы и убытки покрываются в том же порядке."
        Ответ:
        {
          "profit_distribution_status": "defined",
          "profit_distribution_details": "пропорционально стоимости вкладов товарищей, ежеквартально",
          "loss_distribution_status": "defined",
          "loss_distribution_details": "общие расходы и убытки покрываются пропорционально стоимости вкладов",
          "distribution_frequency_status": "defined",
          "distribution_frequency_details": "ежеквартально",
          "profit_exclusion_status": "not_detected",
          "profit_exclusion_details": "Данные не определены",
          "loss_exemption_status": "not_detected",
          "loss_exemption_details": "Данные не определены",
          "evidence": [
            {"clause_ref": "п. 4.1", "quote": "Прибыль распределяется пропорционально стоимости вкладов товарищей ежеквартально."},
            {"clause_ref": "п. 4.2", "quote": "Общие расходы и убытки покрываются в том же порядке."}
          ]
        }

        Пример 2 — ничтожное условие об устранении от прибыли:
        Фрагмент:
        "Прибыль распределяется следующим образом: Товарищ 1 и Товарищ 2 — по 50 %.
        Товарищ 3 не участвует в распределении прибыли."
        Ответ:
        {
          "profit_distribution_status": "defined",
          "profit_distribution_details": "Товарищ 1 — 50 %, Товарищ 2 — 50 %, Товарищ 3 не участвует",
          "loss_distribution_status": "not_defined",
          "loss_distribution_details": "Данные не определены",
          "distribution_frequency_status": "not_defined",
          "distribution_frequency_details": "Данные не определены",
          "profit_exclusion_status": "detected",
          "profit_exclusion_details": "Товарищ 3 не участвует в распределении прибыли",
          "loss_exemption_status": "not_detected",
          "loss_exemption_details": "Данные не определены",
          "evidence": [
            {"clause_ref": "п. 4.1", "quote": "Товарищ 3 не участвует в распределении прибыли."}
          ]
        }

        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Стороны договорились о распределении прибыли."
        Ответ:
        {
          "profit_distribution_status": "not_defined",
          "profit_distribution_details": "Данные не определены",
          "loss_distribution_status": "not_defined",
          "loss_distribution_details": "Данные не определены",
          "distribution_frequency_status": "not_defined",
          "distribution_frequency_details": "Данные не определены",
          "profit_exclusion_status": "not_detected",
          "profit_exclusion_details": "Данные не определены",
          "loss_exemption_status": "not_detected",
          "loss_exemption_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Все 11 ключей (10 полей + evidence) присутствуют в JSON?
        2. Найдена ли прямая цитата о распределении прибыли?
        3. Найден ли порядок покрытия убытков / расходов?
        4. Определена ли периодичность распределения?
        5. Проверено ли наличие условий об устранении от прибыли
           или освобождении от убытков?
        6. Если условия нет — profit_exclusion_status = "not_detected"
           и loss_exemption_status = "not_detected" (не "not_defined")?
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "profit_distribution_status": "<defined / not_defined>",
          "profit_distribution_details": "<текст или 'Данные не определены'>",
          "loss_distribution_status": "<defined / not_defined>",
          "loss_distribution_details": "<текст или 'Данные не определены'>",
          "distribution_frequency_status": "<defined / not_defined>",
          "distribution_frequency_details": "<текст или 'Данные не определены'>",
          "profit_exclusion_status": "<detected / not_detected>",
          "profit_exclusion_details": "<цитата или 'Данные не определены'>",
          "loss_exemption_status": "<detected / not_detected>",
          "loss_exemption_details": "<цитата или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 700

    retrieval:
      retrieval_profile: "payment_terms_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "распределение прибыли распределение убытков пропорционально вкладам пропорционально стоимости вкладов доля прибыли покрытие убытков покрытие общих расходов не участвует в прибыли устраняется от прибыли освобождается от убытков периодичность распределения"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "ведение дел"
        - "доверенность"
        - "выход из товарищества"
        - "прекращение"
        - "неустойка"
        - "налоговый учёт"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.30, 0.70]
        boost: 0.15
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1300

      compact_output: false

      presence_signal:
        field: "profit_loss_distribution_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора простого товарищества
        сведения о распределении прибыли и покрытии убытков (расходов).
        Не анализируй вклады, ведение дел, прекращение или налоги.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. profit_loss_distribution_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (profit_distribution_status, loss_distribution_status,
              distribution_frequency_status) ≠ "not_defined",
             либо profit_exclusion_status = "detected",
             либо loss_exemption_status = "detected";
           - "missing" — если profit_distribution_status,
             loss_distribution_status, distribution_frequency_status
             все = "not_defined", profit_exclusion_status = "not_detected"
             и loss_exemption_status = "not_detected";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - profit_distribution_status = "not_defined";
           - loss_distribution_status = "not_defined";
           - distribution_frequency_status = "not_defined";
           - profit_exclusion_status = "not_detected";
           - loss_exemption_status = "not_detected";
           - все *_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. profit_distribution_status:
           - "defined" — если прямо указан порядок распределения прибыли
             (пропорционально вкладам или иной);
           - "not_defined" — иначе.

        2. profit_distribution_details:
           Краткое user-facing описание порядка распределения прибыли.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        3. loss_distribution_status:
           - "defined" — если прямо указан порядок покрытия убытков
             и/или общих расходов;
           - "not_defined" — иначе.

        4. loss_distribution_details:
           Краткое user-facing описание порядка покрытия убытков
           и общих расходов.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        5. distribution_frequency_status:
           - "defined" — если прямо указана периодичность распределения
             прибыли (ежемесячно, ежеквартально, ежегодно, по итогам
             проекта);
           - "not_defined" — иначе.

        6. distribution_frequency_details:
           Краткое user-facing описание периодичности.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        7. profit_exclusion_status:
           Используй только одно из значений:
           - "detected" — если прямо указано, что товарищ не участвует
             в прибыли, устраняется от участия в прибыли или исключается
             из распределения (ничтожно по п. 2 ст. 1048 ГК РФ);
           - "not_detected" — если такого условия в тексте нет.

        8. profit_exclusion_details:
           Дословная цитата условия об устранении от прибыли.
           Если условия нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        9. loss_exemption_status:
           Используй только одно из значений:
           - "detected" — если прямо указано, что товарищ полностью
             освобождается от убытков / расходов или не несёт их
             (ничтожно по п. 2 ст. 1046 ГК РФ);
           - "not_detected" — если такого условия в тексте нет.

        10. loss_exemption_details:
            Дословная цитата условия об освобождении от убытков.
            Если условия нет — "Данные не определены".
            Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни profit_loss_distribution_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не делай выводов по типовой структуре договора.
        - Не извлекай сведения о вкладах, ведении дел, доверенностях, выходе из товарищества, прекращении, неустойках, налоговом учёте и иных нерелевантных темах.
        - profit_exclusion_status = "detected" только при прямом указании полного устранения от прибыли. Непропорциональное распределение прибыли (например, 70/30) НЕ является устранением от прибыли.
        - loss_exemption_status = "detected" только при прямом указании полного освобождения от убытков или расходов. Ограничение ответственности (например, «в пределах вклада») НЕ является полным освобождением — фиксируй в loss_distribution_details.
        - Если в разных фрагментах указаны противоречивые сведения и конфликт нельзя разрешить по тексту — статус → "not_defined", текстовое поле → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни порядка распределения прибыли, ни порядка
           покрытия убытков, ни периодичности, ни условий об устранении
           от прибыли или освобождении от убытков.
           → presence = "missing";
             profit_distribution_status = "not_defined";
             loss_distribution_status = "not_defined";
             distribution_frequency_status = "not_defined";
             profit_exclusion_status = "not_detected";
             loss_exemption_status = "not_detected";
             все *_details = "Данные не определены".

        2. Неполное раскрытие или прямое исключение.
           а) Общая фраза: "Стороны договорились о распределении прибыли"
              без указания порядка и периодичности.
              → presence = "present";
                profit_distribution_status = "not_defined".
           б) Прямо указано, что распределение прибыли не производится
              или что убытки не покрываются товарищами.
              → presence = "present";
                соответствующий *_status = "defined";
                соответствующий *_details содержит дословную формулировку.

        3. Противоречие между фрагментами.
           В разных частях договора указаны противоречивые доли
           распределения прибыли или порядки покрытия убытков.
           → presence = "unclear";
             profit_distribution_status = "not_defined";
             profit_distribution_details = "Не удалось определить".

        4. Специфика темы — ничтожные условия.
           Прямо указано, что товарищ не участвует в прибыли
           и/или полностью освобождается от убытков.
           → presence = "present";
             profit_exclusion_status = "detected" и/или
             loss_exemption_status = "detected";
             соответствующие *_details содержат дословную цитату.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для profit_loss_distribution_check_presence используй только: "present", "missing", "unclear".
        - Для enum-полей profit_distribution_status, loss_distribution_status, distribution_frequency_status используй только: "defined", "not_defined".
        - Для profit_exclusion_status, loss_exemption_status используй только: "detected", "not_detected".
        - Fallback при отсутствии данных:
          * все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "profit_loss_distribution_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по распределению прибыли и покрытию убытков. Внутреннее агрегатное signal-поле."
