  - id: "dispute_resolution"
    name: "Досудебный порядок и подсудность"
    description: "Порядок разрешения споров между товарищами"
    legal_base: "АПК РФ, ГПК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "разрешение споров"
        - "досудебный порядок"
        - "претензионный порядок"
        - "подсудность"
        - "арбитражный суд"
        - "путём переговоров"
      keyword_mode: "any"
      regex_patterns: []

  - id: "confidentiality_clause"
    name: "Конфиденциальность"
    description: "Обязательство о неразглашении условий товарищества"
    legal_base: "ст. 434.1 ГК РФ"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
