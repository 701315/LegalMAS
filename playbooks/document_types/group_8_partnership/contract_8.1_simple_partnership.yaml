        - pattern: "(?i)распределени[ея]\\s+убытк[оо]в"
          weight: 0.6
          distinctiveness: medium
          context: any
          description: "Распределение убытков между товарищами"

        - pattern: "(?i)долев[а-яё]+\\s+собственност[ьи]"
          weight: 0.6
          distinctiveness: medium
          context: any
          description: "Общая долевая собственность на имущество товарищества"

        - pattern: "(?i)товарищ\\s+ведущ[иаяй]\\s+дел[аа]"
          weight: 0.6
          distinctiveness: medium
          context: any
          description: "Товарищ, ведущий общие дела"

        - pattern: "(?i)выход\\s+из\\s+товариществ[аа]"
