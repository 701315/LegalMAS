          "disposal_procedure_status": "<defined / not_defined>",
          "disposal_procedure_details": "<текст или 'Данные не определены'>",
          "use_procedure_status": "<defined / not_defined>",
          "use_procedure_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
