# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 6: DOC_TYPE_CHECKS — авто-конвертируемые проверки (rules)
#  Читается: DocTypeCheckConverter
# ════════════════════════════════════════════════════════════════════════════

doc_type_checks:

  - id: "parties_minimum_two"
    name: "Стороны: минимум два товарища"
    description: "Минимум два участника"
    legal_base: "ст. 1041 ГК РФ"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "товарищ 1"
        - "товарищ 2"
        - "участник"
        - "стороны"
      keyword_mode: "any"
      regex_patterns: []

  - id: "common_goal_clause"
    name: "Общая цель совместной деятельности"
    description: "Без цели договор незаключён"
    legal_base: "ст. 1041 ГК РФ"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "общая цель"
        - "цель совместной деятельности"
        - "извлечение прибыли"
      keyword_mode: "any"
      regex_patterns: []

  - id: "contributions_clause"
    name: "Соединение вкладов"
    description: "Без вкладов нет товарищества"
    legal_base: "ст. 1042 ГК РФ"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "вклад"
        - "соединение вкладов"
        - "вносит вклад"
      keyword_mode: "any"
      regex_patterns: []

  - id: "contribution_valuation_clause"
    name: "Денежная оценка вкладов"
    description: "Без оценки — споры о долях"
    legal_base: "ст. 1042 ГК РФ"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "денежная оценка"
        - "оценка вклада"
        - "стоимость вклада"
      keyword_mode: "any"
      regex_patterns: []

  - id: "management_procedure"
    name: "Порядок ведения общих дел"
    description: "Кто ведёт дела, полномочия"
    legal_base: "ст. 1044 ГК РФ"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "ведение общих дел"
        - "ведущий дела"
        - "полномочия"
      keyword_mode: "any"
      regex_patterns: []

  - id: "profit_distribution_clause"
    name: "Порядок распределения прибыли"
    description: "По умолчанию — пропорционально вкладам"
    legal_base: "ст. 1048 ГК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "распределение прибыли"
        - "доля прибыли"
        - "пропорционально вкладам"
      keyword_mode: "any"
      regex_patterns: []

  - id: "liability_provisions"
    name: "Положения об ответственности"
    description: "Солидарная при предпринимателе"
    legal_base: "ст. 1047 ГК РФ"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "ответственность"
        - "солидарная ответственность"
        - "регресс"
      keyword_mode: "any"
      regex_patterns: []

  - id: "information_right_clause"
    name: "Право на информацию (неотчуждаемое)"
    description: "Каждый товарищ имеет право на информацию"
    legal_base: "ст. 1045 ГК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "право на информацию"
        - "отчётность"
        - "доступ к документации"
      keyword_mode: "any"
      regex_patterns: []

  - id: "withdrawal_clause"
    name: "Порядок выхода из товарищества"
    description: "Право на выход, уведомление, выдел доли"
    legal_base: "ст. 1050, 1051 ГК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "право на выход"
        - "выход из товарищества"
        - "выдел доли"
      keyword_mode: "any"
      regex_patterns: []

  - id: "termination_clause"
    name: "Порядок прекращения и раздела имущества"
    description: "Ликвидация общего имущества"
    legal_base: "ст. 1050, 1052, 1053 ГК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "прекращение договора"
        - "ликвидация общего имущества"
        - "раздел имущества"
      keyword_mode: "any"
      regex_patterns: []

  - id: "common_property_regime_clause"
    name: "Режим общей долевой собственности (ст. 1043 ГК РФ)"
    description: "Формирование и распоряжение общим имуществом"
    legal_base: "ст. 1043 ГК РФ"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "общая долевая собственность"
        - "общее имущество"
        - "доля в общем имуществе"
      keyword_mode: "any"
      regex_patterns: []

  - id: "dispute_resolution"
    name: "Досудебный порядок и подсудность"
    description: "Порядок разрешения споров между товарищами"
    legal_base: "АПК РФ, ГПК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "разрешение споров"
        - "досудебный порядок"
        - "претензионный порядок"
        - "подсудность"
        - "арбитражный суд"
        - "путём переговоров"
      keyword_mode: "any"
      regex_patterns: []

  - id: "confidentiality_clause"
    name: "Конфиденциальность"
    description: "Обязательство о неразглашении условий товарищества"
    legal_base: "ст. 434.1 ГК РФ"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "конфиденциальность"
        - "неразглашение"
        - "коммерческая тайна"
        - "не подлежит разглашению"
      keyword_mode: "any"
      regex_patterns: []

  - id: "contract_term"
    name: "Срок действия договора"
    description: "Бессрочный или срочный — влияет на порядок выхода"
    legal_base: "ст. 1050, 1051 ГК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "срок действия"
        - "бессрочный"
        - "на неопределённый срок"
        - "действует до"
        - "на срок"
      keyword_mode: "any"
      regex_patterns: []

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 7: DD_REQUEST_TEMPLATES
#  Читается: DDRequestTemplateLoader
#  Ключи = check_id из checks_v8 и doc_type_checks выше.
#  DDRequestTemplateLoader.render() матчит по exact или prefix.
# ════════════════════════════════════════════════════════════════════════════

dd_request_templates:

  common_goal_extraction:
    text: >
      Просим чётко определить в {doc_names} общую цель совместной деятельности:
      (а) извлечение прибыли / некоммерческая цель;
      (б) конкретное описание;
      (в) является ли деятельность предпринимательской.
      Без цели договор незаключён (ст. 1041 ГК РФ).
    addressee: "Все товарищи"

  contributions_extraction:
    text: >
      Просим предоставить по {doc_names}: (а) состав вклада каждого товарища;
      (б) денежную оценку всех вкладов; (в) сроки внесения.
      Без вкладов нет товарищества (ст. 1042 ГК РФ).
    addressee: "Все товарищи"

  contribution_valuation:
    text: >
      КРИТИЧЕСКИЙ ЗАПРОС: Просим согласовать в {doc_names} денежную оценку
      всех вкладов, особенно неденежных (знания, репутация, связи).
      Без оценки — споры о долях (ст. 1042 ГК РФ).
    addressee: "Все товарищи / Оценщик"

  management_structure:
    text: >
      Просим согласовать для {doc_names}: (а) кто ведёт дела;
      (б) пределы полномочий; (в) доверенности; (г) контроль.
      Без порядка — конфликты (ст. 1044 ГК РФ).
    addressee: "Все товарищи"

  decision_making_procedure:
    text: >
      Просим согласовать для {doc_names}: (а) правило голосования;
      (б) перечень вопросов для единогласия; (в) кворум;
      (г) механизм разрешения deadlock.
    addressee: "Все товарищи"

  information_rights:
    text: >
      Просим согласовать для {doc_names}: (а) периодичность отчётности;
      (б) состав отчёта; (в) доступ к первичным документам; (г) право на аудит.
      Право на информацию НЕОТЧУЖДАЕМО (ст. 1045 ГК РФ).
    addressee: "Все товарищи"

  profit_loss_distribution:
    text: >
      Просим согласовать для {doc_names}: (а) порядок распределения прибыли/убытков;
      (б) периодичность; (в) порядок покрытия убытков.
      Исключение из прибыли ничтожно (ст. 1048 ГК РФ).
    addressee: "Все товарищи"

  liability_and_regress:
    text: >
      КРИТИЧЕСКИЙ ЗАПРОС: (а) тип ответственности (солидарная при предпринимателе!);
      (б) порядок регресса; (в) пропорции возмещения.
      Кредитор может взыскать весь долг с любого товарища (ст. 1047 ГК РФ)!
    addressee: "Все товарищи / Юридический отдел"

  managing_partner_limitations:
    text: >
      Просим включить в {doc_names} ограничения полномочий ведущего дела:
      (а) лимит сделки; (б) перечень сделок, требующих одобрения;
      (в) вторая подпись; (г) запрет на изменение цели.
    addressee: "Все товарищи"

  withdrawal_rights_compensation:
    text: >
      Просим согласовать для {doc_names}: (а) срок уведомления о выходе;
      (б) оценка доли; (в) срок выплаты; (г) последствия для остальных.
    addressee: "Все товарищи"

  deadlock_resolution:
    text: >
      Просим включить в {doc_names} механизм разрешения deadlock:
      медиация, «русская рулетка», третейский суд.
    addressee: "Юридический отдел"

  death_bankruptcy_consequences_check:
    text: >
      Просим урегулировать в {doc_names}: (а) прекращается ли договор
      при смерти/банкротстве; (б) продолжение с наследниками;
      (в) право выкупа доли.
    addressee: "Юридический отдел"

  non_compete_conflict_of_interest:
    text: >
      Просим включить в {doc_names}: (а) запрет конкуренции;
      (б) порядок раскрытия конфликта интересов; (в) санкции.
    addressee: "Юридический отдел"

  admission_new_partners:
    text: >
      Просим урегулировать в {doc_names}: (а) единогласие для приёма;
      (б) оценка вклада нового участника; (в) пересмотр долей.
    addressee: "Все товарищи"

  tax_accounting_coordination:
    text: >
      Просим согласовать для {doc_names}: (а) кто ведёт учёт;
      (б) единые правила; (в) распределение налогов; (г) документооборот.
      Риск двойного налогообложения (НК РФ ст. 278).
    addressee: "Бухгалтерия / Налоговый консультант"

  common_property_regime_check:
    text: >
      Просим уточнить в {doc_names}: (а) порядок формирования общего имущества;
      (б) определение долей; (в) распоряжение общим имуществом;
      (г) порядок пользования (ст. 1043 ГК РФ).
    addressee: "Все товарищи"

  requalification_risk_check:
    text: >
      Просим проверить {doc_names} на признаки скрытого создания юридического лица:
      штат, расчётный счёт «товарищества», вывеска, печать.
      Просим обеспечить чёткую оговорку «без образования юридического лица».
    addressee: "Юридический отдел"

  parties_minimum_two:
    text: >
      Просим подтвердить реквизиты всех товарищей (минимум двух) по {doc_names}.
    addressee: "Все товарищи"

  common_goal_clause:
    text: >
      КРИТИЧНО: В {doc_names} не указана общая цель. Незамедлительно дополнить (ст. 1041 ГК РФ).
    addressee: "Все товарищи"

  contributions_clause:
    text: >
      КРИТИЧНО: В {doc_names} не указаны вклады. Незамедлительно дополнить (ст. 1042 ГК РФ).
    addressee: "Все товарищи"

  contribution_valuation_clause:
    text: >
      Просим согласовать оценку вкладов для {doc_names}.
    addressee: "Все товарищи"

  management_procedure:
    text: >
      Просим согласовать порядок ведения дел для {doc_names}.
    addressee: "Все товарищи"

  profit_distribution_clause:
    text: >
      Просим согласовать распределение прибыли для {doc_names}.
    addressee: "Все товарищи"

  liability_provisions:
    text: >
      Просим урегулировать ответственность для {doc_names}.
      При предпринимателе — СОЛИДАРНАЯ (ст. 1047 ГК РФ).
    addressee: "Юридический отдел"

  information_right_clause:
    text: >
      Просим согласовать право на информацию для {doc_names}.
    addressee: "Все товарищи"

  withdrawal_clause:
    text: >
      Просим согласовать порядок выхода для {doc_names}.
    addressee: "Все товарищи"

  termination_clause:
    text: >
      Просим согласовать порядок прекращения и раздела имущества для {doc_names}.
    addressee: "Все товарищи"

  common_property_regime_clause:
    text: >
      Просим определить режим общей собственности для {doc_names} (ст. 1043 ГК РФ).
    addressee: "Все товарищи"

  dispute_resolution:
    text: >
      Просим согласовать досудебный порядок и подсудность для {doc_names}.
    addressee: "Юридический отдел"

  confidentiality_clause:
    text: >
      Просим включить в {doc_names} обязательство конфиденциальности.
    addressee: "Юридический отдел"

  contract_term:
    text: >
      Просим указать в {doc_names} срок действия (бессрочный/срочный).
      Влияет на порядок выхода (ст. 1051 ГК РФ).
    addressee: "Все товарищи"

  minimum_two_partners_required:
    text: >
      Минимум два участника (ст. 1041 ГК РФ). Просим подтвердить для {doc_names}.
    addressee: "Все товарищи"

  common_goal_mandatory:
    text: >
      КРИТИЧНО: Общая цель обязательна (ст. 1041 ГК РФ). Проверьте {doc_names}.
    addressee: "Все товарищи"

  contributions_mandatory:
    text: >
      КРИТИЧНО: Вклады обязательны (ст. 1042 ГК РФ). Проверьте {doc_names}.
    addressee: "Все товарищи"

  joint_and_several_liability_warning:
    text: >
      КРИТИЧЕСКОЕ ПРЕДУПРЕЖДЕНИЕ: В {doc_names} присутствует ИП/коммерческая организация.
      ВСЕ товарищи несут СОЛИДАРНУЮ ОТВЕТСТВЕННОСТЬ ВСЕМ ИМУЩЕСТВОМ (ст. 1047 ГК РФ).
    addressee: "Все товарищи / Юридический отдел"

  prohibition_of_profit_exclusion:
    text: >
      ВНИМАНИЕ: В {doc_names} выявлено условие об исключении товарища из прибыли.
      Такое условие НИЧТОЖНО (ст. 1048 ГК РФ). Просим исключить.
    addressee: "Юридический отдел"

  prohibition_of_loss_exemption:
    text: >
      ВНИМАНИЕ: В {doc_names} выявлено условие об освобождении товарища от убытков.
      Такое условие НИЧТОЖНО (ст. 1046 ГК РФ). Просим исключить.
    addressee: "Юридический отдел"

  # Generic fallback
  _default:
    text: >
      Просим предоставить дополнительную информацию по вопросу «{check_name}»
      применительно к {doc_names}.
    addressee: "Юридический консультант"