        (214-ФЗ). Определи соответствие формальным требованиям.
        Не анализируй вклады как таковые, распределение прибыли,
        налоговый учёт или прекращение.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 10 полей + evidence (всего 11 ключей):
        1. investment_partnership_signs_code — "detected" / "not_detected".
        2. investment_partnership_signs_details — обоснование признаков.
        3. investment_partnership_compliance — "compliant" / "partially" /
           "non_compliant" / "not_applicable" / "not_defined".
        4. investment_registration_status — "defined" или "not_defined".
        5. investment_registration_details — нотариат / ЕГРЮЛ.
        6. srp_signs_code — "detected" / "not_detected".
        7. srp_signs_details — обоснование признаков СРП.
        8. construction_signs_code — "detected" / "not_detected".
        9. construction_signs_details — обоснование признаков долевого
           строительства.
        10. requalification_risk_summary — итоговая сводка риска
            переквалификации.

        Если данные отсутствуют:
        - для *_signs_code: "not_detected"
        - для investment_partnership_compliance: "not_applicable" (если
          признаков нет) или "not_defined"
        - для *_details и requalification_risk_summary:
          "Данные не определены"
        - для investment_registration_status: "not_defined"
        </task>

        <rules>
        - Используй только текст договора.
        - investment_partnership_compliance = "not_applicable" если
          признаков инвесттоварищества нет.
        - "non_compliant" — признаки есть, но нотариат / ЕГРЮЛ отсутствуют.
        - "partially" — соблюдено одно из двух требований.
        - "compliant" — соблюдены оба (нотариат + ЕГРЮЛ).
        - requalification_risk_summary: краткая сводка — какие признаки
          обнаружены и в чём риск.
        - Верни РОВНО один валидный JSON-объект со всеми 11 ключами
          (10 полей + evidence), пригодный для парсинга через json.loads
