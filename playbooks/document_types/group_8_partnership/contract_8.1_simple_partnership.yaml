        3. joint_and_several_mentioned — "yes" / "no" / "not_defined"
           (прямое упоминание термина «солидарная ответственность»).
        4. creditor_priority_status — "defined" или "not_defined".
        5. creditor_priority_details — очерёдность взыскания
           (сначала общее имущество / сразу личное имущество).
        6. regress_procedure_status — "defined" или "not_defined".
        7. regress_procedure_details — порядок регрессных требований.
        8. internal_proportions_status — "defined" или "not_defined".
        9. internal_proportions_details — пропорции внутренних расчётов
           при регрессе.
        10. liability_deviations_code — "detected" если есть условие,
            отклоняющееся от императивных правил ст. 1047 ГК РФ; иначе
            "not_detected".
        11. liability_deviations_details — описание отклонения.

        Если данные отсутствуют:
        - для *_status: "not_defined"
        - для liability_deviations_code: "not_detected"
        - для *_details: "Данные не определены"
        </task>

        <rules>
        - Используй только текст договора.
        - liability_type_code = "solidary" только при прямом указании солидарной
          ответственности по общим обязательствам.
        - liability_type_code = "share" только при прямом указании долевой
          ответственности или ответственности в пределах вклада.
        - joint_and_several_mentioned фиксирует наличие самого термина
          «солидарная» — независимо от liability_type_code.
        - liability_deviations_code = "detected" при условии, противоречащем
          ст. 1047 ГК РФ: например, установление долевой ответственности
          при предпринимательской цели (при наличии ИП/КО среди товарищей).
        - Верни РОВНО один валидный JSON-объект со всеми 12 ключами
          (11 полей + evidence), пригодный для парсинга через json.loads
          без предварительной обработки. Без markdown, без ```json,
          без комментариев, без текста до или после. Начни ответ сразу
          с { и закончи }.
        </rules>

        <cove>
        1. Все 12 ключей (11 полей + evidence) присутствуют в JSON?
        2. liability_type_code — строго "solidary" / "share" / "not_defined"?
        3. joint_and_several_mentioned — строго "yes" / "no" / "not_defined"?
        4. liability_deviations_code — строго "detected" / "not_detected"?
        5. Все *_details заполнены или "Данные не определены"?
        Не выводи шаги. Верни только JSON.
        </cove>
      fields:
        - name: "liability_type_code"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Тип ответственности"
          allowed_values: ["solidary", "share", "not_defined"]
          description: "Тип ответственности товарищей перед третьими лицами (солидарная / долевая)."
