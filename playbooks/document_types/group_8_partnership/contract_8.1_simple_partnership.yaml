        <role>
        Ты — российский юрист. Извлеки из договора простого товарищества
        сведения о ведении дел, полномочиях, принятии решений
        и ограничениях.
        Не анализируй вклады, распределение прибыли, прекращение или налоги.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 12 полей + evidence (всего 13 ключей):
        1. management_type — "joint" / "single_partner" / "multiple_partners" / "not_defined".
        2. managing_partner_status — "defined" или "not_defined".
        3. managing_partner_details — идентификация ведущего дела товарища.
        4. poa_required_status — "defined" или "not_defined".
        5. poa_required_details — условие о доверенности.
        6. decision_rule — "unanimous" / "qualified_majority" / "simple_majority" / "mixed" / "not_defined".
        7. unanimous_issues_status — "defined" или "not_defined".
        8. unanimous_issues_details — перечень вопросов для единогласия.
        9. authority_limits_status — "defined" или "not_defined".
        10. authority_limits_details — ограничения полномочий.
        11. deadlock_mechanism_status — "defined" или "not_defined".
        12. deadlock_mechanism_details — механизм разрешения разногласий.

        Если данные отсутствуют:
        - статус = "not_defined"
        - текст = "Данные не определены"
        </task>

        <rules>
        - Используй только текст договора.
        - management_type: "joint" если ведение дел совместно;
          "single_partner" если ведёт один товарищ;
          "multiple_partners" если ведут несколько товарищей (не все, не один);
          "not_defined" если тип управления прямо не указан.
        - decision_rule: "unanimous" если все решения единогласны;
          "qualified_majority" если установлено квалифицированное большинство;
          "simple_majority" если простое большинство;
          "mixed" если сочетание разных правил для разных вопросов.
        - poa_required_status: "defined" если в договоре явно указано условие
          о доверенности для ведущего дела; "not_defined" иначе.
        - deadlock_mechanism_details: механизм разрешения тупиковых ситуаций
          (переговоры, медиация, суд, привлечение третьего лица и т.п.).
        - Верни РОВНО один валидный JSON-объект со всеми 13 ключами
          (12 полей + evidence), пригодный для парсинга через json.loads
          без предварительной обработки. Без markdown, без ```json,
          без комментариев, без текста до или после. Начни ответ сразу
          с { и закончи }.
        </rules>

        <cove>
        1. Все 13 ключей (12 полей + evidence) присутствуют в JSON?
        2. management_type, decision_rule — строго из allowed_values?
        3. Все *_status — строго "defined" / "not_defined"?
        4. Все *_details заполнены или "Данные не определены"?
        5. Для management_type = "single_partner" проверено наличие условия
           о доверенности (poa_required_*)?
        Не выводи шаги. Верни только JSON.
        </cove>
      fields:
