          required: false
        - name: "decision_rule"
          type: "string"
          presentation: "signal"
          allowed_values: ["unanimous", "qualified_majority", "simple_majority", "mixed", "not_defined"]
          description: "Правило принятия решений."
          required: false
        - name: "unanimous_issues_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
