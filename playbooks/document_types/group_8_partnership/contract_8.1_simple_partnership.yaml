  - id: partner_liability_after_termination
    name: "Ответственность выбывшего товарища (ст. 1053 ГК РФ)"
    description: >
      Фактографическая проверка сохранения ответственности выбывшего
      из товарищества товарища по общим обязательствам, возникшим
      в период его участия (ст. 1053 ГК РФ): объём, срок (по умолчанию
      3 года), порядок уведомления третьих лиц, попытки освобождения
      от ответственности.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 150

    rules:
      keywords:
        - "ответственность после выхода"
        - "выбывший товарищ"
        - "ответственность выбывшего"
        - "общие обязательства"
        - "обязательства, возникшие до выхода"
        - "срок ответственности"
        - "уведомление третьих лиц"
        - "освобождение от ответственности"
        - "три года"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)ответственност[ьи][а-яё]*\\s+(после|выбывш)"
        - "(?i)выбывш[а-яё]+\\s+товарищ"
        - "(?i)обязательств[а-яё]*,\\s+возникш"
        - "(?i)уведомлени[ея][а-яё]*\\s+третьих"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор простого товарищества (ст. 1053 ГК РФ).
        Проверяется только один вопрос: сохранение ответственности товарища
        после прекращения его участия в товариществе.
        Нормативные ориентиры:
        - п. 1 ст. 1053 ГК РФ — товарищ, в отношении которого договор
          прекращён (кроме прекращения из-за объявления его банкротом),
          продолжает отвечать по общим обязательствам, ВОЗНИКШИМ
          В ПЕРИОД ЕГО УЧАСТИЯ, перед третьими лицами в течение срока,
          установленного договором, а при отсутствии — В ТЕЧЕНИЕ ТРЁХ ЛЕТ
          со дня, когда он узнал или должен был узнать о прекращении.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Различай: обязательства В ПЕРИОД участия (отвечает) и ПОСЛЕ
          выхода (не отвечает).
        - Договором срок может быть сокращён, но не может полностью
          исключить ответственность перед третьими лицами.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Условие об ответственности выбывшего товарища по общим
           обязательствам после выхода.
        2. Объём сохраняемой ответственности (все обязательства периода
           участия / только часть).
        3. Срок сохранения ответственности после выхода (если указан).
        4. Порядок уведомления третьих лиц о выходе товарища.
        5. Наличие условия о полном освобождении выбывшего товарища
           от ответственности.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Для enum-полей (*_status, post_term_liability_scope) при
           отсутствии данных возвращай "not_defined"; для exit_liability_waiver —
           "not_detected".
        4. Для строковых *_details при отсутствии данных возвращай строго
           "Данные не определены".
        5. Не используй "None", "null", пустые строки или отсутствующие ключи.
        6. В evidence включай только прямые цитаты из текста договора.
        7. post_term_liability_scope: "all_period" (все обязательства периода
           участия) / "before_exit_only" (только возникшие до выхода) /
           "not_defined".
        8. exit_liability_waiver = "detected" если в договоре есть условие
           о полном освобождении выбывшего от ответственности (оспоримо
           перед третьими лицами).
        9. Верни РОВНО один валидный JSON-объект со всеми 9 ключами
           (8 полей + evidence), пригодный для парсинга через json.loads
           без предварительной обработки. Без markdown, без ```json,
           без комментариев, без текста до или после. Начни ответ сразу
           с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — срок сокращён, объём определён:
        Фрагмент:
        "Товарищ, вышедший из товарищества, продолжает отвечать по общим
        обязательствам, возникшим в период его участия, в течение одного
        года со дня выхода. О выходе товарища остальные товарищи уведомляют
        третьих лиц в письменной форме в течение 10 рабочих дней."
        Ответ:
        {
          "post_term_liability_status": "defined",
          "post_term_liability_details": "выбывший товарищ продолжает отвечать по общим обязательствам, возникшим в период его участия, в течение одного года со дня выхода",
          "post_term_liability_scope": "all_period",
          "post_term_liability_term_status": "defined",
          "post_term_liability_term_details": "один год со дня выхода",
          "third_party_notification_status": "defined",
          "third_party_notification_details": "остальные товарищи уведомляют третьих лиц в письменной форме в течение 10 рабочих дней",
          "exit_liability_waiver": "not_detected",
          "evidence": [
            {"clause_ref": "п. 13.1", "quote": "Товарищ, вышедший из товарищества, продолжает отвечать по общим обязательствам, возникшим в период его участия, в течение одного года со дня выхода."},
            {"clause_ref": "п. 13.2", "quote": "О выходе товарища остальные товарищи уведомляют третьих лиц в письменной форме в течение 10 рабочих дней."}
          ]
        }

        Пример 2 — попытка полного освобождения:
        Фрагмент:
        "Выбывший товарищ не несёт никакой ответственности по общим
        обязательствам товарищества после своего выхода."
        Ответ:
        {
          "post_term_liability_status": "defined",
          "post_term_liability_details": "выбывший товарищ освобождается от ответственности по общим обязательствам после выхода",
          "post_term_liability_scope": "before_exit_only",
          "post_term_liability_term_status": "not_defined",
          "post_term_liability_term_details": "Данные не определены",
          "third_party_notification_status": "not_defined",
          "third_party_notification_details": "Данные не определены",
          "exit_liability_waiver": "detected",
          "evidence": [
            {"clause_ref": "п. 13.1", "quote": "Выбывший товарищ не несёт никакой ответственности по общим обязательствам товарищества после своего выхода."}
          ]
        }

        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Стороны обязуются исполнять договор."
        Ответ:
        {
          "post_term_liability_status": "not_defined",
          "post_term_liability_details": "Данные не определены",
          "post_term_liability_scope": "not_defined",
          "post_term_liability_term_status": "not_defined",
          "post_term_liability_term_details": "Данные не определены",
          "third_party_notification_status": "not_defined",
          "third_party_notification_details": "Данные не определены",
          "exit_liability_waiver": "not_detected",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Все 9 ключей (8 полей + evidence) присутствуют в JSON?
        2. post_term_liability_scope — строго из allowed_values?
        3. Все *_status — строго "defined" / "not_defined"?
        4. exit_liability_waiver — строго "detected" / "not_detected"?
        5. Проверен ли срок сохранения ответственности?
        6. Проверен ли порядок уведомления третьих лиц?
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "post_term_liability_status": "<defined / not_defined>",
          "post_term_liability_details": "<текст или 'Данные не определены'>",
          "post_term_liability_scope": "<all_period / before_exit_only / not_defined>",
          "post_term_liability_term_status": "<defined / not_defined>",
          "post_term_liability_term_details": "<текст или 'Данные не определены'>",
          "third_party_notification_status": "<defined / not_defined>",
          "third_party_notification_details": "<текст или 'Данные не определены'>",
          "exit_liability_waiver": "<detected / not_detected>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 700

    retrieval:
      retrieval_profile: "termination_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "ответственность после выхода выбывший товарищ ответственность выбывшего общие обязательства обязательства возникшие до выхода срок ответственности уведомление третьих лиц освобождение от ответственности три года период участия"
      preferred_unit_types:
        - liability_provision
        - termination_provision
        - obligation
      excluded_unit_types:
        - definition
        - technical_fragment
      preferred_clause_functions:
        - limitations
        - remedies
      negative_keywords:
        - "вклад товарища"
        - "распределение прибыли"
        - "ведение дел"
        - "налоговый учёт"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.55, 1.0]
        boost: 0.15
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "limitations"
        - "remedies"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1300

      compact_output: false

      presence_signal:
        field: "partner_liability_after_termination_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора простого товарищества
        сведения о сохранении ответственности выбывшего товарища
        по общим обязательствам (ст. 1053 ГК РФ).
        Не анализируй вклады как таковые, распределение прибыли,
        ведение дел или налоговый учёт.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. partner_liability_after_termination_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (post_term_liability_status, post_term_liability_scope,
              post_term_liability_term_status,
              third_party_notification_status) ≠ "not_defined",
             либо exit_liability_waiver = "detected";
           - "missing" — если все четыре *_status/scope = "not_defined"
             и exit_liability_waiver = "not_detected";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - post_term_liability_status = "not_defined";
           - post_term_liability_scope = "not_defined";
           - post_term_liability_term_status = "not_defined";
           - third_party_notification_status = "not_defined";
           - exit_liability_waiver = "not_detected";
           - все *_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. post_term_liability_status:
           - "defined" — если прямо указано условие об ответственности
             выбывшего товарища по общим обязательствам после выхода;
           - "not_defined" — иначе.

        2. post_term_liability_details:
           Краткое user-facing описание условия об ответственности
           после выхода.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        3. post_term_liability_scope:
           Используй только одно из значений:
           - "all_period" — если договор сохраняет ответственность
             по всем обязательствам периода участия;
           - "before_exit_only" — если только по обязательствам,
             возникшим до выхода;
           - "not_defined" — иначе.

        4. post_term_liability_term_status:
           - "defined" — если прямо указан срок сохранения
             ответственности после выхода;
           - "not_defined" — иначе.

        5. post_term_liability_term_details:
           Краткое user-facing описание срока (например:
           "один год со дня выхода"). Если в договоре нет, укажи:
           "по умолчанию — 3 года (ст. 1053 ГК РФ)".
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        6. third_party_notification_status:
           - "defined" — если прямо указан порядок уведомления третьих
             лиц о выходе товарища;
           - "not_defined" — иначе.

        7. third_party_notification_details:
           Краткое user-facing описание порядка уведомления.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        8. exit_liability_waiver:
           Используй только одно из значений:
           - "detected" — если в договоре прямо установлено полное
             освобождение выбывшего товарища от ответственности
             (оспоримо перед третьими лицами);
           - "not_detected" — если такого условия в тексте нет.
        </task>

        <context_rules>
        - Перед остальными полями заполни partner_liability_after_termination_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не делай выводов по типовой структуре договора.
        - Не извлекай сведения о вкладах как таковых, распределении прибыли, ведении дел, налоговом учёте и иных нерелевантных темах.
        - post_term_liability_scope = "all_period" если договор сохраняет ответственность по всем обязательствам периода участия; "before_exit_only" если только по обязательствам, возникшим до выхода.
        - exit_liability_waiver = "detected" только при прямом указании полного освобождения от ответственности.
        - Если в разных фрагментах указаны противоречивые сведения — статус → "not_defined", текстовое поле → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни условия об ответственности выбывшего,
           ни срока, ни порядка уведомления, ни освобождения
           от ответственности.
           → presence = "missing";
             все *_status = "not_defined";
             post_term_liability_scope = "not_defined";
             exit_liability_waiver = "not_detected";
             все *_details = "Данные не определены".

        2. Неполное раскрытие или прямое исключение.
           а) Общая фраза: «Выбывший товарищ отвечает по общим
              обязательствам» без указания срока и объёма.
              → presence = "present";
                post_term_liability_status = "defined";
                post_term_liability_term_status = "not_defined".
           б) Прямо указано, что выбывший товарищ полностью
              освобождается от ответственности.
              → presence = "present";
                post_term_liability_status = "defined";
                exit_liability_waiver = "detected";
                post_term_liability_scope = "before_exit_only".

        3. Противоречие между фрагментами.
           В разных частях договора указаны противоречивые сроки
           сохранения ответственности или противоречивые условия
           об уведомлении третьих лиц.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             соответствующий *_details = "Не удалось определить".

        4. Специфика темы — сокращённый срок.
           Договор устанавливает срок менее 3 лет, но не исключает
           ответственность полностью.
           → presence = "present";
             post_term_liability_status = "defined";
             post_term_liability_term_status = "defined";
             post_term_liability_scope = "all_period";
             exit_liability_waiver = "not_detected".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для partner_liability_after_termination_presence используй только: "present", "missing", "unclear".
        - Для enum-полей *_status используй только: "defined", "not_defined".
        - Для post_term_liability_scope используй только: "all_period", "before_exit_only", "not_defined".
        - Для exit_liability_waiver используй только: "detected", "not_detected".
        - Fallback при отсутствии данных:
          * все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "partner_liability_after_termination_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по ответственности выбывшего товарища. Внутреннее агрегатное signal-поле."
          required: true

        - name: "post_term_liability_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус условия об ответственности выбывшего товарища."
          required: true

        - name: "post_term_liability_details"
          type: "string"
