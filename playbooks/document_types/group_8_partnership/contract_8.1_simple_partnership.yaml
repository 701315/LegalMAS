      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора простого товарищества сведения
        о принятии новых товарищей, запрете конкуренции и конфликте интересов.
        Не анализируй вклады, прибыль, ведение дел или прекращение.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:
        1. admission_allowed_status — "defined" или "not_defined".
        2. admission_allowed_details — порядок принятия новых товарищей.
        3. unanimous_consent_status — "defined" или "not_defined".
