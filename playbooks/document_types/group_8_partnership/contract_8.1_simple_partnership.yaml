# БЛОК 5: DD_REQUEST_TEMPLATES
# Читается: DDRequestTemplateLoader
# ════════════════════════════════════════════════════════════════════════════

dd_request_templates:
  partnership_subject_extraction:
    text: >
      Просим чётко определить в {doc_names}: (а) идентификацию всех товарищей
      (минимум двух); (б) общую цель совместной деятельности — без цели договор
      незаключён (ст. 1041 ГК РФ); (в) тип цели (прибыль / некоммерческая);
      (г) прямое указание «без образования юридического лица»; (д) срок действия.
    addressee: "Все товарищи"

  contributions_check:
    text: >
      КРИТИЧЕСКИЙ ЗАПРОС: Просим предоставить по {doc_names}: (а) состав вклада
      каждого товарища (деньги, имущество, знания, репутация); (б) денежную оценку
      всех вкладов, особенно неденежных — без оценки споры о долях (ст. 1042 ГК РФ);
      (в) сроки внесения вкладов.
    addressee: "Все товарищи / Оценщик"

  management_and_decisions_check:
    text: >
      Просим согласовать для {doc_names}: (а) кто ведёт дела (совместно / один
      товарищ); (б) пределы полномочий ведущего дела и доверенности;
      (в) правило принятия решений (единогласие / большинство);
      (г) перечень вопросов для единогласия; (д) механизм разрешения deadlock.
    addressee: "Все товарищи"

  profit_loss_distribution_check:
    text: >
      Просим согласовать для {doc_names}: (а) порядок распределения прибыли
      (пропорционально вкладам / иное); (б) порядок покрытия убытков;
      (в) периодичность распределения. ВНИМАНИЕ: исключение товарища из прибыли
      НИЧТОЖНО (ст. 1048 ГК РФ), освобождение от убытков НИЧТОЖНО (ст. 1046 ГК РФ).
    addressee: "Все товарищи"

  liability_and_regress_check:
    text: >
      КРИТИЧЕСКИЙ ЗАПРОС по {doc_names}: (а) тип ответственности перед третьими
      лицами — при предпринимателе СОЛИДАРНАЯ ВСЕМ ИМУЩЕСТВОМ (ст. 1047 ГК РФ);
      (б) порядок регрессных требований между товарищами; (в) пропорции внутренних
      расчётов. Кредитор может взыскать весь долг с любого товарища!
    addressee: "Все товарищи / Юридический советник"

  information_and_reporting_check:
    text: >
      Просим согласовать для {doc_names}: (а) признание права на информацию
      (НЕОТЧУЖДАЕМО — ст. 1045 ГК РФ); (б) периодичность отчётности;
      (в) доступ к первичным документам; (г) право на аудит.
    addressee: "Все товарищи"

  common_property_check:
    text: >
      Просим уточнить в {doc_names}: (а) режим общей долевой собственности
      (ст. 1043 ГК РФ); (б) способ определения долей; (в) порядок распоряжения
      общим имуществом; (г) порядок пользования общим имуществом.
    addressee: "Все товарищи"

  withdrawal_and_termination_check:
    text: >
      Просим согласовать для {doc_names}: (а) право на выход и срок уведомления
      (для бессрочного — 3 месяца, ст. 1051 ГК РФ); (б) способ оценки доли
      при выходе; (в) срок выплаты доли; (г) основания прекращения;
      (д) порядок раздела имущества при прекращении.
    addressee: "Все товарищи"

  death_bankruptcy_succession_check:
    text: >
      Просим урегулировать в {doc_names}: (а) последствия смерти/банкротства
      товарища (по умолчанию — прекращение договора, ст. 1050 ГК РФ);
      (б) возможность продолжения с наследниками; (в) право выкупа доли.
    addressee: "Юридический советник"

  new_partners_and_conflict_check:
    text: >
      Просим урегулировать в {doc_names}: (а) порядок принятия новых товарищей
      (единогласие / оценка вклада / пересмотр долей); (б) запрет конкурирующей
      деятельности; (в) порядок раскрытия конфликта интересов.
    addressee: "Все товарищи / Юридический советник"

  tax_accounting_check:
    text: >
      Просим согласовать для {doc_names}: (а) кто ведёт налоговый/бухгалтерский
      учёт; (б) единые правила учёта; (в) распределение налоговых обязательств;
      (г) документооборот. ВНИМАНИЕ: риск двойного налогообложения при разных
      режимах (НК РФ ст. 278).
    addressee: "Бухгалтерия / Налоговый консультант"

  dispute_resolution_check:
    text: >
      Просим согласовать для {doc_names}: (а) порядок разрешения споров;
      (б) механизм deadlock (медиация / «русская рулетка» / третейский суд);
      (в) досудебный порядок; (г) подсудность.
    addressee: "Юридический советник"

  requalification_risk_check:
    text: >
      Просим проверить {doc_names} на признаки скрытого создания юридического лица:
      штат, расчётный счёт «товарищества», вывеска, печать, постоянный офис.
      Просим обеспечить чёткую оговорку «без образования юридического лица»
      и отсутствие атрибутов юрлица в тексте договора.
    addressee: "Юридический советник"

  _default:
    text: >
      Просим предоставить дополнительную информацию по вопросу «{check_name}»
      применительно к {doc_names}.
    addressee: "Юридический советник"

