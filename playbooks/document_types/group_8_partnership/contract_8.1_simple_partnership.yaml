      store_payload: true

  - id: liability_and_regress_check
    name: "Ответственность товарищей и порядок регрессных требований"
    description: >
      Фактографическая проверка типа ответственности товарищей перед третьими
      лицами (солидарная при предпринимательской цели — п. 2 ст. 1047 ГК РФ;
      долевая при непредпринимательской — п. 1 ст. 1047 ГК РФ), очерёдности
      взыскания, порядка регрессных требований (п. 3 ст. 1047 + ст. 325 ГК РФ)
      и внутренних пропорций расчётов.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 50

    rules:
      keywords:
        - "солидарная ответственность"
        - "долевая ответственность"
        - "отвечают всем имуществом"
        - "отвечают в пределах вклада"
        - "регресс"
        - "регрессное требование"
        - "возмещение уплаченного"
        - "распределение ответственности"
        - "внутренние расчёты"
        - "ответственность перед третьими лицами"
        - "очерёдность взыскания"
        - "общее имущество товарищей"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)солидарн[а-яё]+\\s+ответственност"
        - "(?i)долев[а-яё]+\\s+ответственност"
        - "(?i)регресс"
        - "(?i)всем\\s+(своим\\s+)?имуществ"
        - "(?i)в\\s+пределах\\s+вклад"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор простого товарищества (ст. 1047 ГК РФ).
        Проверяется только один вопрос: ответственность товарищей перед
        третьими лицами и порядок регрессных требований.
        Нормативные ориентиры:
        - п. 1 ст. 1047 ГК РФ — при непредпринимательской цели товарищи
          отвечают по общим обязательствам ДОЛЕВО, каждый — в пределах
          своего вклада; очерёдность: сначала общее имущество, потом
          личное имущество товарища.
        - п. 2 ст. 1047 ГК РФ — при предпринимательской цели и участии
          хотя бы одного ИП/коммерческой организации товарищи отвечают
          СОЛИДАРНО всем своим личным имуществом.
        - п. 3 ст. 1047 ГК РФ — при солидарной ответственности дальнейшие
          отношения товарищей регулируются ст. 325 ГК РФ (регресс
          пропорционально долям).
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Отсутствие условия об ответственности — сам по себе факт;
          применяются императивные нормы ст. 1047 ГК РФ.
        - Различай: солидарная ответственность (всем имуществом) и
          долевая (в пределах вклада) — принципиально разные режимы.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Тип ответственности товарищей перед третьими лицами
           (солидарная / долевая / не указан).
        2. Прямое упоминание солидарной ответственности.
        3. Очерёдность взыскания (сначала общее имущество / сразу личное).
        4. Порядок регрессных требований между товарищами.
        5. Пропорции внутренних расчётов при регрессе.
        6. Наличие условий, отклоняющихся от императивных правил
           ст. 1047 ГК РФ.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Для enum-полей (liability_type_code, joint_and_several_mentioned,
           liability_deviations_code) при отсутствии данных возвращай
           "not_defined" / "not_detected".
        4. Для строковых *_details при отсутствии данных возвращай строго
           "Данные не определены".
        5. Не используй "None", "null", пустые строки или отсутствующие ключи.
        6. В evidence включай только прямые цитаты из текста договора.
        7. liability_type_code = "solidary" ТОЛЬКО если прямо написано о
           солидарной ответственности товарищей по общим обязательствам.
           liability_type_code = "share" ТОЛЬКО если прямо написано о долевой
           ответственности / ответственности в пределах вклада.
        8. liability_deviations_code = "detected" если в договоре есть условие,
           противоречащее императивным правилам ст. 1047 ГК РФ
           (например, установление долевой ответственности при
           предпринимательской цели с ИП/КО среди товарищей).
        9. Верни РОВНО один валидный JSON-объект со всеми 12 ключами
           (11 полей + evidence), пригодный для парсинга через json.loads
           без предварительной обработки. Без markdown, без ```json,
           без комментариев, без текста до или после. Начни ответ сразу
           с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — солидарная ответственность и регресс:
        Фрагмент:
        "Товарищи несут солидарную ответственность по общим обязательствам
        всем своим имуществом. Товарищ, исполнивший общее обязательство,
        вправе предъявить регрессное требование к остальным товарищам
        пропорционально их вкладам."
        Ответ:
        {
          "liability_type_code": "solidary",
          "liability_type_details": "солидарная ответственность по общим обязательствам всем имуществом",
          "joint_and_several_mentioned": "yes",
          "creditor_priority_status": "not_defined",
          "creditor_priority_details": "Данные не определены",
          "regress_procedure_status": "defined",
          "regress_procedure_details": "регресс к остальным товарищам пропорционально их вкладам",
          "internal_proportions_status": "defined",
          "internal_proportions_details": "пропорционально вкладам",
          "liability_deviations_code": "not_detected",
          "liability_deviations_details": "Данные не определены",
          "evidence": [
            {"clause_ref": "п. 5.1", "quote": "Товарищи несут солидарную ответственность по общим обязательствам всем своим имуществом."},
            {"clause_ref": "п. 5.2", "quote": "Товарищ, исполнивший общее обязательство, вправе предъявить регрессное требование к остальным товарищам пропорционально их вкладам."}
          ]
        }

        Пример 2 — долевая ответственность (edge-case, риск при предпринимательской цели):
        Фрагмент:
        "Товарищи несут долевую ответственность по общим обязательствам
        в пределах своих вкладов. Солидарная ответственность не применяется."
        Ответ:
        {
          "liability_type_code": "share",
          "liability_type_details": "долевая ответственность в пределах вкладов",
          "joint_and_several_mentioned": "no",
          "creditor_priority_status": "not_defined",
          "creditor_priority_details": "Данные не определены",
          "regress_procedure_status": "not_defined",
          "regress_procedure_details": "Данные не определены",
          "internal_proportions_status": "not_defined",
          "internal_proportions_details": "Данные не определены",
          "liability_deviations_code": "detected",
          "liability_deviations_details": "установление долевой ответственности в пределах вкладов — отклонение от императивных правил ст. 1047 ГК РФ при предпринимательской цели",
          "evidence": [
            {"clause_ref": "п. 5.1", "quote": "Товарищи несут долевую ответственность по общим обязательствам в пределах своих вкладов."},
            {"clause_ref": "п. 5.2", "quote": "Солидарная ответственность не применяется."}
          ]
        }

        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Стороны несут ответственность в соответствии с законодательством
        Российской Федерации."
        Ответ:
        {
          "liability_type_code": "not_defined",
          "liability_type_details": "Данные не определены",
          "joint_and_several_mentioned": "not_defined",
          "creditor_priority_status": "not_defined",
          "creditor_priority_details": "Данные не определены",
          "regress_procedure_status": "not_defined",
          "regress_procedure_details": "Данные не определены",
          "internal_proportions_status": "not_defined",
          "internal_proportions_details": "Данные не определены",
          "liability_deviations_code": "not_detected",
          "liability_deviations_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Все 12 ключей (11 полей + evidence) присутствуют в JSON?
        2. Найдена ли прямая цитата о типе ответственности?
        3. Определено ли прямое упоминание солидарной ответственности?
        4. Найдена ли очерёдность взыскания (общее / личное имущество)?
        5. Найден ли порядок регресса?
        6. Проверены ли условия, отклоняющиеся от ст. 1047 ГК РФ?
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "liability_type_code": "<solidary / share / not_defined>",
          "liability_type_details": "<текст или 'Данные не определены'>",
          "joint_and_several_mentioned": "<yes / no / not_defined>",
          "creditor_priority_status": "<defined / not_defined>",
          "creditor_priority_details": "<текст или 'Данные не определены'>",
          "regress_procedure_status": "<defined / not_defined>",
          "regress_procedure_details": "<текст или 'Данные не определены'>",
          "internal_proportions_status": "<defined / not_defined>",
          "internal_proportions_details": "<текст или 'Данные не определены'>",
          "liability_deviations_code": "<detected / not_detected>",
          "liability_deviations_details": "<описание отклонения или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 700

    retrieval:
      retrieval_profile: "liability_cap_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "солидарная ответственность долевая ответственность всем имуществом в пределах вклада регресс регрессное требование возмещение уплаченного распределение ответственности внутренние расчёты ответственность перед третьими лицами очерёдность взыскания общее имущество товарищей"
      preferred_unit_types:
        - liability_provision
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - technical_fragment
      preferred_clause_functions:
        - limitations
        - remedies
      negative_keywords:
        - "вклад"
        - "распределение прибыли"
        - "ведение дел"
        - "выход из товарищества"
        - "прекращение"
        - "налоговый учёт"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.40, 0.85]
        boost: 0.12
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "limitations"
        - "remedies"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1300

      compact_output: false

      presence_signal:
        field: "liability_and_regress_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора простого товарищества
        сведения об ответственности товарищей перед третьими лицами,
        очерёдности взыскания и порядке регрессных требований.
        Не анализируй вклады, прибыль, ведение дел или прекращение.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. liability_and_regress_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (liability_type_code, joint_and_several_mentioned,
              creditor_priority_status, regress_procedure_status,
              internal_proportions_status) ≠ "not_defined";
           - "missing" — если все пять содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - liability_type_code = "not_defined";
           - joint_and_several_mentioned = "not_defined";
           - creditor_priority_status = "not_defined";
           - regress_procedure_status = "not_defined";
           - internal_proportions_status = "not_defined";
           - liability_deviations_code = "not_detected";
           - все *_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. liability_type_code:
           Используй только одно из значений:
           - "solidary" — если прямо указана солидарная ответственность
             товарищей по общим обязательствам;
           - "share" — если прямо указана долевая ответственность
             или ответственность в пределах вклада;
           - "not_defined" — если тип ответственности прямо не указан.

        2. liability_type_details:
           Прямая цитата о типе ответственности.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        3. joint_and_several_mentioned:
           Используй только одно из значений:
           - "yes" — если в тексте прямо упоминается термин
             «солидарная ответственность»;
           - "no" — если прямо указано, что солидарная ответственность
             не применяется;
           - "not_defined" — если термин прямо не употребляется.

        4. creditor_priority_status:
           - "defined" — если прямо указана очерёдность взыскания
             кредитором (сначала общее имущество / сразу личное
             имущество товарищей);
           - "not_defined" — иначе.

        5. creditor_priority_details:
           Краткое user-facing описание очерёдности взыскания.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        6. regress_procedure_status:
           - "defined" — если прямо указан порядок регрессных требований
             между товарищами (кто, к кому, как);
           - "not_defined" — иначе.

        7. regress_procedure_details:
           Краткое user-facing описание порядка регресса.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        8. internal_proportions_status:
           - "defined" — если прямо указаны пропорции внутренних
             расчётов при регрессе (пропорционально вкладам, долям,
             иным образом);
           - "not_defined" — иначе.

        9. internal_proportions_details:
           Краткое user-facing описание пропорций.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        10. liability_deviations_code:
            Используй только одно из значений:
            - "detected" — если в договоре есть условие, отклоняющееся
              от императивных правил ст. 1047 ГК РФ (например, долевая
              ответственность при предпринимательской цели и участии
              ИП/КО среди товарищей);
            - "not_detected" — если такого условия в тексте нет.

        11. liability_deviations_details:
            Описание отклонения с дословной формулировкой.
            Если отклонений нет — "Данные не определены".
            Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни liability_and_regress_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не делай выводов по типовой структуре договора.
        - Не извлекай сведения о вкладах, распределении прибыли, ведении дел, выходе из товарищества, прекращении, налоговом учёте и иных нерелевантных темах.
        - liability_type_code = "solidary" только при прямом указании солидарной ответственности по общим обязательствам.
        - liability_type_code = "share" только при прямом указании долевой ответственности или ответственности в пределах вклада.
        - joint_and_several_mentioned фиксирует наличие самого термина «солидарная» — независимо от liability_type_code.
        - liability_deviations_code = "detected" при условии, противоречащем ст. 1047 ГК РФ (например, долевая ответственность при предпринимательской цели с ИП/КО среди товарищей).
        - Если в разных фрагментах указаны противоречивые сведения и конфликт нельзя разрешить по тексту — статус → "not_defined", текстовое поле → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни типа ответственности, ни упоминания солидарной
           ответственности, ни очерёдности взыскания, ни порядка регресса,
           ни пропорций.
           → presence = "missing";
             все *_status = "not_defined";
             liability_type_code = "not_defined";
             joint_and_several_mentioned = "not_defined";
             liability_deviations_code = "not_detected";
             все *_details = "Данные не определены".

        2. Неполное раскрытие или прямое исключение.
           а) Общая фраза: «Стороны несут ответственность в соответствии
              с законодательством РФ» без конкретики.
              → presence = "present";
                liability_type_code = "not_defined";
                regress_procedure_status = "not_defined".
           б) Прямо указано, что солидарная ответственность не применяется
              (и указана долевая).
              → presence = "present";
                liability_type_code = "share";
                joint_and_several_mentioned = "no".

        3. Противоречие между фрагментами.
           В разных частях договора указаны противоречивые типы
           ответственности или разные пропорции регресса.
           → presence = "unclear";
             liability_type_code = "not_defined";
             соответствующий *_details = "Не удалось определить".

        4. Специфика темы — отклонение от ст. 1047 ГК РФ.
           Установлена долевая ответственность при предпринимательской
           цели и участии ИП/КО среди товарищей.
           → presence = "present";
             liability_type_code = "share";
             liability_deviations_code = "detected";
             liability_deviations_details содержит дословную формулировку.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для liability_and_regress_check_presence используй только: "present", "missing", "unclear".
        - Для liability_type_code используй только: "solidary", "share", "not_defined".
        - Для joint_and_several_mentioned используй только: "yes", "no", "not_defined".
        - Для liability_deviations_code используй только: "detected", "not_detected".
        - Для enum-полей *_status используй только: "defined", "not_defined".
        - Fallback при отсутствии данных:
          * все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "liability_and_regress_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по ответственности и регрессу. Внутреннее агрегатное signal-поле."
          required: true

        - name: "liability_type_code"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Тип ответственности"
          allowed_values: ["solidary", "share", "not_defined"]
          description: "Тип ответственности товарищей перед третьими лицами (солидарная / долевая)."
          required: true

        - name: "liability_type_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Основание ответственности"
          description: "Прямая цитата о типе ответственности (для Drawer)."
          required: false

        - name: "joint_and_several_mentioned"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Прямое упоминание термина «солидарная ответственность»."
          required: false

        - name: "creditor_priority_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения очерёдности взыскания."
          required: false

        - name: "creditor_priority_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Очерёдность взыскания"
          description: "Порядок взыскания кредитором (сначала общее имущество / сразу личное)."
          required: false

        - name: "regress_procedure_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения порядка регресса."
          required: false

        - name: "regress_procedure_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Порядок регресса"
          description: "Порядок регрессных требований между товарищами."
          required: false

        - name: "internal_proportions_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения пропорций внутренних расчётов."
          required: false

        - name: "internal_proportions_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Пропорции расчётов"
          description: "Пропорции внутренних расчётов при регрессе (для Drawer)."
          required: false

        - name: "liability_deviations_code"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 4
          label: "Отклонения от ст. 1047"
          allowed_values: ["detected", "not_detected"]
          description: "Наличие условий, отклоняющихся от императивных правил ст. 1047 ГК РФ."
          required: false

        - name: "liability_deviations_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Описание отклонений"
          description: "Описание условий, отклоняющихся от ст. 1047 ГК РФ (для Drawer)."
          required: false

      store_payload: true

  - id: information_and_reporting_check
    name: "Право на информацию и отчётность (ст. 1045 ГК РФ)"
    description: >
      Фактографическая проверка условий о праве товарищей на информацию,
      периодичности отчётности, доступе к документации, праве на аудит
      и наличии ничтожных условий об отказе от права на информацию
      (п. 2 ст. 1045 ГК РФ).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 60

    rules:
      keywords:
        - "право на информацию"
        - "право знакомиться"
        - "отчётность"
        - "отчет ведущего дела"
        - "доступ к документации"
        - "первичные документы"
        - "бухгалтерская отчётность"
        - "ежеквартальный отчёт"
        - "аудит"
        - "аудиторская проверка"
        - "ознакомление"
        - "отказ от права на информацию"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)право\\s+на\\s+информаци"
        - "(?i)(право\\s+)?знакомит"
        - "(?i)отч[её]тност"
        - "(?i)аудит"
        - "(?i)отказ\\s+от\\s+права"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор простого товарищества (ст. 1045 ГК РФ).
        Проверяется только один вопрос: право на информацию, отчётность,
        доступ к документации, право на аудит.
        Нормативные ориентиры:
        - п. 1 ст. 1045 ГК РФ — каждый товарищ вправе знакомиться
          со всей документацией по ведению дел. Это право не может быть
          ограничено договором.
        - п. 2 ст. 1045 ГК РФ — отказ от этого права НЕ ИМЕЕТ СИЛЫ
          (ничтожен), в том числе если он включён в договор.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Отсутствие условий об отчётности — сам по себе факт;
          применяются императивные нормы ст. 1045 ГК РФ.
        - Условия, ограничивающие право товарища на информацию или
          устанавливающие отказ от него, ничтожны — фиксируй их наличие.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Признание права товарищей на информацию.
        2. Условия об ограничении права на информацию или об отказе
           от него (признак ничтожности по п. 2 ст. 1045 ГК РФ).
        3. Периодичность отчётности ведущего дела.
        4. Доступ к первичным документам.
        5. Право на аудит / аудиторскую проверку.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Для enum-полей (*_status) при отсутствии данных возвращай
           "not_defined"; для information_right_waiver — "not_detected".
        4. Для строковых *_details при отсутствии данных возвращай строго
           "Данные не определены".
        5. Не используй "None", "null", пустые строки или отсутствующие ключи.
        6. В evidence включай только прямые цитаты из текста договора.
        7. information_right_waiver = "detected" ТОЛЬКО если в договоре
           прямо ограничивается право товарища на информацию (например,
           доступ только с согласия ведущего дела, только по решению
           собрания, отказ товарища от права) или устанавливается отказ
           от него. Общее ограничение конфиденциальности — НЕ waiver.
        8. Верни РОВНО один валидный JSON-объект со всеми 10 ключами
           (9 полей + evidence), пригодный для парсинга через json.loads
           без предварительной обработки. Без markdown, без ```json,
           без комментариев, без текста до или после. Начни ответ сразу
           с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — право на информацию, отчёт и аудит определены:
        Фрагмент:
        "Каждый товарищ имеет право знакомиться со всей документацией
        по ведению общих дел. Ведущий дела представляет ежеквартальный
        отчёт с приложением первичных документов. Товарищи вправе
        привлекать независимого аудитора."
        Ответ:
        {
          "information_right_status": "defined",
          "information_right_details": "право знакомиться со всей документацией по ведению общих дел",
          "information_right_waiver": "not_detected",
          "reporting_frequency_status": "defined",
          "reporting_frequency_details": "ежеквартальный отчёт с приложением первичных документов",
          "document_access_status": "defined",
          "document_access_details": "доступ к первичным документам",
          "audit_right_status": "defined",
          "audit_right_details": "право привлекать независимого аудитора",
          "evidence": [
            {"clause_ref": "п. 6.1", "quote": "Каждый товарищ имеет право знакомиться со всей документацией по ведению общих дел."},
            {"clause_ref": "п. 6.2", "quote": "Ведущий дела представляет ежеквартальный отчёт с приложением первичных документов."},
            {"clause_ref": "п. 6.3", "quote": "Товарищи вправе привлекать независимого аудитора."}
          ]
        }

        Пример 2 — ничтожное условие об ограничении права на информацию:
        Фрагмент:
        "Товарищ вправе знакомиться с документацией товарищества только
        с письменного согласия ведущего дела. Товарищи отказываются
        от права на аудиторскую проверку."
        Ответ:
        {
          "information_right_status": "defined",
          "information_right_details": "право знакомиться с документацией только с письменного согласия ведущего дела",
          "information_right_waiver": "detected",
          "reporting_frequency_status": "not_defined",
          "reporting_frequency_details": "Данные не определены",
          "document_access_status": "defined",
          "document_access_details": "доступ только с письменного согласия ведущего дела",
          "audit_right_status": "defined",
          "audit_right_details": "отказ от права на аудит",
          "evidence": [
            {"clause_ref": "п. 6.1", "quote": "Товарищ вправе знакомиться с документацией товарищества только с письменного согласия ведущего дела."},
            {"clause_ref": "п. 6.4", "quote": "Товарищи отказываются от права на аудиторскую проверку."}
          ]
        }

        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Стороны обязуются исполнять договор."
        Ответ:
        {
          "information_right_status": "not_defined",
          "information_right_details": "Данные не определены",
          "information_right_waiver": "not_detected",
          "reporting_frequency_status": "not_defined",
          "reporting_frequency_details": "Данные не определены",
          "document_access_status": "not_defined",
          "document_access_details": "Данные не определены",
          "audit_right_status": "not_defined",
          "audit_right_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Все 10 ключей (9 полей + evidence) присутствуют в JSON?
        2. Найдена ли прямая цитата о праве на информацию?
        3. Проверено ли наличие условий об ограничении / отказе
           от права на информацию (п. 2 ст. 1045 ГК РФ)?
        4. Найдена ли периодичность отчётности?
        5. Найден ли доступ к документам?
        6. Найдено ли право на аудит?
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "information_right_status": "<defined / not_defined>",
          "information_right_details": "<текст или 'Данные не определены'>",
          "information_right_waiver": "<detected / not_detected>",
          "reporting_frequency_status": "<defined / not_defined>",
          "reporting_frequency_details": "<текст или 'Данные не определены'>",
          "document_access_status": "<defined / not_defined>",
          "document_access_details": "<текст или 'Данные не определены'>",
          "audit_right_status": "<defined / not_defined>",
          "audit_right_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 700

    retrieval:
      retrieval_profile: "notice_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "право на информацию право знакомиться отчётность отчет ведущего дела доступ к документации первичные документы бухгалтерская отчётность ежеквартальный отчёт аудит аудиторская проверка ознакомление отказ от права на информацию ограничение права на информацию"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "вклад"
        - "распределение прибыли"
        - "выход из товарищества"
        - "прекращение"
        - "налоговый учёт"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.35, 0.75]
        boost: 0.12
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 550

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1200

      compact_output: false

      presence_signal:
        field: "information_and_reporting_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора простого товарищества
        сведения о праве на информацию, отчётности, доступе к документации,
        праве на аудит и наличии условий об отказе от права на информацию.
        Не анализируй вклады, прибыль, ведение дел или прекращение.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. information_and_reporting_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (information_right_status, reporting_frequency_status,
              document_access_status, audit_right_status) ≠ "not_defined";
           - "missing" — если все четыре содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - information_right_status = "not_defined";
           - reporting_frequency_status = "not_defined";
           - document_access_status = "not_defined";
           - audit_right_status = "not_defined";
           - information_right_waiver = "not_detected";
           - все *_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. information_right_status:
           - "defined" — если прямо указано право товарищей знакомиться
             со всей документацией по ведению общих дел;
           - "not_defined" — иначе.

        2. information_right_details:
           Краткое user-facing описание условия о праве на информацию.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        3. information_right_waiver:
           Используй только одно из значений:
           - "detected" — если в договоре прямо ограничивается право
             товарища на информацию (доступ только с согласия ведущего
             дела, только по решению собрания) или устанавливается
             отказ от права (ничтожно по п. 2 ст. 1045 ГК РФ);
           - "not_detected" — если такого условия в тексте нет.

        4. reporting_frequency_status:
           - "defined" — если прямо указана периодичность отчётности
             ведущего дела (ежемесячно, ежеквартально, по требованию);
           - "not_defined" — иначе.

        5. reporting_frequency_details:
           Краткое user-facing описание периодичности отчётности.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        6. document_access_status:
           - "defined" — если прямо указан доступ к первичным документам
             (кто, как, когда);
           - "not_defined" — иначе.

        7. document_access_details:
           Краткое user-facing описание доступа к документам.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        8. audit_right_status:
           - "defined" — если прямо указано право товарищей на аудит
             или аудиторскую проверку;
           - "not_defined" — иначе.

        9. audit_right_details:
           Краткое user-facing описание права на аудит.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни information_and_reporting_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не делай выводов по типовой структуре договора.
        - Не извлекай сведения о вкладах, распределении прибыли, ведении дел (кроме отчётности), выходе из товарищества, прекращении, налоговом учёте и иных нерелевантных темах.
        - information_right_waiver = "detected" только при прямом ограничении права товарища на информацию или отказе от него (доступ только с согласия ведущего дела, только по решению собрания, отказ от аудита).
        - Общее условие конфиденциальности НЕ является waiver.
        - Если в разных фрагментах указаны противоречивые сведения и конфликт нельзя разрешить по тексту — статус → "not_defined", текстовое поле → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни права на информацию, ни отчётности,
           ни доступа к документам, ни права на аудит.
           → presence = "missing";
             все *_status = "not_defined";
             information_right_waiver = "not_detected";
             все *_details = "Данные не определены".

        2. Неполное раскрытие или прямое исключение.
           а) Общая фраза: «Товарищи вправе получать информацию
              о деятельности товарищества» без конкретики по объёму,
              периодичности и доступу.
              → presence = "present";
                information_right_status = "defined";
                reporting_frequency_status = "not_defined".
           б) Прямо указано, что товарищи отказываются от права
              на информацию или право ограничено.
              → presence = "present";
                information_right_waiver = "detected";
                соответствующие *_details содержат дословную формулировку.

        3. Противоречие между фрагментами.
           В разных частях договора указаны противоречивые условия
           о доступе к информации (полный доступ / доступ с ограничениями).
           → presence = "unclear";
             information_right_status = "not_defined";
             information_right_details = "Не удалось определить".

        4. Специфика темы — ничтожное ограничение права.
           Право на информацию ограничено условием (например, доступ
           только с согласия ведущего дела).
           → presence = "present";
             information_right_status = "defined";
             information_right_waiver = "detected";
             information_right_waiver_details содержит дословную
             формулировку ограничения.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для information_and_reporting_check_presence используй только: "present", "missing", "unclear".
        - Для enum-полей *_status используй только: "defined", "not_defined".
        - Для information_right_waiver используй только: "detected", "not_detected".
        - Fallback при отсутствии данных:
          * все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "information_and_reporting_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по праву на информацию и отчётности. Внутреннее агрегатное signal-поле."
          required: true

        - name: "information_right_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус признания права на информацию."
          required: true

        - name: "information_right_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Право на информацию"
          description: "Условие о праве товарищей на информацию."
          required: true

        - name: "information_right_waiver"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Ограничение права"
          allowed_values: ["detected", "not_detected"]
          description: "Наличие ничтожного условия об ограничении / отказе от права на информацию (п. 2 ст. 1045 ГК РФ)."
          required: false

        - name: "reporting_frequency_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения периодичности отчётности."
          required: false

        - name: "reporting_frequency_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Периодичность отчётности"
          description: "Периодичность представления отчётов."
          required: false

        - name: "document_access_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус доступа к документации."
          required: false

        - name: "document_access_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 4
          label: "Доступ к документам"
          description: "Условие о доступе к первичным документам."
          required: false

        - name: "audit_right_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус права на аудит."
          required: false

        - name: "audit_right_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 5
          label: "Право на аудит"
          description: "Условие о праве на аудит."
          required: false

      store_payload: true

  - id: common_property_check
    name: "Режим общей долевой собственности (ст. 1043 ГК РФ)"
    description: >
      Фактографическая проверка режима общего имущества товарищей,
      отклонений от презумпции общей долевой собственности (п. 1 ст. 1043
      ГК РФ), способа определения долей, порядка распоряжения и пользования
      общим имуществом, а также государственной регистрации права
      на недвижимое имущество.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 70

    rules:
      keywords:
        - "общая долевая собственность"
        - "общее имущество"
        - "общее имущество товарищей"
        - "доля в общем имуществе"
        - "распоряжение общим имуществом"
        - "пользование общим имуществом"
        - "определение долей"
        - "преимущественное право покупки"
        - "отчуждение доли"
        - "государственная регистрация права"
        - "внесённое имущество"
        - "имущество, переданное в пользование"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)общ[а-яё]+\\s+долев[а-яё]+\\s+собственност"
        - "(?i)общ[ео]е\\s+имуществ"
        - "(?i)дол[яю]\\s+в\\s+общ"
        - "(?i)(гос|государственн)[а-яё]*\\s+регистрац"
        - "(?i)преимущественн[а-яё]+\\s+прав"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор простого товарищества (ст. 1043 ГК РФ).
        Проверяется только один вопрос: режим общего имущества товарищей,
        доли, распоряжение и пользование.
        Нормативные ориентиры:
        - п. 1 ст. 1043 ГК РФ — внесённое товарищами имущество, которым
          они обладали на праве собственности, а также продукция и доходы
          признаются их ОБЩЕЙ ДОЛЕВОЙ собственностью, если иное не
          установлено законом, договором или не следует из существа
          обязательства.
        - п. 2 ст. 1043 ГК РФ — имущество, внесённое по иным основаниям
          (аренда, лизинг), используется в интересах всех товарищей
          и составляет их общее имущество; ведение учёта может быть
          поручено одному из товарищей — юридических лиц.
        - ст. 245 ГК РФ — доли presumed равными, если не установлено иное.
        - ст. 246 ГК РФ — распоряжение общим имуществом по соглашению всех.
        - ст. 250 ГК РФ — преимущественное право покупки доли.
        - ст. 131 ГК РФ, 218-ФЗ — госрегистрация права на недвижимость.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Отклонение от презумпции общей долевой собственности — допустимо,
          но должно быть явным.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Режим общего имущества: общая долевая собственность / иное.
        2. Отклонения от презумпции общей долевой собственности.
        3. Способ определения долей (пропорционально вкладам / иной).
        4. Порядок распоряжения общим имуществом.
        5. Порядок пользования общим имуществом.
        6. Необходимость государственной регистрации права
           (для недвижимого имущества).

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Для enum-полей (*_status, common_property_regime_code,
           regime_deviations_code) при отсутствии данных возвращай
           "not_defined" (для regime_deviations_code — "not_detected").
        4. Для строковых *_details при отсутствии данных возвращай строго
           "Данные не определены".
        5. Не используй "None", "null", пустые строки или отсутствующие ключи.
        6. В evidence включай только прямые цитаты из текста договора.
        7. common_property_regime_code = "share" ТОЛЬКО если прямо указана
           общая долевая собственность. "single_owner" — если имущество
           в собственности одного товарища. "other" — иной режим
           (совместная собственность, долевая с иными правилами).
        8. regime_deviations_code = "detected" если договором установлено
           отклонение от презумпции общей долевой собственности
           (п. 1 ст. 1043 ГК РФ), например, имущество закрепляется
           за одним товарищем или передаётся в пользование другим.
        9. state_registration_status = "defined" ТОЛЬКО если в договоре
           прямо упоминается государственная регистрация права
           на недвижимое имущество (или указано на недвижимость во вкладе).
        10. Верни РОВНО один валидный JSON-объект со всеми 13 ключами
            (12 полей + evidence), пригодный для парсинга через json.loads
            без предварительной обработки. Без markdown, без ```json,
            без комментариев, без текста до или после. Начни ответ сразу
            с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — стандартный режим общей долевой собственности:
