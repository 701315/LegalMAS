          required: false
        - name: "contribution_deadline_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус сроков внесения вкладов."
          required: false
        - name: "contribution_deadline_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
