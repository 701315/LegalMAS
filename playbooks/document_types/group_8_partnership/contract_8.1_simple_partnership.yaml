    triggers: {}
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "принятие нового товарища"
        - "требуется единогласное решение"
        - "оценка вклада нового участника"
        - "изменение долей"
      keyword_mode: "any"
      regex_patterns: []
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор простого товарищества.
        Проверь порядок принятия новых товарищей.

        Ответь строго в JSON:
        {
          "admission_allowed": "<yes / no / unclear>",
          "unanimous_consent_required": "<yes / no / unclear>",
          "valuation_of_new_contribution": "<yes / no / unclear>"
        }

        Если значение явно не указано — пиши "not_found".
      prompt_file: null
      context_k: 5
      temperature: 0.0
      max_tokens: 300
    retrieval:
      context_k: 5
      max_chunks: 6
      boost_keywords:
        - "принятие"
        - "новый товарищ"
        - "единогласие"
      rerank: true
      filters: {}
    evidence:
      required: false
      min_snippet_length: 30
      max_snippet_length: 400
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "admission_allowed"
          type: "string"
          allowed_values: ["yes", "no", "unclear"]
          description: "Возможность принятия новых товарищей"
      store_payload: true

  - id: tax_accounting_coordination
    name: "Согласование налогового и бухгалтерского учёта"
    description: |
      Каждый товарищ учитывает свою долю на своём балансе.
      Риск двойного налогообложения при разных режимах.
    triggers:
      any: ["tax_coordination_required"]
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "налоговый учёт"
        - "бухгалтерский учёт"
        - "документооборот"
        - "распределение налоговых обязательств"
        - "отчётность товарищества"
      keyword_mode: "any"
      regex_patterns: []
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор простого товарищества.
        Проверь условия о налоговом учёте.

        Ответь строго в JSON:
        {
          "tax_coordination": "<yes / no>",
          "unified_accounting_rules": "<yes / no / unclear>",
          "managing_partner_accounting": "<yes / no / unclear>"
        }

        ВАЖНО: Риск двойного налогообложения при разных режимах (НК РФ ст. 278).
        Если значение явно не указано — пиши "not_found".
      prompt_file: null
      context_k: 5
      temperature: 0.0
      max_tokens: 300
    retrieval:
      context_k: 5
      max_chunks: 6
      boost_keywords:
        - "налоговый учёт"
        - "согласование"
        - "отчётность"
      rerank: true
      filters: {}
    evidence:
      required: false
      min_snippet_length: 30
      max_snippet_length: 400
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "tax_coordination"
          type: "string"
          allowed_values: ["yes", "no"]
          description: "Наличие согласования налогового учёта"
      store_payload: true

  - id: common_property_regime_check
    name: "Режим общей долевой собственности (ст. 1043 ГК РФ)"
    description: |
      Проверяет порядок формирования общего имущества, определение долей,
      распоряжение общим имуществом, порядок пользования.
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "общая долевая собственность"
        - "общее имущество"
        - "доля в общем имуществе"
        - "распоряжение общим имуществом"
        - "пользование общим имуществом"
      keyword_mode: "any"
      regex_patterns: []
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор простого товарищества.
        Проверь режим общей собственности.

        Ответь строго в JSON:
        {
          "common_property_regime": "<common_share / specified / not_found>",
          "shares_determination": "<proportional_to_contributions / equal / custom / not_found>",
          "disposal_procedure": "<unanimous / majority / managing_partner / not_found>",
          "property_snippet": "<цитата или not_found>"
        }

        ВАЖНО: Имущество товарищества — общая долевая собственность (ст. 1043 ГК РФ).
        Если значение явно не указано — пиши "not_found".
      prompt_file: null
      context_k: 6
      temperature: 0.0
      max_tokens: 400
    retrieval:
      context_k: 6
      max_chunks: 8
      boost_keywords:
        - "общее имущество"
        - "долевая собственность"
        - "распоряжение"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "common_property_regime"
          type: "string"
          allowed_values: ["common_share", "specified", "not_found"]
          keyword_hints: ["общая долевая", "общее имущество"]
          description: "Режим общей собственности"
      store_payload: true

  - id: requalification_risk_check
    name: "Риск переквалификации в создание юридического лица"
    description: |
      Проверяет наличие признаков скрытого создания юрлица:
      постоянный персонал, вывеска, расчётный счёт «товарищества»,
      общее имущество без раздела по долям.
    triggers: {}
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "штат сотрудников товарищества"
        - "расчётный счёт товарищества"
        - "вывеска"
        - "офис товарищества"
        - "печать товарищества"
        - "юридическое лицо"
      keyword_mode: "any"
      negative_keywords:
        - "без образования юридического лица"
      regex_patterns: []
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор простого товарищества.
        Проверь наличие признаков скрытого создания юридического лица.

        Ответь строго в JSON:
        {
          "requalification_risk_level": "<high / medium / low / none>",
          "risk_factors": ["<перечень факторов>"],
          "no_legal_entity_clause": "<yes / no / not_found>"
        }

        Факторы риска: наличие штата, расчётного счёта «товарищества»,
        вывески, печати, постоянного офиса, неразделённого имущества.
        Если значение явно не указано — пиши "not_found".
      prompt_file: null
      context_k: 6
      temperature: 0.0
      max_tokens: 400
    retrieval:
      context_k: 6
      max_chunks: 8
      boost_keywords:
        - "юридическое лицо"
        - "без образования"
        - "штат"
        - "счёт"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "requalification_risk_level"
          type: "string"
          allowed_values: ["high", "medium", "low", "none"]
          description: "Уровень риска переквалификации"
      store_payload: true

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 6: DOC_TYPE_CHECKS — авто-конвертируемые проверки (rules)
