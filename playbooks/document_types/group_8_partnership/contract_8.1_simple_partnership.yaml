        - pattern: "(?i)солидарн[аяое]\\s+ответственност[ьи]"
          weight: 0.9
          distinctiveness: high
          context: any
          description: "Солидарная ответственность товарищей по общим обязательствам"

        - pattern: "(?i)ст\\.\\s*1041\\s+гк\\s+рф"
