        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Все 13 ключей (12 полей + evidence) присутствуют в JSON?
        2. Найдена ли прямая цитата о режиме общего имущества?
        3. Проверено ли наличие отклонений от презумпции
           общей долевой собственности?
        4. Найден ли способ определения долей?
        5. Найден ли порядок распоряжения и пользования?
        6. Упомянута ли государственная регистрация права
           (для недвижимости)?
