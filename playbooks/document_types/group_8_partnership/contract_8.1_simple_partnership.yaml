    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 140

    rules:
      keywords:
        - "выдел доли"
        - "кредитор товарища"
        - "личный кредитор"
        - "обращение взыскания"
        - "выдел доли в натуре"
        - "денежная компенсация доли"
        - "преимущественное право выкупа"
        - "субсидиарная ответственность товарищей"
        - "стоимость доли"
        - "публичные торги"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)выдел[а-яё]*\\s+дол[ия]"
        - "(?i)(обращени[ея]|взыскани[ея])[а-яё]*\\s+на\\s+дол"
        - "(?i)преимущественн[а-яё]+\\s+прав"
        - "(?i)субсидиарн[а-яё]+\\s+ответственност"

    llm:
