          без комментариев, без текста до или после. Начни ответ сразу
          с { и закончи }.
        </rules>

        <cove>
        1. Все 16 ключей (15 полей + evidence) присутствуют в JSON?
        2. withdrawal_regime_code — строго из allowed_values?
        3. property_return_regime — строго из allowed_values?
        4. Все *_status — строго "defined" / "not_defined"?
        5. Все *_details заполнены или "Данные не определены"?
        Не выводи шаги. Верни только JSON.
        </cove>
