    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1500
      compact_output: false
      store_payload: true
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора простого товарищества
        сведения о порядке изменения договора: правило, форма, регистрация,
        последствия отказа, запрет одностороннего изменения.
        Не анализируй вклады как таковые, распределение прибыли, налоговый
        учёт или прекращение товарищества.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 10 полей + evidence (всего 11 ключей):
        1. amendment_procedure_status — "defined" или "not_defined".
        2. amendment_procedure_details — порядок изменения договора.
        3. amendment_rule — "unanimous" / "qualified_majority" /
           "simple_majority" / "not_defined".
        4. amendment_form_requirement_status — "defined" или "not_defined".
        5. amendment_form_requirement_details — форма изменений
           (письменная / нотариальная / иная).
        6. amendment_registration_status — "defined" или "not_defined".
        7. amendment_registration_details — порядок государственной
           регистрации изменений.
        8. amendment_refusal_consequences_status — "defined" или "not_defined".
        9. amendment_refusal_consequences_details — последствия отказа
           от подписания.
        10. unilateral_amendment_prohibition — "detected" если установлен
            запрет одностороннего изменения; иначе "not_detected".

        Если данные отсутствуют:
        - для *_status: "not_defined"
        - для amendment_rule: "not_defined"
        - для unilateral_amendment_prohibition: "not_detected"
        - для *_details: "Данные не определены"
        </task>

        <rules>
        - Используй только текст договора.
        - amendment_form_requirement_details: письменная / нотариальная
          форма; если указано "в той же форме" — фиксируй форму
          из договора.
        - amendment_registration_details: для недвижимости (218-ФЗ),
          для инвесттоварищества (ЕГРЮЛ по 335-ФЗ).
        - Верни РОВНО один валидный JSON-объект со всеми 11 ключами
          (10 полей + evidence), пригодный для парсинга через json.loads
          без предварительной обработки. Без markdown, без ```json,
          без комментариев, без текста до или после. Начни ответ сразу
          с { и закончи }.
        </rules>

        <cove>
        1. Все 11 ключей (10 полей + evidence) присутствуют в JSON?
        2. amendment_rule — строго из allowed_values?
        3. Все *_status — строго "defined" / "not_defined"?
        4. unilateral_amendment_prohibition — строго "detected" / "not_detected"?
        5. Все *_details заполнены или "Данные не определены"?
        Не выводи шаги. Верни только JSON.
        </cove>
      fields:
        - name: "amendment_procedure_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения порядка изменения договора."
          required: true
        - name: "amendment_procedure_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Порядок изменения"
          description: "Порядок изменения договора простого товарищества."
          required: true
        - name: "amendment_rule"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
