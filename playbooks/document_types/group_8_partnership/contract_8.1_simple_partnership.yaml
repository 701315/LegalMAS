        - "неразглашение"
        - "коммерческая тайна"
        - "не подлежит разглашению"
      keyword_mode: "any"
      regex_patterns: []

  - id: "contract_term"
    name: "Срок действия договора"
    description: "Бессрочный или срочный — влияет на порядок выхода"
    legal_base: "ст. 1050, 1051 ГК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
