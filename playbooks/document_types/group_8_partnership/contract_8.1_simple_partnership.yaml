          distinctiveness: high
          context: header
          description: "Основное название договора простого товарищества"

        - pattern: "(?i)договор\\s+прост[огоой]\\s+товариществ[аы]"
          weight: 1.0
          distinctiveness: high
          context: header
          description: "Формула заголовка «Договор простого товарищества»"

        - pattern: "(?i)совместн[аяое]\\s+деятельност[ьи]"
