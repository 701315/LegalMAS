          label: "Санкции за нарушение"
          description: "Санкции за нарушение запрета конкуренции (для Drawer)."
          required: false
        - name: "conflict_disclosure_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус порядка раскрытия конфликта интересов."
          required: false
        - name: "conflict_disclosure_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 4
          label: "Раскрытие конфликта"
