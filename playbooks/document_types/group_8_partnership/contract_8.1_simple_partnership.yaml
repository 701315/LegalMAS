          required: false

  - id: tax_accounting_check
    name: "Налоговый и бухгалтерский учёт товарищества (ст. 278 НК РФ)"
    description: >
      Фактографическая проверка условий о налоговом режиме товарищей,
      лице, ведущем налоговый учёт (п. 1 ст. 278 НК РФ), отдельном балансе
      общего имущества (п. 2 ст. 1043 ГК РФ), порядке учёта НДС
      (ст. 174.1, п. 3 ст. 170 НК РФ), распределении налоговой базы
      (п. 2–4 ст. 278 НК РФ) и документообороте.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 110

    rules:
      keywords:
        - "налоговый учёт"
        - "бухгалтерский учёт"
        - "отдельный баланс"
        - "общее имущество товарищей"
        - "документооборот"
        - "распределение налоговых обязательств"
        - "налоговая база"
        - "отчётность товарищества"
        - "кто ведёт учёт"
        - "налоговый режим"
        - "общая система налогообложения"
        - "упрощённая система налогообложения"
        - "НДС"
        - "счёт-фактура"
        - "восстановление НДС"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)налогов[ыо]й\\s+уч[её]т"
        - "(?i)бухгалтерск[иоя]+\\s+уч[её]т"
        - "(?i)отдельн[ыо]+\\s+баланс"
        - "(?i)(ОСН|УСН|ЕСХН|НДС)"
        - "(?i)(счёт|счет)-фактур"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор простого товарищества (ст. 278 НК РФ,
        п. 2 ст. 1043 ГК РФ).
        Проверяется только один вопрос: налоговый и бухгалтерский учёт
        товарищества.
        Нормативные ориентиры:
        - п. 1 ст. 278 НК РФ — налоговый учёт ведёт участник, на которого
          возложено ведение дел товарищества.
        - п. 2 ст. 278 НК РФ — налоговая база определяется ведущим дела
          нарастающим итогом.
        - п. 3 ст. 278 НК РФ — прибыль распределяется между участниками
          пропорционально их вкладам, если иное не установлено договором.
        - п. 4 ст. 278 НК РФ — убытки НЕ распределяются между участниками.
        - п. 2 ст. 1043 ГК РФ — учёт общего имущества может быть поручен
          одному из участников-юридических лиц (отдельный баланс).
        - ст. 174.1 НК РФ — при ведении общего дела НДС исчисляется
          ведущим дела; счёт-фактуры выставляются от его имени.
        - п. 3 ст. 170 НК РФ — при передаче имущества в качестве вклада
          в простое товарищество НДС подлежит ВОССТАНОВЛЕНИЮ
          у передающей стороны.
        - п. 4 ст. 346.13 НК РФ — при наличии участника на ОСН остальные
          участники на УСН теряют право на спецрежим.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Участники товарищества уплачивают налоги САМОСТОЯТЕЛЬНО;
          «налоговых обязательств товарищества» как отдельного субъекта нет.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Кто ведёт налоговый / бухгалтерский учёт.
        2. Налоговый режим товарищей (ОСН / УСН / смешанный).
        3. Наличие отдельного баланса общего имущества.
        4. Порядок учёта НДС (кто выставляет счёт-фактуры, восстановление
           НДС при вкладе).
        5. Распределение налоговой базы между товарищами.
        6. Документооборот товарищества.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Для enum-полей (*_status, tax_regime_code) при отсутствии данных
           возвращай "not_defined".
