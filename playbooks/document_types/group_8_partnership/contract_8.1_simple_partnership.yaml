  - id: requalification_risk_check
    name: "Признаки скрытого создания юридического лица (риск переквалификации)"
    description: >
      Фактографическая проверка наличия в договоре признаков скрытого
      создания юридического лица: штат/персонал «товарищества», расчётный
      счёт на имя «товарищества», вывеска/офис/печать товарищества,
      отдельный баланс общего имущества как единого целого.
      Указание «без образования юридического лица» фиксируется
      в partnership_subject_extraction и здесь не дублируется.
      Признаки сопоставляются с практикой ФНС (ст. 54.1 НК РФ),
      доктриной мнимой сделки (ст. 170 ГК РФ) и составом ст. 173.1 УК РФ.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 130

    rules:
      keywords:
        - "штат сотрудников товарищества"
        - "персонал товарищества"
        - "работники товарищества"
        - "расчётный счёт товарищества"
        - "счёт товарищества"
        - "вывеска"
        - "офис товарищества"
        - "помещение товарищества"
        - "печать товарищества"
        - "отдельный баланс"
        - "обособленное имущество"
        - "органы управления товарищества"
        - "товарищество как единое целое"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)штат[а-яё]*\\s+(сотрудник|работник)"
        - "(?i)(расч[её]тн[ыо]й|банковск[ио]й)\\s+сч[её]т\\s+товарищ"
        - "(?i)(вывеск|офис|печат)[а-яё]*\\s+товарищ"
        - "(?i)отдельн[ыо]+\\s+баланс"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор простого товарищества.
        Проверяется только один вопрос: признаки скрытого создания
        юридического лица (риск переквалификации).
        Нормативные ориентиры:
        - п. 1 ст. 1041 ГК РФ — простое товарищество действует
          БЕЗ образования юридического лица.
        - ст. 2 ФЗ №129-ФЗ «О государственной регистрации юридических
          лиц» — ЮЛ подлежит госрегистрации; деятельность без регистрации
          как ЮЛ при наличии его признаков создаёт риски.
        - ст. 170 ГК РФ — мнимая сделка (если договор прикрывает
          фактически созданное ЮЛ).
        - ст. 54.1 НК РФ — неправомерная налоговая выгода (признаки
          «дробления бизнеса» через ПТ).
        - ст. 173.1 УК РФ — незаконное создание юридического лица.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Этот check фиксирует признаки; квалификация договора
          и вывод о переквалификации — вне его скоупа.
        - Признаки ЮЛ (по практике ФНС / судов): обособленное имущество,
          отдельный баланс, собственные органы, печать, собственный
          счёт, штат, вывеска/офис, длительное существование как целого.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Упоминание штата / персонала / работников «товарищества»
           как единого целого.
        2. Упоминание расчётного / банковского счёта на имя
           «товарищества».
        3. Упоминание вывески / офиса / печати «товарищества».
        4. Упоминание отдельного баланса / обособленного имущества
           товарищества как единого целого.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Для enum-полей (staff_mention_status, bank_account_mention_status,
           office_signage_mention_status, separate_balance_mention_status)
           при отсутствии данных возвращай "not_detected".
        4. Для строковых *_details при отсутствии данных возвращай строго
           "Данные не определены".
        5. Не используй "None", "null", пустые строки или отсутствующие
           ключи.
        6. В evidence включай только прямые цитаты из текста договора.
        7. *__mention_status = "detected" ТОЛЬКО если признак упоминается
           применительно к «товариществу» как единому целому, а не
           к отдельному товарищу. Например, «расчётный счёт Товарища 1» —
           НЕ признак ЮЛ; «расчётный счёт товарищества» — признак.
        8. Признак, упомянутый только для отдельного товарища, фиксируется
           в *_details со значением "не применимо: относится к отдельному
           товарищу", но status = "not_detected".
        9. Верни РОВНО один валидный JSON-объект со всеми 9 ключами
           (8 полей + evidence), пригодный для парсинга через json.loads
           без предварительной обработки. Без markdown, без ```json,
           без комментариев, без текста до или после. Начни ответ сразу
           с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — признаков ЮЛ нет (счёт на имя отдельного товарища):
        Фрагмент:
        "Стороны действуют без образования юридического лица.
        В целях исполнения договора Товарищ 1 открывает расчётный счёт
        на своё имя."
        Ответ:
        {
          "staff_mention_status": "not_detected",
