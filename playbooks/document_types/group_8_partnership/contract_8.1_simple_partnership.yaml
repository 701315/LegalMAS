        Проверяется только один вопрос: режим общей долевой собственности.
        Важно:
        - Имущество товарищества — общая долевая собственность (ст. 1043 ГК РФ).
        [ЗАДАЧА]
        Найди в тексте договора:
        1. Указание на режим общей долевой собственности.
        2. Способ определения долей.
        3. Порядок распоряжения общим имуществом.
        4. Порядок пользования общим имуществом.
        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если данные не указаны — "not_defined" / "Данные не определены".
        3. В evidence — только текст договора.
        4. Верни только один JSON-объект.
