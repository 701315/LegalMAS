        [ЗАДАЧА]
        Найди в тексте договора:
        1. Порядок принятия новых товарищей.
        2. Требуется ли единогласие для приёма.
        3. Наличие запрета конкурирующей деятельности.
        4. Порядок раскрытия конфликта интересов.
        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если данные не указаны — "not_defined" / "Данные не определены".
        3. В evidence — только текст договора.
        4. Верни только один JSON-объект.
        [ПРИМЕРЫ (FEW-SHOT)]
