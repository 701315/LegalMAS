  - id: requalification_risk_check
    name: "Риск переквалификации в создание юридического лица"
    description: >
      Фактографическая проверка наличия в договоре признаков скрытого создания
      юридического лица: постоянный персонал, вывеска, расчётный счёт
      «товарищества», общее имущество без раздела по долям.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "штат сотрудников товарищества"
        - "расчётный счёт товарищества"
        - "вывеска"
        - "офис товарищества"
        - "печать товарищества"
        - "юридическое лицо"
        - "без образования юридического лица"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)штат\\s+сотрудник"
        - "(?i)расч[её]тн[ыо]й\\s+сч[её]т"
        - "(?i)без\\s+образован[ияи]\\s+юридическ"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор простого товарищества.
        Проверяется только один вопрос: признаки скрытого создания юридического лица.
        Важно:
        - Простое товарищество действует БЕЗ образования юридического лица.
        - Наличие штата, счёта, вывески «товарищества» — факторы риска.
        [ЗАДАЧА]
        Найди в тексте договора:
        1. Прямое указание «без образования юридического лица».
        2. Упоминание штата/персонала товарищества.
        3. Упоминание расчётного счёта «товарищества».
        4. Упоминание вывески/офиса/печати товарищества.
        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если данные не указаны — "not_defined" / "Данные не определены".
        3. В evidence — только текст договора.
        4. Верни только один JSON-объект.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1:
        Фрагмент:
        "Стороны действуют без образования юридического лица. В целях
        исполнения договора Товарищ 1 открывает расчётный счёт на своё имя."
        Ответ:
        {
          "no_legal_entity_clause_status": "defined",
          "no_legal_entity_clause_details": "без образования юридического лица",
          "staff_mention_status": "not_defined",
          "bank_account_mention_status": "defined",
          "bank_account_mention_details": "расчётный счёт на имя Товарища 1",
          "office_signage_mention_status": "not_defined",
          "evidence": [
            {
              "clause_ref": "п. 1.3",
              "quote": "Стороны действуют без образования юридического лица."
            }
          ]
        }
        Пример 2:
        Фрагмент:
        "Товарищество имеет штат из 10 сотрудников, собственный офис
        и расчётный счёт на имя товарищества."
        Ответ:
        {
          "no_legal_entity_clause_status": "not_defined",
          "no_legal_entity_clause_details": "Данные не определены",
          "staff_mention_status": "defined",
          "bank_account_mention_status": "defined",
          "bank_account_mention_details": "расчётный счёт на имя товарищества",
          "office_signage_mention_status": "defined",
          "evidence": [
            {
              "clause_ref": "п. 1.5",
              "quote": "Товарищество имеет штат из 10 сотрудников, собственный офис и расчётный счёт."
            }
          ]
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату «без образования юридического лица».
        2. Найди прямую цитату о штате.
        3. Найди прямую цитату о расчётном счёте.
        4. Найди прямую цитату о вывеске/офисе.
        5. Если прямой цитаты нет — верни "not_defined".
        Не выводи шаги. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "no_legal_entity_clause_status": "<defined / not_defined>",
          "no_legal_entity_clause_details": "<текст или 'Данные не определены'>",
          "staff_mention_status": "<defined / not_defined>",
          "bank_account_mention_status": "<defined / not_defined>",
          "bank_account_mention_details": "<текст или 'Данные не определены'>",
          "office_signage_mention_status": "<defined / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 550

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "без образования юридического лица юридическое лицо штат сотрудников товарищества расчётный счёт товарищества вывеска офис товарищества печать товарищества"
      preferred_unit_types:
        - general_provision
        - obligation
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - boilerplate
        - definitions
      negative_keywords:
        - "вклад"
        - "распределение прибыли"
        - "ведение дел"
        - "выход из товарищества"
        - "прекращение"
        - "налоговый учёт"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 0.40]
        boost: 0.15
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "boilerplate"
        - "definitions"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 500

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 700

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора простого товарищества сведения
        о признаках скрытого создания юридического лица.
        Не анализируй вклады, прибыль, ведение дел или прекращение.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:
        1. no_legal_entity_clause_status — "defined" или "not_defined".
        2. no_legal_entity_clause_details — формулировка «без образования юрлица».
        3. staff_mention_status — "defined" или "not_defined".
        4. bank_account_mention_status — "defined" или "not_defined".
        5. bank_account_mention_details — упоминание расчётного счёта.
        6. office_signage_mention_status — "defined" или "not_defined".

        Если данные отсутствуют:
        - статус = "not_defined"
        - текст = "Данные не определены"
        </task>

        <rules>
        - Используй только текст договора.
        - staff_mention_status = "defined" если прямо упомянут штат/персонал
          товарищества как единого целого.
        - bank_account_mention_status = "defined" если упомянут расчётный счёт
          «товарищества» как единого целого.
        - Верни только JSON.
        </rules>
      fields:
        - name: "no_legal_entity_clause_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания «без образования юридического лица»."
          required: true
        - name: "no_legal_entity_clause_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Без образования юрлица"
          description: "Формулировка «без образования юридического лица»."
          required: true
        - name: "staff_mention_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус упоминания штата товарищества."
          required: false
        - name: "bank_account_mention_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус упоминания расчётного счёта товарищества."
          required: false
        - name: "bank_account_mention_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Расчётный счёт товарищества"
          description: "Упоминание расчётного счёта «товарищества»."
          required: false
        - name: "office_signage_mention_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус упоминания вывески/офиса товарищества."
          required: false
      store_payload: true

# ════════════════════════════════════════════════════════════════════════════
# БЛОК 5: DD_REQUEST_TEMPLATES
# Читается: DDRequestTemplateLoader
# ════════════════════════════════════════════════════════════════════════════

dd_request_templates:
  partnership_subject_extraction:
    text: >
      Просим чётко определить в {doc_names}: (а) идентификацию всех товарищей
      (минимум двух); (б) общую цель совместной деятельности — без цели договор
      незаключён (ст. 1041 ГК РФ); (в) тип цели (прибыль / некоммерческая);
      (г) прямое указание «без образования юридического лица»; (д) срок действия.
    addressee: "Все товарищи"

  contributions_check:
    text: >
      КРИТИЧЕСКИЙ ЗАПРОС: Просим предоставить по {doc_names}: (а) состав вклада
      каждого товарища (деньги, имущество, знания, репутация); (б) денежную оценку
      всех вкладов, особенно неденежных — без оценки споры о долях (ст. 1042 ГК РФ);
      (в) сроки внесения вкладов.
    addressee: "Все товарищи / Оценщик"

  management_and_decisions_check:
    text: >
      Просим согласовать для {doc_names}: (а) кто ведёт дела (совместно / один
      товарищ); (б) пределы полномочий ведущего дела и доверенности;
      (в) правило принятия решений (единогласие / большинство);
      (г) перечень вопросов для единогласия; (д) механизм разрешения deadlock.
    addressee: "Все товарищи"

  profit_loss_distribution_check:
    text: >
      Просим согласовать для {doc_names}: (а) порядок распределения прибыли
      (пропорционально вкладам / иное); (б) порядок покрытия убытков;
      (в) периодичность распределения. ВНИМАНИЕ: исключение товарища из прибыли
      НИЧТОЖНО (ст. 1048 ГК РФ), освобождение от убытков НИЧТОЖНО (ст. 1046 ГК РФ).
    addressee: "Все товарищи"

  liability_and_regress_check:
    text: >
      КРИТИЧЕСКИЙ ЗАПРОС по {doc_names}: (а) тип ответственности перед третьими
      лицами — при предпринимателе СОЛИДАРНАЯ ВСЕМ ИМУЩЕСТВОМ (ст. 1047 ГК РФ);
      (б) порядок регрессных требований между товарищами; (в) пропорции внутренних
      расчётов. Кредитор может взыскать весь долг с любого товарища!
    addressee: "Все товарищи / Юридический советник"

  information_and_reporting_check:
    text: >
      Просим согласовать для {doc_names}: (а) признание права на информацию
      (НЕОТЧУЖДАЕМО — ст. 1045 ГК РФ); (б) периодичность отчётности;
      (в) доступ к первичным документам; (г) право на аудит.
    addressee: "Все товарищи"

  common_property_check:
    text: >
      Просим уточнить в {doc_names}: (а) режим общей долевой собственности
      (ст. 1043 ГК РФ); (б) способ определения долей; (в) порядок распоряжения
      общим имуществом; (г) порядок пользования общим имуществом.
    addressee: "Все товарищи"

  withdrawal_and_termination_check:
    text: >
      Просим согласовать для {doc_names}: (а) право на выход и срок уведомления
      (для бессрочного — 3 месяца, ст. 1051 ГК РФ); (б) способ оценки доли
      при выходе; (в) срок выплаты доли; (г) основания прекращения;
      (д) порядок раздела имущества при прекращении.
    addressee: "Все товарищи"

  death_bankruptcy_succession_check:
    text: >
      Просим урегулировать в {doc_names}: (а) последствия смерти/банкротства
      товарища (по умолчанию — прекращение договора, ст. 1050 ГК РФ);
      (б) возможность продолжения с наследниками; (в) право выкупа доли.
    addressee: "Юридический советник"

  new_partners_and_conflict_check:
    text: >
      Просим урегулировать в {doc_names}: (а) порядок принятия новых товарищей
      (единогласие / оценка вклада / пересмотр долей); (б) запрет конкурирующей
      деятельности; (в) порядок раскрытия конфликта интересов.
    addressee: "Все товарищи / Юридический советник"

  tax_accounting_check:
    text: >
      Просим согласовать для {doc_names}: (а) кто ведёт налоговый/бухгалтерский
      учёт; (б) единые правила учёта; (в) распределение налоговых обязательств;
      (г) документооборот. ВНИМАНИЕ: риск двойного налогообложения при разных
      режимах (НК РФ ст. 278).
    addressee: "Бухгалтерия / Налоговый консультант"

  dispute_resolution_check:
    text: >
      Просим согласовать для {doc_names}: (а) порядок разрешения споров;
      (б) механизм deadlock (медиация / «русская рулетка» / третейский суд);
      (в) досудебный порядок; (г) подсудность.
    addressee: "Юридический советник"

  requalification_risk_check:
    text: >
      Просим проверить {doc_names} на признаки скрытого создания юридического лица:
      штат, расчётный счёт «товарищества», вывеска, печать, постоянный офис.
      Просим обеспечить чёткую оговорку «без образования юридического лица»
      и отсутствие атрибутов юрлица в тексте договора.
    addressee: "Юридический советник"

  _default:
    text: >
      Просим предоставить дополнительную информацию по вопросу «{check_name}»
      применительно к {doc_names}.
    addressee: "Юридический советник"


