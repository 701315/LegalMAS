      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора простого товарищества
        сведения о выходе, прекращении и разделе имущества.
        Не анализируй вклады как таковые, прибыль, ведение дел или налоги.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 15 полей + evidence (всего 16 ключей):
        1. withdrawal_right_status — "defined" или "not_defined".
        2. withdrawal_right_details — условие о праве на выход.
        3. withdrawal_regime_code — "free" (бессрочный, свободный выход) /
           "with_cause" (срочный, только по уважительной причине) /
           "mixed" / "not_defined".
        4. withdrawal_regime_details — обоснование режима.
        5. notice_period_status — "defined" или "not_defined".
        6. notice_period_details — срок уведомления о выходе.
        7. valuation_method_status — "defined" или "not_defined".
        8. valuation_method_details — способ оценки доли при выходе.
        9. payment_deadline_status — "defined" или "not_defined".
        10. payment_deadline_details — срок выплаты доли.
        11. termination_grounds_status — "defined" или "not_defined".
        12. termination_grounds_details — основания прекращения договора.
        13. property_division_status — "defined" или "not_defined".
        14. property_division_details — порядок раздела имущества.
        15. property_return_regime — "in_kind" / "monetary" / "mixed" /
            "not_defined".

        Если данные отсутствуют:
        - для *_status: "not_defined"
        - для *_details: "Данные не определены"
        - для withdrawal_regime_code и property_return_regime: "not_defined"
        </task>

        <rules>
        - Используй только текст договора.
        - withdrawal_regime_code = "free" если договор бессрочный и товарищ
          вправе выйти в любое время.
        - withdrawal_regime_code = "with_cause" если для выхода требуется
          уважительная причина или возмещение убытков.
        - property_return_regime = "in_kind" если прямо указан возврат
          вкладов в натуре; "monetary" — денежная компенсация.
