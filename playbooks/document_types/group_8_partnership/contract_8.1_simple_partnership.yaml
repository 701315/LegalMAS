      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора простого товарищества
        сведения об ответственности товарищей перед третьими лицами,
        очерёдности взыскания и порядке регрессных требований.
        Не анализируй вклады, прибыль, ведение дел или прекращение.
        </role>

        <context>
