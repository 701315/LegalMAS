      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора простого товарищества
        сведения о режиме раскрытия существования товарищества третьим
        лицам и ответственности в каждом режиме.
        Не анализируй вклады как таковые, распределение прибыли, налоговый
        учёт или прекращение (кроме специального условия ст. 1054).
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 9 полей + evidence (всего 10 ключей):
        1. disclosure_regime_code — "open" / "implicit" / "mixed" / "not_defined".
        2. disclosure_regime_details — обоснование режима.
        3. public_partner_status — "defined" или "not_defined".
        4. public_partner_details — кто публично действует от имени
           товарищества.
        5. disclosed_liability_status — "defined" или "not_defined".
        6. disclosed_liability_details — ответственность при раскрытии.
        7. termination_liability_status — "defined" или "not_defined".
        8. termination_liability_details — ответственность при прекращении
           негласного товарищества.
        9. non_disclosure_prohibition — "detected" если установлен прямой
           запрет раскрывать существование товарищества; иначе "not_detected".

        Если данные отсутствуют:
        - для *_status: "not_defined"
        - для disclosure_regime_code: "not_defined"
        - для non_disclosure_prohibition: "not_detected"
        - для *_details: "Данные не определены"
        </task>

        <rules>
        - Используй только текст договора.
        - disclosure_regime_code = "implicit" только при прямом указании
          негласности; НЕ выводи "open" автоматически, если не указано.
        - non_disclosure_prohibition = "detected" только при прямом запрете.
        - Верни РОВНО один валидный JSON-объект со всеми 10 ключами
          (9 полей + evidence), пригодный для парсинга через json.loads
          без предварительной обработки. Без markdown, без ```json,
          без комментариев, без текста до или после. Начни ответ сразу
          с { и закончи }.
        </rules>

        <cove>
        1. Все 10 ключей (9 полей + evidence) присутствуют в JSON?
        2. disclosure_regime_code — строго из allowed_values?
        3. Все *_status — строго "defined" / "not_defined"?
        4. non_disclosure_prohibition — строго "detected" / "not_detected"?
        5. Все *_details заполнены или "Данные не определены"?
        Не выводи шаги. Верни только JSON.
        </cove>
      fields:
        - name: "disclosure_regime_code"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Режим раскрытия"
