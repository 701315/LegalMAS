    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1600
      compact_output: false
      store_payload: true
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора простого товарищества
        сведения о принятии новых товарищей, запрете конкуренции
        и конфликте интересов.
        Не анализируй вклады как таковые, прибыль, ведение дел,
        прекращение или налоги.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 13 полей + evidence (всего 14 ключей):
        1. admission_allowed_status — "defined" или "not_defined".
        2. admission_allowed_details — порядок принятия новых товарищей.
        3. admission_decision_rule — "unanimous" / "qualified_majority" /
           "simple_majority" / "not_defined".
        4. non_compete_status — "defined" или "not_defined".
        5. non_compete_details — что именно запрещено (вид деятельности,
           территория).
        6. non_compete_term_status — "defined" или "not_defined".
        7. non_compete_term_details — срок действия запрета.
        8. non_compete_consequences_status — "defined" или "not_defined".
        9. non_compete_consequences_details — санкции за нарушение.
        10. conflict_disclosure_status — "defined" или "not_defined".
        11. conflict_disclosure_details — порядок раскрытия
            конфликта интересов.
        12. conflict_consequences_status — "defined" или "not_defined".
        13. conflict_consequences_details — последствия нераскрытия.

        Если данные отсутствуют:
        - для *_status: "not_defined"
        - для *_details: "Данные не определены"
        - для admission_decision_rule: "not_defined"
        </task>

        <rules>
        - Используй только текст договора.
        - admission_decision_rule фиксирует правило решения о приёме
          нового товарища.
        - non_compete_term_status = "defined" только если прямо указан
          срок; иначе "not_defined" (сам факт отсутствия срока фиксируется).
        - non_compete_consequences_status = "defined" при указании
          санкций (неустойка, убытки, исключение и т.п.).
        - conflict_consequences_status = "defined" при указании
          последствий нераскрытия.
        - Верни РОВНО один валидный JSON-объект со всеми 14 ключами
          (13 полей + evidence), пригодный для парсинга через json.loads
          без предварительной обработки. Без markdown, без ```json,
          без комментариев, без текста до или после. Начни ответ сразу
          с { и закончи }.
        </rules>

        <cove>
        1. Все 14 ключей (13 полей + evidence) присутствуют в JSON?
        2. admission_decision_rule — строго из allowed_values?
        3. Все *_status — строго "defined" / "not_defined"?
        4. Все *_details заполнены или "Данные не определены"?
        Не выводи шаги. Верни только JSON.
        </cove>
      fields:
        - name: "admission_allowed_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения порядка принятия новых товарищей."
          required: true
        - name: "admission_allowed_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Принятие новых товарищей"
          description: "Порядок принятия новых товарищей."
          required: true
        - name: "admission_decision_rule"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Правило приёма"
          allowed_values: ["unanimous", "qualified_majority", "simple_majority", "not_defined"]
          description: "Правило решения о приёме нового товарища."
          required: false
        - name: "non_compete_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус запрета конкурирующей деятельности."
