  - id: new_partners_and_conflict_check
    name: "Принятие новых товарищей, запрет конкуренции и конфликт интересов"
    description: >
      Фактографическая проверка порядка принятия новых товарищей
      (правило решения — единогласие / большинство), запрета конкурирующей
      деятельности и его параметров (что запрещено, на какой срок,
      последствия нарушения), а также порядка раскрытия и последствий
      нераскрытия конфликта интересов.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 100

    rules:
      keywords:
        - "принятие нового товарища"
        - "вступление нового товарища"
        - "приём нового участника"
        - "единогласное решение"
        - "квалифицированное большинство"
        - "оценка вклада нового участника"
        - "запрет конкуренции"
        - "non-compete"
        - "конкурирующий бизнес"
        - "аналогичная деятельность"
        - "конфликт интересов"
        - "раскрытие конфликта"
        - "заинтересованность"
        - "аффилированность"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)приняти[ея]\\s+нов[огоых]+\\s+товарищ"
        - "(?i)вступлени[ея]\\s+нов[огоых]+"
        - "(?i)запрет\\s+конкуренц"
        - "(?i)не\\s+вправе\\s+заниматься"
        - "(?i)конфликт\\s+интерес"
        - "(?i)раскрыт[ия][ея]\\s+интерес"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор простого товарищества.
        Проверяется три вопроса: принятие новых товарищей, запрет конкуренции
        и конфликт интересов.
        Нормативные ориентиры:
        - Правило решения о приёме нового товарища в ГК РФ прямо
          не установлено; при отсутствии в договоре иного применяется
          п. 1 ст. 1044 ГК РФ (совместное ведение дел → единогласие).
        - Ограничения конкуренции (non-compete) должны быть
          конкретными (вид деятельности, территория, срок), иначе
          оспоримы по ст. 11 ФЗ №135 «О защите конкуренции».
        - Конфликт интересов — договорное условие, в ГК РФ для ПТ
          не нормирован.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Различай: запрет конкуренции без указания срока / территории —
          сам по себе факт, фиксируй его как есть.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Разрешено ли принятие новых товарищей и на каких условиях.
        2. Правило решения о приёме (единогласие / квалифицированное
           большинство / простое большинство).
        3. Наличие запрета конкурирующей деятельности и его содержание
           (что именно запрещено).
        4. Срок действия запрета конкуренции.
        5. Последствия нарушения запрета конкуренции.
        6. Порядок раскрытия конфликта интересов.
        7. Последствия нераскрытия конфликта интересов.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Для enum-полей (*_status, admission_decision_rule) при
           отсутствии данных возвращай "not_defined".
        4. Для строковых *_details при отсутствии данных возвращай строго
           "Данные не определены".
        5. Не используй "None", "null", пустые строки или отсутствующие
           ключи.
        6. В evidence включай только прямые цитаты из текста договора.
        7. admission_decision_rule: "unanimous" (единогласие) /
           "qualified_majority" (квалифицированное большинство) /
           "simple_majority" (простое большинство) / "not_defined".
        8. non_compete_term_status = "defined" ТОЛЬКО если прямо указан
           срок запрета; "not_defined" — если срок не установлен
           (это самостоятельный факт).
        9. non_compete_consequences_status = "defined" если указаны
           санкции за нарушение (неустойка, возмещение убытков,
           исключение из товарищества и т.п.).
        10. conflict_consequences_status = "defined" если указаны
            последствия нераскрытия конфликта интересов.
        11. Верни РОВНО один валидный JSON-объект со всеми 14 ключами
            (13 полей + evidence), пригодный для парсинга через json.loads
            без предварительной обработки. Без markdown, без ```json,
            без комментариев, без текста до или после. Начни ответ сразу
            с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — приём единогласно, non-compete со сроком и санкцией:
        Фрагмент:
        "Принятие новых товарищей допускается по единогласному решению
        всех товарищей. Вклад нового товарища оценивается сторонами.
        Товарищам запрещается в течение срока действия договора заниматься
        деятельностью, аналогичной совместной деятельности товарищества,
        на территории г. Москвы. За нарушение — неустойка 1 000 000 рублей.
        Конфликт интересов подлежит раскрытию в письменной форме в течение
        5 рабочих дней. Неисполнение обязанности раскрытия влечёт
        исключение из товарищества."
        Ответ:
        {
          "admission_allowed_status": "defined",
          "admission_allowed_details": "принятие допускается по единогласному решению всех товарищей",
          "admission_decision_rule": "unanimous",
          "non_compete_status": "defined",
          "non_compete_details": "запрет деятельности, аналогичной совместной деятельности, на территории г. Москвы",
          "non_compete_term_status": "defined",
          "non_compete_term_details": "в течение срока действия договора",
          "non_compete_consequences_status": "defined",
          "non_compete_consequences_details": "неустойка 1 000 000 рублей",
          "conflict_disclosure_status": "defined",
          "conflict_disclosure_details": "письменное раскрытие в течение 5 рабочих дней",
          "conflict_consequences_status": "defined",
          "conflict_consequences_details": "исключение из товарищества",
          "evidence": [
            {"clause_ref": "п. 7.1", "quote": "Принятие новых товарищей допускается по единогласному решению всех товарищей."},
            {"clause_ref": "п. 7.3", "quote": "Товарищам запрещается в течение срока действия договора заниматься деятельностью, аналогичной совместной деятельности товарищества, на территории г. Москвы."},
            {"clause_ref": "п. 7.4", "quote": "За нарушение — неустойка 1 000 000 рублей."},
            {"clause_ref": "п. 7.6", "quote": "Конфликт интересов подлежит раскрытию в письменной форме в течение 5 рабочих дней."},
            {"clause_ref": "п. 7.7", "quote": "Неисполнение обязанности раскрытия влечёт исключение из товарищества."}
          ]
        }

        Пример 2 — non-compete без срока и санкций (edge-case):
        Фрагмент:
        "Товарищи обязуются не заниматься конкурирующей деятельностью.
        Порядок раскрытия конфликта интересов определяется общим собранием."
        Ответ:
        {
          "admission_allowed_status": "not_defined",
          "admission_allowed_details": "Данные не определены",
          "admission_decision_rule": "not_defined",
          "non_compete_status": "defined",
          "non_compete_details": "обязанность не заниматься конкурирующей деятельностью",
          "non_compete_term_status": "not_defined",
          "non_compete_term_details": "Данные не определены",
          "non_compete_consequences_status": "not_defined",
          "non_compete_consequences_details": "Данные не определены",
          "conflict_disclosure_status": "defined",
          "conflict_disclosure_details": "порядок раскрытия определяется общим собранием (конкретный порядок не установлен)",
          "conflict_consequences_status": "not_defined",
          "conflict_consequences_details": "Данные не определены",
          "evidence": [
            {"clause_ref": "п. 7.2", "quote": "Товарищи обязуются не заниматься конкурирующей деятельностью."},
            {"clause_ref": "п. 7.5", "quote": "Порядок раскрытия конфликта интересов определяется общим собранием."}
          ]
        }

        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Стороны обязуются исполнять договор."
        Ответ:
        {
          "admission_allowed_status": "not_defined",
          "admission_allowed_details": "Данные не определены",
          "admission_decision_rule": "not_defined",
          "non_compete_status": "not_defined",
          "non_compete_details": "Данные не определены",
          "non_compete_term_status": "not_defined",
          "non_compete_term_details": "Данные не определены",
          "non_compete_consequences_status": "not_defined",
