  - id: contributions_check
    name: "Состав, размер и денежная оценка вкладов товарищей"
    description: >
      Фактографическая проверка состава вкладов каждого товарища (денежные,
      имущественные, неденежные), их денежной оценки, способа оценки и сроков
      внесения.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 20

    rules:
      keywords:
        - "вклад товарища"
        - "соединение вкладов"
        - "размер вклада"
        - "денежный вклад"
        - "имущественный вклад"
        - "имущественное право"
        - "профессиональные знания"
        - "деловая репутация"
        - "деловые связи"
        - "денежная оценка"
        - "оценка вклада"
        - "независимая оценка"
        - "отчет об оценке"
        - "оценщик"
        - "внесение вклада"
        - "срок внесения"
        - "порядок внесения"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽)"
        - "(?i)(оценк|стоимост)\\s+вклад"
        - "(?i)(срок|порядок)\\s+внесени"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор простого товарищества (ст. 1042 ГК РФ).
        Проверяется только один вопрос: вклады товарищей, их оценка,
        способ оценки и сроки внесения.
        Нормативные ориентиры:
        - ст. 1042 ГК РФ — вклады товарищей
        - п. 2 ст. 245 ГК РФ — презумпция равенства долей при отсутствии соглашения
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Без денежной оценки неденежных вкладов невозможно определить доли.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Состав вклада каждого товарища (деньги, имущество, знания,
           репутация, связи, имущественные права).
        2. Денежную оценку каждого вклада.
        3. Способ оценки (согласование сторон / независимый оценщик / смешанный).
        4. Сроки внесения вкладов.
        5. Наличие неденежных вкладов и их состав.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Для enum-полей (*_status, non_monetary_present, valuation_method)
           при отсутствии данных возвращай "not_defined".
        4. Для строковых *_details / *_method при отсутствии данных возвращай
           строго "Данные не определены".
        5. Не используй "None", "null", пустые строки или отсутствующие ключи.
        6. В evidence включай только прямые цитаты из текста договора.
        7. Если денежная оценка отсутствует, но вклады описаны —
           contributions_status = "defined", valuation_status = "not_defined".
           Доли в таком случае считаются равными (п. 2 ст. 245 ГК РФ),
           если иное не следует из соглашения.
        8. Верни РОВНО один валидный JSON-объект со всеми 10 ключами
           (9 полей + evidence), пригодный для парсинга через json.loads
           без предварительной обработки. Без markdown, без ```json,
           без комментариев, без текста до или после. Начни ответ сразу
           с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — вклады и оценка определены:
        Фрагмент:
        "Товарищ 1 вносит денежный вклад в размере 5 000 000 рублей.
        Товарищ 2 вносит профессиональные знания и деловые связи,
        оцениваемые сторонами в 2 000 000 рублей. Вклады вносятся
        в течение 30 дней с даты подписания договора."
        Ответ:
        {
          "contributions_status": "defined",
          "contributions_details": "Товарищ 1: денежный вклад 5 000 000 рублей; Товарищ 2: профессиональные знания и деловые связи — 2 000 000 рублей",
          "valuation_status": "defined",
          "valuation_details": "Товарищ 1 — 5 000 000 рублей; Товарищ 2 — 2 000 000 рублей",
          "valuation_method": "согласование сторон",
          "non_monetary_present": "yes",
          "non_monetary_details": "профессиональные знания, деловые связи (Товарищ 2)",
          "contribution_deadline_status": "defined",
          "contribution_deadline_details": "в течение 30 дней с даты подписания",
          "evidence": [
            {"clause_ref": "п. 2.1", "quote": "Товарищ 1 вносит денежный вклад в размере 5 000 000 рублей."},
            {"clause_ref": "п. 2.1", "quote": "Товарищ 2 вносит профессиональные знания и деловые связи, оцениваемые сторонами в 2 000 000 рублей."},
            {"clause_ref": "п. 2.2", "quote": "Вклады вносятся в течение 30 дней с даты подписания договора."}
          ]
        }

        Пример 2 — вклады описаны, оценка отсутствует (edge-case):
        Фрагмент:
        "Товарищ 1 вносит денежные средства, Товарищ 2 — оборудование
        и профессиональные знания. Оценка вкладов не производится."
        Ответ:
        {
          "contributions_status": "defined",
          "contributions_details": "Товарищ 1: денежные средства; Товарищ 2: оборудование, профессиональные знания",
          "valuation_status": "not_defined",
          "valuation_details": "Данные не определены",
          "valuation_method": "not_defined",
          "non_monetary_present": "yes",
          "non_monetary_details": "оборудование, профессиональные знания (Товарищ 2)",
          "contribution_deadline_status": "not_defined",
          "contribution_deadline_details": "Данные не определены",
          "evidence": [
            {"clause_ref": "п. 2.1", "quote": "Товарищ 1 вносит денежные средства, Товарищ 2 — оборудование и профессиональные знания."},
            {"clause_ref": "п. 2.3", "quote": "Оценка вкладов не производится."}
          ]
        }

        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Стороны обязуются соединить вклады."
        Ответ:
        {
          "contributions_status": "not_defined",
          "contributions_details": "Данные не определены",
          "valuation_status": "not_defined",
          "valuation_details": "Данные не определены",
          "valuation_method": "not_defined",
          "non_monetary_present": "not_defined",
          "non_monetary_details": "Данные не определены",
          "contribution_deadline_status": "not_defined",
          "contribution_deadline_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Все 10 ключей (9 полей + evidence) присутствуют в JSON?
        2. Найдена ли прямая цитата о составе вклада каждого товарища?
        3. Найдена ли прямая цитата о денежной оценке (или её отсутствии)?
        4. Определён ли способ оценки (согласование / оценщик / смешанный)?
        5. Определён ли состав неденежных вкладов?
        6. Найдена ли прямая цитата о сроках внесения?
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "contributions_status": "<defined / not_defined>",
          "contributions_details": "<состав вкладов или 'Данные не определены'>",
          "valuation_status": "<defined / partial / not_defined>",
          "valuation_details": "<значения оценки или 'Данные не определены'>",
          "valuation_method": "<согласование сторон / независимый оценщик / смешанный / not_defined>",
          "non_monetary_present": "<yes / no / not_defined>",
          "non_monetary_details": "<состав неденежных вкладов или 'Данные не определены'>",
          "contribution_deadline_status": "<defined / not_defined>",
          "contribution_deadline_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 650

    retrieval:
      retrieval_profile: "payment_terms_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "вклад товарища соединение вкладов размер вклада денежный вклад имущественный вклад имущественное право профессиональные знания деловая репутация деловые связи денежная оценка оценка вклада независимая оценка отчет об оценке сроки внесения вкладов порядок внесения неденежный вклад"
      preferred_unit_types:
        - obligation
        - general_provision
        - payment_term
      excluded_unit_types:
        - definition
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "распределение прибыли"
        - "ведение дел"
        - "доверенность"
        - "выход из товарищества"
        - "прекращение"
        - "неустойка"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.05, 0.45]
        boost: 0.18
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1200

      compact_output: false

      presence_signal:
        field: "contributions_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора простого товарищества
        сведения о вкладах товарищей: состав, денежную оценку, способ оценки,
        неденежные вклады и сроки внесения.
        Не анализируй распределение прибыли, ведение дел или прекращение.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. contributions_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (contributions_status, valuation_status,
              contribution_deadline_status) ≠ "not_defined";
           - "missing" — если все три содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - contributions_status = "not_defined";
           - valuation_status = "not_defined";
           - contribution_deadline_status = "not_defined";
           - valuation_method = "not_defined";
           - non_monetary_present = "not_defined";
           - все *_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. contributions_status:
           - "defined" — если прямо описан состав вклада хотя бы одного
             товарища;
           - "not_defined" — иначе.

        2. contributions_details:
           Краткое user-facing описание состава вкладов каждого товарища.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        3. valuation_status:
           Используй только одно из значений:
           - "defined" — если прямо указана денежная оценка всех вкладов;
           - "partial" — если оценены не все вклады;
           - "not_defined" — если денежная оценка отсутствует.

        4. valuation_details:
           Значения денежной оценки каждого вклада.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        5. valuation_method:
           Используй только одно из значений:
           - "согласование сторон" — если оценка установлена сторонами;
           - "независимый оценщик" — если указан оценщик / отчёт об оценке;
           - "смешанный" — если применяются оба способа;
           - "not_defined" — если способ оценки не указан.

        6. non_monetary_present:
           Используй только одно из значений:
           - "yes" — если хотя бы один вклад неденежный;
           - "no" — если все вклады только денежные;
           - "not_defined" — если по тексту определить нельзя.

        7. non_monetary_details:
           Краткое описание состава неденежных вкладов.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        8. contribution_deadline_status:
           - "defined" — если прямо указан срок внесения вкладов
             (датами, в днях/месяцах, «до наступления события»);
           - "not_defined" — иначе.

        9. contribution_deadline_details:
           Краткое user-facing описание сроков внесения.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни contributions_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не делай выводов по типовой структуре договора.
        - Не извлекай сведения о распределении прибыли, ведении дел, доверенностях, выходе из товарищества, прекращении, неустойках и иных нерелевантных темах.
        - valuation_status: "defined" если оценены все вклады; "partial" если оценены не все; "not_defined" если оценки нет.
        - valuation_method: "согласование сторон" если оценка установлена сторонами; "независимый оценщик" если указан оценщик; "смешанный" если применяются оба способа.
        - non_monetary_present: "yes" если хотя бы один вклад неденежный; "no" если все вклады только денежные.
        - Если вклады описаны, но денежная оценка отсутствует: contributions_status = "defined", valuation_status = "not_defined".
        - Если в разных фрагментах указаны противоречивые сведения и конфликт нельзя разрешить по тексту — статус → "not_defined", текстовое поле → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни описания вкладов, ни денежной оценки,
           ни сроков внесения.
           → presence = "missing";
             все *_status = "not_defined";
             valuation_method = "not_defined";
             non_monetary_present = "not_defined";
             все *_details = "Данные не определены".

        2. Неполное раскрытие (вклады описаны, оценки нет).
           Состав вкладов указан, но денежная оценка отсутствует.
           → presence = "present";
             contributions_status = "defined";
             valuation_status = "not_defined";
             valuation_details = "Данные не определены".

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные размеры или оценки
           вкладов.
           → presence = "unclear";
             valuation_status = "not_defined";
             valuation_details = "Не удалось определить".

        4. Комбинированная ситуация.
           Часть вкладов оценена, часть — нет.
           → presence = "present";
             valuation_status = "partial";
             valuation_details содержит оценённые значения и указание
             на отсутствие оценки для остальных.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для contributions_check_presence используй только: "present", "missing", "unclear".
        - Для enum-полей *_status (contributions_status, contribution_deadline_status) используй только: "defined", "not_defined".
        - Для valuation_status используй только: "defined", "partial", "not_defined".
        - Для valuation_method используй только: "согласование сторон", "независимый оценщик", "смешанный", "not_defined".
        - Для non_monetary_present используй только: "yes", "no", "not_defined".
        - Fallback при отсутствии данных:
          * все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "contributions_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по вкладам товарищей. Внутреннее агрегатное signal-поле."
