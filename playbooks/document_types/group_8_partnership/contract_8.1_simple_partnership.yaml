        - "право на выход"
        - "выход из товарищества"
        - "выдел доли"
      keyword_mode: "any"
      regex_patterns: []

  - id: "termination_clause"
    name: "Порядок прекращения и раздела имущества"
    description: "Ликвидация общего имущества"
    legal_base: "ст. 1050, 1052, 1053 ГК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "прекращение договора"
        - "ликвидация общего имущества"
        - "раздел имущества"
