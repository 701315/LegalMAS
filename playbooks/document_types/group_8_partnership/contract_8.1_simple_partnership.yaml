        прекращение или неустойки.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 12 полей + evidence (всего 13 ключей):
        1. accounting_responsible_status — "defined" или "not_defined".
        2. accounting_responsible_details — лицо, ведущее учёт.
        3. tax_regime_code — "osn" / "usn" / "eshn" / "mixed" / "not_defined".
        4. tax_regime_details — описание режима / режимов.
        5. separate_balance_status — "defined" или "not_defined".
        6. separate_balance_details — условие об отдельном балансе.
        7. vat_handling_status — "defined" или "not_defined".
        8. vat_handling_details — порядок учёта НДС.
        9. tax_allocation_status — "defined" или "not_defined".
        10. tax_allocation_details — распределение налоговой базы.
        11. document_flow_status — "defined" или "not_defined".
        12. document_flow_details — порядок документооборота.

        Если данные отсутствуют:
        - для *_status: "not_defined"
        - для *_details: "Данные не определены"
        - для tax_regime_code: "not_defined"
        </task>

        <rules>
        - Используй только текст договора.
        - tax_regime_code = "mixed" если у участников разные режимы.
        - separate_balance_status = "defined" только при прямом указании
          отдельного баланса общего имущества.
        - vat_handling_details: кто выставляет счёт-фактуры, восстановление
