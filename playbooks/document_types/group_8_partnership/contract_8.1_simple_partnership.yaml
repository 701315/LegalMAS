  # CHECK 10: Новые товарищи, конкуренция, конфликт интересов
  # ──────────────────────────────────────────────────────────────────────────
  - id: new_partners_and_conflict_check
    name: "Принятие новых товарищей, запрет конкуренции и конфликт интересов"
    description: >
      Фактографическая проверка порядка принятия новых товарищей, запрета
      конкурирующей деятельности и порядка раскрытия конфликта интересов.
