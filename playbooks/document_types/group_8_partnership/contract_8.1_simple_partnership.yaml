  - id: death_bankruptcy_succession_check
    name: "Последствия смерти, банкротства, ликвидации товарища и правопреемство (ст. 1050 ГК РФ)"
    description: >
      Фактографическая проверка условий о последствиях смерти гражданина
      (включая объявление умершим и признание безвестно отсутствующим),
      банкротства, ликвидации юридического лица-товарища и признания
      недееспособным: прекращение или продолжение договора с правопреемниками
      (п. 2 ст. 1050 ГК РФ), порядок вступления правопреемника (п. 3 ст. 1050
      ГК РФ), право и срок выкупа доли остальными товарищами.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 90

    rules:
      keywords:
        - "смерть товарища"
        - "объявление умершим"
        - "признание безвестно отсутствующим"
        - "банкротство товарища"
        - "ликвидация товарища"
        - "прекращение деятельности"
        - "признание недееспособным"
        - "ограничение дееспособности"
        - "наследники"
        - "правопреемники"
        - "продолжение с наследниками"
        - "вступление правопреемника"
        - "право выкупа доли"
        - "преимущественное право"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)смерт[ьи]\\s+товарищ"
        - "(?i)(объявлен|признан)[а-яё]*\\s+(умерш|безвестно)"
        - "(?i)(банкротств|ликвидац)"
        - "(?i)наследник|правопреемник"
        - "(?i)недееспособн"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор простого товарищества (ст. 1050 ГК РФ).
        Проверяется только один вопрос: последствия смерти, банкротства,
        ликвидации товарища и правопреемство.
        Нормативные ориентиры:
        - п. 1 ст. 1050 ГК РФ — договор прекращается вследствие: смерти
          гражданина-товарища, объявления его умершим, признания безвестно
          отсутствующим, признания недееспособным / ограниченно дееспособным,
          ликвидации или реорганизации юридического лица-товарища,
          признания товарища банкротом.
        - п. 2 ст. 1050 ГК РФ — договором может быть предусмотрено
          продолжение товарищества при смерти / ликвидации одного
          из товарищей — с его правопреемниками или с остальными
          товарищами.
        - п. 3 ст. 1050 ГК РФ — при продолжении правопреемник вступает
          в товарищество по правилам о вступлении нового товарища.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Различай: прекращение / продолжение с правопреемниками /
          продолжение только с согласия остальных товарищей.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Какие события указаны как основания прекращения / продолжения
           (смерть, банкротство, ликвидация, недееспособность и др.).
        2. Последствие события: прекращение или продолжение договора.
        3. Условие продолжения с правопреемниками (наследниками,
           правопреемниками ЮЛ).
        4. Порядок вступления правопреемника (согласие остальных
           товарищей, автоматическое вступление и т.п.).
        5. Право выкупа доли остальными товарищами.
        6. Срок выкупа доли.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Для enum-полей (trigger_type, termination_consequence_code) при
           отсутствии данных возвращай "not_defined".
        4. Для строковых *_details и *_status при отсутствии данных
           возвращай "not_defined" (для *_status) / "Данные не определены"
           (для *_details).
        5. Не используй "None", "null", пустые строки или отсутствующие ключи.
        6. В evidence включай только прямые цитаты из текста договора.
        7. trigger_type фиксирует ТИП события, указанный в договоре.
           Если договор использует общую формулировку («выбытие товарища»),
           выбирай "other".
        8. termination_consequence_code = "terminate" если договор
           прекращается; "continue_with_successors" если продолжается
           с правопреемниками автоматически; "continue_with_consent"
           если продолжение требует согласия остальных товарищей или
           правопреемников; "mixed" — сочетание.
        9. Верни РОВНО один валидный JSON-объект со всеми 12 ключами
           (11 полей + evidence), пригодный для парсинга через json.loads
           без предварительной обработки. Без markdown, без ```json,
           без комментариев, без текста до или после. Начни ответ сразу
           с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — смерть товарища, продолжение с наследниками:
        Фрагмент:
        "В случае смерти товарища договор продолжается с его наследниками
        при условии их согласия и согласия остальных товарищей. Остальные
        товарищи имеют преимущественное право выкупа доли умершего товарища
        в течение 60 дней с даты открытия наследства."
        Ответ:
        {
          "trigger_type": "death_natural",
          "termination_consequence_code": "continue_with_consent",
          "termination_consequence_details": "договор продолжается с наследниками при условии их согласия и согласия остальных товарищей",
          "continuation_with_successors_status": "defined",
          "continuation_with_successors_details": "продолжение с наследниками при их согласии и согласии остальных товарищей",
          "successor_admission_status": "defined",
          "successor_admission_details": "по согласию наследников и остальных товарищей",
          "buyout_right_status": "defined",
          "buyout_right_details": "преимущественное право выкупа доли остальными товарищами",
          "buyout_deadline_status": "defined",
          "buyout_deadline_details": "в течение 60 дней с даты открытия наследства",
          "evidence": [
            {"clause_ref": "п. 9.1", "quote": "В случае смерти товарища договор продолжается с его наследниками при условии их согласия и согласия остальных товарищей."},
            {"clause_ref": "п. 9.2", "quote": "Остальные товарищи имеют преимущественное право выкупа доли умершего товарища в течение 60 дней с даты открытия наследства."}
          ]
        }

        Пример 2 — банкротство, прекращение договора:
        Фрагмент:
        "Признание товарища банкротом влечёт прекращение настоящего
        договора. Доля обанкротившегося товарища подлежит реализации
        в порядке, установленном законодательством о банкротстве."
        Ответ:
        {
          "trigger_type": "bankruptcy",
          "termination_consequence_code": "terminate",
          "termination_consequence_details": "признание товарища банкротом влечёт прекращение договора",
          "continuation_with_successors_status": "not_defined",
          "continuation_with_successors_details": "Данные не определены",
          "successor_admission_status": "not_defined",
          "successor_admission_details": "Данные не определены",
          "buyout_right_status": "not_defined",
          "buyout_right_details": "Данные не определены",
          "buyout_deadline_status": "not_defined",
          "buyout_deadline_details": "Данные не определены",
          "evidence": [
            {"clause_ref": "п. 9.3", "quote": "Признание товарища банкротом влечёт прекращение настоящего договора."},
            {"clause_ref": "п. 9.4", "quote": "Доля обанкротившегося товарища подлежит реализации в порядке, установленном законодательством о банкротстве."}
          ]
        }

        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Договор действует до достижения цели."
        Ответ:
        {
          "trigger_type": "not_defined",
          "termination_consequence_code": "not_defined",
          "termination_consequence_details": "Данные не определены",
          "continuation_with_successors_status": "not_defined",
          "continuation_with_successors_details": "Данные не определены",
          "successor_admission_status": "not_defined",
          "successor_admission_details": "Данные не определены",
          "buyout_right_status": "not_defined",
          "buyout_right_details": "Данные не определены",
          "buyout_deadline_status": "not_defined",
          "buyout_deadline_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Все 12 ключей (11 полей + evidence) присутствуют в JSON?
        2. trigger_type — строго из allowed_values?
        3. termination_consequence_code — строго из allowed_values?
        4. Проверено ли условие о продолжении с правопреемниками?
        5. Проверен ли порядок вступления правопреемника?
        6. Проверено ли право и срок выкупа доли?
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "trigger_type": "<death_natural / death_declared / missing_person / bankruptcy / liquidation_entity / incapacity / other / not_defined>",
          "termination_consequence_code": "<terminate / continue_with_successors / continue_with_consent / mixed / not_defined>",
          "termination_consequence_details": "<текст или 'Данные не определены'>",
          "continuation_with_successors_status": "<defined / not_defined>",
          "continuation_with_successors_details": "<текст или 'Данные не определены'>",
          "successor_admission_status": "<defined / not_defined>",
          "successor_admission_details": "<текст или 'Данные не определены'>",
          "buyout_right_status": "<defined / not_defined>",
          "buyout_right_details": "<текст или 'Данные не определены'>",
          "buyout_deadline_status": "<defined / not_defined>",
          "buyout_deadline_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 700

    retrieval:
      retrieval_profile: "termination_check"
      corpus_scope: "primary_segment"
