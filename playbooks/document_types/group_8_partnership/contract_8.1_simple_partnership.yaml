        1. ip_creation_status — "defined" или "not_defined".
        2. ip_creation_details — какие IP создаются в рамках ПТ.
        3. ip_ownership_regime_code — "joint" / "single_partner" /
           "joint_with_roles" / "not_defined".
        4. ip_ownership_details — детали режима владения IP.
        5. ip_use_after_exit_status — "defined" или "not_defined".
