          required: false
        - name: "public_partner_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения публичного товарища."
          required: false
        - name: "public_partner_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Публичный товарищ"
