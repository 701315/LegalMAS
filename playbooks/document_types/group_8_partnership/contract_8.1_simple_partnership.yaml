    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1200
      compact_output: false
      store_payload: true
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора простого товарищества
        сведения о вкладах товарищей: состав, денежную оценку, способ оценки,
        неденежные вклады и сроки внесения.
        Не анализируй распределение прибыли, ведение дел или прекращение.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 9 полей + evidence (всего 10 ключей):
        1. contributions_status — "defined" или "not_defined".
        2. contributions_details — состав вкладов каждого товарища.
        3. valuation_status — "defined" / "partial" / "not_defined".
        4. valuation_details — значения оценки каждого вклада.
        5. valuation_method — "согласование сторон" / "независимый оценщик" /
           "смешанный" / "not_defined".
        6. non_monetary_present — "yes" / "no" / "not_defined".
        7. non_monetary_details — состав неденежных вкладов.
        8. contribution_deadline_status — "defined" или "not_defined".
        9. contribution_deadline_details — сроки внесения вкладов.

        Если данные отсутствуют:
        - статус = "not_defined"
        - текст = "Данные не определены"
        </task>

        <rules>
        - Используй только текст договора.
        - valuation_status: "defined" если оценены все вклады;
          "partial" если оценены не все; "not_defined" если оценки нет.
        - valuation_method: "согласование сторон" если оценка установлена
          сторонами; "независимый оценщик" если указан оценщик;
          "смешанный" если применяются оба способа.
        - non_monetary_present: "yes" если хотя бы один вклад неденежный;
          "no" если все вклады только денежные.
        - Если вклады описаны, но денежная оценка отсутствует:
          contributions_status = "defined", valuation_status = "not_defined".
        - Верни РОВНО один валидный JSON-объект со всеми 10 ключами
          (9 полей + evidence), пригодный для парсинга через json.loads
          без предварительной обработки. Без markdown, без ```json,
          без комментариев, без текста до или после. Начни ответ сразу
          с { и закончи }.
        </rules>

        <cove>
        1. Все 10 ключей (9 полей + evidence) присутствуют в JSON?
        2. contributions_status и valuation_status — строго из allowed_values?
        3. valuation_method — строго из allowed_values?
        4. non_monetary_present — строго из allowed_values?
        5. Все *_details заполнены или "Данные не определены"?
        Не выводи шаги. Верни только JSON.
        </cove>
      fields:
        - name: "contributions_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения вкладов."
          required: true
        - name: "contributions_details"
          type: "string"
          presentation: "fact"
