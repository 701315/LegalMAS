          distinctiveness: high
          context: header
          description: "Альтернативное русское название договора"

        - pattern: "(?i)партн[ёе]рск[оеое]\\s+соглашен[иеия]"
          weight: 0.85
          distinctiveness: high
          context: any
          description: "Партнёрское соглашение как форма простого товарищества"

        - pattern: "(?i)consortium\\s+agreement"
