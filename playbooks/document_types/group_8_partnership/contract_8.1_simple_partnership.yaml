      context_k: 5
      temperature: 0.0
      max_tokens: 800

    retrieval:
      retrieval_profile: "consent_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "принятие нового товарища вступление нового участника единогласное решение квалифицированное большинство оценка вклада нового участника изменение долей запрет конкуренции non-compete конкурирующий бизнес аналогичная деятельность территория срок неустойка конфликт интересов раскрытие конфликта заинтересованность аффилированность исключение"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - limitations
      negative_keywords:
