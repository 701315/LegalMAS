    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1500
      compact_output: false
      store_payload: true
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора простого товарищества
        сведения о последствиях смерти, банкротства, ликвидации товарища
        и правопреемстве.
        Не анализируй вклады как таковые, прибыль, ведение дел или налоги.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 11 полей + evidence (всего 12 ключей):
        1. trigger_type — тип события: "death_natural" (смерть гражданина) /
           "death_declared" (объявление умершим) / "missing_person" (признание
           безвестно отсутствующим) / "bankruptcy" (признание банкротом) /
           "liquidation_entity" (ликвидация / реорганизация ЮЛ) /
           "incapacity" (признание недееспособным / ограничение
           дееспособности) / "other" / "not_defined".
        2. termination_consequence_code — "terminate" (прекращение) /
           "continue_with_successors" (продолжение с правопреемниками
           автоматически) / "continue_with_consent" (продолжение
           с согласия) / "mixed" / "not_defined".
        3. termination_consequence_details — прямая цитата о последствии.
        4. continuation_with_successors_status — "defined" или "not_defined".
        5. continuation_with_successors_details — условие продолжения
           с правопреемниками.
        6. successor_admission_status — "defined" или "not_defined".
        7. successor_admission_details — порядок вступления
           правопреемника.
        8. buyout_right_status — "defined" или "not_defined".
        9. buyout_right_details — условия права выкупа доли.
        10. buyout_deadline_status — "defined" или "not_defined".
        11. buyout_deadline_details — срок выкупа доли.

        Если данные отсутствуют:
        - для *_status: "not_defined"
        - для *_details: "Данные не определены"
        - для trigger_type / termination_consequence_code: "not_defined"
        </task>

        <rules>
        - Используй только текст договора.
        - trigger_type фиксируй по типу события, прямо указанного
          в договоре. При общей формулировке («выбытие товарища») —
          "other".
        - termination_consequence_code = "continue_with_consent" если для
          продолжения требуется согласие остальных товарищей или
          правопреемников.
        - successor_admission_details: порядок вступления правопреемника
          (по правилам о вступлении нового товарища / автоматически /
          по решению остальных).
        - Верни РОВНО один валидный JSON-объект со всеми 12 ключами
          (11 полей + evidence), пригодный для парсинга через json.loads
          без предварительной обработки. Без markdown, без ```json,
          без комментариев, без текста до или после. Начни ответ сразу
          с { и закончи }.
        </rules>

        <cove>
        1. Все 12 ключей (11 полей + evidence) присутствуют в JSON?
        2. trigger_type и termination_consequence_code — строго из allowed_values?
        3. Все *_status — строго "defined" / "not_defined"?
        4. Все *_details заполнены или "Данные не определены"?
        Не выводи шаги. Верни только JSON.
        </cove>
      fields:
        - name: "trigger_type"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Тип события"
          allowed_values:
            - "death_natural"
            - "death_declared"
            - "missing_person"
            - "bankruptcy"
            - "liquidation_entity"
            - "incapacity"
