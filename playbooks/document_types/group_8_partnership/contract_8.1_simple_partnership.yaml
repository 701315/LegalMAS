  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 3: Ведение дел, полномочия, принятие решений
  # ──────────────────────────────────────────────────────────────────────────
  - id: management_and_decisions_check
    name: "Ведение общих дел, полномочия, принятие решений и ограничения"
    description: >
      Фактографическая проверка порядка ведения общих дел (совместно / один
      товарищ), пределов полномочий ведущего дела, доверенностей, процедуры
      принятия решений, механизма deadlock и ограничений полномочий.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "ведение общих дел"
        - "ведущий дела"
        - "управляющий товарищ"
        - "полномочия"
        - "доверенность"
        - "совместное ведение"
        - "порядок принятия решений"
        - "единогласное решение"
        - "квалифицированное большинство"
        - "deadlock"
        - "тупиковая ситуация"
        - "лимит сделки"
        - "требуется согласие"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)ведени[ея]\\s+общих\\s+дел"
        - "(?i)единогласн"
        - "(?i)большинств\\s+голос"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор простого товарищества (ст. 1044 ГК РФ).
        Проверяется только один вопрос: ведение общих дел, полномочия
        и принятие решений.
        [ЗАДАЧА]
        Найди в тексте договора:
        1. Тип управления: совместное / один товарищ / несколько.
        2. Имя ведущего дела товарища.
        3. Требуется ли доверенность.
        4. Правило принятия решений: единогласие / большинство.
        5. Перечень вопросов, требующих единогласия.
        6. Ограничения полномочий ведущего дела (лимиты, одобрение).
        7. Механизм разрешения deadlock.
        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если данные не указаны — "not_defined" / "Данные не определены".
        3. В evidence — только текст договора.
        4. Верни только один JSON-объект.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1:
        Фрагмент:
        "Ведение общих дел возлагается на Товарища 1. Товарищ 1 действует
        на основании доверенности. Сделки свыше 1 000 000 рублей требуют
        единогласного решения всех товарищей. Вопросы изменения цели
        товарищества решаются единогласно."
        Ответ:
        {
          "management_type": "single_partner",
          "managing_partner_status": "defined",
          "managing_partner_details": "Товарищ 1",
          "poa_required_status": "defined",
          "poa_required_details": "на основании доверенности",
          "decision_rule": "mixed",
          "unanimous_issues_status": "defined",
          "unanimous_issues_details": "сделки свыше 1 000 000 рублей; изменение цели",
          "authority_limits_status": "defined",
          "authority_limits_details": "сделки свыше 1 000 000 рублей требуют единогласного решения",
          "deadlock_mechanism_status": "not_defined",
          "deadlock_mechanism_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 3.1",
              "quote": "Ведение общих дел возлагается на Товарища 1."
            }
          ]
        }
        Пример 2:
        Фрагмент:
        "Товарищи ведут дела совместно."
        Ответ:
        {
          "management_type": "joint",
          "managing_partner_status": "not_defined",
          "managing_partner_details": "Данные не определены",
          "poa_required_status": "not_defined",
          "poa_required_details": "Данные не определены",
          "decision_rule": "not_defined",
          "unanimous_issues_status": "not_defined",
          "unanimous_issues_details": "Данные не определены",
          "authority_limits_status": "not_defined",
          "authority_limits_details": "Данные не определены",
          "deadlock_mechanism_status": "not_defined",
          "deadlock_mechanism_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 3.1",
              "quote": "Товарищи ведут дела совместно."
            }
          ]
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о типе управления.
        2. Найди прямую цитату о ведущем деле.
        3. Найди прямую цитату о доверенности.
        4. Найди прямую цитату о правиле принятия решений.
        5. Найди прямую цитату об ограничениях.
        6. Найди прямую цитату о deadlock.
        7. Если прямой цитаты нет — верни "not_defined".
        Не выводи шаги. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "management_type": "<joint / single_partner / multiple_partners / not_defined>",
          "managing_partner_status": "<defined / not_defined>",
          "managing_partner_details": "<имя или 'Данные не определены'>",
          "poa_required_status": "<defined / not_defined>",
          "poa_required_details": "<текст или 'Данные не определены'>",
          "decision_rule": "<unanimous / qualified_majority / simple_majority / mixed / not_defined>",
          "unanimous_issues_status": "<defined / not_defined>",
          "unanimous_issues_details": "<перечень или 'Данные не определены'>",
          "authority_limits_status": "<defined / not_defined>",
          "authority_limits_details": "<ограничения или 'Данные не определены'>",
          "deadlock_mechanism_status": "<defined / not_defined>",
          "deadlock_mechanism_details": "<механизм или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 7
      temperature: 0.0
      max_tokens: 700

    retrieval:
      retrieval_profile: "authority_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "ведение общих дел ведущий дела управляющий товарищ полномочия доверенность совместное ведение порядок принятия решений единогласное решение квалифицированное большинство deadlock тупиковая ситуация лимит сделки требуется согласие одобрение"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "вклад"
        - "распределение прибыли"
        - "выход из товарищества"
        - "прекращение"
        - "неустойка"
        - "налоговый учёт"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.20, 0.65]
        boost: 0.15
        scope: segment
      context_k: 7
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 1300

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора простого товарищества сведения
        о ведении дел, полномочиях, принятии решений и ограничениях.
        Не анализируй вклады, прибыль, прекращение или налоги.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:
        1. management_type — joint / single_partner / multiple_partners / not_defined.
        2. managing_partner_status — "defined" или "not_defined".
        3. managing_partner_details — имя ведущего дела товарища.
        4. poa_required_status — "defined" или "not_defined".
        5. poa_required_details — условие о доверенности.
        6. decision_rule — unanimous / qualified_majority / simple_majority / mixed / not_defined.
        7. unanimous_issues_status — "defined" или "not_defined".
        8. unanimous_issues_details — перечень вопросов для единогласия.
        9. authority_limits_status — "defined" или "not_defined".
        10. authority_limits_details — ограничения полномочий.
        11. deadlock_mechanism_status — "defined" или "not_defined".
        12. deadlock_mechanism_details — механизм разрешения deadlock.

        Если данные отсутствуют:
        - статус = "not_defined"
        - текст = "Данные не определены"
        </task>

        <rules>
        - Используй только текст договора.
        - decision_rule: "mixed" если сочетание единогласия для одних вопросов
          и большинства для других.
        - Верни только JSON.
        </rules>
      fields:
        - name: "management_type"
          type: "string"
          presentation: "signal"
          allowed_values: ["joint", "single_partner", "multiple_partners", "not_defined"]
          description: "Тип управления товариществом."
          required: true
        - name: "managing_partner_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
