        - name: "management_type"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Тип управления"
          allowed_values: ["joint", "single_partner", "multiple_partners", "not_defined"]
          description: "Тип управления товариществом."
          required: true

        - name: "poa_required_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
