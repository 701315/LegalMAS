          required: false

        - name: "termination_liability_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус ответственности при прекращении."
          required: false

        - name: "termination_liability_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Ответственность при прекращении"
          description: "Ответственность товарищей при прекращении негласного товарищества."
          required: false

        - name: "non_disclosure_prohibition"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 4
          label: "Запрет раскрытия"
          allowed_values: ["detected", "not_detected"]
          description: "Прямой запрет раскрывать существование товарищества третьим лицам."
          required: false

      store_payload: true

  - id: amendments_procedure
    name: "Порядок изменения договора простого товарищества"
    description: >
      Фактографическая проверка порядка изменения договора простого
      товарищества (ст. 450–453 ГК РФ): правило принятия изменений
      (единогласие / большинство), форма изменений (письменная /
      нотариальная), порядок государственной регистрации изменений,
      последствия отказа товарища от подписания, запрет одностороннего
      изменения.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 170

    rules:
      keywords:
        - "изменение договора"
        - "внесение изменений"
        - "дополнительное соглашение"
        - "порядок изменения"
        - "изменения оформляются"
        - "нотариальное удостоверение"
        - "государственная регистрация изменений"
        - "письменная форма изменений"
        - "отказ от подписания"
        - "одностороннее изменение"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)изменени[ея][а-яё]*\\s+договор"
        - "(?i)внесени[ея][а-яё]*\\s+изменени"
        - "(?i)дополнительн[а-яё]+\\s+соглашени"
        - "(?i)нотариальн[а-яё]+\\s+удостовер"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор простого товарищества (ст. 450–453 ГК РФ).
        Проверяется только один вопрос: порядок изменения договора.
        Нормативные ориентиры:
        - п. 1 ст. 450 ГК РФ — изменение договора по соглашению сторон.
        - п. 1 ст. 452 ГК РФ — соглашение об изменении совершается
          в той же форме, что и договор, если из закона, иных правовых
          актов, договора или обычаев не следует иное.
        - По умолчанию в ПТ — единогласие товарищей (по аналогии с п. 1
          ст. 450 ГК РФ при отсутствии иного в договоре).
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Различай: изменение договора (ст. 450–453) и принятие решений
          по текущим вопросам (ст. 1044) — разные механизмы.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Правило принятия изменений в договор (единогласие /
           квалифицированное большинство / простое большинство).
        2. Форму изменений (письменная / нотариальная / иная).
        3. Порядок государственной регистрации изменений (для недвижимого
           имущества, ЕГРЮЛ для управляющего товарища).
        4. Последствия отказа товарища от подписания изменений.
        5. Наличие запрета на одностороннее изменение договора.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Для enum-полей (*_status, amendment_rule) при отсутствии данных
           возвращай "not_defined"; для unilateral_amendment_prohibition —
           "not_detected".
        4. Для строковых *_details при отсутствии данных возвращай строго
           "Данные не определены".
        5. Не используй "None", "null", пустые строки или отсутствующие ключи.
        6. В evidence включай только прямые цитаты из текста договора.
        7. amendment_rule: "unanimous" / "qualified_majority" /
           "simple_majority" / "not_defined".
        8. unilateral_amendment_prohibition = "detected" только если прямо
           указан запрет одностороннего изменения.
        9. Верни РОВНО один валидный JSON-объект со всеми 11 ключами
           (10 полей + evidence), пригодный для парсинга через json.loads
           без предварительной обработки. Без markdown, без ```json,
           без комментариев, без текста до или после. Начни ответ сразу
           с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — единогласие, письменная форма:
        Фрагмент:
        "Все изменения и дополнения к настоящему договору совершаются
        по единогласному решению всех товарищей и оформляются письменными
        дополнительными соглашениями, подписываемыми всеми товарищами.
        Односторонний отказ от подписания допсоглашения влечёт для
        отказавшегося товарища обязанность возместить убытки."
        Ответ:
        {
          "amendment_procedure_status": "defined",
          "amendment_procedure_details": "изменения по единогласному решению, письменные допсоглашения",
          "amendment_rule": "unanimous",
          "amendment_form_requirement_status": "defined",
          "amendment_form_requirement_details": "письменные дополнительные соглашения, подписываемые всеми товарищами",
          "amendment_registration_status": "not_defined",
          "amendment_registration_details": "Данные не определены",
          "amendment_refusal_consequences_status": "defined",
          "amendment_refusal_consequences_details": "отказавшийся от подписания товарищ возмещает убытки",
          "unilateral_amendment_prohibition": "detected",
          "evidence": [
            {"clause_ref": "п. 15.1", "quote": "Все изменения и дополнения к настоящему договору совершаются по единогласному решению всех товарищей и оформляются письменными дополнительными соглашениями, подписываемыми всеми товарищами."},
            {"clause_ref": "п. 15.2", "quote": "Односторонний отказ от подписания допсоглашения влечёт для отказавшегося товарища обязанность возместить убытки."}
          ]
        }

        Пример 2 — квалифицированное большинство для изменений:
        Фрагмент:
        "Изменения в настоящий договор вносятся решением товарищей,
        принятым квалифицированным большинством (не менее 2/3 голосов).
        Изменения оформляются в письменной форме."
        Ответ:
        {
          "amendment_procedure_status": "defined",
          "amendment_procedure_details": "изменения вносятся решением квалифицированного большинства (не менее 2/3)",
          "amendment_rule": "qualified_majority",
          "amendment_form_requirement_status": "defined",
          "amendment_form_requirement_details": "письменная форма",
          "amendment_registration_status": "not_defined",
          "amendment_registration_details": "Данные не определены",
          "amendment_refusal_consequences_status": "not_defined",
          "amendment_refusal_consequences_details": "Данные не определены",
          "unilateral_amendment_prohibition": "not_detected",
          "evidence": [
            {"clause_ref": "п. 15.1", "quote": "Изменения в настоящий договор вносятся решением товарищей, принятым квалифицированным большинством (не менее 2/3 голосов)."},
            {"clause_ref": "п. 15.2", "quote": "Изменения оформляются в письменной форме."}
          ]
        }

        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Стороны обязуются исполнять договор."
        Ответ:
        {
          "amendment_procedure_status": "not_defined",
          "amendment_procedure_details": "Данные не определены",
          "amendment_rule": "not_defined",
          "amendment_form_requirement_status": "not_defined",
          "amendment_form_requirement_details": "Данные не определены",
          "amendment_registration_status": "not_defined",
          "amendment_registration_details": "Данные не определены",
          "amendment_refusal_consequences_status": "not_defined",
          "amendment_refusal_consequences_details": "Данные не определены",
          "unilateral_amendment_prohibition": "not_detected",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Все 11 ключей (10 полей + evidence) присутствуют в JSON?
        2. amendment_rule — строго из allowed_values?
        3. Все *_status — строго "defined" / "not_defined"?
        4. unilateral_amendment_prohibition — строго "detected" / "not_detected"?
        5. Определены ли форма и порядок регистрации изменений?
        6. Все *_details заполнены или "Данные не определены"?
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "amendment_procedure_status": "<defined / not_defined>",
          "amendment_procedure_details": "<текст или 'Данные не определены'>",
          "amendment_rule": "<unanimous / qualified_majority / simple_majority / not_defined>",
          "amendment_form_requirement_status": "<defined / not_defined>",
          "amendment_form_requirement_details": "<текст или 'Данные не определены'>",
          "amendment_registration_status": "<defined / not_defined>",
          "amendment_registration_details": "<текст или 'Данные не определены'>",
          "amendment_refusal_consequences_status": "<defined / not_defined>",
          "amendment_refusal_consequences_details": "<текст или 'Данные не определены'>",
          "unilateral_amendment_prohibition": "<detected / not_detected>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 750

    retrieval:
      retrieval_profile: "termination_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "изменение договора внесение изменений дополнительное соглашение порядок изменения изменения оформляются нотариальное удостоверение государственная регистрация изменений письменная форма изменений отказ от подписания одностороннее изменение"
      preferred_unit_types:
        - amendment
        - general_provision
        - obligation
      excluded_unit_types:
        - definition
        - technical_fragment
      preferred_clause_functions:
        - boilerplate
        - procedures
      negative_keywords:
        - "вклад товарища"
        - "распределение прибыли"
        - "налоговый учёт"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.60, 1.0]
        boost: 0.15
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "boilerplate"
        - "procedures"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1500

      compact_output: false

      presence_signal:
        field: "amendments_procedure_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора простого товарищества
        сведения о порядке изменения договора: правило, форма, регистрация,
        последствия отказа, запрет одностороннего изменения.
        Не анализируй вклады как таковые, распределение прибыли, налоговый
        учёт или прекращение товарищества.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. amendments_procedure_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (amendment_procedure_status, amendment_rule,
              amendment_form_requirement_status,
              amendment_registration_status,
              amendment_refusal_consequences_status) ≠ "not_defined",
             либо unilateral_amendment_prohibition = "detected";
           - "missing" — если все пять *_status/rule = "not_defined"
             и unilateral_amendment_prohibition = "not_detected";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - amendment_procedure_status = "not_defined";
           - amendment_rule = "not_defined";
           - amendment_form_requirement_status = "not_defined";
           - amendment_registration_status = "not_defined";
           - amendment_refusal_consequences_status = "not_defined";
           - unilateral_amendment_prohibition = "not_detected";
           - все *_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. amendment_procedure_status:
           - "defined" — если прямо указан порядок изменения договора
             (правило принятия, форма, регистрация);
           - "not_defined" — иначе.

        2. amendment_procedure_details:
           Краткое user-facing описание порядка изменения.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        3. amendment_rule:
           Используй только одно из значений:
           - "unanimous" — единогласие;
           - "qualified_majority" — квалифицированное большинство;
           - "simple_majority" — простое большинство;
           - "not_defined" — иначе.

        4. amendment_form_requirement_status:
           - "defined" — если прямо указана форма изменений
             (письменная / нотариальная / иная);
           - "not_defined" — иначе.

        5. amendment_form_requirement_details:
           Краткое user-facing описание формы.
           Если указано «в той же форме» — фиксируй форму из договора.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        6. amendment_registration_status:
           - "defined" — если прямо указан порядок государственной
             регистрации изменений (для недвижимости, ЕГРЮЛ);
           - "not_defined" — иначе.

        7. amendment_registration_details:
           Краткое user-facing описание порядка регистрации.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        8. amendment_refusal_consequences_status:
           - "defined" — если прямо указаны последствия отказа
             товарища от подписания изменений;
           - "not_defined" — иначе.

        9. amendment_refusal_consequences_details:
           Краткое user-facing описание последствий отказа.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        10. unilateral_amendment_prohibition:
            Используй только одно из значений:
            - "detected" — если в договоре прямо установлен запрет
              на одностороннее изменение договора;
            - "not_detected" — если такого условия в тексте нет.
        </task>

        <context_rules>
        - Перед остальными полями заполни amendments_procedure_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не делай выводов по типовой структуре договора.
        - Не извлекай сведения о вкладах как таковых, распределении прибыли, налоговом учёте, прекращении товарищества и иных нерелевантных темах.
        - amendment_rule: "unanimous" / "qualified_majority" / "simple_majority" / "not_defined".
        - amendment_form_requirement_details: письменная / нотариальная форма; если указано «в той же форме» — фиксируй форму из договора.
        - amendment_registration_details: для недвижимости (218-ФЗ), для инвесттоварищества (ЕГРЮЛ по 335-ФЗ).
        - unilateral_amendment_prohibition = "detected" только если прямо указан запрет одностороннего изменения.
        - Если в разных фрагментах указаны противоречивые сведения — статус → "not_defined", текстовое поле → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни правила принятия изменений, ни формы, ни порядка
           регистрации, ни последствий отказа, ни запрета одностороннего
           изменения.
           → presence = "missing";
             все *_status = "not_defined";
             amendment_rule = "not_defined";
             unilateral_amendment_prohibition = "not_detected";
             все *_details = "Данные не определены".

        2. Неполное раскрытие или прямое исключение.
           а) Общая фраза: «Изменения вносятся в порядке, установленном
              законодательством» без конкретики.
              → presence = "present";
                amendment_procedure_status = "not_defined";
                amendment_rule = "not_defined".
           б) Прямо указано, что односторонние изменения допускаются
              или что форма изменений — устная.
              → presence = "present";
                amendment_procedure_status = "defined";
                unilateral_amendment_prohibition = "not_detected";
                соответствующие *_details содержат дословную формулировку.

        3. Противоречие между фрагментами.
           В разных частях договора указаны противоречивые правила
           принятия изменений или разные формы.
           → presence = "unclear";
             amendment_rule = "not_defined";
             amendment_form_requirement_status = "not_defined";
             соответствующий *_details = "Не удалось определить".

        4. Специфика темы — единогласие с запретом одностороннего
           изменения.
           Указано, что изменения принимаются единогласно, оформляются
           письменно, односторонние изменения не допускаются.
           → presence = "present";
             amendment_procedure_status = "defined";
             amendment_rule = "unanimous";
             amendment_form_requirement_status = "defined";
             unilateral_amendment_prohibition = "detected".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для amendments_procedure_presence используй только: "present", "missing", "unclear".
        - Для enum-полей *_status используй только: "defined", "not_defined".
        - Для amendment_rule используй только: "unanimous", "qualified_majority", "simple_majority", "not_defined".
        - Для unilateral_amendment_prohibition используй только: "detected", "not_detected".
        - Fallback при отсутствии данных:
          * все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "amendments_procedure_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по порядку изменения договора. Внутреннее агрегатное signal-поле."
          required: true

        - name: "amendment_procedure_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения порядка изменения договора."
          required: true

        - name: "amendment_procedure_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Порядок изменения"
          description: "Порядок изменения договора простого товарищества."
          required: true

        - name: "amendment_rule"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Правило изменения"
          allowed_values: ["unanimous", "qualified_majority", "simple_majority", "not_defined"]
          description: "Правило принятия изменений в договор."
          required: false

        - name: "amendment_form_requirement_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус требования к форме изменений."
          required: false

        - name: "amendment_form_requirement_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Форма изменений"
          description: "Требование к форме изменений (для Drawer)."
          required: false

        - name: "amendment_registration_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус порядка государственной регистрации изменений."
          required: false

        - name: "amendment_registration_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Регистрация изменений"
          description: "Порядок государственной регистрации изменений (для Drawer)."
          required: false

        - name: "amendment_refusal_consequences_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус последствий отказа от подписания изменений."
          required: false

        - name: "amendment_refusal_consequences_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Последствия отказа"
          description: "Последствия отказа товарища от подписания изменений."
          required: false

        - name: "unilateral_amendment_prohibition"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 4
          label: "Запрет одностороннего изменения"
          allowed_values: ["detected", "not_detected"]
          description: "Наличие прямого запрета на одностороннее изменение договора."
          required: false

      store_payload: true

  - id: specific_partnership_forms
    name: "Признаки специальных режимов (инвесттоварищество, СРП, долевое строительство)"
    description: >
      Фактографическая проверка признаков специальных правовых режимов,
      ошибочно оформляемых как обычное простое товарищество: инвестиционное
      товарищество (ФЗ №335 от 28.11.2011), соглашение о разделе продукции
      (ФЗ №225 от 30.12.1995), долевое строительство (214-ФЗ от 30.12.2004).
      Проверка соответствия формальным требованиям и наличия риска
      переквалификации в притворную сделку (ст. 170 ГК РФ).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 180

    rules:
      keywords:
        - "инвестиционное товарищество"
        - "общий капитал"
        - "управляющий товарищ"
        - "инвестиционная декларация"
        - "соглашение о разделе продукции"
        - "раздел продукции"
        - "полезные ископаемые"
        - "долевое строительство"
        - "участник долевого строительства"
        - "застройщик"
        - "жилой дом"
        - "объект долевого строительства"
        - "нотариальное удостоверение"
        - "ЕГРЮЛ"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)инвестиционн[а-яё]+\\s+товариществ"
        - "(?i)общ[а-яё]+\\s+капитал"
        - "(?i)управляющ[а-яё]+\\s+товарищ"
        - "(?i)раздел[а-яё]*\\s+продукц"
        - "(?i)(долев[а-яё]+\\s+строительств|застройщик|участник[а-яё]*\\s+долевого)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор простого товарищества.
        Проверяется только один вопрос: признаки специальных правовых
        режимов, ошибочно оформляемых как обычное ПТ.
        Нормативные ориентиры:
        - ФЗ №335 от 28.11.2011 «Об инвестиционном товариществе» —
          отдельный правовой режим; требует нотариального удостоверения
          договора и внесения в ЕГРЮЛ сведений об управляющем товарище.
        - ФЗ №225 от 30.12.1995 «О соглашениях о разделе продукции» —
          специальный режим для разработки месторождений полезных
          ископаемых.
        - ФЗ №214 от 30.12.2004 «Об участии в долевом строительстве»
          — специальный режим для строительства жилья с привлечением
          средств граждан и юридических лиц.
        - ст. 170 ГК РФ — мнимая / притворная сделка (при использовании
          ПТ вместо специального режима).
        - ст. 173.1 УК РФ — незаконное создание юридического лица.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Если признаков специального режима нет — фиксируй отсутствие,
          НЕ выводя режим по умолчанию.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Признаки инвестиционного товарищества (общий капитал,
           управляющий товарищ, инвестиционная декларация).
        2. Соответствие договора требованиям ФЗ №335 (нотариальное
           удостоверение, регистрация в ЕГРЮЛ).
        3. Признаки соглашения о разделе продукции (разработка
           месторождений, раздел продукции, полезные ископаемые).
        4. Признаки долевого строительства (застройщик, участники,
           жилые помещения, привлечение средств).

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Для enum-полей (investment_partnership_signs_code, srp_signs_code,
           construction_signs_code) при отсутствии данных возвращай
           "not_detected"; для investment_partnership_compliance —
           "not_applicable" при отсутствии признаков инвесттоварищества,
           иначе "not_defined" при невозможности оценить.
        4. Для строковых *_details при отсутствии данных возвращай строго
           "Данные не определены".
        5. Не используй "None", "null", пустые строки или отсутствующие ключи.
        6. В evidence включай только прямые цитаты из текста договора.
        7. investment_partnership_compliance: "compliant" (соблюдены
           нотариат и ЕГРЮЛ) / "partially" (частично соблюдены) /
           "non_compliant" (признаки есть, соблюдение отсутствует) /
           "not_applicable" / "not_defined".
        8. investment_registration_status = "defined" если прямо указано
           нотариальное удостоверение или регистрация в ЕГРЮЛ.
        9. Верни РОВНО один валидный JSON-объект со всеми 11 ключами
           (10 полей + evidence), пригодный для парсинга через json.loads
           без предварительной обработки. Без markdown, без ```json,
           без комментариев, без текста до или после. Начни ответ сразу
           с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — признаки инвесттоварищества без соответствия 335-ФЗ:
        Фрагмент:
        "Товарищи объединяют общий капитал в размере 100 000 000 рублей
        для инвестирования в объекты недвижимости на территории
        Московской области. Управление общим капиталом осуществляет
        Управляющий товарищ — ООО «Инвест-Пример». Инвестиционная
        декларация является приложением к договору. Нотариальное
        удостоверение не предусмотрено."
        Ответ:
        {
          "investment_partnership_signs_code": "detected",
          "investment_partnership_signs_details": "общий капитал 100 000 000 рублей, управляющий товарищ, инвестиционная декларация",
          "investment_partnership_compliance": "non_compliant",
          "investment_registration_status": "defined",
          "investment_registration_details": "нотариальное удостоверение не предусмотрено (требуется по ст. 4 ФЗ №335)",
          "srp_signs_code": "not_detected",
          "srp_signs_details": "Данные не определены",
          "construction_signs_code": "not_detected",
          "construction_signs_details": "Данные не определены",
          "requalification_risk_summary": "признаки инвестиционного товарищества без соблюдения требований ФЗ №335: риск переквалификации и доначислений",
          "evidence": [
            {"clause_ref": "п. 1.1", "quote": "Товарищи объединяют общий капитал в размере 100 000 000 рублей для инвестирования в объекты недвижимости на территории Московской области."},
            {"clause_ref": "п. 2.1", "quote": "Управление общим капиталом осуществляет Управляющий товарищ — ООО «Инвест-Пример»."},
            {"clause_ref": "п. 3.1", "quote": "Инвестиционная декларация является приложением к договору."},
            {"clause_ref": "п. 4.1", "quote": "Нотариальное удостоверение не предусмотрено."}
          ]
        }

        Пример 2 — признаки долевого строительства:
        Фрагмент:
        "Товарищи привлекают денежные средства граждан для строительства
        многоквартирного жилого дома по адресу г. Москва, ул. Примерная,
        д. 1. По завершении строительства участникам передаются квартиры
        в собственность."
        Ответ:
        {
          "investment_partnership_signs_code": "not_detected",
          "investment_partnership_signs_details": "Данные не определены",
          "investment_partnership_compliance": "not_applicable",
          "investment_registration_status": "not_defined",
          "investment_registration_details": "Данные не определены",
          "srp_signs_code": "not_detected",
          "srp_signs_details": "Данные не определены",
          "construction_signs_code": "detected",
          "construction_signs_details": "привлечение средств граждан для строительства многоквартирного жилого дома с последующей передачей квартир",
          "requalification_risk_summary": "признаки долевого строительства по 214-ФЗ: риск переквалификации в притворную сделку (ст. 170 ГК РФ)",
          "evidence": [
            {"clause_ref": "п. 1.1", "quote": "Товарищи привлекают денежные средства граждан для строительства многоквартирного жилого дома по адресу г. Москва, ул. Примерная, д. 1."},
            {"clause_ref": "п. 1.2", "quote": "По завершении строительства участникам передаются квартиры в собственность."}
          ]
        }

        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Стороны обязуются исполнять договор."
        Ответ:
        {
          "investment_partnership_signs_code": "not_detected",
          "investment_partnership_signs_details": "Данные не определены",
          "investment_partnership_compliance": "not_applicable",
          "investment_registration_status": "not_defined",
          "investment_registration_details": "Данные не определены",
          "srp_signs_code": "not_detected",
          "srp_signs_details": "Данные не определены",
          "construction_signs_code": "not_detected",
          "construction_signs_details": "Данные не определены",
          "requalification_risk_summary": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Все 11 ключей (10 полей + evidence) присутствуют в JSON?
        2. investment_partnership_signs_code / srp_signs_code /
           construction_signs_code — строго "detected" / "not_detected"?
        3. investment_partnership_compliance — строго из allowed_values?
        4. Проверено ли соответствие требованиям 335-ФЗ
           (нотариат + ЕГРЮЛ)?
        5. Проверены ли признаки СРП и долевого строительства?
        6. Все *_details заполнены или "Данные не определены"?
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "investment_partnership_signs_code": "<detected / not_detected>",
          "investment_partnership_signs_details": "<текст или 'Данные не определены'>",
          "investment_partnership_compliance": "<compliant / partially / non_compliant / not_applicable / not_defined>",
          "investment_registration_status": "<defined / not_defined>",
          "investment_registration_details": "<текст или 'Данные не определены'>",
          "srp_signs_code": "<detected / not_detected>",
          "srp_signs_details": "<текст или 'Данные не определены'>",
          "construction_signs_code": "<detected / not_detected>",
          "construction_signs_details": "<текст или 'Данные не определены'>",
          "requalification_risk_summary": "<сводная оценка или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 800

    retrieval:
      retrieval_profile: "definitions_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "инвестиционное товарищество общий капитал управляющий товарищ инвестиционная декларация нотариальное удостоверение ЕГРЮЛ соглашение о разделе продукции раздел продукции полезные ископаемые долевое строительство участник долевого строительства застройщик жилой дом объект долевого строительства"
      preferred_unit_types:
        - general_provision
        - obligation
        - definition
      excluded_unit_types:
        - technical_fragment
      preferred_clause_functions:
        - definitions
        - boilerplate
      negative_keywords:
        - "вклад товарища"
        - "распределение прибыли"
        - "налоговый учёт"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 0.45]
        boost: 0.15
        scope: segment
      context_k: 10
      max_chunks: 14
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "definitions"
        - "boilerplate"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1600

      compact_output: false

      presence_signal:
        field: "specific_partnership_forms_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора простого товарищества
        сведения о признаках специальных правовых режимов: инвестиционное
        товарищество (ФЗ №335), СРП (ФЗ №225), долевое строительство
        (214-ФЗ). Определи соответствие формальным требованиям.
        Не анализируй вклады как таковые, распределение прибыли,
        налоговый учёт или прекращение.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. specific_partnership_forms_presence:
           Агрегатное signal-поле — наличие признаков специальных
           правовых режимов.
           - "present" — если хотя бы одно из содержательных полей
             (investment_partnership_signs_code, srp_signs_code,
              construction_signs_code) = "detected",
             либо investment_partnership_compliance ≠ "not_applicable"
             и ≠ "not_defined",
             либо investment_registration_status = "defined";
           - "missing" — если все признаки = "not_detected",
             investment_partnership_compliance = "not_applicable",
             investment_registration_status = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - investment_partnership_signs_code = "not_detected";
           - srp_signs_code = "not_detected";
           - construction_signs_code = "not_detected";
           - investment_partnership_compliance = "not_applicable";
           - investment_registration_status = "not_defined";
           - все *_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. investment_partnership_signs_code:
           Используй только одно из значений:
           - "detected" — если в тексте есть признаки инвестиционного
             товарищества (общий капитал, управляющий товарищ,
             инвестиционная декларация);
           - "not_detected" — иначе.

        2. investment_partnership_signs_details:
           Краткое user-facing обоснование признаков.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        3. investment_partnership_compliance:
           Используй только одно из значений:
           - "compliant" — если соблюдены оба требования (нотариат + ЕГРЮЛ);
           - "partially" — если соблюдено одно из двух;
           - "non_compliant" — если признаки есть, но ни одно
             не соблюдено;
           - "not_applicable" — если признаков инвесттоварищества нет;
           - "not_defined" — если оценить невозможно.

        4. investment_registration_status:
           - "defined" — если прямо указано нотариальное удостоверение
             или регистрация в ЕГРЮЛ;
           - "not_defined" — иначе.

        5. investment_registration_details:
           Краткое user-facing описание.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        6. srp_signs_code:
           Используй только одно из значений:
           - "detected" — если в тексте есть признаки СРП (разработка
             месторождений, раздел продукции, полезные ископаемые);
           - "not_detected" — иначе.

        7. srp_signs_details:
           Краткое user-facing обоснование признаков СРП.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        8. construction_signs_code:
           Используй только одно из значений:
           - "detected" — если в тексте есть признаки долевого
             строительства (застройщик, участники, жилые помещения,
             привлечение средств);
           - "not_detected" — иначе.

        9. construction_signs_details:
           Краткое user-facing обоснование признаков долевого
           строительства.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        10. requalification_risk_summary:
            Краткая user-facing сводка — какие признаки обнаружены
            и в чём риск переквалификации.
            Если данных нет — "Данные не определены".
            Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни specific_partnership_forms_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_signs_code = "not_detected", investment_partnership_compliance = "not_applicable", все *_details = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не делай выводов по типовой структуре договора.
        - Не извлекай сведения о вкладах как таковых, распределении прибыли, налоговом учёте, прекращении товарищества и иных нерелевантных темах.
        - investment_partnership_compliance = "not_applicable" если признаков инвесттоварищества нет.
        - "non_compliant" — признаки есть, но нотариат / ЕГРЮЛ отсутствуют.
        - "partially" — соблюдено одно из двух требований.
        - "compliant" — соблюдены оба (нотариат + ЕГРЮЛ).
        - requalification_risk_summary: краткая сводка — какие признаки обнаружены и в чём риск.
        - Если в разных фрагментах указаны противоречивые сведения — статус → "not_defined", текстовое поле → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни признаков инвесттоварищества, ни признаков
           СРП, ни признаков долевого строительства.
           → presence = "missing";
             все *_signs_code = "not_detected";
             investment_partnership_compliance = "not_applicable";
             investment_registration_status = "not_defined";
             все *_details = "Данные не определены".

        2. Неполное раскрытие или прямое исключение.
           а) Общая фраза: «Товарищи объединяют усилия для инвестиций»
              без указания управляющего товарища, декларации и специальной
              формы — признаков инвесттоварищества недостаточно.
              → presence = "present";
                investment_partnership_signs_code = "not_detected";
                investment_partnership_compliance = "not_applicable".
           б) Прямо указано, что товарищество создано для строительства
              без привлечения средств граждан — признаков долевого
              строительства нет.
              → presence = "present";
                construction_signs_code = "not_detected";
                соответствующие *_details содержат дословную формулировку.

        3. Противоречие между фрагментами.
           В разных частях договора указаны противоречивые признаки
           (например, в одном месте — общий капитал, в другом —
           отрицание инвестиционного характера).
           → presence = "unclear";
             investment_partnership_signs_code = "not_detected";
             соответствующий *_details = "Не удалось определить".

        4. Специфика темы — признаки есть, но формальные требования
           не соблюдены.
           Указаны общий капитал, управляющий товарищ, декларация,
           но нотариальное удостоверение / ЕГРЮЛ отсутствуют.
           → presence = "present";
             investment_partnership_signs_code = "detected";
             investment_partnership_compliance = "non_compliant";
             investment_registration_status = "defined";
             requalification_risk_summary содержит дословную
             формулировку риска.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для specific_partnership_forms_presence используй только: "present", "missing", "unclear".
        - Для investment_partnership_signs_code / srp_signs_code / construction_signs_code используй только: "detected", "not_detected".
        - Для investment_partnership_compliance используй только: "compliant", "partially", "non_compliant", "not_applicable", "not_defined".
        - Для investment_registration_status используй только: "defined", "not_defined".
        - Fallback при отсутствии данных:
          * все *_details и requalification_risk_summary → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "specific_partnership_forms_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие признаков специальных правовых режимов. Внутреннее агрегатное signal-поле."
          required: true

        - name: "investment_partnership_signs_code"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Признаки инвесттоварищества"
          allowed_values: ["detected", "not_detected"]
          description: "Признаки инвестиционного товарищества (ФЗ №335)."
          required: true

        - name: "investment_partnership_signs_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Основание признаков"
          description: "Обоснование признаков инвесттоварищества (для Drawer)."
          required: false

        - name: "investment_partnership_compliance"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Соответствие 335-ФЗ"
          allowed_values: ["compliant", "partially", "non_compliant", "not_applicable", "not_defined"]
          description: "Соответствие требованиям ФЗ №335 (нотариат + ЕГРЮЛ)."
          required: false

        - name: "investment_registration_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения регистрации / нотариата."
          required: false

        - name: "investment_registration_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Регистрация / нотариат"
          description: "Указание нотариального удостоверения или регистрации в ЕГРЮЛ (для Drawer)."
          required: false

        - name: "srp_signs_code"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Признаки СРП"
          allowed_values: ["detected", "not_detected"]
          description: "Признаки соглашения о разделе продукции (ФЗ №225)."
          required: false

        - name: "srp_signs_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Основание СРП"
          description: "Обоснование признаков СРП (для Drawer)."
          required: false

        - name: "construction_signs_code"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 4
          label: "Признаки долевого строительства"
          allowed_values: ["detected", "not_detected"]
          description: "Признаки долевого строительства (214-ФЗ)."
          required: false

        - name: "construction_signs_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Основание 214-ФЗ"
          description: "Обоснование признаков долевого строительства (для Drawer)."
          required: false

        - name: "requalification_risk_summary"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 5
          label: "Итоговая оценка"
          description: "Сводная оценка риска переквалификации."
          required: false

      store_payload: true

  - id: controlled_transactions_and_related_parties
    name: "Взаимозависимость товарищей и контролируемые сделки (ст. 105.14 НК РФ)"
    description: >
      Фактографическая проверка взаимозависимости товарищей (ст. 105.1
      НК РФ), применимости режима контролируемых сделок (ст. 105.14 НК РФ),
      порогов оборота и наличия обоснования рыночности цен (ст. 105.3 НК РФ)
      по операциям через простое товарищество.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 190

    rules:
      keywords:
        - "взаимозависимые лица"
        - "взаимозависимость"
        - "аффилированные лица"
        - "контролируемые сделки"
        - "рыночная цена"
        - "рыночная стоимость"
        - "обоснование цены"
        - "порог оборота"
        - "уведомление о контролируемых сделках"
        - "общие участники"
        - "общие акционеры"
        - "общее руководство"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)взаимозависим[а-яё]+\\s+лиц"
        - "(?i)аффилированн[а-яё]+\\s+лиц"
        - "(?i)контролируем[а-яё]+\\s+сделк"
        - "(?i)рыночн[а-яё]+\\s+(цен|стоимост)"
        - "(?i)порог[а-яё]*\\s+оборот"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор простого товарищества.
        Проверяется только один вопрос: взаимозависимость товарищей
        и применимость режима контролируемых сделок.
        Нормативные ориентиры:
        - ст. 105.1 НК РФ — взаимозависимые лица (участие >25%,
          общие руководители, супруги, родственники и др.).
        - ст. 105.14 НК РФ — контролируемые сделки (внутрироссийские —
          при обороте > 1 млрд руб.; отдельные пороги для иностранных
          лиц, банков, спецрежимов).
        - ст. 105.3 НК РФ — цены в контролируемых сделках должны
          соответствовать рыночным.
        - ст. 129.3–129.4 НК РФ — доначисления и штрафы по контролируемым
          сделкам.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Если товарищи явно не взаимозависимы — фиксируй отсутствие
          признаков, НЕ выводя взаимозависимость автоматически.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Признаки взаимозависимости товарищей (участие >25%, общие
           руководители, общие участники).
        2. Условие о контролируемых сделках или их признаках.
        3. Порог оборота операций через товарищество.
        4. Наличие обоснования рыночности цен по операциям.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Для enum-полей (interdependence_status, interdependence_grounds_code,
           *_status) при отсутствии данных возвращай "not_defined".
        4. Для строковых *_details при отсутствии данных возвращай строго
           "Данные не определены".
        5. Не используй "None", "null", пустые строки или отсутствующие ключи.
        6. В evidence включай только прямые цитаты из текста договора.
        7. interdependence_grounds_code: "equity_participation" (взаимное
           участие), "common_management" (общие руководители),
           "common_owners" (общие участники), "other", "not_defined".
        8. Верни РОВНО один валидный JSON-объект со всеми 10 ключами
           (9 полей + evidence), пригодный для парсинга через json.loads
           без предварительной обработки. Без markdown, без ```json,
           без комментариев, без текста до или после. Начни ответ сразу
           с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — взаимозависимость есть, контролируемые сделки применимы:
        Фрагмент:
        "Товарищами являются ООО «Альфа» и ООО «Бета», в которых 100 %
        участия принадлежит одному лицу — Петрову П.П. Оборот операций
        через товарищество превышает 1 млрд рублей в год. Стороны
        подтверждают, что цены по операциям соответствуют рыночным."
        Ответ:
        {
          "interdependence_status": "defined",
          "interdependence_details": "ООО «Альфа» и ООО «Бета» на 100 % принадлежат одному участнику — Петрову П.П.",
          "interdependence_grounds_code": "common_owners",
          "controlled_transactions_status": "defined",
          "controlled_transactions_details": "оборот операций через товарищество превышает 1 млрд рублей в год",
          "turnover_threshold_status": "defined",
          "turnover_threshold_details": "превышение 1 млрд рублей в год",
          "market_valuation_basis_status": "defined",
          "market_valuation_basis_details": "стороны подтверждают соответствие цен рыночным",
          "evidence": [
            {"clause_ref": "п. 1.1", "quote": "Товарищами являются ООО «Альфа» и ООО «Бета», в которых 100 % участия принадлежит одному лицу — Петрову П.П."},
            {"clause_ref": "п. 4.2", "quote": "Оборот операций через товарищество превышает 1 млрд рублей в год."},
            {"clause_ref": "п. 4.3", "quote": "Стороны подтверждают, что цены по операциям соответствуют рыночным."}
          ]
        }

        Пример 2 — товарищи независимы:
        Фрагмент:
        "Товарищами являются независимые юридические лица,
        не связанные между собой отношениями участия или управления."
        Ответ:
        {
          "interdependence_status": "defined",
          "interdependence_details": "товарищи — независимые юридические лица без отношений участия или управления",
          "interdependence_grounds_code": "not_defined",
          "controlled_transactions_status": "not_defined",
          "controlled_transactions_details": "Данные не определены",
          "turnover_threshold_status": "not_defined",
          "turnover_threshold_details": "Данные не определены",
          "market_valuation_basis_status": "not_defined",
          "market_valuation_basis_details": "Данные не определены",
          "evidence": [
            {"clause_ref": "п. 1.2", "quote": "Товарищами являются независимые юридические лица, не связанные между собой отношениями участия или управления."}
          ]
        }

        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Стороны обязуются исполнять договор."
        Ответ:
        {
          "interdependence_status": "not_defined",
          "interdependence_details": "Данные не определены",
          "interdependence_grounds_code": "not_defined",
          "controlled_transactions_status": "not_defined",
          "controlled_transactions_details": "Данные не определены",
          "turnover_threshold_status": "not_defined",
          "turnover_threshold_details": "Данные не определены",
          "market_valuation_basis_status": "not_defined",
          "market_valuation_basis_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Все 10 ключей (9 полей + evidence) присутствуют в JSON?
        2. interdependence_grounds_code — строго из allowed_values?
        3. Все *_status — строго "defined" / "not_defined"?
        4. Проверены ли признаки взаимозависимости?
        5. Проверен ли порог оборота?
        6. Проверено ли обоснование рыночности цен?
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "interdependence_status": "<defined / not_defined>",
          "interdependence_details": "<текст или 'Данные не определены'>",
          "interdependence_grounds_code": "<equity_participation / common_management / common_owners / other / not_defined>",
          "controlled_transactions_status": "<defined / not_defined>",
          "controlled_transactions_details": "<текст или 'Данные не определены'>",
          "turnover_threshold_status": "<defined / not_defined>",
          "turnover_threshold_details": "<текст или 'Данные не определены'>",
          "market_valuation_basis_status": "<defined / not_defined>",
          "market_valuation_basis_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 700

    retrieval:
      retrieval_profile: "tax_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "взаимозависимые лица взаимозависимость аффилированные лица контролируемые сделки рыночная цена рыночная стоимость обоснование цены порог оборота уведомление о контролируемых сделках общие участники общие акционеры общее руководство"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - definitions
      negative_keywords:
        - "вклад товарища"
        - "распределение прибыли"
        - "выход из товарищества"
        - "прекращение"
        - "неустойка"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 0.40]
        boost: 0.15
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "definitions"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1400

      compact_output: false

      presence_signal:
        field: "controlled_transactions_and_related_parties_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора простого товарищества
        сведения о взаимозависимости товарищей и контролируемых сделках.
        Не анализируй вклады как таковые, распределение прибыли,
        ведение дел или прекращение.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. controlled_transactions_and_related_parties_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (interdependence_status, interdependence_grounds_code,
              controlled_transactions_status,
              turnover_threshold_status,
              market_valuation_basis_status) ≠ "not_defined";
           - "missing" — если все пять содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - interdependence_status = "not_defined";
           - interdependence_grounds_code = "not_defined";
           - controlled_transactions_status = "not_defined";
           - turnover_threshold_status = "not_defined";
           - market_valuation_basis_status = "not_defined";
           - все *_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. interdependence_status:
           - "defined" — если прямо указаны признаки взаимозависимости
             товарищей (участие >25%, общие руководители, общие
             участники) либо прямое отрицание такой связи;
           - "not_defined" — иначе.

        2. interdependence_details:
           Краткое user-facing описание признаков взаимозависимости.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        3. interdependence_grounds_code:
           Используй только одно из значений:
           - "equity_participation" — взаимное участие в капитале;
           - "common_management" — общие руководители / органы управления;
           - "common_owners" — общие участники / акционеры;
           - "other" — иное основание;
           - "not_defined" — иначе.

        4. controlled_transactions_status:
           - "defined" — если прямо указано условие о контролируемых
             сделках или их признаках;
           - "not_defined" — иначе.

        5. controlled_transactions_details:
           Краткое user-facing описание условий о контролируемых сделках.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        6. turnover_threshold_status:
           - "defined" — если прямо указан порог оборота операций
             через товарищество;
           - "not_defined" — иначе.

        7. turnover_threshold_details:
           Краткое user-facing описание порога оборота.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        8. market_valuation_basis_status:
           - "defined" — если прямо указано условие о соответствии
             цен рыночным или обоснование рыночности;
           - "not_defined" — иначе.

        9. market_valuation_basis_details:
           Краткое user-facing описание обоснования рыночности.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни controlled_transactions_and_related_parties_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не делай выводов по типовой структуре договора.
        - Не извлекай сведения о вкладах как таковых, распределении прибыли, ведении дел, выходе из товарищества, прекращении, неустойках и иных нерелевантных темах.
        - interdependence_grounds_code фиксирует основание взаимозависимости, прямо указанное в договоре.
        - market_valuation_basis_details — прямое условие договора о рыночности цен.
        - Если в разных фрагментах указаны противоречивые сведения — статус → "not_defined", текстовое поле → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни признаков взаимозависимости, ни условий
           о контролируемых сделках, ни порога оборота, ни обоснования
           рыночности цен.
           → presence = "missing";
             все *_status = "not_defined";
             interdependence_grounds_code = "not_defined";
             все *_details = "Данные не определены".

        2. Неполное раскрытие или прямое исключение.
           а) Общая фраза: «Стороны действуют независимо» без указания
              конкретных признаков отсутствия взаимозависимости.
              → presence = "present";
                interdependence_status = "defined";
                interdependence_grounds_code = "not_defined".
           б) Прямо указано, что товарищи независимы (это присутствие
              регулирования, а не его отсутствие).
              → presence = "present";
                interdependence_status = "defined";
                interdependence_details содержит дословную формулировку.

        3. Противоречие между фрагментами.
           В разных частях договора указаны противоречивые сведения
           о связи товарищей.
           → presence = "unclear";
             interdependence_status = "not_defined";
             interdependence_details = "Не удалось определить".

        4. Специфика темы — взаимозависимость + контролируемые сделки.
           Указаны общие участники и порог оборота > 1 млрд рублей.
           → presence = "present";
             interdependence_status = "defined";
             controlled_transactions_status = "defined";
             turnover_threshold_status = "defined";
             market_valuation_basis_status = "defined".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для controlled_transactions_and_related_parties_presence используй только: "present", "missing", "unclear".
        - Для enum-полей *_status используй только: "defined", "not_defined".
        - Для interdependence_grounds_code используй только: "equity_participation", "common_management", "common_owners", "other", "not_defined".
        - Fallback при отсутствии данных:
          * все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "controlled_transactions_and_related_parties_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по взаимозависимости и контролируемым сделкам. Внутреннее агрегатное signal-поле."
          required: true

        - name: "interdependence_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения взаимозависимости товарищей."
          required: true

        - name: "interdependence_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Взаимозависимость"
          description: "Признаки взаимозависимости товарищей."
          required: true

        - name: "interdependence_grounds_code"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Основание взаимозависимости"
          allowed_values: ["equity_participation", "common_management", "common_owners", "other", "not_defined"]
          description: "Основание взаимозависимости товарищей (ст. 105.1 НК РФ)."
          required: false

        - name: "controlled_transactions_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания о контролируемых сделках."
          required: false

        - name: "controlled_transactions_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Контролируемые сделки"
          description: "Условия или признаки контролируемых сделок."
          required: false

        - name: "turnover_threshold_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания порога оборота."
          required: false

        - name: "turnover_threshold_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Порог оборота"
          description: "Порог оборота операций через товарищество (для Drawer)."
          required: false

        - name: "market_valuation_basis_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус обоснования рыночности цен."
          required: false

        - name: "market_valuation_basis_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 4
          label: "Рыночная оценка"
          description: "Обоснование соответствия цен рыночным (ст. 105.3 НК РФ)."
          required: false

      store_payload: true

  - id: antitrust_compliance
    name: "Антимонопольный комплаенс (ст. 11 ФЗ №135)"
    description: >
      Фактографическая проверка признаков нарушения антимонопольного
      законодательства при создании простого товарищества между
      конкурентами: раздел рынка, координация цен, соответствие
      ограничений non-compete требованиям ст. 11 ФЗ №135
      «О защите конкуренции» и Постановления Пленума ВС РФ №2 от 04.03.2021.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 200

    rules:
      keywords:
        - "антимонопольное законодательство"
        - "защита конкуренции"
        - "картельное соглашение"
        - "координация экономической деятельности"
        - "раздел рынка"
        - "раздел клиентов"
        - "раздел территории"
        - "согласование цен"
        - "единая ценовая политика"
        - "ограничение конкуренции"
        - "конкуренты"
        - "хозяйствующие субъекты"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)антимонопольн[а-яё]+"
        - "(?i)защит[а-яё]*\\s+конкуренц"
        - "(?i)(картельн|координац)[а-яё]+"
        - "(?i)раздел[а-яё]*\\s+(рынк|клиент|территор)"
        - "(?i)(согласовани|единая)\\s+цен"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор простого товарищества.
        Проверяется только один вопрос: соответствие договора
        антимонопольному законодательству.
        Нормативные ориентиры:
        - ст. 11 ФЗ №135 «О защите конкуренции» — запрет картельных
          соглашений и координации экономической деятельности, приводящих
          к разделу рынка, согласованию цен, ограничению конкуренции.
        - ст. 14.32 КоАП РФ — административная ответственность
          (до 15 % выручки).
        - Постановление Пленума ВС РФ №2 от 04.03.2021 — критерии
          квалификации.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - ПТ между конкурентами сам по себе не запрещено; запрещены
          конкретные ограничительные условия (раздел рынка,
          согласование цен).
        - Если товарищи не конкуренты, признаки ст. 11 не применяются.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Являются ли товарищи конкурентами / хозяйствующими субъектами
           на одном товарном рынке.
        2. Признаки раздела рынка (территория, клиенты, ассортимент).
        3. Признаки согласования / координации цен.
        4. Условия non-compete и их соответствие требованиям
           ст. 11 ФЗ №135 (срок, территория, вид деятельности).

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Для enum-полей (competitors_status, *_signs_code,
           non_compete_compliance_status) при отсутствии данных возвращай
           "not_defined" (для *_signs_code — "not_detected").
        4. Для строковых *_details при отсутствии данных возвращай строго
           "Данные не определены".
        5. Не используй "None", "null", пустые строки или отсутствующие ключи.
        6. В evidence включай только прямые цитаты из текста договора.
        7. market_division_signs_code = "detected" ТОЛЬКО при прямом
           указании на раздел рынка (территории, клиентов, ассортимента).
        8. price_coordination_signs_code = "detected" ТОЛЬКО при прямом
           указании на согласование цен / единую ценовую политику.
        9. Верни РОВНО один валидный JSON-объект со всеми 10 ключами
           (9 полей + evidence), пригодный для парсинга через json.loads
           без предварительной обработки. Без markdown, без ```json,
           без комментариев, без текста до или после. Начни ответ сразу
           с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — признаки раздела рынка между конкурентами:
        Фрагмент:
        "Товарищи — конкуренты на рынке логистических услуг. Товарищ 1
        осуществляет деятельность только на территории Московской области,
        Товарищ 2 — только на территории Ленинградской области. Товарищи
        применяют единую ценовую политику."
        Ответ:
        {
          "competitors_status": "defined",
          "competitors_details": "Товарищ 1 и Товарищ 2 — конкуренты на рынке логистических услуг",
          "market_division_signs_code": "detected",
          "market_division_details": "Товарищ 1 — Московская область, Товарищ 2 — Ленинградская область",
          "price_coordination_signs_code": "detected",
          "price_coordination_details": "применение единой ценовой политики",
          "non_compete_compliance_status": "not_defined",
          "non_compete_compliance_details": "Данные не определены",
          "antitrust_risk_summary": "признаки раздела рынка (территория) и согласования цен — риск квалификации по ст. 11 ФЗ №135",
          "evidence": [
            {"clause_ref": "п. 1.1", "quote": "Товарищи — конкуренты на рынке логистических услуг."},
            {"clause_ref": "п. 3.1", "quote": "Товарищ 1 осуществляет деятельность только на территории Московской области, Товарищ 2 — только на территории Ленинградской области."},
            {"clause_ref": "п. 3.2", "quote": "Товарищи применяют единую ценовую политику."}
          ]
        }

        Пример 2 — товарищи не конкуренты:
        Фрагмент:
        "Товарищи осуществляют деятельность на разных товарных рынках
        и не являются конкурентами."
        Ответ:
        {
          "competitors_status": "defined",
          "competitors_details": "товарищи действуют на разных товарных рынках, не конкуренты",
          "market_division_signs_code": "not_detected",
          "market_division_details": "Данные не определены",
          "price_coordination_signs_code": "not_detected",
          "price_coordination_details": "Данные не определены",
          "non_compete_compliance_status": "not_defined",
          "non_compete_compliance_details": "Данные не определены",
          "antitrust_risk_summary": "признаки нарушения ст. 11 ФЗ №135 не обнаружены",
          "evidence": [
            {"clause_ref": "п. 1.2", "quote": "Товарищи осуществляют деятельность на разных товарных рынках и не являются конкурентами."}
          ]
        }

        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Стороны обязуются исполнять договор."
        Ответ:
        {
          "competitors_status": "not_defined",
          "competitors_details": "Данные не определены",
          "market_division_signs_code": "not_detected",
          "market_division_details": "Данные не определены",
          "price_coordination_signs_code": "not_detected",
          "price_coordination_details": "Данные не определены",
          "non_compete_compliance_status": "not_defined",
          "non_compete_compliance_details": "Данные не определены",
          "antitrust_risk_summary": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Все 10 ключей (9 полей + evidence) присутствуют в JSON?
        2. market_division_signs_code / price_coordination_signs_code —
           строго "detected" / "not_detected"?
        3. Все *_status — строго "defined" / "not_defined"?
        4. Проверены ли признаки раздела рынка и согласования цен?
        5. Проверено ли соответствие non-compete требованиям?
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "competitors_status": "<defined / not_defined>",
          "competitors_details": "<текст или 'Данные не определены'>",
          "market_division_signs_code": "<detected / not_detected>",
          "market_division_details": "<текст или 'Данные не определены'>",
          "price_coordination_signs_code": "<detected / not_detected>",
          "price_coordination_details": "<текст или 'Данные не определены'>",
          "non_compete_compliance_status": "<defined / not_defined>",
          "non_compete_compliance_details": "<текст или 'Данные не определены'>",
          "antitrust_risk_summary": "<сводная оценка или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 700

    retrieval:
      retrieval_profile: "definitions_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "антимонопольное законодательство защита конкуренции картельное соглашение координация экономической деятельности раздел рынка раздел клиентов раздел территории согласование цен единая ценовая политика ограничение конкуренции конкуренты хозяйствующие субъекты"
      preferred_unit_types:
        - general_provision
        - obligation
      excluded_unit_types:
        - definition
        - technical_fragment
      preferred_clause_functions:
        - boilerplate
        - limitations
        - obligations
      negative_keywords:
        - "вклад товарища"
        - "распределение прибыли"
        - "налоговый учёт"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 0.45]
        boost: 0.15
        scope: segment
      context_k: 10
      max_chunks: 14
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "boilerplate"
        - "limitations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1400

      compact_output: false

      presence_signal:
        field: "antitrust_compliance_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора простого товарищества
        сведения о соответствии антимонопольному законодательству:
        конкуренты ли товарищи, признаки раздела рынка и координации цен,
        соответствие non-compete.
        Не анализируй вклады как таковые, распределение прибыли,
        налоговый учёт или прекращение.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. antitrust_compliance_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (competitors_status, market_division_signs_code,
              price_coordination_signs_code,
              non_compete_compliance_status) ≠ "not_defined"
             (для *_signs_code — ≠ "not_detected");
           - "missing" — если все четыре содержательных поля
             = "not_defined" / "not_detected";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - competitors_status = "not_defined";
           - market_division_signs_code = "not_detected";
           - price_coordination_signs_code = "not_detected";
           - non_compete_compliance_status = "not_defined";
           - все *_details и antitrust_risk_summary
             = "Данные не определены";
           - не выполняй остальные шаги.

        1. competitors_status:
           - "defined" — если прямо указано, являются ли товарищи
             конкурентами на одном товарном рынке (либо прямое
             подтверждение, либо прямое отрицание);
           - "not_defined" — иначе.

        2. competitors_details:
           Краткое user-facing описание признаков конкуренции.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        3. market_division_signs_code:
           Используй только одно из значений:
           - "detected" — если прямо указаны признаки раздела рынка
             (территория, клиенты, ассортимент);
           - "not_detected" — иначе.

        4. market_division_details:
           Краткое user-facing обоснование признаков раздела рынка.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        5. price_coordination_signs_code:
           Используй только одно из значений:
           - "detected" — если прямо указаны признаки согласования
             цен или единой ценовой политики;
           - "not_detected" — иначе.

        6. price_coordination_details:
           Краткое user-facing обоснование признаков согласования цен.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        7. non_compete_compliance_status:
           - "defined" — если прямо указано соответствие или
             несоответствие условий non-compete требованиям ст. 11
             ФЗ №135 (срок, территория, вид деятельности);
           - "not_defined" — иначе.

        8. non_compete_compliance_details:
           Краткое user-facing описание соответствия.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        9. antitrust_risk_summary:
           Краткая user-facing сводка обнаруженных признаков
           (какие признаки обнаружены и в чём риск).
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни antitrust_compliance_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не делай выводов по типовой структуре договора.
        - Не извлекай сведения о вкладах как таковых, распределении прибыли, налоговом учёте, прекращении товарищества и иных нерелевантных темах.
        - market_division_signs_code = "detected" только при прямом указании на раздел рынка (территория / клиенты / ассортимент).
        - price_coordination_signs_code = "detected" только при прямом указании на согласование цен / единую политику.
        - antitrust_risk_summary: краткая сводка обнаруженных признаков.
        - Если в разных фрагментах указаны противоречивые сведения — статус → "not_defined", текстовое поле → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни указания на конкуренцию товарищей,
           ни признаков раздела рынка, ни признаков согласования цен,
           ни условий non-compete.
           → presence = "missing";
             competitors_status = "not_defined";
             все *_signs_code = "not_detected";
             non_compete_compliance_status = "not_defined";
             все *_details и antitrust_risk_summary
             = "Данные не определены".

        2. Неполное раскрытие или прямое исключение.
           а) Общая фраза: «Товарищи действуют в общих интересах»
              без указания на конкуренцию.
              → presence = "present";
                competitors_status = "not_defined".
           б) Прямо указано, что товарищи не конкуренты.
              → presence = "present";
                competitors_status = "defined";
                market_division_signs_code = "not_detected";
                price_coordination_signs_code = "not_detected";
                antitrust_risk_summary содержит формулировку
                отсутствия признаков.

        3. Противоречие между фрагментами.
           В разных частях договора указаны противоречивые сведения
           о конкуренции или о разделе рынка.
           → presence = "unclear";
             competitors_status = "not_defined";
             competitors_details = "Не удалось определить".

        4. Специфика темы — признаки раздела рынка.
           Указаны территория / клиенты / ассортимент, закреплённые
           за разными товарищами.
           → presence = "present";
             competitors_status = "defined";
             market_division_signs_code = "detected";
             market_division_details содержит дословную формулировку;
             antitrust_risk_summary описывает риск по ст. 11 ФЗ №135.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для antitrust_compliance_presence используй только: "present", "missing", "unclear".
        - Для enum-полей *_status используй только: "defined", "not_defined".
        - Для market_division_signs_code / price_coordination_signs_code используй только: "detected", "not_detected".
        - Fallback при отсутствии данных:
          * все *_details и antitrust_risk_summary
            → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "antitrust_compliance_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по антимонопольному комплаенсу. Внутреннее агрегатное signal-поле."
          required: true

        - name: "competitors_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения конкуренции товарищей."
          required: true

        - name: "competitors_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Товарищи-конкуренты"
          description: "Признаки конкуренции товарищей на одном товарном рынке."
          required: true

        - name: "market_division_signs_code"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Раздел рынка"
          allowed_values: ["detected", "not_detected"]
          description: "Признаки раздела рынка (территория, клиенты, ассортимент)."
          required: false

        - name: "market_division_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Основание раздела рынка"
          description: "Основание признаков раздела рынка (для Drawer)."
          required: false

        - name: "price_coordination_signs_code"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Координация цен"
          allowed_values: ["detected", "not_detected"]
          description: "Признаки согласования цен / единой ценовой политики."
          required: false

        - name: "price_coordination_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Основание координации"
          description: "Основание признаков координации цен (для Drawer)."
          required: false

        - name: "non_compete_compliance_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус оценки соответствия non-compete требованиям ст. 11 ФЗ №135."
          required: false

        - name: "non_compete_compliance_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 4
          label: "Non-compete и ФЗ №135"
          description: "Соответствие non-compete требованиям (срок, территория, вид деятельности)."
          required: false

        - name: "antitrust_risk_summary"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 5
          label: "Итоговая оценка риска"
          description: "Сводная оценка антимонопольного риска."
          required: false

      store_payload: true

  - id: currency_and_non_residents
    name: "Валютное регулирование и нерезиденты (173-ФЗ)"
    description: >
      Фактографическая проверка условий о валютных расчётах и участии
      нерезидентов: наличие нерезидентов среди товарищей, валюта вкладов,
      режим расчётов через уполномоченные банки, обязанности валютного
      контроля и репатриации (ст. 19 173-ФЗ), санкции по ст. 15.25 КоАП РФ.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 210

    rules:
      keywords:
        - "нерезидент"
        - "резидент"
        - "иностранная валюта"
        - "валютное законодательство"
        - "валютный контроль"
        - "уполномоченный банк"
        - "репатриация"
        - "паспорт сделки"
        - "валютные операции"
        - "иностранное юридическое лицо"
        - "иностранный гражданин"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)нерезидент[а-яё]*"
        - "(?i)иностранн[а-яё]+\\s+(валют|лиц|граждан)"
        - "(?i)валютн[а-яё]+\\s+(законодательств|контрол|операц)"
        - "(?i)уполномоченн[а-яё]+\\s+банк"
        - "(?i)репатриац"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор простого товарищества.
        Проверяется только один вопрос: валютное регулирование
        и участие нерезидентов.
        Нормативные ориентиры:
        - ФЗ №173-ФЗ «О валютном регулировании и валютном контроле».
        - ст. 19 173-ФЗ — обязанность репатриации валютной выручки.
        - ст. 15.25 КоАП РФ — административная ответственность
          за нарушение валютного законодательства.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Если все товарищи — резиденты и расчёты только в рублях,
          режим валютного контроля не применяется.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Наличие нерезидентов среди товарищей.
        2. Валюту вкладов и расчётов.
        3. Режим расчётов (через уполномоченные банки, паспорт сделки).
        4. Обязанности валютного контроля.
        5. Обязанности репатриации валютной выручки.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Для enum-полей (*_status) при отсутствии данных возвращай
           "not_defined".
        4. Для строковых *_details при отсутствии данных возвращай строго
           "Данные не определены".
        5. Не используй "None", "null", пустые строки или отсутствующие ключи.
        6. В evidence включай только прямые цитаты из текста договора.
        7. non_resident_status = "defined" ТОЛЬКО если в договоре
           прямо указано наличие нерезидента среди товарищей.
        8. Верни РОВНО один валидный JSON-объект со всеми 11 ключами
           (10 полей + evidence), пригодный для парсинга через json.loads
           без предварительной обработки. Без markdown, без ```json,
           без комментариев, без текста до или после. Начни ответ сразу
           с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — нерезидент с валютными расчётами:
        Фрагмент:
        "Товарищами являются ООО «Альфа» (резидент РФ) и Alpha GmbH
        (Германия). Расчёты между товарищами производятся в евро через
        уполномоченный банк. Стороны обязуются соблюдать требования
        валютного законодательства РФ и обеспечивать репатриацию
        валютной выручки."
        Ответ:
        {
          "non_resident_status": "defined",
          "non_resident_details": "Alpha GmbH (Германия)",
          "currency_of_contributions_status": "defined",
          "currency_of_contributions_details": "евро",
          "settlement_regime_status": "defined",
          "settlement_regime_details": "расчёты в евро через уполномоченный банк",
          "currency_control_obligations_status": "defined",
          "currency_control_obligations_details": "соблюдение требований валютного законодательства РФ",
          "repatriation_obligations_status": "defined",
          "repatriation_obligations_details": "обеспечение репатриации валютной выручки",
          "evidence": [
            {"clause_ref": "п. 1.1", "quote": "Товарищами являются ООО «Альфа» (резидент РФ) и Alpha GmbH (Германия)."},
            {"clause_ref": "п. 5.1", "quote": "Расчёты между товарищами производятся в евро через уполномоченный банк."},
            {"clause_ref": "п. 5.3", "quote": "Стороны обязуются соблюдать требования валютного законодательства РФ и обеспечивать репатриацию валютной выручки."}
          ]
        }

        Пример 2 — только резиденты:
        Фрагмент:
        "Товарищами являются исключительно российские юридические лица —
        резиденты РФ. Расчёты производятся в рублях."
        Ответ:
        {
          "non_resident_status": "defined",
          "non_resident_details": "нерезиденты среди товарищей отсутствуют",
          "currency_of_contributions_status": "defined",
          "currency_of_contributions_details": "российские рубли",
          "settlement_regime_status": "not_defined",
          "settlement_regime_details": "Данные не определены",
          "currency_control_obligations_status": "not_defined",
          "currency_control_obligations_details": "Данные не определены",
          "repatriation_obligations_status": "not_defined",
          "repatriation_obligations_details": "Данные не определены",
          "evidence": [
            {"clause_ref": "п. 1.1", "quote": "Товарищами являются исключительно российские юридические лица — резиденты РФ."},
            {"clause_ref": "п. 1.2", "quote": "Расчёты производятся в рублях."}
          ]
        }

        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Стороны обязуются исполнять договор."
        Ответ:
        {
          "non_resident_status": "not_defined",
          "non_resident_details": "Данные не определены",
          "currency_of_contributions_status": "not_defined",
          "currency_of_contributions_details": "Данные не определены",
          "settlement_regime_status": "not_defined",
          "settlement_regime_details": "Данные не определены",
          "currency_control_obligations_status": "not_defined",
          "currency_control_obligations_details": "Данные не определены",
          "repatriation_obligations_status": "not_defined",
          "repatriation_obligations_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Все 11 ключей (10 полей + evidence) присутствуют в JSON?
        2. Все *_status — строго "defined" / "not_defined"?
        3. Проверено ли наличие нерезидентов?
        4. Проверена ли валюта вкладов и расчётов?
        5. Проверены ли обязанности валютного контроля
           и репатриации?
        6. Все *_details заполнены или "Данные не определены"?
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "non_resident_status": "<defined / not_defined>",
          "non_resident_details": "<текст или 'Данные не определены'>",
          "currency_of_contributions_status": "<defined / not_defined>",
          "currency_of_contributions_details": "<текст или 'Данные не определены'>",
          "settlement_regime_status": "<defined / not_defined>",
          "settlement_regime_details": "<текст или 'Данные не определены'>",
          "currency_control_obligations_status": "<defined / not_defined>",
          "currency_control_obligations_details": "<текст или 'Данные не определены'>",
          "repatriation_obligations_status": "<defined / not_defined>",
          "repatriation_obligations_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 700

    retrieval:
      retrieval_profile: "payment_terms_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "нерезидент резидент иностранная валюта валютное законодательство валютный контроль уполномоченный банк репатриация паспорт сделки валютные операции иностранное юридическое лицо иностранный гражданин"
      preferred_unit_types:
        - payment_term
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "вклад товарища"
        - "распределение прибыли"
        - "выход из товарищества"
        - "прекращение"
        - "неустойка"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.20, 0.65]
        boost: 0.15
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1500

      compact_output: false

      presence_signal:
        field: "currency_and_non_residents_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора простого товарищества
        сведения о валютном регулировании и нерезидентах: наличие
        нерезидентов, валюта вкладов и расчётов, режим расчётов,
        обязанности валютного контроля и репатриации.
        Не анализируй вклады как таковые, распределение прибыли,
        прекращение или неустойки.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. currency_and_non_residents_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (non_resident_status, currency_of_contributions_status,
              settlement_regime_status,
              currency_control_obligations_status,
              repatriation_obligations_status) ≠ "not_defined";
           - "missing" — если все пять содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - non_resident_status = "not_defined";
           - currency_of_contributions_status = "not_defined";
           - settlement_regime_status = "not_defined";
           - currency_control_obligations_status = "not_defined";
           - repatriation_obligations_status = "not_defined";
           - все *_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. non_resident_status:
           - "defined" — если прямо указано наличие или отсутствие
             нерезидентов среди товарищей;
           - "not_defined" — иначе.

        2. non_resident_details:
           Краткое user-facing описание товарищей-нерезидентов
           (если они есть) или указание, что нерезидентов нет.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        3. currency_of_contributions_status:
           - "defined" — если прямо указана валюта вкладов и/или
             расчётов между товарищами;
           - "not_defined" — иначе.

        4. currency_of_contributions_details:
           Краткое user-facing описание валюты (например: "российские
           рубли", "евро", "доллары США").
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        5. settlement_regime_status:
           - "defined" — если прямо указан режим расчётов
             (через уполномоченный банк, паспорт сделки, иные
             механизмы);
           - "not_defined" — иначе.

        6. settlement_regime_details:
           Краткое user-facing описание режима расчётов.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        7. currency_control_obligations_status:
           - "defined" — если прямо указаны обязанности сторон
             по соблюдению требований валютного законодательства;
           - "not_defined" — иначе.

        8. currency_control_obligations_details:
           Краткое user-facing описание обязанностей.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        9. repatriation_obligations_status:
           - "defined" — если прямо указана обязанность репатриации
             валютной выручки (ст. 19 173-ФЗ);
           - "not_defined" — иначе.

        10. repatriation_obligations_details:
            Краткое user-facing описание обязанностей репатриации.
            Если данных нет — "Данные не определены".
            Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни currency_and_non_residents_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не делай выводов по типовой структуре договора.
        - Не извлекай сведения о вкладах как таковых, распределении прибыли, ведении дел, выходе из товарищества, прекращении, неустойках и иных нерелевантных темах.
        - non_resident_status = "defined" только при прямом указании нерезидента среди товарищей (или при прямом отрицании).
        - repatriation_obligations_details — прямое условие о репатриации валютной выручки (ст. 19 173-ФЗ).
        - Если в разных фрагментах указаны противоречивые сведения — статус → "not_defined", текстовое поле → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни указания на нерезидентов, ни валюты вкладов,
           ни режима расчётов, ни обязанностей валютного контроля,
           ни репатриации.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        2. Неполное раскрытие или прямое исключение.
           а) Общая фраза: «Расчёты производятся в порядке,
              установленном законодательством» без указания валюты
              и банка.
              → presence = "present";
                currency_of_contributions_status = "not_defined";
                settlement_regime_status = "not_defined".
           б) Прямо указано, что товарищи — только резиденты
              и расчёты в рублях (это присутствие регулирования,
              а не его отсутствие).
              → presence = "present";
                non_resident_status = "defined";
                currency_of_contributions_status = "defined";
                соответствующие *_details содержат формулировки.

        3. Противоречие между фрагментами.
           В разных частях договора указаны противоречивые сведения
           о валюте или о наличии нерезидентов.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             соответствующий *_details = "Не удалось определить".

        4. Специфика темы — нерезидент с полным валютным режимом.
           Указан нерезидент, валюта расчётов, банк, обязанности
           валютного контроля и репатриации.
           → presence = "present";
             non_resident_status = "defined";
             currency_of_contributions_status = "defined";
             settlement_regime_status = "defined";
             currency_control_obligations_status = "defined";
             repatriation_obligations_status = "defined".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для currency_and_non_residents_presence используй только: "present", "missing", "unclear".
        - Для enum-полей *_status используй только: "defined", "not_defined".
        - Fallback при отсутствии данных:
          * все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "currency_and_non_residents_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по валютному режиму и нерезидентам. Внутреннее агрегатное signal-поле."
          required: true

        - name: "non_resident_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания нерезидентов среди товарищей."
          required: true

        - name: "non_resident_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Нерезиденты"
          description: "Перечень товарищей-нерезидентов."
          required: true

        - name: "currency_of_contributions_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания валюты вкладов и расчётов."
          required: false

        - name: "currency_of_contributions_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Валюта вкладов"
          description: "Валюта вкладов и расчётов между товарищами."
          required: false

        - name: "settlement_regime_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения режима расчётов."
          required: false

        - name: "settlement_regime_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Режим расчётов"
          description: "Режим расчётов (уполномоченный банк, паспорт сделки)."
          required: false

        - name: "currency_control_obligations_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус обязанностей валютного контроля."
          required: false

        - name: "currency_control_obligations_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Валютный контроль"
          description: "Обязанности валютного контроля (для Drawer)."
          required: false

        - name: "repatriation_obligations_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус обязанностей репатриации."
          required: false

        - name: "repatriation_obligations_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Репатриация"
          description: "Обязанности репатриации валютной выручки (для Drawer)."
          required: false

      store_payload: true

  - id: insurance_and_risk_allocation
    name: "Страхование и распределение рисков товарищества"
    description: >
      Фактографическая проверка условий страхования общего имущества
      (ст. 930 ГК РФ), ответственности перед третьими лицами (ст. 931 ГК РФ),
      распределения расходов на страхование и страховых выплат между
      товарищами.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "medium"
    severity_if_pass: "pass"
    severity_if_fail: "medium"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 220

    rules:
      keywords:
        - "страхование"
        - "страхование имущества"
        - "страхование ответственности"
        - "страховой полис"
        - "страхователь"
        - "выгодоприобретатель"
        - "страховая выплата"
        - "страховое возмещение"
        - "страховые расходы"
        - "распределение рисков"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)страхован[а-яё]+"
        - "(?i)страхов[а-яё]+\\s+(полис|выплат|возмещен)"
        - "(?i)страховател|выгодоприобретател"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор простого товарищества.
        Проверяется только один вопрос: страхование и распределение
        рисков товарищества.
        Нормативные ориентиры:
        - ст. 930 ГК РФ — страхование имущества.
        - ст. 931 ГК РФ — страхование ответственности за причинение вреда.
        - ст. 1043 ГК РФ — общее имущество товарищей.
        - ст. 1046 ГК РФ — общие расходы товарищества.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Если условия о страховании отсутствуют — фиксируй отсутствие.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Наличие условия о страховании.
        2. Объект страхования (имущество / ответственность / оба).
        3. Кто является страхователем и за чей счёт.
        4. Порядок распределения расходов на страхование.
        5. Порядок распределения страховых выплат между товарищами.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Для enum-полей (*_status, insured_object_code) при отсутствии
           данных возвращай "not_defined".
        4. Для строковых *_details при отсутствии данных возвращай строго
           "Данные не определены".
        5. Не используй "None", "null", пустые строки или отсутствующие ключи.
        6. В evidence включай только прямые цитаты из текста договора.
        7. insured_object_code: "property" (имущество) / "liability"
           (ответственность) / "both" (имущество и ответственность) /
           "not_defined".
        8. Верни РОВНО один валидный JSON-объект со всеми 11 ключами
           (10 полей + evidence), пригодный для парсинга через json.loads
           без предварительной обработки. Без markdown, без ```json,
           без комментариев, без текста до или после. Начни ответ сразу
           с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — страхование имущества и ответственности:
        Фрагмент:
        "Товарищи обеспечивают страхование общего имущества товарищества
        и ответственности перед третьими лицами за счёт общих средств.
        Страхователем выступает ведущий дела товарищ. Страховые выплаты
        распределяются между товарищами пропорционально их вкладам."
        Ответ:
        {
          "insurance_status": "defined",
          "insurance_details": "страхование общего имущества и ответственности перед третьими лицами",
          "insured_object_code": "both",
          "insured_object_details": "общее имущество и ответственность",
          "insurance_responsible_status": "defined",
          "insurance_responsible_details": "ведущий дела товарищ",
          "insurance_cost_allocation_status": "defined",
          "insurance_cost_allocation_details": "за счёт общих средств",
          "insurance_payout_allocation_status": "defined",
          "insurance_payout_allocation_details": "пропорционально вкладам",
          "evidence": [
            {"clause_ref": "п. 7.1", "quote": "Товарищи обеспечивают страхование общего имущества товарищества и ответственности перед третьими лицами за счёт общих средств."},
            {"clause_ref": "п. 7.2", "quote": "Страхователем выступает ведущий дела товарищ."},
            {"clause_ref": "п. 7.3", "quote": "Страховые выплаты распределяются между товарищами пропорционально их вкладам."}
          ]
        }

        Пример 2 — страхование не предусмотрено:
        Фрагмент:
        "Стороны не предусматривают обязательного страхования общего
        имущества или ответственности."
        Ответ:
        {
          "insurance_status": "defined",
          "insurance_details": "страхование не предусмотрено договором",
          "insured_object_code": "not_defined",
          "insured_object_details": "Данные не определены",
          "insurance_responsible_status": "not_defined",
          "insurance_responsible_details": "Данные не определены",
          "insurance_cost_allocation_status": "not_defined",
          "insurance_cost_allocation_details": "Данные не определены",
          "insurance_payout_allocation_status": "not_defined",
          "insurance_payout_allocation_details": "Данные не определены",
          "evidence": [
            {"clause_ref": "п. 7.1", "quote": "Стороны не предусматривают обязательного страхования общего имущества или ответственности."}
          ]
        }

        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Стороны обязуются исполнять договор."
        Ответ:
        {
          "insurance_status": "not_defined",
          "insurance_details": "Данные не определены",
          "insured_object_code": "not_defined",
          "insured_object_details": "Данные не определены",
          "insurance_responsible_status": "not_defined",
          "insurance_responsible_details": "Данные не определены",
          "insurance_cost_allocation_status": "not_defined",
          "insurance_cost_allocation_details": "Данные не определены",
          "insurance_payout_allocation_status": "not_defined",
          "insurance_payout_allocation_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Все 11 ключей (10 полей + evidence) присутствуют в JSON?
        2. insured_object_code — строго из allowed_values?
        3. Все *_status — строго "defined" / "not_defined"?
        4. Проверен ли объект страхования?
        5. Проверены ли порядок распределения расходов и выплат?
        6. Все *_details заполнены или "Данные не определены"?
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "insurance_status": "<defined / not_defined>",
          "insurance_details": "<текст или 'Данные не определены'>",
          "insured_object_code": "<property / liability / both / not_defined>",
          "insured_object_details": "<текст или 'Данные не определены'>",
          "insurance_responsible_status": "<defined / not_defined>",
          "insurance_responsible_details": "<текст или 'Данные не определены'>",
          "insurance_cost_allocation_status": "<defined / not_defined>",
          "insurance_cost_allocation_details": "<текст или 'Данные не определены'>",
          "insurance_payout_allocation_status": "<defined / not_defined>",
          "insurance_payout_allocation_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 700

    retrieval:
      retrieval_profile: "insurance_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "страхование страхование имущества страхование ответственности страховой полис страхователь выгодоприобретатель страховая выплата страховое возмещение страховые расходы распределение рисков"
      preferred_unit_types:
        - obligation
        - liability_provision
        - general_provision
      excluded_unit_types:
        - definition
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "вклад товарища"
        - "распределение прибыли"
        - "выход из товарищества"
        - "прекращение"
        - "неустойка"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.40, 0.85]
        boost: 0.15
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1500

      compact_output: false

      presence_signal:
        field: "insurance_and_risk_allocation_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора простого товарищества
        сведения о страховании и распределении рисков: наличие страхования,
        объект, страхователь, распределение расходов и выплат.
        Не анализируй вклады как таковые, распределение прибыли,
        прекращение или неустойки.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. insurance_and_risk_allocation_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (insurance_status, insured_object_code,
              insurance_responsible_status,
              insurance_cost_allocation_status,
              insurance_payout_allocation_status) ≠ "not_defined";
           - "missing" — если все пять содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - insurance_status = "not_defined";
           - insured_object_code = "not_defined";
           - insurance_responsible_status = "not_defined";
           - insurance_cost_allocation_status = "not_defined";
           - insurance_payout_allocation_status = "not_defined";
           - все *_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. insurance_status:
           - "defined" — если в тексте прямо указано наличие или
             прямое отсутствие условия о страховании;
           - "not_defined" — иначе.

        2. insurance_details:
           Краткое user-facing описание условий страхования.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        3. insured_object_code:
           Используй только одно из значений:
           - "property" — страхование имущества;
           - "liability" — страхование ответственности;
           - "both" — страхование имущества и ответственности;
           - "not_defined" — иначе.

        4. insured_object_details:
           Краткое user-facing описание объекта страхования.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        5. insurance_responsible_status:
           - "defined" — если прямо указан страхователь
             (товарищ, ведущий дела, иной субъект);
           - "not_defined" — иначе.

        6. insurance_responsible_details:
           Краткое user-facing описание страхователя.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        7. insurance_cost_allocation_status:
           - "defined" — если прямо указан порядок распределения
             расходов на страхование между товарищами;
           - "not_defined" — иначе.

        8. insurance_cost_allocation_details:
           Краткое user-facing описание распределения расходов
           (например: "за счёт общих средств").
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        9. insurance_payout_allocation_status:
           - "defined" — если прямо указан порядок распределения
             страховых выплат между товарищами;
           - "not_defined" — иначе.

        10. insurance_payout_allocation_details:
            Краткое user-facing описание распределения выплат
            (например: "пропорционально вкладам").
            Если данных нет — "Данные не определены".
            Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни insurance_and_risk_allocation_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не делай выводов по типовой структуре договора.
        - Не извлекай сведения о вкладах как таковых, распределении прибыли, ведении дел, выходе из товарищества, прекращении, неустойках и иных нерелевантных темах.
        - insured_object_code = "both" если страхование одновременно имущества и ответственности.
        - insurance_payout_allocation_details — порядок распределения страховых выплат между товарищами.
        - Если в разных фрагментах указаны противоречивые сведения — статус → "not_defined", текстовое поле → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни условия о страховании, ни объекта,
           ни страхователя, ни распределения расходов и выплат.
           → presence = "missing";
             все *_status = "not_defined";
             insured_object_code = "not_defined";
             все *_details = "Данные не определены".

        2. Неполное раскрытие или прямое исключение.
           а) Общая фраза: «Товарищи обеспечивают сохранность
              имущества» без указания страхования.
              → presence = "present";
                insurance_status = "not_defined";
                insured_object_code = "not_defined".
           б) Прямо указано, что страхование не предусматривается.
              → presence = "present";
                insurance_status = "defined";
                insurance_details содержит дословную формулировку.

        3. Противоречие между фрагментами.
           В разных частях договора указаны противоречивые условия
           о страховании (например, страхование и отказ от него).
           → presence = "unclear";
             insurance_status = "not_defined";
             insurance_details = "Не удалось определить".

        4. Специфика темы — страхование имущества и ответственности.
           Указаны оба объекта страхования, страхователь, распределение
           расходов и выплат.
           → presence = "present";
             insurance_status = "defined";
             insured_object_code = "both";
             insurance_responsible_status = "defined";
             insurance_cost_allocation_status = "defined";
             insurance_payout_allocation_status = "defined".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для insurance_and_risk_allocation_presence используй только: "present", "missing", "unclear".
        - Для enum-полей *_status используй только: "defined", "not_defined".
        - Для insured_object_code используй только: "property", "liability", "both", "not_defined".
        - Fallback при отсутствии данных:
          * все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "insurance_and_risk_allocation_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по страхованию и распределению рисков. Внутреннее агрегатное signal-поле."
          required: true

        - name: "insurance_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания страхования."
          required: true

        - name: "insurance_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Страхование"
          description: "Условия страхования общего имущества и ответственности."
          required: true

        - name: "insured_object_code"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Объект страхования"
          allowed_values: ["property", "liability", "both", "not_defined"]
          description: "Объект страхования: имущество / ответственность / оба."
          required: false

        - name: "insured_object_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Детали объекта"
          description: "Детали объекта страхования (для Drawer)."
          required: false

        - name: "insurance_responsible_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения страхователя."
          required: false

        - name: "insurance_responsible_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Кто страхует"
          description: "Товарищ, на которого возложена обязанность страхования."
          required: false

        - name: "insurance_cost_allocation_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус распределения расходов на страхование."
          required: false

        - name: "insurance_cost_allocation_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Распределение затрат"
          description: "Порядок распределения расходов на страхование (для Drawer)."
          required: false

        - name: "insurance_payout_allocation_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус распределения страховых выплат."
          required: false

        - name: "insurance_payout_allocation_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 4
          label: "Распределение выплат"
          description: "Порядок распределения страховых выплат между товарищами."
          required: false

      store_payload: true

  - id: confidentiality_between_partners
    name: "Конфиденциальность между товарищами"
    description: >
      Фактографическая проверка внутренних условий конфиденциальности
      между товарищами: состав конфиденциальной информации (ноу-хау,
      клиентская база, технологии), срок сохранения тайны, обязанности
      после выхода из товарищества, последствия разглашения. Отличается
      от global-чека confidentiality_and_trade_secrets, который покрывает
      внешнюю конфиденциальность перед третьими лицами.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "medium"
    severity_if_pass: "pass"
    severity_if_fail: "medium"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 230

    rules:
      keywords:
        - "конфиденциальность между товарищами"
        - "внутренняя конфиденциальность"
        - "конфиденциальная информация"
        - "коммерческая тайна"
        - "ноу-хау"
        - "клиентская база"
        - "технологическая информация"
        - "неразглашение"
        - "сохранение тайны"
        - "обязанность не разглашать"
        - "после выхода"
        - "ответственность за разглашение"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)конфиденциальн[а-яё]+\\s+информац"
        - "(?i)коммерческ[а-яё]+\\s+тайн"
        - "(?i)неразглашен|не\\s+разглаш"
        - "(?i)ноу[\\s-]хау"
        - "(?i)(клиентск|технологическ)[а-яё]+\\s+(баз|информац)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор простого товарищества.
        Проверяется только один вопрос: конфиденциальность между
        товарищами (внутренние отношения, не конфиденциальность перед
        третьими лицами — та покрывается отдельным global-чеком).
        Нормативные ориентиры:
        - ФЗ №98-ФЗ «О коммерческой тайне» — режим коммерческой тайны.
        - ст. 1465 ГК РФ — секрет производства (ноу-хау).
        - ст. 1045 ГК РФ — право товарища на информацию (неотчуждаемо);
          условие о конфиденциальности не может полностью блокировать
          право товарища на информацию о делах товарищества.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Различай: условие о конфиденциальности между товарищами (внутреннее)
          и условие о неразглашении перед третьими лицами (внешнее — вне скоупа).

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Наличие условия о конфиденциальности между товарищами.
        2. Состав конфиденциальной информации (что именно защищается).
        3. Срок сохранения конфиденциальности.
        4. Обязанности по сохранению тайны после выхода из товарищества.
        5. Последствия разглашения конфиденциальной информации.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Для enum-полей (*_status) при отсутствии данных возвращай
           "not_defined".
        4. Для строковых *_details при отсутствии данных возвращай строго
           "Данные не определены".
        5. Не используй "None", "null", пустые строки или отсутствующие ключи.
        6. В evidence включай только прямые цитаты из текста договора.
        7. confidentiality_status = "defined" ТОЛЬКО при прямом указании
           условий конфиденциальности между товарищами. Общее упоминание
           неразглашения в стандартной оговорке без указания состава
           информации — не считается (фиксируй как not_defined).
        8. Верни РОВНО один валидный JSON-объект со всеми 10 ключами
           (9 полей + evidence), пригодный для парсинга через json.loads
           без предварительной обработки. Без markdown, без ```json,
           без комментариев, без текста до или после. Начни ответ сразу
           с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — конфиденциальность между товарищами с составом и сроком:
        Фрагмент:
        "Товарищи обязуются сохранять в тайне коммерческую информацию
        друг друга, включая клиентские базы, ноу-хау и технологическую
        документацию, полученную в связи с совместной деятельностью.
        Обязательство сохраняется в течение 5 лет после выхода товарища
        из товарищества. За разглашение — неустойка 1 000 000 рублей."
        Ответ:
        {
          "confidentiality_status": "defined",
          "confidentiality_details": "обязанность сохранять в тайне коммерческую информацию друг друга",
          "confidential_info_scope": "клиентские базы, ноу-хау, технологическая документация",
          "confidentiality_term_status": "defined",
          "confidentiality_term_details": "в течение срока действия договора",
          "post_exit_confidentiality_status": "defined",
          "post_exit_confidentiality_details": "в течение 5 лет после выхода товарища из товарищества",
          "breach_consequences_status": "defined",
          "breach_consequences_details": "неустойка 1 000 000 рублей",
          "evidence": [
            {"clause_ref": "п. 12.1", "quote": "Товарищи обязуются сохранять в тайне коммерческую информацию друг друга, включая клиентские базы, ноу-хау и технологическую документацию, полученную в связи с совместной деятельностью."},
            {"clause_ref": "п. 12.2", "quote": "Обязательство сохраняется в течение 5 лет после выхода товарища из товарищества."},
            {"clause_ref": "п. 12.3", "quote": "За разглашение — неустойка 1 000 000 рублей."}
          ]
        }

        Пример 2 — только общая оговорка без состава:
        Фрагмент:
        "Стороны обязуются сохранять конфиденциальность информации,
        полученной в связи с исполнением договора."
        Ответ:
        {
          "confidentiality_status": "not_defined",
          "confidentiality_details": "Данные не определены",
          "confidential_info_scope": "Данные не определены",
          "confidentiality_term_status": "not_defined",
          "confidentiality_term_details": "Данные не определены",
          "post_exit_confidentiality_status": "not_defined",
          "post_exit_confidentiality_details": "Данные не определены",
          "breach_consequences_status": "not_defined",
          "breach_consequences_details": "Данные не определены",
          "evidence": [
            {"clause_ref": "п. 12.1", "quote": "Стороны обязуются сохранять конфиденциальность информации, полученной в связи с исполнением договора."}
          ]
        }

        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Стороны обязуются исполнять договор."
        Ответ:
        {
          "confidentiality_status": "not_defined",
          "confidentiality_details": "Данные не определены",
          "confidential_info_scope": "Данные не определены",
          "confidentiality_term_status": "not_defined",
          "confidentiality_term_details": "Данные не определены",
          "post_exit_confidentiality_status": "not_defined",
          "post_exit_confidentiality_details": "Данные не определены",
          "breach_consequences_status": "not_defined",
          "breach_consequences_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Все 10 ключей (9 полей + evidence) присутствуют в JSON?
        2. Все *_status — строго "defined" / "not_defined"?
        3. Определён ли состав конфиденциальной информации?
        4. Проверен ли срок сохранения конфиденциальности?
        5. Проверены ли обязанности после выхода и последствия разглашения?
        6. Все *_details заполнены или "Данные не определены"?
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "confidentiality_status": "<defined / not_defined>",
          "confidentiality_details": "<текст или 'Данные не определены'>",
          "confidential_info_scope": "<текст или 'Данные не определены'>",
          "confidentiality_term_status": "<defined / not_defined>",
          "confidentiality_term_details": "<текст или 'Данные не определены'>",
          "post_exit_confidentiality_status": "<defined / not_defined>",
          "post_exit_confidentiality_details": "<текст или 'Данные не определены'>",
          "breach_consequences_status": "<defined / not_defined>",
          "breach_consequences_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 700

    retrieval:
      retrieval_profile: "confidentiality_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "конфиденциальность между товарищами внутренняя конфиденциальность конфиденциальная информация коммерческая тайна ноу-хау клиентская база технологическая информация неразглашение сохранение тайны обязанность не разглашать после выхода ответственность за разглашение"
      preferred_unit_types:
        - confidentiality
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - technical_fragment
      preferred_clause_functions:
        - boilerplate
        - obligations
      negative_keywords:
        - "вклад товарища"
        - "распределение прибыли"
        - "налоговый учёт"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.40, 0.90]
        boost: 0.15
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "boilerplate"
        - "obligations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1300

      compact_output: false

      presence_signal:
        field: "confidentiality_between_partners_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора простого товарищества
        сведения о конфиденциальности между товарищами: состав
        конфиденциальной информации, срок, обязанности после выхода,
        последствия разглашения.
        Не анализируй вклады, распределение прибыли, налоговый учёт
        или прекращение товарищества.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. confidentiality_between_partners_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (confidentiality_status, confidentiality_term_status,
              post_exit_confidentiality_status,
              breach_consequences_status) ≠ "not_defined";
           - "missing" — если все четыре содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - confidentiality_status = "not_defined";
           - confidentiality_term_status = "not_defined";
           - post_exit_confidentiality_status = "not_defined";
           - breach_consequences_status = "not_defined";
           - все *_details и confidential_info_scope
             = "Данные не определены";
           - не выполняй остальные шаги.

        1. confidentiality_status:
           - "defined" — если прямо указано условие о конфиденциальности
             между товарищами (с составом информации);
           - "not_defined" — иначе.

        2. confidentiality_details:
           Краткое user-facing описание условия конфиденциальности.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        3. confidential_info_scope:
           Краткое user-facing перечисление состава конфиденциальной
           информации (например: "клиентские базы, ноу-хау,
           технологическая документация").
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        4. confidentiality_term_status:
           - "defined" — если прямо указан срок сохранения
             конфиденциальности;
           - "not_defined" — иначе.

        5. confidentiality_term_details:
           Краткое user-facing описание срока (например:
           "в течение срока действия договора").
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        6. post_exit_confidentiality_status:
           - "defined" — если прямо указаны обязанности по сохранению
             тайны после выхода из товарищества;
           - "not_defined" — иначе.

        7. post_exit_confidentiality_details:
           Краткое user-facing описание обязанностей после выхода.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        8. breach_consequences_status:
           - "defined" — если прямо указаны последствия разглашения
             конфиденциальной информации (неустойка, убытки,
             исключение из товарищества);
           - "not_defined" — иначе.

        9. breach_consequences_details:
           Краткое user-facing описание последствий разглашения.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни confidentiality_between_partners_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не делай выводов по типовой структуре договора.
        - Не извлекай сведения о вкладах как таковых, распределении прибыли, ведении дел, выходе из товарищества, прекращении, неустойках и иных нерелевантных темах.
        - confidentiality_status = "defined" только при прямом указании условий конфиденциальности между товарищами (с составом информации).
        - Общая оговорка о неразглашении без указания состава информации — confidentiality_status = "not_defined".
        - post_exit_confidentiality_details — обязанности после выхода из товарищества.
        - Если в разных фрагментах указаны противоречивые сведения — статус → "not_defined", текстовое поле → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни условия о конфиденциальности между
           товарищами, ни состава информации, ни срока, ни обязанностей
           после выхода, ни последствий разглашения.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details и confidential_info_scope
             = "Данные не определены".

        2. Неполное раскрытие или прямое исключение.
           а) Общая оговорка о неразглашении без состава информации
              (стандартный boilerplate).
              → presence = "present";
                confidentiality_status = "not_defined";
                confidential_info_scope = "Данные не определены".
           б) Прямо указано, что стороны не принимают обязательств
              о взаимной конфиденциальности.
              → presence = "present";
                confidentiality_status = "defined";
                confidentiality_details содержит дословную
                формулировку отказа.

        3. Противоречие между фрагментами.
           В разных частях договора указаны противоречивые условия
           конфиденциальности (например, оговорка о неразглашении
           и прямое разрешение использовать информацию).
           → presence = "unclear";
             confidentiality_status = "not_defined";
             confidentiality_details = "Не удалось определить".

        4. Специфика темы — конфиденциальность с обязанностями
           после выхода.
           Указан состав информации, срок, обязанности после выхода
           и последствия разглашения.
           → presence = "present";
             confidentiality_status = "defined";
             confidentiality_term_status = "defined";
             post_exit_confidentiality_status = "defined";
             breach_consequences_status = "defined".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для confidentiality_between_partners_presence используй только: "present", "missing", "unclear".
        - Для enum-полей *_status используй только: "defined", "not_defined".
        - Fallback при отсутствии данных:
          * все *_details и confidential_info_scope
            → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "confidentiality_between_partners_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по конфиденциальности между товарищами. Внутреннее агрегатное signal-поле."
          required: true

        - name: "confidentiality_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус условий конфиденциальности между товарищами."
          required: true

        - name: "confidentiality_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Конфиденциальность между товарищами"
          description: "Условия внутренней конфиденциальности между товарищами."
          required: true

        - name: "confidential_info_scope"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Состав конфиденциальной информации"
          description: "Перечень сведений, отнесённых к конфиденциальным."
          required: false

        - name: "confidentiality_term_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания срока конфиденциальности."
          required: false

        - name: "confidentiality_term_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Срок конфиденциальности"
          description: "Срок сохранения конфиденциальности."
          required: false

        - name: "post_exit_confidentiality_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус обязанностей после выхода."
          required: false

        - name: "post_exit_confidentiality_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Конфиденциальность после выхода"
          description: "Обязанности по сохранению тайны после выхода из товарищества (для Drawer)."
          required: false

        - name: "breach_consequences_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус последствий разглашения."
          required: false

        - name: "breach_consequences_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 4
          label: "Последствия разглашения"
          description: "Последствия нарушения конфиденциальности (неустойка, убытки, исключение)."
          required: false

      store_payload: true

  - id: ip_created_in_partnership
    name: "Интеллектуальная собственность, созданная в рамках товарищества"
    description: >
      Фактографическая проверка режима интеллектуальной собственности,
      созданной в рамках совместной деятельности: кому принадлежат
      результаты (ст. 1228, 1229, 1295, 1370 ГК РФ), режим использования
      после выхода товарища, распределение лицензионных платежей,
      ответственность за защиту исключительных прав. Отличается
      от global-чека ip_ownership_and_assignments, который покрывает
      стандартные случаи создания и передачи IP вне товарищества.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 240

    rules:
      keywords:
        - "интеллектуальная собственность"
        - "исключительное право"
        - "результат интеллектуальной деятельности"
        - "произведение"
        - "изобретение"
        - "полезная модель"
        - "программа для ЭВМ"
        - "база данных"
        - "секрет производства"
        - "ноу-хау"
        - "созданные в рамках"
        - "созданный в результате"
        - "служебное произведение"
        - "служебное изобретение"
        - "лицензионные платежи"
        - "роялти"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)интеллектуальн[а-яё]+\\s+собственност"
        - "(?i)исключительн[а-яё]+\\s+прав"
        - "(?i)результат[а-яё]*\\s+интеллектуальн"
        - "(?i)(служебн[а-яё]+\\s+(произведен|изобретен))"
        - "(?i)(программ[а-яё]+\\s+для\\s+ЭВМ|баз[а-яё]+\\s+данных)"
        - "(?i)лицензионн[а-яё]+\\s+платеж"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по интеллектуальной собственности.
        Анализируется договор простого товарищества.
        Проверяется только один вопрос: режим IP, созданного в рамках
        совместной деятельности товарищей.
        Нормативные ориентиры:
        - ст. 1228, 1229 ГК РФ — авторство и исключительное право.
        - ст. 1295 ГК РФ — служебное произведение.
        - ст. 1370 ГК РФ — служебное изобретение, полезная модель,
          промышленный образец.
        - п. 3 ст. 1229 ГК РФ — совместное обладание исключительным
          правом (по соглашению).
        - п. 1 ст. 1043 ГК РФ — продукция и доходы от совместной
          деятельности — общая долевая собственность.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Если IP в рамках ПТ не упомянут — фиксируй отсутствие,
          НЕ выводя презумпции ГК РФ.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Режим интеллектуальной собственности, создаваемой в рамках ПТ.
        2. Кому принадлежат исключительные права на результаты.
        3. Порядок использования IP после выхода товарища из товарищества.
        4. Распределение лицензионных платежей / роялти между товарищами.
        5. Ответственность за защиту исключительных прав.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Для enum-полей (*_status, ip_ownership_regime_code) при
           отсутствии данных возвращай "not_defined".
        4. Для строковых *_details при отсутствии данных возвращай строго
           "Данные не определены".
        5. Не используй "None", "null", пустые строки или отсутствующие ключи.
        6. В evidence включай только прямые цитаты из текста договора.
        7. ip_ownership_regime_code: "joint" (совместное исключительное
           право) / "single_partner" (право одного товарища) /
           "joint_with_roles" (совместное с распределением ролей) /
           "not_defined".
        8. Верни РОВНО один валидный JSON-объект со всеми 11 ключами
           (10 полей + evidence), пригодный для парсинга через json.loads
           без предварительной обработки. Без markdown, без ```json,
           без комментариев, без текста до или после. Начни ответ сразу
           с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — совместное владение IP с распределением платежей:
        Фрагмент:
        "Результаты интеллектуальной деятельности, созданные в рамках
        совместной деятельности, являются совместной собственностью
        товарищей. Исключительные права принадлежат товарищам совместно.
        Лицензионные платежи от использования результатов распределяются
        между товарищами пропорционально их вкладам. Защиту исключительных
        прав осуществляет ведущий дела товарищ."
        Ответ:
        {
          "ip_creation_status": "defined",
          "ip_creation_details": "результаты интеллектуальной деятельности, созданные в рамках совместной деятельности",
          "ip_ownership_regime_code": "joint",
          "ip_ownership_details": "исключительные права принадлежат товарищам совместно",
          "ip_use_after_exit_status": "not_defined",
          "ip_use_after_exit_details": "Данные не определены",
          "license_payments_distribution_status": "defined",
          "license_payments_distribution_details": "пропорционально вкладам товарищей",
          "ip_protection_responsibility_status": "defined",
          "ip_protection_responsibility_details": "ведущий дела товарищ",
          "evidence": [
            {"clause_ref": "п. 9.1", "quote": "Результаты интеллектуальной деятельности, созданные в рамках совместной деятельности, являются совместной собственностью товарищей."},
            {"clause_ref": "п. 9.2", "quote": "Исключительные права принадлежат товарищам совместно."},
            {"clause_ref": "п. 9.3", "quote": "Лицензионные платежи от использования результатов распределяются между товарищами пропорционально их вкладам."},
            {"clause_ref": "п. 9.4", "quote": "Защиту исключительных прав осуществляет ведущий дела товарищ."}
          ]
        }

        Пример 2 — IP принадлежит одному товарищу:
        Фрагмент:
        "Все результаты интеллектуальной деятельности, созданные Товарищем 1
        в рамках исполнения настоящего договора, принадлежат Товарищу 1.
        Остальные товарищи получают неисключительную безвозмездную лицензию
        на срок действия договора."
        Ответ:
        {
          "ip_creation_status": "defined",
          "ip_creation_details": "результаты интеллектуальной деятельности, созданные Товарищем 1 в рамках договора",
          "ip_ownership_regime_code": "single_partner",
          "ip_ownership_details": "исключительные права принадлежат Товарищу 1; остальным — неисключительная безвозмездная лицензия",
          "ip_use_after_exit_status": "not_defined",
          "ip_use_after_exit_details": "Данные не определены",
          "license_payments_distribution_status": "defined",
          "license_payments_distribution_details": "неисключительная безвозмездная лицензия для остальных товарищей",
          "ip_protection_responsibility_status": "not_defined",
          "ip_protection_responsibility_details": "Данные не определены",
          "evidence": [
            {"clause_ref": "п. 9.1", "quote": "Все результаты интеллектуальной деятельности, созданные Товарищем 1 в рамках исполнения настоящего договора, принадлежат Товарищу 1."},
            {"clause_ref": "п. 9.2", "quote": "Остальные товарищи получают неисключительную безвозмездную лицензию на срок действия договора."}
          ]
        }

        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Стороны обязуются исполнять договор."
        Ответ:
        {
          "ip_creation_status": "not_defined",
          "ip_creation_details": "Данные не определены",
          "ip_ownership_regime_code": "not_defined",
          "ip_ownership_details": "Данные не определены",
          "ip_use_after_exit_status": "not_defined",
          "ip_use_after_exit_details": "Данные не определены",
          "license_payments_distribution_status": "not_defined",
          "license_payments_distribution_details": "Данные не определены",
          "ip_protection_responsibility_status": "not_defined",
          "ip_protection_responsibility_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Все 11 ключей (10 полей + evidence) присутствуют в JSON?
        2. ip_ownership_regime_code — строго из allowed_values?
        3. Все *_status — строго "defined" / "not_defined"?
        4. Определён ли режим владения IP?
        5. Проверен ли порядок использования после выхода?
        6. Проверено ли распределение лицензионных платежей?
        7. Определена ли ответственность за защиту IP?
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "ip_creation_status": "<defined / not_defined>",
          "ip_creation_details": "<текст или 'Данные не определены'>",
          "ip_ownership_regime_code": "<joint / single_partner / joint_with_roles / not_defined>",
          "ip_ownership_details": "<текст или 'Данные не определены'>",
          "ip_use_after_exit_status": "<defined / not_defined>",
          "ip_use_after_exit_details": "<текст или 'Данные не определены'>",
          "license_payments_distribution_status": "<defined / not_defined>",
          "license_payments_distribution_details": "<текст или 'Данные не определены'>",
          "ip_protection_responsibility_status": "<defined / not_defined>",
          "ip_protection_responsibility_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 750

    retrieval:
      retrieval_profile: "ip_ownership_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "интеллектуальная собственность исключительное право результат интеллектуальной деятельности произведение изобретение полезная модель программа для ЭВМ база данных секрет производства ноу-хау созданные в рамках созданный в результате служебное произведение служебное изобретение лицензионные платежи роялти"
      preferred_unit_types:
        - general_provision
        - obligation
        - definition
      excluded_unit_types:
        - technical_fragment
      preferred_clause_functions:
        - definitions
        - obligations
        - rights
      negative_keywords:
        - "вклад товарища"
        - "распределение прибыли"
        - "налоговый учёт"
        - "прекращение"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.20, 0.70]
        boost: 0.15
        scope: segment
      context_k: 10
      max_chunks: 14
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "definitions"
        - "obligations"
        - "rights"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1500

      compact_output: false

      presence_signal:
        field: "ip_created_in_partnership_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по ИС. Извлеки из договора простого
        товарищества сведения о режиме интеллектуальной собственности,
        созданной в рамках совместной деятельности: кому принадлежат
        права, использование после выхода, распределение платежей,
        ответственность за защиту.
        Не анализируй вклады как таковые, распределение прибыли,
        налоговый учёт или прекращение.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. ip_created_in_partnership_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (ip_creation_status, ip_ownership_regime_code,
              ip_use_after_exit_status,
              license_payments_distribution_status,
              ip_protection_responsibility_status) ≠ "not_defined";
           - "missing" — если все пять содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - ip_creation_status = "not_defined";
           - ip_ownership_regime_code = "not_defined";
           - ip_use_after_exit_status = "not_defined";
           - license_payments_distribution_status = "not_defined";
           - ip_protection_responsibility_status = "not_defined";
           - все *_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. ip_creation_status:
           - "defined" — если в тексте прямо указано создание IP
             в рамках совместной деятельности;
           - "not_defined" — иначе.

        2. ip_creation_details:
           Краткое user-facing описание того, какие объекты IP
           создаются в рамках ПТ.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        3. ip_ownership_regime_code:
           Используй только одно из значений:
           - "joint" — совместное исключительное право товарищей;
           - "single_partner" — IP принадлежит одному товарищу;
           - "joint_with_roles" — совместное право с распределением
             ролей (разные права на разные результаты);
           - "not_defined" — иначе.

        4. ip_ownership_details:
           Краткое user-facing описание режима владения IP.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        5. ip_use_after_exit_status:
           - "defined" — если прямо указан порядок использования IP
             после выхода товарища;
           - "not_defined" — иначе.

        6. ip_use_after_exit_details:
           Краткое user-facing описание порядка использования IP
           после выхода.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        7. license_payments_distribution_status:
           - "defined" — если прямо указан порядок распределения
             лицензионных платежей / роялти между товарищами;
           - "not_defined" — иначе.

        8. license_payments_distribution_details:
           Краткое user-facing описание распределения платежей.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        9. ip_protection_responsibility_status:
           - "defined" — если прямо указан ответственный за защиту
             исключительных прав;
           - "not_defined" — иначе.

        10. ip_protection_responsibility_details:
            Краткое user-facing описание ответственного за защиту IP.
            Если данных нет — "Данные не определены".
            Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни ip_created_in_partnership_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не делай выводов по типовой структуре договора.
        - Не извлекай сведения о вкладах как таковых, распределении прибыли, налоговом учёте, прекращении товарищества и иных нерелевантных темах.
        - ip_ownership_regime_code = "joint" при совместном исключительном праве товарищей.
        - ip_ownership_regime_code = "single_partner" если IP принадлежит одному товарищу.
        - ip_ownership_regime_code = "joint_with_roles" при совместном праве с распределением ролей (например, разные права на разные результаты).
        - Если в разных фрагментах указаны противоречивые сведения — статус → "not_defined", текстовое поле → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни указания на создание IP, ни режима владения,
           ни порядка использования после выхода, ни распределения
           платежей, ни ответственности за защиту.
           → presence = "missing";
             все *_status = "not_defined";
             ip_ownership_regime_code = "not_defined";
             все *_details = "Данные не определены".

        2. Неполное раскрытие или прямое исключение.
           а) Общая фраза: «Результаты совместной деятельности
              используются товарищами» без указания режима IP.
              → presence = "present";
                ip_creation_status = "not_defined";
                ip_ownership_regime_code = "not_defined".
           б) Прямо указано, что IP в рамках ПТ не создаётся или
              все права остаются у создателя-товарища.
              → presence = "present";
                ip_creation_status = "defined";
                ip_ownership_regime_code = "single_partner";
                соответствующие *_details содержат формулировку.

        3. Противоречие между фрагментами.
           В разных частях договора указан разный режим IP
           (например, совместное и единоличное право).
           → presence = "unclear";
             ip_ownership_regime_code = "not_defined";
             ip_ownership_details = "Не удалось определить".

        4. Специфика темы — единый режим IP с полным набором условий.
           Указаны режим владения, порядок использования после выхода,
           распределение платежей, ответственный за защиту.
           → presence = "present";
             ip_creation_status = "defined";
             ip_ownership_regime_code = "joint" (или иной);
             ip_use_after_exit_status = "defined";
             license_payments_distribution_status = "defined";
             ip_protection_responsibility_status = "defined".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для ip_created_in_partnership_presence используй только: "present", "missing", "unclear".
        - Для enum-полей *_status используй только: "defined", "not_defined".
        - Для ip_ownership_regime_code используй только: "joint", "single_partner", "joint_with_roles", "not_defined".
        - Fallback при отсутствии данных:
          * все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "ip_created_in_partnership_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по IP, созданному в рамках ПТ. Внутреннее агрегатное signal-поле."
          required: true

        - name: "ip_creation_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания создания IP в рамках ПТ."
          required: true

        - name: "ip_creation_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Создание IP"
          description: "Какие объекты IP создаются в рамках совместной деятельности."
          required: true

        - name: "ip_ownership_regime_code"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Режим владения IP"
          allowed_values: ["joint", "single_partner", "joint_with_roles", "not_defined"]
          description: "Режим исключительных прав на создаваемые результаты."
          required: false

        - name: "ip_ownership_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Детали режима"
          description: "Детали режима владения IP (для Drawer)."
          required: false

        - name: "ip_use_after_exit_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус порядка использования IP после выхода."
          required: false

        - name: "ip_use_after_exit_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "IP после выхода"
          description: "Порядок использования IP после выхода товарища."
          required: false

        - name: "license_payments_distribution_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус распределения лицензионных платежей."
          required: false

        - name: "license_payments_distribution_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Распределение платежей"
          description: "Порядок распределения лицензионных платежей (для Drawer)."
          required: false

        - name: "ip_protection_responsibility_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус ответственности за защиту IP."
          required: false

        - name: "ip_protection_responsibility_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 4
          label: "Ответственный за защиту IP"
          description: "Кто отвечает за защиту исключительных прав."
          required: false

      store_payload: true

  - id: data_processing_within_partnership
    name: "Обработка персональных данных между товарищами"
    description: >
      Фактографическая проверка внутренних условий обработки персональных
      данных между товарищами (152-ФЗ): распределение ролей операторов
      (ст. 3, 6 152-ФЗ), поручение обработки одним товарищем другому,
      состав обрабатываемых ПДн, распределение ответственности за утечки,
      управление согласиями субъектов, судьба ПДн при выходе товарища.
      Отличается от global-чека personal_data_and_dpa, который покрывает
      стандартное поручение обработки третьим лицом.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "medium"
    severity_if_pass: "pass"
    severity_if_fail: "medium"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 250

    rules:
      keywords:
        - "персональные данные"
        - "обработка персональных данных"
        - "оператор персональных данных"
        - "поручение обработки"
        - "152-ФЗ"
        - "субъект персональных данных"
        - "согласие на обработку"
        - "утечка персональных данных"
        - "конфиденциальность персональных данных"
        - "защита персональных данных"
        - "обработчик персональных данных"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)персональн[а-яё]+\\s+данн"
        - "(?i)оператор[а-яё]*\\s+персональн"
        - "(?i)(поручени[ея]|обработчик)[а-яё]*\\s+обработк"
        - "(?i)152[\\s-]ФЗ"
        - "(?i)согласи[ея][а-яё]*\\s+(на\\s+обработ|субъект)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по защите персональных данных.
        Анализируется договор простого товарищества.
        Проверяется только один вопрос: обработка персональных данных
        во внутренних отношениях между товарищами.
        Нормативные ориентиры:
        - ст. 3 152-ФЗ — определения оператора, обработки, ПДн.
        - ч. 3 ст. 6 152-ФЗ — поручение обработки ПДн другому лицу.
        - ст. 9 152-ФЗ — согласие субъекта на обработку ПДн.
        - ст. 19 152-ФЗ — меры по обеспечению безопасности ПДн.
        - Постановление Правительства РФ №1119 — требования к защите ПДн.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Различай: обработка ПДн между товарищами (внутренняя) и поручение
          обработки третьему лицу (внешняя — вне скоупа).

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Наличие условия об обработке ПДн между товарищами.
        2. Распределение ролей операторов ПДн между товарищами.
        3. Состав обрабатываемых персональных данных.
        4. Распределение ответственности за утечки ПДн.
        5. Порядок управления согласиями субъектов ПДн.
        6. Судьба ПДн при выходе товарища из товарищества.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Для enum-полей (*_status, data_processing_roles_code) при
           отсутствии данных возвращай "not_defined".
        4. Для строковых *_details при отсутствии данных возвращай строго
           "Данные не определены".
        5. Не используй "None", "null", пустые строки или отсутствующие ключи.
        6. В evidence включай только прямые цитаты из текста договора.
        7. data_processing_roles_code: "single_operator" (один товарищ —
           оператор, остальные — обработчики) / "joint_operators"
           (совместные операторы) / "processor_model" (поручение обработки
           другому товарищу) / "not_defined".
        8. Верни РОВНО один валидный JSON-объект со всеми 13 ключами
           (12 полей + evidence), пригодный для парсинга через json.loads
           без предварительной обработки. Без markdown, без ```json,
           без комментариев, без текста до или после. Начни ответ сразу
           с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — модель с одним оператором:
        Фрагмент:
        "Обработку персональных данных клиентов товарищества ведёт
        Товарищ 1 — ООО «Альфа», выступающее оператором ПДн. Остальные
        товарищи обрабатывают ПДн исключительно по поручению Товарища 1.
        Состав ПДн: ФИО, телефон, адрес. Ответственность за утечку ПДн
        несёт Товарищ 1. Согласия субъектов ПДн получает Товарищ 1."
        Ответ:
        {
          "data_processing_status": "defined",
          "data_processing_details": "обработку ПДн клиентов ведёт Товарищ 1 — ООО «Альфа»",
          "data_processing_roles_code": "single_operator",
          "data_processing_roles_details": "Товарищ 1 — оператор, остальные товарищи — обработчики по поручению",
          "personal_data_scope_status": "defined",
          "personal_data_scope_details": "ФИО, телефон, адрес",
          "data_breach_liability_status": "defined",
          "data_breach_liability_details": "ответственность за утечку несёт Товарищ 1",
          "consent_management_status": "defined",
          "consent_management_details": "согласия субъектов ПДн получает Товарищ 1",
          "data_after_exit_status": "not_defined",
          "data_after_exit_details": "Данные не определены",
          "evidence": [
            {"clause_ref": "п. 11.1", "quote": "Обработку персональных данных клиентов товарищества ведёт Товарищ 1 — ООО «Альфа», выступающее оператором ПДн."},
            {"clause_ref": "п. 11.2", "quote": "Остальные товарищи обрабатывают ПДн исключительно по поручению Товарища 1."},
            {"clause_ref": "п. 11.3", "quote": "Состав ПДн: ФИО, телефон, адрес."},
            {"clause_ref": "п. 11.4", "quote": "Ответственность за утечку ПДн несёт Товарищ 1."},
            {"clause_ref": "п. 11.5", "quote": "Согласия субъектов ПДн получает Товарищ 1."}
          ]
        }

        Пример 2 — совместные операторы:
        Фрагмент:
        "Товарищи являются совместными операторами персональных данных.
        Ответственность за утечку ПДн распределяется между товарищами
        солидарно. При выходе товарища из товарищества ПДн, переданные
        им в общую базу, сохраняются до истечения срока обработки."
        Ответ:
        {
          "data_processing_status": "defined",
          "data_processing_details": "товарищи являются совместными операторами ПДн",
          "data_processing_roles_code": "joint_operators",
          "data_processing_roles_details": "совместные операторы",
          "personal_data_scope_status": "not_defined",
          "personal_data_scope_details": "Данные не определены",
          "data_breach_liability_status": "defined",
          "data_breach_liability_details": "солидарная ответственность между товарищами",
          "consent_management_status": "not_defined",
          "consent_management_details": "Данные не определены",
          "data_after_exit_status": "defined",
          "data_after_exit_details": "ПДн сохраняются до истечения срока обработки",
          "evidence": [
            {"clause_ref": "п. 11.1", "quote": "Товарищи являются совместными операторами персональных данных."},
            {"clause_ref": "п. 11.2", "quote": "Ответственность за утечку ПДн распределяется между товарищами солидарно."},
            {"clause_ref": "п. 11.3", "quote": "При выходе товарища из товарищества ПДн, переданные им в общую базу, сохраняются до истечения срока обработки."}
          ]
        }

        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Стороны обязуются исполнять договор."
        Ответ:
        {
          "data_processing_status": "not_defined",
          "data_processing_details": "Данные не определены",
          "data_processing_roles_code": "not_defined",
          "data_processing_roles_details": "Данные не определены",
          "personal_data_scope_status": "not_defined",
          "personal_data_scope_details": "Данные не определены",
          "data_breach_liability_status": "not_defined",
          "data_breach_liability_details": "Данные не определены",
          "consent_management_status": "not_defined",
          "consent_management_details": "Данные не определены",
          "data_after_exit_status": "not_defined",
          "data_after_exit_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Все 13 ключей (12 полей + evidence) присутствуют в JSON?
        2. data_processing_roles_code — строго из allowed_values?
        3. Все *_status — строго "defined" / "not_defined"?
        4. Определены ли роли операторов ПДн?
        5. Проверен ли состав обрабатываемых ПДн?
        6. Проверена ли ответственность за утечки?
        7. Проверено ли управление согласиями?
        8. Проверена ли судьба ПДн при выходе?
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "data_processing_status": "<defined / not_defined>",
          "data_processing_details": "<текст или 'Данные не определены'>",
          "data_processing_roles_code": "<single_operator / joint_operators / processor_model / not_defined>",
          "data_processing_roles_details": "<текст или 'Данные не определены'>",
          "personal_data_scope_status": "<defined / not_defined>",
          "personal_data_scope_details": "<текст или 'Данные не определены'>",
          "data_breach_liability_status": "<defined / not_defined>",
          "data_breach_liability_details": "<текст или 'Данные не определены'>",
          "consent_management_status": "<defined / not_defined>",
          "consent_management_details": "<текст или 'Данные не определены'>",
          "data_after_exit_status": "<defined / not_defined>",
          "data_after_exit_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 800

    retrieval:
      retrieval_profile: "definitions_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "персональные данные обработка персональных данных оператор персональных данных поручение обработки 152-ФЗ субъект персональных данных согласие на обработку утечка персональных данных конфиденциальность персональных данных защита персональных данных обработчик персональных данных"
      preferred_unit_types:
        - personal_data
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
        - boilerplate
      negative_keywords:
        - "вклад товарища"
        - "распределение прибыли"
        - "налоговый учёт"
        - "прекращение"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.30, 0.80]
        boost: 0.15
        scope: segment
      context_k: 10
      max_chunks: 14
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
        - "boilerplate"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1600

      compact_output: false

      presence_signal:
        field: "data_processing_within_partnership_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по защите персональных данных. Извлеки
        из договора простого товарищества сведения об обработке ПДн
        между товарищами: роли операторов, состав ПДн, ответственность
        за утечки, управление согласиями, судьба ПДн при выходе.
        Не анализируй вклады как таковые, распределение прибыли,
        налоговый учёт или прекращение товарищества.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. data_processing_within_partnership_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (data_processing_status, data_processing_roles_code,
              personal_data_scope_status, data_breach_liability_status,
              consent_management_status, data_after_exit_status)
             ≠ "not_defined";
           - "missing" — если все шесть содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - data_processing_status = "not_defined";
           - data_processing_roles_code = "not_defined";
           - personal_data_scope_status = "not_defined";
           - data_breach_liability_status = "not_defined";
           - consent_management_status = "not_defined";
           - data_after_exit_status = "not_defined";
           - все *_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. data_processing_status:
           - "defined" — если в тексте прямо указано условие об обработке
             ПДн между товарищами;
           - "not_defined" — иначе.

        2. data_processing_details:
           Краткое user-facing описание условий обработки ПДн.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        3. data_processing_roles_code:
           Используй только одно из значений:
           - "single_operator" — один товарищ — оператор, остальные —
             обработчики по поручению;
           - "joint_operators" — совместные операторы ПДн;
           - "processor_model" — модель поручения обработки другому
             товарищу;
           - "not_defined" — иначе.

        4. data_processing_roles_details:
           Краткое user-facing описание распределения ролей.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        5. personal_data_scope_status:
           - "defined" — если прямо указан состав обрабатываемых
             персональных данных;
           - "not_defined" — иначе.

        6. personal_data_scope_details:
           Краткое user-facing перечисление состава ПДн
           (например: "ФИО, телефон, адрес").
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        7. data_breach_liability_status:
           - "defined" — если прямо указано распределение
             ответственности за утечки ПДн;
           - "not_defined" — иначе.

        8. data_breach_liability_details:
           Краткое user-facing описание ответственности за утечки.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        9. consent_management_status:
           - "defined" — если прямо указан порядок управления
             согласиями субъектов ПДн;
           - "not_defined" — иначе.

        10. consent_management_details:
            Краткое user-facing описание порядка управления
            согласиями.
            Если данных нет — "Данные не определены".
            Если данные противоречивы — "Не удалось определить".

        11. data_after_exit_status:
            - "defined" — если прямо указана судьба ПДн при выходе
              товарища (сохраняются / удаляются / передаются);
            - "not_defined" — иначе.

        12. data_after_exit_details:
            Краткое user-facing описание судьбы ПДн при выходе.
            Если данных нет — "Данные не определены".
            Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни data_processing_within_partnership_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не делай выводов по типовой структуре договора.
        - Не извлекай сведения о вкладах как таковых, распределении прибыли, налоговом учёте, прекращении товарищества и иных нерелевантных темах.
        - data_processing_roles_code = "single_operator" если один товарищ — оператор, остальные — обработчики.
        - data_processing_roles_code = "joint_operators" если товарищи совместные операторы ПДн.
        - data_processing_roles_code = "processor_model" если модель поручения обработки другому товарищу.
        - data_after_exit_details — судьба ПДн при выходе товарища (сохраняются / удаляются / передаются).
        - Если в разных фрагментах указаны противоречивые сведения — статус → "not_defined", текстовое поле → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни условия об обработке ПДн между товарищами,
           ни состава ПДн, ни ответственности за утечки, ни согласий,
           ни судьбы ПДн после выхода.
           → presence = "missing";
             все *_status = "not_defined";
             data_processing_roles_code = "not_defined";
             все *_details = "Данные не определены".

        2. Неполное раскрытие или прямое исключение.
           а) Общая фраза: «Товарищи соблюдают законодательство о ПДн»
              без указания ролей, состава и порядка.
              → presence = "present";
                data_processing_status = "not_defined";
                data_processing_roles_code = "not_defined".
           б) Прямо указано, что ПДн между товарищами не обрабатываются.
              → presence = "present";
                data_processing_status = "defined";
                data_processing_details содержит формулировку.

        3. Противоречие между фрагментами.
           В разных частях договора указаны противоречивые роли
           операторов или разные модели распределения ПДн.
           → presence = "unclear";
             data_processing_roles_code = "not_defined";
             data_processing_roles_details = "Не удалось определить".

        4. Специфика темы — модель с одним оператором.
           Указано, что ПДн обрабатывает один товарищ-оператор,
           остальные — по поручению, с определённым составом ПДн
           и ответственностью за утечку.
           → presence = "present";
             data_processing_status = "defined";
             data_processing_roles_code = "single_operator";
             personal_data_scope_status = "defined";
             data_breach_liability_status = "defined";
             consent_management_status = "defined".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для data_processing_within_partnership_presence используй только: "present", "missing", "unclear".
        - Для enum-полей *_status используй только: "defined", "not_defined".
        - Для data_processing_roles_code используй только: "single_operator", "joint_operators", "processor_model", "not_defined".
        - Fallback при отсутствии данных:
          * все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "data_processing_within_partnership_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по обработке ПДн между товарищами. Внутреннее агрегатное signal-поле."
          required: true

        - name: "data_processing_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус условий обработки ПДн между товарищами."
          required: true

        - name: "data_processing_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Обработка ПДн"
          description: "Условия обработки персональных данных между товарищами."
          required: true

        - name: "data_processing_roles_code"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Роли операторов ПДн"
          allowed_values: ["single_operator", "joint_operators", "processor_model", "not_defined"]
          description: "Модель распределения ролей операторов ПДн между товарищами."
          required: false

        - name: "data_processing_roles_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Детали ролей"
          description: "Детали распределения ролей операторов (для Drawer)."
          required: false

        - name: "personal_data_scope_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания состава ПДн."
          required: false

        - name: "personal_data_scope_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Состав ПДн"
          description: "Состав обрабатываемых персональных данных."
          required: false

        - name: "data_breach_liability_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус ответственности за утечки ПДн."
          required: false

        - name: "data_breach_liability_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 4
          label: "Ответственность за утечки"
          description: "Распределение ответственности за утечки ПДн."
          required: false

        - name: "consent_management_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус управления согласиями субъектов ПДн."
          required: false

        - name: "consent_management_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Согласия субъектов"
          description: "Порядок управления согласиями субъектов ПДн (для Drawer)."
          required: false

        - name: "data_after_exit_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус судьбы ПДн при выходе товарища."
          required: false

        - name: "data_after_exit_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
