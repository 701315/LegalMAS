          description: "Попытка полного освобождения выбывшего товарища от ответственности (оспоримо перед третьими лицами)."
          required: false

      store_payload: true

  - id: implicit_partnership
    name: "Негласное товарищество (ст. 1054 ГК РФ)"
    description: >
      Фактографическая проверка режима раскрытия существования товарищества
      третьим лицам: открытое / негласное / смешанное. Режим ответственности
      публичного товарища, солидарная ответственность при раскрытии
      (п. 2–3 ст. 1054 ГК РФ), последствия прекращения негласного
      товарищества.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 160

    rules:
      keywords:
        - "негласное товарищество"
        - "не раскрывается"
        - "тайное товарищество"
        - "публично действует"
        - "от имени товарищества"
        - "раскрытие существования"
        - "солидарная ответственность при раскрытии"
        - "тайный товарищ"
        - "скрытое участие"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)негласн[а-яё]+\\s+товариществ"
        - "(?i)не\\s+раскрыва[а-яё]+\\s+существован"
        - "(?i)публичн[а-яё]+\\s+действу"
        - "(?i)(тайный|скрытый)\\s+товарищ"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор простого товарищества (ст. 1054 ГК РФ).
        Проверяется только один вопрос: режим раскрытия существования
        товарищества третьим лицам и ответственность в каждом режиме.
        Нормативные ориентиры:
        - п. 1 ст. 1054 ГК РФ — договором может быть предусмотрено,
          что его существование НЕ РАСКРЫВАЕТСЯ третьим лицам (негласное
          товарищество). Каждый товарищ отвечает по сделкам только
          от своего имени.
        - п. 2 ст. 1054 ГК РФ — при прекращении негласного товарищества
          товарищи отвечают СОЛИДАРНО по неисполненным общим обязательствам
          перед третьими лицами.
        - п. 3 ст. 1054 ГК РФ — если третьему лицу стало известно
          о существовании негласного товарищества, оно вправе требовать
          исполнения от всех товарищей солидарно.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Если договор прямо не указывает негласность — по умолчанию
          применяется открытый режим (НЕ выводи негласность).

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Режим раскрытия существования товарищества третьим лицам:
           открытое / негласное / смешанное.
        2. Кто публично действует от имени товарищества.
        3. Условие об ответственности при раскрытии существования
           товарищества третьему лицу.
        4. Порядок ответственности при прекращении негласного товарищества.
        5. Наличие прямого запрета на раскрытие существования
           товарищества.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Для enum-полей (*_status, disclosure_regime_code) при отсутствии
           данных возвращай "not_defined"; для non_disclosure_prohibition —
           "not_detected".
        4. Для строковых *_details при отсутствии данных возвращай строго
           "Данные не определены".
        5. Не используй "None", "null", пустые строки или отсутствующие ключи.
        6. В evidence включай только прямые цитаты из текста договора.
        7. disclosure_regime_code: "open" (открытое) / "implicit" (негласное) /
           "mixed" (смешанное) / "not_defined".
        8. Если договор прямо не указывает негласность — disclosure_regime_code
           = "not_defined" (НЕ выводи "open" автоматически).
        9. non_disclosure_prohibition = "detected" если в договоре прямо
           запрещено раскрывать существование товарищества третьим лицам.
        10. Верни РОВНО один валидный JSON-объект со всеми 10 ключами
            (9 полей + evidence), пригодный для парсинга через json.loads
            без предварительной обработки. Без markdown, без ```json,
            без комментариев, без текста до или после. Начни ответ сразу
            с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — негласное товарищество с публичным товарищем:
        Фрагмент:
        "Существование товарищества не раскрывается третьим лицам.
        Публично от имени товарищества действует Товарищ 1. Если третьему
        лицу станет известно о существовании товарищества, оно вправе
        требовать исполнения от всех товарищей солидарно. При прекращении
        товарищества товарищи отвечают солидарно по неисполненным общим
        обязательствам."
        Ответ:
        {
          "disclosure_regime_code": "implicit",
          "disclosure_regime_details": "существование товарищества не раскрывается третьим лицам",
          "public_partner_status": "defined",
          "public_partner_details": "Товарищ 1 действует публично от имени товарищества",
          "disclosed_liability_status": "defined",
          "disclosed_liability_details": "при раскрытии существования товарищества третьему лицу — солидарная ответственность всех товарищей",
          "termination_liability_status": "defined",
          "termination_liability_details": "при прекращении товарищества — солидарная ответственность по неисполненным общим обязательствам",
          "non_disclosure_prohibition": "detected",
          "evidence": [
            {"clause_ref": "п. 14.1", "quote": "Существование товарищества не раскрывается третьим лицам."},
            {"clause_ref": "п. 14.2", "quote": "Публично от имени товарищества действует Товарищ 1."},
            {"clause_ref": "п. 14.3", "quote": "Если третьему лицу станет известно о существовании товарищества, оно вправе требовать исполнения от всех товарищей солидарно."},
            {"clause_ref": "п. 14.4", "quote": "При прекращении товарищества товарищи отвечают солидарно по неисполненным общим обязательствам."}
          ]
        }

        Пример 2 — открытое товарищество:
        Фрагмент:
        "Товарищи действуют открыто, их существование не скрывается
        от третьих лиц. От имени товарищества выступает каждый товарищ."
        Ответ:
        {
          "disclosure_regime_code": "open",
          "disclosure_regime_details": "товарищи действуют открыто, существование не скрывается",
          "public_partner_status": "defined",
          "public_partner_details": "от имени товарищества выступает каждый товарищ",
          "disclosed_liability_status": "not_defined",
          "disclosed_liability_details": "Данные не определены",
          "termination_liability_status": "not_defined",
          "termination_liability_details": "Данные не определены",
          "non_disclosure_prohibition": "not_detected",
          "evidence": [
            {"clause_ref": "п. 14.1", "quote": "Товарищи действуют открыто, их существование не скрывается от третьих лиц."}
          ]
        }

        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Стороны обязуются исполнять договор."
        Ответ:
        {
          "disclosure_regime_code": "not_defined",
          "disclosure_regime_details": "Данные не определены",
          "public_partner_status": "not_defined",
          "public_partner_details": "Данные не определены",
          "disclosed_liability_status": "not_defined",
          "disclosed_liability_details": "Данные не определены",
          "termination_liability_status": "not_defined",
          "termination_liability_details": "Данные не определены",
          "non_disclosure_prohibition": "not_detected",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Все 10 ключей (9 полей + evidence) присутствуют в JSON?
        2. disclosure_regime_code — строго из allowed_values?
        3. Все *_status — строго "defined" / "not_defined"?
        4. non_disclosure_prohibition — строго "detected" / "not_detected"?
        5. Проверена ли ответственность при раскрытии и прекращении?
        6. Все *_details заполнены или "Данные не определены"?
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "disclosure_regime_code": "<open / implicit / mixed / not_defined>",
          "disclosure_regime_details": "<текст или 'Данные не определены'>",
          "public_partner_status": "<defined / not_defined>",
          "public_partner_details": "<текст или 'Данные не определены'>",
          "disclosed_liability_status": "<defined / not_defined>",
          "disclosed_liability_details": "<текст или 'Данные не определены'>",
          "termination_liability_status": "<defined / not_defined>",
          "termination_liability_details": "<текст или 'Данные не определены'>",
          "non_disclosure_prohibition": "<detected / not_detected>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 700

    retrieval:
      retrieval_profile: "definitions_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "негласное товарищество не раскрывается третьим лицам тайное товарищество публично действует от имени товарищества раскрытие существования солидарная ответственность при раскрытии тайный товарищ скрытое участие режим раскрытия"
      preferred_unit_types:
        - general_provision
        - confidentiality
        - obligation
      excluded_unit_types:
        - definition
        - technical_fragment
      preferred_clause_functions:
        - boilerplate
        - definitions
        - limitations
      negative_keywords:
        - "вклад товарища"
        - "распределение прибыли"
        - "налоговый учёт"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 0.40]
        boost: 0.15
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "boilerplate"
        - "definitions"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1400

      compact_output: false

      presence_signal:
        field: "implicit_partnership_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора простого товарищества
        сведения о режиме раскрытия существования товарищества третьим
        лицам и ответственности в каждом режиме.
        Не анализируй вклады как таковые, распределение прибыли, налоговый
        учёт или прекращение (кроме специального условия ст. 1054).
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. implicit_partnership_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (disclosure_regime_code, public_partner_status,
              disclosed_liability_status, termination_liability_status)
             ≠ "not_defined", либо non_disclosure_prohibition = "detected";
           - "missing" — если все четыре *_status/code = "not_defined"
             и non_disclosure_prohibition = "not_detected";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - disclosure_regime_code = "not_defined";
           - public_partner_status = "not_defined";
           - disclosed_liability_status = "not_defined";
           - termination_liability_status = "not_defined";
           - non_disclosure_prohibition = "not_detected";
           - все *_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. disclosure_regime_code:
           Используй только одно из значений:
           - "open" — если прямо указано, что товарищи действуют открыто,
             существование товарищества раскрывается;
           - "implicit" — если прямо указано, что существование
             товарищества НЕ раскрывается третьим лицам;
           - "mixed" — если сочетание режимов;
           - "not_defined" — если режим прямо не указан.

        2. disclosure_regime_details:
           Краткое user-facing обоснование режима.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        3. public_partner_status:
           - "defined" — если прямо указано, кто публично действует
             от имени товарищества;
           - "not_defined" — иначе.

        4. public_partner_details:
           Краткое user-facing описание публичного товарища.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        5. disclosed_liability_status:
           - "defined" — если прямо указана ответственность товарищей
             при раскрытии существования товарищества третьему лицу
             (солидарная ответственность по п. 3 ст. 1054 ГК РФ);
           - "not_defined" — иначе.

        6. disclosed_liability_details:
           Краткое user-facing описание ответственности при раскрытии.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        7. termination_liability_status:
           - "defined" — если прямо указана ответственность товарищей
             при прекращении негласного товарищества (солидарная
             по п. 2 ст. 1054 ГК РФ);
           - "not_defined" — иначе.

        8. termination_liability_details:
           Краткое user-facing описание ответственности при прекращении.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        9. non_disclosure_prohibition:
           Используй только одно из значений:
           - "detected" — если в договоре прямо запрещено раскрывать
             существование товарищества третьим лицам;
           - "not_detected" — если такого условия в тексте нет.
        </task>

        <context_rules>
        - Перед остальными полями заполни implicit_partnership_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не делай выводов по типовой структуре договора.
        - Не извлекай сведения о вкладах как таковых, распределении прибыли, налоговом учёте и иных нерелевантных темах.
        - disclosure_regime_code = "implicit" только при прямом указании негласности; НЕ выводи "open" автоматически, если не указано.
        - non_disclosure_prohibition = "detected" только при прямом запрете.
        - Если в разных фрагментах указаны противоречивые сведения — статус → "not_defined", текстовое поле → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни режима раскрытия, ни публичного товарища,
           ни ответственности при раскрытии / прекращении, ни запрета
           раскрытия.
           → presence = "missing";
             disclosure_regime_code = "not_defined";
             все *_status = "not_defined";
             non_disclosure_prohibition = "not_detected";
             все *_details = "Данные не определены".

        2. Неполное раскрытие или прямое исключение.
           а) Общая фраза: «Стороны действуют в общих интересах»
              без указания режима раскрытия.
              → presence = "present";
                disclosure_regime_code = "not_defined".
           б) Прямо указано, что товарищи действуют открыто
              (это присутствие регулирования, а не его отсутствие).
              → presence = "present";
                disclosure_regime_code = "open";
                non_disclosure_prohibition = "not_detected".

        3. Противоречие между фрагментами.
           В разных частях договора указаны противоречивые режимы
           раскрытия или разные режимы ответственности.
           → presence = "unclear";
             disclosure_regime_code = "not_defined";
             соответствующий *_details = "Не удалось определить".

        4. Специфика темы — негласное товарищество с полным набором.
           Указано, что существование не раскрывается, определён
           публичный товарищ, установлена солидарная ответственность
           при раскрытии и прекращении.
           → presence = "present";
             disclosure_regime_code = "implicit";
             public_partner_status = "defined";
             disclosed_liability_status = "defined";
             termination_liability_status = "defined";
             non_disclosure_prohibition = "detected".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для implicit_partnership_presence используй только: "present", "missing", "unclear".
        - Для disclosure_regime_code используй только: "open", "implicit", "mixed", "not_defined".
        - Для enum-полей *_status используй только: "defined", "not_defined".
        - Для non_disclosure_prohibition используй только: "detected", "not_detected".
        - Fallback при отсутствии данных:
          * все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "implicit_partnership_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по режиму раскрытия и ответственности негласного товарищества. Внутреннее агрегатное signal-поле."
          required: true

        - name: "disclosure_regime_code"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Режим раскрытия"
          allowed_values: ["open", "implicit", "mixed", "not_defined"]
          description: "Режим раскрытия существования товарищества третьим лицам."
          required: true

        - name: "disclosure_regime_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Основание режима"
          description: "Прямая цитата обоснования режима (для Drawer)."
          required: false

        - name: "public_partner_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения публичного товарища."
          required: false

        - name: "public_partner_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Публичный товарищ"
          description: "Товарищ, публично действующий от имени товарищества."
          required: false

        - name: "disclosed_liability_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус ответственности при раскрытии существования товарищества."
          required: false

        - name: "disclosed_liability_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
