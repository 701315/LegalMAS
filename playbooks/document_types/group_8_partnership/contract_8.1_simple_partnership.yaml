        severity: hard
        weight: -1.0
        description: "Создание юрлица (ООО, АО и т.п.) уводит к корпоративным договорам, а не к простому товариществу"

      - pattern: "(?i)\\bООО\\b"
        severity: hard
        weight: -1.0
        description: "Прямой фокус на обществе с ограниченной ответственностью — корпоративный контекст"

      - pattern: "(?i)учредительн[ыо]й\\s+договор"
        severity: hard
        weight: -1.0
        description: "Учредительный договор — создание юрлица, а не простое товарищество"

      # ── Soft exclusions

      - pattern: "(?i)трудов[оа]й\\s+договор"
        severity: soft
        weight: -0.35
        description: "Трудовой договор с элементами совместной деятельности не является простым товариществом"

      - pattern: "(?i)агентск[иоя]+\\s+договор"
        severity: soft
        weight: -0.3
        description: "Агентский договор — посредничество, а не объединение вкладов для общей цели"

      - pattern: "(?i)инвестиционн[оа]е\\s+товариществ[оо]"
        severity: soft
        weight: -0.4
        description: "Инвестиционное товарищество — отдельная конструкция главы 55.1 ГК РФ"

      - pattern: "(?i)договор\\s+подряд[аа]"
        severity: soft
        weight: -0.3
        description: "Подряд с распределением рисков не равен простому товариществу без юрлица"

