  - id: "information_right_clause"
    name: "Право на информацию (неотчуждаемое)"
    description: "Каждый товарищ имеет право на информацию"
    legal_base: "ст. 1045 ГК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "право на информацию"
