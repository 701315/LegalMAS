    retrieval:
      retrieval_profile: "title_transfer_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "общая долевая собственность общее имущество товарищей доля в общем имуществе распоряжение общим имуществом пользование общим имуществом определение долей пропорционально вкладам внесённое имущество продукция доходы преимущественное право покупки отчуждение доли государственная регистрация права"
      preferred_unit_types:
        - obligation
        - general_provision
        - title_transfer
      excluded_unit_types:
        - definition
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "распределение прибыли"
        - "выход из товарищества"
        - "прекращение"
        - "налоговый учёт"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.10, 0.60]
        boost: 0.15
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1400

      compact_output: false

      presence_signal:
        field: "common_property_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора простого товарищества
        сведения о режиме общего имущества: собственность, доли,
        распоряжение, пользование, государственная регистрация.
        Не анализируй вклады как таковые, прибыль, ведение дел
        или прекращение.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. common_property_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (common_property_regime_code, shares_determination_status,
              disposal_procedure_status, use_procedure_status,
              state_registration_status) ≠ "not_defined";
           - "missing" — если все пять содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - common_property_regime_code = "not_defined";
           - regime_deviations_code = "not_detected";
           - shares_determination_status = "not_defined";
           - disposal_procedure_status = "not_defined";
           - use_procedure_status = "not_defined";
           - state_registration_status = "not_defined";
           - все *_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. common_property_regime_code:
           Используй только одно из значений:
           - "share" — если прямо указана общая долевая собственность;
           - "single_owner" — если имущество в собственности одного
             товарища;
           - "other" — иной режим (совместная собственность, долевая
             с иными правилами);
           - "not_defined" — если режим прямо не указан.

        2. common_property_regime_details:
           Прямая цитата о режиме имущества.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        3. regime_deviations_code:
           Используй только одно из значений:
           - "detected" — если договором установлено отклонение
             от презумпции общей долевой собственности (п. 1 ст. 1043
             ГК РФ), например, имущество закрепляется за одним
             товарищем или передаётся в пользование другим;
           - "not_detected" — если отклонений нет.

        4. regime_deviations_details:
           Описание отклонения с дословной формулировкой.
           Если отклонений нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        5. shares_determination_status:
           - "defined" — если прямо указан способ определения долей;
           - "not_defined" — иначе.

        6. shares_determination_details:
           Краткое user-facing описание способа определения долей
           (например: "пропорционально стоимости вкладов").
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        7. disposal_procedure_status:
           - "defined" — если прямо указан порядок распоряжения
             общим имуществом (согласие всех, единогласие, кворум);
           - "not_defined" — иначе.

        8. disposal_procedure_details:
           Краткое user-facing описание порядка распоряжения.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        9. use_procedure_status:
           - "defined" — если прямо указан порядок пользования
             общим имуществом;
           - "not_defined" — иначе.

        10. use_procedure_details:
            Краткое user-facing описание порядка пользования.
            Если данных нет — "Данные не определены".
            Если данные противоречивы — "Не удалось определить".

        11. state_registration_status:
            - "defined" — если прямо упоминается государственная
              регистрация права на недвижимое имущество (или указано
              на недвижимость во вкладе);
            - "not_defined" — иначе.

        12. state_registration_details:
            Краткое user-facing описание условия о госрегистрации.
            Если данных нет — "Данные не определены".
            Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни common_property_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не делай выводов по типовой структуре договора.
        - Не извлекай сведения о вкладах как таковых, распределении прибыли, ведении дел, выходе из товарищества, прекращении, налоговом учёте и иных нерелевантных темах.
        - common_property_regime_code = "share" только при прямом указании общей долевой собственности.
        - common_property_regime_code = "single_owner" если имущество закрепляется за одним товарищем.
        - regime_deviations_code = "detected" при явном отклонении от презумпции п. 1 ст. 1043 ГК РФ.
        - state_registration_status = "defined" если в договоре упоминается госрегистрация права на недвижимость или наличие недвижимости во вкладе.
        - Если в разных фрагментах указаны противоречивые сведения и конфликт нельзя разрешить по тексту — статус → "not_defined", текстовое поле → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни режима имущества, ни определения долей,
           ни порядка распоряжения / пользования, ни госрегистрации.
           → presence = "missing";
             common_property_regime_code = "not_defined";
             regime_deviations_code = "not_detected";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        2. Неполное раскрытие или прямое исключение.
           а) Общая фраза: "Имущество товарищей используется для общих
              целей" без указания режима собственности и долей.
              → presence = "present";
                common_property_regime_code = "not_defined".
           б) Прямо указано, что общая долевая собственность не возникает
              (имущество остаётся в собственности каждого товарища).
              → presence = "present";
                common_property_regime_code = "single_owner";
                regime_deviations_code = "detected".

        3. Противоречие между фрагментами.
           В разных частях договора указан разный режим имущества
           или разные способы определения долей.
           → presence = "unclear";
             common_property_regime_code = "not_defined";
             shares_determination_details = "Не удалось определить".

        4. Специфика темы — госрегистрация для недвижимости.
           Указано, что в составе вкладов есть недвижимое имущество,
           и требуется государственная регистрация права.
           → presence = "present";
             state_registration_status = "defined";
             state_registration_details содержит формулировку
             о госрегистрации.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для common_property_check_presence используй только: "present", "missing", "unclear".
        - Для common_property_regime_code используй только: "share", "single_owner", "other", "not_defined".
        - Для regime_deviations_code используй только: "detected", "not_detected".
        - Для enum-полей *_status используй только: "defined", "not_defined".
        - Fallback при отсутствии данных:
          * все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "common_property_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по режиму общего имущества. Внутреннее агрегатное signal-поле."
          required: true

        - name: "common_property_regime_code"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Режим имущества"
          allowed_values: ["share", "single_owner", "other", "not_defined"]
          description: "Режим общего имущества товарищей."
          required: true

        - name: "common_property_regime_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Основание режима"
          description: "Прямая цитата о режиме имущества (для Drawer)."
          required: false

        - name: "regime_deviations_code"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Отклонения от ст. 1043"
          allowed_values: ["detected", "not_detected"]
          description: "Наличие отклонений от презумпции общей долевой собственности (п. 1 ст. 1043 ГК РФ)."
          required: false

        - name: "regime_deviations_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Описание отклонений"
          description: "Описание отклонений от презумпции (для Drawer)."
          required: false

        - name: "shares_determination_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения долей."
          required: false

        - name: "shares_determination_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Определение долей"
          description: "Способ определения долей в общем имуществе."
