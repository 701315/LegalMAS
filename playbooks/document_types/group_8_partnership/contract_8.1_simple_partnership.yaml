          required: false
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 4: Распределение прибыли и убытков
  # ──────────────────────────────────────────────────────────────────────────
  - id: profit_loss_distribution_check
    name: "Распределение прибыли и покрытие убытков"
    description: >
      Фактографическая проверка порядка распределения прибыли и покрытия
      убытков, периодичности распределения и соблюдения императивных норм
      ст. 1046, 1048 ГК РФ (запрет исключения из прибыли, запрет
      освобождения от убытков).
    triggers:
      any: ["profit_distribution_clause"]
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "распределение прибыли"
        - "распределение убытков"
        - "пропорционально вкладам"
        - "доля прибыли"
        - "покрытие убытков"
        - "не участвует в прибыли"
        - "освобождается от убытков"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)\\b\\d+[.,]?\\d*\\s*%"
        - "(?i)пропорциональн"
        - "(?i)(не\\s+участвует|освобождается)\\s+(в\\s+прибыл|от\\s+убытк)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор простого товарищества (ст. 1046, 1048 ГК РФ).
        Проверяется только один вопрос: распределение прибыли и покрытие убытков.
        Важно:
        - Исключение товарища из прибыли НИЧТОЖНО (ст. 1048 ГК РФ).
        - Освобождение от убытков НИЧТОЖНО (ст. 1046 ГК РФ).
        [ЗАДАЧА]
        Найди в тексте договора:
        1. Порядок распределения прибыли.
        2. Порядок покрытия убытков.
        3. Периодичность распределения.
        4. Наличие условий об исключении товарища из прибыли.
        5. Наличие условий об освобождении от убытков.
        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если данные не указаны — "not_defined" / "Данные не определены".
        3. В evidence — только текст договора.
        4. Верни только один JSON-объект.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1:
        Фрагмент:
        "Прибыль распределяется пропорционально вкладам товарищей ежеквартально.
        Убытки покрываются в том же порядке."
        Ответ:
        {
          "profit_distribution_status": "defined",
          "profit_distribution_details": "пропорционально вкладам товарищей",
          "loss_distribution_status": "defined",
          "loss_distribution_details": "в том же порядке",
          "distribution_frequency_status": "defined",
          "distribution_frequency_details": "ежеквартально",
          "profit_exclusion_status": "not_defined",
          "loss_exemption_status": "not_defined",
          "evidence": [
            {
              "clause_ref": "п. 4.1",
              "quote": "Прибыль распределяется пропорционально вкладам товарищей ежеквартально."
            }
          ]
        }
        Пример 2:
        Фрагмент:
        "Стороны договорились о распределении прибыли."
        Ответ:
        {
          "profit_distribution_status": "not_defined",
          "profit_distribution_details": "Данные не определены",
          "loss_distribution_status": "not_defined",
          "loss_distribution_details": "Данные не определены",
          "distribution_frequency_status": "not_defined",
          "distribution_frequency_details": "Данные не определены",
          "profit_exclusion_status": "not_defined",
          "loss_exemption_status": "not_defined",
          "evidence": []
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о распределении прибыли.
        2. Найди прямую цитату о покрытии убытков.
        3. Найди прямую цитату о периодичности.
        4. Проверь наличие ничтожных условий об исключении из прибыли/убытков.
        5. Если прямой цитаты нет — верни "not_defined".
        Не выводи шаги. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "profit_distribution_status": "<defined / not_defined>",
          "profit_distribution_details": "<текст или 'Данные не определены'>",
          "loss_distribution_status": "<defined / not_defined>",
          "loss_distribution_details": "<текст или 'Данные не определены'>",
          "distribution_frequency_status": "<defined / not_defined>",
          "distribution_frequency_details": "<текст или 'Данные не определены'>",
          "profit_exclusion_status": "<detected / not_defined>",
          "loss_exemption_status": "<detected / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 7
      temperature: 0.0
      max_tokens: 650

    retrieval:
      retrieval_profile: "payment_terms_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "распределение прибыли распределение убытков пропорционально вкладам доля прибыли покрытие убытков не участвует в прибыли освобождается от убытков периодичность распределения ежеквартально"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "вклад"
        - "ведение дел"
