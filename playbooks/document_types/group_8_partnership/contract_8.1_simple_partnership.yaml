        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Все 14 ключей (13 полей + evidence) присутствуют в JSON?
        2. admission_decision_rule — строго из allowed_values?
        3. Все *_status — строго "defined" / "not_defined"?
        4. Проверен ли срок запрета конкуренции?
        5. Проверены ли санкции за нарушение запрета?
        6. Проверены ли последствия нераскрытия конфликта интересов?
        7. Все *_details заполнены или "Данные не определены"?
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "admission_allowed_status": "<defined / not_defined>",
          "admission_allowed_details": "<текст или 'Данные не определены'>",
          "admission_decision_rule": "<unanimous / qualified_majority / simple_majority / not_defined>",
          "non_compete_status": "<defined / not_defined>",
          "non_compete_details": "<текст или 'Данные не определены'>",
          "non_compete_term_status": "<defined / not_defined>",
          "non_compete_term_details": "<текст или 'Данные не определены'>",
          "non_compete_consequences_status": "<defined / not_defined>",
          "non_compete_consequences_details": "<текст или 'Данные не определены'>",
          "conflict_disclosure_status": "<defined / not_defined>",
          "conflict_disclosure_details": "<текст или 'Данные не определены'>",
          "conflict_consequences_status": "<defined / not_defined>",
          "conflict_consequences_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
