  - id: management_and_decisions_check
    name: "Ведение общих дел, полномочия, принятие решений и ограничения"
    description: >
      Фактографическая проверка порядка ведения общих дел (совместно / один
      товарищ / несколько), пределов полномочий ведущего дела, доверенностей,
      процедуры принятия решений, механизма разрешения разногласий и
      ограничений полномочий.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 30

    rules:
      keywords:
        - "ведение общих дел"
        - "ведущий дела"
        - "управляющий товарищ"
        - "уполномоченный товарищ"
        - "полномочия"
        - "доверенность"
        - "совместное ведение"
        - "общее согласие"
        - "порядок принятия решений"
        - "единогласное решение"
        - "единогласно"
        - "квалифицированное большинство"
        - "простое большинство"
        - "тупиковая ситуация"
        - "разногласия"
        - "лимит сделки"
        - "требуется согласие"
        - "требуется одобрение"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)ведени[ея]\\s+общих\\s+дел"
        - "(?i)единогласн"
        - "(?i)большинств[оа]?\\s+голос"
        - "(?i)доверенност"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор простого товарищества (ст. 1044 ГК РФ).
        Проверяется только один вопрос: ведение общих дел, полномочия,
        принятие решений и ограничения.
        Нормативные ориентиры:
        - п. 1 ст. 1044 ГК РФ — при отсутствии в договоре иного ведение дел
          осуществляется совместно (презумпция)
        - п. 2 ст. 1044 ГК РФ — ведущий дела действует на основании
          доверенности, выданной остальными товарищами
        - п. 3 ст. 1044 ГК РФ — полномочия ведущего дела удостоверяются
          доверенностью перед третьими лицами
        - п. 4 ст. 1044 ГК РФ — товарищ, совершивший сделку без полномочий,
          несёт личную ответственность перед третьими лицами
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Отсутствие урегулирования типа управления — сам по себе факт;
          презумпция совместного ведения (п. 1 ст. 1044 ГК РФ) применяется
          на этапе юридической оценки.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Тип управления: совместное / один товарищ / несколько товарищей.
        2. Имя (идентификацию) ведущего дела товарища.
        3. Условие о доверенности для ведущего дела.
        4. Правило принятия решений: единогласие / квалифицированное
           большинство / простое большинство / смешанное.
        5. Перечень вопросов, требующих единогласия.
        6. Ограничения полномочий ведущего дела (лимиты, одобрение).
        7. Механизм разрешения разногласий / тупиковых ситуаций.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Для enum-полей (*_status, management_type, decision_rule)
           при отсутствии данных возвращай "not_defined".
        4. Для строковых *_details при отсутствии данных возвращай строго
           "Данные не определены".
        5. Не используй "None", "null", пустые строки или отсутствующие ключи.
        6. В evidence включай только прямые цитаты из текста договора.
        7. Если в договоре указано, что дела ведёт один товарищ
           (management_type = "single_partner"), но условие о доверенности
           отсутствует — poa_required_status = "not_defined", при этом
           в детекции учитывай, что по п. 2 ст. 1044 ГК РФ доверенность
           в таком случае обязательна.
        8. Если в договоре тип управления прямо не указан —
           management_type = "not_defined" (не выводи презумпцию
           из закона).
        9. Верни РОВНО один валидный JSON-объект со всеми 13 ключами
           (12 полей + evidence), пригодный для парсинга через json.loads
           без предварительной обработки. Без markdown, без ```json,
           без комментариев, без текста до или после. Начни ответ сразу
           с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — один товарищ ведёт дела, доверенность и ограничения есть:
        Фрагмент:
        "Ведение общих дел возлагается на Товарища 1. Товарищ 1 действует
        на основании доверенности, выданной остальными товарищами.
        Сделки свыше 1 000 000 рублей требуют единогласного решения
        всех товарищей. Вопросы изменения цели товарищества решаются
        единогласно. Разногласия разрешаются путём переговоров, при
        неурегулировании — в суде."
        Ответ:
        {
          "management_type": "single_partner",
          "managing_partner_status": "defined",
          "managing_partner_details": "Товарищ 1",
          "poa_required_status": "defined",
          "poa_required_details": "на основании доверенности, выданной остальными товарищами",
          "decision_rule": "mixed",
          "unanimous_issues_status": "defined",
          "unanimous_issues_details": "сделки свыше 1 000 000 рублей; изменение цели товарищества",
          "authority_limits_status": "defined",
          "authority_limits_details": "сделки свыше 1 000 000 рублей требуют единогласного решения всех товарищей",
          "deadlock_mechanism_status": "defined",
          "deadlock_mechanism_details": "переговоры, при неурегулировании — в суде",
          "evidence": [
            {"clause_ref": "п. 3.1", "quote": "Ведение общих дел возлагается на Товарища 1."},
            {"clause_ref": "п. 3.1", "quote": "Товарищ 1 действует на основании доверенности, выданной остальными товарищами."},
            {"clause_ref": "п. 3.4", "quote": "Сделки свыше 1 000 000 рублей требуют единогласного решения всех товарищей."},
            {"clause_ref": "п. 3.5", "quote": "Разногласия разрешаются путём переговоров, при неурегулировании — в суде."}
          ]
        }

        Пример 2 — совместное ведение дел, деталей нет:
        Фрагмент:
        "Товарищи ведут дела совместно."
        Ответ:
        {
          "management_type": "joint",
          "managing_partner_status": "not_defined",
          "managing_partner_details": "Данные не определены",
          "poa_required_status": "not_defined",
          "poa_required_details": "Данные не определены",
          "decision_rule": "not_defined",
          "unanimous_issues_status": "not_defined",
          "unanimous_issues_details": "Данные не определены",
          "authority_limits_status": "not_defined",
          "authority_limits_details": "Данные не определены",
          "deadlock_mechanism_status": "not_defined",
          "deadlock_mechanism_details": "Данные не определены",
          "evidence": [
            {"clause_ref": "п. 3.1", "quote": "Товарищи ведут дела совместно."}
          ]
        }

        Пример 3 — single_partner без доверенности (edge-case):
        Фрагмент:
        "Ведение общих дел поручается Товарищу 2."
        Ответ:
        {
          "management_type": "single_partner",
          "managing_partner_status": "defined",
          "managing_partner_details": "Товарищ 2",
          "poa_required_status": "not_defined",
          "poa_required_details": "Данные не определены",
          "decision_rule": "not_defined",
          "unanimous_issues_status": "not_defined",
          "unanimous_issues_details": "Данные не определены",
          "authority_limits_status": "not_defined",
          "authority_limits_details": "Данные не определены",
          "deadlock_mechanism_status": "not_defined",
          "deadlock_mechanism_details": "Данные не определены",
          "evidence": [
            {"clause_ref": "п. 3.1", "quote": "Ведение общих дел поручается Товарищу 2."}
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Все 13 ключей (12 полей + evidence) присутствуют в JSON?
        2. Найдена ли прямая цитата о типе управления?
        3. Найдена ли прямая цитата о ведущем дела?
        4. Найдена ли прямая цитата о доверенности?
        5. Найдена ли прямая цитата о правиле принятия решений?
        6. Найдены ли ограничения полномочий?
        7. Найден ли механизм разрешения разногласий?
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "management_type": "<joint / single_partner / multiple_partners / not_defined>",
          "managing_partner_status": "<defined / not_defined>",
          "managing_partner_details": "<идентификация или 'Данные не определены'>",
          "poa_required_status": "<defined / not_defined>",
          "poa_required_details": "<текст или 'Данные не определены'>",
          "decision_rule": "<unanimous / qualified_majority / simple_majority / mixed / not_defined>",
          "unanimous_issues_status": "<defined / not_defined>",
          "unanimous_issues_details": "<перечень или 'Данные не определены'>",
          "authority_limits_status": "<defined / not_defined>",
          "authority_limits_details": "<ограничения или 'Данные не определены'>",
          "deadlock_mechanism_status": "<defined / not_defined>",
          "deadlock_mechanism_details": "<механизм или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 700

    retrieval:
      retrieval_profile: "authority_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "ведение общих дел ведущий дела управляющий товарищ уполномоченный товарищ полномочия доверенность совместное ведение общее согласие порядок принятия решений единогласное решение квалифицированное большинство простое большинство тупиковая ситуация разногласия лимит сделки требуется согласие одобрение"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "вклад"
        - "распределение прибыли"
        - "выход из товарищества"
        - "прекращение"
        - "неустойка"
        - "налоговый учёт"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.20, 0.65]
        boost: 0.15
        scope: segment
      context_k: 10
      max_chunks: 14
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1500

      compact_output: false

      presence_signal:
        field: "management_and_decisions_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора простого товарищества
        сведения о ведении дел, полномочиях, принятии решений
        и ограничениях.
        Не анализируй вклады, распределение прибыли, прекращение или налоги.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. management_and_decisions_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (managing_partner_status, poa_required_status,
              unanimous_issues_status, authority_limits_status,
              deadlock_mechanism_status) ≠ "not_defined";
           - "missing" — если все пять содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - managing_partner_status = "not_defined";
           - poa_required_status = "not_defined";
           - unanimous_issues_status = "not_defined";
           - authority_limits_status = "not_defined";
           - deadlock_mechanism_status = "not_defined";
           - management_type = "not_defined";
           - decision_rule = "not_defined";
           - все *_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. management_type:
           Используй только одно из значений:
           - "joint" — если ведение дел совместно;
           - "single_partner" — если ведёт один товарищ;
           - "multiple_partners" — если ведут несколько товарищей
             (не все, не один);
           - "not_defined" — если тип управления прямо не указан.

        2. managing_partner_status:
           - "defined" — если прямо указана идентификация ведущего дела
             товарища / товарищей;
           - "not_defined" — иначе.

        3. managing_partner_details:
           Краткая идентификация ведущего дела товарища.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        4. poa_required_status:
           - "defined" — если в договоре явно указано условие
             о доверенности для ведущего дела;
           - "not_defined" — иначе.

        5. poa_required_details:
           Краткое описание условия о доверенности.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        6. decision_rule:
           Используй только одно из значений:
           - "unanimous" — если все решения единогласны;
           - "qualified_majority" — если установлено квалифицированное
             большинство;
           - "simple_majority" — если простое большинство;
           - "mixed" — если сочетание разных правил для разных вопросов;
           - "not_defined" — иначе.

        7. unanimous_issues_status:
           - "defined" — если прямо указан перечень вопросов, требующих
             единогласия;
           - "not_defined" — иначе.

        8. unanimous_issues_details:
           Краткое user-facing перечисление вопросов единогласия.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        9. authority_limits_status:
           - "defined" — если прямо указаны ограничения полномочий
             ведущего дела (лимиты, требование одобрения);
           - "not_defined" — иначе.

        10. authority_limits_details:
            Краткое user-facing описание ограничений полномочий.
            Если данных нет — "Данные не определены".
            Если данные противоречивы — "Не удалось определить".

        11. deadlock_mechanism_status:
            - "defined" — если прямо указан механизм разрешения
              разногласий / тупиковых ситуаций;
            - "not_defined" — иначе.

        12. deadlock_mechanism_details:
            Краткое user-facing описание механизма
            (переговоры, медиация, суд, привлечение третьего лица).
            Если данных нет — "Данные не определены".
            Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни management_and_decisions_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не делай выводов по типовой структуре договора.
        - Не извлекай сведения о вкладах, распределении прибыли, выходе из товарищества, прекращении, неустойках, налоговом учёте и иных нерелевантных темах.
        - management_type: "joint" если ведение дел совместно; "single_partner" если ведёт один товарищ; "multiple_partners" если ведут несколько товарищей (не все, не один); "not_defined" если тип прямо не указан.
        - decision_rule: "unanimous" если все решения единогласны; "qualified_majority" если квалифицированное большинство; "simple_majority" если простое большинство; "mixed" если сочетание разных правил для разных вопросов.
        - poa_required_status = "defined" только при явном указании условия о доверенности для ведущего дела.
        - Презумпция совместного ведения дел (п. 1 ст. 1044 ГК РФ) не выводится из закона: если в тексте тип управления прямо не указан — management_type = "not_defined".
        - Если в разных фрагментах указаны противоречивые условия и конфликт нельзя разрешить по тексту — статус → "not_defined", текстовое поле → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни типа управления, ни ведущего дела, ни доверенности,
           ни правил решений, ни ограничений, ни механизма разногласий.
           → presence = "missing";
             все *_status = "not_defined";
             management_type = "not_defined";
             decision_rule = "not_defined";
             все *_details = "Данные не определены".

        2. Неполное раскрытие или прямое исключение.
           а) Общая фраза: "Товарищи ведут дела совместно" без указания
              порядка принятия решений, ограничений и механизма разногласий.
              → presence = "present";
                management_type = "joint";
                decision_rule = "not_defined".
           б) Прямо указано, что ограничений на полномочия ведущего дела нет.
              → presence = "present";
                authority_limits_status = "not_defined";
                authority_limits_details содержит дословную формулировку.

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные типы управления
           или противоречивые правила решений.
           → presence = "unclear";
             management_type = "not_defined";
             decision_rule = "not_defined".

        4. Специфика темы — ведущий дела без доверенности.
           Указано, что дела ведёт один товарищ, но условие о доверенности
           отсутствует.
           → presence = "present";
             management_type = "single_partner";
             managing_partner_status = "defined";
             poa_required_status = "not_defined".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для management_and_decisions_check_presence используй только: "present", "missing", "unclear".
        - Для enum-полей *_status используй только: "defined", "not_defined".
        - Для management_type используй только: "joint", "single_partner", "multiple_partners", "not_defined".
        - Для decision_rule используй только: "unanimous", "qualified_majority", "simple_majority", "mixed", "not_defined".
        - Fallback при отсутствии данных:
          * все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "management_and_decisions_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по ведению дел и принятию решений. Внутреннее агрегатное signal-поле."
          required: true

        - name: "managing_partner_status"
          type: "string"
