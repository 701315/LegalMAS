        - "section"
      required_kind: "legal_unit"
      retrieval_query: "выдел доли кредитор товарища личный кредитор обращение взыскания выдел доли в натуре денежная компенсация доли преимущественное право выкупа субсидиарная ответственность товарищей стоимость доли публичные торги"
      preferred_unit_types:
        - liability_provision
