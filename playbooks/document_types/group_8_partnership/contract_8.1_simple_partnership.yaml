  - id: creditor_seizure_of_share
    name: "Выдел доли кредитором товарища (ст. 1049 ГК РФ)"
    description: >
      Фактографическая проверка механизма выдела доли товарища по требованию
      его личного кредитора (п. 1 ст. 1049 ГК РФ), наличия договорных защит
      (преимущественное право выкупа), порядка оценки доли, субсидиарной
      ответственности оставшихся товарищей (п. 2 ст. 1049 ГК РФ)
      и договорных запретов на выдел.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 140

    rules:
      keywords:
        - "выдел доли"
        - "кредитор товарища"
        - "личный кредитор"
        - "обращение взыскания"
        - "выдел доли в натуре"
        - "денежная компенсация доли"
        - "преимущественное право выкупа"
        - "субсидиарная ответственность товарищей"
        - "стоимость доли"
        - "публичные торги"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)выдел[а-яё]*\\s+дол[ия]"
        - "(?i)(обращени[ея]|взыскани[ея])[а-яё]*\\s+на\\s+дол"
        - "(?i)преимущественн[а-яё]+\\s+прав"
        - "(?i)субсидиарн[а-яё]+\\s+ответственност"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор простого товарищества (ст. 1049 ГК РФ).
        Проверяется только один вопрос: выдел доли товарища по требованию
        его личного кредитора и договорные защиты от этого.
        Нормативные ориентиры:
        - п. 1 ст. 1049 ГК РФ — кредитор участника долевой или совместной
          собственности при недостатке у собственника другого имущества
          вправе требовать выдела доли должника в общем имуществе
          для обращения на неё взыскания.
        - п. 2 ст. 1049 ГК РФ — если выдел в натуре невозможен либо
          остальные участники / кредитор возражают, выделяющийся
          получает денежную компенсацию; оставшиеся товарищи несут
          субсидиарную ответственность по личному долгу должника
          В ПРЕДЕЛАХ СТОИМОСТИ СВОИХ ВКЛАДОВ.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Норма ст. 1049 императивна; договорный запрет выдела сам по себе
          факт (фиксируется как попытка ограничения), но не отменяет норму.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Договорные механизмы защиты от выдела доли кредитором
           (преимущественное право товарищей, порядок выкупа, уведомления).
        2. Порядок выкупа доли товарищами при требовании кредитора.
        3. Способ оценки доли при выкупе (независимый оценщик / балансовая
           стоимость / соглашение сторон).
        4. Условие о субсидиарной ответственности оставшихся товарищей
           (закреплено ли, ограничено ли вкладом).
        5. Наличие договорного запрета на выдел доли кредитором.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Для enum-полей (*_status) при отсутствии данных возвращай
           "not_defined"; для non_seizure_clause — "not_detected".
        4. Для строковых *_details при отсутствии данных возвращай строго
           "Данные не определены".
        5. Не используй "None", "null", пустые строки или отсутствующие ключи.
        6. В evidence включай только прямые цитаты из текста договора.
        7. Различай: защита (преимущественное право выкупа, порядок оценки) —
           договорный механизм, допустимый и защищающий товарищество;
           запрет выдела — попытка ограничить императивную норму, фиксируется
           как риск, но не отменяет п. 1 ст. 1049 ГК РФ.
        8. Верни РОВНО один валидный JSON-объект со всеми 10 ключами
           (9 полей + evidence), пригодный для парсинга через json.loads
           без предварительной обработки. Без markdown, без ```json,
           без комментариев, без текста до или после. Начни ответ сразу
           с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — защита от выдела предусмотрена:
        Фрагмент:
        "В случае предъявления кредитором товарища требования о выделе
        его доли остальные товарищи имеют преимущественное право выкупа
        этой доли по рыночной стоимости, определяемой независимым
        оценщиком, в течение 60 дней с момента получения уведомления.
        При недостатке у выбывающего товарища иного имущества оставшиеся
        товарищи несут субсидиарную ответственность в пределах
        стоимости своих вкладов."
        Ответ:
        {
          "seizure_protection_status": "defined",
          "seizure_protection_details": "преимущественное право выкупа доли остальными товарищами при требовании кредитора",
          "buyout_right_status": "defined",
          "buyout_right_details": "преимущественное право выкупа доли по рыночной стоимости в течение 60 дней",
          "buyout_valuation_method_status": "defined",
          "buyout_valuation_method_details": "рыночная стоимость, определяемая независимым оценщиком",
          "subsidiary_liability_status": "defined",
          "subsidiary_liability_details": "субсидиарная ответственность в пределах стоимости вкладов",
          "non_seizure_clause": "not_detected",
          "evidence": [
            {"clause_ref": "п. 12.1", "quote": "В случае предъявления кредитором товарища требования о выделе его доли остальные товарищи имеют преимущественное право выкупа этой доли по рыночной стоимости, определяемой независимым оценщиком, в течение 60 дней с момента получения уведомления."},
            {"clause_ref": "п. 12.2", "quote": "При недостатке у выбывающего товарища иного имущества оставшиеся товарищи несут субсидиарную ответственность в пределах стоимости своих вкладов."}
          ]
        }

        Пример 2 — договорный запрет выдела (попытка ограничения):
        Фрагмент:
        "Выдел доли товарища по требованию его кредитора не допускается.
        Кредитор вправе требовать возмещения за счёт личного имущества
        товарища."
        Ответ:
        {
          "seizure_protection_status": "defined",
          "seizure_protection_details": "установлен запрет на выдел доли кредитором",
          "buyout_right_status": "not_defined",
          "buyout_right_details": "Данные не определены",
          "buyout_valuation_method_status": "not_defined",
          "buyout_valuation_method_details": "Данные не определены",
          "subsidiary_liability_status": "not_defined",
          "subsidiary_liability_details": "Данные не определены",
          "non_seizure_clause": "detected",
          "evidence": [
            {"clause_ref": "п. 12.1", "quote": "Выдел доли товарища по требованию его кредитора не допускается."}
          ]
        }

        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Стороны обязуются исполнять договор."
        Ответ:
        {
          "seizure_protection_status": "not_defined",
          "seizure_protection_details": "Данные не определены",
          "buyout_right_status": "not_defined",
          "buyout_right_details": "Данные не определены",
          "buyout_valuation_method_status": "not_defined",
          "buyout_valuation_method_details": "Данные не определены",
          "subsidiary_liability_status": "not_defined",
          "subsidiary_liability_details": "Данные не определены",
          "non_seizure_clause": "not_detected",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Все 10 ключей (9 полей + evidence) присутствуют в JSON?
        2. Все *_status — строго "defined" / "not_defined"?
        3. non_seizure_clause — строго "detected" / "not_detected"?
        4. Проверено ли наличие преимущественного права выкупа?
        5. Определён ли способ оценки доли?
        6. Проверена ли субсидиарная ответственность оставшихся товарищей?
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "seizure_protection_status": "<defined / not_defined>",
          "seizure_protection_details": "<текст или 'Данные не определены'>",
          "buyout_right_status": "<defined / not_defined>",
          "buyout_right_details": "<текст или 'Данные не определены'>",
          "buyout_valuation_method_status": "<defined / not_defined>",
          "buyout_valuation_method_details": "<текст или 'Данные не определены'>",
          "subsidiary_liability_status": "<defined / not_defined>",
          "subsidiary_liability_details": "<текст или 'Данные не определены'>",
          "non_seizure_clause": "<detected / not_detected>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 700

    retrieval:
      retrieval_profile: "liability_cap_check"
      corpus_scope: "primary_segment"
      levels:
