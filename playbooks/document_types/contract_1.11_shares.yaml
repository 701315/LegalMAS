validation_engine_v3_2:
  rules_enhanced:
    phrases:
      high:
        - "Продавец обязуется передать в собственность Покупателя долю в уставном капитале"
        - "Продавец обязуется передать акции, а Покупатель обязуется оплатить их стоимость"
        - "Переход права на долю подлежит нотариальному удостоверению"
        - "Право собственности на акции переходит с момента внесения записи по лицевому счету"
        - "Стороны подтверждают, что ознакомились с результатами Due Diligence"
      medium:
        - "Цена Доли/Акций определяется Сторонами в размере ___ рублей"
        - "Продавец заверяет, что Доля/Акции не обременены правами третьих лиц"
        - "Сделка не требует одобрения антимонопольного органа"
        - "Продавец предоставил Покупателю возможность проведения Due Diligence"
    patterns:
      required:
        - "(?i)(дол[яи].*уставн.*капитал|акци[ияй].*общест|пакет.*акци|корпоративн.*прав|бездокументарн.*ценн.*бумаг)"
      optional:
        - "(?i)(номинальн.*стоимость|ООО.*№.*|АО.*№.*|ПАО.*№.*|рег.*номер.*выпуск)"
    exclusion_logic:
      - condition: "gratuitous_transfer AND corporate_rights"
        target: "reclassify"
        confidence: 0.90
        description: "Безвозмездная передача доли/акций - это дарение (contract_1.8), имеет ограничения для коммерческих организаций"
      - condition: "assignment_to_creditor AND debt_settlement"
        target: "reclassify"
        confidence: 0.85
        description: "Передача доли в счет погашения долга может квалифицироваться как отступное или новация"
    weights:
      keyword_high: 3.5
      keyword_medium: 1.5
      keyword_low: 0.5
      phrase_high: 4.0
      phrase_medium: 1.5
      pattern_required: 5.0
      pattern_optional: 1.0
    classification:
      min_confidence: 0.90
      max_matches: 1

    party_roles:
      - "Продавец (Seller) — текущий участник/акционер, отчуждающий корпоративные права"
      - "Покупатель (Buyer) — приобретатель бизнеса или доли участия"
      - "Общество/Эмитент (Target Company) — компания, доли/акции которой продаются (часто третья сторона, но не участник договора)"
    essential_terms:
