# playbooks/document_types/registry.yaml

# Document Types Registry
# Используется YAML Registry (src/classifiers/yaml_registry.py) для загрузки всех типов.
# Classifier L1 (RuleBasedClassifier) читает rules каждого типа при классификации.
# Это единственный источник правды для типов документов на Этапах 2.5–8.
