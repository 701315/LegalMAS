# ═════════════════════════════════════════════════════════════════════════════
# DOCUMENT TYPE GROUPS
# Human-readable metadata for document type classes used in DD Grid V1.
# Every group_id referenced in document_types[].group must have an entry here.
# If an entry is missing, YAMLRegistry produces a fallback with label = group_id.
# Rendered by DD Grid builder (V1.7) as top-level class headers.
# ═════════════════════════════════════════════════════════════════════════════
document_type_groups:

  group_1_ownership:
    label: "Передача права собственности"
    label_en: "Transfer of Ownership"
    display_order: 10

  group_2_use:
    label: "Передача в пользование"
    label_en: "Transfer for Use / Lease"
    display_order: 20

  group_3_works:
    label: "Выполнение работ"
    label_en: "Work Contracts / Construction"
    display_order: 30

  group_4_services:
    label: "Оказание услуг"
    label_en: "Provision of Services"
    display_order: 40

  group_5_financial:
    label: "Финансовые обязательства"
    label_en: "Financial Obligations"
    display_order: 50

  group_6_intermediary:
    label: "Посреднические услуги"
    label_en: "Intermediary Services"
    display_order: 60

  group_7_ip:
    label: "Интеллектуальная собственность"
    label_en: "Intellectual Property"
    display_order: 70

  group_8_partnership:
    label: "Партнёрство и совместная деятельность"
    label_en: "Partnership and Joint Ventures"
    display_order: 80

  group_9_special:
    label: "Специальные договоры"
    label_en: "Special Contracts"
    display_order: 90