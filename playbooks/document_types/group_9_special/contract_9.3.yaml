      negative_keywords:
        - "верность"
        - "супружеская верность"
        - "любовь"
        - "уважение"
        - "воспитание детей"
        - "место жительства ребёнка"
        - "место жительства ребенка"
        - "порядок общения с детьми"
        - "выбор фамилии"
        - "ограничивает правоспособность"
        - "ограничивает дееспособность"
        - "право на обращение в суд"
      regex_patterns:
        - "(?i)(супружеск(ая|ой)\\s+верност|воспитание\\s+дет|общение\\s+с\\s+дет)"

  - id: "no_capacity_restriction"
    name: "Отсутствие ограничения правоспособности/дееспособности (ст. 42 СК РФ)"
    description: "Проверяет, что договор не ограничивает правоспособность или дееспособность"
    legal_base: "ст. 42 СК РФ"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords: []
      keyword_mode: "any"
      negative_keywords:
        - "запрещается работать"
        - "обязан не работать"
        - "не имеет права заниматься"
        - "запрещается обращаться в суд"
        - "не вправе обращаться в суд"
        - "ограничивает право на труд"
      regex_patterns:
        - "(?i)запрещается\\s+(работать|заниматься)"
        - "(?i)не\\s+(имеет\\s+права|вправе)\\s+(обращаться\\s+в\\s+суд|работать)"

  - id: "valuation_mechanism"
    name: "Механизм оценки имущества при разделе"
    description: "Проверяет наличие порядка оценки имущества при разделе"
    legal_base: "ст. 42 СК РФ"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "оценка имущества"
        - "независимый оценщик"
        - "рыночная стоимость"
        - "кадастровая стоимость"
        - "стоимость определяется"
        - "порядок оценки"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)независим(ый|ого)\\s+оценщик"
        - "(?i)рыночн(ая|ой)\\s+стоимост"

  - id: "foreign_applicable_law"
    name: "Применимое право при наличии иностранного элемента"
    description: "Проверяет выбор применимого права при международном характере брака"
    legal_base: "ст. 161 СК РФ, МЧП"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
      any: ["foreign_element"]
    rules:
      keywords:
        - "применимое право"
        - "право Российской Федерации"
        - "иностранное право"
        - "ст. 161 СК РФ"
        - "международное частное право"
        - "коллизионная норма"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)применим(ое|ого)\\s+прав(о|а)"
        - "(?i)ст\\.?\\s*161\\s*СК"

  - id: "digital_assets_regime"
    name: "Режим цифровых активов и криптовалюты"
    description: "Проверяет урегулированность цифровых активов в договоре"
    legal_base: "ст. 42 СК РФ, ФЗ-259 «О ЦФА»"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
      any: ["high_value_assets"]
    rules:
      keywords:
        - "криптовалюта"
        - "цифровые активы"
        - "цифровая валюта"
        - "токен"
        - "блокчейн"
        - "биткоин"
        - "цифровые финансовые активы"
        - "ЦФА"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)криптовалют|цифров(ые|ых)\\s+(актив|валют)|\\bЦФА\\b"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 7: DD_REQUEST_TEMPLATES
#  Читается: DDRequestTemplateLoader
#  Ключи = check_id из checks_v8 и doc_type_checks выше.
#  DDRequestTemplateLoader.render() матчит по exact или prefix.
# ════════════════════════════════════════════════════════════════════════════

dd_request_templates:

  parties_extraction:
    text: >
      Просим предоставить по {doc_names}: полные данные сторон (ФИО, паспортные данные,
      дата и место рождения), статус отношений (вступающие в брак / супруги),
      реквизиты свидетельства о браке (если имеется).
    addressee: "Обе стороны / Нотариус"

  parties_identification:
    text: >
      В {doc_names} необходимо указать полные идентификационные данные обоих супругов
      (ФИО, паспорт, дата рождения, регистрация).
    addressee: "Обе стороны"

  notarial_form_check:
    text: >
      Просим подтвердить по {doc_names}: (а) факт нотариального удостоверения;
      (б) ФИО нотариуса; (в) номер в реестре нотариальных действий;
      (г) дату удостоверения. Без удостоверения договор ничтожен (ст. 41 СК РФ).
    addressee: "Нотариус"

  notarial_form_requirement:
    text: >
      В {doc_names} отсутствует указание на нотариальное удостоверение.
      Договор подлежит обязательному нотариальному удостоверению (ст. 41 СК РФ).
    addressee: "Обе стороны / Нотариус"

  effective_date_specified:
    text: >
      Просим уточнить в {doc_names} момент вступления договора в силу:
      с момента регистрации брака (для до-брачного) или с момента нотариального
      удостоверения (для брачного в период брака).
    addressee: "Нотариус"

  property_regime_check:
    text: >
      Просим детализировать в {doc_names}: (а) режим добрачного имущества каждого супруга;
      (б) режим имущества, нажитого в браке; (в) конкретные объекты и их распределение;
      (г) режим доходов от трудовой и предпринимательской деятельности.
    addressee: "Юридический советник / Нотариус"

  property_regime_specified:
    text: >
      В {doc_names} необходимо чётко определить режим собственности: совместная,
      раздельная, долевая или смешанная (ст. 42 СК РФ).
    addressee: "Обе стороны"

  premarital_property_regime:
    text: >
      Просим уточнить в {doc_names} режим добрачного имущества каждого супруга:
      перечень объектов, подтверждение права собственности.
    addressee: "Обе стороны"

  marital_property_regime:
    text: >
      Просим уточнить в {doc_names} режим имущества, нажитого в браке:
      какой режим (совместный/раздельный/долевой) применяется к каким категориям.
    addressee: "Обе стороны"

  inherited_gifted_property:
    text: >
      Просим подтвердить в {doc_names}: (а) перечень имущества, полученного по наследству
      или в дар; (б) подтверждение режима личной собственности (ст. 36 СК РФ);
      (в) режим доходов от такого имущества.
    addressee: "Обе стороны"

  division_upon_divorce:
    text: >
      Просим детализировать в {doc_names} порядок раздела при расторжении брака:
      кому переходят конкретные объекты, сроки передачи, компенсации, порядок оценки.
    addressee: "Юридический советник"

  specific_assets_inventory:
    text: >
      Просим подготовить к {doc_names} приложение с перечнем имущества:
      объекты недвижимости (кадастровые номера), транспортные средства (VIN),
      банковские счета, ценные бумаги, иное значимое имущество.
    addressee: "Обе стороны"

  unfavorable_position_check:
    text: >
      ВНИМАНИЕ: в {doc_names} выявлены признаки крайне неблагоприятного положения
      одного из супругов (ст. 44 СК РФ). Просим обеспечить: (а) баланс имущественных
      прав; (б) компенсационные механизмы; (в) гарантии жилищных прав; (г) правовое
      заключение нотариуса о соответствии договора требованиям закона.
    addressee: "Нотариус / Юридический советник"

  no_worsening_explicit:
    text: >
      Просим включить в {doc_names} явное указание на недопустимость крайне
      неблагоприятного положения (ст. 44 СК РФ) и подтверждение баланса интересов.
    addressee: "Юридический советник"

  housing_rights_guarantee:
    text: >
      Просим обеспечить в {doc_names} гарантии жилищных прав: право пользования
      жилым помещением, обеспечение жильём при расторжении брака, сроки выселения.
    addressee: "Юридический советник"

  compensation_mechanisms_check:
    text: >
      Просим уточнить в {doc_names}: (а) виды компенсаций (единовременная/периодическая/
      право пользования); (б) конкретные суммы или формулу расчёта; (в) условия и сроки
      выплаты; (г) компенсацию за ведение домашнего хозяйства.
    addressee: "Юридический советник"

  homemaker_compensation_clause:
    text: >
      Просим рассмотреть включение в {doc_names} компенсации супругу, ведущему
      домашнее хозяйство и воспитывающему детей, с указанием суммы или формулы расчёта.
    addressee: "Юридический советник"

  alimony_rights_check:
    text: >
      Просим проверить {doc_names} на предмет: (а) сохранения права нетрудоспособного
      нуждающегося супруга на содержание (ст. 42 СК РФ — императивно); (б) размера
      и порядка выплаты алиментов (если установлены); (в) отсутствия ограничений.
    addressee: "Нотариус / Юридический советник"

  alimony_prohibition_restriction_absent:
    text: >
      ВНИМАНИЕ: в {doc_names} выявлено ограничение алиментных прав. Условие
      об отказе от права на содержание нетрудоспособного нуждающегося супруга
      ничтожно (ст. 42 СК РФ). Просим исключить такое условие.
    addressee: "Нотариус"

  spousal_maintenance:
    text: >
      Просим уточнить в {doc_names}: порядок взаимного содержания, размер,
      сроки выплаты, условия прекращения обязательства.
    addressee: "Юридический советник"

  business_assets_separation_check:
    text: >
      Просим детализировать в {doc_names}: (а) перечень бизнес-активов (доли, акции,
      ИС); (б) режим собственности на них; (в) режим доходов от предпринимательской
      деятельности; (г) порядок при продаже/отчуждении бизнеса.
    addressee: "Юридический советник супруга-предпринимателя"

  business_assets_separation:
    text: >
      Просим уточнить в {doc_names} режим бизнес-активов: какие доли/акции/ИП
      отнесены к раздельной собственности и на каких условиях.
    addressee: "Юридический советник"

  real_estate_division_check:
    text: >
      Просим предоставить по {doc_names}: (а) перечень объектов недвижимости с
      кадастровыми номерами; (б) режим собственности на каждый объект; (в) порядок
      раздела при разводе; (г) урегулированность ипотечных обязательств; (д) сроки передачи.
    addressee: "Юридический советник"

  debt_allocation:
    text: >
      Просим уточнить в {doc_names}: (а) распределение личных и общих долгов;
      (б) порядок погашения кредитов при расторжении; (в) ответственность по
      обязательствам каждого супруга.
    addressee: "Юридический советник"

  mortgage_obligations_allocation:
    text: >
      Просим уточнить в {doc_names}: (а) кто несёт ипотечные обязательства;
      (б) статус созаёмщика; (в) порядок при расторжении брака (рефинансирование,
      продажа, переоформление); (г) согласие банка (если требуется).
    addressee: "Юридический советник / Банк"

  creditor_notification_check:
    text: >
      Просим подтвердить по {doc_names}: обязательство супруга-должника уведомить
      кредиторов (ст. 46 СК РФ), перечень кредиторов, порядок и сроки уведомления.
    addressee: "Обе стороны"

  creditor_notification_clause:
    text: >
      Просим включить в {doc_names} обязательство об уведомлении кредиторов
      в соответствии со ст. 46 СК РФ.
    addressee: "Юридический советник"

  bankruptcy_challenge_risk_check:
    text: >
      ВНИМАНИЕ: {doc_names} содержит условия с повышенным риском оспаривания
      в банкротстве (ФЗ-127). Просим обеспечить: (а) встречное предоставление
      (компенсацию); (б) обоснование экономической целесообразности; (в) правовое
      заключение о рисках оспаривания.
    addressee: "Юридический советник"

  protection_from_creditors_of_other_spouse:
    text: >
      Просим уточнить в {doc_names}: механизмы защиты имущества от взыскания
      по долгам другого супруга с учётом ст. 45, 46 СК РФ.
    addressee: "Юридический советник"

  amendment_and_termination_procedure:
    text: >
      Просим уточнить в {doc_names}: (а) порядок внесения изменений (нотариальная форма,
      ст. 43 СК РФ); (б) основания расторжения; (в) последствия расторжения;
      (г) невозможность одностороннего отказа.
    addressee: "Юридический советник"

  dispute_resolution:
    text: >
      Просим уточнить в {doc_names}: подсудность, досудебный порядок (при наличии),
      медиация (при желании сторон).
    addressee: "Юридический советник"

  severability_clause:
    text: >
      Просим включить в {doc_names} оговорку о делимости: недействительность отдельных
      условий не влечёт недействительности договора в целом (ст. 180 ГК РФ).
    addressee: "Юридический советник"

  family_expenses_allocation:
    text: >
      Просим уточнить в {doc_names}: порядок несения семейных расходов (коммунальные,
      содержание детей, транспорт), пропорции, ответственность за неисполнение.
    addressee: "Обе стороны"

  valuation_mechanism:
    text: >
      Просим согласовать в {doc_names}: порядок оценки имущества при разделе
      (независимый оценщик, рыночная/кадастровая стоимость, порядок оспаривания).
    addressee: "Юридический советник"

  no_personal_nonproperty_conditions:
    text: >
      ВНИМАНИЕ: в {doc_names} выявлены условия о личных неимущественных отношениях
      или правах в отношении детей. Такие условия ничтожны (ст. 42 СК РФ).
      Просим исключить их из договора.
    addressee: "Нотариус"

  no_capacity_restriction:
    text: >
      ВНИМАНИЕ: в {doc_names} выявлены условия, ограничивающие правоспособность
      или дееспособность супруга. Такие условия ничтожны (ст. 42 СК РФ).
      Просим исключить их.
    addressee: "Нотариус"

  foreign_applicable_law:
    text: >
      В {doc_names} присутствует иностранный элемент. Просим определить:
      (а) применимое право (ст. 161 СК РФ); (б) подсудность; (в) признание
      и исполнение договора в иностранной юрисдикции.
    addressee: "Юридический советник по МЧП"

  digital_assets_regime:
    text: >
      Просим уточнить в {doc_names}: режим криптовалюты и цифровых активов,
      порядок их учёта, оценки и раздела при расторжении брака.
    addressee: "Юридический советник"

  personal_and_child_matters_prohibition:
    text: >
      ВНИМАНИЕ: в {doc_names} выявлены условия, запрещённые ст. 42 СК РФ
      (личные неимущественные отношения, условия в отношении детей). Просим
      немедленно исключить данные условия. Они ничтожны и могут повлиять
      на оценку договора в целом.
    addressee: "Нотариус / Юридический советник"

  extremely_unfavorable_position_prohibition:
    text: >
      ВНИМАНИЕ: в {doc_names} выявлены условия, ставящие одного из супругов
      в крайне неблагоприятное положение (ст. 44 СК РФ). Такие условия ничтожны.
      Просим обеспечить баланс прав и компенсационные механизмы.
    addressee: "Нотариус / Юридический советник"

  notarial_form_mandatory:
    text: >
      ВНИМАНИЕ: {doc_names} содержит указание на отсутствие нотариального
      удостоверения. Без нотариальной формы брачный договор ничтожен (ст. 41 СК РФ).
    addressee: "Обе стороны"

  # Generic fallback
  _default:
    text: >
      Просим предоставить дополнительную информацию по вопросу «{check_name}»
      применительно к {doc_names}.
    addressee: "Юридический советник"