type: contract_9.3_prenuptial_agreement
name: "Брачный договор (брачный контракт)"

description: |
  Соглашение лиц, вступающих в брак, или супругов, определяющее исключительно имущественные
  права и обязанности супругов в браке и (или) в случае его расторжения. Позволяет изменить
  установленный законом режим совместной собственности на режим раздельной, долевой или
  смешанной собственности. Не может регулировать личные неимущественные отношения, права
  и обязанности в отношении детей, ограничивать правоспособность или дееспособность супругов,
  содержать условия, ставящие одного из супругов в крайне неблагоприятное положение.
  Требует обязательного нотариального удостоверения; несоблюдение формы влечёт ничтожность.
  Регулируется Главой 8 Семейного кодекса РФ (ст. 40–44), а также ст. 45–46 СК РФ
  (ответственность по обязательствам, гарантии прав кредиторов).

version: 4.0
parent: class_9_special_imperative

# Структура
#   classification_runtime_v1  → YAMLRegistry (L1/L2 классификация)
#   trigger_definitions        → TriggerDetector
#   checks_v8                  → DocTypeCheckLoader (прямое исполнение)
#   doc_type_checks            → DocTypeCheckConverter (авто-конверсия)
#   dd_request_templates       → DDRequestTemplateLoader
#   compliance_rules           → exclusion_logic → compliance-проверки

metadata:
  category: contract
  subcategory: family_law
  complexity: high
  risk_level: high
  jurisdiction: RU
  language: ru
  legal_base: "Семейный кодекс РФ (Глава 8, ст. 40–44; ст. 45–46)"
  doc_types_supported:
    - "брачный договор до заключения брака"
    - "брачный договор в период брака"
    - "брачный контракт"
    - "дополнительное соглашение к брачному договору"

engine_expectations:
  evidence_required: true
  evidence_style: "pinpoint"
  allow_not_found: true
  output_style: "dd_grid"
  prefer_structured_outputs: true

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 1: КЛАССИФИКАЦИЯ (L1/L2)
#  Читается: YAMLRegistry → L1FilenameClassifier, L2HeaderClassifier
# ════════════════════════════════════════════════════════════════════════════

classification_runtime_v1:

  rules:

    filename_patterns:
      - "(?i)брачн[а-яё]*\\s*(договор|контракт)"
      - "(?i)prenup"
      - "(?i)antenuptial"
      - "(?i)postnuptial"
      - "(?i)marriage[\\s_.-]?contract"

    folder_patterns:
      - "(?i)брачн"
      - "(?i)семейн"
      - "(?i)prenup"
      - "(?i)family[\\s_]?law"

    keywords:

      high:
        - "брачный договор"
        - "брачный контракт"
        - "супруги"
        - "лица, вступающие в брак"
        - "имущественные права и обязанности супругов"
        - "режим имущества супругов"
        - "нотариальное удостоверение"
        - "ст. 40 СК РФ"
        - "ст. 42 СК РФ"

      medium:
        - "совместная собственность супругов"
        - "раздельная собственность супругов"
        - "долевая собственность супругов"
        - "имущество, нажитое в браке"
        - "добрачное имущество"
        - "расторжение брака"
        - "раздел имущества"
        - "режим совместной собственности"
        - "режим раздельной собственности"
        - "крайне неблагоприятное положение"
        - "ст. 44 СК РФ"

      low:
        - "семейные расходы"
        - "взаимное содержание"
        - "алиментные обязательства"
        - "кредитные обязательства супругов"
        - "унаследованное имущество"
        - "изменение брачного договора"
        - "уведомление кредиторов"

    exclusions:
      - "соглашение о разделе общего имущества супругов"
      - "соглашение об уплате алиментов"
      - "соглашение о порядке осуществления родительских прав"
      - "договор дарения между супругами"
      - "индивидуальный трудовой договор"
      - "гражданско-правовой договор"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 2: ТРИГГЕРЫ
#  Читается: TriggerDetector → doc.applicable_triggers
# ════════════════════════════════════════════════════════════════════════════

  trigger_definitions:

    prenuptial_context:
      any_keywords:
        - "лица, вступающие в брак"
        - "до заключения брака"
        - "до регистрации брака"
        - "намеревающиеся вступить в брак"
        - "будущие супруги"

    postnuptial_context:
      any_keywords:
        - "в период брака"
        - "состоящие в браке"
        - "зарегистрированный брак"
        - "свидетельство о заключении брака"

    business_assets_context:
      any_keywords:
        - "доля в уставном капитале"
        - "акции"
        - "предпринимательская деятельность"
        - "ИП"
        - "индивидуальный предприниматель"
        - "бизнес"
        - "предприятие"
        - "корпоративные права"
        - "интеллектуальная собственность"
        - "товарный знак"
        - "патент"

    real_estate_in_contract:
      any_keywords:
        - "квартира"
        - "жилой дом"
        - "земельный участок"
        - "недвижимое имущество"
        - "нежилое помещение"
        - "кадастровый номер"
        - "ЕГРН"

    debt_obligations_context:
      any_keywords:
        - "кредит"
        - "ипотека"
        - "заём"
        - "долговые обязательства"
        - "поручительство"
        - "кредитный договор"
        - "ипотечный кредит"
        - "обязательства перед банком"

    children_present:
      any_keywords:
        - "общие дети"
        - "несовершеннолетние дети"
        - "ребёнок"
        - "ребенок"
        - "дети от предыдущего брака"
        - "интересы детей"

    homemaker_spouse:
      any_keywords:
        - "ведение домашнего хозяйства"
        - "уход за детьми"
        - "не имеющий самостоятельного дохода"
        - "неработающий супруг"
        - "домохозяйка"
        - "отпуск по уходу за ребёнком"

    foreign_element:
      any_keywords:
        - "иностранный гражданин"
        - "гражданин иностранного государства"
        - "двойное гражданство"
        - "имущество за рубежом"
        - "применимое право"
        - "международный брак"

    bankruptcy_risk_context:
      any_keywords:
        - "банкротство"
        - "несостоятельность"
        - "оспаривание сделки"
        - "финансовый управляющий"
        - "конкурсная масса"
        - "ФЗ-127"
        - "закон о банкротстве"
        
    high_value_assets:
      any_keywords:
        - "драгоценности"
        - "предметы роскоши"
        - "транспортные средства"
        - "автомобиль"
        - "яхта"
        - "воздушное судно"
        - "ценные бумаги"
        - "инвестиции"
        - "банковские вклады"
        - "криптовалюта"
        - "цифровые активы"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 3: SHARED PATTERNS
#  Читается: DocTypeCheckLoader через _resolve_yaml_templates()
# ════════════════════════════════════════════════════════════════════════════

shared_patterns:

  passport_data: "(?i)паспорт\\s+серия\\s+\\d{4}\\s+№?\\s*\\d{6}"
  date_pattern: "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"
  money_amount: "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|тыс|млн|процент|%)"
  cadastral_number: "(?i)\\b\\d{2}:\\d{2}:\\d{6,7}:\\d+\\b"
  article_sk_ref: "(?i)ст\\.?\\s*\\d+\\s*СК\\s*РФ"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: COMPLIANCE RULES
#  Читается: DocTypeCheckLoader._exclusion_logic_to_checks()
# ════════════════════════════════════════════════════════════════════════════

compliance_rules:

  - id: "personal_and_child_matters_prohibition"
    name: "Запрет включения условий о личных неимущественных отношениях и правах в отношении детей (ст. 42 СК РФ)"
    description: |
      Брачный договор не может регулировать личные неимущественные отношения между супругами
      (верность, любовь, уважение, выбор фамилии), а также права и обязанности в отношении детей
      (место жительства, порядок общения, алименты на детей). Такие условия ничтожны.
    legal_base: "ст. 42 СК РФ"
    required_triggers: []
    severity: "critical"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      keywords:
        - "воспитание детей"
        - "место жительства ребёнка"
        - "место жительства ребенка"
        - "порядок общения с детьми"
        - "верность"
        - "супружеская верность"
        - "любовь"
        - "уважение"
        - "выбор фамилии"
        - "ограничивает право на обращение в суд"
        - "ограничивает правоспособность"
        - "ограничивает дееспособность"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "личные неимущественные"
        - "воспитание детей"
        - "верность"
        - "правоспособность"
      rerank: true

  - id: "extremely_unfavorable_position_prohibition"
    name: "Запрет условий, ставящих супруга в крайне неблагоприятное положение (ст. 44 СК РФ)"
    description: |
      Условия, ставящие одного из супругов в крайне неблагоприятное положение (например, полный
      отказ от всего имущества, лишение права на жильё при наличии детей и длительном браке),
      ничтожны и могут повлечь признание недействительным договора в целом.
    legal_base: "ст. 44 СК РФ"
    required_triggers: []
    severity: "critical"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      keywords:
        - "отказывается от всего имущества"
        - "не претендует ни на какое имущество"
        - "вся собственность переходит"
        - "лишается права на долю"
        - "полностью отказывается от своих прав"
        - "не имеет права на раздел"
        - "отказывается от права на жильё"
        - "отказывается от права на жилье"
      keyword_mode: "any"
    retrieval:
      context_k: 6
      boost_keywords:
        - "крайне неблагоприятное положение"
        - "отказ от имущества"
        - "лишение прав"
        - "ст. 44 СК РФ"
      rerank: true

  - id: "notarial_form_mandatory"
    name: "Обязательная нотариальная форма (ст. 41 СК РФ)"
    description: |
      Брачный договор подлежит обязательному нотариальному удостоверению. Несоблюдение
      нотариальной формы влечёт ничтожность договора. Проверяется наличие указания
      на нотариальное удостоверение или удостоверительной надписи.
    legal_base: "ст. 41 СК РФ"
    required_triggers: []
    severity: "critical"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      keywords:
        - "без нотариального удостоверения"
        - "в простой письменной форме"
        - "нотариальное удостоверение не требуется"
      keyword_mode: "any"
    retrieval:
      context_k: 3
      boost_keywords:
        - "нотариальное удостоверение"
        - "нотариальная форма"
        - "ст. 41 СК РФ"
      rerank: true

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 5: CHECKS_V8 — LLM/hybrid проверки
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  - id: parties_extraction
    name: "Извлечение сторон брачного договора"
    description: |
      Извлекает ФИО сторон, паспортные данные, статус (вступающие в брак / супруги),
      дату и место регистрации брака (если применимо).
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "супруг"
        - "супруга"
        - "лицо, вступающее в брак"
        - "муж"
        - "жена"
        - "паспорт"
        - "гражданин"
        - "гражданка"
        - "зарегистрирован брак"
        - "свидетельство о заключении брака"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)паспорт\\s+серия\\s+\\d{4}\\s+№?\\s*\\d{6}"
        - "(?i)(супруг|супруга|муж|жена)\\s*[-—:]"
        - "(?i)свидетельств(о|а)\\s+о\\s+(заключении|регистрации)\\s+брака"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий брачный договор.
        Найди в тексте стороны договора.

        Ответь строго в JSON:
        {
          "spouse_1_name": "<ФИО или not_found>",
          "spouse_1_passport": "<серия и номер паспорта или not_found>",
          "spouse_2_name": "<ФИО или not_found>",
          "spouse_2_passport": "<серия и номер паспорта или not_found>",
          "marital_status": "<prenuptial / postnuptial / not_found>",
          "marriage_registration_date": "<дата регистрации брака или not_found>",
          "marriage_certificate_number": "<номер свидетельства или not_found>"
        }

        - "prenuptial" — стороны ещё не состоят в браке
        - "postnuptial" — стороны уже состоят в браке

        ВАЖНО: Если значение явно не указано — пиши "not_found".
      prompt_file: null
      context_k: 6
      temperature: 0.0
      max_tokens: 500
    retrieval:
      context_k: 6
      max_chunks: 10
      boost_keywords:
        - "супруг"
        - "супруга"
        - "паспорт"
        - "свидетельство о браке"
        - "вступающие в брак"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 50
      max_snippet_length: 800
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "spouse_1_name"
          type: "string"
          keyword_hints: ["супруг", "муж", "гражданин"]
          description: "ФИО первого супруга"
        - name: "spouse_2_name"
          type: "string"
          keyword_hints: ["супруга", "жена", "гражданка"]
          description: "ФИО второго супруга"
        - name: "marital_status"
          type: "string"
          allowed_values: ["prenuptial", "postnuptial", "not_found"]
          description: "Статус отношений на момент заключения"
      store_payload: true

  - id: property_regime_check
    name: "Режим собственности на имущество супругов (ст. 42 СК РФ)"
    description: |
      Проверяет, какой режим собственности установлен договором: совместный, долевой,
      раздельный или смешанный. Извлекает режим для добрачного и нажитого в браке имущества.
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "режим собственности"
        - "совместная собственность"
        - "раздельная собственность"
        - "долевая собственность"
        - "смешанный режим"
        - "добрачное имущество"
        - "имущество, нажитое в браке"
        - "каждому из супругов принадлежит"
        - "является личной собственностью"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(совместн|раздельн|долев)(ая|ой|ую)\\s+собственност"
        - "(?i)режим\\s+(совместной|раздельной|долевой|смешанн)"
        - "(?i)имущество.*нажит(ое|ого)\\s+в\\s+(период\\s+)?брак"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий брачный договор.
        Определи режим собственности, установленный договором (ст. 42 СК РФ).

        Ответь строго в JSON:
        {
          "premarital_property_regime": "<joint / separate / shared_proportional / not_specified / not_found>",
          "marital_property_regime": "<joint / separate / shared_proportional / mixed / not_specified / not_found>",
          "specific_assets_listed": "<yes / no / not_found>",
          "regime_clarity": "<clear / ambiguous / not_found>",
          "regime_snippet": "<ключевая цитата или not_found>"
        }

        - "joint" — совместная собственность
        - "separate" — раздельная собственность
        - "shared_proportional" — долевая собственность
        - "mixed" — разные режимы для разных видов имущества
        - "not_specified" — режим упоминается, но не определён конкретно
        - "clear" — формулировки однозначные
        - "ambiguous" — формулировки допускают двоякое толкование

        ВАЖНО: Если значение явно не указано — пиши "not_found".
      prompt_file: null
      context_k: 8
      temperature: 0.0
      max_tokens: 600
    retrieval:
      context_k: 8
      max_chunks: 12
      boost_keywords:
        - "режим собственности"
        - "совместная собственность"
        - "раздельная собственность"
        - "долевая собственность"
        - "имущество, нажитое в браке"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 50
      max_snippet_length: 800
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "premarital_property_regime"
          type: "string"
          allowed_values: ["joint", "separate", "shared_proportional", "not_specified", "not_found"]
          description: "Режим добрачного имущества"
        - name: "marital_property_regime"
          type: "string"
          allowed_values: ["joint", "separate", "shared_proportional", "mixed", "not_specified", "not_found"]
          description: "Режим имущества, нажитого в браке"
        - name: "specific_assets_listed"
          type: "string"
          allowed_values: ["yes", "no", "not_found"]
          description: "Указаны ли конкретные объекты имущества"
        - name: "regime_clarity"
          type: "string"
          allowed_values: ["clear", "ambiguous", "not_found"]
          description: "Ясность формулировок о режиме"
      store_payload: true

  - id: notarial_form_check
    name: "Нотариальное удостоверение (ст. 41 СК РФ)"
    description: |
      Проверяет наличие указания на нотариальное удостоверение или удостоверительной надписи.
      Без нотариального удостоверения договор ничтожен.
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "нотариальное удостоверение"
        - "нотариус"
        - "удостоверено нотариусом"
        - "нотариальная контора"
        - "удостоверительная надпись"
        - "реестр нотариальных действий"
        - "зарегистрировано в реестре"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)удостоверен(о|а)\\s+нотариусом"
        - "(?i)нотариальн(ое|ого|ым)\\s+удостоверен"
        - "(?i)реестр(а|е)?\\s+нотариальн"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий брачный договор.
        Проверь наличие нотариального удостоверения (ст. 41 СК РФ).

        Ответь строго в JSON:
        {
          "notarial_status": "<certified / mentioned / not_found>",
          "notary_name": "<ФИО нотариуса или not_found>",
          "registry_number": "<номер в реестре или not_found>",
          "notarial_snippet": "<цитата или not_found>"
