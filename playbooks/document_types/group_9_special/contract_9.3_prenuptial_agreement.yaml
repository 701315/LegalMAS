          required: true
        - name: "mortis_causa_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Распоряжения на случай смерти"
          description: "Условия о наследовании и переходе прав при смерти супруга, включённые в брачный договор."
          required: false

      store_payload: true

  - id: amendment_dispute_severability_check
    name: "Порядок изменения, расторжения, разрешение споров и делимость (ст. 43 СК РФ, ст. 180 ГК РФ)"
    description: >
      Фактографическая проверка заключительных положений брачного договора:
      обязательность нотариальной формы для изменения и расторжения (ст. 43 п. 1 СК РФ),
      прямой запрет одностороннего отказа от исполнения (ст. 43 п. 3 СК РФ),
      действие условий договора после расторжения брака (post-divorce survival),
      порядок разрешения споров (подсудность, медиация) и наличие оговорки
      о делимости / сохранении силы договора при частичной недействительности (ст. 180 ГК РФ).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 110

    rules:
      keywords:
        - "изменение брачного договора"
        - "расторжение брачного договора"
        - "по взаимному согласию"
        - "в нотариальной форме"
        - "нотариально удостоверенным соглашением"
        - "односторонний отказ не допускается"
        - "одностороннее изменение не допускается"
        - "прекращение брака"
        - "после расторжения брака"
        - "сохраняют силу после"
        - "разрешение споров"
        - "подсудность"
        - "по месту жительства"
        - "досудебный порядок"
        - "медиация"
        - "частичная недействительность"
        - "недействительность отдельных условий"
        - "не влечёт недействительности договора в целом"
        - "сохранение действия договора"
        - "делимость"
      keyword_mode: "any"
      negative_keywords:
        - "алименты на несовершеннолетних"
        - "алименты на детей"
        - "содержание ребенка"
        - "в целях настоящего"
      regex_patterns:
        - "(?i)изменени(е|я)\\s+(и|или)\\s+расторжени(е|я)[^\\.]{0,50}нотариальн"
        - "(?i)односторонн(ий|его)\\s+отказ[^\\.]{0,40}не\\s+допускается"
        - "(?i)недействительность\\s+отдельных\\s+(условий|положений|пунктов)\\s+не\\s+влеч(ёт|ет)"
        - "(?i)спор(ы|ов)[^\\.]{0,40}(разрешаются|подлежат\\s+рассмотрению)"
        - "(?i)сохраняют\\s+(свою\\s+)?силу\\s+после\\s+(расторжения|прекращения)\\s+брака"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по семейному праву.
        Анализируется брачный договор (ст. 43 СК РФ; ст. 180, 450–453 ГК РФ).
        Проверяется только один вопрос: порядок изменения и расторжения договора, запрет одностороннего отказа,
        действие обязательств после развода, порядок разрешения споров и оговорка о делимости.
        Ключевые нормы:
        - П. 1 ст. 43 СК РФ: соглашение об изменении или о расторжении брачного договора совершается в той же форме,
          что и сам брачный договор (обязательная нотариальная форма).
        - П. 3 ст. 43 СК РФ: односторонний отказ от исполнения брачного договора не допускается.
        - П. 3 ст. 43 СК РФ: действие договора прекращается с момента прекращения брака, за исключением обязательств,
          предусмотренных договором на период после прекращения брака.
        - Ст. 180 ГК РФ: недействительность части сделки не влечёт недействительности прочих её частей,
          если можно предположить, что сделка была бы совершена и без включения недействительной части (оговорка о делимости).
        Важно:
        - Твоя задача — только установить, что прямо зафиксировано в тексте договора.
        - Не оценивай риски самостоятельно вне установленных критериев.
        - Не анализируй режимы собственности или перечни имущества — это темы других проверок.
        [ЗАДАЧА]
        Найди в тексте договора:
        1. Порядок изменения и расторжения (нотариальная форма, взаимное согласие сторон).
        2. Условие о недопустимости одностороннего отказа от исполнения договора.
        3. Положение о действии обязательств после расторжения брака (post-divorce survival).
        4. Порядок разрешения споров (досудебный порядок, подсудность, медиация).
        5. Наличие оговорки о делимости (сохранение силы договора при частичной недействительности).
        6. Сформируй компактную сводку closing_provisions_summary_display.
        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если тема раскрыта частично — статус = "partial".
        3. Если данные полностью не указаны — статус/код = "not_defined",
           текстовое поле = "Данные не определены".
        4. Не используй "None", "null" или пустые строки.
        5. В evidence включай только текст договора.
        6. Значение каждого enum-поля — строго из списка allowed_values.
        7. Верни РОВНО один валидный JSON-объект со всеми 12 ключами,
           пригодный для парсинга через json.loads без предварительной обработки.
           Без markdown, без ```json, без комментариев, без текста до или после.
           Начни ответ сразу с { и закончи }.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — все заключительные положения полностью урегулированы:
        Фрагмент:
        "п. 9.1. Изменение и расторжение настоящего договора производится по взаимному согласию сторон
        в нотариальной форме в любое время. Односторонний отказ от исполнения договора не допускается.
        п. 9.2. Условия настоящего договора, регулирующие распределение имущества и компенсационные выплаты,
        сохраняют свою юридическую силу после расторжения брака до полного исполнения обязательств.
        п. 9.3. Споры между сторонами разрешаются путём переговоров, а при недостижении согласия —
        в судебном порядке по месту жительства истца.
        п. 9.4. Недействительность отдельных положений настоящего договора не влечёт за собой недействительности
        других его условий и договора в целом."
        Ответ:
        {
          "amendment_procedure_status": "notarial_required",
          "amendment_procedure_details": "По взаимному согласию сторон в нотариальной форме в любое время.",
          "unilateral_refusal_status": "prohibited_stated",
          "unilateral_refusal_details": "Односторонний отказ от исполнения договора прямо запрещён.",
          "post_divorce_survival_status": "defined",
          "post_divorce_survival_details": "Положения об имуществе и компенсациях сохраняют силу после развода до полного исполнения.",
          "dispute_resolution_status": "negotiation_then_court",
          "dispute_resolution_details": "Переговоры, при недостижении согласия — суд по месту жительства истца.",
          "severability_clause_status": "defined",
          "severability_clause_details": "Недействительность отдельных положений не влечёт недействительности договора в целом (ст. 180 ГК РФ).",
          "closing_provisions_summary_display": "Изменение: нотариальное / Односторонний отказ: запрещён / После развода: действует / Делимость: есть",
          "evidence": [
            {
              "clause_ref": "п. 9.1",
              "quote": "Изменение и расторжение настоящего договора производится по взаимному согласию сторон в нотариальной форме в любое время. Односторонний отказ от исполнения договора не допускается."
            },
            {
              "clause_ref": "п. 9.4",
              "quote": "Недействительность отдельных положений настоящего договора не влечёт за собой недействительности других его условий и договора в целом."
            }
          ]
        }
        Пример 2 — стандартные минимальные оговорки:
        Фрагмент:
        "п. 10.1. Все изменения к договору совершаются у нотариуса.
        п. 10.2. Споры подлежат рассмотрению в суде в соответствии с законодательством РФ."
        Ответ:
        {
          "amendment_procedure_status": "notarial_required",
          "amendment_procedure_details": "Все изменения совершаются у нотариуса.",
          "unilateral_refusal_status": "not_defined",
          "unilateral_refusal_details": "Данные не определены",
          "post_divorce_survival_status": "not_defined",
          "post_divorce_survival_details": "Данные не определены",
          "dispute_resolution_status": "court_general",
          "dispute_resolution_details": "Рассмотрение в суде по закону РФ.",
          "severability_clause_status": "not_defined",
          "severability_clause_details": "Данные не определены",
          "closing_provisions_summary_display": "Изменение: нотариальное / Разрешение споров: суд по закону / Оговорка о делимости: отсутствует",
          "evidence": [
            {
              "clause_ref": "п. 10.1",
              "quote": "Все изменения к договору совершаются у нотариуса."
            }
          ]
        }
        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Настоящий договор составлен в трёх подлинных экземплярах."
        Ответ:
        {
          "amendment_procedure_status": "not_defined",
          "amendment_procedure_details": "Данные не определены",
          "unilateral_refusal_status": "not_defined",
          "unilateral_refusal_details": "Данные не определены",
          "post_divorce_survival_status": "not_defined",
          "post_divorce_survival_details": "Данные не определены",
          "dispute_resolution_status": "not_defined",
          "dispute_resolution_details": "Данные не определены",
          "severability_clause_status": "not_defined",
          "severability_clause_details": "Данные не определены",
          "closing_provisions_summary_display": "Заключительные и процедурные положения не урегулированы",
          "evidence": []
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Проверь требование нотариальной формы для изменения/расторжения (amendment_procedure_status).
        2. Проверь условие о запрете одностороннего отказа (unilateral_refusal_status).
        3. Проверь сохранение обязательств после прекращения брака (post_divorce_survival_status).
        4. Проверь порядок разрешения споров и подсудность (dispute_resolution_status).
        5. Проверь оговорку о делимости договора по ст. 180 ГК РФ (severability_clause_status).
        6. Сформируй компактный closing_provisions_summary_display.
        7. Если прямой цитаты нет — верни "not_defined". Не додумывай.
        8. Проверь, что все 12 ключей (11 полей + evidence) присутствуют в JSON.
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "amendment_procedure_status": "<notarial_required / simple_written_stated / not_defined>",
          "amendment_procedure_details": "<текст или 'Данные не определены'>",
          "unilateral_refusal_status": "<prohibited_stated / permitted_stated / not_defined>",
          "unilateral_refusal_details": "<текст или 'Данные не определены'>",
          "post_divorce_survival_status": "<defined / not_defined>",
          "post_divorce_survival_details": "<текст или 'Данные не определены'>",
          "dispute_resolution_status": "<negotiation_then_court / court_general / mediation / not_defined>",
          "dispute_resolution_details": "<текст или 'Данные не определены'>",
          "severability_clause_status": "<defined / not_defined>",
          "severability_clause_details": "<текст или 'Данные не определены'>",
          "closing_provisions_summary_display": "<компактная сводка>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 1000

    retrieval:
      retrieval_profile: "termination_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "изменение брачного договора расторжение брачного договора по взаимному согласию в нотариальной форме односторонний отказ не допускается после расторжения брака сохраняют силу разрешение споров подсудность недействительность отдельных условий делимость ст. 43 СК РФ ст. 180 ГК РФ"
      boost_keywords:
        - "изменение и расторжение"
        - "нотариальной форме"
        - "односторонний отказ"
        - "сохраняют силу"
        - "недействительность отдельных"
        - "разрешение споров"
        - "подсудност"
        - "делимост"
      preferred_unit_types:
        - termination_provision
        - amendment
        - dispute_resolution
        - severability
        - general_provision
      excluded_unit_types:
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - procedures
        - remedies
        - boilerplate
      negative_keywords:
        - "алименты на несовершеннолетних"
        - "алименты на детей"
        - "содержание ребенка"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.60, 1.0]
        boost: 0.20
        scope: file
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "procedures"
        - "remedies"
        - "boilerplate"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1500

      compact_output: false

      presence_signal:
        field: "amendment_dispute_severability_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по семейному праву. Извлеки из брачного договора
        заключительные и процедурные положения: порядок изменения и расторжения (ст. 43 СК РФ),
        недопустимость одностороннего отказа, сохранение обязательств после прекращения брака,
        порядок разрешения споров и оговорку о делимости (ст. 180 ГК РФ).
        Не анализируй режим собственности или перечни имущества.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 12 полей + evidence (всего 13 ключей):

        0. amendment_dispute_severability_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (amendment_procedure_status, unilateral_refusal_status,
              post_divorce_survival_status, dispute_resolution_status,
              severability_clause_status) ≠ "not_defined";
           - "missing" — если все пять содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - amendment_procedure_status = "not_defined";
           - unilateral_refusal_status = "not_defined";
           - post_divorce_survival_status = "not_defined";
           - dispute_resolution_status = "not_defined";
           - severability_clause_status = "not_defined";
           - все *_details = "Данные не определены";
           - closing_provisions_summary_display = "Заключительные и процедурные положения не урегулированы";
           - не выполняй остальные шаги.

        1.  amendment_procedure_status — notarial_required / simple_written_stated / not_defined.
        2.  amendment_procedure_details — порядок изменения и расторжения брачного договора.
        3.  unilateral_refusal_status — prohibited_stated / permitted_stated / not_defined.
        4.  unilateral_refusal_details — условия о допустимости/недопустимости одностороннего отказа от исполнения.
        5.  post_divorce_survival_status — defined / not_defined.
        6.  post_divorce_survival_details — оговорка о действии условий договора после расторжения брака.
        7.  dispute_resolution_status — negotiation_then_court / court_general / mediation / not_defined.
        8.  dispute_resolution_details — процедура разрешения споров и подсудность.
        9.  severability_clause_status — defined / not_defined.
        10. severability_clause_details — оговорка о делимости и сохранении силы договора при частичной недействительности.
        11. closing_provisions_summary_display — компактная человекочитаемая сводка заключительных положений для DD Grid.
        12. evidence — массив прямых цитат из договора.

        Если данные полностью отсутствуют в тексте:
        - статус/код = "not_defined";
        - текстовое поле = "Данные не определены";
        - closing_provisions_summary_display = "Заключительные и процедурные положения не урегулированы".
        </task>

        <context_rules>
        - Перед остальными полями заполни amendment_dispute_severability_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Данные не определены", closing_provisions_summary_display = "Заключительные и процедурные положения не урегулированы".
        - Используй только текст договора.
        - amendment_procedure_status:
            "notarial_required" — прямо указано требование нотариального удостоверения соглашений об изменении/расторжении (ст. 43 п. 1 СК РФ);
            "simple_written_stated" — ошибочно указана простая письменная форма (риск ничтожности такого соглашения);
            "not_defined" — порядок изменения не зафиксирован.
        - unilateral_refusal_status:
            "prohibited_stated" — прямо закреплён запрет одностороннего отказа от исполнения (ст. 43 п. 3 СК РФ);
            "permitted_stated" — ошибочно оговорено право на односторонний отказ (противоречит закону);
            "not_defined" — условие прямо не прописано.
        - post_divorce_survival_status:
            "defined" — прямо указано, какие обязательства (имущественные, компенсационные) сохраняют силу после развода;
            "not_defined" — вопрос действия обязательств после развода не урегулирован.
        - dispute_resolution_status:
            "negotiation_then_court" — предусмотрен обязательный досудебный/переговорный порядок перед обращением в суд;
            "court_general" — споры разрешаются в судебном порядке по общим правилам ГПК РФ;
            "mediation" — предусмотрена медиативная процедура;
            "not_defined" — порядок разрешения споров не описан.
        - severability_clause_status:
            "defined" — зафиксировано, что недействительность отдельных пунктов не влечёт недействительности договора в целом (ст. 180 ГК РФ);
            "not_defined" — оговорка о делимости отсутствует.
        - closing_provisions_summary_display формируется как строка вида:
            "Изменение: <нотариальное/не указано> / Односторонний отказ: <запрещён/не указан> / Делимость: <есть/нет>".
        - Значение каждого enum-поля — строго из списка allowed_values.
        - Верни только один JSON-объект.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет положений об изменении, расторжении, спорах или делимости.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены";
             closing_provisions_summary_display = "Заключительные и процедурные положения не урегулированы".

        2. Минимальные стандартные оговорки.
           Указано только, что изменения у нотариуса, остальное не раскрыто.
           → presence = "present";
             amendment_procedure_status = "notarial_required";
             остальные *_status = "not_defined";
             соответствующие *_details = "Данные не определены".

        3. Противоречие между фрагментами.
           В одном месте указано, что договор может быть расторгнут одной стороной,
           в другом — что односторонний отказ не допускается.
           → presence = "unclear";
             unilateral_refusal_status = "not_defined";
             unilateral_refusal_details = "Не удалось определить".

        4. Оговорка о делимости отсутствует, но другие условия есть.
           Договор содержит порядок изменения и разрешения споров, но молчит о делимости.
           → presence = "present";
             severability_clause_status = "not_defined";
             severability_clause_details = "Данные не определены".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для amendment_dispute_severability_check_presence используй только: "present", "missing", "unclear".
        - Для amendment_procedure_status используй только: "notarial_required", "simple_written_stated", "not_defined".
        - Для unilateral_refusal_status используй только: "prohibited_stated", "permitted_stated", "not_defined".
        - Для post_divorce_survival_status, severability_clause_status используй только: "defined", "not_defined".
        - Для dispute_resolution_status используй только: "negotiation_then_court", "court_general", "mediation", "not_defined".
        - Fallback при отсутствии данных:
          * *_details → "Данные не определены";
          * closing_provisions_summary_display → "Заключительные и процедурные положения не урегулированы".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "amendment_dispute_severability_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования заключительных и процедурных положений. Внутреннее агрегатное signal-поле."
          required: true

        - name: "amendment_procedure_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["notarial_required", "simple_written_stated", "not_defined"]
          description: "Статус порядка изменения и расторжения договора (ст. 43 п. 1 СК РФ)."
          required: true
        - name: "amendment_procedure_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Изменение и расторжение"
          description: "Порядок изменения и расторжения брачного договора (согласие сторон, нотариальная форма)."
          required: true
        - name: "unilateral_refusal_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["prohibited_stated", "permitted_stated", "not_defined"]
          description: "Статус оговорки о запрете одностороннего отказа от исполнения договора (ст. 43 п. 3 СК РФ)."
          required: true
        - name: "unilateral_refusal_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Односторонний отказ"
          description: "Условие о недопустимости одностороннего отказа от исполнения обязательств."
          required: false
        - name: "post_divorce_survival_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус сохранения силы имущественных обязательств после прекращения брака (ст. 43 п. 3 СК РФ)."
          required: true
        - name: "post_divorce_survival_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Действие после развода"
          description: "Оговорка о сохранении юридической силы условий договора после расторжения брака."
          required: false
        - name: "dispute_resolution_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["negotiation_then_court", "court_general", "mediation", "not_defined"]
          description: "Порядок урегулирования споров и договорная подсудность."
          required: true
        - name: "dispute_resolution_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Разрешение споров"
          description: "Порядок разрешения споров, досудебные процедуры, медиация и подсудность."
          required: true
        - name: "severability_clause_status"
          type: "string"
          presentation: "signal"
          risk_weight: "low"
          allowed_values: ["defined", "not_defined"]
          description: "Наличие оговорки о делимости договора при частичной недействительности (ст. 180 ГК РФ)."
          required: true
        - name: "severability_clause_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Оговорка о делимости"
          description: "Условие о сохранении юридической силы брачного договора при недействительности его отдельных положений."
          required: true
        - name: "closing_provisions_summary_display"
          type: "string"
          presentation: "summary"
          display_in_grid: true
          display_priority: 4
          label: "Заключительные положения"
          description: "Компактная сводка заключительных и процедурных положений для отображения в DD Grid."
          required: true

      store_payload: true

  - id: foreign_digital_assets_check
    name: "Иностранный элемент, зарубежные активы и криптовалюта (ст. 161 СК РФ, 259-ФЗ)"
    description: >
      Фактографическая проверка условий применимого права при наличии иностранного
      элемента (ст. 161 СК РФ), режима зарубежного имущества и счетов в иностранных банках,
      а также урегулированности цифровых активов: цифровой валюты (криптовалюты),
      цифровых финансовых активов (ЦФА), токенов, аккаунтов на криптобиржах и порядка
      раскрытия криптокошельков (ст. 128, 141.1 ГК РФ, ФЗ-259 «О ЦФА»).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 120

    rules:
      keywords:
        - "применимое право"
        - "законодательство Российской Федерации"
        - "иностранное право"
        - "ст. 161 СК РФ"
        - "международное частное право"
        - "коллизионная норма"
        - "иностранный гражданин"
        - "гражданство"
        - "двойное гражданство"
        - "вид на жительство"
        - "имущество за рубежом"
        - "имущество за пределами РФ"
        - "счета в иностранных банках"
        - "иностранные банковские счета"
        - "зарубежные активы"
        - "КИК"
        - "иностранные компании"
        - "криптовалюта"
        - "цифровые активы"
        - "цифровая валюта"
        - "цифровые финансовые активы"
        - "ЦФА"
        - "токен"
        - "блокчейн"
        - "биткоин"
        - "криптокошелёк"
        - "криптобиржа"
        - "аккаунты на биржах"
      keyword_mode: "any"
      negative_keywords:
        - "алименты на несовершеннолетних"
        - "алименты на детей"
        - "содержание ребенка"
        - "в целях настоящего"
      regex_patterns:
        - "(?i)применим(ое|ого)\\s+прав(о|а)"
        - "(?i)ст\\.?\\s*161\\s*СК"
        - "(?i)(криптовалют|цифров(ые|ых)\\s+(актив|валют|прав)|\\bЦФА\\b|токен|биткоин|блокчейн)"
        - "(?i)имуществ(о|а)[^\\.]{0,40}(за\\s+рубежом|за\\s+пределами\\s+РФ|в\\s+иностранн)"
        - "(?i)счет(а|ов|ах)\\s+в\\s+иностранн\\w*\\s+банк"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по международному частному праву и цифровым активам.
        Анализируется брачный договор (ст. 161 СК РФ; ст. 128, 141.1 ГК РФ; ФЗ № 259-ФЗ «О ЦФА»).
        Проверяется только один вопрос: выбор применимого права при иностранном элементе, режим зарубежного имущества
        и счетов в иностранных банках, а также режим криптовалюты, цифровых финансовых активов (ЦФА) и криптокошельков.
        Ключевые нормы:
        - Ст. 161 п. 2 СК РФ: Супруги, не имеющие общего гражданства или совместного места жительства,
          вправе избрать применимое законодательство для брачного договора.
        - Ст. 128, 141.1 ГК РФ и 259-ФЗ: Цифровая валюта (криптовалюта) и цифровые финансовые активы признаются
          имуществом и подлежат включению в брачный договор во избежание признания их совместной собственностью.
        - Имущество за рубежом и иностранные счета: подчиняются специальным коллизионным привязкам (lex rei sitae).
        Важно:
        - Твоя задача — только установить, что прямо зафиксировано в тексте договора.
        - Не оценивай риски самостоятельно вне установленных критериев.
        - Не анализируй алименты на детей или процессуальные вопросы развода.
        [ЗАДАЧА]
        Найди в тексте договора:
        1. Выбор применимого права (право РФ / иностранное право / не указано).
        2. Наличие иностранного элемента (иностранное гражданство, ВНЖ, имущество за рубежом).
        3. Режим зарубежного имущества, счетов в иностранных банках и КИК.
        4. Режим криптовалюты, цифровой валюты, ЦФА, токенов и NFT.
        5. Условия о доступе к криптокошелькам / аккаунтам на криптобиржах и их раскрытии.
        6. Сформируй компактную сводку foreign_digital_summary_display.
        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если тема раскрыта частично — статус = "partial".
        3. Если данные полностью не указаны — статус/код = "not_defined",
           текстовое поле = "Данные не определены".
        4. Не используй "None", "null" или пустые строки.
        5. В evidence включай только текст договора.
        6. Значение каждого enum-поля — строго из списка allowed_values.
        7. Верни РОВНО один валидный JSON-объект со всеми 12 ключами,
           пригодный для парсинга через json.loads без предварительной обработки.
           Без markdown, без ```json, без комментариев, без текста до или после.
           Начни ответ сразу с { и закончи }.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — урегулированы право РФ, зарубежные счета и криптовалюта:
        Фрагмент:
        "п. 10.1. Настоящий договор регулируется правом Российской Федерации.
        п. 10.2. Любое недвижимое имущество, находящееся за пределами РФ (включая апартаменты в г. Дубай),
        а также денежные средства на счетах в банках Объединённых Арабских Эмиратов и Швейцарии,
        являются раздельной собственностью того супруга, на чьё имя они оформлены.
        п. 10.3. Цифровая валюта (криптовалюта), цифровые финансовые активы (ЦФА), токены, а также аккаунты
        на криптовалютных биржах являются раздельной собственностью того супруга, на чьё имя открыт
        соответствующий аккаунт или в чьём фактическом распоряжении находятся приватные ключи/seed-фразы."
        Ответ:
        {
          "governing_law_status": "rf_law_chosen",
          "governing_law_details": "Право Российской Федерации.",
          "foreign_element_status": "foreign_assets_present",
          "foreign_element_details": "Недвижимость в ОАЭ (Дубай), счета в банках ОАЭ и Швейцарии.",
          "foreign_assets_regime_code": "separate_property",
          "foreign_assets_regime_details": "Недвижимость за рубежом и иностранные счета — раздельная собственность титульного владельца.",
          "digital_assets_status": "regulated_separate",
          "digital_assets_details": "Криптовалюта, ЦФА, токены и аккаунты на биржах — раздельная собственность владельца аккаунта/ключей.",
          "crypto_wallets_disclosure_status": "as_is_no_disclosure",
          "crypto_wallets_disclosure_details": "Раздельный режим по признаку фактического владения приватными ключами/аккаунтом.",
          "foreign_digital_summary_display": "Право: РФ / Зарубежные счета и активы: раздельные (ОАЭ, Швейцария) / Крипта и ЦФА: раздельные",
          "evidence": [
            {
              "clause_ref": "п. 10.1",
              "quote": "Настоящий договор регулируется правом Российской Федерации."
            },
            {
              "clause_ref": "п. 10.2",
              "quote": "Любое недвижимое имущество, находящееся за пределами РФ (включая апартаменты в г. Дубай), а также денежные средства на счетах в банках Объединённых Арабских Эмиратов и Швейцарии, являются раздельной собственностью того супруга, на чьё имя они оформлены."
            },
            {
              "clause_ref": "п. 10.3",
              "quote": "Цифровая валюта (криптовалюта), цифровые финансовые активы (ЦФА), токены, а также аккаунты на криптовалютных биржах являются раздельной собственностью того супруга, на чьё имя открыт соответствующий аккаунт."
            }
          ]
        }
        Пример 2 — только крипта без иностранных элементов:
        Фрагмент:
        "п. 4.4. Все цифровые финансовые активы и цифровая валюта (биткоин, эфириум и иные токены)
        являются совместной собственностью супругов."
        Ответ:
        {
          "governing_law_status": "no_choice_stated",
          "governing_law_details": "Прямого выбора применимого права нет (действует право РФ по умолчанию).",
          "foreign_element_status": "none_detected",
          "foreign_element_details": "Иностранный элемент не выявлен.",
          "foreign_assets_regime_code": "not_mentioned",
          "foreign_assets_regime_details": "Данные не определены",
          "digital_assets_status": "regulated_joint",
          "digital_assets_details": "Цифровая валюта и ЦФА объявлены совместной собственностью супругов.",
          "crypto_wallets_disclosure_status": "not_defined",
          "crypto_wallets_disclosure_details": "Данные не определены",
          "foreign_digital_summary_display": "Право: РФ (по закону) / Зарубежные активы: не указаны / Крипта и ЦФА: совместная собственность",
          "evidence": [
            {
              "clause_ref": "п. 4.4",
              "quote": "Все цифровые финансовые активы и цифровая валюта (биткоин, эфириум и иные токены) являются совместной собственностью супругов."
            }
          ]
        }
        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Стороны определяют режим имущества супругов на территории РФ."
        Ответ:
        {
          "governing_law_status": "not_defined",
          "governing_law_details": "Данные не определены",
          "foreign_element_status": "not_defined",
          "foreign_element_details": "Данные не определены",
          "foreign_assets_regime_code": "not_defined",
          "foreign_assets_regime_details": "Данные не определены",
          "digital_assets_status": "not_defined",
          "digital_assets_details": "Данные не определены",
          "crypto_wallets_disclosure_status": "not_defined",
          "crypto_wallets_disclosure_details": "Данные не определены",
          "foreign_digital_summary_display": "Иностранный элемент и цифровые активы не урегулированы",
          "evidence": []
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Проверь выбор применимого права (governing_law_status: rf_law_chosen / foreign_law_chosen / no_choice_stated / not_defined).
        2. Проверь наличие иностранного элемента (foreign_element_status: foreign_citizenship / foreign_assets_present / both_foreign_elements / none_detected / not_defined).
        3. Проверь режим зарубежных активов и счетов (foreign_assets_regime_code: separate_property / joint_property / mixed / not_mentioned / not_defined).
        4. Проверь режим цифровых активов и крипты (digital_assets_status: regulated_separate / regulated_joint / not_addressed / not_defined).
        5. Проверь условия о раскрытии кошельков и ключей (crypto_wallets_disclosure_status).
        6. Сформируй компактный foreign_digital_summary_display.
        7. Если прямой цитаты нет — верни "not_defined". Не додумывай.
        8. Проверь, что все 12 ключей (11 полей + evidence) присутствуют в JSON.
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "governing_law_status": "<rf_law_chosen / foreign_law_chosen / no_choice_stated / not_defined>",
          "governing_law_details": "<текст или 'Данные не определены'>",
          "foreign_element_status": "<foreign_citizenship / foreign_assets_present / both_foreign_elements / none_detected / not_defined>",
          "foreign_element_details": "<текст или 'Данные не определены'>",
          "foreign_assets_regime_code": "<separate_property / joint_property / mixed / not_mentioned / not_defined>",
          "foreign_assets_regime_details": "<текст или 'Данные не определены'>",
          "digital_assets_status": "<regulated_separate / regulated_joint / not_addressed / not_defined>",
          "digital_assets_details": "<текст или 'Данные не определены'>",
          "crypto_wallets_disclosure_status": "<disclosure_required / as_is_no_disclosure / not_defined>",
          "crypto_wallets_disclosure_details": "<текст или 'Данные не определены'>",
          "foreign_digital_summary_display": "<компактная сводка>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 1000

    retrieval:
      retrieval_profile: "governing_law_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "применимое право право Российской Федерации иностранное право ст. 161 СК РФ международное частное право имущество за рубежом счета в иностранных банках зарубежные активы криптовалюта цифровые активы цифровая валюта ЦФА токен биткоин блокчейн криптокошелек"
      boost_keywords:
        - "применимое право"
        - "ст. 161 СК"
        - "за рубежом"
        - "иностранных банках"
        - "криптовалют"
        - "цифровая валюта"
        - "ЦФА"
        - "токен"
        - "криптокошел"
      preferred_unit_types:
        - governing_law
        - jurisdiction
        - obligation
        - general_provision
      excluded_unit_types:
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - boilerplate
        - obligations
        - rights
      negative_keywords:
        - "алименты на несовершеннолетних"
        - "алименты на детей"
        - "содержание ребенка"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.30, 1.0]
        boost: 0.30
        scope: file
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "boilerplate"
        - "obligations"
        - "rights"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1500

      compact_output: false

      presence_signal:
        field: "foreign_digital_assets_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по международному частному праву и цифровым активам. Извлеки из брачного договора
        условия о выборе применимого права (ст. 161 СК РФ), наличии иностранного элемента (гражданство, ВНЖ, зарубежное имущество),
        режиме счетов в иностранных банках, а также правовом режиме криптовалюты, цифровой валюты, ЦФА, токенов и криптокошельков.
        Не анализируй алименты на детей или бытовые вопросы.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 12 полей + evidence (всего 13 ключей):

        0. foreign_digital_assets_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (governing_law_status, foreign_element_status, foreign_assets_regime_code,
              digital_assets_status, crypto_wallets_disclosure_status) ≠ "not_defined";
           - "missing" — если все пять содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - governing_law_status = "not_defined";
           - foreign_element_status = "not_defined";
           - foreign_assets_regime_code = "not_defined";
           - digital_assets_status = "not_defined";
           - crypto_wallets_disclosure_status = "not_defined";
           - все *_details = "Данные не определены";
           - foreign_digital_summary_display = "Иностранный элемент и цифровые активы не урегулированы";
           - не выполняй остальные шаги.

        1.  governing_law_status — rf_law_chosen / foreign_law_chosen / no_choice_stated / not_defined.
        2.  governing_law_details — прямое указание на применимое право к договору (ст. 161 СК РФ).
        3.  foreign_element_status — foreign_citizenship / foreign_assets_present / both_foreign_elements / none_detected / not_defined.
        4.  foreign_element_details — описание иностранного элемента (гражданство сторон, имущество за рубежом).
        5.  foreign_assets_regime_code — separate_property / joint_property / mixed / not_mentioned / not_defined.
        6.  foreign_assets_regime_details — режим имущества за рубежом, счетов в иностранных банках и КИК.
        7.  digital_assets_status — regulated_separate / regulated_joint / not_addressed / not_defined.
        8.  digital_assets_details — режим цифровой валюты, криптовалюты, ЦФА, токенов и аккаунтов на биржах.
        9.  crypto_wallets_disclosure_status — disclosure_required / as_is_no_disclosure / not_defined.
        10. crypto_wallets_disclosure_details — условия о раскрытии ключей, seed-фраз и кошельков.
        11. foreign_digital_summary_display — компактная человекочитаемая сводка для DD Grid.
        12. evidence — массив прямых цитат из договора.

        Если данные полностью отсутствуют в тексте:
        - статус/код = "not_defined";
        - текстовое поле = "Данные не определены";
        - foreign_digital_summary_display = "Иностранный элемент и цифровые активы не урегулированы".
        </task>

        <context_rules>
        - Перед остальными полями заполни foreign_digital_assets_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status/*_code = "not_defined", все *_details = "Данные не определены", foreign_digital_summary_display = "Иностранный элемент и цифровые активы не урегулированы".
        - Используй только текст договора.
        - governing_law_status:
            "rf_law_chosen" — прямо выбрано законодательство РФ;
            "foreign_law_chosen" — избрано право иностранного государства (ст. 161 п. 2 СК РФ);
            "no_choice_stated" — прямого выбора права нет (применяется право РФ по закону);
            "not_defined" — не определено.
        - foreign_element_status:
            "foreign_citizenship" — хотя бы один супруг является иностранным гражданином / имеет ВНЖ;
            "foreign_assets_present" — стороны — граждане РФ, но в договоре прямо указано имущество за пределами РФ или иностранные счета;
            "both_foreign_elements" — есть и иностранное гражданство, и зарубежное имущество;
            "none_detected" — иностранный элемент в тексте отсутствует;
            "not_defined" — не определено.
        - foreign_assets_regime_code:
            "separate_property" — имущество за рубежом и иностранные счета закреплены в раздельной собственности;
            "joint_property" — имущество за рубежом остаётся совместным;
            "mixed" — дифференцированный режим;
            "not_mentioned" — зарубежные активы прямо не упоминаются;
            "not_defined" — не определено.
        - digital_assets_status:
            "regulated_separate" — криптовалюта и ЦФА прямо отнесены к раздельной собственности владельца;
            "regulated_joint" — криптовалюта прямо признана совместной собственностью;
            "not_addressed" — цифровые активы прямо не упомянуты (действует законный режим);
            "not_defined" — не определено.
        - foreign_digital_summary_display формируется как строка вида:
            "Право: <РФ/иностранное> / Зарубежные активы: <режим или 'нет'> / Крипта и ЦФА: <режим или 'не указаны'>".
        - Значение каждого enum-поля — строго из списка allowed_values.
        - Верни только один JSON-объект.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни упоминаний иностранного элемента, ни цифровых активов,
           ни выбора применимого права.
           → presence = "missing";
             все *_status/*_code = "not_defined";
             все *_details = "Данные не определены";
             foreign_digital_summary_display = "Иностранный элемент и цифровые активы не урегулированы".

        2. Только российские активы без иностранного элемента.
           Прямо указано, что договор регулируется правом РФ, иностранные активы не упоминаются.
           → presence = "present";
             governing_law_status = "rf_law_chosen";
             foreign_element_status = "none_detected";
             foreign_assets_regime_code = "not_mentioned".

        3. Противоречие между фрагментами.
           В одном месте криптовалюта объявлена совместной собственностью,
           в другом — раздельной собственностью владельца аккаунта.
           → presence = "unclear";
             digital_assets_status = "not_defined";
             digital_assets_details = "Не удалось определить".

        4. Цифровые активы упомянуты, но без правил раскрытия.
           Договор регулирует режим криптовалюты, но не содержит условий
           о раскрытии приватных ключей или seed-фраз.
           → presence = "present";
             digital_assets_status = "regulated_separate" (или иное);
             crypto_wallets_disclosure_status = "not_defined".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для foreign_digital_assets_check_presence используй только: "present", "missing", "unclear".
        - Для governing_law_status используй только: "rf_law_chosen", "foreign_law_chosen", "no_choice_stated", "not_defined".
        - Для foreign_element_status используй только: "foreign_citizenship", "foreign_assets_present", "both_foreign_elements", "none_detected", "not_defined".
        - Для foreign_assets_regime_code используй только: "separate_property", "joint_property", "mixed", "not_mentioned", "not_defined".
        - Для digital_assets_status используй только: "regulated_separate", "regulated_joint", "not_addressed", "not_defined".
        - Для crypto_wallets_disclosure_status используй только: "disclosure_required", "as_is_no_disclosure", "not_defined".
        - Fallback при отсутствии данных:
          * *_details → "Данные не определены";
          * foreign_digital_summary_display → "Иностранный элемент и цифровые активы не урегулированы".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "foreign_digital_assets_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования иностранного элемента и цифровых активов. Внутреннее агрегатное signal-поле."
          required: true

        - name: "governing_law_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["rf_law_chosen", "foreign_law_chosen", "no_choice_stated", "not_defined"]
          description: "Статус выбора применимого права к брачному договору (ст. 161 СК РФ)."
          required: true
        - name: "governing_law_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Применимое право"
          description: "Выбранное сторонами применимое право (право РФ или иностранная юрисдикция)."
          required: true
        - name: "foreign_element_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["foreign_citizenship", "foreign_assets_present", "both_foreign_elements", "none_detected", "not_defined"]
          description: "Наличие и характер иностранного элемента (гражданство, зарубежное имущество, счета)."
          required: true
        - name: "foreign_element_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Иностранный элемент"
          description: "Описание иностранного гражданства сторон или активов за пределами РФ."
          required: false
        - name: "foreign_assets_regime_code"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["separate_property", "joint_property", "mixed", "not_mentioned", "not_defined"]
          description: "Режим собственности на зарубежные активы, счета в иностранных банках и КИК."
          required: true
        - name: "foreign_assets_regime_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Зарубежные активы и счета"
          description: "Порядок владения недвижимостью за рубежом, счетами в иностранных банках и иностранными компаниями."
          required: false
        - name: "digital_assets_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["regulated_separate", "regulated_joint", "not_addressed", "not_defined"]
          description: "Статус правового режима цифровой валюты (криптовалюты) и ЦФА (259-ФЗ)."
          required: true
        - name: "digital_assets_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Цифровые активы и криптовалюта"
          description: "Режим криптовалюты, цифровых финансовых активов (ЦФА), токенов и аккаунтов на биржах."
          required: true
        - name: "crypto_wallets_disclosure_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["disclosure_required", "as_is_no_disclosure", "not_defined"]
          description: "Статус условий о раскрытии криптокошельков, приватных ключей и seed-фраз."
          required: true
        - name: "crypto_wallets_disclosure_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Раскрытие криптокошельков"
          description: "Условия доступа к приватным ключам, seed-фразам и раскрытия криптокошельков."
          required: false
        - name: "foreign_digital_summary_display"
          type: "string"
          presentation: "summary"
          display_in_grid: true
          display_priority: 4
          label: "Иностранные и цифровые активы"
          description: "Компактная сводка применимого права, зарубежных активов и криптовалюты для DD Grid."
          required: true

      store_payload: true

  - id: full_disclosure_check
    name: "Полнота раскрытия активов и добросовестность сторон (ст. 178, 179 ГК РФ)"
    description: >
      Фактографическая проверки наличия оговорки о полном раскрытии активов (full disclosure),
      перечня имущества на дату заключения договора, подтверждения сторон об отсутствии
      скрытых активов и последствий сокрытия. Сокрытие существенных активов является
      основанием для признания брачного договора недействительным как сделки, совершённой
      под влиянием заблуждения или обмана (ст. 178, 179 ГК РФ).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 130

    rules:
      keywords:
        - "полнота раскрытия"
        - "полное раскрытие"
        - "раскрытие активов"
        - "раскрытие имущества"
        - "перечень имущества на дату"
        - "перечень активов"
        - "скрытые активы"
        - "сокрытие имущества"
        - "добросовестность"
        - "заблуждение"
        - "обман"
        - "достоверность сведений"
        - "полнота сведений"
        - "подтверждает, что"
        - "гарантирует, что"
        - "приложение с перечнем"
        - "не имеет скрытых"
        - "не располагает иными"
      keyword_mode: "any"
      negative_keywords:
        - "алименты на несовершеннолетних"
        - "алименты на детей"
        - "содержание ребенка"
        - "в целях настоящего"
      regex_patterns:
        - "(?i)(полн(ое|ота)\\s+раскрыти|раскрыти(е|я)\\s+(активов|имуществ))"
        - "(?i)перечен(ь|я)\\s+(имуществ|активов)\\s+на\\s+дат"
        - "(?i)(скрыт|сокрыт|утаива)[^\\.]{0,30}(актив|имуществ)"
        - "(?i)(подтвержда|гарантиру)[^\\.]{0,40}(полнот|достоверн|отсутстви)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по семейному праву.
        Анализируется брачный договор (ст. 178, 179 ГК РФ; ст. 42 СК РФ).
        Проверяется только один вопрос: полнота раскрытия активов сторонами
        и наличие механизмов защиты от сокрытия имущества.
        Ключевые нормы:
        - Ст. 178 ГК РФ: сделка, совершённая под влиянием существенного заблуждения,
          может быть признана недействительной. Если супруг не знал о реальном объёме
          имущества другого супруга, он может оспорить брачный договор.
        - Ст. 179 ГК РФ: сделка, совершённая под влиянием обмана, ничтожна.
          Намеренное сокрытие активов одним из супругов квалифицируется как обман.
        - Судебная практика: ВС РФ признаёт брачные договоры недействительными,
          если один из супругов скрыл активы, составляющие существенную долю
          совокупного имущества сторон.
        Важно:
        - Твоя задача — только установить, что прямо зафиксировано в тексте договора.
        - Не оценивай фактическую полноту раскрытия (это невозможно по тексту).
        - Не анализируй режимы собственности или алименты — это темы других проверок.
        [ЗАДАЧА]
        Найди в тексте договора:
        1. Оговорку о полном раскрытии активов (full disclosure clause).
        2. Перечень имущества сторон на дату заключения договора (приложение / список).
        3. Подтверждение сторон об отсутствии скрытых активов.
        4. Последствия сокрытия имущества (основание для оспаривания).
        5. Сформируй компактную сводку disclosure_summary_display.
        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если тема раскрыта частично — статус = "partial".
        3. Если данные полностью не указаны — статус/код = "not_defined",
           текстовое поле = "Данные не определены".
        4. Не используй "None", "null" или пустые строки.
        5. В evidence включай только текст договора.
        6. Значение каждого enum-поля — строго из списка allowed_values.
        7. Верни РОВНО один валидный JSON-объект со всеми 10 ключами,
           пригодный для парсинга через json.loads без предварительной обработки.
           Без markdown, без ```json, без комментариев, без текста до или после.
           Начни ответ сразу с { и закончи }.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — полное раскрытие предусмотрено:
        Фрагмент:
        "п. 11.1. Каждая из сторон подтверждает, что полностью и достоверно раскрыла
        другой стороне сведения обо всех принадлежащих ей активах, включая недвижимое
        имущество, доли в хозяйственных обществах, банковские счета, ценные бумаги,
        цифровые активы и иные имущественные права.
        п. 11.2. Перечень имущества каждой из сторон на дату заключения настоящего
        договора приведён в Приложении № 2, являющемся неотъемлемой частью договора.
        п. 11.3. В случае выявления факта сокрытия одним из супругов существенных
        активов, не указанных в Приложении № 2, другой супруг вправе требовать
        признания настоящего договора недействительным в судебном порядке на основании
        ст. 178, 179 ГК РФ."
        Ответ:
        {
          "full_disclosure_clause_status": "defined",
          "full_disclosure_clause_details": "Каждая сторона подтверждает полное и достоверное раскрытие всех активов.",
          "asset_schedule_status": "defined",
          "asset_schedule_details": "Перечень имущества на дату заключения приведён в Приложении № 2.",
          "hidden_assets_confirmation_status": "defined",
          "hidden_assets_confirmation_details": "Стороны подтвердили отсутствие скрытых активов.",
          "concealment_consequences_status": "defined",
          "concealment_consequences_details": "Сокрытие существенных активов — основание для оспаривания по ст. 178, 179 ГК РФ.",
          "disclosure_summary_display": "Раскрытие: полное / Перечень: Приложение №2 / Сокрытие: основание для оспаривания",
          "evidence": [
            {
              "clause_ref": "п. 11.1",
              "quote": "Каждая из сторон подтверждает, что полностью и достоверно раскрыла другой стороне сведения обо всех принадлежащих ей активах."
            },
            {
              "clause_ref": "п. 11.3",
              "quote": "В случае выявления факта сокрытия одним из супругов существенных активов другой супруг вправе требовать признания настоящего договора недействительным."
            }
          ]
        }
        Пример 2 — частичное раскрытие (только подтверждение без перечня):
        Фрагмент:
        "Стороны подтверждают, что ознакомлены с имущественным положением друг друга
        и заключают настоящий договор добровольно."
        Ответ:
        {
          "full_disclosure_clause_status": "partial",
          "full_disclosure_clause_details": "Общее подтверждение ознакомления с имущественным положением, но без детального раскрытия.",
          "asset_schedule_status": "not_defined",
          "asset_schedule_details": "Данные не определены",
          "hidden_assets_confirmation_status": "partial",
          "hidden_assets_confirmation_details": "Добровольность подтверждена, но явное подтверждение отсутствия скрытых активов отсутствует.",
          "concealment_consequences_status": "not_defined",
          "concealment_consequences_details": "Данные не определены",
          "disclosure_summary_display": "Раскрытие: частичное (общая формулировка) / Перечень: отсутствует / Сокрытие: не урегулировано",
          "evidence": [
            {
              "clause_ref": "преамбула",
              "quote": "Стороны подтверждают, что ознакомлены с имущественным положением друг друга и заключают настоящий договор добровольно."
            }
          ]
        }
        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Настоящий договор вступает в силу с момента его нотариального удостоверения."
        Ответ:
        {
          "full_disclosure_clause_status": "not_defined",
          "full_disclosure_clause_details": "Данные не определены",
          "asset_schedule_status": "not_defined",
          "asset_schedule_details": "Данные не определены",
          "hidden_assets_confirmation_status": "not_defined",
          "hidden_assets_confirmation_details": "Данные не определены",
          "concealment_consequences_status": "not_defined",
          "concealment_consequences_details": "Данные не определены",
          "disclosure_summary_display": "Полнота раскрытия активов не урегулирована",
          "evidence": []
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Проверь наличие оговорки о полном раскрытии активов (full disclosure clause).
        2. Проверь наличие перечня/приложения с активами на дату заключения.
        3. Проверь подтверждение сторон об отсутствии скрытых активов.
        4. Проверь последствия сокрытия (основание для оспаривания).
        5. Сформируй компактный disclosure_summary_display.
        6. Если прямой цитаты нет — верни "not_defined". Не додумывай.
        7. Проверь, что все 10 ключей (9 полей + evidence) присутствуют в JSON.
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "full_disclosure_clause_status": "<defined / partial / not_defined>",
          "full_disclosure_clause_details": "<текст или 'Данные не определены'>",
          "asset_schedule_status": "<defined / partial / not_defined>",
          "asset_schedule_details": "<текст или 'Данные не определены'>",
          "hidden_assets_confirmation_status": "<defined / partial / not_defined>",
          "hidden_assets_confirmation_details": "<текст или 'Данные не определены'>",
          "concealment_consequences_status": "<defined / not_defined>",
          "concealment_consequences_details": "<текст или 'Данные не определены'>",
          "disclosure_summary_display": "<компактная сводка>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 1000

    retrieval:
      retrieval_profile: "warranties_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "полнота раскрытия активов раскрытие имущества перечень имущества на дату перечень активов скрытые активы сокрытие имущества добросовестность заблуждение обман достоверность сведений подтверждает гарантирует приложение с перечнем"
      boost_keywords:
        - "раскрыти"
        - "перечень имуществ"
        - "скрыт"
        - "сокрыт"
        - "добросовестн"
        - "заблуждени"
        - "обман"
        - "приложение"
      preferred_unit_types:
        - obligation
        - general_provision
        - representations
      excluded_unit_types:
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - representations
        - obligations
        - remedies
      negative_keywords:
        - "алименты на несовершеннолетних"
        - "алименты на детей"
        - "содержание ребенка"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.05, 0.95]
        boost: 0.30
        scope: file
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
        - "appendix"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "representations"
        - "obligations"
        - "remedies"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 700

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1500

      compact_output: false

      presence_signal:
        field: "full_disclosure_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по семейному праву. Извлеки из брачного договора
        условия о полноте раскрытия активов, перечне имущества на дату заключения,
        подтверждении отсутствия скрытых активов и последствиях сокрытия (ст. 178, 179 ГК РФ).
        Не анализируй режимы собственности, алименты или банкротство.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 10 полей + evidence (всего 11 ключей):

        0. full_disclosure_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (full_disclosure_clause_status, asset_schedule_status,
              hidden_assets_confirmation_status, concealment_consequences_status)
             ≠ "not_defined";
           - "missing" — если все четыре содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - full_disclosure_clause_status = "not_defined";
           - asset_schedule_status = "not_defined";
           - hidden_assets_confirmation_status = "not_defined";
           - concealment_consequences_status = "not_defined";
           - все *_details = "Данные не определены";
           - disclosure_summary_display = "Полнота раскрытия активов не урегулирована";
           - не выполняй остальные шаги.

        1.  full_disclosure_clause_status — defined / partial / not_defined.
        2.  full_disclosure_clause_details — оговорка о полном раскрытии активов.
        3.  asset_schedule_status — defined / partial / not_defined.
        4.  asset_schedule_details — перечень имущества на дату заключения (приложение).
        5.  hidden_assets_confirmation_status — defined / partial / not_defined.
        6.  hidden_assets_confirmation_details — подтверждение отсутствия скрытых активов.
        7.  concealment_consequences_status — defined / not_defined.
        8.  concealment_consequences_details — последствия сокрытия (основание для оспаривания).
        9.  disclosure_summary_display — компактная сводка для DD Grid.
        10. evidence — массив прямых цитат из договора.

        Если данные полностью отсутствуют в тексте:
        - статус = "not_defined";
        - текстовое поле = "Данные не определены";
        - disclosure_summary_display = "Полнота раскрытия активов не урегулирована".
        </task>

        <context_rules>
        - Перед остальными полями заполни full_disclosure_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Данные не определены", disclosure_summary_display = "Полнота раскрытия активов не урегулирована".
        - Используй только текст договора.
        - full_disclosure_clause_status:
            "defined" — явная оговорка о полном и достоверном раскрытии всех активов;
            "partial" — общая формулировка об ознакомлении с имущественным положением
              без детального раскрытия;
            "not_defined" — вопрос не затронут.
        - asset_schedule_status:
            "defined" — прямо указан перечень/приложение с активами на дату заключения;
            "partial" — перечень упомянут, но не детализирован;
            "not_defined" — перечня нет.
        - concealment_consequences_status:
            "defined" — прямо указаны последствия сокрытия (оспаривание, недействительность);
            "not_defined" — последствия не оговорены.
        - disclosure_summary_display формируется как строка вида:
            "Раскрытие: <полное/частичное/нет> / Перечень: <есть/нет> /
            Сокрытие: <основание для оспаривания/не урегулировано>".
        - Значение каждого enum-поля — строго из списка allowed_values.
        - Верни только один JSON-объект.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни упоминаний о раскрытии активов, ни перечней,
           ни последствий сокрытия.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены";
             disclosure_summary_display = "Полнота раскрытия активов не урегулирована".

        2. Частичное раскрытие (общая формулировка).
           Стороны подтверждают ознакомление с имущественным положением,
           но без детального перечня или явного подтверждения отсутствия скрытых активов.
           → presence = "present";
             full_disclosure_clause_status = "partial";
             asset_schedule_status = "not_defined".

        3. Противоречие между фрагментами.
           В одном месте указано полное раскрытие, в другом — что стороны
           не несут ответственности за скрытые активы.
           → presence = "unclear";
             full_disclosure_clause_status = "not_defined";
             full_disclosure_clause_details = "Не удалось определить".

        4. Перечень есть, но последствий сокрытия нет.
           Приложение с активами приложено, но договор молчит о последствиях
           выявления сокрытого имущества.
           → presence = "present";
             asset_schedule_status = "defined";
             concealment_consequences_status = "not_defined".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для full_disclosure_check_presence используй только: "present", "missing", "unclear".
        - Для full_disclosure_clause_status, asset_schedule_status, hidden_assets_confirmation_status используй только: "defined", "partial", "not_defined".
        - Для concealment_consequences_status используй только: "defined", "not_defined".
        - Fallback при отсутствии данных:
          * *_details → "Данные не определены";
          * disclosure_summary_display → "Полнота раскрытия активов не урегулирована".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "full_disclosure_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования полноты раскрытия активов. Внутреннее агрегатное signal-поле."
          required: true

        - name: "full_disclosure_clause_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "partial", "not_defined"]
          description: "Статус оговорки о полном раскрытии активов (full disclosure)."
          required: true
        - name: "full_disclosure_clause_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Раскрытие активов"
          description: "Оговорка о полном и достоверном раскрытии активов сторонами."
          required: true
        - name: "asset_schedule_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "partial", "not_defined"]
          description: "Статус перечня имущества на дату заключения договора."
          required: true
        - name: "asset_schedule_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Перечень активов на дату"
          description: "Перечень/приложение с активами сторон на дату заключения договора."
          required: false
        - name: "hidden_assets_confirmation_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "partial", "not_defined"]
          description: "Статус подтверждения сторон об отсутствии скрытых активов."
          required: true
        - name: "hidden_assets_confirmation_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Скрытые активы"
          description: "Подтверждение об отсутствии скрытых активов и добросовестности сторон."
          required: false
        - name: "concealment_consequences_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус оговорки о последствиях сокрытия активов (ст. 178, 179 ГК РФ)."
          required: true
        - name: "concealment_consequences_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Последствия сокрытия"
          description: "Правовые последствия сокрытия существенных активов (основание для оспаривания)."
          required: true
        - name: "disclosure_summary_display"
          type: "string"
          presentation: "summary"
          display_in_grid: true
          display_priority: 3
          label: "Полнота раскрытия"
          description: "Компактная сводка полноты раскрытия активов для DD Grid."
          required: true

      store_payload: true

  - id: maternity_capital_pension_check
    name: "Материнский капитал, пенсионные накопления и страховые выплаты (ФЗ-256, ст. 36 СК РФ)"
    description: >
      Фактографическая проверка урегулированности императивных ограничений, связанных
      с материнским (семейным) капиталом (ФЗ № 256-ФЗ): жильё, приобретённое с использованием
      средств МК, обязательно оформляется в долевую собственность супругов и детей, и брачный
      договор не может это отменить. Также проверяется режим пенсионных накоплений (ст. 36 СК РФ)
      и страховых выплат по договорам страхования жизни.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 140

    rules:
      keywords:
        - "материнский капитал"
        - "семейный капитал"
        - "материнский (семейный) капитал"
        - "МК"
        - "средства материнского"
        - "ФЗ-256"
        - "ФЗ № 256"
        - "долевая собственность детей"
        - "обязательная доля детей"
        - "пенсионные накопления"
        - "накопительная пенсия"
        - "пенсионный счёт"
        - "страхование жизни"
        - "выгодоприобретатель"
        - "страховая выплата"
        - "страховая премия"
        - "целевые выплаты"
      keyword_mode: "any"
      negative_keywords:
        - "алименты на несовершеннолетних"
        - "алименты на детей"
        - "содержание ребенка"
        - "в целях настоящего"
      regex_patterns:
        - "(?i)материнск(ий|ого|им)\\s+(капитал|капитала)"
        - "(?i)семейн(ый|ого)\\s+капитал"
        - "(?i)ФЗ[\\s-]*256"
        - "(?i)пенсионн(ые|ых)\\s+накоплени"
        - "(?i)выгодоприобретател"
        - "(?i)страховани(е|я)\\s+жизни"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по семейному праву.
        Анализируется брачный договор (ст. 34, 36 СК РФ; ФЗ № 256-ФЗ «О дополнительных мерах
        государственной поддержки семей, имеющих детей»).
        Проверяется один вопрос: урегулированность императивных ограничений, связанных
        с материнским капиталом, пенсионными накоплениями и страховыми выплатами.
        Ключевые нормы:
        - Ст. 10 ФЗ № 256: жильё, приобретённое с использованием средств материнского капитала,
          оформляется в общую долевую собственность супругов и всех детей. Это императивная норма.
          Брачный договор НЕ МОЖЕТ отменить это требование. Условие о том, что такое жильё
          является раздельной собственностью одного супруга, ничтожно в противоречащей части.
        - Ст. 36 СК РФ: целевые выплаты (включая пенсионные накопления) — личная собственность.
        - Страхование жизни: споры о разделе страховой премии и смене выгодоприобретателя.
        Важно:
        - Твоя задача — только установить, что прямо зафиксировано в тексте договора.
        - Не оценивай риски самостоятельно.
        - Не анализируй общий режим собственности или алименты.
        [ЗАДАЧА]
        Найди в тексте договора:
        1. Упоминание материнского капитала и соответствие условиям ФЗ № 256.
        2. Наличие конфликта между условиями договора и императивной нормой о долевой
           собственности детей в жилье, купленном с МК.
        3. Режим пенсионных накоплений.
        4. Режим страховых выплат и статус выгодоприобретателя.
        5. Сформируй компактную сводку social_assets_summary_display.
        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если тема раскрыта частично — статус = "partial".
        3. Если данные полностью не указаны — статус/код = "not_defined",
           текстовое поле = "Данные не определены".
        4. Не используй "None", "null" или пустые строки.
        5. В evidence включай только текст договора.
        6. Значение каждого enum-поля — строго из списка allowed_values.
        7. Верни РОВНО один валидный JSON-объект со всеми 10 ключами,
           пригодный для парсинга через json.loads без предварительной обработки.
           Без markdown, без ```json, без комментариев, без текста до или после.
           Начни ответ сразу с { и закончи }.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — МК учтён, конфликт отсутствует:
        Фрагмент:
        "п. 12.1. Стороны осведомлены о том, что жилое помещение, приобретённое с использованием
        средств материнского (семейного) капитала, подлежит оформлению в общую долевую собственность
        супругов и детей в соответствии со ст. 10 ФЗ № 256-ФЗ. Условия настоящего договора
        не распространяются на долю в указанном жилом помещении, причитающуюся детям.
        п. 12.2. Пенсионные накопления каждого из супругов являются его личной собственностью.
        п. 12.3. Страховые выплаты по договорам страхования жизни, где выгодоприобретателем
        указан супруг, являются его личной собственностью."
        Ответ:
        {
          "maternity_capital_status": "compliant",
          "maternity_capital_details": "Жильё с МК оформляется в долевую собственность супругов и детей (ст. 10 ФЗ-256). Договор не распространяется на детские доли.",
          "mk_conflict_detected": "no_conflict",
          "mk_conflict_details": "Конфликт с императивной нормой ФЗ-256 отсутствует.",
          "pension_savings_status": "separate",
          "pension_savings_details": "Пенсионные накопления — личная собственность каждого супруга.",
          "insurance_payouts_status": "defined",
          "insurance_payouts_details": "Страховые выплаты по договорам страхования жизни — личная собственность выгодоприобретателя.",
          "social_assets_summary_display": "МК: учтён (доли детей защищены) / Пенсия: раздельная / Страхование: личное",
          "evidence": [
            {
              "clause_ref": "п. 12.1",
              "quote": "Стороны осведомлены о том, что жилое помещение, приобретённое с использованием средств материнского (семейного) капитала, подлежит оформлению в общую долевую собственность супругов и детей."
            }
          ]
        }
        Пример 2 — конфликт с ФЗ-256 (ничтожное условие):
        Фрагмент:
        "п. 3.5. Квартира по адресу г. Москва, ул. Тверская, д. 10, кв. 5, приобретённая
        с использованием средств материнского капитала, является единоличной раздельной
        собственностью Супруги."
        Ответ:
        {
          "maternity_capital_status": "conflict_detected",
          "maternity_capital_details": "Квартира, купленная с МК, объявлена раздельной собственностью Супруги.",
          "mk_conflict_detected": "void_clause",
          "mk_conflict_details": "Условие противоречит императивной ст. 10 ФЗ-256: жильё с МК должно быть в долевой собственности супругов и детей. Условие ничтожно в этой части.",
          "pension_savings_status": "not_defined",
          "pension_savings_details": "Данные не определены",
          "insurance_payouts_status": "not_defined",
          "insurance_payouts_details": "Данные не определены",
          "social_assets_summary_display": "ВНИМАНИЕ: конфликт с ФЗ-256 (квартира с МК — раздельная, ничтожно) / Пенсия: не урегулирована",
          "evidence": [
            {
              "clause_ref": "п. 3.5",
              "quote": "Квартира по адресу г. Москва, ул. Тверская, д. 10, кв. 5, приобретённая с использованием средств материнского капитала, является единоличной раздельной собственностью Супруги."
            }
          ]
        }
        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Стороны определяют режим имущества в соответствии с настоящим договором."
        Ответ:
        {
          "maternity_capital_status": "not_defined",
          "maternity_capital_details": "Данные не определены",
          "mk_conflict_detected": "not_defined",
          "mk_conflict_details": "Данные не определены",
          "pension_savings_status": "not_defined",
          "pension_savings_details": "Данные не определены",
          "insurance_payouts_status": "not_defined",
          "insurance_payouts_details": "Данные не определены",
          "social_assets_summary_display": "МК, пенсия и страхование не урегулированы",
          "evidence": []
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Проверь упоминание материнского капитала и соответствие ст. 10 ФЗ-256.
        2. Проверь конфликт: не объявлено ли жильё с МК раздельной собственностью одного супруга (void_clause).
        3. Проверь режим пенсионных накоплений (separate / joint / not_defined).
        4. Проверь режим страховых выплат и выгодоприобретателя.
        5. Сформируй компактный social_assets_summary_display.
        6. Если прямой цитаты нет — верни "not_defined". Не додумывай.
        7. Проверь, что все 10 ключей (9 полей + evidence) присутствуют в JSON.
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "maternity_capital_status": "<compliant / conflict_detected / not_mentioned / not_defined>",
          "maternity_capital_details": "<текст или 'Данные не определены'>",
          "mk_conflict_detected": "<no_conflict / void_clause / not_applicable / not_defined>",
          "mk_conflict_details": "<текст или 'Данные не определены'>",
          "pension_savings_status": "<separate / joint / not_defined>",
          "pension_savings_details": "<текст или 'Данные не определены'>",
          "insurance_payouts_status": "<defined / partial / not_defined>",
          "insurance_payouts_details": "<текст или 'Данные не определены'>",
          "social_assets_summary_display": "<компактная сводка>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 1000

    retrieval:
      retrieval_profile: "payment_terms_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "материнский капитал семейный капитал ФЗ-256 долевая собственность детей пенсионные накопления накопительная пенсия страхование жизни выгодоприобретатель страховая выплата целевые выплаты"
      boost_keywords:
        - "материнск"
        - "семейн"
        - "ФЗ-256"
        - "ФЗ 256"
        - "пенсионн"
        - "страхован"
        - "выгодоприобретател"
      preferred_unit_types:
        - obligation
        - general_provision
        - representations
      excluded_unit_types:
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - limitations
        - representations
      negative_keywords:
        - "алименты на несовершеннолетних"
        - "алименты на детей"
        - "содержание ребенка"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.10, 0.90]
        boost: 0.30
        scope: file
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "limitations"
        - "representations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 700

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1500

      compact_output: false

      presence_signal:
        field: "maternity_capital_pension_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по семейному праву. Извлеки из брачного договора
        условия, связанные с материнским (семейным) капиталом (ФЗ-256), пенсионными
        накоплениями и страховыми выплатами.
        Не анализируй общий режим собственности, алименты или бизнес-активы.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 10 полей + evidence (всего 11 ключей):

        0. maternity_capital_pension_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (maternity_capital_status, mk_conflict_detected,
              pension_savings_status, insurance_payouts_status)
             ≠ "not_defined";
           - "missing" — если все четыре содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - maternity_capital_status = "not_defined";
           - mk_conflict_detected = "not_defined";
           - pension_savings_status = "not_defined";
           - insurance_payouts_status = "not_defined";
           - все *_details = "Данные не определены";
           - social_assets_summary_display = "МК, пенсия и страхование не урегулированы";
           - не выполняй остальные шаги.

        1.  maternity_capital_status — compliant / conflict_detected / not_mentioned / not_defined.
        2.  maternity_capital_details — условия о материнском капитале и долях детей.
        3.  mk_conflict_detected — no_conflict / void_clause / not_applicable / not_defined.
        4.  mk_conflict_details — описание конфликта с императивной ст. 10 ФЗ-256.
        5.  pension_savings_status — separate / joint / not_defined.
        6.  pension_savings_details — режим пенсионных накоплений.
        7.  insurance_payouts_status — defined / partial / not_defined.
        8.  insurance_payouts_details — режим страховых выплат и выгодоприобретателя.
        9.  social_assets_summary_display — компактная сводка для DD Grid.
        10. evidence — массив прямых цитат из договора.

        Если данные полностью отсутствуют в тексте:
        - статус/код = "not_defined";
        - текстовое поле = "Данные не определены";
        - social_assets_summary_display = "МК, пенсия и страхование не урегулированы".
        </task>

        <context_rules>
        - Перед остальными полями заполни maternity_capital_pension_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Данные не определены", social_assets_summary_display = "МК, пенсия и страхование не урегулированы".
        - Используй только текст договора.
        - maternity_capital_status:
            "compliant" — договор учитывает императивную норму ФЗ-256 (доли детей защищены);
            "conflict_detected" — договор содержит условие, противоречащее ст. 10 ФЗ-256
              (например, жильё с МК объявлено раздельной собственностью одного супруга);
            "not_mentioned" — материнский капитал прямо не упомянут;
            "not_defined" — не определено.
        - mk_conflict_detected:
            "no_conflict" — условия договора не противоречат ФЗ-256;
            "void_clause" — выявлено ничтожное условие (жильё с МК — раздельное);
            "not_applicable" — МК не использовался;
            "not_defined" — не определено.
        - pension_savings_status:
            "separate" — пенсионные накопления — личная собственность (ст. 36 СК РФ);
            "joint" — пенсионные накопления признаны совместной собственностью;
            "not_defined" — не определено.
        - social_assets_summary_display формируется как строка вида:
            "МК: <учтён/конфликт/не упомянут> / Пенсия: <раздельная/совместная/нет> /
            Страхование: <урегулировано/нет>".
        - Значение каждого enum-поля — строго из списка allowed_values.
        - Верни только один JSON-объект.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни упоминаний материнского капитала, ни пенсионных накоплений,
           ни страховых выплат.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены";
             social_assets_summary_display = "МК, пенсия и страхование не урегулированы".

        2. МК упомянут, но без конфликта.
           Стороны прямо указывают, что жильё с МК оформляется в долевую собственность
           детей, что соответствует закону.
           → presence = "present";
             maternity_capital_status = "compliant";
             mk_conflict_detected = "no_conflict".

        3. Противоречие между фрагментами.
           В одном месте указано, что квартира с МК — совместная, в другом —
           что она раздельная собственность одного супруга.
           → presence = "unclear";
             maternity_capital_status = "not_defined";
             maternity_capital_details = "Не удалось определить".

        4. Конфликт с ФЗ-256 (ничтожное условие).
           Договор прямо объявляет квартиру, купленную с использованием МК,
           единоличной собственностью одного из супругов.
           → presence = "present";
             maternity_capital_status = "conflict_detected";
             mk_conflict_detected = "void_clause";
             social_assets_summary_display содержит маркер "ВНИМАНИЕ: конфликт".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для maternity_capital_pension_check_presence используй только: "present", "missing", "unclear".
        - Для maternity_capital_status используй только: "compliant", "conflict_detected", "not_mentioned", "not_defined".
        - Для mk_conflict_detected используй только: "no_conflict", "void_clause", "not_applicable", "not_defined".
        - Для pension_savings_status используй только: "separate", "joint", "not_defined".
        - Для insurance_payouts_status используй только: "defined", "partial", "not_defined".
        - Fallback при отсутствии данных:
          * *_details → "Данные не определены";
          * social_assets_summary_display → "МК, пенсия и страхование не урегулированы".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "maternity_capital_pension_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования МК, пенсионных и страховых активов. Внутреннее агрегатное signal-поле."
          required: true

        - name: "maternity_capital_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["compliant", "conflict_detected", "not_mentioned", "not_defined"]
          description: "Статус соответствия условий договора императивной норме о МК (ст. 10 ФЗ-256)."
          required: true
        - name: "maternity_capital_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Материнский капитал"
          description: "Условия о материнском (семейном) капитале и долевой собственности детей."
          required: true
        - name: "mk_conflict_detected"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["no_conflict", "void_clause", "not_applicable", "not_defined"]
          description: "Наличие конфликта с императивной нормой ФЗ-256 (ничтожное условие)."
          required: true
        - name: "mk_conflict_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Конфликт с ФЗ-256"
          description: "Описание ничтожного условия, противоречащего ст. 10 ФЗ-256."
          required: true
        - name: "pension_savings_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["separate", "joint", "not_defined"]
          description: "Режим пенсионных накоплений супругов (ст. 36 СК РФ)."
          required: true
        - name: "pension_savings_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Пенсионные накопления"
          description: "Условия о режиме пенсионных накоплений и накопительной пенсии."
          required: false
        - name: "insurance_payouts_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "partial", "not_defined"]
          description: "Статус урегулированности страховых выплат и выгодоприобретателей."
          required: true
        - name: "insurance_payouts_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Страховые выплаты"
          description: "Режим страховых выплат по договорам страхования жизни и статус выгодоприобретателя."
          required: false
        - name: "social_assets_summary_display"
          type: "string"
          presentation: "summary"
          display_in_grid: true
          display_priority: 3
          label: "МК, пенсия, страхование"
          description: "Компактная сводка социальных активов для DD Grid."
          required: true

      store_payload: true

  - id: valuation_exit_mechanics_check
    name: "Оценка имущества, порядок расчётов и exit-механика при разводе (ст. 38, 42 СК РФ)"
    description: >
      Фактографическая проверка наличия конкретных механизмов исполнения брачного договора
      при расторжении брака: порядок оценки имущества (рыночная / кадастровая / независимый
      оценщик), сроки и валюта компенсационных выплат, индексация, рассрочка, обеспечение
      исполнения и преимущественное право покупки доли. Без этих механик брачный договор
      создаёт иллюзию определённости, но при реальном разводе требует судебного вмешательства.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 150

    rules:
      keywords:
        - "оценка имущества"
        - "рыночная стоимость"
        - "кадастровая стоимость"
        - "независимый оценщик"
        - "действительная стоимость"
        - "порядок расчётов"
        - "сроки выплаты"
        - "валюта выплаты"
        - "индексация"
        - "рассрочка"
        - "обеспечение исполнения"
        - "залог в обеспечение"
        - "аккредитив"
        - "преимущественное право"
        - "выкуп доли"
        - "порядок передачи"
        - "акт приёма-передачи"
      keyword_mode: "any"
      negative_keywords:
        - "алименты на несовершеннолетних"
        - "алименты на детей"
        - "содержание ребенка"
        - "в целях настоящего"
      regex_patterns:
        - "(?i)(рыночн|кадастров|оценочн)\\w*\\s+стоимост"
        - "(?i)независим(ый|ого)\\s+оценщик"
        - "(?i)порядок\\s+расчёт"
        - "(?i)индексац(ия|ии)"
        - "(?i)рассрочк(а|и)"
        - "(?i)преимущественн(ое|ого)\\s+прав"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по семейному праву.
        Анализируется брачный договор (ст. 38, 42 СК РФ; ст. 328, 329 ГК РФ).
        Проверяется один вопрос: наличие конкретных механизмов исполнения обязательств
        при расторжении брака — оценка, расчёты, сроки, обеспечение.
        Ключевые аспекты:
        - Порядок оценки имущества (рыночная стоимость, кадастровая, независимый оценщик).
        - Сроки, валюта и порядок выплаты компенсаций.
        - Индексация и рассрочка платежей.
        - Обеспечение исполнения (залог, поручительство, аккредитив).
        - Преимущественное право покупки доли в бизнесе или недвижимости.
        Важно:
        - Твоя задача — только установить, что прямо зафиксировано в тексте договора.
        - Не оценивай адекватность оценки или справедливость условий.
        - Не анализируй режим собственности или алименты — это темы других проверок.
        [ЗАДАЧА]
        Найди в тексте договора:
        1. Порядок оценки имущества при разделе (метод, оценщик).
        2. Сроки и порядок выплаты компенсаций.
        3. Валюта и индексация денежных обязательств.
        4. Обеспечение исполнения обязательств.
        5. Преимущественное право покупки доли.
        6. Сформируй компактную сводку exit_mechanics_summary_display.
        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если тема раскрыта частично — статус = "partial".
        3. Если данные полностью не указаны — статус/код = "not_defined",
           текстовое поле = "Данные не определены".
        4. Не используй "None", "null" или пустые строки.
        5. В evidence включай только текст договора.
        6. Значение каждого enum-поля — строго из списка allowed_values.
        7. Верни РОВНО один валидный JSON-объект со всеми 13 ключами,
           пригодный для парсинга через json.loads без предварительной обработки.
           Без markdown, без ```json, без комментариев, без текста до или после.
           Начни ответ сразу с { и закончи }.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — exit-механика полностью урегулирована:
        Фрагмент:
        "п. 13.1. Стоимость имущества, подлежащего разделу или компенсации, определяется
        по рыночной стоимости на дату фактического прекращения брака на основании отчёта
        независимого оценщика, выбранного по соглашению сторон.
        п. 13.2. Компенсационные выплаты осуществляются в рублях РФ в течение 90 календарных
        дней с даты вступления в силу решения суда о расторжении брака. При рассрочке —
        равными ежемесячными платежами в течение 24 месяцев с индексацией по ИПЦ.
        п. 13.3. В обеспечение исполнения обязательств по выплате компенсации Супруг
        предоставляет залог принадлежащей ему доли в ООО «Альфа».
        п. 13.4. Супруг имеет преимущественное право выкупа доли Супруги в ООО «Бета»
        по цене, определённой независимым оценщиком."
        Ответ:
        {
          "valuation_method_status": "defined",
          "valuation_method_code": "independent_appraiser",
          "valuation_method_details": "Рыночная стоимость по отчёту независимого оценщика на дату прекращения брака.",
          "payment_terms_status": "defined",
          "payment_terms_details": "В рублях РФ, в течение 90 дней; при рассрочке — 24 месяца с индексацией по ИПЦ.",
          "currency_and_indexation_status": "defined",
          "currency_and_indexation_details": "Рубли РФ, индексация по ИПЦ.",
          "security_for_performance_status": "defined",
          "security_for_performance_details": "Залог доли в ООО «Альфа» в обеспечение компенсации.",
          "preemptive_right_status": "defined",
          "preemptive_right_details": "Преимущественное право выкупа доли в ООО «Бета» по цене оценщика.",
          "exit_mechanics_summary_display": "Оценка: независимый оценщик / Выплата: 90 дн. (рассрочка 24 мес., ИПЦ) / Обеспечение: залог доли / Преим. право: ООО «Бета»",
          "evidence": [
            {
              "clause_ref": "п. 13.1",
              "quote": "Стоимость имущества определяется по рыночной стоимости на основании отчёта независимого оценщика."
            },
            {
              "clause_ref": "п. 13.3",
              "quote": "В обеспечение исполнения обязательств Супруг предоставляет залог принадлежащей ему доли в ООО «Альфа»."
            }
          ]
        }
        Пример 2 — минимальные условия (только сроки):
        Фрагмент:
        "Компенсация выплачивается в течение 6 месяцев с момента расторжения брака."
        Ответ:
        {
          "valuation_method_status": "not_defined",
          "valuation_method_code": "not_defined",
          "valuation_method_details": "Данные не определены",
          "payment_terms_status": "partial",
          "payment_terms_details": "Срок выплаты — 6 месяцев; порядок и валюта не указаны.",
          "currency_and_indexation_status": "not_defined",
          "currency_and_indexation_details": "Данные не определены",
          "security_for_performance_status": "not_defined",
          "security_for_performance_details": "Данные не определены",
          "preemptive_right_status": "not_defined",
          "preemptive_right_details": "Данные не определены",
          "exit_mechanics_summary_display": "Оценка: не указана / Выплата: 6 мес. / Обеспечение: нет / Преим. право: нет",
          "evidence": [
            {
              "clause_ref": "п. 5.2",
              "quote": "Компенсация выплачивается в течение 6 месяцев с момента расторжения брака."
            }
          ]
        }
        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Стороны определяют режим имущества в соответствии с настоящим договором."
        Ответ:
        {
          "valuation_method_status": "not_defined",
          "valuation_method_code": "not_defined",
          "valuation_method_details": "Данные не определены",
          "payment_terms_status": "not_defined",
          "payment_terms_details": "Данные не определены",
          "currency_and_indexation_status": "not_defined",
          "currency_and_indexation_details": "Данные не определены",
          "security_for_performance_status": "not_defined",
          "security_for_performance_details": "Данные не определены",
          "preemptive_right_status": "not_defined",
          "preemptive_right_details": "Данные не определены",
          "exit_mechanics_summary_display": "Exit-механика при разводе не урегулирована",
          "evidence": []
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Проверь метод оценки имущества (independent_appraiser / market_value / cadastral / not_defined).
        2. Проверь сроки и порядок выплаты компенсаций.
        3. Проверь валюту и индексацию.
        4. Проверь обеспечение исполнения (залог, поручительство, аккредитив).
        5. Проверь преимущественное право покупки доли.
        6. Сформируй компактный exit_mechanics_summary_display.
        7. Если прямой цитаты нет — верни "not_defined". Не додумывай.
        8. Проверь, что все 13 ключей (12 полей + evidence) присутствуют в JSON.
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "valuation_method_status": "<defined / partial / not_defined>",
          "valuation_method_code": "<independent_appraiser / market_value / cadastral / not_defined>",
          "valuation_method_details": "<текст или 'Данные не определены'>",
          "payment_terms_status": "<defined / partial / not_defined>",
          "payment_terms_details": "<текст или 'Данные не определены'>",
          "currency_and_indexation_status": "<defined / not_defined>",
          "currency_and_indexation_details": "<текст или 'Данные не определены'>",
          "security_for_performance_status": "<defined / not_defined>",
          "security_for_performance_details": "<текст или 'Данные не определены'>",
          "preemptive_right_status": "<defined / not_defined>",
          "preemptive_right_details": "<текст или 'Данные не определены'>",
          "exit_mechanics_summary_display": "<компактная сводка>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 1000

    retrieval:
      retrieval_profile: "payment_terms_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "оценка имущества рыночная стоимость кадастровая стоимость независимый оценщик порядок расчётов сроки выплаты валюта индексация рассрочка обеспечение исполнения залог аккредитив преимущественное право выкуп доли"
      boost_keywords:
        - "оценк"
        - "рыночн"
        - "кадастров"
        - "независим"
        - "расчёт"
        - "индексац"
        - "рассрочк"
        - "обеспечен"
        - "преимущественн"
        - "выкуп"
      preferred_unit_types:
        - obligation
        - payment_term
        - general_provision
      excluded_unit_types:
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
        - remedies
      negative_keywords:
        - "алименты на несовершеннолетних"
        - "алименты на детей"
        - "содержание ребенка"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.30, 0.95]
        boost: 0.30
        scope: file
      context_k: 8
      max_chunks: 12
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
        - "remedies"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 700

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1500

      compact_output: false

      presence_signal:
        field: "valuation_exit_mechanics_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по семейному праву. Извлеки из брачного договора
        exit-механику при разводе: порядок оценки имущества, сроки и валюту компенсаций,
        индексацию, рассрочку, обеспечение исполнения и преимущественное право выкупа доли.
        Не анализируй режим собственности, алименты или банкротство.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 13 полей + evidence (всего 14 ключей):

        0. valuation_exit_mechanics_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (valuation_method_status, payment_terms_status,
              currency_and_indexation_status, security_for_performance_status,
              preemptive_right_status) ≠ "not_defined";
           - "missing" — если все пять содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - valuation_method_status = "not_defined";
           - payment_terms_status = "not_defined";
           - currency_and_indexation_status = "not_defined";
           - security_for_performance_status = "not_defined";
           - preemptive_right_status = "not_defined";
           - все *_details = "Данные не определены";
           - exit_mechanics_summary_display = "Exit-механика при разводе не урегулирована";
           - не выполняй остальные шаги.

        1.  valuation_method_status — defined / partial / not_defined.
        2.  valuation_method_code — independent_appraiser / market_value / cadastral / not_defined.
        3.  valuation_method_details — метод оценки имущества при разделе.
        4.  payment_terms_status — defined / partial / not_defined.
        5.  payment_terms_details — сроки и порядок выплаты компенсаций.
        6.  currency_and_indexation_status — defined / not_defined.
        7.  currency_and_indexation_details — валюта и индексация денежных обязательств.
        8.  security_for_performance_status — defined / not_defined.
        9.  security_for_performance_details — обеспечение исполнения (залог, поручительство).
        10. preemptive_right_status — defined / not_defined.
        11. preemptive_right_details — преимущественное право выкупа доли.
        12. exit_mechanics_summary_display — компактная сводка для DD Grid.
        13. evidence — массив прямых цитат из договора.

        Если данные полностью отсутствуют в тексте:
        - статус/код = "not_defined";
        - текстовое поле = "Данные не определены";
        - exit_mechanics_summary_display = "Exit-механика при разводе не урегулирована".
        </task>

        <context_rules>
        - Перед остальными полями заполни valuation_exit_mechanics_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status/*_code = "not_defined", все *_details = "Данные не определены", exit_mechanics_summary_display = "Exit-механика при разводе не урегулирована".
        - Используй только текст договора.
        - valuation_method_code:
            "independent_appraiser" — оценка независимым оценщиком;
            "market_value" — рыночная стоимость (без уточнения метода);
            "cadastral" — кадастровая стоимость;
            "not_defined" — метод оценки не указан.
        - payment_terms_status:
            "defined" — сроки, порядок и валюта чётко определены;
            "partial" — указан только срок или только порядок;
            "not_defined" — не определено.
        - exit_mechanics_summary_display формируется как строка вида:
            "Оценка: <метод или 'нет'> / Выплата: <срок> (<валюта>) /
            Обеспечение: <есть/нет> / Преим. право: <есть/нет>".
        - Значение каждого enum-поля — строго из списка allowed_values.
        - Верни только один JSON-объект.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни упоминаний об оценке, ни сроков выплат,
           ни обеспечения исполнения или преимущественного права.
           → presence = "missing";
             все *_status/*_code = "not_defined";
             все *_details = "Данные не определены";
             exit_mechanics_summary_display = "Exit-механика при разводе не урегулирована".

        2. Частичное раскрытие (только сроки).
           Указан только срок выплаты компенсации, но не указан метод оценки,
           валюта или обеспечение.
           → presence = "present";
             payment_terms_status = "partial";
             valuation_method_status = "not_defined".

        3. Противоречие между фрагментами.
           В одном месте указана рыночная оценка, в другом — кадастровая,
           без уточнения приоритета.
           → presence = "unclear";
             valuation_method_code = "not_defined";
             valuation_method_details = "Не удалось определить".

        4. Преимущественное право без механизма оценки.
           Указано преимущественное право выкупа доли, но не определено,
           как именно будет определяться цена выкупа.
           → presence = "present";
             preemptive_right_status = "defined";
             valuation_method_status = "not_defined" (или partial).
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для valuation_exit_mechanics_check_presence используй только: "present", "missing", "unclear".
        - Для valuation_method_status, payment_terms_status используй только: "defined", "partial", "not_defined".
        - Для valuation_method_code используй только: "independent_appraiser", "market_value", "cadastral", "not_defined".
        - Для currency_and_indexation_status, security_for_performance_status, preemptive_right_status используй только: "defined", "not_defined".
        - Fallback при отсутствии данных:
          * *_details → "Данные не определены";
          * exit_mechanics_summary_display → "Exit-механика при разводе не урегулирована".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "valuation_exit_mechanics_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования exit-механики при разводе. Внутреннее агрегатное signal-поле."
          required: true

        - name: "valuation_method_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "partial", "not_defined"]
          description: "Статус определения метода оценки имущества при разделе."
          required: true
        - name: "valuation_method_code"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["independent_appraiser", "market_value", "cadastral", "not_defined"]
          description: "Метод оценки имущества (независимый оценщик, рыночная, кадастровая)."
          required: true
        - name: "valuation_method_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Оценка имущества"
          description: "Порядок и метод оценки имущества при разделе (оценщик, дата оценки)."
          required: true
        - name: "payment_terms_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "partial", "not_defined"]
