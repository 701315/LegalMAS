      store_payload: true

  - id: bankruptcy_challenge_risk_check
    name: "Риск оспаривания брачного договора в банкротстве (ФЗ-127, ст. 61.2)"
    description: >
      Фактографическая проверка условий, создающих критический риск признания брачного
      договора недействительным в рамках банкротства супруга (ст. 61.2 ФЗ «О несостоятельности
      (банкротстве)», ст. 10, 168, 170 ГК РФ, Постановление Пленума ВС РФ № 48):
      безвозмездные передачи активов, отсутствие соразмерного встречного предоставления,
      асимметричная концентрация имущества на одном супруге при оставлении долговых
      обязательств на другом, а также наличие прямых банкротных оговорок.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 80

    rules:
      keywords:
        - "банкротство"
        - "несостоятельность"
        - "оспаривание сделки"
        - "финансовый управляющий"
        - "конкурсная масса"
        - "подозрительная сделка"
        - "причинение вреда кредиторам"
        - "безвозмездная передача"
        - "безвозмездно переходит"
        - "без встречного предоставления"
        - "без выплаты компенсации"
        - "компенсация не выплачивается"
        - "всё имущество переходит"
        - "в единоличную собственность"
        - "не претендует на имущество"
        - "отказывается от прав на имущество"
        - "вывод активов"
        - "неравноценное встречное предоставление"
      keyword_mode: "any"
      negative_keywords:
        - "алименты на несовершеннолетних"
        - "алименты на детей"
        - "содержание ребенка"
        - "в целях настоящего"
      regex_patterns:
        - "(?i)банкротств(о|а|е|у)"
        - "(?i)оспаривани(е|я)\\s+(сдел|договор)"
        - "(?i)конкурсн(ая|ой|ую)\\s+масс"
        - "(?i)(без\\s+выплаты|без\\s+какой-либо)\\s+компенсаци"
        - "(?i)(полностью|целиком)\\s+переходит\\s+в\\s+(личную|раздельную|собственность)"
        - "(?i)без\\s+встречного\\s+предоставлени"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по семейному праву и банкротству физических лиц.
        Анализируется брачный договор (ФЗ-127 «О несостоятельности (банкротстве)»; ст. 10, 168, 170 ГК РФ).
        Проверяется только один вопрос: наличие фактографических признаков, создающих риск
        оспаривания брачного договора кредиторами или финансовым управляющим в банкротстве.
        Ключевые маркеры риска:
        - П. 1 ст. 61.2 ФЗ-127: Неравноценное встречное предоставление (передача активов без соразмерной компенсации).
        - П. 2 ст. 61.2 ФЗ-127: Причинение вреда кредиторам (безвозмездный вывод активов на супруга).
        - Ст. 10, 170 ГК РФ: Злоупотребление правом и притворность (все активы передаются одному супругу,
          а кредитные и долговые обязательства остаются на другом супруге).
        Важно:
        - Твоя задача — только установить, что прямо зафиксировано в тексте договора.
        - Не оценивай вероятность банкротства сторон вне установленных критериев.
        - Не анализируй алименты на детей или процессуальные вопросы развода.
        [ЗАДАЧА]
        Найди в тексте договора:
        1. Наличие условий о безвозмездной передаче активов или отказе от компенсации.
        2. Степень асимметрии распределения имущества (концентрация активов на одном супруге).
        3. Асимметрию долгов и активов (активы — одному супругу, долги/кредиты — другому).
        4. Наличие встречного предоставления (рыночная или фиксированная компенсация).
        5. Прямые оговорки о банкротстве, финансовом управляющем или защите от кредиторов.
        6. Итоговый уровень риска оспаривания по ст. 61.2 ФЗ-127.
        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если тема раскрыта частично — статус = "partial".
        3. Если данные полностью не указаны — статус/код = "not_defined",
           текстовое поле = "Данные не определены".
        4. Не используй "None", "null" или пустые строки.
        5. В evidence включай только текст договора.
        6. Значение каждого enum-поля — строго из списка allowed_values.
        7. Верни РОВНО один валидный JSON-объект со всеми 11 ключами,
           пригодный для парсинга через json.loads без предварительной обработки.
           Без markdown, без ```json, без комментариев, без текста до или после.
           Начни ответ сразу с { и закончи }.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — высокий риск оспаривания в банкротстве (вывод активов):
        Фрагмент:
        "п. 3.1. Всё недвижимое имущество, приобретённое в браке (включая квартиры и земельные участки),
        является единоличной собственностью Супруги. Супруг не имеет права претендовать на указанное имущество.
        п. 3.2. Никаких денежных компенсаций Супругу за переходящее Супруге имущество не выплачивается.
        п. 4.1. Все кредитные обязательства перед банками, оформленные на имя Супруга, погашаются им самостоятельно."
        Ответ:
        {
          "asset_shift_status": "extreme_shift",
          "asset_shift_details": "Вся недвижимость переходит в единоличную собственность Супруги; Супруг лишен прав на имущество.",
          "gratuitous_transfer_status": "gratuitous_detected",
          "gratuitous_transfer_details": "Прямой отказ от встречного предоставления: компенсация за переходящее имущество прямо исключена.",
          "debt_asset_mismatch_status": "high_mismatch",
          "debt_asset_mismatch_details": "Все активы сконцентрированы на Супруге, а все кредитные долги возложены на Супруга.",
          "bankruptcy_clauses_status": "no_mention",
          "bankruptcy_clauses_details": "Прямые упоминания банкротства отсутствуют.",
          "bankruptcy_risk_level": "high_risk",
          "bankruptcy_summary_display": "ВЫСОКИЙ РИСК (ст. 61.2 ФЗ-127): безвозмездная передача всей недвижимости Супруге + долги на Супруге",
          "evidence": [
            {
              "clause_ref": "п. 3.1",
              "quote": "Всё недвижимое имущество, приобретённое в браке (включая квартиры и земельные участки), является единоличной собственностью Супруги."
            },
            {
              "clause_ref": "п. 3.2",
              "quote": "Никаких денежных компенсаций Супругу за переходящее Супруге имущество не выплачивается."
            },
            {
              "clause_ref": "п. 4.1",
              "quote": "Все кредитные обязательства перед банками, оформленные на имя Супруга, погашаются им самостоятельно."
            }
          ]
        }
        Пример 2 — сбалансированный договор (низкий риск оспаривания):
        Фрагмент:
        "п. 2.1. Имущество, нажитое в браке, является раздельной собственностью того супруга,
        на чьё имя оно зарегистрировано и за счёт чьих личных средств оплачено.
        п. 2.2. При оформлении имущества на одного супруга с привлечением общих доходов
        второму супругу выплачивается соразмерная денежная компенсация."
        Ответ:
        {
          "asset_shift_status": "balanced",
          "asset_shift_details": "Имущество раздельное по признаку титула и источника оплаты; предусмотрена соразмерная компенсация.",
          "gratuitous_transfer_status": "with_compensation",
          "gratuitous_transfer_details": "Предусмотрена соразмерная денежная компенсация при отступлении от равенства.",
          "debt_asset_mismatch_status": "aligned",
          "debt_asset_mismatch_details": "Долги и активы распределены симметрично источнику приобретения.",
          "bankruptcy_clauses_status": "no_mention",
          "bankruptcy_clauses_details": "Прямых оговорок о банкротстве нет.",
          "bankruptcy_risk_level": "low_risk",
          "bankruptcy_summary_display": "Низкий риск: режим раздельный с соразмерной компенсацией, признаки вывода отсутствуют",
          "evidence": [
            {
              "clause_ref": "п. 2.1",
              "quote": "Имущество, нажитое в браке, является раздельной собственностью того супруга, на чьё имя оно зарегистрировано и за счёт чьих личных средств оплачено."
            }
          ]
        }
        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Стороны договорились руководствоваться общими положениями семейного законодательства."
        Ответ:
        {
          "asset_shift_status": "not_defined",
          "asset_shift_details": "Данные не определены",
          "gratuitous_transfer_status": "not_defined",
          "gratuitous_transfer_details": "Данные не определены",
          "debt_asset_mismatch_status": "not_defined",
          "debt_asset_mismatch_details": "Данные не определены",
          "bankruptcy_clauses_status": "not_defined",
          "bankruptcy_clauses_details": "Данные не определены",
          "bankruptcy_risk_level": "not_defined",
          "bankruptcy_summary_display": "Признаки банкротных рисков не урегулированы",
          "evidence": []
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Проверь наличие безвозмездности и отказа от встречного предоставления (gratuitous_detected / with_compensation / not_defined).
        2. Оцени степень асимметрии распределения активов (extreme_shift / partial_shift / balanced / not_defined).
        3. Проверь схему «активы одному, долги другому» (high_mismatch / aligned / not_defined).
        4. Проверь прямые упоминания банкротства/кредиторов (explicit_clauses_present / no_mention / not_defined).
        5. Квалифицируй итоговый риск по ст. 61.2 ФЗ-127 (high_risk / moderate_risk / low_risk / not_defined).
        6. Сформируй компактный bankruptcy_summary_display.
        7. Если прямой цитаты нет — верни "not_defined". Не додумывай.
        8. Проверь, что все 11 ключей (10 полей + evidence) присутствуют в JSON.
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "asset_shift_status": "<extreme_shift / partial_shift / balanced / not_defined>",
          "asset_shift_details": "<текст или 'Данные не определены'>",
          "gratuitous_transfer_status": "<gratuitous_detected / with_compensation / not_defined>",
          "gratuitous_transfer_details": "<текст или 'Данные не определены'>",
          "debt_asset_mismatch_status": "<high_mismatch / aligned / not_defined>",
          "debt_asset_mismatch_details": "<текст или 'Данные не определены'>",
          "bankruptcy_clauses_status": "<explicit_clauses_present / no_mention / not_defined>",
          "bankruptcy_clauses_details": "<текст или 'Данные не определены'>",
          "bankruptcy_risk_level": "<high_risk / moderate_risk / low_risk / not_defined>",
          "bankruptcy_summary_display": "<компактная сводка>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 1000

    retrieval:
      retrieval_profile: "event_of_default_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "банкротство несостоятельность финансовый управляющий конкурсная масса подозрительная сделка безвозмездная передача без встречного предоставления компенсация не выплачивается всё имущество переходит единоличная собственность долги кредиты ст. 61.2 ФЗ-127"
      boost_keywords:
        - "безвозмездн"
        - "без выплаты компенсации"
        - "компенсация не выплачивается"
        - "единоличная собственность"
        - "не претендует"
        - "банкротств"
        - "конкурсн"
        - "подозрительн"
      preferred_unit_types:
        - obligation
        - liability_provision
        - general_provision
        - representations
      excluded_unit_types:
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - limitations
        - remedies
      negative_keywords:
        - "алименты на несовершеннолетних"
        - "алименты на детей"
        - "содержание ребенка"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.10, 0.90]
        boost: 0.30
        scope: file
      context_k: 8
      max_chunks: 12
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "limitations"
        - "remedies"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 700

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1500

      compact_output: false

      presence_signal:
        field: "bankruptcy_challenge_risk_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по семейному праву и банкротству физических лиц. Извлеки из брачного договора
        условия, создающие риски оспаривания сделки в банкротстве по ст. 61.2 ФЗ-127 и ст. 10, 168, 170 ГК РФ
        (безвозмездный вывод активов, концентрация имущества без компенсации, оставление долгов на одном супруге).
        Не анализируй алименты на детей или процессуальные вопросы расторжения брака.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 11 полей + evidence (всего 12 ключей):

        0. bankruptcy_challenge_risk_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (asset_shift_status, gratuitous_transfer_status,
              debt_asset_mismatch_status, bankruptcy_clauses_status,
              bankruptcy_risk_level) ≠ "not_defined";
           - "missing" — если все пять содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - asset_shift_status = "not_defined";
           - gratuitous_transfer_status = "not_defined";
           - debt_asset_mismatch_status = "not_defined";
           - bankruptcy_clauses_status = "not_defined";
           - bankruptcy_risk_level = "not_defined";
           - все *_details = "Данные не определены";
           - bankruptcy_summary_display = "Признаки банкротных рисков не урегулированы";
           - не выполняй остальные шаги.

        1.  asset_shift_status — extreme_shift / partial_shift / balanced / not_defined.
        2.  asset_shift_details — фактографическое описание концентрации активов на одном супруге.
        3.  gratuitous_transfer_status — gratuitous_detected / with_compensation / not_defined.
        4.  gratuitous_transfer_details — условия о безвозмездности и наличии/отсутствии встречного предоставления.
        5.  debt_asset_mismatch_status — high_mismatch / aligned / not_defined.
        6.  debt_asset_mismatch_details — соотношение распределения активов и долговых обязательств.
        7.  bankruptcy_clauses_status — explicit_clauses_present / no_mention / not_defined.
        8.  bankruptcy_clauses_details — прямые оговорки о банкротстве или конкурсной массе.
        9.  bankruptcy_risk_level — high_risk / moderate_risk / low_risk / not_defined.
        10. bankruptcy_summary_display — компактная человекочитаемая сводка банкротных рисков для DD Grid.
        11. evidence — массив прямых цитат из договора.

        Если данные полностью отсутствуют в тексте:
        - статус/код = "not_defined";
        - текстовое поле = "Данные не определены";
        - bankruptcy_summary_display = "Признаки банкротных рисков не урегулированы".
        </task>

        <context_rules>
        - Перед остальными полями заполни bankruptcy_challenge_risk_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status/*_code = "not_defined", все *_details = "Данные не определены", bankruptcy_summary_display = "Признаки банкротных рисков не урегулированы".
        - Используй только текст договора.
        - asset_shift_status:
            "extreme_shift" — подавляющее большинство или все ключевые активы (недвижимость, бизнес)
              передаются в единоличную собственность одного супруга;
            "partial_shift" — наблюдается заметная асимметрия, но часть активов остаётся второму супругу;
            "balanced" — распределение сбалансировано либо действует раздельный режим по источнику оплаты;
            "not_defined" — распределение активов не зафиксировано.
        - gratuitous_transfer_status:
            "gratuitous_detected" — имущество передаётся без встречного предоставления или компенсация прямо запрещена;
            "with_compensation" — прямо предусмотрена соразмерная денежная/имущественная компенсация;
            "not_defined" — условия компенсации не указаны.
        - debt_asset_mismatch_status:
            "high_mismatch" — активы передаются одному супругу, а долги/кредиты возлагаются на другого;
            "aligned" — распределение долгов соответствует распределению приобретённых активов;
            "not_defined" — соотношение не определено.
        - bankruptcy_risk_level:
            "high_risk" — выявлены признаки подозрительной сделки (extreme_shift + gratuitous_detected или high_mismatch);
            "moderate_risk" — частичная асимметрия без прямого исключения компенсаций;
            "low_risk" — сбалансированное распределение, признаки вывода активов отсутствуют;
            "not_defined" — данных недостаточно для квалификации.
        - bankruptcy_summary_display формируется как строка вида:
            "<Уровень риска>: <краткое описание перекоса активов/долгов> / Компенсация: <есть/нет>".
        - Значение каждого enum-поля — строго из списка allowed_values.
        - Верни только один JSON-объект.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни упоминаний о распределении активов, ни оговорок
           о компенсации, ни ссылок на банкротство.
           → presence = "missing";
             все *_status/*_code = "not_defined";
             все *_details = "Данные не определены";
             bankruptcy_summary_display = "Признаки банкротных рисков не урегулированы".

        2. Сбалансированный договор (низкий риск).
           Имущество раздельное по источнику оплаты, предусмотрена соразмерная
           компенсация при отступлении от равенства.
           → presence = "present";
             asset_shift_status = "balanced";
             gratuitous_transfer_status = "with_compensation";
             bankruptcy_risk_level = "low_risk".

        3. Противоречие между фрагментами.
           В одном месте указано, что имущество переходит одному супругу,
           в другом — что выплачивается соразмерная компенсация.
           → presence = "unclear";
             gratuitous_transfer_status = "not_defined";
             gratuitous_transfer_details = "Не удалось определить".

        4. Безвозмездная передача без компенсации (высокий риск).
           Всё имущество переходит одному супругу, компенсация прямо исключена,
           а долги возложены на другого супруга.
           → presence = "present";
             asset_shift_status = "extreme_shift";
             gratuitous_transfer_status = "gratuitous_detected";
             debt_asset_mismatch_status = "high_mismatch";
             bankruptcy_risk_level = "high_risk";
             bankruptcy_summary_display содержит маркер "ВЫСОКИЙ РИСК".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для bankruptcy_challenge_risk_check_presence используй только: "present", "missing", "unclear".
        - Для asset_shift_status используй только: "extreme_shift", "partial_shift", "balanced", "not_defined".
        - Для gratuitous_transfer_status используй только: "gratuitous_detected", "with_compensation", "not_defined".
        - Для debt_asset_mismatch_status используй только: "high_mismatch", "aligned", "not_defined".
        - Для bankruptcy_clauses_status используй только: "explicit_clauses_present", "no_mention", "not_defined".
        - Для bankruptcy_risk_level используй только: "high_risk", "moderate_risk", "low_risk", "not_defined".
        - Fallback при отсутствии данных:
          * *_details → "Данные не определены";
          * bankruptcy_summary_display → "Признаки банкротных рисков не урегулированы".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "bankruptcy_challenge_risk_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования рисков оспаривания в банкротстве. Внутреннее агрегатное signal-поле."
          required: true

        - name: "asset_shift_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["extreme_shift", "partial_shift", "balanced", "not_defined"]
          description: "Степень концентрации активов на одном из супругов."
          required: true
        - name: "asset_shift_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Распределение активов"
          description: "Описание диспропорции или концентрации имущества на одном супруге."
          required: true
        - name: "gratuitous_transfer_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["gratuitous_detected", "with_compensation", "not_defined"]
          description: "Наличие признаков безвозмездности и отсутствия встречного предоставления (п. 1 ст. 61.2 ФЗ-127)."
          required: true
        - name: "gratuitous_transfer_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Безвозмездность и компенсация"
          description: "Условия о компенсации и возмездности передачи активов между супругами."
          required: true
        - name: "debt_asset_mismatch_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["high_mismatch", "aligned", "not_defined"]
          description: "Признак вывода активов: перекос между получателем имущества и плательщиком долгов."
          required: true
        - name: "debt_asset_mismatch_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Соотношение активов и долгов"
          description: "Сопоставление условий распределения имущества и обязательств по кредитам."
          required: false
        - name: "bankruptcy_clauses_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["explicit_clauses_present", "no_mention", "not_defined"]
          description: "Наличие прямых положений о банкротстве, финансовом управляющем или защите от кредиторов."
          required: true
        - name: "bankruptcy_clauses_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Оговорки о банкротстве"
          description: "Прямые оговорки договора, касающиеся несостоятельности (банкротства) сторон."
          required: false
        - name: "bankruptcy_risk_level"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["high_risk", "moderate_risk", "low_risk", "not_defined"]
          description: "Итоговый уровень риска признания брачного договора недействительным по ст. 61.2 ФЗ-127."
          required: true
        - name: "bankruptcy_summary_display"
          type: "string"
          presentation: "summary"
          display_in_grid: true
          display_priority: 3
          label: "Риски банкротства (ФЗ-127)"
          description: "Компактная сводка риска оспаривания договора в банкротстве для отображения в DD Grid."
          required: true

      store_payload: true

  - id: real_estate_division_check
    name: "Раздел недвижимости при расторжении брака (ст. 38, 42 СК РФ)"
    description: >
      Фактографическая проверка условий о судьбе объектов недвижимости (квартиры,
      жилые дома, земельные участки, коммерческие помещения) при расторжении брака:
      идентификация объектов по кадастровым номерам и адресам, механизм раздела
      (переход в единоличную собственность, выдел долей, продажа с разделом выручки),
      размер и сроки выплаты денежной компенсации, судьба ипотечных обязательств
      и порядок перерегистрации прав в Росреестре (ст. 38, 42 СК РФ, 218-ФЗ, 102-ФЗ).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 90

    rules:
      keywords:
        - "квартира"
        - "жилой дом"
        - "земельный участок"
        - "недвижимое имущество"
        - "недвижимость"
        - "нежилое помещение"
        - "апартаменты"
        - "кадастровый номер"
        - "при расторжении брака переходит"
        - "остаётся в собственности"
        - "поступает в личную собственность"
        - "поступает в раздельную собственность"
        - "компенсация за долю"
        - "денежная компенсация"
        - "ипотека"
        - "ипотечный кредит"
        - "залог недвижимости"
        - "раздел недвижимости"
        - "государственная регистрация перехода права"
        - "перерегистрация в Росреестре"
        - "срок освобождения"
        - "акт приёма-передачи"
      keyword_mode: "any"
      negative_keywords:
        - "алименты на несовершеннолетних"
        - "алименты на детей"
        - "содержание ребенка"
        - "в целях настоящего"
      regex_patterns:
        - "(?i)\\b\\d{2}:\\d{2}:\\d{6,7}:\\d+\\b"
        - "(?i)(квартир|дом|участ|помещен|недвижим)[^\\.]{0,60}перех(одит|одят|одящее)\\s+в\\s+(собственность|раздельную|личную)"
        - "(?i)при\\s+расторжении\\s+брака[^\\.]{0,80}(недвижим|квартир|дом|участ)"
        - "(?i)компенсаци(я|и|ю)\\s+за\\s+(долю|недвижимост|квартир)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по семейному праву и сделкам с недвижимостью.
        Анализируется брачный договор (ст. 38, 42 СК РФ; 218-ФЗ «О государственной регистрации недвижимости»; 102-ФЗ «Об ипотеке»).
        Проверяется только один вопрос: порядок раздела и судьба недвижимого имущества супругов при расторжении брака.
        Ключевые аспекты:
        - Идентификация объектов недвижимости (адреса, кадастровые номера).
        - Механизм раздела: переход одному супругу, долевое распределение, совместная продажа или выплата компенсации.
        - Наличие компенсационных выплат за отказ от прав на недвижимость (размер, валюта, сроки).
        - Ипотечные обязательства по передаваемой недвижимости.
        - Сроки фактической передачи помещений и перерегистрации прав в ЕГРН (Росреестре).
        Важно:
        - Твоя задача — только установить, что прямо зафиксировано в тексте договора.
        - Не оценивай справедливость раздела или рыночную стоимость объектов.
        - Не анализируй алименты или бизнес-активы — это темы других проверок.
        [ЗАДАЧА]
        Найди в тексте договора:
        1. Перечень конкретных объектов недвижимости с идентификационными признаками (кадастровые номера, адреса).
        2. Механизм раздела недвижимости при разводе.
        3. Наличие, размер и сроки выплаты компенсации за долю в недвижимости.
        4. Урегулирование ипотечных обязательств и залогов по объектам.
        5. Сроки фактической передачи объекта и перерегистрации прав в ЕГРН.
        6. Сформируй компактную сводку real_estate_summary_display.
        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если тема раскрыта частично — статус = "partial".
        3. Если данные полностью не указаны — статус/код = "not_defined",
           текстовое поле = "Данные не определены".
        4. Не используй "None", "null" или пустые строки.
        5. В evidence включай только текст договора.
        6. Значение каждого enum-поля — строго из списка allowed_values.
        7. Верни РОВНО один валидный JSON-объект со всеми 13 ключами,
           пригодный для парсинга через json.loads без предварительной обработки.
           Без markdown, без ```json, без комментариев, без текста до или после.
           Начни ответ сразу с { и закончи }.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — конкретный объект, переход Супруге с выплатой компенсации:
        Фрагмент:
        "п. 5.1. При расторжении брака трёхкомнатная квартира по адресу: г. Москва, ул. Ленина, д. 5, кв. 12
        (кадастровый номер 77:06:0001001:123) переходит в единоличную личную собственность Супруги.
        п. 5.2. В счёт компенсации стоимости 1/2 доли в указанной квартире Супруга обязуется выплатить
        Супругу денежные средства в размере 6 000 000 (шесть миллионов) рублей в течение 90 календарных дней
        с даты государственной регистрации расторжения брака.
        п. 5.3. Обязательства по погашению остатка ипотечного кредита в ПАО Сбербанк по указанной квартире
        Супруга принимает на себя в полном объёме.
        п. 5.4. Государственная регистрация прекращения права общей совместной собственности и регистрация
        права единоличной собственности Супруги в Росреестре осуществляется в течение 14 рабочих дней."
        Ответ:
        {
          "real_estate_objects_status": "defined",
          "real_estate_objects_details": "Квартира: г. Москва, ул. Ленина, д. 5, кв. 12 (КН 77:06:0001001:123).",
          "division_mechanism_code": "to_specific_spouse",
          "division_mechanism_details": "Квартира переходит в единоличную личную собственность Супруги.",
          "compensation_amount_status": "defined",
          "compensation_amount_details": "6 000 000 рублей, выплачивается в течение 90 календарных дней после расторжения брака.",
          "mortgage_encumbrance_status": "mortgaged_addressed",
          "mortgage_encumbrance_details": "Остаток ипотечного кредита в ПАО Сбербанк Супруга погашает самостоятельно в полном объёме.",
          "transfer_timeline_status": "defined",
          "transfer_timeline_details": "Регистрация права в Росреестре в течение 14 рабочих дней; выплата компенсации в течение 90 дней.",
          "state_registration_clause_status": "defined",
          "real_estate_summary_display": "Квартира (Ленина, 123) -> Супруге / Компенсация Супругу: 6 млн руб. (90 дн.) / Ипотека: на Супруге",
          "evidence": [
            {
              "clause_ref": "п. 5.1",
              "quote": "При расторжении брака трёхкомнатная квартира по адресу: г. Москва, ул. Ленина, д. 5, кв. 12 (кадастровый номер 77:06:0001001:123) переходит в единоличную личную собственность Супруги."
            },
            {
              "clause_ref": "п. 5.2",
              "quote": "В счёт компенсации стоимости 1/2 доли в указанной квартире Супруга обязуется выплатить Супругу денежные средства в размере 6 000 000 (шесть миллионов) рублей в течение 90 календарных дней."
            }
          ]
        }
        Пример 2 — продажа и раздел вырученных средств (sale and split):
        Фрагмент:
        "п. 6.1. Земельный участок и расположенный на нём жилой дом в дер. Жуковка (КН 50:20:0010203:45)
        при расторжении брака подлежат совместной продаже по рыночной стоимости.
        п. 6.2. Денежные средства, вырученные от продажи объекта, распределяются между Супругами
        в равных долях (по 50% каждому) после полного погашения расходов по сделке."
        Ответ:
        {
          "real_estate_objects_status": "defined",
          "real_estate_objects_details": "Земельный участок и жилой дом: дер. Жуковка (КН 50:20:0010203:45).",
          "division_mechanism_code": "sale_and_split",
          "division_mechanism_details": "Совместная продажа по рыночной стоимости с распределением выручки 50/50.",
          "compensation_amount_status": "not_applicable",
          "compensation_amount_details": "Прямая компенсация не предусмотрена (выручка от продажи делится пополам).",
          "mortgage_encumbrance_status": "not_addressed",
          "mortgage_encumbrance_details": "Данные не определены",
          "transfer_timeline_status": "partial",
          "transfer_timeline_details": "Срок продажи объекта конкретно не определён.",
          "state_registration_clause_status": "not_defined",
          "real_estate_summary_display": "Дом и участок (Жуковка) -> продажа и раздел выручки 50/50 / Компенсация: не требуется",
          "evidence": [
            {
              "clause_ref": "п. 6.1",
              "quote": "Земельный участок и расположенный на нём жилой дом в дер. Жуковка (КН 50:20:0010203:45) при расторжении брака подлежат совместной продаже по рыночной стоимости."
            }
          ]
        }
        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Споры о разделе имущества супругов разрешаются в порядке, установленном законодательством РФ."
        Ответ:
        {
          "real_estate_objects_status": "not_defined",
          "real_estate_objects_details": "Данные не определены",
          "division_mechanism_code": "not_defined",
          "division_mechanism_details": "Данные не определены",
          "compensation_amount_status": "not_defined",
          "compensation_amount_details": "Данные не определены",
          "mortgage_encumbrance_status": "not_defined",
          "mortgage_encumbrance_details": "Данные не определены",
          "transfer_timeline_status": "not_defined",
          "transfer_timeline_details": "Данные не определены",
          "state_registration_clause_status": "not_defined",
          "real_estate_summary_display": "Раздел недвижимости при разводе не урегулирован",
          "evidence": []
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди перечень объектов недвижимости с кадастровыми номерами и адресами.
        2. Определи код механизма раздела (to_specific_spouse / proportional_shares / sale_and_split / compensation_based / mixed / not_defined).
        3. Проверь наличие и размер компенсации за долю в недвижимости.
        4. Проверь урегулирование ипотеки и залогов по объектам.
        5. Проверь сроки передачи объекта и перерегистрации в Росреестре.
        6. Сформируй компактный real_estate_summary_display.
        7. Если прямой цитаты нет — верни "not_defined". Не додумывай.
        8. Проверь, что все 13 ключей (12 полей + evidence) присутствуют в JSON.
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "real_estate_objects_status": "<defined / partial / not_defined>",
          "real_estate_objects_details": "<текст или 'Данные не определены'>",
          "division_mechanism_code": "<to_specific_spouse / proportional_shares / sale_and_split / compensation_based / mixed / not_defined>",
          "division_mechanism_details": "<текст или 'Данные не определены'>",
          "compensation_amount_status": "<defined / not_applicable / not_defined>",
          "compensation_amount_details": "<текст или 'Данные не определены'>",
          "mortgage_encumbrance_status": "<mortgaged_addressed / free_of_encumbrance / not_addressed / not_defined>",
          "mortgage_encumbrance_details": "<текст или 'Данные не определены'>",
          "transfer_timeline_status": "<defined / partial / not_defined>",
          "transfer_timeline_details": "<текст или 'Данные не определены'>",
          "state_registration_clause_status": "<defined / not_defined>",
          "real_estate_summary_display": "<компактная сводка>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 1000

    retrieval:
      retrieval_profile: "title_transfer_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "недвижимость квартира жилой дом земельный участок нежилое помещение кадастровый номер при расторжении брака переходит личная собственность раздельная собственность компенсация за долю ипотека ипотечный кредит Росреестр ЕГРН передача"
      boost_keywords:
        - "кадастровый"
        - "квартир"
        - "жилой дом"
        - "земельный участок"
        - "расторжении брака"
        - "компенсаци"
        - "Росреестр"
        - "ЕГРН"
        - "переходит в собственность"
      preferred_unit_types:
        - obligation
        - general_provision
        - title_transfer
        - payment_term
      excluded_unit_types:
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
        - rights
        - remedies
      negative_keywords:
        - "алименты на несовершеннолетних"
        - "алименты на детей"
        - "содержание ребенка"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.20, 0.85]
        boost: 0.30
        scope: file
      context_k: 8
      max_chunks: 12
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
        - "appendix"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
        - "rights"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 700

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1500

      compact_output: false

      presence_signal:
        field: "real_estate_division_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по семейному праву и сделкам с недвижимостью. Извлеки из брачного договора
        условия о разделе недвижимого имущества при расторжении брака (квартиры, жилые дома, земля, апартаменты),
        механизмах раздела, компенсационных выплатах, ипотечных обязательствах и сроках перерегистрации прав.
        Не анализируй алименты на детей или бизнес-активы (доли в ООО) — это темы других проверок.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 13 полей + evidence (всего 14 ключей):

        0. real_estate_division_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (real_estate_objects_status, division_mechanism_code,
              compensation_amount_status, mortgage_encumbrance_status)
             ≠ "not_defined";
           - "missing" — если все четыре содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - real_estate_objects_status = "not_defined";
           - division_mechanism_code = "not_defined";
           - compensation_amount_status = "not_defined";
           - mortgage_encumbrance_status = "not_defined";
           - все *_details = "Данные не определены";
           - real_estate_summary_display = "Раздел недвижимости при разводе не урегулирован";
           - не выполняй остальные шаги.

        1.  real_estate_objects_status — defined / partial / not_defined.
        2.  real_estate_objects_details — перечень конкретных объектов недвижимости (адреса, кадастровые номера).
        3.  division_mechanism_code — to_specific_spouse / proportional_shares / sale_and_split / compensation_based / mixed / not_defined.
        4.  division_mechanism_details — описание механизма раздела недвижимости при разводе.
        5.  compensation_amount_status — defined / not_applicable / not_defined.
        6.  compensation_amount_details — размер, валюта и условия выплаты компенсации за долю в недвижимости.
        7.  mortgage_encumbrance_status — mortgaged_addressed / free_of_encumbrance / not_addressed / not_defined.
        8.  mortgage_encumbrance_details — условия погашения ипотеки и снятия/переоформления залога.
        9.  transfer_timeline_status — defined / partial / not_defined.
        10. transfer_timeline_details — сроки фактической передачи объектов и государственной регистрации перехода права.
        11. state_registration_clause_status — defined / not_defined.
        12. real_estate_summary_display — компактная человекочитаемая сводка раздела недвижимости для DD Grid.
        13. evidence — массив прямых цитат из договора.

        Если данные полностью отсутствуют в тексте:
        - статус/код = "not_defined";
        - текстовое поле = "Данные не определены";
        - real_estate_summary_display = "Раздел недвижимости при разводе не урегулирован".
        </task>

        <context_rules>
        - Перед остальными полями заполни real_estate_division_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status/*_code = "not_defined", все *_details = "Данные не определены", real_estate_summary_display = "Раздел недвижимости при разводе не урегулирован".
        - Используй только текст договора.
        - division_mechanism_code:
            "to_specific_spouse" — объект переходит в единоличную личную/раздельную собственность одного супруга;
            "proportional_shares" — устанавливается долевая собственность (например, 1/2 или иные доли);
            "sale_and_split" — объект подлежит совместной продаже с разделом вырученных денег;
            "compensation_based" — один супруг сохраняет объект с обязательной денежной выплатой второму;
            "mixed" — для разных объектов предусмотрены разные механизмы;
            "not_defined" — механизм раздела недвижимости не определён.
        - compensation_amount_status:
            "defined" — денежная компенсация за недвижимость прямо зафиксирована (с суммой/порядком расчёта);
            "not_applicable" — компенсация не требуется по условиям сделки (например, при продаже 50/50 или взаимном зачёте);
            "not_defined" — условие о компенсации не раскрыто.
        - mortgage_encumbrance_status:
            "mortgaged_addressed" — объект обременён ипотекой, и в договоре прямо расписано, кто и как её погашает;
            "free_of_encumbrance" — в договоре прямо указано, что недвижимость свободна от залогов/ипотеки;
            "not_addressed" — вопрос об обременениях по конкретному объекту не затронут;
            "not_defined" — данные отсутствуют.
        - state_registration_clause_status:
            "defined" — прямо оговорена обязанность сторон по совершению действий для регистрации перехода прав в ЕГРН (Росреестре);
            "not_defined" — о перерегистрации в Росреестре не сказано.
        - real_estate_summary_display формируется как строка вида:
            "<Объект(ы)> -> <кому переходит/продажа> / Компенсация: <сумма или 'нет'> / Ипотека: <статус>".
        - Значение каждого enum-поля — строго из списка allowed_values.
        - Верни только один JSON-объект.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни упоминаний объектов недвижимости, ни механизмов их раздела.
           → presence = "missing";
             все *_status/*_code = "not_defined";
             все *_details = "Данные не определены";
             real_estate_summary_display = "Раздел недвижимости при разводе не урегулирован".

        2. Частичное раскрытие.
           Объект недвижимости идентифицирован, но не указан механизм раздела или
           не урегулированы ипотечные обязательства.
           → presence = "present";
             соответствующие *_status = "partial" или "not_defined";
             *_details содержит описание пробелов.

        3. Противоречие между фрагментами.
           В одном месте указано, что квартира переходит одному супругу,
           в другом — что она подлежит совместной продаже.
           → presence = "unclear";
             division_mechanism_code = "not_defined";
             division_mechanism_details = "Не удалось определить".

        4. Ипотека без урегулирования.
           Объект находится в ипотеке, но договор не содержит условий о том,
           кто и как будет погашать кредит или переоформлять залог.
           → presence = "present";
             mortgage_encumbrance_status = "not_addressed";
             mortgage_encumbrance_details = "Данные не определены".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для real_estate_division_check_presence используй только: "present", "missing", "unclear".
        - Для real_estate_objects_status, transfer_timeline_status используй только: "defined", "partial", "not_defined".
        - Для division_mechanism_code используй только: "to_specific_spouse", "proportional_shares", "sale_and_split", "compensation_based", "mixed", "not_defined".
        - Для compensation_amount_status используй только: "defined", "not_applicable", "not_defined".
        - Для mortgage_encumbrance_status используй только: "mortgaged_addressed", "free_of_encumbrance", "not_addressed", "not_defined".
        - Для state_registration_clause_status используй только: "defined", "not_defined".
        - Fallback при отсутствии данных:
          * *_details → "Данные не определены";
          * real_estate_summary_display → "Раздел недвижимости при разводе не урегулирован".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "real_estate_division_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования раздела недвижимости. Внутреннее агрегатное signal-поле."
          required: true

        - name: "real_estate_objects_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "partial", "not_defined"]
          description: "Статус идентификации объектов недвижимости по договору."
          required: true
        - name: "real_estate_objects_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Объекты недвижимости"
          description: "Перечень объектов недвижимости с адресами и кадастровыми номерами."
          required: true
        - name: "division_mechanism_code"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["to_specific_spouse", "proportional_shares", "sale_and_split", "compensation_based", "mixed", "not_defined"]
          description: "Юридический механизм распределения недвижимости при расторжении брака."
          required: true
        - name: "division_mechanism_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Механизм раздела"
          description: "Порядок перехода недвижимости (одному супругу, выдел долей, совместная продажа)."
          required: true
        - name: "compensation_amount_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_applicable", "not_defined"]
          description: "Статус урегулированности компенсационных выплат за отказ от доли в недвижимости."
          required: true
        - name: "compensation_amount_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Компенсация за недвижимость"
          description: "Размер, валюта и порядок выплаты компенсации за отказ от прав на недвижимое имущество."
          required: false
        - name: "mortgage_encumbrance_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["mortgaged_addressed", "free_of_encumbrance", "not_addressed", "not_defined"]
          description: "Статус распределения ипотечных обязательств и обременений по передаваемой недвижимости."
          required: true
        - name: "mortgage_encumbrance_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Ипотека и обременения недвижимости"
          description: "Условия погашения ипотеки, переоформления залога и согласия банка-залогодержателя."
          required: false
        - name: "transfer_timeline_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "partial", "not_defined"]
          description: "Статус определения сроков фактической передачи и перерегистрации прав."
          required: true
        - name: "transfer_timeline_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Сроки передачи и регистрации"
          description: "Сроки освобождения объекта, подписания передаточного акта и регистрации в Росреестре."
          required: true
        - name: "state_registration_clause_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус наличия оговорки об обязанности регистрации перехода прав в Росреестре (218-ФЗ)."
          required: true
        - name: "real_estate_summary_display"
          type: "string"
          presentation: "summary"
          display_in_grid: true
          display_priority: 4
          label: "Раздел недвижимости"
          description: "Компактная сводка порядка раздела объектов недвижимости для отображения в DD Grid."
          required: true

      store_payload: true

  - id: prohibited_conditions_check
    name: "Запрещённые условия: неимущественные отношения, дети, правоспособность (ст. 42 СК РФ)"
    description: >
      Фактографическая проверка отсутствия в брачном договоре условий, прямо запрещённых
      п. 3 ст. 42 СК РФ, ст. 22, 168, 1118 ГК РФ, ст. 3 ГПК РФ: регулирование личных
      неимущественных отношений, санкции за неверность/измену, определение прав и обязанностей
      в отношении детей (место жительства, воспитание, алименты на детей), ограничение
      правоспособности или дееспособности (запрет на труд, выбор профессии), отказ от права
      на судебную защиту, а также распоряжения имуществом на случай смерти (подмена завещания).
      Включение любых из указанных условий влечёт их ничтожность в силу закона.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 100

    rules:
      keywords:
        - "супружеская верность"
        - "измена"
        - "супружеская измена"
        - "неверность"
        - "любовь"
        - "уважение"
        - "личные отношения"
        - "интимные отношения"
        - "воспитание детей"
        - "место жительства ребёнка"
        - "место жительства детей"
        - "порядок общения с детьми"
        - "содержание детей"
        - "алименты на ребенка"
        - "выбор фамилии"
        - "выбор профессии"
        - "место жительства супруга"
        - "ограничивает правоспособность"
        - "ограничивает дееспособность"
        - "запрещается работать"
        - "обязан не работать"
        - "не имеет права заниматься предпринимательской"
        - "запрещается обращаться в суд"
        - "не вправе обращаться в суд"
        - "отказ от обращения в суд"
        - "в случае смерти одного из супругов"
        - "переходит по наследству"
        - "вместо завещания"
      keyword_mode: "any"
      negative_keywords:
        - "в целях настоящего"
      regex_patterns:
        - "(?i)(супружеск(ая|ой)\\s+верност|измен(а|ы|е)|неверност)"
        - "(?i)(воспитани(е|я)|мест(о|а)\\s+жительств(а|о)|общени(е|я)\\s+с)\\s+дет(ьми|ей|я)"
        - "(?i)запрещается\\s+(работать|трудиться|заниматься|выезжать)"
        - "(?i)не\\s+(имеет\\s+права|вправе)\\s+(обращаться\\s+в\\s+суд|работать|трудиться)"
        - "(?i)отказ\\s+от\\s+(судебной\\s+защиты|права\\s+на\\s+обращение\\s+в\\s+суд)"
        - "(?i)в\\s+случае\\s+смерти[^\\.]{0,50}(наследует|переходит\\s+в\\s+собственность)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по семейному праву.
        Анализируется брачный договор (ст. 40, п. 3 ст. 42, п. 2 ст. 44 СК РФ; ст. 22, 168, 1118 ГК РФ; ст. 3 ГПК РФ).
        Проверяется только один вопрос: выявление ничтожных условий, прямо запрещённых к включению в брачный договор.
        Императивные запреты п. 3 ст. 42 СК РФ:
        1. Брачный договор не может регулировать личные неимущественные отношения супругов (верность, интимная сфера, поведение).
        2. Брачный договор не может содержать штрафов и санкций за супружескую неверность/измену (infidelity clauses).
        3. Брачный договор не может определять права и обязанности в отношении детей (место жительства, порядок общения, воспитание, алименты на детей).
        4. Брачный договор не может ограничивать правоспособность или дееспособность (запрет на работу, выбор профессии, ведение бизнеса, свободу передвижения).
        5. Брачный договор не может ограничивать право на обращение в суд за защитой своих прав.
        6. Брачный договор не может содержать положений на случай смерти супруга (распоряжений mortis causa, заменяющих завещание).
        Важно:
        - Твоя задача — только фактографически установить, есть ли такие оговорки в тексте договора.
        - Не оценивай моральную сторону условий.
        - Не анализируй законные имущественные режимы, алименты на супруга или ипотеку — это темы других проверок.
        [ЗАДАЧА]
        Найди в тексте договора:
        1. Условия о личных неимущественных отношениях.
        2. Санкции за супружескую неверность (измену) или моральное поведение.
        3. Условия о правах, месте жительства, воспитании и алиментах на детей.
        4. Ограничения правоспособности, дееспособности, права на труд и бизнес.
        5. Ограничение права на судебную защиту.
        6. Распоряжения имуществом на случай смерти (подмена завещания).
        7. Сформируй итоговый флаг нарушения и компактную сводку prohibited_conditions_summary_display.
        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если запрещённое условие выявлено — статус = "prohibited_detected", в details приведи формулировку.
        3. Если проверено и условий нет — статус = "none", текстовое поле = "Запрещённых условий не выявлено".
        4. Если тема вообще не затронута — статус = "not_defined", текстовое поле = "Данные не определены".
        5. Не используй "None", "null" или пустые строки.
        6. В evidence включай только текст договора.
        7. Значение каждого enum-поля — строго из списка allowed_values.
        8. Верни РОВНО один валидный JSON-объект со всеми 13 ключами,
           пригодный для парсинга через json.loads без предварительной обработки.
           Без markdown, без ```json, без комментариев, без текста до или после.
           Начни ответ сразу с { и закончи }.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — выявлен букет запрещённых условий (ничтожные оговорки):
        Фрагмент:
        "п. 8.1. Супруги обязуются сохранять взаимную супружескую верность и уважение.
        п. 8.2. В случае установления факта супружеской измены виновный супруг лишается права
        на долю в общем имуществе и выплачивает штраф в размере 3 000 000 рублей.
        п. 8.3. В случае расторжения брака несовершеннолетний сын проживает с Супругой,
        а Супруг обязуется выплачивать алименты на его содержание в размере 50 000 руб./мес.
        п. 8.4. Супруга обязуется не осуществлять трудовую деятельность и не обращаться в суд
        с исками об изменении условий настоящего договора."
        Ответ:
        {
          "prohibited_conditions_detected": "violation_found",
          "personal_nonproperty_status": "prohibited_detected",
          "personal_nonproperty_details": "Обязанность сохранять взаимную верность и уважение (п. 8.1).",
          "infidelity_penalty_status": "prohibited_detected",
          "infidelity_penalty_details": "Штраф 3 млн руб. и лишение имущества за факт супружеской измены (п. 8.2).",
          "children_provisions_status": "prohibited_detected",
          "children_provisions_details": "Определение места жительства ребёнка и алиментов на несовершеннолетнего (п. 8.3).",
          "capacity_restriction_status": "prohibited_detected",
          "capacity_restriction_details": "Запрет на трудовую деятельность и отказ от права на обращение в суд (п. 8.4).",
          "mortis_causa_status": "none",
          "mortis_causa_details": "Запрещённых условий не выявлено",
          "prohibited_conditions_summary_display": "НИЧТОЖНЫЕ УСЛОВИЯ: штраф за измену + условия о детях + запрет на труд и обращение в суд",
          "evidence": [
            {
              "clause_ref": "п. 8.2",
              "quote": "В случае установления факта супружеской измены виновный супруг лишается права на долю в общем имуществе и выплачивает штраф в размере 3 000 000 рублей."
            },
            {
              "clause_ref": "п. 8.3",
              "quote": "В случае расторжения брака несовершеннолетний сын проживает с Супругой, а Супруг обязуется выплачивать алименты на его содержание."
            },
            {
              "clause_ref": "п. 8.4",
              "quote": "Супруга обязуется не осуществлять трудовую деятельность и не обращаться в суд с исками об изменении условий настоящего договора."
            }
          ]
        }
        Пример 2 — чистый законный договор (запрещённых условий нет):
        Фрагмент:
        "п. 2.1. Имущество, нажитое супругами в период брака, поступает в раздельную собственность
        того из супругов, на чьё имя оно оформлено или зарегистрировано.
        п. 2.2. Расходы по содержанию имущества несёт собственник соответствующего объекта."
        Ответ:
        {
          "prohibited_conditions_detected": "clean",
          "personal_nonproperty_status": "none",
          "personal_nonproperty_details": "Запрещённых условий не выявлено",
          "infidelity_penalty_status": "none",
          "infidelity_penalty_details": "Запрещённых условий не выявлено",
          "children_provisions_status": "none",
          "children_provisions_details": "Запрещённых условий не выявлено",
          "capacity_restriction_status": "none",
          "capacity_restriction_details": "Запрещённых условий не выявлено",
          "mortis_causa_status": "none",
          "mortis_causa_details": "Запрещённых условий не выявлено",
          "prohibited_conditions_summary_display": "Запрещённые ст. 42 СК РФ условия отсутствуют (договор соответствует закону)",
          "evidence": []
        }
        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Стороны договорились руководствоваться общими нормами Гражданского кодекса РФ."
        Ответ:
        {
          "prohibited_conditions_detected": "not_defined",
          "personal_nonproperty_status": "not_defined",
          "personal_nonproperty_details": "Данные не определены",
          "infidelity_penalty_status": "not_defined",
          "infidelity_penalty_details": "Данные не определены",
          "children_provisions_status": "not_defined",
          "children_provisions_details": "Данные не определены",
          "capacity_restriction_status": "not_defined",
          "capacity_restriction_details": "Данные не определены",
          "mortis_causa_status": "not_defined",
          "mortis_causa_details": "Данные не определены",
          "prohibited_conditions_summary_display": "Данные о наличии или отсутствии запрещённых условий не определены",
          "evidence": []
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Проверь наличие условий о личных неимущественных правах и морали (personal_nonproperty_status).
        2. Проверь санкции и штрафы за супружескую измену/неверность (infidelity_penalty_status).
        3. Проверь условия о детях (место жительства, порядок общения, воспитание, алименты на детей) (children_provisions_status).
        4. Проверь ограничения правоспособности, дееспособности, права на труд и суд (capacity_restriction_status).
        5. Проверь распоряжения на случай смерти (mortis_causa_status).
        6. Определи общий статус prohibited_conditions_detected (violation_found / clean / not_defined).
        7. Сформируй компактный prohibited_conditions_summary_display.
        8. Если прямой цитаты нет — верни "none" или "not_defined". Не додумывай.
        9. Проверь, что все 13 ключей (12 полей + evidence) присутствуют в JSON.
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "prohibited_conditions_detected": "<violation_found / clean / not_defined>",
          "personal_nonproperty_status": "<prohibited_detected / none / not_defined>",
          "personal_nonproperty_details": "<текст или 'Запрещённых условий не выявлено' или 'Данные не определены'>",
          "infidelity_penalty_status": "<prohibited_detected / none / not_defined>",
          "infidelity_penalty_details": "<текст или 'Запрещённых условий не выявлено' или 'Данные не определены'>",
          "children_provisions_status": "<prohibited_detected / none / not_defined>",
          "children_provisions_details": "<текст или 'Запрещённых условий не выявлено' или 'Данные не определены'>",
          "capacity_restriction_status": "<prohibited_detected / none / not_defined>",
          "capacity_restriction_details": "<текст или 'Запрещённых условий не выявлено' или 'Данные не определены'>",
          "mortis_causa_status": "<prohibited_detected / none / not_defined>",
          "mortis_causa_details": "<текст или 'Запрещённых условий не выявлено' или 'Данные не определены'>",
          "prohibited_conditions_summary_display": "<компактная сводка>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 1000

    retrieval:
      retrieval_profile: "warranties_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "супружеская верность измена неверность воспитание детей место жительства ребенка порядок общения с детьми выбор профессии запрещается работать не вправе обращаться в суд отказ от судебной защиты в случае смерти наследует ст. 42 СК РФ"
      boost_keywords:
        - "верност"
        - "измен"
        - "неверност"
        - "место жительства ребенка"
        - "воспитание детей"
        - "запрещается работать"
        - "обращаться в суд"
        - "в случае смерти"
      preferred_unit_types:
        - obligation
        - general_provision
        - liability_provision
        - representations
      excluded_unit_types:
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - limitations
        - boilerplate
      negative_keywords:
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.10, 0.95]
        boost: 0.30
        scope: file
      context_k: 8
      max_chunks: 12
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "limitations"
        - "boilerplate"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 700

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1500

      compact_output: false

      presence_signal:
        field: "prohibited_conditions_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по семейному праву. Извлеки из брачного договора
        условия, нарушающие прямые императивные запреты п. 3 ст. 42 СК РФ, ст. 22, 168, 1118 ГК РФ,
        ст. 3 ГПК РФ: личные неимущественные отношения, штрафы за измену, условия о детях,
        ограничение правоспособности/дееспособности, отказ от права на суд и распоряжения на случай смерти.
        Не анализируй законный имущественный режим, алименты на супругов или ипотеку.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 13 полей + evidence (всего 14 ключей):

        0. prohibited_conditions_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если поле prohibited_conditions_detected ≠ "not_defined"
             (т.е. договор проверен и статус "violation_found" или "clean" установлен);
           - "missing" — если prohibited_conditions_detected = "not_defined"
             (данных для проверки нет);
           - "unclear" — если фрагменты есть, но из-за противоречий вывод невозможен.

           Если presence = "missing":
           - prohibited_conditions_detected = "not_defined";
           - все *_status = "not_defined";
           - все *_details = "Данные не определены";
           - prohibited_conditions_summary_display = "Данные о наличии или отсутствии запрещённых условий не определены";
           - не выполняй остальные шаги.

        1.  prohibited_conditions_detected — violation_found / clean / not_defined.
        2.  personal_nonproperty_status — prohibited_detected / none / not_defined.
        3.  personal_nonproperty_details — условия о личных неимущественных отношениях (верность, мораль, интимная жизнь).
        4.  infidelity_penalty_status — prohibited_detected / none / not_defined.
        5.  infidelity_penalty_details — санкции, штрафы или лишение имущества за факт супружеской измены/неверности.
        6.  children_provisions_status — prohibited_detected / none / not_defined.
        7.  children_provisions_details — условия о детях (место жительства, общение, воспитание, алименты на детей).
        8.  capacity_restriction_status — prohibited_detected / none / not_defined.
        9.  capacity_restriction_details — ограничения правоспособности, дееспособности, права на труд, выбор профессии и суд.
        10. mortis_causa_status — prohibited_detected / none / not_defined.
        11. mortis_causa_details — распоряжения имуществом на случай смерти (подмена завещания / наследственного договора).
        12. prohibited_conditions_summary_display — компактная человекочитаемая сводка о наличии ничтожных условий для DD Grid.
        13. evidence — массив прямых цитат из договора.

        Если данные полностью отсутствуют в тексте:
        - статус/код = "not_defined";
        - текстовое поле = "Данные не определены";
        - prohibited_conditions_summary_display = "Данные о наличии или отсутствии запрещённых условий не определены".
        </task>

        <context_rules>
        - Перед остальными полями заполни prohibited_conditions_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — prohibited_conditions_detected = "not_defined", все *_status = "not_defined", все *_details = "Данные не определены", prohibited_conditions_summary_display = "Данные о наличии или отсутствии запрещённых условий не определены".
        - Используй только текст договора.
        - prohibited_conditions_detected:
            "violation_found" — в договоре обнаружено хотя бы одно запрещённое законом условие;
            "clean" — договор проверен, запрещённых условий не обнаружено;
            "not_defined" — данных недостаточно для вывода.
        - personal_nonproperty_status:
            "prohibited_detected" — включены пункты о любви, уважении, интимной жизни, распределении домашних обязанностей;
            "none" — таких пунктов нет;
            "not_defined" — не определено.
        - infidelity_penalty_status:
            "prohibited_detected" — включены штрафы, неустойки или лишение имущества при супружеской измене;
            "none" — штрафов за измену нет;
            "not_defined" — не определено.
        - children_provisions_status:
            "prohibited_detected" — договор определяет судьбу детей, порядок общения, место жительства или алименты на несовершеннолетних;
            "none" — положений о детях нет (соответствует закону);
            "not_defined" — не определено.
        - capacity_restriction_status:
            "prohibited_detected" — включены запреты на работу, бизнес, ограничение права на обращение в суд;
            "none" — ограничений правоспособности нет;
            "not_defined" — не определено.
        - mortis_causa_status:
            "prohibited_detected" — включены распоряжения имуществом на случай смерти супруга (подмена завещания);
            "none" — распоряжений на случай смерти нет;
            "not_defined" — не определено.
        - prohibited_conditions_summary_display формируется как строка вида:
            "<Статус чистоты>: <перечень выявленных нарушений или 'Запрещённые ст. 42 СК РФ условия отсутствуют'>".
        - Значение каждого enum-поля — строго из списка allowed_values.
        - Верни только один JSON-объект.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие запрещённых условий (чистый договор).
           В тексте нет ни упоминаний личных неимущественных отношений, ни штрафов,
           ни условий о детях или ограничениях прав.
           → presence = "present";
             prohibited_conditions_detected = "clean";
             все *_status = "none";
             все *_details = "Запрещённых условий не выявлено".

        2. Выявление запрещённого условия (ничтожная оговорка).
           Договор содержит прямой штраф за супружескую измену или условия о детях.
           → presence = "present";
             prohibited_conditions_detected = "violation_found";
             соответствующий *_status = "prohibited_detected";
             prohibited_conditions_summary_display содержит маркер "НИЧТОЖНЫЕ УСЛОВИЯ".

        3. Противоречие между фрагментами.
           В одном месте указано, что супруги не имеют претензий друг к другу,
           в другом — вводится штраф за нарушение условий договора.
           → presence = "unclear";
             prohibited_conditions_detected = "not_defined";
             prohibited_conditions_summary_display = "Не удалось определить".

        4. Неопределённость / отсутствие данных для проверки.
           Текст договора крайне краток или не содержит проверяемых условий,
           и невозможно сделать вывод о наличии или отсутствии запретов.
           → presence = "missing";
             prohibited_conditions_detected = "not_defined";
             prohibited_conditions_summary_display = "Данные о наличии или отсутствии запрещённых условий не определены".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для prohibited_conditions_check_presence используй только: "present", "missing", "unclear".
        - Для prohibited_conditions_detected используй только: "violation_found", "clean", "not_defined".
        - Для personal_nonproperty_status, infidelity_penalty_status, children_provisions_status, capacity_restriction_status, mortis_causa_status используй только: "prohibited_detected", "none", "not_defined".
        - Fallback при отсутствии данных:
          * *_details → "Данные не определены";
          * prohibited_conditions_summary_display → "Данные о наличии или отсутствии запрещённых условий не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "prohibited_conditions_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования проверки на запрещённые условия. Внутреннее агрегатное signal-поле."
          required: true

        - name: "prohibited_conditions_detected"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["violation_found", "clean", "not_defined"]
          description: "Общий статус чистоты брачного договора от ничтожных условий (ст. 42 п. 3 СК РФ)."
          required: true
        - name: "prohibited_conditions_summary_display"
          type: "string"
