    description: >
      Фактографическая проверка идентификации сторон брачного договора,
      статуса отношений (до брака / в браке), гражданства и дееспособности сторон,
      нотариального удостоверения (ст. 41 СК РФ) и момента вступления договора в силу.
      Несоблюдение нотариальной формы влечёт ничтожность договора (ст. 41 п.2 СК РФ,
      ст. 165 ГК РФ). Наличие иностранного элемента активирует ст. 161 СК РФ
      о применимом праве.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 10

    rules:
      keywords:
        - "супруг"
        - "супруга"
        - "лицо, вступающее в брак"
        - "лица, вступающие в брак"
        - "муж"
        - "жена"
        - "паспорт"
        - "гражданин"
        - "гражданка"
        - "гражданство"
        - "зарегистрирован брак"
        - "состоят в браке"
        - "свидетельство о заключении брака"
        - "свидетельство о браке"
        - "актовая запись"
        - "нотариальное удостоверение"
        - "нотариус"
        - "удостоверено нотариусом"
        - "удостоверительная надпись"
        - "реестр нотариальных действий"
        - "вступает в силу"
        - "с момента регистрации брака"
        - "с момента нотариального удостоверения"
        - "с даты подписания"
        - "дееспособ"
        - "попечител"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)паспорт[^\\d]{0,20}\\d{2}\\s*\\d{2}[^\\d]{0,10}\\d{6}"
        - "(?i)(супруг|супруга|муж|жена)\\s*[-—:]"
        - "(?i)свидетельств(о|а)\\s+о\\s+(заключении|регистрации)\\s+брака"
        - "(?i)удостоверен(о|а)\\s+нотариусом"
        - "(?i)нотариальн(ое|ого|ым)\\s+удостоверен"
        - "(?i)реестр(а|е)?\\s+(нотариальн|за\\s+№)"
        - "(?i)вступает\\s+в\\s+силу\\s+(с\\s+момента|со\\s+дня|с\\s+даты)"
        - "(?i)гражданств(о|а)\\s+(российск|иностранн|\\w+)"
        - "(?i)(полн|огранич)\\w*\\s+дееспособн"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по семейному праву.
        Анализируется брачный договор (Глава 8 СК РФ, ст. 40, 41).
        Проверяется только один вопрос: идентификация сторон, их правовой статус
        (гражданство, дееспособность), статус отношений (до брака / в браке),
        нотариальное удостоверение и момент вступления договора в силу.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Не анализируй режим собственности, алименты, раздел имущества, банкротство.
        [ЗАДАЧА]
        Найди в тексте договора:
        1. ФИО и паспортные данные первого супруга.
        2. ФИО и паспортные данные второго супруга.
        3. Гражданство первого и второго супруга (иностранный элемент).
        4. Указания на дееспособность сторон или её ограничения.
        5. Статус отношений на момент заключения (до брака / в браке).
        6. Дату и номер свидетельства о браке (если брак заключён).
        7. Наличие нотариального удостоверения, ФИО нотариуса, номер в реестре.
        8. Момент вступления договора в силу.
        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если данные указаны частично (например, ФИО есть, а паспорта нет) —
           статус = "partial", в текстовом поле опиши, что известно и что отсутствует.
        3. Если данные полностью не указаны — статус = "not_defined",
           текстовое поле = "Данные не определены".
        4. Не используй "None", "null" или пустые строки.
        5. В evidence включай только текст договора.
        6. Значение каждого enum-поля — строго из списка allowed_values.
        7. Верни РОВНО один валидный JSON-объект со всеми 19 ключами,
           пригодный для парсинга через json.loads без предварительной обработки.
           Без markdown, без ```json, без комментариев, без текста до или после.
           Начни ответ сразу с { и закончи }.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — данные определены (до брака):
        Фрагмент:
        "Иванов Иван Иванович, гражданин Российской Федерации, паспорт 45 00 № 123456,
        и Петрова Мария Сергеевна, гражданка Российской Федерации, паспорт 45 01 № 654321,
        полностью дееспособные, вступающие в брак, заключили настоящий брачный договор.
        Договор вступает в силу с момента государственной регистрации брака.
        Удостоверено нотариусом г. Москвы Сидоровой А.Б., реестр № 77/123-н/77-2024-1-456."
        Ответ:
        {
          "spouse_1_name_status": "defined",
          "spouse_1_name_value": "Иванов Иван Иванович, паспорт 45 00 № 123456",
          "spouse_2_name_status": "defined",
          "spouse_2_name_value": "Петрова Мария Сергеевна, паспорт 45 01 № 654321",
          "foreign_element_status": "no_foreign_element",
          "foreign_element_details": "Оба супруга — граждане Российской Федерации",
          "legal_capacity_status": "confirmed",
          "marital_status": "before_marriage",
          "marriage_registration_status": "not_applicable",
          "marriage_registration_details": "Брак ещё не зарегистрирован (prenuptial)",
          "notarial_status": "certified",
          "notarial_form_display": "Удостоверено нотариально",
          "notary_name_status": "defined",
          "notary_name_value": "нотариус г. Москвы Сидорова А.Б.",
          "registry_number_status": "defined",
          "registry_number_value": "реестр № 77/123-н/77-2024-1-456",
          "effective_date_status": "defined",
          "effective_date_details": "С момента государственной регистрации брака",
          "evidence": [
            {
              "clause_ref": "преамбула",
              "quote": "Иванов Иван Иванович, гражданин Российской Федерации, паспорт 45 00 № 123456, и Петрова Мария Сергеевна, гражданка Российской Федерации, паспорт 45 01 № 654321, полностью дееспособные, вступающие в брак, заключили настоящий брачный договор."
            },
            {
              "clause_ref": "удостоверительная надпись",
              "quote": "Удостоверено нотариусом г. Москвы Сидоровой А.Б., реестр № 77/123-н/77-2024-1-456."
            }
          ]
        }
        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Настоящий договор заключён между сторонами."
        Ответ:
        {
          "spouse_1_name_status": "not_defined",
          "spouse_1_name_value": "Данные не определены",
          "spouse_2_name_status": "not_defined",
          "spouse_2_name_value": "Данные не определены",
          "foreign_element_status": "not_defined",
          "foreign_element_details": "Данные не определены",
          "legal_capacity_status": "not_defined",
          "marital_status": "not_defined",
          "marriage_registration_status": "not_defined",
          "marriage_registration_details": "Данные не определены",
          "notarial_status": "not_defined",
          "notarial_form_display": "Не указано",
          "notary_name_status": "not_defined",
          "notary_name_value": "Данные не определены",
          "registry_number_status": "not_defined",
          "registry_number_value": "Данные не определены",
          "effective_date_status": "not_defined",
          "effective_date_details": "Данные не определены",
          "evidence": []
        }
        Пример 3 — частичные данные (в браке, иностранный элемент):
        Фрагмент:
        "Смирнов Пётр Алексеевич, гражданин РФ, и Мюллер Анна, гражданка Германии,
        состоящие в зарегистрированном браке, паспорта сторон установлены.
        Настоящий договор подлежит нотариальному удостоверению."
        Ответ:
        {
          "spouse_1_name_status": "partial",
          "spouse_1_name_value": "Смирнов Пётр Алексеевич (паспортные данные не приведены в тексте)",
          "spouse_2_name_status": "partial",
          "spouse_2_name_value": "Мюллер Анна (паспортные данные не приведены в тексте)",
          "foreign_element_status": "foreign_element_present",
          "foreign_element_details": "Супруг 2 — гражданка Германии; применимо ст. 161 СК РФ",
          "legal_capacity_status": "not_defined",
          "marital_status": "during_marriage",
          "marriage_registration_status": "defined_no_details",
          "marriage_registration_details": "Указано, что стороны состоят в браке, реквизиты свидетельства не приведены",
          "notarial_status": "mentioned",
          "notarial_form_display": "Указано, но без подтверждения удостоверения",
          "notary_name_status": "not_defined",
          "notary_name_value": "Данные не определены",
          "registry_number_status": "not_defined",
          "registry_number_value": "Данные не определены",
          "effective_date_status": "not_defined",
          "effective_date_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "преамбула",
              "quote": "Смирнов Пётр Алексеевич, гражданин РФ, и Мюллер Анна, гражданка Германии, состоящие в зарегистрированном браке."
            }
          ]
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату с ФИО первого супруга и его паспортом.
        2. Найди прямую цитату с ФИО второго супруга и его паспортом.
        3. Определи гражданство сторон — есть ли иностранный элемент.
        4. Проверь упоминание дееспособности или её ограничений.
        5. Определи статус отношений (до брака / в браке) по прямому тексту.
        6. Найди прямую цитату о нотариальном удостоверении и различай:
           - "certified" — есть удостоверительная надпись с реквизитами;
           - "mentioned" — только упоминание, что договор "подлежит удостоверению".
        7. Найди прямую цитату о моменте вступления в силу.
        8. Если прямой цитаты нет — верни "not_defined". Не додумывай.
        9. Проверь, что все 19 ключей (18 полей + evidence) присутствуют в JSON.
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "spouse_1_name_status": "<defined / partial / not_defined>",
          "spouse_1_name_value": "<ФИО и паспорт или описание пробелов или 'Данные не определены'>",
          "spouse_2_name_status": "<defined / partial / not_defined>",
          "spouse_2_name_value": "<ФИО и паспорт или описание пробелов или 'Данные не определены'>",
          "foreign_element_status": "<no_foreign_element / foreign_element_present / not_defined>",
          "foreign_element_details": "<описание гражданства или 'Данные не определены'>",
          "legal_capacity_status": "<confirmed / limitations_mentioned / not_defined>",
          "marital_status": "<before_marriage / during_marriage / not_defined>",
          "marriage_registration_status": "<defined_with_details / defined_no_details / not_applicable / not_defined>",
          "marriage_registration_details": "<описание или 'Данные не определены'>",
          "notarial_status": "<certified / mentioned / not_defined>",
          "notarial_form_display": "<Удостоверено нотариально / Указано, но без подтверждения удостоверения / Не указано>",
          "notary_name_status": "<defined / not_defined>",
          "notary_name_value": "<ФИО нотариуса или 'Данные не определены'>",
          "registry_number_status": "<defined / not_defined>",
          "registry_number_value": "<номер или 'Данные не определены'>",
          "effective_date_status": "<defined / not_defined>",
          "effective_date_details": "<момент вступления или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 900

    retrieval:
      retrieval_profile: "party_identification_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "супруг супруга муж жена лицо вступающее в брак паспорт гражданин гражданство дееспособность свидетельство о заключении брака нотариальное удостоверение нотариус реестр нотариальных действий вступает в силу с момента регистрации брака с момента нотариального удостоверения заключительные положения"
      boost_keywords:
        - "вступает в силу"
        - "с момента"
        - "заключительные положения"
        - "удостоверено нотариусом"
        - "реестр"
        - "гражданство"
        - "дееспособ"
      preferred_unit_types:
        - obligation
        - general_provision
        - representations
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - representations
        - boilerplate
      negative_keywords:
        - "режим собственности"
        - "совместная собственность"
        - "раздельная собственность"
        - "долевая собственность"
        - "имущество нажитое в браке"
        - "алименты"
        - "содержание супруга"
        - "недвижимость"
        - "ипотека"
        - "банкротство"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 0.20]
        boost: 0.35
        scope: file
      context_k: 8
      max_chunks: 12
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "representations"
        - "boilerplate"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.15

    evidence:
      required: true
      min_snippet_length: 50
      max_snippet_length: 800

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 1800

      presence_signal:
        field: "parties_notarial_effective_date_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по семейному праву. Извлеки из брачного договора
        сведения о сторонах (ФИО, паспорт, гражданство, дееспособность),
        статусе отношений, нотариальном удостоверении и моменте вступления в силу.
        Не анализируй режим собственности, алименты, раздел имущества или банкротство —
        это темы других проверок.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 19 полей + evidence (всего 20 ключей):

        0. parties_notarial_effective_date_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (spouse_1_name_status, spouse_2_name_status, notarial_status,
              effective_date_status) ≠ "not_defined";
           - "missing" — если все четыре содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - spouse_1_name_status = "not_defined";
           - spouse_2_name_status = "not_defined";
           - notarial_status = "not_defined";
           - effective_date_status = "not_defined";
           - все *_value/*_details/*_display = соответствующий fallback;
           - не выполняй остальные шаги.

        1.  spouse_1_name_status — defined / partial / not_defined.
        2.  spouse_1_name_value — ФИО и паспорт первого супруга; при partial —
            опиши, что есть и что отсутствует.
        3.  spouse_2_name_status — defined / partial / not_defined.
        4.  spouse_2_name_value — ФИО и паспорт второго супруга; при partial —
            опиши, что есть и что отсутствует.
        5.  foreign_element_status — no_foreign_element / foreign_element_present /
            not_defined.
        6.  foreign_element_details — описание гражданства сторон и наличия
            иностранного элемента.
        7.  legal_capacity_status — confirmed / limitations_mentioned / not_defined.
        8.  marital_status — before_marriage / during_marriage / not_defined.
        9.  marriage_registration_status — defined_with_details / defined_no_details /
            not_applicable / not_defined.
        10. marriage_registration_details — описание реквизитов свидетельства о браке
            или причины not_applicable.
        11. notarial_status — certified / mentioned / not_defined.
        12. notarial_form_display — человекочитаемая формулировка формы:
            "Удостоверено нотариально" / "Указано, но без подтверждения удостоверения" /
            "Не указано".
        13. notary_name_status — defined / not_defined.
        14. notary_name_value — ФИО и место нахождения нотариуса.
        15. registry_number_status — defined / not_defined.
        16. registry_number_value — номер в реестре нотариальных действий.
        17. effective_date_status — defined / not_defined.
        18. effective_date_details — момент вступления договора в силу.
        19. evidence — массив прямых цитат из договора.

        Если данные полностью отсутствуют в тексте:
        - статус = "not_defined";
        - текстовое поле = "Данные не определены";
        - notarial_form_display = "Не указано".
        </task>

        <context_rules>
        - Перед остальными полями заполни parties_notarial_effective_date_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_value/*_details/*_display = соответствующий fallback.
        - Используй только текст договора.
        - marital_status:
            "before_marriage" — если прямо указано, что стороны вступают в брак
              (prenuptial);
            "during_marriage" — если прямо указано, что стороны состоят
              в зарегистрированном браке (postnuptial);
            "not_defined" — если статус прямо не указан.
        - marriage_registration_status:
            "defined_with_details" — указаны реквизиты свидетельства о браке
              (дата, номер, орган ЗАГС);
            "defined_no_details" — упомянуто, что стороны состоят в браке,
              но реквизиты не приведены;
            "not_applicable" — стороны только вступают в брак (before_marriage);
            "not_defined" — вопрос не раскрыт вообще.
        - notarial_status:
            "certified" — в тексте есть удостоверительная надпись нотариуса
              с реквизитами (ФИО нотариуса, номер в реестре);
            "mentioned" — есть только формулировки типа "подлежит нотариальному
              удостоверению" без фактических реквизитов удостоверения;
            "not_defined" — вопрос не раскрыт.
        - notarial_form_display формируется однозначно из notarial_status:
            certified → "Удостоверено нотариально";
            mentioned → "Указано, но без подтверждения удостоверения";
            not_defined → "Не указано".
        - foreign_element_status:
            "foreign_element_present" — хотя бы один супруг имеет иностранное
              гражданство или указано иное иностранное связующее звено;
            "no_foreign_element" — оба супруга — граждане РФ;
            "not_defined" — гражданство не указано.
        - legal_capacity_status:
            "confirmed" — прямо указано, что стороны дееспособны/полностью
              дееспособны;
            "limitations_mentioned" — упомянуты ограничения дееспособности,
              попечительство, эмансипация;
            "not_defined" — вопрос не раскрыт.
        - Значение каждого enum-поля — строго из списка allowed_values.
        - Верни только один JSON-объект.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни идентификации сторон, ни нотариального удостоверения,
           ни момента вступления в силу.
           → presence = "missing";
             все *_status = "not_defined";
             все *_value/*_details/*_display = соответствующий fallback.

        2. Только упоминание без реквизитов.
           Стороны названы по ФИО, но без паспортных данных; нотариус упомянут,
           но без ФИО и номера в реестре.
           → presence = "present";
             соответствующие *_status = "partial" или "not_defined";
             *_value содержит описание пробелов.

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные ФИО сторон или разные моменты
           вступления в силу.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             *_value = "Не удалось определить".

        4. Иностранный элемент без полного раскрытия.
           Упомянуто гражданство одного из супругов, но без указания страны
           или без подтверждения дееспособности.
           → presence = "present";
             foreign_element_status = "foreign_element_present";
             foreign_element_details содержит описание пробелов.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для parties_notarial_effective_date_check_presence используй только: "present", "missing", "unclear".
        - Для spouse_*_name_status используй только: "defined", "partial", "not_defined".
        - Для foreign_element_status используй только: "no_foreign_element", "foreign_element_present", "not_defined".
        - Для legal_capacity_status используй только: "confirmed", "limitations_mentioned", "not_defined".
        - Для marital_status используй только: "before_marriage", "during_marriage", "not_defined".
        - Для marriage_registration_status используй только: "defined_with_details", "defined_no_details", "not_applicable", "not_defined".
        - Для notarial_status используй только: "certified", "mentioned", "not_defined".
        - Для notarial_form_display используй только: "Удостоверено нотариально", "Указано, но без подтверждения удостоверения", "Не указано".
        - Для notary_name_status, registry_number_status, effective_date_status используй только: "defined", "not_defined".
        - Fallback при отсутствии данных:
          * *_value/*_details → "Данные не определены";
          * notarial_form_display → "Не указано".
        - Fallback при противоречии или неоднозначности:
          * все *_value/*_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
