        разрешения споров и оговорка о делимости.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        [ЗАДАЧА]
        Найди в тексте договора:
        1. Порядок изменения и расторжения (нотариальная форма, взаимное согласие).
        2. Невозможность одностороннего отказа.
        3. Порядок разрешения споров (подсудность, досудебный порядок).
        4. Оговорка о делимости.
        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если данные не указаны прямо — возвращай "not_defined".
        3. Если текстового значения нет — возвращай строго "Данные не определены".
        4. В evidence включай только текст договора.
        5. Верни только один JSON-объект.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1:
        Фрагмент:
        "Изменение и расторжение договора производится по взаимному согласию
        сторон в нотариальной форме. Односторонний отказ не допускается.
        Споры разрешаются в суде по месту жительства ответчика.
        Недействительность отдельных условий не влечёт недействительности
        договора в целом."
