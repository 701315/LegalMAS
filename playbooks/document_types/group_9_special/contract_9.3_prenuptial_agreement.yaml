          required: true
        - name: "ip_rights_regime_code"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["personal_and_separate", "separate_exclusive_only", "joint", "mixed", "not_defined"]
          description: "Режим интеллектуальной собственности с учётом двойственной природы (ст. 1228 ГК РФ)."
