  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 3: Крайне неблагоприятное положение, жилищные права, компенсации
  # ──────────────────────────────────────────────────────────────────────────
  - id: unfavorable_position_compensation_check
    name: "Баланс прав, жилищные права и компенсационные механизмы (ст. 42, 44 СК РФ)"
    description: >
      Фактографическая проверка наличия условий, ставящих супруга в крайне
      неблагоприятное положение, гарантий жилищных прав и компенсационных
      механизмов для экономически слабой стороны.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "отказывается от имущества"
        - "не претендует"
        - "лишается права"
        - "полностью переходит"
        - "всё имущество принадлежит"
        - "крайне неблагоприятное положение"
        - "компенсация"
        - "компенсационная выплата"
        - "фиксированная выплата"
        - "право пользования жилым помещением"
        - "обеспечение жильём"
        - "за ведение домашнего хозяйства"
        - "за уход за детьми"
        - "баланс интересов"
      keyword_mode: "any"
      negative_keywords:
        - "компенсация"
        - "взамен"
        - "в качестве возмещения"
        - "с учётом интересов"
      regex_patterns:
        - "(?i)(полностью|целиком)\\s+(отказывается|переходит|принадлежит)"
        - "(?i)не\\s+претендует\\s+на\\s+(какое-либо|любое|всё)\\s+имущество"
        - "(?i)крайне\\s+неблагоприятн(ое|ого)\\s+положени"
        - "(?i)компенсаци(я|ю|и)\\s+(в\\s+размере|составляет|равна)"
        - "(?i)право\\s+пользования\\s+жил(ым|ого)\\s+(помещени|дом)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по семейному праву.
        Анализируется брачный договор (ст. 42, 44 СК РФ).
        Проверяется только один вопрос: наличие условий о крайне неблагоприятном
        положении, жилищных правах и компенсационных механизмах.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска и не делай выводов о балансе прав.
        [ЗАДАЧА]
        Найди в тексте договора:
        1. Наличие условий о полном отказе от имущества.
        2. Наличие явного указания на недопустимость крайне неблагоприятного положения.
        3. Гарантии жилищных прав.
        4. Виды компенсационных механизмов.
        5. Компенсация за ведение домашнего хозяйства.
        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если данные не указаны прямо — возвращай "not_defined".
        3. Если текстового значения нет — возвращай строго "Данные не определены".
        4. В evidence включай только текст договора.
        5. Верни только один JSON-объект.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1:
        Фрагмент:
        "Настоящий договор не ставит ни одного из супругов в крайне неблагоприятное
        положение. Супруге предоставляется право пользования жилым помещением
        по адресу: г. Москва, ул. Ленина, д. 5, кв. 12. При расторжении брака
        выплачивается компенсация в размере 3 000 000 рублей."
        Ответ:
        {
          "full_refusal_detected": "not_defined",
          "unfavorable_position_clause_status": "defined",
          "unfavorable_position_clause_details": "не ставит ни одного из супругов в крайне неблагоприятное положение",
          "housing_rights_status": "defined",
          "housing_rights_details": "право пользования жилым помещением по адресу: г. Москва, ул. Ленина, д. 5, кв. 12",
          "compensation_type_code": "lump_sum",
          "compensation_type_details": "компенсация в размере 3 000 000 рублей",
          "homemaker_compensation_status": "not_defined",
          "evidence": [
            {
              "clause_ref": "п. 5.1",
              "quote": "Настоящий договор не ставит ни одного из супругов в крайне неблагоприятное положение."
            }
          ]
        }
        Пример 2 — признаки неблагоприятного положения:
        Фрагмент:
        "Супруга полностью отказывается от всего имущества, нажитого в браке.
        Всё имущество переходит в собственность Супруга."
        Ответ:
        {
          "full_refusal_detected": "defined",
          "unfavorable_position_clause_status": "not_defined",
          "unfavorable_position_clause_details": "Данные не определены",
          "housing_rights_status": "not_defined",
          "housing_rights_details": "Данные не определены",
          "compensation_type_code": "not_defined",
          "compensation_type_details": "Данные не определены",
          "homemaker_compensation_status": "not_defined",
          "evidence": [
            {
              "clause_ref": "п. 3.1",
              "quote": "Супруга полностью отказывается от всего имущества, нажитого в браке."
            }
          ]
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о полном отказе от имущества.
        2. Найди прямую цитату о недопустимости крайне неблагоприятного положения.
        3. Найди прямую цитату о жилищных правах.
        4. Найди прямую цитату о компенсациях.
        5. Если прямой цитаты нет — верни "not_defined". Не додумывай.
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "full_refusal_detected": "<defined / not_defined>",
          "unfavorable_position_clause_status": "<defined / not_defined>",
          "unfavorable_position_clause_details": "<текст или 'Данные не определены'>",
          "housing_rights_status": "<defined / not_defined>",
          "housing_rights_details": "<текст или 'Данные не определены'>",
          "compensation_type_code": "<lump_sum / periodic / housing_right / property_share / combination / not_defined>",
          "compensation_type_details": "<текст или 'Данные не определены'>",
          "homemaker_compensation_status": "<defined / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 10
      temperature: 0.0
      max_tokens: 650

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "отказывается от имущества не претендует лишается права полностью переходит всё имущество принадлежит крайне неблагоприятное положение компенсация компенсационная выплата фиксированная выплата право пользования жилым помещением обеспечение жильём за ведение домашнего хозяйства за уход за детьми баланс интересов неравенство несоразмерность"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - limitations
      negative_keywords:
        - "режим собственности"
        - "совместная собственность"
        - "раздельная собственность"
        - "алименты"
        - "недвижимость"
        - "ипотека"
        - "банкротство"
        - "расторжение"
        - "споры"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.15, 0.75]
        boost: 0.15
        scope: segment
      context_k: 10
      max_chunks: 12
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "limitations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 50
      max_snippet_length: 800

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 1200
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по семейному праву. Извлеки из брачного договора
        условия о крайне неблагоприятном положении, жилищных правах и компенсациях.
        Не оценивай баланс прав и не делай выводов о рисках.
        Не анализируй режим собственности, алименты или банкротство.
        </role>
        <context>
        {context}
        </context>
        <task>
        Заполни строго следующие поля:
        1. full_refusal_detected — "defined" если полный отказ от имущества прямо указан.
        2. unfavorable_position_clause_status — "defined" или "not_defined".
        3. unfavorable_position_clause_details — явное указание на недопустимость крайне неблагоприятного положения.
        4. housing_rights_status — "defined" или "not_defined".
        5. housing_rights_details — гарантии жилищных прав.
        6. compensation_type_code — lump_sum / periodic / housing_right / property_share / combination / not_defined.
        7. compensation_type_details — описание компенсационных механизмов.
        8. homemaker_compensation_status — "defined" или "not_defined".
        Если данные отсутствуют в тексте:
        - статус = "not_defined"
        - текстовое поле = "Данные не определены"
        </task>
        <rules>
        - Используй только текст договора.
        - full_refusal_detected = "defined" только если прямо указано, что один из супругов
          полностью отказывается от всего имущества или всё имущество переходит одному супругу.
        - compensation_type_code:
          "lump_sum" — единовременная выплата;
          "periodic" — периодические выплаты;
          "housing_right" — право пользования жильём;
          "property_share" — выделение доли в имуществе;
          "combination" — несколько механизмов;
          "not_defined" — не указано.
        - Верни только JSON.
        </rules>
      fields:
        - name: "full_refusal_detected"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус выявления полного отказа от имущества."
          required: true
        - name: "unfavorable_position_clause_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус явного указания на недопустимость крайне неблагоприятного положения."
          required: false
        - name: "unfavorable_position_clause_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Недопустимость неблагоприятного положения"
