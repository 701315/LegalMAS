        {
          "amendment_procedure_status": "defined",
          "amendment_procedure_details": "по взаимному согласию сторон в нотариальной форме",
          "unilateral_refusal_status": "defined",
          "unilateral_refusal_details": "односторонний отказ не допускается",
          "dispute_resolution_status": "defined",
          "dispute_resolution_details": "споры разрешаются в суде по месту жительства ответчика",
          "severability_clause_status": "defined",
          "severability_clause_details": "недействительность отдельных условий не влечёт недействительности договора в целом",
          "evidence": [
            {
              "clause_ref": "п. 9.1",
              "quote": "Изменение и расторжение договора производится по взаимному согласию сторон в нотариальной форме."
            }
          ]
        }
        Пример 2:
        Фрагмент:
        "Стороны определяют режим имущества."
        Ответ:
        {
          "amendment_procedure_status": "not_defined",
          "amendment_procedure_details": "Данные не определены",
          "unilateral_refusal_status": "not_defined",
          "unilateral_refusal_details": "Данные не определены",
          "dispute_resolution_status": "not_defined",
          "dispute_resolution_details": "Данные не определены",
          "severability_clause_status": "not_defined",
          "severability_clause_details": "Данные не определены",
          "evidence": []
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о порядке изменения и расторжения.
        2. Найди прямую цитату об одностороннем отказе.
        3. Найди прямую цитату о порядке разрешения споров.
        4. Найди прямую цитату об оговорке о делимости.
        5. Если прямой цитаты нет — верни "not_defined". Не додумывай.
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "amendment_procedure_status": "<defined / not_defined>",
          "amendment_procedure_details": "<текст или 'Данные не определены'>",
          "unilateral_refusal_status": "<defined / not_defined>",
          "unilateral_refusal_details": "<текст или 'Данные не определены'>",
          "dispute_resolution_status": "<defined / not_defined>",
          "dispute_resolution_details": "<текст или 'Данные не определены'>",
          "severability_clause_status": "<defined / not_defined>",
          "severability_clause_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 600

    retrieval:
      retrieval_profile: "termination_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "изменение брачного договора расторжение брачного договора по взаимному согласию в нотариальной форме односторонний отказ не допускается через суд разрешение споров подсудность досудебный порядок медиация частичная недействительность сохранение действия делимость остальные условия сохраняют силу ст. 43 СК РФ ст. 180 ГК РФ"
      preferred_unit_types:
        - termination_provision
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - procedures
        - remedies
      negative_keywords:
        - "режим собственности"
        - "совместная собственность"
        - "раздельная собственность"
        - "алименты"
        - "компенсация"
        - "банкротство"
        - "недвижимость"
        - "ипотека"
        - "означает"
        - "в целях настоящего"
      position_bias:
