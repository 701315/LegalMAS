          "assets_inventory_details": "Данные не определены",
          "inventory_appendix_reference": "Данные не определены",
          "regime_summary_display": "Всё имущество: совместное / Дар: совместное (риск ст. 36 СК РФ) / Перечень: отсутствует",
          "evidence": [
            {
              "clause_ref": "п. 1",
              "quote": "Всё имущество, находящееся в собственности супругов, включая имущество, полученное любым из них в дар от третьих лиц в период брака, является совместной собственностью супругов."
            }
          ]
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о режиме добрачного имущества.
        2. Найди прямую цитату о режиме имущества, нажитого в браке.
        3. Найди прямую цитату о наследстве и даре; при попытке сделать
           совместным — маркируй "made_joint" (риск ст. 36 СК РФ).
        4. Найди прямую цитату о временном охвате (имеющееся / будущее).
        5. Найди прямую цитату о специальных режимах (недвижимость, доли, акции,
           счета, транспорт).
        6. Найди прямую цитату о перечне объектов и ссылке на приложение.
        7. Сформируй компактный regime_summary_display из ключевых кодов режимов.
        8. Если прямой цитаты нет — верни "not_defined". Не додумывай.
        9. Проверь, что все 19 ключей (18 полей + evidence) присутствуют в JSON.
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "premarital_regime_status": "<defined / partial / not_defined>",
          "premarital_regime_code": "<remains_personal / transferred_to_joint / transferred_to_shared / mixed / not_defined>",
          "premarital_regime_details": "<текст или 'Данные не определены'>",
          "marital_regime_status": "<defined / partial / not_defined>",
          "marital_regime_code": "<joint / separate / shared / mixed / not_defined>",
          "marital_regime_details": "<текст или 'Данные не определены'>",
          "inherited_gifted_regime_status": "<defined / partial / not_defined>",
          "inherited_gifted_regime_code": "<remains_personal / made_joint / case_by_case / not_addressed / not_defined>",
          "inherited_gifted_regime_details": "<текст или 'Данные не определены'>",
          "temporal_scope_status": "<defined / partial / not_defined>",
          "temporal_scope_code": "<existing_only / future_only / both / not_defined>",
          "temporal_scope_details": "<текст или 'Данные не определены'>",
          "special_regimes_status": "<defined / partial / not_defined>",
          "special_regimes_details": "<текст или 'Данные не определены'>",
          "assets_inventory_status": "<defined / partial / not_defined>",
          "assets_inventory_details": "<текст или 'Данные не определены'>",
          "inventory_appendix_reference": "<номер приложения или 'Данные не определены'>",
          "regime_summary_display": "<компактное описание режимов>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 10
      temperature: 0.0
      max_tokens: 1200

    retrieval:
      retrieval_profile: "title_transfer_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "режим собственности совместная раздельная долевая личная добрачное имущество имущество нажитое в браке наследство дар безвозмездно приложение перечень имущества кадастровый номер недвижимость доли в уставном капитале акции ценные бумаги банковский счёт будущее имеющееся имущество"
      boost_keywords:
        - "наследство"
        - "в порядке наследования"
        - "в дар"
        - "по договору дарения"
        - "приложение"
        - "перечень"
        - "будущее имущество"
        - "имеющееся имущество"
        - "доли в уставном"
        - "кадастровый"
      preferred_unit_types:
        - obligation
        - general_provision
        - representations
        - definition
      excluded_unit_types:
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - rights
        - definitions
      negative_keywords:
        - "алименты"
        - "содержание супруга"
        - "компенсация при разделе"
        - "порядок раздела"
        - "банкротство"
        - "неустойка"
        - "разрешение споров"
        - "юрисдикция"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.10, 0.55]
        boost: 0.20
        scope: file
      context_k: 10
      max_chunks: 14
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
        - "appendix"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "rights"
        - "definitions"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 800

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 2000

      presence_signal:
        field: "property_regime_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по семейному праву. Извлеки из брачного договора
        режимы собственности на разные категории имущества: добрачное,
        нажитое в браке, наследственное и подаренное, а также временной охват,
        специальные режимы и наличие перечня объектов.
        Не анализируй раздел имущества при расторжении, компенсации, алименты,
        ответственность по обязательствам, банкротство — это темы других проверок.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 19 полей + evidence (всего 20 ключей):

        0. property_regime_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (premarital_regime_status, marital_regime_status,
              inherited_gifted_regime_status, temporal_scope_status)
             ≠ "not_defined";
           - "missing" — если все четыре содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - все *_status = "not_defined";
           - все *_code = "not_defined";
           - все *_details = "Данные не определены";
           - regime_summary_display = "Режим не определён";
           - не выполняй остальные шаги.

        1.  premarital_regime_status — defined / partial / not_defined.
        2.  premarital_regime_code — remains_personal / transferred_to_joint /
            transferred_to_shared / mixed / not_defined.
        3.  premarital_regime_details — описание режима добрачного имущества.
        4.  marital_regime_status — defined / partial / not_defined.
        5.  marital_regime_code — joint / separate / shared / mixed / not_defined.
        6.  marital_regime_details — описание режима имущества, нажитого в браке.
        7.  inherited_gifted_regime_status — defined / partial / not_defined.
        8.  inherited_gifted_regime_code — remains_personal / made_joint /
            case_by_case / not_addressed / not_defined.
        9.  inherited_gifted_regime_details — описание режима наследства и дара.
        10. temporal_scope_status — defined / partial / not_defined.
        11. temporal_scope_code — existing_only / future_only / both / not_defined.
        12. temporal_scope_details — описание временного охвата договора.
        13. special_regimes_status — defined / partial / not_defined.
        14. special_regimes_details — описание специальных режимов для отдельных
            категорий имущества (недвижимость, доли в ООО, акции, счета, транспорт).
        15. assets_inventory_status — defined / partial / not_defined.
        16. assets_inventory_details — описание перечня объектов с идентификацией.
        17. inventory_appendix_reference — конкретная ссылка на приложение
            с перечнем ("Приложение № N") или "Данные не определены".
        18. regime_summary_display — компактное человекочитаемое описание всех
            режимов в одну строку (для отображения в DD Grid).
        19. evidence — массив прямых цитат из договора.

        Если данные полностью отсутствуют в тексте:
        - статус = "not_defined";
        - код = "not_defined";
        - текстовое поле = "Данные не определены";
        - regime_summary_display = "Режим не определён".
        </task>

        <context_rules>
        - Перед остальными полями заполни property_regime_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_code = "not_defined", все *_details = "Данные не определены", regime_summary_display = "Режим не определён".
        - Используй только текст договора.
        - premarital_regime_code (правовые состояния добрачного имущества):
            "remains_personal" — договор подтверждает, что добрачное остаётся
              личной собственностью (совпадает с законом);
            "transferred_to_joint" — договор передаёт добрачное в совместную
              собственность;
            "transferred_to_shared" — договор передаёт добрачное в долевую
              собственность;
            "mixed" — разные объекты — по-разному;
            "not_defined" — режим не определён.
        - marital_regime_code (режим имущества, нажитого в браке):
            "joint" — совместная собственность (совпадает с законным
              режимом по ст. 33 СК РФ);
            "separate" — раздельная собственность;
            "shared" — долевая собственность;
            "mixed" — разные режимы для разных видов имущества;
            "not_defined" — режим не определён.
        - inherited_gifted_regime_code (наследство и дар, ст. 36 СК РФ):
            "remains_personal" — подтверждено, что наследство/дар — личная
              собственность (соответствует императивной ст. 36 СК РФ);
            "made_joint" — договор объявляет наследство/дар совместной
              собственностью (потенциальный юридический риск: ст. 36 СК РФ —
              императивная норма);
            "case_by_case" — разные правила для наследства и дара, или для
              разных объектов, или в зависимости от источника;
            "not_addressed" — тема прямо не затронута (действует ст. 36 СК РФ
              по закону);
            "not_defined" — режим не определён и невозможно установить намерение.
        - temporal_scope_code (ст. 42 п.2 СК РФ):
            "existing_only" — только имущество, имеющееся на момент договора;
            "future_only" — только будущее имущество;
            "both" — и имеющееся, и будущее;
            "not_defined" — не указано.
        - inventory_appendix_reference — указывай ТОЛЬКО реальные ссылки:
            "Приложение № 1", "Приложение № 2 (недвижимость)" и т.п. Если
            перечень внутри текста без выделения в приложение — пиши
            "Перечень в тексте договора". Если ссылки нет — "Данные не определены".
        - regime_summary_display формируется как строка вида:
            "Добрачное: <краткий код на русском> / В браке: <код> /
            Наследство и дар: <код> / Охват: <существующее/будущее/оба>".
            Пример: "Добрачное: личное / В браке: раздельное / Наследство: личное /
            Охват: имеющееся + будущее".
        - Значение каждого enum-поля — строго из списка allowed_values.
        - Верни только один JSON-объект.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни одного упоминания режимов собственности.
           → presence = "missing";
             все *_status = "not_defined";
             все *_code = "not_defined";
             все *_details = "Данные не определены";
             regime_summary_display = "Режим не определён".

        2. Частичное раскрытие.
           Упомянут режим, но без конкретизации объектов или без указания
           временного охвата.
           → presence = "present";
             соответствующие *_status = "partial" или "defined";
             *_details содержит описание пробелов.

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные режимы для одной категории
           имущества (например, в одном месте "раздельная", в другом "совместная").
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             *_details = "Не удалось определить".

        4. Попытка сделать наследство/дар совместным.
           Договор объявляет имущество, полученное в дар или по наследству,
           совместной собственностью супругов.
           → presence = "present";
             inherited_gifted_regime_code = "made_joint";
             inherited_gifted_regime_details содержит указание на потенциальный
             риск ст. 36 СК РФ.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для property_regime_check_presence используй только: "present", "missing", "unclear".
        - Для *_regime_status используй только: "defined", "partial", "not_defined".
        - Для premarital_regime_code используй только: "remains_personal", "transferred_to_joint", "transferred_to_shared", "mixed", "not_defined".
        - Для marital_regime_code используй только: "joint", "separate", "shared", "mixed", "not_defined".
        - Для inherited_gifted_regime_code используй только: "remains_personal", "made_joint", "case_by_case", "not_addressed", "not_defined".
        - Для temporal_scope_code используй только: "existing_only", "future_only", "both", "not_defined".
        - Fallback при отсутствии данных:
          * *_details → "Данные не определены";
          * regime_summary_display → "Режим не определён";
          * inventory_appendix_reference → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "property_regime_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования режима собственности. Внутреннее агрегатное signal-поле."
          required: true

        - name: "premarital_regime_status"
