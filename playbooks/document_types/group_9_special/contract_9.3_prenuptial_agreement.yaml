  - id: business_assets_check
    name: "Отделение бизнес-активов и корпоративных прав (ст. 34, 36, 42 СК РФ)"
    description: >
      Фактографическая проверка отнесения бизнес-активов (доли в ООО, акции,
      предприятия, доходы от предпринимательской деятельности, интеллектуальная
      собственность) к раздельной или совместной собственности супругов.
      Проверяется разграничение бизнеса, созданного до брака и в браке,
      сценарий при расторжении, защита корпоративных прав управления.
      По закону доходы от предпринимательской деятельности — совместная
      собственность (ст. 34 п.2 СК РФ); договор может изменить этот режим.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 40

    rules:
      keywords:
        - "доля в уставном капитале"
        - "доли в уставных капиталах"
        - "акции"
        - "акций"
        - "доходы от предпринимательской деятельности"
        - "доходы от бизнеса"
        - "предпринимательская деятельность"
        - "бизнес"
        - "предприятие"
        - "хозяйственное общество"
        - "корпоративные права"
        - "право голоса"
        - "управление обществом"
        - "интеллектуальная собственность"
        - "исключительные права"
        - "раздельная собственность"
        - "личная собственность"
        - "не подлежат разделу"
        - "не входит в состав"
        - "действительная стоимость доли"
        - "компенсация за долю"
      keyword_mode: "any"
      negative_keywords:
        - "алименты на детей"
        - "ипотека на жилое помещение"
        - "в целях настоящего"
      regex_patterns:
        - "(?i)(дол[яи]|акци[ия])\\s+(в\\s+)?уставн(ом|ого)\\s+капитал"
        - "(?i)доход(ы|ов)\\s+от\\s+предпринимательск"
        - "(?i)интеллектуальн(ая|ой)\\s+собственност"
        - "(?i)исключительн(ые|ых)\\s+прав"
        - "(?i)(ООО|АО|ПАО|ЗАО|ИП)\\s+[«\"']"
        - "(?i)ИНН\\s+\\d{10,12}"
        - "(?i)действительн(ая|ую)\\s+стоимост"
        - "(?i)право\\s+голоса"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по семейному праву и корпоративному праву.
        Анализируется брачный договор (ст. 34, 36, 42 СК РФ; ФЗ «Об ООО»).
        Проверяется один вопрос: отнесение бизнес-активов к имуществу супругов,
        защита корпоративных прав и сценарий при расторжении брака.
        Ключевые нормы:
        - Ст. 34 п.2 СК РФ: доходы от предпринимательской деятельности —
          совместная собственность супругов по закону.
        - Ст. 36 СК РФ: имущество, принадлежавшее супругу до брака, — его
          личная собственность; но доходы от этого имущества в период брака
          могут быть совместными.
        - Ст. 42 СК РФ: брачный договор может изменить законный режим.
        - Ст. 21 ФЗ «Об ООО»: при разделе доли супруг-неучастник может
          потребовать действительную стоимость доли или войти в состав
          участников (если устав не запрещает).
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска и не делай выводов о действительности.
        - Не анализируй общий режим собственности, алименты, жилищные права
          или банкротство — это темы других проверок.
        [ЗАДАЧА]
        Найди в тексте договора:
        1. Режим бизнес-активов (доли в ООО, акции, предприятия).
        2. Режим доходов от предпринимательской деятельности.
        3. Режим интеллектуальной собственности (исключительные права).
        4. Разграничение бизнеса, созданного до брака и в браке.
        5. Перечень конкретных компаний/бизнесов.
        6. Защита корпоративных прав управления (право голоса).
        7. Сценарий при расторжении брака (компенсация, выкуп, сохранение).
        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если тема раскрыта частично — статус = "partial".
        3. Если данные полностью не указаны — статус/код = "not_defined",
           текстовое поле = "Данные не определены".
        4. Не используй "None", "null" или пустые строки.
        5. В evidence включай только текст договора.
        6. Значение каждого enum-поля — строго из списка allowed_values.
        7. Верни РОВНО один валидный JSON-объект со всеми 14 ключами,
           пригодный для парсинга через json.loads без предварительной обработки.
           Без markdown, без ```json, без комментариев, без текста до или после.
           Начни ответ сразу с { и закончи }.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — бизнес-активы защищены:
        Фрагмент:
        "п. 4.1. Доли в уставных капиталах хозяйственных обществ, принадлежащие
        Супругу на момент заключения настоящего договора, а также приобретённые
        им в период брака, являются его раздельной собственностью и не подлежат
        разделу при расторжении брака.
        п. 4.2. Доходы от предпринимательской деятельности Супруга, включая
        дивиденды и распределённую прибыль, являются его раздельной собственностью.
        п. 4.3. Исключительные права на результаты интеллектуальной деятельности,
        созданные Супругом, являются его личной собственностью.
        п. 4.4. В случае расторжения брака Супруга не вправе претендовать на
        доли в ООО «Альфа» (ИНН 7701234567) и ООО «Бета» (ИНН 7709876543).
        Взамен Супруг выплачивает Супруге компенсацию в размере действительной
        стоимости доли, определяемой по данным бухгалтерской отчётности за
        последний отчётный период.
        п. 4.5. Право голоса и иные корпоративные права управления в указанных
        обществах осуществляются исключительно Супругом."
        Ответ:
        {
          "business_assets_regime_code": "separate",
          "business_assets_regime_details": "Доли в уставных капиталах — раздельная собственность Супруга, не подлежат разделу.",
          "business_income_regime_code": "separate",
          "business_income_regime_details": "Доходы от предпринимательской деятельности, дивиденды и прибыль — раздельная собственность.",
          "ip_rights_regime_code": "separate_exclusive_only",
          "ip_rights_regime_details": "Исключительные права на результаты интеллектуальной деятельности — личная собственность Супруга.",
          "pre_existing_business_status": "defined",
          "pre_existing_business_details": "Доли, принадлежавшие на момент заключения договора, и приобретённые в браке — оба раздельные.",
          "specific_companies_status": "defined",
          "specific_companies_details": "ООО «Альфа» (ИНН 7701234567), ООО «Бета» (ИНН 7709876543).",
          "voting_rights_status": "protected",
          "divorce_scenario_details": "Супруга не вправе претендовать на доли; Супруг выплачивает компенсацию в размере действительной стоимости доли по данным бухотчётности.",
          "business_summary_display": "Бизнес: раздельный / Доходы: раздельные / IP: личный / Компании: 2 ООО / При разводе: компенсация",
          "evidence": [
            {
              "clause_ref": "п. 4.1",
              "quote": "Доли в уставных капиталах хозяйственных обществ, принадлежащие Супругу на момент заключения настоящего договора, а также приобретённые им в период брака, являются его раздельной собственностью и не подлежат разделу при расторжении брака."
            },
            {
              "clause_ref": "п. 4.4",
              "quote": "В случае расторжения брака Супруга не вправе претендовать на доли в ООО «Альфа» (ИНН 7701234567) и ООО «Бета» (ИНН 7709876543)."
            }
          ]
        }
        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Стороны определяют имущественные права в соответствии с настоящим договором."
        Ответ:
        {
          "business_assets_regime_code": "not_defined",
          "business_assets_regime_details": "Данные не определены",
          "business_income_regime_code": "not_defined",
          "business_income_regime_details": "Данные не определены",
          "ip_rights_regime_code": "not_defined",
          "ip_rights_regime_details": "Данные не определены",
          "pre_existing_business_status": "not_defined",
          "pre_existing_business_details": "Данные не определены",
          "specific_companies_status": "not_defined",
          "specific_companies_details": "Данные не определены",
          "voting_rights_status": "not_defined",
          "divorce_scenario_details": "Данные не определены",
          "business_summary_display": "Бизнес-активы не урегулированы",
          "evidence": []
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о режиме бизнес-активов (доли, акции).
        2. Найди прямую цитату о доходах от предпринимательской деятельности.
        3. Найди прямую цитату об интеллектуальной собственности.
        4. Найди прямую цитату о разграничении бизнеса до брака / в браке.
        5. Найди прямую цитату о конкретных компаниях (названия, ИНН).
        6. Найди прямую цитату о корпоративных правах управления.
        7. Найди прямую цитату о сценарии при расторжении брака.
        8. Сформируй компактный business_summary_display.
        9. Если прямой цитаты нет — верни "not_defined". Не додумывай.
        10. Проверь, что все 14 ключей (13 полей + evidence) присутствуют в JSON.
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "business_assets_regime_code": "<separate / joint / mixed / not_defined>",
          "business_assets_regime_details": "<текст или 'Данные не определены'>",
          "business_income_regime_code": "<separate / joint / mixed / not_defined>",
          "business_income_regime_details": "<текст или 'Данные не определены'>",
          "ip_rights_regime_code": "<personal_and_separate / separate_exclusive_only / joint / mixed / not_defined>",
          "ip_rights_regime_details": "<текст или 'Данные не определены'>",
          "pre_existing_business_status": "<defined / partial / not_defined>",
          "pre_existing_business_details": "<текст или 'Данные не определены'>",
          "specific_companies_status": "<defined / partial / not_defined>",
          "specific_companies_details": "<перечень или 'Данные не определены'>",
          "voting_rights_status": "<protected / shared / not_defined>",
          "divorce_scenario_details": "<текст или 'Данные не определены'>",
          "business_summary_display": "<компактная сводка>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 1000

    retrieval:
      retrieval_profile: "title_transfer_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "доля в уставном капитале акции доходы от предпринимательской деятельности бизнес предприятие хозяйственное общество корпоративные права право голоса управление интеллектуальная собственность исключительные права раздельная собственность личная собственность не подлежат разделу действительная стоимость доли компенсация за долю"
      boost_keywords:
        - "уставном капитале"
        - "доходы от предпринимательской"
        - "интеллектуальная собственность"
        - "исключительные права"
        - "право голоса"
        - "действительная стоимость"
        - "ООО"
        - "АО"
      preferred_unit_types:
        - obligation
        - general_provision
        - representations
        - definition
      excluded_unit_types:
