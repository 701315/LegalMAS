    name: "Запрещённые условия: личные неимущественные отношения, дети, правоспособность"
    description: >
      Фактографическая проверка отсутствия условий, запрещённых ст. 42 СК РФ:
      условия о личных неимущественных отношениях, правах в отношении детей,
      ограничении правоспособности или дееспособности.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "верность"
        - "супружеская верность"
        - "любовь"
        - "уважение"
        - "воспитание детей"
        - "место жительства ребёнка"
        - "место жительства ребенка"
        - "порядок общения с детьми"
        - "выбор фамилии"
        - "ограничивает правоспособность"
        - "ограничивает дееспособность"
