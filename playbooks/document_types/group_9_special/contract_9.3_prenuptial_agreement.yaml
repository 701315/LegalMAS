  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 4: Бизнес-активы и корпоративные права
  # ──────────────────────────────────────────────────────────────────────────
  - id: business_assets_check
    name: "Отделение бизнес-активов и корпоративных прав (ст. 42 СК РФ)"
    description: >
      Фактографическая проверка отнесения бизнес-активов (доли, акции, доходы
      от предпринимательской деятельности, ИС) к раздельной собственности
      супруга-предпринимателя.
    triggers:
      any: ["business_assets_context"]
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "доля в уставном капитале"
        - "акции"
        - "доходы от предпринимательской деятельности"
        - "бизнес"
        - "предприятие"
        - "корпоративные права"
        - "интеллектуальная собственность"
        - "раздельная собственность супруга-предпринимателя"
        - "не подлежат разделу"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(дол[яи]|акци[ия])\\s+(в\\s+)?уставн(ом|ого)\\s+капитал"
        - "(?i)доход(ы|ов)\\s+от\\s+предпринимательск"
        - "(?i)интеллектуальн(ая|ой)\\s+собственност"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по семейному праву.
        Анализируется брачный договор (ст. 42 СК РФ).
        Проверяется только один вопрос: отнесение бизнес-активов к имуществу супругов.
