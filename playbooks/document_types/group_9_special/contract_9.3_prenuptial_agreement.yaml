  - id: unfavorable_position_compensation_check
    name: "Баланс прав, жилищные права и компенсационные механизмы (ст. 42, 44 СК РФ)"
    description: >
      Фактографическая проверка наличия условий, ставящих одного из супругов
      в крайне неблагоприятное положение (императивный запрет ст. 42 п.3 СК РФ),
      оценка соразмерности распределения имущества, гарантий жилищных прав
      и компенсационных механизмов для экономически более слабой стороны.
      По ст. 44 п.2 СК РФ суд может признать договор недействительным полностью
      или частично, если условия ставят супруга в крайне неблагоприятное положение.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 30

    rules:
      keywords:
        - "отказывается от имущества"
        - "не претендует"
        - "лишается права"
        - "полностью переходит"
        - "всё имущество принадлежит"
        - "всей собственностью"
        - "крайне неблагоприятное положение"
        - "несоразмерн"
        - "диспропорц"
        - "компенсация"
        - "компенсационная выплата"
        - "компенсационные выплаты"
        - "фиксированная выплата"
        - "единовременная выплата"
        - "периодические выплаты"
        - "право пользования жилым помещением"
        - "обеспечение жильём"
        - "право проживания"
        - "за ведение домашнего хозяйства"
        - "за уход за детьми"
        - "вклад в семейный бюджет"
        - "баланс интересов"
        - "справедливое распределение"
      keyword_mode: "any"
      negative_keywords:
        - "компенсация убытков"
        - "компенсация морального вреда"
        - "компенсация судебных расходов"
        - "в целях настоящего"
      regex_patterns:
        - "(?i)(полностью|целиком)\\s+(отказывается|переходит|принадлежит)"
        - "(?i)не\\s+претендует\\s+на\\s+(какое-либо|любое|всё)\\s+имущество"
        - "(?i)крайне\\s+неблагоприятн(ое|ого)\\s+положени"
        - "(?i)компенсаци(я|ю|и|онн)\\w*\\s+(в\\s+размере|составляет|равна|выплачив)"
        - "(?i)право\\s+(пользования|проживания)\\s+жил(ым|ого|ое)\\s+(помещени|дом|квартир)"
        - "(?i)(единовременн|периодическ|ежемесячн|ежегодн)\\w*\\s+выплат"
        - "(?i)ведени(е|я)\\s+домашнего\\s+хозяйства"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по семейному праву.
        Анализируется брачный договор (ст. 34, 42, 44 СК РФ).
        Проверяется один вопрос: баланс прав супругов, наличие условий,
        ставящих одного из супругов в крайне неблагоприятное положение,
        и наличие компенсационных механизмов.
        Ключевые нормы:
        - Ст. 42 п.3 СК РФ: брачный договор не может ставить одного из супругов
          в крайне неблагоприятное положение (императивный запрет).
        - Ст. 44 п.2 СК РФ: суд может признать договор недействительным полностью
          или частично по требованию супруга, поставленного в крайне неблагоприятное
          положение.
        - Ст. 34 п.3 СК РФ: право на общее имущество принадлежит также супругу,
          который в период брака осуществлял ведение домашнего хозяйства, уход
          за детьми или по другим уважительным причинам не имел самостоятельного
          дохода.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска и не делай выводов о действительности.
        - Не анализируй режим собственности как таковой — только баланс и компенсации.
        [ЗАДАЧА]
        Найди в тексте договора:
        1. Условия о полном или существенном отказе одного супруга от имущества.
        2. Явное указание на недопустимость крайне неблагоприятного положения.
        3. Признаки соразмерности или диспропорции в распределении имущества.
        4. Гарантии жилищных прав.
        5. Виды, триггеры и порядок компенсационных механизмов.
        6. Компенсация за ведение домашнего хозяйства и уход за детьми.
        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если тема раскрыта частично — статус = "partial".
        3. Если данные полностью не указаны — статус = "not_defined",
           текстовое поле = "Данные не определены".
        4. Не используй "None", "null" или пустые строки.
        5. В evidence включай только текст договора.
        6. Значение каждого enum-поля — строго из списка allowed_values.
        7. Верни РОВНО один валидный JSON-объект со всеми 16 ключами,
           пригодный для парсинга через json.loads без предварительной обработки.
           Без markdown, без ```json, без комментариев, без текста до или после.
           Начни ответ сразу с { и закончи }.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — баланс обеспечен, есть компенсации:
        Фрагмент:
        "п. 5.1. Настоящий договор не ставит ни одного из супругов в крайне
        неблагоприятное положение.
        п. 5.2. В случае расторжения брака Супруг выплачивает Супруге
        единовременную компенсацию в размере 5 000 000 (пять миллионов) рублей
        в течение 60 календарных дней с момента вступления в силу решения суда
        о расторжении брака.
        п. 5.3. Супруге предоставляется право пользования жилым помещением
        (квартирой) по адресу: г. Москва, ул. Ленина, д. 5, кв. 12, сроком
        на 3 (три) года с момента расторжения брака.
        п. 5.4. Стороны признают, что вклад Супруги в ведение домашнего
        хозяйства и воспитание детей является равнозначным финансовому вкладу
        Супруга и учтён при определении компенсационных выплат."
        Ответ:
        {
          "full_refusal_detected": "none",
          "full_refusal_details": "Полного или существенного отказа от имущества не выявлено.",
          "unfavorable_position_clause_status": "defined",
          "unfavorable_position_clause_details": "Прямое указание: договор не ставит ни одного из супругов в крайне неблагоприятное положение.",
          "proportionality_status": "proportional",
          "proportionality_details": "Распределение имущества соразмерно; вклад в домашнее хозяйство признан равнозначным.",
          "housing_rights_status": "defined",
          "housing_rights_details": "Право пользования квартирой по адресу г. Москва, ул. Ленина, д. 5, кв. 12, сроком на 3 года после расторжения.",
          "compensation_type_code": "combination",
          "compensation_type_details": "Единовременная выплата 5 000 000 руб. + право пользования жильём на 3 года.",
          "compensation_trigger": "on_divorce",
          "compensation_payment_terms": "Единовременно, в течение 60 календарных дней с момента вступления в силу решения суда о расторжении брака.",
          "homemaker_compensation_status": "defined",
          "homemaker_compensation_details": "Вклад в ведение домашнего хозяйства и воспитание детей признан равнозначным финансовому вкладу и учтён при определении компенсаций.",
          "balance_summary_display": "Баланс обеспечен: компенсация 5 млн руб. + жильё 3 года / Отказ: нет / Соразмерность: да",
          "evidence": [
            {
              "clause_ref": "п. 5.1",
              "quote": "Настоящий договор не ставит ни одного из супругов в крайне неблагоприятное положение."
            },
            {
              "clause_ref": "п. 5.2",
              "quote": "В случае расторжения брака Супруг выплачивает Супруге единовременную компенсацию в размере 5 000 000 (пять миллионов) рублей в течение 60 календарных дней."
            },
            {
              "clause_ref": "п. 5.4",
              "quote": "Стороны признают, что вклад Супруги в ведение домашнего хозяйства и воспитание детей является равнозначным финансовому вкладу Супруга."
            }
          ]
        }
        Пример 2 — признаки крайне неблагоприятного положения:
        Фрагмент:
        "п. 3.1. Супруга полностью отказывается от всего имущества, нажитого
        в период брака. Всё совместно нажитое имущество переходит в единоличную
        собственность Супруга.
        п. 3.2. Супруга не имеет права претендовать на какое-либо недвижимое
        имущество, приобретённое в период брака."
        Ответ:
        {
          "full_refusal_detected": "full",
          "full_refusal_details": "Супруга полностью отказывается от всего имущества, нажитого в браке; всё переходит Супругу.",
          "unfavorable_position_clause_status": "not_defined",
          "unfavorable_position_clause_details": "Данные не определены",
          "proportionality_status": "extreme_disparity",
          "proportionality_details": "Всё совместно нажитое имущество переходит одному супругу; второй не получает ничего.",
          "housing_rights_status": "not_defined",
          "housing_rights_details": "Данные не определены",
          "compensation_type_code": "none",
          "compensation_type_details": "Компенсационные механизмы не предусмотрены.",
          "compensation_trigger": "not_defined",
          "compensation_payment_terms": "Данные не определены",
          "homemaker_compensation_status": "not_defined",
          "homemaker_compensation_details": "Данные не определены",
          "balance_summary_display": "КРАЙНЕ НЕБЛАГОПРИЯТНО: полный отказ / Компенсация: нет / Жильё: не указано",
          "evidence": [
            {
              "clause_ref": "п. 3.1",
              "quote": "Супруга полностью отказывается от всего имущества, нажитого в период брака. Всё совместно нажитое имущество переходит в единоличную собственность Супруга."
            },
            {
              "clause_ref": "п. 3.2",
              "quote": "Супруга не имеет права претендовать на какое-либо недвижимое имущество, приобретённое в период брака."
            }
          ]
        }
        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Стороны определяют имущественные права и обязанности в соответствии
        с настоящим договором."
        Ответ:
        {
          "full_refusal_detected": "not_defined",
          "full_refusal_details": "Данные не определены",
          "unfavorable_position_clause_status": "not_defined",
          "unfavorable_position_clause_details": "Данные не определены",
          "proportionality_status": "not_defined",
          "proportionality_details": "Данные не определены",
          "housing_rights_status": "not_defined",
          "housing_rights_details": "Данные не определены",
          "compensation_type_code": "not_defined",
          "compensation_type_details": "Данные не определены",
          "compensation_trigger": "not_defined",
          "compensation_payment_terms": "Данные не определены",
          "homemaker_compensation_status": "not_defined",
          "homemaker_compensation_details": "Данные не определены",
          "balance_summary_display": "Баланс прав не определён",
          "evidence": []
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о полном или существенном отказе от имущества;
           определи степень: full / substantial / partial_category / none.
        2. Найди прямую цитату о недопустимости крайне неблагоприятного положения.
        3. Оцени соразмерность распределения по тексту: proportional /
           disproportionate / extreme_disparity.
        4. Найди прямую цитату о жилищных правах (право пользования, проживания).
        5. Найди прямую цитату о компенсациях: вид, триггер, порядок выплаты.
        6. Найди прямую цитату о компенсации за домашнее хозяйство / уход за детьми.
        7. Сформируй компактный balance_summary_display.
        8. Если прямой цитаты нет — верни "not_defined". Не додумывай.
        9. Проверь, что все 16 ключей (15 полей + evidence) присутствуют в JSON.
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "full_refusal_detected": "<full / substantial / partial_category / none / not_defined>",
          "full_refusal_details": "<описание или 'Данные не определены'>",
          "unfavorable_position_clause_status": "<defined / partial / not_defined>",
          "unfavorable_position_clause_details": "<текст или 'Данные не определены'>",
          "proportionality_status": "<proportional / disproportionate / extreme_disparity / not_defined>",
          "proportionality_details": "<текст или 'Данные не определены'>",
          "housing_rights_status": "<defined / partial / not_defined>",
          "housing_rights_details": "<текст или 'Данные не определены'>",
          "compensation_type_code": "<lump_sum / periodic / housing_right / property_share / combination / none / not_defined>",
          "compensation_type_details": "<текст или 'Данные не определены'>",
          "compensation_trigger": "<on_divorce / on_death / during_marriage / combined / not_defined>",
          "compensation_payment_terms": "<текст или 'Данные не определены'>",
          "homemaker_compensation_status": "<defined / partial / not_defined>",
          "homemaker_compensation_details": "<текст или 'Данные не определены'>",
          "balance_summary_display": "<компактная сводка баланса прав>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 10
      temperature: 0.0
      max_tokens: 1100

    retrieval:
      retrieval_profile: "indemnification_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "отказ от имущества не претендует лишается права полностью переходит всё имущество принадлежит крайне неблагоприятное положение несоразмерность диспропорция компенсация компенсационная выплата единовременная выплата периодические выплаты право пользования жилым помещением право проживания обеспечение жильём ведение домашнего хозяйства уход за детьми вклад в семейный бюджет баланс интересов справедливое распределение"
      boost_keywords:
        - "крайне неблагоприятное"
        - "полностью отказывается"
        - "не претендует"
        - "компенсация"
        - "право пользования"
        - "право проживания"
        - "домашнего хозяйства"
        - "единовременная"
      preferred_unit_types:
        - obligation
        - general_provision
        - representations
      excluded_unit_types:
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - limitations
        - remedies
      negative_keywords:
        - "режим собственности"
        - "совместная собственность"
        - "раздельная собственность"
        - "алименты на детей"
        - "ипотека"
        - "банкротство"
        - "разрешение споров"
        - "юрисдикция"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.15, 0.85]
        boost: 0.30
        scope: file
      context_k: 10
      max_chunks: 14
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "limitations"
        - "remedies"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 800

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1800

      compact_output: false

      presence_signal:
        field: "unfavorable_position_compensation_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по семейному праву. Извлеки из брачного договора
        условия, касающиеся баланса прав супругов: отказы от имущества,
        крайне неблагоприятное положение (ст. 42 п.3 СК РФ), соразмерность
        распределения, жилищные права и компенсационные механизмы.
        Не оценивай действительность договора и не делай выводов о рисках —
        только фактографическое извлечение.
        Не анализируй режим собственности как таковой, алименты на детей
        или банкротство — это темы других проверок.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 16 полей + evidence (всего 17 ключей):

        0. unfavorable_position_compensation_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (full_refusal_detected, unfavorable_position_clause_status,
              proportionality_status, housing_rights_status,
              compensation_type_code, homemaker_compensation_status)
             ≠ "not_defined";
           - "missing" — если все шесть содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - full_refusal_detected = "not_defined";
           - unfavorable_position_clause_status = "not_defined";
           - proportionality_status = "not_defined";
           - housing_rights_status = "not_defined";
           - compensation_type_code = "not_defined";
           - homemaker_compensation_status = "not_defined";
           - все *_details/*_display = соответствующий fallback;
           - balance_summary_display = "Баланс прав не определён";
           - не выполняй остальные шаги.

        1.  full_refusal_detected — full / substantial / partial_category /
            none / not_defined.
        2.  full_refusal_details — описание отказа от имущества.
        3.  unfavorable_position_clause_status — defined / partial / not_defined.
        4.  unfavorable_position_clause_details — явное указание на
            недопустимость крайне неблагоприятного положения.
        5.  proportionality_status — proportional / disproportionate /
            extreme_disparity / not_defined.
        6.  proportionality_details — описание соразмерности распределения.
        7.  housing_rights_status — defined / partial / not_defined.
        8.  housing_rights_details — гарантии жилищных прав.
        9.  compensation_type_code — lump_sum / periodic / housing_right /
            property_share / combination / none / not_defined.
        10. compensation_type_details — описание компенсационных механизмов.
        11. compensation_trigger — on_divorce / on_death / during_marriage /
            combined / not_defined.
        12. compensation_payment_terms — порядок и срок выплаты компенсации.
        13. homemaker_compensation_status — defined / partial / not_defined.
        14. homemaker_compensation_details — компенсация за ведение домашнего
            хозяйства и уход за детьми.
        15. balance_summary_display — компактная человекочитаемая сводка
            баланса прав в одну строку.
        16. evidence — массив прямых цитат из договора.

        Если данные полностью отсутствуют в тексте:
        - статус = "not_defined";
        - код = "not_defined";
        - текстовое поле = "Данные не определены";
        - balance_summary_display = "Баланс прав не определён".
        </task>

        <context_rules>
        - Перед остальными полями заполни unfavorable_position_compensation_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status/*_code = "not_defined", все *_details = "Данные не определены", balance_summary_display = "Баланс прав не определён".
        - Используй только текст договора.
        - full_refusal_detected:
            "full" — один супруг полностью отказывается от ВСЕГО имущества
              или всё имущество переходит одному супругу;
            "substantial" — отказ от большей части имущества (но не всего);
            "partial_category" — отказ от конкретной категории имущества
              (например, только от недвижимости);
            "none" — отказа от имущества нет, распределение предусмотрено
              для обоих супругов;
            "not_defined" — невозможно установить по тексту.
        - proportionality_status:
            "proportional" — распределение соразмерно, вклады обоих супругов
              учтены;
            "disproportionate" — явная диспропорция в распределении, но не
              полный отказ;
            "extreme_disparity" — один супруг получает всё или почти всё,
              второй — ничего или минимум;
            "not_defined" — невозможно оценить по тексту.
        - compensation_type_code:
            "lump_sum" — единовременная денежная выплата;
            "periodic" — периодические выплаты (ежемесячные, ежегодные);
            "housing_right" — право пользования жилым помещением;
            "property_share" — выделение доли в конкретном имуществе;
            "combination" — несколько механизмов одновременно;
            "none" — компенсационные механизмы прямо не предусмотрены;
            "not_defined" — вопрос не раскрыт.
        - compensation_trigger:
            "on_divorce" — при расторжении брака;
            "on_death" — в случае смерти супруга;
            "during_marriage" — в период брака;
            "combined" — при нескольких событиях;
            "not_defined" — триггер не указан.
        - homemaker_compensation_status:
            "defined" — прямо предусмотрена компенсация или признание вклада
              в домашнее хозяйство / уход за детьми (ст. 34 п.3 СК РФ);
            "partial" — упомянуто, но без конкретных механизмов;
            "not_defined" — тема не затронута.
        - balance_summary_display формируется как строка вида:
            "Баланс: <обеспечен/не обеспечен/не определён> / Отказ: <нет/полный/частичный> /
            Компенсация: <вид или 'нет'> / Жильё: <есть/нет>".
            Пример: "Баланс обеспечен: компенсация 5 млн + жильё 3 года /
            Отказ: нет / Соразмерность: да".
        - Значение каждого enum-поля — строго из списка allowed_values.
        - Верни только один JSON-объект.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни упоминаний о балансе прав, ни компенсаций,
           ни жилищных гарантий.
           → presence = "missing";
             все *_status/*_code = "not_defined";
             все *_details = "Данные не определены";
             balance_summary_display = "Баланс прав не определён".

        2. Только общие формулировки без конкретики.
           Упомянут "баланс интересов" или "справедливое распределение",
           но без конкретных сумм, сроков, адресов.
           → presence = "present";
             соответствующие *_status = "partial";
             *_details содержит описание общих формулировок.

        3. Противоречие между фрагментами.
           В одном месте указано, что договор не ставит в неблагоприятное
           положение, в другом — один супруг полностью отказывается от имущества
           без компенсации.
           → presence = "unclear";
             proportionality_status = "not_defined";
             proportionality_details = "Не удалось определить".

        4. Прямое указание на крайне неблагоприятное положение.
           Один супруг полностью отказывается от всего имущества без каких-либо
           компенсационных механизмов.
           → presence = "present";
             full_refusal_detected = "full";
             proportionality_status = "extreme_disparity";
             compensation_type_code = "none";
             balance_summary_display содержит маркер "КРАЙНЕ НЕБЛАГОПРИЯТНО".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для unfavorable_position_compensation_check_presence используй только: "present", "missing", "unclear".
        - Для full_refusal_detected используй только: "full", "substantial", "partial_category", "none", "not_defined".
        - Для unfavorable_position_clause_status, housing_rights_status, homemaker_compensation_status используй только: "defined", "partial", "not_defined".
        - Для proportionality_status используй только: "proportional", "disproportionate", "extreme_disparity", "not_defined".
        - Для compensation_type_code используй только: "lump_sum", "periodic", "housing_right", "property_share", "combination", "none", "not_defined".
        - Для compensation_trigger используй только: "on_divorce", "on_death", "during_marriage", "combined", "not_defined".
        - Fallback при отсутствии данных:
          * *_details → "Данные не определены";
          * balance_summary_display → "Баланс прав не определён".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
