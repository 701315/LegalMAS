      compact_output: false
      llm_max_tokens: 800
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по семейному праву. Извлеки из брачного договора
        порядок изменения, расторжения, разрешения споров и оговорку о делимости.
        Не анализируй режим собственности, алименты или банкротство.
        </role>
        <context>
        {context}
        </context>
        <task>
        Заполни строго следующие поля:
        1. amendment_procedure_status — "defined" или "not_defined".
        2. amendment_procedure_details — порядок изменения и расторжения.
        3. unilateral_refusal_status — "defined" или "not_defined".
        4. unilateral_refusal_details — невозможность одностороннего отказа.
        5. dispute_resolution_status — "defined" или "not_defined".
        6. dispute_resolution_details — порядок разрешения споров.
        7. severability_clause_status — "defined" или "not_defined".
