      store_payload: true

  - id: alimony_maintenance_check
    name: "Алиментные права нетрудоспособного супруга и взаимное содержание (ст. 42, 89–92 СК РФ)"
    description: >
      Фактографическая проверка условий об алиментных правах супругов, взаимном содержании
      и выявлении ничтожных оговорок об отказе от алиментов. По ст. 42 п.3 СК РФ брачный
      договор не может ограничивать право нетрудоспособного нуждающегося супруга на получение
      содержания (такие условия ничтожны в силу закона).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 50

    rules:
      keywords:
        - "алименты"
        - "алиментные обязательства"
        - "содержание супруга"
        - "содержание супруги"
        - "содержание друг друга"
        - "нетрудоспособность"
        - "нетрудоспособный нуждающийся"
        - "инвалидность"
        - "пенсионный возраст"
        - "право на содержание"
        - "обязанность по содержанию"
        - "отказ от алиментов"
        - "не вправе требовать содержание"
        - "взаимное содержание"
        - "материальная помощь"
        - "ежемесячное содержание"
      keyword_mode: "any"
      negative_keywords:
        - "алименты на несовершеннолетних"
        - "алименты на детей"
        - "содержание ребенка"
        - "в целях настоящего"
      regex_patterns:
        - "(?i)алимент(ы|ов|ных|овать)"
        - "(?i)содержани(е|я|и)\\s+(супруг|друг\\s+друга)"
        - "(?i)нетрудоспособн(ый|ого|ой|ому)\\s+(нуждающ|супруг)"
        - "(?i)(отказ|отказывается)\\s+от\\s+(алиментов|получения\\s+содержания)"
        - "(?i)материальн(ая|ой|ую)\\s+помощ"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по семейному праву.
        Анализируется брачный договор (ст. 42, 89–92 СК РФ).
        Проверяется один вопрос: алиментные права, взаимное содержание и выявление условий,
        ограничивающих права нетрудоспособного нуждающегося супруга на содержание.
        Ключевые нормы:
        - Ст. 42 п.3 СК РФ: брачный договор не может ограничивать право нетрудоспособного
          нуждающегося супруга на получение содержания. Оговорка об отказе от этого права ничтожна.
        - Ст. 89, 90 СК РФ: супруги обязаны материально поддерживать друг друга. Право требовать
          алименты в судебном порядке имеет в том числе нетрудоспособный нуждающийся супруг.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Если договор содержит полный отказ от алиментов / взаимного содержания или освобождает
          от обязанности содержать супруга при его нетрудоспособности — маркируй "void_clause_risk".
        - Не оценивай серьёзность риска самостоятельно вне правил.
        - Не анализируй общий режим собственности, раздел имущества, жилищные права —
          это темы других проверок.
        [ЗАДАЧА]
        Найди в тексте договора:
        1. Наличие алиментных условий и их характер (расширены / сохранены / ограничены).
        2. Ограничения права на алименты (включая незаконный отказ от содержания нетрудоспособного).
        3. Наличие риска ничтожности оговорки (нарушение ст. 42 п.3 СК РФ).
        4. Размер и условия выплаты алиментов.
        5. Условия взаимного содержания.
        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если тема раскрыта частично — статус = "partial".
        3. Если данные полностью не указаны — статус/код = "not_defined",
           текстовое поле = "Данные не определены".
        4. Не используй "None", "null" или пустые строки.
        5. В evidence включай только текст договора.
        6. Значение каждого enum-поля — строго из списка allowed_values.
        7. Верни РОВНО один валидный JSON-объект со всеми 10 ключами,
           пригодный для парсинга через json.loads без предварительной обработки.
           Без markdown, без ```json, без комментариев, без текста до или после.
           Начни ответ сразу с { и закончи }.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — права расширены, условия действительны:
        Фрагмент:
        "п. 6.1. В период брака и в случае его расторжения Супруг обязуется выплачивать
        Супруге ежемесячное содержание (алименты) в размере 100 000 (сто тысяч) рублей
        независимо от её трудоспособности, начиная с первого числа месяца, следующего
        за месяцем расторжения брака."
        Ответ:
        {
          "alimony_clause_status": "enhanced",
          "restriction_detected": "none",
          "waiver_risk_status": "low_risk",
          "waiver_risk_details": "Риск ничтожности отсутствует. Обязанность по выплате алиментов расширена по сравнению с законом.",
          "alimony_amount_status": "defined",
          "alimony_amount_details": "100 000 рублей ежемесячно, выплачивается независимо от трудоспособности при расторжении брака.",
          "mutual_maintenance_status": "defined",
          "mutual_maintenance_details": "Супруг обязуется выплачивать ежемесячное содержание Супруге.",
          "alimony_summary_display": "Алименты: расширены (100 000 руб./мес. без условий) / Риск ст. 42 п.3: нет",
          "evidence": [
            {
              "clause_ref": "п. 6.1",
              "quote": "В период брака и в случае его расторжения Супруг обязуется выплачивать Супруге ежемесячное содержание (алименты) в размере 100 000 (сто тысяч) рублей независимо от её трудоспособности."
            }
          ]
        }
        Пример 2 — незаконное ограничение (риск ничтожности):
        Фрагмент:
        "п. 7.1. Супруги полностью отказываются от права требовать друг от друга
        какое-либо материальное содержание (алименты) как в браке, так и после его
        расторжения, в том числе в случае нетрудоспособности и нуждаемости любого из них."
        Ответ:
        {
          "alimony_clause_status": "restricted",
          "restriction_detected": "waiver_detected",
          "waiver_risk_status": "void_clause_risk",
          "waiver_risk_details": "Выявлен риск ничтожности по ст. 42 п.3 СК РФ: договор полностью исключает право нетрудоспособного нуждающегося супруга на получение содержания.",
          "alimony_amount_status": "not_defined",
          "alimony_amount_details": "Данные не определены",
          "mutual_maintenance_status": "restricted",
          "mutual_maintenance_details": "Стороны полностью отказались от взаимного материального содержания.",
          "alimony_summary_display": "Внимание: незаконный отказ от алиментов нетрудоспособного супруга (ничтожная оговорка)",
          "evidence": [
            {
              "clause_ref": "п. 7.1",
              "quote": "Супруги полностью отказываются от права требовать друг от друга какое-либо материальное содержание (алименты) как в браке, так и после его расторжения, в том числе в случае нетрудоспособности и нуждаемости любого из них."
            }
          ]
        }
        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Иные условия брачного договора регулируются действующим законодательством РФ."
        Ответ:
        {
          "alimony_clause_status": "not_defined",
          "restriction_detected": "not_defined",
          "waiver_risk_status": "not_defined",
          "waiver_risk_details": "Данные не определены",
          "alimony_amount_status": "not_defined",
          "alimony_amount_details": "Данные не определены",
          "mutual_maintenance_status": "not_defined",
          "mutual_maintenance_details": "Данные не определены",
          "alimony_summary_display": "Алиментные обязательства не урегулированы",
          "evidence": []
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату об алиментных правах или их ограничении.
        2. Проверь, нарушает ли ограничение ст. 42 п.3 СК РФ (отказ от содержания при нетрудоспособности) -> void_clause_risk / low_risk.
        3. Найди размер и условия выплаты spousal алиментов.
        4. Опиши взаимное содержание сторон.
        5. Сформируй компактный alimony_summary_display.
        6. Если прямой цитаты нет — верни "not_defined". Не додумывай.
        7. Проверь, что все 10 ключей (9 полей + evidence) присутствуют в JSON.
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "alimony_clause_status": "<enhanced / preserved / restricted / not_defined>",
          "restriction_detected": "<none / waiver_detected / partial_restriction / not_defined>",
          "waiver_risk_status": "<void_clause_risk / low_risk / not_defined>",
          "waiver_risk_details": "<текст или 'Данные не определены'>",
          "alimony_amount_status": "<defined / partial / not_defined>",
          "alimony_amount_details": "<размер или 'Данные не определены'>",
          "mutual_maintenance_status": "<defined / partial / restricted / not_defined>",
          "mutual_maintenance_details": "<текст или 'Данные не определены'>",
          "alimony_summary_display": "<компактная сводка>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 1000

    retrieval:
      retrieval_profile: "payment_terms_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "алименты материальное содержание супруга взаимное содержание супругов нетрудоспособность нуждаемость инвалидность право на содержание обязанность по содержанию отказ от алиментов не вправе требовать содержание ст. 89 СК РФ ст. 90 СК РФ"
      boost_keywords:
        - "алименты"
        - "содержание супруга"
        - "нетрудоспособн"
        - "инвалидн"
        - "нуждаемость"
        - "отказ от права"
        - "взаимное содержание"
      preferred_unit_types:
        - obligation
        - general_provision
        - representations
        - definition
      excluded_unit_types:
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - limitations
        - remedies
      negative_keywords:
        - "алименты на несовершеннолетних"
        - "алименты на детей"
        - "содержание детей"
        - "режим собственности"
        - "ипотека"
        - "банкротство"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.30, 0.85]
        boost: 0.30
        scope: file
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "limitations"
        - "remedies"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 800

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1500

      compact_output: false

      presence_signal:
        field: "alimony_maintenance_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по семейному праву. Извлеки из брачного договора
        условия об алиментных правах супругов, материальном содержании, взаимных
        обязанностях поддержки и ограничениях этих прав (ст. 42, 89–92 СК РФ).
        Не анализируй режим собственности, раздел имущества, жилищные права
        или банкротство — это темы других проверок.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 10 полей + evidence (всего 11 ключей):

        0. alimony_maintenance_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (alimony_clause_status, restriction_detected, waiver_risk_status,
              alimony_amount_status, mutual_maintenance_status)
             ≠ "not_defined";
           - "missing" — если все пять содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - alimony_clause_status = "not_defined";
           - restriction_detected = "not_defined";
           - waiver_risk_status = "not_defined";
           - alimony_amount_status = "not_defined";
           - mutual_maintenance_status = "not_defined";
           - все *_details = "Данные не определены";
           - alimony_summary_display = "Алиментные обязательства не урегулированы";
           - не выполняй остальные шаги.

        1.  alimony_clause_status — enhanced / preserved / restricted / not_defined.
        2.  restriction_detected — none / waiver_detected / partial_restriction / not_defined.
        3.  waiver_risk_status — void_clause_risk / low_risk / not_defined.
        4.  waiver_risk_details — детальное описание риска ничтожности оговорки
            об отказе от алиментов (ст. 42 п.3 СК РФ).
        5.  alimony_amount_status — defined / partial / not_defined.
        6.  alimony_amount_details — размер и периодичность алиментных выплат.
        7.  mutual_maintenance_status — defined / partial / restricted / not_defined.
        8.  mutual_maintenance_details — подробное описание порядка взаимного содержания.
        9.  alimony_summary_display — компактная человекочитаемая сводка алиментных
            обязательств для DD Grid.
        10. evidence — массив прямых цитат из договора.

        Если данные полностью отсутствуют в тексте:
        - статус/код = "not_defined";
        - текстовое поле = "Данные не определены";
        - alimony_summary_display = "Алиментные обязательства не урегулированы".
        </task>

        <context_rules>
        - Перед остальными полями заполни alimony_maintenance_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status/*_code = "not_defined", все *_details = "Данные не определены", alimony_summary_display = "Алиментные обязательства не урегулированы".
        - Используй только текст договора.
        - alimony_clause_status:
            "enhanced" — договор устанавливает алименты шире/выше закона
              (например, выплата здоровому супругу при расторжении брака);
            "preserved" — договор подтверждает стандартное законное право на содержание;
            "restricted" — договор урезает/ограничивает законные алиментные права;
            "not_defined" — вопрос не раскрыт.
        - restriction_detected:
            "none" — никаких ограничений spousal поддержки не зафиксировано;
            "waiver_detected" — зафиксирован полный отказ от алиментов/содержания;
            "partial_restriction" — права частично ограничены (например, ограничены
              сроки выплат или установлены жесткие условия);
            "not_defined" — вопрос не раскрыт.
        - waiver_risk_status:
            "void_clause_risk" — обнаружен риск ничтожности: договор прямо запрещает
              или полностью отменяет право на содержание нетрудоспособного
              нуждающегося супруга (прямое нарушение ст. 42 п.3 СК РФ);
            "low_risk" — ограничений нет, либо договор расширяет права;
            "not_defined" — тема содержания не раскрыта вообще.
        - alimony_summary_display формируется как строка вида:
            "Алименты: <расширены/сохранены/ограничены/не урегулированы> /
            Риск ст. 42 п.3: <есть риск / нет / не определён> / Размер: <размер или 'нет'>".
        - Значение каждого enum-поля — строго из списка allowed_values.
        - Верни только один JSON-объект.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни упоминаний алиментов, ни взаимного содержания,
           ни ограничений прав на содержание.
           → presence = "missing";
             все *_status/*_code = "not_defined";
             все *_details = "Данные не определены";
             alimony_summary_display = "Алиментные обязательства не урегулированы".

        2. Расширение прав (enhanced).
           Договор устанавливает алименты шире закона (например, выплата
           здоровому супругу при расторжении брака).
           → presence = "present";
             alimony_clause_status = "enhanced";
             waiver_risk_status = "low_risk".

        3. Противоречие между фрагментами.
           В одном месте указано, что супруги обязуются содержать друг друга,
           в другом — полный отказ от алиментов.
           → presence = "unclear";
             alimony_clause_status = "not_defined";
             waiver_risk_details = "Не удалось определить".

        4. Незаконный отказ от алиментов нетрудоспособного.
           Договор содержит полный отказ от права требовать содержание
           в случае нетрудоспособности и нуждаемости.
           → presence = "present";
             restriction_detected = "waiver_detected";
             waiver_risk_status = "void_clause_risk";
             alimony_summary_display содержит маркер "Внимание: незаконный отказ".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для alimony_maintenance_check_presence используй только: "present", "missing", "unclear".
        - Для alimony_clause_status используй только: "enhanced", "preserved", "restricted", "not_defined".
        - Для restriction_detected используй только: "none", "waiver_detected", "partial_restriction", "not_defined".
        - Для waiver_risk_status используй только: "void_clause_risk", "low_risk", "not_defined".
        - Для alimony_amount_status, mutual_maintenance_status используй только: "defined", "partial", "not_defined".
        - Для mutual_maintenance_status дополнительно используй: "restricted".
        - Fallback при отсутствии данных:
          * *_details → "Данные не определены";
          * alimony_summary_display → "Алиментные обязательства не урегулированы".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "alimony_maintenance_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования алиментных прав и взаимного содержания. Внутреннее агрегатное signal-поле."
          required: true

        - name: "alimony_clause_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["enhanced", "preserved", "restricted", "not_defined"]
          description: "Статус алиментных условий супругов по договору."
          required: true
        - name: "restriction_detected"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["none", "waiver_detected", "partial_restriction", "not_defined"]
          description: "Наличие и характер ограничений алиментных прав супругов."
          required: true
        - name: "waiver_risk_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["void_clause_risk", "low_risk", "not_defined"]
          description: "Юридический риск ничтожности условий договора об отказе от содержания (ст. 42 п.3 СК РФ)."
          required: true
        - name: "waiver_risk_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Риск ничтожности алиментных оговорок"
          description: "Детальный правовой анализ риска ничтожности оговорок об отказе от взаимного содержания."
          required: false
        - name: "alimony_amount_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "partial", "not_defined"]
          description: "Статус указания размера алиментных выплат."
          required: true
        - name: "alimony_amount_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Размер алиментов"
          description: "Установленный размер, периодичность и валюта алиментных обязательств супругов."
          required: true
        - name: "mutual_maintenance_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "partial", "restricted", "not_defined"]
          description: "Статус условий о взаимном содержании супругов."
          required: true
        - name: "mutual_maintenance_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Взаимное содержание"
          description: "Детали порядка и условий предоставления взаимного материального содержания."
          required: true
        - name: "alimony_summary_display"
          type: "string"
          presentation: "summary"
          display_in_grid: true
          display_priority: 3
          label: "Алименты и содержание"
          description: "Компактная сводка алиментных обязательств супругов для отображения в DD Grid."
          required: true

      store_payload: true

  - id: debt_mortgage_allocation_check
    name: "Распределение долговых и ипотечных обязательств (ст. 42, 45 СК РФ)"
    description: >
      Фактографическая проверка распределения кредитных и долговых обязательств супругов
      (личные vs общие долги), урегулирования ипотечных кредитов, статуса созаёмщика,
      порядка переоформления/погашения долгов при расторжении брака и наличия оговорок
      о согласии банков-кредиторов (ст. 391 ГК РФ, ст. 45 СК РФ, ФЗ «Об ипотеке»).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 60

    rules:
      keywords:
        - "долги"
        - "долговые обязательства"
        - "кредит"
        - "кредитные обязательства"
        - "кредитный договор"
        - "ипотека"
        - "ипотечный кредит"
        - "залог недвижимости"
        - "созаёмщик"
        - "солидарная ответственность"
        - "солидарные обязательства"
        - "ежемесячный платёж"
        - "погашение кредита"
        - "заём"
        - "поручительство"
        - "личные долги"
        - "общие долги"
        - "ответственность по обязательствам"
        - "согласие банка"
        - "согласие кредитора"
        - "перевод долга"
        - "переоформление кредита"
      keyword_mode: "any"
      negative_keywords:
        - "алименты на детей"
        - "алименты на несовершеннолетних"
        - "в целях настоящего"
      regex_patterns:
        - "(?i)(личн|общ)(ые|их|ым)\\s+долг(и|ов|ам)"
        - "(?i)ответственност(ь|и)\\s+по\\s+(своим\\s+)?обязательств"
        - "(?i)ипотечн(ый|ого|ых|ому)\\s+(кредит|обязательств|залог)"
        - "(?i)(созаёмщик|созаемщик|солидарн(ая|ой|ую)\\s+ответственност)"
        - "(?i)согласи(е|я)\\s+(банк|кредитор|залогодержател)"
        - "(?i)перевод\\s+долга|переоформлени(е|я)\\s+кредит"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по семейному и банковскому праву.
        Анализируется брачный договор (ст. 42, 45 СК РФ; ст. 391 ГК РФ; ФЗ-102 «Об ипотеке»).
        Проверяется только один вопрос: распределение кредитных, ипотечных и долговых обязательств
        супругов, статус созаёмщика и порядок действий при расторжении брака.
        Ключевые нормы:
        - Ст. 45 СК РФ: по обязательствам одного из супругов взыскание может быть обращено
          лишь на имущество этого супруга. По общим обязательствам супруги отвечают общим имуществом.
        - Ст. 391 ГК РФ и ФЗ «Об ипотеке»: перевод долга по кредиту и изменение состава заёмщиков/залогодателей
          допускаются исключительно с предварительного согласия банка-кредитора.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай риски самостоятельно вне правил.
        - Не анализируй общий режим собственности, алименты или жилищные права — это темы других проверок.
        [ЗАДАЧА]
        Найди в тексте договора:
        1. Распределение личных и общих долгов (режим ответственности).
        2. Урегулирование ипотечных обязательств (кто несёт расходы, объект ипотеки).
        3. Наличие оговорки о необходимости согласия банка/кредитора на изменение условий кредита.
        4. Статус созаёмщика / поручителя.
        5. Порядок исполнения или переоформления долгов при расторжении брака.
        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если тема раскрыта частично — статус = "partial".
        3. Если данные полностью не указаны — статус/код = "not_defined",
           текстовое поле = "Данные не определены".
        4. Не используй "None", "null" или пустые строки.
        5. В evidence включай только текст договора.
        6. Значение каждого enum-поля — строго из списка allowed_values.
        7. Верни РОВНО один валидный JSON-объект со всеми 13 ключами,
           пригодный для парсинга через json.loads без предварительной обработки.
           Без markdown, без ```json, без комментариев, без текста до или после.
           Начни ответ сразу с { и закончи }.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — долги и ипотека полностью урегулированы:
        Фрагмент:
        "п. 4.1. Каждый из супругов несёт самостоятельную личную ответственность по любым кредитам
        и займам, оформленным на его имя, без права регрессного требования к другому супругу.
        п. 4.2. Ипотечный кредит по квартире по адресу: г. Москва, ул. Ленина, д. 5, кв. 12,
        погашается Супругом единолично за счёт собственных средств. Супруга является титульным созаёмщиком.
        п. 4.3. В случае расторжения брака ипотечный долг переоформляется на Супруга с выводом Супруги
        из состава созаёмщиков при условии получения предварительного письменного согласия Банка-кредитора."
        Ответ:
        {
          "debt_allocation_status": "defined",
          "debt_allocation_regime_code": "separate_debts_only",
          "debt_allocation_details": "Каждый супруг несёт самостоятельную личную ответственность по долгам, оформленным на его имя.",
          "mortgage_status": "defined",
          "mortgage_details": "Ипотека по квартире (г. Москва, ул. Ленина, д. 5, кв. 12) погашается Супругом единолично.",
          "bank_consent_clause_status": "defined",
          "bank_consent_details": "Переоформление ипотеки при разводе обусловлено получением письменного согласия Банка.",
          "co_borrower_status": "defined",
          "co_borrower_details": "Супруга является титульным созаёмщиком по ипотечному кредиту.",
          "divorce_debt_procedure_status": "defined",
          "divorce_debt_procedure_details": "При расторжении брака долг переоформляется на Супруга с выводом Супруги из кредитного договора.",
          "debt_summary_display": "Долги: раздельные / Ипотека: на Супруге (квартира Ленина) / Созаёмщик: Супруга / Согласие банка: предусмотрено",
          "evidence": [
            {
              "clause_ref": "п. 4.1",
              "quote": "Каждый из супругов несёт самостоятельную личную ответственность по любым кредитам и займам, оформленным на его имя."
            },
            {
              "clause_ref": "п. 4.3",
              "quote": "В случае расторжения брака ипотечный долг переоформляется на Супруга с выводом Супруги из состава созаёмщиков при условии получения предварительного письменного согласия Банка-кредитора."
            }
          ]
        }
        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Имущество сторон распределяется в соответствии с условиями настоящего договора."
        Ответ:
        {
          "debt_allocation_status": "not_defined",
          "debt_allocation_regime_code": "not_defined",
          "debt_allocation_details": "Данные не определены",
          "mortgage_status": "not_defined",
          "mortgage_details": "Данные не определены",
          "bank_consent_clause_status": "not_defined",
          "bank_consent_details": "Данные не определены",
          "co_borrower_status": "not_defined",
          "co_borrower_details": "Данные не определены",
          "divorce_debt_procedure_status": "not_defined",
          "divorce_debt_procedure_details": "Данные не определены",
          "debt_summary_display": "Долговые и ипотечные обязательства не урегулированы",
          "evidence": []
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о распределении личных/общих долгов и определи код режима (separate_debts_only / joint_debts_exist / mixed / not_defined).
        2. Найди прямую цитату об ипотеке и объекте залога.
        3. Проверь наличие условия о согласии банка/кредитора (ст. 391 ГК РФ).
        4. Найди статус созаёмщика или поручителя.
        5. Проверь процедуру урегулирования долгов при разводе.
        6. Сформируй компактный debt_summary_display.
        7. Если прямой цитаты нет — верни "not_defined". Не додумывай.
        8. Проверь, что все 13 ключей (12 полей + evidence) присутствуют в JSON.
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "debt_allocation_status": "<defined / partial / not_defined>",
          "debt_allocation_regime_code": "<separate_debts_only / joint_debts_exist / mixed / not_defined>",
          "debt_allocation_details": "<текст или 'Данные не определены'>",
          "mortgage_status": "<defined / partial / not_mentioned / not_defined>",
          "mortgage_details": "<текст или 'Данные не определены'>",
          "bank_consent_clause_status": "<defined / not_defined>",
          "bank_consent_details": "<текст или 'Данные не определены'>",
          "co_borrower_status": "<defined / not_applicable / not_defined>",
          "co_borrower_details": "<текст или 'Данные не определены'>",
          "divorce_debt_procedure_status": "<defined / partial / not_defined>",
          "divorce_debt_procedure_details": "<текст или 'Данные не определены'>",
          "debt_summary_display": "<компактная сводка>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 1000

    retrieval:
      retrieval_profile: "credit_facility_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "долги долговые обязательства кредит кредитные обязательства ипотека ипотечный кредит залог недвижимости созаёмщик солидарная ответственность ежемесячный платёж погашение кредита поручительство личные долги общие долги согласие банка перевод долга ст. 45 СК РФ"
      boost_keywords:
        - "долги"
        - "кредит"
        - "ипотека"
        - "созаёмщик"
        - "солидарн"
        - "согласие банка"
        - "перевод долга"
        - "поручительств"
      preferred_unit_types:
        - obligation
        - liability_provision
        - general_provision
      excluded_unit_types:
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - limitations
        - remedies
      negative_keywords:
        - "алименты на несовершеннолетних"
        - "алименты на детей"
        - "содержание ребенка"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.20, 0.85]
        boost: 0.30
        scope: file
      context_k: 8
      max_chunks: 12
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "limitations"
        - "remedies"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 700

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1500

      compact_output: false

      presence_signal:
        field: "debt_mortgage_allocation_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по семейному и банковскому праву. Извлеки из брачного договора
        условия о распределении долгов и кредитов, ипотечных обязательствах, статусе созаёмщика,
        согласии банков-кредиторов и порядке действий при расторжении брака.
        Не анализируй общий режим собственности, алименты или банкротство — это темы других проверок.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 13 полей + evidence (всего 14 ключей):

        0. debt_mortgage_allocation_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (debt_allocation_status, mortgage_status, bank_consent_clause_status,
              co_borrower_status, divorce_debt_procedure_status)
             ≠ "not_defined";
           - "missing" — если все пять содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - debt_allocation_status = "not_defined";
           - debt_allocation_regime_code = "not_defined";
           - mortgage_status = "not_defined";
           - bank_consent_clause_status = "not_defined";
           - co_borrower_status = "not_defined";
           - divorce_debt_procedure_status = "not_defined";
           - все *_details = "Данные не определены";
           - debt_summary_display = "Долговые и ипотечные обязательства не урегулированы";
           - не выполняй остальные шаги.

        1.  debt_allocation_status — defined / partial / not_defined.
        2.  debt_allocation_regime_code — separate_debts_only / joint_debts_exist / mixed / not_defined.
        3.  debt_allocation_details — распределение личных и общих долгов супругов.
        4.  mortgage_status — defined / partial / not_mentioned / not_defined.
        5.  mortgage_details — описание ипотечных обязательств (объект залога, кто платит).
        6.  bank_consent_clause_status — defined / not_defined.
        7.  bank_consent_details — наличие оговорки о необходимости согласия банка-кредитора (ст. 391 ГК РФ).
        8.  co_borrower_status — defined / not_applicable / not_defined.
        9.  co_borrower_details — статус и права второго супруга как созаёмщика / поручителя.
        10. divorce_debt_procedure_status — defined / partial / not_defined.
        11. divorce_debt_procedure_details — порядок переоформления/погашения долгов при расторжении брака.
        12. debt_summary_display — компактная человекочитаемая сводка по долгам и ипотеке для DD Grid.
        13. evidence — массив прямых цитат из договора.

        Если данные полностью отсутствуют в тексте:
        - статус/код = "not_defined";
        - текстовое поле = "Данные не определены";
        - debt_summary_display = "Долговые и ипотечные обязательства не урегулированы".
        </task>

        <context_rules>
        - Перед остальными полями заполни debt_mortgage_allocation_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status/*_code = "not_defined", все *_details = "Данные не определены", debt_summary_display = "Долговые и ипотечные обязательства не урегулированы".
        - Используй только текст договора.
        - debt_allocation_regime_code:
            "separate_debts_only" — каждый супруг отвечает только по своим личным долгам (долги раздельны);
            "joint_debts_exist" — предусмотрены общие долги или солидарная ответственность супругов;
            "mixed" — разные правила для разных типов обязательств (например, потребительские — личные, ипотека — общая);
            "not_defined" — режим долгов не урегулирован.
        - mortgage_status:
            "defined" — ипотечные кредиты прямо урегулированы с указанием объекта/условий;
            "partial" — ипотека упомянута вскользь без подробностей;
            "not_mentioned" — ипотека прямо исключена или указано, что ипотечные обязательства отсутствуют;
            "not_defined" — вопрос не затронут.
        - bank_consent_clause_status:
            "defined" — прямо оговорено, что изменение кредитных обязательств/перевод долга требует согласия кредитора;
            "not_defined" — о согласии банка не упомянуто.
        - debt_summary_display формируется как строка вида:
            "Долги: <раздельные/общие/не урегулированы> / Ипотека: <детали или 'нет'> /
            Созаёмщик: <статус> / Согласие банка: <предусмотрено/нет>".
        - Значение каждого enum-поля — строго из списка allowed_values.
        - Верни только один JSON-объект.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни упоминаний долгов, ни ипотечных обязательств,
           ни статуса созаёмщика.
           → presence = "missing";
             все *_status/*_code = "not_defined";
             все *_details = "Данные не определены";
             debt_summary_display = "Долговые и ипотечные обязательства не урегулированы".

        2. Частичное раскрытие.
           Упомянуты долги, но без конкретики об ипотеке или согласии банка.
           → presence = "present";
             соответствующие *_status = "partial" или "defined";
             *_details содержит описание пробелов.

        3. Противоречие между фрагментами.
           В одном месте указано, что долги раздельные, в другом — что ипотека
           погашается совместно.
           → presence = "unclear";
             debt_allocation_regime_code = "not_defined";
             debt_allocation_details = "Не удалось определить".

        4. Ипотека без согласия банка.
           Договор предусматривает переоформление ипотеки при разводе,
           но не упоминает необходимость согласия банка-кредитора.
           → presence = "present";
             mortgage_status = "defined";
             bank_consent_clause_status = "not_defined";
             debt_summary_display содержит "Согласие банка: не упомянуто".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для debt_mortgage_allocation_check_presence используй только: "present", "missing", "unclear".
        - Для debt_allocation_status, mortgage_status, divorce_debt_procedure_status используй только: "defined", "partial", "not_defined".
        - Для mortgage_status дополнительно используй: "not_mentioned".
        - Для debt_allocation_regime_code используй только: "separate_debts_only", "joint_debts_exist", "mixed", "not_defined".
        - Для bank_consent_clause_status используй только: "defined", "not_defined".
        - Для co_borrower_status используй только: "defined", "not_applicable", "not_defined".
        - Fallback при отсутствии данных:
          * *_details → "Данные не определены";
          * debt_summary_display → "Долговые и ипотечные обязательства не урегулированы".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "debt_mortgage_allocation_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования долговых и ипотечных обязательств. Внутреннее агрегатное signal-поле."
          required: true

        - name: "debt_allocation_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "partial", "not_defined"]
          description: "Статус урегулированности распределения долгов супругов."
          required: true
        - name: "debt_allocation_regime_code"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["separate_debts_only", "joint_debts_exist", "mixed", "not_defined"]
          description: "Режим ответственности супругов по долгам и кредитам."
          required: true
        - name: "debt_allocation_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Распределение долгов"
          description: "Порядок распределения ответственности по личным и общим долгам (ст. 45 СК РФ)."
          required: true
        - name: "mortgage_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "partial", "not_mentioned", "not_defined"]
          description: "Статус урегулирования ипотечных обязательств по договору."
          required: true
        - name: "mortgage_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Ипотечные обязательства"
          description: "Условия погашения ипотеки, распределение бремени платежей и объект залога."
          required: true
        - name: "bank_consent_clause_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус наличия условия о получении согласия банка на изменение кредита (ст. 391 ГК РФ)."
          required: true
        - name: "bank_consent_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Согласие банка-кредитора"
          description: "Условия о согласовании перевода долга и вывода созаёмщика с банком-кредитором."
          required: false
        - name: "co_borrower_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_applicable", "not_defined"]
          description: "Статус определения роли супруга как созаёмщика или поручителя."
          required: true
        - name: "co_borrower_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Статус созаёмщика"
          description: "Правовой статус второго супруга по ипотечному договору (созаёмщик, поручитель, не участвует)."
          required: false
        - name: "divorce_debt_procedure_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "partial", "not_defined"]
          description: "Статус порядка урегулирования долгов при расторжении брака."
          required: true
        - name: "divorce_debt_procedure_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Долги при разводе"
          description: "Порядок переоформления, погашения или компенсации долгов при расторжении брака."
          required: true
        - name: "debt_summary_display"
          type: "string"
          presentation: "summary"
          display_in_grid: true
          display_priority: 4
          label: "Долги и ипотека"
          description: "Компактная сводка долговых и ипотечных условий для отображения в DD Grid."
          required: true

      store_payload: true

  - id: creditor_notification_protection_check
    name: "Уведомление кредиторов (ст. 46 СК РФ) и защита от кредиторов супруга"
    description: >
      Фактографическая проверка исполнения требований ст. 46 СК РФ об обязанности уведомления
      кредиторов о заключении, изменении или расторжении брачного договора, сроков уведомления,
      последствий его неисполнения (ответственность независимо от условий договора), а также
      механизмов защиты личного имущества одного супруга от притязаний кредиторов другого супруга.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 70

    rules:
      keywords:
        - "уведомление кредиторов"
        - "обязанность уведомить кредиторов"
        - "извещение кредиторов"
        - "кредиторы извещаются"
        - "статья 46 СК РФ"
        - "ст. 46 СК РФ"
        - "ответственность перед кредиторами"
        - "независимо от содержания договора"
        - "не отвечает по обязательствам другого супруга"
        - "раздельная ответственность"
        - "обращение взыскания только на имущество должника"
        - "существующие кредиторы"
        - "будущие кредиторы"
        - "взыскание по долгам"
      keyword_mode: "any"
      negative_keywords:
        - "алименты на несовершеннолетних"
        - "алименты на детей"
        - "содержание ребенка"
        - "в целях настоящего"
      regex_patterns:
        - "(?i)уведом(ить|ление|ления|лять)\\s+(своих\\s+)?кредитор"
        - "(?i)ст\\.?\\s*46\\s*СК"
        - "(?i)не\\s+отвечает\\s+по\\s+(долгам|обязательствам)\\s+друг(ого|ой)\\s+супруг"
        - "(?i)раздельн(ая|ой|ую)\\s+ответственност"
        - "(?i)независимо\\s+от\\s+(содержания|условий)\\s+(настоящего\\s+)?договор"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по семейному праву и защите активов.
        Анализируется брачный договор (ст. 45, 46 СК РФ; ст. 391, 451–453 ГК РФ).
        Проверяется только один вопрос: порядок уведомления кредиторов о брачном договоре
        и положения о защите имущества супругов от кредиторов друг друга.
        Ключевые нормы:
        - Ст. 46 п.1 СК РФ: супруг обязан уведомлять своего кредитора (кредиторов) о заключении,
          об изменении или о расторжении брачного договора. При невыполнении этой обязанности
          супруг отвечает по своим обязательствам независимо от содержания брачного договора
          (кредитор вправе требовать выдела доли в общем имуществе по правилам законного режима).
        - Ст. 46 п.2 СК РФ: кредитор супруга-должника вправе требовать изменения условий
          или расторжения кредитного договора в связи с существенным изменнением обстоятельств.
        - Ст. 45 СК РФ: по обязательствам одного из супругов взыскание обращается только на его имущество.
        Важно:
        - Твоя задача — только установить, что прямо зафиксировано в тексте договора.
        - Не оценивай риски самостоятельно вне установленных правил.
        - Не анализируй общий режим собственности, алименты или жилищные права — это темы других проверок.
        [ЗАДАЧА]
        Найди в тексте договора:
        1. Наличие и содержание положения об уведомлении кредиторов (ст. 46 СК РФ).
        2. Срок и порядок направления уведомления кредиторам.
        3. На кого возложена обязанность уведомления (оба супруга / только супруг-должник).
        4. Оговорку о последствиях неуведомления кредиторов.
        5. Положения о защите имущества от ответственности по долгам другого супруга.
        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если тема раскрыта частично — статус = "partial".
        3. Если данные полностью не указаны — статус/код = "not_defined",
           текстовое поле = "Данные не определены".
        4. Не используй "None", "null" или пустые строки.
        5. В evidence включай только текст договора.
        6. Значение каждого enum-поля — строго из списка allowed_values.
        7. Верни РОВНО один валидный JSON-объект со всеми 11 ключами,
           пригодный для парсинга через json.loads без предварительной обработки.
           Без markdown, без ```json, без комментариев, без текста до или после.
           Начни ответ сразу с { и закончи }.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — уведомление кредиторов и защита активов предусмотрены:
        Фрагмент:
        "п. 7.1. Каждый из супругов обязан письменно уведомить своих существующих кредиторов
        о заключении настоящего брачного договора в течение 10 (десяти) рабочих дней с момента
        его нотариального удостоверения, а также уведомлять будущих кредиторов до момента
        заключения любых кредитных договоров и договоров займа.
        п. 7.2. В случае неисполнения обязанности по уведомлению супруг-должник несёт ответственность
        перед своими кредиторами независимо от содержания настоящего договора в соответствии
        с п. 1 ст. 46 СК РФ.
        п. 7.3. Супруг не отвечает по личным обязательствам другого супруга. Взыскание по долгам
        одного из супругов не может быть обращено на раздельное имущество другого супруга."
        Ответ:
        {
          "creditor_notification_status": "defined",
          "creditor_notification_details": "Каждый супруг обязан уведомить кредиторов о заключении договора; уведомляются существующие и будущие кредиторы.",
          "notification_timeline_details": "В течение 10 рабочих дней с момента нотариального удостоверения (существующие кредиторы) и до заключения сделок (будущие кредиторы).",
          "notification_obligor_status": "both_spouses",
          "notification_obligor_details": "Каждый из супругов в отношении своих кредиторов.",
          "non_notification_consequences_status": "statutory_liability",
          "non_notification_consequences_details": "Супруг-должник несёт ответственность перед кредиторами независимо от содержания договора (ст. 46 п.1 СК РФ).",
          "protection_from_creditors_status": "defined",
          "protection_from_creditors_details": "Супруг не отвечает по долгам другого супруга; взыскание не может быть обращено на раздельное имущество супруга-недолжника.",
          "creditor_summary_display": "Уведомление: в течение 10 дн. (оба супруга) / Последствия: ст. 46 СК РФ / Защита имущества: предусмотрена",
          "evidence": [
            {
              "clause_ref": "п. 7.1",
              "quote": "Каждый из супругов обязан письменно уведомить своих существующих кредиторов о заключении настоящего брачного договора в течение 10 (десяти) рабочих дней с момента его нотариального удостоверения."
            },
            {
              "clause_ref": "п. 7.3",
              "quote": "Супруг не отвечает по личным обязательствам другого супруга. Взыскание по долгам одного из супругов не может быть обращено на раздельное имущество другого супруга."
            }
          ]
        }
        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Иные взаимоотношения сторон регулируются нормами Семейного кодекса РФ."
        Ответ:
        {
          "creditor_notification_status": "not_defined",
          "creditor_notification_details": "Данные не определены",
          "notification_timeline_details": "Данные не определены",
          "notification_obligor_status": "not_defined",
          "notification_obligor_details": "Данные не определены",
          "non_notification_consequences_status": "not_defined",
          "non_notification_consequences_details": "Данные не определены",
          "protection_from_creditors_status": "not_defined",
          "protection_from_creditors_details": "Данные не определены",
          "creditor_summary_display": "Уведомление кредиторов и защита от долгов не урегулированы",
          "evidence": []
        }
        Пример 3 — частичные условия (только защита от долгов без срока уведомления):
        Фрагмент:
        "п. 8.1. Супруги не отвечают по обязательствам друг друга.
        Супруги подтверждают, что на момент подписания договора кредиторов не имеют."
        Ответ:
        {
          "creditor_notification_status": "partial",
          "creditor_notification_details": "Стороны заявили об отсутствии кредиторов на момент заключения; порядок уведомления будущих кредиторов не установлен.",
          "notification_timeline_details": "Данные не определены",
          "notification_obligor_status": "not_defined",
          "notification_obligor_details": "Данные не определены",
          "non_notification_consequences_status": "not_defined",
          "non_notification_consequences_details": "Данные не определены",
          "protection_from_creditors_status": "defined",
          "protection_from_creditors_details": "Супруги не отвечают по обязательствам друг друга.",
          "creditor_summary_display": "Уведомление: отсутствие кредиторов заявлено (срок не указан) / Защита: взаимный отказ от ответственности",
          "evidence": [
            {
              "clause_ref": "п. 8.1",
              "quote": "Супруги не отвечают по обязательствам друг друга. Супруги подтверждают, что на момент подписания договора кредиторов не имеют."
            }
          ]
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату об обязанности уведомления кредиторов (ст. 46 СК РФ).
        2. Найди срок и процедуру направления уведомления.
        3. Определи, на кого возложена обязанность (both_spouses / debtor_spouse / not_defined).
        4. Проверь наличие оговорки о последствиях неуведомления (statutory_liability / custom_terms / not_defined).
        5. Найди условие о защите раздельного имущества от долгов другого супруга.
        6. Сформируй компактный creditor_summary_display.
        7. Если прямой цитаты нет — верни "not_defined". Не додумывай.
        8. Проверь, что все 11 ключей (10 полей + evidence) присутствуют в JSON.
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "creditor_notification_status": "<defined / partial / not_defined>",
          "creditor_notification_details": "<текст или 'Данные не определены'>",
          "notification_timeline_details": "<текст или 'Данные не определены'>",
          "notification_obligor_status": "<both_spouses / debtor_spouse / not_defined>",
          "notification_obligor_details": "<текст или 'Данные не определены'>",
          "non_notification_consequences_status": "<statutory_liability / custom_terms / not_defined>",
          "non_notification_consequences_details": "<текст или 'Данные не определены'>",
          "protection_from_creditors_status": "<defined / partial / not_defined>",
          "protection_from_creditors_details": "<текст или 'Данные не определены'>",
          "creditor_summary_display": "<компактная сводка>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 1000

    retrieval:
      retrieval_profile: "notice_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "уведомление кредиторов обязанность уведомить кредиторов кредиторы извещаются ст. 46 СК РФ ответственность перед кредиторами независимо от содержания договора не отвечает по обязательствам другого супруга раздельная ответственность обращение взыскания только на имущество должника"
      boost_keywords:
        - "уведомление кредиторов"
        - "ст. 46 СК"
        - "кредитор"
        - "не отвечает по обязательствам"
        - "взыскание по долгам"
        - "неуведомлен"
      preferred_unit_types:
        - obligation
        - general_provision
        - notice
        - liability_provision
      excluded_unit_types:
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - limitations
        - remedies
      negative_keywords:
        - "алименты на несовершеннолетних"
        - "алименты на детей"
        - "содержание ребенка"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.30, 0.90]
        boost: 0.30
        scope: file
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "limitations"
        - "remedies"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1500

      compact_output: false

      presence_signal:
        field: "creditor_notification_protection_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по семейному праву. Извлеки из брачного договора
        условия об уведомлении кредиторов (ст. 46 СК РФ), сроках и порядке извещения,
        последствиях неуведомления и положениях о защите имущества супругов от взыскания по долгам.
        Не анализируй режим собственности, алименты или жилищные права — это темы других проверок.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 11 полей + evidence (всего 12 ключей):

        0. creditor_notification_protection_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (creditor_notification_status, notification_obligor_status,
              non_notification_consequences_status, protection_from_creditors_status)
             ≠ "not_defined";
           - "missing" — если все четыре содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - creditor_notification_status = "not_defined";
           - notification_obligor_status = "not_defined";
           - non_notification_consequences_status = "not_defined";
           - protection_from_creditors_status = "not_defined";
           - все *_details = "Данные не определены";
           - creditor_summary_display = "Уведомление кредиторов и защита от долгов не урегулированы";
           - не выполняй остальные шаги.

        1.  creditor_notification_status — defined / partial / not_defined.
        2.  creditor_notification_details — содержание положения об уведомлении кредиторов.
        3.  notification_timeline_details — срок и порядок направления уведомления кредиторам.
        4.  notification_obligor_status — both_spouses / debtor_spouse / not_defined.
        5.  notification_obligor_details — на кого конкретно возложена обязанность уведомления.
        6.  non_notification_consequences_status — statutory_liability / custom_terms / not_defined.
        7.  non_notification_consequences_details — последствия неуведомления кредиторов по договору.
        8.  protection_from_creditors_status — defined / partial / not_defined.
        9.  protection_from_creditors_details — механизмы защиты имущества от ответственности по долгам другого супруга.
        10. creditor_summary_display — компактная человекочитаемая сводка для DD Grid.
        11. evidence — массив прямых цитат из договора.

        Если данные полностью отсутствуют в тексте:
        - статус/код = "not_defined";
        - текстовое поле = "Данные не определены";
        - creditor_summary_display = "Уведомление кредиторов и защита от долгов не урегулированы".
        </task>

        <context_rules>
        - Перед остальными полями заполни creditor_notification_protection_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status/*_code = "not_defined", все *_details = "Данные не определены", creditor_summary_display = "Уведомление кредиторов и защита от долгов не урегулированы".
        - Используй только текст договора.
        - notification_obligor_status:
            "both_spouses" — обязанность возложена на обоих супругов (каждый уведомляет своих кредиторов);
            "debtor_spouse" — обязанность возложена исключительно на супруга-должника / заёмщика;
            "not_defined" — конкретный субъект обязанности не определён.
        - non_notification_consequences_status:
            "statutory_liability" — договор воспроизводит норму ст. 46 СК РФ (ответственность независимо от условий договора);
            "custom_terms" — договором установлены специальные договорные штрафы/убытки за неуведомление;
            "not_defined" — последствия неуведомления не оговорены.
        - creditor_summary_display формируется как строка вида:
            "Уведомление: <срок или 'не указан'> (<кто уведомляет>) /
            Последствия: <ст. 46 СК РФ / договорные / не указаны> /
            Защита имущества: <предусмотрена / нет>".
        - Значение каждого enum-поля — строго из списка allowed_values.
        - Верни только один JSON-объект.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни упоминаний уведомления кредиторов, ни положений
           о защите имущества от долгов другого супруга.
           → presence = "missing";
             все *_status/*_code = "not_defined";
             все *_details = "Данные не определены";
             creditor_summary_display = "Уведомление кредиторов и защита от долгов не урегулированы".

        2. Частичное раскрытие.
           Упомянута защита от долгов другого супруга, но не установлен
           порядок уведомления кредиторов.
           → presence = "present";
             protection_from_creditors_status = "defined";
             creditor_notification_status = "not_defined" или "partial";
             creditor_summary_display содержит "срок не указан".

        3. Противоречие между фрагментами.
           В одном месте указано, что супруги уведомляют кредиторов,
           в другом — что кредиторы отсутствуют и уведомление не требуется.
           → presence = "unclear";
             creditor_notification_status = "not_defined";
             creditor_notification_details = "Не удалось определить".

        4. Ссылка на закон без конкретизации процедуры.
           Договор содержит общую формулировку "Стороны обязаны уведомлять
           кредиторов в соответствии с законом", но без указания сроков
           и порядка уведомления.
           → presence = "present";
             creditor_notification_status = "partial";
             notification_timeline_details = "Данные не определены".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для creditor_notification_protection_check_presence используй только: "present", "missing", "unclear".
        - Для creditor_notification_status, protection_from_creditors_status используй только: "defined", "partial", "not_defined".
        - Для notification_obligor_status используй только: "both_spouses", "debtor_spouse", "not_defined".
        - Для non_notification_consequences_status используй только: "statutory_liability", "custom_terms", "not_defined".
        - Fallback при отсутствии данных:
          * *_details → "Данные не определены";
          * creditor_summary_display → "Уведомление кредиторов и защита от долгов не урегулированы".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "creditor_notification_protection_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования уведомления кредиторов и защиты от долгов. Внутреннее агрегатное signal-поле."
