        Пример 3 — частичное раскрытие с юридическим риском:
        Фрагмент:
        "Всё имущество, находящееся в собственности супругов, включая имущество,
        полученное любым из них в дар от третьих лиц в период брака, является
        совместной собственностью супругов. Раздел имущества регулируется
