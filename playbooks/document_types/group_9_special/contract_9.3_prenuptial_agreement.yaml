        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        [ЗАДАЧА]
        Найди в тексте договора:
        1. Перечислены ли конкретные объекты недвижимости.
        2. Механизм раздела (переход конкретному супругу / пропорционально / компенсация).
        3. Урегулированность ипотечных обязательств.
        4. Указаны ли сроки передачи.
        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если данные не указаны прямо — возвращай "not_defined".
        3. Если текстового значения нет — возвращай строго "Данные не определены".
        4. В evidence включай только текст договора.
        5. Верни только один JSON-объект.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1:
        Фрагмент:
        "При расторжении брака квартира по адресу: г. Москва, ул. Ленина, д. 5, кв. 12,
        кадастровый номер 77:06:0001001:123, переходит в собственность Супруги.
        Супругу выплачивается компенсация в размере 5 000 000 рублей в течение 6 месяцев."
        Ответ:
        {
          "real_estate_objects_status": "defined",
          "real_estate_objects_details": "квартира по адресу: г. Москва, ул. Ленина, д. 5, кв. 12, кадастровый номер 77:06:0001001:123",
          "division_mechanism_code": "to_specific_spouse",
          "division_mechanism_details": "переходит в собственность Супруги",
          "mortgage_obligations_addressed": "not_defined",
          "transfer_timeline_status": "defined",
          "transfer_timeline_details": "в течение 6 месяцев",
          "evidence": [
            {
              "clause_ref": "п. 5.1",
              "quote": "При расторжении брака квартира по адресу: г. Москва, ул. Ленина, д. 5, кв. 12, кадастровый номер 77:06:0001001:123, переходит в собственность Супруги."
            }
          ]
        }
        Пример 2:
        Фрагмент:
        "Стороны определяют режим имущества."
        Ответ:
        {
          "real_estate_objects_status": "not_defined",
          "real_estate_objects_details": "Данные не определены",
          "division_mechanism_code": "not_defined",
          "division_mechanism_details": "Данные не определены",
          "mortgage_obligations_addressed": "not_defined",
          "transfer_timeline_status": "not_defined",
          "transfer_timeline_details": "Данные не определены",
          "evidence": []
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о перечне объектов недвижимости.
        2. Найди прямую цитату о механизме раздела.
        3. Найди прямую цитату об ипотечных обязательствах.
        4. Найди прямую цитату о сроках передачи.
        5. Если прямой цитаты нет — верни "not_defined". Не додумывай.
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "real_estate_objects_status": "<defined / not_defined>",
          "real_estate_objects_details": "<перечень или 'Данные не определены'>",
          "division_mechanism_code": "<to_specific_spouse / proportional / compensation / not_defined>",
          "division_mechanism_details": "<текст или 'Данные не определены'>",
          "mortgage_obligations_addressed": "<defined / not_defined>",
          "transfer_timeline_status": "<defined / not_defined>",
          "transfer_timeline_details": "<сроки или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 7
      temperature: 0.0
      max_tokens: 600

    retrieval:
      retrieval_profile: "definitions_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "квартира жилой дом земельный участок при расторжении брака переходит остаётся в собственности компенсация за долю ипотека ипотечный кредит кадастровый номер при расторжении брака при разводе раздел имущества"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "режим собственности"
        - "совместная собственность"
        - "раздельная собственность"
        - "алименты"
        - "банкротство"
        - "споры"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.25, 0.80]
        boost: 0.12
        scope: segment
      context_k: 7
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
