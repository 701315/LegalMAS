  - id: source_of_funds_commingling_check
    name: "Источники финансирования и предотвращение смешения активов"
    description: >
      Фактографическая проверка наличия механизмов, предотвращающих смешение (commingling) 
      личного добрачного имущества и имущества, приобретённого в браке. Проверка условий 
      о том, что имущество, купленное в браке на средства, вырученные от отчуждения 
      личного добрачного имущества, сохраняет статус личной собственности.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 160

    rules:
      keywords:
        - "источник финансирования"
        - "личные средства"
        - "добрачные средства"
        - "средства от продажи"
        - "смешение активов"
        - "смешение имущества"
        - "сохраняет статус личной"
        - "не становится совместной"
        - "трансформация имущества"
        - "отчуждение личного имущества"
      keyword_mode: "any"
      negative_keywords:
        - "алименты на детей"
        - "в целях настоящего"
      regex_patterns:
        - "(?i)средств(а|ами|ам|ах)\\s+(от\\s+продажи|вырученн|личн|добрачн)"
        - "(?i)(смешен|смешени|трансформаци)[^\\.]{0,40}(имуществ|актив)"
        - "(?i)сохраня(ет|ют)\\s+статус\\s+(личной|раздельной)\\s+собственност"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по семейному праву. Анализируется брачный договор.
        Проверяется наличие условий, предотвращающих смешение (commingling) личного и совместного имущества.
        Ключевая проблема: если супруг продаёт добрачную квартиру и на эти деньги покупает новую в браке, 
        без прямой оговорки новая квартира может быть признана совместной собственностью.
        [ЗАДАЧА]
        Найди в тексте договора:
        1. Прямое указание, что имущество, приобретённое в браке на личные/добрачные средства, остаётся личным.
        2. Механизм подтверждения источника средств (выписки, расписки, ссылки на договоры продажи).
        3. Условие о недопустимости признания такого имущества совместным из-за смешения средств.
        [ПРАВИЛА]
        Верни валидный JSON. Используй только текст документа. Не додумывай.
        [ФОРМАТ ОТВЕТА]
        {
          "commingling_prevention_status": "<defined / partial / not_defined>",
          "commingling_prevention_details": "<текст или 'Данные не определены'>",
          "source_of_funds_tracking_status": "<defined / not_defined>",
          "source_of_funds_tracking_details": "<текст или 'Данные не определены'>",
          "source_of_funds_summary_display": "<компактная сводка>"
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 800

    retrieval:
      retrieval_profile: "title_transfer_check"
      corpus_scope: "primary_segment"
      levels: ["legal_unit", "section"]
      required_kind: "legal_unit"
      retrieval_query: "источник финансирования личные средства добрачные средства смешение активов сохраняет статус личной отчуждение личного имущества"
      boost_keywords: ["смешени", "личные средств", "добрачн", "сохраняет статус"]
      preferred_unit_types: ["obligation", "general_provision", "representations"]
      excluded_unit_types: ["structural_anchor", "technical_fragment"]
      negative_keywords: ["алименты", "в целях настоящего"]
      context_k: 6
      max_chunks: 8
      rerank: true

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1200

      compact_output: false

      presence_signal:
        field: "source_of_funds_commingling_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>Ты — российский юрист по семейному праву. Извлеки условия о предотвращении смешения активов и отслеживании источников финансирования.</role>

        <context>
        {context}
        </context>

        <task>
        0. source_of_funds_commingling_check_presence:
           - "present" — если commingling_prevention_status или source_of_funds_tracking_status ≠ "not_defined";
           - "missing" — если оба = "not_defined";
           - "unclear" — при противоречиях.
           Если presence = "missing": все *_status = "not_defined", *_details = "Данные не определены", source_of_funds_summary_display = "Защита от смешения активов не урегулирована".
        1. commingling_prevention_status — defined / partial / not_defined.
        2. commingling_prevention_details — условие о сохранении статуса личного имущества при покупке в браке на личные средства.
        3. source_of_funds_tracking_status — defined / not_defined.
        4. source_of_funds_tracking_details — механизм подтверждения источника средств (документы, ссылки).
        5. source_of_funds_summary_display — компактная сводка.
        </task>

        <context_rules>
        - Перед остальными полями заполни source_of_funds_commingling_check_presence по правилу из пункта 0.
        - Если фрагментов нет — presence = "missing".
        - commingling_prevention_status: "defined" — есть прямая оговорка о сохранении статуса; "partial" — упомянута, но без деталей; "not_defined" — нет.
        - source_of_funds_summary_display: "Смешение активов: <предотвращено/частично/не урегулировано> / Отслеживание источников: <есть/нет>".
        </context_rules>

        <edge_cases>
        1. Полное отсутствие. → presence = "missing", все not_defined.
        2. Общая фраза без механизма. → presence = "present", commingling_prevention_status = "partial", tracking = "not_defined".
        3. Противоречие. → presence = "unclear", details = "Не удалось определить".
        4. Полная защита. → presence = "present", оба статуса "defined".
        </edge_cases>

        <output_expectations>
        - Используй только разрешённые значения enum.
        - Fallback: "Данные не определены" или "Защита от смешения активов не урегулирована".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "source_of_funds_commingling_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования предотвращения смешения активов."
          required: true
        - name: "commingling_prevention_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "partial", "not_defined"]
          description: "Статус оговорки о недопустимости трансформации личного имущества в совместное."
          required: true
        - name: "commingling_prevention_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Защита от смешения"
          description: "Условие о сохранении статуса личной собственности при приобретении имущества в браке на личные средства."
          required: true
        - name: "source_of_funds_tracking_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус наличия механизма документального подтверждения источника средств."
          required: true
        - name: "source_of_funds_tracking_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Отслеживание источников"
          description: "Требования к документам, подтверждающим происхождение средств (выписки, договоры)."
          required: true
        - name: "source_of_funds_summary_display"
          type: "string"
          presentation: "summary"
          display_in_grid: true
          display_priority: 3
          label: "Смешение активов"
          description: "Сводка условий о предотвращении смешения личного и совместного имущества."
          required: true

      store_payload: true

