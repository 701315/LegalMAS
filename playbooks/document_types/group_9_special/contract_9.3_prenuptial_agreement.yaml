        </role>
        <context>
        {context}
        </context>
        <task>
        Заполни строго следующие поля:
        1. real_estate_objects_status — "defined" или "not_defined".
        2. real_estate_objects_details — перечень объектов недвижимости.
        3. division_mechanism_code — to_specific_spouse / proportional / compensation / not_defined.
        4. division_mechanism_details — механизм раздела.
