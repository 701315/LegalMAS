      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1400

      compact_output: false

      presence_signal:
        field: "business_assets_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по семейному и корпоративному праву. Извлеки из
        брачного договора режим бизнес-активов, доходов от предпринимательской
        деятельности, интеллектуальной собственности, а также условия защиты
        корпоративных прав и сценарий при расторжении брака.
        Не анализируй общий режим собственности, алименты, жилищные права
        или банкротство — это темы других проверок.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 14 полей + evidence (всего 15 ключей):

        0. business_assets_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (business_assets_regime_code, business_income_regime_code,
              ip_rights_regime_code, pre_existing_business_status,
              specific_companies_status, voting_rights_status)
             ≠ "not_defined";
           - "missing" — если все шесть содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - business_assets_regime_code = "not_defined";
           - business_income_regime_code = "not_defined";
           - ip_rights_regime_code = "not_defined";
           - pre_existing_business_status = "not_defined";
           - specific_companies_status = "not_defined";
           - voting_rights_status = "not_defined";
           - все *_details = "Данные не определены";
           - business_summary_display = "Бизнес-активы не урегулированы";
           - не выполняй остальные шаги.

        1.  business_assets_regime_code — separate / joint / mixed / not_defined.
        2.  business_assets_regime_details — режим бизнес-активов (доли, акции).
        3.  business_income_regime_code — separate / joint / mixed / not_defined.
        4.  business_income_regime_details — режим доходов от предпринимательской
            деятельности.
        5.  ip_rights_regime_code — personal_and_separate / separate_exclusive_only /
            joint / mixed / not_defined.
        6.  ip_rights_regime_details — режим интеллектуальной собственности.
        7.  pre_existing_business_status — defined / partial / not_defined.
        8.  pre_existing_business_details — разграничение бизнеса до брака и в браке.
        9.  specific_companies_status — defined / partial / not_defined.
        10. specific_companies_details — перечень конкретных компаний с ИНН.
        11. voting_rights_status — protected / shared / not_defined.
        12. divorce_scenario_details — сценарий при расторжении брака.
        13. business_summary_display — компактная сводка для DD Grid.
        14. evidence — массив прямых цитат из договора.

        Если данные полностью отсутствуют в тексте:
        - код/статус = "not_defined";
        - текстовое поле = "Данные не определены";
        - business_summary_display = "Бизнес-активы не урегулированы".
        </task>

        <context_rules>
        - Перед остальными полями заполни business_assets_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_code/*_status = "not_defined", все *_details = "Данные не определены", business_summary_display = "Бизнес-активы не урегулированы".
        - Используй только текст договора.
        - business_assets_regime_code:
            "separate" — бизнес-активы (доли, акции) — раздельная/личная
              собственность одного супруга;
            "joint" — бизнес-активы — совместная собственность;
            "mixed" — разные режимы для разных бизнес-активов;
            "not_defined" — режим не определён.
        - business_income_regime_code:
            "separate" — доходы от предпринимательской деятельности — раздельная
              собственность (отступление от ст. 34 п.2 СК РФ);
            "joint" — доходы — совместная собственность (совпадает с законом);
            "mixed" — разные правила для разных видов доходов;
            "not_defined" — режим не определён.
        - ip_rights_regime_code:
            "personal_and_separate" — и личные неимущественные, и исключительные
              (имущественные) права — принадлежат автору;
            "separate_exclusive_only" — исключительные права — раздельная
              собственность; о личных неимущественных не сказано (они неотчуждаемы
              по закону, ст. 1228 ГК РФ);
            "joint" — исключительные права — совместная собственность;
            "mixed" — разные правила для разных объектов IP;
            "not_defined" — режим не определён.
        - voting_rights_status:
            "protected" — право голоса и управление осуществляются исключительно
              супругом-предпринимателем; второй супруг не вправе участвовать
              в управлении;
            "shared" — корпоративные права управления могут быть разделены
              или переданы второму супругу;
            "not_defined" — вопрос не раскрыт.
        - divorce_scenario_details — описывай ТО, ЧТО ЕСТЬ:
            "Супруга получает компенсацию в размере действительной стоимости доли";
            "Доли не подлежат разделу"; "Не урегулировано" и т.п.
        - business_summary_display формируется как строка вида:
            "Бизнес: <режим> / Доходы: <режим> / IP: <режим> /
            Компании: <число или 'не указаны'> / При разводе: <сценарий>".
        - Значение каждого enum-поля — строго из списка allowed_values.
        - Верни только один JSON-объект.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни упоминаний бизнес-активов, ни доходов от
           предпринимательской деятельности, ни интеллектуальной собственности.
           → presence = "missing";
             все *_code/*_status = "not_defined";
             все *_details = "Данные не определены";
             business_summary_display = "Бизнес-активы не урегулированы".

        2. Частичное раскрытие.
           Упомянуты бизнес-активы, но без конкретики о доходах, IP или
           сценарии при расторжении.
           → presence = "present";
             соответствующие *_status = "partial" или "defined";
             *_details содержит описание пробелов.

        3. Противоречие между фрагментами.
           В одном месте указано, что доли — раздельная собственность,
           в другом — что доходы от бизнеса — совместная собственность
           без разграничения.
           → presence = "unclear";
             соответствующий *_code = "not_defined";
             *_details = "Не удалось определить".

        4. Защита корпоративных прав без компенсации.
           Право голоса закреплено за одним супругом, но сценарий компенсации
           при расторжении брака не указан.
           → presence = "present";
             voting_rights_status = "protected";
             divorce_scenario_details = "Не урегулировано".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для business_assets_check_presence используй только: "present", "missing", "unclear".
        - Для business_assets_regime_code, business_income_regime_code используй только: "separate", "joint", "mixed", "not_defined".
        - Для ip_rights_regime_code используй только: "personal_and_separate", "separate_exclusive_only", "joint", "mixed", "not_defined".
        - Для pre_existing_business_status, specific_companies_status используй только: "defined", "partial", "not_defined".
        - Для voting_rights_status используй только: "protected", "shared", "not_defined".
        - Fallback при отсутствии данных:
          * *_details → "Данные не определены";
          * business_summary_display → "Бизнес-активы не урегулированы".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "business_assets_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования бизнес-активов и корпоративных прав. Внутреннее агрегатное signal-поле."
