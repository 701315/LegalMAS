  - id: property_regime_check
    name: "Режим собственности: добрачное имущество, брачное имущество, наследство, перечень объектов"
    description: >
      Фактографическая проверка режима собственности по брачному договору:
      добрачное имущество каждого супруга, имущество, нажитое в браке,
      имущество, полученное по наследству и в дар (императивно личное по ст. 36 СК РФ),
      временной охват (существующее / будущее имущество, ст. 42 п.2 СК РФ),
      специальные режимы для отдельных категорий имущества (недвижимость, доли в бизнесе,
      банковские счета, ценные бумаги) и наличие конкретного перечня объектов
      с идентификацией (кадастровые номера, реквизиты).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 20

    rules:
      keywords:
        - "режим собственности"
        - "совместная собственность"
        - "раздельная собственность"
        - "долевая собственность"
        - "личная собственность"
        - "смешанный режим"
        - "добрачное имущество"
        - "имущество, нажитое в браке"
        - "имущество, нажитое во время брака"
        - "приобретённое в браке"
        - "приобретённое до брака"
        - "принадлежит каждому"
        - "принадлежит на праве"
        - "по наследству"
        - "в порядке наследования"
        - "в дар"
        - "по договору дарения"
        - "безвозмездно"
        - "приложение"
        - "перечень имущества"
        - "перечень объектов"
        - "кадастровый номер"
        - "недвижимое имущество"
        - "транспортное средство"
        - "доля в уставном капитале"
        - "акции"
        - "ценные бумаги"
        - "банковский счёт"
        - "будущее имущество"
        - "имеющееся имущество"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(совместн|раздельн|долев|личн)(ая|ой|ую)\\s+собственност"
        - "(?i)режим\\s+(совместной|раздельной|долевой|смешанн|личн)"
        - "(?i)имущество[^\\.]{0,80}нажит(ое|ого)\\s+в\\s+(период\\s+)?брак"
        - "(?i)(по\\s+наследств|в\\s+дар|безвозмездн|в\\s+порядке\\s+наследован)"
        - "(?i)\\b\\d{2}:\\d{2}:\\d{6,7}:\\d+\\b"
        - "(?i)(приложени|перечен|перечисл)[^\\.]{0,50}(имуществ|объектов|активов)"
        - "(?i)(долей|доли|акци)[^\\.]{0,50}(уставн|обществ|капитал)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по семейному праву.
        Анализируется брачный договор (ст. 33, 36, 42 СК РФ).
        Проверяется только один вопрос: режим собственности на имущество супругов.
        Важно:
        - Законный режим по умолчанию — совместная собственность (ст. 33 СК РФ).
        - Наследство, дар и безвозмездно полученное имущество — императивно личная
          собственность каждого супруга (ст. 36 СК РФ). Договор может это подтвердить;
          попытка сделать «совместным» подаренное — юридический риск.
        - Режим может определяться как для уже имеющегося, так и для будущего
          имущества (ст. 42 п.2 СК РФ).
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Не анализируй раздел имущества при расторжении, компенсации, алименты,
          банкротство — это темы других проверок.
        [ЗАДАЧА]
        Найди в тексте договора:
        1. Режим добрачного имущества каждого супруга.
        2. Режим имущества, нажитого в браке.
        3. Режим имущества, полученного по наследству и в дар (соответствие ст. 36 СК РФ).
        4. Временной охват — распространяется ли договор на существующее и/или
           будущее имущество.
        5. Специальные режимы для отдельных категорий (недвижимость, доли в ООО,
           акции, банковские счета, транспорт).
        6. Наличие конкретного перечня объектов и ссылки на приложение.
        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если тема раскрыта частично (например, режим упомянут, но объекты
           не перечислены) — статус = "partial".
        3. Если данные полностью не указаны — статус = "not_defined",
           текстовое поле = "Данные не определены".
        4. Не используй "None", "null" или пустые строки.
        5. В evidence включай только текст договора.
        6. Значение каждого enum-поля — строго из списка allowed_values.
        7. Верни РОВНО один валидный JSON-объект со всеми 19 ключами,
           пригодный для парсинга через json.loads без предварительной обработки.
           Без markdown, без ```json, без комментариев, без текста до или после.
           Начни ответ сразу с { и закончи }.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — режимы определены, есть перечень:
        Фрагмент:
        "п. 2.1. Имущество, приобретённое каждым из супругов до брака, а также
        полученное в период брака в порядке наследования или по договору дарения,
        является личной собственностью того супруга, кому оно принадлежало
        или было получено.
        п. 2.2. Имущество, нажитое супругами в период брака, является раздельной
        собственностью того супруга, на чьё имя оно приобретено или зарегистрировано.
        п. 2.3. Настоящий договор распространяется как на имущество, имеющееся
        у супругов на момент заключения договора, так и на имущество, которое
        может быть приобретено ими в будущем.
        п. 2.4. Доли в уставных капиталах хозяйственных обществ, приобретённые
        любым из супругов в период брака, являются его личной собственностью
        независимо от источника средств.
        п. 2.5. Перечень имущества, имеющегося у супругов на дату заключения
        настоящего договора, приведён в Приложении № 1, являющемся неотъемлемой
        частью договора."
        Ответ:
        {
          "premarital_regime_status": "defined",
          "premarital_regime_code": "remains_personal",
          "premarital_regime_details": "Имущество, приобретённое каждым из супругов до брака, остаётся его личной собственностью.",
          "marital_regime_status": "defined",
          "marital_regime_code": "separate",
          "marital_regime_details": "Имущество, нажитое в браке, — раздельная собственность того супруга, на чьё имя оно приобретено или зарегистрировано.",
          "inherited_gifted_regime_status": "defined",
          "inherited_gifted_regime_code": "remains_personal",
          "inherited_gifted_regime_details": "Наследство и дар — личная собственность получившего супруга (соответствует ст. 36 СК РФ).",
          "temporal_scope_status": "defined",
          "temporal_scope_code": "both",
          "temporal_scope_details": "Договор распространяется на имеющееся и будущее имущество.",
          "special_regimes_status": "defined",
          "special_regimes_details": "Доли в уставных капиталах хозяйственных обществ — личная собственность приобретшего супруга.",
          "assets_inventory_status": "defined",
          "assets_inventory_details": "Перечень имущества приведён в Приложении № 1.",
          "inventory_appendix_reference": "Приложение № 1",
          "regime_summary_display": "Добрачное: личное / В браке: раздельное / Наследство и дар: личное / Охват: имеющееся + будущее",
          "evidence": [
