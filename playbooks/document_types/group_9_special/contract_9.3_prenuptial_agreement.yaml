  # ──────────────────────────────────────────────────────────────────────────
  - id: parties_notarial_effective_date_check
    name: "Стороны, статус брака, нотариальная форма и момент вступления в силу"
    description: >
      Фактографическая проверка идентификации сторон, статуса отношений
      (prenuptial / postnuptial), нотариального удостоверения (ст. 41 СК РФ)
      и момента вступления договора в силу.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "супруг"
        - "супруга"
        - "лицо, вступающее в брак"
        - "муж"
        - "жена"
        - "паспорт"
        - "гражданин"
        - "гражданка"
        - "зарегистрирован брак"
        - "свидетельство о заключении брака"
        - "нотариальное удостоверение"
        - "нотариус"
        - "удостоверено нотариусом"
        - "реестр нотариальных действий"
        - "вступает в силу"
        - "с момента регистрации брака"
        - "с момента нотариального удостоверения"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)паспорт\\s+серия\\s+\\d{4}\\s+№?\\s*\\d{6}"
        - "(?i)(супруг|супруга|муж|жена)\\s*[-—:]"
        - "(?i)свидетельств(о|а)\\s+о\\s+(заключении|регистрации)\\s+брака"
        - "(?i)удостоверен(о|а)\\s+нотариусом"
        - "(?i)нотариальн(ое|ого|ым)\\s+удостоверен"
        - "(?i)реестр(а|е)?\\s+нотариальн"
        - "(?i)вступает\\s+в\\s+силу\\s+(с\\s+момента|со\\s+дня)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по семейному праву.
        Анализируется брачный договор (Глава 8 СК РФ, ст. 40, 41).
        Проверяется только один вопрос: идентификация сторон, статус отношений,
        нотариальное удостоверение и момент вступления в силу.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        [ЗАДАЧА]
        Найди в тексте договора:
        1. ФИО и паспортные данные первого супруга.
        2. ФИО и паспортные данные второго супруга.
        3. Статус отношений на момент заключения (вступающие в брак / супруги).
        4. Дату и номер свидетельства о браке (если брак заключён).
        5. Наличие нотариального удостоверения, ФИО нотариуса, номер в реестре.
        6. Момент вступления договора в силу.
        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если данные не указаны прямо — возвращай "not_defined".
        3. Если текстового значения нет — возвращай строго "Данные не определены".
        4. Не используй "None", "null", "not_defined", "not_defined" или пустые строки.
        5. В evidence включай только текст договора.
        6. Верни только один JSON-объект.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — данные определены:
        Фрагмент:
        "Иванов Иван Иванович, паспорт серия 45 00 № 123456, и Петрова Мария Сергеевна,
        паспорт серия 45 01 № 654321, вступающие в брак, заключили настоящий брачный
        договор. Договор вступает в силу с момента государственной регистрации брака.
        Удостоверено нотариусом г. Москвы Сидоровой А.Б., реестр № 77-АА-123456."
        Ответ:
        {
          "spouse_1_name_status": "defined",
          "spouse_1_name_value": "Иванов Иван Иванович, паспорт серия 45 00 № 123456",
          "spouse_2_name_status": "defined",
          "spouse_2_name_value": "Петрова Мария Сергеевна, паспорт серия 45 01 № 654321",
          "marital_status": "prenuptial",
          "marriage_registration_status": "not_defined",
          "notarial_status": "certified",
          "notary_name_status": "defined",
          "notary_name_value": "нотариус г. Москвы Сидорова А.Б.",
          "registry_number_status": "defined",
          "registry_number_value": "реестр № 77-АА-123456",
          "effective_date_status": "defined",
          "effective_date_details": "с момента государственной регистрации брака",
          "evidence": [
            {
              "clause_ref": "преамбула",
              "quote": "Иванов Иван Иванович, паспорт серия 45 00 № 123456, и Петрова Мария Сергеевна, паспорт серия 45 01 № 654321, вступающие в брак, заключили настоящий брачный договор."
            }
          ]
        }
        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Настоящий договор заключён между супругами."
        Ответ:
        {
          "spouse_1_name_status": "not_defined",
          "spouse_1_name_value": "Данные не определены",
          "spouse_2_name_status": "not_defined",
          "spouse_2_name_value": "Данные не определены",
          "marital_status": "postnuptial",
          "marriage_registration_status": "not_defined",
          "notarial_status": "not_defined",
          "notary_name_status": "not_defined",
          "notary_name_value": "Данные не определены",
          "registry_number_status": "not_defined",
          "registry_number_value": "Данные не определены",
          "effective_date_status": "not_defined",
          "effective_date_details": "Данные не определены",
          "evidence": []
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату с ФИО первого супруга.
        2. Найди прямую цитату с ФИО второго супруга.
        3. Определи статус отношений по тексту (вступающие в брак / супруги).
        4. Найди прямую цитату о нотариальном удостоверении.
        5. Найди прямую цитату о моменте вступления в силу.
        6. Если прямой цитаты нет — верни "not_defined". Не додумывай.
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "spouse_1_name_status": "<defined / not_defined>",
          "spouse_1_name_value": "<ФИО и паспорт или 'Данные не определены'>",
          "spouse_2_name_status": "<defined / not_defined>",
          "spouse_2_name_value": "<ФИО и паспорт или 'Данные не определены'>",
          "marital_status": "<prenuptial / postnuptial / not_defined>",
          "marriage_registration_status": "<defined / not_defined>",
          "notarial_status": "<certified / mentioned / not_defined>",
          "notary_name_status": "<defined / not_defined>",
          "notary_name_value": "<ФИО нотариуса или 'Данные не определены'>",
          "registry_number_status": "<defined / not_defined>",
          "registry_number_value": "<номер или 'Данные не определены'>",
          "effective_date_status": "<defined / not_defined>",
          "effective_date_details": "<момент вступления или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 650

    retrieval:
      retrieval_profile: "party_identification_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "супруг супруга муж жена лицо вступающее в брак паспорт гражданин гражданка свидетельство о заключении брака нотариальное удостоверение нотариус реестр нотариальных действий вступает в силу с момента регистрации брака с момента нотариального удостоверения"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - representations
        - definitions
        - boilerplate
      negative_keywords:
        - "режим собственности"
        - "совместная собственность"
        - "раздельная собственность"
        - "долевая собственность"
        - "имущество нажитое в браке"
        - "алименты"
        - "компенсация"
        - "недвижимость"
        - "ипотека"
        - "банкротство"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 0.20]
        boost: 0.35
        scope: segment
      context_k: 6
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "representations"
        - "definitions"
        - "boilerplate"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.15

    evidence:
      required: true
      min_snippet_length: 50
      max_snippet_length: 800

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 1400
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по семейному праву. Извлеки из брачного договора
        сведения о сторонах, статусе отношений, нотариальном удостоверении
        и моменте вступления в силу.
        Не анализируй режим собственности, алименты, раздел имущества или банкротство.
        </role>
        <context>
        {context}
        </context>
        <task>
        Заполни строго следующие поля:
        1. spouse_1_name_status — "defined" или "not_defined".
        2. spouse_1_name_value — ФИО и паспорт первого супруга.
        3. spouse_2_name_status — "defined" или "not_defined".
        4. spouse_2_name_value — ФИО и паспорт второго супруга.
        5. marital_status — prenuptial / postnuptial / not_defined.
        6. marriage_registration_status — "defined" или "not_defined".
        7. notarial_status — certified / mentioned / not_defined.
        8. notary_name_status — "defined" или "not_defined".
        9. notary_name_value — ФИО нотариуса.
        10. registry_number_status — "defined" или "not_defined".
        11. registry_number_value — номер в реестре.
        12. effective_date_status — "defined" или "not_defined".
        13. effective_date_details — момент вступления в силу.
        Если данные отсутствуют в тексте:
        - статус = "not_defined"
        - текстовое поле = "Данные не определены"
        </task>
        <rules>
        - Используй только текст договора.
        - marital_status: "prenuptial" — если прямо указано, что стороны вступают в брак;
          "postnuptial" — если прямо указано, что стороны состоят в браке;
          "not_defined" — если статус прямо не указан.
        - notarial_status: "certified" — есть удостоверительная надпись нотариуса;
          "mentioned" — упоминается необходимость удостоверения, но надписи нет;
          "not_defined" — вопрос не раскрыт.
        - Верни только JSON.
        </rules>
      fields:
        - name: "spouse_1_name_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус идентификации первого супруга."
          required: true
        - name: "spouse_1_name_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Супруг 1"
          description: "ФИО и паспортные данные первого супруга."
          required: true
        - name: "spouse_2_name_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус идентификации второго супруга."
          required: true
        - name: "spouse_2_name_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Супруг 2"
          description: "ФИО и паспортные данные второго супруга."
          required: true
        - name: "marital_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["prenuptial", "postnuptial", "not_defined"]
          description: "Статус отношений на момент заключения."
          required: true
        - name: "marriage_registration_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус реквизитов свидетельства о браке."
          required: false
        - name: "notarial_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["certified", "mentioned", "not_defined"]
          description: "Статус нотариального удостоверения."
          required: true
        - name: "notary_name_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания ФИО нотариуса."
          required: false
        - name: "notary_name_value"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Нотариус"
          description: "ФИО нотариуса, удостоверившего договор."
          required: false
        - name: "registry_number_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус номера в реестре."
          required: false
        - name: "registry_number_value"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Номер в реестре"
          description: "Номер в реестре нотариальных действий."
          required: false
        - name: "effective_date_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания момента вступления в силу."
          required: true
        - name: "effective_date_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Момент вступления в силу"
          description: "Момент вступления договора в силу."
          required: false
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 2: Режим собственности на имущество
  # ──────────────────────────────────────────────────────────────────────────
  - id: property_regime_check
    name: "Режим собственности: добрачное имущество, брачное имущество, перечень объектов"
    description: >
      Фактографическая проверка режима собственности на добрачное имущество,
      имущество, нажитое в браке, имущество, полученное по наследству и в дар,
      а также наличия конкретного перечня объектов имущества.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "режим собственности"
        - "совместная собственность"
        - "раздельная собственность"
        - "долевая собственность"
        - "смешанный режим"
        - "добрачное имущество"
        - "имущество, нажитое в браке"
        - "имущество, нажитое во время брака"
        - "каждому из супругов принадлежит"
        - "является личной собственностью"
        - "по наследству"
        - "в дар"
        - "приложение"
        - "перечень имущества"
        - "кадастровый номер"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(совместн|раздельн|долев)(ая|ой|ую)\\s+собственност"
        - "(?i)режим\\s+(совместной|раздельной|долевой|смешанн)"
        - "(?i)имущество.*нажит(ое|ого)\\s+в\\s+(период\\s+)?брак"
        - "(?i)(по\\s+наследств|в\\s+дар|безвозмездн)"
        - "(?i)\\b\\d{2}:\\d{2}:\\d{6,7}:\\d+\\b"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по семейному праву.
        Анализируется брачный договор (ст. 42, 36 СК РФ).
        Проверяется только один вопрос: режим собственности на имущество супругов.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        [ЗАДАЧА]
        Найди в тексте договора:
        1. Режим добрачного имущества каждого супруга.
        2. Режим имущества, нажитого в браке.
        3. Режим имущества, полученного по наследству и в дар.
        4. Наличие конкретного перечня объектов с идентификацией.
        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если данные не указаны прямо — возвращай "not_defined".
        3. Если текстового значения нет — возвращай строго "Данные не определены".
        4. В evidence включай только текст договора.
        5. Верни только один JSON-объект.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — режимы определены:
        Фрагмент:
        "Имущество, приобретённое каждым из супругов до брака, а также полученное
        по наследству или в дар, является его личной собственностью.
        Имущество, нажитое в браке, является раздельной собственностью каждого из супругов.
        Перечень объектов указан в Приложении № 1."
        Ответ:
        {
          "premarital_regime_status": "defined",
          "premarital_regime_code": "separate",
          "premarital_regime_details": "имущество, приобретённое до брака, является личной собственностью",
          "marital_regime_status": "defined",
          "marital_regime_code": "separate",
          "marital_regime_details": "имущество, нажитое в браке, является раздельной собственностью",
          "inherited_gifted_regime_status": "defined",
          "inherited_gifted_regime_details": "полученное по наследству или в дар является личной собственностью",
          "assets_inventory_status": "defined",
          "assets_inventory_details": "Перечень объектов указан в Приложении № 1",
          "evidence": [
            {
              "clause_ref": "п. 2.1",
              "quote": "Имущество, приобретённое каждым из супругов до брака, а также полученное по наследству или в дар, является его личной собственностью."
            }
          ]
        }
        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Стороны определяют режим имущества."
        Ответ:
        {
          "premarital_regime_status": "not_defined",
          "premarital_regime_code": "not_defined",
          "premarital_regime_details": "Данные не определены",
          "marital_regime_status": "not_defined",
          "marital_regime_code": "not_defined",
          "marital_regime_details": "Данные не определены",
          "inherited_gifted_regime_status": "not_defined",
          "inherited_gifted_regime_details": "Данные не определены",
          "assets_inventory_status": "not_defined",
          "assets_inventory_details": "Данные не определены",
          "evidence": []
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о режиме добрачного имущества.
        2. Найди прямую цитату о режиме имущества, нажитого в браке.
        3. Найди прямую цитату о наследстве и даре.
        4. Найди прямую цитату о перечне объектов.
        5. Если прямой цитаты нет — верни "not_defined". Не додумывай.
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "premarital_regime_status": "<defined / not_defined>",
          "premarital_regime_code": "<joint / separate / shared_proportional / not_defined>",
          "premarital_regime_details": "<текст или 'Данные не определены'>",
          "marital_regime_status": "<defined / not_defined>",
          "marital_regime_code": "<joint / separate / shared_proportional / mixed / not_defined>",
          "marital_regime_details": "<текст или 'Данные не определены'>",
          "inherited_gifted_regime_status": "<defined / not_defined>",
