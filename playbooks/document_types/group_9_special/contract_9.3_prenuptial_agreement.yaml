      regex_patterns:
        - "(?i)применим(ое|ого)\\s+прав(о|а)"
        - "(?i)ст\\.?\\s*161\\s*СК"
        - "(?i)криптовалют|цифров(ые|ых)\\s+(актив|валют)|\\bЦФА\\b"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по семейному праву.
        Анализируется брачный договор (ст. 161 СК РФ; ФЗ-259 «О ЦФА»).
        Проверяется только один вопрос: применимое право при иностранном элементе
        и режим цифровых активов.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        [ЗАДАЧА]
        Найди в тексте договора:
        1. Выбор применимого права.
        2. Наличие иностранного элемента.
        3. Режим криптовалюты и цифровых активов.
        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если данные не указаны прямо — возвращай "not_defined".
        3. Если текстового значения нет — возвращай строго "Данные не определены".
        4. В evidence включай только текст договора.
        5. Верни только один JSON-объект.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1:
        Фрагмент:
        "Настоящий договор регулируется правом Российской Федерации.
        Криптовалюта и цифровые активы являются раздельной собственностью
        каждого из супругов."
        Ответ:
        {
          "governing_law_status": "defined",
          "governing_law_details": "регулируется правом Российской Федерации",
          "foreign_element_status": "not_defined",
          "digital_assets_status": "defined",
          "digital_assets_details": "криптовалюта и цифровые активы являются раздельной собственностью каждого из супругов",
          "evidence": [
            {
              "clause_ref": "п. 10.1",
              "quote": "Настоящий договор регулируется правом Российской Федерации."
            }
          ]
        }
        Пример 2:
        Фрагмент:
        "Стороны определяют режим имущества."
        Ответ:
        {
          "governing_law_status": "not_defined",
          "governing_law_details": "Данные не определены",
          "foreign_element_status": "not_defined",
          "digital_assets_status": "not_defined",
          "digital_assets_details": "Данные не определены",
          "evidence": []
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о применимом праве.
        2. Найди прямую цитату об иностранном элементе.
        3. Найди прямую цитату о цифровых активах.
        4. Если прямой цитаты нет — верни "not_defined". Не додумывай.
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "governing_law_status": "<defined / not_defined>",
          "governing_law_details": "<текст или 'Данные не определены'>",
          "foreign_element_status": "<defined / not_defined>",
          "digital_assets_status": "<defined / not_defined>",
          "digital_assets_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 500

    retrieval:
      retrieval_profile: "definitions_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "применимое право право Российской Федерации иностранное право ст. 161 СК РФ международное частное право коллизионная норма криптовалюта цифровые активы цифровая валюта токен блокчейн биткоин цифровые финансовые активы ЦФА"
      preferred_unit_types:
        - general_provision
        - obligation
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - boilerplate
        - definitions
      negative_keywords:
        - "режим собственности"
        - "совместная собственность"
        - "раздельная собственность"
        - "алименты"
        - "компенсация"
        - "банкротство"
        - "расторжение"
        - "споры"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.60, 1.0]
        boost: 0.15
        scope: segment
      context_k: 5
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "boilerplate"
        - "definitions"
      confidence_bonus_on_match: 0.06
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 500

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 700
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по семейному праву. Извлеки из брачного договора
        применимое право при иностранном элементе и режим цифровых активов.
        Не анализируй режим собственности, алименты или банкротство.
        </role>
        <context>
        {context}
        </context>
        <task>
        Заполни строго следующие поля:
        1. governing_law_status — "defined" или "not_defined".
        2. governing_law_details — выбор применимого права.
        3. foreign_element_status — "defined" или "not_defined".
        4. digital_assets_status — "defined" или "not_defined".
        5. digital_assets_details — режим цифровых активов.
        Если данные отсутствуют в тексте:
        - статус = "not_defined"
        - текстовое поле = "Данные не определены"
        </task>
        <rules>
        - Используй только текст договора.
        - foreign_element_status = "defined" только если прямо указан иностранный элемент
          (иностранный гражданин, двойное гражданство, имущество за рубежом).
        - Верни только JSON.
        </rules>
      fields:
        - name: "governing_law_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус выбора применимого права."
          required: true
        - name: "governing_law_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Применимое право"
          description: "Выбор применимого права."
          required: false
        - name: "foreign_element_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус иностранного элемента."
          required: false
        - name: "digital_assets_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус режима цифровых активов."
          required: false
        - name: "digital_assets_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Цифровые активы"
          description: "Режим криптовалюты и цифровых активов."
          required: false
      store_payload: true

# ════════════════════════════════════════════════════════════════════════════
# БЛОК 5: DD_REQUEST_TEMPLATES
# Читается: DDRequestTemplateLoader
# ════════════════════════════════════════════════════════════════════════════

dd_request_templates:
  parties_notarial_effective_date_check:
    text: >
      Просим предоставить по {doc_names}: (а) полные данные сторон (ФИО, паспортные
      данные, дата и место рождения); (б) статус отношений (вступающие в брак / супруги);
      (в) реквизиты свидетельства о браке (если имеется); (г) подтверждение
      нотариального удостоверения (ст. 41 СК РФ); (д) момент вступления в силу.
    addressee: "Обе стороны / Нотариус"

  property_regime_check:
    text: >
      Просим детализировать в {doc_names}: (а) режим добрачного имущества каждого
      супруга; (б) режим имущества, нажитого в браке; (в) режим наследственного
      и подаренного имущества; (г) перечень объектов с идентификацией (кадастровые
      номера, VIN, номера счетов).
    addressee: "Обе стороны"

  unfavorable_position_compensation_check:
    text: >
      ВНИМАНИЕ: в {doc_names} выявлены признаки крайне неблагоприятного положения
      одного из супругов (ст. 44 СК РФ). Просим обеспечить: (а) баланс имущественных
      прав; (б) компенсационные механизмы; (в) гарантии жилищных прав; (г) правовое
      заключение нотариуса о соответствии договора требованиям закона.
    addressee: "Нотариус / Юридический советник"

  business_assets_check:
    text: >
      Просим детализировать в {doc_names}: (а) перечень бизнес-активов (доли, акции,
      ИС); (б) режим собственности на них; (в) режим доходов от предпринимательской
      деятельности; (г) порядок при продаже/отчуждении бизнеса.
    addressee: "Юридический советник супруга-предпринимателя"

  alimony_maintenance_check:
    text: >
      Просим проверить {doc_names} на предмет: (а) сохранения права нетрудоспособного
      нуждающегося супруга на содержание (ст. 42 СК РФ — императивно); (б) размера
      и порядка выплаты алиментов (если установлены); (в) отсутствия ограничений
      алиментных прав.
    addressee: "Нотариус / Юридический советник"

  debt_mortgage_allocation_check:
    text: >
      Просим уточнить в {doc_names}: (а) распределение личных и общих долгов;
      (б) кто несёт ипотечные обязательства; (в) статус созаёмщика; (г) порядок
      при расторжении брака (рефинансирование, продажа, переоформление).
    addressee: "Юридический советник / Банк"

  creditor_notification_protection_check:
    text: >
      Просим подтвердить по {doc_names}: обязательство супруга-должника уведомить
      кредиторов (ст. 46 СК РФ), перечень кредиторов, порядок и сроки уведомления,
      а также механизмы защиты имущества от кредиторов другого супруга.
    addressee: "Обе стороны"

  bankruptcy_challenge_risk_check:
    text: >
      ВНИМАНИЕ: {doc_names} содержит условия с повышенным риском оспаривания
      в банкротстве (ФЗ-127). Просим обеспечить: (а) встречное предоставление
      (компенсацию); (б) обоснование экономической целесообразности; (в) правовое
      заключение о рисках оспаривания.
    addressee: "Юридический советник"

  real_estate_division_check:
    text: >
      Просим предоставить по {doc_names}: (а) перечень объектов недвижимости с
      кадастровыми номерами; (б) режим собственности на каждый объект; (в) порядок
      раздела при разводе; (г) урегулированность ипотечных обязательств; (д) сроки передачи.
    addressee: "Юридический советник"

  prohibited_conditions_check:
    text: >
      ВНИМАНИЕ: в {doc_names} выявлены условия, запрещённые ст. 42 СК РФ
      (личные неимущественные отношения, условия в отношении детей, ограничение
      правоспособности/дееспособности). Такие условия ничтожны.
      Просим немедленно исключить их из договора.
    addressee: "Нотариус"

  amendment_dispute_severability_check:
    text: >
      Просим уточнить в {doc_names}: (а) порядок внесения изменений (нотариальная
      форма, ст. 43 СК РФ); (б) основания расторжения; (в) невозможность
      одностороннего отказа; (г) порядок разрешения споров; (д) оговорку о делимости
      (ст. 180 ГК РФ).
    addressee: "Юридический советник"

  foreign_digital_assets_check:
    text: >
      В {doc_names} присутствует иностранный элемент и/или цифровые активы.
      Просим определить: (а) применимое право (ст. 161 СК РФ); (б) подсудность;
      (в) режим криптовалюты и цифровых активов, порядок их учёта, оценки и раздела.
    addressee: "Юридический советник по МЧП"

  _default:
    text: >
      Просим предоставить дополнительную информацию по вопросу «{check_name}»
      применительно к {doc_names}.
    addressee: "Юридический советник"


    