        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>Ты — российский юрист. Извлеки условия о режиме драгоценностей, предметов искусства и домашних животных.</role>

        <context>
        {context}
        </context>

        <task>
        0. high_value_personal_property_pets_check_presence:
           - "present" — если luxury_items_status или pets_status ≠ "not_defined";
           - "missing" — если оба = "not_defined".
           Если presence = "missing": все *_status = "not_defined", *_details = "Данные не определены", personal_property_summary_display = "Вещи индивидуального пользования и питомцы не урегулированы".
        1. luxury_items_status — defined / partial / not_defined.
        2. luxury_items_details — режим ювелирных изделий, предметов искусства, коллекций.
        3. pets_status — defined / partial / not_defined.
        4. pets_details — право собственности и порядок содержания домашних животных.
        5. personal_property_summary_display — компактная сводка.
        </task>

        <context_rules>
        - Заполни high_value_personal_property_pets_check_presence по правилу из пункта 0.
        - Если фрагментов нет — presence = "missing".
        - personal_property_summary_display: "Драгоценности/искусство: <урегулировано/нет> / Питомцы: <урегулировано/нет>".
        </context_rules>

        <edge_cases>
        1. Полное отсутствие. → presence = "missing", все not_defined.
        2. Только вещи, без питомцев. → presence = "present", luxury = "defined", pets = "not_defined".
        3. Противоречие. → presence = "unclear", details = "Не удалось определить".
        4. Полное регулирование. → presence = "present", оба статуса "defined".
        </edge_cases>

        <output_expectations>
        - Fallback: "Данные не определены" или "Вещи индивидуального пользования и питомцы не урегулированы".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "high_value_personal_property_pets_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования режима вещей индивидуального пользования и питомцев."
          required: true
        - name: "luxury_items_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "partial", "not_defined"]
          description: "Статус распределения прав на ювелирные изделия, предметы искусства и коллекции."
          required: true
        - name: "luxury_items_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Драгоценности и искусство"
          description: "Условия о принадлежности и разделе предметов роскоши и вещей индивидуального пользования."
          required: true
        - name: "pets_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "partial", "not_defined"]
          description: "Статус регулирования права собственности на домашних животных (ст. 137 ГК РФ)."
          required: true
        - name: "pets_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Домашние животные"
          description: "Определение собственника питомца и порядка его содержания/общения с ним."
          required: true
        - name: "personal_property_summary_display"
          type: "string"
          presentation: "summary"
          display_in_grid: true
          display_priority: 3
          label: "Вещи и питомцы"
          description: "Сводка режима вещей индивидуального пользования и домашних животных."
          required: true

      store_payload: true

  - id: change_of_circumstances_waiver_check
    name: "Оговорка о недопустимости расторжения из-за изменения обстоятельств (ст. 451 ГК РФ)"
    description: >
      Фактографическая проверка наличия прямого отказа сторон от права требовать изменения 
      или расторжения брачного договора в судебном порядке по основанию существенного изменения 
      обстоятельств (ст. 451 ГК РФ). Это критически важно для предотвращения попыток оспорить 
      договор при потере работы, изменении дохода или иных финансовых трудностях.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 190

    rules:
      keywords:
        - "существенное изменение обстоятельств"
        - "статья 451"
        - "ст. 451 ГК РФ"
        - "отказ от права требовать расторжения"
        - "не является основанием для расторжения"
        - "финансовые трудности"
        - "потеря работы"
        - "изменение материального положения"
        - "не может ссылаться на"
      keyword_mode: "any"
      negative_keywords: ["алименты на детей", "в целях настоящего"]
      regex_patterns:
        - "(?i)(существенн\\w*\\s+изменени|ст\\.?\\s*451)[^\\.]{0,50}(не\\s+является|отказ|не\\s+вправе)"
        - "(?i)(материальн|финансов)\\w*\\s+(положен|трудност)[^\\.]{0,40}(не\\s+является\\s+основанием)"

    llm:
      prompt_template: |
        [КОНТЕКСТ] Ты — российский юрист. Проверяется наличие оговорки, блокирующей применение ст. 451 ГК РФ (существенное изменение обстоятельств) для расторжения брачного договора.
        [ЗАДАЧА] Найди прямой запрет или ограничение на использование ст. 451 ГК РФ для оспаривания договора.
        [ФОРМАТ ОТВЕТА]
        {
          "art_451_waiver_status": "<defined / partial / not_defined>",
          "art_451_waiver_details": "<текст или 'Данные не определены'>",
          "change_of_circumstances_summary_display": "<компактная сводка>"
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 800

    retrieval:
      retrieval_profile: "termination_check"
      corpus_scope: "primary_segment"
      levels: ["legal_unit", "section"]
      required_kind: "legal_unit"
      retrieval_query: "существенное изменение обстоятельств ст. 451 ГК РФ отказ от права требовать расторжения финансовые трудности изменение материального положения"
      boost_keywords: ["451", "существенн", "изменени", "отказ", "материальн"]
      context_k: 6
      max_chunks: 8
      rerank: true

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1200

      compact_output: false

      presence_signal:
        field: "change_of_circumstances_waiver_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>Ты — российский юрист. Извлеки условия об отказе от ссылки на ст. 451 ГК РФ (изменение обстоятельств).</role>

        <context>
        {context}
        </context>

        <task>
        0. change_of_circumstances_waiver_check_presence:
           - "present" — если art_451_waiver_status ≠ "not_defined";
           - "missing" — если art_451_waiver_status = "not_defined".
           Если presence = "missing": art_451_waiver_status = "not_defined", art_451_waiver_details = "Данные не определены", change_of_circumstances_summary_display = "Ограничение ст. 451 ГК РФ не урегулировано".
        1. art_451_waiver_status — defined / partial / not_defined.
        2. art_451_waiver_details — текст оговорки о недопустимости расторжения по ст. 451 ГК РФ.
        3. change_of_circumstances_summary_display — компактная сводка.
        </task>

        <context_rules>
        - Заполни change_of_circumstances_waiver_check_presence по правилу из пункта 0.
        - Если фрагментов нет — presence = "missing".
        - art_451_waiver_status: "defined" — есть прямой запрет ссылаться на ст. 451 ГК РФ; "partial" — есть упоминание, но без прямого отказа; "not_defined" — нет.
        - change_of_circumstances_summary_display: "Ограничение ст. 451 ГК РФ: <присутствует/частично/отсутствует>".
        </context_rules>

        <edge_cases>
        1. Полное отсутствие. → presence = "missing", все not_defined.
        2. Косвенное упоминание. → presence = "present", status = "partial".
        3. Противоречие. → presence = "unclear", details = "Не удалось определить".
        4. Прямой и полный отказ. → presence = "present", status = "defined".
        </edge_cases>

        <output_expectations>
        - Fallback: "Данные не определены" или "Ограничение ст. 451 ГК РФ не урегулировано".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "change_of_circumstances_waiver_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие оговорки об ограничении применения ст. 451 ГК РФ."
          required: true
        - name: "art_451_waiver_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "partial", "not_defined"]
          description: "Статус прямого отказа сторон от права требовать расторжения договора по ст. 451 ГК РФ."
          required: true
        - name: "art_451_waiver_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Отказ от ст. 451 ГК РФ"
          description: "Условие о том, что изменение финансового положения не является основанием для расторжения договора."
          required: true
        - name: "change_of_circumstances_summary_display"
          type: "string"
          presentation: "summary"
          display_in_grid: true
          display_priority: 2
          label: "Изменение обстоятельств"
          description: "Сводка наличия защиты договора от оспаривания по ст. 451 ГК РФ."
          required: true

      store_payload: true

# ════════════════════════════════════════════════════════════════════════════
# БЛОК 5: DD_REQUEST_TEMPLATES
# Читается: DDRequestTemplateLoader
# ════════════════════════════════════════════════════════════════════════════

dd_request_templates:
  parties_notarial_effective_date_check:
    text: >
      Просим предоставить по {doc_names}: (а) полные данные сторон (ФИО, паспортные
      данные, дата и место рождения); (б) статус отношений (вступающие в брак / супруги);
      (в) реквизиты свидетельства о браке (если имеется); (г) подтверждение
      нотариального удостоверения (ст. 41 СК РФ); (д) момент вступления в силу.
    addressee: "Обе стороны / Нотариус"

  property_regime_check:
    text: >
      Просим детализировать в {doc_names}: (а) режим добрачного имущества каждого
      супруга; (б) режим имущества, нажитого в браке; (в) режим наследственного
      и подаренного имущества; (г) перечень объектов с идентификацией (кадастровые
      номера, VIN, номера счетов).
    addressee: "Обе стороны"

  unfavorable_position_compensation_check:
    text: >
      ВНИМАНИЕ: в {doc_names} выявлены признаки крайне неблагоприятного положения
      одного из супругов (ст. 44 СК РФ). Просим обеспечить: (а) баланс имущественных
      прав; (б) компенсационные механизмы; (в) гарантии жилищных прав; (г) правовое
      заключение нотариуса о соответствии договора требованиям закона.
    addressee: "Нотариус / Юридический советник"

  business_assets_check:
    text: >
      Просим детализировать в {doc_names}: (а) перечень бизнес-активов (доли, акции,
      ИС); (б) режим собственности на них; (в) режим доходов от предпринимательской
      деятельности; (г) порядок при продаже/отчуждении бизнеса.
    addressee: "Юридический советник супруга-предпринимателя"

  alimony_maintenance_check:
    text: >
      Просим проверить {doc_names} на предмет: (а) сохранения права нетрудоспособного
      нуждающегося супруга на содержание (ст. 42 СК РФ — императивно); (б) размера
      и порядка выплаты алиментов (если установлены); (в) отсутствия ограничений
      алиментных прав.
    addressee: "Нотариус / Юридический советник"

  debt_mortgage_allocation_check:
    text: >
      Просим уточнить в {doc_names}: (а) распределение личных и общих долгов;
      (б) кто несёт ипотечные обязательства; (в) статус созаёмщика; (г) порядок
      при расторжении брака (рефинансирование, продажа, переоформление).
    addressee: "Юридический советник / Банк"

  creditor_notification_protection_check:
    text: >
      Просим подтвердить по {doc_names}: обязательство супруга-должника уведомить
      кредиторов (ст. 46 СК РФ), перечень кредиторов, порядок и сроки уведомления,
      а также механизмы защиты имущества от кредиторов другого супруга.
    addressee: "Обе стороны"

  bankruptcy_challenge_risk_check:
    text: >
      ВНИМАНИЕ: {doc_names} содержит условия с повышенным риском оспаривания
      в банкротстве (ФЗ-127). Просим обеспечить: (а) встречное предоставление
      (компенсацию); (б) обоснование экономической целесообразности; (в) правовое
      заключение о рисках оспаривания.
    addressee: "Юридический советник"

  real_estate_division_check:
    text: >
      Просим предоставить по {doc_names}: (а) перечень объектов недвижимости с
      кадастровыми номерами; (б) режим собственности на каждый объект; (в) порядок
      раздела при разводе; (г) урегулированность ипотечных обязательств; (д) сроки передачи.
    addressee: "Юридический советник"

  prohibited_conditions_check:
    text: >
      ВНИМАНИЕ: в {doc_names} выявлены условия, запрещённые ст. 42 СК РФ
      (личные неимущественные отношения, условия в отношении детей, ограничение
      правоспособности/дееспособности). Такие условия ничтожны.
      Просим немедленно исключить их из договора.
    addressee: "Нотариус"

  amendment_dispute_severability_check:
    text: >
      Просим уточнить в {doc_names}: (а) порядок внесения изменений (нотариальная
      форма, ст. 43 СК РФ); (б) основания расторжения; (в) невозможность
      одностороннего отказа; (г) порядок разрешения споров; (д) оговорку о делимости
      (ст. 180 ГК РФ).
    addressee: "Юридический советник"

  foreign_digital_assets_check:
    text: >
      В {doc_names} присутствует иностранный элемент и/или цифровые активы.
      Просим определить: (а) применимое право (ст. 161 СК РФ); (б) подсудность;
      (в) режим криптовалюты и цифровых активов, порядок их учёта, оценки и раздела.
    addressee: "Юридический советник по МЧП"

  _default:
    text: >
      Просим предоставить дополнительную информацию по вопросу «{check_name}»
      применительно к {doc_names}.
    addressee: "Юридический советник"

