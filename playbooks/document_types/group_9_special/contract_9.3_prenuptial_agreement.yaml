        - "право на обращение в суд"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(супружеск(ая|ой)\\s+верност|воспитание\\s+дет|общение\\s+с\\s+дет)"
        - "(?i)запрещается\\s+(работать|заниматься)"
        - "(?i)не\\s+(имеет\\s+права|вправе)\\s+(обращаться\\s+в\\s+суд|работать)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по семейному праву.
        Анализируется брачный договор (ст. 42 СК РФ).
        Проверяется только один вопрос: наличие условий, запрещённых ст. 42 СК РФ.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Брачный договор не может регулировать личные неимущественные отношения,
          права в отношении детей, ограничивать правоспособность или дееспособность.
