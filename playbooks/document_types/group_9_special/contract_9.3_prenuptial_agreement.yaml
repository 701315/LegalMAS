          required: false
        - name: "notification_obligor_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["both_spouses", "debtor_spouse", "not_defined"]
          description: "Субъект, на которого возложена обязанность уведомления кредиторов."
