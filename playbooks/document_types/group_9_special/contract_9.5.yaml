type: contract_9.5_founders_agreement
name: "Договор об учреждении общества (Учредительный договор)"

description: |
  Соглашение между учредителями (будущими участниками/акционерами) о совместной деятельности
  по созданию хозяйственного общества (ООО или АО). Определяет порядок учреждения, размер
  уставного капитала, размер, номинальную стоимость и порядок оплаты долей (акций),
  распределение расходов на создание. Учредители несут солидарную ответственность по всем
  обязательствам, возникшим до государственной регистрации общества.
  Не является учредительным документом. Для ООО после регистрации внутренние отношения
  регулируются уставом; условия договора, ему противоречащие, не применяются.
  Для АО договор утрачивает силу после регистрации.
  Регулируется ст. 89.1 ГК РФ, ст. 11, 14–16 ФЗ-14 «Об ООО», ст. 9, 25, 34 ФЗ-208 «Об АО».

version: 4.0
parent: class_9_special_imperative

# Структура
#   classification_runtime_v1  → YAMLRegistry (L1/L2 классификация)
#   trigger_definitions        → TriggerDetector
#   checks_v8                  → DocTypeCheckLoader (прямое исполнение)
#   doc_type_checks            → DocTypeCheckConverter (авто-конверсия)
#   dd_request_templates       → DDRequestTemplateLoader
#   compliance_rules           → exclusion_logic → compliance-проверки

metadata:
  category: contract
  subcategory: corporate_law
  complexity: high
  risk_level: high
  jurisdiction: RU
  language: ru
  legal_base: "ст. 89.1 ГК РФ; ст. 11, 14–16 ФЗ-14 «Об ООО»; ст. 9, 25, 34 ФЗ-208 «Об АО»"
  doc_types_supported:
    - "договор об учреждении ООО"
    - "договор о создании АО"
    - "договор об учреждении хозяйственного общества"
    - "дополнительное соглашение к договору об учреждении"

engine_expectations:
  evidence_required: true
  evidence_style: "pinpoint"
  allow_not_found: true
  output_style: "dd_grid"
  prefer_structured_outputs: true

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 1: КЛАССИФИКАЦИЯ (L1/L2)
#  Читается: YAMLRegistry → L1FilenameClassifier, L2HeaderClassifier
# ════════════════════════════════════════════════════════════════════════════

classification_runtime_v1:

  rules:

    filename_patterns:
      - "(?i)договор\\s+об\\s+учреждени"
      - "(?i)учредительн[а-яё]*\\s*(договор|соглашени)"
      - "(?i)founders[\\s_.-]?agreement"
      - "(?i)incorporation[\\s_.-]?agreement"
      - "(?i)создани[а-яё]*\\s+(ооо|ао|общества)"

    folder_patterns:
      - "(?i)учредител"
      - "(?i)корпоратив"
      - "(?i)incorporation"
      - "(?i)founders"

    keywords:

      high:
        - "договор об учреждении"
        - "учредительный договор"
        - "учредители общества"
        - "создание ООО"
        - "создание АО"
        - "уставный капитал"
        - "доля в уставном капитале"
        - "солидарная ответственность учредителей"
        - "ст. 11 ФЗ-14"
        - "ст. 89.1 ГК РФ"

      medium:
        - "номинальная стоимость доли"
        - "порядок оплаты доли"
        - "совместная деятельность по созданию"
        - "расходы на учреждение"
        - "неденежный вклад"
        - "оценка имущества"
        - "государственная регистрация юридического лица"
        - "минимальный уставный капитал"
        - "акции при учреждении"
        - "ст. 14 ФЗ-14"
        - "ст. 15 ФЗ-14"

      low:
        - "единогласное решение"
        - "распределение расходов"
        - "избрание директора"
        - "предрегистрационные договоры"
        - "выход учредителя"
        - "корпоративный договор"
        - "организационно-правовая форма"

    exclusions:
      - "устав общества"
      - "устав ООО"
      - "договор простого товарищества"
      - "договор о совместной деятельности"
      - "корпоративный договор"
      - "решение единственного учредителя"
      - "протокол общего собрания участников"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 2: ТРИГГЕРЫ
#  Читается: TriggerDetector → doc.applicable_triggers
# ════════════════════════════════════════════════════════════════════════════

  trigger_definitions:

    ooo_formation:
      any_keywords:
        - "общество с ограниченной ответственностью"
        - "ООО"
        - "ФЗ-14"
        - "ст. 11 ФЗ-14"
        - "ст. 14 ФЗ-14"
        - "доля в уставном капитале"

    ao_formation:
      any_keywords:
        - "акционерное общество"
        - "АО"
        - "ПАО"
        - "ФЗ-208"
        - "ст. 9 ФЗ-208"
        - "акции"
        - "размещение акций"
        - "эмиссия"

    non_monetary_contribution:
      any_keywords:
        - "неденежный вклад"
        - "вклад имуществом"
        - "вклад правами"
        - "оценка вклада"
        - "независимый оценщик"
        - "имущественный вклад"
        - "интеллектуальная собственность в качестве вклада"
        - "ст. 15 ФЗ-14"

    multiple_founders:
      any_keywords:
        - "учредители"
        - "между учредителями"
        - "два учредителя"
        - "три учредителя"
        - "каждый учредитель"
        - "все учредители"

    foreign_founder:
      any_keywords:
        - "иностранный учредитель"
        - "иностранное юридическое лицо"
        - "иностранный гражданин"
        - "нерезидент"
        - "иностранная компания"
        - "апостиль"
        - "легализация документов"

    ip_contribution:
      any_keywords:
        - "интеллектуальная собственность"
        - "патент"
        - "товарный знак"
        - "лицензия"
        - "ноу-хау"
        - "программное обеспечение"
        - "исключительное право"

    real_estate_contribution:
      any_keywords:
        - "недвижимое имущество"
        - "земельный участок"
        - "здание"
        - "помещение"
        - "кадастровый номер"
        - "регистрация перехода права"

    single_organizer:
      any_keywords:
        - "ответственный за регистрацию"
        - "учредитель-организатор"
        - "осуществляет регистрационные действия"
        - "от имени учредителей"
        - "доверенность на регистрацию"

    large_charter_capital:
      any_keywords:
        - "уставный капитал свыше"
        - "значительный уставный капитал"
        - "миллион рублей"
        - "млн рублей"

    pre_incorporation_contracts_context:
      any_keywords:
        - "договоры до регистрации"
        - "предрегистрационные договоры"
        - "от имени создаваемого общества"
        - "предварительное одобрение"
        - "ратификация"
        - "аренда до регистрации"
        
    corporate_agreement_planned:
      any_keywords:
        - "корпоративный договор"
        - "акционерное соглашение"
        - "соглашение об осуществлении прав участников"
        - "drag-along"
        - "tag-along"
        - "право первого отказа"
        - "опцион"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 3: SHARED PATTERNS
#  Читается: DocTypeCheckLoader через _resolve_yaml_templates()
# ════════════════════════════════════════════════════════════════════════════

shared_patterns:

  money_amount: "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|тыс|млн)"
  date_pattern: "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"
  percentage_pattern: "(?i)\\b\\d+[,.]?\\d*\\s*(%|процент)"
  inn_pattern: "(?i)\\bИНН\\s*\\d{10,12}\\b"
  ogrn_pattern: "(?i)\\bОГРН\\s*\\d{13,15}\\b"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: COMPLIANCE RULES
#  Читается: DocTypeCheckLoader._exclusion_logic_to_checks()
# ════════════════════════════════════════════════════════════════════════════

compliance_rules:

  - id: "minimum_charter_capital_ooo"
    name: "Минимальный уставный капитал ООО — 10 000 рублей (ст. 14 ФЗ-14)"
    description: |
      Уставный капитал ООО не может быть менее 10 000 рублей.
      Минимальная часть (10 000 руб.) должна быть оплачена деньгами.
    legal_base: "ст. 14 ФЗ-14"
    required_triggers: ["ooo_formation"]
    severity: "critical"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      keywords:
        - "уставный капитал 5000"
        - "уставный капитал 1000"
        - "уставный капитал 100"
        - "менее 10 000"
        - "менее десяти тысяч"
      keyword_mode: "any"
    retrieval:
      context_k: 3
      boost_keywords:
        - "уставный капитал"
        - "размер уставного капитала"
        - "ст. 14 ФЗ-14"
      rerank: true

  - id: "mandatory_valuation_non_monetary_contribution"
    name: "Обязательная оценка неденежного вклада свыше 20 000 руб. (ст. 15 ФЗ-14)"
    description: |
      При оплате доли неденежным вкладом стоимостью свыше 20 000 рублей обязательна
      независимая оценка. За завышение стоимости учредители и оценщик несут
      субсидиарную ответственность в течение 3 лет.
    legal_base: "ст. 15 ФЗ-14"
    required_triggers: ["non_monetary_contribution"]
    severity: "critical"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      keywords:
        - "без оценки"
        - "оценка не проводилась"
        - "самостоятельно определили стоимость"
        - "оценка не требуется"
      keyword_mode: "any"
    retrieval:
      context_k: 4
      boost_keywords:
        - "неденежный вклад"
        - "оценка"
        - "независимый оценщик"
        - "ст. 15 ФЗ-14"
      rerank: true

  - id: "single_participant_ooo_as_sole_founder_prohibition"
    name: "Запрет учреждения ООО другим ООО с единственным участником (ст. 7 ФЗ-14)"
    description: |
      ООО не может иметь в качестве единственного учредителя другое хозяйственное
      общество, состоящее из одного лица.
    legal_base: "ст. 7 ФЗ-14"
    required_triggers: ["ooo_formation"]
    severity: "critical"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      keywords:
        - "единственный учредитель"
        - "общество с единственным участником"
        - "состоящее из одного лица"
      keyword_mode: "any"
    retrieval:
      context_k: 3
      boost_keywords:
        - "единственный учредитель"
        - "ст. 7 ФЗ-14"
      rerank: true

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 5: CHECKS_V8 — LLM/hybrid проверки
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  - id: founders_and_company_extraction
    name: "Извлечение учредителей и данных создаваемого общества"
    description: |
      Извлекает перечень учредителей (ФИО/наименование, ИНН, адрес),
      наименование и ОПФ создаваемого общества, место нахождения.
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "учредитель"
        - "создать общество"
        - "наименование общества"
        - "организационно-правовая форма"
        - "место нахождения"
        - "ООО"
        - "АО"
        - "ПАО"
        - "ИНН"
        - "ОГРН"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)учредител(ь|и|ей)\\s*([-—:]|обязу)"
        - "(?i)(ООО|АО|ПАО)\\s+[«\"]"
        - "(?i)\\bИНН\\s*\\d{10,12}\\b"
        - "(?i)\\bОГРН\\s*\\d{13,15}\\b"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор об учреждении общества.
        Найди в тексте учредителей и данные создаваемого общества.

        Ответь строго в JSON:
        {
          "founders": [
            {
              "name": "<ФИО или наименование>",
              "type": "<individual / legal_entity>",
              "inn": "<ИНН или not_found>",
              "share_percent": "<% доли или not_found>"
            }
          ],
          "company_name": "<полное наименование создаваемого общества или not_found>",
          "company_form": "<ooo / ao / pao / not_found>",
          "company_location": "<место нахождения или not_found>",
          "number_of_founders": "<число учредителей или not_found>"
        }

        ВАЖНО: Если значение явно не указано — пиши "not_found".
      prompt_file: null
      context_k: 8
      temperature: 0.0
      max_tokens: 700
    retrieval:
      context_k: 8
      max_chunks: 12
      boost_keywords:
        - "учредитель"
        - "общество"
        - "наименование"
        - "ИНН"
        - "ОГРН"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 50
      max_snippet_length: 1000
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "company_name"
          type: "string"
          keyword_hints: ["наименование", "ООО", "АО"]
          description: "Наименование создаваемого общества"
        - name: "company_form"
          type: "string"
          allowed_values: ["ooo", "ao", "pao", "not_found"]
          description: "Организационно-правовая форма"
        - name: "number_of_founders"
          type: "number"
          description: "Количество учредителей"
      store_payload: true

  - id: charter_capital_and_shares_check
    name: "Уставный капитал: размер, доли, номинальная стоимость (ст. 11, 14 ФЗ-14)"
    description: |
      Извлекает размер уставного капитала, размер и номинальную стоимость доли
      каждого учредителя, проверяет соответствие минимуму (10 000 руб. для ООО).
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "уставный капитал"
        - "размер уставного капитала"
        - "доля учредителя"
        - "номинальная стоимость"
        - "процент"
        - "рублей"
        - "10 000"
        - "десять тысяч"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)уставн(ый|ого)\\s+капитал(а)?\\s+(составляет|равен|в\\s+размере)"
        - "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽)"
        - "(?i)\\b\\d+[,.]?\\d*\\s*(%|процент)"
        - "(?i)номинальн(ая|ой)\\s+стоимост"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор об учреждении общества.
        Извлеки данные об уставном капитале и долях учредителей.

        Ответь строго в JSON:
        {
          "charter_capital_amount": "<сумма или not_found>",
          "charter_capital_currency": "<RUB / other / not_found>",
          "minimum_compliance": "<compliant / below_minimum / not_applicable / not_found>",
          "shares": [
            {
              "founder_name": "<имя учредителя>",
              "share_percent": "<% или not_found>",
              "nominal_value": "<номинальная стоимость или not_found>"
            }
          ],
          "shares_total_100": "<yes / no / unclear / not_found>",
          "capital_snippet": "<цитата или not_found>"
        }

        - "compliant" — уставный капитал ≥ 10 000 руб. (для ООО)
        - "below_minimum" — ниже минимума (НАРУШЕНИЕ для ООО)
        - "not_applicable" — для АО минимум иной

        ВАЖНО: Если значение явно не указано — пиши "not_found".
      prompt_file: null
      context_k: 6
      temperature: 0.0
      max_tokens: 600
    retrieval:
      context_k: 6
      max_chunks: 10
      boost_keywords:
        - "уставный капитал"
        - "номинальная стоимость"
        - "доля"
        - "процент"
        - "10 000"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 700
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "charter_capital_amount"
          type: "number"
          keyword_hints: ["уставный капитал", "в размере", "составляет"]
          unit: "RUB"
          description: "Размер уставного капитала"
        - name: "minimum_compliance"
          type: "string"
          allowed_values: ["compliant", "below_minimum", "not_applicable", "not_found"]
          description: "Соответствие минимуму"
        - name: "shares_total_100"
          type: "string"
          allowed_values: ["yes", "no", "unclear", "not_found"]
          description: "Сумма долей = 100%"
      store_payload: true

  - id: share_payment_procedure_check
    name: "Порядок, сроки и способ оплаты долей (ст. 11, 16 ФЗ-14)"
    description: |
      Проверяет наличие конкретного порядка, сроков и способов оплаты доли
      каждым учредителем. Срок не может превышать 4 месяцев с даты регистрации.
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "оплата доли"
        - "оплатить долю"
        - "порядок оплаты"
        - "срок оплаты"
        - "способ оплаты"
        - "денежными средствами"
        - "имуществом"
        - "правами"
        - "4 месяца"
        - "четыре месяца"
        - "не позднее"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)оплат(а|ить)\\s+(свою\\s+)?дол(ю|и)"
        - "(?i)не\\s+позднее\\s+\\d+\\s*(месяц|дн)"
        - "(?i)(четыре|4)\\s+месяц"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор об учреждении общества.
        Проверь порядок, сроки и способ оплаты долей (ст. 11, 16 ФЗ-14).

        Ответь строго в JSON:
        {
          "payment_deadline_specified": "<yes / no>",
          "payment_deadline_value": "<конкретный срок или not_found>",
          "within_4_months": "<yes / no / unclear / not_found>",
          "payment_method": "<money / property / rights / mixed / not_specified / not_found>",
          "payment_for_each_founder": "<yes / no / not_found>",
          "payment_snippet": "<цитата или not_found>"
        }

        ВАЖНО: Если значение явно не указано — пиши "not_found".
      prompt_file: null
      context_k: 5
      temperature: 0.0
      max_tokens: 500
    retrieval:
      context_k: 5
      max_chunks: 8
      boost_keywords:
        - "оплата доли"
        - "срок оплаты"
        - "ст. 16 ФЗ-14"
        - "4 месяца"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "payment_deadline_specified"
          type: "string"
          allowed_values: ["yes", "no"]
          description: "Указан ли срок оплаты"
        - name: "within_4_months"
          type: "string"
          allowed_values: ["yes", "no", "unclear", "not_found"]
          description: "Срок ≤ 4 месяцев с регистрации"
        - name: "payment_method"
          type: "string"
          allowed_values: ["money", "property", "rights", "mixed", "not_specified", "not_found"]
          description: "Способ оплаты"
      store_payload: true

  - id: non_monetary_contribution_valuation_check
    name: "Оценка неденежного вклада и субсидиарная ответственность (ст. 15 ФЗ-14)"
    description: |
