        - "предварительное одобрение"
        - "договоры до регистрации"
        - "от имени создаваемого"
        - "ратификация обществом"
        - "лимит полномочий"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)предварительн(ое|ого)\\s+одобрени"
        - "(?i)ратификаци"

  - id: "founder_withdrawal_procedure"
    name: "Порядок выхода учредителя из процесса учреждения"
    description: "Проверяет наличие процедуры выхода учредителя"
    legal_base: "Договорная практика, ст. 450.1 ГК РФ"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "выход учредителя"
        - "отказ от участия"
        - "расторжение договора учредителем"
        - "уведомление о выходе"
        - "возмещение расходов"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)выход\\s+учредител"

  - id: "organizer_reimbursement"
    name: "Возмещение расходов учредителю-организатору"
    description: "Проверяет право на компенсацию учредителю, ведущему организационную работу"
    legal_base: "Договорная практика"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
      any: ["single_organizer"]
    rules:
      keywords:
        - "возмещение расходов организатора"
        - "организаторское вознаграждение"
        - "ответственный за регистрацию"
        - "компенсация временных затрат"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)ответственн(ый|ого)\\s+за\\s+регистраци"

  - id: "confidentiality"
    name: "Конфиденциальность переговоров и условий (ст. 434.1 ГК РФ)"
    description: "Проверяет наличие обязательства конфиденциальности"
    legal_base: "ст. 434.1 ГК РФ"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "конфиденциальность"
        - "неразглашение"
        - "коммерческая тайна"
        - "не подлежит разглашению"
        - "информация об учреждении"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)конфиденциальност"

  - id: "dispute_resolution"
    name: "Досудебный порядок и подсудность"
    description: "Проверяет наличие порядка разрешения споров"
    legal_base: "АПК РФ, ГПК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "разрешение споров"
        - "досудебный порядок"
        - "претензионный порядок"
        - "подсудность"
        - "арбитражный суд"
        - "путём переговоров"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)спор(ы|ов)\\s+(разрешаются|подлежат)"
        - "(?i)арбитражн(ый|ого)\\s+суд"

  - id: "post_registration_provisions"
    name: "Положения, сохраняющие силу после регистрации"
    description: "Проверяет наличие условий, автономных от устава"
    legal_base: "ст. 422, 431.2 ГК РФ"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "сохраняют силу после регистрации"
        - "действуют после регистрации"
        - "автономность условий"
        - "независимость положений"
        - "наряду с уставом"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(сохран|действ)(яют|уют)\\s+(силу\\s+)?после\\s+регистраци"

  - id: "contract_term"
    name: "Срок действия договора"
    description: "Проверяет указание на срок действия (до регистрации)"
    legal_base: "ст. 11 ФЗ-14"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "срок действия"
        - "действует до регистрации"
        - "до момента государственной регистрации"
        - "утрачивает силу после регистрации"
        - "прекращает действие"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)действует\\s+до\\s+(момента\\s+)?регистраци"
        - "(?i)утрачивает\\s+силу\\s+после"

  - id: "foreign_founder_requirements"
    name: "Специальные требования для иностранного учредителя"
    description: "Проверяет соблюдение требований при наличии иностранного учредителя"
    legal_base: "ФЗ-129, МЧП"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
      any: ["foreign_founder"]
    rules:
      keywords:
        - "апостиль"
        - "легализация"
        - "нотариальный перевод"
        - "консульская легализация"
        - "иностранное юридическое лицо"
        - "выписка из торгового реестра"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(апостиль|легализаци|нотариальн(ый|ого)\\s+перевод)"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 7: DD_REQUEST_TEMPLATES
#  Читается: DDRequestTemplateLoader
#  Ключи = check_id из checks_v8 и doc_type_checks выше.
#  DDRequestTemplateLoader.render() матчит по exact или prefix.
# ════════════════════════════════════════════════════════════════════════════

dd_request_templates:

  founders_and_company_extraction:
    text: >
      Просим предоставить по {doc_names}: (а) полные данные каждого учредителя
      (ФИО/наименование, ИНН, ОГРН, адрес, паспортные данные для физ. лиц);
      (б) полное и сокращённое наименование создаваемого общества;
      (в) организационно-правовую форму; (г) место нахождения.
    addressee: "Все учредители"

  founders_identification:
    text: >
      В {doc_names} необходимо указать полные данные каждого учредителя.
    addressee: "Все учредители"

  company_name_and_form:
    text: >
      В {doc_names} необходимо указать полное наименование и ОПФ общества.
    addressee: "Все учредители"

  charter_capital_and_shares_check:
    text: >
      Просим уточнить в {doc_names}: (а) общий размер уставного капитала
      (для ООО — не менее 10 000 руб.); (б) размер и номинальную стоимость доли
      каждого учредителя; (в) подтверждение, что сумма долей = 100%;
      (г) валюту оплаты.
    addressee: "Все учредители / Юридический советник"

  charter_capital_amount:
    text: >
      В {doc_names} необходимо указать конкретный размер уставного капитала.
    addressee: "Все учредители"

  shares_distribution:
    text: >
      В {doc_names} необходимо указать размер и номинальную стоимость доли
      каждого учредителя.
    addressee: "Все учредители"

  share_payment_procedure_check:
    text: >
      Просим уточнить в {doc_names}: (а) конкретный срок оплаты каждым учредителем
      (не позднее 4 мес. с даты регистрации); (б) способ оплаты (деньги/имущество/
      права); (в) реквизиты для оплаты; (г) последствия неоплаты.
    addressee: "Все учредители / Юридический советник"

  payment_deadline_and_method:
    text: >
      В {doc_names} необходимо указать порядок и сроки оплаты долей (ст. 16 ФЗ-14).
    addressee: "Все учредители"

  non_monetary_contribution_valuation_check:
    text: >
      Просим предоставить по {doc_names}: (а) описание неденежного вклада;
      (б) отчёт независимого оценщика (для вкладов свыше 20 000 руб.);
      (в) протокол утверждения стоимости единогласным решением;
      (г) подтверждение информированности о субсидиарной ответственности (ст. 15 ФЗ-14).
    addressee: "Учредитель, вносящий неденежный вклад / Оценщик"

  solidary_liability_check:
    text: >
      Просим подтвердить в {doc_names}: (а) наличие положения о солидарной
      ответственности учредителей (ст. 11 ФЗ-14); (б) порядок одобрения обществом
      обязательств после регистрации; (в) лимиты обязательств до регистрации.
    addressee: "Юридический советник"

  solidary_liability_explicit:
    text: >
      В {doc_names} необходимо явно указать на солидарную ответственность
      учредителей по обязательствам до регистрации (ст. 11 ФЗ-14).
    addressee: "Юридический советник"

  pre_incorporation_contracts_check:
    text: >
      Просим уточнить в {doc_names}: (а) механизм одобрения договоров,
      заключаемых до регистрации; (б) лимиты полномочий уполномоченного лица;
      (в) порядок ратификации обществом после регистрации;
      (г) распределение ответственности при отказе от ратификации.
    addressee: "Юридический советник"

  pre_incorporation_contracts_mechanism:
    text: >
      Просим включить в {doc_names} механизм одобрения pre-incorporation contracts.
    addressee: "Юридический советник"

  joint_activity_procedure:
    text: >
      Просим описать в {doc_names}: порядок совместных действий учредителей
      (подготовка устава, формирование пакета документов, подача на регистрацию).
    addressee: "Все учредители"

  expenses_distribution:
    text: >
      Просим уточнить в {doc_names}: (а) перечень расходов на учреждение;
      (б) порядок их распределения (пропорционально/поровну);
      (в) смету расходов; (г) порядок авансирования и отчётности.
    addressee: "Все учредители"

  director_election:
    text: >
      Просим согласовать в {doc_names}: (а) кандидатуру директора;
      (б) порядок избрания; (в) пределы полномочий до регистрации;
      (г) условия трудового договора.
    addressee: "Все учредители"

  unanimous_decision_requirement:
    text: >
      Просим определить в {doc_names} перечень вопросов, требующих
      единогласного решения всех учредителей.
    addressee: "Юридический советник"

  corporate_agreement_obligation_check:
    text: >
      Просим согласовать в {doc_names}: (а) обязательство заключить
      корпоративный договор после регистрации; (б) ключевые условия
      (drag-along, tag-along, опционы, порядок голосования);
      (в) срок заключения; (г) санкции за незаключение.
    addressee: "Юридический советник"

  founder_withdrawal_check:
    text: >
      Просим уточнить в {doc_names}: (а) процедуру выхода учредителя
      (уведомление, срок); (б) последствия для доли и расходов;
      (в) порядок компенсации фактически понесённых расходов.
    addressee: "Юридический советник"

  founder_withdrawal_procedure:
    text: >
      Просим включить в {doc_names} процедуру выхода учредителя
      из процесса учреждения.
    addressee: "Юридический советник"

  organizer_reimbursement:
    text: >
      Просим согласовать в {doc_names} право учредителя-организатора
      на компенсацию расходов и вознаграждение за организационную работу.
    addressee: "Все учредители"

  confidentiality:
    text: >
      Просим включить в {doc_names} обязательство конфиденциальности
      в отношении условий договора и бизнес-плана (ст. 434.1 ГК РФ).
    addressee: "Юридический советник"

  dispute_resolution:
    text: >
      Просим согласовать в {doc_names}: досудебный порядок (претензии,
      переговоры), подсудность, арбитражную оговорку (при наличии).
    addressee: "Юридический советник"

  post_registration_provisions:
    text: >
      Просим определить в {doc_names}: какие положения сохраняют силу
      после регистрации общества (конфиденциальность, споры, ответственность),
      и указать их автономность от устава.
    addressee: "Юридический советник"

  contract_term:
    text: >
      Просим уточнить в {doc_names} срок действия: до регистрации
      или до наступления иного события.
    addressee: "Юридический советник"

  foreign_founder_requirements:
    text: >
      Для {doc_names} при участии иностранного учредителя просим предоставить:
      (а) апостилированные/легализованные документы; (б) нотариальный перевод;
      (в) выписку из торгового реестра; (г) подтверждение правоспособности.
    addressee: "Иностранный учредитель / Юридический советник"

  minimum_charter_capital_ooo:
    text: >
      ВНИМАНИЕ: в {doc_names} размер уставного капитала ООО ниже минимума
      10 000 рублей (ст. 14 ФЗ-14). Просим привести в соответствие с законом.
    addressee: "Все учредители"

  mandatory_valuation_non_monetary_contribution:
    text: >
      ВНИМАНИЕ: в {doc_names} неденежный вклад стоимостью свыше 20 000 руб.
      не оценён независимым оценщиком (ст. 15 ФЗ-14). Просим обеспечить оценку
      и учитывать субсидиарную ответственность за завышение стоимости.
    addressee: "Учредители / Оценщик"

  single_participant_ooo_as_sole_founder_prohibition:
    text: >
      ВНИМАНИЕ: в {doc_names} выявлен учредитель — ООО с единственным участником.
      Такое ООО не может быть единственным учредителем другого ООО (ст. 7 ФЗ-14).
    addressee: "Юридический советник"

  # Generic fallback
  _default:
    text: >
      Просим предоставить дополнительную информацию по вопросу «{check_name}»
      применительно к {doc_names}.
    addressee: "Юридический советник"