      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 7: Неустойка, зачёт расходов и переплата
  # ──────────────────────────────────────────────────────────────────────────
  - id: penalty_and_offset_check
    name: "Неустойка за просрочку, зачёт дополнительных расходов и переплата"
    description: >
      Фактографическая проверка неустойки за просрочку уплаты алиментов (ст. 115 СК РФ),
      зачёта дополнительных расходов на ребёнка (ст. 86, 104 СК РФ) и зачёта переплаты.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "неустойка"
        - "пеня"
        - "за просрочку"
        - "за каждый день просрочки"
        - "0,1%"
        - "ст. 115 СК РФ"
        - "убытки сверх неустойки"
        - "дополнительные расходы"
        - "зачёт расходов"
        - "зачет расходов"
        - "лечение ребёнка"
        - "образование ребёнка"
        - "в счёт алиментов"
        - "в счет алиментов"
        - "зачёт переплаты"
        - "зачет переплаты"
        - "авансовый платёж"
        - "в счёт будущих платежей"
        - "переплата"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)неустойк(а|у|и)\\s+(за\\s+)?просрочк"
        - "(?i)\\d[,.]\\d+\\s*%\\s*(за\\s+)?(каждый\\s+)?день"
        - "(?i)зач(ёт|ет)\\s+(произведённых\\s+)?расход"
        - "(?i)переплат(а|ы|у)\\s*(зачитывается|подлежит\\s+зачёт)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по семейному праву.
        Анализируется соглашение об уплате алиментов (ст. 115, 86, 104 СК РФ).
        Проверяется только один вопрос: неустойка за просрочку, зачёт
        дополнительных расходов и переплата.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте соглашения.
        - Не оценивай серьёзность риска.
        [ЗАДАЧА]
        Найди в тексте соглашения:
        1. Наличие неустойки за просрочку и её размер.
        2. Тип неустойки (за день / за месяц / фиксированная).
        3. Право на взыскание убытков сверх неустойки.
        4. Наличие условия о зачёте дополнительных расходов.
        5. Перечень категорий расходов, подлежащих зачёту.
        6. Наличие условия о зачёте переплаты.
        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если данные не указаны прямо — возвращай "not_defined".
        3. Если текстового значения нет — возвращай строго "Данные не определены".
        4. В evidence включай только текст соглашения.
        5. Верни только один JSON-объект.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1:
        Фрагмент:
        "За просрочку уплаты алиментов Плательщик уплачивает неустойку в размере
        0,1% от неуплаченной суммы за каждый день просрочки. Плательщик вправе
        производить дополнительные расходы на лечение и образование ребёнка
        с зачётом в счёт алиментов по согласованию с получателем."
        Ответ:
        {
          "penalty_clause_status": "defined",
          "penalty_rate_status": "defined",
          "penalty_rate_details": "0,1% от неуплаченной суммы за каждый день просрочки",
          "penalty_type": "per_day",
          "additional_damages_status": "not_defined",
          "offset_clause_status": "defined",
          "offset_categories_status": "defined",
          "offset_categories_details": "лечение и образование ребёнка",
          "overpayment_credit_status": "not_defined",
          "evidence": [
            {
              "clause_ref": "п. 4.1",
              "quote": "За просрочку уплаты алиментов Плательщик уплачивает неустойку в размере 0,1% от неуплаченной суммы за каждый день просрочки."
            }
          ]
        }
        Пример 2:
        Фрагмент:
        "Плательщик обязуется уплачивать алименты своевременно."
        Ответ:
        {
          "penalty_clause_status": "not_defined",
          "penalty_rate_status": "not_defined",
          "penalty_rate_details": "Данные не определены",
          "penalty_type": "not_defined",
          "additional_damages_status": "not_defined",
          "offset_clause_status": "not_defined",
          "offset_categories_status": "not_defined",
          "offset_categories_details": "Данные не определены",
          "overpayment_credit_status": "not_defined",
          "evidence": []
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о неустойке.
        2. Найди прямую цитату о зачёте расходов.
        3. Найди прямую цитату о зачёте переплаты.
        4. Если прямой цитаты нет — верни "not_defined". Не додумывай.
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "penalty_clause_status": "<defined / not_defined>",
          "penalty_rate_status": "<defined / not_defined>",
          "penalty_rate_details": "<размер или 'Данные не определены'>",
          "penalty_type": "<per_day / per_month / fixed / other / not_defined>",
          "additional_damages_status": "<defined / not_defined>",
          "offset_clause_status": "<defined / not_defined>",
          "offset_categories_status": "<defined / not_defined>",
          "offset_categories_details": "<перечень или 'Данные не определены'>",
          "overpayment_credit_status": "<defined / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 550

    retrieval:
      retrieval_profile: "liability_cap_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "неустойка пеня за просрочку за каждый день просрочки 0,1% ст. 115 СК РФ убытки сверх неустойки дополнительные расходы зачёт расходов зачет расходов лечение образование отдых в счёт алиментов зачёт переплаты авансовый платёж в счёт будущих платежей переплата"
      preferred_unit_types:
        - liability_provision
        - obligation
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - remedies
        - obligations
      negative_keywords:
        - "размер алиментов"
        - "порядок выплаты"
        - "индексация"
        - "прекращение"
        - "изменение соглашения"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.35, 0.80]
        boost: 0.12
        scope: segment
      context_k: 5
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
