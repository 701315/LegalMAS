          "children_count_status": "defined",
          "children_count_value": "2",
          "per_child_allocation_status": "defined",
          "per_child_allocation_details": "1/6 заработка на каждого ребёнка (всего 1/3)",
          "aggregate_withholding_status": "within_limit",
          "aggregate_withholding_details": "1/3 заработка, что в пределах 70%",
          "reduction_risk_status": "not_defined",
          "evidence": [
            {
              "clause_ref": "п. 2.2",
              "quote": "Алименты уплачиваются на содержание двоих несовершеннолетних детей: 1/6 заработка на каждого ребёнка, всего 1/3 заработка плательщика ежемесячно."
            }
          ]
        }
        Пример 2 — указан совокупный размер без разделения:                        # ← ключевой edge-case
        Фрагмент:
        "Алименты уплачиваются в размере 30 000 рублей ежемесячно на содержание
        детей от двух браков."
