        Ты — российский юрист по семейному праву. Извлеки из соглашения об уплате
        алиментов условия о целевом использовании алиментов и отчётности получателя
        перед плательщиком.
        Не анализируй размер, порядок выплаты, индексацию, порядок изменения
        или прекращения.
        </role>

        <context>
        {context}
        </context>

        <task>
        0. targeted_use_reporting_check_presence:
           Агрегатное signal-поле — наличие регулирования по целевому использованию и отчётности.
           - "present" — если хотя бы одно из содержательных полей (targeted_use_regime, reporting_regime, disposition_restrictions_status) ≠ "not_defined";
           - "missing" — если все три содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме целевого использования есть, но из-за противоречий вывод невозможен.

           Если presence = "missing":
           - targeted_use_regime = "not_defined";
           - targeted_use_purpose_details = "Данные не определены";
           - reporting_regime = "not_defined";
           - reporting_details = "Данные не определены";
           - disposition_restrictions_status = "not_defined";
           - не выполняй остальные шаги.

        1. targeted_use_regime — defined / statutory_default / not_applicable / not_defined.
        2. targeted_use_purpose_details — перечень назначений или "Данные не определены".
        3. reporting_regime — periodic / on_demand / prohibited / statutory_default / not_defined.
        4. reporting_details — форма и периодичность отчёта или "Данные не определены".
        5. disposition_restrictions_status — "defined" если ограничения на распоряжение указаны, иначе "not_defined".
        </task>

        <context_rules>
        - Используй только текст соглашения.
        - targeted_use_regime:
          * "defined" — целевое назначение средств прямо установлено в тексте (питание, лечение, образование и т.п.);
          * "statutory_default" — не указано, применяется общий режим ст. 60 СК РФ (расходование в интересах ребёнка без формального отчёта);
          * "not_applicable" — выгодоприобретатель не ребёнок;
          * "not_defined" — неопределимо.
        - reporting_regime:
          * "periodic" — установлена периодическая отчётность (ежемесячно, ежеквартально и т.п.);
          * "on_demand" — отчёт по требованию/запросу плательщика;
          * "prohibited" — отчётность прямо исключена;
          * "statutory_default" — не установлено, по умолчанию обязанности отчитываться нет;
          * "not_defined" — неопределимо.
        - disposition_restrictions_status = "defined", если установлены ограничения на распоряжение средствами (например, согласие плательщика на крупные траты, запрет на определённые категории расходов).
        - Не используй "None", "null", "N/A", "-", "undefined" или пустые строки.
        </context_rules>

        <edge_cases>
        1. Целевое назначение + отчёт по требованию: targeted_use_regime = "defined", reporting_regime = "on_demand", в purpose_details — перечень.
        2. Оговорок о целевом использовании нет: targeted_use_regime = "statutory_default", reporting_regime = "statutory_default" — дефолт ст. 60 СК РФ, это НЕ дефект.
        3. Периодическая отчётность без целевого назначения: reporting_regime = "periodic", targeted_use_regime = "statutory_default", в reporting_details — периодичность и форма.
        4. Ограничение на распоряжение (согласие плательщика на траты свыше N руб.): disposition_restrictions_status = "defined", в evidence — цитата ограничения.
        </edge_cases>

        <output_expectations>
        Верни строго JSON с 6 ключами (5 полей + evidence).
        Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "targeted_use_reporting_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по целевому использованию алиментов и отчётности получателя. Внутреннее агрегатное signal-поле."
          required: true
        - name: "targeted_use_regime"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Целевое использование"
          allowed_values: ["defined", "statutory_default", "not_applicable", "not_defined"]
          description: "Режим целевого использования алиментов: установлен / дефолт ст. 60 СК РФ / не применимо."
          required: true
        - name: "targeted_use_purpose_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Назначение средств"
          description: "Согласованный перечень целей расходования (питание / лечение / образование и т.п.)."
          required: false
        - name: "reporting_regime"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Отчётность получателя"
          allowed_values: ["periodic", "on_demand", "prohibited", "statutory_default", "not_defined"]
          description: "Режим отчётности получателя перед плательщиком: периодическая / по требованию / запрещена / дефолт."
          required: true
        - name: "reporting_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 4
          label: "Детали отчётности"
          description: "Форма и периодичность отчёта о расходовании."
          required: false
        - name: "disposition_restrictions_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус ограничений на распоряжение средствами без согласия плательщика."
          required: true
      store_payload: true

  - id: child_interest_validation_check
    name: "Соответствие соглашения интересам ребёнка и риск оспаривания (ст. 102, п. 2 ст. 103 СК РФ)"
    description: >
      Фактографическая проверка соответствия условий соглашения интересам ребёнка
      или недееспособного совершеннолетнего члена семьи. По п. 2 ст. 103 СК РФ
      соглашение может быть признано судом недействительным по требованию
      законного представителя, органа опеки и попечительства или прокурора,
      если оно нарушает интересы ребёнка. Выявляются кабальные и дискриминационные
      условия (увязка алиментов с отказом от общения, ограничением родительских
      прав и т.п.).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 100

    rules:
      keywords:
        - "интересы ребёнка"
        - "в интересах ребёнка"
        - "ненадлежащее исполнение"
        - "орган опеки"
        - "прокурор"
        - "признание недействительным"
        - "отказ от общения"
        - "отказ от воспитания"
        - "лишение родительских прав"
        - "прекращение общения"
        - "при условии не"
        - "не препятствовать общению"
        - "кабальные условия"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)в\\s+интересах\\s+(ребён|ребен|несовершеннолетн)"
        - "(?i)орган[а-яё]*\\s+опеки"
        - "(?i)(прекращение|отказ)\\s+от\\s+(общени|воспитани)"
        - "(?i)при\\s+условии\\s+не"
        - "(?i)не\\s+препятств[а-яё]+\\s+общени"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по семейному праву.
        Анализируется соглашение об уплате алиментов (ст. 102, п. 2 ст. 103 СК РФ).
        Проверяется только один вопрос: соответствие условий соглашения интересам
        ребёнка (или недееспособного члена семьи) и риск признания соглашения
        недействительным.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте соглашения.
        - Не оценивай серьёзность риска — оценивай соответствие правовым критериям.
        - По п. 2 ст. 103 СК РФ соглашение может быть признано судом
          недействительным по требованию законного представителя, органа опеки
          или прокурора, если оно нарушает интересы ребёнка или недееспособного
          совершеннолетнего члена семьи.
        - Дискриминационные условия: увязка алиментов с отказом от родительских
          прав, общения, воспитания; ограничение свободы перемещения ребёнка;
          запрет на изменение места жительства и т.п.
        [ЗАДАЧА]
        Найди в тексте соглашения:
        1. Наличие дискриминационных / кабальных условий.
        2. Условия, увязывающие выплату алиментов с действиями получателя,
           не связанными с содержанием ребёнка.
        3. Условия, существенно ограничивающие права ребёнка или законного
           представителя.
        4. Наличие в тексте ссылок на интересы ребёнка / опеку / прокурора.
        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если данные не указаны прямо — возвращай "not_defined" (для status)
           или "Данные не определены" (для value-полей).
        3. child_interest_status:
           * "compliant" — условия соответствуют интересам ребёнка, дискриминации
             не выявлено;
           * "potential_violation" — выявлены условия, потенциально нарушающие
             интересы ребёнка (кабальные, дискриминационные);
           * "unclear" — недостаточно данных для оценки;
           * "not_applicable" — выгодоприобретатель не ребёнок/недееспособный.
        4. challenge_risk_status:
           * "low" — признаков оспаривания нет;
           * "medium" — условия формально допустимы, но создают почву для спора;
           * "high" — прямое нарушение ст. 102 / п. 2 ст. 103 СК РФ;
           * "not_defined" — неопределимо.
        5. Не используй "None", "null", "N/A", "-", "undefined" или пустые строки.
        6. В evidence включай только текст соглашения.
        7. Верни РОВНО один валидный JSON-объект со всеми 7 ключами, пригодный
           для парсинга через json.loads без предварительной обработки. Без markdown,
           без ```json, без комментариев, без текста до или после. Начни ответ
           сразу с { и закончи }.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — условия соответствуют интересам ребёнка:
        Фрагмент:
        "Алименты уплачиваются в размере 1/4 заработка плательщика ежемесячно.
        Плательщик сохраняет право на общение с ребёнком в порядке, установленном
        соглашением сторон."
        Ответ:
        {
          "child_interest_status": "compliant",
          "child_interest_note": "Размер соответствует п. 1 ст. 81 СК РФ; условия общения не увязаны с выплатой",
          "challenge_risk_status": "low",
          "challenge_risk_basis": "Признаков нарушения ст. 102 и п. 2 ст. 103 СК РФ не выявлено",
          "restrictive_clauses_status": "not_defined",
          "restrictive_clauses_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 2.1",
              "quote": "Алименты уплачиваются в размере 1/4 заработка плательщика ежемесячно. Плательщик сохраняет право на общение с ребёнком в порядке, установленном соглашением сторон."
            }
          ]
        }
        Пример 2 — кабальное условие (увязка выплат с отказом от общения):
        Фрагмент:
        "Алименты уплачиваются в размере 15 000 рублей ежемесячно при условии,
        что получатель не будет препятствовать общению плательщика с ребёнком.
        При нарушении данного условия выплата приостанавливается."
        Ответ:
        {
          "child_interest_status": "potential_violation",
          "child_interest_note": "Условие приостановки выплат за действия получателя увязывает содержание ребёнка с обстоятельствами, не связанными с интересами ребёнка",
          "challenge_risk_status": "high",
          "challenge_risk_basis": "Условие создаёт основание для оспаривания по ст. 102 и п. 2 ст. 103 СК РФ",
          "restrictive_clauses_status": "defined",
          "restrictive_clauses_details": "Приостановка выплат при препятствовании общению плательщика с ребёнком",
          "evidence": [
            {
              "clause_ref": "п. 2.3",
              "quote": "Алименты уплачиваются в размере 15 000 рублей ежемесячно при условии, что получатель не будет препятствовать общению плательщика с ребёнком. При нарушении данного условия выплата приостанавливается."
            }
          ]
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Проверь, что все 7 ключей (6 полей + evidence) присутствуют в JSON.
        2. Найди прямую цитату об условиях, увязывающих выплату с действиями получателя.
        3. Найди прямые признаки нарушения интересов ребёнка.
        4. Оцени challenge_risk_status: low / medium / high.
        5. Если прямой цитаты нет — верни "not_defined". Не додумывай.
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "child_interest_status": "<compliant / potential_violation / unclear / not_applicable / not_defined>",
          "child_interest_note": "<обоснование или 'Данные не определены'>",
          "challenge_risk_status": "<low / medium / high / not_defined>",
          "challenge_risk_basis": "<обоснование или 'Данные не определены'>",
          "restrictive_clauses_status": "<defined / not_defined>",
          "restrictive_clauses_details": "<перечень или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 650

    retrieval:
      retrieval_profile: "party_identification_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "интересы ребёнка в интересах ребёнка орган опеки прокурор признание недействительным отказ от общения отказ от воспитания прекращение общения при условии не не препятствовать общению кабальные условия ограничение прав"
      preferred_unit_types:
        - general_provision
        - obligation
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - boilerplate
        - obligations
      negative_keywords:
        - "нотариус"
        - "индексация"
        - "неустойка"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.20, 0.70]
        boost: 0.30
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "boilerplate"
        - "obligations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 900
      presence_signal:
        field: "child_interest_validation_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по семейному праву. Извлеки из соглашения об уплате
        алиментов информацию о соответствии интересам ребёнка, дискриминационных
        условиях и риске оспаривания.
        Не анализируй размер алиментов, порядок выплаты или индексацию.
        </role>

        <context>
        {context}
        </context>

        <task>
        0. child_interest_validation_check_presence:
           Агрегатное signal-поле — наличие регулирования по соответствию интересам ребёнка.
           - "present" — если хотя бы одно из содержательных полей (child_interest_status, challenge_risk_status, restrictive_clauses_status) ≠ "not_defined";
           - "missing" — если все три содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме интересов ребёнка есть, но из-за противоречий вывод невозможен.

           Если presence = "missing":
           - child_interest_status = "not_defined";
           - child_interest_note = "Данные не определены";
           - challenge_risk_status = "not_defined";
           - challenge_risk_basis = "Данные не определены";
           - restrictive_clauses_status = "not_defined";
           - restrictive_clauses_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. child_interest_status — compliant / potential_violation / unclear / not_applicable / not_defined.
        2. child_interest_note — краткое обоснование статуса.
        3. challenge_risk_status — low / medium / high / not_defined.
        4. challenge_risk_basis — правовая аргументация оценки риска.
        5. restrictive_clauses_status — "defined" если выявлены дискриминационные/кабальные условия, иначе "not_defined".
        6. restrictive_clauses_details — перечень условий или "Данные не определены".
        </task>

        <context_rules>
        - Используй только текст соглашения.
        - child_interest_status:
          * "compliant" — условия соответствуют интересам ребёнка, дискриминационных/кабальных условий не выявлено;
          * "potential_violation" — выявлены условия, потенциально нарушающие интересы ребёнка (увязка выплат с отказом от общения/воспитания, ограничение прав и т.п.);
          * "unclear" — в тексте есть условия, которые могут быть истолкованы двояко, недостаточно данных для однозначной оценки;
          * "not_applicable" — выгодоприобретатель не ребёнок и не недееспособный совершеннолетний;
          * "not_defined" — тема интересов ребёнка не затрагивается в тексте.
        - challenge_risk_status:
          * "low" — признаков оспаривания по ст. 102 / п. 2 ст. 103 СК РФ нет;
          * "medium" — условия формально допустимы, но создают почву для спора;
          * "high" — прямое нарушение ст. 102 / п. 2 ст. 103 СК РФ (кабальные, дискриминационные условия);
          * "not_defined" — неопределимо.
        - restrictive_clauses_status = "defined", если в тексте прямо установлены условия, увязывающие выплату алиментов с действиями получателя, не связанными с содержанием ребёнка (отказ от общения, ограничение родительских прав, запрет на перемещение и т.п.).
        - Не используй "None", "null", "N/A", "-", "undefined" или пустые строки.
        </context_rules>

        <edge_cases>
        1. Стандартные условия без ограничений: child_interest_status = "compliant", challenge_risk = "low", restrictive = "not_defined".
        2. Увязка выплат с отказом от общения/воспитания: child_interest_status = "potential_violation", challenge_risk = "high", restrictive = "defined" — основание для оспаривания по п. 2 ст. 103 СК РФ.
        3. Выгодоприобретатель — недееспособный совершеннолетний (не ребёнок): child_interest_status = "compliant" или "potential_violation" (оценка аналогична), restrictive — по факту.
        4. Двусмысленная формулировка (например, «алименты при условии совместного проживания»): child_interest_status = "unclear", challenge_risk = "medium", в note — объяснение неоднозначности.
        </edge_cases>

        <output_expectations>
        Верни строго JSON с 7 ключами (6 полей + evidence).
        Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

