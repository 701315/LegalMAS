          display_in_grid: true
          display_priority: 2
          label: "Категории расходов"
          description: "Перечень категорий расходов, подлежащих зачёту."
          required: false
        - name: "exceptional_circumstances_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания исключительных обстоятельств."
          required: true
        - name: "exceptional_circumstances_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Исключительные обстоятельства"
          description: "Исключительные обстоятельства (тяжёлая болезнь, увечье, уход)."
          required: false
        - name: "overpayment_credit_regime"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 4
          label: "Зачёт переплаты"
          allowed_values: ["allowed", "prohibited", "statutory_default", "not_defined"]
          description: "Режим зачёта переплаты в счёт будущих платежей."
          required: false
        - name: "overpayment_credit_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          display_priority: 7
          label: "Детали зачёта переплаты"
          description: "Условия о зачёте переплаты."
          required: false
      store_payload: true

  - id: termination_and_amendment_check
    name: "Прекращение алиментных обязательств и односторонний отказ (ст. 120, п. 2 ст. 101 СК РФ)"
