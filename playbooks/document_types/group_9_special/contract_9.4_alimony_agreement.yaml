    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 900
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по семейному праву. Извлеки из соглашения об уплате
        алиментов основание алиментной обязанности и риски оспаривания
        отцовства / материнства.
        Не анализируй размер алиментов, порядок выплаты или прекращение.
        </role>
        <context>
        {context}
        </context>
        <task>
        Заполни строго следующие 6 полей + evidence (всего 7 ключей):
        1. paternity_basis_status — "defined" или "not_defined".
        2. paternity_basis_details — основание обязанности.
        3. challenge_risk_status — low / medium / high / not_applicable / not_defined.
        4. challenge_risk_basis — обоснование риска оспаривания.
        5. consequences_on_termination_status — "defined" или "not_defined".
        6. consequences_on_termination_details — последствия оспаривания.
        7. evidence — список цитат из соглашения.
        Если данные отсутствуют в тексте:
        - статус = "not_defined"
        - текстовое поле = "Данные не определены"
        </task>
        <rules>
        - Используй только текст соглашения.
        - По ст. 52 СК РФ оспаривание отцовства возможно только в суде.
          При удовлетворении иска обязанность прекращается; исполненные платежи
          могут быть взысканы как неосновательное обогащение (ст. 1102–1109 ГК РФ).
        - challenge_risk_status:
          * "low" — основание удостоверено органом ЗАГС, признаки оспоримости
            не выявлены;
          * "medium" — отцовство установлено в судебном порядке, потенциально
            оспоримо;
          * "high" — признаки оспоримости (добровольное признание без экспертизы);
          * "not_applicable" — выгодоприобретатель не ребёнок плательщика
            (алименты на супруга/родителя);
          * "not_defined" — неопределимо.
        - consequences_on_termination_status = "defined", если в тексте прямо
          указаны последствия оспаривания (прекращение обязанности, возврат
          платежей); иначе "not_defined".
        - Верни РОВНО один валидный JSON-объект со всеми 7 ключами, пригодный
          для парсинга через json.loads без предварительной обработки. Без markdown,
          без ```json, без комментариев, без текста до или после. Начни ответ
          сразу с { и закончи }.
        </rules>

      fields:
        - name: "paternity_basis_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания основания обязанности."
          required: true
        - name: "paternity_basis_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Основание обязанности"
          description: "Основание алиментной обязанности (свидетельство о рождении, судебное решение и т.п.)."
          required: false
        - name: "challenge_risk_status"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Риск оспаривания"
          allowed_values: ["low", "medium", "high", "not_applicable", "not_defined"]
          description: "Риск оспаривания отцовства/материнства по ст. 52 СК РФ."
          required: true
        - name: "challenge_risk_basis"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          display_priority: 6
          label: "Обоснование риска"
          description: "Правовая аргументация оценки риска."
          required: false
        - name: "consequences_on_termination_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания последствий оспаривания."
          required: true
        - name: "consequences_on_termination_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          display_priority: 7
          label: "Последствия"
          description: "Условия о последствиях оспаривания отцовства/материнства."
          required: false
      store_payload: true      

  - id: assignment_and_third_party_rights_check
    name: "Уступка алиментов и права третьих лиц (ст. 383 ГК РФ, ст. 446 ГПК РФ)"
    description: >
      Фактографическая проверка условий об уступке права на алименты и об
      обращении взыскания на алименты со стороны третьих лиц. По ст. 383 ГК РФ
      уступка требований, неразрывно связанных с личностью кредитора
      (в том числе алиментов), не допускается — любые подобные условия
      недействительны. Алименты имеют ограниченную защиту от взыскания
      по ст. 446 ГПК РФ и ст. 101 ФЗ №229-ФЗ. Проверяется наличие в тексте
      соответствующих оговорок и их соответствие закону.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 150

    rules:
      keywords:
        - "уступка"
        - "уступка права"
        - "цессия"
        - "перевод долга"
        - "залог"
        - "залог алиментов"
        - "обращение взыскания"
        - "третьи лица"
        - "кредиторы"
        - "взыскание"
        - "ст. 383 ГК РФ"
        - "ст. 446 ГПК РФ"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(уступк|цесси)[а-яё]+\\s+(права|требовани)"
        - "(?i)перевод[а-яё]*\\s+долг"
        - "(?i)залог[а-яё]*\\s+алимент"
        - "(?i)обращени[е-яё]+\\s+взыскани"
        - "(?i)третьи[х-яё]+\\s+лиц"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по семейному праву.
        Анализируется соглашение об уплате алиментов (ст. 383 ГК РФ,
        ст. 446 ГПК РФ, ст. 101 ФЗ №229-ФЗ).
        Проверяется только один вопрос: уступка права на алименты и права
        третьих лиц в отношении алиментов.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте соглашения.
        - Не оценивай серьёзность риска — фиксируй факты.
        - По ст. 383 ГК РФ уступка требований, неразрывно связанных с личностью
          кредитора (алименты, возмещение вреда жизни/здоровью), не допускается.
          Любые условия об уступке алиментов — недействительны.
        - Алименты имеют ограниченную защиту от взыскания по ст. 446 ГПК РФ
          и ст. 101 ФЗ №229-ФЗ; обращение взыскания на алименты кредиторами
          получателя возможно в ограниченных случаях.
        [ЗАДАЧА]
        Найди в тексте соглашения:
        1. Условия об уступке права на алименты.
        2. Условия о переводе долга по алиментам.
        3. Условия о залоге алиментов.
        4. Условия об обращении взыскания третьими лицами.
        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если данные не указаны прямо — возвращай "not_defined" (для status)
           или "Данные не определены" (для value-полей).
        3. assignment_regime:
           * "prohibited_by_law" — в тексте нет условий об уступке; действует
             запрет по ст. 383 ГК РФ;
           * "attempted" — в тексте есть условие об уступке (недействительно
             в силу закона);
           * "not_defined" — неопределимо.
        4. enforcement_protection_status:
           * "protected" — в тексте прямо указана защита алиментов от взыскания;
           * "statutory_default" — не указано; применяется ст. 446 ГПК РФ;
           * "not_defined" — неопределимо.
        5. third_party_claims_status:
           * "excluded" — прямо исключены притязания третьих лиц;
           * "allowed" — допущены в тексте (обычно недействительно);
           * "not_defined" — неопределимо.
        6. Не используй "None", "null", "N/A", "-", "undefined" или пустые строки.
        7. В evidence включай только текст соглашения.
        8. Верни РОВНО один валидный JSON-объект со всеми 7 ключами, пригодный
           для парсинга через json.loads без предварительной обработки. Без markdown,
           без ```json, без комментариев, без текста до или после. Начни ответ
           сразу с { и закончи }.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — уступка запрещена, защита от взыскания установлена:
        Фрагмент:
        "Право на получение алиментов не может быть уступлено третьим лицам.
        Алименты не подлежат обращению взыскания по обязательствам получателя
        перед третьими лицами, за исключением случаев, установленных законом."
        Ответ:
        {
          "assignment_regime": "prohibited_by_law",
          "assignment_clause_status": "defined",
          "assignment_clause_details": "право на алименты не может быть уступлено третьим лицам",
          "enforcement_protection_status": "protected",
          "third_party_claims_status": "excluded",
          "third_party_claims_details": "притязания третьих лиц исключены (за исключением случаев, установленных законом)",
          "evidence": [
