        6. pre_trial_procedure_details — досудебный порядок обсуждения.
        Если данные отсутствуют в тексте:
        - статус = "not_defined"
        - текстовое поле = "Данные не определены"
        </task>
        <rules>
        - Используй только текст соглашения.
        - adjustment_procedure: "negotiation" — пересмотр по соглашению сторон;
          "court" — только через суд; "both" — оба порядка;
          "not_defined" — порядок не указан.
        - Верни только JSON.
        </rules>
      fields:
        - name: "adjustment_clause_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус механизма корректировки."
