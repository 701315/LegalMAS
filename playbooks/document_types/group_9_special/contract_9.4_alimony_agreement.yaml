        - "(?i)в\\s+размере\\s+\\d+"
        - "(?i)прожиточн(ый|ого)\\s+минимум"
        - "(?i)\\bпрожиточн(ый|ого)\\s+минимум[а-яё]*\\s+(в|на)\\s+(субъект|регион)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по семейному праву.
        Анализируется соглашение об уплате алиментов (ст. 81, 103, 104 СК РФ).
        Проверяется только один вопрос: размер алиментов, способ определения,
        периодичность и соответствие минимуму по ст. 81 СК РФ.
        Важно:
        - Твоя задача — установить, что прямо есть в тексте соглашения.
        - Не оценивай серьёзность риска.
        - Соглашение не может устанавливать размер алиментов на несовершеннолетних
          детей ниже того, который они могли бы получить при взыскании через суд
          (п. 2 ст. 103 СК РФ). Судебный минимум: 1/4 на одного ребёнка,
          1/3 на двоих, 1/2 на трёх и более (п. 1 ст. 81 СК РФ).
        [ЗАДАЧА]
        Найди в тексте соглашения:
        1. Способ определения размера (доля / твёрдая сумма / смешанный / имущество).
        2. Конкретный размер (сумма или доля).
        3. Периодичность выплаты.
        4. Число детей (если алименты на несовершеннолетних детей).
        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если данные не указаны прямо — возвращай "not_defined" (для status)
           или "Данные не определены" (для value-полей).
        3. Если размер выражен долей от заработка — сравни с минимумом ст. 81 СК РФ
           с учётом числа детей: если доля ниже (например, 1/6 на одного ребёнка),
           фиксируй "below_minimum". Если равна или выше — "compliant".
        4. Если размер — твёрдая денежная сумма, регион и прожиточный минимум
           однозначно из текста не определяются, — фиксируй "not_evaluable".
        5. Если выгодоприобретатель не несовершеннолетний ребёнок (супруг, родитель,
           иной член семьи) — ст. 81 не применяется, фиксируй "not_applicable".
        6. Не используй "None", "null", "N/A", "-", "undefined" или пустые строки.
        7. В evidence включай только текст соглашения.
        8. Верни РОВНО один валидный JSON-объект со всеми 10 ключами, пригодный
           для парсинга через json.loads без предварительной обработки. Без markdown,
           без ```json, без комментариев, без текста до или после. Начни ответ
           сразу с { и закончи }.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — доля, соответствует минимуму:
        Фрагмент:
        "Плательщик обязуется уплачивать алименты на содержание одного
        несовершеннолетнего ребёнка в размере 1/4 (одной четвертой) заработка
        и иного дохода ежемесячно, не позднее 10-го числа следующего месяца."
        Ответ:
        {
          "amount_type": "proportional",
          "amount_value_status": "defined",
          "amount_value_details": "1/4 (одна четвертая) заработка и иного дохода",
          "minimum_compliance_status": "compliant",
          "minimum_compliance_note": "1/4 на одного ребёнка соответствует п. 1 ст. 81 СК РФ",
          "payment_frequency_status": "defined",
          "payment_frequency_details": "ежемесячно, не позднее 10-го числа следующего месяца",
          "number_of_children_status": "defined",
          "number_of_children_value": "1",
          "evidence": [
            {
              "clause_ref": "п. 2.1",
              "quote": "Плательщик обязуется уплачивать алименты на содержание одного несовершеннолетнего ребёнка в размере 1/4 (одной четвертой) заработка и иного дохода ежемесячно."
            }
          ]
        }
        Пример 2 — доля ниже минимума (deal-breaker):
        Фрагмент:
        "Алименты на содержание одного несовершеннолетнего ребёнка уплачиваются
        в размере 1/6 заработка ежемесячно."
        Ответ:
        {
          "amount_type": "proportional",
          "amount_value_status": "defined",
          "amount_value_details": "1/6 заработка",
          "minimum_compliance_status": "below_minimum",
          "minimum_compliance_note": "1/6 < 1/4 для одного ребёнка (п. 1 ст. 81 СК РФ); нарушение п. 2 ст. 103 СК РФ",
          "payment_frequency_status": "defined",
          "payment_frequency_details": "ежемесячно",
          "number_of_children_status": "defined",
          "number_of_children_value": "1",
          "evidence": [
            {
              "clause_ref": "п. 2.1",
              "quote": "Алименты на содержание одного несовершеннолетнего ребёнка уплачиваются в размере 1/6 заработка ежемесячно."
            }
          ]
        }
        Пример 3 — твёрдая сумма, региональный ПМ не указан:
        Фрагмент:
        "Алименты уплачиваются в твёрдой денежной сумме 12 000 рублей ежемесячно."
        Ответ:
        {
          "amount_type": "fixed",
          "amount_value_status": "defined",
          "amount_value_details": "12 000 рублей ежемесячно",
          "minimum_compliance_status": "not_evaluable",
          "minimum_compliance_note": "Твёрдая сумма без указания региона и прожиточного минимума — для оценки необходимо знать ПМ субъекта РФ",
          "payment_frequency_status": "defined",
          "payment_frequency_details": "ежемесячно",
          "number_of_children_status": "not_defined",
          "number_of_children_value": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 2.1",
              "quote": "Алименты уплачиваются в твёрдой денежной сумме 12 000 рублей ежемесячно."
            }
          ]
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Проверь, что все 10 ключей (9 полей + evidence) присутствуют в JSON.
        2. Найди прямую цитату с размером алиментов.
        3. Определи способ определения размера (proportional / fixed / mixed / property_transfer).
        4. Если способ = proportional — сравни долю с минимумом ст. 81 СК РФ с учётом числа детей.
        5. Найди прямую цитату с периодичностью.
        6. Если прямой цитаты нет — верни "not_defined". Не додумывай.
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "amount_type": "<proportional / fixed / mixed / property_transfer / not_defined>",
          "amount_value_status": "<defined / not_defined>",
          "amount_value_details": "<размер или 'Данные не определены'>",
          "minimum_compliance_status": "<compliant / below_minimum / not_evaluable / not_applicable / not_defined>",
          "minimum_compliance_note": "<обоснование или 'Данные не определены'>",
          "payment_frequency_status": "<defined / not_defined>",
          "payment_frequency_details": "<периодичность или 'Данные не определены'>",
          "number_of_children_status": "<defined / not_defined>",
          "number_of_children_value": "<число или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 700

    retrieval:
      retrieval_profile: "payment_terms_check"
