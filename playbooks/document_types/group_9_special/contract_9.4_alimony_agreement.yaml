    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 160

    rules:
      keywords:
        - "дети от разных браков"
        - "несколько детей"
        - "двое детей"
        - "трое детей"
        - "1/3"
        - "1/2"
        - "пропорциональное распределение"
