    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по семейному праву.
        Анализируется соглашение об уплате алиментов (ст. 104, 109 СК РФ).
        Проверяется только один вопрос: порядок, сроки, способ выплаты
        и подтверждение оплаты.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте соглашения.
        - Не оценивай серьёзность риска.
        - Способы уплаты по ст. 104 СК РФ: в долях к заработку, в твёрдой сумме,
          путём предоставления имущества, иными способами. Порядок может
          предусматривать удержание по месту работы (ст. 109 СК РФ).
        - При выплате наличными денежными средствами подтверждение оплаты —
          критично для доказательства исполнения обязательства.
        [ЗАДАЧА]
        Найди в тексте соглашения:
        1. Конкретная дата ежемесячного платежа.
        2. Способ перечисления (банковский перевод / наличные / почтовый перевод /
           удержание по месту работы / иное).
        3. Реквизиты счёта получателя или иные платёжные данные.
        4. Порядок подтверждения оплаты.
        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если данные не указаны прямо — возвращай "not_defined" (для status)
           или "Данные не определены" (для value-полей).
        3. Различай: "bank_transfer" — перечисление на счёт; "cash" — наличными;
           "postal" — почтовый перевод; "payroll_deduction" — удержание из
           заработка администрацией работодателя (ст. 109 СК РФ); "other" —
           иной прямо названный способ; "not_defined" — не указан.
        4. Не используй "None", "null", "N/A", "-", "undefined" или пустые строки.
        5. В evidence включай только текст соглашения.
        6. Верни РОВНО один валидный JSON-объект со всеми 8 ключами, пригодный
           для парсинга через json.loads без предварительной обработки. Без markdown,
           без ```json, без комментариев, без текста до или после. Начни ответ
           сразу с { и закончи }.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — банковский перевод с указанием реквизитов:
        Фрагмент:
        "Алименты перечисляются на банковский счёт получателя № 40817810000000000000
        в ПАО Сбербанк не позднее 10-го числа каждого месяца. Подтверждением оплаты
        является платёжное поручение с отметкой банка."
        Ответ:
        {
          "payment_deadline_status": "defined",
          "payment_deadline_details": "не позднее 10-го числа каждого месяца",
          "payment_method_status": "defined",
          "payment_method_code": "bank_transfer",
          "payment_method_details": "перечисление на банковский счёт № 40817810000000000000 в ПАО Сбербанк",
          "payment_confirmation_status": "defined",
          "payment_confirmation_details": "платёжное поручение с отметкой банка",
          "evidence": [
            {
              "clause_ref": "п. 3.1",
              "quote": "Алименты перечисляются на банковский счёт получателя № 40817810000000000000 в ПАО Сбербанк не позднее 10-го числа каждого месяца. Подтверждением оплаты является платёжное поручение с отметкой банка."
            }
          ]
        }
        Пример 2 — наличные с распиской (критично для доказывания):
        Фрагмент:
        "Алименты уплачиваются наличными денежными средствами ежемесячно не позднее
        5-го числа текущего месяца. Факт уплаты подтверждается письменной распиской
        получателя."
        Ответ:
        {
          "payment_deadline_status": "defined",
          "payment_deadline_details": "не позднее 5-го числа текущего месяца",
          "payment_method_status": "defined",
          "payment_method_code": "cash",
          "payment_method_details": "наличными денежными средствами",
          "payment_confirmation_status": "defined",
          "payment_confirmation_details": "письменная расписка получателя",
          "evidence": [
            {
              "clause_ref": "п. 3.2",
              "quote": "Алименты уплачиваются наличными денежными средствами ежемесячно не позднее 5-го числа текущего месяца. Факт уплаты подтверждается письменной распиской получателя."
            }
          ]
        }
        Пример 3 — удержание по месту работы (ст. 109 СК РФ):
        Фрагмент:
        "Алименты удерживаются из заработной платы плательщика по месту его работы
        и перечисляются на счёт получателя. Обязанность по удержанию возлагается
        на администрацию работодателя."
        Ответ:
        {
          "payment_deadline_status": "not_defined",
          "payment_deadline_details": "Данные не определены",
          "payment_method_status": "defined",
          "payment_method_code": "payroll_deduction",
          "payment_method_details": "удержание из заработной платы по месту работы плательщика и перечисление на счёт получателя",
          "payment_confirmation_status": "not_defined",
          "payment_confirmation_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 3.1",
              "quote": "Алименты удерживаются из заработной платы плательщика по месту его работы и перечисляются на счёт получателя."
            }
          ]
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Проверь, что все 8 ключей (7 полей + evidence) присутствуют в JSON.
        2. Найди прямую цитату с датой платежа.
        3. Найди прямую цитату со способом перечисления.
        4. Различи bank_transfer / cash / postal / payroll_deduction / other.
        5. Найди прямую цитату с реквизитами.
        6. Найди прямую цитату о подтверждении оплаты.
        7. Если прямой цитаты нет — верни "not_defined". Не додумывай.
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "payment_deadline_status": "<defined / not_defined>",
          "payment_deadline_details": "<срок или 'Данные не определены'>",
          "payment_method_status": "<defined / not_defined>",
          "payment_method_code": "<bank_transfer / cash / postal / payroll_deduction / other / not_defined>",
          "payment_method_details": "<текст или 'Данные не определены'>",
          "payment_confirmation_status": "<defined / not_defined>",
          "payment_confirmation_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 550

    retrieval:
      retrieval_profile: "payment_terms_check"
