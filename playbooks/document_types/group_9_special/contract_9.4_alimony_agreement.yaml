        2. currency_details — валюта и сумма.
        3. foreign_element_status — "defined" или "not_defined".
        4. foreign_element_details — признаки иностранного элемента.
        5. cross_border_enforcement_status — "provided" или "not_defined".
        6. international_treaty_status — "defined" или "not_defined".
        7. evidence — список цитат из соглашения.
        </task>

        <context_rules>
        - Если в тексте нет фрагментов об иностранной валюте, иностранном
          элементе или трансграничном исполнении — presence = "missing",
          currency_regime = "statutory_default" (рубли по умолчанию).
        - По п. 2 ст. 104 СК РФ алименты могут уплачиваться в иностранной
          валюте с учётом требований ФЗ №173-ФЗ.
        - currency_regime = "rub", если в тексте прямо указаны рубли;
          "foreign", если иностранная валюта; "mixed", если комбинация;
          "statutory_default", если валюта не указана.
        - foreign_element_status = "defined", если прямо указаны иностранные
          стороны, место жительства за рубежом, зарубежное имущество или
          счёт в иностранном банке.
        - cross_border_enforcement_status = "provided", если в тексте
          установлены условия о признании и исполнении за рубежом.
        - Признание и исполнение за рубежом — через Минскую конвенцию 1993
          или Кишинёвскую конвенцию 2002 (СНГ) или двусторонние договоры.
          Россия не участвует в Гаагской конвенции 2007 года.
        - international_treaty_status = "defined", если в тексте прямо
          указан применимый международный договор.
        - Не используй "None", "null", "N/A", "-", "undefined" или пустые строки.
        - В evidence включай только прямые цитаты из текста соглашения.
        </context_rules>

        <edge_cases>
        - Если алименты в рублях, обе стороны — резиденты РФ, без каких-либо
          оговорок о трансграничном исполнении — presence = "missing",
          currency_regime = "statutory_default" (или "rub", если прямо указаны
          рубли), все остальные status = "not_defined".
        - Если алименты в иностранной валюте (например, USD), но нет указания
          на трансграничное исполнение или международные договоры —
          currency_regime = "foreign", presence = "present",
          cross_border_enforcement_status = "not_defined",
          international_treaty_status = "not_defined".
        - Если одна из сторон имеет вид на жительство за рубежом или указан
          иностранный банк получателя — foreign_element_status = "defined",
          presence = "present", даже если валюта — рубли.
        - Если в тексте есть ссылка на Минскую конвенцию, но нет отдельных
          условий о трансграничном исполнении — international_treaty_status =
          "defined", cross_border_enforcement_status = "not_defined".
        </edge_cases>

        <output_expectations>
        Верни строго валидный JSON-объект с 8 ключами (7 полей + evidence).
        Не добавляй пояснений, markdown-обёрток или комментариев.
        Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "foreign_element_and_currency_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по иностранному элементу и валюте алиментов. Внутреннее агрегатное signal-поле."
          required: true
        - name: "currency_regime"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Валюта алиментов"
          allowed_values: ["rub", "foreign", "mixed", "statutory_default", "not_defined"]
          description: "Валюта алиментов: рубли / иностранная / смешанная."
          required: true
        - name: "currency_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          display_priority: 6
          label: "Детали валюты"
          description: "Детализация валюты и суммы."
