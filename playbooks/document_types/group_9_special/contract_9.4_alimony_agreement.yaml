      presence_signal:
        field: "offset_and_overpayment_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по семейному праву. Извлеки из соглашения об уплате
        алиментов условия о зачёте дополнительных расходов и зачёте переплаты.
        Не анализируй размер алиментов, порядок выплаты, неустойку или прекращение.
        </role>

        <context>
        {context}
        </context>

        <task>
        0. offset_and_overpayment_check_presence:
           Агрегатное signal-поле — наличие регулирования по зачёту расходов и переплаты.
           - "present" — если хотя бы одно из содержательных полей (offset_regime, exceptional_circumstances_status, overpayment_credit_regime) ≠ "not_defined";
           - "missing" — если все три содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме зачёта есть, но из-за противоречий вывод невозможен.

           Если presence = "missing":
           - offset_regime = "not_defined";
           - offset_categories_status = "not_defined";
           - offset_categories_details = "Данные не определены";
           - exceptional_circumstances_status = "not_defined";
           - exceptional_circumstances_details = "Данные не определены";
           - overpayment_credit_regime = "not_defined";
           - overpayment_credit_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. offset_regime — provided / prohibited / statutory_default / not_defined.
        2. offset_categories_status — "defined" если перечень категорий указан, иначе "not_defined".
        3. offset_categories_details — перечень или "Данные не определены".
        4. exceptional_circumstances_status — "defined" если исключительные обстоятельства названы, иначе "not_defined".
        5. exceptional_circumstances_details — обстоятельства или "Данные не определены".
        6. overpayment_credit_regime — allowed / prohibited / statutory_default / not_defined.
        7. overpayment_credit_details — условия зачёта переплаты или "Данные не определены".
        </task>

        <context_rules>
        - Используй только текст соглашения.
        - offset_regime: "provided" — зачёт допрасходов установлен в тексте; "prohibited" — прямо запрещён; "statutory_default" — не указано, применяется ст. 86 СК РФ (через суд при исключительных обстоятельствах); "not_defined" — неопределимо.
        - overpayment_credit_regime: "allowed" — переплата зачитывается в счёт будущих платежей; "prohibited" — прямо запрещено; "statutory_default" — не указано, по умолчанию зачёт переплаты не предусмотрен; "not_defined" — неопределимо.
        - exceptional_circumstances_status = "defined", если в тексте прямо названы исключительные обстоятельства (тяжёлая болезнь, увечье, посторонний уход и т.п.).
        - Не используй "None", "null", "N/A", "-", "undefined" или пустые строки.
        </context_rules>

        <edge_cases>
        1. Зачёт допрасходов с конкретным перечнем (лечение, образование): offset_regime = "provided", categories_status = "defined", в details — перечень.
        2. Оговорок о зачёте нет: offset_regime = "statutory_default", overpayment = "statutory_default" — дефолт ст. 86 СК РФ (через суд) и отсутствие зачёта переплаты по умолчанию.
        3. Зачёт переплаты прямо запрещён: overpayment_credit_regime = "prohibited", в details — цитата запрета.
        4. Исключительные обстоятельства названы, но зачёт не установлен: exceptional_circumstances_status = "defined", offset_regime = "statutory_default" (суд решит по ст. 86 СК РФ).
        </edge_cases>

        <output_expectations>
        Верни строго JSON с 8 ключами (7 полей + evidence).
        Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "offset_and_overpayment_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по зачёту дополнительных расходов и переплаты. Внутреннее агрегатное signal-поле."
          required: true
        - name: "offset_regime"
          type: "string"
