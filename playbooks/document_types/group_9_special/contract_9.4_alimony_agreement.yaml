      в соглашении. По п. 4 ст. 113 СК РФ размер задолженности по соглашению
      определяется исходя из размера, предусмотренного соглашением. При отсутствии
      механизма в тексте применяется порядок ст. 113 СК РФ (расчёт судебным
      приставом). Учитывается 3-летний предел взыскания за прошлый период
      (п. 2 ст. 107 СК РФ) и индексация задолженности (п. 2 ст. 117 СК РФ).
    triggers: {}
