      store_payload: true

  - id: indexation_check
    name: "Индексация алиментов в твёрдой сумме (ст. 105 СК РФ)"
    description: >
      Фактографическая проверка механизма индексации для алиментов, установленных
      в твёрдой денежной сумме. По ст. 105 СК РФ индексация императивна: если
      в соглашении не установлен иной порядок, применяется дефолт закона —
      пропорционально росту величины прожиточного минимума по месту жительства
      получателя. Отсутствие упоминания индексации в тексте — не дефект,
      применяется дефолт.                                                        # ← FIX: юридическая правка
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 50                                                          # ← FIX: порядок в пакете

    rules:
      keywords:
        - "индексация"
        - "индексация алиментов"
        - "прожиточный минимум"
        - "рост потребительских цен"
        - "ИПЦ"
        - "пропорционально росту"
        - "пересчёт суммы"
        - "перерасчёт"
        - "ст. 105 СК РФ"                                                      # ← оставлено для keyword-ретрива
      keyword_mode: "any"
      regex_patterns:
        - "(?i)индексаци(я|ю|и)\\s+(размера\\s+)?алимент"
        - "(?i)пропорционально\\s+(росту\\s+)?(величин(ы|е)|размер(у|а))\\s+прожиточн"
        - "(?i)(подлежат|производится)\\s+индексаци"                           # ← FIX: пассивные конструкции

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по семейному праву.
        Анализируется соглашение об уплате алиментов (ст. 105 СК РФ).
        Проверяется только один вопрос: механизм индексации алиментов.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте соглашения.
        - Не оценивай серьёзность риска.
        - По ст. 105 СК РФ индексация алиментов в твёрдой сумме императивна:
          если иной порядок не установлен соглашением, применяется дефолт —
          пропорционально росту величины прожиточного минимума. Поэтому
          отсутствие упоминания индексации в тексте — НЕ дефект; применяется
          дефолт закона.                                                        # ← FIX: правовая правка
        [ЗАДАЧА]
        Найди в тексте соглашения:
        1. Наличие механизма индексации (свой порядок / ссылка на ст. 105 /
           не указан — дефолт закона).
        2. Основание индексации (прожиточный минимум / ИПЦ / фиксированный %).
        3. Периодичность индексации.
        4. Кто производит индексацию.
        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если данные не указаны прямо — возвращай "not_defined" (для status)
           или "Данные не определены" (для value-полей).
        3. Различай три уровня состояния механизма индексации:                   # ← FIX: расширенная трихотомия
           * "concrete" — в тексте прямо установлен свой порядок индексации
             (база, периодичность, исполнитель);
           * "default_reference" — в тексте есть прямая отсылка к ст. 105 СК РФ;
           * "statutory_default" — индексация не упомянута; применяется дефолт
             ст. 105 СК РФ (ПМ по месту жительства получателя);
           * "not_applicable" — алименты не в твёрдой сумме, индексация
             неприменима.
        4. Не используй "None", "null", "N/A", "-", "undefined" или пустые строки.
        5. В evidence включай только текст соглашения.
        6. Верни РОВНО один валидный JSON-объект со всеми 7 ключами, пригодный
           для парсинга через json.loads без предварительной обработки. Без markdown,
           без ```json, без комментариев, без текста до или после. Начни ответ
           сразу с { и закончи }.                                                  # ← FIX: канон + N=7
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — свой конкретный порядок индексации:
        Фрагмент:
        "Размер алиментов подлежит индексации пропорционально росту величины
        прожиточного минимума для детей в субъекте РФ по месту жительства
        получателя. Индексация производится ежеквартально плательщиком
        самостоятельно."
        Ответ:
        {
          "indexation_status": "concrete",
          "indexation_basis": "subsistence_minimum",
          "indexation_frequency_status": "defined",
          "indexation_frequency_details": "ежеквартально",
          "indexation_performer_status": "defined",
          "indexation_performer_details": "плательщик самостоятельно",
          "evidence": [
            {
              "clause_ref": "п. 2.3",
              "quote": "Размер алиментов подлежит индексации пропорционально росту величины прожиточного минимума для детей в субъекте РФ по месту жительства получателя. Индексация производится ежеквартально плательщиком самостоятельно."
            }
          ]
        }
        Пример 2 — индексация не упомянута, применяется дефолт ст. 105 СК РФ:    # ← FIX: ключевой edge-case
        Фрагмент:
        "Алименты уплачиваются в размере 20 000 рублей ежемесячно не позднее
        10-го числа каждого месяца."
        Ответ:
        {
          "indexation_status": "statutory_default",
          "indexation_basis": "subsistence_minimum",
          "indexation_frequency_status": "not_defined",
          "indexation_frequency_details": "Данные не определены",
          "indexation_performer_status": "not_defined",
          "indexation_performer_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 2.1",
              "quote": "Алименты уплачиваются в размере 20 000 рублей ежемесячно не позднее 10-го числа каждого месяца."
            }
          ]
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Проверь, что все 7 ключей (6 полей + evidence) присутствуют в JSON.    # ← FIX: counter
        2. Найди прямую цитату об индексации. Если нет — статус "statutory_default".
        3. Найди прямую цитату об основании индексации.
        4. Найди прямую цитату о периодичности.
        5. Если прямой цитаты нет — верни "not_defined". Не додумывай.
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "indexation_status": "<concrete / default_reference / statutory_default / not_applicable / not_defined>",
          "indexation_basis": "<subsistence_minimum / CPI / fixed_percentage / other / not_defined>",
          "indexation_frequency_status": "<defined / not_defined>",
          "indexation_frequency_details": "<периодичность или 'Данные не определены'>",
          "indexation_performer_status": "<defined / not_defined>",
          "indexation_performer_details": "<кто индексирует или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 500                                                          # ← FIX: +50 под расширенные примеры

    retrieval:
      retrieval_profile: "payment_terms_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "индексация алиментов прожиточный минимум рост потребительских цен ИПЦ пропорционально росту пересчёт суммы периодичность индексации кто производит индексацию"
                                                                           # ← FIX: убраны дубли и ссылка на статью (шум)
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "размер алиментов"
        - "порядок выплаты"
        - "неустойка"
        - "прекращение"
        - "изменение соглашения"
        - "дополнительные расходы"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.15, 0.65]
        boost: 0.30
        scope: segment
      context_k: 8                                                             # ← FIX: 4 → 8 (6 полей ≥ 5, risk 2/4)
      max_chunks: 10                                                           # ← FIX: 6 → 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 500

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 800                                                      # ← FIX: +100 под расширенные правила
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по семейному праву. Извлеки из соглашения об уплате
        алиментов механизм индексации.
        Не анализируй размер алиментов, порядок выплаты или прекращение.
        </role>
        <context>
        {context}
        </context>
        <task>
        Заполни строго следующие 6 полей + evidence (всего 7 ключей):          # ← FIX: counter sync
        1. indexation_status — concrete / default_reference / statutory_default / not_applicable / not_defined.
        2. indexation_basis — subsistence_minimum / CPI / fixed_percentage / other / not_defined.
        3. indexation_frequency_status — "defined" или "not_defined".
        4. indexation_frequency_details — периодичность индексации.
        5. indexation_performer_status — "defined" или "not_defined".
        6. indexation_performer_details — кто производит индексацию.
        7. evidence — список цитат из соглашения.
        Если данные отсутствуют в тексте:
        - статус = "not_defined"
        - текстовое поле = "Данные не определены"
        </task>
        <rules>
        - Используй только текст соглашения.
        - indexation_status:                                                        # ← FIX: расширенная семантика
          * "concrete" — в тексте прямо установлен свой порядок индексации;
          * "default_reference" — в тексте есть прямая отсылка к ст. 105 СК РФ;
          * "statutory_default" — индексация не упомянута; по ст. 105 СК РФ
            применяется дефолт (ПМ по месту жительства получателя);
          * "not_applicable" — алименты не в твёрдой сумме;
          * "not_defined" — индексация не может быть определена по тексту.
        - По ст. 105 СК РФ индексация алиментов в твёрдой сумме императивна.
          Если в тексте нет упоминания индексации, это НЕ дефект — фиксируй
          "statutory_default" и basis "subsistence_minimum".                        # ← FIX: правовая логика
        - indexation_basis: "прожиточный минимум" = "subsistence_minimum";
          "индекс потребительских цен" = "CPI"; фиксированный % = "fixed_percentage";
          иной = "other"; не указан = "not_defined".
        - Верни РОВНО один валидный JSON-объект со всеми 7 ключами, пригодный
          для парсинга через json.loads без предварительной обработки. Без markdown,
          без ```json, без комментариев, без текста до или после. Начни ответ
          сразу с { и закончи }.                                                    # ← FIX: канон
        </rules>

      fields:
        - name: "indexation_status"
          type: "string"
          presentation: "fact"                                                 # ← FIX: signal → fact (ключевой сигнал для юриста)
          display_in_grid: true                                                # ← FIX
          display_priority: 1                                                  # ← FIX
          label: "Механизм индексации"                                         # ← FIX: label обязателен для fact
          allowed_values: ["concrete", "default_reference", "statutory_default", "not_applicable", "not_defined"]
          description: "Механизм индексации: свой порядок / отсылка / дефолт ст. 105 СК РФ / не применимо."
          required: true
        - name: "indexation_basis"
          type: "string"
          presentation: "fact"                                                 # ← FIX: signal → fact (база важна)
          display_in_grid: true                                                # ← FIX
          display_priority: 2                                                  # ← FIX
          label: "База индексации"                                             # ← FIX: label обязателен для fact
          allowed_values: ["subsistence_minimum", "CPI", "fixed_percentage", "other", "not_defined"]
          description: "Основание индексации: прожиточный минимум / ИПЦ / фиксированный %."
          required: false
        - name: "indexation_frequency_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус периодичности индексации."
          required: true
        - name: "indexation_frequency_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Периодичность индексации"
          description: "Периодичность индексации алиментов."
