        unclear_values: ["unclear"]
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по семейному праву. Извлеки из соглашения об уплате
        алиментов размер алиментов, способ определения, периодичность выплаты
        и оцени соответствие минимуму ст. 81 СК РФ.
        Не анализируй нотариальную форму, индексацию, неустойку или прекращение.
        </role>

        <context>
        {context}
        </context>

        <task>
        0. amount_minimum_compliance_check_presence:
           Агрегатное signal-поле — наличие регулирования по размеру алиментов.
           - "present" — если хотя бы одно из содержательных полей (amount_type, amount_value_status, minimum_compliance_status, payment_frequency_status) ≠ "not_defined";
           - "missing" — если все четыре содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме размера есть, но из-за противоречий вывод невозможен.

           Если presence = "missing":
           - amount_type = "not_defined";
           - amount_value_status = "not_defined";
           - amount_value_details = "Данные не определены";
           - minimum_compliance_status = "not_defined";
           - minimum_compliance_note = "Данные не определены";
           - payment_frequency_status = "not_defined";
           - payment_frequency_details = "Данные не определены";
           - number_of_children_status = "not_defined";
           - number_of_children_value = "Данные не определены";
           - не выполняй остальные шаги.

        1. amount_type — способ определения размера: proportional / fixed / mixed / property_transfer / not_defined.
        2. amount_value_status — "defined" если конкретный размер указан, иначе "not_defined".
        3. amount_value_details — конкретный размер (сумма или доля) или "Данные не определены".
        4. minimum_compliance_status — оценка соответствия ст. 81 СК РФ.
        5. minimum_compliance_note — краткое обоснование оценки.
        6. payment_frequency_status — "defined" если периодичность указана, иначе "not_defined".
        7. payment_frequency_details — периодичность или "Данные не определены".
        8. number_of_children_status — "defined" / "not_defined" / "not_applicable".
        9. number_of_children_value — число детей арабской цифрой или "Данные не определены".
        </task>

        <context_rules>
        - Используй только текст соглашения.
        - amount_type: "доля от заработка/дохода" = "proportional"; "твёрдая денежная сумма" = "fixed"; комбинация = "mixed"; "предоставление имущества" = "property_transfer"; не указан = "not_defined".
        - minimum_compliance_status:
          * "compliant" — для proportional доля ≥ 1/4 (1 ребёнок), 1/3 (2), 1/2 (3+) по п. 1 ст. 81 СК РФ;
          * "below_minimum" — для proportional доля ниже указанных порогов;
          * "not_evaluable" — для fixed/mixed/property_transfer, либо недостаточно данных (не указано число детей, регион для ПМ);
          * "not_applicable" — выгодоприобретатель не несовершеннолетний ребёнок;
          * "not_defined" — размер не указан.
        - number_of_children_status: "not_applicable" — если алименты не на несовершеннолетних детей (супруг, родитель, иной член семьи).
        - number_of_children_value: арабской цифрой ("1", "2", "3"); если не на детей — "Данные не определены".
        - Не используй "None", "null", "N/A", "-", "undefined" или пустые строки.
        </context_rules>

        <edge_cases>
        1. Доля ниже минимума (например, 1/6 на одного ребёнка): minimum_compliance_status = "below_minimum", в note — ссылка на п. 1 ст. 81 и п. 2 ст. 103 СК РФ.
        2. Твёрдая сумма без указания региона и ПМ: minimum_compliance_status = "not_evaluable", в note — «необходим ПМ субъекта РФ для оценки».
        3. Алименты на супруга/родителя (не на ребёнка): minimum_compliance_status = "not_applicable", number_of_children_status = "not_applicable".
        4. Смешанный способ (доля + твёрдая сумма): amount_type = "mixed", minimum_compliance_status = "not_evaluable" (сравнение с долевой нормой ст. 81 неприменимо напрямую).
        </edge_cases>

        <output_expectations>
        Верни строго JSON с 10 ключами (9 полей + evidence).
        Технический формат JSON (value / confidence / location) задан отдельным контрактом — 

