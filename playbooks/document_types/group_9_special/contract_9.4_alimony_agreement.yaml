        - "price_list"
      preferred_clause_functions:
        - "remedies"
        - "obligations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 550

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 800
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по семейному праву. Извлеки из соглашения об уплате
        алиментов неустойку за просрочку, зачёт дополнительных расходов и переплату.
        Не анализируй размер алиментов, порядок выплаты или прекращение.
        </role>
        <context>
        {context}
        </context>
        <task>
        Заполни строго следующие поля:
        1. penalty_clause_status — "defined" или "not_defined".
        2. penalty_rate_status — "defined" или "not_defined".
        3. penalty_rate_details — размер неустойки.
        4. penalty_type — per_day / per_month / fixed / other / not_defined.
        5. additional_damages_status — "defined" или "not_defined".
        6. offset_clause_status — "defined" или "not_defined".
        7. offset_categories_status — "defined" или "not_defined".
        8. offset_categories_details — перечень категорий расходов.
        9. overpayment_credit_status — "defined" или "not_defined".
        Если данные отсутствуют в тексте:
        - статус = "not_defined"
        - текстовое поле = "Данные не определены"
        </task>
        <rules>
        - Используй только текст соглашения.
        - penalty_type: "за каждый день" = "per_day";
          "за каждый месяц" = "per_month";
          "фиксированная сумма" = "fixed";
          иной тип = "other"; не указан = "not_defined".
        - Верни только JSON.
        </rules>
      fields:
        - name: "penalty_clause_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус неустойки за просрочку."
          required: true
        - name: "penalty_rate_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус размера неустойки."
          required: false
        - name: "penalty_rate_details"
          type: "string"
          presentation: "fact"
          label: "Размер неустойки"
          description: "Размер неустойки за просрочку."
          required: false
          display_in_grid: true
          display_priority: 1
        - name: "penalty_type"
          type: "string"
          presentation: "signal"
          allowed_values: ["per_day", "per_month", "fixed", "other", "not_defined"]
          description: "Тип неустойки."
          required: false
        - name: "additional_damages_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус права на убытки сверх неустойки."
          required: false
        - name: "offset_clause_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус условия о зачёте расходов."
          required: false
        - name: "offset_categories_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус перечня категорий расходов."
          required: false
        - name: "offset_categories_details"
