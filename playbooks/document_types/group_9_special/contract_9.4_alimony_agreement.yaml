  - id: amount_minimum_compliance_check
    name: "Размер алиментов, способ определения и соответствие минимуму (ст. 81, 103, 104 СК РФ)"
    description: >
      Фактографическая проверка размера алиментов, способа определения
      (доля / твёрдая сумма / смешанный / предоставление имущества), периодичности
      и соответствия минимальному размеру по ст. 81 СК РФ для несовершеннолетних
      детей. Соглашение не может устанавливать размер ниже того, который дети
      могли бы получить при взыскании через суд (п. 2 ст. 103 СК РФ).
    triggers: {}
    ui_mode: "field_extraction"
