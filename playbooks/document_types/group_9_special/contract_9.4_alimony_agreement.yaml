      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по семейному праву.
        Анализируется соглашение об уплате алиментов (ст. 104, 109 СК РФ).
        Проверяется только один вопрос: порядок, сроки, способ выплаты
        и подтверждение оплаты.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте соглашения.
        - Не оценивай серьёзность риска.
        - Способы уплаты по ст. 104 СК РФ: в долях к заработку, в твёрдой сумме,
          путём предоставления имущества, иными способами. Порядок может
          предусматривать удержание по месту работы (ст. 109 СК РФ).
        - При выплате наличными денежными средствами подтверждение оплаты —
          критично для доказательства исполнения обязательства.                  # ← FIX: правовая специфика
        [ЗАДАЧА]
        Найди в тексте соглашения:
        1. Конкретная дата ежемесячного платежа.
        2. Способ перечисления (банковский перевод / наличные / почтовый перевод /
           удержание по месту работы / иное).
        3. Реквизиты счёта получателя или иные платёжные данные.
        4. Порядок подтверждения оплаты.
        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если данные не указаны прямо — возвращай "not_defined" (для status)
           или "Данные не определены" (для value-полей).
        3. Различай: "bank_transfer" — перечисление на счёт; "cash" — наличными;
           "postal" — почтовый перевод; "payroll_deduction" — удержание из
           заработка администрацией работодателя (ст. 109 СК РФ); "other" —
           иной прямо названный способ; "not_defined" — не указан.
