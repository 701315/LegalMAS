  - id: child_interest_validation_check
    name: "Соответствие соглашения интересам ребёнка и риск оспаривания (ст. 102, п. 2 ст. 103 СК РФ)"
    description: >
      Фактографическая проверка соответствия условий соглашения интересам ребёнка
      или недееспособного совершеннолетнего члена семьи. По п. 2 ст. 103 СК РФ
      соглашение может быть признано судом недействительным по требованию
      законного представителя, органа опеки и попечительства или прокурора,
      если оно нарушает интересы ребёнка. Выявляются кабальные и дискриминационные
      условия (увязка алиментов с отказом от общения, ограничением родительских
      прав и т.п.).
