        - "(?i)в\\s+случае\\s+смерти\\s+(плательщик|получател)"
        - "(?i)односторонн(ий|его)\\s+отказ"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по семейному праву.
        Анализируется соглашение об уплате алиментов (ст. 120 СК РФ,
        п. 2 ст. 101 СК РФ).
        Проверяется только один вопрос: условия прекращения обязательств
        и режим одностороннего отказа.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте соглашения.
        - Не оценивай серьёзность риска.
        - По ст. 120 СК РФ прекращение алиментных обязательств наступает
          в силу закона при наступлении определённых событий (совершеннолетие,
          эмансипация, усыновление, смерть плательщика/получателя, восстановление
          трудоспособности, вступление в новый брак) — независимо от наличия
          оговорки в тексте. Отсутствие clause — НЕ дефект.
        - По п. 2 ст. 101 СК РФ односторонний отказ не допускается.
        [ЗАДАЧА]
        Найди в тексте соглашения:
        1. Наличие перечня оснований прекращения.
        2. Конкретная дата или событие окончания.
        3. Условие о смерти плательщика/получателя.
        4. Условие об одностороннем отказе.
        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если данные не указаны прямо — возвращай "not_defined" (для status)
           или "Данные не определены" (для value-полей).
        3. termination_events_status:
           * "defined" — в тексте прямо установлен перечень оснований прекращения;
           * "statutory_default" — оговорки нет; применяется ст. 120 СК РФ
             (основания в силу закона);
           * "not_applicable" — прекращение невозможно по природе обязательства;
           * "not_defined" — неопределимо.
        4. unilateral_refusal_regime:
           * "prohibited" — прямо запрещён (норма п. 2 ст. 101 СК РФ);
           * "allowed" — в тексте допущен (нетипично для алиментных соглашений);
           * "statutory_default" — не указано; применяется запрет по п. 2 ст. 101;
           * "not_defined" — неопределимо.
        5. Не используй "None", "null", "N/A", "-", "undefined" или пустые строки.
        6. В evidence включай только текст соглашения.
        7. Верни РОВНО один валидный JSON-объект со всеми 7 ключами, пригодный
           для парсинга через json.loads без предварительной обработки. Без markdown,
           без ```json, без комментариев, без текста до или после. Начни ответ
           сразу с { и закончи }.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — перечень оснований и запрет отказа установлены:
