        </role>

        <context>
        {context}
        </context>

        <task>
        0. tax_regime_check_presence:
           Агрегатное signal-поле — наличие регулирования по налоговому режиму алиментов.
           - "present" — если хотя бы одно из содержательных полей (tax_clause_status, ndfl_exemption_status, payer_deduction_regime, payroll_tax_reporting_status) ≠ "not_defined";
           - "missing" — если все четыре содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме налогообложения есть, но из-за противоречий вывод невозможен.

           Если presence = "missing":
           - tax_clause_status = "not_defined";
           - tax_clause_details = "Данные не определены";
           - ndfl_exemption_status = "not_defined";
           - payer_deduction_regime = "not_defined";
           - payroll_tax_reporting_status = "not_defined";
           - payroll_tax_reporting_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. tax_clause_status — defined / statutory_default / not_defined.
        2. tax_clause_details — текст налоговой оговорки или "Данные не определены".
        3. ndfl_exemption_status — exempt / not_exempt / statutory_default / not_defined.
        4. payer_deduction_regime — not_available / available / statutory_default / not_defined.
        5. payroll_tax_reporting_status — "defined" если удержание по месту работы указано, иначе "not_defined".
        6. payroll_tax_reporting_details — условия удержания или "Данные не определены".
        </task>

        <context_rules>
        - Используй только текст соглашения.
        - tax_clause_status:
          * "defined" — в тексте есть налоговая оговорка (НДФЛ, вычет, налогообложение);
          * "statutory_default" — оговорки нет, применяется дефолт п. 5 ст. 217 НК РФ (освобождение от НДФЛ). Это НЕ дефект;
          * "not_defined" — неопределимо.
        - ndfl_exemption_status:
          * "exempt" — прямо указано освобождение от НДФЛ;
          * "not_exempt" — в тексте прямо установлено налогообложение алиментов (неправомерно, но фиксируй как есть);
          * "statutory_default" — не указано, применяется п. 5 ст. 217 НК РФ;
          * "not_defined" — неопределимо.
        - payer_deduction_regime:
          * "not_available" — прямо указано отсутствие вычета у плательщика;
          * "available" — в тексте установлено право на вычет (неправомерно, но фиксируй);
          * "statutory_default" — не указано, вычет не предоставляется;
          * "not_defined" — неопределимо.
        - payroll_tax_reporting_status = "defined", если в тексте прямо указано удержание по месту работы (ст. 109 СК РФ).
        - Не приводи конкретные номера писем Минфина или ФНС.
        - Не используй "None", "null", "N/A", "-", "undefined" или пустые строки.
        </context_rules>

        <edge_cases>
        1. Корректная налоговая оговорка (освобождение + отсутствие вычета): tax_clause_status = "defined", ndfl = "exempt", deduction = "not_available".
        2. Оговорок нет: tax_clause_status = "statutory_default", ndfl = "statutory_default", deduction = "statutory_default" — дефолт п. 5 ст. 217 НК РФ, это НЕ дефект.
        3. Неправомерная оговорка о налогообложении алиментов: ndfl = "not_exempt" — зафиксировать как факт, это противоречит императивной норме.
        4. Удержание по месту работы + налоговая оговорка: payroll_tax_reporting = "defined", tax_clause = "defined" — работодатель платёжный агент, но не налоговый агент по алиментам.
        </edge_cases>

        <output_expectations>
        Верни строго JSON с 7 ключами (6 полей + evidence).
        Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

