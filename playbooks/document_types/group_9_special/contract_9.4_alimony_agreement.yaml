        - name: "indexation_performer_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания на лицо, производящее индексацию."
          required: true
        - name: "indexation_performer_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false                                               # ← FIX: → Drawer (в Grid избыточно)
          display_priority: 5
          label: "Кто индексирует"                                             # ← label обязателен для fact
          description: "Кто производит индексацию (плательщик / работодатель / пристав / иное)."
          required: false
      store_payload: true

  - id: adjustment_mechanism_check
    name: "Изменение соглашения при существенном изменении обстоятельств (ст. 101 СК РФ)"
    description: >
      Фактографическая проверка наличия в тексте механизма изменения размера
      алиментов при существенном изменении материального или семейного положения
      сторон. По п. 3 ст. 101 СК РФ сторона вправе требовать изменения в суде
      независимо от наличия оговорки в тексте — применяется дефолт закона.
      Соглашение об изменении подлежит нотариальному удостоверению (п. 2 ст. 101
      СК РФ).                                                                   # ← FIX: правовая правка
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 60                                                          # ← FIX: порядок в пакете

    rules:
      keywords:
        - "существенное изменение"
        - "изменение материального положения"
        - "изменение семейного положения"
        - "потеря работы"
        - "снижение доходов"
        - "рождение другого ребёнка"
        - "пересмотр размера"
        - "корректировка"
        - "право на изменение"
        - "изменение соглашения"                                              # ← FIX
        - "досудебный порядок"
        - "ст. 101 СК РФ"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)существенн(ое|ого)\\s+изменени(е|я)\\s+(материальн|семейн)"
        - "(?i)пересмотр\\s+размера\\s+алимент"
        - "(?i)снижени(е|я)\\s+доход(ов|а)"
        - "(?i)изменени(е|я)\\s+(настоящего\\s+)?соглашени"                    # ← FIX

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по семейному праву.
        Анализируется соглашение об уплате алиментов (ст. 101 СК РФ).
        Проверяется только один вопрос: наличие механизма изменения размера
        при существенном изменении материального или семейного положения сторон.
