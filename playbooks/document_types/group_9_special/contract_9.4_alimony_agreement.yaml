        </role>
        <context>
        {context}
        </context>
        <task>
        Заполни строго следующие 9 полей + evidence (всего 10 ключей):          # ← FIX: counter sync
        1. amount_type — proportional / fixed / mixed / property_transfer / not_defined.
        2. amount_value_status — "defined" или "not_defined".
        3. amount_value_details — конкретный размер.
        4. minimum_compliance_status — compliant / below_minimum / not_evaluable / not_applicable / not_defined.
        5. minimum_compliance_note — краткое обоснование.
        6. payment_frequency_status — "defined" или "not_defined".
        7. payment_frequency_details — периодичность выплаты.
        8. number_of_children_status — "defined" или "not_defined".
        9. number_of_children_value — число детей.
        10. evidence — список цитат из соглашения.                             # ← FIX
