      store_payload: true

  - id: post_majority_support_check
    name: "Алименты после 18 лет: нетрудоспособные дети и добровольная поддержка студентов (ст. 85, 120 СК РФ)"
    description: >
      Фактографическая проверка условий соглашения об алиментах после достижения
      выгодоприобретателем 18 лет. По ст. 85 СК РФ родители обязаны содержать
      совершеннолетних нетрудоспособных нуждающихся детей. Алименты на обучающихся
      очной формы после 18 лет законом не предусмотрены — их можно установить
      только добровольно через соглашение. По ст. 120 СК РФ алиментные
      обязательства прекращаются по достижении 18 лет, кроме случаев
      нетрудоспособности.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "low"
    severity_if_pass: "pass"
    severity_if_fail: "low"
    severity_if_unclear: "low"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 200

    rules:
      keywords:
        - "совершеннолетний ребёнок"
        - "совершеннолетний ребенок"
        - "нетрудоспособный"
        - "нуждающийся"
        - "студент"
        - "обучение"
        - "очная форма"
        - "инвалид"
        - "инвалидность"
        - "после 18 лет"
        - "после восемнадцати"
        - "ст. 85 СК РФ"
        - "ст. 120 СК РФ"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)совершеннолетн[а-яё]+\\s+(ребён|ребен|нетрудоспособн)"
        - "(?i)нетрудоспособн[а-яё]+\\s+(совершеннолетн|нуждающ)"
        - "(?i)(после|по\\s+достижении)\\s+(18|восемнадцат)"
        - "(?i)студент|обучени[е-яё]"
        - "(?i)инвалид[а-яё]*\\s+(I|II|III|1|2|3)\\s+групп"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по семейному праву.
        Анализируется соглашение об уплате алиментов (ст. 85, 120 СК РФ).
        Проверяется только один вопрос: условия об алиментах после достижения
        18 лет.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте соглашения.
        - Не оценивай серьёзность риска — фиксируй факты.
        - По ст. 85 СК РФ родители обязаны содержать совершеннолетних
          нетрудоспособных нуждающихся детей.
        - Обучение очной формы не является законным основанием для алиментов
          после 18 лет; такие обязательства возможны только добровольно
          через соглашение.
        - По ст. 120 СК РФ алименты прекращаются по достижении 18 лет,
          кроме случаев нетрудоспособности.
        [ЗАДАЧА]
        Найди в тексте соглашения:
        1. Наличие условий об алиментах после 18 лет.
        2. Категория оснований (нетрудоспособность / обучение / иное).
        3. Условия прекращения в связи с достижением 18 лет.
        4. Условия о добровольной поддержке студента.
        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если данные не указаны прямо — возвращай "not_defined" (для status)
           или "Данные не определены" (для value-полей).
        3. post_majority_regime:
           * "adult_disabled" — условия об алиментах на совершеннолетних
             нетрудоспособных (ст. 85 СК РФ);
           * "student_voluntary" — условия о добровольной поддержке студентов;
           * "both" — обе категории;
           * "not_provided" — алименты после 18 лет не предусмотрены
             (применяется ст. 120 СК РФ);
           * "not_defined" — неопределимо.
        4. termination_on_majority_status:
           * "defined" — в тексте прямо указано прекращение по достижении 18 лет;
           * "statutory_default" — не указано; применяется ст. 120 СК РФ;
           * "not_defined" — неопределимо.
        5. Не используй "None", "null", "N/A", "-", "undefined" или пустые строки.
        6. В evidence включай только текст соглашения.
        7. Верни РОВНО один валидный JSON-объект со всеми 7 ключами, пригодный
           для парсинга через json.loads без предварительной обработки. Без markdown,
           без ```json, без комментариев, без текста до или после. Начни ответ
           сразу с { и закончи }.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — алименты на нетрудоспособного совершеннолетнего:
        Фрагмент:
        "Алименты уплачиваются на содержание совершеннолетнего нетрудоспособного
        ребёнка — инвалида II группы, нуждающегося в постоянном уходе. Выплаты
        производятся бессрочно."
        Ответ:
        {
          "post_majority_regime": "adult_disabled",
          "post_majority_details": "инвалид II группы, нуждается в постоянном уходе, выплаты бессрочно",
          "termination_on_majority_status": "not_defined",
          "termination_on_majority_details": "Данные не определены",
          "student_support_status": "not_defined",
          "student_support_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 2.4",
              "quote": "Алименты уплачиваются на содержание совершеннолетнего нетрудоспособного ребёнка — инвалида II группы, нуждающегося в постоянном уходе. Выплаты производятся бессрочно."
            }
          ]
        }
        Пример 2 — оговорок о совершеннолетии нет, применяется дефолт закона:
        Фрагмент:
        "Алименты уплачиваются на содержание несовершеннолетнего сына в размере
        1/4 заработка плательщика ежемесячно."
        Ответ:
        {
          "post_majority_regime": "not_provided",
          "post_majority_details": "алименты после 18 лет не предусмотрены",
          "termination_on_majority_status": "statutory_default",
          "termination_on_majority_details": "Данные не определены",
          "student_support_status": "not_defined",
          "student_support_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 2.1",
              "quote": "Алименты уплачиваются на содержание несовершеннолетнего сына в размере 1/4 заработка плательщика ежемесячно."
            }
          ]
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Проверь, что все 7 ключей (6 полей + evidence) присутствуют в JSON.
        2. Найди прямую цитату об алиментах после 18 лет.
        3. Найди прямую цитату о нетрудоспособности.
        4. Найди прямую цитату о прекращении по достижении 18 лет.
        5. Если прямой цитаты нет — верни "statutory_default" или "not_defined".
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "post_majority_regime": "<adult_disabled / student_voluntary / both / not_provided / not_defined>",
          "post_majority_details": "<текст или 'Данные не определены'>",
          "termination_on_majority_status": "<defined / statutory_default / not_defined>",
          "termination_on_majority_details": "<текст или 'Данные не определены'>",
          "student_support_status": "<defined / not_defined>",
          "student_support_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 650

    retrieval:
      retrieval_profile: "payment_terms_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "совершеннолетний ребёнок нетрудоспособный нуждающийся студент обучение очная форма инвалид инвалидность после 18 лет после восемнадцати прекращение по достижении 18 лет"
      preferred_unit_types:
        - obligation
        - termination_provision
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "нотариус"
        - "индексация"
        - "неустойка"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.30, 0.80]
        boost: 0.30
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 550

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      presence_signal:
        field: "post_majority_support_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]
      llm_max_tokens: 900
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по семейному праву. Извлеки из соглашения об уплате
        алиментов условия об алиментах после 18 лет и прекращении по достижении
        совершеннолетия (ст. 85, 120 СК РФ).
        Не анализируй размер, порядок выплаты или индексацию.
        </role>

        <context>
        {context}
        </context>

        <task>
        0. Сначала определи post_majority_support_check_presence:
           - "present" — в тексте есть фрагменты об алиментах после 18 лет,
             нетрудоспособности совершеннолетнего, поддержке студентов
             или прекращении по достижении совершеннолетия;
           - "missing" — таких фрагментов нет (алименты только до 18 лет,
             без специальных оговорок);
           - "unclear" — есть косвенные упоминания (например, «до окончания
             обучения»), но однозначно определить режим невозможно.
           Если presence = "missing", заполни post_majority_regime =
           "not_provided", termination_on_majority_status = "statutory_default",
           student_support_status = "not_defined", все details =
           "Данные не определены" и переходи к evidence.

        1. post_majority_regime — "adult_disabled" / "student_voluntary" /
           "both" / "not_provided" / "not_defined".
        2. post_majority_details — условия об алиментах после 18 лет.
        3. termination_on_majority_status — "defined" / "statutory_default"
           / "not_defined".
        4. termination_on_majority_details — условия о прекращении.
        5. student_support_status — "defined" или "not_defined".
        6. student_support_details — условия о поддержке студентов.
        7. evidence — список цитат из соглашения.
        </task>

        <context_rules>
        - Если в тексте нет фрагментов об алиментах после 18 лет —
          presence = "missing", post_majority_regime = "not_provided",
          termination_on_majority_status = "statutory_default".
        - По ст. 85 СК РФ родители обязаны содержать совершеннолетних
          нетрудоспособных нуждающихся детей. Это законное основание,
          не требующее добровольного соглашения.
        - Обучение очной формы НЕ является законным основанием для алиментов
          после 18 лет по СК РФ. Такие обязательства возможны только
          добровольно через соглашение (student_support_status = "defined").
        - По ст. 120 СК РФ алименты прекращаются по достижении 18 лет,
          кроме случаев нетрудоспособности. Если в тексте прямо указано
          прекращение — termination_on_majority_status = "defined".
          Если не указано — "statutory_default" (законный режим).
        - post_majority_regime = "both", если в тексте есть условия
          и о нетрудоспособных совершеннолетних, и о добровольной поддержке
          студентов.
        - Не используй "None", "null", "N/A", "-", "undefined" или пустые строки.
        - В evidence включай только прямые цитаты из текста соглашения.
        </context_rules>

        <edge_cases>
        - Если в тексте указано «алименты до 18 лет» без оговорок
          о нетрудоспособности или обучении — presence = "present"
          (прекращение прямо указано), post_majority_regime = "not_provided",
          termination_on_majority_status = "defined".
        - Если в тексте есть условие о поддержке ребёнка «до окончания
          очного обучения, но не более 23 лет» — post_majority_regime =
          "student_voluntary", student_support_status = "defined",
          presence = "present" (добровольное обязательство, не основанное
          на СК РФ).
        - Если ребёнок — инвалид с детства и в тексте указано «выплаты
          бессрочно» — post_majority_regime = "adult_disabled",
          termination_on_majority_status = "not_defined" (бессрочность
          исключает прекращение по 18 лет).
        - Если в тексте есть общая оговорка «алименты прекращаются по
          основаниям, предусмотренным ст. 120 СК РФ» без детализации —
          termination_on_majority_status = "defined" (прямая отсылка
          к закону), post_majority_regime = "not_provided".
        </edge_cases>

        <output_expectations>
        Верни строго валидный JSON-объект с 8 ключами (7 полей + evidence).
        Не добавляй пояснений, markdown-обёрток или комментариев.
        Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "post_majority_support_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по алиментам после 18 лет. Внутреннее агрегатное signal-поле."
          required: true
        - name: "post_majority_regime"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Алименты после 18 лет"
          allowed_values: ["adult_disabled", "student_voluntary", "both", "not_provided", "not_defined"]
          description: "Режим алиментов после 18 лет: нетрудоспособные / студенты-добровольно / не предусмотрено."
          required: true
        - name: "post_majority_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          display_priority: 6
          label: "Детали после 18 лет"
          description: "Детали условий об алиментах после 18 лет."
          required: false
        - name: "termination_on_majority_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "statutory_default", "not_defined"]
          description: "Режим прекращения по достижении 18 лет."
          required: true
        - name: "termination_on_majority_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          display_priority: 7
          label: "Прекращение по 18 лет"
          description: "Условия о прекращении по достижении 18 лет."
          required: false
        - name: "student_support_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Наличие условий о поддержке студентов."
          required: true
        - name: "student_support_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          display_priority: 8
          label: "Поддержка студентов"
          description: "Условия о добровольной поддержке студентов."
          required: false
      store_payload: true

  - id: regional_minimum_reference_check
    name: "Привязка твёрдой суммы к прожиточному минимуму региона (ст. 117 СК РФ, ФЗ №134-ФЗ)"
    description: >
      Фактографическая проверка привязки твёрдой суммы алиментов к прожиточному
      минимуму (ПМ) субъекта РФ. По ст. 117 СК РФ индексация твёрдой суммы
      производится пропорционально росту величины ПМ по месту жительства
      получателя. Судебная практика ориентируется на ПМ на ребёнка в регионе
      как минимальный ориентир для твёрдой суммы. Проверяется указание региона,
      категории ПМ (трудоспособное население / дети / пенсионеры) и механизма
      обновления.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "medium"
    severity_if_pass: "pass"
    severity_if_fail: "medium"
    severity_if_unclear: "low"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 210

    rules:
      keywords:
        - "прожиточный минимум"
        - "ПМ"
        - "субъект РФ"
        - "регион"
        - "место жительства получателя"
        - "величина прожиточного минимума"
        - "ПМ на ребёнка"
        - "ПМ на душу населения"
        - "постановление правительства"
        - "ежеквартально"
        - "индексация твёрдой суммы"
        - "ст. 117 СК РФ"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)прожиточн[а-яё]+\\s+минимум"
        - "(?i)ПМ\\s+(на|по)"
        - "(?i)(субъект|регион)[а-яё]*\\s+РФ"
        - "(?i)по\\s+месту\\s+жительства\\s+получател"
        - "(?i)(ежеквартальн|ежегодн)[а-яё]+"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по семейному праву.
        Анализируется соглашение об уплате алиментов (ст. 117 СК РФ,
        ФЗ №134-ФЗ «О прожиточном минимуме в Российской Федерации»).
        Проверяется только один вопрос: привязка твёрдой суммы алиментов
        к прожиточному минимуму региона.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте соглашения.
        - Не оценивай серьёзность риска — фиксируй факты.
        - По ст. 117 СК РФ индексация твёрдой суммы производится пропорционально
          росту ПМ по месту жительства получателя.
        - Судебная практика ориентируется на ПМ на ребёнка в регионе как
          минимальный ориентир для твёрдой суммы (для несовершеннолетних детей).
        - Категории ПМ: на душу населения, для трудоспособного населения,
          для детей, для пенсионеров.
        [ЗАДАЧА]
        Найди в тексте соглашения:
        1. Указание региона / субъекта РФ.
        2. Категорию ПМ (на душу населения / дети / пенсионеры / трудоспособное).
        3. Механизм обновления (ежеквартально / ежегодно / по факту).
        4. Порядок индексации твёрдой суммы.
        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если данные не указаны прямо — возвращай "not_defined" (для status)
           или "Данные не определены" (для value-полей).
        3. regional_minimum_basis:
           * "defined" — в тексте прямо указан регион / субъект РФ для ПМ;
           * "statutory_default" — не указано; применяется ПМ по месту жительства
             получателя (ст. 117 СК РФ);
           * "not_applicable" — алименты не в твёрдой сумме;
           * "not_defined" — неопределимо.
        4. update_mechanism_status:
           * "quarterly" — привязка к ежеквартальному пересмотру ПМ;
           * "annual" — ежегодный пересмотр;
           * "on_change" — по факту изменения ПМ;
           * "statutory_default" — не указано; применяется ст. 117 СК РФ;
           * "not_defined" — неопределимо.
        5. Не используй "None", "null", "N/A", "-", "undefined" или пустые строки.
        6. В evidence включай только текст соглашения.
        7. Верни РОВНО один валидный JSON-объект со всеми 7 ключами, пригодный
           для парсинга через json.loads без предварительной обработки. Без markdown,
           без ```json, без комментариев, без текста до или после. Начни ответ
           сразу с { и закончи }.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — привязка к региональному ПМ:
        Фрагмент:
        "Алименты уплачиваются в твёрдой сумме 18 000 рублей ежемесячно.
        Размер алиментов индексируется пропорционально росту величины прожиточного
        минимума для детей в Московской области по месту жительства получателя.
        Индексация производится ежеквартально."
        Ответ:
        {
          "regional_minimum_basis": "defined",
          "region_details": "Московская область по месту жительства получателя",
          "pm_category_code": "child",
          "pm_category_details": "для детей",
          "update_mechanism_status": "quarterly",
          "update_mechanism_details": "ежеквартально",
          "evidence": [
            {
              "clause_ref": "п. 2.5",
              "quote": "Размер алиментов индексируется пропорционально росту величины прожиточного минимума для детей в Московской области по месту жительства получателя. Индексация производится ежеквартально."
            }
          ]
        }
        Пример 2 — региональная привязка не указана, применяется дефолт ст. 117:
        Фрагмент:
        "Алименты уплачиваются в твёрдой сумме 20 000 рублей ежемесячно не позднее
        10-го числа каждого месяца."
        Ответ:
        {
          "regional_minimum_basis": "statutory_default",
          "region_details": "Данные не определены",
          "pm_category_code": "not_defined",
          "pm_category_details": "Данные не определены",
          "update_mechanism_status": "statutory_default",
          "update_mechanism_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 2.1",
              "quote": "Алименты уплачиваются в твёрдой сумме 20 000 рублей ежемесячно не позднее 10-го числа каждого месяца."
            }
          ]
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Проверь, что все 7 ключей (6 полей + evidence) присутствуют в JSON.
        2. Найди прямую цитату о региональном ПМ.
        3. Найди прямую цитату о категории ПМ.
        4. Найди прямую цитату о механизме обновления.
        5. Если прямой цитаты нет — верни "statutory_default" или "not_defined".
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "regional_minimum_basis": "<defined / statutory_default / not_applicable / not_defined>",
          "region_details": "<текст или 'Данные не определены'>",
          "pm_category_code": "<child / working_age / pensioner / per_capita / not_defined>",
          "pm_category_details": "<текст или 'Данные не определены'>",
          "update_mechanism_status": "<quarterly / annual / on_change / statutory_default / not_defined>",
          "update_mechanism_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 650

    retrieval:
      retrieval_profile: "payment_terms_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "прожиточный минимум ПМ субъект РФ регион место жительства получателя величина прожиточного минимума ПМ на ребёнка ПМ на душу населения постановление правительства ежеквартально индексация твёрдой суммы"
      preferred_unit_types:
        - obligation
        - payment_term
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - procedures
        - obligations
      negative_keywords:
        - "нотариус"
        - "неустойка"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.20, 0.70]
        boost: 0.30
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "procedures"
        - "obligations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 550

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      presence_signal:
        field: "regional_minimum_reference_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]
      llm_max_tokens: 900
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по семейному праву. Извлеки из соглашения об уплате
        алиментов информацию о привязке твёрдой суммы к региональному прожиточному
        минимуму (ст. 117 СК РФ, ФЗ №134-ФЗ).
        Не анализируй размер алиментов, порядок выплаты или прекращение.
        </role>

        <context>
        {context}
        </context>

        <task>
        0. Сначала определи regional_minimum_reference_check_presence:
           - "present" — в тексте есть фрагменты о прожиточном минимуме,
             регионе/субъекте РФ для расчёта ПМ, категории ПМ или механизме
             обновления/индексации твёрдой суммы;
           - "missing" — таких фрагментов нет (алименты в долях от заработка
             или твёрдая сумма без привязки к ПМ);
           - "unclear" — есть косвенные упоминания (например, «индексация
             по закону»), но привязка к ПМ не определена однозначно.
           Если presence = "missing", заполни regional_minimum_basis =
           "statutory_default" (или "not_applicable", если алименты в долях),
           все остальные поля = "not_defined" / "Данные не определены"
           и переходи к evidence.

        1. regional_minimum_basis — "defined" / "statutory_default" /
           "not_applicable" / "not_defined".
        2. region_details — регион / субъект РФ.
        3. pm_category_code — "child" / "working_age" / "pensioner" /
           "per_capita" / "not_defined".
        4. pm_category_details — категория ПМ.
        5. update_mechanism_status — "quarterly" / "annual" / "on_change" /
           "statutory_default" / "not_defined".
        6. update_mechanism_details — механизм обновления.
        7. evidence — список цитат из соглашения.
        </task>

        <context_rules>
        - Если в тексте нет фрагментов о ПМ и индексации — presence = "missing".
        - По ст. 117 СК РФ индексация твёрдой суммы производится
          пропорционально росту ПМ по месту жительства получателя.
        - regional_minimum_basis = "defined", если в тексте прямо указан
          регион/субъект РФ для расчёта ПМ; "statutory_default", если регион
          не указан (применяется ПМ по месту жительства получателя);
          "not_applicable", если алименты не в твёрдой сумме (доля от заработка).
        - pm_category_code: "child" — для детей; "working_age" — для
          трудоспособного населения; "pensioner" — для пенсионеров;
          "per_capita" — на душу населения.
        - update_mechanism_status = "quarterly", если индексация привязана
          к ежеквартальному пересмотру ПМ; "annual" — ежегодно; "on_change" —
          по факту изменения ПМ; "statutory_default" — не указано.
        - Не используй "None", "null", "N/A", "-", "undefined" или пустые строки.
        - В evidence включай только прямые цитаты из текста соглашения.
        </context_rules>

        <edge_cases>
        - Если алименты установлены в долях от заработка (1/4, 1/3, 1/2)
          без твёрдой суммы — regional_minimum_basis = "not_applicable",
          presence = "missing" (ст. 117 СК РФ применяется только к твёрдой сумме).
        - Если в тексте указано «индексация по ст. 117 СК РФ» без указания
          региона и категории ПМ — regional_minimum_basis = "statutory_default",
          pm_category_code = "not_defined", update_mechanism_status =
          "statutory_default", presence = "present" (отсылка к закону есть).
        - Если в тексте прямо указан ПМ на ребёнка в конкретном регионе
          (например, «ПМ для детей в г. Москве») — regional_minimum_basis =
          "defined", pm_category_code = "child", presence = "present".
        - Если твёрдая сумма привязана к ПМ на душу населения, а не на ребёнка —
          pm_category_code = "per_capita", presence = "present" (нестандартная
          категория для алиментов на ребёнка, но допустимая).
        </edge_cases>

        <output_expectations>
        Верни строго валидный JSON-объект с 8 ключами (7 полей + evidence).
        Не добавляй пояснений, markdown-обёрток или комментариев.
        Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "regional_minimum_reference_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по привязке твёрдой суммы к региональному ПМ. Внутреннее агрегатное signal-поле."
          required: true
        - name: "regional_minimum_basis"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Привязка к ПМ"
          allowed_values: ["defined", "statutory_default", "not_applicable", "not_defined"]
          description: "Режим привязки к региональному ПМ: указан / дефолт ст. 117 СК РФ / не применимо."
          required: true
        - name: "region_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Регион ПМ"
          description: "Регион / субъект РФ для расчёта ПМ."
          required: false
        - name: "pm_category_code"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Категория ПМ"
          allowed_values: ["child", "working_age", "pensioner", "per_capita", "not_defined"]
          description: "Категория прожиточного минимума."
          required: false
        - name: "pm_category_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          display_priority: 6
          label: "Детали категории ПМ"
          description: "Детализация категории ПМ."
          required: false
        - name: "update_mechanism_status"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 4
          label: "Механизм обновления"
          allowed_values: ["quarterly", "annual", "on_change", "statutory_default", "not_defined"]
          description: "Механизм обновления ПМ: ежеквартальный / ежегодный / по факту."
          required: false
        - name: "update_mechanism_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          display_priority: 7
          label: "Детали обновления"
          description: "Детали механизма обновления ПМ."
          required: false
      store_payload: true

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 5: DD_REQUEST_TEMPLATES
#  Читается: DDRequestTemplateLoader
# ════════════════════════════════════════════════════════════════════════════

dd_request_templates:
  parties_and_beneficiary_check:
    text: >
      Просим предоставить по {doc_names}: (а) полные данные плательщика (ФИО, паспорт,
      адрес, место работы); (б) полные данные получателя или законного представителя;
      (в) данные лица, на содержание которого уплачиваются алименты (ФИО, дата рождения,
      свидетельство о рождении/паспорт); (г) основание алиментной обязанности.
    addressee: "Обе стороны / Нотариус"

  notarial_form_executive_force_check:
    text: >
      Просим подтвердить по {doc_names}: (а) факт нотариального удостоверения
      (ст. 100 СК РФ); (б) ФИО нотариуса; (в) номер в реестре; (г) упоминание
      исполнительной силы соглашения. Без нотариальной формы соглашение ничтожно.
    addressee: "Нотариус / Обе стороны"

  amount_minimum_compliance_check:
    text: >
      Просим уточнить в {doc_names}: (а) конкретный размер алиментов (сумма/доля);
      (б) способ определения (твёрдая сумма / доля от заработка / смешанный);
      (в) для алиментов на детей — подтверждение соответствия минимуму ст. 81 СК РФ
      (1/4 на одного, 1/3 на двоих, 1/2 на троих и более); (г) число детей.
    addressee: "Плательщик / Нотариус"

  payment_procedure_check:
    text: >
      Просим уточнить в {doc_names}: (а) конкретную дату ежемесячного платежа;
      (б) способ перечисления (банковский перевод / наличные / почтовый перевод);
      (в) реквизиты счёта получателя; (г) порядок подтверждения оплаты
      (платёжное поручение, расписка).
    addressee: "Обе стороны"

  indexation_check:
    text: >
      Просим уточнить в {doc_names}: (а) порядок индексации алиментов в твёрдой сумме
      (ст. 105 СК РФ); (б) привязка к прожиточному минимуму или иная формула;
      (в) периодичность пересчёта; (г) кто производит индексацию (работодатель/приставы).
    addressee: "Юридический советник / Нотариус"

  adjustment_mechanism_check:
    text: >
      Просим уточнить в {doc_names}: (а) основания для пересмотра размера
      (потеря работы, снижение доходов, рождение другого ребёнка); (б) досудебный
      порядок обсуждения; (в) порядок судебного пересмотра (ст. 101 СК РФ).
    addressee: "Юридический советник"

  penalty_and_offset_check:
    text: >
      Просим уточнить в {doc_names}: (а) размер неустойки за просрочку (по ст. 115
      СК РФ — 0,1% в день, но стороны могут установить иной размер); (б) порядок
      расчёта; (в) право на взыскание убытков сверх неустойки; (г) перечень
      дополнительных расходов, подлежащих зачёту (лечение, образование, отдых);
      (д) условия зачёта переплаты.
    addressee: "Юридический советник"

  termination_and_amendment_check:
    text: >
      Просим уточнить в {doc_names}: (а) полный перечень оснований прекращения
      (совершеннолетие, эмансипация, усыновление, смерть, восстановление
      трудоспособности и т.д.); (б) конкретную дату или событие окончания;
      (в) порядок внесения изменений (нотариальная форма, ст. 101 СК РФ);
      (г) невозможность одностороннего отказа.
    addressee: "Юридический советник"

  dispute_confidentiality_targeted_use_check:
    text: >
      Просим уточнить в {doc_names}: (а) досудебный порядок урегулирования споров;
      (б) подсудность; (в) условия конфиденциальности финансовых условий;
      (г) обязанность получателя предоставлять отчёт о целевом использовании
      алиментов по требованию плательщика (ст. 60 СК РФ).
    addressee: "Юридический советник"

  _default:
    text: >
      Просим предоставить дополнительную информацию по вопросу «{check_name}»
      применительно к {doc_names}.
    addressee: "Юридический советник"
