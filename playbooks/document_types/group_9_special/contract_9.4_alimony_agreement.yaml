           без ```json, без комментариев, без текста до или после. Начни ответ
           сразу с { и закончи }.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — зачёт допрасходов установлен:
        Фрагмент:
        "Плательщик вправе производить дополнительные расходы на лечение
        и образование ребёнка с зачётом в счёт алиментов по согласованию
        с получателем. Зачёт производится при представлении документов,
        подтверждающих расходы."
        Ответ:
        {
          "offset_regime": "provided",
          "offset_categories_status": "defined",
          "offset_categories_details": "лечение и образование ребёнка",
          "exceptional_circumstances_status": "not_defined",
          "exceptional_circumstances_details": "Данные не определены",
          "overpayment_credit_regime": "not_defined",
          "overpayment_credit_details": "Данные не определены"
        }
        Пример 2 — оговорок о зачёте нет, применяется дефолт закона:               # ← ключевой edge-case
        Фрагмент:
        "Алименты уплачиваются в размере 20 000 рублей ежемесячно не позднее
        10-го числа каждого месяца."
        Ответ:
        {
          "offset_regime": "statutory_default",
          "offset_categories_status": "not_defined",
          "offset_categories_details": "Данные не определены",
          "exceptional_circumstances_status": "not_defined",
          "exceptional_circumstances_details": "Данные не определены",
          "overpayment_credit_regime": "statutory_default",
          "overpayment_credit_details": "Данные не определены"
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Проверь, что все 8 ключей (7 полей + evidence) присутствуют в JSON.
        2. Найди прямую цитату о зачёте допрасходов.
        3. Найди прямую цитату о категориях расходов.
        4. Найди прямую цитату об исключительных обстоятельствах.
        5. Найди прямую цитату о зачёте переплаты.
        6. Если прямой цитаты нет — верни "statutory_default" или "not_defined".
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "offset_regime": "<provided / prohibited / statutory_default / not_defined>",
          "offset_categories_status": "<defined / not_defined>",
          "offset_categories_details": "<перечень или 'Данные не определены'>",
          "exceptional_circumstances_status": "<defined / not_defined>",
          "exceptional_circumstances_details": "<текст или 'Данные не определены'>",
          "overpayment_credit_regime": "<allowed / prohibited / statutory_default / not_defined>",
          "overpayment_credit_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
