           - "unclear" — есть косвенные упоминания, но однозначно определить
             наличие регулирования невозможно.
           Если presence = "missing", заполни все status-поля как "not_defined",
           все details-поля как "Данные не определены" и переходи к evidence.

        1. paternity_basis_status — "defined" или "not_defined".
        2. paternity_basis_details — основание обязанности (свидетельство
           о рождении, запись ЗАГС, судебное решение и т.п.).
        3. challenge_risk_status — "low" / "medium" / "high" / "not_applicable"
           / "not_defined".
        4. challenge_risk_basis — обоснование оценки риска оспаривания.
        5. consequences_on_termination_status — "defined" или "not_defined".
        6. consequences_on_termination_details — условия о последствиях
           оспаривания и возврате платежей.
        7. evidence — список цитат из соглашения.
        </task>

        <context_rules>
        - Если в тексте прямо не указаны фрагменты об основании обязанности
          и оспаривании — presence = "missing", все status = "not_defined".
        - По ст. 52 СК РФ оспаривание отцовства/материнства возможно только
          в суде. Круг лиц: родитель, супруг, ребёнок по достижении 18 лет,
          опекун.
        - При удовлетворении иска алиментная обязанность прекращается;
          исполненные платежи могут быть взысканы как неосновательное
          обогащение (ст. 1102–1109 ГК РФ).
        - challenge_risk_status:
          * "low" — основание удостоверено органом ЗАГС (свидетельство
            о рождении), признаки оспоримости не выявлены;
          * "medium" — отцовство установлено в судебном порядке, потенциально
            оспоримо по ст. 52 СК РФ;
          * "high" — признаки оспоримости (добровольное признание без
            генетической экспертизы, спорные обстоятельства);
          * "not_applicable" — выгодоприобретатель не ребёнок плательщика
            (алименты на супруга, родителя, иного члена семьи);
          * "not_defined" — неопределимо из текста.
        - consequences_on_termination_status = "defined", если в тексте прямо
          указаны последствия оспаривания (прекращение обязанности, возврат
          платежей, перерасчёт); иначе "not_defined".
        - Не используй "None", "null", "N/A", "-", "undefined" или пустые строки.
        - В evidence включай только прямые цитаты из текста соглашения.
        </context_rules>

        <edge_cases>
        - Если алименты выплачиваются на супруга/родителя, а не на ребёнка —
          challenge_risk_status = "not_applicable", presence может быть "present"
          (основание указано), но риск оспаривания отцовства не применим.
        - Если отцовство установлено добровольно через ЗАГС (совместное заявление)
          без генетической экспертизы — challenge_risk_status = "high"
          (повышенный риск оспаривания по ст. 52 СК РФ).
        - Если в тексте есть общая оговорка о прекращении алиментов при изменении
          обстоятельств, но нет прямой ссылки на оспаривание отцовства —
          consequences_on_termination_status = "not_defined" (общая оговорка
          ≠ специальное регулирование).
        - Если в преамбуле указано свидетельство о рождении, но нет условий
          о последствиях оспаривания — paternity_basis_status = "defined",
          challenge_risk_status = "low",
          consequences_on_termination_status = "not_defined".
        </edge_cases>

        <output_expectations>
        Верни строго валидный JSON-объект с 8 ключами (7 полей + evidence).
        Не добавляй пояснений, markdown-обёрток или комментариев.
        Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "paternity_and_status_dispute_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по оспариванию отцовства/материнства и последствиям. Внутреннее агрегатное signal-поле."
          required: true
        - name: "paternity_basis_status"
          type: "string"
