      store_payload: true

  - id: notarial_form_executive_force_check
    name: "Нотариальная форма и сила исполнительного листа (ст. 100 СК РФ)"
    description: >
      Фактографическая проверка наличия нотариального удостоверения соглашения
      об уплате алиментов и фиксации исполнительной силы. Без нотариальной формы
      соглашение ничтожно (ст. 165 ГК РФ). Нотариально удостоверенное соглашение
      имеет силу исполнительного листа в силу закона (п. 2 ст. 100 СК РФ) —
      независимо от того, упомянута ли эта сила в тексте.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 20

    rules:
      keywords:
        - "нотариальное удостоверение"
        - "нотариус"
        - "удостоверено нотариусом"
        - "удостоверительная надпись"
        - "реестр нотариальных действий"
        - "реестр регистрации нотариальных действий"
        - "исполнительный лист"
        - "силу исполнительного листа"
        - "исполнительный документ"
        - "служба судебных приставов"
        - "принудительное взыскание"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)удостоверен(о|а)\\s+нотариусом"
        - "(?i)нотариальн(ое|ого|ым)\\s+удостоверен"
        - "(?i)сил(у|а|ой)\\s+исполнительного\\s+листа"
        - "(?i)удостоверительн(ая|ой)\\s+надпис"
        - "(?i)реестр[а-я]*\\s+(?:№\\s*)?[А-Я0-9\\-]+"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по семейному праву.
        Анализируется соглашение об уплате алиментов (ст. 100 СК РФ).
        Проверяется только один вопрос: нотариальная форма и исполнительная сила.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте соглашения.
        - Не оценивай серьёзность риска.
        - По п. 2 ст. 100 СК РФ нотариально удостоверенное соглашение имеет силу
          исполнительного листа в силу закона, независимо от упоминания в тексте.
          Поэтому отсутствие в тексте формулировки «имеет силу исполнительного листа»
          при наличии нотариального удостоверения — НЕ дефект.
        [ЗАДАЧА]
        Найди в тексте соглашения:
        1. Статус нотариального удостоверения (удостоверено / только упомянуто / нет).
        2. ФИО нотариуса.
        3. Номер в реестре нотариальных действий.
        4. Упоминание силы исполнительного листа (информационно).
        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если данные не указаны прямо — возвращай "not_defined" (для status)
           или "Данные не определены" (для value-полей).
        3. Различай: «certified» — есть удостоверительная надпись нотариуса;
           «mentioned» — в тексте лишь указано, что соглашение подлежит
           нотариальному удостоверению, но самой надписи нет; «not_defined» —
           нотариальное удостоверение не упомянуто вовсе.
        4. Упоминание фразы «имеет силу исполнительного листа» фиксируется
           в executive_force_details как информационный факт. Его отсутствие
           не влияет на notarial_status.
        5. Не используй "None", "null", "N/A", "-", "undefined" или пустые строки.
        6. В evidence включай только текст соглашения.
        7. Верни РОВНО один валидный JSON-объект со всеми 8 ключами, пригодный
           для парсинга через json.loads без предварительной обработки. Без markdown,
           без ```json, без комментариев, без текста до или после. Начни ответ
           сразу с { и закончи }.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — удостоверено нотариусом:
        Фрагмент:
        "Настоящее соглашение удостоверено нотариусом г. Москвы Петровой А.Б.,
        реестр № 77-АА-123456. Нотариально удостоверенное соглашение об уплате
        алиментов имеет силу исполнительного листа."
        Ответ:
        {
          "notarial_status": "certified",
          "notary_name_status": "defined",
          "notary_name_value": "нотариус г. Москвы Петрова А.Б.",
          "registry_number_status": "defined",
          "registry_number_value": "реестр № 77-АА-123456",
          "executive_force_status": "defined",
          "executive_force_details": "имеет силу исполнительного листа",
          "evidence": [
            {
              "clause_ref": "удостоверительная надпись",
              "quote": "Настоящее соглашение удостоверено нотариусом г. Москвы Петровой А.Б., реестр № 77-АА-123456."
            }
          ]
        }
        Пример 2 — упоминание о необходимости удостоверения, но самой надписи нет:
        Фрагмент:
        "Стороны подписали настоящее соглашение. Соглашение подлежит нотариальному
        удостоверению в порядке, установленном законодательством РФ."
        Ответ:
        {
          "notarial_status": "mentioned",
          "notary_name_status": "not_defined",
          "notary_name_value": "Данные не определены",
          "registry_number_status": "not_defined",
          "registry_number_value": "Данные не определены",
          "executive_force_status": "not_defined",
          "executive_force_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "заключительные положения",
              "quote": "Соглашение подлежит нотариальному удостоверению в порядке, установленном законодательством РФ."
            }
          ]
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Проверь, что все 8 ключей (7 полей + evidence) присутствуют в JSON.
        2. Найди прямую цитату удостоверительной надписи нотариуса (если есть).
        3. Отличи «удостоверено» (certified) от «подлежит удостоверению» (mentioned).
        4. Найди прямую цитату с ФИО нотариуса и номером реестра.
        5. Найди прямую цитату об исполнительной силе (информационно).
        6. Если прямой цитаты нет — верни "not_defined". Не додумывай.
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "notarial_status": "<certified / mentioned / not_defined>",
          "notary_name_status": "<defined / not_defined>",
          "notary_name_value": "<ФИО нотариуса или 'Данные не определены'>",
          "registry_number_status": "<defined / not_defined>",
          "registry_number_value": "<номер или 'Данные не определены'>",
          "executive_force_status": "<defined / not_defined>",
          "executive_force_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 4
      temperature: 0.0
      max_tokens: 500

    retrieval:
      retrieval_profile: "registration_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "нотариальное удостоверение нотариус удостоверено удостоверительная надпись реестр нотариальных действий исполнительный лист силу исполнительного листа исполнительный документ служба судебных приставов принудительное взыскание"
      preferred_unit_types:
        - general_provision
        - obligation
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - boilerplate
        - definitions
      negative_keywords:
        - "размер алиментов"
        - "порядок выплаты"
        - "индексация"
        - "неустойка"
        - "прекращение"
        - "изменение соглашения"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.80, 1.0]
        boost: 0.25
        scope: segment
      context_k: 4
      max_chunks: 6
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "boilerplate"
        - "definitions"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.15

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 500

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 700

      compact_output: false

      presence_signal:
        field: "notarial_form_executive_force_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по семейному праву. Твоя задача — извлечь из текста
        соглашения об уплате алиментов данные о нотариальном удостоверении
        и исполнительной силе.
        Не анализируй размер алиментов, порядок выплаты или прекращение.
        Анализируй только текст соглашения. Не оценивай риски.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. notarial_form_executive_force_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если notarial_status ∈ {"certified", "mentioned"}
             или хотя бы одно из (notary_name_status, executive_force_status)
             = "defined";
           - "missing" — если notarial_status = "not_defined" и все остальные
             содержательные поля (notary_name_status, executive_force_status)
             = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - notarial_status = "not_defined";
           - notary_name_status = "not_defined";
           - registry_number_status = "not_defined";
           - executive_force_status = "not_defined";
           - все *_value / *_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. notarial_status:
           - "certified" — в тексте есть удостоверительная надпись нотариуса
             (например, в конце документа после подписей сторон);
           - "mentioned" — в тексте лишь указано, что соглашение подлежит
             нотариальному удостоверению, но самой надписи нет;
           - "not_defined" — нотариальное удостоверение не упомянуто вовсе.

        2. notary_name_status:
           - "defined" — если ФИО нотариуса прямо указано;
           - "not_defined" — если не указано.

        3. notary_name_value:
           ФИО нотариуса, удостоверившего соглашение (с указанием округа/города,
           если указан).
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        4. registry_number_status:
           - "defined" — если номер в реестре нотариальных действий прямо указан;
           - "not_defined" — если не указан.

        5. registry_number_value:
           Номер в реестре нотариальных действий (для верификации через ФНП).
           Если данных нет — "Данные не определены".

        6. executive_force_status:
           - "defined" — если в тексте прямо упомянута сила исполнительного листа
             или возможность принудительного взыскания через судебных приставов;
           - "not_defined" — если такое упоминание отсутствует.

           Важно: отсутствие упоминания при notarial_status = "certified"
           не является дефектом — сила возникает в силу закона (п. 2 ст. 100 СК РФ).
           Это информационное поле.

        7. executive_force_details:
           Краткая формулировка об исполнительной силе из текста соглашения.
           Если упоминания нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни notarial_form_executive_force_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — notarial_status = "not_defined", все *_status = "not_defined", все *_value / *_details = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста соглашения.
        - По п. 2 ст. 100 СК РФ нотариально удостоверенное соглашение имеет силу исполнительного листа в силу закона. Упоминание этой формулы в тексте — информационный факт, а не обязательное условие. Отсутствие упоминания при notarial_status = "certified" не является дефектом.
        - Удостоверительная надпись нотариуса в конце документа (после подписей сторон) относится именно к данному соглашению — фиксируй как notarial_status = "certified".
        - Фраза «соглашение подлежит нотариальному удостоверению» без самой удостоверительной надписи — это notarial_status = "mentioned", не "certified".
        - Если в разных фрагментах указаны разные данные и конфликт нельзя разрешить по тексту: *_status = "not_defined", *_value / *_details = "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни упоминания нотариуса, ни удостоверительной надписи,
           ни исполнительной силы.
           → presence = "missing";
             notarial_status = "not_defined";
             все *_status = "not_defined";
             все *_value / *_details = "Данные не определены".

        2. Упоминание без удостоверения.
           В тексте указано, что соглашение подлежит нотариальному удостоверению,
           но самой удостоверительной надписи нет.
           → presence = "present";
             notarial_status = "mentioned";
             notary_name_status / registry_number_status = "not_defined";
             executive_force_status зависит от текста.

        3. Удостоверено без упоминания исполнительной силы.
           Есть удостоверительная надпись нотариуса, но в тексте не упомянута
           сила исполнительного листа.
           → presence = "present";
             notarial_status = "certified";
             executive_force_status = "not_defined";
             executive_force_details = "Данные не определены".
             Это НЕ дефект — сила возникает в силу закона (п. 2 ст. 100 СК РФ).

        4. Противоречие между фрагментами.
           В разных местах указаны разные нотариусы или разные номера реестра.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
