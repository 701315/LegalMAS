shared_patterns:
  money_amount: "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|тыс|млн)"
  date_pattern: "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"
  fraction_pattern: "(?i)\\b(1/[234]|одн[а-яё]+\\s+(четверт|трет|половин))"
  passport_data: "(?i)паспорт\\s+серия\\s+\\d{4}\\s+№?\\s*\\d{6}"
  article_sk_ref: "(?i)ст\\.?\\s*\\d+\\s*СК\\s*РФ"

compliance_rules: []

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: CHECKS_V8 — единственный рабочий слой юридического анализа
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 1: Стороны, выгодоприобретатель и основание обязанности
  # ──────────────────────────────────────────────────────────────────────────
  - id: parties_and_beneficiary_check
    name: "Стороны соглашения, выгодоприобретатель и основание алиментной обязанности"
    description: >
      Фактографическая проверка идентификации плательщика, получателя (или его
      законного представителя), лица, на содержание которого уплачиваются алименты,
      и основания алиментной обязанности (родительство, брак, семейные отношения).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "плательщик"
        - "получатель"
        - "законный представитель"
        - "родитель"
        - "опекун"
        - "попечитель"
        - "ребёнок"
        - "ребенок"
        - "супруг"
        - "супруга"
        - "на содержание"
        - "паспорт"
        - "дата рождения"
        - "свидетельство о рождении"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(плательщик|получатель)\\s+алимент"
        - "(?i)на\\s+содержание\\s+(несовершеннолетн|ребёнк|ребенк|супруг)"
        - "(?i)паспорт\\s+серия\\s+\\d{4}\\s+№?\\s*\\d{6}"
        - "(?i)законн(ый|ого|ым)\\s+представител"
        - "(?i)свидетельств(о|а)\\s+о\\s+рождении"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по семейному праву.
        Анализируется соглашение об уплате алиментов (Глава 16 СК РФ, ст. 99).
        Проверяется только один вопрос: идентификация сторон соглашения,
        выгодоприобретателя и основания алиментной обязанности.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте соглашения.
        - Не оценивай серьёзность риска.
        [ЗАДАЧА]
        Найди в тексте соглашения:
        1. ФИО и данные плательщика алиментов.
        2. Роль плательщика (родитель / супруг / совершеннолетний ребёнок / иное).
        3. ФИО получателя или его законного представителя.
        4. Роль получателя/представителя.
        5. ФИО лица, на содержание которого уплачиваются алименты (выгодоприобретатель).
        6. Категория выгодоприобретателя.
        7. Дата рождения выгодоприобретателя.
        8. Основание алиментной обязанности (родительство / брак / семейные отношения).
        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если данные не указаны прямо — возвращай "not_defined".
        3. Если текстового значения нет — возвращай строго "Данные не определены".
        4. Не используй "None", "null", "not_defined", "not_defined" или пустые строки.
        5. В evidence включай только текст соглашения.
        6. Верни только один JSON-объект.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — стороны определены:
        Фрагмент:
        "Иванов Иван Иванович, паспорт серия 45 00 № 123456, именуемый «Плательщик»,
        обязуется уплачивать алименты на содержание несовершеннолетнего сына —
        Иванова Петра Ивановича, 15.03.2015 года рождения, в пользу Ивановой Марии
        Сергеевны (мать, законный представитель), действующей на основании
        свидетельства о рождении серия II-АА № 654321."
        Ответ:
        {
          "payer_name_status": "defined",
          "payer_name_value": "Иванов Иван Иванович, паспорт серия 45 00 № 123456",
          "payer_role": "parent",
          "recipient_name_status": "defined",
          "recipient_name_value": "Иванова Мария Сергеевна (мать, законный представитель)",
          "recipient_role": "parent_representative",
          "beneficiary_name_status": "defined",
          "beneficiary_name_value": "Иванов Пётр Иванович, 15.03.2015 г.р.",
          "beneficiary_type": "minor_child",
          "basis_of_obligation": "parentage",
          "evidence": [
            {
              "clause_ref": "преамбула",
              "quote": "Иванов Иван Иванович, паспорт серия 45 00 № 123456, именуемый «Плательщик», обязуется уплачивать алименты на содержание несовершеннолетнего сына — Иванова Петра Ивановича..."
            }
          ]
        }
        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Стороны заключили настоящее соглашение."
        Ответ:
        {
          "payer_name_status": "not_defined",
          "payer_name_value": "Данные не определены",
          "payer_role": "not_defined",
          "recipient_name_status": "not_defined",
          "recipient_name_value": "Данные не определены",
          "recipient_role": "not_defined",
          "beneficiary_name_status": "not_defined",
          "beneficiary_name_value": "Данные не определены",
          "beneficiary_type": "not_defined",
          "basis_of_obligation": "not_defined",
          "evidence": []
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату с ФИО плательщика.
        2. Найди прямую цитату с ФИО получателя/представителя.
        3. Найди прямую цитату с ФИО выгодоприобретателя и датой рождения.
        4. Определи основание обязанности по тексту.
        5. Если прямой цитаты нет — верни "not_defined". Не додумывай.
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "payer_name_status": "<defined / not_defined>",
          "payer_name_value": "<ФИО и данные или 'Данные не определены'>",
          "payer_role": "<parent / spouse / adult_child / other / not_defined>",
          "recipient_name_status": "<defined / not_defined>",
          "recipient_name_value": "<ФИО или 'Данные не определены'>",
          "recipient_role": "<parent_representative / spouse / parent / guardian / other / not_defined>",
          "beneficiary_name_status": "<defined / not_defined>",
          "beneficiary_name_value": "<ФИО и дата рождения или 'Данные не определены'>",
          "beneficiary_type": "<minor_child / adult_disabled_child / spouse / ex_spouse / parent / other / not_defined>",
          "basis_of_obligation": "<parentage / marriage / family_relationship / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 650

    retrieval:
      retrieval_profile: "party_identification_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "плательщик получатель законный представитель родитель опекун попечитель ребёнок супруг на содержание основание обязанности паспорт дата рождения свидетельство о рождении плательщик алиментов получатель алиментов"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - representations
        - definitions
      negative_keywords:
        - "размер алиментов"
        - "порядок выплаты"
        - "индексация"
        - "неустойка"
        - "прекращение"
        - "изменение соглашения"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 0.20]
        boost: 0.35
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "representations"
        - "definitions"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.15

    evidence:
      required: true
      min_snippet_length: 50
      max_snippet_length: 800

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 1400
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по семейному праву. Извлеки из соглашения об уплате
        алиментов данные о плательщике, получателе, выгодоприобретателе и основании
        алиментной обязанности.
        Не анализируй размер алиментов, порядок выплаты, индексацию или прекращение.
        </role>
        <context>
        {context}
        </context>
        <task>
        Заполни строго следующие поля:
        1. payer_name_status — "defined" или "not_defined".
        2. payer_name_value — ФИО и данные плательщика.
        3. payer_role — parent / spouse / adult_child / other / not_defined.
        4. recipient_name_status — "defined" или "not_defined".
        5. recipient_name_value — ФИО получателя или его представителя.
        6. recipient_role — parent_representative / spouse / parent / guardian / other / not_defined.
        7. beneficiary_name_status — "defined" или "not_defined".
        8. beneficiary_name_value — ФИО и дата рождения выгодоприобретателя.
        9. beneficiary_type — minor_child / adult_disabled_child / spouse / ex_spouse / parent / other / not_defined.
        10. basis_of_obligation — parentage / marriage / family_relationship / not_defined.
        Если данные отсутствуют в тексте:
        - статус = "not_defined"
        - текстовое поле = "Данные не определены"
        </task>
        <rules>
        - Используй только текст соглашения.
        - basis_of_obligation: "parentage" — если основание — родительство;
          "marriage" — если основание — брак или бывший брак;
          "family_relationship" — если основание — иные семейные отношения;
          "not_defined" — если основание прямо не указано.
        - Верни только JSON.
        </rules>
      fields:
        - name: "payer_name_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус идентификации плательщика."
          required: true
        - name: "payer_name_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Плательщик"
          description: "ФИО и данные плательщика алиментов."
          required: true
        - name: "payer_role"
          type: "string"
          presentation: "signal"
          allowed_values: ["parent", "spouse", "adult_child", "other", "not_defined"]
          description: "Роль плательщика в алиментном обязательстве."
          required: false
        - name: "recipient_name_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус идентификации получателя/представителя."
          required: true
        - name: "recipient_name_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Получатель / представитель"
          description: "ФИО получателя или его законного представителя."
          required: true
        - name: "recipient_role"
          type: "string"
          presentation: "signal"
          allowed_values: ["parent_representative", "spouse", "parent", "guardian", "other", "not_defined"]
          description: "Роль получателя/представителя."
          required: false
        - name: "beneficiary_name_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус идентификации выгодоприобретателя."
          required: true
        - name: "beneficiary_name_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Выгодоприобретатель"
          description: "ФИО и дата рождения лица, на содержание которого уплачиваются алименты."
          required: true
        - name: "beneficiary_type"
          type: "string"
          presentation: "signal"
          allowed_values: ["minor_child", "adult_disabled_child", "spouse", "ex_spouse", "parent", "other", "not_defined"]
          description: "Категория выгодоприобретателя."
          required: true
        - name: "basis_of_obligation"
          type: "string"
          presentation: "signal"
          allowed_values: ["parentage", "marriage", "family_relationship", "not_defined"]
          description: "Основание алиментной обязанности."
          required: false
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 2: Нотариальная форма и исполнительная сила
  # ──────────────────────────────────────────────────────────────────────────
  - id: notarial_form_executive_force_check
    name: "Нотариальная форма и сила исполнительного листа (ст. 100 СК РФ)"
    description: >
      Фактографическая проверка наличия нотариального удостоверения соглашения
      и указания на силу исполнительного листа. Без нотариальной формы
      соглашение ничтожно.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "нотариальное удостоверение"
        - "нотариус"
        - "удостоверено нотариусом"
        - "реестр нотариальных действий"
        - "исполнительный лист"
        - "силу исполнительного листа"
        - "исполнительный документ"
        - "служба судебных приставов"
        - "принудительное взыскание"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)удостоверен(о|а)\\s+нотариусом"
        - "(?i)нотариальн(ое|ого|ым)\\s+удостоверен"
        - "(?i)сил(у|а|ой)\\s+исполнительного\\s+листа"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по семейному праву.
        Анализируется соглашение об уплате алиментов (ст. 100 СК РФ).
        Проверяется только один вопрос: нотариальная форма и исполнительная сила.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте соглашения.
        - Не оценивай серьёзность риска.
        [ЗАДАЧА]
        Найди в тексте соглашения:
        1. Статус нотариального удостоверения (удостоверено / упомянуто / нет).
        2. ФИО нотариуса.
        3. Номер в реестре нотариальных действий.
        4. Упоминание силы исполнительного листа.
        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если данные не указаны прямо — возвращай "not_defined".
        3. Если текстового значения нет — возвращай строго "Данные не определены".
        4. В evidence включай только текст соглашения.
        5. Верни только один JSON-объект.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — удостоверено:
        Фрагмент:
        "Настоящее соглашение удостоверено нотариусом г. Москвы Петровой А.Б.,
        реестр № 77-АА-123456. Нотариально удостоверенное соглашение об уплате
        алиментов имеет силу исполнительного листа."
        Ответ:
        {
          "notarial_status": "certified",
          "notary_name_status": "defined",
          "notary_name_value": "нотариус г. Москвы Петрова А.Б.",
          "registry_number_status": "defined",
          "registry_number_value": "реестр № 77-АА-123456",
          "executive_force_status": "defined",
          "executive_force_details": "имеет силу исполнительного листа",
          "evidence": [
            {
              "clause_ref": "удостоверительная надпись",
              "quote": "Настоящее соглашение удостоверено нотариусом г. Москвы Петровой А.Б., реестр № 77-АА-123456."
            }
          ]
        }
        Пример 2 — не удостоверено:
        Фрагмент:
        "Стороны подписали настоящее соглашение."
        Ответ:
        {
          "notarial_status": "not_defined",
          "notary_name_status": "not_defined",
          "notary_name_value": "Данные не определены",
          "registry_number_status": "not_defined",
          "registry_number_value": "Данные не определены",
          "executive_force_status": "not_defined",
          "executive_force_details": "Данные не определены",
          "evidence": []
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату удостоверительной надписи нотариуса.
        2. Найди прямую цитату с ФИО нотариуса и номером реестра.
        3. Найди прямую цитату об исполнительной силе.
        4. Если прямой цитаты нет — верни "not_defined". Не додумывай.
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "notarial_status": "<certified / mentioned / not_defined>",
          "notary_name_status": "<defined / not_defined>",
          "notary_name_value": "<ФИО нотариуса или 'Данные не определены'>",
          "registry_number_status": "<defined / not_defined>",
          "registry_number_value": "<номер или 'Данные не определены'>",
          "executive_force_status": "<defined / not_defined>",
          "executive_force_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 4
      temperature: 0.0
      max_tokens: 450

    retrieval:
      retrieval_profile: "registration_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "нотариальное удостоверение нотариус удостоверено нотариусом реестр нотариальных действий исполнительный лист силу исполнительного листа исполнительный документ служба судебных приставов принудительное взыскание ст. 100 СК РФ"
      preferred_unit_types:
        - general_provision
        - obligation
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - boilerplate
        - definitions
      negative_keywords:
        - "размер алиментов"
        - "порядок выплаты"
