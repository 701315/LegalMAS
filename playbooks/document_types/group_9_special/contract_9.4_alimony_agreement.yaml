        {
          "regional_minimum_basis": "<defined / statutory_default / not_applicable / not_defined>",
          "region_details": "<текст или 'Данные не определены'>",
          "pm_category_code": "<child / working_age / pensioner / per_capita / not_defined>",
          "pm_category_details": "<текст или 'Данные не определены'>",
          "update_mechanism_status": "<quarterly / annual / on_change / statutory_default / not_defined>",
          "update_mechanism_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 650

    retrieval:
      retrieval_profile: "payment_terms_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "прожиточный минимум ПМ субъект РФ регион место жительства получателя величина прожиточного минимума ПМ на ребёнка ПМ на душу населения постановление правительства ежеквартально индексация твёрдой суммы"
      preferred_unit_types:
        - obligation
        - payment_term
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - procedures
        - obligations
      negative_keywords:
        - "нотариус"
        - "неустойка"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.20, 0.70]
        boost: 0.30
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "procedures"
        - "obligations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 550

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 900
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по семейному праву. Извлеки из соглашения об уплате
        алиментов информацию о привязке твёрдой суммы к региональному прожиточному
        минимуму.
        Не анализируй размер алиментов, порядок выплаты или прекращение.
        </role>
        <context>
        {context}
        </context>
        <task>
        Заполни строго следующие 6 полей + evidence (всего 7 ключей):
        1. regional_minimum_basis — defined / statutory_default / not_applicable / not_defined.
        2. region_details — регион / субъект РФ.
        3. pm_category_code — child / working_age / pensioner / per_capita / not_defined.
        4. pm_category_details — категория ПМ.
        5. update_mechanism_status — quarterly / annual / on_change / statutory_default / not_defined.
        6. update_mechanism_details — механизм обновления.
        7. evidence — список цитат из соглашения.
        Если данные отсутствуют в тексте:
        - статус = "not_defined"
        - текстовое поле = "Данные не определены"
        </task>
        <rules>
        - Используй только текст соглашения.
        - По ст. 117 СК РФ индексация производится пропорционально росту ПМ
          по месту жительства получателя. Если регион не указан —
          regional_minimum_basis = "statutory_default".
        - pm_category_code: "child" — для детей; "working_age" — для трудоспособного
          населения; "pensioner" — для пенсионеров; "per_capita" — на душу
          населения.
        - update_mechanism_status = "quarterly", если индексация привязана
          к ежеквартальному пересмотру ПМ; "annual" — ежегодно; "on_change" —
          по факту изменения.
        - regional_minimum_basis = "not_applicable", если алименты не в твёрдой
          сумме (доля от заработка).
        - Верни РОВНО один валидный JSON-объект со всеми 7 ключами, пригодный
          для парсинга через json.loads без предварительной обработки. Без markdown,
          без ```json, без комментариев, без текста до или после. Начни ответ
          сразу с { и закончи }.
        </rules>

      fields:
        - name: "regional_minimum_basis"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Привязка к ПМ"
          allowed_values: ["defined", "statutory_default", "not_applicable", "not_defined"]
          description: "Режим привязки к региональному ПМ: указан / дефолт ст. 117 СК РФ / не применимо."
          required: true
        - name: "region_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Регион ПМ"
          description: "Регион / субъект РФ для расчёта ПМ."
          required: false
        - name: "pm_category_code"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Категория ПМ"
          allowed_values: ["child", "working_age", "pensioner", "per_capita", "not_defined"]
          description: "Категория прожиточного минимума."
          required: false
        - name: "pm_category_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          display_priority: 6
          label: "Детали категории ПМ"
          description: "Детализация категории ПМ."
          required: false
        - name: "update_mechanism_status"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 4
          label: "Механизм обновления"
          allowed_values: ["quarterly", "annual", "on_change", "statutory_default", "not_defined"]
          description: "Механизм обновления ПМ: ежеквартальный / ежегодный / по факту."
          required: false
        - name: "update_mechanism_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          display_priority: 7
          label: "Детали обновления"
          description: "Детали механизма обновления ПМ."
          required: false
      store_payload: true

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 5: DD_REQUEST_TEMPLATES
#  Читается: DDRequestTemplateLoader
# ════════════════════════════════════════════════════════════════════════════

dd_request_templates:
  parties_and_beneficiary_check:
    text: >
      Просим предоставить по {doc_names}: (а) полные данные плательщика (ФИО, паспорт,
      адрес, место работы); (б) полные данные получателя или законного представителя;
      (в) данные лица, на содержание которого уплачиваются алименты (ФИО, дата рождения,
      свидетельство о рождении/паспорт); (г) основание алиментной обязанности.
    addressee: "Обе стороны / Нотариус"

  notarial_form_executive_force_check:
    text: >
      Просим подтвердить по {doc_names}: (а) факт нотариального удостоверения
      (ст. 100 СК РФ); (б) ФИО нотариуса; (в) номер в реестре; (г) упоминание
      исполнительной силы соглашения. Без нотариальной формы соглашение ничтожно.
    addressee: "Нотариус / Обе стороны"

  amount_minimum_compliance_check:
    text: >
      Просим уточнить в {doc_names}: (а) конкретный размер алиментов (сумма/доля);
      (б) способ определения (твёрдая сумма / доля от заработка / смешанный);
      (в) для алиментов на детей — подтверждение соответствия минимуму ст. 81 СК РФ
      (1/4 на одного, 1/3 на двоих, 1/2 на троих и более); (г) число детей.
    addressee: "Плательщик / Нотариус"

  payment_procedure_check:
    text: >
      Просим уточнить в {doc_names}: (а) конкретную дату ежемесячного платежа;
      (б) способ перечисления (банковский перевод / наличные / почтовый перевод);
      (в) реквизиты счёта получателя; (г) порядок подтверждения оплаты
      (платёжное поручение, расписка).
    addressee: "Обе стороны"

  indexation_check:
    text: >
      Просим уточнить в {doc_names}: (а) порядок индексации алиментов в твёрдой сумме
      (ст. 105 СК РФ); (б) привязка к прожиточному минимуму или иная формула;
      (в) периодичность пересчёта; (г) кто производит индексацию (работодатель/приставы).
    addressee: "Юридический советник / Нотариус"

  adjustment_mechanism_check:
    text: >
      Просим уточнить в {doc_names}: (а) основания для пересмотра размера
      (потеря работы, снижение доходов, рождение другого ребёнка); (б) досудебный
      порядок обсуждения; (в) порядок судебного пересмотра (ст. 101 СК РФ).
    addressee: "Юридический советник"

  penalty_and_offset_check:
    text: >
      Просим уточнить в {doc_names}: (а) размер неустойки за просрочку (по ст. 115
      СК РФ — 0,1% в день, но стороны могут установить иной размер); (б) порядок
      расчёта; (в) право на взыскание убытков сверх неустойки; (г) перечень
      дополнительных расходов, подлежащих зачёту (лечение, образование, отдых);
      (д) условия зачёта переплаты.
    addressee: "Юридический советник"

  termination_and_amendment_check:
    text: >
      Просим уточнить в {doc_names}: (а) полный перечень оснований прекращения
      (совершеннолетие, эмансипация, усыновление, смерть, восстановление
      трудоспособности и т.д.); (б) конкретную дату или событие окончания;
      (в) порядок внесения изменений (нотариальная форма, ст. 101 СК РФ);
      (г) невозможность одностороннего отказа.
    addressee: "Юридический советник"

  dispute_confidentiality_targeted_use_check:
    text: >
      Просим уточнить в {doc_names}: (а) досудебный порядок урегулирования споров;
      (б) подсудность; (в) условия конфиденциальности финансовых условий;
      (г) обязанность получателя предоставлять отчёт о целевом использовании
      алиментов по требованию плательщика (ст. 60 СК РФ).
    addressee: "Юридический советник"

  _default:
    text: >
      Просим предоставить дополнительную информацию по вопросу «{check_name}»
      применительно к {doc_names}.
    addressee: "Юридический советник"
