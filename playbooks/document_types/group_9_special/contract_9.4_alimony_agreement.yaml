      нескольких детей (в том числе от разных браков). По ст. 81 СК РФ
      установлены пропорции 1/4 на одного, 1/3 на двух, 1/2 на трёх и более
      детей. Совокупный размер удержаний не может превышать 70% заработка
      (ст. 138 ТК РФ). Возможно снижение размера судом по ст. 119 СК РФ
      при существенном изменении обстоятельств.
