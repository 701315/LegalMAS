        - "(?i)(тяжёл[а-яё]+\\s+болезн|увечь|посторонн[а-яё]+\\s+уход)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по семейному праву.
        Анализируется соглашение об уплате алиментов (ст. 86, 104 СК РФ,
        ст. 1102–1109 ГК РФ).
        Проверяется только один вопрос: зачёт дополнительных расходов
        и зачёт переплаты.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте соглашения.
        - Не оценивай серьёзность риска.
        - По ст. 86 СК РФ дополнительные расходы (при исключительных
          обстоятельствах: тяжёлая болезнь, увечье, необходимость оплаты
          постороннего ухода) взыскиваются через суд, если не установлен
          иной порядок соглашением.
        - Зачёт переплаты в счёт будущих платежей — договорный механизм;
          по умолчанию не предусмотрен.
        - Возврат неосновательного обогащения — по ст. 1102–1109 ГК РФ.
        [ЗАДАЧА]
        Найди в тексте соглашения:
        1. Условие о зачёте дополнительных расходов.
        2. Перечень категорий расходов, подлежащих зачёту.
        3. Условие об исключительных обстоятельствах.
        4. Условие о зачёте переплаты.
        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если данные не указаны прямо — возвращай "not_defined" (для status)
           или "Данные не определены" (для value-полей).
        3. offset_regime:
           * "provided" — в тексте установлен зачёт допрасходов;
           * "prohibited" — прямо запрещён;
           * "statutory_default" — не указано; применяется ст. 86 СК РФ
             (через суд при исключительных обстоятельствах);
           * "not_defined" — неопределимо.
        4. exceptional_circumstances_status:
           * "defined" — в тексте названы исключительные обстоятельства;
           * "not_defined" — не указаны.
        5. overpayment_credit_regime:
           * "allowed" — переплата зачитывается в счёт будущих платежей;
           * "prohibited" — прямо запрещено;
           * "statutory_default" — не указано; по умолчанию не предусмотрено;
           * "not_defined" — неопределимо.
        6. Не используй "None", "null", "N/A", "-", "undefined" или пустые строки.
        7. В evidence включай только текст соглашения.
        8. Верни РОВНО один валидный JSON-объект со всеми 8 ключами, пригодный
