  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 9: Споры, конфиденциальность и целевое использование
  # ──────────────────────────────────────────────────────────────────────────
  - id: dispute_confidentiality_targeted_use_check
    name: "Порядок разрешения споров, конфиденциальность и целевое использование"
    description: >
      Фактографическая проверка порядка разрешения споров (досудебный порядок,
      подсудность), условий конфиденциальности и обязанности получателя
      предоставлять отчёт о целевом использовании алиментов.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "medium"
    severity_if_pass: "pass"
    severity_if_fail: "medium"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "разрешение споров"
        - "досудебный порядок"
        - "путём переговоров"
        - "путем переговоров"
        - "подсудность"
        - "по месту жительства"
        - "конфиденциальность"
        - "неразглашение"
        - "не подлежат разглашению"
        - "не раскрывать третьим лицам"
        - "целевое использование"
        - "отчёт об использовании"
        - "отчет об использовании"
        - "по требованию плательщика"
        - "расходование средств на нужды ребёнка"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)спор(ы|ов)\\s+(разрешаются|подлежат)"
        - "(?i)конфиденциал"
        - "(?i)не\\s+подлеж(ат|ит)\\s+разглашени"
        - "(?i)целев(ое|ого)\\s+использован"
        - "(?i)отч(ёт|ет)\\s+(об\\s+)?использовани"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по семейному праву.
        Анализируется соглашение об уплате алиментов.
        Проверяется только один вопрос: порядок разрешения споров,
        конфиденциальность и целевое использование алиментов.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте соглашения.
        - Не оценивай серьёзность риска.
        [ЗАДАЧА]
        Найди в тексте соглашения:
        1. Порядок разрешения споров (переговоры / суд).
        2. Подсудность.
        3. Условие о конфиденциальности.
        4. Обязанность получателя предоставлять отчёт о целевом использовании.
        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если данные не указаны прямо — возвращай "not_defined".
        3. Если текстового значения нет — возвращай строго "Данные не определены".
        4. В evidence включай только текст соглашения.
        5. Верни только один JSON-объект.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1:
        Фрагмент:
        "Все споры разрешаются путём переговоров. При недостижении согласия —
        в суде по месту жительства получателя. Условия соглашения конфиденциальны.
        Получатель обязуется по требованию плательщика предоставлять отчёт
        о целевом использовании алиментов на нужды ребёнка."
        Ответ:
        {
          "dispute_resolution_status": "defined",
          "dispute_resolution_details": "путём переговоров; при недостижении согласия — в суде по месту жительства получателя",
          "jurisdiction_status": "defined",
          "jurisdiction_details": "суд по месту жительства получателя",
          "confidentiality_status": "defined",
          "confidentiality_details": "условия соглашения конфиденциальны",
          "targeted_use_reporting_status": "defined",
          "targeted_use_reporting_details": "по требованию плательщика предоставлять отчёт о целевом использовании алиментов на нужды ребёнка",
          "evidence": [
            {
              "clause_ref": "п. 7.1",
              "quote": "Все споры разрешаются путём переговоров. При недостижении согласия — в суде по месту жительства получателя."
            }
          ]
        }
        Пример 2:
        Фрагмент:
        "Плательщик обязуется уплачивать алименты."
        Ответ:
        {
          "dispute_resolution_status": "not_defined",
          "dispute_resolution_details": "Данные не определены",
          "jurisdiction_status": "not_defined",
          "jurisdiction_details": "Данные не определены",
          "confidentiality_status": "not_defined",
          "confidentiality_details": "Данные не определены",
          "targeted_use_reporting_status": "not_defined",
          "targeted_use_reporting_details": "Данные не определены",
          "evidence": []
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о порядке разрешения споров.
        2. Найди прямую цитату о подсудности.
        3. Найди прямую цитату о конфиденциальности.
        4. Найди прямую цитату о целевом использовании.
        5. Если прямой цитаты нет — верни "not_defined". Не додумывай.
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "dispute_resolution_status": "<defined / not_defined>",
          "dispute_resolution_details": "<текст или 'Данные не определены'>",
          "jurisdiction_status": "<defined / not_defined>",
          "jurisdiction_details": "<текст или 'Данные не определены'>",
          "confidentiality_status": "<defined / not_defined>",
          "confidentiality_details": "<текст или 'Данные не определены'>",
          "targeted_use_reporting_status": "<defined / not_defined>",
          "targeted_use_reporting_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 500

    retrieval:
      retrieval_profile: "dispute_resolution_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "разрешение споров досудебный порядок путём переговоров подсудность по месту жительства конфиденциальность неразглашение не подлежат разглашению не раскрывать третьим лицам целевое использование отчёт об использовании по требованию плательщика расходование средств на нужды ребёнка"
      preferred_unit_types:
        - general_provision
        - obligation
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - boilerplate
        - procedures
      negative_keywords:
        - "размер алиментов"
        - "порядок выплаты"
        - "индексация"
        - "неустойка"
        - "прекращение"
        - "изменение соглашения"
        - "дополнительные расходы"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.65, 1.0]
        boost: 0.18
        scope: segment
      context_k: 5
      max_chunks: 7
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "boilerplate"
        - "procedures"
      confidence_bonus_on_match: 0.06
      confidence_penalty_on_excluded_segment: 0.08

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 550

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 700
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по семейному праву. Извлеки из соглашения об уплате
        алиментов порядок разрешения споров, конфиденциальность и целевое использование.
        Не анализируй размер алиментов, порядок выплаты или прекращение.
        </role>
        <context>
        {context}
        </context>
        <task>
        Заполни строго следующие поля:
        1. dispute_resolution_status — "defined" или "not_defined".
        2. dispute_resolution_details — порядок разрешения споров.
        3. jurisdiction_status — "defined" или "not_defined".
        4. jurisdiction_details — подсудность.
        5. confidentiality_status — "defined" или "not_defined".
        6. confidentiality_details — условие о конфиденциальности.
        7. targeted_use_reporting_status — "defined" или "not_defined".
        8. targeted_use_reporting_details — обязанность отчёта о целевом использовании.
        Если данные отсутствуют в тексте:
        - статус = "not_defined"
        - текстовое поле = "Данные не определены"
        </task>
        <rules>
        - Используй только текст соглашения.
        - Верни только JSON.
        </rules>
      fields:
        - name: "dispute_resolution_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус порядка разрешения споров."
          required: true
        - name: "dispute_resolution_details"
          type: "string"
          presentation: "fact"
          label: "Разрешение споров"
          description: "Порядок разрешения споров."
          required: false
          display_in_grid: true
          display_priority: 1
        - name: "jurisdiction_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус подсудности."
          required: false
        - name: "jurisdiction_details"
          type: "string"
          presentation: "fact"
          label: "Подсудность"
          description: "Подсудность споров."
          required: false
          display_in_grid: true
          display_priority: 2
        - name: "confidentiality_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус условия о конфиденциальности."
          required: false
        - name: "confidentiality_details"
          type: "string"
          presentation: "fact"
          label: "Конфиденциальность"
          description: "Условие о конфиденциальности условий соглашения."
          required: false
          display_in_grid: true
          display_priority: 3
        - name: "targeted_use_reporting_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус обязанности отчёта о целевом использовании."
          required: false
        - name: "targeted_use_reporting_details"
          type: "string"
          presentation: "fact"
          label: "Целевое использование"
          description: "Обязанность получателя предоставлять отчёт о целевом использовании."
          required: false
          display_in_grid: true
          display_priority: 4
      store_payload: true

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 5: DD_REQUEST_TEMPLATES
#  Читается: DDRequestTemplateLoader
# ════════════════════════════════════════════════════════════════════════════

dd_request_templates:
  parties_and_beneficiary_check:
    text: >
      Просим предоставить по {doc_names}: (а) полные данные плательщика (ФИО, паспорт,
      адрес, место работы); (б) полные данные получателя или законного представителя;
      (в) данные лица, на содержание которого уплачиваются алименты (ФИО, дата рождения,
      свидетельство о рождении/паспорт); (г) основание алиментной обязанности.
    addressee: "Обе стороны / Нотариус"

  notarial_form_executive_force_check:
    text: >
      Просим подтвердить по {doc_names}: (а) факт нотариального удостоверения
      (ст. 100 СК РФ); (б) ФИО нотариуса; (в) номер в реестре; (г) упоминание
      исполнительной силы соглашения. Без нотариальной формы соглашение ничтожно.
    addressee: "Нотариус / Обе стороны"

  amount_minimum_compliance_check:
    text: >
      Просим уточнить в {doc_names}: (а) конкретный размер алиментов (сумма/доля);
      (б) способ определения (твёрдая сумма / доля от заработка / смешанный);
      (в) для алиментов на детей — подтверждение соответствия минимуму ст. 81 СК РФ
      (1/4 на одного, 1/3 на двоих, 1/2 на троих и более); (г) число детей.
    addressee: "Плательщик / Нотариус"

  payment_procedure_check:
    text: >
      Просим уточнить в {doc_names}: (а) конкретную дату ежемесячного платежа;
      (б) способ перечисления (банковский перевод / наличные / почтовый перевод);
      (в) реквизиты счёта получателя; (г) порядок подтверждения оплаты
      (платёжное поручение, расписка).
    addressee: "Обе стороны"

  indexation_check:
    text: >
      Просим уточнить в {doc_names}: (а) порядок индексации алиментов в твёрдой сумме
      (ст. 105 СК РФ); (б) привязка к прожиточному минимуму или иная формула;
      (в) периодичность пересчёта; (г) кто производит индексацию (работодатель/приставы).
    addressee: "Юридический советник / Нотариус"

  adjustment_mechanism_check:
    text: >
      Просим уточнить в {doc_names}: (а) основания для пересмотра размера
      (потеря работы, снижение доходов, рождение другого ребёнка); (б) досудебный
      порядок обсуждения; (в) порядок судебного пересмотра (ст. 101 СК РФ).
    addressee: "Юридический советник"

  penalty_and_offset_check:
    text: >
      Просим уточнить в {doc_names}: (а) размер неустойки за просрочку (по ст. 115
      СК РФ — 0,1% в день, но стороны могут установить иной размер); (б) порядок
      расчёта; (в) право на взыскание убытков сверх неустойки; (г) перечень
      дополнительных расходов, подлежащих зачёту (лечение, образование, отдых);
      (д) условия зачёта переплаты.
    addressee: "Юридический советник"

  termination_and_amendment_check:
    text: >
      Просим уточнить в {doc_names}: (а) полный перечень оснований прекращения
      (совершеннолетие, эмансипация, усыновление, смерть, восстановление
      трудоспособности и т.д.); (б) конкретную дату или событие окончания;
      (в) порядок внесения изменений (нотариальная форма, ст. 101 СК РФ);
      (г) невозможность одностороннего отказа.
    addressee: "Юридический советник"

  dispute_confidentiality_targeted_use_check:
    text: >
      Просим уточнить в {doc_names}: (а) досудебный порядок урегулирования споров;
      (б) подсудность; (в) условия конфиденциальности финансовых условий;
      (г) обязанность получателя предоставлять отчёт о целевом использовании
      алиментов по требованию плательщика (ст. 60 СК РФ).
    addressee: "Юридический советник"

  _default:
    text: >
      Просим предоставить дополнительную информацию по вопросу «{check_name}»
      применительно к {doc_names}.
    addressee: "Юридический советник"


