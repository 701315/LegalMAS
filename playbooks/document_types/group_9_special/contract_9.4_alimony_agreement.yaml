  - id: assignment_and_third_party_rights_check
    name: "Уступка алиментов и права третьих лиц (ст. 383 ГК РФ, ст. 446 ГПК РФ)"
    description: >
      Фактографическая проверка условий об уступке права на алименты и об
      обращении взыскания на алименты со стороны третьих лиц. По ст. 383 ГК РФ
      уступка требований, неразрывно связанных с личностью кредитора
      (в том числе алиментов), не допускается — любые подобные условия
      недействительны. Алименты имеют ограниченную защиту от взыскания
      по ст. 446 ГПК РФ и ст. 101 ФЗ №229-ФЗ. Проверяется наличие в тексте
      соответствующих оговорок и их соответствие закону.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 150

    rules:
      keywords:
        - "уступка"
        - "уступка права"
        - "цессия"
        - "перевод долга"
        - "залог"
        - "залог алиментов"
        - "обращение взыскания"
        - "третьи лица"
        - "кредиторы"
        - "взыскание"
        - "ст. 383 ГК РФ"
        - "ст. 446 ГПК РФ"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(уступк|цесси)[а-яё]+\\s+(права|требовани)"
        - "(?i)перевод[а-яё]*\\s+долг"
        - "(?i)залог[а-яё]*\\s+алимент"
        - "(?i)обращени[е-яё]+\\s+взыскани"
        - "(?i)третьи[х-яё]+\\s+лиц"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по семейному праву.
        Анализируется соглашение об уплате алиментов (ст. 383 ГК РФ,
        ст. 446 ГПК РФ, ст. 101 ФЗ №229-ФЗ).
        Проверяется только один вопрос: уступка права на алименты и права
        третьих лиц в отношении алиментов.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте соглашения.
        - Не оценивай серьёзность риска — фиксируй факты.
        - По ст. 383 ГК РФ уступка требований, неразрывно связанных с личностью
          кредитора (алименты, возмещение вреда жизни/здоровью), не допускается.
          Любые условия об уступке алиментов — недействительны.
        - Алименты имеют ограниченную защиту от взыскания по ст. 446 ГПК РФ
          и ст. 101 ФЗ №229-ФЗ; обращение взыскания на алименты кредиторами
          получателя возможно в ограниченных случаях.
        [ЗАДАЧА]
        Найди в тексте соглашения:
        1. Условия об уступке права на алименты.
        2. Условия о переводе долга по алиментам.
        3. Условия о залоге алиментов.
        4. Условия об обращении взыскания третьими лицами.
        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если данные не указаны прямо — возвращай "not_defined" (для status)
           или "Данные не определены" (для value-полей).
        3. assignment_regime:
           * "prohibited_by_law" — в тексте нет условий об уступке; действует
             запрет по ст. 383 ГК РФ;
           * "attempted" — в тексте есть условие об уступке (недействительно
             в силу закона);
           * "not_defined" — неопределимо.
        4. enforcement_protection_status:
           * "protected" — в тексте прямо указана защита алиментов от взыскания;
           * "statutory_default" — не указано; применяется ст. 446 ГПК РФ;
           * "not_defined" — неопределимо.
        5. third_party_claims_status:
           * "excluded" — прямо исключены притязания третьих лиц;
           * "allowed" — допущены в тексте (обычно недействительно);
           * "not_defined" — неопределимо.
        6. Не используй "None", "null", "N/A", "-", "undefined" или пустые строки.
        7. В evidence включай только текст соглашения.
        8. Верни РОВНО один валидный JSON-объект со всеми 7 ключами, пригодный
           для парсинга через json.loads без предварительной обработки. Без markdown,
           без ```json, без комментариев, без текста до или после. Начни ответ
           сразу с { и закончи }.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — уступка запрещена, защита от взыскания установлена:
        Фрагмент:
        "Право на получение алиментов не может быть уступлено третьим лицам.
        Алименты не подлежат обращению взыскания по обязательствам получателя
        перед третьими лицами, за исключением случаев, установленных законом."
        Ответ:
        {
          "assignment_regime": "prohibited_by_law",
          "assignment_clause_status": "defined",
          "assignment_clause_details": "право на алименты не может быть уступлено третьим лицам",
          "enforcement_protection_status": "protected",
          "third_party_claims_status": "excluded",
          "third_party_claims_details": "притязания третьих лиц исключены (за исключением случаев, установленных законом)",
          "evidence": [
            {
              "clause_ref": "п. 7.1",
              "quote": "Право на получение алиментов не может быть уступлено третьим лицам. Алименты не подлежат обращению взыскания по обязательствам получателя перед третьими лицами, за исключением случаев, установленных законом."
            }
          ]
        }
        Пример 2 — условия об уступке нет, применяется запрет закона:
        Фрагмент:
        "Алименты уплачиваются в размере 20 000 рублей ежемесячно не позднее
        10-го числа каждого месяца."
        Ответ:
        {
          "assignment_regime": "prohibited_by_law",
          "assignment_clause_status": "not_defined",
          "assignment_clause_details": "Данные не определены",
          "enforcement_protection_status": "statutory_default",
          "third_party_claims_status": "not_defined",
          "third_party_claims_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 2.1",
              "quote": "Алименты уплачиваются в размере 20 000 рублей ежемесячно не позднее 10-го числа каждого месяца."
            }
          ]
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Проверь, что все 7 ключей (6 полей + evidence) присутствуют в JSON.
        2. Найди прямую цитату об уступке.
        3. Найди прямую цитату о защите от взыскания.
        4. Найди прямую цитату о правах третьих лиц.
        5. Если прямой цитаты нет — верни "statutory_default" или "not_defined".
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "assignment_regime": "<prohibited_by_law / attempted / not_defined>",
          "assignment_clause_status": "<defined / not_defined>",
          "assignment_clause_details": "<текст или 'Данные не определены'>",
          "enforcement_protection_status": "<protected / statutory_default / not_defined>",
          "third_party_claims_status": "<excluded / allowed / not_defined>",
          "third_party_claims_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 700

    retrieval:
      retrieval_profile: "party_identification_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "уступка права цессия перевод долга залог алиментов обращение взыскания третьи лица кредиторы взыскание защита алиментов от взыскания"
      preferred_unit_types:
        - obligation
        - general_provision
        - liability_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - boilerplate
        - limitations
        - remedies
      negative_keywords:
        - "нотариус"
        - "индексация"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.40, 0.85]
        boost: 0.30
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "boilerplate"
        - "limitations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 550

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      presence_signal:
        field: "assignment_and_third_party_rights_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]
      llm_max_tokens: 900
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по семейному праву. Извлеки из соглашения об уплате
        алиментов информацию об уступке права на алименты и правах третьих лиц
        в отношении алиментов (ст. 383 ГК РФ, ст. 446 ГПК РФ, ст. 101 ФЗ №229-ФЗ).
        Не анализируй размер алиментов, порядок выплаты или прекращение.
        </role>

        <context>
        {context}
        </context>

        <task>
        0. Сначала определи assignment_and_third_party_rights_check_presence:
           - "present" — в тексте есть фрагменты об уступке, цессии, залоге
             алиментов, обращении взыскания или правах третьих лиц;
           - "missing" — таких фрагментов в тексте нет вообще;
           - "unclear" — есть косвенные упоминания (например, общие оговорки
             о правах сторон), но однозначно определить наличие регулирования
             невозможно.
           Если presence = "missing", заполни: assignment_regime =
           "prohibited_by_law", enforcement_protection_status =
           "statutory_default", остальные status = "not_defined",
           все details = "Данные не определены" и переходи к evidence.

        1. assignment_regime — "prohibited_by_law" / "attempted" / "not_defined".
        2. assignment_clause_status — "defined" или "not_defined".
        3. assignment_clause_details — условия об уступке из текста.
        4. enforcement_protection_status — "protected" / "statutory_default"
           / "not_defined".
        5. third_party_claims_status — "excluded" / "allowed" / "not_defined".
        6. third_party_claims_details — условия о правах третьих лиц.
        7. evidence — список цитат из соглашения.
        </task>

        <context_rules>
        - Если в тексте нет фрагментов об уступке, залоге, взыскании или
          правах третьих лиц — presence = "missing".
        - По ст. 383 ГК РФ уступка требований, неразрывно связанных с личностью
          кредитора (в т.ч. алиментов), не допускается. Если в тексте нет
          условий об уступке — assignment_regime = "prohibited_by_law" (дефолт
          закона). Если есть условие об уступке — assignment_regime = "attempted"
          (условие недействительно в силу закона).
        - По ст. 446 ГПК РФ и ст. 101 ФЗ №229-ФЗ алименты имеют ограниченную
          защиту от взыскания. Если в тексте нет специальной оговорки —
          enforcement_protection_status = "statutory_default" (законная защита
          действует автоматически).
        - third_party_claims_status = "excluded", если в тексте прямо исключены
          притязания третьих лиц; "allowed", если прямо допущены (нетипично,
          обычно недействительно); "not_defined", если не указано.
        - assignment_clause_status = "defined", если в тексте есть прямая
          оговорка об уступке (запрет или допущение); "not_defined", если
          оговорки нет.
        - Не используй "None", "null", "N/A", "-", "undefined" или пустые строки.
        - В evidence включай только прямые цитаты из текста соглашения.
        </context_rules>

        <edge_cases>
        - Если в тексте есть общая оговорка «права и обязанности сторон не могут
          быть переданы третьим лицам» без прямого упоминания алиментов —
          assignment_clause_status = "defined", assignment_regime =
          "prohibited_by_law" (общая оговорка подтверждает законодательный запрет).
        - Если в тексте есть условие о залоге или обеспечении алиментных платежей
          в пользу третьего лица (кредитора получателя) — assignment_regime =
          "attempted", third_party_claims_status = "allowed" (оба условия,
          как правило, недействительны).
        - Если текст содержит только стандартные реквизиты и порядок оплаты
          без каких-либо оговорок о правах третьих лиц — presence = "missing",
          assignment_regime = "prohibited_by_law", enforcement_protection_status =
          "statutory_default", все остальные status = "not_defined".
        - Если в тексте прямо указано «алименты не подлежат обращению взыскания
          по обязательствам получателя» — enforcement_protection_status =
          "protected", third_party_claims_status = "excluded".
        </edge_cases>

        <output_expectations>
        Верни строго валидный JSON-объект с 8 ключами (7 полей + evidence).
        Не добавляй пояснений, markdown-обёрток или комментариев.
        Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "assignment_and_third_party_rights_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по уступке алиментов и правам третьих лиц. Внутреннее агрегатное signal-поле."
