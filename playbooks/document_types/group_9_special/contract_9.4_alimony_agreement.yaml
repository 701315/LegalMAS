  - id: arrears_calculation_check
    name: "Задолженность по алиментам: механизм определения, 3-летний предел и индексация (ст. 107, 113, 117 СК РФ)"
    description: >
      Фактографическая проверка механизма определения задолженности по алиментам
      в соглашении. По п. 4 ст. 113 СК РФ размер задолженности по соглашению
      определяется исходя из размера, предусмотренного соглашением. При отсутствии
      механизма в тексте применяется порядок ст. 113 СК РФ (расчёт судебным
      приставом). Учитывается 3-летний предел взыскания за прошлый период
      (п. 2 ст. 107 СК РФ) и индексация задолженности (п. 2 ст. 117 СК РФ).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 110

    rules:
      keywords:
        - "задолженность"
        - "задолженность по алиментам"
        - "расчёт задолженности"
        - "расчет задолженности"
        - "определение задолженности"
        - "пристав"
        - "судебный пристав"
        - "индексация задолженности"
        - "три года"
        - "3 года"
        - "трёхлетний срок"
        - "трехлетний срок"
        - "ст. 113 СК РФ"
        - "ст. 107 СК РФ"
        - "взыскание задолженности"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)задолженност[а-яё]+\\s+по\\s+алимент"
        - "(?i)(расчёт|расчет|определени)[а-яё]*\\s+задолженност"
        - "(?i)(тр[ёе]хлетн|3[- ]?летн)[а-яё]+\\s+(срок|период)"
        - "(?i)индексаци[а-яё]+\\s+задолженност"
        - "(?i)судебн[а-яё]+\\s+пристав"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по семейному праву.
        Анализируется соглашение об уплате алиментов (ст. 107, 113, 117 СК РФ).
        Проверяется только один вопрос: механизм определения задолженности,
        3-летний предел взыскания и индексация задолженности.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте соглашения.
        - Не оценивай серьёзность риска — фиксируй факты.
        - По п. 4 ст. 113 СК РФ размер задолженности по соглашению определяется
          исходя из размера, установленного соглашением. Если механизм в тексте
          не установлен — применяется общий порядок ст. 113 СК РФ (расчёт
          судебным приставом).
        - По п. 2 ст. 107 СК РФ алименты за прошлый период взыскиваются в пределах
          трёхлетнего срока, предшествовавшего предъявлению исполнительного листа.
        [ЗАДАЧА]
        Найди в тексте соглашения:
        1. Наличие механизма определения задолженности.
        2. Порядок расчёта задолженности (самостоятельно / через пристава).
        3. Условие об индексации задолженности.
        4. Условие о 3-летнем пределе взыскания.
        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если данные не указаны прямо — возвращай "not_defined" (для status)
           или "Данные не определены" (для value-полей).
        3. arrears_mechanism_status:
           * "defined" — в тексте прямо установлен механизм определения
             задолженности;
           * "statutory_default" — не указано; применяется ст. 113 СК РФ
             (расчёт приставом);
           * "not_defined" — неопределимо.
        4. statutory_limit_3y_status:
           * "defined" — в тексте прямо указан 3-летний предел;
           * "statutory_default" — не указано; применяется п. 2 ст. 107 СК РФ;
           * "not_defined" — неопределимо.
        5. Не используй "None", "null", "N/A", "-", "undefined" или пустые строки.
        6. В evidence включай только текст соглашения.
        7. Верни РОВНО один валидный JSON-объект со всеми 8 ключами, пригодный
           для парсинга через json.loads без предварительной обработки. Без markdown,
           без ```json, без комментариев, без текста до или после. Начни ответ
           сразу с { и закончи }.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — механизм установлен:
        Фрагмент:
        "Задолженность по алиментам определяется исходя из размера, установленного
        настоящим соглашением, за период, не превышающий трёх лет, предшествующих
        предъявлению соглашения к взысканию. Задолженность индексируется
        пропорционально росту прожиточного минимума."
        Ответ:
        {
          "arrears_mechanism_status": "defined",
          "arrears_calculation_details": "исходя из размера, установленного соглашением",
          "statutory_limit_3y_status": "defined",
          "statutory_limit_3y_details": "не более трёх лет, предшествующих предъявлению к взысканию",
          "indexation_of_arrears_status": "defined",
          "indexation_of_arrears_details": "пропорционально росту прожиточного минимума",
          "enforcement_procedure_status": "not_defined",
          "evidence": [
            {
              "clause_ref": "п. 6.1",
              "quote": "Задолженность по алиментам определяется исходя из размера, установленного настоящим соглашением, за период, не превышающий трёх лет, предшествующих предъявлению соглашения к взысканию. Задолженность индексируется пропорционально росту прожиточного минимума."
            }
          ]
        }
        Пример 2 — механизма нет, применяется дефолт закона:
        Фрагмент:
        "Алименты уплачиваются в размере 20 000 рублей ежемесячно не позднее
        10-го числа каждого месяца."
        Ответ:
        {
          "arrears_mechanism_status": "statutory_default",
          "arrears_calculation_details": "Данные не определены",
          "statutory_limit_3y_status": "statutory_default",
          "statutory_limit_3y_details": "Данные не определены",
          "indexation_of_arrears_status": "statutory_default",
          "indexation_of_arrears_details": "Данные не определены",
          "enforcement_procedure_status": "not_defined",
          "evidence": [
            {
              "clause_ref": "п. 2.1",
              "quote": "Алименты уплачиваются в размере 20 000 рублей ежемесячно не позднее 10-го числа каждого месяца."
            }
          ]
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Проверь, что все 8 ключей (7 полей + evidence) присутствуют в JSON.
        2. Найди прямую цитату о задолженности.
        3. Найди прямую цитату о 3-летнем пределе.
        4. Найди прямую цитату об индексации задолженности.
        5. Если прямой цитаты нет — верни "statutory_default" или "not_defined".
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "arrears_mechanism_status": "<defined / statutory_default / not_defined>",
          "arrears_calculation_details": "<текст или 'Данные не определены'>",
          "statutory_limit_3y_status": "<defined / statutory_default / not_defined>",
          "statutory_limit_3y_details": "<текст или 'Данные не определены'>",
          "indexation_of_arrears_status": "<defined / statutory_default / not_defined>",
          "indexation_of_arrears_details": "<текст или 'Данные не определены'>",
          "enforcement_procedure_status": "<defined / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 700

    retrieval:
      retrieval_profile: "payment_terms_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "задолженность по алиментам расчёт задолженности определение задолженности судебный пристав трёхлетний срок 3 года индексация задолженности взыскание задолженности порядок удержания"
      preferred_unit_types:
        - obligation
        - liability_provision
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - procedures
        - remedies
        - obligations
      negative_keywords:
        - "нотариус"
        - "размер алиментов"
        - "индексация алиментов"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.40, 0.85]
        boost: 0.30
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "procedures"
        - "remedies"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 900
      presence_signal:
        field: "arrears_calculation_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по семейному праву. Извлеки из соглашения об уплате
        алиментов механизм определения задолженности, 3-летний предел взыскания
        и индексацию задолженности.
        Не анализируй размер алиментов, порядок выплаты или прекращение.
        </role>

        <context>
        {context}
        </context>

        <task>
        0. arrears_calculation_check_presence:
           Агрегатное signal-поле — наличие регулирования по задолженности.
           - "present" — если хотя бы одно из содержательных полей (arrears_mechanism_status, statutory_limit_3y_status, indexation_of_arrears_status, enforcement_procedure_status) ≠ "not_defined";
           - "missing" — если все четыре содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме задолженности есть, но из-за противоречий вывод невозможен.

           Если presence = "missing":
           - arrears_mechanism_status = "not_defined";
           - arrears_calculation_details = "Данные не определены";
           - statutory_limit_3y_status = "not_defined";
           - statutory_limit_3y_details = "Данные не определены";
           - indexation_of_arrears_status = "not_defined";
           - indexation_of_arrears_details = "Данные не определены";
           - enforcement_procedure_status = "not_defined";
           - не выполняй остальные шаги.

        1. arrears_mechanism_status — defined / statutory_default / not_defined.
        2. arrears_calculation_details — механизм расчёта или "Данные не определены".
        3. statutory_limit_3y_status — defined / statutory_default / not_defined.
        4. statutory_limit_3y_details — условия 3-летнего предела или "Данные не определены".
        5. indexation_of_arrears_status — defined / statutory_default / not_defined.
        6. indexation_of_arrears_details — механизм индексации задолженности или "Данные не определены".
        7. enforcement_procedure_status — "defined" если порядок взыскания указан, иначе "not_defined".
        </task>

        <context_rules>
        - Используй только текст соглашения.
        - arrears_mechanism_status:
          * "defined" — в тексте прямо установлен механизм определения задолженности (формула, порядок расчёта);
          * "statutory_default" — не указано, применяется п. 4 ст. 113 СК РФ (расчёт судебным приставом исходя из размера по соглашению);
          * "not_defined" — неопределимо.
        - statutory_limit_3y_status:
          * "defined" — в тексте прямо указан 3-летний предел взыскания за прошлый период;
          * "statutory_default" — не указано, применяется п. 2 ст. 107 СК РФ (3 года);
          * "not_defined" — неопределимо.
        - indexation_of_arrears_status:
          * "defined" — в тексте прямо установлена индексация задолженности;
          * "statutory_default" — не указано, применяется п. 2 ст. 117 СК РФ (пропорционально росту ПМ);
          * "not_defined" — неопределимо.
        - enforcement_procedure_status = "defined", если прямо установлен порядок взыскания задолженности (через пристава, суд, работодателя); иначе "not_defined".
        - Не используй "None", "null", "N/A", "-", "undefined" или пустые строки.
        </context_rules>

        <edge_cases>
        1. Полный механизм (расчёт + 3 года + индексация + порядок взыскания): все status = "defined".
        2. Оговорок о задолженности нет: все status = "statutory_default" (дефолт ст. 107, 113, 117 СК РФ), enforcement = "not_defined" — это НЕ дефект.
        3. Указан только 3-летний предел без механизма расчёта: statutory_limit_3y = "defined", arrears_mechanism = "statutory_default", indexation = "statutory_default".
        4. Индексация задолженности с нестандартной базой (ИПЦ вместо ПМ): indexation_of_arrears_status = "defined", в details — база индексации.
        </edge_cases>

        <output_expectations>
        Верни строго JSON с 8 ключами (7 полей + evidence).
        Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "arrears_calculation_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по задолженности, 3-летнему пределу и индексации задолженности. Внутреннее агрегатное signal-поле."
          required: true
        - name: "arrears_mechanism_status"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Механизм задолженности"
          allowed_values: ["defined", "statutory_default", "not_defined"]
          description: "Наличие механизма определения задолженности: оговорка / дефолт ст. 113 СК РФ."
          required: true
        - name: "arrears_calculation_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Расчёт задолженности"
          description: "Механизм расчёта задолженности."
          required: false
        - name: "statutory_limit_3y_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "statutory_default", "not_defined"]
          description: "Статус указания 3-летнего предела."
          required: true
        - name: "statutory_limit_3y_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          display_priority: 8
          label: "3-летний предел"
          description: "Условия 3-летнего предела взыскания задолженности."
          required: false
        - name: "indexation_of_arrears_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "statutory_default", "not_defined"]
          description: "Статус указания индексации задолженности."
          required: true
        - name: "indexation_of_arrears_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          display_priority: 9
          label: "Индексация задолженности"
          description: "Механизм индексации задолженности."
          required: false
        - name: "enforcement_procedure_status"
          type: "string"
          presentation: "signal"
          risk_weight: "low"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания порядка взыскания."
          required: true
      store_payload: true

  - id: tax_regime_check
    name: "Налоговый режим алиментов (п. 5 ст. 217 НК РФ, ст. 109 СК РФ)"
    description: >
      Фактографическая проверка налогового режима алиментов. По п. 5 ст. 217 НК РФ
      алименты освобождены от НДФЛ у получателя. У плательщика права на налоговый
      вычет по алиментам не возникает. При удержании по месту работы (ст. 109
      СК РФ) администрация работодателя исполняет функцию платёжного агента, но
      не становится налоговым агентом по алиментам. Проверяется наличие / отсутствие
      налоговых оговорок в тексте и корректность формулировок.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "medium"
    severity_if_pass: "pass"
    severity_if_fail: "medium"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 120

    rules:
      keywords:
        - "НДФЛ"
        - "налог на доходы"
        - "налогообложение"
        - "освобождение от налога"
        - "не облагается"
        - "налоговый вычет"
        - "налоговая оговорка"
        - "удержание из заработной платы"
        - "по месту работы"
        - "налоговый агент"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)НДФЛ|налог[а-яё]*\\s+на\\s+доход"
