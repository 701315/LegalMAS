    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 100

    rules:
      keywords:
        - "интересы ребёнка"
        - "в интересах ребёнка"
        - "ненадлежащее исполнение"
        - "орган опеки"
        - "прокурор"
        - "признание недействительным"
        - "отказ от общения"
        - "отказ от воспитания"
        - "лишение родительских прав"
        - "прекращение общения"
        - "при условии не"
        - "не препятствовать общению"
        - "кабальные условия"
