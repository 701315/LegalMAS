    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 800
      presence_signal:
        field: "payment_procedure_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по семейному праву. Извлеки из соглашения об уплате
        алиментов порядок, сроки, способ выплаты и подтверждение оплаты.
        Не анализируй размер алиментов, индексацию или прекращение.
        </role>

        <context>
        {context}
        </context>

        <task>
        0. payment_procedure_check_presence:
           Агрегатное signal-поле — наличие регулирования по порядку выплаты.
           - "present" — если хотя бы одно из содержательных полей (payment_deadline_status, payment_method_status, payment_confirmation_status) = "defined";
           - "missing" — если все три содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме порядка выплаты есть, но из-за противоречий вывод невозможен.

           Если presence = "missing":
           - payment_deadline_status = "not_defined";
           - payment_deadline_details = "Данные не определены";
           - payment_method_status = "not_defined";
           - payment_method_code = "not_defined";
           - payment_method_details = "Данные не определены";
           - payment_confirmation_status = "not_defined";
           - payment_confirmation_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. payment_deadline_status — "defined" если конкретная дата/срок платежа указаны, иначе "not_defined".
        2. payment_deadline_details — конкретная дата или "Данные не определены".
        3. payment_method_status — "defined" если способ перечисления указан, иначе "not_defined".
        4. payment_method_code — bank_transfer / cash / postal / payroll_deduction / other / not_defined.
        5. payment_method_details — способ и реквизиты или "Данные не определены".
        6. payment_confirmation_status — "defined" если порядок подтверждения указан, иначе "not_defined".
        7. payment_confirmation_details — порядок подтверждения или "Данные не определены".
        </task>

        <context_rules>
        - Используй только текст соглашения.
        - payment_method_code: "перечисление на счёт" = "bank_transfer"; "наличными" = "cash"; "почтовый перевод" = "postal"; "удержание из заработной платы по месту работы" = "payroll_deduction" (ст. 109 СК РФ); иной прямо названный способ = "other"; не указан = "not_defined".
        - Если способ = "bank_transfer", в payment_method_details приводи реквизиты (номер счёта, банк).
        - Если способ = "cash", в payment_confirmation_details отражай способ подтверждения (расписка, квитанция).
        - Не используй "None", "null", "N/A", "-", "undefined" или пустые строки.
        </context_rules>

        <edge_cases>
        1. Наличные без указания способа подтверждения: payment_method_code = "cash", payment_confirmation_status = "not_defined" — риск спора «оплатил / не оплатил».
        2. Удержание по месту работы (ст. 109 СК РФ): payment_method_code = "payroll_deduction", в details — «удержание из заработной платы администрацией работодателя».
        3. Комбинированный способ (например, bank_transfer + cash): payment_method_code = "other", в details — описание комбинации.
        4. Указан только срок, но не способ: payment_deadline_status = "defined", payment_method_status = "not_defined".
        </edge_cases>

        <output_expectations>
        Верни строго JSON с 8 ключами (7 полей + evidence).
        Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "payment_procedure_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по порядку, срокам и способу выплаты алиментов. Внутреннее агрегатное signal-поле."
          required: true
        - name: "payment_deadline_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения даты платежа."
          required: true
        - name: "payment_deadline_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Дата платежа"
          description: "Конкретная дата ежемесячного платежа."
          required: true
        - name: "payment_method_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения способа перечисления."
          required: true
        - name: "payment_method_code"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["bank_transfer", "cash", "postal", "payroll_deduction", "other", "not_defined"]
          description: "Способ перечисления / удержания."
          required: true
        - name: "payment_method_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Способ выплаты"
          description: "Способ перечисления и реквизиты."
          required: false
        - name: "payment_confirmation_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус порядка подтверждения оплаты."
          required: true
        - name: "payment_confirmation_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Подтверждение оплаты"
          description: "Порядок подтверждения оплаты (платёжное поручение, выписка, расписка, квитанция)."
          required: false
      store_payload: true

  - id: indexation_check
    name: "Индексация алиментов в твёрдой сумме (ст. 105 СК РФ)"
    description: >
      Фактографическая проверка механизма индексации для алиментов, установленных
      в твёрдой денежной сумме. По ст. 105 СК РФ индексация императивна: если
      в соглашении не установлен иной порядок, применяется дефолт закона —
      пропорционально росту величины прожиточного минимума по месту жительства
      получателя. Отсутствие упоминания индексации в тексте — не дефект,
      применяется дефолт.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 50

    rules:
      keywords:
        - "индексация"
        - "индексация алиментов"
        - "прожиточный минимум"
        - "рост потребительских цен"
        - "ИПЦ"
        - "пропорционально росту"
        - "пересчёт суммы"
        - "перерасчёт"
        - "ст. 105 СК РФ"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)индексаци(я|ю|и)\\s+(размера\\s+)?алимент"
        - "(?i)пропорционально\\s+(росту\\s+)?(величин(ы|е)|размер(у|а))\\s+прожиточн"
        - "(?i)(подлежат|производится)\\s+индексаци"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по семейному праву.
        Анализируется соглашение об уплате алиментов (ст. 105 СК РФ).
        Проверяется только один вопрос: механизм индексации алиментов.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте соглашения.
        - Не оценивай серьёзность риска.
        - По ст. 105 СК РФ индексация алиментов в твёрдой сумме императивна:
          если иной порядок не установлен соглашением, применяется дефолт —
          пропорционально росту величины прожиточного минимума. Поэтому
          отсутствие упоминания индексации в тексте — НЕ дефект; применяется
          дефолт закона.
        [ЗАДАЧА]
        Найди в тексте соглашения:
        1. Наличие механизма индексации (свой порядок / ссылка на ст. 105 /
           не указан — дефолт закона).
        2. Основание индексации (прожиточный минимум / ИПЦ / фиксированный %).
        3. Периодичность индексации.
        4. Кто производит индексацию.
        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если данные не указаны прямо — возвращай "not_defined" (для status)
           или "Данные не определены" (для value-полей).
        3. Различай три уровня состояния механизма индексации:
           * "concrete" — в тексте прямо установлен свой порядок индексации
             (база, периодичность, исполнитель);
           * "default_reference" — в тексте есть прямая отсылка к ст. 105 СК РФ;
           * "statutory_default" — индексация не упомянута; применяется дефолт
             ст. 105 СК РФ (ПМ по месту жительства получателя);
           * "not_applicable" — алименты не в твёрдой сумме, индексация
             неприменима.
        4. Не используй "None", "null", "N/A", "-", "undefined" или пустые строки.
        5. В evidence включай только текст соглашения.
        6. Верни РОВНО один валидный JSON-объект со всеми 7 ключами, пригодный
           для парсинга через json.loads без предварительной обработки. Без markdown,
           без ```json, без комментариев, без текста до или после. Начни ответ
           сразу с { и закончи }.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — свой конкретный порядок индексации:
        Фрагмент:
        "Размер алиментов подлежит индексации пропорционально росту величины
        прожиточного минимума для детей в субъекте РФ по месту жительства
        получателя. Индексация производится ежеквартально плательщиком
        самостоятельно."
        Ответ:
        {
          "indexation_status": "concrete",
          "indexation_basis": "subsistence_minimum",
          "indexation_frequency_status": "defined",
          "indexation_frequency_details": "ежеквартально",
          "indexation_performer_status": "defined",
          "indexation_performer_details": "плательщик самостоятельно",
          "evidence": [
