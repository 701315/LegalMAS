type: contract_9.4_alimony_agreement
name: "Алиментное соглашение (соглашение об уплате алиментов)"

description: |
  Соглашение между лицом, обязанным уплачивать алименты (плательщиком), и лицом, имеющим
  право на их получение (получателем), или его законным представителем. Определяет размер,
  условия, порядок и сроки выплаты средств на содержание. Заключается в отношении:
  несовершеннолетних детей, нетрудоспособных совершеннолетних детей, супруга (бывшего супруга),
  родителей, других членов семьи.
  Требует обязательного нотариального удостоверения (ст. 100 СК РФ). Имеет силу исполнительного
  листа — при неисполнении может быть предъявлено в службу судебных приставов для принудительного
  взыскания без обращения в суд. Размер алиментов на несовершеннолетних детей не может быть
  ниже минимума, установленного ст. 81 СК РФ. Для алиментов в твёрдой денежной сумме
  обязательна индексация (ст. 105 СК РФ).
  Регулируется Главой 16 Семейного кодекса РФ (ст. 99–105).

version: 4.0
parent: class_9_special_imperative

metadata:
  category: contract
  subcategory: family_law
  complexity: high
  risk_level: high
  jurisdiction: RU
  language: ru
  legal_base: "Семейный кодекс РФ (Глава 16, ст. 99–105)"
  doc_types_supported:
    - "соглашение об уплате алиментов на несовершеннолетнего ребёнка"
    - "соглашение об уплате алиментов на нетрудоспособного совершеннолетнего ребёнка"
    - "соглашение об уплате алиментов на супруга (бывшего супруга)"
    - "соглашение об уплате алиментов на родителей"
    - "соглашение об уплате алиментов на иного члена семьи"
    - "дополнительное соглашение к алиментному соглашению"

engine_expectations:
  evidence_required: true
  evidence_style: "pinpoint"
  allow_not_found: true
  output_style: "dd_grid"
  prefer_structured_outputs: true

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 1: КЛАССИФИКАЦИЯ (L1/L2)
#  Читается: YAMLRegistry → L1FilenameClassifier, L2HeaderClassifier
# ════════════════════════════════════════════════════════════════════════════

classification_runtime_v1:

  scoring:
    accept_threshold: 0.8
    strong_signal_threshold: 0.9
    ambiguity_margin: 0.18
    input_quality_weight: 1.0

  rules:

    filename_patterns:
      - "(?i)алиментн[а-яё]*\\s*(соглашени|договор)"
      - "(?i)соглашени[а-яё]*\\s+об\\s+уплате\\s+алимент"
      - "(?i)child[\\s_.-]?support"
      - "(?i)alimony[\\s_.-]?agreement"
      - "(?i)maintenance[\\s_.-]?agreement"

    folder_patterns:
      - "(?i)алимент"
      - "(?i)семейн"
      - "(?i)family[\\s_]?law"
      - "(?i)child[\\s_]?support"

    keywords:

      high:
        - pattern: "(?i)алиментн[оеая]\\s+соглашен[иеия]"
          weight: 1.0
          distinctiveness: high
          context: header
          description: "Основное название алиментного соглашения"

        - pattern: "(?i)соглашен[иея]\\s+об\\s+уплат[еы]\\s+алимент[ов]"
          weight: 0.95
          distinctiveness: high
          context: any
          description: "Общее наименование соглашения об уплате алиментов"

        - pattern: "(?i)дополнительн[оеая]\\s+соглашен[иеия]\\s+к\\s+алиментн[омуому]\\s+соглашен[июию]"
          weight: 0.9
          distinctiveness: high
          context: any
          description: "Дополнительное соглашение к алиментному соглашению"

        - pattern: "(?i)соглашен[иея]\\s+об\\s+уплат[еы]\\s+алимент[ов]\\s+на\\s+несовершеннолетн[егоую]\\s+ребенк[аоу]"
          weight: 0.95
          distinctiveness: high
          context: any
          description: "Алименты на несовершеннолетнего ребёнка"

        - pattern: "(?i)соглашен[иея]\\s+об\\s+уплат[еы]\\s+алимент[ов]\\s+на\\s+нетрудоспособн[огоую]\\s+совершеннолетн[егоую]\\s+ребенк[аоу]"
          weight: 0.9
          distinctiveness: high
          context: any
          description: "Алименты на нетрудоспособного совершеннолетнего ребёнка"

        - pattern: "(?i)соглашен[иея]\\s+об\\s+уплат[еы]\\s+алимент[ов]\\s+на\\s+супруг[аоу]\\s*\\(бывш[егоую]\\s+супруг[аоу]\\)"
          weight: 0.9
          distinctiveness: high
          context: any
          description: "Алименты на супруга или бывшего супруга"

        - pattern: "(?i)соглашен[иея]\\s+об\\s+уплат[еы]\\s+алимент[ов]\\s+на\\s+родител[еяй]"
          weight: 0.9
          distinctiveness: high
          context: any
          description: "Алименты на родителей"

        - pattern: "(?i)соглашен[иея]\\s+об\\s+уплат[еы]\\s+алимент[ов]\\s+на\\s+ин[огоые]\\s+член[аов]\\s+семь[ии]"
          weight: 0.9
          distinctiveness: high
          context: any
          description: "Алименты на иных членов семьи"

        - pattern: "(?i)плательщик\\s+алимент[ов]"
          weight: 0.85
          distinctiveness: high
          context: any
          description: "Плательщик алиментов как сторона соглашения"

        - pattern: "(?i)получател[ьяеи]\\s+алимент[ов]"
          weight: 0.85
          distinctiveness: high
          context: any
          description: "Получатель алиментов как сторона соглашения"

        - pattern: "(?i)нотариальн[оеое]\\s+удостоверен[иеия]\\s+соглашен[иеия]\\s+об\\s+уплат[еы]\\s+алимент[оо]в"
          weight: 0.95
          distinctiveness: high
          context: any
          description: "Нотариальное удостоверение алиментного соглашения — ст. 100 СК РФ"

        - pattern: "(?i)исполнительн[ыйое]\\s+лист"
          weight: 0.9
          distinctiveness: high
          context: any
          description: "Исполнительная сила алиментного соглашения"

        - pattern: "(?i)сил[ауы]\\s+исполнительн[огоого]\\s+лист[ауы]"
          weight: 0.9
          distinctiveness: high
          context: any
          description: "Приравнивание соглашения к исполнительному листу"

        - pattern: "(?i)ст\\.?\\s*100\\s+ск\\s+рф"
          weight: 0.9
          distinctiveness: high
          context: any
          description: "Статья 100 СК РФ об алиментном соглашении"

      medium:
        - pattern: "(?i)размер\\s+алимент[оо]в"
          weight: 0.65
          distinctiveness: medium
          context: any
          description: "Размер алиментов по соглашению"

        - pattern: "(?i)тв[её]рд[а-яё]+\\s+денежн[а-яё]+\\s+сумм[аа]"
          weight: 0.6
          distinctiveness: medium
          context: any
          description: "Алименты в твёрдой денежной сумме"

        - pattern: "(?i)дол[яьи]\\s+от\\s+заработк[аа]"
          weight: 0.6
          distinctiveness: medium
          context: any
          description: "Алименты в доле от заработка/дохода"

        - pattern: "(?i)индексаци[яяи]\\s+алимент[оо]в"
          weight: 0.6
          distinctiveness: medium
          context: any
          description: "Индексация алиментов"

        - pattern: "(?i)несовершеннолетн[иие]+\\s+реб[её]нок"
          weight: 0.6
          distinctiveness: medium
          context: any
          description: "Несовершеннолетний ребёнок как получатель алиментов"

        - pattern: "(?i)содержани[ея]\\s+реб[её]нк[аа]"
          weight: 0.55
          distinctiveness: medium
          context: any
          description: "Содержание ребёнка за счёт алиментов"

        - pattern: "(?i)прожиточн[ыо]й\\s+минимум"
          weight: 0.55
          distinctiveness: medium
          context: any
          description: "Прожиточный минимум как ориентир для размера алиментов"

        - pattern: "(?i)ст\\.\\s*81\\s*СК\\s*РФ"
          weight: 0.6
          distinctiveness: medium
          context: any
          description: "Статья 81 СК РФ о долевом размере алиментов"

        - pattern: "(?i)ст\\.\\s*103\\s*СК\\s*РФ"
          weight: 0.55
          distinctiveness: medium
          context: any
          description: "Статья 103 СК РФ о последствиях неисполнения соглашения"

        - pattern: "(?i)ст\\.\\s*104\\s*СК\\s*РФ"
          weight: 0.55
          distinctiveness: medium
          context: any
          description: "Статья 104 СК РФ о способах исполнения алиментных обязательств"

        - pattern: "(?i)ст\\.\\s*105\\s*СК\\s*РФ"
          weight: 0.55
          distinctiveness: medium
          context: any
          description: "Статья 105 СК РФ об индексации алиментов"

        - pattern: "(?i)нотариальн[оеое]\\s+удостоверен[иеия]"
          weight: 0.6
          distinctiveness: medium
          context: any
          description: "Обязательное нотариальное удостоверение алиментного соглашения"

      low:
        - pattern: "(?i)поряд[оа]к\\s+выплат[ыы]"
          weight: 0.3
          distinctiveness: low
          context: any
          description: "Порядок выплат алиментов"

        - pattern: "(?i)срок\\s+действи[яя]"
          weight: 0.25
          distinctiveness: low
          context: any
          description: "Срок действия алиментного соглашения"

        - pattern: "(?i)\\bнеустойк[ааы]\\b"
          weight: 0.3
          distinctiveness: low
          context: any
          description: "Неустойка за просрочку уплаты алиментов"

        - pattern: "(?i)судебн[ыо]е\\s+пристав[ыа]"
          weight: 0.3
          distinctiveness: low
          context: any
          description: "Участие службы судебных приставов"

        - pattern: "(?i)принудительн[оа]е\\s+взыскани[ея]"
          weight: 0.3
          distinctiveness: low
          context: any
          description: "Принудительное взыскание алиментов"

        - pattern: "(?i)задолженност[ьи]\\s+по\\s+алиментам"
          weight: 0.3
          distinctiveness: low
          context: any
          description: "Задолженность по алиментам"

        - pattern: "(?i)дополнительн[ыо]е\\s+расход[ыо]\\s+на\\s+реб[её]нк[аа]"
          weight: 0.25
          distinctiveness: low
          context: any
          description: "Дополнительные расходы на ребёнка (лечение, обучение и т.п.)"

    exclusions:
      - pattern: "(?i)судебн[оа]е\\s+решени[ея]\\s+о\\s+взыскани[ии]\\s+алимент[оо]в"
        severity: hard
        weight: -1.0
        description: "Судебное решение о взыскании алиментов — иной тип документа"

      - pattern: "(?i)судебн[ыо]й\\s+приказ\\s+о\\s+взыскани[ии]\\s+алимент[оо]в"
        severity: hard
        weight: -1.0
        description: "Судебный приказ о взыскании алиментов"

      - pattern: "(?i)решени[ея]\\s+суд[аа]"
        severity: hard
        weight: -1.0
        description: "Общее судебное решение, отличное от нотариального соглашения"

      - pattern: "(?i)определени[ея]\\s+суд[аа]"
        severity: hard
        weight: -1.0
        description: "Судебное определение, а не соглашение сторон"

      - pattern: "(?i)брачн[ыо]й\\s+договор"
        severity: hard
        weight: -1.0
        description: "Брачный договор — иной семейно-правовой договор"

      - pattern: "(?i)брачн[ыо]й\\s+контракт"
        severity: hard
        weight: -1.0
        description: "Брачный контракт, а не алиментное соглашение"

      - pattern: "(?i)соглашени[ея]\\s+о\\s+раздел[ее]\\s+имуществ[аа]"
        severity: hard
        weight: -1.0
        description: "Соглашение о разделе имущества супругов"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 2: ТРИГГЕРЫ
