          "payment_deadline_details": "не позднее 10-го числа каждого месяца",
          "payment_method_status": "defined",
          "payment_method_code": "bank_transfer",
          "payment_method_details": "перечисление на банковский счёт № 40817810000000000000 в ПАО Сбербанк",
          "payment_confirmation_status": "defined",
          "payment_confirmation_details": "платёжное поручение с отметкой банка",
          "evidence": [
            {
              "clause_ref": "п. 3.1",
              "quote": "Алименты перечисляются на банковский счёт получателя № 40817810000000000000 в ПАО Сбербанк не позднее 10-го числа каждого месяца. Подтверждением оплаты является платёжное поручение с отметкой банка."
            }
          ]
        }
        Пример 2 — наличные с распиской (критично для доказывания):                # ← FIX: реальный edge-case
