        }
        Пример 2 — твёрдая сумма:
        Фрагмент:
        "Алименты уплачиваются в твёрдой денежной сумме 25 000 рублей ежемесячно."
        Ответ:
        {
          "amount_type": "fixed",
          "amount_value_status": "defined",
          "amount_value_details": "25 000 рублей ежемесячно",
          "payment_frequency_status": "defined",
          "payment_frequency_details": "ежемесячно",
