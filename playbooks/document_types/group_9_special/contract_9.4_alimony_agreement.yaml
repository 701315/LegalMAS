        - Все свободные текстовые поля заполняй на русском языке.
        - Для notarial_form_executive_force_check_presence используй только: "present", "missing", "unclear".
        - Для notarial_status используй только: "certified", "mentioned", "not_defined".
        - Для enum-полей *_status используй только: "defined", "not_defined".
        - Fallback при отсутствии данных:
          * notary_name_value → "Данные не определены";
          * registry_number_value → "Данные не определены";
          * executive_force_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_value / *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

