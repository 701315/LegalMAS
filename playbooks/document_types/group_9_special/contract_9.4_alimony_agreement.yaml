          "end_date_or_event_status": "<defined / not_defined>",
          "end_date_or_event_details": "<дата/событие или 'Данные не определены'>",
          "death_clause_status": "<defined / not_defined>",
          "amendment_procedure_status": "<defined / not_defined>",
          "amendment_procedure_details": "<текст или 'Данные не определены'>",
