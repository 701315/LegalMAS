  - id: multiple_children_allocation_check
    name: "Распределение алиментов между детьми от разных браков (ст. 81, 119 СК РФ)"
    description: >
      Фактографическая проверка распределения алиментов при наличии у плательщика
      нескольких детей (в том числе от разных браков). По ст. 81 СК РФ
      установлены пропорции 1/4 на одного, 1/3 на двух, 1/2 на трёх и более
      детей. Совокупный размер удержаний не может превышать 70% заработка
      (ст. 138 ТК РФ). Возможно снижение размера судом по ст. 119 СК РФ
      при существенном изменении обстоятельств.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 160

    rules:
      keywords:
        - "дети от разных браков"
        - "несколько детей"
        - "двое детей"
        - "трое детей"
        - "1/3"
        - "1/2"
        - "пропорциональное распределение"
        - "пропорционально"
        - "первый ребёнок"
        - "второй ребёнок"
        - "снижение размера алиментов"
        - "перерасчёт"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(1/3|1/2|1/4|одн[а-яё]+\\s+(трет|половин|четверт))"
        - "(?i)(дво|тро)[е-яё]+\\s+дет"
        - "(?i)дет[е-яё]+\\s+от\\s+разных\\s+брак"
        - "(?i)(снижени|перерасч[её]т)[а-яё]*\\s+размер"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по семейному праву.
        Анализируется соглашение об уплате алиментов (ст. 81, 119 СК РФ,
        ст. 138 ТК РФ).
        Проверяется только один вопрос: распределение алиментов между
        несколькими детьми (в том числе от разных браков) и совокупные пределы.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте соглашения.
        - Не оценивай серьёзность риска — фиксируй факты.
        - По п. 1 ст. 81 СК РФ: 1/4 заработка на одного ребёнка, 1/3 на двух,
          1/2 на трёх и более детей.
        - Совокупный размер удержаний не может превышать 70% заработка
          (ст. 138 ТК РФ) при наличии иных алиментных обязательств.
        - По ст. 119 СК РФ суд может уменьшить или увеличить размер алиментов
          при существенном изменении материального/семейного положения.
        [ЗАДАЧА]
        Найди в тексте соглашения:
        1. Число детей, на которых уплачиваются алименты.
        2. Распределение долей между детьми.
        3. Указание на других детей плательщика (от иных браков).
        4. Условия о перерасчёте / снижении.
        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если данные не указаны прямо — возвращай "not_defined" (для status)
           или "Данные не определены" (для value-полей).
        3. children_count_status:
           * "defined" — число детей прямо указано;
           * "not_defined" — не указано.
        4. per_child_allocation_status:
           * "defined" — распределение по детям указано;
           * "aggregate" — указан только совокупный размер (без разделения
             между детьми);
           * "not_defined" — не указано.
        5. aggregate_withholding_status:
           * "within_limit" — совокупный размер удержаний в пределах 70%;
           * "exceeds_limit" — потенциально превышает 70% с учётом других
             обязательств;
           * "not_evaluable" — недостаточно данных для оценки;
           * "not_defined" — неопределимо.
        6. Не используй "None", "null", "N/A", "-", "undefined" или пустые строки.
        7. В evidence включай только текст соглашения.
        8. Верни РОВНО один валидный JSON-объект со всеми 8 ключами, пригодный
           для парсинга через json.loads без предварительной обработки. Без markdown,
           без ```json, без комментариев, без текста до или после. Начни ответ
           сразу с { и закончи }.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — двое детей, доли распределены, в пределах лимита:
        Фрагмент:
        "Алименты уплачиваются на содержание двоих несовершеннолетних детей:
        1/6 заработка на каждого ребёнка, всего 1/3 заработка плательщика
        ежемесячно."
        Ответ:
        {
          "children_count_status": "defined",
          "children_count_value": "2",
          "per_child_allocation_status": "defined",
          "per_child_allocation_details": "1/6 заработка на каждого ребёнка (всего 1/3)",
          "aggregate_withholding_status": "within_limit",
          "aggregate_withholding_details": "1/3 заработка, что в пределах 70%",
          "reduction_risk_status": "not_defined",
          "evidence": [
            {
              "clause_ref": "п. 2.2",
              "quote": "Алименты уплачиваются на содержание двоих несовершеннолетних детей: 1/6 заработка на каждого ребёнка, всего 1/3 заработка плательщика ежемесячно."
            }
          ]
        }
        Пример 2 — указан совокупный размер без разделения:
        Фрагмент:
        "Алименты уплачиваются в размере 30 000 рублей ежемесячно на содержание
        детей от двух браков."
        Ответ:
        {
          "children_count_status": "defined",
          "children_count_value": "2 (от двух браков)",
          "per_child_allocation_status": "aggregate",
          "per_child_allocation_details": "общая сумма 30 000 рублей на детей от двух браков без разделения",
          "aggregate_withholding_status": "not_evaluable",
          "aggregate_withholding_details": "Требуется расчёт доли от заработка для оценки соответствия 70%",
          "reduction_risk_status": "not_defined",
          "evidence": [
            {
              "clause_ref": "п. 2.1",
              "quote": "Алименты уплачиваются в размере 30 000 рублей ежемесячно на содержание детей от двух браков."
            }
          ]
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Проверь, что все 8 ключей (7 полей + evidence) присутствуют в JSON.
        2. Найди прямую цитату о числе детей.
        3. Найди прямую цитату о распределении долей.
        4. Оцени aggregate_withholding_status с учётом 70% лимита.
        5. Если прямой цитаты нет — верни "not_defined". Не додумывай.
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "children_count_status": "<defined / not_defined>",
          "children_count_value": "<число или 'Данные не определены'>",
          "per_child_allocation_status": "<defined / aggregate / not_defined>",
          "per_child_allocation_details": "<текст или 'Данные не определены'>",
          "aggregate_withholding_status": "<within_limit / exceeds_limit / not_evaluable / not_defined>",
          "aggregate_withholding_details": "<обоснование или 'Данные не определены'>",
          "reduction_risk_status": "<defined / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 700

    retrieval:
      retrieval_profile: "payment_terms_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "несколько детей дети от разных браков двое детей трое детей 1/3 1/2 1/4 пропорциональное распределение пропорционально первый ребёнок второй ребёнок снижение размера алиментов перерасчёт"
      preferred_unit_types:
        - obligation
        - general_provision
        - payment_term
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "нотариус"
        - "индексация"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.15, 0.60]
        boost: 0.30
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 550

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      presence_signal:
        field: "multiple_children_allocation_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]
      llm_max_tokens: 900
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по семейному праву. Извлеки из соглашения об уплате
        алиментов данные о числе детей, распределении долей и совокупных пределах
        удержания (ст. 81, 119 СК РФ, ст. 138 ТК РФ).
        Не анализируй порядок выплаты, индексацию или прекращение.
        </role>

        <context>
        {context}
        </context>

        <task>
        0. Сначала определи multiple_children_allocation_check_presence:
           - "present" — в тексте есть фрагменты о числе детей, распределении
             долей, совокупных пределах удержания или механизме перерасчёта;
           - "missing" — таких фрагментов в тексте нет вообще;
           - "unclear" — есть косвенные упоминания, но однозначно определить
             наличие регулирования невозможно.
           Если presence = "missing", заполни все status-поля как "not_defined",
           все value/details-поля как "Данные не определены" и переходи
           к evidence.

        1. children_count_status — "defined" или "not_defined".
        2. children_count_value — число детей.
        3. per_child_allocation_status — "defined" / "aggregate" / "not_defined".
        4. per_child_allocation_details — распределение долей.
        5. aggregate_withholding_status — "within_limit" / "exceeds_limit" /
           "not_evaluable" / "not_defined".
        6. aggregate_withholding_details — обоснование.
        7. reduction_risk_status — "defined" или "not_defined".
        8. evidence — список цитат из соглашения.
        </task>

        <context_rules>
        - Если в тексте нет фрагментов о числе детей и распределении —
          presence = "missing", все status = "not_defined".
        - По п. 1 ст. 81 СК РФ: 1/4 заработка на одного ребёнка, 1/3 на двух,
          1/2 на трёх и более детей.
        - Совокупный размер удержаний не может превышать 70% заработка при
          наличии иных алиментных обязательств (ст. 138 ТК РФ).
        - per_child_allocation_status = "aggregate", если указан только общий
          размер без разделения между детьми; "defined", если доли по каждому
          ребёнку указаны отдельно.
        - aggregate_withholding_status = "within_limit", если совокупный размер
          удержаний не превышает 70%; "exceeds_limit", если превышает;
          "not_evaluable", если недостаточно данных для расчёта.
        - reduction_risk_status = "defined", если в тексте прямо установлен
          механизм перерасчёта / снижения при изменении обстоятельств
          (ст. 119 СК РФ).
        - Не используй "None", "null", "N/A", "-", "undefined" или пустые строки.
        - В evidence включай только прямые цитаты из текста соглашения.
        </context_rules>

        <edge_cases>
        - Если в соглашении указан один ребёнок и нет упоминания других детей
          плательщика — presence = "present", children_count_status = "defined",
          per_child_allocation_status = "not_defined" (распределение не
          требуется), aggregate_withholding_status = "not_evaluable".
        - Если указана твёрдая денежная сумма на нескольких детей без разделения
          по каждому — per_child_allocation_status = "aggregate",
          aggregate_withholding_status = "not_evaluable" (невозможно оценить
          долю от заработка без данных о доходе).
        - Если в тексте прямо указаны доли для каждого ребёнка от разных браков
          (например, «1/6 на первого, 1/6 на второго») —
          per_child_allocation_status = "defined", aggregate_withholding_status
          оценивается по сумме долей.
        - Если есть оговорка о перерасчёте при рождении нового ребёнка у
          плательщика, но нет распределения долей — reduction_risk_status =
          "defined", per_child_allocation_status = "not_defined".
        </edge_cases>

        <output_expectations>
        Верни строго валидный JSON-объект с 9 ключами (8 полей + evidence).
        Не добавляй пояснений, markdown-обёрток или комментариев.
        Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "multiple_children_allocation_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по распределению алиментов между несколькими детьми. Внутреннее агрегатное signal-поле."
          required: true
        - name: "children_count_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания числа детей."
          required: true
        - name: "children_count_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Число детей"
          description: "Число детей, на которых уплачиваются алименты."
          required: false
        - name: "per_child_allocation_status"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Распределение долей"
          allowed_values: ["defined", "aggregate", "not_defined"]
          description: "Способ распределения долей между детьми."
          required: false
        - name: "per_child_allocation_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          display_priority: 6
          label: "Детали распределения"
          description: "Детали распределения долей."
          required: false
        - name: "aggregate_withholding_status"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Совокупный предел"
          allowed_values: ["within_limit", "exceeds_limit", "not_evaluable", "not_defined"]
          description: "Соответствие совокупного размера удержаний пределу 70%."
          required: false
        - name: "aggregate_withholding_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          display_priority: 7
          label: "Обоснование предела"
          description: "Расчёт и обоснование совокупного предела."
          required: false
        - name: "reduction_risk_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Наличие механизма перерасчёта при изменении обстоятельств."
          required: true
      store_payload: true

  - id: bankruptcy_effects_check
    name: "Банкротство сторон и приоритет алиментных требований (ФЗ №127-ФЗ)"
    description: >
      Фактографическая проверка влияния банкротства сторон на алиментные
      обязательства. По п. 2 ст. 213.27 ФЗ №127-ФЗ текущие алиментные платежи
      при банкротстве плательщика удовлетворяются вне очереди; задолженность
      за периоды до возбуждения дела относится к первой очереди реестра
      (п. 3 ст. 137 ФЗ №127-ФЗ). При банкротстве получателя алименты,
      используемые на содержание, не входят в конкурсную массу. Проверяется
      наличие / отсутствие в тексте оговорок о банкротстве.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 170

    rules:
      keywords:
        - "банкротство"
        - "несостоятельность"
        - "финансовое оздоровление"
        - "конкурсное производство"
        - "наблюдение"
        - "внешнее управление"
        - "конкурсная масса"
        - "реестр требований кредиторов"
        - "текущие платежи"
        - "первая очередь"
        - "финансовый управляющий"
        - "ФЗ №127-ФЗ"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)банкротств|несостоятельност"
        - "(?i)(конкурсн|наблюдени|внешн)[а-яё]+\\s+(производств|управлени)"
        - "(?i)финансов[а-яё]+\\s+управляющ"
        - "(?i)конкурсн[а-яё]+\\s+масс"
        - "(?i)текующ[а-яё]+\\s+платеж"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по семейному праву.
        Анализируется соглашение об уплате алиментов (ФЗ №127-ФЗ
        «О несостоятельности (банкротстве)», ст. 101 ФЗ №229-ФЗ).
        Проверяется только один вопрос: влияние банкротства сторон
        на алиментные обязательства.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте соглашения.
        - Не оценивай серьёзность риска — фиксируй факты.
        - При банкротстве плательщика текущие алиментные платежи удовлетворяются
