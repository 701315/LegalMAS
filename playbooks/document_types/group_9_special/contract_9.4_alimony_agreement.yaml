        "Алименты уплачиваются наличными денежными средствами ежемесячно не позднее
        5-го числа текущего месяца. Факт уплаты подтверждается письменной распиской
        получателя."
        Ответ:
        {
          "payment_deadline_status": "defined",
          "payment_deadline_details": "не позднее 5-го числа текущего месяца",
          "payment_method_status": "defined",
          "payment_method_code": "cash",
          "payment_method_details": "наличными денежными средствами",
          "payment_confirmation_status": "defined",
          "payment_confirmation_details": "письменная расписка получателя",
          "evidence": [
            {
              "clause_ref": "п. 3.2",
              "quote": "Алименты уплачиваются наличными денежными средствами ежемесячно не позднее 5-го числа текущего месяца. Факт уплаты подтверждается письменной распиской получателя."
