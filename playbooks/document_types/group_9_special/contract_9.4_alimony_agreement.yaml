           - adjustment_grounds_details = "Данные не определены";
           - adjustment_procedure_code = "not_defined";
           - adjustment_procedure_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. adjustment_clause_status — наличие оговорки: defined / statutory_default / not_applicable / not_defined.
        2. adjustment_grounds_status — "defined" если перечень оснований указан, иначе "not_defined".
        3. adjustment_grounds_details — перечень оснований или "Данные не определены".
        4. adjustment_procedure_code — negotiation / court / both / statutory_default / not_defined.
        5. adjustment_procedure_details — детали процедуры или "Данные не определены".
        </task>

        <context_rules>
        - Используй только текст соглашения.
        - adjustment_clause_status:
          * "defined" — оговорка о возможности изменения при существенном изменении обстоятельств прямо установлена в тексте;
          * "statutory_default" — оговорка не указана; применяется п. 3 ст. 101 СК РФ (право требовать изменения в суде). Это НЕ дефект;
          * "not_applicable" — изменение невозможно по природе обязательства;
          * "not_defined" — неопределимо по тексту.
        - adjustment_procedure_code:
          * "negotiation" — изменение по соглашению сторон;
          * "court" — только через суд;
          * "both" — переговорный порядок с переходом в суд при неурегулировании;
          * "statutory_default" — не указан, применяется судебный порядок по п. 3 ст. 101 СК РФ;
          * "not_defined" — неопределимо.
        - По п. 2 ст. 101 СК РФ изменение соглашения требует нотариального удостоверения. Если в тексте есть указание на нотариальное оформление изменений — отражай в adjustment_procedure_details.
        - Не используй "None", "null", "N/A", "-", "undefined" или пустые строки.
        </context_rules>

        <edge_cases>
        1. Детальная оговорка с перечнем оснований и двухступенчатым порядком: adjustment_clause_status = "defined", procedure = "both", grounds = "defined".
        2. Оговорки нет вообще: adjustment_clause_status = "statutory_default", procedure = "statutory_default", grounds = "not_defined" — это НЕ дефект (п. 3 ст. 101 СК РФ).
        3. Оговорка упоминает только судебный порядок без оснований: adjustment_clause_status = "defined", procedure = "court", grounds_status = "not_defined".
        4. Указание на нотариальное оформление изменений (п. 2 ст. 101 СК РФ): отражай в adjustment_procedure_details, procedure_code = "negotiation" или "both".
        </edge_cases>

        <output_expectations>
        Верни строго JSON с 6 ключами (5 полей + evidence).
        Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "adjustment_mechanism_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по изменению соглашения при существенном изменении обстоятельств. Внутреннее агрегатное signal-поле."
          required: true
        - name: "adjustment_clause_status"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Механизм изменения"
          allowed_values: ["defined", "statutory_default", "not_applicable", "not_defined"]
          description: "Наличие оговорки о механизме изменения: оговорка / дефолт ст. 101 СК РФ / не применимо."
          required: true
        - name: "adjustment_grounds_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус перечня оснований для пересмотра."
          required: true
        - name: "adjustment_grounds_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Основания изменения"
          description: "Перечень оснований для изменения размера алиментов."
          required: false
        - name: "adjustment_procedure_code"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Порядок изменения"
          allowed_values: ["negotiation", "court", "both", "statutory_default", "not_defined"]
          description: "Порядок изменения: переговоры / суд / оба / дефолт ст. 101 СК РФ."
          required: false
        - name: "adjustment_procedure_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          display_priority: 5
          label: "Детали порядка изменения"
          description: "Текстовая детализация порядка изменения и досудебных процедур."
          required: false
      store_payload: true

  - id: penalty_for_delay_check
    name: "Неустойка за просрочку и убытки сверх неустойки (ст. 115 СК РФ)"
    description: >
      Фактографическая проверка неустойки за просрочку уплаты алиментов и права
      на убытки сверх неустойки. По п. 2 ст. 115 СК РФ при образовании
      задолженности по вине плательщика взыскивается неустойка в размере 0,1 %
      от суммы задолженности за каждый день просрочки; получатель вправе также
      требовать возмещения убытков в полной сумме сверх неустойки. Соглашение
      может установить иной (в т.ч. больший или меньший) размер неустойки,
      но её отсутствие не отменяет дефолт закона.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 71

    rules:
      keywords:
        - "неустойка"
        - "пеня"
        - "за просрочку"
        - "за каждый день просрочки"
        - "0,1%"
        - "ст. 115 СК РФ"
        - "убытки сверх неустойки"
        - "возмещение убытков"
        - "ответственность за просрочку"
        - "просрочка уплаты алиментов"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)неустойк(а|у|и)\\s+(за\\s+)?просрочк"
        - "(?i)\\d[,.]\\d+\\s*%\\s*(за\\s+)?(каждый\\s+)?день"
        - "(?i)убытк[а-яё]+\\s+(сверх|в\\s+полной\\s+сумме)"
        - "(?i)ответственност[а-яё]+\\s+за\\s+просрочк"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по семейному праву.
        Анализируется соглашение об уплате алиментов (ст. 115 СК РФ).
        Проверяется только один вопрос: неустойка за просрочку и право
        на убытки сверх неустойки.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте соглашения.
        - Не оценивай серьёзность риска.
        - По п. 2 ст. 115 СК РФ при образовании задолженности по вине плательщика
          взыскивается неустойка 0,1 % от суммы задолженности за каждый день
          просрочки. Получатель также вправе требовать возмещения убытков
          в полной сумме сверх неустойки. Это дефолт закона — отсутствие
          оговорки его не отменяет.
        - Соглашение может установить иной (в т.ч. больший или меньший) размер
          неустойки или иной порядок её начисления.
        [ЗАДАЧА]
        Найди в тексте соглашения:
        1. Наличие неустойки за просрочку.
        2. Размер неустойки.
        3. Тип неустойки (за день / за месяц / фиксированная / иной).
        4. Наличие права на убытки сверх неустойки.
        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если данные не указаны прямо — возвращай "not_defined" (для status)
           или "Данные не определены" (для value-полей).
        3. penalty_type:
           * "per_day" — за каждый день просрочки;
           * "per_month" — за каждый месяц;
           * "fixed" — фиксированная сумма;
           * "other" — иной прямо названный тип;
           * "statutory_default" — оговорки нет; применяется 0,1 % в день
             по п. 2 ст. 115 СК РФ;
           * "not_defined" — неопределимо.
        4. additional_damages_regime:
           * "provided" — в тексте прямо установлено право на убытки
             сверх неустойки;
           * "waived" — право на убытки сверх неустойки прямо ограничено
             или исключено;
           * "statutory_default" — не указано; применяется п. 2 ст. 115 СК РФ;
           * "not_defined" — неопределимо.
        5. Не используй "None", "null", "N/A", "-", "undefined" или пустые строки.
        6. В evidence включай только текст соглашения.
        7. Верни РОВНО один валидный JSON-объект со всеми 7 ключами, пригодный
           для парсинга через json.loads без предварительной обработки. Без markdown,
           без ```json, без комментариев, без текста до или после. Начни ответ
           сразу с { и закончи }.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — неустойка установлена в тексте:
        Фрагмент:
        "За просрочку уплаты алиментов Плательщик уплачивает неустойку в размере
        0,1% от неуплаченной суммы за каждый день просрочки. Получатель вправе
        требовать возмещения убытков в полной сумме сверх неустойки."
        Ответ:
        {
          "penalty_clause_status": "defined",
          "penalty_rate_status": "defined",
          "penalty_rate_details": "0,1% от неуплаченной суммы за каждый день просрочки",
          "penalty_type": "per_day",
          "additional_damages_regime": "provided",
          "additional_damages_details": "право на возмещение убытков в полной сумме сверх неустойки",
          "evidence": [
            {
              "clause_ref": "п. 4.1",
              "quote": "За просрочку уплаты алиментов Плательщик уплачивает неустойку в размере 0,1% от неуплаченной суммы за каждый день просрочки. Получатель вправе требовать возмещения убытков в полной сумме сверх неустойки."
            }
          ]
        }
        Пример 2 — оговорки нет, применяется дефолт п. 2 ст. 115 СК РФ:
        Фрагмент:
        "Алименты уплачиваются в размере 20 000 рублей ежемесячно не позднее
        10-го числа каждого месяца."
        Ответ:
        {
          "penalty_clause_status": "not_defined",
          "penalty_rate_status": "not_defined",
          "penalty_rate_details": "Данные не определены",
          "penalty_type": "statutory_default",
          "additional_damages_regime": "statutory_default",
          "additional_damages_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 2.1",
              "quote": "Алименты уплачиваются в размере 20 000 рублей ежемесячно не позднее 10-го числа каждого месяца."
            }
          ]
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Проверь, что все 7 ключей (6 полей + evidence) присутствуют в JSON.
        2. Найди прямую цитату о неустойке.
        3. Найди прямую цитату о размере неустойки.
        4. Найди прямую цитату о убытках сверх неустойки.
        5. Если прямой цитаты нет — верни "statutory_default" или "not_defined".
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "penalty_clause_status": "<defined / not_defined>",
          "penalty_rate_status": "<defined / not_defined>",
          "penalty_rate_details": "<размер или 'Данные не определены'>",
          "penalty_type": "<per_day / per_month / fixed / other / statutory_default / not_defined>",
          "additional_damages_regime": "<provided / waived / statutory_default / not_defined>",
          "additional_damages_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 650

    retrieval:
      retrieval_profile: "liability_cap_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "неустойка пеня за просрочку за каждый день просрочки 0,1% убытки сверх неустойки возмещение убытков ответственность за просрочку уплаты алиментов"
      preferred_unit_types:
        - liability_provision
        - obligation
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - remedies
        - obligations
      negative_keywords:
        - "нотариус"
        - "индексация"
        - "зачёт расходов"
        - "переплата"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.35, 0.80]
        boost: 0.30
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "remedies"
        - "obligations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 550

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 800
      presence_signal:
        field: "penalty_for_delay_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по семейному праву. Извлеки из соглашения об уплате
        алиментов неустойку за просрочку и право на убытки сверх неустойки.
        Не анализируй размер алиментов, порядок выплаты, зачёт расходов
        или прекращение.
        </role>

        <context>
        {context}
        </context>

        <task>
        0. penalty_for_delay_check_presence:
           Агрегатное signal-поле — наличие регулирования по неустойке за просрочку.
           - "present" — если хотя бы одно из содержательных полей (penalty_clause_status, penalty_type, additional_damages_regime) ≠ "not_defined";
           - "missing" — если все три содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме неустойки есть, но из-за противоречий вывод невозможен.

           Если presence = "missing":
           - penalty_clause_status = "not_defined";
           - penalty_rate_status = "not_defined";
           - penalty_rate_details = "Данные не определены";
           - penalty_type = "not_defined";
           - additional_damages_regime = "not_defined";
           - additional_damages_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. penalty_clause_status — "defined" если оговорка о неустойке есть в тексте, иначе "not_defined".
        2. penalty_rate_status — "defined" если размер неустойки указан, иначе "not_defined".
        3. penalty_rate_details — конкретный размер или "Данные не определены".
        4. penalty_type — per_day / per_month / fixed / other / statutory_default / not_defined.
        5. additional_damages_regime — provided / waived / statutory_default / not_defined.
        6. additional_damages_details — условия о убытках или "Данные не определены".
        </task>

        <context_rules>
        - Используй только текст соглашения.
        - penalty_type: "за каждый день" = "per_day"; "за каждый месяц" = "per_month"; "фиксированная сумма" = "fixed"; иной прямо названный = "other"; оговорки нет, применяется дефолт п. 2 ст. 115 СК РФ (0,1% в день) = "statutory_default"; неопределимо = "not_defined".
        - additional_damages_regime: "provided" — право на убытки сверх неустойки прямо установлено; "waived" — прямо ограничено или исключено; "statutory_default" — не указано, применяется п. 2 ст. 115 СК РФ; "not_defined" — неопределимо.
        - Если penalty_clause_status = "not_defined" и в тексте нет упоминания неустойки, ставь penalty_type = "statutory_default" и additional_damages_regime = "statutory_default" (дефолт закона работает независимо от оговорки).
        - Не используй "None", "null", "N/A", "-", "undefined" или пустые строки.
        </context_rules>

        <edge_cases>
        1. Неустойка в размере, отличном от 0,1% (например, 0,05% или 0,5% в день): penalty_type = "per_day", rate = defined — соглашение вправе установить иной размер.
        2. Оговорки о неустойке нет вообще: penalty_clause_status = "not_defined", penalty_type = "statutory_default", additional_damages_regime = "statutory_default" — дефолт п. 2 ст. 115 СК РФ.
        3. Неустойка + явный отказ от убытков сверх неё: additional_damages_regime = "waived" — допустимо по соглашению.
        4. Фиксированная неустойка (например, 5 000 руб. за каждый факт просрочки): penalty_type = "fixed", rate = defined.
        </edge_cases>

        <output_expectations>
        Верни строго JSON с 7 ключами (6 полей + evidence).
        Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "penalty_for_delay_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по неустойке за просрочку и убыткам сверх неустойки. Внутреннее агрегатное signal-поле."
          required: true
        - name: "penalty_clause_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус наличия оговорки о неустойке в тексте."
          required: true
        - name: "penalty_rate_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания размера неустойки."
          required: true
        - name: "penalty_rate_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Размер неустойки"
          description: "Размер неустойки за просрочку."
          required: false
        - name: "penalty_type"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Тип неустойки"
          allowed_values: ["per_day", "per_month", "fixed", "other", "statutory_default", "not_defined"]
          description: "Тип неустойки: за день / за месяц / фиксированная / дефолт ст. 115 СК РФ."
          required: false
        - name: "additional_damages_regime"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Убытки сверх неустойки"
          allowed_values: ["provided", "waived", "statutory_default", "not_defined"]
          description: "Право на убытки сверх неустойки: установлено / ограничено / дефолт п. 2 ст. 115 СК РФ."
          required: false
        - name: "additional_damages_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          display_priority: 6
          label: "Детали убытков"
          description: "Условия о убытках сверх неустойки."
          required: false
      store_payload: true

  - id: offset_and_overpayment_check
    name: "Зачёт дополнительных расходов и переплаты (ст. 86, 104 СК РФ)"
    description: >
      Фактографическая проверка условий о зачёте дополнительных расходов
      на ребёнка и о зачёте переплаты по алиментам. По ст. 86 СК РФ
      дополнительные расходы (при исключительных обстоятельствах: тяжёлая
      болезнь, увечье, необходимость оплаты постороннего ухода) могут быть
      взысканы через суд, если не установлен иной порядок соглашением.
      Зачёт переплаты в счёт будущих платежей — договорный механизм;
      по умолчанию не предусмотрен.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "medium"
    severity_if_pass: "pass"
    severity_if_fail: "medium"
    severity_if_unclear: "low"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 72

    rules:
      keywords:
