      llm_max_tokens: 900
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по семейному праву. Извлеки из соглашения об уплате
        алиментов информацию о влиянии банкротства сторон на алиментные
        обязательства и приоритете алиментных требований (ФЗ №127-ФЗ,
        ст. 101 ФЗ №229-ФЗ).
        Не анализируй размер алиментов, порядок выплаты или прекращение.
        </role>

        <context>
        {context}
        </context>

        <task>
        0. Сначала определи bankruptcy_effects_check_presence:
           - "present" — в тексте есть фрагменты о банкротстве, несостоятельности,
             конкурсной массе, приоритете алиментных требований или защите
             от взыскания при банкротстве;
           - "missing" — таких фрагментов в тексте нет вообще;
           - "unclear" — есть косвенные упоминания (например, общие оговорки
             о форс-мажоре), но однозначно определить наличие регулирования
             невозможно.
           Если presence = "missing", заполни все status-поля как
           "statutory_default", все details-поля как "Данные не определены"
           и переходи к evidence.

        1. payer_bankruptcy_protection_status — "defined" / "statutory_default"
           / "not_defined".
        2. payer_bankruptcy_protection_details — условия на случай банкротства
           плательщика.
        3. payee_bankruptcy_protection_status — "defined" / "statutory_default"
           / "not_defined".
        4. payee_bankruptcy_protection_details — защита алиментов от конкурсной
           массы.
        5. priority_in_bankruptcy_status — "defined" / "statutory_default"
           / "not_defined".
        6. priority_in_bankruptcy_details — приоритет алиментных требований.
        7. evidence — список цитат из соглашения.
        </task>

        <context_rules>
        - Если в тексте нет фрагментов о банкротстве — presence = "missing",
          все status = "statutory_default" (законный режим действует
          автоматически).
        - По п. 2 ст. 213.27 ФЗ №127-ФЗ текущие алиментные платежи при
          банкротстве плательщика удовлетворяются вне очереди; задолженность
          за периоды до возбуждения дела — в первую очередь реестра
          (п. 3 ст. 137 ФЗ №127-ФЗ).
        - При банкротстве получателя алименты, используемые на содержание,
          не входят в конкурсную массу.
        - Если в тексте прямо установлена оговорка о банкротстве —
          status = "defined". Если оговорки нет, но законный режим применим —
          status = "statutory_default".
        - Не используй "None", "null", "N/A", "-", "undefined" или пустые строки.
        - В evidence включай только прямые цитаты из текста соглашения.
        </context_rules>

        <edge_cases>
        - Если в тексте есть оговорка о банкротстве только плательщика, но не
          получателя — payer_bankruptcy_protection_status = "defined",
          payee_bankruptcy_protection_status = "statutory_default".
        - Если в тексте есть общая оговорка о форс-мажоре (стихийные бедствия,
          военные действия) без прямого упоминания банкротства —
          presence = "unclear", все status = "statutory_default"
          (форс-мажор ≠ банкротство).
        - Если в тексте прямо указан приоритет алиментных требований в реестре
          кредиторов — priority_in_bankruptcy_status = "defined",
          presence = "present".
        - Если текст содержит только стандартные условия об оплате без
          каких-либо оговорок о банкротстве — presence = "missing",
          все status = "statutory_default".
        </edge_cases>

        <output_expectations>
        Верни строго валидный JSON-объект с 8 ключами (7 полей + evidence).
        Не добавляй пояснений, markdown-обёрток или комментариев.
        Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

