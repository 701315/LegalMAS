      llm_max_tokens: 800                                                      # ← FIX: +100 под расширенные способы
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по семейному праву. Извлеки из соглашения об уплате
        алиментов порядок, сроки, способ выплаты и подтверждение оплаты.
        Не анализируй размер алиментов, индексацию или прекращение.
        </role>
        <context>
        {context}
        </context>
        <task>
        Заполни строго следующие 7 полей + evidence (всего 8 ключей):          # ← FIX: counter sync
        1. payment_deadline_status — "defined" или "not_defined".
        2. payment_deadline_details — конкретная дата платежа.
        3. payment_method_status — "defined" или "not_defined".
        4. payment_method_code — bank_transfer / cash / postal / payroll_deduction / other / not_defined.
        5. payment_method_details — способ перечисления и реквизиты.
        6. payment_confirmation_status — "defined" или "not_defined".
        7. payment_confirmation_details — порядок подтверждения оплаты.
        8. evidence — список цитат из соглашения.
        Если данные отсутствуют в тексте:
        - статус = "not_defined"
        - текстовое поле = "Данные не определены"
        </task>
        <rules>
        - Используй только текст соглашения.
        - payment_method_code:
          * "перечисление на счёт" = "bank_transfer";
          * "наличными" = "cash";
          * "почтовый перевод" = "postal";
          * "удержание из заработной платы по месту работы" = "payroll_deduction"
            (ст. 109 СК РФ);
          * иной прямо названный способ = "other";
          * не указан = "not_defined".
        - Если способ — bank_transfer, в payment_method_details приводи реквизиты
          (номер счёта, банк) и способ подтверждения (платёжное поручение, выписка).
        - Если способ — cash, в payment_confirmation_details отражай способ
          подтверждения (расписка, квитанция); отсутствие подтверждения — риск
          спора «оплатил / не оплатил».                                        # ← FIX: правовая специфика
        - Верни РОВНО один валидный JSON-объект со всеми 8 ключами, пригодный
          для парсинга через json.loads без предварительной обработки. Без markdown,
          без ```json, без комментариев, без текста до или после. Начни ответ
          сразу с { и закончи }.                                                   # ← FIX: канон
        </rules>

      fields:
