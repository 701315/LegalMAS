          "arrears_calculation_details": "Данные не определены",
          "statutory_limit_3y_status": "statutory_default",
          "statutory_limit_3y_details": "Данные не определены",
          "indexation_of_arrears_status": "statutory_default",
          "indexation_of_arrears_details": "Данные не определены",
          "enforcement_procedure_status": "not_defined",
          "evidence": [
            {
              "clause_ref": "п. 2.1",
              "quote": "Алименты уплачиваются в размере 20 000 рублей ежемесячно не позднее 10-го числа каждого месяца."
            }
          ]
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Проверь, что все 8 ключей (7 полей + evidence) присутствуют в JSON.
        2. Найди прямую цитату о задолженности.
