        Фрагмент:
        "Плательщик обязуется уплачивать алименты."
        Ответ:
        {
          "amount_type": "not_defined",
          "amount_value_status": "not_defined",
          "amount_value_details": "Данные не определены",
          "payment_frequency_status": "not_defined",
          "payment_frequency_details": "Данные не определены",
          "number_of_children_status": "not_defined",
          "number_of_children_value": "Данные не определены",
          "evidence": []
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату с размером алиментов.
        2. Определи способ определения размера.
