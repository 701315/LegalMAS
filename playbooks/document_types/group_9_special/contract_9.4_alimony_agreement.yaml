      - "(?i)существенн[оа]е\\s+изменени[ея]"
      - "(?i)изменени[ея]\\s+материальн[оа]го\\s+положени[яя]"
      - "(?i)потер[яя]\\s+работ[ыы]"
      - "(?i)снижени[ея]\\s+доход[оо]в"
      - "(?i)рождени[ея]\\s+друг[оа]го\\s+реб[её]нк[аа]"
      - "(?i)инвалидност[ьи]\\s+плательщик[аа]"
      - "(?i)ст\\.\\s*101\\s*СК\\s*РФ"

  multiple_children:
    any_keywords:
      - "(?i)двое\\s+дет[ее]й"
      - "(?i)трое\\s+дет[ее]й"
      - "(?i)на\\s+каждого\\s+реб[её]нк[аа]"
      - "(?i)1/3\\s+на\\s+двоих"
      - "(?i)1/2\\s+на\\s+троих"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 3: SHARED PATTERNS
#  Читается: DocTypeCheckLoader через _resolve_yaml_templates()
# ════════════════════════════════════════════════════════════════════════════

shared_patterns:
  money_amount: "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|тыс|млн)"
  date_pattern: "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"
  fraction_pattern: "(?i)\\b(1/[234]|одн[а-яё]+\\s+(четверт|трет|половин))"
  passport_data: "(?i)паспорт\\s+серия\\s+\\d{4}\\s+№?\\s*\\d{6}"
  article_sk_ref: "(?i)ст\\.?\\s*\\d+\\s*СК\\s*РФ"

compliance_rules: []

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: CHECKS_V8 — единственный рабочий слой юридического анализа
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  - id: parties_and_beneficiary_check
    name: "Стороны соглашения, выгодоприобретатель и основание алиментной обязанности"
    description: >
      Фактографическая проверка идентификации плательщика, получателя (или его
      законного представителя), лица, на содержание которого уплачиваются алименты,
      и основания алиментной обязанности (родительство, брак, семейные отношения).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 10

    rules:
      keywords:
        - "плательщик"
        - "получатель"
        - "законный представитель"
        - "родитель"
        - "опекун"
        - "попечитель"
        - "ребёнок"
        - "ребенок"
        - "супруг"
        - "супруга"
        - "бывший супруг"
        - "на содержание"
        - "паспорт"
        - "дата рождения"
        - "свидетельство о рождении"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(плательщик|получатель)\\s+алимент"
        - "(?i)на\\s+содержание\\s+(несовершеннолетн|ребёнк|ребенк|супруг|родител)"
        - "(?i)паспорт\\s+серия\\s+\\d{4}\\s+№?\\s*\\d{6}"
        - "(?i)законн(ый|ого|ым)\\s+представител"
        - "(?i)свидетельств(о|а)\\s+о\\s+рождении"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по семейному праву.
        Анализируется соглашение об уплате алиментов (Глава 16 СК РФ, ст. 99).
        Проверяется только один вопрос: идентификация сторон соглашения,
        выгодоприобретателя и основания алиментной обязанности.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте соглашения.
        - Не оценивай серьёзность риска.
        [ЗАДАЧА]
        Найди в тексте соглашения:
        1. ФИО и данные плательщика алиментов.
        2. Роль плательщика (родитель / супруг / бывший супруг / совершеннолетний ребёнок / иной член семьи / иное).
        3. ФИО получателя или его законного представителя.
        4. Роль получателя/представителя.
        5. ФИО лица, на содержание которого уплачиваются алименты (выгодоприобретатель).
        6. Категория выгодоприобретателя.
        7. Дата рождения выгодоприобретателя.
        8. Основание алиментной обязанности (родительство / брак / семейные отношения).
        [ПРАВИЛА]
        1. Используй только текст документа; ничего не додумывай.
        2. Если данные не указаны прямо — возвращай "not_defined" (для status / role / type)
           или "Данные не определены" (для value-полей).
        3. Если значение определяется через отсылку к иному документу (свидетельство
           о рождении, паспорт, решение суда) — это валидный факт, фиксируй как
           "defined" и приводи ссылку в value.
        4. При частичном заполнении: status = "defined", в value фиксируй то,
           что есть, с пометкой о недостающем.
        5. Не используй "None", "null", "N/A", "-", "undefined" или пустые строки.
        6. В evidence включай только текст соглашения.
        7. Верни РОВНО один валидный JSON-объект со всеми 11 ключами, пригодный
           для парсинга через json.loads без предварительной обработки. Без markdown,
           без ```json, без комментариев, без текста до или после. Начни ответ
           сразу с { и закончи }.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — стороны определены полностью:
        Фрагмент:
        "Иванов Иван Иванович, паспорт серия 45 00 № 123456, именуемый «Плательщик»,
        обязуется уплачивать алименты на содержание несовершеннолетнего сына —
        Иванова Петра Ивановича, 15.03.2015 года рождения, в пользу Ивановой Марии
        Сергеевны (мать, законный представитель), действующей на основании
        свидетельства о рождении серия II-АА № 654321."
        Ответ:
        {
          "payer_name_status": "defined",
          "payer_name_value": "Иванов Иван Иванович, паспорт серия 45 00 № 123456",
          "payer_role": "parent",
          "recipient_name_status": "defined",
          "recipient_name_value": "Иванова Мария Сергеевна (мать, законный представитель)",
          "recipient_role": "parent_representative",
          "beneficiary_name_status": "defined",
          "beneficiary_name_value": "Иванов Пётр Иванович, 15.03.2015 г.р.",
          "beneficiary_type": "minor_child",
          "basis_of_obligation": "parentage",
          "evidence": [
            {
              "clause_ref": "преамбула",
              "quote": "Иванов Иван Иванович, паспорт серия 45 00 № 123456, именуемый «Плательщик», обязуется уплачивать алименты на содержание несовершеннолетнего сына — Иванова Петра Ивановича..."
            }
          ]
        }
        Пример 2 — частичное заполнение и отсылка к документу:
        Фрагмент:
        "Плательщик — Петров Сергей Иванович, отец. Получатель — Петров Иван
        Сергеевич, инвалид II группы, совершеннолетний, действует самостоятельно.
        Дата рождения получателя указана в приложенной копии паспорта."
        Ответ:
        {
          "payer_name_status": "defined",
          "payer_name_value": "Петров Сергей Иванович",
          "payer_role": "parent",
          "recipient_name_status": "defined",
          "recipient_name_value": "Петров Иван Сергеевич, инвалид II группы, совершеннолетний (дата рождения — согласно копии паспорта)",
          "recipient_role": "adult_child",
          "beneficiary_name_status": "defined",
          "beneficiary_name_value": "Петров Иван Сергеевич (дата рождения не указана в тексте, отсылка к копии паспорта)",
          "beneficiary_type": "adult_disabled_child",
          "basis_of_obligation": "parentage",
          "evidence": [
            {
              "clause_ref": "преамбула",
              "quote": "Плательщик — Петров Сергей Иванович, отец. Получатель — Петров Иван Сергеевич, инвалид II группы, совершеннолетний..."
            }
          ]
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Проверь, что все 11 ключей (10 полей + evidence) присутствуют в JSON.
        2. Найди прямую цитату с ФИО плательщика.
        3. Найди прямую цитату с ФИО получателя/представителя.
        4. Найди прямую цитату с ФИО выгодоприобретателя и датой рождения (или отсылкой).
        5. Определи основание обязанности по тексту (родительство / брак / семейные отношения).
        6. Если прямой цитаты нет — верни "not_defined". Не додумывай.
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "payer_name_status": "<defined / not_defined>",
          "payer_name_value": "<ФИО и данные или 'Данные не определены'>",
          "payer_role": "<parent / spouse / ex_spouse / adult_child / other_family_member / other / not_defined>",
          "recipient_name_status": "<defined / not_defined>",
          "recipient_name_value": "<ФИО или 'Данные не определены'>",
          "recipient_role": "<parent_representative / parent / spouse / adult_child / guardian / trustee / other / not_defined>",
          "beneficiary_name_status": "<defined / not_defined>",
          "beneficiary_name_value": "<ФИО и дата рождения или 'Данные не определены'>",
          "beneficiary_type": "<minor_child / adult_disabled_child / spouse / ex_spouse / parent / other_family_member / other / not_defined>",
          "basis_of_obligation": "<parentage / marriage / family_relationship / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 650

    retrieval:
      retrieval_profile: "party_identification_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "плательщик алиментов получатель алиментов законный представитель родитель опекун попечитель ребёнок супруг бывший супруг на содержание основание обязанности паспорт дата рождения свидетельство о рождении"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - representations
        - definitions
      negative_keywords:
        - "размер алиментов"
        - "порядок выплаты"
        - "индексация"
        - "неустойка"
        - "прекращение"
        - "изменение соглашения"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 0.20]
        boost: 0.35
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "representations"
        - "definitions"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.15

    evidence:
      required: true
      min_snippet_length: 50
      max_snippet_length: 800

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1400

      compact_output: false

      presence_signal:
        field: "parties_and_beneficiary_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по семейному праву. Твоя задача — извлечь из текста
        соглашения об уплате алиментов данные о плательщике, получателе,
        выгодоприобретателе и основании алиментной обязанности.
        Не анализируй размер алиментов, порядок выплаты, индексацию или прекращение.
        Анализируй только текст соглашения. Не оценивай риски.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. parties_and_beneficiary_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (payer_name_status, recipient_name_status, beneficiary_name_status)
             ≠ "not_defined";
           - "missing" — если все три содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - payer_name_status = "not_defined";
           - recipient_name_status = "not_defined";
           - beneficiary_name_status = "not_defined";
           - payer_role = recipient_role = beneficiary_type = "not_defined";
           - basis_of_obligation = "not_defined";
           - все *_value = "Данные не определены";
           - не выполняй остальные шаги.

        1. payer_name_status:
           - "defined" — если плательщик прямо идентифицируется по тексту (ФИО и/или паспортные данные);
           - "not_defined" — если плательщик прямо не идентифицируется.

        2. payer_name_value:
           ФИО и данные плательщика алиментов (паспортные данные, адрес, если указаны).
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        3. payer_role:
           Используй только одно из значений:
           - "parent" — родитель несовершеннолетнего/нетрудоспособного ребёнка;
           - "spouse" — супруг;
           - "ex_spouse" — бывший супруг;
           - "adult_child" — совершеннолетний ребёнок (алименты родителю);
           - "other_family_member" — иной член семьи (ст. 93–97 СК РФ);
           - "other" — иное прямо названное основание;
           - "not_defined" — роль прямо не указана.

        4. recipient_name_status:
           - "defined" — если получатель или его законный представитель прямо идентифицируется;
           - "not_defined" — если не идентифицируется.

        5. recipient_name_value:
           ФИО получателя или его законного представителя.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        6. recipient_role:
           Используй только одно из значений:
           - "parent_representative" — родитель-представитель несовершеннолетнего;
           - "parent" — родитель как получатель (ст. 87 СК РФ);
           - "spouse" — супруг;
           - "adult_child" — совершеннолетний получатель (сам за себя);
           - "guardian" — опекун за недееспособного;
           - "trustee" — попечитель за ребёнка 14–17 лет / ограниченно дееспособного;
           - "other" — иное прямо названное;
           - "not_defined" — роль прямо не указана.

        7. beneficiary_name_status:
           - "defined" — если лицо, на содержание которого уплачиваются алименты,
             прямо идентифицируется;
           - "not_defined" — если не идентифицируется.

        8. beneficiary_name_value:
           ФИО и дата рождения выгодоприобретателя.
           Если дата рождения определяется через отсылку к иному документу
           (свидетельство о рождении, паспорт) — укажи это в тексте значения.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        9. beneficiary_type:
           Используй только одно из значений:
           - "minor_child" — несовершеннолетний ребёнок (ст. 80 СК РФ);
           - "adult_disabled_child" — нетрудоспособный совершеннолетний ребёнок (ст. 85 СК РФ);
           - "spouse" — супруг (ст. 89 СК РФ);
           - "ex_spouse" — бывший супруг (ст. 90 СК РФ);
           - "parent" — родитель (ст. 87 СК РФ);
           - "other_family_member" — иной член семьи (ст. 93–97 СК РФ);
           - "other" — иная прямо названная категория;
           - "not_defined" — категория прямо не указана.

        10. basis_of_obligation:
            Используй только одно из значений:
            - "parentage" — основание родительство;
            - "marriage" — основание брак или бывший брак;
            - "family_relationship" — иные семейные отношения;
            - "not_defined" — основание прямо не указано.
        </task>

        <context_rules>
        - Перед остальными полями заполни parties_and_beneficiary_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_role / *_type = "not_defined", все *_value = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста соглашения.
        - Не смешивай сведения о плательщике, получателе и выгодоприобретателе.
        - Если значение определяется через отсылку к иному документу (свидетельство о рождении, паспорт, решение суда), это валидный факт: соответствующий *_status = "defined", в *_value приведи ссылку на документ.
        - При частичном заполнении (часть данных есть, часть отсутствует) — соответствующий *_status = "defined", в *_value укажи то, что есть, с пометкой о недостающем.
        - Приоритет ролей получателя: если действует сам ребёнок 14–17 лет с согласия попечителя — role = "trustee"; если законный представитель за недееспособного — role = "guardian"; если получатель сам родитель (ст. 87 СК РФ) — role = "parent"; если родитель-представитель несовершеннолетнего — role = "parent_representative".
        - Если в разных фрагментах указаны разные данные и конфликт нельзя разрешить по тексту: *_status = "not_defined", *_value = "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни упоминания сторон, ни выгодоприобретателя, ни основания.
           → presence = "missing";
             все *_status = "not_defined";
             все *_role / *_type / basis_of_obligation = "not_defined";
             все *_value = "Данные не определены".

        2. Частичное заполнение.
           Указан плательщик и получатель, но нет данных о выгодоприобретателе
           либо не указана дата рождения.
           → presence = "present";
             соответствующий *_status = "defined";
             в *_value фиксируется то, что есть, с пометкой о недостающем.

        3. Противоречие между фрагментами.
           В разных фрагментах указаны разные ФИО или роли для одной стороны.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             *_value = "Не удалось определить".

        4. Отсылка к иному документу.
           Дата рождения или паспортные данные определяются через свидетельство
           о рождении, паспорт или решение суда.
           → presence = "present";
             соответствующий *_status = "defined";
             *_value содержит формулировку с указанием на документ-основание.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для parties_and_beneficiary_check_presence используй только: "present", "missing", "unclear".
        - Для enum-полей *_status используй только: "defined", "not_defined".
        - Для payer_role используй только: "parent", "spouse", "ex_spouse", "adult_child", "other_family_member", "other", "not_defined".
        - Для recipient_role используй только: "parent_representative", "parent", "spouse", "adult_child", "guardian", "trustee", "other", "not_defined".
        - Для beneficiary_type используй только: "minor_child", "adult_disabled_child", "spouse", "ex_spouse", "parent", "other_family_member", "other", "not_defined".
        - Для basis_of_obligation используй только: "parentage", "marriage", "family_relationship", "not_defined".
        - Fallback при отсутствии данных: все *_value → "Данные не определены".
        - Fallback при противоречии или неоднозначности: все *_value → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "parties_and_beneficiary_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие идентификации сторон и выгодоприобретателя в соглашении. Внутреннее агрегатное signal-поле."
          required: true

        - name: "payer_name_status"
