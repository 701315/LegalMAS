      - "(?i)существенн[оа]е\\s+изменени[ея]"
      - "(?i)изменени[ея]\\s+материальн[оа]го\\s+положени[яя]"
      - "(?i)потер[яя]\\s+работ[ыы]"
      - "(?i)снижени[ея]\\s+доход[оо]в"
      - "(?i)рождени[ея]\\s+друг[оа]го\\s+реб[её]нк[аа]"
      - "(?i)инвалидност[ьи]\\s+плательщик[аа]"
      - "(?i)ст\\.\\s*101\\s*СК\\s*РФ"

  multiple_children:
    any_keywords:
      - "(?i)двое\\s+дет[ее]й"
      - "(?i)трое\\s+дет[ее]й"
      - "(?i)на\\s+каждого\\s+реб[её]нк[аа]"
      - "(?i)1/3\\s+на\\s+двоих"
      - "(?i)1/2\\s+на\\s+троих"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 3: SHARED PATTERNS
#  Читается: DocTypeCheckLoader через _resolve_yaml_templates()
# ════════════════════════════════════════════════════════════════════════════

shared_patterns:
  money_amount: "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|тыс|млн)"
  date_pattern: "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"
  fraction_pattern: "(?i)\\b(1/[234]|одн[а-яё]+\\s+(четверт|трет|половин))"
  passport_data: "(?i)паспорт\\s+серия\\s+\\d{4}\\s+№?\\s*\\d{6}"
  article_sk_ref: "(?i)ст\\.?\\s*\\d+\\s*СК\\s*РФ"

compliance_rules: []

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: CHECKS_V8 — единственный рабочий слой юридического анализа
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  - id: parties_and_beneficiary_check
    name: "Стороны соглашения, выгодоприобретатель и основание алиментной обязанности"
    description: >
      Фактографическая проверка идентификации плательщика, получателя (или его
      законного представителя), лица, на содержание которого уплачиваются алименты,
      и основания алиментной обязанности (родительство, брак, семейные отношения).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 10                                    # ← FIX: добавлено (порядок в пакете)

    rules:
      keywords:
        - "плательщик"
        - "получатель"
        - "законный представитель"
        - "родитель"
        - "опекун"
        - "попечитель"
        - "ребёнок"
        - "ребенок"
        - "супруг"
        - "супруга"
        - "бывший супруг"                                # ← FIX: расширено
        - "на содержание"
        - "паспорт"
        - "дата рождения"
        - "свидетельство о рождении"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(плательщик|получатель)\\s+алимент"
        - "(?i)на\\s+содержание\\s+(несовершеннолетн|ребёнк|ребенк|супруг|родител)"
        - "(?i)паспорт\\s+серия\\s+\\d{4}\\s+№?\\s*\\d{6}"
        - "(?i)законн(ый|ого|ым)\\s+представител"
        - "(?i)свидетельств(о|а)\\s+о\\s+рождении"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по семейному праву.
        Анализируется соглашение об уплате алиментов (Глава 16 СК РФ, ст. 99).
        Проверяется только один вопрос: идентификация сторон соглашения,
        выгодоприобретателя и основания алиментной обязанности.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте соглашения.
        - Не оценивай серьёзность риска.
        [ЗАДАЧА]
        Найди в тексте соглашения:
        1. ФИО и данные плательщика алиментов.
        2. Роль плательщика (родитель / супруг / бывший супруг / совершеннолетний ребёнок / иной член семьи / иное).
        3. ФИО получателя или его законного представителя.
        4. Роль получателя/представителя.
        5. ФИО лица, на содержание которого уплачиваются алименты (выгодоприобретатель).
        6. Категория выгодоприобретателя.
        7. Дата рождения выгодоприобретателя.
        8. Основание алиментной обязанности (родительство / брак / семейные отношения).
        [ПРАВИЛА]
        1. Используй только текст документа; ничего не додумывай.
        2. Если данные не указаны прямо — возвращай "not_defined" (для status / role / type)
           или "Данные не определены" (для value-полей).                    # ← FIX: снято противоречие
        3. Если значение определяется через отсылку к иному документу (свидетельство
           о рождении, паспорт, решение суда) — это валидный факт, фиксируй как
           "defined" и приводи ссылку в value.                              # ← FIX: 5-е состояние (отсылка)
        4. При частичном заполнении: status = "defined", в value фиксируй то,
           что есть, с пометкой о недостающем.                              # ← FIX: partial
        5. Не используй "None", "null", "N/A", "-", "undefined" или пустые строки.
                                                                           # ← FIX: канон (убран дубль not_defined)
        6. В evidence включай только текст соглашения.
        7. Верни РОВНО один валидный JSON-объект со всеми 11 ключами, пригодный
           для парсинга через json.loads без предварительной обработки. Без markdown,
           без ```json, без комментариев, без текста до или после. Начни ответ
           сразу с { и закончи }.                                           # ← FIX: канон JSON + counter N=11
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — стороны определены полностью:
        Фрагмент:
        "Иванов Иван Иванович, паспорт серия 45 00 № 123456, именуемый «Плательщик»,
        обязуется уплачивать алименты на содержание несовершеннолетнего сына —
        Иванова Петра Ивановича, 15.03.2015 года рождения, в пользу Ивановой Марии
        Сергеевны (мать, законный представитель), действующей на основании
        свидетельства о рождении серия II-АА № 654321."
        Ответ:
        {
          "payer_name_status": "defined",
          "payer_name_value": "Иванов Иван Иванович, паспорт серия 45 00 № 123456",
          "payer_role": "parent",
          "recipient_name_status": "defined",
          "recipient_name_value": "Иванова Мария Сергеевна (мать, законный представитель)",
          "recipient_role": "parent_representative",
          "beneficiary_name_status": "defined",
          "beneficiary_name_value": "Иванов Пётр Иванович, 15.03.2015 г.р.",
          "beneficiary_type": "minor_child",
          "basis_of_obligation": "parentage",
          "evidence": [
            {
              "clause_ref": "преамбула",
              "quote": "Иванов Иван Иванович, паспорт серия 45 00 № 123456, именуемый «Плательщик», обязуется уплачивать алименты на содержание несовершеннолетнего сына — Иванова Петра Ивановича..."
            }
          ]
        }
        Пример 2 — частичное заполнение и отсылка к документу:                # ← FIX: заменён стерильный пример
        Фрагмент:
        "Плательщик — Петров Сергей Иванович, отец. Получатель — Петров Иван
        Сергеевич, инвалид II группы, совершеннолетний, действует самостоятельно.
        Дата рождения получателя указана в приложенной копии паспорта."
        Ответ:
        {
          "payer_name_status": "defined",
          "payer_name_value": "Петров Сергей Иванович",
          "payer_role": "parent",
          "recipient_name_status": "defined",
          "recipient_name_value": "Петров Иван Сергеевич, инвалид II группы, совершеннолетний (дата рождения — согласно копии паспорта)",
          "recipient_role": "adult_child",
          "beneficiary_name_status": "defined",
          "beneficiary_name_value": "Петров Иван Сергеевич (дата рождения не указана в тексте, отсылка к копии паспорта)",
          "beneficiary_type": "adult_disabled_child",
          "basis_of_obligation": "parentage",
          "evidence": [
            {
              "clause_ref": "преамбула",
              "quote": "Плательщик — Петров Сергей Иванович, отец. Получатель — Петров Иван Сергеевич, инвалид II группы, совершеннолетний..."
            }
          ]
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Проверь, что все 11 ключей (10 полей + evidence) присутствуют в JSON.  # ← FIX: counter
        2. Найди прямую цитату с ФИО плательщика.
        3. Найди прямую цитату с ФИО получателя/представителя.
        4. Найди прямую цитату с ФИО выгодоприобретателя и датой рождения (или отсылкой).
        5. Определи основание обязанности по тексту (родительство / брак / семейные отношения).
        6. Если прямой цитаты нет — верни "not_defined". Не додумывай.
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "payer_name_status": "<defined / not_defined>",
          "payer_name_value": "<ФИО и данные или 'Данные не определены'>",
          "payer_role": "<parent / spouse / ex_spouse / adult_child / other_family_member / other / not_defined>",
          "recipient_name_status": "<defined / not_defined>",
          "recipient_name_value": "<ФИО или 'Данные не определены'>",
          "recipient_role": "<parent_representative / parent / spouse / adult_child / guardian / trustee / other / not_defined>",
          "beneficiary_name_status": "<defined / not_defined>",
          "beneficiary_name_value": "<ФИО и дата рождения или 'Данные не определены'>",
          "beneficiary_type": "<minor_child / adult_disabled_child / spouse / ex_spouse / parent / other_family_member / other / not_defined>",
          "basis_of_obligation": "<parentage / marriage / family_relationship / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 650

    retrieval:
      retrieval_profile: "party_identification_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "плательщик алиментов получатель алиментов законный представитель родитель опекун попечитель ребёнок супруг бывший супруг на содержание основание обязанности паспорт дата рождения свидетельство о рождении"
                                                                           # ← FIX: убраны дубли («плательщик»/«получатель» дважды), добавлен «бывший супруг»
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - representations
        - definitions
      negative_keywords:
        - "размер алиментов"
        - "порядок выплаты"
        - "индексация"
        - "неустойка"
        - "прекращение"
        - "изменение соглашения"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 0.20]
        boost: 0.35
        scope: segment
      context_k: 8                                                          # ← FIX: 6 → 8 (10 полей ≥ 5, 2/4 условия)
      max_chunks: 10                                                        # ← FIX: 8 → 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "representations"
        - "definitions"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.15

    evidence:
      required: true
      min_snippet_length: 50
      max_snippet_length: 800

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 1400
      store_payload: true                                                   # ← OK: внутри extraction
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по семейному праву. Извлеки из соглашения об уплате
        алиментов данные о плательщике, получателе, выгодоприобретателе и основании
        алиментной обязанности.
        Не анализируй размер алиментов, порядок выплаты, индексацию или прекращение.
        </role>
        <context>
        {context}
        </context>
        <task>
        Заполни строго следующие 10 полей + evidence (всего 11 ключей):    # ← FIX: counter sync
        1. payer_name_status — "defined" или "not_defined".
        2. payer_name_value — ФИО и данные плательщика.
        3. payer_role — parent / spouse / ex_spouse / adult_child / other_family_member / other / not_defined.
        4. recipient_name_status — "defined" или "not_defined".
        5. recipient_name_value — ФИО получателя или его законного представителя.
        6. recipient_role — parent_representative / parent / spouse / adult_child / guardian / trustee / other / not_defined.
        7. beneficiary_name_status — "defined" или "not_defined".
        8. beneficiary_name_value — ФИО и дата рождения выгодоприобретателя.
        9. beneficiary_type — minor_child / adult_disabled_child / spouse / ex_spouse / parent / other_family_member / other / not_defined.
        10. basis_of_obligation — parentage / marriage / family_relationship / not_defined.
        11. evidence — список цитат из соглашения.
        Если данные отсутствуют в тексте:
        - status = "not_defined"
        - текстовое поле = "Данные не определены"
        </task>
        <rules>
        - Используй только текст соглашения.
        - basis_of_obligation: "parentage" — если основание — родительство;
          "marriage" — если основание — брак или бывший брак;
          "family_relationship" — если основание — иные семейные отношения;
          "not_defined" — если основание прямо не указано.
        - Если значение определяется через отсылку к иному документу (свидетельство
          о рождении, паспорт, решение суда), фиксируй это как defined и приводи
          ссылку в value.                                                  # ← FIX: 5-е состояние
        - При частичном заполнении: status = "defined", в value фиксируй то, что
          есть, с пометкой о недостающем.                                  # ← FIX: partial
        - Приоритет ролей получателя: если действует сам ребёнок 14–17 лет с
          согласия попечителя — role = "trustee"; если законный представитель
          за недееспособного — role = "guardian"; если получатель сам родитель
          (например, по ст. 87 СК РФ) — role = "parent".                   # ← FIX: разграничение ролей
        - Верни РОВНО один валидный JSON-объект со всеми 11 ключами, пригодный
          для парсинга через json.loads без предварительной обработки. Без markdown,
          без ```json, без комментариев, без текста до или после. Начни ответ
          сразу с { и закончи }.                                           # ← FIX: канон
        </rules>

      fields:
        - name: "payer_name_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус идентификации плательщика."
          required: true
        - name: "payer_name_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Плательщик"
          description: "ФИО и данные плательщика алиментов."
          required: true
        - name: "payer_role"
          type: "string"
          presentation: "signal"
          allowed_values: ["parent", "spouse", "ex_spouse", "adult_child", "other_family_member", "other", "not_defined"]
                                                                           # ← FIX: + ex_spouse, other_family_member
          description: "Роль плательщика в алиментном обязательстве."
          required: true
        - name: "recipient_name_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус идентификации получателя/представителя."
          required: true
        - name: "recipient_name_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Получатель / представитель"
          description: "ФИО получателя или его законного представителя."
          required: true
        - name: "recipient_role"
          type: "string"
          presentation: "signal"
          allowed_values: ["parent_representative", "parent", "spouse", "adult_child", "guardian", "trustee", "other", "not_defined"]
                                                                           # ← FIX: + parent, adult_child, trustee
          description: "Роль получателя/представителя."
          required: true
        - name: "beneficiary_name_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус идентификации выгодоприобретателя."
          required: true
        - name: "beneficiary_name_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Выгодоприобретатель"
          description: "ФИО и дата рождения лица, на содержание которого уплачиваются алименты."
          required: true
        - name: "beneficiary_type"
          type: "string"
          presentation: "fact"                                             # ← FIX: signal → fact (юрист видит категорию)
          display_in_grid: true                                            # ← FIX
          display_priority: 4                                              # ← FIX
          label: "Категория выгодоприобретателя"                            # ← FIX: label обязателен для fact
          allowed_values: ["minor_child", "adult_disabled_child", "spouse", "ex_spouse", "parent", "other_family_member", "other", "not_defined"]
                                                                           # ← FIX: + ex_spouse, other_family_member
          description: "Категория выгодоприобретателя по ст. 80, 85, 87, 89, 90, 93–96 СК РФ."
          required: true
        - name: "basis_of_obligation"
          type: "string"
          presentation: "fact"                                             # ← FIX: signal → fact
          display_in_grid: true                                            # ← FIX
          display_priority: 5                                              # ← FIX
          label: "Основание обязанности"                                    # ← FIX: label обязателен для fact
          allowed_values: ["parentage", "marriage", "family_relationship", "not_defined"]
          description: "Основание алиментной обязанности."
          required: false

  - id: notarial_form_executive_force_check
    name: "Нотариальная форма и сила исполнительного листа (ст. 100 СК РФ)"
    description: >
      Фактографическая проверка наличия нотариального удостоверения соглашения
      об уплате алиментов и фиксации исполнительной силы. Без нотариальной формы
      соглашение ничтожно (ст. 165 ГК РФ). Нотариально удостоверенное соглашение
      имеет силу исполнительного листа в силу закона (п. 2 ст. 100 СК РФ) —
      независимо от того, упомянута ли эта сила в тексте.
                                                                           # ← FIX: уточнена правовая природа
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 20                                                      # ← FIX: порядок в пакете

    rules:
      keywords:
        - "нотариальное удостоверение"
        - "нотариус"
        - "удостоверено нотариусом"
        - "удостоверительная надпись"
        - "реестр нотариальных действий"
        - "реестр регистрации нотариальных действий"                       # ← FIX: официальное наименование
        - "исполнительный лист"
        - "силу исполнительного листа"
        - "исполнительный документ"
        - "служба судебных приставов"
        - "принудительное взыскание"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)удостоверен(о|а)\\s+нотариусом"
        - "(?i)нотариальн(ое|ого|ым)\\s+удостоверен"
        - "(?i)сил(у|а|ой)\\s+исполнительного\\s+листа"
        - "(?i)удостоверительн(ая|ой)\\s+надпис"                            # ← FIX: ключевой признак удостоверения
