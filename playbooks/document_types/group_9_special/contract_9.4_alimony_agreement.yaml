          display_in_grid: true
          display_priority: 1
          label: "Зачёт допрасходов"
          allowed_values: ["provided", "prohibited", "statutory_default", "not_defined"]
          description: "Режим зачёта дополнительных расходов (ст. 86 СК РФ)."
          required: true
        - name: "offset_categories_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус перечня категорий расходов."
