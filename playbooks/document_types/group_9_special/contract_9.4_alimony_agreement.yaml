  - id: paternity_and_status_dispute_check
    name: "Оспаривание отцовства/материнства и последствия для обязанности (ст. 47–52 СК РФ)"
    description: >
      Фактографическая проверка основания алиментной обязанности и рисков,
      связанных с оспариванием отцовства/материнства. По ст. 52 СК РФ оспаривание
      отцовства/материнства производится только в суде. При удовлетворении
      иска алиментная обязанность прекращается; исполненные платежи могут быть
      взысканы обратно по правилам о неосновательном обогащении (ст. 1102–1109
      ГК РФ). Для алиментов на супруга/родителя — риск не применим.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 140

    rules:
      keywords:
        - "отцовство"
        - "материнство"
        - "оспаривание отцовства"
        - "установление отцовства"
        - "признание отцовства"
        - "свидетельство о рождении"
        - "запись о родителях"
        - "орган ЗАГС"
        - "судебный порядок"
        - "неосновательное обогащение"
        - "возврат платежей"
        - "ст. 52 СК РФ"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(оспаривание|установление|признание)\\s+(отцовств|материнств)"
        - "(?i)свидетельств[а-яё]+\\s+о\\s+рождени"
        - "(?i)запис[а-яё]+\\s+(о|об)\\s+родител"
        - "(?i)неосновательн[а-яё]+\\s+обогащени"
        - "(?i)возврат[а-яё]*\\s+(исполненн|платеж|уплаченн)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по семейному праву.
        Анализируется соглашение об уплате алиментов (ст. 47–52 СК РФ,
        ст. 1102–1109 ГК РФ).
        Проверяется только один вопрос: основание алиментной обязанности
        и риски, связанные с оспариванием отцовства/материнства.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте соглашения.
        - Не оценивай серьёзность риска — фиксируй факты.
        - По ст. 52 СК РФ оспаривание отцовства/материнства возможно только
          в суде. Круг лиц: родитель, супруг, ребёнок по достижении 18 лет,
          опекун, опекун родителя, признанного недееспособным.
        - При удовлетворении иска алиментная обязанность прекращается.
          Исполненные платежи могут быть взысканы как неосновательное
          обогащение по ст. 1102–1109 ГК РФ (за некоторыми исключениями).
        - Для алиментов на супруга (бывшего супруга), родителей, других членов
          семьи риск оспаривания отцовства неприменим.
        [ЗАДАЧА]
        Найди в тексте соглашения:
        1. Основание алиментной обязанности (родительство / брак / иные
           семейные отношения).
        2. Наличие прямых ссылок на свидетельство о рождении, запись родителей.
        3. Условия о последствиях оспаривания отцовства / материнства.
        4. Условия о возврате исполненных платежей.
        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если данные не указаны прямо — возвращай "not_defined" (для status)
           или "Данные не определены" (для value-полей).
        3. paternity_basis_status:
           * "defined" — в тексте прямо указано основание (свидетельство
             о рождении, запись родителей);
           * "not_defined" — основание не указано.
        4. challenge_risk_status:
           * "low" — основание стабильно (не основано на спорном отцовстве);
           * "medium" — отцовство установлено в судебном порядке / по иным
             основаниям, потенциально оспоримым;
           * "high" — признаки оспоримости (например, отцовство признано
             добровольно без генетической экспертизы);
           * "not_applicable" — выгодоприобретатель не ребёнок плательщика;
           * "not_defined" — неопределимо.
        5. Не используй "None", "null", "N/A", "-", "undefined" или пустые строки.
        6. В evidence включай только текст соглашения.
        7. Верни РОВНО один валидный JSON-объект со всеми 7 ключами, пригодный
           для парсинга через json.loads без предварительной обработки. Без markdown,
           без ```json, без комментариев, без текста до или после. Начни ответ
           сразу с { и закончи }.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — основание указано, риск оспаривания низкий:
        Фрагмент:
        "Плательщик является отцом несовершеннолетнего ребёнка, что подтверждается
        свидетельством о рождении серия II-АА № 654321, выданным органом ЗАГС
        г. Москвы."
        Ответ:
        {
          "paternity_basis_status": "defined",
          "paternity_basis_details": "отцовство подтверждено свидетельством о рождении II-АА № 654321",
          "challenge_risk_status": "low",
          "challenge_risk_basis": "Отцовство удостоверено записью органа ЗАГС, основания оспаривания не выявлены",
          "consequences_on_termination_status": "not_defined",
          "consequences_on_termination_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "преамбула",
              "quote": "Плательщик является отцом несовершеннолетнего ребёнка, что подтверждается свидетельством о рождении серия II-АА № 654321, выданным органом ЗАГС г. Москвы."
            }
          ]
        }
        Пример 2 — риск оспаривания medium (отцовство установлено в суде):       # ← ключевой edge-case
        Фрагмент:
        "Отцовство плательщика установлено решением суда на основании заявления
        получателя. Алименты уплачиваются в размере 15 000 рублей ежемесячно."
        Ответ:
        {
          "paternity_basis_status": "defined",
          "paternity_basis_details": "отцовство установлено решением суда",
          "challenge_risk_status": "medium",
          "challenge_risk_basis": "Отцовство установлено в судебном порядке; возможно оспаривание по ст. 52 СК РФ",
          "consequences_on_termination_status": "not_defined",
          "consequences_on_termination_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "преамбула",
              "quote": "Отцовство плательщика установлено решением суда на основании заявления получателя."
            }
          ]
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Проверь, что все 7 ключей (6 полей + evidence) присутствуют в JSON.
        2. Найди прямую цитату об основании обязанности.
        3. Найди прямую цитату о последствиях оспаривания.
        4. Найди прямую цитату о возврате платежей.
        5. Если прямой цитаты нет — верни "not_defined". Не додумывай.
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "paternity_basis_status": "<defined / not_defined>",
          "paternity_basis_details": "<текст или 'Данные не определены'>",
          "challenge_risk_status": "<low / medium / high / not_applicable / not_defined>",
          "challenge_risk_basis": "<обоснование или 'Данные не определены'>",
          "consequences_on_termination_status": "<defined / not_defined>",
          "consequences_on_termination_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 700

    retrieval:
      retrieval_profile: "party_identification_check"
      corpus_scope: "primary_segment"
      levels:
