      retrieval_query: "служебное произведение служебное изобретение результат интеллектуальной деятельности исключительное право принадлежит работодателю интеллектуальная собственность ноу-хау секрет производства программное обеспечение вознаграждение за служебное произведение prior IP созданные до трудоустройства"
      preferred_unit_types:
