    name: "Дисциплинарная ответственность"
    description: >
      Фактографическая проверка видов дисциплинарных взысканий, порядка их применения
      (ст. 189–193 ТК РФ), а также выявления взысканий, не предусмотренных ТК РФ
      (штрафы, лишение премий, перевод на нижеоплачиваемую работу и т.п.).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "дисциплинарная ответственность"
        - "дисциплинарное взыскание"
        - "замечание"
        - "выговор"
        - "увольнение по соответствующим основаниям"
        - "объяснительная"
        - "приказ о взыскании"
        - "срок применения взыскания"
        - "штраф"
        - "лишение премии"
        - "снижение оклада"
        - "перевод на нижеоплачиваемую"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)дисциплинарн[а-яё]+\\s+(ответственн|взыскан)"
        - "(?i)(замечани|выговор)"
        - "(?i)лишени[ея]\\s+преми"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по трудовому праву.
        Анализируется трудовой договор.
        Проверяется только один вопрос: дисциплинарная ответственность.
        Нормативный ориентир:
        - ст. 189 ТК РФ — дисциплина труда, правила внутреннего трудового распорядка
        - ст. 192 ТК РФ — дисциплинарные взыскания (замечание, выговор,
        увольнение по соответствующим основаниям); перечень закрытый
        - ст. 193 ТК РФ — порядок применения дисциплинарных взысканий
        - ст. 194 ТК РФ — снятие дисциплинарного взыскания
        - ст. 195 ТК РФ — привлечение к дисциплинарной ответственности руководителя
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска, не подставляй нормы закона вместо текста.
        - Ст. 192 ТК РФ устанавливает ЗАКРЫТЫЙ перечень взысканий: замечание,
        выговор, увольнение. Все остальные (штрафы, лишение премий, снижение
        оклада) — не предусмотрены ТК РФ.
        [ЗАДАЧА]
        Найди в тексте договора:
        1. Перечень дисциплинарных взысканий.
        2. Порядок применения дисциплинарных взысканий.
        3. Взыскания, не предусмотренные ТК РФ (штрафы, лишение премий,
        снижение оклада, перевод на нижеоплачиваемую работу и т.п.).
        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона вместо текста.
        2. Для *_status используй строго "defined" или "not_defined".
        3. Для *_value при отсутствии данных — строго "Данные не определены".
        4. Для disciplinary_types_*: "defined" если в тексте прямо перечислены
        виды взысканий.
        5. Для disciplinary_procedure_*: "defined" если указан порядок применения
        (объяснительная, приказ, сроки).
        6. Для disciplinary_nonstandard_*: "defined" если прямо указаны взыскания,
        не предусмотренные ст. 192 ТК РФ (штрафы, лишение премий, снижение оклада,
        перевод на нижеоплачиваемую работу и т.п.). Это негативный сигнал.
        7. Если порядок применения определяется через отсылку к ПВТР / Коллективному
        договору — фиксируй как "defined" со значением «согласно <документ>».
        8. В evidence включай только текст договора.
        9. Никогда не используй "None", "null", пустые строки или отсутствующие ключи.
        10. Верни РОВНО один валидный JSON-объект со всеми 7 ключами (6 полей + evidence),
        пригодный для парсинга через json.loads без предварительной обработки.
        Без markdown, без ```json, без комментариев, без текста до или после.
        Начни ответ сразу с { и закончи }.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — стандартные взыскания + порядок:
        Фрагмент:
        "За нарушение трудовых обязанностей к работнику могут быть применены
        дисциплинарные взыскания: замечание, выговор, увольнение по соответствующим
        основаниям. До применения взыскания работодатель требует письменное
        объяснение; приказ объявляется под подпись в течение 3 рабочих дней."
        Ответ:
        {
          "disciplinary_types_status": "defined",
          "disciplinary_types_value": "замечание, выговор, увольнение по соответствующим основаниям",
          "disciplinary_procedure_status": "defined",
          "disciplinary_procedure_value": "письменное объяснение, приказ объявляется под подпись в течение 3 рабочих дней",
          "disciplinary_nonstandard_status": "not_defined",
          "disciplinary_nonstandard_value": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 7.1",
              "quote": "За нарушение трудовых обязанностей к работнику могут быть применены дисциплинарные взыскания: замечание, выговор, увольнение по соответствующим основаниям."
            }
          ]
        }
        Пример 2 — нестандартные взыскания:
        Фрагмент:
        "За опоздание на работу работник лишается премии за текущий месяц.
        За курение в неположенном месте — штраф 1000 рублей."
        Ответ:
        {
          "disciplinary_types_status": "not_defined",
          "disciplinary_types_value": "Данные не определены",
          "disciplinary_procedure_status": "not_defined",
          "disciplinary_procedure_value": "Данные не определены",
          "disciplinary_nonstandard_status": "defined",
          "disciplinary_nonstandard_value": "лишение премии за опоздание; штраф 1000 рублей за курение — не предусмотрено ст. 192 ТК РФ",
          "evidence": [
            {
