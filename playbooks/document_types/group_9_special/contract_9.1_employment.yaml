        взыскания, не предусмотренные ст. 192 ТК РФ (штрафы, лишение премий,
        снижение оклада, перевод на нижеоплачиваемую работу и т.п.).
        - Если порядок применения определяется через отсылку к ПВТР /
        Коллективному договору — фиксируй как "defined" со значением
        «согласно <документ>».
        - Верни РОВНО один валидный JSON-объект со всеми 7 ключами,
        без markdown и комментариев.
        </rules>
      fields:
        - name: "disciplinary_types_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус перечня дисциплинарных взысканий."
          required: true
        - name: "disciplinary_types_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Дисциплинарные взыскания"
          description: "Перечень дисциплинарных взысканий."
          required: false
        - name: "disciplinary_procedure_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус порядка применения взысканий."
          required: true
        - name: "disciplinary_procedure_value"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Порядок применения взысканий"
          description: "Порядок применения дисциплинарных взысканий."
          required: false
        - name: "disciplinary_nonstandard_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: >
            Статус выявления взысканий, не предусмотренных ТК РФ.
            "defined" = выявлены (негативный сигнал).
          required: true
        - name: "disciplinary_nonstandard_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Незаконные взыскания"
          description: "Взыскания, не предусмотренные ТК РФ."
          required: false

  - id: additional_guarantees_check
    name: "Дополнительные гарантии и компенсации"
    description: >
      Фактографическая проверка условий о служебных командировках, разъездном
      характере работы, использовании личного имущества работника (ст. 188 ТК РФ),
      компенсации ГСМ, связи, суточных и иных дополнительных выплат.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "служебная командировка"
        - "командировка"
        - "разъездной характер"
        - "суточные"
        - "возмещение расходов"
        - "использование личного имущества"
        - "личный автомобиль"
        - "ГСМ"
        - "топливо"
        - "мобильная связь"
        - "интернет"
        - "компенсация"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)командиров"
        - "(?i)разъездн[а-яё]+\\s+характер"
        - "(?i)личн[а-яё]+\\s+(имуществ|автомобил|транспорт)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по трудовому праву.
        Анализируется трудовой договор.
        Проверяется только один вопрос: дополнительные гарантии и компенсации.
        Нормативный ориентир:
        - ст. 164 ТК РФ — понятие гарантий и компенсаций
        - ст. 166–168 ТК РФ — служебные командировки, возмещение расходов
        - ст. 168.1 ТК РФ — разъездной характер работы
        - ст. 188 ТК РФ — возмещение расходов при использовании личного имущества
        - Постановление Правительства РФ от 13.10.2008 № 749 — командировки
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска, не подставляй нормы закона вместо текста.
        - Не выводи конкретные размеры суточных, не указанные в тексте.
        [ЗАДАЧА]
        Найди в тексте договора:
        1. Условие о служебных командировках и их оплате.
        2. Указание на разъездной характер работы.
        3. Возмещение расходов на использование личного имущества работника.
        4. Компенсация ГСМ / связи / интернета.
        5. Суточные и иные дополнительные выплаты.
        6. Иные дополнительные гарантии и компенсации.
        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона вместо текста.
        2. Для *_status используй строго "defined" или "not_defined".
        3. Для *_value при отсутствии данных — строго "Данные не определены".
        4. Если компенсация определяется через отсылку к документу (Положение
        о командировках, Приказ, Приложение) — фиксируй как "defined"
        со значением «согласно <документ>».
        5. Если прямо указано, что компенсация не предусмотрена —
        соответствующий *_status = "defined", *_value = "не предусмотрена".
        6. Различай:
        - business_trip_* — только служебные командировки (ст. 166–168 ТК РФ);
        - travel_nature_* — разъездной характер работы (ст. 168.1 ТК РФ).
        7. Различай:
        - personal_property_* — использование личного имущества работника;
        - fuel_and_communication_* — ГСМ, связь, интернет.
        8. В evidence включай только текст договора.
        9. Никогда не используй "None", "null", пустые строки или отсутствующие ключи.
        10. Верни РОВНО один валидный JSON-объект со всеми 9 ключами (8 полей + evidence),
        пригодный для парсинга через json.loads без предварительной обработки.
        Без markdown, без ```json, без комментариев, без текста до или после.
        Начни ответ сразу с { и закончи }.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — командировки + ГСМ:
        Фрагмент:
        "Служебные командировки оплачиваются в соответствии с Положением
        о командировках работодателя. Работнику компенсируются расходы на ГСМ
        при использовании личного автомобиля в служебных целях — 10 руб./км."
        Ответ:
        {
          "business_trip_status": "defined",
          "business_trip_value": "согласно Положению о командировках работодателя",
          "travel_nature_status": "not_defined",
          "travel_nature_value": "Данные не определены",
          "personal_property_status": "defined",
          "personal_property_value": "компенсация расходов при использовании личного автомобиля — 10 руб./км",
          "fuel_and_communication_status": "defined",
          "fuel_and_communication_value": "компенсация ГСМ — 10 руб./км",
          "evidence": [
            {
              "clause_ref": "п. 5.1",
              "quote": "Служебные командировки оплачиваются в соответствии с Положением о командировках работодателя."
            }
          ]
        }
        Пример 2 — разъездной характер, суточные:
        Фрагмент:
        "Работнику устанавливается разъездной характер работы. За каждый день
        работы в пути выплачиваются суточные в размере 700 рублей."
        Ответ:
        {
          "business_trip_status": "not_defined",
          "business_trip_value": "Данные не определены",
          "travel_nature_status": "defined",
          "travel_nature_value": "разъездной характер работы",
          "personal_property_status": "not_defined",
          "personal_property_value": "Данные не определены",
          "fuel_and_communication_status": "not_defined",
          "fuel_and_communication_value": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 5.2",
              "quote": "Работнику устанавливается разъездной характер работы."
            }
          ]
        }
        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Работник выполняет свои обязанности в соответствии с договором."
        Ответ:
        {
          "business_trip_status": "not_defined",
          "business_trip_value": "Данные не определены",
          "travel_nature_status": "not_defined",
          "travel_nature_value": "Данные не определены",
          "personal_property_status": "not_defined",
          "personal_property_value": "Данные не определены",
          "fuel_and_communication_status": "not_defined",
          "fuel_and_communication_value": "Данные не определены",
          "evidence": []
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Проверь, что все 9 ключей (8 полей + evidence) присутствуют в JSON.
        2. Проверь, что каждый *_status ∈ {"defined", "not_defined"}, а каждый *_value
        при отсутствии данных = "Данные не определены".
        3. Проверь, что для каждого defined-поля в evidence есть прямая цитата из договора.
        4. Убедись, что business_trip_* отражает только служебные командировки,
        а travel_nature_* — только разъездной характер работы.
        5. Убедись, что отсылки к Положению о командировках / Приказу / Приложению
        фиксированы как defined со значением «согласно <документ>».
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "business_trip_status": "<defined / not_defined>",
          "business_trip_value": "<текст / 'согласно <документ>' / 'не предусмотрены' / 'Данные не определены'>",
          "travel_nature_status": "<defined / not_defined>",
          "travel_nature_value": "<текст / 'не предусмотрен' / 'Данные не определены'>",
          "personal_property_status": "<defined / not_defined>",
          "personal_property_value": "<текст / 'согласно <документ>' / 'не предусмотрено' / 'Данные не определены'>",
          "fuel_and_communication_status": "<defined / not_defined>",
          "fuel_and_communication_value": "<текст / 'не предусмотрена' / 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 800

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "служебная командировка суточные возмещение расходов разъездной характер работы использование личного имущества работника личный автомобиль ГСМ топливо мобильная связь интернет компенсация расходов"
      preferred_unit_types:
        - obligation
        - payment_term
        - general_provision
      excluded_unit_types:
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
        - remedies
      boost_keywords:
        - "командировка"
        - "суточные"
        - "разъездной характер"
        - "личное имущество"
        - "ГСМ"
      negative_keywords:
        - "трудовая функция"
        - "место работы"
        - "оклад"
        - "отпуск"
        - "рабочее время"
        - "увольнение"
        - "расторжение"
        - "конфиденциальность"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.30, 0.75]
        boost: 0.30
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
        - "remedies"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 1200
      store_payload: true

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по трудовому праву. Извлеки из трудового договора
        сведения о дополнительных гарантиях и компенсациях.
        Не анализируй оклад, режим работы, отпуск или расторжение.
        </role>
        <context>
        {context}
        </context>
        <task>
        Заполни строго следующие 8 полей + evidence (всего 9 ключей):
        1. business_trip_status — "defined" или "not_defined".
        2. business_trip_value — условие о служебных командировках.
        3. travel_nature_status — "defined" или "not_defined".
        4. travel_nature_value — разъездной характер работы.
        5. personal_property_status — "defined" или "not_defined".
        6. personal_property_value — использование личного имущества.
        7. fuel_and_communication_status — "defined" или "not_defined".
        8. fuel_and_communication_value — компенсация ГСМ / связи / интернета.
        Если данные отсутствуют:
        - для *_status — "not_defined"
        - для *_value — "Данные не определены"
        </task>
        <rules>
        - Используй только текст договора.
        - business_trip_* — только служебные командировки (ст. 166–168 ТК РФ).
        - travel_nature_* — только разъездной характер работы (ст. 168.1 ТК РФ).
        - personal_property_* — использование личного имущества работника (ст. 188 ТК РФ).
        - fuel_and_communication_* — ГСМ, мобильная связь, интернет.
        - Если компенсация определяется через отсылку к документу (Положение,
        Приказ, Приложение) — фиксируй как "defined" со значением «согласно <документ>».
        - Если прямо указано, что компенсация не предусмотрена — status = "defined",
        value = "не предусмотрена".
        - Верни РОВНО один валидный JSON-объект со всеми 9 ключами,
        без markdown и комментариев.
        </rules>
      fields:
        - name: "business_trip_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус условия о служебных командировках."
          required: true
        - name: "business_trip_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Командировки"
          description: "Условие о служебных командировках и их оплате."
          required: false
        - name: "travel_nature_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания разъездного характера работы."
          required: true
        - name: "travel_nature_value"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Разъездной характер"
          description: "Условие о разъездном характере работы."
          required: false
        - name: "personal_property_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус условия об использовании личного имущества."
          required: true
        - name: "personal_property_value"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Использование личного имущества"
          description: "Возмещение расходов на использование личного имущества работника."
          required: false
        - name: "fuel_and_communication_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус компенсации ГСМ / связи / интернета."
          required: true
        - name: "fuel_and_communication_value"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Компенсация ГСМ / связи"
          description: "Компенсация расходов на ГСМ, мобильную связь, интернет."
          required: false

  - id: employee_category_check
    name: "Категория работника (маркер специфики)"
    description: >
      Определение категории работника (стандартная / инвалид / несовершеннолетний /
      беременная или с семейными обязанностями / совместитель / дистанционный /
      надомник / иная специфика) и выявление условий, требующих применения
      специальных норм ТК РФ.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "инвалид"
        - "инвалидность"
        - "ИПРА"
        - "несовершеннолетний"
        - "беременная"
        - "ребёнок"
        - "семейные обязанности"
        - "совместительство"
        - "по совместительству"
        - "внешний совместитель"
        - "внутренний совместитель"
        - "дистанционная работа"
        - "надомник"
        - "надомная работа"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)инвалид"
        - "(?i)несовершеннолетн"
        - "(?i)беременн"
        - "(?i)по\\s+совместительств"
        - "(?i)надомн"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по трудовому праву.
        Анализируется трудовой договор.
        Проверяется только один вопрос: категория работника и её специфика.
        Нормативный ориентир:
        - ст. 92 ТК РФ — сокращённая продолжительность рабочего времени
        (инвалиды I или II группы, несовершеннолетние, работники с вредными условиями)
        - ст. 94 ТК РФ — предельная продолжительность ежедневной работы
        - ст. 96 ТК РФ — работа в ночное время (ограничения для отдельных категорий)
        - ст. 253–264 ТК РФ — особенности регулирования труда отдельных категорий
        (женщины, лица с семейными обязанностями)
        - ст. 265–272 ТК РФ — особенности регулирования труда несовершеннолетних
        - ст. 282–288 ТК РФ — совместительство
        - ст. 310 ТК РФ — надомники
        - ст. 312.1–312.9 ТК РФ — дистанционная работа
        - ФЗ от 24.11.1995 № 181-ФЗ — социальная защита инвалидов
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска, не подставляй нормы закона вместо текста.
        - Определяй категорию по прямым указаниям в тексте, без домыслов.
        [ЗАДАЧА]
        Определи категорию работника на основании текста договора:
        1. Категория (standard / disabled / minor / pregnant_or_family /
        concurrent / remote / homeworker / other_specific).
        2. Пояснение (детали категории).
        3. Наличие специальных условий для данной категории.
        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Для *_status используй строго "defined" или "not_defined",
        если не указано иное.
        3. Для *_value при отсутствии данных — строго "Данные не определены".
        4. employee_category_status — обязательное значение из enum:
        "standard" / "disabled" / "minor" / "pregnant_or_family" / "concurrent" /
        "remote" / "homeworker" / "other_specific".
        5. Если в тексте несколько категорий (например, "инвалид + дистанционная работа"),
        выбери ПЕРВИЧНУЮ (по приоритету: minor > disabled > pregnant_or_family >
        concurrent > homeworker > remote > other_specific > standard),
        а остальные перечисли в employee_category_value.
        6. Если в тексте НЕТ прямых указаний ни на одну специфическую категорию —
        employee_category_status = "standard".
        7. special_conditions_* фиксирует наличие специальных условий для категории
        (сокращённое время, ограничения, дополнительный отпуск, оборудование
        рабочего места, ИПРА и т.п.).
        8. В evidence включай только текст договора.
        9. Никогда не используй "None", "null", пустые строки или отсутствующие ключи.
        10. Верни РОВНО один валидный JSON-объект со всеми 5 ключами (4 поля + evidence),
