        - Перед остальными полями заполни training_and_clawback_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_value = "Данные не определены".
        - Используй только текст договора.
        - training_agreement_* — только ученический договор (ст. 198–208 ТК РФ),
          не любое обучение.
        - work_off_obligation_* — обязанность отработать конкретный срок.
        - cost_reimbursement_* — порядок возмещения затрат (ст. 249 ТК РФ).
        - Если условия определяются через отсылку к документу — фиксируй как
          "defined" со значением «согласно <документ>».
        - Если прямо указано, что обучение / отработка не предусмотрены —
          status = "defined", value = "не предусмотрены".
        - Если в разных фрагментах указаны разные данные и конфликт нельзя
          разрешить по тексту — статус → "not_defined", значение → "Не удалось определить".
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни ученического договора, ни обязанности отработки,
           ни порядка возмещения затрат.
           → presence = "missing";
             все три *_status = "not_defined";
             все *_value = "Данные не определены".

        2. Указано только обучение без обязанности отработки.
           Есть условие об обучении за счёт работодателя, но нет
           обязанности отработки и порядка возмещения.
           → presence = "present";
             work_off_obligation_status = "not_defined";
             cost_reimbursement_status = "not_defined";
             соответствующие *_value = "Данные не определены".

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные сроки отработки
           или противоречащие условия возмещения.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             соответствующее *_value = "Не удалось определить".

        4. Отсылка на отдельный ученический договор / Соглашение об обучении.
           Условия обучения и отработки определяются отдельным документом.
           → presence = "present";
             training_agreement_status = "defined";
             training_agreement_value содержит формулировку вида
             «согласно Приложению № 2 (ученический договор)».
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для training_and_clawback_check_presence используй только: "present", "missing", "unclear".
        - Для всех *_status используй только: "defined" или "not_defined".
        - Fallback при отсутствии данных:
          * все *_value → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_value → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "training_and_clawback_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие условий об обучении и обязанности отработки. Внутреннее агрегатное signal-поле."
          required: true

        - name: "training_agreement_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус ученического договора. Внутреннее enum-поле."
          required: true

        - name: "training_agreement_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Ученический договор"
          description: >
            Условие об ученическом договоре. Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "work_off_obligation_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус обязанности отработки. Внутреннее enum-поле."
          required: true

        - name: "work_off_obligation_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Обязанность отработки"
          description: >
            Обязанность отработать определённый срок после обучения. Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "cost_reimbursement_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус порядка возмещения затрат. Внутреннее enum-поле."
          required: true

        - name: "cost_reimbursement_value"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Возмещение затрат на обучение"
          description: >
            Порядок возмещения затрат работодателя на обучение. Fallback: "Не установлено" / "Не удалось определить".
          required: false

      store_payload: true

  - id: disabled_employee_check
    name: "Специфика труда работника-инвалида"
    description: >
      Фактографическая проверка специальных гарантий и ограничений для работника
      с инвалидностью (ст. 92, 94, 96, 99, 113, 128, 224 ТК РФ; ФЗ-181):
      группа инвалидности, ИПРА, сокращённая продолжительность рабочего времени,
      ограничения по ночным / сверхурочным / выходным, дополнительный
      неоплачиваемый отпуск, адаптация рабочего места.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "инвалид"
        - "инвалидность"
        - "группа инвалидности"
        - "ИПРА"
        - "индивидуальная программа реабилитации"
        - "абилитация"
        - "сокращённая продолжительность"
        - "35 часов"
        - "отпуск без сохранения"
        - "60 календарных дней"
        - "адаптация рабочего места"
        - "специальное рабочее место"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)инвалид"
        - "(?i)ИПРА"
        - "(?i)\\b35\\s*час"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по трудовому праву.
        Анализируется трудовой договор с работником-инвалидом.
        Проверяется только один вопрос: специальные гарантии и ограничения
        для работника с инвалидностью.
        Нормативный ориентир:
        - ст. 92 ТК РФ — сокращённая продолжительность рабочего времени
        для инвалидов I или II группы (не более 35 часов в неделю)
        - ст. 94 ТК РФ — предельная продолжительность ежедневной работы
        - ст. 96 ТК РФ — работа в ночное время (только с письменного согласия
        и при отсутствии медицинских противопоказаний)
        - ст. 99 ТК РФ — сверхурочная работа (только с письменного согласия
        и при отсутствии медицинских противопоказаний)
        - ст. 113 ТК РФ — работа в выходные и нерабочие праздничные дни
        - ст. 128 ТК РФ — отпуск без сохранения заработной платы до 60 календарных
        дней в году для работающих инвалидов
        - ст. 224 ТК РФ — дополнительные гарантии (создание условий труда
        в соответствии с ИПРА)
        - ФЗ от 24.11.1995 № 181-ФЗ — социальная защита инвалидов
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска, не подставляй нормы закона вместо текста.
        - Не выводи группу инвалидности и ИПРА из закона — только из текста.
        [ЗАДАЧА]
        Найди в тексте договора:
        1. Группу инвалидности работника.
        2. Указание на ИПРА (индивидуальную программу реабилитации или абилитации).
        3. Сокращённую продолжительность рабочего времени.
        4. Предельную продолжительность ежедневной работы.
        5. Ограничения по работе в ночное время.
        6. Ограничения по сверхурочной работе.
        7. Дополнительный отпуск без сохранения заработной платы.
        8. Адаптацию рабочего места / специальное рабочее место.
        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона вместо текста.
        2. Для *_status используй строго "defined" или "not_defined".
        3. Для *_value при отсутствии данных — строго "Данные не определены".
        4. Не выводи группу инвалидности и ИПРА из закона — только из текста договора.
        5. disability_group_* фиксирует группу инвалидности (I, II, III).
        6. ipra_* фиксирует указание на ИПРА и её реквизиты.
        7. reduced_hours_* фиксирует сокращённую продолжительность рабочего
        времени (35 часов в неделю для I / II группы).
        8. daily_limit_* фиксирует предельную продолжительность ежедневной работы.
        9. night_work_restrictions_* фиксирует условия привлечения к ночным работам.
        10. overtime_restrictions_* фиксирует условия привлечения к сверхурочным.
        11. extra_unpaid_leave_* фиксирует дополнительный отпуск без сохранения
        заработной платы (до 60 дней в году).
        12. workplace_adaptation_* фиксирует адаптацию рабочего места / специальное
        рабочее место в соответствии с ИПРА.
        13. Если гарантия определяется через отсылку к документу (ИПРА, Приложение) —
        фиксируй как "defined" со значением «согласно <документ>».
        14. В evidence включай только текст договора.
        15. Никогда не используй "None", "null", пустые строки или отсутствующие ключи.
        16. Верни РОВНО один валидный JSON-объект со всеми 17 ключами (16 полей + evidence),
        пригодный для парсинга через json.loads без предварительной обработки.
        Без markdown, без ```json, без комментариев, без текста до или после.
        Начни ответ сразу с { и закончи }.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — полная структура:
        Фрагмент:
        "Работник является инвалидом II группы. Работнику устанавливается
        сокращённая продолжительность рабочего времени — 35 часов в неделю.
        Привлечение к сверхурочной работе и работе в ночное время допускается
        только с письменного согласия работника и при отсутствии медицинских
        противопоказаний. Работнику предоставляется отпуск без сохранения
        заработной платы до 60 календарных дней в году. Рабочее место
        оборудуется в соответствии с ИПРА."
        Ответ:
        {
          "disability_group_status": "defined",
          "disability_group_value": "II группа",
          "ipra_status": "defined",
          "ipra_value": "рабочее место оборудуется в соответствии с ИПРА",
          "reduced_hours_status": "defined",
          "reduced_hours_value": "35 часов в неделю",
          "daily_limit_status": "not_defined",
          "daily_limit_value": "Данные не определены",
          "night_work_restrictions_status": "defined",
          "night_work_restrictions_value": "только с письменного согласия и при отсутствии медицинских противопоказаний",
          "overtime_restrictions_status": "defined",
          "overtime_restrictions_value": "только с письменного согласия и при отсутствии медицинских противопоказаний",
          "extra_unpaid_leave_status": "defined",
          "extra_unpaid_leave_value": "до 60 календарных дней в году",
          "workplace_adaptation_status": "defined",
          "workplace_adaptation_value": "рабочее место оборудуется в соответствии с ИПРА",
          "evidence": [
            {
              "clause_ref": "п. 2.1",
              "quote": "Работник является инвалидом II группы."
            }
          ]
        }
        Пример 2 — только группа:
        Фрагмент:
        "Работник — инвалид III группы."
        Ответ:
        {
          "disability_group_status": "defined",
          "disability_group_value": "III группа",
          "ipra_status": "not_defined",
          "ipra_value": "Данные не определены",
          "reduced_hours_status": "not_defined",
          "reduced_hours_value": "Данные не определены",
          "daily_limit_status": "not_defined",
          "daily_limit_value": "Данные не определены",
          "night_work_restrictions_status": "not_defined",
          "night_work_restrictions_value": "Данные не определены",
          "overtime_restrictions_status": "not_defined",
          "overtime_restrictions_value": "Данные не определены",
          "extra_unpaid_leave_status": "not_defined",
          "extra_unpaid_leave_value": "Данные не определены",
          "workplace_adaptation_status": "not_defined",
          "workplace_adaptation_value": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 1.2",
              "quote": "Работник — инвалид III группы."
            }
          ]
        }
        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Работник выполняет свои обязанности в соответствии с договором."
        Ответ:
        {
          "disability_group_status": "not_defined",
          "disability_group_value": "Данные не определены",
          "ipra_status": "not_defined",
          "ipra_value": "Данные не определены",
          "reduced_hours_status": "not_defined",
          "reduced_hours_value": "Данные не определены",
          "daily_limit_status": "not_defined",
          "daily_limit_value": "Данные не определены",
          "night_work_restrictions_status": "not_defined",
          "night_work_restrictions_value": "Данные не определены",
          "overtime_restrictions_status": "not_defined",
          "overtime_restrictions_value": "Данные не определены",
          "extra_unpaid_leave_status": "not_defined",
          "extra_unpaid_leave_value": "Данные не определены",
          "workplace_adaptation_status": "not_defined",
          "workplace_adaptation_value": "Данные не определены",
          "evidence": []
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Проверь, что все 17 ключей (16 полей + evidence) присутствуют в JSON.
        2. Проверь, что каждый *_status ∈ {"defined", "not_defined"}, а каждый *_value
        при отсутствии данных = "Данные не определены".
        3. Проверь, что для каждого defined-поля в evidence есть прямая цитата из договора.
        4. Убедись, что группа инвалидности и ИПРА не выведены из закона —
        только из текста.
        5. Убедись, что ограничения на ночные / сверхурочные отражают именно то,
        что написано в тексте (письменное согласие, медпротивопоказания).
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "disability_group_status": "<defined / not_defined>",
          "disability_group_value": "<группа / 'Данные не определены'>",
          "ipra_status": "<defined / not_defined>",
          "ipra_value": "<текст / 'согласно <документ>' / 'Данные не определены'>",
          "reduced_hours_status": "<defined / not_defined>",
          "reduced_hours_value": "<часов в неделю / 'Данные не определены'>",
          "daily_limit_status": "<defined / not_defined>",
          "daily_limit_value": "<часов в день / 'Данные не определены'>",
          "night_work_restrictions_status": "<defined / not_defined>",
          "night_work_restrictions_value": "<текст / 'Данные не определены'>",
          "overtime_restrictions_status": "<defined / not_defined>",
          "overtime_restrictions_value": "<текст / 'Данные не определены'>",
          "extra_unpaid_leave_status": "<defined / not_defined>",
          "extra_unpaid_leave_value": "<дней / 'Данные не определены'>",
          "workplace_adaptation_status": "<defined / not_defined>",
          "workplace_adaptation_value": "<текст / 'согласно <документ>' / 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 7
      temperature: 0.0
      max_tokens: 950

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "инвалид инвалидность группа инвалидности ИПРА индивидуальная программа реабилитации абилитации сокращённая продолжительность 35 часов предельная продолжительность ежедневной работы ночное время сверхурочная работа отпуск без сохранения заработной платы 60 дней адаптация рабочего места специальное рабочее место"
      preferred_unit_types:
        - obligation
        - general_provision
        - definition
      excluded_unit_types:
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - limitations
        - definitions
      boost_keywords:
        - "инвалид"
        - "группа инвалидности"
        - "ИПРА"
        - "35 часов"
        - "сокращённая продолжительность"
      negative_keywords:
        - "трудовая функция"
        - "место работы"
        - "оклад"
        - "заработная плата"
        - "увольнение"
        - "расторжение"
        - "конфиденциальность"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.10, 0.50]
        boost: 0.20
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "limitations"
        - "definitions"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1500

      compact_output: false

      presence_signal:
        field: "disabled_employee_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по трудовому праву. Извлеки из трудового договора
        сведения о специальных гарантиях и ограничениях для работника-инвалида.
        Не анализируй оплату труда, режим работы, отпуск или расторжение.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 16 полей + evidence (всего 17 ключей):

        0. disabled_employee_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (disability_group_status, ipra_status, reduced_hours_status,
              daily_limit_status, night_work_restrictions_status,
              overtime_restrictions_status, extra_unpaid_leave_status,
              workplace_adaptation_status) ≠ "not_defined";
           - "missing" — если все восемь содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - все восемь *_status = "not_defined";
           - все *_value = "Данные не определены";
           - не выполняй остальные шаги.

        1. disability_group_status — "defined" или "not_defined".
        2. disability_group_value — группа инвалидности.
        3. ipra_status — "defined" или "not_defined".
        4. ipra_value — указание на ИПРА.
        5. reduced_hours_status — "defined" или "not_defined".
        6. reduced_hours_value — сокращённая продолжительность рабочего времени.
        7. daily_limit_status — "defined" или "not_defined".
        8. daily_limit_value — предельная продолжительность ежедневной работы.
        9. night_work_restrictions_status — "defined" или "not_defined".
        10. night_work_restrictions_value — ограничения по работе в ночное время.
        11. overtime_restrictions_status — "defined" или "not_defined".
        12. overtime_restrictions_value — ограничения по сверхурочной работе.
        13. extra_unpaid_leave_status — "defined" или "not_defined".
        14. extra_unpaid_leave_value — дополнительный отпуск без сохранения зарплаты.
        15. workplace_adaptation_status — "defined" или "not_defined".
        16. workplace_adaptation_value — адаптация рабочего места / специальное рабочее место.

        Если данные отсутствуют:
        - для *_status — "not_defined"
        - для *_value — "Данные не определены"
        </task>

        <context_rules>
        - Перед остальными полями заполни disabled_employee_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_value = "Данные не определены".
        - Используй только текст договора.
        - Не выводи группу инвалидности и ИПРА из закона — только из текста.
        - Если гарантия определяется через отсылку к документу (ИПРА, Приложение) —
          фиксируй как "defined" со значением «согласно <документ>».
        - Если в разных фрагментах указаны разные данные и конфликт нельзя
          разрешить по тексту — статус → "not_defined", значение → "Не удалось определить".
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни группы инвалидности, ни ИПРА,
           ни специальных гарантий для инвалида.
           → presence = "missing";
             все восемь *_status = "not_defined";
             все *_value = "Данные не определены".

        2. Указана только группа инвалидности.
           Работник отнесён к категории инвалидов, но специальные
           гарантии не раскрыты.
           → presence = "present";
             disability_group_status = "defined";
             остальные *_status = "not_defined";
             соответствующие *_value = "Данные не определены".

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные группы инвалидности
           или противоречащие ограничения.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             соответствующее *_value = "Не удалось определить".

        4. Полная структура гарантий.
           Указаны группа инвалидности, ИПРА, сокращённое время,
           ограничения, дополнительный отпуск и адаптация рабочего места.
           → presence = "present";
             все восемь *_status = "defined".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для disabled_employee_check_presence используй только: "present", "missing", "unclear".
        - Для всех *_status используй только: "defined" или "not_defined".
        - Fallback при отсутствии данных:
          * все *_value → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_value → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "disabled_employee_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
