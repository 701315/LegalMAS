          "termination_procedure_value": "уведомление работника за 2 месяца при одностороннем изменении",
          "severance_pay_status": "defined",
          "severance_pay_value": "выходное пособие в размере среднего месячного заработка при сокращении штата",
          "modification_status": "defined",
          "modification_value": "по соглашению сторон (ст. 72 ТК РФ) либо по инициативе работодателя с уведомлением за 2 месяца (ст. 74 ТК РФ)",
          "discrimination_status": "not_defined",
