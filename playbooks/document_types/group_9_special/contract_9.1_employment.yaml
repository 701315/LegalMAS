compliance_rules: []

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: CHECKS_V8 — единственный рабочий слой юридического анализа
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  - id: parties_function_place_check
    name: "Стороны, трудовая функция и место работы"
    description: >
      Фактографическая проверка идентификации работодателя и работника,
      трудовой функции (должность/профессия/специальность с квалификацией),
      места работы (адрес, структурное подразделение), характера работы,
      даты и места заключения договора.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "работодатель"
        - "работник"
        - "трудовая функция"
        - "работа по должности"
        - "профессия"
        - "специальность"
        - "должностная инструкция"
        - "квалификация"
        - "место работы"
        - "адрес"
        - "структурное подразделение"
        - "филиал"
        - "дистанционная работа"
        - "характер работы"
        - "разъездной"
        - "в пути"
        - "подвижной"
        - "дата заключения"
        - "место заключения"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(работодатель|работник).*именуем"
        - "(?i)должност[ьи]\\s+в\\s+соответствии"
        - "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по трудовому праву.
        Анализируется трудовой договор (ст. 56, 57 ТК РФ).
        Проверяется только один вопрос: стороны, трудовая функция, место работы,
        дата и место заключения договора.
        Нормативный ориентир:
        - ст. 56 ТК РФ — понятие трудового договора
        - ст. 57 ТК РФ — содержание трудового договора (обязательные условия:
        ФИО работника, наименование работодателя, место работы, трудовая функция,
        дата начала работы; дата и место заключения договора)
        - ст. 312.1 ТК РФ — дистанционная работа
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска, не подставляй нормы закона вместо текста.
        [ЗАДАЧА]
        Найди в тексте договора:
        1. Наименование работодателя и его реквизиты.
        2. ФИО работника и его данные (паспорт, СНИЛС).
        3. Трудовую функцию: должность/профессия/специальность с квалификацией.
        4. Ссылку на должностную инструкцию.
        5. Место работы: адрес, структурное подразделение.
        6. Указание на дистанционную работу (полностью / гибрид / периодически).
        7. Характер работы (разъездной, в пути, подвижной) — если указан.
        8. Дату заключения трудового договора.
        9. Место заключения трудового договора.
        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона вместо текста.
        2. Для *_status используй строго "defined" или "not_defined".
        3. Для *_value при отсутствии данных — строго "Данные не определены".
        4. remote_work_status = "defined" только если прямо указана дистанционная
        работа (полная, гибридная или периодическая). Отсылка к ЛНА без режима —
        "not_defined".
        5. work_nature_status = "defined" только если прямо указан характер работы
        (разъездной, в пути, подвижной).
        6. conclusion_date_* и conclusion_place_* обычно указываются в преамбуле
        (после места и даты подписания) или перед подписями сторон.
        7. Если указано только место или только дата — фиксируй то, что есть,
        остальные — "not_defined".
        8. Никогда не используй "None", "null", пустые строки или отсутствующие ключи.
        9. Верни РОВНО один валидный JSON-объект со всеми 21 ключом (20 полей + evidence),
        пригодный для парсинга через json.loads без предварительной обработки.
        Без markdown, без ```json, без комментариев, без текста до или после.
        Начни ответ сразу с { и закончи }.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — все данные определены:
        Фрагмент:
        "Трудовой договор заключён 01.06.2026 в г. Москве. Работодатель —
        ООО «Альфа» (ИНН 7700000001, ОГРН 1027700000001), в лице Генерального
        директора Иванова А.А., действующего на основании Устава, и Работник —
        Петров Б.Б. (паспорт серия 45 00 № 123456, СНИЛС 123-456-789 00),
        заключили настоящий трудовой договор. Работник принимается на должность
        инженера-программиста 1-й категории в отдел разработки. Место работы:
        г. Москва, ул. Ленина, д. 10, офис 305. Должностная инструкция —
        Приложение № 1."
        Ответ:
        {
          "employer_details_status": "defined",
          "employer_details_value": "ООО «Альфа», ИНН 7700000001, ОГРН 1027700000001",
          "employee_details_status": "defined",
          "employee_details_value": "Петров Б.Б., паспорт серия 45 00 № 123456, СНИЛС 123-456-789 00",
          "position_status": "defined",
          "position_value": "инженер-программист 1-й категории",
          "structural_unit_status": "defined",
          "structural_unit_value": "отдел разработки",
          "job_description_status": "defined",
          "job_description_value": "Должностная инструкция — Приложение № 1",
          "work_place_status": "defined",
          "work_place_value": "г. Москва, ул. Ленина, д. 10, офис 305",
          "remote_work_status": "not_defined",
          "remote_work_value": "Данные не определены",
          "work_nature_status": "not_defined",
          "work_nature_value": "Данные не определены",
          "conclusion_date_status": "defined",
          "conclusion_date_value": "01.06.2026",
          "conclusion_place_status": "defined",
          "conclusion_place_value": "г. Москва",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "Работник принимается на должность инженера-программиста 1-й категории в отдел разработки."
            }
          ]
        }
        Пример 2 — частично определено, только дата:
        Фрагмент:
        "Трудовой договор заключён 15.07.2026. Работодатель — ООО «Бета».
        Работник — Сидоров В.В. Работник принимается на должность менеджера
        по продажам. Место работы: г. Санкт-Петербург, Невский проспект, д. 1."
        Ответ:
        {
          "employer_details_status": "defined",
          "employer_details_value": "ООО «Бета»",
          "employee_details_status": "defined",
          "employee_details_value": "Сидоров В.В.",
          "position_status": "defined",
          "position_value": "менеджер по продажам",
          "structural_unit_status": "not_defined",
          "structural_unit_value": "Данные не определены",
          "job_description_status": "not_defined",
          "job_description_value": "Данные не определены",
          "work_place_status": "defined",
          "work_place_value": "г. Санкт-Петербург, Невский проспект, д. 1",
          "remote_work_status": "not_defined",
          "remote_work_value": "Данные не определены",
          "work_nature_status": "not_defined",
          "work_nature_value": "Данные не определены",
          "conclusion_date_status": "defined",
          "conclusion_date_value": "15.07.2026",
          "conclusion_place_status": "not_defined",
          "conclusion_place_value": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 1",
              "quote": "Работник принимается на должность менеджера по продажам."
            }
          ]
        }
        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Работодатель и Работник заключили настоящий договор."
        Ответ:
        {
          "employer_details_status": "not_defined",
          "employer_details_value": "Данные не определены",
          "employee_details_status": "not_defined",
          "employee_details_value": "Данные не определены",
          "position_status": "not_defined",
          "position_value": "Данные не определены",
          "structural_unit_status": "not_defined",
          "structural_unit_value": "Данные не определены",
          "job_description_status": "not_defined",
          "job_description_value": "Данные не определены",
          "work_place_status": "not_defined",
          "work_place_value": "Данные не определены",
          "remote_work_status": "not_defined",
          "remote_work_value": "Данные не определены",
          "work_nature_status": "not_defined",
          "work_nature_value": "Данные не определены",
          "conclusion_date_status": "not_defined",
          "conclusion_date_value": "Данные не определены",
          "conclusion_place_status": "not_defined",
          "conclusion_place_value": "Данные не определены",
          "evidence": []
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Проверь, что все 21 ключ (20 полей + evidence) присутствуют в JSON.
        2. Проверь, что каждый *_status ∈ {"defined", "not_defined"},
        а каждый *_value при отсутствии данных = "Данные не определены".
        3. Проверь, что для каждого defined-поля в evidence есть прямая цитата из договора.
        4. Убедись, что remote_work_status = "defined" только при прямом указании
        дистанционной работы (полной / гибридной / периодической).
        5. Убедись, что work_nature_status = "defined" только при прямом указании
        характера работы (разъездной, в пути, подвижной).
        6. Убедись, что conclusion_date_value — именно дата заключения договора
        (не дата начала работы — она извлекается в чеке term_probation_check).
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "employer_details_status": "<defined / not_defined>",
          "employer_details_value": "<реквизиты или 'Данные не определены'>",
          "employee_details_status": "<defined / not_defined>",
          "employee_details_value": "<данные или 'Данные не определены'>",
          "position_status": "<defined / not_defined>",
          "position_value": "<должность или 'Данные не определены'>",
          "structural_unit_status": "<defined / not_defined>",
          "structural_unit_value": "<подразделение или 'Данные не определены'>",
          "job_description_status": "<defined / not_defined>",
          "job_description_value": "<ссылка или 'Данные не определены'>",
          "work_place_status": "<defined / not_defined>",
          "work_place_value": "<адрес или 'Данные не определены'>",
          "remote_work_status": "<defined / not_defined>",
          "remote_work_value": "<режим или 'Данные не определены'>",
          "work_nature_status": "<defined / not_defined>",
          "work_nature_value": "<характер или 'Данные не определены'>",
          "conclusion_date_status": "<defined / not_defined>",
          "conclusion_date_value": "<дата или 'Данные не определены'>",
          "conclusion_place_status": "<defined / not_defined>",
          "conclusion_place_value": "<место или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 7
      temperature: 0.0
      max_tokens: 950

    retrieval:
      retrieval_profile: "party_identification_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "работодатель работник трудовая функция работа по должности профессия специальность квалификация должностная инструкция место работы адрес структурное подразделение филиал дистанционная работа характер работы разъездной в пути подвижной дата заключения место заключения"
      preferred_unit_types:
        - obligation
        - general_provision
        - definition
      excluded_unit_types:
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - definitions
        - obligations
      boost_keywords:
        - "именуем"
        - "принимается на должность"
        - "место работы"
        - "дата заключения"
      negative_keywords:
        - "заработная плата"
        - "оклад"
        - "отпуск"
        - "рабочее время"
        - "увольнение"
        - "расторжение"
        - "материальная ответственность"
        - "конфиденциальность"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 0.25]
        boost: 0.25
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "definitions"
        - "obligations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.15

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1700

      compact_output: false

      presence_signal:
        field: "parties_function_place_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по трудовому праву. Извлеки из трудового договора
        сведения о сторонах, трудовой функции, месте и характере работы,
        дате и месте заключения.
        Не анализируй оплату труда, отпуск, рабочее время или расторжение.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 21 поле + evidence (всего 22 ключа):

        0. parties_function_place_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (employer_details_status, employee_details_status, position_status,
              structural_unit_status, job_description_status, work_place_status,
              remote_work_status, work_nature_status, conclusion_date_status,
              conclusion_place_status) ≠ "not_defined";
           - "missing" — если все десять содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - все *_status = "not_defined";
           - все *_value = "Данные не определены";
           - не выполняй остальные шаги.

        1. employer_details_status — "defined" или "not_defined".
        2. employer_details_value — наименование и реквизиты работодателя.
        3. employee_details_status — "defined" или "not_defined".
        4. employee_details_value — ФИО и данные работника.
        5. position_status — "defined" или "not_defined".
        6. position_value — должность/профессия/специальность с квалификацией.
        7. structural_unit_status — "defined" или "not_defined".
        8. structural_unit_value — структурное подразделение.
        9. job_description_status — "defined" или "not_defined".
        10. job_description_value — ссылка на должностную инструкцию.
        11. work_place_status — "defined" или "not_defined".
        12. work_place_value — адрес места работы.
        13. remote_work_status — "defined" или "not_defined".
        14. remote_work_value — режим дистанционной работы.
        15. work_nature_status — "defined" или "not_defined".
        16. work_nature_value — характер работы (разъездной, в пути, подвижной).
        17. conclusion_date_status — "defined" или "not_defined".
        18. conclusion_date_value — дата заключения договора.
        19. conclusion_place_status — "defined" или "not_defined".
        20. conclusion_place_value — место заключения договора.

        Если данные отсутствуют:
        - для *_status — "not_defined"
        - для *_value — "Данные не определены"
        </task>

        <context_rules>
        - Перед остальными полями заполни parties_function_place_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_value = "Данные не определены".
        - Используй только текст договора.
        - remote_work_status = "defined" только если прямо указана дистанционная работа
          (полная, гибридная или периодическая). Отсылка к ЛНА без режима — "not_defined".
        - work_nature_status = "defined" только если прямо указан характер работы
          (разъездной, в пути, подвижной).
        - conclusion_date_* и conclusion_place_* обычно указываются в преамбуле
          (после места и даты подписания) или перед подписями сторон.
        - Не путай дату заключения договора с датой начала работы.
        - Для отсылок к приложениям (например, "согласно Приложению № 1")
          используй значение в *_value как "согласно <ссылка>".
        - Если в разных фрагментах указаны разные данные и конфликт нельзя
          разрешить по тексту — статус → "not_defined", значение → "Не удалось определить".
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни сторон, ни трудовой функции, ни места работы.
           → presence = "missing";
             все *_status = "not_defined";
             все *_value = "Данные не определены".

        2. Частичное раскрытие.
           Указаны стороны и должность, но нет места работы,
           структурного подразделения и даты заключения.
           → presence = "present";
             указанные *_status = "defined";
             неуказанные *_status = "not_defined";
             неуказанные *_value = "Данные не определены".

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные адреса места работы
           или разные должности.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             соответствующее *_value = "Не удалось определить".

        4. Отсылка на должностную инструкцию / ЛНА.
           Трудовая функция определяется в том числе должностной инструкцией,
           локальным нормативным актом или приложением.
           → presence = "present";
             job_description_status = "defined";
             job_description_value содержит формулировку вида
             «Должностная инструкция — Приложение № N».
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для parties_function_place_check_presence используй только: "present", "missing", "unclear".
        - Для всех *_status используй только: "defined" или "not_defined".
        - Fallback при отсутствии данных:
          * все *_value → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_value → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

