          required: false

      store_payload: true

  - id: training_and_clawback_check
    name: "Обучение за счёт работодателя и обязанность отработки"
    description: >
      Фактографическая проверка условий об ученическом договоре (ст. 198–208 ТК РФ),
      обучении за счёт работодателя, обязанности отработать определённый срок,
      а также порядка возмещения затрат работодателя при увольнении.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "ученический договор"
        - "ученичество"
        - "обучение"
        - "повышение квалификации"
        - "профессиональная переподготовка"
        - "стажировка"
        - "за счёт работодателя"
        - "обязанность отработать"
        - "отработать не менее"
        - "возмещение затрат"
        - "возмещение расходов на обучение"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)ученическ[а-яё]+\\s+договор"
        - "(?i)обучени[ея].*за\\s+счёт\\s+работодател"
        - "(?i)отработать\\s+не\\s+менее"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по трудовому праву.
        Анализируется трудовой договор.
        Проверяется только один вопрос: обучение за счёт работодателя
        и обязанность отработки.
        Нормативный ориентир:
        - ст. 196 ТК РФ — подготовка и дополнительное профессиональное образование
        - ст. 197 ТК РФ — право на профессиональное обучение
        - ст. 198–208 ТК РФ — ученический договор
        - ст. 249 ТК РФ — возмещение затрат при увольнении без уважительных причин
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска, не подставляй нормы закона вместо текста.
        - Не выводи конкретные суммы затрат, если они не указаны в тексте.
        [ЗАДАЧА]
        Найди в тексте договора:
        1. Условие об ученическом договоре (ст. 198–208 ТК РФ).
        2. Условие об обучении за счёт работодателя (повышение квалификации, переподготовка).
        3. Обязанность отработать определённый срок после обучения.
        4. Порядок возмещения затрат работодателя при увольнении (ст. 249 ТК РФ).
        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона вместо текста.
        2. Для *_status используй строго "defined" или "not_defined".
        3. Для *_value при отсутствии данных — строго "Данные не определены".
        4. training_agreement_* фиксирует только ученический договор
        (ст. 198–208 ТК РФ) — отдельный договор между работодателем и учеником.
        5. work_off_obligation_* фиксирует обязанность отработать определённый
        срок после обучения (минимальный срок, конкретные условия).
        6. cost_reimbursement_* фиксирует порядок возмещения затрат работодателя
        при увольнении до истечения срока отработки (ст. 249 ТК РФ).
        7. Если условия определяются через отсылку к документу (Соглашение
        об обучении, Ученический договор, Приложение) — фиксируй как "defined"
        со значением «согласно <документ>».
        8. Если прямо указано, что обучение / отработка не предусмотрены —
        соответствующий *_status = "defined", *_value = "не предусмотрены".
        9. В evidence включай только текст договора.
        10. Никогда не используй "None", "null", пустые строки или отсутствующие ключи.
        11. Верни РОВНО один валидный JSON-объект со всеми 7 ключами (6 полей + evidence),
        пригодный для парсинга через json.loads без предварительной обработки.
        Без markdown, без ```json, без комментариев, без текста до или после.
        Начни ответ сразу с { и закончи }.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — обучение с обязанностью отработки:
        Фрагмент:
        "Работодатель оплачивает обучение работника по программе MBA.
        Работник обязуется отработать не менее 3 лет после завершения обучения.
        В случае увольнения без уважительных причин до истечения указанного
        срока работник возмещает затраты работодателя на обучение
        пропорционально отработанному времени."
        Ответ:
        {
          "training_agreement_status": "not_defined",
          "training_agreement_value": "Данные не определены",
          "work_off_obligation_status": "defined",
          "work_off_obligation_value": "не менее 3 лет после завершения обучения",
          "cost_reimbursement_status": "defined",
          "cost_reimbursement_value": "возмещение затрат на обучение пропорционально отработанному времени при увольнении без уважительных причин",
          "evidence": [
            {
              "clause_ref": "п. 6.1",
              "quote": "Работник обязуется отработать не менее 3 лет после завершения обучения."
            }
          ]
        }
        Пример 2 — ученический договор:
        Фрагмент:
        "С работником заключается ученический договор на профессиональное
        обучение. Условия ученического договора — согласно Приложению № 2."
        Ответ:
        {
          "training_agreement_status": "defined",
          "training_agreement_value": "согласно Приложению № 2 (ученический договор)",
          "work_off_obligation_status": "not_defined",
          "work_off_obligation_value": "Данные не определены",
          "cost_reimbursement_status": "not_defined",
          "cost_reimbursement_value": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 6.2",
              "quote": "С работником заключается ученический договор на профессиональное обучение."
            }
          ]
        }
        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Работник выполняет свои обязанности в соответствии с договором."
        Ответ:
        {
          "training_agreement_status": "not_defined",
          "training_agreement_value": "Данные не определены",
          "work_off_obligation_status": "not_defined",
          "work_off_obligation_value": "Данные не определены",
          "cost_reimbursement_status": "not_defined",
          "cost_reimbursement_value": "Данные не определены",
          "evidence": []
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Проверь, что все 7 ключей (6 полей + evidence) присутствуют в JSON.
        2. Проверь, что каждый *_status ∈ {"defined", "not_defined"}, а каждый *_value
        при отсутствии данных = "Данные не определены".
        3. Проверь, что для каждого defined-поля в evidence есть прямая цитата из договора.
        4. Убедись, что training_agreement_* фиксирует только ученический договор,
        а не любое обучение.
        5. Убедись, что work_off_obligation_* указывает конкретный срок отработки,
        если он есть в тексте.
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "training_agreement_status": "<defined / not_defined>",
          "training_agreement_value": "<текст / 'согласно <документ>' / 'не предусмотрен' / 'Данные не определены'>",
          "work_off_obligation_status": "<defined / not_defined>",
          "work_off_obligation_value": "<срок / 'не предусмотрена' / 'Данные не определены'>",
          "cost_reimbursement_status": "<defined / not_defined>",
          "cost_reimbursement_value": "<текст / 'согласно <документ>' / 'не предусмотрено' / 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 750

