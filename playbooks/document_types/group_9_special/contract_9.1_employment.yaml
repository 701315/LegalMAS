          required: false
        - name: "liability_type_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения типа материальной ответственности."
          required: false
        - name: "liability_type_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Материальная ответственность"
          description: "Тип материальной ответственности."
          required: false
        - name: "separate_agreement_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус отдельного договора о полной МО."
          required: false
        - name: "damage_procedure_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус порядка возмещения ущерба."
          required: false
        - name: "confidentiality_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус условия о конфиденциальности."
          required: false
        - name: "confidentiality_value"
