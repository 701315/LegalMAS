      - "(?i)равн[а-яё]+\\s+оплат[аа]\\s+за\\s+равн[ыо]й\\s+труд"

  illegal_dismissal_risk:
    any_keywords:
      - "(?i)увольнени[ея]"
      - "(?i)расторжени[ея]\\s+по\\s+инициатив[ее]\\s+работодател[яя]"
      - "(?i)основани[яя]\\s+увольнени[яя]"
