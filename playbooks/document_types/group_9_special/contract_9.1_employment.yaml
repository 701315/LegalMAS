          label: "Ответственность за разглашение"
          description: "Ответственность за разглашение конфиденциальной информации."
          required: false
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 7: Расторжение, изменение условий, защита прав работника
  # ──────────────────────────────────────────────────────────────────────────
  - id: termination_modification_rights_check
    name: "Расторжение, изменение условий и защита прав работника"
    description: >
      Фактографическая проверка оснований и процедуры расторжения, порядка
      изменения условий договора, выходного пособия, а также выявления условий,
      ограничивающих права работника (ст. 9 ТК РФ) и дискриминационных условий (ст. 3 ТК РФ).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "расторжение трудового договора"
        - "прекращение"
        - "увольнение"
        - "основания расторжения"
        - "по инициативе работника"
        - "по инициативе работодателя"
        - "по соглашению сторон"
        - "ст. 81 ТК РФ"
        - "выходное пособие"
        - "изменение условий трудового договора"
        - "по соглашению сторон"
        - "уведомление за 2 месяца"
        - "предложение вакантных должностей"
        - "дискриминация"
        - "запрет дискриминации"
        - "равная оплата"
        - "отказ от отпуска"
        - "отказ от больничного"
        - "работник не вправе обращаться в суд"
        - "снижение гарантий"
        - "ухудшение положения"
        - "запрет на обращение в ГИТ"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)расторжени(е|я)\\s+трудов(ого|ого)"
        - "(?i)ст\\.\\s*81\\s*ТК"
        - "(?i)изменени[ея]\\s+условий\\s+трудов"
        - "(?i)отказ\\s+от\\s+(отпуск|больничн)"
        - "(?i)работник\\s+не\\s+вправе\\s+обращаться"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по трудовому праву.
        Анализируется трудовой договор (ст. 9, 72, 74, 77–84.1 ТК РФ).
        Проверяется только один вопрос: расторжение, изменение условий,
        защита прав работника и дискриминационные условия.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Фиксируй наличие дискриминационных формулировок как факт.
        [ЗАДАЧА]
        Найди в тексте договора:
        1. Основания расторжения трудового договора.
        2. Упоминание процедуры расторжения.
        3. Выходное пособие.
        4. Порядок изменения условий договора.
