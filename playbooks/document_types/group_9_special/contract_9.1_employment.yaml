          "extra_benefits_value": "дополнительный отпуск без сохранения заработной платы",
          "evidence": [
            {
              "clause_ref": "п. 1.3",
              "quote": "Работник имеет ребёнка в возрасте 10 лет."
            }
          ]
        }
        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Работник выполняет свои обязанности в соответствии с договором."
        Ответ:
