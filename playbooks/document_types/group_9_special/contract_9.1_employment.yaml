  - id: suspension_check
    name: "Отстранение от работы"
    description: >
      Фактографическая проверка условий об отстранении работника от работы
      (недопущении к работе) и порядке оплаты периода отстранения
      (ст. 76 ТК РФ). Критично для внутреннего контроля: определяет
      законные основания и процедуру отстранения, а также финансовые
      последствия для работника.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "отстранение от работы"
        - "не допускается к работе"
        - "недопущение к работе"
        - "отстранён"
        - "алкогольное опьянение"
        - "наркотическое опьянение"
        - "непрохождение инструктажа"
        - "непрохождение медосмотра"
        - "приостановление специального права"
        - "без оплаты"
        - "не начисляется заработная плата"
        - "по требованию органов"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)отстранени[ея]\\s+от\\s+работ"
        - "(?i)(не\\s+допускается|недопущени[ея])\\s+к\\s+работ"
        - "(?i)(алкогольн|наркотическ)[а-яё]+\\s+опьянени"
        - "(?i)(приостановлени[ея]\\s+специальн|непрохождени[ея]\\s+(инструктаж|медосмотр))"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по трудовому праву.
        Анализируется трудовой договор (ст. 76, 212, 214 ТК РФ; ст. 32.1
        КоАП РФ; ФЗ-196 «О безопасности дорожного движения»).
        Проверяется только один вопрос: отстранение работника от работы
        (недопущение к работе) и порядок оплаты периода отстранения.
        Нормативный ориентир:
        - ст. 76 ТК РФ — отстранение от работы (недопущение к работе):
          * появление на работе в состоянии опьянения;
          * непрохождение обучения и проверки знаний по охране труда;
          * непрохождение обязательного медосмотра;
          * непрохождение обязательного психиатрического освидетельствования;
          * приостановление на срок до 2 месяцев специального права
            (водительские права, лицензия и др.);
          * по требованию органов и должностных лиц (ст. 76 ч. 1);
          * в других случаях, предусмотренных ТК РФ и ФЗ.
        - ст. 76 ч. 3 ТК РФ — в период отстранения заработная плата
        не начисляется, кроме случаев, предусмотренных ТК РФ или ФЗ
        (например, ст. 76 ч. 4 — при отстранении работника, не прошедшего
        обучение по своей вине — не оплачивается; не по своей вине —
        оплачивается как простой).
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска, не подставляй нормы закона вместо текста.
        - Для внутреннего контроля критично: без чёткой процедуры отстранения
        возможно оспаривание работником законности и взыскание среднего
        заработка.
        - Различай:
          1) Основания отстранения;
          2) Процедура оформления (приказ, ознакомление);
          3) Порядок оплаты периода отстранения (не оплачивается
             или оплачивается как простой);
          4) Отстранение по требованию уполномоченных органов.
        [ЗАДАЧА]
        Найди в тексте договора:
        1. Основания отстранения от работы.
        2. Процедуру оформления отстранения.
        3. Порядок оплаты периода отстранения.
        4. Отстранение по требованию уполномоченных органов.
        5. Порядок допуска к работе после отстранения.
        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона вместо текста.
        2. Для *_status используй строго "defined" или "not_defined".
        3. Для *_value при отсутствии данных — строго "Данные не определены".
        4. suspension_grounds_* фиксирует основания отстранения.
        5. suspension_procedure_* фиксирует процедуру оформления отстранения.
        6. suspension_payment_* фиксирует порядок оплаты периода отстранения.
        7. agency_suspension_* фиксирует отстранение по требованию
        уполномоченных органов.
        8. return_procedure_* фиксирует порядок допуска к работе
        после отстранения.
        9. Если условие определяется через отсылку к документу (Приказ,
        ЛНА, Приложение) — фиксируй как "defined" со значением
        «согласно <документ>».
        10. В evidence включай только текст договора.
        11. Никогда не используй "None", "null", пустые строки или отсутствующие ключи.
        12. Верни РОВНО один валидный JSON-объект со всеми 11 ключами (10 полей + evidence),
        пригодный для парсинга через json.loads без предварительной обработки.
        Без markdown, без ```json, без комментариев, без текста до или после.
        Начни ответ сразу с { и закончи }.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — полная структура:
        Фрагмент:
        "Работник отстраняется от работы (не допускается к работе)
        в случаях, установленных ст. 76 ТК РФ, включая появление
        на работе в состоянии алкогольного, наркотического или иного
        токсического опьянения, а также непрохождение обязательного
        медицинского осмотра. Отстранение оформляется приказом
        работодателя с ознакомлением работника. В период отстранения
        заработная плата не начисляется, кроме случаев, предусмотренных
        ТК РФ. Допуск к работе осуществляется после устранения
        обстоятельств, послуживших основанием для отстранения."
        Ответ:
        {
          "suspension_grounds_status": "defined",
          "suspension_grounds_value": "случаи, установленные ст. 76 ТК РФ, включая опьянение и непрохождение обязательного медосмотра",
          "suspension_procedure_status": "defined",
          "suspension_procedure_value": "оформляется приказом работодателя с ознакомлением работника",
          "suspension_payment_status": "defined",
          "suspension_payment_value": "заработная плата не начисляется, кроме случаев, предусмотренных ТК РФ",
          "agency_suspension_status": "not_defined",
          "agency_suspension_value": "Данные не определены",
          "return_procedure_status": "defined",
          "return_procedure_value": "допуск к работе после устранения обстоятельств",
          "evidence": [
            {
              "clause_ref": "п. 6.1",
              "quote": "Работник отстраняется от работы (не допускается к работе) в случаях, установленных ст. 76 ТК РФ."
            }
          ]
        }
        Пример 2 — только основания без оплаты:
        Фрагмент:
        "Работник не допускается к работе при появлении на работе
        в состоянии алкогольного или наркотического опьянения."
        Ответ:
        {
          "suspension_grounds_status": "defined",
          "suspension_grounds_value": "появление на работе в состоянии алкогольного или наркотического опьянения",
          "suspension_procedure_status": "not_defined",
          "suspension_procedure_value": "Данные не определены",
          "suspension_payment_status": "not_defined",
          "suspension_payment_value": "Данные не определены",
          "agency_suspension_status": "not_defined",
          "agency_suspension_value": "Данные не определены",
          "return_procedure_status": "not_defined",
          "return_procedure_value": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 6.2",
              "quote": "Работник не допускается к работе при появлении на работе в состоянии алкогольного или наркотического опьянения."
            }
          ]
        }
        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Работник выполняет свои обязанности в соответствии с договором."
        Ответ:
        {
          "suspension_grounds_status": "not_defined",
          "suspension_grounds_value": "Данные не определены",
          "suspension_procedure_status": "not_defined",
          "suspension_procedure_value": "Данные не определены",
          "suspension_payment_status": "not_defined",
          "suspension_payment_value": "Данные не определены",
          "agency_suspension_status": "not_defined",
          "agency_suspension_value": "Данные не определены",
          "return_procedure_status": "not_defined",
          "return_procedure_value": "Данные не определены",
          "evidence": []
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Проверь, что все 11 ключей (10 полей + evidence) присутствуют в JSON.
        2. Проверь, что каждый *_status ∈ {"defined", "not_defined"}, а каждый *_value
        при отсутствии данных = "Данные не определены".
        3. Проверь, что для каждого defined-поля в evidence есть прямая цитата из договора.
        4. Убедись, что основания отстранения соответствуют ст. 76 ТК РФ.
        5. Убедись, что порядок оплаты периода отстранения отражён отдельно.
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "suspension_grounds_status": "<defined / not_defined>",
          "suspension_grounds_value": "<текст / 'согласно <документ>' / 'Данные не определены'>",
          "suspension_procedure_status": "<defined / not_defined>",
          "suspension_procedure_value": "<текст / 'согласно <документ>' / 'Данные не определены'>",
          "suspension_payment_status": "<defined / not_defined>",
          "suspension_payment_value": "<текст / 'Данные не определены'>",
          "agency_suspension_status": "<defined / not_defined>",
          "agency_suspension_value": "<текст / 'Данные не определены'>",
          "return_procedure_status": "<defined / not_defined>",
          "return_procedure_value": "<текст / 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 7
      temperature: 0.0
      max_tokens: 950

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "отстранение от работы не допускается к работе недопущение алкогольное опьянение наркотическое опьянение непрохождение инструктажа непрохождение медосмотра приостановление специального права без оплаты не начисляется заработная плата по требованию органов"
      preferred_unit_types:
        - obligation
        - general_provision
        - definition
      excluded_unit_types:
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
        - limitations
      boost_keywords:
        - "отстранение от работы"
        - "не допускается к работе"
        - "алкогольное опьянение"
        - "медицинский осмотр"
      negative_keywords:
        - "трудовая функция"
        - "оклад"
        - "рабочее время"
        - "отпуск"
        - "конфиденциальность"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.40, 0.85]
        boost: 0.30
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
        - "limitations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1200

      compact_output: false

      presence_signal:
        field: "suspension_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по трудовому праву. Извлеки из трудового
        договора сведения об отстранении от работы и порядке оплаты
        периода отстранения.
        Не анализируй оплату труда, режим работы или расторжение.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 10 полей + evidence (всего 11 ключей):

        0. suspension_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (suspension_grounds_status, suspension_procedure_status,
              suspension_payment_status, agency_suspension_status,
              return_procedure_status) ≠ "not_defined";
           - "missing" — если все пять содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - все пять *_status = "not_defined";
           - все *_value = "Данные не определены";
           - не выполняй остальные шаги.

        1. suspension_grounds_status — "defined" или "not_defined".
        2. suspension_grounds_value — основания отстранения.
        3. suspension_procedure_status — "defined" или "not_defined".
        4. suspension_procedure_value — процедура оформления.
        5. suspension_payment_status — "defined" или "not_defined".
        6. suspension_payment_value — порядок оплаты периода отстранения.
        7. agency_suspension_status — "defined" или "not_defined".
        8. agency_suspension_value — отстранение по требованию
           уполномоченных органов.
        9. return_procedure_status — "defined" или "not_defined".
        10. return_procedure_value — порядок допуска к работе.

        Если данные отсутствуют:
        - для *_status — "not_defined"
        - для *_value — "Данные не определены"
        </task>

        <context_rules>
        - Перед остальными полями заполни suspension_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_value = "Данные не определены".
        - Используй только текст договора.
        - Отстранение от работы возможно только по основаниям ст. 76 ТК РФ.
        - Если условие определяется через отсылку к документу (Приказ,
          ЛНА, Приложение) — фиксируй как "defined" со значением
          «согласно <документ>».
        - Если в разных фрагментах указаны разные данные и конфликт нельзя
          разрешить по тексту — статус → "not_defined", значение → "Не удалось определить".
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни оснований отстранения, ни процедуры,
           ни порядка оплаты, ни допуска к работе.
           → presence = "missing";
             все пять *_status = "not_defined";
             все *_value = "Данные не определены".

        2. Только основания без процедуры.
           Указаны основания отстранения, но нет порядка оформления
           и оплаты периода.
           → presence = "present";
             suspension_grounds_status = "defined";
             suspension_procedure_status = "not_defined";
             suspension_payment_status = "not_defined";
             соответствующие *_value = "Данные не определены".

        3. Противоречие между фрагментами.
           В разных частях договора указаны противоречащие основания
           отстранения.
           → presence = "unclear";
             suspension_grounds_status = "not_defined";
             suspension_grounds_value = "Не удалось определить".

        4. Отсылка на ЛНА / Приказ.
           Порядок отстранения определяется отдельным документом.
           → presence = "present";
             suspension_procedure_status = "defined";
             suspension_procedure_value содержит формулировку вида
             «согласно Положению об отстранении».
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для suspension_check_presence используй только: "present", "missing", "unclear".
        - Для всех *_status используй только: "defined" или "not_defined".
        - Fallback при отсутствии данных:
          * все *_value → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_value → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

