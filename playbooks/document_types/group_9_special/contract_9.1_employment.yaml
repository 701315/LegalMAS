          required: true

        - name: "additional_pay_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Доплата за совмещение"
          description: >
            Размер доплаты за совмещение / расширение / и.о. Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "procedure_status"
          type: "string"
          presentation: "signal"
          risk_weight: "low"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус порядка оформления / отмены. Внутреннее enum-поле."
          required: true

        - name: "procedure_value"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Порядок оформления"
          description: >
            Порядок оформления, срок и условия отмены совмещения. Fallback: "Не установлено" / "Не удалось определить".
          required: false

      store_payload: true

  - id: transfer_check
    name: "Перевод на другую работу и перемещение"
    description: >
      Фактографическая проверка условий о переводе на другую работу
      (постоянном и временном), перемещении без изменения трудовой функции,
      а также о временном переводе в случаях производственной необходимости
      или простоя (ст. 72.1, 72.2, 73 ТК РФ). Критично для внутреннего
      контроля: определяет границы, в которых работодатель вправе изменить
      трудовую функцию работника.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "перевод на другую работу"
        - "постоянный перевод"
        - "временный перевод"
        - "перемещение"
        - "без изменения трудовой функции"
        - "производственная необходимость"
        - "простой"
        - "перевод по медицинским показаниям"
        - "перевод беременной"
        - "согласие работника"
        - "письменное согласие"
        - "другая местность"
        - "другое структурное подразделение"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(постоянн[а-яё]+|временн[а-яё]+)\\s+перевод"
        - "(?i)перевод[а-яё]*\\s+на\\s+другую\\s+работ"
        - "(?i)перемещени[ея]\\s+без\\s+изменени"
        - "(?i)производственн[а-яё]+\\s+необходимост"
        - "(?i)перевод[а-яё]*\\s+(по\\s+медицинск|беременн)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по трудовому праву.
        Анализируется трудовой договор (ст. 72.1, 72.2, 73 ТК РФ).
        Проверяется только один вопрос: перевод на другую работу
        и перемещение.
        Нормативный ориентир:
        - ст. 72.1 ТК РФ — перевод на другую работу (постоянный,
        по соглашению сторон; временный).
        - ст. 72.2 ТК РФ — временный перевод на другую работу
        (по соглашению сторон; по производственной необходимости;
        при простое).
        - ст. 73 ТК РФ — перевод по медицинским показаниям.
        - ст. 254 ТК РФ — перевод беременной / женщин с детьми до 1,5 лет.
        - ст. 57 ТК РФ — трудовая функция как обязательное условие.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска, не подставляй нормы закона вместо текста.
        - Различай:
          1) Постоянный перевод — только с письменного согласия
             (кроме случаев ст. 72.2 ч. 2, 3).
          2) Временный перевод — до 1 месяца без согласия (ст. 72.2 ч. 2, 3);
             более 1 месяца — только по соглашению.
          3) Перемещение — без изменения трудовой функции, согласие
             не требуется (ст. 72.1 ч. 3).
          4) Перевод по медицинским показаниям — обязателен для работодателя
             (ст. 73, 254).
        [ЗАДАЧА]
        Найди в тексте договора:
        1. Условие о постоянном переводе.
        2. Условие о временном переводе (соглашение / производственная
           необходимость / простой).
        3. Условие о перемещении без изменения трудовой функции.
        4. Порядок получения согласия работника.
        5. Перевод по медицинским показаниям.
        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона вместо текста.
        2. Для *_status используй строго "defined" или "not_defined".
        3. Для *_value при отсутствии данных — строго "Данные не определены".
        4. permanent_transfer_* фиксирует постоянный перевод.
        5. temporary_transfer_* фиксирует временный перевод (в том числе
        по производственной необходимости / простою).
        6. relocation_* фиксирует перемещение без изменения трудовой функции.
        7. consent_procedure_* фиксирует порядок получения согласия работника.
        8. medical_transfer_* фиксирует перевод по медицинским показаниям.
        9. Если условие определяется через отсылку к документу
        (Дополнительное соглашение, Согласие) — фиксируй как "defined"
        со значением «согласно <документ>».
        10. В evidence включай только текст договора.
        11. Никогда не используй "None", "null", пустые строки или отсутствующие ключи.
        12. Верни РОВНО один валидный JSON-объект со всеми 11 ключами (10 полей + evidence),
        пригодный для парсинга через json.loads без предварительной обработки.
        Без markdown, без ```json, без комментариев, без текста до или после.
        Начни ответ сразу с { и закончи }.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — полная структура:
        Фрагмент:
        "Перевод на другую постоянную работу допускается только
        с письменного согласия работника. Временный перевод на срок
        до одного месяца допускается в случаях производственной
        необходимости без согласия работника. Перемещение работника
        в другое структурное подразделение без изменения трудовой
        функции не требует согласия. Перевод по медицинским показаниям
        осуществляется в порядке, установленном ТК РФ."
        Ответ:
        {
          "permanent_transfer_status": "defined",
          "permanent_transfer_value": "только с письменного согласия работника",
          "temporary_transfer_status": "defined",
          "temporary_transfer_value": "до одного месяца без согласия в случаях производственной необходимости",
          "relocation_status": "defined",
          "relocation_value": "перемещение в другое структурное подразделение без изменения трудовой функции не требует согласия",
          "consent_procedure_status": "defined",
          "consent_procedure_value": "письменное согласие работника",
          "medical_transfer_status": "defined",
          "medical_transfer_value": "в порядке, установленном ТК РФ",
          "evidence": [
            {
              "clause_ref": "п. 5.1",
              "quote": "Перевод на другую постоянную работу допускается только с письменного согласия работника."
            }
          ]
        }
        Пример 2 — только постоянный перевод:
        Фрагмент:
        "Постоянный перевод на другую работу допускается только
        с письменного согласия работника."
        Ответ:
        {
          "permanent_transfer_status": "defined",
          "permanent_transfer_value": "только с письменного согласия работника",
          "temporary_transfer_status": "not_defined",
          "temporary_transfer_value": "Данные не определены",
          "relocation_status": "not_defined",
          "relocation_value": "Данные не определены",
          "consent_procedure_status": "defined",
          "consent_procedure_value": "письменное согласие работника",
          "medical_transfer_status": "not_defined",
          "medical_transfer_value": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 5.2",
              "quote": "Постоянный перевод на другую работу допускается только с письменного согласия работника."
            }
          ]
        }
        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Работник выполняет свои обязанности в соответствии с договором."
        Ответ:
        {
          "permanent_transfer_status": "not_defined",
          "permanent_transfer_value": "Данные не определены",
          "temporary_transfer_status": "not_defined",
          "temporary_transfer_value": "Данные не определены",
          "relocation_status": "not_defined",
          "relocation_value": "Данные не определены",
          "consent_procedure_status": "not_defined",
          "consent_procedure_value": "Данные не определены",
          "medical_transfer_status": "not_defined",
          "medical_transfer_value": "Данные не определены",
          "evidence": []
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Проверь, что все 11 ключей (10 полей + evidence) присутствуют в JSON.
        2. Проверь, что каждый *_status ∈ {"defined", "not_defined"}, а каждый *_value
        при отсутствии данных = "Данные не определены".
        3. Проверь, что для каждого defined-поля в evidence есть прямая цитата из договора.
        4. Убедись, что постоянный перевод не спутан с временным.
        5. Убедись, что перемещение (без изменения трудовой функции) отражено
        отдельно.
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "permanent_transfer_status": "<defined / not_defined>",
          "permanent_transfer_value": "<текст / 'согласно <документ>' / 'Данные не определены'>",
          "temporary_transfer_status": "<defined / not_defined>",
          "temporary_transfer_value": "<текст / 'Данные не определены'>",
          "relocation_status": "<defined / not_defined>",
          "relocation_value": "<текст / 'Данные не определены'>",
          "consent_procedure_status": "<defined / not_defined>",
          "consent_procedure_value": "<текст / 'Данные не определены'>",
          "medical_transfer_status": "<defined / not_defined>",
          "medical_transfer_value": "<текст / 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 7
      temperature: 0.0
      max_tokens: 950

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "перевод на другую работу постоянный перевод временный перевод перемещение без изменения трудовой функции производственная необходимость простой перевод по медицинским показаниям перевод беременной согласие работника письменное согласие другая местность другое структурное подразделение"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
        - limitations
      boost_keywords:
        - "перевод на другую работу"
        - "перемещение"
        - "производственная необходимость"
        - "письменное согласие"
      negative_keywords:
        - "трудовая функция"
        - "оклад"
        - "рабочее время"
        - "отпуск"
        - "конфиденциальность"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.30, 0.80]
        boost: 0.30
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
        - "limitations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1200

      compact_output: false

      presence_signal:
        field: "transfer_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по трудовому праву. Извлеки из трудового
        договора сведения о переводе на другую работу и перемещении.
        Не анализируй оплату труда, режим работы или расторжение.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 10 полей + evidence (всего 11 ключей):

        0. transfer_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (permanent_transfer_status, temporary_transfer_status,
              relocation_status, consent_procedure_status,
              medical_transfer_status) ≠ "not_defined";
           - "missing" — если все пять содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - все пять *_status = "not_defined";
           - все *_value = "Данные не определены";
           - не выполняй остальные шаги.

        1. permanent_transfer_status — "defined" или "not_defined".
        2. permanent_transfer_value — постоянный перевод.
        3. temporary_transfer_status — "defined" или "not_defined".
        4. temporary_transfer_value — временный перевод.
        5. relocation_status — "defined" или "not_defined".
        6. relocation_value — перемещение без изменения трудовой функции.
        7. consent_procedure_status — "defined" или "not_defined".
        8. consent_procedure_value — порядок получения согласия.
        9. medical_transfer_status — "defined" или "not_defined".
        10. medical_transfer_value — перевод по медицинским показаниям.

        Если данные отсутствуют:
        - для *_status — "not_defined"
        - для *_value — "Данные не определены"
        </task>

        <context_rules>
        - Перед остальными полями заполни transfer_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_value = "Данные не определены".
        - Используй только текст договора.
        - Постоянный перевод — только с письменного согласия (кроме
          случаев ст. 72.2 ч. 2, 3).
        - Временный перевод до 1 месяца — без согласия (ст. 72.2 ч. 2, 3);
          более 1 месяца — только по соглашению.
        - Перемещение — без изменения трудовой функции, согласие не требуется.
        - Если условие определяется через отсылку к документу
          (Дополнительное соглашение, Согласие) — фиксируй как "defined"
          со значением «согласно <документ>».
        - Если в разных фрагментах указаны разные данные и конфликт нельзя
          разрешить по тексту — статус → "not_defined", значение → "Не удалось определить".
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни постоянного, ни временного перевода,
           ни перемещения, ни перевода по медицинским показаниям.
           → presence = "missing";
             все пять *_status = "not_defined";
             все *_value = "Данные не определены".

        2. Только постоянный перевод с согласием.
           Есть условие о постоянном переводе с письменного согласия,
           но нет временного перевода и перемещения.
           → presence = "present";
             permanent_transfer_status = "defined";
             consent_procedure_status = "defined";
             temporary_transfer_status = "not_defined";
             relocation_status = "not_defined";
             соответствующие *_value = "Данные не определены".

        3. Противоречие между фрагментами.
           В разных частях договора указаны противоречащие условия
           о согласии работника при переводе.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             соответствующее *_value = "Не удалось определить".

        4. Отсылка на дополнительное соглашение.
           Условия перевода определяются дополнительным соглашением.
           → presence = "present";
             permanent_transfer_status = "defined";
             permanent_transfer_value содержит формулировку вида
             «согласно Дополнительному соглашению».
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для transfer_check_presence используй только: "present", "missing", "unclear".
        - Для всех *_status используй только: "defined" или "not_defined".
        - Fallback при отсутствии данных:
          * все *_value → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_value → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
