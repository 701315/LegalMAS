      compact_output: false

      presence_signal:
        field: "working_hours_leave_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по трудовому праву. Извлеки из трудового договора
        сведения о рабочем времени, отдыхе, отпуске и сверхурочной работе.
        Не анализируй оплату труда, трудовую функцию, место работы или расторжение.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 15 полей + evidence (всего 16 ключей):

        0. working_hours_leave_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (working_hours_status, schedule_status, irregular_hours_status,
              breaks_status, weekends_status, annual_leave_status,
              additional_leave_status, overtime_status) ≠ "not_defined";
           - "missing" — если все восемь содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - все восемь *_status = "not_defined";
           - все *_value = "Данные не определены";
           - не выполняй остальные шаги.

        1. working_hours_status — "defined" или "not_defined".
        2. working_hours_value — продолжительность рабочего времени в неделю.
        3. schedule_status — "defined" или "not_defined".
        4. schedule_value — график работы.
        5. irregular_hours_status — "defined" или "not_defined".
        6. irregular_hours_value — условие ненормированного рабочего дня.
        7. breaks_status — "defined" или "not_defined".
        8. breaks_value — перерывы в течение рабочего дня.
        9. weekends_status — "defined" или "not_defined".
        10. weekends_value — выходные дни.
        11. annual_leave_status — "defined" или "not_defined".
        12. annual_leave_value — продолжительность ежегодного отпуска.
        13. additional_leave_status — "defined" или "not_defined".
        14. additional_leave_value — дополнительные отпуска.
        15. overtime_status — "defined" или "not_defined".
        16. overtime_value — условия сверхурочной работы и её компенсации.

        Если данные отсутствуют:
        - для *_status — "not_defined"
        - для *_value — "Данные не определены"
        </task>

        <context_rules>
        - Перед остальными полями заполни working_hours_leave_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_value = "Данные не определены".
        - Используй только текст договора.
        - Не выводи 40 часов из ст. 91 ТК РФ — только из текста договора.
        - Не выводи 28 дней отпуска из ст. 115 ТК РФ — только из текста договора.
        - Если режим рабочего времени определяется через отсылку к документу
          (ПВТР, коллективный договор, график работы, Приложение) — фиксируй это
          как "defined" со значением «согласно <документ>».
        - Если прямо указано, что дополнительные отпуска не устанавливаются —
          additional_leave_status = "defined", additional_leave_value = "не устанавливаются".
        - Если в разных фрагментах указаны разные данные и конфликт нельзя
          разрешить по тексту — статус → "not_defined", значение → "Не удалось определить".
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни продолжительности рабочего времени, ни графика,
           ни перерывов, ни выходных, ни отпуска, ни сверхурочной работы.
           → presence = "missing";
             все восемь *_status = "not_defined";
             все *_value = "Данные не определены".

        2. Частичное раскрытие темы.
           Указаны только график работы и продолжительность отпуска,
           без перерывов, выходных и сверхурочной работы.
           → presence = "present";
             указанные *_status = "defined";
             неуказанные *_status = "not_defined";
             неуказанные *_value = "Данные не определены".

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные графики работы
           или разная продолжительность отпуска.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             соответствующее *_value = "Не удалось определить".

        4. Отсылка на ПВТР / коллективный договор / график.
           Режим рабочего времени, перерывы или выходные определяются
           Правилами внутреннего трудового распорядка / коллективным договором.
           → presence = "present";
             schedule_status = "defined";
             schedule_value содержит формулировку вида
             «согласно Правилам внутреннего трудового распорядка».
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для working_hours_leave_check_presence используй только: "present", "missing", "unclear".
        - Для всех *_status используй только: "defined" или "not_defined".
        - Fallback при отсутствии данных:
          * все *_value → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_value → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
