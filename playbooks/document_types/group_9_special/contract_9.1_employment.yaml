  - id: minor_employee_check
    name: "Специфика труда несовершеннолетнего работника"
    description: >
      Фактографическая проверка специальных гарантий и запретов для работника
      младше 18 лет (ст. 63, 92, 94, 96, 99, 113, 265–272 ТК РФ): возраст,
      согласие родителей / органов опеки, сокращённое рабочее время, запреты
      на ночные / сверхурочные / вредные работы, обязательные медосмотры,
      удлинённый отпуск, особый порядок расторжения.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "несовершеннолетний"
        - "младше 18"
        - "возраст"
        - "14 лет"
        - "15 лет"
        - "16 лет"
        - "17 лет"
        - "согласие родителей"
        - "орган опеки"
        - "24 часа"
        - "35 часов"
        - "31 календарный день"
        - "медицинский осмотр"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)несовершеннолетн"
        - "(?i)\\b(1[4-7])\\s*(лет|года)"
        - "(?i)орган[а-яё]*\\s+опек"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по трудовому праву.
        Анализируется трудовой договор с работником младше 18 лет.
        Проверяется только один вопрос: специальные гарантии и запреты
        для несовершеннолетнего работника.
        Нормативный ориентир:
        - ст. 63 ТК РФ — возраст, с которого допускается заключение договора
        (16 лет; 15 лет — для лёгкого труда; 14 лет — с согласия одного из родителей
        и органа опеки)
        - ст. 92 ТК РФ — сокращённое рабочее время (до 16 лет — не более 24 часов
        в неделю; от 16 до 18 лет — не более 35 часов в неделю)
        - ст. 94 ТК РФ — предельная продолжительность ежедневной работы
        - ст. 96 ТК РФ — запрет на работу в ночное время
        - ст. 99 ТК РФ — запрет на сверхурочную работу
        - ст. 113 ТК РФ — запрет на работу в выходные и нерабочие праздничные дни
        - ст. 265 ТК РФ — запрет на вредные / опасные работы и подземные работы
        - ст. 266 ТК РФ — обязательные предварительные и ежегодные медосмотры
        - ст. 267 ТК РФ — ежегодный основной оплачиваемый отпуск 31 календарный день
        - ст. 268 ТК РФ — запрет на командировки, сверхурочные, ночные, выходные
        - ст. 269 ТК РФ — расторжение только с согласия ГИТ и КДН
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска, не подставляй нормы закона вместо текста.
        - Не выводи возраст из закона — только из текста договора.
        [ЗАДАЧА]
        Найди в тексте договора:
        1. Возраст работника.
        2. Согласие родителей / органов опеки (для работников 14–15 лет).
        3. Сокращённую продолжительность рабочего времени.
        4. Предельную продолжительность ежедневной работы.
        5. Запреты на ночные работы / сверхурочные / вредные работы.
        6. Обязательные медицинские осмотры.
        7. Удлинённый ежегодный отпуск (31 календарный день).
        8. Особый порядок расторжения (согласие ГИТ / КДН).
        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона вместо текста.
        2. Для *_status используй строго "defined" или "not_defined".
        3. Для *_value при отсутствии данных — строго "Данные не определены".
        4. Не выводи возраст из закона — только из текста.
        5. age_* фиксирует возраст работника в годах.
        6. parental_consent_* фиксирует согласие одного из родителей / органов опеки.
        7. reduced_hours_* фиксирует сокращённую продолжительность рабочего времени
        (24 / 35 часов в неделю в зависимости от возраста).
        8. daily_limit_* фиксирует предельную продолжительность ежедневной работы
        (5 / 7 часов в зависимости от возраста).
        9. work_restrictions_* фиксирует запреты на ночные / сверхурочные / вредные
        / опасные работы, работу в выходные, командировки.
        10. medical_exams_* фиксирует обязательные предварительные и ежегодные медосмотры.
        11. extended_vacation_* фиксирует удлинённый ежегодный оплачиваемый отпуск
        (31 календарный день).
        12. termination_consent_* фиксирует особый порядок расторжения (согласие ГИТ
        и КДН).
        13. Если гарантия определяется через отсылку к документу (Согласие родителей,
        Приложение) — фиксируй как "defined" со значением «согласно <документ>».
        14. В evidence включай только текст договора.
        15. Никогда не используй "None", "null", пустые строки или отсутствующие ключи.
        16. Верни РОВНО один валидный JSON-объект со всеми 17 ключами (16 полей + evidence),
        пригодный для парсинга через json.loads без предварительной обработки.
        Без markdown, без ```json, без комментариев, без текста до или после.
        Начни ответ сразу с { и закончи }.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — 17 лет, полная структура:
        Фрагмент:
        "Работник — Иванов И.И., 17 лет. Работнику устанавливается сокращённая
        продолжительность рабочего времени — 35 часов в неделю. Работник не
        привлекается к сверхурочной работе, работе в ночное время, в выходные дни.
        Ежегодный оплачиваемый отпуск — 31 календарный день. Работник проходит
        обязательные медицинские осмотры."
        Ответ:
        {
          "age_status": "defined",
          "age_value": "17 лет",
          "parental_consent_status": "not_defined",
          "parental_consent_value": "Данные не определены",
          "reduced_hours_status": "defined",
          "reduced_hours_value": "35 часов в неделю",
          "daily_limit_status": "not_defined",
          "daily_limit_value": "Данные не определены",
          "work_restrictions_status": "defined",
          "work_restrictions_value": "не привлекается к сверхурочной работе, работе в ночное время, в выходные дни",
          "medical_exams_status": "defined",
          "medical_exams_value": "обязательные медицинские осмотры",
          "extended_vacation_status": "defined",
          "extended_vacation_value": "31 календарный день",
          "termination_consent_status": "not_defined",
          "termination_consent_value": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 1.2",
              "quote": "Работник — Иванов И.И., 17 лет."
            }
          ]
        }
        Пример 2 — 14 лет, с согласием родителей:
        Фрагмент:
        "Работник — Петров П.П., 14 лет. Имеется согласие матери работника
        на заключение трудового договора. Работнику устанавливается
        продолжительность рабочего времени 24 часа в неделю. Работник не
        допускается к вредным и опасным работам."
        Ответ:
        {
          "age_status": "defined",
          "age_value": "14 лет",
          "parental_consent_status": "defined",
          "parental_consent_value": "согласие матери работника",
          "reduced_hours_status": "defined",
          "reduced_hours_value": "24 часа в неделю",
          "daily_limit_status": "not_defined",
          "daily_limit_value": "Данные не определены",
          "work_restrictions_status": "defined",
          "work_restrictions_value": "не допускается к вредным и опасным работам",
          "medical_exams_status": "not_defined",
          "medical_exams_value": "Данные не определены",
          "extended_vacation_status": "not_defined",
          "extended_vacation_value": "Данные не определены",
          "termination_consent_status": "not_defined",
          "termination_consent_value": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "преамбула",
              "quote": "Работник — Петров П.П., 14 лет."
            }
          ]
        }
        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Работник выполняет свои обязанности в соответствии с договором."
        Ответ:
        {
          "age_status": "not_defined",
          "age_value": "Данные не определены",
          "parental_consent_status": "not_defined",
          "parental_consent_value": "Данные не определены",
          "reduced_hours_status": "not_defined",
          "reduced_hours_value": "Данные не определены",
          "daily_limit_status": "not_defined",
          "daily_limit_value": "Данные не определены",
          "work_restrictions_status": "not_defined",
          "work_restrictions_value": "Данные не определены",
          "medical_exams_status": "not_defined",
          "medical_exams_value": "Данные не определены",
          "extended_vacation_status": "not_defined",
          "extended_vacation_value": "Данные не определены",
          "termination_consent_status": "not_defined",
          "termination_consent_value": "Данные не определены",
          "evidence": []
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Проверь, что все 17 ключей (16 полей + evidence) присутствуют в JSON.
        2. Проверь, что каждый *_status ∈ {"defined", "not_defined"}, а каждый *_value
        при отсутствии данных = "Данные не определены".
        3. Проверь, что для каждого defined-поля в evidence есть прямая цитата из договора.
        4. Убедись, что возраст не выведен из закона — только из текста.
        5. Убедись, что запреты на ночные / сверхурочные / вредные работы отражены
        в work_restrictions_*, а не распределены по другим полям.
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "age_status": "<defined / not_defined>",
          "age_value": "<возраст / 'Данные не определены'>",
          "parental_consent_status": "<defined / not_defined>",
          "parental_consent_value": "<текст / 'согласно <документ>' / 'Данные не определены'>",
          "reduced_hours_status": "<defined / not_defined>",
          "reduced_hours_value": "<часов в неделю / 'Данные не определены'>",
          "daily_limit_status": "<defined / not_defined>",
          "daily_limit_value": "<часов в день / 'Данные не определены'>",
          "work_restrictions_status": "<defined / not_defined>",
          "work_restrictions_value": "<запреты / 'Данные не определены'>",
          "medical_exams_status": "<defined / not_defined>",
          "medical_exams_value": "<текст / 'Данные не определены'>",
          "extended_vacation_status": "<defined / not_defined>",
          "extended_vacation_value": "<дней / 'Данные не определены'>",
          "termination_consent_status": "<defined / not_defined>",
          "termination_consent_value": "<текст / 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 7
      temperature: 0.0
      max_tokens: 950

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "несовершеннолетний возраст 14 лет 15 лет 16 лет 17 лет согласие родителей орган опеки сокращённая продолжительность 24 часа 35 часов предельная продолжительность ежедневной работы запрет ночные сверхурочные вредные работы медицинский осмотр 31 календарный день расторжение согласие ГИТ КДН"
      preferred_unit_types:
        - obligation
        - general_provision
        - definition
      excluded_unit_types:
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - limitations
        - definitions
      boost_keywords:
        - "несовершеннолетний"
        - "согласие родителей"
        - "24 часа"
        - "35 часов"
        - "31 календарный день"
      negative_keywords:
        - "трудовая функция"
        - "место работы"
        - "оклад"
        - "заработная плата"
        - "конфиденциальность"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.10, 0.50]
        boost: 0.20
        scope: segment
      context_k: 8
