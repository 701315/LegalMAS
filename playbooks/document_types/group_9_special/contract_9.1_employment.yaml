type: contract_9.1_employment
name: "Трудовой договор"
version: 6.0
parent: class_9_special_imperative
description: |
  Соглашение между работодателем (юридическим/физическим лицом, ИП) и работником
  (физическим лицом), по которому работник обязуется ЛИЧНО ВЫПОЛНЯТЬ трудовую функцию
  (работу по должности/профессии/специальности) С ПОДЧИНЕНИЕМ ПРАВИЛАМ ВНУТРЕННЕГО
  ТРУДОВОГО РАСПОРЯДКА, а работодатель обязуется предоставлять работу, обеспечивать
  условия труда, СВОЕВРЕМЕННО И В ПОЛНОМ РАЗМЕРЕ ВЫПЛАЧИВАТЬ ЗАРАБОТНУЮ ПЛАТУ
  и соблюдать права работника, предусмотренные трудовым законодательством.
  Регулируется ИМПЕРАТИВНЫМИ НОРМАМИ ТК РФ — условия договора не могут ухудшать
  положение работника по сравнению с установленным трудовым законодательством (ст. 9 ТК РФ).
  Широкий спектр социальных гарантий: оплачиваемый отпуск, больничный, МРОТ,
  защита от необоснованного увольнения.
  РИСК ПЕРЕКВАЛИФИКАЦИИ: ГПХ-договоры (подряда, услуг) могут быть переквалифицированы
  в трудовые при наличии признаков трудовых отношений (ст. 15, 19.1 ТК РФ) →
  доначисление налогов, взносов, штрафы.
metadata:
  category: contract
  subcategory: employment
  complexity: high
  risk_level: critical
  jurisdiction: RU
  language: ru
  legal_base: "ТК РФ Раздел III (ст. 56–90)"
  doc_types_supported:
    - "трудовой договор"
    - "срочный трудовой договор"
    - "договор о дистанционной работе"
    - "договор дистанционной работы"
    - "трудовой договор по совместительству"
    - "договор по совместительству"
    - "трудовой договор с руководителем организации"
    - "трудовой контракт"
    - "контракт с генеральным директором"
    - "трудовой договор с генеральным директором"
    - "соглашение о неполном рабочем времени"
    - "employment agreement"
    - "contract of employment"
    - "executive employment contract"
    - "executive service agreement"
    - "labor contract"
    - "fixed-term employment agreement"
    - "part-time employment agreement"
    - "remote work agreement"
    - "probation period agreement"
    - "secondment agreement"

