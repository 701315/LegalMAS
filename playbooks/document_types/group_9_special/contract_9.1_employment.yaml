  - id: payment_structure_check
    name: "Структура оплаты труда: оклад, надбавки, премии, сроки выплаты"
    description: >
      Фактографическая проверка оклада/тарифной ставки, доплат, надбавок, премий,
      конкретных дат выплаты заработной платы, периодичности выплаты.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "оклад"
        - "тарифная ставка"
        - "заработная плата"
        - "премия"
        - "надбавка"
        - "доплата"
        - "два раза в месяц"
        - "не реже чем каждые полмесяца"
        - "выплата заработной платы"
        - "аванс"
        - "расчётный листок"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽)"
        - "(?i)оклад.*\\d"
        - "(?i)два\\s+раз[аа]\\s+в\\s+месяц"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по трудовому праву.
        Анализируется трудовой договор (ст. 129, 133, 136 ТК РФ).
        Проверяется только один вопрос: структура оплаты труда.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Не сравнивай сумму с МРОТ — только извлеки факты.
        [ЗАДАЧА]
        Найди в тексте договора:
        1. Оклад или тарифную ставку (сумма).
        2. Доплаты и надбавки.
        3. Премии и порядок премирования.
        4. Конкретные даты выплаты заработной платы.
        5. Периодичность выплаты.
        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если данные не указаны прямо — возвращай "not_defined".
        3. Если текстового значения нет — возвращай строго "Данные не определены".
        4. В evidence включай только текст договора.
        5. Верни только один JSON-объект.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1:
        Фрагмент:
        "Работнику устанавливается оклад в размере 85 000 рублей в месяц.
        Надбавка за выслугу лет — 10% оклада. Премия по итогам квартала —
        согласно Положению о премировании. Заработная плата выплачивается
        10-го и 25-го числа каждого месяца."
        Ответ:
        {
          "base_salary_status": "defined",
          "base_salary_value": "85 000 рублей в месяц",
          "allowances_status": "defined",
          "allowances_value": "надбавка за выслугу лет — 10% оклада",
          "bonuses_status": "defined",
          "bonuses_value": "премия по итогам квартала согласно Положению о премировании",
          "payment_dates_status": "defined",
          "payment_dates_value": "10-го и 25-го числа каждого месяца",
          "payment_frequency_status": "defined",
          "payment_frequency_value": "два раза в месяц",
          "evidence": [
            {
              "clause_ref": "п. 3.1",
              "quote": "Работнику устанавливается оклад в размере 85 000 рублей в месяц."
            }
          ]
        }
        Пример 2:
        Фрагмент:
        "Оплата труда производится в соответствии с действующим законодательством."
        Ответ:
        {
          "base_salary_status": "not_defined",
          "base_salary_value": "Данные не определены",
          "allowances_status": "not_defined",
          "allowances_value": "Данные не определены",
          "bonuses_status": "not_defined",
          "bonuses_value": "Данные не определены",
          "payment_dates_status": "not_defined",
          "payment_dates_value": "Данные не определены",
          "payment_frequency_status": "not_defined",
          "payment_frequency_value": "Данные не определены",
          "evidence": []
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату с окладом/тарифной ставкой.
        2. Найди прямую цитату о доплатах/надбавках.
        3. Найди прямую цитату о премиях.
        4. Найди прямую цитату с датами выплаты.
        5. Если прямой цитаты нет — верни "not_defined". Не додумывай.
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "base_salary_status": "<defined / not_defined>",
          "base_salary_value": "<сумма или 'Данные не определены'>",
          "allowances_status": "<defined / not_defined>",
          "allowances_value": "<текст или 'Данные не определены'>",
          "bonuses_status": "<defined / not_defined>",
          "bonuses_value": "<текст или 'Данные не определены'>",
          "payment_dates_status": "<defined / not_defined>",
          "payment_dates_value": "<даты или 'Данные не определены'>",
          "payment_frequency_status": "<defined / not_defined>",
          "payment_frequency_value": "<периодичность или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 7
      temperature: 0.0
      max_tokens: 700

