      store_payload: true

  - id: combined_work_check
    name: "Совмещение профессий, расширение зон обслуживания и исполнение обязанностей временно отсутствующего работника"
    description: >
      Фактографическая проверка условий о совмещении профессий (должностей),
      расширении зон обслуживания, увеличении объёма работы и исполнении
      обязанностей временно отсутствующего работника без освобождения
      от основной работы (ст. 60.2, 151 ТК РФ). Отличается от совместительства
      (ст. 60.1): работа выполняется в основное рабочее время у того же
      работодателя с доплатой.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "medium"
    severity_if_pass: "pass"
    severity_if_fail: "medium"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "совмещение профессий"
        - "совмещение должностей"
        - "расширение зон обслуживания"
        - "увеличение объёма работы"
        - "исполнение обязанностей временно отсутствующего"
        - "и.о."
        - "доплата за совмещение"
        - "доплата за расширение"
        - "доплата за увеличение объёма"
        - "доплата за исполнение обязанностей"
        - "без освобождения от основной работы"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)совмещени[ея]\\s+(професси|должност)"
        - "(?i)расширени[ея]\\s+зон[а-яё]*\\s+обслуживани"
        - "(?i)увеличени[ея]\\s+объ[её]м[а-яё]*\\s+работ"
        - "(?i)исполнени[ея]\\s+обязанностей\\s+временно"
        - "(?i)без\\s+освобождени[яе]\\s+от\\s+основной"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по трудовому праву.
        Анализируется трудовой договор (ст. 60.1, 60.2, 151 ТК РФ).
        Проверяется только один вопрос: условия о совмещении профессий
        (должностей), расширении зон обслуживания, увеличении объёма работы
        и исполнении обязанностей временно отсутствующего работника.
        Нормативный ориентир:
        - ст. 60.2 ТК РФ — совмещение профессий (должностей), расширение
        зон обслуживания, увеличение объёма работы, исполнение обязанностей
        временно отсутствующего работника без освобождения от основной работы.
        - ст. 151 ТК РФ — доплата за совмещение, расширение зон, увеличение
        объёма, исполнение обязанностей временно отсутствующего.
        - ст. 60.1 ТК РФ — работа по совместительству (НЕ путать
        с совмещением).
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска, не подставляй нормы закона вместо текста.
        - Различай:
          1) Совмещение профессий (должностей) — работник выполняет работу
             по другой профессии в основное рабочее время.
          2) Расширение зон обслуживания / увеличение объёма работы —
             работник выполняет больший объём работы по той же профессии.
          3) Исполнение обязанностей временно отсутствующего работника.
          4) Работа по совместительству (ст. 60.1) — это ДРУГАЯ конструкция,
             покрывается другим чеком.
        [ЗАДАЧА]
        Найди в тексте договора:
        1. Условие о совмещении профессий (должностей).
        2. Условие о расширении зон обслуживания или увеличении объёма работы.
        3. Условие об исполнении обязанностей временно отсутствующего работника.
        4. Размер доплаты за совмещение (ст. 151 ТК РФ).
        5. Порядок оформления / срок / условие отмены.
        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона вместо текста.
        2. Для *_status используй строго "defined" или "not_defined".
        3. Для *_value при отсутствии данных — строго "Данные не определены".
        4. combined_positions_* фиксирует совмещение профессий (должностей).
        5. expanded_scope_* фиксирует расширение зон обслуживания /
        увеличение объёма работы.
        6. interim_acting_* фиксирует исполнение обязанностей временно
        отсутствующего работника.
        7. additional_pay_* фиксирует размер доплаты за совмещение
        (ст. 151 ТК РФ).
        8. procedure_* фиксирует порядок оформления, срок и условия отмены.
        9. Если условие определяется через отсылку к документу (Дополнительное
        соглашение, Приложение) — фиксируй как "defined" со значением
        «согласно <документ>».
        10. В evidence включай только текст договора.
        11. Никогда не используй "None", "null", пустые строки или отсутствующие ключи.
        12. Верни РОВНО один валидный JSON-объект со всеми 13 ключами (12 полей + evidence),
        пригодный для парсинга через json.loads без предварительной обработки.
        Без markdown, без ```json, без комментариев, без текста до или после.
        Начни ответ сразу с { и закончи }.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — полная структура совмещения:
        Фрагмент:
        "Работнику может быть поручено совмещение профессий (должностей)
        без освобождения от основной работы. Размер доплаты за совмещение
        устанавливается по соглашению сторон в дополнительном соглашении
        к трудовому договору. Работник вправе отказаться от совмещения,
        уведомив работодателя письменно за 3 рабочих дня."
        Ответ:
        {
          "combined_positions_status": "defined",
          "combined_positions_value": "совмещение профессий (должностей) без освобождения от основной работы",
          "expanded_scope_status": "not_defined",
          "expanded_scope_value": "Данные не определены",
          "interim_acting_status": "not_defined",
          "interim_acting_value": "Данные не определены",
          "additional_pay_status": "defined",
          "additional_pay_value": "размер доплаты по соглашению сторон в дополнительном соглашении",
          "procedure_status": "defined",
          "procedure_value": "оформляется дополнительным соглашением; работник вправе отказаться, уведомив за 3 рабочих дня",
          "evidence": [
            {
              "clause_ref": "п. 4.5",
              "quote": "Работнику может быть поручено совмещение профессий (должностей) без освобождения от основной работы."
            }
          ]
        }
        Пример 2 — только исполнение обязанностей временно отсутствующего:
        Фрагмент:
        "На работника может быть возложено исполнение обязанностей
        временно отсутствующего работника с доплатой, размер которой
        определяется по соглашению сторон."
        Ответ:
        {
          "combined_positions_status": "not_defined",
          "combined_positions_value": "Данные не определены",
          "expanded_scope_status": "not_defined",
          "expanded_scope_value": "Данные не определены",
          "interim_acting_status": "defined",
          "interim_acting_value": "исполнение обязанностей временно отсутствующего работника",
          "additional_pay_status": "defined",
          "additional_pay_value": "размер доплаты по соглашению сторон",
          "procedure_status": "not_defined",
          "procedure_value": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 4.6",
              "quote": "На работника может быть возложено исполнение обязанностей временно отсутствующего работника с доплатой, размер которой определяется по соглашению сторон."
            }
          ]
        }
        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Работник выполняет свои обязанности в соответствии с договором."
        Ответ:
        {
          "combined_positions_status": "not_defined",
          "combined_positions_value": "Данные не определены",
          "expanded_scope_status": "not_defined",
          "expanded_scope_value": "Данные не определены",
          "interim_acting_status": "not_defined",
          "interim_acting_value": "Данные не определены",
          "additional_pay_status": "not_defined",
          "additional_pay_value": "Данные не определены",
          "procedure_status": "not_defined",
          "procedure_value": "Данные не определены",
          "evidence": []
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Проверь, что все 13 ключей (12 полей + evidence) присутствуют в JSON.
        2. Проверь, что каждый *_status ∈ {"defined", "not_defined"}, а каждый *_value
        при отсутствии данных = "Данные не определены".
        3. Проверь, что для каждого defined-поля в evidence есть прямая цитата из договора.
        4. Убедись, что совмещение (ст. 60.2) не спутано с совместительством
        (ст. 60.1).
        5. Убедись, что размер доплаты за совмещение отражён отдельно.
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "combined_positions_status": "<defined / not_defined>",
          "combined_positions_value": "<текст / 'не предусмотрено' / 'Данные не определены'>",
          "expanded_scope_status": "<defined / not_defined>",
          "expanded_scope_value": "<текст / 'не предусмотрено' / 'Данные не определены'>",
          "interim_acting_status": "<defined / not_defined>",
          "interim_acting_value": "<текст / 'не предусмотрено' / 'Данные не определены'>",
          "additional_pay_status": "<defined / not_defined>",
          "additional_pay_value": "<текст / 'согласно <документ>' / 'Данные не определены'>",
          "procedure_status": "<defined / not_defined>",
          "procedure_value": "<текст / 'согласно <документ>' / 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 7
      temperature: 0.0
      max_tokens: 1000

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "совмещение профессий совмещение должностей расширение зон обслуживания увеличение объёма работы исполнение обязанностей временно отсутствующего доплата за совмещение без освобождения от основной работы"
      preferred_unit_types:
        - obligation
        - payment_term
        - general_provision
      excluded_unit_types:
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
        - procedures
      boost_keywords:
        - "совмещение профессий"
        - "совмещение должностей"
        - "исполнение обязанностей временно отсутствующего"
        - "доплата за совмещение"
      negative_keywords:
        - "трудовая функция"
        - "рабочее время"
        - "отпуск"
        - "конфиденциальность"
        - "в целях настоящего"
        - "по совместительству"
      position_bias:
        preferred_range: [0.30, 0.80]
        boost: 0.30
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
        - procedures
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1200

      compact_output: false

      presence_signal:
        field: "combined_work_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по трудовому праву. Извлеки из трудового
        договора сведения о совмещении профессий, расширении зон
        обслуживания, увеличении объёма работы и исполнении обязанностей
        временно отсутствующего работника.
        Не анализируй оплату труда, режим работы или расторжение.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 12 полей + evidence (всего 13 ключей):

        0. combined_work_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (combined_positions_status, expanded_scope_status,
              interim_acting_status, additional_pay_status,
              procedure_status) ≠ "not_defined";
           - "missing" — если все пять содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - все пять *_status = "not_defined";
           - все *_value = "Данные не определены";
           - не выполняй остальные шаги.

        1. combined_positions_status — "defined" или "not_defined".
        2. combined_positions_value — совмещение профессий (должностей).
        3. expanded_scope_status — "defined" или "not_defined".
        4. expanded_scope_value — расширение зон / увеличение объёма.
        5. interim_acting_status — "defined" или "not_defined".
        6. interim_acting_value — исполнение обязанностей временно
           отсутствующего.
        7. additional_pay_status — "defined" или "not_defined".
        8. additional_pay_value — размер доплаты.
        9. procedure_status — "defined" или "not_defined".
        10. procedure_value — порядок оформления / срок / отмена.

        Если данные отсутствуют:
        - для *_status — "not_defined"
        - для *_value — "Данные не определены"
        </task>

        <context_rules>
        - Перед остальными полями заполни combined_work_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_value = "Данные не определены".
        - Используй только текст договора.
        - Совмещение (ст. 60.2) — НЕ то же, что совместительство (ст. 60.1).
          Совместительство — отдельный трудовой договор в свободное время.
        - Если условие определяется через отсылку к документу (Дополнительное
          соглашение, Приложение) — фиксируй как "defined" со значением
          «согласно <документ>».
        - Если в разных фрагментах указаны разные данные и конфликт нельзя
          разрешить по тексту — статус → "not_defined", значение → "Не удалось определить".
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни совмещения, ни расширения зон, ни исполнения
           обязанностей временно отсутствующего, ни доплаты.
           → presence = "missing";
             все пять *_status = "not_defined";
             все *_value = "Данные не определены".

        2. Указано только совмещение без доплаты.
           Есть условие о совмещении, но размер доплаты не установлен.
           → presence = "present";
             combined_positions_status = "defined";
             additional_pay_status = "not_defined";
             additional_pay_value = "Данные не определены".

        3. Противоречие между фрагментами.
           В разных частях договора указаны противоречащие условия
           о размере доплаты или сроке совмещения.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             соответствующее *_value = "Не удалось определить".

        4. Отсылка на дополнительное соглашение.
           Условия совмещения и доплаты определяются дополнительным
           соглашением к трудовому договору.
           → presence = "present";
             procedure_status = "defined";
             procedure_value содержит формулировку вида
             «согласно Дополнительному соглашению».
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для combined_work_check_presence используй только: "present", "missing", "unclear".
        - Для всех *_status используй только: "defined" или "not_defined".
        - Fallback при отсутствии данных:
          * все *_value → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_value → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "combined_work_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие условий о совмещении профессий и смежных конструкциях. Внутреннее агрегатное signal-поле."
          required: true

        - name: "combined_positions_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания совмещения профессий (должностей). Внутреннее enum-поле."
          required: true

        - name: "combined_positions_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Совмещение профессий"
          description: >
            Условие о совмещении профессий (должностей). Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "expanded_scope_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус расширения зон / увеличения объёма. Внутреннее enum-поле."
          required: true

        - name: "expanded_scope_value"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Расширение зон"
          description: >
            Условие о расширении зон обслуживания / увеличении объёма. Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "interim_acting_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус исполнения обязанностей временно отсутствующего. Внутреннее enum-поле."
          required: true

        - name: "interim_acting_value"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "И.о. временно отсутствующего"
          description: >
            Условие об исполнении обязанностей временно отсутствующего. Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "additional_pay_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
