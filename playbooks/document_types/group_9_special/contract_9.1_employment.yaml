  - id: term_probation_check
    name: "Дата начала, срок договора, основание срочности и испытательный срок"
    description: >
      Фактографическая проверка даты начала работы, типа договора (бессрочный/срочный),
      срока и основания срочности (ст. 59 ТК РФ), испытательного срока и его длительности.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "дата начала работы"
        - "приступить к работе"
        - "срочный"
        - "на срок"
        - "основание"
        - "ст. 59"
        - "испытательный срок"
        - "испытание"
        - "не более 3 месяцев"
        - "без испытания"
        - "бессрочный"
        - "на неопределённый срок"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"
        - "(?i)срочн[ыо]й\\s+трудов"
        - "(?i)испытательн[ыо]й\\s+срок"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по трудовому праву.
        Анализируется трудовой договор (ст. 57–59, 70 ТК РФ).
        Проверяется только один вопрос: дата начала, срок, основание срочности,
        испытательный срок.
        Нормативный ориентир:
        - ст. 57 ТК РФ — содержание трудового договора (обязательное условие о дате начала)
        - ст. 58 ТК РФ — срок трудового договора
        - ст. 59 ТК РФ — основания срочного трудового договора
        - ст. 70 ТК РФ — испытание при приёме на работу
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска, не подставляй нормы закона вместо текста.
        [ЗАДАЧА]
        Найди в тексте договора:
        1. Дату начала работы.
        2. Тип договора: бессрочный / срочный / не указан.
        3. Срок договора (если срочный).
        4. Основание срочности (конкретный пункт ст. 59 ТК РФ или иное основание).
        5. Наличие испытательного срока (установлен / не установлен / не указано).
        6. Длительность испытательного срока (если установлен).
        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона вместо текста.
        2. Для *_status используй строго "defined" или "not_defined".
        3. Для *_value при отсутствии данных — строго "Данные не определены".
        4. Для contract_type используй строго "indefinite" / "fixed_term" / "not_defined".
        5. Если прямо указано, что испытание не устанавливается — probation_status = "defined",
        probation_duration_value = "не устанавливается".
        6. Если испытание установлено, но длительность не указана —
        probation_duration_value = "Данные не определены".
        7. В evidence включай только текст договора.
        8. Никогда не используй "None", "null", пустые строки или отсутствующие ключи.
        9. Верни РОВНО один валидный JSON-объект со всеми 10 ключами (9 полей + evidence),
        пригодный для парсинга через json.loads без предварительной обработки.
        Без markdown, без ```json, без комментариев, без текста до или после.
        Начни ответ сразу с { и закончи }.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — срочный договор с основанием:
        Фрагмент:
        "Работник обязуется приступить к работе с 01.06.2026. Договор заключён
        на срок до 31.05.2027 в соответствии с абз. 2 ч. 1 ст. 59 ТК РФ
        (на время исполнения обязанностей отсутствующего работника).
        Работнику устанавливается испытательный срок продолжительностью 3 месяца."
        Ответ:
        {
          "start_date_status": "defined",
          "start_date_value": "01.06.2026",
          "contract_type": "fixed_term",
          "term_status": "defined",
          "term_value": "до 31.05.2027",
          "fixed_term_basis_status": "defined",
          "fixed_term_basis_value": "абз. 2 ч. 1 ст. 59 ТК РФ (на время исполнения обязанностей отсутствующего работника)",
          "probation_status": "defined",
          "probation_duration_value": "3 месяца",
          "evidence": [
            {
              "clause_ref": "п. 1.2",
              "quote": "Договор заключён на срок до 31.05.2027 в соответствии с абз. 2 ч. 1 ст. 59 ТК РФ."
            }
          ]
        }
        Пример 2 — бессрочный без испытания:
        Фрагмент:
        "Работник приступает к работе с 15.07.2026. Договор заключён на неопределённый срок.
        Испытание при приёме на работу не устанавливается."
        Ответ:
        {
          "start_date_status": "defined",
          "start_date_value": "15.07.2026",
          "contract_type": "indefinite",
          "term_status": "not_defined",
          "term_value": "Данные не определены",
          "fixed_term_basis_status": "not_defined",
          "fixed_term_basis_value": "Данные не определены",
          "probation_status": "defined",
          "probation_duration_value": "не устанавливается",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "Договор заключён на неопределённый срок."
            }
          ]
        }
        Пример 3 — edge-case: испытание установлено без срока:
        Фрагмент:
        "Работник приступает к работе с 01.09.2026. Работнику устанавливается
        испытание при приёме на работу. Срок договора не указан."
        Ответ:
        {
          "start_date_status": "defined",
          "start_date_value": "01.09.2026",
          "contract_type": "not_defined",
          "term_status": "not_defined",
          "term_value": "Данные не определены",
          "fixed_term_basis_status": "not_defined",
          "fixed_term_basis_value": "Данные не определены",
          "probation_status": "defined",
          "probation_duration_value": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 1.3",
              "quote": "Работнику устанавливается испытание при приёме на работу."
            }
          ]
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Проверь, что все 10 ключей (9 полей + evidence) присутствуют в JSON.
        2. Проверь, что каждый *_status ∈ {"defined", "not_defined"}, а каждый *_value
        при отсутствии данных = "Данные не определены".
        3. Проверь, что contract_type ∈ {"indefinite", "fixed_term", "not_defined"}.
        4. Проверь, что для каждого defined-поля в evidence есть прямая цитата из договора.
        5. Убедись, что основание срочности не выдумано, а прямо указано в тексте
        (пункт ст. 59 ТК РФ или иное основание).
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "start_date_status": "<defined / not_defined>",
          "start_date_value": "<дата или 'Данные не определены'>",
          "contract_type": "<indefinite / fixed_term / not_defined>",
          "term_status": "<defined / not_defined>",
          "term_value": "<срок или 'Данные не определены'>",
          "fixed_term_basis_status": "<defined / not_defined>",
          "fixed_term_basis_value": "<основание или 'Данные не определены'>",
          "probation_status": "<defined / not_defined>",
          "probation_duration_value": "<срок / 'не устанавливается' / 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 800

    retrieval:
      retrieval_profile: "term_and_renewal_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "дата начала работы приступить к работе срочный бессрочный на срок основание ст. 59 ТК РФ испытательный срок испытание не более 3 месяцев без испытания на неопределённый срок"
      preferred_unit_types:
        - obligation
        - general_provision
        - definition
      excluded_unit_types:
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - definitions
        - obligations
      boost_keywords:
        - "приступить к работе"
        - "на неопределённый срок"
        - "срочный трудовой договор"
        - "испытательный срок"
      negative_keywords:
        - "заработная плата"
        - "оклад"
        - "отпуск"
        - "рабочее время"
        - "увольнение"
        - "расторжение"
        - "материальная ответственность"
        - "конфиденциальность"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 0.35]
        boost: 0.20
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "definitions"
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1200

      compact_output: false

      presence_signal:
        field: "term_probation_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по трудовому праву. Извлеки из трудового договора
        дату начала работы, тип договора, срок, основание срочности, испытательный срок.
        Не анализируй оплату труда, отпуск, рабочее время или расторжение.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 9 полей + evidence (всего 10 ключей):

        0. term_probation_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (start_date_status, contract_type, term_status,
              fixed_term_basis_status, probation_status) ≠ "not_defined";
           - "missing" — если все пять содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - start_date_status = "not_defined";
           - contract_type = "not_defined";
           - term_status = "not_defined";
           - fixed_term_basis_status = "not_defined";
           - probation_status = "not_defined";
           - start_date_value, term_value, fixed_term_basis_value,
             probation_duration_value = "Данные не определены";
           - не выполняй остальные шаги.

        1. start_date_status — "defined" или "not_defined".
        2. start_date_value — дата начала работы.
        3. contract_type — "indefinite" / "fixed_term" / "not_defined".
        4. term_status — "defined" или "not_defined".
        5. term_value — срок договора (для срочного).
        6. fixed_term_basis_status — "defined" или "not_defined".
        7. fixed_term_basis_value — основание срочности.
        8. probation_status — "defined" или "not_defined".
        9. probation_duration_value — длительность испытания.

        Если данные отсутствуют:
        - для *_status — "not_defined"
        - для *_value — "Данные не определены"
        - для contract_type — "not_defined"
        </task>

        <context_rules>
        - Перед остальными полями заполни term_probation_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_value = "Данные не определены", contract_type = "not_defined".
        - Используй только текст договора.
        - contract_type = "fixed_term" если прямо указан срок; "indefinite" если прямо
          указано "бессрочный" или "на неопределённый срок"; иначе "not_defined".
        - probation_status = "defined" если прямо указано об испытании или его отсутствии.
        - Если прямо указано, что испытание не устанавливается —
          probation_status = "defined", probation_duration_value = "не устанавливается".
        - Если испытание установлено, но длительность не указана —
          probation_duration_value = "Данные не определены".
        - Для отсылок к приложениям или локальным актам используй значение в *_value
          как есть ("согласно <ссылка>").
        - Если в разных фрагментах указаны разные данные и конфликт нельзя
          разрешить по тексту — статус → "not_defined", значение → "Не удалось определить".
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни даты начала, ни типа договора, ни срока,
           ни основания срочности, ни испытательного срока.
           → presence = "missing";
             все *_status = "not_defined";
             все *_value = "Данные не определены";
             contract_type = "not_defined".

        2. Срочный договор без основания срочности.
           Указан срок договора, но не указано основание срочности по ст. 59 ТК РФ.
           → presence = "present";
             contract_type = "fixed_term";
             term_status = "defined";
             fixed_term_basis_status = "not_defined";
             fixed_term_basis_value = "Данные не определены".

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные даты начала работы
           или разные сроки.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             соответствующее *_value = "Не удалось определить".

        4. Испытание установлено, но длительность не указана.
           Прямо сказано об установлении испытания, но срок не указан.
           → presence = "present";
             probation_status = "defined";
             probation_duration_value = "Данные не определены".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для term_probation_check_presence используй только: "present", "missing", "unclear".
        - Для всех *_status используй только: "defined" или "not_defined".
        - Для contract_type используй только:
          "indefinite", "fixed_term", "not_defined".
        - Fallback при отсутствии данных:
          * все *_value → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_value → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "term_probation_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие условий о дате начала, сроке и испытательном сроке. Внутреннее агрегатное signal-поле."
          required: true

        - name: "start_date_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус определения даты начала работы. Внутреннее enum-поле."
          required: true

        - name: "start_date_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Дата начала работы"
          description: >
            Дата начала работы. Fallback: "Не установлено" / "Не удалось определить".
          required: true

        - name: "contract_type"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["indefinite", "fixed_term", "not_defined"]
          display_in_grid: false
          description: "Тип договора: бессрочный / срочный / не определён. Внутреннее enum-поле."
          required: true

        - name: "term_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус определения срока. Внутреннее enum-поле."
          required: true

        - name: "term_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Срок договора"
          description: >
            Срок договора (для срочного). Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "fixed_term_basis_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус основания срочности. Внутреннее enum-поле."
          required: true

        - name: "fixed_term_basis_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Основание срочности"
          description: >
            Основание срочности по ст. 59 ТК РФ. Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "probation_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус испытательного срока. Внутреннее enum-поле."
          required: true

        - name: "probation_duration_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 4
          label: "Испытательный срок"
          description: >
            Длительность испытательного срока. Fallback: "Не установлено" / "Не удалось определить".
          required: false

      store_payload: true

  - id: payment_structure_check
    name: "Структура оплаты труда: оклад, надбавки, премии, сроки выплаты"
    description: >
      Фактографическая проверка оклада/тарифной ставки, доплат, надбавок, премий,
      конкретных дат выплаты заработной платы, периодичности выплаты, индексации
      и формы оплаты труда.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "оклад"
        - "тарифная ставка"
        - "заработная плата"
        - "премия"
        - "надбавка"
        - "доплата"
        - "два раза в месяц"
        - "не реже чем каждые полмесяца"
        - "выплата заработной платы"
        - "аванс"
        - "расчётный листок"
        - "индексация"
        - "форма оплаты"
        - "натуральная форма"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽)"
        - "(?i)оклад.*\\d"
        - "(?i)два\\s+раз[аа]\\s+в\\s+месяц"
        - "(?i)индексаци"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по трудовому праву.
        Анализируется трудовой договор (ст. 129, 131, 134, 135, 136 ТК РФ).
        Проверяется только один вопрос: структура оплаты труда.
        Нормативный ориентир:
        - ст. 129 ТК РФ — понятие заработной платы, оклада, доплат, надбавок
        - ст. 131 ТК РФ — форма выплаты (доля неденежной формы не выше 20%)
        - ст. 134 ТК РФ — индексация заработной платы (обязательна для всех работодателей)
        - ст. 135 ТК РФ — установление заработной платы
        - ст. 136 ТК РФ — порядок, место и сроки выплаты (не реже чем каждые полмесяца)
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Не сравнивай сумму с МРОТ — только извлеки факты.
        [ЗАДАЧА]
        Найди в тексте договора:
        1. Оклад или тарифную ставку (сумма или отсылка к документу).
        2. Доплаты и надбавки (суммы / проценты / отсылка).
        3. Премии и порядок премирования (периодичность, основания, отсылка).
        4. Конкретные даты выплаты заработной платы.
        5. Периодичность выплаты (включая формулировку "не реже чем каждые полмесяца").
        6. Условие об индексации заработной платы.
        7. Форму оплаты труда (денежная / смешанная, доля неденежной части).
        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона вместо текста.
        2. Для *_status используй строго "defined" или "not_defined".
        3. Для *_value при отсутствии данных — строго "Данные не определены".
        4. Если оклад/надбавки/премии определяются через отсылку к документу
        (штатное расписание, Положение об оплате труда, Положение о премировании,
        Приложение), фиксируй это как "defined" со значением «согласно <документ>».
        5. Если прямо указано, что надбавки/премии не устанавливаются —
        соответствующий *_status = "defined", *_value = "не устанавливаются".
        6. Если указана только формулировка "не реже чем каждые полмесяца"
        без конкретных дат — payment_dates_status = "not_defined",
        payment_dates_value = "Данные не определены",
        payment_frequency_status = "defined",
        payment_frequency_value = "не реже чем каждые полмесяца".
        7. indexation_* фиксирует наличие условия об индексации (ст. 134 ТК РФ).
        Если порядок индексации определён отсылкой к ЛНА — фиксируй как "defined"
        со значением «согласно <документ>».
        8. payment_form_* фиксирует форму оплаты. "денежная" если не указано иное;
        "смешанная" если есть доля неденежной формы; доля неденежной части
        не должна превышать 20% (ст. 131 ТК РФ).
        9. В evidence включай только текст договора.
        10. Никогда не используй "None", "null", пустые строки или отсутствующие ключи.
        11. Верни РОВНО один валидный JSON-объект со всеми 15 ключами (14 полей + evidence),
        пригодный для парсинга через json.loads без предварительной обработки.
        Без markdown, без ```json, без комментариев, без текста до или после.
        Начни ответ сразу с { и закончи }.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — полная структура:
        Фрагмент:
        "Работнику устанавливается оклад в размере 85 000 рублей в месяц.
        Надбавка за выслугу лет — 10% оклада. Премия по итогам квартала —
        согласно Положению о премировании. Заработная плата выплачивается
        10-го и 25-го числа каждого месяца. Индексация заработной платы
        производится ежегодно в порядке, установленном Положением об оплате труда."
        Ответ:
        {
          "base_salary_status": "defined",
          "base_salary_value": "85 000 рублей в месяц",
          "allowances_status": "defined",
          "allowances_value": "надбавка за выслугу лет — 10% оклада",
          "bonuses_status": "defined",
          "bonuses_value": "премия по итогам квартала согласно Положению о премировании",
          "payment_dates_status": "defined",
          "payment_dates_value": "10-го и 25-го числа каждого месяца",
          "payment_frequency_status": "defined",
          "payment_frequency_value": "два раза в месяц",
          "indexation_status": "defined",
          "indexation_value": "ежегодно, согласно Положению об оплате труда",
          "payment_form_status": "not_defined",
          "payment_form_value": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 3.1",
              "quote": "Работнику устанавливается оклад в размере 85 000 рублей в месяц."
            }
          ]
        }
        Пример 2 — отсылка к документу, смешанная форма:
        Фрагмент:
        "Оклад работника определяется согласно штатному расписанию.
        До 15% заработной платы может выплачиваться в натуральной форме.
        Заработная плата выплачивается не реже чем каждые полмесяца.
        Индексация не предусмотрена."
        Ответ:
        {
          "base_salary_status": "defined",
          "base_salary_value": "согласно штатному расписанию",
          "allowances_status": "not_defined",
          "allowances_value": "Данные не определены",
          "bonuses_status": "not_defined",
          "bonuses_value": "Данные не определены",
          "payment_dates_status": "not_defined",
          "payment_dates_value": "Данные не определены",
          "payment_frequency_status": "defined",
          "payment_frequency_value": "не реже чем каждые полмесяца",
          "indexation_status": "defined",
          "indexation_value": "не предусмотрена",
          "payment_form_status": "defined",
          "payment_form_value": "смешанная, доля неденежной формы — до 15%",
          "evidence": [
            {
              "clause_ref": "п. 3.2",
              "quote": "Оклад работника определяется согласно штатному расписанию."
            }
          ]
        }
        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Оплата труда производится в соответствии с действующим законодательством."
        Ответ:
        {
          "base_salary_status": "not_defined",
          "base_salary_value": "Данные не определены",
          "allowances_status": "not_defined",
          "allowances_value": "Данные не определены",
          "bonuses_status": "not_defined",
          "bonuses_value": "Данные не определены",
          "payment_dates_status": "not_defined",
          "payment_dates_value": "Данные не определены",
          "payment_frequency_status": "not_defined",
          "payment_frequency_value": "Данные не определены",
          "indexation_status": "not_defined",
          "indexation_value": "Данные не определены",
          "payment_form_status": "not_defined",
          "payment_form_value": "Данные не определены",
          "evidence": []
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Проверь, что все 15 ключей (14 полей + evidence) присутствуют в JSON.
        2. Проверь, что каждый *_status ∈ {"defined", "not_defined"}, а каждый *_value
        при отсутствии данных = "Данные не определены".
        3. Проверь, что для каждого defined-поля в evidence есть прямая цитата из договора.
        4. Убедись, что формулировка "не реже чем каждые полмесяца" отнесена
        к payment_frequency_value, а не к payment_dates_value.
        5. Убедись, что отсылки к штатному расписанию / Положению об оплате труда /
        Положению о премировании фиксированы как defined со значением «согласно <документ>».
        6. Убедись, что доля неденежной формы при смешанной оплате не превышает 20%
        (ст. 131 ТК РФ) — если превышает, отрази это в payment_form_value как есть.
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "base_salary_status": "<defined / not_defined>",
          "base_salary_value": "<сумма / 'согласно <документ>' / 'Данные не определены'>",
          "allowances_status": "<defined / not_defined>",
          "allowances_value": "<текст / 'не устанавливаются' / 'Данные не определены'>",
          "bonuses_status": "<defined / not_defined>",
          "bonuses_value": "<текст / 'не устанавливаются' / 'Данные не определены'>",
          "payment_dates_status": "<defined / not_defined>",
          "payment_dates_value": "<даты / 'Данные не определены'>",
          "payment_frequency_status": "<defined / not_defined>",
          "payment_frequency_value": "<периодичность / 'Данные не определены'>",
          "indexation_status": "<defined / not_defined>",
          "indexation_value": "<порядок / 'не предусмотрена' / 'согласно <документ>' / 'Данные не определены'>",
          "payment_form_status": "<defined / not_defined>",
          "payment_form_value": "<'денежная' / 'смешанная, доля неденежной — <X>%' / 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 7
      temperature: 0.0
      max_tokens: 950

    retrieval:
      retrieval_profile: "payment_terms_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "оклад тарифная ставка заработная плата премия надбавка доплата два раза в месяц не реже чем каждые полмесяца выплата заработной платы аванс расчётный листок штатное расписание положение об оплате труда индексация форма оплаты денежная смешанная доля неденежной"
      preferred_unit_types:
        - payment_term
        - obligation
        - general_provision
      excluded_unit_types:
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      boost_keywords:
        - "оклад"
        - "тарифная ставка"
        - "не реже чем каждые полмесяца"
        - "Положение об оплате труда"
        - "штатное расписание"
        - "индексация"
        - "форма оплаты"
      negative_keywords:
        - "трудовая функция"
        - "место работы"
        - "отпуск"
        - "рабочее время"
        - "увольнение"
        - "расторжение"
        - "материальная ответственность"
        - "конфиденциальность"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.15, 0.55]
        boost: 0.30
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 700

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1450

      compact_output: false

      presence_signal:
        field: "payment_structure_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по трудовому праву. Извлеки из трудового договора
        структуру оплаты труда: оклад, доплаты, надбавки, премии, даты выплаты,
        индексацию, форму оплаты.
        Не анализируй рабочее время, отпуск, расторжение или охрану труда.
        Не сравнивай суммы с МРОТ.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 14 полей + evidence (всего 15 ключей):

        0. payment_structure_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (base_salary_status, allowances_status, bonuses_status,
              payment_dates_status, payment_frequency_status,
              indexation_status, payment_form_status) ≠ "not_defined";
           - "missing" — если все семь содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - все *_status = "not_defined";
           - все *_value = "Данные не определены";
           - не выполняй остальные шаги.

        1. base_salary_status — "defined" или "not_defined".
        2. base_salary_value — оклад/тарифная ставка (или отсылка к документу).
        3. allowances_status — "defined" или "not_defined".
        4. allowances_value — доплаты и надбавки.
        5. bonuses_status — "defined" или "not_defined".
        6. bonuses_value — премии и порядок премирования.
        7. payment_dates_status — "defined" или "not_defined".
        8. payment_dates_value — конкретные даты выплаты.
        9. payment_frequency_status — "defined" или "not_defined".
        10. payment_frequency_value — периодичность выплаты.
        11. indexation_status — "defined" или "not_defined".
        12. indexation_value — порядок / периодичность индексации.
        13. payment_form_status — "defined" или "not_defined".
        14. payment_form_value — форма оплаты и доля неденежной части.

        Если данные отсутствуют:
        - для *_status — "not_defined"
        - для *_value — "Данные не определены"
        </task>

        <context_rules>
        - Перед остальными полями заполни payment_structure_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_value = "Данные не определены".
        - Используй только текст договора.
        - Не сравнивай суммы с МРОТ.
        - Не делай выводов о достаточности оплаты.
        - Если оклад/надбавки/премии определяются через отсылку к документу
          (штатное расписание, Положение об оплате труда, Положение о премировании,
          Приложение) — фиксируй это как "defined" со значением «согласно <документ>».
        - Если прямо указано, что надбавки или премии не устанавливаются —
          соответствующий *_status = "defined", *_value = "не устанавливаются".
        - Если указана только формулировка "не реже чем каждые полмесяца"
          без конкретных дат — payment_dates_status = "not_defined",
          payment_frequency_status = "defined",
          payment_frequency_value = "не реже чем каждые полмесяца".
        - indexation_* фиксирует наличие условия об индексации (ст. 134 ТК РФ).
          Если указано "индексация не предусмотрена" — status = "defined",
          value = "не предусмотрена". Если отсылка к ЛНА — "согласно <документ>".
        - payment_form_* фиксирует форму оплаты. "денежная" если не указано иное;
          "смешанная, доля неденежной — <X>%" если указана доля неденежной формы.
        - Если в разных фрагментах указаны разные данные и конфликт нельзя
          разрешить по тексту — статус → "not_defined", значение → "Не удалось определить".
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни оклада, ни надбавок, ни премий, ни дат выплаты,
           ни индексации, ни формы оплаты.
           → presence = "missing";
             все *_status = "not_defined";
             все *_value = "Данные не определены".

        2. Указан только оклад без деталей.
           Есть сумма оклада, но нет надбавок, премий, сроков выплаты,
           индексации и формы.
           → presence = "present";
             base_salary_status = "defined";
             allowances_status = "not_defined";
             bonuses_status = "not_defined";
             payment_dates_status = "not_defined";
             payment_frequency_status = "not_defined";
             indexation_status = "not_defined";
             payment_form_status = "not_defined";
             соответствующие *_value = "Данные не определены".

        3. Противоречие между фрагментами.
           В разных пунктах указаны разные суммы оклада
           или разные даты выплаты.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             соответствующее *_value = "Не удалось определить".

        4. Отсылка на штатное расписание / Положение об оплате труда.
           Оклад или порядок премирования определяется штатным расписанием
           или Положением об оплате труда / премировании.
           → presence = "present";
             base_salary_status = "defined";
             base_salary_value содержит формулировку вида
             «согласно штатному расписанию».
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для payment_structure_check_presence используй только: "present", "missing", "unclear".
        - Для всех *_status используй только: "defined" или "not_defined".
        - Fallback при отсутствии данных:
          * все *_value → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_value → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "payment_structure_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие условий об оплате труда. Внутреннее агрегатное signal-поле."
          required: true

        - name: "base_salary_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус определения оклада. Внутреннее enum-поле."
          required: true

        - name: "base_salary_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Оклад / тарифная ставка"
          description: >
            Оклад или тарифная ставка. Fallback: "Не установлено" / "Не удалось определить".
          required: true

        - name: "allowances_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус доплат и надбавок. Внутреннее enum-поле."
          required: true

        - name: "allowances_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Доплаты и надбавки"
          description: >
            Доплаты и надбавки. Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "bonuses_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус премий. Внутреннее enum-поле."
          required: true

        - name: "bonuses_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Премии"
          description: >
            Премии и порядок премирования. Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "payment_dates_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус конкретных дат выплаты. Внутреннее enum-поле."
          required: true

        - name: "payment_dates_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 4
          label: "Даты выплаты"
          description: >
            Конкретные даты выплаты заработной платы. Fallback: "Не установлено" / "Не удалось определить".
          required: true

        - name: "payment_frequency_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус периодичности выплаты. Внутреннее enum-поле."
          required: true

        - name: "payment_frequency_value"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Периодичность выплаты"
          description: >
            Периодичность выплаты заработной платы. Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "indexation_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус условия об индексации заработной платы. Внутреннее enum-поле."
          required: true

        - name: "indexation_value"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Индексация"
          description: >
            Порядок и периодичность индексации заработной платы. Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "payment_form_status"
          type: "string"
          presentation: "signal"
          risk_weight: "low"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус формы оплаты труда. Внутреннее enum-поле."
          required: true

        - name: "payment_form_value"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Форма оплаты"
          description: >
            Форма оплаты (денежная / смешанная) и доля неденежной части. Fallback: "Не установлено" / "Не удалось определить".
          required: false

      store_payload: true

  - id: working_hours_leave_check
    name: "Режим рабочего времени, время отдыха и ежегодный отпуск"
    description: >
      Фактографическая проверка продолжительности рабочего времени, графика,
      перерывов, выходных, ненормированного дня, ежегодного оплачиваемого отпуска,
      дополнительных отпусков, компенсации сверхурочной работы.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "режим рабочего времени"
        - "продолжительность рабочего времени"
        - "график работы"
        - "40 часов в неделю"
        - "сменный график"
        - "суммированный учёт рабочего времени"
        - "ненормированный рабочий день"
        - "перерыв"
        - "выходные дни"
        - "ежегодный оплачиваемый отпуск"
        - "отпуск продолжительностью"
        - "28 календарных дней"
        - "дополнительный отпуск"
        - "сверхурочная работа"
        - "работа в выходные"
        - "повышенная оплата"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)\\d+\\s+час[оа]в\\s+в\\s+неделю"
        - "(?i)\\d+\\s+календарн[а-яё]+\\s+дн[еей]+"
        - "(?i)ненормированн[ыо]й\\s+рабоч[иоя]+\\s+день"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по трудовому праву.
        Анализируется трудовой договор (ст. 91, 100, 101, 104, 108, 111, 115–117, 152 ТК РФ).
        Проверяется только один вопрос: рабочее время, отдых и отпуск.
        Нормативный ориентир:
        - ст. 91 ТК РФ — понятие рабочего времени, нормальная продолжительность (40 часов в неделю)
        - ст. 100 ТК РФ — режим рабочего времени
        - ст. 101 ТК РФ — ненормированный рабочий день
        - ст. 104 ТК РФ — суммированный учёт рабочего времени
        - ст. 108 ТК РФ — перерывы в течение рабочего дня
        - ст. 111 ТК РФ — выходные дни
        - ст. 115 ТК РФ — ежегодный основной оплачиваемый отпуск (не менее 28 календарных дней)
        - ст. 116–117 ТК РФ — ежегодные дополнительные отпуска
        - ст. 152 ТК РФ — оплата сверхурочной работы
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Не выводи 40 часов и 28 дней из закона — только из текста договора.
        [ЗАДАЧА]
        Найди в тексте договора:
        1. Продолжительность рабочего времени в неделю.
        2. График работы (пятидневка, сменный, суммированный учёт).
        3. Указание на ненормированный рабочий день.
        4. Перерывы в течение рабочего дня.
        5. Выходные дни.
        6. Продолжительность ежегодного оплачиваемого отпуска.
        7. Дополнительные отпуска.
        8. Условия сверхурочной работы и её компенсации.
        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона вместо текста.
        2. Для *_status используй строго "defined" или "not_defined".
        3. Для *_value при отсутствии данных — строго "Данные не определены".
        4. Не выводи 40 часов в неделю из ст. 91 ТК РФ — только из текста договора.
        5. Не выводи 28 календарных дней из ст. 115 ТК РФ — только из текста договора.
        6. Если режим рабочего времени определяется через отсылку к документу
        (ПВТР, коллективный договор, график работы, Приложение) — фиксируй это
        как "defined" со значением «согласно <документ>».
        7. Если прямо указано, что дополнительные отпуска или сверхурочные
        не устанавливаются (не предусмотрены) — соответствующий *_status = "defined",
        *_value = "не устанавливаются".
        8. В evidence включай только текст договора.
        9. Верни РОВНО один валидный JSON-объект со всеми 15 ключами (14 полей + evidence),
        пригодный для парсинга через json.loads без предварительной обработки.
        Без markdown, без ```json, без комментариев, без текста до или после.
        Начни ответ сразу с { и закончи }.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — полная конкретика:
        Фрагмент:
        "Работнику устанавливается пятидневная рабочая неделя продолжительностью
        40 часов. Выходные дни — суббота, воскресенье. Перерыв для отдыха
        и питания — 1 час в течение рабочего дня. Ежегодный оплачиваемый
        отпуск — 28 календарных дней. Дополнительный отпуск за ненормированный
        рабочий день — 3 календарных дня."
        Ответ:
        {
          "working_hours_status": "defined",
          "working_hours_value": "40 часов в неделю",
          "schedule_status": "defined",
          "schedule_value": "пятидневная рабочая неделя",
          "irregular_hours_status": "defined",
          "irregular_hours_value": "ненормированный рабочий день",
          "breaks_status": "defined",
          "breaks_value": "перерыв для отдыха и питания — 1 час в течение рабочего дня",
          "weekends_status": "defined",
          "weekends_value": "суббота, воскресенье",
          "annual_leave_status": "defined",
          "annual_leave_value": "28 календарных дней",
          "additional_leave_status": "defined",
          "additional_leave_value": "дополнительный отпуск за ненормированный рабочий день — 3 календарных дня",
          "overtime_status": "not_defined",
          "overtime_value": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 4.1",
              "quote": "Работнику устанавливается пятидневная рабочая неделя продолжительностью 40 часов."
            }
          ]
        }
        Пример 2 — отсылка к ПВТР, доп. отпуска не устанавливаются:
        Фрагмент:
        "Режим рабочего времени работника определяется Правилами внутреннего
        трудового распорядка. Дополнительные отпуска работнику не устанавливаются."
        Ответ:
        {
          "working_hours_status": "not_defined",
          "working_hours_value": "Данные не определены",
          "schedule_status": "defined",
          "schedule_value": "согласно Правилам внутреннего трудового распорядка",
          "irregular_hours_status": "not_defined",
          "irregular_hours_value": "Данные не определены",
          "breaks_status": "not_defined",
          "breaks_value": "Данные не определены",
          "weekends_status": "not_defined",
          "weekends_value": "Данные не определены",
          "annual_leave_status": "not_defined",
          "annual_leave_value": "Данные не определены",
          "additional_leave_status": "defined",
          "additional_leave_value": "не устанавливаются",
          "overtime_status": "not_defined",
          "overtime_value": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 4.2",
