        4. Убедись, что ОМС не отнесён к dms_*.
        5. Убедись, что отсылки к Положению о соцпакете / Коллективному договору
        фиксированы как defined со значением «согласно <документ>».
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "dms_status": "<defined / not_defined>",
          "dms_value": "<текст / 'согласно <документ>' / 'не предусмотрено' / 'Данные не определены'>",
          "other_benefits_status": "<defined / not_defined>",
          "other_benefits_value": "<текст / 'согласно <документ>' / 'не предусмотрены' / 'Данные не определены'>",
          "benefits_lna_ref_status": "<defined / not_defined>",
          "benefits_lna_ref_value": "<текст / 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 750

