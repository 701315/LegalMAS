  - id: working_hours_leave_check
    name: "Режим рабочего времени, время отдыха и ежегодный отпуск"
    description: >
      Фактографическая проверка продолжительности рабочего времени, графика,
      перерывов, выходных, ненормированного дня, ежегодного оплачиваемого отпуска,
      дополнительных отпусков, компенсации сверхурочной работы.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "режим рабочего времени"
        - "продолжительность рабочего времени"
        - "график работы"
        - "40 часов в неделю"
        - "сменный график"
        - "суммированный учёт рабочего времени"
        - "ненормированный рабочий день"
        - "перерыв"
        - "выходные дни"
        - "ежегодный оплачиваемый отпуск"
        - "отпуск продолжительностью"
        - "28 календарных дней"
        - "дополнительный отпуск"
        - "сверхурочная работа"
        - "работа в выходные"
        - "повышенная оплата"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)\\d+\\s+час[оа]в\\s+в\\s+неделю"
        - "(?i)\\d+\\s+календарн[а-яё]+\\s+дн[еей]+"
        - "(?i)ненормированн[ыо]й\\s+рабоч[иоя]+\\s+день"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по трудовому праву.
        Анализируется трудовой договор (ст. 91, 100, 101, 104, 108, 111, 115–117, 152 ТК РФ).
        Проверяется только один вопрос: рабочее время, отдых и отпуск.
        Нормативный ориентир:
        - ст. 91 ТК РФ — понятие рабочего времени, нормальная продолжительность (40 часов в неделю)
        - ст. 100 ТК РФ — режим рабочего времени
        - ст. 101 ТК РФ — ненормированный рабочий день
        - ст. 104 ТК РФ — суммированный учёт рабочего времени
        - ст. 108 ТК РФ — перерывы в течение рабочего дня
        - ст. 111 ТК РФ — выходные дни
        - ст. 115 ТК РФ — ежегодный основной оплачиваемый отпуск (не менее 28 календарных дней)
        - ст. 116–117 ТК РФ — ежегодные дополнительные отпуска
        - ст. 152 ТК РФ — оплата сверхурочной работы
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Не выводи 40 часов и 28 дней из закона — только из текста договора.
        [ЗАДАЧА]
        Найди в тексте договора:
        1. Продолжительность рабочего времени в неделю.
        2. График работы (пятидневка, сменный, суммированный учёт).
        3. Указание на ненормированный рабочий день.
        4. Перерывы в течение рабочего дня.
        5. Выходные дни.
        6. Продолжительность ежегодного оплачиваемого отпуска.
        7. Дополнительные отпуска.
        8. Условия сверхурочной работы и её компенсации.
        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона вместо текста.
        2. Для *_status используй строго "defined" или "not_defined".
        3. Для *_value при отсутствии данных — строго "Данные не определены".
        4. Не выводи 40 часов в неделю из ст. 91 ТК РФ — только из текста договора.
        5. Не выводи 28 календарных дней из ст. 115 ТК РФ — только из текста договора.
        6. Если режим рабочего времени определяется через отсылку к документу
        (ПВТР, коллективный договор, график работы, Приложение) — фиксируй это
        как "defined" со значением «согласно <документ>».
        7. Если прямо указано, что дополнительные отпуска или сверхурочные
        не устанавливаются (не предусмотрены) — соответствующий *_status = "defined",
        *_value = "не устанавливаются".
        8. В evidence включай только текст договора.
        9. Верни РОВНО один валидный JSON-объект со всеми 15 ключами (14 полей + evidence),
        пригодный для парсинга через json.loads без предварительной обработки.
        Без markdown, без ```json, без комментариев, без текста до или после.
