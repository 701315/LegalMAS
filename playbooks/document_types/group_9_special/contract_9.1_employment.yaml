          "dispute_resolution_status": "<defined / not_defined>",
          "dispute_resolution_value": "<текст или 'Данные не определены'>",
          "collective_agreement_status": "<defined / not_defined>",
          "collective_agreement_value": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
