      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1000

      compact_output: false

      presence_signal:
        field: "benefits_and_social_package_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по трудовому праву. Извлеки из трудового договора
        сведения о соцпакете: ДМС, иных льготах, отсылках к ЛНА.
        Не анализируй оклад, режим работы, отпуск или расторжение.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 6 полей + evidence (всего 7 ключей):

        0. benefits_and_social_package_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (dms_status, other_benefits_status,
              benefits_lna_ref_status) ≠ "not_defined";
           - "missing" — если все три содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - все три *_status = "not_defined";
           - все *_value = "Данные не определены";
           - не выполняй остальные шаги.

        1. dms_status — "defined" или "not_defined".
        2. dms_value — условие о ДМС.
        3. other_benefits_status — "defined" или "not_defined".
        4. other_benefits_value — иные льготы.
        5. benefits_lna_ref_status — "defined" или "not_defined".
        6. benefits_lna_ref_value — отсылки к ЛНА / Положению о соцпакете.

        Если данные отсутствуют:
        - для *_status — "not_defined"
        - для *_value — "Данные не определены"
        </task>

        <context_rules>
        - Перед остальными полями заполни benefits_and_social_package_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_value = "Данные не определены".
        - Используй только текст договора.
        - dms_* фиксирует только добровольное медицинское страхование.
          ОМС — не относится к ДМС.
        - other_benefits_* — питание, фитнес, матпомощь, оплата обучения,
          льготное кредитование и т.п.
        - benefits_lna_ref_* — отсылки к Положению о соцпакете, ЛНА, Коллективному договору.
        - Если прямо указано, что льготы не предусмотрены — status = "defined",
          value = "не предусмотрены".
        - Если в разных фрагментах указаны разные данные и конфликт нельзя
          разрешить по тексту — статус → "not_defined", значение → "Не удалось определить".
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни ДМС, ни иных льгот,
           ни отсылок к ЛНА о соцпакете.
           → presence = "missing";
             все три *_status = "not_defined";
             все *_value = "Данные не определены".

        2. Указан только ДМС.
           Указан ДМС, но иные льготы и отсылки к ЛНА не упомянуты.
           → presence = "present";
             dms_status = "defined";
             other_benefits_status = "not_defined";
             benefits_lna_ref_status = "not_defined";
             соответствующие *_value = "Данные не определены".

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные условия ДМС
           или противоречащие перечни льгот.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             соответствующее *_value = "Не удалось определить".

        4. Льготы определяются отсылкой к Положению о соцпакете.
           Перечень льгот определяется Положением о соцпакете,
           Коллективным договором или Приложением.
           → presence = "present";
             benefits_lna_ref_status = "defined";
             benefits_lna_ref_value содержит формулировку вида
             «согласно Положению о соцпакете».
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для benefits_and_social_package_check_presence используй только: "present", "missing", "unclear".
        - Для всех *_status используй только: "defined" или "not_defined".
        - Fallback при отсутствии данных:
          * все *_value → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_value → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "benefits_and_social_package_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие условий о соцпакете и льготах. Внутреннее агрегатное signal-поле."
          required: true

        - name: "dms_status"
