          required: false
        - name: "disclosure_liability_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус ответственности за разглашение."
          required: false
        - name: "disclosure_liability_value"
          type: "string"
          presentation: "fact"
