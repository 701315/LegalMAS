      store_payload: true

  - id: pregnant_and_family_check
    name: "Гарантии беременным и лицам с семейными обязанностями"
    description: >
      Фактографическая проверка специальных гарантий для беременных женщин
      и работников с семейными обязанностями (ст. 93, 96, 99, 113, 125, 126,
      253–264 ТК РФ): категория, неполное рабочее время, ограничения работ,
      отпуска по БиР и уходу за ребёнком, гарантии при расторжении,
      дополнительные льготы.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "беременная"
        - "беременность"
        - "ребёнок"
        - "дети"
        - "семейные обязанности"
        - "отпуск по беременности"
        - "отпуск по уходу"
        - "декретный"
        - "кормление"
        - "многодетная"
        - "ребёнок-инвалид"
        - "одинокая мать"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)беременн"
        - "(?i)отпуск[а-яё]*\\s+по\\s+(беременност|уходу)"
        - "(?i)реб[её]нок[\\s-]инвалид"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по трудовому праву.
        Анализируется трудовой договор с беременной женщиной или лицом
        с семейными обязанностями.
        Проверяется только один вопрос: специальные гарантии для беременных
        и лиц с семейными обязанностями.
        Нормативный ориентир:
        - ст. 93 ТК РФ — неполное рабочее время (по просьбе беременной,
        одного из родителей с ребёнком до 14 лет, ребёнком-инвалидом до 18 лет)
        - ст. 96 ТК РФ — ограничения работы в ночное время
        - ст. 99 ТК РФ — ограничения сверхурочной работы
        - ст. 113 ТК РФ — ограничения работы в выходные и праздничные
        - ст. 125 ТК РФ — отзыв из отпуска (запрещён беременным)
        - ст. 126 ТК РФ — замена отпуска денежной компенсацией (запрещена беременным)
        - ст. 253 ТК РФ — ограничение труда женщин на тяжёлых работах
        - ст. 254 ТК РФ — перевод на другую работу
        - ст. 255–256 ТК РФ — отпуск по беременности и родам, отпуск по уходу за ребёнком
        - ст. 258 ТК РФ — дополнительные перерывы для кормления
        - ст. 259 ТК РФ — гарантии беременным при направлении в командировки
        - ст. 261 ТК РФ — гарантии при расторжении
        - ст. 262 ТК РФ — дополнительные выходные для родителей детей-инвалидов
        - ст. 262.1, 262.2 ТК РФ — гарантии для многодетных
        - ст. 263 ТК РФ — дополнительный отпуск без сохранения зарплаты
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска, не подставляй нормы закона вместо текста.
        - Определяй категорию по прямым указаниям в тексте, без домыслов.
        [ЗАДАЧА]
        Найди в тексте договора:
        1. Категорию работника (беременная / с детьми / с семейными обязанностями).
        2. Семейное положение и наличие детей.
        3. Неполное рабочее время.
        4. Ограничения на ночные / сверхурочные / командировки.
        5. Отпуск по беременности и родам.
        6. Отпуск по уходу за ребёнком.
        7. Гарантии при расторжении трудового договора.
        8. Дополнительные льготы (дополнительные выходные, перерывы, допотпуск).
        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона вместо текста.
        2. Для *_status используй строго "defined" или "not_defined".
        3. Для *_value при отсутствии данных — строго "Данные не определены".
        4. category_type_* фиксирует категорию: "pregnant" / "with_children" /
        "family_duties" / "not_defined".
        5. family_status_* фиксирует семейное положение и наличие детей.
        6. part_time_* фиксирует неполное рабочее время.
        7. work_restrictions_* фиксирует ограничения на ночные / сверхурочные
        / командировки.
        8. maternity_leave_* фиксирует отпуск по беременности и родам.
        9. parental_leave_* фиксирует отпуск по уходу за ребёнком.
        10. termination_guarantees_* фиксирует гарантии при расторжении
        (запрет увольнения по инициативе работодателя, кроме ликвидации).
        11. extra_benefits_* фиксирует дополнительные льготы (перерывы для кормления,
        дополнительные выходные, дополнительный отпуск).
        12. Если гарантия определяется через отсылку к документу (Приложение) —
        фиксируй как "defined" со значением «согласно <документ>».
        13. В evidence включай только текст договора.
        14. Никогда не используй "None", "null", пустые строки или отсутствующие ключи.
        15. Верни РОВНО один валидный JSON-объект со всеми 17 ключами (16 полей + evidence),
        пригодный для парсинга через json.loads без предварительной обработки.
        Без markdown, без ```json, без комментариев, без текста до или после.
        Начни ответ сразу с { и закончи }.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — беременная, полная структура:
        Фрагмент:
        "Работник — Петрова А.А. На момент заключения договора работник
        беременна. Работнику устанавливается неполное рабочее время — 30 часов
        в неделю. Работник не привлекается к сверхурочной работе, работе
        в ночное время и не направляется в командировки. Работнику
        предоставляется отпуск по беременности и родам в соответствии с ТК РФ."
        Ответ:
        {
          "category_type_status": "defined",
          "category_type_value": "pregnant",
          "family_status_status": "defined",
          "family_status_value": "беременна",
          "part_time_status": "defined",
          "part_time_value": "30 часов в неделю",
          "work_restrictions_status": "defined",
          "work_restrictions_value": "не привлекается к сверхурочной работе, работе в ночное время, не направляется в командировки",
          "maternity_leave_status": "defined",
          "maternity_leave_value": "предоставляется в соответствии с ТК РФ",
          "parental_leave_status": "not_defined",
          "parental_leave_value": "Данные не определены",
          "termination_guarantees_status": "not_defined",
          "termination_guarantees_value": "Данные не определены",
          "extra_benefits_status": "not_defined",
          "extra_benefits_value": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 1.2",
              "quote": "На момент заключения договора работник беременна."
            }
          ]
        }
        Пример 2 — с ребёнком до 14 лет:
        Фрагмент:
        "Работник имеет ребёнка в возрасте 10 лет. Работнику устанавливается
        неполное рабочее время по его просьбе. Работнику предоставляется
        дополнительный отпуск без сохранения заработной платы в соответствии
        с ТК РФ."
        Ответ:
        {
          "category_type_status": "defined",
          "category_type_value": "with_children",
          "family_status_status": "defined",
          "family_status_value": "ребёнок 10 лет",
          "part_time_status": "defined",
          "part_time_value": "неполное рабочее время по просьбе работника",
          "work_restrictions_status": "not_defined",
          "work_restrictions_value": "Данные не определены",
          "maternity_leave_status": "not_defined",
          "maternity_leave_value": "Данные не определены",
          "parental_leave_status": "not_defined",
          "parental_leave_value": "Данные не определены",
          "termination_guarantees_status": "not_defined",
          "termination_guarantees_value": "Данные не определены",
          "extra_benefits_status": "defined",
          "extra_benefits_value": "дополнительный отпуск без сохранения заработной платы",
          "evidence": [
            {
              "clause_ref": "п. 1.3",
              "quote": "Работник имеет ребёнка в возрасте 10 лет."
            }
          ]
        }
        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Работник выполняет свои обязанности в соответствии с договором."
        Ответ:
        {
          "category_type_status": "not_defined",
          "category_type_value": "Данные не определены",
          "family_status_status": "not_defined",
          "family_status_value": "Данные не определены",
          "part_time_status": "not_defined",
          "part_time_value": "Данные не определены",
          "work_restrictions_status": "not_defined",
          "work_restrictions_value": "Данные не определены",
          "maternity_leave_status": "not_defined",
          "maternity_leave_value": "Данные не определены",
          "parental_leave_status": "not_defined",
          "parental_leave_value": "Данные не определены",
          "termination_guarantees_status": "not_defined",
          "termination_guarantees_value": "Данные не определены",
          "extra_benefits_status": "not_defined",
          "extra_benefits_value": "Данные не определены",
          "evidence": []
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Проверь, что все 17 ключей (16 полей + evidence) присутствуют в JSON.
        2. Проверь, что каждый *_status ∈ {"defined", "not_defined"}, а каждый *_value
        при отсутствии данных = "Данные не определены".
        3. Проверь, что для каждого defined-поля в evidence есть прямая цитата из договора.
        4. Убедись, что category_type_value — одно из: "pregnant" / "with_children" /
        "family_duties" / "Данные не определены".
        5. Убедись, что ограничения на ночные / сверхурочные / командировки
        отражены в work_restrictions_*, а не распределены по другим полям.
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "category_type_status": "<defined / not_defined>",
          "category_type_value": "<pregnant / with_children / family_duties / 'Данные не определены'>",
          "family_status_status": "<defined / not_defined>",
          "family_status_value": "<текст / 'Данные не определены'>",
          "part_time_status": "<defined / not_defined>",
          "part_time_value": "<текст / 'Данные не определены'>",
          "work_restrictions_status": "<defined / not_defined>",
          "work_restrictions_value": "<ограничения / 'Данные не определены'>",
          "maternity_leave_status": "<defined / not_defined>",
          "maternity_leave_value": "<текст / 'согласно <документ>' / 'Данные не определены'>",
          "parental_leave_status": "<defined / not_defined>",
          "parental_leave_value": "<текст / 'согласно <документ>' / 'Данные не определены'>",
          "termination_guarantees_status": "<defined / not_defined>",
          "termination_guarantees_value": "<текст / 'Данные не определены'>",
          "extra_benefits_status": "<defined / not_defined>",
          "extra_benefits_value": "<текст / 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 7
      temperature: 0.0
      max_tokens: 950

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "беременная беременность ребёнок дети семейные обязанности отпуск по беременности и родам отпуск по уходу за ребёнком неполное рабочее время ограничения ночные сверхурочные командировки гарантии расторжение дополнительные перерывы кормление дополнительные выходные многодетная ребёнок-инвалид"
      preferred_unit_types:
        - obligation
        - general_provision
        - definition
      excluded_unit_types:
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - limitations
        - definitions
      boost_keywords:
        - "беременная"
        - "ребёнок"
        - "отпуск по беременности"
        - "отпуск по уходу"
        - "неполное рабочее время"
      negative_keywords:
        - "трудовая функция"
        - "место работы"
        - "оклад"
        - "заработная плата"
        - "конфиденциальность"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.10, 0.50]
        boost: 0.20
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "limitations"
        - "definitions"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1500

      compact_output: false

      presence_signal:
        field: "pregnant_and_family_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по трудовому праву. Извлеки из трудового договора
        сведения о специальных гарантиях для беременной женщины или лица
        с семейными обязанностями.
        Не анализируй оплату труда, режим работы или расторжение.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 16 полей + evidence (всего 17 ключей):

        0. pregnant_and_family_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (category_type_status, family_status_status, part_time_status,
              work_restrictions_status, maternity_leave_status,
              parental_leave_status, termination_guarantees_status,
              extra_benefits_status) ≠ "not_defined";
           - "missing" — если все восемь содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - все восемь *_status = "not_defined";
           - все *_value = "Данные не определены";
           - не выполняй остальные шаги.

        1. category_type_status — "defined" или "not_defined".
        2. category_type_value — "pregnant" / "with_children" / "family_duties".
        3. family_status_status — "defined" или "not_defined".
        4. family_status_value — семейное положение и дети.
        5. part_time_status — "defined" или "not_defined".
        6. part_time_value — неполное рабочее время.
        7. work_restrictions_status — "defined" или "not_defined".
        8. work_restrictions_value — ограничения работ.
        9. maternity_leave_status — "defined" или "not_defined".
        10. maternity_leave_value — отпуск по беременности и родам.
        11. parental_leave_status — "defined" или "not_defined".
        12. parental_leave_value — отпуск по уходу за ребёнком.
        13. termination_guarantees_status — "defined" или "not_defined".
        14. termination_guarantees_value — гарантии при расторжении.
        15. extra_benefits_status — "defined" или "not_defined".
        16. extra_benefits_value — дополнительные льготы.

        Если данные отсутствуют:
        - для *_status — "not_defined"
        - для *_value — "Данные не определены"
        </task>

        <context_rules>
        - Перед остальными полями заполни pregnant_and_family_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_value = "Данные не определены".
        - Используй только текст договора.
        - category_type_value — одно из: "pregnant" / "with_children" /
          "family_duties" / "Данные не определены".
        - work_restrictions_* фиксирует ограничения на ночные / сверхурочные
          / командировки.
        - Если гарантия определяется через отсылку к документу (Приложение) —
          фиксируй как "defined" со значением «согласно <документ>».
        - Если в разных фрагментах указаны разные данные и конфликт нельзя
          разрешить по тексту — статус → "not_defined", значение → "Не удалось определить".
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни категории, ни семейного положения,
           ни специальных гарантий.
           → presence = "missing";
             все восемь *_status = "not_defined";
             все *_value = "Данные не определены".

        2. Указано только семейное положение.
           Указано, что работник имеет ребёнка, но специальные гарантии
           не раскрыты.
           → presence = "present";
             family_status_status = "defined";
             остальные *_status = "not_defined";
             соответствующие *_value = "Данные не определены".

        3. Противоречие между фрагментами.
           В разных частях договора указаны противоречащие ограничения
           или разные категории.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             соответствующее *_value = "Не удалось определить".

        4. Полная структура гарантий.
           Указаны категория, семейное положение, неполное время,
           ограничения, отпуска и дополнительные льготы.
           → presence = "present";
             все восемь *_status = "defined".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для pregnant_and_family_check_presence используй только: "present", "missing", "unclear".
        - Для всех *_status используй только: "defined" или "not_defined".
        - Fallback при отсутствии данных:
          * все *_value → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_value → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "pregnant_and_family_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие специальных гарантий для беременных и лиц с семейными обязанностями. Внутреннее агрегатное signal-поле."
          required: true

        - name: "category_type_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания категории. Внутреннее enum-поле."
          required: true

        - name: "category_type_value"
          type: "string"
