  - id: remote_work_specifics_check
    name: "Специфика дистанционной работы"
    description: >
      Фактографическая проверка условий дистанционной работы (ст. 312.1–312.9 ТК РФ):
      режим (постоянно / временно / периодически), порядок взаимодействия,
      оборудование рабочего места, компенсация расходов, обмен документами,
      порядок прекращения.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "дистанционная работа"
        - "дистанционно"
        - "удалённая работа"
        - "удалённо"
        - "надомная работа"
        - "электронный документооборот"
        - "усиленная квалифицированная"
        - "оборудование рабочего места"
        - "компенсация расходов"
        - "периодическая дистанционная"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)дистанционн"
        - "(?i)удалённ"
        - "(?i)электронн[а-яё]+\\s+документооборот"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по трудовому праву.
        Анализируется трудовой договор о дистанционной работе.
        Проверяется только один вопрос: условия дистанционной работы.
        Нормативный ориентир:
        - ст. 312.1 ТК РФ — дистанционная работа и дистанционный работник
        - ст. 312.2 ТК РФ — заключение договора и обмен документами
        в электронной форме
        - ст. 312.3 ТК РФ — порядок взаимодействия
        - ст. 312.4 ТК РФ — режим рабочего времени дистанционного работника
        - ст. 312.5 ТК РФ — особенности расторжения
        - ст. 312.6 ТК РФ — обеспечение работника оборудованием
        - ст. 312.7 ТК РФ — ознакомление с документами
        - ст. 312.8 ТК РФ — дополнительные основания расторжения
        - ст. 312.9 ТК РФ — временный перевод
        - ст. 22, 188 ТК РФ — компенсация расходов
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска, не подставляй нормы закона вместо текста.
        - Различай постоянную, временную и периодическую дистанционную работу.
        [ЗАДАЧА]
        Найди в тексте договора:
        1. Режим дистанционной работы (постоянно / временно / периодически).
        2. Порядок взаимодействия между работником и работодателем.
        3. Указание на электронный документооборот.
        4. Оборудование рабочего места (кто предоставляет).
        5. Компенсация расходов дистанционного работника.
        6. Особенности расторжения трудового договора.
        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона вместо текста.
        2. Для *_status используй строго "defined" или "not_defined".
        3. Для *_value при отсутствии данных — строго "Данные не определены".
        4. remote_type_value: "permanent" / "temporary" / "periodic" /
        "not_defined".
        5. interaction_* фиксирует порядок взаимодействия (сроки ответа,
        каналы связи).
        6. edoc_* фиксирует использование электронного документооборота
        и усиленной квалифицированной электронной подписи.
        7. equipment_* фиксирует порядок обеспечения оборудованием.
        8. reimbursement_* фиксирует компенсацию расходов дистанционного работника.
        9. termination_specifics_* фиксирует особенности расторжения.
        10. Если гарантия определяется через отсылку к документу — фиксируй
        как "defined" со значением «согласно <документ>».
        11. В evidence включай только текст договора.
        12. Никогда не используй "None", "null", пустые строки или отсутствующие ключи.
        13. Верни РОВНО один валидный JSON-объект со всеми 13 ключами (12 полей + evidence),
        пригодный для парсинга через json.loads без предварительной обработки.
        Без markdown, без ```json, без комментариев, без текста до или после.
        Начни ответ сразу с { и закончи }.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — постоянная дистанционная работа:
        Фрагмент:
        "Работник выполняет трудовую функцию дистанционно на постоянной основе.
        Взаимодействие осуществляется по электронной почте и в системе электронного
        документооборота с использованием усиленной квалифицированной электронной
        подписи. Работодатель предоставляет работнику ноутбук и обеспечивает
        компенсацию расходов на интернет — 500 рублей в месяц."
        Ответ:
        {
          "remote_type_status": "defined",
          "remote_type_value": "permanent",
          "interaction_status": "defined",
          "interaction_value": "по электронной почте и в системе электронного документооборота",
          "edoc_status": "defined",
          "edoc_value": "УКЭП в системе электронного документооборота",
          "equipment_status": "defined",
          "equipment_value": "ноутбук предоставляется работодателем",
          "reimbursement_status": "defined",
          "reimbursement_value": "компенсация расходов на интернет — 500 рублей в месяц",
          "termination_specifics_status": "not_defined",
          "termination_specifics_value": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "Работник выполняет трудовую функцию дистанционно на постоянной основе."
            }
          ]
        }
        Пример 2 — периодическая дистанционная работа:
        Фрагмент:
        "Работник выполняет трудовую функцию периодически дистанционно
        (не более 3 дней в неделю). Работник использует собственное оборудование.
        Ознакомление с локальными актами — через систему электронного
        документооборота."
        Ответ:
        {
          "remote_type_status": "defined",
          "remote_type_value": "periodic",
          "interaction_status": "not_defined",
          "interaction_value": "Данные не определены",
          "edoc_status": "defined",
          "edoc_value": "система электронного документооборота",
          "equipment_status": "defined",
          "equipment_value": "работник использует собственное оборудование",
          "reimbursement_status": "not_defined",
          "reimbursement_value": "Данные не определены",
          "termination_specifics_status": "not_defined",
          "termination_specifics_value": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 1.2",
              "quote": "Работник выполняет трудовую функцию периодически дистанционно (не более 3 дней в неделю)."
            }
          ]
        }
        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Работник выполняет свои обязанности в соответствии с договором."
        Ответ:
        {
          "remote_type_status": "not_defined",
          "remote_type_value": "Данные не определены",
          "interaction_status": "not_defined",
          "interaction_value": "Данные не определены",
          "edoc_status": "not_defined",
          "edoc_value": "Данные не определены",
          "equipment_status": "not_defined",
          "equipment_value": "Данные не определены",
          "reimbursement_status": "not_defined",
          "reimbursement_value": "Данные не определены",
          "termination_specifics_status": "not_defined",
          "termination_specifics_value": "Данные не определены",
          "evidence": []
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Проверь, что все 13 ключей (12 полей + evidence) присутствуют в JSON.
        2. Проверь, что каждый *_status ∈ {"defined", "not_defined"}, а каждый *_value
        при отсутствии данных = "Данные не определены".
        3. Проверь, что для каждого defined-поля в evidence есть прямая цитата из договора.
        4. Убедись, что remote_type_value — одно из: "permanent" / "temporary" /
        "periodic" / "Данные не определены".
        5. Убедись, что порядок взаимодействия / ЭДО / оборудование / компенсация
        разнесены по соответствующим полям.
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "remote_type_status": "<defined / not_defined>",
          "remote_type_value": "<permanent / temporary / periodic / 'Данные не определены'>",
          "interaction_status": "<defined / not_defined>",
          "interaction_value": "<текст / 'Данные не определены'>",
          "edoc_status": "<defined / not_defined>",
          "edoc_value": "<текст / 'Данные не определены'>",
          "equipment_status": "<defined / not_defined>",
          "equipment_value": "<текст / 'Данные не определены'>",
          "reimbursement_status": "<defined / not_defined>",
