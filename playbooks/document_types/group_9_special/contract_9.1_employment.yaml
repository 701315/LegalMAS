        field: "employee_category_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по трудовому праву. Определи категорию работника
        по тексту трудового договора и извлеки специальные условия.
        Не анализируй оплату труда, режим работы, отпуск или расторжение.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 4 поля + evidence (всего 5 ключей):

        0. employee_category_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (employee_category_status, special_conditions_status) ≠ "not_defined"
             и employee_category_status ≠ "standard";
           - "missing" — если employee_category_status = "standard"
             и special_conditions_status = "not_defined"
             (специфика не выявлена);
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - employee_category_status = "standard";
           - employee_category_value = "основное место работы, специфических категорий не указано";
           - special_conditions_status = "not_defined";
           - special_conditions_value = "Данные не определены";
           - не выполняй остальные шаги.

        1. employee_category_status — одно из: "standard" / "disabled" / "minor" /
           "pregnant_or_family" / "concurrent" / "remote" / "homeworker" / "other_specific".
        2. employee_category_value — пояснение категории.
        3. special_conditions_status — "defined" или "not_defined".
        4. special_conditions_value — специальные условия для категории.

        Если данные отсутствуют:
        - для *_status — "not_defined" (кроме employee_category_status — там "standard")
        - для *_value — "Данные не определены"
        </task>

        <context_rules>
        - Перед остальными полями заполни employee_category_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — employee_category_status = "standard", special_conditions_status = "not_defined".
        - Используй только текст договора.
        - employee_category_status = "standard" если нет прямых указаний на
          специфическую категорию.
        - При нескольких категориях (инвалид + дистанционная работа) выбери
          первичную по приоритету: minor > disabled > pregnant_or_family >
          concurrent > homeworker > remote > other_specific > standard.
          Остальные перечисли в employee_category_value.
        - special_conditions_* фиксирует наличие специальных условий (сокращённое
          время, дополнительный отпуск, оборудование рабочего места, ИПРА, ограничения).
        - Если в разных фрагментах указаны разные данные и конфликт нельзя
          разрешить по тексту — статус → "not_defined", значение → "Не удалось определить".
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие специфики.
           В тексте нет ни одной специфической категории работника.
           → presence = "missing";
             employee_category_status = "standard";
             employee_category_value = "основное место работы, специфических категорий не указано";
             special_conditions_status = "not_defined";
             special_conditions_value = "Данные не определены".

        2. Категория указана без специальных условий.
           Работник отнесён к специфической категории, но специальные
           условия не упомянуты.
           → presence = "present";
             employee_category_status = "<специфическая категория>";
             special_conditions_status = "not_defined";
             special_conditions_value = "Данные не определены".

        3. Противоречие между фрагментами.
           В разных частях договора работник отнесён к разным категориям
           или указаны противоречащие специальные условия.
           → presence = "unclear";
             employee_category_status = "other_specific";
             employee_category_value = "Не удалось определить";
             special_conditions_status = "not_defined";
             special_conditions_value = "Не удалось определить".

        4. Несколько категорий.
           В тексте одновременно указаны несколько специфических категорий
           (например, инвалид + совместитель + дистанционная работа).
           → presence = "present";
             employee_category_status = "<первичная по приоритету>";
             employee_category_value содержит перечисление всех выявленных категорий.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для employee_category_check_presence используй только: "present", "missing", "unclear".
        - Для employee_category_status используй только значения из enum:
          "standard", "disabled", "minor", "pregnant_or_family", "concurrent",
          "remote", "homeworker", "other_specific".
        - Для special_conditions_status используй только: "defined" или "not_defined".
        - Fallback при отсутствии данных:
          * special_conditions_value → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * employee_category_value, special_conditions_value → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "employee_category_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
