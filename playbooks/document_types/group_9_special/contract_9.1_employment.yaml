    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1750

      compact_output: false

      presence_signal:
        field: "termination_modification_rights_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по трудовому праву. Извлеки из трудового договора
        сведения о расторжении, изменении условий, защите прав работника,
        окончательном расчёте и выплате по соглашению сторон.
        Не анализируй оплату труда, рабочее время, отпуск или охрану труда.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 16 полей + evidence (всего 17 ключей):

        0. termination_modification_rights_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (termination_grounds_status, termination_procedure_status,
              severance_pay_status, modification_status,
              discrimination_status, rights_restriction_status,
              final_settlement_status,
              termination_agreement_payment_status) ≠ "not_defined";
           - "missing" — если все восемь содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - все восемь *_status = "not_defined";
           - все *_value = "Данные не определены";
           - не выполняй остальные шаги.

        1. termination_grounds_status — "defined" или "not_defined".
        2. termination_grounds_value — основания расторжения.
        3. termination_procedure_status — "defined" или "not_defined".
        4. termination_procedure_value — процедура расторжения.
        5. severance_pay_status — "defined" или "not_defined".
        6. severance_pay_value — выходное пособие.
        7. modification_status — "defined" или "not_defined".
        8. modification_value — порядок изменения условий договора.
        9. discrimination_status — "defined" или "not_defined".
        10. discrimination_value — выявленные дискриминационные формулировки.
        11. rights_restriction_status — "defined" или "not_defined".
        12. rights_restriction_value — условия, ограничивающие права работника.
        13. final_settlement_status — "defined" или "not_defined".
        14. final_settlement_value — срок окончательного расчёта при увольнении.
        15. termination_agreement_payment_status — "defined" или "not_defined".
        16. termination_agreement_payment_value — выплата при увольнении по соглашению сторон.

        Если данные отсутствуют:
        - для *_status — "not_defined"
        - для *_value — "Данные не определены"
        </task>

        <context_rules>
        - Перед остальными полями заполни termination_modification_rights_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_value = "Данные не определены".
        - Используй только текст договора.
        - Для discrimination_status и rights_restriction_status применяется
          ИНВЕРТИРОВАННАЯ логика:
          "defined" = прямо выявлены дискриминационные / ограничивающие права
          формулировки (негативный сигнал);
          "not_defined" = такие формулировки не выявлены.
        - discrimination_status = "defined" только при наличии формулировок
          с ограничениями по полу, возрасту, национальности, вероисповеданию,
          семейному положению или иным основаниям по ст. 3 ТК РФ.
        - rights_restriction_status = "defined" только при наличии условий,
          ограничивающих права работника по сравнению с ТК РФ.
        - final_settlement_* фиксирует срок расчёта при увольнении.
          По умолчанию — день увольнения (ст. 140 ТК РФ).
        - termination_agreement_payment_* фиксирует выплату при увольнении
          по соглашению сторон (ст. 78 ТК РФ). При отсутствии — "not_defined".
        - Если порядок расторжения / изменения / выплаты выходного пособия
          определяется через отсылку к документу (Коллективный договор, Положение,
          Приложение) — фиксируй как "defined" со значением «согласно <документ>».
        - Если в разных фрагментах указаны разные данные и конфликт нельзя
          разрешить по тексту — статус → "not_defined", значение → "Не удалось определить".
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни оснований расторжения, ни порядка изменения,
           ни выходного пособия, ни дискриминационных формулировок.
           → presence = "missing";
             все восемь *_status = "not_defined";
             все *_value = "Данные не определены".

        2. Стандартная отсылка к ТК РФ.
           Указано, что расторжение осуществляется по ТК РФ,
           без указания процедуры, выходного пособия и расчёта.
           → presence = "present";
             termination_grounds_status = "defined";
             termination_procedure_status = "not_defined";
             severance_pay_status = "not_defined";
             modification_status = "not_defined";
             discrimination_status = "not_defined";
             rights_restriction_status = "not_defined";
             final_settlement_status = "not_defined";
             termination_agreement_payment_status = "not_defined";
             соответствующие *_value = "Данные не определены".

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные сроки расчёта
           или противоречащие условия изменения.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             соответствующее *_value = "Не удалось определить".

        4. Выявлены дискриминационные / ограничивающие формулировки.
           В тексте есть условия, ограничивающие права работника
           (отказ от отпуска, запрет обращения в ГИТ, ограничения по полу/возрасту).
           → presence = "present";
             discrimination_status = "defined" и/или rights_restriction_status = "defined";
             соответствующие *_value содержат прямые цитаты.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для termination_modification_rights_check_presence используй только: "present", "missing", "unclear".
        - Для всех *_status используй только: "defined" или "not_defined".
        - Fallback при отсутствии данных:
          * все *_value → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_value → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "termination_modification_rights_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие условий о расторжении, изменении и защите прав работника. Внутреннее агрегатное signal-поле."
