          display_in_grid: true
          display_priority: 1
          label: "Категория"
          description: >
            Категория работника (pregnant / with_children / family_duties). Fallback: "Не установлено" / "Не удалось определить".
          required: true

        - name: "family_status_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус семейного положения. Внутреннее enum-поле."
          required: true

        - name: "family_status_value"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Семейное положение"
          description: >
            Семейное положение и наличие детей. Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "part_time_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус неполного рабочего времени. Внутреннее enum-поле."
          required: true

        - name: "part_time_value"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Неполное рабочее время"
          description: >
            Условие о неполном рабочем времени. Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "work_restrictions_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус ограничений работ. Внутреннее enum-поле."
          required: true

        - name: "work_restrictions_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Ограничения работ"
          description: >
            Ограничения на ночные / сверхурочные / командировки. Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "maternity_leave_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус отпуска по беременности и родам. Внутреннее enum-поле."
          required: true

        - name: "maternity_leave_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Отпуск по БиР"
          description: >
            Отпуск по беременности и родам. Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "parental_leave_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус отпуска по уходу за ребёнком. Внутреннее enum-поле."
          required: true

        - name: "parental_leave_value"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Отпуск по уходу"
          description: >
            Отпуск по уходу за ребёнком. Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "termination_guarantees_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус гарантий при расторжении. Внутреннее enum-поле."
          required: true

        - name: "termination_guarantees_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 4
          label: "Гарантии при расторжении"
          description: >
            Гарантии при расторжении трудового договора. Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "extra_benefits_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
