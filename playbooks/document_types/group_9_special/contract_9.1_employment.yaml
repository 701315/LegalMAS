        отпуск или расторжение.
        </role>
        <context>
        {context}
        </context>
        <task>
        Заполни строго следующие 14 полей + evidence (всего 15 ключей):
        1. two_copies_status — "defined" или "not_defined".
        2. two_copies_value — указание на два экземпляра.
        3. employee_copy_status — "defined" или "not_defined".
        4. employee_copy_value — передача экземпляра работнику и подтверждение.
        5. liability_type_status — "defined" или "not_defined".
        6. liability_type_value — тип материальной ответственности.
        7. separate_agreement_status — "defined" или "not_defined".
        8. separate_agreement_value — указание на отдельный договор о полной МО.
        9. damage_procedure_status — "defined" или "not_defined".
        10. damage_procedure_value — порядок возмещения ущерба.
        11. confidentiality_status — "defined" или "not_defined".
        12. confidentiality_value — условие о конфиденциальности.
        13. disclosure_liability_status — "defined" или "not_defined".
        14. disclosure_liability_value — ответственность за разглашение.
        Если данные отсутствуют:
        - для *_status — "not_defined"
        - для *_value — "Данные не определены"
        </task>
        <rules>
        - Используй только текст договора.
        - liability_type_value: "ограниченная" — если прямо указана ограниченная
        ответственность (в т.ч. "в пределах среднего месячного заработка");
        "полная" — если прямо указана полная ответственность;
        "согласно ТК РФ" — если формулировка общая ("в соответствии с ТК РФ",
        "в порядке, установленном законодательством"); иначе "Данные не определены".
        - separate_agreement_status = "defined" только если прямо указан отдельный
        договор о полной материальной ответственности.
        - Если порядок возмещения ущерба или условие о неразглашении определяется
        через отсылку к документу (Положение, Коллективный договор, отдельный NDA,
        Приложение) — фиксируй как "defined" со значением «согласно <документ>».
        - Верни РОВНО один валидный JSON-объект со всеми 15 ключами,
        без markdown и комментариев.
        </rules>
