          label: "Отсылка к ЛНА о соцпакете"
          description: "Отсылки к локальным актам, регулирующим соцпакет."
          required: false

  - id: training_and_clawback_check
    name: "Обучение за счёт работодателя и обязанность отработки"
    description: >
      Фактографическая проверка условий об ученическом договоре (ст. 198–208 ТК РФ),
      обучении за счёт работодателя, обязанности отработать определённый срок,
      а также порядка возмещения затрат работодателя при увольнении.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "ученический договор"
        - "ученичество"
        - "обучение"
        - "повышение квалификации"
        - "профессиональная переподготовка"
        - "стажировка"
        - "за счёт работодателя"
        - "обязанность отработать"
        - "отработать не менее"
        - "возмещение затрат"
        - "возмещение расходов на обучение"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)ученическ[а-яё]+\\s+договор"
        - "(?i)обучени[ея].*за\\s+счёт\\s+работодател"
        - "(?i)отработать\\s+не\\s+менее"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по трудовому праву.
        Анализируется трудовой договор.
        Проверяется только один вопрос: обучение за счёт работодателя
        и обязанность отработки.
        Нормативный ориентир:
        - ст. 196 ТК РФ — подготовка и дополнительное профессиональное образование
        - ст. 197 ТК РФ — право на профессиональное обучение
        - ст. 198–208 ТК РФ — ученический договор
        - ст. 249 ТК РФ — возмещение затрат при увольнении без уважительных причин
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска, не подставляй нормы закона вместо текста.
        - Не выводи конкретные суммы затрат, если они не указаны в тексте.
        [ЗАДАЧА]
        Найди в тексте договора:
        1. Условие об ученическом договоре (ст. 198–208 ТК РФ).
        2. Условие об обучении за счёт работодателя (повышение квалификации, переподготовка).
        3. Обязанность отработать определённый срок после обучения.
        4. Порядок возмещения затрат работодателя при увольнении (ст. 249 ТК РФ).
        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона вместо текста.
        2. Для *_status используй строго "defined" или "not_defined".
        3. Для *_value при отсутствии данных — строго "Данные не определены".
        4. training_agreement_* фиксирует только ученический договор
        (ст. 198–208 ТК РФ) — отдельный договор между работодателем и учеником.
        5. work_off_obligation_* фиксирует обязанность отработать определённый
        срок после обучения (минимальный срок, конкретные условия).
        6. cost_reimbursement_* фиксирует порядок возмещения затрат работодателя
        при увольнении до истечения срока отработки (ст. 249 ТК РФ).
        7. Если условия определяются через отсылку к документу (Соглашение
        об обучении, Ученический договор, Приложение) — фиксируй как "defined"
        со значением «согласно <документ>».
        8. Если прямо указано, что обучение / отработка не предусмотрены —
        соответствующий *_status = "defined", *_value = "не предусмотрены".
        9. В evidence включай только текст договора.
        10. Никогда не используй "None", "null", пустые строки или отсутствующие ключи.
        11. Верни РОВНО один валидный JSON-объект со всеми 7 ключами (6 полей + evidence),
        пригодный для парсинга через json.loads без предварительной обработки.
        Без markdown, без ```json, без комментариев, без текста до или после.
        Начни ответ сразу с { и закончи }.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — обучение с обязанностью отработки:
        Фрагмент:
        "Работодатель оплачивает обучение работника по программе MBA.
        Работник обязуется отработать не менее 3 лет после завершения обучения.
        В случае увольнения без уважительных причин до истечения указанного
        срока работник возмещает затраты работодателя на обучение
        пропорционально отработанному времени."
        Ответ:
        {
          "training_agreement_status": "not_defined",
          "training_agreement_value": "Данные не определены",
          "work_off_obligation_status": "defined",
          "work_off_obligation_value": "не менее 3 лет после завершения обучения",
          "cost_reimbursement_status": "defined",
          "cost_reimbursement_value": "возмещение затрат на обучение пропорционально отработанному времени при увольнении без уважительных причин",
          "evidence": [
            {
              "clause_ref": "п. 6.1",
              "quote": "Работник обязуется отработать не менее 3 лет после завершения обучения."
            }
          ]
        }
        Пример 2 — ученический договор:
        Фрагмент:
        "С работником заключается ученический договор на профессиональное
        обучение. Условия ученического договора — согласно Приложению № 2."
        Ответ:
        {
          "training_agreement_status": "defined",
          "training_agreement_value": "согласно Приложению № 2 (ученический договор)",
          "work_off_obligation_status": "not_defined",
          "work_off_obligation_value": "Данные не определены",
          "cost_reimbursement_status": "not_defined",
          "cost_reimbursement_value": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 6.2",
              "quote": "С работником заключается ученический договор на профессиональное обучение."
            }
          ]
        }
        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Работник выполняет свои обязанности в соответствии с договором."
        Ответ:
        {
          "training_agreement_status": "not_defined",
          "training_agreement_value": "Данные не определены",
          "work_off_obligation_status": "not_defined",
          "work_off_obligation_value": "Данные не определены",
          "cost_reimbursement_status": "not_defined",
          "cost_reimbursement_value": "Данные не определены",
          "evidence": []
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Проверь, что все 7 ключей (6 полей + evidence) присутствуют в JSON.
        2. Проверь, что каждый *_status ∈ {"defined", "not_defined"}, а каждый *_value
        при отсутствии данных = "Данные не определены".
        3. Проверь, что для каждого defined-поля в evidence есть прямая цитата из договора.
        4. Убедись, что training_agreement_* фиксирует только ученический договор,
        а не любое обучение.
        5. Убедись, что work_off_obligation_* указывает конкретный срок отработки,
        если он есть в тексте.
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "training_agreement_status": "<defined / not_defined>",
          "training_agreement_value": "<текст / 'согласно <документ>' / 'не предусмотрен' / 'Данные не определены'>",
          "work_off_obligation_status": "<defined / not_defined>",
          "work_off_obligation_value": "<срок / 'не предусмотрена' / 'Данные не определены'>",
          "cost_reimbursement_status": "<defined / not_defined>",
          "cost_reimbursement_value": "<текст / 'согласно <документ>' / 'не предусмотрено' / 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 750

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "ученический договор ученичество обучение повышение квалификации профессиональная переподготовка стажировка за счёт работодателя обязанность отработать отработать не менее возмещение затрат возмещение расходов на обучение соглашение об обучении"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
        - remedies
      boost_keywords:
        - "ученический договор"
        - "обучение за счёт работодателя"
        - "обязанность отработать"
        - "возмещение затрат на обучение"
      negative_keywords:
        - "трудовая функция"
        - "место работы"
        - "оклад"
        - "заработная плата"
        - "рабочее время"
        - "увольнение по сокращению"
        - "конфиденциальность"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.35, 0.80]
        boost: 0.30
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
        - "remedies"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 1000
      store_payload: true

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по трудовому праву. Извлеки из трудового договора
        сведения об ученическом договоре, обучении за счёт работодателя,
        обязанности отработки и возмещении затрат.
        Не анализируй оклад, режим работы, отпуск или расторжение.
        </role>
        <context>
        {context}
        </context>
        <task>
        Заполни строго следующие 6 полей + evidence (всего 7 ключей):
        1. training_agreement_status — "defined" или "not_defined".
        2. training_agreement_value — условие об ученическом договоре.
        3. work_off_obligation_status — "defined" или "not_defined".
        4. work_off_obligation_value — обязанность отработки (срок).
        5. cost_reimbursement_status — "defined" или "not_defined".
        6. cost_reimbursement_value — порядок возмещения затрат.
        Если данные отсутствуют:
        - для *_status — "not_defined"
        - для *_value — "Данные не определены"
        </task>
        <rules>
        - Используй только текст договора.
        - training_agreement_* — только ученический договор (ст. 198–208 ТК РФ),
        не любое обучение.
        - work_off_obligation_* — обязанность отработать конкретный срок.
        - cost_reimbursement_* — порядок возмещения затрат (ст. 249 ТК РФ).
        - Если условия определяются через отсылку к документу — фиксируй как
        "defined" со значением «согласно <документ>».
        - Если прямо указано, что обучение / отработка не предусмотрены —
        status = "defined", value = "не предусмотрены".
        - Верни РОВНО один валидный JSON-объект со всеми 7 ключами,
        без markdown и комментариев.
        </rules>
      fields:
        - name: "training_agreement_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус ученического договора."
          required: true
        - name: "training_agreement_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Ученический договор"
          description: "Условие об ученическом договоре."
          required: false
        - name: "work_off_obligation_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус обязанности отработки."
          required: true
        - name: "work_off_obligation_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Обязанность отработки"
          description: "Обязанность отработать определённый срок после обучения."
          required: false
        - name: "cost_reimbursement_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус порядка возмещения затрат."
          required: true
        - name: "cost_reimbursement_value"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Возмещение затрат на обучение"
          description: "Порядок возмещения затрат работодателя на обучение."
          required: false

  - id: disabled_employee_check
    name: "Специфика труда работника-инвалида"
    description: >
      Фактографическая проверка специальных гарантий и ограничений для работника
      с инвалидностью (ст. 92, 94, 96, 99, 113, 128, 224 ТК РФ; ФЗ-181):
      группа инвалидности, ИПРА, сокращённая продолжительность рабочего времени,
      ограничения по ночным / сверхурочным / выходным, дополнительный
      неоплачиваемый отпуск, адаптация рабочего места.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "инвалид"
        - "инвалидность"
        - "группа инвалидности"
        - "ИПРА"
        - "индивидуальная программа реабилитации"
        - "абилитация"
        - "сокращённая продолжительность"
        - "35 часов"
        - "отпуск без сохранения"
        - "60 календарных дней"
        - "адаптация рабочего места"
        - "специальное рабочее место"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)инвалид"
        - "(?i)ИПРА"
        - "(?i)\\b35\\s*час"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по трудовому праву.
        Анализируется трудовой договор с работником-инвалидом.
        Проверяется только один вопрос: специальные гарантии и ограничения
        для работника с инвалидностью.
        Нормативный ориентир:
        - ст. 92 ТК РФ — сокращённая продолжительность рабочего времени
        для инвалидов I или II группы (не более 35 часов в неделю)
        - ст. 94 ТК РФ — предельная продолжительность ежедневной работы
        - ст. 96 ТК РФ — работа в ночное время (только с письменного согласия
        и при отсутствии медицинских противопоказаний)
        - ст. 99 ТК РФ — сверхурочная работа (только с письменного согласия
        и при отсутствии медицинских противопоказаний)
        - ст. 113 ТК РФ — работа в выходные и нерабочие праздничные дни
        - ст. 128 ТК РФ — отпуск без сохранения заработной платы до 60 календарных
        дней в году для работающих инвалидов
        - ст. 224 ТК РФ — дополнительные гарантии (создание условий труда
        в соответствии с ИПРА)
        - ФЗ от 24.11.1995 № 181-ФЗ — социальная защита инвалидов
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска, не подставляй нормы закона вместо текста.
        - Не выводи группу инвалидности и ИПРА из закона — только из текста.
        [ЗАДАЧА]
        Найди в тексте договора:
        1. Группу инвалидности работника.
        2. Указание на ИПРА (индивидуальную программу реабилитации или абилитации).
        3. Сокращённую продолжительность рабочего времени.
        4. Предельную продолжительность ежедневной работы.
        5. Ограничения по работе в ночное время.
        6. Ограничения по сверхурочной работе.
        7. Дополнительный отпуск без сохранения заработной платы.
        8. Адаптацию рабочего места / специальное рабочее место.
        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона вместо текста.
        2. Для *_status используй строго "defined" или "not_defined".
        3. Для *_value при отсутствии данных — строго "Данные не определены".
        4. Не выводи группу инвалидности и ИПРА из закона — только из текста договора.
        5. disability_group_* фиксирует группу инвалидности (I, II, III).
        6. ipra_* фиксирует указание на ИПРА и её реквизиты.
        7. reduced_hours_* фиксирует сокращённую продолжительность рабочего
        времени (35 часов в неделю для I / II группы).
        8. daily_limit_* фиксирует предельную продолжительность ежедневной работы.
        9. night_work_restrictions_* фиксирует условия привлечения к ночным работам.
        10. overtime_restrictions_* фиксирует условия привлечения к сверхурочным.
        11. extra_unpaid_leave_* фиксирует дополнительный отпуск без сохранения
        заработной платы (до 60 дней в году).
        12. workplace_adaptation_* фиксирует адаптацию рабочего места / специальное
        рабочее место в соответствии с ИПРА.
        13. Если гарантия определяется через отсылку к документу (ИПРА, Приложение) —
        фиксируй как "defined" со значением «согласно <документ>».
        14. В evidence включай только текст договора.
        15. Никогда не используй "None", "null", пустые строки или отсутствующие ключи.
        16. Верни РОВНО один валидный JSON-объект со всеми 17 ключами (16 полей + evidence),
        пригодный для парсинга через json.loads без предварительной обработки.
        Без markdown, без ```json, без комментариев, без текста до или после.
        Начни ответ сразу с { и закончи }.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — полная структура:
        Фрагмент:
        "Работник является инвалидом II группы. Работнику устанавливается
        сокращённая продолжительность рабочего времени — 35 часов в неделю.
        Привлечение к сверхурочной работе и работе в ночное время допускается
        только с письменного согласия работника и при отсутствии медицинских
        противопоказаний. Работнику предоставляется отпуск без сохранения
        заработной платы до 60 календарных дней в году. Рабочее место
        оборудуется в соответствии с ИПРА."
        Ответ:
        {
          "disability_group_status": "defined",
          "disability_group_value": "II группа",
          "ipra_status": "defined",
          "ipra_value": "рабочее место оборудуется в соответствии с ИПРА",
          "reduced_hours_status": "defined",
          "reduced_hours_value": "35 часов в неделю",
          "daily_limit_status": "not_defined",
          "daily_limit_value": "Данные не определены",
          "night_work_restrictions_status": "defined",
