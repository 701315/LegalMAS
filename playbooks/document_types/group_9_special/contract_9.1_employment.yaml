shared_patterns:
  money_amount: "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|тыс|млн)"
  date_pattern: "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"
  snils_pattern: "(?i)\\bСНИЛС\\s*\\d{3}[-]?\\d{3}[-]?\\d{3}\\s*\\d{2}\\b"
  inn_pattern: "(?i)\\bИНН\\s*\\d{10,12}\\b"
  passport_data: "(?i)паспорт\\s+серия\\s+\\d{4}\\s+№?\\s*\\d{6}"
  article_tk_ref: "(?i)ст\\.?\\s*\\d+\\s*ТК\\s*РФ"

compliance_rules: []

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: CHECKS_V8 — единственный рабочий слой юридического анализа
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 1: Стороны, трудовая функция, место работы
  # ──────────────────────────────────────────────────────────────────────────
  - id: parties_function_place_check
    name: "Стороны, трудовая функция и место работы"
    description: >
      Фактографическая проверка идентификации работодателя и работника,
      трудовой функции (должность/профессия/специальность с квалификацией),
      места работы (адрес, подразделение) и характера работы.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "работодатель"
        - "работник"
        - "трудовая функция"
        - "работа по должности"
        - "профессия"
        - "специальность"
        - "должностная инструкция"
        - "квалификация"
        - "место работы"
        - "адрес"
        - "структурное подразделение"
        - "филиал"
        - "дистанционная работа"
        - "характер работы"
        - "разъездной"
        - "в пути"
        - "подвижной"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(работодатель|работник).*именуем"
        - "(?i)должност[ьи]\\s+в\\s+соответствии"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по трудовому праву.
        Анализируется трудовой договор (ст. 56, 57 ТК РФ).
        Проверяется только один вопрос: стороны, трудовая функция и место работы.
        Нормативный ориентир:
        - ст. 56 ТК РФ — понятие трудового договора
        - ст. 57 ТК РФ — содержание трудового договора
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        [ЗАДАЧА]
        Найди в тексте договора:
        1. Наименование работодателя и его реквизиты.
        2. ФИО работника и его данные (паспорт, СНИЛС).
        3. Трудовую функцию: должность/профессия/специальность с квалификацией.
        4. Ссылку на должностную инструкцию.
        5. Место работы: адрес, структурное подразделение.
        6. Указание на дистанционную работу.
        7. Характер работы (разъездной, в пути, подвижной) — если указан.
        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если данные не указаны прямо — возвращай "not_defined".
        4. Если текстового значения нет — возвращай строго "Данные не определены".
        5. Не используй "None", "null", "not_defined", "not_defined" или пустые строки.
        6. В evidence включай только текст договора.
        7. Верни только один JSON-объект.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — все данные определены:
        Фрагмент:
        "Работодатель — ООО «Альфа» (ИНН 7700000001, ОГРН 1027700000001),
        в лице Генерального директора Иванова А.А., действующего на основании Устава,
        и Работник — Петров Б.Б. (паспорт серия 45 00 № 123456, СНИЛС 123-456-789 00),
        заключили настоящий трудовой договор. Работник принимается на должность
        инженера-программиста 1-й категории в отдел разработки. Место работы:
        г. Москва, ул. Ленина, д. 10, офис 305. Должностная инструкция — Приложение № 1."
        Ответ:
        {
          "employer_details_status": "defined",
          "employer_details_value": "ООО «Альфа», ИНН 7700000001, ОГРН 1027700000001",
          "employee_details_status": "defined",
          "employee_details_value": "Петров Б.Б., паспорт серия 45 00 № 123456, СНИЛС 123-456-789 00",
          "position_status": "defined",
          "position_value": "инженер-программист 1-й категории",
          "structural_unit_status": "defined",
          "structural_unit_value": "отдел разработки",
          "job_description_status": "defined",
          "job_description_value": "Должностная инструкция — Приложение № 1",
          "work_place_status": "defined",
          "work_place_value": "г. Москва, ул. Ленина, д. 10, офис 305",
          "remote_work_status": "not_defined",
          "work_nature_status": "not_defined",
          "work_nature_value": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "Работник принимается на должность инженера-программиста 1-й категории в отдел разработки."
            }
          ]
        }
        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Работодатель и Работник заключили настоящий договор."
        Ответ:
        {
          "employer_details_status": "not_defined",
          "employer_details_value": "Данные не определены",
          "employee_details_status": "not_defined",
          "employee_details_value": "Данные не определены",
          "position_status": "not_defined",
          "position_value": "Данные не определены",
          "structural_unit_status": "not_defined",
          "structural_unit_value": "Данные не определены",
          "job_description_status": "not_defined",
          "job_description_value": "Данные не определены",
          "work_place_status": "not_defined",
          "work_place_value": "Данные не определены",
          "remote_work_status": "not_defined",
          "work_nature_status": "not_defined",
          "work_nature_value": "Данные не определены",
          "evidence": []
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату с идентификацией работодателя.
        2. Найди прямую цитату с идентификацией работника.
        3. Найди прямую цитату с должностью/профессией.
        4. Найди прямую цитату с местом работы.
        5. Найди прямую цитату о дистанционной работе.
        6. Найди прямую цитату о характере работы.
        7. Если прямой цитаты нет — верни "not_defined". Не додумывай.
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "employer_details_status": "<defined / not_defined>",
          "employer_details_value": "<реквизиты или 'Данные не определены'>",
          "employee_details_status": "<defined / not_defined>",
          "employee_details_value": "<данные или 'Данные не определены'>",
          "position_status": "<defined / not_defined>",
          "position_value": "<должность или 'Данные не определены'>",
          "structural_unit_status": "<defined / not_defined>",
          "structural_unit_value": "<подразделение или 'Данные не определены'>",
          "job_description_status": "<defined / not_defined>",
          "job_description_value": "<ссылка или 'Данные не определены'>",
          "work_place_status": "<defined / not_defined>",
          "work_place_value": "<адрес или 'Данные не определены'>",
          "remote_work_status": "<defined / not_defined>",
          "work_nature_status": "<defined / not_defined>",
          "work_nature_value": "<характер или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 7
      temperature: 0.0
      max_tokens: 750

    retrieval:
      retrieval_profile: "party_identification_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "работодатель работник трудовая функция работа по должности профессия специальность квалификация должностная инструкция место работы адрес структурное подразделение филиал дистанционная работа характер работы разъездной в пути подвижной"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - definitions
        - obligations
      negative_keywords:
        - "заработная плата"
        - "оклад"
        - "отпуск"
        - "рабочее время"
        - "увольнение"
        - "расторжение"
        - "материальная ответственность"
        - "конфиденциальность"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 0.25]
        boost: 0.25
        scope: segment
      context_k: 7
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "definitions"
        - "obligations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.15

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 1450

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по трудовому праву. Извлеки из трудового договора
        сведения о сторонах, трудовой функции и месте работы.
        Не анализируй оплату труда, отпуск, рабочее время или расторжение.
        </role>
        <context>
        {context}
        </context>
        <task>
        Заполни строго следующие поля:
        1. employer_details_status — "defined" или "not_defined".
        2. employer_details_value — наименование и реквизиты работодателя.
        3. employee_details_status — "defined" или "not_defined".
        4. employee_details_value — ФИО и данные работника.
        5. position_status — "defined" или "not_defined".
        6. position_value — должность/профессия/специальность с квалификацией.
        7. structural_unit_status — "defined" или "not_defined".
        8. structural_unit_value — структурное подразделение.
        9. job_description_status — "defined" или "not_defined".
        10. job_description_value — ссылка на должностную инструкцию.
        11. work_place_status — "defined" или "not_defined".
        12. work_place_value — адрес места работы.
        13. remote_work_status — "defined" или "not_defined".
        14. work_nature_status — "defined" или "not_defined".
        15. work_nature_value — характер работы (разъездной, в пути, подвижной).
        Если данные отсутствуют:
        - статус = "not_defined"
        - текст = "Данные не определены"
        </task>
        <rules>
        - Используй только текст договора.
        - remote_work_status = "defined" только если прямо указана дистанционная работа.
        - work_nature_status = "defined" только если прямо указан характер работы
        (разъездной, в пути, подвижной).
        - Верни только JSON.
        </rules>
      fields:
        - name: "employer_details_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус идентификации работодателя."
          required: true
        - name: "employer_details_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Работодатель"
          description: "Наименование и реквизиты работодателя."
          required: true
        - name: "employee_details_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус идентификации работника."
          required: true
        - name: "employee_details_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Работник"
          description: "ФИО и данные работника."
          required: true
        - name: "position_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения трудовой функции."
          required: true
        - name: "position_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Должность"
          description: "Должность/профессия/специальность с квалификацией."
          required: true
        - name: "structural_unit_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания подразделения."
          required: false
        - name: "structural_unit_value"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Подразделение"
          description: "Структурное подразделение."
          required: false
        - name: "job_description_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус ссылки на должностную инструкцию."
          required: false
        - name: "job_description_value"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Должностная инструкция"
          description: "Ссылка на должностную инструкцию."
          required: false
        - name: "work_place_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения места работы."
          required: true
        - name: "work_place_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 4
          label: "Место работы"
          description: "Адрес места работы."
          required: true
        - name: "remote_work_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания дистанционной работы."
          required: false
        - name: "work_nature_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания характера работы."
          required: false
        - name: "work_nature_value"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Характер работы"
          description: "Характер работы (разъездной, в пути, подвижной)."
          required: false
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 2: Дата начала, срок, основание срочности, испытательный срок
  # ──────────────────────────────────────────────────────────────────────────
  - id: term_probation_check
    name: "Дата начала, срок договора, основание срочности и испытательный срок"
    description: >
      Фактографическая проверка даты начала работы, типа договора (бессрочный/срочный),
      срока и основания срочности (ст. 59 ТК РФ), испытательного срока и его длительности.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "дата начала работы"
        - "приступить к работе"
        - "срочный"
        - "на срок"
        - "основание"
        - "ст. 59"
        - "испытательный срок"
        - "испытание"
        - "не более 3 месяцев"
        - "без испытания"
        - "бессрочный"
        - "на неопределённый срок"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"
        - "(?i)срочн[ыо]й\\s+трудов"
        - "(?i)испытательн[ыо]й\\s+срок"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по трудовому праву.
        Анализируется трудовой договор (ст. 57–59, 70 ТК РФ).
        Проверяется только один вопрос: дата начала, срок, основание срочности,
        испытательный срок.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        [ЗАДАЧА]
        Найди в тексте договора:
        1. Дату начала работы.
        2. Тип договора: бессрочный или срочный.
        3. Срок договора (если срочный).
        4. Основание срочности (конкретный пункт ст. 59 ТК РФ или иное основание).
        5. Наличие испытательного срока.
        6. Длительность испытательного срока.
        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если данные не указаны прямо — возвращай "not_defined".
        3. Если текстового значения нет — возвращай строго "Данные не определены".
        4. В evidence включай только текст договора.
        5. Верни только один JSON-объект.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — срочный договор с основанием:
        Фрагмент:
        "Работник обязуется приступить к работе с 01.06.2026. Договор заключён
        на срок до 31.05.2027 в соответствии с абз. 2 ч. 1 ст. 59 ТК РФ
        (на время исполнения обязанностей отсутствующего работника).
