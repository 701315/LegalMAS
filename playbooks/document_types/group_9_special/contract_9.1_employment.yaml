      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по трудовому праву. Извлеки из трудового договора
        сведения об охране труда, СОУТ, гарантиях за вредные условия,
        медицинских осмотрах, оценке профессиональных рисков, санитарно-бытовом
        обслуживании, социальном и пенсионном страховании, персональных данных.
        Не анализируй оплату труда, рабочее время, отпуск или расторжение.
        </role>
        <context>
        {context}
        </context>
        <task>
        Заполни строго следующие 18 полей + evidence (всего 19 ключей):
        1. sout_class_status — "defined" или "not_defined".
        2. sout_class_value — класс условий труда по СОУТ.
        3. harmful_guarantees_status — "defined" или "not_defined".
        4. harmful_guarantees_value — гарантии за вредные/опасные условия.
        5. safety_obligations_status — "defined" или "not_defined".
        6. safety_obligations_value — обязательства работодателя по охране труда.
        7. medical_exams_status — "defined" или "not_defined".
        8. medical_exams_value — обязательные медицинские осмотры / психиатрическое освидетельствование.
        9. professional_risk_assessment_status — "defined" или "not_defined".
        10. professional_risk_assessment_value — оценка профессиональных рисков.
        11. sanitary_services_status — "defined" или "not_defined".
        12. sanitary_services_value — санитарно-бытовое обслуживание.
        13. social_insurance_status — "defined" или "not_defined".
        14. social_insurance_value — условие об обязательном социальном страховании.
        15. pension_insurance_status — "defined" или "not_defined".
        16. pension_insurance_value — условие об обязательном пенсионном страховании.
        17. personal_data_status — "defined" или "not_defined".
        18. personal_data_value — условие об обработке персональных данных.
        Если данные отсутствуют:
        - для *_status — "not_defined"
        - для *_value — "Данные не определены"
        </task>
        <rules>
        - Используй только текст договора.
        - Не выводи класс условий труда из закона — только из текста договора.
        - Различай:
          "СОУТ не проводилась" → sout_class_status = "defined",
          sout_class_value = "СОУТ не проводилась";
          отсутствие упоминания о СОУТ → sout_class_status = "not_defined".
        - Если условия труда, охрана труда, медосмотры, оценка профрисков,
        санбыт, соцстрах или ПДн определяются через отсылку к документу
        (Положение об охране труда, Положение о медосмотрах, Политика обработки
        ПДн, отдельное Согласие, Коллективный договор, Приложение) — фиксируй
        как "defined" со значением «согласно <документ>».
        - Если прямо указано, что дополнительные гарантии за вредные условия
        не устанавливаются — harmful_guarantees_status = "defined",
        harmful_guarantees_value = "не устанавливаются".
        - medical_exams_* — обязательные медицинские осмотры (ст. 213 ТК РФ)
        и психиатрическое освидетельствование.
        - professional_risk_assessment_* — оценка профессиональных рисков (ст. 214 ТК РФ).
        - sanitary_services_* — санитарно-бытовое обслуживание (ст. 223 ТК РФ).
        - Верни РОВНО один валидный JSON-объект со всеми 19 ключами,
        без markdown и комментариев.
        </rules>
      fields:
