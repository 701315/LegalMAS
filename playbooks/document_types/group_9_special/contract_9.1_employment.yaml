  - id: form_liability_confidentiality_check
    name: "Письменная форма, материальная ответственность и конфиденциальность"
    description: >
      Фактографическая проверка письменной формы в двух экземплярах,
      материальной ответственности (ограниченная/полная), порядка возмещения ущерба,
      условий о неразглашении коммерческой тайны/конфиденциальной информации.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "в двух экземплярах"
        - "экземпляр для работника"
        - "получение экземпляра подтверждается"
        - "подпись работника на экземпляре работодателя"
        - "материальная ответственность"
        - "полная материальная ответственность"
        - "ограниченная материальная ответственность"
        - "договор о полной материальной ответственности"
        - "порядок возмещения ущерба"
        - "возмещение ущерба"
        - "неразглашение"
        - "коммерческая тайна"
        - "конфиденциальная информация"
        - "служебная тайна"
        - "персональные данные"
        - "ответственность за разглашение"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)в\\s+двух\\s+экземпляр"
        - "(?i)материальн[а-яё]+\\s+ответственност"
        - "(?i)неразглашени"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по трудовому праву.
        Анализируется трудовой договор.
        Проверяется только один вопрос: письменная форма, материальная
        ответственность и конфиденциальность.
        Нормативный ориентир:
        - ст. 57 ТК РФ — содержание трудового договора
        - ст. 67 ТК РФ — форма трудового договора (письменная, два экземпляра)
        - ст. 238 ТК РФ — материальная ответственность работника за ущерб
        - ст. 241 ТК РФ — пределы материальной ответственности (средний месячный заработок)
        - ст. 242–243 ТК РФ — полная материальная ответственность
        - ст. 244 ТК РФ — письменные договоры о полной материальной ответственности
        - ст. 246–248 ТК РФ — порядок определения размера и взыскания ущерба
        - ст. 81 ч. 1 п. 6 пп. «в» ТК РФ — разглашение охраняемой тайны как основание увольнения
        - ФЗ от 29.07.2004 № 98-ФЗ — коммерческая тайна
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска, не подставляй нормы закона вместо текста.
        [ЗАДАЧА]
        Найди в тексте договора:
        1. Указание на два экземпляра договора.
        2. Указание на передачу экземпляра работнику и подтверждение получения.
        3. Тип материальной ответственности (ограниченная / полная / согласно ТК РФ).
        4. Указание на отдельный договор о полной материальной ответственности.
        5. Порядок возмещения ущерба.
        6. Условие о неразглашении коммерческой тайны / конфиденциальной информации.
        7. Ответственность за разглашение.
        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона вместо текста.
        2. Для *_status используй строго "defined" или "not_defined".
        3. Для *_value при отсутствии данных — строго "Данные не определены".
        4. liability_type_value: "ограниченная" — если прямо указана ограниченная
        ответственность (в т.ч. "в пределах среднего месячного заработка");
        "полная" — если прямо указана полная ответственность;
        "согласно ТК РФ" — если формулировка общая ("в соответствии с ТК РФ",
        "в порядке, установленном законодательством"); иначе "Данные не определены".
        5. separate_agreement_status = "defined" только если прямо указан отдельный
        договор о полной материальной ответственности.
        6. Если порядок возмещения ущерба определяется через отсылку к документу
        (Положение, Коллективный договор, Приложение) — фиксируй как "defined"
        со значением «согласно <документ>».
        7. Если условие о неразглашении определяется через отсылку к документу
        (Положение о коммерческой тайне, Политика, отдельный NDA) — фиксируй
        как "defined" со значением «согласно <документ>».
        8. В evidence включай только текст договора.
        9. Никогда не используй "None", "null", пустые строки или отсутствующие ключи.
        10. Верни РОВНО один валидный JSON-объект со всеми 15 ключами (14 полей + evidence),
        пригодный для парсинга через json.loads без предварительной обработки.
        Без markdown, без ```json, без комментариев, без текста до или после.
        Начни ответ сразу с { и закончи }.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — ограниченная МО + конфиденциальность:
        Фрагмент:
        "Настоящий договор составлен в двух экземплярах, имеющих одинаковую
        юридическую силу, по одному для каждой из сторон. Экземпляр для работника
        получен, что подтверждается подписью работника на экземпляре работодателя.
        Работник несёт ограниченную материальную ответственность в пределах
        среднего месячного заработка. Работник обязуется не разглашать
        коммерческую тайну работодателя. За разглашение — ответственность
        в соответствии с законодательством РФ."
        Ответ:
        {
          "two_copies_status": "defined",
          "two_copies_value": "в двух экземплярах, по одному для каждой из сторон",
          "employee_copy_status": "defined",
          "employee_copy_value": "экземпляр для работника получен, подтверждается подписью",
          "liability_type_status": "defined",
          "liability_type_value": "ограниченная в пределах среднего месячного заработка",
          "separate_agreement_status": "not_defined",
          "separate_agreement_value": "Данные не определены",
          "damage_procedure_status": "not_defined",
          "damage_procedure_value": "Данные не определены",
          "confidentiality_status": "defined",
          "confidentiality_value": "обязуется не разглашать коммерческую тайну работодателя",
          "disclosure_liability_status": "defined",
          "disclosure_liability_value": "ответственность в соответствии с законодательством РФ",
          "evidence": [
            {
              "clause_ref": "п. 9.1",
              "quote": "Настоящий договор составлен в двух экземплярах, имеющих одинаковую юридическую силу, по одному для каждой из сторон."
            }
          ]
        }
        Пример 2 — полная МО с отдельным договором + отсылка к Положению о КТ:
        Фрагмент:
        "Настоящий договор составлен в двух экземплярах, по одному для каждой стороны.
        С работником заключается отдельный договор о полной материальной
        ответственности. Порядок возмещения ущерба определяется в соответствии
        со ст. 246–248 ТК РФ. Условия неразглашения — согласно Положению
        о коммерческой тайне работодателя."
        Ответ:
        {
          "two_copies_status": "defined",
          "two_copies_value": "в двух экземплярах, по одному для каждой стороны",
          "employee_copy_status": "not_defined",
          "employee_copy_value": "Данные не определены",
          "liability_type_status": "defined",
          "liability_type_value": "полная",
          "separate_agreement_status": "defined",
          "separate_agreement_value": "предусмотрен отдельный договор о полной материальной ответственности",
          "damage_procedure_status": "defined",
          "damage_procedure_value": "в соответствии со ст. 246–248 ТК РФ",
          "confidentiality_status": "defined",
          "confidentiality_value": "согласно Положению о коммерческой тайне работодателя",
          "disclosure_liability_status": "not_defined",
          "disclosure_liability_value": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 8.3",
              "quote": "С работником заключается отдельный договор о полной материальной ответственности."
            }
          ]
        }
        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Работник выполняет свои обязанности в соответствии с договором."
        Ответ:
        {
          "two_copies_status": "not_defined",
          "two_copies_value": "Данные не определены",
          "employee_copy_status": "not_defined",
          "employee_copy_value": "Данные не определены",
          "liability_type_status": "not_defined",
          "liability_type_value": "Данные не определены",
          "separate_agreement_status": "not_defined",
          "separate_agreement_value": "Данные не определены",
          "damage_procedure_status": "not_defined",
          "damage_procedure_value": "Данные не определены",
          "confidentiality_status": "not_defined",
          "confidentiality_value": "Данные не определены",
          "disclosure_liability_status": "not_defined",
          "disclosure_liability_value": "Данные не определены",
          "evidence": []
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Проверь, что все 15 ключей (14 полей + evidence) присутствуют в JSON.
        2. Проверь, что каждый *_status ∈ {"defined", "not_defined"}, а каждый *_value
        при отсутствии данных = "Данные не определены".
        3. Проверь, что для каждого defined-поля в evidence есть прямая цитата из договора.
        4. Убедись, что liability_type_value отражает именно то, что написано
        в договоре (ограниченная / полная / согласно ТК РФ), без домыслов.
        5. Убедись, что отсылки к Положению о коммерческой тайне / Коллективному
        договору / отдельному NDA / Приложению фиксированы как defined
        со значением «согласно <документ>».
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "two_copies_status": "<defined / not_defined>",
          "two_copies_value": "<текст / 'Данные не определены'>",
          "employee_copy_status": "<defined / not_defined>",
          "employee_copy_value": "<текст / 'Данные не определены'>",
          "liability_type_status": "<defined / not_defined>",
          "liability_type_value": "<ограниченная / полная / 'согласно ТК РФ' / 'Данные не определены'>",
          "separate_agreement_status": "<defined / not_defined>",
          "separate_agreement_value": "<текст / 'Данные не определены'>",
          "damage_procedure_status": "<defined / not_defined>",
          "damage_procedure_value": "<текст / 'согласно <документ>' / 'Данные не определены'>",
          "confidentiality_status": "<defined / not_defined>",
          "confidentiality_value": "<текст / 'согласно <документ>' / 'Данные не определены'>",
          "disclosure_liability_status": "<defined / not_defined>",
          "disclosure_liability_value": "<текст / 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 950

    retrieval:
      corpus_scope: "primary_segment"
      levels:
