        - "section"
      required_kind: "legal_unit"
      retrieval_query: "в двух экземплярах экземпляр для работника получение экземпляра подтверждается подпись работника на экземпляре работодателя материальная ответственность полная материальная ответственность ограниченная материальная ответственность договор о полной материальной ответственности порядок возмещения ущерба неразглашение коммерческая тайна конфиденциальная информация служебная тайна ответственность за разглашение"
      preferred_unit_types:
