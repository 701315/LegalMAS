      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по трудовому праву. Извлеки из трудового договора
        сведения об охране труда, СОУТ, гарантиях за вредные условия,
        медицинских осмотрах, оценке профессиональных рисков, санитарно-бытовом
        обслуживании, социальном и пенсионном страховании, персональных данных.
        Не анализируй оплату труда, рабочее время, отпуск или расторжение.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. safety_social_insurance_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "missing" — если фрагментов по теме в тексте нет вообще
             (следствие: все содержательные поля = "not_defined");
           - "present" — если фрагменты по теме есть: либо хотя бы одно
             содержательное поле ≠ "not_defined", либо тема упомянута,
             но прямо исключена / отложена на будущее / раскрыта только общей фразой;
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - sout_class_status = "not_defined";
           - harmful_guarantees_status = "not_defined";
           - safety_obligations_status = "not_defined";
           - medical_exams_status = "not_defined";
           - professional_risk_assessment_status = "not_defined";
           - sanitary_services_status = "not_defined";
           - social_insurance_status = "not_defined";
           - pension_insurance_status = "not_defined";
           - personal_data_status = "not_defined";
           - все *_value = "Данные не определены";
           - не выполняй остальные шаги.

        1. sout_class_status:
           - "defined" — если класс условий труда по СОУТ прямо указан в тексте,
             или прямо указано, что СОУТ не проводилась;
           - "not_defined" — если класс условий труда прямо не указан.

        2. sout_class_value:
           Класс условий труда по результатам СОУТ на русском языке.
           Если СОУТ не проводилась — "СОУТ не проводилась".
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        3. harmful_guarantees_status:
           - "defined" — если в тексте прямо указаны гарантии за вредные/опасные условия,
             или прямо указано, что они не устанавливаются;
           - "not_defined" — если гарантии прямо не указаны.

        4. harmful_guarantees_value:
           Гарантии за вредные/опасные условия труда на русском языке.
           Если не устанавливаются — "не устанавливаются".
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        5. safety_obligations_status:
           - "defined" — если в тексте прямо указаны обязательства работодателя по охране труда;
           - "not_defined" — если обязательства прямо не указаны.

        6. safety_obligations_value:
           Обязательства работодателя по охране труда на русском языке.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        7. medical_exams_status:
           - "defined" — если в тексте прямо указаны обязательные медицинские осмотры
             или психиатрическое освидетельствование;
           - "not_defined" — если они прямо не указаны.

        8. medical_exams_value:
           Обязательные медицинские осмотры и психиатрическое освидетельствование на русском языке.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        9. professional_risk_assessment_status:
           - "defined" — если в тексте прямо указана оценка профессиональных рисков;
           - "not_defined" — если она прямо не указана.

        10. professional_risk_assessment_value:
            Оценка профессиональных рисков на русском языке.
            Если данных нет — "Данные не определены".
            Если данные противоречивы — "Не удалось определить".

        11. sanitary_services_status:
            - "defined" — если в тексте прямо указано санитарно-бытовое обслуживание;
            - "not_defined" — если оно прямо не указано.

        12. sanitary_services_value:
            Санитарно-бытовое обслуживание на русском языке.
            Если данных нет — "Данные не определены".
            Если данные противоречивы — "Не удалось определить".

        13. social_insurance_status:
            - "defined" — если в тексте прямо указано условие об обязательном социальном страховании;
            - "not_defined" — если оно прямо не указано.

        14. social_insurance_value:
            Условие об обязательном социальном страховании на русском языке.
            Если данных нет — "Данные не определены".
            Если данные противоречивы — "Не удалось определить".

        15. pension_insurance_status:
            - "defined" — если в тексте прямо указано условие об обязательном пенсионном страховании;
            - "not_defined" — если оно прямо не указано.

        16. pension_insurance_value:
            Условие об обязательном пенсионном страховании на русском языке.
            Если данных нет — "Данные не определены".
            Если данные противоречивы — "Не удалось определить".

        17. personal_data_status:
            - "defined" — если в тексте прямо указано условие об обработке персональных данных;
            - "not_defined" — если оно прямо не указано.

        18. personal_data_value:
            Условие об обработке персональных данных на русском языке.
            Если данных нет — "Данные не определены".
            Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни safety_social_insurance_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_value = "Данные не определены".
        - Используй только текст договора.
        - Не выводи класс условий труда из закона — только из текста договора.
        - Различай:
          "СОУТ не проводилась" → sout_class_status = "defined", sout_class_value = "СОУТ не проводилась";
          отсутствие упоминания о СОУТ → sout_class_status = "not_defined".
        - Если условия труда, охрана труда, медосмотры, оценка профрисков,
          санбыт, соцстрах или ПДн определяются через отсылку к документу
          (Положение об охране труда, Положение о медосмотрах, Политика обработки
          ПДн, отдельное Согласие, Коллективный договор, Приложение) — фиксируй
          как "defined" со значением «согласно <документ>».
        - Если прямо указано, что дополнительные гарантии за вредные условия
          не устанавливаются — harmful_guarantees_status = "defined", harmful_guarantees_value = "не устанавливаются".
        - Если в разных фрагментах указаны разные данные и конфликт нельзя разрешить по тексту —
          статус → "not_defined", значение → "Не удалось определить".
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни СОУТ, ни гарантий за вредные условия, ни охраны труда,
           ни медосмотров, ни соцстраха, ни ПДн.
           → presence = "missing";
             все девять *_status = "not_defined";
             все *_value = "Данные не определены".

        2. Частичное раскрытие темы.
           Указаны только условия труда и соцстрах, но нет гарантий, медосмотров,
           профрисков, санбыта и ПДн.
           → presence = "present";
             указанные *_status = "defined";
             неуказанные *_status = "not_defined";
             неуказанные *_value = "Данные не определены".

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные классы условий труда или противоречащие гарантии.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             соответствующее *_value = "Не удалось определить".

        4. Отсылка на Положение об охране труда / Политику ПДн / отдельное Согласие.
           Условия труда, медосмотры или обработка ПДн определяются отдельным документом.
           → presence = "present";
             соответствующий *_status = "defined";
             соответствующее *_value содержит формулировку вида «согласно Положению об охране труда».
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для safety_social_insurance_check_presence используй только: "present", "missing", "unclear".
        - Для всех *_status используй только: "defined" или "not_defined".
        - Fallback при отсутствии данных:
          * все *_value → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_value → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "safety_social_insurance_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
