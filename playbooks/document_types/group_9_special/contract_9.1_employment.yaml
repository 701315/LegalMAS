trigger_definitions:
  indefinite_term:
    any_keywords:
      - "(?i)\\bбессрочн[ыо]й\\b"
      - "(?i)на\\s+неопредел[её]нн[ыо]й\\s+срок"
      - "(?i)без\\s+указани[яя]\\s+срока"

  fixed_term:
    any_keywords:
      - "(?i)срочн[ыо]й\\s+трудов[оа]й\\s+договор"
      - "(?i)заключ[её]н\\s+на\\s+срок"
      - "(?i)на\\s+период"
      - "(?i)временн[а-яё]+\\s+работ[аа]"
      - "(?i)сезонн[а-яё]+\\s+работ[аа]"
      - "(?i)ст\\.\\s*59\\s*ТК\\s*РФ"

  probation_period:
    any_keywords:
      - "(?i)испытательн[ыо]й\\s+срок"
      - "(?i)\\bиспытани[ея]\\b"
      - "(?i)срок\\s+испытани[яя]"

  remote_work:
    any_keywords:
      - "(?i)дистанционн[а-яё]+\\s+работ[аа]"
      - "(?i)удал[её]нн[а-яё]+\\s+работ[аа]"
      - "(?i)вне\\s+мест[аа]\\s+нахождени[яя]\\s+работодател[яя]"
      - "(?i)ст\\.\\s*312\\.1\\s*ТК\\s*РФ"

  harmful_conditions:
    any_keywords:
      - "(?i)вредн[ыо]е\\s+услови[яя]"
      - "(?i)опасн[ыо]е\\s+услови[яя]"
      - "(?i)спецоценк[аа]\\s+услови[йя]\\s+труда"
      - "(?i)\\bСОУТ\\b"
      - "(?i)класс\\s+услови[йя]\\s+труда\\s*3"
      - "(?i)класс\\s+услови[йя]\\s+труда\\s*4"

  part_time:
    any_keywords:
      - "(?i)неполн[оа]е\\s+рабоч[ео]е\\s+время"
      - "(?i)неполн[ыо]й\\s+рабоч[иоя]+\\s+день"
      - "(?i)неполн[а-яё]+\\s+рабоч[а-яё]+\\s+недел[яя]"

  shift_work:
    any_keywords:
