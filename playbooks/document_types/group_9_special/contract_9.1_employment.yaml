        - name: "non_solicitation_value"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Запрет переманивания (non-solicitation)"
          description: "Условие о запрете переманивания."
          required: false
        - name: "dispute_resolution_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения порядка разрешения споров."
          required: true
        - name: "dispute_resolution_value"
