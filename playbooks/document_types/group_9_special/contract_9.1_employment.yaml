          required: false
        - name: "compensation_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус компенсации за использование имущества."
          required: true
        - name: "compensation_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Компенсация за имущество"
          description: "Компенсация за использование имущества работника."
          required: false
        - name: "interaction_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус порядка взаимодействия."
          required: true
        - name: "interaction_value"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Порядок взаимодействия"
          description: "Порядок взаимодействия и приёмки работы."
          required: false

  - id: compliance_and_conflict_check
    name: "Комплаенс и конфликт интересов"
    description: >
      Фактографическая проверка условий о соблюдении Кодекса деловой этики,
      антикоррупционных оговорок, порядке уведомления о конфликте интересов,
      ограничениях на совместительство / участие в других организациях,
      а также о разрешении конфликта интересов.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "medium"
    severity_if_pass: "pass"
    severity_if_fail: "medium"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "Кодекс деловой этики"
        - "корпоративная этика"
        - "антикоррупционная оговорка"
        - "антикоррупция"
        - "конфликт интересов"
        - "аффилированность"
        - "уведомление о конфликте"
        - "комплаенс"
        - "подарки"
        - "откаты"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)конфликт[а-яё]*\\s+интерес"
        - "(?i)антикоррупц"
        - "(?i)Кодекс[а-яё]*\\s+деловой\\s+этик"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по трудовому праву.
        Анализируется трудовой договор.
        Проверяется только один вопрос: комплаенс и конфликт интересов.
        Нормативный ориентир:
        - ст. 57 ТК РФ — содержание трудового договора (дополнительные условия)
        - ст. 275 ТК РФ — дополнительные условия для руководителя организации
        - ФЗ от 25.12.2008 № 273-ФЗ — противодействие коррупции
        - ФЗ от 07.05.2013 № 79-ФЗ — запреты для отдельных категорий
        - Локальные акты (Кодекс деловой этики, Антикоррупционная политика)
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска, не подставляй нормы закона вместо текста.
        - Комплаенс-условия — типовые для крупных работодателей.
        [ЗАДАЧА]
        Найди в тексте договора:
        1. Условие о соблюдении Кодекса деловой этики / ЛНА.
        2. Антикоррупционную оговорку.
        3. Порядок уведомления о конфликте интересов.
        4. Ограничения на участие в других организациях / совместительство
        в конкурентах.
        5. Порядок разрешения конфликта интересов.
        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона вместо текста.
        2. Для *_status используй строго "defined" или "not_defined".
        3. Для *_value при отсутствии данных — строго "Данные не определены".
        4. code_of_ethics_* фиксирует условие о соблюдении Кодекса деловой этики
        или иных ЛНА.
        5. anti_corruption_* фиксирует антикоррупционную оговорку.
        6. conflict_notification_* фиксирует обязанность уведомлять о конфликте
        интересов.
        7. participation_restrictions_* фиксирует ограничения на участие в других
        организациях / совместительство в конкурентах.
        8. conflict_resolution_* фиксирует порядок разрешения конфликта интересов.
        9. Если условие определяется через отсылку к документу (Кодекс деловой
        этики, Антикоррупционная политика) — фиксируй как "defined"
        со значением «согласно <документ>».
        10. В evidence включай только текст договора.
        11. Никогда не используй "None", "null", пустые строки или отсутствующие ключи.
        12. Верни РОВНО один валидный JSON-объект со всеми 11 ключами (10 полей + evidence),
        пригодный для парсинга через json.loads без предварительной обработки.
        Без markdown, без ```json, без комментариев, без текста до или после.
        Начни ответ сразу с { и закончи }.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — комплаенс, полная структура:
        Фрагмент:
        "Работник обязуется соблюдать Кодекс деловой этики и Антикоррупционную
        политику работодателя. Работник обязуется уведомлять работодателя
        о возникновении конфликта интересов. Работник не вправе участвовать
        в органах управления конкурентов."
        Ответ:
        {
          "code_of_ethics_status": "defined",
          "code_of_ethics_value": "Кодекс деловой этики и Антикоррупционная политика работодателя",
          "anti_corruption_status": "defined",
          "anti_corruption_value": "Антикоррупционная политика работодателя",
          "conflict_notification_status": "defined",
          "conflict_notification_value": "обязанность уведомлять о возникновении конфликта интересов",
          "participation_restrictions_status": "defined",
          "participation_restrictions_value": "не вправе участвовать в органах управления конкурентов",
          "conflict_resolution_status": "not_defined",
          "conflict_resolution_value": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 7.1",
              "quote": "Работник обязуется соблюдать Кодекс деловой этики и Антикоррупционную политику работодателя."
            }
          ]
        }
        Пример 2 — только антикоррупционная оговорка:
        Фрагмент:
        "Работник обязуется не совершать действий, связанных с коррупцией,
        не давать и не получать взятки, не участвовать в коммерческом подкупе."
        Ответ:
        {
          "code_of_ethics_status": "not_defined",
          "code_of_ethics_value": "Данные не определены",
          "anti_corruption_status": "defined",
          "anti_corruption_value": "не совершать действий, связанных с коррупцией, не давать и не получать взятки, не участвовать в коммерческом подкупе",
          "conflict_notification_status": "not_defined",
          "conflict_notification_value": "Данные не определены",
          "participation_restrictions_status": "not_defined",
          "participation_restrictions_value": "Данные не определены",
          "conflict_resolution_status": "not_defined",
          "conflict_resolution_value": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 7.2",
              "quote": "Работник обязуется не совершать действий, связанных с коррупцией."
            }
          ]
        }
        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Работник выполняет свои обязанности в соответствии с договором."
        Ответ:
        {
          "code_of_ethics_status": "not_defined",
          "code_of_ethics_value": "Данные не определены",
          "anti_corruption_status": "not_defined",
          "anti_corruption_value": "Данные не определены",
          "conflict_notification_status": "not_defined",
          "conflict_notification_value": "Данные не определены",
          "participation_restrictions_status": "not_defined",
          "participation_restrictions_value": "Данные не определены",
          "conflict_resolution_status": "not_defined",
          "conflict_resolution_value": "Данные не определены",
          "evidence": []
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Проверь, что все 11 ключей (10 полей + evidence) присутствуют в JSON.
        2. Проверь, что каждый *_status ∈ {"defined", "not_defined"}, а каждый *_value
        при отсутствии данных = "Данные не определены".
        3. Проверь, что для каждого defined-поля в evidence есть прямая цитата из договора.
        4. Убедись, что отсылки к Кодексу деловой этики / Антикоррупционной политике /
        ЛНА фиксированы как defined со значением «согласно <документ>».
        5. Убедись, что обязанность уведомлять о конфликте интересов отражена
        в conflict_notification_*, а не в code_of_ethics_*.
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "code_of_ethics_status": "<defined / not_defined>",
          "code_of_ethics_value": "<текст / 'согласно <документ>' / 'Данные не определены'>",
          "anti_corruption_status": "<defined / not_defined>",
          "anti_corruption_value": "<текст / 'согласно <документ>' / 'Данные не определены'>",
          "conflict_notification_status": "<defined / not_defined>",
          "conflict_notification_value": "<текст / 'Данные не определены'>",
          "participation_restrictions_status": "<defined / not_defined>",
          "participation_restrictions_value": "<текст / 'Данные не определены'>",
          "conflict_resolution_status": "<defined / not_defined>",
          "conflict_resolution_value": "<текст / 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 800

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "Кодекс деловой этики корпоративная этика антикоррупционная оговорка антикоррупция конфликт интересов аффилированность уведомление о конфликте комплаенс подарки откаты участие в других организациях"
      preferred_unit_types:
        - obligation
        - general_provision
        - definition
      excluded_unit_types:
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - boilerplate
        - definitions
      boost_keywords:
        - "Кодекс деловой этики"
        - "антикоррупционная"
        - "конфликт интересов"
        - "Антикоррупционная политика"
      negative_keywords:
        - "трудовая функция"
        - "оклад"
        - "заработная плата"
        - "рабочее время"
        - "конфиденциальность"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.40, 0.85]
        boost: 0.30
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "boilerplate"
        - "definitions"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 1200
      store_payload: true

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по трудовому праву. Извлеки из трудового договора
        сведения о комплаенс-условиях и конфликте интересов.
        Не анализируй оплату труда или расторжение.
        </role>
        <context>
        {context}
        </context>
        <task>
        Заполни строго следующие 10 полей + evidence (всего 11 ключей):
        1. code_of_ethics_status — "defined" или "not_defined".
        2. code_of_ethics_value — Кодекс деловой этики / ЛНА.
        3. anti_corruption_status — "defined" или "not_defined".
        4. anti_corruption_value — антикоррупционная оговорка.
        5. conflict_notification_status — "defined" или "not_defined".
        6. conflict_notification_value — уведомление о конфликте интересов.
        7. participation_restrictions_status — "defined" или "not_defined".
        8. participation_restrictions_value — ограничения на участие в других организациях.
        9. conflict_resolution_status — "defined" или "not_defined".
        10. conflict_resolution_value — порядок разрешения конфликта интересов.
        Если данные отсутствуют:
        - для *_status — "not_defined"
        - для *_value — "Данные не определены"
        </task>
        <rules>
        - Используй только текст договора.
        - Если условие определяется через отсылку к документу — фиксируй
        как "defined" со значением «согласно <документ>».
        - Верни РОВНО один валидный JSON-объект со всеми 11 ключами,
        без markdown и комментариев.
        </rules>
      fields:
        - name: "code_of_ethics_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус условия о Кодексе деловой этики."
          required: true
        - name: "code_of_ethics_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Кодекс деловой этики"
          description: "Условие о соблюдении Кодекса деловой этики / ЛНА."
          required: false
        - name: "anti_corruption_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус антикоррупционной оговорки."
          required: true
        - name: "anti_corruption_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Антикоррупционная оговорка"
          description: "Антикоррупционная оговорка."
          required: false
        - name: "conflict_notification_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус обязанности уведомлять о конфликте интересов."
          required: true
        - name: "conflict_notification_value"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Уведомление о конфликте"
          description: "Обязанность уведомлять о конфликте интересов."
          required: false
        - name: "participation_restrictions_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус ограничений на участие в других организациях."
          required: true
        - name: "participation_restrictions_value"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Ограничения участия"
          description: "Ограничения на участие в других организациях."
          required: false
        - name: "conflict_resolution_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус порядка разрешения конфликта интересов."
          required: true
        - name: "conflict_resolution_value"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Разрешение конфликта"
          description: "Порядок разрешения конфликта интересов."
          required: false

# ════════════════════════════════════════════════════════════════════════════
# БЛОК 5: DD_REQUEST_TEMPLATES
# Читается: DDRequestTemplateLoader
# ════════════════════════════════════════════════════════════════════════════

dd_request_templates:
  parties_function_place_check:
    text: >
      Просим чётко указать в {doc_names}: (а) трудовую функцию — должность/профессию/
      специальность с квалификацией ИЛИ конкретный вид работы (без трудовой функции
      договор незаключён — ст. 57 ТК РФ); (б) место работы — адрес, подразделение,
      филиал; (в) приложить должностную инструкцию; (г) характер работы
      (разъездной, в пути, подвижной) — если применимо (ст. 57 ТК РФ).
    addressee: "Отдел кадров / Работодатель"

  term_probation_check:
    text: >
      Просим указать в {doc_names}: (а) дату начала работы; (б) для срочного договора —
      срок и основание по ст. 59 ТК РФ (без основания → бессрочный, ст. 58 ТК РФ);
      (в) испытательный срок — не более 3 месяцев (6 для руководителей), проверить
      запреты для беременных, несовершеннолетних, выпускников (ст. 70 ТК РФ).
    addressee: "Отдел кадров / Юридический отдел"

  payment_structure_check:
    text: >
      Просим согласовать для {doc_names}: (а) оклад/тарифную ставку (не ниже МРОТ —
      ст. 133 ТК РФ); (б) доплаты, надбавки, премии и порядок премирования;
      (в) конкретные даты выплаты заработной платы (не реже 2 раз в месяц —
      ст. 136 ТК РФ); (г) расчётный листок.
    addressee: "Финансовый отдел / Отдел кадров"

  working_hours_leave_check:
    text: >
      Просим согласовать для {doc_names}: (а) продолжительность рабочего времени
      (не более 40 ч/нед — ст. 91 ТК РФ); (б) график, перерывы, выходные;
      (в) ненормированный рабочий день (если применимо); (г) ежегодный отпуск —
      не менее 28 календарных дней (ст. 115 ТК РФ); (д) дополнительные отпуска
      (за вредные условия, ненормированный день); (е) условия сверхурочной работы
      и компенсации (ст. 99, 152, 153 ТК РФ).
    addressee: "Отдел кадров"

  safety_social_insurance_check:
    text: >
      Просим указать в {doc_names}: (а) условия труда на рабочем месте по результатам
      СОУТ — класс условий труда (обязательно с 2014 г. — ФЗ-426); (б) при вредных/
      опасных условиях — гарантии: сокращённый день, допотпуск, доплата, молоко, СИЗ
      (ст. 92, 117, 147 ТК РФ); (в) обязательства работодателя по охране труда
      (ст. 214 ТК РФ); (г) обязательное социальное и пенсионное страхование
      (ст. 57 ТК РФ); (д) согласие на обработку персональных данных (ФЗ-152).
    addressee: "Отдел охраны труда / Отдел кадров"

  form_liability_confidentiality_check:
    text: >
      Просим обеспечить в {doc_names}: (а) два экземпляра, один — работнику,
      подтверждение получения подписью (ст. 67 ТК РФ); (б) при полной материальной
      ответственности — должность в перечне (ст. 244 ТК РФ), отдельный договор
      о полной МО, порядок возмещения ущерба; (в) при доступе к коммерческой тайне —
      условие о неразглашении (ст. 57 ТК РФ, ФЗ-98), ответственность за разглашение.
    addressee: "Отдел кадров / Юридический отдел"

  termination_modification_rights_check:
    text: >
      Просим обеспечить в {doc_names}: (а) увольнение только по основаниям
      ст. 77–81 ТК РФ с соблюдением процедуры; (б) выходное пособие при сокращении;
      (в) изменение условий — по соглашению сторон (ст. 72 ТК РФ) или по инициативе
      работодателя с уведомлением за 2 месяца (ст. 74 ТК РФ); (г) исключить условия,
      ограничивающие права работника (ст. 9 ТК РФ) и дискриминационные условия (ст. 3 ТК РФ).
    addressee: "Юридический отдел"

  non_compete_disputes_check:
    text: >
      В {doc_names} выявлено условие о запрете конкуренции (non-compete). В российском
      трудовом праве такие условия не имеют юридической силы (не предусмотрены ТК РФ,
      ограничивают право на труд — ст. 37 Конституции РФ). Просим получить правовое
      заключение и рассмотреть альтернативы (условие о конфиденциальности, NDA).
      Также просим согласовать порядок разрешения трудовых споров (переговоры, КТС,
      медиация) и указать ссылку на коллективный договор (при наличии).
    addressee: "Юридический отдел"

  _default:
    text: >
      Просим предоставить дополнительную информацию по вопросу «{check_name}»
      применительно к {doc_names}.
    addressee: "Юридический советник"
