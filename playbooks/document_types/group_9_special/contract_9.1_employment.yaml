    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1200

      compact_output: false

      presence_signal:
        field: "ip_assignment_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по трудовому праву и интеллектуальной собственности.
        Извлеки из трудового договора сведения о принадлежности прав
        на служебные произведения и иные объекты IP.
        Не анализируй оплату труда, режим работы или расторжение.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 10 полей + evidence (всего 11 ключей):

        0. ip_assignment_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (ip_assignment_status, ip_scope_status, prior_ip_status,
              ip_compensation_status, third_party_ip_status) ≠ "not_defined";
           - "missing" — если все пять содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - все пять *_status = "not_defined";
           - все *_value = "Данные не определены";
           - не выполняй остальные шаги.

        1. ip_assignment_status — "defined" или "not_defined".
        2. ip_assignment_value — общая оговорка о принадлежности служебных
           результатов работодателю.
        3. ip_scope_status — "defined" или "not_defined".
        4. ip_scope_value — перечень типов объектов IP.
        5. prior_ip_status — "defined" или "not_defined".
        6. prior_ip_value — исключение IP, созданных до трудоустройства.
        7. ip_compensation_status — "defined" или "not_defined".
        8. ip_compensation_value — условие о вознаграждении.
        9. third_party_ip_status — "defined" или "not_defined".
        10. third_party_ip_value — условия о взаимодействии с IP третьих лиц.

        Если данные отсутствуют:
        - для *_status — "not_defined"
        - для *_value — "Данные не определены"
        </task>

        <context_rules>
        - Перед остальными полями заполни ip_assignment_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_value = "Данные не определены".
        - Используй только текст договора.
        - Оговорка о принадлежности IP не выводится из ст. 1295 ГК РФ
          по умолчанию — только из текста.
        - Если условие определяется через отсылку к документу (Соглашение
          о служебных произведениях, Приложение) — фиксируй как "defined"
          со значением «согласно <документ>».
        - Если в разных фрагментах указаны разные данные и конфликт нельзя
          разрешить по тексту — статус → "not_defined", значение → "Не удалось определить".
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни оговорки о принадлежности IP, ни перечня объектов,
           ни вознаграждения, ни prior IP.
           → presence = "missing";
             все пять *_status = "not_defined";
             все *_value = "Данные не определены".

        2. Только общая оговорка без деталей.
           Указано, что служебные результаты принадлежат работодателю,
           но нет перечня объектов и вознаграждения.
           → presence = "present";
             ip_assignment_status = "defined";
             ip_scope_status = "not_defined";
             ip_compensation_status = "not_defined";
             соответствующие *_value = "Данные не определены".

        3. Противоречие между фрагментами.
           В разных частях договора указана разная принадлежность прав
           на одни и те же объекты.
           → presence = "unclear";
             ip_assignment_status = "not_defined";
             ip_assignment_value = "Не удалось определить".

        4. Отсылка на отдельное соглашение.
           Условия о принадлежности IP и вознаграждении определяются
           отдельным документом (Соглашение о служебных произведениях).
           → presence = "present";
             ip_assignment_status = "defined";
             ip_assignment_value содержит формулировку вида
             «согласно Соглашению о служебных произведениях».
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для ip_assignment_check_presence используй только: "present", "missing", "unclear".
        - Для всех *_status используй только: "defined" или "not_defined".
        - Fallback при отсутствии данных:
          * все *_value → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_value → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "ip_assignment_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие условий о принадлежности прав на служебные произведения. Внутреннее агрегатное signal-поле."
          required: true

        - name: "ip_assignment_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус наличия оговорки о принадлежности IP-прав. Внутреннее enum-поле."
          required: true

        - name: "ip_assignment_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Принадлежность IP"
          description: >
            Оговорка о принадлежности служебных результатов работодателю. Fallback: "Не установлено" / "Не удалось определить".
          required: true

        - name: "ip_scope_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания перечня объектов IP. Внутреннее enum-поле."
          required: true

        - name: "ip_scope_value"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Объекты IP"
          description: >
            Перечень типов объектов IP, на которые распространяется оговорка. Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "prior_ip_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус оговорки об IP, созданных до трудоустройства. Внутреннее enum-поле."
          required: true

        - name: "prior_ip_value"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Prior IP"
          description: >
            Оговорка об исключении IP, созданных до трудоустройства. Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "ip_compensation_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус условия о вознаграждении за служебные произведения. Внутреннее enum-поле."
          required: true

        - name: "ip_compensation_value"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Вознаграждение за IP"
          description: >
            Условие о вознаграждении за служебные произведения. Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "third_party_ip_status"
          type: "string"
          presentation: "signal"
          risk_weight: "low"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус условий о взаимодействии с IP третьих лиц. Внутреннее enum-поле."
          required: true

        - name: "third_party_ip_value"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "IP третьих лиц"
          description: >
            Условия о взаимодействии с IP третьих лиц (opensource, подрядчики). Fallback: "Не установлено" / "Не удалось определить".
          required: false

      store_payload: true

  - id: key_employee_retention_check
    name: "Удержание ключевых сотрудников: retention-бонусы, отложенные выплаты, clawback"
    description: >
      Фактографическая проверка условий об удержании ключевых сотрудников:
      retention-бонусы, отложенные компенсации, условия возврата выплат
      (clawback), компенсация за отказ от конкуренции. Критично для M&A:
      покупатель должен оценить объём скрытых обязательств и риск ухода
      ключевых сотрудников после сделки.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "retention bonus"
        - "бонус за удержание"
        - "удержание ключевых сотрудников"
        - "отложенная выплата"
        - "deferred compensation"
        - "clawback"
        - "возврат выплат"
        - "золотой парашют"
        - "компенсация при увольнении"
        - "выплата при смене контроля"
        - "change of control"
        - "долгосрочная мотивация"
        - "LTI"
        - "долгосрочный бонус"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)retention[\\s-]?bonus"
        - "(?i)бонус[а-яё]*\\s+за\\s+удержани"
        - "(?i)отложенн[а-яё]+\\s+выплат"
        - "(?i)clawback|возврат[а-яё]*\\s+выплат"
        - "(?i)смен[а-яё]*\\s+контрол"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по трудовому праву.
        Анализируется трудовой договор (ст. 57, 129, 135, 136, 191 ТК РФ;
        ст. 429.2 ГК РФ).
        Проверяется только один вопрос: условия удержания ключевых сотрудников.
        Нормативный ориентир:
        - ст. 135 ТК РФ — установление заработной платы (включая стимулирующие
        выплаты).
        - ст. 191 ТК РФ — поощрения за труд.
        - ст. 57 ТК РФ — дополнительные условия трудового договора.
        - ст. 429.2 ГК РФ — опцион на заключение договора (если применимо
        к equity-компоненте).
        - ст. 279 ТК РФ — компенсация руководителю при расторжении.
        - ФЗ от 08.03.2015 № 42-ФЗ — введение опционных конструкций в ГК РФ.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска, не подставляй нормы закона вместо текста.
        - Для M&A критично: retention-бонусы и отложенные выплаты — это
        финансовые обязательства, которые переходят к покупателю.
        - Различай:
          1) Retention-бонус (разовая выплата за удержание);
          2) Отложенная компенсация (deferred compensation);
          3) Clawback (условия возврата уже выплаченного);
          4) Компенсация при уходе / смене контроля.
        [ЗАДАЧА]
        Найди в тексте договора:
        1. Retention-бонус (условия, размер, привязка к сроку).
        2. Отложенную компенсацию (deferred compensation).
        3. Условия clawback (возврат выплат).
        4. Компенсацию при увольнении / смене контроля.
        5. Условия, привязанные к M&A-сделке.
        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона вместо текста.
        2. Для *_status используй строго "defined" или "not_defined".
        3. Для *_value при отсутствии данных — строго "Данные не определены".
        4. retention_bonus_* фиксирует retention-бонус (разовая выплата
        за удержание).
        5. deferred_compensation_* фиксирует отложенные выплаты.
        6. clawback_* фиксирует условия возврата выплат.
        7. exit_compensation_* фиксирует компенсацию при увольнении
        (включая «золотые парашюты» и компенсацию при смене контроля).
        8. ma_linked_* фиксирует условия, явно привязанные к M&A-сделке.
        9. Если условие определяется через отсылку к документу (Программа
        долгосрочной мотивации, Приложение) — фиксируй как "defined"
        со значением «согласно <документ>».
        10. В evidence включай только текст договора.
        11. Никогда не используй "None", "null", пустые строки или отсутствующие ключи.
        12. Верни РОВНО один валидный JSON-объект со всеми 13 ключами (12 полей + evidence),
        пригодный для парсинга через json.loads без предварительной обработки.
        Без markdown, без ```json, без комментариев, без текста до или после.
        Начни ответ сразу с { и закончи }.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — полная структура удержания:
        Фрагмент:
        "Работнику выплачивается retention-бонус в размере 3 000 000 рублей
        при условии сохранения трудовых отношений в течение 24 месяцев
        с даты подписания договора. Отложенная компенсация выплачивается
        равными частями ежегодно в течение 3 лет. В случае увольнения
        по инициативе работника до истечения срока удержания, выплаченный
        retention-бонус подлежит возврату в полном объёме. При смене
        контроля над работодателем работник вправе расторгнуть договор
        с компенсацией в размере 6 месячных окладов."
        Ответ:
        {
          "retention_bonus_status": "defined",
          "retention_bonus_value": "3 000 000 рублей при условии сохранения трудовых отношений 24 месяца",
          "deferred_compensation_status": "defined",
          "deferred_compensation_value": "равными частями ежегодно в течение 3 лет",
          "clawback_status": "defined",
          "clawback_value": "возврат retention-бонуса в полном объёме при увольнении по инициативе работника до истечения срока удержания",
          "exit_compensation_status": "defined",
          "exit_compensation_value": "6 месячных окладов при смене контроля",
          "ma_linked_status": "defined",
          "ma_linked_value": "при смене контроля над работодателем работник вправе расторгнуть договор с компенсацией",
          "evidence": [
            {
              "clause_ref": "п. 8.1",
              "quote": "Работнику выплачивается retention-бонус в размере 3 000 000 рублей при условии сохранения трудовых отношений в течение 24 месяцев с даты подписания договора."
            }
          ]
        }
        Пример 2 — только отложенная компенсация:
        Фрагмент:
        "Работнику устанавливается отложенная компенсация в размере
        1 500 000 рублей, выплачиваемая ежегодно равными частями
        в течение 5 лет."
        Ответ:
        {
          "retention_bonus_status": "not_defined",
          "retention_bonus_value": "Данные не определены",
          "deferred_compensation_status": "defined",
          "deferred_compensation_value": "1 500 000 рублей, ежегодно равными частями в течение 5 лет",
          "clawback_status": "not_defined",
          "clawback_value": "Данные не определены",
          "exit_compensation_status": "not_defined",
          "exit_compensation_value": "Данные не определены",
          "ma_linked_status": "not_defined",
          "ma_linked_value": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 8.2",
              "quote": "Работнику устанавливается отложенная компенсация в размере 1 500 000 рублей, выплачиваемая ежегодно равными частями в течение 5 лет."
            }
          ]
        }
        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Работник выполняет свои обязанности в соответствии с договором."
        Ответ:
        {
          "retention_bonus_status": "not_defined",
          "retention_bonus_value": "Данные не определены",
          "deferred_compensation_status": "not_defined",
          "deferred_compensation_value": "Данные не определены",
          "clawback_status": "not_defined",
          "clawback_value": "Данные не определены",
          "exit_compensation_status": "not_defined",
          "exit_compensation_value": "Данные не определены",
          "ma_linked_status": "not_defined",
          "ma_linked_value": "Данные не определены",
          "evidence": []
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Проверь, что все 13 ключей (12 полей + evidence) присутствуют в JSON.
        2. Проверь, что каждый *_status ∈ {"defined", "not_defined"}, а каждый *_value
        при отсутствии данных = "Данные не определены".
        3. Проверь, что для каждого defined-поля в evidence есть прямая цитата из договора.
        4. Убедись, что retention-бонус не спутан с deferred compensation.
        5. Убедись, что clawback отражает именно условия возврата.
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "retention_bonus_status": "<defined / not_defined>",
          "retention_bonus_value": "<текст / 'согласно <документ>' / 'не предусмотрен' / 'Данные не определены'>",
          "deferred_compensation_status": "<defined / not_defined>",
          "deferred_compensation_value": "<текст / 'согласно <документ>' / 'не предусмотрена' / 'Данные не определены'>",
          "clawback_status": "<defined / not_defined>",
          "clawback_value": "<текст / 'не предусмотрен' / 'Данные не определены'>",
          "exit_compensation_status": "<defined / not_defined>",
          "exit_compensation_value": "<текст / 'согласно <документ>' / 'не предусмотрена' / 'Данные не определены'>",
          "ma_linked_status": "<defined / not_defined>",
          "ma_linked_value": "<текст / 'не предусмотрены' / 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 7
      temperature: 0.0
      max_tokens: 1100

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "retention bonus бонус за удержание удержание ключевых сотрудников отложенная выплата deferred compensation clawback возврат выплат золотой парашют компенсация при увольнении выплата при смене контроля change of control долгосрочная мотивация LTI"
      preferred_unit_types:
        - obligation
        - payment_term
        - general_provision
      excluded_unit_types:
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - remedies
        - boilerplate
      boost_keywords:
        - "retention bonus"
        - "бонус за удержание"
        - "отложенная выплата"
        - "clawback"
        - "смена контроля"
      negative_keywords:
        - "трудовая функция"
        - "рабочее время"
        - "отпуск"
        - "конфиденциальность"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.30, 0.80]
        boost: 0.30
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "remedies"
        - "boilerplate"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1300

      compact_output: false

      presence_signal:
        field: "key_employee_retention_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по трудовому праву. Извлеки из трудового договора
        сведения об условиях удержания ключевых сотрудников: retention-бонусы,
        отложенные выплаты, clawback, компенсации при уходе.
        Не анализируй оклад, режим работы или расторжение.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 12 полей + evidence (всего 13 ключей):

        0. key_employee_retention_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (retention_bonus_status, deferred_compensation_status,
              clawback_status, exit_compensation_status,
              ma_linked_status) ≠ "not_defined";
           - "missing" — если все пять содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - все пять *_status = "not_defined";
           - все *_value = "Данные не определены";
           - не выполняй остальные шаги.

        1. retention_bonus_status — "defined" или "not_defined".
        2. retention_bonus_value — retention-бонус.
        3. deferred_compensation_status — "defined" или "not_defined".
        4. deferred_compensation_value — отложенная компенсация.
        5. clawback_status — "defined" или "not_defined".
        6. clawback_value — условия возврата выплат.
        7. exit_compensation_status — "defined" или "not_defined".
        8. exit_compensation_value — компенсация при увольнении / смене контроля.
        9. ma_linked_status — "defined" или "not_defined".
        10. ma_linked_value — условия, привязанные к M&A-сделке.

        Если данные отсутствуют:
        - для *_status — "not_defined"
        - для *_value — "Данные не определены"
        </task>

        <context_rules>
        - Перед остальными полями заполни key_employee_retention_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_value = "Данные не определены".
        - Используй только текст договора.
        - retention_bonus_* — разовая выплата за удержание.
        - deferred_compensation_* — отложенные выплаты.
        - clawback_* — условия возврата выплат.
        - exit_compensation_* — компенсация при увольнении / смене контроля.
        - ma_linked_* — условия, явно привязанные к M&A-сделке.
        - Если условие определяется через отсылку к документу (Программа
          долгосрочной мотивации, Приложение) — фиксируй как "defined"
          со значением «согласно <документ>».
        - Если в разных фрагментах указаны разные данные и конфликт нельзя
          разрешить по тексту — статус → "not_defined", значение → "Не удалось определить".
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни retention-бонуса, ни отложенных выплат,
           ни clawback, ни компенсаций при уходе.
           → presence = "missing";
             все пять *_status = "not_defined";
             все *_value = "Данные не определены".

        2. Только retention-бонус без clawback.
           Указан retention-бонус, но нет условий возврата и компенсаций
           при уходе.
           → presence = "present";
             retention_bonus_status = "defined";
             clawback_status = "not_defined";
             exit_compensation_status = "not_defined";
             соответствующие *_value = "Данные не определены".

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные условия возврата
           retention-бонуса.
           → presence = "unclear";
             clawback_status = "not_defined";
             clawback_value = "Не удалось определить".

        4. Отсылка на программу долгосрочной мотивации.
           Условия retention и отложенных выплат определяются
           Программой долгосрочной мотивации.
           → presence = "present";
             retention_bonus_status = "defined";
             retention_bonus_value содержит формулировку вида
             «согласно Программе долгосрочной мотивации».
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для key_employee_retention_check_presence используй только: "present", "missing", "unclear".
        - Для всех *_status используй только: "defined" или "not_defined".
        - Fallback при отсутствии данных:
          * все *_value → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_value → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "key_employee_retention_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие условий об удержании ключевых сотрудников. Внутреннее агрегатное signal-поле."
          required: true

        - name: "retention_bonus_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус наличия retention-бонуса. Внутреннее enum-поле."
          required: true

        - name: "retention_bonus_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Retention-бонус"
          description: >
            Условия retention-бонуса (размер, срок удержания). Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "deferred_compensation_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус отложенной компенсации. Внутреннее enum-поле."
          required: true

        - name: "deferred_compensation_value"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Отложенная компенсация"
          description: >
            Условия отложенной компенсации. Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "clawback_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус условий возврата выплат (clawback). Внутреннее enum-поле."
          required: true

        - name: "clawback_value"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Clawback"
          description: >
            Условия возврата выплат (clawback). Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "exit_compensation_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус компенсации при увольнении / смене контроля. Внутреннее enum-поле."
          required: true

        - name: "exit_compensation_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Компенсация при уходе"
          description: >
            Компенсация при увольнении / смене контроля. Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "ma_linked_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус условий, привязанных к M&A-сделке. Внутреннее enum-поле."
          required: true

        - name: "ma_linked_value"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "M&A-условия"
          description: >
            Условия, привязанные к M&A-сделке. Fallback: "Не установлено" / "Не удалось определить".
          required: false

      store_payload: true

  - id: equity_compensation_check
    name: "Опционы, доли, акции и иные формы участия в капитале"
    description: >
      Фактографическая проверка условий об участии работника в капитале
      работодателя: опционы, RSU, phantom equity, доли, акции. Критично
      для M&A: необходимо оценить размытие долей, обременения и обязательства
      по выкупу. В российском праве классического ESOP нет; используются
      конструкции ст. 429.2 ГК РФ (опцион на заключение договора)
      и ст. 429.3 ГК РФ (опционный договор).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "опцион"
        - "опционный договор"
        - "опцион на заключение"
        - "RSU"
        - "phantom equity"
        - "фантомный опцион"
        - "доля в уставном капитале"
        - "акции"
        - "вестинг"
        - "vesting"
        - "cliff"
        - "страйк"
        - "strike price"
        - "капитализация"
        - "программа долгосрочной мотивации"
        - "LTI"
        - "участие в капитале"
        - "опционное соглашение"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)опцион"
        - "(?i)\\bRSU\\b|\\bvesting\\b|\\bcliff\\b"
        - "(?i)(фантомн[а-яё]+|phantom)\\s+опцион"
        - "(?i)дол[яию]\\s+в\\s+уставном\\s+капитал"
        - "(?i)программ[а-яё]*\\s+долгосрочн[а-яё]*\\s+мотиваци"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по трудовому праву и корпоративному праву.
        Анализируется трудовой договор (ст. 57 ТК РФ; ст. 429.2, 429.3,
        492.2, 492.3 ГК РФ; ФЗ от 08.03.2015 № 42-ФЗ; ФЗ от 26.12.1995 № 208-ФЗ;
        ФЗ от 08.02.1998 № 14-ФЗ).
        Проверяется только один вопрос: участие работника в капитале
        работодателя (опционы, доли, акции, phantom equity).
        Нормативный ориентир:
        - ст. 429.2 ГК РФ — опцион на заключение договора (безотзывная
        оферта, одна сторона предоставляет другой право заключить договор).
        - ст. 429.3 ГК РФ — опционный договор (обе стороны выражают
        волеизъявление).
        - ст. 492.2, 492.3 ГК РФ — опционные конструкции (поименованы
        в ГК РФ с 2015 года).
        - ФЗ от 26.12.1995 № 208-ФЗ — АО (акции, опционы).
        - ФЗ от 08.02.1998 № 14-ФЗ — ООО (доли, опционы на долю).
        Важно:
        - В российском праве классического ESOP (employee stock option plan)
        не существует. Используются:
          1) Опцион на заключение договора купли-продажи доли/акции
             (ст. 429.2 ГК РФ);
          2) Опционный договор (ст. 429.3 ГК РФ);
          3) Phantom equity (фантомные опционы — обычно оформляются
             через премии/соглашения к трудовому договору).
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска, не подставляй нормы закона вместо текста.
        - Для M&A критично: необходимо оценить размытие долей,
        обременения и обязательства по выкупу.
        - Различай:
          1) Тип инструмента (опцион на заключение договора / опционный
             договор / phantom equity / акции / доли);
          2) Вестинг (график, cliff);
          3) Цена исполнения (страйк);
          4) Условия при увольнении / M&A / IPO.
        [ЗАДАЧА]
        Найди в тексте договора:
        1. Тип инструмента участия в капитале.
        2. Параметры вестинга (график, cliff).
        3. Цену исполнения (страйк).
        4. Условия при увольнении / M&A / IPO.
        5. Ссылку на опционное соглашение / программу.
        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона вместо текста.
        2. Для *_status используй строго "defined" или "not_defined".
        3. Для *_value при отсутствии данных — строго "Данные не определены".
        4. equity_type_code фиксирует тип инструмента: "option_agreement"
        (опцион на заключение договора, ст. 429.2), "option_contract"
        (опционный договор, ст. 429.3), "phantom_equity" (фантомный опцион),
        "shares" (акции), "stake" (доля в ООО), "not_defined".
        5. equity_vesting_* фиксирует график вестинга (vesting schedule, cliff).
        6. equity_strike_* фиксирует цену исполнения (strike price).
        7. equity_exit_terms_* фиксирует условия при увольнении / M&A / IPO.
        8. equity_documentation_* фиксирует ссылку на опционное соглашение
        или программу.
        9. Если условие определяется через отсылку к документу (Опционное
        соглашение, Программа) — фиксируй как "defined" со значением
        «согласно <документ>».
        10. В evidence включай только текст договора.
        11. Никогда не используй "None", "null", пустые строки или отсутствующие ключи.
        12. Верни РОВНО один валидный JSON-объект со всеми 11 ключами (10 полей + evidence),
        пригодный для парсинга через json.loads без предварительной обработки.
        Без markdown, без ```json, без комментариев, без текста до или после.
        Начни ответ сразу с { и закончи }.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — опцион с вестингом:
        Фрагмент:
        "Работнику предоставляется опцион на приобретение 5% доли
        в уставном капитале ООО «Альфа» по цене 100 000 рублей.
        Вестинг: 4 года, cliff 1 год, равными частями ежеквартально.
        При увольнении до истечения срока вестинга невестированные доли
        аннулируются. При сделке M&A невестированные доли ускоряются
        (single-trigger acceleration). Условия опциона определяются
        Опционным соглашением."
        Ответ:
        {
          "equity_type_code": "option_agreement",
          "equity_type_details": "опцион на приобретение 5% доли в уставном капитале ООО",
          "equity_vesting_status": "defined",
          "equity_vesting_details": "4 года, cliff 1 год, равными частями ежеквартально",
          "equity_strike_status": "defined",
          "equity_strike_details": "100 000 рублей",
          "equity_exit_terms_status": "defined",
          "equity_exit_terms_details": "при увольнении до истечения срока вестинга невестированные доли аннулируются; при M&A невестированные доли ускоряются (single-trigger acceleration)",
          "equity_documentation_status": "defined",
          "equity_documentation_value": "согласно Опционному соглашению",
          "evidence": [
            {
              "clause_ref": "п. 9.1",
              "quote": "Работнику предоставляется опцион на приобретение 5% доли в уставном капитале ООО «Альфа» по цене 100 000 рублей."
            }
          ]
        }
        Пример 2 — phantom equity:
        Фрагмент:
        "Работнику предоставляется право на получение денежной выплаты,
        эквивалентной стоимости 1% доли в уставном капитале (фантомный
        опцион). Выплата производится при наступлении события ликвидности."
        Ответ:
        {
          "equity_type_code": "phantom_equity",
          "equity_type_details": "право на денежную выплату, эквивалентную стоимости 1% доли (фантомный опцион)",
          "equity_vesting_status": "not_defined",
          "equity_vesting_details": "Данные не определены",
          "equity_strike_status": "not_defined",
          "equity_strike_details": "Данные не определены",
          "equity_exit_terms_status": "defined",
          "equity_exit_terms_details": "выплата при наступлении события ликвидности",
          "equity_documentation_status": "not_defined",
          "equity_documentation_value": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 9.2",
              "quote": "Работнику предоставляется право на получение денежной выплаты, эквивалентной стоимости 1% доли в уставном капитале (фантомный опцион)."
            }
          ]
        }
        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Работник выполняет свои обязанности в соответствии с договором."
        Ответ:
        {
          "equity_type_code": "not_defined",
          "equity_type_details": "Данные не определены",
          "equity_vesting_status": "not_defined",
          "equity_vesting_details": "Данные не определены",
          "equity_strike_status": "not_defined",
          "equity_strike_details": "Данные не определены",
          "equity_exit_terms_status": "not_defined",
          "equity_exit_terms_details": "Данные не определены",
          "equity_documentation_status": "not_defined",
          "equity_documentation_value": "Данные не определены",
          "evidence": []
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Проверь, что все 11 ключей (10 полей + evidence) присутствуют в JSON.
        2. Проверь, что каждый *_status ∈ {"defined", "not_defined"}, а каждый *_value
        при отсутствии данных = "Данные не определены".
        3. Проверь, что для каждого defined-поля в evidence есть прямая цитата из договора.
        4. Убедись, что equity_type_code — одно из: "option_agreement" /
        "option_contract" / "phantom_equity" / "shares" / "stake" / "not_defined".
        5. Убедись, что вестинг, страйк и exit terms разнесены по соответствующим
        полям.
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "equity_type_code": "<option_agreement / option_contract / phantom_equity / shares / stake / not_defined>",
          "equity_type_details": "<текст / 'Данные не определены'>",
          "equity_vesting_status": "<defined / not_defined>",
          "equity_vesting_details": "<текст / 'Данные не определены'>",
          "equity_strike_status": "<defined / not_defined>",
          "equity_strike_details": "<текст / 'Данные не определены'>",
          "equity_exit_terms_status": "<defined / not_defined>",
          "equity_exit_terms_details": "<текст / 'Данные не определены'>",
          "equity_documentation_status": "<defined / not_defined>",
          "equity_documentation_value": "<текст / 'согласно <документ>' / 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 1100

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "опцион опционный договор опцион на заключение RSU phantom equity фантомный опцион доля в уставном капитале акции вестинг vesting cliff страйк strike price программа долгосрочной мотивации LTI участие в капитале опционное соглашение"
      preferred_unit_types:
        - obligation
        - general_provision
        - definition
      excluded_unit_types:
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - definitions
        - boilerplate
      boost_keywords:
        - "опцион"
        - "вестинг"
        - "доля в уставном капитале"
        - "акции"
        - "фантомный опцион"
      negative_keywords:
        - "трудовая функция"
        - "рабочее время"
        - "отпуск"
        - "конфиденциальность"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.35, 0.85]
        boost: 0.30
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "definitions"
        - "boilerplate"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1300

      compact_output: false

      presence_signal:
        field: "equity_compensation_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по трудовому праву и корпоративному праву.
        Извлеки из трудового договора сведения об участии работника
        в капитале работодателя.
        Не анализируй оклад, режим работы или расторжение.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 10 полей + evidence (всего 11 ключей):

        0. equity_compensation_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (equity_type_code, equity_vesting_status, equity_strike_status,
              equity_exit_terms_status, equity_documentation_status)
             ≠ "not_defined";
           - "missing" — если все пять содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - equity_type_code = "not_defined";
           - все *_status = "not_defined";
           - все *_details/*_value = "Данные не определены";
           - не выполняй остальные шаги.

        1. equity_type_code — тип инструмента.
        2. equity_type_details — описание инструмента.
        3. equity_vesting_status — "defined" или "not_defined".
        4. equity_vesting_details — график вестинга.
        5. equity_strike_status — "defined" или "not_defined".
        6. equity_strike_details — цена исполнения.
        7. equity_exit_terms_status — "defined" или "not_defined".
        8. equity_exit_terms_details — условия при увольнении / M&A / IPO.
        9. equity_documentation_status — "defined" или "not_defined".
        10. equity_documentation_value — ссылка на опционное соглашение / программу.

        Если данные отсутствуют:
        - для *_status — "not_defined"
        - для *_details/*_value — "Данные не определены"
        </task>

        <context_rules>
        - Перед остальными полями заполни equity_compensation_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — equity_type_code = "not_defined", все *_status = "not_defined", все *_details/*_value = "Данные не определены".
        - Используй только текст договора.
        - equity_type_code — одно из: "option_agreement" / "option_contract" /
          "phantom_equity" / "shares" / "stake" / "not_defined".
        - В российском праве классического ESOP нет — используются
          опционные конструкции ст. 429.2, 429.3 ГК РФ.
        - Если условие определяется через отсылку к документу (Опционное
          соглашение, Программа) — фиксируй как "defined" со значением
          «согласно <документ>».
        - Если в разных фрагментах указаны разные данные и конфликт нельзя
          разрешить по тексту — статус → "not_defined", значение → "Не удалось определить".
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни опциона, ни доли, ни акций, ни phantom equity.
           → presence = "missing";
             equity_type_code = "not_defined";
             все *_status = "not_defined";
             все *_details/*_value = "Данные не определены".

        2. Указан только тип инструмента без параметров.
           Есть упоминание опциона, но без вестинга, страйка и exit terms.
           → presence = "present";
             equity_type_code = "option_agreement" (или иной);
             остальные *_status = "not_defined";
             соответствующие *_details = "Данные не определены".

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные параметры вестинга
           или разные типы инструментов.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             соответствующее *_details = "Не удалось определить".

        4. Отсылка на опционное соглашение / программу.
           Условия опциона определяются отдельным документом.
           → presence = "present";
             equity_documentation_status = "defined";
             equity_documentation_value содержит формулировку вида
             «согласно Опционному соглашению».
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для equity_compensation_check_presence используй только: "present", "missing", "unclear".
        - Для всех *_status используй только: "defined" или "not_defined".
        - Fallback при отсутствии данных:
          * все *_details/*_value → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details/*_value → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "equity_compensation_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие условий об участии работника в капитале. Внутреннее агрегатное signal-поле."
          required: true

        - name: "equity_type_code"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values:
            - "option_agreement"
            - "option_contract"
            - "phantom_equity"
            - "shares"
            - "stake"
            - "not_defined"
          display_in_grid: false
          description: "Тип инструмента участия в капитале. Внутреннее enum-поле."
          required: true

        - name: "equity_type_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Тип участия в капитале"
          description: >
            Описание инструмента участия в капитале. Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "equity_vesting_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания вестинга. Внутреннее enum-поле."
          required: true

        - name: "equity_vesting_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Вестинг"
          description: >
            График вестинга (vesting schedule, cliff). Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "equity_strike_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания цены исполнения. Внутреннее enum-поле."
          required: true

        - name: "equity_strike_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Страйк"
          description: >
            Цена исполнения (strike price). Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "equity_exit_terms_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус условий при увольнении / M&A / IPO. Внутреннее enum-поле."
          required: true

        - name: "equity_exit_terms_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Exit-условия"
          description: >
            Условия при увольнении / M&A / IPO. Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "equity_documentation_status"
          type: "string"
          presentation: "signal"
          risk_weight: "low"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус ссылки на опционное соглашение / программу. Внутреннее enum-поле."
          required: true

        - name: "equity_documentation_value"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Документация"
          description: >
            Ссылка на опционное соглашение / программу. Fallback: "Не установлено" / "Не удалось определить".
          required: false

      store_payload: true

  - id: related_party_check
    name: "Аффилированность, связанные лица и санкционный скрининг"
    description: >
      Фактографическая проверка условий о раскрытии аффилированности
      и связанных лиц (ст. 9 ФЗ-135 «О защите конкуренции»; ст. 4 Закона
      РСФСР №948-1), ограничений на сделки со связанными лицами (гл. XI
      ФЗ-208, ст. 45 ФЗ-14), а также о санкционном скрининге.
      Критично для M&A и compliance: выявление скрытых конфликтов интересов,
      сделок с заинтересованностью и санкционных рисков.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "аффилированное лицо"
        - "аффилированность"
        - "связанные лица"
        - "заинтересованность"
        - "сделка с заинтересованностью"
        - "конфликт интересов"
        - "родственники"
        - "супруг"
        - "близкие родственники"
        - "участие в других организациях"
        - "доля в уставном капитале"
        - "член органа управления"
        - "санкции"
        - "санкционный список"
        - "PEP"
        - "политически значимое лицо"
        - "комплаенс"
        - "декларация"
        - "disclosure"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)аффилированн[а-яё]+\\s+лиц"
        - "(?i)(связанн[а-яё]+|заинтересованн[а-яё]+)\\s+лиц"
        - "(?i)сделк[а-яё]*\\s+с\\s+заинтересованност"
        - "(?i)(конфликт[а-яё]*\\s+интерес|санкционн[а-яё]+\\s+скрининг)"
        - "(?i)(PEP|политически\\s+значим[а-яё]+\\s+лиц)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по корпоративному праву и compliance.
        Анализируется трудовой договор (ст. 9 ФЗ-135 «О защите конкуренции»;
        ст. 4 Закона РСФСР от 22.03.1991 №948-1; гл. XI ФЗ-208 «Об АО»;
        ст. 45 ФЗ-14 «Об ООО»; ст. 275 ТК РФ; ФЗ-115 «О противодействии
        легализации»; ФЗ-273 «О противодействии коррупции»).
        Проверяется только один вопрос: раскрытие аффилированности,
        связанных лиц и санкционный скрининг.
        Нормативный ориентир:
        - ст. 9 ФЗ-135 — группа лиц (аффилированные лица).
        - ст. 4 Закона РСФСР №948-1 — понятие аффилированных лиц.
        - гл. XI ФЗ-208 — сделки с заинтересованностью в АО.
        - ст. 45 ФЗ-14 — сделки с заинтересованностью в ООО.
        - ст. 275 ТК РФ — дополнительные требования к руководителю.
        - ФЗ-115 — обязательный санкционный скрининг (AML/CFT).
        - ФЗ-273 — противодействие коррупции.
        - Указы Президента РФ и акты Правительства — санкционное
        законодательство РФ.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска, не подставляй нормы закона вместо текста.
        - Для M&A и compliance критично: скрытая аффилированность работника
        с контрагентами и конкурентами — существенный риск.
        - Различай:
          1) Обязанность раскрывать аффилированность (декларация);
          2) Ограничения на сделки со связанными лицами;
          3) Периодическая декларация о конфликте интересов;
          4) Санкционный скрининг (PEP, санкционные списки).
        [ЗАДАЧА]
        Найди в тексте договора:
        1. Обязанность раскрывать аффилированность и связанных лиц.
        2. Ограничения на сделки со связанными лицами.
        3. Периодическую декларацию о конфликте интересов.
        4. Санкционный скрининг (PEP, санкционные списки).
        5. Обязанность сообщать об изменении аффилированности.
        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона вместо текста.
        2. Для *_status используй строго "defined" или "not_defined".
        3. Для *_value при отсутствии данных — строго "Данные не определены".
        4. related_party_disclosure_* фиксирует обязанность раскрывать
        аффилированность и связанных лиц.
        5. related_party_transactions_* фиксирует ограничения на сделки
        со связанными лицами.
        6. periodic_declaration_* фиксирует периодическую декларацию
        о конфликте интересов.
        7. sanctions_screening_* фиксирует санкционный скрининг (PEP,
        санкционные списки).
        8. change_notification_* фиксирует обязанность сообщать
        об изменении аффилированности.
        9. Если условие определяется через отсылку к документу (Политика
        по конфликту интересов, Приложение) — фиксируй как "defined"
        со значением «согласно <документ>».
        10. В evidence включай только текст договора.
        11. Никогда не используй "None", "null", пустые строки или отсутствующие ключи.
        12. Верни РОВНО один валидный JSON-объект со всеми 11 ключами (10 полей + evidence),
        пригодный для парсинга через json.loads без предварительной обработки.
        Без markdown, без ```json, без комментариев, без текста до или после.
        Начни ответ сразу с { и закончи }.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — полная структура:
        Фрагмент:
        "Работник обязуется раскрывать работодателю сведения о своей
        аффилированности, участии в других организациях, а также о близких
        родственниках, занимающих должности в конкурирующих организациях.
        Работник не вправе совершать сделки со связанными лицами без
        предварительного одобрения. Работник ежегодно подаёт декларацию
        о конфликте интересов. Работник подтверждает, что не является
        политически значимым лицом (PEP) и не включён в санкционные списки."
        Ответ:
        {
          "related_party_disclosure_status": "defined",
          "related_party_disclosure_value": "обязанность раскрывать аффилированность, участие в других организациях, сведения о близких родственниках в конкурирующих организациях",
          "related_party_transactions_status": "defined",
          "related_party_transactions_value": "запрет на сделки со связанными лицами без предварительного одобрения",
          "periodic_declaration_status": "defined",
          "periodic_declaration_value": "ежегодная декларация о конфликте интересов",
          "sanctions_screening_status": "defined",
          "sanctions_screening_value": "подтверждение отсутствия статуса PEP и включения в санкционные списки",
          "change_notification_status": "not_defined",
          "change_notification_value": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 10.1",
              "quote": "Работник обязуется раскрывать работодателю сведения о своей аффилированности, участии в других организациях, а также о близких родственниках, занимающих должности в конкурирующих организациях."
            }
          ]
        }
        Пример 2 — только раскрытие аффилированности:
        Фрагмент:
        "Работник обязуется сообщать работодателю об участии в уставных
        капиталах других организаций."
        Ответ:
        {
          "related_party_disclosure_status": "defined",
          "related_party_disclosure_value": "обязанность сообщать об участии в уставных капиталах других организаций",
          "related_party_transactions_status": "not_defined",
          "related_party_transactions_value": "Данные не определены",
          "periodic_declaration_status": "not_defined",
          "periodic_declaration_value": "Данные не определены",
          "sanctions_screening_status": "not_defined",
          "sanctions_screening_value": "Данные не определены",
          "change_notification_status": "not_defined",
          "change_notification_value": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 10.2",
              "quote": "Работник обязуется сообщать работодателю об участии в уставных капиталах других организаций."
            }
          ]
        }
        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Работник выполняет свои обязанности в соответствии с договором."
        Ответ:
        {
          "related_party_disclosure_status": "not_defined",
          "related_party_disclosure_value": "Данные не определены",
          "related_party_transactions_status": "not_defined",
          "related_party_transactions_value": "Данные не определены",
          "periodic_declaration_status": "not_defined",
          "periodic_declaration_value": "Данные не определены",
          "sanctions_screening_status": "not_defined",
          "sanctions_screening_value": "Данные не определены",
          "change_notification_status": "not_defined",
          "change_notification_value": "Данные не определены",
          "evidence": []
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Проверь, что все 11 ключей (10 полей + evidence) присутствуют в JSON.
        2. Проверь, что каждый *_status ∈ {"defined", "not_defined"}, а каждый *_value
        при отсутствии данных = "Данные не определены".
        3. Проверь, что для каждого defined-поля в evidence есть прямая цитата из договора.
        4. Убедись, что раскрытие аффилированности, ограничения на сделки
        и периодическая декларация разнесены по соответствующим полям.
        5. Убедись, что санкционный скрининг (PEP, санкционные списки) отражён
        в sanctions_screening_*.
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "related_party_disclosure_status": "<defined / not_defined>",
          "related_party_disclosure_value": "<текст / 'согласно <документ>' / 'Данные не определены'>",
          "related_party_transactions_status": "<defined / not_defined>",
          "related_party_transactions_value": "<текст / 'не предусмотрены' / 'Данные не определены'>",
          "periodic_declaration_status": "<defined / not_defined>",
          "periodic_declaration_value": "<текст / 'не предусмотрена' / 'Данные не определены'>",
          "sanctions_screening_status": "<defined / not_defined>",
          "sanctions_screening_value": "<текст / 'не предусмотрен' / 'Данные не определены'>",
          "change_notification_status": "<defined / not_defined>",
          "change_notification_value": "<текст / 'не предусмотрена' / 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 7
      temperature: 0.0
      max_tokens: 950

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "аффилированное лицо аффилированность связанные лица заинтересованность сделка с заинтересованностью конфликт интересов родственники супруг близкие родственники участие в других организациях доля в уставном капитале член органа управления санкции санкционный список PEP политически значимое лицо комплаенс декларация disclosure"
      preferred_unit_types:
        - obligation
        - general_provision
        - definition
      excluded_unit_types:
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - limitations
        - boilerplate
        - definitions
      boost_keywords:
        - "аффилированность"
        - "конфликт интересов"
        - "связанные лица"
        - "санкционный скрининг"
        - "PEP"
      negative_keywords:
        - "трудовая функция"
        - "оклад"
        - "рабочее время"
        - "отпуск"
        - "конфиденциальность"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.40, 0.90]
        boost: 0.30
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "limitations"
        - "boilerplate"
        - "definitions"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1200

      compact_output: false

      presence_signal:
        field: "related_party_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по корпоративному праву и compliance.
        Извлеки из трудового договора сведения о раскрытии аффилированности,
        связанных лиц и санкционном скрининге.
        Не анализируй оплату труда, режим работы или расторжение.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 10 полей + evidence (всего 11 ключей):

        0. related_party_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (related_party_disclosure_status, related_party_transactions_status,
              periodic_declaration_status, sanctions_screening_status,
              change_notification_status) ≠ "not_defined";
           - "missing" — если все пять содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - все пять *_status = "not_defined";
           - все *_value = "Данные не определены";
           - не выполняй остальные шаги.

        1. related_party_disclosure_status — "defined" или "not_defined".
        2. related_party_disclosure_value — обязанность раскрывать
           аффилированность.
        3. related_party_transactions_status — "defined" или "not_defined".
        4. related_party_transactions_value — ограничения на сделки
           со связанными лицами.
        5. periodic_declaration_status — "defined" или "not_defined".
        6. periodic_declaration_value — периодическая декларация о конфликте
           интересов.
        7. sanctions_screening_status — "defined" или "not_defined".
        8. sanctions_screening_value — санкционный скрининг.
        9. change_notification_status — "defined" или "not_defined".
        10. change_notification_value — обязанность сообщать об изменениях.

        Если данные отсутствуют:
        - для *_status — "not_defined"
        - для *_value — "Данные не определены"
        </task>

        <context_rules>
        - Перед остальными полями заполни related_party_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_value = "Данные не определены".
        - Используй только текст договора.
        - Различай раскрытие аффилированности, ограничения на сделки,
          периодическую декларацию и санкционный скрининг — это разные
          требования.
        - Если условие определяется через отсылку к документу (Политика
          по конфликту интересов, Приложение) — фиксируй как "defined"
          со значением «согласно <документ>».
        - Если в разных фрагментах указаны разные данные и конфликт нельзя
          разрешить по тексту — статус → "not_defined", значение → "Не удалось определить".
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни раскрытия аффилированности, ни ограничений
           на сделки, ни декларации, ни санкционного скрининга.
           → presence = "missing";
             все пять *_status = "not_defined";
             все *_value = "Данные не определены".

        2. Только раскрытие аффилированности.
           Есть обязанность раскрывать аффилированность, но нет ограничений
           на сделки, декларации и санкционного скрининга.
           → presence = "present";
             related_party_disclosure_status = "defined";
             related_party_transactions_status = "not_defined";
             periodic_declaration_status = "not_defined";
             sanctions_screening_status = "not_defined";
             соответствующие *_value = "Данные не определены".

        3. Противоречие между фрагментами.
           В разных частях договора указаны противоречащие условия
           о декларации или санкционном скрининге.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             соответствующее *_value = "Не удалось определить".

        4. Отсылка на Политику по конфликту интересов.
           Условия раскрытия и декларации определяются отдельным документом.
           → presence = "present";
             related_party_disclosure_status = "defined";
             related_party_disclosure_value содержит формулировку вида
             «согласно Политике по конфликту интересов».
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для related_party_check_presence используй только: "present", "missing", "unclear".
        - Для всех *_status используй только: "defined" или "not_defined".
        - Fallback при отсутствии данных:
          * все *_value → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_value → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "related_party_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие условий об аффилированности и санкционном скрининге. Внутреннее агрегатное signal-поле."
          required: true

        - name: "related_party_disclosure_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус обязанности раскрывать аффилированность. Внутреннее enum-поле."
          required: true

        - name: "related_party_disclosure_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Раскрытие аффилированности"
          description: >
            Обязанность раскрывать аффилированность и связанных лиц. Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "related_party_transactions_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус ограничений на сделки со связанными лицами. Внутреннее enum-поле."
          required: true

        - name: "related_party_transactions_value"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Сделки со связанными лицами"
          description: >
            Ограничения на сделки со связанными лицами. Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "periodic_declaration_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус периодической декларации о конфликте интересов. Внутреннее enum-поле."
          required: true

        - name: "periodic_declaration_value"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Декларация о конфликте"
          description: >
            Периодическая декларация о конфликте интересов. Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "sanctions_screening_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус санкционного скрининга. Внутреннее enum-поле."
          required: true

        - name: "sanctions_screening_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Санкционный скрининг"
          description: >
            Санкционный скрининг (PEP, санкционные списки). Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "change_notification_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус обязанности сообщать об изменении аффилированности. Внутреннее enum-поле."
          required: true

        - name: "change_notification_value"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Уведомление об изменениях"
          description: >
            Обязанность сообщать об изменении аффилированности. Fallback: "Не установлено" / "Не удалось определить".
          required: false

      store_payload: true

  - id: authority_limits_check
    name: "Лимиты полномочий и права подписи"
    description: >
      Фактографическая проверка условий о лимитах полномочий работника,
      правах подписи, порогах одобрения и порядке согласования сделок.
      Критично для внутреннего контроля: определяет границы самостоятельных
      решений работника и предотвращает неконтролируемые операции.
      Применимо в первую очередь к руководителям, финансовым директорам,
      главным бухгалтерам, руководителям подразделений.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "лимит полномочий"
        - "пределы полномочий"
        - "право подписи"
        - "подписывать от имени"
        - "порог одобрения"
        - "порядок согласования"
        - "согласование сделок"
        - "принимать решения"
        - "заключать договоры"
        - "распоряжаться средствами"
        - "доверенность"
        - "матрица полномочий"
        - "authority matrix"
        - "делегирование полномочий"
        - "финансовый директор"
        - "главный бухгалтер"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)лимит[а-яё]*\\s+полномочи"
        - "(?i)прав[оа]\\s+подпис"
        - "(?i)порог[а-яё]*\\s+одобрени"
        - "(?i)согласовани[ея].*сделк"
        - "(?i)матриц[а-яё]*\\s+полномочи"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по трудовому праву и внутреннему контролю.
        Анализируется трудовой договор (ст. 57, 192 ТК РФ; ст. 53, 53.1,
        182, 185 ГК РФ; ФЗ-402 «О бухгалтерском учёте»; ФЗ-208, ФЗ-14).
        Проверяется только один вопрос: лимиты полномочий и права подписи
        работника.
        Нормативный ориентир:
        - ст. 53 ГК РФ — органы юридического лица.
        - ст. 53.1 ГК РФ — ответственность лица, уполномоченного выступать
        от имени юридического лица.
        - ст. 182 ГК РФ — представительство.
        - ст. 185 ГК РФ — доверенность.
        - ст. 7 ФЗ-402 — ведение бухгалтерского учёта, подпись главного
        бухгалтера.
        - ФЗ-208, ФЗ-14 — сделки, требующие одобрения органов управления.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска, не подставляй нормы закона вместо текста.
        - Для внутреннего контроля критично: без чётких лимитов полномочий
        невозможно проверить, действует ли работник в пределах компетенции.
        - Различай:
          1) Наличие лимита полномочий (сумма / вид операций);
          2) Право подписи (какие документы может подписывать);
          3) Порог одобрения вышестоящим органом;
          4) Порядок делегирования полномочий.
        [ЗАДАЧА]
        Найди в тексте договора:
        1. Лимит полномочий (сумма, вид операций).
        2. Право подписи (документы, от чьего имени).
        3. Порог одобрения вышестоящим органом / руководителем.
        4. Порядок делегирования полномочий / матрица полномочий.
        5. Ответственность за превышение полномочий.
        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона вместо текста.
        2. Для *_status используй строго "defined" или "not_defined".
        3. Для *_value при отсутствии данных — строго "Данные не определены".
        4. authority_limit_* фиксирует лимит полномочий (сумма, вид операций).
        5. signature_rights_* фиксирует право подписи.
        6. approval_threshold_* фиксирует порог одобрения вышестоящим органом.
        7. delegation_* фиксирует порядок делегирования полномочий
        и матрицу полномочий.
        8. exceed_liability_* фиксирует ответственность за превышение
        полномочий.
        9. Если условие определяется через отсылку к документу (Матрица
        полномочий, Приложение, Доверенность) — фиксируй как "defined"
        со значением «согласно <документ>».
        10. В evidence включай только текст договора.
        11. Никогда не используй "None", "null", пустые строки или отсутствующие ключи.
        12. Верни РОВНО один валидный JSON-объект со всеми 11 ключами (10 полей + evidence),
        пригодный для парсинга через json.loads без предварительной обработки.
        Без markdown, без ```json, без комментариев, без текста до или после.
        Начни ответ сразу с { и закончи }.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — полная структура:
        Фрагмент:
        "Работник вправе самостоятельно принимать решения и заключать
        договоры на сумму не более 500 000 рублей. Договоры на сумму
        свыше 500 000 рублей требуют согласования с Генеральным директором.
        Работник вправе подписывать договоры и первичные документы
        в пределах своей компетенции. Договоры на сумму свыше 5 000 000 рублей
        подлежат одобрению Совета директоров. Матрица полномочий —
        согласно Приложению №3. Превышение полномочий влечёт дисциплинарную
        ответственность вплоть до увольнения."
        Ответ:
        {
          "authority_limit_status": "defined",
          "authority_limit_value": "договоры на сумму не более 500 000 рублей",
          "signature_rights_status": "defined",
          "signature_rights_value": "право подписи договоров и первичных документов в пределах своей компетенции",
          "approval_threshold_status": "defined",
          "approval_threshold_value": "свыше 500 000 рублей — согласование с Генеральным директором; свыше 5 000 000 рублей — одобрение Совета директоров",
          "delegation_status": "defined",
          "delegation_value": "согласно Приложению №3 (Матрица полномочий)",
          "exceed_liability_status": "defined",
          "exceed_liability_value": "превышение полномочий влечёт дисциплинарную ответственность вплоть до увольнения",
          "evidence": [
            {
              "clause_ref": "п. 11.1",
              "quote": "Работник вправе самостоятельно принимать решения и заключать договоры на сумму не более 500 000 рублей."
            }
          ]
        }
        Пример 2 — только право подписи:
        Фрагмент:
        "Работник вправе подписывать документы в пределах своей компетенции."
        Ответ:
        {
          "authority_limit_status": "not_defined",
          "authority_limit_value": "Данные не определены",
          "signature_rights_status": "defined",
          "signature_rights_value": "право подписи документов в пределах своей компетенции",
          "approval_threshold_status": "not_defined",
          "approval_threshold_value": "Данные не определены",
          "delegation_status": "not_defined",
          "delegation_value": "Данные не определены",
          "exceed_liability_status": "not_defined",
          "exceed_liability_value": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 11.2",
              "quote": "Работник вправе подписывать документы в пределах своей компетенции."
            }
          ]
        }
        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Работник выполняет свои обязанности в соответствии с договором."
        Ответ:
        {
          "authority_limit_status": "not_defined",
          "authority_limit_value": "Данные не определены",
          "signature_rights_status": "not_defined",
          "signature_rights_value": "Данные не определены",
          "approval_threshold_status": "not_defined",
          "approval_threshold_value": "Данные не определены",
          "delegation_status": "not_defined",
          "delegation_value": "Данные не определены",
          "exceed_liability_status": "not_defined",
          "exceed_liability_value": "Данные не определены",
          "evidence": []
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Проверь, что все 11 ключей (10 полей + evidence) присутствуют в JSON.
        2. Проверь, что каждый *_status ∈ {"defined", "not_defined"}, а каждый *_value
        при отсутствии данных = "Данные не определены".
        3. Проверь, что для каждого defined-поля в evidence есть прямая цитата из договора.
        4. Убедись, что лимит полномочий, право подписи, порог одобрения
        и делегирование разнесены по соответствующим полям.
        5. Убедись, что ответственность за превышение полномочий отражена
        в exceed_liability_*.
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "authority_limit_status": "<defined / not_defined>",
          "authority_limit_value": "<текст / 'согласно <документ>' / 'Данные не определены'>",
          "signature_rights_status": "<defined / not_defined>",
          "signature_rights_value": "<текст / 'согласно <документ>' / 'Данные не определены'>",
          "approval_threshold_status": "<defined / not_defined>",
          "approval_threshold_value": "<текст / 'согласно <документ>' / 'Данные не определены'>",
          "delegation_status": "<defined / not_defined>",
          "delegation_value": "<текст / 'согласно <документ>' / 'Данные не определены'>",
          "exceed_liability_status": "<defined / not_defined>",
          "exceed_liability_value": "<текст / 'не предусмотрена' / 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 7
      temperature: 0.0
      max_tokens: 1000

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "лимит полномочий пределы полномочий право подписи подписывать от имени порог одобрения порядок согласования согласование сделок принимать решения заключать договоры распоряжаться средствами доверенность матрица полномочий authority matrix делегирование полномочий"
      preferred_unit_types:
        - obligation
        - general_provision
        - definition
      excluded_unit_types:
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - limitations
        - procedures
        - boilerplate
      boost_keywords:
        - "лимит полномочий"
        - "право подписи"
        - "порог одобрения"
        - "матрица полномочий"
        - "согласование сделок"
      negative_keywords:
        - "трудовая функция"
        - "оклад"
        - "рабочее время"
        - "отпуск"
        - "конфиденциальность"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.40, 0.90]
        boost: 0.30
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "limitations"
        - "procedures"
        - "boilerplate"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1200

      compact_output: false

      presence_signal:
        field: "authority_limits_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по трудовому праву и внутреннему контролю.
        Извлеки из трудового договора сведения о лимитах полномочий,
        правах подписи, порогах одобрения и делегировании.
        Не анализируй оплату труда, режим работы или расторжение.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 10 полей + evidence (всего 11 ключей):

        0. authority_limits_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (authority_limit_status, signature_rights_status,
              approval_threshold_status, delegation_status,
              exceed_liability_status) ≠ "not_defined";
           - "missing" — если все пять содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - все пять *_status = "not_defined";
           - все *_value = "Данные не определены";
           - не выполняй остальные шаги.

        1. authority_limit_status — "defined" или "not_defined".
        2. authority_limit_value — лимит полномочий (сумма, вид операций).
        3. signature_rights_status — "defined" или "not_defined".
        4. signature_rights_value — право подписи.
        5. approval_threshold_status — "defined" или "not_defined".
        6. approval_threshold_value — порог одобрения вышестоящим органом.
        7. delegation_status — "defined" или "not_defined".
        8. delegation_value — порядок делегирования полномочий / матрица.
        9. exceed_liability_status — "defined" или "not_defined".
        10. exceed_liability_value — ответственность за превышение полномочий.

        Если данные отсутствуют:
        - для *_status — "not_defined"
        - для *_value — "Данные не определены"
        </task>

        <context_rules>
        - Перед остальными полями заполни authority_limits_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_value = "Данные не определены".
        - Используй только текст договора.
        - Различай лимит полномочий (сумма), право подписи (какие документы),
          порог одобрения (кем) и делегирование — это разные требования.
        - Если условие определяется через отсылку к документу (Матрица
          полномочий, Приложение, Доверенность) — фиксируй как "defined"
          со значением «согласно <документ>».
        - Если в разных фрагментах указаны разные данные и конфликт нельзя
          разрешить по тексту — статус → "not_defined", значение → "Не удалось определить".
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни лимита полномочий, ни права подписи,
           ни порога одобрения, ни делегирования.
           → presence = "missing";
             все пять *_status = "not_defined";
             все *_value = "Данные не определены".

        2. Только право подписи.
           Есть упоминание права подписи, но нет лимитов, порогов
           и делегирования.
           → presence = "present";
             signature_rights_status = "defined";
             authority_limit_status = "not_defined";
             approval_threshold_status = "not_defined";
             delegation_status = "not_defined";
             соответствующие *_value = "Данные не определены".

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные лимиты полномочий
           или противоречащие пороги одобрения.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             соответствующее *_value = "Не удалось определить".

        4. Отсылка на Матрицу полномочий.
           Лимиты и пороги определяются отдельным документом.
           → presence = "present";
             delegation_status = "defined";
             delegation_value содержит формулировку вида
             «согласно Приложению №3 (Матрица полномочий)».
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для authority_limits_check_presence используй только: "present", "missing", "unclear".
        - Для всех *_status используй только: "defined" или "not_defined".
        - Fallback при отсутствии данных:
          * все *_value → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_value → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "authority_limits_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие условий о лимитах полномочий и правах подписи. Внутреннее агрегатное signal-поле."
          required: true

        - name: "authority_limit_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус лимита полномочий. Внутреннее enum-поле."
          required: true

        - name: "authority_limit_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Лимит полномочий"
          description: >
            Лимит полномочий (сумма, вид операций). Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "signature_rights_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус права подписи. Внутреннее enum-поле."
          required: true

        - name: "signature_rights_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Право подписи"
          description: >
            Право подписи (какие документы). Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "approval_threshold_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус порога одобрения. Внутреннее enum-поле."
          required: true

        - name: "approval_threshold_value"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Порог одобрения"
          description: >
            Порог одобрения вышестоящим органом. Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "delegation_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус порядка делегирования / матрицы полномочий. Внутреннее enum-поле."
          required: true

        - name: "delegation_value"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Делегирование полномочий"
          description: >
            Порядок делегирования полномочий и матрица. Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "exceed_liability_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус ответственности за превышение полномочий. Внутреннее enum-поле."
          required: true

        - name: "exceed_liability_value"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Ответственность"
          description: >
            Ответственность за превышение полномочий. Fallback: "Не установлено" / "Не удалось определить".
          required: false

      store_payload: true

  - id: whistleblowing_and_anti_fraud_check
    name: "Whistleblowing, антифрод и обязанность сообщать о нарушениях"
    description: >
      Фактографическая проверка условий об обязанности работника сообщать
      о нарушениях (whistleblowing), гарантиях защиты информатора
      (non-retaliation), обязанности сообщать о мошенничестве и содействовать
      внутренним расследованиям. Критично для внутреннего контроля
      и compliance: отсутствие таких условий делает систему контроля
      неэффективной (ст. 22.1 ТК РФ; ФЗ-115 ст. 7; ФЗ-273 ст. 13.3).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "whistleblowing"
        - "информатор"
        - "сообщать о нарушениях"
        - "сообщение о нарушениях"
        - "защита информатора"
        - "non-retaliation"
        - "не преследовать"
        - "антифрод"
        - "мошенничество"
        - "fraud"
        - "корпоративное расследование"
        - "внутренний контроль"
        - "внутренний аудит"
        - "горячая линия"
        - "горячая линия комплаенс"
        - "этика"
        - "подарки"
        - "откаты"
        - "коммерческий подкуп"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)whistle[\\s-]?blow"
        - "(?i)(сообща|уведомл)[а-яё]+\\s+о\\s+нарушени"
        - "(?i)(защит[а-яё]+\\s+информатор|non[\\s-]?retaliat)"
        - "(?i)(антифрод|мошенничеств|fraud)"
        - "(?i)(горяч[а-яё]+\\s+лини|коммерческ[а-яё]+\\s+подкуп|откат)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по трудовому праву и compliance.
        Анализируется трудовой договор (ст. 22.1 ТК РФ; ФЗ-115 ст. 7;
        ФЗ-273 ст. 13.3; ФЗ от 16.12.2019 № 439-ФЗ; Методические рекомендации
        Банка России от 06.11.2015 № 36-МР).
        Проверяется только один вопрос: whistleblowing, антифрод и обязанность
        сообщать о нарушениях.
        Нормативный ориентир:
        - ст. 22.1 ТК РФ — электронный документооборот в трудовых отношениях
        (позволяет организовать защищённый канал).
        - ФЗ-115 ст. 7 — внутренний контроль, обязанность выявлять
        подозрительные операции.
        - ФЗ-273 ст. 13.3 — обязанность организаций разрабатывать меры
        по предупреждению коррупции.
        - ФЗ от 16.12.2019 № 439-ФЗ — защита лиц, сообщивших о коррупции.
        - Методические рекомендации Банка России № 36-МР — рекомендации
        по организации whistleblowing.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска, не подставляй нормы закона вместо текста.
        - Для внутреннего контроля критично: система whistleblowing
        не работает без защиты информатора от преследования.
        - Различай:
          1) Обязанность сообщать о нарушениях (duty to report);
          2) Канал для сообщений (горячая линия, электронная форма);
          3) Гарантии защиты информатора (non-retaliation);
          4) Обязанность сообщать именно о мошенничестве (antifraud).
        [ЗАДАЧА]
        Найди в тексте договора:
        1. Обязанность сообщать о нарушениях (whistleblowing duty).
        2. Указание на канал для сообщений (горячая линия, электронная форма).
        3. Гарантии защиты информатора (non-retaliation).
        4. Обязанность сообщать именно о мошенничестве / коммерческом подкупе.
        5. Обязанность сотрудничать при внутренних расследованиях.
        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона вместо текста.
        2. Для *_status используй строго "defined" или "not_defined".
        3. Для *_value при отсутствии данных — строго "Данные не определены".
        4. whistleblowing_duty_* фиксирует обязанность сообщать о нарушениях.
        5. whistleblowing_channel_* фиксирует канал для сообщений (горячая
        линия, электронная форма, ответственное лицо).
        6. non_retaliation_* фиксирует гарантии защиты информатора
        от преследования.
        7. fraud_reporting_* фиксирует обязанность сообщать именно
        о мошенничестве / коммерческом подкупе.
        8. investigation_cooperation_* фиксирует обязанность сотрудничать
        при внутренних расследованиях.
        9. Если условие определяется через отсылку к документу (Политика
        whistleblowing, Антикоррупционная политика, Кодекс этики) —
        фиксируй как "defined" со значением «согласно <документ>».
        10. В evidence включай только текст договора.
        11. Никогда не используй "None", "null", пустые строки или отсутствующие ключи.
        12. Верни РОВНО один валидный JSON-объект со всеми 11 ключами (10 полей + evidence),
        пригодный для парсинга через json.loads без предварительной обработки.
        Без markdown, без ```json, без комментариев, без текста до или после.
        Начни ответ сразу с { и закончи }.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — полная структура whistleblowing:
        Фрагмент:
        "Работник обязуется сообщать работодателю о любых известных ему
        фактах нарушений закона, коммерческого подкупа, мошенничества
        или иных противоправных действий. Сообщения направляются
        на горячую линию комплаенс либо через электронную форму
        на корпоративном портале. Работодатель гарантирует работнику
        защиту от преследования в связи с добросовестным сообщением
        о нарушениях. Работник обязуется содействовать внутренним
        расследованиям."
        Ответ:
        {
          "whistleblowing_duty_status": "defined",
          "whistleblowing_duty_value": "обязанность сообщать о фактах нарушений закона, коммерческого подкупа, мошенничества и иных противоправных действий",
          "whistleblowing_channel_status": "defined",
          "whistleblowing_channel_value": "горячая линия комплаенс, электронная форма на корпоративном портале",
          "non_retaliation_status": "defined",
          "non_retaliation_value": "гарантия защиты от преследования в связи с добросовестным сообщением о нарушениях",
          "fraud_reporting_status": "defined",
          "fraud_reporting_value": "обязанность сообщать о коммерческом подкупе и мошенничестве",
          "investigation_cooperation_status": "defined",
          "investigation_cooperation_value": "обязанность содействовать внутренним расследованиям",
          "evidence": [
            {
              "clause_ref": "п. 12.1",
              "quote": "Работник обязуется сообщать работодателю о любых известных ему фактах нарушений закона, коммерческого подкупа, мошенничества или иных противоправных действий."
            }
          ]
        }
        Пример 2 — только обязанность сообщать, без гарантий:
        Фрагмент:
        "Работник обязуется сообщать работодателю о ставших ему известными
        фактах нарушений."
        Ответ:
        {
          "whistleblowing_duty_status": "defined",
          "whistleblowing_duty_value": "обязанность сообщать о ставших известными фактах нарушений",
          "whistleblowing_channel_status": "not_defined",
          "whistleblowing_channel_value": "Данные не определены",
          "non_retaliation_status": "not_defined",
          "non_retaliation_value": "Данные не определены",
          "fraud_reporting_status": "not_defined",
          "fraud_reporting_value": "Данные не определены",
          "investigation_cooperation_status": "not_defined",
          "investigation_cooperation_value": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 12.2",
              "quote": "Работник обязуется сообщать работодателю о ставших ему известными фактах нарушений."
            }
          ]
        }
        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Работник выполняет свои обязанности в соответствии с договором."
        Ответ:
        {
          "whistleblowing_duty_status": "not_defined",
          "whistleblowing_duty_value": "Данные не определены",
          "whistleblowing_channel_status": "not_defined",
          "whistleblowing_channel_value": "Данные не определены",
          "non_retaliation_status": "not_defined",
          "non_retaliation_value": "Данные не определены",
          "fraud_reporting_status": "not_defined",
          "fraud_reporting_value": "Данные не определены",
          "investigation_cooperation_status": "not_defined",
          "investigation_cooperation_value": "Данные не определены",
          "evidence": []
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Проверь, что все 11 ключей (10 полей + evidence) присутствуют в JSON.
        2. Проверь, что каждый *_status ∈ {"defined", "not_defined"}, а каждый *_value
        при отсутствии данных = "Данные не определены".
        3. Проверь, что для каждого defined-поля в evidence есть прямая цитата из договора.
        4. Убедись, что whistleblowing_duty_* (общая обязанность) не спутана
        с fraud_reporting_* (именно мошенничество / коммерческий подкуп).
        5. Убедись, что гарантии защиты информатора (non-retaliation)
        отражены в отдельном поле.
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "whistleblowing_duty_status": "<defined / not_defined>",
          "whistleblowing_duty_value": "<текст / 'согласно <документ>' / 'Данные не определены'>",
          "whistleblowing_channel_status": "<defined / not_defined>",
          "whistleblowing_channel_value": "<текст / 'согласно <документ>' / 'Данные не определены'>",
          "non_retaliation_status": "<defined / not_defined>",
          "non_retaliation_value": "<текст / 'не предусмотрена' / 'Данные не определены'>",
          "fraud_reporting_status": "<defined / not_defined>",
          "fraud_reporting_value": "<текст / 'Данные не определены'>",
          "investigation_cooperation_status": "<defined / not_defined>",
          "investigation_cooperation_value": "<текст / 'не предусмотрена' / 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 7
      temperature: 0.0
      max_tokens: 1000

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "whistleblowing информатор сообщать о нарушениях сообщение о нарушениях защита информатора non-retaliation не преследовать антифрод мошенничество fraud корпоративное расследование внутренний контроль внутренний аудит горячая линия комплаенс этика подарки откаты коммерческий подкуп"
      preferred_unit_types:
        - obligation
        - general_provision
        - definition
      excluded_unit_types:
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - limitations
        - boilerplate
        - procedures
      boost_keywords:
        - "whistleblowing"
        - "горячая линия"
        - "защита информатора"
        - "коммерческий подкуп"
        - "мошенничество"
      negative_keywords:
        - "трудовая функция"
        - "оклад"
        - "рабочее время"
        - "отпуск"
        - "конфиденциальность"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.40, 0.90]
        boost: 0.30
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "limitations"
        - "boilerplate"
        - "procedures"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1200

      compact_output: false

      presence_signal:
        field: "whistleblowing_and_anti_fraud_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по трудовому праву и compliance. Извлеки
        из трудового договора сведения о whistleblowing, антифроде
        и обязанности сообщать о нарушениях.
        Не анализируй оплату труда, режим работы или расторжение.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 10 полей + evidence (всего 11 ключей):

        0. whistleblowing_and_anti_fraud_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (whistleblowing_duty_status, whistleblowing_channel_status,
              non_retaliation_status, fraud_reporting_status,
              investigation_cooperation_status) ≠ "not_defined";
           - "missing" — если все пять содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - все пять *_status = "not_defined";
           - все *_value = "Данные не определены";
           - не выполняй остальные шаги.

        1. whistleblowing_duty_status — "defined" или "not_defined".
        2. whistleblowing_duty_value — обязанность сообщать о нарушениях.
        3. whistleblowing_channel_status — "defined" или "not_defined".
        4. whistleblowing_channel_value — канал для сообщений.
        5. non_retaliation_status — "defined" или "not_defined".
        6. non_retaliation_value — гарантии защиты информатора.
        7. fraud_reporting_status — "defined" или "not_defined".
        8. fraud_reporting_value — обязанность сообщать о мошенничестве.
        9. investigation_cooperation_status — "defined" или "not_defined".
        10. investigation_cooperation_value — обязанность сотрудничать
            при расследованиях.

        Если данные отсутствуют:
        - для *_status — "not_defined"
        - для *_value — "Данные не определены"
        </task>

        <context_rules>
        - Перед остальными полями заполни whistleblowing_and_anti_fraud_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_value = "Данные не определены".
        - Используй только текст договора.
        - Различай общую обязанность сообщать о нарушениях и обязанность
          сообщать именно о мошенничестве / коммерческом подкупе — это разные
          требования.
        - Если условие определяется через отсылку к документу (Политика
          whistleblowing, Антикоррупционная политика, Кодекс этики) —
          фиксируй как "defined" со значением «согласно <документ>».
        - Если в разных фрагментах указаны разные данные и конфликт нельзя
          разрешить по тексту — статус → "not_defined", значение → "Не удалось определить".
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни обязанности сообщать о нарушениях,
           ни канала для сообщений, ни гарантий защиты.
           → presence = "missing";
             все пять *_status = "not_defined";
             все *_value = "Данные не определены".

        2. Только общая обязанность сообщать.
           Есть обязанность сообщать о нарушениях, но без канала,
           гарантий защиты и антифрод-специфики.
           → presence = "present";
             whistleblowing_duty_status = "defined";
             whistleblowing_channel_status = "not_defined";
             non_retaliation_status = "not_defined";
             fraud_reporting_status = "not_defined";
             соответствующие *_value = "Данные не определены".

        3. Противоречие между фрагментами.
           В одном пункте установлена защита информатора, в другом —
           допускается дисциплинарная ответственность за разглашение.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             соответствующее *_value = "Не удалось определить".

        4. Отсылка на Политику whistleblowing.
           Порядок сообщений и защиты информатора определяется
           отдельным документом.
           → presence = "present";
             whistleblowing_duty_status = "defined";
             whistleblowing_duty_value содержит формулировку вида
             «согласно Политике whistleblowing».
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для whistleblowing_and_anti_fraud_check_presence используй только: "present", "missing", "unclear".
        - Для всех *_status используй только: "defined" или "not_defined".
        - Fallback при отсутствии данных:
          * все *_value → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_value → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "whistleblowing_and_anti_fraud_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие условий о whistleblowing и антифроде. Внутреннее агрегатное signal-поле."
          required: true

        - name: "whistleblowing_duty_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус обязанности сообщать о нарушениях. Внутреннее enum-поле."
          required: true

        - name: "whistleblowing_duty_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Обязанность сообщать"
          description: >
            Обязанность сообщать о нарушениях (whistleblowing duty). Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "whistleblowing_channel_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания канала для сообщений. Внутреннее enum-поле."
          required: true

        - name: "whistleblowing_channel_value"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Канал для сообщений"
          description: >
            Канал для сообщений (горячая линия, электронная форма). Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "non_retaliation_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус гарантий защиты информатора. Внутреннее enum-поле."
          required: true

        - name: "non_retaliation_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Защита информатора"
          description: >
            Гарантии защиты информатора от преследования. Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "fraud_reporting_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус обязанности сообщать о мошенничестве. Внутреннее enum-поле."
          required: true

        - name: "fraud_reporting_value"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Антифрод-обязанность"
          description: >
            Обязанность сообщать именно о мошенничестве / коммерческом подкупе. Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "investigation_cooperation_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус обязанности сотрудничать при расследованиях. Внутреннее enum-поле."
          required: true

        - name: "investigation_cooperation_value"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Сотрудничество с расследованиями"
          description: >
            Обязанность сотрудничать при внутренних расследованиях. Fallback: "Не установлено" / "Не удалось определить".
          required: false

      store_payload: true

  - id: pension_program_check
    name: "Корпоративные пенсионные программы и дополнительное пенсионное обеспечение"
    description: >
      Фактографическая проверка условий о корпоративной пенсионной программе
      (негосударственное пенсионное обеспечение — НПО, дополнительное
      пенсионное обеспечение, долгосрочные сбережения). Критично для M&A:
      корпоративные пенсионные обязательства могут быть значительными
      и переходить к покупателю, особенно в крупных компаниях
      со «золотыми парашютами» для топ-менеджмента.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "medium"
    severity_if_pass: "pass"
    severity_if_fail: "medium"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "корпоративная пенсия"
        - "корпоративная пенсионная программа"
        - "негосударственное пенсионное обеспечение"
        - "НПО"
        - "НПФ"
        - "негосударственный пенсионный фонд"
        - "дополнительное пенсионное обеспечение"
        - "ДПО"
        - "пенсионный план"
        - "пенсионная программа работодателя"
        - "долгосрочные сбережения"
        - "софинансирование пенсии"
        - "выходное пособие при выходе на пенсию"
        - "единовременная выплата при выходе на пенсию"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(корпоративн[а-яё]+|негосударственн[а-яё]+)\\s+пенси"
        - "(?i)(НПФ|НПО|ДПО)"
        - "(?i)пенсионн[а-яё]+\\s+(программ|план)"
        - "(?i)(долгосрочн[а-яё]+\\s+сбережени|софинансировани[ея]\\s+пенси)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по трудовому праву и пенсионному обеспечению.
        Анализируется трудовой договор (ст. 57, 129, 191 ТК РФ; ФЗ от 07.05.1998
        № 75-ФЗ «О негосударственных пенсионных фондах»; ФЗ от 15.12.2001
        № 167-ФЗ «Об обязательном пенсионном страховании»; ФЗ от 30.04.2008
        № 56-ФЗ «О дополнительных страховых взносах»; ФЗ от 27.12.2019
        № 446-ФЗ «О долгосрочных сбережениях» — с 2024 г.).
        Проверяется только один вопрос: корпоративные пенсионные программы
        и дополнительное пенсионное обеспечение.
        Нормативный ориентир:
        - ст. 57 ТК РФ — дополнительные условия трудового договора.
        - ФЗ-75 — НПФ: корпоративные пенсионные программы, пенсионные схемы,
        договоры НПО с работодателями.
        - ФЗ-167 — обязательное пенсионное страхование (базовая часть).
        - ФЗ-56 — дополнительное страховое обеспечение (софинансирование).
        - ФЗ-446 — долгосрочные сбережения, ИПП (индивидуальный пенсионный
        план), НПС (негосударственное пенсионное сбережение) — с 2024 г.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска, не подставляй нормы закона вместо текста.
        - Для M&A критично: корпоративные пенсионные обязательства
        (особенно для топ-менеджмента) могут быть долгосрочными
        (10–30 лет) и требуют оценки.
        - Различай:
          1) Обязательную часть (ОПС) — не регулируется договором;
          2) Корпоративную пенсионную программу (НПО через НПФ);
          3) Долгосрочные сбережения (ИПП, НПС);
          4) Единовременные выплаты при выходе на пенсию.
        [ЗАДАЧА]
        Найди в тексте договора:
        1. Наличие корпоративной пенсионной программы / НПО.
        2. Условия софинансирования (доли работника и работодателя).
        3. Вид программы (НПО, ИПП, НПС, иное).
        4. Условия выплаты (при выходе на пенсию, при увольнении).
        5. Ссылку на пенсионный план / договор НПО.
        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона вместо текста.
        2. Для *_status используй строго "defined" или "not_defined".
        3. Для *_value при отсутствии данных — строго "Данные не определены".
        4. pension_program_* фиксирует наличие корпоративной пенсионной
        программы / НПО.
        5. co_financing_* фиксирует условия софинансирования (доли работника
        и работодателя).
        6. program_type_* фиксирует вид программы (НПО, ИПП, НПС).
        7. payout_terms_* фиксирует условия выплаты (при выходе на пенсию,
        при увольнении).
        8. pension_documentation_* фиксирует ссылку на пенсионный план
        или договор НПО.
        9. Если условие определяется через отсылку к документу (Пенсионный
        план, Договор НПО, Приложение) — фиксируй как "defined"
        со значением «согласно <документ>».
        10. В evidence включай только текст договора.
        11. Никогда не используй "None", "null", пустые строки или отсутствующие ключи.
        12. Верни РОВНО один валидный JSON-объект со всеми 11 ключами (10 полей + evidence),
        пригодный для парсинга через json.loads без предварительной обработки.
        Без markdown, без ```json, без комментариев, без текста до или после.
        Начни ответ сразу с { и закончи }.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — полная корпоративная пенсионная программа:
        Фрагмент:
        "Работодатель обеспечивает участие работника в корпоративной
        пенсионной программе, реализуемой через НПФ «Будущее».
        Софинансирование: работник вносит 3% от заработной платы,
        работодатель — 6%. Выплаты производятся при достижении
        работником пенсионного возраста; при увольнении до этого срока
        выплачивается выкупная сумма. Условия программы — согласно
        Пенсионному плану работодателя."
        Ответ:
        {
          "pension_program_status": "defined",
          "pension_program_value": "корпоративная пенсионная программа через НПФ «Будущее»",
          "co_financing_status": "defined",
          "co_financing_value": "работник — 3% от заработной платы, работодатель — 6%",
          "program_type_status": "defined",
          "program_type_value": "негосударственное пенсионное обеспечение (НПО) через НПФ",
          "payout_terms_status": "defined",
          "payout_terms_value": "при достижении пенсионного возраста; при увольнении до этого срока — выкупная сумма",
          "pension_documentation_status": "defined",
          "pension_documentation_value": "согласно Пенсионному плану работодателя",
          "evidence": [
            {
              "clause_ref": "п. 13.1",
              "quote": "Работодатель обеспечивает участие работника в корпоративной пенсионной программе, реализуемой через НПФ «Будущее»."
            }
          ]
        }
        Пример 2 — только единовременная выплата при выходе на пенсию:
        Фрагмент:
        "При достижении работником пенсионного возраста и непрерывном
        стаже работы не менее 10 лет работнику выплачивается единовременное
        пособие в размере 5 средних месячных заработков."
        Ответ:
        {
          "pension_program_status": "defined",
          "pension_program_value": "единовременное пособие при выходе на пенсию",
          "co_financing_status": "not_defined",
          "co_financing_value": "Данные не определены",
          "program_type_status": "defined",
          "program_type_value": "единовременная выплата при выходе на пенсию",
          "payout_terms_status": "defined",
          "payout_terms_value": "при достижении пенсионного возраста и непрерывном стаже не менее 10 лет — 5 средних месячных заработков",
          "pension_documentation_status": "not_defined",
          "pension_documentation_value": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 13.2",
              "quote": "При достижении работником пенсионного возраста и непрерывном стаже работы не менее 10 лет работнику выплачивается единовременное пособие в размере 5 средних месячных заработков."
            }
          ]
        }
        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Работник выполняет свои обязанности в соответствии с договором."
        Ответ:
        {
          "pension_program_status": "not_defined",
          "pension_program_value": "Данные не определены",
          "co_financing_status": "not_defined",
          "co_financing_value": "Данные не определены",
          "program_type_status": "not_defined",
          "program_type_value": "Данные не определены",
          "payout_terms_status": "not_defined",
          "payout_terms_value": "Данные не определены",
          "pension_documentation_status": "not_defined",
          "pension_documentation_value": "Данные не определены",
          "evidence": []
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Проверь, что все 11 ключей (10 полей + evidence) присутствуют в JSON.
        2. Проверь, что каждый *_status ∈ {"defined", "not_defined"}, а каждый *_value
        при отсутствии данных = "Данные не определены".
        3. Проверь, что для каждого defined-поля в evidence есть прямая цитата из договора.
        4. Убедись, что корпоративная пенсионная программа не спутана
        с обязательным пенсионным страхованием (ОПС).
        5. Убедись, что софинансирование, вид программы и условия выплаты
        разнесены по соответствующим полям.
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "pension_program_status": "<defined / not_defined>",
          "pension_program_value": "<текст / 'согласно <документ>' / 'Данные не определены'>",
          "co_financing_status": "<defined / not_defined>",
          "co_financing_value": "<текст / 'не предусмотрено' / 'Данные не определены'>",
          "program_type_status": "<defined / not_defined>",
          "program_type_value": "<текст / 'Данные не определены'>",
          "payout_terms_status": "<defined / not_defined>",
          "payout_terms_value": "<текст / 'Данные не определены'>",
          "pension_documentation_status": "<defined / not_defined>",
          "pension_documentation_value": "<текст / 'согласно <документ>' / 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 7
      temperature: 0.0
      max_tokens: 950

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "корпоративная пенсия корпоративная пенсионная программа негосударственное пенсионное обеспечение НПО НПФ негосударственный пенсионный фонд дополнительное пенсионное обеспечение ДПО пенсионный план пенсионная программа работодателя долгосрочные сбережения софинансирование пенсии выходное пособие при выходе на пенсию единовременная выплата при выходе на пенсию"
      preferred_unit_types:
        - obligation
        - payment_term
        - general_provision
      excluded_unit_types:
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - boilerplate
        - procedures
      boost_keywords:
        - "корпоративная пенсия"
        - "НПО"
        - "НПФ"
        - "пенсионная программа"
        - "софинансирование"
      negative_keywords:
        - "трудовая функция"
        - "рабочее время"
        - "отпуск"
        - "конфиденциальность"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.40, 0.90]
        boost: 0.30
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "boilerplate"
        - "procedures"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1100

      compact_output: false

      presence_signal:
        field: "pension_program_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по трудовому праву и пенсионному обеспечению.
        Извлеки из трудового договора сведения о корпоративных пенсионных
        программах и дополнительном пенсионном обеспечении.
        Не анализируй оплату труда, режим работы или расторжение.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 10 полей + evidence (всего 11 ключей):

        0. pension_program_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (pension_program_status, co_financing_status,
              program_type_status, payout_terms_status,
              pension_documentation_status) ≠ "not_defined";
           - "missing" — если все пять содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - все пять *_status = "not_defined";
           - все *_value = "Данные не определены";
           - не выполняй остальные шаги.

        1. pension_program_status — "defined" или "not_defined".
        2. pension_program_value — наличие корпоративной пенсионной программы.
        3. co_financing_status — "defined" или "not_defined".
        4. co_financing_value — условия софинансирования.
        5. program_type_status — "defined" или "not_defined".
        6. program_type_value — вид программы (НПО, ИПП, НПС, иное).
        7. payout_terms_status — "defined" или "not_defined".
        8. payout_terms_value — условия выплаты.
        9. pension_documentation_status — "defined" или "not_defined".
        10. pension_documentation_value — ссылка на пенсионный план / договор НПО.

        Если данные отсутствуют:
        - для *_status — "not_defined"
        - для *_value — "Данные не определены"
        </task>

        <context_rules>
        - Перед остальными полями заполни pension_program_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_value = "Данные не определены".
        - Используй только текст договора.
        - Корпоративная пенсионная программа не путается с обязательным
          пенсионным страхованием (ОПС) — ОПС не регулируется договором.
        - Если условие определяется через отсылку к документу (Пенсионный
          план, Договор НПО, Приложение) — фиксируй как "defined"
          со значением «согласно <документ>».
        - Если в разных фрагментах указаны разные данные и конфликт нельзя
          разрешить по тексту — статус → "not_defined", значение → "Не удалось определить".
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни корпоративной пенсионной программы,
           ни софинансирования, ни выплат при выходе на пенсию.
           → presence = "missing";
             все пять *_status = "not_defined";
             все *_value = "Данные не определены".

        2. Только единовременная выплата при выходе на пенсию.
           Есть выплата при достижении пенсионного возраста, но нет
           программы НПО и софинансирования.
           → presence = "present";
             pension_program_status = "defined";
             program_type_status = "defined";
             co_financing_status = "not_defined";
             соответствующие *_value = "Данные не определены".

        3. Противоречие между фрагментами.
           В разных частях договора указаны противоречащие условия
           выплаты или разные пенсионные программы.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             соответствующее *_value = "Не удалось определить".

        4. Отсылка на Пенсионный план / Договор НПО.
           Условия программы определяются отдельным документом.
           → presence = "present";
             pension_program_status = "defined";
             pension_program_value содержит формулировку вида
             «согласно Пенсионному плану работодателя».
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для pension_program_check_presence используй только: "present", "missing", "unclear".
        - Для всех *_status используй только: "defined" или "not_defined".
        - Fallback при отсутствии данных:
          * все *_value → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_value → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "pension_program_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие условий о корпоративной пенсионной программе. Внутреннее агрегатное signal-поле."
          required: true

        - name: "pension_program_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус наличия корпоративной пенсионной программы. Внутреннее enum-поле."
          required: true

        - name: "pension_program_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Пенсионная программа"
