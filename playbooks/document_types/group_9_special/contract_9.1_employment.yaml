        возврат излишне выплаченных сумм, возмещение ущерба)
        - ст. 138 ТК РФ — пределы удержаний (общий лимит 20%, специальные
        случаи по ФЗ — 50%, удержания по исполнительным документам — до 70%)
        - ст. 248 ТК РФ — взыскание ущерба
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска, не подставляй нормы закона вместо текста.
        - Удержания, предусмотренные ТК РФ, фиксируй как "defined" в соответствующих полях.
        [ЗАДАЧА]
        Найди в тексте договора:
        1. Общее правило об удержаниях из заработной платы (основания, лимит).
        2. Указание на специальные случаи удержаний (50% / 70%).
        3. Перечень оснований удержаний.
        4. Удержания, не предусмотренные ТК РФ (например, штрафы за опоздания).
        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона вместо текста.
        2. Для *_status используй строго "defined" или "not_defined".
        3. Для *_value при отсутствии данных — строго "Данные не определены".
        4. Для deductions_general_*: "defined" если в тексте есть общее правило
        об удержаниях.
        5. Для deductions_special_*: "defined" только если прямо указаны
        специальные случаи (алименты, возмещение ущерба при полной МО, иные ФЗ).
        6. Для deductions_basis_*: перечень оснований, прямо указанных в договоре.
        7. Для deductions_nonstatutory_*: "defined" если прямо указаны удержания,
        не предусмотренные ТК РФ (штрафы за опоздания, за отказ от работы и т.п.).
        8. Если правило об удержаниях определяется через отсылку к документу
        (Положение, Коллективный договор) — фиксируй как "defined" со значением
        «согласно <документ>».
        9. В evidence включай только текст договора.
        10. Никогда не используй "None", "null", пустые строки или отсутствующие ключи.
        11. Верни РОВНО один валидный JSON-объект со всеми 9 ключами (8 полей + evidence),
        пригодный для парсинга через json.loads без предварительной обработки.
        Без markdown, без ```json, без комментариев, без текста до или после.
        Начни ответ сразу с { и закончи }.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — общее правило + специальные случаи:
        Фрагмент:
        "Из заработной платы работника могут производиться удержания в случаях,
        предусмотренных ТК РФ, с соблюдением лимита 20%. При взыскании алиментов
        и возмещении ущерба при полной материальной ответственности удержания
        могут достигать 50%."
        Ответ:
        {
