  - id: termination_modification_rights_check
    name: "Расторжение, изменение условий и защита прав работника"
    description: >
      Фактографическая проверка оснований и процедуры расторжения, порядка
      изменения условий договора, выходного пособия, срока окончательного расчёта,
      выплаты при увольнении по соглашению сторон, а также выявления условий,
      ограничивающих права работника (ст. 9 ТК РФ) и дискриминационных условий (ст. 3 ТК РФ).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "расторжение трудового договора"
        - "прекращение"
        - "увольнение"
        - "основания расторжения"
        - "по инициативе работника"
        - "по инициативе работодателя"
        - "по соглашению сторон"
        - "ст. 81 ТК РФ"
        - "выходное пособие"
        - "окончательный расчёт"
        - "день увольнения"
        - "изменение условий трудового договора"
        - "уведомление за 2 месяца"
        - "предложение вакантных должностей"
        - "дискриминация"
        - "запрет дискриминации"
        - "равная оплата"
        - "отказ от отпуска"
        - "отказ от больничного"
        - "работник не вправе обращаться в суд"
        - "снижение гарантий"
        - "ухудшение положения"
        - "запрет на обращение в ГИТ"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)расторжени(е|я)\\s+трудов"
        - "(?i)ст\\.\\s*81\\s*ТК"
        - "(?i)изменени[ея]\\s+условий\\s+трудов"
        - "(?i)отказ\\s+от\\s+(отпуск|больничн)"
        - "(?i)работник\\s+не\\s+вправе\\s+обращаться"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по трудовому праву.
        Анализируется трудовой договор.
        Проверяется только один вопрос: расторжение, изменение условий,
        защита прав работника и дискриминационные условия.
        Нормативный ориентир:
        - ст. 3 ТК РФ — запрет дискриминации в сфере труда
        - ст. 9 ТК РФ — запрет ухудшения положения работника по сравнению с ТК РФ
        - ст. 72 ТК РФ — изменение определённых сторонами условий по соглашению
        - ст. 74 ТК РФ — изменение условий по инициативе работодателя, уведомление за 2 месяца
        - ст. 77 ТК РФ — общие основания прекращения трудового договора
        - ст. 78 ТК РФ — расторжение по соглашению сторон
        - ст. 78–80 ТК РФ — расторжение по соглашению сторон / по инициативе работника
        - ст. 81 ТК РФ — расторжение по инициативе работодателя
        - ст. 84.1 ТК РФ — оформление прекращения трудового договора
        - ст. 140 ТК РФ — сроки расчёта при увольнении (день увольнения)
        - ст. 178 ТК РФ — выходные пособия
        - ст. 261 ТК РФ — гарантии беременным женщинам и лицам с семейными обязанностями
        - ст. 269 ТК РФ — гарантии несовершеннолетним
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска, не подставляй нормы закона вместо текста.
        - Фиксируй наличие дискриминационных формулировок как факт.
        [ЗАДАЧА]
        Найди в тексте договора:
        1. Основания расторжения трудового договора.
        2. Процедуру расторжения.
        3. Выходное пособие.
        4. Порядок изменения условий договора.
        5. Уведомление за 2 месяца при одностороннем изменении.
        6. Наличие дискриминационных формулировок (ограничения по полу, возрасту,
        национальности, иным признакам по ст. 3 ТК РФ).
        7. Наличие условий, ограничивающих права работника (отказ от отпуска,
        запрет обращения в суд / ГИТ, снижение гарантий).
        8. Срок окончательного расчёта при увольнении (ст. 140 ТК РФ).
        9. Выплату при увольнении по соглашению сторон (ст. 78 ТК РФ).
        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона вместо текста.
        2. Для *_status используй строго "defined" или "not_defined".
        3. Для *_value при отсутствии данных — строго "Данные не определены".
        4. Для termination_grounds_*, termination_procedure_*, severance_pay_*,
        modification_*:
        "defined" = соответствующее условие присутствует в тексте;
        "not_defined" = не упомянуто.
        5. Для discrimination_status и rights_restriction_status применяется
        ИНВЕРТИРОВАННАЯ логика:
        "defined" = в тексте прямо выявлены дискриминационные / ограничивающие
        права формулировки (это негативный сигнал);
        "not_defined" = такие формулировки не выявлены.
        6. discrimination_status = "defined" только при наличии формулировок,
        содержащих ограничения по полу, возрасту, национальности, вероисповеданию,
        семейному положению или иным основаниям по ст. 3 ТК РФ.
        7. rights_restriction_status = "defined" только при наличии условий,
        ограничивающих права работника по сравнению с ТК РФ (отказ от отпуска,
        запрет обращения в суд / ГИТ, снижение гарантий, отказ от больничного).
        8. final_settlement_* фиксирует срок расчёта при увольнении.
        По умолчанию — день увольнения (ст. 140 ТК РФ); если прямо указано иное —
        фиксируй как написано.
        9. termination_agreement_payment_* фиксирует выплату при увольнении
        по соглашению сторон. Если прямо не указана — "not_defined".
        10. Если порядок расторжения / изменения / выплаты выходного пособия
        определяется через отсылку к документу (Коллективный договор, Положение,
        Приложение) — фиксируй как "defined" со значением «согласно <документ>».
        11. В evidence включай только текст договора.
        12. Никогда не используй "None", "null", пустые строки или отсутствующие ключи.
        13. Верни РОВНО один валидный JSON-объект со всеми 17 ключами (16 полей + evidence),
        пригодный для парсинга через json.loads без предварительной обработки.
        Без markdown, без ```json, без комментариев, без текста до или после.
        Начни ответ сразу с { и закончи }.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — стандартные условия:
        Фрагмент:
        "Трудовой договор может быть расторгнут по основаниям, предусмотренным
        ст. 77–81 ТК РФ. При расторжении по сокращению штата выплачивается
        выходное пособие в размере среднего месячного заработка. Окончательный
        расчёт производится в день увольнения. При увольнении по соглашению
        сторон работнику выплачивается дополнительная компенсация в размере
        двух средних месячных заработков. Изменение условий договора допускается
        по соглашению сторон (ст. 72 ТК РФ) либо по инициативе работодателя
        с уведомлением работника за 2 месяца (ст. 74 ТК РФ)."
