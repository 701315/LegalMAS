    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 700

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 1450
      store_payload: true

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по трудовому праву. Извлеки из трудового договора
        структуру оплаты труда: оклад, доплаты, надбавки, премии, даты выплаты,
        индексацию, форму оплаты.
        Не анализируй рабочее время, отпуск, расторжение или охрану труда.
        Не сравнивай суммы с МРОТ.
        </role>
        <context>
        {context}
        </context>
        <task>
        Заполни строго следующие 14 полей + evidence (всего 15 ключей):
        1. base_salary_status — "defined" или "not_defined".
        2. base_salary_value — оклад/тарифная ставка (или отсылка к документу).
        3. allowances_status — "defined" или "not_defined".
        4. allowances_value — доплаты и надбавки.
        5. bonuses_status — "defined" или "not_defined".
        6. bonuses_value — премии и порядок премирования.
        7. payment_dates_status — "defined" или "not_defined".
        8. payment_dates_value — конкретные даты выплаты.
        9. payment_frequency_status — "defined" или "not_defined".
        10. payment_frequency_value — периодичность выплаты.
        11. indexation_status — "defined" или "not_defined".
        12. indexation_value — порядок / периодичность индексации.
        13. payment_form_status — "defined" или "not_defined".
        14. payment_form_value — форма оплаты и доля неденежной части.
        Если данные отсутствуют:
        - для *_status — "not_defined"
        - для *_value — "Данные не определены"
        </task>
        <rules>
        - Используй только текст договора.
        - Не сравнивай суммы с МРОТ.
        - Не делай выводов о достаточности оплаты.
        - Если оклад/надбавки/премии определяются через отсылку к документу
        (штатное расписание, Положение об оплате труда, Положение о премировании,
        Приложение) — фиксируй это как "defined" со значением «согласно <документ>».
        - Если прямо указано, что надбавки или премии не устанавливаются —
        соответствующий *_status = "defined", *_value = "не устанавливаются".
        - Если указана только формулировка "не реже чем каждые полмесяца"
        без конкретных дат — payment_dates_status = "not_defined",
        payment_frequency_status = "defined",
        payment_frequency_value = "не реже чем каждые полмесяца".
        - indexation_* фиксирует наличие условия об индексации (ст. 134 ТК РФ).
        Если указано "индексация не предусмотрена" — status = "defined",
        value = "не предусмотрена". Если отсылка к ЛНА — "согласно <документ>".
        - payment_form_* фиксирует форму оплаты. "денежная" если не указано иное;
        "смешанная, доля неденежной — <X>%" если указана доля неденежной формы.
        - Верни РОВНО один валидный JSON-объект со всеми 15 ключами,
        без markdown и комментариев.
        </rules>
      fields:
        - name: "base_salary_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения оклада."
          required: true
        - name: "base_salary_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Оклад / тарифная ставка"
          description: "Оклад или тарифная ставка."
          required: true
        - name: "allowances_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус доплат и надбавок."
          required: true
        - name: "allowances_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Доплаты и надбавки"
          description: "Доплаты и надбавки."
          required: false
        - name: "bonuses_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус премий."
          required: true
        - name: "bonuses_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Премии"
          description: "Премии и порядок премирования."
          required: false
        - name: "payment_dates_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус конкретных дат выплаты."
          required: true
        - name: "payment_dates_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 4
          label: "Даты выплаты"
          description: "Конкретные даты выплаты заработной платы."
          required: true
        - name: "payment_frequency_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус периодичности выплаты."
          required: true
        - name: "payment_frequency_value"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Периодичность выплаты"
          description: "Периодичность выплаты заработной платы."
          required: false
        - name: "indexation_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус условия об индексации заработной платы."
          required: true
        - name: "indexation_value"
