    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "запрет конкуренции"
        - "non-compete"
        - "не конкурировать"
        - "запрет переманивания"
        - "non-solicitation"
        - "не трудоустраиваться в конкурирующую"
        - "не работать у конкурентов"
        - "ограничение трудоустройства"
        - "досудебный порядок"
        - "переговоры"
        - "комиссия по трудовым спорам"
        - "КТС"
        - "медиация"
        - "коллективный договор"
        - "положения коллективного договора"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)запрет.*конкуренц"
        - "(?i)non[\\s-]?compete"
        - "(?i)не\\s+(трудоустраиваться|работать).*конкурент"

