  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 6: Письменная форма, материальная ответственность, конфиденциальность
  # ──────────────────────────────────────────────────────────────────────────
  - id: form_liability_confidentiality_check
    name: "Письменная форма, материальная ответственность и конфиденциальность"
    description: >
      Фактографическая проверки письменной формы в двух экземплярах,
      материальной ответственности (ограниченная/полная) и условий
      о неразглашении коммерческой тайны/конфиденциальной информации.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "в двух экземплярах"
        - "экземпляр для работника"
        - "получение экземпляра подтверждается"
        - "подпись работника на экземпляре работодателя"
        - "материальная ответственность"
        - "полная материальная ответственность"
        - "договор о полной материальной ответственности"
        - "порядок возмещения ущерба"
        - "неразглашение"
        - "коммерческая тайна"
        - "конфиденциальная информация"
        - "служебная тайна"
        - "персональные данные"
        - "ответственность за разглашение"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)в\\s+двух\\s+экземпляр"
        - "(?i)материальн[а-яё]+\\s+ответственност"
        - "(?i)неразглашени"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по трудовому праву.
        Анализируется трудовой договор (ст. 67, 238–250, 57 ТК РФ; ФЗ-98).
        Проверяется только один вопрос: письменная форма, материальная
        ответственность и конфиденциальность.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        [ЗАДАЧА]
        Найди в тексте договора:
        1. Указание на два экземпляра договора.
        2. Указание на передачу экземпляра работнику.
        3. Подтверждение получения экземпляра.
        4. Тип материальной ответственности (ограниченная/полная).
        5. Указание на отдельный договор о полной МО.
        6. Порядок возмещения ущерба.
        7. Условие о неразглашении коммерческой тайны/конфиденциальной информации.
        8. Ответственность за разглашение.
        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если данные не указаны прямо — возвращай "not_defined".
        3. Если текстового значения нет — возвращай строго "Данные не определены".
        4. В evidence включай только текст договора.
        5. Верни только один JSON-объект.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1:
        Фрагмент:
        "Настоящий договор составлен в двух экземплярах, имеющих одинаковую
        юридическую силу, по одному для каждой из сторон. Экземпляр для работника
        получен, что подтверждается подписью работника на экземпляре работодателя.
        Работник несёт ограниченную материальную ответственность в пределах
        среднего месячного заработка. Работник обязуется не разглашать
        коммерческую тайну работодателя. За разглашение — ответственность
        в соответствии с законодательством РФ."
        Ответ:
        {
          "two_copies_status": "defined",
          "two_copies_value": "в двух экземплярах, по одному для каждой из сторон",
          "employee_copy_status": "defined",
          "employee_copy_value": "экземпляр для работника получен, подтверждается подписью",
          "liability_type_status": "defined",
          "liability_type_value": "ограниченная в пределах среднего месячного заработка",
          "separate_agreement_status": "not_defined",
          "damage_procedure_status": "not_defined",
          "confidentiality_status": "defined",
          "confidentiality_value": "обязуется не разглашать коммерческую тайну работодателя",
          "disclosure_liability_status": "defined",
          "disclosure_liability_value": "ответственность в соответствии с законодательством РФ",
          "evidence": [
            {
              "clause_ref": "п. 9.1",
              "quote": "Настоящий договор составлен в двух экземплярах, имеющих одинаковую юридическую силу, по одному для каждой из сторон."
            }
          ]
        }
        Пример 2:
        Фрагмент:
        "Работник выполняет свои обязанности в соответствии с договором."
        Ответ:
        {
          "two_copies_status": "not_defined",
          "two_copies_value": "Данные не определены",
          "employee_copy_status": "not_defined",
          "employee_copy_value": "Данные не определены",
          "liability_type_status": "not_defined",
          "liability_type_value": "Данные не определены",
          "separate_agreement_status": "not_defined",
          "damage_procedure_status": "not_defined",
          "confidentiality_status": "not_defined",
          "confidentiality_value": "Данные не определены",
          "disclosure_liability_status": "not_defined",
          "disclosure_liability_value": "Данные не определены",
          "evidence": []
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о двух экземплярах.
        2. Найди прямую цитату о материальной ответственности.
        3. Найди прямую цитату о конфиденциальности.
        4. Найди прямую цитату об ответственности за разглашение.
        5. Если прямой цитаты нет — верни "not_defined". Не додумывай.
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "two_copies_status": "<defined / not_defined>",
          "two_copies_value": "<текст или 'Данные не определены'>",
          "employee_copy_status": "<defined / not_defined>",
          "employee_copy_value": "<текст или 'Данные не определены'>",
          "liability_type_status": "<defined / not_defined>",
          "liability_type_value": "<текст или 'Данные не определены'>",
          "separate_agreement_status": "<defined / not_defined>",
          "damage_procedure_status": "<defined / not_defined>",
          "confidentiality_status": "<defined / not_defined>",
          "confidentiality_value": "<текст или 'Данные не определены'>",
          "disclosure_liability_status": "<defined / not_defined>",
          "disclosure_liability_value": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 7
      temperature: 0.0
      max_tokens: 750

    retrieval:
      retrieval_profile: "confidentiality_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "в двух экземплярах экземпляр для работника получение экземпляра подтверждается подпись работника на экземпляре работодателя материальная ответственность полная материальная ответственность договор о полной материальной ответственности порядок возмещения ущерба неразглашение коммерческая тайна конфиденциальная информация служебная тайна ответственность за разглашение"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - boilerplate
        - limitations
      negative_keywords:
        - "трудовая функция"
        - "место работы"
        - "оклад"
        - "заработная плата"
        - "отпуск"
        - "рабочее время"
        - "увольнение"
        - "расторжение"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.50, 0.95]
        boost: 0.15
        scope: segment
      context_k: 7
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "boilerplate"
        - "limitations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 1450

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по трудовому праву. Извлеки из трудового договора
        сведения о письменной форме, материальной ответственности и конфиденциальности.
        Не анализируй оплату труда, рабочее время, отпуск или расторжение.
        </role>
        <context>
        {context}
        </context>
        <task>
        Заполни строго следующие поля:
        1. two_copies_status — "defined" или "not_defined".
        2. two_copies_value — указание на два экземпляра.
        3. employee_copy_status — "defined" или "not_defined".
        4. employee_copy_value — передача экземпляра работнику.
        5. liability_type_status — "defined" или "not_defined".
        6. liability_type_value — тип материальной ответственности.
        7. separate_agreement_status — "defined" или "not_defined".
        8. damage_procedure_status — "defined" или "not_defined".
        9. confidentiality_status — "defined" или "not_defined".
        10. confidentiality_value — условие о конфиденциальности.
        11. disclosure_liability_status — "defined" или "not_defined".
        12. disclosure_liability_value — ответственность за разглашение.
        Если данные отсутствуют:
        - статус = "not_defined"
        - текст = "Данные не определены"
        </task>
        <rules>
        - Используй только текст договора.
        - liability_type_value: "ограниченная" если прямо указана ограниченная
        ответственность; "полная" если прямо указана полная ответственность
        или ссылка на отдельный договор о полной МО.
        - separate_agreement_status = "defined" если прямо указан отдельный договор
        о полной материальной ответственности.
        - Верни только JSON.
        </rules>
      fields:
        - name: "two_copies_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания на два экземпляра."
          required: true
        - name: "two_copies_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Два экземпляра"
          description: "Указание на два экземпляра договора."
          required: true
        - name: "employee_copy_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
