      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1600

      compact_output: false

      presence_signal:
        field: "form_liability_confidentiality_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по трудовому праву. Извлеки из трудового договора
        сведения о письменной форме, материальной ответственности
        и конфиденциальности. Не анализируй оплату труда, рабочее время,
        отпуск или расторжение.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 15 полей + evidence (всего 16 ключей):

        0. form_liability_confidentiality_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (two_copies_status, employee_copy_status, liability_type_status,
              separate_agreement_status, damage_procedure_status,
              confidentiality_status, disclosure_liability_status) ≠ "not_defined";
           - "missing" — если все семь содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - все семь *_status = "not_defined";
           - все *_value = "Данные не определены";
           - не выполняй остальные шаги.

        1. two_copies_status — "defined" или "not_defined".
        2. two_copies_value — указание на два экземпляра.
        3. employee_copy_status — "defined" или "not_defined".
        4. employee_copy_value — передача экземпляра работнику и подтверждение.
        5. liability_type_status — "defined" или "not_defined".
        6. liability_type_value — тип материальной ответственности.
        7. separate_agreement_status — "defined" или "not_defined".
        8. separate_agreement_value — указание на отдельный договор о полной МО.
        9. damage_procedure_status — "defined" или "not_defined".
        10. damage_procedure_value — порядок возмещения ущерба.
        11. confidentiality_status — "defined" или "not_defined".
        12. confidentiality_value — условие о конфиденциальности.
        13. disclosure_liability_status — "defined" или "not_defined".
        14. disclosure_liability_value — ответственность за разглашение.

        Если данные отсутствуют:
        - для *_status — "not_defined"
        - для *_value — "Данные не определены"
        </task>

        <context_rules>
        - Перед остальными полями заполни form_liability_confidentiality_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_value = "Данные не определены".
        - Используй только текст договора.
        - liability_type_value: "ограниченная" — если прямо указана ограниченная
          ответственность (в т.ч. "в пределах среднего месячного заработка");
          "полная" — если прямо указана полная ответственность;
          "согласно ТК РФ" — если формулировка общая ("в соответствии с ТК РФ",
          "в порядке, установленном законодательством"); иначе "Данные не определены".
        - separate_agreement_status = "defined" только если прямо указан отдельный
          договор о полной материальной ответственности.
        - Если порядок возмещения ущерба или условие о неразглашении определяется
          через отсылку к документу (Положение, Коллективный договор, отдельный NDA,
          Приложение) — фиксируй как "defined" со значением «согласно <документ>».
        - Если в разных фрагментах указаны разные данные и конфликт нельзя
          разрешить по тексту — статус → "not_defined", значение → "Не удалось определить".
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни двух экземпляров, ни материальной ответственности,
           ни условий о конфиденциальности.
           → presence = "missing";
             все семь *_status = "not_defined";
             все *_value = "Данные не определены".

        2. Частичное раскрытие темы.
           Указаны два экземпляра и ограниченная МО, но нет условий
           о конфиденциальности и ответственности за разглашение.
           → presence = "present";
             указанные *_status = "defined";
             неуказанные *_status = "not_defined";
             неуказанные *_value = "Данные не определены".

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные типы материальной
           ответственности (например, полная и ограниченная).
           → presence = "unclear";
             liability_type_status = "not_defined";
             liability_type_value = "Не удалось определить".

        4. Отсылка на Положение о КТ / отдельный NDA / Коллективный договор.
           Условия о конфиденциальности или порядок возмещения ущерба
           определяются отдельным документом.
           → presence = "present";
             соответствующий *_status = "defined";
             соответствующее *_value содержит формулировку вида
             «согласно Положению о коммерческой тайне».
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для form_liability_confidentiality_check_presence используй только: "present", "missing", "unclear".
        - Для всех *_status используй только: "defined" или "not_defined".
        - Fallback при отсутствии данных:
          * все *_value → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_value → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "form_liability_confidentiality_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие условий о письменной форме, материальной ответственности и конфиденциальности. Внутреннее агрегатное signal-поле."
          required: true

        - name: "two_copies_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания на два экземпляра. Внутреннее enum-поле."
          required: true

        - name: "two_copies_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Два экземпляра"
          description: >
            Указание на два экземпляра договора. Fallback: "Не установлено" / "Не удалось определить".
          required: true

        - name: "employee_copy_status"
          type: "string"
          presentation: "signal"
          risk_weight: "low"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус передачи экземпляра работнику. Внутреннее enum-поле."
          required: true

        - name: "employee_copy_value"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Экземпляр работника"
          description: >
            Передача экземпляра работнику и подтверждение. Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "liability_type_status"
          type: "string"
