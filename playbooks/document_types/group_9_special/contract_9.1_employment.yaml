        - "(?i)санитарно[\\s-]бытов"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по трудовому праву.
        Анализируется трудовой договор.
        Проверяется только один вопрос: охрана труда, вредные условия, СОУТ,
        обязательные медосмотры, оценка профессиональных рисков, санитарно-бытовое
        обслуживание, социальное страхование, пенсионное страхование и персональные данные.
        Нормативный ориентир:
        - ст. 57 ТК РФ — обязательные условия договора (условия труда на рабочем месте)
        - ст. 92 ТК РФ — сокращённая продолжительность рабочего времени
        - ст. 117 ТК РФ — ежегодный дополнительный оплачиваемый отпуск
        - ст. 147 ТК РФ — оплата труда работников с вредными/опасными условиями
        - ст. 212, 214, 216, 219 ТК РФ — обязанности работодателя по охране труда
        - ст. 213 ТК РФ — обязательные медицинские осмотры, психиатрическое освидетельствование
        - ст. 223 ТК РФ — санитарно-бытовое обслуживание работников
        - ФЗ от 28.12.2013 № 426-ФЗ — специальная оценка условий труда
        - ФЗ от 16.07.1999 № 165-ФЗ — обязательное социальное страхование
        - ФЗ от 15.12.2001 № 167-ФЗ — обязательное пенсионное страхование
        - ФЗ от 27.07.2006 № 152-ФЗ — персональные данные
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Не выводи класс условий труда из закона — только из текста договора.
        [ЗАДАЧА]
        Найди в тексте договора:
        1. Условия труда на рабочем месте по результатам СОУТ (класс условий труда).
        2. Гарантии за вредные/опасные условия (сокращённый день, допотпуск, доплата, молоко, СИЗ).
        3. Обязательства работодателя по охране труда.
        4. Обязательные медицинские осмотры / психиатрическое освидетельствование.
        5. Оценку профессиональных рисков.
        6. Санитарно-бытовое обслуживание работников.
        7. Условие об обязательном социальном страховании.
        8. Условие об обязательном пенсионном страховании.
        9. Условие об обработке персональных данных.
        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона вместо текста.
        2. Для *_status используй строго "defined" или "not_defined".
        3. Для *_value при отсутствии данных — строго "Данные не определены".
        4. Не выводи класс условий труда из закона — только из текста договора.
        5. Если СОУТ прямо не проводилась или не упомянута — различай:
        - "СОУТ не проводилась" — sout_class_status = "defined", sout_class_value = "СОУТ не проводилась";
        - отсутствие упоминания о СОУТ — sout_class_status = "not_defined".
        6. Если условия труда, охрана труда, медосмотры, оценка профрисков,
        санбыт, соцстрах или ПДн определяются через отсылку к документу
        (Положение об охране труда, Политика обработки ПДн, отдельное Согласие,
        Коллективный договор, Приложение) — фиксируй как "defined"
        со значением «согласно <документ>».
        7. Если прямо указано, что дополнительные гарантии за вредные условия
        не устанавливаются — harmful_guarantees_status = "defined",
        harmful_guarantees_value = "не устанавливаются".
        8. medical_exams_* фиксирует обязательные медицинские осмотры (ст. 213 ТК РФ)
        и психиатрическое освидетельствование. Если порядок — отсылка к ЛНА,
        фиксируй как "defined" со значением «согласно <документ>».
        9. professional_risk_assessment_* фиксирует оценку профессиональных рисков
        (ст. 214 ТК РФ).
        10. sanitary_services_* фиксирует санитарно-бытовое обслуживание (ст. 223 ТК РФ).
        11. В evidence включай только текст договора.
        12. Никогда не используй "None", "null", пустые строки или отсутствующие ключи.
        13. Верни РОВНО один валидный JSON-объект со всеми 19 ключами (18 полей + evidence),
        пригодный для парсинга через json.loads без предварительной обработки.
        Без markdown, без ```json, без комментариев, без текста до или после.
        Начни ответ сразу с { и закончи }.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — допустимые условия, полная структура:
        Фрагмент:
