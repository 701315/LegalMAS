  - id: segregation_of_duties_check
    name: "Разделение обязанностей и конфликтующие функции"
    description: >
      Фактографическая проверка условий о разделении обязанностей
      (segregation of duties, SoD): запрет на совмещение несовместимых ролей
      (инициирование / одобрение / исполнение / контроль), ограничения
      для отдельных должностей, компенсирующие контроли. Критично
      для внутреннего контроля: отсутствие SoD делает систему контроля
      неэффективной (ст. 19 ФЗ-402 «О бухгалтерском учёте»;
      Методические рекомендации Банка России № 36-МР; ФЗ-115).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "разделение обязанностей"
        - "разделение полномочий"
        - "segregation of duties"
        - "SoD"
        - "конфликт функций"
        - "несовместимые функции"
        - "инициирование и одобрение"
        - "не вправе совмещать"
        - "не вправе одновременно"
        - "внутренний контроль"
        - "компенсирующие контроли"
        - "независимый контроль"
        - "главный бухгалтер"
        - "финансовый директор"
        - "казначейство"
        - "подотчётное лицо"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)разделение\\s+(обязанностей|полномочий|функций)"
        - "(?i)segregation\\s+of\\s+duties"
        - "(?i)(несовместим[а-яё]+|конфликтующ[а-яё]+)\\s+функци"
        - "(?i)не\\s+вправе\\s+(совмещать|одновременно)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по трудовому праву и внутреннему контролю.
        Анализируется трудовой договор (ст. 57 ТК РФ; ст. 7, 19 ФЗ-402
        «О бухгалтерском учёте»; ФЗ-115 ст. 7; Методические рекомендации
        Банка России от 06.11.2015 № 36-МР; Положение Банка России
        от 16.12.2014 № 242-П).
        Проверяется только один вопрос: разделение обязанностей
        и запрет совмещения несовместимых ролей.
        Нормативный ориентир:
        - ст. 19 ФЗ-402 — внутренний контроль совершаемых фактов
        хозяйственной жизни (обязанность работодателя).
        - ст. 7 ФЗ-115 — правила внутреннего контроля (ПВК) в организациях,
        осуществляющих операции с денежными средствами.
        - Методические рекомендации Банка России № 36-МР — организация
        внутреннего контроля, включая SoD.
        - Положение Банка России № 242-П — организация внутреннего контроля
        в кредитных организациях.
        - Базовый принцип SoD: одна и та же роль не должна одновременно
        инициировать, одобрять, исполнять и контролировать операцию.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска, не подставляй нормы закона вместо текста.
        - Для внутреннего контроля критично: без SoD возможно мошенничество
        и неконтролируемые операции.
        - Различай:
          1) Общее правило о разделении обязанностей (SoD);
          2) Запрет на конкретные комбинации ролей (инициирование + одобрение,
             кастодиан + учёт);
          3) Компенсирующие контроли (при малых командах, где SoD невозможен);
          4) Независимый контроль (внутренний аудит, комплаенс).
        [ЗАДАЧА]
        Найди в тексте договора:
        1. Общее правило о разделении обязанностей (SoD).
        2. Запрет на совмещение несовместимых ролей.
        3. Указание на компенсирующие контроли.
        4. Указание на независимый контроль (внутренний аудит).
        5. Ответственность за нарушение принципа SoD.
        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона вместо текста.
        2. Для *_status используй строго "defined" или "not_defined".
        3. Для *_value при отсутствии данных — строго "Данные не определены".
        4. sod_principle_* фиксирует общее правило о разделении обязанностей.
        5. sod_conflicts_* фиксирует запрет на совмещение несовместимых ролей.
        6. compensating_controls_* фиксирует компенсирующие контроли.
        7. independent_control_* фиксирует независимый контроль / внутренний аудит.
        8. sod_liability_* фиксирует ответственность за нарушение SoD.
        9. Если условие определяется через отсылку к документу (ПВК, Политика
        по внутреннему контролю, Матрица полномочий) — фиксируй как "defined"
        со значением «согласно <документ>».
        10. В evidence включай только текст договора.
        11. Никогда не используй "None", "null", пустые строки или отсутствующие ключи.
        12. Верни РОВНО один валидный JSON-объект со всеми 11 ключами (10 полей + evidence),
        пригодный для парсинга через json.loads без предварительной обработки.
        Без markdown, без ```json, без комментариев, без текста до или после.
        Начни ответ сразу с { и закончи }.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — полная структура SoD:
        Фрагмент:
        "Работник не вправе одновременно инициировать и одобрять
        хозяйственные операции, а также совмещать функции распоряжения
        денежными средствами и их учёта. Работодатель обеспечивает
        разделение обязанностей между сотрудниками в соответствии
        с Положением о внутреннем контроле. При невозможности полного
        разделения обязанностей (в силу малой численности) применяются
        компенсирующие контроли — дополнительная проверка операций
        руководителем. Независимый контроль осуществляется службой
        внутреннего аудита."
        Ответ:
        {
          "sod_principle_status": "defined",
          "sod_principle_value": "разделение обязанностей между сотрудниками в соответствии с Положением о внутреннем контроле",
          "sod_conflicts_status": "defined",
          "sod_conflicts_value": "запрет совмещать инициирование и одобрение операций; запрет совмещать распоряжение средствами и их учёт",
          "compensating_controls_status": "defined",
          "compensating_controls_value": "дополнительная проверка операций руководителем при малой численности",
          "independent_control_status": "defined",
          "independent_control_value": "независимый контроль осуществляется службой внутреннего аудита",
          "sod_liability_status": "not_defined",
          "sod_liability_value": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 14.1",
              "quote": "Работник не вправе одновременно инициировать и одобрять хозяйственные операции, а также совмещать функции распоряжения денежными средствами и их учёта."
            }
          ]
        }
        Пример 2 — только общее правило:
        Фрагмент:
        "Работник обязуется соблюдать принцип разделения обязанностей,
        установленный внутренними документами работодателя."
        Ответ:
        {
          "sod_principle_status": "defined",
          "sod_principle_value": "принцип разделения обязанностей согласно внутренним документам работодателя",
          "sod_conflicts_status": "not_defined",
          "sod_conflicts_value": "Данные не определены",
          "compensating_controls_status": "not_defined",
          "compensating_controls_value": "Данные не определены",
          "independent_control_status": "not_defined",
          "independent_control_value": "Данные не определены",
          "sod_liability_status": "not_defined",
          "sod_liability_value": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 14.2",
              "quote": "Работник обязуется соблюдать принцип разделения обязанностей, установленный внутренними документами работодателя."
            }
          ]
        }
        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Работник выполняет свои обязанности в соответствии с договором."
        Ответ:
        {
          "sod_principle_status": "not_defined",
          "sod_principle_value": "Данные не определены",
          "sod_conflicts_status": "not_defined",
          "sod_conflicts_value": "Данные не определены",
          "compensating_controls_status": "not_defined",
          "compensating_controls_value": "Данные не определены",
          "independent_control_status": "not_defined",
          "independent_control_value": "Данные не определены",
          "sod_liability_status": "not_defined",
          "sod_liability_value": "Данные не определены",
          "evidence": []
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Проверь, что все 11 ключей (10 полей + evidence) присутствуют в JSON.
        2. Проверь, что каждый *_status ∈ {"defined", "not_defined"}, а каждый *_value
        при отсутствии данных = "Данные не определены".
        3. Проверь, что для каждого defined-поля в evidence есть прямая цитата из договора.
        4. Убедись, что общий принцип SoD и конкретные запреты на совмещение
        ролей разнесены по разным полям.
        5. Убедись, что компенсирующие контроли отражены отдельно.
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "sod_principle_status": "<defined / not_defined>",
          "sod_principle_value": "<текст / 'согласно <документ>' / 'Данные не определены'>",
          "sod_conflicts_status": "<defined / not_defined>",
          "sod_conflicts_value": "<текст / 'согласно <документ>' / 'Данные не определены'>",
          "compensating_controls_status": "<defined / not_defined>",
          "compensating_controls_value": "<текст / 'Данные не определены'>",
          "independent_control_status": "<defined / not_defined>",
          "independent_control_value": "<текст / 'согласно <документ>' / 'Данные не определены'>",
          "sod_liability_status": "<defined / not_defined>",
          "sod_liability_value": "<текст / 'не предусмотрена' / 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 7
      temperature: 0.0
      max_tokens: 1000

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "разделение обязанностей разделение полномочий segregation of duties SoD конфликт функций несовместимые функции инициирование и одобрение не вправе совмещать внутренний контроль компенсирующие контроли независимый контроль главный бухгалтер финансовый директор казначейство"
      preferred_unit_types:
        - obligation
        - general_provision
        - definition
      excluded_unit_types:
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - limitations
        - procedures
        - boilerplate
      boost_keywords:
        - "разделение обязанностей"
        - "SoD"
        - "несовместимые функции"
        - "внутренний контроль"
        - "компенсирующие контроли"
      negative_keywords:
        - "трудовая функция"
        - "оклад"
        - "рабочее время"
        - "отпуск"
        - "конфиденциальность"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.40, 0.90]
        boost: 0.30
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "limitations"
        - "procedures"
        - "boilerplate"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1200

      compact_output: false

      presence_signal:
        field: "segregation_of_duties_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по трудовому праву и внутреннему контролю.
        Извлеки из трудового договора сведения о разделении обязанностей
        и запрете совмещения несовместимых ролей.
        Не анализируй оплату труда, режим работы или расторжение.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 10 полей + evidence (всего 11 ключей):

        0. segregation_of_duties_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (sod_principle_status, sod_conflicts_status,
              compensating_controls_status, independent_control_status,
              sod_liability_status) ≠ "not_defined";
           - "missing" — если все пять содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - все пять *_status = "not_defined";
           - все *_value = "Данные не определены";
           - не выполняй остальные шаги.

        1. sod_principle_status — "defined" или "not_defined".
        2. sod_principle_value — общее правило SoD.
        3. sod_conflicts_status — "defined" или "not_defined".
        4. sod_conflicts_value — запрет на совмещение несовместимых ролей.
        5. compensating_controls_status — "defined" или "not_defined".
        6. compensating_controls_value — компенсирующие контроли.
        7. independent_control_status — "defined" или "not_defined".
        8. independent_control_value — независимый контроль / внутренний аудит.
        9. sod_liability_status — "defined" или "not_defined".
        10. sod_liability_value — ответственность за нарушение SoD.

        Если данные отсутствуют:
        - для *_status — "not_defined"
        - для *_value — "Данные не определены"
        </task>

        <context_rules>
        - Перед остальными полями заполни segregation_of_duties_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_value = "Данные не определены".
        - Используй только текст договора.
        - Различай общий принцип SoD и конкретные запреты на совмещение
          ролей (инициирование + одобрение, распоряжение + учёт) —
          это разные уровни.
        - Компенсирующие контроли — важны для малых команд, где полное
          разделение обязанностей невозможно.
        - Если условие определяется через отсылку к документу (ПВК, Политика
          по внутреннему контролю, Матрица полномочий) — фиксируй как
          "defined" со значением «согласно <документ>».
        - Если в разных фрагментах указаны разные данные и конфликт нельзя
          разрешить по тексту — статус → "not_defined", значение → "Не удалось определить".
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни принципа SoD, ни запретов на совмещение,
           ни компенсирующих контролей, ни независимого контроля.
           → presence = "missing";
             все пять *_status = "not_defined";
             все *_value = "Данные не определены".

        2. Только общий принцип без деталей.
           Есть указание на принцип разделения обязанностей,
           но без конкретных запретов и компенсирующих контролей.
           → presence = "present";
             sod_principle_status = "defined";
             sod_conflicts_status = "not_defined";
             compensating_controls_status = "not_defined";
             соответствующие *_value = "Данные не определены".

        3. Противоречие между фрагментами.
           В разных частях договора один и тот же сотрудник
           уполномочен на несовместимые функции.
           → presence = "unclear";
             sod_conflicts_status = "not_defined";
             sod_conflicts_value = "Не удалось определить".

        4. Отсылка на ПВК / Политику по внутреннему контролю.
           Принципы SoD определяются отдельным документом.
           → presence = "present";
             sod_principle_status = "defined";
             sod_principle_value содержит формулировку вида
             «согласно Положению о внутреннем контроле».
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для segregation_of_duties_check_presence используй только: "present", "missing", "unclear".
        - Для всех *_status используй только: "defined" или "not_defined".
        - Fallback при отсутствии данных:
          * все *_value → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_value → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "segregation_of_duties_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие условий о разделении обязанностей. Внутреннее агрегатное signal-поле."
          required: true

        - name: "sod_principle_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания общего принципа SoD. Внутреннее enum-поле."
          required: true

        - name: "sod_principle_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Принцип SoD"
          description: >
            Общее правило о разделении обязанностей. Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "sod_conflicts_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус запрета на совмещение несовместимых ролей. Внутреннее enum-поле."
          required: true

        - name: "sod_conflicts_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Несовместимые роли"
          description: >
            Запрет на совмещение несовместимых ролей. Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "compensating_controls_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус компенсирующих контролей. Внутреннее enum-поле."
          required: true

        - name: "compensating_controls_value"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Компенсирующие контроли"
          description: >
            Компенсирующие контроли при невозможности полного SoD. Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "independent_control_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус независимого контроля / внутреннего аудита. Внутреннее enum-поле."
          required: true

        - name: "independent_control_value"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Независимый контроль"
          description: >
            Независимый контроль / внутренний аудит. Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "sod_liability_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус ответственности за нарушение SoD. Внутреннее enum-поле."
          required: true

        - name: "sod_liability_value"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Ответственность за SoD"
          description: >
            Ответственность за нарушение принципа SoD. Fallback: "Не установлено" / "Не удалось определить".
          required: false

      store_payload: true

  - id: second_job_approval_check
    name: "Согласование внешней занятости и участия в других организациях"
    description: >
      Фактографическая проверка условий о внешней занятости работника:
      согласование второй работы, запрет на участие в органах управления
      других организаций, ограничения на доли в уставном капитале
      контрагентов и конкурентов, участие в НКО и политических организациях.
      Критично для внутреннего контроля: неконтролируемая внешняя занятость
      создаёт конфликт интересов и риск утечки информации
      (ст. 57, 275 ТК РФ; ст. 9 ФЗ-135; ФЗ-273).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "внешняя занятость"
        - "вторая работа"
        - "совместительство в других организациях"
        - "согласование внешней работы"
        - "разрешение на работу по совместительству"
        - "участие в органах управления"
        - "член совета директоров"
        - "член правления"
        - "участие в уставном капитале"
        - "доля в других организациях"
        - "некоммерческая организация"
        - "политическая партия"
        - "конкурент"
        - "контрагент"
        - "предварительное одобрение"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)внешн[а-яё]+\\s+занятост"
        - "(?i)(втор[а-яё]+|дополнительн[а-яё]+)\\s+работ"
        - "(?i)согласовани[ея]\\s+(внешней|работы|участи)"
        - "(?i)(член[а-яё]*\\s+(совет|правлени)|участи[ея]\\s+в\\s+органах)"
        - "(?i)участи[ея]\\s+в\\s+(уставн|капитал|друг[а-яё]+\\s+организаци)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по трудовому праву и compliance.
        Анализируется трудовой договор (ст. 57, 275 ТК РФ; ст. 9 ФЗ-135
        «О защите конкуренции»; ст. 4 Закона РСФСР №948-1; ФЗ-273
        «О противодействии коррупции»).
        Проверяется только один вопрос: согласование внешней занятости
        и участия в других организациях.
        Нормативный ориентир:
        - ст. 57 ТК РФ — дополнительные условия трудового договора.
        - ст. 275 ТК РФ — дополнительные требования к руководителю
        организации (включая запрет на участие в других организациях
        без согласия).
        - ст. 9 ФЗ-135 — группа лиц, аффилированные лица.
        - ст. 4 Закона РСФСР №948-1 — понятие аффилированных лиц.
        - ФЗ-273 — противодействие коррупции, конфликт интересов.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска, не подставляй нормы закона вместо текста.
        - Для внутреннего контроля критично: неконтролируемая внешняя
        занятость создаёт конфликт интересов.
        - Различай:
          1) Согласование второй работы (совместительство в других
             организациях);
          2) Запрет на участие в органах управления (совет директоров,
             правление) других организаций;
          3) Ограничения на доли в уставном капитале контрагентов
             и конкурентов;
          4) Ограничения на участие в НКО и политических организациях.
        [ЗАДАЧА]
        Найди в тексте договора:
        1. Требование согласования внешней занятости / второй работы.
        2. Запрет на участие в органах управления других организаций.
        3. Ограничения на доли в уставном капитале.
        4. Ограничения на участие в НКО, политических организациях.
        5. Процедура получения согласования (у кого, как, сроки).
        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона вместо текста.
        2. Для *_status используй строго "defined" или "not_defined".
        3. Для *_value при отсутствии данных — строго "Данные не определены".
        4. second_job_approval_* фиксирует требование согласования
        внешней занятости.
        5. board_membership_* фиксирует запрет на участие в органах
        управления других организаций.
        6. equity_restrictions_* фиксирует ограничения на доли в уставном
        капитале.
        7. ngo_political_restrictions_* фиксирует ограничения на участие
        в НКО и политических организациях.
        8. approval_procedure_* фиксирует процедуру получения согласования.
        9. Если условие определяется через отсылку к документу (Политика
        по конфликту интересов, Приложение) — фиксируй как "defined"
        со значением «согласно <документ>».
        10. В evidence включай только текст договора.
        11. Никогда не используй "None", "null", пустые строки или отсутствующие ключи.
        12. Верни РОВНО один валидный JSON-объект со всеми 11 ключами (10 полей + evidence),
        пригодный для парсинга через json.loads без предварительной обработки.
        Без markdown, без ```json, без комментариев, без текста до или после.
        Начни ответ сразу с { и закончи }.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — полная структура:
        Фрагмент:
        "Работник вправе работать по совместительству у других
        работодателей только с предварительного письменного согласия
        работодателя. Работник не вправе участвовать в органах управления
        (совет директоров, правление) организаций-конкурентов, а также
        приобретать доли в уставном капитале таких организаций.
        Работник не вправе участвовать в политических организациях
        без предварительного согласования. Согласование оформляется
        через Департамент комплаенс."
        Ответ:
        {
          "second_job_approval_status": "defined",
          "second_job_approval_value": "работа по совместительству у других работодателей только с предварительного письменного согласия",
          "board_membership_status": "defined",
          "board_membership_value": "запрет на участие в органах управления (совет директоров, правление) организаций-конкурентов",
          "equity_restrictions_status": "defined",
          "equity_restrictions_value": "запрет на приобретение долей в уставном капитале организаций-конкурентов",
          "ngo_political_restrictions_status": "defined",
          "ngo_political_restrictions_value": "запрет на участие в политических организациях без предварительного согласования",
          "approval_procedure_status": "defined",
          "approval_procedure_value": "согласование через Департамент комплаенс",
          "evidence": [
            {
              "clause_ref": "п. 15.1",
              "quote": "Работник вправе работать по совместительству у других работодателей только с предварительного письменного согласия работодателя."
            }
          ]
        }
        Пример 2 — только согласование второй работы:
        Фрагмент:
        "Работник обязуется согласовывать с работодателем работу
        по совместительству у других работодателей."
        Ответ:
        {
          "second_job_approval_status": "defined",
          "second_job_approval_value": "согласование работы по совместительству у других работодателей",
          "board_membership_status": "not_defined",
          "board_membership_value": "Данные не определены",
          "equity_restrictions_status": "not_defined",
          "equity_restrictions_value": "Данные не определены",
          "ngo_political_restrictions_status": "not_defined",
          "ngo_political_restrictions_value": "Данные не определены",
          "approval_procedure_status": "not_defined",
          "approval_procedure_value": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 15.2",
              "quote": "Работник обязуется согласовывать с работодателем работу по совместительству у других работодателей."
            }
          ]
        }
        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Работник выполняет свои обязанности в соответствии с договором."
        Ответ:
        {
          "second_job_approval_status": "not_defined",
          "second_job_approval_value": "Данные не определены",
          "board_membership_status": "not_defined",
          "board_membership_value": "Данные не определены",
          "equity_restrictions_status": "not_defined",
          "equity_restrictions_value": "Данные не определены",
          "ngo_political_restrictions_status": "not_defined",
          "ngo_political_restrictions_value": "Данные не определены",
          "approval_procedure_status": "not_defined",
          "approval_procedure_value": "Данные не определены",
          "evidence": []
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Проверь, что все 11 ключей (10 полей + evidence) присутствуют в JSON.
        2. Проверь, что каждый *_status ∈ {"defined", "not_defined"}, а каждый *_value
        при отсутствии данных = "Данные не определены".
        3. Проверь, что для каждого defined-поля в evidence есть прямая цитата из договора.
        4. Убедись, что согласование второй работы не спутано с запретом
        на участие в органах управления — это разные ограничения.
        5. Убедись, что процедура согласования отражена отдельно.
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "second_job_approval_status": "<defined / not_defined>",
          "second_job_approval_value": "<текст / 'согласно <документ>' / 'Данные не определены'>",
          "board_membership_status": "<defined / not_defined>",
          "board_membership_value": "<текст / 'не предусмотрено' / 'Данные не определены'>",
          "equity_restrictions_status": "<defined / not_defined>",
          "equity_restrictions_value": "<текст / 'не предусмотрено' / 'Данные не определены'>",
          "ngo_political_restrictions_status": "<defined / not_defined>",
          "ngo_political_restrictions_value": "<текст / 'не предусмотрено' / 'Данные не определены'>",
          "approval_procedure_status": "<defined / not_defined>",
          "approval_procedure_value": "<текст / 'согласно <документ>' / 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 7
      temperature: 0.0
      max_tokens: 1000

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "внешняя занятость вторая работа совместительство в других организациях согласование внешней работы разрешение на работу по совместительству участие в органах управления член совета директоров член правления участие в уставном капитале доля в других организациях некоммерческая организация политическая партия конкурент контрагент предварительное одобрение"
      preferred_unit_types:
        - obligation
        - general_provision
        - definition
      excluded_unit_types:
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - limitations
        - boilerplate
        - procedures
      boost_keywords:
        - "внешняя занятость"
        - "вторая работа"
        - "согласование"
        - "участие в органах управления"
        - "конкурент"
      negative_keywords:
        - "трудовая функция"
        - "оклад"
        - "рабочее время"
        - "отпуск"
        - "конфиденциальность"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.40, 0.90]
        boost: 0.30
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "limitations"
        - "boilerplate"
        - "procedures"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1200

      compact_output: false

      presence_signal:
        field: "second_job_approval_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по трудовому праву и compliance. Извлеки
        из трудового договора сведения о согласовании внешней занятости
        и участия в других организациях.
        Не анализируй оплату труда, режим работы или расторжение.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 10 полей + evidence (всего 11 ключей):

        0. second_job_approval_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (second_job_approval_status, board_membership_status,
              equity_restrictions_status, ngo_political_restrictions_status,
              approval_procedure_status) ≠ "not_defined";
           - "missing" — если все пять содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - все пять *_status = "not_defined";
           - все *_value = "Данные не определены";
           - не выполняй остальные шаги.

        1. second_job_approval_status — "defined" или "not_defined".
        2. second_job_approval_value — согласование внешней занятости.
        3. board_membership_status — "defined" или "not_defined".
        4. board_membership_value — запрет на участие в органах управления.
        5. equity_restrictions_status — "defined" или "not_defined".
        6. equity_restrictions_value — ограничения на доли в уставном
           капитале.
        7. ngo_political_restrictions_status — "defined" или "not_defined".
        8. ngo_political_restrictions_value — ограничения на участие в НКО
           и политических организациях.
        9. approval_procedure_status — "defined" или "not_defined".
        10. approval_procedure_value — процедура получения согласования.

        Если данные отсутствуют:
        - для *_status — "not_defined"
        - для *_value — "Данные не определены"
        </task>

        <context_rules>
        - Перед остальными полями заполни second_job_approval_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_value = "Данные не определены".
        - Используй только текст договора.
        - Различай согласование второй работы и запрет на участие в органах
          управления — это разные ограничения.
        - Если условие определяется через отсылку к документу (Политика
          по конфликту интересов, Приложение) — фиксируй как "defined"
          со значением «согласно <документ>».
        - Если в разных фрагментах указаны разные данные и конфликт нельзя
          разрешить по тексту — статус → "not_defined", значение → "Не удалось определить".
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни согласования внешней занятости,
           ни запретов на участие в органах управления,
           ни ограничений на доли.
           → presence = "missing";
             все пять *_status = "not_defined";
             все *_value = "Данные не определены".

        2. Только согласование второй работы.
           Есть требование согласования работы по совместительству,
           но нет ограничений на участие в органах управления
           и доли в капитале.
           → presence = "present";
             second_job_approval_status = "defined";
             board_membership_status = "not_defined";
             equity_restrictions_status = "not_defined";
             соответствующие *_value = "Данные не определены".

        3. Противоречие между фрагментами.
           В разных частях договора указаны противоречащие условия
           о согласовании внешней занятости.
           → presence = "unclear";
             second_job_approval_status = "not_defined";
             second_job_approval_value = "Не удалось определить".

        4. Отсылка на Политику по конфликту интересов.
           Порядок согласования внешней занятости определяется
           отдельным документом.
           → presence = "present";
             approval_procedure_status = "defined";
             approval_procedure_value содержит формулировку вида
             «согласно Политике по конфликту интересов».
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для second_job_approval_check_presence используй только: "present", "missing", "unclear".
        - Для всех *_status используй только: "defined" или "not_defined".
        - Fallback при отсутствии данных:
          * все *_value → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_value → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "second_job_approval_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие условий о согласовании внешней занятости. Внутреннее агрегатное signal-поле."
          required: true

        - name: "second_job_approval_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус требования согласования внешней занятости. Внутреннее enum-поле."
          required: true

        - name: "second_job_approval_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Согласование внешней занятости"
          description: >
            Требование согласования внешней занятости. Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "board_membership_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус запрета на участие в органах управления. Внутреннее enum-поле."
          required: true

        - name: "board_membership_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Участие в органах управления"
          description: >
            Запрет на участие в органах управления других организаций. Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "equity_restrictions_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус ограничений на доли в уставном капитале. Внутреннее enum-поле."
          required: true

        - name: "equity_restrictions_value"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Доли в уставном капитале"
          description: >
            Ограничения на доли в уставном капитале других организаций. Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "ngo_political_restrictions_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус ограничений на участие в НКО / политических организациях. Внутреннее enum-поле."
          required: true

        - name: "ngo_political_restrictions_value"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Ограничения на НКО / политику"
          description: >
            Ограничения на участие в НКО и политических организациях. Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "approval_procedure_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус процедуры получения согласования. Внутреннее enum-поле."
          required: true

        - name: "approval_procedure_value"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Процедура согласования"
          description: >
            Процедура получения согласования внешней занятости. Fallback: "Не установлено" / "Не удалось определить".
          required: false

      store_payload: true

  - id: pending_disputes_history_check
    name: "Заверения об отсутствии споров, судимости и дисквалификации"
    description: >
      Фактографическая проверка заверений работника об отсутствии текущих
      или прошлых трудовых споров, судимости, административных наказаний,
      дисквалификации, а также заверений о достоверности предоставленных
      сведений. Критично для M&A: наличие скрытых споров и судимостей
      у ключевых сотрудников — существенный риск для покупателя
      (ст. 57, 65, 81, 275 ТК РФ; ст. 431.2 ГК РФ; ст. 3.11, 32.11 КоАП РФ;
      УК РФ; ФЗ-273).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "заверения об обстоятельствах"
        - "заверение"
        - "отсутствие судимости"
        - "не судим"
        - "уголовное преследование"
        - "административное наказание"
        - "дисквалификация"
        - "лишение специального права"
        - "текущие споры"
        - "трудовые споры"
        - "достоверность сведений"
        - "предоставленные документы"
        - "ложные сведения"
        - "ответственность за недостоверные сведения"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)заверени[еяй]\\s+об?\\s+обстоятельств"
        - "(?i)отсутстви[ея]\\s+судимост"
        - "(?i)(уголовн[а-яё]+\\s+преследовани|административн[а-яё]+\\s+наказани)"
        - "(?i)дисквалификаци|лишени[ея]\\s+специальн[а-яё]+\\s+прав"
        - "(?i)(достоверност[ьи]|ложн[а-яё]+)\\s+сведени"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по трудовому праву и M&A.
        Анализируется трудовой договор (ст. 57, 65, 81, 275 ТК РФ;
        ст. 431.2 ГК РФ; ст. 3.11, 32.11 КоАП РФ; УК РФ; ФЗ-273).
        Проверяется только один вопрос: заверения об отсутствии споров,
        судимости и дисквалификации.
        Нормативный ориентир:
        - ст. 431.2 ГК РФ — заверения об обстоятельствах (ответственность
        за недостоверные заверения).
        - ст. 65 ТК РФ — документы при приёме на работу (включая справку
        о судимости для отдельных категорий).
        - ст. 81 ТК РФ — основания расторжения (включая п. 11 —
        предоставление ложных документов).
        - ст. 275 ТК РФ — дополнительные требования к руководителю.
        - ст. 3.11 КоАП РФ — дисквалификация как административное наказание.
        - ст. 32.11 КоАП РФ — исполнение постановления о дисквалификации.
        - ФЗ-273 — противодействие коррупции, проверка сведений.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска, не подставляй нормы закона вместо текста.
        - Для M&A критично: скрытые споры и судимости ключевых сотрудников
        могут быть существенным риском для покупателя.
        - Различай:
          1) Заверение об отсутствии текущих трудовых споров;
          2) Заверение об отсутствии судимости / уголовного преследования;
          3) Заверение об отсутствии административных наказаний
             (дисквалификация, лишение специального права);
          4) Заверение о достоверности предоставленных сведений;
          5) Ответственность за недостоверные заверения.
        [ЗАДАЧА]
        Найди в тексте договора:
        1. Заверение об отсутствии текущих трудовых споров.
        2. Заверение об отсутствии судимости / уголовного преследования.
        3. Заверение об отсутствии дисквалификации / административных
           наказаний.
        4. Заверение о достоверности предоставленных сведений.
        5. Ответственность за недостоверные заверения.
        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона вместо текста.
        2. Для *_status используй строго "defined" или "not_defined".
        3. Для *_value при отсутствии данных — строго "Данные не определены".
        4. disputes_representation_* фиксирует заверение об отсутствии
        текущих трудовых споров.
        5. criminal_record_* фиксирует заверение об отсутствии судимости /
        уголовного преследования.
        6. disqualification_* фиксирует заверение об отсутствии дисквалификации
        и административных наказаний.
        7. accuracy_representation_* фиксирует заверение о достоверности
        сведений.
        8. misrepresentation_liability_* фиксирует ответственность
        за недостоверные заверения.
        9. Если условие определяется через отсылку к документу
        (Отдельное соглашение, Приложение, Согласие) — фиксируй
        как "defined" со значением «согласно <документ>».
        10. В evidence включай только текст договора.
        11. Никогда не используй "None", "null", пустые строки или отсутствующие ключи.
        12. Верни РОВНО один валидный JSON-объект со всеми 11 ключами (10 полей + evidence),
        пригодный для парсинга через json.loads без предварительной обработки.
        Без markdown, без ```json, без комментариев, без текста до или после.
        Начни ответ сразу с { и закончи }.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — полная структура:
        Фрагмент:
        "Работник заверяет работодателя, что на дату заключения
        договора у него отсутствуют текущие трудовые споры
        с предыдущими работодателями, отсутствует неснятая или непогашенная
        судимость, а также отсутствуют административные наказания
        в виде дисквалификации или лишения специального права.
        Работник подтверждает достоверность всех предоставленных
        сведений и документов. Предоставление недостоверных сведений
        является основанием для расторжения трудового договора."
        Ответ:
        {
          "disputes_representation_status": "defined",
          "disputes_representation_value": "отсутствие текущих трудовых споров с предыдущими работодателями",
          "criminal_record_status": "defined",
          "criminal_record_value": "отсутствие неснятой или непогашенной судимости",
          "disqualification_status": "defined",
          "disqualification_value": "отсутствие административных наказаний в виде дисквалификации или лишения специального права",
          "accuracy_representation_status": "defined",
          "accuracy_representation_value": "подтверждение достоверности всех предоставленных сведений и документов",
          "misrepresentation_liability_status": "defined",
          "misrepresentation_liability_value": "предоставление недостоверных сведений — основание для расторжения трудового договора",
          "evidence": [
            {
              "clause_ref": "п. 16.1",
              "quote": "Работник заверяет работодателя, что на дату заключения договора у него отсутствуют текущие трудовые споры с предыдущими работодателями."
            }
          ]
        }
        Пример 2 — только заверение о достоверности:
        Фрагмент:
        "Работник подтверждает достоверность всех предоставленных
        при трудоустройстве сведений и документов."
        Ответ:
        {
          "disputes_representation_status": "not_defined",
          "disputes_representation_value": "Данные не определены",
          "criminal_record_status": "not_defined",
          "criminal_record_value": "Данные не определены",
          "disqualification_status": "not_defined",
          "disqualification_value": "Данные не определены",
          "accuracy_representation_status": "defined",
          "accuracy_representation_value": "достоверность всех предоставленных сведений и документов",
          "misrepresentation_liability_status": "not_defined",
          "misrepresentation_liability_value": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 16.2",
              "quote": "Работник подтверждает достоверность всех предоставленных при трудоустройстве сведений и документов."
            }
          ]
        }
        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Работник выполняет свои обязанности в соответствии с договором."
        Ответ:
        {
          "disputes_representation_status": "not_defined",
          "disputes_representation_value": "Данные не определены",
          "criminal_record_status": "not_defined",
          "criminal_record_value": "Данные не определены",
          "disqualification_status": "not_defined",
          "disqualification_value": "Данные не определены",
          "accuracy_representation_status": "not_defined",
          "accuracy_representation_value": "Данные не определены",
          "misrepresentation_liability_status": "not_defined",
          "misrepresentation_liability_value": "Данные не определены",
          "evidence": []
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Проверь, что все 11 ключей (10 полей + evidence) присутствуют в JSON.
        2. Проверь, что каждый *_status ∈ {"defined", "not_defined"}, а каждый *_value
        при отсутствии данных = "Данные не определены".
        3. Проверь, что для каждого defined-поля в evidence есть прямая цитата из договора.
        4. Убедись, что заверение об отсутствии споров, заверение о судимости
        и заверение о достоверности разнесены по разным полям.
        5. Убедись, что ответственность за недостоверные заверения отражена
        отдельно.
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "disputes_representation_status": "<defined / not_defined>",
          "disputes_representation_value": "<текст / 'не предусмотрено' / 'Данные не определены'>",
          "criminal_record_status": "<defined / not_defined>",
          "criminal_record_value": "<текст / 'не предусмотрено' / 'Данные не определены'>",
          "disqualification_status": "<defined / not_defined>",
          "disqualification_value": "<текст / 'не предусмотрено' / 'Данные не определены'>",
          "accuracy_representation_status": "<defined / not_defined>",
          "accuracy_representation_value": "<текст / 'Данные не определены'>",
          "misrepresentation_liability_status": "<defined / not_defined>",
          "misrepresentation_liability_value": "<текст / 'не предусмотрена' / 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 7
      temperature: 0.0
      max_tokens: 1000

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "заверения об обстоятельствах заверение отсутствие судимости не судим уголовное преследование административное наказание дисквалификация лишение специального права текущие споры трудовые споры достоверность сведений предоставленные документы ложные сведения ответственность за недостоверные сведения"
      preferred_unit_types:
        - obligation
        - general_provision
        - representations
        - definition
      excluded_unit_types:
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - representations
        - obligations
        - boilerplate
        - remedies
      boost_keywords:
        - "заверения об обстоятельствах"
        - "отсутствие судимости"
        - "дисквалификация"
        - "достоверность сведений"
        - "ложные сведения"
      negative_keywords:
        - "трудовая функция"
        - "оклад"
        - "рабочее время"
        - "отпуск"
        - "конфиденциальность"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.50, 0.95]
        boost: 0.30
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "representations"
        - "obligations"
        - "boilerplate"
        - "remedies"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1200

      compact_output: false

      presence_signal:
        field: "pending_disputes_history_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по трудовому праву и M&A. Извлеки
        из трудового договора сведения о заверениях об отсутствии споров,
        судимости и дисквалификации.
        Не анализируй оплату труда, режим работы или расторжение.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 10 полей + evidence (всего 11 ключей):

        0. pending_disputes_history_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (disputes_representation_status, criminal_record_status,
              disqualification_status, accuracy_representation_status,
              misrepresentation_liability_status) ≠ "not_defined";
           - "missing" — если все пять содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - все пять *_status = "not_defined";
           - все *_value = "Данные не определены";
           - не выполняй остальные шаги.

        1. disputes_representation_status — "defined" или "not_defined".
        2. disputes_representation_value — заверение об отсутствии споров.
        3. criminal_record_status — "defined" или "not_defined".
        4. criminal_record_value — заверение об отсутствии судимости.
        5. disqualification_status — "defined" или "not_defined".
        6. disqualification_value — заверение об отсутствии дисквалификации
           и административных наказаний.
        7. accuracy_representation_status — "defined" или "not_defined".
        8. accuracy_representation_value — заверение о достоверности сведений.
        9. misrepresentation_liability_status — "defined" или "not_defined".
        10. misrepresentation_liability_value — ответственность
            за недостоверные заверения.

        Если данные отсутствуют:
        - для *_status — "not_defined"
        - для *_value — "Данные не определены"
        </task>

        <context_rules>
        - Перед остальными полями заполни pending_disputes_history_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_value = "Данные не определены".
        - Используй только текст договора.
        - Различай заверение об отсутствии споров, заверение о судимости,
          заверение о дисквалификации и заверение о достоверности — это
          разные заверения.
        - Для руководителей заверения могут быть расширены (ст. 275 ТК РФ);
          для обычных работников — ограничены.
        - Если условие определяется через отсылку к документу (Отдельное
          соглашение, Приложение, Согласие) — фиксируй как "defined"
          со значением «согласно <документ>».
        - Если в разных фрагментах указаны разные данные и конфликт нельзя
          разрешить по тексту — статус → "not_defined", значение → "Не удалось определить".
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни заверения об отсутствии споров, ни о судимости,
           ни о дисквалификации, ни о достоверности.
           → presence = "missing";
             все пять *_status = "not_defined";
             все *_value = "Данные не определены".

        2. Только заверение о достоверности.
           Есть подтверждение достоверности сведений, но нет заверений
           об отсутствии споров, судимости и дисквалификации.
           → presence = "present";
             accuracy_representation_status = "defined";
             disputes_representation_status = "not_defined";
             criminal_record_status = "not_defined";
             disqualification_status = "not_defined";
             соответствующие *_value = "Данные не определены".

        3. Противоречие между фрагментами.
           В одном пункте есть заверение об отсутствии судимости,
           в другом — это не упоминается, и нет отсылок.
           → presence = "unclear";
             criminal_record_status = "not_defined";
             criminal_record_value = "Не удалось определить".

        4. Отсылка на отдельное соглашение.
           Заверения определяются отдельным документом
           (Отдельное соглашение, Согласие).
           → presence = "present";
             accuracy_representation_status = "defined";
             accuracy_representation_value содержит формулировку вида
             «согласно Отдельному соглашению».
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для pending_disputes_history_check_presence используй только: "present", "missing", "unclear".
        - Для всех *_status используй только: "defined" или "not_defined".
        - Fallback при отсутствии данных:
          * все *_value → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_value → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "pending_disputes_history_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие заверений об отсутствии споров и судимости. Внутреннее агрегатное signal-поле."
          required: true

        - name: "disputes_representation_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус заверения об отсутствии споров. Внутреннее enum-поле."
          required: true

        - name: "disputes_representation_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Заверение о спорах"
          description: >
            Заверение об отсутствии текущих трудовых споров. Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "criminal_record_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус заверения об отсутствии судимости. Внутреннее enum-поле."
          required: true

        - name: "criminal_record_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Заверение о судимости"
          description: >
            Заверение об отсутствии судимости / уголовного преследования. Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "disqualification_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус заверения об отсутствии дисквалификации. Внутреннее enum-поле."
          required: true

        - name: "disqualification_value"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Заверение о дисквалификации"
          description: >
            Заверение об отсутствии дисквалификации и административных наказаний. Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "accuracy_representation_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус заверения о достоверности сведений. Внутреннее enum-поле."
          required: true

        - name: "accuracy_representation_value"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Заверение о достоверности"
          description: >
            Заверение о достоверности предоставленных сведений. Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "misrepresentation_liability_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус ответственности за недостоверные заверения. Внутреннее enum-поле."
          required: true

        - name: "misrepresentation_liability_value"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Ответственность за недостоверность"
          description: >
            Ответственность за недостоверные заверения. Fallback: "Не установлено" / "Не удалось определить".
          required: false

      store_payload: true

# ════════════════════════════════════════════════════════════════════════════
# БЛОК 5: DD_REQUEST_TEMPLATES
# Читается: DDRequestTemplateLoader
# ════════════════════════════════════════════════════════════════════════════

dd_request_templates:
  parties_function_place_check:
    text: >
      Просим чётко указать в {doc_names}: (а) трудовую функцию — должность/профессию/
      специальность с квалификацией ИЛИ конкретный вид работы (без трудовой функции
      договор незаключён — ст. 57 ТК РФ); (б) место работы — адрес, подразделение,
      филиал; (в) приложить должностную инструкцию; (г) характер работы
      (разъездной, в пути, подвижной) — если применимо (ст. 57 ТК РФ).
    addressee: "Отдел кадров / Работодатель"

  term_probation_check:
    text: >
      Просим указать в {doc_names}: (а) дату начала работы; (б) для срочного договора —
      срок и основание по ст. 59 ТК РФ (без основания → бессрочный, ст. 58 ТК РФ);
      (в) испытательный срок — не более 3 месяцев (6 для руководителей), проверить
      запреты для беременных, несовершеннолетних, выпускников (ст. 70 ТК РФ).
    addressee: "Отдел кадров / Юридический отдел"

  payment_structure_check:
    text: >
      Просим согласовать для {doc_names}: (а) оклад/тарифную ставку (не ниже МРОТ —
      ст. 133 ТК РФ); (б) доплаты, надбавки, премии и порядок премирования;
      (в) конкретные даты выплаты заработной платы (не реже 2 раз в месяц —
      ст. 136 ТК РФ); (г) расчётный листок.
    addressee: "Финансовый отдел / Отдел кадров"

  working_hours_leave_check:
    text: >
      Просим согласовать для {doc_names}: (а) продолжительность рабочего времени
      (не более 40 ч/нед — ст. 91 ТК РФ); (б) график, перерывы, выходные;
      (в) ненормированный рабочий день (если применимо); (г) ежегодный отпуск —
      не менее 28 календарных дней (ст. 115 ТК РФ); (д) дополнительные отпуска
      (за вредные условия, ненормированный день); (е) условия сверхурочной работы
      и компенсации (ст. 99, 152, 153 ТК РФ).
    addressee: "Отдел кадров"

  safety_social_insurance_check:
    text: >
      Просим указать в {doc_names}: (а) условия труда на рабочем месте по результатам
      СОУТ — класс условий труда (обязательно с 2014 г. — ФЗ-426); (б) при вредных/
      опасных условиях — гарантии: сокращённый день, допотпуск, доплата, молоко, СИЗ
      (ст. 92, 117, 147 ТК РФ); (в) обязательства работодателя по охране труда
      (ст. 214 ТК РФ); (г) обязательное социальное и пенсионное страхование
      (ст. 57 ТК РФ); (д) согласие на обработку персональных данных (ФЗ-152).
    addressee: "Отдел охраны труда / Отдел кадров"

  form_liability_confidentiality_check:
    text: >
      Просим обеспечить в {doc_names}: (а) два экземпляра, один — работнику,
      подтверждение получения подписью (ст. 67 ТК РФ); (б) при полной материальной
      ответственности — должность в перечне (ст. 244 ТК РФ), отдельный договор
      о полной МО, порядок возмещения ущерба; (в) при доступе к коммерческой тайне —
      условие о неразглашении (ст. 57 ТК РФ, ФЗ-98), ответственность за разглашение.
    addressee: "Отдел кадров / Юридический отдел"

  termination_modification_rights_check:
    text: >
      Просим обеспечить в {doc_names}: (а) увольнение только по основаниям
      ст. 77–81 ТК РФ с соблюдением процедуры; (б) выходное пособие при сокращении;
      (в) изменение условий — по соглашению сторон (ст. 72 ТК РФ) или по инициативе
      работодателя с уведомлением за 2 месяца (ст. 74 ТК РФ); (г) исключить условия,
      ограничивающие права работника (ст. 9 ТК РФ) и дискриминационные условия (ст. 3 ТК РФ).
    addressee: "Юридический отдел"

  non_compete_disputes_check:
    text: >
      В {doc_names} выявлено условие о запрете конкуренции (non-compete). В российском
      трудовом праве такие условия не имеют юридической силы (не предусмотрены ТК РФ,
      ограничивают право на труд — ст. 37 Конституции РФ). Просим получить правовое
      заключение и рассмотреть альтернативы (условие о конфиденциальности, NDA).
      Также просим согласовать порядок разрешения трудовых споров (переговоры, КТС,
      медиация) и указать ссылку на коллективный договор (при наличии).
    addressee: "Юридический отдел"

  _default:
    text: >
      Просим предоставить дополнительную информацию по вопросу «{check_name}»
      применительно к {doc_names}.
    addressee: "Юридический советник"
