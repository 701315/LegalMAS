      - "(?i)внутренн[еое]\\s+совместительств[оо]"
      - "(?i)внешн[еое]\\s+совместительств[оо]"
      - "(?i)ст\\.\\s*282\\s*ТК\\s*РФ"

  seasonal_work:
    any_keywords:
      - "(?i)сезонн[а-яё]+\\s+работ[аа]"
      - "(?i)на\\s+сезон"
      - "(?i)ст\\.\\s*293\\s*ТК\\s*РФ"

  rotation_work:
    any_keywords:
      - "(?i)вахтов[ыо]й\\s+метод"
      - "(?i)\\bвахт[ааы]\\b"
      - "(?i)вахтов[а-яё]+\\s+работ[аа]"
      - "(?i)ст\\.\\s*297\\s*ТК\\s*РФ"

  executive_employee:
    any_keywords:
      - "(?i)руководител[ья]\\s+организаци[ии]"
      - "(?i)генеральн[ыо]й\\s+директор"
      - "(?i)единоличн[ыо]й\\s+исполнительн[ыо]й\\s+орган"
      - "(?i)Глав[аа]\\s+43\\s*ТК\\s*РФ"

  foreign_worker:
    any_keywords:
      - "(?i)иностранн[ыо]й\\s+работник"
      - "(?i)иностранн[ыо]й\\s+гражданин"
      - "(?i)разрешени[ея]\\s+на\\s+работ[уу]"
      - "(?i)патент\\s+на\\s+работ[уу]"
