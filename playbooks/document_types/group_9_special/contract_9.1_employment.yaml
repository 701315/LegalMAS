          required: true

        - name: "extra_benefits_value"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Дополнительные льготы"
          description: >
            Дополнительные льготы (перерывы, выходные, допотпуск). Fallback: "Не установлено" / "Не удалось определить".
          required: false

      store_payload: true

  - id: concurrent_employment_check
    name: "Работа по совместительству"
    description: >
      Фактографическая проверка условий о работе по совместительству
      (ст. 60.1, 60.2, 282–288 ТК РФ): вид совместительства (внутреннее /
      внешнее), режим работы, оплата, ограничения для отдельных категорий,
      основания прекращения.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "совместительство"
        - "по совместительству"
        - "внутренний совместитель"
        - "внешний совместитель"
        - "совмещение"
        - "основное место работы"
        - "не более половины"
        - "4 часа"
        - "совмещаемая профессия"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)по\\s+совместительств"
        - "(?i)внешн[а-яё]+\\s+совмест"
        - "(?i)внутренн[а-яё]+\\s+совмест"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по трудовому праву.
        Анализируется трудовой договор о работе по совместительству.
        Проверяется только один вопрос: условия работы по совместительству.
        Нормативный ориентир:
        - ст. 60.1 ТК РФ — работа по совместительству
        - ст. 60.2 ТК РФ — совмещение профессий (не путать с совместительством!)
        - ст. 282 ТК РФ — понятие совместительства
        - ст. 283 ТК РФ — документы при приёме на работу по совместительству
        - ст. 284 ТК РФ — продолжительность рабочего времени (не более 4 часов в день,
        не более половины месячной нормы)
        - ст. 285 ТК РФ — оплата труда (пропорционально отработанному времени)
        - ст. 286 ТК РФ — отпуск при работе по совместительству (одновременно
        с отпуском по основной работе)
        - ст. 287 ТК РФ — гарантии и компенсации
        - ст. 288 ТК РФ — дополнительные основания прекращения
        - ст. 282 ч. 5 ТК РФ — ограничения для отдельных категорий
        (несовершеннолетние, водители, педагоги и др.)
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска, не подставляй нормы закона вместо текста.
        - Различай совместительство (ст. 60.1) и совмещение (ст. 60.2).
        [ЗАДАЧА]
        Найди в тексте договора:
        1. Вид совместительства (внутреннее / внешнее).
        2. Указание на основное место работы.
        3. Режим работы по совместительству.
        4. Оплату труда по совместительству.
        5. Отпуск при работе по совместительству.
        6. Ограничения для отдельных категорий.
        7. Дополнительные основания прекращения.
        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона вместо текста.
        2. Для *_status используй строго "defined" или "not_defined".
        3. Для *_value при отсутствии данных — строго "Данные не определены".
        4. concurrent_type_value: "internal" / "external" / "not_defined".
        5. Различай совместительство (ст. 60.1) и совмещение профессий (ст. 60.2).
        6. working_hours_* фиксирует продолжительность рабочего времени
        (не более 4 часов в день, не более половины месячной нормы).
        7. payment_* фиксирует порядок оплаты (пропорционально отработанному времени
        или иные условия).
        8. leave_* фиксирует порядок предоставления отпуска (одновременно
        с отпуском по основной работе).
        9. restrictions_* фиксирует ограничения (для отдельных категорий).
        10. termination_grounds_* фиксирует дополнительные основания прекращения.
        11. Если гарантия определяется через отсылку к документу — фиксируй
        как "defined" со значением «согласно <документ>».
        12. В evidence включай только текст договора.
        13. Никогда не используй "None", "null", пустые строки или отсутствующие ключи.
        14. Верни РОВНО один валидный JSON-объект со всеми 15 ключами (14 полей + evidence),
        пригодный для парсинга через json.loads без предварительной обработки.
        Без markdown, без ```json, без комментариев, без текста до или после.
        Начни ответ сразу с { и закончи }.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — внешнее совместительство:
        Фрагмент:
        "Работа для работника является совместительством (внешнее).
        Продолжительность рабочего времени — не более 4 часов в день.
        Оплата труда — пропорционально отработанному времени.
        Отпуск предоставляется одновременно с отпуском по основной работе."
        Ответ:
        {
          "concurrent_type_status": "defined",
          "concurrent_type_value": "external",
          "main_job_status": "not_defined",
          "main_job_value": "Данные не определены",
          "working_hours_status": "defined",
          "working_hours_value": "не более 4 часов в день",
          "payment_status": "defined",
          "payment_value": "пропорционально отработанному времени",
          "leave_status": "defined",
          "leave_value": "одновременно с отпуском по основной работе",
          "restrictions_status": "not_defined",
          "restrictions_value": "Данные не определены",
          "termination_grounds_status": "not_defined",
          "termination_grounds_value": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "Работа для работника является совместительством (внешнее)."
            }
          ]
        }
        Пример 2 — внутреннее совместительство:
        Фрагмент:
        "Работник принимается на работу по внутреннему совместительству
        на должность инженера. Работа является дополнительной к основной
        должности работника в ООО «Альфа»."
        Ответ:
        {
          "concurrent_type_status": "defined",
          "concurrent_type_value": "internal",
          "main_job_status": "defined",
          "main_job_value": "основная должность в ООО «Альфа»",
          "working_hours_status": "not_defined",
          "working_hours_value": "Данные не определены",
          "payment_status": "not_defined",
          "payment_value": "Данные не определены",
          "leave_status": "not_defined",
          "leave_value": "Данные не определены",
          "restrictions_status": "not_defined",
          "restrictions_value": "Данные не определены",
          "termination_grounds_status": "not_defined",
          "termination_grounds_value": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 1.2",
              "quote": "Работник принимается на работу по внутреннему совместительству на должность инженера."
            }
          ]
        }
        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Работник выполняет свои обязанности в соответствии с договором."
        Ответ:
        {
          "concurrent_type_status": "not_defined",
          "concurrent_type_value": "Данные не определены",
          "main_job_status": "not_defined",
          "main_job_value": "Данные не определены",
          "working_hours_status": "not_defined",
          "working_hours_value": "Данные не определены",
          "payment_status": "not_defined",
          "payment_value": "Данные не определены",
          "leave_status": "not_defined",
          "leave_value": "Данные не определены",
          "restrictions_status": "not_defined",
          "restrictions_value": "Данные не определены",
          "termination_grounds_status": "not_defined",
          "termination_grounds_value": "Данные не определены",
          "evidence": []
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Проверь, что все 15 ключей (14 полей + evidence) присутствуют в JSON.
        2. Проверь, что каждый *_status ∈ {"defined", "not_defined"}, а каждый *_value
        при отсутствии данных = "Данные не определены".
        3. Проверь, что для каждого defined-поля в evidence есть прямая цитата из договора.
        4. Убедись, что concurrent_type_value — одно из: "internal" / "external" /
        "Данные не определены".
        5. Убедись, что не путаешь совместительство (ст. 60.1) и совмещение (ст. 60.2).
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "concurrent_type_status": "<defined / not_defined>",
          "concurrent_type_value": "<internal / external / 'Данные не определены'>",
          "main_job_status": "<defined / not_defined>",
          "main_job_value": "<текст / 'Данные не определены'>",
          "working_hours_status": "<defined / not_defined>",
          "working_hours_value": "<часов / 'Данные не определены'>",
          "payment_status": "<defined / not_defined>",
          "payment_value": "<текст / 'Данные не определены'>",
          "leave_status": "<defined / not_defined>",
          "leave_value": "<текст / 'Данные не определены'>",
          "restrictions_status": "<defined / not_defined>",
          "restrictions_value": "<текст / 'Данные не определены'>",
          "termination_grounds_status": "<defined / not_defined>",
          "termination_grounds_value": "<текст / 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 7
      temperature: 0.0
      max_tokens: 900

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "совместительство по совместительству внутренний внешний основное место работы 4 часа половина месячной нормы оплата пропорционально отпуск одновременно дополнительные основания прекращения"
      preferred_unit_types:
        - obligation
        - general_provision
        - definition
      excluded_unit_types:
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - limitations
        - definitions
      boost_keywords:
        - "по совместительству"
        - "внешнее"
        - "внутреннее"
        - "4 часа"
        - "основное место работы"
      negative_keywords:
        - "трудовая функция"
        - "оклад"
        - "рабочее время"
        - "конфиденциальность"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 0.35]
        boost: 0.25
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "limitations"
        - "definitions"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1300

      compact_output: false

      presence_signal:
        field: "concurrent_employment_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по трудовому праву. Извлеки из трудового договора
        сведения о работе по совместительству.
        Не анализируй основное место работы, оплату или режим.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 14 полей + evidence (всего 15 ключей):

        0. concurrent_employment_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (concurrent_type_status, main_job_status, working_hours_status,
              payment_status, leave_status, restrictions_status,
              termination_grounds_status) ≠ "not_defined";
           - "missing" — если все семь содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - все семь *_status = "not_defined";
           - все *_value = "Данные не определены";
           - не выполняй остальные шаги.

        1. concurrent_type_status — "defined" или "not_defined".
        2. concurrent_type_value — "internal" / "external".
        3. main_job_status — "defined" или "not_defined".
        4. main_job_value — указание на основное место работы.
        5. working_hours_status — "defined" или "not_defined".
        6. working_hours_value — режим работы по совместительству.
        7. payment_status — "defined" или "not_defined".
        8. payment_value — оплата труда.
        9. leave_status — "defined" или "not_defined".
        10. leave_value — отпуск при работе по совместительству.
        11. restrictions_status — "defined" или "not_defined".
        12. restrictions_value — ограничения для отдельных категорий.
        13. termination_grounds_status — "defined" или "not_defined".
        14. termination_grounds_value — дополнительные основания прекращения.

        Если данные отсутствуют:
        - для *_status — "not_defined"
        - для *_value — "Данные не определены"
        </task>

        <context_rules>
        - Перед остальными полями заполни concurrent_employment_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_value = "Данные не определены".
        - Используй только текст договора.
        - Различай совместительство (ст. 60.1) и совмещение (ст. 60.2).
        - working_hours_* — не более 4 часов в день, не более половины месячной нормы.
        - Если гарантия определяется через отсылку к документу — фиксируй
          как "defined" со значением «согласно <документ>».
        - Если в разных фрагментах указаны разные данные и конфликт нельзя
          разрешить по тексту — статус → "not_defined", значение → "Не удалось определить".
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни вида совместительства, ни основного места работы,
           ни режима, ни оплаты, ни отпуска.
           → presence = "missing";
             все семь *_status = "not_defined";
             все *_value = "Данные не определены".

        2. Указан только вид совместительства.
           Есть указание на совместительство, но без режима, оплаты,
           отпуска и ограничений.
           → presence = "present";
             concurrent_type_status = "defined";
             остальные *_status = "not_defined";
             соответствующие *_value = "Данные не определены".

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные виды совместительства
           или противоречащие условия.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             соответствующее *_value = "Не удалось определить".

        4. Полная структура.
           Указаны вид, основное место, режим, оплата, отпуск,
           ограничения и основания прекращения.
           → presence = "present";
             все семь *_status = "defined".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для concurrent_employment_check_presence используй только: "present", "missing", "unclear".
        - Для всех *_status используй только: "defined" или "not_defined".
        - Fallback при отсутствии данных:
          * все *_value → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_value → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "concurrent_employment_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие условий о работе по совместительству. Внутреннее агрегатное signal-поле."
          required: true

        - name: "concurrent_type_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания вида совместительства. Внутреннее enum-поле."
          required: true

        - name: "concurrent_type_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Вид совместительства"
          description: >
            Внутреннее или внешнее совместительство. Fallback: "Не установлено" / "Не удалось определить".
          required: true

        - name: "main_job_status"
          type: "string"
          presentation: "signal"
          risk_weight: "low"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания основного места работы. Внутреннее enum-поле."
          required: true

        - name: "main_job_value"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Основное место работы"
          description: >
            Указание на основное место работы. Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "working_hours_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус режима работы. Внутреннее enum-поле."
          required: true

        - name: "working_hours_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Режим работы"
          description: >
            Режим работы по совместительству. Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "payment_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус оплаты труда. Внутреннее enum-поле."
          required: true

        - name: "payment_value"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Оплата труда"
          description: >
            Оплата труда по совместительству. Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "leave_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус отпуска. Внутреннее enum-поле."
          required: true

        - name: "leave_value"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Отпуск"
          description: >
            Порядок предоставления отпуска. Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "restrictions_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус ограничений для отдельных категорий. Внутреннее enum-поле."
          required: true

        - name: "restrictions_value"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Ограничения"
          description: >
            Ограничения для отдельных категорий работников. Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "termination_grounds_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус дополнительных оснований прекращения. Внутреннее enum-поле."
          required: true

        - name: "termination_grounds_value"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Основания прекращения"
          description: >
            Дополнительные основания прекращения. Fallback: "Не установлено" / "Не удалось определить".
          required: false

      store_payload: true

  - id: remote_work_specifics_check
    name: "Специфика дистанционной работы"
    description: >
      Фактографическая проверка условий дистанционной работы (ст. 312.1–312.9 ТК РФ):
      режим (постоянно / временно / периодически), порядок взаимодействия,
      оборудование рабочего места, компенсация расходов, обмен документами,
      порядок прекращения.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "дистанционная работа"
        - "дистанционно"
        - "удалённая работа"
        - "удалённо"
        - "надомная работа"
        - "электронный документооборот"
        - "усиленная квалифицированная"
        - "оборудование рабочего места"
        - "компенсация расходов"
        - "периодическая дистанционная"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)дистанционн"
        - "(?i)удалённ"
        - "(?i)электронн[а-яё]+\\s+документооборот"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по трудовому праву.
        Анализируется трудовой договор о дистанционной работе.
        Проверяется только один вопрос: условия дистанционной работы.
        Нормативный ориентир:
        - ст. 312.1 ТК РФ — дистанционная работа и дистанционный работник
        - ст. 312.2 ТК РФ — заключение договора и обмен документами
        в электронной форме
        - ст. 312.3 ТК РФ — порядок взаимодействия
        - ст. 312.4 ТК РФ — режим рабочего времени дистанционного работника
        - ст. 312.5 ТК РФ — особенности расторжения
        - ст. 312.6 ТК РФ — обеспечение работника оборудованием
        - ст. 312.7 ТК РФ — ознакомление с документами
        - ст. 312.8 ТК РФ — дополнительные основания расторжения
        - ст. 312.9 ТК РФ — временный перевод
        - ст. 22, 188 ТК РФ — компенсация расходов
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска, не подставляй нормы закона вместо текста.
        - Различай постоянную, временную и периодическую дистанционную работу.
        [ЗАДАЧА]
        Найди в тексте договора:
        1. Режим дистанционной работы (постоянно / временно / периодически).
        2. Порядок взаимодействия между работником и работодателем.
        3. Указание на электронный документооборот.
        4. Оборудование рабочего места (кто предоставляет).
        5. Компенсация расходов дистанционного работника.
        6. Особенности расторжения трудового договора.
        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона вместо текста.
        2. Для *_status используй строго "defined" или "not_defined".
        3. Для *_value при отсутствии данных — строго "Данные не определены".
        4. remote_type_value: "permanent" / "temporary" / "periodic" /
        "not_defined".
        5. interaction_* фиксирует порядок взаимодействия (сроки ответа,
        каналы связи).
        6. edoc_* фиксирует использование электронного документооборота
        и усиленной квалифицированной электронной подписи.
        7. equipment_* фиксирует порядок обеспечения оборудованием.
        8. reimbursement_* фиксирует компенсацию расходов дистанционного работника.
        9. termination_specifics_* фиксирует особенности расторжения.
        10. Если гарантия определяется через отсылку к документу — фиксируй
        как "defined" со значением «согласно <документ>».
        11. В evidence включай только текст договора.
        12. Никогда не используй "None", "null", пустые строки или отсутствующие ключи.
        13. Верни РОВНО один валидный JSON-объект со всеми 13 ключами (12 полей + evidence),
        пригодный для парсинга через json.loads без предварительной обработки.
        Без markdown, без ```json, без комментариев, без текста до или после.
        Начни ответ сразу с { и закончи }.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — постоянная дистанционная работа:
        Фрагмент:
        "Работник выполняет трудовую функцию дистанционно на постоянной основе.
        Взаимодействие осуществляется по электронной почте и в системе электронного
        документооборота с использованием усиленной квалифицированной электронной
        подписи. Работодатель предоставляет работнику ноутбук и обеспечивает
        компенсацию расходов на интернет — 500 рублей в месяц."
        Ответ:
        {
          "remote_type_status": "defined",
          "remote_type_value": "permanent",
          "interaction_status": "defined",
          "interaction_value": "по электронной почте и в системе электронного документооборота",
          "edoc_status": "defined",
          "edoc_value": "УКЭП в системе электронного документооборота",
          "equipment_status": "defined",
          "equipment_value": "ноутбук предоставляется работодателем",
          "reimbursement_status": "defined",
          "reimbursement_value": "компенсация расходов на интернет — 500 рублей в месяц",
          "termination_specifics_status": "not_defined",
          "termination_specifics_value": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "Работник выполняет трудовую функцию дистанционно на постоянной основе."
            }
          ]
        }
        Пример 2 — периодическая дистанционная работа:
        Фрагмент:
        "Работник выполняет трудовую функцию периодически дистанционно
        (не более 3 дней в неделю). Работник использует собственное оборудование.
        Ознакомление с локальными актами — через систему электронного
        документооборота."
        Ответ:
        {
          "remote_type_status": "defined",
          "remote_type_value": "periodic",
          "interaction_status": "not_defined",
          "interaction_value": "Данные не определены",
          "edoc_status": "defined",
          "edoc_value": "система электронного документооборота",
          "equipment_status": "defined",
          "equipment_value": "работник использует собственное оборудование",
          "reimbursement_status": "not_defined",
          "reimbursement_value": "Данные не определены",
          "termination_specifics_status": "not_defined",
          "termination_specifics_value": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 1.2",
              "quote": "Работник выполняет трудовую функцию периодически дистанционно (не более 3 дней в неделю)."
            }
          ]
        }
        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Работник выполняет свои обязанности в соответствии с договором."
        Ответ:
        {
          "remote_type_status": "not_defined",
          "remote_type_value": "Данные не определены",
          "interaction_status": "not_defined",
          "interaction_value": "Данные не определены",
          "edoc_status": "not_defined",
          "edoc_value": "Данные не определены",
          "equipment_status": "not_defined",
          "equipment_value": "Данные не определены",
          "reimbursement_status": "not_defined",
          "reimbursement_value": "Данные не определены",
          "termination_specifics_status": "not_defined",
          "termination_specifics_value": "Данные не определены",
          "evidence": []
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Проверь, что все 13 ключей (12 полей + evidence) присутствуют в JSON.
        2. Проверь, что каждый *_status ∈ {"defined", "not_defined"}, а каждый *_value
        при отсутствии данных = "Данные не определены".
        3. Проверь, что для каждого defined-поля в evidence есть прямая цитата из договора.
        4. Убедись, что remote_type_value — одно из: "permanent" / "temporary" /
        "periodic" / "Данные не определены".
        5. Убедись, что порядок взаимодействия / ЭДО / оборудование / компенсация
        разнесены по соответствующим полям.
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "remote_type_status": "<defined / not_defined>",
          "remote_type_value": "<permanent / temporary / periodic / 'Данные не определены'>",
          "interaction_status": "<defined / not_defined>",
          "interaction_value": "<текст / 'Данные не определены'>",
          "edoc_status": "<defined / not_defined>",
          "edoc_value": "<текст / 'Данные не определены'>",
          "equipment_status": "<defined / not_defined>",
          "equipment_value": "<текст / 'Данные не определены'>",
          "reimbursement_status": "<defined / not_defined>",
          "reimbursement_value": "<текст / 'не предусмотрена' / 'Данные не определены'>",
          "termination_specifics_status": "<defined / not_defined>",
          "termination_specifics_value": "<текст / 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 7
      temperature: 0.0
      max_tokens: 900

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "дистанционная работа дистанционно удалённая работа постоянно временно периодически электронный документооборот усиленная квалифицированная электронная подпись оборудование рабочего места компенсация расходов интернет порядок взаимодействия"
      preferred_unit_types:
        - obligation
        - general_provision
        - definition
      excluded_unit_types:
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
        - definitions
      boost_keywords:
        - "дистанционная работа"
        - "удалённая работа"
        - "электронный документооборот"
        - "УКЭП"
        - "компенсация расходов"
      negative_keywords:
        - "трудовая функция"
        - "оклад"
        - "конфиденциальность"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 0.40]
        boost: 0.20
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
        - "definitions"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1300

      compact_output: false

      presence_signal:
        field: "remote_work_specifics_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по трудовому праву. Извлеки из трудового договора
        сведения о дистанционной работе.
        Не анализируй оплату труда или расторжение.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 12 полей + evidence (всего 13 ключей):

        0. remote_work_specifics_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (remote_type_status, interaction_status, edoc_status,
              equipment_status, reimbursement_status,
              termination_specifics_status) ≠ "not_defined";
           - "missing" — если все шесть содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - все шесть *_status = "not_defined";
           - все *_value = "Данные не определены";
           - не выполняй остальные шаги.

        1. remote_type_status — "defined" или "not_defined".
        2. remote_type_value — "permanent" / "temporary" / "periodic".
        3. interaction_status — "defined" или "not_defined".
        4. interaction_value — порядок взаимодействия.
        5. edoc_status — "defined" или "not_defined".
        6. edoc_value — электронный документооборот.
        7. equipment_status — "defined" или "not_defined".
        8. equipment_value — обеспечение оборудованием.
        9. reimbursement_status — "defined" или "not_defined".
        10. reimbursement_value — компенсация расходов.
        11. termination_specifics_status — "defined" или "not_defined".
        12. termination_specifics_value — особенности расторжения.

        Если данные отсутствуют:
        - для *_status — "not_defined"
        - для *_value — "Данные не определены"
        </task>

        <context_rules>
        - Перед остальными полями заполни remote_work_specifics_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_value = "Данные не определены".
        - Используй только текст договора.
        - remote_type_value — одно из: "permanent" / "temporary" / "periodic".
        - edoc_* — использование электронного документооборота и УКЭП.
        - Если гарантия определяется через отсылку к документу — фиксируй
          как "defined" со значением «согласно <документ>».
        - Если в разных фрагментах указаны разные данные и конфликт нельзя
          разрешить по тексту — статус → "not_defined", значение → "Не удалось определить".
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни режима дистанционной работы, ни взаимодействия,
           ни ЭДО, ни оборудования, ни компенсации, ни особенностей расторжения.
           → presence = "missing";
             все шесть *_status = "not_defined";
             все *_value = "Данные не определены".

        2. Указан только режим дистанционной работы.
           Есть указание на дистанционную работу (постоянно / временно /
           периодически), но без ЭДО, оборудования, компенсации.
           → presence = "present";
             remote_type_status = "defined";
             остальные *_status = "not_defined";
             соответствующие *_value = "Данные не определены".

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные режимы дистанционной
           работы или противоречащие условия по оборудованию.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             соответствующее *_value = "Не удалось определить".

        4. Отсылка на локальный акт / Приложение.
           Порядок взаимодействия, ЭДО или компенсация определяются
           отдельным документом (Положение, Приложение, Соглашение).
           → presence = "present";
             соответствующий *_status = "defined";
             соответствующее *_value содержит формулировку вида
             «согласно Положению о дистанционной работе».
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для remote_work_specifics_check_presence используй только: "present", "missing", "unclear".
        - Для всех *_status используй только: "defined" или "not_defined".
        - Fallback при отсутствии данных:
          * все *_value → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_value → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "remote_work_specifics_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие условий о дистанционной работе. Внутреннее агрегатное signal-поле."
          required: true

        - name: "remote_type_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания режима дистанционной работы. Внутреннее enum-поле."
          required: true

        - name: "remote_type_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Режим дистанционной работы"
          description: >
            Постоянная / временная / периодическая дистанционная работа. Fallback: "Не установлено" / "Не удалось определить".
          required: true

        - name: "interaction_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус порядка взаимодействия. Внутреннее enum-поле."
          required: true

        - name: "interaction_value"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Порядок взаимодействия"
          description: >
            Порядок взаимодействия работника и работодателя. Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "edoc_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус электронного документооборота. Внутреннее enum-поле."
          required: true

        - name: "edoc_value"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Электронный документооборот"
          description: >
            Использование ЭДО и УКЭП. Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "equipment_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус обеспечения оборудованием. Внутреннее enum-поле."
          required: true

        - name: "equipment_value"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Оборудование"
          description: >
            Порядок обеспечения оборудованием. Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "reimbursement_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус компенсации расходов. Внутреннее enum-поле."
          required: true

        - name: "reimbursement_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Компенсация расходов"
          description: >
            Компенсация расходов дистанционного работника. Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "termination_specifics_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус особенностей расторжения. Внутреннее enum-поле."
          required: true

        - name: "termination_specifics_value"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Особенности расторжения"
          description: >
            Особенности расторжения договора с дистанционным работником. Fallback: "Не установлено" / "Не удалось определить".
          required: false

      store_payload: true

  - id: homeworker_specifics_check
    name: "Специфика надомной работы"
    description: >
      Фактографическая проверка условий надомной работы (ст. 310 ТК РФ):
      указание на надомный характер, используемое оборудование и инструменты,
      компенсация за их использование, порядок взаимодействия.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "medium"
    severity_if_pass: "pass"
    severity_if_fail: "medium"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "надомник"
        - "надомная работа"
        - "на дому"
        - "изделия на дому"
        - "инструменты"
        - "оборудование"
        - "материалы"
        - "компенсация за износ"
        - "сырьё"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)надомн"
        - "(?i)на\\s+дому"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по трудовому праву.
        Анализируется трудовой договор о надомной работе.
        Проверяется только один вопрос: условия надомной работы.
        Нормативный ориентир:
        - ст. 310 ТК РФ — надомники (лица, заключившие договор о выполнении
        работы на дому личным трудом)
        - ст. 311 ТК РФ — условия работы, при которых допускается надомный труд
        (без вредных условий, с соблюдением требований охраны труда)
        - ст. 188 ТК РФ — компенсация за использование инструментов и материалов
        работника
        - Санитарные правила — требования к жилым помещениям
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска, не подставляй нормы закона вместо текста.
        - Надомная работа — не то же, что дистанционная (ст. 312.1 ТК РФ).
        [ЗАДАЧА]
        Найди в тексте договора:
        1. Указание на надомный характер работы.
        2. Используемое оборудование и инструменты (чьи).
        3. Материалы и сырьё (чьи, кто поставляет).
        4. Компенсация за износ оборудования / материалов.
        5. Порядок взаимодействия и приёмки работы.
        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона вместо текста.
        2. Для *_status используй строго "defined" или "not_defined".
        3. Для *_value при отсутствии данных — строго "Данные не определены".
        4. homework_type_* фиксирует прямое указание на надомный характер работы.
        5. equipment_* фиксирует, чьё оборудование и инструменты используются.
        6. materials_* фиксирует, чьи материалы / сырьё используются.
        7. compensation_* фиксирует компенсацию за использование имущества работника
        (ст. 188 ТК РФ).
        8. interaction_* фиксирует порядок взаимодействия и приёмки работы.
        9. Если условия определяются через отсылку к документу — фиксируй
        как "defined" со значением «согласно <документ>».
        10. В evidence включай только текст договора.
        11. Никогда не используй "None", "null", пустые строки или отсутствующие ключи.
        12. Верни РОВНО один валидный JSON-объект со всеми 11 ключами (10 полей + evidence),
        пригодный для парсинга через json.loads без предварительной обработки.
        Без markdown, без ```json, без комментариев, без текста до или после.
        Начни ответ сразу с { и закончи }.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — надомная работа с компенсацией:
        Фрагмент:
        "Работник выполняет работу на дому. Работник использует собственное
        оборудование и инструменты. Работодатель поставляет материалы и сырьё.
        За износ оборудования работнику выплачивается компенсация
        в размере 3000 рублей в месяц."
        Ответ:
        {
          "homework_type_status": "defined",
          "homework_type_value": "выполнение работы на дому",
          "equipment_status": "defined",
          "equipment_value": "оборудование и инструменты работника",
          "materials_status": "defined",
          "materials_value": "материалы и сырьё работодателя",
          "compensation_status": "defined",
          "compensation_value": "компенсация за износ оборудования — 3000 рублей в месяц",
          "interaction_status": "not_defined",
          "interaction_value": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "Работник выполняет работу на дому."
            }
          ]
        }
        Пример 2 — оборудование работодателя:
        Фрагмент:
        "Работник выполняет надомную работу. Работодатель предоставляет
        оборудование и материалы."
        Ответ:
        {
          "homework_type_status": "defined",
          "homework_type_value": "надомная работа",
          "equipment_status": "defined",
          "equipment_value": "оборудование работодателя",
          "materials_status": "defined",
          "materials_value": "материалы работодателя",
          "compensation_status": "not_defined",
          "compensation_value": "Данные не определены",
          "interaction_status": "not_defined",
          "interaction_value": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 1.2",
              "quote": "Работник выполняет надомную работу."
            }
          ]
        }
        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Работник выполняет свои обязанности в соответствии с договором."
        Ответ:
        {
          "homework_type_status": "not_defined",
          "homework_type_value": "Данные не определены",
          "equipment_status": "not_defined",
          "equipment_value": "Данные не определены",
          "materials_status": "not_defined",
          "materials_value": "Данные не определены",
          "compensation_status": "not_defined",
          "compensation_value": "Данные не определены",
          "interaction_status": "not_defined",
          "interaction_value": "Данные не определены",
          "evidence": []
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Проверь, что все 11 ключей (10 полей + evidence) присутствуют в JSON.
        2. Проверь, что каждый *_status ∈ {"defined", "not_defined"}, а каждый *_value
        при отсутствии данных = "Данные не определены".
        3. Проверь, что для каждого defined-поля в evidence есть прямая цитата из договора.
        4. Убедись, что надомная работа не спутана с дистанционной.
        5. Убедись, что компенсация за использование имущества работника отражена
        в compensation_*.
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "homework_type_status": "<defined / not_defined>",
          "homework_type_value": "<текст / 'Данные не определены'>",
          "equipment_status": "<defined / not_defined>",
          "equipment_value": "<текст / 'Данные не определены'>",
          "materials_status": "<defined / not_defined>",
          "materials_value": "<текст / 'Данные не определены'>",
          "compensation_status": "<defined / not_defined>",
          "compensation_value": "<текст / 'согласно <документ>' / 'не предусмотрена' / 'Данные не определены'>",
          "interaction_status": "<defined / not_defined>",
          "interaction_value": "<текст / 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 800

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "надомник надомная работа на дому инструменты оборудование материалы сырьё компенсация за износ использование имущества работника порядок взаимодействия приёмка работы"
      preferred_unit_types:
        - obligation
        - general_provision
        - definition
      excluded_unit_types:
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
        - definitions
      boost_keywords:
        - "надомная работа"
        - "на дому"
        - "компенсация за износ"
        - "оборудование"
      negative_keywords:
        - "трудовая функция"
        - "оклад"
        - "конфиденциальность"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 0.40]
        boost: 0.20
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
        - "definitions"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1200

      compact_output: false

      presence_signal:
        field: "homeworker_specifics_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по трудовому праву. Извлеки из трудового договора
        сведения о надомной работе.
        Не анализируй оплату труда или расторжение.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 10 полей + evidence (всего 11 ключей):

        0. homeworker_specifics_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (homework_type_status, equipment_status, materials_status,
              compensation_status, interaction_status) ≠ "not_defined";
           - "missing" — если все пять содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - все пять *_status = "not_defined";
           - все *_value = "Данные не определены";
           - не выполняй остальные шаги.

        1. homework_type_status — "defined" или "not_defined".
        2. homework_type_value — указание на надомный характер.
        3. equipment_status — "defined" или "not_defined".
        4. equipment_value — оборудование и инструменты.
        5. materials_status — "defined" или "not_defined".
        6. materials_value — материалы и сырьё.
        7. compensation_status — "defined" или "not_defined".
        8. compensation_value — компенсация за использование имущества работника.
        9. interaction_status — "defined" или "not_defined".
        10. interaction_value — порядок взаимодействия и приёмки работы.

        Если данные отсутствуют:
        - для *_status — "not_defined"
        - для *_value — "Данные не определены"
        </task>

        <context_rules>
        - Перед остальными полями заполни homeworker_specifics_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_value = "Данные не определены".
        - Используй только текст договора.
        - Надомная работа — не то же, что дистанционная (ст. 312.1 ТК РФ).
        - Если условия определяются через отсылку к документу — фиксируй
          как "defined" со значением «согласно <документ>».
        - Если в разных фрагментах указаны разные данные и конфликт нельзя
          разрешить по тексту — статус → "not_defined", значение → "Не удалось определить".
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни надомного характера, ни оборудования,
           ни материалов, ни компенсации, ни порядка взаимодействия.
           → presence = "missing";
             все пять *_status = "not_defined";
             все *_value = "Данные не определены".

        2. Указан только надомный характер работы.
           Есть указание на надомную работу, но без раскрытия
           оборудования, материалов, компенсации и взаимодействия.
           → presence = "present";
             homework_type_status = "defined";
             остальные *_status = "not_defined";
             соответствующие *_value = "Данные не определены".

        3. Противоречие между фрагментами.
           В разных частях договора указано разное, чьё оборудование
           или материалы используются.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             соответствующее *_value = "Не удалось определить".

        4. Отсылка на документ / регламент.
           Порядок взаимодействия или компенсация определяются
           отдельным документом (Приложение, Регламент, Соглашение).
           → presence = "present";
             соответствующий *_status = "defined";
             соответствующее *_value содержит формулировку вида
             «согласно Регламенту (Приложение №N)».
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для homeworker_specifics_check_presence используй только: "present", "missing", "unclear".
        - Для всех *_status используй только: "defined" или "not_defined".
        - Fallback при отсутствии данных:
          * все *_value → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_value → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "homeworker_specifics_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие условий о надомной работе. Внутреннее агрегатное signal-поле."
          required: true

        - name: "homework_type_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания надомного характера работы. Внутреннее enum-поле."
          required: true

        - name: "homework_type_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Надомная работа"
          description: >
            Указание на надомный характер работы. Fallback: "Не установлено" / "Не удалось определить".
          required: true

        - name: "equipment_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус обеспечения оборудованием. Внутреннее enum-поле."
          required: true

        - name: "equipment_value"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Оборудование и инструменты"
          description: >
            Оборудование и инструменты, используемые работником. Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "materials_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус обеспечения материалами. Внутреннее enum-поле."
          required: true

        - name: "materials_value"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Материалы и сырьё"
          description: >
            Материалы и сырьё, используемые работником. Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "compensation_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус компенсации за использование имущества. Внутреннее enum-поле."
          required: true

        - name: "compensation_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Компенсация за имущество"
          description: >
            Компенсация за использование имущества работника. Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "interaction_status"
          type: "string"
          presentation: "signal"
          risk_weight: "low"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус порядка взаимодействия. Внутреннее enum-поле."
          required: true

        - name: "interaction_value"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Порядок взаимодействия"
          description: >
            Порядок взаимодействия и приёмки работы. Fallback: "Не установлено" / "Не удалось определить".
          required: false

      store_payload: true

  - id: compliance_and_conflict_check
    name: "Комплаенс и конфликт интересов"
    description: >
      Фактографическая проверка условий о соблюдении Кодекса деловой этики,
      антикоррупционных оговорок, порядке уведомления о конфликте интересов,
      ограничениях на совместительство / участие в других организациях,
      а также о разрешении конфликта интересов.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "medium"
    severity_if_pass: "pass"
    severity_if_fail: "medium"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "Кодекс деловой этики"
        - "корпоративная этика"
        - "антикоррупционная оговорка"
        - "антикоррупция"
        - "конфликт интересов"
        - "аффилированность"
        - "уведомление о конфликте"
        - "комплаенс"
        - "подарки"
        - "откаты"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)конфликт[а-яё]*\\s+интерес"
        - "(?i)антикоррупц"
        - "(?i)Кодекс[а-яё]*\\s+деловой\\s+этик"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по трудовому праву.
        Анализируется трудовой договор.
        Проверяется только один вопрос: комплаенс и конфликт интересов.
        Нормативный ориентир:
        - ст. 57 ТК РФ — содержание трудового договора (дополнительные условия)
        - ст. 275 ТК РФ — дополнительные условия для руководителя организации
        - ФЗ от 25.12.2008 № 273-ФЗ — противодействие коррупции
        - ФЗ от 07.05.2013 № 79-ФЗ — запреты для отдельных категорий
        - Локальные акты (Кодекс деловой этики, Антикоррупционная политика)
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска, не подставляй нормы закона вместо текста.
        - Комплаенс-условия — типовые для крупных работодателей.
        [ЗАДАЧА]
        Найди в тексте договора:
        1. Условие о соблюдении Кодекса деловой этики / ЛНА.
        2. Антикоррупционную оговорку.
        3. Порядок уведомления о конфликте интересов.
        4. Ограничения на участие в других организациях / совместительство
        в конкурентах.
        5. Порядок разрешения конфликта интересов.
        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона вместо текста.
        2. Для *_status используй строго "defined" или "not_defined".
        3. Для *_value при отсутствии данных — строго "Данные не определены".
        4. code_of_ethics_* фиксирует условие о соблюдении Кодекса деловой этики
        или иных ЛНА.
        5. anti_corruption_* фиксирует антикоррупционную оговорку.
        6. conflict_notification_* фиксирует обязанность уведомлять о конфликте
        интересов.
        7. participation_restrictions_* фиксирует ограничения на участие в других
        организациях / совместительство в конкурентах.
        8. conflict_resolution_* фиксирует порядок разрешения конфликта интересов.
        9. Если условие определяется через отсылку к документу (Кодекс деловой
        этики, Антикоррупционная политика) — фиксируй как "defined"
        со значением «согласно <документ>».
        10. В evidence включай только текст договора.
        11. Никогда не используй "None", "null", пустые строки или отсутствующие ключи.
        12. Верни РОВНО один валидный JSON-объект со всеми 11 ключами (10 полей + evidence),
        пригодный для парсинга через json.loads без предварительной обработки.
        Без markdown, без ```json, без комментариев, без текста до или после.
        Начни ответ сразу с { и закончи }.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — комплаенс, полная структура:
        Фрагмент:
        "Работник обязуется соблюдать Кодекс деловой этики и Антикоррупционную
        политику работодателя. Работник обязуется уведомлять работодателя
        о возникновении конфликта интересов. Работник не вправе участвовать
        в органах управления конкурентов."
        Ответ:
        {
          "code_of_ethics_status": "defined",
          "code_of_ethics_value": "Кодекс деловой этики и Антикоррупционная политика работодателя",
          "anti_corruption_status": "defined",
          "anti_corruption_value": "Антикоррупционная политика работодателя",
          "conflict_notification_status": "defined",
          "conflict_notification_value": "обязанность уведомлять о возникновении конфликта интересов",
          "participation_restrictions_status": "defined",
          "participation_restrictions_value": "не вправе участвовать в органах управления конкурентов",
          "conflict_resolution_status": "not_defined",
          "conflict_resolution_value": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 7.1",
              "quote": "Работник обязуется соблюдать Кодекс деловой этики и Антикоррупционную политику работодателя."
            }
          ]
        }
        Пример 2 — только антикоррупционная оговорка:
        Фрагмент:
        "Работник обязуется не совершать действий, связанных с коррупцией,
        не давать и не получать взятки, не участвовать в коммерческом подкупе."
        Ответ:
        {
          "code_of_ethics_status": "not_defined",
          "code_of_ethics_value": "Данные не определены",
          "anti_corruption_status": "defined",
          "anti_corruption_value": "не совершать действий, связанных с коррупцией, не давать и не получать взятки, не участвовать в коммерческом подкупе",
          "conflict_notification_status": "not_defined",
          "conflict_notification_value": "Данные не определены",
          "participation_restrictions_status": "not_defined",
          "participation_restrictions_value": "Данные не определены",
          "conflict_resolution_status": "not_defined",
          "conflict_resolution_value": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 7.2",
              "quote": "Работник обязуется не совершать действий, связанных с коррупцией."
            }
          ]
        }
        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Работник выполняет свои обязанности в соответствии с договором."
        Ответ:
        {
          "code_of_ethics_status": "not_defined",
          "code_of_ethics_value": "Данные не определены",
          "anti_corruption_status": "not_defined",
          "anti_corruption_value": "Данные не определены",
          "conflict_notification_status": "not_defined",
          "conflict_notification_value": "Данные не определены",
          "participation_restrictions_status": "not_defined",
          "participation_restrictions_value": "Данные не определены",
          "conflict_resolution_status": "not_defined",
          "conflict_resolution_value": "Данные не определены",
          "evidence": []
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Проверь, что все 11 ключей (10 полей + evidence) присутствуют в JSON.
        2. Проверь, что каждый *_status ∈ {"defined", "not_defined"}, а каждый *_value
        при отсутствии данных = "Данные не определены".
        3. Проверь, что для каждого defined-поля в evidence есть прямая цитата из договора.
        4. Убедись, что отсылки к Кодексу деловой этики / Антикоррупционной политике /
        ЛНА фиксированы как defined со значением «согласно <документ>».
        5. Убедись, что обязанность уведомлять о конфликте интересов отражена
        в conflict_notification_*, а не в code_of_ethics_*.
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "code_of_ethics_status": "<defined / not_defined>",
          "code_of_ethics_value": "<текст / 'согласно <документ>' / 'Данные не определены'>",
          "anti_corruption_status": "<defined / not_defined>",
          "anti_corruption_value": "<текст / 'согласно <документ>' / 'Данные не определены'>",
          "conflict_notification_status": "<defined / not_defined>",
          "conflict_notification_value": "<текст / 'Данные не определены'>",
          "participation_restrictions_status": "<defined / not_defined>",
          "participation_restrictions_value": "<текст / 'Данные не определены'>",
          "conflict_resolution_status": "<defined / not_defined>",
          "conflict_resolution_value": "<текст / 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 800

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "Кодекс деловой этики корпоративная этика антикоррупционная оговорка антикоррупция конфликт интересов аффилированность уведомление о конфликте комплаенс подарки откаты участие в других организациях"
      preferred_unit_types:
        - obligation
        - general_provision
        - definition
      excluded_unit_types:
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - boilerplate
        - definitions
      boost_keywords:
        - "Кодекс деловой этики"
        - "антикоррупционная"
        - "конфликт интересов"
        - "Антикоррупционная политика"
      negative_keywords:
        - "трудовая функция"
        - "оклад"
        - "заработная плата"
        - "рабочее время"
        - "конфиденциальность"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.40, 0.85]
        boost: 0.30
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "boilerplate"
        - "definitions"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1200

      compact_output: false

      presence_signal:
        field: "compliance_and_conflict_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по трудовому праву. Извлеки из трудового договора
        сведения о комплаенс-условиях и конфликте интересов.
        Не анализируй оплату труда или расторжение.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 10 полей + evidence (всего 11 ключей):

        0. compliance_and_conflict_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (code_of_ethics_status, anti_corruption_status,
              conflict_notification_status, participation_restrictions_status,
              conflict_resolution_status) ≠ "not_defined";
           - "missing" — если все пять содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - все пять *_status = "not_defined";
           - все *_value = "Данные не определены";
           - не выполняй остальные шаги.

        1. code_of_ethics_status — "defined" или "not_defined".
        2. code_of_ethics_value — Кодекс деловой этики / ЛНА.
        3. anti_corruption_status — "defined" или "not_defined".
        4. anti_corruption_value — антикоррупционная оговорка.
        5. conflict_notification_status — "defined" или "not_defined".
        6. conflict_notification_value — уведомление о конфликте интересов.
        7. participation_restrictions_status — "defined" или "not_defined".
        8. participation_restrictions_value — ограничения на участие в других организациях.
        9. conflict_resolution_status — "defined" или "not_defined".
        10. conflict_resolution_value — порядок разрешения конфликта интересов.

        Если данные отсутствуют:
        - для *_status — "not_defined"
        - для *_value — "Данные не определены"
        </task>

        <context_rules>
        - Перед остальными полями заполни compliance_and_conflict_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_value = "Данные не определены".
        - Используй только текст договора.
        - Если условие определяется через отсылку к документу — фиксируй
          как "defined" со значением «согласно <документ>».
        - Если в разных фрагментах указаны разные данные и конфликт нельзя
          разрешить по тексту — статус → "not_defined", значение → "Не удалось определить".
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни Кодекса деловой этики, ни антикоррупционной оговорки,
           ни конфликта интересов, ни ограничений на участие.
           → presence = "missing";
             все пять *_status = "not_defined";
             все *_value = "Данные не определены".

        2. Только антикоррупционная оговорка.
           Есть антикоррупционная оговорка, но нет Кодекса деловой этики,
           конфликта интересов и ограничений участия.
           → presence = "present";
             anti_corruption_status = "defined";
             остальные *_status = "not_defined";
             соответствующие *_value = "Данные не определены".

        3. Противоречие между фрагментами.
           В разных частях договора указаны противоречащие обязанности
           по уведомлению о конфликте интересов.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             соответствующее *_value = "Не удалось определить".

        4. Отсылка на Кодекс деловой этики / Антикоррупционную политику.
           Условия комплаенса определяются отдельным документом.
           → presence = "present";
             code_of_ethics_status = "defined";
             code_of_ethics_value содержит формулировку вида
             «согласно Кодексу деловой этики».
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для compliance_and_conflict_check_presence используй только: "present", "missing", "unclear".
        - Для всех *_status используй только: "defined" или "not_defined".
        - Fallback при отсутствии данных:
          * все *_value → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_value → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "compliance_and_conflict_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие комплаенс-условий и положений о конфликте интересов. Внутреннее агрегатное signal-поле."
          required: true

        - name: "code_of_ethics_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус условия о Кодексе деловой этики. Внутреннее enum-поле."
          required: true

        - name: "code_of_ethics_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Кодекс деловой этики"
          description: >
            Условие о соблюдении Кодекса деловой этики / ЛНА. Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "anti_corruption_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус антикоррупционной оговорки. Внутреннее enum-поле."
          required: true

        - name: "anti_corruption_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Антикоррупционная оговорка"
          description: >
            Антикоррупционная оговорка. Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "conflict_notification_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус обязанности уведомлять о конфликте интересов. Внутреннее enum-поле."
          required: true

        - name: "conflict_notification_value"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Уведомление о конфликте"
          description: >
            Обязанность уведомлять о конфликте интересов. Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "participation_restrictions_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус ограничений на участие в других организациях. Внутреннее enum-поле."
          required: true

        - name: "participation_restrictions_value"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Ограничения участия"
          description: >
            Ограничения на участие в других организациях. Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "conflict_resolution_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус порядка разрешения конфликта интересов. Внутреннее enum-поле."
          required: true

        - name: "conflict_resolution_value"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Разрешение конфликта"
          description: >
            Порядок разрешения конфликта интересов. Fallback: "Не установлено" / "Не удалось определить".
          required: false

      store_payload: true

  - id: ip_assignment_check
    name: "Принадлежность прав на служебные произведения и объекты IP"
    description: >
      Фактографическая проверка условий о принадлежности исключительных прав
      на результаты интеллектуальной деятельности, созданные работником
      в связи с трудовыми обязанностями (ст. 1295 ГК РФ — служебное произведение;
      ст. 1370 ГК РФ — служебное изобретение; ст. 1470 ГК РФ — служебный
      секрет производства). Критично для M&A: без явной оговорки в договоре
      IP-права могут остаться за работником.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "служебное произведение"
        - "служебное изобретение"
        - "служебная разработка"
        - "результат интеллектуальной деятельности"
        - "исключительное право"
        - "принадлежит работодателю"
        - "интеллектуальная собственность"
        - "ноу-хау"
        - "секрет производства"
        - "программное обеспечение"
        - "изобретение"
        - "полезная модель"
        - "промышленный образец"
        - "авторское вознаграждение"
        - "вознаграждение за служебное произведение"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)служебн[а-яё]+\\s+(произведени|изобретени|разработк)"
        - "(?i)исключительн[а-яё]+\\s+прав[а-яё]*\\s+(принадлежат|остаются|переходят)"
        - "(?i)интеллектуальн[а-яё]+\\s+собственност"
        - "(?i)(ноу[\\s-]?хау|секрет[а-яё]*\\s+производства)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по трудовому праву и интеллектуальной собственности.
        Анализируется трудовой договор (ст. 1295, 1370, 1470 ГК РФ; ст. 57 ТК РФ).
        Проверяется только один вопрос: принадлежность прав на служебные
        произведения и иные объекты IP, созданные работником.
        Нормативный ориентир:
        - ст. 1295 ГК РФ — служебное произведение: исключительное право
        принадлежит работодателю, если трудовым договором не предусмотрено иное.
        - ст. 1370 ГК РФ — служебное изобретение, полезная модель,
        промышленный образец: исключительное право принадлежит работодателю.
        - ст. 1470 ГК РФ — служебный секрет производства (ноу-хау).
        - ст. 1228, 1229 ГК РФ — авторство и исключительное право.
        - ст. 57 ТК РФ — дополнительные условия трудового договора.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска, не подставляй нормы закона вместо текста.
        - Для M&A критично: если IP-права не закреплены явно за работодателем,
        при смене контроля могут возникнуть споры о принадлежности ключевых
        активов.
        - Различай:
          1) Общая оговорка о принадлежности всех служебных результатов
             работодателю;
          2) Указание конкретных типов объектов (ПО, изобретения, ноу-хау,
             дизайн, контент);
          3) Условие о вознаграждении за служебные произведения;
          4) Оговорка об IP, созданных до трудоустройства (prior IP).
        [ЗАДАЧА]
        Найди в тексте договора:
        1. Общую оговорку о принадлежности служебных результатов работодателю.
        2. Перечень типов объектов IP, на которые распространяется оговорка.
        3. Условие о вознаграждении за служебное произведение.
        4. Оговорку об исключении IP, созданных до трудоустройства.
        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона вместо текста.
        2. Для *_status используй строго "defined" или "not_defined".
        3. Для *_value при отсутствии данных — строго "Данные не определены".
        4. ip_assignment_* фиксирует общую оговорку о принадлежности служебных
        результатов работодателю.
        5. ip_scope_* фиксирует перечень типов объектов IP (ПО, изобретения,
        ноу-хау, дизайн, контент, иное).
        6. prior_ip_* фиксирует исключение IP, созданных до трудоустройства.
        7. ip_compensation_* фиксирует условие о вознаграждении за служебные
        произведения (ст. 1295 п. 2 ГК РФ).
        8. third_party_ip_* фиксирует условия о взаимодействии с IP третьих лиц
        (opensource, подрядчики, лицензии).
        9. Если условие определяется через отсылку к документу (Соглашение
        о служебных произведениях, Приложение) — фиксируй как "defined"
        со значением «согласно <документ>».
        10. В evidence включай только текст договора.
        11. Никогда не используй "None", "null", пустые строки или отсутствующие ключи.
        12. Верни РОВНО один валидный JSON-объект со всеми 11 ключами (10 полей + evidence),
        пригодный для парсинга через json.loads без предварительной обработки.
        Без markdown, без ```json, без комментариев, без текста до или после.
        Начни ответ сразу с { и закончи }.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — полная IP-оговорка:
        Фрагмент:
        "Исключительные права на все результаты интеллектуальной деятельности,
        созданные работником в связи с трудовыми обязанностями, включая
        программное обеспечение, изобретения, полезные модели, ноу-хау
        и дизайн, принадлежат работодателю. Работодатель выплачивает работнику
        вознаграждение за служебные произведения в порядке, установленном
        Положением о вознаграждении. Исключительные права на объекты,
        созданные работником до трудоустройства, остаются за работником."
        Ответ:
        {
          "ip_assignment_status": "defined",
