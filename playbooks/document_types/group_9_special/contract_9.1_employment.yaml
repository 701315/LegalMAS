        Не анализируй оплату труда, рабочее время, отпуск или охрану труда.
        </role>
        <context>
        {context}
        </context>
        <task>
        Заполни строго следующие 8 полей + evidence (всего 9 ключей):
        1. non_compete_status — "defined" или "not_defined".
        2. non_compete_value — условие о запрете конкуренции ПОСЛЕ увольнения.
        3. non_solicitation_status — "defined" или "not_defined".
        4. non_solicitation_value — условие о запрете переманивания.
        5. dispute_resolution_status — "defined" или "not_defined".
        6. dispute_resolution_value — порядок разрешения трудовых споров.
        7. collective_agreement_status — "defined" или "not_defined".
        8. collective_agreement_value — ссылка на коллективный договор.
        Если данные отсутствуют:
        - для *_status — "not_defined"
        - для *_value — "Данные не определены"
        </task>
        <rules>
        - Используй только текст договора.
        - non_compete_* фиксирует запрет конкуренции ПОСЛЕ увольнения.
        Общие ограничения в период работы (конфиденциальность, неразглашение,
        не конкурировать во время работы) — НЕ считаются non-compete.
        - non_solicitation_* фиксирует запрет привлекать / переманивать
        работников, клиентов, контрагентов работодателя.
        - Если условие определяется через отсылку к документу (Положение,
        Коллективный договор, отдельный NDA, Приложение) — фиксируй как
        "defined" со значением «согласно <документ>».
        - Не делай вывода о юридической силе non-compete в российском праве —
        только фиксируй факт наличия условия.
        - Верни РОВНО один валидный JSON-объект со всеми 9 ключами,
        без markdown и комментариев.
        </rules>
      fields:
        - name: "non_compete_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус условия о запрете конкуренции после увольнения."
          required: true
        - name: "non_compete_value"
