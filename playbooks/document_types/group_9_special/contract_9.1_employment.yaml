        - name: "termination_specifics_value"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Особенности расторжения"
          description: "Особенности расторжения договора с дистанционным работником."
          required: false

  - id: homeworker_specifics_check
    name: "Специфика надомной работы"
    description: >
      Фактографическая проверка условий надомной работы (ст. 310 ТК РФ):
      указание на надомный характер, используемое оборудование и инструменты,
      компенсация за их использование, порядок взаимодействия.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "medium"
    severity_if_pass: "pass"
    severity_if_fail: "medium"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "надомник"
        - "надомная работа"
        - "на дому"
        - "изделия на дому"
        - "инструменты"
        - "оборудование"
        - "материалы"
        - "компенсация за износ"
        - "сырьё"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)надомн"
        - "(?i)на\\s+дому"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по трудовому праву.
        Анализируется трудовой договор о надомной работе.
        Проверяется только один вопрос: условия надомной работы.
        Нормативный ориентир:
        - ст. 310 ТК РФ — надомники (лица, заключившие договор о выполнении
        работы на дому личным трудом)
        - ст. 311 ТК РФ — условия работы, при которых допускается надомный труд
        (без вредных условий, с соблюдением требований охраны труда)
        - ст. 188 ТК РФ — компенсация за использование инструментов и материалов
        работника
        - Санитарные правила — требования к жилым помещениям
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска, не подставляй нормы закона вместо текста.
        - Надомная работа — не то же, что дистанционная (ст. 312.1 ТК РФ).
        [ЗАДАЧА]
        Найди в тексте договора:
        1. Указание на надомный характер работы.
        2. Используемое оборудование и инструменты (чьи).
        3. Материалы и сырьё (чьи, кто поставляет).
        4. Компенсация за износ оборудования / материалов.
        5. Порядок взаимодействия и приёмки работы.
        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона вместо текста.
        2. Для *_status используй строго "defined" или "not_defined".
        3. Для *_value при отсутствии данных — строго "Данные не определены".
        4. homework_type_* фиксирует прямое указание на надомный характер работы.
        5. equipment_* фиксирует, чьё оборудование и инструменты используются.
        6. materials_* фиксирует, чьи материалы / сырьё используются.
        7. compensation_* фиксирует компенсацию за использование имущества работника
        (ст. 188 ТК РФ).
        8. interaction_* фиксирует порядок взаимодействия и приёмки работы.
        9. Если условия определяются через отсылку к документу — фиксируй
        как "defined" со значением «согласно <документ>».
        10. В evidence включай только текст договора.
        11. Никогда не используй "None", "null", пустые строки или отсутствующие ключи.
        12. Верни РОВНО один валидный JSON-объект со всеми 11 ключами (10 полей + evidence),
        пригодный для парсинга через json.loads без предварительной обработки.
        Без markdown, без ```json, без комментариев, без текста до или после.
        Начни ответ сразу с { и закончи }.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — надомная работа с компенсацией:
        Фрагмент:
        "Работник выполняет работу на дому. Работник использует собственное
        оборудование и инструменты. Работодатель поставляет материалы и сырьё.
        За износ оборудования работнику выплачивается компенсация
        в размере 3000 рублей в месяц."
        Ответ:
        {
          "homework_type_status": "defined",
          "homework_type_value": "выполнение работы на дому",
          "equipment_status": "defined",
          "equipment_value": "оборудование и инструменты работника",
          "materials_status": "defined",
          "materials_value": "материалы и сырьё работодателя",
          "compensation_status": "defined",
          "compensation_value": "компенсация за износ оборудования — 3000 рублей в месяц",
          "interaction_status": "not_defined",
          "interaction_value": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "Работник выполняет работу на дому."
            }
          ]
        }
        Пример 2 — оборудование работодателя:
        Фрагмент:
        "Работник выполняет надомную работу. Работодатель предоставляет
        оборудование и материалы."
        Ответ:
        {
          "homework_type_status": "defined",
          "homework_type_value": "надомная работа",
          "equipment_status": "defined",
          "equipment_value": "оборудование работодателя",
          "materials_status": "defined",
          "materials_value": "материалы работодателя",
          "compensation_status": "not_defined",
          "compensation_value": "Данные не определены",
          "interaction_status": "not_defined",
          "interaction_value": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 1.2",
              "quote": "Работник выполняет надомную работу."
            }
          ]
        }
        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Работник выполняет свои обязанности в соответствии с договором."
        Ответ:
        {
          "homework_type_status": "not_defined",
          "homework_type_value": "Данные не определены",
          "equipment_status": "not_defined",
          "equipment_value": "Данные не определены",
          "materials_status": "not_defined",
          "materials_value": "Данные не определены",
          "compensation_status": "not_defined",
          "compensation_value": "Данные не определены",
          "interaction_status": "not_defined",
          "interaction_value": "Данные не определены",
          "evidence": []
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Проверь, что все 11 ключей (10 полей + evidence) присутствуют в JSON.
        2. Проверь, что каждый *_status ∈ {"defined", "not_defined"}, а каждый *_value
        при отсутствии данных = "Данные не определены".
        3. Проверь, что для каждого defined-поля в evidence есть прямая цитата из договора.
        4. Убедись, что надомная работа не спутана с дистанционной.
        5. Убедись, что компенсация за использование имущества работника отражена
        в compensation_*.
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "homework_type_status": "<defined / not_defined>",
          "homework_type_value": "<текст / 'Данные не определены'>",
          "equipment_status": "<defined / not_defined>",
          "equipment_value": "<текст / 'Данные не определены'>",
          "materials_status": "<defined / not_defined>",
          "materials_value": "<текст / 'Данные не определены'>",
          "compensation_status": "<defined / not_defined>",
          "compensation_value": "<текст / 'согласно <документ>' / 'не предусмотрена' / 'Данные не определены'>",
          "interaction_status": "<defined / not_defined>",
          "interaction_value": "<текст / 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 800

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "надомник надомная работа на дому инструменты оборудование материалы сырьё компенсация за износ использование имущества работника порядок взаимодействия приёмка работы"
      preferred_unit_types:
        - obligation
        - general_provision
        - definition
      excluded_unit_types:
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
        - definitions
      boost_keywords:
        - "надомная работа"
        - "на дому"
        - "компенсация за износ"
        - "оборудование"
      negative_keywords:
        - "трудовая функция"
        - "оклад"
        - "конфиденциальность"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 0.40]
        boost: 0.20
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
        - "definitions"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 1200
      store_payload: true

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по трудовому праву. Извлеки из трудового договора
        сведения о надомной работе.
        Не анализируй оплату труда или расторжение.
        </role>
        <context>
        {context}
        </context>
        <task>
        Заполни строго следующие 10 полей + evidence (всего 11 ключей):
        1. homework_type_status — "defined" или "not_defined".
        2. homework_type_value — указание на надомный характер.
        3. equipment_status — "defined" или "not_defined".
        4. equipment_value — оборудование и инструменты.
        5. materials_status — "defined" или "not_defined".
        6. materials_value — материалы и сырьё.
        7. compensation_status — "defined" или "not_defined".
        8. compensation_value — компенсация за использование имущества работника.
        9. interaction_status — "defined" или "not_defined".
        10. interaction_value — порядок взаимодействия и приёмки работы.
        Если данные отсутствуют:
        - для *_status — "not_defined"
        - для *_value — "Данные не определены"
        </task>
        <rules>
        - Используй только текст договора.
        - Надомная работа — не то же, что дистанционная (ст. 312.1 ТК РФ).
        - Если условия определяются через отсылку к документу — фиксируй
        как "defined" со значением «согласно <документ>».
        - Верни РОВНО один валидный JSON-объект со всеми 11 ключами,
        без markdown и комментариев.
        </rules>
      fields:
        - name: "homework_type_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания надомного характера работы."
          required: true
        - name: "homework_type_value"
