          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус ссылки на коллективный договор."
          required: true
        - name: "collective_agreement_value"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Коллективный договор"
          description: "Ссылка на коллективный договор."
