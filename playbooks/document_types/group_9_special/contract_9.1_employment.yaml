        - name: "rights_restriction_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 5
          label: "Ограничение прав работника"
          description: >
            Условия, ограничивающие права работника по сравнению с ТК РФ. Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "final_settlement_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус условия о сроке расчёта при увольнении. Внутреннее enum-поле."
          required: true

        - name: "final_settlement_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 6
          label: "Срок расчёта при увольнении"
          description: >
            Срок окончательного расчёта при увольнении. Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "termination_agreement_payment_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус выплаты при увольнении по соглашению сторон. Внутреннее enum-поле."
          required: true

        - name: "termination_agreement_payment_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 7
          label: "Выплата по соглашению"
          description: >
            Выплата при увольнении по соглашению сторон. Fallback: "Не установлено" / "Не удалось определить".
          required: false

      store_payload: true

  - id: non_compete_disputes_check
    name: "Запрет конкуренции, разрешение споров и коллективный договор"
    description: >
      Фактографическая проверка наличия условий о запрете конкуренции (non-compete)
      после увольнения, запрета переманивания (non-solicitation), порядка
      разрешения трудовых споров (переговоры, КТС, медиация) и ссылки
      на коллективный договор.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "запрет конкуренции"
        - "не конкурировать"
        - "не трудоустраиваться в конкурирующую"
        - "не работать у конкурентов"
        - "ограничение трудоустройства"
        - "конкурирующая организация"
        - "запрет переманивания"
        - "не привлекать работников"
        - "досудебный порядок"
        - "переговоры"
        - "комиссия по трудовым спорам"
        - "КТС"
        - "медиация"
        - "коллективный договор"
        - "положения коллективного договора"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)запрет.*конкуренц"
        - "(?i)non[\\s-]?compete"
        - "(?i)non[\\s-]?solicit"
        - "(?i)не\\s+(трудоустраиваться|работать).*конкурент"
        - "(?i)комисси[яи]\\s+по\\s+трудовым\\s+спорам"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по трудовому праву.
        Анализируется трудовой договор.
        Проверяется только один вопрос: non-compete (запрет конкуренции),
        non-solicitation (запрет переманивания), разрешение трудовых споров
        и коллективный договор.
        Нормативный ориентир:
        - ст. 37 Конституции РФ — свобода труда, право свободно распоряжаться
        своими способностями к труду
        - ст. 2, 3, 9 ТК РФ — запрет дискриминации и ухудшения положения работника,
        запрет ограничения прав
        - ст. 349.1, 349.3 ТК РФ — специальные ограничения для отдельных категорий
        работников (госкомпании, госкорпорации, отдельные ФЗ)
        - ст. 382, 384–390 ТК РФ — индивидуальные трудовые споры, КТС
        - ст. 40–44 ТК РФ — коллективный договор
        ВАЖНО (правовая реальность РФ):
        - Условие о запрете работы у конкурента после увольнения (non-compete),
        установленное в трудовом договоре с ОБЫЧНЫМ работником, как правило,
        НИЧТОЖНО — оно ограничивает конституционное право на труд (ст. 37
        Конституции РФ, ст. 2, 3, 9 ТК РФ). Такое условие исполнимо только
        для отдельных категорий (руководитель организации, ст. 349.1, 349.3 ТК РФ).
        - Фиксируй наличие условия как ФАКТ, не делая вывода о его исполнимости.
        [ЗАДАЧА]
        Найди в тексте договора:
        1. Условие о запрете конкуренции (non-compete) после увольнения.
        2. Условие о запрете переманивания (non-solicitation).
        3. Порядок разрешения трудовых споров (переговоры, КТС, медиация, суд).
        4. Ссылку на коллективный договор.
        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона вместо текста.
        2. Для *_status используй строго "defined" или "not_defined".
        3. Для *_value при отсутствии данных — строго "Данные не определены".
        4. non_compete_* фиксирует наличие условия о запрете конкуренции
        ПОСЛЕ УВОЛЬНЕНИЯ. Ограничения в период работы (конфиденциальность,
        неразглашение) — не относятся к non-compete и не учитываются здесь.
        5. non_solicitation_* фиксирует запрет привлекать / переманивать
        работников, клиентов, контрагентов работодателя.
        6. Если условие о non-compete / non-solicitation / разрешении споров
        определяется через отсылку к документу (Положение, Коллективный договор,
        отдельный NDA, Приложение) — фиксируй как "defined" со значением
        «согласно <документ>».
        7. Не делай вывода о юридической силе non-compete в российском праве —
        только фиксируй факт наличия условия.
        8. В evidence включай только текст договора.
        9. Никогда не используй "None", "null", пустые строки или отсутствующие ключи.
        10. Верни РОВНО один валидный JSON-объект со всеми 9 ключами (8 полей + evidence),
        пригодный для парсинга через json.loads без предварительной обработки.
        Без markdown, без ```json, без комментариев, без текста до или после.
        Начни ответ сразу с { и закончи }.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — non-compete + споры + коллективный договор:
        Фрагмент:
        "Работник обязуется в течение 2 лет после увольнения не трудоустраиваться
        в конкурирующие организации. Споры разрешаются путём переговоров,
        а при недостижении согласия — в комиссии по трудовым спорам.
        Условия коллективного договора распространяются на Работника."
        Ответ:
        {
          "non_compete_status": "defined",
          "non_compete_value": "в течение 2 лет после увольнения не трудоустраиваться в конкурирующие организации",
          "non_solicitation_status": "not_defined",
          "non_solicitation_value": "Данные не определены",
          "dispute_resolution_status": "defined",
          "dispute_resolution_value": "путём переговоров, а при недостижении согласия — в комиссии по трудовым спорам",
          "collective_agreement_status": "defined",
          "collective_agreement_value": "условия коллективного договора распространяются на Работника",
          "evidence": [
            {
              "clause_ref": "п. 7.1",
              "quote": "Работник обязуется в течение 2 лет после увольнения не трудоустраиваться в конкурирующие организации."
            }
          ]
        }
        Пример 2 — отсылка к локальному акту:
        Фрагмент:
        "Ограничения, связанные с конкуренцией, установлены Положением
        о защите коммерческой тайны. Трудовые споры рассматриваются
        в порядке, установленном ТК РФ. Коллективный договор на работника
        не распространяется."
        Ответ:
        {
          "non_compete_status": "defined",
          "non_compete_value": "согласно Положению о защите коммерческой тайны",
          "non_solicitation_status": "not_defined",
          "non_solicitation_value": "Данные не определены",
          "dispute_resolution_status": "defined",
          "dispute_resolution_value": "в порядке, установленном ТК РФ",
          "collective_agreement_status": "defined",
          "collective_agreement_value": "не распространяется на работника",
          "evidence": [
            {
              "clause_ref": "п. 8.2",
              "quote": "Ограничения, связанные с конкуренцией, установлены Положением о защите коммерческой тайны."
            }
          ]
        }
        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Работник выполняет свои обязанности в соответствии с договором."
        Ответ:
        {
          "non_compete_status": "not_defined",
          "non_compete_value": "Данные не определены",
          "non_solicitation_status": "not_defined",
          "non_solicitation_value": "Данные не определены",
          "dispute_resolution_status": "not_defined",
          "dispute_resolution_value": "Данные не определены",
          "collective_agreement_status": "not_defined",
          "collective_agreement_value": "Данные не определены",
          "evidence": []
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Проверь, что все 9 ключей (8 полей + evidence) присутствуют в JSON.
        2. Проверь, что каждый *_status ∈ {"defined", "not_defined"}, а каждый *_value
        при отсутствии данных = "Данные не определены".
        3. Проверь, что для каждого defined-поля в evidence есть прямая цитата из договора.
        4. Убедись, что non_compete_* отражает запрет ПОСЛЕ увольнения, а не общие
        ограничения в период работы (конфиденциальность, неразглашение).
        5. Убедись, что отсылки к Положению / Коллективному договору / отдельному NDA
        фиксированы как defined со значением «согласно <документ>».
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "non_compete_status": "<defined / not_defined>",
          "non_compete_value": "<текст / 'согласно <документ>' / 'Данные не определены'>",
          "non_solicitation_status": "<defined / not_defined>",
          "non_solicitation_value": "<текст / 'согласно <документ>' / 'Данные не определены'>",
          "dispute_resolution_status": "<defined / not_defined>",
          "dispute_resolution_value": "<порядок / 'Данные не определены'>",
          "collective_agreement_status": "<defined / not_defined>",
          "collective_agreement_value": "<текст / 'не распространяется' / 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 800

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "запрет конкуренции non-compete не конкурировать конкурирующая организация запрет переманивания non-solicitation не трудоустраиваться в конкурирующую ограничение трудоустройства досудебный порядок переговоры комиссия по трудовым спорам КТС медиация коллективный договор положения коллективного договора"
      preferred_unit_types:
        - obligation
        - general_provision
        - definition
      excluded_unit_types:
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - boilerplate
        - limitations
        - definitions
      boost_keywords:
        - "запрет конкуренции"
        - "конкурирующая организация"
        - "запрет переманивания"
        - "комиссия по трудовым спорам"
        - "коллективный договор"
      negative_keywords:
        - "трудовая функция"
        - "место работы"
        - "оклад"
        - "заработная плата"
        - "отпуск"
        - "рабочее время"
        - "материальная ответственность"
        - "конфиденциальность"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.55, 1.0]
        boost: 0.30
        scope: segment
      context_k: 10
      max_chunks: 12
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "boilerplate"
        - "limitations"
        - "definitions"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1100

      compact_output: false

      presence_signal:
        field: "non_compete_disputes_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по трудовому праву. Извлеки из трудового договора
        сведения о non-compete, non-solicitation, порядке разрешения трудовых
        споров и коллективном договоре.
        Не анализируй оплату труда, рабочее время, отпуск или охрану труда.
        Не оценивай риски и юридическую силу non-compete.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 8 полей + evidence (всего 9 ключей):

        0. non_compete_disputes_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (non_compete_status, non_solicitation_status,
              dispute_resolution_status, collective_agreement_status) ≠ "not_defined";
           - "missing" — если все четыре содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - все четыре *_status = "not_defined";
           - все *_value = "Данные не определены";
           - не выполняй остальные шаги.

        1. non_compete_status — "defined" или "not_defined".
        2. non_compete_value — условие о запрете конкуренции ПОСЛЕ увольнения.
        3. non_solicitation_status — "defined" или "not_defined".
        4. non_solicitation_value — условие о запрете переманивания.
        5. dispute_resolution_status — "defined" или "not_defined".
        6. dispute_resolution_value — порядок разрешения трудовых споров.
        7. collective_agreement_status — "defined" или "not_defined".
        8. collective_agreement_value — ссылка на коллективный договор.

        Если данные отсутствуют:
        - для *_status — "not_defined"
        - для *_value — "Данные не определены"
        </task>

        <context_rules>
        - Перед остальными полями заполни non_compete_disputes_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_value = "Данные не определены".
        - Используй только текст договора.
        - non_compete_* фиксирует запрет конкуренции ПОСЛЕ увольнения.
          Общие ограничения в период работы (конфиденциальность, неразглашение,
          не конкурировать во время работы) — НЕ считаются non-compete.
        - non_solicitation_* фиксирует запрет привлекать / переманивать
          работников, клиентов, контрагентов работодателя.
        - Если условие определяется через отсылку к документу (Положение,
          Коллективный договор, отдельный NDA, Приложение) — фиксируй как
          "defined" со значением «согласно <документ>».
        - Не делай вывода о юридической силе non-compete в российском праве —
          только фиксируй факт наличия условия.
        - Если в разных фрагментах указаны разные данные и конфликт нельзя
          разрешить по тексту — статус → "not_defined", значение → "Не удалось определить".
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни non-compete, ни non-solicitation,
           ни порядка разрешения споров, ни ссылки на коллективный договор.
           → presence = "missing";
             все четыре *_status = "not_defined";
             все *_value = "Данные не определены".

        2. Частичное раскрытие темы.
           Указан только порядок разрешения споров, но нет non-compete,
           non-solicitation и коллективного договора.
           → presence = "present";
             dispute_resolution_status = "defined";
             остальные *_status = "not_defined";
             соответствующие *_value = "Данные не определены".

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные сроки non-compete
           или противоречащие условия разрешения споров.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             соответствующее *_value = "Не удалось определить".

        4. Отсылка на Положение / Коллективный договор / отдельный NDA.
           Условия о конкуренции или разрешении споров определяются
           отдельным документом.
           → presence = "present";
             соответствующий *_status = "defined";
             соответствующее *_value содержит формулировку вида
             «согласно Положению о коммерческой тайне».
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для non_compete_disputes_check_presence используй только: "present", "missing", "unclear".
        - Для всех *_status используй только: "defined" или "not_defined".
        - Fallback при отсутствии данных:
          * все *_value → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_value → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "non_compete_disputes_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие условий о non-compete, разрешении споров и коллективном договоре. Внутреннее агрегатное signal-поле."
          required: true

        - name: "non_compete_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус условия о запрете конкуренции после увольнения. Внутреннее enum-поле."
          required: true

        - name: "non_compete_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Запрет конкуренции (non-compete)"
          description: >
            Условие о запрете конкуренции после увольнения. Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "non_solicitation_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус условия о запрете переманивания. Внутреннее enum-поле."
          required: true

        - name: "non_solicitation_value"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Запрет переманивания (non-solicitation)"
          description: >
            Условие о запрете переманивания. Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "dispute_resolution_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус определения порядка разрешения споров. Внутреннее enum-поле."
          required: true

        - name: "dispute_resolution_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Разрешение споров"
          description: >
            Порядок разрешения трудовых споров. Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "collective_agreement_status"
          type: "string"
          presentation: "signal"
          risk_weight: "low"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус ссылки на коллективный договор. Внутреннее enum-поле."
          required: true

        - name: "collective_agreement_value"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Коллективный договор"
          description: >
            Ссылка на коллективный договор. Fallback: "Не установлено" / "Не удалось определить".
          required: false

      store_payload: true

  - id: salary_deductions_check
    name: "Удержания из заработной платы"
    description: >
      Фактографическая проверка оснований и пределов удержаний из заработной платы
      (ст. 137–138 ТК РФ): общий лимит 20%, специальные случаи 50% и 70%,
      перечень оснований, удержания, не предусмотренные ТК РФ.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "удержание"
        - "удержания из заработной платы"
        - "удержать"
        - "вычет"
        - "возмещение ущерба"
        - "неотработанный аванс"
        - "исполнительный лист"
        - "алименты"
        - "20%"
        - "50%"
        - "70%"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)удержани[еяй].*заработн"
        - "(?i)\\b(20|50|70)\\s*%"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по трудовому праву.
        Анализируется трудовой договор.
        Проверяется только один вопрос: удержания из заработной платы.
        Нормативный ориентир:
        - ст. 137 ТК РФ — удержания: основания (возмещение неотработанного аванса,
        погашение неизрасходованного и своевременно не возвращённого аванса,
        возврат излишне выплаченных сумм, возмещение ущерба)
        - ст. 138 ТК РФ — пределы удержаний (общий лимит 20%, специальные
        случаи по ФЗ — 50%, удержания по исполнительным документам — до 70%)
        - ст. 248 ТК РФ — взыскание ущерба
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска, не подставляй нормы закона вместо текста.
        - Удержания, предусмотренные ТК РФ, фиксируй как "defined" в соответствующих полях.
        [ЗАДАЧА]
        Найди в тексте договора:
        1. Общее правило об удержаниях из заработной платы (основания, лимит).
        2. Указание на специальные случаи удержаний (50% / 70%).
        3. Перечень оснований удержаний.
        4. Удержания, не предусмотренные ТК РФ (например, штрафы за опоздания).
        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона вместо текста.
        2. Для *_status используй строго "defined" или "not_defined".
        3. Для *_value при отсутствии данных — строго "Данные не определены".
        4. Для deductions_general_*: "defined" если в тексте есть общее правило
        об удержаниях.
        5. Для deductions_special_*: "defined" только если прямо указаны
        специальные случаи (алименты, возмещение ущерба при полной МО, иные ФЗ).
        6. Для deductions_basis_*: перечень оснований, прямо указанных в договоре.
        7. Для deductions_nonstatutory_*: "defined" если прямо указаны удержания,
        не предусмотренные ТК РФ (штрафы за опоздания, за отказ от работы и т.п.).
        8. Если правило об удержаниях определяется через отсылку к документу
        (Положение, Коллективный договор) — фиксируй как "defined" со значением
        «согласно <документ>».
        9. В evidence включай только текст договора.
        10. Никогда не используй "None", "null", пустые строки или отсутствующие ключи.
        11. Верни РОВНО один валидный JSON-объект со всеми 9 ключами (8 полей + evidence),
        пригодный для парсинга через json.loads без предварительной обработки.
        Без markdown, без ```json, без комментариев, без текста до или после.
        Начни ответ сразу с { и закончи }.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — общее правило + специальные случаи:
        Фрагмент:
        "Из заработной платы работника могут производиться удержания в случаях,
        предусмотренных ТК РФ, с соблюдением лимита 20%. При взыскании алиментов
        и возмещении ущерба при полной материальной ответственности удержания
        могут достигать 50%."
        Ответ:
        {
          "deductions_general_status": "defined",
          "deductions_general_value": "удержания в случаях, предусмотренных ТК РФ, лимит 20%",
          "deductions_special_status": "defined",
          "deductions_special_value": "алименты и возмещение ущерба при полной МО — до 50%",
          "deductions_basis_status": "defined",
          "deductions_basis_value": "случаи, предусмотренные ТК РФ",
          "deductions_nonstatutory_status": "not_defined",
          "deductions_nonstatutory_value": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 6.3",
              "quote": "Из заработной платы работника могут производиться удержания в случаях, предусмотренных ТК РФ, с соблюдением лимита 20%."
            }
          ]
        }
        Пример 2 — не предусмотренные ТК РФ удержания:
        Фрагмент:
        "Работодатель вправе удерживать из заработной платы работника штраф
        за опоздание в размере 500 рублей за каждый случай."
        Ответ:
        {
          "deductions_general_status": "not_defined",
          "deductions_general_value": "Данные не определены",
          "deductions_special_status": "not_defined",
          "deductions_special_value": "Данные не определены",
          "deductions_basis_status": "not_defined",
          "deductions_basis_value": "Данные не определены",
          "deductions_nonstatutory_status": "defined",
          "deductions_nonstatutory_value": "штраф за опоздание 500 рублей за каждый случай — не предусмотрено ТК РФ",
          "evidence": [
            {
              "clause_ref": "п. 6.4",
              "quote": "Работодатель вправе удерживать из заработной платы работника штраф за опоздание в размере 500 рублей за каждый случай."
            }
          ]
        }
        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Работник выполняет свои обязанности в соответствии с договором."
        Ответ:
        {
          "deductions_general_status": "not_defined",
          "deductions_general_value": "Данные не определены",
          "deductions_special_status": "not_defined",
          "deductions_special_value": "Данные не определены",
          "deductions_basis_status": "not_defined",
          "deductions_basis_value": "Данные не определены",
          "deductions_nonstatutory_status": "not_defined",
          "deductions_nonstatutory_value": "Данные не определены",
          "evidence": []
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Проверь, что все 9 ключей (8 полей + evidence) присутствуют в JSON.
        2. Проверь, что каждый *_status ∈ {"defined", "not_defined"}, а каждый *_value
        при отсутствии данных = "Данные не определены".
        3. Проверь, что для каждого defined-поля в evidence есть прямая цитата из договора.
        4. Убедись, что удержания, не предусмотренные ТК РФ (штрафы, снижение
        зарплаты), отнесены в deductions_nonstatutory_*.
        5. Убедись, что лимиты удержаний соответствуют указанным в договоре
        (не додуманы из ТК РФ).
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "deductions_general_status": "<defined / not_defined>",
          "deductions_general_value": "<текст / 'согласно <документ>' / 'Данные не определены'>",
          "deductions_special_status": "<defined / not_defined>",
          "deductions_special_value": "<текст / 'согласно <документ>' / 'Данные не определены'>",
          "deductions_basis_status": "<defined / not_defined>",
          "deductions_basis_value": "<перечень / 'Данные не определены'>",
          "deductions_nonstatutory_status": "<defined / not_defined>",
          "deductions_nonstatutory_value": "<текст / 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 750

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "удержание удержания из заработной платы удержать вычет возмещение ущерба неотработанный аванс исполнительный лист алименты лимит удержаний 20 50 70 процентов"
      preferred_unit_types:
        - obligation
        - payment_term
        - general_provision
      excluded_unit_types:
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - limitations
      boost_keywords:
        - "удержание"
        - "удержания из заработной платы"
        - "исполнительный лист"
        - "алименты"
      negative_keywords:
        - "трудовая функция"
        - "место работы"
        - "отпуск"
        - "рабочее время"
        - "увольнение"
        - "расторжение"
        - "конфиденциальность"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.30, 0.70]
        boost: 0.30
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "limitations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1200

      compact_output: false

      presence_signal:
        field: "salary_deductions_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по трудовому праву. Извлеки из трудового договора
        сведения об удержаниях из заработной платы.
        Не анализируй оклад, премии, режим работы или расторжение.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 8 полей + evidence (всего 9 ключей):

        0. salary_deductions_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (deductions_general_status, deductions_special_status,
              deductions_basis_status, deductions_nonstatutory_status) ≠ "not_defined";
           - "missing" — если все четыре содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - все четыре *_status = "not_defined";
           - все *_value = "Данные не определены";
           - не выполняй остальные шаги.

        1. deductions_general_status — "defined" или "not_defined".
        2. deductions_general_value — общее правило об удержаниях.
        3. deductions_special_status — "defined" или "not_defined".
        4. deductions_special_value — специальные случаи (50% / 70%).
        5. deductions_basis_status — "defined" или "not_defined".
        6. deductions_basis_value — перечень оснований удержаний.
        7. deductions_nonstatutory_status — "defined" или "not_defined".
        8. deductions_nonstatutory_value — удержания, не предусмотренные ТК РФ.

        Если данные отсутствуют:
        - для *_status — "not_defined"
        - для *_value — "Данные не определены"
        </task>

        <context_rules>
        - Перед остальными полями заполни salary_deductions_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_value = "Данные не определены".
        - Используй только текст договора.
        - deductions_nonstatutory_status = "defined" только если прямо указаны
          удержания, не предусмотренные ТК РФ (штрафы, снижение зарплаты и т.п.).
        - Если правило об удержаниях определяется через отсылку к документу
          (Положение, Коллективный договор) — фиксируй как "defined" со значением
          «согласно <документ>».
        - Если в разных фрагментах указаны разные данные и конфликт нельзя
          разрешить по тексту — статус → "not_defined", значение → "Не удалось определить".
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни общего правила об удержаниях, ни специальных
           случаев, ни перечня оснований, ни незаконных удержаний.
           → presence = "missing";
             все четыре *_status = "not_defined";
             все *_value = "Данные не определены".

        2. Только общее правило.
           Указаны случаи удержаний по ТК РФ, но без специальных случаев
           и без перечня оснований.
           → presence = "present";
             deductions_general_status = "defined";
             deductions_special_status = "not_defined";
             deductions_basis_status = "not_defined";
             deductions_nonstatutory_status = "not_defined";
             соответствующие *_value = "Данные не определены".

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные лимиты удержаний.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             соответствующее *_value = "Не удалось определить".

        4. Выявлены удержания, не предусмотренные ТК РФ.
           Указаны штрафы за опоздания, за отказ от работы или иные
           удержания, не предусмотренные ТК РФ.
           → presence = "present";
             deductions_nonstatutory_status = "defined";
             deductions_nonstatutory_value содержит прямую цитату.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для salary_deductions_check_presence используй только: "present", "missing", "unclear".
        - Для всех *_status используй только: "defined" или "not_defined".
        - Fallback при отсутствии данных:
          * все *_value → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_value → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "salary_deductions_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие условий об удержаниях из заработной платы. Внутреннее агрегатное signal-поле."
          required: true

        - name: "deductions_general_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус общего правила об удержаниях. Внутреннее enum-поле."
          required: true

        - name: "deductions_general_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Удержания (общее правило)"
          description: >
            Общее правило об удержаниях из заработной платы. Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "deductions_special_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус специальных случаев удержаний. Внутреннее enum-поле."
          required: true

        - name: "deductions_special_value"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Специальные случаи удержаний"
          description: >
            Специальные случаи удержаний (50% / 70%). Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "deductions_basis_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус перечня оснований удержаний. Внутреннее enum-поле."
          required: true

        - name: "deductions_basis_value"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Основания удержаний"
          description: >
            Перечень оснований удержаний. Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "deductions_nonstatutory_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: >-
            Статус выявления удержаний, не предусмотренных ТК РФ. "defined" = выявлены (негативный сигнал). Внутреннее enum-поле.
          required: true

        - name: "deductions_nonstatutory_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Незаконные удержания"
          description: >
            Удержания, не предусмотренные ТК РФ. Fallback: "Не установлено" / "Не удалось определить".
          required: false

      store_payload: true

  - id: disciplinary_liability_check
    name: "Дисциплинарная ответственность"
    description: >
      Фактографическая проверка видов дисциплинарных взысканий, порядка их применения
      (ст. 189–193 ТК РФ), а также выявления взысканий, не предусмотренных ТК РФ
      (штрафы, лишение премий, перевод на нижеоплачиваемую работу и т.п.).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "дисциплинарная ответственность"
        - "дисциплинарное взыскание"
        - "замечание"
        - "выговор"
        - "увольнение по соответствующим основаниям"
        - "объяснительная"
        - "приказ о взыскании"
        - "срок применения взыскания"
        - "штраф"
        - "лишение премии"
        - "снижение оклада"
        - "перевод на нижеоплачиваемую"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)дисциплинарн[а-яё]+\\s+(ответственн|взыскан)"
        - "(?i)(замечани|выговор)"
        - "(?i)лишени[ея]\\s+преми"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по трудовому праву.
        Анализируется трудовой договор.
        Проверяется только один вопрос: дисциплинарная ответственность.
        Нормативный ориентир:
        - ст. 189 ТК РФ — дисциплина труда, правила внутреннего трудового распорядка
        - ст. 192 ТК РФ — дисциплинарные взыскания (замечание, выговор,
        увольнение по соответствующим основаниям); перечень закрытый
        - ст. 193 ТК РФ — порядок применения дисциплинарных взысканий
        - ст. 194 ТК РФ — снятие дисциплинарного взыскания
        - ст. 195 ТК РФ — привлечение к дисциплинарной ответственности руководителя
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска, не подставляй нормы закона вместо текста.
        - Ст. 192 ТК РФ устанавливает ЗАКРЫТЫЙ перечень взысканий: замечание,
        выговор, увольнение. Все остальные (штрафы, лишение премий, снижение
        оклада) — не предусмотрены ТК РФ.
        [ЗАДАЧА]
        Найди в тексте договора:
        1. Перечень дисциплинарных взысканий.
        2. Порядок применения дисциплинарных взысканий.
        3. Взыскания, не предусмотренные ТК РФ (штрафы, лишение премий,
        снижение оклада, перевод на нижеоплачиваемую работу и т.п.).
        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона вместо текста.
        2. Для *_status используй строго "defined" или "not_defined".
        3. Для *_value при отсутствии данных — строго "Данные не определены".
        4. Для disciplinary_types_*: "defined" если в тексте прямо перечислены
        виды взысканий.
        5. Для disciplinary_procedure_*: "defined" если указан порядок применения
        (объяснительная, приказ, сроки).
        6. Для disciplinary_nonstandard_*: "defined" если прямо указаны взыскания,
        не предусмотренные ст. 192 ТК РФ (штрафы, лишение премий, снижение оклада,
        перевод на нижеоплачиваемую работу и т.п.). Это негативный сигнал.
        7. Если порядок применения определяется через отсылку к ПВТР / Коллективному
        договору — фиксируй как "defined" со значением «согласно <документ>».
        8. В evidence включай только текст договора.
        9. Никогда не используй "None", "null", пустые строки или отсутствующие ключи.
        10. Верни РОВНО один валидный JSON-объект со всеми 7 ключами (6 полей + evidence),
        пригодный для парсинга через json.loads без предварительной обработки.
        Без markdown, без ```json, без комментариев, без текста до или после.
        Начни ответ сразу с { и закончи }.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — стандартные взыскания + порядок:
        Фрагмент:
        "За нарушение трудовых обязанностей к работнику могут быть применены
        дисциплинарные взыскания: замечание, выговор, увольнение по соответствующим
        основаниям. До применения взыскания работодатель требует письменное
        объяснение; приказ объявляется под подпись в течение 3 рабочих дней."
        Ответ:
        {
          "disciplinary_types_status": "defined",
          "disciplinary_types_value": "замечание, выговор, увольнение по соответствующим основаниям",
          "disciplinary_procedure_status": "defined",
          "disciplinary_procedure_value": "письменное объяснение, приказ объявляется под подпись в течение 3 рабочих дней",
          "disciplinary_nonstandard_status": "not_defined",
          "disciplinary_nonstandard_value": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 7.1",
              "quote": "За нарушение трудовых обязанностей к работнику могут быть применены дисциплинарные взыскания: замечание, выговор, увольнение по соответствующим основаниям."
            }
          ]
        }
        Пример 2 — нестандартные взыскания:
        Фрагмент:
        "За опоздание на работу работник лишается премии за текущий месяц.
        За курение в неположенном месте — штраф 1000 рублей."
        Ответ:
        {
          "disciplinary_types_status": "not_defined",
          "disciplinary_types_value": "Данные не определены",
          "disciplinary_procedure_status": "not_defined",
          "disciplinary_procedure_value": "Данные не определены",
          "disciplinary_nonstandard_status": "defined",
          "disciplinary_nonstandard_value": "лишение премии за опоздание; штраф 1000 рублей за курение — не предусмотрено ст. 192 ТК РФ",
          "evidence": [
            {
              "clause_ref": "п. 7.2",
              "quote": "За опоздание на работу работник лишается премии за текущий месяц."
            }
          ]
        }
        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Работник выполняет свои обязанности в соответствии с договором."
        Ответ:
        {
          "disciplinary_types_status": "not_defined",
          "disciplinary_types_value": "Данные не определены",
          "disciplinary_procedure_status": "not_defined",
          "disciplinary_procedure_value": "Данные не определены",
          "disciplinary_nonstandard_status": "not_defined",
          "disciplinary_nonstandard_value": "Данные не определены",
          "evidence": []
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Проверь, что все 7 ключей (6 полей + evidence) присутствуют в JSON.
        2. Проверь, что каждый *_status ∈ {"defined", "not_defined"}, а каждый *_value
        при отсутствии данных = "Данные не определены".
        3. Проверь, что для каждого defined-поля в evidence есть прямая цитата из договора.
        4. Убедись, что взыскания, не предусмотренные ст. 192 ТК РФ (штрафы,
        лишение премий, снижение оклада), отнесены в disciplinary_nonstandard_*.
        5. Убедись, что отсылки к ПВТР / Коллективному договору фиксированы
        как defined со значением «согласно <документ>».
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "disciplinary_types_status": "<defined / not_defined>",
          "disciplinary_types_value": "<перечень / 'Данные не определены'>",
          "disciplinary_procedure_status": "<defined / not_defined>",
          "disciplinary_procedure_value": "<порядок / 'согласно <документ>' / 'Данные не определены'>",
          "disciplinary_nonstandard_status": "<defined / not_defined>",
          "disciplinary_nonstandard_value": "<текст / 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 750

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "дисциплинарная ответственность дисциплинарное взыскание замечание выговор увольнение объяснительная приказ о взыскании срок применения взыскания штраф лишение премии снижение оклада перевод на нижеоплачиваемую"
      preferred_unit_types:
        - obligation
        - general_provision
        - definition
      excluded_unit_types:
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - limitations
        - remedies
      boost_keywords:
        - "дисциплинарное взыскание"
        - "замечание"
        - "выговор"
        - "объяснительная"
      negative_keywords:
        - "трудовая функция"
        - "место работы"
        - "оклад"
        - "рабочее время"
        - "увольнение по сокращению"
        - "конфиденциальность"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.40, 0.80]
        boost: 0.30
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "limitations"
        - "remedies"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1100

      compact_output: false

      presence_signal:
        field: "disciplinary_liability_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по трудовому праву. Извлеки из трудового договора
        сведения о дисциплинарной ответственности.
        Не анализируй оплату труда, режим работы, охрану труда или расторжение.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 6 полей + evidence (всего 7 ключей):

        0. disciplinary_liability_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (disciplinary_types_status, disciplinary_procedure_status,
              disciplinary_nonstandard_status) ≠ "not_defined";
           - "missing" — если все три содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - все три *_status = "not_defined";
           - все *_value = "Данные не определены";
           - не выполняй остальные шаги.

        1. disciplinary_types_status — "defined" или "not_defined".
        2. disciplinary_types_value — перечень дисциплинарных взысканий.
        3. disciplinary_procedure_status — "defined" или "not_defined".
        4. disciplinary_procedure_value — порядок применения взысканий.
        5. disciplinary_nonstandard_status — "defined" или "not_defined".
        6. disciplinary_nonstandard_value — взыскания, не предусмотренные ТК РФ.

        Если данные отсутствуют:
        - для *_status — "not_defined"
        - для *_value — "Данные не определены"
        </task>

        <context_rules>
        - Перед остальными полями заполни disciplinary_liability_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_value = "Данные не определены".
        - Используй только текст договора.
        - disciplinary_nonstandard_status = "defined" только если прямо указаны
          взыскания, не предусмотренные ст. 192 ТК РФ (штрафы, лишение премий,
          снижение оклада, перевод на нижеоплачиваемую работу и т.п.).
        - Если порядок применения определяется через отсылку к ПВТР /
          Коллективному договору — фиксируй как "defined" со значением
          «согласно <документ>».
        - Если в разных фрагментах указаны разные данные и конфликт нельзя
          разрешить по тексту — статус → "not_defined", значение → "Не удалось определить".
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни перечня взысканий, ни порядка их применения,
           ни нестандартных взысканий.
           → presence = "missing";
             все три *_status = "not_defined";
             все *_value = "Данные не определены".

        2. Стандартный перечень без порядка применения.
           Указаны замечание, выговор, увольнение, но не указан порядок
           применения (объяснительная, приказ, сроки).
           → presence = "present";
             disciplinary_types_status = "defined";
             disciplinary_procedure_status = "not_defined";
             disciplinary_nonstandard_status = "not_defined";
             соответствующие *_value = "Данные не определены".

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные перечни взысканий
           или разные сроки применения.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             соответствующее *_value = "Не удалось определить".

        4. Выявлены нестандартные взыскания.
           Указаны штрафы, лишение премий, снижение оклада,
           перевод на нижеоплачиваемую работу и т.п.
           → presence = "present";
             disciplinary_nonstandard_status = "defined";
             disciplinary_nonstandard_value содержит прямую цитату.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для disciplinary_liability_check_presence используй только: "present", "missing", "unclear".
        - Для всех *_status используй только: "defined" или "not_defined".
        - Fallback при отсутствии данных:
          * все *_value → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_value → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "disciplinary_liability_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие условий о дисциплинарной ответственности. Внутреннее агрегатное signal-поле."
          required: true

        - name: "disciplinary_types_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус перечня дисциплинарных взысканий. Внутреннее enum-поле."
          required: true

        - name: "disciplinary_types_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Дисциплинарные взыскания"
          description: >
            Перечень дисциплинарных взысканий. Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "disciplinary_procedure_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус порядка применения взысканий. Внутреннее enum-поле."
          required: true

        - name: "disciplinary_procedure_value"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Порядок применения взысканий"
          description: >
            Порядок применения дисциплинарных взысканий. Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "disciplinary_nonstandard_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: >-
            Статус выявления взысканий, не предусмотренных ТК РФ. "defined" = выявлены (негативный сигнал). Внутреннее enum-поле.
          required: true

        - name: "disciplinary_nonstandard_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Незаконные взыскания"
          description: >
            Взыскания, не предусмотренные ТК РФ. Fallback: "Не установлено" / "Не удалось определить".
          required: false

      store_payload: true

  - id: additional_guarantees_check
    name: "Дополнительные гарантии и компенсации"
    description: >
      Фактографическая проверка условий о служебных командировках, разъездном
      характере работы, использовании личного имущества работника (ст. 188 ТК РФ),
      компенсации ГСМ, связи, суточных и иных дополнительных выплат.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "служебная командировка"
        - "командировка"
        - "разъездной характер"
        - "суточные"
        - "возмещение расходов"
        - "использование личного имущества"
        - "личный автомобиль"
        - "ГСМ"
        - "топливо"
        - "мобильная связь"
        - "интернет"
        - "компенсация"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)командиров"
        - "(?i)разъездн[а-яё]+\\s+характер"
        - "(?i)личн[а-яё]+\\s+(имуществ|автомобил|транспорт)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по трудовому праву.
        Анализируется трудовой договор.
        Проверяется только один вопрос: дополнительные гарантии и компенсации.
        Нормативный ориентир:
        - ст. 164 ТК РФ — понятие гарантий и компенсаций
        - ст. 166–168 ТК РФ — служебные командировки, возмещение расходов
        - ст. 168.1 ТК РФ — разъездной характер работы
        - ст. 188 ТК РФ — возмещение расходов при использовании личного имущества
        - Постановление Правительства РФ от 13.10.2008 № 749 — командировки
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска, не подставляй нормы закона вместо текста.
        - Не выводи конкретные размеры суточных, не указанные в тексте.
        [ЗАДАЧА]
        Найди в тексте договора:
        1. Условие о служебных командировках и их оплате.
        2. Указание на разъездной характер работы.
        3. Возмещение расходов на использование личного имущества работника.
        4. Компенсация ГСМ / связи / интернета.
        5. Суточные и иные дополнительные выплаты.
        6. Иные дополнительные гарантии и компенсации.
        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона вместо текста.
        2. Для *_status используй строго "defined" или "not_defined".
        3. Для *_value при отсутствии данных — строго "Данные не определены".
        4. Если компенсация определяется через отсылку к документу (Положение
        о командировках, Приказ, Приложение) — фиксируй как "defined"
        со значением «согласно <документ>».
        5. Если прямо указано, что компенсация не предусмотрена —
        соответствующий *_status = "defined", *_value = "не предусмотрена".
        6. Различай:
        - business_trip_* — только служебные командировки (ст. 166–168 ТК РФ);
        - travel_nature_* — разъездной характер работы (ст. 168.1 ТК РФ).
        7. Различай:
        - personal_property_* — использование личного имущества работника;
        - fuel_and_communication_* — ГСМ, связь, интернет.
        8. В evidence включай только текст договора.
        9. Никогда не используй "None", "null", пустые строки или отсутствующие ключи.
        10. Верни РОВНО один валидный JSON-объект со всеми 9 ключами (8 полей + evidence),
        пригодный для парсинга через json.loads без предварительной обработки.
        Без markdown, без ```json, без комментариев, без текста до или после.
        Начни ответ сразу с { и закончи }.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — командировки + ГСМ:
        Фрагмент:
        "Служебные командировки оплачиваются в соответствии с Положением
        о командировках работодателя. Работнику компенсируются расходы на ГСМ
        при использовании личного автомобиля в служебных целях — 10 руб./км."
        Ответ:
        {
          "business_trip_status": "defined",
          "business_trip_value": "согласно Положению о командировках работодателя",
          "travel_nature_status": "not_defined",
          "travel_nature_value": "Данные не определены",
          "personal_property_status": "defined",
          "personal_property_value": "компенсация расходов при использовании личного автомобиля — 10 руб./км",
          "fuel_and_communication_status": "defined",
          "fuel_and_communication_value": "компенсация ГСМ — 10 руб./км",
          "evidence": [
            {
              "clause_ref": "п. 5.1",
              "quote": "Служебные командировки оплачиваются в соответствии с Положением о командировках работодателя."
            }
          ]
        }
        Пример 2 — разъездной характер, суточные:
        Фрагмент:
        "Работнику устанавливается разъездной характер работы. За каждый день
        работы в пути выплачиваются суточные в размере 700 рублей."
        Ответ:
        {
          "business_trip_status": "not_defined",
          "business_trip_value": "Данные не определены",
          "travel_nature_status": "defined",
          "travel_nature_value": "разъездной характер работы",
          "personal_property_status": "not_defined",
          "personal_property_value": "Данные не определены",
          "fuel_and_communication_status": "not_defined",
          "fuel_and_communication_value": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 5.2",
              "quote": "Работнику устанавливается разъездной характер работы."
            }
          ]
        }
        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Работник выполняет свои обязанности в соответствии с договором."
        Ответ:
        {
          "business_trip_status": "not_defined",
          "business_trip_value": "Данные не определены",
          "travel_nature_status": "not_defined",
          "travel_nature_value": "Данные не определены",
          "personal_property_status": "not_defined",
          "personal_property_value": "Данные не определены",
          "fuel_and_communication_status": "not_defined",
          "fuel_and_communication_value": "Данные не определены",
          "evidence": []
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Проверь, что все 9 ключей (8 полей + evidence) присутствуют в JSON.
        2. Проверь, что каждый *_status ∈ {"defined", "not_defined"}, а каждый *_value
        при отсутствии данных = "Данные не определены".
        3. Проверь, что для каждого defined-поля в evidence есть прямая цитата из договора.
        4. Убедись, что business_trip_* отражает только служебные командировки,
        а travel_nature_* — только разъездной характер работы.
        5. Убедись, что отсылки к Положению о командировках / Приказу / Приложению
        фиксированы как defined со значением «согласно <документ>».
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "business_trip_status": "<defined / not_defined>",
          "business_trip_value": "<текст / 'согласно <документ>' / 'не предусмотрены' / 'Данные не определены'>",
          "travel_nature_status": "<defined / not_defined>",
          "travel_nature_value": "<текст / 'не предусмотрен' / 'Данные не определены'>",
          "personal_property_status": "<defined / not_defined>",
          "personal_property_value": "<текст / 'согласно <документ>' / 'не предусмотрено' / 'Данные не определены'>",
          "fuel_and_communication_status": "<defined / not_defined>",
          "fuel_and_communication_value": "<текст / 'не предусмотрена' / 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 800

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "служебная командировка суточные возмещение расходов разъездной характер работы использование личного имущества работника личный автомобиль ГСМ топливо мобильная связь интернет компенсация расходов"
      preferred_unit_types:
        - obligation
        - payment_term
        - general_provision
      excluded_unit_types:
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
        - remedies
      boost_keywords:
        - "командировка"
        - "суточные"
        - "разъездной характер"
        - "личное имущество"
        - "ГСМ"
      negative_keywords:
        - "трудовая функция"
        - "место работы"
        - "оклад"
        - "отпуск"
        - "рабочее время"
        - "увольнение"
        - "расторжение"
        - "конфиденциальность"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.30, 0.75]
        boost: 0.30
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
        - "remedies"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1200

      compact_output: false

      presence_signal:
        field: "additional_guarantees_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по трудовому праву. Извлеки из трудового договора
        сведения о дополнительных гарантиях и компенсациях.
        Не анализируй оклад, режим работы, отпуск или расторжение.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 8 полей + evidence (всего 9 ключей):

        0. additional_guarantees_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (business_trip_status, travel_nature_status,
              personal_property_status, fuel_and_communication_status) ≠ "not_defined";
           - "missing" — если все четыре содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - все четыре *_status = "not_defined";
           - все *_value = "Данные не определены";
           - не выполняй остальные шаги.

        1. business_trip_status — "defined" или "not_defined".
        2. business_trip_value — условие о служебных командировках.
        3. travel_nature_status — "defined" или "not_defined".
        4. travel_nature_value — разъездной характер работы.
        5. personal_property_status — "defined" или "not_defined".
        6. personal_property_value — использование личного имущества.
        7. fuel_and_communication_status — "defined" или "not_defined".
        8. fuel_and_communication_value — компенсация ГСМ / связи / интернета.

        Если данные отсутствуют:
        - для *_status — "not_defined"
        - для *_value — "Данные не определены"
        </task>

        <context_rules>
        - Перед остальными полями заполни additional_guarantees_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_value = "Данные не определены".
        - Используй только текст договора.
        - business_trip_* — только служебные командировки (ст. 166–168 ТК РФ).
        - travel_nature_* — только разъездной характер работы (ст. 168.1 ТК РФ).
        - personal_property_* — использование личного имущества работника (ст. 188 ТК РФ).
        - fuel_and_communication_* — ГСМ, мобильная связь, интернет.
        - Если компенсация определяется через отсылку к документу (Положение,
          Приказ, Приложение) — фиксируй как "defined" со значением «согласно <документ>».
        - Если прямо указано, что компенсация не предусмотрена — status = "defined",
          value = "не предусмотрена".
        - Если в разных фрагментах указаны разные данные и конфликт нельзя
          разрешить по тексту — статус → "not_defined", значение → "Не удалось определить".
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни командировок, ни разъездного характера,
           ни использования личного имущества, ни компенсации ГСМ.
           → presence = "missing";
             все четыре *_status = "not_defined";
             все *_value = "Данные не определены".

        2. Частичное раскрытие темы.
           Указаны только служебные командировки, без разъездного характера,
           личного имущества и компенсации ГСМ.
           → presence = "present";
             business_trip_status = "defined";
             travel_nature_status = "not_defined";
             personal_property_status = "not_defined";
             fuel_and_communication_status = "not_defined";
             соответствующие *_value = "Данные не определены".

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные размеры компенсации
           или противоречащие условия.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             соответствующее *_value = "Не удалось определить".

        4. Отсылка на Положение о командировках / Приказ.
           Порядок оплаты командировок или компенсаций определяется
           отдельным документом.
           → presence = "present";
             соответствующий *_status = "defined";
             соответствующее *_value содержит формулировку вида
             «согласно Положению о командировках».
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для additional_guarantees_check_presence используй только: "present", "missing", "unclear".
        - Для всех *_status используй только: "defined" или "not_defined".
        - Fallback при отсутствии данных:
          * все *_value → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_value → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "additional_guarantees_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие условий о дополнительных гарантиях и компенсациях. Внутреннее агрегатное signal-поле."
          required: true

        - name: "business_trip_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус условия о служебных командировках. Внутреннее enum-поле."
          required: true

        - name: "business_trip_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Командировки"
          description: >
            Условие о служебных командировках и их оплате. Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "travel_nature_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания разъездного характера работы. Внутреннее enum-поле."
          required: true

        - name: "travel_nature_value"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Разъездной характер"
          description: >
            Условие о разъездном характере работы. Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "personal_property_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус условия об использовании личного имущества. Внутреннее enum-поле."
          required: true

        - name: "personal_property_value"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Использование личного имущества"
          description: >
            Возмещение расходов на использование личного имущества работника. Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "fuel_and_communication_status"
          type: "string"
          presentation: "signal"
          risk_weight: "low"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус компенсации ГСМ / связи / интернета. Внутреннее enum-поле."
          required: true

        - name: "fuel_and_communication_value"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Компенсация ГСМ / связи"
          description: >
            Компенсация расходов на ГСМ, мобильную связь, интернет. Fallback: "Не установлено" / "Не удалось определить".
          required: false

      store_payload: true

  - id: employee_category_check
    name: "Категория работника (маркер специфики)"
    description: >
      Определение категории работника (стандартная / инвалид / несовершеннолетний /
      беременная или с семейными обязанностями / совместитель / дистанционный /
      надомник / иная специфика) и выявление условий, требующих применения
      специальных норм ТК РФ.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "инвалид"
        - "инвалидность"
        - "ИПРА"
        - "несовершеннолетний"
        - "беременная"
        - "ребёнок"
        - "семейные обязанности"
        - "совместительство"
        - "по совместительству"
        - "внешний совместитель"
        - "внутренний совместитель"
        - "дистанционная работа"
        - "надомник"
        - "надомная работа"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)инвалид"
        - "(?i)несовершеннолетн"
        - "(?i)беременн"
        - "(?i)по\\s+совместительств"
        - "(?i)надомн"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по трудовому праву.
        Анализируется трудовой договор.
        Проверяется только один вопрос: категория работника и её специфика.
        Нормативный ориентир:
        - ст. 92 ТК РФ — сокращённая продолжительность рабочего времени
        (инвалиды I или II группы, несовершеннолетние, работники с вредными условиями)
        - ст. 94 ТК РФ — предельная продолжительность ежедневной работы
        - ст. 96 ТК РФ — работа в ночное время (ограничения для отдельных категорий)
        - ст. 253–264 ТК РФ — особенности регулирования труда отдельных категорий
        (женщины, лица с семейными обязанностями)
        - ст. 265–272 ТК РФ — особенности регулирования труда несовершеннолетних
        - ст. 282–288 ТК РФ — совместительство
        - ст. 310 ТК РФ — надомники
        - ст. 312.1–312.9 ТК РФ — дистанционная работа
        - ФЗ от 24.11.1995 № 181-ФЗ — социальная защита инвалидов
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска, не подставляй нормы закона вместо текста.
        - Определяй категорию по прямым указаниям в тексте, без домыслов.
        [ЗАДАЧА]
        Определи категорию работника на основании текста договора:
        1. Категория (standard / disabled / minor / pregnant_or_family /
        concurrent / remote / homeworker / other_specific).
        2. Пояснение (детали категории).
        3. Наличие специальных условий для данной категории.
        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Для *_status используй строго "defined" или "not_defined",
        если не указано иное.
        3. Для *_value при отсутствии данных — строго "Данные не определены".
        4. employee_category_status — обязательное значение из enum:
        "standard" / "disabled" / "minor" / "pregnant_or_family" / "concurrent" /
        "remote" / "homeworker" / "other_specific".
        5. Если в тексте несколько категорий (например, "инвалид + дистанционная работа"),
        выбери ПЕРВИЧНУЮ (по приоритету: minor > disabled > pregnant_or_family >
        concurrent > homeworker > remote > other_specific > standard),
        а остальные перечисли в employee_category_value.
        6. Если в тексте НЕТ прямых указаний ни на одну специфическую категорию —
        employee_category_status = "standard".
        7. special_conditions_* фиксирует наличие специальных условий для категории
        (сокращённое время, ограничения, дополнительный отпуск, оборудование
        рабочего места, ИПРА и т.п.).
        8. В evidence включай только текст договора.
        9. Никогда не используй "None", "null", пустые строки или отсутствующие ключи.
        10. Верни РОВНО один валидный JSON-объект со всеми 5 ключами (4 поля + evidence),
        пригодный для парсинга через json.loads без предварительной обработки.
        Без markdown, без ```json, без комментариев, без текста до или после.
        Начни ответ сразу с { и закончи }.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — стандартная категория:
        Фрагмент:
        "Работник принимается на должность менеджера. Работа для работника
        является основной."
        Ответ:
        {
          "employee_category_status": "standard",
          "employee_category_value": "основное место работы, специфических категорий не указано",
          "special_conditions_status": "not_defined",
          "special_conditions_value": "Данные не определены",
          "evidence": []
        }
