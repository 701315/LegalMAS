  - id: non_compete_disputes_check
    name: "Запрет конкуренции, разрешение споров и коллективный договор"
    description: >
      Фактографическая проверка наличия условий о запрете конкуренции (non-compete)
      после увольнения, запрета переманивания (non-solicitation), порядка
      разрешения трудовых споров (переговоры, КТС, медиация) и ссылки
      на коллективный договор.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "запрет конкуренции"
        - "не конкурировать"
        - "не трудоустраиваться в конкурирующую"
        - "не работать у конкурентов"
        - "ограничение трудоустройства"
        - "конкурирующая организация"
        - "запрет переманивания"
        - "не привлекать работников"
        - "досудебный порядок"
        - "переговоры"
        - "комиссия по трудовым спорам"
        - "КТС"
        - "медиация"
        - "коллективный договор"
        - "положения коллективного договора"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)запрет.*конкуренц"
        - "(?i)non[\\s-]?compete"
        - "(?i)non[\\s-]?solicit"
        - "(?i)не\\s+(трудоустраиваться|работать).*конкурент"
        - "(?i)комисси[яи]\\s+по\\s+трудовым\\s+спорам"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по трудовому праву.
        Анализируется трудовой договор.
        Проверяется только один вопрос: non-compete (запрет конкуренции),
        non-solicitation (запрет переманивания), разрешение трудовых споров
        и коллективный договор.
        Нормативный ориентир:
        - ст. 37 Конституции РФ — свобода труда, право свободно распоряжаться
        своими способностями к труду
        - ст. 2, 3, 9 ТК РФ — запрет дискриминации и ухудшения положения работника,
        запрет ограничения прав
        - ст. 349.1, 349.3 ТК РФ — специальные ограничения для отдельных категорий
        работников (госкомпании, госкорпорации, отдельные ФЗ)
        - ст. 382, 384–390 ТК РФ — индивидуальные трудовые споры, КТС
        - ст. 40–44 ТК РФ — коллективный договор
        ВАЖНО (правовая реальность РФ):
        - Условие о запрете работы у конкурента после увольнения (non-compete),
        установленное в трудовом договоре с ОБЫЧНЫМ работником, как правило,
        НИЧТОЖНО — оно ограничивает конституционное право на труд (ст. 37
        Конституции РФ, ст. 2, 3, 9 ТК РФ). Такое условие исполнимо только
        для отдельных категорий (руководитель организации, ст. 349.1, 349.3 ТК РФ).
        - Фиксируй наличие условия как ФАКТ, не делая вывода о его исполнимости.
        [ЗАДАЧА]
        Найди в тексте договора:
        1. Условие о запрете конкуренции (non-compete) после увольнения.
        2. Условие о запрете переманивания (non-solicitation).
        3. Порядок разрешения трудовых споров (переговоры, КТС, медиация, суд).
        4. Ссылку на коллективный договор.
        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона вместо текста.
        2. Для *_status используй строго "defined" или "not_defined".
        3. Для *_value при отсутствии данных — строго "Данные не определены".
        4. non_compete_* фиксирует наличие условия о запрете конкуренции
        ПОСЛЕ УВОЛЬНЕНИЯ. Ограничения в период работы (конфиденциальность,
        неразглашение) — не относятся к non-compete и не учитываются здесь.
        5. non_solicitation_* фиксирует запрет привлекать / переманивать
        работников, клиентов, контрагентов работодателя.
        6. Если условие о non-compete / non-solicitation / разрешении споров
        определяется через отсылку к документу (Положение, Коллективный договор,
        отдельный NDA, Приложение) — фиксируй как "defined" со значением
        «согласно <документ>».
        7. Не делай вывода о юридической силе non-compete в российском праве —
        только фиксируй факт наличия условия.
        8. В evidence включай только текст договора.
        9. Никогда не используй "None", "null", пустые строки или отсутствующие ключи.
        10. Верни РОВНО один валидный JSON-объект со всеми 9 ключами (8 полей + evidence),
        пригодный для парсинга через json.loads без предварительной обработки.
        Без markdown, без ```json, без комментариев, без текста до или после.
        Начни ответ сразу с { и закончи }.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — non-compete + споры + коллективный договор:
        Фрагмент:
        "Работник обязуется в течение 2 лет после увольнения не трудоустраиваться
        в конкурирующие организации. Споры разрешаются путём переговоров,
        а при недостижении согласия — в комиссии по трудовым спорам.
        Условия коллективного договора распространяются на Работника."
        Ответ:
        {
          "non_compete_status": "defined",
          "non_compete_value": "в течение 2 лет после увольнения не трудоустраиваться в конкурирующие организации",
          "non_solicitation_status": "not_defined",
          "non_solicitation_value": "Данные не определены",
          "dispute_resolution_status": "defined",
          "dispute_resolution_value": "путём переговоров, а при недостижении согласия — в комиссии по трудовым спорам",
          "collective_agreement_status": "defined",
          "collective_agreement_value": "условия коллективного договора распространяются на Работника",
          "evidence": [
            {
              "clause_ref": "п. 7.1",
              "quote": "Работник обязуется в течение 2 лет после увольнения не трудоустраиваться в конкурирующие организации."
            }
          ]
        }
        Пример 2 — отсылка к локальному акту:
        Фрагмент:
        "Ограничения, связанные с конкуренцией, установлены Положением
        о защите коммерческой тайны. Трудовые споры рассматриваются
        в порядке, установленном ТК РФ. Коллективный договор на работника
        не распространяется."
        Ответ:
        {
          "non_compete_status": "defined",
          "non_compete_value": "согласно Положению о защите коммерческой тайны",
          "non_solicitation_status": "not_defined",
          "non_solicitation_value": "Данные не определены",
          "dispute_resolution_status": "defined",
          "dispute_resolution_value": "в порядке, установленном ТК РФ",
          "collective_agreement_status": "defined",
          "collective_agreement_value": "не распространяется на работника",
          "evidence": [
            {
              "clause_ref": "п. 8.2",
              "quote": "Ограничения, связанные с конкуренцией, установлены Положением о защите коммерческой тайны."
            }
          ]
        }
        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Работник выполняет свои обязанности в соответствии с договором."
        Ответ:
        {
          "non_compete_status": "not_defined",
          "non_compete_value": "Данные не определены",
          "non_solicitation_status": "not_defined",
          "non_solicitation_value": "Данные не определены",
          "dispute_resolution_status": "not_defined",
          "dispute_resolution_value": "Данные не определены",
          "collective_agreement_status": "not_defined",
          "collective_agreement_value": "Данные не определены",
          "evidence": []
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Проверь, что все 9 ключей (8 полей + evidence) присутствуют в JSON.
        2. Проверь, что каждый *_status ∈ {"defined", "not_defined"}, а каждый *_value
        при отсутствии данных = "Данные не определены".
        3. Проверь, что для каждого defined-поля в evidence есть прямая цитата из договора.
        4. Убедись, что non_compete_* отражает запрет ПОСЛЕ увольнения, а не общие
        ограничения в период работы (конфиденциальность, неразглашение).
        5. Убедись, что отсылки к Положению / Коллективному договору / отдельному NDA
        фиксированы как defined со значением «согласно <документ>».
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "non_compete_status": "<defined / not_defined>",
          "non_compete_value": "<текст / 'согласно <документ>' / 'Данные не определены'>",
          "non_solicitation_status": "<defined / not_defined>",
          "non_solicitation_value": "<текст / 'согласно <документ>' / 'Данные не определены'>",
          "dispute_resolution_status": "<defined / not_defined>",
          "dispute_resolution_value": "<порядок / 'Данные не определены'>",
          "collective_agreement_status": "<defined / not_defined>",
          "collective_agreement_value": "<текст / 'не распространяется' / 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 800

