        "Разногласия по настоящему договору разрешаются примирительной комиссией."
        Ответ:
        {
          "dispute_procedure_status": "defined",
          "dispute_procedure_details": "примирительная комиссия",
          "conciliation_commission_status": "defined",
          "conciliator_mediator_status": "not_defined",
          "labor_arbitration_status": "not_defined",
          "liability_status": "not_defined",
          "liability_details": "Данные не определены",
          "koap_reference_status": "not_defined",
          "evidence": [
            {
              "clause_ref": "п. 9.1",
              "quote": "Разногласия по настоящему договору разрешаются примирительной комиссией."
            }
          ]
        }
        Пример 3 (положения отсутствуют):
        Фрагмент:
        "Стороны обязуются исполнять настоящий договор."
        Ответ:
        {
          "dispute_procedure_status": "not_defined",
          "dispute_procedure_details": "Данные не определены",
