      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по трудовому праву. Извлеки из коллективного договора
        сведения о гарантиях профсоюзной деятельности (ст. 374–377 ТК РФ, ФЗ-10).
        Не анализируй индексацию, охрану труда или споры.
        </role>
        <context>
        {context}
        </context>
        <task>
        0. union_activity_guarantees_check_presence: определи, есть ли в договоре
           фрагменты, касающиеся гарантий профсоюзной деятельности (помещение,
           освобождение от работы, взносы, защита от увольнения, доступ к информации).
           - "present" — есть хотя бы один фрагмент по любой из пяти гарантий.
           - "missing" — фрагментов по теме нет вообще.
           - "unclear" — фрагменты есть, но противоречат друг другу и вывод невозможен.

        1. premises_provided_status — defined / not_defined.
        2. premises_provided_details — предоставление помещения, оргтехники, связи, транспорта.
        3. release_from_work_status — defined / not_defined.
        4. release_from_work_details — освобождение от основной работы.
        5. dues_transfer_status — defined / not_defined.
        6. dues_transfer_details — перечисление профсоюзных взносов.
        7. dismissal_protection_status — defined / not_defined.
        8. dismissal_protection_details — защита от увольнения.
        9. information_access_status — defined / not_defined.
        10. information_access_details — предоставление информации профсоюзу.

        Если данные отсутствуют в тексте:
        - статус = "not_defined"
        - текстовое поле = "Данные не определены"
        </task>
        <context_rules>
        - union_activity_guarantees_check_presence и все статусные поля попарно не
          пересекаются по значениям present/missing/unclear; их объединение покрывает
          все допустимые значения.
        - Для каждого из 5 аспектов: "defined" — гарантия прямо указана в тексте;
          "not_defined" — гарантия не упомянута.
        - premises_provided_details включает: помещение, оргтехнику, средства связи, транспорт.
        - dismissal_protection_details — только гарантии от увольнения (согласие
          вышестоящего профсоюза, запрет увольнения). Не путать с общими гарантиями.
        - dues_transfer_details — перечисление взносов (ставка, периодичность,
          условие о заявлении работника).
        - Если хотя бы один из 5 статусов = "defined", то
          union_activity_guarantees_check_presence = "present".
        - Если все 5 статусов = "not_defined", то
          union_activity_guarantees_check_presence = "missing".
        </context_rules>
        <edge_cases>
        1. Полное отсутствие фрагментов о профсоюзных гарантиях (помещение, взносы,
           освобождение, защита, информация) → union_activity_guarantees_check_presence = "missing",
           все статусы = "not_defined".
        2. Частичные гарантии (например, помещение и взносы указаны, защита от увольнения
           и информация — нет) → presence = "present", соответствующие статусы = "defined",
           остальные = "not_defined".
        3. Все пять гарантий прямо указаны → presence = "present", все статусы = "defined".
        4. Противоречие: в одном разделе «предоставляет помещение», в другом —
           «помещение не предоставляется в связи с отсутствием свободных площадей» →
           presence = "unclear", premises_provided_status = "not_defined" с пояснением
           в details.
        </edge_cases>
        <output_expectations>
        - Все 11 полей (1 presence + 10 substantive) обязательны.
        - Статусные поля возвращают только значения из allowed_values.
        - Текстовые поля без данных — строго "Данные не определены".
        - Не используй None, null или пустые строки.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

