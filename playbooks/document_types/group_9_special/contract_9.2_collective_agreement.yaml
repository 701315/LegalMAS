          description: >
            Размер взносов работодателя (%, руб., формула софинансирования). Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "pension_conditions_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
