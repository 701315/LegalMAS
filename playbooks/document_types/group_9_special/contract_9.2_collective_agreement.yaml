          display_in_grid: true
          display_priority: 2
          label: "Ежегодный отпуск"
          description: >
            Продолжительность ежегодного отпуска. Fallback: "Не установлено" / "Не удалось определить".
          required: false
        - name: "additional_leave_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
