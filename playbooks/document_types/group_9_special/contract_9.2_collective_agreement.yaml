      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по трудовому праву. Извлеки из коллективного договора
        сведения о повышенных гарантиях сверх ТК РФ (ст. 164–188 ТК РФ).
        Не анализируй другие темы коллективного договора.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. enhanced_labor_guarantees_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (business_trips_status, dispensarization_status,
              donor_guarantees_status, educational_guarantees_status)
             ≠ "not_defined";
           - "missing" — если все четыре содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - business_trips_status = "not_defined";
           - dispensarization_status = "not_defined";
           - donor_guarantees_status = "not_defined";
           - educational_guarantees_status = "not_defined";
           - все *_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. business_trips_status:
           Используй только одно из значений:
           - "defined" — если прямо указаны конкретные гарантии сверх
             ТК РФ (повышенный размер суточных, дополнительные
             компенсации);
           - "declarative" — если есть только упоминание без улучшений
             (цитирование нормы ТК РФ);
           - "not_defined" — если тема не раскрыта.

        2. business_trips_details:
           Краткое user-facing описание гарантий (размер суточных,
           дополнительные компенсации).
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        3. dispensarization_status:
           Используй только одно из значений:
           - "defined" — конкретные гарантии сверх ТК РФ;
           - "declarative" — только упоминание без улучшений;
           - "not_defined" — тема не раскрыта.

        4. dispensarization_details:
           Краткое user-facing описание гарантий при диспансеризации.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        5. donor_guarantees_status:
           Используй только одно из значений:
           - "defined" — конкретные гарантии сверх ТК РФ;
           - "declarative" — только упоминание без улучшений;
           - "not_defined" — тема не раскрыта.

        6. donor_guarantees_details:
           Краткое user-facing описание гарантий донорам
           (дополнительные дни, компенсации).
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        7. educational_guarantees_status:
           Используй только одно из значений:
           - "defined" — конкретные гарантии сверх ТК РФ;
           - "declarative" — только упоминание без улучшений;
           - "not_defined" — тема не раскрыта.

        8. educational_guarantees_details:
           Краткое user-facing описание гарантий при обучении
           (уровень оплаты учебного отпуска).
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни enhanced_labor_guarantees_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона вместо текста договора.
        - Не делай выводов по типовой структуре договора.
        - defined = гарантии сверх ТК РФ.
        - declarative = только упоминание без улучшений (цитирование нормы ТК РФ).
        - not_defined = тема не раскрыта.
        - В business_trips_details фиксируй конкретный размер суточных и компенсаций.
        - В educational_guarantees_details фиксируй уровень оплаты учебного отпуска (% или средний заработок).
        - Если в разных фрагментах указаны противоречивые сведения — статус → "not_defined", текстовое поле → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни гарантий при командировках, ни при
           диспансеризации, ни для доноров, ни при совмещении работы
           с обучением.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        2. Неполное раскрытие или прямое исключение.
           а) Общая фраза: "Работникам предоставляются гарантии,
              предусмотренные ТК РФ" — только цитирование нормы.
              → presence = "present";
                соответствующий *_status = "declarative";
                соответствующий *_details содержит указание на отсутствие
                улучшений.
           б) Прямо указано, что повышенные гарантии по конкретной
              теме не предоставляются.
              → presence = "present";
                соответствующий *_status = "defined";
                соответствующий *_details содержит дословную
                формулировку отказа.

        3. Противоречие между фрагментами.
           В разных частях договора указаны противоречивые гарантии
           по одной теме (например, разные размеры суточных).
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             соответствующий *_details = "Не удалось определить".

        4. Специфика темы — полное раскрытие с улучшениями.
           По всем четырём темам указаны конкретные гарантии сверх
           ТК РФ.
           → presence = "present";
             все *_status = "defined";
             все *_details содержат конкретику.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для enhanced_labor_guarantees_check_presence используй только: "present", "missing", "unclear".
        - Для всех *_status используй только: "defined", "declarative", "not_defined".
        - Fallback при отсутствии данных:
          * все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "enhanced_labor_guarantees_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по повышенным гарантиям. Внутреннее агрегатное signal-поле."
          required: true

        - name: "business_trips_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "declarative", "not_defined"]
          description: "Статус гарантий при командировках."
          required: true

        - name: "business_trips_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Командировки"
          description: "Повышенные гарантии при командировках (суточные, компенсации)."
          required: false

        - name: "dispensarization_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "declarative", "not_defined"]
          description: "Статус гарантий при диспансеризации."
          required: true

        - name: "dispensarization_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Диспансеризация"
          description: "Гарантии при прохождении диспансеризации."
          required: false

        - name: "donor_guarantees_status"
          type: "string"
          presentation: "signal"
          risk_weight: "low"
          allowed_values: ["defined", "declarative", "not_defined"]
          description: "Статус гарантий донорам."
          required: true

        - name: "donor_guarantees_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Донорство"
          description: "Гарантии работникам-донорам."
          required: false

        - name: "educational_guarantees_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "declarative", "not_defined"]
          description: "Статус гарантий при совмещении с обучением."
          required: true

        - name: "educational_guarantees_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Обучение"
          description: "Гарантии при совмещении работы с обучением."
          required: false

      store_payload: true

  - id: union_participation_check
    name: "Участие профсоюза в управлении: ЛНА, увольнения, информация, контроль (ст. 22, 53, 370, 372, 373 ТК РФ)"
    description: >
      Фактографическая проверка процедурных прав профсоюзной организации:
      участие в принятии ЛНА, согласование увольнений, право на информацию,
      контроль соблюдения трудового законодательства.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 190

    rules:
      keywords:
        - "мнение профсоюза"
        - "учёт мнения"
        - "согласование с профсоюзом"
        - "локальный нормативный акт"
        - "уведомление профсоюза"
        - "сокращение численности"
        - "информация профсоюзу"
        - "контроль соблюдения"
        - "профсоюзный контроль"
        - "правовая инспекция труда"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(учёт|учет)\\s+мнени"
        - "(?i)(согласовани|согласие)\\s+(с\\s+)?профсоюз"
        - "(?i)(уведомлени|информировани).*профсоюз"
        - "(?i)профсоюзн(ый|ого)\\s+контрол"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по трудовому праву.
        Анализируется коллективный договор (ст. 22, 53, 370, 372, 373 ТК РФ).
        Проверяется только один вопрос: процедурные права профсоюза.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        [ЗАДАЧА]
        Найди в тексте договора процедурные права профсоюза:
        1. Участие в принятии локальных нормативных актов (учёт мнения, ст. 372).
        2. Участие в согласовании увольнений (ст. 373).
        3. Право на получение информации (ст. 22, 53).
        4. Право на осуществление контроля (ст. 370).
        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если данные не указаны прямо — статусные поля возвращай "not_defined".
        3. Текстовые поля без значения — строго "Данные не определены".
        4. Верни РОВНО один валидный JSON-объект со всеми 9 ключами (8 полей + evidence),
           пригодный для парсинга через json.loads без предварительной обработки.
           Без markdown, без ```json, без комментариев, без текста до или после.
           Начни ответ сразу с { и закончи }.
        5. Не используй None, null или пустые строки.
        6. В evidence включай только текст договора.
        7. Для каждой темы:
           - "defined" — процедурное право прямо закреплено;
           - "declarative" — только общая формулировка без процедуры;
           - "not_defined" — не раскрыто.
        8. В dismissal_coordination_details фиксируй категории увольнений,
           требующих согласования (п. 2, 3, 5 ч. 1 ст. 81 ТК РФ).
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 (полное определение):
        Фрагмент:
        "Работодатель принимает локальные нормативные акты с учётом мнения профсоюза.
        Увольнение по сокращению численности согласовывается с профсоюзом.
        Работодатель предоставляет профсоюзу информацию о финансовой деятельности.
        Профсоюз вправе осуществлять контроль соблюдения трудового законодательства."
        Ответ:
        {
          "lna_participation_status": "defined",
          "lna_participation_details": "принятие ЛНА с учётом мнения профсоюза",
          "dismissal_coordination_status": "defined",
          "dismissal_coordination_details": "увольнение по сокращению численности согласовывается с профсоюзом",
          "information_rights_status": "defined",
          "information_rights_details": "информация о финансовой деятельности",
          "control_rights_status": "defined",
          "control_rights_details": "контроль соблюдения трудового законодательства",
          "evidence": [
            {
              "clause_ref": "п. 6.1",
              "quote": "Работодатель принимает локальные нормативные акты с учётом мнения профсоюза."
            }
          ]
        }
        Пример 2 (частичное определение):
        Фрагмент:
        "Профсоюз участвует в принятии локальных нормативных актов.
        Работодатель информирует профсоюз о принимаемых решениях."
        Ответ:
        {
          "lna_participation_status": "defined",
          "lna_participation_details": "участие в принятии ЛНА",
          "dismissal_coordination_status": "not_defined",
          "dismissal_coordination_details": "Данные не определены",
          "information_rights_status": "declarative",
          "information_rights_details": "информирование о принимаемых решениях (без конкретики)",
          "control_rights_status": "not_defined",
          "control_rights_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 6.1",
              "quote": "Профсоюз участвует в принятии локальных нормативных актов."
            }
          ]
        }
        Пример 3 (не раскрыто):
        Фрагмент:
        "Профсоюз действует в соответствии с законодательством."
        Ответ:
        {
          "lna_participation_status": "not_defined",
          "lna_participation_details": "Данные не определены",
          "dismissal_coordination_status": "not_defined",
          "dismissal_coordination_details": "Данные не определены",
          "information_rights_status": "not_defined",
          "information_rights_details": "Данные не определены",
          "control_rights_status": "not_defined",
          "control_rights_details": "Данные не определены",
          "evidence": []
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямые цитаты по каждой из 4 тем.
        2. Разграничь процедурные права и общие формулировки.
        3. Если прямой цитаты нет — верни "not_defined". Не додумывай.
        4. Проверь, что все 9 ключей (8 полей + evidence) присутствуют в JSON.
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "lna_participation_status": "<defined / declarative / not_defined>",
          "lna_participation_details": "<текст или 'Данные не определены'>",
          "dismissal_coordination_status": "<defined / declarative / not_defined>",
          "dismissal_coordination_details": "<текст или 'Данные не определены'>",
          "information_rights_status": "<defined / declarative / not_defined>",
          "information_rights_details": "<текст или 'Данные не определены'>",
          "control_rights_status": "<defined / declarative / not_defined>",
          "control_rights_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 10
      temperature: 0.0
      max_tokens: 900

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "мнение профсоюза учёт мнения согласование с профсоюзом локальный нормативный акт уведомление профсоюза сокращение численности информация профсоюзу контроль соблюдения профсоюзный контроль правовая инспекция труда"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - procedures
        - obligations
      negative_keywords:
        - "профсоюзные взносы"
        - "забастовка"
        - "в целях настоящего"
      context_k: 10
      max_chunks: 14
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "procedures"
        - "obligations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 700

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1200

      compact_output: false

      presence_signal:
        field: "union_participation_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по трудовому праву. Извлеки из коллективного договора
        сведения о процедурных правах профсоюза (ст. 22, 53, 370, 372, 373 ТК РФ).
        Не анализируй другие темы коллективного договора.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. union_participation_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (lna_participation_status, dismissal_coordination_status,
              information_rights_status, control_rights_status)
             ≠ "not_defined";
           - "missing" — если все четыре содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - lna_participation_status = "not_defined";
           - dismissal_coordination_status = "not_defined";
           - information_rights_status = "not_defined";
           - control_rights_status = "not_defined";
           - все *_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. lna_participation_status:
           Используй только одно из значений:
           - "defined" — если прямо закреплено процедурное право
             профсоюза на участие в принятии ЛНА (учёт мнения);
           - "declarative" — если есть только общая формулировка
             без описания процедуры;
           - "not_defined" — если тема не раскрыта.

        2. lna_participation_details:
           Краткое user-facing описание участия профсоюза в принятии ЛНА.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        3. dismissal_coordination_status:
           Используй только одно из значений:
           - "defined" — если прямо закреплена процедура согласования
             увольнений с профсоюзом;
           - "declarative" — если есть только общая формулировка
             без процедуры;
           - "not_defined" — если тема не раскрыта.

        4. dismissal_coordination_details:
           Краткое user-facing описание согласования увольнений
           (категории увольнений, требующих согласования).
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        5. information_rights_status:
           Используй только одно из значений:
           - "defined" — если прямо закреплено право профсоюза
             на получение конкретной информации;
           - "declarative" — если только общая формулировка;
           - "not_defined" — если тема не раскрыта.

        6. information_rights_details:
           Краткое user-facing описание права на информацию.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        7. control_rights_status:
           Используй только одно из значений:
           - "defined" — если прямо закреплено право профсоюза
             на контроль (в т.ч. правовая инспекция труда);
           - "declarative" — если только общая формулировка;
           - "not_defined" — если тема не раскрыта.

        8. control_rights_details:
           Краткое user-facing описание права на контроль.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни union_participation_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона вместо текста договора.
        - Не делай выводов по типовой структуре договора.
        - defined = процедурное право прямо закреплено.
        - declarative = только общая формулировка.
        - not_defined = не раскрыто.
        - В dismissal_coordination_details фиксируй категории увольнений (по п. 2, 3, 5 ч. 1 ст. 81 ТК РФ или иным основаниям).
        - Если в разных фрагментах указаны противоречивые сведения — статус → "not_defined", текстовое поле → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни участия профсоюза в принятии ЛНА, ни согласования
           увольнений, ни права на информацию, ни права на контроль.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        2. Неполное раскрытие или прямое исключение.
           а) Общая фраза: "Профсоюз участвует в управлении организацией"
              без конкретных процедурных прав.
              → presence = "present";
                соответствующий *_status = "declarative";
                соответствующий *_details содержит указание
                на отсутствие конкретики.
           б) Прямо указано, что конкретное процедурное право профсоюза
              не применяется (например, согласование увольнений
              не предусмотрено).
              → presence = "present";
                соответствующий *_status = "defined";
                соответствующий *_details содержит дословную
                формулировку отказа.

        3. Противоречие между фрагментами.
           В разных частях договора указаны противоречивые условия
           о процедурных правах профсоюза.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             соответствующий *_details = "Не удалось определить".

        4. Специфика темы — полный набор процедурных прав.
           Закреплены участие в принятии ЛНА, согласование увольнений,
           право на информацию и контроль с конкретными процедурами.
           → presence = "present";
             все *_status = "defined";
             все *_details содержат конкретику.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для union_participation_check_presence используй только: "present", "missing", "unclear".
        - Для всех *_status используй только: "defined", "declarative", "not_defined".
        - Fallback при отсутствии данных:
          * все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "union_participation_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по процедурным правам профсоюза. Внутреннее агрегатное signal-поле."
          required: true

        - name: "lna_participation_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "declarative", "not_defined"]
          description: "Статус участия профсоюза в принятии ЛНА."
          required: true

        - name: "lna_participation_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Участие в ЛНА"
          description: "Участие профсоюза в принятии локальных нормативных актов."
          required: false

        - name: "dismissal_coordination_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "declarative", "not_defined"]
          description: "Статус согласования увольнений."
          required: true

        - name: "dismissal_coordination_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Согласование увольнений"
          description: "Категории увольнений, требующих согласования с профсоюзом."
          required: false

        - name: "information_rights_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "declarative", "not_defined"]
          description: "Статус права профсоюза на информацию."
          required: true

        - name: "information_rights_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Право на информацию"
          description: "Право профсоюза на получение информации."
          required: false

        - name: "control_rights_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "declarative", "not_defined"]
          description: "Статус права профсоюза на контроль."
          required: true

        - name: "control_rights_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Право на контроль"
          description: "Право профсоюза на осуществление контроля."
          required: false

      store_payload: true

  - id: labor_personal_data_check
    name: "Персональные данные работников (ст. 86–90 ТК РФ, 152-ФЗ)"
    description: >
      Фактографическая проверка обязательств по обработке персональных данных
      работников: согласие, порядок обработки, передача третьим лицам, защита.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 200

    rules:
      keywords:
        - "персональные данные"
        - "обработка персональных данных"
        - "согласие на обработку"
        - "передача персональных данных"
        - "третьи лица"
        - "защита персональных данных"
        - "конфиденциальность персональных данных"
        - "хранение персональных данных"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)персональн(ые|ых)\\s+данн"
        - "(?i)согласи(е|я)\\s+на\\s+обработк"
        - "(?i)(передач|предоставлени).*третьим\\s+лиц"
        - "(?i)защит(а|ы)\\s+персональн"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по трудовому праву.
        Анализируется коллективный договор (ст. 86–90 ТК РФ, 152-ФЗ).
        Проверяется только один вопрос: обязательства по обработке ПДн работников.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        [ЗАДАЧА]
        Найди в тексте договора обязательства по ПДн работников:
        1. Порядок обработки ПДн.
        2. Получение согласия работника.
        3. Передача ПДн третьим лицам.
        4. Меры защиты ПДн.
        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если данные не указаны прямо — статусные поля возвращай "not_defined".
        3. Текстовые поля без значения — строго "Данные не определены".
        4. Верни РОВНО один валидный JSON-объект со всеми 9 ключами (8 полей + evidence),
           пригодный для парсинга через json.loads без предварительной обработки.
           Без markdown, без ```json, без комментариев, без текста до или после.
           Начни ответ сразу с { и закончи }.
        5. Не используй None, null или пустые строки.
        6. В evidence включай только текст договора.
        7. Для каждой темы:
           - "defined" — обязательство прямо закреплено;
           - "declarative" — только общая формулировка без процедуры;
           - "not_defined" — не раскрыто.
        8. В pd_transfer_details фиксируй категории получателей ПДн
           (государственные органы, контрагенты, аудиторы и т.п.).
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 (полное определение):
        Фрагмент:
        "Обработка персональных данных работников осуществляется с их письменного
        согласия. Передача персональных данных третьим лицам допускается только
        с согласия работника, за исключением случаев, предусмотренных законом.
        Работодатель обеспечивает защиту персональных данных в соответствии
        с 152-ФЗ."
        Ответ:
        {
          "pd_processing_status": "defined",
          "pd_processing_details": "обработка с письменного согласия работника",
          "pd_consent_status": "defined",
          "pd_consent_details": "письменное согласие работника",
          "pd_transfer_status": "defined",
          "pd_transfer_details": "передача третьим лицам — только с согласия работника, кроме случаев по закону",
          "pd_protection_status": "defined",
          "pd_protection_details": "защита в соответствии с 152-ФЗ",
          "evidence": [
            {
              "clause_ref": "п. 7.1",
              "quote": "Обработка персональных данных работников осуществляется с их письменного согласия."
            }
          ]
        }
        Пример 2 (частичное определение):
        Фрагмент:
        "Работодатель обязуется обеспечивать защиту персональных данных работников."
        Ответ:
        {
          "pd_processing_status": "declarative",
          "pd_processing_details": "обеспечение защиты персональных данных (без процедуры)",
          "pd_consent_status": "not_defined",
          "pd_consent_details": "Данные не определены",
          "pd_transfer_status": "not_defined",
          "pd_transfer_details": "Данные не определены",
          "pd_protection_status": "declarative",
          "pd_protection_details": "обеспечение защиты персональных данных (без конкретных мер)",
          "evidence": [
            {
              "clause_ref": "п. 7.1",
              "quote": "Работодатель обязуется обеспечивать защиту персональных данных работников."
            }
          ]
        }
        Пример 3 (не раскрыто):
        Фрагмент:
        "Работодатель соблюдает трудовое законодательство."
        Ответ:
        {
          "pd_processing_status": "not_defined",
          "pd_processing_details": "Данные не определены",
          "pd_consent_status": "not_defined",
          "pd_consent_details": "Данные не определены",
          "pd_transfer_status": "not_defined",
          "pd_transfer_details": "Данные не определены",
          "pd_protection_status": "not_defined",
          "pd_protection_details": "Данные не определены",
          "evidence": []
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямые цитаты по каждой из 4 тем.
        2. Разграничь процедурные обязательства и общие формулировки.
        3. Если прямой цитаты нет — верни "not_defined". Не додумывай.
        4. Проверь, что все 9 ключей (8 полей + evidence) присутствуют в JSON.
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "pd_processing_status": "<defined / declarative / not_defined>",
          "pd_processing_details": "<текст или 'Данные не определены'>",
          "pd_consent_status": "<defined / declarative / not_defined>",
          "pd_consent_details": "<текст или 'Данные не определены'>",
          "pd_transfer_status": "<defined / declarative / not_defined>",
          "pd_transfer_details": "<текст или 'Данные не определены'>",
          "pd_protection_status": "<defined / declarative / not_defined>",
          "pd_protection_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 10
      temperature: 0.0
      max_tokens: 900

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "персональные данные обработка персональных данных согласие на обработку передача персональных данных третьи лица защита персональных данных конфиденциальность персональных данных хранение персональных данных 152-ФЗ"
      preferred_unit_types:
        - personal_data
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - procedures
        - obligations
      negative_keywords:
        - "профсоюзные взносы"
        - "забастовка"
        - "в целях настоящего"
      context_k: 10
      max_chunks: 14
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "procedures"
        - "obligations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 700

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1200

      compact_output: false

      presence_signal:
        field: "labor_personal_data_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по трудовому праву. Извлеки из коллективного договора
        сведения об обработке персональных данных работников
        (ст. 86–90 ТК РФ, 152-ФЗ).
        Не анализируй другие темы коллективного договора.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. labor_personal_data_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (pd_processing_status, pd_consent_status,
              pd_transfer_status, pd_protection_status)
             ≠ "not_defined";
           - "missing" — если все четыре содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - pd_processing_status = "not_defined";
           - pd_consent_status = "not_defined";
           - pd_transfer_status = "not_defined";
           - pd_protection_status = "not_defined";
           - все *_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. pd_processing_status:
           Используй только одно из значений:
           - "defined" — если прямо закреплён порядок обработки ПДн
             работников;
           - "declarative" — если есть только общая формулировка
             без процедуры;
           - "not_defined" — если тема не раскрыта.

        2. pd_processing_details:
           Краткое user-facing описание порядка обработки ПДн.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        3. pd_consent_status:
           Используй только одно из значений:
           - "defined" — если прямо закреплён порядок получения
             согласия работника;
           - "declarative" — если только общая формулировка;
           - "not_defined" — если тема не раскрыта.

        4. pd_consent_details:
           Краткое user-facing описание порядка получения согласия.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        5. pd_transfer_status:
           Используй только одно из значений:
           - "defined" — если прямо закреплены условия передачи ПДн
             третьим лицам (категории получателей, случаи);
           - "declarative" — если только общая формулировка;
           - "not_defined" — если тема не раскрыта.

        6. pd_transfer_details:
           Краткое user-facing описание передачи ПДн
           (категории получателей).
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        7. pd_protection_status:
           Используй только одно из значений:
           - "defined" — если прямо закреплены конкретные меры защиты
             ПДн (шифрование, ограничение доступа, назначение
             ответственного);
           - "declarative" — если только общая формулировка;
           - "not_defined" — если тема не раскрыта.

        8. pd_protection_details:
           Краткое user-facing описание мер защиты ПДн.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни labor_personal_data_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона вместо текста договора.
        - Не делай выводов по типовой структуре договора.
        - defined = обязательство прямо закреплено.
        - declarative = только общая формулировка.
        - not_defined = не раскрыто.
        - В pd_transfer_details фиксируй категории получателей (госорганы, контрагенты, аудиторы и т.п.).
        - В pd_protection_details фиксируй конкретные меры (шифрование, ограничение доступа, назначение ответственного и т.п.).
        - Если в разных фрагментах указаны противоречивые сведения — статус → "not_defined", текстовое поле → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни порядка обработки ПДн, ни согласия,
           ни передачи третьим лицам, ни мер защиты.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        2. Неполное раскрытие или прямое исключение.
           а) Общая фраза: "Работодатель соблюдает законодательство
              о персональных данных" без процедуры.
              → presence = "present";
                соответствующий *_status = "declarative";
                соответствующий *_details содержит указание
                на отсутствие конкретики.
           б) Прямо указано, что конкретное обязательство
              не применяется.
              → presence = "present";
                соответствующий *_status = "defined";
                соответствующий *_details содержит дословную
                формулировку отказа.

        3. Противоречие между фрагментами.
           В разных частях договора указаны противоречивые условия
           обработки ПДн.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             соответствующий *_details = "Не удалось определить".

        4. Специфика темы — полный набор процедурных обязательств.
           Закреплены порядок обработки, согласие работника, условия
           передачи третьим лицам и конкретные меры защиты.
           → presence = "present";
             все *_status = "defined";
             все *_details содержат конкретику.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для labor_personal_data_check_presence используй только: "present", "missing", "unclear".
        - Для всех *_status используй только: "defined", "declarative", "not_defined".
        - Fallback при отсутствии данных:
          * все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "labor_personal_data_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по персональным данным работников. Внутреннее агрегатное signal-поле."
          required: true

        - name: "pd_processing_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "declarative", "not_defined"]
          description: "Статус описания обработки ПДн."
          required: true

        - name: "pd_processing_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Обработка ПДн"
          description: "Порядок обработки персональных данных работников."
          required: false

        - name: "pd_consent_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "declarative", "not_defined"]
          description: "Статус согласия на обработку."
          required: true

        - name: "pd_consent_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Согласие на обработку"
          description: "Порядок получения согласия работника."
          required: false

        - name: "pd_transfer_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "declarative", "not_defined"]
          description: "Статус передачи ПДн третьим лицам."
          required: true

        - name: "pd_transfer_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Передача ПДн"
          description: "Условия передачи ПДн третьим лицам."
          required: false

        - name: "pd_protection_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "declarative", "not_defined"]
          description: "Статус мер защиты ПДн."
          required: true

        - name: "pd_protection_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Защита ПДн"
          description: "Меры защиты персональных данных."
          required: false

      store_payload: true





# ════════════════════════════════════════════════════════════════════════════
# БЛОК 5: DD_REQUEST_TEMPLATES
# Читается: DDRequestTemplateLoader
# ════════════════════════════════════════════════════════════════════════════

dd_request_templates:
  parties_and_representatives_check:
    text: >
      Просим предоставить по {doc_names}: (а) полные реквизиты работодателя;
      (б) наименование представительного органа работников и документы,
      подтверждающие полномочия (протокол собрания/конференции, доверенность, приказ);
      (в) ФИО и должности уполномоченных представителей обеих сторон.
    addressee: "Обе стороны"

  term_scope_coverage_check:
    text: >
      Просим уточнить в {doc_names}: (а) дату начала и окончания действия;
      (б) подтверждение, что срок не превышает 3 лет (ст. 43 ТК РФ);
      (в) условия и порядок продления; (г) сферу действия (организация / филиал /
      подразделение); (д) подтверждение распространения на всех работников
      независимо от членства в профсоюзе.
    addressee: "Обе стороны"

  no_worsening_principle_check:
    text: >
      Просим проверить {doc_names} на наличие: (а) явного указания на недопустимость
      ухудшения положения работников (ст. 9, 50 ТК РФ); (б) потенциально ухудшающих
      условий (снижение гарантий, замена льгот, отказ от прав).
    addressee: "Юридический советник / Орган по труду"

  wage_indexation_check:
    text: >
      Просим уточнить в {doc_names}: конкретный механизм индексации заработной платы
      (ст. 134 ТК РФ) — привязка к ИПЦ, фиксированный процент, периодичность,
      порядок принятия решения. Общие декларации без конкретики недостаточны.
    addressee: "Работодатель / Финансовая служба"

  union_activity_guarantees_check:
    text: >
      Просим предоставить по {doc_names}: (а) подтверждение предоставления помещения
      профсоюзу; (б) порядок освобождения профсоюзных работников от основной работы;
      (в) механизм перечисления профсоюзных взносов; (г) гарантии при увольнении
      профсоюзных работников (ст. 374–377 ТК РФ).
    addressee: "Работодатель"

  multiple_unions_check:
    text: >
      В {doc_names} выявлено наличие нескольких профсоюзных организаций. Просим
      предоставить: (а) протокол создания единого представительного органа;
      (б) подтверждение пропорционального представительства; (в) документы по ст. 37 ТК РФ.
    addressee: "Представители работников"

  job_security_retraining_check:
    text: >
      Просим уточнить в {doc_names}: (а) конкретные гарантии занятости при реструктуризации;
      (б) обязательства по переподготовке; (в) размер дополнительного выходного пособия;
      (г) приоритеты при повторном трудоустройстве.
    addressee: "Работодатель"

  reorganization_succession_check:
    text: >
      Просим уточнить в {doc_names}: (а) порядок действия договора при реорганизации
      (ст. 43 ТК РФ); (б) обязательства правопреемника; (в) порядок при смене формы
      собственности (3 месяца); (г) последствия ликвидации.
    addressee: "Юридический советник работодателя"

  social_benefits_detail_check:
    text: >
      Просим детализировать в {doc_names} социальные обязательства: указать конкретные
      размеры (суммы в рублях или процентах), условия получения, круг получателей,
      сроки выплат, источники финансирования.
    addressee: "Работодатель / Финансовая служба"

  amendment_control_registration_check:
    text: >
      Просим уточнить в {doc_names}: (а) порядок внесения изменений и дополнений
      (ст. 44 ТК РФ); (б) обязательство направить договор на уведомительную
      регистрацию в орган по труду в 7-дневный срок (ст. 50 ТК РФ); (в) создание
      совместной контрольной комиссии и периодичность отчётности (ст. 51 ТК РФ).
    addressee: "Обе стороны"

  dispute_resolution_liability_check:
    text: >
      Просим согласовать в {doc_names} поэтапную процедуру разрешения разногласий:
      переговоры → примирительная комиссия → посредник/медиатор → трудовой арбитраж
      (ст. 398–418 ТК РФ). Просим уточнить ответственность сторон за невыполнение
      обязательств (ст. 55 ТК РФ, ст. 5.28–5.31 КоАП РФ).
    addressee: "Обе стороны"

  working_conditions_safety_check:
    text: >
      Просим уточнить в {doc_names}: (а) режимы рабочего времени; (б) продолжительность
      ежегодного и дополнительных отпусков; (в) перечень мероприятий по охране труда
      и объём финансирования (не менее 0,2% от затрат на производство);
      (г) результаты СОУТ и классы условий труда; (д) размеры доплат и дополнительных
      отпусков за вредные/опасные условия; (е) порядок обеспечения СИЗ и медосмотров.
    addressee: "Работодатель / Служба охраны труда"

  _default:
    text: >
      Просим предоставить дополнительную информацию по вопросу «{check_name}»
      применительно к {doc_names}.
    addressee: "Юридический советник"
