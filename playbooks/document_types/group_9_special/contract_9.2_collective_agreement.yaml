        - mrot_compliance_status: "defined" — прямо упомянут МРОТ или региональное
          соглашение; "not_defined" — нет.
        - Если remuneration_system_status ∈ {defined, declarative} ИЛИ хотя бы
          один из остальных статусов ≠ "not_defined", то
          remuneration_system_check_presence = "present".
        - Если все поля = "not_defined", то
          remuneration_system_check_presence = "missing".
        </context_rules>
        <edge_cases>
        1. Полное отсутствие фрагментов об оплате труда, окладах, надбавках,
           датах выплат и МРОТ → remuneration_system_check_presence = "missing",
           все статусы = "not_defined".
        2. Декларация «оплата труда в соответствии с ТК РФ» без конкретики →
           presence = "present", remuneration_system_status = "declarative",
           остальные = "not_defined".
        3. Полное покрытие (система + оклады + надбавки + даты + МРОТ) →
           presence = "present", все статусы = "defined".
        4. Противоречие: в одном разделе «выплата 5 и 20 числа», в другом —
           «выплата не позднее 10 числа каждого месяца» → presence = "unclear",
           payment_dates_status = "not_defined" с пояснением в details.
        </edge_cases>
        <output_expectations>
        - Все 10 полей (1 presence + 9 substantive) обязательны.
        - Статусные и enum-поля возвращают только значения из allowed_values.
        - Текстовые поля без данных — строго "Данные не определены".
        - Не используй None, null или пустые строки.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "remuneration_system_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие фрагментов о системах оплаты труда, надбавках и датах выплат."
