      compact_output: false

      presence_signal:
        field: "family_and_women_guarantees_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по трудовому праву. Извлеки из коллективного
        договора сведения о гарантиях женщинам и лицам с семейными
        обязанностями (ст. 253–264 ТК РФ).
        Не анализируй охрану труда, индексацию, обучение или споры.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. family_and_women_guarantees_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (pregnant_women_guarantees_status, parental_leave_status,
              family_payments_status, flexible_schedule_status,
              dismissal_protection_status,
              extra_days_and_benefits_status) ≠ "not_defined";
           - "missing" — если все шесть содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - все шесть *_status = "not_defined";
           - все *_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. pregnant_women_guarantees_status:
           Используй только одно из значений:
           - "defined" — КД прямо закрепляет гарантии беременным
             с параметрами (снижение норм, перевод на другую работу,
             сохранение среднего заработка, освобождение от ночных /
             сверхурочных с конкретикой);
           - "declarative" — только упоминание без конкретики;
           - "not_defined" — тема не раскрыта.

        2. pregnant_women_guarantees_details:
           Краткое user-facing описание гарантий беременным.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        3. parental_leave_status:
           Используй только одно из значений:
           - "defined" — КД устанавливает дополнительные выплаты /
             гарантии при отпуске по уходу за ребёнком;
           - "declarative" — только цитирование ТК РФ;
           - "not_defined" — тема не раскрыта.

        4. parental_leave_details:
           Краткое user-facing описание гарантий при отпуске по уходу.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        5. family_payments_status:
           Используй только одно из значений:
           - "defined" — КД устанавливает выплаты при рождении /
             усыновлении ребёнка;
           - "declarative" — только упоминание без размера;
           - "not_defined" — тема не раскрыта.

        6. family_payments_details:
           Краткое user-facing описание выплат (размер, порядок).
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        7. flexible_schedule_status:
           Используй только одно из значений:
           - "defined" — КД закрепляет право на гибкий график /
             неполное рабочее время для беременных и лиц
             с семейными обязанностями;
           - "declarative" — только цитирование ТК РФ;
           - "not_defined" — тема не раскрыта.

        8. flexible_schedule_details:
           Краткое user-facing описание гибкого графика.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        9. dismissal_protection_status:
           Используй только одно из значений:
           - "defined" — КД закрепляет дополнительные гарантии
             от увольнения для беременных / женщин с детьми до 3 лет /
             одиноких матерей;
           - "declarative" — только цитирование ТК РФ;
           - "not_defined" — тема не раскрыта.

        10. dismissal_protection_details:
            Краткое user-facing описание защиты от увольнения.
            Если данных нет — "Данные не определены".
            Если данные противоречивы — "Не удалось определить".

        11. extra_days_and_benefits_status:
            Используй только одно из значений:
            - "defined" — КД закрепляет дополнительные выходные дни,
              преимущественное право на отпуск, дополнительный отпуск
              без сохранения зарплаты для лиц с семейными обязанностями;
            - "declarative" — только цитирование ТК РФ;
            - "not_defined" — тема не раскрыта.

        12. extra_days_and_benefits_details:
            Краткое user-facing описание дополнительных дней и льгот.
            Если данных нет — "Данные не определены".
            Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни family_and_women_guarantees_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона вместо текста договора.
        - Не делай выводов по типовой структуре договора.
        - Различай: "defined" — КД закрепляет гарантию сверх ТК РФ с параметрами; "declarative" — только цитирование нормы ТК РФ.
        - В family_payments_details обязательно фиксируй размер выплаты, если он указан.
        - В dismissal_protection_details фиксируй категории, на которые распространяется защита (беременные, женщины с детьми до 3 лет, одинокие матери и т.п.).
        - Если в разных фрагментах указаны противоречивые сведения — статус → "not_defined", текстовое поле → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни гарантий беременным, ни отпусков по уходу,
           ни выплат при рождении, ни гибкого графика, ни защиты
           от увольнения, ни дополнительных дней.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        2. Неполное раскрытие или только цитирование ТК РФ.
           а) Общая фраза: "Работникам предоставляются гарантии,
              предусмотренные ТК РФ" — только цитирование.
              → presence = "present";
                соответствующий *_status = "declarative".
           б) Прямо указано, что конкретная гарантия не предоставляется.
              → presence = "present";
                соответствующий *_status = "defined";
                соответствующий *_details содержит дословную
                формулировку отказа.

        3. Противоречие между фрагментами.
           В разных разделах договора указаны противоречивые гарантии
           (например, разные размеры выплат при рождении).
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             соответствующий *_details = "Не удалось определить".

        4. Полное раскрытие гарантий с параметрами.
           По всем ключевым темам КД закрепляет конкретные гарантии
           сверх ТК РФ с размерами и порядком.
           → presence = "present";
             все *_status = "defined";
             все *_details содержат конкретику.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для family_and_women_guarantees_check_presence используй только: "present", "missing", "unclear".
        - Для всех *_status используй только: "defined", "declarative", "not_defined".
        - Fallback при отсутствии данных:
          * все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "family_and_women_guarantees_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по гарантиям женщинам и лицам с семейными обязанностями. Внутреннее агрегатное signal-поле."
