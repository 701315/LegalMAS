  - id: reorganization_succession_check
    name: "Действие договора при реорганизации, смене собственника, ликвидации (ст. 43, 75 ТК РФ)"
    description: >
      Фактографическая проверка наличия положений о судьбе коллективного договора
      при реорганизации, смене формы собственности и ликвидации организации.
    triggers:
      any:
        - reorganization_context
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 80

    rules:
      keywords:
        - "реорганизация"
        - "правопреемник"
        - "слияние"
        - "присоединение"
        - "разделение"
        - "выделение"
        - "преобразование"
        - "смена собственника"
        - "ликвидация"
        - "сохранение действия договора"
        - "действие в период реорганизации"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)в\\s+случае\\s+реорганизаци"
        - "(?i)при\\s+смене\\s+собственник"
        - "(?i)правопреемник.*обязательств"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по трудовому праву.
        Анализируется коллективный договор (ст. 43, 75 ТК РФ).
        Проверяется только один вопрос: действие договора при реорганизации,
        смене собственника и ликвидации.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        [ЗАДАЧА]
        Найди в тексте договора:
        1. Положение о реорганизации.
        2. Что происходит с договором при реорганизации.
        3. Положение о смене собственника.
        4. Положение о ликвидации.
        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если данные не указаны прямо — статусные и enum-поля возвращай "not_defined".
        3. Текстовые поля без значения — строго "Данные не определены".
        4. Верни РОВНО один валидный JSON-объект со всеми 8 ключами (7 полей + evidence),
           пригодный для парсинга через json.loads без предварительной обработки.
           Без markdown, без ```json, без комментариев, без текста до или после.
           Начни ответ сразу с { и закончи }.
        5. Не используй None, null или пустые строки.
        6. В evidence включай только текст договора.
        7. reorganization_action_code:
           - "continues" — договор продолжает действие (в т.ч. на период
             реорганизации / до окончания срока);
           - "renegotiation" — стороны обязуются начать переговоры о новом
             договоре / пересмотреть действующий;
           - "terminates" — договор прекращается (в т.ч. при ликвидации,
             ст. 43 ч. 5 ТК РФ);
           - "not_defined" — судьба договора не указана.
        8. При смене собственника в тексте часто указывается срок действия
           (по ст. 43 ч. 8 ТК РФ — 3 месяца). Фиксируй его в ownership_change_details.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 (реорганизация + смена собственника):
        Фрагмент:
        "В случае реорганизации Работодателя настоящий договор продолжает действовать
        до окончания срока его действия. При смене собственника имущества организации
        договор сохраняет действие в течение трёх месяцев."
        Ответ:
        {
          "reorganization_clause_status": "defined",
          "reorganization_action_code": "continues",
          "reorganization_action_details": "продолжает действовать до окончания срока его действия",
          "ownership_change_status": "defined",
          "ownership_change_details": "сохраняет действие в течение трёх месяцев",
          "liquidation_status": "not_defined",
          "liquidation_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 8.3",
              "quote": "В случае реорганизации Работодателя настоящий договор продолжает действовать до окончания срока его действия."
            },
            {
              "clause_ref": "п. 8.4",
              "quote": "При смене собственника имущества организации договор сохраняет действие в течение трёх месяцев."
            }
          ]
        }
        Пример 2 (ликвидация):
        Фрагмент:
        "При ликвидации организации настоящий коллективный договор прекращает
        своё действие."
        Ответ:
        {
          "reorganization_clause_status": "not_defined",
          "reorganization_action_code": "not_defined",
          "reorganization_action_details": "Данные не определены",
          "ownership_change_status": "not_defined",
          "ownership_change_details": "Данные не определены",
          "liquidation_status": "defined",
          "liquidation_details": "прекращает своё действие при ликвидации организации",
          "evidence": [
            {
              "clause_ref": "п. 8.5",
              "quote": "При ликвидации организации настоящий коллективный договор прекращает своё действие."
            }
          ]
        }
        Пример 3 (положения отсутствуют):
        Фрагмент:
        "Стороны обязуются исполнять настоящий договор."
        Ответ:
        {
          "reorganization_clause_status": "not_defined",
          "reorganization_action_code": "not_defined",
          "reorganization_action_details": "Данные не определены",
          "ownership_change_status": "not_defined",
          "ownership_change_details": "Данные не определены",
          "liquidation_status": "not_defined",
          "liquidation_details": "Данные не определены",
          "evidence": []
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о реорганизации.
        2. Найди прямую цитату о смене собственника.
        3. Найди прямую цитату о ликвидации.
        4. Если прямой цитаты нет — верни "not_defined". Не додумывай.
        5. Проверь, что все 8 ключей (7 полей + evidence) присутствуют в JSON.
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "reorganization_clause_status": "<defined / not_defined>",
          "reorganization_action_code": "<continues / renegotiation / terminates / not_defined>",
          "reorganization_action_details": "<текст или 'Данные не определены'>",
          "ownership_change_status": "<defined / not_defined>",
          "ownership_change_details": "<текст или 'Данные не определены'>",
          "liquidation_status": "<defined / not_defined>",
          "liquidation_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 10
      temperature: 0.0
      max_tokens: 700

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "реорганизация правопреемник слияние присоединение разделение выделение преобразование смена собственника ликвидация сохранение действия договора действие в период реорганизации пересмотр"
      preferred_unit_types:
        - termination_provision
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - procedures
        - boilerplate
      negative_keywords:
        - "индексация"
        - "охрана труда"
        - "отпуск"
        - "рабочее время"
        - "профсоюзные взносы"
        - "забастовка"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.55, 1.0]
        boost: 0.30
        scope: segment
      context_k: 10
      max_chunks: 14
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "procedures"
        - "boilerplate"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1200

      compact_output: false

      presence_signal:
        field: "reorganization_succession_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по трудовому праву. Извлеки из коллективного договора
        сведения о действии договора при реорганизации, смене собственника и ликвидации
        (ст. 43, 75 ТК РФ).
        Не анализируй индексацию, охрану труда или споры.
        </role>
        <context>
        {context}
        </context>
        <task>
        0. reorganization_succession_check_presence: определи, есть ли в договоре
           фрагменты, касающиеся судьбы договора при реорганизации, смене собственника
           или ликвидации.
           - "present" — есть хотя бы один фрагмент по теме (положение о реорганизации,
             смене собственника, ликвидации, правопреемстве).
           - "missing" — фрагментов по теме нет вообще.
           - "unclear" — фрагменты есть, но противоречат друг другу и вывод невозможен.

        1. reorganization_clause_status — defined / not_defined.
        2. reorganization_action_code — continues / renegotiation / terminates / not_defined.
        3. reorganization_action_details — что происходит с договором при реорганизации.
        4. ownership_change_status — defined / not_defined.
        5. ownership_change_details — положение о смене собственника (со сроком, если указан).
        6. liquidation_status — defined / not_defined.
        7. liquidation_details — положение о ликвидации.

        Если данные отсутствуют в тексте:
        - статус/enum = "not_defined"
        - текстовое поле = "Данные не определены"
        </task>
        <context_rules>
        - reorganization_succession_check_presence и все статусные поля попарно не
          пересекаются по значениям present/missing/unclear; их объединение покрывает
          все допустимые значения.
        - reorganization_clause_status: "defined" — положение о реорганизации прямо
          указано; "not_defined" — не указано.
        - reorganization_action_code: "continues" — договор продолжает действие;
          "renegotiation" — стороны обязуются начать переговоры / пересмотреть договор;
          "terminates" — договор прекращается; "not_defined" — не указано.
        - ownership_change_status: "defined" — положение о смене собственника указано;
          "not_defined" — не указано. В details обязательно фиксируй срок, если он
          указан (по ст. 43 ч. 8 ТК РФ — 3 месяца).
        - liquidation_status: "defined" — положение о ликвидации указано;
          "not_defined" — не указано.
        - Если reorganization_clause_status = "defined" ИЛИ
          ownership_change_status = "defined" ИЛИ liquidation_status = "defined", то
          reorganization_succession_check_presence = "present".
        - Если все поля = "not_defined", то
          reorganization_succession_check_presence = "missing".
        </context_rules>
        <edge_cases>
        1. Полное отсутствие фрагментов о реорганизации, смене собственника
           и ликвидации → reorganization_succession_check_presence = "missing",
           все поля = "not_defined".
        2. Только реорганизация («договор продолжает действовать до окончания
           срока») без смены собственника и ликвидации → presence = "present",
           reorganization_clause_status = "defined",
           reorganization_action_code = "continues", остальные = "not_defined".
        3. Все три сценария раскрыты (реорганизация + смена собственника со сроком
           3 месяца + ликвидация) → presence = "present", все статусы = "defined".
        4. Противоречие: в одном разделе «договор сохраняет действие при
           реорганизации», в другом — «договор прекращается при любом изменении
           организационно-правовой формы» → presence = "unclear",
           reorganization_action_code = "not_defined" с пояснением в details.
        </edge_cases>
        <output_expectations>
        - Все 8 полей (1 presence + 7 substantive) обязательны.
        - Статусные и enum-поля возвращают только значения из allowed_values.
        - Текстовые поля без данных — строго "Данные не определены".
        - Не используй None, null или пустые строки.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "reorganization_succession_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие фрагментов о действии договора при реорганизации, смене собственника, ликвидации."
          required: true
        - name: "reorganization_clause_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус положения о реорганизации."
          required: true
        - name: "reorganization_action_code"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["continues", "renegotiation", "terminates", "not_defined"]
          description: "Что происходит с договором при реорганизации."
          required: true
        - name: "reorganization_action_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Реорганизация"
          description: "Положение о реорганизации."
          required: false
        - name: "ownership_change_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус положения о смене собственника."
          required: true
        - name: "ownership_change_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Смена собственника"
          description: "Положение о смене собственника (с указанием срока, если есть)."
          required: false
        - name: "liquidation_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус положения о ликвидации."
          required: true
        - name: "liquidation_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Ликвидация"
          description: "Положение о ликвидации."
          required: false

      store_payload: true

  - id: social_benefits_detail_check
    name: "Детализация финансовых и социальных льгот (ст. 41 ТК РФ)"
    description: >
      Фактографическая проверка наличия конкретных параметров социальных обязательств
      работодателя: размеры выплат, условия, сроки, круг получателей.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 90

    rules:
      keywords:
        - "материальная помощь"
        - "доплата"
        - "компенсация"
        - "премия"
        - "надбавка"
        - "ДМС"
        - "добровольное медицинское страхование"
        - "оздоровление"
        - "санаторно-курортное лечение"
        - "питание"
        - "проезд"
        - "в размере"
        - "в сумме"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)в\\s+размере\\s+\\d+"
        - "(?i)в\\s+сумме\\s+\\d+"
        - "(?i)\\d+\\s*(руб|рублей|%|процент)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по трудовому праву.
        Анализируется коллективный договор (ст. 41 ТК РФ).
        Проверяется только один вопрос: детализация социальных и финансовых льгот.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        [ЗАДАЧА]
        Найди в тексте договора:
        1. Перечень выявленных социальных льгот.
        2. Указаны ли конкретные суммы/размеры.
        3. Указаны ли условия получения льгот.
        4. Указаны ли сроки выплат.
        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если данные не указаны прямо — статусные и enum-поля возвращай "not_defined".
        3. Текстовые поля без значения — строго "Данные не определены".
        4. Верни РОВНО один валидный JSON-объект со всеми 9 ключами (8 полей + evidence),
           пригодный для парсинга через json.loads без предварительной обработки.
           Без markdown, без ```json, без комментариев, без текста до или после.
           Начни ответ сразу с { и закончи }.
        5. Не используй None, null или пустые строки.
        6. В evidence включай только текст договора. Если текстовое поле details заполнено,
           соответствующая цитата должна быть в evidence.
        7. benefits_list_status:
           - "defined" — есть конкретный перечень льгот;
           - "declarative" — только общая декларация («обеспечивает социальные гарантии»)
             без перечня;
           - "not_defined" — льготы не упоминаются.
        8. benefits_with_amounts_status и benefits_with_conditions_status:
           - "yes" — у большинства льгот указаны суммы/условия;
           - "partially" — у части льгот есть конкретика;
           - "no" — все льготы декларативные;
           - "not_defined" — льготы не упоминаются.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 (частичная детализация):
        Фрагмент:
        "Работникам предоставляется ДМС. Материальная помощь к отпуску — 15 000 рублей.
        Компенсация проезда к месту работы — 3 000 рублей в месяц."
        Ответ:
        {
          "benefits_list_status": "defined",
          "benefits_list_value": "ДМС; материальная помощь к отпуску; компенсация проезда",
          "benefits_with_amounts_status": "partially",
