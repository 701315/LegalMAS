      min_snippet_length: 40
      max_snippet_length: 500

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1000

      compact_output: false

      presence_signal:
        field: "multiple_unions_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по трудовому праву. Извлеки из коллективного договора
        сведения о порядке представительства при наличии нескольких профсоюзов
        (ст. 37 ТК РФ).
        Не анализируй содержание обязательств, индексацию или охрану труда.
        </role>
        <context>
        {context}
        </context>
        <task>
        0. multiple_unions_check_presence: определи, есть ли в договоре фрагменты,
           касающиеся множественности профсоюзов, единого представительного органа
           или порядка представительства работников.
           - "present" — есть хотя бы один фрагмент по теме (упоминание нескольких
             профсоюзов, единого органа, способа представительства).
           - "missing" — фрагментов по теме нет вообще.
           - "unclear" — фрагменты есть, но противоречат друг другу и вывод невозможен.

        1. multiple_unions_status — defined / not_defined.
        2. multiple_unions_details — указание на наличие нескольких профсоюзов.
        3. unified_body_status — defined / not_defined.
        4. unified_body_details — создание единого представительного органа.
        5. representation_method — unified_body / majority_union / no_unified_body /
           elected_at_meeting / other / not_defined.

        Если данные отсутствуют в тексте:
        - статус/enum = "not_defined"
        - текстовое поле = "Данные не определены"
        </task>
        <context_rules>
        - multiple_unions_check_presence и все статусные поля попарно не пересекаются
          по значениям present/missing/unclear; их объединение покрывает все допустимые значения.
        - multiple_unions_status: "defined" — прямо указано наличие нескольких профсоюзов;
          "not_defined" — не указано.
        - unified_body_status: "defined" — создание единого представительного органа
          прямо указано; "not_defined" — не указано.
        - representation_method: "unified_body" — единый орган на пропорциональной основе
          (ст. 37 ч. 2 ТК РФ); "majority_union" — профсоюз >50% ведёт переговоры
          (ст. 37 ч. 3 ТК РФ); "no_unified_body" — право у крупнейшей ППО
          (ст. 37 ч. 5 ТК РФ); "elected_at_meeting" — избран на общем собрании;
          "other" — иной порядок; "not_defined" — не указан.
        - Если multiple_unions_status = "defined" ИЛИ unified_body_status = "defined"
          ИЛИ representation_method ≠ "not_defined", то
          multiple_unions_check_presence = "present".
        - Если все поля = "not_defined", то multiple_unions_check_presence = "missing".
        </context_rules>
        <edge_cases>
        1. Полное отсутствие упоминаний множественности профсоюзов, единого органа
           или порядка представительства → multiple_unions_check_presence = "missing",
           все поля = "not_defined".
        2. Указание «в организации действуют две профсоюзные организации, создан
           единый представительный орган» → presence = "present",
           multiple_unions_status = "defined", unified_body_status = "defined",
           representation_method = "unified_body".
        3. Один профсоюз, множественность не упомянута (преамбула: «Работодатель
           и первичная профсоюзная организация…») → presence = "missing",
           все поля = "not_defined".
        4. Противоречие: в преамбуле «единый представительный орган», в разделе
           о переговорах «переговоры ведёт профсоюз, объединяющий более половины
           работников» → presence = "unclear",
           representation_method = "other" с пояснением в details.
        </edge_cases>
        <output_expectations>
        - Все 6 полей (1 presence + 5 substantive) обязательны.
        - Статусные и enum-поля возвращают только значения из allowed_values.
        - Текстовые поля без данных — строго "Данные не определены".
        - Не используй None, null или пустые строки.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "multiple_unions_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие фрагментов о порядке представительства при множественности профсоюзов."
          required: true
        - name: "multiple_unions_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания на наличие нескольких профсоюзов."
          required: true
        - name: "multiple_unions_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Наличие нескольких профсоюзов"
          description: "Указание на наличие нескольких профсоюзных организаций."
          required: false
        - name: "unified_body_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус создания единого представительного органа."
          required: true
        - name: "unified_body_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Единый представительный орган"
          description: "Создание единого представительного органа."
          required: false
        - name: "representation_method"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["unified_body", "majority_union", "no_unified_body", "elected_at_meeting", "other", "not_defined"]
          description: "Способ определения представителя работников."
          required: true

      store_payload: true

  - id: job_security_retraining_check
    name: "Гарантии занятости и профессиональной переподготовки (ст. 180, 196 ТК РФ)"
    description: >
      Фактографическая проверка наличия обязательств работодателя по обеспечению занятости,
      переподготовке при внедрении новых технологий, повышенных гарантий при сокращении.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 70

    rules:
      keywords:
        - "гарантии занятости"
        - "обеспечение занятости"
        - "переобучение"
        - "переподготовка"
        - "повышение квалификации"
        - "сокращение штата"
        - "дополнительное выходное пособие"
        - "трудоустройство при сокращении"
        - "сохранение рабочих мест"
        - "внедрение новых технологий"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)при\\s+(внедрении|модернизации|реструктуризации).*переобучени"
        - "(?i)дополнительн(ое|ого)\\s+выходн(ое|ого)\\s+пособи"
        - "(?i)повышени(е|я)\\s+квалификаци(и|ю)\\s+за\\s+счёт\\s+работодателя"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по трудовому праву.
        Анализируется коллективный договор (ст. 180, 196 ТК РФ).
        Проверяется только один вопрос: гарантии занятости и переподготовки.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        [ЗАДАЧА]
        Найди в тексте договора:
        1. Гарантии занятости при реструктуризации / сокращении.
        2. Обязательство по переподготовке / повышению квалификации.
        3. Повышенное выходное пособие при сокращении.
        4. Приоритетное право на повторное трудоустройство.
        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если данные не указаны прямо — статусные и enum-поля возвращай "not_defined".
        3. Текстовые поля без значения — строго "Данные не определены".
        4. Верни РОВНО один валидный JSON-объект со всеми 9 ключами (8 полей + evidence),
           пригодный для парсинга через json.loads без предварительной обработки.
           Без markdown, без ```json, без комментариев, без текста до или после.
           Начни ответ сразу с { и закончи }.
        5. Не используй None, null или пустые строки.
        6. В evidence включай только текст договора. Если текстовое поле details заполнено,
           соответствующая цитата должна быть в evidence.
        7. job_security_status:
           - "concrete" — указаны конкретные мероприятия (переподготовка, сохранение
             рабочих мест, преимущественное право и т.п.);
           - "declarative" — только общие декларации («содействует занятости»,
             «обеспечивает трудовые права») без конкретных обязательств;
           - "not_defined" — вопрос занятости не раскрыт.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 (конкретные гарантии):
        Фрагмент:
        "При сокращении штата Работодатель обеспечивает переподготовку работников
        за свой счёт. Дополнительное выходное пособие — 3 среднемесячных заработка.
        При повторном трудоустройстве преимущество имеют ранее сокращённые работники."
        Ответ:
        {
          "job_security_status": "concrete",
          "job_security_details": "при сокращении штата обеспечение переподготовки за свой счёт",
          "retraining_obligation_status": "defined",
          "retraining_obligation_details": "переподготовка работников за свой счёт",
          "enhanced_severance_status": "defined",
          "enhanced_severance_details": "дополнительное выходное пособие — 3 среднемесячных заработка",
          "priority_rehiring_status": "defined",
          "priority_rehiring_details": "преимущество имеют ранее сокращённые работники",
          "evidence": [
            {
              "clause_ref": "п. 4.1",
              "quote": "При сокращении штата Работодатель обеспечивает переподготовку работников за свой счёт."
            },
            {
              "clause_ref": "п. 4.2",
              "quote": "Дополнительное выходное пособие — 3 среднемесячных заработка."
            },
            {
              "clause_ref": "п. 4.3",
              "quote": "При повторном трудоустройстве преимущество имеют ранее сокращённые работники."
            }
          ]
        }
        Пример 2 (только декларация):
        Фрагмент:
        "Работодатель содействует обеспечению занятости работников."
        Ответ:
        {
          "job_security_status": "declarative",
          "job_security_details": "содействует обеспечению занятости работников",
          "retraining_obligation_status": "not_defined",
          "retraining_obligation_details": "Данные не определены",
          "enhanced_severance_status": "not_defined",
          "enhanced_severance_details": "Данные не определены",
          "priority_rehiring_status": "not_defined",
          "priority_rehiring_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 4.1",
              "quote": "Работодатель содействует обеспечению занятости работников."
            }
          ]
        }
        Пример 3 (вопрос не раскрыт):
        Фрагмент:
        "Работодатель обязуется соблюдать трудовое законодательство."
        Ответ:
        {
          "job_security_status": "not_defined",
          "job_security_details": "Данные не определены",
          "retraining_obligation_status": "not_defined",
          "retraining_obligation_details": "Данные не определены",
          "enhanced_severance_status": "not_defined",
          "enhanced_severance_details": "Данные не определены",
          "priority_rehiring_status": "not_defined",
          "priority_rehiring_details": "Данные не определены",
          "evidence": []
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о гарантиях занятости.
        2. Найди прямую цитату о переподготовке.
        3. Найди прямую цитату о повышенном выходном пособии.
        4. Найди прямую цитату о приоритетном трудоустройстве.
        5. Если прямой цитаты нет — верни "not_defined". Не додумывай.
        6. Проверь, что все 9 ключей (8 полей + evidence) присутствуют в JSON.
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "job_security_status": "<concrete / declarative / not_defined>",
          "job_security_details": "<текст или 'Данные не определены'>",
          "retraining_obligation_status": "<defined / not_defined>",
          "retraining_obligation_details": "<текст или 'Данные не определены'>",
          "enhanced_severance_status": "<defined / not_defined>",
          "enhanced_severance_details": "<текст или 'Данные не определены'>",
          "priority_rehiring_status": "<defined / not_defined>",
          "priority_rehiring_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 10
      temperature: 0.0
      max_tokens: 800

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "гарантии занятости обеспечение занятости переобучение переподготовка повышение квалификации сокращение штата дополнительное выходное пособие трудоустройство при сокращении сохранение рабочих мест внедрение новых технологий преимущественное право"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "индексация"
        - "охрана труда"
        - "отпуск"
        - "рабочее время"
        - "профсоюзные взносы"
        - "забастовка"
        - "в целях настоящего"
      context_k: 10
      max_chunks: 14
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1200

      compact_output: false

      presence_signal:
        field: "job_security_retraining_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по трудовому праву. Извлеки из коллективного договора
        сведения о гарантиях занятости и переподготовки (ст. 180, 196 ТК РФ).
        Не анализируй индексацию, охрану труда или споры.
        </role>
        <context>
        {context}
        </context>
        <task>
        0. job_security_retraining_check_presence: определи, есть ли в договоре
           фрагменты, касающиеся гарантий занятости, переподготовки, повышенного
           выходного пособия или приоритетного трудоустройства при сокращении.
           - "present" — есть хотя бы один фрагмент по теме (конкретные гарантии,
             декларация о содействии занятости, упоминание переподготовки и т.п.).
           - "missing" — фрагментов по теме нет вообще.
           - "unclear" — фрагменты есть, но противоречат друг другу и вывод невозможен.

        1. job_security_status — concrete / declarative / not_defined.
        2. job_security_details — формулировка гарантий занятости.
        3. retraining_obligation_status — defined / not_defined.
        4. retraining_obligation_details — обязательство по переподготовке.
        5. enhanced_severance_status — defined / not_defined.
        6. enhanced_severance_details — повышенное выходное пособие.
        7. priority_rehiring_status — defined / not_defined.
        8. priority_rehiring_details — приоритетное трудоустройство.

        Если данные отсутствуют в тексте:
        - статус/enum = "not_defined"
        - текстовое поле = "Данные не определены"
        </task>
        <context_rules>
        - job_security_retraining_check_presence и все статусные поля попарно не
          пересекаются по значениям present/missing/unclear; их объединение покрывает
          все допустимые значения.
        - job_security_status: "concrete" — указаны конкретные мероприятия
          (переподготовка, сохранение рабочих мест, преимущественное право);
          "declarative" — общие декларации без конкретики;
          "not_defined" — вопрос не раскрыт.
        - retraining_obligation_status: "defined" — обязательство по переподготовке
          прямо указано; "not_defined" — не указано.
        - enhanced_severance_status: "defined" — повышенное выходное пособие указано;
          "not_defined" — не указано. В details обязательно фиксируй размер
          (в среднемесячных заработках или рублях), если он есть в тексте.
        - priority_rehiring_status: "defined" — приоритетное право на повторное
          трудоустройство указано; "not_defined" — не указано.
        - Если job_security_status ∈ {concrete, declarative} ИЛИ хотя бы один
          из остальных статусов = "defined", то
          job_security_retraining_check_presence = "present".
        - Если все поля = "not_defined", то
          job_security_retraining_check_presence = "missing".
        </context_rules>
        <edge_cases>
        1. Полное отсутствие фрагментов о занятости, переподготовке, выходном
           пособии и трудоустройстве → job_security_retraining_check_presence = "missing",
           все статусы = "not_defined".
        2. Декларация «работодатель содействует занятости» без конкретных
           мероприятий → presence = "present",
           job_security_status = "declarative", остальные = "not_defined".
        3. Конкретные гарантии (переподготовка + повышенное пособие + приоритет
           при трудоустройстве) → presence = "present",
           job_security_status = "concrete", все статусы = "defined".
        4. Противоречие: в одном разделе «сохранение рабочих мест при сокращении»,
           в другом — «сокращение без дополнительных гарантий» →
           presence = "unclear", job_security_status = "not_defined" с пояснением
           в details.
        </edge_cases>
        <output_expectations>
        - Все 9 полей (1 presence + 8 substantive) обязательны.
        - Статусные и enum-поля возвращают только значения из allowed_values.
        - Текстовые поля без данных — строго "Данные не определены".
        - Не используй None, null или пустые строки.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "job_security_retraining_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие фрагментов о гарантиях занятости и переподготовки."
          required: true
        - name: "job_security_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["concrete", "declarative", "not_defined"]
          description: "Статус гарантий занятости."
          required: true
        - name: "job_security_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
