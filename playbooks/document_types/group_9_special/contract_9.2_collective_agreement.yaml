            Конкретный НПФ или порядок его выбора. Fallback: "Не установлено" / "Не удалось определить".
          required: false

      store_payload: true

  - id: remote_work_check
    name: "Дистанционная и гибридная работа (Глава 49.1 ТК РФ)"
    description: >
      Фактографическая проверка порядка перевода на дистанционную работу,
      обеспечения оборудованием и компенсаций, права на отключение,
      гарантий при возврате в офис, а также условий гибридного режима
      (ст. 312.1–312.9 ТК РФ).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 240

    rules:
      keywords:
        - "дистанционная работа"
        - "удалённая работа"
        - "удаленная работа"
        - "надомная работа"
        - "дистанционный работник"
        - "гибридный режим"
        - "гибридная работа"
        - "комбинированный режим"
        - "дистанционное взаимодействие"
        - "право на отключение"
        - "право не отвечать"
        - "рабочее место дистанционного работника"
        - "компенсация за использование личного оборудования"
        - "оборудование для дистанционной работы"
        - "электронная подпись"
        - "усиленная квалифицированная электронная подпись"
        - "УКЭП"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)дистанционн[а-яё]+\\s+работ"
        - "(?i)(удалённ|удаленн)[а-яё]+\\s+работ"
        - "(?i)(надомн|гибридн)[а-яё]+\\s+(работ|режим)"
        - "(?i)прав[ао][а-яё]*\\s+на\\s+отключени"
        - "(?i)не\\s+отвечать.*(?:нерабоч|внеурочн|вне\\s+рабочег)"
        - "(?i)компенсаци[а-яё]*.*(?:личн|собственн)[а-яё]+\\s+оборудован"
        - "(?i)(УКЭП|усиленн[а-яё]+\\s+квалифицированн[а-яё]+\\s+электронн[а-яё]+\\s+подпис)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по трудовому праву.
        Анализируется коллективный договор.
        Проверяется только один вопрос: дистанционная и гибридная работа.
        Нормативные ориентиры:
        - Глава 49.1 ТК РФ (ст. 312.1–312.9) — регулирование
          дистанционной работы, введена ФЗ №407-ФЗ от 08.12.2020.
        - ст. 312.1 ТК РФ — понятие дистанционной работы, виды
          (постоянная, временная, комбинированная).
        - ст. 312.2 ТК РФ — особенности трудового договора
          и дополнительные условия.
        - ст. 312.3 ТК РФ — порядок взаимодействия, электронный
          документооборот, УКЭП.
        - ст. 312.4 ТК РФ — режим рабочего времени дистанционного
          работника.
        - ст. 312.5 ТК РФ — особенности расторжения.
        - ст. 312.6 ТК РФ — обеспечение оборудованием, компенсация
          расходов.
        - ст. 312.7 ТК РФ — охрана труда дистанционных работников.
        - ст. 312.8 ТК РФ — дополнительные основания расторжения.
        - ст. 312.9 ТК РФ — временный перевод по инициативе
          работодателя.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Различай: КД закрепляет гарантию с параметрами, только
          упоминает дистанционку без деталей или вообще не касается темы.
        - После 2020 года дистанционка стала массовой практикой;
          в КД крупных организаций обычно есть отдельный раздел.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Порядок перевода на дистанционную работу (постоянно,
           временно, комбинированно).
        2. Обеспечение оборудованием (кто предоставляет, какое).
        3. Компенсация расходов за использование личного оборудования
           (размер, порядок).
        4. Право на отключение / право не отвечать во внерабочее время.
        5. Порядок возврата в офис / гарантии при возврате.
        6. Электронный документооборот и подпись (УКЭП).

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Для enum-полей (*_status) при отсутствии данных возвращай
           "not_defined".
        4. Для строковых *_details при отсутствии данных возвращай строго
           "Данные не определены".
        5. Не используй "None", "null", пустые строки или отсутствующие ключи.
        6. В evidence включай только прямые цитаты из текста договора.
        7. Различай:
           - "defined" — КД прямо закрепляет условие с параметрами
             (порядок, размер, гарантии);
           - "declarative" — только упоминание дистанционки без деталей;
           - "not_defined" — тема не раскрыта.
        8. В remote_compensation_details обязательно фиксируй размер
           компенсации (в рублях, % или формула), если он указан.
        9. В right_to_disconnect_details фиксируй формулировку права
           не отвечать на звонки / сообщения во внерабочее время, если
           она приведена.
        10. Верни РОВНО один валидный JSON-объект со всеми 13 ключами
            (12 полей + evidence), пригодный для парсинга через json.loads
            без предварительной обработки. Без markdown, без ```json,
            без комментариев, без текста до или после. Начни ответ сразу
            с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — полное покрытие:
        Фрагмент:
        "Работник вправе с согласия работодателя перейти на дистанционную
        работу (постоянную, временную или комбинированную). Работодатель
        предоставляет оборудование для дистанционной работы. При использовании
        личного оборудования работнику выплачивается компенсация 2 000 рублей
        в месяц. Работник имеет право на отключение: не обязан отвечать
        на звонки и сообщения работодателя во внерабочее время. При возврате
        в офис работодатель сохраняет прежние условия труда. Обмен документами
        осуществляется через УКЭП."
        Ответ:
        {
          "remote_transfer_status": "defined",
          "remote_transfer_details": "переход на дистанционную работу по согласию сторон (постоянная, временная, комбинированная)",
          "remote_equipment_status": "defined",
          "remote_equipment_details": "работодатель предоставляет оборудование для дистанционной работы",
          "remote_compensation_status": "defined",
          "remote_compensation_details": "компенсация за использование личного оборудования — 2 000 руб./мес.",
          "right_to_disconnect_status": "defined",
          "right_to_disconnect_details": "работник не обязан отвечать на звонки и сообщения работодателя во внерабочее время",
          "return_to_office_status": "defined",
          "return_to_office_details": "при возврате в офис работодатель сохраняет прежние условия труда",
          "electronic_signature_status": "defined",
          "electronic_signature_details": "обмен документами через УКЭП",
          "evidence": [
            {"clause_ref": "п. 7.1", "quote": "Работник вправе с согласия работодателя перейти на дистанционную работу (постоянную, временную или комбинированную)."},
            {"clause_ref": "п. 7.3", "quote": "При использовании личного оборудования работнику выплачивается компенсация 2 000 рублей в месяц."}
          ]
        }

        Пример 2 — только упоминание без деталей:
        Фрагмент:
        "Работники могут работать дистанционно в порядке, установленном
        ТК РФ."
        Ответ:
        {
          "remote_transfer_status": "declarative",
          "remote_transfer_details": "возможность дистанционной работы в порядке, установленном ТК РФ (без конкретики)",
          "remote_equipment_status": "not_defined",
          "remote_equipment_details": "Данные не определены",
          "remote_compensation_status": "not_defined",
          "remote_compensation_details": "Данные не определены",
          "right_to_disconnect_status": "not_defined",
          "right_to_disconnect_details": "Данные не определены",
          "return_to_office_status": "not_defined",
          "return_to_office_details": "Данные не определены",
          "electronic_signature_status": "not_defined",
          "electronic_signature_details": "Данные не определены",
          "evidence": [
            {"clause_ref": "п. 7.1", "quote": "Работники могут работать дистанционно в порядке, установленном ТК РФ."}
          ]
        }

        Пример 3 — тема не раскрыта:
        Фрагмент:
        "Стороны обязуются соблюдать трудовое законодательство."
        Ответ:
        {
          "remote_transfer_status": "not_defined",
          "remote_transfer_details": "Данные не определены",
          "remote_equipment_status": "not_defined",
          "remote_equipment_details": "Данные не определены",
          "remote_compensation_status": "not_defined",
          "remote_compensation_details": "Данные не определены",
          "right_to_disconnect_status": "not_defined",
          "right_to_disconnect_details": "Данные не определены",
          "return_to_office_status": "not_defined",
          "return_to_office_details": "Данные не определены",
          "electronic_signature_status": "not_defined",
          "electronic_signature_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямые цитаты по каждой из 6 тем.
        2. Разграничь defined / declarative.
        3. Если прямой цитаты нет — верни "not_defined". Не додумывай.
        4. Проверь, что все 13 ключей (12 полей + evidence) присутствуют
           в JSON.
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "remote_transfer_status": "<defined / declarative / not_defined>",
          "remote_transfer_details": "<текст или 'Данные не определены'>",
          "remote_equipment_status": "<defined / declarative / not_defined>",
          "remote_equipment_details": "<текст или 'Данные не определены'>",
          "remote_compensation_status": "<defined / declarative / not_defined>",
          "remote_compensation_details": "<текст или 'Данные не определены'>",
          "right_to_disconnect_status": "<defined / declarative / not_defined>",
          "right_to_disconnect_details": "<текст или 'Данные не определены'>",
          "return_to_office_status": "<defined / declarative / not_defined>",
          "return_to_office_details": "<текст или 'Данные не определены'>",
          "electronic_signature_status": "<defined / declarative / not_defined>",
          "electronic_signature_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 10
      temperature: 0.0
      max_tokens: 1000

    retrieval:
      retrieval_profile: "employment_schedule_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "дистанционная работа удалённая работа удаленная работа надомная работа дистанционный работник гибридный режим комбинированный режим право на отключение право не отвечать рабочее место дистанционного работника компенсация за использование личного оборудования электронная подпись УКЭП глава 49.1 ТК РФ"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "профсоюзные взносы"
        - "забастовка"
        - "в целях настоящего"
      context_k: 10
      max_chunks: 14
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 700

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1500

      compact_output: false

      presence_signal:
        field: "remote_work_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по трудовому праву. Извлеки из коллективного
        договора сведения о дистанционной и гибридной работе
        (Глава 49.1 ТК РФ).
        Не анализируй заработную плату, охрану труда, отпуска или споры.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. remote_work_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (remote_transfer_status, remote_equipment_status,
              remote_compensation_status, right_to_disconnect_status,
              return_to_office_status, electronic_signature_status)
             ≠ "not_defined";
           - "missing" — если все шесть содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - все шесть *_status = "not_defined";
           - все *_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. remote_transfer_status:
           Используй только одно из значений:
           - "defined" — КД закрепляет порядок перевода на дистанционную
             работу с параметрами (постоянная, временная,
             комбинированная);
           - "declarative" — только упоминание дистанционки без
             конкретики;
           - "not_defined" — тема не раскрыта.

        2. remote_transfer_details:
           Краткое user-facing описание порядка перевода.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        3. remote_equipment_status:
           Используй только одно из значений:
           - "defined" — КД закрепляет порядок обеспечения
             оборудованием с параметрами (кто предоставляет, какое);
           - "declarative" — только упоминание без деталей;
           - "not_defined" — тема не раскрыта.

        4. remote_equipment_details:
           Краткое user-facing описание обеспечения оборудованием.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        5. remote_compensation_status:
           Используй только одно из значений:
           - "defined" — КД закрепляет компенсацию расходов
             за использование личного оборудования с размером;
           - "declarative" — только упоминание компенсации без размера;
           - "not_defined" — тема не раскрыта.

        6. remote_compensation_details:
           Краткое user-facing описание компенсации (размер, порядок).
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        7. right_to_disconnect_status:
           Используй только одно из значений:
           - "defined" — КД закрепляет право на отключение /
             право не отвечать во внерабочее время;
           - "declarative" — только упоминание без деталей;
           - "not_defined" — тема не раскрыта.

        8. right_to_disconnect_details:
           Краткое user-facing описание права на отключение.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        9. return_to_office_status:
           Используй только одно из значений:
           - "defined" — КД закрепляет порядок возврата в офис
             и/или гарантии при возврате;
           - "declarative" — только упоминание без деталей;
           - "not_defined" — тема не раскрыта.

        10. return_to_office_details:
            Краткое user-facing описание порядка возврата и гарантий.
            Если данных нет — "Данные не определены".
            Если данные противоречивы — "Не удалось определить".

        11. electronic_signature_status:
            Используй только одно из значений:
            - "defined" — КД закрепляет порядок электронного
              документооборота и подписи (УКЭП);
            - "declarative" — только упоминание без деталей;
            - "not_defined" — тема не раскрыта.

        12. electronic_signature_details:
            Краткое user-facing описание электронного документооборота
            и подписи.
            Если данных нет — "Данные не определены".
            Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни remote_work_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона вместо текста договора.
        - Не делай выводов по типовой структуре договора.
        - Различай: "defined" — КД закрепляет условие с параметрами; "declarative" — только упоминание дистанционки без деталей.
        - В remote_compensation_details обязательно фиксируй размер компенсации (в рублях, % или формула), если он указан.
        - В right_to_disconnect_details фиксируй формулировку права не отвечать на звонки / сообщения во внерабочее время, если она приведена.
        - Если в разных фрагментах указаны противоречивые сведения — статус → "not_defined", текстовое поле → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни порядка перевода на дистанционку,
           ни обеспечения оборудованием, ни компенсаций,
           ни права на отключение, ни гарантий возврата,
           ни электронного документооборота.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        2. Неполное раскрытие или только упоминание.
           а) Общая фраза: "Работники могут работать дистанционно
              в порядке, установленном ТК РФ" — только упоминание.
              → presence = "present";
                соответствующий *_status = "declarative".
           б) Прямо указано, что дистанционка не применяется
              в организации.
              → presence = "present";
                соответствующий *_status = "defined";
                соответствующий *_details содержит дословную
                формулировку отказа.

        3. Противоречие между фрагментами.
           В разных разделах договора указаны противоречивые условия
           дистанционной работы (разные размеры компенсаций,
           разные порядки перевода).
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             соответствующий *_details = "Не удалось определить".

        4. Полное раскрытие условий.
           Указаны порядок перевода, обеспечение оборудованием,
           компенсации, право на отключение, гарантии возврата
           и электронный документооборот.
           → presence = "present";
             все *_status = "defined";
             все *_details содержат конкретику.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для remote_work_check_presence используй только: "present", "missing", "unclear".
        - Для всех *_status используй только: "defined", "declarative", "not_defined".
        - Fallback при отсутствии данных:
          * все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "remote_work_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по дистанционной и гибридной работе. Внутреннее агрегатное signal-поле."
          required: true

        - name: "remote_transfer_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "declarative", "not_defined"]
          description: "Статус порядка перевода на дистанционную работу. Внутреннее enum-поле."
          required: true

        - name: "remote_transfer_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Перевод на дистанционку"
          description: >
            Порядок перевода на дистанционную работу (постоянная, временная, комбинированная). Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "remote_equipment_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "declarative", "not_defined"]
          description: "Статус обеспечения оборудованием для дистанционной работы. Внутреннее enum-поле."
          required: true

        - name: "remote_equipment_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Оборудование"
          description: >
            Обеспечение оборудованием для дистанционной работы. Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "remote_compensation_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "declarative", "not_defined"]
          description: "Статус компенсации расходов за личное оборудование. Внутреннее enum-поле."
          required: true

        - name: "remote_compensation_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Компенсация расходов"
          description: >
            Компенсация расходов за использование личного оборудования (размер, порядок). Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "right_to_disconnect_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "declarative", "not_defined"]
          description: "Статус права на отключение. Внутреннее enum-поле."
          required: true

        - name: "right_to_disconnect_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 4
          label: "Право на отключение"
          description: >
            Право не отвечать на звонки и сообщения во внерабочее время. Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "return_to_office_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "declarative", "not_defined"]
          description: "Статус порядка возврата в офис. Внутреннее enum-поле."
          required: true

        - name: "return_to_office_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Возврат в офис"
          description: >
            Порядок возврата в офис и гарантии при возврате. Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "electronic_signature_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "declarative", "not_defined"]
          description: "Статус электронного документооборота и подписи. Внутреннее enum-поле."
          required: true

        - name: "electronic_signature_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Электронный документооборот"
          description: >
            Порядок электронного документооборота и подписи (УКЭП). Fallback: "Не установлено" / "Не удалось определить".
          required: false

      store_payload: true

  - id: workers_participation_check
    name: "Участие работников в управлении организацией (ст. 52–53 ТК РФ)"
    description: >
      Фактографическая проверка форм участия работников в управлении
      организацией помимо профсоюза: советы трудовых коллективов,
      участие в коллегиальных органах управления, производственные
      советы, обязательные консультации, право на информацию
      (ст. 52–53 ТК РФ).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "medium"
    severity_if_pass: "pass"
    severity_if_fail: "medium"
    severity_if_unclear: "low"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 250

    rules:
      keywords:
        - "участие в управлении"
        - "совет трудового коллектива"
        - "производственный совет"
        - "совет работников"
        - "участие в коллегиальном органе"
        - "совет директоров"
        - "наблюдательный совет"
        - "право на информацию"
        - "обязательные консультации"
        - "обсуждение с работниками"
        - "участие в принятии решений"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(совет[а-яё]*\\s+трудов[а-яё]+\\s+коллектив|производственн[а-яё]+\\s+совет)"
        - "(?i)участи[ея][а-яё]*\\s+(работник[а-яё]+\\s+)?в\\s+управлени"
        - "(?i)(наблюдательн[а-яё]+|коллегиальн[а-яё]+)\\s+(совет|орган)"
        - "(?i)(право\\s+на\\s+информаци|обязательн[а-яё]+\\s+консультаци)"
        - "(?i)совет[а-яё]*\\s+(работник|директор)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по трудовому праву.
        Анализируется коллективный договор (ст. 52–53 ТК РФ).
        Проверяется только один вопрос: участие работников в управлении
        организацией помимо профсоюза.
        Нормативные ориентиры:
        - ст. 52 ТК РФ — формы участия работников в управлении
          организацией (учёт мнения представительного органа,
          консультации, участие в коллегиальных органах, обсуждение
          планов, доступ к информации).
        - ст. 53 ТК РФ — основные формы участия (получение информации,
          обсуждение, внесение предложений, участие в разработке
          и принятии коллективных договоров).
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Различай: КД закрепляет форму участия с параметрами
          (состав органа, порядок, периодичность), только упоминает
          без деталей или вообще не касается темы.
        - Этот check — про НЕ-профсоюзные формы участия
          (советы трудовых коллективов, производственные советы,
          участие в коллегиальных органах управления).
          Участие профсоюза в управлении — тема отдельного check'а.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Наличие форм участия работников в управлении организацией.
        2. Состав представительного органа (совет трудового коллектива,
           производственный совет и др.).
        3. Участие представителей работников в коллегиальном органе
           управления (совет директоров, наблюдательный совет).
        4. Порядок обязательных консультаций с работниками.
        5. Право работников на информацию (перечень сведений, порядок
           предоставления).

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Для enum-полей (*_status) при отсутствии данных возвращай
           "not_defined".
        4. Для строковых *_details при отсутствии данных возвращай строго
           "Данные не определены".
        5. Не используй "None", "null", пустые строки или отсутствующие ключи.
        6. В evidence включай только прямые цитаты из текста договора.
        7. Различай:
           - "defined" — КД прямо закрепляет форму участия с параметрами;
           - "declarative" — только упоминание без конкретики;
           - "not_defined" — тема не раскрыта.
        8. В participation_bodies_details фиксируй состав и порядок
           формирования органа, если указано.
        9. В right_to_information_details фиксируй перечень сведений
           и порядок их предоставления, если указано.
        10. Верни РОВНО один валидный JSON-объект со всеми 11 ключами
            (10 полей + evidence), пригодный для парсинга через json.loads
            без предварительной обработки. Без markdown, без ```json,
            без комментариев, без текста до или после. Начни ответ сразу
            с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — полное покрытие:
        Фрагмент:
        "В организации создаётся Совет трудового коллектива в составе
        7 человек, избираемых на общем собрании работников на 2 года.
        Представитель работников включается в Совет директоров
        с правом совещательного голоса. Работодатель проводит обязательные
        консультации с Советом по вопросам реорганизации, изменения
        технологий и сокращения численности. Работники имеют право
        на информацию о финансовых результатах организации (ежеквартально),
        о планируемых изменениях условий труда."
        Ответ:
        {
          "participation_forms_status": "defined",
          "participation_forms_details": "Совет трудового коллектива, участие в Совете директоров, обязательные консультации",
          "participation_bodies_status": "defined",
          "participation_bodies_details": "Совет трудового коллектива из 7 человек, избираемых на общем собрании на 2 года",
          "board_participation_status": "defined",
          "board_participation_details": "представитель работников в Совете директоров с правом совещательного голоса",
          "consultation_procedure_status": "defined",
          "consultation_procedure_details": "обязательные консультации по реорганизации, изменениям технологий, сокращению численности",
          "right_to_information_status": "defined",
          "right_to_information_details": "информация о финансовых результатах (ежеквартально), о планируемых изменениях условий труда",
          "evidence": [
            {"clause_ref": "п. 3.1", "quote": "В организации создаётся Совет трудового коллектива в составе 7 человек, избираемых на общем собрании работников на 2 года."},
            {"clause_ref": "п. 3.3", "quote": "Работодатель проводит обязательные консультации с Советом по вопросам реорганизации, изменения технологий и сокращения численности."}
          ]
        }

        Пример 2 — только упоминание:
        Фрагмент:
        "Работники участвуют в управлении организацией в формах,
        предусмотренных ТК РФ."
        Ответ:
        {
          "participation_forms_status": "declarative",
          "participation_forms_details": "участие в управлении в формах, предусмотренных ТК РФ (без конкретики)",
          "participation_bodies_status": "not_defined",
          "participation_bodies_details": "Данные не определены",
          "board_participation_status": "not_defined",
          "board_participation_details": "Данные не определены",
          "consultation_procedure_status": "not_defined",
          "consultation_procedure_details": "Данные не определены",
          "right_to_information_status": "not_defined",
          "right_to_information_details": "Данные не определены",
          "evidence": [
            {"clause_ref": "п. 3.1", "quote": "Работники участвуют в управлении организацией в формах, предусмотренных ТК РФ."}
          ]
        }

        Пример 3 — тема не раскрыта:
        Фрагмент:
        "Стороны обязуются соблюдать трудовое законодательство."
        Ответ:
        {
          "participation_forms_status": "not_defined",
          "participation_forms_details": "Данные не определены",
          "participation_bodies_status": "not_defined",
          "participation_bodies_details": "Данные не определены",
          "board_participation_status": "not_defined",
          "board_participation_details": "Данные не определены",
          "consultation_procedure_status": "not_defined",
          "consultation_procedure_details": "Данные не определены",
          "right_to_information_status": "not_defined",
          "right_to_information_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямые цитаты по каждой из 5 тем.
        2. Разграничь defined / declarative.
        3. Если прямой цитаты нет — верни "not_defined". Не додумывай.
        4. Проверь, что все 11 ключей (10 полей + evidence) присутствуют
           в JSON.
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "participation_forms_status": "<defined / declarative / not_defined>",
          "participation_forms_details": "<текст или 'Данные не определены'>",
          "participation_bodies_status": "<defined / declarative / not_defined>",
          "participation_bodies_details": "<текст или 'Данные не определены'>",
          "board_participation_status": "<defined / declarative / not_defined>",
          "board_participation_details": "<текст или 'Данные не определены'>",
          "consultation_procedure_status": "<defined / declarative / not_defined>",
          "consultation_procedure_details": "<текст или 'Данные не определены'>",
          "right_to_information_status": "<defined / declarative / not_defined>",
          "right_to_information_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 10
      temperature: 0.0
      max_tokens: 900

    retrieval:
      retrieval_profile: "control_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "участие в управлении совет трудового коллектива производственный совет совет работников участие в коллегиальном органе совет директоров наблюдательный совет право на информацию обязательные консультации обсуждение с работниками участие в принятии решений ст. 52-53 ТК РФ"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "профсоюзные взносы"
        - "забастовка"
        - "в целях настоящего"
      context_k: 10
      max_chunks: 14
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 700

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1300

      compact_output: false

      presence_signal:
        field: "workers_participation_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по трудовому праву. Извлеки из коллективного
        договора сведения об участии работников в управлении организацией
        помимо профсоюза (ст. 52–53 ТК РФ).
        Не анализируй участие профсоюза — это тема отдельного check'а.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. workers_participation_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (participation_forms_status, participation_bodies_status,
              board_participation_status,
              consultation_procedure_status,
              right_to_information_status) ≠ "not_defined";
           - "missing" — если все пять содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - все пять *_status = "not_defined";
           - все *_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. participation_forms_status:
           Используй только одно из значений:
           - "defined" — КД закрепляет конкретные формы участия
             работников в управлении (совет трудового коллектива,
             производственный совет, участие в принятии решений);
           - "declarative" — только упоминание участия без конкретики;
           - "not_defined" — тема не раскрыта.

        2. participation_forms_details:
           Краткое user-facing описание форм участия.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        3. participation_bodies_status:
           Используй только одно из значений:
           - "defined" — КД закрепляет состав и/или порядок
             формирования представительного органа работников;
           - "declarative" — только упоминание органа без деталей;
           - "not_defined" — тема не раскрыта.

        4. participation_bodies_details:
           Краткое user-facing описание органа (состав, порядок
           формирования, срок полномочий).
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        5. board_participation_status:
           Используй только одно из значений:
           - "defined" — КД закрепляет участие представителей
             работников в коллегиальном органе управления
             (совет директоров, наблюдательный совет);
           - "declarative" — только упоминание без деталей;
           - "not_defined" — тема не раскрыта.

        6. board_participation_details:
           Краткое user-facing описание участия в коллегиальном органе.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        7. consultation_procedure_status:
           Используй только один из значений:
           - "defined" — КД закрепляет порядок обязательных
             консультаций с работниками / их представителями
             по ключевым вопросам;
           - "declarative" — только упоминание консультаций
             без деталей;
           - "not_defined" — тема не раскрыта.

        8. consultation_procedure_details:
           Краткое user-facing описание порядка консультаций
           (круг вопросов, сроки, форма).
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        9. right_to_information_status:
           Используй только один из значений:
           - "defined" — КД закрепляет перечень сведений, которые
             работодатель обязан предоставлять работникам
             (финансовые результаты, планы, изменения условий труда);
           - "declarative" — только общее право на информацию
             без перечня;
           - "not_defined" — тема не раскрыта.

        10. right_to_information_details:
            Краткое user-facing описание права на информацию
            (перечень сведений, периодичность, порядок).
            Если данных нет — "Данные не определены".
            Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни workers_participation_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона вместо текста договора.
        - Не делай выводов по типовой структуре договора.
        - Различай: "defined" — КД закрепляет форму участия с параметрами; "declarative" — только упоминание без конкретики.
        - В participation_bodies_details фиксируй состав и порядок формирования органа, если указано.
        - В right_to_information_details фиксируй перечень сведений и порядок их предоставления, если указано.
        - Если в разных фрагментах указаны противоречивые сведения — статус → "not_defined", текстовое поле → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни форм участия работников, ни представительных
           органов (кроме профсоюза), ни участия в коллегиальном органе,
           ни консультаций, ни права на информацию.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        2. Неполное раскрытие или только упоминание.
           а) Общая фраза: "Работники участвуют в управлении
              в формах, предусмотренных ТК РФ" — только упоминание.
              → presence = "present";
                соответствующий *_status = "declarative".
           б) Прямо указано, что иные формы участия (кроме профсоюза)
              не предусмотрены.
              → presence = "present";
                соответствующий *_status = "defined";
                соответствующий *_details содержит дословную
                формулировку отказа.

        3. Противоречие между фрагментами.
           В разных разделах договора указаны противоречивые формы
           участия или противоречивые перечни сведений.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             соответствующий *_details = "Не удалось определить".

        4. Полное раскрытие форм участия.
           Указаны совет трудового коллектива, участие в коллегиальном
           органе, порядок консультаций и право на информацию
           с перечнем сведений.
           → presence = "present";
             все *_status = "defined";
             все *_details содержат конкретику.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для workers_participation_check_presence используй только: "present", "missing", "unclear".
        - Для всех *_status используй только: "defined", "declarative", "not_defined".
        - Fallback при отсутствии данных:
          * все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "workers_participation_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по участию работников в управлении. Внутреннее агрегатное signal-поле."
          required: true

        - name: "participation_forms_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "declarative", "not_defined"]
          description: "Статус форм участия работников в управлении. Внутреннее enum-поле."
          required: true

        - name: "participation_forms_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Формы участия"
          description: >
            Формы участия работников в управлении организацией. Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "participation_bodies_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "declarative", "not_defined"]
          description: "Статус представительного органа работников. Внутреннее enum-поле."
          required: true

        - name: "participation_bodies_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Совет трудового коллектива"
          description: >
            Состав и порядок формирования представительного органа работников. Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "board_participation_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "declarative", "not_defined"]
          description: "Статус участия в коллегиальном органе управления. Внутреннее enum-поле."
          required: true

        - name: "board_participation_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Участие в совете директоров"
          description: >
            Участие представителей работников в коллегиальном органе управления. Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "consultation_procedure_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "declarative", "not_defined"]
          description: "Статус порядка обязательных консультаций. Внутреннее enum-поле."
          required: true

        - name: "consultation_procedure_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Обязательные консультации"
          description: >
            Порядок обязательных консультаций с работниками. Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "right_to_information_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "declarative", "not_defined"]
          description: "Статус права работников на информацию. Внутреннее enum-поле."
          required: true

        - name: "right_to_information_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 4
          label: "Право на информацию"
          description: >
            Перечень сведений, предоставляемых работникам, и порядок. Fallback: "Не установлено" / "Не удалось определить".
          required: false

      store_payload: true

  - id: northern_and_rotational_check
    name: "Гарантии при вахтовом методе и работе в районах Крайнего Севера (гл. 47, 50 ТК РФ)"
    description: >
      Фактографическая проверка гарантий при вахтовом методе работы
      (гл. 47 ТК РФ) и в районах Крайнего Севера / приравненных
      местностях (гл. 50 ТК РФ): надбавки, дополнительный отпуск,
      компенсации проезда, режим вахты, суммированный учёт.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 260

    rules:
      keywords:
        - "вахтовый метод"
        - "вахта"
        - "вахтовая надбавка"
        - "Крайний Север"
        - "районы Крайнего Севера"
        - "приравненные местности"
        - "районный коэффициент"
        - "северная надбавка"
        - "процентная надбавка за стаж"
        - "дополнительный отпуск за работу на Севере"
        - "компенсация проезда к месту отдыха"
        - "суммированный учёт рабочего времени"
        - "межвахтовый отдых"
        - "дни отдыха за переработку"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)вахтов[а-яё]+\\s+метод"
        - "(?i)\\bвахт[а-яё]*\\b"
        - "(?i)(Крайн[а-яё]+\\s+Север|приравненн[а-яё]+\\s+местност)"
        - "(?i)(северн[а-яё]+|районн[а-яё]+)\\s+(надбавк|коэффициент)"
        - "(?i)процентн[а-яё]+\\s+надбавк[а-яё]*\\s+за\\s+стаж"
        - "(?i)суммированн[а-яё]+\\s+учёт"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по трудовому праву.
        Анализируется коллективный договор.
        Проверяется только один вопрос: гарантии при вахтовом методе
        работы и в районах Крайнего Севера / приравненных местностях.
        Нормативные ориентиры:
        - Глава 47 ТК РФ (ст. 297–302) — вахтовый метод:
          вахтовая надбавка (ст. 302), суммированный учёт рабочего
          времени, межвахтовый отдых, дни отдыха за переработку.
        - Глава 50 ТК РФ (ст. 313–327) — гарантии для лиц,
          работающих в районах Крайнего Севера и приравненных
          местностях: районный коэффициент, процентная надбавка
          за стаж, дополнительный отпуск (ст. 321), компенсация
          проезда к месту отдыха (ст. 325), сокращённая рабочая
          неделя (ст. 320).
        - Закон РФ №4520-1 от 19.02.1993 «О государственных гарантиях
          и компенсациях для лиц, работающих и проживающих в районах
          Крайнего Севера».
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Этот check применяется ТОЛЬКО если работодатель использует
          вахтовый метод или находится в РКС / приравненных местностях.
          Если тема неприменима — фиксируй отсутствие, НЕ выводи
          гарантии из закона.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Указание на применение вахтового метода.
        2. Размер вахтовой надбавки (за дни вахты, за переработку).
        3. Режим вахты и суммированный учёт рабочего времени.
        4. Наличие РКС / приравненных местностей, размер надбавок.
        5. Дополнительный отпуск за работу в РКС / за вахту.
        6. Компенсация проезда к месту отдыха и обратно.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Для enum-полей (*_status) при отсутствии данных возвращай
           "not_defined".
        4. Для строковых *_details при отсутствии данных возвращай строго
           "Данные не определены".
        5. Не используй "None", "null", пустые строки или отсутствующие ключи.
        6. В evidence включай только прямые цитаты из текста договора.
        7. Различай:
           - "defined" — КД прямо закрепляет гарантию с параметрами;
