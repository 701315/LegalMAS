          "remuneration_system_status": "defined",
          "remuneration_system_details": "повременно-премиальная система оплаты труда",
          "salary_amounts_status": "defined",
          "salary_amounts_details": "менеджер — 60 000 руб.; инженер — 70 000 руб.",
          "bonuses_and_allowances_status": "defined",
          "bonuses_and_allowances_details": "надбавка за выслугу 10% оклада; премия до 30% оклада ежемесячно",
          "payment_dates_status": "defined",
          "payment_dates_details": "5 и 20 числа каждого месяца",
          "mrot_compliance_status": "defined",
          "evidence": [
            {
              "clause_ref": "п. 3.1",
              "quote": "Работодатель применяет повременно-премиальную систему оплаты труда."
            }
          ]
        }
        Пример 2 (частичное определение):
        Фрагмент:
        "Работодатель устанавливает сдельную оплату труда, а также выплачивает
        премии по итогам работы."
        Ответ:
        {
          "remuneration_system_status": "defined",
          "remuneration_system_details": "сдельная оплата труда",
          "salary_amounts_status": "not_defined",
          "salary_amounts_details": "Данные не определены",
          "bonuses_and_allowances_status": "declarative",
          "bonuses_and_allowances_details": "премии по итогам работы (без конкретных размеров)",
          "payment_dates_status": "not_defined",
          "payment_dates_details": "Данные не определены",
          "mrot_compliance_status": "not_defined",
          "evidence": [
            {
              "clause_ref": "п. 3.1",
              "quote": "Работодатель устанавливает сдельную оплату труда, а также выплачивает премии по итогам работы."
            }
          ]
        }
        Пример 3 (не раскрыто):
        Фрагмент:
        "Оплата труда производится в соответствии с ТК РФ."
        Ответ:
        {
          "remuneration_system_status": "declarative",
          "remuneration_system_details": "оплата труда в соответствии с ТК РФ",
          "salary_amounts_status": "not_defined",
          "salary_amounts_details": "Данные не определены",
