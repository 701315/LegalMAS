        - "охрана труда"
        - "отпуск"
        - "рабочее время"
        - "профсоюзные взносы"
        - "забастовка"
        - "реорганизация"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 0.35]
        boost: 0.12
        scope: segment
      context_k: 4
      max_chunks: 6
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "definitions"
        - "obligations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 500

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 700

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по трудовому праву. Извлеки из коллективного договора
        сведения о порядке представительства при наличии нескольких профсоюзов.
        Не анализируй содержание обязательств, индексацию или охрану труда.
        </role>
        <context>
        {context}
        </context>
        <task>
        Заполни строго следующие поля:
        1. multiple_unions_status — "defined" или "not_defined".
        2. multiple_unions_details — указание на наличие нескольких профсоюзов.
        3. unified_body_status — "defined" или "not_defined".
        4. unified_body_details — создание единого представительного органа.
        5. representation_method — unified_body / majority_union / elected_at_meeting / other / not_defined.
        Если данные отсутствуют в тексте:
        - статус = "not_defined"
        - текстовое поле = "Данные не определены"
        </task>
        <rules>
        - Используй только текст договора.
        - representation_method: "unified_body" — создан единый представительный орган;
        "majority_union" — представитель определён по большинству;
        "elected_at_meeting" — избран на общем собрании;
        "other" — иной порядок, прямо указанный в тексте;
        "not_defined" — порядок не указан.
        - Верни только JSON.
        </rules>
      fields:
        - name: "multiple_unions_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания на наличие нескольких профсоюзов."
          required: true
        - name: "multiple_unions_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Наличие нескольких профсоюзов"
          description: "Указание на наличие нескольких профсоюзных организаций."
