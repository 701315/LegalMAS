        2. Найди прямую цитату о примирительной комиссии.
        3. Найди прямую цитату о посреднике/медиаторе.
        4. Найди прямую цитату о трудовом арбитраже.
        5. Найди прямую цитату об ответственности.
        6. Найди прямую цитату о ст. 5.28–5.31 КоАП.
        7. Если прямой цитаты нет — верни "not_defined". Не додумывай.
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "dispute_procedure_status": "<defined / not_defined>",
          "dispute_procedure_details": "<текст или 'Данные не определены'>",
          "conciliation_commission_status": "<defined / not_defined>",
          "conciliator_mediator_status": "<defined / not_defined>",
          "labor_arbitration_status": "<defined / not_defined>",
