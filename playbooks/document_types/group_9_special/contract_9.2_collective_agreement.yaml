  - id: corporate_pension_check
    name: "Негосударственное пенсионное обеспечение и долгосрочные финансовые обязательства"
    description: >
      Фактографическая проверка условий о негосударственном пенсионном
      обеспечении (НПО), корпоративной пенсии (НПФ), софинансировании
      накопительной части, единовременных выплатах при выходе на пенсию
      и гарантиях сохранения программы при реорганизации.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 230

    rules:
      keywords:
        - "негосударственное пенсионное обеспечение"
        - "НПО"
        - "НПФ"
        - "негосударственный пенсионный фонд"
        - "корпоративная пенсия"
        - "дополнительная пенсия"
        - "софинансирование"
        - "единовременная выплата при выходе на пенсию"
        - "материальная помощь к пенсии"
        - "пенсионная программа"
        - "накопительная часть"
        - "пенсионный план"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)негосударственн[а-яё]+\\s+пенсионн"
        - "(?i)\\bНПО\\b|\\bНПФ\\b"
        - "(?i)корпоративн[а-яё]+\\s+пенси"
        - "(?i)(софинансирован|софинансиру)"
        - "(?i)(единовременн[а-яё]+\\s+выплат[а-яё]*|материальн[а-яё]+\\s+помощ[а-яё]*).*\\s+пенси"
        - "(?i)негосударственн[а-яё]+\\s+пенсионн[а-яё]+\\s+фонд"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по трудовому праву.
        Анализируется коллективный договор.
        Проверяется только один вопрос: негосударственное пенсионное
        обеспечение (НПО) и долгосрочные финансовые обязательства
        работодателя.
        Нормативные ориентиры:
        - ФЗ №75-ФЗ «О негосударственных пенсионных фондах» —
          правовой режим НПО, права и обязанности вкладчиков.
        - ФЗ №166-ФЗ «О государственном пенсионном обеспечении» —
          общий контекст.
        - ФЗ №167-ФЗ «Об обязательном пенсионном страховании» —
          накопительная часть.
        - ст. 41 ТК РФ — социальные гарантии и льготы в КД, включая
          дополнительное пенсионное обеспечение.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Различай: КД закрепляет НПО с параметрами, только упоминает
          программу без деталей или вообще не касается темы.
        - Это долгосрочные финансовые обязательства работодателя —
          в реальной практике фиксируются с порядком формирования,
          размером взносов и гарантиями сохранения.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Наличие программы НПО / корпоративной пенсии.
        2. Порядок формирования и размер взносов (софинансирование,
           доля работодателя).
        3. Условия участия работников в программе (стаж, категории).
        4. Единовременные выплаты при выходе на пенсию.
        5. Гарантии сохранения НПО при реорганизации / смене собственника.
        6. Управляющую организацию (НПФ) или порядок её выбора.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Для enum-полей (*_status) при отсутствии данных возвращай
           "not_defined".
        4. Для строковых *_details при отсутствии данных возвращай строго
           "Данные не определены".
        5. Не используй "None", "null", пустые строки или отсутствующие ключи.
        6. В evidence включай только прямые цитаты из текста договора.
        7. Различай:
           - "defined" — КД прямо закрепляет гарантию с параметрами
             (размер, порядок, условия);
           - "declarative" — только упоминание программы без деталей;
           - "not_defined" — тема не раскрыта.
        8. В pension_amount_details обязательно фиксируй размер взносов
           (в % от зарплаты, фиксированная сумма, формула софинансирования),
           если он указан.
        9. В pension_preservation_details фиксируй прямое условие
           о сохранении программы при реорганизации / смене собственника,
           если оно указано.
        10. Верни РОВНО один валидный JSON-объект со всеми 13 ключами
            (12 полей + evidence), пригодный для парсинга через json.loads
            без предварительной обработки. Без markdown, без ```json,
            без комментариев, без текста до или после. Начни ответ сразу
            с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — полное покрытие:
        Фрагмент:
        "Работодатель участвует в программе негосударственного пенсионного
        обеспечения через НПФ «Будущее». Взносы работодателя — 6% от заработной
        платы работника, при этом работник вносит 2% (софинансирование).
        Право участия возникает после 3 лет работы в организации. При выходе
        на пенсию — единовременная выплата в размере трёх среднемесячных
        заработков. При реорганизации работодателя программа НПО сохраняется
        в полном объёме."
        Ответ:
        {
          "pension_program_status": "defined",
          "pension_program_details": "программа НПО через НПФ «Будущее»",
          "pension_amount_status": "defined",
          "pension_amount_details": "взносы работодателя — 6% от заработной платы, работника — 2% (софинансирование)",
          "pension_conditions_status": "defined",
          "pension_conditions_details": "право участия после 3 лет работы в организации",
          "pension_lump_sum_status": "defined",
          "pension_lump_sum_details": "единовременная выплата при выходе на пенсию — 3 среднемесячных заработка",
          "pension_preservation_status": "defined",
          "pension_preservation_details": "программа НПО сохраняется в полном объёме при реорганизации работодателя",
          "pension_fund_status": "defined",
          "pension_fund_details": "НПФ «Будущее»",
          "evidence": [
            {"clause_ref": "п. 6.1", "quote": "Работодатель участвует в программе негосударственного пенсионного обеспечения через НПФ «Будущее»."},
            {"clause_ref": "п. 6.2", "quote": "Взносы работодателя — 6% от заработной платы работника, при этом работник вносит 2%."}
          ]
        }

        Пример 2 — только упоминание без деталей:
        Фрагмент:
        "Работодатель содействует дополнительному пенсионному обеспечению
        работников через негосударственные пенсионные фонды."
        Ответ:
        {
          "pension_program_status": "declarative",
          "pension_program_details": "содействие дополнительному пенсионному обеспечению (без указания программы и параметров)",
          "pension_amount_status": "not_defined",
          "pension_amount_details": "Данные не определены",
          "pension_conditions_status": "not_defined",
          "pension_conditions_details": "Данные не определены",
          "pension_lump_sum_status": "not_defined",
          "pension_lump_sum_details": "Данные не определены",
          "pension_preservation_status": "not_defined",
          "pension_preservation_details": "Данные не определены",
          "pension_fund_status": "not_defined",
          "pension_fund_details": "Данные не определены",
          "evidence": [
            {"clause_ref": "п. 6.1", "quote": "Работодатель содействует дополнительному пенсионному обеспечению работников через негосударственные пенсионные фонды."}
          ]
        }

        Пример 3 — тема не раскрыта:
        Фрагмент:
        "Стороны обязуются соблюдать трудовое законодательство."
        Ответ:
        {
          "pension_program_status": "not_defined",
          "pension_program_details": "Данные не определены",
          "pension_amount_status": "not_defined",
          "pension_amount_details": "Данные не определены",
          "pension_conditions_status": "not_defined",
          "pension_conditions_details": "Данные не определены",
          "pension_lump_sum_status": "not_defined",
          "pension_lump_sum_details": "Данные не определены",
          "pension_preservation_status": "not_defined",
          "pension_preservation_details": "Данные не определены",
          "pension_fund_status": "not_defined",
          "pension_fund_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямые цитаты по каждой из 6 тем.
        2. Разграничь defined / declarative.
        3. Если прямой цитаты нет — верни "not_defined". Не додумывай.
        4. Проверь, что все 13 ключей (12 полей + evidence) присутствуют
           в JSON.
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "pension_program_status": "<defined / declarative / not_defined>",
          "pension_program_details": "<текст или 'Данные не определены'>",
          "pension_amount_status": "<defined / declarative / not_defined>",
          "pension_amount_details": "<текст или 'Данные не определены'>",
          "pension_conditions_status": "<defined / declarative / not_defined>",
          "pension_conditions_details": "<текст или 'Данные не определены'>",
          "pension_lump_sum_status": "<defined / declarative / not_defined>",
          "pension_lump_sum_details": "<текст или 'Данные не определены'>",
          "pension_preservation_status": "<defined / declarative / not_defined>",
          "pension_preservation_details": "<текст или 'Данные не определены'>",
          "pension_fund_status": "<defined / declarative / not_defined>",
          "pension_fund_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 10
      temperature: 0.0
      max_tokens: 1000

    retrieval:
      retrieval_profile: "employment_benefits_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "негосударственное пенсионное обеспечение НПО НПФ негосударственный пенсионный фонд корпоративная пенсия дополнительная пенсия софинансирование единовременная выплата при выходе на пенсию материальная помощь к пенсии пенсионная программа накопительная часть пенсионный план"
      preferred_unit_types:
        - obligation
        - payment_term
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "профсоюзные взносы"
        - "забастовка"
        - "в целях настоящего"
      context_k: 10
      max_chunks: 14
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 700

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1500

      compact_output: false

      presence_signal:
        field: "corporate_pension_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по трудовому праву. Извлеки из коллективного
        договора сведения о негосударственном пенсионном обеспечении
        и долгосрочных финансовых обязательствах работодателя.
        Не анализируй заработную плату, охрану труда, отпуска или споры.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. corporate_pension_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (pension_program_status, pension_amount_status,
              pension_conditions_status, pension_lump_sum_status,
              pension_preservation_status, pension_fund_status)
             ≠ "not_defined";
           - "missing" — если все шесть содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - все шесть *_status = "not_defined";
           - все *_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. pension_program_status:
           Используй только одно из значений:
           - "defined" — КД закрепляет программу НПО / корпоративной
             пенсии с параметрами;
           - "declarative" — только упоминание программы без деталей;
           - "not_defined" — тема не раскрыта.

        2. pension_program_details:
           Краткое user-facing описание программы НПО.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        3. pension_amount_status:
           Используй только одно из значений:
           - "defined" — КД указывает размер взносов (доля
             работодателя, софинансирование, фиксированная сумма);
           - "declarative" — только упоминание взносов без размера;
           - "not_defined" — тема не раскрыта.

        4. pension_amount_details:
           Краткое user-facing описание размера взносов
           (в % от зарплаты, в рублях, формула софинансирования).
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        5. pension_conditions_status:
           Используй только одно из значений:
           - "defined" — КД закрепляет условия участия работников
             (стаж, категории, добровольность);
           - "declarative" — только упоминание условий без конкретики;
           - "not_defined" — тема не раскрыта.

        6. pension_conditions_details:
           Краткое user-facing описание условий участия.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        7. pension_lump_sum_status:
           Используй только одно из значений:
           - "defined" — КД закрепляет единовременные выплаты при
             выходе на пенсию с размером;
           - "declarative" — только упоминание выплат без размера;
           - "not_defined" — тема не раскрыта.

        8. pension_lump_sum_details:
           Краткое user-facing описание единовременной выплаты
           (размер, порядок).
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        9. pension_preservation_status:
           Используй только одно из значений:
           - "defined" — КД закрепляет гарантию сохранения программы
             НПО при реорганизации / смене собственника;
           - "declarative" — только упоминание гарантии без деталей;
           - "not_defined" — тема не раскрыта.

        10. pension_preservation_details:
            Краткое user-facing описание гарантии сохранения программы.
            Если данных нет — "Данные не определены".
            Если данные противоречивы — "Не удалось определить".

        11. pension_fund_status:
            Используй только одно из значений:
            - "defined" — КД указывает конкретный НПФ или порядок
              его выбора;
            - "declarative" — только упоминание НПФ без деталей;
            - "not_defined" — тема не раскрыта.

        12. pension_fund_details:
            Краткое user-facing описание управляющей организации
            (НПФ) или порядка её выбора.
            Если данных нет — "Данные не определены".
            Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни corporate_pension_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона вместо текста договора.
        - Не делай выводов по типовой структуре договора.
        - Различай: "defined" — КД закрепляет гарантию с параметрами; "declarative" — только упоминание без деталей.
        - В pension_amount_details обязательно фиксируй размер взносов (в % от зарплаты, фиксированная сумма, формула софинансирования), если он указан.
        - В pension_preservation_details фиксируй прямое условие о сохранении программы при реорганизации / смене собственника, если оно указано.
        - Если в разных фрагментах указаны противоречивые сведения — статус → "not_defined", текстовое поле → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни программы НПО, ни упоминания взносов,
           ни единовременных выплат, ни гарантии сохранения программы,
           ни конкретного НПФ.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        2. Неполное раскрытие или только упоминание.
           а) Общая фраза: "Работодатель содействует дополнительному
              пенсионному обеспечению" — только упоминание.
              → presence = "present";
                соответствующий *_status = "declarative".
           б) Прямо указано, что программа НПО не предусмотрена.
              → presence = "present";
                соответствующий *_status = "defined";
                соответствующий *_details содержит дословную
                формулировку отказа.

        3. Противоречие между фрагментами.
           В разных разделах договора указаны противоречивые размеры
           взносов, разные условия или разные НПФ.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             соответствующий *_details = "Не удалось определить".

        4. Полное раскрытие программы с параметрами.
           Указаны программа, размер взносов, условия участия,
           единовременная выплата, гарантии сохранения и НПФ.
           → presence = "present";
             все *_status = "defined";
             все *_details содержат конкретику.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для corporate_pension_check_presence используй только: "present", "missing", "unclear".
        - Для всех *_status используй только: "defined", "declarative", "not_defined".
        - Fallback при отсутствии данных:
          * все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "corporate_pension_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по корпоративному пенсионному обеспечению. Внутреннее агрегатное signal-поле."
          required: true

        - name: "pension_program_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "declarative", "not_defined"]
          description: "Статус программы НПО / корпоративной пенсии. Внутреннее enum-поле."
          required: true

        - name: "pension_program_details"
          type: "string"
