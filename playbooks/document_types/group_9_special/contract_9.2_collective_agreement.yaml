# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 7: DD_REQUEST_TEMPLATES
#  Читается: DDRequestTemplateLoader
#  Ключи = check_id из checks_v8 и doc_type_checks выше.
#  DDRequestTemplateLoader.render() матчит по exact или prefix.
# ════════════════════════════════════════════════════════════════════════════

dd_request_templates:

  parties_and_representatives_extraction:
    text: >
      Просим предоставить по {doc_names}: (а) полные реквизиты работодателя; (б) наименование
      представительного органа работников и документы, подтверждающие полномочия (протокол
      собрания/конференции, доверенность, приказ); (в) ФИО и должности уполномоченных
      представителей обеих сторон.
    addressee: "Обе стороны"

  parties_identification:
    text: >
      В {doc_names} необходимо чётко идентифицировать стороны коллективного договора:
      работодателя и представительный орган работников с указанием полномочий.
    addressee: "Обе стороны"

  subject_matter_concrete_obligations:
    text: >
      Просим проверить {doc_names} на предмет наличия конкретных взаимных обязательств
      сторон (ст. 41 ТК РФ), а не только отсылок к трудовому законодательству.
      Коллективный договор должен содержать улучшающие условия.
    addressee: "Юридический советник работодателя"

  term_validation:
    text: >
      Просим уточнить в {doc_names}: (а) дату начала и окончания действия; (б) подтверждение,
      что срок не превышает 3 лет (ст. 43 ТК РФ); (в) условия и порядок продления;
      (г) последствия истечения срока.
    addressee: "Обе стороны"

  term_specified:
    text: >
      В {doc_names} необходимо указать точный срок действия коллективного договора
      (не более 3 лет по ст. 43 ТК РФ).
    addressee: "Обе стороны"

  scope_of_application:
    text: >
      Просим уточнить в {doc_names} сферу действия: организация в целом, филиал,
      представительство или иное обособленное подразделение.
    addressee: "Работодатель"

  universal_coverage_all_employees:
    text: >
      Просим подтвердить в {doc_names}, что коллективный договор распространяется
      на всех работников организации независимо от членства в профсоюзе (ст. 43 ТК РФ).
    addressee: "Юридический советник"

  no_worsening_principle_check:
    text: >
      Просим проверить {doc_names} на наличие: (а) явного указания на недопустимость ухудшения
      положения работников (ст. 9, 50 ТК РФ); (б) потенциально ухудшающих условий
      (снижение гарантий, замена льгот, отказ от прав).
    addressee: "Юридический советник / Орган по труду"

  wage_indexation_mechanism_check:
    text: >
      Просим уточнить в {doc_names}: конкретный механизм индексации заработной платы
      (ст. 134 ТК РФ) — привязка к ИПЦ, фиксированный процент, периодичность,
      порядок принятия решения. Общие декларации без конкретики недостаточны.
    addressee: "Работодатель / Финансовая служба"

  union_activity_guarantees_check:
    text: >
      Просим предоставить по {doc_names}: (а) подтверждение предоставления помещения
      профсоюзу; (б) порядок освобождения профсоюзных работников от основной работы;
      (в) механизм перечисления профсоюзных взносов; (г) гарантии при увольнении
      профсоюзных работников (ст. 374–377 ТК РФ).
    addressee: "Работодатель"

  multiple_unions_representation_check:
    text: >
      В {doc_names} выявлено наличие нескольких профсоюзных организаций. Просим предоставить:
      (а) протокол создания единого представительного органа; (б) подтверждение
      пропорционального представительства; (в) документы по ст. 37 ТК РФ.
    addressee: "Представители работников"

  job_security_and_retraining_check:
    text: >
      Просим уточнить в {doc_names}: (а) конкретные гарантии занятости при реструктуризации;
      (б) обязательства по переподготовке; (в) размер дополнительного выходного пособия;
      (г) приоритеты при повторном трудоустройстве.
    addressee: "Работодатель"

  reorganization_succession_check:
    text: >
      Просим уточнить в {doc_names}: (а) порядок действия договора при реорганизации
      (ст. 43 ТК РФ); (б) обязательства правопреемника; (в) порядок при смене
      формы собственности (3 месяца); (г) последствия ликвидации.
    addressee: "Юридический советник работодателя"

  successor_clause_reorganization:
    text: >
      Просим включить в {doc_names} положения о правопреемстве обязательств при
      реорганизации и смене собственника в соответствии со ст. 43, 75 ТК РФ.
    addressee: "Юридический советник"

  social_benefits_detail_check:
    text: >
      Просим детализировать в {doc_names} социальные обязательства: указать конкретные
      размеры (суммы в рублях или процентах), условия получения, круг получателей,
      сроки выплат, источники финансирования.
    addressee: "Работодатель / Финансовая служба"

  dms_and_health_benefits:
    text: >
      Просим уточнить в {doc_names}: (а) наличие ДМС, перечень покрываемых услуг;
      (б) категории работников, имеющих право на ДМС; (в) страховую компанию
      и порядок обращения.
    addressee: "Работодатель / HR-служба"

  amendment_procedure:
    text: >
      Просим уточнить в {doc_names} порядок внесения изменений и дополнений:
      процедура инициирования, сроки рассмотрения, порядок принятия, вступление в силу.
    addressee: "Обе стороны"

  amendment_frequency_limit:
    text: >
      Просим рассмотреть целесообразность установления в {doc_names} ограничения
      на частоту инициирования пересмотра условий договора.
    addressee: "Юридический советник работодателя"

  notification_registration:
    text: >
      Просим подтвердить по {doc_names}: обязательство направить коллективный договор
      на уведомительную регистрацию в орган по труду в 7-дневный срок (ст. 50 ТК РФ).
    addressee: "Работодатель"

  joint_control_commission:
    text: >
      Просим согласовать в {doc_names}: (а) создание совместной контрольной комиссии;
      (б) равный состав представителей; (в) периодичность отчётности;
      (г) право комиссии запрашивать документы.
    addressee: "Обе стороны"

  financial_obligations_conditionality:
    text: >
      Просим включить в {doc_names} оговорки об условном характере финансовых обязательств:
      привязка к финансовому состоянию, лимиты расходов, право пересмотра при ухудшении
      экономической ситуации.
    addressee: "Юридический советник работодателя"

  peace_obligation_no_strike:
    text: >
      Просим рассмотреть включение в {doc_names} обязательства социального мира:
      работники воздерживаются от забастовок по вопросам, урегулированным договором,
      при условии добросовестного исполнения работодателем.
    addressee: "Обе стороны"

  employee_obligations_discipline:
    text: >
      Просим обеспечить баланс в {doc_names}: включить встречные обязательства работников
      по добросовестному труду, соблюдению дисциплины, бережному отношению к имуществу.
    addressee: "Обе стороны"

  confidentiality_and_information_limits:
    text: >
      Просим определить в {doc_names}: порядок и объём предоставления информации профсоюзу,
      перечень сведений, составляющих коммерческую тайну, ответственность за разглашение.
    addressee: "Юридический советник работодателя"

  dispute_resolution_escalation:
    text: >
      Просим согласовать в {doc_names} поэтапную процедуру разрешения разногласий:
      переговоры → примирительная комиссия → посредник/медиатор → трудовой арбитраж.
    addressee: "Обе стороны"

  liability_for_non_compliance:
    text: >
      Просим уточнить в {doc_names} ответственность сторон: основания, размеры штрафов,
      порядок привлечения, ссылки на ст. 5.28–5.31 КоАП РФ.
    addressee: "Юридический советник"

  koap_administrative_liability_reference:
    text: >
      Просим включить в {doc_names} информационную ссылку на административную ответственность
      за уклонение от переговоров (ст. 5.28 КоАП), непредоставление информации (ст. 5.29),
      необоснованный отказ от заключения (ст. 5.30), невыполнение обязательств (ст. 5.31).
    addressee: "Юридический советник"

  occupational_safety_measures:
    text: >
      Просим детализировать в {doc_names}: перечень мероприятий по охране труда,
      объём финансирования (не менее 0,2% от затрат на производство), ответственных лиц,
      сроки проведения СОУТ, порядок обеспечения СИЗ, график медосмотров.
    addressee: "Работодатель / Служба охраны труда"

  working_time_and_rest:
    text: >
      Просим уточнить в {doc_names}: режимы рабочего времени, продолжительность
      ежегодного и дополнительных отпусков, порядок утверждения графиков, перерывы.
    addressee: "Обе стороны"

  hazardous_conditions_additional_guarantees:
    text: >
      Просим предоставить по {doc_names}: результаты СОУТ, перечень рабочих мест
      с вредными/опасными условиями, размеры доплат и дополнительных отпусков,
      порядок обеспечения молоком/ЛПП.
    addressee: "Работодатель / Служба охраны труда"

  shift_and_vakhta_conditions:
    text: >
      Просим уточнить в {doc_names}: графики сменности, порядок суммированного учёта,
      условия вахтового метода, компенсации за работу в ночное время.
    addressee: "Работодатель"

  remote_work_conditions:
    text: >
      Просим уточнить в {doc_names}: порядок перехода на дистанционную работу,
      компенсации за использование личного оборудования, правила электронного
      документооборота, условия гибридного режима.
    addressee: "Работодатель / HR-служба"

  branch_specific_conditions:
    text: >
      Для {doc_names} (коллективный договор филиала/подразделения) просим предоставить:
      (а) доверенность руководителя филиала на заключение; (б) подтверждение
      полномочий представителей работников в филиале; (в) подтверждение сферы действия.
    addressee: "Работодатель / Руководитель филиала"

  wage_system_and_tariffs:
    text: >
      Просим представить по {doc_names}: действующую систему оплаты труда,
      тарифную сетку / штатное расписание, порядок премирования,
      перечень надбавок и доплат с указанием размеров и условий.
    addressee: "Работодатель / Финансовая служба"

  worsening_conditions_prohibition:
    text: >
      ВНИМАНИЕ: в {doc_names} выявлены условия, потенциально ухудшающие положение работников
      по сравнению с трудовым законодательством (ст. 9, 50 ТК РФ). Такие условия
      недействительны. Просим предоставить правовое обоснование или исключить.
    addressee: "Юридический советник работодателя / Орган по труду"

  term_exceeds_three_years:
    text: >
      ВНИМАНИЕ: в {doc_names} срок действия превышает 3 года, что нарушает ст. 43 ТК РФ.
      Просим привести срок в соответствие с законом (не более 3 лет).
    addressee: "Обе стороны"

  # Generic fallback
  _default:
    text: >
      Просим предоставить дополнительную информацию по вопросу «{check_name}»
      применительно к {doc_names}.
    addressee: "Юридический советник"