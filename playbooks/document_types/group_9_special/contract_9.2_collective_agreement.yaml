            {"clause_ref": "п. 5.2", "quote": "Квота рабочих мест для инвалидов — 4% от среднесписочной численности."}
          ]
        }

        Пример 2 — только цитирование ТК РФ / 181-ФЗ:
        Фрагмент:
        "Работникам-инвалидам предоставляются гарантии, предусмотренные
        трудовым законодательством и ФЗ «О социальной защите инвалидов»."
        Ответ:
        {
          "disabled_workers_guarantees_status": "declarative",
          "disabled_workers_guarantees_details": "гарантии в соответствии с ТК РФ и ФЗ №181-ФЗ (без улучшений)",
          "disabled_quota_status": "declarative",
          "disabled_quota_details": "квотирование в соответствии с ФЗ №181-ФЗ (без указания размера квоты)",
          "youth_guarantees_status": "not_defined",
          "youth_guarantees_details": "Данные не определены",
          "pre_pensioners_guarantees_status": "not_defined",
          "pre_pensioners_guarantees_details": "Данные не определены",
          "training_and_retraining_status": "not_defined",
          "training_and_retraining_details": "Данные не определены",
          "dismissal_protection_status": "not_defined",
          "dismissal_protection_details": "Данные не определены",
          "evidence": [
            {"clause_ref": "п. 5.1", "quote": "Работникам-инвалидам предоставляются гарантии, предусмотренные трудовым законодательством и ФЗ «О социальной защите инвалидов»."}
          ]
        }

        Пример 3 — тема не раскрыта:
        Фрагмент:
        "Стороны обязуются соблюдать трудовое законодательство."
        Ответ:
        {
          "disabled_workers_guarantees_status": "not_defined",
          "disabled_workers_guarantees_details": "Данные не определены",
          "disabled_quota_status": "not_defined",
          "disabled_quota_details": "Данные не определены",
          "youth_guarantees_status": "not_defined",
