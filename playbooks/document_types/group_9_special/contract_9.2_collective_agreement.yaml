        Пример 3 (не раскрыто):
        Фрагмент:
        "Профсоюз действует в соответствии с законодательством."
        Ответ:
        {
          "lna_participation_status": "not_defined",
          "lna_participation_details": "Данные не определены",
          "dismissal_coordination_status": "not_defined",
