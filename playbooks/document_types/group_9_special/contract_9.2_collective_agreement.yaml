        - name: "salary_amounts_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "partial", "not_defined"]
          description: "Статус конкретных размеров окладов/ставок."
          required: true
        - name: "salary_amounts_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Размеры окладов"
