      Фактографическая проверка порядка представительства при наличии нескольких
      профсоюзных организаций: создание единого представительного органа
      или иной порядок представительства.
    triggers:
      any:
        - multiple_unions
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "единый представительный орган"
        - "пропорциональное представительство"
        - "несколько профсоюзов"
        - "профсоюзная организация, объединяющая более половины"
        - "общее собрание для определения представителя"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)единый\\s+представительный\\s+орган"
        - "(?i)пропорциональн(ое|ого)\\s+представительств"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по трудовому праву.
        Анализируется коллективный договор (ст. 37 ТК РФ).
        Проверяется только один вопрос: порядок представительства при наличии
        нескольких профсоюзных организаций.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        [ЗАДАЧА]
        Найди в тексте договора:
        1. Указание на наличие нескольких профсоюзных организаций.
        2. Способ определения представителя работников.
        3. Создание единого представительного органа.
        4. Порядок пропорционального представительства.
        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если данные не указаны прямо — возвращай "not_defined".
        3. Если текстового значения нет — возвращай строго "Данные не определены".
        4. В evidence включай только текст договора.
        5. Верни только один JSON-объект.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1:
        Фрагмент:
        "В организации действуют две профсоюзные организации. Стороны создали
        единый представительный орган на пропорциональной основе."
        Ответ:
        {
          "multiple_unions_status": "defined",
          "multiple_unions_details": "две профсоюзные организации",
          "unified_body_status": "defined",
          "unified_body_details": "единый представительный орган на пропорциональной основе",
          "representation_method": "unified_body",
          "evidence": [
            {
              "clause_ref": "п. 1.2",
              "quote": "В организации действуют две профсоюзные организации. Стороны создали единый представительный орган на пропорциональной основе."
            }
          ]
        }
        Пример 2:
        Фрагмент:
        "Работодатель и первичная профсоюзная организация заключили настоящий договор."
        Ответ:
        {
          "multiple_unions_status": "not_defined",
          "multiple_unions_details": "Данные не определены",
          "unified_body_status": "not_defined",
          "unified_body_details": "Данные не определены",
          "representation_method": "not_defined",
          "evidence": []
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о наличии нескольких профсоюзов.
        2. Найди прямую цитату о способе определения представителя.
        3. Найди прямую цитату о едином представительном органе.
        4. Если прямой цитаты нет — верни "not_defined". Не додумывай.
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "multiple_unions_status": "<defined / not_defined>",
          "multiple_unions_details": "<текст или 'Данные не определены'>",
          "unified_body_status": "<defined / not_defined>",
          "unified_body_details": "<текст или 'Данные не определены'>",
          "representation_method": "<unified_body / majority_union / elected_at_meeting / other / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 4
      temperature: 0.0
      max_tokens: 500

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "единый представительный орган пропорциональное представительство несколько профсоюзов профсоюзная организация объединяющая более половины общее собрание для определения представителя ст. 37 ТК РФ"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
