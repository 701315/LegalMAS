          risk_weight: "high"
          allowed_values: ["defined", "declarative", "not_defined"]
          description: "Статус единовременной выплаты при выходе на пенсию. Внутреннее enum-поле."
          required: true

        - name: "pension_lump_sum_details"
          type: "string"
