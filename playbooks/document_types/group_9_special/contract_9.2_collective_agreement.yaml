    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "разрешение разногласий"
        - "примирительная комиссия"
        - "посредник"
        - "медиатор"
        - "трудовой арбитраж"
        - "переговоры"
        - "досудебный порядок"
        - "порядок разрешения споров"
        - "ответственность сторон"
