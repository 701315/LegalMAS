  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 3: Принцип недопустимости ухудшения положения работников
  # ──────────────────────────────────────────────────────────────────────────
  - id: no_worsening_principle_check
    name: "Принцип недопустимости ухудшения положения работников (ст. 9, 50 ТК РФ)"
    description: >
      Фактографическая проверка наличия явного указания на недопустимость ухудшения
      положения работников и выявление потенциально ухудшающих условий.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "не могут ухудшать"
        - "не ухудшают положение"
        - "дополнительные гарантии"
        - "не ниже установленных ТК"
        - "улучшение положения работников"
        - "в дополнение к гарантиям"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)условия.*не\\s+(могут|должны)\\s+ухудшать\\s+положение"
        - "(?i)гарантии.*являются\\s+дополнительными"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по трудовому праву.
        Анализируется коллективный договор (ст. 9, 50 ТК РФ).
        Проверяется только один вопрос: наличие принципа недопустимости ухудшения
        положения работников и выявление потенциально ухудшающих условий.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        [ЗАДАЧА]
        Найди в тексте договора:
        1. Прямое указание на недопустимость ухудшения положения работников.
        2. Указание на то, что гарантии являются дополнительными к ТК РФ.
        3. Потенциально ухудшающие условия (снижение гарантий, замена льгот, отказ от прав).
        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если данные не указаны прямо — возвращай "not_defined".
        3. Если текстового значения нет — возвращай строго "Данные не определены".
        4. В evidence включай только текст договора.
        5. Верни только один JSON-объект.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1:
        Фрагмент:
        "Настоящий коллективный договор не может ухудшать положение работников
        по сравнению с трудовым законодательством. Гарантии и льготы, установленные
        настоящим договором, являются дополнительными к гарантиям, установленным ТК РФ."
        Ответ:
        {
          "no_worsening_clause_status": "explicit",
          "no_worsening_clause_details": "не может ухудшать положение работников по сравнению с трудовым законодательством",
          "additional_guarantees_status": "defined",
          "additional_guarantees_details": "гарантии и льготы являются дополнительными к гарантиям ТК РФ",
          "potential_worsening_status": "not_defined",
          "potential_worsening_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 1.3",
              "quote": "Настоящий коллективный договор не может ухудшать положение работников по сравнению с трудовым законодательством."
            }
          ]
        }
        Пример 2:
        Фрагмент:
        "Стороны обязуются исполнять настоящий договор."
        Ответ:
        {
          "no_worsening_clause_status": "not_defined",
          "no_worsening_clause_details": "Данные не определены",
          "additional_guarantees_status": "not_defined",
          "additional_guarantees_details": "Данные не определены",
          "potential_worsening_status": "not_defined",
          "potential_worsening_details": "Данные не определены",
          "evidence": []
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о недопустимости ухудшения.
        2. Найди прямую цитату о дополнительных гарантиях.
        3. Найди прямые цитаты потенциально ухудшающих условий.
        4. Если прямой цитаты нет — верни "not_defined". Не додумывай.
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "no_worsening_clause_status": "<explicit / implicit / not_defined>",
          "no_worsening_clause_details": "<цитата или 'Данные не определены'>",
          "additional_guarantees_status": "<defined / not_defined>",
          "additional_guarantees_details": "<текст или 'Данные не определены'>",
          "potential_worsening_status": "<detected / not_defined>",
          "potential_worsening_details": "<описание или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 550

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "не могут ухудшать не ухудшают положение дополнительные гарантии не ниже установленных ТК улучшение положения работников в дополнение к гарантиям взамен гарантий отказ от права снижение гарантий ниже установленного ТК отменяет действие ТК заменяет нормы ТК отпуск менее 28 календарных дней оплата ниже МРОТ"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - definitions
        - boilerplate
      negative_keywords:
        - "индексация"
        - "охрана труда"
        - "отпуск"
        - "рабочее время"
        - "профсоюзные взносы"
        - "забастовка"
        - "реорганизация"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 0.35]
        boost: 0.15
        scope: segment
      context_k: 6
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "definitions"
        - "boilerplate"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 900

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по трудовому праву. Извлеки из коллективного договора
        сведения о принципе недопустимости ухудшения положения работников
        и потенциально ухудшающих условиях.
        Не анализируй индексацию, охрану труда или споры.
        </role>
        <context>
        {context}
        </context>
        <task>
        Заполни строго следующие поля:
        1. no_worsening_clause_status — explicit / implicit / not_defined.
        2. no_worsening_clause_details — формулировка о недопустимости ухудшения.
        3. additional_guarantees_status — "defined" или "not_defined".
        4. additional_guarantees_details — указание на дополнительные гарантии.
        5. potential_worsening_status — detected / not_defined.
        6. potential_worsening_details — описание потенциально ухудшающих условий.
        Если данные отсутствуют в тексте:
        - статус = "not_defined"
        - текстовое поле = "Данные не определены"
        </task>
        <rules>
        - Используй только текст договора.
        - no_worsening_clause_status: "explicit" — прямое указание;
        "implicit" — принцип подразумевается, но прямого указания нет;
        "not_defined" — вопрос не раскрыт.
        - potential_worsening_status: "detected" — выявлены формулировки,
        потенциально ухудшающие положение работников;
        "not_defined" — таких формулировок не выявлено.
        - Верни только JSON.
        </rules>
      fields:
