type: contract_9.2_collective_agreement
name: "Коллективный договор"

description: |
  Правовой акт социального партнёрства, регулирующий социально-трудовые отношения в организации
  или у индивидуального предпринимателя. Заключается между работодателем (в лице уполномоченных
  представителей) и работниками (в лице их представителей — первичной профсоюзной организации,
  иного представительного органа или непосредственно избранных представителей) по результатам
  коллективных переговоров. Устанавливает взаимные обязательства сторон, которые дополняют,
  конкретизируют и улучшают гарантии, установленные трудовым законодательством, но ни в коем
  случае не могут их ухудшать. Действует в отношении всех работников организации (филиала,
  представительства) независимо от членства в профсоюзе. Обладает нормативным характером,
  является локальным нормативным актом. Заключается на срок не более трёх лет с возможностью
  продления. Подлежит уведомительной регистрации в органе по труду.
  Регулируется императивными нормами Раздела II ТК РФ (ст. 40–51).

version: 4.0
parent: class_9_special_imperative

