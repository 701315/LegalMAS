      compact_output: false

      presence_signal:
        field: "occupational_safety_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по трудовому праву. Извлеки из коллективного договора
        сведения об охране труда и вредных условиях (ст. 147, 212–231 ТК РФ).
        Не анализируй рабочее время, отпуска или споры.
        </role>
        <context>
        {context}
        </context>
        <task>
        0. occupational_safety_check_presence: определи, есть ли в договоре фрагменты,
           касающиеся охраны труда, финансирования, СИЗ, СОУТ или гарантий
           за вредные/опасные условия.
           - "present" — есть хотя бы один фрагмент по теме (мероприятия, финансирование,
             СИЗ, СОУТ, доплата за вредность, молоко, ЛПП).
           - "missing" — фрагментов по теме нет вообще.
           - "unclear" — фрагменты есть, но противоречат друг другу и вывод невозможен.

        1. safety_measures_status — defined / not_defined.
        2. safety_measures_details — мероприятия по охране труда и финансирование.
        3. ppei_provision_status — defined / not_defined.
        4. ppei_provision_details — обеспечение СИЗ.
        5. sout_status_code — defined / not_defined.
        6. sout_status_details — результаты СОУТ / класс условий труда.
        7. hazardous_guarantees_status — defined / not_defined.
        8. hazardous_guarantees_details — гарантии за вредные/опасные условия.

        Если данные отсутствуют в тексте:
        - статус = "not_defined"
        - текстовое поле = "Данные не определены"
        </task>
        <context_rules>
        - occupational_safety_check_presence и все статусные поля попарно не
          пересекаются по значениям present/missing/unclear; их объединение покрывает
          все допустимые значения.
        - safety_measures_status: "defined" — мероприятия и/или финансирование охраны
          труда прямо указаны; "not_defined" — не указаны. В details фиксируй
          как мероприятия, так и источник финансирования (процент / сумма).
        - ppei_provision_status: "defined" — обеспечение СИЗ прямо указано;
          "not_defined" — не указано.
        - sout_status_code: "defined" — результаты СОУТ или класс условий труда
          прямо указаны; "not_defined" — не указаны.
        - hazardous_guarantees_status: "defined" — гарантии за вредные/опасные
          условия прямо указаны; "not_defined" — не указаны. В details фиксируй
          все гарантии: доплата, дополнительный отпуск, молоко, ЛПП, сокращённая
          рабочая неделя.
        - Не выводи нормы охраны труда из ТК РФ — только из текста договора.
        - Если хотя бы один из 4 статусов = "defined", то
          occupational_safety_check_presence = "present".
        - Если все статусы = "not_defined", то
          occupational_safety_check_presence = "missing".
        </context_rules>
        <edge_cases>
        1. Полное отсутствие фрагментов об охране труда, СИЗ, СОУТ и гарантиях
           за вредность → occupational_safety_check_presence = "missing",
           все статусы = "not_defined".
        2. Частичное покрытие (только СИЗ и СОУТ без финансирования и гарантий
           за вредность) → presence = "present", ppei_provision_status = "defined",
           sout_status_code = "defined", остальные = "not_defined".
        3. Все четыре аспекта раскрыты (финансирование 0,2% + СИЗ + СОУТ 3.1 +
           доплата 4% и молоко) → presence = "present", все статусы = "defined".
        4. Противоречие: в одном разделе «доплата за вредность 4%», в другом —
           «доплаты за вредные условия не предусмотрены в связи с отсутствием
           рабочих мест с классом 3.1 и выше» → presence = "unclear",
           hazardous_guarantees_status = "not_defined" с пояснением в details.
        </edge_cases>
        <output_expectations>
        - Все 9 полей (1 presence + 8 substantive) обязательны.
        - Статусные поля возвращают только значения из allowed_values.
        - Текстовые поля без данных — строго "Данные не определены".
        - Не используй None, null или пустые строки.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "occupational_safety_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие фрагментов об охране труда и вредных условиях."
          required: true
        - name: "safety_measures_status"
