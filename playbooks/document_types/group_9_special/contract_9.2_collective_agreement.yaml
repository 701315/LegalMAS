      compact_output: false

      presence_signal:
        field: "social_benefits_detail_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по трудовому праву. Извлеки из коллективного договора
        сведения о социальных и финансовых льготах, их детализации и сроках
        (ст. 41 ТК РФ).
        Не анализируй индексацию, охрану труда или споры.
        </role>
        <context>
        {context}
        </context>
        <task>
        0. social_benefits_detail_check_presence: определи, есть ли в договоре
           фрагменты, касающиеся социальных и финансовых льгот (материальная помощь,
           ДМС, компенсации, премии, надбавки, питание, проезд и т.п.).
           - "present" — есть хотя бы один фрагмент по теме (конкретный перечень,
             декларация о социальных гарантиях, упоминание сумм/условий).
           - "missing" — фрагментов по теме нет вообще.
           - "unclear" — фрагменты есть, но противоречат друг другу и вывод невозможен.

        1. benefits_list_status — defined / declarative / not_defined.
        2. benefits_list_value — перечень выявленных льгот.
        3. benefits_with_amounts_status — yes / partially / no / not_defined.
        4. benefits_with_amounts_details — конкретные суммы/размеры.
        5. benefits_with_conditions_status — yes / partially / no / not_defined.
        6. benefits_with_conditions_details — условия получения льгот.
        7. payment_timing_status — defined / not_defined.
        8. payment_timing_details — сроки выплат.

        Если данные отсутствуют в тексте:
        - статус/enum = "not_defined"
        - текстовое поле = "Данные не определены"
        </task>
        <context_rules>
        - social_benefits_detail_check_presence и все статусные поля попарно не
          пересекаются по значениям present/missing/unclear; их объединение покрывает
          все допустимые значения.
        - benefits_list_status: "defined" — есть конкретный перечень льгот;
          "declarative" — общая декларация без перечня;
          "not_defined" — льготы не упоминаются.
        - benefits_with_amounts_status и benefits_with_conditions_status:
          "yes" — у большинства льгот указаны суммы/условия;
          "partially" — у части льгот; "no" — все декларативные;
          "not_defined" — льготы не упоминаются.
        - payment_timing_status: "defined" — сроки выплат указаны;
          "not_defined" — не указаны.
        - В benefits_list_value перечисляй льготы через точку с запятой.
        - В benefits_with_amounts_details фиксируй суммы для каждой льготы
          (через точку с запятой), включая размер в рублях, % или среднемесячных
          заработках, как указано в тексте.
        - Если benefits_list_status ∈ {defined, declarative} ИЛИ хотя бы один
          из остальных статусов ≠ "not_defined", то
          social_benefits_detail_check_presence = "present".
        - Если все поля = "not_defined", то
          social_benefits_detail_check_presence = "missing".
        </context_rules>
        <edge_cases>
        1. Полное отсутствие фрагментов о социальных льготах, выплатах, ДМС,
           компенсациях → social_benefits_detail_check_presence = "missing",
           все статусы = "not_defined".
        2. Декларация «работодатель обеспечивает социальные гарантии» без
           конкретного перечня и сумм → presence = "present",
           benefits_list_status = "declarative", остальные = "not_defined".
        3. Конкретный перечень с суммами и условиями (ДМС + матпомощь +
           компенсация проезда с размерами) → presence = "present",
           benefits_list_status = "defined", amounts = "yes"/"partially".
        4. Противоречие: в одном разделе «материальная помощь — 15 000 рублей»,
           в другом — «размер материальной помощи определяется локальным актом»
           без конкретики → presence = "unclear",
           benefits_with_amounts_status = "partially" с пояснением в details.
        </edge_cases>
        <output_expectations>
        - Все 9 полей (1 presence + 8 substantive) обязательны.
        - Статусные и enum-поля возвращают только значения из allowed_values.
        - Текстовые поля без данных — строго "Данные не определены".
        - Не используй None, null или пустые строки.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "social_benefits_detail_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие фрагментов о социальных и финансовых льготах."
          required: true
        - name: "benefits_list_status"
