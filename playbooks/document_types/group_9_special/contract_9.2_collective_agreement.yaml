        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по трудовому праву. Извлеки из коллективного договора
        сведения о порядке изменений (ст. 44 ТК РФ), уведомительной регистрации
        (ст. 50 ТК РФ) и контрольной комиссии (ст. 51 ТК РФ).
        Не анализируй содержание обязательств, индексацию или охрану труда.
        </role>
        <context>
        {context}
        </context>
        <task>
        0. amendment_control_registration_check_presence: определи, есть ли в договоре
           фрагменты, касающиеся порядка внесения изменений, уведомительной регистрации
           в органе по труду или контрольной комиссии.
           - "present" — есть хотя бы один фрагмент по теме (порядок изменений,
             регистрация, срок, контрольная комиссия, отчётность).
           - "missing" — фрагментов по теме нет вообще.
           - "unclear" — фрагменты есть, но противоречат друг другу и вывод невозможен.

        1. amendment_procedure_status — defined / not_defined.
        2. amendment_procedure_details — порядок внесения изменений и дополнений.
        3. notification_registration_status — defined / not_defined.
        4. notification_registration_details — обязательство по уведомительной регистрации.
        5. notification_deadline_status — defined / not_defined.
        6. notification_deadline_value — срок направления на регистрацию.
        7. control_commission_status — defined / not_defined.
        8. control_commission_details — создание контрольной комиссии.
        9. control_commission_reporting — периодичность отчётности.

        Если данные отсутствуют в тексте:
        - статус = "not_defined"
        - текстовое поле = "Данные не определены"
        </task>
        <context_rules>
        - amendment_control_registration_check_presence и все статусные поля попарно
          не пересекаются по значениям present/missing/unclear; их объединение
          покрывает все допустимые значения.
        - amendment_procedure_status: "defined" — порядок внесения изменений прямо
          указан; "not_defined" — не указан.
        - notification_registration_status: "defined" — обязательство по уведомительной
          регистрации прямо указано; "not_defined" — не указано. Не выводи из нормы
          ст. 50 ТК РФ — только из текста договора.
        - notification_deadline_status: "defined" — срок направления на регистрацию
          указан; "not_defined" — не указан.
        - control_commission_status: "defined" — создание контрольной комиссии
          прямо указано; "not_defined" — не указано.
        - В control_commission_reporting фиксируй периодичность строго как указано
          в тексте («ежеквартально», «раз в год», «по мере необходимости» и т.п.).
        - Если amendment_procedure_status = "defined" ИЛИ
          notification_registration_status = "defined" ИЛИ
          control_commission_status = "defined", то
          amendment_control_registration_check_presence = "present".
        - Если все статусы = "not_defined", то
          amendment_control_registration_check_presence = "missing".
        </context_rules>
        <edge_cases>
        1. Полное отсутствие фрагментов о порядке изменений, регистрации
           и контрольной комиссии → amendment_control_registration_check_presence = "missing",
           все статусы = "not_defined".
        2. Только порядок изменений («по взаимному согласию сторон») без
           регистрации и комиссии → presence = "present",
           amendment_procedure_status = "defined", остальные = "not_defined".
        3. Все три аспекта раскрыты (порядок изменений + регистрация со сроком
           7 дней + комиссия с ежеквартальной отчётностью) → presence = "present",
           все статусы = "defined".
        4. Противоречие: в одном разделе «изменения по соглашению сторон»,
           в другом — «изменения в одностороннем порядке работодателем» →
           presence = "unclear", amendment_procedure_status = "not_defined"
           с пояснением в details.
        </edge_cases>
        <output_expectations>
        - Все 10 полей (1 presence + 9 substantive) обязательны.
        - Статусные поля возвращают только значения из allowed_values.
        - Текстовые поля без данных — строго "Данные не определены".
        - Не используй None, null или пустые строки.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "amendment_control_registration_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие фрагментов о порядке изменений, регистрации и контрольной комиссии."
          required: true
        - name: "amendment_procedure_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус порядка внесения изменений. Внутреннее enum-поле."
          required: true
        - name: "amendment_procedure_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Порядок изменений"
          description: >
            Порядок внесения изменений и дополнений. Fallback: "Не установлено" / "Не удалось определить".
          required: false
        - name: "notification_registration_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус обязательства по уведомительной регистрации. Внутреннее enum-поле."
          required: true
        - name: "notification_registration_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Уведомительная регистрация"
          description: >
            Обязательство по уведомительной регистрации в органе по труду. Fallback: "Не установлено" / "Не удалось определить".
          required: false
        - name: "notification_deadline_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус срока направления на регистрацию. Внутреннее enum-поле."
          required: true
        - name: "notification_deadline_value"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Срок регистрации"
          description: >
            Срок направления на уведомительную регистрацию. Fallback: "Не установлено" / "Не удалось определить".
          required: false
        - name: "control_commission_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус создания контрольной комиссии. Внутреннее enum-поле."
          required: true
        - name: "control_commission_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Контрольная комиссия"
          description: >
            Создание совместной контрольной комиссии. Fallback: "Не установлено" / "Не удалось определить".
          required: false
        - name: "control_commission_reporting"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Периодичность отчётности"
          description: >
            Периодичность отчётности контрольной комиссии. Fallback: "Не установлено" / "Не удалось определить".
          required: false

      store_payload: true

  - id: dispute_resolution_liability_check
    name: "Разрешение разногласий и ответственность сторон (ст. 398–418, 55 ТК РФ)"
    description: >
      Фактографическая проверка поэтапной процедуры разрешения разногласий
      (переговоры → примирительная комиссия → посредник → трудовой арбитраж)
      и ответственности сторон за невыполнение обязательств (ст. 55 ТК РФ,
      ст. 5.28–5.31 КоАП РФ).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 110

    rules:
      keywords:
        - "разрешение разногласий"
        - "примирительная комиссия"
        - "посредник"
        - "медиатор"
        - "трудовой арбитраж"
        - "переговоры"
        - "досудебный порядок"
        - "порядок разрешения споров"
        - "ответственность сторон"
        - "ответственность за нарушение"
        - "ответственность за невыполнение"
        - "штраф"
        - "неустойка"
        - "административная ответственность"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)примирительн(ая|ой)\\s+комисси"
        - "(?i)трудов(ой|ого)\\s+арбитраж"
        - "(?i)ответственност(ь|и)\\s+(сторон|за\\s+(не)?выполнени)"
        - "(?i)ст\\.?\\s*5\\.(28|29|30|31)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по трудовому праву.
        Анализируется коллективный договор (ст. 398–418, 55 ТК РФ; ст. 5.28–5.31 КоАП РФ).
        Проверяется только один вопрос: разрешение разногласий и ответственность сторон.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        [ЗАДАЧА]
        Найди в тексте договора:
        1. Поэтапную процедуру разрешения разногласий.
        2. Наличие примирительной комиссии.
        3. Наличие посредника/медиатора.
        4. Наличие трудового арбитража.
        5. Ответственность сторон за невыполнение обязательств.
        6. Ссылку на административную ответственность (ст. 5.28–5.31 КоАП РФ).
        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если данные не указаны прямо — статусные поля возвращай "not_defined".
        3. Текстовые поля без значения — строго "Данные не определены".
        4. Верни РОВНО один валидный JSON-объект со всеми 9 ключами (8 полей + evidence),
           пригодный для парсинга через json.loads без предварительной обработки.
           Без markdown, без ```json, без комментариев, без текста до или после.
           Начни ответ сразу с { и закончи }.
        5. Не используй None, null или пустые строки.
        6. В evidence включай только текст договора.
        7. Не выводи процедуру из норм ст. 398–418 ТК РФ — только из текста договора.
        8. koap_reference_status = "defined" только если прямо упомянута административная
           ответственность (в т.ч. через отсылку к КоАП РФ или к ст. 5.28–5.31).
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 (полное определение):
        Фрагмент:
        "Разногласия разрешаются путём переговоров, а при недостижении согласия —
        примирительной комиссией, посредником, трудовым арбитражем. Стороны несут
        ответственность за невыполнение обязательств в соответствии со ст. 55 ТК РФ.
        Работодатель несёт административную ответственность по ст. 5.31 КоАП РФ."
        Ответ:
        {
          "dispute_procedure_status": "defined",
          "dispute_procedure_details": "переговоры, примирительная комиссия, посредник, трудовой арбитраж",
          "conciliation_commission_status": "defined",
          "conciliator_mediator_status": "defined",
          "labor_arbitration_status": "defined",
          "liability_status": "defined",
          "liability_details": "в соответствии со ст. 55 ТК РФ",
          "koap_reference_status": "defined",
          "evidence": [
            {
              "clause_ref": "п. 9.1",
              "quote": "Разногласия разрешаются путём переговоров, а при недостижении согласия — примирительной комиссией, посредником, трудовым арбитражем."
            },
            {
              "clause_ref": "п. 9.3",
              "quote": "Работодатель несёт административную ответственность по ст. 5.31 КоАП РФ."
            }
          ]
        }
        Пример 2 (частичное определение — процедура без ответственности):
        Фрагмент:
        "Разногласия по настоящему договору разрешаются примирительной комиссией."
        Ответ:
        {
          "dispute_procedure_status": "defined",
          "dispute_procedure_details": "примирительная комиссия",
          "conciliation_commission_status": "defined",
          "conciliator_mediator_status": "not_defined",
          "labor_arbitration_status": "not_defined",
          "liability_status": "not_defined",
          "liability_details": "Данные не определены",
          "koap_reference_status": "not_defined",
          "evidence": [
            {
              "clause_ref": "п. 9.1",
              "quote": "Разногласия по настоящему договору разрешаются примирительной комиссией."
            }
          ]
        }
        Пример 3 (положения отсутствуют):
        Фрагмент:
        "Стороны обязуются исполнять настоящий договор."
        Ответ:
        {
          "dispute_procedure_status": "not_defined",
          "dispute_procedure_details": "Данные не определены",
          "conciliation_commission_status": "not_defined",
          "conciliator_mediator_status": "not_defined",
          "labor_arbitration_status": "not_defined",
          "liability_status": "not_defined",
          "liability_details": "Данные не определены",
          "koap_reference_status": "not_defined",
          "evidence": []
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о процедуре разрешения разногласий.
        2. Найди прямую цитату о примирительной комиссии.
        3. Найди прямую цитату о посреднике/медиаторе.
        4. Найди прямую цитату о трудовом арбитраже.
        5. Найди прямую цитату об ответственности.
        6. Найди прямую цитату о ст. 5.28–5.31 КоАП или административной ответственности.
        7. Если прямой цитаты нет — верни "not_defined". Не додумывай.
        8. Проверь, что все 9 ключей (8 полей + evidence) присутствуют в JSON.
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
