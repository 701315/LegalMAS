          "scope_of_application_value": "Данные не определены",
          "universal_coverage_status": "not_defined",
          "universal_coverage_details": "Данные не определены",
          "evidence": []
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о дате начала и окончания.
        2. Найди прямую цитату о продлении.
