# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 3: SHARED PATTERNS
#  Читается: DocTypeCheckLoader через _resolve_yaml_templates()
# ════════════════════════════════════════════════════════════════════════════

shared_patterns:
  term_years: "(?i)\\b(?:на\\s+срок|сроком)\\s+(?:на\\s+)?\\d+\\s*(?:год|лет|года)\\b"
  money_amount: "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|тыс|млн|процент|%)"
  date_pattern: "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"
  article_tk_ref: "(?i)ст\\.?\\s*\\d+\\s*ТК\\s*РФ"
  inn_pattern: "(?i)\\bИНН\\s*\\d{10,12}\\b"

compliance_rules: []

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: CHECKS_V8 — единственный рабочий слой юридического анализа
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 1: Стороны и их представители
  # ──────────────────────────────────────────────────────────────────────────
  - id: parties_and_representatives_check
    name: "Стороны коллективного договора и их представители"
    description: >
      Фактографическая проверка идентификации работодателя, представительного
      органа работников, уполномоченных лиц и документов, подтверждающих полномочия.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "работодатель"
        - "представители работников"
        - "профсоюзная организация"
        - "профком"
        - "избранные представители"
        - "общее собрание работников"
        - "конференция работников"
        - "в лице"
        - "действующего на основании"
        - "уполномоченный представитель"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(работодатель|работники)\\s+в\\s+лице"
        - "(?i)действующ(его|ей)\\s+на\\s+основании"
        - "(?i)протокол\\s+(общего\\s+)?собрания"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по трудовому праву.
        Анализируется коллективный договор (Раздел II ТК РФ, ст. 40).
        Проверяется только один вопрос: идентификация сторон и их представителей.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        [ЗАДАЧА]
        Найди в тексте договора:
        1. Наименование работодателя и его реквизиты.
        2. Тип работодателя (юридическое лицо / ИП).
        3. Представителя работодателя (ФИО, должность, основание полномочий).
        4. Представительный орган работников (наименование, тип).
        5. Представителя работников (ФИО, должность, основание полномочий).
        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если данные не указаны прямо — возвращай "not_defined".
        3. Если текстового значения нет — возвращай строго "Данные не определены".
        4. Не используй "None", "null", "not_defined", "not_defined" или пустые строки.
        5. В evidence включай только текст договора.
        6. Верни только один JSON-объект.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1:
        Фрагмент:
        "ООО «Альфа» (ИНН 7700000001), именуемое «Работодатель», в лице Генерального
        директора Иванова А.А., действующего на основании Устава, и первичная
        профсоюзная организация ООО «Альфа», в лице председателя Петрова Б.Б.,
        избранного на общем собрании (протокол № 3 от 15.01.2026), заключили
        настоящий коллективный договор."
        Ответ:
        {
          "employer_details_status": "defined",
          "employer_details_value": "ООО «Альфа», ИНН 7700000001",
          "employer_type": "legal_entity",
          "employer_representative_status": "defined",
          "employer_representative_value": "Генеральный директор Иванов А.А.",
          "employer_authority_doc": "Устав",
          "employee_representative_body_status": "defined",
          "employee_representative_body_value": "первичная профсоюзная организация ООО «Альфа»",
          "employee_representative_type": "union",
          "employee_representative_person": "председатель Петров Б.Б.",
          "employee_authority_doc": "протокол № 3 от 15.01.2026",
          "evidence": [
            {
              "clause_ref": "преамбула",
              "quote": "ООО «Альфа» (ИНН 7700000001), именуемое «Работодатель», в лице Генерального директора Иванова А.А., действующего на основании Устава."
            }
          ]
        }
        Пример 2:
        Фрагмент:
        "Стороны заключили настоящий коллективный договор."
        Ответ:
        {
          "employer_details_status": "not_defined",
          "employer_details_value": "Данные не определены",
          "employer_type": "not_defined",
          "employer_representative_status": "not_defined",
          "employer_representative_value": "Данные не определены",
          "employer_authority_doc": "Данные не определены",
          "employee_representative_body_status": "not_defined",
          "employee_representative_body_value": "Данные не определены",
          "employee_representative_type": "not_defined",
          "employee_representative_person": "Данные не определены",
          "employee_authority_doc": "Данные не определены",
          "evidence": []
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату с идентификацией работодателя.
        2. Найди прямую цитату с представительным органом работников.
        3. Найди прямую цитату с подписантами и основаниями полномочий.
        4. Если прямой цитаты нет — верни "not_defined". Не додумывай.
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "employer_details_status": "<defined / not_defined>",
          "employer_details_value": "<реквизиты или 'Данные не определены'>",
          "employer_type": "<legal_entity / individual_entrepreneur / not_defined>",
          "employer_representative_status": "<defined / not_defined>",
          "employer_representative_value": "<ФИО и должность или 'Данные не определены'>",
          "employer_authority_doc": "<документ или 'Данные не определены'>",
          "employee_representative_body_status": "<defined / not_defined>",
          "employee_representative_body_value": "<наименование или 'Данные не определены'>",
          "employee_representative_type": "<union / elected / council / other / not_defined>",
          "employee_representative_person": "<ФИО и должность или 'Данные не определены'>",
          "employee_authority_doc": "<документ или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 650

    retrieval:
      retrieval_profile: "party_identification_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "работодатель представители работников профсоюзная организация профком избранные представители общее собрание работников конференция работников в лице действующего на основании уполномоченный представитель полномочия"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - representations
        - boilerplate
      negative_keywords:
        - "индексация"
        - "охрана труда"
        - "отпуск"
        - "рабочее время"
        - "профсоюзные взносы"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 0.20]
        boost: 0.4
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "representations"
        - "boilerplate"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.15

    evidence:
      required: true
      min_snippet_length: 50
      max_snippet_length: 800

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 1300

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по трудовому праву. Извлеки из коллективного договора
        идентификацию работодателя, представительного органа работников, подписантов
        и основания их полномочий.
        Не анализируй содержание обязательств, индексацию, охрану труда или споры.
        </role>
        <context>
        {context}
        </context>
        <task>
        Заполни строго следующие поля:
        1. employer_details_status — "defined" или "not_defined".
        2. employer_details_value — наименование и реквизиты работодателя.
        3. employer_type — legal_entity / individual_entrepreneur / not_defined.
        4. employer_representative_status — "defined" или "not_defined".
        5. employer_representative_value — ФИО и должность представителя работодателя.
        6. employer_authority_doc — документ, подтверждающий полномочия представителя работодателя.
        7. employee_representative_body_status — "defined" или "not_defined".
        8. employee_representative_body_value — наименование представительного органа работников.
        9. employee_representative_type — union / elected / council / other / not_defined.
        10. employee_representative_person — ФИО и должность представителя работников.
        11. employee_authority_doc — документ, подтверждающий полномочия представителя работников.
        Если данные отсутствуют в тексте:
        - статус = "not_defined"
        - текстовое поле = "Данные не определены"
        </task>
        <rules>
        - Используй только текст договора.
        - employee_representative_type: "union" — первичная профсоюзная организация;
        "elected" — непосредственно избранные представители;
        "council" — иной представительный орган (совет трудового коллектива и т.п.);
        "other" — иной представитель, прямо указанный в тексте;
        "not_defined" — тип не указан.
        - Верни только JSON.
        </rules>
      fields:
        - name: "employer_details_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус идентификации работодателя."
          required: true
        - name: "employer_details_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Работодатель"
          description: "Наименование и реквизиты работодателя."
          required: true
        - name: "employer_type"
          type: "string"
          presentation: "signal"
          allowed_values: ["legal_entity", "individual_entrepreneur", "not_defined"]
          description: "Тип работодателя."
          required: false
        - name: "employer_representative_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания представителя работодателя."
          required: false
        - name: "employer_representative_value"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Представитель работодателя"
          description: "ФИО и должность представителя работодателя."
          required: false
        - name: "employer_authority_doc"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Основание полномочий работодателя"
          description: "Документ, подтверждающий полномочия представителя работодателя."
          required: false
        - name: "employee_representative_body_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус идентификации представительного органа работников."
          required: true
        - name: "employee_representative_body_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Представительный орган работников"
          description: "Наименование представительного органа работников."
          required: true
        - name: "employee_representative_type"
          type: "string"
          presentation: "signal"
          allowed_values: ["union", "elected", "council", "other", "not_defined"]
          description: "Тип представительного органа работников."
          required: false
        - name: "employee_representative_person"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Представитель работников"
          description: "ФИО и должность представителя работников."
          required: false
        - name: "employee_authority_doc"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Основание полномочий представителей работников"
          description: "Документ, подтверждающий полномочия представителя работников."
          required: false
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 2: Срок, сфера действия и распространение на всех работников
  # ──────────────────────────────────────────────────────────────────────────
  - id: term_scope_coverage_check
    name: "Срок действия, сфера действия и распространение на всех работников"
    description: >
      Фактографическая проверка срока действия (≤ 3 лет, ст. 43 ТК РФ), сферы действия
      (организация / филиал / подразделение) и распространения на всех работников
      независимо от членства в профсоюзе.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "срок действия"
        - "вступает в силу"
        - "действует до"
        - "заключён на срок"
        - "продление"
        - "пролонгация"
        - "три года"
        - "3 года"
        - "распространяется на"
        - "действует в отношении"
        - "сфера действия"
        - "независимо от членства в профсоюзе"
        - "филиал"
        - "представительство"
        - "обособленное структурное подразделение"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)\\b(?:на\\s+срок|сроком)\\s+(?:на\\s+)?\\d+\\s*(?:год|лет|года)\\b"
        - "(?i)действует\\s+до\\s+\\d{1,2}[.]\\d{1,2}[.]\\d{4}"
        - "(?i)вступает\\s+в\\s+силу\\s+с\\s+\\d{1,2}[.]\\d{1,2}[.]\\d{4}"
        - "(?i)(распространяется|действует)\\s+(на|в\\s+отношении)\\s+всех\\s+работников"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по трудовому праву.
        Анализируется коллективный договор (ст. 43 ТК РФ).
        Проверяется только один вопрос: срок действия, сфера действия
        и распространение на всех работников.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        [ЗАДАЧА]
        Найди в тексте договора:
        1. Дату начала действия.
        2. Дату окончания действия.
        3. Длительность срока в годах.
        4. Условие о продлении.
        5. Сферу действия (организация / филиал / подразделение).
        6. Указание на распространение на всех работников.
        7. Указание на распространение независимо от членства в профсоюзе.
        [ПРАВИЛА]
