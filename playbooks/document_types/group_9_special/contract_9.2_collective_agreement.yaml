    retrieval:
      retrieval_profile: "employment_benefits_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "инвалид инвалидность квотирование квота рабочих мест ИПРА индивидуальная программа реабилитации сокращённая продолжительность молодой специалист выпускник стажировка наставничество предпенсионный возраст предпенсионер за пять лет до пенсии дополнительные гарантии переобучение"
      preferred_unit_types:
