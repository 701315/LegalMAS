          required: false
        - name: "employee_authority_doc"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Основание полномочий представителей работников"
          description: "Документ, подтверждающий полномочия представителя работников."
          required: false

      store_payload: true

  - id: term_scope_coverage_check
    name: "Срок действия, сфера действия и распространение на всех работников"
    description: >
      Фактографическая проверка срока действия (≤ 3 лет, ст. 43 ТК РФ), сферы действия
      (организация / филиал / подразделение) и распространения на всех работников
      независимо от членства в профсоюзе.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 20

    rules:
      keywords:
        - "срок действия"
        - "вступает в силу"
        - "действует до"
        - "заключён на срок"
        - "продление"
        - "пролонгация"
        - "три года"
        - "3 года"
        - "распространяется на"
        - "действует в отношении"
        - "сфера действия"
        - "независимо от членства в профсоюзе"
        - "филиал"
        - "представительство"
        - "обособленное структурное подразделение"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)\\b(?:на\\s+срок|сроком)\\s+(?:на\\s+)?\\d+\\s*(?:год|лет|года)\\b"
        - "(?i)действует\\s+до\\s+\\d{1,2}[.]\\d{1,2}[.]\\d{4}"
        - "(?i)вступает\\s+в\\s+силу\\s+с\\s+\\d{1,2}[.]\\d{1,2}[.]\\d{4}"
        - "(?i)(распространяется|действует)\\s+(на|в\\s+отношении)\\s+всех\\s+работников"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по трудовому праву.
        Анализируется коллективный договор (ст. 43 ТК РФ).
        Проверяется только один вопрос: срок действия, сфера действия
        и распространение на всех работников.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        [ЗАДАЧА]
        Найди в тексте договора:
        1. Дату начала действия.
        2. Дату окончания действия.
        3. Длительность срока в годах.
        4. Соответствие срока требованию ≤ 3 лет (ст. 43 ч. 2 ТК РФ).
        5. Условие о продлении.
        6. Сферу действия (организация / филиал / подразделение).
        7. Указание на распространение на всех работников.
        8. Указание на распространение независимо от членства в профсоюзе.
        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если данные не указаны прямо — статусные поля возвращай "not_defined".
        3. Текстовые поля без значения — строго "Данные не определены".
        4. Верни РОВНО один валидный JSON-объект со всеми 12 ключами (11 полей + evidence),
           пригодный для парсинга через json.loads без предварительной обработки.
           Без markdown, без ```json, без комментариев, без текста до или после.
           Начни ответ сразу с { и закончи }.
        5. Не используй None, null или пустые строки.
        6. В evidence включай только текст договора.
        7. term_within_legal_limit:
           - "within_limit" — срок договора ≤ 3 лет;
           - "exceeds_limit" — срок договора > 3 лет (нарушение ст. 43 ч. 2 ТК РФ);
           - "not_defined" — срок не указан или невозможно определить.
        8. universal_coverage_status = "defined", если прямо указано, что договор
           распространяется на всех работников организации (в т.ч. без упоминания
           профсоюза). Формулировка «независимо от членства в профсоюзе» —
           усиливает, но не обязательна (презумпция ст. 43 ч. 3 ТК РФ).
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 (полное определение):
        Фрагмент:
        "Настоящий коллективный договор вступает в силу с 01.03.2026 и действует
        до 28.02.2029 (3 года). Может быть продлён на срок не более трёх лет
        по решению сторон. Договор распространяется на всех работников организации
        независимо от членства в профсоюзе."
        Ответ:
        {
          "term_specified_status": "defined",
          "start_date_value": "01.03.2026",
          "end_date_value": "28.02.2029",
          "term_duration_years": "3",
          "term_within_legal_limit": "within_limit",
          "extension_clause_status": "defined",
          "extension_clause_details": "может быть продлён на срок не более трёх лет по решению сторон",
          "scope_of_application_status": "defined",
          "scope_of_application_value": "организация",
          "universal_coverage_status": "defined",
          "universal_coverage_details": "на всех работников организации независимо от членства в профсоюзе",
          "evidence": [
            {
              "clause_ref": "п. 8.1",
              "quote": "Настоящий коллективный договор вступает в силу с 01.03.2026 и действует до 28.02.2029 (3 года)."
            },
            {
              "clause_ref": "п. 8.2",
              "quote": "Договор распространяется на всех работников организации независимо от членства в профсоюзе."
            }
          ]
        }
        Пример 2 (частичное определение):
        Фрагмент:
        "Настоящий коллективный договор заключён на срок 3 года с 01.01.2026
        по 31.12.2028."
        Ответ:
        {
          "term_specified_status": "defined",
          "start_date_value": "01.01.2026",
          "end_date_value": "31.12.2028",
          "term_duration_years": "3",
          "term_within_legal_limit": "within_limit",
          "extension_clause_status": "not_defined",
          "extension_clause_details": "Данные не определены",
          "scope_of_application_status": "not_defined",
          "scope_of_application_value": "Данные не определены",
          "universal_coverage_status": "not_defined",
          "universal_coverage_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 8.1",
              "quote": "Настоящий коллективный договор заключён на срок 3 года с 01.01.2026 по 31.12.2028."
            }
          ]
        }
        Пример 3 (все данные отсутствуют):
        Фрагмент:
        "Стороны обязуются исполнять настоящий договор."
        Ответ:
        {
          "term_specified_status": "not_defined",
          "start_date_value": "Данные не определены",
          "end_date_value": "Данные не определены",
          "term_duration_years": "Данные не определены",
          "term_within_legal_limit": "not_defined",
          "extension_clause_status": "not_defined",
          "extension_clause_details": "Данные не определены",
          "scope_of_application_status": "not_defined",
          "scope_of_application_value": "Данные не определены",
          "universal_coverage_status": "not_defined",
          "universal_coverage_details": "Данные не определены",
          "evidence": []
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямые цитаты о дате начала и окончания, о продлении,
           о сфере действия, о распространении на всех работников.
        2. Если прямой цитаты нет — верни "not_defined". Не додумывай.
        3. Проверь, что срок договора ≤ 3 лет; если больше — "exceeds_limit".
        4. Проверь, что все 12 ключей (11 полей + evidence) присутствуют в JSON.
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "term_specified_status": "<defined / not_defined>",
          "start_date_value": "<дата или 'Данные не определены'>",
          "end_date_value": "<дата или 'Данные не определены'>",
          "term_duration_years": "<число лет или 'Данные не определены'>",
          "term_within_legal_limit": "<within_limit / exceeds_limit / not_defined>",
          "extension_clause_status": "<defined / not_defined>",
          "extension_clause_details": "<текст или 'Данные не определены'>",
          "scope_of_application_status": "<defined / not_defined>",
          "scope_of_application_value": "<текст или 'Данные не определены'>",
          "universal_coverage_status": "<defined / not_defined>",
          "universal_coverage_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 10
      temperature: 0.0
      max_tokens: 650

    retrieval:
      retrieval_profile: "term_and_renewal_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "срок действия вступает в силу действует до заключён на срок продление пролонгация три года 3 года распространяется на всех работников независимо от членства в профсоюзе сфера действия филиал представительство обособленное структурное подразделение ст. 43 ТК РФ"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - boilerplate
        - definitions
      negative_keywords:
        - "индексация"
        - "охрана труда"
        - "отпуск"
        - "рабочее время"
        - "профсоюзные взносы"
        - "забастовка"
        - "реорганизация"
        - "в целях настоящего"
      context_k: 10
      max_chunks: 14
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "boilerplate"
        - "definitions"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 550

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1300

      compact_output: false

      presence_signal:
        field: "term_scope_coverage_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по трудовому праву. Извлеки из коллективного договора
        срок действия, сферу действия и распространение на всех работников.
        Не анализируй содержание обязательств, индексацию или охрану труда.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. term_scope_coverage_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (term_specified_status, extension_clause_status,
              scope_of_application_status, universal_coverage_status) ≠ "not_defined";
           - "missing" — если все четыре содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - term_specified_status = "not_defined";
           - term_within_legal_limit = "not_defined";
           - extension_clause_status = "not_defined";
           - scope_of_application_status = "not_defined";
           - universal_coverage_status = "not_defined";
           - start_date_value, end_date_value, term_duration_years = "Данные не определены";
           - extension_clause_details, scope_of_application_value, universal_coverage_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. term_specified_status:
           - "defined" — если в тексте прямо указан срок действия (даты начала/окончания
             или длительность в годах);
           - "not_defined" — если срок прямо не указан.

        2. start_date_value:
           Дата начала действия договора в формате ДД.ММ.ГГГГ.
           Если данных нет — "Данные не определены".

        3. end_date_value:
           Дата окончания действия договора в формате ДД.ММ.ГГГГ.
           Если данных нет — "Данные не определены".

        4. term_duration_years:
           Длительность срока в годах, как указано в договоре (например: "3", "2").
           Если данных нет — "Данные не определены".

        5. term_within_legal_limit:
           - "within_limit" — если срок ≤ 3 лет;
           - "exceeds_limit" — если срок > 3 лет (нарушение ст. 43 ч. 2 ТК РФ);
           - "not_defined" — если срок не указан или невозможно определить.
           Важно: не выводи срок из нормы закона — только из текста договора.

        6. extension_clause_status:
           - "defined" — если в тексте прямо указано условие о продлении (пролонгации);
           - "not_defined" — если условие о продлении не указано.

        7. extension_clause_details:
           Краткое описание условия о продлении.
           Если данных нет — "Данные не определены".

        8. scope_of_application_status:
           - "defined" — если сфера действия прямо указана (организация, филиал,
             подразделение);
           - "not_defined" — если сфера не указана.

        9. scope_of_application_value:
           Сфера действия договора: "организация", "филиал", "подразделение" или
           краткое описание из текста.
           Если данных нет — "Данные не определены".

        10. universal_coverage_status:
            - "defined" — если прямо указано, что договор распространяется на всех
              работников организации (в т.ч. без упоминания профсоюза;
              формулировка «независимо от членства в профсоюзе» усиливает, но не обязательна);
            - "not_defined" — если распространение прямо не указано.

        11. universal_coverage_details:
            Краткое описание условия о распространении.
            Если данных нет — "Данные не определены".
        </task>

        <context_rules>
        - Перед остальными полями заполни term_scope_coverage_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_value/*_details/*_years = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не выводи срок, сферу или покрытие из норм ТК РФ — только из текста договора.
        - term_within_legal_limit оценивай только если term_specified_status = "defined" и длительность можно определить.
        - universal_coverage_status = "defined" при любой прямой формулировке о распространении на всех работников, даже без упоминания профсоюза.
        - Если в разных фрагментах указаны разные даты или сроки и конфликт нельзя разрешить по тексту: статус → "not_defined", текстовое поле → "Не удалось определить".
        - Не используй пустые строки.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни срока, ни сферы действия, ни указания на распространение.
           → presence = "missing";
             все *_status = "not_defined";
             все *_value / *_details / *_years = "Данные не определены".

        2. Срок указан, но сфера не раскрыта.
           Даты начала и окончания есть, но нет указания на сферу действия
           и распространение.
           → presence = "present";
             term_specified_status = "defined";
             scope_of_application_status = "not_defined";
             universal_coverage_status = "not_defined".

        3. Противоречие в датах.
           В преамбуле указан один срок, в заключительных положениях — другой.
           → presence = "unclear";
             term_specified_status = "not_defined";
             start_date_value, end_date_value = "Не удалось определить".

        4. Отсылка на приказ о введении в действие.
           Срок определяется ссылкой на приказ или распоряжение без указания
           конкретных дат в тексте договора.
           → presence = "present";
             term_specified_status = "defined";
             start_date_value содержит формулировку вида "Согласно Приказу №... от ...".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для term_scope_coverage_check_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined" или "not_defined".
        - Для term_within_legal_limit используй только: "within_limit", "exceeds_limit", "not_defined".
        - Fallback при отсутствии данных:
          * start_date_value, end_date_value, term_duration_years → "Данные не определены";
          * extension_clause_details, scope_of_application_value, universal_coverage_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_value / *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "term_scope_coverage_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по сроку/сфере/покрытию. Внутреннее агрегатное signal-поле."
          required: true

        - name: "term_specified_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания срока действия."
          required: true
        - name: "start_date_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Дата начала"
          description: "Дата начала действия договора."
          required: false
        - name: "end_date_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Дата окончания"
          description: "Дата окончания действия договора."
          required: false
        - name: "term_duration_years"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Срок (лет)"
          description: "Длительность срока в годах, как указано в договоре."
          max_value_chars: 20
          required: false
        - name: "term_within_legal_limit"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["within_limit", "exceeds_limit", "not_defined"]
          description: "Соответствие срока требованиям ст. 43 ч. 2 ТК РФ (≤ 3 лет)."
          required: true
        - name: "extension_clause_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус условия о продлении."
          required: true
        - name: "extension_clause_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Продление"
          description: "Условие о продлении договора."
          required: false
        - name: "scope_of_application_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания сферы действия."
          required: true
        - name: "scope_of_application_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 4
          label: "Сфера действия"
          description: "Сфера действия договора (организация / филиал / подразделение)."
          required: false
        - name: "universal_coverage_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус распространения на всех работников."
          required: true
        - name: "universal_coverage_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 5
          label: "Распространение"
          description: "Распространение на всех работников независимо от членства в профсоюзе."
          required: false

      store_payload: true

  - id: no_worsening_principle_check
    name: "Принцип недопустимости ухудшения положения работников (ст. 9, 50 ТК РФ)"
    description: >
      Фактографическая проверка наличия явного указания на недопустимость ухудшения
      положения работников и выявление потенциально ухудшающих условий.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 30

    rules:
      keywords:
        - "не могут ухудшать"
        - "не ухудшают положение"
        - "дополнительные гарантии"
        - "не ниже установленных ТК"
        - "улучшение положения работников"
        - "в дополнение к гарантиям"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)условия.*не\\s+(могут|должны)\\s+ухудшать\\s+положение"
        - "(?i)гарантии.*являются\\s+дополнительными"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по трудовому праву.
        Анализируется коллективный договор (ст. 9, 50 ТК РФ).
        Проверяется только один вопрос: наличие принципа недопустимости ухудшения
        положения работников и выявление потенциально ухудшающих условий.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        [ЗАДАЧА]
        Найди в тексте договора:
        1. Прямое или подразумеваемое указание на недопустимость ухудшения положения работников.
        2. Указание на то, что гарантии являются дополнительными к ТК РФ.
        3. Формулировки, потенциально ухудшающие положение работников.
        [МАРКЕРЫ УХУДШЕНИЯ]
        Ищи конкретные формулировки:
        - снижение уровня гарантий ниже установленного ТК РФ;
        - замена гарантии денежной компенсацией;
        - отказ работника от права;
        - «не применяются нормы ТК РФ» / «приостанавливается действие»;
        - ухудшение условий по сравнению с предыдущей редакцией.
        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если данные не указаны прямо — статусные поля возвращай "not_defined".
        3. Текстовые поля без значения — строго "Данные не определены".
        4. Верни РОВНО один валидный JSON-объект со всеми 7 ключами (6 полей + evidence),
           пригодный для парсинга через json.loads без предварительной обработки.
           Без markdown, без ```json, без комментариев, без текста до или после.
           Начни ответ сразу с { и закончи }.
        5. Не используй None, null или пустые строки.
        6. В evidence включай только текст договора.
        7. no_worsening_clause_status:
           - "explicit" — прямое указание на недопустимость ухудшения;
           - "implicit" — принцип подразумевается (например, «в целях повышения гарантий»),
             но прямого «не хуже ТК» нет;
           - "not_defined" — вопрос не раскрыт.
        8. potential_worsening_status:
           - "detected" — выявлены формулировки-маркеры ухудшения;
           - "not_detected" — таких формулировок нет;
           - "unclear" — формулировка неоднозначная.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 (полное определение):
        Фрагмент:
        "Настоящий коллективный договор не может ухудшать положение работников
        по сравнению с трудовым законодательством. Гарантии и льготы, установленные
        настоящим договором, являются дополнительными к гарантиям, установленным ТК РФ."
        Ответ:
        {
          "no_worsening_clause_status": "explicit",
          "no_worsening_clause_details": "не может ухудшать положение работников по сравнению с трудовым законодательством",
          "additional_guarantees_status": "defined",
          "additional_guarantees_details": "гарантии и льготы являются дополнительными к гарантиям ТК РФ",
          "potential_worsening_status": "not_detected",
          "potential_worsening_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 1.3",
              "quote": "Настоящий коллективный договор не может ухудшать положение работников по сравнению с трудовым законодательством."
            }
          ]
        }
        Пример 2 (принцип есть, выявлено ухудшение):
        Фрагмент:
        "Договор не ухудшает положение работников по сравнению с ТК РФ.
        Работникам, увольняемым по сокращению численности, выплачивается
        выходное пособие в размере двух средних месячных заработков вместо
        трёх, предусмотренных трудовым законодательством."
        Ответ:
        {
          "no_worsening_clause_status": "explicit",
          "no_worsening_clause_details": "Договор не ухудшает положение работников по сравнению с ТК РФ",
          "additional_guarantees_status": "not_defined",
          "additional_guarantees_details": "Данные не определены",
          "potential_worsening_status": "detected",
          "potential_worsening_details": "выходное пособие при сокращении — два средних месячных заработка вместо трёх (снижение гарантии ниже ТК РФ)",
          "evidence": [
            {
              "clause_ref": "п. 3.2",
              "quote": "Работникам, увольняемым по сокращению численности, выплачивается выходное пособие в размере двух средних месячных заработков вместо трёх, предусмотренных трудовым законодательством."
            }
          ]
        }
        Пример 3 (принцип отсутствует):
        Фрагмент:
        "Стороны обязуются исполнять настоящий договор."
        Ответ:
        {
          "no_worsening_clause_status": "not_defined",
          "no_worsening_clause_details": "Данные не определены",
          "additional_guarantees_status": "not_defined",
          "additional_guarantees_details": "Данные не определены",
          "potential_worsening_status": "not_detected",
          "potential_worsening_details": "Данные не определены",
          "evidence": []
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о недопустимости ухудшения.
        2. Найди прямую цитату о дополнительных гарантиях.
        3. Найди прямые цитаты формулировок-маркеров ухудшения.
        4. Если прямой цитаты нет — верни "not_defined"/"not_detected". Не додумывай.
        5. Проверь, что все 7 ключей (6 полей + evidence) присутствуют в JSON.
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "no_worsening_clause_status": "<explicit / implicit / not_defined>",
          "no_worsening_clause_details": "<цитата или 'Данные не определены'>",
          "additional_guarantees_status": "<defined / not_defined>",
          "additional_guarantees_details": "<текст или 'Данные не определены'>",
          "potential_worsening_status": "<detected / not_detected / unclear>",
          "potential_worsening_details": "<описание или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 10
      temperature: 0.0
      max_tokens: 700

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "не могут ухудшать не ухудшают положение дополнительные гарантии не ниже установленных ТК улучшение положения работников в дополнение к гарантиям взамен гарантий отказ от права снижение гарантий ниже установленного ТК ухудшающие условия"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - definitions
        - boilerplate
      negative_keywords:
        - "профсоюзные взносы"
        - "забастовка"
        - "реорганизация"
        - "в целях настоящего"
      context_k: 10
      max_chunks: 14
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "definitions"
        - "boilerplate"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1200

      compact_output: false

      presence_signal:
        field: "no_worsening_principle_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по трудовому праву. Извлеки из коллективного договора
        сведения о принципе недопустимости ухудшения положения работников
        и потенциально ухудшающих условиях.
        Не анализируй индексацию, охрану труда или споры.
        </role>
        <context>
        {context}
        </context>
        <task>
        0. no_worsening_principle_check_presence: определи, есть ли в договоре фрагменты,
           касающиеся принципа недопустимости ухудшения положения работников, дополнительных
           гарантий или ухудшающих условий.
           - "present" — есть хотя бы один фрагмент по теме (прямое указание, декларация
             о дополнительных гарантиях, формулировки-маркеры ухудшения).
           - "missing" — фрагментов по теме нет вообще.
           - "unclear" — фрагменты есть, но они противоречат друг другу и вывод невозможен.

        1. no_worsening_clause_status — explicit / implicit / not_defined.
        2. no_worsening_clause_details — формулировка о недопустимости ухудшения.
        3. additional_guarantees_status — defined / not_defined.
        4. additional_guarantees_details — указание на дополнительные гарантии.
        5. potential_worsening_status — detected / not_detected / unclear.
        6. potential_worsening_details — описание потенциально ухудшающих условий.

        Если данные отсутствуют в тексте:
        - статус = "not_defined" (или "not_detected" для potential_worsening_status)
        - текстовое поле = "Данные не определены"
        </task>
        <context_rules>
        - no_worsening_principle_check_presence и все статусные поля попарно не пересекаются
          по значениям present/missing/unclear; их объединение покрывает все допустимые значения.
        - no_worsening_clause_status: "explicit" — прямое указание на недопустимость ухудшения;
          "implicit" — принцип подразумевается, но прямого «не хуже ТК» нет;
          "not_defined" — вопрос не раскрыт.
        - additional_guarantees_status: "defined" — есть указание на дополнительные гарантии
          к ТК РФ; "not_defined" — указание отсутствует.
        - potential_worsening_status: "detected" — выявлены формулировки-маркеры ухудшения
          (снижение ниже ТК, замена гарантии, отказ от права, приостановление норм ТК);
          "not_detected" — таких формулировок не выявлено;
          "unclear" — формулировка неоднозначная.
        - Если no_worsening_clause_status ∈ {explicit, implicit} ИЛИ
          additional_guarantees_status = "defined" ИЛИ
          potential_worsening_status ∈ {detected, unclear}, то
          no_worsening_principle_check_presence = "present".
        - Если все статусные поля = "not_defined"/"not_detected", то
          no_worsening_principle_check_presence = "missing".
        </context_rules>
        <edge_cases>
        1. Полное отсутствие фрагментов о недопустимости ухудшения, дополнительных
           гарантиях и ухудшающих условиях → no_worsening_principle_check_presence = "missing",
           все статусы = "not_defined"/"not_detected".
        2. Прямое указание «не может ухудшать положение» + выявленное ухудшение
           (например, снижение выходного пособия ниже ТК) → presence = "present",
           no_worsening_clause_status = "explicit", potential_worsening_status = "detected".
        3. Декларация о дополнительных гарантиях без прямого «не ухудшает» →
           presence = "present", no_worsening_clause_status = "implicit",
           additional_guarantees_status = "defined".
        4. Противоречие: в одном разделе «не ухудшает», в другом — снижение гарантии
           ниже ТК без оговорки → presence = "unclear",
           potential_worsening_status = "unclear".
        </edge_cases>
        <output_expectations>
        - Все 7 полей (1 presence + 6 substantive) обязательны.
        - Статусные поля возвращают только значения из allowed_values.
        - Текстовые поля без данных — строго "Данные не определены".
        - Не используй None, null или пустые строки.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "no_worsening_principle_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие фрагментов о принципе недопустимости ухудшения положения работников."
          required: true
        - name: "no_worsening_clause_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["explicit", "implicit", "not_defined"]
          description: "Статус принципа недопустимости ухудшения."
          required: true
        - name: "no_worsening_clause_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Принцип недопустимости ухудшения"
          description: "Формулировка о недопустимости ухудшения положения работников."
          required: false
        - name: "additional_guarantees_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания на дополнительные гарантии."
          required: true
        - name: "additional_guarantees_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Дополнительные гарантии"
          description: "Указание на дополнительные гарантии к ТК РФ."
          required: false
        - name: "potential_worsening_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["detected", "not_detected", "unclear"]
          description: "Статус выявления потенциально ухудшающих условий."
          required: true
        - name: "potential_worsening_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Потенциально ухудшающие условия"
          description: "Описание выявленных формулировок-маркеров ухудшения."
          required: false

      store_payload: true

  - id: wage_indexation_check
    name: "Механизм индексации заработной платы (ст. 134 ТК РФ)"
    description: >
      Фактографическая проверка наличия конкретного механизма индексации заработной платы
      в связи с ростом потребительских цен. Для коммерческих организаций — обязательный элемент.
    triggers:
      any:
        - commercial_employer
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 40

    rules:
      keywords:
        - "индексация заработной платы"
        - "индексация зарплаты"
        - "рост потребительских цен"
        - "инфляция"
        - "индекс потребительских цен"
        - "ИПЦ"
        - "повышение оплаты труда"
        - "пересмотр окладов"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)индексаци(я|ю|и)\\s+заработн"
        - "(?i)повышен(ие|ия)\\s+(оплаты|окладов|тарифн)"
        - "(?i)\\d+\\s*%\\s*(от\\s+)?индекс"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по трудовому праву.
        Анализируется коллективный договор (ст. 134 ТК РФ).
        Проверяется только один вопрос: наличие механизма индексации заработной платы.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        [ЗАДАЧА]
        Найди в тексте договора:
        1. Наличие механизма индексации.
        2. Основу для индексации (ИПЦ / фиксированный % / привязка к прибыли / иное).
        3. Периодичность индексации.
        4. Порядок принятия решения об индексации.
        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если данные не указаны прямо — статусные и enum-поля возвращай "not_defined".
        3. Текстовые поля без значения — строго "Данные не определены".
        4. Верни РОВНО один валидный JSON-объект со всеми 7 ключами (6 полей + evidence),
           пригодный для парсинга через json.loads без предварительной обработки.
           Без markdown, без ```json, без комментариев, без текста до или после.
           Начни ответ сразу с { и закончи }.
        5. Не используй None, null или пустые строки.
        6. В evidence включай только текст договора.
        7. indexation_mechanism_status:
           - "concrete" — указаны основа, периодичность и/или порядок;
           - "declarative" — есть только общая декларация («обеспечивает повышение
             уровня оплаты труда») без параметров;
           - "not_defined" — нет ни механизма, ни декларации.
        8. indexation_basis: "CPI" — привязка к ИПЦ / инфляции;
           "fixed_percentage" — фиксированный процент;
           "profit_linked" — привязка к прибыли;
           "other" — иной механизм, прямо указанный в тексте;
           "not_defined" — основа не указана.
        9. indexation_frequency: "annual" / "semi_annual" / "quarterly" / "other" / "not_defined".
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 (конкретный механизм):
        Фрагмент:
        "Заработная плата индексируется ежегодно на уровень инфляции, определяемый
        по индексу потребительских цен за предыдущий год. Решение об индексации
        принимается работодателем не позднее 1 февраля текущего года."
        Ответ:
        {
          "indexation_mechanism_status": "concrete",
          "indexation_mechanism_details": "ежегодно на уровень инфляции по ИПЦ за предыдущий год",
          "indexation_basis": "CPI",
          "indexation_frequency": "annual",
          "decision_procedure_status": "defined",
          "decision_procedure_details": "решение принимается работодателем не позднее 1 февраля текущего года",
          "evidence": [
            {
              "clause_ref": "п. 3.2",
              "quote": "Заработная плата индексируется ежегодно на уровень инфляции, определяемый по индексу потребительских цен за предыдущий год."
            }
          ]
        }
        Пример 2 (декларация без параметров):
        Фрагмент:
        "Работодатель обеспечивает повышение уровня оплаты труда."
        Ответ:
        {
          "indexation_mechanism_status": "declarative",
          "indexation_mechanism_details": "обеспечивает повышение уровня оплаты труда",
          "indexation_basis": "not_defined",
          "indexation_frequency": "not_defined",
          "decision_procedure_status": "not_defined",
          "decision_procedure_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 3.1",
              "quote": "Работодатель обеспечивает повышение уровня оплаты труда."
            }
          ]
        }
        Пример 3 (индексация не упоминается):
        Фрагмент:
        "Оплата труда работников производится в соответствии с ТК РФ и штатным расписанием."
        Ответ:
        {
          "indexation_mechanism_status": "not_defined",
          "indexation_mechanism_details": "Данные не определены",
          "indexation_basis": "not_defined",
          "indexation_frequency": "not_defined",
          "decision_procedure_status": "not_defined",
          "decision_procedure_details": "Данные не определены",
          "evidence": []
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату об индексации.
        2. Найди прямую цитату об основе индексации.
        3. Найди прямую цитату о периодичности.
        4. Найди прямую цитату о порядке принятия решения.
        5. Если прямой цитаты нет — верни "not_defined". Не додумывай.
        6. Проверь, что все 7 ключей (6 полей + evidence) присутствуют в JSON.
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "indexation_mechanism_status": "<concrete / declarative / not_defined>",
          "indexation_mechanism_details": "<текст или 'Данные не определены'>",
          "indexation_basis": "<CPI / fixed_percentage / profit_linked / other / not_defined>",
          "indexation_frequency": "<annual / semi_annual / quarterly / other / not_defined>",
          "decision_procedure_status": "<defined / not_defined>",
          "decision_procedure_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 650

    retrieval:
      retrieval_profile: "payment_terms_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "индексация заработной платы индексация зарплаты рост потребительских цен инфляция индекс потребительских цен ИПЦ повышение оплаты труда пересмотр окладов ст. 134 ТК РФ"
      preferred_unit_types:
        - payment_term
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "охрана труда"
        - "отпуск"
        - "рабочее время"
        - "профсоюзные взносы"
        - "забастовка"
        - "реорганизация"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.15, 0.55]
        boost: 0.30
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1200

      compact_output: false

      presence_signal:
        field: "wage_indexation_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по трудовому праву. Извлеки из коллективного договора
        сведения о механизме индексации заработной платы.
        Не анализируй охрану труда, отпуска или споры.
        </role>
        <context>
        {context}
        </context>
        <task>
        0. wage_indexation_check_presence: определи, есть ли в договоре фрагменты,
           касающиеся индексации заработной платы, её механизма, основы, периодичности
           или порядка принятия решения.
           - "present" — есть хотя бы один фрагмент по теме (конкретный механизм,
             декларация, упоминание ИПЦ/инфляции, периодичность).
           - "missing" — фрагментов по теме нет вообще.
           - "unclear" — фрагменты есть, но противоречат друг другу и вывод невозможен.

        1. indexation_mechanism_status — concrete / declarative / not_defined.
        2. indexation_mechanism_details — формулировка механизма индексации.
        3. indexation_basis — CPI / fixed_percentage / profit_linked / other / not_defined.
        4. indexation_frequency — annual / semi_annual / quarterly / other / not_defined.
        5. decision_procedure_status — defined / not_defined.
        6. decision_procedure_details — порядок принятия решения об индексации.

        Если данные отсутствуют в тексте:
        - статус/enum = "not_defined"
        - текстовое поле = "Данные не определены"
        </task>
        <context_rules>
        - wage_indexation_check_presence и все статусные поля попарно не пересекаются
          по значениям present/missing/unclear; их объединение покрывает все допустимые значения.
        - indexation_mechanism_status: "concrete" — есть основа, периодичность и/или порядок;
          "declarative" — только общая декларация без параметров;
          "not_defined" — ни механизма, ни декларации.
        - indexation_basis: "CPI" — привязка к ИПЦ/инфляции; "fixed_percentage" — фиксированный %;
          "profit_linked" — привязка к прибыли; "other" — иной механизм; "not_defined".
        - indexation_frequency: annual / semi_annual / quarterly / other / not_defined.
        - decision_procedure_status: "defined" — порядок указан; "not_defined" — не указан.
        - Если indexation_mechanism_status ∈ {concrete, declarative} ИЛИ
          indexation_basis ≠ "not_defined" ИЛИ indexation_frequency ≠ "not_defined", то
          wage_indexation_check_presence = "present".
        - Если все поля = "not_defined", то wage_indexation_check_presence = "missing".
        </context_rules>
        <edge_cases>
        1. Полное отсутствие упоминаний индексации, ИПЦ, инфляции, повышения оплаты труда →
           wage_indexation_check_presence = "missing", все статусы = "not_defined".
        2. Декларация «работодатель обеспечивает повышение уровня оплаты труда» без
           конкретных параметров → presence = "present",
           indexation_mechanism_status = "declarative", basis/frequency = "not_defined".
        3. Конкретный механизм (ИПЦ, ежегодно, порядок решения) → presence = "present",
           indexation_mechanism_status = "concrete", basis = "CPI", frequency = "annual".
        4. Противоречие: в одном разделе «ежегодно», в другом «по решению комиссии
           не реже раза в два года» → presence = "unclear",
           indexation_frequency = "other" с пояснением в details.
        </edge_cases>
        <output_expectations>
        - Все 7 полей (1 presence + 6 substantive) обязательны.
        - Статусные и enum-поля возвращают только значения из allowed_values.
        - Текстовые поля без данных — строго "Данные не определены".
        - Не используй None, null или пустые строки.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "wage_indexation_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие фрагментов о механизме индексации заработной платы."
          required: true
        - name: "indexation_mechanism_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["concrete", "declarative", "not_defined"]
          description: "Статус механизма индексации."
          required: true
        - name: "indexation_mechanism_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Механизм индексации"
          description: "Формулировка механизма индексации."
          required: false
        - name: "indexation_basis"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["CPI", "fixed_percentage", "profit_linked", "other", "not_defined"]
          description: "Основа для индексации."
          required: true
        - name: "indexation_frequency"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["annual", "semi_annual", "quarterly", "other", "not_defined"]
          description: "Периодичность индексации."
          required: true
        - name: "decision_procedure_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус порядка принятия решения."
          required: true
        - name: "decision_procedure_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Порядок принятия решения"
          description: "Порядок принятия решения об индексации."
          required: false

      store_payload: true

  - id: union_activity_guarantees_check
    name: "Гарантии профсоюзной деятельности (ст. 374–377 ТК РФ, ФЗ-10)"
    description: >
      Фактографическая проверка наличия конкретных гарантий для профсоюзной организации:
      помещение, оргтехника, освобождение от работы, защита от увольнения, перечисление взносов,
      доступ к информации.
    triggers:
      any:
        - union_representative
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 50

    rules:
      keywords:
        - "гарантии профсоюзной деятельности"
        - "помещение для профсоюза"
        - "освобождение от основной работы"
        - "профсоюзные взносы"
        - "увольнение профсоюзного работника"
        - "согласие профсоюза на увольнение"
        - "информация для профсоюза"
        - "предоставление документации профсоюзу"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)работодатель\\s+обязуется\\s+предоставить\\s+профсоюзу"
        - "(?i)гарантии\\s+(для\\s+)?выборн(ых|ого)\\s+профсоюзн"
        - "(?i)перечисл(ение|ять)\\s+профсоюзн(ых|ые)\\s+взнос"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по трудовому праву.
        Анализируется коллективный договор (ст. 374–377 ТК РФ, ФЗ-10).
        Проверяется только один вопрос: гарантии профсоюзной деятельности.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        [ЗАДАЧА]
        Найди в тексте договора:
        1. Предоставление помещения профсоюзу (включая оргтехнику, связь, транспорт).
        2. Освобождение профсоюзных работников от основной работы.
        3. Перечисление профсоюзных взносов.
        4. Защита профсоюзных работников от увольнения.
        5. Предоставление информации профсоюзу.
        [МАРКЕРЫ]
        - Помещение: «предоставляет помещение», «безвозмездное пользование», «оргтехника», «средства связи».
        - Освобождение: «освобождаются от основной работы», «на время исполнения профсоюзных обязанностей», «с сохранением среднего заработка».
        - Взносы: «перечисляет», «ежемесячно», «1% от заработной платы», «без заявления работника».
        - Защита от увольнения: «с предварительного согласия вышестоящего профсоюзного органа», «не допускается увольнение».
        - Информация: «предоставляет информацию», «документы», «по запросу профсоюза».
        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если данные не указаны прямо — статусные поля возвращай "not_defined".
        3. Текстовые поля без значения — строго "Данные не определены".
        4. Верни РОВНО один валидный JSON-объект со всеми 11 ключами (10 полей + evidence),
           пригодный для парсинга через json.loads без предварительной обработки.
           Без markdown, без ```json, без комментариев, без текста до или после.
           Начни ответ сразу с { и закончи }.
        5. Не используй None, null или пустые строки.
        6. В evidence включай только текст договора.
        7. Для каждого из 5 аспектов сначала определи статус:
           "defined" — соответствующая гарантия прямо указана в тексте;
           "not_defined" — гарантия не упомянута.
           Details заполняется только если статус = "defined".
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 (частичное определение):
        Фрагмент:
        "Работодатель предоставляет профсоюзной организации помещение для работы
        и оргтехнику. Работники, избранные в профком, освобождаются от основной работы
        на время исполнения профсоюзных обязанностей. Работодатель перечисляет профсоюзные
        взносы на счёт профсоюза в размере 1% от заработной платы работников ежемесячно."
        Ответ:
        {
          "premises_provided_status": "defined",
          "premises_provided_details": "предоставляет помещение для работы и оргтехнику",
          "release_from_work_status": "defined",
          "release_from_work_details": "освобождаются от основной работы на время исполнения профсоюзных обязанностей",
          "dues_transfer_status": "defined",
          "dues_transfer_details": "перечисляет профсоюзные взносы 1% от заработной платы ежемесячно",
          "dismissal_protection_status": "not_defined",
          "dismissal_protection_details": "Данные не определены",
          "information_access_status": "not_defined",
          "information_access_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 5.1",
              "quote": "Работодатель предоставляет профсоюзной организации помещение для работы и оргтехнику."
            },
            {
              "clause_ref": "п. 5.3",
              "quote": "Работодатель перечисляет профсоюзные взносы на счёт профсоюза в размере 1% от заработной платы работников ежемесячно."
            }
          ]
        }
        Пример 2 (полное определение — все гарантии):
        Фрагмент:
        "Работодатель предоставляет профсоюзной организации помещение, оргтехнику и средства связи.
