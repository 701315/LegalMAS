  - id: special_categories_workers_check
    name: "Гарантии отдельным категориям работников: инвалиды, молодёжь, предпенсионеры"
    description: >
      Фактографическая проверка гарантий и квот для отдельных категорий
      работников: инвалидов (ФЗ №181-ФЗ, ст. 92, 94, 96, 99, 113, 128,
      179, 224 ТК РФ), молодёжи (локальные гарантии), предпенсионеров
      (ст. 144.1 УК РФ, ст. 179 ТК РФ). Обучение и защита от увольнения.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 220

    rules:
      keywords:
        - "инвалид"
        - "инвалидность"
        - "квотирование"
        - "квота рабочих мест"
        - "ИПРА"
        - "индивидуальная программа реабилитации"
        - "сокращённая продолжительность"
        - "молодой специалист"
        - "выпускник"
        - "стажировка"
        - "наставничество"
        - "предпенсионный возраст"
        - "предпенсионер"
        - "за 5 лет до пенсии"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)инвалид[а-яё]*"
        - "(?i)квот[а-яё]*\\s+(рабоч|мест)"
        - "(?i)ИПРА|индивидуальн[а-яё]+\\s+программ[а-яё]+\\s+реабилитаци"
        - "(?i)(молод[а-яё]+\\s+специалист|выпускник|стажировк|наставничеств)"
        - "(?i)предпенсионн[а-яё]+"
        - "(?i)за\\s+пять\\s+лет\\s+до\\s+(наступления\\s+)?пенси"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по трудовому праву.
        Анализируется коллективный договор.
        Проверяется только один вопрос: гарантии отдельным категориям
        работников — инвалидам, молодёжи, предпенсионерам.
        Нормативные ориентиры:
        - ст. 21, 22 ФЗ №181-ФЗ «О социальной защите инвалидов» —
          квотирование рабочих мест (от 2 до 4% для организаций
          с численностью свыше 100 человек).
        - ст. 92, 94, 96, 99, 113, 128, 179, 224 ТК РФ — специальные
          гарантии инвалидам (сокращённое рабочее время, ограничения
          по ночным / сверхурочным / командировкам, преимущественное
          право при сокращении, дополнительный отпуск).
        - ст. 144.1 УК РФ — уголовная ответственность за необоснованный
          отказ в приёме на работу и увольнение лиц предпенсионного
          возраста.
        - ст. 179 ТК РФ — преимущественное право при сокращении
          (в т.ч. для лиц с более высокой производительностью;
          коллективным договором могут устанавливаться иные категории).
        - ст. 128 ТК РФ — дополнительный отпуск без сохранения
          заработной платы для отдельных категорий.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Различай: КД закрепляет гарантию, цитирует норму ТК РФ
          или вообще не упоминает.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Гарантии работникам-инвалидам (сокращённое время,
           ограничения по ночным / командировкам, дополнительный отпуск).
        2. Квотирование рабочих мест для инвалидов (размер квоты,
           порядок).
        3. Гарантии молодёжи (стажировки, наставничество, программы
           для молодых специалистов).
        4. Гарантии предпенсионерам (дополнительные гарантии,
           защита от увольнения, обучение).
        5. Обучение и переобучение специальных категорий.
        6. Защита от увольнения специальных категорий.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Для enum-полей (*_status) при отсутствии данных возвращай
           "not_defined".
        4. Для строковых *_details при отсутствии данных возвращай строго
           "Данные не определены".
        5. Не используй "None", "null", пустые строки или отсутствующие ключи.
        6. В evidence включай только прямые цитаты из текста договора.
        7. Различай:
           - "defined" — КД прямо закрепляет гарантию с параметрами;
           - "declarative" — только упоминание без конкретики;
           - "not_defined" — тема не раскрыта.
        8. Если КД просто цитирует норму ТК РФ / 181-ФЗ без улучшения —
           статус "declarative".
        9. В disabled_quota_details фиксируй размер квоты (в процентах
           или в единицах рабочих мест), если указан.
        10. Верни РОВНО один валидный JSON-объект со всеми 13 ключами
            (12 полей + evidence), пригодный для парсинга через json.loads
            без предварительной обработки. Без markdown, без ```json,
            без комментариев, без текста до или после. Начни ответ сразу
            с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — полное покрытие:
        Фрагмент:
        "Работникам-инвалидам устанавливается сокращённая продолжительность
        рабочего времени не более 35 часов в неделю с сохранением полной оплаты.
        Квота рабочих мест для инвалидов — 4% от среднесписочной численности.
        Для молодых специалистов — программа наставничества и стажировка
        на 3 месяца. Предпенсионерам — дополнительный отпуск 5 дней и защита
        от увольнения без согласования с профсоюзом. Работодатель обеспечивает
        переобучение специальных категорий за свой счёт."
        Ответ:
        {
          "disabled_workers_guarantees_status": "defined",
