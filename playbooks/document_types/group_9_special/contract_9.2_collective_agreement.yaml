      retrieval_query: "беременная беременность отпуск по беременности и родам отпуск по уходу за ребёнком перерыв для кормления ребёнок до трёх лет ребёнок-инвалид многодетная усыновитель материальная помощь при рождении дополнительный выходной гарантии женщинам семейные обязанности гибкий график"
      preferred_unit_types:
