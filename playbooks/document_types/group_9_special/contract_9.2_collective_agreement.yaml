          required: true
        - name: "additional_leave_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Дополнительные отпуска"
          description: >
            Дополнительные отпуска (в т.ч. за вредные условия). Fallback: "Не установлено" / "Не удалось определить".
          required: false

      store_payload: true

  - id: occupational_safety_check
    name: "Охрана труда и вредные условия (ст. 147, 212–231 ТК РФ)"
    description: >
      Фактографическая проверка мероприятий по охране труда, их финансирования,
      обеспечения СИЗ, результатов СОУТ и гарантий за вредные/опасные условия.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 130

    rules:
      keywords:
        - "мероприятия по охране труда"
        - "финансирование охраны труда"
        - "средства индивидуальной защиты"
        - "специальная оценка условий труда"
        - "СОУТ"
        - "оздоровительные мероприятия"
        - "медицинский осмотр"
        - "доплата за вредность"
        - "молоко"
        - "лечебно-профилактическое питание"
        - "класс условий труда"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)финансировани(е|я)\\s+охран(ы|у)\\s+труда"
        - "(?i)специальн(ая|ой)\\s+оценк(а|и)\\s+условий\\s+труда"
        - "(?i)(доплат|компенсац)(а|ия)\\s+за\\s+(вредн|опасн)"
        - "(?i)(средств|сиз).*индивидуальн(ой|ые)\\s+защит"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по трудовому праву.
        Анализируется коллективный договор (ст. 147, 212–231 ТК РФ).
        Проверяется только один вопрос: охрана труда и вредные условия.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        [ЗАДАЧА]
        Найди в тексте договора:
        1. Мероприятия по охране труда и их финансирование.
        2. Обеспечение СИЗ.
        3. Результаты СОУТ / класс условий труда.
        4. Гарантии за вредные/опасные условия (доплата, молоко, ЛПП и т.п.).
        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если данные не указаны прямо — статусные поля возвращай "not_defined".
        3. Текстовые поля без значения — строго "Данные не определены".
        4. Верни РОВНО один валидный JSON-объект со всеми 9 ключами (8 полей + evidence),
           пригодный для парсинга через json.loads без предварительной обработки.
           Без markdown, без ```json, без комментариев, без текста до или после.
           Начни ответ сразу с { и закончи }.
        5. Не используй None, null или пустые строки.
        6. В evidence включай только текст договора.
        7. Не выводи нормы охраны труда из ТК РФ — только из текста договора.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 (полное определение):
        Фрагмент:
        "Финансирование охраны труда — не менее 0,2% от суммы затрат на производство.
        Работники обеспечиваются СИЗ в соответствии с типовыми нормами.
        По результатам СОУТ установлен класс условий труда 3.1. Работникам с вредными
        условиями труда — доплата 4% оклада, молоко и дополнительный отпуск 7 дней."
        Ответ:
        {
          "safety_measures_status": "defined",
          "safety_measures_details": "финансирование охраны труда — не менее 0,2% от суммы затрат на производство",
          "ppei_provision_status": "defined",
          "ppei_provision_details": "обеспечение СИЗ в соответствии с типовыми нормами",
          "sout_status_code": "defined",
          "sout_status_details": "класс условий труда 3.1 по результатам СОУТ",
          "hazardous_guarantees_status": "defined",
          "hazardous_guarantees_details": "доплата 4% оклада, молоко, дополнительный отпуск 7 дней",
          "evidence": [
            {
              "clause_ref": "п. 3.1",
              "quote": "Финансирование охраны труда — не менее 0,2% от суммы затрат на производство."
            },
            {
              "clause_ref": "п. 3.4",
              "quote": "Работникам с вредными условиями труда — доплата 4% оклада, молоко и дополнительный отпуск 7 дней."
            }
          ]
        }
        Пример 2 (частичное определение):
        Фрагмент:
        "Работодатель обеспечивает проведение СОУТ и выдачу СИЗ."
        Ответ:
        {
          "safety_measures_status": "not_defined",
          "safety_measures_details": "Данные не определены",
          "ppei_provision_status": "defined",
          "ppei_provision_details": "выдача СИЗ",
          "sout_status_code": "defined",
          "sout_status_details": "проведение СОУТ (результаты не указаны)",
          "hazardous_guarantees_status": "not_defined",
          "hazardous_guarantees_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 3.1",
              "quote": "Работодатель обеспечивает проведение СОУТ и выдачу СИЗ."
            }
          ]
        }
        Пример 3 (положения отсутствуют):
        Фрагмент:
        "Работодатель обеспечивает соблюдение трудовых прав работников."
        Ответ:
        {
          "safety_measures_status": "not_defined",
          "safety_measures_details": "Данные не определены",
          "ppei_provision_status": "not_defined",
          "ppei_provision_details": "Данные не определены",
          "sout_status_code": "not_defined",
          "sout_status_details": "Данные не определены",
          "hazardous_guarantees_status": "not_defined",
          "hazardous_guarantees_details": "Данные не определены",
          "evidence": []
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату об охране труда и её финансировании.
        2. Найди прямую цитату о СИЗ.
        3. Найди прямую цитату о СОУТ / классе условий труда.
        4. Найди прямую цитату о гарантиях за вредные условия.
        5. Если прямой цитаты нет — верни "not_defined". Не додумывай.
        6. Проверь, что все 9 ключей (8 полей + evidence) присутствуют в JSON.
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "safety_measures_status": "<defined / not_defined>",
          "safety_measures_details": "<текст или 'Данные не определены'>",
          "ppei_provision_status": "<defined / not_defined>",
          "ppei_provision_details": "<текст или 'Данные не определены'>",
          "sout_status_code": "<defined / not_defined>",
          "sout_status_details": "<текст или 'Данные не определены'>",
          "hazardous_guarantees_status": "<defined / not_defined>",
          "hazardous_guarantees_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 10
      temperature: 0.0
      max_tokens: 900

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "мероприятия по охране труда финансирование охраны труда средства индивидуальной защиты СИЗ специальная оценка условий труда СОУТ класс условий труда оздоровительные мероприятия медицинский осмотр доплата за вредность молоко лечебно-профилактическое питание сокращённая рабочая неделя гарантии за вредные условия"
      preferred_unit_types:
        - obligation
        - payment_term
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "индексация"
        - "профсоюзные взносы"
        - "забастовка"
        - "в целях настоящего"
      context_k: 10
      max_chunks: 14
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 800

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1300

      compact_output: false

      presence_signal:
        field: "occupational_safety_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по трудовому праву. Извлеки из коллективного договора
        сведения об охране труда и вредных условиях (ст. 147, 212–231 ТК РФ).
        Не анализируй рабочее время, отпуска или споры.
        </role>
        <context>
        {context}
        </context>
        <task>
        0. occupational_safety_check_presence: определи, есть ли в договоре фрагменты,
           касающиеся охраны труда, финансирования, СИЗ, СОУТ или гарантий
           за вредные/опасные условия.
           - "present" — есть хотя бы один фрагмент по теме (мероприятия, финансирование,
             СИЗ, СОУТ, доплата за вредность, молоко, ЛПП).
           - "missing" — фрагментов по теме нет вообще.
           - "unclear" — фрагменты есть, но противоречат друг другу и вывод невозможен.

        1. safety_measures_status — defined / not_defined.
        2. safety_measures_details — мероприятия по охране труда и финансирование.
        3. ppei_provision_status — defined / not_defined.
        4. ppei_provision_details — обеспечение СИЗ.
        5. sout_status_code — defined / not_defined.
        6. sout_status_details — результаты СОУТ / класс условий труда.
        7. hazardous_guarantees_status — defined / not_defined.
        8. hazardous_guarantees_details — гарантии за вредные/опасные условия.

        Если данные отсутствуют в тексте:
        - статус = "not_defined"
        - текстовое поле = "Данные не определены"
        </task>
        <context_rules>
        - occupational_safety_check_presence и все статусные поля попарно не
          пересекаются по значениям present/missing/unclear; их объединение покрывает
          все допустимые значения.
        - safety_measures_status: "defined" — мероприятия и/или финансирование охраны
          труда прямо указаны; "not_defined" — не указаны. В details фиксируй
          как мероприятия, так и источник финансирования (процент / сумма).
        - ppei_provision_status: "defined" — обеспечение СИЗ прямо указано;
          "not_defined" — не указано.
        - sout_status_code: "defined" — результаты СОУТ или класс условий труда
          прямо указаны; "not_defined" — не указаны.
        - hazardous_guarantees_status: "defined" — гарантии за вредные/опасные
          условия прямо указаны; "not_defined" — не указаны. В details фиксируй
          все гарантии: доплата, дополнительный отпуск, молоко, ЛПП, сокращённая
          рабочая неделя.
        - Не выводи нормы охраны труда из ТК РФ — только из текста договора.
        - Если хотя бы один из 4 статусов = "defined", то
          occupational_safety_check_presence = "present".
        - Если все статусы = "not_defined", то
          occupational_safety_check_presence = "missing".
        </context_rules>
        <edge_cases>
        1. Полное отсутствие фрагментов об охране труда, СИЗ, СОУТ и гарантиях
           за вредность → occupational_safety_check_presence = "missing",
           все статусы = "not_defined".
        2. Частичное покрытие (только СИЗ и СОУТ без финансирования и гарантий
           за вредность) → presence = "present", ppei_provision_status = "defined",
           sout_status_code = "defined", остальные = "not_defined".
        3. Все четыре аспекта раскрыты (финансирование 0,2% + СИЗ + СОУТ 3.1 +
           доплата 4% и молоко) → presence = "present", все статусы = "defined".
        4. Противоречие: в одном разделе «доплата за вредность 4%», в другом —
           «доплаты за вредные условия не предусмотрены в связи с отсутствием
           рабочих мест с классом 3.1 и выше» → presence = "unclear",
           hazardous_guarantees_status = "not_defined" с пояснением в details.
        </edge_cases>
        <output_expectations>
        - Все 9 полей (1 presence + 8 substantive) обязательны.
        - Статусные поля возвращают только значения из allowed_values.
        - Текстовые поля без данных — строго "Данные не определены".
        - Не используй None, null или пустые строки.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "occupational_safety_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие фрагментов об охране труда и вредных условиях."
          required: true
        - name: "safety_measures_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус мероприятий по охране труда. Внутреннее enum-поле."
          required: true
        - name: "safety_measures_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Охрана труда"
          description: >
            Мероприятия по охране труда и финансирование. Fallback: "Не установлено" / "Не удалось определить".
          required: false
        - name: "ppei_provision_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус обеспечения СИЗ. Внутреннее enum-поле."
          required: true
        - name: "ppei_provision_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "СИЗ"
          description: >
            Обеспечение средствами индивидуальной защиты. Fallback: "Не установлено" / "Не удалось определить".
          required: false
        - name: "sout_status_code"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус СОУТ / класса условий труда. Внутреннее enum-поле."
          required: true
        - name: "sout_status_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "СОУТ / класс условий труда"
          description: >
            Результаты СОУТ / класс условий труда. Fallback: "Не установлено" / "Не удалось определить".
          required: false
        - name: "hazardous_guarantees_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус гарантий за вредные/опасные условия. Внутреннее enum-поле."
          required: true
        - name: "hazardous_guarantees_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Гарантии за вредные условия"
          description: >
            Гарантии за вредные/опасные условия труда (доплата, молоко, ЛПП и т.п.). Fallback: "Не установлено" / "Не удалось определить".
          required: false

      store_payload: true

  - id: collective_agreement_content_scope
    name: "Обязательные разделы коллективного договора (ст. 41 ТК РФ)"
    description: >
      Фактографическая проверка присутствия в коллективном договоре обязательств
      по каноническим темам ст. 41 ТК РФ: оплата труда, занятость, рабочее время,
      охрана труда, социальные гарантии, обучение.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 140

    rules:
      keywords:
        - "оплата труда"
        - "формы и системы оплаты труда"
        - "занятость"
        - "переобучение"
        - "рабочее время"
        - "время отдыха"
        - "охрана труда"
        - "условия труда"
        - "социальные гарантии"
        - "льготы"
        - "компенсации"
        - "обучение"
        - "повышение квалификации"
        - "оздоровление"
        - "экологическая безопасность"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(систем|форм)ы?\\s+оплаты\\s+труда"
        - "(?i)охрана\\s+труда\\s+и\\s+безопасн"
        - "(?i)(социальн|льгот|компенсац)"
        - "(?i)(повышение\\s+квалификаци|переподготовк|обучение)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по трудовому праву.
        Анализируется коллективный договор (ст. 41 ТК РФ).
        Проверяется только один вопрос: присутствие обязательных разделов
        и обязательств по каноническим темам ст. 41 ТК РФ.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        [ЗАДАЧА]
        Найди в тексте договора обязательства по темам:
        1. Оплата труда (формы, системы, размеры, индексация).
        2. Занятость и переобучение.
        3. Рабочее время и время отдыха.
        4. Охрана труда и условия труда.
        5. Социальные гарантии, льготы, компенсации.
        6. Обучение, повышение квалификации, оздоровление.
        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если данные не указаны прямо — статусные поля возвращай "not_defined".
        3. Текстовые поля без значения — строго "Данные не определены".
        4. Верни РОВНО один валидный JSON-объект со всеми 9 ключами (8 полей + evidence),
           пригодный для парсинга через json.loads без предварительной обработки.
           Без markdown, без ```json, без комментариев, без текста до или после.
           Начни ответ сразу с { и закончи }.
        5. Не используй None, null или пустые строки.
        6. В evidence включай только текст договора.
        7. Для каждой темы:
           - "defined" — есть конкретные обязательства;
           - "declarative" — только общая декларация без конкретики;
           - "not_defined" — тема не упомянута.
        8. overall_completeness_status:
           - "complete" — все 6 тем со статусом "defined";
           - "partial" — 4–5 тем со статусом "defined";
           - "minimal" — 3 и менее тем со статусом "defined";
           - "not_defined" — ни одна тема не раскрыта.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 (полное покрытие):
        Фрагмент:
        "Работодатель устанавливает системы оплаты труда, индексирует заработную плату,
        обеспечивает занятость и переобучение, устанавливает режим рабочего времени
        и отпуска, организует охрану труда, предоставляет социальные гарантии,
        оплачивает повышение квалификации."
        Ответ:
        {
          "payment_obligations_status": "defined",
          "employment_obligations_status": "defined",
          "worktime_obligations_status": "defined",
          "safety_obligations_status": "defined",
          "social_obligations_status": "defined",
          "educational_obligations_status": "defined",
          "overall_completeness_status": "complete",
          "missing_sections_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "Работодатель устанавливает системы оплаты труда, индексирует заработную плату, обеспечивает занятость и переобучение."
            }
          ]
        }
        Пример 2 (частичное покрытие):
        Фрагмент:
        "Работодатель обеспечивает оплату труда и охрану труда. Социальные
        гарантии предоставляются в соответствии с ТК РФ."
        Ответ:
        {
          "payment_obligations_status": "declarative",
          "employment_obligations_status": "not_defined",
          "worktime_obligations_status": "not_defined",
          "safety_obligations_status": "declarative",
          "social_obligations_status": "declarative",
          "educational_obligations_status": "not_defined",
          "overall_completeness_status": "minimal",
          "missing_sections_details": "занятость и переобучение; рабочее время и время отдыха; обучение и повышение квалификации",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "Работодатель обеспечивает оплату труда и охрану труда."
            }
          ]
        }
        Пример 3 (минимальное покрытие):
        Фрагмент:
        "Стороны обязуются соблюдать трудовое законодательство."
        Ответ:
        {
          "payment_obligations_status": "not_defined",
          "employment_obligations_status": "not_defined",
          "worktime_obligations_status": "not_defined",
          "safety_obligations_status": "not_defined",
          "social_obligations_status": "not_defined",
          "educational_obligations_status": "not_defined",
          "overall_completeness_status": "not_defined",
          "missing_sections_details": "оплата труда; занятость и переобучение; рабочее время и время отдыха; охрана труда; социальные гарантии; обучение",
          "evidence": []
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату по каждой из 6 тем ст. 41 ТК РФ.
        2. Разграничь concrete / declarative.
        3. Если прямой цитаты нет — верни "not_defined". Не додумывай.
        4. Проверь, что все 9 ключей (8 полей + evidence) присутствуют в JSON.
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "payment_obligations_status": "<defined / declarative / not_defined>",
          "employment_obligations_status": "<defined / declarative / not_defined>",
          "worktime_obligations_status": "<defined / declarative / not_defined>",
          "safety_obligations_status": "<defined / declarative / not_defined>",
          "social_obligations_status": "<defined / declarative / not_defined>",
          "educational_obligations_status": "<defined / declarative / not_defined>",
          "overall_completeness_status": "<complete / partial / minimal / not_defined>",
          "missing_sections_details": "<перечень или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 10
      temperature: 0.0
      max_tokens: 900

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "оплата труда формы и системы оплаты труда занятость переобучение рабочее время время отдыха охрана труда условия труда социальные гарантии льготы компенсации обучение повышение квалификации оздоровление экологическая безопасность"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "профсоюзные взносы"
        - "забастовка"
        - "в целях настоящего"
      context_k: 10
      max_chunks: 14
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 800

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1400

      compact_output: false

      presence_signal:
        field: "collective_agreement_content_scope_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по трудовому праву. Проверь присутствие обязательств
        по 6 каноническим темам ст. 41 ТК РФ.
        Не оценивай качество обязательств, только факт присутствия.
        </role>
        <context>
        {context}
        </context>
        <task>
        0. collective_agreement_content_scope_presence: определи, есть ли в договоре
           фрагменты, касающиеся хотя бы одной из 6 канонических тем ст. 41 ТК РФ
           (оплата труда, занятость, рабочее время, охрана труда, социальные
           гарантии, обучение).
           - "present" — есть хотя бы один фрагмент по любой из 6 тем.
           - "missing" — фрагментов по всем 6 темам нет вообще.
           - "unclear" — фрагменты есть, но противоречат друг другу и вывод невозможен.

        1. payment_obligations_status — defined / declarative / not_defined.
        2. employment_obligations_status — defined / declarative / not_defined.
        3. worktime_obligations_status — defined / declarative / not_defined.
        4. safety_obligations_status — defined / declarative / not_defined.
        5. social_obligations_status — defined / declarative / not_defined.
        6. educational_obligations_status — defined / declarative / not_defined.
        7. overall_completeness_status — complete / partial / minimal / not_defined.
        8. missing_sections_details — перечень отсутствующих тем.

        Если данные отсутствуют в тексте:
        - статус = "not_defined"
        - текстовое поле = "Данные не определены"
        </task>
        <context_rules>
        - collective_agreement_content_scope_presence и все статусные поля попарно
          не пересекаются по значениям present/missing/unclear; их объединение
          покрывает все допустимые значения.
        - Для каждой из 6 тем: "defined" — есть конкретные обязательства;
          "declarative" — только общая декларация без конкретики;
          "not_defined" — тема не упомянута.
        - overall_completeness_status: "complete" — все 6 тем = "defined";
          "partial" — 4–5 тем = "defined"; "minimal" — ≤3 тем = "defined"
          (но хотя бы одна); "not_defined" — ни одна тема не раскрыта.
        - В missing_sections_details перечисли темы со статусом "not_defined"
          через точку с запятой.
        - Если хотя бы один из 6 тематических статусов ∈ {defined, declarative}, то
          collective_agreement_content_scope_presence = "present".
        - Если все 6 тематических статусов = "not_defined", то
          collective_agreement_content_scope_presence = "missing".
        </context_rules>
        <edge_cases>
        1. Полное отсутствие фрагментов по всем 6 темам ст. 41 ТК РФ →
           collective_agreement_content_scope_presence = "missing",
           все статусы = "not_defined", overall = "not_defined".
        2. Частичное покрытие (оплата труда + охрана труда = defined, остальные
           not_defined) → presence = "present", overall = "minimal",
           missing_sections_details перечисляет 4 отсутствующие темы.
        3. Все 6 тем раскрыты с конкретными обязательствами →
           presence = "present", все тематические = "defined",
           overall = "complete", missing = "Данные не определены".
        4. Противоречие: в преамбуле «договор охватывает все вопросы ст. 41 ТК РФ»,
           но по факту раскрыты только 2 темы → presence = "present",
           overall = "minimal" (фактическое покрытие, а не декларация),
           missing перечисляет 4 фактически отсутствующие темы.
        </edge_cases>
        <output_expectations>
        - Все 9 полей (1 presence + 8 substantive) обязательны.
        - Статусные поля возвращают только значения из allowed_values.
        - Текстовые поля без данных — строго "Данные не определены".
        - Не используй None, null или пустые строки.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "collective_agreement_content_scope_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие фрагментов по каноническим темам ст. 41 ТК РФ."
          required: true
        - name: "payment_obligations_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "declarative", "not_defined"]
          description: "Статус обязательств по оплате труда. Внутреннее enum-поле."
          required: true
        - name: "employment_obligations_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "declarative", "not_defined"]
          description: "Статус обязательств по занятости и переобучению. Внутреннее enum-поле."
          required: true
        - name: "worktime_obligations_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "declarative", "not_defined"]
          description: "Статус обязательств по рабочему времени и времени отдыха. Внутреннее enum-поле."
          required: true
        - name: "safety_obligations_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "declarative", "not_defined"]
          description: "Статус обязательств по охране труда. Внутреннее enum-поле."
          required: true
        - name: "social_obligations_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "declarative", "not_defined"]
          description: "Статус обязательств по социальным гарантиям. Внутреннее enum-поле."
          required: true
        - name: "educational_obligations_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "declarative", "not_defined"]
          description: "Статус обязательств по обучению. Внутреннее enum-поле."
          required: true
        - name: "overall_completeness_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["complete", "partial", "minimal", "not_defined"]
          description: "Общая полнота обязательных разделов. Внутреннее enum-поле."
          required: true
        - name: "missing_sections_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Отсутствующие разделы"
          description: >
            Перечень отсутствующих обязательных тем ст. 41 ТК РФ. Fallback: "Не установлено" / "Не удалось определить".
          required: false

      store_payload: true

  - id: remuneration_system_check
    name: "Системы оплаты труда, надбавки и даты выплат (ст. 41, 129–144, 136 ТК РФ)"
    description: >
      Фактографическая проверка систем оплаты труда, конкретных размеров
      (оклады, надбавки, премии), сроков и дат выплаты, соответствия МРОТ.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 150

    rules:
      keywords:
        - "система оплаты труда"
        - "формы оплаты труда"
        - "оклад"
        - "тарифная ставка"
        - "надбавка"
        - "доплата"
        - "премия"
        - "вознаграждение"
        - "районный коэффициент"
        - "сроки выплаты"
        - "даты выплаты"
        - "аванс"
        - "МРОТ"
        - "минимальный размер оплаты труда"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(систем|форм)ы?\\s+оплаты\\s+труда"
        - "(?i)(оклад|тарифн(ая|ой)\\s+ставк)\\s+в\\s+размере"
        - "(?i)(надбавк|доплат|преми)ю?\\s+в\\s+размере"
        - "(?i)выплачивается\\s+(не\\s+позднее|\\d{1,2}\\s+числа)"
        - "(?i)МРОТ|минимальн(ый|ого)\\s+размер(а)?\\s+оплаты\\s+труда"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по трудовому праву.
        Анализируется коллективный договор (ст. 41, 129–144, 136 ТК РФ).
        Проверяется только один вопрос: системы оплаты труда, надбавки, даты выплат.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        [ЗАДАЧА]
        Найди в тексте договора:
        1. Указаны ли системы и формы оплаты труда.
        2. Конкретные размеры: оклады, тарифные ставки.
        3. Надбавки, доплаты, премии с размерами.
        4. Сроки и даты выплаты заработной платы (ст. 136 ТК РФ).
        5. Упоминание МРОТ / регионального соглашения.
        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если данные не указаны прямо — статусные поля возвращай "not_defined".
        3. Текстовые поля без значения — строго "Данные не определены".
        4. Верни РОВНО один валидный JSON-объект со всеми 10 ключами (9 полей + evidence),
           пригодный для парсинга через json.loads без предварительной обработки.
           Без markdown, без ```json, без комментариев, без текста до или после.
           Начни ответ сразу с { и закончи }.
        5. Не используй None, null или пустые строки.
        6. В evidence включай только текст договора.
        7. remuneration_system_status:
           - "defined" — системы/формы оплаты прямо указаны;
           - "declarative" — только декларация без конкретики;
           - "not_defined" — не раскрыто.
        8. salary_amounts_status / bonuses_and_allowances_status:
           - "defined" — у большинства категорий есть размеры;
           - "partial" — у части есть конкретика;
           - "not_defined" — размеры не указаны.
        9. payment_dates_status: "defined" — есть сроки/даты (не реже 2 раз в месяц);
           "not_defined" — не указаны.
        10. mrot_compliance_status: "defined" — есть упоминание МРОТ/регионального соглашения;
            "not_defined" — нет.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 (полное определение):
        Фрагмент:
        "Работодатель применяет повременно-премиальную систему оплаты труда.
        Оклад менеджера — 60 000 рублей, инженера — 70 000 рублей. За выслугу лет —
        надбавка 10% оклада. Премия — до 30% оклада ежемесячно. Заработная плата
        выплачивается 5 и 20 числа каждого месяца. Оклады не ниже МРОТ."
        Ответ:
        {
          "remuneration_system_status": "defined",
          "remuneration_system_details": "повременно-премиальная система оплаты труда",
          "salary_amounts_status": "defined",
          "salary_amounts_details": "менеджер — 60 000 руб.; инженер — 70 000 руб.",
          "bonuses_and_allowances_status": "defined",
          "bonuses_and_allowances_details": "надбавка за выслугу 10% оклада; премия до 30% оклада ежемесячно",
          "payment_dates_status": "defined",
          "payment_dates_details": "5 и 20 числа каждого месяца",
          "mrot_compliance_status": "defined",
          "evidence": [
            {
              "clause_ref": "п. 3.1",
              "quote": "Работодатель применяет повременно-премиальную систему оплаты труда."
            }
          ]
        }
        Пример 2 (частичное определение):
        Фрагмент:
        "Работодатель устанавливает сдельную оплату труда, а также выплачивает
        премии по итогам работы."
        Ответ:
        {
          "remuneration_system_status": "defined",
          "remuneration_system_details": "сдельная оплата труда",
          "salary_amounts_status": "not_defined",
          "salary_amounts_details": "Данные не определены",
          "bonuses_and_allowances_status": "declarative",
          "bonuses_and_allowances_details": "премии по итогам работы (без конкретных размеров)",
          "payment_dates_status": "not_defined",
          "payment_dates_details": "Данные не определены",
          "mrot_compliance_status": "not_defined",
          "evidence": [
            {
              "clause_ref": "п. 3.1",
              "quote": "Работодатель устанавливает сдельную оплату труда, а также выплачивает премии по итогам работы."
            }
          ]
        }
        Пример 3 (не раскрыто):
        Фрагмент:
        "Оплата труда производится в соответствии с ТК РФ."
        Ответ:
        {
          "remuneration_system_status": "declarative",
          "remuneration_system_details": "оплата труда в соответствии с ТК РФ",
          "salary_amounts_status": "not_defined",
