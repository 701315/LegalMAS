  - id: working_hours_and_leave_check
    name: "Рабочее время и отпуска (ст. 92, 117 ТК РФ)"
    description: >
      Фактографическая проверка положений о режиме рабочего времени, продолжительности
      ежегодного отпуска и дополнительных отпусках (в т.ч. за вредные условия труда).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 120

    rules:
      keywords:
        - "рабочее время"
        - "режим работы"
        - "ежегодный отпуск"
        - "дополнительный отпуск"
        - "перерыв для отдыха"
        - "выходные дни"
        - "нерабочие праздничные дни"
        - "сокращённое рабочее время"
        - "неполное рабочее время"
        - "график сменности"
        - "отпуск за вредные условия"
        - "28 календарных дней"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)ежегодн(ый|ого)\\s+(оплачиваем(ый|ого)|дополнительн(ый|ого))\\s+отпуск"
        - "(?i)режим\\s+рабочего\\s+времени"
        - "(?i)\\d+\\s*час(ов|а|)\\s+в\\s+неделю"
        - "(?i)\\d+\\s*календарн(ых|ые)\\s+дн(ей|я)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по трудовому праву.
        Анализируется коллективный договор (ст. 92, 117 ТК РФ).
        Проверяется только один вопрос: рабочее время и отпуска.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        [ЗАДАЧА]
        Найди в тексте договора:
        1. Режим рабочего времени (норма часов в неделю, сменность, сокращённое/неполное время).
        2. Продолжительность ежегодного основного оплачиваемого отпуска.
        3. Дополнительные отпуска (в т.ч. за вредные условия труда).
        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если данные не указаны прямо — статусные поля возвращай "not_defined".
        3. Текстовые поля без значения — строго "Данные не определены".
        4. Верни РОВНО один валидный JSON-объект со всеми 7 ключами (6 полей + evidence),
           пригодный для парсинга через json.loads без предварительной обработки.
           Без markdown, без ```json, без комментариев, без текста до или после.
           Начни ответ сразу с { и закончи }.
        5. Не используй None, null или пустые строки.
        6. В evidence включай только текст договора.
        7. Не выводи нормы рабочего времени из ТК РФ — только из текста договора.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 (полное определение):
        Фрагмент:
        "Рабочее время — 40 часов в неделю. Ежегодный отпуск — 28 календарных дней.
        Работникам с вредными условиями труда — дополнительный отпуск 7 дней."
        Ответ:
        {
          "working_hours_status": "defined",
          "working_hours_details": "40 часов в неделю",
          "annual_leave_status": "defined",
          "annual_leave_details": "28 календарных дней",
          "additional_leave_status": "defined",
          "additional_leave_details": "дополнительный отпуск 7 дней за вредные условия",
          "evidence": [
            {
              "clause_ref": "п. 2.1",
              "quote": "Рабочее время — 40 часов в неделю. Ежегодный отпуск — 28 календарных дней."
            }
          ]
        }
        Пример 2 (частичное определение):
        Фрагмент:
        "Работникам устанавливается 40-часовая рабочая неделя."
        Ответ:
        {
          "working_hours_status": "defined",
          "working_hours_details": "40-часовая рабочая неделя",
          "annual_leave_status": "not_defined",
          "annual_leave_details": "Данные не определены",
          "additional_leave_status": "not_defined",
          "additional_leave_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 2.1",
              "quote": "Работникам устанавливается 40-часовая рабочая неделя."
            }
          ]
        }
        Пример 3 (положения отсутствуют):
        Фрагмент:
        "Работодатель обеспечивает соблюдение трудовых прав работников."
        Ответ:
        {
          "working_hours_status": "not_defined",
          "working_hours_details": "Данные не определены",
          "annual_leave_status": "not_defined",
          "annual_leave_details": "Данные не определены",
          "additional_leave_status": "not_defined",
          "additional_leave_details": "Данные не определены",
          "evidence": []
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о рабочем времени.
        2. Найди прямую цитату о ежегодном отпуске.
        3. Найди прямую цитату о дополнительных отпусках.
        4. Если прямой цитаты нет — верни "not_defined". Не додумывай.
        5. Проверь, что все 7 ключей (6 полей + evidence) присутствуют в JSON.
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "working_hours_status": "<defined / not_defined>",
          "working_hours_details": "<текст или 'Данные не определены'>",
          "annual_leave_status": "<defined / not_defined>",
          "annual_leave_details": "<текст или 'Данные не определены'>",
          "additional_leave_status": "<defined / not_defined>",
          "additional_leave_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 700

    retrieval:
      retrieval_profile: "employment_schedule_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "рабочее время режим работы ежегодный отпуск дополнительный отпуск перерыв для отдыха выходные дни нерабочие праздничные дни сокращённое рабочее время неполное рабочее время график сменности отпуск за вредные условия"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "индексация"
        - "профсоюзные взносы"
        - "забастовка"
        - "в целях настоящего"
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 800

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1100

      compact_output: false

      presence_signal:
        field: "working_hours_and_leave_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по трудовому праву. Извлеки из коллективного договора
        сведения о рабочем времени и отпусках (ст. 92, 117 ТК РФ).
        Не анализируй охрану труда, вредные условия или споры.
        </role>
        <context>
        {context}
        </context>
        <task>
        0. working_hours_and_leave_check_presence: определи, есть ли в договоре
           фрагменты, касающиеся режима рабочего времени, ежегодного отпуска
           или дополнительных отпусков.
           - "present" — есть хотя бы один фрагмент по теме (рабочее время,
             ежегодный отпуск, дополнительный отпуск, сменность).
           - "missing" — фрагментов по теме нет вообще.
           - "unclear" — фрагменты есть, но противоречат друг другу и вывод невозможен.

        1. working_hours_status — defined / not_defined.
        2. working_hours_details — режим рабочего времени.
        3. annual_leave_status — defined / not_defined.
        4. annual_leave_details — продолжительность ежегодного отпуска.
        5. additional_leave_status — defined / not_defined.
        6. additional_leave_details — дополнительные отпуска.

        Если данные отсутствуют в тексте:
        - статус = "not_defined"
        - текстовое поле = "Данные не определены"
        </task>
        <context_rules>
        - working_hours_and_leave_check_presence и все статусные поля попарно не
          пересекаются по значениям present/missing/unclear; их объединение покрывает
          все допустимые значения.
        - working_hours_status: "defined" — режим рабочего времени прямо указан
          (норма часов, сменность, сокращённое/неполное время);
          "not_defined" — не указан. Не выводи нормы из ТК РФ.
        - annual_leave_status: "defined" — продолжительность ежегодного отпуска
          прямо указана; "not_defined" — не указана.
        - additional_leave_status: "defined" — дополнительные отпуска прямо
          указаны (в т.ч. за вредные условия); "not_defined" — не указаны.
          В details фиксируй все дополнительные отпуска, в т.ч. за вредные
          условия труда (минимум 7 к.д. по ст. 117 ТК РФ).
        - Если хотя бы один из 3 статусов = "defined", то
          working_hours_and_leave_check_presence = "present".
        - Если все статусы = "not_defined", то
          working_hours_and_leave_check_presence = "missing".
        </context_rules>
        <edge_cases>
        1. Полное отсутствие фрагментов о рабочем времени и отпусках →
           working_hours_and_leave_check_presence = "missing",
           все статусы = "not_defined".
        2. Только рабочее время («40 часов в неделю») без отпусков →
           presence = "present", working_hours_status = "defined",
           annual_leave_status = "not_defined", additional_leave_status = "not_defined".
        3. Все три аспекта раскрыты (40 ч/нед + 28 к.д. + доп. отпуск 7 дней
           за вредные условия) → presence = "present", все статусы = "defined".
        4. Противоречие: в одном разделе «рабочее время — 40 часов в неделю»,
           в другом — «36 часов в неделю для всех работников» →
           presence = "unclear", working_hours_status = "not_defined"
           с пояснением в details.
        </edge_cases>
        <output_expectations>
        - Все 7 полей (1 presence + 6 substantive) обязательны.
        - Статусные поля возвращают только значения из allowed_values.
        - Текстовые поля без данных — строго "Данные не определены".
        - Не используй None, null или пустые строки.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "working_hours_and_leave_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие фрагментов о рабочем времени и отпусках."
          required: true
        - name: "working_hours_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус режима рабочего времени."
          required: true
        - name: "working_hours_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Рабочее время"
          description: "Режим рабочего времени."
          required: false
        - name: "annual_leave_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус ежегодного отпуска."
          required: true
        - name: "annual_leave_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Ежегодный отпуск"
          description: "Продолжительность ежегодного отпуска."
          required: false
        - name: "additional_leave_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус дополнительных отпусков."
          required: true
        - name: "additional_leave_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Дополнительные отпуска"
          description: "Дополнительные отпуска (в т.ч. за вредные условия)."
          required: false

      store_payload: true

  - id: occupational_safety_check
