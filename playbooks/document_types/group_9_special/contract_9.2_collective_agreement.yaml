        weight: -0.3
        description: "Договор подряда — ГПХ, а не коллективный договор"

      - pattern: "(?i)договор\\s+возмездн[оа]го\\s+оказани[яя]\\s+услуг"
        severity: soft
        weight: -0.3
        description: "Договор возмездного оказания услуг относится к ГПХ, а не к коллективным договорам"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 2: ТРИГГЕРЫ
#  Читается: TriggerDetector → doc.applicable_triggers
# ════════════════════════════════════════════════════════════════════════════

trigger_definitions:

  union_representative:
    any_keywords:
      - "(?i)\\bпрофсоюз\\b"
      - "(?i)первичн[а-яё]+\\s+профсоюзн[а-яё]+\\s+организаци[яя]"
      - "(?i)профсоюзн[ыо]й\\s+комитет"
      - "(?i)\\bпрофком\\b"
      - "(?i)председател[ья]\\s+профсоюз[аа]"
      - "(?i)ФЗ\\s+о\\s+профсоюзах"

  elected_representative:
    any_keywords:
      - "(?i)избранн[ыо]е\\s+представител[ии]"
      - "(?i)ин[оа]й\\s+представительн[ыо]й\\s+орган"
      - "(?i)общее\\s+собрани[ее]\\s+работник[оо]в"
      - "(?i)конференци[яя]\\s+работник[оо]в"
      - "(?i)совет\\s+трудов[оа]го\\s+коллектив[аа]"

  commercial_employer:
    any_keywords:
      - "(?i)\\bООО\\b"
      - "(?i)\\bАО\\b"
      - "(?i)\\bПАО\\b"
      - "(?i)\\bЗАО\\b"
      - "(?i)акционерн[оа]е\\s+обществ[оо]"
      - "(?i)обществ[оо]\\s+с\\s+ограниченн[оа]й\\s+ответственност[ьюи]"
      - "(?i)коммерческ[а-яё]+\\s+организаци[яя]"
      - "(?i)предпринимательск[а-яё]+\\s+деятельност[ьи]"

  budget_employer:
    any_keywords:
      - "(?i)бюджетн[оа]е\\s+учреждени[ее]"
      - "(?i)каз[её]нн[оа]е\\s+учреждени[ее]"
      - "(?i)автономн[оа]е\\s+учреждени[ее]"
      - "(?i)государственн[оа]е\\s+учреждени[ее]"
      - "(?i)муниципальн[оа]е\\s+учреждени[ее]"
      - "(?i)финансировани[ее]\\s+из\\s+бюджет[аа]"

  branch_subdivision:
    any_keywords:
      - "(?i)\\bфилиал\\b"
      - "(?i)\\bпредставительств[оо]\\b"
      - "(?i)обособленн[оа]е\\s+структурн[оа]е\\s+подразделени[ее]"
      - "(?i)обособленн[оа]е\\s+подразделени[ее]"

  hazardous_conditions:
    any_keywords:
      - "(?i)вредн[ыо]е\\s+услови[яя]\\s+труда"
      - "(?i)опасн[ыо]е\\s+услови[яя]\\s+труда"
      - "(?i)класс\\s+услови[йя]\\s+труда\\s*3"
      - "(?i)класс\\s+услови[йя]\\s+труда\\s*4"
      - "(?i)\\bСОУТ\\b"
      - "(?i)специальн[а-яё]+\\s+оценк[аа]\\s+услови[йя]\\s+труда"
      - "(?i)доплат[аа]\\s+за\\s+вредност[ььи]"
      - "(?i)молок[оо]\\s+за\\s+вредност[ььи]"
      - "(?i)дополнительн[ыо]й\\s+отпуск\\s+за\\s+вредност[ььи]"

  reorganization_context:
    any_keywords:
      - "(?i)реорганизаци[яя]"
      - "(?i)слияни[ее]"
      - "(?i)присоединени[ее]"
      - "(?i)разделени[ее]"
      - "(?i)выделени[ее]"
      - "(?i)преобразовани[ее]"
      - "(?i)смен[аа]\\s+собственник[аа]"
      - "(?i)правопреемник"
      - "(?i)ликвидаци[яя]"

  strike_risk_context:
    any_keywords:
      - "(?i)\\bзабастовк[аа]\\b"
      - "(?i)коллективн[ыо]й\\s+трудов[оа]й\\s+спор"
      - "(?i)примирительн[а-яё]+\\s+комисси[яя]"
      - "(?i)трудов[оа]й\\s+арбитраж"
      - "(?i)\\bпосредник\\b"
      - "(?i)прав[оо]\\s+на\\s+забастовк[уу]"

  foreign_employer:
    any_keywords:
      - "(?i)иностранн[а-яё]+\\s+компани[яя]"
      - "(?i)представительств[оо]\\s+иностранн[оа]й"
      - "(?i)филиал\\s+иностранн[оа]й"
      - "(?i)\\bнерезидент\\b"
      - "(?i)иностранн[ыо]й\\s+работодатель"

  multiple_unions:
    any_keywords:
      - "(?i)несколько\\s+профсоюз[оо]в"
      - "(?i)бол[её]е\\s+одн[оа]й\\s+профсоюзн[оа]й\\s+организаци[ии]"
      - "(?i)един[ыо]й\\s+представительн[ыо]й\\s+орган"
      - "(?i)пропорциональн[оа]е\\s+представительств[оо]"
      - "(?i)ст\\.\\s*37\\s*ТК\\s*РФ"

  shift_work_context:
    any_keywords:
      - "(?i)сменн[а-яё]+\\s+работ[аа]"
      - "(?i)график\\s+сменност[ии]"
      - "(?i)суммированн[ыо]й\\s+уч[её]т\\s+рабоч[ео]го\\s+времен[ии]"
      - "(?i)вахтов[ыо]й\\s+метод"
      - "(?i)ночн[а-яё]+\\s+смен[аа]"
        
  remote_work_context:
    any_keywords:
      - "(?i)дистанционн[а-яё]+\\s+работ[аа]"
      - "(?i)удал[её]нн[а-яё]+\\s+работ[аа]"
      - "(?i)дистанционн[ыо]й\\s+работник"
      - "(?i)гибридн[ыо]й\\s+режим"
      - "(?i)компенсаци[яя]\\s+за\\s+использовани[ее]\\s+личн[оа]го\\s+оборудовани[яя]"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 3: SHARED PATTERNS
#  Читается: DocTypeCheckLoader через _resolve_yaml_templates()
# ════════════════════════════════════════════════════════════════════════════

shared_patterns:

  term_years: "(?i)\\b(?:на\\s+срок|сроком)\\s+(?:на\\s+)?\\d+\\s*(?:год|лет|года)\\b"
  money_amount: "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|тыс|млн|процент|%)"
  date_pattern: "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"
  article_tk_ref: "(?i)ст\\.?\\s*\\d+\\s*ТК\\s*РФ"
  inn_pattern: "(?i)\\bИНН\\s*\\d{10,12}\\b"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: COMPLIANCE RULES
#  Читается: DocTypeCheckLoader._exclusion_logic_to_checks()
# ════════════════════════════════════════════════════════════════════════════

compliance_rules:

  - id: "worsening_conditions_prohibition"
    name: "Запрет ухудшения положения работников (ст. 9, 50 ТК РФ)"
    description: |
      Условия коллективного договора, ухудшающие положение работников по сравнению с трудовым
      законодательством, являются недействительными и не подлежат применению.
      При уведомительной регистрации орган по труду обязан сообщить сторонам о выявленных нарушениях.
    legal_base: "ст. 9, 50 ТК РФ"
    required_triggers: []
    severity: "critical"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      keywords:
        - "взамен гарантий"
        - "отказ от права"
        - "снижение гарантий"
        - "ниже установленного ТК"
        - "отменяет действие ТК"
        - "заменяет нормы ТК"
        - "отпуск менее 28 календарных дней"
        - "оплата ниже МРОТ"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "ухудшение положения"
        - "снижение гарантий"
        - "отменяет нормы"
      rerank: true

  - id: "term_exceeds_three_years"
    name: "Превышение максимального срока 3 года (ст. 43 ТК РФ)"
    description: |
      Коллективный договор заключается на срок не более трёх лет. Условие о большем сроке
      ничтожно. Договор может быть продлён на срок не более трёх лет.
    legal_base: "ст. 43 ТК РФ"
    required_triggers: []
    severity: "critical"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      keywords:
        - "сроком на 4 года"
        - "сроком на 5 лет"
        - "сроком на 6 лет"
        - "сроком на 7 лет"
        - "сроком на 10 лет"
        - "бессрочный"
        - "на неопределённый срок"
      keyword_mode: "any"
    retrieval:
      context_k: 3
      boost_keywords:
        - "срок действия"
        - "сроком на"
        - "заключён на"
      rerank: true

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 5: CHECKS_V8 — LLM/hybrid проверки
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  - id: parties_and_representatives_extraction
    name: "Извлечение сторон и их представителей"
    description: |
      Извлекает наименование работодателя, представительный орган работников,
      уполномоченных лиц и документы, подтверждающие полномочия.
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "работодатель"
        - "представители работников"
        - "профсоюзная организация"
        - "профком"
        - "избранные представители"
        - "общее собрание работников"
        - "конференция работников"
        - "в лице"
        - "действующего на основании"
        - "уполномоченный представитель"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(работодатель|работники)\\s+в\\s+лице"
        - "(?i)действующ(его|ей)\\s+на\\s+основании"
        - "(?i)протокол\\s+(общего\\s+)?собрания"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий коллективный договор.
        Найди в тексте стороны коллективного договора и их представителей.

        Ответь строго в JSON:
        {
          "employer_name": "<наименование работодателя или not_found>",
          "employer_type": "<legal_entity / individual_entrepreneur / not_found>",
          "employer_representative": "<ФИО и должность представителя работодателя или not_found>",
          "employer_authority_doc": "<документ, подтверждающий полномочия представителя работодателя, или not_found>",
          "employee_representative_body": "<наименование представительного органа работников или not_found>",
          "employee_representative_type": "<union / elected / council / other / not_found>",
          "employee_representative_person": "<ФИО и должность представителя работников или not_found>",
          "employee_authority_doc": "<документ, подтверждающий полномочия представителя работников, или not_found>"
        }

        ВАЖНО: Если значение явно не указано в тексте — пиши "not_found".
      prompt_file: null
      context_k: 6
      temperature: 0.0
      max_tokens: 600
    retrieval:
      retrieval_profile: "party_identification_check"
      context_k: 6
      max_chunks: 10
      boost_keywords:
        - "работодатель"
        - "представители работников"
        - "профсоюз"
        - "в лице"
        - "на основании"
        - "полномочия"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 50
      max_snippet_length: 800
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "employer_name"
          type: "string"
          keyword_hints: ["работодатель", "организация", "ООО", "АО", "ИП"]
          description: "Наименование работодателя"
        - name: "employer_type"
          type: "string"
          allowed_values: ["legal_entity", "individual_entrepreneur", "not_found"]
          description: "Тип работодателя"
        - name: "employee_representative_body"
          type: "string"
          keyword_hints: ["профсоюз", "профком", "совет трудового коллектива", "избранные представители"]
          description: "Представительный орган работников"
        - name: "employee_representative_type"
          type: "string"
          allowed_values: ["union", "elected", "council", "other", "not_found"]
          description: "Тип представительного органа работников"
      store_payload: true

  - id: term_validation
    name: "Срок действия коллективного договора (≤ 3 года, ст. 43 ТК РФ)"
    description: |
      Проверяет указание срока действия и его соответствие ограничению в 3 года.
      Извлекает даты начала и окончания, проверяет условия продления.
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "срок действия"
        - "вступает в силу"
        - "действует до"
        - "заключён на срок"
        - "продление"
        - "пролонгация"
        - "три года"
        - "3 года"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)\\b(?:на\\s+срок|сроком)\\s+(?:на\\s+)?\\d+\\s*(?:год|лет|года)\\b"
        - "(?i)действует\\s+до\\s+\\d{1,2}[.]\\d{1,2}[.]\\d{4}"
        - "(?i)вступает\\s+в\\s+силу\\s+с\\s+\\d{1,2}[.]\\d{1,2}[.]\\d{4}"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий коллективный договор.
        Проверь срок действия коллективного договора (ст. 43 ТК РФ: не более 3 лет).

        Ответь строго в JSON:
        {
          "term_specified": "<yes / no>",
          "start_date": "<дата начала действия или not_found>",
          "end_date": "<дата окончания действия или not_found>",
          "term_duration_years": "<число лет или not_found>",
          "term_within_limit": "<yes / no / unclear>",
          "extension_clause": "<present / not_found>",
          "extension_snippet": "<цитата или not_found>"
        }

        - "term_within_limit" = "yes" — срок ≤ 3 лет
        - "term_within_limit" = "no" — срок > 3 лет (нарушение)
        - "term_within_limit" = "unclear" — невозможно определить

        ВАЖНО: Если значение явно не указано — пиши "not_found".
      prompt_file: null
      context_k: 4
      temperature: 0.0
      max_tokens: 400
    retrieval:
      retrieval_profile: "term_and_renewal_check"
      context_k: 4
      max_chunks: 6
      boost_keywords:
        - "срок действия"
        - "вступает в силу"
        - "три года"
        - "продление"
        - "ст. 43 ТК РФ"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "term_specified"
          type: "string"
          allowed_values: ["yes", "no"]
          description: "Указан ли срок действия"
        - name: "term_duration_years"
          type: "number"
          keyword_hints: ["на срок", "сроком на", "лет", "года"]
          description: "Длительность срока в годах"
        - name: "term_within_limit"
          type: "string"
          allowed_values: ["yes", "no", "unclear"]
          description: "Соответствует ли срок ограничению 3 года"
        - name: "extension_clause"
          type: "string"
          allowed_values: ["present", "not_found"]
          description: "Наличие условия о продлении"
      store_payload: true

  - id: no_worsening_principle_check
    name: "Принцип недопустимости ухудшения положения работников (ст. 9, 50 ТК РФ)"
    description: |
      Проверяет наличие явного указания на то, что условия договора не ухудшают
      положение работников по сравнению с трудовым законодательством.
      Выявляет потенциально ухудшающие условия.
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "не могут ухудшать"
        - "не ухудшают положение"
        - "дополнительные гарантии"
        - "не ниже установленных ТК"
        - "улучшение положения работников"
        - "в дополнение к гарантиям"
      keyword_mode: "any"
      negative_keywords:
        - "взамен гарантий"
        - "с согласия работника отказаться от"
        - "снижение гарантий"
      regex_patterns:
        - "(?i)условия.*не\\s+(могут|должны)\\s+ухудшать\\s+положение"
        - "(?i)гарантии.*являются\\s+дополнительными"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий коллективный договор.
        Проверь наличие принципа недопустимости ухудшения положения работников (ст. 9, 50 ТК РФ).

        Ответь строго в JSON:
        {
          "no_worsening_clause_status": "<explicit / implicit / not_found>",
          "no_worsening_snippet": "<цитата из договора или not_found>",
          "potential_worsening_detected": "<yes / no / unclear>",
          "worsening_details": "<описание потенциально ухудшающих условий или not_found>"
        }

        - "explicit" — в договоре есть прямое указание на недопустимость ухудшения
        - "implicit" — принцип подразумевается, но прямого указания нет
        - "not_found" — вопрос не раскрыт

        ВАЖНО: Если значение явно не указано — пиши "not_found".
      prompt_file: null
      context_k: 6
      temperature: 0.0
      max_tokens: 500
    retrieval:
      context_k: 6
      max_chunks: 10
      boost_keywords:
        - "ухудшение положения"
        - "не ухудшать"
        - "дополнительные гарантии"
        - "ст. 9 ТК РФ"
        - "ст. 50 ТК РФ"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "no_worsening_clause_status"
          type: "string"
          allowed_values: ["explicit", "implicit", "not_found"]
          description: "Статус принципа недопустимости ухудшения"
        - name: "potential_worsening_detected"
          type: "string"
          allowed_values: ["yes", "no", "unclear"]
          description: "Выявлены ли потенциально ухудшающие условия"
      store_payload: true

  - id: wage_indexation_mechanism_check
    name: "Механизм индексации заработной платы (ст. 134 ТК РФ)"
    description: |
      Проверяет наличие конкретного механизма индексации заработной платы в связи
      с ростом потребительских цен. Для коммерческих организаций — обязательный элемент.
    triggers:
      any: ["commercial_employer"]
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "индексация заработной платы"
        - "индексация зарплаты"
        - "рост потребительских цен"
        - "инфляция"
        - "индекс потребительских цен"
        - "ИПЦ"
        - "повышение оплаты труда"
        - "пересмотр окладов"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)индексаци(я|ю|и)\\s+заработн"
        - "(?i)повышен(ие|ия)\\s+(оплаты|окладов|тарифн)"
        - "(?i)\\d+\\s*%\\s*(от\\s+)?индекс"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий коллективный договор.
        Проверь наличие механизма индексации заработной платы (ст. 134 ТК РФ).

        Ответь строго в JSON:
        {
