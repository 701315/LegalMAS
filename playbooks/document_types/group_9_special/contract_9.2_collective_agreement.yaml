          прямо указаны; "not_defined" — не указаны.
        - Если negotiations_procedure_status ∈ {defined, declarative} ИЛИ
          initiator_reference_status = "defined" ИЛИ
          conciliation_procedure_status = "defined" ИЛИ
          negotiation_deadline_status = "defined", то
          collective_agreement_conclusion_negotiations_presence = "present".
        - Если все статусы = "not_defined", то
          collective_agreement_conclusion_negotiations_presence = "missing".
        </context_rules>
        <edge_cases>
        1. Полное отсутствие фрагментов о коллективных переговорах, инициаторе,
           сроках и примирительных процедурах →
           collective_agreement_conclusion_negotiations_presence = "missing",
           все статусы = "not_defined".
        2. Декларация «стороны ведут коллективные переговоры» без конкретики →
           presence = "present", negotiations_procedure_status = "declarative",
           остальные = "not_defined".
        3. Полное описание (процедура + инициатор + сроки 3 месяца + порядок
           ст. 38 ТК РФ) → presence = "present", все статусы = "defined".
        4. Противоречие: в преамбуле «переговоры проведены в течение трёх месяцев»,
           в заключительных положениях — «срок переговоров не ограничен» →
           presence = "unclear", negotiation_deadline_status = "not_defined"
           с пояснением в details.
        </edge_cases>
        <output_expectations>
        - Все 8 полей (1 presence + 7 substantive) обязательны.
        - Статусные поля возвращают только значения из allowed_values.
        - Текстовые поля без данных — строго "Данные не определены".
        - Не используй None, null или пустые строки.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "collective_agreement_conclusion_negotiations_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие фрагментов о процедуре коллективных переговоров."
          required: true
        - name: "negotiations_procedure_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "declarative", "not_defined"]
          description: "Статус описания процедуры коллективных переговоров. Внутреннее enum-поле."
          required: true
        - name: "negotiations_procedure_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Порядок переговоров"
          description: >
            Описание процедуры коллективных переговоров. Fallback: "Не установлено" / "Не удалось определить".
          required: false
        - name: "initiator_reference_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус упоминания инициатора переговоров. Внутреннее enum-поле."
          required: true
        - name: "conciliation_procedure_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус порядка урегулирования разногласий. Внутреннее enum-поле."
          required: true
        - name: "conciliation_procedure_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Порядок урегулирования разногласий"
          description: >
            Порядок урегулирования разногласий в ходе переговоров. Fallback: "Не установлено" / "Не удалось определить".
          required: false
        - name: "negotiation_deadline_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания сроков переговоров. Внутреннее enum-поле."
          required: true
        - name: "negotiation_deadline_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Сроки переговоров"
          description: >
            Сроки проведения коллективных переговоров. Fallback: "Не установлено" / "Не удалось определить".
          required: false

      store_payload: true

  - id: collective_agreement_appendices_check
    name: "Приложения к коллективному договору (ст. 41 ч. 1 ТК РФ)"
    description: >
      Фактографическая проверка упоминаний приложений к коллективному договору
      и их полноты как неотъемлемой части документа.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "medium"
    severity_if_pass: "pass"
    severity_if_fail: "medium"
    severity_if_unclear: "low"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 170

    rules:
      keywords:
        - "приложение"
        - "приложения"
        - "в соответствии с приложением"
        - "согласно приложению"
        - "неотъемлемая часть"
        - "составная часть договора"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)приложени(е|я|й)\\s*№?\\s*\\d*"
        - "(?i)(неотъемлем|составн)ой\\s+часть"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по трудовому праву.
        Анализируется коллективный договор (ст. 41 ч. 1 ТК РФ).
        Проверяется только один вопрос: упоминания приложений и их полнота.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        [ЗАДАЧА]
        Найди в тексте договора:
        1. Упоминания приложений.
        2. Перечень приложений.
        3. Указание на приложения как на неотъемлемую часть.
        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если данные не указаны прямо — статусные поля возвращай "not_defined".
        3. Текстовые поля без значения — строго "Данные не определены".
        4. Верни РОВНО один валидный JSON-объект со всеми 5 ключами (4 поля + evidence),
           пригодный для парсинга через json.loads без предварительной обработки.
           Без markdown, без ```json, без комментариев, без текста до или после.
           Начни ответ сразу с { и закончи }.
        5. Не используй None, null или пустые строки.
        6. В evidence включай только текст договора.
        7. appendices_mentioned_status:
           - "defined" — приложения упомянуты;
           - "not_defined" — не упомянуты.
        8. appendices_integrity_status:
           - "complete" — все приложения перечислены с номерами и названиями;
           - "incomplete" — упомянуты без полного перечня;
           - "unclear" — неясно, приложены ли;
           - "not_defined" — приложений нет.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 (полное определение):
        Фрагмент:
        "Приложение № 1 — Положение об оплате труда. Приложение № 2 — Правила
        внутреннего трудового распорядка. Приложения являются неотъемлемой частью
        настоящего договора."
        Ответ:
        {
          "appendices_mentioned_status": "defined",
          "appendices_list": "Приложение № 1 — Положение об оплате труда; Приложение № 2 — Правила внутреннего трудового распорядка",
          "appendices_integrity_status": "complete",
          "appendices_integrity_details": "указано, что приложения являются неотъемлемой частью договора",
          "evidence": [
            {
              "clause_ref": "п. 12.1",
              "quote": "Приложения являются неотъемлемой частью настоящего договора."
            }
          ]
        }
        Пример 2 (частичное определение):
        Фрагмент:
        "Порядок оплаты труда определяется согласно Приложению."
        Ответ:
        {
          "appendices_mentioned_status": "defined",
          "appendices_list": "Приложение (без номера и названия)",
          "appendices_integrity_status": "incomplete",
          "appendices_integrity_details": "приложение упомянуто без номера и полного перечня",
          "evidence": []
        }
        Пример 3 (приложений нет):
        Фрагмент:
        "Настоящий коллективный договор заключён между сторонами."
        Ответ:
        {
          "appendices_mentioned_status": "not_defined",
          "appendices_list": "Данные не определены",
          "appendices_integrity_status": "not_defined",
          "appendices_integrity_details": "Данные не определены",
          "evidence": []
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямые упоминания приложений.
        2. Найди перечень (если есть).
        3. Найди указание на неотъемлемую часть.
        4. Если упоминаний нет — верни "not_defined". Не додумывай.
        5. Проверь, что все 5 ключей (4 поля + evidence) присутствуют в JSON.
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "appendices_mentioned_status": "<defined / not_defined>",
          "appendices_list": "<перечень или 'Данные не определены'>",
          "appendices_integrity_status": "<complete / incomplete / unclear / not_defined>",
          "appendices_integrity_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 600

    retrieval:
      corpus_scope: "document"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "приложение приложения в соответствии с приложением согласно приложению неотъемлемая часть составная часть договора"
      preferred_unit_types:
        - appendix_reference
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - boilerplate
        - procedures
      negative_keywords:
        - "профсоюзные взносы"
        - "забастовка"
        - "в целях настоящего"
      context_k: 5
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "boilerplate"
        - "procedures"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 700

      compact_output: false

      presence_signal:
        field: "collective_agreement_appendices_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по трудовому праву. Извлеки из коллективного договора
        сведения о приложениях и их полноте (ст. 41 ч. 1 ТК РФ).
        Не анализируй другие темы коллективного договора.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. collective_agreement_appendices_check_presence:
           Агрегатное signal-поле — наличие приложений к коллективному
           договору.
           - "present" — если хотя бы одно из содержательных полей
             (appendices_mentioned_status, appendices_integrity_status)
             ≠ "not_defined";
           - "missing" — если оба содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - appendices_mentioned_status = "not_defined";
           - appendices_integrity_status = "not_defined";
           - appendices_list, appendices_integrity_details
             = "Данные не определены";
           - не выполняй остальные шаги.

        1. appendices_mentioned_status:
           - "defined" — если приложения упомянуты в тексте договора;
           - "not_defined" — если не упомянуты.

        2. appendices_list:
           Краткое user-facing перечисление приложений
           (например: "Приложение № 1 — Положение об оплате труда;
           Приложение № 2 — Правила внутреннего трудового распорядка").
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        3. appendices_integrity_status:
           Используй только одно из значений:
           - "complete" — все приложения перечислены с номерами
             и названиями;
           - "incomplete" — приложения упомянуты без полного перечня;
           - "unclear" — неясно, приложены ли (есть ссылка, но нет
             подтверждения);
           - "not_defined" — приложений нет.

        4. appendices_integrity_details:
           Краткое user-facing описание полноты приложений.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни collective_agreement_appendices_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — оба *_status = "not_defined", все *_details = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона вместо текста договора.
        - Не делай выводов по типовой структуре договора.
        - Если приложение упомянуто — обязательно фиксируй в appendices_list с номером и названием, если они указаны.
        - complete = все упомянутые приложения имеют номер и название.
        - incomplete = упомянуто без полного перечня.
        - unclear = неясно, приложены ли (например, есть ссылка, но файла нет).
        - Если в разных фрагментах указаны противоречивые сведения — статус → "not_defined", текстовое поле → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни упоминания приложений, ни перечня,
           ни указания на неотъемлемую часть.
           → presence = "missing";
             appendices_mentioned_status = "not_defined";
             appendices_integrity_status = "not_defined";
             все *_details = "Данные не определены".

        2. Неполное раскрытие или прямое исключение.
           а) Общая фраза: "Стороны руководствуются приложениями"
              без номеров и названий.
              → presence = "present";
                appendices_mentioned_status = "defined";
                appendices_integrity_status = "incomplete".
           б) Прямо указано, что приложений к договору нет.
              → presence = "present";
                appendices_mentioned_status = "defined";
                appendices_integrity_status = "not_defined";
                appendices_integrity_details содержит дословную
                формулировку отсутствия.

        3. Противоречие между фрагментами.
           В одной части договора есть перечень приложений,
           в другой — ссылка на иные приложения.
           → presence = "unclear";
             appendices_integrity_status = "unclear";
             appendices_integrity_details = "Не удалось определить".

        4. Специфика темы — полный перечень с указанием неотъемлемой части.
           Перечислены все приложения с номерами и названиями, указано,
           что они являются неотъемлемой частью договора.
           → presence = "present";
             appendices_mentioned_status = "defined";
             appendices_integrity_status = "complete";
             appendices_list содержит полный перечень.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для collective_agreement_appendices_check_presence используй только: "present", "missing", "unclear".
        - Для appendices_mentioned_status используй только: "defined", "not_defined".
        - Для appendices_integrity_status используй только: "complete", "incomplete", "unclear", "not_defined".
        - Fallback при отсутствии данных:
          * appendices_list, appendices_integrity_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "collective_agreement_appendices_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие приложений к коллективному договору. Внутреннее агрегатное signal-поле."
          required: true

        - name: "appendices_mentioned_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус упоминания приложений. Внутреннее enum-поле."
          required: true

        - name: "appendices_list"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Перечень приложений"
          description: >
            Список упомянутых приложений с номерами и названиями. Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "appendices_integrity_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["complete", "incomplete", "unclear", "not_defined"]
          description: "Статус полноты приложений. Внутреннее enum-поле."
          required: true

        - name: "appendices_integrity_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Полнота приложений"
          description: >
            Комментарий о полноте приложений. Fallback: "Не установлено" / "Не удалось определить".
          required: false

      store_payload: true

  - id: enhanced_labor_guarantees_check
    name: "Повышенные гарантии: командировки, диспансеризация, донорство, обучение (ст. 164–188 ТК РФ)"
    description: >
      Фактографическая проверка повышенных гарантий сверх ТК РФ: при командировках,
      диспансеризации, донорстве, совмещении работы с обучением.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "medium"
    severity_if_pass: "pass"
    severity_if_fail: "medium"
    severity_if_unclear: "low"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 180

    rules:
      keywords:
        - "командировка"
        - "служебная поездка"
        - "суточные"
        - "диспансеризация"
        - "медицинский осмотр"
        - "донор"
        - "день сдачи крови"
        - "учебный отпуск"
        - "совмещение работы с обучением"
        - "дополнительный отпуск обучающимся"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)командиров(очн|ка|ке)"
        - "(?i)суточн(ые|ых)\\s+в\\s+размере"
        - "(?i)диспансеризаци"
        - "(?i)день\\s+сдачи\\s+крови"
        - "(?i)учебн(ый|ого)\\s+отпуск"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по трудовому праву.
        Анализируется коллективный договор (ст. 164–188 ТК РФ).
        Проверяется только один вопрос: повышенные гарантии сверх ТК РФ.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        [ЗАДАЧА]
        Найди в тексте договора гарантии по темам:
        1. Служебные командировки (суточные, компенсации, повышенные гарантии).
        2. Диспансеризация (освобождение от работы, оплата дней).
        3. Донорство (дни сдачи крови, компенсации).
        4. Совмещение работы с обучением (учебные отпуска, оплата).
        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если данные не указаны прямо — статусные поля возвращай "not_defined".
        3. Текстовые поля без значения — строго "Данные не определены".
        4. Верни РОВНО один валидный JSON-объект со всеми 9 ключами (8 полей + evidence),
           пригодный для парсинга через json.loads без предварительной обработки.
           Без markdown, без ```json, без комментариев, без текста до или после.
           Начни ответ сразу с { и закончи }.
        5. Не используй None, null или пустые строки.
        6. В evidence включай только текст договора.
        7. Для каждой темы:
           - "defined" — есть конкретные гарантии сверх ТК РФ;
           - "declarative" — только упоминание без конкретики;
           - "not_defined" — не раскрыто.
        8. Фиксируй именно ПОВЫШЕННЫЕ гарантии (сверх ТК РФ). Если КД просто
           цитирует норму ТК РФ без улучшения — считай "declarative".
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 (полное определение):
        Фрагмент:
        "Суточные при командировках — 1500 рублей в сутки. Работник освобождается
        от работы на время диспансеризации с сохранением среднего заработка.
        Донорам предоставляется 2 дополнительных оплачиваемых дня. Учебный отпуск
        оплачивается исходя из среднего заработка в размере 100%."
        Ответ:
        {
          "business_trips_status": "defined",
          "business_trips_details": "суточные 1500 рублей в сутки",
          "dispensarization_status": "defined",
          "dispensarization_details": "освобождение от работы с сохранением среднего заработка",
          "donor_guarantees_status": "defined",
          "donor_guarantees_details": "2 дополнительных оплачиваемых дня",
          "educational_guarantees_status": "defined",
          "educational_guarantees_details": "оплата учебного отпуска 100% среднего заработка",
          "evidence": [
            {
              "clause_ref": "п. 5.1",
              "quote": "Суточные при командировках — 1500 рублей в сутки."
            }
          ]
        }
        Пример 2 (частичное определение):
        Фрагмент:
        "Работникам предоставляются учебные отпуска в соответствии с ТК РФ.
        Суточные при командировках — 1000 рублей в сутки."
        Ответ:
        {
          "business_trips_status": "defined",
          "business_trips_details": "суточные 1000 рублей в сутки",
          "dispensarization_status": "not_defined",
          "dispensarization_details": "Данные не определены",
          "donor_guarantees_status": "not_defined",
          "donor_guarantees_details": "Данные не определены",
          "educational_guarantees_status": "declarative",
          "educational_guarantees_details": "учебные отпуска в соответствии с ТК РФ (без улучшений)",
          "evidence": [
            {
              "clause_ref": "п. 5.1",
              "quote": "Суточные при командировках — 1000 рублей в сутки."
            }
          ]
        }
        Пример 3 (не раскрыто):
        Фрагмент:
        "Стороны обязуются соблюдать ТК РФ."
        Ответ:
        {
          "business_trips_status": "not_defined",
          "business_trips_details": "Данные не определены",
          "dispensarization_status": "not_defined",
          "dispensarization_details": "Данные не определены",
          "donor_guarantees_status": "not_defined",
          "donor_guarantees_details": "Данные не определены",
          "educational_guarantees_status": "not_defined",
          "educational_guarantees_details": "Данные не определены",
          "evidence": []
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямые цитаты по каждой из 4 тем.
        2. Разграничь defined / declarative.
        3. Если прямой цитаты нет — верни "not_defined". Не додумывай.
        4. Проверь, что все 9 ключей (8 полей + evidence) присутствуют в JSON.
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "business_trips_status": "<defined / declarative / not_defined>",
          "business_trips_details": "<текст или 'Данные не определены'>",
          "dispensarization_status": "<defined / declarative / not_defined>",
          "dispensarization_details": "<текст или 'Данные не определены'>",
          "donor_guarantees_status": "<defined / declarative / not_defined>",
          "donor_guarantees_details": "<текст или 'Данные не определены'>",
          "educational_guarantees_status": "<defined / declarative / not_defined>",
          "educational_guarantees_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 800

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "командировка служебная поездка суточные диспансеризация медицинский осмотр донор день сдачи крови учебный отпуск совмещение работы с обучением дополнительный отпуск обучающимся компенсации"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "профсоюзные взносы"
        - "забастовка"
        - "в целях настоящего"
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 700

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1200

      compact_output: false

      presence_signal:
        field: "enhanced_labor_guarantees_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по трудовому праву. Извлеки из коллективного договора
        сведения о повышенных гарантиях сверх ТК РФ (ст. 164–188 ТК РФ).
        Не анализируй другие темы коллективного договора.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. enhanced_labor_guarantees_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (business_trips_status, dispensarization_status,
              donor_guarantees_status, educational_guarantees_status)
             ≠ "not_defined";
           - "missing" — если все четыре содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - business_trips_status = "not_defined";
           - dispensarization_status = "not_defined";
           - donor_guarantees_status = "not_defined";
           - educational_guarantees_status = "not_defined";
           - все *_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. business_trips_status:
           Используй только одно из значений:
           - "defined" — если прямо указаны конкретные гарантии сверх
             ТК РФ (повышенный размер суточных, дополнительные
             компенсации);
           - "declarative" — если есть только упоминание без улучшений
             (цитирование нормы ТК РФ);
           - "not_defined" — если тема не раскрыта.

        2. business_trips_details:
           Краткое user-facing описание гарантий (размер суточных,
           дополнительные компенсации).
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        3. dispensarization_status:
           Используй только одно из значений:
           - "defined" — конкретные гарантии сверх ТК РФ;
           - "declarative" — только упоминание без улучшений;
           - "not_defined" — тема не раскрыта.

        4. dispensarization_details:
           Краткое user-facing описание гарантий при диспансеризации.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        5. donor_guarantees_status:
           Используй только одно из значений:
           - "defined" — конкретные гарантии сверх ТК РФ;
           - "declarative" — только упоминание без улучшений;
           - "not_defined" — тема не раскрыта.

        6. donor_guarantees_details:
           Краткое user-facing описание гарантий донорам
           (дополнительные дни, компенсации).
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        7. educational_guarantees_status:
           Используй только одно из значений:
           - "defined" — конкретные гарантии сверх ТК РФ;
           - "declarative" — только упоминание без улучшений;
           - "not_defined" — тема не раскрыта.

        8. educational_guarantees_details:
           Краткое user-facing описание гарантий при обучении
           (уровень оплаты учебного отпуска).
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни enhanced_labor_guarantees_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона вместо текста договора.
        - Не делай выводов по типовой структуре договора.
        - defined = гарантии сверх ТК РФ.
        - declarative = только упоминание без улучшений (цитирование нормы ТК РФ).
        - not_defined = тема не раскрыта.
        - В business_trips_details фиксируй конкретный размер суточных и компенсаций.
        - В educational_guarantees_details фиксируй уровень оплаты учебного отпуска (% или средний заработок).
        - Если в разных фрагментах указаны противоречивые сведения — статус → "not_defined", текстовое поле → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни гарантий при командировках, ни при
           диспансеризации, ни для доноров, ни при совмещении работы
           с обучением.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        2. Неполное раскрытие или прямое исключение.
           а) Общая фраза: "Работникам предоставляются гарантии,
              предусмотренные ТК РФ" — только цитирование нормы.
              → presence = "present";
                соответствующий *_status = "declarative";
                соответствующий *_details содержит указание на отсутствие
                улучшений.
           б) Прямо указано, что повышенные гарантии по конкретной
              теме не предоставляются.
              → presence = "present";
                соответствующий *_status = "defined";
                соответствующий *_details содержит дословную
                формулировку отказа.

        3. Противоречие между фрагментами.
           В разных частях договора указаны противоречивые гарантии
           по одной теме (например, разные размеры суточных).
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             соответствующий *_details = "Не удалось определить".

        4. Специфика темы — полное раскрытие с улучшениями.
           По всем четырём темам указаны конкретные гарантии сверх
           ТК РФ.
           → presence = "present";
             все *_status = "defined";
             все *_details содержат конкретику.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для enhanced_labor_guarantees_check_presence используй только: "present", "missing", "unclear".
        - Для всех *_status используй только: "defined", "declarative", "not_defined".
        - Fallback при отсутствии данных:
          * все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "enhanced_labor_guarantees_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по повышенным гарантиям. Внутреннее агрегатное signal-поле."
          required: true

        - name: "business_trips_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "declarative", "not_defined"]
          description: "Статус гарантий при командировках. Внутреннее enum-поле."
          required: true

        - name: "business_trips_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Командировки"
          description: >
            Повышенные гарантии при командировках (суточные, компенсации). Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "dispensarization_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "declarative", "not_defined"]
          description: "Статус гарантий при диспансеризации. Внутреннее enum-поле."
          required: true

        - name: "dispensarization_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Диспансеризация"
          description: >
            Гарантии при прохождении диспансеризации. Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "donor_guarantees_status"
          type: "string"
          presentation: "signal"
          risk_weight: "low"
          allowed_values: ["defined", "declarative", "not_defined"]
          description: "Статус гарантий донорам. Внутреннее enum-поле."
          required: true

        - name: "donor_guarantees_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Донорство"
          description: >
            Гарантии работникам-донорам. Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "educational_guarantees_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "declarative", "not_defined"]
          description: "Статус гарантий при совмещении с обучением. Внутреннее enum-поле."
          required: true

        - name: "educational_guarantees_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Обучение"
          description: >
            Гарантии при совмещении работы с обучением. Fallback: "Не установлено" / "Не удалось определить".
          required: false

      store_payload: true

  - id: union_participation_check
    name: "Участие профсоюза в управлении: ЛНА, увольнения, информация, контроль (ст. 22, 53, 370, 372, 373 ТК РФ)"
    description: >
      Фактографическая проверка процедурных прав профсоюзной организации:
      участие в принятии ЛНА, согласование увольнений, право на информацию,
      контроль соблюдения трудового законодательства.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 190

    rules:
      keywords:
        - "мнение профсоюза"
        - "учёт мнения"
        - "согласование с профсоюзом"
        - "локальный нормативный акт"
        - "уведомление профсоюза"
        - "сокращение численности"
        - "информация профсоюзу"
        - "контроль соблюдения"
        - "профсоюзный контроль"
        - "правовая инспекция труда"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(учёт|учет)\\s+мнени"
        - "(?i)(согласовани|согласие)\\s+(с\\s+)?профсоюз"
        - "(?i)(уведомлени|информировани).*профсоюз"
        - "(?i)профсоюзн(ый|ого)\\s+контрол"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по трудовому праву.
        Анализируется коллективный договор (ст. 22, 53, 370, 372, 373 ТК РФ).
        Проверяется только один вопрос: процедурные права профсоюза.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        [ЗАДАЧА]
        Найди в тексте договора процедурные права профсоюза:
        1. Участие в принятии локальных нормативных актов (учёт мнения, ст. 372).
        2. Участие в согласовании увольнений (ст. 373).
        3. Право на получение информации (ст. 22, 53).
        4. Право на осуществление контроля (ст. 370).
        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если данные не указаны прямо — статусные поля возвращай "not_defined".
        3. Текстовые поля без значения — строго "Данные не определены".
        4. Верни РОВНО один валидный JSON-объект со всеми 9 ключами (8 полей + evidence),
           пригодный для парсинга через json.loads без предварительной обработки.
           Без markdown, без ```json, без комментариев, без текста до или после.
           Начни ответ сразу с { и закончи }.
        5. Не используй None, null или пустые строки.
        6. В evidence включай только текст договора.
        7. Для каждой темы:
           - "defined" — процедурное право прямо закреплено;
           - "declarative" — только общая формулировка без процедуры;
           - "not_defined" — не раскрыто.
        8. В dismissal_coordination_details фиксируй категории увольнений,
           требующих согласования (п. 2, 3, 5 ч. 1 ст. 81 ТК РФ).
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 (полное определение):
        Фрагмент:
        "Работодатель принимает локальные нормативные акты с учётом мнения профсоюза.
        Увольнение по сокращению численности согласовывается с профсоюзом.
        Работодатель предоставляет профсоюзу информацию о финансовой деятельности.
        Профсоюз вправе осуществлять контроль соблюдения трудового законодательства."
        Ответ:
        {
          "lna_participation_status": "defined",
          "lna_participation_details": "принятие ЛНА с учётом мнения профсоюза",
          "dismissal_coordination_status": "defined",
          "dismissal_coordination_details": "увольнение по сокращению численности согласовывается с профсоюзом",
          "information_rights_status": "defined",
