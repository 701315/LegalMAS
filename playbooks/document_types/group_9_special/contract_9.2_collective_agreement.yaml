          required: false

      store_payload: true

  - id: multiple_unions_check
    name: "Множественность профсоюзов: единый представительный орган (ст. 37 ТК РФ)"
    description: >
      Фактографическая проверка порядка представительства при наличии нескольких
      профсоюзных организаций: создание единого представительного органа
      или иной порядок представительства.
    triggers:
      any:
        - multiple_unions
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 60

    rules:
      keywords:
        - "единый представительный орган"
        - "пропорциональное представительство"
        - "несколько профсоюзов"
        - "профсоюзная организация, объединяющая более половины"
        - "общее собрание для определения представителя"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)единый\\s+представительный\\s+орган"
        - "(?i)пропорциональн(ое|ого)\\s+представительств"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по трудовому праву.
        Анализируется коллективный договор (ст. 37 ТК РФ).
        Проверяется только один вопрос: порядок представительства при наличии
        нескольких профсоюзных организаций.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        [ЗАДАЧА]
        Найди в тексте договора:
        1. Указание на наличие нескольких профсоюзных организаций.
        2. Способ определения представителя работников.
        3. Создание единого представительного органа.
        4. Порядок пропорционального представительства.
        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если данные не указаны прямо — статусные поля возвращай "not_defined".
        3. Текстовые поля без значения — строго "Данные не определены".
        4. Верни РОВНО один валидный JSON-объект со всеми 6 ключами (5 полей + evidence),
           пригодный для парсинга через json.loads без предварительной обработки.
           Без markdown, без ```json, без комментариев, без текста до или после.
           Начни ответ сразу с { и закончи }.
        5. Не используй None, null или пустые строки.
        6. В evidence включай только текст договора.
        7. representation_method:
           - "unified_body" — создан единый представительный орган
             (на пропорциональной основе, ст. 37 ч. 2 ТК РФ);
           - "majority_union" — профсоюзная организация, объединяющая более половины
             работников, наделена правом вести коллективные переговоры от имени
             всех работников (ст. 37 ч. 3 ТК РФ);
           - "no_unified_body" — единый орган не создан, право вести переговоры
             перешло к профсоюзной организации с наибольшим числом членов
             (ст. 37 ч. 5 ТК РФ);
           - "elected_at_meeting" — представитель избран на общем собрании
             (конференции) работников без создания органа;
           - "other" — иной порядок, прямо указанный в тексте;
           - "not_defined" — порядок не указан.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 (единый представительный орган):
        Фрагмент:
        "В организации действуют две профсоюзные организации. Стороны создали
        единый представительный орган на пропорциональной основе."
        Ответ:
        {
          "multiple_unions_status": "defined",
          "multiple_unions_details": "две профсоюзные организации",
          "unified_body_status": "defined",
          "unified_body_details": "единый представительный орган на пропорциональной основе",
          "representation_method": "unified_body",
          "evidence": [
            {
              "clause_ref": "п. 1.2",
              "quote": "В организации действуют две профсоюзные организации. Стороны создали единый представительный орган на пропорциональной основе."
            }
          ]
        }
        Пример 2 (мажоритарный профсоюз):
        Фрагмент:
        "В организации действуют три профсоюзные организации. Переговоры от имени
        всех работников ведёт профсоюзная организация, объединяющая более половины
        работников организации."
        Ответ:
        {
          "multiple_unions_status": "defined",
          "multiple_unions_details": "три профсоюзные организации",
          "unified_body_status": "not_defined",
          "unified_body_details": "Данные не определены",
          "representation_method": "majority_union",
          "evidence": [
            {
              "clause_ref": "п. 1.2",
              "quote": "Переговоры от имени всех работников ведёт профсоюзная организация, объединяющая более половины работников организации."
            }
          ]
        }
        Пример 3 (один профсоюз / не указано):
        Фрагмент:
        "Работодатель и первичная профсоюзная организация заключили настоящий договор."
        Ответ:
        {
          "multiple_unions_status": "not_defined",
          "multiple_unions_details": "Данные не определены",
          "unified_body_status": "not_defined",
          "unified_body_details": "Данные не определены",
          "representation_method": "not_defined",
          "evidence": []
