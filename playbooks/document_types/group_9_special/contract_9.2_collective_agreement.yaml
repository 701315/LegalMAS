  # ──────────────────────────────────────────────────────────────────────────
  - id: working_conditions_safety_check
    name: "Рабочее время, охрана труда и вредные условия"
    description: >
      Фактографическая проверка положений о режиме рабочего времени, отпусках,
      мероприятиях по охране труда, финансировании охраны труда, гарантиях
      за вредные/опасные условия труда.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "рабочее время"
        - "режим работы"
        - "ежегодный отпуск"
        - "дополнительный отпуск"
        - "перерыв для отдыха"
        - "выходные дни"
        - "нерабочие праздничные дни"
        - "сокращённое рабочее время"
        - "неполное рабочее время"
        - "график сменности"
        - "мероприятия по охране труда"
        - "финансирование охраны труда"
        - "средства индивидуальной защиты"
        - "специальная оценка условий труда"
        - "СОУТ"
        - "оздоровительные мероприятия"
        - "медицинский осмотр"
        - "доплата за вредность"
        - "дополнительный отпуск за вредные условия"
        - "сокращённая рабочая неделя"
        - "молоко"
        - "лечебно-профилактическое питание"
        - "класс условий труда"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)ежегодн(ый|ого)\\s+(оплачиваем(ый|ого)|дополнительн(ый|ого))\\s+отпуск"
        - "(?i)режим\\s+рабочего\\s+времени"
        - "(?i)финансировани(е|я)\\s+охран(ы|у)\\s+труда"
        - "(?i)специальн(ая|ой)\\s+оценк(а|и)\\s+условий\\s+труда"
        - "(?i)(доплат|компенсац)(а|ия)\\s+за\\s+(вредн|опасн)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по трудовому праву.
        Анализируется коллективный договор (ст. 41, 92, 117, 147, 212–231 ТК РФ).
        Проверяется только один вопрос: рабочее время, охрана труда, вредные условия.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        [ЗАДАЧА]
        Найди в тексте договора:
        1. Режим рабочего времени.
        2. Продолжительность ежегодного отпуска.
        3. Дополнительные отпуска.
        4. Мероприятия по охране труда.
        5. Финансирование охраны труда.
        6. Обеспечение СИЗ.
        7. Результаты СОУТ / класс условий труда.
        8. Гарантии за вредные/опасные условия (доплата, доп. отпуск, молоко, ЛПП).
        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если данные не указаны прямо — возвращай "not_defined".
        3. Если текстового значения нет — возвращай строго "Данные не определены".
        4. В evidence включай только текст договора.
        5. Верни только один JSON-объект.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1:
        Фрагмент:
        "Рабочее время — 40 часов в неделю. Ежегодный отпуск — 28 календарных дней.
        Работникам с вредными условиями труда — дополнительный отпуск 7 дней,
        доплата 4% оклада, молоко. Финансирование охраны труда — не менее 0,2%
        от суммы затрат на производство."
        Ответ:
        {
          "working_hours_status": "defined",
          "working_hours_details": "40 часов в неделю",
          "annual_leave_status": "defined",
          "annual_leave_details": "28 календарных дней",
          "additional_leave_status": "defined",
          "additional_leave_details": "дополнительный отпуск 7 дней за вредные условия",
          "safety_measures_status": "defined",
          "safety_measures_details": "финансирование охраны труда — не менее 0,2% от суммы затрат на производство",
          "ppei_provision_status": "not_defined",
          "ppei_provision_details": "Данные не определены",
          "sout_status": "not_defined",
          "sout_status_details": "Данные не определены",
          "hazardous_guarantees_status": "defined",
          "hazardous_guarantees_details": "доплата 4% оклада, молоко, дополнительный отпуск 7 дней",
          "evidence": [
            {
              "clause_ref": "п. 2.1",
              "quote": "Рабочее время — 40 часов в неделю. Ежегодный отпуск — 28 календарных дней."
            }
          ]
        }
        Пример 2:
        Фрагмент:
        "Работодатель обеспечивает соблюдение трудовых прав работников."
        Ответ:
        {
          "working_hours_status": "not_defined",
          "working_hours_details": "Данные не определены",
          "annual_leave_status": "not_defined",
          "annual_leave_details": "Данные не определены",
          "additional_leave_status": "not_defined",
          "additional_leave_details": "Данные не определены",
          "safety_measures_status": "not_defined",
          "safety_measures_details": "Данные не определены",
          "ppei_provision_status": "not_defined",
          "ppei_provision_details": "Данные не определены",
          "sout_status": "not_defined",
          "sout_status_details": "Данные не определены",
          "hazardous_guarantees_status": "not_defined",
          "hazardous_guarantees_details": "Данные не определены",
          "evidence": []
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о рабочем времени.
        2. Найди прямую цитату об отпусках.
        3. Найди прямую цитату об охране труда.
        4. Найди прямую цитату о финансировании охраны труда.
        5. Найди прямую цитату о СИЗ.
        6. Найди прямую цитату о СОУТ.
        7. Найди прямую цитату о гарантиях за вредные условия.
        8. Если прямой цитаты нет — верни "not_defined". Не додумывай.
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "working_hours_status": "<defined / not_defined>",
          "working_hours_details": "<текст или 'Данные не определены'>",
          "annual_leave_status": "<defined / not_defined>",
          "annual_leave_details": "<текст или 'Данные не определены'>",
          "additional_leave_status": "<defined / not_defined>",
          "additional_leave_details": "<текст или 'Данные не определены'>",
          "safety_measures_status": "<defined / not_defined>",
          "safety_measures_details": "<текст или 'Данные не определены'>",
          "ppei_provision_status": "<defined / not_defined>",
          "ppei_provision_details": "<текст или 'Данные не определены'>",
          "sout_status": "<defined / not_defined>",
          "sout_status_details": "<текст или 'Данные не определены'>",
          "hazardous_guarantees_status": "<defined / not_defined>",
          "hazardous_guarantees_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 700

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "рабочее время режим работы ежегодный отпуск дополнительный отпуск перерыв для отдыха выходные дни нерабочие праздничные дни сокращённое рабочее время неполное рабочее время график сменности мероприятия по охране труда финансирование охраны труда средства индивидуальной защиты специальная оценка условий труда СОУТ оздоровительные мероприятия медицинский осмотр доплата за вредность дополнительный отпуск за вредные условия сокращённая рабочая неделя молоко лечебно-профилактическое питание класс условий труда ст. 41 92 117 147 212-231 ТК РФ"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "индексация"
        - "профсоюзные взносы"
        - "забастовка"
        - "реорганизация"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.15, 0.65]
        boost: 0.12
        scope: segment
      context_k: 8
      max_chunks: 12
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 800

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 1600

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по трудовому праву. Извлеки из коллективного договора
        сведения о рабочем времени, охране труда и вредных условиях.
        Не анализируй индексацию, социальные льготы или споры.
        </role>
        <context>
        {context}
        </context>
        <task>
        Заполни строго следующие поля:
        1. working_hours_status — "defined" или "not_defined".
        2. working_hours_details — режим рабочего времени.
        3. annual_leave_status — "defined" или "not_defined".
        4. annual_leave_details — продолжительность ежегодного отпуска.
        5. additional_leave_status — "defined" или "not_defined".
        6. additional_leave_details — дополнительные отпуска.
        7. safety_measures_status — "defined" или "not_defined".
        8. safety_measures_details — мероприятия по охране труда и финансирование.
        9. ppei_provision_status — "defined" или "not_defined".
        10. ppei_provision_details — обеспечение СИЗ.
        11. sout_status — "defined" или "not_defined".
        12. sout_status_details — результаты СОУТ / класс условий труда.
        13. hazardous_guarantees_status — "defined" или "not_defined".
        14. hazardous_guarantees_details — гарантии за вредные/опасные условия.
        Если данные отсутствуют в тексте:
        - статус = "not_defined"
        - текстовое поле = "Данные не определены"
        </task>
        <rules>
        - Используй только текст договора.
        - Не выводи нормы охраны труда из закона — только из текста договора.
        - Верни только JSON.
        </rules>
      fields:
        - name: "working_hours_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус режима рабочего времени."
          required: true
        - name: "working_hours_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Рабочее время"
          description: "Режим рабочего времени."
          required: false
        - name: "annual_leave_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус ежегодного отпуска."
          required: true
        - name: "annual_leave_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Ежегодный отпуск"
          description: "Продолжительность ежегодного отпуска."
          required: false
        - name: "additional_leave_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус дополнительных отпусков."
          required: false
        - name: "additional_leave_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Дополнительные отпуска"
          description: "Дополнительные отпуска."
          required: false
        - name: "safety_measures_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус мероприятий по охране труда."
          required: true
        - name: "safety_measures_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Охрана труда"
          description: "Мероприятия по охране труда и финансирование."
          required: false
        - name: "ppei_provision_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус обеспечения СИЗ."
          required: false
        - name: "ppei_provision_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "СИЗ"
          description: "Обеспечение средствами индивидуальной защиты."
          required: false
        - name: "sout_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус СОУТ / класса условий труда."
          required: false
        - name: "sout_status_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "СОУТ"
          description: "Результаты СОУТ / класс условий труда."
          required: false
        - name: "hazardous_guarantees_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус гарантий за вредные/опасные условия."
          required: false
        - name: "hazardous_guarantees_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 4
          label: "Гарантии за вредные условия"
          description: "Гарантии за вредные/опасные условия труда."
          required: false
      store_payload: true

# ════════════════════════════════════════════════════════════════════════════
# БЛОК 5: DD_REQUEST_TEMPLATES
# Читается: DDRequestTemplateLoader
# ════════════════════════════════════════════════════════════════════════════

dd_request_templates:
  parties_and_representatives_check:
    text: >
      Просим предоставить по {doc_names}: (а) полные реквизиты работодателя;
      (б) наименование представительного органа работников и документы,
      подтверждающие полномочия (протокол собрания/конференции, доверенность, приказ);
      (в) ФИО и должности уполномоченных представителей обеих сторон.
    addressee: "Обе стороны"

  term_scope_coverage_check:
    text: >
      Просим уточнить в {doc_names}: (а) дату начала и окончания действия;
      (б) подтверждение, что срок не превышает 3 лет (ст. 43 ТК РФ);
      (в) условия и порядок продления; (г) сферу действия (организация / филиал /
      подразделение); (д) подтверждение распространения на всех работников
      независимо от членства в профсоюзе.
    addressee: "Обе стороны"

  no_worsening_principle_check:
    text: >
      Просим проверить {doc_names} на наличие: (а) явного указания на недопустимость
      ухудшения положения работников (ст. 9, 50 ТК РФ); (б) потенциально ухудшающих
      условий (снижение гарантий, замена льгот, отказ от прав).
    addressee: "Юридический советник / Орган по труду"

  wage_indexation_check:
    text: >
      Просим уточнить в {doc_names}: конкретный механизм индексации заработной платы
      (ст. 134 ТК РФ) — привязка к ИПЦ, фиксированный процент, периодичность,
      порядок принятия решения. Общие декларации без конкретики недостаточны.
    addressee: "Работодатель / Финансовая служба"

  union_activity_guarantees_check:
    text: >
      Просим предоставить по {doc_names}: (а) подтверждение предоставления помещения
      профсоюзу; (б) порядок освобождения профсоюзных работников от основной работы;
      (в) механизм перечисления профсоюзных взносов; (г) гарантии при увольнении
      профсоюзных работников (ст. 374–377 ТК РФ).
    addressee: "Работодатель"

  multiple_unions_check:
    text: >
      В {doc_names} выявлено наличие нескольких профсоюзных организаций. Просим
      предоставить: (а) протокол создания единого представительного органа;
      (б) подтверждение пропорционального представительства; (в) документы по ст. 37 ТК РФ.
    addressee: "Представители работников"

  job_security_retraining_check:
    text: >
      Просим уточнить в {doc_names}: (а) конкретные гарантии занятости при реструктуризации;
      (б) обязательства по переподготовке; (в) размер дополнительного выходного пособия;
      (г) приоритеты при повторном трудоустройстве.
    addressee: "Работодатель"

  reorganization_succession_check:
    text: >
      Просим уточнить в {doc_names}: (а) порядок действия договора при реорганизации
      (ст. 43 ТК РФ); (б) обязательства правопреемника; (в) порядок при смене формы
      собственности (3 месяца); (г) последствия ликвидации.
    addressee: "Юридический советник работодателя"

  social_benefits_detail_check:
    text: >
      Просим детализировать в {doc_names} социальные обязательства: указать конкретные
      размеры (суммы в рублях или процентах), условия получения, круг получателей,
      сроки выплат, источники финансирования.
    addressee: "Работодатель / Финансовая служба"

  amendment_control_registration_check:
    text: >
      Просим уточнить в {doc_names}: (а) порядок внесения изменений и дополнений
      (ст. 44 ТК РФ); (б) обязательство направить договор на уведомительную
      регистрацию в орган по труду в 7-дневный срок (ст. 50 ТК РФ); (в) создание
      совместной контрольной комиссии и периодичность отчётности (ст. 51 ТК РФ).
    addressee: "Обе стороны"

  dispute_resolution_liability_check:
    text: >
      Просим согласовать в {doc_names} поэтапную процедуру разрешения разногласий:
      переговоры → примирительная комиссия → посредник/медиатор → трудовой арбитраж
      (ст. 398–418 ТК РФ). Просим уточнить ответственность сторон за невыполнение
      обязательств (ст. 55 ТК РФ, ст. 5.28–5.31 КоАП РФ).
    addressee: "Обе стороны"

  working_conditions_safety_check:
    text: >
      Просим уточнить в {doc_names}: (а) режимы рабочего времени; (б) продолжительность
      ежегодного и дополнительных отпусков; (в) перечень мероприятий по охране труда
      и объём финансирования (не менее 0,2% от затрат на производство);
      (г) результаты СОУТ и классы условий труда; (д) размеры доплат и дополнительных
      отпусков за вредные/опасные условия; (е) порядок обеспечения СИЗ и медосмотров.
    addressee: "Работодатель / Служба охраны труда"

  _default:
    text: >
      Просим предоставить дополнительную информацию по вопросу «{check_name}»
      применительно к {doc_names}.
    addressee: "Юридический советник"


    