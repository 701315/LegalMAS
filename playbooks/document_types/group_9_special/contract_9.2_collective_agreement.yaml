          "priority_rehiring_status": "defined",
          "priority_rehiring_details": "преимущество имеют ранее сокращённые работники",
          "evidence": [
            {
              "clause_ref": "п. 4.1",
              "quote": "При сокращении штата Работодатель обеспечивает переподготовку работников за свой счёт."
