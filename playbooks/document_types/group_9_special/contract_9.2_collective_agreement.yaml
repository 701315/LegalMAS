          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямые цитаты по каждой из 6 тем.
        2. Разграничь defined / declarative (улучшение vs цитирование нормы).
        3. Если прямой цитаты нет — верни "not_defined". Не додумывай.
        4. Проверь, что все 13 ключей (12 полей + evidence) присутствуют
           в JSON.
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "disabled_workers_guarantees_status": "<defined / declarative / not_defined>",
          "disabled_workers_guarantees_details": "<текст или 'Данные не определены'>",
          "disabled_quota_status": "<defined / declarative / not_defined>",
          "disabled_quota_details": "<текст или 'Данные не определены'>",
          "youth_guarantees_status": "<defined / declarative / not_defined>",
          "youth_guarantees_details": "<текст или 'Данные не определены'>",
          "pre_pensioners_guarantees_status": "<defined / declarative / not_defined>",
          "pre_pensioners_guarantees_details": "<текст или 'Данные не определены'>",
          "training_and_retraining_status": "<defined / declarative / not_defined>",
          "training_and_retraining_details": "<текст или 'Данные не определены'>",
          "dismissal_protection_status": "<defined / declarative / not_defined>",
          "dismissal_protection_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
