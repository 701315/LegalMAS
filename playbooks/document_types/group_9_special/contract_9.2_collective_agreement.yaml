          display_in_grid: true
          display_priority: 1
          label: "Социальные льготы"
          description: "Перечень выявленных социальных льгот."
          required: false
        - name: "benefits_with_amounts_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["yes", "partially", "no", "not_defined"]
          description: "Указаны ли конкретные суммы льгот."
          required: true
        - name: "benefits_with_amounts_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Суммы льгот"
          description: "Конкретные суммы/размеры льгот."
          required: false
        - name: "benefits_with_conditions_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["yes", "partially", "no", "not_defined"]
          description: "Указаны ли условия получения льгот."
          required: true
        - name: "benefits_with_conditions_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Условия получения льгот"
          description: "Условия получения льгот."
          required: false
        - name: "payment_timing_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус сроков выплат."
          required: true
        - name: "payment_timing_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Сроки выплат"
          description: "Сроки выплат социальных льгот."
          required: false

      store_payload: true

  - id: amendment_control_registration_check
    name: "Порядок изменений, уведомительная регистрация и контрольная комиссия (ст. 44, 50, 51 ТК РФ)"
    description: >
      Фактографическая проверка порядка внесения изменений (ст. 44 ТК РФ),
      уведомительной регистрации в органе по труду (ст. 50 ТК РФ) и создания
      совместной контрольной комиссии (ст. 51 ТК РФ).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 100

    rules:
      keywords:
        - "внесение изменений"
        - "дополнения"
        - "изменения и дополнения"
        - "порядок внесения изменений"
        - "по взаимному согласию"
        - "уведомительная регистрация"
        - "регистрация в органе по труду"
        - "направить на регистрацию"
        - "в семидневный срок"
        - "7 дней"
        - "комиссия по контролю"
        - "контрольная комиссия"
        - "контроль за выполнением"
        - "отчёт о выполнении"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)изменени(я|й)\\s+и\\s+дополнени(я|й)"
        - "(?i)порядок\\s+внесения\\s+изменений"
        - "(?i)уведомительн(ая|ой)\\s+регистраци"
        - "(?i)(семидневн|7[\\s-]?дневн)\\s+срок"
        - "(?i)комисси(я|ю|и)\\s+(по\\s+)?контрол"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по трудовому праву.
        Анализируется коллективный договор (ст. 44, 50, 51 ТК РФ).
        Проверяется только один вопрос: порядок изменений, уведомительная регистрация
        и контрольная комиссия.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        [ЗАДАЧА]
        Найди в тексте договора:
        1. Порядок внесения изменений и дополнений.
        2. Обязательство по уведомительной регистрации в органе по труду.
        3. Срок направления на регистрацию.
        4. Создание совместной контрольной комиссии.
        5. Периодичность отчётности контрольной комиссии.
        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если данные не указаны прямо — статусные поля возвращай "not_defined".
        3. Текстовые поля без значения — строго "Данные не определены".
        4. Верни РОВНО один валидный JSON-объект со всеми 10 ключами (9 полей + evidence),
           пригодный для парсинга через json.loads без предварительной обработки.
           Без markdown, без ```json, без комментариев, без текста до или после.
           Начни ответ сразу с { и закончи }.
        5. Не используй None, null или пустые строки.
        6. В evidence включай только текст договора.
        7. Не выводи обязательство регистрации из нормы ст. 50 ТК РФ — только из текста
           договора. Если в договоре нет срока регистрации — notification_deadline_status
           = "not_defined".
        8. Периодичность отчётности фиксируй строго как указано в тексте
           («ежеквартально», «раз в год», «по мере необходимости» и т.п.).
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 (полное определение):
        Фрагмент:
        "Изменения и дополнения вносятся по взаимному согласию сторон в порядке,
        установленном для заключения договора. Работодатель обязуется направить
        договор на уведомительную регистрацию в орган по труду в течение 7 дней.
        Стороны создают совместную контрольную комиссию. Отчёт — ежеквартально."
        Ответ:
        {
          "amendment_procedure_status": "defined",
          "amendment_procedure_details": "по взаимному согласию сторон в порядке, установленном для заключения договора",
          "notification_registration_status": "defined",
          "notification_registration_details": "направить на уведомительную регистрацию в орган по труду в течение 7 дней",
          "notification_deadline_status": "defined",
          "notification_deadline_value": "7 дней",
          "control_commission_status": "defined",
          "control_commission_details": "создают совместную контрольную комиссию",
          "control_commission_reporting": "ежеквартально",
          "evidence": [
            {
              "clause_ref": "п. 8.4",
              "quote": "Изменения и дополнения вносятся по взаимному согласию сторон в порядке, установленном для заключения договора."
            },
            {
              "clause_ref": "п. 8.5",
              "quote": "Работодатель обязуется направить договор на уведомительную регистрацию в орган по труду в течение 7 дней."
            }
          ]
        }
        Пример 2 (частичное определение):
        Фрагмент:
        "Изменения в настоящий договор вносятся по соглашению сторон.
        Стороны создают комиссию по контролю за выполнением договора."
        Ответ:
        {
          "amendment_procedure_status": "defined",
          "amendment_procedure_details": "по соглашению сторон",
          "notification_registration_status": "not_defined",
          "notification_registration_details": "Данные не определены",
          "notification_deadline_status": "not_defined",
          "notification_deadline_value": "Данные не определены",
          "control_commission_status": "defined",
          "control_commission_details": "создают комиссию по контролю за выполнением договора",
          "control_commission_reporting": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 8.1",
              "quote": "Изменения в настоящий договор вносятся по соглашению сторон."
            },
            {
              "clause_ref": "п. 8.3",
              "quote": "Стороны создают комиссию по контролю за выполнением договора."
            }
          ]
        }
        Пример 3 (положения отсутствуют):
        Фрагмент:
        "Стороны обязуются исполнять настоящий договор."
        Ответ:
        {
          "amendment_procedure_status": "not_defined",
          "amendment_procedure_details": "Данные не определены",
          "notification_registration_status": "not_defined",
          "notification_registration_details": "Данные не определены",
          "notification_deadline_status": "not_defined",
          "notification_deadline_value": "Данные не определены",
          "control_commission_status": "not_defined",
          "control_commission_details": "Данные не определены",
          "control_commission_reporting": "Данные не определены",
          "evidence": []
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о порядке внесения изменений.
        2. Найди прямую цитату об уведомительной регистрации.
        3. Найди прямую цитату о контрольной комиссии.
        4. Если прямой цитаты нет — верни "not_defined". Не додумывай.
        5. Проверь, что все 10 ключей (9 полей + evidence) присутствуют в JSON.
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "amendment_procedure_status": "<defined / not_defined>",
          "amendment_procedure_details": "<текст или 'Данные не определены'>",
          "notification_registration_status": "<defined / not_defined>",
          "notification_registration_details": "<текст или 'Данные не определены'>",
          "notification_deadline_status": "<defined / not_defined>",
          "notification_deadline_value": "<срок или 'Данные не определены'>",
          "control_commission_status": "<defined / not_defined>",
          "control_commission_details": "<текст или 'Данные не определены'>",
          "control_commission_reporting": "<периодичность или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 10
      temperature: 0.0
