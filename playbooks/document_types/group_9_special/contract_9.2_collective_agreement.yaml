          упомянут; "not_defined" — не упомянут.
        - labor_arbitration_status: "defined" — трудовой арбитраж прямо упомянут;
          "not_defined" — не упомянут.
        - liability_status: "defined" — ответственность сторон прямо указана;
          "not_defined" — не указана. В details фиксируй отсылки на нормы
          (ст. 55 ТК РФ) и конкретные санкции.
        - koap_reference_status: "defined" — прямо упомянута административная
          ответственность (отсылка к КоАП РФ или ст. 5.28–5.31);
          "not_defined" — не упомянута.
        - Если хотя бы один из 6 статусов = "defined", то
          dispute_resolution_liability_check_presence = "present".
        - Если все статусы = "not_defined", то
          dispute_resolution_liability_check_presence = "missing".
        </context_rules>
        <edge_cases>
        1. Полное отсутствие фрагментов о разрешении разногласий и ответственности →
           dispute_resolution_liability_check_presence = "missing",
           все статусы = "not_defined".
        2. Только примирительная комиссия без арбитража и ответственности →
           presence = "present", dispute_procedure_status = "defined",
           conciliation_commission_status = "defined", остальные = "not_defined".
        3. Полная процедура (переговоры → комиссия → посредник → арбитраж) +
           ответственность + отсылка к КоАП → presence = "present",
           все статусы = "defined".
        4. Противоречие: в одном разделе «разногласия разрешаются переговорами»,
           в другом — «все споры передаются в суд без досудебного урегулирования» →
           presence = "unclear", dispute_procedure_status = "not_defined"
           с пояснением в details.
        </edge_cases>
        <output_expectations>
        - Все 9 полей (1 presence + 8 substantive) обязательны.
        - Статусные поля возвращают только значения из allowed_values.
        - Текстовые поля без данных — строго "Данные не определены".
        - Не используй None, null или пустые строки.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

