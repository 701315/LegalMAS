          "educational_guarantees_status": "<defined / declarative / not_defined>",
          "educational_guarantees_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 800

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "командировка служебная поездка суточные диспансеризация медицинский осмотр донор день сдачи крови учебный отпуск совмещение работы с обучением дополнительный отпуск обучающимся компенсации"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "профсоюзные взносы"
        - "забастовка"
        - "в целях настоящего"
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
