        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по трудовому праву. Извлеки из коллективного
        договора сведения о гарантиях при вахтовом методе работы и работе
        в районах Крайнего Севера / приравненных местностях
        (гл. 47 и 50 ТК РФ).
        Не анализируй заработную плату, охрану труда, отпуска общего
        характера или споры.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. northern_and_rotational_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (rotational_method_status, rotational_allowance_status,
              rotational_schedule_status, northern_allowances_status,
              northern_leave_status, travel_compensation_status)
             ≠ "not_defined";
           - "missing" — если все шесть содержательных полей
             = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за
             противоречий вывод невозможен.

           Если presence = "missing":
           - все шесть *_status = "not_defined";
           - все *_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. rotational_method_status:
           Используй только одно из значений:
           - "defined" — КД закрепляет применение вахтового метода
             работы с параметрами;
           - "declarative" — только упоминание вахты без деталей;
           - "not_defined" — тема не раскрыта.

        2. rotational_method_details:
           Краткое user-facing описание вахтового метода.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        3. rotational_allowance_status:
           Используй только одно из значений:
           - "defined" — КД закрепляет вахтовую надбавку с размером;
           - "declarative" — только упоминание надбавки без размера;
           - "not_defined" — тема не раскрыта.

        4. rotational_allowance_details:
           Краткое user-facing описание вахтовой надбавки (размер,
           порядок начисления).
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        5. rotational_schedule_status:
           Используй только одно из значений:
           - "defined" — КД закрепляет режим вахты / суммированный
             учёт рабочего времени с параметрами (учётный период,
             длительность вахты);
           - "declarative" — только упоминание без деталей;
           - "not_defined" — тема не раскрыта.

        6. rotational_schedule_details:
           Краткое user-facing описание режима вахты и суммированного
           учёта.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        7. northern_allowances_status:
           Используй только одно из значений:
           - "defined" — КД закрепляет районный коэффициент
             и/или процентную надбавку за стаж с размерами;
           - "declarative" — только упоминание без размеров;
           - "not_defined" — тема не раскрыта.

        8. northern_allowances_details:
           Краткое user-facing описание районного коэффициента
           и процентной надбавки (размеры).
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        9. northern_leave_status:
           Используй только одно из значений:
           - "defined" — КД закрепляет дополнительный отпуск
             за работу в РКС / за вахту с указанием длительности;
           - "declarative" — только упоминание без длительности;
           - "not_defined" — тема не раскрыта.

        10. northern_leave_details:
            Краткое user-facing описание дополнительного отпуска
            (длительность, порядок).
            Если данных нет — "Данные не определены".
            Если данные противоречивы — "Не удалось определить".

        11. travel_compensation_status:
            Используй только одно из значений:
            - "defined" — КД закрепляет компенсацию проезда к месту
              отдыха и обратно с параметрами (периодичность, порядок);
            - "declarative" — только упоминание без деталей;
            - "not_defined" — тема не раскрыта.

        12. travel_compensation_details:
            Краткое user-facing описание компенсации проезда.
            Если данных нет — "Данные не определены".
            Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни northern_and_rotational_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона вместо текста договора.
        - Не делай выводов по типовой структуре договора.
        - Различай: "defined" — КД закрепляет гарантию с параметрами; "declarative" — только упоминание без конкретики.
        - В rotational_allowance_details обязательно фиксируй размер вахтовой надбавки (%, руб.), если указан.
        - В northern_allowances_details фиксируй размеры районного коэффициента и процентной надбавки, если указаны.
        - Если в разных фрагментах указаны противоречивые сведения — статус → "not_defined", текстовое поле → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни вахтового метода, ни надбавок, ни гарантий
           для РКС / приравненных местностей.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        2. Неполное раскрытие или только упоминание.
           а) Общая фраза: "Работникам предоставляются гарантии,
              предусмотренные ТК РФ для районов Крайнего Севера"
              — только упоминание.
              → presence = "present";
                соответствующий *_status = "declarative".
           б) Прямо указано, что вахтовый метод не применяется
              (например, для офисных работников).
              → presence = "present";
                соответствующий *_status = "defined";
                соответствующий *_details содержит дословную
                формулировку.

        3. Противоречие между фрагментами.
           В разных разделах договора указаны противоречивые размеры
           надбавок или разные условия компенсаций.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             соответствующий *_details = "Не удалось определить".

        4. Полное раскрытие гарантий.
           Указаны вахтовый метод, надбавка, режим вахты, районный
           коэффициент, процентная надбавка, дополнительный отпуск
           и компенсация проезда.
           → presence = "present";
             все *_status = "defined";
             все *_details содержат конкретику.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для northern_and_rotational_check_presence используй только: "present", "missing", "unclear".
        - Для всех *_status используй только: "defined", "declarative", "not_defined".
        - Fallback при отсутствии данных:
          * все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

