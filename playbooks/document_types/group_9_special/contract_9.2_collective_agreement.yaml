          "disabled_quota_status": "defined",
          "disabled_quota_details": "квота 4% от среднесписочной численности",
          "youth_guarantees_status": "defined",
          "youth_guarantees_details": "программа наставничества, стажировка 3 месяца для молодых специалистов",
          "pre_pensioners_guarantees_status": "defined",
