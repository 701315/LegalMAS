# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 3: SHARED PATTERNS
#  Читается: DocTypeCheckLoader через _resolve_yaml_templates()
# ════════════════════════════════════════════════════════════════════════════

shared_patterns:
  term_years: "(?i)\\b(?:на\\s+срок|сроком)\\s+(?:на\\s+)?\\d+\\s*(?:год|лет|года)\\b"
  money_amount: "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|тыс|млн|процент|%)"
  date_pattern: "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"
  article_tk_ref: "(?i)ст\\.?\\s*\\d+\\s*ТК\\s*РФ"
  inn_pattern: "(?i)\\bИНН\\s*\\d{10,12}\\b"

compliance_rules: []

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: CHECKS_V8 — единственный рабочий слой юридического анализа
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  - id: parties_and_representatives_check
    name: "Стороны коллективного договора и их представители"
    description: >
      Фактографическая проверка идентификации работодателя, представительного
      органа работников, уполномоченных лиц и документов, подтверждающих полномочия.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 10

    rules:
      keywords:
        - "работодатель"
        - "представители работников"
        - "профсоюзная организация"
        - "профком"
        - "избранные представители"
        - "общее собрание работников"
        - "конференция работников"
        - "в лице"
        - "действующего на основании"
        - "уполномоченный представитель"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(работодатель|работники)\\s+в\\s+лице"
        - "(?i)действующ(его|ей)\\s+на\\s+основании"
        - "(?i)протокол\\s+(общего\\s+)?собрания"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по трудовому праву.
        Анализируется коллективный договор (Раздел II ТК РФ, ст. 40).
        Проверяется только один вопрос: идентификация сторон и их представителей.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        [ЗАДАЧА]
        Найди в тексте договора:
        1. Наименование работодателя и его реквизиты.
        2. Тип работодателя (юридическое лицо / ИП).
        3. Представителя работодателя (ФИО, должность, основание полномочий).
        4. Представительный орган работников (наименование, тип).
        5. Представителя работников (ФИО, должность, основание полномочий).
        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если данные не указаны прямо — возвращай "not_defined".
        3. Текстовые поля без значения — строго "Данные не определены".
        4. Верни РОВНО один валидный JSON-объект со всеми 12 ключами (11 полей + evidence),
           пригодный для парсинга через json.loads без предварительной обработки.
           Без markdown, без ```json, без комментариев, без текста до или после.
           Начни ответ сразу с { и закончи }.
        5. Не используй None, null или пустые строки.
        6. В evidence включай только текст договора.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 (полное определение):
        Фрагмент:
        "ООО «Альфа» (ИНН 7700000001), именуемое «Работодатель», в лице Генерального
        директора Иванова А.А., действующего на основании Устава, и первичная
        профсоюзная организация ООО «Альфа», в лице председателя Петрова Б.Б.,
        избранного на общем собрании (протокол № 3 от 15.01.2026), заключили
        настоящий коллективный договор."
        Ответ:
        {
          "employer_details_status": "defined",
          "employer_details_value": "ООО «Альфа», ИНН 7700000001",
          "employer_type": "legal_entity",
          "employer_representative_status": "defined",
          "employer_representative_value": "Генеральный директор Иванов А.А.",
          "employer_authority_doc": "Устав",
          "employee_representative_body_status": "defined",
          "employee_representative_body_value": "первичная профсоюзная организация ООО «Альфа»",
          "employee_representative_type": "union",
          "employee_representative_person": "председатель Петров Б.Б.",
          "employee_authority_doc": "протокол № 3 от 15.01.2026",
          "evidence": [
            {
              "clause_ref": "преамбула",
              "quote": "ООО «Альфа» (ИНН 7700000001), именуемое «Работодатель», в лице Генерального директора Иванова А.А., действующего на основании Устава."
            }
          ]
        }
        Пример 2 (частичное определение):
        Фрагмент:
        "ООО «Бета», именуемое «Работодатель», в лице директора Сидорова В.В.,
        действующего на основании Устава, и представители работников заключили
        настоящий коллективный договор."
        Ответ:
        {
          "employer_details_status": "defined",
          "employer_details_value": "ООО «Бета»",
          "employer_type": "legal_entity",
          "employer_representative_status": "defined",
          "employer_representative_value": "директор Сидоров В.В.",
          "employer_authority_doc": "Устав",
          "employee_representative_body_status": "not_defined",
          "employee_representative_body_value": "Данные не определены",
          "employee_representative_type": "not_defined",
          "employee_representative_person": "Данные не определены",
          "employee_authority_doc": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "преамбула",
              "quote": "ООО «Бета», именуемое «Работодатель», в лице директора Сидорова В.В., действующего на основании Устава, и представители работников заключили настоящий коллективный договор."
            }
          ]
        }
        Пример 3 (полное отсутствие данных в преамбуле):
        Фрагмент:
        "Стороны заключили настоящий коллективный договор."
        Ответ:
        {
          "employer_details_status": "not_defined",
          "employer_details_value": "Данные не определены",
          "employer_type": "not_defined",
          "employer_representative_status": "not_defined",
          "employer_representative_value": "Данные не определены",
          "employer_authority_doc": "Данные не определены",
          "employee_representative_body_status": "not_defined",
          "employee_representative_body_value": "Данные не определены",
          "employee_representative_type": "not_defined",
          "employee_representative_person": "Данные не определены",
          "employee_authority_doc": "Данные не определены",
          "evidence": []
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату с идентификацией работодателя.
        2. Найди прямую цитату с представительным органом работников.
        3. Найди прямую цитату с подписантами и основаниями полномочий.
        4. Если прямой цитаты нет — верни "not_defined". Не додумывай.
        5. Проверь, что все 12 ключей (11 полей + evidence) присутствуют в JSON.
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "employer_details_status": "<defined / not_defined>",
          "employer_details_value": "<реквизиты или 'Данные не определены'>",
          "employer_type": "<legal_entity / individual_entrepreneur / not_defined>",
          "employer_representative_status": "<defined / not_defined>",
          "employer_representative_value": "<ФИО и должность или 'Данные не определены'>",
          "employer_authority_doc": "<документ или 'Данные не определены'>",
          "employee_representative_body_status": "<defined / not_defined>",
          "employee_representative_body_value": "<наименование или 'Данные не определены'>",
          "employee_representative_type": "<union / elected / council / other / not_defined>",
          "employee_representative_person": "<ФИО и должность или 'Данные не определены'>",
          "employee_authority_doc": "<документ или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 650

    retrieval:
      retrieval_profile: "party_identification_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "работодатель представители работников профсоюзная организация профком избранные представители общее собрание работников конференция работников в лице действующего на основании уполномоченный представитель полномочия"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - representations
        - boilerplate
      negative_keywords:
        - "индексация"
        - "охрана труда"
        - "отпуск"
        - "рабочее время"
        - "профсоюзные взносы"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 0.20]
        boost: 0.4
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "representations"
        - "boilerplate"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.15

    evidence:
      required: true
      min_snippet_length: 50
      max_snippet_length: 800

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1300

      compact_output: false

      presence_signal:
        field: "parties_and_representatives_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по трудовому праву. Извлеки из коллективного договора
        идентификацию работодателя, представительного органа работников, подписантов
        и основания их полномочий.
        Не анализируй содержание обязательств, индексацию, охрану труда или споры.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. parties_and_representatives_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (employer_details_status, employer_representative_status,
              employee_representative_body_status) ≠ "not_defined";
           - "missing" — если все три содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - employer_details_status = "not_defined";
           - employer_type = "not_defined";
           - employer_representative_status = "not_defined";
           - employee_representative_body_status = "not_defined";
           - employee_representative_type = "not_defined";
           - employer_details_value, employer_representative_value = "Данные не определены";
           - employer_authority_doc, employee_authority_doc = "Данные не определены";
           - employee_representative_body_value, employee_representative_person = "Данные не определены";
           - не выполняй остальные шаги.

        1. employer_details_status:
           - "defined" — если работодатель прямо идентифицируется по наименованию, ИНН, ОГРН;
           - "not_defined" — если работодатель прямо не идентифицируется.

        2. employer_details_value:
           Краткая идентификация работодателя: наименование + ИНН/ОГРН, если прямо указаны.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        3. employer_type:
           - "legal_entity" — если прямо указано юридическое лицо (ООО, АО, ПАО и т.д.);
           - "individual_entrepreneur" — если прямо указан ИП;
           - "not_defined" — если тип не указан.

        4. employer_representative_status:
           - "defined" — если представитель работодателя прямо указан (ФИО, должность);
           - "not_defined" — если представитель не указан.

        5. employer_representative_value:
           ФИО и должность представителя работодателя.
           Если данных нет — "Данные не определены".

        6. employer_authority_doc:
           Документ, подтверждающий полномочия представителя работодателя (Устав, доверенность, приказ).
           Если данных нет — "Данные не определены".

        7. employee_representative_body_status:
           - "defined" — если представительный орган работников прямо указан;
           - "not_defined" — если орган не указан.

        8. employee_representative_body_value:
           Наименование представительного органа работников.
           Если данных нет — "Данные не определены".

        9. employee_representative_type:
           - "union" — первичная профсоюзная организация;
           - "elected" — непосредственно избранные представители;
           - "council" — иной представительный орган (совет трудового коллектива);
           - "other" — иной представитель, прямо указанный в тексте;
           - "not_defined" — тип не указан.

        10. employee_representative_person:
            ФИО и должность представителя работников.
            Если данных нет — "Данные не определены".

        11. employee_authority_doc:
            Документ, подтверждающий полномочия представителя работников (протокол собрания, доверенность).
            Если данных нет — "Данные не определены".
        </task>

        <context_rules>
        - Перед остальными полями заполни parties_and_representatives_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_value/*_doc/*_person = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не делай предположений по типовой структуре коллективного договора.
        - Не смешивай сведения о работодателе и о представителях работников.
        - Если в разных фрагментах указаны разные данные и конфликт нельзя разрешить по тексту, верни "Не удалось определить", а для status/type enum используй "not_defined".
        - Если основание полномочий не указано прямо, не выводи его из должности или из закона.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни упоминания сторон, ни их представителей, ни реквизитов.
           → presence = "missing";
             все *_status = "not_defined";
             все *_value / *_doc / *_person = "Данные не определены".

        2. Частичная идентификация.
           Работодатель указан, но представительный орган работников не назван
           (или наоборот).
           → presence = "present";
             определённые поля = "defined";
             неопределённые поля = "not_defined" с fallback "Данные не определены".

        3. Противоречие между фрагментами.
           В преамбуле указан один представитель, в подписях — другой.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             соответствующий *_value = "Не удалось определить".

        4. Отсылка на внешний документ.
           Полномочия подтверждаются ссылкой на протокол, устав или доверенность
           без цитирования содержания.
           → presence = "present";
             соответствующий *_status = "defined";
             *_doc содержит формулировку вида "Устав", "Протокол № 3 от 15.01.2026".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для parties_and_representatives_check_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined" или "not_defined".
        - Для employer_type используй только: "legal_entity", "individual_entrepreneur", "not_defined".
        - Для employee_representative_type используй только: "union", "elected", "council", "other", "not_defined".
        - Fallback при отсутствии данных:
          * все *_value, *_doc, *_person → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_value, *_doc, *_person → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "parties_and_representatives_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие идентификации сторон / представителей в коллективном договоре. Внутреннее агрегатное signal-поле."
          required: true

        - name: "employer_details_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус идентификации работодателя."
          required: true
        - name: "employer_details_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Работодатель"
          description: "Наименование и реквизиты работодателя."
          required: true
        - name: "employer_type"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["legal_entity", "individual_entrepreneur", "not_defined"]
          description: "Тип работодателя."
          required: true
        - name: "employer_representative_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания представителя работодателя."
          required: true
        - name: "employer_representative_value"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Представитель работодателя"
          description: "ФИО и должность представителя работодателя."
          required: false
        - name: "employer_authority_doc"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Основание полномочий работодателя"
          description: "Документ, подтверждающий полномочия представителя работодателя."
          required: false
        - name: "employee_representative_body_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус идентификации представительного органа работников."
          required: true
        - name: "employee_representative_body_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Представительный орган работников"
          description: "Наименование представительного органа работников."
          required: true
        - name: "employee_representative_type"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["union", "elected", "council", "other", "not_defined"]
          description: "Тип представительного органа работников."
          required: true
        - name: "employee_representative_person"
          type: "string"
