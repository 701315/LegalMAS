        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямые цитаты по каждой из 4 тем.
        2. Разграничь процедурные права и общие формулировки.
        3. Если прямой цитаты нет — верни "not_defined". Не додумывай.
        4. Проверь, что все 9 ключей (8 полей + evidence) присутствуют в JSON.
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "lna_participation_status": "<defined / declarative / not_defined>",
          "lna_participation_details": "<текст или 'Данные не определены'>",
          "dismissal_coordination_status": "<defined / declarative / not_defined>",
          "dismissal_coordination_details": "<текст или 'Данные не определены'>",
          "information_rights_status": "<defined / declarative / not_defined>",
          "information_rights_details": "<текст или 'Данные не определены'>",
          "control_rights_status": "<defined / declarative / not_defined>",
          "control_rights_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 10
      temperature: 0.0
      max_tokens: 900

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "мнение профсоюза учёт мнения согласование с профсоюзом локальный нормативный акт уведомление профсоюза сокращение численности информация профсоюзу контроль соблюдения профсоюзный контроль правовая инспекция труда"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - procedures
        - obligations
      negative_keywords:
        - "профсоюзные взносы"
        - "забастовка"
        - "в целях настоящего"
      context_k: 10
      max_chunks: 14
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "procedures"
        - "obligations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 700

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1200

      compact_output: false

      presence_signal:
        field: "union_participation_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по трудовому праву. Извлеки из коллективного договора
        сведения о процедурных правах профсоюза (ст. 22, 53, 370, 372, 373 ТК РФ).
        Не анализируй другие темы коллективного договора.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. union_participation_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (lna_participation_status, dismissal_coordination_status,
              information_rights_status, control_rights_status)
             ≠ "not_defined";
           - "missing" — если все четыре содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - lna_participation_status = "not_defined";
           - dismissal_coordination_status = "not_defined";
           - information_rights_status = "not_defined";
           - control_rights_status = "not_defined";
           - все *_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. lna_participation_status:
           Используй только одно из значений:
           - "defined" — если прямо закреплено процедурное право
             профсоюза на участие в принятии ЛНА (учёт мнения);
           - "declarative" — если есть только общая формулировка
             без описания процедуры;
           - "not_defined" — если тема не раскрыта.

        2. lna_participation_details:
           Краткое user-facing описание участия профсоюза в принятии ЛНА.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        3. dismissal_coordination_status:
           Используй только одно из значений:
           - "defined" — если прямо закреплена процедура согласования
             увольнений с профсоюзом;
           - "declarative" — если есть только общая формулировка
             без процедуры;
           - "not_defined" — если тема не раскрыта.

        4. dismissal_coordination_details:
           Краткое user-facing описание согласования увольнений
           (категории увольнений, требующих согласования).
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        5. information_rights_status:
           Используй только одно из значений:
           - "defined" — если прямо закреплено право профсоюза
             на получение конкретной информации;
           - "declarative" — если только общая формулировка;
           - "not_defined" — если тема не раскрыта.

        6. information_rights_details:
           Краткое user-facing описание права на информацию.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        7. control_rights_status:
           Используй только одно из значений:
           - "defined" — если прямо закреплено право профсоюза
             на контроль (в т.ч. правовая инспекция труда);
           - "declarative" — если только общая формулировка;
           - "not_defined" — если тема не раскрыта.

        8. control_rights_details:
           Краткое user-facing описание права на контроль.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни union_participation_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона вместо текста договора.
        - Не делай выводов по типовой структуре договора.
        - defined = процедурное право прямо закреплено.
        - declarative = только общая формулировка.
        - not_defined = не раскрыто.
        - В dismissal_coordination_details фиксируй категории увольнений (по п. 2, 3, 5 ч. 1 ст. 81 ТК РФ или иным основаниям).
        - Если в разных фрагментах указаны противоречивые сведения — статус → "not_defined", текстовое поле → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни участия профсоюза в принятии ЛНА, ни согласования
           увольнений, ни права на информацию, ни права на контроль.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        2. Неполное раскрытие или прямое исключение.
           а) Общая фраза: "Профсоюз участвует в управлении организацией"
              без конкретных процедурных прав.
              → presence = "present";
                соответствующий *_status = "declarative";
                соответствующий *_details содержит указание
                на отсутствие конкретики.
           б) Прямо указано, что конкретное процедурное право профсоюза
              не применяется (например, согласование увольнений
              не предусмотрено).
              → presence = "present";
                соответствующий *_status = "defined";
                соответствующий *_details содержит дословную
                формулировку отказа.

        3. Противоречие между фрагментами.
           В разных частях договора указаны противоречивые условия
           о процедурных правах профсоюза.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             соответствующий *_details = "Не удалось определить".

        4. Специфика темы — полный набор процедурных прав.
           Закреплены участие в принятии ЛНА, согласование увольнений,
           право на информацию и контроль с конкретными процедурами.
           → presence = "present";
             все *_status = "defined";
             все *_details содержат конкретику.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для union_participation_check_presence используй только: "present", "missing", "unclear".
        - Для всех *_status используй только: "defined", "declarative", "not_defined".
        - Fallback при отсутствии данных:
          * все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "union_participation_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по процедурным правам профсоюза. Внутреннее агрегатное signal-поле."
          required: true

        - name: "lna_participation_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "declarative", "not_defined"]
          description: "Статус участия профсоюза в принятии ЛНА. Внутреннее enum-поле."
          required: true

        - name: "lna_participation_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Участие в ЛНА"
          description: >
            Участие профсоюза в принятии локальных нормативных актов. Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "dismissal_coordination_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "declarative", "not_defined"]
          description: "Статус согласования увольнений. Внутреннее enum-поле."
          required: true

        - name: "dismissal_coordination_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Согласование увольнений"
          description: >
            Категории увольнений, требующих согласования с профсоюзом. Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "information_rights_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "declarative", "not_defined"]
          description: "Статус права профсоюза на информацию. Внутреннее enum-поле."
          required: true

        - name: "information_rights_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Право на информацию"
          description: >
            Право профсоюза на получение информации. Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "control_rights_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "declarative", "not_defined"]
          description: "Статус права профсоюза на контроль. Внутреннее enum-поле."
          required: true

        - name: "control_rights_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Право на контроль"
          description: >
            Право профсоюза на осуществление контроля. Fallback: "Не установлено" / "Не удалось определить".
          required: false

      store_payload: true

  - id: labor_personal_data_check
    name: "Персональные данные работников (ст. 86–90 ТК РФ, 152-ФЗ)"
    description: >
      Фактографическая проверка обязательств по обработке персональных данных
      работников: согласие, порядок обработки, передача третьим лицам, защита.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 200

    rules:
      keywords:
        - "персональные данные"
        - "обработка персональных данных"
        - "согласие на обработку"
        - "передача персональных данных"
        - "третьи лица"
        - "защита персональных данных"
        - "конфиденциальность персональных данных"
        - "хранение персональных данных"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)персональн(ые|ых)\\s+данн"
        - "(?i)согласи(е|я)\\s+на\\s+обработк"
        - "(?i)(передач|предоставлени).*третьим\\s+лиц"
        - "(?i)защит(а|ы)\\s+персональн"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по трудовому праву.
        Анализируется коллективный договор (ст. 86–90 ТК РФ, 152-ФЗ).
        Проверяется только один вопрос: обязательства по обработке ПДн работников.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        [ЗАДАЧА]
        Найди в тексте договора обязательства по ПДн работников:
        1. Порядок обработки ПДн.
        2. Получение согласия работника.
        3. Передача ПДн третьим лицам.
        4. Меры защиты ПДн.
        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если данные не указаны прямо — статусные поля возвращай "not_defined".
        3. Текстовые поля без значения — строго "Данные не определены".
        4. Верни РОВНО один валидный JSON-объект со всеми 9 ключами (8 полей + evidence),
           пригодный для парсинга через json.loads без предварительной обработки.
           Без markdown, без ```json, без комментариев, без текста до или после.
           Начни ответ сразу с { и закончи }.
        5. Не используй None, null или пустые строки.
        6. В evidence включай только текст договора.
        7. Для каждой темы:
           - "defined" — обязательство прямо закреплено;
           - "declarative" — только общая формулировка без процедуры;
           - "not_defined" — не раскрыто.
        8. В pd_transfer_details фиксируй категории получателей ПДн
           (государственные органы, контрагенты, аудиторы и т.п.).
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 (полное определение):
        Фрагмент:
        "Обработка персональных данных работников осуществляется с их письменного
        согласия. Передача персональных данных третьим лицам допускается только
        с согласия работника, за исключением случаев, предусмотренных законом.
        Работодатель обеспечивает защиту персональных данных в соответствии
        с 152-ФЗ."
        Ответ:
        {
          "pd_processing_status": "defined",
          "pd_processing_details": "обработка с письменного согласия работника",
          "pd_consent_status": "defined",
          "pd_consent_details": "письменное согласие работника",
          "pd_transfer_status": "defined",
          "pd_transfer_details": "передача третьим лицам — только с согласия работника, кроме случаев по закону",
          "pd_protection_status": "defined",
          "pd_protection_details": "защита в соответствии с 152-ФЗ",
          "evidence": [
            {
              "clause_ref": "п. 7.1",
              "quote": "Обработка персональных данных работников осуществляется с их письменного согласия."
            }
          ]
        }
        Пример 2 (частичное определение):
        Фрагмент:
        "Работодатель обязуется обеспечивать защиту персональных данных работников."
        Ответ:
        {
          "pd_processing_status": "declarative",
          "pd_processing_details": "обеспечение защиты персональных данных (без процедуры)",
          "pd_consent_status": "not_defined",
          "pd_consent_details": "Данные не определены",
          "pd_transfer_status": "not_defined",
          "pd_transfer_details": "Данные не определены",
          "pd_protection_status": "declarative",
          "pd_protection_details": "обеспечение защиты персональных данных (без конкретных мер)",
          "evidence": [
            {
              "clause_ref": "п. 7.1",
              "quote": "Работодатель обязуется обеспечивать защиту персональных данных работников."
            }
          ]
        }
        Пример 3 (не раскрыто):
        Фрагмент:
        "Работодатель соблюдает трудовое законодательство."
        Ответ:
        {
          "pd_processing_status": "not_defined",
          "pd_processing_details": "Данные не определены",
          "pd_consent_status": "not_defined",
          "pd_consent_details": "Данные не определены",
          "pd_transfer_status": "not_defined",
          "pd_transfer_details": "Данные не определены",
          "pd_protection_status": "not_defined",
          "pd_protection_details": "Данные не определены",
          "evidence": []
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямые цитаты по каждой из 4 тем.
        2. Разграничь процедурные обязательства и общие формулировки.
        3. Если прямой цитаты нет — верни "not_defined". Не додумывай.
        4. Проверь, что все 9 ключей (8 полей + evidence) присутствуют в JSON.
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "pd_processing_status": "<defined / declarative / not_defined>",
          "pd_processing_details": "<текст или 'Данные не определены'>",
          "pd_consent_status": "<defined / declarative / not_defined>",
          "pd_consent_details": "<текст или 'Данные не определены'>",
          "pd_transfer_status": "<defined / declarative / not_defined>",
          "pd_transfer_details": "<текст или 'Данные не определены'>",
          "pd_protection_status": "<defined / declarative / not_defined>",
          "pd_protection_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 10
      temperature: 0.0
      max_tokens: 900

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "персональные данные обработка персональных данных согласие на обработку передача персональных данных третьи лица защита персональных данных конфиденциальность персональных данных хранение персональных данных 152-ФЗ"
      preferred_unit_types:
        - personal_data
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - procedures
        - obligations
      negative_keywords:
        - "профсоюзные взносы"
        - "забастовка"
        - "в целях настоящего"
      context_k: 10
      max_chunks: 14
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "procedures"
        - "obligations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 700

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1200

      compact_output: false

      presence_signal:
        field: "labor_personal_data_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по трудовому праву. Извлеки из коллективного договора
        сведения об обработке персональных данных работников
        (ст. 86–90 ТК РФ, 152-ФЗ).
        Не анализируй другие темы коллективного договора.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. labor_personal_data_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (pd_processing_status, pd_consent_status,
              pd_transfer_status, pd_protection_status)
             ≠ "not_defined";
           - "missing" — если все четыре содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - pd_processing_status = "not_defined";
           - pd_consent_status = "not_defined";
           - pd_transfer_status = "not_defined";
           - pd_protection_status = "not_defined";
           - все *_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. pd_processing_status:
           Используй только одно из значений:
           - "defined" — если прямо закреплён порядок обработки ПДн
             работников;
           - "declarative" — если есть только общая формулировка
             без процедуры;
           - "not_defined" — если тема не раскрыта.

        2. pd_processing_details:
           Краткое user-facing описание порядка обработки ПДн.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        3. pd_consent_status:
           Используй только одно из значений:
           - "defined" — если прямо закреплён порядок получения
             согласия работника;
           - "declarative" — если только общая формулировка;
           - "not_defined" — если тема не раскрыта.

        4. pd_consent_details:
           Краткое user-facing описание порядка получения согласия.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        5. pd_transfer_status:
           Используй только одно из значений:
           - "defined" — если прямо закреплены условия передачи ПДн
             третьим лицам (категории получателей, случаи);
           - "declarative" — если только общая формулировка;
           - "not_defined" — если тема не раскрыта.

        6. pd_transfer_details:
           Краткое user-facing описание передачи ПДн
           (категории получателей).
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        7. pd_protection_status:
           Используй только одно из значений:
           - "defined" — если прямо закреплены конкретные меры защиты
             ПДн (шифрование, ограничение доступа, назначение
             ответственного);
           - "declarative" — если только общая формулировка;
           - "not_defined" — если тема не раскрыта.

        8. pd_protection_details:
           Краткое user-facing описание мер защиты ПДн.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни labor_personal_data_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона вместо текста договора.
        - Не делай выводов по типовой структуре договора.
        - defined = обязательство прямо закреплено.
        - declarative = только общая формулировка.
        - not_defined = не раскрыто.
        - В pd_transfer_details фиксируй категории получателей (госорганы, контрагенты, аудиторы и т.п.).
        - В pd_protection_details фиксируй конкретные меры (шифрование, ограничение доступа, назначение ответственного и т.п.).
        - Если в разных фрагментах указаны противоречивые сведения — статус → "not_defined", текстовое поле → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни порядка обработки ПДн, ни согласия,
           ни передачи третьим лицам, ни мер защиты.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        2. Неполное раскрытие или прямое исключение.
           а) Общая фраза: "Работодатель соблюдает законодательство
              о персональных данных" без процедуры.
              → presence = "present";
                соответствующий *_status = "declarative";
                соответствующий *_details содержит указание
                на отсутствие конкретики.
           б) Прямо указано, что конкретное обязательство
              не применяется.
              → presence = "present";
                соответствующий *_status = "defined";
                соответствующий *_details содержит дословную
                формулировку отказа.

        3. Противоречие между фрагментами.
           В разных частях договора указаны противоречивые условия
           обработки ПДн.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             соответствующий *_details = "Не удалось определить".

        4. Специфика темы — полный набор процедурных обязательств.
           Закреплены порядок обработки, согласие работника, условия
           передачи третьим лицам и конкретные меры защиты.
           → presence = "present";
             все *_status = "defined";
             все *_details содержат конкретику.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для labor_personal_data_check_presence используй только: "present", "missing", "unclear".
        - Для всех *_status используй только: "defined", "declarative", "not_defined".
        - Fallback при отсутствии данных:
          * все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "labor_personal_data_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по персональным данным работников. Внутреннее агрегатное signal-поле."
          required: true

        - name: "pd_processing_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "declarative", "not_defined"]
          description: "Статус описания обработки ПДн. Внутреннее enum-поле."
          required: true

        - name: "pd_processing_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Обработка ПДн"
          description: >
            Порядок обработки персональных данных работников. Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "pd_consent_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "declarative", "not_defined"]
          description: "Статус согласия на обработку. Внутреннее enum-поле."
          required: true

        - name: "pd_consent_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Согласие на обработку"
          description: >
            Порядок получения согласия работника. Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "pd_transfer_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "declarative", "not_defined"]
          description: "Статус передачи ПДн третьим лицам. Внутреннее enum-поле."
          required: true

        - name: "pd_transfer_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Передача ПДн"
          description: >
            Условия передачи ПДн третьим лицам. Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "pd_protection_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "declarative", "not_defined"]
          description: "Статус мер защиты ПДн. Внутреннее enum-поле."
          required: true

        - name: "pd_protection_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Защита ПДн"
          description: >
            Меры защиты персональных данных. Fallback: "Не установлено" / "Не удалось определить".
          required: false

      store_payload: true

  - id: family_and_women_guarantees_check
    name: "Гарантии женщинам и лицам с семейными обязанностями (ст. 253–264 ТК РФ)"
    description: >
      Фактографическая проверка повышенных гарантий беременным женщинам,
      женщинам с детьми до 3 лет, лицам с семейными обязанностями:
      перевод на другую работу, отпуска, перерывы для кормления,
      защита от увольнения, дополнительный отпуск без сохранения зарплаты,
      выплаты при рождении и усыновлении.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 210

    rules:
      keywords:
        - "беременная"
        - "беременность"
        - "отпуск по беременности и родам"
        - "отпуск по уходу за ребёнком"
        - "декретный отпуск"
        - "перерыв для кормления"
        - "ребёнок до трёх лет"
        - "ребёнок-инвалид"
        - "многодетная"
        - "усыновитель"
        - "материальная помощь при рождении"
        - "дополнительный выходной"
        - "гарантии женщинам"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)беременн[а-яё]+"
        - "(?i)отпуск[а-яё]*\\s+по\\s+(беременност|уход[ау]\\s+за\\s+реб)"
        - "(?i)перерыв[а-яё]*\\s+для\\s+кормлени"
        - "(?i)реб[ёе]н[а-яё]*\\s+(?:до\\s+)?тр[её]х\\s+лет"
        - "(?i)(многодетн|усыновител|реб[ёе]н[а-яё]+[-\\s]инвалид)"
        - "(?i)дополнительн[а-яё]+\\s+(?:оплачиваем[а-яё]+\\s+)?выходн"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по трудовому праву.
        Анализируется коллективный договор (ст. 253–264 ТК РФ).
        Проверяется только один вопрос: гарантии женщинам и лицам
        с семейными обязанностями.
        Нормативные ориентиры:
        - ст. 253 ТК РФ — ограничение применения труда женщин на тяжёлых
          и подземных работах.
        - ст. 254 ТК РФ — перевод беременных и женщин с детьми до 1,5 лет
          на другую работу с сохранением среднего заработка.
        - ст. 255, 256 ТК РФ — отпуска по беременности и родам, по уходу
          за ребёнком до 3 лет.
        - ст. 258 ТК РФ — дополнительные перерывы для кормления ребёнка.
        - ст. 259 ТК РФ — гарантии при направлении в командировки,
          сверхурочные, работу в ночное время (для беременных — запрет,
          для лиц с семейными обязанностями — только с их согласия).
        - ст. 261 ТК РФ — запрет расторжения трудового договора
          по инициативе работодателя с беременной (кроме ликвидации)
          и ограничения для женщин с детьми до 3 лет, одиноких матерей
          с детьми до 14 лет / детьми-инвалидами до 18 лет.
        - ст. 262 ТК РФ — 4 дополнительных оплачиваемых выходных дня
          в месяц для родителей детей-инвалидов; преимущественное
          право на ежегодный отпуск летом.
        - ст. 263 ТК РФ — дополнительный отпуск без сохранения зарплаты
          до 14 календарных дней для отдельных категорий.
        - ст. 264 ТК РФ — гарантии лицам, воспитывающим детей без матери.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Различай: КД закрепляет гарантию, цитирует норму ТК РФ
          или вообще не упоминает.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Гарантии беременным женщинам (перевод на другую работу,
           запрет на увольнение, снижение норм).
        2. Отпуска по уходу за ребёнком (материальная поддержка
           сверх ТК РФ).
        3. Выплаты при рождении / усыновлении ребёнка (сверх
           установленных законом).
        4. Гибкий график / неполное рабочее время для беременных
           и лиц с семейными обязанностями.
        5. Защита от увольнения беременных, женщин с детьми до 3 лет,
           одиноких матерей.
        6. Дополнительные выходные дни, преимущественное право на отпуск,
           дополнительный отпуск без сохранения зарплаты.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Для enum-полей (*_status) при отсутствии данных возвращай
           "not_defined".
        4. Для строковых *_details при отсутствии данных возвращай строго
           "Данные не определены".
        5. Не используй "None", "null", пустые строки или отсутствующие ключи.
        6. В evidence включай только прямые цитаты из текста договора.
        7. Различай:
           - "defined" — КД прямо закрепляет гарантию с параметрами
             (размер, срок, порядок);
           - "declarative" — только упоминание без конкретики
             (цитирование ТК РФ);
           - "not_defined" — тема не раскрыта.
        8. Если КД просто цитирует норму ТК РФ без улучшения — статус
           "declarative".
        9. Верни РОВНО один валидный JSON-объект со всеми 13 ключами
           (12 полей + evidence), пригодный для парсинга через json.loads
           без предварительной обработки. Без markdown, без ```json,
           без комментариев, без текста до или после. Начни ответ сразу
           с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — полное покрытие:
        Фрагмент:
        "Беременным женщинам снижаются нормы выработки на 30% с сохранением
        среднего заработка. Отпуск по уходу за ребёнком — до 3 лет; работодатель
        выплачивает дополнительное пособие 10 000 рублей ежемесячно в течение
        первых 1,5 лет. При рождении ребёнка — материальная помощь 50 000 рублей.
        Беременным предоставляется гибкий график по их заявлению. Увольнение
        беременных по инициативе работодателя не допускается. Родителям детей-
        инвалидов — 4 дополнительных оплачиваемых выходных в месяц."
        Ответ:
        {
          "pregnant_women_guarantees_status": "defined",
          "pregnant_women_guarantees_details": "снижение норм выработки на 30% с сохранением среднего заработка",
          "parental_leave_status": "defined",
          "parental_leave_details": "отпуск до 3 лет, дополнительное пособие 10 000 руб./мес. в течение первых 1,5 лет",
          "family_payments_status": "defined",
          "family_payments_details": "материальная помощь при рождении ребёнка — 50 000 рублей",
          "flexible_schedule_status": "defined",
          "flexible_schedule_details": "гибкий график для беременных по их заявлению",
          "dismissal_protection_status": "defined",
          "dismissal_protection_details": "запрет увольнения беременных по инициативе работодателя",
          "extra_days_and_benefits_status": "defined",
          "extra_days_and_benefits_details": "4 дополнительных оплачиваемых выходных в месяц для родителей детей-инвалидов",
          "evidence": [
            {"clause_ref": "п. 4.1", "quote": "Беременным женщинам снижаются нормы выработки на 30% с сохранением среднего заработка."},
