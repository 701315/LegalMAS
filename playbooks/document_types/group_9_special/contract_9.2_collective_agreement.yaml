    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1500

      compact_output: false

      presence_signal:
        field: "special_categories_workers_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по трудовому праву. Извлеки из коллективного
        договора сведения о гарантиях отдельным категориям работников —
        инвалидам, молодёжи, предпенсионерам.
        Не анализируй охрану труда, индексацию, обучение в общем виде
        или споры.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. special_categories_workers_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (disabled_workers_guarantees_status, disabled_quota_status,
              youth_guarantees_status,
              pre_pensioners_guarantees_status,
              training_and_retraining_status,
              dismissal_protection_status) ≠ "not_defined";
           - "missing" — если все шесть содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - все шесть *_status = "not_defined";
           - все *_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. disabled_workers_guarantees_status:
           Используй только одно из значений:
           - "defined" — КД закрепляет специальные гарантии инвалидам
             с параметрами (сокращённое рабочее время, ограничения
             по ночным / командировкам / сверхурочным, дополнительный
             отпуск);
           - "declarative" — только цитирование ТК РФ / ФЗ №181-ФЗ;
           - "not_defined" — тема не раскрыта.

        2. disabled_workers_guarantees_details:
           Краткое user-facing описание гарантий инвалидам.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        3. disabled_quota_status:
           Используй только одно из значений:
           - "defined" — КД закрепляет квотирование рабочих мест
             для инвалидов с указанием размера квоты или порядка;
           - "declarative" — только упоминание квотирования
             без размера / порядка;
           - "not_defined" — тема не раскрыта.

        4. disabled_quota_details:
           Краткое user-facing описание квоты (размер в % или рабочих
           местах, порядок).
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        5. youth_guarantees_status:
           Используй только одно из значений:
           - "defined" — КД закрепляет гарантии молодёжи
             (стажировка, наставничество, программы для молодых
             специалистов) с параметрами;
           - "declarative" — только упоминание без конкретики;
           - "not_defined" — тема не раскрыта.

        6. youth_guarantees_details:
           Краткое user-facing описание гарантий молодёжи.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        7. pre_pensioners_guarantees_status:
           Используй только одно из значений:
           - "defined" — КД закрепляет специальные гарантии
             предпенсионерам с параметрами;
           - "declarative" — только упоминание без конкретики;
           - "not_defined" — тема не раскрыта.

        8. pre_pensioners_guarantees_details:
           Краткое user-facing описание гарантий предпенсионерам.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        9. training_and_retraining_status:
           Используй только одно из значений:
           - "defined" — КД закрепляет обучение / переобучение
             специальных категорий с параметрами (порядок, оплата);
           - "declarative" — только упоминание;
           - "not_defined" — тема не раскрыта.

        10. training_and_retraining_details:
            Краткое user-facing описание обучения специальных категорий.
            Если данных нет — "Данные не определены".
            Если данные противоречивы — "Не удалось определить".

        11. dismissal_protection_status:
            Используй только одно из значений:
            - "defined" — КД закрепляет дополнительные гарантии
              от увольнения специальных категорий с параметрами
              (согласование, дополнительные критерии);
            - "declarative" — только цитирование норм;
            - "not_defined" — тема не раскрыта.

        12. dismissal_protection_details:
            Краткое user-facing описание защиты от увольнения.
            Если данных нет — "Данные не определены".
            Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни special_categories_workers_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона вместо текста договора.
        - Не делай выводов по типовой структуре договора.
        - Различай: "defined" — КД закрепляет гарантию сверх норм с параметрами; "declarative" — только цитирование нормы.
        - В disabled_quota_details обязательно фиксируй размер квоты (в % или в единицах рабочих мест), если он указан.
        - В disabled_workers_guarantees_details фиксируй как гарантии по сокращённому рабочему времени, так и ограничения по ночным / сверхурочным / командировкам.
        - Если в разных фрагментах указаны противоречивые сведения — статус → "not_defined", текстовое поле → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни гарантий инвалидам, ни квотирования,
           ни гарантий молодёжи, ни гарантий предпенсионерам,
           ни обучения спецкатегорий, ни защиты от увольнения.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        2. Неполное раскрытие или только цитирование норм.
           а) Общая фраза: "Инвалидам предоставляются гарантии
              в соответствии с законодательством" — только цитирование.
              → presence = "present";
                соответствующий *_status = "declarative".
           б) Прямо указано, что конкретная гарантия не предоставляется.
              → presence = "present";
                соответствующий *_status = "defined";
                соответствующий *_details содержит дословную
                формулировку отказа.

        3. Противоречие между фрагментами.
           В разных разделах договора указаны противоречивые гарантии
           или разные размеры квот.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             соответствующий *_details = "Не удалось определить".

        4. Полное раскрытие гарантий с параметрами.
           По всем ключевым темам КД закрепляет конкретные гарантии
           и квоты с размерами.
           → presence = "present";
             все *_status = "defined";
             все *_details содержат конкретику.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для special_categories_workers_check_presence используй только: "present", "missing", "unclear".
        - Для всех *_status используй только: "defined", "declarative", "not_defined".
        - Fallback при отсутствии данных:
          * все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "special_categories_workers_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по гарантиям отдельным категориям работников. Внутреннее агрегатное signal-поле."
          required: true

        - name: "disabled_workers_guarantees_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "declarative", "not_defined"]
          description: "Статус гарантий работникам-инвалидам. Внутреннее enum-поле."
          required: true

        - name: "disabled_workers_guarantees_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Гарантии инвалидам"
