        - retraining_obligation_status: "defined" — обязательство по переподготовке
          прямо указано; "not_defined" — не указано.
        - enhanced_severance_status: "defined" — повышенное выходное пособие указано;
          "not_defined" — не указано. В details обязательно фиксируй размер
          (в среднемесячных заработках или рублях), если он есть в тексте.
        - priority_rehiring_status: "defined" — приоритетное право на повторное
          трудоустройство указано; "not_defined" — не указано.
        - Если job_security_status ∈ {concrete, declarative} ИЛИ хотя бы один
          из остальных статусов = "defined", то
          job_security_retraining_check_presence = "present".
        - Если все поля = "not_defined", то
          job_security_retraining_check_presence = "missing".
        </context_rules>
        <edge_cases>
        1. Полное отсутствие фрагментов о занятости, переподготовке, выходном
           пособии и трудоустройстве → job_security_retraining_check_presence = "missing",
           все статусы = "not_defined".
        2. Декларация «работодатель содействует занятости» без конкретных
           мероприятий → presence = "present",
           job_security_status = "declarative", остальные = "not_defined".
        3. Конкретные гарантии (переподготовка + повышенное пособие + приоритет
           при трудоустройстве) → presence = "present",
           job_security_status = "concrete", все статусы = "defined".
        4. Противоречие: в одном разделе «сохранение рабочих мест при сокращении»,
           в другом — «сокращение без дополнительных гарантий» →
           presence = "unclear", job_security_status = "not_defined" с пояснением
           в details.
        </edge_cases>
        <output_expectations>
        - Все 9 полей (1 presence + 8 substantive) обязательны.
        - Статусные и enum-поля возвращают только значения из allowed_values.
        - Текстовые поля без данных — строго "Данные не определены".
        - Не используй None, null или пустые строки.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "job_security_retraining_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие фрагментов о гарантиях занятости и переподготовки."
          required: true
        - name: "job_security_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["concrete", "declarative", "not_defined"]
          description: "Статус гарантий занятости. Внутреннее enum-поле."
          required: true
        - name: "job_security_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Гарантии занятости"
          description: >
            Формулировка гарантий занятости. Fallback: "Не установлено" / "Не удалось определить".
          required: false
        - name: "retraining_obligation_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус обязательства по переподготовке. Внутреннее enum-поле."
          required: true
        - name: "retraining_obligation_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Переподготовка"
          description: >
            Обязательство по переподготовке. Fallback: "Не установлено" / "Не удалось определить".
          required: false
        - name: "enhanced_severance_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус повышенного выходного пособия. Внутреннее enum-поле."
          required: true
        - name: "enhanced_severance_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Повышенное выходное пособие"
          description: >
            Повышенное выходное пособие при сокращении (с размером, если указан). Fallback: "Не установлено" / "Не удалось определить".
          required: false
        - name: "priority_rehiring_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус приоритетного трудоустройства. Внутреннее enum-поле."
          required: true
        - name: "priority_rehiring_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Приоритетное трудоустройство"
          description: >
            Приоритетное право на повторное трудоустройство. Fallback: "Не установлено" / "Не удалось определить".
          required: false

      store_payload: true

  - id: reorganization_succession_check
    name: "Действие договора при реорганизации, смене собственника, ликвидации (ст. 43, 75 ТК РФ)"
    description: >
      Фактографическая проверка наличия положений о судьбе коллективного договора
      при реорганизации, смене формы собственности и ликвидации организации.
    triggers:
      any:
        - reorganization_context
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 80

    rules:
      keywords:
        - "реорганизация"
        - "правопреемник"
        - "слияние"
        - "присоединение"
        - "разделение"
        - "выделение"
        - "преобразование"
        - "смена собственника"
        - "ликвидация"
        - "сохранение действия договора"
        - "действие в период реорганизации"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)в\\s+случае\\s+реорганизаци"
        - "(?i)при\\s+смене\\s+собственник"
        - "(?i)правопреемник.*обязательств"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по трудовому праву.
        Анализируется коллективный договор (ст. 43, 75 ТК РФ).
        Проверяется только один вопрос: действие договора при реорганизации,
        смене собственника и ликвидации.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        [ЗАДАЧА]
        Найди в тексте договора:
        1. Положение о реорганизации.
        2. Что происходит с договором при реорганизации.
        3. Положение о смене собственника.
        4. Положение о ликвидации.
        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если данные не указаны прямо — статусные и enum-поля возвращай "not_defined".
        3. Текстовые поля без значения — строго "Данные не определены".
        4. Верни РОВНО один валидный JSON-объект со всеми 8 ключами (7 полей + evidence),
           пригодный для парсинга через json.loads без предварительной обработки.
           Без markdown, без ```json, без комментариев, без текста до или после.
           Начни ответ сразу с { и закончи }.
        5. Не используй None, null или пустые строки.
        6. В evidence включай только текст договора.
        7. reorganization_action_code:
           - "continues" — договор продолжает действие (в т.ч. на период
             реорганизации / до окончания срока);
           - "renegotiation" — стороны обязуются начать переговоры о новом
             договоре / пересмотреть действующий;
           - "terminates" — договор прекращается (в т.ч. при ликвидации,
             ст. 43 ч. 5 ТК РФ);
           - "not_defined" — судьба договора не указана.
        8. При смене собственника в тексте часто указывается срок действия
           (по ст. 43 ч. 8 ТК РФ — 3 месяца). Фиксируй его в ownership_change_details.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 (реорганизация + смена собственника):
        Фрагмент:
        "В случае реорганизации Работодателя настоящий договор продолжает действовать
        до окончания срока его действия. При смене собственника имущества организации
        договор сохраняет действие в течение трёх месяцев."
        Ответ:
        {
          "reorganization_clause_status": "defined",
          "reorganization_action_code": "continues",
          "reorganization_action_details": "продолжает действовать до окончания срока его действия",
          "ownership_change_status": "defined",
          "ownership_change_details": "сохраняет действие в течение трёх месяцев",
          "liquidation_status": "not_defined",
          "liquidation_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 8.3",
              "quote": "В случае реорганизации Работодателя настоящий договор продолжает действовать до окончания срока его действия."
            },
            {
              "clause_ref": "п. 8.4",
              "quote": "При смене собственника имущества организации договор сохраняет действие в течение трёх месяцев."
            }
          ]
        }
        Пример 2 (ликвидация):
        Фрагмент:
        "При ликвидации организации настоящий коллективный договор прекращает
        своё действие."
        Ответ:
        {
          "reorganization_clause_status": "not_defined",
          "reorganization_action_code": "not_defined",
          "reorganization_action_details": "Данные не определены",
          "ownership_change_status": "not_defined",
          "ownership_change_details": "Данные не определены",
          "liquidation_status": "defined",
          "liquidation_details": "прекращает своё действие при ликвидации организации",
          "evidence": [
            {
              "clause_ref": "п. 8.5",
              "quote": "При ликвидации организации настоящий коллективный договор прекращает своё действие."
            }
          ]
        }
        Пример 3 (положения отсутствуют):
        Фрагмент:
        "Стороны обязуются исполнять настоящий договор."
        Ответ:
        {
          "reorganization_clause_status": "not_defined",
          "reorganization_action_code": "not_defined",
          "reorganization_action_details": "Данные не определены",
          "ownership_change_status": "not_defined",
          "ownership_change_details": "Данные не определены",
          "liquidation_status": "not_defined",
          "liquidation_details": "Данные не определены",
          "evidence": []
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о реорганизации.
        2. Найди прямую цитату о смене собственника.
        3. Найди прямую цитату о ликвидации.
        4. Если прямой цитаты нет — верни "not_defined". Не додумывай.
        5. Проверь, что все 8 ключей (7 полей + evidence) присутствуют в JSON.
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "reorganization_clause_status": "<defined / not_defined>",
          "reorganization_action_code": "<continues / renegotiation / terminates / not_defined>",
          "reorganization_action_details": "<текст или 'Данные не определены'>",
          "ownership_change_status": "<defined / not_defined>",
          "ownership_change_details": "<текст или 'Данные не определены'>",
          "liquidation_status": "<defined / not_defined>",
          "liquidation_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 10
      temperature: 0.0
      max_tokens: 700

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "реорганизация правопреемник слияние присоединение разделение выделение преобразование смена собственника ликвидация сохранение действия договора действие в период реорганизации пересмотр"
      preferred_unit_types:
        - termination_provision
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - procedures
        - boilerplate
      negative_keywords:
        - "индексация"
        - "охрана труда"
        - "отпуск"
        - "рабочее время"
        - "профсоюзные взносы"
        - "забастовка"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.55, 1.0]
        boost: 0.30
        scope: segment
      context_k: 10
      max_chunks: 14
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "procedures"
        - "boilerplate"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1200

      compact_output: false

      presence_signal:
        field: "reorganization_succession_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по трудовому праву. Извлеки из коллективного договора
        сведения о действии договора при реорганизации, смене собственника и ликвидации
        (ст. 43, 75 ТК РФ).
        Не анализируй индексацию, охрану труда или споры.
        </role>
        <context>
        {context}
        </context>
        <task>
        0. reorganization_succession_check_presence: определи, есть ли в договоре
           фрагменты, касающиеся судьбы договора при реорганизации, смене собственника
           или ликвидации.
           - "present" — есть хотя бы один фрагмент по теме (положение о реорганизации,
             смене собственника, ликвидации, правопреемстве).
           - "missing" — фрагментов по теме нет вообще.
           - "unclear" — фрагменты есть, но противоречат друг другу и вывод невозможен.

        1. reorganization_clause_status — defined / not_defined.
        2. reorganization_action_code — continues / renegotiation / terminates / not_defined.
        3. reorganization_action_details — что происходит с договором при реорганизации.
        4. ownership_change_status — defined / not_defined.
        5. ownership_change_details — положение о смене собственника (со сроком, если указан).
        6. liquidation_status — defined / not_defined.
        7. liquidation_details — положение о ликвидации.

        Если данные отсутствуют в тексте:
        - статус/enum = "not_defined"
        - текстовое поле = "Данные не определены"
        </task>
        <context_rules>
        - reorganization_succession_check_presence и все статусные поля попарно не
          пересекаются по значениям present/missing/unclear; их объединение покрывает
          все допустимые значения.
        - reorganization_clause_status: "defined" — положение о реорганизации прямо
          указано; "not_defined" — не указано.
        - reorganization_action_code: "continues" — договор продолжает действие;
          "renegotiation" — стороны обязуются начать переговоры / пересмотреть договор;
          "terminates" — договор прекращается; "not_defined" — не указано.
        - ownership_change_status: "defined" — положение о смене собственника указано;
          "not_defined" — не указано. В details обязательно фиксируй срок, если он
          указан (по ст. 43 ч. 8 ТК РФ — 3 месяца).
        - liquidation_status: "defined" — положение о ликвидации указано;
          "not_defined" — не указано.
        - Если reorganization_clause_status = "defined" ИЛИ
          ownership_change_status = "defined" ИЛИ liquidation_status = "defined", то
          reorganization_succession_check_presence = "present".
        - Если все поля = "not_defined", то
          reorganization_succession_check_presence = "missing".
        </context_rules>
        <edge_cases>
        1. Полное отсутствие фрагментов о реорганизации, смене собственника
           и ликвидации → reorganization_succession_check_presence = "missing",
           все поля = "not_defined".
        2. Только реорганизация («договор продолжает действовать до окончания
           срока») без смены собственника и ликвидации → presence = "present",
           reorganization_clause_status = "defined",
           reorganization_action_code = "continues", остальные = "not_defined".
        3. Все три сценария раскрыты (реорганизация + смена собственника со сроком
           3 месяца + ликвидация) → presence = "present", все статусы = "defined".
        4. Противоречие: в одном разделе «договор сохраняет действие при
           реорганизации», в другом — «договор прекращается при любом изменении
           организационно-правовой формы» → presence = "unclear",
           reorganization_action_code = "not_defined" с пояснением в details.
        </edge_cases>
        <output_expectations>
        - Все 8 полей (1 presence + 7 substantive) обязательны.
        - Статусные и enum-поля возвращают только значения из allowed_values.
        - Текстовые поля без данных — строго "Данные не определены".
        - Не используй None, null или пустые строки.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "reorganization_succession_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие фрагментов о действии договора при реорганизации, смене собственника, ликвидации."
          required: true
        - name: "reorganization_clause_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус положения о реорганизации. Внутреннее enum-поле."
          required: true
        - name: "reorganization_action_code"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["continues", "renegotiation", "terminates", "not_defined"]
          description: "Что происходит с договором при реорганизации. Внутреннее enum-поле."
          required: true
        - name: "reorganization_action_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Реорганизация"
          description: >
            Положение о реорганизации. Fallback: "Не установлено" / "Не удалось определить".
          required: false
        - name: "ownership_change_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус положения о смене собственника. Внутреннее enum-поле."
          required: true
        - name: "ownership_change_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Смена собственника"
          description: >
            Положение о смене собственника (с указанием срока, если есть). Fallback: "Не установлено" / "Не удалось определить".
          required: false
        - name: "liquidation_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус положения о ликвидации. Внутреннее enum-поле."
          required: true
        - name: "liquidation_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Ликвидация"
          description: >
            Положение о ликвидации. Fallback: "Не установлено" / "Не удалось определить".
          required: false

      store_payload: true

  - id: social_benefits_detail_check
    name: "Детализация финансовых и социальных льгот (ст. 41 ТК РФ)"
    description: >
      Фактографическая проверка наличия конкретных параметров социальных обязательств
      работодателя: размеры выплат, условия, сроки, круг получателей.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 90

    rules:
      keywords:
        - "материальная помощь"
        - "доплата"
        - "компенсация"
        - "премия"
        - "надбавка"
        - "ДМС"
        - "добровольное медицинское страхование"
        - "оздоровление"
        - "санаторно-курортное лечение"
        - "питание"
        - "проезд"
        - "в размере"
        - "в сумме"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)в\\s+размере\\s+\\d+"
        - "(?i)в\\s+сумме\\s+\\d+"
        - "(?i)\\d+\\s*(руб|рублей|%|процент)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по трудовому праву.
        Анализируется коллективный договор (ст. 41 ТК РФ).
        Проверяется только один вопрос: детализация социальных и финансовых льгот.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        [ЗАДАЧА]
        Найди в тексте договора:
        1. Перечень выявленных социальных льгот.
        2. Указаны ли конкретные суммы/размеры.
        3. Указаны ли условия получения льгот.
        4. Указаны ли сроки выплат.
        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если данные не указаны прямо — статусные и enum-поля возвращай "not_defined".
        3. Текстовые поля без значения — строго "Данные не определены".
        4. Верни РОВНО один валидный JSON-объект со всеми 9 ключами (8 полей + evidence),
           пригодный для парсинга через json.loads без предварительной обработки.
           Без markdown, без ```json, без комментариев, без текста до или после.
           Начни ответ сразу с { и закончи }.
        5. Не используй None, null или пустые строки.
        6. В evidence включай только текст договора. Если текстовое поле details заполнено,
           соответствующая цитата должна быть в evidence.
        7. benefits_list_status:
           - "defined" — есть конкретный перечень льгот;
           - "declarative" — только общая декларация («обеспечивает социальные гарантии»)
             без перечня;
           - "not_defined" — льготы не упоминаются.
        8. benefits_with_amounts_status и benefits_with_conditions_status:
           - "yes" — у большинства льгот указаны суммы/условия;
           - "partially" — у части льгот есть конкретика;
           - "no" — все льготы декларативные;
           - "not_defined" — льготы не упоминаются.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 (частичная детализация):
        Фрагмент:
        "Работникам предоставляется ДМС. Материальная помощь к отпуску — 15 000 рублей.
        Компенсация проезда к месту работы — 3 000 рублей в месяц."
        Ответ:
        {
          "benefits_list_status": "defined",
          "benefits_list_value": "ДМС; материальная помощь к отпуску; компенсация проезда",
          "benefits_with_amounts_status": "partially",
          "benefits_with_amounts_details": "материальная помощь — 15 000 рублей; компенсация проезда — 3 000 рублей в месяц",
          "benefits_with_conditions_status": "partially",
          "benefits_with_conditions_details": "материальная помощь к отпуску",
          "payment_timing_status": "defined",
          "payment_timing_details": "3 000 рублей в месяц",
          "evidence": [
            {
              "clause_ref": "п. 6.1",
              "quote": "Работникам предоставляется ДМС. Материальная помощь к отпуску — 15 000 рублей."
            }
          ]
        }
        Пример 2 (льготы с суммами, но без условий и сроков):
        Фрагмент:
        "Работодатель выплачивает премию по итогам года в размере одного среднемесячного
        заработка и материальную помощь при уходе в ежегодный отпуск в сумме 10 000 рублей."
        Ответ:
        {
          "benefits_list_status": "defined",
          "benefits_list_value": "премия по итогам года; материальная помощь к отпуску",
          "benefits_with_amounts_status": "yes",
          "benefits_with_amounts_details": "премия — один среднемесячный заработок; материальная помощь — 10 000 рублей",
          "benefits_with_conditions_status": "no",
          "benefits_with_conditions_details": "Данные не определены",
          "payment_timing_status": "not_defined",
          "payment_timing_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 6.4",
              "quote": "Работодатель выплачивает премию по итогам года в размере одного среднемесячного заработка."
            }
          ]
        }
        Пример 3 (только декларация):
        Фрагмент:
        "Работодатель обеспечивает социальные гарантии работникам."
        Ответ:
        {
          "benefits_list_status": "declarative",
          "benefits_list_value": "обеспечивает социальные гарантии работникам",
          "benefits_with_amounts_status": "not_defined",
          "benefits_with_amounts_details": "Данные не определены",
          "benefits_with_conditions_status": "not_defined",
          "benefits_with_conditions_details": "Данные не определены",
          "payment_timing_status": "not_defined",
          "payment_timing_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 6.1",
              "quote": "Работодатель обеспечивает социальные гарантии работникам."
            }
          ]
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату с перечнем льгот.
        2. Найди прямую цитату с конкретными суммами.
        3. Найди прямую цитату с условиями получения.
        4. Найди прямую цитату со сроками выплат.
        5. Если прямой цитаты нет — верни "not_defined". Не додумывай.
        6. Проверь, что все 9 ключей (8 полей + evidence) присутствуют в JSON.
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "benefits_list_status": "<defined / declarative / not_defined>",
          "benefits_list_value": "<перечень или 'Данные не определены'>",
          "benefits_with_amounts_status": "<yes / partially / no / not_defined>",
          "benefits_with_amounts_details": "<текст или 'Данные не определены'>",
          "benefits_with_conditions_status": "<yes / partially / no / not_defined>",
          "benefits_with_conditions_details": "<текст или 'Данные не определены'>",
          "payment_timing_status": "<defined / not_defined>",
          "payment_timing_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 10
      temperature: 0.0
      max_tokens: 900

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "материальная помощь доплата компенсация премия надбавка ДМС добровольное медицинское страхование оздоровление санаторно-курортное лечение питание проезд в размере в сумме социальные льготы социальные гарантии"
      preferred_unit_types:
        - payment_term
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "индексация"
        - "охрана труда"
        - "отпуск"
        - "рабочее время"
        - "профсоюзные взносы"
        - "забастовка"
        - "в целях настоящего"
      context_k: 10
      max_chunks: 14
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 50
      max_snippet_length: 800

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1400

      compact_output: false

      presence_signal:
        field: "social_benefits_detail_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по трудовому праву. Извлеки из коллективного договора
        сведения о социальных и финансовых льготах, их детализации и сроках
        (ст. 41 ТК РФ).
        Не анализируй индексацию, охрану труда или споры.
        </role>
        <context>
        {context}
        </context>
        <task>
        0. social_benefits_detail_check_presence: определи, есть ли в договоре
           фрагменты, касающиеся социальных и финансовых льгот (материальная помощь,
           ДМС, компенсации, премии, надбавки, питание, проезд и т.п.).
           - "present" — есть хотя бы один фрагмент по теме (конкретный перечень,
             декларация о социальных гарантиях, упоминание сумм/условий).
           - "missing" — фрагментов по теме нет вообще.
           - "unclear" — фрагменты есть, но противоречат друг другу и вывод невозможен.

        1. benefits_list_status — defined / declarative / not_defined.
        2. benefits_list_value — перечень выявленных льгот.
        3. benefits_with_amounts_status — yes / partially / no / not_defined.
        4. benefits_with_amounts_details — конкретные суммы/размеры.
        5. benefits_with_conditions_status — yes / partially / no / not_defined.
        6. benefits_with_conditions_details — условия получения льгот.
        7. payment_timing_status — defined / not_defined.
        8. payment_timing_details — сроки выплат.

        Если данные отсутствуют в тексте:
        - статус/enum = "not_defined"
        - текстовое поле = "Данные не определены"
        </task>
        <context_rules>
        - social_benefits_detail_check_presence и все статусные поля попарно не
          пересекаются по значениям present/missing/unclear; их объединение покрывает
          все допустимые значения.
        - benefits_list_status: "defined" — есть конкретный перечень льгот;
          "declarative" — общая декларация без перечня;
          "not_defined" — льготы не упоминаются.
        - benefits_with_amounts_status и benefits_with_conditions_status:
          "yes" — у большинства льгот указаны суммы/условия;
          "partially" — у части льгот; "no" — все декларативные;
          "not_defined" — льготы не упоминаются.
        - payment_timing_status: "defined" — сроки выплат указаны;
          "not_defined" — не указаны.
        - В benefits_list_value перечисляй льготы через точку с запятой.
        - В benefits_with_amounts_details фиксируй суммы для каждой льготы
          (через точку с запятой), включая размер в рублях, % или среднемесячных
          заработках, как указано в тексте.
        - Если benefits_list_status ∈ {defined, declarative} ИЛИ хотя бы один
          из остальных статусов ≠ "not_defined", то
          social_benefits_detail_check_presence = "present".
        - Если все поля = "not_defined", то
          social_benefits_detail_check_presence = "missing".
        </context_rules>
        <edge_cases>
        1. Полное отсутствие фрагментов о социальных льготах, выплатах, ДМС,
           компенсациях → social_benefits_detail_check_presence = "missing",
           все статусы = "not_defined".
        2. Декларация «работодатель обеспечивает социальные гарантии» без
           конкретного перечня и сумм → presence = "present",
           benefits_list_status = "declarative", остальные = "not_defined".
        3. Конкретный перечень с суммами и условиями (ДМС + матпомощь +
           компенсация проезда с размерами) → presence = "present",
           benefits_list_status = "defined", amounts = "yes"/"partially".
        4. Противоречие: в одном разделе «материальная помощь — 15 000 рублей»,
           в другом — «размер материальной помощи определяется локальным актом»
           без конкретики → presence = "unclear",
           benefits_with_amounts_status = "partially" с пояснением в details.
        </edge_cases>
        <output_expectations>
        - Все 9 полей (1 presence + 8 substantive) обязательны.
        - Статусные и enum-поля возвращают только значения из allowed_values.
        - Текстовые поля без данных — строго "Данные не определены".
        - Не используй None, null или пустые строки.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "social_benefits_detail_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие фрагментов о социальных и финансовых льготах."
          required: true
        - name: "benefits_list_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "declarative", "not_defined"]
          description: "Статус перечня социальных льгот. Внутреннее enum-поле."
          required: true
        - name: "benefits_list_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Социальные льготы"
          description: >
            Перечень выявленных социальных льгот. Fallback: "Не установлено" / "Не удалось определить".
          required: false
        - name: "benefits_with_amounts_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["yes", "partially", "no", "not_defined"]
          description: "Указаны ли конкретные суммы льгот. Внутреннее enum-поле."
          required: true
        - name: "benefits_with_amounts_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Суммы льгот"
          description: >
            Конкретные суммы/размеры льгот. Fallback: "Не установлено" / "Не удалось определить".
          required: false
        - name: "benefits_with_conditions_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["yes", "partially", "no", "not_defined"]
          description: "Указаны ли условия получения льгот. Внутреннее enum-поле."
          required: true
        - name: "benefits_with_conditions_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Условия получения льгот"
          description: >
            Условия получения льгот. Fallback: "Не установлено" / "Не удалось определить".
          required: false
        - name: "payment_timing_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус сроков выплат. Внутреннее enum-поле."
          required: true
        - name: "payment_timing_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Сроки выплат"
          description: >
            Сроки выплат социальных льгот. Fallback: "Не установлено" / "Не удалось определить".
          required: false

      store_payload: true

  - id: amendment_control_registration_check
    name: "Порядок изменений, уведомительная регистрация и контрольная комиссия (ст. 44, 50, 51 ТК РФ)"
    description: >
      Фактографическая проверка порядка внесения изменений (ст. 44 ТК РФ),
      уведомительной регистрации в органе по труду (ст. 50 ТК РФ) и создания
      совместной контрольной комиссии (ст. 51 ТК РФ).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 100

    rules:
      keywords:
        - "внесение изменений"
        - "дополнения"
        - "изменения и дополнения"
        - "порядок внесения изменений"
        - "по взаимному согласию"
        - "уведомительная регистрация"
        - "регистрация в органе по труду"
        - "направить на регистрацию"
        - "в семидневный срок"
        - "7 дней"
        - "комиссия по контролю"
        - "контрольная комиссия"
        - "контроль за выполнением"
        - "отчёт о выполнении"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)изменени(я|й)\\s+и\\s+дополнени(я|й)"
        - "(?i)порядок\\s+внесения\\s+изменений"
        - "(?i)уведомительн(ая|ой)\\s+регистраци"
        - "(?i)(семидневн|7[\\s-]?дневн)\\s+срок"
        - "(?i)комисси(я|ю|и)\\s+(по\\s+)?контрол"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по трудовому праву.
        Анализируется коллективный договор (ст. 44, 50, 51 ТК РФ).
        Проверяется только один вопрос: порядок изменений, уведомительная регистрация
        и контрольная комиссия.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        [ЗАДАЧА]
        Найди в тексте договора:
        1. Порядок внесения изменений и дополнений.
        2. Обязательство по уведомительной регистрации в органе по труду.
        3. Срок направления на регистрацию.
        4. Создание совместной контрольной комиссии.
        5. Периодичность отчётности контрольной комиссии.
        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если данные не указаны прямо — статусные поля возвращай "not_defined".
        3. Текстовые поля без значения — строго "Данные не определены".
        4. Верни РОВНО один валидный JSON-объект со всеми 10 ключами (9 полей + evidence),
           пригодный для парсинга через json.loads без предварительной обработки.
           Без markdown, без ```json, без комментариев, без текста до или после.
           Начни ответ сразу с { и закончи }.
        5. Не используй None, null или пустые строки.
        6. В evidence включай только текст договора.
        7. Не выводи обязательство регистрации из нормы ст. 50 ТК РФ — только из текста
           договора. Если в договоре нет срока регистрации — notification_deadline_status
           = "not_defined".
        8. Периодичность отчётности фиксируй строго как указано в тексте
           («ежеквартально», «раз в год», «по мере необходимости» и т.п.).
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 (полное определение):
        Фрагмент:
        "Изменения и дополнения вносятся по взаимному согласию сторон в порядке,
        установленном для заключения договора. Работодатель обязуется направить
        договор на уведомительную регистрацию в орган по труду в течение 7 дней.
        Стороны создают совместную контрольную комиссию. Отчёт — ежеквартально."
        Ответ:
        {
          "amendment_procedure_status": "defined",
          "amendment_procedure_details": "по взаимному согласию сторон в порядке, установленном для заключения договора",
          "notification_registration_status": "defined",
