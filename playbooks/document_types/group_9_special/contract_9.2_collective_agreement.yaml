      порядок присоединения или отказа, соотношение условий
      соглашения и коллективного договора, обязанности работодателя.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "medium"
    severity_if_pass: "pass"
    severity_if_fail: "medium"
    severity_if_unclear: "low"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 270

    rules:
      keywords:
        - "отраслевое соглашение"
        - "межотраслевое соглашение"
        - "региональное соглашение"
        - "территориальное соглашение"
        - "присоединение к соглашению"
        - "отказ от присоединения"
        - "условия соглашения"
        - "соответствие соглашению"
        - "превышение условий соглашения"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(отраслев|межотраслев|региональн|территориальн)[а-яё]+\\s+соглашени"
        - "(?i)присоединени[ея][а-яё]*\\s+к\\s+соглашени"
        - "(?i)отказ[а-яё]*\\s+от\\s+присоединени"
        - "(?i)соответстви[ея][а-яё]*\\s+.*соглашени"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по трудовому праву.
        Анализируется коллективный договор (ст. 48 ТК РФ).
        Проверяется только один вопрос: применение отраслевого
        (межотраслевого, регионального, территориального) соглашения.
        Нормативные ориентиры:
        - ст. 48 ТК РФ — порядок действия соглашения; если работодатель
          не направил мотивированный отказ в течение 30 дней после
          официального опубликования предложения о присоединении,
          соглашение считается распространённым на данного работодателя.
        - ст. 133.1 ТК РФ — региональное соглашение о минимальной
          заработной плате.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Различай: КД прямо указывает применяемое соглашение,
          только упоминает о его существовании или вообще не касается
          темы.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Указание на применяемое отраслевое / межотраслевое /
           региональное / территориальное соглашение.
        2. Порядок присоединения или отказа от присоединения
           к соглашению.
        3. Соотношение условий соглашения и коллективного договора
           (превышение, соответствие).
        4. Обязанность работодателя учитывать условия соглашения
           при формировании КД.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Для enum-полей (*_status) при отсутствии данных возвращай
           "not_defined".
        4. Для строковых *_details при отсутствии данных возвращай строго
           "Данные не определены".
        5. Не используй "None", "null", пустые строки или отсутствующие
           ключи.
        6. В evidence включай только прямые цитаты из текста договора.
        7. Различай:
           - "defined" — КД прямо называет соглашение и/или порядок
             присоединения с параметрами;
           - "declarative" — только общее упоминание о соглашении
             без конкретики;
           - "not_defined" — тема не раскрыта.
        8. В sectoral_agreement_details фиксируй название соглашения,
           если оно указано.
        9. В alignment_with_agreement_details фиксируй порядок
           соотношения условий (превышение, соответствие),
           если он указан.
        10. Верни РОВНО один валидный JSON-объект со всеми 9 ключами
            (8 полей + evidence), пригодный для парсинга через json.loads
            без предварительной обработки. Без markdown, без ```json,
            без комментариев, без текста до или после. Начни ответ сразу
            с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — полное покрытие:
        Фрагмент:
        "Коллективный договор разработан с учётом Отраслевого соглашения
        по организациям нефтяной, газовой отраслей промышленности
        и строительства объектов нефтегазового комплекса на 2025–2027 годы.
        Работодатель присоединился к Соглашению в порядке ст. 48 ТК РФ
        (уведомление от 15.01.2025). Условия коллективного договора
        не могут быть ниже условий Отраслевого соглашения."
        Ответ:
        {
          "sectoral_agreement_status": "defined",
          "sectoral_agreement_details": "Отраслевое соглашение по организациям нефтяной, газовой отраслей промышленности и строительства объектов нефтегазового комплекса на 2025–2027 годы",
          "joining_procedure_status": "defined",
          "joining_procedure_details": "присоединение в порядке ст. 48 ТК РФ (уведомление от 15.01.2025)",
          "alignment_with_agreement_status": "defined",
          "alignment_with_agreement_details": "условия КД не могут быть ниже условий Отраслевого соглашения",
          "application_obligation_status": "defined",
          "application_obligation_details": "КД разработан с учётом Отраслевого соглашения",
          "evidence": [
            {"clause_ref": "преамбула", "quote": "Коллективный договор разработан с учётом Отраслевого соглашения по организациям нефтяной, газовой отраслей промышленности и строительства объектов нефтегазового комплекса на 2025–2027 годы."},
            {"clause_ref": "п. 1.3", "quote": "Условия коллективного договора не могут быть ниже условий Отраслевого соглашения."}
          ]
        }

        Пример 2 — только упоминание:
        Фрагмент:
        "Работодатель учитывает положения отраслевых соглашений
        при разработке настоящего договора."
        Ответ:
        {
          "sectoral_agreement_status": "declarative",
          "sectoral_agreement_details": "учитывает положения отраслевых соглашений (без указания конкретного соглашения)",
          "joining_procedure_status": "not_defined",
          "joining_procedure_details": "Данные не определены",
          "alignment_with_agreement_status": "declarative",
          "alignment_with_agreement_details": "учитывает положения отраслевых соглашений (без указания порядка соотношения)",
          "application_obligation_status": "declarative",
          "application_obligation_details": "учитывает положения отраслевых соглашений при разработке договора",
          "evidence": [
            {"clause_ref": "п. 1.3", "quote": "Работодатель учитывает положения отраслевых соглашений при разработке настоящего договора."}
          ]
        }

        Пример 3 — тема не раскрыта:
        Фрагмент:
        "Стороны обязуются соблюдать трудовое законодательство."
        Ответ:
        {
          "sectoral_agreement_status": "not_defined",
          "sectoral_agreement_details": "Данные не определены",
          "joining_procedure_status": "not_defined",
          "joining_procedure_details": "Данные не определены",
          "alignment_with_agreement_status": "not_defined",
          "alignment_with_agreement_details": "Данные не определены",
          "application_obligation_status": "not_defined",
          "application_obligation_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямые цитаты по каждой из 4 тем.
        2. Разграничь defined / declarative.
        3. Если прямой цитаты нет — верни "not_defined". Не додумывай.
        4. Проверь, что все 9 ключей (8 полей + evidence) присутствуют
           в JSON.
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "sectoral_agreement_status": "<defined / declarative / not_defined>",
          "sectoral_agreement_details": "<текст или 'Данные не определены'>",
          "joining_procedure_status": "<defined / declarative / not_defined>",
          "joining_procedure_details": "<текст или 'Данные не определены'>",
          "alignment_with_agreement_status": "<defined / declarative / not_defined>",
          "alignment_with_agreement_details": "<текст или 'Данные не определены'>",
          "application_obligation_status": "<defined / declarative / not_defined>",
          "application_obligation_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 10
      temperature: 0.0
      max_tokens: 900

    retrieval:
      retrieval_profile: "definitions_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "отраслевое соглашение межотраслевое соглашение региональное соглашение территориальное соглашение присоединение к соглашению отказ от присоединения условия соглашения соответствие соглашению превышение условий соглашения ст. 48 ТК РФ"
      preferred_unit_types:
        - general_provision
        - obligation
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - boilerplate
        - definitions
      negative_keywords:
        - "профсоюзные взносы"
        - "забастовка"
        - "в целях настоящего"
      context_k: 10
      max_chunks: 14
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "boilerplate"
        - "definitions"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 700

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1200

      compact_output: false

      presence_signal:
        field: "sectoral_agreement_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по трудовому праву. Извлеки из коллективного
        договора сведения о применении отраслевого (межотраслевого,
        регионального, территориального) соглашения (ст. 48 ТК РФ).
        Не анализируй заработную плату, охрану труда, отпуска
        или споры.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. sectoral_agreement_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (sectoral_agreement_status, joining_procedure_status,
              alignment_with_agreement_status,
              application_obligation_status) ≠ "not_defined";
           - "missing" — если все четыре содержательных поля
             = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за
             противоречий вывод невозможен.

           Если presence = "missing":
           - все четыре *_status = "not_defined";
           - все *_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. sectoral_agreement_status:
           Используй только одно из значений:
           - "defined" — КД прямо называет применяемое
             отраслевое / межотраслевое / региональное /
             территориальное соглашение;
           - "declarative" — только общее упоминание о соглашениях
             без названия;
           - "not_defined" — тема не раскрыта.

        2. sectoral_agreement_details:
           Краткое user-facing описание применяемого соглашения
           (название, период действия).
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        3. joining_procedure_status:
           Используй только одно из значений:
           - "defined" — КД закрепляет порядок присоединения
             к соглашению или отказа от него;
           - "declarative" — только упоминание без порядка;
           - "not_defined" — тема не раскрыта.

        4. joining_procedure_details:
           Краткое user-facing описание порядка присоединения
           или отказа.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        5. alignment_with_agreement_status:
           Используй только одно из значений:
           - "defined" — КД закрепляет порядок соотношения условий
             (превышение, соответствие, приоритет);
           - "declarative" — только упоминание без порядка;
           - "not_defined" — тема не раскрыта.

        6. alignment_with_agreement_details:
           Краткое user-facing описание соотношения условий.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        7. application_obligation_status:
           Используй только одно из значений:
           - "defined" — КД закрепляет обязанность работодателя
             учитывать условия соглашения с параметрами;
           - "declarative" — только упоминание обязанности;
           - "not_defined" — тема не раскрыта.

        8. application_obligation_details:
           Краткое user-facing описание обязанности работодателя.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни sectoral_agreement_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона вместо текста договора.
        - Не делай выводов по типовой структуре договора.
        - Различай: "defined" — КД прямо называет соглашение и/или порядок присоединения; "declarative" — только общее упоминание.
        - В sectoral_agreement_details фиксируй название соглашения, если оно указано.
        - В alignment_with_agreement_details фиксируй порядок соотношения условий (превышение, соответствие), если он указан.
        - Если в разных фрагментах указаны противоречивые сведения — статус → "not_defined", текстовое поле → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни названия соглашения, ни порядка
           присоединения, ни соотношения условий, ни обязанности
           учитывать соглашение.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        2. Неполное раскрытие или только упоминание.
           а) Общая фраза: "Работодатель учитывает положения
              отраслевых соглашений" — только упоминание.
              → presence = "present";
                соответствующий *_status = "declarative".
           б) Прямо указано, что работодатель отказался
              от присоединения к соглашению.
              → presence = "present";
                соответствующий *_status = "defined";
                соответствующий *_details содержит дословную
                формулировку.

        3. Противоречие между фрагментами.
           В разных разделах договора названы разные соглашения
           или противоречивые условия их применения.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             соответствующий *_details = "Не удалось определить".

        4. Полное раскрытие условий.
           Указаны конкретное соглашение, порядок присоединения,
           соотношение условий КД и соглашения, обязанность
           работодателя.
           → presence = "present";
             все *_status = "defined";
             все *_details содержат конкретику.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для sectoral_agreement_check_presence используй только: "present", "missing", "unclear".
        - Для всех *_status используй только: "defined", "declarative", "not_defined".
        - Fallback при отсутствии данных:
          * все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "sectoral_agreement_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по отраслевому соглашению. Внутреннее агрегатное signal-поле."
          required: true

        - name: "sectoral_agreement_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "declarative", "not_defined"]
          description: "Статус указания применяемого соглашения. Внутреннее enum-поле."
          required: true

        - name: "sectoral_agreement_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Отраслевое соглашение"
          description: >
            Название применяемого отраслевого / межотраслевого / регионального соглашения. Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "joining_procedure_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "declarative", "not_defined"]
          description: "Статус порядка присоединения к соглашению. Внутреннее enum-поле."
          required: true

        - name: "joining_procedure_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Присоединение"
          description: >
            Порядок присоединения к соглашению или отказа от него. Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "alignment_with_agreement_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "declarative", "not_defined"]
          description: "Статус соотношения условий КД и соглашения. Внутреннее enum-поле."
          required: true

        - name: "alignment_with_agreement_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Соотношение условий"
          description: >
            Порядок соотношения условий КД и отраслевого соглашения. Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "application_obligation_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "declarative", "not_defined"]
          description: "Статус обязанности учитывать соглашение. Внутреннее enum-поле."
          required: true

        - name: "application_obligation_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Обязанность учитывать"
          description: >
            Обязанность работодателя учитывать условия соглашения. Fallback: "Не установлено" / "Не удалось определить".
          required: false

      store_payload: true

# ════════════════════════════════════════════════════════════════════════════
# БЛОК 5: DD_REQUEST_TEMPLATES
# Читается: DDRequestTemplateLoader
# ════════════════════════════════════════════════════════════════════════════

dd_request_templates:
  parties_and_representatives_check:
    text: >
      Просим предоставить по {doc_names}: (а) полные реквизиты работодателя;
      (б) наименование представительного органа работников и документы,
      подтверждающие полномочия (протокол собрания/конференции, доверенность, приказ);
      (в) ФИО и должности уполномоченных представителей обеих сторон.
    addressee: "Обе стороны"

  term_scope_coverage_check:
    text: >
      Просим уточнить в {doc_names}: (а) дату начала и окончания действия;
      (б) подтверждение, что срок не превышает 3 лет (ст. 43 ТК РФ);
      (в) условия и порядок продления; (г) сферу действия (организация / филиал /
      подразделение); (д) подтверждение распространения на всех работников
      независимо от членства в профсоюзе.
    addressee: "Обе стороны"

  no_worsening_principle_check:
    text: >
      Просим проверить {doc_names} на наличие: (а) явного указания на недопустимость
      ухудшения положения работников (ст. 9, 50 ТК РФ); (б) потенциально ухудшающих
      условий (снижение гарантий, замена льгот, отказ от прав).
    addressee: "Юридический советник / Орган по труду"

  wage_indexation_check:
    text: >
      Просим уточнить в {doc_names}: конкретный механизм индексации заработной платы
      (ст. 134 ТК РФ) — привязка к ИПЦ, фиксированный процент, периодичность,
      порядок принятия решения. Общие декларации без конкретики недостаточны.
    addressee: "Работодатель / Финансовая служба"

  union_activity_guarantees_check:
    text: >
      Просим предоставить по {doc_names}: (а) подтверждение предоставления помещения
      профсоюзу; (б) порядок освобождения профсоюзных работников от основной работы;
      (в) механизм перечисления профсоюзных взносов; (г) гарантии при увольнении
      профсоюзных работников (ст. 374–377 ТК РФ).
    addressee: "Работодатель"

  multiple_unions_check:
    text: >
      В {doc_names} выявлено наличие нескольких профсоюзных организаций. Просим
      предоставить: (а) протокол создания единого представительного органа;
      (б) подтверждение пропорционального представительства; (в) документы по ст. 37 ТК РФ.
    addressee: "Представители работников"

  job_security_retraining_check:
    text: >
      Просим уточнить в {doc_names}: (а) конкретные гарантии занятости при реструктуризации;
      (б) обязательства по переподготовке; (в) размер дополнительного выходного пособия;
      (г) приоритеты при повторном трудоустройстве.
    addressee: "Работодатель"

  reorganization_succession_check:
    text: >
      Просим уточнить в {doc_names}: (а) порядок действия договора при реорганизации
      (ст. 43 ТК РФ); (б) обязательства правопреемника; (в) порядок при смене формы
      собственности (3 месяца); (г) последствия ликвидации.
    addressee: "Юридический советник работодателя"

  social_benefits_detail_check:
    text: >
      Просим детализировать в {doc_names} социальные обязательства: указать конкретные
      размеры (суммы в рублях или процентах), условия получения, круг получателей,
      сроки выплат, источники финансирования.
    addressee: "Работодатель / Финансовая служба"

  amendment_control_registration_check:
    text: >
      Просим уточнить в {doc_names}: (а) порядок внесения изменений и дополнений
      (ст. 44 ТК РФ); (б) обязательство направить договор на уведомительную
      регистрацию в орган по труду в 7-дневный срок (ст. 50 ТК РФ); (в) создание
      совместной контрольной комиссии и периодичность отчётности (ст. 51 ТК РФ).
    addressee: "Обе стороны"

  dispute_resolution_liability_check:
    text: >
      Просим согласовать в {doc_names} поэтапную процедуру разрешения разногласий:
      переговоры → примирительная комиссия → посредник/медиатор → трудовой арбитраж
      (ст. 398–418 ТК РФ). Просим уточнить ответственность сторон за невыполнение
      обязательств (ст. 55 ТК РФ, ст. 5.28–5.31 КоАП РФ).
    addressee: "Обе стороны"

  working_conditions_safety_check:
    text: >
      Просим уточнить в {doc_names}: (а) режимы рабочего времени; (б) продолжительность
      ежегодного и дополнительных отпусков; (в) перечень мероприятий по охране труда
      и объём финансирования (не менее 0,2% от затрат на производство);
      (г) результаты СОУТ и классы условий труда; (д) размеры доплат и дополнительных
      отпусков за вредные/опасные условия; (е) порядок обеспечения СИЗ и медосмотров.
    addressee: "Работодатель / Служба охраны труда"

  _default:
    text: >
      Просим предоставить дополнительную информацию по вопросу «{check_name}»
      применительно к {doc_names}.
    addressee: "Юридический советник"
