        </context>

        <task>
        Заполни строго следующие 6 полей + evidence (всего 7 ключей):

        0. founder_liability_for_damages_check_presence:
          Агрегатное signal-поле — наличие условия об ответственности
          учредителей за убытки.
          - "present" — если хотя бы одно из содержательных полей
            (damages_liability_status, damages_liability_type,
              damages_liability_scope_status) ≠ "not_defined";
          - "missing" — если все три содержательных поля = "not_defined";
          - "unclear" — если фрагменты по теме есть, но из-за противоречий
            вывод невозможен.

          Если presence = "missing":
          - damages_liability_status = "not_defined";
          - damages_liability_type = "not_defined";
          - damages_liability_scope_status = "not_defined";
          - damages_liability_details = "Данные не определены";
          - damages_liability_scope_details = "Данные не определены";
          - damages_liability_compliance = "not_checkable";
          - не выполняй остальные шаги.

        1. damages_liability_status:
          - "defined" — если в тексте прямо указано условие об
            ответственности учредителей за убытки, причинённые
            обществу или другим учредителям;
          - "not_defined" — если нет.

        2. damages_liability_details:
          Текст условия об ответственности так, как указано в договоре.
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".

        3. damages_liability_type:
          - "penalty"      — только неустойка (штраф, пени);
          - "damages"      — только возмещение убытков;
          - "both"         — сочетание неустойки и возмещения убытков;
          - "not_defined"  — тип прямо не указан.

        4. damages_liability_scope_status:
          - "defined" — если в тексте прямо перечислены основания
            возникновения убытков (недостоверные заверения, срыв
            регистрации, неоплата доли, разглашение информации и т. п.);
          - "not_defined" — если основания прямо не указаны.

        5. damages_liability_scope_details:
          Перечень оснований возникновения убытков так, как указано
          в договоре.
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".

        6. damages_liability_compliance — соответствие смыслу
          ст. 15, 393, 431.2 ГК РФ:
          - "compliant"      — условие указано, основания определены,
                                тип ответственности соответствует закону;
          - "incomplete"     — условие указано, но основания не
                                конкретизированы;
          - "missing"        — условие отсутствует;
          - "not_checkable"  — недостаточно данных.

        7. evidence — массив цитат из текста договора.
        </task>

        <context_rules>
        - Перед остальными полями заполни founder_liability_for_damages_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", damages_liability_type = "not_defined", damages_liability_compliance = "not_checkable", все *_details = "Данные не определены".
        - Используй только текст договора, без внешних знаний.
        - Не путай внутреннюю ответственность учредителей друг перед другом
          и перед обществом (этот чек) с солидарно-субсидиарной
          ответственностью перед третьими лицами до регистрации
          (solidary_liability_check).
        - Основания ответственности фиксируй строго по тексту: недостоверные
          заверения (ст. 431.2 ГК РФ), срыв регистрации, неоплата или
          несвоевременная оплата доли, разглашение конфиденциальной
          информации, иные прямо названные.
        - Не путай "not_defined" и "not_applicable": not_applicable — только если условие неприменимо по природе сделки.
        - Состояния "partial" / "unclear" / "отсылка" отражай через details-поле; в status-полях допустимо только "defined" / "not_defined".
        - Если status = "not_defined" — details = "Данные не определены".
        - Не используй пустые строки, "None", "null".
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
          В договоре нет ни условия об ответственности за убытки,
          ни перечня оснований.
          → presence = "missing";
            damages_liability_status = "not_defined";
            damages_liability_type = "not_defined";
            damages_liability_scope_status = "not_defined";
            damages_liability_compliance = "not_checkable";
            все *_details = "Данные не определены".

        2. Неполное раскрытие темы.
          Условие об ответственности указано без перечня оснований
          («виновный учредитель возмещает убытки»).
          → presence = "present";
            damages_liability_status = "defined";
            damages_liability_scope_status = "not_defined";
            damages_liability_compliance = "incomplete".

        3. Противоречие между фрагментами.
          В разных частях договора указаны разные типы ответственности
          или разные размеры неустойки; конфликт нельзя разрешить
          по тексту.
          → presence = "unclear";
            damages_liability_status = "not_defined";
            damages_liability_type = "not_defined";
            соответствующие *_details = "Не удалось определить".

        4. Специфика темы — ответственность только за один вид убытков.
          В договоре прямо указано, что учредитель отвечает только
          за убытки от срыва регистрации, без указания иных оснований.
          → presence = "present";
            damages_liability_status = "defined";
            damages_liability_scope_status = "defined";
            damages_liability_scope_details содержит цитату без
            добавления иных оснований.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для founder_liability_for_damages_check_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined", "not_defined".
        - Для damages_liability_type используй только: "penalty", "damages", "both", "not_defined".
        - Для damages_liability_compliance используй только: "compliant", "incomplete", "missing", "not_checkable".
        - Fallback при отсутствии данных: все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности: соответствующие *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "founder_liability_for_damages_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие условия об ответственности учредителей за убытки. Внутреннее агрегатное signal-поле."
          required: true

        - name: "damages_liability_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус наличия условия об ответственности за убытки. Внутреннее enum-поле."
          required: true

        - name: "damages_liability_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Ответственность за убытки"
          description: "Текст условия об ответственности учредителей за убытки, причинённые обществу или другим учредителям."
          required: true

        - name: "damages_liability_type"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["penalty", "damages", "both", "not_defined"]
          display_in_grid: false
          description: "Тип ответственности: неустойка / возмещение убытков / оба. Внутреннее enum-поле."
          required: true

        - name: "damages_liability_scope_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания оснований возникновения убытков. Внутреннее enum-поле."
          required: true

        - name: "damages_liability_scope_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Основания ответственности"
          description: "Перечень оснований возникновения убытков (недостоверные заверения, срыв регистрации, неоплата доли, разглашение информации и т. п.)."
          required: true

        - name: "damages_liability_compliance"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["compliant", "incomplete", "missing", "not_checkable"]
          display_in_grid: false
          description: "Соответствие условия об ответственности смыслу ст. 15, 393, 431.2 ГК РФ. Внутреннее enum-поле."
          required: true

      store_payload: true

  - id: share_non_payment_consequences_check
    name: "Последствия неоплаты доли: неустойка и переход доли к обществу (ст. 16 ФЗ-14)"
    description: >
      Фактографическая проверка последствий неоплаты или несвоевременной
      оплаты доли учредителем: наличие в договоре условия о неустойке
      (штрафе, пенях) за нарушение срока оплаты, указание размера и
      порядка расчёта неустойки, а также фиксация условия о переходе
      неоплаченной доли к обществу (ст. 16 п. 3 ФЗ-14). Отсутствие условия
      о неустойке не является дефектом (норма диспозитивная), однако
      отсутствие указания на переход доли к обществу при неоплате в срок,
      превышающий установленный законом, создаёт риск для учредителей.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "неустойка"
        - "штраф"
        - "пени"
        - "неоплата доли"
        - "несвоевременная оплата"
        - "просрочка оплаты"
        - "переход доли к обществу"
        - "неоплаченная доля"
        - "утрата доли"
        - "срок оплаты доли"
      keyword_mode: "any"
      regex_patterns:
        - '(?i)неустойк|штраф|пен[иья]'
        - '(?i)неоплат[а-яё]+\\s+дол'
        - '(?i)переход[а-яё]+\\s+дол[иья]\\s+к\\s+обществ'
        - '(?i)просрочк[а-яё]+\\s+оплат'

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по корпоративному праву. Анализируется
        договор об учреждении общества (ст. 16 п. 1, п. 3 ФЗ-14 «Об ООО»,
        ст. 330 ГК РФ). Проверяется только один вопрос: содержит ли текст
        договора условия о последствиях неоплаты или несвоевременной
        оплаты доли учредителем.

        Нормативный ориентир:
        - ст. 16 п. 1 ФЗ-14 — обязанность оплатить долю в срок,
          определённый договором об учреждении (не более 4 месяцев
          с даты государственной регистрации).
        - ст. 16 п. 3 ФЗ-14 — договором об учреждении может быть
          предусмотрена неустойка (штраф, пени) за неисполнение
          обязанности по оплате долей.
        - ст. 23 п. 3 ФЗ-14 — неоплаченная доля переходит к обществу.
        - ст. 330 ГК РФ — неустойка.

        Важно:
        - Твоя задача — установить факты из текста договора.
        - Отсутствие условия о неустойке не является дефектом
          (норма диспозитивная).
        - Переход неоплаченной доли к обществу — императивное
          последствие по ст. 23 п. 3 ФЗ-14, независимо от упоминания
          в договоре; в этом чеке фиксируется именно текстовое условие.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Условие о неустойке (штрафе, пенях) за неоплату или
          несвоевременную оплату доли.
        2. Размер неустойки и порядок её расчёта (если указаны).
        3. Условие о переходе неоплаченной доли к обществу.

        [ПРАВИЛА]
        1. Используй только текст договора.
        2. Не подставляй нормы закона вместо текста договора.
        3. verdict = "pass" — условие о неустойке указано прямо
          (с размером или без него) или прямо указан переход доли
          к обществу.
        4. verdict = "unclear" — есть общая отсылка к ответственности
          за неоплату без конкретики.
        5. verdict = "fail" — условия отсутствуют.
        6. Верни РОВНО один валидный JSON-объект со всеми 4 ключами
          (verdict, confidence, reason, evidence), пригодный для парсинга
          через json.loads без предварительной обработки. Без markdown,
          без ```json, без комментариев, без текста до или после.
          Начни ответ сразу с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — условия указаны (pass):
        Фрагмент:
        "При нарушении срока оплаты доли, установленного п. 4.1 настоящего
        договора, учредитель уплачивает неустойку в размере 0,1% от
        неоплаченной суммы за каждый день просрочки. Неоплаченная доля
        переходит к Обществу в порядке, установленном ст. 23 ФЗ-14."

        Ответ:
        {
          "verdict": "pass",
          "confidence": 0.95,
          "reason": "Указаны неустойка с размером и условие о переходе неоплаченной доли к обществу.",
          "evidence": [
            {"clause_ref": "п. 4.2", "quote": "При нарушении срока оплаты доли, установленного п. 4.1 настоящего договора, учредитель уплачивает неустойку в размере 0,1% от неоплаченной суммы за каждый день просрочки."}
          ]
        }

        Пример 2 — условия отсутствуют (fail):
        Фрагмент:
        "Учредители оплачивают доли в уставном капитале в течение
        4 месяцев с даты государственной регистрации Общества."

        Ответ:
        {
          "verdict": "fail",
          "confidence": 0.90,
          "reason": "В договоре указан срок оплаты, но отсутствуют условия о неустойке и о переходе неоплаченной доли к обществу.",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямое условие о неустойке (штрафе, пенях)?
        2. Указан ли размер неустойки и порядок её расчёта?
        3. Есть ли прямое условие о переходе неоплаченной доли
          к обществу?
        4. Не путать с ответственностью за убытки по другим основаниям
          (founder_liability_for_damages_check).

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "verdict": "<pass / fail / unclear>",
          "confidence": <0.0–1.0>,
          "reason": "<краткое объяснение вердикта>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 600

    retrieval:
      retrieval_profile: "payment_terms_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "неустойка штраф пени неоплата доли несвоевременная оплата просрочка оплаты доли переход неоплаченной доли к обществу утрата доли ст. 16 ФЗ-14"
      preferred_unit_types:
        - liability_provision
        - payment_term
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - remedies
        - obligations
        - procedures
      negative_keywords:
        - "уставный капитал"
        - "номинальная стоимость"
        - "неденежный вклад"
        - "оценка"
        - "корпоративный договор"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.30, 0.80]
        boost: 0.30
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "remedies"
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1000

      compact_output: false

      presence_signal:
        field: "share_non_payment_consequences_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по корпоративному праву. Извлекаешь из
        договора об учреждении условия о последствиях неоплаты или
        несвоевременной оплаты доли учредителем (ст. 16 п. 1, п. 3 ФЗ-14
        «Об ООО», ст. 330 ГК РФ). Не анализируешь общие условия об
        ответственности за убытки (founder_liability_for_damages_check),
        уставный капитал, порядок определения размера долей и оценку
        неденежных вкладов — эти темы проверяются отдельными чеками.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 6 полей + evidence (всего 7 ключей):

        0. share_non_payment_consequences_check_presence:
          Агрегатное signal-поле — наличие условий о последствиях
          неоплаты доли.
          - "present" — если хотя бы одно из содержательных полей
            (non_payment_penalty_status, share_transfer_to_company_status)
            ≠ "not_defined";
          - "missing" — если оба содержательных поля = "not_defined";
          - "unclear" — если фрагменты по теме есть, но из-за противоречий
            вывод невозможен.

          Если presence = "missing":
          - non_payment_penalty_status = "not_defined";
          - share_transfer_to_company_status = "not_defined";
          - non_payment_penalty_details = "Данные не определены";
          - non_payment_penalty_amount = "Данные не определены";
          - share_transfer_to_company_details = "Данные не определены";
          - non_payment_compliance = "not_checkable";
          - не выполняй остальные шаги.

        1. non_payment_penalty_status:
          - "defined" — если в тексте прямо указано условие о неустойке
            (штрафе, пенях) за неоплату или несвоевременную оплату доли;
          - "not_defined" — если нет.

        2. non_payment_penalty_details:
          Текст условия о неустойке так, как указано в договоре.
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".

        3. non_payment_penalty_amount:
          Размер неустойки и порядок её расчёта, если прямо указаны
          (например, «0,1% от неоплаченной суммы за каждый день
          просрочки»).
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".

        4. share_transfer_to_company_status:
          - "defined" — если в тексте прямо указано условие о переходе
            неоплаченной доли к обществу;
          - "not_defined" — если нет.

        5. share_transfer_to_company_details:
          Текст условия о переходе неоплаченной доли к обществу.
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".

        6. non_payment_compliance — соответствие ст. 16 п. 1, п. 3 ФЗ-14:
          - "compliant"       — указаны срок оплаты и хотя бы одно
                                последствие (неустойка или переход доли
                                к обществу);
          - "partial"         — указано только одно из последствий;
          - "missing"         — последствия не указаны, но срок оплаты
                                указан;
          - "not_checkable"   — недостаточно данных.

        7. evidence — массив цитат из текста договора.
        </task>

        <context_rules>
        - Перед остальными полями заполни share_non_payment_consequences_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", non_payment_compliance = "not_checkable", все *_details/*_amount = "Данные не определены".
        - Используй только текст договора, без внешних знаний.
        - Не путай неустойку за неоплату доли с иными видами ответственности
          (за убытки, за недостоверные заверения — это founder_liability_for_damages_check).
        - Переход неоплаченной доли к обществу по ст. 23 п. 3 ФЗ-14 —
          императивное последствие, но в этом чеке фиксируется именно
          текстовое условие, если оно прямо указано в договоре.
        - Отсутствие условия о неустойке не является дефектом —
          норма диспозитивная.
        - Не путай "not_defined" и "not_applicable": not_applicable — только если условие неприменимо по природе сделки.
        - Состояния "partial" / "unclear" / "отсылка" отражай через details-поле; в status-полях допустимо только "defined" / "not_defined".
        - Если status = "not_defined" — details = "Данные не определены".
        - Не используй пустые строки, "None", "null".
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
          В договоре нет ни условия о неустойке, ни условия о переходе
          неоплаченной доли к обществу.
          → presence = "missing";
            non_payment_penalty_status = "not_defined";
            share_transfer_to_company_status = "not_defined";
            non_payment_compliance = "not_checkable";
            все *_details/*_amount = "Данные не определены".

        2. Указана только неустойка, переход доли не указан.
          В договоре прямо предусмотрена неустойка за неоплату, но
          условие о переходе доли к обществу отсутствует.
          → presence = "present";
            non_payment_penalty_status = "defined";
            share_transfer_to_company_status = "not_defined";
            non_payment_compliance = "partial".

        3. Противоречие между фрагментами.
          В разных частях договора указаны разные размеры неустойки
          или разные условия о переходе доли; конфликт нельзя разрешить
          по тексту.
          → presence = "unclear";
            non_payment_penalty_status = "not_defined";
            соответствующие *_details = "Не удалось определить".

        4. Только общая отсылка к закону.
          В договоре указано «последствия неоплаты доли определяются
          законодательством РФ» без конкретики.
          → presence = "present";
            non_payment_penalty_status = "not_defined";
            share_transfer_to_company_status = "not_defined";
            non_payment_compliance = "missing".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для share_non_payment_consequences_check_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined", "not_defined".
        - Для non_payment_compliance используй только: "compliant", "partial", "missing", "not_checkable".
        - Fallback при отсутствии данных: все *_details/*_amount → "Данные не определены".
        - Fallback при противоречии или неоднозначности: соответствующие *_details/*_amount → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "share_non_payment_consequences_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие условий о последствиях неоплаты доли. Внутреннее агрегатное signal-поле."
          required: true

        - name: "non_payment_penalty_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус наличия условия о неустойке за неоплату доли. Внутреннее enum-поле."
          required: true

        - name: "non_payment_penalty_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Неустойка за неоплату"
          description: "Текст условия о неустойке (штрафе, пенях) за неоплату или несвоевременную оплату доли."
          required: true

        - name: "non_payment_penalty_amount"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Размер неустойки"
          description: "Размер неустойки и порядок её расчёта (например, «0,1% от неоплаченной суммы за каждый день просрочки»)."
          required: false

        - name: "share_transfer_to_company_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус условия о переходе неоплаченной доли к обществу. Внутреннее enum-поле."
          required: true

        - name: "share_transfer_to_company_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Переход доли к обществу"
          description: "Текст условия о переходе неоплаченной доли к обществу (ст. 23 п. 3 ФЗ-14)."
          required: false

        - name: "non_payment_compliance"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["compliant", "partial", "missing", "not_checkable"]
          display_in_grid: false
          description: "Соответствие условий о последствиях неоплаты доли ст. 16 п. 1, п. 3 ФЗ-14. Внутреннее enum-поле."
          required: true

      store_payload: true

  - id: post_registration_share_transfer_check
    name: "Порядок отчуждения доли и включения нового участника после регистрации (ст. 21 ФЗ-14)"
    description: >
      Фактографическая проверка наличия в договоре об учреждении правил
      отчуждения доли после государственной регистрации: преимущественное
      право покупки доли другими участниками, необходимость согласия
      участников на отчуждение третьему лицу, порядок включения нового
      участника, ограничения на отчуждение. Фиксируется также указание
      на необходимость включения соответствующих положений в устав
      (для ООО) или акционерное соглашение (для АО). Не покрывает
      предрегистрационные изменения состава учредителей —
      см. amendment_before_registration_check. Не покрывает наследование
      доли — см. inheritance_of_share_check.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "преимущественное право"
        - "преимущественное право покупки"
        - "отчуждение доли"
        - "продажа доли"
        - "отчуждение третьему лицу"
        - "согласие участников"
        - "согласие учредителей"
        - "включение нового участника"
        - "прием нового участника"
        - "уступка доли"
        - "ограничение отчуждения"
      keyword_mode: "any"
      regex_patterns:
        - '(?i)преимущественн[а-яё]+\\s+прав'
        - '(?i)отчуждени[ея]\\s+дол'
        - '(?i)уступк[а-яё]+\\s+дол'
        - '(?i)включени[ея]\\s+нов[а-яё]+\\s+участник'
        - '(?i)согласи[ея]\\s+(всех\\s+)?(участник|учредител)'

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по корпоративному праву. Анализируется
        договор об учреждении общества (ст. 21 ФЗ-14 «Об ООО»,
        ст. 7 ФЗ-208 «Об АО», ст. 89.1 ГК РФ). Проверяется только один
        вопрос: содержит ли текст договора правила отчуждения доли после
        государственной регистрации и включения нового участника.

        Нормативный ориентир:
        - ст. 21 ФЗ-14 — переход доли в уставном капитале ООО,
          преимущественное право покупки, согласие участников.
        - ст. 7 ФЗ-208 — преимущественное право приобретения акций.
        - ст. 89.1 п. 3 ГК РФ — после регистрации внутренние отношения
          ООО регулируются уставом; договор об учреждении может
          содержать условия, подлежащие включению в устав.

        Важно:
        - Твоя задача — установить факты из текста договора.
        - Не оценивай достаточность ограничений.
        - Не путай с предрегистрационными изменениями состава учредителей
          (amendment_before_registration_check).
        - Не путай с наследованием доли (inheritance_of_share_check).

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Правила отчуждения доли (уступки, продажи) после регистрации.
        2. Преимущественное право покупки доли другими участниками.
        3. Необходимость согласия участников на отчуждение третьему лицу.
        4. Порядок включения нового участника.

        [ПРАВИЛА]
        1. Используй только текст договора.
        2. Не подставляй нормы закона вместо текста договора.
        3. verdict = "pass" — правила отчуждения указаны прямо
          (преимущественное право и/или согласие участников).
        4. verdict = "unclear" — правила упомянуты частично или размыто.
        5. verdict = "fail" — правила отсутствуют.
        6. Верни РОВНО один валидный JSON-объект со всеми 4 ключами
          (verdict, confidence, reason, evidence), пригодный для парсинга
          через json.loads без предварительной обработки. Без markdown,
          без ```json, без комментариев, без текста до или после.
          Начни ответ сразу с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — правила указаны (pass):
        Фрагмент:
        "После государственной регистрации Общества участники имеют
        преимущественное право покупки доли, отчуждаемой другим участником,
        по цене предложения третьему лицу. Отчуждение доли третьему лицу
        допускается только с согласия всех остальных участников. Включение
        нового участника осуществляется путём внесения изменений в устав
        на основании решения общего собрания."

        Ответ:
        {
          "verdict": "pass",
          "confidence": 0.95,
          "reason": "Прямо указаны преимущественное право покупки, необходимость согласия участников и порядок включения нового участника.",
          "evidence": [
            {"clause_ref": "п. 6.3", "quote": "После государственной регистрации Общества участники имеют преимущественное право покупки доли, отчуждаемой другим участником, по цене предложения третьему лицу."}
          ]
        }

        Пример 2 — правила отсутствуют (fail):
        Фрагмент:
        "Учредители обязуются создать общество с уставным капиталом
        100 000 рублей. Доли распределяются пропорционально вкладам."

        Ответ:
        {
          "verdict": "fail",
          "confidence": 0.90,
          "reason": "В договоре отсутствуют правила отчуждения доли после государственной регистрации.",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямое условие о преимущественном праве покупки?
        2. Есть ли требование согласия участников на отчуждение
          третьему лицу?
        3. Указан ли порядок включения нового участника?
        4. Не путать с предрегистрационными изменениями
          (amendment_before_registration_check) и наследованием
          (inheritance_of_share_check).

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "verdict": "<pass / fail / unclear>",
          "confidence": <0.0–1.0>,
          "reason": "<краткое объяснение вердикта>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 700

    retrieval:
      retrieval_profile: "party_identification_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "преимущественное право покупки доли отчуждение доли продажа доли уступка доли отчуждение третьему лицу согласие участников включение нового участника ограничение отчуждения ст. 21 ФЗ-14"
      preferred_unit_types:
        - obligation
        - general_provision
        - covenants
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - procedures
        - obligations
        - representations
      negative_keywords:
        - "уставный капитал"
        - "номинальная стоимость"
        - "оплата доли"
        - "неденежный вклад"
        - "оценка"
        - "регистрация в ФНС"
        - "директор"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.50, 0.95]
        boost: 0.30
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "procedures"
        - "obligations"
        - "representations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1100

      compact_output: false

      presence_signal:
        field: "post_registration_share_transfer_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по корпоративному праву. Извлекаешь из
        договора об учреждении правила отчуждения доли и включения нового
        участника после государственной регистрации (ст. 21 ФЗ-14
        «Об ООО», ст. 7 ФЗ-208 «Об АО»). Учитывай, что для ООО внутренние
        отношения после регистрации регулируются уставом (ст. 89.1 п. 3
        ГК РФ), а договор об учреждении может содержать условия,
        подлежащие включению в устав; для АО договор о создании
        утрачивает силу (ст. 9 п. 1 ФЗ-208). Не анализируешь
        предрегистрационные изменения (amendment_before_registration_check)
        и наследование доли (inheritance_of_share_check) — эти темы
        проверяются отдельными чеками.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 7 полей + evidence (всего 8 ключей):

        0. post_registration_share_transfer_check_presence:
          Агрегатное signal-поле — наличие правил отчуждения доли после
          регистрации.
          - "present" — если хотя бы одно из содержательных полей
            (share_transfer_rules_status, preemptive_right_status,
              third_party_consent_status, new_member_admission_status)
            ≠ "not_defined";
          - "missing" — если все четыре содержательных поля = "not_defined";
          - "unclear" — если фрагменты по теме есть, но из-за противоречий
            вывод невозможен.

          Если presence = "missing":
          - share_transfer_rules_status = "not_defined";
          - preemptive_right_status = "not_defined";
          - third_party_consent_status = "not_defined";
          - new_member_admission_status = "not_defined";
          - share_transfer_rules_details = "Данные не определены";
          - preemptive_right_details = "Данные не определены";
          - third_party_consent_details = "Данные не определены";
          - new_member_admission_details = "Данные не определены";
          - share_transfer_compliance = "not_checkable";
          - не выполняй остальные шаги.

        1. share_transfer_rules_status:
          - "defined" — если в тексте прямо указаны общие правила
            отчуждения доли после регистрации;
          - "not_defined" — если нет.

        2. share_transfer_rules_details:
          Текст общих правил отчуждения доли.
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".

        3. preemptive_right_status:
          - "defined" — если прямо указано преимущественное право
            покупки доли другими участниками;
          - "not_defined" — если нет.

        4. preemptive_right_details:
          Текст о преимущественном праве покупки (условия, сроки, цена).
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".

        5. third_party_consent_status:
          - "defined" — если прямо указана необходимость согласия
            участников на отчуждение доли третьему лицу;
          - "not_defined" — если нет.

        6. third_party_consent_details:
          Текст об условиях согласия на отчуждение доли третьему лицу.
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".

        7. new_member_admission_status:
          - "defined" — если прямо указан порядок включения нового
            участника (приём, внесение изменений в устав и т. п.);
          - "not_defined" — если нет.

        8. new_member_admission_details:
          Текст о порядке включения нового участника.
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".

        9. share_transfer_compliance — соответствие ст. 21 ФЗ-14:
          - "compliant"      — правила отчуждения и/или включения
                                нового участника указаны, соответствуют
                                закону;
          - "partial"        — часть правил указана;
          - "missing"        — правила отсутствуют;
          - "not_applicable" — для АО (императивный режим ФЗ-208
                                без договорного регулирования);
          - "not_checkable"  — недостаточно данных.

        10. evidence — массив цитат из текста договора.
        </task>

        <context_rules>
        - Перед остальными полями заполни post_registration_share_transfer_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", share_transfer_compliance = "not_checkable", все *_details = "Данные не определены".
        - Используй только текст договора, без внешних знаний.
        - Не путай с предрегистрационными изменениями (amendment_before_registration_check) и наследованием доли (inheritance_of_share_check).
        - Учитывай ОПФ: для АО договор о создании утрачивает силу после регистрации (ст. 9 п. 1 ФЗ-208), правила отчуждения акций могут быть указаны в акционерном соглашении; для ООО — правила переходят в устав.
        - Если в договоре указано, что правила отчуждения подлежат
          включению в устав / акционерное соглашение — фиксируй как "defined"
          с цитатой.
        - Не путай "not_defined" и "not_applicable": not_applicable — только если условие неприменимо по природе сделки.
        - Состояния "partial" / "unclear" / "отсылка" отражай через details-поле; в status-полях допустимо только "defined" / "not_defined".
        - Если status = "not_defined" — details = "Данные не определены".
        - Не используй пустые строки, "None", "null".
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
          В договоре нет ни правил отчуждения, ни преимущественного
          права, ни порядка включения нового участника.
          → presence = "missing";
            share_transfer_rules_status = "not_defined";
            preemptive_right_status = "not_defined";
            third_party_consent_status = "not_defined";
            new_member_admission_status = "not_defined";
            share_transfer_compliance = "not_checkable";
            все *_details = "Данные не определены".

        2. Неполное раскрытие темы.
          Указано преимущественное право покупки, но не указан порядок
          согласия на отчуждение третьему лицу и включение нового
          участника.
          → presence = "present";
            preemptive_right_status = "defined";
            third_party_consent_status = "not_defined";
            new_member_admission_status = "not_defined";
            share_transfer_compliance = "partial".

        3. Противоречие между фрагментами.
          В разных частях договора указаны разные условия согласия
          (например, «единогласие» и «большинство голосов»);
          конфликт нельзя разрешить по тексту.
          → presence = "unclear";
            соответствующий *_status = "not_defined";
            соответствующий *_details = "Не удалось определить".

        4. Отсылка на устав / акционерное соглашение.
          В договоре прямо указано, что правила отчуждения определяются
          уставом / акционерным соглашением.
          → presence = "present";
            share_transfer_rules_status = "defined";
            share_transfer_rules_details содержит формулировку
            вида "Согласно уставу / акционерному соглашению";
            share_transfer_compliance = "compliant".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для post_registration_share_transfer_check_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined", "not_defined".
        - Для share_transfer_compliance используй только: "compliant", "partial", "missing", "not_applicable", "not_checkable".
        - Fallback при отсутствии данных: все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности: соответствующие *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "post_registration_share_transfer_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие правил отчуждения доли после регистрации. Внутреннее агрегатное signal-поле."
          required: true

        - name: "share_transfer_rules_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус общих правил отчуждения доли. Внутреннее enum-поле."
          required: true

        - name: "share_transfer_rules_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Отчуждение доли"
          description: "Текст общих правил отчуждения доли после государственной регистрации."
          required: true

        - name: "preemptive_right_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус преимущественного права покупки доли. Внутреннее enum-поле."
          required: true

        - name: "preemptive_right_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Преимущественное право"
          description: "Текст о преимущественном праве покупки доли другими участниками."
          required: true

        - name: "third_party_consent_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус требования согласия участников на отчуждение третьему лицу. Внутреннее enum-поле."
          required: true

        - name: "third_party_consent_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Согласие на отчуждение третьему лицу"
          description: "Текст об условиях согласия участников на отчуждение доли третьему лицу."
          required: false

        - name: "new_member_admission_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус порядка включения нового участника. Внутреннее enum-поле."
          required: true

        - name: "new_member_admission_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Новый участник"
          description: "Порядок включения нового участника после регистрации."
          required: false

        - name: "share_transfer_compliance"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["compliant", "partial", "missing", "not_applicable", "not_checkable"]
          display_in_grid: false
          description: "Соответствие правил отчуждения доли ст. 21 ФЗ-14. Внутреннее enum-поле."
          required: true

      store_payload: true

  - id: inheritance_of_share_check
    name: "Наследование доли: порядок и согласие участников (ст. 21 п. 8 ФЗ-14)"
    description: >
      Фактографическая проверка наличия в договоре об учреждении правил
      наследования доли: требуется ли согласие остальных участников на
      переход доли к наследникам, порядок отказа участников в согласии,
      сроки, преимущественное право покупки доли у наследников, а также
      наличие отсылки к уставу (для ООО) или акционерному соглашению
      (для АО). Включает случаи применения к доле норм о наследовании
      по общим правилам ГК РФ (ч. 3). Не покрывает общее отчуждение доли —
      см. post_registration_share_transfer_check.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "наследование доли"
        - "переход доли к наследникам"
        - "наследник"
        - "наследники"
        - "согласие на переход доли"
        - "отказ в согласии"
        - "согласие участников наследнику"
        - "преимущественное право наследник"
        - "наследственная масса"
        - "вступление в наследство"
      keyword_mode: "any"
      regex_patterns:
        - '(?i)наследовани[еяю]\\s+дол'
        - '(?i)переход[а-яё]+\\s+дол[иья]\\s+к\\s+наследник'
        - '(?i)согласи[ея]\\s+(участник|учредител).{0,40}наследник'
        - '(?i)отказ[а-яё]*\\s+(в\\s+)?согласи[ия]'
        - '(?i)наследник[а-яё]*'

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по корпоративному праву. Анализируется
        договор об учреждении общества (ст. 21 п. 8 ФЗ-14 «Об ООО»,
        ст. 1176 ГК РФ, ст. 89.1 п. 3 ГК РФ). Проверяется только один
        вопрос: содержит ли текст договора правила наследования доли
        и перехода доли к наследникам.

        Нормативный ориентир:
        - ст. 21 п. 8 ФЗ-14 — доли переходят к наследникам граждан,
          если уставом не предусмотрено согласие остальных участников.
        - ст. 1176 ГК РФ — наследование доли в уставном капитале.
        - ст. 89.1 п. 3 ГК РФ — после регистрации внутренние отношения
          ООО регулируются уставом.

        Важно:
        - Твоя задача — установить факты из текста договора.
        - Не оценивай достаточность условий.
        - Не путай с общим порядком отчуждения доли
          (post_registration_share_transfer_check).

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Правила наследования доли.
        2. Требуется ли согласие участников на переход доли к наследникам.
        3. Порядок отказа в согласии и последствия.
        4. Наличие преимущественного права покупки доли у наследников.

        [ПРАВИЛА]
        1. Используй только текст договора.
        2. Не подставляй нормы закона вместо текста договора.
        3. verdict = "pass" — правила наследования указаны прямо
          (согласие участников или порядок отказа).
        4. verdict = "unclear" — правила упомянуты частично.
        5. verdict = "fail" — правила отсутствуют.
        6. Верни РОВНО один валидный JSON-объект со всеми 4 ключами
          (verdict, confidence, reason, evidence), пригодный для парсинга
          через json.loads без предварительной обработки. Без markdown,
          без ```json, без комментариев, без текста до или после.
          Начни ответ сразу с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — правила указаны (pass):
        Фрагмент:
        "В случае смерти участника Общества переход его доли к наследникам
        допускается только с согласия остальных участников. Согласие
        считается полученным, если в течение 30 дней с момента обращения
        наследника все участники дали письменное согласие. Отказ в согласии
        влечёт обязанность Общества выплатить наследникам действительную
        стоимость доли."

        Ответ:
        {
          "verdict": "pass",
          "confidence": 0.95,
          "reason": "Прямо указаны требование согласия участников, срок и последствия отказа в согласии.",
          "evidence": [
            {"clause_ref": "п. 6.5", "quote": "В случае смерти участника Общества переход его доли к наследникам допускается только с согласия остальных участников."}
          ]
        }

        Пример 2 — правила отсутствуют (fail):
        Фрагмент:
        "Учредители обязуются создать общество с уставным капиталом
        100 000 рублей."

        Ответ:
        {
          "verdict": "fail",
          "confidence": 0.90,
          "reason": "В договоре отсутствуют правила наследования доли и перехода доли к наследникам.",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямое условие о переходе доли к наследникам?
        2. Требуется ли согласие участников?
        3. Указан ли порядок отказа и его последствия?
        4. Не путать с общим порядком отчуждения доли
          (post_registration_share_transfer_check).

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "verdict": "<pass / fail / unclear>",
          "confidence": <0.0–1.0>,
          "reason": "<краткое объяснение вердикта>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 700

    retrieval:
      retrieval_profile: "party_identification_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "наследование доли переход доли к наследникам наследник согласие участников на переход доли отказ в согласии преимущественное право наследник наследственная масса вступление в наследство ст. 21 п. 8 ФЗ-14 ст. 1176 ГК РФ"
      preferred_unit_types:
        - obligation
        - general_provision
        - covenants
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - procedures
        - obligations
      negative_keywords:
        - "уставный капитал"
        - "номинальная стоимость"
        - "оплата доли"
        - "неденежный вклад"
        - "оценка"
        - "регистрация в ФНС"
        - "директор"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.50, 0.95]
        boost: 0.30
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "procedures"
        - "obligations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1000

      compact_output: false

      presence_signal:
        field: "inheritance_of_share_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по корпоративному праву. Извлекаешь из
        договора об учреждении правила наследования доли и перехода
        доли к наследникам (ст. 21 п. 8 ФЗ-14 «Об ООО», ст. 1176 ГК РФ).
        Учитывай, что для ООО правила могут быть включены в устав
        (ст. 89.1 п. 3 ГК РФ). Не анализируешь общее отчуждение доли
        (post_registration_share_transfer_check) и предрегистрационные
        изменения состава учредителей (amendment_before_registration_check) —
        эти темы проверяются отдельными чеками.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 6 полей + evidence (всего 7 ключей):

        0. inheritance_of_share_check_presence:
          Агрегатное signal-поле — наличие правил наследования доли.
          - "present" — если хотя бы одно из содержательных полей
            (inheritance_rules_status, heirs_consent_status,
              refusal_consequences_status)
            ≠ "not_defined";
          - "missing" — если все три содержательных поля = "not_defined";
          - "unclear" — если фрагменты по теме есть, но из-за противоречий
            вывод невозможен.

          Если presence = "missing":
          - inheritance_rules_status = "not_defined";
          - heirs_consent_status = "not_defined";
          - refusal_consequences_status = "not_defined";
          - inheritance_rules_details = "Данные не определены";
          - heirs_consent_details = "Данные не определены";
          - refusal_consequences_details = "Данные не определены";
          - inheritance_compliance = "not_checkable";
          - не выполняй остальные шаги.

        1. inheritance_rules_status:
          - "defined" — если в тексте прямо указаны правила наследования
            доли (переход к наследникам, условия, ограничения);
          - "not_defined" — если нет.

        2. inheritance_rules_details:
          Текст правил наследования доли.
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".

        3. heirs_consent_status:
          - "defined" — если прямо указано, что переход доли к наследникам
            требует согласия остальных участников;
          - "not_defined" — если нет.

        4. heirs_consent_details:
          Текст о согласии участников на переход доли к наследникам
          (условия, сроки, порядок получения).
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".

        5. refusal_consequences_status:
          - "defined" — если прямо указаны последствия отказа
            в согласии (обязанность выкупа доли, выплата стоимости,
            переход к обществу и т. п.);
          - "not_defined" — если нет.

        6. refusal_consequences_details:
          Текст о последствиях отказа в согласии.
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".

        7. inheritance_compliance — соответствие ст. 21 п. 8 ФЗ-14,
          ст. 1176 ГК РФ:
          - "compliant"      — правила наследования указаны, включая
                                порядок согласия и/или последствия отказа;
          - "partial"        — указана только часть правил;
          - "missing"        — правила отсутствуют;
          - "not_checkable"  — недостаточно данных.

        8. evidence — массив цитат из текста договора.
        </task>

        <context_rules>
        - Перед остальными полями заполни inheritance_of_share_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", inheritance_compliance = "not_checkable", все *_details = "Данные не определены".
        - Используй только текст договора, без внешних знаний.
        - Не путай с общим отчуждением доли (post_registration_share_transfer_check).
        - Учитывай ОПФ: для ООО правила могут быть включены в устав; для АО наследование акций регулируется общими нормами ГК РФ без специального согласия (кроме случаев, указанных в уставе).
        - Если в договоре указано, что правила наследования подлежат
          включению в устав / акционерное соглашение — фиксируй как
          "defined" с цитатой.
        - Не путай "not_defined" и "not_applicable": not_applicable — только если условие неприменимо по природе сделки.
        - Состояния "partial" / "unclear" / "отсылка" отражай через details-поле; в status-полях допустимо только "defined" / "not_defined".
        - Если status = "not_defined" — details = "Данные не определены".
        - Не используй пустые строки, "None", "null".
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
          В договоре нет ни правил наследования, ни требований
          о согласии участников, ни последствий отказа.
          → presence = "missing";
            inheritance_rules_status = "not_defined";
            heirs_consent_status = "not_defined";
            refusal_consequences_status = "not_defined";
            inheritance_compliance = "not_checkable";
            все *_details = "Данные не определены".

        2. Неполное раскрытие темы.
          Указано, что доля переходит к наследникам, но не указано,
          требуется ли согласие участников, и/или не указаны последствия
          отказа в согласии.
          → presence = "present";
            inheritance_rules_status = "defined";
            heirs_consent_status = "not_defined";
            refusal_consequences_status = "not_defined";
            inheritance_compliance = "partial".

        3. Противоречие между фрагментами.
          В разных частях договора указаны разные условия перехода
          доли к наследникам (например, «с согласия» и «без согласия»);
          конфликт нельзя разрешить по тексту.
          → presence = "unclear";
            соответствующий *_status = "not_defined";
            соответствующий *_details = "Не удалось определить".

        4. Отсылка на устав / акционерное соглашение.
          В договоре прямо указано, что порядок наследования
          определяется уставом / акционерным соглашением.
          → presence = "present";
            inheritance_rules_status = "defined";
            inheritance_rules_details содержит формулировку
            вида "Согласно уставу";
            inheritance_compliance = "compliant".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для inheritance_of_share_check_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined", "not_defined".
        - Для inheritance_compliance используй только: "compliant", "partial", "missing", "not_checkable".
        - Fallback при отсутствии данных: все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности: соответствующие *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "inheritance_of_share_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие правил наследования доли. Внутреннее агрегатное signal-поле."
          required: true

        - name: "inheritance_rules_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус правил наследования доли. Внутреннее enum-поле."
          required: true

        - name: "inheritance_rules_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Наследование доли"
          description: "Текст правил наследования доли в уставном капитале."
          required: true

        - name: "heirs_consent_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус требования согласия участников на переход доли к наследникам. Внутреннее enum-поле."
          required: true

        - name: "heirs_consent_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Согласие участников"
          description: "Условия, сроки и порядок получения согласия участников на переход доли к наследникам."
          required: true

        - name: "refusal_consequences_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания последствий отказа в согласии. Внутреннее enum-поле."
          required: true

        - name: "refusal_consequences_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Последствия отказа"
          description: "Порядок выкупа доли, выплаты действительной стоимости или перехода доли к обществу при отказе в согласии."
          required: false

        - name: "inheritance_compliance"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["compliant", "partial", "missing", "not_checkable"]
          display_in_grid: false
          description: "Соответствие правил наследования ст. 21 п. 8 ФЗ-14 и ст. 1176 ГК РФ. Внутреннее enum-поле."
          required: true

      store_payload: true

  - id: dispute_resolution_mechanisms_check
    name: "Специальные механизмы разрешения споров между учредителями (третейская оговорка, медиация, договорная подсудность)"
    description: >
      Фиксация в договоре об учреждении специальных (не boilerplate)
      механизмов разрешения споров между учредителями: третейская
      оговорка (передача спора в конкретный третейский суд), условие
      об обязательной медиации до обращения в суд, договорная подсудность
      для споров из договора об учреждении, комбинированные механизмы
      (медиация + арбитраж). Не покрывает общие boilerplate-условия
      (применимое право, общая подсудность, общий претензионный порядок) —
      они закреплены global-чеками governing_law_and_forum и
      limitation_periods_and_pre_claim_procedures. Не покрывает специфику
      предрегистрационных споров и конфиденциальность контекста —
      см. dispute_confidentiality_check.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "medium"
    severity_if_pass: "pass"
    severity_if_fail: "medium"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "третейская оговорка"
        - "третейский суд"
        - "арбитраж"
        - "арбитражная оговорка"
        - "медиация"
        - "медиатор"
        - "обязательная медиация"
        - "договорная подсудность"
        - "рассмотрение в конкретном суде"
        - "досудебное урегулирование"
        - "комбинированный порядок"
      keyword_mode: "any"
      regex_patterns:
        - '(?i)третейск[а-яё]+\\s+(оговорк|суд)'
        - '(?i)арбитражн[а-яё]+\\s+(оговорк|суд)'
        - '(?i)медиаци[яюи]|медиатор'
        - '(?i)договорн[а-яё]+\\s+подсудност'
        - '(?i)(переда[ею]тся|рассматрива[ею]тся)\\s+в\\s+(суд|арбитраж)'

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по корпоративному праву. Анализируется
        договор об учреждении общества. Проверяется только один вопрос:
        содержит ли текст договора специальные механизмы разрешения
        споров между учредителями (третейская оговорка, медиация,
        договорная подсудность).

        Нормативный ориентир:
        - ст. 32 ГК РФ — договорная подсудность.
        - ФЗ-382 «Об арбитраже (третейском разбирательстве)» — третейская
          оговорка, требования к арбитражному соглашению.
        - ФЗ-193 «Об альтернативной процедуре урегулирования споров
          с участием посредника (процедуре медиации)».
        - ст. 222 ГПК РФ, ст. 148 АПК РФ — оставление иска без рассмотрения
          при несоблюдении обязательной медиации.

        Важно:
        - Твоя задача — установить факты из текста договора.
        - Не оценивай исполнимость третейской оговорки.
        - Не фиксируй общий boilerplate (общая подсудность, применимое
          право) — это покрыто global-чеками.
        - Не фиксируй специфику предрегистрационных споров —
          это отдельный чек dispute_confidentiality_check.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Третейскую оговорку (передача споров в конкретный третейский
          суд / арбитраж).
        2. Условие об обязательной медиации до обращения в суд.
        3. Договорную подсудность (рассмотрение споров в конкретном суде,
          отличном от общего правила).
        4. Комбинированный порядок (например, медиация → арбитраж).

        [ПРАВИЛА]
        1. Используй только текст договора.
        2. Не подставляй нормы закона вместо текста договора.
        3. verdict = "pass" — хотя бы один специальный механизм указан
          прямо (третейская оговорка, медиация, договорная подсудность).
        4. verdict = "unclear" — механизм упомянут без конкретики
          (например, «споры разрешаются в соответствии с законодательством»).
        5. verdict = "fail" — специальных механизмов нет.
        6. Верни РОВНО один валидный JSON-объект со всеми 4 ключами
          (verdict, confidence, reason, evidence), пригодный для парсинга
          через json.loads без предварительной обработки. Без markdown,
          без ```json, без комментариев, без текста до или после.
          Начни ответ сразу с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — третейская оговорка указана (pass):
        Фрагмент:
        "Все споры, возникающие из настоящего договора, подлежат передаче
        на разрешение в Арбитражный центр при Российском союзе
        промышленников и предпринимателей в соответствии с его
        регламентом. Стороны обязуются до передачи спора в арбитраж
        провести процедуру медиации."

        Ответ:
        {
          "verdict": "pass",
          "confidence": 0.95,
          "reason": "Указаны третейская оговорка в конкретный арбитражный центр и обязательная процедура медиации.",
          "evidence": [
            {"clause_ref": "п. 12.1", "quote": "Все споры, возникающие из настоящего договора, подлежат передаче на разрешение в Арбитражный центр при Российском союзе промышленников и предпринимателей в соответствии с его регламентом."}
          ]
        }

        Пример 2 — только boilerplate (fail):
        Фрагмент:
        "Все споры разрешаются в Арбитражном суде г. Москвы. Применимое
        право — законодательство РФ."

        Ответ:
        {
          "verdict": "fail",
          "confidence": 0.85,
          "reason": "Указан только стандартный boilerplate (общая подсудность и применимое право) без специальных механизмов.",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямая третейская оговорка (конкретный третейский суд)?
        2. Есть ли условие об обязательной медиации?
        3. Есть ли договорная подсудность (отличная от общего правила)?
        4. Не фиксируй boilerplate (общая подсудность, применимое право).

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "verdict": "<pass / fail / unclear>",
          "confidence": <0.0–1.0>,
          "reason": "<краткое объяснение вердикта>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 600

    retrieval:
      retrieval_profile: "dispute_resolution_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "третейская оговорка третейский суд арбитражная оговорка арбитраж медиация медиатор обязательная медиация договорная подсудность специальная подсудность комбинированный порядок"
      preferred_unit_types:
        - general_provision
        - liability_provision
        - obligation
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - boilerplate
        - procedures
        - remedies
      negative_keywords:
        - "уставный капитал"
        - "оплата доли"
        - "неденежный вклад"
        - "оценка"
        - "солидарная ответственность"
        - "субсидиарная ответственность"
        - "корпоративный договор"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.60, 1.0]
        boost: 0.30
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "boilerplate"
        - "procedures"
        - "remedies"
      confidence_bonus_on_match: 0.06
      confidence_penalty_on_excluded_segment: 0.08

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 550

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 900

      compact_output: false

      presence_signal:
        field: "dispute_resolution_mechanisms_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по корпоративному праву. Извлекаешь из
        договора об учреждении специальные механизмы разрешения споров
        между учредителями: третейскую оговорку, обязательную медиацию,
        договорную подсудность. НЕ фиксируешь boilerplate (применимое
        право, общая подсудность, общий претензионный порядок) — они
        покрываются global-чеками governing_law_and_forum и
        limitation_periods_and_pre_claim_procedures. Не анализируешь
        специфику предрегистрационных споров и конфиденциальность
        контекста (dispute_confidentiality_check), уставный капитал,
        порядок оплаты долей и оценку неденежных вкладов — эти темы
        проверяются отдельными чеками.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 7 полей + evidence (всего 8 ключей):

        0. dispute_resolution_mechanisms_check_presence:
          Агрегатное signal-поле — наличие специальных механизмов
          разрешения споров.
          - "present" — если хотя бы одно из содержательных полей
            (arbitration_clause_status, mediation_clause_status,
              contractual_jurisdiction_status)
            ≠ "not_defined";
          - "missing" — если все три содержательных поля = "not_defined";
          - "unclear" — если фрагменты по теме есть, но из-за противоречий
            вывод невозможен.

          Если presence = "missing":
          - arbitration_clause_status = "not_defined";
          - mediation_clause_status = "not_defined";
          - contractual_jurisdiction_status = "not_defined";
          - arbitration_clause_details = "Данные не определены";
          - mediation_clause_details = "Данные не определены";
          - contractual_jurisdiction_details = "Данные не определены";
          - dispute_mechanism_compliance = "not_checkable";
          - не выполняй остальные шаги.

        1. arbitration_clause_status:
          - "defined" — если в тексте прямо указана третейская
            (арбитражная) оговорка с указанием конкретного третейского
            суда / арбитражного учреждения;
          - "not_defined" — если нет.

        2. arbitration_clause_details:
          Текст третейской оговорки (наименование третейского суда /
          арбитражного учреждения, регламент).
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".

        3. mediation_clause_status:
          - "defined" — если в тексте прямо указано условие об
            обязательной медиации до обращения в суд (с указанием
            медиатора / порядка выбора медиатора / срока);
          - "not_defined" — если нет.

        4. mediation_clause_details:
          Текст условия о медиации (порядок, сроки, выбор медиатора).
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".

        5. contractual_jurisdiction_status:
          - "defined" — если в тексте прямо указана договорная
            подсудность (конкретный суд, отличный от общего правила);
          - "not_defined" — если нет.

        6. contractual_jurisdiction_details:
          Текст о договорной подсудности (конкретный суд).
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".

        7. dispute_mechanism_compliance — соответствие применимому
          законодательству:
          - "compliant"      — указанные механизмы допустимы
                                и сформулированы определённо;
          - "vague"          — механизм указан без конкретики
                                («разрешаются в соответствии
                                с законодательством»);
          - "missing"        — специальных механизмов нет;
          - "not_checkable"  — недостаточно данных.

        8. evidence — массив цитат из текста договора.
        </task>

        <context_rules>
        - Перед остальными полями заполни dispute_resolution_mechanisms_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", dispute_mechanism_compliance = "not_checkable", все *_details = "Данные не определены".
        - Используй только текст договора, без внешних знаний.
        - Не фиксируй boilerplate:
          * общая подсудность / применимое право → global governing_law_and_forum;
          * общий претензионный порядок → global limitation_periods_and_pre_claim_procedures.
          В этом чеке фиксируй ТОЛЬКО специальные механизмы.
        - Третейская оговорка считается указанной, если прямо назван
          конкретный третейский суд или арбитражное учреждение. Общая
          фраза «споры передаются в третейский суд» без указания, какой
          именно, — arbitration_clause_status = "not_defined".
        - Условие о медиации считается указанным, если прямо предусмотрена
          обязательная медиация до суда.
        - Договорная подсудность считается указанной, если прямо назван
          суд, отличный от общего правила.
        - Не путай "not_defined" и "not_applicable": not_applicable — только если условие неприменимо по природе сделки.
        - Состояния "partial" / "unclear" / "отсылка" отражай через details-поле; в status-полях допустимо только "defined" / "not_defined".
        - Если status = "not_defined" — details = "Данные не определены".
        - Не используй пустые строки, "None", "null".
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие специальных механизмов.
          В договоре нет ни третейской оговорки, ни медиации,
          ни договорной подсудности (есть только общий boilerplate).
          → presence = "missing";
            arbitration_clause_status = "not_defined";
            mediation_clause_status = "not_defined";
            contractual_jurisdiction_status = "not_defined";
            dispute_mechanism_compliance = "not_checkable";
            все *_details = "Данные не определены".

        2. Неполное раскрытие темы.
          Указана третейская оговорка, но нет медиации и договорной
          подсудности (или наоборот).
          → presence = "present";
            соответствующий *_status = "defined" по факту;
            остальные *_status = "not_defined";
            dispute_mechanism_compliance = "compliant".

        3. Противоречие между фрагментами.
          В разных частях договора указаны разные механизмы
          (например, третейская оговорка и одновременно подсудность
          государственному суду); конфликт нельзя разрешить по тексту.
          → presence = "unclear";
            соответствующие *_status = "not_defined";
            соответствующий *_details = "Не удалось определить".

        4. Общая отсылка без конкретики.
          В договоре указано «споры разрешаются в соответствии
          с законодательством РФ» или «в третейском суде» без указания,
          каком именно.
          → presence = "present";
            соответствующий *_status = "not_defined";
            dispute_mechanism_compliance = "vague".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для dispute_resolution_mechanisms_check_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined", "not_defined".
        - Для dispute_mechanism_compliance используй только: "compliant", "vague", "missing", "not_checkable".
        - Fallback при отсутствии данных: все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности: соответствующие *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "dispute_resolution_mechanisms_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие специальных механизмов разрешения споров между учредителями. Внутреннее агрегатное signal-поле."
          required: true

        - name: "arbitration_clause_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус наличия третейской (арбитражной) оговорки. Внутреннее enum-поле."
          required: true

        - name: "arbitration_clause_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Третейская оговорка"
          description: "Текст третейской оговорки с указанием конкретного третейского суда (арбитражного учреждения) и регламента."
          required: true

        - name: "mediation_clause_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус условия об обязательной медиации. Внутреннее enum-поле."
          required: true

        - name: "mediation_clause_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Медиация"
          description: "Текст условия о медиации (порядок, сроки, выбор медиатора)."
          required: true

        - name: "contractual_jurisdiction_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус договорной подсудности. Внутреннее enum-поле."
          required: true

        - name: "contractual_jurisdiction_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Договорная подсудность"
          description: "Текст о договорной подсудности (конкретный суд)."
          required: false

        - name: "dispute_mechanism_compliance"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["compliant", "vague", "missing", "not_checkable"]
          display_in_grid: false
          description: "Соответствие указанных механизмов применимому законодательству (ст. 32 ГК РФ, ФЗ-382, ФЗ-193). Внутреннее enum-поле."
          required: true

      store_payload: true

# ════════════════════════════════════════════════════════════════════════════
# БЛОК 5: DD_REQUEST_TEMPLATES
# Читается: DDRequestTemplateLoader
# ════════════════════════════════════════════════════════════════════════════

dd_request_templates:
  founders_and_company_check:
    text: >
      Просим предоставить по {doc_names}: (а) полные данные каждого учредителя
      (ФИО/наименование, ИНН, ОГРН, адрес, паспортные данные для физ. лиц);
      (б) полное и сокращённое наименование создаваемого общества;
      (в) организационно-правовую форму; (г) место нахождения.
    addressee: "Все учредители"

  charter_capital_shares_check:
    text: >
      Просим уточнить в {doc_names}: (а) общий размер уставного капитала
      (для ООО — не менее 10 000 руб.); (б) размер и номинальную стоимость доли
      каждого учредителя; (в) подтверждение, что сумма долей = 100%;
      (г) валюту оплаты.
    addressee: "Все учредители / Юридический советник"

  share_payment_check:
    text: >
      Просим уточнить в {doc_names}: (а) конкретный срок оплаты каждым учредителем
      (не позднее 4 мес. с даты регистрации); (б) способ оплаты (деньги/имущество/
      права); (в) реквизиты для оплаты; (г) последствия неоплаты.
    addressee: "Все учредители / Юридический советник"

  non_monetary_valuation_check:
    text: >
      Просим предоставить по {doc_names}: (а) описание неденежного вклада;
      (б) отчёт независимого оценщика (для вкладов свыше 20 000 руб.);
      (в) протокол утверждения стоимости единогласным решением;
      (г) подтверждение информированности о субсидиарной ответственности (ст. 15 ФЗ-14).
    addressee: "Учредитель, вносящий неденежный вклад / Оценщик"

  solidary_liability_check:
    text: >
      Просим подтвердить в {doc_names}: (а) наличие положения о солидарной
      ответственности учредителей (ст. 11 ФЗ-14); (б) порядок одобрения обществом
      обязательств после регистрации; (в) лимиты обязательств до регистрации.
    addressee: "Юридический советник"

  pre_incorporation_contracts_check:
    text: >
      Просим уточнить в {doc_names}: (а) механизм одобрения договоров,
      заключаемых до регистрации; (б) лимиты полномочий уполномоченного лица;
      (в) порядок ратификации обществом после регистрации;
      (г) распределение ответственности при отказе от ратификации.
    addressee: "Юридический советник"

  corporate_agreement_obligation_check:
    text: >
      Просим согласовать в {doc_names}: (а) обязательство заключить
      корпоративный договор после регистрации; (б) ключевые условия
      (drag-along, tag-along, опционы, порядок голосования);
      (в) срок заключения; (г) санкции за незаключение.
    addressee: "Юридический советник"

  founder_withdrawal_check:
    text: >
      Просим уточнить в {doc_names}: (а) процедуру выхода учредителя
      (уведомление, срок); (б) последствия для доли и расходов;
      (в) порядок компенсации фактически понесённых расходов.
    addressee: "Юридический советник"

  joint_activity_expenses_check:
    text: >
      Просим описать в {doc_names}: (а) порядок совместных действий учредителей
      (подготовка устава, формирование пакета документов, подача на регистрацию);
      (б) распределение расходов на учреждение (пропорционально/поровну);
      (в) кандидатуру директора и порядок избрания;
      (г) перечень вопросов, требующих единогласного решения.
    addressee: "Все учредители"

  contract_term_post_registration_check:
    text: >
      Просим уточнить в {doc_names}: (а) срок действия договора (до регистрации
      или до наступления иного события); (б) какие положения сохраняют силу
      после регистрации общества (конфиденциальность, споры, ответственность);
      (в) указать их автономность от устава.
    addressee: "Юридический советник"

  foreign_founder_check:
    text: >
      Для {doc_names} при участии иностранного учредителя просим предоставить:
      (а) апостилированные/легализованные документы; (б) нотариальный перевод;
      (в) выписку из торгового реестра; (г) подтверждение правоспособности.
    addressee: "Иностранный учредитель / Юридический советник"

  dispute_confidentiality_check:
    text: >
      Просим согласовать в {doc_names}: (а) досудебный порядок (претензии,
      переговоры); (б) подсудность; (в) арбитражную оговорку (при наличии);
      (г) обязательство конфиденциальности в отношении условий договора
      и бизнес-плана (ст. 434.1 ГК РФ).
    addressee: "Юридический советник"

  _default:
    text: >
      Просим предоставить дополнительную информацию по вопросу «{check_name}»
      применительно к {doc_names}.
    addressee: "Юридический советник"
