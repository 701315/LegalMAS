          allowed_values: ["defined", "not_defined"]
          description: "Статус определения места нахождения."
          required: false
        - name: "company_location_value"
          type: "string"
          presentation: "fact"
          label: "Место нахождения"
          description: "Место нахождения создаваемого общества."
          required: false
          display_in_grid: true
          display_priority: 4
      store_payload: true

