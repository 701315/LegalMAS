        </role>
        <context>
        {context}
        </context>
        <task>
        Заполни строго следующие 7 полей + evidence (всего 8 ключей):
        1. payment_deadline_status — "defined" или "not_defined".
        2. payment_deadline_value — конкретный срок оплаты так, как указан
           в тексте договора.
        3. payment_deadline_compliance — "within_limit" / "exceeds_limit" /
           "not_checkable": сверка указанного срока с императивным лимитом
           четыре месяца с даты государственной регистрации (ст. 16 п. 1
           ФЗ-14 «Об ООО»).
        4. payment_method_code — "money" / "property" / "securities" /
           "rights" / "mixed" / "not_defined".
        5. payment_method_details — способ оплаты так, как указан в тексте.
        6. per_founder_payment_status — "common" (общий порядок для всех
           учредителей) / "differentiated" (персональные условия для
           отдельных учредителей) / "not_defined".
        7. per_founder_payment_details — текст о порядке оплаты по
           учредителям.
        8. evidence — массив цитат из текста договора.
        </task>
        <rules>
        1. Используй только текст договора, без внешних знаний.
        2. Не выводи срок оплаты из нормы ст. 16 ФЗ-14 — срок фиксируй
           только как прямо указан в тексте. Норму используй ИСКЛЮЧИТЕЛЬНО
           для проверки соответствия (поле payment_deadline_compliance).
        3. Различай состояния:
           - defined — значение прямо указано;
           - not_defined — упоминания нет;
           - partial — часть данных есть, часть отсутствует;
           - unclear — текст есть, но неоднозначен;
           - отсылка — значение определяется через приложение / спецификацию
             (валидный факт, фиксируй со ссылкой).
        4. Не путай "not_defined" и "not_applicable": not_applicable —
           только если условие неприменимо по природе сделки.
        5. Состояния "partial" / "unclear" / "отсылка" отражай через
           value-поле; в status-полях допустимо только "defined" / "not_defined".
        6. payment_method_code: "денежными средствами" → "money";
           "ценными бумагами" → "securities"; "имуществом", "вещами" →
           "property"; "имущественными правами", "иными правами" → "rights";
           несколько способов одновременно или выбор → "mixed".
        7. payment_deadline_compliance:
           - "within_limit" — указанный срок ≤ 4 месяцев с госрегистрации;
           - "exceeds_limit" — указанный срок > 4 месяцев;
           - "not_checkable" — срок не указан или не может быть сопоставлен
             с моментом госрегистрации.
        8. per_founder_payment_status = "common", если условия оплаты
           едины для всех учредителей (в том числе если формулировка
           общая: «каждый учредитель обязан оплатить свою долю в полном объёме»). Значение
           "differentiated" — только если для разных учредителей
           установлены разные сроки / способы / суммы.
        9. Если status = "not_defined" — value = "Данные не определены",
           evidence = [].
        10. Значения enum-полей — строго из allowed_values.
        11. Запрещены "None", "null", пустые строки, отсутствующие ключи.
        12. Верни РОВНО один валидный JSON-объект со всеми 8 ключами,
            пригодный для парсинга через json.loads без предварительной
            обработки. Без markdown, без ```json, без комментариев, без
            текста до или после. Начни ответ сразу с { и закончи }.
        </rules>
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — единый денежный порядок, в пределах лимита:
        Фрагмент:
        "Каждый учредитель обязан оплатить свою долю в уставном капитале
        денежными средствами не позднее 3 месяцев с даты государственной
        регистрации Общества."
        Ответ:
        {
          "payment_deadline_status": "defined",
          "payment_deadline_value": "не позднее 3 месяцев с даты государственной регистрации",
          "payment_deadline_compliance": "within_limit",
          "payment_method_code": "money",
          "payment_method_details": "денежными средствами",
          "per_founder_payment_status": "common",
          "per_founder_payment_details": "каждый учредитель оплачивает долю в общем порядке",
          "evidence": [
            {
              "clause_ref": "п. 4.1",
              "quote": "Каждый учредитель обязан оплатить свою долю в уставном капитале денежными средствами не позднее 3 месяцев с даты государственной регистрации Общества."
            }
          ]
        }
        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Учредители оплачивают доли в порядке, предусмотренном законодательством."
        Ответ:
        {
          "payment_deadline_status": "not_defined",
          "payment_deadline_value": "Данные не определены",
          "payment_deadline_compliance": "not_checkable",
          "payment_method_code": "not_defined",
          "payment_method_details": "Данные не определены",
          "per_founder_payment_status": "not_defined",
          "per_founder_payment_details": "Данные не определены",
          "evidence": []
        }
        Пример 3 — срок превышает императивный лимит:
        Фрагмент:
        "Учредители оплачивают доли в уставном капитале денежными средствами
        в течение 6 месяцев с даты государственной регистрации Общества."
        Ответ:
        {
          "payment_deadline_status": "defined",
          "payment_deadline_value": "в течение 6 месяцев с даты государственной регистрации",
          "payment_deadline_compliance": "exceeds_limit",
          "payment_method_code": "money",
          "payment_method_details": "денежными средствами",
          "per_founder_payment_status": "common",
          "per_founder_payment_details": "единый порядок оплаты для всех учредителей",
          "evidence": [
            {
              "clause_ref": "п. 4.1",
              "quote": "Учредители оплачивают доли в уставном капитале денежными средствами в течение 6 месяцев с даты государственной регистрации Общества."
            }
          ]
        }
        Пример 4 — дифференцированные условия для разных учредителей:
        Фрагмент:
        "Иванов И.И. оплачивает свою долю денежными средствами не позднее
        2 месяцев с даты государственной регистрации Общества.
        ООО «Альфа» оплачивает свою долю имуществом не позднее 4 месяцев
        с даты государственной регистрации Общества."
        Ответ:
        {
          "payment_deadline_status": "defined",
          "payment_deadline_value": "Иванов И.И. — не позднее 2 месяцев; ООО «Альфа» — не позднее 4 месяцев",
          "payment_deadline_compliance": "within_limit",
          "payment_method_code": "mixed",
          "payment_method_details": "Иванов И.И. — денежные средства; ООО «Альфа» — имущество",
          "per_founder_payment_status": "differentiated",
          "per_founder_payment_details": "персональные условия для каждого учредителя: разные сроки и разные способы оплаты",
          "evidence": [
            {
              "clause_ref": "п. 4.1–4.2",
              "quote": "Иванов И.И. оплачивает свою долю денежными средствами не позднее 2 месяцев, ООО «Альфа» оплачивает свою долю имуществом не позднее 4 месяцев с даты государственной регистрации Общества."
            }
          ]
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямая цитата со сроком оплаты? Если нет —
           payment_deadline_status = "not_defined", payment_deadline_value =
           "Данные не определены".
        2. Указан ли срок в привязке к дате государственной регистрации
           Общества? Если да — сравни с 4-месячным императивным лимитом
           (ст. 16 п. 1 ФЗ-14) и определи payment_deadline_compliance.
        3. Есть ли прямая цитата со способом оплаты? Классифицируй по
           payment_method_code — строго из allowed_values.
        4. Единые ли условия для всех учредителей, или есть персональные
           сроки/способы/суммы? Определи per_founder_payment_status.
        5. Если хотя бы одно поле = not_defined — соответствующий value =
           "Данные не определены", evidence для этого блока = [].
        Не выводи шаги проверки. Верни только JSON.
      fields:
        - name: "payment_deadline_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения срока оплаты долей."
          required: true
        - name: "payment_deadline_value"
          type: "string"
          presentation: "fact"
          label: "Срок оплаты долей"
          description: "Конкретный срок оплаты долей так, как указан в договоре."
          required: true
          display_in_grid: true
          display_priority: 1
        - name: "payment_deadline_compliance"
          type: "string"
          presentation: "signal"
          allowed_values: ["within_limit", "exceeds_limit", "not_checkable"]
          description: "Соответствие указанного срока императивному 4-месячному лимиту (ст. 16 п. 1 ФЗ-14)."
          required: true
        - name: "payment_method_code"
          type: "string"
          presentation: "signal"
          allowed_values: ["money", "property", "securities", "rights", "mixed", "not_defined"]
          description: "Способ оплаты долей (код)."
          required: true
        - name: "payment_method_details"
          type: "string"
          presentation: "fact"
          label: "Способ оплаты"
          description: "Способ оплаты долей так, как указан в договоре."
          required: true
          display_in_grid: true
          display_priority: 2
        - name: "per_founder_payment_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["common", "differentiated", "not_defined"]
          description: "Единый или дифференцированный порядок оплаты по учредителям."
          required: true
        - name: "per_founder_payment_details"
          type: "string"
          presentation: "fact"
          label: "Порядок оплаты по учредителям"
          description: "Текст о порядке оплаты по учредителям (общий или персональный)."
          required: true
          display_in_grid: false

  - id: non_monetary_valuation_check
    name: "Оценка неденежного вклада и солидарно-субсидиарная ответственность (ст. 66.2 ГК РФ, ст. 15 ФЗ-14)"
    description: >
      Фактографическая проверка процедуры оценки неденежного вклада:
      привлечение независимого оценщика (обязательно при номинальной
      стоимости доли > 20 000 руб., ст. 15 п. 2 ФЗ-14), утверждение
      стоимости единогласным решением учредителей, непревышение
      стоимости вклада над оценкой оценщика. Дополнительно фиксируется
      упоминание в тексте солидарно-субсидиарной ответственности
      участников и оценщика (императивная норма, 3 года с момента
      госрегистрации).
    triggers:
      any: ["non_monetary_contribution"]
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "независимый оценщик"
        - "независимая оценка"
        - "отчёт об оценке"
        - "отчет об оценке"
        - "утверждение оценки"
        - "единогласное решение"
        - "единогласно"
        - "стоимость не может превышать"
        - "солидарно несут"
        - "субсидиарная ответственность"
        - "20 000"
        - "двадцать тысяч"
        - "3 года"
        - "три года"
        - "неденежный вклад"
      keyword_mode: "any"
      regex_patterns:
        - '(?i)независим(ый|ого|ым)\\s+оценщик'
        - '(?i)солидарн(о|ая)\\s+(несут|ответственност)'
        - '(?i)субсидиарн(ая|ой|ую)\\s+ответственност'
        - '(?i)стоимость.*не\\s+(может|должна)\\s+превышать'
        - '(?i)(20\\s*000|двадцат(и|ь)\\s+тысяч)'

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по корпоративному праву. Анализируется договор
        об учреждении общества (ст. 66.2 п. 2 ГК РФ, ст. 15 п. 2 ФЗ-14
        «Об ООО»). Проверяется только один вопрос: содержит ли текст
        договора условия об оценке неденежного вклада.
        [ЗАДАЧА]
        Определи, содержит ли текст договора:
        1. Описание неденежного вклада (что именно вносится).
        2. Указание на привлечение независимого оценщика и его отчёт.
        3. Указание на утверждение стоимости единогласным решением
           учредителей.
        4. Упоминание солидарно-субсидиарной ответственности участников
           и оценщика за завышение стоимости.
        Верни вердикт:
        - "pass"    — описание вклада + оценщик + утверждение стоимости
                      указаны прямо.
        - "fail"    — условия о неденежном вкладе и его оценке отсутствуют.
        - "unclear" — данные частичны: указан вклад, но нет оценщика или
                      утверждения стоимости.
        [ПРАВИЛА]
        1. Используй только текст договора.
        2. Evidence — прямые цитаты из договора.
        3. Верни РОВНО один валидный JSON-объект со всеми 4 ключами
           (verdict, confidence, reason, evidence), пригодный для парсинга
           через json.loads без предварительной обработки. Без markdown,
           без ```json, без комментариев, без текста до или после.
           Начни ответ сразу с { и закончи }.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — условия определены:
        Фрагмент:
        "Иванов И.И. вносит неденежный вклад — исключительное право на
        программу для ЭВМ. Стоимость вклада определена независимым оценщиком
        ООО «Оценка+» (отчёт № 45 от 01.03.2026) в размере 50 000 рублей
        и утверждена единогласным решением учредителей. Учредители солидарно
        несут субсидиарную ответственность за завышение стоимости в течение
        3 лет с момента государственной регистрации Общества."
        Ответ:
        {
          "verdict": "pass",
          "confidence": 0.95,
          "reason": "Прямо указаны неденежный вклад, привлечение независимого оценщика с отчётом, единогласное утверждение стоимости и солидарно-субсидиарная ответственность.",
          "evidence": [
            {
              "clause_ref": "п. 3.3",
              "quote": "Иванов И.И. вносит неденежный вклад — исключительное право на программу для ЭВМ. Стоимость вклада определена независимым оценщиком ООО «Оценка+» в размере 500 000 рублей"
            }
          ]
        }
        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Учредители оплачивают доли денежными средствами."
        Ответ:
        {
          "verdict": "fail",
          "confidence": 0.92,
          "reason": "В тексте отсутствуют условия о неденежном вкладе и его оценке.",
          "evidence": []
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямое описание неденежного вклада?
        2. Есть ли прямое указание на независимого оценщика?
        3. Есть ли прямое указание на единогласное утверждение стоимости?
        4. Если хотя бы одного из пунктов нет — вердикт "unclear" или "fail".
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "verdict": "<pass / fail / unclear>",
          "confidence": <0.0–1.0>,
          "reason": "<краткое объяснение вердикта>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 500

    retrieval:
      retrieval_profile: "payment_terms_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "независимый оценщик независимая оценка отчёт об оценке утверждение стоимости единогласное решение стоимость не может превышать солидарно субсидиарная ответственность 3 года двадцать тысяч ст. 15 ФЗ-14 неденежный вклад"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "уставный капитал"
        - "доля учредителя"
        - "оплата доли"
        - "срок оплаты"
        - "солидарная ответственность учредителей до регистрации"
        - "корпоративный договор"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.15, 0.55]
        boost: 0.30
        scope: segment
      context_k: 5
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      store_payload: true
      compact_output: false
      llm_max_tokens: 900
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по корпоративному праву. Извлекаешь из договора
        об учреждении общества сведения об оценке неденежного вклада.
        Не анализируешь размер уставного капитала и общий порядок оплаты
        долей — эти темы проверяются отдельными чеками.
        </role>
        <context>
        {context}
        </context>
        <task>
        Заполни строго следующие 9 полей + evidence (всего 10 ключей):
        1. non_monetary_contribution_status — "defined" или "not_defined".
        2. non_monetary_contribution_details — описание неденежного вклада
           так, как указано в тексте.
        3. independent_valuation_status — "defined" или "not_defined":
           привлечён ли независимый оценщик.
        4. independent_valuation_details — сведения об оценке (кто оценил,
           номер и дата отчёта, сумма оценки).
        5. valuation_approval_status — "defined" или "not_defined":
           утверждена ли стоимость единогласным решением.
        6. valuation_approval_details — процедура утверждения стоимости.
        7. subsidiary_liability_status — "defined" или "not_defined":
           упомянута ли в тексте солидарно-субсидиарная ответственность
           участников и оценщика.
        8. subsidiary_liability_details — текст об ответственности за
           завышение стоимости.
        9. valuation_compliance — "compliant" / "missing_appraiser" /
           "missing_approval" / "exceeds_appraisal" / "not_applicable" /
           "not_checkable".
        10. evidence — массив цитат из текста договора.
        </task>
        <rules>
        1. Используй только текст договора, без внешних знаний.
        2. Не выводи требование оценки из нормы ст. 15 ФЗ-14 или
           ст. 66.2 ГК РФ — фиксируй только как указано в тексте. Норму
           используй ИСКЛЮЧИТЕЛЬНО для проверки соответствия
           (поле valuation_compliance).
        3. Различай состояния:
           - defined — значение прямо указано;
           - not_defined — упоминания нет;
           - partial — часть данных есть, часть отсутствует;
           - unclear — текст есть, но неоднозначен;
           - отсылка — значение определяется через приложение / спецификацию
             (валидный факт, фиксируй со ссылкой).
        4. Не путай "not_defined" и "not_applicable": not_applicable —
           только если условие неприменимо по природе сделки.
        5. Состояния "partial" / "unclear" / "отсылка" отражай через
           value-поле; в status-полях допустимо только "defined" / "not_defined".
        6. valuation_compliance — сверка с императивными требованиями
           ст. 15 п. 2 ФЗ-14 и ст. 66.2 п. 2 ГК РФ:
           - "compliant"        — неденежный вклад есть, при номинальной
                                  стоимости доли > 20 000 руб. привлечён
                                  независимый оценщик, стоимость утверждена
                                  единогласно, стоимость вклада не превышает
                                  оценку оценщика;
           - "missing_appraiser" — неденежный вклад > 20 000 руб., но
                                  независимый оценщик не указан;
           - "missing_approval" — оценщик есть, но стоимость не утверждена
                                  единогласным решением;
           - "exceeds_appraisal" — стоимость вклада превышает оценку
                                  оценщика;
           - "not_applicable"   — неденежный вклад в договоре отсутствует;
           - "not_checkable"    — недостаточно данных (нет ни суммы вклада,
                                  ни сведений об оценке).
        7. Если номинальная стоимость доли, оплачиваемой неденежным
           вкладом, ≤ 20 000 руб. — привлечение независимого оценщика
           по ст. 15 ФЗ-14 НЕ обязательно; отсутствие оценщика в этом
           случае не влечёт "missing_appraiser".
        8. subsidiary_liability_status — фиксируй ТОЛЬКО упоминание в тексте.
           Отсутствие в договоре не является дефектом: норма
           ст. 15 п. 2 ФЗ-14 об ответственности участников и оценщика
           императивна и не требует дублирования в договоре.
        9. Если status = "not_defined" — value = "Данные не определены",
           evidence = [].
        10. Значения enum-полей — строго из allowed_values.
        11. Запрещены "None", "null", пустые строки, отсутствующие ключи.
        12. Верни РОВНО один валидный JSON-объект со всеми 10 ключами,
            пригодный для парсинга через json.loads без предварительной
            обработки. Без markdown, без ```json, без комментариев, без
            текста до или после. Начни ответ сразу с { и закончи }.
        </rules>
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — compliant, всё указано, вклад > 20 000 руб.:
        Фрагмент:
        "Иванов И.И. вносит неденежный вклад — исключительное право на
        программу для ЭВМ. Номинальная стоимость его доли — 50 000 рублей.
        Стоимость вклада определена независимым оценщиком ООО «Оценка+»
        (отчёт № 45 от 01.03.2026) в размере 50 000 рублей и утверждена
        единогласным решением учредителей. Учредители солидарно несут
        субсидиарную ответственность за завышение стоимости в течение
        3 лет с момента государственной регистрации Общества."
        Ответ:
        {
          "non_monetary_contribution_status": "defined",
          "non_monetary_contribution_details": "исключительное право на программу для ЭВМ, номинальная стоимость доли — 50 000 рублей",
          "independent_valuation_status": "defined",
          "independent_valuation_details": "независимый оценщик ООО «Оценка+», отчёт № 45 от 01.03.2026, оценка 50 000 рублей",
          "valuation_approval_status": "defined",
          "valuation_approval_details": "утверждена единогласным решением учредителей",
          "subsidiary_liability_status": "defined",
          "subsidiary_liability_details": "учредители солидарно несут субсидиарную ответственность за завышение стоимости в течение 3 лет с момента государственной регистрации Общества",
          "valuation_compliance": "compliant",
          "evidence": [
            {
              "clause_ref": "п. 3.3",
              "quote": "Стоимость вклада определена независимым оценщиком ООО «Оценка+» (отчёт № 45 от 01.03.2026) в размере 50 000 рублей и утверждена единогласным решением учредителей."
            }
          ]
        }
        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Учредители оплачивают доли денежными средствами."
        Ответ:
        {
          "non_monetary_contribution_status": "not_defined",
          "non_monetary_contribution_details": "Данные не определены",
          "independent_valuation_status": "not_defined",
          "independent_valuation_details": "Данные не определены",
          "valuation_approval_status": "not_defined",
          "valuation_approval_details": "Данные не определены",
          "subsidiary_liability_status": "not_defined",
          "subsidiary_liability_details": "Данные не определены",
          "valuation_compliance": "not_applicable",
          "evidence": []
        }
        Пример 3 — non-compliant: неденежный вклад > 20 000 руб. без оценщика:
        Фрагмент:
        "ООО «Альфа» вносит в оплату своей доли неденежный вклад —
        оборудование стоимостью 100 000 рублей. Номинальная стоимость доли
        ООО «Альфа» — 100 000 рублей. Стоимость оборудования утверждена
        решением учредителей."
        Ответ:
        {
          "non_monetary_contribution_status": "defined",
          "non_monetary_contribution_details": "оборудование, номинальная стоимость доли — 100 000 рублей",
          "independent_valuation_status": "not_defined",
          "independent_valuation_details": "Данные не определены",
          "valuation_approval_status": "defined",
          "valuation_approval_details": "утверждена решением учредителей",
          "subsidiary_liability_status": "not_defined",
          "subsidiary_liability_details": "Данные не определены",
          "valuation_compliance": "missing_appraiser",
          "evidence": [
            {
              "clause_ref": "п. 3.3",
              "quote": "ООО «Альфа» вносит в оплату своей доли неденежный вклад — оборудование стоимостью 100 000 рублей."
            }
          ]
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямая цитата с описанием неденежного вклада? Если нет —
           non_monetary_contribution_status = "not_defined".
        2. Указана ли номинальная стоимость доли, оплачиваемой неденежным
           вкладом, и превышает ли она 20 000 руб.? Это определяет,
           обязательно ли привлечение независимого оценщика.
        3. Есть ли прямая цитата об оценщике и его отчёте?
        4. Есть ли прямая цитата о единогласном утверждении стоимости?
        5. Определи valuation_compliance по правилу 6 — строго из
           allowed_values. Отсутствие упоминания субсидиарной
           ответственности НЕ является дефектом (норма императивна).
        Не выводи шаги проверки. Верни только JSON.
      fields:
        - name: "non_monetary_contribution_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус наличия неденежного вклада."
          required: true
        - name: "non_monetary_contribution_details"
          type: "string"
          presentation: "fact"
          label: "Неденежный вклад"
          description: "Описание неденежного вклада так, как указано в договоре."
          required: true
          display_in_grid: true
          display_priority: 1
        - name: "independent_valuation_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания независимого оценщика."
          required: true
        - name: "independent_valuation_details"
          type: "string"
          presentation: "fact"
          label: "Оценка вклада"
          description: "Сведения об оценщике и оценке неденежного вклада."
          required: true
          display_in_grid: true
          display_priority: 2
        - name: "valuation_approval_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания процедуры утверждения стоимости."
          required: true
        - name: "valuation_approval_details"
          type: "string"
          presentation: "fact"
          label: "Утверждение стоимости"
          description: "Процедура утверждения стоимости вклада."
          required: true
          display_in_grid: false
        - name: "subsidiary_liability_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус упоминания в тексте солидарно-субсидиарной ответственности (информационно, норма императивна)."
          required: true
        - name: "subsidiary_liability_details"
          type: "string"
          presentation: "fact"
          label: "Ответственность за завышение"
          description: "Текст о солидарно-субсидиарной ответственности участников и оценщика за завышение стоимости."
          required: true
          display_in_grid: true
          display_priority: 3
        - name: "valuation_compliance"
          type: "string"
          presentation: "signal"
          allowed_values: ["compliant", "missing_appraiser", "missing_approval", "exceeds_appraisal", "not_applicable", "not_checkable"]
          description: "Соответствие процедуры оценки императивным требованиям ст. 15 п. 2 ФЗ-14 / ст. 66.2 п. 2 ГК РФ."
          required: true

  - id: solidary_liability_check
    name: "Солидарно-субсидиарная ответственность учредителей до регистрации (ст. 89.1 п. 4 ГК РФ, ст. 11 п. 3 ФЗ-14)"
    description: >
      Фиксация в тексте договора об учреждении условий о солидарно-субсидиарной
      ответственности учредителей по обязательствам, связанным с созданием
      общества и возникшим до его государственной регистрации, а также о
      механизме последующего одобрения их действий обществом. Сверка с
      императивной нормой: отсутствие оговорки в договоре не является дефектом —
      норма применяется независимо от упоминания; риск создаёт искажение нормы
      (сужение круга обязательств, отказ от субсидиарности, ограничение суммы,
      указание иного органа одобрения).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "солидарная ответственность"
        - "солидарно несут"
        - "солидарно отвечают"
        - "субсидиарная ответственность"
        - "обязательства до регистрации"
        - "обязательства, связанные с созданием"
        - "до государственной регистрации"
        - "последующее одобрение"
        - "одобрение общим собранием"
      keyword_mode: "any"
      regex_patterns:
        - '(?i)солидарн(ая|ой|ую|о)\\s+(несут|отвечают|ответственност)'
        - '(?i)солидарно\\s+несут(\\s+субсидиарную)?\\s+ответственност'
        - '(?i)обязательств(а|ам|ами).*до\\s+(государственной\\s+)?регистраци'
        - '(?i)последующ(ее|его|ему)\\s+одобрени'
        - '(?i)одобрени(е|я|ю|ем)\\s+(их\\s+)?действи'

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по корпоративному праву. Анализируется договор
        об учреждении общества (ст. 89.1 п. 4 ГК РФ, ст. 11 п. 3 ФЗ-14
        «Об ООО»). Проверяется только один вопрос: содержит ли текст договора
        условия о солидарно-субсидиарной ответственности учредителей по
        обязательствам, возникшим до госрегистрации, и о механизме
        последующего одобрения их действий обществом.
        [ЗАДАЧА]
        Определи, содержит ли текст договора:
        1. Условие о солидарной (солидарно-субсидиарной) ответственности
           учредителей по обязательствам, связанным с созданием общества
           и возникшим до госрегистрации.
        2. Указание объёма ответственности (все обязательства / ограниченный
           круг / ограничение суммы).
        3. Механизм последующего одобрения действий учредителей обществом
           после регистрации.
        Верни вердикт:
        - "pass"    — условие об ответственности воспроизведено в тексте
                      согласно норме; механизм одобрения указан.
        - "fail"    — в тексте есть оговорка, искажающая норму (сужение круга,
                      отказ от субсидиарности, ограничение суммы, иной орган
                      одобрения).
        - "unclear" — условие в тексте отсутствует, но норма ст. 89.1 п. 4
                      ГК РФ применяется императивно (это НЕ дефект, но и не
                      явное соответствие).
        [ПРАВИЛА]
        1. Используй только текст договора.
        2. Evidence — прямые цитаты из договора (пустой массив, если
           оговорка отсутствует).
        3. Верни РОВНО один валидный JSON-объект со всеми 4 ключами
           (verdict, confidence, reason, evidence), пригодный для парсинга
           через json.loads без предварительной обработки. Без markdown,
           без ```json, без комментариев, без текста до или после.
           Начни ответ сразу с { и закончи }.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — норма воспроизведена:
        Фрагмент:
        "Учредители солидарно несут субсидиарную ответственность по всем
        обязательствам, связанным с созданием Общества и возникшим до момента
        его государственной регистрации. Общество несет ответственность по
        обязательствам учредителей только в случае последующего одобрения
        их действий общим собранием участников Общества."
        Ответ:
        {
          "verdict": "pass",
          "confidence": 0.95,
          "reason": "Норма воспроизведена согласно ст. 89.1 п. 4 ГК РФ: солидарно-субсидиарная ответственность + одобрение общим собранием.",
          "evidence": [
            {
              "clause_ref": "п. 6.1",
              "quote": "Учредители солидарно несут субсидиарную ответственность по всем обязательствам, связанным с созданием Общества и возникшим до момента его государственной регистрации."
            }
          ]
        }
        Пример 2 — оговорка отсутствует:
        Фрагмент:
        "Учредители обязуются создать общество. Порядок оплаты долей
        определён в разделе 4."
        Ответ:
        {
          "verdict": "unclear",
          "confidence": 0.85,
          "reason": "Оговорка о солидарно-субсидиарной ответственности отсутствует; норма применяется императивно. Это не дефект, но и не явное соответствие.",
          "evidence": []
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли в тексте прямое условие об ответственности учредителей до госрегистрации?
        2. Указан ли объём обязательств?
        3. Указан ли механизм одобрения действий учредителей обществом?
        4. Если есть оговорка, но она искажает норму (сужение, отказ от
           субсидиарности, ограничение суммы, иной орган одобрения) — вердикт
           "fail".
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "verdict": "<pass / fail / unclear>",
          "confidence": <0.0–1.0>,
          "reason": "<краткое объяснение вердикта>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 550

    retrieval:
      retrieval_profile: "party_identification_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "солидарная ответственность солидарно несут субсидиарная ответственность обязательства до регистрации обязательства связанные с созданием до государственной регистрации последующее одобрение общее собрание ст. 89.1 ГК РФ ст. 11 ФЗ-14"
      preferred_unit_types:
        - liability_provision
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - limitations
        - boilerplate
        - obligations
      negative_keywords:
        - "уставный капитал"
        - "доля учредителя"
        - "оплата доли"
        - "неденежный вклад"
        - "оценка"
        - "завышение стоимости"
        - "корпоративный договор"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.30, 0.80]
        boost: 0.30
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "limitations"
        - "boilerplate"
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.15

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 500

    extraction:
      enabled: true
      mode: "hybrid"
      store_payload: true
      compact_output: false
      llm_max_tokens: 800
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по корпоративному праву. Извлекаешь из договора
        об учреждении общества сведения о солидарно-субсидиарной
        ответственности учредителей по обязательствам, возникшим до
        государственной регистрации (ст. 89.1 п. 4 ГК РФ, ст. 11 п. 3
        ФЗ-14 «Об ООО»), и о механизме последующего одобрения их действий
        обществом. Не анализируешь уставный капитал, порядок оплаты долей
        и оценку неденежного вклада — эти темы проверяются отдельными чеками.
        </role>
        <context>
        {context}
        </context>
        <task>
        Заполни строго следующие 6 полей + evidence (всего 7 ключей):
        1. liability_basis — источник условия об ответственности:
           "explicit_in_contract" (оговорка прямо воспроизведена в тексте),
           "statutory_implicit" (в тексте отсутствует, но норма ст. 89.1 п. 4
           ГК РФ применяется императивно — это НЕ дефект),
           "modified_by_contract" (оговорка есть, но искажает норму: сужение
           круга обязательств, отказ от субсидиарности, ограничение суммы,
           иной орган одобрения и т. п.),
           "not_checkable".
        2. pre_registration_liability_details — текст оговорки об
           ответственности учредителей так, как указано в договоре.
        3. pre_registration_scope_code — объём ответственности:
           "all_pre_registration" (все обязательства),
           "limited_scope" (ограничен определённым кругом обязательств),
           "limited_amount" (ограничен суммой),
           "not_defined".
        4. post_registration_approval_status — "defined" или "not_defined":
           указан ли в тексте механизм последующего одобрения.
        5. post_registration_approval_body_code — орган одобрения:
           "general_meeting" (общее собрание участников),
           "other_body" (иной орган — совпадение с нормой отсутствует),
           "not_defined".
        6. post_registration_approval_details — текст о механизме
           последующего одобрения.
        7. evidence — массив цитат из текста договора (пустой, если оговорка
           отсутствует).
        </task>
        <rules>
        1. Используй только текст договора, без внешних знаний.
        2. Не выводи оговорку из нормы ст. 89.1 п. 4 ГК РФ / ст. 11 п. 3
           ФЗ-14 — фиксируй только как указано в тексте. Норму используй
           ИСКЛЮЧИТЕЛЬНО для классификации liability_basis и сверки органа
           одобрения.
        3. Различай состояния:
           - defined — значение прямо указано;
           - not_defined — упоминания нет;
           - partial — часть данных есть, часть отсутствует;
           - unclear — текст есть, но неоднозначен;
           - отсылка — значение определяется через приложение / спецификацию
             (валидный факт, фиксируй со ссылкой).
        4. Не путай "not_defined" и "not_applicable": not_applicable —
           только если условие неприменимо по природе сделки.
        5. Состояния "partial" / "unclear" / "отсылка" отражай через
           value-поле; в status-полях допустимо только "defined" / "not_defined".
        6. liability_basis — ключевое поле риска:
           - "explicit_in_contract" — оговорка воспроизводит норму без
             искажений (указана солидарная ответственность / солидарно-
             субсидиарная / по всем обязательствам до регистрации);
           - "statutory_implicit" — оговорка отсутствует в тексте, норма
             применяется императивно. Отсутствие — НЕ дефект. Не считать
             риском;
           - "modified_by_contract" — оговорка присутствует, но изменяет
             норму (например, «отвечает только Иванов И.И.», «ответственность
             ограничена 100 000 руб.», «ответственность не является
             субсидиарной», «одобряет совет директоров»);
           - "not_checkable" — невозможно определить по тексту.
        7. pre_registration_scope_code:
           - "all_pre_registration" — ответственность по всем обязательствам
             до госрегистрации;
           - "limited_scope" — ограничен определённым кругом (только
             договорные, только связанные со строительством и т. п.);
           - "limited_amount" — ограничен суммой;
           - "not_defined".
        8. post_registration_approval_body_code:
           - "general_meeting" — соответствует ст. 89.1 п. 4 ГК РФ;
           - "other_body" — иной орган (совет директоров, единоличный
             исполнительный орган и т. п.) — несоответствие норме;
           - "not_defined" — орган не указан.
        9. Если status = "not_defined" — value = "Данные не определены".
        10. Значения enum-полей — строго из allowed_values.
        11. Запрещены "None", "null", пустые строки, отсутствующие ключи.
        12. Верни РОВНО один валидный JSON-объект со всеми 7 ключами,
            пригодный для парсинга через json.loads без предварительной
            обработки. Без markdown, без ```json, без комментариев, без
            текста до или после. Начни ответ сразу с { и закончи }.
        </rules>
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — explicit_in_contract, соответствие норме:
        Фрагмент:
        "Учредители солидарно несут субсидиарную ответственность по всем
        обязательствам, связанным с созданием Общества и возникшим до момента
        его государственной регистрации. Общество несет ответственность по
        обязательствам учредителей только в случае последующего одобрения
        их действий общим собранием участников Общества."
        Ответ:
        {
          "liability_basis": "explicit_in_contract",
          "pre_registration_liability_details": "учредители солидарно несут субсидиарную ответственность по всем обязательствам, связанным с созданием Общества и возникшим до момента его государственной регистрации",
          "pre_registration_scope_code": "all_pre_registration",
          "post_registration_approval_status": "defined",
          "post_registration_approval_body_code": "general_meeting",
          "post_registration_approval_details": "общество несет ответственность по обязательствам учредителей только в случае последующего одобрения их действий общим собранием участников Общества",
          "evidence": [
            {
              "clause_ref": "п. 6.1",
              "quote": "Учредители солидарно несут субсидиарную ответственность по всем обязательствам, связанным с созданием Общества и возникшим до момента его государственной регистрации."
            }
          ]
        }
        Пример 2 — statutory_implicit, оговорка отсутствует (не дефект):
        Фрагмент:
        "Учредители обязуются создать общество. Порядок оплаты долей
        определён в разделе 4."
        Ответ:
        {
          "liability_basis": "statutory_implicit",
          "pre_registration_liability_details": "Данные не определены",
          "pre_registration_scope_code": "not_defined",
          "post_registration_approval_status": "not_defined",
          "post_registration_approval_body_code": "not_defined",
          "post_registration_approval_details": "Данные не определены",
          "evidence": []
        }
        Пример 3 — modified_by_contract, оговорка искажает норму (риск):
        Фрагмент:
        "Иванов И.И. несет ответственность по обязательствам, связанным
        с созданием Общества, в размере не более 50 000 рублей. Остальные
        учредители ответственности не несут. Одобрение действий учредителей
        осуществляется советом директоров Общества."
        Ответ:
        {
          "liability_basis": "modified_by_contract",
          "pre_registration_liability_details": "ответственность несет только Иванов И.И., в размере не более 50 000 рублей; остальные учредители ответственности не несут",
          "pre_registration_scope_code": "limited_amount",
          "post_registration_approval_status": "defined",
          "post_registration_approval_body_code": "other_body",
          "post_registration_approval_details": "одобрение действий учредителей осуществляется советом директоров Общества",
          "evidence": [
            {
              "clause_ref": "п. 6.1",
              "quote": "Иванов И.И. несет ответственность по обязательствам, связанным с созданием Общества, в размере не более 50 000 рублей. Остальные учредители ответственности не несут."
            }
          ]
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли в тексте прямая оговорка об ответственности учредителей
           до госрегистрации? Если нет — liability_basis = "statutory_implicit"
           (не дефект), pre_registration_liability_details = "Данные не
           определены", evidence = [].
        2. Если оговорка есть — воспроизводит ли она норму без искажений
           (солидарность, субсидиарность, все обязательства до регистрации)?
           Если искажает — liability_basis = "modified_by_contract".
        3. Определён ли объём ответственности (все / ограниченный круг /
           ограниченный суммой)? Соотнеси с pre_registration_scope_code.
        4. Указан ли механизм последующего одобрения? Каким органом?
           Соотнеси с post_registration_approval_body_code — "general_meeting"
           только если прямо указано «общее собрание участников».
        5. Значения enum-полей — строго из allowed_values. Запрещены
           "None", "null", пустые строки.
        Не выводи шаги проверки. Верни только JSON.
      fields:
        - name: "liability_basis"
          type: "string"
          presentation: "signal"
          allowed_values: ["explicit_in_contract", "statutory_implicit", "modified_by_contract", "not_checkable"]
          description: "Источник условия об ответственности: воспроизведено / императивно по норме / искажено договором / неопределимо."
          required: true
          display_in_grid: true
          display_priority: 1
        - name: "pre_registration_liability_details"
          type: "string"
          presentation: "fact"
          label: "Солидарно-субсидиарная ответственность"
          description: "Текст оговорки об ответственности учредителей по обязательствам, возникшим до госрегистрации."
          required: true
          display_in_grid: true
          display_priority: 2
        - name: "pre_registration_scope_code"
          type: "string"
          presentation: "signal"
          allowed_values: ["all_pre_registration", "limited_scope", "limited_amount", "not_defined"]
          description: "Объём солидарно-субсидиарной ответственности учредителей."
          required: true
        - name: "post_registration_approval_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания механизма последующего одобрения действий учредителей обществом."
          required: true
        - name: "post_registration_approval_body_code"
          type: "string"
          presentation: "signal"
          allowed_values: ["general_meeting", "other_body", "not_defined"]
          description: "Орган, одобряющий действия учредителей (по ст. 89.1 п. 4 ГК РФ — общее собрание участников)."
          required: true
        - name: "post_registration_approval_details"
          type: "string"
          presentation: "fact"
          label: "Одобрение обществом"
          description: "Текст о механизме последующего одобрения действий учредителей обществом."
          required: true
          display_in_grid: true
          display_priority: 3

  - id: pre_incorporation_contracts_check
    name: "Предварительное одобрение и лимиты полномочий по договорам, заключённым до регистрации"
    description: >
      Фиксация договорных механизмов предварительного одобрения сделок,
      заключаемых учредителями от имени создаваемого (ещё не
      зарегистрированного) общества, тип одобрения (единогласие /
      большинство / уполномоченное лицо) и лимиты полномочий на их
      заключение. Механизм последующего одобрения действий учредителей
      обществом после регистрации (ст. 89.1 п. 4 ГК РФ, ст. 11 п. 3
      ФЗ-14) фиксируется отдельным чеком solidary_liability_check.
    triggers:
      any: ["pre_incorporation_contracts_context"]
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "договоры до регистрации"
        - "предварительное одобрение"
        - "от имени создаваемого общества"
        - "лимит полномочий"
        - "предел суммы"
        - "без предварительного одобрения"
        - "единогласное одобрение"
        - "большинством голосов"
      keyword_mode: "any"
      regex_patterns:
        - '(?i)договор(ы|ов|а)?\\s+до\\s+(государственной\\s+)?регистраци'
        - '(?i)предварительн(ое|ого|ым)\\s+одобрени'
        - '(?i)от\\s+имени\\s+создаваемого\\s+обществ'
        - '(?i)лимит\\s+полномочи'
        - '(?i)предел(ьная|ной)\\s+сумм'

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по корпоративному праву. Анализируется договор
        об учреждении общества (ст. 89.1 п. 4 ГК РФ, ст. 11 п. 3 ФЗ-14
        «Об ООО»). Проверяется только один вопрос: содержит ли текст
        договора механизмы предварительного одобрения сделок, заключаемых
        учредителями от имени создаваемого общества, и лимиты полномочий
        на такие сделки.
        [ЗАДАЧА]
        Определи, содержит ли текст договора:
        1. Условие о необходимости предварительного одобрения договоров,
           заключаемых от имени создаваемого общества.
        2. Тип одобрения (единогласное / большинством / уполномоченным
           лицом).
        3. Лимит полномочий (максимальная сумма сделки без одобрения
           или порог, после которого одобрение требуется).
        Верни вердикт:
        - "pass"    — условие о предварительном одобрении указано прямо,
                      определён тип одобрения (и лимит, если применим).
        - "fail"    — механизм предварительного одобрения отсутствует
                      или прямо исключён.
        - "unclear" — механизм упомянут, но тип одобрения или лимит
                      неопределимы.
        [ПРАВИЛА]
        1. Используй только текст договора.
        2. Evidence — прямые цитаты из договора.
        3. Верни РОВНО один валидный JSON-объект со всеми 4 ключами
           (verdict, confidence, reason, evidence), пригодный для парсинга
           через json.loads без предварительной обработки. Без markdown,
           без ```json, без комментариев, без текста до или после.
           Начни ответ сразу с { и закончи }.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — механизм определён:
        Фрагмент:
        "Договоры, заключаемые от имени создаваемого Общества до его
        регистрации, подлежат предварительному единогласному одобрению
        всеми учредителями. Сделки на сумму свыше 500 000 рублей
        совершаются только с согласия всех учредителей."
        Ответ:
        {
          "verdict": "pass",
          "confidence": 0.95,
          "reason": "Прямо указаны механизм предварительного одобрения, тип одобрения (единогласное) и лимит полномочий.",
          "evidence": [
            {
              "clause_ref": "п. 7.1",
              "quote": "Договоры, заключаемые от имени создаваемого Общества до его регистрации, подлежат предварительному единогласному одобрению всеми учредителями."
            }
          ]
        }
        Пример 2 — механизм отсутствует:
        Фрагмент:
        "Учредители обязуются создать общество."
        Ответ:
        {
          "verdict": "fail",
          "confidence": 0.90,
          "reason": "В тексте отсутствуют механизм предварительного одобрения и лимит полномочий.",
          "evidence": []
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямое указание на необходимость предварительного одобрения?
        2. Указан ли тип одобрения (единогласие / большинство / уполномоченное лицо)?
        3. Указан ли лимит полномочий?
        4. Если механизм не указан — вердикт "fail". Если указан частично —
           "unclear".
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "verdict": "<pass / fail / unclear>",
          "confidence": <0.0–1.0>,
          "reason": "<краткое объяснение вердикта>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 500

    retrieval:
      retrieval_profile: "party_identification_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "договоры до регистрации предварительное одобрение от имени создаваемого общества лимит полномочий предел суммы единогласное одобрение большинством голосов уполномоченное лицо"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - procedures
        - obligations
      negative_keywords:
        - "уставный капитал"
        - "доля учредителя"
        - "оплата доли"
        - "неденежный вклад"
        - "оценка"
        - "солидарная ответственность"
        - "субсидиарная ответственность"
        - "корпоративный договор"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.35, 0.75]
        boost: 0.30
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "procedures"
        - "obligations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      store_payload: true
      compact_output: false
      llm_max_tokens: 700
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по корпоративному праву. Извлекаешь из
        договора об учреждении общества договорные механизмы
        предварительного одобрения сделок, заключаемых от имени
        создаваемого общества, тип одобрения и лимиты полномочий.
        Не анализируешь уставный капитал, порядок оплаты долей,
        неденежные вклады и последующую ответственность учредителей —
        эти темы проверяются отдельными чеками.
        </role>
        <context>
        {context}
        </context>
        <task>
        Заполни строго следующие 6 полей + evidence (всего 7 ключей):
        1. pre_incorporation_clause_status — "defined" или "not_defined":
           указан ли в тексте механизм предварительного одобрения
           договоров, заключаемых от имени создаваемого общества.
        2. pre_incorporation_clause_details — текст условия о механизме
           предварительного одобрения так, как указано в договоре.
        3. approval_mechanism_code — тип одобрения:
           "unanimous" (единогласное одобрение всеми учредителями),
           "majority" (одобрение большинством голосов),
           "authorized_person" (одобрение уполномоченным лицом / органом),
           "mixed" (разные типы для разных категорий сделок),
           "not_defined".
        4. amount_limit_status — "defined" или "not_defined": указан ли
           в тексте лимит полномочий / предельная сумма сделки.
        5. amount_limit_value — значение лимита / предельной суммы так,
           как указано в договоре.
        6. approval_mechanism_details — текст о типе одобрения и лимитах
           так, как указано в договоре (объединяет детали).
        7. evidence — массив цитат из текста договора.
        </task>
        <rules>
        1. Используй только текст договора, без внешних знаний.
        2. Не выводи механизм одобрения из нормы ст. 89.1 п. 4 ГК РФ /
           ст. 11 п. 3 ФЗ-14 — фиксируй только договорные условия.
        3. Не ссылайся на «порядок ст. 11 ФЗ-14» — норма не устанавливает
           процедуру ратификации; механизм одобрения — договорное условие,
           а последующая ответственность — императивная норма (см. отдельный
           чек solidary_liability_check).
        4. Различай состояния:
           - defined — значение прямо указано;
           - not_defined — упоминания нет;
           - partial — часть данных есть, часть отсутствует;
           - unclear — текст есть, но неоднозначен;
           - отсылка — значение определяется через приложение / спецификацию.
        5. Не путай "not_defined" и "not_applicable": not_applicable —
           только если условие неприменимо по природе сделки.
        6. Состояния "partial" / "unclear" / "отсылка" отражай через
           value-поле; в status-полях допустимо только "defined" /
           "not_defined".
        7. approval_mechanism_code:
           - "unanimous" — «единогласное одобрение всеми учредителями»,
             «согласие всех учредителей»;
           - "majority" — «большинством голосов», «простым большинством»,
             «квалифицированным большинством»;
           - "authorized_person" — «уполномоченное лицо», «исполнительный
             орган», «доверенное лицо», «представитель учредителей»;
           - "mixed" — разные типы для разных категорий сделок;
           - "not_defined" — тип не указан.
        8. amount_limit_value — фиксируй как указано в тексте («не более
           500 000 рублей», «свыше 1 000 000 руб.», «предельная сумма —
           5 000 000 руб.»).
        9. Если status = "not_defined" — value = "Данные не определены",
           evidence = [].
        10. Значения enum-полей — строго из allowed_values.
        11. Запрещены "None", "null", пустые строки, отсутствующие ключи.
        12. Верни РОВНО один валидный JSON-объект со всеми 7 ключами,
            пригодный для парсинга через json.loads без предварительной
            обработки. Без markdown, без ```json, без комментариев, без
            текста до или после. Начни ответ сразу с { и закончи }.
        </rules>
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — механизм и лимит указаны:
        Фрагмент:
        "Договоры, заключаемые от имени создаваемого Общества до его
        регистрации, подлежат предварительному единогласному одобрению
        всеми учредителями. Сделки на сумму свыше 500 000 рублей
        совершаются только с согласия всех учредителей."
        Ответ:
        {
          "pre_incorporation_clause_status": "defined",
          "pre_incorporation_clause_details": "договоры подлежат предварительному единогласному одобрению всеми учредителями",
          "approval_mechanism_code": "unanimous",
          "amount_limit_status": "defined",
          "amount_limit_value": "свыше 500 000 рублей — только с согласия всех учредителей",
          "approval_mechanism_details": "предварительное единогласное одобрение всеми учредителями; лимит — свыше 500 000 рублей",
          "evidence": [
            {
              "clause_ref": "п. 7.1",
              "quote": "Договоры, заключаемые от имени создаваемого Общества до его регистрации, подлежат предварительному единогласному одобрению всеми учредителями."
            }
          ]
        }
        Пример 2 — механизм отсутствует:
        Фрагмент:
        "Учредители обязуются создать общество."
        Ответ:
        {
          "pre_incorporation_clause_status": "not_defined",
          "pre_incorporation_clause_details": "Данные не определены",
          "approval_mechanism_code": "not_defined",
          "amount_limit_status": "not_defined",
          "amount_limit_value": "Данные не определены",
          "approval_mechanism_details": "Данные не определены",
          "evidence": []
        }
        Пример 3 — одобрение большинством, лимит не указан:
        Фрагмент:
        "Сделки, совершаемые от имени создаваемого Общества, подлежат
        одобрению простым большинством голосов учредителей."
        Ответ:
        {
          "pre_incorporation_clause_status": "defined",
          "pre_incorporation_clause_details": "сделки подлежат одобрению простым большинством голосов учредителей",
          "approval_mechanism_code": "majority",
          "amount_limit_status": "not_defined",
          "amount_limit_value": "Данные не определены",
          "approval_mechanism_details": "одобрение простым большинством голосов; лимит не указан",
          "evidence": [
            {
              "clause_ref": "п. 7.2",
              "quote": "Сделки, совершаемые от имени создаваемого Общества, подлежат одобрению простым большинством голосов учредителей."
            }
          ]
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямая цитата с механизмом предварительного одобрения?
           Если нет — pre_incorporation_clause_status = "not_defined",
           pre_incorporation_clause_details = "Данные не определены".
        2. Определён ли тип одобрения (единогласие / большинство /
           уполномоченное лицо)? Соотнеси с approval_mechanism_code —
           строго из allowed_values.
        3. Указан ли лимит полномочий / предельная сумма? Если нет —
           amount_limit_status = "not_defined", amount_limit_value =
           "Данные не определены".
        4. Значения enum-полей — строго из allowed_values. Запрещены
           "None", "null", пустые строки.
        Не выводи шаги проверки. Верни только JSON.
      fields:
        - name: "pre_incorporation_clause_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус наличия в договоре механизма предварительного одобрения предрегистрационных сделок."
          required: true
        - name: "pre_incorporation_clause_details"
          type: "string"
          presentation: "fact"
          label: "Договоры до регистрации"
          description: "Текст условия о механизме предварительного одобрения сделок, заключаемых от имени создаваемого общества."
          required: true
          display_in_grid: true
          display_priority: 1
        - name: "approval_mechanism_code"
          type: "string"
          presentation: "fact"
          label: "Тип одобрения"
          allowed_values: ["unanimous", "majority", "authorized_person", "mixed", "not_defined"]
          description: "Тип предварительного одобрения сделок, заключаемых от имени создаваемого общества."
          required: true
          display_in_grid: false
        - name: "amount_limit_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания лимита полномочий / предельной суммы сделки."
          required: true
        - name: "amount_limit_value"
          type: "string"
          presentation: "fact"
          label: "Лимит полномочий"
          description: "Значение лимита полномочий / предельной суммы сделки так, как указано в договоре."
          required: true
          display_in_grid: true
          display_priority: 2
        - name: "approval_mechanism_details"
          type: "string"
          presentation: "fact"
          label: "Механизм одобрения"
          description: "Развёрнутый текст о типе одобрения и лимитах полномочий."
          required: true
          display_in_grid: false

  - id: corporate_agreement_obligation_check
    name: "Обязательство заключить корпоративный договор после регистрации (ст. 67.2 ГК РФ, ст. 8.1 ФЗ-14, ст. 32.1 ФЗ-208, ст. 429 ГК РФ)"
    description: >
      Фиксация в договоре об учреждении обязательства учредителей заключить
      после государственной регистрации корпоративный договор (для ООО —
      соглашение об осуществлении прав участников по ст. 8.1 ФЗ-14, для АО —
      акционерное соглашение по ст. 32.1 ФЗ-208), перечня предварительно
      согласованных условий и срока заключения. Отсутствие указания срока
      при предварительном договоре влечёт применение годичного срока по
      ст. 429 п. 4 ГК РФ. Проверяется соответствие императивным требованиям
      ст. 67.2 п. 4 ГК РФ (единогласное заключение) и ст. 67.2 п. 5 ГК РФ
      (недопустимость условий, обязывающих голосовать по указаниям органов
      общества).
    triggers:
      any: ["corporate_agreement_planned"]
    ui_mode: "field_extraction"
    severity: "medium"
    severity_if_pass: "pass"
    severity_if_fail: "medium"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "корпоративный договор"
        - "акционерное соглашение"
        - "соглашение об осуществлении прав участников"
        - "обязуются заключить"
        - "обязательство заключить"
        - "предварительный договор"
        - "право требовать продажи доли"
        - "право присоединиться к продаже"
        - "право первого отказа"
        - "опцион на приобретение"
        - "опцион на продажу"
      keyword_mode: "any"
      regex_patterns:
        - '(?i)корпоративн(ый|ого|ому|ым)\\s+договор'
        - '(?i)акционерн(ое|ого|ому)\\s+соглашени'
        - '(?i)соглашени(е|я|ю)\\s+об\\s+осуществлени'
        - '(?i)обязу(ются|ется|емся)\\s+заключить'
        - '(?i)предварительн(ый|ого|ому)\\s+договор'
        - '(?i)право\\s+(первого\\s+отказа|требовать\\s+продаж|присоединит)'

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по корпоративному праву. Анализируется договор
        об учреждении общества (ст. 67.2 ГК РФ, ст. 8.1 ФЗ-14 «Об ООО»,
        ст. 32.1 ФЗ-208 «Об АО», ст. 429 ГК РФ). Проверяется только один
        вопрос: содержит ли текст договора обязательство учредителей
        заключить после государственной регистрации корпоративный договор
        (соглашение об осуществлении прав участников / акционерное
        соглашение).
        [ЗАДАЧА]
        Определи, содержит ли текст договора:
        1. Обязательство заключить корпоративный договор после регистрации.
        2. Перечень предварительно согласованных условий такого договора.
        3. Срок заключения корпоративного договора.
        Верни вердикт:
        - "pass"    — обязательство заключить корпоративный договор указано
                      прямо, определён срок (или условия).
        - "fail"    — обязательство отсутствует.
        - "unclear" — обязательство упомянуто, но условия/срок неопределимы.
        [ПРАВИЛА]
        1. Используй только текст договора.
        2. Evidence — прямые цитаты из договора.
        3. Верни РОВНО один валидный JSON-объект со всеми 4 ключами
           (verdict, confidence, reason, evidence), пригодный для парсинга
           через json.loads без предварительной обработки. Без markdown,
           без ```json, без комментариев, без текста до или после.
           Начни ответ сразу с { и закончи }.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — обязательство определено:
        Фрагмент:
        "Учредители обязуются заключить корпоративный договор в течение
        30 дней после государственной регистрации Общества. Предварительно
        согласованы: порядок голосования, право требовать продажи доли,
        право присоединиться к продаже, право первого отказа."
        Ответ:
        {
          "verdict": "pass",
          "confidence": 0.95,
          "reason": "Прямо указано обязательство заключить корпоративный договор, определён срок (30 дней) и перечень условий.",
          "evidence": [
            {
              "clause_ref": "п. 8.1",
              "quote": "Учредители обязуются заключить корпоративный договор в течение 30 дней после государственной регистрации Общества."
            }
          ]
        }
        Пример 2 — обязательство отсутствует:
        Фрагмент:
        "Учредители обязуются создать общество."
        Ответ:
        {
          "verdict": "fail",
          "confidence": 0.90,
          "reason": "В тексте отсутствует обязательство заключить корпоративный договор.",
          "evidence": []
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямое обязательство заключить корпоративный договор?
        2. Указан ли срок его заключения?
        3. Перечислены ли предварительно согласованные условия?
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "verdict": "<pass / fail / unclear>",
          "confidence": <0.0–1.0>,
          "reason": "<краткое объяснение вердикта>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 500

    retrieval:
      retrieval_profile: "party_identification_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "корпоративный договор акционерное соглашение соглашение об осуществлении прав участников обязательство заключить предварительный договор право требовать продажи доли право присоединиться к продаже право первого отказа опцион на приобретение опцион на продажу срок заключения ст. 67.2 ГК РФ ст. 8.1 ФЗ-14 ст. 32.1 ФЗ-208 ст. 429 ГК РФ"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "уставный капитал"
        - "доля учредителя"
        - "оплата доли"
        - "неденежный вклад"
        - "оценка"
        - "солидарная ответственность"
        - "субсидиарная ответственность"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.50, 0.95]
        boost: 0.30
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.06
      confidence_penalty_on_excluded_segment: 0.08

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      store_payload: true
      compact_output: false
      llm_max_tokens: 800
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по корпоративному праву. Извлекаешь из
        договора об учреждении общества сведения об обязательстве учредителей
        заключить после государственной регистрации корпоративный договор
        (для ООО — соглашение об осуществлении прав участников по ст. 8.1
        ФЗ-14, для АО — акционерное соглашение по ст. 32.1 ФЗ-208),
        перечень предварительно согласованных условий и срок заключения.
        Не анализируешь уставный капитал, порядок оплаты долей, неденежные
        вклады и солидарно-субсидиарную ответственность — эти темы
        проверяются отдельными чеками.
        </role>
        <context>
        {context}
        </context>
        <task>
        Заполни строго следующие 7 полей + evidence (всего 8 ключей):
        1. corporate_agreement_obligation_status — "defined" или
           "not_defined": указано ли в тексте обязательство заключить
           корпоративный договор после регистрации.
        2. corporate_agreement_obligation_details — текст обязательства
           так, как указано в договоре.
        3. key_terms_previewed_status — "defined" или "not_defined":
           перечислены ли предварительно согласованные условия.
        4. key_terms_previewed_details — перечень предварительно
           согласованных условий.
        5. deadline_for_conclusion_status — "defined" или "not_defined":
           указан ли срок заключения корпоративного договора.
        6. deadline_for_conclusion_details — значение срока так, как
           указано в договоре.
        7. corporate_agreement_compliance — соответствие императивным
           требованиям ст. 67.2 п. 4–5 ГК РФ:
           "compliant"      — обязательство указано, не противоречит норме;
           "non_unanimous"  — указано, что корпоративный договор будет
                              заключаться не единогласно (противоречие
                              ст. 67.2 п. 4 ГК РФ);
           "invalid_terms"  — предварительно согласованы условия,
                              противоречащие ст. 67.2 п. 5 ГК РФ (например,
                              обязательство голосовать по указаниям органов
                              общества);
           "not_applicable" — обязательство заключить корпоративный договор
                              отсутствует;
           "not_checkable"  — недостаточно данных.
        8. evidence — массив цитат из текста договора.
        </task>
        <rules>
        1. Используй только текст договора, без внешних знаний.
        2. Не выводи обязательство заключить корпоративный договор из нормы
           ст. 67.2 ГК РФ — фиксируй только как указано в тексте. Норму
           используй ИСКЛЮЧИТЕЛЬНО для проверки соответствия
           (поле corporate_agreement_compliance).
        3. Различай состояния:
           - defined — значение прямо указано;
           - not_defined — упоминания нет;
           - partial — часть данных есть, часть отсутствует;
           - unclear — текст есть, но неоднозначен;
           - отсылка — значение определяется через приложение / спецификацию.
        4. Не путай "not_defined" и "not_applicable": not_applicable —
           только если условие неприменимо по природе сделки.
        5. Состояния "partial" / "unclear" / "отсылка" отражай через
           value-поле; в status-полях допустимо только "defined" /
           "not_defined".
        6. Замена терминов (для нормализации в value-полях):
           - "drag-along" → «право требовать продажи доли»;
           - "tag-along" → «право присоединиться к продаже»;
           - "call-опцион" → «опцион на приобретение»;
           - "put-опцион" → «опцион на продажу».
        7. corporate_agreement_compliance — определи по правилам:
           - "compliant"      — обязательство указано, тип заключения не
                                ограничен или указано единогласие, условия
                                не противоречат ст. 67.2 п. 5 ГК РФ;
           - "non_unanimous"  — прямо указано, что корпоративный договор
                                будет заключаться большинством голосов или
                                иным способом, кроме единогласия (ст. 67.2
                                п. 4 ГК РФ требует единогласия);
           - "invalid_terms"  — в перечне условий есть противоречащие
                                ст. 67.2 п. 5 ГК РФ (обязательство голосовать
                                по указаниям органов общества, определение
                                структуры органов, их компетенции);
           - "not_applicable" — обязательство отсутствует;
           - "not_checkable"  — недостаточно данных.
        8. Если в тексте указано обязательство заключить корпоративный
           договор, но срок не указан — фиксируй
           deadline_for_conclusion_status = "not_defined" и
           deadline_for_conclusion_details = "Данные не определены".
           Не применяй автоматически годичный срок ст. 429 п. 4 ГК РФ —
           это только для информации в reason.
        9. Если status = "not_defined" — value = "Данные не определены",
           evidence = [].
        10. Значения enum-полей — строго из allowed_values.
        11. Запрещены "None", "null", пустые строки, отсутствующие ключи.
        12. Верни РОВНО один валидный JSON-объект со всеми 8 ключами,
            пригодный для парсинга через json.loads без предварительной
            обработки. Без markdown, без ```json, без комментариев, без
            текста до или после. Начни ответ сразу с { и закончи }.
        </rules>
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — обязательство определено, соответствует норме:
        Фрагмент:
        "Учредители обязуются заключить корпоративный договор в течение
        30 дней после государственной регистрации Общества. Предварительно
        согласованы: порядок голосования, право требовать продажи доли,
        право присоединиться к продаже, право первого отказа."
        Ответ:
        {
          "corporate_agreement_obligation_status": "defined",
          "corporate_agreement_obligation_details": "учредители обязуются заключить корпоративный договор после государственной регистрации",
          "key_terms_previewed_status": "defined",
          "key_terms_previewed_details": "порядок голосования; право требовать продажи доли (drag-along); право присоединиться к продаже (tag-along); право первого отказа",
          "deadline_for_conclusion_status": "defined",
          "deadline_for_conclusion_details": "в течение 30 дней после государственной регистрации",
          "corporate_agreement_compliance": "compliant",
          "evidence": [
            {
              "clause_ref": "п. 8.1",
              "quote": "Учредители обязуются заключить корпоративный договор в течение 30 дней после государственной регистрации Общества."
            }
          ]
        }
        Пример 2 — обязательство отсутствует:
        Фрагмент:
        "Учредители обязуются создать общество."
        Ответ:
        {
          "corporate_agreement_obligation_status": "not_defined",
          "corporate_agreement_obligation_details": "Данные не определены",
          "key_terms_previewed_status": "not_defined",
          "key_terms_previewed_details": "Данные не определены",
          "deadline_for_conclusion_status": "not_defined",
          "deadline_for_conclusion_details": "Данные не определены",
          "corporate_agreement_compliance": "not_applicable",
          "evidence": []
        }
        Пример 3 — не соответствует норме (не единогласно):
        Фрагмент:
        "Учредители обязуются заключить корпоративный договор в течение
        60 дней после государственной регистрации. Корпоративный договор
        заключается большинством голосов учредителей."
        Ответ:
        {
          "corporate_agreement_obligation_status": "defined",
          "corporate_agreement_obligation_details": "учредители обязуются заключить корпоративный договор после государственной регистрации",
          "key_terms_previewed_status": "not_defined",
          "key_terms_previewed_details": "Данные не определены",
          "deadline_for_conclusion_status": "defined",
          "deadline_for_conclusion_details": "в течение 60 дней после государственной регистрации",
          "corporate_agreement_compliance": "non_unanimous",
          "evidence": [
            {
              "clause_ref": "п. 8.1",
              "quote": "Корпоративный договор заключается большинством голосов учредителей."
            }
          ]
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямая цитата об обязательстве заключить корпоративный
           договор? Если нет — corporate_agreement_obligation_status =
           "not_defined", corporate_agreement_obligation_details =
           "Данные не определены".
        2. Перечислены ли предварительно согласованные условия? Если нет —
           key_terms_previewed_status = "not_defined".
        3. Указан ли срок заключения? Если нет —
           deadline_for_conclusion_status = "not_defined".
        4. Определи corporate_agreement_compliance — строго из
           allowed_values. Проверь: указано ли единогласие (ст. 67.2 п. 4
           ГК РФ); нет ли условий, противоречащих ст. 67.2 п. 5 ГК РФ
           (обязательство голосовать по указаниям органов общества).
        5. Замени англицизмы на русские термины в value-полях
           (drag-along → право требовать продажи доли и т. д.).
        Не выводи шаги проверки. Верни только JSON.
      fields:
        - name: "corporate_agreement_obligation_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус наличия обязательства заключить корпоративный договор."
          required: true
        - name: "corporate_agreement_obligation_details"
          type: "string"
          presentation: "fact"
          label: "Корпоративный договор"
          description: "Текст обязательства заключить корпоративный договор так, как указано в договоре."
          required: true
          display_in_grid: true
          display_priority: 1
        - name: "key_terms_previewed_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус перечня предварительно согласованных условий."
          required: true
        - name: "key_terms_previewed_details"
          type: "string"
          presentation: "fact"
          label: "Согласованные условия"
          description: "Перечень предварительно согласованных условий корпоративного договора."
          required: true
          display_in_grid: true
          display_priority: 2
        - name: "deadline_for_conclusion_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания срока заключения корпоративного договора."
          required: true
        - name: "deadline_for_conclusion_details"
          type: "string"
          presentation: "fact"
          label: "Срок заключения"
          description: "Срок заключения корпоративного договора так, как указано в договоре."
          required: true
          display_in_grid: false
        - name: "corporate_agreement_compliance"
          type: "string"
          presentation: "signal"
          allowed_values: ["compliant", "non_unanimous", "invalid_terms", "not_applicable", "not_checkable"]
          description: "Соответствие императивным требованиям ст. 67.2 п. 4–5 ГК РФ (единогласие; запрет условий, обязывающих голосовать по указаниям органов общества)."
          required: true

  - id: founder_withdrawal_check
    name: "Выход учредителя из процесса учреждения до регистрации (ст. 310, 450.1 ГК РФ)"
    description: >
      Фиксация в договоре об учреждении процедуры выхода учредителя из
      процесса учреждения (до государственной регистрации общества):
      порядок уведомления, срок, судьба доли и порядок возмещения расходов.
      Отказ от договора об учреждении до регистрации квалифицируется как
      односторонний отказ от исполнения обязательства или соглашение о
      расторжении (ст. 450, 450.1 ГК РФ) и допустим только если прямо
      предусмотрен договором или законом (ст. 310 ГК РФ). Не путать с
      выходом участника из ООО после регистрации (ст. 26 ФЗ-14) —
      другая правовая природа.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "medium"
    severity_if_pass: "pass"
    severity_if_fail: "medium"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "выход учредителя"
        - "отказ от участия в учреждении"
        - "односторонний отказ от договора"
        - "отказ от исполнения договора"
        - "расторжение договора по соглашению"
        - "письменное уведомление"
        - "распределение доли"
        - "возмещение расходов"
        - "последствия выхода"
      keyword_mode: "any"
      regex_patterns:
        - '(?i)выход(а|у)?\\s+учредител'
        - '(?i)отказ\\s+от\\s+участи(я|е)\\s+в\\s+учреждени'
        - '(?i)односторонн(ий|его|ему)\\s+отказ'
        - '(?i)отказ\\s+от\\s+исполнени(я|е)\\s+договор'
        - '(?i)уведоми(в|ть|вши)\\s+(друг(их|ого)|остальных)\\s+учредител'

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по корпоративному праву. Анализируется договор
        об учреждении общества (ст. 310, 429, 450, 450.1 ГК РФ). Проверяется
        только один вопрос: содержит ли текст договора процедуру выхода
        учредителя из процесса учреждения до государственной регистрации.
        [ЗАДАЧА]
        Определи, содержит ли текст договора:
        1. Право учредителя выйти из процесса учреждения до регистрации.
        2. Порядок и срок уведомления о таком выходе.
        3. Порядок распределения прав и обязанностей выходящего учредителя
           между оставшимися.
        4. Порядок возмещения расходов, связанных с выходом.
        Верни вердикт:
        - "pass"    — процедура выхода указана прямо, определены уведомление
                      и последствия (судьба прав / возмещение расходов).
        - "fail"    — процедура выхода отсутствует.
        - "unclear" — процедура упомянута, но уведомление или последствия
                      неопределимы.
        [ПРАВИЛА]
        1. Используй только текст договора.
        2. Evidence — прямые цитаты из договора.
        3. Верни РОВНО один валидный JSON-объект со всеми 4 ключами
           (verdict, confidence, reason, evidence), пригодный для парсинга
           через json.loads без предварительной обработки. Без markdown,
           без ```json, без комментариев, без текста до или после.
           Начни ответ сразу с { и закончи }.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — процедура определена:
        Фрагмент:
        "Учредитель вправе выйти из процесса учреждения, уведомив остальных
        учредителей в письменной форме за 15 дней. Права и обязанности
        выходящего учредителя распределяются между оставшимися учредителями
        пропорционально их долям. Выходящий учредитель возмещает фактически
        понесённые остальными учредителями расходы."
        Ответ:
        {
          "verdict": "pass",
          "confidence": 0.95,
          "reason": "Прямо указаны право выхода, порядок и срок уведомления, распределение прав и возмещение расходов.",
          "evidence": [
            {
              "clause_ref": "п. 9.1",
              "quote": "Учредитель вправе выйти из процесса учреждения, уведомив остальных учредителей в письменной форме за 15 дней."
            }
          ]
        }
        Пример 2 — процедура отсутствует:
        Фрагмент:
        "Учредители обязуются создать общество."
        Ответ:
        {
          "verdict": "fail",
          "confidence": 0.90,
          "reason": "В тексте отсутствует процедура выхода учредителя из процесса учреждения.",
          "evidence": []
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямое указание права выхода / отказа от учреждения?
        2. Указан ли порядок и срок уведомления?
        3. Указаны ли последствия (судьба прав, возмещение расходов)?
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "verdict": "<pass / fail / unclear>",
          "confidence": <0.0–1.0>,
          "reason": "<краткое объяснение вердикта>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 500

    retrieval:
      retrieval_profile: "termination_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "выход учредителя отказ от участия односторонний отказ от договора отказ от исполнения договора расторжение по соглашению уведомление распределение доли возмещение расходов последствия выхода ст. 310 ст. 450.1 ГК РФ"
      preferred_unit_types:
        - termination_provision
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - remedies
        - procedures
      negative_keywords:
        - "уставный капитал"
        - "оплата доли"
        - "неденежный вклад"
        - "оценка"
        - "солидарная ответственность"
        - "субсидиарная ответственность"
        - "корпоративный договор"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.50, 0.95]
        boost: 0.30
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "remedies"
        - "procedures"
      confidence_bonus_on_match: 0.06
      confidence_penalty_on_excluded_segment: 0.08

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 500

    extraction:
      enabled: true
      mode: "hybrid"
      store_payload: true
      compact_output: false
      llm_max_tokens: 900
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по корпоративному праву. Извлекаешь из
        договора об учреждении общества процедуру выхода учредителя из
        процесса учреждения до государственной регистрации: уведомление,
        срок, судьбу доли и порядок возмещения расходов. Не анализируешь
        уставный капитал, порядок оплаты долей, оценку неденежных вкладов
        и солидарно-субсидиарную ответственность — эти темы проверяются
        отдельными чеками.
        </role>
        <context>
        {context}
        </context>
        <task>
        Заполни строго следующие 9 полей + evidence (всего 10 ключей):
        1. withdrawal_clause_status — "defined" или "not_defined":
           указано ли право выхода учредителя из процесса учреждения.
        2. withdrawal_clause_details — текст процедуры выхода так, как
           указано в договоре.
        3. notification_period_status — "defined" или "not_defined":
           указан ли срок уведомления.
        4. notification_period_details — значение срока уведомления так,
           как указано в договоре.
        5. share_redistribution_status — "defined" или "not_defined":
           указан ли порядок распределения прав / доли выходящего учредителя.
        6. share_redistribution_details — текст о распределении прав / доли.
        7. expense_reimbursement_status — "defined" или "not_defined":
           указан ли порядок возмещения расходов при выходе.
        8. expense_reimbursement_details — текст о возмещении расходов.
        9. withdrawal_compliance — правомерность одностороннего отказа
           по ст. 310 и ст. 450.1 ГК РФ:
           "compliant"             — отказ прямо предусмотрен договором
                                     или реализуется по соглашению сторон;
           "unilateral_not_allowed" — отказ фактически допускается, но
                                     договорного основания для одностороннего
                                     отказа нет (сформулировано как «право»,
                                     но без прямого условия об отказе);
           "not_applicable"        — процедура выхода отсутствует;
           "not_checkable"         — недостаточно данных.
        10. evidence — массив цитат из текста договора.
        </task>
        <rules>
        1. Используй только текст договора, без внешних знаний.
        2. Не выводи процедуру выхода из нормы — фиксируй только как
           указано в тексте. Норму используй ИСКЛЮЧИТЕЛЬНО для классификации
           withdrawal_compliance.
        3. Различай состояния:
           - defined — значение прямо указано;
           - not_defined — упоминания нет;
           - partial — часть данных есть, часть отсутствует;
           - unclear — текст есть, но неоднозначен;
           - отсылка — значение определяется через приложение / спецификацию.
        4. Не путай "not_defined" и "not_applicable": not_applicable —
           только если условие неприменимо по природе сделки.
        5. Состояния "partial" / "unclear" / "отсылка" отражай через
           value-поле; в status-полях допустимо только "defined" /
           "not_defined".
        6. Терминологическая нормализация value-полей:
           - «выход из договора» → «односторонний отказ от договора»
             или «расторжение по соглашению сторон» (по контексту);
           - «распределение доли» → «распределение прав и обязанностей
             по договору об учреждении» (до регистрации «доли» как
             объекта нет).
        7. withdrawal_compliance — определи по правилам:
           - "compliant"            — в тексте прямо указано, что
                                      учредитель вправе выйти / отказаться
                                      от участия / расторгнуть договор
                                      (условие об одностороннем отказе либо
                                      о расторжении по соглашению сторон
                                      воспроизведено прямо);
           - "unilateral_not_allowed" — договор упоминает «право выхода»,
                                      но без прямого указания на односторонний
                                      отказ или на порядок расторжения, что
                                      создаёт неопределённость с позиции
                                      ст. 310 ГК РФ;
           - "not_applicable"       — процедура выхода отсутствует;
           - "not_checkable"        — недостаточно данных.
        8. Не путай предрегистрационный выход с выходом участника из
           ООО после регистрации (ст. 26 ФЗ-14) — это разные правовые
           конструкции; в этом чеке фиксируется только предрегистрационный
           выход.
        9. Если status = "not_defined" — value = "Данные не определены",
           evidence = [].
        10. Значения enum-полей — строго из allowed_values.
        11. Запрещены "None", "null", пустые строки, отсутствующие ключи.
        12. Верни РОВНО один валидный JSON-объект со всеми 10 ключами,
            пригодный для парсинга через json.loads без предварительной
            обработки. Без markdown, без ```json, без комментариев, без
            текста до или после. Начни ответ сразу с { и закончи }.
        </rules>
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — compliant, процедура определена:
        Фрагмент:
        "Учредитель вправе выйти из процесса учреждения, уведомив остальных
        учредителей в письменной форме за 15 дней. Права и обязанности
        выходящего учредителя распределяются между оставшимися учредителями
        пропорционально их долям. Выходящий учредитель возмещает фактически
        понесённые остальными учредителями расходы."
        Ответ:
        {
          "withdrawal_clause_status": "defined",
          "withdrawal_clause_details": "учредитель вправе выйти, уведомив остальных учредителей в письменной форме за 15 дней",
          "notification_period_status": "defined",
          "notification_period_details": "за 15 дней",
          "share_redistribution_status": "defined",
          "share_redistribution_details": "права и обязанности распределяются между оставшимися учредителями пропорционально их долям",
          "expense_reimbursement_status": "defined",
          "expense_reimbursement_details": "выходящий учредитель возмещает фактически понесённые расходы",
          "withdrawal_compliance": "compliant",
          "evidence": [
            {
              "clause_ref": "п. 9.1",
              "quote": "Учредитель вправе выйти из процесса учреждения, уведомив остальных учредителей в письменной форме за 15 дней."
            }
          ]
        }
        Пример 2 — процедура отсутствует:
        Фрагмент:
        "Учредители обязуются создать общество."
        Ответ:
        {
          "withdrawal_clause_status": "not_defined",
          "withdrawal_clause_details": "Данные не определены",
          "notification_period_status": "not_defined",
          "notification_period_details": "Данные не определены",
          "share_redistribution_status": "not_defined",
          "share_redistribution_details": "Данные не определены",
          "expense_reimbursement_status": "not_defined",
          "expense_reimbursement_details": "Данные не определены",
          "withdrawal_compliance": "not_applicable",
          "evidence": []
        }
        Пример 3 — неоднозначное основание для одностороннего отказа:
        Фрагмент:
        "Учредитель вправе выйти из состава учредителей в любой момент."
        Ответ:
        {
          "withdrawal_clause_status": "defined",
          "withdrawal_clause_details": "учредитель вправе выйти из состава учредителей в любой момент",
          "notification_period_status": "not_defined",
          "notification_period_details": "Данные не определены",
          "share_redistribution_status": "not_defined",
          "share_redistribution_details": "Данные не определены",
          "expense_reimbursement_status": "not_defined",
          "expense_reimbursement_details": "Данные не определены",
