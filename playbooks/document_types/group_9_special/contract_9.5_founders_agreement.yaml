      - '(?i)аренд[аа]\\s+до\\s+регистраци[ии]'

  corporate_agreement_planned:
    any_keywords:
      - '(?i)корпоративн[ыо]й\\s+договор'
      - '(?i)акционерн[оа]е\\s+соглашени[ея]'
      - '(?i)соглашени[ея]\\s+об\\s+осуществлени[ии]\\s+прав\\s+участник[оо]в'
      - '(?i)\\bdrag-?along\\b'
      - '(?i)\\btag-?along\\b'
      - '(?i)прав[оо]\\s+первого\\s+отказ[аа]'
      - '(?i)\\bопцион\\b'

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 3: SHARED PATTERNS
#  Читается: DocTypeCheckLoader через _resolve_yaml_templates()
# ════════════════════════════════════════════════════════════════════════════

shared_patterns:
  money_amount: "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|тыс|млн)"
  date_pattern: "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"
  percentage_pattern: "(?i)\\b\\d+[,.]?\\d*\\s*(%|процент)"
  inn_pattern: "(?i)\\bИНН\\s*\\d{10,12}\\b"
  ogrn_pattern: "(?i)\\bОГРН\\s*\\d{13,15}\\b"

compliance_rules: []

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: CHECKS_V8 — единственный рабочий слой юридического анализа
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  - id: founders_and_company_check
    name: "Учредители, наименование и ОПФ создаваемого общества"
    description: >
      Фактографическая проверка идентификации учредителей (ФИО/наименование,
      ИНН, ОГРН, КПП, адрес, паспортные данные) и данных создаваемого общества
      (полное наименование, ОПФ, место нахождения, количество учредителей).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "учредитель"
        - "создать общество"
        - "наименование общества"
        - "организационно-правовая форма"
        - "место нахождения"
        - "ООО"
        - "АО"
        - "ПАО"
        - "ИНН"
        - "ОГРН"
        - "КПП"
        - "паспорт"
        - "адрес"
      keyword_mode: "any"
      regex_patterns:
        - '(?i)учредител(ь|и|ей|ями)\\s*([-—:]|обязу)'
        - '(?i)(ООО|АО|ПАО|ЗАО|ОАО)\\s*[«\"]'
        - '(?i)(Общество\\s+с\\s+ограниченной\\s+ответственностью|Публичное\\s+акционерное\\s+общество|Непубличное\\s+акционерное\\s+общество)\\s*[«\"]'
        - '(?i)\\bИНН\\s*\\d{10,12}\\b'
        - '(?i)\\bОГРН\\s*\\d{13,15}\\b'
        - '(?i)\\bКПП\\s*\\d{9}\\b'

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по корпоративному праву. Анализируется договор
        об учреждении общества (ст. 89.1 ГК РФ, ст. 11 ФЗ-14 «Об ООО»,
        ст. 9 ФЗ-208 «Об АО»). Проверяется только один вопрос: содержит ли
        текст договора идентификацию учредителей и данные создаваемого
        общества.
        [ЗАДАЧА]
        Определи, содержит ли текст договора:
        1. Перечень учредителей (ФИО/наименование, ИНН, ОГРН, КПП, паспорт, адрес).
        2. Количество учредителей.
        3. Полное наименование создаваемого общества.
        4. Организационно-правовую форму (ООО/АО/ПАО).
        5. Место нахождения создаваемого общества.
        Верни вердикт:
        - "pass"    — идентификация учредителей и данные общества указаны прямо.
        - "fail"    — идентификация или данные общества отсутствуют.
        - "unclear" — данные частичны или фрагментарны (указан только
                      один элемент либо состав учредителей неполный).
        [ПРАВИЛА]
        1. Используй только текст договора.
        2. Evidence — прямые цитаты из договора.
        3. Верни РОВНО один валидный JSON-объект со всеми 4 ключами
           (verdict, confidence, reason, evidence), пригодный для парсинга
           через json.loads без предварительной обработки. Без markdown,
           без ```json, без комментариев, без текста до или после.
           Начни ответ сразу с { и закончи }.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — данные определены:
        Фрагмент:
        "Учредители: 1) Иванов Иван Иванович, паспорт 45 00 № 123456,
        ИНН 770000000001; 2) ООО «Альфа», ИНН 7700000001, ОГРН 1027700000001.
        Учредители создают Общество с ограниченной ответственностью «Бета».
        Место нахождения: г. Москва."
        Ответ:
        {
          "verdict": "pass",
          "confidence": 0.95,
          "reason": "Прямо указаны перечень учредителей, количество, наименование, ОПФ и место нахождения создаваемого общества.",
          "evidence": [
            {
              "clause_ref": "преамбула",
              "quote": "Учредители: 1) Иванов Иван Иванович, паспорт 45 00 № 123456, ИНН 770000000001; 2) ООО «Альфа», ИНН 7700000001, ОГРН 1027700000001."
            }
          ]
        }
        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Стороны договорились создать общество."
        Ответ:
        {
          "verdict": "fail",
          "confidence": 0.90,
          "reason": "В тексте отсутствуют перечень учредителей, наименование, ОПФ и место нахождения создаваемого общества.",
          "evidence": []
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли в тексте прямое указание состава учредителей?
        2. Есть ли в тексте прямое указание наименования и ОПФ создаваемого общества?
        3. Если хотя бы одного из пунктов нет — понизь вердикт до "unclear" или "fail".
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "verdict": "<pass / fail / unclear>",
          "confidence": <0.0–1.0>,
          "reason": "<краткое объяснение вердикта>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 700

    retrieval:
      retrieval_profile: "party_identification_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "учредитель создать общество наименование общества организационно-правовая форма место нахождения ООО АО ПАО ИНН ОГРН паспорт адрес количество учредителей"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - representations
        - definitions
        - boilerplate
      negative_keywords:
        - "уставный капитал"
        - "доля учредителя"
        - "оплата доли"
        - "солидарная ответственность"
        - "неденежный вклад"
        - "оценка"
        - "корпоративный договор"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 0.25]
        boost: 0.30
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "representations"
        - "definitions"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.15

    evidence:
      required: true
      min_snippet_length: 50
      max_snippet_length: 1000

    extraction:
      enabled: true
      mode: "hybrid"
      store_payload: true
      compact_output: false
      llm_max_tokens: 1400
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по корпоративному праву. Извлекаешь из договора
        об учреждении общества сведения об учредителях и о создаваемом
        обществе. Не анализируешь уставный капитал, доли, порядок их оплаты
        и солидарную ответственность — эти темы проверяются отдельными
        чеками.
        </role>
        <context>
        {context}
        </context>
        <task>
        Заполни строго следующие 9 полей + evidence (всего 10 ключей):
        1. founders_list_status — "defined" или "not_defined".
        2. founders_list_details — перечень учредителей с реквизитами
           (ФИО/наименование, ИНН, ОГРН, КПП, паспорт, адрес).
        3. number_of_founders_status — "defined" или "not_defined".
        4. number_of_founders_value — количество учредителей (число).
        5. company_name_status — "defined" или "not_defined".
        6. company_name_value — полное наименование создаваемого общества.
        7. company_form_code — "ooo" / "ao" / "pao" / "not_defined".
        8. company_location_status — "defined" или "not_defined".
        9. company_location_value — место нахождения создаваемого общества.
        10. evidence — массив цитат из текста договора.
        </task>
        <rules>
        1. Используй только текст договора, без внешних знаний.
        2. Не выводи реквизиты из контекста — только прямо указанные в документе.
        3. Для физлиц фиксируй полные паспортные данные (серия, номер,
           кем выдан, дата выдачи, код подразделения — если указаны).
        4. Для юрлиц фиксируй ИНН, ОГРН, КПП, адрес места нахождения —
           если указаны.
        5. Различай состояния:
           - defined — значение прямо указано;
           - not_defined — упоминания нет;
           - partial — часть данных есть, часть отсутствует;
           - unclear — текст есть, но неоднозначен;
           - отсылка — значение определяется через приложение / спецификацию /
             реестр (валидный факт, фиксируй со ссылкой).
        6. Не путай "not_defined" и "not_applicable": not_applicable —
           только если условие неприменимо по природе сделки.
        7. Состояния "partial" / "unclear" / "отсылка" отражай через
           value-поле; в status-полях допустимо только "defined" / "not_defined".
        8. Если status = "not_defined" — value = "Данные не определены",
           evidence = [].
        9. Значение status-полей — строго из allowed_values; значение
           company_form_code — строго из ["ooo", "ao", "pao", "not_defined"].
        10. Запрещены "None", "null", пустые строки, отсутствующие ключи.
        11. Верни РОВНО один валидный JSON-объект со всеми 10 ключами,
            пригодный для парсинга через json.loads без предварительной
            обработки. Без markdown, без ```json, без комментариев, без
            текста до или после. Начни ответ сразу с { и закончи }.
        </rules>
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — данные определены:
        Фрагмент:
        "Учредители:
        1) Иванов Иван Иванович, паспорт 45 00 № 123456, выдан ОУФМС России
        по г. Москве по району Тверской 15.03.2010, код подразделения
        770-001, ИНН 770000000001, зарегистрирован по адресу: г. Москва,
        ул. Тверская, д. 10, кв. 5;
        2) ООО «Альфа», ИНН 7700000001, КПП 770001001,
        ОГРН 1027700000001, адрес: 125009, г. Москва, ул. Ленина, д. 1.
        Учредители создают Общество с ограниченной ответственностью «Бета».
        Место нахождения создаваемого общества: г. Москва."
        Ответ:
        {
          "founders_list_status": "defined",
          "founders_list_details": "1) Иванов Иван Иванович, паспорт 45 00 № 123456, выдан ОУФМС России по г. Москве по району Тверской 15.03.2010, код подразделения 770-001, ИНН 770000000001, зарегистрирован: г. Москва, ул. Тверская, д. 10, кв. 5; 2) ООО «Альфа», ИНН 7700000001, КПП 770001001, ОГРН 1027700000001, адрес: 125009, г. Москва, ул. Ленина, д. 1",
          "number_of_founders_status": "defined",
          "number_of_founders_value": 2,
          "company_name_status": "defined",
          "company_name_value": "Общество с ограниченной ответственностью «Бета»",
          "company_form_code": "ooo",
          "company_location_status": "defined",
          "company_location_value": "г. Москва",
          "evidence": [
            {
              "clause_ref": "преамбула",
              "quote": "Учредители: 1) Иванов Иван Иванович, паспорт 45 00 № 123456, 2) ООО «Альфа», ИНН 7700000001. Учредители создают Общество с ограниченной ответственностью «Бета»."
            }
          ]
        }
        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Стороны договорились создать общество."
        Ответ:
        {
          "founders_list_status": "not_defined",
          "founders_list_details": "Данные не определены",
          "number_of_founders_status": "not_defined",
          "number_of_founders_value": 0,
          "company_name_status": "not_defined",
          "company_name_value": "Данные не определены",
          "company_form_code": "not_defined",
          "company_location_status": "not_defined",
          "company_location_value": "Данные не определены",
          "evidence": []
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямая цитата с перечнем учредителей? Если нет —
           founders_list_status = "not_defined", founders_list_details =
           "Данные не определены".
        2. Собраны ли для физлиц паспортные данные (серия, номер, кем выдан,
           дата выдачи, код подразделения — если указаны)?
        3. Собраны ли для юрлиц ИНН, ОГРН, КПП, адрес — если указаны?
        4. Есть ли прямая цитата с наименованием и ОПФ создаваемого общества?
        5. Есть ли прямая цитата с местом нахождения создаваемого общества?
        Не выводи шаги проверки. Верни только JSON.
      fields:
        - name: "founders_list_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус идентификации учредителей."
          required: true
        - name: "founders_list_details"
          type: "string"
          presentation: "fact"
          label: "Учредители"
          description: "Перечень учредителей с реквизитами (ФИО/наименование, ИНН, ОГРН, КПП, паспорт, адрес)."
          required: true
          display_in_grid: true
          display_priority: 1
        - name: "number_of_founders_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения количества учредителей."
          required: true
        - name: "number_of_founders_value"
          type: "number"
          presentation: "fact"
          label: "Количество учредителей"
          description: "Количество учредителей (число)."
          required: true
          display_in_grid: true
          display_priority: 2
        - name: "company_name_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения наименования создаваемого общества."
          required: true
        - name: "company_name_value"
          type: "string"
          presentation: "fact"
          label: "Наименование общества"
          description: "Полное наименование создаваемого общества."
          required: true
          display_in_grid: true
          display_priority: 3
        - name: "company_form_code"
          type: "string"
          presentation: "fact"
          label: "ОПФ"
          allowed_values: ["ooo", "ao", "pao", "not_defined"]
          description: "Организационно-правовая форма создаваемого общества (ooo / ao / pao)."
          required: true
          display_in_grid: false
        - name: "company_location_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения места нахождения создаваемого общества."
          required: true
        - name: "company_location_value"
          type: "string"
          presentation: "fact"
          label: "Место нахождения"
          description: "Место нахождения создаваемого общества."
          required: true
          display_in_grid: true
          display_priority: 4

  - id: charter_capital_shares_check
    name: "Уставный капитал: размер, доли, номинальная стоимость (ст. 89.1 ГК РФ, ст. 14 ФЗ-14)"
    description: >
      Фактографическая проверка размера уставного капитала, размера и
      номинальной стоимости доли каждого учредителя, формата доли (процент
      или простая дробь), а также подтверждения, что сумма долей = 100%.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "уставный капитал"
        - "размер уставного капитала"
        - "доля учредителя"
        - "номинальная стоимость"
        - "простая дробь"
        - "процент"
        - "рублей"
      keyword_mode: "any"
      regex_patterns:
        - '(?i)уставн(ый|ого)\\s+капитал(а)?\\s+(составляет|равен|в\\s+размере)'
        - '(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽)'
        - '(?i)\\b\\d+[,.]?\\d*\\s*(%|процент)'
        - '(?i)(100\\s*%|сто\\s+процент)'
        - '(?i)номинальн(ая|ой)\\s+стоимост'
        - '(?i)прост(ая|ой)\\s+дроб'

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по корпоративному праву. Анализируется договор
        об учреждении общества (ст. 89.1 ГК РФ, ст. 11, 14 ФЗ-14 «Об ООО»,
        ст. 26 ФЗ-208 «Об АО»). Проверяется только один вопрос: содержит ли
        текст договора условия об уставном капитале и распределении долей
        учредителей.
        [ЗАДАЧА]
        Определи, содержит ли текст договора:
        1. Общий размер уставного капитала (в рублях).
        2. Валюту уставного капитала.
        3. Размер и номинальную стоимость доли каждого учредителя.
        4. Подтверждение, что сумма долей составляет 100%.
        Верни вердикт:
        - "pass"    — размер УК, доли с номиналом и подтверждение 100%
                      указаны прямо.
        - "fail"    — условия об УК или долях отсутствуют.
        - "unclear" — данные частичны: указан размер УК, но нет долей;
                      указаны доли, но нет номинала; сумма долей не
                      подтверждена как 100%.
        [ПРАВИЛА]
        1. Используй только текст договора.
        2. Evidence — прямые цитаты из договора.
        3. Верни РОВНО один валидный JSON-объект со всеми 4 ключами
           (verdict, confidence, reason, evidence), пригодный для парсинга
           через json.loads без предварительной обработки. Без markdown,
           без ```json, без комментариев, без текста до или после.
