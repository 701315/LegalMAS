      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по корпоративному праву. Извлекаешь из
        договора об учреждении заверения и гарантии учредителей.
        Не анализируешь уставный капитал, регистрацию, налоги или директора —
        эти темы проверяются отдельными чеками.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 8 полей + evidence (всего 9 ключей):

        0. founders_representations_warranties_check_presence:
          Агрегатное signal-поле — наличие заверений и гарантий учредителей.
          - "present" — если хотя бы одно из содержательных полей
            (legal_capacity_status, document_accuracy_status,
              contribution_clean_status, corporate_approval_status)
            = "defined";
          - "missing" — если все содержательные поля = "not_defined"
            (в том числе если corporate_approval_status = "not_applicable"
              и остальные три = "not_defined");
          - "unclear" — если фрагменты по теме есть, но из-за противоречий
            вывод невозможен.

          Если presence = "missing":
          - legal_capacity_status = "not_defined";
          - document_accuracy_status = "not_defined";
          - contribution_clean_status = "not_defined";
          - corporate_approval_status = "not_defined";
          - все *_details = "Данные не определены";
          - не выполняй остальные шаги.

        1. legal_capacity_status:
          - "defined" — если в тексте прямо указаны заверения о
            правоспособности, дееспособности, отсутствии дисквалификации;
          - "not_defined" — если нет.

        2. legal_capacity_details:
          Заверения о правоспособности, дееспособности, отсутствии
          дисквалификации.
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".

        3. document_accuracy_status:
          - "defined" — если в тексте прямо указаны заверения о достоверности
            документов («документы достоверны», «сведения точны и полны»);
          - "not_defined" — если нет.

        4. document_accuracy_details:
          Заверения о достоверности документов.
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".

        5. contribution_clean_status:
          - "defined" — если в тексте прямо указано, что вклад свободен от
            обременений («не заложено», «не арестовано», «не является
            предметом спора»);
          - "not_defined" — если нет.

        6. contribution_clean_details:
          Заверения о свободе вклада от обременений.
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".

        7. corporate_approval_status:
          - "defined"       — если в тексте прямо указаны корпоративные
                              одобрения юрлиц-учредителей («одобрено общим
                              собранием», «решение совета директоров»,
                              «крупная сделка одобрена»);
          - "not_applicable" — если все учредители — физлица (корпоративное
                              одобрение неприменимо);
          - "not_defined"   — если нет ни прямого указания, ни оснований
                              считать неприменимым.

        8. corporate_approval_details:
          Заверения о корпоративных одобрениях юрлиц-учредителей.
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".

        9. evidence — массив цитат из текста договора.
        </task>

        <context_rules>
        - Перед остальными полями заполни founders_representations_warranties_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Данные не определены".
        - Используй только текст договора, без внешних знаний.
        - legal_capacity: ищи «правоспособен», «дееспособен», «не дисквалифицирован», «не включён в реестр массовых учредителей».
        - document_accuracy: ищи «документы достоверны», «сведения точны и полны».
        - contribution_clean: ищи «свободно от обременений», «не заложено», «не арестовано», «не является предметом спора».
        - corporate_approval: ищи «одобрено общим собранием», «решение совета директоров», «крупная сделка одобрена». Если все учредители — физлица, ставь corporate_approval_status = "not_applicable".
        - Не путай "not_defined" и "not_applicable": not_applicable — только если условие неприменимо по природе сделки (все учредители — физлица).
        - Состояния "partial" / "unclear" / "отсылка" отражай через details-поле; в status-полях допустимо только "defined" / "not_defined" / "not_applicable" (для corporate_approval_status).
        - Если status = "not_defined" — details = "Данные не определены".
        - Не используй пустые строки, "None", "null".
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
          В договоре нет ни одного заверения или гарантии учредителей.
          → presence = "missing";
            legal_capacity_status = "not_defined";
            document_accuracy_status = "not_defined";
            contribution_clean_status = "not_defined";
            corporate_approval_status = "not_defined";
            все *_details = "Данные не определены".

        2. Неполное раскрытие темы.
          Есть заверения о правоспособности и достоверности, но нет
          заверений о чистоте вклада или о корпоративном одобрении.
          → presence = "present";
            соответствующие *_status = "defined" / "not_defined" по факту.

        3. Противоречие между фрагментами.
          В разных частях указаны противоположные заверения
          (например, «вклад свободен от обременений» и одновременно
          «вклад находится в залоге»); конфликт нельзя разрешить по тексту.
          → presence = "unclear";
            соответствующий *_status = "not_defined";
            соответствующий *_details = "Не удалось определить".

        4. Только физические лица среди учредителей.
          Все учредители — физлица, корпоративное одобрение неприменимо.
          → corporate_approval_status = "not_applicable";
            corporate_approval_details = "Данные не определены";
            presence может быть "present" или "missing" в зависимости
            от остальных полей.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для founders_representations_warranties_check_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined", "not_defined".
        - Для corporate_approval_status используй только: "defined", "not_applicable", "not_defined".
        - Fallback при отсутствии данных: все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности: соответствующие *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "founders_representations_warranties_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие заверений и гарантий учредителей. Внутреннее агрегатное signal-поле."
          required: true

        - name: "legal_capacity_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус заверений о правоспособности и отсутствии дисквалификации. Внутреннее enum-поле."
          required: true

        - name: "legal_capacity_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Правоспособность"
          description: "Заверения о правоспособности, дееспособности и отсутствии ограничений учредителей."
          required: true

        - name: "document_accuracy_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус заверений о достоверности документов. Внутреннее enum-поле."
          required: true

        - name: "document_accuracy_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Достоверность документов"
          description: "Заверения о достоверности и полноте предоставляемых учредителями документов."
          required: true

        - name: "contribution_clean_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус заверений о свободе вклада от обременений. Внутреннее enum-поле."
          required: true

        - name: "contribution_clean_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Чистота вклада"
          description: "Заверения о том, что вклад свободен от залога, ареста и иных обременений."
          required: true

        - name: "corporate_approval_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_applicable", "not_defined"]
          display_in_grid: false
          description: "Статус заверений о корпоративных одобрениях юрлиц-учредителей. Внутреннее enum-поле."
          required: true

        - name: "corporate_approval_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Корпоративные одобрения"
          description: "Заверения о получении корпоративных одобрений (крупная сделка, заинтересованность)."
          required: false

      store_payload: true

  - id: registration_refusal_procedure_check
    name: "Порядок действий при отказе ФНС в регистрации (ст. 23 ФЗ-129)"
    description: >
      Фактографическая проверка наличия в договоре об учреждении процедурного
      механизма на случай отказа ФНС в государственной регистрации: кто устраняет
      замечания, кто несёт расходы на повторную подачу, сроки устранения, порядок
      обжалования отказа, основания для расторжения договора при невозможности
      регистрации. Критически важно, поскольку ФНС отказывает в ~15–20% случаев.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "отказ в регистрации"
        - "отказ ФНС"
        - "повторная подача"
        - "устранение замечаний"
        - "обжалование отказа"
        - "приостановление регистрации"
        - "невозможность регистрации"
        - "расторжение при отказе"
      keyword_mode: "any"
      regex_patterns:
        - '(?i)отказ.*регистрац'
        - '(?i)повторн.*подач'
        - '(?i)устранени.*замечани'

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по корпоративному праву.
        Анализируется договор об учреждении общества (ст. 23 ФЗ-129).
        Проверяется: содержит ли договор механизм действий при отказе ФНС в регистрации.

        Нормативный ориентир:
        - ст. 23 ФЗ-129 — основания отказа в государственной регистрации.
        - ст. 25 ФЗ-129 — порядок обжалования отказа.
        - ст. 450, 451 ГК РФ — расторжение договора при невозможности исполнения.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Порядок устранения замечаний ФНС (кто, сроки).
        2. Распределение расходов на повторную подачу.
        3. Порядок обжалования отказа.
        4. Основания для расторжения договора при невозможности регистрации.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. verdict = "pass" — механизм отказа урегулирован.
        3. verdict = "unclear" — упомянут частично.
        4. verdict = "fail" — отказ не урегулирован.
        5. Верни РОВНО один валидный JSON-объект со всеми 3 ключами (verdict,
          reason, evidence). Начни ответ сразу с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — механизм урегулирован (pass):
        Фрагмент:
        "В случае отказа ФНС в государственной регистрации учредители обязуются
        в течение 15 рабочих дней устранить выявленные замечания. Расходы на
        повторную подачу несёт учредитель, по вине которого возник отказ.
        При невозможности устранения замечаний в течение 60 дней договор
        расторгается по соглашению сторон."

        Ответ:
        {
          "verdict": "pass",
          "reason": "Урегулированы порядок устранения замечаний, распределение расходов и расторжение при невозможности регистрации.",
          "evidence": [
            {"clause_ref": "п. 14.1", "quote": "В случае отказа ФНС в государственной регистрации учредители обязуются в течение 15 рабочих дней устранить выявленные замечания."}
          ]
        }

        Пример 2 — механизм отсутствует (fail):
        Фрагмент:
        "Учредители обязуются подать документы на регистрацию."

        Ответ:
        {
          "verdict": "fail",
          "reason": "В договоре отсутствует механизм действий при отказе ФНС в регистрации.",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Проверь, что все 3 ключа (verdict, reason, evidence) присутствуют в JSON.
        Не выводи шаги проверки. Верни только JSON.
      context_k: 8
      temperature: 0.0
      max_tokens: 650

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "отказ в регистрации ФНС повторная подача устранение замечаний обжалование невозможность регистрации расторжение при отказе"
      retrieval_profile: "termination_check"
      preferred_unit_types:
        - obligation
        - general_provision
        - termination_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - procedures
        - obligations
        - remedies
      negative_keywords:
        - "уставный капитал"
        - "оплата долей"
        - "налоговый режим"
        - "директор"
        - "в целях настоящего Договора понимается"
      position_bias:
        preferred_range: [0.50, 0.95]
        boost: 0.30
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "procedures"
        - "obligations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1000

      compact_output: false

      presence_signal:
        field: "registration_refusal_procedure_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по корпоративному праву. Извлекаешь из
        договора об учреждении механизм действий при отказе ФНС в регистрации.
        Не анализируешь уставный капитал, директора, налоги или ПДн — эти
        темы проверяются отдельными чеками.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 6 полей + evidence (всего 7 ключей):

        0. registration_refusal_procedure_check_presence:
          Агрегатное signal-поле — наличие механизма действий при отказе ФНС.
          - "present" — если хотя бы одно из содержательных полей
            (refusal_remedy_status, refusal_costs_status,
              refusal_appeal_status) ≠ "not_defined";
          - "missing" — если все три содержательных поля = "not_defined";
          - "unclear" — если фрагменты по теме есть, но из-за противоречий
            вывод невозможен.

          Если presence = "missing":
          - refusal_remedy_status = "not_defined";
          - refusal_costs_status = "not_defined";
          - refusal_appeal_status = "not_defined";
          - refusal_remedy_details = "Данные не определены";
          - refusal_costs_details = "Данные не определены";
          - refusal_appeal_details = "Данные не определены";
          - не выполняй остальные шаги.

        1. refusal_remedy_status:
          - "defined" — если в тексте прямо указан порядок устранения
            замечаний ФНС (кто, сроки);
          - "not_defined" — если нет.

        2. refusal_remedy_details:
          Порядок и сроки устранения замечаний ФНС при отказе в регистрации.
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".

        3. refusal_costs_status:
          - "defined" — если в тексте прямо указано распределение расходов
            на повторную подачу (кто несёт, за счёт кого);
          - "not_defined" — если нет.

        4. refusal_costs_details:
          Распределение расходов на повторную подачу.
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".

        5. refusal_appeal_status:
          - "defined" — если в тексте прямо указан порядок обжалования
            отказа ФНС и/или основания для расторжения договора при
            невозможности регистрации;
          - "not_defined" — если нет.

        6. refusal_appeal_details:
          Порядок обжалования отказа ФНС и/или основания расторжения
          договора.
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".

        7. evidence — массив цитат из текста договора.
        </task>

        <context_rules>
        - Перед остальными полями заполни registration_refusal_procedure_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Данные не определены".
        - Используй только текст договора, без внешних знаний.
        - refusal_remedy: ищи «устранить замечания», «повторная подача», «в течение N дней».
        - refusal_costs: ищи «расходы несёт», «за счёт виновного учредителя».
        - refusal_appeal: ищи «обжалование в суде», «расторжение при невозможности», «невозможность регистрации».
        - Не путай "not_defined" и "not_applicable": not_applicable — только если условие неприменимо по природе сделки.
        - Состояния "partial" / "unclear" / "отсылка" отражай через details-поле; в status-полях допустимо только "defined" / "not_defined".
        - Если status = "not_defined" — details = "Данные не определены".
        - Не используй пустые строки, "None", "null".
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
          В договоре нет ни устранения замечаний, ни распределения
          расходов, ни обжалования / расторжения при отказе.
          → presence = "missing";
            refusal_remedy_status = "not_defined";
            refusal_costs_status = "not_defined";
            refusal_appeal_status = "not_defined";
            все *_details = "Данные не определены".

        2. Неполное раскрытие темы.
          Указано устранение замечаний, но распределение расходов
          и/или обжалование (расторжение) не раскрыты.
          → presence = "present";
            refusal_remedy_status = "defined";
            соответствующие *_status = "not_defined" по факту.

        3. Противоречие между фрагментами.
          В разных частях договора указаны разные сроки устранения
          замечаний или разные основания расторжения; конфликт нельзя
          разрешить по тексту.
          → presence = "unclear";
            соответствующий *_status = "not_defined";
            соответствующий *_details = "Не удалось определить".

        4. Прямое исключение обжалования/расторжения.
          В договоре прямо указано, что обжалование не производится
          или договор не расторгается при отказе ФНС.
          → presence = "present";
            refusal_appeal_status = "not_defined";
            refusal_appeal_details содержит цитату об исключении.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для registration_refusal_procedure_check_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined", "not_defined".
        - Fallback при отсутствии данных: все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности: соответствующие *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "registration_refusal_procedure_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие в договоре механизма действий при отказе ФНС в регистрации. Внутреннее агрегатное signal-поле."
          required: true

        - name: "refusal_remedy_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус порядка устранения замечаний ФНС. Внутреннее enum-поле."
          required: true

        - name: "refusal_remedy_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Устранение замечаний"
          description: "Порядок и сроки устранения замечаний ФНС при отказе в регистрации."
          required: true

        - name: "refusal_costs_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус распределения расходов при повторной подаче. Внутреннее enum-поле."
          required: true

        - name: "refusal_costs_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Расходы при отказе"
          description: "Распределение расходов на повторную подачу документов после отказа ФНС."
          required: true

        - name: "refusal_appeal_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус порядка обжалования отказа или расторжения договора. Внутреннее enum-поле."
          required: true

        - name: "refusal_appeal_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Обжалование / расторжение"
          description: "Порядок обжалования отказа ФНС и/или основания расторжения договора."
          required: false

      store_payload: true

  - id: pre_registration_assets_and_bank_check
    name: "Формирование имущества и банковский счёт до регистрации"
    description: >
      Фактографическая проверка порядка формирования имущества создаваемого
      общества до государственной регистрации: открытие накопительного счёта,
      порядок внесения средств на накопительный счёт, право распоряжения
      средствами до регистрации, возврат средств при отказе в регистрации
      или выходе учредителя (ст. 89.1 п. 2 ГК РФ, ст. 16 п. 3 ФЗ-14).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "накопительный счёт"
        - "банковский счёт"
        - "формирование имущества"
        - "внесение средств"
        - "распоряжение средствами"
        - "возврат средств"
        - "временный счёт"
        - "блок-счёт"
      keyword_mode: "any"
      regex_patterns:
        - '(?i)накопительн[а-яё]+\s+счёт'
        - '(?i)формировани[ея]\s+имуществ'
        - '(?i)банковск[а-яё]+\s+счёт'

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по корпоративному праву.
        Анализируется договор об учреждении общества (ст. 89.1 п. 2 ГК РФ, ст. 16 п. 3 ФЗ-14).
        Проверяется: содержит ли договор порядок формирования имущества до регистрации.

        Нормативный ориентир:
        - ст. 89.1 п. 2 ГК РФ — порядок совместной деятельности по созданию общества.
        - ст. 16 п. 3 ФЗ-14 — оплата не менее 50% УК до подачи документов.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Порядок открытия накопительного/банковского счёта.
        2. Порядок внесения и распоряжения средствами до регистрации.
        3. Порядок возврата средств при отказе в регистрации.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. verdict = "pass" — порядок формирования имущества урегулирован.
        3. verdict = "unclear" — упомянут частично.
        4. verdict = "fail" — не урегулирован.
        5. Верни РОВНО один валидный JSON-объект со всеми 3 ключами (verdict,
          reason, evidence). Начни ответ сразу с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — порядок урегулирован (pass):
        Фрагмент:
        "Учредители открывают накопительный счёт в ПАО «Сбербанк» на имя
        Иванова И.И. для формирования уставного капитала. Средства вносятся
        пропорционально долям. До регистрации распоряжение средствами
        осуществляется только с согласия всех учредителей. При отказе ФНС
        средства возвращаются пропорционально вкладам."

        Ответ:
        {
          "verdict": "pass",
          "reason": "Урегулированы порядок открытия накопительного счёта, внесения средств, распоряжения и возврата.",
          "evidence": [
            {"clause_ref": "п. 4.5", "quote": "Учредители открывают накопительный счёт в ПАО «Сбербанк» на имя Иванова И.И. для формирования уставного капитала."}
          ]
        }

        Пример 2 — порядок отсутствует (fail):
        Фрагмент:
        "Учредители оплачивают доли в уставном капитале."

        Ответ:
        {
          "verdict": "fail",
          "reason": "В договоре отсутствует порядок формирования имущества и открытия счёта до регистрации.",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Проверь, что все 3 ключа (verdict, reason, evidence) присутствуют в JSON.
        Не выводи шаги проверки. Верни только JSON.
      context_k: 8
      temperature: 0.0
      max_tokens: 650

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "накопительный счёт банковский счёт формирование имущества внесение средств распоряжение средствами возврат средств временный счёт"
      retrieval_profile: "scope_of_work_check"
      preferred_unit_types:
        - obligation
        - general_provision
        - payment_term
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - procedures
        - obligations
      negative_keywords:
        - "уставный капитал"
        - "регистрация в ФНС"
        - "налоговый режим"
        - "директор"
        - "в целях настоящего Договора понимается"
      position_bias:
        preferred_range: [0.15, 0.55]
        boost: 0.30
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "procedures"
        - "obligations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1000

      compact_output: false

      presence_signal:
        field: "pre_registration_assets_and_bank_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по корпоративному праву. Извлекаешь из
        договора об учреждении порядок формирования имущества и банковского
        счёта до регистрации.
        Не анализируешь размер УК, директора, налоги или регистрацию
        в ФНС — эти темы проверяются отдельными чеками.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 6 полей + evidence (всего 7 ключей):

        0. pre_registration_assets_and_bank_check_presence:
          Агрегатное signal-поле — наличие регулирования по теме.
          - "present" — если хотя бы одно из содержательных полей
            (bank_account_status, funds_management_status,
              funds_return_status) ≠ "not_defined";
          - "missing" — если все три содержательных поля = "not_defined";
          - "unclear" — если фрагменты по теме есть, но из-за противоречий
            вывод невозможен.

          Если presence = "missing":
          - bank_account_status = "not_defined";
          - funds_management_status = "not_defined";
          - funds_return_status = "not_defined";
          - bank_account_details = "Данные не определены";
          - funds_management_details = "Данные не определены";
          - funds_return_details = "Данные не определены";
          - не выполняй остальные шаги.

        1. bank_account_status:
          - "defined" — если в тексте прямо указан порядок открытия
            накопительного / банковского счёта (банк, на чьё имя);
          - "not_defined" — если нет.

        2. bank_account_details:
          Порядок открытия накопительного счёта для формирования УК
          (банк, на чьё имя).
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".

        3. funds_management_status:
          - "defined" — если в тексте прямо указан порядок внесения
            и распоряжения средствами до регистрации;
          - "not_defined" — если нет.

        4. funds_management_details:
          Порядок внесения и распоряжения средствами на накопительном
          счёте до регистрации.
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".

        5. funds_return_status:
          - "defined" — если в тексте прямо указан порядок возврата
            средств при отказе в регистрации или выходе учредителя;
          - "not_defined" — если нет.

        6. funds_return_details:
          Порядок возврата средств учредителям при отказе ФНС
          или выходе из договора.
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".

        7. evidence — массив цитат из текста договора.
        </task>

        <context_rules>
        - Перед остальными полями заполни pre_registration_assets_and_bank_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Данные не определены".
        - Используй только текст договора, без внешних знаний.
        - bank_account: ищи «накопительный счёт», «временный счёт», «открыть счёт в банке».
        - funds_management: ищи «внесение средств», «распоряжение с согласия всех», «пропорционально долям».
        - funds_return: ищи «возврат средств», «при отказе в регистрации», «при выходе учредителя».
        - Не путай "not_defined" и "not_applicable": not_applicable — только если условие неприменимо по природе сделки.
        - Состояния "partial" / "unclear" / "отсылка" отражай через details-поле; в status-полях допустимо только "defined" / "not_defined".
        - Если status = "not_defined" — details = "Данные не определены".
        - Не используй пустые строки, "None", "null".
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
          В договоре нет ни открытия счёта, ни порядка внесения
          и распоряжения средствами, ни возврата средств.
          → presence = "missing";
            bank_account_status = "not_defined";
            funds_management_status = "not_defined";
            funds_return_status = "not_defined";
            все *_details = "Данные не определены".

        2. Неполное раскрытие темы.
          Указано открытие счёта, но порядок распоряжения и/или
          возврата средств не раскрыт.
          → presence = "present";
            bank_account_status = "defined";
            соответствующие *_status = "not_defined" по факту.

        3. Противоречие между фрагментами.
          В разных частях договора указаны разные банки / разные
          условия распоряжения / разные условия возврата;
          конфликт нельзя разрешить по тексту.
          → presence = "unclear";
            соответствующий *_status = "not_defined";
            соответствующий *_details = "Не удалось определить".

        4. Отсылка на типовой договор банковского счёта / приложение.
          В тексте указано, что порядок определяется отдельным
          документом (договор с банком, приложение).
          → presence = "present";
            соответствующий *_status = "defined";
            *_details содержит формулировку вида "Согласно договору
            с банком (Приложение №N)".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для pre_registration_assets_and_bank_check_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined", "not_defined".
        - Fallback при отсутствии данных: все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности: соответствующие *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "pre_registration_assets_and_bank_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования порядка формирования имущества и банковского счёта до регистрации. Внутреннее агрегатное signal-поле."
          required: true

        - name: "bank_account_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус порядка открытия накопительного/банковского счёта. Внутреннее enum-поле."
          required: true

        - name: "bank_account_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Накопительный счёт"
          description: "Порядок открытия накопительного счёта для формирования УК (банк, на чьё имя)."
          required: true

        - name: "funds_management_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус порядка внесения и распоряжения средствами до регистрации. Внутреннее enum-поле."
          required: true

        - name: "funds_management_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Управление средствами"
          description: "Порядок внесения и распоряжения средствами на накопительном счёте до регистрации."
          required: true

        - name: "funds_return_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус порядка возврата средств при отказе в регистрации. Внутреннее enum-поле."
          required: true

        - name: "funds_return_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Возврат средств"
          description: "Порядок возврата средств учредителям при отказе ФНС или выходе из договора."
          required: false

      store_payload: true

  - id: transitional_period_profit_loss_check
    name: "Распределение доходов и убытков переходного периода до регистрации"
    description: >
      Фактографическая проверка урегулирования в договоре об учреждении вопросов
      распределения доходов и убытков, возникающих в переходный период между
      подписанием договора и государственной регистрацией общества. Актуально
      при ведении фактической деятельности через механизм предварительных
      договоров (ст. 89.1 п. 4 ГК РФ). Включает налоговые последствия
      переходного периода (ст. 217, 249 НК РФ).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "переходный период"
        - "до регистрации"
        - "доходы до регистрации"
        - "убытки до регистрации"
        - "прибыль переходного"
        - "распределение доходов"
        - "распределение убытков"
        - "фактическая деятельность"
        - "предварительные договоры"
        - "налоговые последствия"
      keyword_mode: "any"
      regex_patterns:
        - '(?i)переходн[а-яё]+\s+период'
        - '(?i)(доход|прибыл|убыт)[а-яё]*\s+до\s+регистрац'
        - '(?i)фактическ[а-яё]+\s+деятельност'

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по корпоративному и налоговому праву.
        Анализируется договор об учреждении общества
        (ст. 89.1 п. 4 ГК РФ, ст. 217, 249 НК РФ).
        Проверяется: урегулированы ли в договоре вопросы распределения
        доходов и убытков переходного периода до государственной регистрации.

        Нормативный ориентир:
        - ст. 89.1 п. 4 ГК РФ — учредители несут солидарно-субсидиарную
          ответственность по обязательствам, связанным с созданием общества
          и возникшим до его государственной регистрации.
        - ст. 217 НК РФ — доходы, не подлежащие налогообложению.
        - ст. 249 НК РФ — внереализационные доходы.
        - Письмо Минфина от 19.03.2012 № 03-03-06/1/131 — доходы, полученные
          до регистрации, учитываются после регистрации в составе доходов
          создаваемого юрлица.

        Важно:
        - Если учредители ведут фактическую деятельность до регистрации
          (через предварительные договоры), возникает вопрос: кому принадлежат
          доходы и кто несёт убытки этого периода.
        - Без урегулирования — споры между учредителями и налоговые риски.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Ведётся ли фактическая деятельность до регистрации.
        2. Порядок распределения доходов переходного периода.
        3. Порядок распределения убытков переходного периода.
        4. Налоговые последствия переходного периода.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. verdict = "pass" — распределение доходов и убытков урегулировано.
        4. verdict = "unclear" — упомянуто частично.
        5. verdict = "fail" — переходный период не урегулирован.
        6. Верни РОВНО один валидный JSON-объект со всеми 3 ключами
          (verdict, reason, evidence). Начни ответ сразу с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — переходный период урегулирован (pass):
        Фрагмент:
        "В случае ведения фактической деятельности до государственной
        регистрации все доходы, полученные в переходный период, зачисляются
        на расчётный счёт Общества после его регистрации. Убытки переходного
        периода покрываются учредителями пропорционально долям. Налоговые
        обязательства переходного периода несёт Общество после регистрации."

        Ответ:
        {
          "verdict": "pass",
          "reason": "Урегулированы распределение доходов, убытков и налоговых последствий переходного периода.",
          "evidence": [
            {"clause_ref": "п. 16.1", "quote": "В случае ведения фактической деятельности до государственной регистрации все доходы, полученные в переходный период, зачисляются на расчётный счёт Общества после его регистрации."}
          ]
        }

        Пример 2 — переходный период не урегулирован (fail):
        Фрагмент:
        "Учредители обязуются создать общество."

        Ответ:
        {
          "verdict": "fail",
          "reason": "В договоре не урегулированы вопросы распределения доходов и убытков переходного периода.",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Проверь, что все 3 ключа (verdict, reason, evidence) присутствуют в JSON.
        Не выводи шаги проверки. Верни только JSON.
      context_k: 8
      temperature: 0.0
      max_tokens: 700

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "переходный период доходы до регистрации убытки до регистрации прибыль распределение доходов распределение убытков фактическая деятельность предварительные договоры налоговые последствия"
      retrieval_profile: "scope_of_work_check"
      preferred_unit_types:
        - obligation
        - general_provision
        - covenants
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "уставный капитал"
        - "оплата долей"
        - "регистрация в ФНС"
        - "директор"
        - "выход учредителя"
        - "в целях настоящего Договора понимается"
      position_bias:
        preferred_range: [0.30, 0.80]
        boost: 0.30
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1100

      compact_output: false

      presence_signal:
        field: "transitional_period_profit_loss_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по корпоративному и налоговому праву. Извлекаешь
        из договора об учреждении условия распределения доходов и убытков
        переходного периода до регистрации.
        Не анализируешь уставный капитал, оплату долей, регистрацию в ФНС
        или директора — эти темы проверяются отдельными чеками.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 8 полей + evidence (всего 9 ключей):

        0. transitional_period_profit_loss_check_presence:
          Агрегатное signal-поле — наличие регулирования по теме переходного
          периода.
          - "present" — если хотя бы одно из содержательных полей
            (pre_registration_activity_status, profit_distribution_status,
              loss_allocation_status, tax_transitional_status) ≠ "not_defined";
            в том числе если pre_registration_activity_status = "not_applicable"
            (в договоре прямо указано, что деятельность не ведётся);
          - "missing" — если все четыре содержательных поля = "not_defined";
          - "unclear" — если фрагменты по теме есть, но из-за противоречий
            вывод невозможен.

          Если presence = "missing":
          - pre_registration_activity_status = "not_defined";
          - profit_distribution_status = "not_defined";
          - loss_allocation_status = "not_defined";
          - tax_transitional_status = "not_defined";
          - все *_details = "Данные не определены";
          - не выполняй остальные шаги.

        1. pre_registration_activity_status:
          - "defined"       — если в тексте прямо указано, что учредители
                              ведут фактическую деятельность до регистрации
                              (через предварительные договоры / от имени
                              создаваемого общества);
          - "not_applicable" — если в тексте прямо указано, что деятельность
                              до регистрации не ведётся;
          - "not_defined"   — если нет ни прямого указания, ни оснований
                              считать неприменимым.

        2. pre_registration_activity_details:
          Условия ведения фактической деятельности через предварительные
          договоры до регистрации.
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".

        3. profit_distribution_status:
          - "defined" — если в тексте прямо указан порядок распределения
            доходов переходного периода;
          - "not_defined" — если нет.

        4. profit_distribution_details:
          Порядок распределения доходов, полученных до государственной
          регистрации.
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".

        5. loss_allocation_status:
          - "defined" — если в тексте прямо указан порядок покрытия убытков
            переходного периода;
          - "not_defined" — если нет.

        6. loss_allocation_details:
          Порядок покрытия убытков, возникших до государственной
          регистрации.
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".

        7. tax_transitional_status:
          - "defined" — если в тексте прямо урегулированы налоговые
            последствия переходного периода;
          - "not_defined" — если нет.

        8. tax_transitional_details:
          Налоговые последствия деятельности до регистрации и порядок
          их учёта.
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".

        9. evidence — массив цитат из текста договора.
        </task>

        <context_rules>
        - Перед остальными полями заполни transitional_period_profit_loss_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Данные не определены".
        - Используй только текст договора, без внешних знаний.
        - pre_registration_activity: ищи «фактическая деятельность», «предварительные договоры», «до регистрации». Если в договоре прямо указано, что деятельность до регистрации не ведётся, ставь pre_registration_activity_status = "not_applicable".
        - profit_distribution: ищи «доходы зачисляются», «прибыль распределяется», «поступления переходного периода».
        - loss_allocation: ищи «убытки покрываются», «расходы несёт», «пропорционально долям».
        - tax_transitional: ищи «налоговые обязательства», «налогообложение переходного периода», «учитываются после регистрации».
        - Не путай "not_defined" и "not_applicable": not_applicable — только если условие неприменимо по природе сделки (деятельность не ведётся).
        - Состояния "partial" / "unclear" / "отсылка" отражай через details-поле; в status-полях допустимо только "defined" / "not_defined" (и "not_applicable" для pre_registration_activity_status).
        - Если status = "not_defined" — details = "Данные не определены".
        - Не используй пустые строки, "None", "null".
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
          В договоре нет ни упоминания переходного периода, ни
          распределения доходов/убытков, ни налоговых последствий.
          → presence = "missing";
            pre_registration_activity_status = "not_defined";
            profit_distribution_status = "not_defined";
            loss_allocation_status = "not_defined";
            tax_transitional_status = "not_defined";
            все *_details = "Данные не определены".

        2. Деятельность не ведётся (прямое указание).
          В договоре прямо указано, что учредители не ведут фактическую
          деятельность до регистрации.
          → presence = "present";
            pre_registration_activity_status = "not_applicable";
            pre_registration_activity_details содержит цитату;
            остальные status-поля = "not_defined" по факту.

        3. Противоречие между фрагментами.
          В разных частях договора указаны разные правила распределения
          доходов или убытков; конфликт нельзя разрешить по тексту.
          → presence = "unclear";
            соответствующий *_status = "not_defined";
            соответствующий *_details = "Не удалось определить".

        4. Частичное урегулирование.
          Распределение доходов и убытков указано, но налоговые
          последствия переходного периода не раскрыты.
          → presence = "present";
            profit_distribution_status = "defined";
            loss_allocation_status = "defined";
            tax_transitional_status = "not_defined".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для transitional_period_profit_loss_check_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined", "not_defined".
        - Для pre_registration_activity_status используй только: "defined", "not_applicable", "not_defined".
        - Fallback при отсутствии данных: все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности: соответствующие *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "transitional_period_profit_loss_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по переходному периоду (доходы, убытки, налоги). Внутреннее агрегатное signal-поле."
          required: true

        - name: "pre_registration_activity_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_applicable", "not_defined"]
          display_in_grid: false
          description: "Статус ведения фактической деятельности до регистрации. Внутреннее enum-поле."
          required: true

        - name: "pre_registration_activity_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Деятельность до регистрации"
          description: "Условия ведения фактической деятельности через предварительные договоры до регистрации."
          required: true

        - name: "profit_distribution_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус распределения доходов переходного периода. Внутреннее enum-поле."
          required: true

        - name: "profit_distribution_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Доходы переходного периода"
          description: "Порядок распределения доходов, полученных до государственной регистрации."
          required: true

        - name: "loss_allocation_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус распределения убытков переходного периода. Внутреннее enum-поле."
          required: true

        - name: "loss_allocation_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Убытки переходного периода"
          description: "Порядок покрытия убытков, возникших до государственной регистрации."
          required: true

        - name: "tax_transitional_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус урегулирования налоговых последствий переходного периода. Внутреннее enum-поле."
          required: true

        - name: "tax_transitional_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Налоги переходного периода"
          description: "Налоговые последствия деятельности до регистрации и порядок их учёта."
          required: false

      store_payload: true

  - id: amendment_before_registration_check
    name: "Порядок изменения договора об учреждении до государственной регистрации"
    description: >
      Фактографическая проверка процедурного механизма внесения изменений в договор
      об учреждении в период между подписанием и государственной регистрацией:
      порядок включения нового учредителя, изменения размера долей, замены объекта
      неденежного вклада, изменения наименования общества (при замечаниях ФНС).
      Регулируется ст. 450, 452 ГК РФ и ст. 89.1 ГК РФ.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "изменение договора"
        - "дополнение к договору"
        - "включение учредителя"
        - "новый учредитель"
        - "изменение долей"
        - "перераспределение долей"
        - "замена вклада"
        - "изменение наименования"
        - "единогласное решение"
        - "согласие всех учредителей"
        - "дополнительное соглашение"
      keyword_mode: "any"
      regex_patterns:
        - '(?i)изменени[ея]\s+договор'
        - '(?i)включени[ея]\s+(нов\w+\s+)?учредител'
        - '(?i)дополнительн\w+\s+соглашени'

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по корпоративному праву.
        Анализируется договор об учреждении общества
        (ст. 89.1 ГК РФ, ст. 450, 452 ГК РФ).
        Проверяется: содержит ли договор механизм внесения изменений
        в период между подписанием и государственной регистрацией.

        Нормативный ориентир:
        - ст. 452 ГК РФ — изменение договора совершается в той же форме,
          в которой был заключён договор.
        - ст. 450 ГК РФ — изменение по соглашению сторон; по требованию
          одной из сторон — через суд при существенном нарушении.
        - ст. 89.1 ГК РФ — договор об учреждении определяет порядок
          совместной деятельности (включая порядок изменений).

        Важно:
        - В период до регистрации общество не существует как юрлицо,
          поэтому все изменения касаются именно договора об учреждении.
        - Типичные сценарии изменений: включение нового учредителя,
          перераспределение долей, замена неденежного вклада, смена
          наименования (при замечаниях ФНС).

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Общий порядок внесения изменений (форма, кворум, сроки).
        2. Порядок включения нового учредителя.
        3. Порядок изменения размера долей.
        4. Порядок изменения наименования общества.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. verdict = "pass" — механизм изменений урегулирован.
        4. verdict = "unclear" — механизм упомянут частично.
        5. verdict = "fail" — механизм изменений отсутствует.
        6. Верни РОВНО один валидный JSON-объект со всеми 3 ключами
          (verdict, reason, evidence). Начни ответ сразу с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — механизм урегулирован (pass):
        Фрагмент:
        "Изменения и дополнения к настоящему договору вносятся по
        единогласному решению всех учредителей в письменной форме.
        Включение нового учредителя допускается с согласия всех
        действующих учредителей и оформляется дополнительным
        соглашением. Изменение наименования общества при замечаниях
        регистрирующего органа осуществляется решением учредителей,
        принятым в течение 10 рабочих дней с момента получения отказа."

        Ответ:
        {
          "verdict": "pass",
          "reason": "Урегулированы порядок внесения изменений, включения нового учредителя и изменения наименования.",
          "evidence": [
            {"clause_ref": "п. 15.1", "quote": "Изменения и дополнения к настоящему договору вносятся по единогласному решению всех учредителей в письменной форме."}
          ]
        }

        Пример 2 — механизм отсутствует (fail):
        Фрагмент:
        "Учредители договорились создать общество."

        Ответ:
        {
          "verdict": "fail",
