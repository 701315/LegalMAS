      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по корпоративному праву.
        Анализируется договор об учреждении общества (ст. 11 ФЗ-14).
        Проверяется только один вопрос: солидарная ответственность учредителей.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        [ЗАДАЧА]
        Найди в тексте договора:
        1. Наличие положения о солидарной ответственности.
        2. Объём ответственности (все обязательства / ограниченный круг).
        3. Упоминание одобрения обществом после регистрации.
        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если данные не указаны прямо — возвращай "not_defined".
        3. Если текстового значения нет — возвращай строго "Данные не определены".
        4. В evidence включай только текст договора.
        5. Верни только один JSON-объект.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1:
        Фрагмент:
        "Учредители несут солидарную ответственность по всем обязательствам,
        связанным с созданием Общества и возникшим до момента его государственной
        регистрации. Обязательства, возникшие после регистрации, подлежат
        одобрению Обществом."
        Ответ:
        {
          "solidary_liability_status": "defined",
          "solidary_liability_details": "солидарная ответственность по всем обязательствам, связанным с созданием Общества и возникшим до момента его государственной регистрации",
          "liability_scope_code": "all_pre_registration",
          "post_registration_approval_status": "defined",
          "post_registration_approval_details": "подлежат одобрению Обществом",
          "evidence": [
            {
              "clause_ref": "п. 6.1",
              "quote": "Учредители несут солидарную ответственность по всем обязательствам, связанным с созданием Общества и возникшим до момента его государственной регистрации."
            }
          ]
        }
        Пример 2:
        Фрагмент:
        "Учредители обязуются создать общество."
        Ответ:
        {
          "solidary_liability_status": "not_defined",
          "solidary_liability_details": "Данные не определены",
          "liability_scope_code": "not_defined",
          "post_registration_approval_status": "not_defined",
          "post_registration_approval_details": "Данные не определены",
          "evidence": []
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о солидарной ответственности.
        2. Найди прямую цитату об объёме ответственности.
        3. Найди прямую цитату об одобрении обществом.
        4. Если прямой цитаты нет — верни "not_defined". Не додумывай.
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "solidary_liability_status": "<defined / not_defined>",
          "solidary_liability_details": "<текст или 'Данные не определены'>",
          "liability_scope_code": "<all_pre_registration / limited / not_defined>",
          "post_registration_approval_status": "<defined / not_defined>",
          "post_registration_approval_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
