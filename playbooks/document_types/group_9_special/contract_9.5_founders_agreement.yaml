      compact_output: false

      presence_signal:
        field: "registration_decision_compliance_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по корпоративному праву. Извлекаешь из
        договора об учреждении сведения о подаче документов в ФНС, способе
        подтверждения решения об учреждении и compliance процедуры.
        Не анализируешь госпошлину, ПДн, налоговый режим, уставный капитал
        или оплату долей — эти темы проверяются отдельными чеками.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 5 полей + evidence (всего 6 ключей):

        0. registration_decision_compliance_check_presence:
          Агрегатное signal-поле — наличие регулирования по теме.
          - "present" — если хотя бы одно из содержательных полей
            (ro11001_submission_status, decision_confirmation_method,
              registration_compliance) ≠ "not_defined"
            И registration_compliance ≠ "not_checkable";
          - "missing" — если ro11001_submission_status = "not_defined"
            И decision_confirmation_method = "not_defined";
          - "unclear" — если registration_compliance = "not_checkable".

          Если presence = "missing":
          - ro11001_submission_status = "not_defined";
          - decision_confirmation_method = "not_defined";
          - registration_compliance = "missing_decision_method";
          - ro11001_submission_details = "Данные не определены";
          - decision_confirmation_details = "Данные не определены";
          - не выполняй остальные шаги.

        1. ro11001_submission_status:
          - "defined" — если в тексте прямо указаны субъект / сроки / способ
            подачи документов в МИФНС (форма Р11001 для ООО, Р12001 для АО);
          - "not_defined" — если нет.

        2. ro11001_submission_details:
          Кто подаёт, куда (МИФНС), сроки, форма (Р11001 / Р12001).
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".

        3. decision_confirmation_method:
          - "notarial"                — нотариальное удостоверение;
          - "all_participants_present" — присутствие всех при нотариусе;
          - "av_recording"            — аудио/видеозапись;
          - "signed_by_all"           — подписано всеми участниками;
          - "sole_founder"            — единственный учредитель;
          - "not_defined"             — не указано.

        4. decision_confirmation_details:
          Текст о способе подтверждения решения.
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".

        5. registration_compliance:
          - "compliant"                — способ указан и соответствует
                                          ст. 67.1 п. 3 пп. 3 ГК РФ;
          - "missing_decision_method"  — способ не указан;
          - "invalid_method"           — способ противоречит ст. 67.1
                                          (например, «большинством голосов»);
          - "not_applicable"           — единственный учредитель;
          - "not_checkable"            — недостаточно данных.

        6. evidence — массив цитат из текста договора.
        </task>

        <context_rules>
        - Перед остальными полями заполни registration_decision_compliance_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — ro11001_submission_status = "not_defined", decision_confirmation_method = "not_defined", registration_compliance = "missing_decision_method", все *_details = "Данные не определены".
        - Используй только текст договора, без внешних знаний.
        - ro11001_submission: ищи «подать документы в МИФНС», «форма Р11001», «в течение N дней».
        - decision_confirmation_method — определи по ст. 67.1 п. 3 пп. 3 ГК РФ (ред. ФЗ-287): "notarial" — нотариальное удостоверение; "all_participants_present" — присутствие всех при нотариусе; "av_recording" — аудио/видеозапись; "signed_by_all" — подписано всеми участниками; "sole_founder" — единственный учредитель; "not_defined" — не указано.
        - Не путай "not_defined" и "not_applicable": not_applicable — только если условие неприменимо по природе сделки.
        - Состояния "partial" / "unclear" / "отсылка" отражай через details-поле; в status-полях допустимо только "defined" / "not_defined".
        - Если status = "not_defined" — details = "Данные не определены".
        - Не используй пустые строки, "None", "null".
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
          В тексте нет ни подачи документов, ни способа подтверждения
          решения об учреждении.
          → presence = "missing";
            ro11001_submission_status = "not_defined";
            decision_confirmation_method = "not_defined";
            registration_compliance = "missing_decision_method";
            все *_details = "Данные не определены".

        2. Неполное раскрытие темы.
          Подача документов указана, но способ подтверждения решения
          не определён.
          → presence = "present";
            ro11001_submission_status = "defined";
            decision_confirmation_method = "not_defined";
            registration_compliance = "missing_decision_method".

        3. Противоречие между фрагментами.
          В разных частях договора указаны разные порядки подачи
          или разные способы подтверждения решения; конфликт нельзя
          разрешить по тексту.
          → presence = "unclear";
            registration_compliance = "not_checkable";
            соответствующие *_details = "Не удалось определить".

        4. Искажение нормы договором.
          Способ подтверждения решения противоречит ст. 67.1 п. 3 пп. 3
          ГК РФ (например, «большинством голосов»).
          → presence = "present";
            decision_confirmation_method = "not_defined";
            decision_confirmation_details содержит цитату;
            registration_compliance = "invalid_method".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для registration_decision_compliance_check_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined", "not_defined".
        - Для decision_confirmation_method используй только: "notarial", "all_participants_present", "av_recording", "signed_by_all", "sole_founder", "not_defined".
        - Для registration_compliance используй только: "compliant", "missing_decision_method", "invalid_method", "not_applicable", "not_checkable".
        - Fallback при отсутствии данных: все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности: соответствующие *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "registration_decision_compliance_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по подаче документов и подтверждению решения об учреждении. Внутреннее агрегатное signal-поле."
          required: true

        - name: "ro11001_submission_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания субъекта и порядка подачи документов на регистрацию. Внутреннее enum-поле."
          required: true

        - name: "ro11001_submission_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Подача в ФНС"
          description: "Субъект, сроки и порядок подачи документов на регистрацию (Р11001/Р12001)."
          required: true

        - name: "decision_confirmation_method"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["notarial", "all_participants_present", "av_recording", "signed_by_all", "sole_founder", "not_defined"]
          display_in_grid: false
          description: "Способ подтверждения решения об учреждении (ст. 67.1 п. 3 пп. 3 ГК РФ, ред. ФЗ-287). Внутреннее enum-поле."
          required: true

        - name: "decision_confirmation_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Подтверждение решения"
          description: "Формулировка способа подтверждения решения об учреждении."
          required: true

        - name: "registration_compliance"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["compliant", "missing_decision_method", "invalid_method", "not_applicable", "not_checkable"]
          display_in_grid: true
          display_priority: 3
          description: "Соответствие процедуры регистрации императивным требованиям ст. 67.1 ГК РФ. Внутреннее enum-поле."
          required: true

      store_payload: true

  - id: founders_representations_warranties_check
    name: "Заверения и гарантии учредителей (правоспособность, чистота вклада, одобрения)"
