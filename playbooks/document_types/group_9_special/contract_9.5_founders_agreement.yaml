        - "price_list"
      preferred_clause_functions:
        - "limitations"
        - "boilerplate"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.15

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 500

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 600
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по корпоративному праву. Извлеки из договора
        об учреждении общества сведения о солидарной ответственности учредителей.
        Не анализируй уставный капитал, оплату долей или неденежные вклады.
