      required_kind: "legal_unit"
      retrieval_query: "государственная регистрация общества Р11001 Р12001 подача документов МИФНС нотариальное удостоверение решение об учреждении аудиозапись видеозапись присутствие всех участников"
      retrieval_profile: "party_identification_check"
