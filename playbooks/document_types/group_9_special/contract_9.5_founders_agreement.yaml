        5. Состояния "partial" / "unclear" / "отсылка" отражай через
           value-поле; в status-полях допустимо только "defined" /
           "not_defined".
        6. legalization_regime — определи по стране учредителя, указанной
           в тексте:
           - "hague_apostille"       — Великобритания, Германия, США,
                                       Франция, Италия, Кипр, ОАЭ, Китай
                                       (участник Гаагской конвенции),
                                       Испания, Нидерланды и др.;
           - "cis_simplified"        — Беларусь, Казахстан, Армения,
                                       Кыргызстан, Таджикистан, Узбекистан,
                                       Азербайджан, Молдова;
           - "bilateral_treaty"      — если указан двусторонний договор;
           - "consular_legalization" — прочие страны вне Гаагской и
                                       Минской конвенций;
           - "not_required"          — если в тексте прямо указано об
                                       освобождении от легализации;
           - "not_defined"           — режим не определён.
        7. documentation_compliance:
           - "compliant"      — все требуемые документы указаны, режим
                                легализации соответствует стране;
           - "incomplete"     — часть документов отсутствует;
           - "wrong_regime"   — режим легализации не соответствует
                                стране (например, апостиль для СНГ);
           - "not_applicable" — иностранного учредителя нет;
           - "not_checkable"  — недостаточно данных.
        8. Для выписки из торгового реестра — фиксируй дату выписки,
           если она указана в тексте, для последующей оценки актуальности
           (обычно требуется не старше 3–6 месяцев на дату подачи
           документов в ФНС, Приказ ФНС от 31.08.2020 № ЕД-7-14/617@).
        9. Если status = "not_defined" — value = "Данные не определены",
           evidence = [].
        10. Значения enum-полей — строго из allowed_values.
        11. Запрещены "None", "null", пустые строки, отсутствующие ключи.
        12. Верни РОВНО один валидный JSON-объект со всеми 11 ключами,
            пригодный для парсинга через json.loads без предварительной
            обработки. Без markdown, без ```json, без комментариев, без
            текста до или после. Начни ответ сразу с { и закончи }.
        </rules>
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — Hague-режим, документы легализованы:
        Фрагмент:
        "Учредитель — Company Ltd (Великобритания). Документы учредителя
        апостилированы, имеют нотариально заверенный перевод на русский
        язык. Выписка из торгового реестра от 15.02.2026 прилагается."
        Ответ:
        {
          "foreign_founder_status": "defined",
          "foreign_founder_details": "Company Ltd, Великобритания",
          "legalization_regime": "hague_apostille",
          "apostille_status": "defined",
          "apostille_details": "документы учредителя апостилированы",
          "translation_status": "defined",
          "translation_details": "нотариально заверенный перевод на русский язык",
          "trade_registry_extract_status": "defined",
          "trade_registry_extract_details": "выписка из торгового реестра от 15.02.2026",
          "documentation_compliance": "compliant",
          "evidence": [
            {
              "clause_ref": "преамбула",
              "quote": "Учредитель — Company Ltd (Великобритания). Документы учредителя апостилированы, имеют нотариально заверенный перевод на русский язык."
            }
          ]
        }
        Пример 2 — иностранный учредитель отсутствует:
        Фрагмент:
        "Учредители — Иванов И.И. и Петров П.П."
        Ответ:
        {
          "foreign_founder_status": "not_defined",
          "foreign_founder_details": "Данные не определены",
          "legalization_regime": "not_defined",
          "apostille_status": "not_defined",
          "apostille_details": "Данные не определены",
          "translation_status": "not_defined",
          "translation_details": "Данные не определены",
          "trade_registry_extract_status": "not_defined",
          "trade_registry_extract_details": "Данные не определены",
          "documentation_compliance": "not_applicable",
          "evidence": []
        }
        Пример 3 — СНГ-учредитель, апостиль не требуется:
        Фрагмент:
        "Учредитель — ТОО «Астана-Групп» (Республика Казахстан). Копии
        документов учредителя нотариально заверены и переведены на русский
        язык. Выписка из торгового реестра от 10.03.2026 прилагается."
        Ответ:
        {
          "foreign_founder_status": "defined",
          "foreign_founder_details": "ТОО «Астана-Групп», Республика Казахстан",
          "legalization_regime": "cis_simplified",
          "apostille_status": "not_defined",
          "apostille_details": "Данные не определены",
