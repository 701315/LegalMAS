        - "оплата доли"
        - "неденежный вклад"
        - "солидарная ответственность"
        - "корпоративный договор"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.65, 1.0]
        boost: 0.18
        scope: segment
      context_k: 5
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
