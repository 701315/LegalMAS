        Проверяется только один вопрос: уставный капитал и доли учредителей.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        [ЗАДАЧА]
        Найди в тексте договора:
        1. Общий размер уставного капитала.
        2. Валюта оплаты.
        3. Размер и номинальная стоимость доли каждого учредителя.
        4. Подтверждение, что сумма долей составляет 100%.
        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если данные не указаны прямо — возвращай "not_defined".
        3. Если текстового значения нет — возвращай строго "Данные не определены".
        4. В evidence включай только текст договора.
