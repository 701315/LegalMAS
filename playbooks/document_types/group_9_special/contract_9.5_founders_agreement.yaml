        контекста. Не фиксируешь общий boilerplate (применимое право,
        юрисдикция, претензионный порядок, коммерческая тайна) — он
        покрывается global-чеками. Не анализируешь уставный капитал,
        порядок оплаты долей, оценку неденежных вкладов и солидарно-
        субсидиарную ответственность — эти темы проверяются отдельными
        чеками.
        </role>
        <context>
        {context}
        </context>
        <task>
        Заполни строго следующие 5 полей + evidence (всего 6 ключей):
        1. dispute_resolution_status — "defined" или "not_defined": указан
           ли специальный порядок разрешения споров из самого договора
           об учреждении (до регистрации).
        2. dispute_resolution_details — текст специального порядка.
        3. confidentiality_status — "defined" или "not_defined": указано
           ли специальное условие о конфиденциальности предрегистрационного
           контекста (переговоры, переписка, документы).
        4. confidentiality_details — текст условия о конфиденциальности
           предрегистрационного контекста.
        5. pretrial_status — "defined" или "not_defined": указан ли
           специальный досудебный порядок именно для предрегистрационных
           споров из договора.
        6. evidence — массив цитат из текста договора.
        </task>
        <rules>
