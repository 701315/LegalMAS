        - '(?i)дисквалифиц'
        - '(?i)свободн[а-яё]+\s+от\s+обременени'

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по корпоративному праву.
        Анализируется договор об учреждении общества
        (ст. 89.1 ГК РФ, ст. 431.2 ГК РФ, ст. 23 ФЗ-129, ст. 46 ФЗ-14).
        Проверяется: содержит ли договор заверения и гарантии учредителей.

        Нормативный ориентир:
        - ст. 431.2 ГК РФ — заверения об обстоятельствах (основание для взыскания
          убытков при недостоверности).
        - ст. 23 п. 1 пп. «ф» ФЗ-129 — отказ в регистрации при наличии
          дисквалификации учредителя.
        - ст. 46 ФЗ-14 — одобрение крупных сделок и сделок с заинтересованностью
          для юрлиц-учредителей.
        - ст. 173.1 ГК РФ — оспоримость сделки без корпоративного одобрения.
        - ст. 174.1 ГК РФ — последствия отчуждения обременённого имущества.

        [ЗАДАЧА]
        Найди в тексте договора заверения учредителей о:
        1. Правоспособности и отсутствии ограничений (дисквалификация, реестр ФНС).
        2. Достоверности предоставляемых документов.
        3. Свободе вклада от обременений (залог, арест).
        4. Наличии корпоративных одобрений (для юрлиц-учредителей).

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. verdict = "pass" — заверения по всем 4 блокам присутствуют.
        3. verdict = "unclear" — заверения частичные.
        4. verdict = "fail" — заверения отсутствуют.
        5. Верни РОВНО один валидный JSON-объект со всеми 3 ключами (verdict,
          reason, evidence). Начни ответ сразу с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — заверения присутствуют (pass):
        Фрагмент:
        "Каждый учредитель заверяет и гарантирует, что: (а) обладает полной
        правоспособностью и дееспособностью; (б) не подвергнут дисквалификации
        и не включён в реестр массовых учредителей ФНС; (в) все предоставленные
        документы достоверны; (г) вклад свободен от любых обременений.
        Учредитель — ООО «Альфа» — заверяет, что решение об участии в учреждении
        одобрено общим собранием участников (протокол № 5 от 10.01.2025)."

        Ответ:
        {
          "verdict": "pass",
          "reason": "Присутствуют заверения о правоспособности, достоверности, чистоте вклада и корпоративном одобрении.",
          "evidence": [
            {"clause_ref": "п. 9.1", "quote": "Каждый учредитель заверяет и гарантирует, что: (а) обладает полной правоспособностью и дееспособностью, не дисквалифицирован, документы достоверны"}
          ]
        }

        Пример 2 — заверения отсутствуют (fail):
        Фрагмент:
        "Учредители договорились создать общество."

        Ответ:
        {
          "verdict": "fail",
          "reason": "В договоре отсутствуют заверения и гарантии учредителей.",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Проверь, что все 3 ключа (verdict, reason, evidence) присутствуют в JSON.
        Не выводи шаги проверки. Верни только JSON.
