        - "pass"    — указан срок действия, механизм прекращения и/или
                      перечень сохраняющихся положений.
        - "fail"    — ни срок, ни порядок прекращения, ни сохраняющиеся
                      положения в тексте не указаны.
        - "unclear" — часть условий указана, часть отсутствует.
        [ПРАВИЛА]
        1. Используй только текст договора.
        2. Evidence — прямые цитаты из договора.
        3. Верни РОВНО один валидный JSON-объект со всеми 4 ключами
           (verdict, confidence, reason, evidence), пригодный для парсинга
           через json.loads без предварительной обработки. Без markdown,
           без ```json, без комментариев, без текста до или после.
           Начни ответ сразу с { и закончи }.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — условия определены:
        Фрагмент:
        "Настоящий договор действует до момента государственной регистрации
        Общества и утрачивает силу после регистрации. Положения о
        конфиденциальности и порядке разрешения споров сохраняют силу после
        регистрации."
        Ответ:
        {
          "verdict": "pass",
          "confidence": 0.95,
          "reason": "Прямо указаны срок действия, прекращение после регистрации и перечень сохраняющихся положений.",
          "evidence": [
            {
              "clause_ref": "п. 10.1",
              "quote": "Настоящий договор действует до момента государственной регистрации Общества и утрачивает силу после регистрации."
            }
          ]
        }
        Пример 2 — условия отсутствуют:
        Фрагмент:
        "Учредители обязуются создать общество."
        Ответ:
        {
          "verdict": "fail",
          "confidence": 0.90,
          "reason": "В тексте отсутствуют срок действия, механизм прекращения и перечень сохраняющихся положений.",
          "evidence": []
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямое указание срока действия?
        2. Есть ли прямое указание на прекращение после регистрации?
        3. Есть ли перечень положений, сохраняющих силу после регистрации?
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "verdict": "<pass / fail / unclear>",
          "confidence": <0.0–1.0>,
          "reason": "<краткое объяснение вердикта>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 500

