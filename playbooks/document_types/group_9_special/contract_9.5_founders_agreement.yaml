  - id: dispute_confidentiality_check
    name: "Специфика споров из договора об учреждении и конфиденциальность предрегистрационного контекста"
    description: >
      Точечная фиксация условий договора об учреждении о порядке
      разрешения споров, возникших из самого договора до государственной
      регистрации общества, а также о конфиденциальности предрегистрационного
      контекста. Большая часть boilerplate-вопросов (применимое право,
      юрисдикция, претензионный порядок, коммерческая тайна) покрывается
      global-чеками governing_law_and_forum,
      limitation_periods_and_pre_claim_procedures и
      confidentiality_and_trade_secrets — не дублировать.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "medium"
    severity_if_pass: "pass"
    severity_if_fail: "medium"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "споры из настоящего договора"
        - "споры между учредителями"
        - "до государственной регистрации"
        - "предрегистрационный спор"
        - "конфиденциальность переговоров"
      keyword_mode: "any"
      regex_patterns:
        - '(?i)спор(ы|ов)\\s+из\\s+настоящего\\s+договор'
        - '(?i)спор(ы|ов)\\s+между\\s+учредител'
        - '(?i)конфиденциальност(ь|и)\\s+переговоров'

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по корпоративному праву. Анализируется договор
        об учреждении общества. Проверяется только один вопрос: содержит ли
        текст договора специальные (не boilerplate) условия о порядке
        разрешения споров, возникающих из самого договора об учреждении
        до государственной регистрации, и о конфиденциальности
        предрегистрационного контекста.
        Важно: общие boilerplate-вопросы (применимое право, юрисдикция,
        претензионный порядок, коммерческая тайна) покрываются отдельными
        global-чеками и в этом чеке НЕ фиксируются.
        [ЗАДАЧА]
        Определи, содержит ли текст договора:
        1. Специальный порядок разрешения споров между учредителями из
           самого договора об учреждении (до регистрации общества).
        2. Специальное условие о конфиденциальности предрегистрационного
           контекста (переговоры, переписка, документы до регистрации).
        Верни вердикт:
        - "pass"    — хотя бы один из этих специфических блоков указан.
        - "fail"    — таких условий нет (весь boilerplate — в global).
        - "unclear" — есть косвенные упоминания, но недостаточно для
                      классификации.
        [ПРАВИЛА]
        1. Используй только текст договора.
        2. Evidence — прямые цитаты из договора.
        3. Верни РОВНО один валидный JSON-объект со всеми 4 ключами
           (verdict, confidence, reason, evidence), пригодный для парсинга
           через json.loads без предварительной обработки. Без markdown,
           без ```json, без комментариев, без текста до или после.
           Начни ответ сразу с { и закончи }.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — специальный порядок есть:
        Фрагмент:
        "Споры между учредителями, возникающие из настоящего договора до
        государственной регистрации Общества, разрешаются путём переговоров,
        а при недостижении согласия — в Арбитражном суде г. Москвы."
        Ответ:
        {
          "verdict": "pass",
          "confidence": 0.90,
          "reason": "Указан специальный порядок разрешения споров между учредителями из самого договора до регистрации.",
          "evidence": [
            {
              "clause_ref": "п. 11.1",
              "quote": "Споры между учредителями, возникающие из настоящего договора до государственной регистрации Общества, разрешаются путём переговоров."
            }
          ]
        }
        Пример 2 — только boilerplate:
        Фрагмент:
        "Все споры разрешаются в Арбитражном суде г. Москвы. Условия
        договора конфиденциальны."
        Ответ:
        {
          "verdict": "fail",
          "confidence": 0.85,
          "reason": "Указан только стандартный boilerplate (юрисдикция и конфиденциальность) без специфики предрегистрационного контекста.",
          "evidence": []
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямая привязка споров к самому договору об учреждении
           (до регистрации)?
        2. Есть ли специальное условие о конфиденциальности именно
