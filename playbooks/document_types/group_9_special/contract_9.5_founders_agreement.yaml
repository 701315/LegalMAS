  - id: registration_submission_check
    name: "Порядок совместных действий при создании общества и утверждение устава"
    description: >
      Фактографическая проверка порядка совместных действий учредителей по созданию
      общества (подготовка документов, подача в регистрирующий орган ФНС) и
      процедуры единогласного утверждения устава создаваемого общества
      (ст. 89.1 п. 2 ГК РФ, ст. 11 п. 2 и ст. 12 ФЗ-14 «Об ООО»).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "совместная деятельность"
        - "порядок создания"
        - "подготовка документов"
        - "подача на регистрацию"
        - "утверждение устава"
        - "утвердить устав"
        - "подписать устав"
      keyword_mode: "any"
      regex_patterns:
        - '(?i)совместн(ая|ой|о)\s+деятельност'
        - '(?i)утверд(ить|ают|ждение)\s+устав'

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по корпоративному праву.
        Анализируется договор об учреждении общества (ст. 89.1 п. 2 ГК РФ, ст. 11 п. 2 и ст. 12 ФЗ-14).
        Проверяется только один вопрос: содержит ли текст договора порядок совместных
        действий учредителей по созданию общества и процедуру утверждения устава.

        Нормативный ориентир:
        - ст. 89.1 ГК РФ — договор об учреждении определяет порядок совместной деятельности.
        - ст. 11 п. 2 ФЗ-14 — решение об утверждении устава принимается учредителями единогласно.

        [ЗАДАЧА]
        Определи, содержит ли текст договора:
        1. Порядок совместных действий учредителей по созданию общества (подготовка, подача документов в ФНС).
        2. Процедуру утверждения устава создаваемого общества.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. verdict = "pass" — если порядок создания и утверждения устава указаны прямо.
        4. verdict = "unclear" — если условия упомянуты без деталей или размыто.
        5. verdict = "fail" — если порядок совместных действий отсутствует.
        6. Верни РОВНО один валидный JSON-объект со всеми 3 ключами (verdict, reason, evidence),
          пригодный для парсинга через json.loads без предварительной обработки. Начни ответ сразу с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — условия согласованы:
        Фрагмент:
        "Учредители обязуются совместно подготовить пакет документов для государственной
        регистрации Общества. Устав Общества утверждается единогласным решением учредителей
        и подписывается всеми участниками."

        Ответ:
        {
          "verdict": "pass",
          "reason": "Прямо согласованы порядок совместных действий по подготовке документов и процедура утверждения устава.",
          "evidence": [
            {"clause_ref": "п. 5.1–5.2", "quote": "Учредители обязуются совместно подготовить пакет документов для государственной регистрации Общества. Устав Общества утверждается единогласным решением учредителей"}
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Участники решили создать общество."

        Ответ:
        {
          "verdict": "fail",
          "reason": "В тексте отсутствует порядок совместной деятельности и правила утверждения устава.",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Проверь, что все 3 ключа (verdict, reason, evidence) присутствуют в JSON:
        1. Найдена ли прямая цитата о совместных действиях при регистрации?
        2. Зафиксировано ли явное утверждение устава?

        Не выводи шаги проверки. Верни только JSON.
      context_k: 8
      temperature: 0.0
      max_tokens: 600

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "порядок создания общества совместная деятельность утверждение устава подача документов на регистрацию"
      retrieval_profile: "scope_of_work_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - procedures
        - obligations
      negative_keywords:
        - "уставный капитал"
        - "оплата долей"
        - "неденежный вклад"
        - "оценка вклада"
        - "директор"
        - "в целях настоящего Договора понимается"
      position_bias:
        preferred_range: [0.10, 0.50]
        boost: 0.30
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "procedures"
        - "obligations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1000

      compact_output: false

      presence_signal:
        field: "registration_submission_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по корпоративному праву. Извлекаешь из договора
        об учреждении сведения о порядке совместных действий по созданию
        общества и утверждении устава.
        Не анализируешь уставный капитал, директора, расходы или налоги —
        эти темы проверяются отдельными чеками.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 4 поля + evidence (всего 5 ключей):

        0. registration_submission_check_presence:
          Агрегатное signal-поле — наличие регулирования по теме.
          - "present" — если хотя бы одно из содержательных полей
            (joint_activity_status, charter_approval_status) ≠ "not_defined";
          - "missing" — если оба содержательных поля = "not_defined";
          - "unclear" — если фрагменты по теме есть, но из-за противоречий
            вывод невозможен.

          Если presence = "missing":
          - joint_activity_status = "not_defined";
          - charter_approval_status = "not_defined";
          - joint_activity_details = "Данные не определены";
          - charter_approval_details = "Данные не определены";
          - не выполняй остальные шаги.

        1. joint_activity_status:
          - "defined" — если в тексте прямо указан порядок совместных
            действий учредителей по созданию общества (подготовка документов,
            заполнение форм ФНС, подача документов);
          - "not_defined" — если нет.

        2. joint_activity_details:
          Текст порядка совместных действий учредителей по созданию
          общества.
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".

        3. charter_approval_status:
          - "defined" — если в тексте прямо указано, что устав утверждается
            учредителями (в том числе единогласно);
          - "not_defined" — если нет.
          Важно: если указано только «разработать устав» без прямого
          указания на его утверждение — status = "not_defined".

        4. charter_approval_details:
          Текст об утверждении устава создаваемого общества.
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".

        5. evidence — массив цитат из текста договора.
        </task>

        <context_rules>
        - Перед остальными полями заполни registration_submission_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Данные не определены".
        - Используй только текст договора.
        - joint_activity: ищи совместные обязанности сторон по подготовке документов, заполнению форм ФНС, подаче документов.
        - charter_approval: фиксируй отдельно от совместной деятельности. Должно быть прямо указано «утвердить устав», а не просто «разработать». Если есть только разработка — charter_approval_status = "not_defined".
        - Не используй пустые строки, "None", "null".
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
          В тексте нет ни порядка совместных действий, ни процедуры
          утверждения устава.
          → presence = "missing";
            joint_activity_status = "not_defined";
            charter_approval_status = "not_defined";
            все *_details = "Данные не определены".

        2. Неполное раскрытие темы.
          Указано только «разработать устав» без прямого указания
          на утверждение; или указан порядок подготовки документов,
          но не указана подача в ФНС.
          → presence = "present";
            соответствующий *_status = "defined" или "not_defined" по факту.

        3. Противоречие между фрагментами.
          В разных частях указаны разные процедуры утверждения устава
          (например, «утверждается общим собранием» в одном месте и
          «утверждается советом директоров» в другом); конфликт нельзя
          разрешить по тексту.
          → presence = "unclear";
            соответствующий *_status = "not_defined";
            соответствующий *_details = "Не удалось определить".

        4. Утверждение устава с указанием порядка.
          В тексте прямо указано, что устав утверждается единогласным
          решением учредителей или иным прямо названным органом.
          → presence = "present";
            charter_approval_status = "defined";
            charter_approval_details содержит цитату.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для registration_submission_check_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined", "not_defined".
        - Fallback при отсутствии данных: все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности: соответствующие *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "registration_submission_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по порядку совместных действий и утверждению устава. Внутреннее агрегатное signal-поле."
          required: true

        - name: "joint_activity_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания порядка совместных действий учредителей по созданию общества. Внутреннее enum-поле."
          required: true

        - name: "joint_activity_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Регистрация общества"
          description: "Порядок совместных действий учредителей по регистрации общества в ФНС."
          required: true

        - name: "charter_approval_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания порядка и процедуры утверждения устава. Внутреннее enum-поле."
          required: true

        - name: "charter_approval_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Утверждение устава"
          description: "Процедура утверждения устава создаваемого общества."
          required: true

      store_payload: true

  - id: tax_and_personal_data_check
    name: "Расходы на учреждение, налоги и персональные данные учредителей"
    description: >
      Фактографическая проверка распределения расходов на создание общества, уплаты
      госпошлины, регулирования налоговых последствий (НДФЛ при неденежных вкладах
      по ст. 217 НК РФ), а также наличия явных согласий учредителей на обработку
      их персональных данных для регистрационных процедур в ФНС (ФЗ-152 «О персональных данных»).
    triggers: {}
    ui_mode: "field_extraction"
