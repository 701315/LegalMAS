    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "расходы на учреждение"
        - "распределение расходов"
        - "госпошлина"
        - "уплата пошлины"
        - "налог"
        - "НДФЛ"
