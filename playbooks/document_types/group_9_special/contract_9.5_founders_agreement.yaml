      llm_prompt_extraction: |
        Ты — российский юрист по корпоративному праву. Извлеки из договора об учреждении сведения о порядке совместных действий по созданию общества и утверждении устава.
        Не анализируй уставный капитал, директора, расходы или налоги.

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 4 полей + evidence (всего 5 ключей):
        1. joint_activity_status — "defined" или "not_defined": указан ли порядок совместных действий учредителей.
        2. joint_activity_details — текст порядка совместных действий учредителей по созданию общества.
        3. charter_approval_status — "defined" или "not_defined": указана ли процедура утверждения устава.
        4. charter_approval_details — текст об утверждении устава создаваемого общества.

        Если данные отсутствуют:
        - статусное/enum-поле = "not_defined"
        - текстовое поле = "Данные не определены"
        </task>

        <rules>
        - Используй только текст договора.
        - joint_activity: ищи совместные обязанности сторон по подготовке документов, заполнению форм ФНС, подаче документов.
        - charter_approval: фиксируй отдельно от совместной деятельности. Должно быть прямо указано «утвердить устав», а не просто «разработать». Если есть только разработка — ставь "not_defined".
        - Верни РОВНО один валидный JSON-объект со всеми 5 ключами, без markdown, без комментариев, без текста до или после.
        </rules>

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — все параметры определены:
        Фрагмент:
        "Учредители обязуются совместно подготовить пакет документов для государственной
        регистрации Общества. Устав Общества утверждается единогласным решением учредителей."

        Ответ:
        {
          "joint_activity_status": "defined",
          "joint_activity_details": "совместно подготовить пакет документов для государственной регистрации Общества",
          "charter_approval_status": "defined",
          "charter_approval_details": "утверждается единогласным решением учредителей",
          "evidence": [
            {"clause_ref": "п. 5.1", "quote": "Учредители обязуются совместно подготовить пакет документов для государственной регистрации Общества. Устав Общества утверждается единогласным решением учредителей."}
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Учредители договорились создать общество."

        Ответ:
        {
          "joint_activity_status": "not_defined",
          "joint_activity_details": "Данные не определены",
          "charter_approval_status": "not_defined",
          "charter_approval_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Проверь, что все 5 ключей (4 полей + evidence) присутствуют в JSON:
        1. Значения enum — строго из allowed_values?
        2. Текстовые поля при отсутствии данных = "Данные не определены"?
        3. Зафиксировано ли именно утверждение устава (а не только подготовка)?

        Не выводи шаги проверки. Верни только JSON.
      fields:
