        - '(?i)\\bР\\s*1[12]00[12]\\b'
        - '(?i)нотариальн(ое|ого|ым)\\s+удостоверени'
        - '(?i)решени(е|я|ю)\\s+об\\s+учреждени'

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по корпоративному праву.
        Анализируется договор об учреждении общества
        (ст. 51, 67.1 п. 3 пп. 3 ГК РФ; ст. 11, 13 ФЗ-14; ст. 8, 9 ФЗ-208; ФЗ-129).
        Проверяется: процедура подачи документов на регистрацию, способ
        подтверждения решения об учреждении и compliance процедуры.

        Нормативный ориентир:
        - ст. 51 ГК РФ — государственная регистрация юридических лиц.
        - ст. 67.1 п. 3 пп. 3 ГК РФ (в ред. ФЗ-287 от 24.07.2023) — способы
          подтверждения решения об учреждении ООО с 2+ участниками:
          (а) нотариальное удостоверение;
          (б) подписание всеми участниками в присутствии нотариуса;
          (в) аудио- и/или видеозапись заседания;
          (г) решение, подписанное всеми участниками.
          Для единственного учредителя — решение единственного участника
          (нотариальное удостоверение не требуется).
        - ст. 11, 13 ФЗ-14 — документы для регистрации ООО.
        - ФЗ-129 — порядок государственной регистрации.

        Важно:
        - Твоя задача — установить факты из текста договора.
        - Не оценивай риски, кроме registration_compliance.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Субъект и порядок подачи документов на регистрацию (кто, куда, сроки).
        2. Способ подтверждения решения об учреждении.
        3. Оцени соответствие процедуры ст. 67.1 п. 3 пп. 3 ГК РФ.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. verdict = "pass" — подача и способ подтверждения указаны и compliant.
        3. verdict = "unclear" — подача указана, но способ подтверждения неясен.
        4. verdict = "fail" — процедура регистрации не описана.
        5. Верни РОВНО один валидный JSON-объект со всеми 3 ключами (verdict,
           reason, evidence). Начни ответ сразу с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — compliant:
        Фрагмент:
        "Учредители обязуются в течение 10 рабочих дней подать документы на
        государственную регистрацию в МИФНС № 46 по г. Москве. Решение об
        учреждении подтверждается нотариальным удостоверением."

        Ответ:
        {
          "verdict": "pass",
          "reason": "Подача документов и нотариальное удостоверение решения об учреждении указаны прямо.",
          "evidence": [
            {"clause_ref": "п. 12.1", "quote": "Учредители обязуются в течение 10 рабочих дней подать документы на государственную регистрацию в МИФНС № 46 по г. Москве."}
          ]
        }

        Пример 2 — invalid method:
        Фрагмент:
        "Решение об учреждении принимается большинством голосов учредителей."

        Ответ:
        {
          "verdict": "fail",
          "reason": "Способ подтверждения решения (большинством голосов) противоречит ст. 67.1 п. 3 пп. 3 ГК РФ.",
          "evidence": [
            {"clause_ref": "п. 3.1", "quote": "Решение об учреждении принимается большинством голосов учредителей."}
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Проверь, что все 3 ключа (verdict, reason, evidence) присутствуют в JSON.
        Не выводи шаги проверки. Верни только JSON.
