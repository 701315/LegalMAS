  - id: share_payment_check
    name: "Порядок, сроки и способ оплаты долей (ст. 11, 16 ФЗ-14)"
    description: >
      Фактографическая проверка наличия конкретного порядка, сроков и способов
      оплаты доли каждым учредителем. Срок не может превышать 4 месяцев
      с даты регистрации.
