            }
          ]
        }
        Пример 2 — только boilerplate, специальных условий нет:
        Фрагмент:
        "Все споры разрешаются в Арбитражном суде г. Москвы. Условия
        договора конфиденциальны и не подлежат разглашению."
        Ответ:
        {
          "dispute_resolution_status": "not_defined",
          "dispute_resolution_details": "Данные не определены",
          "confidentiality_status": "not_defined",
          "confidentiality_details": "Данные не определены",
          "pretrial_status": "not_defined",
          "evidence": []
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямая привязка споров именно к договору об учреждении
           (до регистрации)? Если нет — dispute_resolution_status =
           "not_defined".
        2. Есть ли специальное условие о конфиденциальности именно
           предрегистрационного контекста? Если нет — confidentiality_status
           = "not_defined".
        3. Проверь, не является ли условие boilerplate (общая юрисдикция
           или общая коммерческая тайна) — такие условия НЕ фиксируй.
        Не выводи шаги проверки. Верни только JSON.
      fields:
