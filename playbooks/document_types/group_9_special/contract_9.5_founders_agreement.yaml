      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 700
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по корпоративному праву. Извлеки из договора
        об учреждении общества порядок разрешения споров и конфиденциальность.
        Не анализируй уставный капитал, оплату долей или солидарную ответственность.
        </role>
        <context>
