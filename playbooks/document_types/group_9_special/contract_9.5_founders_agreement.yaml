        5. verdict = "fail" — если порядок совместных действий отсутствует.
        6. Верни РОВНО один валидный JSON-объект со всеми 3 ключами (verdict, reason, evidence),
           пригодный для парсинга через json.loads без предварительной обработки. Начни ответ сразу с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — условия согласованы:
