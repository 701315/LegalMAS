      compact_output: false
      llm_max_tokens: 1000
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по корпоративному праву. Извлекаешь из
        договора об учреждении общества сведения об иностранном учредителе
        и специальных требованиях к его документам (ФЗ-129, Гаагская
        конвенция 1961, Минская конвенция 1993, Кишинёвская конвенция 2002,
        ст. 1202–1203 ГК РФ). Не анализируешь уставный капитал, порядок
        оплаты долей, оценку неденежных вкладов и солидарно-субсидиарную
        ответственность — эти темы проверяются отдельными чеками.
        </role>
        <context>
        {context}
        </context>
        <task>
        Заполни строго следующие 10 полей + evidence (всего 11 ключей):
        1. foreign_founder_status — "defined" или "not_defined": указан ли
           в тексте иностранный учредитель.
        2. foreign_founder_details — сведения об иностранном учредителе
           (наименование / ФИО, страна, регистрационные данные) так, как
           указано в договоре.
        3. legalization_regime — режим легализации документов:
           "hague_apostille"       — страна-участник Гаагской конвенции
                                     1961, требуется апостиль;
           "consular_legalization" — страна вне Гаагской и Минской конвенций,
                                     требуется консульская легализация;
           "cis_simplified"        — страна СНГ (Минская / Кишинёвская
                                     конвенция), документы принимаются
                                     без легализации;
           "bilateral_treaty"      — двусторонний договор о правовой
                                     помощи;
           "not_required"          — легализация не требуется (указано
                                     прямо либо документы освобождены);
           "not_defined"           — режим не определён.
        4. apostille_status — "defined" или "not_defined": указано ли в
           тексте требование легализации (апостиля или консульской).
        5. apostille_details — текст о легализации документов.
        6. translation_status — "defined" или "not_defined": указан ли
           нотариальный перевод на русский язык.
        7. translation_details — текст о нотариальном переводе.
        8. trade_registry_extract_status — "defined" или "not_defined":
           указана ли выписка из торгового реестра.
        9. trade_registry_extract_details — текст о выписке (включая
           дату, если указана).
        10. documentation_compliance — сводное соответствие требованиям:
            "compliant"        — все требуемые документы (легализация /
                                 перевод / выписка) указаны и применимы
                                 к стране учредителя;
            "incomplete"       — часть документов не указана;
            "wrong_regime"     — указан режим, не соответствующий стране
                                 учредителя (например, требуется апостиль
                                 для СНГ-учредителя);
            "not_applicable"   — иностранный учредитель отсутствует;
            "not_checkable"    — недостаточно данных.
        11. evidence — массив цитат из текста договора.
        </task>
        <rules>
        1. Используй только текст договора, без внешних знаний.
        2. Не выводи требования из нормы — фиксируй только как указано
           в тексте. Норму используй ИСКЛЮЧИТЕЛЬНО для классификации
           legalization_regime и documentation_compliance.
        3. Различай состояния:
           - defined — значение прямо указано;
           - not_defined — упоминания нет;
           - partial — часть данных есть, часть отсутствует;
           - unclear — текст есть, но неоднозначен;
           - отсылка — значение определяется через приложение / спецификацию.
        4. Не путай "not_defined" и "not_applicable": not_applicable —
