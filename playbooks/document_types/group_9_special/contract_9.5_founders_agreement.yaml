    extraction:
      enabled: true
      mode: "hybrid"
      store_payload: true
      compact_output: false
      llm_max_tokens: 900
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по корпоративному праву. Извлекаешь из
        договора об учреждении общества срок действия, порядок прекращения
        после регистрации и перечень положений, сохраняющих силу после
        регистрации. Проверяешь соответствие указанного режима
        применимой норме: для ООО — ст. 89.1 п. 3 ГК РФ (после регистрации
        внутренние отношения регулируются уставом), для АО — ст. 9 п. 1
        ФЗ-208 (договор утрачивает силу с момента регистрации). Не
        анализируешь уставный капитал, порядок оплаты долей, оценку
        неденежных вкладов и солидарно-субсидиарную ответственность —
        эти темы проверяются отдельными чеками.
        </role>
        <context>
        {context}
        </context>
        <task>
        Заполни строго следующие 7 полей + evidence (всего 8 ключей):
        1. contract_term_status — "defined" или "not_defined": указан ли
           в тексте срок действия договора.
        2. contract_term_details — текст условия о сроке действия так,
           как указано в договоре.
        3. post_registration_termination_status — "defined" или
           "not_defined": указано ли прекращение действия после регистрации.
        4. post_registration_termination_details — текст о прекращении
           действия после регистрации.
        5. post_registration_provisions_status — "defined" или
           "not_defined": указан ли перечень положений, сохраняющих
           силу после регистрации.
        6. post_registration_provisions_details — перечень положений,
           сохраняющих силу после регистрации.
        7. post_registration_regime_compliance — соответствие применимой
           норме:
           "compliant_ao"              — ОПФ = АО, указано прекращение
                                        действия договора после регистрации
                                        (ст. 9 п. 1 ФЗ-208);
           "compliant_ooo"             — ОПФ = ООО, указано сохранение
                                        силы только в части предрегистрационных
                                        обязательств / переход на устав
                                        (ст. 89.1 п. 3 ГК РФ);
           "contradicts_ao_rule"      — ОПФ = АО, но указано сохранение
                                        силы договора после регистрации
                                        (противоречие ст. 9 п. 1 ФЗ-208);
           "contradicts_ooo_rule"     — ОПФ = ООО, но указано, что
                                        договор продолжает регулировать
                                        внутренние отношения после
                                        регистрации (противоречие
                                        ст. 89.1 п. 3 ГК РФ);
           "not_checkable"            — недостаточно данных (ОПФ или
                                        режим не указаны).
        8. evidence — массив цитат из текста договора.
        </task>
        <rules>
        1. Используй только текст договора, без внешних знаний.
        2. Не выводи условия о сроке из нормы — фиксируй только как
           указано в тексте. Норму используй ИСКЛЮЧИТЕЛЬНО для
           классификации post_registration_regime_compliance.
        3. Различай состояния:
           - defined — значение прямо указано;
           - not_defined — упоминания нет;
           - partial — часть данных есть, часть отсутствует;
           - unclear — текст есть, но неоднозначен;
           - отсылка — значение определяется через приложение / спецификацию.
        4. Не путай "not_defined" и "not_applicable": not_applicable —
           только если условие неприменимо по природе сделки.
        5. Состояния "partial" / "unclear" / "отсылка" отражай через
           value-поле; в status-полях допустимо только "defined" /
           "not_defined".
        6. post_registration_regime_compliance — определи по правилам:
           - "compliant_ao"           — ОПФ = АО, и в тексте прямо
                                        указано, что договор утрачивает
                                        силу после регистрации;
           - "compliant_ooo"          — ОПФ = ООО, и указано сохранение
                                        силы либо в части предрегистрационных
                                        обязательств, либо переход
                                        регулирования внутренних отношений
                                        к уставу;
           - "contradicts_ao_rule"   — ОПФ = АО, но указано, что договор
                                        сохраняет силу после регистрации
                                        (ст. 9 п. 1 ФЗ-208 императивна);
           - "contradicts_ooo_rule"  — ОПФ = ООО, но указано, что договор
                                        продолжает регулировать внутренние
                                        отношения после регистрации
                                        (ст. 89.1 п. 3 ГК РФ);
           - "not_checkable"          — ОПФ в тексте не указана или
                                        условия о режиме после регистрации
                                        неопределимы.
        7. Если в тексте прямо не указана ОПФ, но по контексту (наименование
           общества, ссылки на нормы) можно достоверно определить — фиксируй
           соответствующую классификацию. Если нет — "not_checkable".
        8. Если status = "not_defined" — value = "Данные не определены",
           evidence = [].
        9. Значения enum-полей — строго из allowed_values.
        10. Запрещены "None", "null", пустые строки, отсутствующие ключи.
        11. Верни РОВНО один валидный JSON-объект со всеми 8 ключами,
            пригодный для парсинга через json.loads без предварительной
            обработки. Без markdown, без ```json, без комментариев, без
            текста до или после. Начни ответ сразу с { и закончи }.
        </rules>
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — АО, соответствует норме:
        Фрагмент:
        "Создаётся Акционерное общество «Бета». Настоящий договор действует
        до момента государственной регистрации Общества и утрачивает силу
        после регистрации. Положения о конфиденциальности и порядке
        разрешения споров сохраняют силу после регистрации."
        Ответ:
        {
          "contract_term_status": "defined",
          "contract_term_details": "действует до момента государственной регистрации Общества",
          "post_registration_termination_status": "defined",
          "post_registration_termination_details": "утрачивает силу после регистрации",
          "post_registration_provisions_status": "defined",
          "post_registration_provisions_details": "положения о конфиденциальности и порядке разрешения споров сохраняют силу после регистрации",
          "post_registration_regime_compliance": "compliant_ao",
          "evidence": [
            {
              "clause_ref": "п. 10.1",
              "quote": "Настоящий договор действует до момента государственной регистрации Общества и утрачивает силу после регистрации."
            }
          ]
        }
        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Учредители обязуются создать общество."
        Ответ:
        {
          "contract_term_status": "not_defined",
          "contract_term_details": "Данные не определены",
          "post_registration_termination_status": "not_defined",
          "post_registration_termination_details": "Данные не определены",
          "post_registration_provisions_status": "not_defined",
          "post_registration_provisions_details": "Данные не определены",
          "post_registration_regime_compliance": "not_checkable",
          "evidence": []
        }
        Пример 3 — ООО, противоречие норме:
        Фрагмент:
        "Создаётся Общество с ограниченной ответственностью «Бета».
        Настоящий договор действует бессрочно и регулирует внутренние
        отношения участников Общества после регистрации."
        Ответ:
        {
          "contract_term_status": "defined",
          "contract_term_details": "действует бессрочно",
          "post_registration_termination_status": "not_defined",
          "post_registration_termination_details": "Данные не определены",
          "post_registration_provisions_status": "defined",
          "post_registration_provisions_details": "договор регулирует внутренние отношения участников после регистрации",
          "post_registration_regime_compliance": "contradicts_ooo_rule",
          "evidence": [
            {
              "clause_ref": "п. 10.1",
              "quote": "Настоящий договор действует бессрочно и регулирует внутренние отношения участников Общества после регистрации."
            }
          ]
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямая цитата о сроке действия договора? Если нет —
           contract_term_status = "not_defined".
        2. Есть ли прямая цитата о прекращении действия после регистрации?
           Если нет — post_registration_termination_status = "not_defined".
        3. Есть ли перечень положений, сохраняющих силу после регистрации?
           Если нет — post_registration_provisions_status = "not_defined".
        4. Определена ли ОПФ общества (ООО / АО)? Соотнеси с
           post_registration_regime_compliance — строго из allowed_values.
           Проверь, не противоречит ли указанный режим применимой норме.
        Не выводи шаги проверки. Верни только JSON.
      fields:
        - name: "contract_term_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания срока действия договора об учреждении."
          required: true
        - name: "contract_term_details"
          type: "string"
          presentation: "fact"
          label: "Срок действия"
          description: "Текст условия о сроке действия договора об учреждении."
          required: true
          display_in_grid: true
          display_priority: 1
        - name: "post_registration_termination_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания прекращения действия договора после регистрации."
          required: true
        - name: "post_registration_termination_details"
          type: "string"
          presentation: "fact"
          label: "Прекращение после регистрации"
          description: "Текст о прекращении действия договора после регистрации."
          required: true
          display_in_grid: true
          display_priority: 2
        - name: "post_registration_provisions_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания положений, сохраняющих силу после регистрации."
          required: true
        - name: "post_registration_provisions_details"
          type: "string"
          presentation: "fact"
          label: "Положения после регистрации"
          description: "Перечень положений, сохраняющих силу после регистрации."
          required: true
          display_in_grid: true
          display_priority: 3
        - name: "post_registration_regime_compliance"
          type: "string"
          presentation: "signal"
          allowed_values: ["compliant_ao", "compliant_ooo", "contradicts_ao_rule", "contradicts_ooo_rule", "not_checkable"]
          description: "Соответствие режима договора после регистрации применимой норме (ст. 89.1 п. 3 ГК РФ для ООО, ст. 9 п. 1 ФЗ-208 для АО)."
          required: true

  - id: foreign_founder_check
    name: "Специальные требования для иностранного учредителя (ФЗ-129, Гаагская конвенция 1961, Минская конвенция 1993, ст. 1202–1203 ГК РФ)"
    description: >
      Фиксация соблюдения специальных требований при наличии иностранного
      учредителя: определение режима легализации документов (апостиль по
      Гаагской конвенции 1961 / консульская легализация / упрощённый режим
      СНГ по Минской конвенции 1993 / двусторонний договор о правовой
      помощи), наличие нотариального перевода на русский язык, выписки из
      торгового реестра и её актуальности на дату подачи документов.
      Не покрывает отдельно процедуру получения предварительного согласия
      Правительственной комиссии по ФЗ-160 (стратегические отрасли) —
      фиксируется отдельным чеком.
    triggers:
      any: ["foreign_founder"]
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "апостиль"
        - "легализация"
        - "консульская легализация"
        - "нотариальный перевод"
        - "иностранное юридическое лицо"
        - "иностранный учредитель"
        - "нерезидент"
        - "выписка из торгового реестра"
        - "торговый реестр"
        - "Минская конвенция"
        - "Гаагская конвенция"
      keyword_mode: "any"
      regex_patterns:
        - '(?i)(апостиль|апостилир)'
        - '(?i)легализаци(я|и|ю)'
        - '(?i)нотариальн(ый|ого|ым)\\s+перевод'
        - '(?i)торгов(ый|ого)\\s+реестр'
        - '(?i)(Минск|Гааг|Кишинёв)ск(ая|ой)\\s+конвенци'

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по корпоративному праву. Анализируется договор
        об учреждении общества с иностранным учредителем (ФЗ-129, Гаагская
        конвенция 1961, Минская конвенция 1993, ст. 1202–1203 ГК РФ).
        Проверяется только один вопрос: содержит ли текст договора условия
        о легализации документов иностранного учредителя, нотариальном
        переводе и выписке из торгового реестра.
        [ЗАДАЧА]
        Определи, содержит ли текст договора:
        1. Указание на иностранного учредителя.
        2. Режим легализации документов (апостиль / консульская легализация /
           упрощённый режим СНГ без легализации / двусторонний договор).
        3. Указание на нотариальный перевод документов на русский язык.
        4. Указание на выписку из торгового реестра и её актуальность.
        Верни вердикт:
        - "pass"    — указаны иностранный учредитель, режим легализации,
                      нотариальный перевод и выписка из реестра.
        - "fail"    — в тексте нет упоминания иностранного учредителя.
        - "unclear" — часть требований указана, часть отсутствует.
        [ПРАВИЛА]
        1. Используй только текст договора.
        2. Evidence — прямые цитаты из договора.
        3. Верни РОВНО один валидный JSON-объект со всеми 4 ключами
           (verdict, confidence, reason, evidence), пригодный для парсинга
           через json.loads без предварительной обработки. Без markdown,
           без ```json, без комментариев, без текста до или после.
           Начни ответ сразу с { и закончи }.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — Hague-режим, документы легализованы:
        Фрагмент:
        "Учредитель — Company Ltd (Великобритания). Документы учредителя
        апостилированы, имеют нотариально заверенный перевод на русский
        язык. Выписка из торгового реестра от 15.02.2026 прилагается."
        Ответ:
        {
          "verdict": "pass",
          "confidence": 0.95,
          "reason": "Прямо указаны иностранный учредитель, апостиль, нотариальный перевод и выписка из торгового реестра.",
          "evidence": [
            {
              "clause_ref": "преамбула",
              "quote": "Документы учредителя апостилированы, имеют нотариально заверенный перевод на русский язык."
            }
          ]
        }
        Пример 2 — иностранный учредитель отсутствует:
        Фрагмент:
        "Учредители — Иванов И.И. и Петров П.П."
        Ответ:
        {
          "verdict": "fail",
          "confidence": 0.90,
          "reason": "В тексте отсутствует упоминание иностранного учредителя.",
          "evidence": []
