        договора об учреждении сведения об ответственности учредителей
        за убытки, причинённые обществу или другим учредителям
        (ст. 15, 393, 431.2 ГК РФ). Не анализируешь солидарно-
        субсидиарную ответственность перед третьими лицами до регистрации
        (solidary_liability_check), уставный капитал, порядок оплаты
