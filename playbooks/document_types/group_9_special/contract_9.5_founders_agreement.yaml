      retrieval_query: "срок действия действует до регистрации до момента государственной регистрации утрачивает силу после регистрации прекращает действие сохраняют силу после регистрации действуют после регистрации после прекращения договора конфиденциальность разрешение споров ст. 89.1 ГК РФ ст. 11 ФЗ-14 ст. 9 ФЗ-208"
