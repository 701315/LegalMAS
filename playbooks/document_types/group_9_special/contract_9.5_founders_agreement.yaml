            наименования общества (в т.ч. при замечаниях ФНС);
          - "not_defined" — если нет.

        8. name_change_details:
          Порядок изменения наименования общества (в т.ч. при замечаниях
          ФНС).
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".

        9. evidence — массив цитат из текста договора.
        </task>

        <context_rules>
        - Перед остальными полями заполни amendment_before_registration_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Данные не определены".
        - Используй только текст договора, без внешних знаний.
        - amendment_procedure: ищи «изменения вносятся», «дополнительное соглашение», «единогласно», «в письменной форме».
        - new_founder: ищи «включение нового учредителя», «присоединение», «с согласия всех».
        - share_change: ищи «перераспределение долей», «изменение размера», «замена вклада».
        - name_change: ищи «изменение наименования», «смена названия», «при замечаниях регистрирующего органа».
        - Не путай "not_defined" и "not_applicable": not_applicable — только если условие неприменимо по природе сделки.
        - Состояния "partial" / "unclear" / "отсылка" отражай через details-поле; в status-полях допустимо только "defined" / "not_defined".
        - Если status = "not_defined" — details = "Данные не определены".
        - Не используй пустые строки, "None", "null".
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
          В договоре нет ни общего порядка изменений, ни правил
          для отдельных сценариев.
          → presence = "missing";
            amendment_procedure_status = "not_defined";
            new_founder_status = "not_defined";
            share_change_status = "not_defined";
            name_change_status = "not_defined";
            все *_details = "Данные не определены".

        2. Частичное урегулирование.
          Общий порядок изменений указан, но правила для отдельных
          сценариев (новый учредитель / доли / наименование) отсутствуют.
          → presence = "present";
            amendment_procedure_status = "defined";
            соответствующие *_status = "not_defined" по факту.

        3. Противоречие между фрагментами.
          В разных частях договора указан разный кворум для изменений
          (например, «единогласно» и «большинством голосов»);
          конфликт нельзя разрешить по тексту.
          → presence = "unclear";
            amendment_procedure_status = "not_defined";
            amendment_procedure_details = "Не удалось определить".

        4. Прямое исключение изменений.
          В договоре прямо указано, что изменения до регистрации
          не допускаются.
          → presence = "present";
            amendment_procedure_status = "not_defined";
            amendment_procedure_details содержит цитату об исключении.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для amendment_before_registration_check_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined", "not_defined".
        - Fallback при отсутствии данных: все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности: соответствующие *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
