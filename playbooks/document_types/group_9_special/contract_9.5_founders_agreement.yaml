        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямое указание иностранного учредителя?
        2. Указан ли режим легализации документов?
        3. Указан ли нотариальный перевод?
        4. Указана ли выписка из торгового реестра?
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "verdict": "<pass / fail / unclear>",
          "confidence": <0.0–1.0>,
          "reason": "<краткое объяснение вердикта>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 600

    retrieval:
      retrieval_profile: "party_identification_check"
      corpus_scope: "primary_segment"
