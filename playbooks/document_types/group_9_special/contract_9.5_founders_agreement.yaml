        3. Не фиксируй boilerplate:
           - общая подсудность / применимое право → global governing_law_and_forum;
           - общий претензионный порядок → global limitation_periods_and_pre_claim_procedures;
           - общая конфиденциальность / коммерческая тайна → global confidentiality_and_trade_secrets.
           В этом чеке фиксируй ТОЛЬКО специфические условия, привязанные
           к предрегистрационному контексту самого договора об учреждении.
        4. Различай состояния:
           - defined — значение прямо указано;
           - not_defined — упоминания нет;
