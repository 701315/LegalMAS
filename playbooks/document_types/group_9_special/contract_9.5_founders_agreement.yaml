# ════════════════════════════════════════════════════════════════════════════
# БЛОК 5: DD_REQUEST_TEMPLATES
# Читается: DDRequestTemplateLoader
# ════════════════════════════════════════════════════════════════════════════

dd_request_templates:
  founders_and_company_check:
    text: >
      Просим предоставить по {doc_names}: (а) полные данные каждого учредителя
      (ФИО/наименование, ИНН, ОГРН, адрес, паспортные данные для физ. лиц);
      (б) полное и сокращённое наименование создаваемого общества;
      (в) организационно-правовую форму; (г) место нахождения.
    addressee: "Все учредители"

  charter_capital_shares_check:
    text: >
      Просим уточнить в {doc_names}: (а) общий размер уставного капитала
      (для ООО — не менее 10 000 руб.); (б) размер и номинальную стоимость доли
      каждого учредителя; (в) подтверждение, что сумма долей = 100%;
      (г) валюту оплаты.
    addressee: "Все учредители / Юридический советник"

  share_payment_check:
    text: >
      Просим уточнить в {doc_names}: (а) конкретный срок оплаты каждым учредителем
      (не позднее 4 мес. с даты регистрации); (б) способ оплаты (деньги/имущество/
      права); (в) реквизиты для оплаты; (г) последствия неоплаты.
    addressee: "Все учредители / Юридический советник"

  non_monetary_valuation_check:
    text: >
      Просим предоставить по {doc_names}: (а) описание неденежного вклада;
      (б) отчёт независимого оценщика (для вкладов свыше 20 000 руб.);
      (в) протокол утверждения стоимости единогласным решением;
      (г) подтверждение информированности о субсидиарной ответственности (ст. 15 ФЗ-14).
    addressee: "Учредитель, вносящий неденежный вклад / Оценщик"

  solidary_liability_check:
    text: >
      Просим подтвердить в {doc_names}: (а) наличие положения о солидарной
      ответственности учредителей (ст. 11 ФЗ-14); (б) порядок одобрения обществом
      обязательств после регистрации; (в) лимиты обязательств до регистрации.
    addressee: "Юридический советник"

  pre_incorporation_contracts_check:
    text: >
      Просим уточнить в {doc_names}: (а) механизм одобрения договоров,
      заключаемых до регистрации; (б) лимиты полномочий уполномоченного лица;
      (в) порядок ратификации обществом после регистрации;
      (г) распределение ответственности при отказе от ратификации.
    addressee: "Юридический советник"

  corporate_agreement_obligation_check:
    text: >
      Просим согласовать в {doc_names}: (а) обязательство заключить
      корпоративный договор после регистрации; (б) ключевые условия
      (drag-along, tag-along, опционы, порядок голосования);
      (в) срок заключения; (г) санкции за незаключение.
    addressee: "Юридический советник"

  founder_withdrawal_check:
    text: >
      Просим уточнить в {doc_names}: (а) процедуру выхода учредителя
      (уведомление, срок); (б) последствия для доли и расходов;
      (в) порядок компенсации фактически понесённых расходов.
    addressee: "Юридический советник"

  joint_activity_expenses_check:
    text: >
      Просим описать в {doc_names}: (а) порядок совместных действий учредителей
      (подготовка устава, формирование пакета документов, подача на регистрацию);
      (б) распределение расходов на учреждение (пропорционально/поровну);
      (в) кандидатуру директора и порядок избрания;
      (г) перечень вопросов, требующих единогласного решения.
    addressee: "Все учредители"

  contract_term_post_registration_check:
    text: >
      Просим уточнить в {doc_names}: (а) срок действия договора (до регистрации
      или до наступления иного события); (б) какие положения сохраняют силу
      после регистрации общества (конфиденциальность, споры, ответственность);
      (в) указать их автономность от устава.
    addressee: "Юридический советник"

  foreign_founder_check:
    text: >
      Для {doc_names} при участии иностранного учредителя просим предоставить:
      (а) апостилированные/легализованные документы; (б) нотариальный перевод;
      (в) выписку из торгового реестра; (г) подтверждение правоспособности.
    addressee: "Иностранный учредитель / Юридический советник"

  dispute_confidentiality_check:
    text: >
      Просим согласовать в {doc_names}: (а) досудебный порядок (претензии,
      переговоры); (б) подсудность; (в) арбитражную оговорку (при наличии);
      (г) обязательство конфиденциальности в отношении условий договора
