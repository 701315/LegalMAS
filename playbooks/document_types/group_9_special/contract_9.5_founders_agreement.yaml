        - "ФЗ-152"
      keyword_mode: "any"
      regex_patterns:
        - '(?i)расход(ы|ов)\s+(на\s+)?учреждени'
        - '(?i)госпошлин'
        - '(?i)персональн[а-яё]+\s+данн[а-яё]+'

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по корпоративному и налоговому праву.
        Анализируется договор об учреждении общества (ст. 89.1 ГК РФ; ст. 217 НК РФ; ФЗ-152).
        Проверяется три вопроса: расходы на учреждение, налоги при неденежных вкладах и согласие на обработку персональных данных.

        Нормативный ориентир:
        - ст. 89.1 ГК РФ — распределение расходов на учреждение между учредителями.
        - ст. 217 НК РФ, ст. 251 НК РФ — налоговые аспект вкладов (НДФЛ у физлиц при неденежных вкладах по оценке оценщика).
        - ФЗ-152 «О персональных данных» — согласие на обработку и передачу ПДн учредителей в ФНС.

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай риски, фиксируй условия как факт.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Порядок распределения расходов на учреждение (в т.ч. уплата пошлины).
        2. Оговорки о налоговых последствиях вкладов в уставный капитал.
        3. Наличие согласия учредителей на обработку и передачу персональных данных в ФНС/нотариусу.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. verdict = "pass" — если все три блока урегулированы прямо.
        4. verdict = "unclear" — если урегулированы только расходы, а ПДн и налоги отсутствуют.
        5. verdict = "fail" — если расходы на учреждение не распределены.
        6. Верни РОВНО один валидный JSON-объект со всеми 3 ключами (verdict, reason, evidence),
          пригодный для парсинга через json.loads без предварительной обработки. Начни ответ сразу с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — расходы и ПДн урегулированы (pass):
        Фрагмент:
        "Расходы на учреждение Общества, включая государственную пошлину, распределяются
        поровну. Настоящим учредители дают письменное согласие на обработку своих
        персональных данных в целях совершения регистрационных действий. Налоги, связанные
        с внесением вкладов, уплачиваются сторонами самостоятельно."

        Ответ:
        {
          "verdict": "pass",
          "reason": "Урегулированы порядок распределения расходов, согласие на обработку персональных данных и налоговые обязательства сторон.",
          "evidence": [
            {"clause_ref": "п. 6.1–6.3", "quote": "Расходы на учреждение Общества, включая государственную пошлину, распределяются поровну. Настоящим учредители дают письменное согласие на обработку персональных данных"}
          ]
        }

        Пример 2 — только расходы (unclear):
        Фрагмент:
        "Расходы по регистрации несёт Приобретатель."

        Ответ:
        {
          "verdict": "unclear",
          "reason": "Распределены только расходы по регистрации, налоги и персональные данные не упомянуты.",
          "evidence": [
            {"clause_ref": "п. 5.1", "quote": "Расходы по регистрации несёт Приобретатель."}
          ]
