      - '(?i)аренд[аа]\\s+до\\s+регистраци[ии]'

  corporate_agreement_planned:
    any_keywords:
      - '(?i)корпоративн[ыо]й\\s+договор'
      - '(?i)акционерн[оа]е\\s+соглашени[ея]'
      - '(?i)соглашени[ея]\\s+об\\s+осуществлени[ии]\\s+прав\\s+участник[оо]в'
      - '(?i)\\bdrag-?along\\b'
      - '(?i)\\btag-?along\\b'
      - '(?i)прав[оо]\\s+первого\\s+отказ[аа]'
      - '(?i)\\bопцион\\b'

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 3: SHARED PATTERNS
#  Читается: DocTypeCheckLoader через _resolve_yaml_templates()
# ════════════════════════════════════════════════════════════════════════════

shared_patterns:
  money_amount: "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|тыс|млн)"
  date_pattern: "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"
  percentage_pattern: "(?i)\\b\\d+[,.]?\\d*\\s*(%|процент)"
  inn_pattern: "(?i)\\bИНН\\s*\\d{10,12}\\b"
  ogrn_pattern: "(?i)\\bОГРН\\s*\\d{13,15}\\b"

compliance_rules: []

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: CHECKS_V8 — единственный рабочий слой юридического анализа
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  - id: founders_and_company_check
    name: "Учредители, наименование и ОПФ создаваемого общества"
    description: >
      Фактографическая проверка идентификации учредителей (ФИО/наименование,
      ИНН, ОГРН, КПП, адрес, паспортные данные) и данных создаваемого общества
      (полное наименование, ОПФ, место нахождения, количество учредителей).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "учредитель"
        - "создать общество"
        - "наименование общества"
        - "организационно-правовая форма"
        - "место нахождения"
        - "ООО"
        - "АО"
        - "ПАО"
        - "ИНН"
        - "ОГРН"
        - "КПП"
        - "паспорт"
        - "адрес"
      keyword_mode: "any"
      regex_patterns:
        - '(?i)учредител(ь|и|ей|ями)\s*([-—:]|обязу)'
        - '(?i)(ООО|АО|ПАО|ЗАО|ОАО)\s*[«"]'
        - '(?i)(Общество\s+с\s+ограниченной\s+ответственностью|Публичное\s+акционерное\s+общество|Непубличное\s+акционерное\s+общество)\s*[«"]'
        - '(?i)\bИНН\s*\d{10,12}\b'
        - '(?i)\bОГРН\s*\d{13,15}\b'
        - '(?i)\bКПП\s*\d{9}\b'

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по корпоративному праву. Анализируется договор
        об учреждении общества (ст. 89.1 ГК РФ, ст. 11 ФЗ-14 «Об ООО»,
        ст. 9 ФЗ-208 «Об АО»). Проверяется только один вопрос: содержит ли
        текст договора идентификацию учредителей и данные создаваемого
        общества.
        [ЗАДАЧА]
        Определи, содержит ли текст договора:
        1. Перечень учредителей (ФИО/наименование, ИНН, ОГРН, КПП, паспорт, адрес).
        2. Количество учредителей.
        3. Полное наименование создаваемого общества.
        4. Организационно-правовую форму (ООО/АО/ПАО).
        5. Место нахождения создаваемого общества.
        Верни вердикт:
        - "pass"    — идентификация учредителей и данные общества указаны прямо.
        - "fail"    — идентификация или данные общества отсутствуют.
        - "unclear" — данные частичны или фрагментарны (указан только
                      один элемент либо состав учредителей неполный).
        [ПРАВИЛА]
        1. Используй только текст договора.
        2. Evidence — прямые цитаты из договора.
        3. Верни РОВНО один валидный JSON-объект со всеми 4 ключами
          (verdict, confidence, reason, evidence), пригодный для парсинга
          через json.loads без предварительной обработки. Без markdown,
          без ```json, без комментариев, без текста до или после.
          Начни ответ сразу с { и закончи }.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — данные определены:
        Фрагмент:
        "Учредители: 1) Иванов Иван Иванович, паспорт 45 00 № 123456,
        ИНН 770000000001; 2) ООО «Альфа», ИНН 7700000001, ОГРН 1027700000001.
        Учредители создают Общество с ограниченной ответственностью «Бета».
        Место нахождения: г. Москва."
        Ответ:
        {
          "verdict": "pass",
          "confidence": 0.95,
          "reason": "Прямо указаны перечень учредителей, количество, наименование, ОПФ и место нахождения создаваемого общества.",
          "evidence": [
            {
              "clause_ref": "преамбула",
              "quote": "Учредители: 1) Иванов Иван Иванович, паспорт 45 00 № 123456, ИНН 770000000001; 2) ООО «Альфа», ИНН 7700000001, ОГРН 1027700000001."
            }
          ]
        }
        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Стороны договорились создать общество."
        Ответ:
        {
          "verdict": "fail",
          "confidence": 0.90,
          "reason": "В тексте отсутствуют перечень учредителей, наименование, ОПФ и место нахождения создаваемого общества.",
          "evidence": []
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли в тексте прямое указание состава учредителей?
        2. Есть ли в тексте прямое указание наименования и ОПФ создаваемого общества?
        3. Если хотя бы одного из пунктов нет — понизь вердикт до "unclear" или "fail".
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "verdict": "<pass / fail / unclear>",
          "confidence": <0.0–1.0>,
          "reason": "<краткое объяснение вердикта>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 700

    retrieval:
      retrieval_profile: "party_identification_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "учредитель создать общество наименование общества организационно-правовая форма место нахождения ООО АО ПАО ИНН ОГРН паспорт адрес количество учредителей"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - representations
        - definitions
        - boilerplate
      negative_keywords:
        - "уставный капитал"
        - "доля учредителя"
        - "оплата доли"
        - "солидарная ответственность"
        - "неденежный вклад"
        - "оценка"
        - "корпоративный договор"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 0.25]
        boost: 0.30
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "representations"
        - "definitions"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.15

    evidence:
      required: true
      min_snippet_length: 50
      max_snippet_length: 1000

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1400

      compact_output: false

      presence_signal:
        field: "founders_and_company_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по корпоративному праву. Извлекаешь из договора
        об учреждении общества сведения об учредителях и о создаваемом
        обществе. Не анализируешь уставный капитал, доли, порядок их оплаты
        и солидарную ответственность — эти темы проверяются отдельными
        чеками.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 9 полей + evidence (всего 10 ключей):

        0. founders_and_company_check_presence:
          Агрегатное signal-поле — наличие регулирования по теме.
          - "present" — если хотя бы одно из содержательных полей
            (founders_list_status, number_of_founders_status,
              company_name_status, company_location_status) ≠ "not_defined";
          - "missing" — если все четыре содержательных поля = "not_defined";
          - "unclear" — если фрагменты по теме есть, но из-за противоречий
            вывод невозможен.

          Если presence = "missing":
          - founders_list_status = "not_defined";
          - number_of_founders_status = "not_defined";
          - company_name_status = "not_defined";
          - company_location_status = "not_defined";
          - founders_list_details = "Данные не определены";
          - number_of_founders_value = 0;
          - company_name_value = "Данные не определены";
          - company_form_code = "not_defined";
          - company_location_value = "Данные не определены";
          - не выполняй остальные шаги.

        1. founders_list_status:
          - "defined" — если в тексте прямо указан перечень учредителей
            (ФИО/наименование, ИНН, ОГРН, КПП, паспорт, адрес);
          - "not_defined" — если перечень учредителей прямо не указан
            или его нельзя надёжно определить.

        2. founders_list_details:
          Перечень учредителей с реквизитами (ФИО/наименование, ИНН, ОГРН,
          КПП, паспорт, адрес) — только то, что прямо указано в тексте.
          Для физлиц фиксируй полные паспортные данные (серия, номер,
          кем выдан, дата выдачи, код подразделения — если указаны).
          Для юрлиц — ИНН, ОГРН, КПП, адрес — если указаны.
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".

        3. number_of_founders_status:
          - "defined" — если количество учредителей прямо указано
            или однозначно следует из перечня;
          - "not_defined" — если количество прямо не определено.

        4. number_of_founders_value:
          Количество учредителей (число).
          Если не определено — 0.

        5. company_name_status:
          - "defined" — если прямо указано полное наименование
            создаваемого общества;
          - "not_defined" — если нет.

        6. company_name_value:
          Полное наименование создаваемого общества.
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".

        7. company_form_code:
          - "ooo" / "ao" / "pao" — если прямо указана соответствующая ОПФ;
          - "not_defined" — если ОПФ прямо не указана или её нельзя
            надёжно определить.

        8. company_location_status:
          - "defined" — если прямо указано место нахождения создаваемого
            общества;
          - "not_defined" — если нет.

        9. company_location_value:
          Место нахождения создаваемого общества.
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".

        10. evidence — массив цитат из текста договора.
        </task>

        <context_rules>
        - Перед остальными полями заполни founders_and_company_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details/*_value = "Данные не определены", company_form_code = "not_defined", number_of_founders_value = 0.
        - Используй только текст договора, без внешних знаний.
        - Не выводи реквизиты из контекста — только прямо указанные в документе.
        - Для физлиц фиксируй полные паспортные данные (серия, номер, кем выдан, дата выдачи, код подразделения — если указаны).
        - Для юрлиц фиксируй ИНН, ОГРН, КПП, адрес места нахождения — если указаны.
        - Не путай "not_defined" и "not_applicable": not_applicable — только если условие неприменимо по природе сделки.
        - Состояния "partial" / "unclear" / "отсылка" отражай через value/details-поле; в status-полях допустимо только "defined" / "not_defined".
        - Если status = "not_defined" — value/details = "Данные не определены".
        - Не используй пустые строки, "None", "null".
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
          В тексте нет ни перечня учредителей, ни данных создаваемого общества.
          → presence = "missing";
            все *_status = "not_defined";
            все *_details/*_value = "Данные не определены";
            company_form_code = "not_defined";
            number_of_founders_value = 0.

        2. Неполное раскрытие.
          Указан только один элемент (например, только наименование общества
          без ОПФ) или состав учредителей неполный.
          → presence = "present";
            соответствующие *_status = "not_defined";
            соответствующие *_details/*_value = "Данные не определены".

        3. Противоречие между фрагментами.
          В разных частях указаны разные наименования общества или ОПФ.
          → presence = "unclear";
            соответствующий *_status = "not_defined";
            соответствующий *_details/*_value = "Не удалось определить".

        4. Отсылка на внешний документ / устав.
          Данные учредителей или создаваемого общества определяются через
          устав, приложение, реестр, выписку из ЕГРЮЛ.
          → presence = "present";
            соответствующий *_status = "defined";
            *_details содержит формулировку вида "Согласно уставу (Приложение №1)".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для founders_and_company_check_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined" или "not_defined".
        - Для company_form_code используй только: "ooo", "ao", "pao", "not_defined".
        - Fallback при отсутствии данных:
          * founders_list_details → "Данные не определены";
          * number_of_founders_value → 0;
          * company_name_value → "Данные не определены";
          * company_form_code → "not_defined";
          * company_location_value → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * соответствующие *_details/*_value → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "founders_and_company_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие идентификации учредителей и данных создаваемого общества. Внутреннее агрегатное signal-поле."
          required: true

        - name: "founders_list_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус идентификации учредителей. Внутреннее enum-поле."
          required: true

        - name: "founders_list_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Учредители"
          description: "Перечень учредителей с реквизитами (ФИО/наименование, ИНН, ОГРН, КПП, паспорт, адрес)."
          required: true

        - name: "number_of_founders_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус определения количества учредителей. Внутреннее enum-поле."
          required: true

        - name: "number_of_founders_value"
          type: "number"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Количество учредителей"
          description: "Количество учредителей (число). При отсутствии данных — 0."
          required: true

        - name: "company_name_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус определения наименования создаваемого общества. Внутреннее enum-поле."
          required: true

        - name: "company_name_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Наименование общества"
          description: "Полное наименование создаваемого общества."
          required: true

        - name: "company_form_code"
          type: "string"
          presentation: "fact"
          allowed_values: ["ooo", "ao", "pao", "not_defined"]
          display_in_grid: false
          description: "Организационно-правовая форма создаваемого общества (ooo / ao / pao)."
          required: true

        - name: "company_location_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус определения места нахождения создаваемого общества. Внутреннее enum-поле."
          required: true

        - name: "company_location_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 4
          label: "Место нахождения"
          description: "Место нахождения создаваемого общества."
          required: true

      store_payload: true

  - id: charter_capital_shares_check
    name: "Уставный капитал: размер, доли, номинальная стоимость (ст. 89.1 ГК РФ, ст. 14 ФЗ-14)"
    description: >
      Фактографическая проверка размера уставного капитала, размера и
      номинальной стоимости доли каждого учредителя, формата доли (процент
      или простая дробь), а также подтверждения, что сумма долей = 100%.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "уставный капитал"
        - "размер уставного капитала"
        - "доля учредителя"
        - "номинальная стоимость"
        - "простая дробь"
        - "процент"
        - "рублей"
      keyword_mode: "any"
      regex_patterns:
        - '(?i)уставн(ый|ого)\s+капитал(а)?\s+(составляет|равен|в\s+размере)'
        - '(?i)\b\d[\d\s]*(?:руб|рублей|₽)'
        - '(?i)\b\d+[,.]?\d*\s*(%|процент)'
        - '(?i)(100\s*%|сто\s+процент)'
        - '(?i)номинальн(ая|ой)\s+стоимост'
        - '(?i)прост(ая|ой)\s+дроб'

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по корпоративному праву. Анализируется договор
        об учреждении общества (ст. 89.1 ГК РФ, ст. 11, 14 ФЗ-14 «Об ООО»,
        ст. 26 ФЗ-208 «Об АО»). Проверяется только один вопрос: содержит ли
        текст договора условия об уставном капитале и распределении долей
        учредителей.
        [ЗАДАЧА]
        Определи, содержит ли текст договора:
        1. Общий размер уставного капитала (в рублях).
        2. Валюту уставного капитала.
        3. Размер и номинальную стоимость доли каждого учредителя.
        4. Подтверждение, что сумма долей составляет 100%.
        Верни вердикт:
        - "pass"    — размер УК, доли с номиналом и подтверждение 100%
                      указаны прямо.
        - "fail"    — условия об УК или долях отсутствуют.
        - "unclear" — данные частичны: указан размер УК, но нет долей;
                      указаны доли, но нет номинала; сумма долей не
                      подтверждена как 100%.
        [ПРАВИЛА]
        1. Используй только текст договора.
        2. Evidence — прямые цитаты из договора.
        3. Верни РОВНО один валидный JSON-объект со всеми 4 ключами
          (verdict, confidence, reason, evidence), пригодный для парсинга
          через json.loads без предварительной обработки. Без markdown,
          без ```json, без комментариев, без текста до или после.
          Начни ответ сразу с { и закончи }.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — данные определены:
        Фрагмент:
        "Уставный капитал Общества составляет 100 000 рублей.
        Иванов И.И. — доля 60%, номинальная стоимость 60 000 рублей.
        ООО «Альфа» — доля 40%, номинальная стоимость 40 000 рублей.
        Сумма долей составляет 100% уставного капитала."
        Ответ:
        {
          "verdict": "pass",
          "confidence": 0.95,
          "reason": "Прямо указаны размер УК, доли с номинальной стоимостью каждого учредителя и подтверждение 100%.",
          "evidence": [
            {
              "clause_ref": "п. 3.1",
              "quote": "Уставный капитал Общества составляет 100 000 рублей. Иванов И.И. — доля 60%, номинальная стоимость 60 000 рублей. ООО «Альфа» — доля 40%, номинальная стоимость 40 000 рублей."
            }
          ]
        }
        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Учредители создают общество."
        Ответ:
        {
          "verdict": "fail",
          "confidence": 0.92,
          "reason": "В тексте отсутствуют условия об уставном капитале и распределении долей.",
          "evidence": []
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямое указание размера уставного капитала?
        2. Есть ли прямое указание доли и номинальной стоимости каждого учредителя?
        3. Есть ли подтверждение, что сумма долей = 100%?
        4. Если хотя бы одного из пунктов нет — вердикт "unclear" или "fail".
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "verdict": "<pass / fail / unclear>",
          "confidence": <0.0–1.0>,
          "reason": "<краткое объяснение вердикта>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 600

    retrieval:
      retrieval_profile: "party_identification_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "уставный капитал размер уставного капитала доля учредителя номинальная стоимость процент простая дробь рублей сумма долей сто процентов"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - definitions
        - obligations
      negative_keywords:
        - "оплата доли"
        - "срок оплаты"
        - "способ оплаты"
        - "неденежный вклад"
        - "оценка"
        - "солидарная ответственность"
        - "корпоративный договор"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.10, 0.50]
        boost: 0.20
        scope: segment
      context_k: 6
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "definitions"
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 700

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1000

      compact_output: false

      presence_signal:
        field: "charter_capital_shares_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по корпоративному праву. Извлекаешь из договора
        об учреждении общества данные об уставном капитале и распределении
        долей учредителей. Не анализируешь порядок оплаты, неденежные вклады
        или солидарную ответственность — эти темы проверяются отдельными
        чеками.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 7 полей + evidence (всего 8 ключей):

        0. charter_capital_shares_check_presence:
          Агрегатное signal-поле — наличие регулирования по теме.
          - "present" — если хотя бы одно из содержательных полей
            (charter_capital_status, shares_distribution_status,
              shares_total_100_status) ≠ "not_defined";
          - "missing" — если все три содержательных поля = "not_defined";
          - "unclear" — если фрагменты по теме есть, но из-за противоречий
            вывод невозможен.

          Если presence = "missing":
          - charter_capital_status = "not_defined";
          - shares_distribution_status = "not_defined";
          - shares_total_100_status = "not_defined";
          - charter_capital_value = "Данные не определены";
          - charter_capital_currency = "not_defined";
          - shares_distribution_details = "Данные не определены";
          - shares_total_100_details = "Данные не определены";
          - не выполняй остальные шаги.

        1. charter_capital_status:
          - "defined" — если в тексте прямо указан размер уставного капитала;
          - "not_defined" — если размер прямо не указан.

        2. charter_capital_value:
          Размер уставного капитала с указанием суммы и валюты.
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".

        3. charter_capital_currency:
          - "RUB" — если прямо указано, что УК в рублях, либо из контекста
            российского договора следует, что валюта — рубли;
          - "other" — если прямо указана иная валюта;
          - "not_defined" — если валюта не указана и из контекста её
            определить нельзя.

        4. shares_distribution_status:
          - "defined" — если прямо указан размер доли каждого учредителя;
          - "not_defined" — если доли прямо не указаны.

        5. shares_distribution_details:
          Для каждого учредителя: размер доли (в процентах или простой дроби,
          как указано в тексте) + номинальная стоимость в рублях.
          Если указано и то, и другое — приводи оба.
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".
          При расхождении в цифрах добавляй пометку "(не сходится)".

        6. shares_total_100_status:
          - "defined" — если прямо указано или однозначно следует из текста,
            что сумма долей составляет 100%;
          - "not_defined" — если подтверждения нет.

        7. shares_total_100_details:
          Подтверждение, что сумма долей = 100%.
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".

        8. evidence — массив цитат из текста договора.
        </task>

        <context_rules>
        - Перед остальными полями заполни charter_capital_shares_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_value/*_details = "Данные не определены", charter_capital_currency = "not_defined".
        - Используй только текст договора, без внешних знаний.
        - Не выводи размер уставного капитала из минимальных требований закона — фиксируй только прямо указанное в тексте.
        - Формат доли фиксируй так, как указан в тексте: процент (60%) или простая дробь (3/5, ½). Если указано и то, и другое — приводи оба.
        - Для каждого учредителя фиксируй одновременно: размер доли + номинальную стоимость в рублях — только прямо указанные.
        - Проверь арифметическую сходимость по цифрам из текста:
          * для каждого учредителя: номинальная стоимость доли × 100 ÷ размер доли в % = размер уставного капитала (в RUB);
          * сумма номинальных стоимостей долей всех учредителей = размер уставного капитала;
          * сумма размеров долей = 100%.
          Если хотя бы одно из равенств не выполняется по цифрам из текста — отражай расхождение в shares_distribution_details явной пометкой "(не сходится)", без самостоятельных арифметических выводов.
        - Не путай "not_defined" и "not_applicable": not_applicable — только если условие неприменимо по природе сделки.
        - Состояния "partial" / "unclear" / "отсылка" отражай через value/details-поле; в status-полях допустимо только "defined" / "not_defined".
        - Если status = "not_defined" — value/details = "Данные не определены".
        - Не используй пустые строки, "None", "null".
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
          В тексте нет ни размера УК, ни долей, ни подтверждения 100%.
          → presence = "missing";
            все *_status = "not_defined";
            все *_value/*_details = "Данные не определены";
            charter_capital_currency = "not_defined".

        2. Неполное раскрытие.
          Указан размер УК, но нет долей; либо указаны доли, но нет
          номинальной стоимости; либо нет подтверждения 100%.
          → presence = "present";
            соответствующий *_status = "defined" или "not_defined";
            соответствующий *_details = по факту.

        3. Противоречие между фрагментами.
          В разных частях указаны разные размеры УК или разные доли для
          одного учредителя; сумма долей ≠ 100% по цифрам из текста.
          → presence = "unclear";
            соответствующий *_status = "not_defined";
            соответствующий *_details = "Не удалось определить" (или
            значение с пометкой "(не сходится)" — если так прямо указано
            в тексте).

        4. Отсылка на внешний документ / устав.
          Размер УК, доли или номинальная стоимость определяются через
          устав, приложение или иной названный документ.
          → presence = "present";
            соответствующий *_status = "defined";
            *_details содержит формулировку вида "Согласно уставу
            (Приложение №1)".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для charter_capital_shares_check_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined" или "not_defined".
        - Для charter_capital_currency используй только: "RUB", "other", "not_defined".
        - Fallback при отсутствии данных:
          * charter_capital_value → "Данные не определены";
          * charter_capital_currency → "not_defined";
          * shares_distribution_details → "Данные не определены";
          * shares_total_100_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * соответствующие *_details/*_value → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "charter_capital_shares_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по уставному капиталу и долям. Внутреннее агрегатное signal-поле."
          required: true

        - name: "charter_capital_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус определения размера уставного капитала. Внутреннее enum-поле."
          required: true

        - name: "charter_capital_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Уставный капитал"
          description: "Размер уставного капитала с указанием суммы и валюты."
          required: true

        - name: "charter_capital_currency"
          type: "string"
          presentation: "fact"
          allowed_values: ["RUB", "other", "not_defined"]
          display_in_grid: false
          description: "Валюта уставного капитала (для российского общества — RUB)."
          required: true

        - name: "shares_distribution_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус распределения долей. Внутреннее enum-поле."
          required: true

        - name: "shares_distribution_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Доли учредителей"
          description: "Размер доли (в % или простой дроби) и номинальная стоимость в рублях для каждого учредителя."
          required: true

        - name: "shares_total_100_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус подтверждения суммы долей = 100%. Внутреннее enum-поле."
          required: true

        - name: "shares_total_100_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Сумма долей"
          description: "Подтверждение, что сумма долей составляет 100%."
          required: true

      store_payload: true

  - id: share_payment_check
    name: "Порядок, сроки и способ оплаты долей (ст. 16 ФЗ-14)"
    description: >
      Фактографическая проверка порядка, срока и способа оплаты доли
      каждым учредителем, включая сверку с императивным 4-месячным сроком
      с даты государственной регистрации (ст. 16 п. 1 ФЗ-14 «Об ООО»)
      и дифференциацию условий по учредителям.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "оплата доли"
        - "оплатить долю"
        - "порядок оплаты"
        - "срок оплаты"
        - "способ оплаты"
        - "денежными средствами"
        - "ценными бумагами"
        - "имуществом"
        - "правами"
        - "4 месяца"
        - "четыре месяца"
        - "не позднее"
      keyword_mode: "any"
      regex_patterns:
        - '(?i)оплат(а|ить|ы)\s+(свою\s+|своей\s+)?дол(ю|и|ей)'
        - '(?i)не\s+позднее\s+\d+\s*(месяц|дн)'
        - '(?i)в\s+течение\s+\d+\s*(месяц|дн)'
        - '(?i)(четыре|4)\s+месяц'

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по корпоративному праву. Анализируется договор
        об учреждении общества (ст. 89.1 ГК РФ, ст. 11, 16 ФЗ-14 «Об ООО»).
        Проверяется только один вопрос: содержит ли текст договора условия
        о порядке, сроке и способе оплаты долей учредителями.
        [ЗАДАЧА]
        Определи, содержит ли текст договора:
        1. Конкретный срок оплаты долей.
        2. Конкретный способ оплаты (деньги / ценные бумаги / имущество /
          имущественные права / смешанный).
        3. Указание на порядок оплаты каждым учредителем (единый или
          дифференцированный).
        Верни вердикт:
        - "pass"    — срок, способ и порядок оплаты указаны прямо.
        - "fail"    — условия об оплате долей отсутствуют.
        - "unclear" — данные частичны: указан срок без способа, или способ
                      без срока, или порядок не конкретизирован
                      («в порядке, предусмотренном законодательством»).
        [ПРАВИЛА]
        1. Используй только текст договора.
        2. Evidence — прямые цитаты из договора.
        3. Верни РОВНО один валидный JSON-объект со всеми 4 ключами
          (verdict, confidence, reason, evidence), пригодный для парсинга
          через json.loads без предварительной обработки. Без markdown,
          без ```json, без комментариев, без текста до или после.
          Начни ответ сразу с { и закончи }.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — условия определены:
        Фрагмент:
        "Каждый учредитель обязан оплатить свою долю в уставном капитале
        денежными средствами не позднее 3 месяцев с даты государственной
        регистрации Общества."
        Ответ:
        {
          "verdict": "pass",
          "confidence": 0.95,
          "reason": "Прямо указаны срок (не позднее 3 месяцев), способ (денежные средства) и общий порядок оплаты.",
          "evidence": [
            {
              "clause_ref": "п. 4.1",
              "quote": "Каждый учредитель обязан оплатить свою долю в уставном капитале денежными средствами не позднее 3 месяцев с даты государственной регистрации Общества."
            }
          ]
        }
        Пример 2 — условия отсутствуют:
        Фрагмент:
        "Учредители оплачивают доли в порядке, предусмотренном законодательством."
        Ответ:
        {
          "verdict": "unclear",
          "confidence": 0.85,
          "reason": "Есть общая отсылка к законодательству, но конкретный срок и способ не указаны.",
          "evidence": [
            {
              "clause_ref": "п. 4",
              "quote": "Учредители оплачивают доли в порядке, предусмотренном законодательством."
            }
          ]
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямое указание срока оплаты?
        2. Есть ли прямое указание способа оплаты?
        3. Есть ли указание порядка оплаты по учредителям?
        4. Если хотя бы одного из пунктов нет — вердикт "unclear" или "fail".
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "verdict": "<pass / fail / unclear>",
          "confidence": <0.0–1.0>,
          "reason": "<краткое объяснение вердикта>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 500

    retrieval:
      retrieval_profile: "payment_terms_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "оплата доли оплатить долю порядок оплаты срок оплаты способ оплаты денежными средствами ценными бумагами имуществом правами 4 месяца четыре месяца не позднее ст. 16 ФЗ-14"
      preferred_unit_types:
        - obligation
        - payment_term
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "уставный капитал"
        - "номинальная стоимость"
        - "доля учредителя"
        - "оценка"
        - "солидарная ответственность"
        - "корпоративный договор"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.15, 0.55]
        boost: 0.30
        scope: segment
      context_k: 5
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 900

      compact_output: false

      presence_signal:
        field: "share_payment_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по корпоративному праву. Извлекаешь из договора
        об учреждении общества порядок, сроки и способ оплаты долей
        учредителей. Не анализируешь размер уставного капитала и его
        распределение — эти темы проверяются отдельными чеками.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 7 полей + evidence (всего 8 ключей):

        0. share_payment_check_presence:
          Агрегатное signal-поле — наличие регулирования по теме.
          - "present" — если хотя бы одно из содержательных полей
            (payment_deadline_status, payment_method_code,
              per_founder_payment_status) ≠ "not_defined"
            ИЛИ payment_deadline_compliance ≠ "not_checkable";
          - "missing" — если все содержательные поля = "not_defined"
            и payment_deadline_compliance = "not_checkable";
          - "unclear" — если фрагменты по теме есть, но из-за противоречий
            вывод невозможен.

          Если presence = "missing":
          - payment_deadline_status = "not_defined";
          - payment_deadline_compliance = "not_checkable";
          - payment_method_code = "not_defined";
          - per_founder_payment_status = "not_defined";
          - payment_deadline_value = "Данные не определены";
          - payment_method_details = "Данные не определены";
          - per_founder_payment_details = "Данные не определены";
          - не выполняй остальные шаги.

        1. payment_deadline_status:
          - "defined" — если в тексте прямо указан конкретный срок оплаты;
          - "not_defined" — если срок прямо не указан.

        2. payment_deadline_value:
          Конкретный срок оплаты так, как указан в тексте договора.
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".

        3. payment_deadline_compliance:
          Сверка указанного срока с императивным лимитом четыре месяца
          с даты государственной регистрации (ст. 16 п. 1 ФЗ-14 «Об ООО»):
          - "within_limit"  — указанный срок ≤ 4 месяцев с госрегистрации;
          - "exceeds_limit" — указанный срок > 4 месяцев;
          - "not_checkable" — срок не указан или не может быть сопоставлен
                              с моментом госрегистрации.

        4. payment_method_code:
          - "money"      — денежные средства;
          - "property"   — имущество, вещи;
          - "securities" — ценные бумаги;
          - "rights"     — имущественные или иные права;
          - "mixed"      — несколько способов одновременно или выбор;
          - "not_defined" — способ прямо не указан.

        5. payment_method_details:
          Способ оплаты так, как указан в тексте.
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".

        6. per_founder_payment_status:
          - "common"         — условия оплаты едины для всех учредителей
                                (в том числе если формулировка общая:
                                «каждый учредитель обязан оплатить свою
                                долю в полном объёме»);
          - "differentiated" — для разных учредителей установлены разные
                                сроки / способы / суммы;
          - "not_defined"    — порядок прямо не определён.

        7. per_founder_payment_details:
          Текст о порядке оплаты по учредителям.
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".

        8. evidence — массив цитат из текста договора.
        </task>

        <context_rules>
        - Перед остальными полями заполни share_payment_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status/*_code = "not_defined"/"not_checkable", все *_value/*_details = "Данные не определены".
        - Используй только текст договора, без внешних знаний.
        - Не выводи срок оплаты из нормы ст. 16 ФЗ-14 — срок фиксируй только как прямо указан в тексте. Норму используй ИСКЛЮЧИТЕЛЬНО для проверки соответствия (поле payment_deadline_compliance).
        - Не путай "not_defined" и "not_applicable": not_applicable — только если условие неприменимо по природе сделки.
        - Состояния "partial" / "unclear" / "отсылка" отражай через value-поле; в status-полях допустимо только "defined" / "not_defined".
        - per_founder_payment_status = "common", если условия оплаты едины для всех учредителей, включая общую формулировку «каждый учредитель обязан оплатить свою долю». "differentiated" — только если для разных учредителей прямо установлены разные сроки / способы / суммы.
        - Если status = "not_defined" — value/details = "Данные не определены".
        - Не используй пустые строки, "None", "null".
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
          В тексте нет ни срока, ни способа, ни порядка оплаты долей.
          → presence = "missing";
            payment_deadline_status = "not_defined";
            payment_deadline_compliance = "not_checkable";
            payment_method_code = "not_defined";
            per_founder_payment_status = "not_defined";
            все *_value/*_details = "Данные не определены".

        2. Общая отсылка к законодательству.
          «Учредители оплачивают доли в порядке, предусмотренном
          законодательством», без конкретного срока и способа.
          → presence = "present";
            payment_deadline_status = "not_defined";
            payment_deadline_compliance = "not_checkable";
            payment_method_code = "not_defined";
            per_founder_payment_status = "not_defined";
            все *_value/*_details = "Данные не определены".

        3. Противоречие между фрагментами.
          В разных частях указаны разные сроки оплаты для одного и того же
          учредителя, и конфликт нельзя разрешить по тексту.
          → presence = "unclear";
            payment_deadline_status = "not_defined";
            payment_deadline_value = "Не удалось определить".

        4. Дифференцированные условия по учредителям.
          Для разных учредителей прямо установлены разные сроки / способы /
          суммы.
          → presence = "present";
            per_founder_payment_status = "differentiated";
            payment_method_code = "mixed" (если способы различаются);
            payment_deadline_compliance = "within_limit" / "exceeds_limit" /
              "not_checkable" по самому длинному сроку из указанных.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для share_payment_check_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined" или "not_defined".
        - Для payment_deadline_compliance используй только: "within_limit", "exceeds_limit", "not_checkable".
        - Для payment_method_code используй только: "money", "property", "securities", "rights", "mixed", "not_defined".
        - Для per_founder_payment_status используй только: "common", "differentiated", "not_defined".
        - Fallback при отсутствии данных: все *_value/*_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности: соответствующие *_value/*_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "share_payment_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по порядку, сроку и способу оплаты долей. Внутреннее агрегатное signal-поле."
          required: true

        - name: "payment_deadline_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус определения срока оплаты долей. Внутреннее enum-поле."
          required: true

        - name: "payment_deadline_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Срок оплаты долей"
          description: "Конкретный срок оплаты долей так, как указан в договоре."
          required: true

        - name: "payment_deadline_compliance"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["within_limit", "exceeds_limit", "not_checkable"]
          display_in_grid: false
          description: "Соответствие указанного срока императивному 4-месячному лимиту (ст. 16 п. 1 ФЗ-14). Внутреннее enum-поле."
          required: true

        - name: "payment_method_code"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["money", "property", "securities", "rights", "mixed", "not_defined"]
          display_in_grid: false
          description: "Способ оплаты долей (код). Внутреннее enum-поле."
          required: true

        - name: "payment_method_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Способ оплаты"
          description: "Способ оплаты долей так, как указан в договоре."
          required: true

        - name: "per_founder_payment_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["common", "differentiated", "not_defined"]
          display_in_grid: false
          description: "Единый или дифференцированный порядок оплаты по учредителям. Внутреннее enum-поле."
          required: true

        - name: "per_founder_payment_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Порядок оплаты по учредителям"
          description: "Текст о порядке оплаты по учредителям (общий или персональный)."
          required: true

      store_payload: true

  - id: non_monetary_valuation_check
    name: "Оценка неденежного вклада и солидарно-субсидиарная ответственность (ст. 66.2 ГК РФ, ст. 15 ФЗ-14)"
    description: >
      Фактографическая проверка процедуры оценки неденежного вклада:
      привлечение независимого оценщика (обязательно при номинальной
      стоимости доли > 20 000 руб., ст. 15 п. 2 ФЗ-14), утверждение
      стоимости единогласным решением учредителей, непревышение
      стоимости вклада над оценкой оценщика. Дополнительно фиксируется
      упоминание в тексте солидарно-субсидиарной ответственности
      участников и оценщика (императивная норма, 3 года с момента
      госрегистрации).
    triggers:
      any: ["non_monetary_contribution"]
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "независимый оценщик"
        - "независимая оценка"
        - "отчёт об оценке"
        - "отчет об оценке"
        - "утверждение оценки"
        - "единогласное решение"
        - "единогласно"
        - "стоимость не может превышать"
        - "солидарно несут"
        - "субсидиарная ответственность"
        - "20 000"
        - "двадцать тысяч"
        - "3 года"
        - "три года"
        - "неденежный вклад"
      keyword_mode: "any"
      regex_patterns:
        - '(?i)независим(ый|ого|ым)\s+оценщик'
        - '(?i)солидарн(о|ая)\s+(несут|ответственност)'
        - '(?i)субсидиарн(ая|ой|ую)\s+ответственност'
        - '(?i)стоимость.*не\s+(может|должна)\s+превышать'
        - '(?i)(20\s*000|двадцат(и|ь)\s+тысяч)'

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по корпоративному праву. Анализируется договор
        об учреждении общества (ст. 66.2 п. 2 ГК РФ, ст. 15 п. 2 ФЗ-14
        «Об ООО»). Проверяется только один вопрос: содержит ли текст
        договора условия об оценке неденежного вклада.
        [ЗАДАЧА]
        Определи, содержит ли текст договора:
        1. Описание неденежного вклада (что именно вносится).
        2. Указание на привлечение независимого оценщика и его отчёт.
        3. Указание на утверждение стоимости единогласным решением
          учредителей.
        4. Упоминание солидарно-субсидиарной ответственности участников
          и оценщика за завышение стоимости.
        Верни вердикт:
        - "pass"    — описание вклада + оценщик + утверждение стоимости
                      указаны прямо.
        - "fail"    — условия о неденежном вкладе и его оценке отсутствуют.
        - "unclear" — данные частичны: указан вклад, но нет оценщика или
                      утверждения стоимости.
        [ПРАВИЛА]
        1. Используй только текст договора.
        2. Evidence — прямые цитаты из договора.
        3. Верни РОВНО один валидный JSON-объект со всеми 4 ключами
          (verdict, confidence, reason, evidence), пригодный для парсинга
          через json.loads без предварительной обработки. Без markdown,
          без ```json, без комментариев, без текста до или после.
          Начни ответ сразу с { и закончи }.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — условия определены:
        Фрагмент:
        "Иванов И.И. вносит неденежный вклад — исключительное право на
        программу для ЭВМ. Стоимость вклада определена независимым оценщиком
        ООО «Оценка+» (отчёт № 45 от 01.03.2026) в размере 50 000 рублей
        и утверждена единогласным решением учредителей. Учредители солидарно
        несут субсидиарную ответственность за завышение стоимости в течение
        3 лет с момента государственной регистрации Общества."
        Ответ:
        {
          "verdict": "pass",
          "confidence": 0.95,
          "reason": "Прямо указаны неденежный вклад, привлечение независимого оценщика с отчётом, единогласное утверждение стоимости и солидарно-субсидиарная ответственность.",
          "evidence": [
            {
              "clause_ref": "п. 3.3",
              "quote": "Иванов И.И. вносит неденежный вклад — исключительное право на программу для ЭВМ. Стоимость вклада определена независимым оценщиком ООО «Оценка+» в размере 500 000 рублей"
            }
          ]
        }
        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Учредители оплачивают доли денежными средствами."
        Ответ:
        {
          "verdict": "fail",
          "confidence": 0.92,
          "reason": "В тексте отсутствуют условия о неденежном вкладе и его оценке.",
          "evidence": []
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямое описание неденежного вклада?
        2. Есть ли прямое указание на независимого оценщика?
        3. Есть ли прямое указание на единогласное утверждение стоимости?
        4. Если хотя бы одного из пунктов нет — вердикт "unclear" или "fail".
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "verdict": "<pass / fail / unclear>",
          "confidence": <0.0–1.0>,
          "reason": "<краткое объяснение вердикта>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 500

    retrieval:
      retrieval_profile: "payment_terms_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "независимый оценщик независимая оценка отчёт об оценке утверждение стоимости единогласное решение стоимость не может превышать солидарно субсидиарная ответственность 3 года двадцать тысяч ст. 15 ФЗ-14 неденежный вклад"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "уставный капитал"
        - "доля учредителя"
        - "оплата доли"
        - "срок оплаты"
        - "солидарная ответственность учредителей до регистрации"
        - "корпоративный договор"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.15, 0.55]
        boost: 0.30
        scope: segment
      context_k: 5
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 900

      compact_output: false

      presence_signal:
        field: "non_monetary_valuation_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по корпоративному праву. Извлекаешь из договора
        об учреждении общества сведения об оценке неденежного вклада.
        Не анализируешь размер уставного капитала и общий порядок оплаты
        долей — эти темы проверяются отдельными чеками.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 9 полей + evidence (всего 10 ключей):

        0. non_monetary_valuation_check_presence:
          Агрегатное signal-поле — наличие регулирования по теме.
          - "present" — если valuation_compliance ≠ "not_applicable"
            И хотя бы одно из содержательных полей
            (non_monetary_contribution_status, independent_valuation_status,
              valuation_approval_status) ≠ "not_defined";
          - "missing" — если неденежный вклад в тексте отсутствует
            (non_monetary_contribution_status = "not_defined"
              и valuation_compliance = "not_applicable");
          - "unclear" — если фрагменты по теме есть, но из-за противоречий
            вывод невозможен.

          Если presence = "missing":
          - non_monetary_contribution_status = "not_defined";
          - independent_valuation_status = "not_defined";
          - valuation_approval_status = "not_defined";
          - subsidiary_liability_status = "not_defined";
          - valuation_compliance = "not_applicable";
          - все *_details = "Данные не определены";
          - не выполняй остальные шаги.

        1. non_monetary_contribution_status:
          - "defined" — если в тексте прямо указан неденежный вклад
            (имущество, ценные бумаги, права и т.п.);
          - "not_defined" — если неденежный вклад прямо не указан.

        2. non_monetary_contribution_details:
          Описание неденежного вклада так, как указано в тексте.
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".

        3. independent_valuation_status:
          - "defined" — если прямо указан независимый оценщик;
          - "not_defined" — если нет.

        4. independent_valuation_details:
          Сведения об оценке: кто оценил, номер и дата отчёта, сумма оценки.
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".

        5. valuation_approval_status:
          - "defined" — если прямо указано утверждение стоимости
            единогласным решением учредителей;
          - "not_defined" — если нет.

        6. valuation_approval_details:
          Процедура утверждения стоимости.
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".

        7. subsidiary_liability_status:
          - "defined" — если в тексте прямо упомянута солидарно-субсидиарная
            ответственность участников и оценщика за завышение стоимости;
          - "not_defined" — если нет.
          Отсутствие упоминания в договоре не является дефектом: норма
          ст. 15 п. 2 ФЗ-14 об ответственности участников и оценщика
          императивна и не требует дублирования в договоре. Это поле —
          информационное.

        8. subsidiary_liability_details:
          Текст об ответственности за завышение стоимости.
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".

        9. valuation_compliance:
          Сверка с императивными требованиями ст. 15 п. 2 ФЗ-14
          и ст. 66.2 п. 2 ГК РФ:
          - "compliant"        — неденежный вклад есть, при номинальной
                                  стоимости доли > 20 000 руб. привлечён
                                  независимый оценщик, стоимость утверждена
                                  единогласно, стоимость вклада не превышает
                                  оценку оценщика;
          - "missing_appraiser" — неденежный вклад > 20 000 руб., но
                                  независимый оценщик не указан;
          - "missing_approval" — оценщик есть, но стоимость не утверждена
                                  единогласным решением;
          - "exceeds_appraisal" — стоимость вклада превышает оценку
                                  оценщика;
          - "not_applicable"   — неденежный вклад в договоре отсутствует;
          - "not_checkable"    — недостаточно данных (нет ни суммы вклада,
                                  ни сведений об оценке).
          Важно: если номинальная стоимость доли, оплачиваемой неденежным
          вкладом, ≤ 20 000 руб. — привлечение независимого оценщика
          по ст. 15 ФЗ-14 НЕ обязательно; отсутствие оценщика в этом
          случае не влечёт "missing_appraiser".

        10. evidence — массив цитат из текста договора.
        </task>

        <context_rules>
        - Перед остальными полями заполни non_monetary_valuation_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Данные не определены", valuation_compliance = "not_applicable".
        - Используй только текст договора, без внешних знаний.
        - Не выводи требование оценки из нормы ст. 15 ФЗ-14 или ст. 66.2 ГК РФ — фиксируй только как указано в тексте. Норму используй ИСКЛЮЧИТЕЛЬНО для проверки соответствия (поле valuation_compliance).
        - Не путай "not_defined" и "not_applicable": not_applicable — только если условие неприменимо по природе сделки.
        - Состояния "partial" / "unclear" / "отсылка" отражай через value/details-поле; в status-полях допустимо только "defined" / "not_defined".
        - subsidiary_liability_status фиксирует ТОЛЬКО упоминание в тексте. Отсутствие в договоре не является дефектом: норма императивна и не требует дублирования.
        - Если status = "not_defined" — details = "Данные не определены".
        - Не используй пустые строки, "None", "null".
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие неденежного вклада.
          Все доли оплачиваются денежными средствами; неденежного вклада
          в договоре нет.
          → presence = "missing";
            non_monetary_contribution_status = "not_defined";
            independent_valuation_status = "not_defined";
            valuation_approval_status = "not_defined";
            subsidiary_liability_status = "not_defined";
            valuation_compliance = "not_applicable";
            все *_details = "Данные не определены".

        2. Неденежный вклад есть, но оценщик или утверждение стоимости
          не указаны.
          → presence = "present";
            non_monetary_contribution_status = "defined";
            independent_valuation_status = "not_defined"
              (или valuation_approval_status = "not_defined");
            valuation_compliance = "missing_appraiser"
              или "missing_approval".

        3. Стоимость вклада превышает оценку оценщика.
          → presence = "present";
            valuation_compliance = "exceeds_appraisal".

        4. Порог ≤ 20 000 руб.
          Номинальная стоимость доли, оплачиваемой неденежным вкладом,
          не превышает 20 000 руб.
          → independent_valuation_status может быть "not_defined";
            valuation_compliance = "compliant" (оценщик по закону
            не обязателен).
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для non_monetary_valuation_check_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined" или "not_defined".
        - Для valuation_compliance используй только: "compliant", "missing_appraiser", "missing_approval", "exceeds_appraisal", "not_applicable", "not_checkable".
        - Fallback при отсутствии данных: все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности: соответствующие *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "non_monetary_valuation_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по оценке неденежного вклада. Внутреннее агрегатное signal-поле."
          required: true

        - name: "non_monetary_contribution_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус наличия неденежного вклада. Внутреннее enum-поле."
          required: true

        - name: "non_monetary_contribution_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Неденежный вклад"
          description: "Описание неденежного вклада так, как указано в договоре."
          required: true

        - name: "independent_valuation_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания независимого оценщика. Внутреннее enum-поле."
          required: true

        - name: "independent_valuation_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Оценка вклада"
          description: "Сведения об оценщике и оценке неденежного вклада."
          required: true

        - name: "valuation_approval_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания процедуры утверждения стоимости. Внутреннее enum-поле."
          required: true

        - name: "valuation_approval_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Утверждение стоимости"
          description: "Процедура утверждения стоимости вклада."
          required: true

        - name: "subsidiary_liability_status"
          type: "string"
          presentation: "signal"
          risk_weight: "low"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус упоминания в тексте солидарно-субсидиарной ответственности (информационно, норма императивна). Внутреннее enum-поле."
          required: true

        - name: "subsidiary_liability_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Ответственность за завышение"
          description: "Текст о солидарно-субсидиарной ответственности участников и оценщика за завышение стоимости."
          required: true

        - name: "valuation_compliance"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["compliant", "missing_appraiser", "missing_approval", "exceeds_appraisal", "not_applicable", "not_checkable"]
          display_in_grid: false
          description: "Соответствие процедуры оценки императивным требованиям ст. 15 п. 2 ФЗ-14 / ст. 66.2 п. 2 ГК РФ. Внутреннее enum-поле."
          required: true

      store_payload: true

  - id: solidary_liability_check
    name: "Солидарно-субсидиарная ответственность учредителей до регистрации (ст. 89.1 п. 4 ГК РФ, ст. 11 п. 3 ФЗ-14)"
    description: >
      Фиксация в тексте договора об учреждении условий о солидарно-субсидиарной
      ответственности учредителей по обязательствам, связанным с созданием
      общества и возникшим до его государственной регистрации, а также о
      механизме последующего одобрения их действий обществом. Сверка с
      императивной нормой: отсутствие оговорки в договоре не является дефектом —
      норма применяется независимо от упоминания; риск создаёт искажение нормы
      (сужение круга обязательств, отказ от субсидиарности, ограничение суммы,
      указание иного органа одобрения).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "солидарная ответственность"
        - "солидарно несут"
        - "солидарно отвечают"
        - "субсидиарная ответственность"
        - "обязательства до регистрации"
        - "обязательства, связанные с созданием"
        - "до государственной регистрации"
        - "последующее одобрение"
        - "одобрение общим собранием"
      keyword_mode: "any"
      regex_patterns:
        - '(?i)солидарн(ая|ой|ую|о)\s+(несут|отвечают|ответственност)'
        - '(?i)солидарно\s+несут(\s+субсидиарную)?\s+ответственност'
        - '(?i)обязательств(а|ам|ами).*до\s+(государственной\s+)?регистраци'
        - '(?i)последующ(ее|его|ему)\s+одобрени'
        - '(?i)одобрени(е|я|ю|ем)\s+(их\s+)?действи'

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по корпоративному праву. Анализируется договор
        об учреждении общества (ст. 89.1 п. 4 ГК РФ, ст. 11 п. 3 ФЗ-14
        «Об ООО»). Проверяется только один вопрос: содержит ли текст договора
        условия о солидарно-субсидиарной ответственности учредителей по
        обязательствам, возникшим до госрегистрации, и о механизме
        последующего одобрения их действий обществом.
        [ЗАДАЧА]
        Определи, содержит ли текст договора:
        1. Условие о солидарной (солидарно-субсидиарной) ответственности
          учредителей по обязательствам, связанным с созданием общества
          и возникшим до госрегистрации.
        2. Указание объёма ответственности (все обязательства / ограниченный
          круг / ограничение суммы).
        3. Механизм последующего одобрения действий учредителей обществом
          после регистрации.
        Верни вердикт:
        - "pass"    — условие об ответственности воспроизведено в тексте
                      согласно норме; механизм одобрения указан.
        - "fail"    — в тексте есть оговорка, искажающая норму (сужение круга,
                      отказ от субсидиарности, ограничение суммы, иной орган
                      одобрения).
        - "unclear" — условие в тексте отсутствует, но норма ст. 89.1 п. 4
                      ГК РФ применяется императивно (это НЕ дефект, но и не
                      явное соответствие).
        [ПРАВИЛА]
        1. Используй только текст договора.
        2. Evidence — прямые цитаты из договора (пустой массив, если
          оговорка отсутствует).
        3. Верни РОВНО один валидный JSON-объект со всеми 4 ключами
          (verdict, confidence, reason, evidence), пригодный для парсинга
          через json.loads без предварительной обработки. Без markdown,
          без ```json, без комментариев, без текста до или после.
          Начни ответ сразу с { и закончи }.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — норма воспроизведена:
        Фрагмент:
        "Учредители солидарно несут субсидиарную ответственность по всем
        обязательствам, связанным с созданием Общества и возникшим до момента
        его государственной регистрации. Общество несет ответственность по
        обязательствам учредителей только в случае последующего одобрения
        их действий общим собранием участников Общества."
        Ответ:
        {
          "verdict": "pass",
          "confidence": 0.95,
          "reason": "Норма воспроизведена согласно ст. 89.1 п. 4 ГК РФ: солидарно-субсидиарная ответственность + одобрение общим собранием.",
          "evidence": [
            {
              "clause_ref": "п. 6.1",
              "quote": "Учредители солидарно несут субсидиарную ответственность по всем обязательствам, связанным с созданием Общества и возникшим до момента его государственной регистрации."
            }
          ]
        }
        Пример 2 — оговорка отсутствует:
        Фрагмент:
        "Учредители обязуются создать общество. Порядок оплаты долей
        определён в разделе 4."
        Ответ:
        {
          "verdict": "unclear",
          "confidence": 0.85,
          "reason": "Оговорка о солидарно-субсидиарной ответственности отсутствует; норма применяется императивно. Это не дефект, но и не явное соответствие.",
          "evidence": []
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли в тексте прямое условие об ответственности учредителей до госрегистрации?
        2. Указан ли объём обязательств?
        3. Указан ли механизм одобрения действий учредителей обществом?
        4. Если есть оговорка, но она искажает норму (сужение, отказ от
          субсидиарности, ограничение суммы, иной орган одобрения) — вердикт
          "fail".
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "verdict": "<pass / fail / unclear>",
          "confidence": <0.0–1.0>,
          "reason": "<краткое объяснение вердикта>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 550

    retrieval:
      retrieval_profile: "party_identification_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "солидарная ответственность солидарно несут субсидиарная ответственность обязательства до регистрации обязательства связанные с созданием до государственной регистрации последующее одобрение общее собрание ст. 89.1 ГК РФ ст. 11 ФЗ-14"
      preferred_unit_types:
        - liability_provision
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - limitations
        - boilerplate
        - obligations
      negative_keywords:
        - "уставный капитал"
        - "доля учредителя"
        - "оплата доли"
        - "неденежный вклад"
        - "оценка"
        - "завышение стоимости"
        - "корпоративный договор"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.30, 0.80]
        boost: 0.30
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "limitations"
        - "boilerplate"
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.15

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 500

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 800

      compact_output: false

      presence_signal:
        field: "solidary_liability_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по корпоративному праву. Извлекаешь из договора
        об учреждении общества сведения о солидарно-субсидиарной
        ответственности учредителей по обязательствам, возникшим до
        государственной регистрации (ст. 89.1 п. 4 ГК РФ, ст. 11 п. 3
        ФЗ-14 «Об ООО»), и о механизме последующего одобрения их действий
        обществом. Не анализируешь уставный капитал, порядок оплаты долей
        и оценку неденежного вклада — эти темы проверяются отдельными чеками.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 6 полей + evidence (всего 7 ключей):

        0. solidary_liability_check_presence:
          Агрегатное signal-поле — наличие в тексте договора оговорки об
          ответственности учредителей до госрегистрации.
          - "present" — если liability_basis ∈ {"explicit_in_contract",
                                                  "modified_by_contract"};
          - "missing" — если liability_basis = "statutory_implicit"
                        (оговорка отсутствует в тексте; норма применяется
                          императивно — это НЕ дефект);
          - "unclear" — если liability_basis = "not_checkable".

          Если presence = "missing":
          - liability_basis = "statutory_implicit";
          - pre_registration_liability_details = "Данные не определены";
          - pre_registration_scope_code = "not_defined";
          - post_registration_approval_status = "not_defined";
          - post_registration_approval_body_code = "not_defined";
          - post_registration_approval_details = "Данные не определены";
          - не выполняй остальные шаги.

        1. liability_basis — источник условия об ответственности:
          - "explicit_in_contract" — оговорка прямо воспроизведена в тексте
            (указана солидарная / солидарно-субсидиарная ответственность
            по всем обязательствам до регистрации без искажений);
          - "statutory_implicit" — оговорка отсутствует в тексте, но норма
            ст. 89.1 п. 4 ГК РФ применяется императивно (это НЕ дефект);
          - "modified_by_contract" — оговорка есть, но искажает норму:
            сужение круга обязательств, отказ от субсидиарности, ограничение
            суммы, иной орган одобрения и т. п.;
          - "not_checkable" — невозможно определить по тексту.

        2. pre_registration_liability_details:
          Текст оговорки об ответственности учредителей так, как указано
          в договоре.
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".

        3. pre_registration_scope_code:
          - "all_pre_registration" — ответственность по всем обязательствам
            до госрегистрации;
          - "limited_scope" — ограничен определённым кругом (только
            договорные, только связанные со строительством и т. п.);
          - "limited_amount" — ограничен суммой;
          - "not_defined" — объём прямо не определён.

        4. post_registration_approval_status:
          - "defined" — если прямо указан механизм последующего одобрения;
          - "not_defined" — если нет.

        5. post_registration_approval_body_code:
          - "general_meeting" — соответствует ст. 89.1 п. 4 ГК РФ (общее
            собрание участников);
          - "other_body" — иной орган (совет директоров, единоличный
            исполнительный орган и т. п.) — несоответствие норме;
          - "not_defined" — орган прямо не указан.

        6. post_registration_approval_details:
          Текст о механизме последующего одобрения.
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".

        7. evidence — массив цитат из текста договора (пустой, если оговорка
          отсутствует).
        </task>

        <context_rules>
        - Перед остальными полями заполни solidary_liability_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing" (это НЕ дефект); не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status/*_code = "not_defined", все *_details = "Данные не определены".
        - Используй только текст договора, без внешних знаний.
        - Не выводи оговорку из нормы ст. 89.1 п. 4 ГК РФ / ст. 11 п. 3 ФЗ-14 — фиксируй только как указано в тексте. Норму используй ИСКЛЮЧИТЕЛЬНО для классификации liability_basis и сверки органа одобрения.
        - Не путай "not_defined" и "not_applicable": not_applicable — только если условие неприменимо по природе сделки.
        - Состояния "partial" / "unclear" / "отсылка" отражай через value/details-поле; в status-полях допустимо только "defined" / "not_defined".
        - post_registration_approval_body_code = "general_meeting" только если прямо указано «общее собрание участников». Иные органы → "other_body".
        - Если status = "not_defined" — details = "Данные не определены".
        - Не используй пустые строки, "None", "null".
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
          В тексте нет ни оговорки об ответственности учредителей, ни
          упоминания о последующем одобрении.
          → presence = "missing";
            liability_basis = "statutory_implicit";
            pre_registration_scope_code = "not_defined";
            post_registration_approval_status = "not_defined";
            post_registration_approval_body_code = "not_defined";
            все *_details = "Данные не определены".
          ⚠️ Напоминание: это НЕ дефект — норма ст. 89.1 п. 4 ГК РФ
          применяется независимо от упоминания.

        2. Неполное раскрытие темы.
          Оговорка воспроизводит норму, но механизм последующего одобрения
          не указан.
          → presence = "present";
            liability_basis = "explicit_in_contract";
            post_registration_approval_status = "not_defined";
            post_registration_approval_body_code = "not_defined";
            post_registration_approval_details = "Данные не определены".

        3. Противоречие между фрагментами.
          В разных частях договора указаны разные органы одобрения
          или разные объёмы ответственности; конфликт нельзя разрешить
          по тексту.
          → presence = "unclear";
            liability_basis = "not_checkable";
            соответствующие *_details = "Не удалось определить".

        4. Искажение нормы договором.
          Оговорка есть, но изменяет норму: сужение круга обязательств,
          отказ от субсидиарности, ограничение суммы, иной орган одобрения.
          → presence = "present";
            liability_basis = "modified_by_contract";
            pre_registration_scope_code / post_registration_approval_body_code
              — по факту из текста.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для solidary_liability_check_presence используй только: "present", "missing", "unclear".
        - Для liability_basis используй только: "explicit_in_contract", "statutory_implicit", "modified_by_contract", "not_checkable".
        - Для pre_registration_scope_code используй только: "all_pre_registration", "limited_scope", "limited_amount", "not_defined".
        - Для post_registration_approval_status используй только: "defined", "not_defined".
        - Для post_registration_approval_body_code используй только: "general_meeting", "other_body", "not_defined".
        - Fallback при отсутствии данных: все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности: соответствующие *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "solidary_liability_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие в тексте договора оговорки о солидарно-субсидиарной ответственности учредителей. Внутреннее агрегатное signal-поле. Значение 'missing' фиксирует отсутствие оговорки в тексте; норма ст. 89.1 п. 4 ГК РФ применяется императивно, отсутствие оговорки не является дефектом."
          required: true

        - name: "liability_basis"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["explicit_in_contract", "statutory_implicit", "modified_by_contract", "not_checkable"]
          display_in_grid: true
          display_priority: 1
          description: "Источник условия об ответственности: воспроизведено / императивно по норме / искажено договором / неопределимо."
          required: true

        - name: "pre_registration_liability_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Солидарно-субсидиарная ответственность"
          description: "Текст оговорки об ответственности учредителей по обязательствам, возникшим до госрегистрации."
          required: true

        - name: "pre_registration_scope_code"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["all_pre_registration", "limited_scope", "limited_amount", "not_defined"]
          display_in_grid: false
          description: "Объём солидарно-субсидиарной ответственности учредителей. Внутреннее enum-поле."
          required: true

        - name: "post_registration_approval_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания механизма последующего одобрения действий учредителей обществом. Внутреннее enum-поле."
          required: true

        - name: "post_registration_approval_body_code"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["general_meeting", "other_body", "not_defined"]
          display_in_grid: false
          description: "Орган, одобряющий действия учредителей (по ст. 89.1 п. 4 ГК РФ — общее собрание участников). Внутреннее enum-поле."
          required: true

        - name: "post_registration_approval_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Одобрение обществом"
          description: "Текст о механизме последующего одобрения действий учредителей обществом."
          required: true

      store_payload: true

  - id: pre_incorporation_contracts_check
    name: "Предварительное одобрение и лимиты полномочий по договорам, заключённым до регистрации"
    description: >
      Фиксация договорных механизмов предварительного одобрения сделок,
      заключаемых учредителями от имени создаваемого (ещё не
      зарегистрированного) общества, тип одобрения (единогласие /
      большинство / уполномоченное лицо) и лимиты полномочий на их
      заключение. Механизм последующего одобрения действий учредителей
      обществом после регистрации (ст. 89.1 п. 4 ГК РФ, ст. 11 п. 3
      ФЗ-14) фиксируется отдельным чеком solidary_liability_check.
    triggers:
      any: ["pre_incorporation_contracts_context"]
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "договоры до регистрации"
        - "предварительное одобрение"
        - "от имени создаваемого общества"
        - "лимит полномочий"
        - "предел суммы"
        - "без предварительного одобрения"
        - "единогласное одобрение"
        - "большинством голосов"
      keyword_mode: "any"
      regex_patterns:
        - '(?i)договор(ы|ов|а)?\s+до\s+(государственной\s+)?регистраци'
        - '(?i)предварительн(ое|ого|ым)\s+одобрени'
        - '(?i)от\s+имени\s+создаваемого\s+обществ'
        - '(?i)лимит\s+полномочи'
        - '(?i)предел(ьная|ной)\s+сумм'

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по корпоративному праву. Анализируется договор
        об учреждении общества (ст. 89.1 п. 4 ГК РФ, ст. 11 п. 3 ФЗ-14
        «Об ООО»). Проверяется только один вопрос: содержит ли текст
        договора механизмы предварительного одобрения сделок, заключаемых
        учредителями от имени создаваемого общества, и лимиты полномочий
        на такие сделки.
        [ЗАДАЧА]
        Определи, содержит ли текст договора:
        1. Условие о необходимости предварительного одобрения договоров,
          заключаемых от имени создаваемого общества.
        2. Тип одобрения (единогласное / большинством / уполномоченным
          лицом).
        3. Лимит полномочий (максимальная сумма сделки без одобрения
          или порог, после которого одобрение требуется).
        Верни вердикт:
        - "pass"    — условие о предварительном одобрении указано прямо,
                      определён тип одобрения (и лимит, если применим).
        - "fail"    — механизм предварительного одобрения отсутствует
                      или прямо исключён.
        - "unclear" — механизм упомянут, но тип одобрения или лимит
                      неопределимы.
        [ПРАВИЛА]
        1. Используй только текст договора.
        2. Evidence — прямые цитаты из договора.
        3. Верни РОВНО один валидный JSON-объект со всеми 4 ключами
          (verdict, confidence, reason, evidence), пригодный для парсинга
          через json.loads без предварительной обработки. Без markdown,
          без ```json, без комментариев, без текста до или после.
          Начни ответ сразу с { и закончи }.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — механизм определён:
        Фрагмент:
        "Договоры, заключаемые от имени создаваемого Общества до его
        регистрации, подлежат предварительному единогласному одобрению
        всеми учредителями. Сделки на сумму свыше 500 000 рублей
        совершаются только с согласия всех учредителей."
        Ответ:
        {
          "verdict": "pass",
          "confidence": 0.95,
          "reason": "Прямо указаны механизм предварительного одобрения, тип одобрения (единогласное) и лимит полномочий.",
          "evidence": [
            {
              "clause_ref": "п. 7.1",
              "quote": "Договоры, заключаемые от имени создаваемого Общества до его регистрации, подлежат предварительному единогласному одобрению всеми учредителями."
            }
          ]
        }
        Пример 2 — механизм отсутствует:
        Фрагмент:
        "Учредители обязуются создать общество."
        Ответ:
        {
          "verdict": "fail",
          "confidence": 0.90,
          "reason": "В тексте отсутствуют механизм предварительного одобрения и лимит полномочий.",
          "evidence": []
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямое указание на необходимость предварительного одобрения?
        2. Указан ли тип одобрения (единогласие / большинство / уполномоченное лицо)?
        3. Указан ли лимит полномочий?
        4. Если механизм не указан — вердикт "fail". Если указан частично —
          "unclear".
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "verdict": "<pass / fail / unclear>",
          "confidence": <0.0–1.0>,
          "reason": "<краткое объяснение вердикта>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 500

    retrieval:
      retrieval_profile: "party_identification_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "договоры до регистрации предварительное одобрение от имени создаваемого общества лимит полномочий предел суммы единогласное одобрение большинством голосов уполномоченное лицо"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - procedures
        - obligations
      negative_keywords:
        - "уставный капитал"
        - "доля учредителя"
        - "оплата доли"
        - "неденежный вклад"
        - "оценка"
        - "солидарная ответственность"
        - "субсидиарная ответственность"
        - "корпоративный договор"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.35, 0.75]
        boost: 0.30
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "procedures"
        - "obligations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 700

      compact_output: false

      presence_signal:
        field: "pre_incorporation_contracts_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по корпоративному праву. Извлекаешь из
        договора об учреждении общества договорные механизмы
        предварительного одобрения сделок, заключаемых от имени
        создаваемого общества, тип одобрения и лимиты полномочий.
        Не анализируешь уставный капитал, порядок оплаты долей,
        неденежные вклады и последующую ответственность учредителей —
        эти темы проверяются отдельными чеками.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 6 полей + evidence (всего 7 ключей):

        0. pre_incorporation_contracts_check_presence:
          Агрегатное signal-поле — наличие регулирования по теме.
          - "present" — если pre_incorporation_clause_status = "defined"
            ИЛИ amount_limit_status = "defined";
          - "missing" — если pre_incorporation_clause_status = "not_defined"
            И amount_limit_status = "not_defined";
          - "unclear" — если фрагменты по теме есть, но из-за противоречий
            вывод невозможен.

          Если presence = "missing":
          - pre_incorporation_clause_status = "not_defined";
          - approval_mechanism_code = "not_defined";
          - amount_limit_status = "not_defined";
          - pre_incorporation_clause_details = "Данные не определены";
          - amount_limit_value = "Данные не определены";
          - approval_mechanism_details = "Данные не определены";
          - не выполняй остальные шаги.

        1. pre_incorporation_clause_status:
          - "defined" — если в тексте прямо указан механизм
            предварительного одобрения договоров, заключаемых от имени
            создаваемого общества;
          - "not_defined" — если нет.

        2. pre_incorporation_clause_details:
          Текст условия о механизме предварительного одобрения так, как
          указано в договоре.
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".

        3. approval_mechanism_code:
          - "unanimous"         — единогласное одобрение всеми
                                  учредителями («согласие всех учредителей»);
          - "majority"          — большинством голосов (простым или
                                  квалифицированным);
          - "authorized_person" — уполномоченное лицо / исполнительный
                                  орган / доверенное лицо / представитель
                                  учредителей;
          - "mixed"             — разные типы для разных категорий сделок;
          - "not_defined"       — тип прямо не указан.

        4. amount_limit_status:
          - "defined" — если прямо указан лимит полномочий / предельная
            сумма сделки;
          - "not_defined" — если нет.

        5. amount_limit_value:
          Значение лимита / предельной суммы так, как указано в договоре.
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".

        6. approval_mechanism_details:
          Развёрнутый текст о типе одобрения и лимитах полномочий так,
          как указано в договоре.
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".

        7. evidence — массив цитат из текста договора.
        </task>

        <context_rules>
        - Перед остальными полями заполни pre_incorporation_contracts_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status/*_code = "not_defined", все *_details/*_value = "Данные не определены".
        - Используй только текст договора, без внешних знаний.
        - Не выводи механизм одобрения из нормы ст. 89.1 п. 4 ГК РФ / ст. 11 п. 3 ФЗ-14 — фиксируй только договорные условия.
        - Не путай "not_defined" и "not_applicable": not_applicable — только если условие неприменимо по природе сделки.
        - Состояния "partial" / "unclear" / "отсылка" отражай через value/details-поле; в status-полях допустимо только "defined" / "not_defined".
        - Если в договоре прямо указано, что предварительное одобрение не требуется или исключено, — pre_incorporation_clause_status = "not_defined", pre_incorporation_clause_details содержит цитату об исключении.
        - Если status = "not_defined" — value/details = "Данные не определены".
        - Не используй пустые строки, "None", "null".
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
          В тексте нет ни механизма предварительного одобрения, ни лимитов
          полномочий.
          → presence = "missing";
            pre_incorporation_clause_status = "not_defined";
            approval_mechanism_code = "not_defined";
            amount_limit_status = "not_defined";
            все *_details/*_value = "Данные не определены".

        2. Неполное раскрытие.
          Механизм указан, но тип одобрения не определён.
          → presence = "present";
            pre_incorporation_clause_status = "defined";
            approval_mechanism_code = "not_defined".

        3. Противоречие между фрагментами.
          В разных частях договора указаны разные типы одобрения или разные
          лимиты; конфликт нельзя разрешить по тексту.
          → presence = "unclear";
            соответствующий *_status/*_code = "not_defined";
            соответствующий *_details/*_value = "Не удалось определить".

        4. Прямое исключение предварительного одобрения.
          В договоре прямо указано, что предварительное одобрение не
          требуется / осуществляется без предварительного одобрения.
          → presence = "present";
            pre_incorporation_clause_status = "not_defined";
            pre_incorporation_clause_details содержит цитату об исключении.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для pre_incorporation_contracts_check_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined", "not_defined".
        - Для approval_mechanism_code используй только: "unanimous", "majority", "authorized_person", "mixed", "not_defined".
        - Fallback при отсутствии данных: все *_details/*_value → "Данные не определены".
        - Fallback при противоречии или неоднозначности: соответствующие *_details/*_value → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "pre_incorporation_contracts_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие в договоре механизма предварительного одобрения предрегистрационных сделок. Внутреннее агрегатное signal-поле."
          required: true

        - name: "pre_incorporation_clause_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус наличия в договоре механизма предварительного одобрения предрегистрационных сделок. Внутреннее enum-поле."
          required: true

        - name: "pre_incorporation_clause_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Договоры до регистрации"
          description: "Текст условия о механизме предварительного одобрения сделок, заключаемых от имени создаваемого общества."
          required: true

        - name: "approval_mechanism_code"
          type: "string"
          presentation: "fact"
          allowed_values: ["unanimous", "majority", "authorized_person", "mixed", "not_defined"]
          display_in_grid: false
          description: "Тип предварительного одобрения сделок, заключаемых от имени создаваемого общества."
          required: true

        - name: "amount_limit_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания лимита полномочий / предельной суммы сделки. Внутреннее enum-поле."
          required: true

        - name: "amount_limit_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Лимит полномочий"
          description: "Значение лимита полномочий / предельной суммы сделки так, как указано в договоре."
          required: true

        - name: "approval_mechanism_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Механизм одобрения"
          description: "Развёрнутый текст о типе одобрения и лимитах полномочий."
          required: true

      store_payload: true

  - id: corporate_agreement_obligation_check
    name: "Обязательство заключить корпоративный договор после регистрации (ст. 67.2 ГК РФ, ст. 8.1 ФЗ-14, ст. 32.1 ФЗ-208, ст. 429 ГК РФ)"
    description: >
      Фиксация в договоре об учреждении обязательства учредителей заключить
      после государственной регистрации корпоративный договор (для ООО —
      соглашение об осуществлении прав участников по ст. 8.1 ФЗ-14, для АО —
      акционерное соглашение по ст. 32.1 ФЗ-208), перечня предварительно
      согласованных условий и срока заключения. Отсутствие указания срока
      при предварительном договоре влечёт применение годичного срока по
      ст. 429 п. 4 ГК РФ. Проверяется соответствие императивным требованиям
      ст. 67.2 п. 4 ГК РФ (единогласное заключение) и ст. 67.2 п. 5 ГК РФ
      (недопустимость условий, обязывающих голосовать по указаниям органов
      общества).
    triggers:
      any: ["corporate_agreement_planned"]
    ui_mode: "field_extraction"
    severity: "medium"
    severity_if_pass: "pass"
    severity_if_fail: "medium"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "корпоративный договор"
        - "акционерное соглашение"
        - "соглашение об осуществлении прав участников"
        - "обязуются заключить"
        - "обязательство заключить"
        - "предварительный договор"
        - "право требовать продажи доли"
        - "право присоединиться к продаже"
        - "право первого отказа"
        - "опцион на приобретение"
        - "опцион на продажу"
      keyword_mode: "any"
      regex_patterns:
        - '(?i)корпоративн(ый|ого|ому|ым)\s+договор'
        - '(?i)акционерн(ое|ого|ому)\s+соглашени'
        - '(?i)соглашени(е|я|ю)\s+об\s+осуществлени'
        - '(?i)обязу(ются|ется|емся)\s+заключить'
        - '(?i)предварительн(ый|ого|ому)\s+договор'
        - '(?i)право\s+(первого\s+отказа|требовать\s+продаж|присоединит)'

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по корпоративному праву. Анализируется договор
        об учреждении общества (ст. 67.2 ГК РФ, ст. 8.1 ФЗ-14 «Об ООО»,
        ст. 32.1 ФЗ-208 «Об АО», ст. 429 ГК РФ). Проверяется только один
        вопрос: содержит ли текст договора обязательство учредителей
        заключить после государственной регистрации корпоративный договор
        (соглашение об осуществлении прав участников / акционерное
        соглашение).
        [ЗАДАЧА]
        Определи, содержит ли текст договора:
        1. Обязательство заключить корпоративный договор после регистрации.
        2. Перечень предварительно согласованных условий такого договора.
        3. Срок заключения корпоративного договора.
        Верни вердикт:
        - "pass"    — обязательство заключить корпоративный договор указано
                      прямо, определён срок (или условия).
        - "fail"    — обязательство отсутствует.
        - "unclear" — обязательство упомянуто, но условия/срок неопределимы.
        [ПРАВИЛА]
        1. Используй только текст договора.
        2. Evidence — прямые цитаты из договора.
        3. Верни РОВНО один валидный JSON-объект со всеми 4 ключами
          (verdict, confidence, reason, evidence), пригодный для парсинга
          через json.loads без предварительной обработки. Без markdown,
          без ```json, без комментариев, без текста до или после.
          Начни ответ сразу с { и закончи }.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — обязательство определено:
        Фрагмент:
        "Учредители обязуются заключить корпоративный договор в течение
        30 дней после государственной регистрации Общества. Предварительно
        согласованы: порядок голосования, право требовать продажи доли,
        право присоединиться к продаже, право первого отказа."
        Ответ:
        {
          "verdict": "pass",
          "confidence": 0.95,
          "reason": "Прямо указано обязательство заключить корпоративный договор, определён срок (30 дней) и перечень условий.",
          "evidence": [
            {
              "clause_ref": "п. 8.1",
              "quote": "Учредители обязуются заключить корпоративный договор в течение 30 дней после государственной регистрации Общества."
            }
          ]
        }
        Пример 2 — обязательство отсутствует:
        Фрагмент:
        "Учредители обязуются создать общество."
        Ответ:
        {
          "verdict": "fail",
          "confidence": 0.90,
          "reason": "В тексте отсутствует обязательство заключить корпоративный договор.",
          "evidence": []
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямое обязательство заключить корпоративный договор?
        2. Указан ли срок его заключения?
        3. Перечислены ли предварительно согласованные условия?
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "verdict": "<pass / fail / unclear>",
          "confidence": <0.0–1.0>,
          "reason": "<краткое объяснение вердикта>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 500

    retrieval:
      retrieval_profile: "party_identification_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "корпоративный договор акционерное соглашение соглашение об осуществлении прав участников обязательство заключить предварительный договор право требовать продажи доли право присоединиться к продаже право первого отказа опцион на приобретение опцион на продажу срок заключения ст. 67.2 ГК РФ ст. 8.1 ФЗ-14 ст. 32.1 ФЗ-208 ст. 429 ГК РФ"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "уставный капитал"
        - "доля учредителя"
        - "оплата доли"
        - "неденежный вклад"
        - "оценка"
        - "солидарная ответственность"
        - "субсидиарная ответственность"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.50, 0.95]
        boost: 0.30
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.06
      confidence_penalty_on_excluded_segment: 0.08

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 800

      compact_output: false

      presence_signal:
        field: "corporate_agreement_obligation_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по корпоративному праву. Извлекаешь из
        договора об учреждении общества сведения об обязательстве учредителей
        заключить после государственной регистрации корпоративный договор
        (для ООО — соглашение об осуществлении прав участников по ст. 8.1
        ФЗ-14, для АО — акционерное соглашение по ст. 32.1 ФЗ-208),
        перечень предварительно согласованных условий и срок заключения.
        Не анализируешь уставный капитал, порядок оплаты долей, неденежные
        вклады и солидарно-субсидиарную ответственность — эти темы
        проверяются отдельными чеками.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 7 полей + evidence (всего 8 ключей):

        0. corporate_agreement_obligation_check_presence:
          Агрегатное signal-поле — наличие в тексте обязательства заключить
          корпоративный договор.
          - "present" — если corporate_agreement_obligation_status = "defined";
          - "missing" — если corporate_agreement_obligation_status = "not_defined"
                        и corporate_agreement_compliance = "not_applicable";
          - "unclear" — если corporate_agreement_compliance = "not_checkable".

          Если presence = "missing":
          - corporate_agreement_obligation_status = "not_defined";
          - key_terms_previewed_status = "not_defined";
          - deadline_for_conclusion_status = "not_defined";
          - corporate_agreement_compliance = "not_applicable";
          - corporate_agreement_obligation_details = "Данные не определены";
          - key_terms_previewed_details = "Данные не определены";
          - deadline_for_conclusion_details = "Данные не определены";
          - не выполняй остальные шаги.

        1. corporate_agreement_obligation_status:
          - "defined" — если в тексте прямо указано обязательство заключить
            корпоративный договор после регистрации;
          - "not_defined" — если нет.

        2. corporate_agreement_obligation_details:
          Текст обязательства так, как указано в договоре.
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".

        3. key_terms_previewed_status:
          - "defined" — если прямо перечислены предварительно согласованные
            условия корпоративного договора;
          - "not_defined" — если нет.

        4. key_terms_previewed_details:
          Перечень предварительно согласованных условий.
          Замена терминов (для нормализации):
          - "drag-along" → «право требовать продажи доли»;
          - "tag-along" → «право присоединиться к продаже»;
          - "call-опцион" → «опцион на приобретение»;
          - "put-опцион" → «опцион на продажу».
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".

        5. deadline_for_conclusion_status:
          - "defined" — если прямо указан срок заключения корпоративного
            договора;
          - "not_defined" — если нет.

        6. deadline_for_conclusion_details:
          Значение срока так, как указано в договоре.
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".

        7. corporate_agreement_compliance — соответствие императивным
          требованиям ст. 67.2 п. 4–5 ГК РФ:
          - "compliant"      — обязательство указано, тип заключения не
                                ограничен или указано единогласие, условия
                                не противоречат ст. 67.2 п. 5 ГК РФ;
          - "non_unanimous"  — прямо указано, что корпоративный договор
                                будет заключаться большинством голосов или
                                иным способом, кроме единогласия (ст. 67.2
                                п. 4 ГК РФ требует единогласия);
          - "invalid_terms"  — в перечне условий есть противоречащие
                                ст. 67.2 п. 5 ГК РФ (обязательство голосовать
                                по указаниям органов общества, определение
                                структуры органов, их компетенции);
          - "not_applicable" — обязательство заключить корпоративный
                                договор отсутствует;
          - "not_checkable"  — недостаточно данных.

        8. evidence — массив цитат из текста договора.
        </task>

        <context_rules>
        - Перед остальными полями заполни corporate_agreement_obligation_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", corporate_agreement_compliance = "not_applicable", все *_details = "Данные не определены".
        - Используй только текст договора, без внешних знаний.
        - Не выводи обязательство заключить корпоративный договор из нормы ст. 67.2 ГК РФ — фиксируй только как указано в тексте. Норму используй ИСКЛЮЧИТЕЛЬНО для проверки соответствия (поле corporate_agreement_compliance).
        - Не путай "not_defined" и "not_applicable": not_applicable — только если условие неприменимо по природе сделки.
        - Состояния "partial" / "unclear" / "отсылка" отражай через value/details-поле; в status-полях допустимо только "defined" / "not_defined".
        - Если в тексте указано обязательство заключить корпоративный договор, но срок не указан — deadline_for_conclusion_status = "not_defined". Не применяй автоматически годичный срок ст. 429 п. 4 ГК РФ — это только для сведения.
        - Если status = "not_defined" — details = "Данные не определены".
        - Не используй пустые строки, "None", "null".
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
          В тексте нет ни обязательства заключить корпоративный договор,
          ни перечня условий, ни срока.
          → presence = "missing";
            corporate_agreement_obligation_status = "not_defined";
            key_terms_previewed_status = "not_defined";
            deadline_for_conclusion_status = "not_defined";
            corporate_agreement_compliance = "not_applicable";
            все *_details = "Данные не определены".

        2. Неполное раскрытие темы.
          Обязательство заключить корпоративный договор есть, но перечень
          условий или срок не указаны.
          → presence = "present";
            corporate_agreement_obligation_status = "defined";
            key_terms_previewed_status / deadline_for_conclusion_status =
              "not_defined" по факту.

        3. Противоречие между фрагментами.
          В разных частях договора указаны разные сроки или разные условия
          заключения; конфликт нельзя разрешить по тексту.
          → presence = "unclear";
            corporate_agreement_compliance = "not_checkable";
            соответствующие *_details = "Не удалось определить".

        4. Искажение нормы договором.
          Обязательство есть, но: (а) указано, что корпоративный договор
          заключается большинством голосов; (б) предварительно согласованы
          условия, противоречащие ст. 67.2 п. 5 ГК РФ (например,
          обязательство голосовать по указаниям органов общества).
          → presence = "present";
            corporate_agreement_compliance = "non_unanimous"
              или "invalid_terms".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для corporate_agreement_obligation_check_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined", "not_defined".
        - Для corporate_agreement_compliance используй только: "compliant", "non_unanimous", "invalid_terms", "not_applicable", "not_checkable".
        - Fallback при отсутствии данных: все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности: соответствующие *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "corporate_agreement_obligation_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие в договоре обязательства заключить корпоративный договор после регистрации. Внутреннее агрегатное signal-поле."
          required: true

        - name: "corporate_agreement_obligation_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус наличия обязательства заключить корпоративный договор. Внутреннее enum-поле."
          required: true

        - name: "corporate_agreement_obligation_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Корпоративный договор"
          description: "Текст обязательства заключить корпоративный договор так, как указано в договоре."
          required: true

        - name: "key_terms_previewed_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус перечня предварительно согласованных условий. Внутреннее enum-поле."
          required: true

        - name: "key_terms_previewed_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Согласованные условия"
          description: "Перечень предварительно согласованных условий корпоративного договора."
          required: true

        - name: "deadline_for_conclusion_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания срока заключения корпоративного договора. Внутреннее enum-поле."
          required: true

        - name: "deadline_for_conclusion_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Срок заключения"
          description: "Срок заключения корпоративного договора так, как указано в договоре."
          required: true

        - name: "corporate_agreement_compliance"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["compliant", "non_unanimous", "invalid_terms", "not_applicable", "not_checkable"]
          display_in_grid: false
          description: "Соответствие императивным требованиям ст. 67.2 п. 4–5 ГК РФ. Внутреннее enum-поле."
          required: true

      store_payload: true

  - id: founder_withdrawal_check
    name: "Выход учредителя из процесса учреждения до регистрации (ст. 310, 450.1 ГК РФ)"
    description: >
      Фиксация в договоре об учреждении процедуры выхода учредителя из
      процесса учреждения (до государственной регистрации общества):
      порядок уведомления, срок, судьба доли и порядок возмещения расходов.
      Отказ от договора об учреждении до регистрации квалифицируется как
      односторонний отказ от исполнения обязательства или соглашение о
      расторжении (ст. 450, 450.1 ГК РФ) и допустим только если прямо
      предусмотрен договором или законом (ст. 310 ГК РФ). Не путать с
      выходом участника из ООО после регистрации (ст. 26 ФЗ-14) —
      другая правовая природа.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "medium"
    severity_if_pass: "pass"
    severity_if_fail: "medium"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "выход учредителя"
        - "отказ от участия в учреждении"
        - "односторонний отказ от договора"
        - "отказ от исполнения договора"
        - "расторжение договора по соглашению"
        - "письменное уведомление"
        - "распределение доли"
        - "возмещение расходов"
        - "последствия выхода"
      keyword_mode: "any"
      regex_patterns:
        - '(?i)выход(а|у)?\s+учредител'
        - '(?i)отказ\s+от\s+участи(я|е)\s+в\s+учреждени'
        - '(?i)односторонн(ий|его|ему)\s+отказ'
        - '(?i)отказ\s+от\s+исполнени(я|е)\s+договор'
        - '(?i)уведоми(в|ть|вши)\s+(друг(их|ого)|остальных)\s+учредител'

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по корпоративному праву. Анализируется договор
        об учреждении общества (ст. 310, 429, 450, 450.1 ГК РФ). Проверяется
        только один вопрос: содержит ли текст договора процедуру выхода
        учредителя из процесса учреждения до государственной регистрации.
        [ЗАДАЧА]
        Определи, содержит ли текст договора:
        1. Право учредителя выйти из процесса учреждения до регистрации.
        2. Порядок и срок уведомления о таком выходе.
        3. Порядок распределения прав и обязанностей выходящего учредителя
          между оставшимися.
        4. Порядок возмещения расходов, связанных с выходом.
        Верни вердикт:
        - "pass"    — процедура выхода указана прямо, определены уведомление
                      и последствия (судьба прав / возмещение расходов).
        - "fail"    — процедура выхода отсутствует.
        - "unclear" — процедура упомянута, но уведомление или последствия
                      неопределимы.
        [ПРАВИЛА]
        1. Используй только текст договора.
        2. Evidence — прямые цитаты из договора.
        3. Верни РОВНО один валидный JSON-объект со всеми 4 ключами
          (verdict, confidence, reason, evidence), пригодный для парсинга
          через json.loads без предварительной обработки. Без markdown,
          без ```json, без комментариев, без текста до или после.
          Начни ответ сразу с { и закончи }.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — процедура определена:
        Фрагмент:
        "Учредитель вправе выйти из процесса учреждения, уведомив остальных
        учредителей в письменной форме за 15 дней. Права и обязанности
        выходящего учредителя распределяются между оставшимися учредителями
        пропорционально их долям. Выходящий учредитель возмещает фактически
        понесённые остальными учредителями расходы."
        Ответ:
        {
          "verdict": "pass",
          "confidence": 0.95,
          "reason": "Прямо указаны право выхода, порядок и срок уведомления, распределение прав и возмещение расходов.",
          "evidence": [
            {
              "clause_ref": "п. 9.1",
              "quote": "Учредитель вправе выйти из процесса учреждения, уведомив остальных учредителей в письменной форме за 15 дней."
            }
          ]
        }
        Пример 2 — процедура отсутствует:
        Фрагмент:
        "Учредители обязуются создать общество."
        Ответ:
        {
          "verdict": "fail",
          "confidence": 0.90,
          "reason": "В тексте отсутствует процедура выхода учредителя из процесса учреждения.",
          "evidence": []
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямое указание права выхода / отказа от учреждения?
        2. Указан ли порядок и срок уведомления?
        3. Указаны ли последствия (судьба прав, возмещение расходов)?
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "verdict": "<pass / fail / unclear>",
          "confidence": <0.0–1.0>,
          "reason": "<краткое объяснение вердикта>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 500

    retrieval:
      retrieval_profile: "termination_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "выход учредителя отказ от участия односторонний отказ от договора отказ от исполнения договора расторжение по соглашению уведомление распределение доли возмещение расходов последствия выхода ст. 310 ст. 450.1 ГК РФ"
      preferred_unit_types:
        - termination_provision
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - remedies
        - procedures
      negative_keywords:
        - "уставный капитал"
        - "оплата доли"
        - "неденежный вклад"
        - "оценка"
        - "солидарная ответственность"
        - "субсидиарная ответственность"
        - "корпоративный договор"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.50, 0.95]
        boost: 0.30
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "remedies"
        - "procedures"
      confidence_bonus_on_match: 0.06
      confidence_penalty_on_excluded_segment: 0.08

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 500

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 900

      compact_output: false

      presence_signal:
        field: "founder_withdrawal_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по корпоративному праву. Извлекаешь из
        договора об учреждении общества процедуру выхода учредителя из
        процесса учреждения до государственной регистрации: уведомление,
        срок, судьбу доли и порядок возмещения расходов. Не анализируешь
        уставный капитал, порядок оплаты долей, оценку неденежных вкладов
        и солидарно-субсидиарную ответственность — эти темы проверяются
        отдельными чеками.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 9 полей + evidence (всего 10 ключей):

        0. founder_withdrawal_check_presence:
          Агрегатное signal-поле — наличие в тексте процедуры выхода
          учредителя из процесса учреждения.
          - "present" — если withdrawal_clause_status = "defined";
          - "missing" — если withdrawal_clause_status = "not_defined"
                        и withdrawal_compliance = "not_applicable";
          - "unclear" — если withdrawal_compliance = "not_checkable".

          Если presence = "missing":
          - withdrawal_clause_status = "not_defined";
          - notification_period_status = "not_defined";
          - share_redistribution_status = "not_defined";
          - expense_reimbursement_status = "not_defined";
          - withdrawal_compliance = "not_applicable";
          - все *_details = "Данные не определены";
          - не выполняй остальные шаги.

        1. withdrawal_clause_status:
          - "defined" — если прямо указано право выхода учредителя из
            процесса учреждения;
          - "not_defined" — если нет.

        2. withdrawal_clause_details:
          Текст процедуры выхода так, как указано в договоре.
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".

        3. notification_period_status:
          - "defined" — если прямо указан срок уведомления;
          - "not_defined" — если нет.

        4. notification_period_details:
          Значение срока уведомления так, как указано в договоре.
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".

        5. share_redistribution_status:
          - "defined" — если прямо указан порядок распределения прав /
            доли выходящего учредителя;
          - "not_defined" — если нет.

        6. share_redistribution_details:
          Текст о распределении прав / доли.
          Терминологическая нормализация: «распределение доли» →
          «распределение прав и обязанностей по договору об учреждении»
          (до регистрации «доли» как объекта нет).
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".

        7. expense_reimbursement_status:
          - "defined" — если прямо указан порядок возмещения расходов;
          - "not_defined" — если нет.

        8. expense_reimbursement_details:
          Текст о возмещении расходов.
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".

        9. withdrawal_compliance — правомерность одностороннего отказа
          по ст. 310 и ст. 450.1 ГК РФ:
          - "compliant"              — отказ прямо предусмотрен договором
                                        или реализуется по соглашению сторон;
          - "unilateral_not_allowed" — отказ фактически допускается, но
                                        договорного основания для
                                        одностороннего отказа нет;
          - "not_applicable"         — процедура выхода отсутствует;
          - "not_checkable"          — недостаточно данных.

        10. evidence — массив цитат из текста договора.
        </task>

        <context_rules>
        - Перед остальными полями заполни founder_withdrawal_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", withdrawal_compliance = "not_applicable", все *_details = "Данные не определены".
        - Используй только текст договора, без внешних знаний.
        - Не выводи процедуру выхода из нормы — фиксируй только как указано в тексте. Норму используй ИСКЛЮЧИТЕЛЬНО для классификации withdrawal_compliance.
        - Не путай "not_defined" и "not_applicable": not_applicable — только если условие неприменимо по природе сделки.
        - Состояния "partial" / "unclear" / "отсылка" отражай через value/details-поле; в status-полях допустимо только "defined" / "not_defined".
        - Не путай предрегистрационный выход с выходом участника из ООО после регистрации (ст. 26 ФЗ-14) — это разные правовые конструкции; в этом чеке фиксируется только предрегистрационный выход.
        - Если status = "not_defined" — details = "Данные не определены".
        - Не используй пустые строки, "None", "null".
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие процедуры выхода.
          В тексте нет ни права выхода, ни порядка уведомления, ни
          последствий.
          → presence = "missing";
            withdrawal_clause_status = "not_defined";
            notification_period_status = "not_defined";
            share_redistribution_status = "not_defined";
            expense_reimbursement_status = "not_defined";
            withdrawal_compliance = "not_applicable";
            все *_details = "Данные не определены".

        2. Неполное раскрытие процедуры.
          Право выхода есть, но срок уведомления / судьба доли / возмещение
          расходов не указаны.
          → presence = "present";
            withdrawal_clause_status = "defined";
            соответствующие *_status = "not_defined" по факту.

        3. Противоречие между фрагментами.
          В разных частях договора указаны разные сроки уведомления
          или разные условия выхода; конфликт нельзя разрешить по тексту.
          → presence = "unclear";
            соответствующий *_status = "not_defined";
            соответствующий *_details = "Не удалось определить".

        4. Неоднозначное основание одностороннего отказа.
          Формулировка «вправе выйти в любой момент» без прямого указания
          на односторонний отказ или порядок расторжения.
          → presence = "present";
            withdrawal_clause_status = "defined";
            withdrawal_compliance = "unilateral_not_allowed".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для founder_withdrawal_check_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined", "not_defined".
        - Для withdrawal_compliance используй только: "compliant", "unilateral_not_allowed", "not_applicable", "not_checkable".
        - Fallback при отсутствии данных: все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности: соответствующие *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "founder_withdrawal_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие в договоре процедуры выхода учредителя до регистрации. Внутреннее агрегатное signal-поле."
          required: true

        - name: "withdrawal_clause_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус наличия в договоре процедуры выхода учредителя. Внутреннее enum-поле."
          required: true

        - name: "withdrawal_clause_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Выход учредителя"
