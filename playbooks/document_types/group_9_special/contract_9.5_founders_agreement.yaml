        Фрагмент:
        "Каждый учредитель обязан оплатить свою долю в уставном капитале
        денежными средствами не позднее 3 месяцев с даты государственной
        регистрации Общества."
        Ответ:
        {
          "payment_deadline_status": "defined",
          "payment_deadline_value": "не позднее 3 месяцев с даты государственной регистрации",
          "payment_method_code": "money",
          "payment_method_details": "денежными средствами",
          "per_founder_payment_status": "defined",
          "per_founder_payment_details": "каждый учредитель обязан оплатить свою долю",
          "evidence": [
            {
              "clause_ref": "п. 4.1",
              "quote": "Каждый учредитель обязан оплатить свою долю в уставном капитале денежными средствами не позднее 3 месяцев с даты государственной регистрации Общества."
            }
          ]
        }
        Пример 2:
        Фрагмент:
        "Учредители оплачивают доли в порядке, предусмотренном законодательством."
        Ответ:
        {
          "payment_deadline_status": "not_defined",
          "payment_deadline_value": "Данные не определены",
          "payment_method_code": "not_defined",
          "payment_method_details": "Данные не определены",
          "per_founder_payment_status": "not_defined",
          "per_founder_payment_details": "Данные не определены",
          "evidence": []
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату со сроком оплаты.
        2. Найди прямую цитату со способом оплаты.
        3. Найди прямую цитату об оплате каждым учредителем.
        4. Если прямой цитаты нет — верни "not_defined". Не додумывай.
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "payment_deadline_status": "<defined / not_defined>",
          "payment_deadline_value": "<срок или 'Данные не определены'>",
          "payment_method_code": "<money / property / rights / mixed / not_defined>",
          "payment_method_details": "<текст или 'Данные не определены'>",
          "per_founder_payment_status": "<defined / not_defined>",
          "per_founder_payment_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 500

