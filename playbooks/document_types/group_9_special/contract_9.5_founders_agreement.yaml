        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Данные не определены".
        - Используй только текст договора.
        - director_election: ищи кандидатуру ЕИО («Генеральным директором назначается Петров П.П.») или правила его избрания решением об учреждении.
        - unanimous_decision: ищи формулировки «единогласно», «всеми учредителями единогласно», «100% голосов учредителей». Обычно касается устава, оценки неденежных долей, утверждения денежной оценки.
        - Если в тексте дана общая формулировка «все ключевые решения принимаются единогласно» без перечня, фиксируй unanimous_decision_status = "defined" с цитатой.
        - Не используй пустые строки, "None", "null".
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
          В тексте нет ни кандидатуры директора / порядка избрания,
          ни перечня единогласных решений.
          → presence = "missing";
            director_election_status = "not_defined";
            unanimous_decision_status = "not_defined";
            все *_details = "Данные не определены".

        2. Неполное раскрытие темы.
          Согласована кандидатура директора, но перечень единогласных
          решений отсутствует (или наоборот).
          → presence = "present";
            соответствующий *_status = "defined" / "not_defined" по факту.

        3. Противоречие между фрагментами.
          В разных частях указаны разные кандидатуры директора
          или разные перечни единогласных решений; конфликт нельзя
          разрешить по тексту.
          → presence = "unclear";
            соответствующий *_status = "not_defined";
            соответствующий *_details = "Не удалось определить".

        4. Общая формулировка о единогласии без перечня.
          «Все ключевые решения принимаются единогласно» без указания
          конкретных вопросов.
          → presence = "present";
            unanimous_decision_status = "defined";
            unanimous_decision_details содержит цитату из текста.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для director_and_unanimous_decisions_check_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined", "not_defined".
        - Fallback при отсутствии данных: все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности: соответствующие *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "director_and_unanimous_decisions_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по избранию директора и единогласным решениям. Внутреннее агрегатное signal-поле."
          required: true

        - name: "director_election_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус согласования кандидатуры директора / ЕИО или порядка его избрания. Внутреннее enum-поле."
          required: true

        - name: "director_election_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Избрание директора"
          description: "Условия о кандидатуре генерального директора и процедуре его избрания учредителями."
          required: true

        - name: "unanimous_decision_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус перечня вопросов, требующих 100% единогласия учредителей. Внутреннее enum-поле."
          required: true

        - name: "unanimous_decision_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Единогласные решения"
          description: "Перечень корпоративных вопросов, требующих единогласного одобрения всеми учредителями."
          required: true

      store_payload: true

  - id: contract_term_post_registration_check
    name: "Срок действия договора об учреждении и положения, сохраняющие силу после регистрации (ст. 89.1 п. 3 ГК РФ, ст. 11 п. 3 ФЗ-14, ст. 9 п. 1 ФЗ-208)"
    description: >
      Фиксация в договоре об учреждении срока действия, указания на
      прекращение действия после государственной регистрации общества и
      перечня положений, сохраняющих силу после регистрации. Для ООО
      внутренние отношения после регистрации регулируются уставом
      (ст. 89.1 п. 3 ГК РФ); для АО договор о создании императивно
      утрачивает силу с момента государственной регистрации (ст. 9 п. 1
      ФЗ-208). Проверяется соответствие условия договора применимому
      режиму ОПФ.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "medium"
    severity_if_pass: "pass"
    severity_if_fail: "medium"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "срок действия"
        - "действует до регистрации"
        - "до момента государственной регистрации"
        - "утрачивает силу после регистрации"
        - "прекращает действие"
        - "сохраняют силу после регистрации"
        - "действуют после регистрации"
        - "после прекращения договора"
        - "survival"
      keyword_mode: "any"
      regex_patterns:
        - '(?i)действует\s+до\s+(момента\s+)?регистраци'
        - '(?i)утрачивает\s+силу\s+(после|с\s+момента)'
        - '(?i)(сохран|действ)(яют|уют)\s+(силу\s+)?(после|с\s+момента)\s+регистраци'
        - '(?i)после\s+прекращени(я|е)\s+договор'

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по корпоративному праву. Анализируется договор
        об учреждении общества (ст. 89.1 п. 3 ГК РФ, ст. 11 п. 3 ФЗ-14
        «Об ООО», ст. 9 п. 1 ФЗ-208 «Об АО»). Проверяется только один
        вопрос: содержит ли текст договора условия о сроке действия, о
        прекращении действия после государственной регистрации и о
        положениях, сохраняющих силу после регистрации.
        [ЗАДАЧА]
        Определи, содержит ли текст договора:
        1. Срок действия договора.
        2. Указание на прекращение действия после государственной регистрации.
        3. Перечень положений, сохраняющих силу после регистрации
          (например, конфиденциальность, разрешение споров, расчёты).
        Верни вердикт:
        - "pass"    — указан срок действия, механизм прекращения и/или
                      перечень сохраняющихся положений.
        - "fail"    — ни срок, ни порядок прекращения, ни сохраняющиеся
                      положения в тексте не указаны.
        - "unclear" — часть условий указана, часть отсутствует.
        [ПРАВИЛА]
        1. Используй только текст договора.
        2. Evidence — прямые цитаты из договора.
        3. Верни РОВНО один валидный JSON-объект со всеми 4 ключами
          (verdict, confidence, reason, evidence), пригодный для парсинга
          через json.loads без предварительной обработки. Без markdown,
          без ```json, без комментариев, без текста до или после.
          Начни ответ сразу с { и закончи }.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — условия определены:
        Фрагмент:
        "Настоящий договор действует до момента государственной регистрации
        Общества и утрачивает силу после регистрации. Положения о
        конфиденциальности и порядке разрешения споров сохраняют силу после
        регистрации."
        Ответ:
        {
          "verdict": "pass",
          "confidence": 0.95,
          "reason": "Прямо указаны срок действия, прекращение после регистрации и перечень сохраняющихся положений.",
          "evidence": [
            {
              "clause_ref": "п. 10.1",
              "quote": "Настоящий договор действует до момента государственной регистрации Общества и утрачивает силу после регистрации."
            }
          ]
        }
        Пример 2 — условия отсутствуют:
        Фрагмент:
        "Учредители обязуются создать общество."
        Ответ:
        {
          "verdict": "fail",
          "confidence": 0.90,
          "reason": "В тексте отсутствуют срок действия, механизм прекращения и перечень сохраняющихся положений.",
          "evidence": []
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямое указание срока действия?
        2. Есть ли прямое указание на прекращение после регистрации?
        3. Есть ли перечень положений, сохраняющих силу после регистрации?
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "verdict": "<pass / fail / unclear>",
          "confidence": <0.0–1.0>,
          "reason": "<краткое объяснение вердикта>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 500

    retrieval:
      retrieval_profile: "term_and_renewal_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "срок действия действует до регистрации до момента государственной регистрации утрачивает силу после регистрации прекращает действие сохраняют силу после регистрации действуют после регистрации после прекращения договора конфиденциальность разрешение споров ст. 89.1 ГК РФ ст. 11 ФЗ-14 ст. 9 ФЗ-208"
      preferred_unit_types:
        - general_provision
        - termination_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - boilerplate
        - procedures
      negative_keywords:
        - "уставный капитал"
        - "оплата доли"
        - "неденежный вклад"
        - "оценка"
        - "солидарная ответственность"
        - "субсидиарная ответственность"
        - "корпоративный договор"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.65, 1.0]
        boost: 0.30
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "boilerplate"
        - "procedures"
      confidence_bonus_on_match: 0.06
      confidence_penalty_on_excluded_segment: 0.08

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 550

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 900

      compact_output: false

      presence_signal:
        field: "contract_term_post_registration_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по корпоративному праву. Извлекаешь из
        договора об учреждении общества срок действия, порядок прекращения
        после регистрации и перечень положений, сохраняющих силу после
        регистрации. Проверяешь соответствие указанного режима
        применимой норме: для ООО — ст. 89.1 п. 3 ГК РФ (после регистрации
        внутренние отношения регулируются уставом), для АО — ст. 9 п. 1
        ФЗ-208 (договор утрачивает силу с момента регистрации). Не
        анализируешь уставный капитал, порядок оплаты долей, оценку
        неденежных вкладов и солидарно-субсидиарную ответственность —
        эти темы проверяются отдельными чеками.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 7 полей + evidence (всего 8 ключей):

        0. contract_term_post_registration_check_presence:
          Агрегатное signal-поле — наличие регулирования по теме.
          - "present" — если хотя бы одно из содержательных полей
            (contract_term_status, post_registration_termination_status,
              post_registration_provisions_status) ≠ "not_defined"
            ИЛИ post_registration_regime_compliance ≠ "not_checkable";
          - "missing" — если все три содержательных поля = "not_defined"
            И compliance = "not_checkable";
          - "unclear" — если фрагменты по теме есть, но из-за противоречий
            вывод невозможен.

          Если presence = "missing":
          - contract_term_status = "not_defined";
          - post_registration_termination_status = "not_defined";
          - post_registration_provisions_status = "not_defined";
          - post_registration_regime_compliance = "not_checkable";
          - contract_term_details = "Данные не определены";
          - post_registration_termination_details = "Данные не определены";
          - post_registration_provisions_details = "Данные не определены";
          - не выполняй остальные шаги.

        1. contract_term_status:
          - "defined" — если в тексте прямо указан срок действия договора;
          - "not_defined" — если нет.

        2. contract_term_details:
          Текст условия о сроке действия так, как указано в договоре.
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".

        3. post_registration_termination_status:
          - "defined" — если прямо указано прекращение действия после
            регистрации;
          - "not_defined" — если нет.

        4. post_registration_termination_details:
          Текст о прекращении действия после регистрации.
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".

        5. post_registration_provisions_status:
          - "defined" — если прямо указан перечень положений, сохраняющих
            силу после регистрации;
          - "not_defined" — если нет.

        6. post_registration_provisions_details:
          Перечень положений, сохраняющих силу после регистрации.
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".

        7. post_registration_regime_compliance — соответствие применимой
          норме:
          - "compliant_ao"              — ОПФ = АО, указано прекращение
                                          действия договора после регистрации
                                          (ст. 9 п. 1 ФЗ-208);
          - "compliant_ooo"             — ОПФ = ООО, указано сохранение
                                          силы только в части предрегистрационных
                                          обязательств / переход на устав
                                          (ст. 89.1 п. 3 ГК РФ);
          - "contradicts_ao_rule"       — ОПФ = АО, но указано сохранение
                                          силы договора после регистрации;
          - "contradicts_ooo_rule"      — ОПФ = ООО, но указано, что
                                          договор продолжает регулировать
                                          внутренние отношения после
                                          регистрации;
          - "not_checkable"             — недостаточно данных (ОПФ или
                                          режим не указаны).
          Если ОПФ в тексте прямо не указана, но по контексту (наименование
          общества, ссылки на нормы) можно достоверно определить — фиксируй
          соответствующую классификацию. Если нет — "not_checkable".

        8. evidence — массив цитат из текста договора.
        </task>

        <context_rules>
        - Перед остальными полями заполни contract_term_post_registration_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", post_registration_regime_compliance = "not_checkable", все *_details = "Данные не определены".
        - Используй только текст договора, без внешних знаний.
        - Не выводи условия о сроке из нормы — фиксируй только как указано в тексте. Норму используй ИСКЛЮЧИТЕЛЬНО для классификации post_registration_regime_compliance.
        - Не путай "not_defined" и "not_applicable": not_applicable — только если условие неприменимо по природе сделки.
        - Состояния "partial" / "unclear" / "отсылка" отражай через value/details-поле; в status-полях допустимо только "defined" / "not_defined".
        - Если status = "not_defined" — details = "Данные не определены".
        - Не используй пустые строки, "None", "null".
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
          В тексте нет ни срока действия, ни механизма прекращения,
          ни сохраняющихся положений.
          → presence = "missing";
            contract_term_status = "not_defined";
            post_registration_termination_status = "not_defined";
            post_registration_provisions_status = "not_defined";
            post_registration_regime_compliance = "not_checkable";
            все *_details = "Данные не определены".

        2. Неполное раскрытие темы.
          Срок действия указан, но механизм прекращения после регистрации
          не указан.
          → presence = "present";
            contract_term_status = "defined";
            post_registration_termination_status = "not_defined".

        3. Противоречие между фрагментами.
          В разных частях указаны разные сроки или разные режимы
          после регистрации; конфликт нельзя разрешить по тексту.
          → presence = "unclear";
            соответствующий *_status = "not_defined";
            соответствующий *_details = "Не удалось определить".

        4. Противоречие применимой норме.
          (а) ОПФ = ООО, но указано, что договор продолжает регулировать
              внутренние отношения после регистрации;
          (б) ОПФ = АО, но указано сохранение силы договора после
              регистрации.
          → presence = "present";
            post_registration_regime_compliance = "contradicts_ooo_rule"
              или "contradicts_ao_rule".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для contract_term_post_registration_check_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined", "not_defined".
        - Для post_registration_regime_compliance используй только: "compliant_ao", "compliant_ooo", "contradicts_ao_rule", "contradicts_ooo_rule", "not_checkable".
        - Fallback при отсутствии данных: все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности: соответствующие *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "contract_term_post_registration_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по сроку действия и положениям после регистрации. Внутреннее агрегатное signal-поле."
          required: true

        - name: "contract_term_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания срока действия договора об учреждении. Внутреннее enum-поле."
          required: true

        - name: "contract_term_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Срок действия"
          description: "Текст условия о сроке действия договора об учреждении."
          required: true

        - name: "post_registration_termination_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания прекращения действия договора после регистрации. Внутреннее enum-поле."
          required: true

        - name: "post_registration_termination_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Прекращение после регистрации"
          description: "Текст о прекращении действия договора после регистрации."
          required: true

        - name: "post_registration_provisions_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания положений, сохраняющих силу после регистрации. Внутреннее enum-поле."
          required: true

        - name: "post_registration_provisions_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Положения после регистрации"
          description: "Перечень положений, сохраняющих силу после регистрации."
          required: true

        - name: "post_registration_regime_compliance"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["compliant_ao", "compliant_ooo", "contradicts_ao_rule", "contradicts_ooo_rule", "not_checkable"]
          display_in_grid: false
          description: "Соответствие режима договора после регистрации применимой норме (ст. 89.1 п. 3 ГК РФ для ООО, ст. 9 п. 1 ФЗ-208 для АО). Внутреннее enum-поле."
          required: true

      store_payload: true

  - id: foreign_founder_check
    name: "Специальные требования для иностранного учредителя (ФЗ-129, Гаагская конвенция 1961, Минская конвенция 1993, ст. 1202–1203 ГК РФ)"
    description: >
      Фиксация соблюдения специальных требований при наличии иностранного
      учредителя: определение режима легализации документов (апостиль по
      Гаагской конвенции 1961 / консульская легализация / упрощённый режим
      СНГ по Минской конвенции 1993 / двусторонний договор о правовой
      помощи), наличие нотариального перевода на русский язык, выписки из
      торгового реестра и её актуальности на дату подачи документов.
      Не покрывает отдельно процедуру получения предварительного согласия
      Правительственной комиссии по ФЗ-160 (стратегические отрасли) —
      фиксируется отдельным чеком.
    triggers:
      any: ["foreign_founder"]
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "апостиль"
        - "легализация"
        - "консульская легализация"
        - "нотариальный перевод"
        - "иностранное юридическое лицо"
        - "иностранный учредитель"
        - "нерезидент"
        - "выписка из торгового реестра"
        - "торговый реестр"
        - "Минская конвенция"
        - "Гаагская конвенция"
      keyword_mode: "any"
      regex_patterns:
        - '(?i)(апостиль|апостилир)'
        - '(?i)легализаци(я|и|ю)'
        - '(?i)нотариальн(ый|ого|ым)\s+перевод'
        - '(?i)торгов(ый|ого)\s+реестр'
        - '(?i)(Минск|Гааг|Кишинёв)ск(ая|ой)\s+конвенци'

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по корпоративному праву. Анализируется договор
        об учреждении общества с иностранным учредителем (ФЗ-129, Гаагская
        конвенция 1961, Минская конвенция 1993, ст. 1202–1203 ГК РФ).
        Проверяется только один вопрос: содержит ли текст договора условия
        о легализации документов иностранного учредителя, нотариальном
        переводе и выписке из торгового реестра.
        [ЗАДАЧА]
        Определи, содержит ли текст договора:
        1. Указание на иностранного учредителя.
        2. Режим легализации документов (апостиль / консульская легализация /
          упрощённый режим СНГ без легализации / двусторонний договор).
        3. Указание на нотариальный перевод документов на русский язык.
        4. Указание на выписку из торгового реестра и её актуальность.
        Верни вердикт:
        - "pass"    — указаны иностранный учредитель, режим легализации,
                      нотариальный перевод и выписка из реестра.
        - "fail"    — в тексте нет упоминания иностранного учредителя.
        - "unclear" — часть требований указана, часть отсутствует.
        [ПРАВИЛА]
        1. Используй только текст договора.
        2. Evidence — прямые цитаты из договора.
        3. Верни РОВНО один валидный JSON-объект со всеми 4 ключами
          (verdict, confidence, reason, evidence), пригодный для парсинга
          через json.loads без предварительной обработки. Без markdown,
          без ```json, без комментариев, без текста до или после.
          Начни ответ сразу с { и закончи }.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — Hague-режим, документы легализованы:
        Фрагмент:
        "Учредитель — Company Ltd (Великобритания). Документы учредителя
        апостилированы, имеют нотариально заверенный перевод на русский
        язык. Выписка из торгового реестра от 15.02.2026 прилагается."
        Ответ:
        {
          "verdict": "pass",
          "confidence": 0.95,
          "reason": "Прямо указаны иностранный учредитель, апостиль, нотариальный перевод и выписка из торгового реестра.",
          "evidence": [
            {
              "clause_ref": "преамбула",
              "quote": "Документы учредителя апостилированы, имеют нотариально заверенный перевод на русский язык."
            }
          ]
        }
        Пример 2 — иностранный учредитель отсутствует:
        Фрагмент:
        "Учредители — Иванов И.И. и Петров П.П."
        Ответ:
        {
          "verdict": "fail",
          "confidence": 0.90,
          "reason": "В тексте отсутствует упоминание иностранного учредителя.",
          "evidence": []
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямое указание иностранного учредителя?
        2. Указан ли режим легализации документов?
        3. Указан ли нотариальный перевод?
        4. Указана ли выписка из торгового реестра?
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "verdict": "<pass / fail / unclear>",
          "confidence": <0.0–1.0>,
          "reason": "<краткое объяснение вердикта>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 600

    retrieval:
      retrieval_profile: "party_identification_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "иностранный учредитель иностранное юридическое лицо нерезидент апостиль легализация консульская легализация нотариальный перевод выписка из торгового реестра торговый реестр правоспособность Гаагская конвенция Минская конвенция ст. 1202 ГК РФ"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - representations
        - boilerplate
      negative_keywords:
        - "уставный капитал"
        - "оплата доли"
        - "неденежный вклад"
        - "оценка"
        - "солидарная ответственность"
        - "субсидиарная ответственность"
        - "корпоративный договор"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 0.40]
        boost: 0.30
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "representations"
        - "boilerplate"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 550

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1000

      compact_output: false

      presence_signal:
        field: "foreign_founder_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по корпоративному праву. Извлекаешь из
        договора об учреждении общества сведения об иностранном учредителе
        и специальных требованиях к его документам (ФЗ-129, Гаагская
        конвенция 1961, Минская конвенция 1993, Кишинёвская конвенция 2002,
        ст. 1202–1203 ГК РФ). Не анализируешь уставный капитал, порядок
        оплаты долей, оценку неденежных вкладов и солидарно-субсидиарную
        ответственность — эти темы проверяются отдельными чеками.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 10 полей + evidence (всего 11 ключей):

        0. foreign_founder_check_presence:
          Агрегатное signal-поле — наличие иностранного учредителя и
          специальных требований к его документам.
          - "present" — если foreign_founder_status = "defined";
          - "missing" — если foreign_founder_status = "not_defined"
                        и documentation_compliance = "not_applicable";
          - "unclear" — если documentation_compliance = "not_checkable".

          Если presence = "missing":
          - foreign_founder_status = "not_defined";
          - legalization_regime = "not_defined";
          - apostille_status = "not_defined";
          - translation_status = "not_defined";
          - trade_registry_extract_status = "not_defined";
          - documentation_compliance = "not_applicable";
          - все *_details = "Данные не определены";
          - не выполняй остальные шаги.

        1. foreign_founder_status:
          - "defined" — если в тексте прямо указан иностранный учредитель;
          - "not_defined" — если нет.

        2. foreign_founder_details:
          Сведения об иностранном учредителе (наименование / ФИО, страна,
          регистрационные данные) так, как указано в договоре.
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".

        3. legalization_regime:
          - "hague_apostille"       — страна-участник Гаагской конвенции
                                      1961, требуется апостиль;
          - "consular_legalization" — страна вне Гаагской и Минской конвенций,
                                      требуется консульская легализация;
          - "cis_simplified"        — страна СНГ (Минская / Кишинёвская
                                      конвенция), документы принимаются
                                      без легализации;
          - "bilateral_treaty"      — двусторонний договор о правовой
                                      помощи;
          - "not_required"          — легализация не требуется (указано
                                      прямо либо документы освобождены);
          - "not_defined"           — режим прямо не определён.

        4. apostille_status:
          - "defined" — если в тексте прямо указано требование легализации
            (апостиля или консульской);
          - "not_defined" — если нет.

        5. apostille_details:
          Текст о легализации документов.
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".

        6. translation_status:
          - "defined" — если прямо указан нотариальный перевод на русский;
          - "not_defined" — если нет.

        7. translation_details:
          Текст о нотариальном переводе.
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".

        8. trade_registry_extract_status:
          - "defined" — если прямо указана выписка из торгового реестра;
          - "not_defined" — если нет.

        9. trade_registry_extract_details:
          Текст о выписке (включая дату, если указана).
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".

        10. documentation_compliance — сводное соответствие требованиям:
            - "compliant"      — все требуемые документы (легализация /
                                перевод / выписка) указаны и применимы
                                к стране учредителя;
            - "incomplete"     — часть документов не указана;
            - "wrong_regime"   — указан режим, не соответствующий стране
                                учредителя (например, апостиль для СНГ);
            - "not_applicable" — иностранный учредитель отсутствует;
            - "not_checkable"  — недостаточно данных.

        11. evidence — массив цитат из текста договора.
        </task>

        <context_rules>
        - Перед остальными полями заполни foreign_founder_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status/*_regime = "not_defined", documentation_compliance = "not_applicable", все *_details = "Данные не определены".
        - Используй только текст договора, без внешних знаний.
        - Не выводи требования из нормы — фиксируй только как указано в тексте. Норму используй ИСКЛЮЧИТЕЛЬНО для классификации legalization_regime и documentation_compliance.
        - Не путай "not_defined" и "not_applicable": not_applicable — только если условие неприменимо по природе сделки.
        - Состояния "partial" / "unclear" / "отсылка" отражай через value/details-поле; в status-полях допустимо только "defined" / "not_defined".
        - legalization_regime: "hague_apostille" — Великобритания, Германия, США, Франция, Италия, Кипр, ОАЭ, Китай, Испания, Нидерланды и др.; "cis_simplified" — Беларусь, Казахстан, Армения, Кыргызстан, Таджикистан, Узбекистан, Азербайджан, Молдова; "bilateral_treaty" — если прямо указан двусторонний договор; "consular_legalization" — прочие; "not_required" — если прямо указано освобождение; "not_defined" — режим не определён.
        - Для выписки из торгового реестра — фиксируй дату, если указана.
        - Если status = "not_defined" — details = "Данные не определены".
        - Не используй пустые строки, "None", "null".
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
          Иностранного учредителя в тексте нет.
          → presence = "missing";
            foreign_founder_status = "not_defined";
            legalization_regime = "not_defined";
            apostille_status = "not_defined";
            translation_status = "not_defined";
            trade_registry_extract_status = "not_defined";
            documentation_compliance = "not_applicable";
            все *_details = "Данные не определены".

        2. Неполное раскрытие.
          Иностранный учредитель указан, но часть документов
          (апостиль / перевод / выписка) не упомянута.
          → presence = "present";
            foreign_founder_status = "defined";
            соответствующие *_status = "not_defined" по факту;
            documentation_compliance = "incomplete".

        3. Противоречие между фрагментами.
          В разных частях указаны разные страны учредителя
          или разные режимы легализации; конфликт нельзя разрешить
          по тексту.
          → presence = "unclear";
            legalization_regime = "not_defined";
            documentation_compliance = "not_checkable";
            соответствующие *_details = "Не удалось определить".

        4. Несоответствие режима стране.
          Например, СНГ-учредитель и требование апостиля.
          → presence = "present";
            foreign_founder_status = "defined";
            legalization_regime = "hague_apostille" / иной по факту;
            documentation_compliance = "wrong_regime".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для foreign_founder_check_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined", "not_defined".
        - Для legalization_regime используй только: "hague_apostille", "consular_legalization", "cis_simplified", "bilateral_treaty", "not_required", "not_defined".
        - Для documentation_compliance используй только: "compliant", "incomplete", "wrong_regime", "not_applicable", "not_checkable".
        - Fallback при отсутствии данных: все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности: соответствующие *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "foreign_founder_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие иностранного учредителя и специальных требований к его документам. Внутреннее агрегатное signal-поле."
          required: true

        - name: "foreign_founder_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус наличия иностранного учредителя. Внутреннее enum-поле."
          required: true

        - name: "foreign_founder_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Иностранный учредитель"
          description: "Сведения об иностранном учредителе (наименование / ФИО, страна, регистрационные данные)."
          required: true

        - name: "legalization_regime"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["hague_apostille", "consular_legalization", "cis_simplified", "bilateral_treaty", "not_required", "not_defined"]
          display_in_grid: false
          description: "Режим легализации документов иностранного учредителя. Внутреннее enum-поле."
          required: true

        - name: "apostille_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания требования легализации (апостиль или консульская). Внутреннее enum-поле."
          required: true

        - name: "apostille_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Апостиль/легализация"
          description: "Текст о легализации документов иностранного учредителя."
          required: true

        - name: "translation_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания нотариального перевода на русский язык. Внутреннее enum-поле."
          required: true

        - name: "translation_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Нотариальный перевод"
          description: "Текст о нотариальном переводе документов иностранного учредителя."
          required: true

        - name: "trade_registry_extract_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания выписки из торгового реестра. Внутреннее enum-поле."
          required: true

        - name: "trade_registry_extract_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Выписка из реестра"
          description: "Текст о выписке из торгового реестра (включая дату, если указана)."
          required: true

        - name: "documentation_compliance"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["compliant", "incomplete", "wrong_regime", "not_applicable", "not_checkable"]
          display_in_grid: false
          description: "Сводное соответствие документов иностранного учредителя требованиям ФЗ-129 и международных конвенций. Внутреннее enum-поле."
          required: true

      store_payload: true

  - id: dispute_confidentiality_check
    name: "Специфика споров из договора об учреждении и конфиденциальность предрегистрационного контекста"
    description: >
      Точечная фиксация условий договора об учреждении о порядке
      разрешения споров, возникших из самого договора до государственной
      регистрации общества, а также о конфиденциальности предрегистрационного
      контекста. Большая часть boilerplate-вопросов (применимое право,
      юрисдикция, претензионный порядок, коммерческая тайна) покрывается
      global-чеками governing_law_and_forum,
      limitation_periods_and_pre_claim_procedures и
      confidentiality_and_trade_secrets — не дублировать.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "medium"
    severity_if_pass: "pass"
    severity_if_fail: "medium"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "споры из настоящего договора"
        - "споры между учредителями"
        - "до государственной регистрации"
        - "предрегистрационный спор"
        - "конфиденциальность переговоров"
      keyword_mode: "any"
      regex_patterns:
        - '(?i)спор(ы|ов)\s+из\s+настоящего\s+договор'
        - '(?i)спор(ы|ов)\s+между\s+учредител'
        - '(?i)конфиденциальност(ь|и)\s+переговоров'

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по корпоративному праву. Анализируется договор
        об учреждении общества. Проверяется только один вопрос: содержит ли
        текст договора специальные (не boilerplate) условия о порядке
        разрешения споров, возникающих из самого договора об учреждении
        до государственной регистрации, и о конфиденциальности
        предрегистрационного контекста.
        Важно: общие boilerplate-вопросы (применимое право, юрисдикция,
        претензионный порядок, коммерческая тайна) покрываются отдельными
        global-чеками и в этом чеке НЕ фиксируются.
        [ЗАДАЧА]
        Определи, содержит ли текст договора:
        1. Специальный порядок разрешения споров между учредителями из
          самого договора об учреждении (до регистрации общества).
        2. Специальное условие о конфиденциальности предрегистрационного
          контекста (переговоры, переписка, документы до регистрации).
        Верни вердикт:
        - "pass"    — хотя бы один из этих специфических блоков указан.
        - "fail"    — таких условий нет (весь boilerplate — в global).
        - "unclear" — есть косвенные упоминания, но недостаточно для
                      классификации.
        [ПРАВИЛА]
        1. Используй только текст договора.
        2. Evidence — прямые цитаты из договора.
        3. Верни РОВНО один валидный JSON-объект со всеми 4 ключами
          (verdict, confidence, reason, evidence), пригодный для парсинга
          через json.loads без предварительной обработки. Без markdown,
          без ```json, без комментариев, без текста до или после.
          Начни ответ сразу с { и закончи }.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — специальный порядок есть:
        Фрагмент:
        "Споры между учредителями, возникающие из настоящего договора до
        государственной регистрации Общества, разрешаются путём переговоров,
        а при недостижении согласия — в Арбитражном суде г. Москвы."
        Ответ:
        {
          "verdict": "pass",
          "confidence": 0.90,
          "reason": "Указан специальный порядок разрешения споров между учредителями из самого договора до регистрации.",
          "evidence": [
            {
              "clause_ref": "п. 11.1",
              "quote": "Споры между учредителями, возникающие из настоящего договора до государственной регистрации Общества, разрешаются путём переговоров."
            }
          ]
        }
        Пример 2 — только boilerplate:
        Фрагмент:
        "Все споры разрешаются в Арбитражном суде г. Москвы. Условия
        договора конфиденциальны."
        Ответ:
        {
          "verdict": "fail",
          "confidence": 0.85,
          "reason": "Указан только стандартный boilerplate (юрисдикция и конфиденциальность) без специфики предрегистрационного контекста.",
          "evidence": []
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямая привязка споров к самому договору об учреждении
          (до регистрации)?
        2. Есть ли специальное условие о конфиденциальности именно
          предрегистрационного контекста?
        3. Если указан только boilerplate (юрисдикция / коммерческая тайна) —
          вердикт "fail".
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "verdict": "<pass / fail / unclear>",
          "confidence": <0.0–1.0>,
          "reason": "<краткое объяснение вердикта>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 500

    retrieval:
      retrieval_profile: "dispute_resolution_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "споры из настоящего договора споры между учредителями до государственной регистрации предрегистрационный спор конфиденциальность переговоров предрегистрационный контекст"
      preferred_unit_types:
        - general_provision
        - liability_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - boilerplate
        - procedures
      negative_keywords:
        - "уставный капитал"
        - "оплата доли"
        - "неденежный вклад"
        - "оценка"
        - "солидарная ответственность"
        - "субсидиарная ответственность"
        - "корпоративный договор"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.65, 1.0]
        boost: 0.30
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "boilerplate"
        - "procedures"
      confidence_bonus_on_match: 0.06
      confidence_penalty_on_excluded_segment: 0.08

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 550

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 700

      compact_output: false

      presence_signal:
        field: "dispute_confidentiality_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по корпоративному праву. Извлекаешь из
        договора об учреждении общества ТОЛЬКО специфические условия о
        порядке разрешения споров, возникающих из самого договора до
        государственной регистрации, и о конфиденциальности предрегистрационного
        контекста. Не фиксируешь общий boilerplate (применимое право,
        юрисдикция, претензионный порядок, коммерческая тайна) — он
        покрывается global-чеками. Не анализируешь уставный капитал,
        порядок оплаты долей, оценку неденежных вкладов и солидарно-
        субсидиарную ответственность — эти темы проверяются отдельными
        чеками.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 5 полей + evidence (всего 6 ключей):

        0. dispute_confidentiality_check_presence:
          Агрегатное signal-поле — наличие специальных (не boilerplate)
          условий о спорах и конфиденциальности предрегистрационного
          контекста.
          - "present" — если хотя бы одно из содержательных полей
            (dispute_resolution_status, confidentiality_status,
              pretrial_status) ≠ "not_defined";
          - "missing" — если все три содержательных поля = "not_defined"
                        (boilerplate, покрываемый global-чеками,
                          в этом правиле не учитывается);
          - "unclear" — если фрагменты по теме есть, но из-за противоречий
            вывод невозможен.

          Если presence = "missing":
          - dispute_resolution_status = "not_defined";
          - confidentiality_status = "not_defined";
          - pretrial_status = "not_defined";
          - dispute_resolution_details = "Данные не определены";
          - confidentiality_details = "Данные не определены";
          - не выполняй остальные шаги.

        1. dispute_resolution_status:
          - "defined" — если в тексте прямо указан специальный порядок
            разрешения споров из самого договора об учреждении
            (до регистрации);
          - "not_defined" — если нет (в том числе если указан только
            общий boilerplate про юрисдикцию).

        2. dispute_resolution_details:
          Текст специального порядка разрешения споров из самого договора.
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".

        3. confidentiality_status:
          - "defined" — если в тексте прямо указано специальное условие
            о конфиденциальности предрегистрационного контекста (переговоры,
            переписка, документы до регистрации);
          - "not_defined" — если нет (в том числе если указан только
            общий boilerplate про коммерческую тайну).

        4. confidentiality_details:
          Текст условия о конфиденциальности предрегистрационного
          контекста.
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".

        5. pretrial_status:
          - "defined" — если в тексте прямо указан специальный досудебный
            порядок именно для предрегистрационных споров из договора;
          - "not_defined" — если нет.

        6. evidence — массив цитат из текста договора.
        </task>

        <context_rules>
        - Перед остальными полями заполни dispute_confidentiality_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Данные не определены".
        - Используй только текст договора, без внешних знаний.
        - Не фиксируй boilerplate:
          * общая подсудность / применимое право → global governing_law_and_forum;
          * общий претензионный порядок → global limitation_periods_and_pre_claim_procedures;
          * общая конфиденциальность / коммерческая тайна → global confidentiality_and_trade_secrets.
          В этом чеке фиксируй ТОЛЬКО специфические условия, привязанные
          к предрегистрационному контексту самого договора об учреждении.
        - Не путай "not_defined" и "not_applicable": not_applicable — только если условие неприменимо по природе сделки.
        - Состояния "partial" / "unclear" / "отсылка" отражай через details-поле; в status-полях допустимо только "defined" / "not_defined".
        - Если status = "not_defined" — details = "Данные не определены".
        - Не используй пустые строки, "None", "null".
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие специальных условий.
          В договоре есть только boilerplate про юрисдикцию и/или
          коммерческую тайну, без привязки к предрегистрационному
          контексту.
          → presence = "missing";
            dispute_resolution_status = "not_defined";
            confidentiality_status = "not_defined";
            pretrial_status = "not_defined";
            все *_details = "Данные не определены".

        2. Неполное раскрытие темы.
          Специальный порядок споров есть, но конфиденциальность
          предрегистрационного контекста не указана (или наоборот).
          → presence = "present";
            соответствующий *_status = "defined" / "not_defined" по факту.

        3. Противоречие между фрагментами.
          В разных частях указаны разные порядки разрешения споров
          или разные условия конфиденциальности; конфликт нельзя
          разрешить по тексту.
          → presence = "unclear";
            соответствующий *_status = "not_defined";
            соответствующий *_details = "Не удалось определить".

        4. Только boilerplate.
          Указана общая юрисдикция и/или общая коммерческая тайна
          без прямой привязки к предрегистрационному контексту.
          → presence = "missing";
            все *_status = "not_defined";
            все *_details = "Данные не определены".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для dispute_confidentiality_check_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined", "not_defined".
        - Fallback при отсутствии данных: все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности: соответствующие *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "dispute_confidentiality_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие специальных (не boilerplate) условий о спорах и конфиденциальности предрегистрационного контекста. Внутреннее агрегатное signal-поле."
          required: true

        - name: "dispute_resolution_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания специального порядка разрешения споров из договора об учреждении (до регистрации). Внутреннее enum-поле."
          required: true

        - name: "dispute_resolution_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Специфика споров"
          description: "Текст о специальном порядке разрешения споров из самого договора об учреждении."
          required: true

        - name: "confidentiality_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания специального условия о конфиденциальности предрегистрационного контекста. Внутреннее enum-поле."
          required: true

        - name: "confidentiality_details"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "Конфиденциальность переговоров"
          description: "Текст о конфиденциальности предрегистрационного контекста (переговоры, переписка, документы)."
          required: true

        - name: "pretrial_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Статус указания специального досудебного порядка для предрегистрационных споров. Внутреннее enum-поле."
          required: true

      store_payload: true

  - id: registration_decision_compliance_check
    name: "Подача документов в ФНС, подтверждение решения и compliance регистрации"
    description: >
      Фактографическая проверки процедуры подачи документов на государственную
      регистрацию создаваемого общества (форма Р11001 для ООО / Р12001 для АО,
      субъект, сроки, регистрирующий орган), способа подтверждения решения об
      учреждении (ст. 67.1 п. 3 пп. 3 ГК РФ в ред. ФЗ-287 от 24.07.2023) и
      оценки соответствия процедуры императивным требованиям. Госпошлина, ПДн
      и налоговый режим проверяются отдельным чеком tax_and_personal_data_check.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "государственная регистрация"
        - "регистрация общества"
        - "Р11001"
        - "Р12001"
        - "подача документов"
        - "МИФНС"
        - "регистрирующий орган"
        - "нотариальное удостоверение"
        - "решение об учреждении"
        - "аудиозапись"
        - "видеозапись"
        - "присутствие всех участников"
      keyword_mode: "any"
      regex_patterns:
        - '(?i)(государственн(ая|ой|ую)\s+)?регистраци(я|и|ю)\s+обществ'
        - '(?i)\bР\s*1[12]00[12]\b'
        - '(?i)нотариальн(ое|ого|ым)\s+удостоверени'
        - '(?i)решени(е|я|ю)\s+об\s+учреждени'

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по корпоративному праву.
        Анализируется договор об учреждении общества
        (ст. 51, 67.1 п. 3 пп. 3 ГК РФ; ст. 11, 13 ФЗ-14; ст. 8, 9 ФЗ-208; ФЗ-129).
        Проверяется: процедура подачи документов на регистрацию, способ
        подтверждения решения об учреждении и compliance процедуры.

        Нормативный ориентир:
        - ст. 51 ГК РФ — государственная регистрация юридических лиц.
        - ст. 67.1 п. 3 пп. 3 ГК РФ (в ред. ФЗ-287 от 24.07.2023) — способы
          подтверждения решения об учреждении ООО с 2+ участниками:
          (а) нотариальное удостоверение;
          (б) подписание всеми участниками в присутствии нотариуса;
          (в) аудио- и/или видеозапись заседания;
          (г) решение, подписанное всеми участниками.
          Для единственного учредителя — решение единственного участника
          (нотариальное удостоверение не требуется).
        - ст. 11, 13 ФЗ-14 — документы для регистрации ООО.
        - ФЗ-129 — порядок государственной регистрации.

        Важно:
        - Твоя задача — установить факты из текста договора.
        - Не оценивай риски, кроме registration_compliance.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Субъект и порядок подачи документов на регистрацию (кто, куда, сроки).
        2. Способ подтверждения решения об учреждении.
        3. Оцени соответствие процедуры ст. 67.1 п. 3 пп. 3 ГК РФ.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. verdict = "pass" — подача и способ подтверждения указаны и compliant.
        3. verdict = "unclear" — подача указана, но способ подтверждения неясен.
        4. verdict = "fail" — процедура регистрации не описана.
        5. Верни РОВНО один валидный JSON-объект со всеми 3 ключами (verdict,
          reason, evidence). Начни ответ сразу с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — compliant:
        Фрагмент:
        "Учредители обязуются в течение 10 рабочих дней подать документы на
        государственную регистрацию в МИФНС № 46 по г. Москве. Решение об
        учреждении подтверждается нотариальным удостоверением."

        Ответ:
        {
          "verdict": "pass",
          "reason": "Подача документов и нотариальное удостоверение решения об учреждении указаны прямо.",
          "evidence": [
            {"clause_ref": "п. 12.1", "quote": "Учредители обязуются в течение 10 рабочих дней подать документы на государственную регистрацию в МИФНС № 46 по г. Москве."}
          ]
        }

        Пример 2 — invalid method:
        Фрагмент:
        "Решение об учреждении принимается большинством голосов учредителей."

        Ответ:
        {
          "verdict": "fail",
          "reason": "Способ подтверждения решения (большинством голосов) противоречит ст. 67.1 п. 3 пп. 3 ГК РФ.",
          "evidence": [
            {"clause_ref": "п. 3.1", "quote": "Решение об учреждении принимается большинством голосов учредителей."}
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Проверь, что все 3 ключа (verdict, reason, evidence) присутствуют в JSON.
        Не выводи шаги проверки. Верни только JSON.
      context_k: 8
      temperature: 0.0
      max_tokens: 700

    retrieval:
      corpus_scope: "primary_segment"
      levels:
