        - '(?i)переходн[а-яё]+\\s+период'
        - '(?i)(доход|прибыл|убыт)[а-яё]*\\s+до\\s+регистрац'
        - '(?i)фактическ[а-яё]+\\s+деятельност'

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по корпоративному и налоговому праву.
        Анализируется договор об учреждении общества
        (ст. 89.1 п. 4 ГК РФ, ст. 217, 249 НК РФ).
        Проверяется: урегулированы ли в договоре вопросы распределения
        доходов и убытков переходного периода до государственной регистрации.

        Нормативный ориентир:
        - ст. 89.1 п. 4 ГК РФ — учредители несут солидарно-субсидиарную
          ответственность по обязательствам, связанным с созданием общества
          и возникшим до его государственной регистрации.
        - ст. 217 НК РФ — доходы, не подлежащие налогообложению.
        - ст. 249 НК РФ — внереализационные доходы.
        - Письмо Минфина от 19.03.2012 № 03-03-06/1/131 — доходы, полученные
          до регистрации, учитываются после регистрации в составе доходов
          создаваемого юрлица.

        Важно:
        - Если учредители ведут фактическую деятельность до регистрации
          (через предварительные договоры), возникает вопрос: кому принадлежат
          доходы и кто несёт убытки этого периода.
        - Без урегулирования — споры между учредителями и налоговые риски.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Ведётся ли фактическая деятельность до регистрации.
        2. Порядок распределения доходов переходного периода.
        3. Порядок распределения убытков переходного периода.
        4. Налоговые последствия переходного периода.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. verdict = "pass" — распределение доходов и убытков урегулировано.
        4. verdict = "unclear" — упомянуто частично.
        5. verdict = "fail" — переходный период не урегулирован.
        6. Верни РОВНО один валидный JSON-объект со всеми 3 ключами
           (verdict, reason, evidence). Начни ответ сразу с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]

