  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 12: Споры и конфиденциальность
  # ──────────────────────────────────────────────────────────────────────────
  - id: dispute_confidentiality_check
    name: "Порядок разрешения споров и конфиденциальность"
    description: >
      Фактографическая проверка порядка разрешения споров (досудебный порядок,
      подсудность) и обязательства конфиденциальности.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "medium"
    severity_if_pass: "pass"
    severity_if_fail: "medium"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "разрешение споров"
        - "досудебный порядок"
        - "претензионный порядок"
        - "подсудность"
        - "арбитражный суд"
        - "путём переговоров"
        - "конфиденциальность"
        - "неразглашение"
        - "коммерческая тайна"
        - "не подлежит разглашению"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)спор(ы|ов)\\s+(разрешаются|подлежат)"
        - "(?i)арбитражн(ый|ого)\\s+суд"
        - "(?i)конфиденциальност"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по корпоративному праву.
        Анализируется договор об учреждении общества.
        Проверяется только один вопрос: порядок разрешения споров
        и конфиденциальность.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        [ЗАДАЧА]
        Найди в тексте договора:
        1. Порядок разрешения споров.
        2. Досудебный порядок (претензионный порядок).
        3. Подсудность.
        4. Обязательство конфиденциальности.
        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если данные не указаны прямо — возвращай "not_defined".
        3. Если текстового значения нет — возвращай строго "Данные не определены".
        4. В evidence включай только текст договора.
        5. Верни только один JSON-объект.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1:
        Фрагмент:
        "Все споры разрешаются путём переговоров. При недостижении согласия —
        в Арбитражном суде г. Москвы. Условия договора конфиденциальны
        и не подлежат разглашению третьим лицам."
        Ответ:
        {
          "dispute_resolution_status": "defined",
          "dispute_resolution_details": "путём переговоров, при недостижении согласия — в Арбитражном суде г. Москвы",
          "pretrial_status": "defined",
          "pretrial_details": "путём переговоров",
          "jurisdiction_status": "defined",
          "jurisdiction_details": "Арбитражный суд г. Москвы",
          "confidentiality_status": "defined",
          "confidentiality_details": "условия договора конфиденциальны и не подлежат разглашению третьим лицам",
          "evidence": [
            {
              "clause_ref": "п. 11.1",
              "quote": "Все споры разрешаются путём переговоров. При недостижении согласия — в Арбитражном суде г. Москвы."
            }
          ]
        }
        Пример 2:
        Фрагмент:
        "Учредители обязуются создать общество."
        Ответ:
        {
          "dispute_resolution_status": "not_defined",
          "dispute_resolution_details": "Данные не определены",
          "pretrial_status": "not_defined",
          "pretrial_details": "Данные не определены",
          "jurisdiction_status": "not_defined",
          "jurisdiction_details": "Данные не определены",
          "confidentiality_status": "not_defined",
          "confidentiality_details": "Данные не определены",
          "evidence": []
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о порядке разрешения споров.
        2. Найди прямую цитату о досудебном порядке.
        3. Найди прямую цитату о подсудности.
        4. Найди прямую цитату о конфиденциальности.
        5. Если прямой цитаты нет — верни "not_defined". Не додумывай.
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "dispute_resolution_status": "<defined / not_defined>",
          "dispute_resolution_details": "<текст или 'Данные не определены'>",
          "pretrial_status": "<defined / not_defined>",
          "pretrial_details": "<текст или 'Данные не определены'>",
          "jurisdiction_status": "<defined / not_defined>",
          "jurisdiction_details": "<текст или 'Данные не определены'>",
          "confidentiality_status": "<defined / not_defined>",
          "confidentiality_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 500

    retrieval:
      retrieval_profile: "dispute_resolution_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "разрешение споров досудебный порядок претензионный порядок подсудность арбитражный суд путём переговоров конфиденциальность неразглашение коммерческая тайна не подлежит разглашению ст. 434.1 ГК РФ"
      preferred_unit_types:
