  - id: founder_liability_for_damages_check
    name: "Ответственность учредителей за убытки, причинённые обществу или другим учредителям"
    description: >
      Фактографическая проверка наличия в договоре об учреждении условий
      об ответственности учредителей за убытки, причинённые создаваемому
      обществу или другим учредителям: за недостоверные заверения
      (ст. 431.2 ГК РФ), за срыв государственной регистрации, за неоплату
      или несвоевременную оплату доли, за разглашение конфиденциальной
      информации. Фиксируется тип ответственности (неустойка, возмещение
      убытков, оба) и перечень оснований. Не покрывает ответственность
      перед третьими лицами до регистрации — она фиксируется отдельным
      чеком solidary_liability_check.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "возмещение убытков"
        - "убытки"
        - "неустойка"
        - "штраф"
        - "пеня"
        - "ответственность учредителя"
        - "ответственность за недостоверные заверения"
        - "ответственность за срыв регистрации"
        - "возместить расходы"
        - "причинение убытков"
      keyword_mode: "any"
      regex_patterns:
        - '(?i)возме(ст|щ)(ить|ает|ение)\\s+убытк'
        - '(?i)неустойк|штраф|пен[иья]'
        - '(?i)ответственн[а-яё]+\\s+учредител'
        - '(?i)причин[а-яё]+\\s+убытк'

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по корпоративному праву. Анализируется
        договор об учреждении общества (ст. 15, 393, 431.2 ГК РФ,
        ст. 89.1 п. 4 ГК РФ, ст. 11 п. 3 ФЗ-14 «Об ООО»). Проверяется
        только один вопрос: содержит ли текст договора условия об
        ответственности учредителей за убытки, причинённые обществу
        или другим учредителям.

        Нормативный ориентир:
        - ст. 15 ГК РФ — возмещение убытков.
        - ст. 393 ГК РФ — обязанность должника возместить убытки.
        - ст. 431.2 ГК РФ — ответственность за недостоверные заверения.
        - ст. 89.1 п. 4 ГК РФ — солидарно-субсидиарная ответственность
          учредителей по обязательствам до регистрации (перед третьими
          лицами; в этом чеке не фиксируется).

        Важно:
        - Твоя задача — установить факты из текста договора.
        - Не оценивай размер и достаточность неустойки.
        - Не путай внутреннюю ответственность учредителей друг перед
          другом и перед обществом (этот чек) с ответственностью перед
          третьими лицами до регистрации (solidary_liability_check).

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Условие об ответственности учредителей за убытки.
        2. Тип ответственности (неустойка / возмещение убытков / оба).
        3. Перечень оснований (недостоверные заверения, срыв регистрации,
          неоплата доли, разглашение информации, иное).

        [ПРАВИЛА]
        1. Используй только текст договора.
        2. Не подставляй нормы закона вместо текста договора.
        3. verdict = "pass" — условие об ответственности и основания указаны прямо.
        4. verdict = "unclear" — условие упомянуто частично или без оснований.
        5. verdict = "fail" — условие отсутствует.
        6. Верни РОВНО один валидный JSON-объект со всеми 4 ключами
          (verdict, confidence, reason, evidence), пригодный для парсинга
          через json.loads без предварительной обработки. Без markdown,
          без ```json, без комментариев, без текста до или после.
          Начни ответ сразу с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — условие об ответственности указано (pass):
        Фрагмент:
        "В случае причинения учредителем убытков Обществу или другим
        учредителям вследствие недостоверности заверений или срыва
        государственной регистрации, виновный учредитель обязан возместить
        причинённые убытки в полном объёме. За нарушение срока оплаты доли
        начисляется неустойка 0,1% в день."

        Ответ:
        {
          "verdict": "pass",
          "confidence": 0.95,
          "reason": "Указаны основания ответственности (недостоверные заверения, срыв регистрации) и типы (возмещение убытков, неустойка).",
          "evidence": [
            {"clause_ref": "п. 9.3", "quote": "В случае причинения учредителем убытков Обществу или другим учредителям вследствие недостоверности заверений или срыва государственной регистрации, виновный учредитель обязан возместить причинённые убытки в полном объёме."}
          ]
        }

        Пример 2 — условие отсутствует (fail):
        Фрагмент:
        "Учредители обязуются создать общество."

        Ответ:
        {
          "verdict": "fail",
          "confidence": 0.90,
          "reason": "В договоре отсутствует условие об ответственности учредителей за убытки.",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямое условие об ответственности за убытки?
        2. Указан ли тип (неустойка / возмещение убытков / оба)?
        3. Перечислены ли основания возникновения убытков?
        4. Не путать с солидарно-субсидиарной ответственностью перед
          третьими лицами до регистрации (solidary_liability_check).

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "verdict": "<pass / fail / unclear>",
          "confidence": <0.0–1.0>,
          "reason": "<краткое объяснение вердикта>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 600

