        "Уставный капитал Общества составляет 100 000 рублей.
        Иванов И.И. — доля 60%, номинальная стоимость 60 000 рублей.
        ООО «Альфа» — доля 40%, номинальная стоимость 40 000 рублей.
        Сумма долей составляет 100% уставного капитала."
