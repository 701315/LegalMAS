# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: CHECKS_V8 — единственный рабочий слой юридического анализа
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 1: Учредители, наименование, ОПФ, место нахождения
  # ──────────────────────────────────────────────────────────────────────────
  - id: founders_and_company_check
    name: "Учредители, наименование и ОПФ создаваемого общества"
    description: >
      Фактографическая проверка идентификации учредителей (ФИО/наименование,
      ИНН, ОГРН, адрес, паспортные данные), наименования и организационно-правовой
      формы создаваемого общества, места нахождения, количества учредителей.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "учредитель"
        - "создать общество"
        - "наименование общества"
        - "организационно-правовая форма"
        - "место нахождения"
        - "ООО"
        - "АО"
        - "ПАО"
        - "ИНН"
        - "ОГРН"
        - "паспорт"
        - "адрес"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)учредител(ь|и|ей)\\s*([-—:]|обязу)"
        - "(?i)(ООО|АО|ПАО)\\s+[«\"]"
        - "(?i)\\bИНН\\s*\\d{10,12}\\b"
        - "(?i)\\bОГРН\\s*\\d{13,15}\\b"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по корпоративному праву.
        Анализируется договор об учреждении общества (ст. 89.1 ГК РФ,
        ст. 11 ФЗ-14 «Об ООО», ст. 9 ФЗ-208 «Об АО»).
        Проверяется только один вопрос: идентификация учредителей
        и данные создаваемого общества.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        [ЗАДАЧА]
        Найди в тексте договора:
        1. Перечень учредителей (ФИО/наименование, ИНН, ОГРН, адрес).
        2. Количество учредителей.
        3. Полное наименование создаваемого общества.
        4. Организационно-правовая форма (ООО/АО/ПАО).
        5. Место нахождения общества.
        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если данные не указаны прямо — возвращай "not_defined".
        3. Если текстового значения нет — возвращай строго "Данные не определены".
        4. Не используй "None", "null", "not_defined", "not_defined" или пустые строки.
        5. В evidence включай только текст договора.
        6. Верни только один JSON-объект.
        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — данные определены:
        Фрагмент:
        "Учредители: 1) Иванов Иван Иванович, паспорт серия 45 00 № 123456,
        ИНН 770000000001; 2) ООО «Альфа», ИНН 7700000001, ОГРН 1027700000001.
        Учредители создают Общество с ограниченной ответственностью «Бета».
        Место нахождения: г. Москва, ул. Ленина, д. 1."
        Ответ:
        {
          "founders_list_status": "defined",
          "founders_list_details": "1) Иванов Иван Иванович, паспорт 45 00 № 123456, ИНН 770000000001; 2) ООО «Альфа», ИНН 7700000001, ОГРН 1027700000001",
          "number_of_founders_status": "defined",
          "number_of_founders_value": "2",
          "company_name_status": "defined",
          "company_name_value": "Общество с ограниченной ответственностью «Бета»",
          "company_form_code": "ooo",
          "company_location_status": "defined",
          "company_location_value": "г. Москва, ул. Ленина, д. 1",
          "evidence": [
            {
              "clause_ref": "преамбула",
              "quote": "Учредители: 1) Иванов Иван Иванович... 2) ООО «Альфа»... Учредители создают Общество с ограниченной ответственностью «Бета»."
            }
          ]
        }
        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Стороны договорились создать общество."
        Ответ:
        {
          "founders_list_status": "not_defined",
          "founders_list_details": "Данные не определены",
          "number_of_founders_status": "not_defined",
          "number_of_founders_value": "Данные не определены",
          "company_name_status": "not_defined",
          "company_name_value": "Данные не определены",
          "company_form_code": "not_defined",
          "company_location_status": "not_defined",
          "company_location_value": "Данные не определены",
          "evidence": []
        }
        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату с перечнем учредителей.
        2. Найди прямую цитату с наименованием общества.
        3. Найди прямую цитату с ОПФ.
        4. Найди прямую цитату с местом нахождения.
        5. Если прямой цитаты нет — верни "not_defined". Не додумывай.
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "founders_list_status": "<defined / not_defined>",
          "founders_list_details": "<перечень или 'Данные не определены'>",
          "number_of_founders_status": "<defined / not_defined>",
          "number_of_founders_value": "<число или 'Данные не определены'>",
          "company_name_status": "<defined / not_defined>",
          "company_name_value": "<наименование или 'Данные не определены'>",
          "company_form_code": "<ooo / ao / pao / not_defined>",
          "company_location_status": "<defined / not_defined>",
          "company_location_value": "<место нахождения или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 700

    retrieval:
      retrieval_profile: "party_identification_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "учредитель создать общество наименование общества организационно-правовая форма место нахождения ООО АО ПАО ИНН ОГРН паспорт адрес количество учредителей"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - representations
        - definitions
        - boilerplate
      negative_keywords:
        - "уставный капитал"
        - "доля учредителя"
        - "оплата доли"
        - "солидарная ответственность"
        - "неденежный вклад"
        - "оценка"
        - "корпоративный договор"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 0.25]
        boost: 0.30
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "representations"
        - "definitions"
        - "boilerplate"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.15

    evidence:
      required: true
      min_snippet_length: 50
      max_snippet_length: 1000

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 1400
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по корпоративному праву. Извлеки из договора
        об учреждении общества данные об учредителях и создаваемом обществе.
        Не анализируй уставный капитал, оплату долей или солидарную ответственность.
        </role>
        <context>
        {context}
        </context>
        <task>
        Заполни строго следующие поля:
        1. founders_list_status — "defined" или "not_defined".
        2. founders_list_details — перечень учредителей с реквизитами.
        3. number_of_founders_status — "defined" или "not_defined".
        4. number_of_founders_value — количество учредителей.
        5. company_name_status — "defined" или "not_defined".
        6. company_name_value — полное наименование создаваемого общества.
        7. company_form_code — ooo / ao / pao / not_defined.
        8. company_location_status — "defined" или "not_defined".
        9. company_location_value — место нахождения общества.
        Если данные отсутствуют в тексте:
        - статус = "not_defined"
        - текстовое поле = "Данные не определены"
        </task>
        <rules>
        - Используй только текст договора.
        - Не выводи данные учредителей из контекста — только прямо указанные.
        - Верни только JSON.
        </rules>
      fields:
        - name: "founders_list_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус идентификации учредителей."
          required: true
        - name: "founders_list_details"
          type: "string"
          presentation: "fact"
          label: "Учредители"
          description: "Перечень учредителей с реквизитами."
          required: true
          display_in_grid: true
          display_priority: 1
        - name: "number_of_founders_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения количества учредителей."
          required: false
        - name: "number_of_founders_value"
          type: "string"
          presentation: "fact"
          label: "Количество учредителей"
          description: "Количество учредителей."
          required: false
          display_in_grid: true
          display_priority: 2
        - name: "company_name_status"
