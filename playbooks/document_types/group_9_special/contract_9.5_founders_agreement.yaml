        в ФНС, налоги или директора — эти темы проверяются отдельными
        чеками.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 8 полей + evidence (всего 9 ключей):

        0. amendment_before_registration_check_presence:
          Агрегатное signal-поле — наличие механизма внесения изменений.
          - "present" — если хотя бы одно из содержательных полей
            (amendment_procedure_status, new_founder_status,
              share_change_status, name_change_status) ≠ "not_defined";
          - "missing" — если все четыре содержательных поля = "not_defined";
          - "unclear" — если фрагменты по теме есть, но из-за противоречий
            вывод невозможен.

          Если presence = "missing":
          - amendment_procedure_status = "not_defined";
          - new_founder_status = "not_defined";
          - share_change_status = "not_defined";
          - name_change_status = "not_defined";
          - все *_details = "Данные не определены";
          - не выполняй остальные шаги.

        1. amendment_procedure_status:
          - "defined" — если в тексте прямо указан общий порядок внесения
            изменений (форма, кворум, сроки);
          - "not_defined" — если нет.

        2. amendment_procedure_details:
          Общий порядок внесения изменений до регистрации (форма, кворум,
          сроки).
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".

        3. new_founder_status:
          - "defined" — если в тексте прямо указан порядок включения
            нового учредителя;
          - "not_defined" — если нет.

        4. new_founder_details:
          Порядок и условия включения нового учредителя до регистрации.
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".

        5. share_change_status:
          - "defined" — если в тексте прямо указан порядок изменения
            размера долей или замены объекта вклада;
