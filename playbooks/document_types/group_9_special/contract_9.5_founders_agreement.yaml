    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "солидарная ответственность"
        - "солидарно отвечают"
        - "обязательства до регистрации"
        - "обязательства, связанные с созданием"
        - "до государственной регистрации"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)солидарн(ая|ой|ую)\\s+ответственност"
        - "(?i)обязательств(а|ам).*до\\s+(государственной\\s+)?регистраци"

