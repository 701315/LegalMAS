        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        [ЗАДАЧА]
        Найди в тексте договора:
        1. Указан ли конкретный срок оплаты.
        2. Конкретный срок оплаты.
        3. Способ оплаты (деньги/имущество/права/смешанный).
        4. Указан ли срок оплаты для каждого учредителя отдельно.
