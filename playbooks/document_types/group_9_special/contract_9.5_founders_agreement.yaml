  - id: registration_decision_compliance_check
    name: "Подача документов в ФНС, подтверждение решения и compliance регистрации"
    description: >
      Фактографическая проверки процедуры подачи документов на государственную
      регистрацию создаваемого общества (форма Р11001 для ООО / Р12001 для АО,
      субъект, сроки, регистрирующий орган), способа подтверждения решения об
      учреждении (ст. 67.1 п. 3 пп. 3 ГК РФ в ред. ФЗ-287 от 24.07.2023) и
      оценки соответствия процедуры императивным требованиям. Госпошлина, ПДн
      и налоговый режим проверяются отдельным чеком tax_and_personal_data_check.
