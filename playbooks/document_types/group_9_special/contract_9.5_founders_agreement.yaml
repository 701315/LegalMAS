        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату с размером уставного капитала.
        2. Найди прямую цитату с долями каждого учредителя.
        3. Найди прямую цитату с подтверждением суммы = 100%.
        4. Если прямой цитаты нет — верни "not_defined". Не додумывай.
        Не выводи шаги проверки. Верни только JSON.
        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "charter_capital_status": "<defined / not_defined>",
          "charter_capital_value": "<сумма или 'Данные не определены'>",
          "charter_capital_currency": "<RUB / other / not_defined>",
          "shares_distribution_status": "<defined / not_defined>",
