  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 5: Солидарная ответственность учредителей
  # ──────────────────────────────────────────────────────────────────────────
  - id: solidary_liability_check
    name: "Солидарная ответственность учредителей до регистрации (ст. 11 ФЗ-14)"
    description: >
      Фактографическая проверка наличия прямого указания на солидарную
      ответственность учредителей по обязательствам, возникшим до регистрации.
