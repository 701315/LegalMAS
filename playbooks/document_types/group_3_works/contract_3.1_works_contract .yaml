type: contract_3.1_works_contract 
name: "Договор подряда (общий)"

description: |
  Базовая конструкция (locatio-conductio operis) для договоров, направленных на создание
  или изменение вещи (материальный результат). Подрядчик действует своим иждивением,
  самостоятельно определяя способы выполнения. Заказчик оплачивает принятый результат.
  Ключевое отличие от услуг: результат овеществлён и передаваем (пошив костюма, ремонт станка,
  изготовление мебели). Регулируется § 1 Главы 37 ГК РФ (ст. 702–729).

version: 3.0
parent: class_3_work_performance

# Структура
#   classification_runtime_v1  → YAMLRegistry (L1/L2 классификация)
#   trigger_definitions        → TriggerDetector
#   checks_v8                  → DocTypeCheckLoader (прямое исполнение)
#   doc_type_checks            → DocTypeCheckConverter (авто-конверсия)
#   dd_request_templates       → DDRequestTemplateLoader
#   compliance_rules           → exclusion_logic → compliance-проверки

metadata:
  category: contract
  subcategory: work_performance
  complexity: medium
  risk_level: high
  jurisdiction: RU
  language: ru
  legal_base: "§ 1 Главы 37 ГК РФ (ст. 702-729)"
  doc_types_supported:
    - "договор подряда"
    - "договор на выполнение работ"
    - "договор подряда на изготовление"
    - "договор подряда на переработку (обработку)"
    - "договор на ремонт оборудования/станка/техники"
    - "договор подряда с физическим лицом"
    - "договор подряда с давальческими материалами"

engine_expectations:
  evidence_required: true
  evidence_style: "pinpoint"
  allow_not_found: true
  output_style: "dd_grid"
  prefer_structured_outputs: true

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 1: КЛАССИФИКАЦИЯ (L1/L2)
#  Читается: YAMLRegistry → L1FilenameClassifier, L2HeaderClassifier
# ════════════════════════════════════════════════════════════════════════════

classification_runtime_v1:

  rules:

    filename_patterns:
      - "(?i)подряд"
      - "(?i)выполнени.*работ"
      - "(?i)изготовлени"
      - "(?i)ремонт.*договор"

    folder_patterns:
      - "(?i)подряд"
      - "(?i)work.*contract"
      - "(?i)contractors"

    keywords:

      high:
        - "(?i)подрядчик"
        - "(?i)договор\\s+подряд[ауы]"
        - "(?i)договор\\s+на\\s+выполнен[иеия]\\s+работ"
        - "(?i)договор\\s+подряд[ауы]\\s+на\\s+изготовлен[иеия]"
        - "(?i)договор\\s+подряд[ауы]\\s+на\\s+переработк[уи]\\s*\\(обработк[уи]\\)?"
        - "(?i)договор\\s+на\\s+ремонт\\s+оборудован[ияи]/станк[аоу]/техник[иуы]"
        - "(?i)договор\\s+подряд[ауы]\\s+с\\s+физическ[имой]\\s+лиц[омем]"
        - "(?i)договор\\s+подряд[ауы]\\s+с\\s+давальческ[имиих]\\s+материал[амиов]"
        - "(?i)заказчик"
        - "(?i)результат\\s+работ"
        - "(?i)сдач[аеи]-?при[её]мк[аеи]"
        - "(?i)акт\\s+выполнен[ныхые]\\s+работ"
        - "(?i)техническ[оеая]\\s+задан[иеия]"
        - "(?i)иждивен[иеия]\\s+подрядчик[ауы]"

      medium:
        - "выполнение работ"
        - "изготовление"
        - "переработка"
        - "обработка"
        - "ремонт"
        - "смета"
        - "гарантийный срок"
        - "давальческие материалы"
        - "этап работ"
        - "скрытые работы"
        - "приёмка работ"
        - "сдача результата"

      low:
        - "субподрядчик"
        - "генеральный подрядчик"
        - "акт сдачи-приёмки"
        - "твёрдая цена"
        - "приблизительная смета"

    exclusions:
      - "возмездное оказание услуг"
      - "консультации"
      - "трудовой договор"
      - "правила внутреннего распорядка"
      - "авторский заказ"
      - "долевое участие в строительстве"
      - "строительный подряд"
      - "бытовой подряд"
      - "для личных бытовых нужд"
      - "НИОКР"
      - "научно-исследовательские работы"
      - "проектные и изыскательские работы"
      - "ПИР"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 2: ТРИГГЕРЫ
#  Читается: TriggerDetector → doc.applicable_triggers
# ════════════════════════════════════════════════════════════════════════════

trigger_definitions:

  consumer_contractor:
    any_keywords:
      - "физическое лицо"
      - "гражданин"
      - "паспорт"
      - "дата рождения"
      - "место рождения"
      - "ИНН физлица"
      - "самозанятый"

  commercial_parties:
    any_keywords:
      - "ООО"
      - "АО"
      - "ЗАО"
      - "ПАО"
      - "общество"
      - "ИНН"
      - "ОГРН"
      - "КПП"
      - "в лице"
      - "действующего на основании"
      - "генеральный директор"

  customer_supplied_materials:
    any_keywords:
      - "давальческое"
      - "давальческие материалы"
      - "материалы заказчика"
      - "предоставляет заказчик"
      - "сырьё заказчика"
      - "норма расхода"

  subcontracting_involved:
    any_keywords:
      - "субподрядчик"
      - "субподрядная организация"
      - "привлечение третьих лиц"
      - "генеральный подрядчик"
      - "привлечённые организации"

  fixed_price:
    any_keywords:
      - "твёрдая цена"
      - "твёрдая смета"
      - "цена не подлежит изменению"
      - "фиксированная стоимость"
      - "не изменяется"

  approximate_price:
    any_keywords:
      - "приблизительная смета"
      - "приблизительная цена"
      - "ориентировочная стоимость"
      - "может быть изменена"
      - "подлежит уточнению"

  advance_payment:
    any_keywords:
      - "аванс"
      - "предоплата"
      - "авансовый платёж"
      - "предварительная оплата"
      - "выплачивается до начала работ"

  warranty_period_set:
    any_keywords:
      - "гарантийный срок"
      - "гарантия качества"
      - "гарантийные обязательства"
      - "в течение гарантийного срока"
      - "устранение недостатков"

  equipment_repair:
    any_keywords:
      - "ремонт оборудования"
      - "ремонт станка"
      - "ремонт техники"
      - "ремонт механизма"
      - "диагностика и ремонт"
      - "техническое обслуживание и ремонт"
      - "восстановление работоспособности"
      - "замена узлов"
      - "замена деталей"

  manufacturing_order:
    any_keywords:
      - "изготовление"
      - "изготовить"
      - "производство по заказу"
      - "по техническому заданию"
      - "по чертежам"
      - "по образцу"
      - "серия изделий"
      - "партия изделий"
      - "прототип"
      - "опытный образец"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 3: SHARED PATTERNS
#  Читается: DocTypeCheckLoader через _resolve_yaml_templates()
# ════════════════════════════════════════════════════════════════════════════

shared_patterns:

  money_amount: "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|тыс|млн|млрд)"
  date_pattern: "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"
  date_period: "(?i)(не\\s+позднее|в\\s+течение)\\s+\\d+\\s*(календарн|рабоч|дн)"
  inn_pattern: "(?i)\\bИНН\\s*:?\\s*\\d{10,12}\\b"
  percent_pattern: "(?i)\\b\\d+([,.]\\d+)?\\s*%\\s*(в\\s+(день|месяц|год))?"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: COMPLIANCE RULES
#  Читается: DocTypeCheckLoader._exclusion_logic_to_checks()
# ════════════════════════════════════════════════════════════════════════════

compliance_rules:

  - id: "labor_requalification_risk"
    name: "Риск переквалификации в трудовой договор (ст. 15, 19.1 ТК РФ)"
    description: |
      При систематическом личном выполнении работ физическим лицом с признаками
      подчинения работодателю (фиксированный режим, рабочее место у заказчика,
      регулярная оплата вне зависимости от результата) суд или ГИТ вправе
      переквалифицировать договор в трудовой (ст. 19.1 ТК РФ).
      Последствия: доначисление НДФЛ, страховых взносов, предоставление
      трудовых гарантий, штрафы по ст. 5.27 КоАП РФ.
    legal_base: "ст. 15, 19.1 ТК РФ; ст. 5.27 КоАП РФ"
    required_triggers: ["consumer_contractor", "commercial_parties"]
    severity: "critical"
    result_if_triggered: "warning"
    detector_type: "rules"
    rules:
      keywords:
        - "физическое лицо"
        - "гражданин"
        - "самозанятый"
        - "личное выполнение"
        - "режим работы"
        - "рабочее место"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "личное выполнение"
        - "режим работы"
        - "рабочее место заказчика"
        - "ежемесячная оплата"
      rerank: true

  - id: "unlicensed_work_prohibition"
    name: "Выполнение лицензируемых работ без лицензии/допуска СРО (ФЗ-99, ГрК РФ)"
    description: |
      Отдельные виды подрядных работ требуют наличия лицензии или допуска СРО
      (проектирование, строительство особо опасных объектов, работы на тепловых сетях и т.п.).
      Выполнение таких работ без разрешения влечёт недействительность договора
      и административную ответственность.
    legal_base: "ФЗ от 04.05.2011 № 99-ФЗ; ст. 55.8 ГрК РФ; ст. 14.1 КоАП РФ"
    required_triggers: ["commercial_parties"]
    severity: "critical"
    result_if_triggered: "warning"
    detector_type: "rules"
    rules:
      keywords:
        - "лицензия"
        - "допуск СРО"
        - "свидетельство о допуске"
        - "саморегулируемая организация"
        - "особо опасные работы"
      keyword_mode: "any"
    retrieval:
      context_k: 4
      boost_keywords:
        - "лицензия"
        - "допуск СРО"
        - "саморегулируемая организация"
      rerank: true

  - id: "approximate_estimate_exceeded_without_notice"
    name: "Превышение приблизительной сметы > 10% без уведомления (ст. 709 п. 5 ГК РФ)"
    description: |
      При приблизительной смете подрядчик обязан своевременно предупредить заказчика
      о необходимости существенного превышения цены (ст. 709 п. 5 ГК РФ).
      Если превышение > 10% и подрядчик не уведомил — заказчик вправе отказаться
      от договора, оплатив фактически выполненное. Условия, лишающие заказчика
      этого права, — ничтожны.
    legal_base: "ст. 709 п. 5 ГК РФ"
    required_triggers: ["approximate_price"]
    severity: "critical"
    result_if_triggered: "warning"
    detector_type: "rules"
    rules:
      keywords:
        - "превышение сметы"
        - "увеличение цены"
        - "изменение стоимости"
        - "подрядчик обязан предупредить"
        - "существенное превышение"
        - "более 10%"
        - "уведомление о превышении"
      keyword_mode: "any"
      negative_keywords:
        - "подрядчик обязан немедленно предупредить заказчика"
        - "право заказчика отказаться при превышении"
    retrieval:
      context_k: 5
      boost_keywords:
        - "превышение сметы"
        - "увеличение стоимости"
        - "уведомление"
        - "ст. 709"
      rerank: true

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 5: CHECKS_V8 — LLM/hybrid проверки
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  - id: subject_and_result_extraction
    name: "Предмет: содержание работ и овеществлённый результат (ст. 702, 703 ГК РФ)"
    description: "Извлекает описание работ и конкретного овеществлённого результата. Отсутствие чёткого результата = риск незаключённости"
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "подрядчик обязуется"
        - "выполнить работы"
        - "результат работ"
        - "сдать результат"
        - "техническое задание"
        - "спецификация"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)подряд(чик)?\\s+обязуется\\s+выполнить"
        - "(?i)результат\\s+работ.*передать\\s+заказчику"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор подряда (§ 1 Главы 37 ГК РФ).
        Твоя задача — извлечь сведения о предмете договора.

        Ответь строго в JSON:
        {
          "work_description": "<описание работ или not_found>",
          "material_result": "<описание овеществлённого результата или not_found>",
          "technical_task_referenced": "<yes / no / not_found>",
          "result_definiteness": "<specific / vague / not_found>"
        }

        - "material_result": должен быть вещественным (изделие, отремонтированный объект, и т.п.),
          а не процессом. Если результат — нематериальный (консультация, обучение) — пиши "not_found".
        - "result_definiteness": "specific" — результат чётко описан; "vague" — описание размытое.

        ВАЖНО: Если значение явно не указано в тексте — пиши "not_found".
      prompt_file: null
      context_k: 6
      temperature: 0.0
      max_tokens: 512
    retrieval:
      context_k: 6
      max_chunks: 8
      boost_keywords:
        - "предмет договора"
        - "результат работ"
        - "техническое задание"
        - "спецификация"
        - "обязуется выполнить"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 50
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "work_description"
          type: "string"
          keyword_hints: ["подрядчик обязуется", "выполнить работы", "предмет"]
          description: "Описание содержания работ"
        - name: "material_result"
          type: "string"
          keyword_hints: ["результат работ", "сдать заказчику", "изготовить", "отремонтировать"]
          description: "Описание овеществлённого результата"
        - name: "technical_task_referenced"
          type: "string"
          allowed_values: ["yes", "no", "not_found"]
          description: "Ссылка на ТЗ/спецификацию как приложение"
        - name: "result_definiteness"
          type: "string"
          allowed_values: ["specific", "vague", "not_found"]
          description: "Конкретность описания результата"
      store_payload: true

  - id: deadlines_extraction
    name: "Сроки: начальный и конечный — существенные условия (ст. 708 ГК РФ)"
    description: "Начальный и конечный сроки — существенные условия договора подряда. Отсутствие хотя бы одного = риск незаключённости для коммерческих сторон"
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "начало работ"
        - "начальный срок"
        - "конечный срок"
        - "срок выполнения"
        - "срок завершения"
        - "не позднее"
        - "в течение"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"
        - "(?i)(не\\s+позднее|в\\s+течение)\\s+\\d+\\s*(календарн|рабоч|дн)"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор подряда.
        Найди в тексте сведения о сроках выполнения работ (ст. 708 ГК РФ).

        Ответь строго в JSON:
        {
          "start_date": "<дата начала или not_found>",
          "end_date": "<дата окончания или not_found>",
          "intermediate_deadlines": "<yes / no / not_found>",
          "deadline_snippet": "<цитата из договора или not_found>"
        }

        ВАЖНО: Если значение явно не указано — пиши "not_found".
        Промежуточные сроки — только если явно перечислены этапы.
      prompt_file: null
      context_k: 5
      temperature: 0.0
      max_tokens: 400
    retrieval:
      context_k: 5
      max_chunks: 6
      boost_keywords:
        - "срок выполнения"
        - "начало работ"
        - "конечный срок"
        - "не позднее"
        - "ст. 708"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 400
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "start_date"
          type: "string"
          keyword_hints: ["начало работ", "дата начала", "начальный срок"]
          description: "Начальный срок выполнения работ"
        - name: "end_date"
          type: "string"
          keyword_hints: ["срок завершения", "конечный срок", "не позднее"]
          description: "Конечный срок выполнения работ"
        - name: "intermediate_deadlines"
          type: "string"
          allowed_values: ["yes", "no", "not_found"]
          description: "Наличие промежуточных сроков (этапов)"
      store_payload: true

  - id: price_and_estimate_analysis
    name: "Цена: твёрдая/приблизительная смета, порядок согласования изменений (ст. 709 ГК РФ)"
    description: "Определяет тип цены и порядок согласования дополнительных расходов. Для коммерческих сторон — существенное условие"
    triggers:
      any: ["commercial_parties", "fixed_price", "approximate_price"]
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "твёрдая цена"
        - "твёрдая смета"
        - "приблизительная смета"
        - "цена работ"
        - "стоимость работ"
        - "смета"
        - "изменение цены"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)цен[аеуой]\\s+.*?\\d"
        - "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|тыс|млн)"
        - "(?i)(твёрд(ая|ой)|приблизительн(ая|ой))\\s+цен[аеуой]"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор подряда.
        Найди сведения о цене работ и порядке изменения сметы (ст. 709 ГК РФ).

        Ответь строго в JSON:
        {
          "price_type": "<fixed / approximate / not_specified / not_found>",
          "price_amount": "<сумма с валютой или not_found>",
          "price_change_procedure": "<described / not_described / not_found>",
          "additional_works_consent": "<required / not_required / not_found>",
          "price_snippet": "<цитата из договора или not_found>"
        }

        - "fixed" — цена твёрдая, изменению не подлежит
