        }

        - "preserved" — право сохранено, заказчик платит только фактически выполненное
        - "restricted" — право есть, но введены дополнительные штрафы/условия
        - "excluded" — договор запрещает отказ (условие ничтожно по ст. 422 ГК РФ)
