      store_payload: true

  - id: "unilateral_acceptance_mechanism"
    name: "Механизм односторонней приёмки при уклонении заказчика (ст. 720 ГК РФ)"
    description: "При уклонении заказчика от приёмки подрядчик вправе составить односторонний акт. Договорное закрепление снижает судебные риски"
    legal_base: "ст. 720 ГК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
