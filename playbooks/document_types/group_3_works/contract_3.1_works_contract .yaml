        - "(?i)возврат.*аванс"
        - "(?i)оплат.*фактически\\s+выполненн"

  - id: "assignment_restriction"
    name: "Уступка прав / перевод долга: ограничения (ГК РФ)"
    description: "Подрядчик не должен уступать право на оплату третьим лицам без согласия заказчика"
    legal_base: "ст. 382, 391 ГК РФ"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "уступка"
        - "переуступка"
