  - id: "acceptance_procedure"
    name: "Порядок сдачи-приёмки работ (ст. 720 ГК РФ)"
    description: "Процедура приёмки определяет момент перехода рисков и обязанность оплаты. Отсутствие — риск злоупотреблений с обеих сторон"
