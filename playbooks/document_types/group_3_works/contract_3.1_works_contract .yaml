        - name: "payment_method"
          type: "string"
          allowed_values: ["cashless_transfer", "cash", "mixed", "other", "not_found"]
          keyword_hints: ["безналичный расчёт", "наличными", "банковский перевод"]
          description: "Способ расчётов"
        - name: "advance_present"
          type: "string"
          allowed_values: ["yes", "no", "not_found"]
          keyword_hints: ["аванс", "предоплата", "авансовый платёж"]
          description: "Наличие аванса"
      store_payload: true

  - id: "penalty_for_delay_contractor"
    name: "Неустойка за просрочку выполнения работ (ст. 330, 708 ГК РФ)"
    description: "Без договорной неустойки заказчик сможет взыскать только убытки — крайне сложно доказуемые в суде"
    legal_base: "ст. 330, 708 ГК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "неустойка за просрочку"
        - "пеня"
        - "штраф за нарушение сроков"
        - "процент за каждый день просрочки"
        - "пени за просрочку"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)за\\s+нарушение\\s+сроков.*подрядчик.*уплачивает.*неустойку"
        - "(?i)пен[яи]\\s+.*\\d+.*%.*за.*каждый.*день"

  - id: "penalty_for_payment_delay_customer"
    name: "Неустойка за просрочку оплаты заказчиком (ст. 395 ГК РФ)"
    description: "Отсутствие договорной неустойки за просрочку оплаты снижает дисциплину расчётов. Применяется ст. 395 ГК РФ как минимум"
    legal_base: "ст. 395, 314, 711 ГК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "неустойка за просрочку оплаты"
        - "пени за задержку оплаты"
        - "проценты по ст. 395"
        - "штраф за неоплату"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)за\\s+нарушение\\s+сроков.*оплат.*заказчик.*уплачивает"
        - "(?i)ст\\.?\\s*395\\s+ГК\\s+РФ"

  - id: "warranty_period_and_defect_procedure"
    name: "Гарантийный срок и порядок предъявления претензий по качеству (ст. 722, 724 ГК РФ)"
    description: "Без договорного гарантийного срока действует 2 года (ст. 724). Важен порядок предъявления и срок устранения недостатков"
    legal_base: "ст. 722, 724, 721 ГК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "гарантийный срок"
        - "гарантия качества"
        - "устранение недостатков"
        - "безвозмездное исправление"
        - "скрытые недостатки"
        - "претензия по качеству"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)гарантийный\\s+срок\\s+составляет\\s+\\d+"
        - "(?i)недостатки.*устраняются.*в\\s+течение\\s+\\d+\\s+дней"
    extraction:
      enabled: true
      mode: "rules"
      fields:
        - name: "warranty_duration"
          type: "string"
          keyword_hints: ["гарантийный срок составляет", "в течение", "месяцев", "лет"]
          description: "Продолжительность гарантийного срока"
        - name: "defect_remedy_period"
          type: "string"
          keyword_hints: ["устранить недостатки", "в течение", "дней"]
          description: "Срок для устранения недостатков"
      store_payload: true

  - id: "risk_allocation_before_acceptance"
    name: "Распределение рисков случайной гибели материалов и результата (ст. 705 ГК РФ)"
    description: "По умолчанию риск несёт подрядчик до приёмки. При давальческих материалах — заказчик. Неясность → спор при форс-мажоре"
    legal_base: "ст. 705 ГК РФ"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "риск случайной гибели"
        - "несёт подрядчик"
        - "несёт заказчик"
        - "до момента приёмки"
        - "страхование рисков"
        - "случайное повреждение"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)риск.*случайной.*гибели.*(результата|материалов).*до.*приёмки"
        - "(?i)(несёт|несет)\\s+(подрядчик|заказчик)"

  - id: "subcontracting_conditions"
    name: "Условия привлечения субподрядчиков (ст. 706 ГК РФ)"
    description: "Без регулирования: подрядчик может привлечь ненадёжного субподрядчика. Для заказчика важно согласование; для подрядчика — операционная гибкость"
    legal_base: "ст. 706 ГК РФ"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "субподрядчик"
        - "только с согласия заказчика"
        - "запрещено привлекать"
        - "ответственность за субподрядчика"
        - "генеральный подрядчик"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)привлечение\\s+субподрядчик.*только.*письменного.*согласия"
        - "(?i)подрядчик.*несёт.*ответственность.*за.*субподрядчик"

  - id: "contractor_performance_personally"
    name: "Личное выполнение работ / запрет передачи третьим лицам (ст. 706 ГК РФ)"
    description: "Если заказчик нанял подрядчика как специалиста — важно закрепить личное выполнение и запрет на передачу. Критично при работе с физлицами"
    legal_base: "ст. 706 ГК РФ"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
      any: ["consumer_contractor"]
    rules:
      keywords:
        - "лично выполняет"
        - "без привлечения третьих лиц"
        - "личное участие"
        - "не вправе передавать"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)подрядчик.*обязан.*лично.*выполн"
        - "(?i)без\\s+привлечения\\s+третьих\\s+лиц"

  - id: "intermediate_inspection_right"
    name: "Право заказчика проверять ход работ (ст. 715 ГК РФ)"
    description: "Заказчик вправе проверять ход и качество работ в любое время, не вмешиваясь в деятельность подрядчика. Закрепление — инструмент раннего выявления рисков"
    legal_base: "ст. 715 ГК РФ"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "проверять ход работ"
        - "контроль качества"
        - "проверка хода выполнения"
        - "вправе проверить"
        - "промежуточная инспекция"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)заказчик.*вправе.*провер(ять|ить)\\s+(ход|качество)"

  - id: "hidden_works_documentation"
    name: "Скрытые работы: фиксация и промежуточная приёмка"
    description: "Скрытые работы (фундамент, проводка, трубы) должны быть актированы до их закрытия. Отсутствие актов = невозможность доказать объём при споре"
    legal_base: "ст. 720 ГК РФ; строительные нормы"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
