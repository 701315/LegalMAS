        - "коммерческая тайна"
        - "не раскрывать"
        - "конфиденциальная информация"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)конфиденциал"
        - "(?i)не\\s+разглаш"

  - id: "dispute_resolution_clause"
    name: "Порядок разрешения споров: досудебный и судебный"
    description: "Наличие претензионного порядка — обязательное условие для обращения в арбитражный суд (ст. 4 АПК РФ)"
    legal_base: "ст. 4 АПК РФ; ст. 432 ГК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
