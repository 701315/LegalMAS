    description: |
      Качество работ должно соответствовать условиям договора, а при их отсутствии —
      обычно предъявляемым требованиям (ст. 721 ГК РФ). Без чётких критериев
      приёмки и стандартов качества споры о соответствии результата неизбежны.
      Проверяет наличие ТЗ, ГОСТов, ТУ, образцов, критериев приёмки.
