        - "промежуточная приёмка"
        - "до закрытия"
        - "освидетельствование"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)акт.*на\\s+скрытые\\s+работы"
        - "(?i)промежуточн(ая|ой)\\s+приёмк"

  - id: "termination_grounds_and_consequences"
    name: "Расторжение: основания, последствия, взаиморасчёты (ст. 453, 715, 717 ГК РФ)"
    description: "Чёткий порядок расторжения предотвращает споры об объёме фактически выполненного и размере компенсации"
    legal_base: "ст. 453, 715, 717 ГК РФ"
    severity: "high"
