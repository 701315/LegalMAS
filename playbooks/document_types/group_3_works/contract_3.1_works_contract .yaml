    extraction:
      enabled: true
      mode: "rules"
      fields:
        - name: "assignment_restriction"
          type: "string"
          allowed_values: ["prohibited", "allowed_with_consent", "allowed", "unclear", "not_found"]
          keyword_hints: ["запрещается уступка", "без согласия запрещено", "с согласия другой стороны"]
          description: "Ограничения на уступку прав"
      store_payload: true

  - id: "confidentiality_clause"
    name: "Конфиденциальность условий договора и результатов работ"
    description: "При изготовлении уникальных изделий или переработке важных материалов условие о неразглашении защищает коммерческие интересы"
