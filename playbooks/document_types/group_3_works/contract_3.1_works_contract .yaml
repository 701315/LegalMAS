      keyword_mode: "any"
      regex_patterns:
        - "(?i)претензионный\\s+порядок"
        - "(?i)в\\s+арбитражный\\s+суд"

  - id: "vat_and_tax_allocation"
    name: "НДС и налоговые оговорки"
    description: "Важно для коммерческих сторон: включена ли цена НДС, кто уплачивает налоги, применяется ли УСН или самозанятость"
    legal_base: "НК РФ; ФЗ-422 (самозанятые)"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "НДС"
        - "в том числе НДС"
        - "без НДС"
        - "налог на профессиональный доход"
        - "самозанятый"
        - "УСН"
        - "не является плательщиком НДС"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)\\bНДС\\b"
        - "(?i)налог\\s+на\\s+профессиональный\\s+доход"

  - id: "force_majeure_clause"
    name: "Форс-мажор: определение и последствия (ст. 401 ГК РФ)"
    description: "Без чёткого определения форс-мажора стороны спорят о приостановке сроков. Важны: уведомление, максимальный период, право расторжения"
    legal_base: "ст. 401 ГК РФ"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "форс-мажор"
        - "обстоятельства непреодолимой силы"
        - "чрезвычайные обстоятельства"
        - "уведомление о форс-мажоре"
        - "приостановление сроков"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)форс.мажор"
        - "(?i)непреодолимой\\s+силы"

  - id: "intellectual_property_ownership"
    name: "Принадлежность результата интеллектуальной деятельности (ст. 1296 ГК РФ)"
    description: "Если результат работ — ПО, дизайн, проект — исключительное право по умолчанию принадлежит подрядчику. Нужно явное отчуждение"
    legal_base: "ст. 1296, 1297 ГК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "исключительное право"
        - "права на результат"
        - "интеллектуальная собственность"
        - "переходят к заказчику"
        - "отчуждение прав"
        - "проект"
        - "чертёж"
        - "программный код"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)исключительн(ое|ых)\\s+прав(о|а)"
        - "(?i)права.*результат.*переход(ят|ит).*заказчик"

  - id: "customer_cooperation_obligations"
    name: "Обязанности заказчика по содействию (ст. 718 ГК РФ)"
    description: "Заказчик обязан содействовать подрядчику: предоставить доступ, информацию, документы. Неисполнение — основание для продления сроков и приостановки работ"
    legal_base: "ст. 718, 719 ГК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "заказчик обязан содействовать"
        - "предоставить доступ"
        - "предоставить информацию"
        - "предоставить документы"
        - "содействие заказчика"
        - "контактное лицо"
        - "непредоставление информации"
        - "задержка по вине заказчика"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)заказчик\\s+обяз(ан|уется)\\s+(содействовать|предоставить)"
        - "(?i)ст\\.?\\s*718\\s+ГК\\s+РФ"

  - id: "governing_law"
    name: "Применимое право и подсудность"
    description: "Проверяет указание применимого законодательства"
    legal_base: "ГК РФ"
    severity: "low"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
