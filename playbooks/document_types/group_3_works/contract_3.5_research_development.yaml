          "success_only_payment_clause": "<yes / no / not_found>",
          "customer_refusal_right_on_futility": "<yes / no / not_found>",
          "risk_snippet": "<цитата из договора или not_found>"
        }

        - "success_only_payment_clause": "yes" — ОПАСНО, нарушает ст. 775 ГК РФ для НИР;
        - "customer_refusal_right_on_futility": право заказчика прекратить финансирование
          при явной бесперспективности исследования.

        ВАЖНО: Если значение явно не указано в тексте — пиши "not_found".
      prompt_file: null
      context_k: 6
      temperature: 0.0
      max_tokens: 500
    retrieval:
