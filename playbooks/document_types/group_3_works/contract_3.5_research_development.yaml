        - "оплата при неудаче"
        - "ст. 769 ГК РФ"
        - "ст. 775 ГК РФ"
        - "отрицательный результат"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "risk_bearer_identified"
          type: "string"
          allowed_values: ["customer", "contractor", "shared", "unclear", "not_found"]
          description: "Кто несёт риск недостижения результата"
        - name: "success_only_payment_clause"
          type: "string"
          allowed_values: ["yes", "no", "not_found"]
          description: "Есть ли незаконная оговорка об оплате только за успех (для НИР)"
      store_payload: true

  - id: ip_rights_allocation_analysis
    name: "Распределение прав на результаты интеллектуальной деятельности (ст. 772 ГК РФ)"
    description: "По умолчанию исключительные права принадлежат Исполнителю (ст. 772 ГК РФ). Для перехода к Заказчику нужно прямое условие. Анализирует распределение прав на РИД, фоновые РИД, побочные результаты и право использования"
