type: contract_3.5_research_development
name: "Договор на выполнение научно-исследовательских, опытно-конструкторских и технологических работ (НИОКР)"

description: |
  Регулирует отношения по проведению научных исследований (НИР), направленных на получение новых знаний,
  и опытно-конструкторских работ (ОКР), направленных на создание новых изделий, технологий или материалов.
  Ключевое отличие от подряда: принципиальная невозможность гарантировать успех. Заказчик финансирует
  поисковый процесс и по умолчанию несёт риск недостижения запланированного результата (ст. 769 ГК РФ).
  Результатом являются интеллектуальные активы (отчёты, ноу-хау, прототипы), права на которые требуют
  детального распределения.

version: 3.0
parent: class_3_work_performance

metadata:
  category: contract
  subcategory: work_performance
  complexity: high
  risk_level: critical
  jurisdiction: RU
  language: ru
  legal_base: "Глава 38 ГК РФ (ст. 769-778)"
  doc_types_supported:
    - "договор НИОКР"
    - "договор на выполнение НИР"
    - "договор на выполнение ОКР"
    - "договор на научно-исследовательские работы"
    - "договор на опытно-конструкторские работы"
    - "договор на технологические работы"
    - "R&D contract"
    - "соглашение о технологическом партнёрстве"
    - "договор на научно-техническую разработку"

engine_expectations:
  evidence_required: true
  evidence_style: "pinpoint"
  allow_not_found: true
  output_style: "dd_grid"
  prefer_structured_outputs: true

