doc_type_checks:

  - id: "subject_nir_okr_type"
    name: "Предмет: вид работ (НИР, ОКР, технологические), научно-техническая проблема (ст. 769 ГК РФ)"
    description: "Чёткое указание вида работ и научно-технической проблемы. Без разграничения НИР/ОКР невозможно правильно применить режим риска и правила личного исполнения"
    legal_base: "ст. 769, 432 ГК РФ"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "научно-исследовательские работы"
        - "опытно-конструкторские работы"
        - "НИР"
        - "ОКР"
        - "технологические работы"
        - "исполнитель обязуется провести"
        - "цель исследования"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(НИР|научно-исследовательск|ОКР|опытно-конструкторск|технологическ).*работ"
        - "(?i)исполнитель.*обязуется.*(провести|выполнить).*(исследован|разработ)"

  - id: "technical_assignment_as_attachment"
    name: "Техническое задание как неотъемлемое приложение (ст. 773 ГК РФ)"
    description: "ТЗ — главный инструмент контроля объёма и качества. Без ТЗ невозможно определить, выполнена ли работа и соответствует ли результат ожиданиям"
    legal_base: "ст. 773 ГК РФ"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
      any: ["technical_assignment_present"]
    rules:
      keywords:
        - "техническое задание"
        - "ТЗ"
        - "программа исследований"
        - "план научных работ"
        - "является неотъемлемой частью"
        - "приложение к договору"
      keyword_mode: "any"
      regex_patterns:
