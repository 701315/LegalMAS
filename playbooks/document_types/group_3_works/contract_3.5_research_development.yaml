          type: "string"
          allowed_values: ["staged", "advance_only", "completion_only", "mixed", "not_found"]
          description: "Структура платежей"
        - name: "customer_stop_right"
          type: "string"
          allowed_values: ["yes", "no", "not_found"]
          description: "Право Заказчика прекратить финансирование"
      store_payload: true

  - id: ip_fate_on_early_termination
    name: "Судьба РИД и промежуточных результатов при досрочном расторжении"
    description: |
      При досрочном расторжении НИОКР критически важно определить:
      кому достаются уже созданные РИД, промежуточные отчёты, прототипы;
      получает ли Заказчик лицензию на использование; возвращаются ли
      материалы; как соотносятся уплаченные суммы и объём переданных прав.
      Без этих условий — затяжные споры в суде.
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "при расторжении договора"
        - "при досрочном прекращении"
        - "права на созданные результаты при расторжении"
        - "промежуточные результаты передаются"
        - "лицензия сохраняется при расторжении"
        - "возврат уплаченных сумм"
        - "оплаченные этапы"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(при\\s+расторжени|при\\s+досрочном\\s+прекращени).*прав"
        - "(?i)промежуточн.*результат.*при.*расторжени"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор НИОКР.
        Проверь, как урегулирована судьба РИД и промежуточных результатов
        при досрочном расторжении договора.

        Ответь строго в JSON:
        {
          "ip_on_termination_addressed": "<yes / no / not_found>",
          "completed_stages_ip_transfer": "<to_customer / retained_by_contractor / proportional / not_specified / not_found>",
          "license_survives_termination": "<yes / no / not_specified / not_found>",
          "interim_reports_transfer": "<yes / no / not_specified / not_found>",
          "payment_for_completed_stages": "<full / proportional / none / not_specified / not_found>",
          "materials_return_obligation": "<yes / no / not_specified / not_found>",
          "termination_ip_snippet": "<цитата или not_found>"
        }

        - "completed_stages_ip_transfer": кому переходят права на результаты оплаченных этапов
        - "license_survives_termination": сохраняется ли лицензия Заказчика после расторжения

        ВАЖНО: Если условие явно не указано — пиши "not_found".
