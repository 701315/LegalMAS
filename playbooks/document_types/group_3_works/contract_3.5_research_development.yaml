        - "(?i)приложение.*№.*ТЗ|ТЗ.*приложение"
    extraction:
      enabled: true
      mode: "rules"
      fields:
        - name: "tz_status"
          type: "string"
          allowed_values: ["attached", "referenced", "absent", "not_found"]
          keyword_hints: ["является приложением", "прилагается", "указана в приложении"]
          description: "Статус ТЗ в договоре"
      store_payload: true

  - id: "risk_of_failure_allocation_clause"
    name: "Явное распределение риска недостижения результата (ст. 769 ГК РФ)"
    description: "Для НИР риск несёт Заказчик по умолчанию. Должно быть прямо указано в договоре. Без явного условия возникают споры при неудаче"
    legal_base: "ст. 769, 775 ГК РФ"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "риск недостижения результата"
        - "риск случайной невозможности исполнения"
        - "несёт заказчик"
        - "несет заказчик"
        - "отрицательный результат является результатом"
        - "ст. 769 ГК РФ"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)риск.*несёт.*заказчик"
        - "(?i)ст\\.?\\s*769\\s+ГК\\s+РФ"

  - id: "performance_deadlines_and_stages"
    name: "Сроки выполнения и этапный план (ст. 708, 773 ГК РФ)"
    description: "Сроки начала и окончания, этапный план с промежуточными результатами. Реалистичные сроки критически важны с учётом неопределённости НИОКР"
