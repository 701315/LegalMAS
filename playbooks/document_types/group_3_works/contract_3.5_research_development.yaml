  - id: "reporting_and_acceptance_procedure"
    name: "Порядок сдачи-приёмки результатов: отчёты, прототипы, акты (ст. 773 ГК РФ)"
    description: "НИОКР сдаётся поэтапно через отчёты и акты. Заказчик вправе отказаться от приёмки только при наличии мотивированных возражений"
    legal_base: "ст. 773, 720 ГК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "акт сдачи-приёмки"
        - "научно-технический отчёт"
        - "технический отчёт по этапу"
        - "мотивированный отказ"
        - "приёмка результатов"
        - "приёмочная комиссия"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)акт\\s+(сдачи-приёмки|выполненных|приёмки)"
        - "(?i)(научно-технический\\s+отчёт|НТО)"
        - "(?i)мотивированн.*отказ"
    extraction:
      enabled: true
      mode: "rules"
      fields:
        - name: "review_period_days"
          type: "number"
          keyword_hints: ["в течение", "рабочих дней", "календарных дней", "срок рассмотрения"]
          unit: "days"
          description: "Срок рассмотрения отчёта Заказчиком"
        - name: "auto_acceptance"
          type: "string"
          allowed_values: ["yes", "no", "not_found"]
          keyword_hints: ["считаются принятыми", "считаются выполненными", "молчание"]
          description: "Автоматическая приёмка при молчании"
      store_payload: true

  - id: "limitation_of_liability_rd"
    name: "Ограничение ответственности прямыми убытками (ст. 15, 393 ГК РФ)"
    description: "Затраты на НИОКР значительны, но упущенная выгода Заказчика от неполучения коммерческого продукта может быть колоссальной. Без cap ответственности Исполнитель несёт непосильный риск за то, что по закону — риск Заказчика"
    legal_base: "ст. 15, 393, 401 ГК РФ"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "ответственность ограничена суммой договора"
        - "не возмещаются косвенные убытки"
        - "не возмещается упущенная выгода"
        - "только прямой реальный ущерб"
        - "максимальный размер ответственности"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)исполнитель.*не.*несёт.*ответственности.*за.*косвенные.*убытки"
        - "(?i)ответственность.*ограничена.*суммой.*договора"
    extraction:
      enabled: true
      mode: "rules"
      fields:
        - name: "liability_cap_type"
          type: "string"
          allowed_values: ["contract_price", "stage_price", "fixed_amount", "unlimited", "not_found"]
          keyword_hints: ["ограничена суммой договора", "не превышает стоимости этапа", "максимальный размер"]
          description: "Тип ограничения ответственности"
        - name: "consequential_damages_excluded"
          type: "string"
          allowed_values: ["yes", "no", "not_found"]
          keyword_hints: ["косвенные убытки", "упущенная выгода", "не возмещаются"]
          description: "Исключены ли косвенные убытки"
      store_payload: true

  - id: "termination_for_convenience_and_settlement"
    name: "Право Заказчика на односторонний отказ и взаиморасчёты (ст. 310, 450.1 ГК РФ)"
    description: "Заказчик может утратить интерес к теме или изменить стратегию. Право отказа с оплатой фактически выполненных работ — важный инструмент управления рисками. Без него отказ = нарушение с полным возмещением убытков"
    legal_base: "ст. 310, 450.1 ГК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "право на односторонний отказ"
        - "прекращение договора по инициативе заказчика"
        - "оплата фактически выполненных работ"
        - "возмещение документально подтверждённых расходов"
        - "уведомление об отказе"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)заказчик.*вправе.*в\\s+одностороннем.*порядке.*отказаться.*от\\s+договора"
        - "(?i)ст\\.?\\s*450\\.?1\\s+ГК\\s+РФ"

  - id: "contractor_withdrawal_on_ip_conflict"
    name: "Право Исполнителя прекратить работы при возникновении патентного конфликта (ст. 773 ГК РФ)"
    description: "В ходе работ Исполнитель может обнаружить, что продолжение приведёт к нарушению прав третьих лиц. Без права на остановку он вынужден выбирать между нарушением договора и нарушением патента"
    legal_base: "ст. 773 ГК РФ"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "право приостановить работы при патентном конфликте"
        - "выявление прав третьих лиц в ходе работ"
        - "уведомление о патентных ограничениях"
        - "невозможность продолжения без нарушения патентных прав"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)исполнитель.*обязан.*уведомить.*о.*выявленных.*правах.*третьих.*лиц"
        - "(?i)патентный.*конфликт"

  - id: "dispute_resolution_technical_expertise_rd"
    name: "Досудебный порядок и техническая экспертиза для НИОКР-споров"
    description: "Споры о качестве и объёме НИОКР требуют специализированных научно-технических экспертиз. Порядок назначения, выбора эксперта и распределения расходов должен быть определён заранее"
    legal_base: "АПК РФ; ГПК РФ"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "научно-техническая экспертиза"
        - "досудебный порядок"
        - "претензионный порядок"
        - "экспертная организация по согласованию"
        - "независимая экспертиза качества"
        - "привлечение специалистов"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)претензионный\\s+порядок"
        - "(?i)научно.техническ.*экспертиз"

  - id: "force_majeure_rd_specific"
    name: "Форс-мажор для НИОКР (включая запрет на технологии и санкции) (ст. 401 ГК РФ)"
    description: "Специфика НИОКР: санкционные ограничения на технологии и оборудование, отзыв лицензий на ПО, ограничения доступа к научным базам данных — реальные форс-мажорные риски"
    legal_base: "ст. 401, 416, 417 ГК РФ"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "форс-мажор"
        - "обстоятельства непреодолимой силы"
        - "санкционные ограничения"
        - "недоступность технологий"
        - "уведомление о форс-мажоре"
        - "продление сроков"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)форс.мажор"
        - "(?i)непреодолимой\\s+силы"

  - id: "tax_accounting_rd_expenses"
    name: "Налоговый учёт расходов на НИОКР (ст. 262 НК РФ)"
    description: "Расходы на НИОКР имеют специальный порядок учёта (ст. 262 НК РФ), в т.ч. с коэффициентом 1.5 для ряда исследований. Необходима корректная квалификация работ для налогового учёта Заказчика"
    legal_base: "ст. 262 НК РФ"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "налоговый учёт расходов на НИОКР"
        - "ст. 262 НК РФ"
        - "квалификация работ для налогообложения"
        - "документы для налогового учёта"
        - "регистрация НИОКР"
        - "отчёт для налоговых органов"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)ст\\.?\\s*262\\s+НК\\s+РФ"
        - "(?i)налоговый\\s+учёт.*НИОКР"

  - id: "parties_identification_rd"
    name: "Стороны договора: идентификация заказчика и исполнителя"
    description: "Проверяет наличие и достаточность идентификации сторон"
    legal_base: "ст. 432, 769 ГК РФ"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "заказчик"
        - "исполнитель"
        - "именуем"
        - "в лице"
        - "действующего на основании"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(заказчик|исполнитель).*именуем"
    extraction:
      enabled: true
      mode: "rules"
      fields:
        - name: "customer_type"
          type: "string"
          allowed_values: ["legal_entity", "state_entity", "individual", "unclear"]
          keyword_hints: ["ООО", "ПАО", "АО", "ФГБУ", "ФГУП", "министерство", "гражданин"]
          description: "Тип заказчика"
        - name: "contractor_type"
          type: "string"
          allowed_values: ["legal_entity", "research_institute", "university", "individual", "unclear"]
          keyword_hints: ["ООО", "ФГБУН", "ФГБНУ", "НИИ", "университет", "ИП"]
          description: "Тип исполнителя"
      store_payload: true

  - id: "governing_law_rd"
    name: "Применимое право и подсудность"
    description: "Проверяет указание применимого законодательства"
    legal_base: "ГК РФ"
    severity: "low"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "применимое право"
        - "регулируется законодательством"
        - "Российской Федерации"
        - "арбитражный суд"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)законодательств(о|ом)\\s+Российск"

  - id: "non_compete_non_circumvention_rd"
    name: "Запрет конкуренции и обхода (non-compete / non-circumvention)"
    description: "Проверяет наличие ограничений на использование Исполнителем результатов для конкурентов Заказчика или на самостоятельную коммерциализацию"
    legal_base: "ст. 421 ГК РФ (свобода договора)"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "запрет конкуренции"
        - "non-compete"
        - "не выполнять аналогичные работы"
        - "не использовать результаты в интересах конкурентов"
        - "эксклюзивность"
        - "не вправе предлагать результаты третьим лицам"
        - "запрет обхода"
        - "non-circumvention"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(запрет|не\\s+вправе).*конкурент"
        - "(?i)non[\\s\\-]?compete"
        - "(?i)эксклюзивн(ость|ое|ый)"

  - id: "rd_insurance_liability"
    name: "Страхование ответственности исследователя и оборудования"
    description: "Проверяет наличие требований о страховании профессиональной ответственности, оборудования, опытных образцов"
    legal_base: "ГК РФ (общие положения)"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "страхование ответственности"
        - "страхование оборудования"
        - "страховой полис"
        - "страхование образцов"
        - "профессиональная ответственность"
        - "страхование результатов"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)страхов(ание|ка).*ответственност"
        - "(?i)страхов(ание|ка).*оборудован"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 7: DD_REQUEST_TEMPLATES
#  Читается: DDRequestTemplateLoader
#  Ключи = check_id из checks_v8 и doc_type_checks выше.
#  DDRequestTemplateLoader.render() матчит по exact или prefix.
# ════════════════════════════════════════════════════════════════════════════

dd_request_templates:

  subject_nir_okr_type:
    text: >
      Просим уточнить в {doc_names}: (а) точный вид работ — НИР, ОКР или комплексный
      договор (НИР + ОКР); (б) формулировку научно-технической проблемы; (в) цель работ.
      Различие НИР/ОКР критично для режима риска и правил личного исполнения
      (ст. 769, 770 ГК РФ).
    addressee: "Обе стороны"

  technical_assignment_as_attachment:
    text: >
      Просим подтвердить по {doc_names}: (а) ТЗ является приложением к договору или
      существует как отдельный документ; (б) ТЗ содержит цели, задачи, методы, ожидаемые
      результаты (включая возможность отрицательного); (в) ТЗ подписано обеими сторонами
      (ст. 773 ГК РФ). Без ТЗ невозможно определить соответствие результата.
    addressee: "Обе стороны"

  risk_of_failure_allocation_clause:
    text: >
      Просим уточнить в {doc_names}: (а) явно ли указано, кто несёт риск недостижения
      результата (ст. 769 ГК РФ — по умолчанию Заказчик); (б) что происходит с оплатой
      при неудаче не по вине Исполнителя (ст. 775 ГК РФ); (в) признан ли отрицательный
      результат результатом работ.
    addressee: "Юридический советник"

  performance_deadlines_and_stages:
    text: >
      Просим уточнить в {doc_names}: (а) даты начала и окончания работ; (б) этапный план
      с промежуточными вехами и датами; (в) реалистичность сроков с учётом неопределённости
      НИОКР (ст. 708, 773 ГК РФ). Рекомендуется предусмотреть механизм продления сроков
      при форс-мажоре или выявлении непредвиденных технических сложностей.
    addressee: "Обе стороны"

  cost_estimate_and_payment_terms:
    text: >
      Просим уточнить в {doc_names}: (а) общую стоимость работ; (б) включает ли НДС;
      (в) структуру платежей по этапам; (г) соответствует ли порядок оплаты ст. 775 ГК РФ
      (нельзя полностью ставить оплату в зависимость от успеха для НИР).
    addressee: "Обе стороны"

  exclusive_ip_rights_transfer_clause:
    text: >
      Просим уточнить в {doc_names}: (а) кому принадлежат исключительные права на созданные
      РИД (по умолчанию — Исполнителю, ст. 772 ГК РФ); (б) если предусмотрен переход к
      Заказчику — полный или частичный; (в) на чьё имя подаётся заявка на патент;
      (г) право Заказчика на использование при сохранении прав у Исполнителя.
    addressee: "Юридический советник"

  background_ip_retention_clause:
    text: >
      Просим включить в {doc_names} явную оговорку о фоновых РИД: (а) ранее созданные
      ноу-хау, методики, инструменты Исполнителя не переходят Заказчику; (б) Заказчик
      получает лицензию на использование фоновых РИД только в части, необходимой для
      использования результатов договора (ст. 772 ГК РФ).
    addressee: "Юридический советник исполнителя"

  side_results_ownership_and_reporting:
    text: >
      Просим предусмотреть в {doc_names}: (а) обязанность Исполнителя уведомлять Заказчика
      о побочных (незапланированных) результатах; (б) права на них — рекомендуется:
      принадлежат Исполнителю с преимущественным правом Заказчика на лицензию
      (ст. 772 ГК РФ).
    addressee: "Юридический советник"

  patent_purity_warranty:
    text: >
      Просим подтвердить по {doc_names}: (а) обязанность Исполнителя провести патентные
      исследования; (б) гарантию патентной чистоты результатов (ст. 773 ГК РФ);
      (в) последствия нарушения — возмещение убытков Заказчика от патентных исков.
      Нарушение патента при коммерциализации = полная остановка производства.
    addressee: "Исполнитель"

  confidentiality_pre_patent_nda:
    text: >
      Просим уточнить в {doc_names}: (а) срок действия обязательств по конфиденциальности;
      (б) запрет публикаций до подачи заявки на патент (ст. 1350 ГК РФ — потеря новизны);
      (в) режим ноу-хау для результатов, не патентуемых (ст. 1465 ГК РФ); (г) санкции
      за разглашение; (д) круг лиц с допуском к конфиденциальным сведениям (ст. 771 ГК РФ).
    addressee: "Обе стороны"

  publication_rights_and_patent_procedure:
    text: >
      Просим уточнить в {doc_names}: (а) порядок согласования публикаций — только с
      письменного согласия Заказчика или по истечении срока для патентования; (б) кто
      несёт расходы на патентование; (в) кто подаёт заявку на патент (ст. 1371 ГК РФ);
      (г) порядок проверки патентоспособности.
    addressee: "Обе стороны"

  staged_funding_and_customer_stop_right:
    text: >
      Просим уточнить в {doc_names}: (а) разбивку финансирования по этапам; (б) право
      Заказчика приостановить финансирование следующего этапа при неудовлетворительных
      результатах предыдущего; (в) порядок уведомления и расчётов при остановке (ст. 775
      ГК РФ). Это ключевой инструмент контроля рисков Заказчика.
    addressee: "Заказчик"

  payment_for_negative_result_nir:
    text: >
      Просим подтвердить в {doc_names}: при недостижении цели НИР не по вине Исполнителя
      работы оплачиваются по фактически выполненному объёму (ст. 775 ГК РФ).
      Условие «оплата только за успешный прототип» — недействительно для НИР.
      Просим исключить подобные оговорки из договора.
    addressee: "Юридический советник"

  personal_performance_and_subcontractors_nir:
    text: >
      Просим уточнить в {doc_names}: (а) предусмотрено ли личное исполнение НИР
      (ст. 770 ГК РФ — презумпция для НИР); (б) порядок привлечения соисполнителей —
      только с письменного согласия Заказчика; (в) список согласованных соисполнителей
      как приложение (если применимо).
    addressee: "Исполнитель"

  reporting_and_acceptance_procedure:
    text: >
      Просим уточнить в {doc_names}: (а) форматы отчётности — НТО, технические отчёты
      по этапам, промежуточные сводки; (б) срок рассмотрения отчёта Заказчиком;
      (в) форма мотивированного отказа от приёмки; (г) механизм разрешения разногласий
      по качеству отчёта (ст. 773, 720 ГК РФ).
    addressee: "Обе стороны"

  limitation_of_liability_rd:
    text: >
      Просим включить в {doc_names} ограничение ответственности Исполнителя: (а) cap
      ответственности — не более стоимости этапа или договора; (б) исключение косвенных
      убытков и упущенной выгоды (риск Заказчика по ст. 769 ГК РФ); (в) ответственность
      только за прямой реальный ущерб (ст. 15, 393 ГК РФ).
    addressee: "Юридический советник исполнителя"

  termination_for_convenience_and_settlement:
    text: >
      Просим предусмотреть в {doc_names}: (а) право Заказчика на отказ от договора с
      уведомлением за [N] дней; (б) оплата фактически выполненных работ + документально
      подтверждённые расходы Исполнителя; (в) судьба результатов выполненных этапов —
      переходят Заказчику с уплатой; (г) запрет использования результатов при неоплате
      (ст. 310, 450.1 ГК РФ).
    addressee: "Юридический советник"

  contractor_withdrawal_on_ip_conflict:
    text: >
      Просим предусмотреть в {doc_names}: право и обязанность Исполнителя немедленно
      уведомить Заказчика при выявлении патентного конфликта в ходе работ (ст. 773 ГК РФ),
      приостановить работы и совместно определить дальнейшие действия (обход патента,
      лицензирование, смена направления).
    addressee: "Юридический советник исполнителя"

  dispute_resolution_technical_expertise_rd:
    text: >
      Просим уточнить в {doc_names}: (а) претензионный порядок (срок — 30 дней);
      (б) при технических спорах — привлечение независимого эксперта из согласованного
      пула специализированных организаций; (в) распределение расходов на экспертизу;
      (г) подсудность — суд по месту нахождения ответчика или выбранный суд.
    addressee: "Юридический советник"

  force_majeure_rd_specific:
    text: >
      Просим уточнить в {doc_names}: (а) перечень форс-мажора (включая санкционные
      ограничения на технологии, отзыв лицензий на ПО, недоступность научных баз данных);
      (б) срок уведомления; (в) максимальный период приостановки; (г) право на расторжение
      при длительном форс-мажоре (ст. 401, 417 ГК РФ).
    addressee: "Обе стороны"

  tax_accounting_rd_expenses:
    text: >
      Просим уточнить в {doc_names}: (а) предусмотрены ли документы для налогового учёта
      расходов на НИОКР Заказчиком (ст. 262 НК РФ); (б) обязанность Исполнителя предоставить
      отчёт НИОКР для налоговых органов; (в) корректная квалификация работ как «НИОКР»
      в актах (для применения коэффициента 1.5 при наличии оснований).
    addressee: "Заказчик"

  guaranteed_result_disqualification:
    text: >
      Внимание: в {doc_names} обнаружены признаки того, что результат гарантирован или
      работа является рутинной без исследовательской составляющей. НИОКР (Глава 38 ГК РФ)
      применяется только при наличии элемента научного поиска и неопределённости.
      Просим уточнить: применяется ли общий подряд (Глава 37) или ПИР (§ 4 Главы 37)?
    addressee: "Юридический советник"

  success_only_payment_nir_illegal:
    text: >
      Внимание: в {doc_names} обнаружена оговорка об оплате только за успешный результат.
      Для НИР такое условие противоречит ст. 775 ГК РФ и может быть признано
      недействительным. Просим: (а) исключить оговорку; (б) заменить на законный порядок:
      оплата фактически выполненных работ при неудаче не по вине Исполнителя.
    addressee: "Юридический советник"

  unauthorized_subcontractors_nir:
    text: >
      Внимание: в {doc_names} предусмотрено привлечение соисполнителей без согласия
      Заказчика. Для НИР это нарушает ст. 770 ГК РФ (презумпция личного исполнения).
      Просим: (а) добавить требование письменного согласия Заказчика; (б) согласовать
      список конкретных соисполнителей как приложение.
    addressee: "Исполнитель"

  ip_fate_on_early_termination:
    text: >
      Просим включить в {doc_names}: (а) кому переходят права на РИД оплаченных этапов
      при досрочном расторжении; (б) сохраняется ли лицензия Заказчика; (в) порядок
      передачи промежуточных отчётов и прототипов; (г) расчёт оплаты за выполненную часть;
      (д) обязанность вернуть конфиденциальные материалы.
    addressee: "Юридический советник"

  materials_data_return_check:
    text: >
      Просим включить в {doc_names}: (а) обязанность вернуть предоставленное оборудование,
      образцы и сырьё; (б) порядок передачи экспериментальных данных; (в) судьбу прототипов
      и макетов; (г) сроки возврата; (д) порядок уничтожения конфиденциальных материалов.
    addressee: "Обе стороны"

  parties_identification_rd:
    text: >
      Просим подтвердить полные реквизиты сторон по {doc_names}: наименование,
      ИНН, ОГРН, адрес, документы уполномоченных лиц, научный руководитель (если применимо).
    addressee: "Обе стороны"

  governing_law_rd:
    text: >
      Просим подтвердить в {doc_names}: применимое право, подсудность,
      язык документов.
    addressee: "Юридический советник"

  non_compete_non_circumvention_rd:
    text: >
      Просим согласовать в {doc_names}: (а) ограничения на выполнение аналогичных
      работ для конкурентов Заказчика; (б) срок действия запрета; (в) территорию
      действия; (г) компенсацию Исполнителю за ограничение (при наличии);
      (д) исключения (академические исследования, ранее начатые проекты).
    addressee: "Юридический советник"

  rd_insurance_liability:
    text: >
      Просим уточнить в {doc_names}: (а) требуется ли страхование профессиональной
      ответственности Исполнителя; (б) страхование предоставленного оборудования;
      (в) страхование опытных образцов; (г) минимальная страховая сумма.
    addressee: "Исполнитель"

  government_funded_rd_registration:
    text: >
      ВНИМАНИЕ: {doc_names} финансируется из бюджетных средств. Просим подтвердить:
      (а) регистрацию НИОКР в ЕГИСУ; (б) соблюдение требований Постановления
      Правительства РФ № 327; (в) порядок учёта результатов в Едином реестре.
    addressee: "Исполнитель"

  export_control_dual_use_technologies:
    text: >
      ВНИМАНИЕ: в {doc_names} выявлены признаки технологий двойного назначения.
      Просим предоставить: (а) анализ применимости экспортного контроля (ФЗ-183);
      (б) лицензию ФСТЭК (при необходимости); (в) подтверждение отсутствия
      ограничений на передачу результатов иностранным лицам.
    addressee: "Юридический советник / Служба экспортного контроля"

  # Generic fallback
  _default:
    text: >
      Просим предоставить дополнительную информацию по вопросу «{check_name}»
      применительно к {doc_names}.
    addressee: "Юридический советник"