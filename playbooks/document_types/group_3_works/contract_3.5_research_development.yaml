        - "(?i)заказчик.*вправе.*приостановить.*финансирование"
        - "(?i)оплат.*по.*результатам.*этапа"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор НИОКР.
        Проверь структуру финансирования и право Заказчика на прекращение работ
