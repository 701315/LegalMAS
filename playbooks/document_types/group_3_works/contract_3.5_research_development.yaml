    name: "Условие о переходе исключительных прав на РИД к Заказчику (ст. 772 ГК РФ)"
    description: "По умолчанию права остаются у Исполнителя. Без прямого условия Заказчик получает только лицензию, не может запрещать использование конкурентам или свободно дорабатывать результат"
