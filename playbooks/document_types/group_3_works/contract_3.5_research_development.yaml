        - "промежуточные результаты"
        - "права при расторжении"
        - "оплаченные этапы"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "ip_on_termination_addressed"
          type: "string"
          allowed_values: ["yes", "no", "not_found"]
          description: "Урегулирована ли судьба РИД при расторжении"
        - name: "completed_stages_ip_transfer"
          type: "string"
          allowed_values: ["to_customer", "retained_by_contractor", "proportional", "not_specified", "not_found"]
          description: "Кому переходят права на результаты оплаченных этапов"
      store_payload: true

  - id: materials_data_return_check
    name: "Возврат материалов, образцов, данных и оборудования (ст. 773 ГК РФ)"
    description: |
      При завершении или расторжении НИОКР стороны должны урегулировать:
      возврат предоставленного оборудования, образцов, сырья; передачу
      экспериментальных данных; уничтожение конфиденциальных материалов;
      судьбу прототипов и макетов.
    triggers: {}
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "возврат материалов"
        - "возврат оборудования"
        - "возврат образцов"
        - "передача экспериментальных данных"
        - "уничтожение конфиденциальных"
        - "судьба прототипов"
        - "предоставленное оборудование"
        - "демонтаж"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)возврат.*(материал|оборудован|образц|данн)"
        - "(?i)(уничтожен|удален).*конфиденциальн"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор НИОКР.
        Проверь условия возврата материалов, образцов и данных при завершении
        или расторжении договора.

        Ответь строго в JSON:
        {
          "materials_return_clause": "<yes / no / not_found>",
          "equipment_return_obligation": "<yes / no / not_applicable / not_found>",
          "experimental_data_transfer": "<yes / no / not_found>",
          "prototype_disposition": "<to_customer / destroyed / retained / not_specified / not_found>",
          "confidential_materials_destruction": "<yes / no / not_found>",
          "return_deadline_specified": "<yes / no / not_found>",
          "materials_snippet": "<цитата или not_found>"
        }

        ВАЖНО: Если условие явно не указано — пиши "not_found".
      prompt_file: null
      context_k: 5
      temperature: 0.0
      max_tokens: 400
    retrieval:
      context_k: 5
      max_chunks: 8
      boost_keywords:
        - "возврат материалов"
        - "оборудование"
        - "экспериментальные данные"
        - "прототип"
        - "уничтожение"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "materials_return_clause"
          type: "string"
          allowed_values: ["yes", "no", "not_found"]
          description: "Наличие условия о возврате материалов"
        - name: "prototype_disposition"
          type: "string"
          allowed_values: ["to_customer", "destroyed", "retained", "not_specified", "not_found"]
          description: "Судьба прототипов"
      store_payload: true

