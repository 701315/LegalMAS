    name: "Гарантия патентной чистоты результатов (ст. 773 ГК РФ)"
    description: "Исполнитель гарантирует, что результат не нарушает патентных прав третьих лиц. Патентный иск при коммерциализации — полная остановка производства и колоссальные убытки"
