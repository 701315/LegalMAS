        }

        - "staged" — оплата разбита по этапам;
        - "customer_stop_right": право Заказчика прекратить финансирование при
          неудовлетворительных промежуточных результатах или бесперспективности темы.

        ВАЖНО: Если значение явно не указано — пиши "not_found".
