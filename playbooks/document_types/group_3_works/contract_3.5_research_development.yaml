  date_pattern: "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"
  date_period: "(?i)(не\\s+позднее|в\\s+течение)\\s+\\d+\\s*(календарн|рабоч|дн|месяц)"
  rid_transfer_pattern: "(?i)(исключительн.*прав.*переход|передач.*исключительн.*прав|патент.*на.*имя.*заказчика)"
  confidentiality_period: "(?i)в\\s+течение\\s+\\d+\\s*(лет|год|месяц)"
  patent_article_ref: "(?i)ст\\.?\\s*(1350|1354|1371|1465)\\s+ГК\\s+РФ"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: COMPLIANCE RULES
#  Читается: DocTypeCheckLoader._exclusion_logic_to_checks()
# ════════════════════════════════════════════════════════════════════════════

compliance_rules:

  - id: "guaranteed_result_disqualification"
    name: "Дисквалификация: гарантированный или рутинный результат (не НИОКР)"
    description: |
      Договор НИОКР (Глава 38 ГК РФ) применяется только когда результат принципиально
      неизвестен и содержит элемент научного поиска. Если результат гарантирован
      технически (как в подряде или ПИР) или работа является рутинными испытаниями
      без исследовательской составляющей — это не НИОКР.
    legal_base: "ст. 769 ГК РФ"
    required_triggers: []
    severity: "critical"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      keywords:
        - "гарантирует достижение результата"
        - "гарантирует работоспособность"
        - "рутинные испытания"
        - "стандартное проектирование"
        - "выполнение по готовой документации"
        - "серийное производство"
      keyword_mode: "any"
    retrieval:
      context_k: 4
      boost_keywords:
        - "предмет договора"
        - "гарантирует результат"
        - "испытания"
      rerank: true

  - id: "success_only_payment_nir_illegal"
    name: "Незаконное условие: оплата только за успешный результат при НИР (ст. 775 ГК РФ)"
    description: |
      Для НИР риск недостижения цели несёт Заказчик (ст. 769 ГК РФ). Условие
      «оплата только за работающий прототип», «оплата по факту успеха» или аналогичные
      противоречат ст. 775 ГК РФ и могут быть признаны недействительными.
      Исполнитель при недостижении цели не по своей вине получает оплату фактически
      выполненных работ.
    legal_base: "ст. 769, 775 ГК РФ"
    required_triggers: ["nir_keywords"]
    severity: "critical"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      keywords:
        - "оплата только при успешном результате"
        - "оплата по факту работающего образца"
        - "вознаграждение только при достижении цели"
        - "оплата при условии положительного результата"
        - "оплата если результат достигнут"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "порядок оплаты"
        - "условие оплаты"
        - "успешный результат"
        - "ст. 775 ГК РФ"
      rerank: true

  - id: "unauthorized_subcontractors_nir"
    name: "Несогласованное привлечение соисполнителей при НИР (ст. 770 ГК РФ)"
    description: |
      Для НИР установлена презумпция личного исполнения (ст. 770 ГК РФ).
      Привлечение соисполнителей без согласия Заказчика является нарушением договора.
      Любое упоминание соисполнителей без оговорки об обязательном письменном согласии
      Заказчика — правовой риск для Исполнителя.
    legal_base: "ст. 770 ГК РФ"
    required_triggers: ["nir_keywords", "subcontractors_present"]
    severity: "critical"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      keywords:
        - "вправе привлекать соисполнителей без согласования"
        - "самостоятельно привлекать третьих лиц"
        - "без уведомления заказчика"
        - "по своему усмотрению привлекает субподрядчиков"
      keyword_mode: "any"
      negative_keywords:
        - "с письменного согласия заказчика"
        - "по согласованию с заказчиком"
        - "с предварительного одобрения"
    retrieval:
      context_k: 5
      boost_keywords:
        - "соисполнители"
        - "третьи лица"
        - "согласие заказчика"
        - "ст. 770 ГК РФ"
      rerank: true

  - id: "government_funded_rd_registration"
    name: "Обязательная регистрация НИОКР в ЕГИСУ (госфинансирование)"
    description: |
      При выполнении НИОКР за счёт бюджетных средств Исполнитель обязан
      зарегистрировать работу в ЕГИСУ НИОКР. Результаты подлежат учёту
      в Едином реестре. Нарушение — административная ответственность
      и невозможность подтвердить расходы.
    legal_base: "Постановление Правительства РФ от 12.04.2013 № 327; ФЗ от 23.08.1996 № 127-ФЗ"
    required_triggers: ["government_funded_rd"]
    severity: "critical"
    result_if_triggered: "warning"
    detector_type: "rules"
    rules:
      keywords:
        - "ЕГИСУ НИОКР"
        - "регистрация НИОКР"
        - "единый реестр"
        - "учётная карточка"
        - "регистрационный номер НИОКР"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "ЕГИСУ"
        - "регистрация"
        - "государственный контракт"
        - "бюджетное финансирование"
      rerank: true

  - id: "export_control_dual_use_technologies"
    name: "Экспортный контроль: двойные технологии и санкционные ограничения"
    description: |
      Результаты НИОКР, относящиеся к технологиям двойного назначения, подлежат
      экспортному контролю (ФЗ-183). Передача результатов иностранным лицам без
      лицензии ФСТЭК — уголовная ответственность (ст. 189 УК РФ).
    legal_base: "ФЗ от 18.07.1999 № 183-ФЗ «Об экспортном контроле»; ст. 189 УК РФ"
    required_triggers: ["dual_use_defense"]
    severity: "critical"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      keywords:
        - "двойного назначения"
        - "экспортный контроль"
        - "ФСТЭК"
        - "лицензия на экспорт"
        - "контролируемые технологии"
        - "иностранный заказчик"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "двойное назначение"
        - "экспортный контроль"
        - "ФСТЭК"
        - "иностранный"
      rerank: true

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 5: CHECKS_V8 — LLM/hybrid проверки
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  - id: technical_assignment_and_research_program_extraction
    name: "Техническое задание и программа исследований (ст. 773 ГК РФ)"
    description: "Без детального ТЗ невозможно оценить, выполнена ли работа и соответствует ли результат ожиданиям. Анализирует наличие ТЗ, описание целей, методов, ожидаемых результатов (включая возможность отрицательного)"
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "техническое задание"
        - "ТЗ"
        - "программа исследований"
        - "план научных работ"
        - "цели и задачи"
        - "методы исследований"
        - "ожидаемые результаты"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)техническое\\s+задание.*является.*приложением"
        - "(?i)приложение.*№.*техническое\\s+задание"
        - "(?i)(программа.*исследований|план.*научных\\s+работ)"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор НИОКР (Глава 38 ГК РФ).
        Извлеки сведения о техническом задании и программе исследований.

        Ответь строго в JSON:
        {
          "technical_assignment_present": "<yes / referenced / absent / not_found>",
          "research_goals_described": "<yes / partial / no / not_found>",
          "methods_specified": "<yes / no / not_found>",
          "expected_results_listed": "<yes / no / not_found>",
          "negative_result_acknowledged": "<yes / no / not_found>",
          "work_type": "<NIR / OKR / combined / unclear / not_found>",
          "tz_snippet": "<цитата из договора или not_found>"
        }

        - "technical_assignment_present": "yes" — ТЗ является приложением к договору;
          "referenced" — есть ссылка, но само ТЗ не приложено;
        - "negative_result_acknowledged": прямо указано, что отрицательный результат
          является результатом работ и подлежит оплате.

        ВАЖНО: Если значение явно не указано в тексте — пиши "not_found".
      prompt_file: null
      context_k: 7
      temperature: 0.0
      max_tokens: 600
    retrieval:
      context_k: 7
      max_chunks: 10
      boost_keywords:
        - "техническое задание"
        - "программа исследований"
        - "ожидаемые результаты"
        - "ст. 773 ГК РФ"
        - "отрицательный результат"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 50
      max_snippet_length: 700
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "technical_assignment_present"
          type: "string"
          allowed_values: ["yes", "referenced", "absent", "not_found"]
          description: "Статус ТЗ в договоре"
        - name: "work_type"
          type: "string"
          allowed_values: ["NIR", "OKR", "combined", "unclear", "not_found"]
          description: "Вид работ: НИР, ОКР или комплекс"
        - name: "negative_result_acknowledged"
          type: "string"
          allowed_values: ["yes", "no", "not_found"]
          description: "Признан ли отрицательный результат результатом работ"
      store_payload: true

  - id: risk_of_failure_allocation_analysis
    name: "Распределение риска недостижения положительного результата (ст. 769, 775 ГК РФ)"
    description: "Ключевое отличие НИОКР от подряда. Для НИР риск несёт Заказчик по умолчанию. Анализирует явность распределения риска, условия оплаты при неудаче, допустимые основания для снижения оплаты"
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "риск недостижения результата"
        - "риск случайной невозможности исполнения"
        - "заказчик несёт риск"
        - "отрицательный результат"
        - "ст. 769 ГК РФ"
        - "ст. 775 ГК РФ"
        - "оплата фактически выполненных работ"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)риск.*несёт.*заказчик"
