type: contract_3.2_service_contract
name: "Договор бытового подряда"

description: |
  Специальный вид подряда, где Заказчиком всегда выступает гражданин (потребитель),
  заказывающий работу для удовлетворения бытовых, семейных, личных и иных нужд,
  не связанных с предпринимательской деятельностью. Подрядчик — предприниматель или
  организация, осуществляющая соответствующую деятельность. Регулируется § 2 Главы 37
  ГК РФ и Законом о защите прав потребителей (ЗоЗПП), что создаёт повышенный уровень
  защиты прав Заказчика. Договор является публичным (ст. 426 ГК РФ).

version: 3.0
parent: class_3_work_performance

metadata:
  category: contract
  subcategory: work_performance
  complexity: medium
  risk_level: high  # Высокий риск для подрядчика из-за потребительского законодательства
  jurisdiction: RU
  language: ru
  legal_base: "§ 2 Главы 37 ГК РФ (ст. 730-739); ЗоЗПП № 2300-1"
  doc_types_supported:
    - "договор бытового подряда"
    - "договор на выполнение работ для граждан"
    - "договор на ремонт для физического лица"
    - "договор на пошив одежды (потребительский)"
    - "договор на изготовление мебели для граждан"
    - "потребительский подряд"
    - "публичный договор подряда"

engine_expectations:
  evidence_required: true
  evidence_style: "pinpoint"
  allow_not_found: true
  output_style: "dd_grid"
  prefer_structured_outputs: true

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 1: КЛАССИФИКАЦИЯ (L1/L2)
#  Читается: YAMLRegistry → L1FilenameClassifier, L2HeaderClassifier
# ════════════════════════════════════════════════════════════════════════════

classification_runtime_v1:

  # Параметры scoring для L2
  scoring:
    accept_threshold: 0.78
    strong_signal_threshold: 0.87
    ambiguity_margin: 0.17
    input_quality_weight: 1.0

  rules:

    filename_patterns:
      - "(?i)бытов.*подряд"
      - "(?i)потребитель.*подряд"
      - "(?i)ремонт.*граждан"
      - "(?i)заказ.*граждан"

    folder_patterns:
      - "(?i)бытовой.*подряд"
      - "(?i)consumer.*contract"
      - "(?i)ремонт.*население"

    keywords:

      high:
        # ── Прямые названия и потребительский характер ──

        - pattern: "(?i)договор\\s+бытов[огоой]\\s+подряд[ауы]"
          weight: 1.0
          distinctiveness: high
          context: header
          description: "Основное название договора бытового подряда"

        - pattern: "(?i)бытов[ойое]\\s+подряд"
          weight: 0.95
          distinctiveness: high
          context: any
          description: "Устойчивое словосочетание бытового подряда"

        - pattern: "(?i)договор\\s+на\\s+выполнен[иеия]\\s+работ\\s+для\\s+граждан"
          weight: 0.9
          distinctiveness: high
          context: header
          description: "Формула договора на выполнение работ для гражданина‑потребителя"

        - pattern: "(?i)договор\\s+на\\s+ремонт\\s+для\\s+физическ[огоой]\\s+лиц[ауы]"
          weight: 0.9
          distinctiveness: high
          context: header
          description: "Ремонт для физлица как потребительский подряд"

        - pattern: "(?i)договор\\s+на\\s+пошив\\s+одежд[ыыу]\\s*\\(потребительск[ийое]\\)"
          weight: 0.9
          distinctiveness: high
          context: header
          description: "Явно маркированный потребительский договор на пошив одежды"

        - pattern: "(?i)договор\\s+на\\s+изготовлен[иеия]\\s+мебел[ии]\\s+для\\s+граждан"
          weight: 0.9
          distinctiveness: high
          context: header
          description: "Изготовление мебели для гражданина‑потребителя"

        - pattern: "(?i)потребительск[ийое]\\s+подряд"
          weight: 0.95
          distinctiveness: high
          context: any
          description: "Прямое указание на потребительский характер подряда"

        - pattern: "(?i)публичн[ыйое]\\s+договор\\s+подряд[ауы]"
          weight: 0.9
          distinctiveness: high
          context: any
          description: "Публичный договор подряда по ст. 426 ГК РФ"

        - pattern: "(?i)заказчик-?потребител[ьяеи]"
          weight: 0.95
          distinctiveness: high
          context: any
          description: "Заказчик прямо обозначен как потребитель"

        - pattern: "(?i)для\\s+личн[ыхых]\\s+бытов[ыхых]\\s+нужд"
          weight: 0.9
          distinctiveness: high
          context: any
          description: "Чёткое указание, что работа выполняется для личных бытовых нужд"

        - pattern: "(?i)закон\\s+о\\s+защит[еы]\\s+прав\\s+потребител[ейья]"
          weight: 0.95
          distinctiveness: high
          context: any
          description: "Прямая ссылка на ЗоЗПП"

        - pattern: "(?i)зозпп"
          weight: 0.9
          distinctiveness: high
          context: any
          description: "Аббревиатура закона о защите прав потребителей"

        - pattern: "(?i)гражданин-?заказчик"
          weight: 0.9
          distinctiveness: high
          context: any
          description: "Заказчик определён как гражданин, а не организация"

        # ── Оставшиеся legacy high ──
        - "(?i)потребител[ьяеи]"
        - "(?i)договор\\s+на\\s+ремонт\\s+для\\s+физическ[огоой]\\s+лиц[ауы]"
        - "(?i)договор\\s+на\\s+изготовлен[иеия]\\s+мебел[ии]\\s+для\\s+граждан"

      medium:
        - pattern: "(?i)\\bгражданин\\b"
          weight: 0.65
          distinctiveness: medium
          context: any
          description: "Гражданин как участник договора, без прямой привязки к потребительскому режиму"

        - pattern: "(?i)для\\s+личн[ыо]х\\s+нужд"
          weight: 0.6
          distinctiveness: medium
          context: any
          description: "Указание на личные нужды (без уточнения бытовых/семейных)"

        - pattern: "(?i)для\\s+семейн[ыо]х\\s+нужд"
          weight: 0.6
          distinctiveness: medium
          context: any
          description: "Работы выполняются для семейных нужд потребителя"

        - pattern: "(?i)ремонт\\s+для\\s+граждан"
          weight: 0.6
          distinctiveness: medium
          context: any
          description: "Ремонт явно таргетирован на граждан, а не бизнес"

        - pattern: "(?i)бытов[ыо]е\\s+услуг[ии]"
          weight: 0.55
          distinctiveness: medium
          context: any
          description: "Упоминание бытовых услуг — соседний режим в ЗоЗПП"

        - pattern: "(?i)смет[аа]\\s+для\\s+потребител[яя]"
          weight: 0.55
          distinctiveness: medium
          context: any
          description: "Смета/калькуляция именно для потребителя"

        - pattern: "(?i)гарантийн[ыо]й\\s+срок"
          weight: 0.5
          distinctiveness: medium
          context: any
          description: "Гарантийный срок характерен и для подряда, и для потребительских договоров"

        - pattern: "(?i)претензи[яи]\\s+потребител[яя]"
          weight: 0.6
          distinctiveness: medium
          context: any
          description: "Претензии потребителя по качеству/срокам работ"

        - pattern: "(?i)подрядчик-?предпринимател[ья]"
          weight: 0.6
          distinctiveness: medium
          context: any
          description: "Подрядчик — предприниматель, оказывающий работы для потребителей"

        - pattern: "(?i)услуг[ии]\\s+населени[юя]"
          weight: 0.55
          distinctiveness: medium
          context: any
          description: "Формулировка «услуги населению» как индикатор потребительского сегмента"

      low:
        - pattern: "(?i)для\\s+семь[ии]"
          weight: 0.25
          distinctiveness: low
          context: any
          description: "Указание на семью как бенефициара результата работ"

        - pattern: "(?i)не\\s+для\\s+предпринимательск[оа]й\\s+деятельност[ии]"
          weight: 0.3
          distinctiveness: low
          context: any
          description: "Отграничение от использования результата в бизнес‑целях"

        - pattern: "(?i)розничн[ыо]е\\s+услуг[ии]"
          weight: 0.25
          distinctiveness: low
          context: any
          description: "Розничный формат оказания работ/услуг населению"

        - pattern: "(?i)\\bип\\b"
          weight: 0.25
          distinctiveness: low
          context: any
          description: "ИП как типичный подрядчик в бытовом подряде"

        - pattern: "(?i)физическ[оеая]\\s+лиц[оа]"
          weight: 0.25
          distinctiveness: low
          context: any
          description: "Физлицо как заказчик работ"

    exclusions:
      # ── Hard exclusions — полностью подавляют бытовой подряд ──

      - pattern: "(?i)для\\s+предпринимательск[оа]й\\s+деятельност[ии]\\s+заказчик[аа]"
        severity: hard
        weight: -1.0
        description: "Результат работ используется в предпринимательской деятельности заказчика"

      - pattern: "(?i)юридическ[оеая]\\s+лиц[оа]\\s+в\\s+рол[ии]\\s+заказчик[аа]"
        severity: hard
        weight: -1.0
        description: "Заказчик‑юрлицо исключает режим бытового подряда"

      - pattern: "(?i)строительн[ыо]й\\s+подряд\\s+между\\s+организаци[яями]"
        severity: hard
        weight: -1.0
        description: "Строительный подряд между организациями — это special type contract_3.3"

      - pattern: "(?i)\\bНИОКР\\b"
        severity: hard
        weight: -1.0
        description: "НИОКР относится к contract_3.5_research_development, а не к бытовому подряду"

      - pattern: "(?i)научно-исследовательск[иие]+\\s+работ[ыа]"
        severity: hard
        weight: -1.0
        description: "Научно-исследовательские работы — отдельный тип НИР/НИОКР"

      # ── Soft exclusions — снижают confidence ──

      - pattern: "(?i)возмездн[оа]е\\s+оказани[ея]\\s+услуг"
        severity: soft
        weight: -0.35
        description: "Формула возмездного оказания услуг тянет к договору услуг, а не подряда"

      - pattern: "(?i)договор\\s+возмездн[оа]го\\s+оказани[яя]\\s+услуг"
        severity: soft
        weight: -0.35
        description: "Явный договор услуг, даже с потребительским контекстом"

      - pattern: "(?i)неовеществл[её]нн[ыо]й\\s+результат"
        severity: soft
        weight: -0.35
        description: "Подчёркивает отсутствие материального результата, что ближе к услугам"

      - pattern: "(?i)агентск[иоя]+\\s+договор"
        severity: soft
        weight: -0.3
        description: "Агентский договор — посредническая конструкция, а не подряд"

      - pattern: "(?i)договор\\s+комисси[ии]"
        severity: soft
        weight: -0.3
        description: "Договор комиссии — посреднический, а не подрядный"

      - pattern: "(?i)транспортн[а-яё]+\\s+экспедиц[ияии]"
        severity: soft
        weight: -0.3
        description: "Транспортная экспедиция — смешанный договор услуг"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 2: ТРИГГЕРЫ
#  Читается: TriggerDetector → doc.applicable_triggers
# ════════════════════════════════════════════════════════════════════════════

trigger_definitions:

  consumer_party:
    any_keywords:
      - "(?i)\\bгражданин\\b"
      - "(?i)\\bпотребител[ьяи]\\b"
      - "(?i)физическ[оеая]\\s+лиц[оа]"
      - "(?i)\\bпаспорт\\b"
      - "(?i)дата\\s+рождения"
      - "(?i)для\\s+личн[ыо]х\\s+нужд"
      - "(?i)для\\s+семейн[ыо]х\\s+нужд"
      - "(?i)для\\s+бытов[ыо]х\\s+нужд"
      - "(?i)не\\s+для\\s+предпринимательск[оа]й\\s+деятельност[ии]"

  legal_entity_as_customer:
    any_keywords:
      - "(?i)\\bООО\\b"
      - "(?i)\\bАО\\b"
      - "(?i)\\bЗАО\\b"
      - "(?i)\\bПАО\\b"
      - "(?i)заказчик-?организаци[яи]"
      - "(?i)юридическ[оеая]\\s+лиц[оа]"
      - "(?i)\\bОГРН\\b"
      - "(?i)\\bКПП\\b"
      - "(?i)\\bобществ[оа]\\b"

  business_purpose:
    any_keywords:
      - "(?i)для\\s+бизнес[аа]"
      - "(?i)для\\s+предпринимательск[оа]й\\s+деятельност[ии]"
      - "(?i)для\\s+коммерческ[оа]го\\s+использовани[яя]"
      - "(?i)в\\s+производственн[ыо]х\\s+цел[яах]"

  estimate_present:
    any_keywords:
      - "(?i)\\bсмет[аа]\\b"
      - "(?i)\\bкалькуляци[яи]\\b"
      - "(?i)расч[её]т\\s+стоимост[ии]"
      - "(?i)тв[её]рд[а-яё]+\\s+смет[аа]"
      - "(?i)смет[аа]\\s+являетс[яьа]\\s+тв[её]рдой"

  advance_payment:
    any_keywords:
      - "(?i)\\bаванс\\b"
      - "(?i)\\bпредоплат[аы]\\b"
      - "(?i)авансов[ыо]й\\s+плат[её]ж"
      - "(?i)предварительн[а-яё]+\\s+оплат[аа]"
      - "(?i)уплачивает\\s+до\\s+начал[аа]\\s+работ"

  customer_supplied_materials:
    any_keywords:
      - "(?i)материал[ыо]\\s+заказчик[аа]"
      - "(?i)давальческ[иоя]+\\s+материал[ыо]"
      - "(?i)предоставляет\\s+заказчик"
      - "(?i)из\\s+материал[оа]в\\s+заказчик[аа]"

  warranty_period_set:
    any_keywords:
      - "(?i)гарантийн[ыо]й\\s+срок"
      - "(?i)гаранти[яи]\\s+качеств[аа]"
      - "(?i)в\\s+течени[еи]\\s+гарантийн[оа]го\\s+срок[аа]"
      - "(?i)гарантийн[ыо]е\\s+обязательств[аа]"

  significant_defects_present:
    any_keywords:
      - "(?i)существенн[ыо]й\\s+недостат[оа]к"
      - "(?i)существенн[ыо]е\\s+недостатк[ии]"
      - "(?i)неоднократн[оа]е\\s+проявлени[ея]"
      - "(?i)неустраним[ыо]й\\s+недостат[оа]к"

  delay_occurred:
    any_keywords:
      - "(?i)\\bпросрочк[аа]\\b"
      - "(?i)нарушени[ея]\\s+срок[оо]в"
      - "(?i)не\\s+выполнен[оаы]?\\s+в\\s+срок"
      - "(?i)превышени[ея]\\s+срок[аа]"
      - "(?i)задержк[аа]\\s+выполнени[яя]"

  materials_by_contractor:
    any_keywords:
      - "(?i)материал[ыо]\\s+подрядчик[аа]"
      - "(?i)иждивени[ея]\\s+подрядчик[аа]"
      - "(?i)из\\s+материал[оа]в\\s+подрядчик[аа]"
      - "(?i)подрядчик\\s+обеспечивает\\s+материалами"

  renovation_work:
    any_keywords:
      - "(?i)ремонт\\s+квартир[ыы]"
      - "(?i)ремонт\\s+дом[аа]"
      - "(?i)ремонт\\s+жил[оа]го\\s+помещени[яя]"
      - "(?i)отделочн[ыо]е\\s+работ[ыа]"
      - "(?i)косметическ[иоя]+\\s+ремонт"
      - "(?i)капитальн[ыо]й\\s+ремонт\\s+квартир[ыы]"
      - "(?i)сантехническ[иоя]+\\s+работ[ыа]"
      - "(?i)электромонтажн[ыо]е\\s+работ[ыа]"
      - "(?i)установк[аа]\\s+окон"
      - "(?i)установк[аа]\\s+двер[её]й"
      - "(?i)укладк[аа]\\s+плитк[ии]"
      - "(?i)поклейк[аа]\\s+обо[её]в"
      - "(?i)натяжн[оа]й\\s+потол[оа]к"

  custom_manufacturing:
    any_keywords:
      - "(?i)пошив\\s+одежд[ыы]"
      - "(?i)пошив\\s+штор"
      - "(?i)изготовлени[ея]\\s+мебел[ии]"
      - "(?i)изготовлени[ея]\\s+на\\s+заказ"
      - "(?i)по\\s+индивидуальн[оа]му\\s+проект[уу]"
      - "(?i)по\\s+эскиз[уу]\\s+заказчик[аа]"
      - "(?i)индивидуальн[ыо]й\\s+заказ"
      - "(?i)ювелирн[оа]е\\s+издели[ея]\\s+на\\s+заказ"
      - "(?i)изготовлени[ея]\\s+ключ[её]й"
      - "(?i)\\bателье\\b"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 3: SHARED PATTERNS
#  Читается: DocTypeCheckLoader через _resolve_yaml_templates()
# ════════════════════════════════════════════════════════════════════════════

shared_patterns:

  money_amount: "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|тыс|млн)"
  date_pattern: "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"
  date_period: "(?i)(не\\s+позднее|в\\s+течение)\\s+\\d+\\s*(календарн|рабоч|дн)"
  percent_pattern: "(?i)\\b\\d+([,.]\\d+)?\\s*%\\s*(в\\s+(день|месяц|год))?"
  passport_pattern: "(?i)(паспорт.*серия|серия\\s+\\d{4}\\s+номер\\s+\\d{6})"
  inn_individual: "(?i)\\bИНН\\s*:?\\s*\\d{12}\\b"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: COMPLIANCE RULES
#  Читается: DocTypeCheckLoader._exclusion_logic_to_checks()
# ════════════════════════════════════════════════════════════════════════════

compliance_rules:

  - id: "legal_entity_customer_disqualification"
    name: "Дисквалификация: заказчик — юридическое лицо (не бытовой подряд)"
    description: |
      Бытовой подряд применяется ТОЛЬКО если заказчик — гражданин (физическое лицо),
      заказывающий работу для личных, семейных, бытовых нужд (ст. 730 ГК РФ).
      Если заказчик — организация или ИП, заказывающий работу для бизнеса,
      это общий подряд (§ 1 Главы 37 ГК РФ). ЗоЗПП не применяется.
    legal_base: "ст. 730 ГК РФ"
    required_triggers: ["legal_entity_as_customer"]
    severity: "critical"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      keywords:
        - "ООО"
        - "АО"
        - "ОГРН"
        - "юридическое лицо"
        - "КПП"
      keyword_mode: "any"
    retrieval:
      context_k: 4
      boost_keywords:
        - "заказчик"
        - "юридическое лицо"
        - "ОГРН"
      rerank: true

  - id: "business_purpose_disqualification"
    name: "Дисквалификация: работа для предпринимательской деятельности (не бытовой подряд)"
    description: |
      Бытовой подряд требует, чтобы работа заказывалась НЕ для предпринимательских целей.
      Если результат используется в коммерческих целях — применяется общий подряд.
    legal_base: "ст. 730 ГК РФ"
    required_triggers: ["business_purpose", "consumer_party"]
    severity: "critical"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      keywords:
        - "для бизнеса"
        - "для предпринимательской деятельности"
        - "в производственных целях"
        - "для коммерческого использования"
      keyword_mode: "any"
    retrieval:
      context_k: 4
      boost_keywords:
        - "цель использования"
        - "предпринимательская деятельность"
      rerank: true

  - id: "illegal_refusal_penalty_clause"
    name: "Незаконное ограничение права потребителя на отказ: штраф/неустойка за расторжение (ст. 731 ГК РФ, ст. 32 ЗоЗПП)"
    description: |
      Любое договорное условие, ограничивающее право потребителя на отказ от договора
      (штраф, неустойка, запрет отказа), НИЧТОЖНО по ст. 16 ЗоЗПП.
      Потребитель вправе отказаться в любое время, оплатив только фактически выполненное
      и возместив расходы на материалы.
    legal_base: "ст. 731 ГК РФ; ст. 32, ст. 16 ЗоЗПП"
    required_triggers: ["consumer_party"]
    severity: "critical"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      keywords:
        - "штраф за отказ"
        - "неустойка за расторжение"
        - "запрет на односторонний отказ"
        - "штраф за досрочное расторжение"
        - "удержание аванса в полном размере при отказе"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "штраф за отказ"
        - "неустойка за расторжение"
        - "запрет отказа"
      rerank: true

  - id: "illegal_warranty_claim_period_reduction"
    name: "Незаконное сокращение сроков предъявления претензий (ст. 29 ЗоЗПП)"
    description: |
      Потребитель вправе предъявить претензии по качеству в течение гарантийного срока,
      а при его отсутствии — в разумный срок, но в пределах 2 лет (5 лет для недвижимости).
      Условия вроде «претензии принимаются только в течение 3/5/7 дней с момента приёмки»
      или «после подписания акта претензии не принимаются» — ничтожны по ст. 16 ЗоЗПП.
    legal_base: "ст. 29 ЗоЗПП; ст. 16 ЗоЗПП; ст. 737 ГК РФ"
    required_triggers: ["consumer_party"]
    severity: "critical"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      keywords:
        - "претензии принимаются только в течение"
        - "претензии не принимаются после подписания акта"
        - "претензии предъявляются в течение 3 дней"
        - "претензии предъявляются в течение 5 дней"
        - "после приёмки претензии не принимаются"
        - "подписание акта исключает претензии"
        - "акт подтверждает отсутствие недостатков"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "претензии"
        - "срок предъявления"
        - "после приёмки"
        - "подписание акта"
      rerank: true

  - id: "illegal_bundled_services_consumer"
    name: "Навязывание дополнительных платных услуг/материалов (ст. 16 ЗоЗПП, ст. 731 ГК РФ)"
    description: |
      Подрядчик не вправе обусловливать выполнение основной работы обязательным
      приобретением дополнительных услуг или материалов, не предусмотренных
      первоначальным соглашением. Навязывание допуслуг (страхование, сервисное
      обслуживание, расходные материалы) — нарушение ст. 16 ЗоЗПП.
    legal_base: "ст. 16 ЗоЗПП; ст. 731 ГК РФ; п. 1 ст. 421 ГК РФ"
    required_triggers: ["consumer_party"]
    severity: "critical"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      keywords:
        - "обязан приобрести дополнительно"
        - "услуга оказывается при условии"
        - "обязательное сервисное обслуживание"
        - "обязательная страховка"
        - "обязательное приобретение материалов у подрядчика"
        - "работа выполняется только при условии"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "дополнительные услуги"
        - "обязательное"
        - "навязывание"
        - "при условии приобретения"
      rerank: true

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 5: CHECKS_V8 — LLM/hybrid проверки
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  - id: subject_consumer_purpose_extraction
    name: "Предмет и потребительское назначение работы (ст. 730, 732 ГК РФ)"
    description: "Извлекает описание работы, результата и подтверждение личного/бытового назначения. Коммерческое назначение = не бытовой подряд"
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "для личных нужд"
        - "для бытовых нужд"
        - "для семейных нужд"
        - "подрядчик обязуется выполнить"
        - "результат работы"
        - "не для предпринимательской деятельности"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)для\\s+(личных|бытовых|семейных|домашних)\\s+нужд"
        - "(?i)подрядчик.*обязуется.*выполнить"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор бытового подряда (§ 2 Главы 37 ГК РФ).
        Извлеки сведения о предмете договора и его потребительском назначении.

        Ответь строго в JSON:
        {
          "work_description": "<описание работы или not_found>",
          "material_result": "<описание овеществлённого результата или not_found>",
          "consumer_purpose": "<yes / no / unclear / not_found>",
          "purpose_snippet": "<цитата о назначении работы или not_found>",
          "technical_task_referenced": "<yes / no / not_found>"
        }

        - "consumer_purpose": "yes" — работа прямо для личных/бытовых/семейных нужд;
          "no" — коммерческое использование; "unclear" — назначение не указано.

        ВАЖНО: Если значение явно не указано в тексте — пиши "not_found".
      prompt_file: null
      context_k: 6
      temperature: 0.0
      max_tokens: 512
    retrieval:
      context_k: 6
      max_chunks: 8
      boost_keywords:
        - "предмет договора"
        - "для личных нужд"
        - "результат работы"
        - "техническое задание"
        - "не для предпринимательской деятельности"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 50
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "work_description"
          type: "string"
          keyword_hints: ["подрядчик обязуется", "выполнить работу", "предмет"]
          description: "Описание содержания работы"
        - name: "material_result"
          type: "string"
          keyword_hints: ["результат работы", "сдать заказчику", "изготовить", "отремонтировать"]
          description: "Описание овеществлённого результата"
        - name: "consumer_purpose"
          type: "string"
          allowed_values: ["yes", "no", "unclear", "not_found"]
          description: "Работа заказана для личных/бытовых/семейных нужд"
      store_payload: true

  - id: deadlines_and_penalty_risk_analysis
    name: "Сроки выполнения и риск неустойки 3%/день (ст. 27, 28 ЗоЗПП)"
    description: "Проверяет конкретность сроков. При просрочке по ЗоЗПП автоматически начисляется 3% цены работы за каждый день — крупный финансовый риск для подрядчика"
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "срок выполнения"
        - "начало работ"
        - "конечный срок"
        - "не позднее"
        - "в течение"
        - "дата начала"
        - "дата окончания"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"
        - "(?i)(не\\s+позднее|в\\s+течение)\\s+\\d+\\s*(календарн|рабоч|дн)"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор бытового подряда.
        Проверь сроки выполнения работ и оцени риск неустойки по ст. 28 ЗоЗПП
        (3% цены работы за каждый день просрочки).

        Ответь строго в JSON:
        {
          "start_date": "<дата начала или not_found>",
          "end_date": "<дата окончания или not_found>",
          "deadlines_specific": "<yes / vague / not_found>",
          "penalty_3pct_mentioned": "<yes / no / not_found>",
          "deadline_snippet": "<цитата из договора или not_found>"
        }

        - "deadlines_specific": "yes" — конкретные даты; "vague" — размытые формулировки.
        - "penalty_3pct_mentioned": упоминается ли неустойка 3% по ст. 28 ЗоЗПП явно.

        ВАЖНО: Если значение явно не указано — пиши "not_found".
      prompt_file: null
      context_k: 5
      temperature: 0.0
      max_tokens: 400
    retrieval:
      context_k: 5
      max_chunks: 6
      boost_keywords:
        - "срок выполнения"
        - "начало работ"
        - "не позднее"
        - "ст. 28 ЗоЗПП"
        - "3% цены работы"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 400
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "start_date"
          type: "string"
          keyword_hints: ["начало работ", "дата начала", "начальный срок"]
          description: "Начальный срок выполнения работ"
        - name: "end_date"
          type: "string"
          keyword_hints: ["срок завершения", "конечный срок", "не позднее"]
          description: "Конечный срок выполнения работ"
        - name: "deadlines_specific"
          type: "string"
          allowed_values: ["yes", "vague", "not_found"]
          description: "Конкретность указания сроков"
        - name: "penalty_3pct_mentioned"
          type: "string"
          allowed_values: ["yes", "no", "not_found"]
          description: "Упоминание неустойки 3% по ст. 28 ЗоЗПП"
      store_payload: true

  - id: estimate_firmness_check
    name: "Смета: твёрдость, запрет доплат, порядок изменения (ст. 735 ГК РФ, ст. 33 ЗоЗПП)"
    description: "Смета в бытовом подряде — всегда твёрдая. Подрядчик не вправе требовать доплат; потребитель — уменьшения цены. Нарушение → право потребителя на отказ от договора с возвратом уплаченного"
    triggers:
      any: ["estimate_present"]
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "смета"
        - "твёрдая смета"
        - "цена не подлежит изменению"
        - "запрет на требование доплат"
        - "изменение цены только с согласия"
        - "дополнительные работы"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)твёрд(ая|ой)\\s+(смет|цен)"
        - "(?i)цена.*не\\s+подлежит.*изменению"
        - "(?i)смет[аы].*является.*твёрдой"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор бытового подряда.
        Проверь условия о смете и цене работы (ст. 735 ГК РФ, ст. 33 ЗоЗПП).

        Ответь строго в JSON:
        {
          "estimate_type": "<firm / approximate / not_specified / not_found>",
          "price_amount": "<сумма с валютой или not_found>",
          "surcharge_prohibition": "<explicit / implied / absent / not_found>",
          "additional_works_procedure": "<described / not_described / not_found>",
          "estimate_snippet": "<цитата из договора или not_found>"
        }

        - "firm" — смета прямо названа твёрдой, изменение запрещено без согласия;
        - "approximate" — указано, что цена может меняться (риск нарушения ст. 735 ГК РФ);
        - "surcharge_prohibition": "explicit" — прямо запрещено требовать доплат.

        ВАЖНО: Если значение явно не указано — пиши "not_found".
      prompt_file: null
      context_k: 5
      temperature: 0.0
      max_tokens: 512
    retrieval:
      context_k: 5
      max_chunks: 6
      boost_keywords:
        - "смета"
        - "твёрдая смета"
        - "цена не подлежит изменению"
        - "ст. 735 ГК РФ"
        - "ст. 33 ЗоЗПП"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "estimate_type"
          type: "string"
          allowed_values: ["firm", "approximate", "not_specified", "not_found"]
          description: "Тип сметы/цены: твёрдая или приблизительная"
        - name: "surcharge_prohibition"
          type: "string"
          allowed_values: ["explicit", "implied", "absent", "not_found"]
          description: "Запрет на требование доплат сверх сметы"
        - name: "additional_works_procedure"
          type: "string"
          allowed_values: ["described", "not_described", "not_found"]
          description: "Порядок согласования дополнительных работ"
      store_payload: true

  - id: mandatory_consumer_information_check
    name: "Обязательная информация подрядчика для потребителя (ст. 8-10 ЗоЗПП, ст. 732 ГК РФ)"
    description: "Подрядчик обязан предоставить полную информацию о себе, работе, материалах, порядке исполнения и правах потребителя. Нарушение → административная ответственность и право потребителя на отказ"
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "подрядчик предоставляет информацию"
        - "сведения о материалах"
        - "информация о подрядчике"
        - "права потребителя"
        - "памятка потребителя"
        - "рекомендации по эксплуатации"
        - "предупреждение о последствиях"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)подрядчик.*обязан.*предоставить.*информацию"
        - "(?i)ст\\.?\\s*8.*(10)?\\s+ЗоЗПП"
        - "(?i)ст\\.?\\s*732\\s+ГК\\s+РФ"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор бытового подряда.
        Проверь наличие обязательной информации для потребителя (ст. 8-10 ЗоЗПП, ст. 732 ГК РФ).

        Ответь строго в JSON:
        {
          "contractor_info_provided": "<yes / partial / no / not_found>",
          "work_info_provided": "<yes / partial / no / not_found>",
          "consumer_rights_mentioned": "<yes / no / not_found>",
          "materials_info_provided": "<yes / no / not_found>",
          "information_snippet": "<цитата из договора или not_found>"
        }

        - "contractor_info_provided": включает регистрационные данные, лицензию (если есть), адрес;
        - "work_info_provided": описание работы, сроки, материалы, способ выполнения;
        - "consumer_rights_mentioned": прямое упоминание прав потребителя по ЗоЗПП.

        ВАЖНО: Если значение явно не указано — пиши "not_found".
      prompt_file: null
      context_k: 6
      temperature: 0.0
      max_tokens: 512
    retrieval:
      context_k: 6
      max_chunks: 8
      boost_keywords:
        - "информация для потребителя"
        - "сведения о подрядчике"
        - "права потребителя"
        - "ст. 8 ЗоЗПП"
        - "ст. 732 ГК РФ"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "contractor_info_provided"
          type: "string"
          allowed_values: ["yes", "partial", "no", "not_found"]
          description: "Предоставлена ли информация о подрядчике"
        - name: "consumer_rights_mentioned"
          type: "string"
          allowed_values: ["yes", "no", "not_found"]
          description: "Упомянуты ли права потребителя"
      store_payload: true

  - id: consumer_defect_rights_check
    name: "Права потребителя при недостатках работы (ст. 29, 30, 31 ЗоЗПП, ст. 737 ГК РФ)"
    description: "Анализирует полноту урегулирования прав потребителя при обнаружении недостатков: безвозмездное устранение, уменьшение цены, возмещение расходов, расторжение при существенных недостатках"
    triggers: {}
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "устранение недостатков"
        - "безвозмездное исправление"
        - "уменьшение цены"
        - "возмещение расходов на устранение"
        - "право отказаться от договора"
        - "существенный недостаток"
        - "гарантийный срок"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)ст\\.?\\s*29\\s+ЗоЗПП"
        - "(?i)потребитель.*вправе.*требовать.*(устранения|уменьшения)"
        - "(?i)существенн(ый|ые)\\s+недостат"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор бытового подряда.
        Проверь, как урегулированы права потребителя при обнаружении недостатков (ст. 29 ЗоЗПП).

        Ответь строго в JSON:
        {
          "free_remedy_right": "<explicit / implied / absent / not_found>",
          "price_reduction_right": "<explicit / implied / absent / not_found>",
          "reimbursement_right": "<explicit / implied / absent / not_found>",
          "refusal_right_for_significant_defects": "<explicit / implied / absent / not_found>",
          "warranty_period": "<срок или not_found>",
          "defect_remedy_deadline": "<срок устранения или not_found>",
          "defect_rights_snippet": "<цитата из договора или not_found>"
        }

        - "explicit" — право прямо прописано в договоре;
        - "implied" — вытекает из ссылки на ЗоЗПП без детализации;
        - "absent" — условие отсутствует.

        ВАЖНО: Если значение явно не указано — пиши "not_found".
      prompt_file: null
      context_k: 6
      temperature: 0.0
      max_tokens: 600
    retrieval:
      context_k: 6
      max_chunks: 8
      boost_keywords:
        - "права потребителя при недостатках"
        - "ст. 29 ЗоЗПП"
        - "устранение недостатков"
        - "существенный недостаток"
        - "гарантийный срок"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "free_remedy_right"
          type: "string"
          allowed_values: ["explicit", "implied", "absent", "not_found"]
          description: "Право на безвозмездное устранение недостатков"
        - name: "refusal_right_for_significant_defects"
          type: "string"
          allowed_values: ["explicit", "implied", "absent", "not_found"]
          description: "Право на отказ при существенных недостатках"
        - name: "warranty_period"
          type: "string"
          keyword_hints: ["гарантийный срок составляет", "в течение", "месяцев", "лет"]
          description: "Продолжительность гарантийного срока"
      store_payload: true

  - id: materials_responsibility_consumer_check
    name: "Материалы: чьи, качество, цена, информирование (ст. 733–734 ГК РФ)"
    description: |
      Проверяет урегулированность вопроса о материалах: из чьих материалов
      выполняется работа, качество и цена материалов подрядчика, сбережение
      материалов заказчика, информирование о свойствах материалов.
      При работе из материалов подрядчика — подрядчик несёт ответственность
      за их качество (ст. 733 ГК РФ). При давальческих материалах —
      подрядчик обязан сберечь и вернуть остатки (ст. 714, 728 ГК РФ).
    triggers: {}
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "материалы подрядчика"
        - "материалы заказчика"
        - "давальческие материалы"
        - "из материалов подрядчика"
        - "из материалов заказчика"
        - "иждивение подрядчика"
        - "качество материалов"
        - "цена материалов"
        - "наименование материала"
        - "стоимость материалов"
        - "возврат остатков"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)материал(ы|ов|ами)\\s+(подрядчик|заказчик)"
        - "(?i)из\\s+(своих\\s+)?материалов"
        - "(?i)давальческ(ие|их)\\s+материал"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор бытового подряда.
        Проверь условия о материалах (ст. 733–734 ГК РФ).

        Ответь строго в JSON:
        {
          "materials_provider": "<contractor / customer / mixed / not_specified / not_found>",
          "contractor_materials_price_specified": "<yes / no / not_applicable / not_found>",
          "contractor_materials_quality_warranty": "<yes / no / not_applicable / not_found>",
          "customer_materials_preservation": "<yes / no / not_applicable / not_found>",
          "customer_materials_return_obligation": "<yes / no / not_applicable / not_found>",
          "materials_information_provided": "<yes / no / not_found>",
          "materials_snippet": "<цитата или not_found>"
        }

        - "contractor" — работа из материалов подрядчика (иждивение подрядчика)
        - "customer" — из давальческих материалов заказчика
        - "mixed" — часть материалов от подрядчика, часть от заказчика
        - "contractor_materials_price_specified": указана ли цена материалов подрядчика отдельно
        - "customer_materials_preservation": обязанность бережного хранения материалов заказчика
        - "customer_materials_return_obligation": обязанность вернуть остатки материалов

        ВАЖНО: Если условие явно не указано — пиши "not_found".
      prompt_file: null
      context_k: 6
      temperature: 0.0
      max_tokens: 500
    retrieval:
      context_k: 6
      max_chunks: 8
      boost_keywords:
        - "материалы"
        - "иждивение"
        - "давальческие"
        - "качество материалов"
        - "возврат остатков"
        - "ст. 733"
        - "ст. 734"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "materials_provider"
          type: "string"
          allowed_values: ["contractor", "customer", "mixed", "not_specified", "not_found"]
          description: "Кто предоставляет материалы"
        - name: "contractor_materials_quality_warranty"
          type: "string"
          allowed_values: ["yes", "no", "not_applicable", "not_found"]
          description: "Гарантия качества материалов подрядчика"
        - name: "customer_materials_return_obligation"
          type: "string"
          allowed_values: ["yes", "no", "not_applicable", "not_found"]
          description: "Обязанность возврата остатков материалов заказчика"
      store_payload: true

