        - "образцы материалов"
        - "выбор материалов согласовывается"
        - "утверждение дизайн-проекта"
        - "письменное подтверждение выбора"
        - "акт выбора материалов"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)заказчик.*утверждает.*образцы.*материалов"
        - "(?i)изменение.*выбранных.*материалов.*после.*утверждения"

  - id: "claim_procedure_and_timeframe"
    name: "Процедура и сроки предъявления претензий по качеству (ст. 29 ЗоЗПП)"
    description: "Разумный порядок предъявления претензий снижает риск необоснованных требований. Нельзя устанавливать сроки короче, чем предусмотрено ЗоЗПП"
    legal_base: "ст. 29 ЗоЗПП"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "претензия в письменной форме"
        - "срок для предъявления претензий"
        - "акт о недостатках"
        - "совместный осмотр"
        - "экспертиза качества"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)претензии.*предъявляются.*в\\s+письменной\\s+форме"
        - "(?i)осмотр.*совместно\\s+с.*специалистом.*подрядчика"

  - id: "improper_operation_exclusion"
    name: "Исключение гарантии при нарушении правил эксплуатации (ст. 18 ЗоЗПП)"
    description: "Важно разграничить: дефекты от производства и дефекты от неправильной эксплуатации. Без условия подрядчик несёт гарантию за повреждения, вызванные действиями потребителя"
    legal_base: "ст. 18 ЗоЗПП"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "нарушение правил эксплуатации"
        - "самостоятельный ремонт"
        - "гарантия не распространяется"
        - "акт о нарушении условий эксплуатации"
        - "техническая документация и инструкции"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)гарантийные.*обязательства.*не.*распространяются.*на.*повреждения.*нарушением"
        - "(?i)при\\s+самостоятельном\\s+ремонте.*гарантия\\s+прекращается"

  - id: "retention_right_before_payment"
    name: "Право удержания результата работ до оплаты (ст. 712, 359 ГК РФ)"
    description: "Подрядчик вправе удерживать результат до исполнения потребителем обязанности по оплате. Ключевой инструмент при работе с заказчиками-физлицами"
    legal_base: "ст. 712, 359 ГК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "право удержания"
        - "удерживает результат"
        - "не передаётся до оплаты"
        - "до полной оплаты"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)подрядчик.*вправе.*удерживать.*результат.*до.*оплат"

  - id: "payment_terms_and_schedule"
    name: "Порядок и сроки оплаты (ст. 711 ГК РФ, ст. 37 ЗоЗПП)"
    description: "Чёткий порядок оплаты: момент возникновения обязанности, срок оплаты после приёмки, способ расчётов"
    legal_base: "ст. 711 ГК РФ; ст. 37 ЗоЗПП"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "срок оплаты"
        - "после подписания акта"
        - "в день приёмки"
        - "порядок расчётов"
        - "наличными"
        - "безналичный расчёт"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)оплат(а|у).*в\\s+течение.*\\d+.*(дней|рабоч)"
        - "(?i)после.*подписания.*акта"
    extraction:
      enabled: true
      mode: "rules"
      fields:
        - name: "payment_method"
          type: "string"
          allowed_values: ["cash", "cashless_transfer", "card", "mixed", "other", "not_found"]
          keyword_hints: ["наличными", "безналичный расчёт", "банковская карта"]
          description: "Способ расчётов"
      store_payload: true

  - id: "termination_grounds_and_refund"
    name: "Расторжение: основания, возврат аванса, взаиморасчёты (ст. 453, 731 ГК РФ; ст. 32 ЗоЗПП)"
    description: "При отказе потребителя: возврат уплаченного за вычетом фактически понесённых расходов. При отказе подрядчика: полный возврат аванса"
    legal_base: "ст. 453, 731 ГК РФ; ст. 32 ЗоЗПП"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "расторжение договора"
        - "отказ от исполнения"
        - "возврат аванса"
        - "фактически понесённые расходы"
        - "взаиморасчёты"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)расторж(ение|ении)\\s+договора"
        - "(?i)возврат.*аванс"
        - "(?i)фактически\\s+понесённые\\s+расходы"

  - id: "dispute_resolution_pretension_order"
    name: "Претензионный порядок и разрешение споров (ст. 4 ГПК РФ; ст. 17 ЗоЗПП)"
    description: "Срок рассмотрения претензии — 10 дней по ст. 31 ЗоЗПП. Подсудность — по выбору потребителя, не в арбитражный суд"
    legal_base: "ст. 31 ЗоЗПП; ст. 17 ЗоЗПП; ст. 29 ГПК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "претензионный порядок"
        - "срок рассмотрения претензии"
        - "10 дней"
        - "суд общей юрисдикции"
        - "разрешение споров"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)претензионный\\s+порядок"
        - "(?i)в\\s+суд(е|ах)\\s+общей\\s+юрисдикции"
        - "(?i)в\\s+течение\\s+10\\s+(дней|календарных)"

  - id: "force_majeure_clause"
    name: "Форс-мажор: определение и последствия (ст. 401 ГК РФ)"
    description: "При форс-мажоре сроки приостанавливаются. Важны: уведомление, максимальный период, право расторжения. Нельзя использовать для обхода неустойки по ЗоЗПП"
    legal_base: "ст. 401 ГК РФ"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "форс-мажор"
        - "обстоятельства непреодолимой силы"
        - "чрезвычайные обстоятельства"
        - "приостановление сроков"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)форс.мажор"
        - "(?i)непреодолимой\\s+силы"

  - id: "consumer_public_contract_provision"
    name: "Публичный характер договора (ст. 426 ГК РФ)"
    description: "Бытовой подряд — публичный договор. Подрядчик не вправе отказать потребителю при наличии возможности выполнить работу. Условия должны быть одинаковы для всех"
    legal_base: "ст. 426 ГК РФ"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "публичный договор"
        - "ст. 426 ГК РФ"
        - "одинаковые условия для всех"
        - "не вправе отказать в заключении"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)публичный\\s+договор"
        - "(?i)ст\\.?\\s*426\\s+ГК\\s+РФ"

  - id: "receipt_document_required"
    name: "Квитанция / приёмочный документ при оформлении заказа (ст. 734 ГК РФ)"
    description: "При оформлении заказа подрядчик выдаёт потребителю квитанцию или иной документ, содержащий обязательные реквизиты. Отсутствие квитанции затрудняет доказывание условий заказа"
    legal_base: "ст. 734 ГК РФ; Правила бытового обслуживания населения"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "квитанция"
        - "приёмочный документ"
        - "расписка"
        - "заказ-наряд"
        - "номер заказа"
        - "дата приёма заказа"
        - "наименование работы"
        - "ориентировочная стоимость"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)квитанци(я|ю|и)"
        - "(?i)заказ[\\s\\-]?наряд"
        - "(?i)ст\\.?\\s*734\\s+ГК\\s+РФ"

  - id: "customer_materials_safekeeping"
    name: "Сбережение материалов заказчика и возврат остатков (ст. 714, 728 ГК РФ)"
    description: "При работе из давальческих материалов подрядчик обязан использовать их экономно, вернуть остатки и отходы, а также нести ответственность за порчу/утрату"
    legal_base: "ст. 714, 728, 733 ГК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
      any: ["customer_supplied_materials"]
    rules:
      keywords:
        - "сбережение материалов"
        - "бережное отношение"
        - "возврат остатков"
        - "возврат неиспользованных материалов"
        - "ответственность за утрату"
        - "ответственность за повреждение"
        - "акт приёма материалов"
        - "расход материалов"
        - "отходы материалов"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)возврат.*(остатк|неиспользованн)"
        - "(?i)ответственност.*за.*(утрат|повреждени|порч).*материал"

  - id: "contractor_materials_price_quality"
    name: "Материалы подрядчика: цена, качество, замена (ст. 733 ГК РФ)"
    description: "При работе из материалов подрядчика: их стоимость указывается отдельно в смете, подрядчик гарантирует качество, замена на эквивалент — с согласия заказчика"
    legal_base: "ст. 733 ГК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
      any: ["materials_by_contractor"]
    rules:
      keywords:
        - "стоимость материалов"
        - "наименование материала"
        - "марка материала"
        - "качество материалов гарантируется"
        - "замена материалов"
        - "согласование замены"
        - "эквивалентный материал"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)стоимост(ь|и)\\s+материал"
        - "(?i)замен(а|ы)\\s+материал.*согласован"
    extraction:
      enabled: true
      mode: "rules"
      fields:
        - name: "materials_price_separate"
          type: "string"
          allowed_values: ["yes", "no", "not_found"]
          keyword_hints: ["стоимость материалов", "цена материалов отдельно"]
          description: "Выделена ли стоимость материалов отдельно"
      store_payload: true

  - id: "confidentiality_renovation"
    name: "Конфиденциальность при ремонте жилья (доступ в жилое помещение)"
    description: "При ремонте квартиры/дома подрядчик получает доступ к жилому помещению. Необходимы условия о конфиденциальности, допуске третьих лиц, сохранности имущества"
    legal_base: "ст. 25 Конституции РФ; ГК РФ"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
      any: ["renovation_work"]
    rules:
      keywords:
        - "конфиденциальность"
        - "доступ в жилое помещение"
        - "сохранность имущества"
        - "допуск работников"
        - "режим доступа"
        - "ответственность за имущество заказчика"
        - "график доступа"
        - "ключи от помещения"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)доступ.*в.*жилое\\s+помещени"
        - "(?i)сохранност(ь|и)\\s+имуществ"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 7: DD_REQUEST_TEMPLATES
#  Читается: DDRequestTemplateLoader
#  Ключи = check_id из checks_v8 и doc_type_checks выше.
#  DDRequestTemplateLoader.render() матчит по exact или prefix.
# ════════════════════════════════════════════════════════════════════════════

dd_request_templates:

  parties_info_consumer:
    text: >
      Просим подтвердить по {doc_names}: (а) ФИО, паспортные данные (серия, номер,
      кем выдан), дату рождения, адрес регистрации потребителя; (б) полное наименование,
      ИНН, ОГРН/ОГРНИП, адрес, ФИО подписанта подрядчика (ст. 9, 10 ЗоЗПП).
    addressee: "Обе стороны"

  subject_consumer_work:
    text: >
      В {doc_names} просим уточнить: (а) детальное описание работы и результата;
      (б) явное указание на личное/бытовое назначение (не для предпринимательской
      деятельности); (в) ТЗ или спецификацию как приложение (ст. 730, 732 ГК РФ).
    addressee: "Обе стороны"

  start_and_end_dates_required:
    text: >
      В {doc_names} просим указать конкретные даты начала и окончания работ (ст. 708 ГК РФ,
      ст. 27 ЗоЗПП). Внимание: размытые сроки увеличивают риск неустойки 3% в день
      по ст. 28 ЗоЗПП при любых задержках.
    addressee: "Подрядчик"

  price_consumer_required:
    text: >
      Просим уточнить в {doc_names}: (а) итоговую цену работ цифрами и прописью;
      (б) включает ли цена стоимость материалов; (в) НДС (если применимо).
      Смета является твёрдой по ст. 735 ГК РФ.
    addressee: "Обе стороны"

  estimate_firmness_no_surcharge:
    text: >
      Просим добавить в {doc_names} явное условие о твёрдости сметы: подрядчик не вправе
      требовать доплат сверх согласованной цены (ст. 735 ГК РФ, ст. 33 ЗоЗПП).
      Дополнительные работы — только по отдельному письменному соглашению.
    addressee: "Юридический советник подрядчика"

  acceptance_procedure_consumer:
    text: >
      Просим уточнить в {doc_names}: (а) форму акта выполненных работ; (б) срок
      для приёмки после уведомления о готовности; (в) механизм автоматической приёмки
      при уклонении заказчика (ст. 720 ГК РФ).
    addressee: "Обе стороны"

  consumer_unilateral_refusal_right:
    text: >
      Просим добавить в {doc_names} условие о праве потребителя отказаться от договора
      в любое время до сдачи работы, оплатив только фактически выполненное и возместив
      расходы на материалы (ст. 731 ГК РФ, ст. 32 ЗоЗПП). Любые штрафы за отказ —
      ничтожны (ст. 16 ЗоЗПП).
    addressee: "Юридический советник"

  penalty_3pct_for_delay_consumer:
    text: >
      Просим включить в {doc_names} информацию для потребителя: при нарушении сроков
      подрядчик уплачивает неустойку 3% цены работы за каждый день просрочки (ст. 28
      ЗоЗПП), но не более полной цены работы. Сумма неустойки не ограничивается договором.
    addressee: "Юридический советник подрядчика"

  warranty_consumer_rights_full:
    text: >
      Просим уточнить в {doc_names}: (а) гарантийный срок; (б) срок для безвозмездного
      устранения недостатков (по закону — 20 дней, ст. 30 ЗоЗПП); (в) права потребителя
      при существенных/неустранимых недостатках (отказ от договора + возврат денег,
      ст. 29 ЗоЗПП). Сокращение этих прав договором — ничтожно.
    addressee: "Юридический советник"

  information_provision_requirement:
    text: >
      Просим подтвердить по {doc_names}: как выполняется обязанность по предоставлению
      полной информации (ст. 8-10 ЗоЗПП, ст. 732 ГК РФ): (а) сведения о подрядчике
      (регистрация, лицензия); (б) о работе (материалы, технология); (в) рекомендации
      по эксплуатации; (г) памятка о правах потребителя. Непредоставление = право
      потребителя на отказ с полным возвратом.
    addressee: "Подрядчик"

  jurisdiction_consumer_choice:
    text: >
      Просим проверить в {doc_names}: условие о подсудности. Любая оговорка об
      исключительной подсудности по месту нахождения подрядчика — ничтожна.
      Потребитель вправе обратиться: по месту жительства, нахождения подрядчика
      или заключения договора (ст. 17 ЗоЗПП, ст. 29 ГПК РФ).
    addressee: "Юридический советник подрядчика"

  moral_harm_acknowledgment:
    text: >
      Рекомендуем включить в {doc_names} информацию для потребителя о праве на
      компенсацию морального вреда при нарушении его прав (ст. 15 ЗоЗПП).
      Для подрядчика: это повышенный финансовый риск при любых нарушениях сроков или качества.
    addressee: "Юридический советник"

  advance_payment_consumer:
    text: >
      Просим уточнить в {doc_names}: (а) размер аванса (% от цены); (б) порядок возврата
      при отказе потребителя — только фактически понесённые расходы, остаток подлежит
      возврату (ст. 731 ГК РФ, ст. 32 ЗоЗПП); (в) срок возврата.
    addressee: "Обе стороны"

  unilateral_acceptance_mechanism:
    text: >
      Просим добавить в {doc_names} механизм автоматической приёмки: если заказчик
      не явился для приёмки в течение [N] дней после уведомления о готовности —
      работы считаются принятыми, подрядчик составляет односторонний акт (ст. 720 ГК РФ).
    addressee: "Юридический советник подрядчика"

  material_selection_approval:
    text: >
      Просим предусмотреть в {doc_names} фиксацию выбора материалов потребителем:
      акт/протокол выбора образцов, цветов, моделей с подписью заказчика. Изменение
      выбора после утверждения — за дополнительную плату.
    addressee: "Подрядчик"

  claim_procedure_and_timeframe:
    text: >
      Просим уточнить в {doc_names} порядок предъявления претензий по качеству:
      (а) форма — письменная; (б) совместный осмотр в течение [N] дней; (в) срок
      устранения недостатков (до 20 дней по ст. 30 ЗоЗПП); (г) возможность независимой
      экспертизы. Нельзя устанавливать сроки короче, чем в ЗоЗПП.
    addressee: "Юридический советник"

  improper_operation_exclusion:
    text: >
      Просим уточнить в {doc_names}: при каких условиях гарантийные обязательства
      не распространяются на выявленные недостатки (нарушение правил эксплуатации,
      самостоятельный ремонт, механические повреждения). Основание — ст. 18 ЗоЗПП.
      Бремя доказывания лежит на подрядчике.
    addressee: "Юридический советник подрядчика"

  retention_right_before_payment:
    text: >
      Просим включить в {doc_names} право удержания результата работ до полной оплаты
      потребителем (ст. 712, 359 ГК РФ). Особенно актуально при работе с физлицами:
      после передачи результата рычаг воздействия теряется.
    addressee: "Юридический советник подрядчика"

  payment_terms_and_schedule:
    text: >
      Просим уточнить в {doc_names}: (а) способ расчётов (наличные, безналичный);
      (б) момент возникновения обязанности оплаты (подписание акта / получение результата);
      (в) срок окончательного расчёта.
    addressee: "Обе стороны"

  termination_grounds_and_refund:
    text: >
      Просим уточнить в {doc_names}: (а) основания расторжения для каждой стороны;
      (б) порядок возврата аванса при отказе потребителя — за вычетом фактически
      понесённых расходов (ст. 731 ГК РФ); (в) срок возврата денежных средств.
    addressee: "Юридический советник"

  dispute_resolution_pretension_order:
    text: >
      Просим уточнить в {doc_names}: (а) претензионный порядок (срок — 10 дней по ст. 31
      ЗоЗПП); (б) подсудность — суд общей юрисдикции по выбору потребителя; (в) исключить
      упоминание арбитражного суда — он неприменим к потребительским спорам.
    addressee: "Юридический советник"

  force_majeure_clause:
    text: >
      Просим уточнить в {doc_names} форс-мажорную оговорку: (а) перечень обстоятельств;
      (б) срок уведомления контрагента; (в) максимальный период приостановки. Важно:
      форс-мажор не отменяет неустойку по ст. 28 ЗоЗПП — только приостанавливает
      течение срока, если это прямо предусмотрено.
    addressee: "Юридический советник"

  consumer_public_contract_provision:
    text: >
      Просим подтвердить по {doc_names}: договор является публичным (ст. 426 ГК РФ) —
      условия должны быть одинаковы для всех потребителей. Отказ в заключении договора
      при наличии возможности выполнить работу — незаконен. Рекомендуем прямое
      упоминание публичного характера в преамбуле.
    addressee: "Юридический советник подрядчика"

  legal_entity_customer_disqualification:
    text: >
      Внимание: в {doc_names} выявлены признаки того, что заказчик — юридическое лицо
      или ИП. Бытовой подряд (§ 2 Главы 37 ГК РФ) применяется ТОЛЬКО когда заказчик —
      гражданин для личных нужд. Просим подтвердить: (а) статус заказчика;
      (б) назначение работ. При коммерческом заказчике применяется общий подряд,
      ЗоЗПП не применяется.
    addressee: "Юридический советник"

  illegal_refusal_penalty_clause:
    text: >
      Внимание: в {doc_names} обнаружено условие, ограничивающее право потребителя
      на отказ от договора (штраф, неустойка, запрет). Данное условие НИЧТОЖНО
      по ст. 16 ЗоЗПП. Просим: (а) исключить указанное условие; (б) заменить на
      законный порядок: при отказе заказчик оплачивает только фактически выполненное
      и возмещает расходы (ст. 731 ГК РФ, ст. 32 ЗоЗПП).
    addressee: "Юридический советник подрядчика"

  subject_consumer_purpose_extraction:
    text: >
      Просим подтвердить по {doc_names}: (а) описание работы и её результата;
      (б) явное указание на личное/бытовое/семейное назначение (ст. 730 ГК РФ);
      (в) наличие ТЗ/спецификации как приложения.
    addressee: "Обе стороны"

  deadlines_and_penalty_risk_analysis:
    text: >
      Просим подтвердить по {doc_names}: (а) конкретные даты начала и окончания;
      (б) промежуточные сроки (если применимо); (в) понимание риска неустойки
      3% цены работы за каждый день просрочки (ст. 28 ЗоЗПП).
    addressee: "Подрядчик"

  estimate_firmness_check:
    text: >
      Просим подтвердить по {doc_names}: (а) смета является твёрдой (ст. 735 ГК РФ);
      (б) подрядчик не вправе требовать доплат; (в) порядок оформления
      дополнительных работ — только по отдельному письменному соглашению.
    addressee: "Юридический советник"

  mandatory_consumer_information_check:
    text: >
      Просим подтвердить по {doc_names} выполнение обязанности информирования
      (ст. 8–10 ЗоЗПП, ст. 732 ГК РФ): (а) полные данные о подрядчике;
      (б) описание работы, материалов, технологии; (в) рекомендации по эксплуатации;
      (г) информация о правах потребителя по ЗоЗПП.
    addressee: "Подрядчик"

  consumer_defect_rights_check:
    text: >
      Просим подтвердить по {doc_names}: полнота прав потребителя при недостатках
      (ст. 29 ЗоЗПП): безвозмездное устранение, уменьшение цены, возмещение
      расходов, отказ при существенных недостатках. Сокращение этих прав — ничтожно.
    addressee: "Юридический советник"

  materials_responsibility_consumer_check:
    text: >
      Просим уточнить в {doc_names}: (а) из чьих материалов выполняется работа
      (ст. 733–734 ГК РФ); (б) если из материалов подрядчика — указана ли их
      стоимость отдельно, гарантировано ли качество; (в) если из материалов
      заказчика — обязанность сбережения и возврата остатков; (г) порядок
      согласования замены материалов.
    addressee: "Обе стороны"

  receipt_document_required:
    text: >
      Просим включить в {doc_names}: выдачу квитанции или заказ-наряда при
      оформлении заказа (ст. 734 ГК РФ): номер заказа, дата приёма, наименование
      работы, материалы, ориентировочная стоимость, сроки выполнения, ФИО приёмщика.
    addressee: "Подрядчик"

  customer_materials_safekeeping:
    text: >
      Просим включить в {doc_names}: (а) акт приёма-передачи материалов заказчика;
      (б) обязанность бережного отношения; (в) порядок и сроки возврата остатков
      и отходов; (г) ответственность за утрату/повреждение (ст. 714, 728 ГК РФ).
    addressee: "Подрядчик"

  contractor_materials_price_quality:
    text: >
      Просим включить в {doc_names}: (а) наименование, марку и стоимость материалов
      подрядчика отдельной строкой в смете (ст. 733 ГК РФ); (б) гарантию качества;
      (в) порядок замены материалов на эквивалент — только с согласия заказчика.
    addressee: "Подрядчик"

  confidentiality_renovation:
    text: >
      Просим включить в {doc_names} (ремонт жилого помещения): (а) обязанность
      конфиденциальности; (б) режим доступа работников в помещение; (в) ответственность
      за сохранность имущества заказчика; (г) порядок передачи ключей.
    addressee: "Подрядчик"

  illegal_warranty_claim_period_reduction:
    text: >
      ВНИМАНИЕ: в {doc_names} выявлены условия, сокращающие срок предъявления
      претензий по качеству по сравнению с ЗоЗПП (ст. 29). Условия вроде
      «претензии только в течение 3 дней» или «подписание акта исключает претензии» —
      ничтожны. Просим исключить такие условия.
    addressee: "Юридический советник подрядчика"

  illegal_bundled_services_consumer:
    text: >
      ВНИМАНИЕ: в {doc_names} выявлены условия о навязывании дополнительных
      платных услуг или обязательном приобретении материалов у подрядчика
      как условие выполнения основной работы. Это нарушает ст. 16 ЗоЗПП.
      Просим сделать дополнительные услуги опциональными.
    addressee: "Юридический советник подрядчика"

  business_purpose_disqualification:
    text: >
      Внимание: в {doc_names} заказчик — физическое лицо, но работа заказана
      для предпринимательских/коммерческих целей. Бытовой подряд (§ 2 Главы 37 ГК РФ)
      и ЗоЗПП в этом случае не применяются. Просим переквалифицировать договор
      в общий подряд (§ 1 Главы 37 ГК РФ).
    addressee: "Юридический советник"

  # Generic fallback
  _default:
    text: >
      Просим предоставить дополнительную информацию по вопросу «{check_name}»
      применительно к {doc_names}.
    addressee: "Юридический советник"