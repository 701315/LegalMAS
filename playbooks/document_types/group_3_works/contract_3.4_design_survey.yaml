          display_priority: 4

  - id: sro_membership_check
    name: "Членство в СРО проектировщиков (ст. 55.8 ГрК РФ)"
    description: >
      Фактографическая проверка наличия и режима членства подрядчика (проектировщика /
      изыскателя) в саморегулируемой организации (СРО) в договоре на выполнение проектных
      и изыскательских работ (ПИР) в соответствии со ст. 55.8 Градостроительного кодекса РФ
      и Федеральным законом от 01.12.2007 № 315-ФЗ «О саморегулируемых организациях».
      Членство в СРО проектировщиков (Национальное объединение проектировщиков, НОП) или
      СРО изыскателей (Национальное объединение изыскателей, НОИЗ) — обязательное условие
      для выполнения работ по договору ПИР, связанных с подготовкой проектной документации,
      организацией работ по строительству, реконструкции, капитальному ремонту объектов
      капитального строительства, а также инженерных изысканий. Без действующего членства
      в СРО подрядчик не вправе выполнять такие работы, а договор может быть признан
      недействительным. Проверка выявляет четыре критических аспекта: (1) упоминание СРО
      в договоре — базовое подтверждение того, что вопрос членства вообще поднимается
      сторонами; (2) наименование и регистрационный номер СРО — позволяет проверить
      действительность членства в реестре НОП/НОИЗ; (3) обязанность подрядчика поддерживать
      членство в СРО на весь срок действия договора — стандартная защита заказчика от
      потери подрядчиком допуска в период выполнения работ; (4) последствия утраты членства
      — право заказчика на расторжение (termination_right), обязанность уведомить заказчика
      (notification) или неконкретизированная формулировка (not_specified). Отсутствие
      или неполнота регулирования членства в СРО создаёт для заказчика риск приёмки
      результатов работ от неквалифицированного исполнителя, риск невозможности прохождения
      экспертизы проектной документации и риск признания договора недействительным.
      Важно: данный check проверяет именно СРО проектировщиков/изыскателей, а не СРО
      строителей (это разные саморегулируемые организации с разными реестрами).
    triggers:
      any: ["sro_required"]
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "СРО"
        - "саморегулируемая организация"
        - "допуск СРО"
        - "членство в СРО"
        - "свидетельство СРО"
        - "компенсационный фонд"
        - "НОП"
        - "НОИЗ"
        - "национальное объединение"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)\\bСРО\\b"
        - "(?i)саморегулируем(ая|ой)\\s+организац"
        - "(?i)допуск\\s+СРО"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор на выполнение проектных и изыскательских работ (ПИР)
        (§ 4 Главы 37 ГК РФ; ГрК РФ ст. 55.8; ФЗ № 315-ФЗ «О саморегулируемых организациях»).
        Проверяется только один вопрос: членство подрядчика в саморегулируемой организации
        (СРО) проектировщиков или изыскателей.
        Нормативный ориентир:
        - ст. 55.8 ГрК РФ (членство в СРО)
        - ФЗ № 315-ФЗ (саморегулируемые организации)
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не выдумывай наименование, номер СРО или условия — извлекай строго из переданного фрагмента.
        - Не путай СРО проектировщиков / изыскателей (этот check) с СРО строителей (это разные организации).
        - Не путай членство в СРО с лицензией (это разные институты).

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Упоминается ли СРО в договоре.
        2. Наименование или регистрационный номер СРО.
        3. Обязанность подрядчика поддерживать членство в СРО на весь срок действия договора.
        4. Последствия утраты членства в СРО.

        [ПРАВИЛА]
        1. Используй только текст документа. Не выдумывай наименование, номер СРО или условия — извлекай строго из переданного фрагмента.
        2. Для enum-полей при отсутствии данных используй значение "not_defined".
        3. Для текстовых полей при отсутствии данных пиши "Данные не определены".
        4. Для полей *_display используй человеко-читаемые значения согласно маппингу.
        5. Различай:
           - "yes" — условие прямо указано в договоре
           - "no" — условие прямо исключено
           - "not_defined" — условие вообще не упоминается в договоре
           - "termination_right" — последствие: право заказчика на расторжение договора
           - "notification" — последствие: обязанность подрядчика уведомить заказчика
           - "not_specified" — последствие упомянуто, но не конкретизировано
        6. Критическое правило:
           - Если sro_mentioned = "no" (СРО вообще не упоминается в договоре), то все остальные поля (sro_maintenance_obligation, sro_loss_consequences) = "not_defined", display = "Не применимо". Поле sro_name_or_number = "Не применимо".
           - Если sro_mentioned = "yes" (СРО упомянута), но конкретный параметр не указан, то enum = "not_defined", display = "Данные не определены".
        7. Не путай:
           - СРО проектировщиков / изыскателей (этот check) с СРО строителей (это разные саморегулируемые организации)
           - Членство в СРО с лицензией (это разные институты)
           - Членство в СРО с наличием квалифицированного персонала (это разные требования)
        8. В evidence — только точные цитаты из документа с указанием пункта.
        9. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.без комментариев и markdown-обёртки.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — полный набор условий:
        Фрагмент:
        "Подрядчик подтверждает, что является членом СРО
        «Ассоциация проектировщиков» (рег. № СРО-П-123-456)
        Национального объединения проектировщиков. Подрядчик обязан
        поддерживать членство в СРО на весь срок действия договора.
        В случае утраты членства в СРО Заказчик вправе отказаться
        от исполнения договора в одностороннем порядке."
        Ответ:
        {
          "sro_mentioned": "yes",
          "sro_mentioned_display": "Да, СРО упомянута",
          "sro_name_or_number": "СРО «Ассоциация проектировщиков», рег. № СРО-П-123-456",
          "sro_maintenance_obligation": "yes",
          "sro_maintenance_obligation_display": "Да, обязан поддерживать членство",
          "sro_loss_consequences": "termination_right",
          "sro_loss_consequences_display": "Право Заказчика на расторжение",
          "evidence": [
            {
              "clause_ref": "п. 14.1",
              "quote": "Подрядчик подтверждает, что является членом СРО «Ассоциация проектировщиков» (рег. № СРО-П-123-456) Национального объединения проектировщиков."
            },
            {
              "clause_ref": "п. 14.2",
              "quote": "Подрядчик обязан поддерживать членство в СРО на весь срок действия договора."
            },
            {
              "clause_ref": "п. 14.3",
              "quote": "В случае утраты членства в СРО Заказчик вправе отказаться от исполнения договора в одностороннем порядке."
            }
          ]
        }

        Пример 2 — СРО упомянута, но обязанность поддерживать и последствия не указаны:
        Фрагмент:
        "Подрядчик является членом СРО изыскателей «Инженерный союз»
        (рег. № СРО-И-789-012)."
        Ответ:
        {
          "sro_mentioned": "yes",
          "sro_mentioned_display": "Да, СРО упомянута",
          "sro_name_or_number": "СРО «Инженерный союз», рег. № СРО-И-789-012",
          "sro_maintenance_obligation": "not_defined",
          "sro_maintenance_obligation_display": "Данные не определены",
          "sro_loss_consequences": "not_defined",
          "sro_loss_consequences_display": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 14.1",
              "quote": "Подрядчик является членом СРО изыскателей «Инженерный союз» (рег. № СРО-И-789-012)."
            }
          ]
        }

        Пример 3 — СРО не упомянута:
        Фрагмент:
        "Подрядчик обладает необходимой квалификацией для выполнения работ."
        Ответ:
        {
          "sro_mentioned": "no",
          "sro_mentioned_display": "Нет, СРО не упомянута",
          "sro_name_or_number": "Не применимо",
          "sro_maintenance_obligation": "not_defined",
          "sro_maintenance_obligation_display": "Не применимо",
          "sro_loss_consequences": "not_defined",
          "sro_loss_consequences_display": "Не применимо",
          "evidence": [
            {
              "clause_ref": "п. 14.1",
              "quote": "Подрядчик обладает необходимой квалификацией для выполнения работ."
            }
          ]
        }

        Пример 4 — СРО упомянута, последствие — уведомление:
        Фрагмент:
        "Подрядчик подтверждает членство в СРО проектировщиков
        «Проект-Союз» (рег. № СРО-П-456-789) и обязуется уведомить
        Заказчика в письменной форме в течение 3 рабочих дней
        в случае утраты членства в СРО."
        Ответ:
        {
          "sro_mentioned": "yes",
          "sro_mentioned_display": "Да, СРО упомянута",
