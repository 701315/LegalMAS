- id: assignment_and_subcontracting
  name: Субподряд и уступка прав (ст. 706 ГК РФ)
  description: Проверяет ограничения на привлечение субподрядчиков и уступку прав
  legal_base: ст. 706 ГК РФ
  triggers: null
  ui_mode: field_extraction
  severity: medium
  severity_if_pass: pass
  severity_if_fail: medium
  severity_if_unclear: medium
  origin: DOCUMENT_TYPE
  detector_type: hybrid
  rules:
    keywords:
    - субподрядчик
    - субподряд
    - привлечение третьих лиц
    - с согласия заказчика
    - без согласия
    - уступка
    - генеральный проектировщик
    keyword_mode: any
    regex_patterns:
    - (?i)субподряд
    - (?i)привлечен(ие|ия)\s+треть(их|его)
    - (?i)уступк(а|и)\s+прав
  llm:
    prompt_template: "[КОНТЕКСТ]\nТы — юрист, анализирующий договор ПИР.\nПроверяется только один вопрос: ограничения на привлечение субподрядчиков\nи уступку прав по договору.\n\nВажно:\n— Анализируй только положения о субподряде, привлечении третьих лиц и уступке прав.\n— Не оценивай риск и не смешивай субподряд с авторским надзором.\n— Если условие не установлено прямо, не домысливай.\n\n[ЗАДАЧА]\n1. Установить, допускается ли привлечение субподрядчиков.\n2. Определить условия привлечения.\n3. Установить, отвечает ли подрядчик за субподрядчиков.\n4. Установить, допускается ли уступка прав по договору.\n\n[ПРАВИЛА]\n1. subcontracting_allowed = \"yes_with_consent\" — допускается с согласия заказчика;\n   \"yes_without_consent\" — допускается без согласия;\n   \"prohibited\" — запрещено; \"not_found\" — тема отсутствует.\n2. contractor_liable_for_subs = \"yes\" — подрядчик отвечает за действия субподрядчиков;\n   \"no\" — тема раскрыта, но ответственность не установлена;\n   \"not_found\"\
      \ — тема отсутствует.\n3. assignment_allowed = \"yes_with_consent\" — допускается с согласия;\n   \"yes_without_consent\" — допускается без согласия;\n   \"prohibited\" — запрещена; \"not_found\" — тема отсутствует.\n4. Не путай субподряд с привлечением экспертов или консультантов заказчика.\n5. Не путай уступку с переменой стороны при реорганизации.\n6. Если тема субподряда есть, но условие сформулировано неясно,\n   используй \"yes_with_consent\" по умолчанию ГК РФ.\n7. Если договор молчит и о субподряде, и об уступке — все = \"not_found\".\n\n[ПРИМЕРЫ (FEW-SHOT)]\nПример 1 — субподряд и уступка урегулированы:\nТекст: «Подрядчик вправе привлекать субподрядчиков только с письменного\nсогласия Заказчика. Подрядчик несёт ответственность за действия\nсубподрядчиков как за свои собственные. Уступка прав по договору\nдопускается только с письменного согласия другой стороны.»\n\nОтвет:\n{\n  \"subcontracting_allowed\": \"yes_with_consent\",\n  \"contractor_liable_for_subs\": \"yes\",\n\
      \  \"assignment_allowed\": \"yes_with_consent\",\n  \"evidence\": [\n    \"Подрядчик вправе привлекать субподрядчиков только с письменного согласия Заказчика.\",\n    \"Подрядчик несёт ответственность за действия субподрядчиков как за свои собственные.\",\n    \"Уступка прав по договору допускается только с письменного согласия другой стороны.\"\n  ]\n}\n\nПример 2 — тема не раскрыта:\nТекст: «Подрядчик выполняет работы самостоятельно.»\n\nОтвет:\n{\n  \"subcontracting_allowed\": \"prohibited\",\n  \"contractor_liable_for_subs\": \"not_found\",\n  \"assignment_allowed\": \"not_found\",\n  \"evidence\": [\n    \"Подрядчик выполняет работы самостоятельно.\"\n  ]\n}\n\n[ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]\n1. Разграничены ли субподряд и уступка прав?\n2. Есть ли явное условие о согласии заказчика?\n3. Установлена ли ответственность подрядчика за субподрядчиков?\n4. Не перепутаны ли уступка и реорганизация?\n5. Все ли ключи JSON совпадают со schema?\n\n[ФОРМАТ ОТВЕТА]\nВерни строго JSON:\n\
      {\n  \"subcontracting_allowed\": \"<yes_with_consent / yes_without_consent / prohibited / not_found>\",\n  \"contractor_liable_for_subs\": \"<yes / no / not_found>\",\n  \"assignment_allowed\": \"<yes_with_consent / yes_without_consent / prohibited / not_found>\",\n  \"evidence\": [\"<цитата 1>\", \"<цитата 2>\"]\n}\n"
    prompt_file: null
    context_k: 5
    temperature: 0.0
    max_tokens: 420
  retrieval:
    corpus_scope: document
    context_k: 5
    max_chunks: 6
    boost_keywords:
    - субподрядчик
    - субподряд
    - привлечение третьих лиц
    - уступка прав
    negative_keywords:
    - экспертиза
    - форс-мажор
    - неустойка
    - подсудность
    rerank: true
    filters: {}
  enrichment_hints:
    preferred_segment_types:
    - clause
    - article
    excluded_segment_types:
    - signature_block
    preferred_clause_functions:
    - procedures
    - procedures
    confidence_bonus_on_match: 0.1
    confidence_penalty_on_excluded_segment: 0.12
  evidence:
    required: true
    min_snippet_length: 30
    max_snippet_length: 500
  extraction:
    enabled: true
    mode: hybrid
    store_payload: true
    llm_max_tokens: 450
    compact_output: false
    llm_prompt_extraction: "<role>\nТы — юрист, извлекающий сведения о субподряде и уступке прав\nв договоре ПИР. Не оценивай риски. Только заполняй поля строго по тексту.\n</role>\n\n<context>\n{context}\n</context>\n\n<task>\nЗаполни строго следующие поля:\n\nsubcontracting_allowed — допустимость привлечения субподрядчиков\n  (allowed: yes_with_consent / yes_without_consent / prohibited / not_found).\n\ncontractor_liable_for_subs — ответственность подрядчика за субподрядчиков\n  (allowed: yes / no / not_found).\n\nassignment_allowed — допустимость уступки прав по договору\n  (allowed: yes_with_consent / yes_without_consent / prohibited / not_found).\n\nЕсли данные отсутствуют: указывай \"not_found\".\n</task>\n\n<rules>\n1. subcontracting_allowed: \"yes_with_consent\" — с согласия заказчика;\n   \"yes_without_consent\" — без согласия; \"prohibited\" — запрещено;\n   \"not_found\" — тема отсутствует.\n2. contractor_liable_for_subs: \"yes\" — отвечает за субподрядчиков;\n   \"no\" — тема\
      \ раскрыта, но ответственность не установлена;\n   \"not_found\" — тема отсутствует.\n3. assignment_allowed: \"yes_with_consent\" — с согласия;\n   \"yes_without_consent\" — без согласия; \"prohibited\" — запрещена;\n   \"not_found\" — тема отсутствует.\n4. Не добавляй ключи, не входящие в список полей.\n5. Верни только JSON.\n</rules>\n"
    fields:
    - name: subcontracting_allowed
      type: string
      label: Субподряд
      presentation: badge
      display_in_grid: true
      display_priority: 1
      allowed_values:
      - yes_with_consent
      - yes_without_consent
      - prohibited
      - not_found
      description: Допустимость привлечения субподрядчиков.
      required: true
    - name: contractor_liable_for_subs
      type: string
      label: Ответственность за субподрядчиков
      presentation: badge
      display_in_grid: true
      display_priority: 2
      allowed_values:
      - 'yes'
      - 'no'
      - not_found
      description: Отвечает ли подрядчик за действия субподрядчиков.
      required: false
    - name: assignment_allowed
      type: string
      label: Уступка прав
      presentation: badge
      display_in_grid: true
      display_priority: 3
      allowed_values:
      - yes_with_consent
      - yes_without_consent
      - prohibited
      - not_found
      description: Допустимость уступки прав по договору.
      required: false
- id: ip_rights_on_documentation
  name: Интеллектуальные права на ПД (ст. 1296, 1298 ГК РФ)
  description: 'Проверяет условия передачи исключительных прав на проектную документацию.

    По умолчанию ИП принадлежат автору/подрядчику. Без явной передачи заказчик

    получает лишь право на однократную реализацию проекта и не сможет использовать

    его повторно (типовая застройка), вносить изменения или передавать третьим лицам.

    '
  legal_base: ст. 1296, 1298 ГК РФ
  triggers:
    any:
    - ip_rights_transfer
  ui_mode: field_extraction
  severity: high
  severity_if_pass: pass
  severity_if_fail: high
  severity_if_unclear: high
  origin: DOCUMENT_TYPE
  detector_type: hybrid
  rules:
    keywords:
    - исключительные права
    - интеллектуальные права
    - авторские права
    - передача прав
    - отчуждение исключительного права
    - лицензия на использование
    - право на использование
    - тиражирование
    - модификация проекта
    keyword_mode: any
    regex_patterns:
    - (?i)исключительн(ые|ое|ых)\s+прав
    - (?i)интеллектуальн(ые|ых)\s+прав
    - (?i)передач(а|и)\s+прав.*на.*документац
  llm:
    prompt_template: "[КОНТЕКСТ]\nТы — юрист, анализирующий договор ПИР.\nПроверяется только один вопрос: условия передачи исключительных\n(интеллектуальных) прав на проектную документацию от подрядчика к заказчику.\n\nВажно:\n— Анализируй только положения об интеллектуальных правах, лицензиях,\n  передаче прав и ограничениях на использование ПД.\n— Не оценивай риск и не делай выводов вне текста.\n— Если вопрос ИП не раскрыт, не применяй диспозитивные нормы ГК\n  как факт — просто ставь \"not_found\".\n\n[ЗАДАЧА]\n1. Установить статус передачи исключительных прав.\n2. Определить момент перехода прав.\n3. Определить, разрешено ли повторное использование проекта.\n4. Определить, разрешена ли модификация проекта без согласия автора.\n\n[ПРАВИЛА]\n1. ip_transfer_status = \"full_transfer\" — полная передача исключительных прав\n   заказчику (отчуждение); \"license\" — лицензия (ограниченное право использования);\n   \"retained_by_contractor\" — права прямо остаются у подрядчика;\n   \"not_found\"\
      \ — вопрос не раскрыт.\n2. ip_transfer_moment = \"upon_payment\" — после оплаты;\n   \"upon_signing\" — при подписании договора;\n   \"upon_acceptance\" — при подписании акта приёмки;\n   \"not_specified\" — тема есть, но момент не определён;\n   \"not_found\" — тема отсутствует.\n3. reuse_allowed = \"yes\" — повторное использование разрешено;\n   \"no\" — прямо запрещено; \"unclear\" — неясно;\n   \"not_found\" — тема отсутствует.\n4. modification_allowed = \"yes\" — модификация без согласия автора разрешена;\n   \"no\" — прямо запрещена или требует согласия;\n   \"unclear\" — неясно; \"not_found\" — тема отсутствует.\n5. Не путай передачу исключительных прав с правом на однократную реализацию проекта.\n6. Не путай лицензию (ограниченное право) с полной передачей.\n7. Если говорится о «праве использования», но без уточнения — это \"license\".\n\n[ПРИМЕРЫ (FEW-SHOT)]\nПример 1 — полная передача прав:\nТекст: «Исключительные права на проектную документацию переходят к Заказчику\nв полном\
      \ объёме с момента подписания акта сдачи-приёмки и полной оплаты работ.\nЗаказчик вправе использовать документацию повторно, вносить в неё изменения\nи передавать третьим лицам без согласия Подрядчика.»\n\nОтвет:\n{\n  \"ip_transfer_status\": \"full_transfer\",\n  \"ip_transfer_moment\": \"upon_acceptance\",\n  \"reuse_allowed\": \"yes\",\n  \"modification_allowed\": \"yes\",\n  \"evidence\": [\n    \"Исключительные права на проектную документацию переходят к Заказчику в полном объёме с момента подписания акта сдачи-приёмки и полной оплаты работ.\",\n    \"Заказчик вправе использовать документацию повторно, вносить в неё изменения и передавать третьим лицам без согласия Подрядчика.\"\n  ]\n}\n\nПример 2 — вопрос не раскрыт:\nТекст: «Подрядчик передаёт Заказчику результаты работ в составе,\nпредусмотренном договором.»\n\nОтвет:\n{\n  \"ip_transfer_status\": \"not_found\",\n  \"ip_transfer_moment\": \"not_found\",\n  \"reuse_allowed\": \"not_found\",\n  \"modification_allowed\": \"not_found\"\
      ,\n  \"evidence\": []\n}\n\n[ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]\n1. Различены ли полная передача прав и лицензия?\n2. Определён ли момент перехода прав как отдельное условие?\n3. Разграничены ли повторное использование и модификация?\n4. Не приняты ли диспозитивные нормы ГК за факт из текста?\n5. Все ли ключи JSON совпадают со schema?\n\n[ФОРМАТ ОТВЕТА]\nВерни строго JSON:\n{\n  \"ip_transfer_status\": \"<full_transfer / license / retained_by_contractor / not_found>\",\n  \"ip_transfer_moment\": \"<upon_payment / upon_signing / upon_acceptance / not_specified / not_found>\",\n  \"reuse_allowed\": \"<yes / no / unclear / not_found>\",\n  \"modification_allowed\": \"<yes / no / unclear / not_found>\",\n  \"evidence\": [\"<цитата 1>\", \"<цитата 2>\"]\n}\n"
    prompt_file: null
    context_k: 5
    temperature: 0.0
    max_tokens: 480
  retrieval:
    corpus_scope: document
    context_k: 5
    max_chunks: 8
    retrieval_profile: ip_ownership_check
    boost_keywords:
    - исключительные права
    - интеллектуальные права
    - передача прав
    - лицензия
    - авторские права
    - модификация
    - повторное использование
    negative_keywords:
    - экспертиза
    - форс-мажор
    - неустойка
    - подсудность
    rerank: true
    filters: {}
  enrichment_hints:
    preferred_segment_types:
    - clause
    - article
    excluded_segment_types:
    - signature_block
    preferred_clause_functions:
    - rights
    - procedures
    confidence_bonus_on_match: 0.1
    confidence_penalty_on_excluded_segment: 0.12
  evidence:
    required: true
    min_snippet_length: 40
    max_snippet_length: 600
  extraction:
    enabled: true
    mode: hybrid
    store_payload: true
    llm_max_tokens: 550
    compact_output: false
    llm_prompt_extraction: "<role>\nТы — юрист, извлекающий сведения о передаче интеллектуальных прав\nна проектную документацию в договоре ПИР. Не оценивай риски.\nТолько заполняй поля строго по тексту.\n</role>\n\n<context>\n{context}\n</context>\n\n<task>\nЗаполни строго следующие поля:\n\nip_transfer_status — статус передачи исключительных прав\n  (allowed: full_transfer / license / retained_by_contractor / not_found).\n\nip_transfer_moment — момент перехода прав\n  (allowed: upon_payment / upon_signing / upon_acceptance / not_specified / not_found).\n\nreuse_allowed — разрешено ли повторное использование проекта\n  (allowed: yes / no / unclear / not_found).\n\nmodification_allowed — разрешена ли модификация без согласия автора\n  (allowed: yes / no / unclear / not_found).\n\nЕсли данные отсутствуют: указывай \"not_found\".\n</task>\n\n<rules>\n1. ip_transfer_status: \"full_transfer\" — полная передача (отчуждение);\n   \"license\" — ограниченное право использования;\n   \"retained_by_contractor\"\
      \ — права остаются у подрядчика;\n   \"not_found\" — тема отсутствует.\n2. ip_transfer_moment: \"upon_payment\" — после оплаты;\n   \"upon_signing\" — при подписании; \"upon_acceptance\" — при приёмке;\n   \"not_specified\" — момент не определён; \"not_found\" — тема отсутствует.\n3. reuse_allowed: \"yes\" — разрешено; \"no\" — запрещено;\n   \"unclear\" — неясно; \"not_found\" — тема отсутствует.\n4. modification_allowed: \"yes\" — разрешена; \"no\" — запрещена\n   или требует согласия; \"unclear\" — неясно; \"not_found\" — тема отсутствует.\n5. Не добавляй ключи, не входящие в список полей.\n6. Верни только JSON.\n</rules>\n"
    fields:
