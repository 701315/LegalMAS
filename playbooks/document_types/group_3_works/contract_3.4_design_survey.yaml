  - id: warranty_period_for_documentation
    name: "Гарантийный срок на проектную документацию (ст. 724, 761 ГК РФ)"
    description: >
      Фактографическая проверка гарантийного срока на проектную и изыскательскую
      документацию в договоре на выполнение проектных и изыскательских работ (ПИР)
      в соответствии со ст. 724 и ст. 761 ГК РФ. Гарантийный срок — это период,
      в течение которого подрядчик (проектировщик) несёт ответственность за выявленные
      недостатки документации и обязан безвозмездно их устранить. Это отдельный институт,
      отличный от гарантии качества (Check 19): гарантия качества — это обязательство
      соответствия нормативам/ТЗ на момент создания документации; гарантийный срок —
      это период ответственности за недостатки, выявленные после приёмки. Для договоров
      ПИР гарантийный срок типично составляет 12–60 месяцев. Проверка выявляет пять
      критических аспектов: (1) наличие гарантийного срока — без него заказчик теряет
      инструмент защиты от скрытых дефектов проектных решений; (2) продолжительность
      гарантийного срока — определяет период ответственности подрядчика; (3) момент
      начала отсчёта — с даты подписания акта сдачи-приёмки (типично), с даты ввода
      объекта в эксплуатацию или с даты получения положительного заключения экспертизы
      (специфика ПИР); (4) безвозмездное устранение дефектов — стандартная гарантия
      подрядчика; (5) срок устранения дефектов — типично 10–30 рабочих дней с момента
      получения претензии. Отсутствие или неполнота регулирования гарантийного срока
      создаёт риски невозможности взыскания с подрядчика расходов на устранение скрытых
      дефектов проектной документации, выявленных после приёмки. Важно: данный check
      проверяет именно гарантийный срок (период ответственности), а не гарантию качества
      (обязательство соответствия нормативам — Check 19).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "гарантийный срок"
        - "гарантия на документацию"
        - "безвозмездное устранение"
        - "дефекты документации"
        - "гарантийные обязательства"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)гарантийн(ый|ого)\\s+срок"
        - "(?i)безвозмездн(ое|ого)\\s+устранен"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор на выполнение проектных и изыскательских работ (ПИР)
        (§ 4 Главы 37 ГК РФ, ст. 724, 761).
        Проверяется только один вопрос: гарантийный срок на ПД.
        Нормативный ориентир:
        - ст. 724 ГК РФ (гарантийный срок в подряде)
        - ст. 761 ГК РФ (ответственность за недостатки ПД)
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не выдумывай сроки, даты или условия — извлекай строго из переданного фрагмента.
        - Не путай гарантийный срок (период ответственности за недостатки) с гарантией качества (обязательство соответствия нормативам — Check 19).
        - Это разные юридические институты.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Установлен ли гарантийный срок на ПД.
        2. Продолжительность гарантийного срока.
        3. Момент начала отсчёта (с даты приёмки / ввода в эксплуатацию / экспертизы).
        4. Предусмотрено ли безвозмездное устранение дефектов.
        5. Срок устранения дефектов в гарантийный период.

        [ПРАВИЛА]
        1. Используй только текст документа. Не выдумывай сроки или условия — извлекай строго из переданного фрагмента.
        2. Для enum-полей при отсутствии данных используй значение "not_defined".
        3. Для текстовых полей при отсутствии данных пиши "Данные не определены".
        4. Для полей *_display используй человеко-читаемые значения согласно маппингу.
        5. Различай:
           - "yes" — условие прямо указано в договоре
           - "no" — условие прямо исключено
           - "not_defined" — условие вообще не упоминается в договоре
           - "from_acceptance" — момент начала: с даты подписания акта сдачи-приёмки
           - "from_commissioning" — момент начала: с даты ввода объекта в эксплуатацию
           - "from_expertise" — момент начала: с даты получения положительного заключения экспертизы
           - "not_specified" — момент начала упомянут, но не конкретизирован
        6. Критическое правило:
           - Если warranty_period_present = "no" (гарантийный срок прямо исключён), то все остальные поля (warranty_start_event, free_defect_remedy) = "not_defined", display = "Не применимо". Текстовые поля (warranty_period_duration, defect_remedy_period) = "Не применимо".
           - Если warranty_period_present = "not_defined" (условие не упоминается), то остальные поля = "not_defined", display = "Данные не определены".
        7. Не путай:
           - Гарантийный срок (этот check — период ответственности за недостатки) с гарантией качества (Check 19 — обязательство соответствия нормативам)
           - Гарантийный срок на ПД с гарантийным сроком на строительные работы (это разные объекты)
        8. Если гарантийный срок или срок устранения определяется по приложению/доп. соглашению (например, "Гарантийный срок определяется согласно Приложению № 7") — это валидный исход, укажи ссылку.
        9. В evidence — только точные цитаты из документа с указанием пункта.
        10. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.без комментариев и markdown-обёртки.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — полный набор условий:
        Фрагмент:
        "Гарантийный срок на проектную документацию составляет 36 месяцев
        с даты подписания акта сдачи-приёмки. В течение гарантийного срока
        Подрядчик обязан безвозмездно устранить дефекты документации
        в течение 15 рабочих дней с момента получения претензии."
        Ответ:
        {
          "warranty_period_present": "yes",
          "warranty_period_present_display": "Да, установлен",
          "warranty_period_duration": "36 месяцев",
          "warranty_start_event": "from_acceptance",
          "warranty_start_event_display": "С даты подписания акта сдачи-приёмки",
          "free_defect_remedy": "yes",
          "free_defect_remedy_display": "Да, предусмотрено",
          "defect_remedy_period": "15 рабочих дней",
          "evidence": [
            {
              "clause_ref": "п. 12.3",
              "quote": "Гарантийный срок на проектную документацию составляет 36 месяцев с даты подписания акта сдачи-приёмки."
            },
            {
              "clause_ref": "п. 12.4",
              "quote": "В течение гарантийного срока Подрядчик обязан безвозмездно устранить дефекты документации в течение 15 рабочих дней с момента получения претензии."
            }
          ]
        }

        Пример 2 — срок с даты ввода в эксплуатацию:
        Фрагмент:
        "Гарантийный срок на документацию составляет 24 месяца с даты
        ввода объекта в эксплуатацию. Подрядчик безвозмездно устраняет
        выявленные недостатки в 30-дневный срок."
        Ответ:
        {
          "warranty_period_present": "yes",
          "warranty_period_present_display": "Да, установлен",
          "warranty_period_duration": "24 месяца",
          "warranty_start_event": "from_commissioning",
          "warranty_start_event_display": "С даты ввода объекта в эксплуатацию",
          "free_defect_remedy": "yes",
          "free_defect_remedy_display": "Да, предусмотрено",
          "defect_remedy_period": "30 календарных дней",
          "evidence": [
            {
              "clause_ref": "п. 12.3",
              "quote": "Гарантийный срок на документацию составляет 24 месяца с даты ввода объекта в эксплуатацию."
            },
            {
              "clause_ref": "п. 12.4",
              "quote": "Подрядчик безвозмездно устраняет выявленные недостатки в 30-дневный срок."
            }
          ]
        }

        Пример 3 — гарантийный срок не установлен:
        Фрагмент:
        "Гарантийный срок на проектную документацию не устанавливается."
        Ответ:
        {
          "warranty_period_present": "no",
          "warranty_period_present_display": "Нет, гарантийный срок не установлен",
          "warranty_period_duration": "Не применимо",
          "warranty_start_event": "not_defined",
          "warranty_start_event_display": "Не применимо",
          "free_defect_remedy": "not_defined",
          "free_defect_remedy_display": "Не применимо",
          "defect_remedy_period": "Не применимо",
          "evidence": [
            {
              "clause_ref": "п. 12.3",
              "quote": "Гарантийный срок на проектную документацию не устанавливается."
            }
          ]
        }

        Пример 4 — срок по приложению:
        Фрагмент:
        "Гарантийный срок на документацию определяется согласно Приложению № 7.
        Устранение дефектов осуществляется безвозмездно в сроки, установленные
        указанным приложением."
        Ответ:
        {
          "warranty_period_present": "yes",
          "warranty_period_present_display": "Да, установлен",
          "warranty_period_duration": "Согласно Приложению № 7",
          "warranty_start_event": "not_specified",
          "warranty_start_event_display": "Не указан",
          "free_defect_remedy": "yes",
          "free_defect_remedy_display": "Да, предусмотрено",
          "defect_remedy_period": "Согласно Приложению № 7",
          "evidence": [
            {
              "clause_ref": "п. 12.3",
              "quote": "Гарантийный срок на документацию определяется согласно Приложению № 7."
            },
            {
              "clause_ref": "п. 12.4",
              "quote": "Устранение дефектов осуществляется безвозмездно в сроки, установленные указанным приложением."
            }
          ]
        }

        Пример 5 — данные отсутствуют:
        Фрагмент:
        "Подрядчик гарантирует качество проектной документации."
        Ответ:
        {
          "warranty_period_present": "not_defined",
          "warranty_period_present_display": "Данные не определены",
          "warranty_period_duration": "Данные не определены",
          "warranty_start_event": "not_defined",
          "warranty_start_event_display": "Данные не определены",
          "free_defect_remedy": "not_defined",
          "free_defect_remedy_display": "Данные не определены",
          "defect_remedy_period": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 12.1",
              "quote": "Подрядчик гарантирует качество проектной документации."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Проверяется ли именно гарантийный срок (период ответственности), а не гарантия качества (обязательство соответствия)?
        2. Извлечена ли продолжительность гарантийного срока?
        3. Определён ли момент начала отсчёта (с приёмки / ввода в эксплуатацию / экспертизы)?
        4. Есть ли безвозмездное устранение дефектов?
        5. Есть ли срок устранения дефектов?
        6. Если гарантийный срок прямо исключён (warranty_period_present = "no") — все остальные поля = "Не применимо"?
        7. Все ли 9 ключей присутствуют в JSON (5 основных + 4 display)?
        8. Совпадают ли enum-значения с их display-версиями согласно маппингу?
        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми ключами. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки:
        {
          "warranty_period_present": "<yes / no / not_defined>",
          "warranty_period_present_display": "<Да, установлен / Нет, гарантийный срок не установлен / Данные не определены>",
          "warranty_period_duration": "<продолжительность / ссылка на приложение / 'Данные не определены' / 'Не применимо'>",
          "warranty_start_event": "<from_acceptance / from_commissioning / from_expertise / not_specified / not_defined>",
          "warranty_start_event_display": "<С даты подписания акта сдачи-приёмки / С даты ввода объекта в эксплуатацию / С даты получения положительного заключения экспертизы / Не указан / Данные не определены / Не применимо>",
          "free_defect_remedy": "<yes / no / not_defined>",
          "free_defect_remedy_display": "<Да, предусмотрено / Нет, не предусмотрено / Данные не определены / Не применимо>",
          "defect_remedy_period": "<срок устранения / ссылка на приложение / 'Данные не определены' / 'Не применимо'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 480
    retrieval:
      retrieval_profile: "warranties_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "гарантийный срок продолжительность момент начала отсчёт с даты подписания акта ввода эксплуатацию экспертиза безвозмездное устранение дефекты документации гарантийные обязательства срок устранения претензия"
      preferred_unit_types:
        - warranty
        - obligation
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - representations
        - remedies
      negative_keywords:
        - "гарантирует соответствие"
        - "соответствие нормативам"
        - "техническое задание"
        - "экспертиза проектной документации"
        - "форс-мажор"
        - "подсудность"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.30, 0.80]
        boost: 0.12
        scope: segment
      context_k: 5
      max_chunks: 8
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "representations"
        - "remedies"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 700
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора ПИР сведения о гарантийном
        сроке на проектную документацию: наличие, продолжительность, момент начала,
        безвозмездное устранение дефектов, срок устранения.
        Не анализируй гарантию качества (Check 19), экспертизу ПД или иные темы.
        Не путай гарантийный срок (период ответственности за недостатки) с гарантией
        качества (обязательство соответствия нормативам).
        </role>
        <context>
        {context}
        </context>
        <task>
        Заполни строго следующие 9 полей (плюс evidence):
        1. warranty_period_present — установлен ли гарантийный срок: yes / no / not_defined.
        2. warranty_period_present_display — человеко-читаемое значение: "Да, установлен" / "Нет, гарантийный срок не установлен" / "Данные не определены".
        3. warranty_period_duration — продолжительность гарантийного срока (текст) или "Данные не определены" или "Не применимо".
        4. warranty_start_event — момент начала отсчёта: from_acceptance / from_commissioning / from_expertise / not_specified / not_defined.
        5. warranty_start_event_display — человеко-читаемое значение: "С даты подписания акта сдачи-приёмки" / "С даты ввода объекта в эксплуатацию" / "С даты получения положительного заключения экспертизы" / "Не указан" / "Данные не определены" / "Не применимо".
        6. free_defect_remedy — безвозмездное устранение дефектов: yes / no / not_defined.
        7. free_defect_remedy_display — человеко-читаемое значение: "Да, предусмотрено" / "Нет, не предусмотрено" / "Данные не определены" / "Не применимо".
        8. defect_remedy_period — срок устранения дефектов (текст) или "Данные не определены" или "Не применимо".

        Маппинг enum → display:
        - warranty_period_present: yes → "Да, установлен", no → "Нет, гарантийный срок не установлен", not_defined → "Данные не определены"
        - warranty_start_event: from_acceptance → "С даты подписания акта сдачи-приёмки", from_commissioning → "С даты ввода объекта в эксплуатацию", from_expertise → "С даты получения положительного заключения экспертизы", not_specified → "Не указан", not_defined → "Данные не определены" или "Не применимо"
        - free_defect_remedy: yes → "Да, предусмотрено", no → "Нет, не предусмотрено", not_defined → "Данные не определены" или "Не применимо"

        Критическое правило:
        - Если warranty_period_present = "no" (гарантийный срок прямо исключён), то warranty_start_event, free_defect_remedy = "not_defined", display = "Не применимо". Текстовые поля (warranty_period_duration, defect_remedy_period) = "Не применимо".
        - Если warranty_period_present = "not_defined" (условие не упоминается), то все остальные поля = "not_defined", display = "Данные не определены".
        </task>
        <context_rules>
        - Используй только текст договора. Не выдумывай сроки или условия — извлекай строго из переданного фрагмента.
        - Не опирайся на внешние знания о типовых условиях договоров ПИР.
        - Не путай гарантийный срок (период ответственности за недостатки) с гарантией качества (обязательство соответствия нормативам — Check 19).
        - Не путай гарантийный срок на ПД с гарантийным сроком на строительные работы.
        - Верни строго валидный JSON. Все 9 ключей + evidence обязаны присутствовать.
        - Запрещены: null, None, пустые строки "". Для текстовых полей при отсутствии данных — "Данные не определены".
        - Убедись, что enum-значения соответствуют их display-версиям согласно маппингу выше.
        - Различай "no" (условие прямо исключено) и "not_defined" (условие вообще не упоминается).
        - Если гарантийный срок определяется по приложению — укажи ссылку в warranty_period_duration, а не "Данные не определены".
        </context_rules>

        <output_expectations>
        - Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        - Не используй markdown fences.
        - Не добавляй пояснения до или после JSON.
        - Верни все ключи, перечисленные в task, без пропусков.
        - Не используй null, None или пустые строки.
        - Для статусных полей используй только значения из allowed_values или "not_defined".
        - Для текстовых полей при отсутствии данных используй "Данные не определены" / "Не удалось определить" / "Не применимо" — согласно правилам выше.
        </output_expectations>
