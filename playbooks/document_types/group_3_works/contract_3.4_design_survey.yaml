- id: designer_vs_builder_liability
  name: Разграничение ответственности проектировщика и строителя (ст. 761 ГК РФ)
  description: 'Проверяет наличие условия о разграничении ответственности проектировщика

    и строительного подрядчика. Без чёткого разграничения проектировщик

    втягивается в споры о строительных дефектах, к которым не причастен.

    '
  legal_base: ст. 761 ГК РФ
  triggers: null
  ui_mode: field_extraction
  severity: high
  severity_if_pass: pass
  severity_if_fail: high
  severity_if_unclear: high
  origin: DOCUMENT_TYPE
  detector_type: hybrid
  rules:
    keywords:
    - ответственность ограничивается качеством документации
    - не несет ответственности за действия строителей
    - отклонения от проекта без согласования
    - авторский надзор
    - реализация проекта строителями
    keyword_mode: any
    regex_patterns:
    - (?i)не\s+отвеча(ет|ть)\s+за.*реализац.*строител
    - (?i)ответственност.*ограничива(ется|ясь).*качеств.*документац
  llm:
    prompt_template: "[КОНТЕКСТ]\nТы — юрист, анализирующий договор ПИР.\nПроверяется только один вопрос: разграничена ли ответственность\nпроектировщика и строительного подрядчика за дефекты.\n\nВажно:\n— Анализируй только положения о разграничении ответственности\n  между проектировщиком и строителем.\n— Не оценивай риск и не смешивай с ответственностью за ошибки\n  непосредственно в проектной документации.\n— Если условие не установлено прямо, не домысливай.\n\n[ЗАДАЧА]\n1. Установить, предусмотрено ли разграничение ответственности.\n2. Определить scope ответственности проектировщика.\n3. Установить, является ли авторский надзор отдельной услугой/договором.\n\n[ПРАВИЛА]\n1. delimitation_present = \"yes\" — если договор прямо разграничивает\n   ответственность проектировщика и строителя;\n   \"no\" — если тема раскрыта, но разграничения нет;\n   \"not_found\" — если тема отсутствует.\n2. designer_scope = \"documentation_quality_only\" — проектировщик отвечает\n   только за качество документации,\
      \ но не за реализацию;\n   \"includes_supervision\" — включает ответственность за надзор при строительстве;\n   \"not_specified\" — тема есть, но scope не определён;\n   \"not_found\" — тема отсутствует.\n3. author_supervision_separate = \"yes\" — авторский надзор оформлен\n   как отдельная услуга или отдельный договор;\n   \"no\" — тема раскрыта, но надзор не выделен;\n   \"not_found\" — тема отсутствует.\n4. Не путай разграничение ответственности между проектировщиком и строителем\n   с общей ответственностью подрядчика за качество работ.\n5. Не путай авторский надзор с техническим надзором заказчика.\n6. Если тема не затронута в договоре — все = \"not_found\".\n7. Не подменяй факт из текста диспозитивной нормой ГК.\n\n[ПРИМЕРЫ (FEW-SHOT)]\nПример 1 — разграничение установлено:\nТекст: «Ответственность Подрядчика ограничивается качеством\nпроектной документации. Подрядчик не несёт ответственности\nза отклонения от проекта, допущенные строительным подрядчиком\nбез письменного согласования.\
      \ Авторский надзор осуществляется\nпо отдельному договору.»\n\nОтвет:\n{\n  \"delimitation_present\": \"yes\",\n  \"designer_scope\": \"documentation_quality_only\",\n  \"author_supervision_separate\": \"yes\",\n  \"evidence\": [\n    \"Ответственность Подрядчика ограничивается качеством проектной документации.\",\n    \"Подрядчик не несёт ответственности за отклонения от проекта, допущенные строительным подрядчиком без письменного согласования.\",\n    \"Авторский надзор осуществляется по отдельному договору.\"\n  ]\n}\n\nПример 2 — тема не раскрыта:\nТекст: «Подрядчик несёт ответственность за качество работ.»\n\nОтвет:\n{\n  \"delimitation_present\": \"not_found\",\n  \"designer_scope\": \"not_found\",\n  \"author_supervision_separate\": \"not_found\",\n  \"evidence\": [\n    \"Подрядчик несёт ответственность за качество работ.\"\n  ]\n}\n\n[ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]\n1. Есть ли в тексте явное разграничение между проектировщиком и строителем?\n2. Ограничена ли ответственность\
      \ именно качеством ПД?\n3. Выделен ли авторский надзор как отдельная услуга?\n4. Все ли ключи JSON совпадают со schema?\n\n[ФОРМАТ ОТВЕТА]\nВерни строго JSON:\n{\n  \"delimitation_present\": \"<yes / no / not_found>\",\n  \"designer_scope\": \"<documentation_quality_only / includes_supervision / not_specified / not_found>\",\n  \"author_supervision_separate\": \"<yes / no / not_found>\",\n  \"evidence\": [\"<цитата 1>\", \"<цитата 2>\"]\n}\n"
    prompt_file: null
    context_k: 5
    temperature: 0.0
    max_tokens: 420
  retrieval:
    retrieval_profile: liability_cap_check
    corpus_scope: document
    context_k: 5
    max_chunks: 6
    boost_keywords:
    - разграничение ответственности
    - качество документации
    - авторский надзор
    - строительный подрядчик
    negative_keywords:
    - экспертиза
    - форс-мажор
    - подсудность
    - аванс
    rerank: true
    filters: {}
  enrichment_hints:
    preferred_segment_types:
    - clause
    - article
    excluded_segment_types:
    - signature_block
    preferred_clause_functions:
    - limitations
    - obligations
    confidence_bonus_on_match: 0.1
    confidence_penalty_on_excluded_segment: 0.12
  evidence:
    required: true
    min_snippet_length: 40
    max_snippet_length: 500
  extraction:
    enabled: true
    mode: hybrid
    store_payload: true
    llm_max_tokens: 450
    compact_output: false
    llm_prompt_extraction: "<role>\nТы — юрист, извлекающий сведения о разграничении ответственности\nпроектировщика и строителя в договоре ПИР. Не оценивай риски.\nТолько заполняй поля строго по тексту.\n</role>\n\n<context>\n{context}\n</context>\n\n<task>\nЗаполни строго следующие поля:\n\ndelimitation_present — предусмотрено ли разграничение ответственности\n  (allowed: yes / no / not_found).\n\ndesigner_scope — scope ответственности проектировщика\n  (allowed: documentation_quality_only / includes_supervision / not_specified / not_found).\n\nauthor_supervision_separate — авторский надзор как отдельная услуга/договор\n  (allowed: yes / no / not_found).\n\nЕсли данные отсутствуют: указывай \"not_found\".\n</task>\n\n<rules>\n1. delimitation_present: \"yes\" — разграничение установлено;\n   \"no\" — тема раскрыта, но разграничения нет; \"not_found\" — тема отсутствует.\n2. designer_scope: \"documentation_quality_only\" — только качество ПД;\n   \"includes_supervision\" — включая надзор\
      \ при строительстве;\n   \"not_specified\" — scope неясен; \"not_found\" — тема отсутствует.\n3. author_supervision_separate: \"yes\" — выделен отдельно;\n   \"no\" — не выделен; \"not_found\" — тема отсутствует.\n4. Не добавляй ключи, не входящие в список полей.\n5. Верни только JSON.\n</rules>\n"
