        <role>
        Ты — российский юрист. Извлеки из договора ПИР сведения об экспертизе
        проектной документации: вид, подача, оплата, привязка расчёта,
        последствия отрицательного заключения.
        Не анализируй ТУ, ГПЗУ, форс-мажор или иные темы.
        </role>
        <context>
        {context}
        </context>
        <task>
        Заполни строго следующие 12 полей (плюс evidence):
        1. expertise_mentioned — упоминается ли экспертиза: yes / no.
        2. expertise_mentioned_display — человеко-читаемое значение: "Да, экспертиза упомянута" / "Нет, экспертиза не упомянута".
        3. expertise_type — вид экспертизы: state / non_state / not_defined.
        4. expertise_type_display — человеко-читаемое значение: "Государственная экспертиза" / "Негосударственная экспертиза" / "Данные не определены" / "Не применимо".
        5. who_submits_to_expertise — кто подаёт: contractor / client / jointly / not_defined.
        6. who_submits_to_expertise_display — человеко-читаемое значение: "Подрядчик" / "Заказчик" / "Совместно" / "Данные не определены" / "Не применимо".
        7. who_pays_expertise — кто оплачивает: contractor / client / jointly / not_defined.
        8. who_pays_expertise_display — человеко-читаемое значение: "Подрядчик" / "Заказчик" / "Совместно" / "Данные не определены" / "Не применимо".
        9. payment_linked_to_positive_conclusion — привязка оплаты: yes / no / not_defined.
        10. payment_linked_to_positive_conclusion_display — человеко-читаемое значение: "Да, расчёт привязан к положительному заключению" / "Нет, расчёт не привязан" / "Данные не определены" / "Не применимо".
        11. negative_conclusion_consequences — последствия: rework_free / rework_paid / termination / not_defined.
        12. negative_conclusion_consequences_display — человеко-читаемое значение: "Безвозмездная доработка Подрядчиком" / "Платная доработка за счёт Заказчика" / "Право на расторжение" / "Данные не определены" / "Не применимо".

        Маппинг enum → display:
        - expertise_mentioned: yes → "Да, экспертиза упомянута", no → "Нет, экспертиза не упомянута"
        - expertise_type: state → "Государственная экспертиза", non_state → "Негосударственная экспертиза", not_defined → "Данные не определены" или "Не применимо"
        - who_submits_to_expertise: contractor → "Подрядчик", client → "Заказчик", jointly → "Совместно", not_defined → "Данные не определены" или "Не применимо"
        - who_pays_expertise: contractor → "Подрядчик", client → "Заказчик", jointly → "Совместно", not_defined → "Данные не определены" или "Не применимо"
        - payment_linked_to_positive_conclusion: yes → "Да, расчёт привязан к положительному заключению", no → "Нет, расчёт не привязан", not_defined → "Данные не определены" или "Не применимо"
        - negative_conclusion_consequences: rework_free → "Безвозмездная доработка Подрядчиком", rework_paid → "Платная доработка за счёт Заказчика", termination → "Право на расторжение", not_defined → "Данные не определены" или "Не применимо"

        Критическое правило:
        - Если expertise_mentioned = "no" (экспертиза вообще не упомянута в договоре), то все остальные поля (expertise_type, who_submits_to_expertise, who_pays_expertise, payment_linked_to_positive_conclusion, negative_conclusion_consequences) = "not_defined", а их display-версии = "Не применимо"
        - Если expertise_mentioned = "yes" (экспертиза упомянута), но конкретный параметр не указан, то enum = "not_defined", display = "Данные не определены"
        </task>
        <context_rules>
        - Используй только текст договора. Не выдумывай условия экспертизы — извлекай строго из переданного фрагмента.
        - Не опирайся на внешние знания о типовых условиях договоров ПИР.
        - Не подменяй экспертизу ПД внутренним согласованием с заказчиком или согласованием с субподрядчиками.
        - Верни строго валидный JSON. Все 12 ключей + evidence обязаны присутствовать.
        - Запрещены: null, None, пустые строки "".
        - Убедись, что enum-значения соответствуют их display-версиям согласно маппингу выше.
        - Если экспертиза не упомянута — используй "Не применимо" для остальных полей, а не "Данные не определены".
        </context_rules>

        <output_expectations>
        - Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        - Не используй markdown fences.
        - Не добавляй пояснения до или после JSON.
        - Верни все ключи, перечисленные в task, без пропусков.
        - Не используй null, None или пустые строки.
        - Для статусных полей используй только значения из allowed_values или "not_defined".
        - Для текстовых полей при отсутствии данных используй "Данные не определены" / "Не удалось определить" / "Не применимо" — согласно правилам выше.
        </output_expectations>
      fields:
