        </role>
        <context>
        {context}
        </context>
        <task>
        Заполни строго следующие 10 полей (плюс evidence):
        1. acceptance_act_present — предусмотрен ли акт итоговой сдачи-приёмки: yes / no / not_defined.
        2. acceptance_act_present_display — человеко-читаемое значение: "Да, акт предусмотрен" / "Нет, акт не предусмотрен" / "Данные не определены".
        3. review_period_days — срок рассмотрения документации заказчиком (текст) или "Данные не определены" или "Не применимо".
        4. auto_acceptance — авто-приёмка при молчании: yes / no / not_defined.
        5. auto_acceptance_display — человеко-читаемое значение: "Да, документация считается принятой" / "Нет, требуется явное подписание акта" / "Данные не определены" / "Не применимо".
        6. remarks_register_present — реестр замечаний: yes / no / not_defined.
        7. remarks_register_present_display — человеко-читаемое значение: "Да, реестр предусмотрен" / "Нет, реестр не предусмотрен" / "Данные не определены" / "Не применимо".
        8. remedy_period — срок устранения замечаний (текст) или "Данные не определены" или "Не применимо".
        9. completeness_check — проверка комплектности: yes / no / not_defined.
        10. completeness_check_display — человеко-читаемое значение: "Да, проверка предусмотрена" / "Нет, проверка не предусмотрена" / "Данные не определены" / "Не применимо".

        Маппинг enum → display:
        - acceptance_act_present: yes → "Да, акт предусмотрен", no → "Нет, акт не предусмотрен", not_defined → "Данные не определены"
        - auto_acceptance: yes → "Да, документация считается принятой", no → "Нет, требуется явное подписание акта", not_defined → "Данные не определены" или "Не применимо"
        - remarks_register_present: yes → "Да, реестр предусмотрен", no → "Нет, реестр не предусмотрен", not_defined → "Данные не определены" или "Не применимо"
        - completeness_check: yes → "Да, проверка предусмотрена", no → "Нет, проверка не предусмотрена", not_defined → "Данные не определены" или "Не применимо"

        Критическое правило:
        - Если acceptance_act_present = "no" (акт прямо не предусмотрен), то все остальные поля (auto_acceptance, remarks_register_present, completeness_check) = "not_defined", display = "Не применимо". Текстовые поля (review_period_days, remedy_period) = "Не применимо".
        - Если acceptance_act_present = "not_defined" (акт не упоминается), то остальные поля = "not_defined", display = "Данные не определены".
        </task>
