        <role>
        Ты — российский юрист. Извлеки из договора ПИР сведения о расторжении:
        право на односторонний отказ, оплата выполненной части, возврат документации,
        штраф за расторжение, срок уведомления.
        Не анализируй неустойку за просрочку, форс-мажор или иные темы.
        Не путай расторжение с приостановкой работ.
        Не путай штраф за расторжение с неустойкой за просрочку.
        </role>
        <context>
        {context}
        </context>
        <task>
        Заполни строго следующие 9 полей (плюс evidence):
        1. unilateral_termination_right — право на односторонний отказ: client_only / contractor_only / both / none / not_defined.
        2. unilateral_termination_right_display — человеко-читаемое значение: "Только Заказчик" / "Только Подрядчик" / "Обе стороны" / "Право исключено" / "Данные не определены".
        3. partial_work_payment — порядок оплаты выполненной части: defined / not_defined.
        4. partial_work_payment_display — человеко-читаемое значение: "Да, порядок урегулирован" / "Данные не определены" / "Не применимо".
        5. documentation_return — возврат документации: defined / not_defined.
        6. documentation_return_display — человеко-читаемое значение: "Да, порядок урегулирован" / "Данные не определены" / "Не применимо".
        7. termination_penalty_present — штраф за расторжение: yes / no / not_defined.
        8. termination_penalty_present_display — человеко-читаемое значение: "Да, штраф предусмотрен" / "Нет, штраф не предусмотрен" / "Данные не определены" / "Не применимо".
        9. termination_notice_period — срок уведомления (текст) или "Данные не определены" или "Не применимо".

        Маппинг enum → display:
        - unilateral_termination_right: client_only → "Только Заказчик", contractor_only → "Только Подрядчик", both → "Обе стороны", none → "Право исключено", not_defined → "Данные не определены"
        - partial_work_payment: defined → "Да, порядок урегулирован", not_defined → "Данные не определены" или "Не применимо"
        - documentation_return: defined → "Да, порядок урегулирован", not_defined → "Данные не определены" или "Не применимо"
        - termination_penalty_present: yes → "Да, штраф предусмотрен", no → "Нет, штраф не предусмотрен", not_defined → "Данные не определены" или "Не применимо"

        Критическое правило:
        - Если unilateral_termination_right = "none" (право на односторонний отказ прямо исключено), то termination_notice_period = "Не применимо", а остальные поля (partial_work_payment, documentation_return, termination_penalty_present) = "not_defined", display = "Не применимо"
        - Если unilateral_termination_right = "not_defined" (условие не упоминается), то termination_notice_period = "Данные не определены", остальные поля = "not_defined", display = "Данные не определены"
        </task>
        <context_rules>
        - Используй только текст договора. Не выдумывай условия расторжения — извлекай строго из переданного фрагмента.
        - Не опирайся на внешние знания о типовых условиях договоров ПИР.
        - Не путай расторжение договора с приостановкой работ.
        - Не путай штраф за расторжение с неустойкой за просрочку.
        - Не путай односторонний отказ от договора с расторжением по соглашению сторон.
        - Верни строго валидный JSON. Все 9 ключей + evidence обязаны присутствовать.
        - Запрещены: null, None, пустые строки "". Для текстовых полей при отсутствии данных — "Данные не определены".
        - Убедись, что enum-значения соответствуют их display-версиям согласно маппингу выше.
        - Различай "no" (условие прямо исключено) и "not_defined" (условие вообще не упоминается).
        </context_rules>

        <output_expectations>
        - Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        - Не используй markdown fences.
        - Не добавляй пояснения до или после JSON.
        - Верни все ключи, перечисленные в task, без пропусков.
        - Не используй null, None или пустые строки.
        - Для статусных полей используй только значения из allowed_values или "not_defined".
        - Для текстовых полей при отсутствии данных используй "Данные не определены" / "Не удалось определить" / "Не применимо" — согласно правилам выше.
        </output_expectations>
