- id: initial_data_provision_check
  name: 'Исходные данные: перечень, сроки, последствия задержки (ст. 759 ГК РФ)'
  description: 'Проверяет наличие перечня исходных данных, сроков их предоставления заказчиком

    и последствий задержки. Если данные окажутся неполными или недостоверными,

    проект будет ошибочен, а спор о том, кто платит за переделку — неизбежен.

    '
  triggers: null
  ui_mode: field_extraction
  severity: high
  severity_if_pass: pass
  severity_if_fail: high
  severity_if_unclear: high
  origin: DOCUMENT_TYPE
  detector_type: hybrid
  rules:
    keywords:
    - исходные данные
    - исходно-разрешительная документация
    - ГПЗУ
    - технические условия
    - ТУ на подключение
    - материалы изысканий
    - перечень исходных данных
    - сроки предоставления
    keyword_mode: any
    regex_patterns:
    - (?i)исходн(ые|ых)\s+данн
    - (?i)ГПЗУ|градостроительн.*план
    - (?i)техническ(ие|их)\s+услови
  llm:
    prompt_template: "[КОНТЕКСТ]\nТы — юрист, анализирующий договор ПИР.\nПроверяется только один вопрос: какие исходные данные обязан предоставить заказчик,\nопределены ли сроки такого предоставления и как договор распределяет последствия\nзадержки или недостоверности исходных данных.\n\nВажно:\n— Анализируй только положения об исходных данных, документах заказчика\n  и последствиях их непредоставления или недостоверности.\n— Не оценивай риск и не делай выводов за пределами текста.\n— Если последствие или срок прямо не указаны, не домысливай их.\n\n[ЗАДАЧА]\n1. Установить, есть ли перечень исходных данных.\n2. Установить, определены ли сроки предоставления исходных данных.\n3. Установить договорное последствие задержки предоставления данных.\n4. Установить, есть ли оговорка об ответственности заказчика\n   за достоверность исходных данных.\n\n[ПРАВИЛА]\n1. initial_data_list_present = \"yes\" — если в договоре есть перечень\n   исходных данных или перечислены конкретные документы/материалы;\n\
      \   \"no\" — если есть только общее упоминание без перечня;\n   \"not_found\" — если тема не раскрыта.\n2. initial_data_deadlines = \"specified\" — если установлен срок, период,\n   событие или крайняя дата предоставления; \"not_specified\" — если исходные данные\n   упомянуты, но срок не установлен; \"not_found\" — если тема не раскрыта.\n3. delay_consequences = \"deadline_extension\" — если срок выполнения работ продлевается;\n   \"rework_at_client_cost\" — если переделка/допработы оплачиваются заказчиком;\n   \"termination_right\" — если есть право приостановить работы, отказаться\n   от договора или расторгнуть его; \"not_specified\" — если задержка упомянута\n   без ясного последствия; \"not_found\" — если тема не раскрыта.\n4. data_accuracy_disclaimer = \"yes\" — если заказчик прямо отвечает\n   за полноту/достоверность исходных данных или подрядчик освобождается\n   от ответственности за их недостоверность.\n5. data_accuracy_disclaimer = \"no\" — если тема исходных данных раскрыта,\n\
      \   но такой оговорки нет.\n6. data_accuracy_disclaimer = \"not_found\" — если тема исходных данных\n   вообще не раскрыта.\n7. Не смешивай последствия задержки исходных данных с общими положениями\n   о просрочке исполнения договора.\n\n[ПРИМЕРЫ (FEW-SHOT)]\nПример 1 — перечень и сроки определены:\nТекст: «Заказчик передаёт Подрядчику исходные данные, включая ГПЗУ,\nтехнические условия на подключение и результаты инженерных изысканий,\nв течение 5 рабочих дней с даты подписания договора. В случае нарушения\nуказанного срока срок выполнения работ соразмерно продлевается.\nЗаказчик несёт ответственность за полноту и достоверность переданных данных.»\n\nОтвет:\n{\n  \"initial_data_list_present\": \"yes\",\n  \"initial_data_deadlines\": \"specified\",\n  \"delay_consequences\": \"deadline_extension\",\n  \"data_accuracy_disclaimer\": \"yes\",\n  \"evidence\": [\n    \"Заказчик передаёт Подрядчику исходные данные, включая ГПЗУ, технические условия на подключение и результаты инженерных\
      \ изысканий, в течение 5 рабочих дней с даты подписания договора.\",\n    \"В случае нарушения указанного срока срок выполнения работ соразмерно продлевается.\",\n    \"Заказчик несёт ответственность за полноту и достоверность переданных данных.\"\n  ]\n}\n\nПример 2 — исходные данные только упомянуты:\nТекст: «Заказчик предоставляет исходные данные, необходимые для выполнения работ.»\n\nОтвет:\n{\n  \"initial_data_list_present\": \"no\",\n  \"initial_data_deadlines\": \"not_specified\",\n  \"delay_consequences\": \"not_specified\",\n  \"data_accuracy_disclaimer\": \"no\",\n  \"evidence\": [\n    \"Заказчик предоставляет исходные данные, необходимые для выполнения работ.\"\n  ]\n}\n\n[ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]\n1. Есть ли в тексте именно перечень документов, а не общее упоминание исходных данных?\n2. Указан ли срок предоставления в днях, датой или через событие?\n3. Есть ли прямое последствие задержки, а не общее правило о просрочке?\n4. Есть ли явная оговорка о достоверности\
      \ данных?\n5. Все ли значения enum соответствуют schema?\n\n[ФОРМАТ ОТВЕТА]\nВерни строго JSON:\n{\n  \"initial_data_list_present\": \"<yes / no / not_found>\",\n  \"initial_data_deadlines\": \"<specified / not_specified / not_found>\",\n  \"delay_consequences\": \"<deadline_extension / rework_at_client_cost / termination_right / not_specified / not_found>\",\n  \"data_accuracy_disclaimer\": \"<yes / no / not_found>\",\n  \"evidence\": [\"<цитата 1>\", \"<цитата 2>\"]\n}\n"
    prompt_file: null
    context_k: 5
    temperature: 0.0
    max_tokens: 500
  retrieval:
    retrieval_profile: technical_documentation_check
    corpus_scope: document
    context_k: 5
    max_chunks: 8
    boost_keywords:
    - исходные данные
    - ГПЗУ
    - технические условия
    - сроки предоставления
    - задержка
    - достоверность
    negative_keywords:
    - форс-мажор
    - подсудность
    - неустойка
    - экспертиза
    rerank: true
    filters: {}
  enrichment_hints:
    preferred_segment_types:
