  - id: design_coordination_and_clashes
    name: "Координация проектных решений и смежных разделов"
    description: >
      Фактографическая проверка условий координации проектных решений и смежных
      разделов в договоре на выполнение проектных и изыскательских работ (ПИР).
      При дроблении проектирования (генеральный проектировщик + субподрядчики по
      специальным разделам) возникает риск коллизий (несостыковок) между разделами.
      Проверка выявляет четыре критических аспекта: (1) назначение ответственного
      за сводку разделов проектной документации — как правило, это генеральный
      проектировщик; (2) ответственность за коллизии между разделами, выполненными
      разными исполнителями — кто устраняет несоответствия и за чей счёт; (3) порядок
      взаимодействия между исполнителями смежных разделов — совещания, обмен данными,
      сроки согласования; (4) применение BIM-технологий и проверка коллизий в
      информационной модели (clash detection) — современный стандарт для сложных
      объектов. Отсутствие или неполнота регулирования координации создаёт риски
      срыва сроков из-за необходимости переделки несогласованных разделов, споров
      об ответственности за коллизии и невозможности прохождения экспертизы
      проектной документации.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "medium"
    severity_if_pass: "pass"
    severity_if_fail: "medium"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "координация разделов"
        - "сводка разделов"
        - "генеральный проектировщик"
        - "коллизии"
        - "BIM"
        - "информационная модель"
        - "clash detection"
        - "взаимодействие исполнителей"
        - "смежные разделы"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)координац(ия|и)\\s+раздел"
        - "(?i)сводк(а|и)\\s+раздел"
        - "(?i)BIM|информац(ионн|ионная)\\s+модел"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор на выполнение проектных и изыскательских работ (ПИР).
        Проверяется только один вопрос: координация проектных решений и смежных разделов.
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не выдумывай условия — извлекай строго из переданного фрагмента.
        - Не путай координацию разделов с субподрядом (Check 14).
        - Не путай координацию разделов с разграничением ответственности проектировщика и строителя (Check 17).

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Назначение ответственного за сводку разделов.
        2. Ответственность за коллизии между разделами.
        3. Порядок взаимодействия между исполнителями смежных разделов.
        4. Применение BIM-технологий и проверки коллизий.

        [ПРАВИЛА]
        1. Используй только текст документа. Не выдумывай условия — извлекай строго из переданного фрагмента.
        2. Для enum-полей при отсутствии данных используй значение "not_defined".
        3. Для текстовых полей при отсутствии данных пиши "Данные не определены".
        4. Для полей *_display используй человеко-читаемые значения согласно маппингу.
        5. Критическое правило:
           - Если coordination_responsible = "not_defined" (ответственный не назначен), то все остальные поля = "not_defined", display = "Данные не определены".
        6. Не путай:
           - Координацию разделов (этот check) с субподрядом (Check 14)
           - Координацию разделов с разграничением ответственности проектировщика и строителя (Check 17)
        7. В evidence — только точные цитаты из документа с указанием пункта.
        8. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.без комментариев и markdown-обёртки.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — полный набор условий:
