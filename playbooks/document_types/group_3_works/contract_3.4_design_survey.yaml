  - id: documentation_delivery_format
    name: "Формат и количество экземпляров передаваемой документации"
    description: >
      Фактографическая проверка условий передачи проектной и изыскательской документации
      заказчику в договоре на выполнение проектных и изыскательских работ (ПИР) в соответствии
      с Постановлением Правительства РФ от 16.02.2008 № 87 «О составе разделов проектной
      документации и требованиях к их содержанию». Формат передачи документации — критически
      важный аспект для ПИР, т.к. от него зависит возможность прохождения экспертизы
      проектной документации, ввода объекта в эксплуатацию, архивирования документации
      и её последующего использования. Проверка выявляет пять аспектов: (1) передача
      на бумажном носителе — типично для ПИР, т.к. бумажные экземпляры с подписями
      и печатями требуются для прохождения экспертизы и архивирования; (2) количество
      бумажных экземпляров — типично 3–5 экземпляров в зависимости от требований заказчика
      и необходимости передачи в архив; (3) передача в электронном виде — обязательна
      для современных проектов, особенно с учётом требований о передаче документации
      в электронном виде через систему «Главгосэкспертиза» или региональные системы;
      (4) форматы электронных файлов — DWG (AutoCAD), PDF, IFC (BIM-моделирование),
      RVT (Revit), XLS (сметы) — стандартные форматы для ПИР; (5) передача на физическом
      носителе — CD/DVD/flash-накопитель — типичный способ передачи электронных файлов
      заказчику. Отсутствие или неполнота регулирования формата передачи создаёт риски
      споров о комплектности переданной документации, невозможности прохождения экспертизы
      и проблем с архивированием.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "экземпляр"
        - "комплект документации"
        - "бумажный носитель"
        - "электронный вид"
        - "формат DWG"
        - "формат PDF"
        - "формат IFC"
        - "электронная версия"
        - "количество копий"
        - "CD"
        - "DVD"
        - "flash-накопитель"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)\\d+\\s*(экземпляр|комплект)"
        - "(?i)(бумажн|электронн)(ый|ом|ой)\\s+(носител|вид|версии|формат)"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор на выполнение проектных и изыскательских работ (ПИР)
        (§ 4 Главы 37 ГК РФ; ПП РФ № 87).
        Проверяется только один вопрос: формат и количество экземпляров
        передаваемой документации.
        Нормативный ориентир:
        - ПП РФ № 87 «О составе разделов проектной документации»
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не выдумывай количество экземпляров, форматы или носители — извлекай строго из переданного фрагмента.
        - Не путай формат передачи документации с порядком приёмки (это разные институты).

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Передача на бумажном носителе.
        2. Количество бумажных экземпляров.
        3. Передача в электронном виде.
        4. Формат электронных файлов (DWG, PDF, IFC и т.п.).
        5. Передача на физическом носителе (CD/DVD/flash).

        [ПРАВИЛА]
        1. Используй только текст документа. Не выдумывай количество экземпляров, форматы или носители — извлекай строго из переданного фрагмента.
        2. Для enum-полей при отсутствии данных используй значение "not_defined".
        3. Для текстовых полей при отсутствии данных пиши "Данные не определены".
        4. Для полей *_display используй человеко-читаемые значения согласно маппингу.
        5. Различай:
           - "yes" — условие прямо указано в договоре
           - "no" — условие прямо исключено
           - "not_defined" — условие вообще не упоминается в договоре
        6. Критические правила:
           - Если paper_delivery = "no" (бумажная передача прямо исключена), то paper_copies_count = "Не применимо"
           - Если electronic_delivery = "no" (электронная передача прямо исключена), то electronic_format = "Не применимо"
           - Если paper_delivery = "not_defined" (условие не упоминается), то paper_copies_count = "Данные не определены"
           - Если electronic_delivery = "not_defined" (условие не упоминается), то electronic_format = "Данные не определены"
        7. Не путай:
           - Формат передачи документации (этот check) с порядком приёмки (Check 11, Check 12)
           - Бумажные экземпляры с электронными файлами — это разные форматы передачи
           - Физический носитель (CD/DVD/flash) с электронной передачей (это разные способы)
        8. В evidence — только точные цитаты из документа с указанием пункта.
        9. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.без комментариев и markdown-обёртки.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — полный набор условий:
        Фрагмент:
        "Документация передаётся в 4 экземплярах на бумажном носителе
        и в электронном виде на flash-накопителе в форматах DWG и PDF."
        Ответ:
        {
          "paper_delivery": "yes",
          "paper_delivery_display": "Да, предусмотрена",
          "paper_copies_count": "4",
          "electronic_delivery": "yes",
          "electronic_delivery_display": "Да, предусмотрена",
          "electronic_format": "DWG, PDF",
          "physical_media": "yes",
          "physical_media_display": "Да, предусмотрена (flash-накопитель)",
          "evidence": [
            {
              "clause_ref": "п. 17.1",
              "quote": "Документация передаётся в 4 экземплярах на бумажном носителе и в электронном виде на flash-накопителе в форматах DWG и PDF."
            }
          ]
        }

        Пример 2 — только электронная передача, без физического носителя:
        Фрагмент:
        "Документация передаётся Заказчику в электронном виде по электронной
        почте в формате PDF. Бумажные экземпляры не передаются."
        Ответ:
        {
          "paper_delivery": "no",
          "paper_delivery_display": "Нет, не предусмотрена",
          "paper_copies_count": "Не применимо",
          "electronic_delivery": "yes",
          "electronic_delivery_display": "Да, предусмотрена",
          "electronic_format": "PDF",
          "physical_media": "no",
          "physical_media_display": "Нет, не предусмотрена",
          "evidence": [
            {
              "clause_ref": "п. 17.1",
              "quote": "Документация передаётся Заказчику в электронном виде по электронной почте в формате PDF."
            },
            {
              "clause_ref": "п. 17.2",
              "quote": "Бумажные экземпляры не передаются."
            }
          ]
        }

        Пример 3 — только бумажная передача:
        Фрагмент:
        "Подрядчик передаёт Заказчику 3 экземпляра проектной документации
        на бумажном носителе с подписями и печатями."
        Ответ:
        {
          "paper_delivery": "yes",
          "paper_delivery_display": "Да, предусмотрена",
