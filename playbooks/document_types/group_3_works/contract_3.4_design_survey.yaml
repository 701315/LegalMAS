    confidence_bonus_on_match: 0.1
    confidence_penalty_on_excluded_segment: 0.12
  evidence:
    required: true
    min_snippet_length: 40
    max_snippet_length: 650
  extraction:
    enabled: true
    mode: hybrid
    store_payload: true
    llm_max_tokens: 700
    compact_output: false
    llm_prompt_extraction: "<role>\nТы — юрист, извлекающий сведения о продлении сроков при задержке заказчика\nв договоре ПИР. Не оценивай риски. Только заполняй поля строго по тексту.\n</role>\n\n<context>\n{context}\n</context>\n\n<task>\nЗаполни строго следующие поля:\n\nauto_extension_present — предусмотрено ли продление сроков\n  при задержке заказчика\n  (allowed: yes / no / not_found).\n\nextension_trigger — триггер продления\n  (allowed: approval_delay / review_delay / mixed / not_specified / not_found).\n\nextension_mode — механизм продления\n  (allowed: automatic / notice_based / by_addendum / not_specified / not_found).\n\nextension_duration_rule — правило расчёта продления\n  (allowed: equal_delay / fixed_days / not_specified / not_found).\n\nsuspension_right — вправе ли подрядчик приостановить работы\n  (allowed: yes / no / not_found).\n\nЕсли данные отсутствуют: указывай \"not_found\"; если тема раскрыта,\nно условие прямо не установлено, используй \"no\" или \"not_specified\"\
      \nпо смыслу поля.\n</task>\n\n<rules>\n1. auto_extension_present: \"yes\" — продление прямо предусмотрено;\n   \"no\" — тема есть, но продление отсутствует; \"not_found\" — тема отсутствует.\n2. extension_trigger: \"approval_delay\" — задержка согласования;\n   \"review_delay\" — задержка рассмотрения/замечаний; \"mixed\" — несколько триггеров;\n   \"not_specified\" — триггер неясен; \"not_found\" — тема отсутствует.\n3. extension_mode: \"automatic\" — продлевается автоматически;\n   \"notice_based\" — после уведомления; \"by_addendum\" — по допсоглашению;\n   \"not_specified\" — механизм неясен; \"not_found\" — тема отсутствует.\n4. extension_duration_rule: \"equal_delay\" — на срок задержки;\n   \"fixed_days\" — фиксированное количество дней; \"not_specified\" — правило неясно;\n   \"not_found\" — тема отсутствует.\n5. suspension_right: \"yes\" — право приостановить работы есть;\n   \"no\" — тема раскрыта, но такого права нет; \"not_found\" — тема отсутствует.\n6. Не добавляй ключи,\
      \ не входящие в список полей.\n7. Верни только JSON.\n</rules>\n"
    fields:
    - name: auto_extension_present
      type: string
      label: Продление сроков при задержке заказчика
      presentation: badge
      display_in_grid: true
      display_priority: 1
      allowed_values:
