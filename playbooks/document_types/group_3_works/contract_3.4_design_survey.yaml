          display_priority: 6

  - id: acceptance_procedure
    name: "Порядок сдачи-приёмки результатов работ (ст. 720, 760 ГК РФ)"
    description: >
      Фактографическая проверка процедуры итоговой сдачи-приёмки результатов работ
      по договору на выполнение проектных и изыскательских работ (ПИР) в соответствии
      со ст. 720 и ст. 760 ГК РФ. Итоговая сдача-приёмка — это передача заказчику всей
      проектной документации (стадия «П», стадия «Р») и/или отчётов по инженерным
      изысканиям с подписанием итогового акта сдачи-приёмки. Проверка выявляет шесть
      критических аспектов: (1) предусмотрен ли акт сдачи-приёмки результатов работ —
      без акта невозможно подтвердить факт выполнения обязательств подрядчика и момент
      перехода риска; (2) срок рассмотрения документации заказчиком при итоговой приёмке
      (типично 10–20 рабочих дней) — без срока заказчик может неограниченно затягивать
      приёмку; (3) авто-приёмка при молчании заказчика — критически важный механизм
      защиты подрядчика («если замечания не направлены в установленный срок, документация
      считается принятой»); (4) наличие реестра или перечня замечаний — стандартный
      механизм документирования недостатков проектной документации, позволяющий избежать
      споров о содержании замечаний; (5) срок устранения замечаний подрядчиком — без
      срока заказчик не имеет инструмента принуждения к исправлению недостатков; (6)
      проверка комплектности передаваемой документации — для ПИР это особенно важно,
      т.к. документация состоит из множества разделов (АР, КР, ОВиК, ЭО и др.), и
      неполный комплект может сделать невозможным прохождение экспертизы или получение
      разрешения на строительство. Важно: данный check проверяет именно итоговую
      сдачу-приёмку, а не поэтапное согласование промежуточных результатов (см. Check 11).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "акт сдачи-приёмки"
        - "приёмка результатов"
        - "комплектность документации"
        - "передача документации"
        - "подписание акта"
        - "мотивированный отказ от приёмки"
        - "реестр замечаний"
        - "устранение замечаний"
        - "срок устранения"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)акт\\s+(сдачи|приёмки|приемки)"
        - "(?i)передач(а|и)\\s+документац"
        - "(?i)замечан(ия|ий).*устранен"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор на выполнение проектных и изыскательских работ (ПИР)
        (§ 4 Главы 37 ГК РФ, ст. 720, 760).
        Проверяется только один вопрос: порядок ИТОГОВОЙ сдачи-приёмки результатов.
        Нормативный ориентир:
        - ст. 720 ГК РФ (сдача результата подрядных работ)
        - ст. 760 ГК РФ (сдача-приёмка результатов ПИР)
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не выдумывай сроки, условия или процедуры — извлекай строго из переданного фрагмента.
        - Проверяется именно ИТОГОВАЯ приёмка, а не поэтапное согласование промежуточных результатов.
        - Если текст описывает согласование этапа (стадия П, стадия Р) — это не итоговая приёмка.

        [ЗАДАЧА]
        Найди в тексте договора сведения об ИТОГОВОЙ сдаче-приёмке:
        1. Предусмотрен ли акт сдачи-приёмки.
        2. Срок рассмотрения документации заказчиком.
        3. Авто-приёмка при молчании.
        4. Реестр/перечень замечаний.
        5. Срок устранения замечаний.
        6. Проверка комплектности документации.

        [ПРАВИЛА]
        1. Используй только текст документа. Не выдумывай сроки, условия или процедуры — извлекай строго из переданного фрагмента.
        2. Для enum-полей (acceptance_act_present, auto_acceptance, remarks_register_present, completeness_check) при отсутствии данных используй значение "not_defined".
        3. Для текстовых полей (review_period_days, remedy_period) при отсутствии данных пиши "Данные не определены".
        4. Для полей *_display используй человеко-читаемые значения согласно маппингу.
        5. Различай:
           - "yes" — условие прямо указано в договоре
           - "no" — условие прямо исключено
           - "not_defined" — условие вообще не упоминается в договоре
        6. Критическое правило:
           - Если acceptance_act_present = "no" (акт прямо не предусмотрен), то все остальные поля (auto_acceptance, remarks_register_present, completeness_check) = "not_defined", display = "Не применимо". Текстовые поля (review_period_days, remedy_period) = "Не применимо".
           - Если acceptance_act_present = "not_defined" (акт не упоминается), то остальные поля = "not_defined", display = "Данные не определены".
        7. Не путай:
           - Итоговую сдачу-приёмку (этот check) с поэтапным согласованием промежуточных результатов (Check 11)
           - Итоговый акт с промежуточным актом по этапу
           - Срок рассмотрения итоговой документации со сроком рассмотрения промежуточного результата
        8. Если срок рассмотрения или устранения определяется по приложению/графику (например, "Срок рассмотрения — согласно Приложению № 5") — это валидный исход, укажи ссылку.
        9. В evidence — только точные цитаты из документа с указанием пункта.
        10. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.без комментариев и markdown-обёртки.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — полный набор условий итоговой приёмки:
