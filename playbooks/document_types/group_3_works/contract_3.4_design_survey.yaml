  - id: pir_subject_extraction
    name: "Предмет договора ПИР: вид работ, объект, стадия, ТЗ"
    description: >
      Фактографическая проверка предмета договора ПИР: вид работ
      (проектные / изыскательские / комплексные), наименование и местоположение
      объекта, стадия проектирования, ссылка на техническое задание,
      перечень разделов проектной документации.
