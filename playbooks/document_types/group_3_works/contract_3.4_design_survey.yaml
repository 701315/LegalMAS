    llm_max_tokens: 700

    compact_output: false

    llm_prompt_extraction: |
      <role>
      Ты — юрист, извлекающий сведения о формате передачи документации
      в договоре ПИР. Не оценивай риски. Только заполняй поля строго по тексту.
      </role>

      <context>
      {context}
      </context>

      <task>
      Заполни строго следующие поля:

      paper_delivery — предусмотрена ли передача на бумаге
        (allowed: yes / no / not_found).

      paper_copies_count — количество бумажных экземпляров
        (число или null).

      electronic_delivery — предусмотрена ли электронная передача
        (allowed: yes / no / not_found).

      electronic_format — форматы электронных файлов
        (текстовое значение или not_found).

      physical_media — передача на физическом носителе (CD/DVD/flash)
        (allowed: yes / no / not_found).

      Если данные отсутствуют: указывай "not_found" или null.
      </task>

      <rules>
      1. paper_delivery: "yes" — бумажная передача есть; "no" — нет;
         "not_found" — тема отсутствует.
      2. paper_copies_count: число; или null.
      3. electronic_delivery: "yes" — электронная передача есть;
         "no" — нет; "not_found" — тема отсутствует.
      4. electronic_format: текст, например "DWG, PDF, IFC"; или "not_found".
      5. physical_media: "yes" — CD/DVD/flash предусмотрен;
         "no" — нет; "not_found" — тема отсутствует.
      6. Не добавляй ключи, не входящие в список полей.
      7. Верни только JSON.
      </rules>
