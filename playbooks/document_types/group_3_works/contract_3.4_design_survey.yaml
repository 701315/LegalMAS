        }
      context_k: 6
      temperature: 0.0
      max_tokens: 600
    retrieval:
      retrieval_profile: "scope_of_work_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "дополнительные работы дополнительное соглашение изменение объема техническое задание согласование цены срок приостановить выполнение фактически выполненные"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
