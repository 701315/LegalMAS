    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор на выполнение проектных и изыскательских работ (ПИР)
        (§ 4 Главы 37 ГК РФ, ст. 708, 760).
        Проверяется только один вопрос: сроки начала и окончания работ,
        календарный план и промежуточные этапы.
        Нормативный ориентир:
        - ст. 708 ГК РФ
        - ст. 760 ГК РФ
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Срок начала работ.
        2. Срок окончания работ.
        3. Наличие календарного плана или графика.
        4. Наличие промежуточных этапов.
        5. Характер определённости сроков.

        [ПРАВИЛА]
        1. Только текст документа.
        2. Если срок не указан — "not_defined".
        3. Не путай календарный план работ с графиком оплаты.
        4. В evidence — только текст договора.
        5. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1:
        Фрагмент:
        "Работы начинаются 01.03.2025 и должны быть завершены не позднее 30.06.2025.
        Календарный план выполнения работ приведён в Приложении № 2.
        Работы выполняются в 3 этапа."
        Ответ:
        {
          "start_deadline": "01.03.2025",
          "end_deadline": "не позднее 30.06.2025",
          "milestone_plan_present": "referenced",
          "intermediate_milestones_present": "yes",
          "deadline_determinacy": "specific_dates",
          "evidence": [
            {
              "clause_ref": "п. 4.1",
              "quote": "Работы начинаются 01.03.2025 и должны быть завершены не позднее 30.06.2025."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Подрядчик приступает к работам в течение 3 рабочих дней с даты получения исходных данных.
        Срок выполнения работ составляет 60 календарных дней."
        Ответ:
        {
          "start_deadline": "в течение 3 рабочих дней с даты получения исходных данных",
          "end_deadline": "60 календарных дней",
          "milestone_plan_present": "not_defined",
          "intermediate_milestones_present": "no",
          "deadline_determinacy": "event_based",
          "evidence": [
            {
              "clause_ref": "п. 4.1",
              "quote": "Подрядчик приступает к работам в течение 3 рабочих дней с даты получения исходных данных."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Извлечены ли именно сроки выполнения работ, а не сроки оплаты?
        2. Разграничены ли календарный план и график оплаты?
        3. Установлены ли промежуточные этапы отдельно от общего срока?
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "start_deadline": "<текст или 'Данные не определены'>",
          "end_deadline": "<текст или 'Данные не определены'>",
          "milestone_plan_present": "<yes / referenced / no / not_found>",
          "intermediate_milestones_present": "<yes / no / not_found>",
          "deadline_determinacy": "<specific_dates / event_based / mixed / vague / not_found>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 560
      retrieval:
        retrieval_profile: "completion_deadline_check"
        corpus_scope: "primary_segment"
        levels:
          - "legal_unit"
          - "section"
        required_kind: "legal_unit"
        retrieval_query: "срок выполнения календарный план график выполнения этап не позднее дата начала дата окончания"
        preferred_unit_types:
          - obligation
          - general_provision
        excluded_unit_types:
          - definition
          - structural_anchor
          - technical_fragment
        preferred_clause_functions:
          - procedures
          - obligations
        negative_keywords:
          - "оплата"
          - "аванс"
          - "претензия"
          - "неустойка"
          - "означает"
          - "в целях настоящего"
        position_bias:
          preferred_range: [0.10, 0.55]
          boost: 0.15
          scope: segment
        context_k: 6
        max_chunks: 8
        rerank: true
        enrichment_hints:
          preferred_segment_types:
            - "contract"
            - "amendment"
          excluded_segment_types:
            - "technical_specification"
            - "price_list"
          preferred_clause_functions:
            - "procedures"
            - "obligations"
          confidence_bonus_on_match: 0.10
          confidence_penalty_on_excluded_segment: 0.12
      evidence:
        required: true
        min_snippet_length: 30
        max_snippet_length: 650
      extraction:
        enabled: true
        mode: "hybrid"
        compact_output: false
        llm_max_tokens: 700
        llm_prompt_extraction: |
          <role>
          Ты — российский юрист. Извлеки из договора ПИР сведения о сроках
          выполнения работ и этапах. Не анализируй оплату, неустойку или иные темы.
          </role>
          <context>
          {context}
          </context>
          <task>
          Заполни строго следующие поля:
          1. start_deadline — срок начала работ.
          2. end_deadline — срок окончания работ.
          3. milestone_plan_present — наличие календарного плана (yes / referenced / no / not_found).
          4. intermediate_milestones_present — наличие промежуточных этапов (yes / no / not_found).
          5. deadline_determinacy — характер определённости сроков (specific_dates / event_based / mixed / vague / not_found).
          Если данные отсутствуют: "Данные не определены" или "not_defined".
          </task>
          <rules>
          - Используй только текст договора.
          - Извлекай сроки дословно.
          - Не путай календарный план работ с графиком оплаты.
          - Верни только JSON.
          </rules>
