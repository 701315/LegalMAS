# ──────────────────────────────────────────────────────────────────────────
# CHECK 21: Неустойка за просрочку выполнения работ
# ──────────────────────────────────────────────────────────────────────────
- id: penalty_for_delay
  name: "Неустойка за просрочку выполнения работ (ст. 330 ГК РФ)"
  description: "Проверяет наличие, размер и формулу неустойки за нарушение сроков обеими сторонами"
  legal_base: "ст. 330 ГК РФ"
  triggers: ~
  ui_mode: "field_extraction"
  severity: "high"
  origin: "DOCUMENT_TYPE"
  detector_type: "hybrid"
  rules:
    keywords:
      - "неустойка"
      - "пеня"
      - "штраф"
      - "за каждый день просрочки"
      - "процент за просрочку"
    keyword_mode: "any"
    regex_patterns:
      - "(?i)неустойк(а|и|у).*\\d"
      - "(?i)пен(я|и|ю).*\\d.*%"
      - "(?i)за\\s+каждый\\s+день\\s+просрочк"
  llm:
    prompt_template: |
      [КОНТЕКСТ]
      Ты — юрист, анализирующий договор ПИР.
      Проверяется только один вопрос: предусмотрена ли неустойка (пеня, штраф)
      за просрочку выполнения обязательств и как она рассчитывается.

      Важно:
      — Анализируй только положения о неустойке, пене и штрафах за просрочку.
      — Не оценивай риск и не смешивай неустойку с убытками или ответственностью за ошибки.
      — Если условие не установлено прямо, не домысливай.

      [ЗАДАЧА]
      1. Установить, предусмотрена ли неустойка для подрядчика.
      2. Извлечь размер/ставку неустойки для подрядчика.
      3. Определить базис расчёта неустойки.
      4. Установить, предусмотрена ли встречная неустойка для заказчика.
      5. Извлечь размер/ставку встречной неустойки.
      6. Установить, есть ли cap на неустойку.

      [ПРАВИЛА]
      1. contractor_penalty_present = "yes" — неустойка для подрядчика
         предусмотрена; "no" — тема раскрыта, но неустойки нет;
         "not_found" — тема отсутствует.
      2. contractor_penalty_rate — размер/ставка неустойки (текст):
         например, "0,1% от цены договора за каждый день просрочки";
         если не указан — "not_found".
      3. penalty_basis = "contract_price" — от цены договора;
         "stage_price" — от стоимости этапа;
         "overdue_amount" — от суммы просроченного обязательства;
         "fixed_amount" — фиксированная сумма;
         "not_specified" — базис неясен;
         "not_found" — тема отсутствует.
      4. client_penalty_present = "yes" — встречная неустойка для заказчика
         (за просрочку оплаты, согласования и т.п.) предусмотрена;
         "no" — тема раскрыта, но встречной неустойки нет;
         "not_found" — тема отсутствует.
      5. client_penalty_rate — размер/ставка встречной неустойки (текст);
         если нет — "not_found".
      6. penalty_cap_present = "yes" — установлено ограничение (cap)
         суммы неустойки; "no" — тема раскрыта, но cap нет;
         "not_found" — тема отсутствует.
      7. Не путай неустойку за просрочку с убытками, штрафом за расторжение
         или штрафом за нарушение конфиденциальности.

      [ПРИМЕРЫ (FEW-SHOT)]
      Пример 1 — неустойка для обеих сторон:
      Текст: «За нарушение сроков выполнения работ Подрядчик уплачивает
      неустойку в размере 0,1% от цены договора за каждый день просрочки,
      но не более 10% от цены договора. За просрочку оплаты Заказчик
      уплачивает пеню в размере 0,05% от суммы просроченного платежа
      за каждый день просрочки.»

      Ответ:
      {
        "contractor_penalty_present": "yes",
        "contractor_penalty_rate": "0,1% от цены договора за каждый день просрочки",
        "penalty_basis": "contract_price",
        "client_penalty_present": "yes",
        "client_penalty_rate": "0,05% от суммы просроченного платежа за каждый день просрочки",
        "penalty_cap_present": "yes",
        "evidence": [
          "За нарушение сроков выполнения работ Подрядчик уплачивает неустойку в размере 0,1% от цены договора за каждый день просрочки, но не более 10% от цены договора.",
          "За просрочку оплаты Заказчик уплачивает пеню в размере 0,05% от суммы просроченного платежа за каждый день просрочки."
        ]
      }

      Пример 2 — тема не раскрыта:
      Текст: «Стороны несут ответственность в соответствии с законодательством.»

      Ответ:
      {
        "contractor_penalty_present": "not_found",
        "contractor_penalty_rate": "not_found",
        "penalty_basis": "not_found",
        "client_penalty_present": "not_found",
        "client_penalty_rate": "not_found",
        "penalty_cap_present": "not_found",
        "evidence": [
          "Стороны несут ответственность в соответствии с законодательством."
        ]
      }

      [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
      1. Разграничены ли неустойка подрядчика и неустойка заказчика?
      2. Корректно ли определён базис расчёта?
      3. Есть ли cap на неустойку?
      4. Не перепутана ли неустойка за просрочку с иными штрафами?
      5. Все ли ключи JSON совпадают со schema?

      [ФОРМАТ ОТВЕТА]
      Верни строго JSON:
      {
        "contractor_penalty_present": "<yes / no / not_found>",
        "contractor_penalty_rate": "<текст или not_found>",
        "penalty_basis": "<contract_price / stage_price / overdue_amount / fixed_amount / not_specified / not_found>",
        "client_penalty_present": "<yes / no / not_found>",
        "client_penalty_rate": "<текст или not_found>",
        "penalty_cap_present": "<yes / no / not_found>",
        "evidence": ["<цитата 1>", "<цитата 2>"]
      }
    prompt_file: null
    context_k: 6
    temperature: 0.0
    max_tokens: 540
  retrieval:
    retrieval_profile: "liability_cap_check"
    corpus_scope: "document"
    context_k: 6
