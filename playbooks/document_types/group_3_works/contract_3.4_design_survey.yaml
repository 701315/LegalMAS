    confidence_bonus_on_match: 0.1
    confidence_penalty_on_excluded_segment: 0.12
  evidence:
    required: true
    min_snippet_length: 40
    max_snippet_length: 700
  extraction:
    enabled: true
    mode: hybrid
    store_payload: true
    llm_max_tokens: 700
    compact_output: false
    llm_prompt_extraction: "<role>\nТы — юрист, извлекающий сведения о сроках выполнения работ и этапах\nв договоре ПИР. Не оценивай риски. Только заполняй поля строго по тексту.\n</role>\n\n<context>\n{context}\n</context>\n\n<task>\nЗаполни строго следующие поля:\n\nstart_deadline — срок начала работ\n  (текстовое значение или not_found).\n\nend_deadline — срок окончания работ\n  (текстовое значение или not_found).\n\nmilestone_plan_present — наличие календарного плана или графика\n  (allowed: yes / referenced / no / not_found).\n\nintermediate_milestones_present — наличие промежуточных этапов\n  (allowed: yes / no / not_found).\n\ndeadline_determinacy — характер определённости сроков\n  (allowed: specific_dates / event_based / mixed / vague / not_found).\n\nЕсли данные отсутствуют: указывай \"not_found\"; если срок сформулирован\nчерез событие или период, извлекай его дословно.\n</task>\n\n<rules>\n1. start_deadline / end_deadline извлекай дословно из текста без нормализации дат.\n2.\
      \ milestone_plan_present: \"yes\" — план встроен в договор; \"referenced\" —\n   ссылка на приложение; \"no\" — прямо видно отсутствие плана; \"not_found\" — тема отсутствует.\n3. intermediate_milestones_present: \"yes\" — есть этапы или промежуточные сроки;\n   \"no\" — есть только общий срок; \"not_found\" — тема отсутствует.\n4. deadline_determinacy: \"specific_dates\" — конкретные даты;\n   \"event_based\" — сроки завязаны на событие/период;\n   \"mixed\" — сочетание дат и событий; \"vague\" — срок размытый;\n   \"not_found\" — сроки отсутствуют.\n5. Не добавляй ключи, не входящие в список полей.\n6. Верни только JSON.\n</rules>\n"
    fields:
