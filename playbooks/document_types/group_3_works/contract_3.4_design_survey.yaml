        - "(?i)профессиональн(ой|ая)\\s+ответственност"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор на выполнение проектных и изыскательских работ (ПИР)
        (§ 4 Главы 37 ГК РФ; ст. 55.5-1 ГрК РФ).
        Проверяется только один вопрос: страхование профессиональной
        ответственности проектировщика.
        Нормативный ориентир:
        - ст. 55.5-1 ГрК РФ (страхование ответственности членов СРО)
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не выдумывай суммы покрытия, условия или сроки — извлекай строго из переданного фрагмента.
        - Не путай страхование профессиональной ответственности с членством в СРО (Check 22).
        - Не путай страхование с лимитом ответственности (cap, Check 16).

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Предусмотрено ли страхование профессиональной ответственности.
        2. Минимальная сумма страхового покрытия.
        3. Обязанность поддерживать страхование на весь срок действия договора.
        4. Обязанность предоставить копию страхового полиса заказчику.

        [ПРАВИЛА]
        1. Используй только текст документа. Не выдумывай суммы покрытия, условия или сроки — извлекай строго из переданного фрагмента.
        2. Для enum-полей при отсутствии данных используй значение "not_defined".
        3. Для текстовых полей при отсутствии данных пиши "Данные не определены".
        4. Для полей *_display используй человеко-читаемые значения согласно маппингу.
        5. Различай:
           - "yes" — условие прямо указано в договоре
           - "no" — условие прямо исключено
           - "not_defined" — условие вообще не упоминается в договоре
        6. Критическое правило:
           - Если insurance_required = "no" (страхование прямо исключено), то все остальные поля (maintenance_obligation, policy_copy_required) = "not_defined", display = "Не применимо". Поле min_coverage_amount = "Не применимо".
           - Если insurance_required = "not_defined" (условие не упоминается), то остальные поля = "not_defined", display = "Данные не определены".
        7. Не путай:
           - Страхование профессиональной ответственности (этот check — внешний механизм через страховую компанию) с лимитом ответственности (cap — внутренний механизм ограничения, Check 16)
           - Страхование с членством в СРО (Check 22 — это разные институты, хотя член СРО обязан страховать ответственность)
           - Страхование профессиональной ответственности с иными видами страхования (ОСАГО, страхование имущества и т.п.)
        8. В evidence — только точные цитаты из документа с указанием пункта.
        9. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.без комментариев и markdown-обёртки.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — полный набор условий:
        Фрагмент:
        "Подрядчик обязан застраховать свою профессиональную ответственность
        на сумму не менее 5 000 000 рублей и поддерживать страхование на весь
        срок действия договора. Копия страхового полиса предоставляется Заказчику
        в течение 5 рабочих дней с даты подписания договора."
        Ответ:
