- id: price_and_calculation_basis
  name: Цена работ и основание расчёта (ст. 709 ГК РФ)
  description: Цена (твёрдая или приблизительная) и базис определения (смета по СБЦ, % от СМР, фиксированная сумма)
  legal_base: ст. 709 ГК РФ
  triggers: null
  ui_mode: field_extraction
  severity: critical
  severity_if_pass: pass
  severity_if_fail: critical
  severity_if_unclear: critical
  origin: DOCUMENT_TYPE
  detector_type: hybrid
  rules:
    keywords:
    - цена
    - стоимость
    - вознаграждение
    - рублей
    - смета
    - СБЦ
    - справочник базовых цен
    - процент от стоимости строительства
    - твёрдая цена
    - приблизительная цена
    keyword_mode: any
    regex_patterns:
    - (?i)цен[аеуой]\s+.*?\d
    - (?i)\b\d[\d\s]*(?:руб|рублей|₽|тыс|млн)
    - (?i)(твёрд|приблизительн)(ая|ой)\s+цен
  llm:
    prompt_template: "[КОНТЕКСТ]\nТы — юрист, анализирующий договор ПИР.\nПроверяется только один вопрос: определена ли цена работ, каков её тип,\nвключает ли она НДС и на каком основании она рассчитана.\n\nВажно:\n— Анализируй только положения о цене, стоимости, смете, СБЦ и НДС.\n— Не оценивай риск и не делай выводов вне текста договора.\n— Если цена не указана явно, не вычисляй её самостоятельно.\n\n[ЗАДАЧА]\n1. Установить, определена ли цена работ в договоре.\n2. Извлечь сумму цены, если она указана прямо.\n3. Определить тип цены.\n4. Установить, включает ли цена НДС.\n5. Извлечь основание расчёта цены.\n\n[ПРАВИЛА]\n1. price_amount_status = \"defined\" — только если цена указана явно суммой\n   или однозначно определена формулой с установленным базисом;\n   \"not_defined\" — если цена не установлена или не извлекается из текста.\n2. price_amount_value — числовое значение в рублях без валютного символа\n   и без текстовых пояснений; если явная сумма отсутствует, верни null.\n3. price_type\
      \ = \"fixed\" — твёрдая/фиксированная цена;\n   \"approximate\" — приблизительная/ориентировочная;\n   \"cost_plus\" — фактические затраты плюс вознаграждение;\n   \"percentage\" — процент от стоимости строительства/СМР;\n   \"sbc\" — цена определяется по СБЦ;\n   \"not_found\" — тип цены не установлен.\n4. price_includes_vat = \"yes\" — если сказано «в том числе НДС»;\n   \"no\" — если сказано «без НДС»; \"not_applicable\" — если НДС не применяется;\n   \"unclear\" — цена есть, но режим НДС неясен; \"not_found\" — тема не раскрыта.\n5. calculation_basis — текстовое основание расчёта:\n   «фиксированная сумма», «по СБЦ», «% от СМР», «по смете» и т.п.;\n   если не указано — \"not_found\".\n6. Не путай цену работ с размером аванса, этапного платежа или штрафа.\n7. Если в договоре есть несколько сумм, извлекай именно общую цену договора,\n   а не промежуточные платежи.\n\n[ПРИМЕРЫ (FEW-SHOT)]\nПример 1 — цена определена:\nТекст: «Цена работ по настоящему договору составляет 4 500 000\
      \ рублей,\nв том числе НДС 20%. Цена является твёрдой и определена по СБЦ.»\n\nОтвет:\n{\n  \"price_amount_status\": \"defined\",\n  \"price_amount_value\": 4500000,\n  \"price_type\": \"fixed\",\n  \"price_includes_vat\": \"yes\",\n  \"calculation_basis\": \"по СБЦ\",\n  \"evidence\": [\n    \"Цена работ по настоящему договору составляет 4 500 000 рублей, в том числе НДС 20%.\",\n    \"Цена является твёрдой и определена по СБЦ.\"\n  ]\n}\n\nПример 2 — цена прямо не определена:\nТекст: «Стоимость работ определяется по дополнительным соглашениям сторон.»\n\nОтвет:\n{\n  \"price_amount_status\": \"not_defined\",\n  \"price_amount_value\": null,\n  \"price_type\": \"not_found\",\n  \"price_includes_vat\": \"not_found\",\n  \"calculation_basis\": \"not_found\",\n  \"evidence\": [\n    \"Стоимость работ определяется по дополнительным соглашениям сторон.\"\n  ]\n}\n\n[ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]\n1. Извлечена ли именно общая цена договора, а не сумма аванса или штрафа?\n2. Если сумма\
      \ отсутствует, установлен ли price_amount_value = null?\n3. Корректно ли нормализован тип цены в allowed_values?\n4. Не перепутан ли НДС с общими налоговыми оговорками?\n5. Все ли ключи JSON совпадают со schema?\n\n[ФОРМАТ ОТВЕТА]\nВерни строго JSON:\n{\n  \"price_amount_status\": \"<defined / not_defined>\",\n  \"price_amount_value\": \"<число или null>\",\n  \"price_type\": \"<fixed / approximate / cost_plus / percentage / sbc / not_found>\",\n  \"price_includes_vat\": \"<yes / no / not_applicable / unclear / not_found>\",\n  \"calculation_basis\": \"<текст или not_found>\",\n  \"evidence\": [\"<цитата 1>\", \"<цитата 2>\"]\n}\n"
    prompt_file: null
    context_k: 6
    temperature: 0.0
    max_tokens: 540
  retrieval:
    corpus_scope: document
    context_k: 6
    max_chunks: 8
    retrieval_profile: payment_terms_check
    boost_keywords:
