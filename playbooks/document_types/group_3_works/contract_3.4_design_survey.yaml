    keyword_mode: any
    regex_patterns:
    - (?i)оплат(а|ы).*поэтапн
    - (?i)оплат(а|ы).*после.*подписани.*акт
    - (?i)аванс.*\d
  llm:
    prompt_template: "[КОНТЕКСТ]\nТы — юрист, анализирующий договор ПИР.\nПроверяется только один вопрос: предусмотрены ли аванс и поэтапная оплата,\nа также привязана ли оплата к актам и каков триггер окончательного расчёта.\n\nВажно:\n— Анализируй только положения об оплате, авансе, этапах, актах и окончательном расчёте.\n— Не оценивай риск и не смешивай цену договора с порядком оплаты.\n— Если условие не установлено прямо, не домысливай его.\n\n[ЗАДАЧА]\n1. Установить, предусмотрен ли аванс.\n2. Установить, предусмотрена ли поэтапная оплата.\n3. Установить, привязана ли оплата к подписанию актов.\n4. Определить триггер окончательного расчёта.\n5. Установить, есть ли ссылка на график или приложение с порядком оплаты.\n\n[ПРАВИЛА]\n1. advance_payment_present = \"yes\" — если аванс/предоплата предусмотрены;\n   \"no\" — если прямо указано отсутствие аванса или оплата только по факту;\n   \"not_found\" — если тема аванса не раскрыта.\n2. stage_payment_present = \"yes\" — если платежи делятся\
      \ по этапам;\n   \"no\" — если этапной оплаты нет; \"not_found\" — если тема не раскрыта.\n3. payment_linked_to_acts = \"yes\" — если оплата прямо ставится\n   в зависимость от подписания акта; \"no\" — если оплата явно не связана с актами;\n   \"unclear\" — если связь неясна; \"not_found\" — тема не раскрыта.\n4. final_payment_trigger = \"after_final_act\" — окончательный расчёт\n   после итогового акта; \"after_stage_act\" — после актов этапов;\n   \"after_invoice\" — после счёта/счёта-фактуры без акта;\n   \"not_specified\" — окончательный расчёт упомянут без ясного триггера;\n   \"not_found\" — тема не раскрыта.\n5. payment_schedule_reference — ссылка на приложение, график, календарный план\n   или иной документ о порядке оплаты; если ссылки нет — \"not_found\".\n6. Не путай аванс с обеспечительным платежом или задатком.\n7. Не извлекай сроки оплаты как сроки выполнения работ.\n\n[ПРИМЕРЫ (FEW-SHOT)]\nПример 1 — поэтапная оплата урегулирована:\nТекст: «Заказчик выплачивает аванс\
      \ в размере 30% цены договора.\nОплата оставшейся части производится поэтапно после подписания актов сдачи-приёмки\nпо каждому этапу. Окончательный расчёт осуществляется после подписания итогового акта.\nПорядок оплаты установлен в Приложении № 3.»\n\nОтвет:\n{\n  \"advance_payment_present\": \"yes\",\n  \"stage_payment_present\": \"yes\",\n  \"payment_linked_to_acts\": \"yes\",\n  \"final_payment_trigger\": \"after_final_act\",\n  \"payment_schedule_reference\": \"Приложение № 3\",\n  \"evidence\": [\n    \"Заказчик выплачивает аванс в размере 30% цены договора.\",\n    \"Оплата оставшейся части производится поэтапно после подписания актов сдачи-приёмки по каждому этапу.\",\n    \"Окончательный расчёт осуществляется после подписания итогового акта.\",\n    \"Порядок оплаты установлен в Приложении № 3.\"\n  ]\n}\n\nПример 2 — оплата без явной этапности:\nТекст: «Оплата производится на основании выставленного счёта в течение 10 банковских дней.»\n\nОтвет:\n{\n  \"advance_payment_present\"\
      : \"not_found\",\n  \"stage_payment_present\": \"no\",\n  \"payment_linked_to_acts\": \"no\",\n  \"final_payment_trigger\": \"after_invoice\",\n  \"payment_schedule_reference\": \"not_found\",\n  \"evidence\": [\n    \"Оплата производится на основании выставленного счёта в течение 10 банковских дней.\"\n  ]\n}\n\n[ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]\n1. Разграничены ли аванс, этапность и окончательный расчёт?\n2. Проверена ли именно привязка к акту, а не просто к сдаче работ?\n3. Не перепутан ли счёт с актом?\n4. Есть ли ссылка на отдельное приложение об оплате?\n5. Все ли значения enum соответствуют schema?\n\n[ФОРМАТ ОТВЕТА]\nВерни строго JSON:\n{\n  \"advance_payment_present\": \"<yes / no / not_found>\",\n  \"stage_payment_present\": \"<yes / no / not_found>\",\n  \"payment_linked_to_acts\": \"<yes / no / unclear / not_found>\",\n  \"final_payment_trigger\": \"<after_final_act / after_stage_act / after_invoice / not_specified / not_found>\",\n  \"payment_schedule_reference\": \"<ссылка\
      \ на приложение или not_found>\",\n  \"evidence\": [\"<цитата 1>\", \"<цитата 2>\"]\n}\n"
    prompt_file: null
    context_k: 6
    temperature: 0.0
    max_tokens: 520
  retrieval:
    corpus_scope: document
    context_k: 6
    max_chunks: 8
    retrieval_profile: payment_terms_check
    boost_keywords:
