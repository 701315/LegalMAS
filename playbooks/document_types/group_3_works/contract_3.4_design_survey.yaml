        - "обследование конструкций"
        - "отчёт об обследовании"
        - "заключение о техническом состоянии"
        - "дефектоскопия"
        - "несущая способность"
        - "СП 13-102"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)обследован(ие|ия)\\s+(здан|конструкц|сооружен)"
        - "(?i)техническ(ое|ого)\\s+состоян"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 7: DD_REQUEST_TEMPLATES
#  Читается: DDRequestTemplateLoader
#  Ключи = check_id из checks_v8 и doc_type_checks выше.
#  DDRequestTemplateLoader.render() матчит по exact или prefix.
# ════════════════════════════════════════════════════════════════════════════

dd_request_templates:

  pir_subject_extraction:
    text: >
      Просим подтвердить по {doc_names}: (а) полное наименование объекта проектирования;
      (б) стадию проектирования (П/Р/П+Р); (в) перечень разделов ПД;
      (г) ссылку на ТЗ с подтверждением его утверждения заказчиком.
    addressee: "Обе стороны"

  technical_specification_completeness:
    text: >
      В {doc_names} необходимо подтвердить наличие и полноту ТЗ на проектирование (ст. 759 ГК РФ):
      (а) приложено ли ТЗ к договору; (б) содержит ли оно параметры объекта, ссылки на нормативы,
      требования к результату; (в) утверждено ли заказчиком.
    addressee: "Заказчик"

  object_and_stage_identification:
    text: >
      Просим уточнить в {doc_names}: наименование объекта, его местоположение (адрес/кадастровый номер),
      стадию проектирования, перечень разделов ПД по ПП РФ № 87.
    addressee: "Заказчик"

  price_and_calculation_basis:
    text: >
      Просим подтвердить по {doc_names}: (а) цену работ цифрами и прописью;
      (б) вид цены (твёрдая/приблизительная); (в) основание расчёта (СБЦ, % от СМР, фиксированная);
      (г) включает ли цена НДС; (д) порядок изменения цены при увеличении объёма.
    addressee: "Обе стороны"

  stage_payment_schedule:
    text: >
      Просим уточнить в {doc_names}: (а) размер авансового платежа; (б) привязку промежуточных
      платежей к подписанию актов этапов; (в) условия окончательного расчёта;
      (г) реквизиты для оплаты.
    addressee: "Обе стороны"

  expertise_procedure_and_payment_link:
    text: >
      Просим подтвердить по {doc_names}: (а) вид экспертизы (государственная/негосударственная);
      (б) кто подаёт документы на экспертизу; (в) кто оплачивает экспертизу;
      (г) привязана ли окончательная оплата к положительному заключению;
      (д) последствия отрицательного заключения (бесплатная доработка / за дополнительную плату).
    addressee: "Обе стороны"

  ip_rights_on_documentation:
    text: >
      Просим уточнить в {doc_names}: (а) кому принадлежат исключительные права на ПД;
      (б) момент перехода прав; (в) вправе ли заказчик повторно использовать проект
      (типовая застройка); (г) вправе ли заказчик модифицировать проект;
      (д) сохраняется ли за автором право авторства и иные личные неимущественные права.
    addressee: "Юридический советник"

  designer_liability_for_errors:
    text: >
      Просим уточнить в {doc_names}: (а) объём ответственности проектировщика за ошибки в ПД;
      (б) включает ли ответственность расходы на переделку СМР;
      (в) наличие лимита ответственности и его размер;
      (г) исключены ли косвенные убытки и упущенная выгода.
    addressee: "Юридический советник"

  liability_cap:
    text: >
      Просим согласовать в {doc_names}: лимит совокупной ответственности подрядчика,
      исключения из лимита (умысел, грубая неосторожность), порядок исчисления убытков.
    addressee: "Юридический советник"

  designer_vs_builder_liability:
    text: >
      Просим включить в {doc_names} чёткое разграничение ответственности:
      проектировщик отвечает за качество документации, но не за её реализацию строителями.
      Авторский надзор — отдельная услуга / договор.
    addressee: "Юридический советник"

  initial_data_provision_check:
    text: >
      Просим предоставить по {doc_names}: (а) полный перечень исходных данных с указанием
      ответственного за предоставление; (б) сроки предоставления каждого документа;
      (в) последствия задержки; (г) оговорку об ответственности заказчика за достоверность.
    addressee: "Заказчик"

  initial_data_accuracy_disclaimer:
    text: >
      Просим включить в {doc_names} оговорку: подрядчик не проверяет достоверность исходных данных,
      ответственность за их достоверность несёт заказчик; при выявлении несоответствия — право
      на продление сроков и дополнительную оплату.
    addressee: "Юридический советник подрядчика"

  sro_membership_check:
    text: >
      Просим предоставить по {doc_names}: (а) наименование и номер СРО;
      (б) реквизиты свидетельства/выписки; (в) обязательство поддерживать членство
      на весь срок действия договора.
    addressee: "Подрядчик"

  sro_membership_absent_for_expertise_object:
    text: >
      ВНИМАНИЕ: объект по {doc_names} требует экспертизы, но членство подрядчика в СРО
      не подтверждено. Просим незамедлительно предоставить подтверждение членства в СРО
      проектировщиков (ст. 55.8 ГрК РФ). Без этого получение положительного заключения
      экспертизы невозможно.
    addressee: "Подрядчик"

  author_supervision_terms:
    text: >
      Просим уточнить в {doc_names}: (а) включён ли авторский надзор в договор
      или осуществляется по отдельному договору; (б) объём и периодичность;
      (в) порядок оплаты; (г) ответственность при отказе от авторского надзора.
    addressee: "Обе стороны"

  bim_model_requirements:
    text: >
      Просим уточнить в {doc_names}: (а) требуется ли BIM-модель;
      (б) формат (IFC / native); (в) уровень детализации (LOD);
      (г) порядок и сроки передачи модели; (д) требования к среде общих данных (CDE).
    addressee: "Заказчик"

  performance_deadlines_milestones:
    text: >
      Просим предоставить по {doc_names}: (а) календарный план-график работ с этапами;
      (б) ключевые даты (начало, эскиз, экспертиза, сдача РД);
      (в) привязку сроков к предоставлению исходных данных.
    addressee: "Обе стороны"

  auto_deadline_extension:
    text: >
      Просим включить в {doc_names} условие: при задержке согласования заказчиком
      сроки выполнения автоматически продлеваются на период задержки;
      время рассмотрения заказчиком не включается в сроки подрядчика.
    addressee: "Юридический советник подрядчика"

  acceptance_procedure:
    text: >
      Просим уточнить в {doc_names}: порядок сдачи-приёмки, форму акта,
      срок рассмотрения документации заказчиком, основания для мотивированного отказа,
      комплектность передаваемой документации.
    addressee: "Обе стороны"

  stagewise_approval_procedure:
    text: >
      Просим согласовать в {doc_names}: перечень этапов, подлежащих согласованию;
      сроки рассмотрения каждого этапа; право заказчика на замечания;
      порядок учёта или отклонения замечаний.
    addressee: "Обе стороны"

  defect_remarks_register:
    text: >
      Просим включить в {doc_names}: порядок ведения реестра замечаний,
      сроки устранения, акт об устранении, последствия неустранения в срок.
    addressee: "Юридический советник"

  termination_and_consequences:
    text: >
      Просим уточнить в {doc_names}: (а) основания для одностороннего отказа каждой стороны;
      (б) порядок оплаты выполненной части; (в) возврат документации и исходных данных;
      (г) неустойки и штрафы; (д) судьба авансовых платежей.
    addressee: "Юридический советник"

  assignment_and_subcontracting:
    text: >
      Просим уточнить в {doc_names}: (а) допускается ли привлечение субподрядчиков;
      (б) требуется ли согласие заказчика; (в) сохраняется ли ответственность
      генерального проектировщика; (г) ограничения на уступку прав.
    addressee: "Юридический советник"

  quality_warranty:
    text: >
      Просим подтвердить в {doc_names}: гарантию соответствия ПД действующим нормативам (СП, ГОСТ, СНиП),
      ТЗ и исходным данным. Указать перечень применяемых нормативов.
    addressee: "Подрядчик"

  warranty_period_for_documentation:
    text: >
      Просим включить в {doc_names} гарантийный срок на ПД: продолжительность,
      обязанность безвозмездного устранения дефектов, порядок предъявления претензий.
    addressee: "Юридический советник"

  norms_and_standards_reference:
    text: >
      Просим указать в {doc_names} полный перечень применимых нормативов проектирования
      (СП, ГОСТ, СНиП, технические регламенты) с указанием актуальных редакций.
    addressee: "Подрядчик"

  confidentiality_and_data_return:
    text: >
      Просим включить в {doc_names}: перечень конфиденциальных сведений, срок неразглашения,
      порядок возврата/уничтожения материалов после завершения работ,
      ответственность за нарушение.
    addressee: "Юридический советник"

  insurance_professional_liability:
    text: >
      Просим подтвердить по {doc_names}: наличие полиса страхования профессиональной
      ответственности проектировщика, страховую сумму, срок действия,
      соответствие требованиям СРО.
    addressee: "Подрядчик"

  hazardous_facility_special_permit:
    text: >
      ВНИМАНИЕ: объект по {doc_names} является опасным производственным объектом.
      Просим предоставить: лицензию Ростехнадзора, подтверждение допуска к проектированию ОПО,
      страховой полис, перечень специалистов с допуском к работам на ОПО.
    addressee: "Подрядчик"

  penalty_for_delay:
    text: >
      Просим согласовать в {doc_names}: размер неустойки за просрочку (для обеих сторон),
      предельный размер (cap), порядок исчисления, основания для освобождения.
    addressee: "Юридический советник"

  deviation_from_tz_approval:
    text: >
      Просим включить в {doc_names}: порядок согласования отступлений от ТЗ,
      форму уведомления, срок рассмотрения, последствия несогласования
      (доплата / продление сроков).
    addressee: "Обе стороны"

  parties_identification:
    text: >
      Просим подтвердить полные реквизиты сторон по {doc_names}: наименование/ФИО,
      ИНН, ОГРН, адрес, документы уполномоченных лиц, подтверждение полномочий.
    addressee: "Обе стороны"

  force_majeure:
    text: >
      Просим уточнить в {doc_names}: перечень обстоятельств форс-мажора,
      порядок и сроки уведомления, последствия (приостановка / расторжение),
      подтверждающие документы (ТПП).
    addressee: "Юридический советник"

  dispute_resolution:
    text: >
      Просим согласовать в {doc_names}: претензионный порядок (срок),
      подсудность, возможность медиации / третейского разбирательства.
    addressee: "Юридический советник"

  anticorruption_clause:
    text: >
      Просим включить в {doc_names} антикоррупционную оговорку в соответствии с ФЗ-273:
      заверения сторон, порядок уведомления, последствия нарушения.
    addressee: "Юридический советник"

  vat_and_tax_allocation:
    text: >
      Просим уточнить в {doc_names}: режим НДС, распределение расходов
      на экспертизу и согласования, порядок документооборота (УПД/акт/счёт-фактура).
    addressee: "Бухгалтерия / Юридический советник"

  data_security_and_backup:
    text: >
      Просим включить в {doc_names}: условия хранения и резервирования проектных данных,
      формат передачи электронной версии, требования к среде общих данных.
    addressee: "IT-служба / Юридический советник"

  governing_law:
    text: >
      Просим подтвердить в {doc_names} применимое право (законодательство РФ)
      и язык договора.
    addressee: "Юридический советник"

  pd_composition_pp87_violation:
    text: >
      Просим предоставить по {doc_names}: перечень разделов ПД в соответствии с ПП РФ № 87,
      подтверждение соответствия ТЗ требованиям к составу ПД для данного типа объекта.
    addressee: "Подрядчик / Юридический советник"

  external_approvals_coordination:
    text: >
      Просим уточнить в {doc_names}: (а) кто обязан получить технические условия
      на подключение к сетям; (б) кто несёт расходы на ТУ и согласования;
      (в) перечень органов/организаций для согласования;
      (г) последствия задержки согласований для сроков проектирования.
    addressee: "Обе стороны"

  reconstruction_building_survey_check:
    text: >
      Для {doc_names} (реконструкция/капремонт) просим предоставить:
      (а) отчёт об обследовании существующих конструкций;
      (б) подтверждение квалификации организации, проводившей обследование;
      (в) указать, кто несёт ответственность за достоверность результатов обследования;
      (г) порядок действий при выявлении расхождений в ходе проектирования.
    addressee: "Заказчик"

  reconstruction_survey_requirement:
    text: >
      В {doc_names} предусмотрена реконструкция/капремонт. Просим предоставить:
      результаты обследования существующих конструкций (СП 13-102-2003),
      заключение о техническом состоянии, рекомендации по усилению.
    addressee: "Заказчик"

  documentation_delivery_format:
    text: >
      Просим уточнить в {doc_names}: (а) количество бумажных экземпляров ПД;
      (б) формат электронной версии (DWG/PDF/IFC); (в) требования к BIM-модели
      (если применимо); (г) носитель/способ передачи электронных файлов.
    addressee: "Заказчик"

  energy_efficiency_requirements:
    text: >
      Просим уточнить в {doc_names}: (а) требуемый класс энергетической
      эффективности здания; (б) необходимость разработки энергетического паспорта;
      (в) применимые нормативы по тепловой защите (ФЗ-261).
    addressee: "Заказчик"

  cultural_heritage_without_permit:
    text: >
      ВНИМАНИЕ: объект по {doc_names} является объектом культурного наследия.
      Просим предоставить: (а) лицензию Минкультуры на проектирование работ на ОКН;
      (б) заключение историко-культурной экспертизы; (в) охранное обязательство;
      (г) согласование с органом охраны ОКН; (д) перечень предметов охраны.
    addressee: "Подрядчик / Заказчик"

  ecological_expertise_required:
    text: >
      ВНИМАНИЕ: объект по {doc_names} может подлежать государственной экологической
      экспертизе (ФЗ-174). Просим подтвердить: (а) необходимость ГЭЭ;
      (б) кто подаёт материалы; (в) кто несёт расходы; (г) включена ли ОВОС
      в состав проектной документации.
    addressee: "Заказчик / Экологический консультант"

  # Generic fallback
  _default:
    text: >
      Просим предоставить дополнительную информацию по вопросу «{check_name}»
      применительно к {doc_names}.
    addressee: "Юридический советник"