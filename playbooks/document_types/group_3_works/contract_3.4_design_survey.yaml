      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор на выполнение проектных и изыскательских работ (ПИР)
        (§ 4 Главы 37 ГК РФ, ст. 711, 762).
        Проверяется только один вопрос: аванс, поэтапная оплата,
        привязка к актам и триггер окончательного расчёта.
        Нормативный ориентир:
        - ст. 711 ГК РФ
        - ст. 762 ГК РФ
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Предусмотрен ли аванс.
        2. Предусмотрена ли поэтапная оплата.
        3. Привязана ли оплата к подписанию актов.
        4. Триггер окончательного расчёта.
        5. Ссылка на график или приложение с порядком оплаты.

        [ПРАВИЛА]
        1. Только текст документа.
        2. Если условие не указано прямо — "not_defined".
        3. В evidence — только текст договора.
        4. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1:
        Фрагмент:
        "Заказчик выплачивает аванс в размере 30% цены договора.
        Оплата оставшейся части производится поэтапно после подписания актов сдачи-приёмки
        по каждому этапу. Окончательный расчёт осуществляется после подписания итогового акта.
        Порядок оплаты установлен в Приложении № 3."
        Ответ:
        {
          "advance_payment_present": "yes",
          "stage_payment_present": "yes",
          "payment_linked_to_acts": "yes",
          "final_payment_trigger": "after_final_act",
          "payment_schedule_reference": "Приложение № 3",
          "evidence": [
            {
              "clause_ref": "п. 3.2",
              "quote": "Заказчик выплачивает аванс в размере 30% цены договора."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Оплата производится на основании выставленного счёта в течение 10 банковских дней."
        Ответ:
        {
          "advance_payment_present": "not_defined",
          "stage_payment_present": "no",
          "payment_linked_to_acts": "no",
          "final_payment_trigger": "after_invoice",
          "payment_schedule_reference": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 3.2",
              "quote": "Оплата производится на основании выставленного счёта в течение 10 банковских дней."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Разграничены ли аванс, этапность и окончательный расчёт?
        2. Проверена ли именно привязка к акту, а не просто к сдаче работ?
        3. Не перепутан ли счёт с актом?
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "advance_payment_present": "<yes / no / not_found>",
          "stage_payment_present": "<yes / no / not_found>",
          "payment_linked_to_acts": "<yes / no / unclear / not_found>",
          "final_payment_trigger": "<after_final_act / after_stage_act / after_invoice / not_specified / not_found>",
          "payment_schedule_reference": "<ссылка или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 520
      retrieval:
