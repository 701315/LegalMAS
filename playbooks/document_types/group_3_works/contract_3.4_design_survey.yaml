      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора ПИР сведения о сроках
        выполнения работ и этапах. Не анализируй оплату, неустойку или иные темы.
        Не путай календарный план работ с графиком оплаты.
        </role>
        <context>
        {context}
        </context>
        <task>
        Заполни строго следующие 8 полей (плюс evidence):
        1. start_deadline — срок начала работ (текст) или "Данные не определены".
        2. end_deadline — срок окончания работ (текст) или "Данные не определены".
        3. milestone_plan_present — наличие календарного плана: yes / referenced / no / not_defined.
        4. milestone_plan_present_display — человеко-читаемое значение: "Да, календарный план приложен к договору" / "Да, календарный план указан в договоре" / "Нет, календарный план отсутствует" / "Данные не определены".
        5. intermediate_milestones_present — наличие промежуточных этапов: yes / no / not_defined.
        6. intermediate_milestones_present_display — человеко-читаемое значение: "Да, промежуточные этапы установлены" / "Нет, промежуточные этапы не установлены" / "Данные не определены".
        7. deadline_determinacy — характер определённости сроков: specific_dates / event_based / mixed / vague / not_defined.
        8. deadline_determinacy_display — человеко-читаемое значение: "Конкретные календарные даты" / "Привязка к событию" / "Смешанный вариант (дата + привязка к событию/документу)" / "Неопределённая формулировка" / "Данные не определены".

        Маппинг enum → display:
        - milestone_plan_present: yes → "Да, календарный план приложен к договору", referenced → "Да, календарный план приложен к договору", no → "Нет, календарный план отсутствует", not_defined → "Данные не определены"
        - intermediate_milestones_present: yes → "Да, промежуточные этапы установлены", no → "Нет, промежуточные этапы не установлены", not_defined → "Данные не определены"
        - deadline_determinacy: specific_dates → "Конкретные календарные даты", event_based → "Привязка к событию", mixed → "Смешанный вариант (дата + привязка к событию/документу)", vague → "Неопределённая формулировка", not_defined → "Данные не определены"

        Критические правила:
        - Если сроки определяются по календарному плану/графику (например, "Сроки выполнения работ установлены в Календарном плане (Приложение № 2)") — укажи ссылку в start_deadline/end_deadline, а не "Данные не определены"
        - Не путай календарный план работ с графиком оплаты
        - Не путай сроки выполнения работ со сроком действия договора
        - Не путай промежуточные этапы с этапами оплаты
        </task>
        <context_rules>
        - Используй только текст договора. Не выдумывай даты, не вычисляй сроки самостоятельно — извлекай строго из переданного фрагмента.
        - Не опирайся на внешние знания о типовых сроках ПИР.
        - Извлекай сроки дословно из текста договора.
        - Верни строго валидный JSON. Все 8 ключей + evidence обязаны присутствовать.
        - Запрещены: null, None, пустые строки "". Для текстовых полей при отсутствии данных — "Данные не определены".
        - Убедись, что enum-значения соответствуют их display-версиям согласно маппингу выше.
        - Различай "yes" (календарный план прямо указан в тексте) и "referenced" (календарный план упомянут как приложение/документ).
        </context_rules>

        <output_expectations>
        - Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        - Не используй markdown fences.
        - Не добавляй пояснения до или после JSON.
        - Верни все ключи, перечисленные в task, без пропусков.
        - Не используй null, None или пустые строки.
        - Для статусных полей используй только значения из allowed_values или "not_defined".
        - Для текстовых полей при отсутствии данных используй "Данные не определены" / "Не удалось определить" / "Не применимо" — согласно правилам выше.
        </output_expectations>
      fields:
        - name: "start_deadline"
          type: "string"
          presentation: "fact"
          label: "Начало работ"
