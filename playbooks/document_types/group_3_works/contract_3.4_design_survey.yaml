        max_value_chars: 300
        required: true
      - name: "object_location"
        type: "string"
        label: "Местоположение объекта"
        presentation: "text"
        display_in_grid: false
        display_priority: 4
        description: >
          Адрес или местоположение объекта проектирования.
        max_value_chars: 200
        required: false
