# CHECK 20: Гарантийный срок на ПД (ст. 724, 761 ГК РФ)
# ──────────────────────────────────────────────────────────────────────────
  - id: warranty_period_for_documentation
    name: "Гарантийный срок на проектную документацию (ст. 724, 761 ГК РФ)"
    description: >
      Фактографическая проверка наличия гарантийного срока на ПД,
      его продолжительности, момента начала, безвозмездного устранения
