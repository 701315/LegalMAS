  - id: quality_warranty
    name: "Гарантия качества документации и соответствие нормативам"
    description: >
      Фактографическая проверка гарантий подрядчика (проектировщика) соответствия
      проектной и изыскательской документации нормативным требованиям, техническому
      заданию и обязанности учитывать изменения нормативов в договоре на выполнение
      проектных и изыскательских работ (ПИР). Нормативный ориентир — ст. 761 ГК РФ
      (ответственность за недостатки ПД) и Федеральный закон от 30.12.2009 № 384-ФЗ
      «Технический регламент о безопасности зданий и сооружений». Для договоров ПИР
      гарантия качества — это ключевое обязательство подрядчика: проектная документация
      должна соответствовать действующим сводам правил (СП), государственным стандартам
      (ГОСТ), строительным нормам и правилам (СНиП), техническим регламентам, а также
      техническому заданию заказчика. Проверка выявляет пять критических аспектов:
      (1) наличие прямой гарантии соответствия ПД нормативным требованиям — без такой
      гарантии заказчик не имеет инструмента контроля качества документации; (2) гарантия
      соответствия техническому заданию — отдельное обязательство подрядчика, т.к. ТЗ
      может содержать требования, выходящие за рамки общих нормативов; (3) наличие ссылок
      на конкретные нормативные документы (СП, ГОСТ, СНиП) — критически важно для ПИР,
      т.к. определяет стандарт качества; (4) перечень конкретных нормативов — позволяет
      проверить актуальность и полноту применяемых стандартов; (5) обязанность подрядчика
      учитывать изменения нормативов, вступившие в силу в период выполнения работ — типичный
      механизм защиты заказчика от устаревших проектных решений. Отсутствие или неполнота
      регулирования гарантий качества создаёт риски приёмки некачественной документации,
      невозможности прохождения экспертизы и споров о соответствии проекта нормативным
      требованиям. Важно: данный check проверяет именно гарантию качества (обязательство
      соответствия), а не гарантийный срок на документацию (это разные институты).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "гарантирует соответствие"
        - "нормативные требования"
        - "техническое задание"
        - "действующие нормы"
        - "СНиП"
        - "СП"
        - "ГОСТ"
        - "качество документации"
        - "Свод правил"
        - "технический регламент"
        - "нормы проектирования"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)гарантиру(ет|ют).*соответств"
        - "(?i)документаци.*соответств.*норм"
        - "(?i)\\b(СП|ГОСТ|СНиП)\\s+\\d"
        - "(?i)техническ(ий|ого)\\s+регламент"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор на выполнение проектных и изыскательских работ (ПИР)
        (§ 4 Главы 37 ГК РФ, ст. 761; ФЗ-384).
        Проверяется только один вопрос: гарантия качества ПД и ссылки на нормативы.
        Нормативный ориентир:
        - ст. 761 ГК РФ (ответственность за недостатки ПД)
        - ФЗ-384 «О безопасности зданий и сооружений»
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не выдумывай гарантии или нормативы — извлекай строго из переданного фрагмента.
        - Не путай гарантию качества (обязательство соответствия) с гарантийным сроком (период ответственности за недостатки).
        - Не путай гарантию соответствия ТЗ (этот check) с полнотой содержания ТЗ (Check 3).

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Гарантирует ли подрядчик соответствие ПД нормативам.
        2. Гарантирует ли подрядчик соответствие ПД техническому заданию.
        3. Есть ли ссылки на нормативы (конкретные или общие).
        4. Перечислены ли конкретные нормативные документы (СП, ГОСТ, СНиП).
        5. Обязан ли подрядчик учитывать изменения нормативов.

        [ПРАВИЛА]
        1. Используй только текст документа. Не выдумывай гарантии или нормативы — извлекай строго из переданного фрагмента.
        2. Для enum-полей при отсутствии данных используй значение "not_defined".
        3. Для текстовых полей при отсутствии данных пиши "Данные не определены".
        4. Для полей *_display используй человеко-читаемые значения согласно маппингу.
        5. Различай:
           - "yes" — условие прямо указано в договоре
           - "no" — условие прямо исключено
           - "not_defined" — условие вообще не упоминается в договоре
           - "general_reference" — есть общая ссылка на "действующие нормы", но без конкретных нормативов
           - "yes" (для norms_referenced) — есть конкретные ссылки на СП, ГОСТ, СНиП
        6. Критическое правило:
           - Если quality_guarantee_present = "no" (гарантия качества прямо исключена), то все остальные поля (tz_compliance_guaranteed, norms_referenced, norms_update_obligation) = "not_defined", display = "Не применимо". Поле specific_norms_listed = "Не применимо".
           - Если quality_guarantee_present = "not_defined" (гарантия не упоминается), то остальные поля = "not_defined", display = "Данные не определены".
        7. Не путай:
           - Гарантию качества (обязательство соответствия нормативам) с гарантийным сроком (период ответственности за недостатки после приёмки)
           - Гарантию соответствия ТЗ (этот check) с полнотой содержания ТЗ (Check 3 — проверяет, есть ли в ТЗ требования к результату)
           - Конкретные ссылки на нормативы (СП 54.13330.2022) с общей формулировкой ("действующие нормы")
        8. Если перечень нормативов определяется по приложению/спецификации (например, "Перечень нормативных документов приведён в Приложении № 6") — это валидный исход, укажи ссылку в specific_norms_listed.
        9. В evidence — только точные цитаты из документа с указанием пункта.
        10. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.без комментариев и markdown-обёртки.

