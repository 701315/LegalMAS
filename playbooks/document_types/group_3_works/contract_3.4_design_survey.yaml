    llm_prompt_extraction: "<role>\nТы — юрист, извлекающий сведения о технических условиях и внешних согласованиях\nв договоре ПИР. Не оценивай риски. Только заполняй поля строго по тексту.\n</role>\n\n<context>\n{context}\n</context>\n\n<task>\nЗаполни строго следующие поля:\n\ntu_acquisition_defined — урегулирован ли вопрос получения ТУ\n  (allowed: yes / no / not_found).\n\ntu_responsibility — кто получает ТУ\n  (allowed: contractor / client / jointly / not_specified / not_found).\n\ntu_cost_bearer — кто оплачивает получение ТУ и согласования\n  (allowed: contractor / client / jointly / not_specified / not_found).\n\nexternal_approvals_listed — перечислены ли внешние согласования или органы\n  (allowed: yes / no / not_found).\n\napproval_delay_consequences — последствия задержки согласований\n  (allowed: deadline_extension / contractor_risk / not_specified / not_found).\n\nЕсли данные отсутствуют: указывай \"not_found\" только если тема не раскрыта;\nесли тема есть, но конкретное распределение\
      \ не определено, используй \"no\"\nили \"not_specified\" по смыслу поля.\n</task>\n\n<rules>\n1. tu_acquisition_defined: \"yes\" — вопрос получения ТУ урегулирован;\n   \"no\" — тема затронута, но порядок не урегулирован;\n   \"not_found\" — тема отсутствует.\n2. tu_responsibility / tu_cost_bearer: \"contractor\" — подрядчик;\n   \"client\" — заказчик; \"jointly\" — совместно; \"not_specified\" —\n   вопрос затронут без ясного распределения; \"not_found\" — тема отсутствует.\n3. external_approvals_listed: \"yes\" — перечислены органы или виды согласований;\n   \"no\" — тема есть, но перечня нет; \"not_found\" — тема отсутствует.\n4. approval_delay_consequences: \"deadline_extension\" — срок продлевается;\n   \"contractor_risk\" — задержка отнесена на риск подрядчика;\n   \"not_specified\" — последствие неясно; \"not_found\" — тема отсутствует.\n5. Не добавляй ключи, не входящие в список полей.\n6. Верни только JSON.\n</rules>\n"
