        Не путай координацию разделов с разграничением ответственности проектировщика и строителя.
        </role>
        <context>
        {context}
        </context>
        <task>
        Заполни строго следующие 8 полей (плюс evidence):
        1. coordination_responsible — ответственный за сводку: general_designer / client / jointly / not_specified / not_defined.
        2. coordination_responsible_display — "Генеральный проектировщик" / "Заказчик" / "Совместно" / "Не конкретизировано" / "Данные не определены".
        3. clash_liability — ответственность за коллизии: general_designer / specific_contractor / client / not_specified / not_defined.
        4. clash_liability_display — "Генеральный проектировщик" / "Конкретный субподрядчик-исполнитель" / "Заказчик" / "Не конкретизировано" / "Данные не определены".
        5. interaction_procedure — порядок взаимодействия: defined / not_defined.
        6. interaction_procedure_display — "Да, порядок предусмотрен" / "Данные не определены".
        7. bim_clash_detection — BIM с проверкой коллизий: yes / no / not_defined.
        8. bim_clash_detection_display — "Да, BIM с проверкой коллизий" / "Нет, BIM не предусмотрен" / "Данные не определены".

        Маппинг enum → display:
        - coordination_responsible: general_designer → "Генеральный проектировщик", client → "Заказчик", jointly → "Совместно", not_specified → "Не конкретизировано", not_defined → "Данные не определены"
        - clash_liability: general_designer → "Генеральный проектировщик", specific_contractor → "Конкретный субподрядчик-исполнитель", client → "Заказчик", not_specified → "Не конкретизировано", not_defined → "Данные не определены"
        - interaction_procedure: defined → "Да, порядок предусмотрен", not_defined → "Данные не определены"
        - bim_clash_detection: yes → "Да, BIM с проверкой коллизий", no → "Нет, BIM не предусмотрен", not_defined → "Данные не определены"

