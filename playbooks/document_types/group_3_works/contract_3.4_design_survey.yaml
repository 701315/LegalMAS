- id: performance_deadlines_milestones
  name: Сроки выполнения и этапы (ст. 708, 760 ГК РФ)
  description: Проверяет наличие сроков начала и окончания, календарного плана, ключевых этапов
  legal_base: ст. 708, 760 ГК РФ
  triggers: null
  ui_mode: field_extraction
  severity: critical
  severity_if_pass: pass
  severity_if_fail: critical
  severity_if_unclear: critical
  origin: DOCUMENT_TYPE
  detector_type: hybrid
  rules:
    keywords:
    - срок выполнения
    - календарный план
    - график выполнения
    - дата начала
    - дата окончания
    - этап
    - промежуточный срок
    - не позднее
    keyword_mode: any
    regex_patterns:
    - (?i)(календарн|график).*?(план|работ)
    - (?i)\b\d{1,2}[.]\d{1,2}[.]\d{4}\b
    - (?i)(не\s+позднее|в\s+течение)\s+\d+
  llm:
    prompt_template: "[КОНТЕКСТ]\nТы — юрист, анализирующий договор ПИР.\nПроверяется только один вопрос: определены ли сроки начала и окончания работ,\nпредусмотрен ли календарный план и есть ли промежуточные этапы.\n\nВажно:\n— Анализируй только положения о сроках, этапах, графиках и календарных планах.\n— Не оценивай риск и не смешивай сроки работ со сроками оплаты или рассмотрения замечаний.\n— Если срок задан событием, извлекай его как он указан в тексте.\n\n[ЗАДАЧА]\n1. Извлечь срок начала работ.\n2. Извлечь срок окончания работ.\n3. Установить, есть ли календарный план или график.\n4. Установить, есть ли промежуточные этапы.\n5. Определить характер определённости сроков.\n\n[ПРАВИЛА]\n1. start_deadline — дата, период или событие начала работ; если не указано — \"not_found\".\n2. end_deadline — дата, период или событие окончания работ; если не указано — \"not_found\".\n3. milestone_plan_present = \"yes\" — календарный план/график прямо включён в договор;\n   \"referenced\" — есть ссылка\
      \ на приложение или отдельный документ;\n   \"no\" — прямо видно отсутствие этапного плана; \"not_found\" — тема не раскрыта.\n4. intermediate_milestones_present = \"yes\" — есть промежуточные этапы/сроки;\n   \"no\" — есть общий срок без этапов; \"not_found\" — тема не раскрыта.\n5. deadline_determinacy = \"specific_dates\" — конкретные даты;\n   \"event_based\" — сроки завязаны на события;\n   \"mixed\" — есть и даты, и события;\n   \"vague\" — формулировки размыты;\n   \"not_found\" — сроки не установлены.\n6. Не путай календарный план выполнения работ с графиком оплаты.\n7. Не относись к сроку передачи исходных данных как к сроку выполнения работ.\n\n[ПРИМЕРЫ (FEW-SHOT)]\nПример 1 — сроки и этапы определены:\nТекст: «Работы начинаются 01.03.2025 и должны быть завершены не позднее 30.06.2025.\nКалендарный план выполнения работ приведён в Приложении № 2.\nРаботы выполняются в 3 этапа.»\n\nОтвет:\n{\n  \"start_deadline\": \"01.03.2025\",\n  \"end_deadline\": \"30.06.2025\",\n  \"\
      milestone_plan_present\": \"referenced\",\n  \"intermediate_milestones_present\": \"yes\",\n  \"deadline_determinacy\": \"specific_dates\",\n  \"evidence\": [\n    \"Работы начинаются 01.03.2025 и должны быть завершены не позднее 30.06.2025.\",\n    \"Календарный план выполнения работ приведён в Приложении № 2.\",\n    \"Работы выполняются в 3 этапа.\"\n  ]\n}\n\nПример 2 — срок задан событием:\nТекст: «Подрядчик приступает к работам в течение 3 рабочих дней с даты получения исходных данных.\nСрок выполнения работ составляет 60 календарных дней.»\n\nОтвет:\n{\n  \"start_deadline\": \"в течение 3 рабочих дней с даты получения исходных данных\",\n  \"end_deadline\": \"60 календарных дней\",\n  \"milestone_plan_present\": \"not_found\",\n  \"intermediate_milestones_present\": \"no\",\n  \"deadline_determinacy\": \"event_based\",\n  \"evidence\": [\n    \"Подрядчик приступает к работам в течение 3 рабочих дней с даты получения исходных данных.\",\n    \"Срок выполнения работ составляет\
      \ 60 календарных дней.\"\n  ]\n}\n\n[ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]\n1. Извлечены ли именно сроки выполнения работ, а не сроки оплаты?\n2. Разграничены ли календарный план и график оплаты?\n3. Установлены ли промежуточные этапы отдельно от общего срока?\n4. Корректно ли определён тип определённости сроков?\n5. Все ли ключи JSON совпадают с полями schema?\n\n[ФОРМАТ ОТВЕТА]\nВерни строго JSON:\n{\n  \"start_deadline\": \"<текст или not_found>\",\n  \"end_deadline\": \"<текст или not_found>\",\n  \"milestone_plan_present\": \"<yes / referenced / no / not_found>\",\n  \"intermediate_milestones_present\": \"<yes / no / not_found>\",\n  \"deadline_determinacy\": \"<specific_dates / event_based / mixed / vague / not_found>\",\n  \"evidence\": [\"<цитата 1>\", \"<цитата 2>\"]\n}\n"
    prompt_file: null
    context_k: 6
    temperature: 0.0
    max_tokens: 560
  retrieval:
    corpus_scope: document
    context_k: 6
    max_chunks: 8
    retrieval_profile: completion_deadline_check
    boost_keywords:
    - срок выполнения
    - календарный план
    - график выполнения
    - этап
    - не позднее
    negative_keywords:
    - оплата
    - аванс
    - претензия
    - неустойка
    rerank: true
