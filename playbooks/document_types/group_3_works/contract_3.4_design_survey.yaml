    - article
    - appendix_reference
    excluded_segment_types:
    - signature_block
    preferred_clause_functions:
    - definitions
    - obligations
    confidence_bonus_on_match: 0.1
    confidence_penalty_on_excluded_segment: 0.12
  evidence:
    required: true
    min_snippet_length: 40
    max_snippet_length: 600
  extraction:
    enabled: true
    mode: hybrid
    store_payload: true
    llm_max_tokens: 550
    compact_output: false
    llm_prompt_extraction: "<role>\nТы — юрист, извлекающий сведения об исходных данных в договоре ПИР.\nНе оценивай риски. Только заполняй поля строго по тексту.\n</role>\n\n<context>\n{context}\n</context>\n\n<task>\nЗаполни строго следующие поля:\n\ninitial_data_list_present — есть ли перечень исходных данных\n  (allowed: yes / no / not_found).\n\ninitial_data_deadlines — определены ли сроки предоставления исходных данных\n  (allowed: specified / not_specified / not_found).\n\ndelay_consequences — договорное последствие задержки предоставления исходных данных\n  (allowed: deadline_extension / rework_at_client_cost / termination_right / not_specified / not_found).\n\ndata_accuracy_disclaimer — есть ли оговорка об ответственности заказчика\n  за достоверность исходных данных\n  (allowed: yes / no / not_found).\n\nЕсли данные отсутствуют: указывай \"not_found\" только если тема не раскрыта;\nесли тема раскрыта, но конкретное условие не установлено, используй\nсоответствующее значение \"\
      no\" или \"not_specified\".\n</task>\n\n<rules>\n1. initial_data_list_present: \"yes\" — есть перечень или перечислены конкретные документы;\n   \"no\" — есть только общее упоминание без перечня; \"not_found\" — тема отсутствует.\n2. initial_data_deadlines: \"specified\" — есть срок, дата или событие;\n   \"not_specified\" — исходные данные упомянуты, но срок не установлен;\n   \"not_found\" — тема отсутствует.\n3. delay_consequences: \"deadline_extension\" — срок работ продлевается;\n   \"rework_at_client_cost\" — переделка/допработы за счёт заказчика;\n   \"termination_right\" — право приостановить или прекратить договор;\n   \"not_specified\" — последствие неясно; \"not_found\" — тема отсутствует.\n4. data_accuracy_disclaimer: \"yes\" — заказчик отвечает за достоверность\n   или подрядчик освобождён от ответственности за недостоверные данные;\n   \"no\" — тема исходных данных есть, но оговорки нет; \"not_found\" — тема отсутствует.\n5. Не добавляй ключи, не входящие в список полей.\n\
      6. Верни только JSON.\n</rules>\n"
    fields:
    - name: initial_data_list_present
      type: string
      label: Перечень исходных данных
      presentation: badge
      display_in_grid: true
      display_priority: 1
      allowed_values:
      - 'yes'
      - 'no'
      - not_found
      description: Наличие перечня исходных данных, передаваемых заказчиком.
      required: true
    - name: initial_data_deadlines
      type: string
      label: Сроки предоставления
      presentation: badge
      display_in_grid: true
      display_priority: 2
      allowed_values:
      - specified
      - not_specified
      - not_found
      description: Определены ли сроки предоставления исходных данных.
      required: false
    - name: delay_consequences
      type: string
      label: Последствия задержки
      presentation: badge
      display_in_grid: true
      display_priority: 3
      allowed_values:
      - deadline_extension
      - rework_at_client_cost
      - termination_right
      - not_specified
      - not_found
      description: Последствия задержки предоставления исходных данных.
      required: false
    - name: data_accuracy_disclaimer
      type: string
      label: Оговорка о достоверности данных
      presentation: badge
      display_in_grid: false
      display_priority: 4
      allowed_values:
