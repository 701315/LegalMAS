  - id: external_approvals_coordination
    name: "Согласования с ресурсоснабжающими организациями и органами"
    description: >
      Фактографическая проверка режима получения технических условий (ТУ) на подключение
      к сетям инженерно-технического обеспечения и внешних согласований проектной документации
      с уполномоченными органами в рамках договора на выполнение проектных и изыскательских
      работ (ПИР). Технические условия — обязательный исходный документ для проектирования
      объектов капитального строительства, выдаваемый ресурсоснабжающими организациями
      (электро-, водо-, тепло-, газоснабжение, водоотведение) в порядке, установленном
      Постановлением Правительства РФ № 830 и ГрК РФ (ст. 48). Внешние согласования
      — это получение заключений от федеральных и региональных органов: МЧС (пожарная
      безопасность), Роспотребнадзор (санитарно-эпидемиологические требования), ГИБДД
      (безопасность дорожного движения), Росприроднадзор, органы охраны культурного
      наследия и др. Проверка выявляет пять критических аспектов: (1) урегулирован ли
      в договоре вопрос получения ТУ; (2) на ком лежит обязанность получения ТУ —
      на заказчике (как правило, т.к. ТУ выдаются собственнику земельного участка),
      подрядчике или совместно; (3) кто несёт расходы на получение ТУ и согласований;
      (4) перечислены ли конкретные внешние согласования и органы в договоре; (5) какие
      последствия предусмотрены для подрядчика в случае задержки получения согласований
      заказчиком — продление срока выполнения работ или риск срыва сроков лежит на подрядчике.
      Отсутствие урегулирования этих вопросов — типичная причина споров о срыве сроков
      проектирования и дополнительных расходах подрядчика.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "технические условия на подключение"
        - "ТУ на подключение"
        - "согласование с"
        - "ресурсоснабжающая организация"
        - "сетевая организация"
        - "Роспотребнадзор"
        - "МЧС"
        - "пожарный надзор"
        - "ГИБДД"
        - "орган охраны"
        - "Ростехнадзор"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)техническ(ие|их)\\s+услови(я|й)\\s+на\\s+подключен"
        - "(?i)согласован(ие|ия)\\s+с\\s+"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор на выполнение проектных и изыскательских работ (ПИР)
        (§ 4 Главы 37 ГК РФ; ГрК РФ ст. 48).
        Проверяется только один вопрос: получение ТУ и внешних согласований.
        Нормативный ориентир:
        - ст. 48 ГрК РФ
        - Постановление Правительства РФ № 830 (порядок получения ТУ)
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Урегулирован ли вопрос получения ТУ.
        2. Кто обязан получать ТУ.
        3. Кто несёт расходы на получение ТУ и согласования.
        4. Перечислены ли внешние согласования и органы.
        5. Последствия задержки согласований.

        [ПРАВИЛА]
        1. Используй только текст документа. Не выдумывай условия получения ТУ или согласований — извлекай строго из переданного фрагмента.
        2. Для enum-полей при отсутствии данных используй значение "not_defined".
        3. Для полей *_display используй человеко-читаемые значения согласно маппингу.
        4. Различай:
           - "yes" — вопрос урегулирован / перечислены конкретные органы
           - "no" — тема упоминается, но условие не урегулировано
           - "not_defined" — тема вообще не упоминается в договоре
           - "contractor" — подрядчик (проектировщик/изыскатель)
           - "client" — заказчик
           - "jointly" — совместно
           - "deadline_extension" — продление срока выполнения работ
           - "contractor_risk" — риск срыва сроков лежит на подрядчике
        5. Не путай:
           - ТУ на подключение к сетям (этот check) с исходными данными в целом (Check 4)
           - Расходы на ТУ с расходами на экспертизу ПД (Check 5)
        6. В evidence — только точные цитаты из документа с указанием пункта.
        7. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.без комментариев и markdown-обёртки.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — полный набор условий:
        Фрагмент:
        "Заказчик обеспечивает получение технических условий на подключение
        объекта к инженерным сетям и согласования с ресурсоснабжающими организациями.
