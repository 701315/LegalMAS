      - "за каждый день просрочки"
    negative_keywords:
      - "экспертиза"
      - "форс-мажор"
      - "подсудность"
      - "расторжение"
    rerank: true
    filters: {}
  enrichment_hints:
    preferred_segment_types:
      - "clause"
      - "article"
    excluded_segment_types:
      - "signature_block"
    preferred_clause_functions:
      - "penalty"
      - "limitations"
  evidence:
