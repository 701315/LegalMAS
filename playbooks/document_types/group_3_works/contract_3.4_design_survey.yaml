# ──────────────────────────────────────────────────────────────────────────
# CHECK 6: Внешние согласования и технические условия
# ──────────────────────────────────────────────────────────────────────────
- id: external_approvals_coordination
  name: "Согласования с ресурсоснабжающими организациями и органами (ст. 48 ГрК РФ)"
  description: |
    Проверяет наличие условий о получении и согласовании технических условий (ТУ)
    на подключение к сетям, согласовании с ГИБДД, пожарным надзором, органами охраны
    ОКН, Роспотребнадзором. Кто получает ТУ, кто несёт расходы, кто отвечает
    за задержки при согласовании.
  triggers: ~
  ui_mode: "field_extraction"
  severity: "high"
  origin: "DOCUMENT_TYPE"
  detector_type: "hybrid"
  rules:
    keywords:
      - "технические условия на подключение"
      - "ТУ на подключение"
      - "согласование с"
      - "ресурсоснабжающая организация"
      - "сетевая организация"
      - "Роспотребнадзор"
      - "МЧС"
      - "пожарный надзор"
      - "ГИБДД"
      - "орган охраны"
      - "Ростехнадзор"
    keyword_mode: "any"
    regex_patterns:
      - "(?i)техническ(ие|их)\\s+услови(я|й)\\s+на\\s+подключен"
      - "(?i)согласован(ие|ия)\\s+с\\s+"
  llm:
    prompt_template: |
      [КОНТЕКСТ]
      Ты — юрист, анализирующий договор ПИР.
      Проверяется только один вопрос: получение технических условий (ТУ)
      и внешних согласований с ресурсоснабжающими организациями и государственными органами.

      Важно:
      — Анализируй только положения о ТУ, согласованиях, внешних органах и последствиях задержек.
      — Не оценивай риск и не делай выводов за пределами текста.
      — Не смешивай получение ТУ с прохождением экспертизы проектной документации.

      [ЗАДАЧА]
      1. Установить, урегулирован ли вопрос получения ТУ.
      2. Определить, кто обязан получать ТУ.
      3. Определить, кто несёт расходы на получение ТУ и согласования.
      4. Установить, перечислены ли внешние согласования и органы.
      5. Установить последствия задержки согласований.

      [ПРАВИЛА]
      1. tu_acquisition_defined = "yes" — если договор прямо регулирует получение ТУ;
         "no" — если тема есть, но порядок не урегулирован или прямо выведен
         за рамки договора; "not_found" — если тема отсутствует.
      2. tu_responsibility / tu_cost_bearer:
         "contractor" — подрядчик; "client" — заказчик; "jointly" — совместно;
         "not_specified" — вопрос затронут, но распределение неясно;
         "not_found" — тема отсутствует.
      3. external_approvals_listed = "yes" — если перечислены органы или виды согласований
         (например, ГИБДД, МЧС, Роспотребнадзор, органы охраны ОКН, сетевые организации);
         "no" — если тема согласований есть, но конкретный перечень не приведён;
         "not_found" — тема отсутствует.
      4. approval_delay_consequences = "deadline_extension" — срок работ продлевается;
         "contractor_risk" — задержка возложена на подрядчика без продления;
         "not_specified" — тема задержки затронута без ясного последствия;
         "not_found" — тема отсутствует.
      5. Если ТУ упомянуты только как исходные данные заказчика без описания процедуры,
         tu_acquisition_defined = "no".
      6. Не путай расходы на экспертизу с расходами на получение ТУ и согласований.
      7. Не извлекай внутренние согласования заказчика как внешние согласования.

      [ПРИМЕРЫ (FEW-SHOT)]
      Пример 1 — процедура урегулирована:
      Текст: «Заказчик обеспечивает получение технических условий на подключение
      объекта к инженерным сетям и согласования с ресурсоснабжающими организациями.
      Расходы на получение ТУ и согласования несёт Заказчик. При задержке предоставления
      согласований сроки выполнения работ продлеваются на соответствующий период.
      Подлежат получению согласования с МЧС и Роспотребнадзором.»

      Ответ:
      {
        "tu_acquisition_defined": "yes",
        "tu_responsibility": "client",
        "tu_cost_bearer": "client",
        "external_approvals_listed": "yes",
        "approval_delay_consequences": "deadline_extension",
        "evidence": [
          "Заказчик обеспечивает получение технических условий на подключение объекта к инженерным сетям и согласования с ресурсоснабжающими организациями.",
          "Расходы на получение ТУ и согласования несёт Заказчик.",
          "При задержке предоставления согласований сроки выполнения работ продлеваются на соответствующий период.",
          "Подлежат получению согласования с МЧС и Роспотребнадзором."
        ]
      }

      Пример 2 — тема не раскрыта:
      Текст: «Подрядчик выполняет работы в объёме, предусмотренном договором.»

      Ответ:
      {
        "tu_acquisition_defined": "not_found",
        "tu_responsibility": "not_found",
        "tu_cost_bearer": "not_found",
        "external_approvals_listed": "not_found",
        "approval_delay_consequences": "not_found",
        "evidence": []
      }

      [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
      1. Есть ли в тексте именно ТУ на подключение или внешние согласования?
      2. Ясно ли разделены обязанность получить ТУ и обязанность оплатить их получение?
      3. Перечислены ли конкретные органы или организации?
      4. Указано ли прямое последствие задержки согласований?
      5. Не спутаны ли эти условия с экспертизой ПД?

      [ФОРМАТ ОТВЕТА]
      Верни строго JSON:
      {
        "tu_acquisition_defined": "<yes / no / not_found>",
        "tu_responsibility": "<contractor / client / jointly / not_specified / not_found>",
        "tu_cost_bearer": "<contractor / client / jointly / not_specified / not_found>",
        "external_approvals_listed": "<yes / no / not_found>",
        "approval_delay_consequences": "<deadline_extension / contractor_risk / not_specified / not_found>",
        "evidence": ["<цитата 1>", "<цитата 2>"]
      }
    prompt_file: null
    context_k: 6
    temperature: 0.0
    max_tokens: 520
  retrieval:
    corpus_scope: "document"
    context_k: 6
    max_chunks: 8
    boost_keywords:
      - "технические условия"
      - "согласование"
      - "ресурсоснабжающая организация"
      - "подключение"
    negative_keywords:
      - "экспертиза"
      - "форс-мажор"
      - "подсудность"
      - "неустойка"
    rerank: true
    filters: {}
  enrichment_hints:
    preferred_segment_types:
      - "clause"
      - "article"
      - "appendix_reference"
    excluded_segment_types:
      - "signature_block"
    preferred_clause_functions:
      - "procedures"
      - "obligations"
  evidence:
    required: true
    min_snippet_length: 40
    max_snippet_length: 600
  extraction:
    enabled: true
    mode: "hybrid"
    store_payload: true
    llm_max_tokens: 700

    compact_output: false

    llm_prompt_extraction: |
      <role>
      Ты — юрист, извлекающий сведения о технических условиях и внешних согласованиях
      в договоре ПИР. Не оценивай риски. Только заполняй поля строго по тексту.
      </role>

      <context>
      {context}
      </context>

      <task>
      Заполни строго следующие поля:

      tu_acquisition_defined — урегулирован ли вопрос получения ТУ
        (allowed: yes / no / not_found).

      tu_responsibility — кто получает ТУ
        (allowed: contractor / client / jointly / not_specified / not_found).

      tu_cost_bearer — кто оплачивает получение ТУ и согласования
        (allowed: contractor / client / jointly / not_specified / not_found).

      external_approvals_listed — перечислены ли внешние согласования или органы
        (allowed: yes / no / not_found).

      approval_delay_consequences — последствия задержки согласований
        (allowed: deadline_extension / contractor_risk / not_specified / not_found).

      Если данные отсутствуют: указывай "not_found" только если тема не раскрыта;
      если тема есть, но конкретное распределение не определено, используй "no"
      или "not_specified" по смыслу поля.
      </task>

      <rules>
      1. tu_acquisition_defined: "yes" — вопрос получения ТУ урегулирован;
         "no" — тема затронута, но порядок не урегулирован;
         "not_found" — тема отсутствует.
      2. tu_responsibility / tu_cost_bearer: "contractor" — подрядчик;
         "client" — заказчик; "jointly" — совместно; "not_specified" —
         вопрос затронут без ясного распределения; "not_found" — тема отсутствует.
      3. external_approvals_listed: "yes" — перечислены органы или виды согласований;
         "no" — тема есть, но перечня нет; "not_found" — тема отсутствует.
      4. approval_delay_consequences: "deadline_extension" — срок продлевается;
         "contractor_risk" — задержка отнесена на риск подрядчика;
         "not_specified" — последствие неясно; "not_found" — тема отсутствует.
      5. Не добавляй ключи, не входящие в список полей.
      6. Верни только JSON.
      </rules>
    fields:
      - name: "tu_acquisition_defined"
        type: "string"
        label: "Получение ТУ урегулировано"
        presentation: "badge"
        display_in_grid: true
        display_priority: 1
        allowed_values:
          - "yes"
          - "no"
          - "not_found"
        description: "Урегулирован ли вопрос получения технических условий."
        required: true
      - name: "tu_responsibility"
        type: "string"
        label: "Кто получает ТУ"
        presentation: "badge"
        display_in_grid: true
        display_priority: 2
        allowed_values:
          - "contractor"
          - "client"
          - "jointly"
          - "not_specified"
          - "not_found"
        description: "Кто обязан получить ТУ от внешних организаций."
        required: false
      - name: "tu_cost_bearer"
        type: "string"
        label: "Кто оплачивает ТУ/согласования"
        presentation: "badge"
        display_in_grid: false
        display_priority: 4
        allowed_values:
          - "contractor"
          - "client"
          - "jointly"
          - "not_specified"
          - "not_found"
        description: "Кто несёт расходы на получение ТУ и согласований."
        required: false
      - name: "external_approvals_listed"
        type: "string"
        label: "Внешние согласования перечислены"
        presentation: "badge"
        display_in_grid: true
        display_priority: 3
        allowed_values:
          - "yes"
          - "no"
          - "not_found"
        description: "Перечислены ли внешние согласования и органы."
        required: false
      - name: "approval_delay_consequences"
        type: "string"
        label: "Последствия задержки согласований"
        presentation: "badge"
        display_in_grid: false
        display_priority: 5
        allowed_values:
          - "deadline_extension"
          - "contractor_risk"
          - "not_specified"
          - "not_found"
        description: "Последствия задержки получения ТУ и внешних согласований."
        required: false

# ──────────────────────────────────────────────────────────────────────────
# CHECK 7: Цена работ и основание расчёта
# ──────────────────────────────────────────────────────────────────────────
- id: price_and_calculation_basis
  name: "Цена работ и основание расчёта (ст. 709 ГК РФ)"
  description: "Цена (твёрдая или приблизительная) и базис определения (смета по СБЦ, % от СМР, фиксированная сумма)"
  legal_base: "ст. 709 ГК РФ"
  triggers: ~
  ui_mode: "field_extraction"
  severity: "critical"
  origin: "DOCUMENT_TYPE"
  detector_type: "hybrid"
  rules:
    keywords:
      - "цена"
      - "стоимость"
      - "вознаграждение"
      - "рублей"
      - "смета"
      - "СБЦ"
      - "справочник базовых цен"
      - "процент от стоимости строительства"
      - "твёрдая цена"
      - "приблизительная цена"
    keyword_mode: "any"
    regex_patterns:
      - "(?i)цен[аеуой]\\s+.*?\\d"
      - "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|тыс|млн)"
      - "(?i)(твёрд|приблизительн)(ая|ой)\\s+цен"
  llm:
    prompt_template: |
      [КОНТЕКСТ]
      Ты — юрист, анализирующий договор ПИР.
      Проверяется только один вопрос: определена ли цена работ, каков её тип,
      включает ли она НДС и на каком основании она рассчитана.

      Важно:
      — Анализируй только положения о цене, стоимости, смете, СБЦ и НДС.
      — Не оценивай риск и не делай выводов вне текста договора.
      — Если цена не указана явно, не вычисляй её самостоятельно.

      [ЗАДАЧА]
      1. Установить, определена ли цена работ в договоре.
      2. Извлечь сумму цены, если она указана прямо.
      3. Определить тип цены.
      4. Установить, включает ли цена НДС.
      5. Извлечь основание расчёта цены.

      [ПРАВИЛА]
      1. price_amount_status = "defined" — только если цена указана явно суммой
         или однозначно определена формулой с установленным базисом;
         "not_defined" — если цена не установлена или не извлекается из текста.
      2. price_amount_value — числовое значение в рублях без валютного символа
         и без текстовых пояснений; если явная сумма отсутствует, верни null.
      3. price_type = "fixed" — твёрдая/фиксированная цена;
         "approximate" — приблизительная/ориентировочная;
         "cost_plus" — фактические затраты плюс вознаграждение;
         "percentage" — процент от стоимости строительства/СМР;
         "sbc" — цена определяется по СБЦ;
         "not_found" — тип цены не установлен.
      4. price_includes_vat = "yes" — если сказано «в том числе НДС»;
         "no" — если сказано «без НДС»; "not_applicable" — если НДС не применяется;
         "unclear" — цена есть, но режим НДС неясен; "not_found" — тема не раскрыта.
      5. calculation_basis — текстовое основание расчёта:
         «фиксированная сумма», «по СБЦ», «% от СМР», «по смете» и т.п.;
         если не указано — "not_found".
      6. Не путай цену работ с размером аванса, этапного платежа или штрафа.
      7. Если в договоре есть несколько сумм, извлекай именно общую цену договора,
         а не промежуточные платежи.

      [ПРИМЕРЫ (FEW-SHOT)]
      Пример 1 — цена определена:
      Текст: «Цена работ по настоящему договору составляет 4 500 000 рублей,
      в том числе НДС 20%. Цена является твёрдой и определена по СБЦ.»

      Ответ:
      {
        "price_amount_status": "defined",
        "price_amount_value": 4500000,
        "price_type": "fixed",
        "price_includes_vat": "yes",
        "calculation_basis": "по СБЦ",
        "evidence": [
          "Цена работ по настоящему договору составляет 4 500 000 рублей, в том числе НДС 20%.",
          "Цена является твёрдой и определена по СБЦ."
        ]
      }

      Пример 2 — цена прямо не определена:
      Текст: «Стоимость работ определяется по дополнительным соглашениям сторон.»

      Ответ:
      {
        "price_amount_status": "not_defined",
        "price_amount_value": null,
        "price_type": "not_found",
        "price_includes_vat": "not_found",
        "calculation_basis": "not_found",
        "evidence": [
          "Стоимость работ определяется по дополнительным соглашениям сторон."
        ]
      }

      [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
      1. Извлечена ли именно общая цена договора, а не сумма аванса или штрафа?
      2. Если сумма отсутствует, установлен ли price_amount_value = null?
      3. Корректно ли нормализован тип цены в allowed_values?
      4. Не перепутан ли НДС с общими налоговыми оговорками?
      5. Все ли ключи JSON совпадают со schema?

      [ФОРМАТ ОТВЕТА]
      Верни строго JSON:
      {
        "price_amount_status": "<defined / not_defined>",
        "price_amount_value": "<число или null>",
        "price_type": "<fixed / approximate / cost_plus / percentage / sbc / not_found>",
        "price_includes_vat": "<yes / no / not_applicable / unclear / not_found>",
        "calculation_basis": "<текст или not_found>",
        "evidence": ["<цитата 1>", "<цитата 2>"]
      }
    prompt_file: null
    context_k: 6
    temperature: 0.0
    max_tokens: 540
  retrieval:
    corpus_scope: "document"
    context_k: 6
    max_chunks: 8
    retrieval_profile: "payment_terms_check"
    boost_keywords:
      - "цена"
      - "стоимость"
      - "смета"
      - "СБЦ"
      - "твёрдая цена"
      - "приблизительная цена"
      - "НДС"
    negative_keywords:
      - "аванс"
      - "неустойка"
      - "штраф"
      - "экспертиза"
    rerank: true
    filters: {}
  enrichment_hints:
    preferred_segment_types:
      - "clause"
      - "article"
      - "table"
    excluded_segment_types:
      - "signature_block"
    preferred_clause_functions:
      - "obligations"
  evidence:
    required: true
    min_snippet_length: 40
    max_snippet_length: 700
  extraction:
    enabled: true
    mode: "hybrid"
    store_payload: true
    llm_max_tokens: 700

    compact_output: false

    llm_prompt_extraction: |
      <role>
      Ты — юрист, извлекающий сведения о цене работ и основании её расчёта
      в договоре ПИР. Не оценивай риски. Только заполняй поля строго по тексту.
      </role>

      <context>
      {context}
      </context>

      <task>
      Заполни строго следующие поля:

      price_amount_status — определена ли цена работ
        (allowed: defined / not_defined).

      price_amount_value — сумма цены работ в рублях
        (числовое значение без символа валюты или null, если сумма прямо не указана).

      price_type — тип цены
        (allowed: fixed / approximate / cost_plus / percentage / sbc / not_found).

      price_includes_vat — включает ли цена НДС
        (allowed: yes / no / not_applicable / unclear / not_found).

      calculation_basis — основание расчёта цены
        (текстовое значение, например "по СБЦ", "% от стоимости СМР",
        "фиксированная сумма", "по смете", или not_found).

      Если данные отсутствуют: указывай "not_defined" для price_amount_status,
      null для price_amount_value, "not_found" для price_type и calculation_basis,
      а для price_includes_vat — "not_found" или "unclear" по смыслу текста.
      </task>

      <rules>
      1. price_amount_status = "defined" только если цена прямо указана
         суммой или однозначно определена в договоре.
      2. price_amount_value: верни только число в рублях; если суммы нет — null.
      3. price_type: "fixed" — твёрдая/фиксированная; "approximate" —
         приблизительная/ориентировочная; "cost_plus" — затраты плюс;
         "percentage" — процент от стоимости; "sbc" — по СБЦ; "not_found" — не установлен.
      4. price_includes_vat: "yes" — в том числе НДС; "no" — без НДС;
         "not_applicable" — НДС не применяется; "unclear" — режим НДС неясен;
         "not_found" — тема отсутствует.
      5. calculation_basis извлекай кратко и дословно по смыслу,
         без добавления новых формулировок.
      6. Не добавляй ключи, не входящие в список полей.
      7. Верни только JSON.
      </rules>
    fields:
      - name: "price_amount_status"
        type: "string"
        label: "Цена определена"
        presentation: "badge"
        display_in_grid: true
        display_priority: 1
        allowed_values:
          - "defined"
          - "not_defined"
        description: "Определена ли цена работ в договоре."
        required: true
      - name: "price_amount_value"
        type: "number"
        label: "Цена работ"
        presentation: "number"
        display_in_grid: true
        display_priority: 2
        unit: "RUB"
        description: "Общая цена работ по договору в рублях."
        required: false
      - name: "price_type"
        type: "string"
        label: "Тип цены"
        presentation: "badge"
        display_in_grid: true
        display_priority: 3
        allowed_values:
          - "fixed"
          - "approximate"
          - "cost_plus"
          - "percentage"
          - "sbc"
          - "not_found"
        description: "Тип цены по договору."
        required: false
      - name: "price_includes_vat"
        type: "string"
        label: "НДС"
        presentation: "badge"
        display_in_grid: false
        display_priority: 4
        allowed_values:
          - "yes"
          - "no"
          - "not_applicable"
          - "unclear"
          - "not_found"
        description: "Включает ли цена НДС."
        required: false
      - name: "calculation_basis"
        type: "string"
        label: "Основание расчёта"
        presentation: "text"
        display_in_grid: false
        display_priority: 5
        description: "Основание расчёта цены: СБЦ, смета, процент, фиксированная сумма и т.п."
        max_value_chars: 150
        required: false

# ──────────────────────────────────────────────────────────────────────────
# CHECK 8: Поэтапная оплата и привязка к актам
# ──────────────────────────────────────────────────────────────────────────
- id: stage_payment_schedule
  name: "Поэтапная оплата: привязка к согласованию и актам (ст. 711, 762 ГК РФ)"
  description: "Проверяет наличие аванса и поэтапной оплаты, привязку к подписанию актов"
  legal_base: "ст. 711, 762 ГК РФ"
  triggers: ~
  ui_mode: "field_extraction"
  severity: "high"
  origin: "DOCUMENT_TYPE"
  detector_type: "hybrid"
  rules:
    keywords:
      - "оплата по этапам"
      - "поэтапная оплата"
      - "авансовый платеж"
      - "аванс"
      - "после подписания акта"
      - "окончательный расчёт"
      - "счёт"
    keyword_mode: "any"
    regex_patterns:
      - "(?i)оплат(а|ы).*поэтапн"
      - "(?i)оплат(а|ы).*после.*подписани.*акт"
      - "(?i)аванс.*\\d"
  llm:
    prompt_template: |
      [КОНТЕКСТ]
      Ты — юрист, анализирующий договор ПИР.
      Проверяется только один вопрос: предусмотрены ли аванс и поэтапная оплата,
      а также привязана ли оплата к актам и каков триггер окончательного расчёта.

      Важно:
      — Анализируй только положения об оплате, авансе, этапах, актах и окончательном расчёте.
      — Не оценивай риск и не смешивай цену договора с порядком оплаты.
      — Если условие не установлено прямо, не домысливай его.

      [ЗАДАЧА]
      1. Установить, предусмотрен ли аванс.
      2. Установить, предусмотрена ли поэтапная оплата.
      3. Установить, привязана ли оплата к подписанию актов.
      4. Определить триггер окончательного расчёта.
      5. Установить, есть ли ссылка на график или приложение с порядком оплаты.

      [ПРАВИЛА]
      1. advance_payment_present = "yes" — если аванс/предоплата предусмотрены;
         "no" — если прямо указано отсутствие аванса или оплата только по факту;
         "not_found" — если тема аванса не раскрыта.
      2. stage_payment_present = "yes" — если платежи делятся по этапам;
         "no" — если этапной оплаты нет; "not_found" — если тема не раскрыта.
      3. payment_linked_to_acts = "yes" — если оплата прямо ставится
         в зависимость от подписания акта; "no" — если оплата явно не связана с актами;
         "unclear" — если связь неясна; "not_found" — тема не раскрыта.
      4. final_payment_trigger = "after_final_act" — окончательный расчёт
         после итогового акта; "after_stage_act" — после актов этапов;
         "after_invoice" — после счёта/счёта-фактуры без акта;
         "not_specified" — окончательный расчёт упомянут без ясного триггера;
         "not_found" — тема не раскрыта.
      5. payment_schedule_reference — ссылка на приложение, график, календарный план
         или иной документ о порядке оплаты; если ссылки нет — "not_found".
      6. Не путай аванс с обеспечительным платежом или задатком.
      7. Не извлекай сроки оплаты как сроки выполнения работ.

      [ПРИМЕРЫ (FEW-SHOT)]
      Пример 1 — поэтапная оплата урегулирована:
      Текст: «Заказчик выплачивает аванс в размере 30% цены договора.
      Оплата оставшейся части производится поэтапно после подписания актов сдачи-приёмки
      по каждому этапу. Окончательный расчёт осуществляется после подписания итогового акта.
      Порядок оплаты установлен в Приложении № 3.»

      Ответ:
      {
        "advance_payment_present": "yes",
        "stage_payment_present": "yes",
        "payment_linked_to_acts": "yes",
        "final_payment_trigger": "after_final_act",
        "payment_schedule_reference": "Приложение № 3",
        "evidence": [
          "Заказчик выплачивает аванс в размере 30% цены договора.",
          "Оплата оставшейся части производится поэтапно после подписания актов сдачи-приёмки по каждому этапу.",
          "Окончательный расчёт осуществляется после подписания итогового акта.",
          "Порядок оплаты установлен в Приложении № 3."
        ]
      }

      Пример 2 — оплата без явной этапности:
      Текст: «Оплата производится на основании выставленного счёта в течение 10 банковских дней.»

      Ответ:
      {
        "advance_payment_present": "not_found",
        "stage_payment_present": "no",
        "payment_linked_to_acts": "no",
        "final_payment_trigger": "after_invoice",
        "payment_schedule_reference": "not_found",
        "evidence": [
          "Оплата производится на основании выставленного счёта в течение 10 банковских дней."
        ]
      }

      [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
      1. Разграничены ли аванс, этапность и окончательный расчёт?
      2. Проверена ли именно привязка к акту, а не просто к сдаче работ?
      3. Не перепутан ли счёт с актом?
      4. Есть ли ссылка на отдельное приложение об оплате?
      5. Все ли значения enum соответствуют schema?

      [ФОРМАТ ОТВЕТА]
      Верни строго JSON:
      {
        "advance_payment_present": "<yes / no / not_found>",
        "stage_payment_present": "<yes / no / not_found>",
        "payment_linked_to_acts": "<yes / no / unclear / not_found>",
        "final_payment_trigger": "<after_final_act / after_stage_act / after_invoice / not_specified / not_found>",
        "payment_schedule_reference": "<ссылка на приложение или not_found>",
        "evidence": ["<цитата 1>", "<цитата 2>"]
      }
    prompt_file: null
    context_k: 6
    temperature: 0.0
    max_tokens: 520
  retrieval:
    corpus_scope: "document"
    context_k: 6
    max_chunks: 8
    retrieval_profile: "payment_terms_check"
    boost_keywords:
      - "аванс"
      - "поэтапная оплата"
      - "после подписания акта"
      - "окончательный расчёт"
      - "порядок оплаты"
    negative_keywords:
      - "цена договора"
      - "неустойка"
      - "экспертиза"
      - "форс-мажор"
    rerank: true
    filters: {}
  enrichment_hints:
    preferred_segment_types:
      - "clause"
      - "article"
      - "table"
    excluded_segment_types:
      - "signature_block"
    preferred_clause_functions:
      - "obligations"
      - "procedures"
  evidence:
    required: true
    min_snippet_length: 40
    max_snippet_length: 700
  extraction:
    enabled: true
    mode: "hybrid"
    store_payload: true
    llm_max_tokens: 700

    compact_output: false

    llm_prompt_extraction: |
      <role>
      Ты — юрист, извлекающий сведения о порядке оплаты в договоре ПИР.
      Не оценивай риски. Только заполняй поля строго по тексту.
      </role>

      <context>
      {context}
      </context>

      <task>
      Заполни строго следующие поля:

      advance_payment_present — предусмотрен ли аванс
        (allowed: yes / no / not_found).

      stage_payment_present — предусмотрена ли поэтапная оплата
        (allowed: yes / no / not_found).

      payment_linked_to_acts — привязана ли оплата к подписанию актов
        (allowed: yes / no / unclear / not_found).

      final_payment_trigger — триггер окончательного расчёта
        (allowed: after_final_act / after_stage_act / after_invoice / not_specified / not_found).

      payment_schedule_reference — ссылка на приложение, график или иной документ
        о порядке оплаты
        (текстовое значение или not_found).

      Если данные отсутствуют: используй "not_found"; если тема раскрыта,
      но конкретный признак прямо не установлен, используй "no", "unclear"
      или "not_specified" по смыслу поля.
      </task>

      <rules>
      1. advance_payment_present: "yes" — есть аванс/предоплата; "no" — прямо указано,
         что аванса нет или оплата только по факту; "not_found" — тема не раскрыта.
      2. stage_payment_present: "yes" — оплата делится по этапам; "no" — этапности нет;
         "not_found" — тема не раскрыта.
      3. payment_linked_to_acts: "yes" — оплата после акта; "no" — оплата явно без акта;
         "unclear" — связь неясна; "not_found" — тема не раскрыта.
      4. final_payment_trigger: "after_final_act" — после итогового акта;
         "after_stage_act" — после актов этапов; "after_invoice" — после счёта;
         "not_specified" — окончательный расчёт есть, но триггер неясен;
         "not_found" — тема не раскрыта.
      5. payment_schedule_reference извлекай кратко, например "Приложение № 3".
      6. Не добавляй ключи, не входящие в список полей.
      7. Верни только JSON.
      </rules>
    fields:
      - name: "advance_payment_present"
        type: "string"
        label: "Аванс"
        presentation: "badge"
        display_in_grid: true
        display_priority: 1
        allowed_values:
          - "yes"
          - "no"
          - "not_found"
        description: "Предусмотрен ли аванс по договору."
        required: true
      - name: "stage_payment_present"
        type: "string"
        label: "Поэтапная оплата"
        presentation: "badge"
        display_in_grid: true
        display_priority: 2
        allowed_values:
          - "yes"
          - "no"
          - "not_found"
        description: "Предусмотрена ли поэтапная оплата."
        required: false
      - name: "payment_linked_to_acts"
        type: "string"
        label: "Оплата после актов"
        presentation: "badge"
        display_in_grid: true
        display_priority: 3
        allowed_values:
          - "yes"
          - "no"
          - "unclear"
          - "not_found"
        description: "Привязана ли оплата к подписанию актов."
        required: false
      - name: "final_payment_trigger"
        type: "string"
        label: "Триггер окончательного расчёта"
        presentation: "badge"
        display_in_grid: false
        display_priority: 4
        allowed_values:
          - "after_final_act"
          - "after_stage_act"
          - "after_invoice"
          - "not_specified"
          - "not_found"
        description: "Триггер окончательного расчёта."
        required: false
      - name: "payment_schedule_reference"
        type: "string"
        label: "Ссылка на порядок оплаты"
        presentation: "text"
        display_in_grid: false
        display_priority: 5
        description: "Ссылка на приложение или график, устанавливающий порядок оплаты."
        max_value_chars: 120
        required: false

# ──────────────────────────────────────────────────────────────────────────
# CHECK 9: Сроки выполнения и этапы
# ──────────────────────────────────────────────────────────────────────────
- id: performance_deadlines_milestones
  name: "Сроки выполнения и этапы (ст. 708, 760 ГК РФ)"
  description: "Проверяет наличие сроков начала и окончания, календарного плана, ключевых этапов"
  legal_base: "ст. 708, 760 ГК РФ"
  triggers: ~
  ui_mode: "field_extraction"
  severity: "critical"
  origin: "DOCUMENT_TYPE"
  detector_type: "hybrid"
  rules:
    keywords:
      - "срок выполнения"
      - "календарный план"
      - "график выполнения"
      - "дата начала"
      - "дата окончания"
      - "этап"
      - "промежуточный срок"
      - "не позднее"
    keyword_mode: "any"
    regex_patterns:
      - "(?i)(календарн|график).*?(план|работ)"
      - "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"
      - "(?i)(не\\s+позднее|в\\s+течение)\\s+\\d+"
  llm:
    prompt_template: |
      [КОНТЕКСТ]
      Ты — юрист, анализирующий договор ПИР.
      Проверяется только один вопрос: определены ли сроки начала и окончания работ,
      предусмотрен ли календарный план и есть ли промежуточные этапы.

      Важно:
      — Анализируй только положения о сроках, этапах, графиках и календарных планах.
      — Не оценивай риск и не смешивай сроки работ со сроками оплаты или рассмотрения замечаний.
      — Если срок задан событием, извлекай его как он указан в тексте.

      [ЗАДАЧА]
      1. Извлечь срок начала работ.
      2. Извлечь срок окончания работ.
      3. Установить, есть ли календарный план или график.
      4. Установить, есть ли промежуточные этапы.
      5. Определить характер определённости сроков.

      [ПРАВИЛА]
      1. start_deadline — дата, период или событие начала работ; если не указано — "not_found".
      2. end_deadline — дата, период или событие окончания работ; если не указано — "not_found".
      3. milestone_plan_present = "yes" — календарный план/график прямо включён в договор;
         "referenced" — есть ссылка на приложение или отдельный документ;
         "no" — прямо видно отсутствие этапного плана; "not_found" — тема не раскрыта.
      4. intermediate_milestones_present = "yes" — есть промежуточные этапы/сроки;
         "no" — есть общий срок без этапов; "not_found" — тема не раскрыта.
      5. deadline_determinacy = "specific_dates" — конкретные даты;
         "event_based" — сроки завязаны на события;
         "mixed" — есть и даты, и события;
         "vague" — формулировки размыты;
         "not_found" — сроки не установлены.
      6. Не путай календарный план выполнения работ с графиком оплаты.
      7. Не относись к сроку передачи исходных данных как к сроку выполнения работ.

      [ПРИМЕРЫ (FEW-SHOT)]
      Пример 1 — сроки и этапы определены:
      Текст: «Работы начинаются 01.03.2025 и должны быть завершены не позднее 30.06.2025.
      Календарный план выполнения работ приведён в Приложении № 2.
      Работы выполняются в 3 этапа.»

      Ответ:
      {
        "start_deadline": "01.03.2025",
        "end_deadline": "30.06.2025",
        "milestone_plan_present": "referenced",
        "intermediate_milestones_present": "yes",
        "deadline_determinacy": "specific_dates",
        "evidence": [
          "Работы начинаются 01.03.2025 и должны быть завершены не позднее 30.06.2025.",
          "Календарный план выполнения работ приведён в Приложении № 2.",
          "Работы выполняются в 3 этапа."
        ]
      }

      Пример 2 — срок задан событием:
      Текст: «Подрядчик приступает к работам в течение 3 рабочих дней с даты получения исходных данных.
      Срок выполнения работ составляет 60 календарных дней.»

      Ответ:
      {
        "start_deadline": "в течение 3 рабочих дней с даты получения исходных данных",
        "end_deadline": "60 календарных дней",
        "milestone_plan_present": "not_found",
        "intermediate_milestones_present": "no",
        "deadline_determinacy": "event_based",
        "evidence": [
          "Подрядчик приступает к работам в течение 3 рабочих дней с даты получения исходных данных.",
          "Срок выполнения работ составляет 60 календарных дней."
        ]
      }

      [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
      1. Извлечены ли именно сроки выполнения работ, а не сроки оплаты?
      2. Разграничены ли календарный план и график оплаты?
      3. Установлены ли промежуточные этапы отдельно от общего срока?
      4. Корректно ли определён тип определённости сроков?
      5. Все ли ключи JSON совпадают с полями schema?

      [ФОРМАТ ОТВЕТА]
      Верни строго JSON:
      {
        "start_deadline": "<текст или not_found>",
        "end_deadline": "<текст или not_found>",
        "milestone_plan_present": "<yes / referenced / no / not_found>",
        "intermediate_milestones_present": "<yes / no / not_found>",
        "deadline_determinacy": "<specific_dates / event_based / mixed / vague / not_found>",
        "evidence": ["<цитата 1>", "<цитата 2>"]
      }
    prompt_file: null
    context_k: 6
    temperature: 0.0
    max_tokens: 560
  retrieval:
    corpus_scope: "document"
    context_k: 6
    max_chunks: 8
    retrieval_profile: "completion_deadline_check"
    boost_keywords:
      - "срок выполнения"
      - "календарный план"
      - "график выполнения"
      - "этап"
      - "не позднее"
    negative_keywords:
      - "оплата"
      - "аванс"
      - "претензия"
