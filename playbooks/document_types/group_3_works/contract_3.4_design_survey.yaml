      - pattern: (?i)субподрядчик\s+по\s+раздел[уу]
        weight: 0.5
        distinctiveness: medium
        context: any
        description: Субподряд по отдельным проектным разделам
      low:
      - pattern: (?i)\bпроект\b
        weight: 0.25
        distinctiveness: low
        context: any
        description: Очень общий термин, встречается в множестве типов документов
      - pattern: (?i)проектн[ыо]й
        weight: 0.25
        distinctiveness: low
        context: any
        description: Общее прилагательное без достаточной типовой силы
      - pattern: (?i)объект\s+строительств[аа]
        weight: 0.25
        distinctiveness: low
        context: any
        description: Объект строительства — общий термин для смежных типов
      - pattern: (?i)план\s+этаж[аа]
        weight: 0.25
        distinctiveness: low
        context: any
        description: План этажа как возможный элемент документации
      - pattern: (?i)\bфасад\b
        weight: 0.25
        distinctiveness: low
        context: any
        description: Фасадные решения как часть проектных материалов
      - pattern: (?i)конструктивн[ыо]е\s+решени[яя]
        weight: 0.3
        distinctiveness: low
        context: any
        description: Конструктивные решения в составе проектной документации
      - pattern: (?i)инженерн[ыо]е\s+сет[ии]
        weight: 0.25
        distinctiveness: low
        context: any
        description: Инженерные сети как объект проектирования
      - pattern: (?i)архитектурн[ыо]е\s+решени[яя]
        weight: 0.3
        distinctiveness: low
        context: any
        description: Архитектурные решения как раздел проектной документации
    exclusions:
    - pattern: (?i)строительно-?монтажн[ыо]е\s+работ[ыа]
      severity: hard
      weight: -1.0
      description: СМР указывают на строительный подряд, а не на ПИР
    - pattern: (?i)научно-исследовательск[иие]+\s+работ[ыа]
      severity: hard
      weight: -1.0
      description: Научно-исследовательские работы относятся к НИОКР, а не к ПИР
    - pattern: (?i)\bНИОКР\b
      severity: hard
      weight: -1.0
      description: НИОКР — отдельный договорный тип с иным результатом работ
    - pattern: (?i)разработк[аи]\s+программн[оа]го\s+обеспечени[яя]
      severity: hard
      weight: -1.0
      description: Разработка ПО — IT/интеллектуальные работы, не проектирование в смысле ГрК
    - pattern: (?i)дизайн-?проект\s+интерьер[аа]
      severity: soft
      weight: -0.35
      description: Интерьерный дизайн-проект — соседний, но не типовой строительный ПИР
    - pattern: (?i)ландшафтн[ыо]й\s+дизайн
      severity: soft
      weight: -0.35
      description: Ландшафтный дизайн не всегда образует договор ПИР по ГрК РФ
    - pattern: (?i)технологическ[оа]е\s+проектировани[ея]\s+процесс[оо]в
      severity: soft
      weight: -0.3
      description: Технологическое проектирование процессов может относиться к industrial engineering, а не к строительному ПИР
    - pattern: (?i)дизайн\s+мебел[ии]
      severity: soft
      weight: -0.35
      description: Дизайн мебели — предмет бытовых/дизайнерских услуг, не ПИР
    - pattern: (?i)веб-?дизайн
      severity: soft
      weight: -0.4
      description: Веб-дизайн относится к digital-услугам и не связан с проектной документацией для строительства
