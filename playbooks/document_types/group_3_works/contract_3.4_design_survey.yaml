  - id: performance_deadlines_milestones
    name: "Сроки выполнения и этапы (ст. 708, 760 ГК РФ)"
    description: >
      Фактографическая проверка сроков выполнения работ по договору на выполнение
      проектных и изыскательских работ (ПИР) в соответствии со ст. 708 и ст. 760 ГК РФ.
      Сроки выполнения работ являются существенным условием любого договора подряда,
      включая ПИР. Проверка выявляет пять критических аспектов: (1) срок начала работ —
      конкретная дата или привязка к событию (например, «в течение 3 рабочих дней с даты
      получения исходных данных» или «с даты подписания договора»); (2) срок окончания
      работ — конечная дата или период выполнения; (3) наличие календарного плана или
      графика выполнения работ — документ, детализирующий этапы и сроки (часто оформляется
      как приложение к договору); (4) наличие промежуточных этапов — разделение работ на
      стадии (стадия «П», стадия «Р») или виды изысканий с отдельными сроками сдачи;
      (5) характер определённости сроков — конкретные календарные даты (specific_dates),
      привязка к событию (event_based), смешанный вариант (mixed) или неопределённая
      формулировка (vague). Для договоров ПИР характерна специфика: сроки часто привязаны
      к событиям (получение исходных данных, прохождение экспертизы, согласование с заказчиком),
      а не к конкретным датам, что создаёт риски споров о моменте начала течения срока.
      Отсутствие или неопределённость сроков — риск признания договора незаключённым в части
      существенного условия, а также источник споров о просрочке и неустойке.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "срок выполнения"
        - "календарный план"
        - "график выполнения"
        - "дата начала"
        - "дата окончания"
        - "этап"
        - "промежуточный срок"
        - "не позднее"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(календарн|график).*?(план|работ)"
        - "{{ date_pattern }}"
        - "(?i)(не\\s+позднее|в\\s+течение)\\s+\\d+"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор на выполнение проектных и изыскательских работ (ПИР)
        (§ 4 Главы 37 ГК РФ, ст. 708, 760).
        Проверяется только один вопрос: сроки начала и окончания работ,
        календарный план и промежуточные этапы.
        Нормативный ориентир:
        - ст. 708 ГК РФ (сроки в подряде)
        - ст. 760 ГК РФ (сроки в договоре на выполнение проектных и изыскательских работ)
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не выдумывай даты, не вычисляй сроки самостоятельно.
        - Извлекай сроки дословно из текста договора.
        - Не путай календарный план работ с графиком оплаты.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Срок начала работ.
        2. Срок окончания работ.
        3. Наличие календарного плана или графика.
        4. Наличие промежуточных этапов.
        5. Характер определённости сроков.

        [ПРАВИЛА]
        1. Используй только текст документа. Не выдумывай даты, не вычисляй сроки самостоятельно — извлекай строго из переданного фрагмента.
        2. Для enum-полей (milestone_plan_present, intermediate_milestones_present, deadline_determinacy) при отсутствии данных используй значение "not_defined".
        3. Для текстовых полей (start_deadline, end_deadline) при отсутствии данных пиши "Данные не определены".
        4. Для полей *_display используй человеко-читаемые значения согласно маппингу.
        5. Различай:
           - "specific_dates" — конкретные календарные даты (например, "01.03.2025 — 30.06.2025")
           - "event_based" — привязка к событию (например, "в течение 3 рабочих дней с даты получения исходных данных")
           - "mixed" — смешанный вариант (начало — конкретная дата, окончание — привязка к событию, или наоборот)
           - "vague" — неопределённая формулировка (например, "в разумный срок", "по согласованию сторон")
           - "not_defined" — сроки вообще не упомянуты в договоре
           - "yes" — календарный план/этапы прямо указаны
           - "referenced" — календарный план упомянут, но оформлен как приложение/документ
           - "no" — календарный план/этапы прямо исключены
        6. Не путай:
           - Календарный план работ (этот check) с графиком оплаты (Check 8)
           - Сроки выполнения работ с сроком действия договора
           - Промежуточные этапы с этапами оплаты
        7. Если сроки определяются по календарному плану/графику (например, "Сроки выполнения работ установлены в Календарном плане (Приложение № 2)") — это валидный исход, укажи ссылку в start_deadline/end_deadline.
        8. В evidence — только точные цитаты из документа с указанием пункта.
        9. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.без комментариев и markdown-обёртки.

