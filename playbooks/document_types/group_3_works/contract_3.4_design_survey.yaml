- id: technical_specification_completeness
  name: 'ТЗ на проектирование: наличие и полнота (ст. 759 ГК РФ)'
  description: 'Проверяет наличие ТЗ как приложения, его содержание (параметры объекта,

    нормативы, требования к результату). Без детального ТЗ границы требований

    не определены — спор о качестве и объёме неизбежен.

    '
  triggers: null
  ui_mode: field_extraction
  severity: critical
  severity_if_pass: pass
  severity_if_fail: critical
  severity_if_unclear: critical
  origin: DOCUMENT_TYPE
  detector_type: hybrid
  rules:
    keywords:
    - техническое задание
    - ТЗ на проектирование
    - задание на проектирование
    - приложение
    - параметры объекта
    - требования к проекту
    keyword_mode: any
    regex_patterns:
    - (?i)техническ(ое|ого)\s+задани
    - (?i)задани(е|я)\s+на\s+проектирован
  llm:
    prompt_template: "[КОНТЕКСТ]\nТы — юрист, анализирующий договор ПИР.\nПроверяется только один вопрос: наличие технического задания на проектирование\nи достаточность его содержания для определения требований к результату работ\nпо ст. 759 ГК РФ.\n\nВажно:\n— Анализируй только положения о ТЗ, приложениях и составе требований к проектированию.\n— Не оценивай риск и не делай правовых выводов. Только извлекай факты.\n— Если ТЗ отсутствует или не раскрыто в тексте, не додумывай его содержание.\n\n[ЗАДАЧА]\n1. Установить, присутствует ли ТЗ в договоре или приложениях.\n2. Установить номер приложения с ТЗ.\n3. Проверить, содержит ли ТЗ параметры объекта.\n4. Проверить, содержит ли ТЗ ссылки на нормативы.\n5. Проверить, содержит ли ТЗ требования к результату работ.\n\n[ПРАВИЛА]\n1. tz_present = \"yes\" — только если ТЗ прямо указано как приложение\n   или его содержание явно доступно в тексте договора.\n2. tz_present = \"referenced_but_missing\" — если ТЗ упомянуто,\n   но из доступного текста\
      \ видно только ссылка без содержания приложения.\n3. tz_present = \"not_found\" — если ТЗ или задание на проектирование не упоминается.\n4. tz_contains_object_parameters = \"yes\" — если есть характеристики объекта:\n   назначение, площадь, мощность, этажность, технико-экономические параметры и т.п.;\n   \"no\" — если ТЗ есть, но таких параметров нет; \"unclear\" — если ТЗ недоступно\n   или содержания недостаточно для вывода.\n5. tz_contains_norms_references = \"yes\" — если указаны СП, ГОСТ, СНиП,\n   техрегламенты, обязательные нормативы; \"no\" — если ТЗ есть, но ссылок нет;\n   \"unclear\" — если ТЗ недоступно или содержание не позволяет сделать вывод.\n6. tz_contains_result_requirements = \"yes\" — если установлены требования\n   к составу, комплектности, форме, объёму результата; \"no\" — если ТЗ есть,\n   но таких требований нет; \"unclear\" — если ТЗ недоступно.\n7. Если номер приложения не указан, tz_attachment_number = \"not_found\".\n\n[ПРИМЕРЫ (FEW-SHOT)]\nПример 1 — ТЗ\
      \ приложено и его содержание частично раскрыто:\nТекст: «Подрядчик выполняет работы в соответствии с Техническим заданием\nна проектирование (Приложение № 2). ТЗ содержит основные технико-экономические\nпоказатели объекта, требования к составу проектной документации и перечень\nприменимых нормативных документов.»\n\nОтвет:\n{\n  \"tz_present\": \"yes\",\n  \"tz_attachment_number\": \"Приложение № 2\",\n  \"tz_contains_object_parameters\": \"yes\",\n  \"tz_contains_norms_references\": \"yes\",\n  \"tz_contains_result_requirements\": \"yes\",\n  \"evidence\": [\n    \"Подрядчик выполняет работы в соответствии с Техническим заданием на проектирование (Приложение № 2).\",\n    \"ТЗ содержит основные технико-экономические показатели объекта, требования к составу проектной документации и перечень применимых нормативных документов.\"\n  ]\n}\n\nПример 2 — ТЗ упомянуто, но содержание недоступно:\nТекст: «Работы выполняются по заданию на проектирование, являющемуся приложением к договору.»\n\
      \nОтвет:\n{\n  \"tz_present\": \"referenced_but_missing\",\n  \"tz_attachment_number\": \"not_found\",\n  \"tz_contains_object_parameters\": \"unclear\",\n  \"tz_contains_norms_references\": \"unclear\",\n  \"tz_contains_result_requirements\": \"unclear\",\n  \"evidence\": [\n    \"Работы выполняются по заданию на проектирование, являющемуся приложением к договору.\"\n  ]\n}\n\n[ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]\n1. Проверено ли, что ТЗ реально присутствует, а не только упомянуто?\n2. Не перепутано ли наличие ТЗ с доступностью его содержания?\n3. Для каждого поля yes/no/unclear есть ли основание в тексте?\n4. Не используется ли \"no\" там, где корректнее \"unclear\" из-за отсутствия приложения?\n5. Все ли ключи JSON совпадают с output schema?\n\n[ФОРМАТ ОТВЕТА]\nВерни строго JSON:\n{\n  \"tz_present\": \"<yes / referenced_but_missing / not_found>\",\n  \"tz_attachment_number\": \"<номер приложения или not_found>\",\n  \"tz_contains_object_parameters\": \"<yes / no / unclear>\",\n  \"\
      tz_contains_norms_references\": \"<yes / no / unclear>\",\n  \"tz_contains_result_requirements\": \"<yes / no / unclear>\",\n  \"evidence\": [\"<цитата 1>\", \"<цитата 2>\"]\n}\n"
    prompt_file: null
    context_k: 6
    temperature: 0.0
    max_tokens: 520
  retrieval:
    corpus_scope: document
    context_k: 6
    max_chunks: 8
    retrieval_profile: technical_documentation_check
    boost_keywords:
    - техническое задание
    - задание на проектирование
    - параметры объекта
    - требования к проекту
    - нормативы
    - приложение
    negative_keywords:
    - неустойка
    - форс-мажор
    - подсудность
    - расторжение
    rerank: true
    filters: {}
  enrichment_hints:
    preferred_segment_types:
    - clause
    - article
    - appendix_reference
    excluded_segment_types:
    - signature_block
    preferred_clause_functions:
    - definitions
    - obligations
    confidence_bonus_on_match: 0.1
    confidence_penalty_on_excluded_segment: 0.12
  evidence:
    required: true
    min_snippet_length: 50
    max_snippet_length: 600
  extraction:
    enabled: true
    mode: hybrid
    store_payload: true
    llm_max_tokens: 700
    compact_output: false
    llm_prompt_extraction: "<role>\nТы — юрист, извлекающий сведения о наличии и полноте технического задания\nна проектирование в договоре ПИР. Не оценивай риски. Только заполняй поля.\n</role>\n\n<context>\n{context}\n</context>\n\n<task>\nЗаполни строго следующие поля:\n\ntz_present — наличие ТЗ\n  (allowed: yes / referenced_but_missing / not_found).\n  \"yes\" — ТЗ прямо приложено или его содержание доступно в тексте;\n  \"referenced_but_missing\" — ТЗ упомянуто, но содержания нет;\n  \"not_found\" — ТЗ не упоминается.\n\ntz_attachment_number — номер приложения с ТЗ\n  (текстовое значение, например \"Приложение № 2\", или not_found).\n\ntz_contains_object_parameters — содержит ли ТЗ параметры объекта\n  (allowed: yes / no / unclear).\n\ntz_contains_norms_references — содержит ли ТЗ ссылки на нормативы\n  (allowed: yes / no / unclear).\n\ntz_contains_result_requirements — содержит ли ТЗ требования к результату работ\n  (allowed: yes / no / unclear).\n\nЕсли данные отсутствуют: указывай\
      \ \"not_found\" только для tz_present\nи tz_attachment_number; для полей полноты используй \"unclear\",\nесли ТЗ недоступно или вывод невозможен.\n</task>\n\n<rules>\n1. tz_present: \"yes\" — ТЗ приложено или содержание доступно;\n   \"referenced_but_missing\" — только ссылка без содержания;\n   \"not_found\" — ТЗ не упомянуто.\n2. tz_contains_object_parameters: \"yes\" — есть параметры объекта;\n   \"no\" — ТЗ есть, но параметров нет; \"unclear\" — ТЗ недоступно\n   или недостаточно данных.\n3. tz_contains_norms_references: \"yes\" — есть ссылки на нормативы;\n   \"no\" — ТЗ есть, но ссылок нет; \"unclear\" — ТЗ недоступно\n   или недостаточно данных.\n4. tz_contains_result_requirements: \"yes\" — есть требования к составу,\n   комплектности, форме или объёму результата; \"no\" — ТЗ есть,\n   но таких требований нет; \"unclear\" — ТЗ недоступно.\n5. Не добавляй ключи, не входящие в список полей.\n6. Верни только JSON.\n</rules>\n"
    fields:
    - name: tz_present
      type: string
      label: Наличие ТЗ
      presentation: badge
      display_in_grid: true
      display_priority: 1
      allowed_values:
