        сроков при задержке заказчика. Не анализируй форс-мажор, неустойку или иные темы.
        Не путай задержку заказчика с форс-мажором.
        </role>
        <context>
        {context}
        </context>
        <task>
        Заполни строго следующие 10 полей (плюс evidence):
        1. auto_extension_present — предусмотрено ли продление: yes / no / not_defined.
        2. auto_extension_present_display — человеко-читаемое значение: "Да, предусмотрено" / "Нет, не предусмотрено" / "Данные не определены".
        3. extension_trigger — триггер продления: approval_delay / review_delay / mixed / not_specified / not_defined.
        4. extension_trigger_display — человеко-читаемое значение: "Задержка согласования" / "Задержка рассмотрения" / "Смешанный (согласование + рассмотрение)" / "Не указан" / "Данные не определены" / "Не применимо".
        5. extension_mode — механизм продления: automatic / notice_based / by_addendum / not_specified / not_defined.
        6. extension_mode_display — человеко-читаемое значение: "Автоматическое продление" / "По уведомлению Подрядчика" / "По дополнительному соглашению" / "Не указан" / "Данные не определены" / "Не применимо".
        7. extension_duration_rule — правило расчёта: equal_delay / fixed_days / not_specified / not_defined.
        8. extension_duration_rule_display — человеко-читаемое значение: "На период фактической задержки" / "Фиксированное количество дней" / "Не указано" / "Данные не определены" / "Не применимо".
        9. suspension_right — право приостановить работы: yes / no / not_defined.
        10. suspension_right_display — человеко-читаемое значение: "Да, право предусмотрено" / "Нет, право не предусмотрено" / "Данные не определены" / "Не применимо".

        Маппинг enum → display:
        - auto_extension_present: yes → "Да, предусмотрено", no → "Нет, не предусмотрено", not_defined → "Данные не определены"
        - extension_trigger: approval_delay → "Задержка согласования", review_delay → "Задержка рассмотрения", mixed → "Смешанный (согласование + рассмотрение)", not_specified → "Не указан", not_defined → "Данные не определены" или "Не применимо"
        - extension_mode: automatic → "Автоматическое продление", notice_based → "По уведомлению Подрядчика", by_addendum → "По дополнительному соглашению", not_specified → "Не указан", not_defined → "Данные не определены" или "Не применимо"
        - extension_duration_rule: equal_delay → "На период фактической задержки", fixed_days → "Фиксированное количество дней", not_specified → "Не указано", not_defined → "Данные не определены" или "Не применимо"
        - suspension_right: yes → "Да, право предусмотрено", no → "Нет, право не предусмотрено", not_defined → "Данные не определены" или "Не применимо"

        Критическое правило:
        - Если auto_extension_present = "no" (продление прямо исключено в договоре), то все остальные поля (extension_trigger, extension_mode, extension_duration_rule, suspension_right) = "not_defined", а их display-версии = "Не применимо"
        - Если auto_extension_present = "not_defined" (условие вообще не упоминается), то остальные поля = "not_defined", display = "Данные не определены"
        </task>
        <context_rules>
        - Используй только текст договора. Не выдумывай условия продления — извлекай строго из переданного фрагмента.
        - Не опирайся на внешние знания о типовых условиях договоров ПИР.
        - Не путай задержку заказчика с форс-мажором.
        - Не путай продление сроков выполнения работ с пролонгацией срока действия договора.
        - Не путай приостановление работ по ст. 719 ГК РФ с расторжением договора.
        - Верни строго валидный JSON. Все 10 ключей + evidence обязаны присутствовать.
        - Запрещены: null, None, пустые строки "".
        - Убедись, что enum-значения соответствуют их display-версиям согласно маппингу выше.
        - Различай "no" (условие прямо исключено) и "not_defined" (условие вообще не упоминается).
        </context_rules>

        <output_expectations>
        - Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        - Не используй markdown fences.
        - Не добавляй пояснения до или после JSON.
        - Верни все ключи, перечисленные в task, без пропусков.
        - Не используй null, None или пустые строки.
        - Для статусных полей используй только значения из allowed_values или "not_defined".
        - Для текстовых полей при отсутствии данных используй "Данные не определены" / "Не удалось определить" / "Не применимо" — согласно правилам выше.
        </output_expectations>
