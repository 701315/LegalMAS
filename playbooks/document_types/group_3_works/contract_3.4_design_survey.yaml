          Если данные отсутствуют: "not_defined" или "Данные не определены".
          </task>
          <rules>
          - Используй только текст договора.
          - Не путай претензионный порядок с порядком замечаний по приёмке.
          - Верни только JSON.
          </rules>
        fields:
          - name: "pretension_procedure_present"
            type: "string"
            presentation: "signal"
            allowed_values: ["yes", "not_defined"]
            description: "Предусмотрен ли обязательный претензионный порядок."
            required: true
          - name: "pretension_sending_period"
            type: "string"
            presentation: "fact"
            label: "Срок направления претензии"
            description: "Срок направления претензии с момента нарушения."
            required: false
            display_in_grid: false
          - name: "pretension_review_period"
            type: "string"
            presentation: "fact"
            label: "Срок рассмотрения претензии"
            description: "Срок рассмотрения претензии другой стороной."
            required: false
            display_in_grid: true
            display_priority: 1
    store_payload: true
# ──────────────────────────────────────────────────────────────────────────
# CHECK 25: Формат и количество экземпляров документации
# ──────────────────────────────────────────────────────────────────────────
  - id: documentation_delivery_format
    name: "Формат и количество экземпляров передаваемой документации"
    description: >
      Фактографическая проверка условий о формате передачи документации
      (бумажный / электронный), количестве экземпляров, форматах файлов
      и физическом носителе.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "экземпляр"
        - "комплект документации"
        - "бумажный носитель"
        - "электронный вид"
        - "формат DWG"
        - "формат PDF"
        - "формат IFC"
        - "электронная версия"
        - "количество копий"
        - "CD"
        - "DVD"
        - "flash-накопитель"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)\\d+\\s*(экземпляр|комплект)"
        - "(?i)(бумажн|электронн)(ый|ом|ой)\\s+(носител|вид|версии|формат)"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор на выполнение проектных и изыскательских работ (ПИР)
        (§ 4 Главы 37 ГК РФ; ПП РФ № 87).
        Проверяется только один вопрос: формат и количество экземпляров
        передаваемой документации.
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Передача на бумажном носителе.
        2. Количество бумажных экземпляров.
        3. Передача в электронном виде.
        4. Формат электронных файлов.
        5. Передача на физическом носителе (CD/DVD/flash).

        [ПРАВИЛА]
        1. Только текст документа.
        2. Если условие не указано — "not_defined".
        3. Не путай формат передачи с порядком приёмки.
        4. В evidence — только текст договора.
        5. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1:
        Фрагмент:
        "Документация передаётся в 4 экземплярах на бумажном носителе
        и в электронном виде на flash-накопителе в форматах DWG и PDF."
        Ответ:
        {
          "paper_delivery": "yes",
          "paper_copies_count": "4",
          "electronic_delivery": "yes",
          "electronic_format": "DWG, PDF",
          "physical_media": "yes",
          "evidence": [
            {
              "clause_ref": "п. 17.1",
              "quote": "Документация передаётся в 4 экземплярах на бумажном носителе и в электронном виде на flash-накопителе в форматах DWG и PDF."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Результаты работ передаются Заказчику."
        Ответ:
        {
          "paper_delivery": "not_defined",
          "paper_copies_count": "Данные не определены",
          "electronic_delivery": "not_defined",
          "electronic_format": "Данные не определены",
          "physical_media": "not_defined",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Разграничены ли бумажная и электронная передача?
        2. Извлечено ли конкретное количество экземпляров?
        3. Извлечены ли конкретные форматы файлов?
        4. Есть ли указание на физический носитель?
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "paper_delivery": "<yes / no / not_found>",
          "paper_copies_count": "<число или 'Данные не определены'>",
          "electronic_delivery": "<yes / no / not_found>",
          "electronic_format": "<текст или 'Данные не определены'>",
          "physical_media": "<yes / no / not_found>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 440
      retrieval:
        retrieval_profile: "technical_documentation_check"
        corpus_scope: "primary_segment"
        levels:
          - "legal_unit"
          - "section"
        required_kind: "legal_unit"
        retrieval_query: "экземпляр бумажный носитель электронный вид DWG PDF формат количество копий"
        preferred_unit_types:
          - obligation
          - general_provision
        excluded_unit_types:
          - definition
          - structural_anchor
          - technical_fragment
        preferred_clause_functions:
          - procedures
        negative_keywords:
          - "экспертиза"
          - "форс-мажор"
          - "подсудность"
          - "неустойка"
          - "означает"
          - "в целях настоящего"
        position_bias:
          preferred_range: [0.30, 0.80]
          boost: 0.12
          scope: segment
        context_k: 5
        max_chunks: 6
        rerank: true
        enrichment_hints:
          preferred_segment_types:
            - "contract"
            - "amendment"
          excluded_segment_types:
            - "technical_specification"
            - "price_list"
          preferred_clause_functions:
            - "procedures"
          confidence_bonus_on_match: 0.08
          confidence_penalty_on_excluded_segment: 0.10
      evidence:
        required: true
        min_snippet_length: 30
        max_snippet_length: 500
      extraction:
        enabled: true
        mode: "hybrid"
        compact_output: false
        llm_max_tokens: 700
        llm_prompt_extraction: |
          <role>
          Ты — российский юрист. Извлеки из договора ПИР сведения о формате
          передачи документации. Не анализируй приёмку, экспертизу или иные темы.
          </role>
          <context>
          {context}
          </context>
          <task>
          Заполни строго следующие поля:
          1. paper_delivery — бумажная передача (yes / no / not_found).
          2. paper_copies_count — количество бумажных экземпляров.
          3. electronic_delivery — электронная передача (yes / no / not_found).
          4. electronic_format — форматы электронных файлов.
          5. physical_media — физический носитель (yes / no / not_found).
          Если данные отсутствуют: "not_defined" или "Данные не определены".
          </task>
          <rules>
          - Используй только текст договора.
          - Верни только JSON.
          </rules>
        fields:
          - name: "paper_delivery"
            type: "string"
            presentation: "signal"
            allowed_values: ["yes", "no", "not_defined"]
            description: "Предусмотрена ли передача на бумажном носителе."
            required: true
          - name: "paper_copies_count"
            type: "string"
            presentation: "fact"
            label: "Количество экземпляров"
            description: "Количество бумажных экземпляров документации."
            required: false
            display_in_grid: true
            display_priority: 1
          - name: "electronic_delivery"
            type: "string"
            presentation: "signal"
            allowed_values: ["yes", "no", "not_defined"]
            description: "Предусмотрена ли передача в электронном виде."
            required: false
          - name: "electronic_format"
            type: "string"
            presentation: "fact"
            label: "Формат файлов"
            description: "Форматы электронных файлов (DWG, PDF, IFC и т.п.)."
            required: false
            display_in_grid: true
            display_priority: 2
          - name: "physical_media"
            type: "string"
            presentation: "signal"
            allowed_values: ["yes", "no", "not_defined"]
            description: "Предусмотрена ли передача на CD/DVD/flash."
            required: false
    store_payload: true
# ──────────────────────────────────────────────────────────────────────────
# CHECK 26: Страхование профессиональной ответственности
# ──────────────────────────────────────────────────────────────────────────
  - id: insurance_professional_liability
    name: "Страхование профессиональной ответственности проектировщика"
    description: >
      Фактографическая проверка требования о страховании ответственности
      проектировщика: минимальная сумма покрытия, обязанность поддерживать
      страхование и предоставить копию полиса.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "medium"
    severity_if_pass: "pass"
    severity_if_fail: "medium"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "страхование ответственности"
        - "страховой полис"
        - "профессиональная ответственность"
        - "страховое покрытие"
        - "застраховать ответственность"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)страхов(ание|ка).*ответственност"
        - "(?i)профессиональн(ой|ая)\\s+ответственност"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор на выполнение проектных и изыскательских работ (ПИР)
        (§ 4 Главы 37 ГК РФ; ст. 55.5 ГрК РФ).
        Проверяется только один вопрос: страхование профессиональной
        ответственности проектировщика.
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Предусмотрено ли страхование ответственности.
        2. Минимальная сумма покрытия.
        3. Обязанность поддерживать страхование на весь срок.
        4. Обязанность предоставить копию полиса.

        [ПРАВИЛА]
        1. Только текст документа.
        2. Если условие не указано — "not_defined".
        3. Не путай страхование с членством в СРО или лимитом ответственности.
        4. В evidence — только текст договора.
        5. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1:
        Фрагмент:
        "Подрядчик обязан застраховать свою профессиональную ответственность
        на сумму не менее 5 000 000 рублей и поддерживать страхование на весь
        срок действия договора. Копия страхового полиса предоставляется Заказчику
        в течение 5 рабочих дней с даты подписания договора."
        Ответ:
        {
          "insurance_required": "yes",
          "min_coverage_amount": "5 000 000 рублей",
          "maintenance_obligation": "yes",
          "policy_copy_required": "yes",
          "evidence": [
            {
              "clause_ref": "п. 18.1",
              "quote": "Подрядчик обязан застраховать свою профессиональную ответственность на сумму не менее 5 000 000 рублей."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Подрядчик обладает необходимой квалификацией."
        Ответ:
        {
          "insurance_required": "not_defined",
          "min_coverage_amount": "Данные не определены",
          "maintenance_obligation": "not_defined",
          "policy_copy_required": "not_defined",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли именно страхование ответственности, а не СРО?
        2. Указана ли минимальная сумма покрытия?
        3. Есть ли обязанность поддерживать страхование?
        4. Есть ли обязанность предоставить полис?
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "insurance_required": "<yes / no / not_found>",
          "min_coverage_amount": "<текст или 'Данные не определены'>",
          "maintenance_obligation": "<yes / no / not_found>",
          "policy_copy_required": "<yes / no / not_found>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 4
      temperature: 0.0
      max_tokens: 420
      retrieval:
        retrieval_profile: "insurance_check"
        corpus_scope: "primary_segment"
        levels:
          - "legal_unit"
          - "section"
        required_kind: "legal_unit"
        retrieval_query: "страхование ответственности страховой полис профессиональная ответственность страховое покрытие"
        preferred_unit_types:
          - obligation
          - general_provision
        excluded_unit_types:
          - definition
          - structural_anchor
          - technical_fragment
        preferred_clause_functions:
          - obligations
        negative_keywords:
          - "СРО"
          - "экспертиза"
          - "форс-мажор"
          - "подсудность"
          - "означает"
          - "в целях настоящего"
        position_bias:
          preferred_range: [0.40, 0.90]
          boost: 0.12
          scope: segment
        context_k: 4
        max_chunks: 6
        rerank: true
        enrichment_hints:
          preferred_segment_types:
            - "contract"
            - "amendment"
          excluded_segment_types:
            - "technical_specification"
            - "price_list"
          preferred_clause_functions:
            - "obligations"
          confidence_bonus_on_match: 0.08
          confidence_penalty_on_excluded_segment: 0.10
      evidence:
        required: true
        min_snippet_length: 30
        max_snippet_length: 500
      extraction:
        enabled: true
        mode: "hybrid"
        compact_output: false
        llm_max_tokens: 550
        llm_prompt_extraction: |
          <role>
          Ты — российский юрист. Извлеки из договора ПИР сведения о страховании
          профессиональной ответственности. Не анализируй СРО, экспертизу или иные темы.
          </role>
          <context>
          {context}
          </context>
          <task>
          Заполни строго следующие поля:
          1. insurance_required — предусмотрено ли страхование (yes / no / not_found).
          2. min_coverage_amount — минимальная сумма покрытия.
          3. maintenance_obligation — обязанность поддерживать страхование (yes / no / not_found).
          4. policy_copy_required — обязанность предоставить полис (yes / no / not_found).
          Если данные отсутствуют: "not_defined" или "Данные не определены".
          </task>
          <rules>
          - Используй только текст договора.
          - Не путай страхование с членством в СРО.
          - Верни только JSON.
          </rules>
        fields:
          - name: "insurance_required"
            type: "string"
            presentation: "signal"
            allowed_values: ["yes", "no", "not_defined"]
            description: "Предусмотрено ли страхование проф. ответственности."
            required: true
          - name: "min_coverage_amount"
            type: "string"
            presentation: "fact"
            label: "Минимальное покрытие"
            description: "Минимальная сумма страхового покрытия."
            required: false
            display_in_grid: true
            display_priority: 1
          - name: "maintenance_obligation"
            type: "string"
            presentation: "signal"
            allowed_values: ["yes", "no", "not_defined"]
            description: "Обязан ли подрядчик поддерживать страхование."
            required: false
          - name: "policy_copy_required"
            type: "string"
            presentation: "signal"
            allowed_values: ["yes", "no", "not_defined"]
            description: "Обязан ли подрядчик предоставить копию полиса."
            required: false
    store_payload: true
# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 5: DD_REQUEST_TEMPLATES
#  Читается: DDRequestTemplateLoader
# ════════════════════════════════════════════════════════════════════════════
dd_request_templates:
  parties_identification:
    text: >
      Просим подтвердить полные реквизиты сторон по {doc_names}: наименование/ФИО,
      ИНН, ОГРН, адрес, документы уполномоченных лиц, подтверждение полномочий.
    addressee: "Обе стороны"
  pir_subject_extraction:
    text: >
      Просим подтвердить по {doc_names}: (а) полное наименование объекта проектирования;
      (б) стадию проектирования (П/Р/П+Р); (в) перечень разделов ПД;
      (г) ссылку на ТЗ с подтверждением его утверждения заказчиком.
    addressee: "Обе стороны"
  technical_specification_completeness:
    text: >
      В {doc_names} необходимо подтвердить наличие и полноту ТЗ на проектирование
      (ст. 759 ГК РФ): (а) приложено ли ТЗ к договору; (б) содержит ли оно параметры
      объекта, ссылки на нормативы, требования к результату; (в) утверждено ли заказчиком.
    addressee: "Заказчик"
  initial_data_provision_check:
    text: >
      Просим предоставить по {doc_names}: (а) полный перечень исходных данных
      с указанием ответственного за предоставление; (б) сроки предоставления
      каждого документа; (в) последствия задержки; (г) оговорку об ответственности
      заказчика за достоверность.
    addressee: "Заказчик"
  expertise_procedure_and_payment_link:
    text: >
      Просим подтвердить по {doc_names}: (а) вид экспертизы (государственная/негосударственная);
      (б) кто подаёт документы на экспертизу; (в) кто оплачивает экспертизу;
      (г) привязана ли окончательная оплата к положительному заключению;
      (д) последствия отрицательного заключения.
    addressee: "Обе стороны"
  external_approvals_coordination:
    text: >
      Просим уточнить в {doc_names}: (а) кто обязан получить технические условия
      на подключение к сетям; (б) кто несёт расходы на ТУ и согласования;
      (в) перечень органов/организаций для согласования; (г) последствия задержки
      согласований для сроков проектирования.
    addressee: "Обе стороны"
  price_and_calculation_basis:
    text: >
      Просим подтвердить по {doc_names}: (а) цену работ цифрами и прописью;
      (б) вид цены (твёрдая/приблизительная); (в) основание расчёта (СБЦ, % от СМР,
      фиксированная); (г) включает ли цена НДС; (д) порядок изменения цены
      при увеличении объёма.
    addressee: "Обе стороны"
  stage_payment_schedule:
    text: >
      Просим уточнить в {doc_names}: (а) размер авансового платежа; (б) привязку
      промежуточных платежей к подписанию актов этапов; (в) условия окончательного
      расчёта; (г) реквизиты для оплаты.
    addressee: "Обе стороны"
  performance_deadlines_milestones:
    text: >
      Просим предоставить по {doc_names}: (а) календарный план-график работ с этапами;
      (б) ключевые даты (начало, эскиз, экспертиза, сдача РД); (в) привязку сроков
      к предоставлению исходных данных.
    addressee: "Обе стороны"
  auto_deadline_extension:
    text: >
      Просим включить в {doc_names} условие: при задержке согласования заказчиком
      сроки выполнения автоматически продлеваются на период задержки; время рассмотрения
      заказчиком не включается в сроки подрядчика.
    addressee: "Юридический советник подрядчика"
  stagewise_approval_procedure:
    text: >
      Просим согласовать в {doc_names}: перечень этапов, подлежащих согласованию;
      сроки рассмотрения каждого этапа; право заказчика на замечания; порядок учёта
      или отклонения замечаний.
    addressee: "Обе стороны"
  acceptance_procedure:
    text: >
      Просим уточнить в {doc_names}: порядок сдачи-приёмки, форму акта, срок рассмотрения
      документации заказчиком, основания для мотивированного отказа, комплектность
      передаваемой документации.
    addressee: "Обе стороны"
  termination_and_consequences:
    text: >
      Просим уточнить в {doc_names}: (а) основания для одностороннего отказа каждой
      стороны; (б) порядок оплаты выполненной части; (в) возврат документации
      и исходных данных; (г) неустойки и штрафы; (д) судьба авансовых платежей.
    addressee: "Юридический советник"
  assignment_and_subcontracting:
    text: >
      Просим уточнить в {doc_names}: (а) допускается ли привлечение субподрядчиков;
      (б) требуется ли согласие заказчика; (в) сохраняется ли ответственность
      генерального проектировщика; (г) ограничения на уступку прав.
    addressee: "Юридический советник"
  ip_rights_on_documentation:
    text: >
      Просим уточнить в {doc_names}: (а) кому принадлежат исключительные права на ПД;
      (б) момент перехода прав; (в) вправе ли заказчик повторно использовать проект;
      (г) вправе ли заказчик модифицировать проект; (д) сохраняются ли за автором
      личные неимущественные права.
    addressee: "Юридический советник"
  designer_liability_for_errors:
    text: >
      Просим уточнить в {doc_names}: (а) объём ответственности проектировщика за ошибки
      в ПД; (б) включает ли ответственность расходы на переделку СМР; (в) наличие лимита
      ответственности и его размер; (г) исключены ли косвенные убытки и упущенная выгода.
    addressee: "Юридический советник"
  designer_vs_builder_liability:
    text: >
      Просим включить в {doc_names} чёткое разграничение ответственности: проектировщик
      отвечает за качество документации, но не за её реализацию строителями.
      Авторский надзор — отдельная услуга / договор.
    addressee: "Юридический советник"
  author_supervision_terms:
    text: >
      Просим уточнить в {doc_names}: (а) включён ли авторский надзор в договор
      или осуществляется по отдельному договору; (б) объём и периодичность;
      (в) порядок оплаты; (г) ответственность при отказе от авторского надзора.
    addressee: "Обе стороны"
  quality_warranty:
    text: >
      Просим подтвердить в {doc_names}: гарантию соответствия ПД действующим нормативам
      (СП, ГОСТ, СНиП), ТЗ и исходным данным. Указать перечень применяемых нормативов.
    addressee: "Подрядчик"
  warranty_period_for_documentation:
    text: >
      Просим включить в {doc_names} гарантийный срок на ПД: продолжительность,
      обязанность безвозмездного устранения дефектов, порядок предъявления претензий.
    addressee: "Юридический советник"
  penalty_for_delay:
    text: >
      Просим согласовать в {doc_names}: размер неустойки за просрочку (для обеих сторон),
      предельный размер (cap), порядок исчисления, основания для освобождения.
    addressee: "Юридический советник"
  sro_membership_check:
    text: >
      Просим предоставить по {doc_names}: (а) наименование и номер СРО; (б) реквизиты
      свидетельства/выписки; (в) обязательство поддерживать членство на весь срок
      действия договора.
    addressee: "Подрядчик"
  force_majeure:
    text: >
      Просим уточнить в {doc_names}: перечень обстоятельств форс-мажора, порядок и сроки
      уведомления, последствия (приостановка / расторжение), подтверждающие документы (ТПП).
    addressee: "Юридический советник"
  dispute_resolution_and_pretension:
    text: >
      Просим согласовать в {doc_names}: претензионный порядок (срок), подсудность,
      возможность медиации / третейского разбирательства.
    addressee: "Юридический советник"
  documentation_delivery_format:
    text: >
      Просим уточнить в {doc_names}: (а) количество бумажных экземпляров ПД;
      (б) формат электронной версии (DWG/PDF/IFC); (в) требования к BIM-модели
      (если применимо); (г) носитель/способ передачи электронных файлов.
    addressee: "Заказчик"
  insurance_professional_liability:
    text: >
      Просим подтвердить по {doc_names}: наличие полиса страхования профессиональной
      ответственности проектировщика, страховую сумму, срок действия, соответствие
      требованиям СРО.
    addressee: "Подрядчик"
  _default:
    text: >
      Просим предоставить дополнительную информацию по вопросу «{check_name}»
      применительно к {doc_names}.
    addressee: "Юридический советник"