    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 800
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора ПИР сведения о неустойке
        за просрочку: неустойка подрядчика, ставка, базис расчёта, встречная
        неустойка заказчика, лимит неустойки.
        Не анализируй штраф за расторжение (Check 13), ответственность за ошибки
        в ПД (Check 16), форс-мажор или иные темы.
        Не путай неустойку за просрочку со штрафом за расторжение.
        Не путай неустойку за просрочку с ответственностью за ошибки в ПД.
        </role>
        <context>
        {context}
        </context>
        <task>
        Заполни строго следующие 8 полей (плюс evidence):
        1. contractor_penalty_present — неустойка подрядчика: yes / no / not_defined.
        2. contractor_penalty_rate — размер/ставка неустойки подрядчика (текст) или "Данные не определены" или "Не применимо".
        3. penalty_basis — базис расчёта: contract_price / stage_price / overdue_amount / fixed_amount / not_specified / not_defined.
        4. penalty_basis_display — человеко-читаемое значение: "От цены договора" / "От цены этапа" / "От суммы просроченного платежа" / "Фиксированная сумма" / "Не указан" / "Данные не определены" / "Не применимо".
        5. client_penalty_present — встречная неустойка заказчика: yes / no / not_defined.
        6. client_penalty_rate — размер/ставка неустойки заказчика (текст) или "Данные не определены".
        7. penalty_cap_present — лимит неустойки: yes / no / not_defined.
        8. penalty_cap_present_display — человеко-читаемое значение: "Да, лимит установлен" / "Нет, лимит не установлен" / "Данные не определены" / "Не применимо".

        Маппинг enum → display:
        - penalty_basis: contract_price → "От цены договора", stage_price → "От цены этапа", overdue_amount → "От суммы просроченного платежа", fixed_amount → "Фиксированная сумма", not_specified → "Не указан", not_defined → "Данные не определены" или "Не применимо"
        - penalty_cap_present: yes → "Да, лимит установлен", no → "Нет, лимит не установлен", not_defined → "Данные не определены" или "Не применимо"

        Критическое правило:
        - Если contractor_penalty_present = "no" (неустойка подрядчика прямо исключена), то contractor_penalty_rate = "Не применимо", penalty_basis = "not_defined", display = "Не применимо", penalty_cap_present = "not_defined", display = "Не применимо". Поля заказчика (client_penalty_*) оцениваются отдельно.
        - Если contractor_penalty_present = "not_defined" (условие не упоминается), то contractor_penalty_rate = "Данные не определены", остальные поля = "not_defined", display = "Данные не определены".
        </task>
        <context_rules>
        - Используй только текст договора. Не выдумывай ставки, проценты или суммы — извлекай строго из переданного фрагмента.
        - Не опирайся на внешние знания о типовых условиях договоров ПИР.
        - Не путай неустойку за просрочку выполнения работ со штрафом за расторжение договора (Check 13).
        - Не путай неустойку за просрочку с ответственностью за ошибки в ПД (Check 16).
        - Не путай неустойку подрядчика (за просрочку выполнения) с неустойкой заказчика (за просрочку оплаты) — это разные механизмы.
        - Верни строго валидный JSON. Все 8 ключей + evidence обязаны присутствовать.
        - Запрещены: null, None, пустые строки "". Для текстовых полей при отсутствии данных — "Данные не определены".
        - Убедись, что enum-значения соответствуют их display-версиям согласно маппингу выше.
        - Различай "no" (условие прямо исключено) и "not_defined" (условие вообще не упоминается).
        - Если ставка неустойки или cap определяется по приложению — укажи ссылку, а не "Данные не определены".
        </context_rules>

        <output_expectations>
        - Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        - Не используй markdown fences.
        - Не добавляй пояснения до или после JSON.
        - Верни все ключи, перечисленные в task, без пропусков.
        - Не используй null, None или пустые строки.
        - Для статусных полей используй только значения из allowed_values или "not_defined".
        - Для текстовых полей при отсутствии данных используй "Данные не определены" / "Не удалось определить" / "Не применимо" — согласно правилам выше.
        </output_expectations>
      fields:
        - name: "contractor_penalty_present"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Предусмотрена ли неустойка для подрядчика за просрочку выполнения работ (enum)."
          required: true
          display_in_grid: false
        - name: "contractor_penalty_rate"
          type: "string"
