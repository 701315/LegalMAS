# ──────────────────────────────────────────────────────────────────────────
# CHECK 12: Порядок сдачи-приёмки результатов работ
# ──────────────────────────────────────────────────────────────────────────
- id: acceptance_procedure
  name: "Порядок сдачи-приёмки результатов работ (ст. 720, 760 ГК РФ)"
  description: |
    Проверяет наличие процедуры сдачи-приёмки, акта, комплектности документации,
    реестра замечаний и порядка их устранения.
  legal_base: "ст. 720, 760 ГК РФ"
  triggers: ~
  ui_mode: "field_extraction"
  severity: "high"
  origin: "DOCUMENT_TYPE"
  detector_type: "hybrid"
  rules:
    keywords:
      - "акт сдачи-приёмки"
      - "приёмка результатов"
      - "комплектность документации"
      - "передача документации"
      - "подписание акта"
      - "мотивированный отказ от приёмки"
      - "реестр замечаний"
      - "перечень замечаний"
      - "устранение замечаний"
      - "срок устранения"
    keyword_mode: "any"
    regex_patterns:
      - "(?i)акт\\s+(сдачи|приёмки|приемки)"
      - "(?i)передач(а|и)\\s+документац"
      - "(?i)замечан(ия|ий).*устранен"
  llm:
    prompt_template: |
      [КОНТЕКСТ]
      Ты — юрист, анализирующий договор ПИР.
      Проверяется только один вопрос: определён ли порядок итоговой сдачи-приёмки
      результатов работ, включая акт, комплектность, реестр замечаний
      и сроки их устранения.

      Важно:
      — Анализируй только положения о сдаче-приёмке, актах, комплектности,
        замечаниях и их устранении.
      — Не оценивай риск и не смешивай итоговую приёмку с поэтапным согласованием.
      — Если условие не установлено прямо, не домысливай его.

      [ЗАДАЧА]
      1. Установить, предусмотрен ли акт сдачи-приёмки.
      2. Извлечь срок рассмотрения документации заказчиком.
      3. Установить, есть ли авто-приёмка при молчании.
      4. Установить, предусмотрен ли реестр/перечень замечаний.
      5. Извлечь срок устранения замечаний.
      6. Установить, проверяется ли комплектность документации.

      [ПРАВИЛА]
      1. acceptance_act_present = "yes" — если акт сдачи-приёмки предусмотрен;
         "no" — если тема раскрыта, но акт не предусмотрен;
         "not_found" — если тема отсутствует.
      2. review_period_days — числовое значение в днях или текстовый период;
         если не указано — "not_found".
      3. auto_acceptance = "yes" — молчание приравнивается к приёмке;
         "no" — тема раскрыта, но авто-приёмки нет; "not_found" — тема отсутствует.
      4. remarks_register_present = "yes" — предусмотрен реестр/перечень замечаний;
         "no" — тема приёмки есть, но реестра нет; "not_found" — тема отсутствует.
      5. remedy_period — срок устранения замечаний (текст); если не указано — "not_found".
      6. completeness_check = "yes" — если предусмотрена проверка комплектности
         передаваемой документации; "no" — тема раскрыта, но нет;
         "not_found" — тема отсутствует.
      7. Не путай итоговую приёмку с поэтапным согласованием.

      [ПРИМЕРЫ (FEW-SHOT)]
      Пример 1 — приёмка урегулирована:
      Текст: «Подрядчик передаёт Заказчику документацию с сопроводительным
      письмом и реестром передаваемых документов. Заказчик рассматривает
      документацию в течение 15 рабочих дней. При наличии замечаний
      Заказчик направляет перечень замечаний. Подрядчик устраняет замечания
      в течение 10 рабочих дней. Если замечания не направлены в указанный срок,
      документация считается принятой.»

      Ответ:
      {
        "acceptance_act_present": "yes",
        "review_period_days": "15 рабочих дней",
        "auto_acceptance": "yes",
        "remarks_register_present": "yes",
        "remedy_period": "10 рабочих дней",
        "completeness_check": "yes",
        "evidence": [
          "Подрядчик передаёт Заказчику документацию с сопроводительным письмом и реестром передаваемых документов.",
          "Заказчик рассматривает документацию в течение 15 рабочих дней.",
          "При наличии замечаний Заказчик направляет перечень замечаний.",
          "Подрядчик устраняет замечания в течение 10 рабочих дней.",
          "Если замечания не направлены в указанный срок, документация считается принятой."
        ]
      }

      Пример 2 — тема не раскрыта:
      Текст: «Результаты работ передаются Заказчику.»

      Ответ:
      {
        "acceptance_act_present": "not_found",
        "review_period_days": "not_found",
        "auto_acceptance": "not_found",
        "remarks_register_present": "not_found",
        "remedy_period": "not_found",
        "completeness_check": "not_found",
        "evidence": [
          "Результаты работ передаются Заказчику."
        ]
      }

      [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
      1. Различены ли итоговая приёмка и поэтапное согласование?
      2. Есть ли явный срок рассмотрения в днях?
      3. Есть ли правило авто-приёмки при молчании?
      4. Есть ли отдельный реестр/перечень замечаний?
      5. Установлен ли срок устранения замечаний?
      6. Все ли ключи JSON совпадают со schema?

      [ФОРМАТ ОТВЕТА]
      Верни строго JSON:
      {
        "acceptance_act_present": "<yes / no / not_found>",
        "review_period_days": "<текст или not_found>",
        "auto_acceptance": "<yes / no / not_found>",
        "remarks_register_present": "<yes / no / not_found>",
        "remedy_period": "<текст или not_found>",
        "completeness_check": "<yes / no / not_found>",
        "evidence": ["<цитата 1>", "<цитата 2>"]
      }
    prompt_file: null
    context_k: 6
    temperature: 0.0
    max_tokens: 540
  retrieval:
    corpus_scope: "document"
    retrieval_profile: "acceptance_check"
    context_k: 6
    max_chunks: 8
    boost_keywords:
      - "акт сдачи-приёмки"
      - "приёмка результатов"
      - "комплектность"
      - "замечания"
      - "устранение замечаний"
      - "реестр замечаний"
    negative_keywords:
      - "экспертиза"
      - "форс-мажор"
      - "подсудность"
      - "неустойка"
    rerank: true
    filters: {}
  enrichment_hints:
    preferred_segment_types:
      - "clause"
      - "article"
    excluded_segment_types:
      - "signature_block"
    preferred_clause_functions:
      - "procedures"
      - "remedies"
  evidence:
    required: true
    min_snippet_length: 40
    max_snippet_length: 700
  extraction:
    enabled: true
    mode: "hybrid"
    store_payload: true
    llm_max_tokens: 800

    compact_output: false

    llm_prompt_extraction: |
      <role>
      Ты — юрист, извлекающий сведения о порядке сдачи-приёмки
      в договоре ПИР. Не оценивай риски. Только заполняй поля строго по тексту.
      </role>

      <context>
      {context}
      </context>

      <task>
      Заполни строго следующие поля:

      acceptance_act_present — предусмотрен ли акт сдачи-приёмки
        (allowed: yes / no / not_found).

      review_period_days — срок рассмотрения документации заказчиком
        (текстовое значение или not_found).

      auto_acceptance — авто-приёмка при молчании заказчика
        (allowed: yes / no / not_found).

      remarks_register_present — предусмотрен ли реестр/перечень замечаний
        (allowed: yes / no / not_found).

      remedy_period — срок устранения замечаний
        (текстовое значение или not_found).

      completeness_check — проверяется ли комплектность документации
        (allowed: yes / no / not_found).

      Если данные отсутствуют: указывай "not_found".
      </task>

      <rules>
      1. acceptance_act_present: "yes" — акт предусмотрен; "no" — тема раскрыта, но нет;
         "not_found" — тема отсутствует.
      2. review_period_days: числовое значение с единицей или "not_found".
      3. auto_acceptance: "yes" — молчание = приёмка; "no" — нет; "not_found" — тема отсутствует.
      4. remarks_register_present: "yes" — реестр есть; "no" — тема раскрыта, но нет;
         "not_found" — тема отсутствует.
      5. remedy_period: текстовое значение с единицей или "not_found".
      6. completeness_check: "yes" — комплектность проверяется; "no" — нет;
         "not_found" — тема отсутствует.
      7. Не добавляй ключи, не входящие в список полей.
      8. Верни только JSON.
      </rules>
    fields:
