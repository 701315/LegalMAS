# CHECK 8: Поэтапная оплата (ст. 711, 762 ГК РФ)
# ──────────────────────────────────────────────────────────────────────────
  - id: stage_payment_schedule
    name: "Поэтапная оплата: привязка к актам и порядок расчётов"
    description: >
      Фактографическая проверка наличия аванса, поэтапной оплаты,
      привязки платежей к подписанию актов и триггера окончательного расчёта.
    triggers: {}
    ui_mode: "field_extraction"
