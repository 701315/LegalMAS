          "tu_responsibility": "<contractor / client / jointly / not_specified / not_found>",
          "tu_cost_bearer": "<contractor / client / jointly / not_specified / not_found>",
          "external_approvals_listed": "<yes / no / not_found>",
          "approval_delay_consequences": "<deadline_extension / contractor_risk / not_specified / not_found>",
