dd_request_templates:
  parties_identification:
    text: >
      Просим подтвердить полные реквизиты сторон по {doc_names}: наименование/ФИО,
      ИНН, ОГРН, адрес, документы уполномоченных лиц, подтверждение полномочий.
    addressee: "Обе стороны"
  pir_subject_extraction:
    text: >
      Просим подтвердить по {doc_names}: (а) полное наименование объекта проектирования;
      (б) стадию проектирования (П/Р/П+Р); (в) перечень разделов ПД;
      (г) ссылку на ТЗ с подтверждением его утверждения заказчиком.
    addressee: "Обе стороны"
  technical_specification_completeness:
    text: >
      В {doc_names} необходимо подтвердить наличие и полноту ТЗ на проектирование
      (ст. 759 ГК РФ): (а) приложено ли ТЗ к договору; (б) содержит ли оно параметры
      объекта, ссылки на нормативы, требования к результату; (в) утверждено ли заказчиком.
    addressee: "Заказчик"
  initial_data_provision_check:
    text: >
      Просим предоставить по {doc_names}: (а) полный перечень исходных данных
      с указанием ответственного за предоставление; (б) сроки предоставления
      каждого документа; (в) последствия задержки; (г) оговорку об ответственности
      заказчика за достоверность.
    addressee: "Заказчик"
  expertise_procedure_and_payment_link:
    text: >
      Просим подтвердить по {doc_names}: (а) вид экспертизы (государственная/негосударственная);
      (б) кто подаёт документы на экспертизу; (в) кто оплачивает экспертизу;
      (г) привязана ли окончательная оплата к положительному заключению;
      (д) последствия отрицательного заключения.
    addressee: "Обе стороны"
  external_approvals_coordination:
    text: >
      Просим уточнить в {doc_names}: (а) кто обязан получить технические условия
      на подключение к сетям; (б) кто несёт расходы на ТУ и согласования;
      (в) перечень органов/организаций для согласования; (г) последствия задержки
      согласований для сроков проектирования.
    addressee: "Обе стороны"
  price_and_calculation_basis:
    text: >
      Просим подтвердить по {doc_names}: (а) цену работ цифрами и прописью;
      (б) вид цены (твёрдая/приблизительная); (в) основание расчёта (СБЦ, % от СМР,
      фиксированная); (г) включает ли цена НДС; (д) порядок изменения цены
      при увеличении объёма.
    addressee: "Обе стороны"
  stage_payment_schedule:
    text: >
      Просим уточнить в {doc_names}: (а) размер авансового платежа; (б) привязку
      промежуточных платежей к подписанию актов этапов; (в) условия окончательного
      расчёта; (г) реквизиты для оплаты.
    addressee: "Обе стороны"
  performance_deadlines_milestones:
    text: >
      Просим предоставить по {doc_names}: (а) календарный план-график работ с этапами;
      (б) ключевые даты (начало, эскиз, экспертиза, сдача РД); (в) привязку сроков
      к предоставлению исходных данных.
    addressee: "Обе стороны"
  auto_deadline_extension:
    text: >
      Просим включить в {doc_names} условие: при задержке согласования заказчиком
      сроки выполнения автоматически продлеваются на период задержки; время рассмотрения
      заказчиком не включается в сроки подрядчика.
    addressee: "Юридический советник подрядчика"
  stagewise_approval_procedure:
    text: >
      Просим согласовать в {doc_names}: перечень этапов, подлежащих согласованию;
      сроки рассмотрения каждого этапа; право заказчика на замечания; порядок учёта
      или отклонения замечаний.
    addressee: "Обе стороны"
  acceptance_procedure:
    text: >
      Просим уточнить в {doc_names}: порядок сдачи-приёмки, форму акта, срок рассмотрения
      документации заказчиком, основания для мотивированного отказа, комплектность
      передаваемой документации.
    addressee: "Обе стороны"
  termination_and_consequences:
    text: >
      Просим уточнить в {doc_names}: (а) основания для одностороннего отказа каждой
      стороны; (б) порядок оплаты выполненной части; (в) возврат документации
      и исходных данных; (г) неустойки и штрафы; (д) судьба авансовых платежей.
    addressee: "Юридический советник"
  assignment_and_subcontracting:
    text: >
      Просим уточнить в {doc_names}: (а) допускается ли привлечение субподрядчиков;
      (б) требуется ли согласие заказчика; (в) сохраняется ли ответственность
      генерального проектировщика; (г) ограничения на уступку прав.
    addressee: "Юридический советник"
  ip_rights_on_documentation:
    text: >
      Просим уточнить в {doc_names}: (а) кому принадлежат исключительные права на ПД;
      (б) момент перехода прав; (в) вправе ли заказчик повторно использовать проект;
      (г) вправе ли заказчик модифицировать проект; (д) сохраняются ли за автором
      личные неимущественные права.
    addressee: "Юридический советник"
  designer_liability_for_errors:
    text: >
      Просим уточнить в {doc_names}: (а) объём ответственности проектировщика за ошибки
      в ПД; (б) включает ли ответственность расходы на переделку СМР; (в) наличие лимита
      ответственности и его размер; (г) исключены ли косвенные убытки и упущенная выгода.
    addressee: "Юридический советник"
  designer_vs_builder_liability:
    text: >
      Просим включить в {doc_names} чёткое разграничение ответственности: проектировщик
      отвечает за качество документации, но не за её реализацию строителями.
      Авторский надзор — отдельная услуга / договор.
    addressee: "Юридический советник"
  author_supervision_terms:
    text: >
      Просим уточнить в {doc_names}: (а) включён ли авторский надзор в договор
      или осуществляется по отдельному договору; (б) объём и периодичность;
      (в) порядок оплаты; (г) ответственность при отказе от авторского надзора.
    addressee: "Обе стороны"
  quality_warranty:
    text: >
      Просим подтвердить в {doc_names}: гарантию соответствия ПД действующим нормативам
      (СП, ГОСТ, СНиП), ТЗ и исходным данным. Указать перечень применяемых нормативов.
    addressee: "Подрядчик"
  warranty_period_for_documentation:
    text: >
      Просим включить в {doc_names} гарантийный срок на ПД: продолжительность,
      обязанность безвозмездного устранения дефектов, порядок предъявления претензий.
    addressee: "Юридический советник"
  penalty_for_delay:
    text: >
      Просим согласовать в {doc_names}: размер неустойки за просрочку (для обеих сторон),
      предельный размер (cap), порядок исчисления, основания для освобождения.
    addressee: "Юридический советник"
  sro_membership_check:
    text: >
      Просим предоставить по {doc_names}: (а) наименование и номер СРО; (б) реквизиты
      свидетельства/выписки; (в) обязательство поддерживать членство на весь срок
      действия договора.
    addressee: "Подрядчик"
  force_majeure:
    text: >
      Просим уточнить в {doc_names}: перечень обстоятельств форс-мажора, порядок и сроки
      уведомления, последствия (приостановка / расторжение), подтверждающие документы (ТПП).
    addressee: "Юридический советник"
  dispute_resolution_and_pretension:
    text: >
      Просим согласовать в {doc_names}: претензионный порядок (срок), подсудность,
      возможность медиации / третейского разбирательства.
    addressee: "Юридический советник"
  documentation_delivery_format:
    text: >
      Просим уточнить в {doc_names}: (а) количество бумажных экземпляров ПД;
      (б) формат электронной версии (DWG/PDF/IFC); (в) требования к BIM-модели
      (если применимо); (г) носитель/способ передачи электронных файлов.
    addressee: "Заказчик"
  insurance_professional_liability:
    text: >
      Просим подтвердить по {doc_names}: наличие полиса страхования профессиональной
      ответственности проектировщика, страховую сумму, срок действия, соответствие
      требованиям СРО.
    addressee: "Подрядчик"
  _default:
    text: >
      Просим предоставить дополнительную информацию по вопросу «{check_name}»
      применительно к {doc_names}.
    addressee: "Юридический советник"