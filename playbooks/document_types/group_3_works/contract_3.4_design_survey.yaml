  - id: technical_specification_completeness
    name: "ТЗ на проектирование: наличие и полнота (ст. 759 ГК РФ)"
    description: >
      Фактографическая проверка наличия и содержательной полноты технического задания
      на проектирование в соответствии со ст. 759 ГК РФ. Техническое задание является
      существенным условием договора на выполнение проектных и изыскательских работ —
      оно определяет параметры объекта, требования к результату работ и перечень применимых
      нормативных документов. Проверка выявляет три критических риска: (1) ТЗ полностью
      отсутствует в договоре и приложениях; (2) ТЗ упомянуто, но фактически не приложено
      (referenced_but_missing); (3) ТЗ присутствует, но не содержит ключевых элементов:
      параметров объекта проектирования, ссылок на нормативные документы или требований
      к составу и результату работ. Отсутствие или неполнота ТЗ создаёт риск споров
      об объёме обязательств подрядчика, невозможности приёмки результатов и оспаривания
      качества проектной документации.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "техническое задание"
        - "ТЗ на проектирование"
        - "задание на проектирование"
        - "приложение"
        - "параметры объекта"
        - "требования к проекту"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)техническ(ое|ого)\\s+задани"
        - "(?i)задани(е|я)\\s+на\\s+проектирован"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор на выполнение проектных и изыскательских работ (ПИР)
        (§ 4 Главы 37 ГК РФ, ст. 759).
        Проверяется только один вопрос: наличие технического задания
        и достаточность его содержания для определения требований к результату.
        Нормативный ориентир:
        - ст. 759 ГК РФ
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Присутствует ли ТЗ в договоре или приложениях.
        2. Содержит ли ТЗ параметры объекта.
        3. Содержит ли ТЗ ссылки на нормативы.
        4. Содержит ли ТЗ требования к результату работ.

        [ПРАВИЛА]
        1. Используй только текст документа. Не выдумывай содержание ТЗ — извлекай строго из переданного фрагмента.
        2. Для enum-полей (tz_present, tz_contains_*) при отсутствии данных используй значения:
           - tz_present: "not_defined"
           - tz_contains_*: "unclear" (если ТЗ недоступно для анализа) или "no" (если ТЗ доступно, но элемент отсутствует)
        3. Для полей *_display используй человеко-читаемые значения согласно маппингу.
        4. Различай:
           - "yes" — элемент явно присутствует в тексте ТЗ
           - "no" — ТЗ доступно, но элемент в нём отсутствует
           - "unclear" — ТЗ упомянуто, но его содержание недоступно для анализа (например, только ссылка на приложение без текста)
           - "referenced_but_missing" — ТЗ упомянуто в договоре, но само ТЗ не приложено
           - "not_defined" — ТЗ вообще не упомянуто в договоре
        5. В evidence — только точные цитаты из документа с указанием пункта.
        6. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.без комментариев и markdown-обёртки.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — ТЗ присутствует, все элементы указаны:
        Фрагмент:
        "Подрядчик выполняет работы в соответствии с Техническим заданием
        на проектирование (Приложение № 2). ТЗ содержит основные технико-экономические
        показатели объекта, требования к составу проектной документации и перечень
        применимых нормативных документов."
        Ответ:
        {
          "tz_present": "yes",
          "tz_present_display": "Да, ТЗ присутствует в договоре/приложениях",
          "tz_contains_object_parameters": "yes",
          "tz_contains_object_parameters_display": "Да, указано",
          "tz_contains_norms_references": "yes",
          "tz_contains_norms_references_display": "Да, указано",
          "tz_contains_result_requirements": "yes",
          "tz_contains_result_requirements_display": "Да, указано",
          "evidence": [
            {
              "clause_ref": "п. 1.2",
              "quote": "Подрядчик выполняет работы в соответствии с Техническим заданием на проектирование (Приложение № 2)."
            },
