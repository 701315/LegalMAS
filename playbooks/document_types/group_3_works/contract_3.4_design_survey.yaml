  - id: author_supervision_terms
    name: "Авторский надзор: условия и порядок (ст. 12 ФЗ-169)"
    description: >
      Фактографическая проверка условий осуществления авторского надзора проектировщика
      за строительством в договоре на выполнение проектных и изыскательских работ (ПИР)
      в соответствии со ст. 12 Федерального закона от 17.11.1995 № 169-ФЗ
      «Об архитектурной деятельности в Российской Федерации» и СП 246.1325800.2016
      «Положение об авторском надзоре за строительством зданий и сооружений».
      Авторский надзор — это самостоятельная услуга проектировщика по контролю за
      соответствием строительных работ проектной документации. Проверка выявляет
      шесть критических аспектов: (1) включён ли авторский надзор в текущий договор ПИР
      или оформлен отдельным договором — в российской практике оба варианта распространены;
      (2) объём (scope) авторского надзора — полный (в соответствии с СП 246.1325800.2016,
      включая ведение журнала авторского надзора, участие в приёмке скрытых работ,
      контроль за соответствием строительных решений проекту) или ограниченный
      (например, только выезды на объект по запросу заказчика); (3) порядок оплаты
      авторского надзора — включён в общую цену договора ПИР или оплачивается отдельно
      (фиксированная сумма, почасовая ставка, процент от цены договора); (4) ответственность
      проектировщика за ненадлежащее осуществление авторского надзора — критически важный
      механизм защиты заказчика от дефектов, вызванных отсутствием контроля со стороны
      проектировщика; (5) количественный лимит выездов на объект в рамках авторского
      надзора — типичная практика для ограничения объёма работ (например, «не более
      2 выездов в месяц»), отсутствие лимита создаёт риск неограниченных требований
      заказчика о выездах; (6) порядок оплаты сверхнормативных выездов — если фактическое
      количество выездов превышает установленный лимит, важно заранее согласовать
      стоимость каждого дополнительного выезда (например, «15 000 рублей за выезд»),
      чтобы избежать споров об оплате. Отсутствие или неполнота регулирования авторского
      надзора создаёт риски неконтролируемых отклонений от проекта на стадии строительства,
      споров о распределении ответственности за дефекты и неоплаченных сверхнормативных
      выездов проектировщика.
    triggers:
      any: ["author_supervision"]
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "авторский надзор"
        - "надзор автора проекта"
        - "контроль за реализацией"
        - "участие проектировщика в приёмке"
        - "журнал авторского надзора"
        - "количество выездов"
        - "лимит выездов"
        - "сверхнормативные выезды"
        - "дополнительный выезд"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)авторск(ий|ого)\\s+надзор"
        - "(?i)выезд(ы|ов)\\s+на\\s+объект"
        - "(?i)сверхнормативн(ые|ых)\\s+выезд"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор на выполнение проектных и изыскательских работ (ПИР)
        (§ 4 Главы 37 ГК РФ; ст. 12 ФЗ от 17.11.1995 № 169-ФЗ).
        Проверяется только один вопрос: авторский надзор проектировщика.
        Нормативный ориентир:
        - ст. 12 ФЗ-169 (авторский надзор)
        - СП 246.1325800.2016 (положение об авторском надзоре)
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не выдумывай условия авторского надзора — извлекай строго из переданного фрагмента.
        - Не путай авторский надзор проектировщика с техническим надзором заказчика.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Включён ли авторский надзор в договор (или оформлен отдельным договором).
        2. Scope надзора (полный / ограниченный).
        3. Порядок оплаты надзора.
        4. Ответственность за ненадлежащий надзор.
        5. Количественный лимит выездов на объект в рамках авторского надзора.
        6. Порядок оплаты сверхнормативных выездов.

        [ПРАВИЛА]
        1. Используй только текст документа. Не выдумывай условия авторского надзора — извлекай строго из переданного фрагмента.
        2. Для enum-полей при отсутствии данных используй значение "not_defined".
        3. Для текстовых полей при отсутствии данных пиши "Данные не определены".
        4. Для полей *_display используй человеко-читаемые значения согласно маппингу.
        5. Различай:
           - "yes" — авторский надзор включён в текущий договор ПИР
           - "separate_contract" — авторский надзор оформлен отдельным договором
           - "not_defined" — авторский надзор вообще не упоминается в договоре
           - "full" — полный объём надзора (в соответствии с СП 246.1325800.2016 или аналогичным стандартом)
           - "limited" — ограниченный объём надзора (например, только выезды по запросу)
           - "not_specified" — надзор упомянут, но объём не конкретизирован
           - "included_in_price" — стоимость надзора включена в общую цену договора
           - "separate_fee" — стоимость надзора оплачивается отдельно
        6. Критическое правило:
           - Если author_supervision_included = "not_defined" (авторский надзор не упоминается), то все остальные поля (supervision_scope, supervision_payment, supervision_liability, visit_limit, extra_visit_fee) = "not_defined" или "Данные не определены", display = "Данные не определены"
           - Если author_supervision_included = "separate_contract" (отдельный договор), то все остальные поля = "not_defined" или "Не применимо", display = "Не применимо" (т.к. условия надзора в отдельном договоре, а не в текущем)
        7. Не путай:
           - Авторский надзор проектировщика (этот check) с техническим надзором заказчика (это разные институты)
           - Авторский надзор с участием проектировщика в приёмке работ (это часть надзора, но не весь надзор)
           - Лимит выездов (количество) с порядком оплаты (стоимость)
        8. В evidence — только точные цитаты из документа с указанием пункта.
        9. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.без комментариев и markdown-обёртки.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — авторский надзор включён, полный scope, оплата в цене, ответственность есть, лимит и сверхнормативные указаны:
        Фрагмент:
        "Подрядчик осуществляет авторский надзор за строительством
        в полном объёме в соответствии с СП 246.1325800.2016. Стоимость
        авторского надзора включена в цену договора. Подрядчик несёт
        ответственность за ненадлежащее осуществление авторского надзора.
        Количество выездов на объект не ограничено. Сверхнормативные
        выезды не предусмотрены."
        Ответ:
        {
          "author_supervision_included": "yes",
          "author_supervision_included_display": "Да, включён в договор",
          "supervision_scope": "full",
          "supervision_scope_display": "Полный объём",
          "supervision_payment": "included_in_price",
          "supervision_payment_display": "Включён в цену договора",
          "supervision_liability": "yes",
          "supervision_liability_display": "Да, ответственность предусмотрена",
          "visit_limit": "Количество выездов не ограничено",
          "extra_visit_fee": "Сверхнормативные выезды не предусмотрены",
          "evidence": [
            {
              "clause_ref": "п. 11.1",
              "quote": "Подрядчик осуществляет авторский надзор за строительством в полном объёме в соответствии с СП 246.1325800.2016."
            },
            {
              "clause_ref": "п. 11.2",
              "quote": "Стоимость авторского надзора включена в цену договора."
            },
            {
              "clause_ref": "п. 11.3",
              "quote": "Подрядчик несёт ответственность за ненадлежащее осуществление авторского надзора."
            },
            {
              "clause_ref": "п. 11.4",
              "quote": "Количество выездов на объект не ограничено. Сверхнормативные выезды не предусмотрены."
            }
          ]
        }

        Пример 2 — авторский надзор по отдельному договору:
        Фрагмент:
        "Авторский надзор за строительством осуществляется Подрядчиком
        на основании отдельного договора. Условия и стоимость авторского
        надзора определяются указанным договором."
        Ответ:
        {
          "author_supervision_included": "separate_contract",
          "author_supervision_included_display": "Оформлен отдельным договором",
          "supervision_scope": "not_defined",
          "supervision_scope_display": "Не применимо",
          "supervision_payment": "not_defined",
          "supervision_payment_display": "Не применимо",
          "supervision_liability": "not_defined",
          "supervision_liability_display": "Не применимо",
          "visit_limit": "Не применимо",
          "extra_visit_fee": "Не применимо",
          "evidence": [
            {
              "clause_ref": "п. 11.1",
              "quote": "Авторский надзор за строительством осуществляется Подрядчиком на основании отдельного договора."
            },
            {
              "clause_ref": "п. 11.2",
