- id: acceptance_procedure
  name: Порядок сдачи-приёмки результатов работ (ст. 720, 760 ГК РФ)
  description: 'Проверяет наличие процедуры сдачи-приёмки, акта, комплектности документации,

    реестра замечаний и порядка их устранения.

    '
  legal_base: ст. 720, 760 ГК РФ
  triggers: null
  ui_mode: field_extraction
  severity: high
  severity_if_pass: pass
  severity_if_fail: high
  severity_if_unclear: high
  origin: DOCUMENT_TYPE
  detector_type: hybrid
  rules:
    keywords:
    - акт сдачи-приёмки
    - приёмка результатов
    - комплектность документации
    - передача документации
    - подписание акта
    - мотивированный отказ от приёмки
    - реестр замечаний
    - перечень замечаний
    - устранение замечаний
    - срок устранения
    keyword_mode: any
    regex_patterns:
    - (?i)акт\s+(сдачи|приёмки|приемки)
    - (?i)передач(а|и)\s+документац
    - (?i)замечан(ия|ий).*устранен
  llm:
    prompt_template: "[КОНТЕКСТ]\nТы — юрист, анализирующий договор ПИР.\nПроверяется только один вопрос: определён ли порядок итоговой сдачи-приёмки\nрезультатов работ, включая акт, комплектность, реестр замечаний\nи сроки их устранения.\n\nВажно:\n— Анализируй только положения о сдаче-приёмке, актах, комплектности,\n  замечаниях и их устранении.\n— Не оценивай риск и не смешивай итоговую приёмку с поэтапным согласованием.\n— Если условие не установлено прямо, не домысливай его.\n\n[ЗАДАЧА]\n1. Установить, предусмотрен ли акт сдачи-приёмки.\n2. Извлечь срок рассмотрения документации заказчиком.\n3. Установить, есть ли авто-приёмка при молчании.\n4. Установить, предусмотрен ли реестр/перечень замечаний.\n5. Извлечь срок устранения замечаний.\n6. Установить, проверяется ли комплектность документации.\n\n[ПРАВИЛА]\n1. acceptance_act_present = \"yes\" — если акт сдачи-приёмки предусмотрен;\n   \"no\" — если тема раскрыта, но акт не предусмотрен;\n   \"not_found\" — если тема отсутствует.\n\
      2. review_period_days — числовое значение в днях или текстовый период;\n   если не указано — \"not_found\".\n3. auto_acceptance = \"yes\" — молчание приравнивается к приёмке;\n   \"no\" — тема раскрыта, но авто-приёмки нет; \"not_found\" — тема отсутствует.\n4. remarks_register_present = \"yes\" — предусмотрен реестр/перечень замечаний;\n   \"no\" — тема приёмки есть, но реестра нет; \"not_found\" — тема отсутствует.\n5. remedy_period — срок устранения замечаний (текст); если не указано — \"not_found\".\n6. completeness_check = \"yes\" — если предусмотрена проверка комплектности\n   передаваемой документации; \"no\" — тема раскрыта, но нет;\n   \"not_found\" — тема отсутствует.\n7. Не путай итоговую приёмку с поэтапным согласованием.\n\n[ПРИМЕРЫ (FEW-SHOT)]\nПример 1 — приёмка урегулирована:\nТекст: «Подрядчик передаёт Заказчику документацию с сопроводительным\nписьмом и реестром передаваемых документов. Заказчик рассматривает\nдокументацию в течение 15 рабочих дней. При наличии замечаний\n\
      Заказчик направляет перечень замечаний. Подрядчик устраняет замечания\nв течение 10 рабочих дней. Если замечания не направлены в указанный срок,\nдокументация считается принятой.»\n\nОтвет:\n{\n  \"acceptance_act_present\": \"yes\",\n  \"review_period_days\": \"15 рабочих дней\",\n  \"auto_acceptance\": \"yes\",\n  \"remarks_register_present\": \"yes\",\n  \"remedy_period\": \"10 рабочих дней\",\n  \"completeness_check\": \"yes\",\n  \"evidence\": [\n    \"Подрядчик передаёт Заказчику документацию с сопроводительным письмом и реестром передаваемых документов.\",\n    \"Заказчик рассматривает документацию в течение 15 рабочих дней.\",\n    \"При наличии замечаний Заказчик направляет перечень замечаний.\",\n    \"Подрядчик устраняет замечания в течение 10 рабочих дней.\",\n    \"Если замечания не направлены в указанный срок, документация считается принятой.\"\n  ]\n}\n\nПример 2 — тема не раскрыта:\nТекст: «Результаты работ передаются Заказчику.»\n\nОтвет:\n{\n  \"acceptance_act_present\"\
      : \"not_found\",\n  \"review_period_days\": \"not_found\",\n  \"auto_acceptance\": \"not_found\",\n  \"remarks_register_present\": \"not_found\",\n  \"remedy_period\": \"not_found\",\n  \"completeness_check\": \"not_found\",\n  \"evidence\": [\n    \"Результаты работ передаются Заказчику.\"\n  ]\n}\n\n[ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]\n1. Различены ли итоговая приёмка и поэтапное согласование?\n2. Есть ли явный срок рассмотрения в днях?\n3. Есть ли правило авто-приёмки при молчании?\n4. Есть ли отдельный реестр/перечень замечаний?\n5. Установлен ли срок устранения замечаний?\n6. Все ли ключи JSON совпадают со schema?\n\n[ФОРМАТ ОТВЕТА]\nВерни строго JSON:\n{\n  \"acceptance_act_present\": \"<yes / no / not_found>\",\n  \"review_period_days\": \"<текст или not_found>\",\n  \"auto_acceptance\": \"<yes / no / not_found>\",\n  \"remarks_register_present\": \"<yes / no / not_found>\",\n  \"remedy_period\": \"<текст или not_found>\",\n  \"completeness_check\": \"<yes / no / not_found>\",\n\
      \  \"evidence\": [\"<цитата 1>\", \"<цитата 2>\"]\n}\n"
    prompt_file: null
    context_k: 6
    temperature: 0.0
    max_tokens: 540
  retrieval:
    corpus_scope: document
    retrieval_profile: acceptance_check
    context_k: 6
    max_chunks: 8
    boost_keywords:
    - акт сдачи-приёмки
    - приёмка результатов
    - комплектность
    - замечания
    - устранение замечаний
    - реестр замечаний
    negative_keywords:
    - экспертиза
    - форс-мажор
    - подсудность
    - неустойка
    rerank: true
    filters: {}
  enrichment_hints:
    preferred_segment_types:
    - clause
    - article
    excluded_segment_types:
    - signature_block
    preferred_clause_functions:
    - procedures
    - remedies
    confidence_bonus_on_match: 0.1
    confidence_penalty_on_excluded_segment: 0.12
  evidence:
    required: true
    min_snippet_length: 40
    max_snippet_length: 700
  extraction:
    enabled: true
    mode: hybrid
    store_payload: true
    llm_max_tokens: 800
    compact_output: false
    llm_prompt_extraction: "<role>\nТы — юрист, извлекающий сведения о порядке сдачи-приёмки\nв договоре ПИР. Не оценивай риски. Только заполняй поля строго по тексту.\n</role>\n\n<context>\n{context}\n</context>\n\n<task>\nЗаполни строго следующие поля:\n\nacceptance_act_present — предусмотрен ли акт сдачи-приёмки\n  (allowed: yes / no / not_found).\n\nreview_period_days — срок рассмотрения документации заказчиком\n  (текстовое значение или not_found).\n\nauto_acceptance — авто-приёмка при молчании заказчика\n  (allowed: yes / no / not_found).\n\nremarks_register_present — предусмотрен ли реестр/перечень замечаний\n  (allowed: yes / no / not_found).\n\nremedy_period — срок устранения замечаний\n  (текстовое значение или not_found).\n\ncompleteness_check — проверяется ли комплектность документации\n  (allowed: yes / no / not_found).\n\nЕсли данные отсутствуют: указывай \"not_found\".\n</task>\n\n<rules>\n1. acceptance_act_present: \"yes\" — акт предусмотрен; \"no\" — тема раскрыта, но нет;\n\
      \   \"not_found\" — тема отсутствует.\n2. review_period_days: числовое значение с единицей или \"not_found\".\n3. auto_acceptance: \"yes\" — молчание = приёмка; \"no\" — нет; \"not_found\" — тема отсутствует.\n4. remarks_register_present: \"yes\" — реестр есть; \"no\" — тема раскрыта, но нет;\n   \"not_found\" — тема отсутствует.\n5. remedy_period: текстовое значение с единицей или \"not_found\".\n6. completeness_check: \"yes\" — комплектность проверяется; \"no\" — нет;\n   \"not_found\" — тема отсутствует.\n7. Не добавляй ключи, не входящие в список полей.\n8. Верни только JSON.\n</rules>\n"
    fields:
    - name: acceptance_act_present
      type: string
      label: Акт сдачи-приёмки
      presentation: badge
      display_in_grid: true
      display_priority: 1
      allowed_values:
      - 'yes'
      - 'no'
      - not_found
      description: Предусмотрен ли акт сдачи-приёмки результатов работ.
      required: true
    - name: review_period_days
      type: string
      label: Срок рассмотрения
      presentation: text
      display_in_grid: true
      display_priority: 2
      description: Срок рассмотрения документации заказчиком при итоговой приёмке.
      max_value_chars: 100
      required: false
    - name: auto_acceptance
      type: string
      label: Авто-приёмка при молчании
      presentation: badge
      display_in_grid: true
      display_priority: 3
      allowed_values:
      - 'yes'
      - 'no'
      - not_found
      description: Считается ли документация принятой при молчании заказчика.
      required: false
    - name: remarks_register_present
      type: string
      label: Реестр замечаний
      presentation: badge
      display_in_grid: false
      display_priority: 4
      allowed_values:
      - 'yes'
      - 'no'
      - not_found
      description: Предусмотрен ли реестр/перечень замечаний.
      required: false
    - name: remedy_period
      type: string
      label: Срок устранения замечаний
      presentation: text
      display_in_grid: false
      display_priority: 5
      description: Срок устранения замечаний подрядчиком.
      max_value_chars: 100
