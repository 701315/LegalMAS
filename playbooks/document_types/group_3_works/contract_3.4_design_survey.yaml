  - id: site_access_and_survey_conditions
    name: "Доступ на участок и условия проведения изысканий"
    description: >
      Фактографическая проверка условий обеспечения подрядчику (изыскателю) доступа
      на земельный участок и условия проведения инженерных изысканий в договоре на
      выполнение проектных и изыскательских работ (ПИР). Для инженерных изысканий
      физический доступ на участок — обязательное условие выполнения работ. Проверка
      выявляет пять критических аспектов: (1) обязанность заказчика обеспечить
      подрядчику беспрепятственный доступ на земельный участок и в помещения для
      проведения изысканий; (2) срок предоставления доступа — конкретная дата или
      привязка к событию; (3) процедура действий при обнаружении на участке
      неуказанных в исходных данных препятствий (подземные коммуникации, археологические
      находки, опасные объекты, третьи лица); (4) право подрядчика на продление срока
      и возмещение расходов в случае обнаружения таких препятствий; (5) обязанность
      заказчика получить все необходимые разрешения на производство изысканий
      (ордеры на земляные работы, разрешения собственников смежных участков и т.п.).
      Отсутствие или неполнота регулирования доступа на участок создаёт риски
      срыва сроков изысканий, споров о дополнительных расходах и невозможности
      выполнения работ в принципе.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "доступ на участок"
        - "беспрепятственный доступ"
        - "земельный участок"
