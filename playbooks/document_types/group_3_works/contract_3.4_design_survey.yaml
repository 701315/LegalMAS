          "agreement_form": "<addendum_required / written_request / oral_or_electronic / not_specified / not_defined>",
          "agreement_form_display": "<Обязательно дополнительное соглашение / Достаточно письменного запроса / Допустимо устное/электронное согласование / Не конкретизировано / Данные не определены / Не применимо>",
          "price_agreement": "<fixed_amount / percentage_of_price / actual_costs / not_specified / not_defined>",
          "price_agreement_display": "<Фиксированная сумма / Процент от цены договора / По фактическим затратам / Не конкретизировано / Данные не определены / Не применимо>",
          "deadline_agreement": "<yes / no / not_defined>",
          "deadline_agreement_display": "<Да, срок согласуется / Нет, срок не согласуется / Данные не определены / Не применимо>",
          "suspension_right": "<yes / no / not_defined>",
