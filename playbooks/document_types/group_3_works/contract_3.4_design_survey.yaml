        - Для текстовых полей при отсутствии данных используй "Данные не определены" / "Не удалось определить" / "Не применимо" — согласно правилам выше.
        </output_expectations>
      fields:
        - name: "coordination_responsible"
          type: "string"
          presentation: "signal"
          allowed_values: ["general_designer", "client", "jointly", "not_specified", "not_defined"]
          description: "Ответственный за сводку разделов (enum)."
