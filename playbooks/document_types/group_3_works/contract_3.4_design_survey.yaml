    - ресурсоснабжающая организация
    - сетевая организация
    - Роспотребнадзор
    - МЧС
    - пожарный надзор
    - ГИБДД
    - орган охраны
    - Ростехнадзор
    keyword_mode: any
    regex_patterns:
    - (?i)техническ(ие|их)\s+услови(я|й)\s+на\s+подключен
    - (?i)согласован(ие|ия)\s+с\s+
  llm:
    prompt_template: "[КОНТЕКСТ]\nТы — юрист, анализирующий договор ПИР.\nПроверяется только один вопрос: получение технических условий (ТУ)\nи внешних согласований с ресурсоснабжающими организациями и государственными органами.\n\nВажно:\n— Анализируй только положения о ТУ, согласованиях, внешних органах и последствиях задержек.\n— Не оценивай риск и не делай выводов за пределами текста.\n— Не смешивай получение ТУ с прохождением экспертизы проектной документации.\n\n[ЗАДАЧА]\n1. Установить, урегулирован ли вопрос получения ТУ.\n2. Определить, кто обязан получать ТУ.\n3. Определить, кто несёт расходы на получение ТУ и согласования.\n4. Установить, перечислены ли внешние согласования и органы.\n5. Установить последствия задержки согласований.\n\n[ПРАВИЛА]\n1. tu_acquisition_defined = \"yes\" — если договор прямо регулирует получение ТУ;\n   \"no\" — если тема есть, но порядок не урегулирован или прямо выведен\n   за рамки договора; \"not_found\" — если тема отсутствует.\n2. tu_responsibility\
      \ / tu_cost_bearer:\n   \"contractor\" — подрядчик; \"client\" — заказчик; \"jointly\" — совместно;\n   \"not_specified\" — вопрос затронут, но распределение неясно;\n   \"not_found\" — тема отсутствует.\n3. external_approvals_listed = \"yes\" — если перечислены органы или виды согласований\n   (например, ГИБДД, МЧС, Роспотребнадзор, органы охраны ОКН, сетевые организации);\n   \"no\" — если тема согласований есть, но конкретный перечень не приведён;\n   \"not_found\" — тема отсутствует.\n4. approval_delay_consequences = \"deadline_extension\" — срок работ продлевается;\n   \"contractor_risk\" — задержка возложена на подрядчика без продления;\n   \"not_specified\" — тема задержки затронута без ясного последствия;\n   \"not_found\" — тема отсутствует.\n5. Если ТУ упомянуты только как исходные данные заказчика без описания процедуры,\n   tu_acquisition_defined = \"no\".\n6. Не путай расходы на экспертизу с расходами на получение ТУ и согласований.\n7. Не извлекай внутренние согласования\
      \ заказчика как внешние согласования.\n\n[ПРИМЕРЫ (FEW-SHOT)]\nПример 1 — процедура урегулирована:\nТекст: «Заказчик обеспечивает получение технических условий на подключение\nобъекта к инженерным сетям и согласования с ресурсоснабжающими организациями.\nРасходы на получение ТУ и согласования несёт Заказчик. При задержке предоставления\nсогласований сроки выполнения работ продлеваются на соответствующий период.\nПодлежат получению согласования с МЧС и Роспотребнадзором.»\n\nОтвет:\n{\n  \"tu_acquisition_defined\": \"yes\",\n  \"tu_responsibility\": \"client\",\n  \"tu_cost_bearer\": \"client\",\n  \"external_approvals_listed\": \"yes\",\n  \"approval_delay_consequences\": \"deadline_extension\",\n  \"evidence\": [\n    \"Заказчик обеспечивает получение технических условий на подключение объекта к инженерным сетям и согласования с ресурсоснабжающими организациями.\",\n    \"Расходы на получение ТУ и согласования несёт Заказчик.\",\n    \"При задержке предоставления согласований сроки\
      \ выполнения работ продлеваются на соответствующий период.\",\n    \"Подлежат получению согласования с МЧС и Роспотребнадзором.\"\n  ]\n}\n\nПример 2 — тема не раскрыта:\nТекст: «Подрядчик выполняет работы в объёме, предусмотренном договором.»\n\nОтвет:\n{\n  \"tu_acquisition_defined\": \"not_found\",\n  \"tu_responsibility\": \"not_found\",\n  \"tu_cost_bearer\": \"not_found\",\n  \"external_approvals_listed\": \"not_found\",\n  \"approval_delay_consequences\": \"not_found\",\n  \"evidence\": []\n}\n\n[ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]\n1. Есть ли в тексте именно ТУ на подключение или внешние согласования?\n2. Ясно ли разделены обязанность получить ТУ и обязанность оплатить их получение?\n3. Перечислены ли конкретные органы или организации?\n4. Указано ли прямое последствие задержки согласований?\n5. Не спутаны ли эти условия с экспертизой ПД?\n\n[ФОРМАТ ОТВЕТА]\nВерни строго JSON:\n{\n  \"tu_acquisition_defined\": \"<yes / no / not_found>\",\n  \"tu_responsibility\": \"<contractor /\
      \ client / jointly / not_specified / not_found>\",\n  \"tu_cost_bearer\": \"<contractor / client / jointly / not_specified / not_found>\",\n  \"external_approvals_listed\": \"<yes / no / not_found>\",\n  \"approval_delay_consequences\": \"<deadline_extension / contractor_risk / not_specified / not_found>\",\n  \"evidence\": [\"<цитата 1>\", \"<цитата 2>\"]\n}\n"
    prompt_file: null
    context_k: 6
    temperature: 0.0
    max_tokens: 520
