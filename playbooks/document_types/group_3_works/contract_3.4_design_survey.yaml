- id: pir_subject_extraction
  name: 'ПИР: базовое извлечение предмета договора'
  description: Извлекает наименование объекта, вид работ, стадию проектирования, ссылку на ТЗ
  triggers: null
  ui_mode: field_extraction
  severity: critical
  severity_if_pass: pass
  severity_if_fail: critical
  severity_if_unclear: critical
  origin: DOCUMENT_TYPE
  detector_type: hybrid
  rules:
    keywords:
    - проектная документация
    - рабочая документация
    - инженерные изыскания
    - предмет договора
    - объект проектирования
    - стадия П
    - стадия Р
    keyword_mode: any
    regex_patterns:
    - (?i)(стади[яи]\s*[«"']?[ПР][»"']?|проектная\s+документация|рабочая\s+документация)
    - (?i)(проектн.*и.*изыскательск|инженерн.*изыскани)
  llm:
    prompt_template: "[КОНТЕКСТ]\nТы — юрист, анализирующий договор на выполнение проектных\nи изыскательских работ (ПИР) (ст. 758 ГК РФ).\nПроверяется только один вопрос: предмет договора — что именно\nобязан выполнить подрядчик, на каком объекте и в какой стадии.\n\nВажно:\n— Анализируй только разделы «Предмет договора» и вводную часть.\n— Не оценивай риски. Только извлекай факты о предмете договора.\n— Если сведения явно не указаны в тексте — значение \"not_found\".\n\n[ЗАДАЧА]\n1. Установить вид работ: проектные / изыскательские / комплексные.\n2. Извлечь наименование объекта проектирования.\n3. Извлечь местоположение (адрес) объекта.\n4. Установить стадию проектирования: П / Р / обе.\n5. Найти ссылку на техническое задание (номер приложения).\n6. Установить, перечислены ли разделы проектной документации в договоре.\n\n[ПРАВИЛА]\n1. work_type: \"design\" — только проектные работы;\n   \"survey\" — только инженерные изыскания без проектирования;\n   \"design_and_survey\" — одновременно\
      \ проектирование и изыскания;\n   \"not_found\" — вид работ не определён.\n2. design_stage: \"P\" — только стадия «Проектная документация»;\n   \"R\" — только стадия «Рабочая документация»;\n   \"P_and_R\" — обе стадии предусмотрены договором;\n   \"not_found\" — стадия не определена.\n3. object_name: извлекай официальное наименование объекта из текста.\n   Не сокращай и не перефразируй.\n4. object_location: адрес или описание местоположения объекта.\n   Если указан только субъект РФ или населённый пункт — указывай его.\n5. tz_reference: номер или наименование приложения с ТЗ.\n   Если ТЗ упомянуто, но номер приложения не указан — \"referenced_no_number\".\n6. design_sections_listed: \"yes\" — если в договоре или приложении\n   перечислены конкретные разделы ПД (например, АР, КР, ОВиК и т.д.);\n   \"no\" — если разделы не перечислены; \"not_found\" — информация отсутствует.\n7. Не переходи в разделы об оплате, сроках, ответственности или экспертизе.\n\n[ПРИМЕРЫ (FEW-SHOT)]\nПример\
      \ 1 — предмет определён:\nТекст: «Подрядчик обязуется выполнить проектные работы (стадия П и Р)\nпо объекту \"Многоквартирный жилой дом по адресу: г. Казань, ул. Баумана, 15\"\nв соответствии с Техническим заданием (Приложение № 1 к договору).\nСостав документации: раздел АР, раздел КР, раздел ОВиК, раздел ЭО.»\n\nОтвет:\n{\n  \"work_type\": \"design\",\n  \"object_name\": \"Многоквартирный жилой дом по адресу: г. Казань, ул. Баумана, 15\",\n  \"object_location\": \"г. Казань, ул. Баумана, 15\",\n  \"design_stage\": \"P_and_R\",\n  \"tz_reference\": \"Приложение № 1\",\n  \"design_sections_listed\": \"yes\",\n  \"evidence\": [\n    \"Подрядчик обязуется выполнить проектные работы (стадия П и Р) по объекту \\\"Многоквартирный жилой дом по адресу: г. Казань, ул. Баумана, 15\\\" в соответствии с Техническим заданием (Приложение № 1 к договору).\",\n    \"Состав документации: раздел АР, раздел КР, раздел ОВиК, раздел ЭО.\"\n  ]\n}\n\nПример 2 — предмет определён частично:\nТекст: «Подрядчик\
      \ выполняет проектные работы по объекту Заказчика.»\n\nОтвет:\n{\n  \"work_type\": \"design\",\n  \"object_name\": \"not_found\",\n  \"object_location\": \"not_found\",\n  \"design_stage\": \"not_found\",\n  \"tz_reference\": \"not_found\",\n  \"design_sections_listed\": \"not_found\",\n  \"evidence\": [\n    \"Подрядчик выполняет проектные работы по объекту Заказчика.\"\n  ]\n}\n\n[ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]\n1. Извлечено ли официальное наименование объекта без сокращений?\n2. Не перепутаны ли стадия П и стадия Р?\n3. Проверено ли, что tz_reference — это номер приложения, а не просто\n   слово «техническое задание»?\n4. Проверено ли design_sections_listed по факту перечисления разделов,\n   а не по одному лишь упоминанию состава документации?\n5. Все ли значения enum соответствуют allowed_values?\n6. Заполнены ли все ключи JSON?\n\n[ФОРМАТ ОТВЕТА]\nВерни строго JSON без пояснений:\n{\n  \"work_type\": \"<design / survey / design_and_survey / not_found>\",\n  \"object_name\": \"\
      <наименование объекта или not_found>\",\n  \"object_location\": \"<адрес/местоположение или not_found>\",\n  \"design_stage\": \"<P / R / P_and_R / not_found>\",\n  \"tz_reference\": \"<номер приложения / referenced_no_number / not_found>\",\n  \"design_sections_listed\": \"<yes / no / not_found>\",\n  \"evidence\": [\"<цитата 1>\", \"<цитата 2>\"]\n}\n"
