# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: CHECKS_V8 — единственный рабочий слой юридического анализа
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════
checks_v8:

  - id: parties_identification
    name: "Стороны договора: идентификация заказчика и подрядчика"
    description: >
      Фактографическая проверка идентификации сторон договора ПИР —
      заказчика и подрядчика (проектировщика/изыскателя), их реквизитов,
      типов, подписантов, оснований полномочий и корпоративного одобрения.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "заказчик"
        - "подрядчик"
        - "проектировщик"
        - "изыскатель"
        - "именуем"
        - "в лице"
        - "действующего на основании"
        - "крупная сделка"
        - "сделка с заинтересованностью"
        - "одобрение"
        - "устав"
        - "доверенность"
        - "ИНН"
        - "ОГРН"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(заказчик|подрядчик|проектировщик|изыскатель).*именуем"
        - "(?i)действующ[а-яё]+\\s+на\\s+основании"
        - "(?i)крупн(ая|ой)\\s+сделк"
        - "(?i)одобрен(ие|а)"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор на выполнение проектных и изыскательских работ (ПИР)
        (§ 4 Главы 37 ГК РФ, ст. 758–762; ГрК РФ ст. 47–49, 55.8).
        Проверяется только один вопрос: идентификация сторон договора —
        заказчика и подрядчика, их реквизиты, подписанты, основания полномочий
        и корпоративное одобрение.
        Нормативный ориентир:
        - ст. 432 ГК РФ
        - ст. 758 ГК РФ
        - ст. 182 ГК РФ
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Наименование и реквизиты Заказчика (ИНН, ОГРН — для ЮЛ; паспорт — для физлица).
        2. Тип Заказчика (юрлицо / госорган / ИП / физлицо / самозанятый).
        3. Кто подписывает от Заказчика и на каком основании.
        4. Наименование и реквизиты Подрядчика.
        5. Тип Подрядчика.
        6. Кто подписывает от Подрядчика и на каком основании.
        7. Есть ли указание на корпоративное одобрение сделки.

        [ПРАВИЛА]
        1. Используй только текст документа. Не выдумывай реквизиты, ИНН, ОГРН, ФИО — извлекай строго из переданного фрагмента.
        2. Для статусных полей (*_status) допустимы только значения "defined" или "not_defined".
        3. Для текстовых полей при отсутствии данных пиши "Данные не определены". Не используй "None", "null", пустые строки.
        4. Если указан только ИНН без ОГРН (или наоборот) — это "defined", но в details_value отметь: "ОГРН не указан" или "ИНН не указан".
        5. Для полей *_basis_display используй человеко-читаемые значения: "Устав", "Доверенность", "Приказ", "Лично (физлицо)", "Иное основание", "Данные не определены".
        6. В evidence — только точные цитаты из документа с указанием пункта/преамбулы.
        7. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.без комментариев и markdown-обёртки.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — полные реквизиты, доверенность:
        Фрагмент:
        "ООО «СтройПроект» (ИНН 7701234567, ОГРН 1027700123456), именуемое «Подрядчик»,
