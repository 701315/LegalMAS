      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора ПИР сведения об исходных данных:
        перечень, сроки, последствия задержки, оговорка о достоверности.
        Не анализируй цену, экспертизу или иные темы.
        </role>
        <context>
        {context}
        </context>
        <task>
        Заполни строго следующие 8 полей (плюс evidence):
        1. initial_data_list_present — наличие перечня: yes / no / not_defined.
        2. initial_data_list_present_display — человеко-читаемое значение: "Да, перечень указан" / "Нет, перечень не указан" / "Данные не определены".
        3. initial_data_deadlines — сроки предоставления: specified / not_defined.
        4. initial_data_deadlines_display — человеко-читаемое значение: "Да, сроки указаны" / "Данные не определены".
        5. delay_consequences — последствие задержки: deadline_extension / rework_at_client_cost / termination_right / not_defined.
        6. delay_consequences_display — человеко-читаемое значение: "Продление срока выполнения работ" / "Переделка за счёт Заказчика" / "Право Подрядчика на расторжение" / "Данные не определены".
        7. data_accuracy_disclaimer — оговорка о достоверности: yes / no / not_defined.
        8. data_accuracy_disclaimer_display — человеко-читаемое значение: "Да, оговорка есть" / "Нет, оговорки нет" / "Данные не определены".

        Маппинг enum → display:
        - initial_data_list_present: yes → "Да, перечень указан", no → "Нет, перечень не указан", not_defined → "Данные не определены"
        - initial_data_deadlines: specified → "Да, сроки указаны", not_defined → "Данные не определены"
        - delay_consequences: deadline_extension → "Продление срока выполнения работ", rework_at_client_cost → "Переделка за счёт Заказчика", termination_right → "Право Подрядчика на расторжение", not_defined → "Данные не определены"
        - data_accuracy_disclaimer: yes → "Да, оговорка есть", no → "Нет, оговорки нет", not_defined → "Данные не определены"

        Если данные отсутствуют в тексте:
        - enum-поля = "not_defined"
        - текстовые поля = "Данные не определены"
        </task>
        <context_rules>
        - Используй только текст договора. Не выдумывай перечень данных, сроки или последствия — извлекай строго из переданного фрагмента.
        - Не опирайся на внешние знания о типовом содержании договоров ПИР.
        - Верни строго валидный JSON. Все 8 ключей + evidence обязаны присутствовать.
        - Запрещены: null, None, пустые строки "". Для текстовых полей при отсутствии данных — "Данные не определены".
        - Убедись, что enum-значения соответствуют их display-версиям согласно маппингу выше.
        - Различай "no" (тема упоминается, но элемент отсутствует) и "not_defined" (тема вообще не упоминается).
        </context_rules>

        <output_expectations>
        - Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        - Не используй markdown fences.
        - Не добавляй пояснения до или после JSON.
        - Верни все ключи, перечисленные в task, без пропусков.
        - Не используй null, None или пустые строки.
        - Для статусных полей используй только значения из allowed_values или "not_defined".
        - Для текстовых полей при отсутствии данных используй "Данные не определены" / "Не удалось определить" / "Не применимо" — согласно правилам выше.
        </output_expectations>
      fields:
        - name: "initial_data_list_present"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Наличие перечня исходных данных (enum)."
