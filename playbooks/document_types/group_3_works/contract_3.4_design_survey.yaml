- id: designer_liability_for_errors
  name: Ответственность проектировщика за ошибки в ПД (ст. 761 ГК РФ)
  description: 'Проверяет наличие условий об ответственности проектировщика за ошибки,

    включая объём ответственности, лимит (cap), исключение косвенных убытков

    и расходы на переделку СМР. Ошибки в проекте часто всплывают только

    при строительстве или эксплуатации; убытки могут многократно превышать

    стоимость проектных работ.

    '
  legal_base: ст. 761 ГК РФ
  triggers: null
  ui_mode: field_extraction
  severity: critical
  severity_if_pass: pass
  severity_if_fail: critical
  severity_if_unclear: critical
  origin: DOCUMENT_TYPE
  detector_type: hybrid
  rules:
    keywords:
    - ответственность за ошибки
    - ответственность за недостатки
    - недостатки документации
    - переделка
    - устранение дефектов
    - убытки вследствие ошибок
    - ст. 761
    - ответственность ограничена
    - совокупная ответственность
    - не превышает стоимости
    - в пределах цены договора
    - косвенные убытки
    - упущенная выгода
    keyword_mode: any
    regex_patterns:
    - (?i)ответственност.*за.*недостатк.*документац
    - (?i)возмест.*убытк.*вызванн.*ошибк
    - (?i)ст\.?\s*761
    - (?i)ответственност.*ограничен.*стоимост
    - (?i)совокупн.*ответственност.*не.*превыша
    - (?i)не\s+возмеща(ются|ется).*косвенн
  llm:
    prompt_template: "[КОНТЕКСТ]\nТы — юрист, анализирующий договор ПИР.\nПроверяется только один вопрос: ответственность проектировщика за ошибки\nв проектной документации, включая объём ответственности, лимит (cap)\nи исключение косвенных убытков.\n\nВажно:\n— Анализируй только положения об ответственности проектировщика за качество ПД,\n  ограничении ответственности и исключении отдельных видов убытков.\n— Не оценивай риск и не смешивай с неустойкой за просрочку.\n— Если условие не установлено прямо, не домысливай.\n\n[ЗАДАЧА]\n1. Установить, предусмотрена ли ответственность за ошибки в ПД.\n2. Определить объём ответственности.\n3. Установить наличие лимита (cap) совокупной ответственности.\n4. Извлечь размер лимита ответственности.\n5. Установить, исключены ли косвенные убытки и упущенная выгода.\n\n[ПРАВИЛА]\n1. liability_for_errors_present = \"yes\" — если ответственность за ошибки\n   прямо предусмотрена; \"no\" — если тема раскрыта, но ответственность\n   прямо исключена; \"not_found\"\
      \ — если тема отсутствует.\n2. liability_scope = \"documentation_only\" — ответственность ограничена\n   качеством самой документации (переделка ПД);\n   \"includes_construction_rework\" — включает расходы на переделку СМР;\n   \"full_damages\" — полное возмещение всех убытков;\n   \"not_specified\" — тема есть, но объём не определён;\n   \"not_found\" — тема отсутствует.\n3. liability_cap_present = \"yes\" — если установлен предел совокупной\n   ответственности; \"no\" — если тема раскрыта, но cap не установлен;\n   \"not_found\" — тема отсутствует.\n4. liability_cap_amount — сумма, процент или формула лимита;\n   если cap не установлен — \"not_found\".\n5. indirect_damages_excluded = \"yes\" — косвенные убытки / упущенная выгода\n   прямо исключены из ответственности; \"no\" — тема раскрыта,\n   но исключения нет; \"not_found\" — тема отсутствует.\n6. Не путай ответственность за ошибки с неустойкой за просрочку.\n7. Не путай cap с размером страхового покрытия.\n\n[ПРИМЕРЫ (FEW-SHOT)]\n\
      Пример 1 — ответственность и cap урегулированы:\nТекст: «Подрядчик несёт ответственность за недостатки проектной документации,\nвключая расходы на переделку строительных работ, вызванных такими недостатками.\nСовокупная ответственность Подрядчика не может превышать 100% цены договора.\nКосвенные убытки и упущенная выгода возмещению не подлежат.»\n\nОтвет:\n{\n  \"liability_for_errors_present\": \"yes\",\n  \"liability_scope\": \"includes_construction_rework\",\n  \"liability_cap_present\": \"yes\",\n  \"liability_cap_amount\": \"100% цены договора\",\n  \"indirect_damages_excluded\": \"yes\",\n  \"evidence\": [\n    \"Подрядчик несёт ответственность за недостатки проектной документации, включая расходы на переделку строительных работ, вызванных такими недостатками.\",\n    \"Совокупная ответственность Подрядчика не может превышать 100% цены договора.\",\n    \"Косвенные убытки и упущенная выгода возмещению не подлежат.\"\n  ]\n}\n\nПример 2 — тема не раскрыта:\nТекст: «Стороны несут\
      \ ответственность в соответствии с действующим законодательством.»\n\nОтвет:\n{\n  \"liability_for_errors_present\": \"not_found\",\n  \"liability_scope\": \"not_found\",\n  \"liability_cap_present\": \"not_found\",\n  \"liability_cap_amount\": \"not_found\",\n  \"indirect_damages_excluded\": \"not_found\",\n  \"evidence\": [\n    \"Стороны несут ответственность в соответствии с действующим законодательством.\"\n  ]\n}\n\n[ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]\n1. Разграничены ли ответственность за ошибки и неустойка за просрочку?\n2. Определён ли объём ответственности (только ПД vs СМР vs полные убытки)?\n3. Есть ли явный cap с суммой или формулой?\n4. Есть ли явное исключение косвенных убытков?\n5. Все ли ключи JSON совпадают со schema?\n\n[ФОРМАТ ОТВЕТА]\nВерни строго JSON:\n{\n  \"liability_for_errors_present\": \"<yes / no / not_found>\",\n  \"liability_scope\": \"<documentation_only / includes_construction_rework / full_damages / not_specified / not_found>\",\n  \"liability_cap_present\"\
      : \"<yes / no / not_found>\",\n  \"liability_cap_amount\": \"<текст или not_found>\",\n  \"indirect_damages_excluded\": \"<yes / no / not_found>\",\n  \"evidence\": [\"<цитата 1>\", \"<цитата 2>\"]\n}\n"
    prompt_file: null
    context_k: 6
    temperature: 0.0
    max_tokens: 540
  retrieval:
    corpus_scope: document
    context_k: 6
    max_chunks: 8
    retrieval_profile: liability_cap_check
    boost_keywords:
    - ответственность проектировщика
    - ответственность за ошибки
    - недостатки документации
    - убытки
    - ст. 761
