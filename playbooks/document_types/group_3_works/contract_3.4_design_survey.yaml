type: contract_3.4_design_survey
name: Договор на выполнение проектных и изыскательских работ
version: 6.0
parent: class_3_work_performance
description: 'Специализированный вид подряда, направленный на создание интеллектуального продукта:

  проектной и рабочей документации для строительства (стадии «П» и «Р») и/или отчётов

  по инженерным изысканиям. Результат имеет документарную форму и служит основой для

  последующих строительных работ, определяя их стоимость, безопасность и реализуемость.

  Отличается от строительного подряда отсутствием вещественного результата, но сохраняет

  признаки работы по заданию. Регулируется § 4 Главы 37 ГК РФ (ст. 758–762)

  и Градостроительным кодексом РФ (ст. 47–49, 55.8).

  '
