          required: false
          display_in_grid: true
          display_priority: 4

  - id: additional_works_procedure
    name: "Дополнительные работы: порядок согласования и оплаты (ст. 743 ГК РФ)"
    description: >
      Фактографическая проверки процедуры выполнения дополнительных работ и работ
      по изменению объема в договоре на выполнение проектных и изыскательских работ
      (ПИР) в соответствии со ст. 743 ГК РФ. В процессе ПИР заказчик часто меняет
      техническое задание, требует дополнительные разделы проектной документации или
      архитектурные решения, что приводит к необходимости выполнения дополнительных
      работ. Проверка выявляет шесть критических аспектов: (1) наличие процедуры
      инициирования дополнительных работ — кто вправе инициировать (заказчик / подрядчик
      / обе стороны); (2) форма согласования — обязательное подписание дополнительного
      соглашения до начала выполнения дополнительных работ или допустимо устное/электронное
      согласование; (3) согласование новой цены дополнительных работ — фиксированная
      сумма, процент от цены договора, по фактическим затратам; (4) согласование нового
      срока выполнения дополнительных работ; (5) право подрядчика приостановить выполнение
      дополнительных работ при отсутствии согласования цены и срока — ключевая защита
      подрядчика от выполнения работ «впустую»; (6) обязанность заказчика оплатить
      фактически выполненные дополнительные работы, даже если они не были согласованы
      должным образом, но были приняты заказчиком. Отсутствие или неполнота регулирования
      дополнительных работ создаёт риски споров об оплате выполненных работ, срыве сроков
      и качестве дополнительных проектных решений.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "дополнительные работы"
        - "дополнительное соглашение"
        - "изменение объема"
        - "изменение технического задания"
        - "доп. работы"
        - "дополнительные услуги"
        - "приостановить выполнение"
        - "согласование цены"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)дополнит(ельн|ельные)\\s+работ"
        - "(?i)изменени(е|я)\\s+объ(ема|ём)"
        - "(?i)дополнит(ельн|ельное)\\s+соглашен"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор на выполнение проектных и изыскательских работ (ПИР)
        (§ 4 Главы 37 ГК РФ, ст. 743).
        Проверяется только один вопрос: процедура выполнения дополнительных работ
        и работ по изменению объема.
        Нормативный ориентир:
        - ст. 743 ГК РФ (техническая документация и смета)
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не выдумывай условия — извлекай строго из переданного фрагмента.
        - Не путай дополнительные работы с изменением ТЗ без изменения объема (это разные институты).
        - Не путай дополнительные работы с изменением цены по этапу (Check 8).

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Процедура инициирования дополнительных работ.
        2. Форма согласования (доп. соглашение / иное).
        3. Согласование цены дополнительных работ.
        4. Согласование срока дополнительных работ.
        5. Право подрядчика приостановить работы при несогласовании.
        6. Оплата фактически выполненных дополнительных работ.

        [ПРАВИЛА]
        1. Используй только текст документа. Не выдумывай условия — извлекай строго из переданного фрагмента.
        2. Для enum-полей при отсутствии данных используй значение "not_defined".
        3. Для текстовых полей при отсутствии данных пиши "Данные не определены".
        4. Для полей *_display используй человеко-читаемые значения согласно маппингу.
        5. Различай:
           - "yes" — условие прямо указано
           - "no" — условие прямо исключено
           - "not_defined" — условие не упоминается
           - "client_initiated" — инициирование только заказчиком
           - "contractor_initiated" — инициирование только подрядчиком
           - "both" — инициирование обеими сторонами
           - "addendum_required" — обязательно доп. соглашение
           - "written_request" — достаточно письменного запроса
           - "oral_or_electronic" — допустимо устное/электронное согласование
           - "fixed_amount" — фиксированная сумма
           - "percentage_of_price" — процент от цены договора
           - "actual_costs" — по фактическим затратам
        6. Критическое правило:
           - Если additional_works_procedure_present = "no" (процедура прямо исключена), то все остальные поля = "not_defined", display = "Не применимо".
           - Если additional_works_procedure_present = "not_defined" (условие не упоминается), то все остальные поля = "not_defined", display = "Данные не определены".
        7. Не путай:
           - Дополнительные работы (этот check) с изменением ТЗ без изменения объема
           - Дополнительные работы с изменением цены по этапу (Check 8)
