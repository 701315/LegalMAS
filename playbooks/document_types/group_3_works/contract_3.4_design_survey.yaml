# ──────────────────────────────────────────────────────────────────────────
# CHECK 10: Автопродление сроков при задержке заказчика
# ──────────────────────────────────────────────────────────────────────────
- id: auto_deadline_extension
  name: "Автопродление сроков при задержке согласования заказчиком (ст. 328, 719 ГК РФ)"
  description: "Проверяет наличие условия о продлении сроков при задержке со стороны заказчика"
  legal_base: "ст. 328, 719 ГК РФ"
  triggers: ~
  ui_mode: "field_extraction"
  severity: "high"
  origin: "DOCUMENT_TYPE"
  detector_type: "hybrid"
  rules:
    keywords:
      - "продление сроков"
      - "автоматическое продление"
      - "задержка согласования"
      - "время рассмотрения не включается"
      - "обязанность предоставить замечания в течение"
      - "просрочка заказчика"
      - "встречное исполнение"
    keyword_mode: "any"
    regex_patterns:
      - "(?i)срок.*продлева(ется|ться).*на.*срок.*задержк"
      - "(?i)не\\s+включа(ется|ться)\\s+в\\s+срок\\s+выполнени"
  llm:
    prompt_template: |
      [КОНТЕКСТ]
      Ты — юрист, анализирующий договор ПИР.
      Проверяется только один вопрос: продлеваются ли сроки выполнения работ
      при задержке со стороны заказчика и как именно работает такой механизм.

      Важно:
      — Анализируй только положения о продлении сроков, задержке согласования,
        задержке предоставления замечаний или иных действиях заказчика.
      — Не оценивай риск и не смешивай это условие с форс-мажором.
      — Если порядок продления не установлен прямо, не домысливай его.

      [ЗАДАЧА]
      1. Установить, предусмотрено ли продление сроков при задержке заказчика.
      2. Определить триггер такого продления.
      3. Определить механизм продления.
      4. Определить правило расчёта продолжительности продления.
      5. Установить, есть ли право подрядчика приостановить работы.

      [ПРАВИЛА]
      1. auto_extension_present = "yes" — если договор прямо предусматривает
         продление сроков при задержке действий заказчика; "no" — если тема есть,
         но продление прямо исключено или не предусмотрено; "not_found" — тема отсутствует.
      2. extension_trigger = "approval_delay" — задержка согласования результатов;
         "review_delay" — просрочка рассмотрения/замечаний/ответа;
         "mixed" — несколько триггеров; "not_specified" — продление есть,
         но триггер не конкретизирован; "not_found" — тема отсутствует.
      3. extension_mode = "automatic" — срок продлевается автоматически;
         "notice_based" — после уведомления подрядчика;
         "by_addendum" — только по допсоглашению;
         "not_specified" — механизм неясен; "not_found" — тема отсутствует.
      4. extension_duration_rule = "equal_delay" — продление на период задержки;
         "fixed_days" — фиксированное число дней; "not_specified" — продление есть,
         но правило неясно; "not_found" — тема отсутствует.
      5. suspension_right = "yes" — есть право приостановить работы;
         "no" — тема раскрыта, но такого права нет; "not_found" — тема отсутствует.
      6. Не путай задержку заказчика с задержкой экспертизы третьими лицами.
      7. Не извлекай общие положения о форс-мажоре как продление по вине заказчика.

      [ПРИМЕРЫ (FEW-SHOT)]
      Пример 1 — продление предусмотрено:
      Текст: «В случае несвоевременного согласования Заказчиком промежуточных результатов
      срок выполнения работ автоматически продлевается на период такой задержки.
      Подрядчик вправе приостановить работы до получения согласования.»

      Ответ:
      {
        "auto_extension_present": "yes",
        "extension_trigger": "approval_delay",
        "extension_mode": "automatic",
        "extension_duration_rule": "equal_delay",
        "suspension_right": "yes",
        "evidence": [
          "В случае несвоевременного согласования Заказчиком промежуточных результатов срок выполнения работ автоматически продлевается на период такой задержки.",
          "Подрядчик вправе приостановить работы до получения согласования."
        ]
      }

      Пример 2 — тема не раскрыта:
      Текст: «Подрядчик обязан выполнить работы в установленный срок.»

      Ответ:
      {
        "auto_extension_present": "not_found",
        "extension_trigger": "not_found",
        "extension_mode": "not_found",
        "extension_duration_rule": "not_found",
        "suspension_right": "not_found",
        "evidence": []
      }

      [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
      1. Есть ли именно задержка со стороны заказчика, а не иного лица?
      2. Определён ли триггер продления отдельно от механизма продления?
      3. Есть ли правило расчёта периода продления?
      4. Есть ли отдельное право на приостановление работ?
      5. Все ли значения enum соответствуют schema?

      [ФОРМАТ ОТВЕТА]
      Верни строго JSON:
      {
        "auto_extension_present": "<yes / no / not_found>",
        "extension_trigger": "<approval_delay / review_delay / mixed / not_specified / not_found>",
        "extension_mode": "<automatic / notice_based / by_addendum / not_specified / not_found>",
        "extension_duration_rule": "<equal_delay / fixed_days / not_specified / not_found>",
        "suspension_right": "<yes / no / not_found>",
        "evidence": ["<цитата 1>", "<цитата 2>"]
      }
    prompt_file: null
    context_k: 5
    temperature: 0.0
    max_tokens: 500
  retrieval:
    retrieval_profile: "completion_deadline_check"
    corpus_scope: "document"
    context_k: 5
    max_chunks: 8
    boost_keywords:
