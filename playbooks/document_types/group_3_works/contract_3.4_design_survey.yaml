        4. tz_compliance_guaranteed_display — человеко-читаемое значение: "Да, гарантия предусмотрена" / "Нет, гарантия не предусмотрена" / "Данные не определены" / "Не применимо".
        5. norms_referenced — ссылки на нормативы: yes / general_reference / no / not_defined.
