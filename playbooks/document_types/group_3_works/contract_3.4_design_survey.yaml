  - id: stagewise_approval_procedure
    name: "Поэтапное согласование и право отклонения промежуточных результатов"
    description: >
      Фактографическая проверка процедуры поэтапного согласования промежуточных
      результатов в договоре на выполнение проектных и изыскательских работ (ПИР)
      в соответствии со ст. 760 ГК РФ. Для договоров ПИР характерна специфика
      приёмки: работы выполняются по этапам (стадия «П» — проектная документация,
      стадия «Р» — рабочая документация, отдельные этапы по видам изысканий), и
      каждый промежуточный результат подлежит согласованию с заказчиком до перехода
      к следующему этапу. Проверка выявляет шесть критических аспектов: (1) предусмотрено
      ли поэтапное согласование промежуточных результатов; (2) срок рассмотрения
      заказчиком каждого этапа (типично 5–15 рабочих дней); (3) право заказчика
      направить мотивированные замечания — стандартный механизм контроля качества;
      (4) авто-приёмка при молчании заказчика — критически важный механизм защиты
      подрядчика от затягивания согласования («если замечания не поступили в указанный
      срок, этап считается согласованным»); (5) порядок согласования отступлений
      от технического задания — в процессе проектирования часто возникают объективные
      отступления от первоначального ТЗ, и порядок их согласования должен быть чётко
      урегулирован (обычно через дополнительное соглашение); (6) порядок согласования
      изменений объёма работ — механизм контроля дополнительных работ и предотвращения
      споров о стоимости. Отсутствие или неполнота регулирования поэтапного согласования —
      типичная причина споров о качестве проектной документации, обоснованности замечаний
      заказчика и сроках выполнения работ.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "поэтапное согласование"
        - "эскизный проект"
        - "утверждение этапа"
        - "замечания заказчика"
        - "срок рассмотрения"
        - "отклонение промежуточного результата"
        - "мотивированный отказ"
        - "отступление от ТЗ"
        - "изменение ТЗ"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)поэтапн(ое|ого)\\s+согласован"
        - "(?i)замечан(ия|ий)\\s+заказчик"
        - "(?i)срок\\s+рассмотрен"
        - "(?i)отступлени(е|я)\\s+от\\s+(ТЗ|техническ)"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор на выполнение проектных и изыскательских работ (ПИР)
        (§ 4 Главы 37 ГК РФ, ст. 760).
        Проверяется только один вопрос: процедура поэтапного согласования
        промежуточных результатов и порядок отступлений от ТЗ.
        Нормативный ориентир:
        - ст. 760 ГК РФ (сдача-приёмка результатов ПИР)
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не выдумывай сроки, условия или процедуры — извлекай строго из переданного фрагмента.
        - Не путай согласование промежуточных результатов с итоговой приёмкой.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Предусмотрено ли поэтапное согласование промежуточных результатов.
        2. Срок рассмотрения заказчиком.
        3. Право заказчика на мотивированные замечания.
        4. Авто-приёмка при молчании.
        5. Порядок согласования отступлений от ТЗ.
        6. Порядок согласования изменений объёма работ.

        [ПРАВИЛА]
        1. Используй только текст документа. Не выдумывай сроки, условия или процедуры — извлекай строго из переданного фрагмента.
        2. Для enum-полей при отсутствии данных используй значение "not_defined".
        3. Для текстовых полей при отсутствии данных пиши "Данные не определены".
        4. Для полей *_display используй человеко-читаемые значения согласно маппингу.
        5. Различай:
           - "yes" — условие прямо указано в договоре
           - "no" — условие прямо исключено (например, "поэтапное согласование не предусмотрено")
           - "not_defined" — условие вообще не упоминается в договоре
           - "defined" — порядок урегулирован в договоре
           - "not_defined" — порядок не урегулирован
        6. Критическое правило:
           - Если stagewise_approval_present = "no" (поэтапное согласование прямо исключено), то все остальные поля (right_to_remarks, auto_approval_on_silence, tz_deviation_procedure, scope_change_procedure) = "not_defined", а их display-версии = "Не применимо". Поле review_period_days = "Не применимо".
           - Если stagewise_approval_present = "not_defined" (условие не упоминается), то остальные поля = "not_defined", display = "Данные не определены".
        7. Не путай:
           - Согласование промежуточных результатов (этот check) с итоговой приёмкой
           - Срок рассмотрения промежуточного результата со сроком выполнения работ
           - Отступления от ТЗ с изменениями объёма работ
        8. Если срок рассмотрения определяется по приложению/графику (например, "Срок рассмотрения — согласно Графику согласования (Приложение № 4)") — это валидный исход, укажи ссылку в review_period_days.
        9. В evidence — только точные цитаты из документа с указанием пункта.
        10. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.без комментариев и markdown-обёртки.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — полный набор условий:
        Фрагмент:
        "По завершении каждого этапа Подрядчик передаёт промежуточный
        результат Заказчику для согласования. Заказчик рассматривает результат
        в течение 10 рабочих дней и направляет мотивированные замечания или
        утверждает этап. Если замечания не поступили в указанный срок, этап
        считается согласованным. Отступления от ТЗ согласовываются путём
        подписания дополнительного соглашения. Изменения объёма работ
