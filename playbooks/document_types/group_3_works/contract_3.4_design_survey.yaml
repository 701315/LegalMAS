      \   \"none\" — право прямо исключено; \"not_found\" — тема отсутствует.\n2. partial_work_payment: \"defined\" — порядок оплаты установлен;\n   \"not_defined\" — тема есть, но порядок неясен; \"not_found\" — тема отсутствует.\n3. documentation_return: \"defined\" — урегулирован; \"not_defined\" — тема есть,\n   но не урегулирована; \"not_found\" — тема отсутствует.\n4. termination_penalty_present: \"yes\" — штраф за расторжение есть;\n   \"no\" — тема раскрыта, но штрафа нет; \"not_found\" — тема отсутствует.\n5. termination_notice_period: текст с указанием периода или \"not_found\".\n6. Не добавляй ключи, не входящие в список полей.\n7. Верни только JSON.\n</rules>\n"
    fields:
