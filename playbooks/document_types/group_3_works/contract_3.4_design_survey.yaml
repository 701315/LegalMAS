- id: warranty_period_for_documentation
  name: Гарантийный срок на проектную документацию (ст. 724, 761 ГК РФ)
  description: 'Проверяет наличие гарантийного срока, в течение которого проектировщик обязан

    безвозмездно устранять дефекты, и порядок предъявления претензий по качеству.

    '
  legal_base: ст. 724, 761 ГК РФ
  triggers: null
  ui_mode: field_extraction
  severity: high
  severity_if_pass: pass
  severity_if_fail: high
  severity_if_unclear: high
  origin: DOCUMENT_TYPE
  detector_type: hybrid
  rules:
    keywords:
    - гарантийный срок
    - гарантия на документацию
    - безвозмездное устранение
    - дефекты документации
    - гарантийные обязательства
    keyword_mode: any
    regex_patterns:
    - (?i)гарантийн(ый|ого)\s+срок
    - (?i)безвозмездн(ое|ого)\s+устранен
  llm:
    prompt_template: "[КОНТЕКСТ]\nТы — юрист, анализирующий договор ПИР.\nПроверяется только один вопрос: установлен ли гарантийный срок\nна проектную документацию, его продолжительность, момент начала\nи порядок устранения дефектов в гарантийный период.\n\nВажно:\n— Анализируй только положения о гарантийном сроке на ПД\n  и безвозмездном устранении дефектов.\n— Не оценивай риск и не смешивай гарантийный срок с гарантией качества (соответствия нормам).\n— Если условие не установлено прямо, не домысливай.\n\n[ЗАДАЧА]\n1. Установить, определён ли гарантийный срок.\n2. Извлечь продолжительность гарантийного срока.\n3. Определить момент начала отсчёта.\n4. Установить, предусмотрено ли безвозмездное устранение дефектов.\n5. Извлечь срок устранения дефектов в гарантийный период.\n\n[ПРАВИЛА]\n1. warranty_period_present = \"yes\" — гарантийный срок установлен;\n   \"no\" — тема раскрыта, но срок не установлен;\n   \"not_found\" — тема отсутствует.\n2. warranty_period_duration — продолжительность\
      \ (текст);\n   если не указана — \"not_found\".\n3. warranty_start_event = \"from_acceptance\" — с даты подписания акта приёмки;\n   \"from_commissioning\" — с ввода объекта в эксплуатацию;\n   \"from_expertise\" — с даты положительного заключения;\n   \"not_specified\" — момент начала не определён;\n   \"not_found\" — тема отсутствует.\n4. free_defect_remedy = \"yes\" — безвозмездное устранение предусмотрено;\n   \"no\" — тема раскрыта, но безвозмездности нет;\n   \"not_found\" — тема отсутствует.\n5. defect_remedy_period — срок устранения дефектов (текст);\n   если не указан — \"not_found\".\n6. Не путай гарантийный срок (период после сдачи) с гарантией качества (соответствие нормам).\n7. Если тема не затронута — все = \"not_found\".\n\n[ПРИМЕРЫ (FEW-SHOT)]\nПример 1 — гарантийный срок установлен:\nТекст: «Гарантийный срок на проектную документацию составляет 36 месяцев\nс даты подписания акта сдачи-приёмки. В течение гарантийного срока\nПодрядчик обязан безвозмездно устранить дефекты\
      \ документации\nв течение 15 рабочих дней с момента получения претензии.»\n\nОтвет:\n{\n  \"warranty_period_present\": \"yes\",\n  \"warranty_period_duration\": \"36 месяцев\",\n  \"warranty_start_event\": \"from_acceptance\",\n  \"free_defect_remedy\": \"yes\",\n  \"defect_remedy_period\": \"15 рабочих дней\",\n  \"evidence\": [\n    \"Гарантийный срок на проектную документацию составляет 36 месяцев с даты подписания акта сдачи-приёмки.\",\n    \"В течение гарантийного срока Подрядчик обязан безвозмездно устранить дефекты документации в течение 15 рабочих дней с момента получения претензии.\"\n  ]\n}\n\nПример 2 — тема не раскрыта:\nТекст: «Подрядчик гарантирует качество проектной документации.»\n\nОтвет:\n{\n  \"warranty_period_present\": \"not_found\",\n  \"warranty_period_duration\": \"not_found\",\n  \"warranty_start_event\": \"not_found\",\n  \"free_defect_remedy\": \"not_found\",\n  \"defect_remedy_period\": \"not_found\",\n  \"evidence\": [\n    \"Подрядчик гарантирует качество\
      \ проектной документации.\"\n  ]\n}\n\n[ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]\n1. Есть ли именно гарантийный срок (период), а не гарантия качества?\n2. Извлечена ли продолжительность в месяцах или годах?\n3. Определён ли момент начала отсчёта?\n4. Есть ли безвозмездное устранение дефектов?\n5. Все ли ключи JSON совпадают со schema?\n\n[ФОРМАТ ОТВЕТА]\nВерни строго JSON:\n{\n  \"warranty_period_present\": \"<yes / no / not_found>\",\n  \"warranty_period_duration\": \"<текст или not_found>\",\n  \"warranty_start_event\": \"<from_acceptance / from_commissioning / from_expertise / not_specified / not_found>\",\n  \"free_defect_remedy\": \"<yes / no / not_found>\",\n  \"defect_remedy_period\": \"<текст или not_found>\",\n  \"evidence\": [\"<цитата 1>\", \"<цитата 2>\"]\n}\n"
    prompt_file: null
    context_k: 5
    temperature: 0.0
    max_tokens: 480
  retrieval:
    retrieval_profile: warranties_check
    corpus_scope: document
    context_k: 5
    max_chunks: 8
    boost_keywords:
    - гарантийный срок
    - безвозмездное устранение
    - дефекты документации
    - гарантийные обязательства
    negative_keywords:
    - гарантирует соответствие
    - экспертиза
    - форс-мажор
    - подсудность
    rerank: true
    filters: {}
  enrichment_hints:
    preferred_segment_types:
    - clause
    - article
    excluded_segment_types:
    - signature_block
    preferred_clause_functions:
    - representations
    - remedies
    confidence_bonus_on_match: 0.1
    confidence_penalty_on_excluded_segment: 0.12
  evidence:
    required: true
    min_snippet_length: 40
    max_snippet_length: 600
  extraction:
    enabled: true
    mode: hybrid
    store_payload: true
    llm_max_tokens: 700
    compact_output: false
    llm_prompt_extraction: "<role>\nТы — юрист, извлекающий сведения о гарантийном сроке на ПД\nв договоре ПИР. Не оценивай риски. Только заполняй поля строго по тексту.\n</role>\n\n<context>\n{context}\n</context>\n\n<task>\nЗаполни строго следующие поля:\n\nwarranty_period_present — установлен ли гарантийный срок\n  (allowed: yes / no / not_found).\n\nwarranty_period_duration — продолжительность гарантийного срока\n  (текстовое значение или not_found).\n\nwarranty_start_event — момент начала отсчёта\n  (allowed: from_acceptance / from_commissioning / from_expertise / not_specified / not_found).\n\nfree_defect_remedy — безвозмездное устранение дефектов\n  (allowed: yes / no / not_found).\n\ndefect_remedy_period — срок устранения дефектов\n  (текстовое значение или not_found).\n\nЕсли данные отсутствуют: указывай \"not_found\".\n</task>\n\n<rules>\n1. warranty_period_present: \"yes\" — срок установлен; \"no\" — тема есть,\n   но срок нет; \"not_found\" — тема отсутствует.\n2. warranty_period_duration:\
      \ текст с единицей; или \"not_found\".\n3. warranty_start_event: \"from_acceptance\" — с приёмки;\n   \"from_commissioning\" — с ввода в эксплуатацию;\n   \"from_expertise\" — с положительного заключения;\n   \"not_specified\" — неясно; \"not_found\" — тема отсутствует.\n4. free_defect_remedy: \"yes\" — безвозмездно; \"no\" — нет;\n   \"not_found\" — тема отсутствует.\n5. defect_remedy_period: текст с единицей; или \"not_found\".\n6. Не добавляй ключи, не входящие в список полей.\n7. Верни только JSON.\n</rules>\n"
    fields:
    - name: warranty_period_present
      type: string
      label: Гарантийный срок
      presentation: badge
      display_in_grid: true
      display_priority: 1
      allowed_values:
      - 'yes'
      - 'no'
      - not_found
      description: Установлен ли гарантийный срок на ПД.
      required: true
    - name: warranty_period_duration
      type: string
      label: Продолжительность
      presentation: text
      display_in_grid: true
      display_priority: 2
      description: Продолжительность гарантийного срока.
      max_value_chars: 100
      required: false
    - name: warranty_start_event
      type: string
      label: Начало отсчёта
      presentation: badge
      display_in_grid: false
      display_priority: 4
      allowed_values:
      - from_acceptance
      - from_commissioning
      - from_expertise
      - not_specified
      - not_found
      description: Момент начала отсчёта гарантийного срока.
      required: false
    - name: free_defect_remedy
      type: string
      label: Безвозмездное устранение
      presentation: badge
      display_in_grid: true
      display_priority: 3
      allowed_values:
      - 'yes'
      - 'no'
      - not_found
      description: Предусмотрено ли безвозмездное устранение дефектов.
      required: false
    - name: defect_remedy_period
      type: string
      label: Срок устранения дефектов
      presentation: text
      display_in_grid: false
      display_priority: 5
      description: Срок устранения дефектов в гарантийный период.
      max_value_chars: 100
      required: false
- id: penalty_for_delay
  name: Неустойка за просрочку выполнения работ (ст. 330 ГК РФ)
  description: Проверяет наличие, размер и формулу неустойки за нарушение сроков обеими сторонами
  legal_base: ст. 330 ГК РФ
  triggers: null
  ui_mode: field_extraction
  severity: high
  severity_if_pass: pass
  severity_if_fail: high
  severity_if_unclear: high
  origin: DOCUMENT_TYPE
  detector_type: hybrid
  rules:
    keywords:
    - неустойка
    - пеня
    - штраф
    - за каждый день просрочки
    - процент за просрочку
    keyword_mode: any
    regex_patterns:
    - (?i)неустойк(а|и|у).*\d
    - (?i)пен(я|и|ю).*\d.*%
    - (?i)за\s+каждый\s+день\s+просрочк
  llm:
    prompt_template: "[КОНТЕКСТ]\nТы — юрист, анализирующий договор ПИР.\nПроверяется только один вопрос: предусмотрена ли неустойка (пеня, штраф)\nза просрочку выполнения обязательств и как она рассчитывается.\n\nВажно:\n— Анализируй только положения о неустойке, пене и штрафах за просрочку.\n— Не оценивай риск и не смешивай неустойку с убытками или ответственностью за ошибки.\n— Если условие не установлено прямо, не домысливай.\n\n[ЗАДАЧА]\n1. Установить, предусмотрена ли неустойка для подрядчика.\n2. Извлечь размер/ставку неустойки для подрядчика.\n3. Определить базис расчёта неустойки.\n4. Установить, предусмотрена ли встречная неустойка для заказчика.\n5. Извлечь размер/ставку встречной неустойки.\n6. Установить, есть ли cap на неустойку.\n\n[ПРАВИЛА]\n1. contractor_penalty_present = \"yes\" — неустойка для подрядчика\n   предусмотрена; \"no\" — тема раскрыта, но неустойки нет;\n   \"not_found\" — тема отсутствует.\n2. contractor_penalty_rate — размер/ставка неустойки (текст):\n   например,\
      \ \"0,1% от цены договора за каждый день просрочки\";\n   если не указан — \"not_found\".\n3. penalty_basis = \"contract_price\" — от цены договора;\n   \"stage_price\" — от стоимости этапа;\n   \"overdue_amount\" — от суммы просроченного обязательства;\n   \"fixed_amount\" — фиксированная сумма;\n   \"not_specified\" — базис неясен;\n   \"not_found\" — тема отсутствует.\n4. client_penalty_present = \"yes\" — встречная неустойка для заказчика\n   (за просрочку оплаты, согласования и т.п.) предусмотрена;\n   \"no\" — тема раскрыта, но встречной неустойки нет;\n   \"not_found\" — тема отсутствует.\n5. client_penalty_rate — размер/ставка встречной неустойки (текст);\n   если нет — \"not_found\".\n6. penalty_cap_present = \"yes\" — установлено ограничение (cap)\n   суммы неустойки; \"no\" — тема раскрыта, но cap нет;\n   \"not_found\" — тема отсутствует.\n7. Не путай неустойку за просрочку с убытками, штрафом за расторжение\n   или штрафом за нарушение конфиденциальности.\n\n[ПРИМЕРЫ (FEW-SHOT)]\n\
      Пример 1 — неустойка для обеих сторон:\nТекст: «За нарушение сроков выполнения работ Подрядчик уплачивает\nнеустойку в размере 0,1% от цены договора за каждый день просрочки,\nно не более 10% от цены договора. За просрочку оплаты Заказчик\nуплачивает пеню в размере 0,05% от суммы просроченного платежа\nза каждый день просрочки.»\n\nОтвет:\n{\n  \"contractor_penalty_present\": \"yes\",\n  \"contractor_penalty_rate\": \"0,1% от цены договора за каждый день просрочки\",\n  \"penalty_basis\": \"contract_price\",\n  \"client_penalty_present\": \"yes\",\n  \"client_penalty_rate\": \"0,05% от суммы просроченного платежа за каждый день просрочки\",\n  \"penalty_cap_present\": \"yes\",\n  \"evidence\": [\n    \"За нарушение сроков выполнения работ Подрядчик уплачивает неустойку в размере 0,1% от цены договора за каждый день просрочки, но не более 10% от цены договора.\",\n    \"За просрочку оплаты Заказчик уплачивает пеню в размере 0,05% от суммы просроченного платежа за каждый день просрочки.\"\
      \n  ]\n}\n\nПример 2 — тема не раскрыта:\nТекст: «Стороны несут ответственность в соответствии с законодательством.»\n\nОтвет:\n{\n  \"contractor_penalty_present\": \"not_found\",\n  \"contractor_penalty_rate\": \"not_found\",\n  \"penalty_basis\": \"not_found\",\n  \"client_penalty_present\": \"not_found\",\n  \"client_penalty_rate\": \"not_found\",\n  \"penalty_cap_present\": \"not_found\",\n  \"evidence\": [\n    \"Стороны несут ответственность в соответствии с законодательством.\"\n  ]\n}\n\n[ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]\n1. Разграничены ли неустойка подрядчика и неустойка заказчика?\n2. Корректно ли определён базис расчёта?\n3. Есть ли cap на неустойку?\n4. Не перепутана ли неустойка за просрочку с иными штрафами?\n5. Все ли ключи JSON совпадают со schema?\n\n[ФОРМАТ ОТВЕТА]\nВерни строго JSON:\n{\n  \"contractor_penalty_present\": \"<yes / no / not_found>\",\n  \"contractor_penalty_rate\": \"<текст или not_found>\",\n  \"penalty_basis\": \"<contract_price / stage_price / overdue_amount\
      \ / fixed_amount / not_specified / not_found>\",\n  \"client_penalty_present\": \"<yes / no / not_found>\",\n  \"client_penalty_rate\": \"<текст или not_found>\",\n  \"penalty_cap_present\": \"<yes / no / not_found>\",\n  \"evidence\": [\"<цитата 1>\", \"<цитата 2>\"]\n}\n"
    prompt_file: null
    context_k: 6
    temperature: 0.0
    max_tokens: 540
  retrieval:
    retrieval_profile: liability_cap_check
    corpus_scope: document
    context_k: 6
    max_chunks: 8
    boost_keywords:
    - неустойка
    - пеня
    - штраф
    - за каждый день просрочки
    negative_keywords:
    - экспертиза
    - форс-мажор
    - подсудность
    - расторжение
    rerank: true
    filters: {}
  enrichment_hints:
    preferred_segment_types:
    - clause
    - article
    excluded_segment_types:
    - signature_block
    preferred_clause_functions:
    - penalty
    - limitations
    confidence_bonus_on_match: 0.1
    confidence_penalty_on_excluded_segment: 0.12
  evidence:
    required: true
    min_snippet_length: 40
    max_snippet_length: 700
  extraction:
    enabled: true
    mode: hybrid
    store_payload: true
    llm_max_tokens: 800
    compact_output: false
    llm_prompt_extraction: "<role>\nТы — юрист, извлекающий сведения о неустойке за просрочку\nв договоре ПИР. Не оценивай риски. Только заполняй поля строго по тексту.\n</role>\n\n<context>\n{context}\n</context>\n\n<task>\nЗаполни строго следующие поля:\n\ncontractor_penalty_present — предусмотрена ли неустойка для подрядчика\n  (allowed: yes / no / not_found).\n\ncontractor_penalty_rate — размер/ставка неустойки подрядчика\n  (текстовое значение или not_found).\n\npenalty_basis — базис расчёта неустойки\n  (allowed: contract_price / stage_price / overdue_amount / fixed_amount / not_specified / not_found).\n\nclient_penalty_present — предусмотрена ли встречная неустойка для заказчика\n  (allowed: yes / no / not_found).\n\nclient_penalty_rate — размер/ставка неустойки заказчика\n  (текстовое значение или not_found).\n\npenalty_cap_present — есть ли ограничение суммы неустойки\n  (allowed: yes / no / not_found).\n\nЕсли данные отсутствуют: указывай \"not_found\".\n</task>\n\n<rules>\n1.\
      \ contractor_penalty_present: \"yes\" — неустойка подрядчика есть;\n   \"no\" — тема раскрыта, но нет; \"not_found\" — тема отсутствует.\n2. contractor_penalty_rate: текст, например \"0,1% от цены договора\n   за каждый день просрочки\"; или \"not_found\".\n3. penalty_basis: \"contract_price\" — от цены договора;\n   \"stage_price\" — от стоимости этапа;\n   \"overdue_amount\" — от просроченной суммы;\n   \"fixed_amount\" — фиксированная сумма;\n   \"not_specified\" — неясно; \"not_found\" — тема отсутствует.\n4. client_penalty_present: \"yes\" — встречная неустойка есть;\n   \"no\" — нет; \"not_found\" — тема отсутствует.\n5. client_penalty_rate: текст или \"not_found\".\n6. penalty_cap_present: \"yes\" — cap есть; \"no\" — нет;\n   \"not_found\" — тема отсутствует.\n7. Не добавляй ключи, не входящие в список полей.\n8. Верни только JSON.\n</rules>\n"
    fields:
    - name: contractor_penalty_present
      type: string
      label: Неустойка подрядчика
      presentation: badge
      display_in_grid: true
      display_priority: 1
      allowed_values:
      - 'yes'
      - 'no'
      - not_found
      description: Предусмотрена ли неустойка для подрядчика.
      required: true
    - name: contractor_penalty_rate
      type: string
      label: Ставка неустойки подрядчика
      presentation: text
      display_in_grid: true
      display_priority: 2
      description: Размер/ставка неустойки подрядчика.
      max_value_chars: 200
      required: false
    - name: penalty_basis
      type: string
      label: Базис расчёта
      presentation: badge
      display_in_grid: false
      display_priority: 4
      allowed_values:
      - contract_price
      - stage_price
      - overdue_amount
      - fixed_amount
      - not_specified
      - not_found
      description: Базис расчёта неустойки.
      required: false
    - name: client_penalty_present
      type: string
      label: Встречная неустойка заказчика
      presentation: badge
      display_in_grid: true
      display_priority: 3
      allowed_values:
      - 'yes'
      - 'no'
      - not_found
      description: Предусмотрена ли встречная неустойка для заказчика.
      required: false
    - name: client_penalty_rate
      type: string
      label: Ставка неустойки заказчика
      presentation: text
      display_in_grid: false
      display_priority: 5
      description: Размер/ставка встречной неустойки заказчика.
      max_value_chars: 200
      required: false
    - name: penalty_cap_present
      type: string
      label: Лимит неустойки
      presentation: badge
      display_in_grid: false
      display_priority: 6
      allowed_values:
      - 'yes'
      - 'no'
      - not_found
      description: Установлен ли cap на сумму неустойки.
      required: false
- id: sro_membership_check
  name: Членство в СРО проектировщиков (ст. 55.8 ГрК РФ)
  description: 'Проверяет наличие в договоре подтверждения членства подрядчика в СРО

    и обязанности поддерживать его на весь срок действия договора.

    '
  legal_base: ст. 55.8 ГрК РФ
  triggers:
    any:
    - sro_required
  ui_mode: field_extraction
  severity: critical
  severity_if_pass: pass
  severity_if_fail: critical
  severity_if_unclear: critical
  origin: DOCUMENT_TYPE
  detector_type: hybrid
  rules:
    keywords:
    - СРО
    - саморегулируемая организация
    - допуск СРО
    - членство в СРО
    - свидетельство СРО
    - компенсационный фонд
    keyword_mode: any
    regex_patterns:
    - (?i)\bСРО\b
    - (?i)саморегулируем(ая|ой)\s+организац
    - (?i)допуск\s+СРО
  llm:
    prompt_template: "[КОНТЕКСТ]\nТы — юрист, анализирующий договор ПИР.\nПроверяется только один вопрос: содержит ли договор подтверждение\nчленства подрядчика в саморегулируемой организации (СРО)\nи обязательство поддерживать членство на весь срок договора.\n\nВажно:\n— Анализируй только положения о СРО, допуске, членстве и компенсационном фонде.\n— Не оценивай риск и не смешивай членство в СРО со страхованием.\n— Если условие не установлено прямо, не домысливай.\n\n[ЗАДАЧА]\n1. Установить, упоминается ли СРО в договоре.\n2. Извлечь наименование или номер СРО.\n3. Установить, предусмотрена ли обязанность поддерживать членство в СРО.\n4. Установить последствия утраты членства.\n\n[ПРАВИЛА]\n1. sro_mentioned = \"yes\" — если договор упоминает СРО или членство;\n   \"no\" — если не упоминает.\n2. sro_name_or_number — наименование, номер или реквизиты СРО (текст);\n   если не указаны — \"not_found\".\n3. sro_maintenance_obligation = \"yes\" — если подрядчик обязан поддерживать\n   членство\
      \ на весь срок договора; \"no\" — если тема раскрыта,\n   но такой обязанности нет; \"not_found\" — если тема отсутствует.\n4. sro_loss_consequences = \"termination_right\" — заказчик вправе расторгнуть;\n   \"notification\" — подрядчик обязан уведомить;\n   \"not_specified\" — последствие неясно;\n   \"not_found\" — тема отсутствует.\n5. Не путай СРО проектировщиков с СРО строителей или изыскателей.\n6. Не путай компенсационный фонд с обеспечительным платежом.\n7. Если тема не затронута — sro_mentioned = \"no\", все остальные = \"not_found\".\n\n[ПРИМЕРЫ (FEW-SHOT)]\nПример 1 — СРО урегулировано:\nТекст: «Подрядчик подтверждает, что является членом СРО\n\"Ассоциация проектировщиков\" (рег. № СРО-П-123-456).\nПодрядчик обязан поддерживать членство в СРО на весь срок\nдействия договора. В случае утраты членства Заказчик вправе\nотказаться от договора.»\n\nОтвет:\n{\n  \"sro_mentioned\": \"yes\",\n  \"sro_name_or_number\": \"Ассоциация проектировщиков, рег. № СРО-П-123-456\",\n  \"sro_maintenance_obligation\"\
      : \"yes\",\n  \"sro_loss_consequences\": \"termination_right\",\n  \"evidence\": [\n    \"Подрядчик подтверждает, что является членом СРО «Ассоциация проектировщиков» (рег. № СРО-П-123-456).\",\n    \"Подрядчик обязан поддерживать членство в СРО на весь срок действия договора.\",\n    \"В случае утраты членства Заказчик вправе отказаться от договора.\"\n  ]\n}\n\nПример 2 — СРО не упомянуто:\nТекст: «Подрядчик обладает необходимой квалификацией для выполнения работ.»\n\nОтвет:\n{\n  \"sro_mentioned\": \"no\",\n  \"sro_name_or_number\": \"not_found\",\n  \"sro_maintenance_obligation\": \"not_found\",\n  \"sro_loss_consequences\": \"not_found\",\n  \"evidence\": []\n}\n\n[ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]\n1. Упоминается ли именно СРО проектировщиков?\n2. Извлечены ли реквизиты или наименование СРО?\n3. Есть ли обязанность поддерживать членство?\n4. Есть ли последствия утраты членства?\n5. Все ли ключи JSON совпадают со schema?\n\n[ФОРМАТ ОТВЕТА]\nВерни строго JSON:\n{\n  \"sro_mentioned\"\
      : \"<yes / no>\",\n  \"sro_name_or_number\": \"<текст или not_found>\",\n  \"sro_maintenance_obligation\": \"<yes / no / not_found>\",\n  \"sro_loss_consequences\": \"<termination_right / notification / not_specified / not_found>\",\n  \"evidence\": [\"<цитата 1>\", \"<цитата 2>\"]\n}\n"
    prompt_file: null
    context_k: 4
    temperature: 0.0
    max_tokens: 440
  retrieval:
    retrieval_profile: registration_check
    corpus_scope: document
    context_k: 4
    max_chunks: 6
    boost_keywords:
    - СРО
    - допуск
    - членство
    - саморегулируемая
    - компенсационный фонд
    negative_keywords:
    - экспертиза
    - форс-мажор
    - страхование
    - подсудность
    rerank: true
    filters: {}
  enrichment_hints:
    preferred_segment_types:
    - clause
    - article
    - preamble
    excluded_segment_types:
    - signature_block
    preferred_clause_functions:
    - representations
    - representations
    confidence_bonus_on_match: 0.1
    confidence_penalty_on_excluded_segment: 0.12
  evidence:
    required: true
    min_snippet_length: 30
    max_snippet_length: 400
  extraction:
    enabled: true
    mode: hybrid
    store_payload: true
    llm_max_tokens: 550
    compact_output: false
    llm_prompt_extraction: "<role>\nТы — юрист, извлекающий сведения о членстве подрядчика в СРО\nв договоре ПИР. Не оценивай риски. Только заполняй поля строго по тексту.\n</role>\n\n<context>\n{context}\n</context>\n\n<task>\nЗаполни строго следующие поля:\n\nsro_mentioned — упоминается ли СРО в договоре\n  (allowed: yes / no).\n\nsro_name_or_number — наименование или номер СРО\n  (текстовое значение или not_found).\n\nsro_maintenance_obligation — обязанность поддерживать членство в СРО\n  (allowed: yes / no / not_found).\n\nsro_loss_consequences — последствия утраты членства\n  (allowed: termination_right / notification / not_specified / not_found).\n\nЕсли данные отсутствуют: указывай sro_mentioned = \"no\",\nостальные = \"not_found\".\n</task>\n\n<rules>\n1. sro_mentioned: \"yes\" — СРО упоминается; \"no\" — нет.\n2. sro_name_or_number: текст с реквизитами; или \"not_found\".\n3. sro_maintenance_obligation: \"yes\" — обязанность есть;\n   \"no\" — тема раскрыта, но обязанности нет;\
      \ \"not_found\" — тема отсутствует.\n4. sro_loss_consequences: \"termination_right\" — право расторгнуть;\n   \"notification\" — обязанность уведомить;\n   \"not_specified\" — последствие неясно; \"not_found\" — тема отсутствует.\n5. Не добавляй ключи, не входящие в список полей.\n6. Верни только JSON.\n</rules>\n"
    fields:
    - name: sro_mentioned
      type: string
      label: СРО упомянуто
      presentation: badge
      display_in_grid: true
      display_priority: 1
      allowed_values:
      - 'yes'
      - 'no'
      description: Упоминается ли СРО в договоре.
      required: true
    - name: sro_name_or_number
      type: string
      label: Наименование / номер СРО
      presentation: text
      display_in_grid: false
      display_priority: 4
      description: Наименование или регистрационный номер СРО.
      max_value_chars: 200
      required: false
    - name: sro_maintenance_obligation
      type: string
      label: Обязанность поддерживать членство
      presentation: badge
      display_in_grid: true
      display_priority: 2
      allowed_values:
      - 'yes'
      - 'no'
      - not_found
      description: Обязан ли подрядчик поддерживать членство в СРО.
      required: false
    - name: sro_loss_consequences
      type: string
      label: Последствия утраты членства
      presentation: badge
      display_in_grid: true
      display_priority: 3
      allowed_values:
      - termination_right
      - notification
      - not_specified
      - not_found
      description: Последствия утраты подрядчиком членства в СРО.
      required: false
- id: force_majeure
  name: Форс-мажор и обстоятельства непреодолимой силы (ст. 401 ГК РФ)
  description: 'Проверяет наличие оговорки о форс-мажоре, порядок уведомления,

    перечень обстоятельств и последствия для сроков и обязательств.

    '
  legal_base: ст. 401 ГК РФ
  triggers: null
  ui_mode: field_extraction
  severity: medium
  severity_if_pass: pass
  severity_if_fail: medium
  severity_if_unclear: medium
  origin: DOCUMENT_TYPE
  detector_type: hybrid
  rules:
    keywords:
    - форс-мажор
    - обстоятельства непреодолимой силы
    - освобождение от ответственности
    - уведомление о форс-мажоре
    keyword_mode: any
    regex_patterns:
    - (?i)форс[\s\-]?мажор
    - (?i)непреодолим(ой|ая)\s+сил
  llm:
    prompt_template: "[КОНТЕКСТ]\nТы — юрист, анализирующий договор ПИР.\nПроверяется только один вопрос: содержит ли договор оговорку\nо форс-мажоре (обстоятельствах непреодолимой силы), порядок\nуведомления и последствия для сроков и обязательств.\n\nВажно:\n— Анализируй только положения о форс-мажоре и непреодолимой силе.\n— Не оценивай риск и не смешивай с продлением сроков при задержке заказчика.\n— Если условие не установлено прямо, не домысливай.\n\n[ЗАДАЧА]\n1. Установить, содержит ли договор оговорку о форс-мажоре.\n2. Установить, определён ли перечень обстоятельств.\n3. Установить, определён ли срок уведомления о форс-мажоре.\n4. Определить последствия для сроков выполнения работ.\n5. Установить, предусмотрено ли право на расторжение при длительном форс-мажоре.\n\n[ПРАВИЛА]\n1. fm_clause_present = \"yes\" — оговорка о форс-мажоре есть;\n   \"no\" — тема раскрыта, но оговорки нет;\n   \"not_found\" — тема отсутствует.\n2. fm_events_listed = \"yes\" — перечислены конкретные обстоятельства;\n\
      \   \"general_only\" — только общая формулировка без перечня;\n   \"not_found\" — тема отсутствует.\n3. fm_notification_period — срок уведомления (текст);\n   если не указан — \"not_found\".\n4. fm_deadline_extension = \"yes\" — сроки работ продлеваются\n   на период форс-мажора; \"no\" — тема раскрыта,\n   но продления нет; \"not_found\" — тема отсутствует.\n5. fm_prolonged_termination = \"yes\" — при длительном форс-мажоре\n   стороны вправе расторгнуть; \"no\" — тема раскрыта,\n   но такого права нет; \"not_found\" — тема отсутствует.\n6. fm_prolonged_period — период, после которого допускается расторжение\n   (текст); если не указан — \"not_found\".\n7. Не путай форс-мажор с задержкой согласования заказчиком.\n\n[ПРИМЕРЫ (FEW-SHOT)]\nПример 1 — форс-мажор урегулирован:\nТекст: «Стороны освобождаются от ответственности за неисполнение\nобязательств, вызванное обстоятельствами непреодолимой силы:\nстихийные бедствия, военные действия, эпидемии, изменения\nзаконодательства. Сторона,\
      \ для которой наступили такие обстоятельства,\nобязана уведомить другую сторону в течение 5 рабочих дней.\nСроки выполнения работ продлеваются на период действия\nфорс-мажора. Если форс-мажор продолжается более 90 дней,\nкаждая сторона вправе расторгнуть договор.»\n\nОтвет:\n{\n  \"fm_clause_present\": \"yes\",\n  \"fm_events_listed\": \"yes\",\n  \"fm_notification_period\": \"5 рабочих дней\",\n  \"fm_deadline_extension\": \"yes\",\n  \"fm_prolonged_termination\": \"yes\",\n  \"fm_prolonged_period\": \"90 дней\",\n  \"evidence\": [\n    \"Стороны освобождаются от ответственности за неисполнение обязательств, вызванное обстоятельствами непреодолимой силы: стихийные бедствия, военные действия, эпидемии, изменения законодательства.\",\n    \"Сторона, для которой наступили такие обстоятельства, обязана уведомить другую сторону в течение 5 рабочих дней.\",\n    \"Сроки выполнения работ продлеваются на период действия форс-мажора.\",\n    \"Если форс-мажор продолжается более 90 дней, каждая\
      \ сторона вправе расторгнуть договор.\"\n  ]\n}\n\nПример 2 — тема не раскрыта:\nТекст: «Договор действует до полного исполнения обязательств.»\n\nОтвет:\n{\n  \"fm_clause_present\": \"not_found\",\n  \"fm_events_listed\": \"not_found\",\n  \"fm_notification_period\": \"not_found\",\n  \"fm_deadline_extension\": \"not_found\",\n  \"fm_prolonged_termination\": \"not_found\",\n  \"fm_prolonged_period\": \"not_found\",\n  \"evidence\": []\n}\n\n[ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]\n1. Есть ли именно оговорка о форс-мажоре, а не общая ссылка на закон?\n2. Перечислены ли конкретные обстоятельства или только общая формулировка?\n3. Есть ли срок уведомления в днях?\n4. Продлеваются ли сроки работ на период форс-мажора?\n5. Есть ли право на расторжение при длительном форс-мажоре?\n6. Все ли ключи JSON совпадают со schema?\n\n[ФОРМАТ ОТВЕТА]\nВерни строго JSON:\n{\n  \"fm_clause_present\": \"<yes / no / not_found>\",\n  \"fm_events_listed\": \"<yes / general_only / not_found>\",\n  \"fm_notification_period\"\
      : \"<текст или not_found>\",\n  \"fm_deadline_extension\": \"<yes / no / not_found>\",\n  \"fm_prolonged_termination\": \"<yes / no / not_found>\",\n  \"fm_prolonged_period\": \"<текст или not_found>\",\n  \"evidence\": [\"<цитата 1>\", \"<цитата 2>\"]\n}\n"
    prompt_file: null
    context_k: 5
    temperature: 0.0
    max_tokens: 500
  retrieval:
    corpus_scope: document
    context_k: 5
    max_chunks: 6
    retrieval_profile: force_majeure_check
    boost_keywords:
    - форс-мажор
    - непреодолимая сила
    - освобождение от ответственности
    - уведомление
    negative_keywords:
    - экспертиза
    - подсудность
    - неустойка
    - аванс
    rerank: true
    filters: {}
  enrichment_hints:
    preferred_segment_types:
    - clause
    - article
    excluded_segment_types:
    - signature_block
    preferred_clause_functions:
    - limitations
    confidence_bonus_on_match: 0.1
    confidence_penalty_on_excluded_segment: 0.12
  evidence:
    required: true
    min_snippet_length: 40
    max_snippet_length: 700
  extraction:
    enabled: true
    mode: hybrid
    store_payload: true
    llm_max_tokens: 800
    compact_output: false
    llm_prompt_extraction: "<role>\nТы — юрист, извлекающий сведения о форс-мажоре в договоре ПИР.\nНе оценивай риски. Только заполняй поля строго по тексту.\n</role>\n\n<context>\n{context}\n</context>\n\n<task>\nЗаполни строго следующие поля:\n\nfm_clause_present — есть ли оговорка о форс-мажоре\n  (allowed: yes / no / not_found).\n\nfm_events_listed — перечислены ли обстоятельства\n  (allowed: yes / general_only / not_found).\n\nfm_notification_period — срок уведомления\n  (текстовое значение или not_found).\n\nfm_deadline_extension — продлеваются ли сроки работ\n  (allowed: yes / no / not_found).\n\nfm_prolonged_termination — право расторгнуть при длительном форс-мажоре\n  (allowed: yes / no / not_found).\n\nfm_prolonged_period — период, после которого допускается расторжение\n  (текстовое значение или not_found).\n\nЕсли данные отсутствуют: указывай \"not_found\".\n</task>\n\n<rules>\n1. fm_clause_present: \"yes\" — оговорка есть; \"no\" — тема раскрыта,\n   но нет; \"not_found\" —\
      \ тема отсутствует.\n2. fm_events_listed: \"yes\" — конкретные обстоятельства перечислены;\n   \"general_only\" — только общая формулировка; \"not_found\" — тема отсутствует.\n3. fm_notification_period: текст с указанием срока; или \"not_found\".\n4. fm_deadline_extension: \"yes\" — продлеваются; \"no\" — нет;\n   \"not_found\" — тема отсутствует.\n5. fm_prolonged_termination: \"yes\" — право расторгнуть есть;\n   \"no\" — нет; \"not_found\" — тема отсутствует.\n6. fm_prolonged_period: текст с указанием периода; или \"not_found\".\n7. Не добавляй ключи, не входящие в список полей.\n8. Верни только JSON.\n</rules>\n"
    fields:
    - name: fm_clause_present
      type: string
      label: Оговорка о форс-мажоре
      presentation: badge
      display_in_grid: true
      display_priority: 1
      allowed_values:
      - 'yes'
      - 'no'
      - not_found
      description: Содержит ли договор оговорку о форс-мажоре.
      required: true
    - name: fm_events_listed
      type: string
      label: Перечень обстоятельств
      presentation: badge
      display_in_grid: false
      display_priority: 4
      allowed_values:
      - 'yes'
      - general_only
      - not_found
      description: Перечислены ли конкретные форс-мажорные обстоятельства.
      required: false
    - name: fm_notification_period
      type: string
      label: Срок уведомления
      presentation: text
      display_in_grid: true
      display_priority: 2
      description: Срок уведомления о наступлении форс-мажора.
      max_value_chars: 100
      required: false
    - name: fm_deadline_extension
      type: string
      label: Продление сроков
      presentation: badge
      display_in_grid: true
      display_priority: 3
      allowed_values:
      - 'yes'
      - 'no'
      - not_found
      description: Продлеваются ли сроки работ на период форс-мажора.
      required: false
    - name: fm_prolonged_termination
      type: string
      label: Расторжение при длительном ФМ
      presentation: badge
      display_in_grid: false
      display_priority: 5
      allowed_values:
      - 'yes'
      - 'no'
      - not_found
      description: Право расторгнуть при длительном форс-мажоре.
      required: false
    - name: fm_prolonged_period
      type: string
      label: Период для расторжения
      presentation: text
      display_in_grid: false
