      llm_max_tokens: 800
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора ПИР сведения о поэтапном
        согласовании промежуточных результатов и порядке отступлений от ТЗ.
        Не анализируй итоговую приёмку, цену или неустойку.
        Не путай согласование промежуточных результатов с итоговой приёмкой.
        </role>
        <context>
        {context}
        </context>
        <task>
        Заполни строго следующие 11 полей (плюс evidence):
        1. stagewise_approval_present — предусмотрено ли поэтапное согласование: yes / no / not_defined.
        2. stagewise_approval_present_display — человеко-читаемое значение: "Да, предусмотрено поэтапное согласование" / "Нет, поэтапное согласование не предусмотрено" / "Данные не определены".
        3. review_period_days — срок рассмотрения заказчиком (текст) или "Данные не определены" или "Не применимо".
        4. right_to_remarks — право заказчика на замечания: yes / no / not_defined.
        5. right_to_remarks_display — человеко-читаемое значение: "Да, право предусмотрено" / "Нет, право не предусмотрено" / "Данные не определены" / "Не применимо".
        6. auto_approval_on_silence — авто-приёмка при молчании: yes / no / not_defined.
        7. auto_approval_on_silence_display — человеко-читаемое значение: "Да, этап считается согласованным" / "Нет, требуется явное согласование" / "Данные не определены" / "Не применимо".
        8. tz_deviation_procedure — порядок отступлений от ТЗ: defined / not_defined.
        9. tz_deviation_procedure_display — человеко-читаемое значение: "Да, порядок урегулирован" / "Данные не определены" / "Не применимо".
        10. scope_change_procedure — порядок изменения объёма: defined / not_defined.
        11. scope_change_procedure_display — человеко-читаемое значение: "Да, порядок урегулирован" / "Данные не определены" / "Не применимо".

        Маппинг enum → display:
        - stagewise_approval_present: yes → "Да, предусмотрено поэтапное согласование", no → "Нет, поэтапное согласование не предусмотрено", not_defined → "Данные не определены"
        - right_to_remarks: yes → "Да, право предусмотрено", no → "Нет, право не предусмотрено", not_defined → "Данные не определены" или "Не применимо"
        - auto_approval_on_silence: yes → "Да, этап считается согласованным", no → "Нет, требуется явное согласование", not_defined → "Данные не определены" или "Не применимо"
        - tz_deviation_procedure: defined → "Да, порядок урегулирован", not_defined → "Данные не определены" или "Не применимо"
        - scope_change_procedure: defined → "Да, порядок урегулирован", not_defined → "Данные не определены" или "Не применимо"

        Критическое правило:
        - Если stagewise_approval_present = "no" (поэтапное согласование прямо исключено), то все остальные поля (right_to_remarks, auto_approval_on_silence, tz_deviation_procedure, scope_change_procedure) = "not_defined", а их display-версии = "Не применимо". Поле review_period_days = "Не применимо".
        - Если stagewise_approval_present = "not_defined" (условие не упоминается), то остальные поля = "not_defined", display = "Данные не определены".
        </task>
        <context_rules>
        - Используй только текст договора. Не выдумывай сроки, условия или процедуры — извлекай строго из переданного фрагмента.
        - Не опирайся на внешние знания о типовых условиях договоров ПИР.
        - Не путай согласование промежуточных результатов с итоговой приёмкой.
        - Не путай срок рассмотрения промежуточного результата со сроком выполнения работ.
        - Не путай отступления от ТЗ с изменениями объёма работ.
        - Верни строго валидный JSON. Все 11 ключей + evidence обязаны присутствовать.
        - Запрещены: null, None, пустые строки "". Для текстовых полей при отсутствии данных — "Данные не определены".
        - Убедись, что enum-значения соответствуют их display-версиям согласно маппингу выше.
        - Различай "no" (условие прямо исключено) и "not_defined" (условие вообще не упоминается).
        - Если срок рассмотрения определяется по приложению/графику — укажи ссылку в review_period_days, а не "Данные не определены".
        </context_rules>

        <output_expectations>
        - Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        - Не используй markdown fences.
        - Не добавляй пояснения до или после JSON.
        - Верни все ключи, перечисленные в task, без пропусков.
        - Не используй null, None или пустые строки.
        - Для статусных полей используй только значения из allowed_values или "not_defined".
        - Для текстовых полей при отсутствии данных используй "Данные не определены" / "Не удалось определить" / "Не применимо" — согласно правилам выше.
        </output_expectations>
      fields:
        - name: "stagewise_approval_present"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Предусмотрено ли поэтапное согласование промежуточных результатов (enum)."
          required: true
          display_in_grid: false
        - name: "stagewise_approval_present_display"
