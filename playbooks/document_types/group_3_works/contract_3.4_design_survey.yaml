        Не путай доступ на участок с внешними согласованиями.
        </role>
        <context>
        {context}
        </context>
        <task>
        Заполни строго следующие 9 полей (плюс evidence):
        1. site_access_obligation — обязанность обеспечить доступ: yes / no / not_defined.
        2. site_access_obligation_display — "Да, обязанность предусмотрена" / "Нет, обязанность не предусмотрена" / "Данные не определены".
        3. access_deadline — срок предоставления доступа (текст) или "Данные не определены" или "Не применимо".
        4. obstacle_procedure — процедура при препятствиях: defined / not_defined.
        5. obstacle_procedure_display — "Да, процедура предусмотрена" / "Данные не определены" / "Не применимо".
        6. extension_and_cost_right — право на продление и возмещение: yes / no / not_defined.
        7. extension_and_cost_right_display — "Да, право предусмотрено" / "Нет, право не предусмотрено" / "Данные не определены" / "Не применимо".
        8. permits_obligation — обязанность получить разрешения: yes / no / not_defined.
        9. permits_obligation_display — "Да, обязанность предусмотрена" / "Нет, обязанность не предусмотрена" / "Данные не определены" / "Не применимо".

        Маппинг enum → display:
        - site_access_obligation: yes → "Да, обязанность предусмотрена", no → "Нет, обязанность не предусмотрена", not_defined → "Данные не определены"
        - obstacle_procedure: defined → "Да, процедура предусмотрена", not_defined → "Данные не определены" или "Не применимо"
        - extension_and_cost_right: yes → "Да, право предусмотрено", no → "Нет, право не предусмотрено", not_defined → "Данные не определены" или "Не применимо"
        - permits_obligation: yes → "Да, обязанность предусмотрена", no → "Нет, обязанность не предусмотрена", not_defined → "Данные не определены" или "Не применимо"

        Критическое правило:
        - Если site_access_obligation = "no" — все остальные поля = "not_defined", display = "Не применимо".
        - Если site_access_obligation = "not_defined" — все остальные поля = "not_defined", display = "Данные не определены".
        </task>
        <context_rules>
        - Используй только текст договора. Не выдумывай условия — извлекай строго из переданного фрагмента.
        - Не опирайся на внешние знания о типовых условиях договоров ПИР.
        - Не путай доступ на участок с передачей исходных данных (Check 4).
        - Не путай доступ на участок с внешними согласованиями (Check 6).
        - Верни строго валидный JSON. Все 9 ключей + evidence обязаны присутствовать.
        - Запрещены: null, None, пустые строки "".
        - Убедись, что enum-значения соответствуют их display-версиям.
        </context_rules>

        <output_expectations>
        - Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        - Не используй markdown fences.
        - Не добавляй пояснения до или после JSON.
        - Верни все ключи, перечисленные в task, без пропусков.
        - Не используй null, None или пустые строки.
        - Для статусных полей используй только значения из allowed_values или "not_defined".
        - Для текстовых полей при отсутствии данных используй "Данные не определены" / "Не удалось определить" / "Не применимо" — согласно правилам выше.
        </output_expectations>
      fields:
