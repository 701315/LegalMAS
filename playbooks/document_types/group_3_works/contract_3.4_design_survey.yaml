      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора ПИР сведения о наличии
        и полноте технического задания на проектирование.
        Не анализируй цену, сроки, ответственность или иные темы.
        </role>
        <context>
        {context}
        </context>
        <task>
        Заполни строго следующие 8 полей (плюс evidence):
        1. tz_present — наличие ТЗ: yes / referenced_but_missing / not_defined.
        2. tz_present_display — человеко-читаемое значение: "Да, ТЗ присутствует в договоре/приложениях" / "ТЗ упомянуто, но не приложено" / "ТЗ не найдено в договоре".
        3. tz_contains_object_parameters — параметры объекта в ТЗ: yes / no / unclear.
        4. tz_contains_object_parameters_display — человеко-читаемое значение: "Да, указано" / "Нет, не указано" / "Невозможно определить (ТЗ недоступно)".
        5. tz_contains_norms_references — ссылки на нормативы в ТЗ: yes / no / unclear.
        6. tz_contains_norms_references_display — человеко-читаемое значение: "Да, указано" / "Нет, не указано" / "Невозможно определить (ТЗ недоступно)".
        7. tz_contains_result_requirements — требования к результату в ТЗ: yes / no / unclear.
        8. tz_contains_result_requirements_display — человеко-читаемое значение: "Да, указано" / "Нет, не указано" / "Невозможно определить (ТЗ недоступно)".

        Маппинг enum → display:
        - tz_present: yes → "Да, ТЗ присутствует в договоре/приложениях", referenced_but_missing → "ТЗ упомянуто, но не приложено", not_defined → "ТЗ не найдено в договоре"
        - tz_contains_*: yes → "Да, указано", no → "Нет, не указано", unclear → "Невозможно определить (ТЗ недоступно)"

        Различай:
        - "yes" — элемент явно присутствует в тексте ТЗ
        - "no" — ТЗ доступно, но элемент в нём отсутствует
        - "unclear" — ТЗ упомянуто, но его содержание недоступно для анализа
        - "referenced_but_missing" — ТЗ упомянуто в договоре, но само ТЗ не приложено
        - "not_defined" — ТЗ вообще не упомянуто в договоре

        Если ТЗ недоступно для анализа (referenced_but_missing или not_defined):
        - tz_present = "referenced_but_missing" или "not_defined"
        - tz_contains_* = "unclear"
        - tz_contains_*_display = "Невозможно определить (ТЗ недоступно)"
        </task>
        <context_rules>
        - Используй только текст договора. Не выдумывай содержание ТЗ — извлекай строго из переданного фрагмента.
        - Не опирайся на внешние знания о типовом содержании ТЗ.
        - Верни строго валидный JSON. Все 8 ключей + evidence обязаны присутствовать.
        - Запрещены: null, None, пустые строки "".
        - Убедись, что enum-значения соответствуют их display-версиям согласно маппингу выше.
        - Если ТЗ упомянуто, но не приложено — используй tz_present = "referenced_but_missing", а не "not_defined".
        </context_rules>

        <output_expectations>
        - Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        - Не используй markdown fences.
        - Не добавляй пояснения до или после JSON.
        - Верни все ключи, перечисленные в task, без пропусков.
        - Не используй null, None или пустые строки.
        - Для статусных полей используй только значения из allowed_values или "not_defined".
        - Для текстовых полей при отсутствии данных используй "Данные не определены" / "Не удалось определить" / "Не применимо" — согласно правилам выше.
        </output_expectations>
      fields:
        - name: "tz_present"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "referenced_but_missing", "not_defined"]
          description: "Наличие технического задания на проектирование (enum)."
          required: true
