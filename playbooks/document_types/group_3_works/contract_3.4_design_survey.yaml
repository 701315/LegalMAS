# CHECK 13: Расторжение: основания и последствия
# ──────────────────────────────────────────────────────────────────────────
- id: termination_and_consequences
  name: "Расторжение: основания и последствия (ст. 715, 717, 758 ГК РФ)"
  description: "Проверяет основания расторжения, порядок оплаты выполненной части, возврат документации"
  legal_base: "ст. 715, 717, 758 ГК РФ"
  triggers: ~
  ui_mode: "field_extraction"
  severity: "high"
  origin: "DOCUMENT_TYPE"
  detector_type: "hybrid"
  rules:
    keywords:
      - "расторжение"
      - "отказ от договора"
      - "отказ заказчика"
      - "оплата выполненной части"
      - "возврат документации"
      - "неустойка"
      - "штраф"
    keyword_mode: "any"
    regex_patterns:
      - "(?i)расторж(ение|ении)"
      - "(?i)отказ.*от.*договор"
      - "(?i)оплат.*выполненн.*част"
  llm:
    prompt_template: |
      [КОНТЕКСТ]
      Ты — юрист, анализирующий договор ПИР.
      Проверяется только один вопрос: основания расторжения договора,
      порядок оплаты фактически выполненной части работ и судьба документации.

      Важно:
      — Анализируй только положения о расторжении, одностороннем отказе
        и последствиях прекращения договора.
      — Не оценивай риск и не смешивай расторжение с неустойкой или форс-мажором.
      — Если условие не установлено прямо, не домысливай.

      [ЗАДАЧА]
      1. Установить, предусмотрено ли право на односторонний отказ от договора.
      2. Определить, за какой стороной закреплено такое право.
      3. Установить, урегулирован ли порядок оплаты выполненной части.
      4. Установить, урегулирован ли возврат документации при расторжении.
      5. Установить, предусмотрена ли штрафная санкция за расторжение.

      [ПРАВИЛА]
      1. unilateral_termination_right = "client_only" — только заказчик
         вправе отказаться; "contractor_only" — только подрядчик;
         "both" — обе стороны; "none" — прямо указано, что нет;
         "not_found" — тема отсутствует.
      2. partial_work_payment = "defined" — установлен порядок оплаты
         фактически выполненной части; "not_defined" — тема раскрыта,
         но порядок не определён; "not_found" — тема отсутствует.
      3. documentation_return = "defined" — урегулирован возврат или передача
         документации при расторжении; "not_defined" — тема раскрыта,
         но не урегулирована; "not_found" — тема отсутствует.
      4. termination_penalty_present = "yes" — есть штраф/неустойка
         за расторжение; "no" — тема раскрыта, но штрафа нет;
         "not_found" — тема отсутствует.
      5. termination_notice_period — срок уведомления о расторжении
         (текст) или "not_found".
      6. Не путай расторжение с приостановкой работ.
      7. Не путай штраф за расторжение с неустойкой за просрочку.

      [ПРИМЕРЫ (FEW-SHOT)]
      Пример 1 — расторжение урегулировано:
      Текст: «Заказчик вправе отказаться от договора в любое время,
      уведомив Подрядчика за 30 календарных дней. При отказе Заказчика
      Подрядчику оплачиваются фактически выполненные и принятые работы.
      Подрядчик обязан передать всю разработанную документацию Заказчику.»

      Ответ:
      {
        "unilateral_termination_right": "client_only",
        "partial_work_payment": "defined",
        "documentation_return": "defined",
        "termination_penalty_present": "no",
        "termination_notice_period": "30 календарных дней",
        "evidence": [
          "Заказчик вправе отказаться от договора в любое время, уведомив Подрядчика за 30 календарных дней.",
          "При отказе Заказчика Подрядчику оплачиваются фактически выполненные и принятые работы.",
          "Подрядчик обязан передать всю разработанную документацию Заказчику."
        ]
      }

      Пример 2 — тема не раскрыта:
      Текст: «Договор действует до полного исполнения обязательств сторонами.»

      Ответ:
      {
        "unilateral_termination_right": "not_found",
        "partial_work_payment": "not_found",
        "documentation_return": "not_found",
        "termination_penalty_present": "not_found",
        "termination_notice_period": "not_found",
        "evidence": []
      }

      [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
      1. Есть ли именно право на расторжение/отказ, а не общее прекращение?
      2. За какой стороной закреплено право?
      3. Установлен ли порядок оплаты выполненной части?
      4. Есть ли условие о возврате/передаче документации?
      5. Не перепутан ли штраф за расторжение с общей неустойкой?

      [ФОРМАТ ОТВЕТА]
      Верни строго JSON:
      {
        "unilateral_termination_right": "<client_only / contractor_only / both / none / not_found>",
        "partial_work_payment": "<defined / not_defined / not_found>",
        "documentation_return": "<defined / not_defined / not_found>",
        "termination_penalty_present": "<yes / no / not_found>",
        "termination_notice_period": "<текст или not_found>",
        "evidence": ["<цитата 1>", "<цитата 2>"]
      }
    prompt_file: null
    context_k: 6
    temperature: 0.0
    max_tokens: 520
  retrieval:
    corpus_scope: "document"
    context_k: 6
    max_chunks: 8
    retrieval_profile: "termination_check"
    boost_keywords:
      - "расторжение"
      - "отказ от договора"
      - "оплата выполненной части"
      - "возврат документации"
    negative_keywords:
      - "экспертиза"
      - "форс-мажор"
      - "подсудность"
    rerank: true
    filters: {}
  enrichment_hints:
    preferred_segment_types:
      - "clause"
      - "article"
    excluded_segment_types:
      - "signature_block"
    preferred_clause_functions:
      - "procedures"
  evidence:
    required: true
    min_snippet_length: 40
    max_snippet_length: 700
  extraction:
    enabled: true
    mode: "hybrid"
    store_payload: true
    llm_max_tokens: 700

    compact_output: false

    llm_prompt_extraction: |
      <role>
      Ты — юрист, извлекающий сведения о расторжении договора ПИР.
      Не оценивай риски. Только заполняй поля строго по тексту.
      </role>

      <context>
      {context}
      </context>

      <task>
      Заполни строго следующие поля:

      unilateral_termination_right — право на односторонний отказ
        (allowed: client_only / contractor_only / both / none / not_found).

      partial_work_payment — порядок оплаты выполненной части
        (allowed: defined / not_defined / not_found).

      documentation_return — возврат документации при расторжении
        (allowed: defined / not_defined / not_found).

      termination_penalty_present — штраф/неустойка за расторжение
        (allowed: yes / no / not_found).

      termination_notice_period — срок уведомления о расторжении
        (текстовое значение или not_found).

      Если данные отсутствуют: указывай "not_found".
      </task>

      <rules>
      1. unilateral_termination_right: "client_only" — только заказчик;
         "contractor_only" — только подрядчик; "both" — обе стороны;
         "none" — право прямо исключено; "not_found" — тема отсутствует.
      2. partial_work_payment: "defined" — порядок оплаты установлен;
         "not_defined" — тема есть, но порядок неясен; "not_found" — тема отсутствует.
      3. documentation_return: "defined" — урегулирован; "not_defined" — тема есть,
         но не урегулирована; "not_found" — тема отсутствует.
      4. termination_penalty_present: "yes" — штраф за расторжение есть;
         "no" — тема раскрыта, но штрафа нет; "not_found" — тема отсутствует.
      5. termination_notice_period: текст с указанием периода или "not_found".
      6. Не добавляй ключи, не входящие в список полей.
      7. Верни только JSON.
      </rules>
    fields:
      - name: "unilateral_termination_right"
        type: "string"
        label: "Право на односторонний отказ"
        presentation: "badge"
        display_in_grid: true
        display_priority: 1
