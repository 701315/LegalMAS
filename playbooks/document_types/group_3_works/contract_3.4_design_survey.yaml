        - "оплата выполненной части"
        - "возврат документации"
        - "неустойка"
        - "штраф"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)расторж(ение|ении)"
        - "(?i)отказ.*от.*договор"
        - "(?i)оплат.*выполненн.*част"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор на выполнение проектных и изыскательских работ (ПИР)
        (§ 4 Главы 37 ГК РФ, ст. 715, 717, 758).
        Проверяется только один вопрос: основания расторжения, оплата
        выполненной части и возврат документации.
        Нормативный ориентир:
        - ст. 715 ГК РФ
        - ст. 717 ГК РФ
        - ст. 758 ГК РФ
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Право на односторонний отказ и за какой стороной.
        2. Порядок оплаты выполненной части.
        3. Возврат документации при расторжении.
        4. Штрафная санкция за расторжение.
        5. Срок уведомления о расторжении.

        [ПРАВИЛА]
        1. Только текст документа.
        2. Если условие не указано — "not_defined".
        3. Не путай расторжение с приостановкой работ.
        4. В evidence — только текст договора.
        5. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1:
        Фрагмент:
        "Заказчик вправе отказаться от договора в любое время,
        уведомив Подрядчика за 30 календарных дней. При отказе Заказчика
        Подрядчику оплачиваются фактически выполненные и принятые работы.
        Подрядчик обязан передать всю разработанную документацию Заказчику."
        Ответ:
        {
          "unilateral_termination_right": "client_only",
          "partial_work_payment": "defined",
          "documentation_return": "defined",
          "termination_penalty_present": "no",
          "termination_notice_period": "30 календарных дней",
          "evidence": [
            {
              "clause_ref": "п. 8.1",
              "quote": "Заказчик вправе отказаться от договора в любое время, уведомив Подрядчика за 30 календарных дней."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Договор действует до полного исполнения обязательств сторонами."
        Ответ:
        {
          "unilateral_termination_right": "not_defined",
          "partial_work_payment": "not_defined",
          "documentation_return": "not_defined",
          "termination_penalty_present": "not_defined",
          "termination_notice_period": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли именно право на расторжение/отказ?
        2. За какой стороной закреплено право?
        3. Установлен ли порядок оплаты выполненной части?
        4. Есть ли условие о возврате документации?
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "unilateral_termination_right": "<client_only / contractor_only / both / none / not_found>",
          "partial_work_payment": "<defined / not_defined / not_found>",
          "documentation_return": "<defined / not_defined / not_found>",
          "termination_penalty_present": "<yes / no / not_found>",
          "termination_notice_period": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 520
      retrieval:
        retrieval_profile: "termination_check"
        corpus_scope: "primary_segment"
        levels:
          - "legal_unit"
          - "section"
        required_kind: "legal_unit"
        retrieval_query: "расторжение отказ от договора оплата выполненной части возврат документации уведомление о расторжении"
        preferred_unit_types:
          - termination_provision
          - general_provision
        excluded_unit_types:
          - definition
          - structural_anchor
          - technical_fragment
        preferred_clause_functions:
          - remedies
          - procedures
        negative_keywords:
          - "экспертиза"
          - "форс-мажор"
          - "подсудность"
          - "означает"
          - "в целях настоящего"
        position_bias:
          preferred_range: [0.50, 0.95]
          boost: 0.18
          scope: segment
        context_k: 6
        max_chunks: 8
        rerank: true
        enrichment_hints:
          preferred_segment_types:
            - "contract"
            - "amendment"
          excluded_segment_types:
            - "technical_specification"
            - "price_list"
          preferred_clause_functions:
            - "remedies"
            - "procedures"
          confidence_bonus_on_match: 0.08
          confidence_penalty_on_excluded_segment: 0.10
      evidence:
        required: true
        min_snippet_length: 30
        max_snippet_length: 650
      extraction:
        enabled: true
        mode: "hybrid"
        compact_output: false
        llm_max_tokens: 700
        llm_prompt_extraction: |
          <role>
          Ты — российский юрист. Извлеки из договора ПИР сведения о расторжении:
          право на отказ, оплата выполненной части, возврат документации, штраф.
          Не анализируй неустойку за просрочку, форс-мажор или иные темы.
          </role>
          <context>
          {context}
          </context>
          <task>
          Заполни строго следующие поля:
          1. unilateral_termination_right — право на односторонний отказ (client_only / contractor_only / both / none / not_found).
          2. partial_work_payment — порядок оплаты выполненной части (defined / not_defined / not_found).
          3. documentation_return — возврат документации (defined / not_defined / not_found).
          4. termination_penalty_present — штраф за расторжение (yes / no / not_found).
          5. termination_notice_period — срок уведомления.
          Если данные отсутствуют: "not_defined" или "Данные не определены".
          </task>
          <rules>
