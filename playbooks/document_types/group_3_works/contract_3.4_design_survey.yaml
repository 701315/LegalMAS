  - id: pir_subject_extraction
    name: "Предмет договора ПИР: вид работ, объект, стадия, ТЗ"
    description: >
      Фактографическая проверка существенных условий предмета договора на выполнение
      проектных и/или изыскательских работ (ПИР). Извлекает: (1) вид работ — проектные,
      изыскательские или комплексные; (2) официальное наименование объекта проектирования/изысканий;
      (3) адрес или местоположение объекта; (4) стадию проектирования — «П» (проектная документация),
      «Р» (рабочая документация) или обе стадии; (5) ссылку на техническое задание с указанием
      номера приложения; (6) факт перечисления разделов проектной документации в соответствии
      с Постановлением Правительства РФ № 87. Проверка критична для определения объёма обязательств
      подрядчика и соответствия договора требованиям ст. 758 ГК РФ и ст. 48 ГрК РФ.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "проектная документация"
        - "рабочая документация"
        - "инженерные изыскания"
        - "предмет договора"
        - "объект проектирования"
        - "стадия П"
        - "стадия Р"
        - "техническое задание"
        - "состав документации"
      keyword_mode: "any"
      regex_patterns:
        - "{{ design_stage }}"
        - "(?i)(проектн.*и.*изыскательск|инженерн.*изыскани)"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор на выполнение проектных и изыскательских работ (ПИР)
        (§ 4 Главы 37 ГК РФ, ст. 758; ГрК РФ ст. 48).
        Проверяется только один вопрос: предмет договора — что именно
        обязан выполнить подрядчик, на каком объекте и в какой стадии.
        Нормативный ориентир:
        - ст. 758 ГК РФ
        - ст. 48 ГрК РФ
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Вид работ: проектные / изыскательские / комплексные.
        2. Наименование объекта проектирования.
        3. Местоположение (адрес) объекта.
        4. Стадию проектирования: П / Р / обе.
        5. Ссылку на техническое задание (номер приложения).
        6. Перечислены ли разделы проектной документации.

        [ПРАВИЛА]
        1. Используй только текст документа. Не выдумывай наименование объекта, адрес, номер приложения — извлекай строго из переданного фрагмента.
        2. Для enum-полей (work_type, design_stage, design_sections_listed) при отсутствии данных используй значение "not_defined".
        3. Для текстовых полей (object_name, object_location, tz_reference) при отсутствии данных пиши "Данные не определены".
        4. Для полей *_display используй человеко-читаемые значения:
           - work_type_display: "Проектные работы" / "Инженерные изыскания" / "Комплексные работы (проектные + изыскания)" / "Данные не определены"
           - design_stage_display: "Стадия «П» (проектная документация)" / "Стадия «Р» (рабочая документация)" / "Стадии «П» и «Р»" / "Данные не определены"
