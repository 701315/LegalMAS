    min_snippet_length: 40
    max_snippet_length: 650
  extraction:
    enabled: true
    mode: "hybrid"
    store_payload: true
    llm_max_tokens: 700

    compact_output: false

    llm_prompt_extraction: |
      <role>
      Ты — юрист, извлекающий сведения о продлении сроков при задержке заказчика
      в договоре ПИР. Не оценивай риски. Только заполняй поля строго по тексту.
      </role>

      <context>
      {context}
      </context>

      <task>
      Заполни строго следующие поля:

      auto_extension_present — предусмотрено ли продление сроков
        при задержке заказчика
        (allowed: yes / no / not_found).

      extension_trigger — триггер продления
        (allowed: approval_delay / review_delay / mixed / not_specified / not_found).

      extension_mode — механизм продления
        (allowed: automatic / notice_based / by_addendum / not_specified / not_found).

      extension_duration_rule — правило расчёта продления
        (allowed: equal_delay / fixed_days / not_specified / not_found).

      suspension_right — вправе ли подрядчик приостановить работы
        (allowed: yes / no / not_found).

      Если данные отсутствуют: указывай "not_found"; если тема раскрыта,
      но условие прямо не установлено, используй "no" или "not_specified"
      по смыслу поля.
      </task>

      <rules>
      1. auto_extension_present: "yes" — продление прямо предусмотрено;
         "no" — тема есть, но продление отсутствует; "not_found" — тема отсутствует.
      2. extension_trigger: "approval_delay" — задержка согласования;
         "review_delay" — задержка рассмотрения/замечаний; "mixed" — несколько триггеров;
         "not_specified" — триггер неясен; "not_found" — тема отсутствует.
      3. extension_mode: "automatic" — продлевается автоматически;
         "notice_based" — после уведомления; "by_addendum" — по допсоглашению;
         "not_specified" — механизм неясен; "not_found" — тема отсутствует.
      4. extension_duration_rule: "equal_delay" — на срок задержки;
         "fixed_days" — фиксированное количество дней; "not_specified" — правило неясно;
         "not_found" — тема отсутствует.
      5. suspension_right: "yes" — право приостановить работы есть;
         "no" — тема раскрыта, но такого права нет; "not_found" — тема отсутствует.
      6. Не добавляй ключи, не входящие в список полей.
      7. Верни только JSON.
      </rules>
