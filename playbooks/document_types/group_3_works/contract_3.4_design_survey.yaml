      required: true
    - name: review_period_days
      type: string
      label: Срок рассмотрения
      presentation: text
      display_in_grid: true
      display_priority: 2
      description: Срок рассмотрения промежуточных результатов заказчиком.
      max_value_chars: 100
      required: false
    - name: right_to_remarks
      type: string
      label: Право на замечания
