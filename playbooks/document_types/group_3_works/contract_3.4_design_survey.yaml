        display_in_grid: false
        display_priority: 6
        allowed_values:
          - "yes"
          - "no"
          - "not_found"
        description: >
          Указан ли в договоре перечень разделов проектной документации.
        required: false

# ──────────────────────────────────────────────────────────────────────────
# CHECK 3: ТЗ на проектирование: наличие и полнота
# ──────────────────────────────────────────────────────────────────────────
- id: technical_specification_completeness
  name: "ТЗ на проектирование: наличие и полнота (ст. 759 ГК РФ)"
  description: |
    Проверяет наличие ТЗ как приложения, его содержание (параметры объекта,
    нормативы, требования к результату). Без детального ТЗ границы требований
    не определены — спор о качестве и объёме неизбежен.
  triggers: ~
  ui_mode: "field_extraction"
  severity: "critical"
  origin: "DOCUMENT_TYPE"
  detector_type: "hybrid"
  rules:
    keywords:
      - "техническое задание"
      - "ТЗ на проектирование"
      - "задание на проектирование"
      - "приложение"
      - "параметры объекта"
      - "требования к проекту"
    keyword_mode: "any"
    regex_patterns:
      - "(?i)техническ(ое|ого)\\s+задани"
      - "(?i)задани(е|я)\\s+на\\s+проектирован"
  llm:
    prompt_template: |
      [КОНТЕКСТ]
      Ты — юрист, анализирующий договор ПИР.
      Проверяется только один вопрос: наличие технического задания на проектирование
      и достаточность его содержания для определения требований к результату работ
      по ст. 759 ГК РФ.

      Важно:
      — Анализируй только положения о ТЗ, приложениях и составе требований к проектированию.
      — Не оценивай риск и не делай правовых выводов. Только извлекай факты.
      — Если ТЗ отсутствует или не раскрыто в тексте, не додумывай его содержание.

      [ЗАДАЧА]
      1. Установить, присутствует ли ТЗ в договоре или приложениях.
      2. Установить номер приложения с ТЗ.
      3. Проверить, содержит ли ТЗ параметры объекта.
      4. Проверить, содержит ли ТЗ ссылки на нормативы.
      5. Проверить, содержит ли ТЗ требования к результату работ.

      [ПРАВИЛА]
      1. tz_present = "yes" — только если ТЗ прямо указано как приложение
         или его содержание явно доступно в тексте договора.
      2. tz_present = "referenced_but_missing" — если ТЗ упомянуто,
         но из доступного текста видно только ссылка без содержания приложения.
      3. tz_present = "not_found" — если ТЗ или задание на проектирование не упоминается.
      4. tz_contains_object_parameters = "yes" — если есть характеристики объекта:
         назначение, площадь, мощность, этажность, технико-экономические параметры и т.п.;
         "no" — если ТЗ есть, но таких параметров нет; "unclear" — если ТЗ недоступно
         или содержания недостаточно для вывода.
      5. tz_contains_norms_references = "yes" — если указаны СП, ГОСТ, СНиП,
         техрегламенты, обязательные нормативы; "no" — если ТЗ есть, но ссылок нет;
         "unclear" — если ТЗ недоступно или содержание не позволяет сделать вывод.
      6. tz_contains_result_requirements = "yes" — если установлены требования
         к составу, комплектности, форме, объёму результата; "no" — если ТЗ есть,
         но таких требований нет; "unclear" — если ТЗ недоступно.
      7. Если номер приложения не указан, tz_attachment_number = "not_found".

      [ПРИМЕРЫ (FEW-SHOT)]
      Пример 1 — ТЗ приложено и его содержание частично раскрыто:
      Текст: «Подрядчик выполняет работы в соответствии с Техническим заданием
      на проектирование (Приложение № 2). ТЗ содержит основные технико-экономические
      показатели объекта, требования к составу проектной документации и перечень
      применимых нормативных документов.»

      Ответ:
      {
        "tz_present": "yes",
        "tz_attachment_number": "Приложение № 2",
        "tz_contains_object_parameters": "yes",
        "tz_contains_norms_references": "yes",
        "tz_contains_result_requirements": "yes",
        "evidence": [
          "Подрядчик выполняет работы в соответствии с Техническим заданием на проектирование (Приложение № 2).",
          "ТЗ содержит основные технико-экономические показатели объекта, требования к составу проектной документации и перечень применимых нормативных документов."
        ]
      }

      Пример 2 — ТЗ упомянуто, но содержание недоступно:
      Текст: «Работы выполняются по заданию на проектирование, являющемуся приложением к договору.»

      Ответ:
      {
        "tz_present": "referenced_but_missing",
        "tz_attachment_number": "not_found",
        "tz_contains_object_parameters": "unclear",
        "tz_contains_norms_references": "unclear",
        "tz_contains_result_requirements": "unclear",
        "evidence": [
          "Работы выполняются по заданию на проектирование, являющемуся приложением к договору."
        ]
      }

      [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
      1. Проверено ли, что ТЗ реально присутствует, а не только упомянуто?
      2. Не перепутано ли наличие ТЗ с доступностью его содержания?
      3. Для каждого поля yes/no/unclear есть ли основание в тексте?
      4. Не используется ли "no" там, где корректнее "unclear" из-за отсутствия приложения?
      5. Все ли ключи JSON совпадают с output schema?

      [ФОРМАТ ОТВЕТА]
      Верни строго JSON:
      {
        "tz_present": "<yes / referenced_but_missing / not_found>",
        "tz_attachment_number": "<номер приложения или not_found>",
        "tz_contains_object_parameters": "<yes / no / unclear>",
        "tz_contains_norms_references": "<yes / no / unclear>",
        "tz_contains_result_requirements": "<yes / no / unclear>",
        "evidence": ["<цитата 1>", "<цитата 2>"]
      }
    prompt_file: null
    context_k: 6
    temperature: 0.0
    max_tokens: 520
  retrieval:
    corpus_scope: "document"
    context_k: 6
    max_chunks: 8
    retrieval_profile: "technical_documentation_check"
    boost_keywords:
      - "техническое задание"
      - "задание на проектирование"
      - "параметры объекта"
      - "требования к проекту"
      - "нормативы"
      - "приложение"
    negative_keywords:
      - "неустойка"
      - "форс-мажор"
      - "подсудность"
      - "расторжение"
    rerank: true
    filters: {}
  enrichment_hints:
    preferred_segment_types:
      - "clause"
      - "article"
      - "appendix_reference"
    excluded_segment_types:
      - "signature_block"
    preferred_clause_functions:
      - "definitions"
      - "obligations"
  evidence:
    required: true
    min_snippet_length: 50
    max_snippet_length: 600
  extraction:
    enabled: true
    mode: "hybrid"
    store_payload: true
    llm_max_tokens: 700

    compact_output: false

    llm_prompt_extraction: |
      <role>
      Ты — юрист, извлекающий сведения о наличии и полноте технического задания
      на проектирование в договоре ПИР. Не оценивай риски. Только заполняй поля.
      </role>

      <context>
      {context}
      </context>

      <task>
      Заполни строго следующие поля:

      tz_present — наличие ТЗ
        (allowed: yes / referenced_but_missing / not_found).
        "yes" — ТЗ прямо приложено или его содержание доступно в тексте;
        "referenced_but_missing" — ТЗ упомянуто, но содержания нет;
        "not_found" — ТЗ не упоминается.

      tz_attachment_number — номер приложения с ТЗ
        (текстовое значение, например "Приложение № 2", или not_found).

      tz_contains_object_parameters — содержит ли ТЗ параметры объекта
        (allowed: yes / no / unclear).

      tz_contains_norms_references — содержит ли ТЗ ссылки на нормативы
        (allowed: yes / no / unclear).

      tz_contains_result_requirements — содержит ли ТЗ требования к результату работ
        (allowed: yes / no / unclear).

      Если данные отсутствуют: указывай "not_found" только для tz_present
      и tz_attachment_number; для полей полноты используй "unclear",
      если ТЗ недоступно или вывод невозможен.
      </task>

      <rules>
      1. tz_present: "yes" — ТЗ приложено или содержание доступно;
         "referenced_but_missing" — только ссылка без содержания;
         "not_found" — ТЗ не упомянуто.
      2. tz_contains_object_parameters: "yes" — есть параметры объекта;
         "no" — ТЗ есть, но параметров нет; "unclear" — ТЗ недоступно
         или недостаточно данных.
      3. tz_contains_norms_references: "yes" — есть ссылки на нормативы;
         "no" — ТЗ есть, но ссылок нет; "unclear" — ТЗ недоступно
         или недостаточно данных.
      4. tz_contains_result_requirements: "yes" — есть требования к составу,
         комплектности, форме или объёму результата; "no" — ТЗ есть,
         но таких требований нет; "unclear" — ТЗ недоступно.
      5. Не добавляй ключи, не входящие в список полей.
      6. Верни только JSON.
      </rules>
    fields:
      - name: "tz_present"
        type: "string"
        label: "Наличие ТЗ"
        presentation: "badge"
        display_in_grid: true
        display_priority: 1
        allowed_values:
          - "yes"
          - "referenced_but_missing"
          - "not_found"
        description: "Наличие технического задания на проектирование."
        required: true
      - name: "tz_attachment_number"
        type: "string"
        label: "Приложение с ТЗ"
        presentation: "text"
        display_in_grid: false
        display_priority: 4
        keyword_hints:
          - "приложение №"
          - "приложение"
        description: "Номер приложения, содержащего техническое задание."
        max_value_chars: 100
        required: false
      - name: "tz_contains_object_parameters"
        type: "string"
        label: "Параметры объекта в ТЗ"
        presentation: "badge"
        display_in_grid: true
        display_priority: 2
        allowed_values:
          - "yes"
          - "no"
          - "unclear"
        description: "Содержит ли ТЗ параметры объекта проектирования."
        required: false
      - name: "tz_contains_norms_references"
        type: "string"
        label: "Нормативы в ТЗ"
        presentation: "badge"
        display_in_grid: false
        display_priority: 5
        allowed_values:
          - "yes"
          - "no"
          - "unclear"
        description: "Содержит ли ТЗ ссылки на применимые нормативы."
        required: false
      - name: "tz_contains_result_requirements"
        type: "string"
        label: "Требования к результату в ТЗ"
        presentation: "badge"
        display_in_grid: true
        display_priority: 3
        allowed_values:
          - "yes"
          - "no"
          - "unclear"
        description: "Содержит ли ТЗ требования к составу и результату работ."
        required: false

# ──────────────────────────────────────────────────────────────────────────
# CHECK 4: Исходные данные: перечень, сроки, последствия задержки
# ──────────────────────────────────────────────────────────────────────────
- id: initial_data_provision_check
  name: "Исходные данные: перечень, сроки, последствия задержки (ст. 759 ГК РФ)"
  description: |
    Проверяет наличие перечня исходных данных, сроков их предоставления заказчиком
    и последствий задержки. Если данные окажутся неполными или недостоверными,
    проект будет ошибочен, а спор о том, кто платит за переделку — неизбежен.
  triggers: ~
  ui_mode: "field_extraction"
  severity: "high"
  origin: "DOCUMENT_TYPE"
  detector_type: "hybrid"
  rules:
    keywords:
      - "исходные данные"
      - "исходно-разрешительная документация"
      - "ГПЗУ"
      - "технические условия"
      - "ТУ на подключение"
      - "материалы изысканий"
      - "перечень исходных данных"
      - "сроки предоставления"
    keyword_mode: "any"
    regex_patterns:
      - "(?i)исходн(ые|ых)\\s+данн"
      - "(?i)ГПЗУ|градостроительн.*план"
      - "(?i)техническ(ие|их)\\s+услови"
  llm:
    prompt_template: |
      [КОНТЕКСТ]
      Ты — юрист, анализирующий договор ПИР.
      Проверяется только один вопрос: какие исходные данные обязан предоставить заказчик,
      определены ли сроки такого предоставления и как договор распределяет последствия
      задержки или недостоверности исходных данных.

      Важно:
      — Анализируй только положения об исходных данных, документах заказчика
        и последствиях их непредоставления или недостоверности.
      — Не оценивай риск и не делай выводов за пределами текста.
      — Если последствие или срок прямо не указаны, не домысливай их.

      [ЗАДАЧА]
      1. Установить, есть ли перечень исходных данных.
      2. Установить, определены ли сроки предоставления исходных данных.
      3. Установить договорное последствие задержки предоставления данных.
      4. Установить, есть ли оговорка об ответственности заказчика
         за достоверность исходных данных.

      [ПРАВИЛА]
      1. initial_data_list_present = "yes" — если в договоре есть перечень
         исходных данных или перечислены конкретные документы/материалы;
         "no" — если есть только общее упоминание без перечня;
         "not_found" — если тема не раскрыта.
      2. initial_data_deadlines = "specified" — если установлен срок, период,
         событие или крайняя дата предоставления; "not_specified" — если исходные данные
         упомянуты, но срок не установлен; "not_found" — если тема не раскрыта.
      3. delay_consequences = "deadline_extension" — если срок выполнения работ продлевается;
         "rework_at_client_cost" — если переделка/допработы оплачиваются заказчиком;
         "termination_right" — если есть право приостановить работы, отказаться
         от договора или расторгнуть его; "not_specified" — если задержка упомянута
         без ясного последствия; "not_found" — если тема не раскрыта.
      4. data_accuracy_disclaimer = "yes" — если заказчик прямо отвечает
         за полноту/достоверность исходных данных или подрядчик освобождается
         от ответственности за их недостоверность.
      5. data_accuracy_disclaimer = "no" — если тема исходных данных раскрыта,
         но такой оговорки нет.
      6. data_accuracy_disclaimer = "not_found" — если тема исходных данных
         вообще не раскрыта.
      7. Не смешивай последствия задержки исходных данных с общими положениями
         о просрочке исполнения договора.

      [ПРИМЕРЫ (FEW-SHOT)]
      Пример 1 — перечень и сроки определены:
      Текст: «Заказчик передаёт Подрядчику исходные данные, включая ГПЗУ,
      технические условия на подключение и результаты инженерных изысканий,
      в течение 5 рабочих дней с даты подписания договора. В случае нарушения
      указанного срока срок выполнения работ соразмерно продлевается.
      Заказчик несёт ответственность за полноту и достоверность переданных данных.»

      Ответ:
      {
        "initial_data_list_present": "yes",
        "initial_data_deadlines": "specified",
        "delay_consequences": "deadline_extension",
        "data_accuracy_disclaimer": "yes",
        "evidence": [
          "Заказчик передаёт Подрядчику исходные данные, включая ГПЗУ, технические условия на подключение и результаты инженерных изысканий, в течение 5 рабочих дней с даты подписания договора.",
          "В случае нарушения указанного срока срок выполнения работ соразмерно продлевается.",
          "Заказчик несёт ответственность за полноту и достоверность переданных данных."
        ]
      }

      Пример 2 — исходные данные только упомянуты:
      Текст: «Заказчик предоставляет исходные данные, необходимые для выполнения работ.»

      Ответ:
      {
        "initial_data_list_present": "no",
        "initial_data_deadlines": "not_specified",
        "delay_consequences": "not_specified",
        "data_accuracy_disclaimer": "no",
        "evidence": [
          "Заказчик предоставляет исходные данные, необходимые для выполнения работ."
