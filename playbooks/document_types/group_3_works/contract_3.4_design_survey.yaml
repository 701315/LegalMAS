    keyword_mode: any
    regex_patterns:
    - (?i)авторск(ий|ого)\s+надзор
  llm:
    prompt_template: "[КОНТЕКСТ]\nТы — юрист, анализирующий договор ПИР.\nПроверяется только один вопрос: предусмотрен ли авторский надзор\nпроектировщика за строительством, каковы его scope, порядок оплаты\nи ответственность.\n\nВажно:\n— Анализируй только положения об авторском надзоре.\n— Не оценивай риск и не смешивай авторский надзор с технадзором заказчика.\n— Если условие не установлено прямо, не домысливай.\n\n[ЗАДАЧА]\n1. Установить, включён ли авторский надзор в договор.\n2. Определить scope надзора.\n3. Определить порядок оплаты надзора.\n4. Установить, предусмотрена ли ответственность за ненадлежащий надзор.\n\n[ПРАВИЛА]\n1. author_supervision_included = \"yes\" — авторский надзор включён\n   в предмет текущего договора; \"separate_contract\" — предусмотрен,\n   но как отдельный договор; \"not_found\" — тема отсутствует.\n2. supervision_scope = \"full\" — полный авторский надзор за строительством;\n   \"limited\" — ограниченный (только по запросу, выборочный);\n   \"not_specified\"\
      \ — надзор есть, но scope не определён;\n   \"not_found\" — тема отсутствует.\n3. supervision_payment = \"included_in_price\" — оплата входит в цену договора;\n   \"separate_fee\" — оплачивается отдельно;\n   \"not_specified\" — порядок оплаты не определён;\n   \"not_found\" — тема отсутствует.\n4. supervision_liability = \"yes\" — предусмотрена ответственность за ненадлежащий надзор;\n   \"no\" — тема раскрыта, но ответственность не установлена;\n   \"not_found\" — тема отсутствует.\n5. Не путай авторский надзор с техническим надзором заказчика.\n6. Не путай авторский надзор с экспертизой ПД.\n7. Если тема не затронута — все = \"not_found\".\n\n[ПРИМЕРЫ (FEW-SHOT)]\nПример 1 — авторский надзор включён:\nТекст: «Подрядчик осуществляет авторский надзор за строительством\nв полном объёме в соответствии с СП 246.1325800.2016. Стоимость\nавторского надзора включена в цену договора. Подрядчик несёт\nответственность за ненадлежащее осуществление авторского надзора.»\n\nОтвет:\n{\n  \"author_supervision_included\"\
      : \"yes\",\n  \"supervision_scope\": \"full\",\n  \"supervision_payment\": \"included_in_price\",\n  \"supervision_liability\": \"yes\",\n  \"evidence\": [\n    \"Подрядчик осуществляет авторский надзор за строительством в полном объёме в соответствии с СП 246.1325800.2016.\",\n    \"Стоимость авторского надзора включена в цену договора.\",\n    \"Подрядчик несёт ответственность за ненадлежащее осуществление авторского надзора.\"\n  ]\n}\n\nПример 2 — тема не раскрыта:\nТекст: «Подрядчик обязуется разработать проектную документацию.»\n\nОтвет:\n{\n  \"author_supervision_included\": \"not_found\",\n  \"supervision_scope\": \"not_found\",\n  \"supervision_payment\": \"not_found\",\n  \"supervision_liability\": \"not_found\",\n  \"evidence\": []\n}\n\n[ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]\n1. Включён ли авторский надзор в текущий договор или в отдельный?\n2. Определён ли scope — полный или ограниченный?\n3. Определена ли оплата — в составе цены или отдельно?\n4. Есть ли ответственность за ненадлежащий\
      \ надзор?\n5. Все ли ключи JSON совпадают со schema?\n\n[ФОРМАТ ОТВЕТА]\nВерни строго JSON:\n{\n  \"author_supervision_included\": \"<yes / separate_contract / not_found>\",\n  \"supervision_scope\": \"<full / limited / not_specified / not_found>\",\n  \"supervision_payment\": \"<included_in_price / separate_fee / not_specified / not_found>\",\n  \"supervision_liability\": \"<yes / no / not_found>\",\n  \"evidence\": [\"<цитата 1>\", \"<цитата 2>\"]\n}\n"
    prompt_file: null
    context_k: 4
    temperature: 0.0
    max_tokens: 440
  retrieval:
    retrieval_profile: technical_documentation_check
    corpus_scope: document
    context_k: 4
    max_chunks: 6
    boost_keywords:
    - авторский надзор
    - надзор за строительством
    - журнал авторского надзора
    negative_keywords:
    - экспертиза
    - технический надзор
    - форс-мажор
    - подсудность
    rerank: true
    filters: {}
  enrichment_hints:
    preferred_segment_types:
    - clause
    - article
    excluded_segment_types:
    - signature_block
    preferred_clause_functions:
    - obligations
    - obligations
    confidence_bonus_on_match: 0.1
    confidence_penalty_on_excluded_segment: 0.12
  evidence:
    required: true
    min_snippet_length: 30
    max_snippet_length: 500
  extraction:
    enabled: true
    mode: hybrid
    store_payload: true
    llm_max_tokens: 550
    compact_output: false
    llm_prompt_extraction: "<role>\nТы — юрист, извлекающий сведения об авторском надзоре в договоре ПИР.\nНе оценивай риски. Только заполняй поля строго по тексту.\n</role>\n\n<context>\n{context}\n</context>\n\n<task>\nЗаполни строго следующие поля:\n\nauthor_supervision_included — включён ли авторский надзор\n  (allowed: yes / separate_contract / not_found).\n\nsupervision_scope — scope надзора\n  (allowed: full / limited / not_specified / not_found).\n\nsupervision_payment — порядок оплаты надзора\n  (allowed: included_in_price / separate_fee / not_specified / not_found).\n\nsupervision_liability — ответственность за ненадлежащий надзор\n  (allowed: yes / no / not_found).\n\nЕсли данные отсутствуют: указывай \"not_found\".\n</task>\n\n<rules>\n1. author_supervision_included: \"yes\" — в текущем договоре;\n   \"separate_contract\" — в отдельном; \"not_found\" — тема отсутствует.\n2. supervision_scope: \"full\" — полный; \"limited\" — ограниченный;\n   \"not_specified\" — scope неясен;\
      \ \"not_found\" — тема отсутствует.\n3. supervision_payment: \"included_in_price\" — входит в цену;\n   \"separate_fee\" — отдельная оплата; \"not_specified\" — порядок неясен;\n   \"not_found\" — тема отсутствует.\n4. supervision_liability: \"yes\" — ответственность установлена;\n   \"no\" — тема раскрыта, но ответственность нет;\n   \"not_found\" — тема отсутствует.\n5. Не добавляй ключи, не входящие в список полей.\n6. Верни только JSON.\n</rules>\n"
    fields:
    - name: author_supervision_included
      type: string
      label: Авторский надзор включён
      presentation: badge
      display_in_grid: true
      display_priority: 1
      allowed_values:
      - 'yes'
      - separate_contract
      - not_found
      description: Включён ли авторский надзор в договор.
      required: true
    - name: supervision_scope
      type: string
      label: Scope надзора
      presentation: badge
      display_in_grid: true
      display_priority: 2
      allowed_values:
      - full
      - limited
      - not_specified
      - not_found
      description: Объём авторского надзора.
      required: false
    - name: supervision_payment
      type: string
      label: Оплата надзора
      presentation: badge
      display_in_grid: true
      display_priority: 3
      allowed_values:
      - included_in_price
      - separate_fee
      - not_specified
      - not_found
      description: Порядок оплаты авторского надзора.
      required: false
    - name: supervision_liability
      type: string
      label: Ответственность за надзор
      presentation: badge
      display_in_grid: false
      display_priority: 4
      allowed_values:
      - 'yes'
      - 'no'
      - not_found
      description: Предусмотрена ли ответственность за ненадлежащий надзор.
      required: false
- id: quality_warranty
  name: Гарантия качества документации и соответствие нормативам (ст. 761 ГК РФ)
  description: 'Проверяет наличие гарантий соответствия ПД нормативным требованиям (СП, ГОСТ,

    СНиП, техрегламенты), ТЗ и исходным данным. Включает проверку ссылок

    на применимые нормативы проектирования.

    '
  legal_base: ст. 761 ГК РФ, ФЗ-384
  triggers: null
  ui_mode: field_extraction
  severity: high
  severity_if_pass: pass
  severity_if_fail: high
  severity_if_unclear: high
  origin: DOCUMENT_TYPE
  detector_type: hybrid
  rules:
    keywords:
    - гарантирует соответствие
    - нормативные требования
    - техническое задание
    - действующие нормы
    - СНиП
    - СП
    - ГОСТ
    - качество документации
    - Свод правил
    - технический регламент
    - нормы проектирования
    keyword_mode: any
    regex_patterns:
    - (?i)гарантиру(ет|ют).*соответств
    - (?i)документаци.*соответств.*норм
    - (?i)\b(СП|ГОСТ|СНиП)\s+\d
    - (?i)техническ(ий|ого)\s+регламент
  llm:
    prompt_template: "[КОНТЕКСТ]\nТы — юрист, анализирующий договор ПИР.\nПроверяется только один вопрос: гарантирует ли подрядчик соответствие\nпроектной документации нормативным требованиям, ТЗ и исходным данным,\nи содержит ли договор ссылки на применимые нормативы.\n\nВажно:\n— Анализируй только положения о качестве ПД, гарантиях соответствия\n  и ссылках на нормативы проектирования.\n— Не оценивай риск и не смешивай гарантию качества ПД\n  с гарантийным сроком на документацию.\n— Если условие не установлено прямо, не домысливай.\n\n[ЗАДАЧА]\n1. Установить, гарантирует ли подрядчик соответствие ПД нормативам.\n2. Установить, гарантирует ли подрядчик соответствие ПД техническому заданию.\n3. Установить, содержит ли договор ссылки на конкретные нормативы (СП, ГОСТ, СНиП).\n4. Определить, перечислены ли конкретные нормативные документы.\n5. Установить, предусмотрена ли обязанность следить за изменениями нормативов.\n\n[ПРАВИЛА]\n1. quality_guarantee_present = \"yes\" — если подрядчик прямо\
      \ гарантирует\n   соответствие ПД нормативным требованиям;\n   \"no\" — если тема раскрыта, но гарантии нет;\n   \"not_found\" — если тема отсутствует.\n2. tz_compliance_guaranteed = \"yes\" — если подрядчик гарантирует\n   соответствие ПД техническому заданию;\n   \"no\" — если тема раскрыта, но гарантии нет;\n   \"not_found\" — если тема отсутствует.\n3. norms_referenced = \"yes\" — если в договоре есть ссылки\n   на конкретные нормативы (СП, ГОСТ, СНиП, техрегламенты);\n   \"general_reference\" — если есть общая ссылка на «действующие нормы»\n   без перечисления конкретных документов;\n   \"no\" — если тема раскрыта, но ссылок нет;\n   \"not_found\" — если тема отсутствует.\n4. specific_norms_listed — перечень конкретных нормативов\n   (текст) или \"not_found\".\n5. norms_update_obligation = \"yes\" — если подрядчик обязан учитывать\n   изменения нормативов в период выполнения работ;\n   \"no\" — если тема раскрыта, но такой обязанности нет;\n   \"not_found\" — если тема отсутствует.\n\
      6. Не путай гарантию соответствия нормам (факт на момент сдачи)\n   с гарантийным сроком (период после сдачи).\n7. Не путай ссылки на нормативы в ТЗ со ссылками в самом договоре.\n\n[ПРИМЕРЫ (FEW-SHOT)]\nПример 1 — гарантия и нормативы определены:\nТекст: «Подрядчик гарантирует, что проектная документация соответствует\nтребованиям СП 54.13330.2022, ГОСТ 21.501-2018, а также Техническому заданию\nи действующим нормативным документам на дату завершения работ.\nПодрядчик обязан учитывать изменения нормативов, вступившие в силу\nв период выполнения работ.»\n\nОтвет:\n{\n  \"quality_guarantee_present\": \"yes\",\n  \"tz_compliance_guaranteed\": \"yes\",\n  \"norms_referenced\": \"yes\",\n  \"specific_norms_listed\": \"СП 54.13330.2022, ГОСТ 21.501-2018\",\n  \"norms_update_obligation\": \"yes\",\n  \"evidence\": [\n    \"Подрядчик гарантирует, что проектная документация соответствует требованиям СП 54.13330.2022, ГОСТ 21.501-2018, а также Техническому заданию и действующим нормативным\
      \ документам на дату завершения работ.\",\n    \"Подрядчик обязан учитывать изменения нормативов, вступившие в силу в период выполнения работ.\"\n  ]\n}\n\nПример 2 — только общая ссылка:\nТекст: «Документация должна соответствовать действующим нормам и правилам.»\n\nОтвет:\n{\n  \"quality_guarantee_present\": \"yes\",\n  \"tz_compliance_guaranteed\": \"not_found\",\n  \"norms_referenced\": \"general_reference\",\n  \"specific_norms_listed\": \"not_found\",\n  \"norms_update_obligation\": \"not_found\",\n  \"evidence\": [\n    \"Документация должна соответствовать действующим нормам и правилам.\"\n  ]\n}\n\n[ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]\n1. Есть ли именно гарантия качества, а не гарантийный срок?\n2. Разграничены ли конкретные ссылки на нормативы и общая формулировка?\n3. Есть ли отдельная гарантия соответствия ТЗ?\n4. Есть ли обязанность учитывать изменения нормативов?\n5. Все ли ключи JSON совпадают со schema?\n\n[ФОРМАТ ОТВЕТА]\nВерни строго JSON:\n{\n  \"quality_guarantee_present\"\
      : \"<yes / no / not_found>\",\n  \"tz_compliance_guaranteed\": \"<yes / no / not_found>\",\n  \"norms_referenced\": \"<yes / general_reference / no / not_found>\",\n  \"specific_norms_listed\": \"<текст или not_found>\",\n  \"norms_update_obligation\": \"<yes / no / not_found>\",\n  \"evidence\": [\"<цитата 1>\", \"<цитата 2>\"]\n}\n"
    prompt_file: null
    context_k: 6
    temperature: 0.0
    max_tokens: 520
  retrieval:
    retrieval_profile: warranties_check
    corpus_scope: document
    context_k: 6
    max_chunks: 8
    boost_keywords:
    - гарантирует соответствие
    - качество документации
    - нормативные требования
    - СП
    - ГОСТ
    - СНиП
    - технический регламент
    negative_keywords:
    - гарантийный срок
    - экспертиза
    - форс-мажор
    - подсудность
    rerank: true
    filters: {}
  enrichment_hints:
    preferred_segment_types:
    - clause
    - article
    excluded_segment_types:
    - signature_block
    preferred_clause_functions:
    - representations
    - representations
    confidence_bonus_on_match: 0.1
    confidence_penalty_on_excluded_segment: 0.12
  evidence:
    required: true
    min_snippet_length: 40
    max_snippet_length: 700
  extraction:
    enabled: true
    mode: hybrid
    store_payload: true
    llm_max_tokens: 700
    compact_output: false
    llm_prompt_extraction: "<role>\nТы — юрист, извлекающий сведения о гарантии качества ПД\nи нормативных ссылках в договоре ПИР. Не оценивай риски.\nТолько заполняй поля строго по тексту.\n</role>\n\n<context>\n{context}\n</context>\n\n<task>\nЗаполни строго следующие поля:\n\nquality_guarantee_present — гарантирует ли подрядчик соответствие ПД нормативам\n  (allowed: yes / no / not_found).\n\ntz_compliance_guaranteed — гарантирует ли подрядчик соответствие ПД техзаданию\n  (allowed: yes / no / not_found).\n\nnorms_referenced — есть ли ссылки на нормативы\n  (allowed: yes / general_reference / no / not_found).\n\nspecific_norms_listed — перечень конкретных нормативов\n  (текстовое значение или not_found).\n\nnorms_update_obligation — обязанность учитывать изменения нормативов\n  (allowed: yes / no / not_found).\n\nЕсли данные отсутствуют: указывай \"not_found\".\n</task>\n\n<rules>\n1. quality_guarantee_present: \"yes\" — гарантия есть; \"no\" — тема раскрыта,\n   но гарантии нет; \"not_found\"\
      \ — тема отсутствует.\n2. tz_compliance_guaranteed: \"yes\" — гарантия соответствия ТЗ есть;\n   \"no\" — нет; \"not_found\" — тема отсутствует.\n3. norms_referenced: \"yes\" — конкретные нормативы перечислены;\n   \"general_reference\" — только общая ссылка на «действующие нормы»;\n   \"no\" — тема есть, но ссылок нет; \"not_found\" — тема отсутствует.\n4. specific_norms_listed: извлекай перечень кратко, например\n   \"СП 54.13330.2022, ГОСТ 21.501-2018\"; или \"not_found\".\n5. norms_update_obligation: \"yes\" — обязанность есть; \"no\" — нет;\n   \"not_found\" — тема отсутствует.\n6. Не добавляй ключи, не входящие в список полей.\n7. Верни только JSON.\n</rules>\n"
    fields:
    - name: quality_guarantee_present
      type: string
      label: Гарантия качества ПД
      presentation: badge
      display_in_grid: true
      display_priority: 1
      allowed_values:
      - 'yes'
      - 'no'
      - not_found
      description: Гарантирует ли подрядчик соответствие ПД нормативам.
      required: true
    - name: tz_compliance_guaranteed
      type: string
      label: Соответствие ТЗ
