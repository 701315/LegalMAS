# CHECK 20: Гарантийный срок на проектную документацию
# ──────────────────────────────────────────────────────────────────────────
- id: warranty_period_for_documentation
  name: "Гарантийный срок на проектную документацию (ст. 724, 761 ГК РФ)"
  description: |
    Проверяет наличие гарантийного срока, в течение которого проектировщик обязан
    безвозмездно устранять дефекты, и порядок предъявления претензий по качеству.
  legal_base: "ст. 724, 761 ГК РФ"
  triggers: ~
  ui_mode: "field_extraction"
  severity: "high"
  origin: "DOCUMENT_TYPE"
  detector_type: "hybrid"
  rules:
    keywords:
      - "гарантийный срок"
      - "гарантия на документацию"
      - "безвозмездное устранение"
      - "дефекты документации"
      - "гарантийные обязательства"
    keyword_mode: "any"
    regex_patterns:
      - "(?i)гарантийн(ый|ого)\\s+срок"
      - "(?i)безвозмездн(ое|ого)\\s+устранен"
  llm:
    prompt_template: |
      [КОНТЕКСТ]
      Ты — юрист, анализирующий договор ПИР.
      Проверяется только один вопрос: установлен ли гарантийный срок
      на проектную документацию, его продолжительность, момент начала
      и порядок устранения дефектов в гарантийный период.

      Важно:
      — Анализируй только положения о гарантийном сроке на ПД
        и безвозмездном устранении дефектов.
      — Не оценивай риск и не смешивай гарантийный срок с гарантией качества (соответствия нормам).
      — Если условие не установлено прямо, не домысливай.

      [ЗАДАЧА]
      1. Установить, определён ли гарантийный срок.
      2. Извлечь продолжительность гарантийного срока.
      3. Определить момент начала отсчёта.
      4. Установить, предусмотрено ли безвозмездное устранение дефектов.
      5. Извлечь срок устранения дефектов в гарантийный период.

      [ПРАВИЛА]
      1. warranty_period_present = "yes" — гарантийный срок установлен;
         "no" — тема раскрыта, но срок не установлен;
         "not_found" — тема отсутствует.
      2. warranty_period_duration — продолжительность (текст);
         если не указана — "not_found".
      3. warranty_start_event = "from_acceptance" — с даты подписания акта приёмки;
         "from_commissioning" — с ввода объекта в эксплуатацию;
         "from_expertise" — с даты положительного заключения;
         "not_specified" — момент начала не определён;
         "not_found" — тема отсутствует.
      4. free_defect_remedy = "yes" — безвозмездное устранение предусмотрено;
         "no" — тема раскрыта, но безвозмездности нет;
         "not_found" — тема отсутствует.
      5. defect_remedy_period — срок устранения дефектов (текст);
         если не указан — "not_found".
      6. Не путай гарантийный срок (период после сдачи) с гарантией качества (соответствие нормам).
      7. Если тема не затронута — все = "not_found".

      [ПРИМЕРЫ (FEW-SHOT)]
      Пример 1 — гарантийный срок установлен:
      Текст: «Гарантийный срок на проектную документацию составляет 36 месяцев
      с даты подписания акта сдачи-приёмки. В течение гарантийного срока
      Подрядчик обязан безвозмездно устранить дефекты документации
      в течение 15 рабочих дней с момента получения претензии.»

      Ответ:
      {
        "warranty_period_present": "yes",
        "warranty_period_duration": "36 месяцев",
        "warranty_start_event": "from_acceptance",
        "free_defect_remedy": "yes",
        "defect_remedy_period": "15 рабочих дней",
        "evidence": [
          "Гарантийный срок на проектную документацию составляет 36 месяцев с даты подписания акта сдачи-приёмки.",
          "В течение гарантийного срока Подрядчик обязан безвозмездно устранить дефекты документации в течение 15 рабочих дней с момента получения претензии."
        ]
      }

      Пример 2 — тема не раскрыта:
      Текст: «Подрядчик гарантирует качество проектной документации.»

      Ответ:
      {
        "warranty_period_present": "not_found",
        "warranty_period_duration": "not_found",
        "warranty_start_event": "not_found",
        "free_defect_remedy": "not_found",
        "defect_remedy_period": "not_found",
        "evidence": [
          "Подрядчик гарантирует качество проектной документации."
        ]
      }

      [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
      1. Есть ли именно гарантийный срок (период), а не гарантия качества?
      2. Извлечена ли продолжительность в месяцах или годах?
      3. Определён ли момент начала отсчёта?
      4. Есть ли безвозмездное устранение дефектов?
      5. Все ли ключи JSON совпадают со schema?

      [ФОРМАТ ОТВЕТА]
      Верни строго JSON:
      {
        "warranty_period_present": "<yes / no / not_found>",
        "warranty_period_duration": "<текст или not_found>",
        "warranty_start_event": "<from_acceptance / from_commissioning / from_expertise / not_specified / not_found>",
        "free_defect_remedy": "<yes / no / not_found>",
        "defect_remedy_period": "<текст или not_found>",
        "evidence": ["<цитата 1>", "<цитата 2>"]
      }
    prompt_file: null
    context_k: 5
    temperature: 0.0
    max_tokens: 480
  retrieval:
    retrieval_profile: "warranties_check"
    corpus_scope: "document"
    context_k: 5
    max_chunks: 8
    boost_keywords:
      - "гарантийный срок"
      - "безвозмездное устранение"
      - "дефекты документации"
      - "гарантийные обязательства"
    negative_keywords:
      - "гарантирует соответствие"
      - "экспертиза"
      - "форс-мажор"
      - "подсудность"
    rerank: true
    filters: {}
  enrichment_hints:
    preferred_segment_types:
      - "clause"
      - "article"
    excluded_segment_types:
      - "signature_block"
    preferred_clause_functions:
      - "representations"
      - "remedies"
  evidence:
    required: true
    min_snippet_length: 40
    max_snippet_length: 600
  extraction:
    enabled: true
    mode: "hybrid"
    store_payload: true
    llm_max_tokens: 700

    compact_output: false

    llm_prompt_extraction: |
      <role>
      Ты — юрист, извлекающий сведения о гарантийном сроке на ПД
      в договоре ПИР. Не оценивай риски. Только заполняй поля строго по тексту.
      </role>

      <context>
      {context}
      </context>

      <task>
      Заполни строго следующие поля:

      warranty_period_present — установлен ли гарантийный срок
        (allowed: yes / no / not_found).

      warranty_period_duration — продолжительность гарантийного срока
        (текстовое значение или not_found).

      warranty_start_event — момент начала отсчёта
        (allowed: from_acceptance / from_commissioning / from_expertise / not_specified / not_found).

      free_defect_remedy — безвозмездное устранение дефектов
        (allowed: yes / no / not_found).

      defect_remedy_period — срок устранения дефектов
        (текстовое значение или not_found).

      Если данные отсутствуют: указывай "not_found".
      </task>

      <rules>
      1. warranty_period_present: "yes" — срок установлен; "no" — тема есть,
         но срок нет; "not_found" — тема отсутствует.
      2. warranty_period_duration: текст с единицей; или "not_found".
      3. warranty_start_event: "from_acceptance" — с приёмки;
         "from_commissioning" — с ввода в эксплуатацию;
         "from_expertise" — с положительного заключения;
         "not_specified" — неясно; "not_found" — тема отсутствует.
      4. free_defect_remedy: "yes" — безвозмездно; "no" — нет;
         "not_found" — тема отсутствует.
      5. defect_remedy_period: текст с единицей; или "not_found".
      6. Не добавляй ключи, не входящие в список полей.
      7. Верни только JSON.
      </rules>
    fields:
      - name: "warranty_period_present"
        type: "string"
        label: "Гарантийный срок"
        presentation: "badge"
        display_in_grid: true
        display_priority: 1
