         "not_found" — тема отсутствует.
      3. delay_consequences: "deadline_extension" — срок работ продлевается;
         "rework_at_client_cost" — переделка/допработы за счёт заказчика;
         "termination_right" — право приостановить или прекратить договор;
         "not_specified" — последствие неясно; "not_found" — тема отсутствует.
      4. data_accuracy_disclaimer: "yes" — заказчик отвечает за достоверность
         или подрядчик освобождён от ответственности за недостоверные данные;
         "no" — тема исходных данных есть, но оговорки нет; "not_found" — тема отсутствует.
      5. Не добавляй ключи, не входящие в список полей.
      6. Верни только JSON.
      </rules>
