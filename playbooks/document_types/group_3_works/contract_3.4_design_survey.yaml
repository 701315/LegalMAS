type: contract_3.4_design_survey
name: "Договор на выполнение проектных и изыскательских работ"

description: |
  Специализированный вид подряда, направленный на создание интеллектуального продукта:
  проектной и рабочей документации для строительства (стадии «П» и «Р») и/или отчётов
  по инженерным изысканиям. Результат имеет документарную форму и служит основой для
  последующих строительных работ, определяя их стоимость, безопасность и реализуемость.
  Отличается от строительного подряда отсутствием вещественного результата, но сохраняет
  признаки работы по заданию. Регулируется § 4 Главы 37 ГК РФ (ст. 758–762)
  и Градостроительным кодексом РФ (ст. 47–49, 55.8).

version: 4.0
parent: class_3_work_performance

# Структура
#   classification_runtime_v1  → YAMLRegistry (L1/L2 классификация)
#   trigger_definitions        → TriggerDetector
#   checks_v8                  → DocTypeCheckLoader (прямое исполнение)
#   doc_type_checks            → DocTypeCheckConverter (авто-конверсия)
#   dd_request_templates       → DDRequestTemplateLoader
#   compliance_rules           → exclusion_logic → compliance-проверки

metadata:
  category: contract
  subcategory: work_performance
  complexity: high
  risk_level: high
  jurisdiction: RU
  language: ru
  legal_base: "§ 4 Главы 37 ГК РФ (ст. 758-762), ГрК РФ (ст. 47-49, 55.8)"
  doc_types_supported:
    - "договор на выполнение проектных работ"
    - "договор на выполнение изыскательских работ"
    - "договор на выполнение проектных и изыскательских работ (ПИР)"
    - "договор подряда на проектирование"
    - "контракт на инженерные изыскания"
    - "договор на разработку проектно-сметной документации"
    - "договор на разработку проектной документации стадии П"
    - "договор на разработку рабочей документации стадии Р"
    - "договор генерального проектирования"

engine_expectations:
  evidence_required: true
  evidence_style: "pinpoint"
  allow_not_found: true
  output_style: "dd_grid"
  prefer_structured_outputs: true

