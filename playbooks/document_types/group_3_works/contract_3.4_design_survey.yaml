            - "price_list"
          preferred_clause_functions:
            - "obligations"
            - "procedures"
          confidence_bonus_on_match: 0.10
          confidence_penalty_on_excluded_segment: 0.12
      evidence:
        required: true
        min_snippet_length: 30
        max_snippet_length: 650
      extraction:
        enabled: true
        mode: "hybrid"
        compact_output: false
        llm_max_tokens: 700
        llm_prompt_extraction: |
          <role>
          Ты — российский юрист. Извлеки из договора ПИР сведения о порядке оплаты:
          аванс, этапность, привязка к актам, триггер окончательного расчёта.
          Не анализируй цену договора, неустойку или иные темы.
          </role>
          <context>
          {context}
