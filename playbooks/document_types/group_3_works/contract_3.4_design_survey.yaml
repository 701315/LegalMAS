    llm_prompt_extraction: "<role>\nТы — юрист, извлекающий сведения о поэтапном согласовании\nи отступлениях от ТЗ в договоре ПИР. Не оценивай риски.\nТолько заполняй поля строго по тексту.\n</role>\n\n<context>\n{context}\n</context>\n\n<task>\nЗаполни строго следующие поля:\n\nstagewise_approval_present — предусмотрено ли поэтапное согласование\n  (allowed: yes / no / not_found).\n\nreview_period_days — срок рассмотрения заказчиком\n  (текстовое значение или not_found).\n\nright_to_remarks — право заказчика на замечания\n  (allowed: yes / no / not_found).\n\nauto_approval_on_silence — авто-приёмка при молчании заказчика\n  (allowed: yes / no / not_found).\n\ntz_deviation_procedure — порядок согласования отступлений от ТЗ\n  (allowed: defined / not_defined / not_found).\n\nscope_change_procedure — порядок согласования изменений объёма работ\n  (allowed: defined / not_defined / not_found).\n\nЕсли данные отсутствуют: указывай \"not_found\".\n</task>\n\n<rules>\n1. stagewise_approval_present:\
      \ \"yes\" — есть процедура; \"no\" — тема раскрыта, но нет;\n   \"not_found\" — тема отсутствует.\n2. review_period_days: числовое значение с единицей измерения или \"not_found\".\n3. right_to_remarks: \"yes\" — право есть; \"no\" — тема раскрыта, но нет;\n   \"not_found\" — тема отсутствует.\n4. auto_approval_on_silence: \"yes\" — молчание = согласование; \"no\" — нет;\n   \"not_found\" — тема отсутствует.\n5. tz_deviation_procedure: \"defined\" — порядок установлен; \"not_defined\" — тема есть,\n   но порядок не определён; \"not_found\" — тема отсутствует.\n6. scope_change_procedure: \"defined\" — порядок установлен; \"not_defined\" — тема есть,\n   но порядок не определён; \"not_found\" — тема отсутствует.\n7. Не добавляй ключи, не входящие в список полей.\n8. Верни только JSON.\n</rules>\n"
    fields:
    - name: stagewise_approval_present
      type: string
      label: Поэтапное согласование
      presentation: badge
      display_in_grid: true
      display_priority: 1
