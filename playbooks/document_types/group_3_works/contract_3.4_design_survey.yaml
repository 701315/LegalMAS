  - id: designer_vs_builder_liability
    name: "Разграничение ответственности проектировщика и строителя"
    description: >
      Фактографическая проверка наличия условия о разграничении ответственности
      проектировщика (подрядчика по ПИР) и строительного подрядчика за дефекты,
      а также выделения авторского надзора как отдельной услуги в договоре на
      выполнение проектных и изыскательских работ. Это критически важная специфика
      договоров ПИР: проектировщик создаёт интеллектуальный продукт (проектную документацию),
      но не участвует непосредственно в строительстве. Если строительный подрядчик отклоняется
      от проекта без согласования с проектировщиком, возникает вопрос: кто отвечает за дефекты —
      проектировщик (за некачественный проект) или строитель (за нарушение проекта)? Проверка
      выявляет три аспекта: (1) наличие явного разграничения ответственности между проектировщиком
      и строителем — типичная защита проектировщика от рисков, связанных с действиями строителей;
      (2) scope ответственности проектировщика — ограничивается ли она только качеством проектной
      документации или включает авторский надзор; (3) является ли авторский надзор отдельной
      услугой/договором — в российской практике авторский надзор часто оформляется отдельным
      договором, т.к. это самостоятельная услуга, не входящая в обязательный объём ПИР.
      Отсутствие чёткого разграничения создаёт для проектировщика риск ответственности за дефекты,
      вызванные действиями строителей, а для заказчика — риск споров о том, кто отвечает за
      некачественный результат.
    triggers: {}
    ui_mode: "field_extraction"
