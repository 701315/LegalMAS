      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора ПИР сведения о передаче
        исключительных (интеллектуальных) прав на проектную документацию, включая
        сохранение прав подрядчика на типовые решения, методики и ноу-хау.
        Не анализируй цену, сроки, неустойку или иные темы.
        Не путай полную передачу прав (отчуждение) с лицензией.
        Не путай исключительное право (имущественное) с правом авторства (неимущественное).
        Не путай права на конкретный проект с правами на типовые решения подрядчика.
        Не применяй диспозитивные нормы ГК РФ (ст. 1296, 1298) как факт — извлекай только то, что прямо есть в тексте.
        </role>
        <context>
        {context}
        </context>
        <task>
        Заполни строго следующие 10 полей (плюс evidence):
        1. ip_transfer_status — статус передачи прав: full_transfer / license / retained_by_contractor / not_defined.
        2. ip_transfer_status_display — человеко-читаемое значение: "Полная передача (отчуждение) Заказчику" / "Лицензия (простая/неисключительная)" / "Лицензия (исключительная)" / "Права остаются у Подрядчика" / "Данные не определены".
        3. ip_transfer_moment — момент перехода прав: upon_payment / upon_signing / upon_acceptance / not_specified / not_defined.
        4. ip_transfer_moment_display — человеко-читаемое значение: "С момента подписания договора" / "С момента подписания акта сдачи-приёмки" / "С момента полной оплаты" / "Не указан" / "Данные не определены" / "Не применимо".
        5. reuse_allowed — повторное использование: yes / no / unclear / not_defined.
        6. reuse_allowed_display — человеко-читаемое значение: "Да, повторное использование разрешено" / "Нет, повторное использование запрещено" / "Не удалось определить" / "Данные не определены" / "Не применимо".
        7. modification_allowed — модификация: yes / no / unclear / not_defined.
        8. modification_allowed_display — человеко-читаемое значение: "Да, модификация разрешена" / "Нет, требуется согласие Подрядчика" / "Не удалось определить" / "Данные не определены" / "Не применимо".
        9. standard_solutions_retained — сохранение прав на типовые решения: yes / no / not_defined.
        10. standard_solutions_retained_display — человеко-читаемое значение: "Да, права сохраняются за Подрядчиком" / "Нет, права передаются Заказчику" / "Данные не определены" / "Не применимо".

        Маппинг enum → display:
        - ip_transfer_status: full_transfer → "Полная передача (отчуждение) Заказчику", license → "Лицензия (простая/неисключительная)" или "Лицензия (исключительная)" (уточни по тексту), retained_by_contractor → "Права остаются у Подрядчика", not_defined → "Данные не определены"
        - ip_transfer_moment: upon_payment → "С момента полной оплаты", upon_signing → "С момента подписания договора", upon_acceptance → "С момента подписания акта сдачи-приёмки", not_specified → "Не указан", not_defined → "Данные не определены" или "Не применимо"
        - reuse_allowed: yes → "Да, повторное использование разрешено", no → "Нет, повторное использование запрещено", unclear → "Не удалось определить", not_defined → "Данные не определены" или "Не применимо"
        - modification_allowed: yes → "Да, модификация разрешена", no → "Нет, требуется согласие Подрядчика", unclear → "Не удалось определить", not_defined → "Данные не определены" или "Не применимо"
        - standard_solutions_retained: yes → "Да, права сохраняются за Подрядчиком", no → "Нет, права передаются Заказчику", not_defined → "Данные не определены" или "Не применимо"

        Критические правила:
        - Если ip_transfer_status = "retained_by_contractor" (исключительное право остаётся у подрядчика), то ip_transfer_moment, reuse_allowed, modification_allowed, standard_solutions_retained = "not_defined", а их display-версии = "Не применимо" (вопрос о типовых решениях неактуален, т.к. все права и так у подрядчика).
        - Если ip_transfer_status = "not_defined" (условие не упоминается), то все остальные поля = "not_defined", display = "Данные не определены".
        - Если ip_transfer_status = "full_transfer" или "license", и в договоре прямо указано, что подрядчик сохраняет права на типовые решения/методики/ноу-хау — standard_solutions_retained = "yes".
        - Если ip_transfer_status = "full_transfer" или "license", и в договоре НЕТ оговорки о типовых решениях — standard_solutions_retained = "not_defined", display = "Данные не определены" (вопрос не урегулирован).
        </task>
        <context_rules>
        - Используй только текст договора. Не выдумывай условия передачи прав — извлекай строго из переданного фрагмента.
        - Не опирайся на внешние знания о типовых условиях договоров ПИР.
        - Не применяй диспозитивные нормы ГК РФ (ст. 1296, 1298) как факт — извлекай только то, что прямо указано в тексте.
        - Не путай полную передачу прав (отчуждение) с лицензией — это разные юридические конструкции.
        - Не путай исключительное право (имущественное, отчуждаемое) с правом авторства (неимущественное, неотчуждаемое).
        - Не путай передачу прав на проектную документацию с передачей прав на ноу-хау / методики подрядчика.
        - Не путай права на конкретный проект с правами на типовые решения подрядчика.
        - Верни строго валидный JSON. Все 10 ключей + evidence обязаны присутствовать.
        - Запрещены: null, None, пустые строки "".
        - Убедись, что enum-значения соответствуют их display-версиям согласно маппингу выше.
        - Различай "no" (условие прямо запрещено) и "unclear" (формулировка допускает разные толкования).
        - Если в договоре прямо указана "исключительная лицензия" — используй ip_transfer_status = "license" и в display укажи "Лицензия (исключительная)".
        - Ищи ключевые слова "типовые решения", "ноу-хау", "методики", "библиотеки", "сохраняются за Подрядчиком" для определения standard_solutions_retained.
        </context_rules>

        <output_expectations>
        - Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        - Не используй markdown fences.
        - Не добавляй пояснения до или после JSON.
        - Верни все ключи, перечисленные в task, без пропусков.
        - Не используй null, None или пустые строки.
        - Для статусных полей используй только значения из allowed_values или "not_defined".
        - Для текстовых полей при отсутствии данных используй "Данные не определены" / "Не удалось определить" / "Не применимо" — согласно правилам выше.
        </output_expectations>
      fields:
        - name: "ip_transfer_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["full_transfer", "license", "retained_by_contractor", "not_defined"]
          description: "Статус передачи исключительных прав на проектную документацию (enum)."
          required: true
          display_in_grid: false
        - name: "ip_transfer_status_display"
          type: "string"
          presentation: "fact"
          label: "Статус передачи прав"
          description: "Человеко-читаемое значение: статус передачи исключительных прав на проектную документацию."
          required: true
          display_in_grid: true
          display_priority: 1
        - name: "ip_transfer_moment"
          type: "string"
          presentation: "signal"
          allowed_values: ["upon_payment", "upon_signing", "upon_acceptance", "not_specified", "not_defined"]
          description: "Момент перехода исключительных прав (enum)."
          required: true
          display_in_grid: false
        - name: "ip_transfer_moment_display"
          type: "string"
          presentation: "fact"
          label: "Момент перехода прав"
          description: "Человеко-читаемое значение: момент перехода исключительных прав на проектную документацию."
          required: false
          display_in_grid: true
          display_priority: 2
        - name: "reuse_allowed"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no", "unclear", "not_defined"]
          description: "Разрешено ли повторное использование проекта заказчиком (enum)."
          required: true
          display_in_grid: false
        - name: "reuse_allowed_display"
          type: "string"
          presentation: "fact"
          label: "Повторное использование"
          description: "Человеко-читаемое значение: разрешено ли повторное использование проектной документации заказчиком."
          required: false
          display_in_grid: true
          display_priority: 3
        - name: "modification_allowed"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no", "unclear", "not_defined"]
          description: "Разрешена ли модификация проекта без согласия автора (enum)."
          required: true
          display_in_grid: false
        - name: "modification_allowed_display"
          type: "string"
          presentation: "fact"
          label: "Модификация проекта"
          description: "Человеко-читаемое значение: разрешена ли модификация проекта без согласия автора."
          required: false
          display_in_grid: true
          display_priority: 4
        - name: "standard_solutions_retained"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Сохраняет ли подрядчик права на типовые решения, методики и ноу-хау, использованные в проекте (enum)."
          required: true
          display_in_grid: false
        - name: "standard_solutions_retained_display"
          type: "string"
          presentation: "fact"
          label: "Права на типовые решения подрядчика"
          description: "Человеко-читаемое значение: сохраняет ли подрядчик права на типовые решения, методики и ноу-хау, использованные в проекте."
          required: false
          display_in_grid: true
          display_priority: 5

  - id: designer_liability_for_errors
    name: "Ответственность проектировщика за ошибки в ПД (ст. 761 ГК РФ)"
    description: >
      Фактографическая проверка режима ответственности проектировщика (подрядчика)
      за ошибки и недостатки в проектной и изыскательской документации в соответствии
      со ст. 761 ГК РФ. Это критически важная специфика договоров ПИР: в отличие от
      обычного подряда, недостатки в ПД могут привести к колоссальным убыткам на стадии
      строительства. Проверка выявляет пять аспектов: (1) наличие специальной ответственности
      за ошибки в ПД (помимо общей ответственности за просрочку); (2) объём ответственности —
      ограничивается ли он только переделкой самой документации, или включает возмещение
      расходов на переделку строительных работ, вызванных ошибками в проекте (классическая
      норма ст. 761 ГК РФ), или предусматривает возмещение полных убытков; (3) наличие
      лимита (cap) совокупной ответственности проектировщика — типичный механизм защиты
      подрядчика от катастрофических рисков; (4) размер лимита (например, 100% цены договора
      или фиксированная сумма); (5) исключение косвенных убытков и упущенной выгоды —
      стандартная практика для проектных организаций, так как убытки от срыва сроков
      строительства могут многократно превышать стоимость самих проектных работ.
      Отсутствие чёткого регулирования этих вопросов создаёт для проектировщика риск
      неограниченной ответственности, а для заказчика — риск невозможности взыскания
      реальных убытков от некачественного проекта.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "ответственность за ошибки"
        - "ответственность за недостатки"
        - "недостатки документации"
        - "переделка строительных работ"
        - "устранение дефектов"
        - "убытки вследствие ошибок"
        - "ст. 761"
        - "ответственность ограничена"
        - "совокупная ответственность"
        - "не превышает стоимости"
        - "косвенные убытки"
        - "упущенная выгода"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)ответственност.*за.*недостатк.*документац"
        - "(?i)возмест.*убытк.*вызванн.*ошибк"
        - "(?i)ст\\.?\\s*761"
        - "(?i)ответственност.*ограничен.*стоимост"
        - "(?i)совокупн.*ответственност.*не.*превыша"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор на выполнение проектных и изыскательских работ (ПИР)
        (§ 4 Главы 37 ГК РФ, ст. 761).
        Проверяется только один вопрос: ответственность проектировщика за ошибки
        в ПД, включая объём, лимит и исключение косвенных убытков.
        Нормативный ориентир:
        - ст. 761 ГК РФ (ответственность подрядчика за недостатки проектной и изыскательской документации)
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не выдумывай условия ответственности — извлекай строго из переданного фрагмента.
        - Не путай ответственность за ошибки в ПД с неустойкой за просрочку выполнения работ.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Предусмотрена ли специальная ответственность за ошибки в ПД.
        2. Объём ответственности (только документация / включая переделку строительных работ / полные убытки).
        3. Наличие лимита (cap) совокупной ответственности.
        4. Размер лимита ответственности.
        5. Исключены ли косвенные убытки и упущенная выгода.

        [ПРАВИЛА]
        1. Используй только текст документа. Не выдумывай условия ответственности — извлекай строго из переданного фрагмента.
        2. Для enum-полей при отсутствии данных используй значение "not_defined".
        3. Для текстовых полей при отсутствии данных пиши "Данные не определены".
        4. Для полей *_display используй человеко-читаемые значения согласно маппингу.
        5. Различай:
           - "yes" — условие прямо указано в договоре
           - "no" — условие прямо исключено
           - "not_defined" — условие вообще не упоминается в договоре
           - "documentation_only" — ответственность ограничена только переделкой самой документации
           - "includes_construction_rework" — ответственность включает возмещение расходов на переделку строительных работ (ст. 761 ГК РФ)
           - "full_damages" — ответственность включает возмещение полных убытков без ограничений
           - "not_specified" — объём ответственности упомянут, но не конкретизирован
        6. Не путай:
           - Ответственность за ошибки в ПД (этот check) с неустойкой за просрочку (это разные механизмы)
           - Лимит ответственности (cap) с размером страхового покрытия (это разные инструменты)
        7. В evidence — только точные цитаты из документа с указанием пункта.
        8. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.без комментариев и markdown-обёртки.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — полная ответственность по ст. 761 ГК РФ с лимитом и исключением косвенных убытков:
        Фрагмент:
        "Подрядчик несёт ответственность за недостатки проектной документации,
        включая расходы на переделку строительных работ, вызванных такими недостатками.
        Совокупная ответственность Подрядчика по настоящему договору не может превышать
        100% цены договора. Косвенные убытки и упущенная выгода возмещению не подлежат."
        Ответ:
        {
          "liability_for_errors_present": "yes",
          "liability_for_errors_present_display": "Да, предусмотрена",
          "liability_scope": "includes_construction_rework",
          "liability_scope_display": "Включает переделку строительных работ",
          "liability_cap_present": "yes",
          "liability_cap_present_display": "Да, лимит установлен",
          "liability_cap_amount": "100% цены договора",
          "indirect_damages_excluded": "yes",
          "indirect_damages_excluded_display": "Да, косвенные убытки исключены",
          "evidence": [
            {
              "clause_ref": "п. 10.1",
              "quote": "Подрядчик несёт ответственность за недостатки проектной документации, включая расходы на переделку строительных работ, вызванных такими недостатками."
            },
            {
              "clause_ref": "п. 10.2",
              "quote": "Совокупная ответственность Подрядчика по настоящему договору не может превышать 100% цены договора."
            },
            {
              "clause_ref": "п. 10.3",
              "quote": "Косвенные убытки и упущенная выгода возмещению не подлежат."
            }
          ]
        }

        Пример 2 — ответственность только за документацию, без лимита:
        Фрагмент:
        "В случае выявления недостатков в проектной документации Подрядчик
        обязан безвозмездно переделать документацию за свой счёт. Иные виды
        ответственности законом или договором не предусмотрены."
        Ответ:
        {
          "liability_for_errors_present": "yes",
          "liability_for_errors_present_display": "Да, предусмотрена",
          "liability_scope": "documentation_only",
          "liability_scope_display": "Только переделка документации",
          "liability_cap_present": "no",
          "liability_cap_present_display": "Нет, лимит не установлен",
          "liability_cap_amount": "Данные не определены",
          "indirect_damages_excluded": "yes",
          "indirect_damages_excluded_display": "Да, косвенные убытки исключены",
          "evidence": [
            {
              "clause_ref": "п. 10.1",
              "quote": "В случае выявления недостатков в проектной документации Подрядчик обязан безвозмездно переделать документацию за свой счёт."
            },
            {
              "clause_ref": "п. 10.2",
              "quote": "Иные виды ответственности законом или договором не предусмотрены."
            }
          ]
        }

        Пример 3 — данные отсутствуют (общая фраза):
        Фрагмент:
        "Стороны несут ответственность за неисполнение обязательств в соответствии
        с действующим законодательством Российской Федерации."
        Ответ:
        {
          "liability_for_errors_present": "not_defined",
          "liability_for_errors_present_display": "Данные не определены",
          "liability_scope": "not_defined",
          "liability_scope_display": "Данные не определены",
          "liability_cap_present": "not_defined",
