        (allowed: yes / no / not_found).

      Если данные отсутствуют: указывай "not_found" только если тема не раскрыта;
      если тема раскрыта, но конкретное условие не установлено, используй
      соответствующее значение "no" или "not_specified".
      </task>

      <rules>
      1. initial_data_list_present: "yes" — есть перечень или перечислены конкретные документы;
         "no" — есть только общее упоминание без перечня; "not_found" — тема отсутствует.
      2. initial_data_deadlines: "specified" — есть срок, дата или событие;
