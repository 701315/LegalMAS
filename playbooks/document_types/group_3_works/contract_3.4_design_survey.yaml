    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 900
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора ПИР сведения о процедуре
        дополнительных работ: инициирование, форма согласования, цена, срок,
        право приостановить работы.
        Не анализируй изменение ТЗ без изменения объема, изменение цены этапа,
        экспертизу или иные темы.
        Не путай дополнительные работы с изменением ТЗ без изменения объема.
        Не путай дополнительные работы с изменением цены по этапу (Check 8).
        </role>
        <context>
        {context}
        </context>
        <task>
        Заполни строго следующие 12 полей + evidence (всего 13 ключей):
        1. additional_works_procedure_present — наличие процедуры: yes / no / not_defined.
        2. additional_works_procedure_present_display — "Да, процедура предусмотрена" / "Нет, процедура не предусмотрена" / "Данные не определены".
        3. initiation_right — право инициирования: client_initiated / contractor_initiated / both / not_specified / not_defined.
        4. initiation_right_display — "Только Заказчик" / "Только Подрядчик" / "Обе стороны" / "Не конкретизировано" / "Данные не определены" / "Не применимо".
        5. agreement_form — форма согласования: addendum_required / written_request / oral_or_electronic / not_specified / not_defined.
        6. agreement_form_display — "Обязательно дополнительное соглашение" / "Достаточно письменного запроса" / "Допустимо устное/электронное согласование" / "Не конкретизировано" / "Данные не определены" / "Не применимо".
        7. price_agreement — согласование цены: fixed_amount / percentage_of_price / actual_costs / not_specified / not_defined.
        8. price_agreement_display — "Фиксированная сумма" / "Процент от цены договора" / "По фактическим затратам" / "Не конкретизировано" / "Данные не определены" / "Не применимо".
        9. deadline_agreement — согласование срока: yes / no / not_defined.
        10. deadline_agreement_display — "Да, срок согласуется" / "Нет, срок не согласуется" / "Данные не определены" / "Не применимо".
        11. suspension_right — право приостановить: yes / no / not_defined.
        12. suspension_right_display — "Да, право приостановить предусмотрено" / "Нет, право не предусмотрено" / "Данные не определены" / "Не применимо".
        13. evidence — массив цитат из текста договора.

        Маппинг enum → display:
        - additional_works_procedure_present: yes → "Да, процедура предусмотрена", no → "Нет, процедура не предусмотрена", not_defined → "Данные не определены"
        - initiation_right: client_initiated → "Только Заказчик", contractor_initiated → "Только Подрядчик", both → "Обе стороны", not_specified → "Не конкретизировано", not_defined → "Данные не определены" или "Не применимо"
        - agreement_form: addendum_required → "Обязательно дополнительное соглашение", written_request → "Достаточно письменного запроса", oral_or_electronic → "Допустимо устное/электронное согласование", not_specified → "Не конкретизировано", not_defined → "Данные не определены" или "Не применимо"
        - price_agreement: fixed_amount → "Фиксированная сумма", percentage_of_price → "Процент от цены договора", actual_costs → "По фактическим затратам", not_specified → "Не конкретизировано", not_defined → "Данные не определены" или "Не применимо"
        - deadline_agreement: yes → "Да, срок согласуется", no → "Нет, срок не согласуется", not_defined → "Данные не определены" или "Не применимо"
        - suspension_right: yes → "Да, право приостановить предусмотрено", no → "Нет, право не предусмотрено", not_defined → "Данные не определены" или "Не применимо"

        Критическое правило:
        - Если additional_works_procedure_present = "no" — все остальные поля = "not_defined", display = "Не применимо".
        - Если additional_works_procedure_present = "not_defined" — все остальные поля = "not_defined", display = "Данные не определены".
        </task>
        <context_rules>
        - Используй только текст договора. Не выдумывай условия — извлекай строго из переданного фрагмента.
        - Не опирайся на внешние знания о типовых условиях договоров ПИР.
        - Не путай дополнительные работы с изменением ТЗ без изменения объема.
        - Не путай дополнительные работы с изменением цены по этапу (Check 8).
        - Не путай дополнительные работы с изменением объема по этапу (Check 11 — scope_change_procedure).
        - Верни строго валидный JSON. Все 13 ключей (12 полей + evidence) обязаны присутствовать.
        - Запрещены: null, None, пустые строки "".
        - Убедись, что enum-значения соответствуют их display-версиям.
        - Различай "no" (условие прямо исключено) и "not_defined" (условие не упоминается).
        </context_rules>

        <output_expectations>
        - Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        - Не используй markdown fences.
        - Не добавляй пояснения до или после JSON.
        - Верни все ключи, перечисленные в task, без пропусков.
        - Не используй null, None или пустые строки.
        - Для статусных полей используй только значения из allowed_values или "not_defined".
        - Для текстовых полей при отсутствии данных используй "Данные не определены" / "Не удалось определить" / "Не применимо" — согласно правилам выше.
        </output_expectations>
      fields:
        - name: "additional_works_procedure_present"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Предусмотрена ли процедура дополнительных работ (enum)."
