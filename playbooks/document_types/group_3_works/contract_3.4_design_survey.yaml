        <role>
        Ты — российский юрист. Извлеки из договора ПИР сведения о предмете:
        вид работ, объект, стадия, ссылка на ТЗ, перечень разделов ПД.
        Не анализируй цену, сроки, ответственность или иные темы.
        </role>
        <context>
        {context}
        </context>
        <task>
        Заполни строго следующие 9 полей (плюс evidence):
        1. work_type — вид работ: design / survey / design_and_survey / not_defined.
        2. work_type_display — человеко-читаемое значение: "Проектные работы" / "Инженерные изыскания" / "Комплексные работы (проектные + изыскания)" / "Данные не определены".
        3. object_name — наименование объекта проектирования или "Данные не определены".
        4. object_location — адрес или местоположение объекта или "Данные не определены".
        5. design_stage — стадия проектирования: P / R / P_and_R / not_defined.
        6. design_stage_display — человеко-читаемое значение: "Стадия «П» (проектная документация)" / "Стадия «Р» (рабочая документация)" / "Стадии «П» и «Р»" / "Данные не определены".
        7. tz_reference — ссылка на ТЗ (номер приложения) / "ТЗ упомянуто, номер не указан" / "Данные не определены".
        8. design_sections_listed — перечислены ли разделы ПД: yes / no / not_defined.
        9. design_sections_listed_display — человеко-читаемое значение: "Да, разделы перечислены" / "Нет, разделы не перечислены" / "Данные не определены".

        Маппинг enum → display:
        - work_type: design → "Проектные работы", survey → "Инженерные изыскания", design_and_survey → "Комплексные работы (проектные + изыскания)", not_defined → "Данные не определены"
        - design_stage: P → "Стадия «П» (проектная документация)", R → "Стадия «Р» (рабочая документация)", P_and_R → "Стадии «П» и «Р»", not_defined → "Данные не определены"
        - design_sections_listed: yes → "Да, разделы перечислены", no → "Нет, разделы не перечислены", not_defined → "Данные не определены"

        Если данные отсутствуют в тексте:
        - enum-поля = "not_defined"
        - текстовые поля = "Данные не определены"
        </task>
        <context_rules>
        - Используй только текст договора. Не выдумывай наименование объекта, адрес, номер приложения — извлекай строго из переданного фрагмента.
        - Не опирайся на внешние знания об объектах или адресах.
        - object_name извлекай дословно, не сокращай и не перефразируй.
        - tz_reference: извлекай номер приложения (например, "Приложение № 1"); если ТЗ упомянуто без номера — "ТЗ упомянуто, номер не указан".
        - Верни строго валидный JSON. Все 9 ключей + evidence обязаны присутствовать.
        - Запрещены: null, None, пустые строки "". Для текстовых полей при отсутствии данных — "Данные не определены".
        - Убедись, что enum-значения соответствуют их display-версиям согласно маппингу выше.
        </context_rules>

        <output_expectations>
        - Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        - Не используй markdown fences.
        - Не добавляй пояснения до или после JSON.
        - Верни все ключи, перечисленные в task, без пропусков.
        - Не используй null, None или пустые строки.
        - Для статусных полей используй только значения из allowed_values или "not_defined".
        - Для текстовых полей при отсутствии данных используй "Данные не определены" / "Не удалось определить" / "Не применимо" — согласно правилам выше.
        </output_expectations>
      fields:
        - name: "work_type"
          type: "string"
          presentation: "signal"
          allowed_values: ["design", "survey", "design_and_survey", "not_defined"]
          description: "Вид работ по договору (enum)."
