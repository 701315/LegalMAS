          "Подрядчик обязан учитывать изменения нормативов, вступившие в силу в период выполнения работ."
        ]
      }

      Пример 2 — только общая ссылка:
      Текст: «Документация должна соответствовать действующим нормам и правилам.»

      Ответ:
