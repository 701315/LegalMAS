    max_snippet_length: 700
  extraction:
    enabled: true
    mode: hybrid
    store_payload: true
    llm_max_tokens: 700
    compact_output: false
    llm_prompt_extraction: "<role>\nТы — юрист, извлекающий сведения о цене работ и основании её расчёта\nв договоре ПИР. Не оценивай риски. Только заполняй поля строго по тексту.\n</role>\n\n<context>\n{context}\n</context>\n\n<task>\nЗаполни строго следующие поля:\n\nprice_amount_status — определена ли цена работ\n  (allowed: defined / not_defined).\n\nprice_amount_value — сумма цены работ в рублях\n  (числовое значение без символа валюты или null, если сумма прямо не указана).\n\nprice_type — тип цены\n  (allowed: fixed / approximate / cost_plus / percentage / sbc / not_found).\n\nprice_includes_vat — включает ли цена НДС\n  (allowed: yes / no / not_applicable / unclear / not_found).\n\ncalculation_basis — основание расчёта цены\n  (текстовое значение, например \"по СБЦ\", \"% от стоимости СМР\",\n  \"фиксированная сумма\", \"по смете\", или not_found).\n\nЕсли данные отсутствуют: указывай \"not_defined\" для price_amount_status,\nnull для price_amount_value, \"not_found\" для price_type\
      \ и calculation_basis,\nа для price_includes_vat — \"not_found\" или \"unclear\" по смыслу текста.\n</task>\n\n<rules>\n1. price_amount_status = \"defined\" только если цена прямо указана\n   суммой или однозначно определена в договоре.\n2. price_amount_value: верни только число в рублях; если суммы нет — null.\n3. price_type: \"fixed\" — твёрдая/фиксированная; \"approximate\" —\n   приблизительная/ориентировочная; \"cost_plus\" — затраты плюс;\n   \"percentage\" — процент от стоимости; \"sbc\" — по СБЦ; \"not_found\" — не установлен.\n4. price_includes_vat: \"yes\" — в том числе НДС; \"no\" — без НДС;\n   \"not_applicable\" — НДС не применяется; \"unclear\" — режим НДС неясен;\n   \"not_found\" — тема отсутствует.\n5. calculation_basis извлекай кратко и дословно по смыслу,\n   без добавления новых формулировок.\n6. Не добавляй ключи, не входящие в список полей.\n7. Верни только JSON.\n</rules>\n"
    fields:
    - name: price_amount_status
      type: string
      label: Цена определена
      presentation: badge
