compliance_rules: []
checks_v8:
- id: parties_identification
  name: 'Стороны договора: идентификация заказчика и подрядчика'
  description: Проверяет наличие и достаточность идентификации сторон, полномочия подписантов
  legal_base: ст. 432, 758 ГК РФ
  triggers: null
  ui_mode: field_extraction
  severity: critical
  severity_if_pass: pass
  severity_if_fail: critical
  severity_if_unclear: critical
  origin: DOCUMENT_TYPE
  detector_type: hybrid
  rules:
    keywords:
    - заказчик
    - подрядчик
    - проектировщик
    - изыскатель
    - именуем
    - в лице
    - действующего на основании
    keyword_mode: any
    regex_patterns:
    - (?i)(заказчик|подрядчик|проектировщик|изыскатель).*именуем
  llm:
    prompt_template: "[КОНТЕКСТ]\nТы — юрист, анализирующий договор на выполнение проектных\nи изыскательских работ (ПИР) (ст. 758–762 ГК РФ).\nПроверяется только один вопрос: идентификация сторон договора —\nзаказчика и подрядчика (проектировщика/изыскателя), их реквизиты,\nтипы, подписанты и основания полномочий.\n\nВажно:\n— Анализируй только вводную часть договора и раздел «Реквизиты сторон».\n— Не оценивай риски. Только извлекай факты об идентификации сторон.\n— Если сведения явно не указаны в тексте — значение \"not_defined\".\n\n[ЗАДАЧА]\n1. Установить тип заказчика (юрлицо / госорган / ИП / физлицо / самозанятый).\n2. Установить тип подрядчика.\n3. Определить, указаны ли реквизиты заказчика.\n4. Определить, указаны ли реквизиты подрядчика.\n5. Установить подписанта заказчика и основание его полномочий.\n6. Установить подписанта подрядчика и основание его полномочий.\n7. Установить наличие корпоративного одобрения сделки.\n\n[ПРАВИЛА]\n1. client_type: \"legal_entity\" — ООО, АО, ПАО,\
      \ НАО, иное юрлицо;\n   \"state_entity\" — государственный или муниципальный орган, учреждение,\n   ГУП, МУП; \"ip\" — индивидуальный предприниматель; \"individual\" —\n   физическое лицо; \"self_employed\" — самозанятый; \"not_defined\" —\n   тип не установим.\n2. contractor_type: \"legal_entity\" — ООО, АО, ПАО, НАО, иное юрлицо;\n   \"ip\" — индивидуальный предприниматель; \"individual\" — физическое лицо;\n   \"not_defined\" — тип не установим.\n3. client_details_status / contractor_details_status: \"defined\" —\n   только если указаны наименование и хотя бы ИНН или ОГРН.\n   Иначе — \"not_defined\".\n4. client_signatory_basis / contractor_signatory_basis: \"charter\" —\n   «на основании Устава»; \"poa\" — «на основании доверенности»;\n   \"order\" — «на основании приказа»; \"personal\" — физлицо подписывает лично;\n   \"other\" — иное основание; \"not_defined\" — основание не указано.\n5. corporate_approval_status: \"defined\" — если в тексте есть явное упоминание\n   одобрения\
      \ крупной сделки или сделки с заинтересованностью;\n   \"not_defined\" — в остальных случаях.\n6. Не смешивай заказчика и подрядчика. Каждое поле относится строго к одной стороне.\n7. Не извлекай банковские реквизиты — только наименование, ИНН, ОГРН, адрес,\n   подписант и основание полномочий.\n\n[ПРИМЕРЫ (FEW-SHOT)]\nПример 1 — обе стороны идентифицированы, полномочия определены:\nТекст: «ООО \"СтройПроект\" (ИНН 7701234567, ОГРН 1027700123456, адрес: г. Москва,\nул. Ленина, 1), именуемое в дальнейшем \"Подрядчик\", в лице генерального директора\nИванова И.И., действующего на основании Устава, с одной стороны, и АО \"Застройщик\"\n(ИНН 7709876543, ОГРН 1047709876543, адрес: г. Москва, ул. Мира, 5), именуемое\n\"Заказчик\", в лице директора Петрова П.П., действующего на основании доверенности\n№ 12 от 01.01.2024, с другой стороны.»\n\nОтвет:\n{\n  \"client_details_status\": \"defined\",\n  \"client_details_value\": \"АО «Застройщик», ИНН 7709876543, ОГРН 1047709876543, г. Москва,\
      \ ул. Мира, 5\",\n  \"client_type\": \"legal_entity\",\n  \"client_signatory\": \"Петров П.П., директор\",\n  \"client_signatory_basis\": \"poa\",\n  \"contractor_details_status\": \"defined\",\n  \"contractor_details_value\": \"ООО «СтройПроект», ИНН 7701234567, ОГРН 1027700123456, г. Москва, ул. Ленина, 1\",\n  \"contractor_type\": \"legal_entity\",\n  \"contractor_signatory\": \"Иванов И.И., генеральный директор\",\n  \"contractor_signatory_basis\": \"charter\",\n  \"corporate_approval_status\": \"not_defined\",\n  \"corporate_approval_details\": \"not_defined\",\n  \"evidence\": [\n    \"ООО «СтройПроект» (ИНН 7701234567...) в лице генерального директора Иванова И.И., действующего на основании Устава\",\n    \"АО «Застройщик» (ИНН 7709876543...) в лице директора Петрова П.П., действующего на основании доверенности № 12\"\n  ]\n}\n\nПример 2 — стороны не идентифицированы, реквизиты отсутствуют:\nТекст: «Настоящий договор заключён между Заказчиком и Подрядчиком.»\n\nОтвет:\n{\n \
      \ \"client_details_status\": \"not_defined\",\n  \"client_details_value\": \"not_defined\",\n  \"client_type\": \"not_defined\",\n  \"client_signatory\": \"not_defined\",\n  \"client_signatory_basis\": \"not_defined\",\n  \"contractor_details_status\": \"not_defined\",\n  \"contractor_details_value\": \"not_defined\",\n  \"contractor_type\": \"not_defined\",\n  \"contractor_signatory\": \"not_defined\",\n  \"contractor_signatory_basis\": \"not_defined\",\n  \"corporate_approval_status\": \"not_defined\",\n  \"corporate_approval_details\": \"not_defined\",\n  \"evidence\": []\n}\n\n[ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]\n1. Разграничены ли поля заказчика и подрядчика без смешения?\n2. Проверено ли, что *_details_status = \"defined\" только при наличии\n   наименования и хотя бы ИНН или ОГРН?\n3. Проверено ли основание полномочий каждого подписанта?\n4. Есть ли в тексте упоминание корпоративного одобрения?\n5. Все ли значения enum соответствуют allowed_values?\n6. Заполнены ли все ключи JSON?\n\
      \n[ФОРМАТ ОТВЕТА]\nВерни строго JSON без пояснений:\n{\n  \"client_details_status\": \"<defined / not_defined>\",\n  \"client_details_value\": \"<реквизиты или not_defined>\",\n  \"client_type\": \"<legal_entity / state_entity / individual / ip / self_employed / not_defined>\",\n  \"client_signatory\": \"<ФИО и должность или not_defined>\",\n  \"client_signatory_basis\": \"<charter / poa / order / personal / other / not_defined>\",\n  \"contractor_details_status\": \"<defined / not_defined>\",\n  \"contractor_details_value\": \"<реквизиты или not_defined>\",\n  \"contractor_type\": \"<legal_entity / individual / ip / not_defined>\",\n  \"contractor_signatory\": \"<ФИО и должность или not_defined>\",\n  \"contractor_signatory_basis\": \"<charter / poa / order / personal / other / not_defined>\",\n  \"corporate_approval_status\": \"<defined / not_defined>\",\n  \"corporate_approval_details\": \"<текст одобрения или not_defined>\",\n  \"evidence\": [\"<цитата 1>\", \"<цитата 2>\"]\n}\n"
