- id: stagewise_approval_procedure
  name: Поэтапное согласование и право отклонения промежуточных результатов (ст. 760 ГК РФ)
  description: 'Проверяет наличие процедуры поэтапного согласования, сроков рассмотрения

    заказчиком, права на замечания и порядка согласования отступлений от ТЗ.

    '
  legal_base: ст. 760 ГК РФ
  triggers: null
  ui_mode: field_extraction
  severity: high
  severity_if_pass: pass
  severity_if_fail: high
  severity_if_unclear: high
  origin: DOCUMENT_TYPE
  detector_type: hybrid
  rules:
    keywords:
    - поэтапное согласование
    - эскизный проект
    - утверждение этапа
    - замечания заказчика
    - срок рассмотрения
    - отклонение промежуточного результата
    - мотивированный отказ
    - отступление от ТЗ
    - изменение ТЗ
    - корректировка задания
    keyword_mode: any
    regex_patterns:
    - (?i)поэтапн(ое|ого)\s+согласован
    - (?i)замечан(ия|ий)\s+заказчик
    - (?i)срок\s+рассмотрен
    - (?i)отступлени(е|я)\s+от\s+(ТЗ|техническ)
  llm:
    prompt_template: "[КОНТЕКСТ]\nТы — юрист, анализирующий договор ПИР.\nПроверяется только один вопрос: предусмотрена ли процедура поэтапного\nсогласования промежуточных результатов, сроки рассмотрения заказчиком,\nправо на замечания и порядок согласования отступлений от ТЗ.\n\nВажно:\n— Анализируй только положения о согласовании промежуточных результатов,\n  замечаниях заказчика и отступлениях от ТЗ.\n— Не оценивай риск и не смешивай согласование с итоговой приёмкой.\n— Если срок или порядок не установлены прямо, не домысливай.\n\n[ЗАДАЧА]\n1. Установить, предусмотрено ли поэтапное согласование промежуточных результатов.\n2. Извлечь срок рассмотрения заказчиком.\n3. Установить, есть ли право заказчика на мотивированные замечания.\n4. Установить, предусмотрена ли авто-приёмка при молчании.\n5. Установить, урегулирован ли порядок согласования отступлений от ТЗ.\n6. Установить, предусмотрено ли согласование изменений объёма работ.\n\n[ПРАВИЛА]\n1. stagewise_approval_present = \"yes\" — если\
      \ договор предусматривает\n   согласование промежуточных результатов по этапам;\n   \"no\" — если тема раскрыта, но такой процедуры нет;\n   \"not_found\" — если тема отсутствует.\n2. review_period_days — числовое значение в днях или текст\n   с указанием периода; если не указано — \"not_found\".\n3. right_to_remarks = \"yes\" — заказчик вправе направить замечания;\n   \"no\" — тема раскрыта, но такого права нет; \"not_found\" — тема отсутствует.\n4. auto_approval_on_silence = \"yes\" — если молчание заказчика\n   в установленный срок приравнивается к согласованию;\n   \"no\" — если тема раскрыта, но авто-приёмки нет;\n   \"not_found\" — тема отсутствует.\n5. tz_deviation_procedure = \"defined\" — если установлен порядок согласования\n   отступлений от ТЗ (включая корректировку задания);\n   \"not_defined\" — если тема раскрыта, но порядок не определён;\n   \"not_found\" — если тема отсутствует.\n6. scope_change_procedure = \"defined\" — если установлен порядок согласования\n   изменений\
      \ объёма работ (включая допсоглашение);\n   \"not_defined\" — если тема раскрыта, но порядок не определён;\n   \"not_found\" — если тема отсутствует.\n7. Не путай согласование промежуточных результатов с итоговой приёмкой.\n\n[ПРИМЕРЫ (FEW-SHOT)]\nПример 1 — согласование урегулировано:\nТекст: «По завершении каждого этапа Подрядчик передаёт промежуточный\nрезультат Заказчику для согласования. Заказчик рассматривает результат\nв течение 10 рабочих дней и направляет замечания или утверждает этап.\nЕсли замечания не поступили в указанный срок, этап считается согласованным.\nОтступления от ТЗ согласовываются путём подписания дополнительного соглашения.»\n\nОтвет:\n{\n  \"stagewise_approval_present\": \"yes\",\n  \"review_period_days\": \"10 рабочих дней\",\n  \"right_to_remarks\": \"yes\",\n  \"auto_approval_on_silence\": \"yes\",\n  \"tz_deviation_procedure\": \"defined\",\n  \"scope_change_procedure\": \"defined\",\n  \"evidence\": [\n    \"По завершении каждого этапа Подрядчик передаёт\
      \ промежуточный результат Заказчику для согласования.\",\n    \"Заказчик рассматривает результат в течение 10 рабочих дней и направляет замечания или утверждает этап.\",\n    \"Если замечания не поступили в указанный срок, этап считается согласованным.\",\n    \"Отступления от ТЗ согласовываются путём подписания дополнительного соглашения.\"\n  ]\n}\n\nПример 2 — тема не раскрыта:\nТекст: «Подрядчик передаёт результат работ по акту.»\n\nОтвет:\n{\n  \"stagewise_approval_present\": \"not_found\",\n  \"review_period_days\": \"not_found\",\n  \"right_to_remarks\": \"not_found\",\n  \"auto_approval_on_silence\": \"not_found\",\n  \"tz_deviation_procedure\": \"not_found\",\n  \"scope_change_procedure\": \"not_found\",\n  \"evidence\": []\n}\n\n[ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]\n1. Отделено ли согласование промежуточных результатов от итоговой приёмки?\n2. Есть ли явный срок рассмотрения в днях?\n3. Есть ли явное правило авто-приёмки при молчании?\n4. Есть ли отдельный порядок для отступлений\
      \ от ТЗ?\n5. Все ли ключи JSON совпадают со schema?\n\n[ФОРМАТ ОТВЕТА]\nВерни строго JSON:\n{\n  \"stagewise_approval_present\": \"<yes / no / not_found>\",\n  \"review_period_days\": \"<текст или not_found>\",\n  \"right_to_remarks\": \"<yes / no / not_found>\",\n  \"auto_approval_on_silence\": \"<yes / no / not_found>\",\n  \"tz_deviation_procedure\": \"<defined / not_defined / not_found>\",\n  \"scope_change_procedure\": \"<defined / not_defined / not_found>\",\n  \"evidence\": [\"<цитата 1>\", \"<цитата 2>\"]\n}\n"
    prompt_file: null
    context_k: 6
    temperature: 0.0
    max_tokens: 540
  retrieval:
    retrieval_profile: acceptance_check
