  - id: assignment_and_subcontracting
    name: "Субподряд: привлечение субподрядчиков и ответственность (ст. 706 ГК РФ)"
    description: >
      Фактографическая проверка режима привлечения субподрядчиков в договоре на
      выполнение проектных и изыскательских работ (ПИР) в соответствии со ст. 706 ГК РФ.
      Для договоров ПИР привлечение субподрядчиков — типичная практика: генеральный
      проектировщик (генподрядчик) часто привлекает специализированные организации для
      выполнения отдельных видов изысканий (геологические, геодезические, экологические)
      или отдельных разделов проектной документации (конструктивные решения, инженерные
      сети, технологические решения). Нормативный ориентир — ст. 706 ГК РФ: генподрядчик
      вправе привлекать субподрядчиков, если иное не предусмотрено договором; генподрядчик
      отвечает перед заказчиком за субподрядчиков как за свои собственные действия
      (императивная норма, п. 1 ст. 706 ГК РФ). Проверка выявляет два критических аспекта:
      (1) допустимость привлечения субподрядчиков — с письменного согласия заказчика
      (типичное ограничение), без согласия (свободное привлечение) или прямой запрет
      (работы выполняются только силами подрядчика); (2) ответственность подрядчика
      за действия субподрядчиков — императивное правило ст. 706 ГК РФ, но в договорах
      иногда встречаются попытки ограничить эту ответственность, что создаёт риски
      для заказчика. Примечание: вопросы уступки прав и перевода долга по договору
      проверяются отдельными global checks (assignment_transfer_regime,
      assignment_transfer_consent, assignment_transfer_consequences) и не дублируются
      в данном doc-type check-е.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "medium"
    severity_if_pass: "pass"
    severity_if_fail: "medium"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "субподрядчик"
        - "субподряд"
        - "привлечение третьих лиц"
        - "с согласия заказчика"
        - "без согласия"
        - "генеральный проектировщик"
        - "генподрядчик"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)субподряд"
        - "(?i)привлечен(ие|ия)\\s+треть(их|его)"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор на выполнение проектных и изыскательских работ (ПИР)
        (§ 4 Главы 37 ГК РФ, ст. 706).
        Проверяется только один вопрос: режим привлечения субподрядчиков и
        ответственность подрядчика за субподрядчиков.
        Нормативный ориентир:
        - ст. 706 ГК РФ (субподряд в подряде)
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не выдумывай условия субподряда — извлекай строго из переданного фрагмента.
        - Не путай субподряд с уступкой прав (уступка прав проверяется отдельным global check-ом).
        - Не путай привлечение субподрядчиков с авторским надзором (это разные институты).

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Допускается ли привлечение субподрядчиков.
        2. Условия привлечения (с согласия / без согласия / запрещено).
        3. Отвечает ли подрядчик за субподрядчиков как за свои собственные действия.

        [ПРАВИЛА]
        1. Используй только текст документа. Не выдумывай условия субподряда — извлекай строго из переданного фрагмента.
        2. Для enum-полей (subcontracting_allowed, contractor_liable_for_subs) при отсутствии данных используй значение "not_defined".
        3. Для полей *_display используй человеко-читаемые значения согласно маппингу.
        4. Различай:
           - "yes_with_consent" — субподряд допускается с письменного согласия заказчика
           - "yes_without_consent" — субподряд допускается без согласия заказчика (уведомление или свободно)
           - "prohibited" — субподряд прямо запрещён, работы выполняются только силами подрядчика
           - "not_defined" — условие вообще не упоминается в договоре
           - "yes" — подрядчик отвечает за субподрядчиков как за свои действия (императивная норма ст. 706 ГК РФ)
           - "no" — подрядчик не отвечает за субподрядчиков (попытка ограничить ответственность)
        5. Критическое правило:
           - Если subcontracting_allowed = "prohibited" (субподряд прямо запрещён), то contractor_liable_for_subs = "not_defined", display = "Не применимо"
           - Если subcontracting_allowed = "not_defined" (условие не упоминается), то contractor_liable_for_subs = "not_defined", display = "Данные не определены"
        6. Не путай:
           - Субподряд (этот check) с уступкой прав (global check)
           - Привлечение субподрядчиков с авторским надзором (это разные институты)
           - Согласие на субподряд с согласием на уступку прав
        7. В evidence — только точные цитаты из документа с указанием пункта.
        8. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.без комментариев и markdown-обёртки.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — субподряд с согласия, подрядчик отвечает:
        Фрагмент:
        "Подрядчик вправе привлекать субподрядчиков только с письменного
        согласия Заказчика. Подрядчик несёт ответственность за действия
        субподрядчиков как за свои собственные."
        Ответ:
        {
          "subcontracting_allowed": "yes_with_consent",
          "subcontracting_allowed_display": "Да, с согласия Заказчика",
          "contractor_liable_for_subs": "yes",
          "contractor_liable_for_subs_display": "Да, отвечает как за свои действия",
          "evidence": [
            {
              "clause_ref": "п. 7.1",
              "quote": "Подрядчик вправе привлекать субподрядчиков только с письменного согласия Заказчика."
            },
            {
              "clause_ref": "п. 7.2",
              "quote": "Подрядчик несёт ответственность за действия субподрядчиков как за свои собственные."
            }
          ]
        }

        Пример 2 — субподряд без согласия, ответственность не упомянута:
        Фрагмент:
        "Подрядчик вправе привлекать субподрядчиков для выполнения отдельных
        видов работ, уведомив Заказчика в письменной форме."
        Ответ:
        {
          "subcontracting_allowed": "yes_without_consent",
          "subcontracting_allowed_display": "Да, без согласия (с уведомлением)",
          "contractor_liable_for_subs": "not_defined",
          "contractor_liable_for_subs_display": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 7.1",
              "quote": "Подрядчик вправе привлекать субподрядчиков для выполнения отдельных видов работ, уведомив Заказчика в письменной форме."
            }
          ]
        }

        Пример 3 — субподряд запрещён:
        Фрагмент:
        "Подрядчик обязан выполнить работы самостоятельно, без привлечения
        субподрядчиков и третьих лиц."
        Ответ:
        {
          "subcontracting_allowed": "prohibited",
          "subcontracting_allowed_display": "Нет, субподряд запрещён",
          "contractor_liable_for_subs": "not_defined",
          "contractor_liable_for_subs_display": "Не применимо",
          "evidence": [
            {
              "clause_ref": "п. 7.1",
              "quote": "Подрядчик обязан выполнить работы самостоятельно, без привлечения субподрядчиков и третьих лиц."
            }
          ]
        }

        Пример 4 — данные отсутствуют:
        Фрагмент:
        "Подрядчик выполняет работы по объекту Заказчика."
        Ответ:
        {
          "subcontracting_allowed": "not_defined",
          "subcontracting_allowed_display": "Данные не определены",
          "contractor_liable_for_subs": "not_defined",
          "contractor_liable_for_subs_display": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "Подрядчик выполняет работы по объекту Заказчика."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли именно условие о привлечении субподрядчиков (а не авторского надзора или уступки прав)?
        2. Есть ли явное условие о согласии заказчика?
        3. Установлена ли ответственность подрядчика за субподрядчиков?
        4. Если субподряд запрещён (subcontracting_allowed = "prohibited") — contractor_liable_for_subs = "Не применимо"?
        5. Все ли 4 ключа присутствуют в JSON (2 enum + 2 display)?
        6. Совпадают ли enum-значения с их display-версиями согласно маппингу?
        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми ключами. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки:
        {
          "subcontracting_allowed": "<yes_with_consent / yes_without_consent / prohibited / not_defined>",
          "subcontracting_allowed_display": "<Да, с согласия Заказчика / Да, без согласия (с уведомлением) / Нет, субподряд запрещён / Данные не определены>",
          "contractor_liable_for_subs": "<yes / no / not_defined>",
          "contractor_liable_for_subs_display": "<Да, отвечает как за свои действия / Нет, не отвечает / Данные не определены / Не применимо>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 420
    retrieval:
      retrieval_profile: "assignment_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "субподрядчик субподряд привлечение третьих лиц с согласия заказчика без согласия самостоятельно генподрядчик ответственность за субподрядчиков"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - procedures
        - limitations
      negative_keywords:
        - "уступка прав"
        - "перевод долга"
        - "цессия"
        - "экспертиза"
        - "форс-мажор"
        - "неустойка"
        - "подсудность"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.35, 0.85]
        boost: 0.12
        scope: segment
      context_k: 5
      max_chunks: 6
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "procedures"
        - "limitations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 450
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора ПИР сведения о режиме
        привлечения субподрядчиков и ответственности подрядчика за субподрядчиков.
        Не анализируй уступку прав, перевод долга, авторский надзор, цену или иные темы.
        Не путай субподряд с уступкой прав (уступка проверяется отдельным global check-ом).
        </role>
        <context>
        {context}
        </context>
        <task>
        Заполни строго следующие 4 поля (плюс evidence):
        1. subcontracting_allowed — допустимость субподряда: yes_with_consent / yes_without_consent / prohibited / not_defined.
        2. subcontracting_allowed_display — человеко-читаемое значение: "Да, с согласия Заказчика" / "Да, без согласия (с уведомлением)" / "Нет, субподряд запрещён" / "Данные не определены".
        3. contractor_liable_for_subs — ответственность за субподрядчиков: yes / no / not_defined.
        4. contractor_liable_for_subs_display — человеко-читаемое значение: "Да, отвечает как за свои действия" / "Нет, не отвечает" / "Данные не определены" / "Не применимо".

        Маппинг enum → display:
        - subcontracting_allowed: yes_with_consent → "Да, с согласия Заказчика", yes_without_consent → "Да, без согласия (с уведомлением)", prohibited → "Нет, субподряд запрещён", not_defined → "Данные не определены"
        - contractor_liable_for_subs: yes → "Да, отвечает как за свои действия", no → "Нет, не отвечает", not_defined → "Данные не определены" или "Не применимо"

        Критическое правило:
        - Если subcontracting_allowed = "prohibited" (субподряд прямо запрещён), то contractor_liable_for_subs = "not_defined", display = "Не применимо"
        - Если subcontracting_allowed = "not_defined" (условие не упоминается), то contractor_liable_for_subs = "not_defined", display = "Данные не определены"
        </task>
        <context_rules>
        - Используй только текст договора. Не выдумывай условия субподряда — извлекай строго из переданного фрагмента.
        - Не опирайся на внешние знания о типовых условиях договоров ПИР.
        - Не путай субподряд с уступкой прав (уступка проверяется отдельным global check-ом).
        - Не путай привлечение субподрядчиков с авторским надзором.
        - Верни строго валидный JSON. Все 4 ключа + evidence обязаны присутствовать.
        - Запрещены: null, None, пустые строки "".
        - Убедись, что enum-значения соответствуют их display-версиям согласно маппингу выше.
        - Различай "yes_with_consent" (требуется согласие) и "yes_without_consent" (уведомление или свободно).
        </context_rules>

        <output_expectations>
        - Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        - Не используй markdown fences.
        - Не добавляй пояснения до или после JSON.
        - Верни все ключи, перечисленные в task, без пропусков.
        - Не используй null, None или пустые строки.
        - Для статусных полей используй только значения из allowed_values или "not_defined".
        - Для текстовых полей при отсутствии данных используй "Данные не определены" / "Не удалось определить" / "Не применимо" — согласно правилам выше.
        </output_expectations>
      fields:
        - name: "subcontracting_allowed"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes_with_consent", "yes_without_consent", "prohibited", "not_defined"]
          description: "Допустимость привлечения субподрядчиков (enum)."
          required: true
          display_in_grid: false
        - name: "subcontracting_allowed_display"
          type: "string"
          presentation: "fact"
          label: "Допустимость субподряда"
          description: "Человеко-читаемое значение: допустимо ли привлечение субподрядчиков и на каких условиях."
          required: true
          display_in_grid: true
          display_priority: 1
        - name: "contractor_liable_for_subs"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Отвечает ли подрядчик за действия субподрядчиков как за свои собственные (enum)."
          required: true
          display_in_grid: false
        - name: "contractor_liable_for_subs_display"
          type: "string"
          presentation: "fact"
          label: "Ответственность за субподрядчиков"
          description: "Человеко-читаемое значение: отвечает ли подрядчик за действия субподрядчиков."
          required: false
          display_in_grid: true
          display_priority: 2

  - id: ip_rights_on_documentation
    name: "Интеллектуальные права на ПД (ст. 1296, 1298 ГК РФ)"
    description: >
      Фактографическая проверка режима передачи исключительных (интеллектуальных) прав
      на проектную документацию и результаты изысканий в договоре на выполнение
      проектных и изыскательских работ (ПИР) в соответствии со ст. 1296 и ст. 1298 ГК РФ.
      Проектная документация является результатом интеллектуальной деятельности, и вопрос
      принадлежности исключительного права — один из ключевых в договорах ПИР. Нормативный
      ориентир: ст. 1296 ГК РФ (договор авторского заказа — по умолчанию исключительное
      право на произведение, созданное не в рамках трудовых обязанностей, возникает у
      заказчика с момента его создания); ст. 1298 ГК РФ (аналогичное правило для произведений
      науки, литературы и искусства). Проверка выявляет пять критических аспектов:
      (1) статус передачи исключительных прав — полная передача (отчуждение) заказчику,
      предоставление лицензии (простой или исключительной) или сохранение прав за подрядчиком;
      (2) момент перехода прав — с момента подписания договора, с момента подписания акта
      сдачи-приёмки или с момента полной оплаты (последний вариант — типичная защита подрядчика);
      (3) разрешение на повторное использование документации заказчиком — критически важно,
      т.к. заказчик может строить несколько однотипных объектов по одному проекту; (4) разрешение
      на модификацию проекта без согласия автора — важно для заказчика, т.к. в процессе
      строительства часто возникают объективные изменения; (5) сохранение прав подрядчика
      на типовые решения, методики и ноу-хау, использованные в проекте — критически важно
      для проектировщика, т.к. типовые решения (библиотеки стандартных узлов, типовые
      архитектурные элементы, авторские методики расчёта) составляют основу его бизнеса
      и используются во множестве проектов. Отсутствие оговорки о сохранении прав на типовые
      решения создаёт риск того, что при полной передаче прав на проект заказчик фактически
      получит и права на типовые наработки подрядчика, что лишит подрядчика возможности
      использовать их в будущих проектах для других заказчиков. Типичная формулировка:
      «Исключительные права на типовые решения, методики и ноу-хау Подрядчика, использованные
      при выполнении работ, сохраняются за Подрядчиком. Заказчику предоставляется право
      использования таких решений только в рамках данного проекта». Отсутствие или неясность
      регулирования интеллектуальных прав создаёт риски споров о праве использования документации,
      праве на её модификацию и праве подрядчика использовать собственные наработки в будущих
      проектах.
    triggers:
      any: ["ip_rights_transfer"]
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "исключительные права"
        - "интеллектуальные права"
        - "авторские права"
        - "передача прав"
        - "отчуждение исключительного права"
        - "лицензия на использование"
        - "право на использование"
        - "тиражирование"
        - "модификация проекта"
        - "типовые решения"
        - "ноу-хау"
        - "методики подрядчика"
        - "стандартные решения"
        - "библиотеки типовых решений"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)исключительн(ые|ое|ых)\\s+прав"
        - "(?i)интеллектуальн(ые|ых)\\s+прав"
        - "(?i)передач(а|и)\\s+прав.*на.*документац"
        - "(?i)типов(ые|ых|ыми)\\s+решени"
        - "(?i)ноу-хау|ноу\\s+хау"
        - "(?i)сохраня(ются|ет|ется)\\s+за\\s+подрядчик"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор на выполнение проектных и изыскательских работ (ПИР)
        (§ 4 Главы 37 ГК РФ; ГК РФ ст. 1296, 1298).
        Проверяется только один вопрос: условия передачи исключительных
        (интеллектуальных) прав на проектную документацию, включая сохранение прав
        подрядчика на типовые решения.
        Нормативный ориентир:
        - ст. 1296 ГК РФ (договор авторского заказа)
        - ст. 1298 ГК РФ (создание произведений науки, литературы и искусства)
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не выдумывай условия передачи прав — извлекай строго из переданного фрагмента.
        - Если вопрос ИП не раскрыт в тексте, не применяй диспозитивные нормы ГК как факт.
        - Не путай полную передачу прав (отчуждение) с лицензией.
        - Не путай исключительное право с правом авторства (неимущественное право).
        - Не путай права на конкретный проект с правами на типовые решения подрядчика.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Статус передачи исключительных прав (полная передача / лицензия / сохранение за подрядчиком).
        2. Момент перехода прав.
        3. Разрешено ли повторное использование проекта заказчиком.
        4. Разрешена ли модификация проекта без согласия автора.
        5. Сохраняет ли подрядчик права на типовые решения, методики и ноу-хау, использованные в проекте.

        [ПРАВИЛА]
        1. Используй только текст документа. Не выдумывай условия передачи прав — извлекай строго из переданного фрагмента.
        2. Для enum-полей при отсутствии данных используй значение "not_defined".
        3. Для полей *_display используй человеко-читаемые значения согласно маппингу.
        4. Различай:
           - "full_transfer" — полная передача (отчуждение) исключительного права заказчику
           - "license" — предоставление лицензии (простой или исключительной)
           - "retained_by_contractor" — исключительное право остаётся у подрядчика
           - "not_defined" — условие вообще не упоминается в договоре
           - "upon_payment" — переход прав после полной оплаты
           - "upon_signing" — переход прав с момента подписания договора
           - "upon_acceptance" — переход прав с момента подписания акта сдачи-приёмки
           - "not_specified" — момент перехода не указан явно
           - "yes" — условие прямо разрешено / права сохраняются
           - "no" — условие прямо запрещено / права передаются заказчику
           - "unclear" — формулировка допускает разные толкования
        5. Критические правила:
           - Если ip_transfer_status = "retained_by_contractor" (исключительное право остаётся у подрядчика), то reuse_allowed, modification_allowed, standard_solutions_retained = "not_defined", display = "Не применимо" (т.к. права не передаются заказчику, вопрос о типовых решениях неактуален). Поле ip_transfer_moment = "not_defined", display = "Не применимо".
           - Если ip_transfer_status = "not_defined" (условие не упоминается), то все остальные поля = "not_defined", display = "Данные не определены".
           - Если ip_transfer_status = "full_transfer" или "license", но в договоре прямо указано, что подрядчик сохраняет права на типовые решения/методики/ноу-хау — standard_solutions_retained = "yes".
           - Если ip_transfer_status = "full_transfer" или "license", и в договоре нет оговорки о типовых решениях — standard_solutions_retained = "not_defined", display = "Данные не определены" (вопрос не урегулирован).
        6. Не путай:
           - Полную передачу прав (отчуждение) с лицензией (это разные юридические конструкции)
           - Исключительное право (имущественное) с правом авторства (неимущественное, неотчуждаемое)
           - Передачу прав на документацию с передачей прав на ноу-хау / методики подрядчика
           - Права на конкретный проект с правами на типовые решения, используемые в проекте
        7. Если момент перехода прав определяется по приложению/дополнительному соглашению — это валидный исход, укажи ссылку в ip_transfer_moment.
        8. В evidence — только точные цитаты из документа с указанием пункта.
        9. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.без комментариев и markdown-обёртки.

