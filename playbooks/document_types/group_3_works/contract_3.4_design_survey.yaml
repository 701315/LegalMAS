    confidence_bonus_on_match: 0.1
    confidence_penalty_on_excluded_segment: 0.12
  evidence:
    required: true
    min_snippet_length: 40
    max_snippet_length: 700
  extraction:
    enabled: true
    mode: hybrid
    store_payload: true
    llm_max_tokens: 700
    compact_output: false
    llm_prompt_extraction: "<role>\nТы — юрист, извлекающий сведения о порядке оплаты в договоре ПИР.\nНе оценивай риски. Только заполняй поля строго по тексту.\n</role>\n\n<context>\n{context}\n</context>\n\n<task>\nЗаполни строго следующие поля:\n\nadvance_payment_present — предусмотрен ли аванс\n  (allowed: yes / no / not_found).\n\nstage_payment_present — предусмотрена ли поэтапная оплата\n  (allowed: yes / no / not_found).\n\npayment_linked_to_acts — привязана ли оплата к подписанию актов\n  (allowed: yes / no / unclear / not_found).\n\nfinal_payment_trigger — триггер окончательного расчёта\n  (allowed: after_final_act / after_stage_act / after_invoice / not_specified / not_found).\n\npayment_schedule_reference — ссылка на приложение, график или иной документ\n  о порядке оплаты\n  (текстовое значение или not_found).\n\nЕсли данные отсутствуют: используй \"not_found\"; если тема раскрыта,\nно конкретный признак прямо не установлен, используй \"no\", \"unclear\"\nили \"not_specified\"\
      \ по смыслу поля.\n</task>\n\n<rules>\n1. advance_payment_present: \"yes\" — есть аванс/предоплата; \"no\" — прямо указано,\n   что аванса нет или оплата только по факту; \"not_found\" — тема не раскрыта.\n2. stage_payment_present: \"yes\" — оплата делится по этапам; \"no\" — этапности нет;\n   \"not_found\" — тема не раскрыта.\n3. payment_linked_to_acts: \"yes\" — оплата после акта; \"no\" — оплата явно без акта;\n   \"unclear\" — связь неясна; \"not_found\" — тема не раскрыта.\n4. final_payment_trigger: \"after_final_act\" — после итогового акта;\n   \"after_stage_act\" — после актов этапов; \"after_invoice\" — после счёта;\n   \"not_specified\" — окончательный расчёт есть, но триггер неясен;\n   \"not_found\" — тема не раскрыта.\n5. payment_schedule_reference извлекай кратко, например \"Приложение № 3\".\n6. Не добавляй ключи, не входящие в список полей.\n7. Верни только JSON.\n</rules>\n"
    fields:
