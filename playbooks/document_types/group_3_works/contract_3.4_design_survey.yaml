shared_patterns:

  money_amount: "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|тыс|млн|млрд)"
  date_pattern: "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"
  sro_number: "(?i)\\bСРО[\\s\\-]*[А-Яа-яA-Za-z]*[\\s\\-]*\\d+"
  cadastral_number: "(?i)\\b\\d{2}:\\d{2}:\\d{6,7}:\\d+\\b"
  percentage: "(?i)\\b\\d{1,3}[,.]?\\d{0,2}\\s*%"
  working_days: "(?i)\\b\\d+\\s*(рабочих|календарных)\\s+дн"
  design_stage: "(?i)(стади[яи]\\s*[«\"']?[ПР][»\"']?|проектная\\s+документация|рабочая\\s+документация)"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: COMPLIANCE RULES
#  Читается: DocTypeCheckLoader._exclusion_logic_to_checks()
# ════════════════════════════════════════════════════════════════════════════

compliance_rules:

  - id: "sro_membership_absent_for_expertise_object"
    name: "Отсутствие СРО при проектировании объекта, требующего экспертизы (ст. 55.8 ГрК РФ)"
    description: |
      Проектировщик обязан быть членом СРО для выполнения работ на объектах капитального строительства,
      подлежащих экспертизе. Отсутствие допуска делает невозможным получение положительного заключения
      и влечёт ничтожность результатов работ.
    legal_base: "ст. 55.8 Градостроительного кодекса РФ"
    required_triggers: ["expertise_required"]
    severity: "critical"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      keywords:
        - "на расчётный счёт подрядчика"
        - "проектная документация"
        - "рабочая документация"
        - "разделы ПД"
      keyword_mode: "any"
      negative_keywords:
        - "СРО"
        - "саморегулируемая организация"
        - "допуск СРО"
        - "членство в СРО"
        - "свидетельство СРО"
        - "компенсационный фонд"
    retrieval:
      context_k: 5
      boost_keywords:
        - "СРО"
        - "допуск"
        - "саморегулируемая организация"
        - "членство"
      rerank: true

  - id: "hazardous_facility_special_permit"
    name: "ОПО: специальные допуски при проектировании опасных объектов (ФЗ-116)"
    description: |
      Проектирование опасных производственных объектов требует специальных допусков,
      лицензий Ростехнадзора и соблюдения норм промышленной безопасности.
      Отсутствие соответствующих допусков влечёт недействительность результатов.
    legal_base: "ФЗ от 21.07.1997 № 116-ФЗ «О промышленной безопасности опасных производственных объектов»"
    required_triggers: ["hazardous_facility", "expertise_required"]
    severity: "critical"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      keywords:
        - "опасный производственный объект"
        - "ОПО"
        - "промышленная безопасность"
        - "Ростехнадзор"
        - "лицензия"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "опасный производственный объект"
        - "лицензия Ростехнадзор"
        - "промышленная безопасность"
      rerank: true

  - id: "pd_composition_pp87_violation"
    name: "Нарушение требований к составу ПД (ПП РФ № 87)"
    description: |
      Для объектов капитального строительства состав проектной документации
      определяется Постановлением Правительства РФ от 16.02.2008 № 87.
      Несоответствие ТЗ и перечня разделов этим требованиям влечёт отрицательное
      заключение экспертизы.
    legal_base: "Постановление Правительства РФ от 16.02.2008 № 87"
    required_triggers: ["capital_construction_object", "expertise_required"]
    severity: "high"
    result_if_triggered: "warning"
    detector_type: "rules"
    rules:
      keywords:
        - "состав проектной документации"
        - "разделы проектной документации"
        - "Постановление 87"
        - "ПП 87"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "состав проектной документации"
        - "Постановление 87"
        - "разделы ПД"
      rerank: true

  - id: "cultural_heritage_without_permit"
    name: "Проектирование на объекте культурного наследия без согласования (ФЗ-73)"
    description: |
      Проектирование работ на объектах культурного наследия (памятниках) требует
      лицензии Минкультуры, историко-культурной экспертизы, согласования с органом
      охраны ОКН. Без этого проектная документация не может быть реализована,
      а работы на объекте — запрещены.
    legal_base: "ФЗ от 25.06.2002 № 73-ФЗ «Об объектах культурного наследия»"
    required_triggers: ["cultural_heritage_object"]
    severity: "critical"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      keywords:
        - "лицензия Минкультуры"
        - "историко-культурная экспертиза"
        - "согласование с органом охраны"
        - "охранное обязательство"
        - "предмет охраны"
        - "реставрационная лицензия"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "объект культурного наследия"
        - "лицензия Минкультуры"
        - "историко-культурная экспертиза"
        - "орган охраны"
      rerank: true

  - id: "ecological_expertise_required"
    name: "Обязательная экологическая экспертиза для определённых категорий объектов (ФЗ-174)"
    description: |
      Проектная документация объектов, размещаемых на ООПТ, в границах
      водоохранных зон, на континентальном шельфе, объектов обезвреживания
      и размещения отходов I–V классов подлежит государственной экологической
      экспертизе. Отсутствие положительного заключения ГЭЭ — основание для
      отказа в выдаче разрешения на строительство.
    legal_base: "ФЗ от 23.11.1995 № 174-ФЗ «Об экологической экспертизе»"
    required_triggers: ["ecological_impact_assessment"]
    severity: "critical"
    result_if_triggered: "warning"
    detector_type: "rules"
    rules:
      keywords:
        - "государственная экологическая экспертиза"
        - "ГЭЭ"
        - "заключение экологической экспертизы"
        - "ОВОС"
        - "оценка воздействия на окружающую среду"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "экологическая экспертиза"
        - "ОВОС"
        - "ООПТ"
        - "водоохранная зона"
      rerank: true

