  - id: price_and_calculation_basis
    name: "Цена работ и основание расчёта (ст. 709 ГК РФ)"
    description: >
      Фактографическая проверки цены договора на выполнение проектных и изыскательских
      работ в соответствии со ст. 709 ГК РФ. Цена является существенным условием любого
      договора подряда, включая ПИР. Проверка выявляет пять критических аспектов: (1) определена
      ли цена работ в договоре; (2) конкретная сумма цены или ссылка на документ, определяющий
      цену (смета, приложение, протокол согласования цен, дополнительный договор); (3) тип цены —
      твёрдая (ст. 709 п. 1 ГК РФ), приблизительная (ст. 709 п. 1 ГК РФ), по Справочнику базовых
      цен (СБЦ), процент от стоимости строительства (СМР) или по фактическим затратам (cost_plus);
      (4) включает ли цена НДС — критично для итоговой суммы и налоговых последствий; (5) основание
      расчёта цены — фиксированная сумма, СБЦ, смета, процент от СМР, протокол согласования цен
      или иное. Для договоров ПИР характерна специфика: цена часто определяется не фиксированной
      суммой, а ссылкой на СБЦ, смету или приложение, что является валидным способом определения
      цены и не должно трактоваться как отсутствие цены. Отсутствие или неопределённость цены —
      риск признания договора незаключённым, а также источник споров об объёме оплаты и дополнительных
      работах.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "цена"
        - "стоимость"
        - "вознаграждение"
        - "рублей"
        - "смета"
        - "СБЦ"
        - "справочник базовых цен"
        - "процент от стоимости строительства"
        - "твёрдая цена"
        - "приблизительная цена"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)цен[аеуой]\\s+.*?\\d"
        - "{{ money_amount }}"
        - "(?i)(твёрд|приблизительн)(ая|ой)\\s+цен"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор на выполнение проектных и изыскательских работ (ПИР)
        (§ 4 Главы 37 ГК РФ, ст. 709).
        Проверяется только один вопрос: определена ли цена работ, её тип,
        включение НДС и основание расчёта.
        Нормативный ориентир:
        - ст. 709 ГК РФ (цена в подряде)
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не вычисляй цену самостоятельно (например, не умножай ставку на объём).
        - Не выдумывай суммы, реквизиты приложений или проценты.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Определена ли цена работ.
        2. Сумма цены (если указана прямо) или ссылка на документ, определяющий цену.
        3. Тип цены (твёрдая / приблизительная / по СБЦ / процент от СМР / по фактическим затратам).
        4. Включает ли цена НДС.
        5. Основание расчёта цены (СБЦ, смета, процент, фиксированная сумма, приложение и т.д.).

        [ПРАВИЛА]
        1. Используй только текст документа. Не выдумывай суммы, реквизиты приложений или проценты — извлекай строго из переданного фрагмента.
        2. Не вычисляй цену самостоятельно (например, не умножай ставку на объём работ).
        3. Для enum-полей (price_type, price_includes_vat) при отсутствии данных используй значение "not_defined".
        4. Для текстовых полей (price_amount_value, calculation_basis) при отсутствии данных пиши "Данные не определены".
        5. Для полей *_display используй человеко-читаемые значения согласно маппингу.
        6. Различай:
           - Если цена указана прямо (например, "4 500 000 рублей") — price_amount_value = сумма, price_amount_status = "defined"
           - Если цена определяется по документу (например, "согласно Смете (Приложение № 3)" или "по СБЦ") — price_amount_value = "Определяется по Смете (Приложение № 3)" или аналогично, price_amount_status = "defined"
           - Если цена вообще не упомянута — price_amount_value = "Данные не определены", price_amount_status = "not_defined"
        7. Не путай цену работ с авансом, штрафом, неустойкой или задатком.
        8. В evidence — только точные цитаты из документа с указанием пункта.
        9. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.без комментариев и markdown-обёртки.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — твёрдая цена с НДС, по СБЦ:
        Фрагмент:
        "Цена работ по настоящему договору составляет 4 500 000 (Четыре миллиона
