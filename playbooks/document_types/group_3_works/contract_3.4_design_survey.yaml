      required: false
- id: termination_and_consequences
  name: 'Расторжение: основания и последствия (ст. 715, 717, 758 ГК РФ)'
  description: Проверяет основания расторжения, порядок оплаты выполненной части, возврат документации
  legal_base: ст. 715, 717, 758 ГК РФ
  triggers: null
  ui_mode: field_extraction
  severity: high
  severity_if_pass: pass
  severity_if_fail: high
  severity_if_unclear: high
  origin: DOCUMENT_TYPE
  detector_type: hybrid
  rules:
    keywords:
    - расторжение
    - отказ от договора
    - отказ заказчика
    - оплата выполненной части
    - возврат документации
    - неустойка
    - штраф
    keyword_mode: any
    regex_patterns:
    - (?i)расторж(ение|ении)
    - (?i)отказ.*от.*договор
    - (?i)оплат.*выполненн.*част
  llm:
    prompt_template: "[КОНТЕКСТ]\nТы — юрист, анализирующий договор ПИР.\nПроверяется только один вопрос: основания расторжения договора,\nпорядок оплаты фактически выполненной части работ и судьба документации.\n\nВажно:\n— Анализируй только положения о расторжении, одностороннем отказе\n  и последствиях прекращения договора.\n— Не оценивай риск и не смешивай расторжение с неустойкой или форс-мажором.\n— Если условие не установлено прямо, не домысливай.\n\n[ЗАДАЧА]\n1. Установить, предусмотрено ли право на односторонний отказ от договора.\n2. Определить, за какой стороной закреплено такое право.\n3. Установить, урегулирован ли порядок оплаты выполненной части.\n4. Установить, урегулирован ли возврат документации при расторжении.\n5. Установить, предусмотрена ли штрафная санкция за расторжение.\n\n[ПРАВИЛА]\n1. unilateral_termination_right = \"client_only\" — только заказчик\n   вправе отказаться; \"contractor_only\" — только подрядчик;\n   \"both\" — обе стороны; \"none\" — прямо указано,\
      \ что нет;\n   \"not_found\" — тема отсутствует.\n2. partial_work_payment = \"defined\" — установлен порядок оплаты\n   фактически выполненной части; \"not_defined\" — тема раскрыта,\n   но порядок не определён; \"not_found\" — тема отсутствует.\n3. documentation_return = \"defined\" — урегулирован возврат или передача\n   документации при расторжении; \"not_defined\" — тема раскрыта,\n   но не урегулирована; \"not_found\" — тема отсутствует.\n4. termination_penalty_present = \"yes\" — есть штраф/неустойка\n   за расторжение; \"no\" — тема раскрыта, но штрафа нет;\n   \"not_found\" — тема отсутствует.\n5. termination_notice_period — срок уведомления о расторжении\n   (текст) или \"not_found\".\n6. Не путай расторжение с приостановкой работ.\n7. Не путай штраф за расторжение с неустойкой за просрочку.\n\n[ПРИМЕРЫ (FEW-SHOT)]\nПример 1 — расторжение урегулировано:\nТекст: «Заказчик вправе отказаться от договора в любое время,\nуведомив Подрядчика за 30 календарных дней. При отказе Заказчика\n\
      Подрядчику оплачиваются фактически выполненные и принятые работы.\nПодрядчик обязан передать всю разработанную документацию Заказчику.»\n\nОтвет:\n{\n  \"unilateral_termination_right\": \"client_only\",\n  \"partial_work_payment\": \"defined\",\n  \"documentation_return\": \"defined\",\n  \"termination_penalty_present\": \"no\",\n  \"termination_notice_period\": \"30 календарных дней\",\n  \"evidence\": [\n    \"Заказчик вправе отказаться от договора в любое время, уведомив Подрядчика за 30 календарных дней.\",\n    \"При отказе Заказчика Подрядчику оплачиваются фактически выполненные и принятые работы.\",\n    \"Подрядчик обязан передать всю разработанную документацию Заказчику.\"\n  ]\n}\n\nПример 2 — тема не раскрыта:\nТекст: «Договор действует до полного исполнения обязательств сторонами.»\n\nОтвет:\n{\n  \"unilateral_termination_right\": \"not_found\",\n  \"partial_work_payment\": \"not_found\",\n  \"documentation_return\": \"not_found\",\n  \"termination_penalty_present\": \"\
      not_found\",\n  \"termination_notice_period\": \"not_found\",\n  \"evidence\": []\n}\n\n[ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]\n1. Есть ли именно право на расторжение/отказ, а не общее прекращение?\n2. За какой стороной закреплено право?\n3. Установлен ли порядок оплаты выполненной части?\n4. Есть ли условие о возврате/передаче документации?\n5. Не перепутан ли штраф за расторжение с общей неустойкой?\n\n[ФОРМАТ ОТВЕТА]\nВерни строго JSON:\n{\n  \"unilateral_termination_right\": \"<client_only / contractor_only / both / none / not_found>\",\n  \"partial_work_payment\": \"<defined / not_defined / not_found>\",\n  \"documentation_return\": \"<defined / not_defined / not_found>\",\n  \"termination_penalty_present\": \"<yes / no / not_found>\",\n  \"termination_notice_period\": \"<текст или not_found>\",\n  \"evidence\": [\"<цитата 1>\", \"<цитата 2>\"]\n}\n"
    prompt_file: null
    context_k: 6
    temperature: 0.0
    max_tokens: 520
