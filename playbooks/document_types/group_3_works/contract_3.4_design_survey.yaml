    llm_max_tokens: 800

    compact_output: false

    llm_prompt_extraction: |
      <role>
      Ты — юрист, извлекающий сведения о неустойке за просрочку
      в договоре ПИР. Не оценивай риски. Только заполняй поля строго по тексту.
      </role>

      <context>
      {context}
      </context>

      <task>
      Заполни строго следующие поля:

      contractor_penalty_present — предусмотрена ли неустойка для подрядчика
        (allowed: yes / no / not_found).

      contractor_penalty_rate — размер/ставка неустойки подрядчика
        (текстовое значение или not_found).

      penalty_basis — базис расчёта неустойки
