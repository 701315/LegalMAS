    llm_prompt_extraction: "<role>\nТы — юрист, извлекающий сведения о сторонах договора ПИР.\nПроверяется только вводная часть и раздел реквизитов.\nНе оценивай риски. Только заполняй поля строго по тексту.\n</role>\n\n<context>\n{context}\n</context>\n\n<task>\nЗаполни строго следующие поля:\n\nclient_details_status — определены ли реквизиты заказчика\n  (allowed: defined / not_defined).\n  \"defined\" — только если указаны наименование и хотя бы ИНН или ОГРН.\n\nclient_details_value — фактические реквизиты заказчика: наименование, ИНН, ОГРН, адрес\n  (текстовое значение или not_defined).\n\nclient_type — тип заказчика\n  (allowed: legal_entity / state_entity / individual / ip / self_employed / not_defined).\n\nclient_signatory — ФИО и должность подписанта заказчика\n  (текстовое значение или not_defined).\n\nclient_signatory_basis — основание полномочий подписанта заказчика\n  (allowed: charter / poa / order / personal / other / not_defined).\n\ncontractor_details_status — определены\
      \ ли реквизиты подрядчика\n  (allowed: defined / not_defined).\n  \"defined\" — только если указаны наименование и хотя бы ИНН или ОГРН.\n\ncontractor_details_value — фактические реквизиты подрядчика: наименование, ИНН, ОГРН, адрес\n  (текстовое значение или not_defined).\n\ncontractor_type — тип подрядчика\n  (allowed: legal_entity / individual / ip / not_defined).\n\ncontractor_signatory — ФИО и должность подписанта подрядчика\n  (текстовое значение или not_defined).\n\ncontractor_signatory_basis — основание полномочий подписанта подрядчика\n  (allowed: charter / poa / order / personal / other / not_defined).\n\ncorporate_approval_status — наличие корпоративного одобрения сделки\n  (allowed: defined / not_defined).\n\ncorporate_approval_details — реквизиты решения об одобрении\n  (текстовое значение или not_defined).\n\nЕсли данные отсутствуют: указывай \"not_defined\" для каждого поля.\n</task>\n\n<rules>\n1. client_details_status / contractor_details_status: \"defined\" — только\
      \ при наличии\n   наименования и хотя бы ИНН или ОГРН; иначе — \"not_defined\".\n2. client_type: \"legal_entity\" — ООО, АО, ПАО и др.; \"state_entity\" — госорган,\n   казённое/бюджетное учреждение, ГУП, МУП; \"ip\" — ИП; \"individual\" —\n   физлицо; \"self_employed\" — самозанятый; \"not_defined\" — не установлено.\n3. contractor_type: \"legal_entity\" — ООО, АО и др.; \"ip\" — ИП;\n   \"individual\" — физлицо; \"not_defined\" — не установлено.\n4. client_signatory_basis / contractor_signatory_basis: \"charter\" —\n   «на основании Устава»; \"poa\" — «на основании доверенности»;\n   \"order\" — «на основании приказа»; \"personal\" — физлицо лично;\n   \"other\" — иное; \"not_defined\" — не указано.\n5. corporate_approval_status = \"defined\" только при явном упоминании\n   одобрения крупной сделки или сделки с заинтересованностью.\n6. Не смешивай поля заказчика и подрядчика.\n7. Не добавляй ключи, не входящие в список полей выше.\n8. Верни только JSON.\n</rules>\n"
