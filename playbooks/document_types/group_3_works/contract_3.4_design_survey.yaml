# CHECK 4: Исходные данные (ст. 759 ГК РФ)
# ──────────────────────────────────────────────────────────────────────────
  - id: initial_data_provision_check
    name: "Исходные данные: перечень, сроки, последствия задержки (ст. 759 ГК РФ)"
    description: >
      Фактографическая проверка наличия перечня исходных данных, сроков их
      предоставления заказчиком, последствий задержки и оговорки
