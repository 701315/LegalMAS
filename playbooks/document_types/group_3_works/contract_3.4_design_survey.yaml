      description: Кто обязан подать документацию на экспертизу.
      required: false
    - name: who_pays_expertise
      type: string
      label: Кто оплачивает экспертизу
      presentation: badge
      display_in_grid: false
      display_priority: 5
      allowed_values:
      - contractor
      - client
      - jointly
      - not_specified
      - not_found
      description: Кто несёт расходы на проведение экспертизы.
      required: false
    - name: payment_linked_to_positive_conclusion
      type: string
      label: Оплата после положительного заключения
      presentation: badge
      display_in_grid: true
      display_priority: 2
      allowed_values:
      - 'yes'
      - 'no'
      - not_found
      description: Привязан ли окончательный расчёт к положительному заключению.
      required: true
    - name: negative_conclusion_consequences
      type: string
      label: Последствия отрицательного заключения
      presentation: badge
      display_in_grid: true
      display_priority: 3
      allowed_values:
      - rework_free
