          - "no"
          - "not_found"
        description: "Разграничена ли ответственность проектировщика и строителя."
        required: true
      - name: "designer_scope"
        type: "string"
        label: "Scope ответственности проектировщика"
        presentation: "badge"
        display_in_grid: true
        display_priority: 2
        allowed_values:
          - "documentation_quality_only"
          - "includes_supervision"
          - "not_specified"
          - "not_found"
        description: "На что распространяется ответственность проектировщика."
        required: false
      - name: "author_supervision_separate"
        type: "string"
        label: "Авторский надзор — отдельно"
        presentation: "badge"
        display_in_grid: true
        display_priority: 3
        allowed_values:
          - "yes"
          - "no"
          - "not_found"
        description: "Является ли авторский надзор отдельной услугой или договором."
        required: false

# ──────────────────────────────────────────────────────────────────────────
# CHECK 18: Авторский надзор: условия и порядок
# ──────────────────────────────────────────────────────────────────────────
- id: author_supervision_terms
  name: "Авторский надзор: условия и порядок (ст. 12 ФЗ-169)"
  description: |
    Проверяет наличие условий авторского надзора — обязателен ли он,
    порядок осуществления, оплата, ответственность.
  legal_base: "ст. 12 ФЗ от 17.11.1995 № 169-ФЗ"
  triggers:
    any:
      - "author_supervision"
  ui_mode: "field_extraction"
  severity: "high"
  origin: "DOCUMENT_TYPE"
  detector_type: "hybrid"
  rules:
    keywords:
      - "авторский надзор"
      - "надзор автора проекта"
      - "контроль за реализацией"
      - "участие проектировщика в приёмке"
      - "журнал авторского надзора"
    keyword_mode: "any"
    regex_patterns:
      - "(?i)авторск(ий|ого)\\s+надзор"
  llm:
    prompt_template: |
      [КОНТЕКСТ]
      Ты — юрист, анализирующий договор ПИР.
      Проверяется только один вопрос: предусмотрен ли авторский надзор
      проектировщика за строительством, каковы его scope, порядок оплаты
      и ответственность.

      Важно:
      — Анализируй только положения об авторском надзоре.
      — Не оценивай риск и не смешивай авторский надзор с технадзором заказчика.
      — Если условие не установлено прямо, не домысливай.

      [ЗАДАЧА]
      1. Установить, включён ли авторский надзор в договор.
      2. Определить scope надзора.
      3. Определить порядок оплаты надзора.
      4. Установить, предусмотрена ли ответственность за ненадлежащий надзор.

      [ПРАВИЛА]
      1. author_supervision_included = "yes" — авторский надзор включён
         в предмет текущего договора; "separate_contract" — предусмотрен,
         но как отдельный договор; "not_found" — тема отсутствует.
      2. supervision_scope = "full" — полный авторский надзор за строительством;
         "limited" — ограниченный (только по запросу, выборочный);
         "not_specified" — надзор есть, но scope не определён;
         "not_found" — тема отсутствует.
      3. supervision_payment = "included_in_price" — оплата входит в цену договора;
         "separate_fee" — оплачивается отдельно;
         "not_specified" — порядок оплаты не определён;
         "not_found" — тема отсутствует.
      4. supervision_liability = "yes" — предусмотрена ответственность за ненадлежащий надзор;
         "no" — тема раскрыта, но ответственность не установлена;
         "not_found" — тема отсутствует.
      5. Не путай авторский надзор с техническим надзором заказчика.
      6. Не путай авторский надзор с экспертизой ПД.
      7. Если тема не затронута — все = "not_found".

      [ПРИМЕРЫ (FEW-SHOT)]
      Пример 1 — авторский надзор включён:
      Текст: «Подрядчик осуществляет авторский надзор за строительством
      в полном объёме в соответствии с СП 246.1325800.2016. Стоимость
      авторского надзора включена в цену договора. Подрядчик несёт
      ответственность за ненадлежащее осуществление авторского надзора.»

      Ответ:
      {
        "author_supervision_included": "yes",
        "supervision_scope": "full",
        "supervision_payment": "included_in_price",
        "supervision_liability": "yes",
        "evidence": [
          "Подрядчик осуществляет авторский надзор за строительством в полном объёме в соответствии с СП 246.1325800.2016.",
          "Стоимость авторского надзора включена в цену договора.",
          "Подрядчик несёт ответственность за ненадлежащее осуществление авторского надзора."
        ]
      }

      Пример 2 — тема не раскрыта:
      Текст: «Подрядчик обязуется разработать проектную документацию.»

      Ответ:
      {
        "author_supervision_included": "not_found",
        "supervision_scope": "not_found",
        "supervision_payment": "not_found",
        "supervision_liability": "not_found",
        "evidence": []
      }

      [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
      1. Включён ли авторский надзор в текущий договор или в отдельный?
      2. Определён ли scope — полный или ограниченный?
      3. Определена ли оплата — в составе цены или отдельно?
      4. Есть ли ответственность за ненадлежащий надзор?
      5. Все ли ключи JSON совпадают со schema?

      [ФОРМАТ ОТВЕТА]
      Верни строго JSON:
      {
        "author_supervision_included": "<yes / separate_contract / not_found>",
        "supervision_scope": "<full / limited / not_specified / not_found>",
        "supervision_payment": "<included_in_price / separate_fee / not_specified / not_found>",
        "supervision_liability": "<yes / no / not_found>",
        "evidence": ["<цитата 1>", "<цитата 2>"]
      }
    prompt_file: null
    context_k: 4
    temperature: 0.0
    max_tokens: 440
  retrieval:
    corpus_scope: "document"
    context_k: 4
    max_chunks: 6
    boost_keywords:
      - "авторский надзор"
      - "надзор за строительством"
      - "журнал авторского надзора"
    negative_keywords:
      - "экспертиза"
      - "технический надзор"
      - "форс-мажор"
      - "подсудность"
    rerank: true
    filters: {}
  enrichment_hints:
    preferred_segment_types:
      - "clause"
      - "article"
    excluded_segment_types:
      - "signature_block"
    preferred_clause_functions:
      - "obligations"
      - "obligations"
  evidence:
    required: true
    min_snippet_length: 30
    max_snippet_length: 500
  extraction:
    enabled: true
    mode: "hybrid"
    store_payload: true
    llm_max_tokens: 550

    compact_output: false

    llm_prompt_extraction: |
      <role>
      Ты — юрист, извлекающий сведения об авторском надзоре в договоре ПИР.
      Не оценивай риски. Только заполняй поля строго по тексту.
      </role>

      <context>
      {context}
      </context>

      <task>
      Заполни строго следующие поля:

      author_supervision_included — включён ли авторский надзор
        (allowed: yes / separate_contract / not_found).

      supervision_scope — scope надзора
        (allowed: full / limited / not_specified / not_found).

      supervision_payment — порядок оплаты надзора
        (allowed: included_in_price / separate_fee / not_specified / not_found).

      supervision_liability — ответственность за ненадлежащий надзор
        (allowed: yes / no / not_found).

      Если данные отсутствуют: указывай "not_found".
      </task>

      <rules>
      1. author_supervision_included: "yes" — в текущем договоре;
         "separate_contract" — в отдельном; "not_found" — тема отсутствует.
      2. supervision_scope: "full" — полный; "limited" — ограниченный;
         "not_specified" — scope неясен; "not_found" — тема отсутствует.
      3. supervision_payment: "included_in_price" — входит в цену;
         "separate_fee" — отдельная оплата; "not_specified" — порядок неясен;
         "not_found" — тема отсутствует.
      4. supervision_liability: "yes" — ответственность установлена;
         "no" — тема раскрыта, но ответственность нет;
         "not_found" — тема отсутствует.
      5. Не добавляй ключи, не входящие в список полей.
      6. Верни только JSON.
      </rules>
    fields:
      - name: "author_supervision_included"
        type: "string"
        label: "Авторский надзор включён"
        presentation: "badge"
        display_in_grid: true
        display_priority: 1
        allowed_values:
          - "yes"
          - "separate_contract"
          - "not_found"
        description: "Включён ли авторский надзор в договор."
        required: true
      - name: "supervision_scope"
        type: "string"
        label: "Scope надзора"
        presentation: "badge"
        display_in_grid: true
        display_priority: 2
        allowed_values:
          - "full"
          - "limited"
          - "not_specified"
          - "not_found"
        description: "Объём авторского надзора."
        required: false
      - name: "supervision_payment"
        type: "string"
        label: "Оплата надзора"
        presentation: "badge"
        display_in_grid: true
        display_priority: 3
        allowed_values:
          - "included_in_price"
          - "separate_fee"
          - "not_specified"
          - "not_found"
        description: "Порядок оплаты авторского надзора."
        required: false
      - name: "supervision_liability"
        type: "string"
        label: "Ответственность за надзор"
        presentation: "badge"
        display_in_grid: false
        display_priority: 4
        allowed_values:
          - "yes"
          - "no"
          - "not_found"
        description: "Предусмотрена ли ответственность за ненадлежащий надзор."
        required: false

# ──────────────────────────────────────────────────────────────────────────
# CHECK 19: Гарантия качества документации и соответствие нормативам
# ──────────────────────────────────────────────────────────────────────────
- id: quality_warranty
  name: "Гарантия качества документации и соответствие нормативам (ст. 761 ГК РФ)"
  description: |
    Проверяет наличие гарантий соответствия ПД нормативным требованиям (СП, ГОСТ,
    СНиП, техрегламенты), ТЗ и исходным данным. Включает проверку ссылок
    на применимые нормативы проектирования.
  legal_base: "ст. 761 ГК РФ, ФЗ-384"
  triggers: ~
  ui_mode: "field_extraction"
  severity: "high"
  origin: "DOCUMENT_TYPE"
  detector_type: "hybrid"
  rules:
    keywords:
      - "гарантирует соответствие"
      - "нормативные требования"
      - "техническое задание"
      - "действующие нормы"
      - "СНиП"
      - "СП"
      - "ГОСТ"
      - "качество документации"
      - "Свод правил"
      - "технический регламент"
      - "нормы проектирования"
    keyword_mode: "any"
    regex_patterns:
      - "(?i)гарантиру(ет|ют).*соответств"
      - "(?i)документаци.*соответств.*норм"
      - "(?i)\\b(СП|ГОСТ|СНиП)\\s+\\d"
      - "(?i)техническ(ий|ого)\\s+регламент"
  llm:
    prompt_template: |
      [КОНТЕКСТ]
      Ты — юрист, анализирующий договор ПИР.
      Проверяется только один вопрос: гарантирует ли подрядчик соответствие
      проектной документации нормативным требованиям, ТЗ и исходным данным,
      и содержит ли договор ссылки на применимые нормативы.

      Важно:
      — Анализируй только положения о качестве ПД, гарантиях соответствия
        и ссылках на нормативы проектирования.
      — Не оценивай риск и не смешивай гарантию качества ПД
        с гарантийным сроком на документацию.
      — Если условие не установлено прямо, не домысливай.

      [ЗАДАЧА]
      1. Установить, гарантирует ли подрядчик соответствие ПД нормативам.
      2. Установить, гарантирует ли подрядчик соответствие ПД техническому заданию.
      3. Установить, содержит ли договор ссылки на конкретные нормативы (СП, ГОСТ, СНиП).
      4. Определить, перечислены ли конкретные нормативные документы.
      5. Установить, предусмотрена ли обязанность следить за изменениями нормативов.

      [ПРАВИЛА]
      1. quality_guarantee_present = "yes" — если подрядчик прямо гарантирует
         соответствие ПД нормативным требованиям;
         "no" — если тема раскрыта, но гарантии нет;
         "not_found" — если тема отсутствует.
      2. tz_compliance_guaranteed = "yes" — если подрядчик гарантирует
         соответствие ПД техническому заданию;
         "no" — если тема раскрыта, но гарантии нет;
         "not_found" — если тема отсутствует.
      3. norms_referenced = "yes" — если в договоре есть ссылки
         на конкретные нормативы (СП, ГОСТ, СНиП, техрегламенты);
         "general_reference" — если есть общая ссылка на «действующие нормы»
         без перечисления конкретных документов;
         "no" — если тема раскрыта, но ссылок нет;
         "not_found" — если тема отсутствует.
      4. specific_norms_listed — перечень конкретных нормативов
         (текст) или "not_found".
      5. norms_update_obligation = "yes" — если подрядчик обязан учитывать
         изменения нормативов в период выполнения работ;
         "no" — если тема раскрыта, но такой обязанности нет;
         "not_found" — если тема отсутствует.
      6. Не путай гарантию соответствия нормам (факт на момент сдачи)
         с гарантийным сроком (период после сдачи).
      7. Не путай ссылки на нормативы в ТЗ со ссылками в самом договоре.

      [ПРИМЕРЫ (FEW-SHOT)]
