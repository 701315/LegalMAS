    detector_type: "hybrid"
    rules:
      keywords:
        - "проектная документация"
        - "рабочая документация"
        - "инженерные изыскания"
        - "предмет договора"
        - "объект проектирования"
        - "стадия П"
        - "стадия Р"
        - "техническое задание"
        - "состав документации"
      keyword_mode: "any"
      regex_patterns:
        - "{{ design_stage }}"
        - "(?i)(проектн.*и.*изыскательск|инженерн.*изыскани)"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор на выполнение проектных и изыскательских работ (ПИР)
        (§ 4 Главы 37 ГК РФ, ст. 758; ГрК РФ ст. 48).
        Проверяется только один вопрос: предмет договора — что именно
        обязан выполнить подрядчик, на каком объекте и в какой стадии.
        Нормативный ориентир:
        - ст. 758 ГК РФ
        - ст. 48 ГрК РФ
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Вид работ: проектные / изыскательские / комплексные.
        2. Наименование объекта проектирования.
        3. Местоположение (адрес) объекта.
        4. Стадию проектирования: П / Р / обе.
        5. Ссылку на техническое задание (номер приложения).
        6. Перечислены ли разделы проектной документации.

        [ПРАВИЛА]
        1. Только текст документа.
        2. Если условие не указано прямо — "not_defined".
        3. Строго "Данные не определены" при отсутствии текста.
        4. В evidence — только текст договора.
        5. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1:
        Фрагмент:
        "Подрядчик обязуется выполнить проектные работы (стадия П и Р)
        по объекту «Многоквартирный жилой дом по адресу: г. Казань, ул. Баумана, 15»
        в соответствии с Техническим заданием (Приложение № 1 к договору).
        Состав документации: раздел АР, раздел КР, раздел ОВиК, раздел ЭО."
        Ответ:
        {
          "work_type": "design",
          "object_name": "Многоквартирный жилой дом по адресу: г. Казань, ул. Баумана, 15",
          "object_location": "г. Казань, ул. Баумана, 15",
          "design_stage": "P_and_R",
          "tz_reference": "Приложение № 1",
          "design_sections_listed": "yes",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "Подрядчик обязуется выполнить проектные работы (стадия П и Р) по объекту «Многоквартирный жилой дом по адресу: г. Казань, ул. Баумана, 15»."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Подрядчик выполняет проектные работы по объекту Заказчика."
        Ответ:
        {
          "work_type": "design",
          "object_name": "Данные не определены",
          "object_location": "Данные не определены",
          "design_stage": "not_defined",
          "tz_reference": "Данные не определены",
          "design_sections_listed": "not_defined",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "Подрядчик выполняет проектные работы по объекту Заказчика."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Извлечено ли официальное наименование объекта без сокращений?
        2. Не перепутаны ли стадия П и стадия Р?
        3. tz_reference — это номер приложения, а не просто слово «техническое задание»?
        4. design_sections_listed — по факту перечисления разделов?
        5. Все ли значения соответствуют допустимым?
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "work_type": "<design / survey / design_and_survey / not_found>",
          "object_name": "<наименование объекта или 'Данные не определены'>",
          "object_location": "<адрес/местоположение или 'Данные не определены'>",
          "design_stage": "<P / R / P_and_R / not_found>",
          "tz_reference": "<номер приложения / referenced_no_number / 'Данные не определены'>",
          "design_sections_listed": "<yes / no / not_found>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 500
      retrieval:
        retrieval_profile: "technical_documentation_check"
        corpus_scope: "primary_segment"
        levels:
          - "legal_unit"
          - "section"
        required_kind: "legal_unit"
        retrieval_query: "предмет договора проектная документация рабочая документация инженерные изыскания техническое задание объект проектирования стадия состав документации"
        preferred_unit_types:
          - obligation
          - general_provision
        excluded_unit_types:
          - definition
          - structural_anchor
          - technical_fragment
        preferred_clause_functions:
          - definitions
          - obligations
        negative_keywords:
          - "неустойка"
          - "оплата"
          - "расторжение"
          - "форс-мажор"
          - "означает"
          - "в целях настоящего"
        position_bias:
          preferred_range: [0.0, 0.40]
          boost: 0.20
          scope: segment
        context_k: 6
        max_chunks: 10
        rerank: true
        enrichment_hints:
          preferred_segment_types:
            - "contract"
            - "amendment"
          excluded_segment_types:
            - "technical_specification"
            - "price_list"
          preferred_clause_functions:
            - "definitions"
            - "obligations"
          confidence_bonus_on_match: 0.10
          confidence_penalty_on_excluded_segment: 0.12
      evidence:
        required: true
        min_snippet_length: 40
        max_snippet_length: 650
      extraction:
        enabled: true
        mode: "hybrid"
        compact_output: false
        llm_max_tokens: 800
        llm_prompt_extraction: |
          <role>
          Ты — российский юрист. Извлеки из договора ПИР сведения о предмете:
          вид работ, объект, стадия, ссылка на ТЗ, перечень разделов ПД.
          Не анализируй цену, сроки, ответственность или иные темы.
          </role>
          <context>
          {context}
          </context>
          <task>
          Заполни строго следующие поля:
          1. work_type — вид работ (design / survey / design_and_survey / not_found).
          2. object_name — наименование объекта проектирования.
          3. object_location — адрес или местоположение объекта.
          4. design_stage — стадия проектирования (P / R / P_and_R / not_found).
          5. tz_reference — ссылка на ТЗ (номер приложения или referenced_no_number).
          6. design_sections_listed — перечислены ли разделы ПД (yes / no / not_found).
          Если данные отсутствуют: "not_defined" или "Данные не определены".
          </task>
          <rules>
          - Используй только текст договора.
          - object_name извлекай дословно, не сокращай.
          - tz_reference: извлекай номер приложения; если ТЗ упомянуто без номера — "referenced_no_number".
          - Верни только JSON.
          </rules>
        fields:
          - name: "work_type"
            type: "string"
            presentation: "signal"
            allowed_values: ["design", "survey", "design_and_survey", "not_defined"]
            description: "Вид работ по договору."
            required: true
          - name: "object_name"
            type: "string"
            presentation: "fact"
            label: "Наименование объекта"
            description: "Официальное наименование объекта проектирования."
            required: true
