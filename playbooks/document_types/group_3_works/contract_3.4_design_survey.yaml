        7. specific_norms_listed — перечень конкретных нормативов (текст) или "Данные не определены" или "Не применимо".
        8. norms_update_obligation — обязанность учитывать изменения нормативов: yes / no / not_defined.
        9. norms_update_obligation_display — человеко-читаемое значение: "Да, обязан учитывать изменения" / "Нет, не обязан" / "Данные не определены" / "Не применимо".

