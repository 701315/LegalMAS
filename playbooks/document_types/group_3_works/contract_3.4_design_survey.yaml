  - id: penalty_for_delay
    name: "Неустойка за просрочку выполнения работ (ст. 330 ГК РФ)"
    description: >
      Фактографическая проверка режима неустойки за просрочку в договоре на выполнение
      проектных и изыскательских работ (ПИР) в соответствии со ст. 330 ГК РФ. Неустойка —
      один из ключевых механизмов стимулирования надлежащего исполнения обязательств
      по договору ПИР. Проверка выявляет шесть критических аспектов: (1) наличие неустойки
      для подрядчика за просрочку выполнения работ (создание проектной документации /
      выполнение изысканий) — типично 0,1–0,3% за каждый день просрочки; (2) размер/ставка
      неустойки подрядчика — конкретная формулировка (например, «0,1% от цены договора
      за каждый день просрочки»); (3) базис расчёта неустойки — от цены договора
      (наиболее жёсткий для подрядчика), от цены этапа (более мягкий), от суммы просроченного
      платежа (типично для заказчика) или фиксированная сумма; (4) наличие встречной неустойки
      для заказчика за просрочку оплаты — типично 0,05–0,1% от суммы просроченного платежа;
      (5) размер/ставка встречной неустойки заказчика; (6) наличие лимита (cap) на сумму
      неустойки — типично 10% от цены договора, защищает подрядчика от неограниченной
      ответственности. Отсутствие или несимметричность неустоек — типичный дисбаланс
      в договорах ПИР, создающий риски для одной из сторон. Важно: данный check проверяет
      именно неустойку за просрочку исполнения обязательств, а не штраф за расторжение
      договора (Check 13) и не ответственность за ошибки в ПД (Check 16).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "неустойка"
        - "пеня"
        - "штраф"
        - "за каждый день просрочки"
        - "процент за просрочку"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)неустойк(а|и|у).*\\d"
        - "(?i)пен(я|и|ю).*\\d.*%"
        - "(?i)за\\s+каждый\\s+день\\s+просрочк"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор на выполнение проектных и изыскательских работ (ПИР)
        (§ 4 Главы 37 ГК РФ, ст. 330).
        Проверяется только один вопрос: неустойка за просрочку исполнения обязательств.
        Нормативный ориентир:
        - ст. 330 ГК РФ (неустойка)
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не выдумывай ставки, проценты или суммы — извлекай строго из переданного фрагмента.
        - Не путай неустойку за просрочку (этот check) со штрафом за расторжение договора (Check 13).
        - Не путай неустойку за просрочку с ответственностью за ошибки в ПД (Check 16).

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Неустойка для подрядчика за просрочку выполнения работ.
        2. Размер/ставка неустойки подрядчика.
        3. Базис расчёта неустойки (от цены договора / от цены этапа / от суммы просрочки / фиксированная сумма).
        4. Встречная неустойка для заказчика за просрочку оплаты.
        5. Размер/ставка встречной неустойки заказчика.
        6. Лимит (cap) на сумму неустойки.

        [ПРАВИЛА]
        1. Используй только текст документа. Не выдумывай ставки, проценты или суммы — извлекай строго из переданного фрагмента.
        2. Для enum-полей при отсутствии данных используй значение "not_defined".
        3. Для текстовых полей при отсутствии данных пиши "Данные не определены".
        4. Для полей *_display используй человеко-читаемые значения согласно маппингу.
        5. Различай:
           - "yes" — условие прямо указано в договоре
           - "no" — условие прямо исключено
           - "not_defined" — условие вообще не упоминается в договоре
           - "contract_price" — базис расчёта: от цены договора
           - "stage_price" — базис расчёта: от цены этапа
           - "overdue_amount" — базис расчёта: от суммы просроченного платежа
           - "fixed_amount" — базис расчёта: фиксированная сумма
           - "not_specified" — базис упомянут, но не конкретизирован
        6. Критическое правило:
           - Если contractor_penalty_present = "no" (неустойка подрядчика прямо исключена), то contractor_penalty_rate = "Не применимо", penalty_basis = "not_defined", display = "Не применимо", penalty_cap_present = "not_defined", display = "Не применимо". Поля заказчика (client_penalty_*) оцениваются отдельно.
           - Если contractor_penalty_present = "not_defined" (условие не упоминается), то contractor_penalty_rate = "Данные не определены", остальные поля = "not_defined", display = "Данные не определены".
        7. Не путай:
           - Неустойку за просрочку выполнения работ (этот check) со штрафом за расторжение (Check 13)
           - Неустойку за просрочку с ответственностью за ошибки в ПД (Check 16)
           - Неустойку подрядчика (за просрочку выполнения) с неустойкой заказчика (за просрочку оплаты) — это разные механизмы
        8. Если ставка неустойки или cap определяется по приложению/доп. соглашению — это валидный исход, укажи ссылку.
        9. В evidence — только точные цитаты из документа с указанием пункта.
        10. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.без комментариев и markdown-обёртки.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — полный набор условий:
        Фрагмент:
        "За нарушение сроков выполнения работ Подрядчик уплачивает
        неустойку в размере 0,1% от цены договора за каждый день просрочки,
        но не более 10% от цены договора. За просрочку оплаты Заказчик
        уплачивает пеню в размере 0,05% от суммы просроченного платежа
        за каждый день просрочки."
        Ответ:
        {
          "contractor_penalty_present": "yes",
          "contractor_penalty_rate": "0,1% от цены договора за каждый день просрочки",
          "penalty_basis": "contract_price",
          "penalty_basis_display": "От цены договора",
          "client_penalty_present": "yes",
          "client_penalty_rate": "0,05% от суммы просроченного платежа за каждый день просрочки",
          "penalty_cap_present": "yes",
          "penalty_cap_present_display": "Да, лимит установлен (10% от цены договора)",
          "evidence": [
            {
              "clause_ref": "п. 13.1",
              "quote": "За нарушение сроков выполнения работ Подрядчик уплачивает неустойку в размере 0,1% от цены договора за каждый день просрочки, но не более 10% от цены договора."
            },
            {
              "clause_ref": "п. 13.2",
              "quote": "За просрочку оплаты Заказчик уплачивает пеню в размере 0,05% от суммы просроченного платежа за каждый день просрочки."
            }
          ]
        }

        Пример 2 — неустойка от цены этапа, без cap:
        Фрагмент:
        "За просрочку выполнения этапа Подрядчик уплачивает неустойку
        в размере 0,2% от цены соответствующего этапа за каждый день просрочки.
        Лимит неустойки не устанавливается."
        Ответ:
        {
          "contractor_penalty_present": "yes",
          "contractor_penalty_rate": "0,2% от цены соответствующего этапа за каждый день просрочки",
          "penalty_basis": "stage_price",
          "penalty_basis_display": "От цены этапа",
          "client_penalty_present": "not_defined",
          "client_penalty_rate": "Данные не определены",
          "penalty_cap_present": "no",
          "penalty_cap_present_display": "Нет, лимит не установлен",
          "evidence": [
            {
              "clause_ref": "п. 13.1",
              "quote": "За просрочку выполнения этапа Подрядчик уплачивает неустойку в размере 0,2% от цены соответствующего этапа за каждый день просрочки."
            },
            {
              "clause_ref": "п. 13.2",
              "quote": "Лимит неустойки не устанавливается."
            }
          ]
        }

        Пример 3 — неустойка подрядчика исключена:
        Фрагмент:
        "Неустойка за просрочку выполнения работ Подрядчиком не предусмотрена.
        За просрочку оплаты Заказчик уплачивает пеню 0,1% в день."
        Ответ:
        {
          "contractor_penalty_present": "no",
          "contractor_penalty_rate": "Не применимо",
          "penalty_basis": "not_defined",
          "penalty_basis_display": "Не применимо",
          "client_penalty_present": "yes",
          "client_penalty_rate": "0,1% за каждый день просрочки",
          "penalty_cap_present": "not_defined",
          "penalty_cap_present_display": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 13.1",
              "quote": "Неустойка за просрочку выполнения работ Подрядчиком не предусмотрена."
            },
            {
              "clause_ref": "п. 13.2",
              "quote": "За просрочку оплаты Заказчик уплачивает пеню 0,1% в день."
            }
          ]
        }

        Пример 4 — данные отсутствуют:
        Фрагмент:
        "Стороны несут ответственность в соответствии с законодательством."
        Ответ:
        {
          "contractor_penalty_present": "not_defined",
          "contractor_penalty_rate": "Данные не определены",
          "penalty_basis": "not_defined",
          "penalty_basis_display": "Данные не определены",
          "client_penalty_present": "not_defined",
          "client_penalty_rate": "Данные не определены",
          "penalty_cap_present": "not_defined",
          "penalty_cap_present_display": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 13.1",
              "quote": "Стороны несут ответственность в соответствии с законодательством."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Разграничены ли неустойка подрядчика (за просрочку выполнения) и неустойка заказчика (за просрочку оплаты)?
        2. Корректно ли определён базис расчёта (цена договора / цена этапа / сумма просрочки / фиксированная сумма)?
        3. Есть ли cap на сумму неустойки?
        4. Не перепутана ли неустойка за просрочку со штрафом за расторжение (Check 13)?
        5. Не перепутана ли неустойка за просрочку с ответственностью за ошибки в ПД (Check 16)?
        6. Если неустойка подрядчика исключена (contractor_penalty_present = "no") — contractor_penalty_rate = "Не применимо"?
        7. Все ли 8 ключей присутствуют в JSON (6 основных + 2 display)?
        8. Совпадают ли enum-значения с их display-версиями согласно маппингу?
        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми ключами. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки:
        {
          "contractor_penalty_present": "<yes / no / not_defined>",
          "contractor_penalty_rate": "<ставка / 'Данные не определены' / 'Не применимо'>",
          "penalty_basis": "<contract_price / stage_price / overdue_amount / fixed_amount / not_specified / not_defined>",
          "penalty_basis_display": "<От цены договора / От цены этапа / От суммы просроченного платежа / Фиксированная сумма / Не указан / Данные не определены / Не применимо>",
          "client_penalty_present": "<yes / no / not_defined>",
          "client_penalty_rate": "<ставка / 'Данные не определены'>",
          "penalty_cap_present": "<yes / no / not_defined>",
          "penalty_cap_present_display": "<Да, лимит установлен / Нет, лимит не установлен / Данные не определены / Не применимо>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
