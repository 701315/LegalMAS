# ──────────────────────────────────────────────────────────────────────────
  - id: ip_rights_on_documentation
    name: "Интеллектуальные права на ПД (ст. 1296, 1298 ГК РФ)"
    description: >
      Фактографическая проверка условий передачи исключительных прав
      на проектную документацию: статус передачи, момент перехода,
      повторное использование и модификация проекта.
    triggers:
      any: ["ip_rights_transfer"]
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "исключительные права"
        - "интеллектуальные права"
        - "авторские права"
        - "передача прав"
        - "отчуждение исключительного права"
        - "лицензия на использование"
        - "право на использование"
        - "тиражирование"
        - "модификация проекта"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)исключительн(ые|ое|ых)\\s+прав"
        - "(?i)интеллектуальн(ые|ых)\\s+прав"
        - "(?i)передач(а|и)\\s+прав.*на.*документац"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор на выполнение проектных и изыскательских работ (ПИР)
        (§ 4 Главы 37 ГК РФ; ГК РФ ст. 1296, 1298).
        Проверяется только один вопрос: условия передачи исключительных
        (интеллектуальных) прав на проектную документацию.
        Нормативный ориентир:
        - ст. 1296 ГК РФ
        - ст. 1298 ГК РФ
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Если вопрос ИП не раскрыт, не применяй диспозитивные нормы ГК как факт.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Статус передачи исключительных прав.
        2. Момент перехода прав.
        3. Разрешено ли повторное использование проекта.
        4. Разрешена ли модификация проекта без согласия автора.

        [ПРАВИЛА]
        1. Только текст документа.
        2. Если условие не указано — "not_defined".
        3. Не путай полную передачу прав с лицензией.
        4. В evidence — только текст договора.
        5. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1:
        Фрагмент:
        "Исключительные права на проектную документацию переходят к Заказчику
        в полном объёме с момента подписания акта сдачи-приёмки и полной оплаты работ.
        Заказчик вправе использовать документацию повторно, вносить в неё изменения
        и передавать третьим лицам без согласия Подрядчика."
        Ответ:
        {
          "ip_transfer_status": "full_transfer",
          "ip_transfer_moment": "upon_acceptance",
          "reuse_allowed": "yes",
          "modification_allowed": "yes",
          "evidence": [
            {
              "clause_ref": "п. 9.1",
              "quote": "Исключительные права на проектную документацию переходят к Заказчику в полном объёме с момента подписания акта сдачи-приёмки."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Подрядчик передаёт Заказчику результаты работ в составе,
        предусмотренном договором."
        Ответ:
        {
          "ip_transfer_status": "not_defined",
          "ip_transfer_moment": "not_defined",
          "reuse_allowed": "not_defined",
          "modification_allowed": "not_defined",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Различены ли полная передача прав и лицензия?
        2. Определён ли момент перехода как отдельное условие?
        3. Разграничены ли повторное использование и модификация?
        4. Не приняты ли диспозитивные нормы ГК за факт из текста?
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "ip_transfer_status": "<full_transfer / license / retained_by_contractor / not_found>",
          "ip_transfer_moment": "<upon_payment / upon_signing / upon_acceptance / not_specified / not_found>",
          "reuse_allowed": "<yes / no / unclear / not_found>",
          "modification_allowed": "<yes / no / unclear / not_found>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 480
      retrieval:
        retrieval_profile: "ip_ownership_check"
        corpus_scope: "primary_segment"
        levels:
          - "legal_unit"
          - "section"
        required_kind: "legal_unit"
        retrieval_query: "исключительные права интеллектуальные права передача прав лицензия авторские права модификация повторное использование"
        preferred_unit_types:
          - obligation
          - general_provision
        excluded_unit_types:
          - definition
          - structural_anchor
          - technical_fragment
        preferred_clause_functions:
          - obligations
          - procedures
        negative_keywords:
          - "экспертиза"
          - "форс-мажор"
          - "неустойка"
          - "подсудность"
          - "означает"
          - "в целях настоящего"
        position_bias:
          preferred_range: [0.40, 0.90]
          boost: 0.12
          scope: segment
        context_k: 5
        max_chunks: 8
        rerank: true
        enrichment_hints:
          preferred_segment_types:
            - "contract"
            - "amendment"
          excluded_segment_types:
            - "technical_specification"
            - "price_list"
          preferred_clause_functions:
            - "obligations"
            - "procedures"
          confidence_bonus_on_match: 0.10
          confidence_penalty_on_excluded_segment: 0.12
      evidence:
        required: true
        min_snippet_length: 30
        max_snippet_length: 600
      extraction:
        enabled: true
        mode: "hybrid"
        compact_output: false
        llm_max_tokens: 550
        llm_prompt_extraction: |
          <role>
          Ты — российский юрист. Извлеки из договора ПИР сведения о передаче
          интеллектуальных прав на проектную документацию.
          Не анализируй цену, сроки или иные темы.
          </role>
          <context>
          {context}
          </context>
          <task>
          Заполни строго следующие поля:
          1. ip_transfer_status — статус передачи (full_transfer / license / retained_by_contractor / not_found).
          2. ip_transfer_moment — момент перехода (upon_payment / upon_signing / upon_acceptance / not_specified / not_found).
          3. reuse_allowed — повторное использование (yes / no / unclear / not_found).
          4. modification_allowed — модификация (yes / no / unclear / not_found).
          Если данные отсутствуют: "not_defined".
          </task>
          <rules>
          - Используй только текст договора.
          - Не применяй диспозитивные нормы ГК как факт.
          - Верни только JSON.
          </rules>
        fields:
          - name: "ip_transfer_status"
            type: "string"
            presentation: "signal"
            allowed_values: ["full_transfer", "license", "retained_by_contractor", "not_defined"]
            description: "Статус передачи исключительных прав на ПД."
            required: true
          - name: "ip_transfer_moment"
            type: "string"
            presentation: "signal"
            allowed_values: ["upon_payment", "upon_signing", "upon_acceptance", "not_defined", "not_defined"]
            description: "Момент перехода исключительных прав."
            required: false
          - name: "reuse_allowed"
            type: "string"
            presentation: "signal"
            allowed_values: ["yes", "no", "unclear", "not_defined"]
            description: "Разрешено ли повторное использование проекта заказчиком."
            required: false
          - name: "modification_allowed"
            type: "string"
            presentation: "signal"
            allowed_values: ["yes", "no", "unclear", "not_defined"]
            description: "Разрешена ли модификация проекта без согласия автора."
            required: false
    store_payload: true
# ──────────────────────────────────────────────────────────────────────────
# CHECK 16: Ответственность за ошибки в ПД (ст. 761 ГК РФ)
# ──────────────────────────────────────────────────────────────────────────
  - id: designer_liability_for_errors
    name: "Ответственность проектировщика за ошибки в ПД (ст. 761 ГК РФ)"
    description: >
      Фактографическая проверка ответственности проектировщика за ошибки
      в проектной документации: объём ответственности, лимит (cap),
      исключение косвенных убытков.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "ответственность за ошибки"
        - "ответственность за недостатки"
        - "недостатки документации"
        - "переделка"
        - "устранение дефектов"
        - "убытки вследствие ошибок"
        - "ст. 761"
        - "ответственность ограничена"
        - "совокупная ответственность"
        - "не превышает стоимости"
        - "косвенные убытки"
        - "упущенная выгода"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)ответственност.*за.*недостатк.*документац"
        - "(?i)возмест.*убытк.*вызванн.*ошибк"
        - "(?i)ст\\.?\\s*761"
        - "(?i)ответственност.*ограничен.*стоимост"
        - "(?i)совокупн.*ответственност.*не.*превыша"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор на выполнение проектных и изыскательских работ (ПИР)
        (§ 4 Главы 37 ГК РФ, ст. 761).
        Проверяется только один вопрос: ответственность проектировщика за ошибки
        в ПД, включая объём, лимит и исключение косвенных убытков.
        Нормативный ориентир:
        - ст. 761 ГК РФ
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Предусмотрена ли ответственность за ошибки в ПД.
        2. Объём ответственности.
        3. Наличие лимита (cap) совокупной ответственности.
        4. Размер лимита ответственности.
        5. Исключены ли косвенные убытки и упущенная выгода.

        [ПРАВИЛА]
        1. Только текст документа.
        2. Если условие не указано — "not_defined".
        3. Не путай ответственность за ошибки с неустойкой за просрочку.
        4. В evidence — только текст договора.
        5. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1:
        Фрагмент:
        "Подрядчик несёт ответственность за недостатки проектной документации,
        включая расходы на переделку строительных работ, вызванных такими недостатками.
        Совокупная ответственность Подрядчика не может превышать 100% цены договора.
        Косвенные убытки и упущенная выгода возмещению не подлежат."
        Ответ:
        {
          "liability_for_errors_present": "yes",
          "liability_scope": "includes_construction_rework",
          "liability_cap_present": "yes",
          "liability_cap_amount": "100% цены договора",
          "indirect_damages_excluded": "yes",
          "evidence": [
            {
              "clause_ref": "п. 10.1",
              "quote": "Подрядчик несёт ответственность за недостатки проектной документации, включая расходы на переделку строительных работ."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Стороны несут ответственность в соответствии с действующим законодательством."
        Ответ:
        {
          "liability_for_errors_present": "not_defined",
          "liability_scope": "not_defined",
          "liability_cap_present": "not_defined",
          "liability_cap_amount": "Данные не определены",
          "indirect_damages_excluded": "not_defined",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Разграничены ли ответственность за ошибки и неустойка за просрочку?
        2. Определён ли объём ответственности?
        3. Есть ли явный cap с суммой или формулой?
        4. Есть ли явное исключение косвенных убытков?
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "liability_for_errors_present": "<yes / no / not_found>",
          "liability_scope": "<documentation_only / includes_construction_rework / full_damages / not_specified / not_found>",
          "liability_cap_present": "<yes / no / not_found>",
          "liability_cap_amount": "<текст или 'Данные не определены'>",
          "indirect_damages_excluded": "<yes / no / not_found>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 540
      retrieval:
        retrieval_profile: "liability_cap_check"
        corpus_scope: "primary_segment"
        levels:
          - "legal_unit"
          - "section"
        required_kind: "legal_unit"
        retrieval_query: "ответственность проектировщика ответственность за ошибки недостатки документации убытки ст. 761 ограничение ответственности совокупная ответственность косвенные убытки"
        preferred_unit_types:
          - liability_provision
          - general_provision
        excluded_unit_types:
          - definition
          - structural_anchor
          - technical_fragment
        preferred_clause_functions:
          - limitations
          - remedies
        negative_keywords:
          - "экспертиза"
          - "форс-мажор"
          - "подсудность"
          - "аванс"
          - "означает"
          - "в целях настоящего"
        position_bias:
          preferred_range: [0.40, 0.90]
          boost: 0.15
          scope: segment
        context_k: 6
        max_chunks: 8
        rerank: true
        enrichment_hints:
          preferred_segment_types:
            - "contract"
            - "amendment"
          excluded_segment_types:
            - "technical_specification"
            - "price_list"
          preferred_clause_functions:
            - "limitations"
            - "remedies"
          confidence_bonus_on_match: 0.10
          confidence_penalty_on_excluded_segment: 0.12
      evidence:
        required: true
        min_snippet_length: 30
        max_snippet_length: 650
      extraction:
        enabled: true
        mode: "hybrid"
        compact_output: false
        llm_max_tokens: 700
        llm_prompt_extraction: |
          <role>
          Ты — российский юрист. Извлеки из договора ПИР сведения об ответственности
          проектировщика за ошибки в ПД: объём, лимит, исключение косвенных убытков.
          Не анализируй неустойку за просрочку, форс-мажор или иные темы.
          </role>
          <context>
          {context}
          </context>
          <task>
          Заполни строго следующие поля:
          1. liability_for_errors_present — предусмотрена ли ответственность (yes / no / not_found).
          2. liability_scope — объём (documentation_only / includes_construction_rework / full_damages / not_specified / not_found).
          3. liability_cap_present — наличие лимита (yes / no / not_found).
          4. liability_cap_amount — размер лимита.
          5. indirect_damages_excluded — исключение косвенных убытков (yes / no / not_found).
          Если данные отсутствуют: "not_defined" или "Данные не определены".
          </task>
          <rules>
          - Используй только текст договора.
          - Не путай cap с размером страхового покрытия.
          - Верни только JSON.
          </rules>
        fields:
          - name: "liability_for_errors_present"
            type: "string"
            presentation: "signal"
            allowed_values: ["yes", "no", "not_defined"]
            description: "Предусмотрена ли ответственность за ошибки в ПД."
            required: true
          - name: "liability_scope"
            type: "string"
            presentation: "signal"
            allowed_values: ["documentation_only", "includes_construction_rework", "full_damages", "not_defined", "not_defined"]
            description: "Объём ответственности проектировщика."
            required: false
          - name: "liability_cap_present"
            type: "string"
            presentation: "signal"
            allowed_values: ["yes", "no", "not_defined"]
            description: "Установлен ли лимит совокупной ответственности."
            required: false
          - name: "liability_cap_amount"
            type: "string"
            presentation: "fact"
            label: "Размер лимита"
            description: "Размер лимита ответственности."
            required: false
            display_in_grid: true
            display_priority: 1
          - name: "indirect_damages_excluded"
            type: "string"
            presentation: "signal"
            allowed_values: ["yes", "no", "not_defined"]
            description: "Исключены ли косвенные убытки и упущенная выгода."
            required: false
    store_payload: true
# ──────────────────────────────────────────────────────────────────────────
# CHECK 17: Разграничение ответственности проектировщика и строителя
# ──────────────────────────────────────────────────────────────────────────
  - id: designer_vs_builder_liability
    name: "Разграничение ответственности проектировщика и строителя"
    description: >
      Фактографическая проверка наличия условия о разграничении ответственности
      проектировщика и строительного подрядчика за дефекты, а также выделения
      авторского надзора как отдельной услуги.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "ответственность ограничивается качеством документации"
        - "не несет ответственности за действия строителей"
        - "отклонения от проекта без согласования"
        - "авторский надзор"
        - "реализация проекта строителями"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)не\\s+отвеча(ет|ть)\\s+за.*реализац.*строител"
        - "(?i)ответственност.*ограничива(ется|ясь).*качеств.*документац"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор на выполнение проектных и изыскательских работ (ПИР)
        (§ 4 Главы 37 ГК РФ, ст. 761).
        Проверяется только один вопрос: разграничение ответственности
        проектировщика и строительного подрядчика.
        Нормативный ориентир:
        - ст. 761 ГК РФ
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Предусмотрено ли разграничение ответственности.
        2. Scope ответственности проектировщика.
        3. Является ли авторский надзор отдельной услугой/договором.

        [ПРАВИЛА]
        1. Только текст документа.
        2. Если условие не указано — "not_defined".
        3. Не путай авторский надзор с техническим надзором заказчика.
        4. В evidence — только текст договора.
        5. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1:
        Фрагмент:
        "Ответственность Подрядчика ограничивается качеством
        проектной документации. Подрядчик не несёт ответственности
        за отклонения от проекта, допущенные строительным подрядчиком
        без письменного согласования. Авторский надзор осуществляется
        по отдельному договору."
        Ответ:
        {
          "delimitation_present": "yes",
          "designer_scope": "documentation_quality_only",
          "author_supervision_separate": "yes",
          "evidence": [
            {
              "clause_ref": "п. 10.3",
              "quote": "Ответственность Подрядчика ограничивается качеством проектной документации."
            }
          ]
        }

        Пример 2:
        Фрагмент:
