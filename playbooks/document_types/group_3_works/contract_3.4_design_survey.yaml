        allowed_values:
          - "defined"
          - "not_defined"
          - "not_found"
        description: "Установлен ли порядок оплаты фактически выполненной части работ."
        required: false
      - name: "documentation_return"
        type: "string"
        label: "Возврат документации"
        presentation: "badge"
        display_in_grid: false
        display_priority: 4
        allowed_values:
          - "defined"
          - "not_defined"
          - "not_found"
        description: "Урегулирован ли возврат/передача документации при расторжении."
        required: false
      - name: "termination_penalty_present"
        type: "string"
        label: "Штраф за расторжение"
        presentation: "badge"
        display_in_grid: true
        display_priority: 3
