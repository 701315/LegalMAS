      }

      [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
      1. Есть ли в тексте именно перечень документов, а не общее упоминание исходных данных?
      2. Указан ли срок предоставления в днях, датой или через событие?
      3. Есть ли прямое последствие задержки, а не общее правило о просрочке?
      4. Есть ли явная оговорка о достоверности данных?
      5. Все ли значения enum соответствуют schema?

      [ФОРМАТ ОТВЕТА]
      Верни строго JSON:
      {
        "initial_data_list_present": "<yes / no / not_found>",
        "initial_data_deadlines": "<specified / not_specified / not_found>",
        "delay_consequences": "<deadline_extension / rework_at_client_cost / termination_right / not_specified / not_found>",
        "data_accuracy_disclaimer": "<yes / no / not_found>",
        "evidence": ["<цитата 1>", "<цитата 2>"]
      }
    prompt_file: null
