    confidence_bonus_on_match: 0.1
    confidence_penalty_on_excluded_segment: 0.12
  evidence:
    required: true
    min_snippet_length: 40
    max_snippet_length: 700
  extraction:
    enabled: true
    mode: hybrid
    store_payload: true
    llm_max_tokens: 700
    compact_output: false
    llm_prompt_extraction: "<role>\nТы — юрист, извлекающий сведения об ответственности проектировщика\nза ошибки в ПД в договоре ПИР. Не оценивай риски.\nТолько заполняй поля строго по тексту.\n</role>\n\n<context>\n{context}\n</context>\n\n<task>\nЗаполни строго следующие поля:\n\nliability_for_errors_present — предусмотрена ли ответственность за ошибки\n  (allowed: yes / no / not_found).\n\nliability_scope — объём ответственности проектировщика\n  (allowed: documentation_only / includes_construction_rework /\n  full_damages / not_specified / not_found).\n\nliability_cap_present — наличие лимита совокупной ответственности\n  (allowed: yes / no / not_found).\n\nliability_cap_amount — размер лимита ответственности\n  (текстовое значение, например \"100% цены договора\", или not_found).\n\nindirect_damages_excluded — исключены ли косвенные убытки и упущенная выгода\n  (allowed: yes / no / not_found).\n\nЕсли данные отсутствуют: указывай \"not_found\".\n</task>\n\n<rules>\n1. liability_for_errors_present:\
      \ \"yes\" — ответственность прямо предусмотрена;\n   \"no\" — тема раскрыта, но ответственность исключена;\n   \"not_found\" — тема отсутствует.\n2. liability_scope: \"documentation_only\" — только переделка ПД;\n   \"includes_construction_rework\" — включая переделку СМР;\n   \"full_damages\" — полные убытки; \"not_specified\" — объём неясен;\n   \"not_found\" — тема отсутствует.\n3. liability_cap_present: \"yes\" — cap установлен; \"no\" — тема раскрыта,\n   но cap нет; \"not_found\" — тема отсутствует.\n4. liability_cap_amount: сумма, процент или формула; или \"not_found\".\n5. indirect_damages_excluded: \"yes\" — исключены; \"no\" — не исключены;\n   \"not_found\" — тема отсутствует.\n6. Не добавляй ключи, не входящие в список полей.\n7. Верни только JSON.\n</rules>\n"
    fields:
    - name: liability_for_errors_present
      type: string
      label: Ответственность за ошибки
