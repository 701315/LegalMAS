        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Извлечена ли именно общая цена договора, а не аванс, штраф или неустойка?
        2. Если цена определяется по приложению/смете — это отражено как "defined" с указанием ссылки?
        3. Корректно ли нормализован тип цены (fixed / approximate / sbc / percentage / cost_plus)?
        4. Не перепутан ли НДС с общими налоговыми оговорками?
        5. Все ли 7 ключей присутствуют в JSON (5 основных + 2 display)?
        6. Совпадают ли enum-значения с их display-версиями согласно маппингу?
        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми ключами. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки:
        {
          "price_amount_status": "<defined / not_defined>",
          "price_amount_value": "<сумма / ссылка на документ / 'Данные не определены'>",
          "price_type": "<fixed / approximate / cost_plus / percentage / sbc / not_defined>",
          "price_type_display": "<Твёрдая цена / Приблизительная цена / По фактическим затратам / Процент от стоимости строительства (СМР) / По Справочнику базовых цен (СБЦ) / Данные не определены>",
          "price_includes_vat": "<yes / no / not_applicable / unclear / not_defined>",
          "price_includes_vat_display": "<Да, НДС включён / Нет, НДС не включён / Не применимо / Не удалось определить / Данные не определены>",
          "calculation_basis": "<текст / 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 540
    retrieval:
      retrieval_profile: "payment_terms_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "цена стоимость вознаграждение смета СБЦ справочник базовых цен твёрдая цена приблизительная цена процент от стоимости строительства НДС основание расчёта приложение"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
      negative_keywords:
        - "аванс"
        - "неустойка"
        - "штраф"
        - "экспертиза"
        - "означает"
