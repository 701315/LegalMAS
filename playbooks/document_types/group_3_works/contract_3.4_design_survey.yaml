      llm_max_tokens: 550
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора ПИР сведения о страховании
        профессиональной ответственности проектировщика: наличие требования,
        минимальная сумма покрытия, обязанность поддерживать страхование,
        обязанность предоставить копию полиса.
        Не анализируй членство в СРО (Check 22), лимит ответственности (cap, Check 16),
        экспертизу или иные темы.
        Не путай страхование профессиональной ответственности с членством в СРО.
        Не путай страхование с лимитом ответственности (cap).
        </role>
        <context>
        {context}
        </context>
        <task>
        Заполни строго следующие 7 полей (плюс evidence):
        1. insurance_required — предусмотрено ли страхование: yes / no / not_defined.
        2. insurance_required_display — человеко-читаемое значение: "Да, страхование предусмотрено" / "Нет, страхование не предусмотрено" / "Данные не определены".
        3. min_coverage_amount — минимальная сумма страхового покрытия (текст) или "Данные не определены" или "Не применимо".
        4. maintenance_obligation — обязанность поддерживать страхование: yes / no / not_defined.
        5. maintenance_obligation_display — человеко-читаемое значение: "Да, обязан поддерживать" / "Нет, не обязан" / "Данные не определены" / "Не применимо".
        6. policy_copy_required — обязанность предоставить копию полиса: yes / no / not_defined.
        7. policy_copy_required_display — человеко-читаемое значение: "Да, обязан предоставить копию" / "Нет, не обязан" / "Данные не определены" / "Не применимо".

        Маппинг enum → display:
        - insurance_required: yes → "Да, страхование предусмотрено", no → "Нет, страхование не предусмотрено", not_defined → "Данные не определены"
        - maintenance_obligation: yes → "Да, обязан поддерживать", no → "Нет, не обязан", not_defined → "Данные не определены" или "Не применимо"
        - policy_copy_required: yes → "Да, обязан предоставить копию", no → "Нет, не обязан", not_defined → "Данные не определены" или "Не применимо"

        Критическое правило:
        - Если insurance_required = "no" (страхование прямо исключено), то min_coverage_amount = "Не применимо", maintenance_obligation = "not_defined", display = "Не применимо", policy_copy_required = "not_defined", display = "Не применимо".
        - Если insurance_required = "not_defined" (условие не упоминается), то min_coverage_amount = "Данные не определены", остальные поля = "not_defined", display = "Данные не определены".
        </task>
        <context_rules>
        - Используй только текст договора. Не выдумывай суммы покрытия, условия или сроки — извлекай строго из переданного фрагмента.
        - Не опирайся на внешние знания о типовых условиях договоров ПИР.
        - Не путай страхование профессиональной ответственности с членством в СРО (Check 22) — это разные институты.
        - Не путай страхование с лимитом ответственности (cap, Check 16) — страхование это внешний механизм через страховую компанию, cap — внутреннее ограничение.
        - Не путай страхование профессиональной ответственности с иными видами страхования (ОСАГО, страхование имущества).
        - Верни строго валидный JSON. Все 7 ключей + evidence обязаны присутствовать.
        - Запрещены: null, None, пустые строки "". Для текстовых полей при отсутствии данных — "Данные не определены".
        - Убедись, что enum-значения соответствуют их display-версиям согласно маппингу выше.
        - Различай "no" (условие прямо исключено) и "not_defined" (условие вообще не упоминается).
        - Извлекай сумму покрытия дословно из текста (например, "5 000 000 рублей").
        </context_rules>

        <output_expectations>
        - Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        - Не используй markdown fences.
        - Не добавляй пояснения до или после JSON.
        - Верни все ключи, перечисленные в task, без пропусков.
        - Не используй null, None или пустые строки.
        - Для статусных полей используй только значения из allowed_values или "not_defined".
        - Для текстовых полей при отсутствии данных используй "Данные не определены" / "Не удалось определить" / "Не применимо" — согласно правилам выше.
        </output_expectations>
      fields:
        - name: "insurance_required"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Предусмотрено ли страхование профессиональной ответственности подрядчика (enum)."
          required: true
          display_in_grid: false
        - name: "insurance_required_display"
