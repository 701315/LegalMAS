  - id: performance_deadlines_milestones
    name: "Сроки выполнения и этапы (ст. 708, 760 ГК РФ)"
    description: >
      Фактографическая проверка сроков начала и окончания работ,
      календарного плана, промежуточных этапов и определённости сроков.
    triggers: {}
    ui_mode: "field_extraction"
