        {
          "contractor_penalty_present": "<yes / no / not_found>",
          "contractor_penalty_rate": "<текст или 'Данные не определены'>",
          "penalty_basis": "<contract_price / stage_price / overdue_amount / fixed_amount / not_specified / not_found>",
          "client_penalty_present": "<yes / no / not_found>",
          "client_penalty_rate": "<текст или 'Данные не определены'>",
