          display_priority: 3
        - name: "client_penalty_present"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Предусмотрена ли встречная неустойка для заказчика за просрочку оплаты (enum)."
          required: true
          display_in_grid: false
        - name: "client_penalty_rate"
          type: "string"
          presentation: "fact"
          label: "Ставка неустойки заказчика"
          description: "Размер/ставка встречной неустойки заказчика за просрочку оплаты."
          required: false
          display_in_grid: true
          display_priority: 2
        - name: "penalty_cap_present"
          type: "string"
