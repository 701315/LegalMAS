- id: external_approvals_coordination
  name: Согласования с ресурсоснабжающими организациями и органами (ст. 48 ГрК РФ)
  description: 'Проверяет наличие условий о получении и согласовании технических условий (ТУ)

    на подключение к сетям, согласовании с ГИБДД, пожарным надзором, органами охраны

    ОКН, Роспотребнадзором. Кто получает ТУ, кто несёт расходы, кто отвечает

    за задержки при согласовании.

    '
  triggers: null
  ui_mode: field_extraction
  severity: high
  severity_if_pass: pass
  severity_if_fail: high
  severity_if_unclear: high
  origin: DOCUMENT_TYPE
  detector_type: hybrid
  rules:
