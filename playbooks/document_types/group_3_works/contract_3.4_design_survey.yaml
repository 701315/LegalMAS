      description: Период форс-мажора, после которого допускается расторжение.
      max_value_chars: 100
      required: false
- id: dispute_resolution_and_pretension
  name: Претензионный порядок и подсудность (ст. 452 ГК РФ, АПК РФ)
  description: 'Проверяет наличие обязательного претензионного порядка урегулирования споров,

    сроков направления и рассмотрения претензии, подсудности или арбитражной оговорки.

    Без претензионного порядка иск может быть возвращён судом.

    '
  legal_base: ст. 452 ГК РФ, АПК РФ
  triggers: null
  ui_mode: field_extraction
  severity: high
  severity_if_pass: pass
  severity_if_fail: high
  severity_if_unclear: high
  origin: DOCUMENT_TYPE
  detector_type: hybrid
  rules:
    keywords:
    - претензия
    - претензионный порядок
    - досудебное урегулирование
    - срок рассмотрения претензии
    - подсудность
    - арбитражная оговорка
    - медиация
    keyword_mode: any
    regex_patterns:
    - (?i)претензионн(ый|ого)\s+порядк
    - (?i)досудебн(ое|ого)\s+урегулирован
  llm:
    prompt_template: "[КОНТЕКСТ]\nТы — юрист, анализирующий договор ПИР.\nПроверяется только один вопрос: наличие и содержание претензионного\nпорядка урегулирования споров.\n\nВажно:\n— Анализируй только положения о претензиях, спорах.\n— Не оценивай риск и не смешивай с разделом об ответственности.\n— Если условие не установлено прямо, не домысливай.\n\n[ЗАДАЧА]\n1. Установить, предусмотрен ли обязательный претензионный порядок.\n2. Извлечь срок направления претензии.\n3. Извлечь срок рассмотрения претензии.\n4. Извлечь наименование конкретного суда или арбитража.\n\n[ПРАВИЛА]\n1. pretension_procedure_present = \"yes\" — если обязательный претензионный\n   порядок прямо установлен (обязанность направить претензию до суда);\n   \"not_found\" — если раздел о претензиях отсутствует.\n2. pretension_sending_period — срок направления претензии\n   с момента нарушения (текст); если не указан — \"not_found\".\n3. pretension_review_period — срок рассмотрения претензии\n   получателем (текст); если\
      \ не указан — \"not_found\".\n4. Не путай раздел о спорах с разделом об ответственности.\n5. Не путай претензионный порядок с порядком замечаний по приёмке.\n\n[ПРИМЕРЫ (FEW-SHOT)]\nПример 1 — претензионный порядок установлен:\nТекст: «Стороны обязуются принять все меры к урегулированию споров\nпутём переговоров. Сторона, считающая свои права нарушенными,\nнаправляет другой стороне письменную претензию. Срок рассмотрения\nпретензии — 30 календарных дней.»\n\nОтвет:\n{\n  \"pretension_procedure_present\": \"yes\",\n  \"pretension_sending_period\": \"not_found\",\n  \"pretension_review_period\": \"30 календарных дней\",\n  \"evidence\": [\n    \"Сторона, считающая свои права нарушенными, направляет другой стороне письменную претензию.\",\n    \"Срок рассмотрения претензии — 30 календарных дней.\"\n  ]\n}\n\nПример 2 — раздел о спорах отсутствует:\nТекст: «Все спорные вопросы решаются в соответствии с законодательством РФ.»\n\nОтвет:\n{\n  \"pretension_procedure_present\": \"not_found\"\
      ,\n  \"pretension_sending_period\": \"not_found\",\n  \"pretension_review_period\": \"not_found\",\n  \"evidence\": [\n    \"Все спорные вопросы решаются в соответствии с законодательством РФ.\"\n  ]\n}\n\n[ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]\n1. Есть ли в тексте явная обязанность направить претензию до суда?\n2. Указан ли срок рассмотрения претензии в днях?\n3. Назван ли конкретный суд или арбитраж?\n4. Не спутан ли раздел о спорах с разделом об ответственности?\n5. Все ли значения enum соответствуют schema?\n\n[ФОРМАТ ОТВЕТА]\nВерни строго JSON:\n{\n  \"pretension_procedure_present\": \"<yes / not_found>\",\n  \"pretension_sending_period\": \"<текст или not_found>\",\n  \"pretension_review_period\": \"<текст или not_found>\",\n  \"evidence\": [\"<цитата 1>\", \"<цитата 2>\"]\n}\n"
    prompt_file: null
    context_k: 5
    temperature: 0.0
    max_tokens: 460
  retrieval:
    corpus_scope: document
    context_k: 5
    max_chunks: 8
    retrieval_profile: dispute_resolution_check
    boost_keywords:
    - претензия
    - претензионный порядок
    - досудебное урегулирование
    - подсудность
    negative_keywords:
    - акт
    - смета
    - техническое задание
    - неустойка
    rerank: true
    filters: {}
  enrichment_hints:
    preferred_segment_types:
    - clause
    - article
    excluded_segment_types:
    - signature_block
    preferred_clause_functions:
    - dispute_resolution
    - procedures
    confidence_bonus_on_match: 0.1
    confidence_penalty_on_excluded_segment: 0.12
  evidence:
    required: true
    min_snippet_length: 40
    max_snippet_length: 600
  extraction:
    enabled: true
    mode: hybrid
    store_payload: true
    llm_max_tokens: 450
    compact_output: false
    llm_prompt_extraction: "<role>\nТы — юрист, извлекающий сведения о претензионном порядке\nи подсудности в договоре ПИР. Не оценивай риски.\nТолько заполняй поля строго по тексту.\n</role>\n\n<context>\n{context}\n</context>\n\n<task>\nЗаполни строго следующие поля:\n\npretension_procedure_present — предусмотрен ли обязательный претензионный порядок\n  (allowed: yes / not_found).\n\npretension_sending_period — срок направления претензии\n  (текстовое значение или not_found).\n\npretension_review_period — срок рассмотрения претензии\n  (текстовое значение или not_found).\n\nЕсли данные отсутствуют: указывай \"not_found\".\n</task>\n\n<rules>\n1. pretension_procedure_present: \"yes\" — обязанность направить претензию\n   прямо установлена; \"not_found\" — раздел отсутствует.\n2. pretension_sending_period: текст с указанием срока; или \"not_found\".\n3. pretension_review_period: текст с указанием срока; или \"not_found\".\n4. Не добавляй ключи, не входящие в список полей.\n5. Верни только\
      \ JSON.\n</rules>\n"
    fields:
    - name: pretension_procedure_present
      type: string
      label: Претензионный порядок
      presentation: badge
      display_in_grid: true
      display_priority: 1
      allowed_values:
      - 'yes'
      - not_found
      description: Предусмотрен ли обязательный претензионный порядок.
      required: true
    - name: pretension_sending_period
      type: string
      label: Срок направления претензии
      presentation: text
      display_in_grid: false
      display_priority: 4
      description: Срок направления претензии с момента нарушения.
      max_value_chars: 100
      required: false
    - name: pretension_review_period
      type: string
      label: Срок рассмотрения претензии
      presentation: text
      display_in_grid: true
      display_priority: 2
      description: Срок рассмотрения претензии другой стороной.
      max_value_chars: 100
      required: false
- id: documentation_delivery_format
  name: Формат и количество экземпляров передаваемой документации
  description: 'Проверяет наличие условий о формате (бумажный/электронный),

    количестве экземпляров, формате файлов (DWG, PDF, IFC).

    '
  legal_base: ГК РФ (общие положения), ПП РФ № 87
  triggers: null
  ui_mode: field_extraction
  severity: high
  severity_if_pass: pass
  severity_if_fail: high
  severity_if_unclear: high
  origin: DOCUMENT_TYPE
  detector_type: hybrid
  rules:
    keywords:
    - экземпляр
    - комплект документации
    - бумажный носитель
    - электронный вид
    - формат DWG
    - формат PDF
    - формат IFC
    - электронная версия
    - количество копий
    - CD
    - DVD
    - flash-накопитель
    keyword_mode: any
    regex_patterns:
    - (?i)\d+\s*(экземпляр|комплект)
    - (?i)(бумажн|электронн)(ый|ом|ой)\s+(носител|вид|версии|формат)
  llm:
    prompt_template: "[КОНТЕКСТ]\nТы — юрист, анализирующий договор ПИР.\nПроверяется только один вопрос: в каком формате и количестве\nэкземпляров передаётся проектная документация заказчику.\n\nВажно:\n— Анализируй только положения о формате передачи, количестве экземпляров\n  и форматах электронных файлов.\n— Не оценивай риск и не смешивай с порядком приёмки.\n— Если условие не установлено прямо, не домысливай.\n\n[ЗАДАЧА]\n1. Установить, предусмотрена ли передача на бумажном носителе.\n2. Извлечь количество бумажных экземпляров.\n3. Установить, предусмотрена ли передача в электронном виде.\n4. Извлечь формат электронных файлов.\n5. Установить, предусмотрена ли передача на физическом носителе (CD/DVD/flash).\n\n[ПРАВИЛА]\n1. paper_delivery = \"yes\" — бумажная передача предусмотрена;\n   \"no\" — тема раскрыта, но бумажная передача не предусмотрена;\n   \"not_found\" — тема отсутствует.\n2. paper_copies_count — количество экземпляров (число);\n   если не указано — null.\n3. electronic_delivery\
      \ = \"yes\" — электронная передача предусмотрена;\n   \"no\" — тема раскрыта, но нет; \"not_found\" — тема отсутствует.\n4. electronic_format — перечень форматов (текст, например \"DWG, PDF\");\n   если не указан — \"not_found\".\n5. physical_media = \"yes\" — передача на CD/DVD/flash предусмотрена;\n   \"no\" — тема раскрыта, но нет; \"not_found\" — тема отсутствует.\n6. Не путай формат передачи с порядком приёмки.\n7. Если тема не затронута — все = \"not_found\".\n\n[ПРИМЕРЫ (FEW-SHOT)]\nПример 1 — формат определён:\nТекст: «Документация передаётся в 4 экземплярах на бумажном носителе\nи в электронном виде на flash-накопителе в форматах DWG и PDF.»\n\nОтвет:\n{\n  \"paper_delivery\": \"yes\",\n  \"paper_copies_count\": 4,\n  \"electronic_delivery\": \"yes\",\n  \"electronic_format\": \"DWG, PDF\",\n  \"physical_media\": \"yes\",\n  \"evidence\": [\n    \"Документация передаётся в 4 экземплярах на бумажном носителе и в электронном виде на flash-накопителе в форматах DWG и PDF.\"\n\
      \  ]\n}\n\nПример 2 — тема не раскрыта:\nТекст: «Результаты работ передаются Заказчику.»\n\nОтвет:\n{\n  \"paper_delivery\": \"not_found\",\n  \"paper_copies_count\": null,\n  \"electronic_delivery\": \"not_found\",\n  \"electronic_format\": \"not_found\",\n  \"physical_media\": \"not_found\",\n  \"evidence\": [\n    \"Результаты работ передаются Заказчику.\"\n  ]\n}\n\n[ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]\n1. Разграничены ли бумажная и электронная передача?\n2. Извлечено ли конкретное количество экземпляров?\n3. Извлечены ли конкретные форматы файлов?\n4. Есть ли указание на физический носитель?\n5. Все ли ключи JSON совпадают со schema?\n\n[ФОРМАТ ОТВЕТА]\nВерни строго JSON:\n{\n  \"paper_delivery\": \"<yes / no / not_found>\",\n  \"paper_copies_count\": \"<число или null>\",\n  \"electronic_delivery\": \"<yes / no / not_found>\",\n  \"electronic_format\": \"<текст или not_found>\",\n  \"physical_media\": \"<yes / no / not_found>\",\n  \"evidence\": [\"<цитата 1>\"]\n}\n"
    prompt_file: null
    context_k: 5
    temperature: 0.0
    max_tokens: 440
  retrieval:
    retrieval_profile: technical_documentation_check
    corpus_scope: document
    context_k: 5
    max_chunks: 6
    boost_keywords:
    - экземпляр
    - бумажный носитель
    - электронный вид
    - DWG
    - PDF
    - формат
    negative_keywords:
    - экспертиза
    - форс-мажор
    - подсудность
    - неустойка
    rerank: true
    filters: {}
  enrichment_hints:
    preferred_segment_types:
    - clause
    - article
    excluded_segment_types:
    - signature_block
    preferred_clause_functions:
    - procedures
    - procedures
    confidence_bonus_on_match: 0.1
    confidence_penalty_on_excluded_segment: 0.12
  evidence:
    required: true
    min_snippet_length: 30
    max_snippet_length: 500
  extraction:
    enabled: true
    mode: hybrid
    store_payload: true
    llm_max_tokens: 700
    compact_output: false
    llm_prompt_extraction: "<role>\nТы — юрист, извлекающий сведения о формате передачи документации\nв договоре ПИР. Не оценивай риски. Только заполняй поля строго по тексту.\n</role>\n\n<context>\n{context}\n</context>\n\n<task>\nЗаполни строго следующие поля:\n\npaper_delivery — предусмотрена ли передача на бумаге\n  (allowed: yes / no / not_found).\n\npaper_copies_count — количество бумажных экземпляров\n  (число или null).\n\nelectronic_delivery — предусмотрена ли электронная передача\n  (allowed: yes / no / not_found).\n\nelectronic_format — форматы электронных файлов\n  (текстовое значение или not_found).\n\nphysical_media — передача на физическом носителе (CD/DVD/flash)\n  (allowed: yes / no / not_found).\n\nЕсли данные отсутствуют: указывай \"not_found\" или null.\n</task>\n\n<rules>\n1. paper_delivery: \"yes\" — бумажная передача есть; \"no\" — нет;\n   \"not_found\" — тема отсутствует.\n2. paper_copies_count: число; или null.\n3. electronic_delivery: \"yes\" — электронная передача\
      \ есть;\n   \"no\" — нет; \"not_found\" — тема отсутствует.\n4. electronic_format: текст, например \"DWG, PDF, IFC\"; или \"not_found\".\n5. physical_media: \"yes\" — CD/DVD/flash предусмотрен;\n   \"no\" — нет; \"not_found\" — тема отсутствует.\n6. Не добавляй ключи, не входящие в список полей.\n7. Верни только JSON.\n</rules>\n"
    fields:
    - name: paper_delivery
      type: string
      label: Бумажная передача
      presentation: badge
      display_in_grid: true
      display_priority: 1
      allowed_values:
      - 'yes'
      - 'no'
      - not_found
      description: Предусмотрена ли передача на бумажном носителе.
      required: true
    - name: paper_copies_count
      type: number
      label: Количество экземпляров
      presentation: number
      display_in_grid: true
      display_priority: 2
      description: Количество бумажных экземпляров документации.
      required: false
    - name: electronic_delivery
      type: string
      label: Электронная передача
      presentation: badge
      display_in_grid: true
      display_priority: 3
      allowed_values:
      - 'yes'
      - 'no'
      - not_found
      description: Предусмотрена ли передача в электронном виде.
      required: false
    - name: electronic_format
      type: string
      label: Формат файлов
      presentation: text
      display_in_grid: false
      display_priority: 4
      description: Форматы электронных файлов (DWG, PDF, IFC и т.п.).
      max_value_chars: 150
      required: false
    - name: physical_media
      type: string
      label: Физический носитель
      presentation: badge
      display_in_grid: false
      display_priority: 5
      allowed_values:
      - 'yes'
      - 'no'
      - not_found
      description: Предусмотрена ли передача на CD/DVD/flash.
      required: false
