        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли именно процедура дополнительных работ (не изменение ТЗ без объема)?
        2. Определено ли, кто вправе инициировать доп. работы?
        3. Определена ли форма согласования (доп. соглашение / письменный запрос)?
