- id: auto_deadline_extension
  name: Автопродление сроков при задержке согласования заказчиком (ст. 328, 719 ГК РФ)
  description: Проверяет наличие условия о продлении сроков при задержке со стороны заказчика
  legal_base: ст. 328, 719 ГК РФ
  triggers: null
  ui_mode: field_extraction
  severity: high
  severity_if_pass: pass
  severity_if_fail: high
  severity_if_unclear: high
  origin: DOCUMENT_TYPE
  detector_type: hybrid
  rules:
    keywords:
    - продление сроков
    - автоматическое продление
    - задержка согласования
    - время рассмотрения не включается
    - обязанность предоставить замечания в течение
    - просрочка заказчика
    - встречное исполнение
    keyword_mode: any
    regex_patterns:
    - (?i)срок.*продлева(ется|ться).*на.*срок.*задержк
    - (?i)не\s+включа(ется|ться)\s+в\s+срок\s+выполнени
  llm:
    prompt_template: "[КОНТЕКСТ]\nТы — юрист, анализирующий договор ПИР.\nПроверяется только один вопрос: продлеваются ли сроки выполнения работ\nпри задержке со стороны заказчика и как именно работает такой механизм.\n\nВажно:\n— Анализируй только положения о продлении сроков, задержке согласования,\n  задержке предоставления замечаний или иных действиях заказчика.\n— Не оценивай риск и не смешивай это условие с форс-мажором.\n— Если порядок продления не установлен прямо, не домысливай его.\n\n[ЗАДАЧА]\n1. Установить, предусмотрено ли продление сроков при задержке заказчика.\n2. Определить триггер такого продления.\n3. Определить механизм продления.\n4. Определить правило расчёта продолжительности продления.\n5. Установить, есть ли право подрядчика приостановить работы.\n\n[ПРАВИЛА]\n1. auto_extension_present = \"yes\" — если договор прямо предусматривает\n   продление сроков при задержке действий заказчика; \"no\" — если тема есть,\n   но продление прямо исключено или не предусмотрено;\
      \ \"not_found\" — тема отсутствует.\n2. extension_trigger = \"approval_delay\" — задержка согласования результатов;\n   \"review_delay\" — просрочка рассмотрения/замечаний/ответа;\n   \"mixed\" — несколько триггеров; \"not_specified\" — продление есть,\n   но триггер не конкретизирован; \"not_found\" — тема отсутствует.\n3. extension_mode = \"automatic\" — срок продлевается автоматически;\n   \"notice_based\" — после уведомления подрядчика;\n   \"by_addendum\" — только по допсоглашению;\n   \"not_specified\" — механизм неясен; \"not_found\" — тема отсутствует.\n4. extension_duration_rule = \"equal_delay\" — продление на период задержки;\n   \"fixed_days\" — фиксированное число дней; \"not_specified\" — продление есть,\n   но правило неясно; \"not_found\" — тема отсутствует.\n5. suspension_right = \"yes\" — есть право приостановить работы;\n   \"no\" — тема раскрыта, но такого права нет; \"not_found\" — тема отсутствует.\n6. Не путай задержку заказчика с задержкой экспертизы третьими\
      \ лицами.\n7. Не извлекай общие положения о форс-мажоре как продление по вине заказчика.\n\n[ПРИМЕРЫ (FEW-SHOT)]\nПример 1 — продление предусмотрено:\nТекст: «В случае несвоевременного согласования Заказчиком промежуточных результатов\nсрок выполнения работ автоматически продлевается на период такой задержки.\nПодрядчик вправе приостановить работы до получения согласования.»\n\nОтвет:\n{\n  \"auto_extension_present\": \"yes\",\n  \"extension_trigger\": \"approval_delay\",\n  \"extension_mode\": \"automatic\",\n  \"extension_duration_rule\": \"equal_delay\",\n  \"suspension_right\": \"yes\",\n  \"evidence\": [\n    \"В случае несвоевременного согласования Заказчиком промежуточных результатов срок выполнения работ автоматически продлевается на период такой задержки.\",\n    \"Подрядчик вправе приостановить работы до получения согласования.\"\n  ]\n}\n\nПример 2 — тема не раскрыта:\nТекст: «Подрядчик обязан выполнить работы в установленный срок.»\n\nОтвет:\n{\n  \"auto_extension_present\"\
      : \"not_found\",\n  \"extension_trigger\": \"not_found\",\n  \"extension_mode\": \"not_found\",\n  \"extension_duration_rule\": \"not_found\",\n  \"suspension_right\": \"not_found\",\n  \"evidence\": []\n}\n\n[ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]\n1. Есть ли именно задержка со стороны заказчика, а не иного лица?\n2. Определён ли триггер продления отдельно от механизма продления?\n3. Есть ли правило расчёта периода продления?\n4. Есть ли отдельное право на приостановление работ?\n5. Все ли значения enum соответствуют schema?\n\n[ФОРМАТ ОТВЕТА]\nВерни строго JSON:\n{\n  \"auto_extension_present\": \"<yes / no / not_found>\",\n  \"extension_trigger\": \"<approval_delay / review_delay / mixed / not_specified / not_found>\",\n  \"extension_mode\": \"<automatic / notice_based / by_addendum / not_specified / not_found>\",\n  \"extension_duration_rule\": \"<equal_delay / fixed_days / not_specified / not_found>\",\n  \"suspension_right\": \"<yes / no / not_found>\",\n  \"evidence\": [\"<цитата 1>\"\
      , \"<цитата 2>\"]\n}\n"
    prompt_file: null
    context_k: 5
    temperature: 0.0
    max_tokens: 500
  retrieval:
    retrieval_profile: completion_deadline_check
    corpus_scope: document
    context_k: 5
    max_chunks: 8
    boost_keywords:
    - продление сроков
    - автоматическое продление
    - задержка согласования
    - время рассмотрения не включается
    - приостановить работы
    negative_keywords:
    - форс-мажор
    - неустойка
    - экспертиза
    - подсудность
    rerank: true
    filters: {}
