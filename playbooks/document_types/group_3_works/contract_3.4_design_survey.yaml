# ──────────────────────────────────────────────────────────────────────────
# CHECK 11: Поэтапное согласование и отклонение промежуточных результатов
# ──────────────────────────────────────────────────────────────────────────
- id: stagewise_approval_procedure
  name: "Поэтапное согласование и право отклонения промежуточных результатов (ст. 760 ГК РФ)"
  description: |
    Проверяет наличие процедуры поэтапного согласования, сроков рассмотрения
    заказчиком, права на замечания и порядка согласования отступлений от ТЗ.
  legal_base: "ст. 760 ГК РФ"
  triggers: ~
  ui_mode: "field_extraction"
  severity: "high"
  origin: "DOCUMENT_TYPE"
  detector_type: "hybrid"
  rules:
    keywords:
      - "поэтапное согласование"
      - "эскизный проект"
      - "утверждение этапа"
      - "замечания заказчика"
      - "срок рассмотрения"
      - "отклонение промежуточного результата"
      - "мотивированный отказ"
      - "отступление от ТЗ"
      - "изменение ТЗ"
      - "корректировка задания"
    keyword_mode: "any"
    regex_patterns:
      - "(?i)поэтапн(ое|ого)\\s+согласован"
      - "(?i)замечан(ия|ий)\\s+заказчик"
      - "(?i)срок\\s+рассмотрен"
      - "(?i)отступлени(е|я)\\s+от\\s+(ТЗ|техническ)"
  llm:
    prompt_template: |
      [КОНТЕКСТ]
      Ты — юрист, анализирующий договор ПИР.
      Проверяется только один вопрос: предусмотрена ли процедура поэтапного
      согласования промежуточных результатов, сроки рассмотрения заказчиком,
      право на замечания и порядок согласования отступлений от ТЗ.

      Важно:
      — Анализируй только положения о согласовании промежуточных результатов,
        замечаниях заказчика и отступлениях от ТЗ.
      — Не оценивай риск и не смешивай согласование с итоговой приёмкой.
      — Если срок или порядок не установлены прямо, не домысливай.

      [ЗАДАЧА]
      1. Установить, предусмотрено ли поэтапное согласование промежуточных результатов.
      2. Извлечь срок рассмотрения заказчиком.
      3. Установить, есть ли право заказчика на мотивированные замечания.
      4. Установить, предусмотрена ли авто-приёмка при молчании.
      5. Установить, урегулирован ли порядок согласования отступлений от ТЗ.
      6. Установить, предусмотрено ли согласование изменений объёма работ.

      [ПРАВИЛА]
      1. stagewise_approval_present = "yes" — если договор предусматривает
         согласование промежуточных результатов по этапам;
         "no" — если тема раскрыта, но такой процедуры нет;
         "not_found" — если тема отсутствует.
      2. review_period_days — числовое значение в днях или текст
         с указанием периода; если не указано — "not_found".
      3. right_to_remarks = "yes" — заказчик вправе направить замечания;
         "no" — тема раскрыта, но такого права нет; "not_found" — тема отсутствует.
      4. auto_approval_on_silence = "yes" — если молчание заказчика
         в установленный срок приравнивается к согласованию;
         "no" — если тема раскрыта, но авто-приёмки нет;
         "not_found" — тема отсутствует.
      5. tz_deviation_procedure = "defined" — если установлен порядок согласования
         отступлений от ТЗ (включая корректировку задания);
         "not_defined" — если тема раскрыта, но порядок не определён;
         "not_found" — если тема отсутствует.
      6. scope_change_procedure = "defined" — если установлен порядок согласования
         изменений объёма работ (включая допсоглашение);
         "not_defined" — если тема раскрыта, но порядок не определён;
         "not_found" — если тема отсутствует.
      7. Не путай согласование промежуточных результатов с итоговой приёмкой.

      [ПРИМЕРЫ (FEW-SHOT)]
      Пример 1 — согласование урегулировано:
      Текст: «По завершении каждого этапа Подрядчик передаёт промежуточный
      результат Заказчику для согласования. Заказчик рассматривает результат
      в течение 10 рабочих дней и направляет замечания или утверждает этап.
      Если замечания не поступили в указанный срок, этап считается согласованным.
      Отступления от ТЗ согласовываются путём подписания дополнительного соглашения.»

      Ответ:
      {
        "stagewise_approval_present": "yes",
        "review_period_days": "10 рабочих дней",
        "right_to_remarks": "yes",
        "auto_approval_on_silence": "yes",
        "tz_deviation_procedure": "defined",
        "scope_change_procedure": "defined",
        "evidence": [
