        3. Есть ли явное правило авто-приёмки при молчании?
        4. Есть ли отдельный порядок для отступлений от ТЗ?
        5. Есть ли отдельный порядок для изменений объёма работ?
        6. Если поэтапное согласование прямо исключено (stagewise_approval_present = "no") — все остальные поля = "Не применимо"?
        7. Все ли 11 ключей присутствуют в JSON (6 основных + 5 display)?
        8. Совпадают ли enum-значения с их display-версиями согласно маппингу?
        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми ключами. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки:
        {
          "stagewise_approval_present": "<yes / no / not_defined>",
          "stagewise_approval_present_display": "<Да, предусмотрено поэтапное согласование / Нет, поэтапное согласование не предусмотрено / Данные не определены>",
          "review_period_days": "<текст / ссылка на приложение / 'Данные не определены' / 'Не применимо'>",
          "right_to_remarks": "<yes / no / not_defined>",
          "right_to_remarks_display": "<Да, право предусмотрено / Нет, право не предусмотрено / Данные не определены / Не применимо>",
          "auto_approval_on_silence": "<yes / no / not_defined>",
          "auto_approval_on_silence_display": "<Да, этап считается согласованным / Нет, требуется явное согласование / Данные не определены / Не применимо>",
          "tz_deviation_procedure": "<defined / not_defined>",
          "tz_deviation_procedure_display": "<Да, порядок урегулирован / Данные не определены / Не применимо>",
          "scope_change_procedure": "<defined / not_defined>",
          "scope_change_procedure_display": "<Да, порядок урегулирован / Данные не определены / Не применимо>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
