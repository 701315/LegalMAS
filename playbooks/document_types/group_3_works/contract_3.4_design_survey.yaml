    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 650
    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 700
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора ПИР сведения о цене работ
        и основании её расчёта. Не анализируй порядок оплаты, аванс, штраф или иные темы.
        </role>
        <context>
        {context}
        </context>
        <task>
        Заполни строго следующие 7 полей (плюс evidence):
        1. price_amount_status — определена ли цена: defined / not_defined.
        2. price_amount_value — сумма цены работ или ссылка на документ, определяющий цену, или "Данные не определены".
        3. price_type — тип цены: fixed / approximate / cost_plus / percentage / sbc / not_defined.
        4. price_type_display — человеко-читаемое значение: "Твёрдая цена" / "Приблизительная цена" / "По фактическим затратам" / "Процент от стоимости строительства (СМР)" / "По Справочнику базовых цен (СБЦ)" / "Данные не определены".
        5. price_includes_vat — включает ли цена НДС: yes / no / not_applicable / unclear / not_defined.
        6. price_includes_vat_display — человеко-читаемое значение: "Да, НДС включён" / "Нет, НДС не включён" / "Не применимо" / "Не удалось определить" / "Данные не определены".
        7. calculation_basis — основание расчёта цены (текст) или "Данные не определены".

        Маппинг enum → display:
        - price_type: fixed → "Твёрдая цена", approximate → "Приблизительная цена", cost_plus → "По фактическим затратам", percentage → "Процент от стоимости строительства (СМР)", sbc → "По Справочнику базовых цен (СБЦ)", not_defined → "Данные не определены"
        - price_includes_vat: yes → "Да, НДС включён", no → "Нет, НДС не включён", not_applicable → "Не применимо", unclear → "Не удалось определить", not_defined → "Данные не определены"

        Критические правила:
        - Если цена указана прямо (например, "4 500 000 рублей") — price_amount_status = "defined", price_amount_value = сумма
        - Если цена определяется по документу (например, "согласно Смете (Приложение № 3)" или "по СБЦ") — price_amount_status = "defined", price_amount_value = "Определяется по Смете (Приложение № 3)" или аналогично
        - Если цена вообще не упомянута — price_amount_status = "not_defined", price_amount_value = "Данные не определены"
        - Не путай цену работ с авансом, штрафом, неустойкой или задатком
        </task>
        <context_rules>
        - Используй только текст договора. Не выдумывай суммы, реквизиты приложений или проценты — извлекай строго из переданного фрагмента.
        - Не вычисляй цену самостоятельно (например, не умножай ставку на объём работ).
        - Не опирайся на внешние знания о типовых ценах ПИР.
        - Верни строго валидный JSON. Все 7 ключей + evidence обязаны присутствовать.
        - Запрещены: null, None, пустые строки "". Для текстовых полей при отсутствии данных — "Данные не определены".
        - Убедись, что enum-значения соответствуют их display-версиям согласно маппингу выше.
        - Различай "цена не упомянута" (not_defined) и "цена определяется по документу" (defined + ссылка на документ).
        </context_rules>

        <output_expectations>
        - Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        - Не используй markdown fences.
        - Не добавляй пояснения до или после JSON.
        - Верни все ключи, перечисленные в task, без пропусков.
        - Не используй null, None или пустые строки.
        - Для статусных полей используй только значения из allowed_values или "not_defined".
        - Для текстовых полей при отсутствии данных используй "Данные не определены" / "Не удалось определить" / "Не применимо" — согласно правилам выше.
        </output_expectations>
      fields:
        - name: "price_amount_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Определена ли цена работ в договоре (enum)."
          required: true
          display_in_grid: false
        - name: "price_amount_value"
          type: "string"
          presentation: "fact"
          label: "Цена работ"
          description: "Общая цена работ по договору или ссылка на документ, определяющий цену."
          required: false
          display_in_grid: true
          display_priority: 1
        - name: "price_type"
          type: "string"
          presentation: "signal"
          allowed_values: ["fixed", "approximate", "cost_plus", "percentage", "sbc", "not_defined"]
          description: "Тип цены по договору (enum)."
          required: true
          display_in_grid: false
        - name: "price_type_display"
          type: "string"
          presentation: "fact"
          label: "Тип цены"
          description: "Человеко-читаемое значение типа цены работ."
          required: false
          display_in_grid: true
          display_priority: 3
        - name: "price_includes_vat"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no", "not_applicable", "unclear", "not_defined"]
          description: "Включает ли цена НДС (enum)."
          required: true
          display_in_grid: false
        - name: "price_includes_vat_display"
          type: "string"
          presentation: "fact"
          label: "Включение НДС"
          description: "Человеко-читаемое значение: включает ли цена НДС."
          required: false
          display_in_grid: true
          display_priority: 4
        - name: "calculation_basis"
          type: "string"
          presentation: "fact"
          label: "Основание расчёта"
          description: "Основание расчёта цены: СБЦ, смета, процент, фиксированная сумма, приложение."
          required: false
          display_in_grid: true
          display_priority: 2

  - id: stage_payment_schedule
    name: "Поэтапная оплата: привязка к актам и порядок расчётов"
    description: >
      Фактографическая проверка порядка оплаты по договору на выполнение проектных
      и изыскательских работ (ПИР) в соответствии со ст. 711 и ст. 762 ГК РФ.
      Для договоров ПИР характерна специфика оплаты, связанная с поэтапным характером
      работ: стадия «П» (проектная документация), стадия «Р» (рабочая документация),
      отдельные этапы по видам изысканий. Проверка выявляет пять критических аспектов:
      (1) предусмотрен ли аванс — типичная практика для ПИР (30–50% цены договора),
      обеспечивающая финансирование начального этапа работ; (2) предусмотрена ли
      поэтапная оплата — разделение цены договора на этапы с привязкой к стадиям
      проектирования или видам работ; (3) привязана ли оплата к подписанию актов
      сдачи-приёмки по этапам — стандартный механизм защиты заказчика от оплаты
      некачественных или не принятых результатов; (4) триггер окончательного расчёта —
      после подписания итогового акта по всему договору, после подписания акта по
      последнему этапу или после выставления счёта; (5) ссылка на график платежей
      или приложение, детализирующее порядок и сроки оплаты по этапам. Отсутствие
      чёткого порядка оплаты — типичная причина споров о сроках и обоснованности
      платежей, а также о моменте возникновения права на оплату.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "оплата по этапам"
        - "поэтапная оплата"
        - "авансовый платеж"
        - "аванс"
        - "после подписания акта"
        - "окончательный расчёт"
        - "счёт"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)оплат(а|ы).*поэтапн"
        - "(?i)оплат(а|ы).*после.*подписани.*акт"
        - "(?i)аванс.*\\d"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор на выполнение проектных и изыскательских работ (ПИР)
        (§ 4 Главы 37 ГК РФ, ст. 711, 762).
        Проверяется только один вопрос: аванс, поэтапная оплата,
        привязка к актам и триггер окончательного расчёта.
        Нормативный ориентир:
        - ст. 711 ГК РФ (момент оплаты в подряде)
        - ст. 762 ГК РФ (оплата работ по договору подряда на выполнение проектных и изыскательских работ)
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не выдумывай проценты аванса, суммы или реквизиты приложений.
        - Не путай счёт (платёжный документ) с актом сдачи-приёмки (документ о результате работ).

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Предусмотрен ли аванс.
        2. Предусмотрена ли поэтапная оплата.
        3. Привязана ли оплата к подписанию актов.
        4. Триггер окончательного расчёта.
        5. Ссылка на график или приложение с порядком оплаты.

        [ПРАВИЛА]
        1. Используй только текст документа. Не выдумывай проценты аванса, суммы или реквизиты приложений — извлекай строго из переданного фрагмента.
        2. Для enum-полей при отсутствии данных используй значение "not_defined".
        3. Для текстовых полей при отсутствии данных пиши "Данные не определены".
        4. Для полей *_display используй человеко-читаемые значения согласно маппингу.
        5. Различай:
           - "yes" — условие прямо указано в договоре
           - "no" — условие прямо исключено или противоречит указанному (например, "оплата производится единовременно после завершения всех работ")
           - "not_defined" — условие вообще не упоминается в договоре
           - "unclear" — формулировка допускает разные толкования
           - "after_final_act" — окончательный расчёт после подписания итогового акта по всему договору
           - "after_stage_act" — окончательный расчёт после подписания акта по последнему этапу
