  - id: termination_and_consequences
    name: "Расторжение: основания и последствия (ст. 715, 717, 758 ГК РФ)"
    description: >
      Фактографическая проверка условий расторжения договора на выполнение проектных
      и изыскательских работ (ПИР) в соответствии со ст. 715, 717 и 758 ГК РФ.
      Расторжение договора ПИР имеет специфику, связанную с интеллектуальным характером
      результата работ: проектная документация уже создана, частично оплачена и может
      быть использована заказчиком. Проверка выявляет пять критических аспектов:
      (1) право на односторонний отказ — за какой стороной закреплено (только заказчик
      по ст. 717 ГК РФ, только подрядчик по ст. 715 ГК РФ, обе стороны или отсутствует);
      (2) порядок оплаты фактически выполненной части работ при расторжении — критически
      важен для ПИР, т.к. подрядчик уже понёс затраты на создание документации; (3) возврат
      или передача документации при расторжении — специфика ПИР: заказчик обычно заинтересован
      получить уже разработанную документацию, даже если договор расторгнут; (4) штрафная
      санкция за расторжение — не путать с неустойкой за просрочку (это разные механизмы);
      (5) срок предварительного уведомления о расторжении — типично 15–30 календарных дней.
