        Не путай ответственность проектировщика с ответственностью строителя.
        </role>
        <context>
        {context}
        </context>
        <task>
        Заполни строго следующие 6 полей (плюс evidence):
        1. delimitation_present — разграничение ответственности: yes / no / not_defined.
        2. delimitation_present_display — человеко-читаемое значение: "Да, разграничение предусмотрено" / "Нет, разграничение не предусмотрено" / "Данные не определены".
        3. designer_scope — scope ответственности проектировщика: documentation_quality_only / includes_supervision / not_specified / not_defined.
        4. designer_scope_display — человеко-читаемое значение: "Только качество проектной документации" / "Включает авторский надзор" / "Не конкретизировано" / "Данные не определены".
        5. author_supervision_separate — авторский надзор отдельно: yes / no / not_defined.
        6. author_supervision_separate_display — человеко-читаемое значение: "Да, авторский надзор — отдельная услуга" / "Нет, авторский надзор включён в договор" / "Данные не определены".

        Маппинг enum → display:
        - delimitation_present: yes → "Да, разграничение предусмотрено", no → "Нет, разграничение не предусмотрено", not_defined → "Данные не определены"
        - designer_scope: documentation_quality_only → "Только качество проектной документации", includes_supervision → "Включает авторский надзор", not_specified → "Не конкретизировано", not_defined → "Данные не определены"
        - author_supervision_separate: yes → "Да, авторский надзор — отдельная услуга", no → "Нет, авторский надзор включён в договор", not_defined → "Данные не определены"

        Если данные отсутствуют в тексте:
        - enum-поля = "not_defined"
        - display-поля = "Данные не определены"
        </task>
        <context_rules>
        - Используй только текст договора. Не выдумывай условия разграничения — извлекай строго из переданного фрагмента.
        - Не опирайся на внешние знания о типовых условиях договоров ПИР.
        - Не путай авторский надзор проектировщика с техническим надзором заказчика — это разные институты.
        - Не путай ответственность проектировщика за качество документации с ответственностью строителя за выполнение работ.
        - Верни строго валидный JSON. Все 6 ключей + evidence обязаны присутствовать.
        - Запрещены: null, None, пустые строки "".
        - Убедись, что enum-значения соответствуют их display-версиям согласно маппингу выше.
        </context_rules>

        <output_expectations>
        - Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        - Не используй markdown fences.
        - Не добавляй пояснения до или после JSON.
        - Верни все ключи, перечисленные в task, без пропусков.
        - Не используй null, None или пустые строки.
        - Для статусных полей используй только значения из allowed_values или "not_defined".
        - Для текстовых полей при отсутствии данных используй "Данные не определены" / "Не удалось определить" / "Не применимо" — согласно правилам выше.
        </output_expectations>
      fields:
        - name: "delimitation_present"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Разграничена ли ответственность проектировщика и строителя (enum)."
          required: true
