# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: CHECKS_V8 — LLM/hybrid проверки
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

# ──────────────────────────────────────────────────────────────────────────
# CHECK 1: Стороны договора, подписанты и полномочия
# ──────────────────────────────────────────────────────────────────────────
- id: parties_identification
  name: "Стороны договора: идентификация заказчика и подрядчика"
  description: "Проверяет наличие и достаточность идентификации сторон, полномочия подписантов"
  legal_base: "ст. 432, 758 ГК РФ"
  triggers: ~
  ui_mode: "field_extraction"
  severity: "critical"
  origin: "DOCUMENT_TYPE"
  detector_type: "hybrid"
  rules:
    keywords:
      - "заказчик"
      - "подрядчик"
      - "проектировщик"
      - "изыскатель"
      - "именуем"
      - "в лице"
      - "действующего на основании"
    keyword_mode: "any"
    regex_patterns:
      - "(?i)(заказчик|подрядчик|проектировщик|изыскатель).*именуем"
  llm:
    prompt_template: |
      [КОНТЕКСТ]
      Ты — юрист, анализирующий договор на выполнение проектных
      и изыскательских работ (ПИР) (ст. 758–762 ГК РФ).
      Проверяется только один вопрос: идентификация сторон договора —
      заказчика и подрядчика (проектировщика/изыскателя), их реквизиты,
      типы, подписанты и основания полномочий.

      Важно:
      — Анализируй только вводную часть договора и раздел «Реквизиты сторон».
      — Не оценивай риски. Только извлекай факты об идентификации сторон.
      — Если сведения явно не указаны в тексте — значение "not_defined".

      [ЗАДАЧА]
      1. Установить тип заказчика (юрлицо / госорган / ИП / физлицо / самозанятый).
      2. Установить тип подрядчика.
      3. Определить, указаны ли реквизиты заказчика.
      4. Определить, указаны ли реквизиты подрядчика.
      5. Установить подписанта заказчика и основание его полномочий.
      6. Установить подписанта подрядчика и основание его полномочий.
      7. Установить наличие корпоративного одобрения сделки.

      [ПРАВИЛА]
      1. client_type: "legal_entity" — ООО, АО, ПАО, НАО, иное юрлицо;
         "state_entity" — государственный или муниципальный орган, учреждение,
         ГУП, МУП; "ip" — индивидуальный предприниматель; "individual" —
         физическое лицо; "self_employed" — самозанятый; "not_defined" —
         тип не установим.
      2. contractor_type: "legal_entity" — ООО, АО, ПАО, НАО, иное юрлицо;
         "ip" — индивидуальный предприниматель; "individual" — физическое лицо;
         "not_defined" — тип не установим.
      3. client_details_status / contractor_details_status: "defined" —
         только если указаны наименование и хотя бы ИНН или ОГРН.
         Иначе — "not_defined".
      4. client_signatory_basis / contractor_signatory_basis: "charter" —
         «на основании Устава»; "poa" — «на основании доверенности»;
         "order" — «на основании приказа»; "personal" — физлицо подписывает лично;
         "other" — иное основание; "not_defined" — основание не указано.
      5. corporate_approval_status: "defined" — если в тексте есть явное упоминание
         одобрения крупной сделки или сделки с заинтересованностью;
         "not_defined" — в остальных случаях.
      6. Не смешивай заказчика и подрядчика. Каждое поле относится строго к одной стороне.
      7. Не извлекай банковские реквизиты — только наименование, ИНН, ОГРН, адрес,
