        required: false

# ──────────────────────────────────────────────────────────────────────────
# CHECK 16: Ответственность проектировщика за ошибки в ПД
# ──────────────────────────────────────────────────────────────────────────
- id: designer_liability_for_errors
  name: "Ответственность проектировщика за ошибки в ПД (ст. 761 ГК РФ)"
  description: |
    Проверяет наличие условий об ответственности проектировщика за ошибки,
    включая объём ответственности, лимит (cap), исключение косвенных убытков
    и расходы на переделку СМР. Ошибки в проекте часто всплывают только
    при строительстве или эксплуатации; убытки могут многократно превышать
    стоимость проектных работ.
  legal_base: "ст. 761 ГК РФ"
  triggers: ~
  ui_mode: "field_extraction"
  severity: "critical"
  origin: "DOCUMENT_TYPE"
  detector_type: "hybrid"
  rules:
    keywords:
      - "ответственность за ошибки"
      - "ответственность за недостатки"
      - "недостатки документации"
      - "переделка"
      - "устранение дефектов"
      - "убытки вследствие ошибок"
      - "ст. 761"
      - "ответственность ограничена"
      - "совокупная ответственность"
      - "не превышает стоимости"
      - "в пределах цены договора"
      - "косвенные убытки"
      - "упущенная выгода"
    keyword_mode: "any"
    regex_patterns:
      - "(?i)ответственност.*за.*недостатк.*документац"
      - "(?i)возмест.*убытк.*вызванн.*ошибк"
      - "(?i)ст\\.?\\s*761"
      - "(?i)ответственност.*ограничен.*стоимост"
      - "(?i)совокупн.*ответственност.*не.*превыша"
      - "(?i)не\\s+возмеща(ются|ется).*косвенн"
  llm:
    prompt_template: |
      [КОНТЕКСТ]
      Ты — юрист, анализирующий договор ПИР.
      Проверяется только один вопрос: ответственность проектировщика за ошибки
      в проектной документации, включая объём ответственности, лимит (cap)
      и исключение косвенных убытков.

      Важно:
      — Анализируй только положения об ответственности проектировщика за качество ПД,
        ограничении ответственности и исключении отдельных видов убытков.
      — Не оценивай риск и не смешивай с неустойкой за просрочку.
      — Если условие не установлено прямо, не домысливай.

      [ЗАДАЧА]
      1. Установить, предусмотрена ли ответственность за ошибки в ПД.
      2. Определить объём ответственности.
      3. Установить наличие лимита (cap) совокупной ответственности.
      4. Извлечь размер лимита ответственности.
      5. Установить, исключены ли косвенные убытки и упущенная выгода.

      [ПРАВИЛА]
      1. liability_for_errors_present = "yes" — если ответственность за ошибки
         прямо предусмотрена; "no" — если тема раскрыта, но ответственность
         прямо исключена; "not_found" — если тема отсутствует.
      2. liability_scope = "documentation_only" — ответственность ограничена
         качеством самой документации (переделка ПД);
         "includes_construction_rework" — включает расходы на переделку СМР;
         "full_damages" — полное возмещение всех убытков;
         "not_specified" — тема есть, но объём не определён;
         "not_found" — тема отсутствует.
      3. liability_cap_present = "yes" — если установлен предел совокупной
         ответственности; "no" — если тема раскрыта, но cap не установлен;
         "not_found" — тема отсутствует.
      4. liability_cap_amount — сумма, процент или формула лимита;
         если cap не установлен — "not_found".
      5. indirect_damages_excluded = "yes" — косвенные убытки / упущенная выгода
         прямо исключены из ответственности; "no" — тема раскрыта,
         но исключения нет; "not_found" — тема отсутствует.
      6. Не путай ответственность за ошибки с неустойкой за просрочку.
      7. Не путай cap с размером страхового покрытия.

      [ПРИМЕРЫ (FEW-SHOT)]
      Пример 1 — ответственность и cap урегулированы:
      Текст: «Подрядчик несёт ответственность за недостатки проектной документации,
      включая расходы на переделку строительных работ, вызванных такими недостатками.
      Совокупная ответственность Подрядчика не может превышать 100% цены договора.
      Косвенные убытки и упущенная выгода возмещению не подлежат.»

      Ответ:
      {
        "liability_for_errors_present": "yes",
        "liability_scope": "includes_construction_rework",
        "liability_cap_present": "yes",
        "liability_cap_amount": "100% цены договора",
        "indirect_damages_excluded": "yes",
        "evidence": [
          "Подрядчик несёт ответственность за недостатки проектной документации, включая расходы на переделку строительных работ, вызванных такими недостатками.",
          "Совокупная ответственность Подрядчика не может превышать 100% цены договора.",
          "Косвенные убытки и упущенная выгода возмещению не подлежат."
        ]
      }

      Пример 2 — тема не раскрыта:
      Текст: «Стороны несут ответственность в соответствии с действующим законодательством.»

      Ответ:
      {
        "liability_for_errors_present": "not_found",
        "liability_scope": "not_found",
        "liability_cap_present": "not_found",
        "liability_cap_amount": "not_found",
        "indirect_damages_excluded": "not_found",
        "evidence": [
          "Стороны несут ответственность в соответствии с действующим законодательством."
        ]
      }

      [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
      1. Разграничены ли ответственность за ошибки и неустойка за просрочку?
      2. Определён ли объём ответственности (только ПД vs СМР vs полные убытки)?
      3. Есть ли явный cap с суммой или формулой?
      4. Есть ли явное исключение косвенных убытков?
      5. Все ли ключи JSON совпадают со schema?

      [ФОРМАТ ОТВЕТА]
      Верни строго JSON:
      {
        "liability_for_errors_present": "<yes / no / not_found>",
        "liability_scope": "<documentation_only / includes_construction_rework / full_damages / not_specified / not_found>",
        "liability_cap_present": "<yes / no / not_found>",
        "liability_cap_amount": "<текст или not_found>",
        "indirect_damages_excluded": "<yes / no / not_found>",
        "evidence": ["<цитата 1>", "<цитата 2>"]
      }
    prompt_file: null
    context_k: 6
    temperature: 0.0
    max_tokens: 540
  retrieval:
    corpus_scope: "document"
    context_k: 6
    max_chunks: 8
    retrieval_profile: "liability_cap_check"
    boost_keywords:
      - "ответственность проектировщика"
      - "ответственность за ошибки"
      - "недостатки документации"
      - "убытки"
      - "ст. 761"
      - "ограничение ответственности"
      - "совокупная ответственность"
      - "косвенные убытки"
    negative_keywords:
      - "экспертиза"
      - "форс-мажор"
      - "подсудность"
      - "аванс"
    rerank: true
    filters: {}
  enrichment_hints:
    preferred_segment_types:
      - "clause"
      - "article"
    excluded_segment_types:
      - "signature_block"
    preferred_clause_functions:
      - "limitations"
      - "limitations"
      - "remedies"
  evidence:
    required: true
    min_snippet_length: 40
    max_snippet_length: 700
  extraction:
    enabled: true
    mode: "hybrid"
    store_payload: true
    llm_max_tokens: 700

    compact_output: false

    llm_prompt_extraction: |
      <role>
      Ты — юрист, извлекающий сведения об ответственности проектировщика
      за ошибки в ПД в договоре ПИР. Не оценивай риски.
      Только заполняй поля строго по тексту.
      </role>

      <context>
      {context}
      </context>

      <task>
      Заполни строго следующие поля:

      liability_for_errors_present — предусмотрена ли ответственность за ошибки
        (allowed: yes / no / not_found).

      liability_scope — объём ответственности проектировщика
        (allowed: documentation_only / includes_construction_rework /
        full_damages / not_specified / not_found).

      liability_cap_present — наличие лимита совокупной ответственности
        (allowed: yes / no / not_found).

      liability_cap_amount — размер лимита ответственности
        (текстовое значение, например "100% цены договора", или not_found).

      indirect_damages_excluded — исключены ли косвенные убытки и упущенная выгода
        (allowed: yes / no / not_found).

      Если данные отсутствуют: указывай "not_found".
      </task>

      <rules>
      1. liability_for_errors_present: "yes" — ответственность прямо предусмотрена;
         "no" — тема раскрыта, но ответственность исключена;
         "not_found" — тема отсутствует.
      2. liability_scope: "documentation_only" — только переделка ПД;
         "includes_construction_rework" — включая переделку СМР;
         "full_damages" — полные убытки; "not_specified" — объём неясен;
         "not_found" — тема отсутствует.
      3. liability_cap_present: "yes" — cap установлен; "no" — тема раскрыта,
         но cap нет; "not_found" — тема отсутствует.
      4. liability_cap_amount: сумма, процент или формула; или "not_found".
      5. indirect_damages_excluded: "yes" — исключены; "no" — не исключены;
         "not_found" — тема отсутствует.
      6. Не добавляй ключи, не входящие в список полей.
      7. Верни только JSON.
      </rules>
    fields:
      - name: "liability_for_errors_present"
        type: "string"
        label: "Ответственность за ошибки"
        presentation: "badge"
        display_in_grid: true
        display_priority: 1
        allowed_values:
          - "yes"
          - "no"
          - "not_found"
        description: "Предусмотрена ли ответственность за ошибки в ПД."
        required: true
      - name: "liability_scope"
        type: "string"
        label: "Объём ответственности"
        presentation: "badge"
        display_in_grid: true
        display_priority: 2
        allowed_values:
          - "documentation_only"
          - "includes_construction_rework"
          - "full_damages"
          - "not_specified"
          - "not_found"
        description: "Объём ответственности проектировщика."
        required: false
      - name: "liability_cap_present"
        type: "string"
        label: "Лимит ответственности"
        presentation: "badge"
        display_in_grid: true
        display_priority: 3
        allowed_values:
          - "yes"
          - "no"
          - "not_found"
        description: "Установлен ли лимит совокупной ответственности."
        required: false
      - name: "liability_cap_amount"
        type: "string"
        label: "Размер лимита"
        presentation: "text"
        display_in_grid: false
        display_priority: 4
        description: "Размер лимита ответственности."
        max_value_chars: 150
        required: false
      - name: "indirect_damages_excluded"
        type: "string"
        label: "Исключение косвенных убытков"
        presentation: "badge"
        display_in_grid: false
        display_priority: 5
        allowed_values:
          - "yes"
          - "no"
          - "not_found"
        description: "Исключены ли косвенные убытки и упущенная выгода."
        required: false

# ──────────────────────────────────────────────────────────────────────────
# CHECK 17: Разграничение ответственности проектировщика и строителя
# ──────────────────────────────────────────────────────────────────────────
- id: designer_vs_builder_liability
  name: "Разграничение ответственности проектировщика и строителя (ст. 761 ГК РФ)"
  description: |
    Проверяет наличие условия о разграничении ответственности проектировщика
    и строительного подрядчика. Без чёткого разграничения проектировщик
    втягивается в споры о строительных дефектах, к которым не причастен.
  legal_base: "ст. 761 ГК РФ"
  triggers: ~
  ui_mode: "field_extraction"
  severity: "high"
  origin: "DOCUMENT_TYPE"
  detector_type: "hybrid"
  rules:
    keywords:
      - "ответственность ограничивается качеством документации"
      - "не несет ответственности за действия строителей"
      - "отклонения от проекта без согласования"
      - "авторский надзор"
      - "реализация проекта строителями"
    keyword_mode: "any"
    regex_patterns:
      - "(?i)не\\s+отвеча(ет|ть)\\s+за.*реализац.*строител"
      - "(?i)ответственност.*ограничива(ется|ясь).*качеств.*документац"
  llm:
    prompt_template: |
      [КОНТЕКСТ]
      Ты — юрист, анализирующий договор ПИР.
      Проверяется только один вопрос: разграничена ли ответственность
      проектировщика и строительного подрядчика за дефекты.

      Важно:
      — Анализируй только положения о разграничении ответственности
        между проектировщиком и строителем.
      — Не оценивай риск и не смешивай с ответственностью за ошибки
        непосредственно в проектной документации.
      — Если условие не установлено прямо, не домысливай.

      [ЗАДАЧА]
      1. Установить, предусмотрено ли разграничение ответственности.
      2. Определить scope ответственности проектировщика.
      3. Установить, является ли авторский надзор отдельной услугой/договором.

      [ПРАВИЛА]
      1. delimitation_present = "yes" — если договор прямо разграничивает
         ответственность проектировщика и строителя;
         "no" — если тема раскрыта, но разграничения нет;
         "not_found" — если тема отсутствует.
      2. designer_scope = "documentation_quality_only" — проектировщик отвечает
         только за качество документации, но не за реализацию;
         "includes_supervision" — включает ответственность за надзор при строительстве;
         "not_specified" — тема есть, но scope не определён;
         "not_found" — тема отсутствует.
      3. author_supervision_separate = "yes" — авторский надзор оформлен
         как отдельная услуга или отдельный договор;
         "no" — тема раскрыта, но надзор не выделен;
         "not_found" — тема отсутствует.
      4. Не путай разграничение ответственности между проектировщиком и строителем
         с общей ответственностью подрядчика за качество работ.
      5. Не путай авторский надзор с техническим надзором заказчика.
      6. Если тема не затронута в договоре — все = "not_found".
      7. Не подменяй факт из текста диспозитивной нормой ГК.

      [ПРИМЕРЫ (FEW-SHOT)]
      Пример 1 — разграничение установлено:
      Текст: «Ответственность Подрядчика ограничивается качеством
      проектной документации. Подрядчик не несёт ответственности
      за отклонения от проекта, допущенные строительным подрядчиком
      без письменного согласования. Авторский надзор осуществляется
      по отдельному договору.»

      Ответ:
      {
        "delimitation_present": "yes",
        "designer_scope": "documentation_quality_only",
        "author_supervision_separate": "yes",
        "evidence": [
          "Ответственность Подрядчика ограничивается качеством проектной документации.",
          "Подрядчик не несёт ответственности за отклонения от проекта, допущенные строительным подрядчиком без письменного согласования.",
          "Авторский надзор осуществляется по отдельному договору."
        ]
      }

      Пример 2 — тема не раскрыта:
      Текст: «Подрядчик несёт ответственность за качество работ.»

      Ответ:
      {
        "delimitation_present": "not_found",
        "designer_scope": "not_found",
        "author_supervision_separate": "not_found",
        "evidence": [
          "Подрядчик несёт ответственность за качество работ."
        ]
      }

      [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
      1. Есть ли в тексте явное разграничение между проектировщиком и строителем?
      2. Ограничена ли ответственность именно качеством ПД?
      3. Выделен ли авторский надзор как отдельная услуга?
      4. Все ли ключи JSON совпадают со schema?

      [ФОРМАТ ОТВЕТА]
      Верни строго JSON:
      {
        "delimitation_present": "<yes / no / not_found>",
        "designer_scope": "<documentation_quality_only / includes_supervision / not_specified / not_found>",
        "author_supervision_separate": "<yes / no / not_found>",
        "evidence": ["<цитата 1>", "<цитата 2>"]
      }
    prompt_file: null
    context_k: 5
    temperature: 0.0
    max_tokens: 420
  retrieval:
    retrieval_profile: "liability_cap_check"
    corpus_scope: "document"
    context_k: 5
    max_chunks: 6
    boost_keywords:
      - "разграничение ответственности"
      - "качество документации"
      - "авторский надзор"
      - "строительный подрядчик"
    negative_keywords:
      - "экспертиза"
      - "форс-мажор"
      - "подсудность"
      - "аванс"
    rerank: true
    filters: {}
  enrichment_hints:
    preferred_segment_types:
      - "clause"
      - "article"
    excluded_segment_types:
      - "signature_block"
    preferred_clause_functions:
      - "limitations"
      - "obligations"
  evidence:
    required: true
    min_snippet_length: 40
    max_snippet_length: 500
  extraction:
    enabled: true
    mode: "hybrid"
    store_payload: true
    llm_max_tokens: 450

    compact_output: false

    llm_prompt_extraction: |
      <role>
      Ты — юрист, извлекающий сведения о разграничении ответственности
      проектировщика и строителя в договоре ПИР. Не оценивай риски.
      Только заполняй поля строго по тексту.
      </role>

      <context>
      {context}
      </context>

      <task>
      Заполни строго следующие поля:

      delimitation_present — предусмотрено ли разграничение ответственности
        (allowed: yes / no / not_found).

      designer_scope — scope ответственности проектировщика
        (allowed: documentation_quality_only / includes_supervision / not_specified / not_found).

      author_supervision_separate — авторский надзор как отдельная услуга/договор
        (allowed: yes / no / not_found).

      Если данные отсутствуют: указывай "not_found".
      </task>

      <rules>
      1. delimitation_present: "yes" — разграничение установлено;
         "no" — тема раскрыта, но разграничения нет; "not_found" — тема отсутствует.
      2. designer_scope: "documentation_quality_only" — только качество ПД;
         "includes_supervision" — включая надзор при строительстве;
         "not_specified" — scope неясен; "not_found" — тема отсутствует.
      3. author_supervision_separate: "yes" — выделен отдельно;
         "no" — не выделен; "not_found" — тема отсутствует.
      4. Не добавляй ключи, не входящие в список полей.
      5. Верни только JSON.
      </rules>
    fields:
      - name: "delimitation_present"
        type: "string"
        label: "Разграничение ответственности"
        presentation: "badge"
        display_in_grid: true
        display_priority: 1
