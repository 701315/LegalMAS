      description: Наличие технического задания на проектирование.
      required: true
    - name: tz_attachment_number
      type: string
      label: Приложение с ТЗ
      presentation: text
      display_in_grid: false
      display_priority: 4
      keyword_hints:
      - приложение №
      - приложение
      description: Номер приложения, содержащего техническое задание.
      max_value_chars: 100
