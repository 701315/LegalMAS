# CHECK 13: Расторжение (ст. 715, 717, 758 ГК РФ)
# ──────────────────────────────────────────────────────────────────────────
  - id: termination_and_consequences
    name: "Расторжение: основания и последствия (ст. 715, 717, 758 ГК РФ)"
    description: >
      Фактографическая проверка оснований расторжения договора ПИР,
      права на односторонний отказ, порядка оплаты выполненной части,
      возврата документации и штрафных санкций за расторжение.
