      - not_found
      description: Оговорка об ответственности заказчика за достоверность исходных данных.
      required: false
- id: expertise_procedure_and_payment_link
  name: 'Экспертиза ПД: порядок прохождения и привязка оплаты (ст. 49 ГрК РФ)'
  description: 'Проверяет наличие условий о прохождении экспертизы ПД, распределение обязанностей

    по подаче и оплате экспертизы, привязку окончательного расчёта к получению

    положительного заключения. Без привязки оплаты к экспертизе заказчик рискует

    оплатить непригодный результат.

    '
  triggers:
    any:
    - expertise_required
  ui_mode: field_extraction
  severity: critical
  severity_if_pass: pass
  severity_if_fail: critical
  severity_if_unclear: critical
  origin: DOCUMENT_TYPE
  detector_type: hybrid
  rules:
    keywords:
    - экспертиза проектной документации
    - положительное заключение
    - отрицательное заключение
    - государственная экспертиза
    - негосударственная экспертиза
    - оплата после экспертизы
    - окончательный расчёт
    keyword_mode: any
    regex_patterns:
    - (?i)положительн(ое|ого)\s+заключени
    - (?i)экспертиз(а|ы|у)\s+проектн
    - (?i)(окончательн|финальн).*оплат.*после.*заключени
  llm:
    prompt_template: "[КОНТЕКСТ]\nТы — юрист, анализирующий договор ПИР.\nПроверяется только один вопрос: порядок прохождения экспертизы проектной документации,\nраспределение обязанностей по подаче и оплате экспертизы и связь оплаты работ\nс получением положительного заключения.\n\nВажно:\n— Анализируй только положения об экспертизе, заключении экспертизы и окончательном расчёте.\n— Не оценивай риск и не делай выводов вне текста.\n— Если экспертиза не упоминается, не делай выводов по аналогии.\n\n[ЗАДАЧА]\n1. Установить, упоминается ли экспертиза проектной документации.\n2. Определить вид экспертизы.\n3. Определить, кто подаёт документацию на экспертизу.\n4. Определить, кто оплачивает экспертизу.\n5. Установить, привязан ли окончательный расчёт к положительному заключению.\n6. Установить последствия отрицательного заключения экспертизы.\n\n[ПРАВИЛА]\n1. expertise_mentioned = \"yes\" — если договор прямо говорит об экспертизе ПД;\n   \"no\" — если не говорит.\n2. expertise_type = \"state\"\
      \ — государственная экспертиза;\n   \"non_state\" — негосударственная;\n   \"not_specified\" — экспертиза упомянута без указания вида;\n   \"not_found\" — экспертиза не упомянута.\n3. who_submits_to_expertise / who_pays_expertise:\n   \"contractor\" — подрядчик; \"client\" — заказчик; \"jointly\" — совместно;\n   \"not_specified\" — вопрос затронут без ясного распределения;\n   \"not_found\" — экспертиза не упомянута.\n4. payment_linked_to_positive_conclusion = \"yes\" — если окончательный расчёт,\n   оплата этапа или сдача результата прямо связаны с положительным заключением;\n   \"no\" — если экспертиза есть, но связи с оплатой нет; \"not_found\" — экспертиза не упомянута.\n5. negative_conclusion_consequences = \"rework_free\" — безвозмездная доработка;\n   \"rework_paid\" — доработка за отдельную плату;\n   \"termination\" — право расторгнуть или отказаться от договора;\n   \"not_specified\" — отрицательное заключение упомянуто без ясного последствия;\n   \"not_found\" — тема не\
      \ раскрыта.\n6. Не подменяй экспертизу согласованием с заказчиком.\n7. Не подменяй оплату экспертизы оплатой проектных работ.\n\n[ПРИМЕРЫ (FEW-SHOT)]\nПример 1 — экспертиза и оплата урегулированы:\nТекст: «Проектная документация подлежит государственной экспертизе.\nПодрядчик обеспечивает подготовку и подачу документации, Заказчик\nоплачивает стоимость экспертизы. Окончательный расчёт по договору\nпроизводится после получения положительного заключения. В случае\nотрицательного заключения Подрядчик обязан безвозмездно устранить замечания.»\n\nОтвет:\n{\n  \"expertise_mentioned\": \"yes\",\n  \"expertise_type\": \"state\",\n  \"who_submits_to_expertise\": \"contractor\",\n  \"who_pays_expertise\": \"client\",\n  \"payment_linked_to_positive_conclusion\": \"yes\",\n  \"negative_conclusion_consequences\": \"rework_free\",\n  \"evidence\": [\n    \"Проектная документация подлежит государственной экспертизе.\",\n    \"Подрядчик обеспечивает подготовку и подачу документации, Заказчик оплачивает\
      \ стоимость экспертизы.\",\n    \"Окончательный расчёт по договору производится после получения положительного заключения.\",\n    \"В случае отрицательного заключения Подрядчик обязан безвозмездно устранить замечания.\"\n  ]\n}\n\nПример 2 — экспертиза не упомянута:\nТекст: «Результат работ передаётся Заказчику по акту сдачи-приёмки.»\n\nОтвет:\n{\n  \"expertise_mentioned\": \"no\",\n  \"expertise_type\": \"not_found\",\n  \"who_submits_to_expertise\": \"not_found\",\n  \"who_pays_expertise\": \"not_found\",\n  \"payment_linked_to_positive_conclusion\": \"not_found\",\n  \"negative_conclusion_consequences\": \"not_found\",\n  \"evidence\": []\n}\n\n[ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]\n1. Упоминается ли именно экспертиза ПД, а не внутреннее согласование?\n2. Разделены ли обязанности по подаче и оплате экспертизы?\n3. Проверена ли именно привязка оплаты к положительному заключению?\n4. Есть ли прямое последствие отрицательного заключения?\n5. Все ли enum-поля заполнены допустимыми значениями?\n\
      \n[ФОРМАТ ОТВЕТА]\nВерни строго JSON:\n{\n  \"expertise_mentioned\": \"<yes / no>\",\n  \"expertise_type\": \"<state / non_state / not_specified / not_found>\",\n  \"who_submits_to_expertise\": \"<contractor / client / jointly / not_specified / not_found>\",\n  \"who_pays_expertise\": \"<contractor / client / jointly / not_specified / not_found>\",\n  \"payment_linked_to_positive_conclusion\": \"<yes / no / not_found>\",\n  \"negative_conclusion_consequences\": \"<rework_free / rework_paid / termination / not_specified / not_found>\",\n  \"evidence\": [\"<цитата 1>\", \"<цитата 2>\"]\n}\n"
    prompt_file: null
    context_k: 6
    temperature: 0.0
    max_tokens: 560
  retrieval:
    corpus_scope: document
    context_k: 6
    max_chunks: 8
    boost_keywords:
    - экспертиза
    - положительное заключение
    - окончательный расчёт
    - отрицательное заключение
    negative_keywords:
    - технические условия
    - ГПЗУ
    - форс-мажор
    - подсудность
    rerank: true
    filters: {}
  enrichment_hints:
    preferred_segment_types:
    - clause
    - article
    excluded_segment_types:
    - signature_block
    preferred_clause_functions:
    - procedures
    - obligations
    confidence_bonus_on_match: 0.1
    confidence_penalty_on_excluded_segment: 0.12
  evidence:
    required: true
    min_snippet_length: 50
    max_snippet_length: 700
  extraction:
    enabled: true
    mode: hybrid
    store_payload: true
    llm_max_tokens: 800
    compact_output: false
    llm_prompt_extraction: "<role>\nТы — юрист, извлекающий сведения об экспертизе проектной документации\nв договоре ПИР. Не оценивай риски. Только заполняй поля строго по тексту.\n</role>\n\n<context>\n{context}\n</context>\n\n<task>\nЗаполни строго следующие поля:\n\nexpertise_mentioned — упоминается ли экспертиза проектной документации\n  (allowed: yes / no).\n\nexpertise_type — вид экспертизы\n  (allowed: state / non_state / not_specified / not_found).\n\nwho_submits_to_expertise — кто подаёт документацию на экспертизу\n  (allowed: contractor / client / jointly / not_specified / not_found).\n\nwho_pays_expertise — кто оплачивает экспертизу\n  (allowed: contractor / client / jointly / not_specified / not_found).\n\npayment_linked_to_positive_conclusion — привязана ли оплата к положительному заключению\n  (allowed: yes / no / not_found).\n\nnegative_conclusion_consequences — последствия отрицательного заключения\n  (allowed: rework_free / rework_paid / termination / not_specified / not_found).\n\
      \nЕсли данные отсутствуют: при отсутствии упоминания экспертизы указывай\nexpertise_mentioned = \"no\", а остальные поля = \"not_found\".\n</task>\n\n<rules>\n1. expertise_type: \"state\" — государственная экспертиза; \"non_state\" —\n   негосударственная; \"not_specified\" — вид не уточнён; \"not_found\" — экспертиза не упомянута.\n2. who_submits_to_expertise / who_pays_expertise: \"contractor\" — подрядчик;\n   \"client\" — заказчик; \"jointly\" — совместно; \"not_specified\" — вопрос затронут\n   без ясного распределения; \"not_found\" — экспертиза не упомянута.\n3. payment_linked_to_positive_conclusion: \"yes\" — оплата или окончательный расчёт\n   прямо увязаны с положительным заключением; \"no\" — экспертиза есть, но связи нет;\n   \"not_found\" — экспертиза не упомянута.\n4. negative_conclusion_consequences: \"rework_free\" — безвозмездная доработка;\n   \"rework_paid\" — доработка за отдельную оплату; \"termination\" — расторжение/отказ;\n   \"not_specified\" — последствие\
      \ неясно; \"not_found\" — тема не раскрыта.\n5. Не добавляй ключи, не входящие в список полей.\n6. Верни только JSON.\n</rules>\n"
    fields:
    - name: expertise_mentioned
      type: string
      label: Экспертиза упомянута
      presentation: badge
      display_in_grid: false
      display_priority: 5
      allowed_values:
