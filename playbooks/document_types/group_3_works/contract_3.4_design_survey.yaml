  - id: insurance_professional_liability
    name: "Страхование профессиональной ответственности проектировщика"
    description: >
      Фактографическая проверка наличия и условий страхования профессиональной
      ответственности подрядчика (проектировщика / изыскателя) в договоре на выполнение
      проектных и изыскательских работ (ПИР) в соответствии со ст. 55.5-1 Градостроительного
      кодекса РФ. Страхование профессиональной ответственности — обязательное требование
      для членов саморегулируемых организаций (СРО) проектировщиков и изыскателей,
      а также типичное договорное условие, защищающее заказчика от убытков, вызванных
      ошибками в проектной документации. Проверка выявляет четыре критических аспекта:
      (1) предусмотрено ли в договоре требование о страховании профессиональной
      ответственности подрядчика — базовое условие защиты заказчика; (2) минимальная
      сумма страхового покрытия — определяет максимальный объём возмещения, которое
      страховая компания выплатит заказчику при наступлении страхового случая (типично
      5 000 000 — 50 000 000 рублей в зависимости от уровня ответственности и стоимости
      объекта); (3) обязанность подрядчика поддерживать страхование на весь срок действия
      договора (включая гарантийный период) — защита заказчика от ситуации, когда страховой
      полис истекает до завершения работ или до истечения гарантийного срока; (4) обязанность
      подрядчика предоставить копию страхового полиса заказчику — позволяет заказчику
      проверить действительность страхования, условия покрытия и сроки действия полиса.
      Отсутствие или неполнота регулирования страхования профессиональной ответственности
      создаёт для заказчика риск невозможности получения возмещения убытков от страховой
      компании в случае ошибок в проектной документации, а для подрядчика — риск
      исключения из СРО за несоблюдение обязательных требований членства. Важно: данный
      check проверяет именно страхование профессиональной ответственности (внешний механизм
      защиты через страховую компанию), а не лимит ответственности подрядчика (cap — внутренний
      механизм ограничения, Check 16) и не членство в СРО (Check 22), хотя эти институты
      связаны между собой.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "medium"
