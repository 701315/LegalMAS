# CHECK 14: Субподряд и уступка прав
# ──────────────────────────────────────────────────────────────────────────
- id: assignment_and_subcontracting
  name: "Субподряд и уступка прав (ст. 706 ГК РФ)"
  description: "Проверяет ограничения на привлечение субподрядчиков и уступку прав"
  legal_base: "ст. 706 ГК РФ"
  triggers: ~
  ui_mode: "field_extraction"
  severity: "medium"
  origin: "DOCUMENT_TYPE"
  detector_type: "hybrid"
  rules:
    keywords:
      - "субподрядчик"
      - "субподряд"
      - "привлечение третьих лиц"
      - "с согласия заказчика"
      - "без согласия"
      - "уступка"
      - "генеральный проектировщик"
    keyword_mode: "any"
    regex_patterns:
      - "(?i)субподряд"
      - "(?i)привлечен(ие|ия)\\s+треть(их|его)"
      - "(?i)уступк(а|и)\\s+прав"
  llm:
    prompt_template: |
      [КОНТЕКСТ]
      Ты — юрист, анализирующий договор ПИР.
      Проверяется только один вопрос: ограничения на привлечение субподрядчиков
      и уступку прав по договору.

      Важно:
      — Анализируй только положения о субподряде, привлечении третьих лиц и уступке прав.
      — Не оценивай риск и не смешивай субподряд с авторским надзором.
      — Если условие не установлено прямо, не домысливай.

      [ЗАДАЧА]
      1. Установить, допускается ли привлечение субподрядчиков.
      2. Определить условия привлечения.
      3. Установить, отвечает ли подрядчик за субподрядчиков.
      4. Установить, допускается ли уступка прав по договору.

      [ПРАВИЛА]
      1. subcontracting_allowed = "yes_with_consent" — допускается с согласия заказчика;
         "yes_without_consent" — допускается без согласия;
         "prohibited" — запрещено; "not_found" — тема отсутствует.
      2. contractor_liable_for_subs = "yes" — подрядчик отвечает за действия субподрядчиков;
         "no" — тема раскрыта, но ответственность не установлена;
         "not_found" — тема отсутствует.
      3. assignment_allowed = "yes_with_consent" — допускается с согласия;
         "yes_without_consent" — допускается без согласия;
         "prohibited" — запрещена; "not_found" — тема отсутствует.
      4. Не путай субподряд с привлечением экспертов или консультантов заказчика.
      5. Не путай уступку с переменой стороны при реорганизации.
      6. Если тема субподряда есть, но условие сформулировано неясно,
         используй "yes_with_consent" по умолчанию ГК РФ.
      7. Если договор молчит и о субподряде, и об уступке — все = "not_found".

      [ПРИМЕРЫ (FEW-SHOT)]
      Пример 1 — субподряд и уступка урегулированы:
      Текст: «Подрядчик вправе привлекать субподрядчиков только с письменного
      согласия Заказчика. Подрядчик несёт ответственность за действия
      субподрядчиков как за свои собственные. Уступка прав по договору
      допускается только с письменного согласия другой стороны.»

      Ответ:
      {
        "subcontracting_allowed": "yes_with_consent",
        "contractor_liable_for_subs": "yes",
        "assignment_allowed": "yes_with_consent",
        "evidence": [
          "Подрядчик вправе привлекать субподрядчиков только с письменного согласия Заказчика.",
          "Подрядчик несёт ответственность за действия субподрядчиков как за свои собственные.",
          "Уступка прав по договору допускается только с письменного согласия другой стороны."
        ]
      }

      Пример 2 — тема не раскрыта:
      Текст: «Подрядчик выполняет работы самостоятельно.»

      Ответ:
      {
        "subcontracting_allowed": "prohibited",
        "contractor_liable_for_subs": "not_found",
        "assignment_allowed": "not_found",
        "evidence": [
          "Подрядчик выполняет работы самостоятельно."
        ]
      }

      [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
      1. Разграничены ли субподряд и уступка прав?
      2. Есть ли явное условие о согласии заказчика?
      3. Установлена ли ответственность подрядчика за субподрядчиков?
      4. Не перепутаны ли уступка и реорганизация?
      5. Все ли ключи JSON совпадают со schema?

      [ФОРМАТ ОТВЕТА]
      Верни строго JSON:
      {
        "subcontracting_allowed": "<yes_with_consent / yes_without_consent / prohibited / not_found>",
        "contractor_liable_for_subs": "<yes / no / not_found>",
        "assignment_allowed": "<yes_with_consent / yes_without_consent / prohibited / not_found>",
        "evidence": ["<цитата 1>", "<цитата 2>"]
      }
    prompt_file: null
    context_k: 5
    temperature: 0.0
    max_tokens: 420
  retrieval:
    corpus_scope: "document"
    context_k: 5
    max_chunks: 6
    boost_keywords:
      - "субподрядчик"
      - "субподряд"
      - "привлечение третьих лиц"
      - "уступка прав"
    negative_keywords:
      - "экспертиза"
      - "форс-мажор"
      - "неустойка"
      - "подсудность"
    rerank: true
    filters: {}
  enrichment_hints:
    preferred_segment_types:
      - "clause"
      - "article"
    excluded_segment_types:
      - "signature_block"
    preferred_clause_functions:
      - "procedures"
      - "procedures"
  evidence:
    required: true
    min_snippet_length: 30
    max_snippet_length: 500
  extraction:
    enabled: true
    mode: "hybrid"
    store_payload: true
    llm_max_tokens: 450

    compact_output: false

    llm_prompt_extraction: |
      <role>
      Ты — юрист, извлекающий сведения о субподряде и уступке прав
      в договоре ПИР. Не оценивай риски. Только заполняй поля строго по тексту.
      </role>

      <context>
      {context}
      </context>

      <task>
      Заполни строго следующие поля:

      subcontracting_allowed — допустимость привлечения субподрядчиков
        (allowed: yes_with_consent / yes_without_consent / prohibited / not_found).

      contractor_liable_for_subs — ответственность подрядчика за субподрядчиков
        (allowed: yes / no / not_found).

      assignment_allowed — допустимость уступки прав по договору
        (allowed: yes_with_consent / yes_without_consent / prohibited / not_found).

      Если данные отсутствуют: указывай "not_found".
      </task>

      <rules>
      1. subcontracting_allowed: "yes_with_consent" — с согласия заказчика;
         "yes_without_consent" — без согласия; "prohibited" — запрещено;
         "not_found" — тема отсутствует.
      2. contractor_liable_for_subs: "yes" — отвечает за субподрядчиков;
         "no" — тема раскрыта, но ответственность не установлена;
         "not_found" — тема отсутствует.
      3. assignment_allowed: "yes_with_consent" — с согласия;
         "yes_without_consent" — без согласия; "prohibited" — запрещена;
         "not_found" — тема отсутствует.
      4. Не добавляй ключи, не входящие в список полей.
      5. Верни только JSON.
      </rules>
    fields:
      - name: "subcontracting_allowed"
        type: "string"
        label: "Субподряд"
        presentation: "badge"
        display_in_grid: true
        display_priority: 1
        allowed_values:
          - "yes_with_consent"
          - "yes_without_consent"
          - "prohibited"
          - "not_found"
        description: "Допустимость привлечения субподрядчиков."
        required: true
      - name: "contractor_liable_for_subs"
        type: "string"
        label: "Ответственность за субподрядчиков"
        presentation: "badge"
        display_in_grid: true
        display_priority: 2
        allowed_values:
          - "yes"
          - "no"
          - "not_found"
        description: "Отвечает ли подрядчик за действия субподрядчиков."
        required: false
      - name: "assignment_allowed"
        type: "string"
        label: "Уступка прав"
        presentation: "badge"
        display_in_grid: true
        display_priority: 3
        allowed_values:
          - "yes_with_consent"
          - "yes_without_consent"
          - "prohibited"
          - "not_found"
        description: "Допустимость уступки прав по договору."
        required: false

# ──────────────────────────────────────────────────────────────────────────
# CHECK 15: Интеллектуальные права на проектную документацию
# ──────────────────────────────────────────────────────────────────────────
- id: ip_rights_on_documentation
  name: "Интеллектуальные права на ПД (ст. 1296, 1298 ГК РФ)"
  description: |
    Проверяет условия передачи исключительных прав на проектную документацию.
    По умолчанию ИП принадлежат автору/подрядчику. Без явной передачи заказчик
    получает лишь право на однократную реализацию проекта и не сможет использовать
    его повторно (типовая застройка), вносить изменения или передавать третьим лицам.
  legal_base: "ст. 1296, 1298 ГК РФ"
  triggers:
    any:
      - "ip_rights_transfer"
  ui_mode: "field_extraction"
  severity: "high"
  origin: "DOCUMENT_TYPE"
  detector_type: "hybrid"
  rules:
    keywords:
      - "исключительные права"
      - "интеллектуальные права"
      - "авторские права"
      - "передача прав"
      - "отчуждение исключительного права"
      - "лицензия на использование"
      - "право на использование"
      - "тиражирование"
      - "модификация проекта"
    keyword_mode: "any"
    regex_patterns:
      - "(?i)исключительн(ые|ое|ых)\\s+прав"
      - "(?i)интеллектуальн(ые|ых)\\s+прав"
      - "(?i)передач(а|и)\\s+прав.*на.*документац"
  llm:
    prompt_template: |
      [КОНТЕКСТ]
      Ты — юрист, анализирующий договор ПИР.
      Проверяется только один вопрос: условия передачи исключительных
      (интеллектуальных) прав на проектную документацию от подрядчика к заказчику.

      Важно:
      — Анализируй только положения об интеллектуальных правах, лицензиях,
        передаче прав и ограничениях на использование ПД.
      — Не оценивай риск и не делай выводов вне текста.
      — Если вопрос ИП не раскрыт, не применяй диспозитивные нормы ГК
        как факт — просто ставь "not_found".

      [ЗАДАЧА]
      1. Установить статус передачи исключительных прав.
      2. Определить момент перехода прав.
      3. Определить, разрешено ли повторное использование проекта.
      4. Определить, разрешена ли модификация проекта без согласия автора.

      [ПРАВИЛА]
      1. ip_transfer_status = "full_transfer" — полная передача исключительных прав
         заказчику (отчуждение); "license" — лицензия (ограниченное право использования);
         "retained_by_contractor" — права прямо остаются у подрядчика;
         "not_found" — вопрос не раскрыт.
      2. ip_transfer_moment = "upon_payment" — после оплаты;
         "upon_signing" — при подписании договора;
         "upon_acceptance" — при подписании акта приёмки;
         "not_specified" — тема есть, но момент не определён;
         "not_found" — тема отсутствует.
      3. reuse_allowed = "yes" — повторное использование разрешено;
         "no" — прямо запрещено; "unclear" — неясно;
         "not_found" — тема отсутствует.
      4. modification_allowed = "yes" — модификация без согласия автора разрешена;
         "no" — прямо запрещена или требует согласия;
         "unclear" — неясно; "not_found" — тема отсутствует.
      5. Не путай передачу исключительных прав с правом на однократную реализацию проекта.
      6. Не путай лицензию (ограниченное право) с полной передачей.
      7. Если говорится о «праве использования», но без уточнения — это "license".

      [ПРИМЕРЫ (FEW-SHOT)]
      Пример 1 — полная передача прав:
      Текст: «Исключительные права на проектную документацию переходят к Заказчику
      в полном объёме с момента подписания акта сдачи-приёмки и полной оплаты работ.
      Заказчик вправе использовать документацию повторно, вносить в неё изменения
      и передавать третьим лицам без согласия Подрядчика.»

      Ответ:
      {
        "ip_transfer_status": "full_transfer",
        "ip_transfer_moment": "upon_acceptance",
        "reuse_allowed": "yes",
        "modification_allowed": "yes",
        "evidence": [
          "Исключительные права на проектную документацию переходят к Заказчику в полном объёме с момента подписания акта сдачи-приёмки и полной оплаты работ.",
          "Заказчик вправе использовать документацию повторно, вносить в неё изменения и передавать третьим лицам без согласия Подрядчика."
        ]
      }

      Пример 2 — вопрос не раскрыт:
      Текст: «Подрядчик передаёт Заказчику результаты работ в составе,
      предусмотренном договором.»

      Ответ:
      {
        "ip_transfer_status": "not_found",
        "ip_transfer_moment": "not_found",
        "reuse_allowed": "not_found",
        "modification_allowed": "not_found",
        "evidence": []
      }

      [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
      1. Различены ли полная передача прав и лицензия?
      2. Определён ли момент перехода прав как отдельное условие?
      3. Разграничены ли повторное использование и модификация?
      4. Не приняты ли диспозитивные нормы ГК за факт из текста?
      5. Все ли ключи JSON совпадают со schema?

      [ФОРМАТ ОТВЕТА]
      Верни строго JSON:
      {
        "ip_transfer_status": "<full_transfer / license / retained_by_contractor / not_found>",
        "ip_transfer_moment": "<upon_payment / upon_signing / upon_acceptance / not_specified / not_found>",
        "reuse_allowed": "<yes / no / unclear / not_found>",
        "modification_allowed": "<yes / no / unclear / not_found>",
        "evidence": ["<цитата 1>", "<цитата 2>"]
      }
    prompt_file: null
    context_k: 5
    temperature: 0.0
    max_tokens: 480
  retrieval:
    corpus_scope: "document"
    context_k: 5
    max_chunks: 8
    retrieval_profile: "ip_ownership_check"
    boost_keywords:
      - "исключительные права"
      - "интеллектуальные права"
      - "передача прав"
      - "лицензия"
      - "авторские права"
      - "модификация"
      - "повторное использование"
    negative_keywords:
      - "экспертиза"
      - "форс-мажор"
      - "неустойка"
      - "подсудность"
    rerank: true
    filters: {}
  enrichment_hints:
    preferred_segment_types:
      - "clause"
      - "article"
    excluded_segment_types:
      - "signature_block"
    preferred_clause_functions:
      - "rights"
      - "procedures"
  evidence:
    required: true
    min_snippet_length: 40
    max_snippet_length: 600
  extraction:
    enabled: true
    mode: "hybrid"
    store_payload: true
    llm_max_tokens: 550

    compact_output: false

    llm_prompt_extraction: |
      <role>
      Ты — юрист, извлекающий сведения о передаче интеллектуальных прав
      на проектную документацию в договоре ПИР. Не оценивай риски.
      Только заполняй поля строго по тексту.
      </role>

      <context>
      {context}
      </context>

      <task>
      Заполни строго следующие поля:

      ip_transfer_status — статус передачи исключительных прав
        (allowed: full_transfer / license / retained_by_contractor / not_found).

      ip_transfer_moment — момент перехода прав
        (allowed: upon_payment / upon_signing / upon_acceptance / not_specified / not_found).

      reuse_allowed — разрешено ли повторное использование проекта
        (allowed: yes / no / unclear / not_found).

      modification_allowed — разрешена ли модификация без согласия автора
        (allowed: yes / no / unclear / not_found).

      Если данные отсутствуют: указывай "not_found".
      </task>

      <rules>
      1. ip_transfer_status: "full_transfer" — полная передача (отчуждение);
         "license" — ограниченное право использования;
         "retained_by_contractor" — права остаются у подрядчика;
         "not_found" — тема отсутствует.
      2. ip_transfer_moment: "upon_payment" — после оплаты;
         "upon_signing" — при подписании; "upon_acceptance" — при приёмке;
         "not_specified" — момент не определён; "not_found" — тема отсутствует.
      3. reuse_allowed: "yes" — разрешено; "no" — запрещено;
         "unclear" — неясно; "not_found" — тема отсутствует.
      4. modification_allowed: "yes" — разрешена; "no" — запрещена
         или требует согласия; "unclear" — неясно; "not_found" — тема отсутствует.
      5. Не добавляй ключи, не входящие в список полей.
      6. Верни только JSON.
      </rules>
    fields:
      - name: "ip_transfer_status"
        type: "string"
