  - id: initial_data_provision_check
    name: "Исходные данные: перечень, сроки, последствия задержки (ст. 759 ГК РФ)"
    description: >
      Фактографическая проверка режима предоставления исходных данных заказчиком
      в соответствии со ст. 759 ГК РФ. Исходные данные — это документация и информация,
      необходимая для выполнения проектных и изыскательских работ: градостроительный план
      земельного участка (ГПЗУ), технические условия на подключение к сетям инженерно-технического
      обеспечения, результаты ранее выполненных инженерных изысканий, топографические планы,
      геологические и геодезические материалы, а также иные документы, определяющие параметры
      объекта проектирования. Проверка выявляет четыре критических риска: (1) перечень исходных
      данных не согласован сторонами, что создаёт риск споров об объёме обязательств заказчика;
      (2) сроки предоставления не установлены, что делает невозможным контроль за своевременностью
      передачи данных и применение последствий задержки; (3) последствия задержки не предусмотрены,
      что лишает подрядчика механизма защиты от срыва сроков из-за действий заказчика; (4) отсутствует
      оговорка об ответственности заказчика за достоверность переданных данных, что перекладывает
      на подрядчика риск ошибок в исходной информации. Отсутствие или неполнота регулирования
      исходных данных — типичная причина споров о качестве проектной документации и обоснованности
      дополнительных работ.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "исходные данные"
        - "исходно-разрешительная документация"
        - "ГПЗУ"
        - "технические условия"
        - "ТУ на подключение"
        - "материалы изысканий"
        - "перечень исходных данных"
        - "сроки предоставления"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)исходн(ые|ых)\\s+данн"
        - "(?i)ГПЗУ|градостроительн.*план"
        - "(?i)техническ(ие|их)\\s+услови"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор на выполнение проектных и изыскательских работ (ПИР)
        (§ 4 Главы 37 ГК РФ, ст. 759).
        Проверяется только один вопрос: какие исходные данные обязан предоставить
        заказчик, определены ли сроки и последствия задержки.
        Нормативный ориентир:
        - ст. 759 ГК РФ
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли перечень исходных данных.
        2. Определены ли сроки предоставления исходных данных.
        3. Договорное последствие задержки предоставления данных.
        4. Оговорка об ответственности заказчика за достоверность данных.

        [ПРАВИЛА]
        1. Используй только текст документа. Не выдумывай перечень данных, сроки или последствия — извлекай строго из переданного фрагмента.
        2. Для enum-полей при отсутствии данных используй значение "not_defined".
        3. Для полей *_display используй человеко-читаемые значения согласно маппингу.
        4. Различай:
           - "yes" — элемент явно присутствует в тексте договора
           - "no" — тема упоминается, но элемент отсутствует (например, "Заказчик предоставляет исходные данные", но перечень не указан)
           - "not_defined" — тема вообще не упоминается в договоре
           - "specified" — сроки явно указаны (например, "в течение 5 рабочих дней")
           - "deadline_extension" — последствие задержки: продление срока выполнения работ
           - "rework_at_client_cost" — последствие задержки: переделка за счёт заказчика
           - "termination_right" — последствие задержки: право подрядчика на расторжение
        5. В evidence — только точные цитаты из документа с указанием пункта.
        6. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.без комментариев и markdown-обёртки.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — полный набор данных:
        Фрагмент:
        "Заказчик передаёт Подрядчику исходные данные, включая ГПЗУ,
        технические условия на подключение и результаты инженерных изысканий,
        в течение 5 рабочих дней с даты подписания договора. В случае нарушения
        указанного срока срок выполнения работ соразмерно продлевается.
        Заказчик несёт ответственность за полноту и достоверность переданных данных."
        Ответ:
        {
          "initial_data_list_present": "yes",
          "initial_data_list_present_display": "Да, перечень указан",
          "initial_data_deadlines": "specified",
          "initial_data_deadlines_display": "Да, сроки указаны",
          "delay_consequences": "deadline_extension",
          "delay_consequences_display": "Продление срока выполнения работ",
          "data_accuracy_disclaimer": "yes",
          "data_accuracy_disclaimer_display": "Да, оговорка есть",
          "evidence": [
            {
              "clause_ref": "п. 2.1",
              "quote": "Заказчик передаёт Подрядчику исходные данные, включая ГПЗУ, технические условия на подключение и результаты инженерных изысканий, в течение 5 рабочих дней с даты подписания договора."
            },
            {
              "clause_ref": "п. 2.2",
              "quote": "В случае нарушения указанного срока срок выполнения работ соразмерно продлевается."
            },
            {
              "clause_ref": "п. 2.3",
              "quote": "Заказчик несёт ответственность за полноту и достоверность переданных данных."
            }
          ]
        }

        Пример 2 — частичный набор данных:
        Фрагмент:
        "Заказчик предоставляет исходные данные, необходимые для выполнения работ.
        В случае задержки предоставления данных Подрядчик вправе расторгнуть договор."
        Ответ:
        {
          "initial_data_list_present": "no",
          "initial_data_list_present_display": "Нет, перечень не указан",
          "initial_data_deadlines": "not_defined",
          "initial_data_deadlines_display": "Данные не определены",
