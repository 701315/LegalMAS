# ──────────────────────────────────────────────────────────────────────────
# CHECK 22: Членство в СРО проектировщиков
# ──────────────────────────────────────────────────────────────────────────
- id: sro_membership_check
  name: "Членство в СРО проектировщиков (ст. 55.8 ГрК РФ)"
  description: |
    Проверяет наличие в договоре подтверждения членства подрядчика в СРО
    и обязанности поддерживать его на весь срок действия договора.
  legal_base: "ст. 55.8 ГрК РФ"
  triggers:
    any:
      - "sro_required"
  ui_mode: "field_extraction"
  severity: "critical"
  origin: "DOCUMENT_TYPE"
  detector_type: "hybrid"
  rules:
    keywords:
      - "СРО"
      - "саморегулируемая организация"
      - "допуск СРО"
      - "членство в СРО"
      - "свидетельство СРО"
      - "компенсационный фонд"
    keyword_mode: "any"
    regex_patterns:
      - "(?i)\\bСРО\\b"
      - "(?i)саморегулируем(ая|ой)\\s+организац"
      - "(?i)допуск\\s+СРО"
  llm:
    prompt_template: |
      [КОНТЕКСТ]
      Ты — юрист, анализирующий договор ПИР.
      Проверяется только один вопрос: содержит ли договор подтверждение
      членства подрядчика в саморегулируемой организации (СРО)
      и обязательство поддерживать членство на весь срок договора.

      Важно:
      — Анализируй только положения о СРО, допуске, членстве и компенсационном фонде.
      — Не оценивай риск и не смешивай членство в СРО со страхованием.
      — Если условие не установлено прямо, не домысливай.

      [ЗАДАЧА]
      1. Установить, упоминается ли СРО в договоре.
      2. Извлечь наименование или номер СРО.
      3. Установить, предусмотрена ли обязанность поддерживать членство в СРО.
      4. Установить последствия утраты членства.

      [ПРАВИЛА]
      1. sro_mentioned = "yes" — если договор упоминает СРО или членство;
         "no" — если не упоминает.
      2. sro_name_or_number — наименование, номер или реквизиты СРО (текст);
         если не указаны — "not_found".
      3. sro_maintenance_obligation = "yes" — если подрядчик обязан поддерживать
         членство на весь срок договора; "no" — если тема раскрыта,
         но такой обязанности нет; "not_found" — если тема отсутствует.
      4. sro_loss_consequences = "termination_right" — заказчик вправе расторгнуть;
         "notification" — подрядчик обязан уведомить;
         "not_specified" — последствие неясно;
         "not_found" — тема отсутствует.
      5. Не путай СРО проектировщиков с СРО строителей или изыскателей.
      6. Не путай компенсационный фонд с обеспечительным платежом.
      7. Если тема не затронута — sro_mentioned = "no", все остальные = "not_found".

      [ПРИМЕРЫ (FEW-SHOT)]
      Пример 1 — СРО урегулировано:
      Текст: «Подрядчик подтверждает, что является членом СРО
      "Ассоциация проектировщиков" (рег. № СРО-П-123-456).
      Подрядчик обязан поддерживать членство в СРО на весь срок
      действия договора. В случае утраты членства Заказчик вправе
      отказаться от договора.»

      Ответ:
      {
        "sro_mentioned": "yes",
        "sro_name_or_number": "Ассоциация проектировщиков, рег. № СРО-П-123-456",
        "sro_maintenance_obligation": "yes",
        "sro_loss_consequences": "termination_right",
        "evidence": [
          "Подрядчик подтверждает, что является членом СРО «Ассоциация проектировщиков» (рег. № СРО-П-123-456).",
          "Подрядчик обязан поддерживать членство в СРО на весь срок действия договора.",
          "В случае утраты членства Заказчик вправе отказаться от договора."
        ]
      }

      Пример 2 — СРО не упомянуто:
      Текст: «Подрядчик обладает необходимой квалификацией для выполнения работ.»

      Ответ:
      {
        "sro_mentioned": "no",
        "sro_name_or_number": "not_found",
        "sro_maintenance_obligation": "not_found",
        "sro_loss_consequences": "not_found",
        "evidence": []
      }

      [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
      1. Упоминается ли именно СРО проектировщиков?
      2. Извлечены ли реквизиты или наименование СРО?
      3. Есть ли обязанность поддерживать членство?
      4. Есть ли последствия утраты членства?
      5. Все ли ключи JSON совпадают со schema?

      [ФОРМАТ ОТВЕТА]
      Верни строго JSON:
      {
        "sro_mentioned": "<yes / no>",
        "sro_name_or_number": "<текст или not_found>",
        "sro_maintenance_obligation": "<yes / no / not_found>",
        "sro_loss_consequences": "<termination_right / notification / not_specified / not_found>",
        "evidence": ["<цитата 1>", "<цитата 2>"]
      }
    prompt_file: null
    context_k: 4
    temperature: 0.0
    max_tokens: 440
  retrieval:
    corpus_scope: "document"
    context_k: 4
    max_chunks: 6
    boost_keywords:
      - "СРО"
      - "допуск"
      - "членство"
      - "саморегулируемая"
      - "компенсационный фонд"
    negative_keywords:
      - "экспертиза"
      - "форс-мажор"
      - "страхование"
      - "подсудность"
    rerank: true
    filters: {}
  enrichment_hints:
    preferred_segment_types:
      - "clause"
      - "article"
      - "preamble"
    excluded_segment_types:
      - "signature_block"
    preferred_clause_functions:
      - "representations"
      - "representations"
  evidence:
    required: true
    min_snippet_length: 30
    max_snippet_length: 400
  extraction:
    enabled: true
    mode: "hybrid"
    store_payload: true
    llm_max_tokens: 550

    compact_output: false

    llm_prompt_extraction: |
      <role>
      Ты — юрист, извлекающий сведения о членстве подрядчика в СРО
      в договоре ПИР. Не оценивай риски. Только заполняй поля строго по тексту.
      </role>

      <context>
      {context}
      </context>

      <task>
      Заполни строго следующие поля:

      sro_mentioned — упоминается ли СРО в договоре
        (allowed: yes / no).

      sro_name_or_number — наименование или номер СРО
        (текстовое значение или not_found).

      sro_maintenance_obligation — обязанность поддерживать членство в СРО
        (allowed: yes / no / not_found).

      sro_loss_consequences — последствия утраты членства
        (allowed: termination_right / notification / not_specified / not_found).

      Если данные отсутствуют: указывай sro_mentioned = "no",
      остальные = "not_found".
      </task>

      <rules>
      1. sro_mentioned: "yes" — СРО упоминается; "no" — нет.
      2. sro_name_or_number: текст с реквизитами; или "not_found".
      3. sro_maintenance_obligation: "yes" — обязанность есть;
         "no" — тема раскрыта, но обязанности нет; "not_found" — тема отсутствует.
      4. sro_loss_consequences: "termination_right" — право расторгнуть;
         "notification" — обязанность уведомить;
         "not_specified" — последствие неясно; "not_found" — тема отсутствует.
      5. Не добавляй ключи, не входящие в список полей.
      6. Верни только JSON.
      </rules>
    fields:
      - name: "sro_mentioned"
        type: "string"
        label: "СРО упомянуто"
        presentation: "badge"
        display_in_grid: true
        display_priority: 1
        allowed_values:
          - "yes"
          - "no"
        description: "Упоминается ли СРО в договоре."
        required: true
      - name: "sro_name_or_number"
        type: "string"
        label: "Наименование / номер СРО"
        presentation: "text"
        display_in_grid: false
        display_priority: 4
        description: "Наименование или регистрационный номер СРО."
        max_value_chars: 200
        required: false
      - name: "sro_maintenance_obligation"
        type: "string"
        label: "Обязанность поддерживать членство"
        presentation: "badge"
        display_in_grid: true
        display_priority: 2
        allowed_values:
          - "yes"
          - "no"
          - "not_found"
        description: "Обязан ли подрядчик поддерживать членство в СРО."
        required: false
      - name: "sro_loss_consequences"
        type: "string"
        label: "Последствия утраты членства"
        presentation: "badge"
        display_in_grid: true
        display_priority: 3
        allowed_values:
          - "termination_right"
          - "notification"
          - "not_specified"
          - "not_found"
        description: "Последствия утраты подрядчиком членства в СРО."
        required: false

# ──────────────────────────────────────────────────────────────────────────
# CHECK 23: Форс-мажор и обстоятельства непреодолимой силы
# ──────────────────────────────────────────────────────────────────────────
- id: force_majeure
  name: "Форс-мажор и обстоятельства непреодолимой силы (ст. 401 ГК РФ)"
  description: |
    Проверяет наличие оговорки о форс-мажоре, порядок уведомления,
    перечень обстоятельств и последствия для сроков и обязательств.
  legal_base: "ст. 401 ГК РФ"
  triggers: ~
  ui_mode: "field_extraction"
  severity: "medium"
  origin: "DOCUMENT_TYPE"
  detector_type: "hybrid"
  rules:
    keywords:
      - "форс-мажор"
      - "обстоятельства непреодолимой силы"
      - "освобождение от ответственности"
      - "уведомление о форс-мажоре"
    keyword_mode: "any"
    regex_patterns:
      - "(?i)форс[\\s\\-]?мажор"
      - "(?i)непреодолим(ой|ая)\\s+сил"
  llm:
    prompt_template: |
      [КОНТЕКСТ]
      Ты — юрист, анализирующий договор ПИР.
      Проверяется только один вопрос: содержит ли договор оговорку
      о форс-мажоре (обстоятельствах непреодолимой силы), порядок
      уведомления и последствия для сроков и обязательств.

      Важно:
      — Анализируй только положения о форс-мажоре и непреодолимой силе.
      — Не оценивай риск и не смешивай с продлением сроков при задержке заказчика.
      — Если условие не установлено прямо, не домысливай.

      [ЗАДАЧА]
      1. Установить, содержит ли договор оговорку о форс-мажоре.
      2. Установить, определён ли перечень обстоятельств.
      3. Установить, определён ли срок уведомления о форс-мажоре.
      4. Определить последствия для сроков выполнения работ.
      5. Установить, предусмотрено ли право на расторжение при длительном форс-мажоре.

      [ПРАВИЛА]
      1. fm_clause_present = "yes" — оговорка о форс-мажоре есть;
         "no" — тема раскрыта, но оговорки нет;
         "not_found" — тема отсутствует.
      2. fm_events_listed = "yes" — перечислены конкретные обстоятельства;
         "general_only" — только общая формулировка без перечня;
         "not_found" — тема отсутствует.
      3. fm_notification_period — срок уведомления (текст);
         если не указан — "not_found".
      4. fm_deadline_extension = "yes" — сроки работ продлеваются
         на период форс-мажора; "no" — тема раскрыта,
         но продления нет; "not_found" — тема отсутствует.
      5. fm_prolonged_termination = "yes" — при длительном форс-мажоре
         стороны вправе расторгнуть; "no" — тема раскрыта,
         но такого права нет; "not_found" — тема отсутствует.
      6. fm_prolonged_period — период, после которого допускается расторжение
         (текст); если не указан — "not_found".
      7. Не путай форс-мажор с задержкой согласования заказчиком.

      [ПРИМЕРЫ (FEW-SHOT)]
      Пример 1 — форс-мажор урегулирован:
      Текст: «Стороны освобождаются от ответственности за неисполнение
      обязательств, вызванное обстоятельствами непреодолимой силы:
      стихийные бедствия, военные действия, эпидемии, изменения
      законодательства. Сторона, для которой наступили такие обстоятельства,
      обязана уведомить другую сторону в течение 5 рабочих дней.
      Сроки выполнения работ продлеваются на период действия
      форс-мажора. Если форс-мажор продолжается более 90 дней,
      каждая сторона вправе расторгнуть договор.»

      Ответ:
      {
        "fm_clause_present": "yes",
        "fm_events_listed": "yes",
        "fm_notification_period": "5 рабочих дней",
        "fm_deadline_extension": "yes",
        "fm_prolonged_termination": "yes",
        "fm_prolonged_period": "90 дней",
        "evidence": [
          "Стороны освобождаются от ответственности за неисполнение обязательств, вызванное обстоятельствами непреодолимой силы: стихийные бедствия, военные действия, эпидемии, изменения законодательства.",
          "Сторона, для которой наступили такие обстоятельства, обязана уведомить другую сторону в течение 5 рабочих дней.",
          "Сроки выполнения работ продлеваются на период действия форс-мажора.",
          "Если форс-мажор продолжается более 90 дней, каждая сторона вправе расторгнуть договор."
        ]
      }

      Пример 2 — тема не раскрыта:
      Текст: «Договор действует до полного исполнения обязательств.»

      Ответ:
      {
        "fm_clause_present": "not_found",
        "fm_events_listed": "not_found",
        "fm_notification_period": "not_found",
        "fm_deadline_extension": "not_found",
        "fm_prolonged_termination": "not_found",
        "fm_prolonged_period": "not_found",
        "evidence": []
      }

      [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
      1. Есть ли именно оговорка о форс-мажоре, а не общая ссылка на закон?
      2. Перечислены ли конкретные обстоятельства или только общая формулировка?
      3. Есть ли срок уведомления в днях?
      4. Продлеваются ли сроки работ на период форс-мажора?
      5. Есть ли право на расторжение при длительном форс-мажоре?
      6. Все ли ключи JSON совпадают со schema?

      [ФОРМАТ ОТВЕТА]
      Верни строго JSON:
      {
        "fm_clause_present": "<yes / no / not_found>",
        "fm_events_listed": "<yes / general_only / not_found>",
        "fm_notification_period": "<текст или not_found>",
        "fm_deadline_extension": "<yes / no / not_found>",
        "fm_prolonged_termination": "<yes / no / not_found>",
        "fm_prolonged_period": "<текст или not_found>",
        "evidence": ["<цитата 1>", "<цитата 2>"]
      }
    prompt_file: null
    context_k: 5
    temperature: 0.0
    max_tokens: 500
  retrieval:
    corpus_scope: "document"
    context_k: 5
    max_chunks: 6
    retrieval_profile: "force_majeure_check"
    boost_keywords:
      - "форс-мажор"
      - "непреодолимая сила"
      - "освобождение от ответственности"
      - "уведомление"
    negative_keywords:
      - "экспертиза"
      - "подсудность"
      - "неустойка"
      - "аванс"
    rerank: true
    filters: {}
  enrichment_hints:
    preferred_segment_types:
      - "clause"
      - "article"
    excluded_segment_types:
      - "signature_block"
    preferred_clause_functions:
      - "limitations"
  evidence:
    required: true
    min_snippet_length: 40
    max_snippet_length: 700
  extraction:
    enabled: true
    mode: "hybrid"
    store_payload: true
    llm_max_tokens: 800

    compact_output: false

    llm_prompt_extraction: |
      <role>
      Ты — юрист, извлекающий сведения о форс-мажоре в договоре ПИР.
      Не оценивай риски. Только заполняй поля строго по тексту.
      </role>

      <context>
      {context}
      </context>

      <task>
      Заполни строго следующие поля:

      fm_clause_present — есть ли оговорка о форс-мажоре
        (allowed: yes / no / not_found).

      fm_events_listed — перечислены ли обстоятельства
        (allowed: yes / general_only / not_found).

      fm_notification_period — срок уведомления
        (текстовое значение или not_found).

      fm_deadline_extension — продлеваются ли сроки работ
        (allowed: yes / no / not_found).

      fm_prolonged_termination — право расторгнуть при длительном форс-мажоре
        (allowed: yes / no / not_found).

      fm_prolonged_period — период, после которого допускается расторжение
        (текстовое значение или not_found).

      Если данные отсутствуют: указывай "not_found".
      </task>

      <rules>
      1. fm_clause_present: "yes" — оговорка есть; "no" — тема раскрыта,
         но нет; "not_found" — тема отсутствует.
      2. fm_events_listed: "yes" — конкретные обстоятельства перечислены;
         "general_only" — только общая формулировка; "not_found" — тема отсутствует.
      3. fm_notification_period: текст с указанием срока; или "not_found".
      4. fm_deadline_extension: "yes" — продлеваются; "no" — нет;
         "not_found" — тема отсутствует.
      5. fm_prolonged_termination: "yes" — право расторгнуть есть;
         "no" — нет; "not_found" — тема отсутствует.
      6. fm_prolonged_period: текст с указанием периода; или "not_found".
      7. Не добавляй ключи, не входящие в список полей.
      8. Верни только JSON.
      </rules>
    fields:
      - name: "fm_clause_present"
        type: "string"
        label: "Оговорка о форс-мажоре"
        presentation: "badge"
        display_in_grid: true
        display_priority: 1
        allowed_values:
          - "yes"
          - "no"
          - "not_found"
        description: "Содержит ли договор оговорку о форс-мажоре."
        required: true
      - name: "fm_events_listed"
        type: "string"
        label: "Перечень обстоятельств"
        presentation: "badge"
        display_in_grid: false
        display_priority: 4
        allowed_values:
          - "yes"
          - "general_only"
          - "not_found"
        description: "Перечислены ли конкретные форс-мажорные обстоятельства."
        required: false
      - name: "fm_notification_period"
        type: "string"
        label: "Срок уведомления"
        presentation: "text"
        display_in_grid: true
        display_priority: 2
        description: "Срок уведомления о наступлении форс-мажора."
        max_value_chars: 100
        required: false
      - name: "fm_deadline_extension"
        type: "string"
        label: "Продление сроков"
        presentation: "badge"
        display_in_grid: true
        display_priority: 3
        allowed_values:
          - "yes"
          - "no"
          - "not_found"
        description: "Продлеваются ли сроки работ на период форс-мажора."
        required: false
      - name: "fm_prolonged_termination"
        type: "string"
        label: "Расторжение при длительном ФМ"
        presentation: "badge"
        display_in_grid: false
        display_priority: 5
        allowed_values:
          - "yes"
          - "no"
          - "not_found"
        description: "Право расторгнуть при длительном форс-мажоре."
        required: false
      - name: "fm_prolonged_period"
        type: "string"
        label: "Период для расторжения"
        presentation: "text"
        display_in_grid: false
        display_priority: 6
        description: "Период форс-мажора, после которого допускается расторжение."
        max_value_chars: 100
        required: false

# ──────────────────────────────────────────────────────────────────────────
# CHECK 24: Претензионный порядок и подсудность
# ──────────────────────────────────────────────────────────────────────────
- id: dispute_resolution_and_pretension
  name: "Претензионный порядок и подсудность (ст. 452 ГК РФ, АПК РФ)"
  description: |
    Проверяет наличие обязательного претензионного порядка урегулирования споров,
    сроков направления и рассмотрения претензии, подсудности или арбитражной оговорки.
    Без претензионного порядка иск может быть возвращён судом.
  legal_base: "ст. 452 ГК РФ, АПК РФ"
  triggers: ~
  ui_mode: "field_extraction"
  severity: "high"
  origin: "DOCUMENT_TYPE"
  detector_type: "hybrid"
  rules:
    keywords:
      - "претензия"
      - "претензионный порядок"
      - "досудебное урегулирование"
      - "срок рассмотрения претензии"
      - "подсудность"
      - "арбитражная оговорка"
      - "медиация"
    keyword_mode: "any"
    regex_patterns:
      - "(?i)претензионн(ый|ого)\\s+порядк"
      - "(?i)досудебн(ое|ого)\\s+урегулирован"
  llm:
    prompt_template: |
      [КОНТЕКСТ]
      Ты — юрист, анализирующий договор ПИР.
      Проверяется только один вопрос: наличие и содержание претензионного
      порядка урегулирования споров.

      Важно:
      — Анализируй только положения о претензиях, спорах.
      — Не оценивай риск и не смешивай с разделом об ответственности.
      — Если условие не установлено прямо, не домысливай.

      [ЗАДАЧА]
      1. Установить, предусмотрен ли обязательный претензионный порядок.
      2. Извлечь срок направления претензии.
      3. Извлечь срок рассмотрения претензии.
      4. Извлечь наименование конкретного суда или арбитража.

      [ПРАВИЛА]
      1. pretension_procedure_present = "yes" — если обязательный претензионный
         порядок прямо установлен (обязанность направить претензию до суда);
         "not_found" — если раздел о претензиях отсутствует.
      2. pretension_sending_period — срок направления претензии
         с момента нарушения (текст); если не указан — "not_found".
      3. pretension_review_period — срок рассмотрения претензии
         получателем (текст); если не указан — "not_found".
      4. Не путай раздел о спорах с разделом об ответственности.
      5. Не путай претензионный порядок с порядком замечаний по приёмке.

      [ПРИМЕРЫ (FEW-SHOT)]
      Пример 1 — претензионный порядок установлен:
      Текст: «Стороны обязуются принять все меры к урегулированию споров
      путём переговоров. Сторона, считающая свои права нарушенными,
      направляет другой стороне письменную претензию. Срок рассмотрения
      претензии — 30 календарных дней.»

      Ответ:
      {
        "pretension_procedure_present": "yes",
        "pretension_sending_period": "not_found",
        "pretension_review_period": "30 календарных дней",
        "evidence": [
          "Сторона, считающая свои права нарушенными, направляет другой стороне письменную претензию.",
          "Срок рассмотрения претензии — 30 календарных дней."
        ]
      }

      Пример 2 — раздел о спорах отсутствует:
      Текст: «Все спорные вопросы решаются в соответствии с законодательством РФ.»

      Ответ:
      {
        "pretension_procedure_present": "not_found",
        "pretension_sending_period": "not_found",
        "pretension_review_period": "not_found",
        "evidence": [
          "Все спорные вопросы решаются в соответствии с законодательством РФ."
        ]
      }

      [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
      1. Есть ли в тексте явная обязанность направить претензию до суда?
      2. Указан ли срок рассмотрения претензии в днях?
      3. Назван ли конкретный суд или арбитраж?
      4. Не спутан ли раздел о спорах с разделом об ответственности?
      5. Все ли значения enum соответствуют schema?

      [ФОРМАТ ОТВЕТА]
      Верни строго JSON:
      {
        "pretension_procedure_present": "<yes / not_found>",
        "pretension_sending_period": "<текст или not_found>",
        "pretension_review_period": "<текст или not_found>",
        "evidence": ["<цитата 1>", "<цитата 2>"]
      }
    prompt_file: null
    context_k: 5
    temperature: 0.0
    max_tokens: 460
  retrieval:
    corpus_scope: "document"
    context_k: 5
    max_chunks: 8
    retrieval_profile: "dispute_resolution_check"
    boost_keywords:
      - "претензия"
      - "претензионный порядок"
      - "досудебное урегулирование"
      - "подсудность"
    negative_keywords:
      - "акт"
      - "смета"
      - "техническое задание"
      - "неустойка"
    rerank: true
    filters: {}
  enrichment_hints:
    preferred_segment_types:
      - "clause"
      - "article"
    excluded_segment_types:
      - "signature_block"
    preferred_clause_functions:
      - "dispute_resolution"
      - "procedures"
  evidence:
    required: true
    min_snippet_length: 40
    max_snippet_length: 600
  extraction:
    enabled: true
    mode: "hybrid"
    store_payload: true
    llm_max_tokens: 450

    compact_output: false

    llm_prompt_extraction: |
      <role>
      Ты — юрист, извлекающий сведения о претензионном порядке
      и подсудности в договоре ПИР. Не оценивай риски.
      Только заполняй поля строго по тексту.
      </role>

      <context>
      {context}
      </context>

      <task>
      Заполни строго следующие поля:

      pretension_procedure_present — предусмотрен ли обязательный претензионный порядок
        (allowed: yes / not_found).

      pretension_sending_period — срок направления претензии
        (текстовое значение или not_found).

      pretension_review_period — срок рассмотрения претензии
        (текстовое значение или not_found).

      Если данные отсутствуют: указывай "not_found".
      </task>

      <rules>
      1. pretension_procedure_present: "yes" — обязанность направить претензию
         прямо установлена; "not_found" — раздел отсутствует.
      2. pretension_sending_period: текст с указанием срока; или "not_found".
      3. pretension_review_period: текст с указанием срока; или "not_found".
      4. Не добавляй ключи, не входящие в список полей.
      5. Верни только JSON.
      </rules>
    fields:
      - name: "pretension_procedure_present"
        type: "string"
        label: "Претензионный порядок"
        presentation: "badge"
        display_in_grid: true
        display_priority: 1
        allowed_values:
          - "yes"
          - "not_found"
        description: "Предусмотрен ли обязательный претензионный порядок."
        required: true
      - name: "pretension_sending_period"
        type: "string"
        label: "Срок направления претензии"
        presentation: "text"
        display_in_grid: false
        display_priority: 4
        description: "Срок направления претензии с момента нарушения."
        max_value_chars: 100
        required: false
      - name: "pretension_review_period"
        type: "string"
        label: "Срок рассмотрения претензии"
        presentation: "text"
        display_in_grid: true
        display_priority: 2
        description: "Срок рассмотрения претензии другой стороной."
        max_value_chars: 100
        required: false

# ──────────────────────────────────────────────────────────────────────────
# CHECK 25: Формат и количество экземпляров передаваемой документации
# ──────────────────────────────────────────────────────────────────────────
- id: documentation_delivery_format
  name: "Формат и количество экземпляров передаваемой документации"
  description: |
    Проверяет наличие условий о формате (бумажный/электронный),
    количестве экземпляров, формате файлов (DWG, PDF, IFC).
  legal_base: "ГК РФ (общие положения), ПП РФ № 87"
  triggers: ~
  ui_mode: "field_extraction"
  severity: "high"
  origin: "DOCUMENT_TYPE"
  detector_type: "hybrid"
  rules:
    keywords:
      - "экземпляр"
      - "комплект документации"
      - "бумажный носитель"
      - "электронный вид"
      - "формат DWG"
      - "формат PDF"
      - "формат IFC"
      - "электронная версия"
      - "количество копий"
      - "CD"
      - "DVD"
      - "flash-накопитель"
    keyword_mode: "any"
    regex_patterns:
      - "(?i)\\d+\\s*(экземпляр|комплект)"
      - "(?i)(бумажн|электронн)(ый|ом|ой)\\s+(носител|вид|версии|формат)"
  llm:
    prompt_template: |
      [КОНТЕКСТ]
      Ты — юрист, анализирующий договор ПИР.
      Проверяется только один вопрос: в каком формате и количестве
      экземпляров передаётся проектная документация заказчику.

      Важно:
      — Анализируй только положения о формате передачи, количестве экземпляров
        и форматах электронных файлов.
      — Не оценивай риск и не смешивай с порядком приёмки.
      — Если условие не установлено прямо, не домысливай.

      [ЗАДАЧА]
      1. Установить, предусмотрена ли передача на бумажном носителе.
      2. Извлечь количество бумажных экземпляров.
      3. Установить, предусмотрена ли передача в электронном виде.
      4. Извлечь формат электронных файлов.
      5. Установить, предусмотрена ли передача на физическом носителе (CD/DVD/flash).

      [ПРАВИЛА]
      1. paper_delivery = "yes" — бумажная передача предусмотрена;
         "no" — тема раскрыта, но бумажная передача не предусмотрена;
         "not_found" — тема отсутствует.
      2. paper_copies_count — количество экземпляров (число);
         если не указано — null.
      3. electronic_delivery = "yes" — электронная передача предусмотрена;
         "no" — тема раскрыта, но нет; "not_found" — тема отсутствует.
      4. electronic_format — перечень форматов (текст, например "DWG, PDF");
         если не указан — "not_found".
      5. physical_media = "yes" — передача на CD/DVD/flash предусмотрена;
         "no" — тема раскрыта, но нет; "not_found" — тема отсутствует.
      6. Не путай формат передачи с порядком приёмки.
      7. Если тема не затронута — все = "not_found".

      [ПРИМЕРЫ (FEW-SHOT)]
      Пример 1 — формат определён:
      Текст: «Документация передаётся в 4 экземплярах на бумажном носителе
      и в электронном виде на flash-накопителе в форматах DWG и PDF.»

      Ответ:
      {
        "paper_delivery": "yes",
        "paper_copies_count": 4,
        "electronic_delivery": "yes",
        "electronic_format": "DWG, PDF",
        "physical_media": "yes",
        "evidence": [
          "Документация передаётся в 4 экземплярах на бумажном носителе и в электронном виде на flash-накопителе в форматах DWG и PDF."
        ]
      }

      Пример 2 — тема не раскрыта:
      Текст: «Результаты работ передаются Заказчику.»

      Ответ:
      {
        "paper_delivery": "not_found",
        "paper_copies_count": null,
        "electronic_delivery": "not_found",
        "electronic_format": "not_found",
        "physical_media": "not_found",
        "evidence": [
          "Результаты работ передаются Заказчику."
        ]
      }

      [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
      1. Разграничены ли бумажная и электронная передача?
      2. Извлечено ли конкретное количество экземпляров?
      3. Извлечены ли конкретные форматы файлов?
      4. Есть ли указание на физический носитель?
      5. Все ли ключи JSON совпадают со schema?

      [ФОРМАТ ОТВЕТА]
      Верни строго JSON:
      {
        "paper_delivery": "<yes / no / not_found>",
        "paper_copies_count": "<число или null>",
        "electronic_delivery": "<yes / no / not_found>",
        "electronic_format": "<текст или not_found>",
        "physical_media": "<yes / no / not_found>",
        "evidence": ["<цитата 1>"]
      }
    prompt_file: null
    context_k: 5
    temperature: 0.0
    max_tokens: 440
  retrieval:
    retrieval_profile: "technical_documentation_check"
    corpus_scope: "document"
    context_k: 5
    max_chunks: 6
    boost_keywords:
