# ──────────────────────────────────────────────────────────────────────────
# CHECK 5: Экспертиза ПД: порядок прохождения и привязка оплаты
# ──────────────────────────────────────────────────────────────────────────
- id: expertise_procedure_and_payment_link
  name: "Экспертиза ПД: порядок прохождения и привязка оплаты (ст. 49 ГрК РФ)"
  description: |
    Проверяет наличие условий о прохождении экспертизы ПД, распределение обязанностей
    по подаче и оплате экспертизы, привязку окончательного расчёта к получению
    положительного заключения. Без привязки оплаты к экспертизе заказчик рискует
    оплатить непригодный результат.
  triggers:
    any:
      - "expertise_required"
  ui_mode: "field_extraction"
  severity: "critical"
  origin: "DOCUMENT_TYPE"
  detector_type: "hybrid"
  rules:
    keywords:
      - "экспертиза проектной документации"
      - "положительное заключение"
      - "отрицательное заключение"
      - "государственная экспертиза"
      - "негосударственная экспертиза"
      - "оплата после экспертизы"
      - "окончательный расчёт"
    keyword_mode: "any"
    regex_patterns:
      - "(?i)положительн(ое|ого)\\s+заключени"
      - "(?i)экспертиз(а|ы|у)\\s+проектн"
      - "(?i)(окончательн|финальн).*оплат.*после.*заключени"
  llm:
    prompt_template: |
      [КОНТЕКСТ]
      Ты — юрист, анализирующий договор ПИР.
      Проверяется только один вопрос: порядок прохождения экспертизы проектной документации,
      распределение обязанностей по подаче и оплате экспертизы и связь оплаты работ
      с получением положительного заключения.

      Важно:
      — Анализируй только положения об экспертизе, заключении экспертизы и окончательном расчёте.
      — Не оценивай риск и не делай выводов вне текста.
      — Если экспертиза не упоминается, не делай выводов по аналогии.

      [ЗАДАЧА]
      1. Установить, упоминается ли экспертиза проектной документации.
      2. Определить вид экспертизы.
      3. Определить, кто подаёт документацию на экспертизу.
      4. Определить, кто оплачивает экспертизу.
      5. Установить, привязан ли окончательный расчёт к положительному заключению.
      6. Установить последствия отрицательного заключения экспертизы.

      [ПРАВИЛА]
      1. expertise_mentioned = "yes" — если договор прямо говорит об экспертизе ПД;
         "no" — если не говорит.
      2. expertise_type = "state" — государственная экспертиза;
         "non_state" — негосударственная;
         "not_specified" — экспертиза упомянута без указания вида;
         "not_found" — экспертиза не упомянута.
      3. who_submits_to_expertise / who_pays_expertise:
         "contractor" — подрядчик; "client" — заказчик; "jointly" — совместно;
         "not_specified" — вопрос затронут без ясного распределения;
         "not_found" — экспертиза не упомянута.
      4. payment_linked_to_positive_conclusion = "yes" — если окончательный расчёт,
         оплата этапа или сдача результата прямо связаны с положительным заключением;
         "no" — если экспертиза есть, но связи с оплатой нет; "not_found" — экспертиза не упомянута.
      5. negative_conclusion_consequences = "rework_free" — безвозмездная доработка;
         "rework_paid" — доработка за отдельную плату;
         "termination" — право расторгнуть или отказаться от договора;
         "not_specified" — отрицательное заключение упомянуто без ясного последствия;
         "not_found" — тема не раскрыта.
      6. Не подменяй экспертизу согласованием с заказчиком.
      7. Не подменяй оплату экспертизы оплатой проектных работ.

      [ПРИМЕРЫ (FEW-SHOT)]
      Пример 1 — экспертиза и оплата урегулированы:
      Текст: «Проектная документация подлежит государственной экспертизе.
      Подрядчик обеспечивает подготовку и подачу документации, Заказчик
      оплачивает стоимость экспертизы. Окончательный расчёт по договору
      производится после получения положительного заключения. В случае
      отрицательного заключения Подрядчик обязан безвозмездно устранить замечания.»

      Ответ:
      {
        "expertise_mentioned": "yes",
        "expertise_type": "state",
        "who_submits_to_expertise": "contractor",
        "who_pays_expertise": "client",
        "payment_linked_to_positive_conclusion": "yes",
        "negative_conclusion_consequences": "rework_free",
        "evidence": [
          "Проектная документация подлежит государственной экспертизе.",
          "Подрядчик обеспечивает подготовку и подачу документации, Заказчик оплачивает стоимость экспертизы.",
          "Окончательный расчёт по договору производится после получения положительного заключения.",
          "В случае отрицательного заключения Подрядчик обязан безвозмездно устранить замечания."
        ]
      }

      Пример 2 — экспертиза не упомянута:
      Текст: «Результат работ передаётся Заказчику по акту сдачи-приёмки.»

      Ответ:
      {
        "expertise_mentioned": "no",
        "expertise_type": "not_found",
        "who_submits_to_expertise": "not_found",
        "who_pays_expertise": "not_found",
        "payment_linked_to_positive_conclusion": "not_found",
        "negative_conclusion_consequences": "not_found",
        "evidence": []
      }

      [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
      1. Упоминается ли именно экспертиза ПД, а не внутреннее согласование?
      2. Разделены ли обязанности по подаче и оплате экспертизы?
      3. Проверена ли именно привязка оплаты к положительному заключению?
      4. Есть ли прямое последствие отрицательного заключения?
      5. Все ли enum-поля заполнены допустимыми значениями?

      [ФОРМАТ ОТВЕТА]
      Верни строго JSON:
      {
        "expertise_mentioned": "<yes / no>",
        "expertise_type": "<state / non_state / not_specified / not_found>",
        "who_submits_to_expertise": "<contractor / client / jointly / not_specified / not_found>",
        "who_pays_expertise": "<contractor / client / jointly / not_specified / not_found>",
        "payment_linked_to_positive_conclusion": "<yes / no / not_found>",
        "negative_conclusion_consequences": "<rework_free / rework_paid / termination / not_specified / not_found>",
        "evidence": ["<цитата 1>", "<цитата 2>"]
      }
    prompt_file: null
    context_k: 6
    temperature: 0.0
    max_tokens: 560
  retrieval:
    corpus_scope: "document"
    context_k: 6
    max_chunks: 8
    boost_keywords:
      - "экспертиза"
      - "положительное заключение"
      - "окончательный расчёт"
      - "отрицательное заключение"
    negative_keywords:
      - "технические условия"
      - "ГПЗУ"
      - "форс-мажор"
      - "подсудность"
    rerank: true
    filters: {}
  enrichment_hints:
    preferred_segment_types:
      - "clause"
      - "article"
    excluded_segment_types:
      - "signature_block"
    preferred_clause_functions:
      - "procedures"
      - "obligations"
  evidence:
    required: true
    min_snippet_length: 50
    max_snippet_length: 700
  extraction:
    enabled: true
    mode: "hybrid"
    store_payload: true
    llm_max_tokens: 800

    compact_output: false

    llm_prompt_extraction: |
      <role>
      Ты — юрист, извлекающий сведения об экспертизе проектной документации
      в договоре ПИР. Не оценивай риски. Только заполняй поля строго по тексту.
      </role>

      <context>
      {context}
      </context>

      <task>
      Заполни строго следующие поля:

      expertise_mentioned — упоминается ли экспертиза проектной документации
        (allowed: yes / no).

      expertise_type — вид экспертизы
        (allowed: state / non_state / not_specified / not_found).

      who_submits_to_expertise — кто подаёт документацию на экспертизу
        (allowed: contractor / client / jointly / not_specified / not_found).

      who_pays_expertise — кто оплачивает экспертизу
        (allowed: contractor / client / jointly / not_specified / not_found).

      payment_linked_to_positive_conclusion — привязана ли оплата к положительному заключению
        (allowed: yes / no / not_found).

      negative_conclusion_consequences — последствия отрицательного заключения
        (allowed: rework_free / rework_paid / termination / not_specified / not_found).

      Если данные отсутствуют: при отсутствии упоминания экспертизы указывай
      expertise_mentioned = "no", а остальные поля = "not_found".
      </task>

      <rules>
      1. expertise_type: "state" — государственная экспертиза; "non_state" —
         негосударственная; "not_specified" — вид не уточнён; "not_found" — экспертиза не упомянута.
      2. who_submits_to_expertise / who_pays_expertise: "contractor" — подрядчик;
         "client" — заказчик; "jointly" — совместно; "not_specified" — вопрос затронут
         без ясного распределения; "not_found" — экспертиза не упомянута.
      3. payment_linked_to_positive_conclusion: "yes" — оплата или окончательный расчёт
         прямо увязаны с положительным заключением; "no" — экспертиза есть, но связи нет;
         "not_found" — экспертиза не упомянута.
      4. negative_conclusion_consequences: "rework_free" — безвозмездная доработка;
         "rework_paid" — доработка за отдельную оплату; "termination" — расторжение/отказ;
         "not_specified" — последствие неясно; "not_found" — тема не раскрыта.
      5. Не добавляй ключи, не входящие в список полей.
      6. Верни только JSON.
      </rules>
    fields:
      - name: "expertise_mentioned"
        type: "string"
