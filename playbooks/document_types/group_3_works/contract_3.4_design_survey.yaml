  - id: expertise_procedure_and_payment_link
    name: "Экспертиза ПД: порядок и привязка оплаты (ст. 49 ГрК РФ)"
    description: >
      Фактографическая проверка режима прохождения экспертизы проектной документации
      в соответствии со ст. 49 ГрК РФ. Экспертиза проектной документации — обязательная
      процедура для опасных, технически сложных и уникальных объектов капитального строительства,
      а также для объектов, указанных в ч. 5 ст. 49 ГрК РФ. Проверка выявляет шесть критических
      аспектов: (1) упомянут ли факт прохождения экспертизы в договоре; (2) вид экспертизы —
      государственная (экспертиза, проводимая уполномоченными государственными организациями)
      или негосударственная (экспертиза, проводимая аккредитованными негосударственными организациями);
      (3) распределение обязанностей по подаче документации на экспертизу — подрядчик, заказчик
      или совместно; (4) распределение расходов на проведение экспертизы; (5) привязка окончательного
      расчёта по договору к получению положительного заключения экспертизы — типичный механизм защиты
      заказчика от приёмки некачественной проектной документации; (6) последствия получения
      отрицательного заключения — безвозмездная доработка подрядчиком, платная доработка за счёт
      заказчика или право на расторжение договора. Отсутствие или неполнота регулирования экспертизы
      создаёт риски споров о порядке сдачи-приёмки, обоснованности оплаты и качестве проектной
      документации, а также риски невозможности получения разрешения на строительство.
    triggers:
      any: ["expertise_required"]
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "экспертиза проектной документации"
        - "положительное заключение"
        - "отрицательное заключение"
        - "государственная экспертиза"
        - "негосударственная экспертиза"
        - "оплата после экспертизы"
        - "окончательный расчёт"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)положительн(ое|ого)\\s+заключени"
        - "(?i)экспертиз(а|ы|у)\\s+проектн"
        - "(?i)(окончательн|финальн).*оплат.*после.*заключени"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор на выполнение проектных и изыскательских работ (ПИР)
        (§ 4 Главы 37 ГК РФ; ГрК РФ ст. 49).
        Проверяется только один вопрос: порядок прохождения экспертизы ПД,
        распределение обязанностей и связь оплаты с положительным заключением.
        Нормативный ориентир:
        - ст. 49 ГрК РФ
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Упоминается ли экспертиза проектной документации.
        2. Вид экспертизы (государственная / негосударственная).
        3. Кто подаёт документацию на экспертизу.
        4. Кто оплачивает экспертизу.
        5. Привязан ли окончательный расчёт к положительному заключению.
        6. Последствия отрицательного заключения.

        [ПРАВИЛА]
        1. Используй только текст документа. Не выдумывай условия экспертизы — извлекай строго из переданного фрагмента.
        2. Для enum-полей при отсутствии данных используй значение "not_defined".
        3. Для полей *_display используй человеко-читаемые значения согласно маппингу.
        4. Различай:
           - Если экспертиза вообще не упомянута в договоре: expertise_mentioned = "no", остальные поля = "Не применимо"
           - Если экспертиза упомянута, но конкретный параметр не указан: enum = "not_defined", display = "Данные не определены"
           - "state" — государственная экспертиза
           - "non_state" — негосударственная экспертиза
           - "contractor" — подрядчик
           - "client" — заказчик
           - "jointly" — совместно
           - "rework_free" — безвозмездная доработка
           - "rework_paid" — платная доработка за счёт заказчика
           - "termination" — право на расторжение
        5. В evidence — только точные цитаты из документа с указанием пункта.
        6. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.без комментариев и markdown-обёртки.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — полный набор условий экспертизы:
        Фрагмент:
        "Проектная документация подлежит государственной экспертизе.
        Подрядчик обеспечивает подготовку и подачу документации, Заказчик
        оплачивает стоимость экспертизы. Окончательный расчёт по договору
        производится после получения положительного заключения. В случае
        отрицательного заключения Подрядчик обязан безвозмездно устранить замечания."
        Ответ:
        {
          "expertise_mentioned": "yes",
          "expertise_mentioned_display": "Да, экспертиза упомянута",
          "expertise_type": "state",
          "expertise_type_display": "Государственная экспертиза",
          "who_submits_to_expertise": "contractor",
          "who_submits_to_expertise_display": "Подрядчик",
          "who_pays_expertise": "client",
          "who_pays_expertise_display": "Заказчик",
          "payment_linked_to_positive_conclusion": "yes",
          "payment_linked_to_positive_conclusion_display": "Да, расчёт привязан к положительному заключению",
          "negative_conclusion_consequences": "rework_free",
          "negative_conclusion_consequences_display": "Безвозмездная доработка Подрядчиком",
          "evidence": [
            {
              "clause_ref": "п. 4.1",
              "quote": "Проектная документация подлежит государственной экспертизе."
            },
            {
              "clause_ref": "п. 4.2",
              "quote": "Подрядчик обеспечивает подготовку и подачу документации, Заказчик оплачивает стоимость экспертизы."
            },
            {
              "clause_ref": "п. 4.3",
              "quote": "Окончательный расчёт по договору производится после получения положительного заключения."
            },
            {
              "clause_ref": "п. 4.4",
              "quote": "В случае отрицательного заключения Подрядчик обязан безвозмездно устранить замечания."
            }
          ]
        }

        Пример 2 — экспертиза упомянута, но не все параметры указаны:
        Фрагмент:
        "Проектная документация подлежит экспертизе. Расходы на экспертизу
        несёт Заказчик."
        Ответ:
        {
          "expertise_mentioned": "yes",
          "expertise_mentioned_display": "Да, экспертиза упомянута",
          "expertise_type": "not_defined",
          "expertise_type_display": "Данные не определены",
          "who_submits_to_expertise": "not_defined",
          "who_submits_to_expertise_display": "Данные не определены",
          "who_pays_expertise": "client",
          "who_pays_expertise_display": "Заказчик",
          "payment_linked_to_positive_conclusion": "not_defined",
          "payment_linked_to_positive_conclusion_display": "Данные не определены",
          "negative_conclusion_consequences": "not_defined",
          "negative_conclusion_consequences_display": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 4.1",
              "quote": "Проектная документация подлежит экспертизе."
            },
            {
              "clause_ref": "п. 4.2",
              "quote": "Расходы на экспертизу несёт Заказчик."
            }
          ]
        }

        Пример 3 — экспертиза не упомянута:
        Фрагмент:
        "Результат работ передаётся Заказчику по акту сдачи-приёмки."
        Ответ:
