      required_kind: "legal_unit"
      retrieval_query: "неустойка пеня штраф за каждый день просрочки просрочка выполнения работ просрочка оплаты цена договора цена этапа сумма просроченного платежа лимит неустойки cap"
      preferred_unit_types:
