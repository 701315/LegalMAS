      client_penalty_present — предусмотрена ли встречная неустойка для заказчика
        (allowed: yes / no / not_found).

      client_penalty_rate — размер/ставка неустойки заказчика
        (текстовое значение или not_found).

      penalty_cap_present — есть ли ограничение суммы неустойки
        (allowed: yes / no / not_found).

      Если данные отсутствуют: указывай "not_found".
      </task>

      <rules>
      1. contractor_penalty_present: "yes" — неустойка подрядчика есть;
         "no" — тема раскрыта, но нет; "not_found" — тема отсутствует.
      2. contractor_penalty_rate: текст, например "0,1% от цены договора
         за каждый день просрочки"; или "not_found".
      3. penalty_basis: "contract_price" — от цены договора;
         "stage_price" — от стоимости этапа;
         "overdue_amount" — от просроченной суммы;
         "fixed_amount" — фиксированная сумма;
         "not_specified" — неясно; "not_found" — тема отсутствует.
      4. client_penalty_present: "yes" — встречная неустойка есть;
         "no" — нет; "not_found" — тема отсутствует.
      5. client_penalty_rate: текст или "not_found".
      6. penalty_cap_present: "yes" — cap есть; "no" — нет;
         "not_found" — тема отсутствует.
      7. Не добавляй ключи, не входящие в список полей.
      8. Верни только JSON.
      </rules>
    fields:
      - name: "contractor_penalty_present"
