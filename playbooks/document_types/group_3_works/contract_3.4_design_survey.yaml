  - id: auto_deadline_extension
    name: "Автопродление сроков при задержке согласования заказчиком"
    description: >
      Фактографическая проверка механизма продления сроков выполнения работ при
      задержке со стороны заказчика в договоре на выполнение проектных и изыскательских
      работ (ПИР). Нормативный ориентир — ст. 328 ГК РФ (встречные обязательства) и
      ст. 719 ГК РФ (приостановление работ подрядчиком при нарушении заказчиком
      обязанностей). Для договоров ПИР это критически важный механизм защиты подрядчика:
      заказчик часто задерживает согласование технического задания, предоставление
      исходных данных, рассмотрение промежуточных результатов (стадия «П», стадия «Р»),
      что создаёт риск просрочки подрядчика и начисления неустойки. Проверка выявляет
      пять аспектов: (1) предусмотрено ли вообще продление сроков при задержке заказчика;
      (2) триггер продления — задержка согласования, задержка рассмотрения промежуточных
      результатов или смешанный вариант; (3) механизм продления — автоматическое
      (наиболее благоприятный для подрядчика), по уведомлению подрядчика или по
      дополнительному соглашению (наименее благоприятный); (4) правило расчёта
      продолжительности продления — на период фактической задержки (equal_delay) или
      фиксированное количество дней; (5) право подрядчика приостановить работы до
      получения согласования/исходных данных. Отсутствие такого механизма перекладывает
      на подрядчика риск просрочки из-за действий заказчика и лишает его инструмента
      защиты при срыве сроков по вине заказчика.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "продление сроков"
        - "автоматическое продление"
        - "задержка согласования"
        - "время рассмотрения не включается"
        - "просрочка заказчика"
        - "встречное исполнение"
        - "приостановить работы"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)срок.*продлева(ется|ться).*на.*срок.*задержк"
        - "(?i)не\\s+включа(ется|ться)\\s+в\\s+срок\\s+выполнени"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор на выполнение проектных и изыскательских работ (ПИР)
        (§ 4 Главы 37 ГК РФ, ст. 328, 719).
        Проверяется только один вопрос: продление сроков при задержке заказчика.
        Нормативный ориентир:
        - ст. 328 ГК РФ (встречные обязательства)
        - ст. 719 ГК РФ (приостановление работ подрядчиком)
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не выдумывай условия продления — извлекай строго из переданного фрагмента.
        - Не путай задержку заказчика с форс-мажором.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Предусмотрено ли продление сроков при задержке заказчика.
        2. Триггер продления.
        3. Механизм продления.
        4. Правило расчёта продолжительности продления.
        5. Право подрядчика приостановить работы.

        [ПРАВИЛА]
        1. Используй только текст документа. Не выдумывай условия продления — извлекай строго из переданного фрагмента.
        2. Для enum-полей при отсутствии данных используй значение "not_defined".
        3. Для полей *_display используй человеко-читаемые значения согласно маппингу.
        4. Различай:
           - "yes" — условие прямо указано в договоре
           - "no" — условие прямо исключено (например, "продление сроков не допускается")
           - "not_defined" — условие вообще не упоминается в договоре
           - "not_specified" — условие упомянуто, но конкретный параметр не указан
           - "approval_delay" — триггер: задержка согласования заказчиком
           - "review_delay" — триггер: задержка рассмотрения промежуточных результатов
           - "mixed" — смешанный триггер (согласование + рассмотрение)
           - "automatic" — механизм: автоматическое продление
           - "notice_based" — механизм: продление по уведомлению подрядчика
           - "by_addendum" — механизм: продление по дополнительному соглашению
           - "equal_delay" — правило: продление на период фактической задержки
           - "fixed_days" — правило: фиксированное количество дней
        5. Критическое правило:
           - Если auto_extension_present = "no" (продление прямо исключено), то все остальные поля (extension_trigger, extension_mode, extension_duration_rule, suspension_right) = "not_defined", а их display-версии = "Не применимо"
           - Если auto_extension_present = "not_defined" (условие не упоминается), то остальные поля = "not_defined", display = "Данные не определены"
        6. Не путай:
           - Задержку заказчика (этот check) с форс-мажором (global check)
           - Продление сроков выполнения работ с пролонгацией срока действия договора
           - Приостановление работ по ст. 719 ГК РФ с расторжением договора
        7. В evidence — только точные цитаты из документа с указанием пункта.
        8. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.без комментариев и markdown-обёртки.

