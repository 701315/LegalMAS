    llm_prompt_extraction: "<role>\nТы — юрист, извлекающий сведения о предмете договора ПИР.\nПроверяется только раздел «Предмет договора» и вводная часть.\nНе оценивай риски. Только заполняй поля строго по тексту.\n</role>\n\n<context>\n{context}\n</context>\n\n<task>\nЗаполни строго следующие поля:\n\nwork_type — вид работ по договору\n  (allowed: design / survey / design_and_survey / not_found).\n  \"design\" — только проектирование; \"survey\" — только изыскания;\n  \"design_and_survey\" — оба вида работ.\n\nobject_name — наименование объекта проектирования\n  (текстовое значение или not_found).\n  Извлекай дословно, не сокращай.\n\nobject_location — адрес или местоположение объекта\n  (текстовое значение или not_found).\n\ndesign_stage — стадия проектирования\n  (allowed: P / R / P_and_R / not_found).\n  \"P\" — проектная документация; \"R\" — рабочая документация;\n  \"P_and_R\" — обе стадии.\n\ntz_reference — ссылка на техническое задание\n  (номер приложения, например \"Приложение\
      \ № 1\",\n  или \"referenced_no_number\" если ТЗ упомянуто без номера,\n  или not_found).\n\ndesign_sections_listed — перечислены ли разделы ПД в договоре\n  (allowed: yes / no / not_found).\n  \"yes\" — только если конкретные разделы перечислены явно.\n\nЕсли данные отсутствуют: указывай \"not_found\" для каждого поля.\n</task>\n\n<rules>\n1. work_type: \"design\" — проектные работы; \"survey\" — инженерные изыскания\n   без проектирования; \"design_and_survey\" — оба вида одновременно;\n   \"not_found\" — вид работ не определён.\n2. design_stage: \"P\" — стадия «Проектная документация»;\n   \"R\" — стадия «Рабочая документация»; \"P_and_R\" — обе;\n   \"not_found\" — стадия не указана явно.\n3. tz_reference: извлекай номер приложения, если он указан.\n   Если ТЗ упомянуто, но номер не указан — \"referenced_no_number\".\n   Если ТЗ не упомянуто — \"not_found\".\n4. design_sections_listed: \"yes\" — только при явном перечислении разделов\n   (АР, КР, ТХ, ОВиК и т.д.); \"no\" — если\
      \ разделы не перечислены;\n   \"not_found\" — если информации нет.\n5. Не добавляй ключи, не входящие в список полей выше.\n6. Верни только JSON.\n</rules>\n"
    fields:
