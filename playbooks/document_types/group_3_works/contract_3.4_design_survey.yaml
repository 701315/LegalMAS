        (§ 4 Главы 37 ГК РФ, ст. 724, 761).
        Проверяется только один вопрос: гарантийный срок на ПД.
        Нормативный ориентир:
        - ст. 724 ГК РФ
        - ст. 761 ГК РФ
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Определён ли гарантийный срок.
        2. Продолжительность гарантийного срока.
        3. Момент начала отсчёта.
        4. Безвозмездное устранение дефектов.
        5. Срок устранения дефектов.

        [ПРАВИЛА]
        1. Только текст документа.
        2. Если условие не указано — "not_defined".
        3. Не путай гарантийный срок с гарантией качества.
        4. В evidence — только текст договора.
        5. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1:
        Фрагмент:
        "Гарантийный срок на проектную документацию составляет 36 месяцев
        с даты подписания акта сдачи-приёмки. В течение гарантийного срока
        Подрядчик обязан безвозмездно устранить дефекты документации
        в течение 15 рабочих дней с момента получения претензии."
        Ответ:
        {
          "warranty_period_present": "yes",
          "warranty_period_duration": "36 месяцев",
          "warranty_start_event": "from_acceptance",
          "free_defect_remedy": "yes",
          "defect_remedy_period": "15 рабочих дней",
          "evidence": [
            {
              "clause_ref": "п. 12.3",
              "quote": "Гарантийный срок на проектную документацию составляет 36 месяцев с даты подписания акта сдачи-приёмки."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Подрядчик гарантирует качество проектной документации."
        Ответ:
        {
          "warranty_period_present": "not_defined",
          "warranty_period_duration": "Данные не определены",
          "warranty_start_event": "not_defined",
          "free_defect_remedy": "not_defined",
          "defect_remedy_period": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли именно гарантийный срок (период), а не гарантия качества?
        2. Извлечена ли продолжительность?
        3. Определён ли момент начала отсчёта?
        4. Есть ли безвозмездное устранение дефектов?
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "warranty_period_present": "<yes / no / not_found>",
          "warranty_period_duration": "<текст или 'Данные не определены'>",
          "warranty_start_event": "<from_acceptance / from_commissioning / from_expertise / not_specified / not_found>",
          "free_defect_remedy": "<yes / no / not_found>",
          "defect_remedy_period": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 480
      retrieval:
