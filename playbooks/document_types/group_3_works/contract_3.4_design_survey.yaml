  severity_if_unclear: medium
  origin: DOCUMENT_TYPE
  detector_type: hybrid
  rules:
    keywords:
    - страхование ответственности
    - страховой полис
    - профессиональная ответственность
    - страховое покрытие
    - застраховать ответственность
    keyword_mode: any
    regex_patterns:
    - (?i)страхов(ание|ка).*ответственност
    - (?i)профессиональн(ой|ая)\s+ответственност
  llm:
    prompt_template: "[КОНТЕКСТ]\nТы — юрист, анализирующий договор ПИР.\nПроверяется только один вопрос: предусмотрено ли страхование\nпрофессиональной ответственности проектировщика, минимальная сумма\nпокрытия и обязанность поддерживать страхование.\n\nВажно:\n— Анализируй только положения о страховании ответственности.\n— Не оценивай риск и не смешивай страхование с лимитом ответственности или СРО.\n— Если условие не установлено прямо, не домысливай.\n\n[ЗАДАЧА]\n1. Установить, предусмотрено ли страхование ответственности.\n2. Извлечь минимальную сумму покрытия.\n3. Установить, обязан ли подрядчик поддерживать страхование на весь срок.\n4. Установить, обязан ли подрядчик предоставить копию полиса.\n\n[ПРАВИЛА]\n1. insurance_required = \"yes\" — страхование прямо предусмотрено;\n   \"no\" — тема раскрыта, но страхования нет;\n   \"not_found\" — тема отсутствует.\n2. min_coverage_amount — минимальная сумма покрытия (текст);\n   если не указана — \"not_found\".\n3. maintenance_obligation\
      \ = \"yes\" — обязанность поддерживать страхование\n   на весь срок договора; \"no\" — тема раскрыта, но такой обязанности нет;\n   \"not_found\" — тема отсутствует.\n4. policy_copy_required = \"yes\" — обязанность предоставить копию полиса;\n   \"no\" — тема раскрыта, но нет; \"not_found\" — тема отсутствует.\n5. Не путай страхование ответственности с членством в СРО.\n6. Не путай страховое покрытие с лимитом (cap) ответственности.\n7. Если тема не затронута — все = \"not_found\".\n\n[ПРИМЕРЫ (FEW-SHOT)]\nПример 1 — страхование предусмотрено:\nТекст: «Подрядчик обязан застраховать свою профессиональную ответственность\nна сумму не менее 5 000 000 рублей и поддерживать страхование на весь\nсрок действия договора. Копия страхового полиса предоставляется Заказчику\nв течение 5 рабочих дней с даты подписания договора.»\n\nОтвет:\n{\n  \"insurance_required\": \"yes\",\n  \"min_coverage_amount\": \"5 000 000 рублей\",\n  \"maintenance_obligation\": \"yes\",\n  \"policy_copy_required\":\
      \ \"yes\",\n  \"evidence\": [\n    \"Подрядчик обязан застраховать свою профессиональную ответственность на сумму не менее 5 000 000 рублей и поддерживать страхование на весь срок действия договора.\",\n    \"Копия страхового полиса предоставляется Заказчику в течение 5 рабочих дней с даты подписания договора.\"\n  ]\n}\n\nПример 2 — тема не раскрыта:\nТекст: «Подрядчик обладает необходимой квалификацией.»\n\nОтвет:\n{\n  \"insurance_required\": \"not_found\",\n  \"min_coverage_amount\": \"not_found\",\n  \"maintenance_obligation\": \"not_found\",\n  \"policy_copy_required\": \"not_found\",\n  \"evidence\": []\n}\n\n[ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]\n1. Есть ли именно страхование ответственности, а не СРО?\n2. Указана ли минимальная сумма покрытия?\n3. Есть ли обязанность поддерживать страхование?\n4. Есть ли обязанность предоставить полис?\n5. Все ли ключи JSON совпадают со schema?\n\n[ФОРМАТ ОТВЕТА]\nВерни строго JSON:\n{\n  \"insurance_required\": \"<yes / no / not_found>\",\n  \"\
      min_coverage_amount\": \"<текст или not_found>\",\n  \"maintenance_obligation\": \"<yes / no / not_found>\",\n  \"policy_copy_required\": \"<yes / no / not_found>\",\n  \"evidence\": [\"<цитата 1>\", \"<цитата 2>\"]\n}\n"
    prompt_file: null
    context_k: 4
    temperature: 0.0
    max_tokens: 420
  retrieval:
    corpus_scope: document
    context_k: 4
    max_chunks: 6
    retrieval_profile: insurance_check
    boost_keywords:
    - страхование ответственности
    - страховой полис
    - профессиональная ответственность
    - страховое покрытие
    negative_keywords:
    - СРО
    - экспертиза
    - форс-мажор
    - подсудность
    rerank: true
    filters: {}
  enrichment_hints:
    preferred_segment_types:
    - clause
    - article
    excluded_segment_types:
    - signature_block
    preferred_clause_functions:
    - obligations
    - obligations
    confidence_bonus_on_match: 0.1
    confidence_penalty_on_excluded_segment: 0.12
  evidence:
    required: true
    min_snippet_length: 30
    max_snippet_length: 500
  extraction:
    enabled: true
    mode: hybrid
    store_payload: true
    llm_max_tokens: 550
    compact_output: false
    llm_prompt_extraction: "<role>\nТы — юрист, извлекающий сведения о страховании ответственности\nпроектировщика в договоре ПИР. Не оценивай риски.\nТолько заполняй поля строго по тексту.\n</role>\n\n<context>\n{context}\n</context>\n\n<task>\nЗаполни строго следующие поля:\n\ninsurance_required — предусмотрено ли страхование ответственности\n  (allowed: yes / no / not_found).\n\nmin_coverage_amount — минимальная сумма покрытия\n  (текстовое значение или not_found).\n\nmaintenance_obligation — обязанность поддерживать страхование\n  (allowed: yes / no / not_found).\n\npolicy_copy_required — обязанность предоставить копию полиса\n  (allowed: yes / no / not_found).\n\nЕсли данные отсутствуют: указывай \"not_found\".\n</task>\n\n<rules>\n1. insurance_required: \"yes\" — страхование предусмотрено;\n   \"no\" — тема раскрыта, но нет; \"not_found\" — тема отсутствует.\n2. min_coverage_amount: текст с суммой; или \"not_found\".\n3. maintenance_obligation: \"yes\" — обязанность есть;\n   \"no\"\
      \ — нет; \"not_found\" — тема отсутствует.\n4. policy_copy_required: \"yes\" — обязанность предоставить полис;\n   \"no\" — нет; \"not_found\" — тема отсутствует.\n5. Не добавляй ключи, не входящие в список полей.\n6. Верни только JSON.\n</rules>\n"
    fields:
    - name: insurance_required
      type: string
      label: Страхование ответственности
      presentation: badge
      display_in_grid: true
      display_priority: 1
      allowed_values:
      - 'yes'
      - 'no'
      - not_found
      description: Предусмотрено ли страхование проф. ответственности.
      required: true
    - name: min_coverage_amount
      type: string
      label: Минимальное покрытие
      presentation: text
      display_in_grid: true
      display_priority: 2
      description: Минимальная сумма страхового покрытия.
      max_value_chars: 150
      required: false
    - name: maintenance_obligation
      type: string
      label: Поддержание страхования
      presentation: badge
      display_in_grid: false
      display_priority: 3
      allowed_values:
      - 'yes'
      - 'no'
      - not_found
      description: Обязан ли подрядчик поддерживать страхование.
      required: false
    - name: policy_copy_required
      type: string
      label: Предоставление полиса
      presentation: badge
      display_in_grid: false
      display_priority: 4
      allowed_values:
      - 'yes'
      - 'no'
      - not_found
      description: Обязан ли подрядчик предоставить копию полиса.
      required: false
dd_request_templates:
  pir_subject_extraction:
    text: 'Просим подтвердить по {doc_names}: (а) полное наименование объекта проектирования; (б) стадию проектирования (П/Р/П+Р); (в) перечень разделов ПД; (г) ссылку на ТЗ с подтверждением его утверждения заказчиком.

      '
    addressee: Обе стороны
  technical_specification_completeness:
    text: 'В {doc_names} необходимо подтвердить наличие и полноту ТЗ на проектирование (ст. 759 ГК РФ): (а) приложено ли ТЗ к договору; (б) содержит ли оно параметры объекта, ссылки на нормативы, требования к результату; (в) утверждено ли заказчиком.

      '
    addressee: Заказчик
  object_and_stage_identification:
    text: 'Просим уточнить в {doc_names}: наименование объекта, его местоположение (адрес/кадастровый номер), стадию проектирования, перечень разделов ПД по ПП РФ № 87.

      '
    addressee: Заказчик
  price_and_calculation_basis:
    text: 'Просим подтвердить по {doc_names}: (а) цену работ цифрами и прописью; (б) вид цены (твёрдая/приблизительная); (в) основание расчёта (СБЦ, % от СМР, фиксированная); (г) включает ли цена НДС; (д) порядок изменения цены при увеличении объёма.

      '
    addressee: Обе стороны
  stage_payment_schedule:
    text: 'Просим уточнить в {doc_names}: (а) размер авансового платежа; (б) привязку промежуточных платежей к подписанию актов этапов; (в) условия окончательного расчёта; (г) реквизиты для оплаты.

      '
    addressee: Обе стороны
  expertise_procedure_and_payment_link:
    text: 'Просим подтвердить по {doc_names}: (а) вид экспертизы (государственная/негосударственная); (б) кто подаёт документы на экспертизу; (в) кто оплачивает экспертизу; (г) привязана ли окончательная оплата к положительному заключению; (д) последствия отрицательного заключения (бесплатная доработка / за дополнительную плату).

      '
    addressee: Обе стороны
  ip_rights_on_documentation:
    text: 'Просим уточнить в {doc_names}: (а) кому принадлежат исключительные права на ПД; (б) момент перехода прав; (в) вправе ли заказчик повторно использовать проект (типовая застройка); (г) вправе ли заказчик модифицировать проект; (д) сохраняется ли за автором право авторства и иные личные неимущественные права.

      '
    addressee: Юридический советник
  designer_liability_for_errors:
    text: 'Просим уточнить в {doc_names}: (а) объём ответственности проектировщика за ошибки в ПД; (б) включает ли ответственность расходы на переделку СМР; (в) наличие лимита ответственности и его размер; (г) исключены ли косвенные убытки и упущенная выгода.

      '
    addressee: Юридический советник
  liability_cap:
    text: 'Просим согласовать в {doc_names}: лимит совокупной ответственности подрядчика, исключения из лимита (умысел, грубая неосторожность), порядок исчисления убытков.

      '
    addressee: Юридический советник
  designer_vs_builder_liability:
    text: 'Просим включить в {doc_names} чёткое разграничение ответственности: проектировщик отвечает за качество документации, но не за её реализацию строителями. Авторский надзор — отдельная услуга / договор.

      '
    addressee: Юридический советник
  initial_data_provision_check:
    text: 'Просим предоставить по {doc_names}: (а) полный перечень исходных данных с указанием ответственного за предоставление; (б) сроки предоставления каждого документа; (в) последствия задержки; (г) оговорку об ответственности заказчика за достоверность.

      '
    addressee: Заказчик
  initial_data_accuracy_disclaimer:
    text: 'Просим включить в {doc_names} оговорку: подрядчик не проверяет достоверность исходных данных, ответственность за их достоверность несёт заказчик; при выявлении несоответствия — право на продление сроков и дополнительную оплату.

      '
    addressee: Юридический советник подрядчика
  sro_membership_check:
    text: 'Просим предоставить по {doc_names}: (а) наименование и номер СРО; (б) реквизиты свидетельства/выписки; (в) обязательство поддерживать членство на весь срок действия договора.

      '
    addressee: Подрядчик
  sro_membership_absent_for_expertise_object:
    text: 'ВНИМАНИЕ: объект по {doc_names} требует экспертизы, но членство подрядчика в СРО не подтверждено. Просим незамедлительно предоставить подтверждение членства в СРО проектировщиков (ст. 55.8 ГрК РФ). Без этого получение положительного заключения экспертизы невозможно.

      '
    addressee: Подрядчик
  author_supervision_terms:
    text: 'Просим уточнить в {doc_names}: (а) включён ли авторский надзор в договор или осуществляется по отдельному договору; (б) объём и периодичность; (в) порядок оплаты; (г) ответственность при отказе от авторского надзора.

      '
    addressee: Обе стороны
  bim_model_requirements:
    text: 'Просим уточнить в {doc_names}: (а) требуется ли BIM-модель; (б) формат (IFC / native); (в) уровень детализации (LOD); (г) порядок и сроки передачи модели; (д) требования к среде общих данных (CDE).

      '
    addressee: Заказчик
  performance_deadlines_milestones:
    text: 'Просим предоставить по {doc_names}: (а) календарный план-график работ с этапами; (б) ключевые даты (начало, эскиз, экспертиза, сдача РД); (в) привязку сроков к предоставлению исходных данных.

      '
    addressee: Обе стороны
  auto_deadline_extension:
    text: 'Просим включить в {doc_names} условие: при задержке согласования заказчиком сроки выполнения автоматически продлеваются на период задержки; время рассмотрения заказчиком не включается в сроки подрядчика.

      '
    addressee: Юридический советник подрядчика
  acceptance_procedure:
    text: 'Просим уточнить в {doc_names}: порядок сдачи-приёмки, форму акта, срок рассмотрения документации заказчиком, основания для мотивированного отказа, комплектность передаваемой документации.

      '
    addressee: Обе стороны
  stagewise_approval_procedure:
    text: 'Просим согласовать в {doc_names}: перечень этапов, подлежащих согласованию; сроки рассмотрения каждого этапа; право заказчика на замечания; порядок учёта или отклонения замечаний.

      '
    addressee: Обе стороны
  defect_remarks_register:
    text: 'Просим включить в {doc_names}: порядок ведения реестра замечаний, сроки устранения, акт об устранении, последствия неустранения в срок.

      '
    addressee: Юридический советник
  termination_and_consequences:
    text: 'Просим уточнить в {doc_names}: (а) основания для одностороннего отказа каждой стороны; (б) порядок оплаты выполненной части; (в) возврат документации и исходных данных; (г) неустойки и штрафы; (д) судьба авансовых платежей.

      '
    addressee: Юридический советник
  assignment_and_subcontracting:
    text: 'Просим уточнить в {doc_names}: (а) допускается ли привлечение субподрядчиков; (б) требуется ли согласие заказчика; (в) сохраняется ли ответственность генерального проектировщика; (г) ограничения на уступку прав.

      '
    addressee: Юридический советник
  quality_warranty:
    text: 'Просим подтвердить в {doc_names}: гарантию соответствия ПД действующим нормативам (СП, ГОСТ, СНиП), ТЗ и исходным данным. Указать перечень применяемых нормативов.

      '
    addressee: Подрядчик
  warranty_period_for_documentation:
    text: 'Просим включить в {doc_names} гарантийный срок на ПД: продолжительность, обязанность безвозмездного устранения дефектов, порядок предъявления претензий.

      '
    addressee: Юридический советник
  norms_and_standards_reference:
    text: 'Просим указать в {doc_names} полный перечень применимых нормативов проектирования (СП, ГОСТ, СНиП, технические регламенты) с указанием актуальных редакций.

      '
    addressee: Подрядчик
  confidentiality_and_data_return:
    text: 'Просим включить в {doc_names}: перечень конфиденциальных сведений, срок неразглашения, порядок возврата/уничтожения материалов после завершения работ, ответственность за нарушение.

      '
    addressee: Юридический советник
  insurance_professional_liability:
    text: 'Просим подтвердить по {doc_names}: наличие полиса страхования профессиональной ответственности проектировщика, страховую сумму, срок действия, соответствие требованиям СРО.

      '
    addressee: Подрядчик
  hazardous_facility_special_permit:
    text: 'ВНИМАНИЕ: объект по {doc_names} является опасным производственным объектом. Просим предоставить: лицензию Ростехнадзора, подтверждение допуска к проектированию ОПО, страховой полис, перечень специалистов с допуском к работам на ОПО.

      '
    addressee: Подрядчик
  penalty_for_delay:
    text: 'Просим согласовать в {doc_names}: размер неустойки за просрочку (для обеих сторон), предельный размер (cap), порядок исчисления, основания для освобождения.

      '
    addressee: Юридический советник
  deviation_from_tz_approval:
    text: 'Просим включить в {doc_names}: порядок согласования отступлений от ТЗ, форму уведомления, срок рассмотрения, последствия несогласования (доплата / продление сроков).

      '
    addressee: Обе стороны
  parties_identification:
    text: 'Просим подтвердить полные реквизиты сторон по {doc_names}: наименование/ФИО, ИНН, ОГРН, адрес, документы уполномоченных лиц, подтверждение полномочий.

      '
    addressee: Обе стороны
  force_majeure:
    text: 'Просим уточнить в {doc_names}: перечень обстоятельств форс-мажора, порядок и сроки уведомления, последствия (приостановка / расторжение), подтверждающие документы (ТПП).

      '
    addressee: Юридический советник
  dispute_resolution:
    text: 'Просим согласовать в {doc_names}: претензионный порядок (срок), подсудность, возможность медиации / третейского разбирательства.

      '
    addressee: Юридический советник
  anticorruption_clause:
    text: 'Просим включить в {doc_names} антикоррупционную оговорку в соответствии с ФЗ-273: заверения сторон, порядок уведомления, последствия нарушения.

      '
    addressee: Юридический советник
  vat_and_tax_allocation:
    text: 'Просим уточнить в {doc_names}: режим НДС, распределение расходов на экспертизу и согласования, порядок документооборота (УПД/акт/счёт-фактура).

      '
    addressee: Бухгалтерия / Юридический советник
  data_security_and_backup:
    text: 'Просим включить в {doc_names}: условия хранения и резервирования проектных данных, формат передачи электронной версии, требования к среде общих данных.

      '
    addressee: IT-служба / Юридический советник
  governing_law:
    text: 'Просим подтвердить в {doc_names} применимое право (законодательство РФ) и язык договора.

      '
    addressee: Юридический советник
  pd_composition_pp87_violation:
