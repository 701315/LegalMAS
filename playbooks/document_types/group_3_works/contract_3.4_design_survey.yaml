        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли перечень исходных данных.
        2. Определены ли сроки предоставления исходных данных.
        3. Договорное последствие задержки предоставления данных.
        4. Оговорка об ответственности заказчика за достоверность данных.

        [ПРАВИЛА]
        1. Только текст документа.
        2. Если условие не указано прямо — "not_defined" или "not_defined".
        3. В evidence — только текст договора.
        4. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1:
        Фрагмент:
        "Заказчик передаёт Подрядчику исходные данные, включая ГПЗУ,
        технические условия на подключение и результаты инженерных изысканий,
        в течение 5 рабочих дней с даты подписания договора. В случае нарушения
        указанного срока срок выполнения работ соразмерно продлевается.
        Заказчик несёт ответственность за полноту и достоверность переданных данных."
        Ответ:
        {
          "initial_data_list_present": "yes",
          "initial_data_deadlines": "specified",
          "delay_consequences": "deadline_extension",
          "data_accuracy_disclaimer": "yes",
          "evidence": [
            {
              "clause_ref": "п. 2.1",
              "quote": "Заказчик передаёт Подрядчику исходные данные, включая ГПЗУ, технические условия на подключение и результаты инженерных изысканий, в течение 5 рабочих дней."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Заказчик предоставляет исходные данные, необходимые для выполнения работ."
        Ответ:
        {
          "initial_data_list_present": "no",
          "initial_data_deadlines": "not_defined",
          "delay_consequences": "not_defined",
          "data_accuracy_disclaimer": "no",
          "evidence": [
            {
              "clause_ref": "п. 2.1",
              "quote": "Заказчик предоставляет исходные данные, необходимые для выполнения работ."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли именно перечень документов, а не общее упоминание?
        2. Указан ли срок предоставления?
        3. Есть ли прямое последствие задержки?
        4. Есть ли явная оговорка о достоверности?
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "initial_data_list_present": "<yes / no / not_found>",
          "initial_data_deadlines": "<specified / not_specified / not_found>",
          "delay_consequences": "<deadline_extension / rework_at_client_cost / termination_right / not_specified / not_found>",
          "data_accuracy_disclaimer": "<yes / no / not_found>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 500
      retrieval:
        retrieval_profile: "technical_documentation_check"
        corpus_scope: "primary_segment"
        levels:
          - "legal_unit"
          - "section"
        required_kind: "legal_unit"
        retrieval_query: "исходные данные ГПЗУ технические условия сроки предоставления задержка достоверность"
        preferred_unit_types:
          - obligation
          - general_provision
        excluded_unit_types:
          - definition
          - structural_anchor
          - technical_fragment
        preferred_clause_functions:
          - definitions
          - obligations
        negative_keywords:
          - "форс-мажор"
          - "подсудность"
          - "неустойка"
          - "экспертиза"
          - "означает"
          - "в целях настоящего"
        position_bias:
          preferred_range: [0.05, 0.50]
          boost: 0.15
          scope: segment
        context_k: 5
        max_chunks: 8
        rerank: true
        enrichment_hints:
          preferred_segment_types:
            - "contract"
            - "amendment"
          excluded_segment_types:
            - "technical_specification"
            - "price_list"
          preferred_clause_functions:
            - "definitions"
            - "obligations"
          confidence_bonus_on_match: 0.10
          confidence_penalty_on_excluded_segment: 0.12
      evidence:
        required: true
        min_snippet_length: 30
        max_snippet_length: 600
      extraction:
        enabled: true
        mode: "hybrid"
        compact_output: false
        llm_max_tokens: 550
        llm_prompt_extraction: |
          <role>
          Ты — российский юрист. Извлеки из договора ПИР сведения об исходных данных:
          перечень, сроки, последствия задержки, оговорка о достоверности.
          Не анализируй цену, экспертизу или иные темы.
          </role>
          <context>
          {context}
          </context>
          <task>
          Заполни строго следующие поля:
          1. initial_data_list_present — есть ли перечень (yes / no / not_found).
          2. initial_data_deadlines — сроки предоставления (specified / not_specified / not_found).
          3. delay_consequences — последствие задержки (deadline_extension / rework_at_client_cost / termination_right / not_specified / not_found).
          4. data_accuracy_disclaimer — оговорка о достоверности (yes / no / not_found).
          Если данные отсутствуют: "not_defined".
