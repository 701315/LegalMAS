# ──────────────────────────────────────────────────────────────────────────
# CHECK 2: Предмет договора ПИР
# ──────────────────────────────────────────────────────────────────────────
- id: pir_subject_extraction
  name: "ПИР: базовое извлечение предмета договора"
  description: "Извлекает наименование объекта, вид работ, стадию проектирования, ссылку на ТЗ"
  triggers: ~
  ui_mode: "field_extraction"
  severity: "critical"
  origin: "DOCUMENT_TYPE"
  detector_type: "hybrid"
  rules:
    keywords:
      - "проектная документация"
      - "рабочая документация"
      - "инженерные изыскания"
      - "предмет договора"
      - "объект проектирования"
      - "стадия П"
      - "стадия Р"
    keyword_mode: "any"
    regex_patterns:
      - "(?i)(стади[яи]\\s*[«\"']?[ПР][»\"']?|проектная\\s+документация|рабочая\\s+документация)"
      - "(?i)(проектн.*и.*изыскательск|инженерн.*изыскани)"
  llm:
    prompt_template: |
      [КОНТЕКСТ]
      Ты — юрист, анализирующий договор на выполнение проектных
      и изыскательских работ (ПИР) (ст. 758 ГК РФ).
      Проверяется только один вопрос: предмет договора — что именно
      обязан выполнить подрядчик, на каком объекте и в какой стадии.

      Важно:
      — Анализируй только разделы «Предмет договора» и вводную часть.
      — Не оценивай риски. Только извлекай факты о предмете договора.
      — Если сведения явно не указаны в тексте — значение "not_found".

      [ЗАДАЧА]
      1. Установить вид работ: проектные / изыскательские / комплексные.
      2. Извлечь наименование объекта проектирования.
      3. Извлечь местоположение (адрес) объекта.
      4. Установить стадию проектирования: П / Р / обе.
      5. Найти ссылку на техническое задание (номер приложения).
      6. Установить, перечислены ли разделы проектной документации в договоре.

      [ПРАВИЛА]
      1. work_type: "design" — только проектные работы;
         "survey" — только инженерные изыскания без проектирования;
         "design_and_survey" — одновременно проектирование и изыскания;
         "not_found" — вид работ не определён.
      2. design_stage: "P" — только стадия «Проектная документация»;
         "R" — только стадия «Рабочая документация»;
         "P_and_R" — обе стадии предусмотрены договором;
         "not_found" — стадия не определена.
      3. object_name: извлекай официальное наименование объекта из текста.
         Не сокращай и не перефразируй.
      4. object_location: адрес или описание местоположения объекта.
         Если указан только субъект РФ или населённый пункт — указывай его.
      5. tz_reference: номер или наименование приложения с ТЗ.
         Если ТЗ упомянуто, но номер приложения не указан — "referenced_no_number".
      6. design_sections_listed: "yes" — если в договоре или приложении
         перечислены конкретные разделы ПД (например, АР, КР, ОВиК и т.д.);
         "no" — если разделы не перечислены; "not_found" — информация отсутствует.
      7. Не переходи в разделы об оплате, сроках, ответственности или экспертизе.

      [ПРИМЕРЫ (FEW-SHOT)]
      Пример 1 — предмет определён:
      Текст: «Подрядчик обязуется выполнить проектные работы (стадия П и Р)
      по объекту "Многоквартирный жилой дом по адресу: г. Казань, ул. Баумана, 15"
      в соответствии с Техническим заданием (Приложение № 1 к договору).
      Состав документации: раздел АР, раздел КР, раздел ОВиК, раздел ЭО.»

      Ответ:
      {
        "work_type": "design",
        "object_name": "Многоквартирный жилой дом по адресу: г. Казань, ул. Баумана, 15",
        "object_location": "г. Казань, ул. Баумана, 15",
        "design_stage": "P_and_R",
        "tz_reference": "Приложение № 1",
        "design_sections_listed": "yes",
        "evidence": [
          "Подрядчик обязуется выполнить проектные работы (стадия П и Р) по объекту \"Многоквартирный жилой дом по адресу: г. Казань, ул. Баумана, 15\" в соответствии с Техническим заданием (Приложение № 1 к договору).",
          "Состав документации: раздел АР, раздел КР, раздел ОВиК, раздел ЭО."
        ]
      }

      Пример 2 — предмет определён частично:
      Текст: «Подрядчик выполняет проектные работы по объекту Заказчика.»

      Ответ:
      {
        "work_type": "design",
        "object_name": "not_found",
        "object_location": "not_found",
        "design_stage": "not_found",
        "tz_reference": "not_found",
        "design_sections_listed": "not_found",
        "evidence": [
          "Подрядчик выполняет проектные работы по объекту Заказчика."
        ]
      }

      [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
      1. Извлечено ли официальное наименование объекта без сокращений?
      2. Не перепутаны ли стадия П и стадия Р?
      3. Проверено ли, что tz_reference — это номер приложения, а не просто
         слово «техническое задание»?
      4. Проверено ли design_sections_listed по факту перечисления разделов,
         а не по одному лишь упоминанию состава документации?
      5. Все ли значения enum соответствуют allowed_values?
      6. Заполнены ли все ключи JSON?

      [ФОРМАТ ОТВЕТА]
      Верни строго JSON без пояснений:
      {
        "work_type": "<design / survey / design_and_survey / not_found>",
        "object_name": "<наименование объекта или not_found>",
        "object_location": "<адрес/местоположение или not_found>",
        "design_stage": "<P / R / P_and_R / not_found>",
        "tz_reference": "<номер приложения / referenced_no_number / not_found>",
        "design_sections_listed": "<yes / no / not_found>",
        "evidence": ["<цитата 1>", "<цитата 2>"]
      }
    prompt_file: null
    context_k: 6
    temperature: 0.0
    max_tokens: 500
  retrieval:
    retrieval_profile: "technical_documentation_check"
    corpus_scope: "document"
    context_k: 6
    max_chunks: 10
    boost_keywords:
      - "предмет договора"
      - "проектная документация"
      - "рабочая документация"
      - "инженерные изыскания"
      - "техническое задание"
      - "объект проектирования"
      - "стадия"
      - "состав документации"
    negative_keywords:
      - "неустойка"
      - "оплата"
      - "расторжение"
      - "форс-мажор"
    rerank: true
    filters: {}
  enrichment_hints:
    preferred_segment_types:
      - "clause"
      - "article"
      - "preamble"
    excluded_segment_types:
      - "table"
      - "schedule"
    preferred_clause_functions:
      - "definitions"
      - "obligations"
    confidence_bonuses:
      - condition: "keyword_match"
        keywords:
          - "предмет договора"
          - "объект проектирования"
        bonus: 0.15
      - condition: "keyword_match"
        keywords:
          - "стадия П"
          - "стадия Р"
          - "проектная документация"
        bonus: 0.10
  evidence:
    required: true
    min_snippet_length: 50
    max_snippet_length: 800
  extraction:
    enabled: true
    mode: "hybrid"
    store_payload: true
    llm_max_tokens: 800

    compact_output: false

    llm_prompt_extraction: |
      <role>
      Ты — юрист, извлекающий сведения о предмете договора ПИР.
      Проверяется только раздел «Предмет договора» и вводная часть.
      Не оценивай риски. Только заполняй поля строго по тексту.
      </role>

      <context>
      {context}
      </context>

      <task>
      Заполни строго следующие поля:

      work_type — вид работ по договору
        (allowed: design / survey / design_and_survey / not_found).
        "design" — только проектирование; "survey" — только изыскания;
        "design_and_survey" — оба вида работ.

      object_name — наименование объекта проектирования
        (текстовое значение или not_found).
        Извлекай дословно, не сокращай.

      object_location — адрес или местоположение объекта
        (текстовое значение или not_found).

      design_stage — стадия проектирования
        (allowed: P / R / P_and_R / not_found).
        "P" — проектная документация; "R" — рабочая документация;
        "P_and_R" — обе стадии.

      tz_reference — ссылка на техническое задание
        (номер приложения, например "Приложение № 1",
        или "referenced_no_number" если ТЗ упомянуто без номера,
        или not_found).

      design_sections_listed — перечислены ли разделы ПД в договоре
        (allowed: yes / no / not_found).
        "yes" — только если конкретные разделы перечислены явно.

      Если данные отсутствуют: указывай "not_found" для каждого поля.
      </task>

      <rules>
      1. work_type: "design" — проектные работы; "survey" — инженерные изыскания
         без проектирования; "design_and_survey" — оба вида одновременно;
         "not_found" — вид работ не определён.
      2. design_stage: "P" — стадия «Проектная документация»;
         "R" — стадия «Рабочая документация»; "P_and_R" — обе;
         "not_found" — стадия не указана явно.
      3. tz_reference: извлекай номер приложения, если он указан.
         Если ТЗ упомянуто, но номер не указан — "referenced_no_number".
         Если ТЗ не упомянуто — "not_found".
      4. design_sections_listed: "yes" — только при явном перечислении разделов
         (АР, КР, ТХ, ОВиК и т.д.); "no" — если разделы не перечислены;
         "not_found" — если информации нет.
      5. Не добавляй ключи, не входящие в список полей выше.
      6. Верни только JSON.
      </rules>
    fields:
      - name: "work_type"
        type: "string"
        label: "Вид работ"
        presentation: "badge"
        display_in_grid: true
        display_priority: 1
        allowed_values:
