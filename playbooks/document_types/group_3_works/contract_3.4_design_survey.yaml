- id: author_supervision_terms
  name: 'Авторский надзор: условия и порядок (ст. 12 ФЗ-169)'
  description: 'Проверяет наличие условий авторского надзора — обязателен ли он,

    порядок осуществления, оплата, ответственность.

    '
  legal_base: ст. 12 ФЗ от 17.11.1995 № 169-ФЗ
  triggers:
    any:
    - author_supervision
  ui_mode: field_extraction
  severity: high
  severity_if_pass: pass
  severity_if_fail: high
  severity_if_unclear: high
  origin: DOCUMENT_TYPE
  detector_type: hybrid
  rules:
    keywords:
    - авторский надзор
    - надзор автора проекта
    - контроль за реализацией
