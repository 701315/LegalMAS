      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора ПИР сведения о ТУ
        и внешних согласованиях: кто получает, кто платит, перечень органов,
        последствия задержки.
        Не анализируй экспертизу ПД, форс-мажор или иные темы.
        Не путай ТУ на подключение с исходными данными в целом.
        </role>
        <context>
        {context}
        </context>
        <task>
        Заполни строго следующие 10 полей (плюс evidence):
        1. tu_acquisition_defined — урегулирован ли вопрос ТУ: yes / no / not_defined.
        2. tu_acquisition_defined_display — человеко-читаемое значение: "Да, вопрос урегулирован" / "Нет, вопрос не урегулирован" / "Данные не определены".
        3. tu_responsibility — кто получает ТУ: contractor / client / jointly / not_defined.
        4. tu_responsibility_display — человеко-читаемое значение: "Подрядчик" / "Заказчик" / "Совместно" / "Данные не определены".
        5. tu_cost_bearer — кто оплачивает: contractor / client / jointly / not_defined.
        6. tu_cost_bearer_display — человеко-читаемое значение: "Подрядчик" / "Заказчик" / "Совместно" / "Данные не определены".
        7. external_approvals_listed — перечислены ли согласования: yes / no / not_defined.
        8. external_approvals_listed_display — человеко-читаемое значение: "Да, согласования перечислены" / "Нет, согласования не перечислены" / "Данные не определены".
        9. approval_delay_consequences — последствия задержки: deadline_extension / contractor_risk / not_defined.
        10. approval_delay_consequences_display — человеко-читаемое значение: "Продление срока выполнения работ" / "Риск срыва сроков на Подрядчике" / "Данные не определены".

        Маппинг enum → display:
        - tu_acquisition_defined: yes → "Да, вопрос урегулирован", no → "Нет, вопрос не урегулирован", not_defined → "Данные не определены"
        - tu_responsibility: contractor → "Подрядчик", client → "Заказчик", jointly → "Совместно", not_defined → "Данные не определены"
        - tu_cost_bearer: contractor → "Подрядчик", client → "Заказчик", jointly → "Совместно", not_defined → "Данные не определены"
        - external_approvals_listed: yes → "Да, согласования перечислены", no → "Нет, согласования не перечислены", not_defined → "Данные не определены"
        - approval_delay_consequences: deadline_extension → "Продление срока выполнения работ", contractor_risk → "Риск срыва сроков на Подрядчике", not_defined → "Данные не определены"

        Если данные отсутствуют в тексте:
        - enum-поля = "not_defined"
        - display-поля = "Данные не определены"
        </task>
        <context_rules>
        - Используй только текст договора. Не выдумывай условия получения ТУ или согласований — извлекай строго из переданного фрагмента.
        - Не опирайся на внешние знания о типовых условиях договоров ПИР.
        - Не путай ТУ на подключение к сетям с исходными данными в целом (ГПЗУ, материалы изысканий).
        - Не путай расходы на ТУ с расходами на экспертизу ПД.
        - Верни строго валидный JSON. Все 10 ключей + evidence обязаны присутствовать.
        - Запрещены: null, None, пустые строки "". Для текстовых полей при отсутствии данных — "Данные не определены".
        - Убедись, что enum-значения соответствуют их display-версиям согласно маппингу выше.
        - Различай "no" (тема упоминается, но условие не урегулировано) и "not_defined" (тема вообще не упоминается).
        </context_rules>

        <output_expectations>
        - Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        - Не используй markdown fences.
        - Не добавляй пояснения до или после JSON.
        - Верни все ключи, перечисленные в task, без пропусков.
        - Не используй null, None или пустые строки.
        - Для статусных полей используй только значения из allowed_values или "not_defined".
        - Для текстовых полей при отсутствии данных используй "Данные не определены" / "Не удалось определить" / "Не применимо" — согласно правилам выше.
        </output_expectations>
      fields:
        - name: "tu_acquisition_defined"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Урегулирован ли вопрос получения технических условий (enum)."
