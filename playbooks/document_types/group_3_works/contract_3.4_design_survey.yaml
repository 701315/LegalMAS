      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора ПИР сведения об авторском надзоре:
        включение в договор, scope, порядок оплаты, ответственность за ненадлежащий надзор,
        количественный лимит выездов на объект, порядок оплаты сверхнормативных выездов.
        Не анализируй экспертизу, технический надзор заказчика или иные темы.
        Не путай авторский надзор проектировщика с техническим надзором заказчика.
        </role>
        <context>
        {context}
        </context>
        <task>
        Заполни строго следующие 10 полей (плюс evidence):
        1. author_supervision_included — включён ли авторский надзор: yes / separate_contract / not_defined.
        2. author_supervision_included_display — человеко-читаемое значение: "Да, включён в договор" / "Оформлен отдельным договором" / "Данные не определены".
        3. supervision_scope — scope надзора: full / limited / not_specified / not_defined.
        4. supervision_scope_display — человеко-читаемое значение: "Полный объём" / "Ограниченный объём" / "Не конкретизировано" / "Данные не определены" / "Не применимо".
        5. supervision_payment — порядок оплаты: included_in_price / separate_fee / not_specified / not_defined.
        6. supervision_payment_display — человеко-читаемое значение: "Включён в цену договора" / "Оплачивается отдельно" / "Не указан" / "Данные не определены" / "Не применимо".
        7. supervision_liability — ответственность за надзор: yes / no / not_defined.
        8. supervision_liability_display — человеко-читаемое значение: "Да, ответственность предусмотрена" / "Нет, ответственность не предусмотрена" / "Данные не определены" / "Не применимо".
        9. visit_limit — количественный лимит выездов на объект (текст) или "Данные не определены" или "Не применимо".
        10. extra_visit_fee — порядок оплаты сверхнормативных выездов (текст) или "Данные не определены" или "Не применимо".

        Маппинг enum → display:
        - author_supervision_included: yes → "Да, включён в договор", separate_contract → "Оформлен отдельным договором", not_defined → "Данные не определены"
        - supervision_scope: full → "Полный объём", limited → "Ограниченный объём", not_specified → "Не конкретизировано", not_defined → "Данные не определены" или "Не применимо"
        - supervision_payment: included_in_price → "Включён в цену договора", separate_fee → "Оплачивается отдельно", not_specified → "Не указан", not_defined → "Данные не определены" или "Не применимо"
        - supervision_liability: yes → "Да, ответственность предусмотрена", no → "Нет, ответственность не предусмотрена", not_defined → "Данные не определены" или "Не применимо"

        Критическое правило:
        - Если author_supervision_included = "not_defined" (авторский надзор не упоминается), то все остальные поля (supervision_scope, supervision_payment, supervision_liability) = "not_defined", display = "Данные не определены". Текстовые поля (visit_limit, extra_visit_fee) = "Данные не определены".
        - Если author_supervision_included = "separate_contract" (отдельный договор), то все остальные поля = "not_defined", display = "Не применимо". Текстовые поля (visit_limit, extra_visit_fee) = "Не применимо".
        </task>
        <context_rules>
        - Используй только текст договора. Не выдумывай условия авторского надзора — извлекай строго из переданного фрагмента.
        - Не опирайся на внешние знания о типовых условиях договоров ПИР.
        - Не путай авторский надзор проектировщика с техническим надзором заказчика — это разные институты.
        - Не путай авторский надзор с участием проектировщика в приёмке работ (это часть надзора, но не весь надзор).
        - Не путай лимит выездов (количество) с порядком оплаты сверхнормативных выездов (стоимость).
        - Верни строго валидный JSON. Все 10 ключей + evidence обязаны присутствовать.
        - Запрещены: null, None, пустые строки "". Для текстовых полей при отсутствии данных — "Данные не определены".
        - Убедись, что enum-значения соответствуют их display-версиям согласно маппингу выше.
        - Извлекай лимит выездов дословно из текста (например, "не более 2 выездов в месяц").
        - Извлекай стоимость сверхнормативных выездов дословно из текста (например, "15 000 рублей за выезд").
        </context_rules>

        <output_expectations>
        - Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        - Не используй markdown fences.
        - Не добавляй пояснения до или после JSON.
        - Верни все ключи, перечисленные в task, без пропусков.
        - Не используй null, None или пустые строки.
        - Для статусных полей используй только значения из allowed_values или "not_defined".
        - Для текстовых полей при отсутствии данных используй "Данные не определены" / "Не удалось определить" / "Не применимо" — согласно правилам выше.
        </output_expectations>
      fields:
