        5. payment_linked_to_acts — привязана ли оплата к актам: yes / no / unclear / not_defined.
        6. payment_linked_to_acts_display — человеко-читаемое значение: "Да, оплата привязана к актам" / "Нет, оплата не привязана к актам" / "Не удалось определить" / "Данные не определены".
        7. final_payment_trigger — триггер окончательного расчёта: after_final_act / after_stage_act / after_invoice / not_specified / not_defined.
