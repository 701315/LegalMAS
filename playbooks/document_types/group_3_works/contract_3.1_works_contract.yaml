shared_patterns:
  money_amount: "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|тыс|млн|млрд)"
  date_pattern: "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"
  date_period: "(?i)(не\\s+позднее|в\\s+течение)\\s+\\d+\\s*(календарн|рабоч|дн)"
  inn_pattern: "(?i)\\bИНН\\s*:?\\s*\\d{10,12}\\b"
  percent_pattern: "(?i)\\b\\d+([,.]\\d+)?\\s*%\\s*(в\\s+(день|месяц|год))?"

compliance_rules: []

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: CHECKS_V8 — LLM/hybrid проверки
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 1: Предмет договора подряда — содержание работ и результат
  # ──────────────────────────────────────────────────────────────────────────
  - id: subject_and_result_extraction
    name: "Предмет: содержание работ и овеществлённый результат (ст. 702, 703 ГК РФ)"
    description: >
      Извлекает описание работ и конкретного овеществлённого результата.
      Отсутствие чёткого результата = риск незаключённости.
    triggers: ~
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "подрядчик обязуется"
        - "выполнить работы"
        - "результат работ"
        - "сдать результат"
        - "техническое задание"
        - "спецификация"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)подряд(чик)?\\s+обязуется\\s+выполнить"
        - "(?i)результат\\s+работ.*передать\\s+заказчику"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор подряда по §1 Главы 37 ГК РФ.
        Проверяется только один вопрос: содержание работ, наличие
        овеществлённого результата, ссылка на ТЗ/спецификацию и степень
        определённости результата.

        Нормативный ориентир:
        - ст. 702 ГК РФ
        - ст. 703 ГК РФ
        - ст. 432 ГК РФ

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Описано ли содержание работ.
        2. Есть ли конкретный овеществлённый результат работ.
        3. Есть ли ссылка на техническое задание, спецификацию или иное
           приложение, раскрывающее предмет.
        4. Является ли описание результата конкретным или размытым.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined".
        4. Если текстового значения нет — возвращай "Данные не определены".
        5. Не используй "None", "null", "not_found" или пустые строки.
        6. В evidence включай только текст договора.
        7. Верни только один JSON-объект.
        8. material_result_status = "defined" только если результат имеет
           овеществлённый, а не чисто процессуальный или нематериальный характер.
        9. result_definiteness = "specific" только если из текста понятно,
           что именно должно быть создано, изготовлено, отремонтировано
           или передано заказчику.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — данные определены:
        Фрагмент:
        "Подрядчик обязуется выполнить работы по изготовлению и монтажу
        металлического ограждения на объекте Заказчика. Результатом работ
        является изготовленное и смонтированное металлическое ограждение
        согласно Спецификации № 1, являющейся приложением к договору."

        Ответ:
        {
          "work_description_status": "defined",
          "work_description_value": "Изготовление и монтаж металлического ограждения на объекте Заказчика.",
          "material_result_status": "defined",
          "material_result_value": "Изготовленное и смонтированное металлическое ограждение.",
          "technical_task_referenced": "yes",
          "result_definiteness": "specific",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "Подрядчик обязуется выполнить работы по изготовлению и монтажу металлического ограждения на объекте Заказчика. Результатом работ является изготовленное и смонтированное металлическое ограждение согласно Спецификации № 1."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Исполнитель оказывает консультационные услуги по вопросам организации
        производства."

        Ответ:
        {
          "work_description_status": "not_defined",
          "work_description_value": "Данные не определены",
          "material_result_status": "not_defined",
          "material_result_value": "Данные не определены",
          "technical_task_referenced": "not_defined",
          "result_definiteness": "not_defined",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о содержании работ.
        2. Найди прямую цитату о результате, который должен быть передан заказчику.
        3. Найди прямую цитату о ТЗ, спецификации или приложении.
        4. Проверь, описан ли результат конкретно.
        5. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "work_description_status": "<defined / not_defined>",
          "work_description_value": "<текст или 'Данные не определены'>",
          "material_result_status": "<defined / not_defined>",
          "material_result_value": "<текст или 'Данные не определены'>",
          "technical_task_referenced": "<yes / no / not_defined>",
          "result_definiteness": "<specific / vague / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 620

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "подрядчик обязуется выполнить работы предмет договора результат работ сдать результат техническое задание спецификация овеществлённый результат"
      retrieval_profile: "scope_of_work_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - definitions
        - obligations
      negative_keywords:
        - "цена"
        - "стоимость"
        - "срок оплаты"
        - "неустойка"
        - "штраф"
        - "НДС"
        - "гарантия"
        - "форс-мажор"
      position_bias:
        preferred_range: [0.0, 0.30]
        boost: 0.20
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
        - "technical_specification"
      excluded_segment_types:
        - "price_list"
      preferred_clause_functions:
        - "definitions"
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 50
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 700

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора подряда описание работ,
        овеществлённый результат, ссылку на ТЗ/спецификацию и степень
        определённости результата.
        Не анализируй цену, сроки, приёмку, оплату, ответственность или гарантию.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. work_description_status — "defined" если содержание работ прямо указано,
           иначе "not_defined".
        2. work_description_value — описание содержания работ.
        3. material_result_status — "defined" если прямо указан конкретный
           овеществлённый результат, иначе "not_defined".
        4. material_result_value — описание овеществлённого результата.
        5. technical_task_referenced — "yes" / "no" / "not_defined".
        6. result_definiteness — "specific" / "vague" / "not_defined".

        Если данные отсутствуют:
        - статус = "not_defined"
        - текст = "Данные не определены"
        </task>

        <rules>
        - Используй только текст договора.
        - work_description_status:
            - "defined" — если из текста прямо понятно, какие работы обязан
              выполнить подрядчик.
            - "not_defined" — если содержание работ прямо не раскрыто.
        - material_result_status:
            - "defined" — если прямо указан результат, имеющий овеществлённый
              характер: вещь, объект, конструкция, отремонтированный объект,
              изготовленное изделие и т.п.
            - "not_defined" — если результат прямо не указан или описан только
              как процесс, действие либо нематериальная услуга.
        - technical_task_referenced:
            - "yes" — если договор прямо ссылается на ТЗ, спецификацию,
              приложение, ведомость работ или аналогичный документ,
              раскрывающий предмет.
            - "no" — если предмет описан в договоре и прямой ссылки на отдельный
              документ нет.
            - "not_defined" — если по тексту нельзя установить наличие или
              отсутствие такой ссылки.
        - result_definiteness:
            - "specific" — если результат индивидуализирован достаточно
              конкретно и понятно, что именно должно быть передано заказчику.
            - "vague" — если результат описан общими словами без достаточной
              индивидуализации.
            - "not_defined" — если описание результата прямо не найдено.
        - Верни только JSON.
        </rules>
      fields:
        - name: "work_description_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения содержания работ."
          required: true
        - name: "work_description_value"
          type: "string"
          presentation: "fact"
          label: "Содержание работ"
          description: "Описание содержания работ по договору подряда."
          required: true
          display_in_grid: true
          display_priority: 2
        - name: "material_result_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения овеществлённого результата."
          required: true
        - name: "material_result_value"
          type: "string"
          presentation: "fact"
          label: "Овеществлённый результат"
          description: "Описание конкретного овеществлённого результата работ."
          required: true
          display_in_grid: true
          display_priority: 1
        - name: "technical_task_referenced"
          type: "string"
          presentation: "signal"
          label: "ТЗ / спецификация"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Есть ли прямая ссылка на ТЗ, спецификацию или приложение."
          required: true
          display_in_grid: true
          display_priority: 3
        - name: "result_definiteness"
          type: "string"
          presentation: "signal"
          label: "Определённость результата"
          allowed_values: ["specific", "vague", "not_defined"]
          description: "Степень определённости описания результата."
          required: true
          display_in_grid: true
          display_priority: 4
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 2: Сроки выполнения работ
  # ──────────────────────────────────────────────────────────────────────────
  - id: deadlines_extraction
    name: "Сроки: начальный и конечный — существенные условия (ст. 708 ГК РФ)"
    description: >
      Начальный и конечный сроки — существенные условия договора подряда.
      Отсутствие хотя бы одного = риск незаключённости для коммерческих сторон.
    triggers: ~
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "начало работ"
        - "начальный срок"
        - "конечный срок"
        - "срок выполнения"
        - "срок завершения"
        - "не позднее"
        - "в течение"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"
        - "(?i)(не\\s+позднее|в\\s+течение)\\s+\\d+\\s*(календарн|рабоч|дн)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор подряда по ст. 708 ГК РФ.
        Проверяется только один вопрос: указаны ли начальный и конечный сроки
        выполнения работ, а также промежуточные этапы.

        Нормативный ориентир:
        - ст. 708 ГК РФ
        - ст. 432 ГК РФ

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Указан ли начальный срок выполнения работ.
        2. Указан ли конечный срок выполнения работ.
        3. Указаны ли промежуточные сроки или этапы.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined".
        4. Если текстового значения нет — возвращай "Данные не определены".
        5. Не используй "None", "null", "not_found" или пустые строки.
        6. В evidence включай только текст договора.
        7. Верни только один JSON-объект.
        8. Событийные формулировки допустимы как срок, если они прямо определяют
           момент начала или окончания работ.
        9. intermediate_deadlines = "yes" только если этапы или промежуточные
           сроки прямо перечислены в тексте.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — данные определены:
        Фрагмент:
        "Подрядчик приступает к выполнению работ 01.07.2025. Работы должны быть
        завершены не позднее 31.08.2025. Этап 1 выполняется до 15.07.2025,
        Этап 2 — до 31.08.2025."

        Ответ:
        {
          "start_date_status": "defined",
          "start_date_value": "01.07.2025",
          "end_date_status": "defined",
          "end_date_value": "31.08.2025",
          "intermediate_deadlines": "yes",
          "evidence": [
            {
              "clause_ref": "п. 3.1",
              "quote": "Подрядчик приступает к выполнению работ 01.07.2025. Работы должны быть завершены не позднее 31.08.2025. Этап 1 выполняется до 15.07.2025, Этап 2 — до 31.08.2025."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Подрядчик обязуется выполнить работы в соответствии с техническим
        заданием."

        Ответ:
        {
          "start_date_status": "not_defined",
          "start_date_value": "Данные не определены",
          "end_date_status": "not_defined",
          "end_date_value": "Данные не определены",
          "intermediate_deadlines": "not_defined",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о начале работ.
        2. Найди прямую цитату об окончании работ.
        3. Найди прямую цитату о промежуточных этапах.
        4. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "start_date_status": "<defined / not_defined>",
          "start_date_value": "<текст или 'Данные не определены'>",
          "end_date_status": "<defined / not_defined>",
          "end_date_value": "<текст или 'Данные не определены'>",
          "intermediate_deadlines": "<yes / no / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 560

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "начало работ начальный срок конечный срок срок выполнения срок завершения не позднее в течение этап работ"
      retrieval_profile: "completion_deadline_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - definitions
      negative_keywords:
        - "цена"
        - "стоимость"
        - "аванс"
        - "неустойка"
        - "штраф"
        - "гарантия"
        - "НДС"
        - "форс-мажор"
      position_bias:
        preferred_range: [0.0, 0.45]
        boost: 0.18
        scope: segment
      context_k: 5
      max_chunks: 6
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
        - "technical_specification"
      excluded_segment_types:
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "definitions"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 500

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 600

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора подряда сведения
        о начальном сроке, конечном сроке и промежуточных этапах работ.
        Не анализируй цену, оплату, приёмку, ответственность или гарантию.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. start_date_status — "defined" если начальный срок прямо указан,
           иначе "not_defined".
        2. start_date_value — дата или событийная формулировка начала работ.
        3. end_date_status — "defined" если конечный срок прямо указан,
           иначе "not_defined".
        4. end_date_value — дата или событийная формулировка окончания работ.
        5. intermediate_deadlines — "yes" / "no" / "not_defined".

        Если данные отсутствуют:
        - статус = "not_defined"
        - текст = "Данные не определены"
        </task>

        <rules>
        - Используй только текст договора.
        - start_date_status:
            - "defined" — если текст прямо устанавливает дату или событие,
              с которого начинаются работы.
            - "not_defined" — если начальный срок прямо не установлен.
        - end_date_status:
            - "defined" — если текст прямо устанавливает дату или событие,
              к которому работы должны быть завершены.
            - "not_defined" — если конечный срок прямо не установлен.
        - intermediate_deadlines:
            - "yes" — если этапы, промежуточные сроки или отдельные вехи
              выполнения прямо перечислены.
            - "no" — если начальный и/или конечный срок указаны, но этапы
              прямо не выделены.
            - "not_defined" — если по тексту нельзя установить наличие
              или отсутствие промежуточных сроков.
        - Верни только JSON.
        </rules>
      fields:
        - name: "start_date_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания начального срока."
          required: true
        - name: "start_date_value"
          type: "string"
          presentation: "fact"
