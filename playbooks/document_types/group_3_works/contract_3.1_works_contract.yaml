        - "гражданин"
        - "физическое лицо"
        - "ИНН"
        - "ОГРН"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(подрядчик|заказчик).*именуем"
        - "(?i)крупн(ая|ой)\\s+сделк"
        - "(?i)заинтересованност"
        - "(?i)одобрен(ие|а)"
        - "(?i)действующ[а-яё]+\\s+на\\s+основании"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
