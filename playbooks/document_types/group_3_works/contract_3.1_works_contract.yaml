# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 3: SHARED PATTERNS
#  Читается: DocTypeCheckLoader через _resolve_yaml_templates()
# ════════════════════════════════════════════════════════════════════════════

shared_patterns:
  money_amount: "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|тыс|млн|млрд)"
  date_pattern: "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"
  date_period: "(?i)(не\\s+позднее|в\\s+течение)\\s+\\d+\\s*(календарн|рабоч|дн)"
  inn_pattern: "(?i)\\bИНН\\s*:?\\s*\\d{10,12}\\b"
  percent_pattern: "(?i)\\b\\d+([,.]\\d+)?\\s*%\\s*(в\\s+(день|месяц|год))?"

compliance_rules: []

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: CHECKS_V8 — LLM/hybrid проверки
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  - id: subject_and_result_extraction
    name: "Предмет: содержание работ и результат работ (ст. 702, 703 ГК РФ)"
    description: >
      Извлекает описание содержания работ, конкретного результата работ,
      ссылку на ТЗ, спецификацию или иной документ, раскрывающий предмет,
      а также степень определённости результата.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "подрядчик обязуется"
        - "выполнить работы"
        - "результат работ"
        - "сдать результат"
        - "техническое задание"
        - "спецификация"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)подряд(чик)?\\s+обязуется\\s+выполнить"
        - "(?i)результат\\s+работ.*передать\\s+заказчику"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор подряда по §1 Главы 37 ГК РФ.

        Проверяется один вопрос: насколько определён предмет договора через
        содержание работ и результат, который должен быть достигнут подрядчиком,
        а также раскрывается ли предмет через техническое задание, спецификацию
        или иной отдельный документ.

        Нормативный ориентир:
        - ст. 702 ГК РФ
        - ст. 703 ГК РФ
        - ст. 432 ГК РФ

        Важно:
        - Твоя задача — установить только то, что прямо следует из текста договора.
        - Не подставляй содержание условий из норм закона.
        - Не оценивай серьёзность риска.
        - Не делай вывод об отсутствии условия только потому, что оно не попало
          в предоставленный контекст.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]

        Найди в предоставленном контексте:

        1. Описано ли содержание работ, которые обязан выполнить подрядчик.

        2. Указан ли конкретный результат работ.

          Под результатом работ понимается конкретный результат деятельности
          подрядчика, выражающийся, например, в созданной, изготовленной,
          переработанной, отремонтированной, смонтированной или иной изменённой
          вещи, объекте или ином конкретно идентифицируемом результате работ.

          Не признавай конкретным результатом только общее описание процесса
          или действий без возможности установить, что именно должно быть
          создано, изменено, отремонтировано, изготовлено, смонтировано или
          сдано заказчику.

        3. Есть ли прямая ссылка на техническое задание, спецификацию, приложение,
          ведомость работ или иной отдельный документ, который раскрывает
          содержание работ или предмет договора.

        4. Насколько конкретно определён результат работ.

        [ПРАВИЛА]

        1. Используй только текст предоставленного документа и контекста.

        2. Не подставляй нормы закона вместо содержания договора.

        3. Не придумывай отсутствующие условия, документы, приложения,
          характеристики или результаты.

        4. Значение "not_defined" допускается только в полях, для которых
          оно предусмотрено схемой ответа.

        5. Не используй "None", "null" или пустые строки.

        6. Если текстовое значение отсутствует, возвращай:
          "Данные не определены".

        7. В evidence включай только точные фрагменты текста договора.

        8. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        9. work_description_status = "defined" только если из текста прямо
          понятно, какие работы обязан выполнить подрядчик.

        10. material_result_status = "defined" только если из текста прямо
            можно установить конкретный результат работ.

            Результатом может быть, в частности:
            - изготовленная вещь или изделие;
            - созданный объект;
            - смонтированная конструкция;
            - отремонтированный объект;
            - переработанная или изменённая вещь;
            - иной конкретно идентифицируемый результат выполненных работ.

            Простое указание на выполнение действий или процесса без возможности
            установить конкретный результат не является достаточным основанием
            для значения "defined".

        11. technical_task_referenced = "yes" только при наличии прямой ссылки
            в предоставленном тексте на ТЗ, спецификацию, приложение, ведомость
            работ или иной отдельный документ, раскрывающий предмет.

        12. Не возвращай technical_task_referenced = "no" только потому, что
            ссылка на ТЗ или иной документ не найдена в предоставленном контексте.

            Если наличие или отсутствие такой ссылки невозможно надёжно установить
            по предоставленному контексту, возвращай "not_defined".

        13. result_definiteness = "specific" только если из текста понятно,
            какой именно результат должен быть достигнут или сдан заказчику.

        14. result_definiteness = "vague" только если результат прямо упомянут,
            но описан слишком общими словами и не позволяет достаточно конкретно
            установить, что именно должно быть получено в результате работ.

        15. result_definiteness = "not_defined", если конкретное описание
            результата в предоставленном контексте не найдено.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — данные определены:

        Фрагмент:

        "Подрядчик обязуется выполнить работы по изготовлению и монтажу
        металлического ограждения на объекте Заказчика. Результатом работ
        является изготовленное и смонтированное металлическое ограждение
        согласно Спецификации № 1, являющейся приложением к договору."

        Ответ:

        {
          "work_description_status": "defined",
          "work_description_value": "Изготовление и монтаж металлического ограждения на объекте Заказчика.",
          "material_result_status": "defined",
          "material_result_value": "Изготовленное и смонтированное металлическое ограждение.",
          "technical_task_referenced": "yes",
          "technical_task_reference_display": "Предмет работ раскрывается в Спецификации № 1.",
          "result_definiteness": "specific",
          "result_definiteness_display": "Результат работ определён конкретно.",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "Подрядчик обязуется выполнить работы по изготовлению и монтажу металлического ограждения на объекте Заказчика. Результатом работ является изготовленное и смонтированное металлическое ограждение согласно Спецификации № 1."
            }
          ]
        }

        Пример 2 — содержание работ указано, но результат недостаточно определён:

        Фрагмент:

        "Подрядчик обязуется выполнить ремонтные работы на объекте Заказчика.
        Конкретный перечень работ, технические характеристики и результат
        работ определяются Заказчиком дополнительно."

        Ответ:

        {
          "work_description_status": "defined",
          "work_description_value": "Выполнение ремонтных работ на объекте Заказчика.",
          "material_result_status": "not_defined",
          "material_result_value": "Данные не определены",
          "technical_task_referenced": "not_defined",
          "technical_task_reference_display": "Отдельный документ, раскрывающий предмет работ, в предоставленном контексте не установлен.",
          "result_definiteness": "not_defined",
          "result_definiteness_display": "Конкретный результат работ в предоставленном контексте не определён.",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "Подрядчик обязуется выполнить ремонтные работы на объекте Заказчика. Конкретный перечень работ, технические характеристики и результат работ определяются Заказчиком дополнительно."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]

        1. Найди прямую цитату о содержании работ.

        2. Найди прямую цитату о конкретном результате работ.

        3. Найди прямую цитату о ТЗ, спецификации, приложении или ином документе,
          если такая ссылка прямо присутствует в контексте.

        4. Проверь, позволяет ли текст конкретно установить результат работ.

        5. Не делай вывод об отсутствии ТЗ, спецификации или приложения только
          на основании того, что ссылка не найдена в предоставленном контексте.

        6. Если прямого текстового основания для вывода нет — используй значение,
          предусмотренное схемой для неопределённости.

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]

        {
          "work_description_status": "<defined / not_defined>",
          "work_description_value": "<текст или 'Данные не определены'>",
          "material_result_status": "<defined / not_defined>",
          "material_result_value": "<текст или 'Данные не определены'>",
          "technical_task_referenced": "<yes / no / not_defined>",
          "technical_task_reference_display": "<понятное описание для юриста>",
          "result_definiteness": "<specific / vague / not_defined>",
          "result_definiteness_display": "<понятное описание для юриста>",
          "evidence": [
            {
              "clause_ref": "<пункт>",
              "quote": "<точная цитата>"
            }
          ]
        }

      context_k: 6
      temperature: 0.0
      max_tokens: 750

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: >
        подрядчик обязуется выполнить работы предмет договора результат работ
        сдать результат техническое задание спецификация перечень работ
        описание работ результат выполненных работ
      retrieval_profile: "scope_of_work_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - definitions
        - obligations
      negative_keywords:
        - "цена"
        - "стоимость"
        - "срок оплаты"
        - "неустойка"
        - "штраф"
        - "НДС"
        - "форс-мажор"
      position_bias:
        preferred_range: [0.0, 0.30]
        boost: 0.20
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
        - "technical_specification"
      excluded_segment_types:
        - "price_list"
      preferred_clause_functions:
        - "definitions"
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 50
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 800

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист.

        Извлеки из предоставленного контекста договора подряда:

        - содержание работ;
        - конкретный результат работ;
        - наличие прямой ссылки на ТЗ, спецификацию, приложение, ведомость работ
          или иной документ, раскрывающий предмет;
        - степень определённости результата.

        Не анализируй цену, сроки, приёмку, оплату, ответственность или гарантию.
        Не оценивай серьёзность юридического риска.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. work_description_status
        2. work_description_value
        3. material_result_status
        4. material_result_value
        5. technical_task_referenced
        6. technical_task_reference_display
        7. result_definiteness
        8. result_definiteness_display

        Если текстовое значение отсутствует:

        - статус = "not_defined";
        - текстовое значение = "Данные не определены".

        Не используй "None", "null" или пустые строки.
        </task>

        <context_rules>
        Используй только текст предоставленного контекста.
        Не придумывай отсутствующие условия, документы, приложения или результаты.
        work_description_status:
        - "defined" — если из текста прямо понятно, какие работы обязан выполнить
        подрядчик.
        - "not_defined" — если содержание работ прямо не раскрыто.
        work_description_value:
        - кратко извлеки содержание работ;
        - не пересказывай документ полностью;
        - если содержание работ не установлено, верни:
        "Данные не определены".
        material_result_status:
        - "defined" — если из текста прямо можно установить конкретный результат
        работ.
        Результатом может быть, в частности:
        - изготовленная вещь или изделие;
        - созданный объект;
        - смонтированная конструкция;
        - отремонтированный объект;
        - переработанная или изменённая вещь;
        - иной конкретно идентифицируемый результат выполненных работ.
        - "not_defined" — если конкретный результат прямо не указан либо текст
        описывает только процесс или действия без возможности установить,
        что именно должно быть создано, изменено, отремонтировано,
        изготовлено, смонтировано или сдано заказчику.
        material_result_value:
        - кратко извлеки конкретный результат работ;
        - если результат не установлен, верни:
        "Данные не определены".
        technical_task_referenced:
        - "yes" — если в предоставленном контексте есть прямая ссылка на ТЗ,
        спецификацию, приложение, ведомость работ или иной отдельный документ,
        раскрывающий предмет.
        - "no" — только если предоставленный текст прямо позволяет установить,
        что отдельный документ для раскрытия предмета не предусмотрен.
        - "not_defined" — если наличие или отсутствие такого документа нельзя
        надёжно установить по предоставленному контексту.
        Не возвращай "no" только потому, что ссылка на ТЗ или иной документ
        не была найдена в retrieved context.
        technical_task_reference_display:
        - если technical_task_referenced = "yes":
        кратко укажи, какой документ раскрывает предмет, например:
        "Предмет работ раскрывается в Спецификации № 1."
        - если technical_task_referenced = "no":
        "Отдельный документ, раскрывающий предмет работ, прямо не предусмотрен."
        - если technical_task_referenced = "not_defined":
        "Отдельный документ, раскрывающий предмет работ, в предоставленном контексте не установлен."
        result_definiteness:
        - "specific" — если результат индивидуализирован достаточно конкретно
        и из текста понятно, что именно должно быть получено, создано,
        изменено, изготовлено, отремонтировано, смонтировано или сдано
        заказчику.
        - "vague" — если результат прямо упомянут, но описан общими словами
        без достаточной конкретизации.
        - "not_defined" — если описание конкретного результата прямо не найдено.
        result_definiteness_display:
        - если result_definiteness = "specific":
        "Результат работ определён конкретно."
        - если result_definiteness = "vague":
        "Описание результата работ недостаточно конкретно."
        - если result_definiteness = "not_defined":
        "Конкретный результат работ в предоставленном контексте не определён."
        </context_rules>

        <output_expectations>
        Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        </output_expectations>

        <output_format>
        {
          "work_description_status": "defined | not_defined",
          "work_description_value": "string",
          "material_result_status": "defined | not_defined",
          "material_result_value": "string",
          "technical_task_referenced": "yes | no | not_defined",
          "technical_task_reference_display": "string",
          "result_definiteness": "specific | vague | not_defined",
          "result_definiteness_display": "string"
        }
        </output_format>

      fields:

        - name: "work_description_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
