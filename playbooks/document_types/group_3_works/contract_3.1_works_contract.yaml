    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      presence_signal:
        field: "permit_obligations_allocation_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_max_tokens: 450

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора подряда условия
        о распределении обязанностей по получению разрешительной документации.
        Не анализируй цену, сроки выполнения, штрафы или налоги.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. permit_obligations_allocation_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если permit_obligation_party ≠ "not_defined"
             или хотя бы одно из fact-полей (specific_permits_list,
             permit_delay_consequences) ≠ "Данные не определены";
           - "missing" — если permit_obligation_party = "not_defined"
             и оба fact-поля = "Данные не определены";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - permit_obligation_party = "not_defined";
           - permit_obligation_party_display = "Распределение обязанностей по получению разрешений в предоставленном контексте не установлено.";
           - specific_permits_list = "Данные не определены";
           - permit_delay_consequences = "Данные не определены";
           - не выполняй остальные шаги.

        1. permit_obligation_party:
           - "customer" — если заказчик прямо обязан получить разрешения;
           - "contractor" — если подрядчик прямо обязан получить разрешения;
           - "shared" — если обязанности распределены между сторонами;
           - "not_defined" — если по тексту это не установлено.

        2. permit_obligation_party_display:
           - если "customer": "Заказчик обязан получить разрешения и согласования.";
           - если "contractor": "Подрядчик обязан получить разрешения и согласования.";
           - если "shared": "Обязанности по получению разрешений распределены между сторонами.";
           - если "not_defined": "Распределение обязанностей по получению разрешений в предоставленном контексте не установлено."

        3. specific_permits_list:
           Перечень конкретных разрешений или согласований по прямому
           тексту договора (например, "разрешение на строительство,
           технические условия на подключение, согласование проектной
           документации").
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        4. permit_delay_consequences:
            Последствия задержки получения разрешений по прямой формулировке
            из текста договора.
            Если данных нет — "Данные не определены".
        </task>

        <context_rules>
        - Перед остальными полями заполни permit_obligations_allocation_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — permit_obligation_party = "not_defined", все fact-поля = "Данные не определены".
        - Используй только текст договора. Не подставляй нормы Градостроительного кодекса или ст. 740 ГК вместо текста договора.
        - Не определяй распределение обязанностей на основании диспозитивных норм закона — только по прямому тексту договора.
        - Если в разных фрагментах указаны противоречивые условия — presence = "unclear", permit_obligation_party = "not_defined".
        - Не используй "None", "null" или пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни разрешений, ни согласований, ни распределения
           обязанностей по их получению.
           → presence = "missing";
             permit_obligation_party = "not_defined";
             specific_permits_list = "Данные не определены";
             permit_delay_consequences = "Данные не определены".

        2. Только перечень разрешений без распределения.
           "Для выполнения работ требуются: разрешение на строительство,
           ТУ на подключение" без указания, кто получает.
           → presence = "present";
             permit_obligation_party = "not_defined";
             specific_permits_list = "Разрешение на строительство, ТУ на подключение";
             permit_delay_consequences = "Данные не определены".

        3. Противоречие в распределении.
           В одном пункте "Заказчик получает все разрешения", в другом —
           "Подрядчик обязан получить разрешение на строительство".
           → presence = "unclear";
             permit_obligation_party = "not_defined";
             permit_obligation_party_display = "Не удалось определить".

        4. Полное регулирование.
           Распределение + перечень + последствия задержки.
           → presence = "present";
             permit_obligation_party = "shared";
             specific_permits_list содержит полный перечень;
             permit_delay_consequences отражает последствия.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для permit_obligations_allocation_presence используй только: "present", "missing", "unclear".
        - Для permit_obligation_party используй только: "customer", "contractor", "shared", "not_defined".
        - Fallback при отсутствии данных:
          * permit_obligation_party_display → "Распределение обязанностей по получению разрешений в предоставленном контексте не установлено.";
          * specific_permits_list → "Данные не определены";
          * permit_delay_consequences → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * permit_obligation_party_display → "Не удалось определить";
          * specific_permits_list → "Не удалось определить";
          * permit_delay_consequences → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "permit_obligations_allocation_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования разрешительной документации. Внутреннее агрегатное signal-поле."
          required: true

        - name: "permit_obligation_party"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["customer", "contractor", "shared", "not_defined"]
          description: "Какая сторона обязана получить разрешения."
          required: true
          display_in_grid: false

        - name: "permit_obligation_party_display"
          type: "string"
          presentation: "fact"
          label: "Распределение обязанностей"
          description: "Понятное для юриста описание распределения обязанностей по получению разрешений."
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "specific_permits_list"
          type: "string"
          presentation: "fact"
          label: "Перечень разрешений"
          description: "Перечень конкретных разрешений или согласований."
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "permit_delay_consequences"
          type: "string"
          presentation: "fact"
          label: "Последствия задержки"
          description: "Последствия задержки получения разрешений."
          required: true
          display_in_grid: true
          display_priority: 3

      store_payload: true

  - id: change_order_procedure
    name: "Изменение объема работ: процедура согласования и последствия"
    description: >
