      store_payload: true

  - id: hse_compliance_obligations
    name: "Охрана труда и техника безопасности: соблюдение и последствия нарушений"
    description: >
      Фактографическая проверка того, предусмотрены ли в договоре обязанности
      подрядчика по соблюдению требований охраны труда и техники безопасности
