        - ст. 709 ГК РФ (цена работ)

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Какова процедура согласования дополнительных или измененных работ.
        2. Требуется ли письменное дополнительное соглашение до начала работ.
        3. Каковы последствия выполнения работ без согласования.

