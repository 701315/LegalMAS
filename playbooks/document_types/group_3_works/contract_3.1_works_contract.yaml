        2. notification_duty_present — "yes" / "no" / "not_defined".
        3. deadline_suspension_present — "yes" / "no" / "not_defined".
        4. termination_right_after_force_majeure — "yes" / "no" / "not_defined".

        Если данные отсутствуют:
        - статус = "not_defined"
        - текст = "Данные не определены"
        </task>

        <rules>
        - Используй только текст договора.
        - force_majeure_definition_present:
            - "yes" — если договор прямо содержит определение форс-мажора
              или перечень обстоятельств непреодолимой силы.
            - "no" — если договор прямо указывает на отсутствие такого раздела
              или регулирования.
            - "not_defined" — если по тексту это не установлено.
        - notification_duty_present:
            - "yes" — если обязанность уведомления прямо закреплена.
            - "no" — если договор прямо исключает такую обязанность.
            - "not_defined" — если это прямо не установлено.
        - deadline_suspension_present:
            - "yes" — если договор прямо предусматривает продление,
              приостановление или перенос сроков.
            - "no" — если договор прямо исключает такое последствие.
            - "not_defined" — если это прямо не установлено.
        - termination_right_after_force_majeure:
            - "yes" — если договор прямо предусматривает право на расторжение
              при длительном форс-мажоре.
            - "no" — если договор прямо исключает такое право.
            - "not_defined" — если это прямо не установлено.
        - Верни только JSON.
        </rules>
      fields:
