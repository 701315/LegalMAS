           - suspension_grounds = "Данные не определены";
           - не выполняй остальные шаги.

        1. suspension_right_present:
           - "yes" — если право подрядчика приостановить работы прямо указано;
           - "no" — если договор прямо исключает такое право;
           - "not_defined" — если по тексту это нельзя установить.

        2. suspension_right_present_display:
           - если "yes": "Право на приостановку работ предусмотрено.";
           - если "no": "Право на приостановку работ прямо исключено.";
           - если "not_defined": "Право на приостановку работ в предоставленном контексте не установлено."

        3. immediate_notification_duty:
           - "yes" — если обязанность немедленно уведомить или предупредить
             заказчика прямо указана;
           - "no" — если договор прямо исключает такую обязанность;
           - "not_defined" — если по тексту это нельзя установить.

        4. immediate_notification_duty_display:
           - если "yes": "Обязанность немедленно уведомить заказчика предусмотрена.";
           - если "no": "Обязанность уведомления прямо исключена.";
           - если "not_defined": "Обязанность уведомления в предоставленном контексте не установлена."

        5. suspension_grounds:
           Основания для приостановки или уведомления по прямому тексту
           договора (например, "непригодность материалов", "неверные указания",
           "неисполнение заказчиком обязательств").
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни suspension_notification_right_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все signal-поля = "not_defined", все *_display = соответствующий fallback, suspension_grounds = "Данные не определены".
        - Используй только текст договора. Не подставляй нормы закона вместо текста договора.
