        - name: "retention_condition"
          type: "string"
          presentation: "fact"
          label: "Условие удержания"
          description: "При каком условии возникает право удержания."
          required: true
          display_in_grid: true
          display_priority: 3

      store_payload: true

  - id: penalty_for_delay_contractor
    name: "Неустойка за просрочку выполнения работ (ст. 330, 708 ГК РФ)"
    description: >
      Фактографическая проверка наличия договорной неустойки за просрочку
      выполнения работ подрядчиком, её вида и формулировки размера.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "неустойка за просрочку"
        - "пеня"
        - "штраф за нарушение сроков"
        - "процент за каждый день просрочки"
        - "пени за просрочку"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)за\\s+нарушение\\s+сроков.*подрядчик.*уплачивает.*неустойку"
        - "(?i)пен[яи]\\s+.*\\d+.*%.*за.*каждый.*день"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор подряда по ст. 330 и 708 ГК РФ.
        Проверяется только один вопрос: есть ли в договоре неустойка
        за просрочку выполнения работ подрядчиком и как она сформулирована.

        Нормативный ориентир:
        - ст. 330 ГК РФ
        - ст. 708 ГК РФ

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Предусмотрена ли неустойка за просрочку выполнения работ подрядчиком.
        2. Какой вид расчёта неустойки указан.
        3. Как сформулирован размер неустойки.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined".
        4. Если текстового значения нет — возвращай "Данные не определены".
        5. Не используй "None", "null", "not_defined" или пустые строки.
        6. contractor_delay_penalty_present = "yes" только если санкция
           за просрочку подрядчика прямо установлена договором.
        7. contractor_delay_penalty_basis определяй только по прямой
           формулировке способа расчёта.
        8. contractor_delay_penalty_rate заполняй только по прямому тексту
           о размере или формуле санкции.
        9. В evidence включай только текст договора.
        10. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — данные определены:
        Фрагмент:
        "За нарушение срока выполнения работ Подрядчик уплачивает Заказчику
        пеню в размере 0,1% от цены просроченных работ за каждый день
        просрочки."

        Ответ:
        {
          "contractor_delay_penalty_present": "yes",
          "contractor_delay_penalty_present_display": "Неустойка за просрочку выполнения работ предусмотрена.",
          "contractor_delay_penalty_basis": "percent_per_day",
          "contractor_delay_penalty_basis_display": "Процент за каждый день просрочки.",
          "contractor_delay_penalty_rate": "0,1% от цены просроченных работ за каждый день просрочки.",
          "evidence": [
            {
              "clause_ref": "п. 8.2",
              "quote": "За нарушение срока выполнения работ Подрядчик уплачивает Заказчику пеню в размере 0,1% от цены просроченных работ за каждый день просрочки."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Стороны несут ответственность в соответствии с законодательством РФ."

        Ответ:
        {
          "contractor_delay_penalty_present": "not_defined",
          "contractor_delay_penalty_present_display": "Неустойка за просрочку выполнения работ в предоставленном контексте не установлена.",
          "contractor_delay_penalty_basis": "not_defined",
          "contractor_delay_penalty_basis_display": "Способ расчёта неустойки не установлен.",
          "contractor_delay_penalty_rate": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о санкции за просрочку подрядчика.
        2. Найди прямую цитату о способе расчёта санкции.
        3. Найди прямую цитату о размере санкции.
        4. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "contractor_delay_penalty_present": "<yes / no / not_defined>",
          "contractor_delay_penalty_present_display": "<понятное описание для юриста>",
          "contractor_delay_penalty_basis": "<percent_per_day / fixed_amount / mixed / other / not_defined>",
          "contractor_delay_penalty_basis_display": "<понятное описание для юриста>",
          "contractor_delay_penalty_rate": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 520

    retrieval:
      retrieval_profile: "liability_cap_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "неустойка за просрочку пеня штраф за нарушение сроков процент за каждый день просрочки подрядчик"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
      negative_keywords:
        - "оплата заказчиком"
        - "проценты по ст. 395"
        - "НДС"
        - "гарантия"
        - "форс-мажор"
        - "подсудность"
      position_bias:
        preferred_range: [0.45, 1.0]
        boost: 0.18
        scope: segment
      context_k: 5
      max_chunks: 6
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "price_list"
      preferred_clause_functions:
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 550

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      presence_signal:
        field: "penalty_for_delay_contractor_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_max_tokens: 400

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора подряда условия
        о неустойке за просрочку выполнения работ подрядчиком.
        Не анализируй санкции за просрочку оплаты заказчиком, гарантию,
        налоги или подсудность.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. penalty_for_delay_contractor_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (contractor_delay_penalty_present, contractor_delay_penalty_basis)
             ≠ "not_defined";
           - "missing" — если оба содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - contractor_delay_penalty_present = "not_defined";
           - contractor_delay_penalty_basis = "not_defined";
           - contractor_delay_penalty_present_display = "Неустойка за просрочку выполнения работ в предоставленном контексте не установлена.";
           - contractor_delay_penalty_basis_display = "Способ расчёта неустойки не установлен.";
           - contractor_delay_penalty_rate = "Данные не определены";
           - не выполняй остальные шаги.

        1. contractor_delay_penalty_present:
           - "yes" — если санкция за просрочку подрядчика прямо установлена;
           - "no" — если договор прямо исключает такую санкцию;
           - "not_defined" — если по тексту это нельзя установить.

        2. contractor_delay_penalty_present_display:
           - если "yes": "Неустойка за просрочку выполнения работ предусмотрена.";
           - если "no": "Неустойка за просрочку выполнения работ прямо исключена.";
           - если "not_defined": "Неустойка за просрочку выполнения работ в предоставленном контексте не установлена."

        3. contractor_delay_penalty_basis:
           - "percent_per_day" — процент за день или иной период просрочки;
           - "fixed_amount" — фиксированная сумма;
           - "mixed" — сочетание процента и фиксированной суммы;
           - "other" — иной способ расчёта;
           - "not_defined" — способ расчёта не установлен.

        4. contractor_delay_penalty_basis_display:
           - если "percent_per_day": "Процент за каждый день просрочки.";
           - если "fixed_amount": "Фиксированная сумма.";
           - если "mixed": "Смешанный расчёт (процент и фиксированная сумма).";
           - если "other": "Иной способ расчёта.";
           - если "not_defined": "Способ расчёта неустойки не установлен."

        5. contractor_delay_penalty_rate:
           Формулировка размера или формулы неустойки по прямому тексту
           договора.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни penalty_for_delay_contractor_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все signal-поля = "not_defined", все *_display = соответствующий fallback, contractor_delay_penalty_rate = "Данные не определены".
        - Используй только текст договора. Не подставляй нормы закона вместо текста договора.
        - Общая фраза "Стороны несут ответственность в соответствии с законодательством РФ" без конкретной неустойки — contractor_delay_penalty_present = "not_defined".
        - Если в разных фрагментах указаны противоречивые размеры неустойки — presence = "unclear", contractor_delay_penalty_present = "not_defined".
        - Не используй "None", "null" или пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни неустойки за просрочку подрядчика, ни пени,
           ни штрафа (только общая фраза об ответственности по закону).
           → presence = "missing";
             все signal-поля = "not_defined";
             все *_display = соответствующий fallback;
             contractor_delay_penalty_rate = "Данные не определены".

        2. Неустойка есть, но размер не указан.
           "За нарушение сроков Подрядчик уплачивает неустойку"
           без указания процента или суммы.
           → presence = "present";
             contractor_delay_penalty_present = "yes";
             contractor_delay_penalty_basis = "not_defined";
             contractor_delay_penalty_rate = "Данные не определены".

        3. Противоречие в размере.
           В одном пункте "пеня 0,1% в день", в другом —
           "пеня 0,5% в день".
           → presence = "unclear";
             contractor_delay_penalty_present = "not_defined";
             contractor_delay_penalty_rate = "Не удалось определить".

        4. Фиксированная сумма.
           "За каждый день просрочки Подрядчик уплачивает штраф
           в размере 5 000 рублей."
           → presence = "present";
             contractor_delay_penalty_present = "yes";
             contractor_delay_penalty_basis = "fixed_amount";
             contractor_delay_penalty_rate = "5 000 рублей за каждый день просрочки".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для penalty_for_delay_contractor_presence используй только: "present", "missing", "unclear".
        - Для contractor_delay_penalty_present используй только: "yes", "no", "not_defined".
        - Для contractor_delay_penalty_basis используй только: "percent_per_day", "fixed_amount", "mixed", "other", "not_defined".
        - Fallback при отсутствии данных:
          * contractor_delay_penalty_present_display → "Неустойка за просрочку выполнения работ в предоставленном контексте не установлена.";
          * contractor_delay_penalty_basis_display → "Способ расчёта неустойки не установлен.";
          * contractor_delay_penalty_rate → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_display → "Не удалось определить";
          * contractor_delay_penalty_rate → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "penalty_for_delay_contractor_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие неустойки за просрочку подрядчика. Внутреннее агрегатное signal-поле."
          required: true

        - name: "contractor_delay_penalty_present"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Есть ли договорная неустойка за просрочку выполнения работ."
          required: true
          display_in_grid: false

        - name: "contractor_delay_penalty_present_display"
          type: "string"
          presentation: "fact"
          label: "Неустойка подрядчика"
