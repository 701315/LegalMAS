type: contract_3.1_works_contract
name: "Договор подряда (общий)"
version: 6.0
parent: class_3_work_performance
description: |
  Базовая конструкция (locatio-conductio operis) для договоров, направленных на создание
  или изменение вещи (материальный результат). Подрядчик действует своим иждивением,
  самостоятельно определяя способы выполнения. Заказчик оплачивает принятый результат.
  Ключевое отличие от услуг: результат овеществлён и передаваем (пошив костюма, ремонт станка,
  изготовление мебели). Регулируется § 1 Главы 37 ГК РФ (ст. 702–729).
metadata:
  category: contract
  subcategory: work_performance
  complexity: medium
  risk_level: high
  jurisdiction: RU
  language: ru
  legal_base: "§ 1 Главы 37 ГК РФ (ст. 702-729)"
  doc_types_supported:
    - "договор подряда"
    - "договор на выполнение работ"
    - "договор подряда на изготовление"
    - "договор подряда на переработку (обработку)"
    - "договор на ремонт оборудования/станка/техники"
    - "договор подряда с физическим лицом"
    - "договор подряда с давальческими материалами"
    - "договор на переработку"
    - "договор на ремонт"
    - "договор на капитальный ремонт"
    - "договор изготовления продукции"
    - "договор переработки давальческого сырья"

    - "works agreement"
    - "works contract"
    - "fabrication contract"
    - "processing agreement"
    - "manufacturing agreement"
    - "toll manufacturing agreement"
    - "contractor agreement"
    - "contract for work and materials"
    - "independent contractor agreement"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 1: КЛАССИФИКАЦИЯ (L1/L2)
#  Читается: YAMLRegistry → L1FilenameClassifier, L2HeaderClassifier
# ════════════════════════════════════════════════════════════════════════════

classification_runtime_v1:

  scoring:
    accept_threshold: 0.76
    strong_signal_threshold: 0.86
    ambiguity_margin: 0.16
    input_quality_weight: 1.0

  rules:

    filename_patterns:
      - pattern: "(?i)\\bдоговор[\\s_.-]*подряда\\b"
        kind: generic_form
        weight: 0.60
        # Общая юридическая форма подряда; для fallback-типа не должна доминировать над специализированными подвидами

      - pattern: "(?i)\\bподряд\\b"
        kind: generic_form
        weight: 0.54
        # Базовый русский маркер подряда без уточнения вида

      - pattern: "(?i)\\bдоговор[\\s_.-]*(?:на[\\s_.-]*)?выполнени[а-я]*[\\s_.-]*работ[а-я]*\\b"
        kind: generic_form
        weight: 0.56
        # Выполнение работ — общая формула, шире чистого подряда

      - pattern: "(?i)\\bдоговор[\\s_.-]*подряда[\\s_.-]*(?:на[\\s_.-]*)?изготовлени[а-я]*\\b"
        kind: specific_subject
        weight: 0.88
        # Подряд на изготовление вещи — ключевой subject-маркер общего подряда (locatio-conductio operis)

      - pattern: "(?i)\\bдоговор[\\s_.-]*изготовлени[а-я]*[\\s_.-]*(?:продукци[а-я]*|изделий|вещи)?\\b"
        kind: specific_subject
        weight: 0.84
        # Изготовление продукции / изделий — прямой subject-маркер

      - pattern: "(?i)\\bдоговор[\\s_.-]*подряда[\\s_.-]*(?:на[\\s_.-]*)?переработк[а-я]*\\b|\\bдоговор[\\s_.-]*(?:на[\\s_.-]*)?переработк[а-я]*(?:[\\s_.-]*обработк[а-я]*)?\\b"
        kind: specific_subject
        weight: 0.86
        # Переработка / обработка — из supported types, прямой маркер общего подряда

      - pattern: "(?i)\\bдоговор[\\s_.-]*переработк[а-я]*[\\s_.-]*давальческ[а-я]*[\\s_.-]*сырь[а-я]*\\b"
        kind: specific_subject
        weight: 0.92
        # Переработка давальческого сырья — сильный и специфичный маркер

      - pattern: "(?i)\\bдоговор[\\s_.-]*подряда[\\s_.-]*с[\\s_.-]*давальческ[а-я]*[\\s_.-]*материал[а-я]*\\b|\\bдавальческ[а-я]*[\\s_.-]*(?:сырьё|материал)[а-я]*\\b"
        kind: specific_subject
        weight: 0.90
        # Давальческие материалы / сырьё — характерный маркер именно общего подряда

      - pattern: "(?i)\\bдоговор[\\s_.-]*(?:на[\\s_.-]*)?ремонт[а-я]*[\\s_.-]*(?:оборудовани[а-я]*|станк[а-я]*|техник[а-я]*)\\b"
        kind: specific_subject
        weight: 0.88
        # Ремонт оборудования / станка / техники — из supported types; не строительство

      - pattern: "(?i)\\bдоговор[\\s_.-]*(?:на[\\s_.-]*)?капитальн[а-я]*[\\s_.-]*ремонт[а-я]*(?![\\s_.-]*(?:здани|объект|строительн|сооружени))\\b"
        kind: specific_subject
        weight: 0.80
        # Капитальный ремонт без признаков строительного объекта — общий подряд

      - pattern: "(?i)\\bдоговор[\\s_.-]*подряда[\\s_.-]*с[\\s_.-]*физическ[а-я]*[\\s_.-]*лиц[а-я]*\\b"
        kind: specific_subject
        weight: 0.78
        # Подряд с физическим лицом — из supported types; частый случай общего подряда

      - pattern: "(?i)\\bworks?[\\s_.-]*(?:agreement|contract)\\b"
        kind: generic_form
        weight: 0.58
        # Works agreement / works contract — из supported types, прямая форма, но родовая

      - pattern: "(?i)\\bcontract[\\s_.-]*for[\\s_.-]*work[s]?(?:[\\s_.-]*and[\\s_.-]*materials?)?\\b"
        kind: generic_form
        weight: 0.60
        # Contract for work and materials — из supported types; достаточно специфично, но шире general works

      - pattern: "(?i)\\bfabrication[\\s_.-]*(?:agreement|contract)\\b"
        kind: specific_subject
        weight: 0.84
        # Fabrication contract — прямой маркер изготовления (locatio-conductio operis)

      - pattern: "(?i)\\btoll[\\s_.-]*manufacturing(?:[\\s_.-]*agreement)?\\b"
        kind: specific_subject
        weight: 0.88
        # Toll manufacturing — точный эквивалент переработки давальческого сырья

      - pattern: "(?i)\\bprocessing[\\s_.-]*(?:agreement|contract)\\b"
        kind: specific_subject
        weight: 0.76
        # Processing agreement — близко к переработке, но шире: конфликт с data processing, payment processing

      - pattern: "(?i)\\bmanufacturing[\\s_.-]*(?:agreement|contract)\\b"
        kind: generic_form
        weight: 0.54
        # Manufacturing agreement конфликтует с production/supply: не всегда чистый works contract

      - pattern: "(?i)\\bindependent[\\s_.-]*contractor[\\s_.-]*(?:agreement|contract)?\\b"
        kind: generic_form
        weight: 0.44
        # Independent contractor agreement — в англоязычной практике часто service/consulting, а не works

      - pattern: "(?i)\\bcontractor[\\s_.-]*(?:agreement|contract)?\\b"
        kind: context
        weight: 0.24
        # Contractor без works/work/fabrication qualifier слишком широк

      - pattern: "(?i)\\bремонт\\b"
        kind: context
        weight: 0.22
        # Ремонт без объекта и без договор-квалификатора слишком широк

      - pattern: "(?i)\\bworks?\\b"
        kind: context
        weight: 0.18
        # Works само по себе слишком неоднозначно


    folder_patterns:
      - pattern: "(?i)подряд(?:[_\\s-]*общ[а-я]*|[_\\s-]*general)?(?![_\\s-]*строительн)"
        kind: specific_subject
        weight: 0.80
        # Папка подряда без признаков строительного подряда

      - pattern: "(?i)изготовлени[а-я]*|fabrication"
        kind: specific_subject
        weight: 0.78
        # Папка по изготовлению вещей

      - pattern: "(?i)давальческ[а-я]*[_\\s-]*(?:сырь|материал)|toll[_\\s-]*manufactur"
        kind: specific_subject
        weight: 0.82
        # Давальческое сырьё / toll manufacturing — сильный специфичный folder-marker

      - pattern: "(?i)переработк[а-я]*[_\\s-]*(?:сырь|материал)|processing[_\\s-]*(?:of[_\\s-]*)?(?:materials?|raw)"
        kind: specific_subject
        weight: 0.80
        # Переработка материалов / сырья

      - pattern: "(?i)ремонт[_\\s-]*(?:оборудовани|техник|станк)|equipment[_\\s-]*repair|machinery[_\\s-]*repair"
        kind: specific_subject
        weight: 0.78
        # Ремонт оборудования / техники в taxonomy папок

      - pattern: "(?i)works?[_\\s-]*(?:agreement|contract)|contract[_\\s-]*for[_\\s-]*works?"
        kind: generic_form
        weight: 0.52
        # Works contract taxonomy — полезна, но родовая

      - pattern: "(?i)manufactur(?:ing)?(?![_\\s-]*(?:agreement|supply|goods))"
        kind: generic_form
        weight: 0.44
        # Manufacturing folder без уточнения — возможен конфликт с supply/production

      - pattern: "(?i)contractor[s]?|подрядчик"
        kind: generic_form
        weight: 0.38
        # Contractor folder — полезен, но шире works contract

      - pattern: "(?i)works?|работ[ы]?"
        kind: context
        weight: 0.20
        # Слишком широкий folder-контекст

      - pattern: "(?i)repair|ремонт"
        kind: context
        weight: 0.18
        # Repair без объекта неоднозначен: строительный, бытовой, оборудования

    keywords:

      high:
        - pattern: "(?i)договор\\s+подряд[ауы]"
          weight: 0.95
          distinctiveness: high
          context: header
          description: "Базовое название договора подряда"

        - pattern: "(?i)договор\\s+на\\s+выполнен[иеия]\\s+работ"
          weight: 0.9
          distinctiveness: high
          context: header
          description: "Прямое название договора на выполнение работ"

        - pattern: "(?i)договор\\s+подряд[ауы]\\s+на\\s+изготовлен[иеия]"
          weight: 0.9
          distinctiveness: high
          context: header
          description: "Подряд на изготовление вещи"

        - pattern: "(?i)договор\\s+подряд[ауы]\\s+на\\s+переработк[уи]\\s*\\(обработк[уи]\\)?"
          weight: 0.9
          distinctiveness: high
          context: header
          description: "Подряд на переработку (обработку) материала или вещи"



        - pattern: "(?i)результат\\s+работ"
          weight: 0.85
          distinctiveness: high
          context: any
          description: "Овеществлённый и передаваемый результат работ"

        - pattern: "(?i)сдач[аеи]-?при[её]мк[аеи]"
          weight: 0.8
          distinctiveness: medium
          context: any
          description: "Процедура сдачи-приёмки результата работ"

        - pattern: "(?i)акт\\s+выполнен[ныхые]\\s+работ"
          weight: 0.85
          distinctiveness: high
          context: any
          description: "Ключевой документ подтверждения выполнения и приёмки работ"

        - pattern: "(?i)иждивен[иеия]\\s+подрядчик[ауы]"
          weight: 0.8
          distinctiveness: high
          context: body
          description: "Подрядчик выполняет работу своим иждивением"

      medium:
        - pattern: "(?i)выполнени[ея]\\s+работ"
          weight: 0.65
          distinctiveness: medium
          context: any
          description: "Общая формула выполнения работ"

        - pattern: "(?i)\\bизготовлени[ея]\\b"
          weight: 0.6
          distinctiveness: medium
          context: any
          description: "Изготовление вещи как типичный предмет подряда"

        - pattern: "(?i)\\bпереработк[аи]\\b"
          weight: 0.6
          distinctiveness: medium
          context: any
          description: "Переработка как разновидность подрядных работ"

        - pattern: "(?i)\\bобработк[аи]\\b"
          weight: 0.55
          distinctiveness: medium
          context: any
          description: "Обработка материала или вещи"

        - pattern: "(?i)\\bремонт\\b"
          weight: 0.55
          distinctiveness: medium
          context: any
          description: "Ремонт часто оформляется как подряд, но может пересекаться с сервисом"

        - pattern: "(?i)\\bсмет[аы]\\b"
          weight: 0.55
          distinctiveness: medium
          context: any
          description: "Смета характерна для подрядных отношений"

        - pattern: "(?i)гарантийн[ыо]й\\s+срок"
          weight: 0.5
          distinctiveness: medium
          context: any
          description: "Гарантийный срок на результат работ"

        - pattern: "(?i)давальческ[иоя]+\\s+материал[ыо]"
          weight: 0.6
          distinctiveness: medium
          context: any
          description: "Работы с использованием материалов заказчика"

        - pattern: "(?i)этап\\s+работ"
          weight: 0.5
          distinctiveness: medium
          context: any
          description: "Этапность исполнения подрядных работ"

        - pattern: "(?i)скрыт[ыо]е\\s+работ[ыа]"
          weight: 0.55
          distinctiveness: medium
          context: any
          description: "Скрытые работы — подрядный, но не уникальный маркер"

        - pattern: "(?i)при[её]мк[аи]\\s+работ"
          weight: 0.55
          distinctiveness: medium
          context: any
          description: "Приёмка выполненных работ заказчиком"

        - pattern: "(?i)сдач[аи]\\s+результат[аа]"
          weight: 0.55
          distinctiveness: medium
          context: any
          description: "Сдача результата работ заказчику"

      low:
        - pattern: "(?i)\\bсубподрядчик\\b"
          weight: 0.3
          distinctiveness: low
          context: any
          description: "Субподрядчик — дополнительный участник исполнения"

        - pattern: "(?i)\\bзаказчик\\b"
          weight: 0.40
          distinctiveness: low
          context: any
          description: "Родовой B2B-термин. Не является уникальным признаком подряда."
        - pattern: "(?i)\\bподрядчик\\b"
          weight: 0.45
          distinctiveness: low
          context: any
          description: "Родовой B2B-термин. Часто встречается в смежных договорах (экспедиция, услуги)."

        - pattern: "(?i)генеральн[ыо]й\\s+подрядчик"
          weight: 0.3
          distinctiveness: low
          context: any
          description: "Генеральный подрядчик — чаще в строительстве, поэтому низкий вес"

        - pattern: "(?i)акт\\s+сдач[ии]-?при[её]мк[ии]"
          weight: 0.3
          distinctiveness: low
          context: any
          description: "Общая форма акта сдачи-приёмки"

        - pattern: "(?i)тв[её]рд[а-яё]+\\s+цен[аа]"
          weight: 0.25
          distinctiveness: low
          context: any
          description: "Твёрдая цена договора"

        - pattern: "(?i)приблизительн[а-яё]+\\s+смет[аа]"
          weight: 0.25
          distinctiveness: low
          context: any
          description: "Приблизительная смета допускается в подряде"

    exclusions:
      - pattern: "(?i)возмездн[оа]е\\s+оказани[ея]\\s+услуг"
        severity: hard
        weight: -1.0
        description: "Возмездное оказание услуг — соседний, но иной тип без овеществлённого результата"

      - pattern: "(?i)трудов[оа]й\\s+договор"
        severity: hard
        weight: -1.0
        description: "Трудовой договор регулирует процесс труда, а не подрядный результат"

      - pattern: "(?i)бытов[оа]й\\s+подряд"
        severity: hard
        weight: -1.0
        description: "Бытовой подряд — отдельный потребительский режим, не generic B2B/B2C works"

      - pattern: "(?i)долев[оа]е\\s+участи[ея]\\s+в\\s+строительств[ее]"
        severity: hard
        weight: -1.0
        description: "ДДУ — отдельный тип contract_3.6_off_plan_contract"

    exclusions:
      - pattern: "(?i)транспортн[а-яё]+\\s+экспедици[яи]"
        severity: soft
        weight: -0.6
        description: "Универсальное правило: наличие предмета экспедиции снижает вероятность подряда, даже если есть слово 'подрядчик'"
      - pattern: "(?i)организова[тьт]ь\\s+(?:выполнени[ея]|осуществлени[ея])\\s+перевозок"
        severity: soft
        weight: -0.5
        description: "Организация перевозок - ключевой признак экспедиции (ст. 801 ГК РФ), сильно снижает уверенность в подряде"

      - pattern: "(?i)\\bНИОКР\\b"
        severity: hard
        weight: -1.0
        description: "НИОКР — специальный договор на выполнение исследовательских и опытно-конструкторских работ"

      - pattern: "(?i)научно-исследовательск[иие]+\\s+работ[ыа]"
        severity: hard
        weight: -1.0
        description: "НИР/НИОКР относятся к contract_3.5_research_development"

      - pattern: "(?i)проектн[ыо]е\\s+и\\s+изыскательск[иие]+\\s+работ[ыа]"
        severity: hard
        weight: -1.0
        description: "Проектные и изыскательские работы — специальный тип contract_3.4_design_survey"

      - pattern: "(?i)\\bПИР\\b"
        severity: hard
        weight: -1.0
        description: "ПИР — устойчивый маркер проектно-изыскательских работ"

      # ── Soft exclusions

      - pattern: "(?i)\\bконсультаци[ияй]\\b"
        severity: soft
        weight: -0.3
        description: "Консультации тянут договор в сторону услуг"

      - pattern: "(?i)правил[аа]\\s+внутренн[ео]го\\s+распорядк[аа]"
        severity: soft
        weight: -0.35
        description: "Правила внутреннего распорядка указывают на трудовые отношения"

      - pattern: "(?i)авторск[иоя]+\\s+заказ"
        severity: soft
        weight: -0.3
        description: "Авторский заказ может пересекаться с IP/творческими договорами, а не с generic подрядом"

      - pattern: "(?i)для\\s+личн[ыо]х\\s+бытов[ыо]х\\s+нужд"
        severity: soft
        weight: -0.3
        description: "Потребительская цель тянет конструкцию к бытовому подряду"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 2: ТРИГГЕРЫ
#  Читается: TriggerDetector → doc.applicable_triggers
# ════════════════════════════════════════════════════════════════════════════

trigger_definitions:

  consumer_contractor:
    any_keywords:
      - "(?i)физическ[оеая]\\s+лиц[оа]"
      - "(?i)\\bгражданин\\b"
      - "(?i)\\bпаспорт\\b"
      - "(?i)дата\\s+рождения"
      - "(?i)место\\s+рождения"
      - "(?i)ИНН\\s+физлиц[аа]"
      - "(?i)\\bсамозанят[ыо]й\\b"

  commercial_parties:
    any_keywords:
      - "(?i)\\bООО\\b"
      - "(?i)\\bАО\\b"
      - "(?i)\\bЗАО\\b"
      - "(?i)\\bПАО\\b"
      - "(?i)\\bобществ[оа]\\b"
      - "(?i)\\bИНН\\b"
      - "(?i)\\bОГРН\\b"
      - "(?i)\\bКПП\\b"
      - "(?i)\\bв\\s+лице\\b"
      - "(?i)действующ[еёа-я]+\\s+на\\s+основани[ии]"
      - "(?i)генеральн[ыо]й\\s+директор"

  customer_supplied_materials:
    any_keywords:
      - "(?i)давальческ[оеая]\\b"
      - "(?i)давальческ[иоя]+\\s+материал[ыо]"
      - "(?i)материал[ыо]\\s+заказчик[аа]"
      - "(?i)предоставляет\\s+заказчик"
      - "(?i)сырь[её]\\s+заказчик[аа]"
      - "(?i)норм[аы]\\s+расход[аа]"

  subcontracting_involved:
    any_keywords:
      - "(?i)\\bсубподрядчик\\b"
      - "(?i)субподрядн[а-яё]+\\s+организаци[яи]"
      - "(?i)привлечени[ея]\\s+третьих\\s+лиц"
      - "(?i)генеральн[ыо]й\\s+подрядчик"
      - "(?i)привлеч[её]нн[ыо]е\\s+организаци[яи]"

  fixed_price:
    any_keywords:
      - "(?i)тв[её]рд[а-яё]+\\s+цен[аа]"
      - "(?i)тв[её]рд[а-яё]+\\s+смет[аа]"
      - "(?i)цен[аа]\\s+не\\s+подлежит\\s+изменени[юя]"
      - "(?i)фиксированн[а-яё]+\\s+стоимост[ьи]"
      - "(?i)не\\s+изменяетс[яьа]"

  approximate_price:
    any_keywords:
      - "(?i)приблизительн[а-яё]+\\s+смет[аа]"
      - "(?i)приблизительн[а-яё]+\\s+цен[аа]"
      - "(?i)ориентировочн[а-яё]+\\s+стоимост[ьи]"
