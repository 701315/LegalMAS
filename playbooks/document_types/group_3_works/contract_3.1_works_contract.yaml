             все *_display = соответствующий fallback;
             subcontracting_details = "Данные не определены".

        2. Субподряд разрешён без деталей.
           "Подрядчик вправе привлекать субподрядчиков" без указания
           о согласии заказчика и ответственности.
           → presence = "present";
             subcontracting_mode = "allowed";
             contractor_liability_for_subcontractor = "not_defined";
             subcontracting_details отражает формулировку.

        3. Противоречие в условиях.
           В одном пункте "субподряд допускается с согласия Заказчика",
           в другом — "привлечение субподрядчиков запрещено".
           → presence = "unclear";
             subcontracting_mode = "not_defined";
             subcontracting_mode_display = "Не удалось определить".

        4. Полный запрет субподряда.
           "Подрядчик не вправе привлекать субподрядчиков для выполнения
           работ по настоящему договору."
           → presence = "present";
             subcontracting_mode = "prohibited";
             contractor_liability_for_subcontractor = "not_defined";
             subcontracting_details отражает запрет.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для subcontracting_conditions_presence используй только: "present", "missing", "unclear".
        - Для subcontracting_mode используй только: "allowed", "allowed_with_consent", "prohibited", "not_defined".
        - Для contractor_liability_for_subcontractor используй только: "yes", "no", "not_defined".
        - Fallback при отсутствии данных:
          * subcontracting_mode_display → "Режим привлечения субподрядчиков в предоставленном контексте не установлен.";
          * contractor_liability_for_subcontractor_display → "Ответственность подрядчика за субподрядчиков в предоставленном контексте не установлена.";
          * subcontracting_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_display → "Не удалось определить";
          * subcontracting_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "subcontracting_conditions_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
