           - third_party_transfer_prohibited = "not_defined";
           - personal_performance_required_display = "Обязанность личного выполнения в предоставленном контексте не установлена.";
           - third_party_transfer_prohibited_display = "Запрет передачи исполнения третьим лицам в предоставленном контексте не установлен.";
           - personal_performance_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. personal_performance_required:
           - "yes" — если подрядчик прямо обязан выполнять работы лично;
           - "no" — если договор прямо допускает исполнение не лично;
           - "not_defined" — если это прямо не установлено.

        2. personal_performance_required_display:
           - если "yes": "Подрядчик обязан выполнять работы лично.";
           - если "no": "Подрядчик не обязан выполнять работы лично.";
           - если "not_defined": "Обязанность личного выполнения в предоставленном контексте не установлена."

        3. third_party_transfer_prohibited:
           - "yes" — если договор прямо запрещает передачу исполнения
             третьим лицам;
           - "no" — если договор прямо допускает такую передачу;
           - "not_defined" — если это прямо не установлено.

        4. third_party_transfer_prohibited_display:
           - если "yes": "Передача исполнения третьим лицам запрещена.";
           - если "no": "Передача исполнения третьим лицам допускается.";
           - если "not_defined": "Запрет передачи исполнения третьим лицам в предоставленном контексте не установлен."

        5. personal_performance_details:
            Формулировка о личном выполнении работ по прямому тексту
            договора.
            Если данных нет — "Данные не определены".
            Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни contractor_performance_personally_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все signal-поля = "not_defined", все *_display = соответствующий fallback, personal_performance_details = "Данные не определены".
        - Используй только текст договора. Не подставляй нормы закона вместо текста договора.
        - Не определяй обязанность личного выполнения на основании диспозитивных норм ст. 706 ГК — только по прямому тексту договора.
        - Фраза "Подрядчик выполняет работы своими силами и средствами" без прямого запрета передачи третьим лицам — personal_performance_required = "not_defined" (это описание факта, а не обязанность).
        - Если в разных фрагментах указаны противоречивые условия — presence = "unclear", соответствующие поля = "not_defined".
        - Не используй "None", "null" или пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни личного выполнения, ни запрета передачи
           третьим лицам.
           → presence = "missing";
             все signal-поля = "not_defined";
             все *_display = соответствующий fallback;
             personal_performance_details = "Данные не определены".

        2. Личное выполнение без запрета передачи.
           "Подрядчик обязан лично выполнить работы по настоящему договору"
           без прямого запрета передачи третьим лицам.
           → presence = "present";
             personal_performance_required = "yes";
             third_party_transfer_prohibited = "not_defined".

        3. Противоречие в условиях.
           В одном пункте "Подрядчик выполняет работы лично", в другом —
           "Подрядчик вправе привлекать третьих лиц без ограничений".
           → presence = "unclear";
             personal_performance_required = "not_defined";
             third_party_transfer_prohibited = "not_defined".

        4. Полный запрет + личное выполнение.
           "Подрядчик обязан лично выполнить работы без привлечения
           третьих лиц. Передача исполнения иным лицам не допускается."
           → presence = "present";
             personal_performance_required = "yes";
             third_party_transfer_prohibited = "yes";
             personal_performance_details отражает обе формулировки.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для contractor_performance_personally_presence используй только: "present", "missing", "unclear".
        - Для personal_performance_required используй только: "yes", "no", "not_defined".
        - Для third_party_transfer_prohibited используй только: "yes", "no", "not_defined".
        - Fallback при отсутствии данных:
          * personal_performance_required_display → "Обязанность личного выполнения в предоставленном контексте не установлена.";
          * third_party_transfer_prohibited_display → "Запрет передачи исполнения третьим лицам в предоставленном контексте не установлен.";
          * personal_performance_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_display → "Не удалось определить";
          * personal_performance_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "contractor_performance_personally_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования личного выполнения работ. Внутреннее агрегатное signal-поле."
          required: true

        - name: "personal_performance_required"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
