  - id: retention_money_obligation
    name: "Гарантийное удержание (Retention Money): размер и условия возврата"
    description: >
      Фактографическая проверка того, предусмотрено ли в договоре гарантийное
      удержание (удержание части цены до окончания гарантийного срока),
      его размер и условия возврата.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "гарантийное удержание"
        - "удержание части цены"
        - "удержание до окончания гарантии"
        - "retention"
        - "возврат удержанной суммы"
        - "5 процентов"
        - "10 процентов"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)гарантийн(ое|ый)\\s+удержани(е|ем)"
        - "(?i)удерж(ать|ивает|ивается).*\\d+\\s*%"
        - "(?i)удержани(е|ем).*до\\s+окончания\\s+гаранти"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор подряда в части гарантийного удержания
        (retention money) — механизма удержания части цены до окончания
        гарантийного срока.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Предусмотрено ли гарантийное удержание.
        2. Каков размер удержания (процент или сумма).
        3. Каковы условия возврата удержанной суммы.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если условие не указано прямо — возвращай "not_defined".
        3. Если текстового значения нет — возвращай "Данные не определены".
        4. Не используй "None", "null", "not_defined" или пустые строки.
        5. retention_money_present = "yes" только если договор прямо
           предусматривает удержание части цены до окончания гарантийного срока.
        6. retention_percentage_or_amount заполняй только по прямой формулировке
           о размере удержания.
        7. retention_release_conditions заполняй только по прямой формулировке
           об условиях возврата.
        8. В evidence включай только текст договора.
        9. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — данные определены:
        Фрагмент:
        "Заказчик вправе удерживать 10% от суммы каждого этапа работ до
        окончания гарантийного срока. Возврат удержанной суммы производится
        в течение 30 рабочих дней после окончания гарантийного срока при
        отсутствии претензий по качеству."

        Ответ:
        {
          "retention_money_present": "yes",
          "retention_money_present_display": "Гарантийное удержание предусмотрено.",
          "retention_percentage_or_amount": "10% от суммы каждого этапа работ",
          "retention_release_conditions": "Возврат удержанной суммы производится в течение 30 рабочих дней после окончания гарантийного срока при отсутствии претензий по качеству.",
          "evidence": [
            {
              "clause_ref": "п. 5.3",
              "quote": "Заказчик вправе удерживать 10% от суммы каждого этапа работ до окончания гарантийного срока. Возврат удержанной суммы производится в течение 30 рабочих дней после окончания гарантийного срока при отсутствии претензий по качеству."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Оплата производится поэтапно согласно графику платежей."

        Ответ:
        {
          "retention_money_present": "not_defined",
          "retention_money_present_display": "Гарантийное удержание в предоставленном контексте не установлено.",
          "retention_percentage_or_amount": "Данные не определены",
          "retention_release_conditions": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о гарантийном удержании.
        2. Найди прямую цитату о размере удержания.
        3. Найди прямую цитату об условиях возврата.
        4. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "retention_money_present": "<yes / no / not_defined>",
          "retention_money_present_display": "<понятное описание для юриста>",
          "retention_percentage_or_amount": "<текст или 'Данные не определены'>",
          "retention_release_conditions": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 480

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "гарантийное удержание удержание части цены удержание до окончания гарантии retention возврат удержанной суммы 5 процентов 10 процентов"
      retrieval_profile: "payment_terms_check"
      preferred_unit_types:
        - payment_term
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
      negative_keywords:
        - "аванс"
        - "неустойка"
        - "НДС"
        - "гарантия качества"
        - "форс-мажор"
        - "подсудность"
      position_bias:
        preferred_range: [0.20, 0.80]
        boost: 0.18
        scope: segment
      context_k: 5
      max_chunks: 6
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "price_list"
      preferred_clause_functions:
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 550

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      presence_signal:
        field: "retention_money_obligation_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_max_tokens: 400

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора подряда условия
        о гарантийном удержании (retention money).
        Не анализируй цену как самостоятельную тему, сроки выполнения,
        штрафы или налоги.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. retention_money_obligation_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если retention_money_present ≠ "not_defined"
             или хотя бы одно из fact-полей (retention_percentage_or_amount,
             retention_release_conditions) ≠ "Данные не определены";
           - "missing" — если retention_money_present = "not_defined"
             и оба fact-поля = "Данные не определены";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - retention_money_present = "not_defined";
           - retention_money_present_display = "Гарантийное удержание в предоставленном контексте не установлено.";
           - retention_percentage_or_amount = "Данные не определены";
           - retention_release_conditions = "Данные не определены";
           - не выполняй остальные шаги.

        1. retention_money_present:
           - "yes" — если договор прямо предусматривает удержание части цены
             до окончания гарантийного срока;
           - "no" — если договор прямо исключает такое удержание;
           - "not_defined" — если по тексту это не установлено.

        2. retention_money_present_display:
           - если "yes": "Гарантийное удержание предусмотрено.";
           - если "no": "Гарантийное удержание прямо исключено.";
           - если "not_defined": "Гарантийное удержание в предоставленном контексте не установлено."

        3. retention_percentage_or_amount:
           Размер удержания (процент или сумма) по прямой формулировке
           из текста договора.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        4. retention_release_conditions:
            Условия возврата удержанной суммы по прямой формулировке
            из текста договора.
            Если данных нет — "Данные не определены".
        </task>

        <context_rules>
        - Перед остальными полями заполни retention_money_obligation_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — retention_money_present = "not_defined", все fact-поля = "Данные не определены".
        - Используй только текст договора. Не подставляй типовые условия retention money вместо текста договора.
        - Не путай гарантийное удержание с авансом, депозитом или обеспечительным платежом — retention money удерживается именно из оплаты до окончания гарантийного срока.
        - Если в разных фрагментах указаны противоречивые размеры или условия — presence = "unclear", retention_money_present = "not_defined".
        - Не используй "None", "null" или пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни гарантийного удержания, ни retention,
           ни удержания части цены.
           → presence = "missing";
             retention_money_present = "not_defined";
             retention_percentage_or_amount = "Данные не определены";
             retention_release_conditions = "Данные не определены".

        2. Удержание есть, но размер не указан.
           "Заказчик вправе удерживать часть оплаты до окончания
           гарантийного срока" без указания процента или суммы.
           → presence = "present";
             retention_money_present = "yes";
             retention_percentage_or_amount = "Данные не определены";
             retention_release_conditions = "Данные не определены".

        3. Противоречие в размере.
           В одном пункте "удержание 5%", в другом — "удержание 10%".
           → presence = "unclear";
             retention_money_present = "not_defined";
             retention_percentage_or_amount = "Не удалось определить".

        4. Полное регулирование.
           Размер + условия возврата + привязка к гарантийному сроку.
           → presence = "present";
             retention_money_present = "yes";
             retention_percentage_or_amount = "10% от суммы каждого этапа";
             retention_release_conditions = "Возврат в течение 30 рабочих дней после окончания гарантийного срока".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для retention_money_obligation_presence используй только: "present", "missing", "unclear".
        - Для retention_money_present используй только: "yes", "no", "not_defined".
        - Fallback при отсутствии данных:
          * retention_money_present_display → "Гарантийное удержание в предоставленном контексте не установлено.";
          * retention_percentage_or_amount → "Данные не определены";
          * retention_release_conditions → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * retention_money_present_display → "Не удалось определить";
          * retention_percentage_or_amount → "Не удалось определить";
          * retention_release_conditions → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "retention_money_obligation_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие гарантийного удержания. Внутреннее агрегатное signal-поле."
          required: true

        - name: "retention_money_present"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Предусмотрено ли гарантийное удержание."
          required: true
          display_in_grid: false

        - name: "retention_money_present_display"
          type: "string"
          presentation: "fact"
          label: "Гарантийное удержание"
          description: "Понятное для юриста описание наличия гарантийного удержания."
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "retention_percentage_or_amount"
          type: "string"
          presentation: "fact"
          label: "Размер удержания"
          description: "Размер гарантийного удержания (процент или сумма)."
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "retention_release_conditions"
          type: "string"
          presentation: "fact"
          label: "Условия возврата"
          description: "Условия возврата удержанной суммы."
          required: true
          display_in_grid: true
          display_priority: 3

      store_payload: true

  - id: permit_obligations_allocation
    name: "Разрешительная документация: кто получает разрешения и согласования"
    description: >
