      - "(?i)ремонт\\s+станк[аа]"
      - "(?i)ремонт\\s+техник[ии]"
      - "(?i)ремонт\\s+механизм[аа]"
      - "(?i)диагностик[аи]\\s+и\\s+ремонт"
      - "(?i)техническ[оа]е\\s+обслуживани[ея]\\s+и\\s+ремонт"
      - "(?i)восстановлени[ея]\\s+работоспособност[ии]"
