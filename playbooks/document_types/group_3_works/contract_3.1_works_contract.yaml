        субподрядчиков прямо закреплена.
        - "no" — если договор прямо исключает такую ответственность.
        - "not_defined" — если это прямо не установлено.
        contractor_liability_for_subcontractor_display:
        - если contractor_liability_for_subcontractor = "yes":
        "Ответственность подрядчика за субподрядчиков закреплена."
        - если contractor_liability_for_subcontractor = "no":
        "Ответственность подрядчика за субподрядчиков прямо исключена."
        - если contractor_liability_for_subcontractor = "not_defined":
        "Ответственность подрядчика за субподрядчиков в предоставленном контексте не установлена."
        subcontracting_details:
        - заполняй только по прямому тексту договора.
        - если условия не указаны, верни: "Данные не определены".
        </context_rules>

        <output_expectations>
        Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        Верни все 5 ключей, даже если значение = "not_defined"
        или "Данные не определены".
        Не используй "None", "null" или пустые строки.
        </output_expectations>

        <output_format>
        {
          "subcontracting_mode": "allowed | allowed_with_consent | prohibited | not_defined",
          "subcontracting_mode_display": "string",
          "contractor_liability_for_subcontractor": "yes | no | not_defined",
          "contractor_liability_for_subcontractor_display": "string",
          "subcontracting_details": "string"
        }
        </output_format>

      fields:
        - name: "subcontracting_mode"
          type: "string"
          presentation: "signal"
          allowed_values: ["allowed", "allowed_with_consent", "prohibited", "not_defined"]
          description: "Допустимость привлечения субподрядчиков."
          required: true
          display_in_grid: false

        - name: "subcontracting_mode_display"
          type: "string"
          presentation: "fact"
          label: "Режим субподряда"
