          required: true
          display_in_grid: true
          display_priority: 3

      store_payload: true

  - id: contractor_performance_personally
    name: "Личное выполнение работ / запрет передачи третьим лицам (ст. 706 ГК РФ)"
    description: >
      Фактографическая проверка того, обязан ли подрядчик выполнять работы
      лично и запрещена ли передача исполнения третьим лицам.
    triggers:
      any: ["consumer_contractor"]
    ui_mode: "field_extraction"
    severity: "medium"
    severity_if_pass: "pass"
    severity_if_fail: "medium"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "лично выполняет"
        - "без привлечения третьих лиц"
        - "личное участие"
        - "не вправе передавать"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)подрядчик.*обязан.*лично.*выполн"
        - "(?i)без\\s+привлечения\\s+третьих\\s+лиц"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор подряда по ст. 706 ГК РФ.
        Проверяется только один вопрос: требует ли договор личного выполнения
        работ подрядчиком и запрещает ли передачу исполнения третьим лицам.

        Нормативный ориентир:
        - ст. 706 ГК РФ

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Обязан ли подрядчик выполнять работы лично.
        2. Запрещена ли передача исполнения третьим лицам.
        3. Как именно сформулировано требование о личном выполнении.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined".
        4. Если текстового значения нет — возвращай "Данные не определены".
        5. Не используй "None", "null", "not_defined" или пустые строки.
        6. personal_performance_required = "yes" только если обязанность
          личного выполнения прямо закреплена.
        7. third_party_transfer_prohibited = "yes" только если запрет
          на передачу исполнения третьим лицам прямо закреплён.
        8. personal_performance_details заполняй только по прямому тексту
          договора.
        9. В evidence включай только текст договора.
        10. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — данные определены:
        Фрагмент:
        "Подрядчик обязан лично выполнить работы по настоящему договору
        без привлечения третьих лиц. Передача исполнения иным лицам
        не допускается."

        Ответ:
        {
          "personal_performance_required": "yes",
          "personal_performance_required_display": "Подрядчик обязан выполнять работы лично.",
          "third_party_transfer_prohibited": "yes",
          "third_party_transfer_prohibited_display": "Передача исполнения третьим лицам запрещена.",
          "personal_performance_details": "Подрядчик обязан лично выполнить работы без привлечения третьих лиц.",
          "evidence": [
            {
              "clause_ref": "п. 4.3",
              "quote": "Подрядчик обязан лично выполнить работы по настоящему договору без привлечения третьих лиц. Передача исполнения иным лицам не допускается."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Подрядчик выполняет работы в сроки, предусмотренные договором."

        Ответ:
        {
          "personal_performance_required": "not_defined",
          "personal_performance_required_display": "Обязанность личного выполнения в предоставленном контексте не установлена.",
          "third_party_transfer_prohibited": "not_defined",
          "third_party_transfer_prohibited_display": "Запрет передачи исполнения третьим лицам в предоставленном контексте не установлен.",
          "personal_performance_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о личном выполнении работ.
        2. Найди прямую цитату о запрете передачи третьим лицам.
        3. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "personal_performance_required": "<yes / no / not_defined>",
          "personal_performance_required_display": "<понятное описание для юриста>",
          "third_party_transfer_prohibited": "<yes / no / not_defined>",
          "third_party_transfer_prohibited_display": "<понятное описание для юриста>",
          "personal_performance_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 520

    retrieval:
      retrieval_profile: "subcontracting_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "лично выполняет без привлечения третьих лиц личное участие не вправе передавать"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
      negative_keywords:
        - "цена"
        - "аванс"
        - "неустойка"
        - "НДС"
        - "гарантия"
        - "форс-мажор"
      position_bias:
        preferred_range: [0.15, 0.80]
        boost: 0.18
        scope: segment
      context_k: 5
      max_chunks: 6
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "price_list"
      preferred_clause_functions:
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 550

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 400

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора подряда условия
        о личном выполнении работ подрядчиком.
        Не анализируй цену, сроки, гарантию, штрафы или подсудность.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. personal_performance_required — "yes" / "no" / "not_defined".
        2. personal_performance_required_display — понятное описание для юриста.
        3. third_party_transfer_prohibited — "yes" / "no" / "not_defined".
        4. third_party_transfer_prohibited_display — понятное описание для юриста.
        5. personal_performance_details — формулировка о личном выполнении работ.

        Если данные отсутствуют:
        - статус = "not_defined"
        - текст = "Данные не определены"

        Не используй "None", "null" или пустые строки.
        </task>

        <context_rules>
        Используй только текст договора.
        personal_performance_required:
        - "yes" — если подрядчик прямо обязан выполнять работы лично.
        - "no" — если договор прямо допускает исполнение не лично.
        - "not_defined" — если это прямо не установлено.
        personal_performance_required_display:
        - если personal_performance_required = "yes":
        "Подрядчик обязан выполнять работы лично."
        - если personal_performance_required = "no":
        "Подрядчик не обязан выполнять работы лично."
        - если personal_performance_required = "not_defined":
        "Обязанность личного выполнения в предоставленном контексте не установлена."
        third_party_transfer_prohibited:
        - "yes" — если договор прямо запрещает передачу исполнения
        третьим лицам.
        - "no" — если договор прямо допускает такую передачу.
        - "not_defined" — если это прямо не установлено.
        third_party_transfer_prohibited_display:
        - если third_party_transfer_prohibited = "yes":
        "Передача исполнения третьим лицам запрещена."
        - если third_party_transfer_prohibited = "no":
        "Передача исполнения третьим лицам допускается."
        - если third_party_transfer_prohibited = "not_defined":
        "Запрет передачи исполнения третьим лицам в предоставленном контексте не установлен."
        personal_performance_details:
        - заполняй только по прямому тексту договора.
        - если формулировка не указана, верни: "Данные не определены".
        </context_rules>

        <output_expectations>
        Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        Верни все 5 ключей, даже если значение = "not_defined"
        или "Данные не определены".
        Не используй "None", "null" или пустые строки.
        </output_expectations>

        <output_format>
        {
          "personal_performance_required": "yes | no | not_defined",
          "personal_performance_required_display": "string",
          "third_party_transfer_prohibited": "yes | no | not_defined",
          "third_party_transfer_prohibited_display": "string",
          "personal_performance_details": "string"
        }
        </output_format>

      fields:
        - name: "personal_performance_required"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Обязан ли подрядчик выполнять работы лично."
          required: true
          display_in_grid: false

        - name: "personal_performance_required_display"
          type: "string"
          presentation: "fact"
          label: "Личное выполнение"
          description: "Понятное для юриста описание обязанности личного выполнения работ."
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "third_party_transfer_prohibited"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Запрещена ли передача исполнения третьим лицам."
          required: true
          display_in_grid: false

        - name: "third_party_transfer_prohibited_display"
          type: "string"
          presentation: "fact"
          label: "Запрет передачи"
          description: "Понятное для юриста описание запрета передачи исполнения третьим лицам."
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "personal_performance_details"
          type: "string"
          presentation: "fact"
          label: "Формулировка"
          description: "Формулировка о личном выполнении работ."
          required: true
          display_in_grid: true
          display_priority: 3

      store_payload: true

  - id: intermediate_inspection_right
    name: "Право заказчика проверять ход работ (ст. 715 ГК РФ)"
    description: >
      Фактографическая проверка того, предусмотрено ли право заказчика
      проверять ход и качество работ, а также есть ли ограничение
      на вмешательство в деятельность подрядчика.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "medium"
    severity_if_pass: "pass"
    severity_if_fail: "medium"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "проверять ход работ"
        - "контроль качества"
        - "проверка хода выполнения"
        - "вправе проверить"
        - "промежуточная инспекция"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)заказчик.*вправе.*провер(ять|ить)\\s+(ход|качество)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор подряда по ст. 715 ГК РФ.
        Проверяется только один вопрос: предусмотрено ли право заказчика
        проверять ход и качество работ и ограничено ли такое право
        запретом вмешательства в деятельность подрядчика.

        Нормативный ориентир:
        - ст. 715 ГК РФ

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли у заказчика право проверять ход или качество работ.
        2. Есть ли прямое указание, что заказчик не вправе вмешиваться
          в деятельность подрядчика.
        3. Как сформулирован объём или предмет такой проверки.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined".
        4. Если текстового значения нет — возвращай "Данные не определены".
        5. Не используй "None", "null", "not_defined" или пустые строки.
        6. inspection_right_present = "yes" только если право проверки
          прямо предусмотрено договором.
        7. no_interference_rule = "yes" только если договор прямо содержит
          правило о невмешательстве в деятельность подрядчика.
        8. inspection_scope заполняй только по прямому тексту договора.
        9. В evidence включай только текст договора.
        10. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — данные определены:
        Фрагмент:
        "Заказчик вправе в любое время проверять ход и качество выполняемых
        работ, не вмешиваясь в оперативно-хозяйственную деятельность
        Подрядчика."

        Ответ:
        {
          "inspection_right_present": "yes",
          "inspection_right_present_display": "Право заказчика проверять ход и качество работ предусмотрено.",
          "no_interference_rule": "yes",
          "no_interference_rule_display": "Заказчик не вправе вмешиваться в деятельность подрядчика.",
          "inspection_scope": "Заказчик вправе проверять ход и качество выполняемых работ.",
          "evidence": [
            {
              "clause_ref": "п. 3.5",
              "quote": "Заказчик вправе в любое время проверять ход и качество выполняемых работ, не вмешиваясь в оперативно-хозяйственную деятельность Подрядчика."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Подрядчик выполняет работы по согласованному графику."

        Ответ:
        {
          "inspection_right_present": "not_defined",
          "inspection_right_present_display": "Право заказчика проверять ход работ в предоставленном контексте не установлено.",
          "no_interference_rule": "not_defined",
          "no_interference_rule_display": "Правило о невмешательстве в предоставленном контексте не установлено.",
          "inspection_scope": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о праве заказчика проверять ход или качество работ.
        2. Найди прямую цитату о невмешательстве в деятельность подрядчика.
        3. Если прямой цитаты нет — верни "not_defined".

