        а также по правилам о корпоративном одобрении для юридических лиц.
        Проверяется только один вопрос: идентификация подрядчика и заказчика,
        подписанты, основания полномочий и корпоративное одобрение.

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Наименование и реквизиты Подрядчика.
        2. Тип Подрядчика.
        3. Кто подписывает от имени Подрядчика и на каком основании.
        4. Наименование и реквизиты Заказчика.
        5. Тип Заказчика.
        6. Кто подписывает от имени Заказчика и на каком основании.
        7. Есть ли указание на корпоративное одобрение сделки или заверение
           о том, что одобрение не требуется.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined".
        4. Если текстового значения нет — возвращай "Данные не определены".
        5. Не используй "None", "null", "not_found" или пустые строки.
        6. Для физлица, подписывающего лично, используй basis = "personal".
        7. Не выводи корпоративные выводы по умолчанию, если одобрение
           не отражено в тексте договора.
        8. Тип стороны определяй только по прямым идентификационным
           формулировкам договора.
