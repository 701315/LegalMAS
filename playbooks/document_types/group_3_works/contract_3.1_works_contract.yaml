              "clause_ref": "п. 10.1",
              "quote": "Под форс-мажором стороны понимают обстоятельства непреодолимой силы, возникшие после заключения договора. Сторона, для которой создалась невозможность исполнения, обязана уведомить другую сторону в течение 3 рабочих дней. Срок исполнения обязательств продлевается на период действия форс-мажора. Если форс-мажор длится более 60 дней, каждая из сторон вправе расторгнуть договор."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Стороны освобождаются от ответственности в случаях,
        предусмотренных законодательством."

        Ответ:
        {
          "force_majeure_definition_present": "not_defined",
          "notification_duty_present": "not_defined",
          "deadline_suspension_present": "not_defined",
          "termination_right_after_force_majeure": "not_defined",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о форс-мажоре или обстоятельствах непреодолимой силы.
