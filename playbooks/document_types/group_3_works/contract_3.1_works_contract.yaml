          "hse_responsibility_allocation": "Ответственность за безопасность работ на объекте несет Подрядчик.",
          "evidence": [
            {
              "clause_ref": "п. 7.5",
              "quote": "Подрядчик обязан соблюдать требования охраны труда и техники безопасности, действующие на объекте Заказчика. За нарушение правил безопасности Подрядчик уплачивает штраф в размере 50 000 рублей за каждый случай нарушения. Ответственность за безопасность работ на объекте несет Подрядчик."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Подрядчик выполняет работы своими силами и средствами."

        Ответ:
