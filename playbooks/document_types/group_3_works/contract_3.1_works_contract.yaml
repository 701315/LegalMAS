      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора подряда условия
        о НДС и налоговом статусе стороны.
        Не анализируй цену как самостоятельную тему, сроки, гарантию,
        штрафы или подсудность.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. vat_treatment — "included_in_price" / "excluded_from_price" /
          "no_vat" / "not_defined".
        2. vat_treatment_display — понятное описание для юриста.
        3. tax_regime_reference — "usn" / "self_employed" / "general" /
          "not_defined".
        4. tax_regime_reference_display — понятное описание для юриста.
        5. tax_clause_details — формулировка о НДС или налоговом режиме.

        Если данные отсутствуют:
        - статус = "not_defined"
        - текст = "Данные не определены"

        Не используй "None", "null" или пустые строки.
        </task>

        <context_rules>
        Используй только текст договора.
        vat_treatment:
        - "included_in_price" — если цена прямо указана как включающая НДС.
        - "excluded_from_price" — если НДС прямо указано начислять сверх цены.
        - "no_vat" — если договор прямо указывает "без НДС", "НДС не облагается"
        или аналогичную формулировку.
        - "not_defined" — если по тексту режим НДС не установлен.
        vat_treatment_display:
        - если vat_treatment = "included_in_price":
        "Цена включает НДС."
        - если vat_treatment = "excluded_from_price":
        "НДС начисляется сверх цены."
        - если vat_treatment = "no_vat":
        "НДС не облагается."
        - если vat_treatment = "not_defined":
        "Режим НДС в предоставленном контексте не установлен."
        tax_regime_reference:
        - "usn" — если прямо указана упрощённая система налогообложения.
        - "self_employed" — если прямо указан самозанятый, НПД или аналогичный статус.
        - "general" — если прямо указан общий налоговый режим или статус плательщика НДС.
        - "not_defined" — если по тексту это не установлено.
        tax_regime_reference_display:
        - если tax_regime_reference = "usn":
        "Подрядчик применяет УСН."
        - если tax_regime_reference = "self_employed":
        "Подрядчик является самозанятым (плательщик НПД)."
        - если tax_regime_reference = "general":
        "Подрядчик применяет общий налоговый режим."
        - если tax_regime_reference = "not_defined":
        "Налоговый статус стороны в предоставленном контексте не установлен."
        tax_clause_details:
        - заполняй только по прямому тексту договора.
        - если формулировка не указана, верни: "Данные не определены".
        </context_rules>

        <output_expectations>
        Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        Верни все 5 ключей, даже если значение = "not_defined"
        или "Данные не определены".
        Не используй "None", "null" или пустые строки.
        </output_expectations>

        <output_format>
        {
          "vat_treatment": "included_in_price | excluded_from_price | no_vat | not_defined",
          "vat_treatment_display": "string",
          "tax_regime_reference": "usn | self_employed | general | not_defined",
          "tax_regime_reference_display": "string",
          "tax_clause_details": "string"
        }
        </output_format>

      fields:
        - name: "vat_treatment"
          type: "string"
          presentation: "signal"
          allowed_values: ["included_in_price", "excluded_from_price", "no_vat", "not_defined"]
          description: "Как договор регулирует НДС по цене."
          required: true
          display_in_grid: false

        - name: "vat_treatment_display"
          type: "string"
          presentation: "fact"
          label: "Режим НДС"
          description: "Понятное для юриста описание режима НДС по цене договора."
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "tax_regime_reference"
          type: "string"
          presentation: "signal"
          allowed_values: ["usn", "self_employed", "general", "not_defined"]
          description: "Есть ли указание на специальный налоговый режим или статус."
          required: true
          display_in_grid: false

        - name: "tax_regime_reference_display"
          type: "string"
          presentation: "fact"
          label: "Налоговый статус"
          description: "Понятное для юриста описание налогового статуса стороны."
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "tax_clause_details"
          type: "string"
          presentation: "fact"
          label: "Налоговая оговорка"
          description: "Формулировка о НДС или налоговом режиме."
          required: true
          display_in_grid: true
          display_priority: 3

      store_payload: true

  - id: intellectual_property_ownership
    name: "Принадлежность результата интеллектуальной деятельности (ст. 1296 ГК РФ)"
    description: >
      Фактографическая проверка того, кому принадлежат исключительные права
      на результат работ, предусмотрен ли механизм передачи прав и как
      это сформулировано в договоре.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "исключительное право"
        - "права на результат"
        - "интеллектуальная собственность"
        - "переходят к заказчику"
        - "отчуждение прав"
        - "проект"
        - "чертёж"
        - "программный код"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)исключительн(ое|ых)\\s+прав(о|а)"
        - "(?i)права.*результат.*переход(ят|ит).*заказчик"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор подряда в части прав на результат
        интеллектуальной деятельности.
        Проверяется только один вопрос: кому принадлежат права на результат
        работ и предусмотрен ли механизм их передачи.

        Нормативный ориентир:
        - ст. 1296 ГК РФ
        - ст. 1297 ГК РФ

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Урегулирована ли принадлежность исключительных прав на результат работ.
        2. Кому по договору принадлежат исключительные права.
        3. Предусмотрен ли механизм передачи прав.
        4. Как именно сформулирована оговорка о правах.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если условие не указано прямо — возвращай "not_defined".
        3. Если текстового значения нет — возвращай "Данные не определены".
        4. Не используй "None", "null", "not_defined" или пустые строки.
        5. ip_rights_clause_present = "yes" только если договор прямо
          регулирует права на результат интеллектуальной деятельности.
        6. exclusive_rights_holder = "customer" только если договор прямо
          указывает на принадлежность прав заказчику.
        7. exclusive_rights_holder = "contractor" только если договор прямо
          указывает на принадлежность прав подрядчику.
        8. exclusive_rights_holder = "shared" только если договор прямо
          устанавливает совместный или разделённый режим прав.
        9. rights_transfer_mechanism определяй только по прямому тексту
          о механизме передачи прав.
        10. rights_clause_details заполняй только по прямой формулировке договора.
        11. В evidence включай только текст договора.
        12. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — данные определены:
        Фрагмент:
        "Исключительные права на созданную в рамках настоящего договора
        проектную документацию переходят к Заказчику с момента полной оплаты.
        Передача прав осуществляется в порядке отчуждения исключительного права."

        Ответ:
        {
          "ip_rights_clause_present": "yes",
          "ip_rights_clause_present_display": "Оговорка о правах на результат предусмотрена.",
          "exclusive_rights_holder": "customer",
          "exclusive_rights_holder_display": "Исключительные права принадлежат Заказчику.",
          "rights_transfer_mechanism": "assignment",
          "rights_transfer_mechanism_display": "Права передаются в порядке отчуждения.",
          "rights_clause_details": "Исключительные права на проектную документацию переходят к Заказчику с момента полной оплаты.",
          "evidence": [
            {
              "clause_ref": "п. 8.1",
              "quote": "Исключительные права на созданную в рамках настоящего договора проектную документацию переходят к Заказчику с момента полной оплаты. Передача прав осуществляется в порядке отчуждения исключительного права."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Подрядчик передает Заказчику результат работ по акту."

        Ответ:
        {
          "ip_rights_clause_present": "not_defined",
          "ip_rights_clause_present_display": "Оговорка о правах на результат в предоставленном контексте не установлена.",
          "exclusive_rights_holder": "not_defined",
          "exclusive_rights_holder_display": "Правообладатель в предоставленном контексте не установлен.",
          "rights_transfer_mechanism": "not_defined",
          "rights_transfer_mechanism_display": "Механизм передачи прав в предоставленном контексте не установлен.",
          "rights_clause_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о принадлежности исключительных прав.
        2. Найди прямую цитату о переходе или передаче прав.
        3. Найди прямую цитату о механизме передачи прав.
        4. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "ip_rights_clause_present": "<yes / no / not_defined>",
          "ip_rights_clause_present_display": "<понятное описание для юриста>",
          "exclusive_rights_holder": "<customer / contractor / shared / not_defined>",
          "exclusive_rights_holder_display": "<понятное описание для юриста>",
          "rights_transfer_mechanism": "<assignment / license / mixed / not_defined>",
          "rights_transfer_mechanism_display": "<понятное описание для юриста>",
          "rights_clause_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 560

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "исключительное право права на результат интеллектуальная собственность переходят к заказчику отчуждение прав проект чертеж программный код"
      retrieval_profile: "ip_ownership_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - definitions
      negative_keywords:
        - "цена"
        - "аванс"
        - "неустойка"
        - "НДС"
        - "гарантия"
        - "подсудность"
      position_bias:
        preferred_range: [0.30, 0.95]
        boost: 0.18
        scope: segment
      context_k: 5
      max_chunks: 6
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
        - "technical_specification"
      excluded_segment_types:
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "definitions"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 500

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора подряда условия
        о правах на результат интеллектуальной деятельности.
        Не анализируй цену, сроки, гарантию, штрафы или подсудность.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. ip_rights_clause_present — "yes" / "no" / "not_defined".
        2. ip_rights_clause_present_display — понятное описание для юриста.
        3. exclusive_rights_holder — "customer" / "contractor" / "shared" /
          "not_defined".
        4. exclusive_rights_holder_display — понятное описание для юриста.
        5. rights_transfer_mechanism — "assignment" / "license" / "mixed" /
          "not_defined".
        6. rights_transfer_mechanism_display — понятное описание для юриста.
        7. rights_clause_details — формулировка о принадлежности или передаче прав.

        Если данные отсутствуют:
        - статус = "not_defined"
        - текст = "Данные не определены"

        Не используй "None", "null" или пустые строки.
        </task>

        <context_rules>
        Используй только текст договора.
        ip_rights_clause_present:
        - "yes" — если договор прямо регулирует права на результат
        интеллектуальной деятельности.
        - "no" — если договор прямо указывает на отсутствие таких условий.
        - "not_defined" — если по тексту это не установлено.
        ip_rights_clause_present_display:
        - если ip_rights_clause_present = "yes":
        "Оговорка о правах на результат предусмотрена."
        - если ip_rights_clause_present = "no":
        "Оговорка о правах на результат прямо исключена."
        - если ip_rights_clause_present = "not_defined":
        "Оговорка о правах на результат в предоставленном контексте не установлена."
        exclusive_rights_holder:
        - "customer" — если права прямо принадлежат заказчику или переходят к нему.
        - "contractor" — если права прямо принадлежат подрядчику или сохраняются за ним.
        - "shared" — если договор прямо устанавливает совместный или разделённый режим прав.
        - "not_defined" — если по тексту это не установлено.
        exclusive_rights_holder_display:
        - если exclusive_rights_holder = "customer":
        "Исключительные права принадлежат Заказчику."
        - если exclusive_rights_holder = "contractor":
        "Исключительные права принадлежат Подрядчику."
        - если exclusive_rights_holder = "shared":
        "Исключительные права принадлежат сторонам совместно."
        - если exclusive_rights_holder = "not_defined":
        "Правообладатель в предоставленном контексте не установлен."
        rights_transfer_mechanism:
        - "assignment" — если предусмотрено отчуждение исключительного права.
        - "license" — если предусмотрено предоставление лицензии.
        - "mixed" — если сочетаются отчуждение и лицензия либо несколько механизмов.
        - "not_defined" — если механизм передачи не установлен.
        rights_transfer_mechanism_display:
        - если rights_transfer_mechanism = "assignment":
        "Права передаются в порядке отчуждения."
        - если rights_transfer_mechanism = "license":
        "Права передаются по лицензии."
        - если rights_transfer_mechanism = "mixed":
        "Предусмотрен смешанный механизм передачи прав."
        - если rights_transfer_mechanism = "not_defined":
        "Механизм передачи прав в предоставленном контексте не установлен."
        rights_clause_details:
        - заполняй только по прямому тексту договора.
        - если формулировка не указана, верни: "Данные не определены".
        </context_rules>

        <output_expectations>
        Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        Верни все 7 ключей, даже если значение = "not_defined"
        или "Данные не определены".
        Не используй "None", "null" или пустые строки.
        </output_expectations>

        <output_format>
        {
          "ip_rights_clause_present": "yes | no | not_defined",
          "ip_rights_clause_present_display": "string",
          "exclusive_rights_holder": "customer | contractor | shared | not_defined",
          "exclusive_rights_holder_display": "string",
          "rights_transfer_mechanism": "assignment | license | mixed | not_defined",
          "rights_transfer_mechanism_display": "string",
          "rights_clause_details": "string"
        }
        </output_format>

      fields:
        - name: "ip_rights_clause_present"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Есть ли в договоре специальная оговорка о правах на результат."
          required: true
          display_in_grid: false

        - name: "ip_rights_clause_present_display"
          type: "string"
          presentation: "fact"
          label: "Оговорка о правах"
          description: "Понятное для юриста описание наличия оговорки о правах на результат."
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "exclusive_rights_holder"
          type: "string"
          presentation: "signal"
          allowed_values: ["customer", "contractor", "shared", "not_defined"]
          description: "Кому принадлежат исключительные права по договору."
          required: true
          display_in_grid: false

        - name: "exclusive_rights_holder_display"
          type: "string"
          presentation: "fact"
          label: "Правообладатель"
          description: "Понятное для юриста описание принадлежности исключительных прав."
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "rights_transfer_mechanism"
          type: "string"
          presentation: "signal"
          allowed_values: ["assignment", "license", "mixed", "not_defined"]
          description: "Какой механизм передачи прав предусмотрен."
          required: true
          display_in_grid: false

        - name: "rights_transfer_mechanism_display"
          type: "string"
          presentation: "fact"
          label: "Механизм передачи"
          description: "Понятное для юриста описание механизма передачи прав."
          required: true
          display_in_grid: true
          display_priority: 3

        - name: "rights_clause_details"
          type: "string"
          presentation: "fact"
          label: "Формулировка о правах"
          description: "Формулировка о принадлежности или передаче прав."
          required: true
          display_in_grid: true
          display_priority: 4

      store_payload: true

  - id: customer_cooperation_obligations
    name: "Обязанности заказчика по содействию (ст. 718 ГК РФ)"
    description: >
      Фактографическая проверка того, закреплены ли обязанности заказчика
      по содействию подрядчику, включая предоставление доступа, информации
      и документов, а также последствия несодействия.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "заказчик обязан содействовать"
        - "предоставить доступ"
        - "предоставить информацию"
        - "предоставить документы"
        - "содействие заказчика"
        - "контактное лицо"
        - "непредоставление информации"
        - "задержка по вине заказчика"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)заказчик\\s+обяз(ан|уется)\\s+(содействовать|предоставить)"
        - "(?i)ст\\.?\\s*718\\s+ГК\\s+РФ"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор подряда по ст. 718 ГК РФ.
        Проверяется только один вопрос: какие обязанности по содействию
        возложены на заказчика и какие последствия предусмотрены
        на случай их неисполнения.

        Нормативный ориентир:
        - ст. 718 ГК РФ
        - ст. 719 ГК РФ

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Закреплены ли обязанности заказчика по содействию.
        2. Обязан ли заказчик предоставить доступ, информацию или документы.
        3. Предусмотрены ли последствия несодействия для сроков или права
          подрядчика приостановить работы.
        4. Как именно сформулированы обязанности заказчика.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если условие не указано прямо — возвращай "not_defined".
        3. Если текстового значения нет — возвращай "Данные не определены".
        4. Не используй "None", "null", "not_defined" или пустые строки.
        5. cooperation_obligations_present = "yes" только если договор прямо
          закрепляет обязанности заказчика по содействию.
        6. access_or_information_duty = "yes" только если договор прямо
          требует предоставить доступ, информацию, документы или иное содействие.
        7. delay_consequences_defined = "yes" только если договор прямо
          предусматривает последствия несодействия.
        8. cooperation_details заполняй только по прямой формулировке договора.
        9. В evidence включай только текст договора.
        10. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — данные определены:
        Фрагмент:
        "Заказчик обязан предоставить Подрядчику доступ на объект,
        необходимую техническую документацию и исходные данные.
        В случае непредоставления указанных материалов срок выполнения работ
        подлежит соразмерному продлению, а Подрядчик вправе приостановить работы."

        Ответ:
        {
          "cooperation_obligations_present": "yes",
          "cooperation_obligations_present_display": "Обязанности заказчика по содействию закреплены.",
          "access_or_information_duty": "yes",
          "access_or_information_duty_display": "Заказчик обязан предоставить доступ, информацию и документы.",
          "delay_consequences_defined": "yes",
          "delay_consequences_defined_display": "Последствия несодействия предусмотрены.",
          "cooperation_details": "Заказчик обязан предоставить Подрядчику доступ на объект, необходимую техническую документацию и исходные данные.",
          "evidence": [
            {
              "clause_ref": "п. 3.4",
              "quote": "Заказчик обязан предоставить Подрядчику доступ на объект, необходимую техническую документацию и исходные данные. В случае непредоставления указанных материалов срок выполнения работ подлежит соразмерному продлению, а Подрядчик вправе приостановить работы."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Подрядчик выполняет работы по заданию Заказчика."

        Ответ:
        {
          "cooperation_obligations_present": "not_defined",
          "cooperation_obligations_present_display": "Обязанности заказчика по содействию в предоставленном контексте не установлены.",
          "access_or_information_duty": "not_defined",
          "access_or_information_duty_display": "Обязанность предоставить доступ, информацию или документы в предоставленном контексте не установлена.",
          "delay_consequences_defined": "not_defined",
          "delay_consequences_defined_display": "Последствия несодействия в предоставленном контексте не установлены.",
          "cooperation_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату об обязанностях заказчика по содействию.
        2. Найди прямую цитату о предоставлении доступа, информации или документов.
        3. Найди прямую цитату о последствиях несодействия.
        4. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "cooperation_obligations_present": "<yes / no / not_defined>",
          "cooperation_obligations_present_display": "<понятное описание для юриста>",
          "access_or_information_duty": "<yes / no / not_defined>",
          "access_or_information_duty_display": "<понятное описание для юриста>",
          "delay_consequences_defined": "<yes / no / not_defined>",
          "delay_consequences_defined_display": "<понятное описание для юриста>",
          "cooperation_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 560

    retrieval:
      retrieval_profile: "scope_of_work_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "заказчик обязан содействовать предоставить доступ предоставить информацию предоставить документы содействие заказчика непредоставление информации задержка по вине заказчика"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
      negative_keywords:
        - "цена"
        - "аванс"
        - "неустойка"
        - "НДС"
        - "гарантия"
        - "подсудность"
      position_bias:
        preferred_range: [0.20, 0.80]
        boost: 0.18
        scope: segment
      context_k: 5
      max_chunks: 6
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "price_list"
      preferred_clause_functions:
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 500

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора подряда условия
        об обязанностях заказчика по содействию подрядчику.
        Не анализируй цену, сроки выполнения как отдельную тему, гарантию,
        штрафы или подсудность.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. cooperation_obligations_present — "yes" / "no" / "not_defined".
        2. cooperation_obligations_present_display — понятное описание для юриста.
        3. access_or_information_duty — "yes" / "no" / "not_defined".
        4. access_or_information_duty_display — понятное описание для юриста.
        5. delay_consequences_defined — "yes" / "no" / "not_defined".
        6. delay_consequences_defined_display — понятное описание для юриста.
        7. cooperation_details — формулировка об обязанностях заказчика.

        Если данные отсутствуют:
        - статус = "not_defined"
        - текст = "Данные не определены"

        Не используй "None", "null" или пустые строки.
        </task>

        <context_rules>
        Используй только текст договора.
        cooperation_obligations_present:
        - "yes" — если договор прямо закрепляет обязанности заказчика
        по содействию подрядчику.
        - "no" — если договор прямо указывает на отсутствие таких обязанностей.
        - "not_defined" — если по тексту это не установлено.
        cooperation_obligations_present_display:
        - если cooperation_obligations_present = "yes":
        "Обязанности заказчика по содействию закреплены."
        - если cooperation_obligations_present = "no":
        "Обязанности заказчика по содействию прямо не предусмотрены."
        - если cooperation_obligations_present = "not_defined":
        "Обязанности заказчика по содействию в предоставленном контексте не установлены."
        access_or_information_duty:
        - "yes" — если заказчик прямо обязан предоставить доступ,
        информацию, документы или иные необходимые материалы.
        - "no" — если договор прямо исключает такую обязанность.
        - "not_defined" — если это прямо не установлено.
        access_or_information_duty_display:
        - если access_or_information_duty = "yes":
        "Заказчик обязан предоставить доступ, информацию и документы."
        - если access_or_information_duty = "no":
        "Обязанность предоставить доступ, информацию или документы прямо исключена."
        - если access_or_information_duty = "not_defined":
        "Обязанность предоставить доступ, информацию или документы в предоставленном контексте не установлена."
        delay_consequences_defined:
        - "yes" — если прямо предусмотрены последствия несодействия:
        продление сроков, приостановка работ или аналогичные меры.
        - "no" — если договор прямо исключает специальные последствия.
        - "not_defined" — если это прямо не установлено.
        delay_consequences_defined_display:
        - если delay_consequences_defined = "yes":
        "Последствия несодействия предусмотрены."
        - если delay_consequences_defined = "no":
        "Специальные последствия несодействия прямо не предусмотрены."
        - если delay_consequences_defined = "not_defined":
        "Последствия несодействия в предоставленном контексте не установлены."
        cooperation_details:
        - заполняй только по прямому тексту договора.
        - если формулировка не указана, верни: "Данные не определены".
        </context_rules>

        <output_expectations>
        Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        Верни все 7 ключей, даже если значение = "not_defined"
        или "Данные не определены".
        Не используй "None", "null" или пустые строки.
        </output_expectations>

        <output_format>
        {
          "cooperation_obligations_present": "yes | no | not_defined",
          "cooperation_obligations_present_display": "string",
          "access_or_information_duty": "yes | no | not_defined",
          "access_or_information_duty_display": "string",
          "delay_consequences_defined": "yes | no | not_defined",
          "delay_consequences_defined_display": "string",
          "cooperation_details": "string"
        }
        </output_format>

      fields:
        - name: "cooperation_obligations_present"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Закреплены ли обязанности заказчика по содействию."
          required: true
          display_in_grid: false

        - name: "cooperation_obligations_present_display"
          type: "string"
          presentation: "fact"
          label: "Содействие заказчика"
          description: "Понятное для юриста описание наличия обязанностей заказчика по содействию."
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "access_or_information_duty"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Обязан ли заказчик предоставить доступ, информацию или документы."
          required: true
          display_in_grid: false

        - name: "access_or_information_duty_display"
          type: "string"
          presentation: "fact"
          label: "Доступ / документы"
          description: "Понятное для юриста описание обязанности заказчика предоставить доступ, информацию или документы."
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "delay_consequences_defined"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Предусмотрены ли последствия несодействия заказчика."
          required: true
          display_in_grid: false

        - name: "delay_consequences_defined_display"
          type: "string"
          presentation: "fact"
          label: "Последствия несодействия"
          description: "Понятное для юриста описание наличия последствий несодействия заказчика."
          required: true
          display_in_grid: true
          display_priority: 3

        - name: "cooperation_details"
          type: "string"
          presentation: "fact"
          label: "Формулировка обязанностей"
          description: "Формулировка об обязанностях заказчика по содействию."
          required: true
          display_in_grid: true
          display_priority: 4

      store_payload: true

  - id: retention_money_obligation
    name: "Гарантийное удержание (Retention Money): размер и условия возврата"
    description: >
      Фактографическая проверка того, предусмотрено ли в договоре гарантийное
      удержание (удержание части цены до окончания гарантийного срока),
      его размер и условия возврата.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "гарантийное удержание"
        - "удержание части цены"
        - "удержание до окончания гарантии"
        - "retention"
        - "возврат удержанной суммы"
        - "5 процентов"
        - "10 процентов"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)гарантийн(ое|ый)\\s+удержани(е|ем)"
        - "(?i)удерж(ать|ивает|ивается).*\\d+\\s*%"
        - "(?i)удержани(е|ем).*до\\s+окончания\\s+гаранти"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор подряда в части гарантийного удержания
        (retention money) — механизма удержания части цены до окончания
        гарантийного срока.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Предусмотрено ли гарантийное удержание.
        2. Каков размер удержания (процент или сумма).
        3. Каковы условия возврата удержанной суммы.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если условие не указано прямо — возвращай "not_defined".
        3. Если текстового значения нет — возвращай "Данные не определены".
        4. Не используй "None", "null", "not_defined" или пустые строки.
        5. retention_money_present = "yes" только если договор прямо
          предусматривает удержание части цены до окончания гарантийного срока.
        6. retention_percentage_or_amount заполняй только по прямой формулировке
          о размере удержания.
        7. retention_release_conditions заполняй только по прямой формулировке
          об условиях возврата.
        8. В evidence включай только текст договора.
        9. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — данные определены:
        Фрагмент:
        "Заказчик вправе удерживать 10% от суммы каждого этапа работ до
        окончания гарантийного срока. Возврат удержанной суммы производится
        в течение 30 рабочих дней после окончания гарантийного срока при
        отсутствии претензий по качеству."

        Ответ:
        {
          "retention_money_present": "yes",
          "retention_money_present_display": "Гарантийное удержание предусмотрено.",
          "retention_percentage_or_amount": "10% от суммы каждого этапа работ",
          "retention_release_conditions": "Возврат удержанной суммы производится в течение 30 рабочих дней после окончания гарантийного срока при отсутствии претензий по качеству.",
          "evidence": [
            {
              "clause_ref": "п. 5.3",
              "quote": "Заказчик вправе удерживать 10% от суммы каждого этапа работ до окончания гарантийного срока. Возврат удержанной суммы производится в течение 30 рабочих дней после окончания гарантийного срока при отсутствии претензий по качеству."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Оплата производится поэтапно согласно графику платежей."

        Ответ:
        {
          "retention_money_present": "not_defined",
          "retention_money_present_display": "Гарантийное удержание в предоставленном контексте не установлено.",
          "retention_percentage_or_amount": "Данные не определены",
          "retention_release_conditions": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о гарантийном удержании.
        2. Найди прямую цитату о размере удержания.
        3. Найди прямую цитату об условиях возврата.
        4. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "retention_money_present": "<yes / no / not_defined>",
          "retention_money_present_display": "<понятное описание для юриста>",
