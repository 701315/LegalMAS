  - id: change_order_procedure
    name: "Изменение объема работ: процедура согласования и последствия"
    description: >
      Фактографическая проверка того, какова процедура согласования
      дополнительных или измененных работ, требуется ли письменное
      дополнительное соглашение до начала работ и каковы последствия
      выполнения работ без согласования.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "дополнительные работы"
        - "изменение объема"
        - "дополнительное соглашение"
        - "письменное согласование"
        - "без согласования"
        - "не подлежат оплате"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)дополнительн(ые|ых)\\s+работ"
        - "(?i)изменени(е|ем)\\s+объ(ема|ём)"
        - "(?i)до\\s+начала\\s+выполнени.*дополнительн"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор подряда в части процедуры изменения объема работ
        (change order procedure) — как согласовываются дополнительные или
        измененные работы и каковы последствия выполнения без согласования.

        Нормативный ориентир:
        - ст. 743 ГК РФ (техническая документация)
        - ст. 709 ГК РФ (цена работ)

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Какова процедура согласования дополнительных или измененных работ.
        2. Требуется ли письменное дополнительное соглашение до начала работ.
        3. Каковы последствия выполнения работ без согласования.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если условие не указано прямо — возвращай "not_defined".
        3. Если текстового значения нет — возвращай "Данные не определены".
        4. Не используй "None", "null", "not_defined" или пустые строки.
        5. change_order_mechanism = "prior_written_agreement" только если
          договор прямо требует письменное доп. соглашение до начала работ.
        6. change_order_mechanism = "verbal_allowed" только если договор
          прямо допускает согласование без письменной формы.
        7. unauthorized_works_consequence заполняй только по прямой формулировке
