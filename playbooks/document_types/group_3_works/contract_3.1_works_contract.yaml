      - "(?i)авансов[ыо]й\\s+плат[её]ж"
      - "(?i)предварительн[а-яё]+\\s+оплат[аа]"
      - "(?i)выплачиваетс[яьа]\\s+до\\s+начал[аа]\\s+работ"

  warranty_period_set:
