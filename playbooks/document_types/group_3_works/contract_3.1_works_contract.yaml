  - id: acceptance_procedure
    name: "Порядок сдачи-приёмки работ и односторонняя приёмка (ст. 720 ГК РФ)"
    description: >
      Фактографическая проверка срока приёмки работ заказчиком,
      автоматической приёмки при молчании, права подрядчика составить
      односторонний акт при уклонении заказчика и срока для мотивированного
      отказа.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "акт выполненных работ"
        - "акт сдачи-приёмки"
        - "подписание акта"
        - "порядок приёмки"
        - "сдача результата"
        - "приёмка заказчиком"
        - "работы считаются принятыми"
        - "односторонний акт"
        - "при отсутствии мотивированного отказа"
        - "уклонение от приёмки"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)акт\\s+(сдачи|выполненных|приёмки)"
        - "(?i)(сдать|сдача)\\s+результат"
        - "(?i)если.*заказчик.*не.*направил.*отказ.*в\\s+течение.*\\d+.*дней.*работы.*считаются.*принятыми"
        - "(?i)при.*уклонении.*от\\s+приёмки.*подрядчик.*вправе.*составить.*акт.*односторонне"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор подряда по ст. 720 ГК РФ.
        Проверяется только один вопрос: как урегулированы порядок
        сдачи-приёмки работ, срок приёмки, автоматическая приёмка при
        молчании и право подрядчика составить односторонний акт при
        уклонении заказчика.

        Нормативный ориентир:
        - ст. 720 ГК РФ

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Указан ли срок для приёмки работ заказчиком.
        2. Сколько дней отведено на приёмку, если срок прямо указан в днях.
        3. Есть ли автоматическая приёмка при отсутствии мотивированного отказа.
        4. Предусмотрено ли право подрядчика составить односторонний акт
          при уклонении заказчика.
        5. Как сформулирован срок для направления мотивированного отказа.
        6. Как в целом сформулирован порядок приёмки.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined".
        4. Для текстовых полей при отсутствии данных возвращай
          "Данные не определены".
        5. Не используй "None", "null", "not_defined" или пустые строки.
        6. review_period_days_status = "defined" только если срок приёмки
          прямо указан и может быть выражен числом дней.
        7. review_period_days_value = 0 если срок не определён числом дней.
        8. auto_acceptance = "yes" только если договор прямо устанавливает,
          что работы считаются принятыми при молчании или отсутствии
          мотивированного отказа.
        9. unilateral_act_allowed = "yes" только если подрядчик прямо вправе
          составить односторонний акт при уклонении заказчика.
        10. motivated_refusal_deadline заполняй только если срок
            мотивированного отказа прямо указан.
        11. В evidence включай только текст договора.
        12. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — данные определены:
        Фрагмент:
        "Заказчик обязан в течение 5 рабочих дней с даты получения акта
        рассмотреть результат работ и подписать акт сдачи-приёмки либо
        направить мотивированный отказ. При отсутствии такого отказа
        работы считаются принятыми. При уклонении Заказчика от приёмки
        Подрядчик вправе составить односторонний акт сдачи-приёмки."

        Ответ:
        {
          "review_period_days_status": "defined",
          "review_period_days_value": 5,
          "auto_acceptance": "yes",
          "auto_acceptance_display": "Автоматическая приёмка предусмотрена.",
          "unilateral_act_allowed": "yes",
          "unilateral_act_allowed_display": "Подрядчик вправе составить односторонний акт.",
          "motivated_refusal_deadline": "5 рабочих дней с даты получения акта.",
          "acceptance_procedure_details": "Заказчик обязан в течение 5 рабочих дней рассмотреть результат работ и подписать акт либо направить мотивированный отказ.",
          "evidence": [
            {
              "clause_ref": "п. 6.2",
              "quote": "Заказчик обязан в течение 5 рабочих дней с даты получения акта рассмотреть результат работ и подписать акт сдачи-приёмки либо направить мотивированный отказ. При отсутствии такого отказа работы считаются принятыми. При уклонении Заказчика от приёмки Подрядчик вправе составить односторонний акт сдачи-приёмки."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Результат работ передаётся Заказчику по акту."

        Ответ:
        {
          "review_period_days_status": "not_defined",
          "review_period_days_value": 0,
          "auto_acceptance": "not_defined",
          "auto_acceptance_display": "Автоматическая приёмка в предоставленном контексте не установлена.",
          "unilateral_act_allowed": "not_defined",
          "unilateral_act_allowed_display": "Право на односторонний акт в предоставленном контексте не установлено.",
          "motivated_refusal_deadline": "Данные не определены",
          "acceptance_procedure_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о сроке приёмки.
        2. Найди прямую цитату об автоматической приёмке при молчании.
        3. Найди прямую цитату о праве на односторонний акт.
        4. Найди прямую цитату о сроке мотивированного отказа.
        5. Если прямой цитаты нет — верни "not_defined" и 0 для числового поля.

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "review_period_days_status": "<defined / not_defined>",
          "review_period_days_value": "<число дней или 0>",
          "auto_acceptance": "<yes / no / not_defined>",
          "auto_acceptance_display": "<понятное описание для юриста>",
          "unilateral_act_allowed": "<yes / no / not_defined>",
          "unilateral_act_allowed_display": "<понятное описание для юриста>",
          "motivated_refusal_deadline": "<текст или 'Данные не определены'>",
          "acceptance_procedure_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 680

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "акт выполненных работ акт сдачи приемки подписание акта порядок приемки сдача результата мотивированный отказ считаются принятыми уклонение от приемки односторонний акт"
      retrieval_profile: "acceptance_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - boilerplate
      negative_keywords:
        - "цена"
        - "аванс"
        - "НДС"
        - "гарантия"
        - "неустойка"
        - "форс-мажор"
        - "уступка"
        - "субподряд"
      position_bias:
        preferred_range: [0.25, 0.85]
        boost: 0.18
        scope: segment
      context_k: 5
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "boilerplate"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 700

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора подряда условия
        о порядке сдачи-приёмки работ: срок приёмки, автоматическая приёмка,
        право на односторонний акт и срок мотивированного отказа.
        Не анализируй цену, сроки выполнения работ, гарантию, штрафы
        или подсудность.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. review_period_days_status — "defined" если срок приёмки прямо
          указан и может быть выражен числом дней, иначе "not_defined".
        2. review_period_days_value — количество дней для приёмки работ.
        3. auto_acceptance — "yes" / "no" / "not_defined".
        4. auto_acceptance_display — понятное описание для юриста.
        5. unilateral_act_allowed — "yes" / "no" / "not_defined".
        6. unilateral_act_allowed_display — понятное описание для юриста.
        7. motivated_refusal_deadline — срок для мотивированного отказа.
        8. acceptance_procedure_details — общая формулировка порядка
          приёмки из текста договора.

        Если данные отсутствуют:
        - статус = "not_defined"
        - числовое значение = 0
        - текстовое значение = "Данные не определены"

        Не используй "None", "null" или пустые строки.
        </task>

        <context_rules>
        Используй только текст договора.
        review_period_days_status:
        - "defined" — если срок приёмки прямо указан числом дней.
        - "not_defined" — если срок не указан числом дней.
        review_period_days_value:
        - укажи только число без слов.
        - если срок не определён числом дней — укажи 0.
        auto_acceptance:
        - "yes" — если договор прямо устанавливает, что при молчании
        или отсутствии мотивированного отказа работы считаются
        принятыми.
        - "no" — если договор прямо исключает автоматическую приёмку.
        - "not_defined" — если это прямо не установлено.
        auto_acceptance_display:
        - если auto_acceptance = "yes":
        "Автоматическая приёмка предусмотрена."
        - если auto_acceptance = "no":
        "Автоматическая приёмка прямо исключена."
        - если auto_acceptance = "not_defined":
        "Автоматическая приёмка в предоставленном контексте не установлена."
        unilateral_act_allowed:
        - "yes" — если подрядчик прямо вправе составить односторонний
        акт при уклонении заказчика.
        - "no" — если договор прямо исключает такое право.
        - "not_defined" — если это прямо не установлено.
        unilateral_act_allowed_display:
        - если unilateral_act_allowed = "yes":
        "Подрядчик вправе составить односторонний акт."
        - если unilateral_act_allowed = "no":
        "Право на односторонний акт прямо исключено."
        - если unilateral_act_allowed = "not_defined":
        "Право на односторонний акт в предоставленном контексте не установлено."
        motivated_refusal_deadline:
        - заполняй только по прямой формулировке договора о сроке
        направления мотивированного отказа.
        - если срок не указан, верни: "Данные не определены".
        acceptance_procedure_details:
        - заполняй только по прямому тексту договора.
        - если порядок не описан, верни: "Данные не определены".
        </context_rules>

        <output_expectations>
        Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        Верни все 8 ключей, даже если значение = "not_defined",
        0 или "Данные не определены".
        Не используй "None", "null" или пустые строки.
        </output_expectations>

        <output_format>
        {
          "review_period_days_status": "defined | not_defined",
          "review_period_days_value": "number",
          "auto_acceptance": "yes | no | not_defined",
          "auto_acceptance_display": "string",
          "unilateral_act_allowed": "yes | no | not_defined",
          "unilateral_act_allowed_display": "string",
          "motivated_refusal_deadline": "string",
          "acceptance_procedure_details": "string"
        }
        </output_format>

      fields:
        - name: "review_period_days_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения срока приёмки в днях."
          required: true
          display_in_grid: false

        - name: "review_period_days_value"
          type: "string"
          presentation: "fact"
          label: "Срок приёмки (дней)"
          description: "Количество дней, отведённых на приёмку работ."
          required: true
          display_in_grid: true
          display_priority: 1
          unit: "days"

        - name: "auto_acceptance"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Есть ли автоматическая приёмка при молчании заказчика."
          required: true
          display_in_grid: false

        - name: "auto_acceptance_display"
          type: "string"
          presentation: "fact"
          label: "Автоприёмка"
          description: "Понятное для юриста описание наличия автоматической приёмки."
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "unilateral_act_allowed"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Вправе ли подрядчик составить односторонний акт."
          required: true
          display_in_grid: false

        - name: "unilateral_act_allowed_display"
          type: "string"
          presentation: "fact"
          label: "Односторонний акт"
          description: "Понятное для юриста описание права на односторонний акт."
          required: true
          display_in_grid: true
          display_priority: 3

        - name: "motivated_refusal_deadline"
          type: "string"
          presentation: "fact"
          label: "Срок для отказа"
          description: "Срок для направления мотивированного отказа заказчиком."
          required: true
          display_in_grid: true
          display_priority: 4

        - name: "acceptance_procedure_details"
          type: "string"
          presentation: "fact"
          label: "Порядок приёмки"
          description: "Общая формулировка порядка сдачи-приёмки из договора."
          required: true
          display_in_grid: false

      store_payload: true

  - id: payment_terms_and_schedule
    name: "Порядок и сроки оплаты, аванс, окончательный расчёт (ст. 711 ГК РФ)"
    description: >
      Фактографическая проверка способа расчётов и наличия аванса
      по договору подряда.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "срок оплаты"
        - "после подписания акта"
        - "банковских дней"
        - "рабочих дней"
        - "банковские реквизиты"
        - "в течение"
        - "аванс"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)оплат(а|у).*в\\s+течение.*\\d+.*(дней|рабоч)"
        - "(?i)после.*подписания.*акта.*в\\s+течение"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор подряда по ст. 711 ГК РФ.
        Проверяется только один вопрос: какой способ оплаты предусмотрен
        договором и есть ли условие об авансе.

        Нормативный ориентир:
        - ст. 711 ГК РФ
        - ст. 314 ГК РФ

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Какой способ расчётов прямо предусмотрен договором.
        2. Есть ли условие об авансе, предоплате или авансовом платеже.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined".
        4. Не используй "None", "null", "not_defined" или пустые строки.
        5. payment_method определяй только по прямой формулировке способа оплаты.
        6. advance_present = "yes" только если аванс, предоплата или авансовый
          платёж прямо упомянуты.
        7. advance_present = "no" только если договор прямо исключает аванс
          или прямо указывает оплату только после выполнения работ
          без предварительного платежа.
        8. В evidence включай только текст договора.
        9. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — данные определены:
        Фрагмент:
        "Оплата по договору производится путем безналичного перечисления
        денежных средств на расчетный счет Подрядчика. Заказчик уплачивает
        аванс в размере 30% от цены договора в течение 5 банковских дней
        с даты подписания договора."

        Ответ:
        {
          "payment_method": "cashless_transfer",
          "payment_method_display": "Безналичный расчёт.",
          "advance_present": "yes",
          "advance_present_display": "Аванс предусмотрен.",
          "evidence": [
            {
              "clause_ref": "п. 4.2",
              "quote": "Оплата по договору производится путем безналичного перечисления денежных средств на расчетный счет Подрядчика. Заказчик уплачивает аванс в размере 30% от цены договора..."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Расчёты между сторонами осуществляются в порядке, предусмотренном
        настоящим договором."

        Ответ:
        {
          "payment_method": "not_defined",
          "payment_method_display": "Способ оплаты прямо не определён.",
          "advance_present": "not_defined",
          "advance_present_display": "Условие об авансе не установлено.",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о способе оплаты.
        2. Найди прямую цитату об авансе или предоплате.
        3. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "payment_method": "<cashless_transfer / cash / mixed / other / not_defined>",
          "payment_method_display": "<понятное описание для юриста>",
          "advance_present": "<yes / no / not_defined>",
          "advance_present_display": "<понятное описание для юриста>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 420

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "срок оплаты после подписания акта банковских дней рабочих дней банковские реквизиты аванс предоплата авансовый платеж безналичный расчет наличными"
      retrieval_profile: "payment_terms_check"
      preferred_unit_types:
        - payment_term
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
      negative_keywords:
        - "гарантия"
        - "неустойка"
        - "форс-мажор"
        - "подсудность"
        - "конфиденциальность"
        - "уступка"
      position_bias:
        preferred_range: [0.20, 0.70]
        boost: 0.20
        scope: segment
      context_k: 5
      max_chunks: 6
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 550

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 320
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора подряда способ оплаты
        и наличие условия об авансе.
        Не анализируй сумму цены, сроки выполнения работ, гарантию,
        штрафы или налоги.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. payment_method — "cashless_transfer" / "cash" / "mixed" /
          "other" / "not_defined".
        2. payment_method_display — понятное описание для юриста.
        3. advance_present — "yes" / "no" / "not_defined".
        4. advance_present_display — понятное описание для юриста.

        Если данные отсутствуют:
        - статус = "not_defined"
        - текст = "Данные не определены"

        Не используй "None", "null" или пустые строки.
        </task>

        <context_rules>
        Используй только текст договора.
        payment_method:
        - "cashless_transfer" — если договор прямо предусматривает
        безналичный расчёт, банковский перевод или перечисление
        на расчётный счёт.
        - "cash" — если договор прямо предусматривает оплату наличными.
        - "mixed" — если договор прямо допускает и безналичный,
        и наличный расчёт.
        - "other" — если предусмотрен иной конкретный способ оплаты.
        - "not_defined" — если способ оплаты прямо не определён.
        payment_method_display:
        - если payment_method = "cashless_transfer":
        "Безналичный расчёт."
        - если payment_method = "cash":
        "Оплата наличными."
        - если payment_method = "mixed":
        "Смешанный расчёт (безналичный и наличный)."
        - если payment_method = "other":
        "Иной способ оплаты."
        - если payment_method = "not_defined":
        "Способ оплаты прямо не определён."
        advance_present:
        - "yes" — если прямо указан аванс, предоплата или авансовый платёж.
        - "no" — если договор прямо исключает аванс или прямо указывает
        оплату только после выполнения работ без предварительного платежа.
        - "not_defined" — если это прямо не установлено.
        advance_present_display:
        - если advance_present = "yes":
        "Аванс предусмотрен."
        - если advance_present = "no":
        "Аванс прямо исключён."
        - если advance_present = "not_defined":
        "Условие об авансе не установлено."
        </context_rules>

        <output_expectations>
        Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        Верни все 4 ключа, даже если значение = "not_defined".
        Не используй "None", "null" или пустые строки.
        </output_expectations>

        <output_format>
        {
          "payment_method": "cashless_transfer | cash | mixed | other | not_defined",
          "payment_method_display": "string",
          "advance_present": "yes | no | not_defined",
          "advance_present_display": "string"
        }
        </output_format>

      fields:
        - name: "payment_method"
          type: "string"
          presentation: "signal"
          allowed_values: ["cashless_transfer", "cash", "mixed", "other", "not_defined"]
          description: "Способ расчётов по договору."
          required: true
          display_in_grid: false

        - name: "payment_method_display"
          type: "string"
          presentation: "fact"
          label: "Способ оплаты"
          description: "Понятное для юриста описание способа расчётов."
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "advance_present"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Есть ли условие об авансе или предоплате."
          required: true
          display_in_grid: false

        - name: "advance_present_display"
          type: "string"
          presentation: "fact"
          label: "Аванс"
          description: "Понятное для юриста описание наличия аванса."
          required: true
          display_in_grid: true
          display_priority: 1

      store_payload: true

  - id: warranty_period_and_defect_procedure
    name: "Гарантийный срок и порядок предъявления претензий по качеству (ст. 722, 724 ГК РФ)"
    description: >
      Фактографическая проверка продолжительности гарантийного срока
      и срока устранения недостатков подрядчиком.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "гарантийный срок"
        - "гарантия качества"
        - "устранение недостатков"
        - "безвозмездное исправление"
        - "скрытые недостатки"
        - "претензия по качеству"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)гарантийный\\s+срок\\s+составляет\\s+\\d+"
        - "(?i)недостатки.*устраняются.*в\\s+течение\\s+\\d+\\s+дней"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор подряда по ст. 722, 724 ГК РФ.
        Проверяется только один вопрос: указан ли договорный гарантийный срок
        и указан ли срок устранения недостатков.

        Нормативный ориентир:
        - ст. 722 ГК РФ
        - ст. 724 ГК РФ
        - ст. 721 ГК РФ

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Какой гарантийный срок прямо указан в договоре.
        2. Какой срок устранения недостатков прямо указан в договоре.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если текстового значения нет — возвращай строго "Данные не определены".
        4. Не используй "None", "null", "not_defined" или пустые строки.
        5. Не выводи законный срок по умолчанию, если договорный срок
          прямо не установлен.
