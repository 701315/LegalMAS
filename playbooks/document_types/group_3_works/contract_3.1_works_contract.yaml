        Ответ:
        {
          "permit_obligation_party": "shared",
          "permit_obligation_party_display": "Обязанности по получению разрешений распределены между сторонами.",
          "specific_permits_list": "Разрешение на строительство, технические условия на подключение, согласование проектной документации",
          "permit_delay_consequences": "В случае задержки получения разрешений по вине соответствующей стороны срок выполнения работ продлевается соразмерно.",
          "evidence": [
            {
              "clause_ref": "п. 2.5",
              "quote": "Заказчик обязан получить разрешение на строительство и технические условия на подключение к сетям инженерного обеспечения. Подрядчик обязан получить все необходимые согласования проектной документации в государственных органах. В случае задержки получения разрешений по вине соответствующей стороны срок выполнения работ продлевается соразмерно."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Подрядчик выполняет работы в соответствии с проектной документацией."

        Ответ:
        {
          "permit_obligation_party": "not_defined",
          "permit_obligation_party_display": "Распределение обязанностей по получению разрешений в предоставленном контексте не установлено.",
          "specific_permits_list": "Данные не определены",
          "permit_delay_consequences": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о распределении обязанностей по разрешениям.
        2. Найди прямую цитату о конкретных разрешениях или согласованиях.
        3. Найди прямую цитату о последствиях задержки.
        4. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "permit_obligation_party": "<customer / contractor / shared / not_defined>",
          "permit_obligation_party_display": "<понятное описание для юриста>",
          "specific_permits_list": "<текст или 'Данные не определены'>",
          "permit_delay_consequences": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 520

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "разрешение на строительство технические условия согласование проектной документации ввод в эксплуатацию заказчик обязан получить подрядчик обязан получить"
