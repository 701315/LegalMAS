          "quality_standards_referenced": "<yes / no / not_defined>",
          "quality_standards_referenced_display": "<понятное описание для юриста>",
          "standards_type": "<gost / tu / contract_specific / sample_based / general / not_defined>",
          "standards_type_display": "<понятное описание для юриста>",
