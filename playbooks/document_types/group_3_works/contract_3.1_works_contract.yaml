      presence_signal:
        field: "change_order_procedure_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_max_tokens: 400

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора подряда условия
        о процедуре изменения объема работ (change order procedure).
        Не анализируй цену как самостоятельную тему, сроки выполнения,
        штрафы или налоги.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. change_order_procedure_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если change_order_mechanism ≠ "not_defined"
             или unauthorized_works_consequence ≠ "Данные не определены";
           - "missing" — если change_order_mechanism = "not_defined"
             и unauthorized_works_consequence = "Данные не определены";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - change_order_mechanism = "not_defined";
           - change_order_mechanism_display = "Процедура изменения объема работ в предоставленном контексте не установлена.";
           - unauthorized_works_consequence = "Данные не определены";
           - не выполняй остальные шаги.

        1. change_order_mechanism:
           - "prior_written_agreement" — если договор прямо требует
             письменное доп. соглашение до начала дополнительных работ;
           - "verbal_allowed" — если договор прямо допускает согласование
             без письменной формы;
           - "not_defined" — если по тексту это не установлено.

        2. change_order_mechanism_display:
           - если "prior_written_agreement": "Требуется письменное доп. соглашение до начала работ.";
           - если "verbal_allowed": "Допускается согласование без письменной формы.";
           - если "not_defined": "Процедура изменения объема работ в предоставленном контексте не установлена."

        3. unauthorized_works_consequence:
            Последствия выполнения работ без согласования по прямой
            формулировке из текста договора.
            Если данных нет — "Данные не определены".
            Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни change_order_procedure_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — change_order_mechanism = "not_defined", unauthorized_works_consequence = "Данные не определены".
        - Используй только текст договора. Не подставляй нормы ст. 743 ГК вместо текста договора.
        - Не путай процедуру согласования дополнительных работ с общим порядком изменения договора (ст. 452 ГК) — извлекай только конкретные условия о доп. работах.
        - Если в разных фрагментах указаны противоречивые условия — presence = "unclear", change_order_mechanism = "not_defined".
        - Не используй "None", "null" или пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни дополнительных работ, ни процедуры их
           согласования, ни последствий.
           → presence = "missing";
             change_order_mechanism = "not_defined";
             unauthorized_works_consequence = "Данные не определены".

        2. Механизм есть, но последствия не указаны.
           "Дополнительные работы выполняются на основании письменного
           доп. соглашения" без указания последствий выполнения
           без согласования.
           → presence = "present";
             change_order_mechanism = "prior_written_agreement";
             unauthorized_works_consequence = "Данные не определены".

        3. Противоречие в процедуре.
           В одном пункте "доп. работы только по письменному соглашению",
           в другом — "доп. работы могут быть согласованы устно".
           → presence = "unclear";
             change_order_mechanism = "not_defined";
             change_order_mechanism_display = "Не удалось определить".

        4. Работы без согласования не оплачиваются.
           "Работы, выполненные Подрядчиком без предварительного
           письменного согласования с Заказчиком, не подлежат оплате."
           → presence = "present";
             change_order_mechanism = "prior_written_agreement" (если явно требуется письменное согласование);
             unauthorized_works_consequence = "Работы не подлежат оплате".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для change_order_procedure_presence используй только: "present", "missing", "unclear".
        - Для change_order_mechanism используй только: "prior_written_agreement", "verbal_allowed", "not_defined".
        - Fallback при отсутствии данных:
          * change_order_mechanism_display → "Процедура изменения объема работ в предоставленном контексте не установлена.";
          * unauthorized_works_consequence → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * change_order_mechanism_display → "Не удалось определить";
          * unauthorized_works_consequence → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "change_order_procedure_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования процедуры изменения объёма работ. Внутреннее агрегатное signal-поле."
          required: true

