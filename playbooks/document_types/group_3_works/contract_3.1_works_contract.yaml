          type: "string"
          presentation: "fact"
          label: "Распределение ответственности"
          description: "Формулировка о распределении ответственности за безопасность."
          required: true
          display_in_grid: true
          display_priority: 3

      store_payload: true

# ════════════════════════════════════════════════════════════════════════════
# БЛОК 5: DD_REQUEST_TEMPLATES
# Читается: DDRequestTemplateLoader
# ════════════════════════════════════════════════════════════════════════════

dd_request_templates:

  parties_identification:
    text: >
      Просим подтвердить полные реквизиты сторон по {doc_names}: наименование/ФИО,
      ИНН, ОГРН/ОГРНИП, адрес регистрации, документы, подтверждающие полномочия
      подписантов (устав, доверенность, приказ).
    addressee: "Обе стороны"

  subject_work_required:
    text: >
      В {doc_names} отсутствует или недостаточно конкретно описан предмет договора.
      Просим предоставить: (а) детальное описание содержания работ; (б) описание
      конкретного овеществлённого результата; (в) техническое задание или спецификацию
      как неотъемлемое приложение к договору.
    addressee: "Заказчик / Подрядчик"

  start_and_end_dates_required:
    text: >
      В {doc_names} не определены начальный и/или конечный сроки выполнения работ
      (ст. 708 ГК РФ). Просим уточнить: (а) дату начала работ; (б) дату завершения
      (конечный срок); (в) промежуточные этапы и их сроки (если применимо).
    addressee: "Обе стороны"

  price_or_estimation_method:
    text: >
      Просим уточнить в {doc_names}: (а) итоговую цену работ цифрами и прописью;
      (б) является ли цена твёрдой или приблизительной; (в) включает ли НДС;
      (г) порядок согласования и оплаты дополнительных работ.
    addressee: "Обе стороны"

  acceptance_procedure:
    text: >
      Просим уточнить в {doc_names} порядок сдачи-приёмки работ: (а) форму акта
      выполненных работ; (б) сроки приёмки после уведомления подрядчика; (в) основания
      для мотивированного отказа; (г) порядок устранения выявленных недостатков.
    addressee: "Обе стороны"

  unilateral_acceptance_mechanism:
    text: >
      Просим добавить в {doc_names} условие об автоматической (односторонней) приёмке:
      если заказчик не направил мотивированный отказ в течение [N] рабочих дней
      после уведомления о готовности — работы считаются принятыми. Основание: ст. 720 ГК РФ.
    addressee: "Юридический советник заказчика"

  suspension_notification_right:
    text: >
      Просим включить в {doc_names} условие о праве подрядчика приостановить работы
      и обязанности немедленно уведомить заказчика при: непригодности материалов,
      неверных указаниях, неоплате аванса. Без уведомления подрядчик теряет право
      ссылаться на эти обстоятельства (ст. 716, 719 ГК РФ).
    addressee: "Юридический советник подрядчика"

  retention_right_before_payment:
    text: >
      Просим включить в {doc_names} право удержания результата работ до полной
      оплаты (ст. 712, 359 ГК РФ): подрядчик не передаёт результат до исполнения
      заказчиком обязательства по оплате.
    addressee: "Юридический советник подрядчика"

  payment_terms_and_schedule:
    text: >
      Просим уточнить в {doc_names}: (а) размер и срок выплаты аванса; (б) момент
      возникновения обязанности по окончательному расчёту (подписание акта);
      (в) конкретный срок оплаты в банковских/рабочих днях; (г) банковские реквизиты
      подрядчика.
    addressee: "Заказчик / Бухгалтерия"

  penalty_for_delay_contractor:
    text: >
      Просим добавить в {doc_names} неустойку за просрочку выполнения работ подрядчиком:
      пеня в размере [X]% от цены договора (или невыполненного этапа) за каждый
      календарный день просрочки (ст. 330, 708 ГК РФ).
    addressee: "Юридический советник заказчика"

  penalty_for_payment_delay_customer:
    text: >
      Просим добавить в {doc_names} неустойку за просрочку оплаты заказчиком:
      пеня в размере [X]% от неоплаченной суммы за каждый день просрочки, но не менее
      ставки ст. 395 ГК РФ.
    addressee: "Юридический советник подрядчика"

  warranty_period_and_defect_procedure:
    text: >
      Просим уточнить в {doc_names}: (а) продолжительность гарантийного срока;
      (б) порядок и срок направления претензии по качеству; (в) срок устранения
      недостатков подрядчиком; (г) последствия неустранения (замена, уменьшение
      цены, возмещение расходов на устранение).
    addressee: "Обе стороны"

  risk_allocation_before_acceptance:
    text: >
      Просим уточнить в {doc_names} распределение рисков случайной гибели/повреждения
      результата и материалов до приёмки (ст. 705 ГК РФ). Особо важно при использовании
      давальческих материалов заказчика.
    addressee: "Юридический советник"

  customer_materials_regime_check:
    text: >
      В {doc_names} предусмотрены давальческие материалы заказчика. Просим уточнить:
      (а) норму расхода материалов; (б) обязанность подрядчика вести и предоставлять
      отчёт об использовании; (в) порядок возврата остатков; (г) ответственность
      за сохранность (ст. 713, 714 ГК РФ).
    addressee: "Заказчик / Подрядчик"

  subcontracting_conditions:
    text: >
      Просим уточнить в {doc_names}: (а) вправе ли подрядчик привлекать субподрядчиков;
      (б) требуется ли письменное согласие заказчика; (в) порядок ответственности
      подрядчика за действия субподрядчиков (ст. 706 ГК РФ).
    addressee: "Обе стороны"

  contractor_performance_personally:
    text: >
      В {doc_names} подрядчик — физическое лицо. Просим закрепить обязанность
      личного выполнения работ без передачи третьим лицам (ст. 706 ГК РФ) во избежание
      риска привлечения ненадёжных исполнителей.
    addressee: "Юридический советник заказчика"

  customer_unilateral_refusal_check:
    text: >
      Просим подтвердить, что в {doc_names} сохраняется право заказчика на односторонний
      отказ от договора до сдачи результата с оплатой фактически выполненного
      (ст. 717 ГК РФ). Если введены штрафные санкции за отказ — просим дать правовое
      обоснование их соответствия ст. 422 ГК РФ.
    addressee: "Юридический советник"

  intermediate_inspection_right:
    text: >
      Просим закрепить в {doc_names} право заказчика контролировать ход и качество работ
      в любое время без вмешательства в деятельность подрядчика (ст. 715 ГК РФ),
      а также порядок фиксации замечаний.
    addressee: "Юридический советник заказчика"

  hidden_works_documentation:
    text: >
      Просим предусмотреть в {doc_names} порядок освидетельствования и актирования
      скрытых работ до их закрытия. Предоставьте: (а) перечень работ, подлежащих
      промежуточной приёмке; (б) форму акта на скрытые работы; (в) последствия
      закрытия работ без актирования.
    addressee: "Обе стороны"

  termination_grounds_and_consequences:
    text: >
      Просим уточнить в {doc_names}: (а) основания расторжения для каждой стороны;
      (б) порядок уведомления; (в) условия возврата аванса и оплаты фактически
      выполненного; (г) сроки взаиморасчётов (ст. 453, 715, 717 ГК РФ).
    addressee: "Юридический советник"

  dispute_resolution_clause:
    text: >
      Просим уточнить в {doc_names}: (а) срок рассмотрения претензии (рекомендуется
      30 календарных дней); (б) подсудность; (в) возможность применения медиации
      или иных альтернативных способов. Претензионный порядок обязателен для
      АПК РФ (ст. 4).
    addressee: "Юридический советник"

  intellectual_property_ownership:
    text: >
      Просим уточнить в {doc_names}: кому принадлежат исключительные права
      на результат работ, содержащий объекты интеллектуальной собственности
      (проект, ПО, дизайн, чертёж). По умолчанию — подрядчику (ст. 1296 ГК РФ).
      Для передачи прав заказчику необходимо явное условие об отчуждении.
    addressee: "Юридический советник"

  vat_and_tax_allocation:
    text: >
      Просим уточнить в {doc_names}: (а) включает ли цена НДС; (б) применяет ли
      подрядчик УСН или является самозанятым (ФЗ-422); (в) кто несёт налоговые
      последствия, если статус подрядчика изменится в ходе договора.
    addressee: "Налоговый консультант / Бухгалтерия"

  force_majeure_clause:
    text: >
      Просим уточнить в {doc_names}: (а) перечень форс-мажорных обстоятельств;
      (б) срок уведомления контрагента; (в) максимальный период приостановки
      обязательств; (г) право расторжения при длительном форс-мажоре (ст. 401 ГК РФ).
    addressee: "Юридический советник"

  confidentiality_clause:
    text: >
      Просим добавить в {doc_names} условие о конфиденциальности: перечень
      конфиденциальных сведений, срок неразглашения после окончания договора,
      исключения, ответственность за нарушение.
    addressee: "Юридический советник"

  labor_requalification_risk:
    text: >
      Внимание: в {doc_names} выявлены признаки, указывающие на возможную
      переквалификацию договора в трудовой (ст. 19.1 ТК РФ). Просим:
      (а) исключить из договора указание на режим работы, рабочее место у заказчика,
      регулярность оплаты вне зависимости от результата; (б) закрепить самостоятельное
      определение подрядчиком способов и условий выполнения; (в) получить правовое
      заключение по ст. 15, 19.1 ТК РФ.
    addressee: "Юридический советник / HR"

  unlicensed_work_prohibition:
    text: >
      Просим подтвердить по {doc_names}: (а) наличие у подрядчика лицензии или
      допуска СРО (при необходимости); (б) предоставить копию лицензии/свидетельства;
      (в) подтвердить, что выполняемые работы не относятся к лицензируемым видам
      деятельности (ФЗ-99, ст. 55.8 ГрК РФ).
    addressee: "Подрядчик / Юридический советник"

  subject_and_result_extraction:
    text: >
      Просим подтвердить по {doc_names}: (а) описание содержания работ;
      (б) конкретный овеществлённый результат (ст. 702, 703 ГК РФ);
      (в) наличие ТЗ/спецификации как приложения; (г) конкретность описания
      (достаточна ли для однозначной приёмки).
    addressee: "Обе стороны"

  deadlines_extraction:
    text: >
      Просим подтвердить по {doc_names}: (а) начальный и конечный сроки (ст. 708 ГК РФ);
      (б) промежуточные этапы (если применимо); (в) порядок продления при задержке
      со стороны заказчика.
    addressee: "Обе стороны"

  price_and_estimate_analysis:
    text: >
      Просим подтвердить по {doc_names}: (а) тип цены — твёрдая или приблизительная
      (ст. 709 ГК РФ); (б) сумму; (в) порядок согласования изменений; (г) при
      приблизительной смете — обязанность уведомления о превышении > 10% (ст. 709 п. 5).
    addressee: "Обе стороны"

  quality_standards_and_conformity_check:
    text: >
      Просим уточнить в {doc_names}: (а) какие стандарты качества применяются
      (ГОСТ, ТУ, ТЗ, образец); (б) критерии приёмки результата; (в) метод
      оценки соответствия (испытания, осмотр, экспертиза); (г) последствия
      несоответствия (ст. 721, 723 ГК РФ).
    addressee: "Обе стороны"

  customer_cooperation_obligations:
    text: >
      Просим включить в {doc_names}: конкретные обязанности заказчика по содействию
      (ст. 718 ГК РФ): предоставление доступа, информации, документов, назначение
      контактного лица, сроки исполнения, последствия нарушения (продление сроков,
      право на приостановку по ст. 719 ГК РФ).
    addressee: "Юридический советник заказчика"

  governing_law:
    text: >
      Просим подтвердить в {doc_names} применимое право (законодательство РФ),
      подсудность, язык договора.
    addressee: "Юридический советник"

  anticorruption_clause:
    text: >
      Просим включить в {doc_names} антикоррупционную оговорку (ФЗ-273):
      заверения сторон, порядок уведомления, последствия нарушения.
    addressee: "Юридический советник"

  approximate_estimate_exceeded_without_notice:
    text: >
      В {doc_names} предусмотрена приблизительная смета. Просим включить:
      (а) обязанность подрядчика немедленно уведомить заказчика при необходимости
      превышения сметы более чем на 10% (ст. 709 п. 5 ГК РФ); (б) право заказчика
      отказаться от договора при неуведомлении; (в) порядок оформления
      дополнительных расходов.
    addressee: "Юридический советник"

  assignment_restriction:
    text: >
      Просим уточнить в {doc_names}: допустимость уступки прав / перевода долга,
      требуется ли согласие другой стороны. Особенно важно: запрет на уступку
      подрядчиком права на оплату без согласия заказчика.
    addressee: "Юридический советник"
    
   # Generic fallback
  _default:
    text: >
      Просим предоставить дополнительную информацию по вопросу «{check_name}»
      применительно к {doc_names}.
    addressee: "Юридический советник"
    
