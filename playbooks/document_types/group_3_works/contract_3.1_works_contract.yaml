      max_snippet_length: 550

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      presence_signal:
        field: "vat_and_tax_allocation_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_max_tokens: 400

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора подряда условия
        о НДС и налоговом статусе стороны.
        Не анализируй цену как самостоятельную тему, сроки, гарантию,
        штрафы или подсудность.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. vat_and_tax_allocation_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (vat_treatment, tax_regime_reference) ≠ "not_defined";
           - "missing" — если оба содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - vat_treatment = "not_defined";
           - tax_regime_reference = "not_defined";
           - vat_treatment_display = "Режим НДС в предоставленном контексте не установлен.";
           - tax_regime_reference_display = "Налоговый статус стороны в предоставленном контексте не установлен.";
           - tax_clause_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. vat_treatment:
           - "included_in_price" — если цена прямо указана как включающая НДС;
           - "excluded_from_price" — если НДС прямо указано начислять сверх цены;
           - "no_vat" — если договор прямо указывает "без НДС", "НДС не облагается";
           - "not_defined" — если по тексту режим НДС не установлен.

        2. vat_treatment_display:
           - если "included_in_price": "Цена включает НДС.";
           - если "excluded_from_price": "НДС начисляется сверх цены.";
           - если "no_vat": "НДС не облагается.";
           - если "not_defined": "Режим НДС в предоставленном контексте не установлен."

        3. tax_regime_reference:
           - "usn" — прямо указана упрощённая система налогообложения;
           - "self_employed" — прямо указан самозанятый, НПД;
           - "general" — прямо указан общий налоговый режим;
           - "not_defined" — если по тексту это не установлено.

        4. tax_regime_reference_display:
           - если "usn": "Подрядчик применяет УСН.";
           - если "self_employed": "Подрядчик является самозанятым (плательщик НПД).";
           - если "general": "Подрядчик применяет общий налоговый режим.";
           - если "not_defined": "Налоговый статус стороны в предоставленном контексте не установлен."

        5. tax_clause_details:
            Формулировка о НДС или налоговом режиме по прямому тексту договора.
            Если данных нет — "Данные не определены".
            Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни vat_and_tax_allocation_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все signal-поля = "not_defined", все *_display = соответствующий fallback, tax_clause_details = "Данные не определены".
        - Используй только текст договора. Не подставляй нормы НК РФ вместо текста договора.
        - tax_regime_reference определяй только по прямому указанию на УСН, НПД/самозанятого или общий режим.
        - Если в разных фрагментах указаны противоречивые налоговые условия — presence = "unclear", соответствующие поля = "not_defined".
        - Не используй "None", "null" или пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни НДС, ни налогового режима, ни оговорки
           о статусе стороны.
           → presence = "missing";
             все signal-поля = "not_defined";
             все *_display = соответствующий fallback;
             tax_clause_details = "Данные не определены".

        2. Только НДС без налогового режима.
           "Цена составляет 500 000 рублей, в том числе НДС 20%"
           без указания на УСН/НПД.
           → presence = "present";
             vat_treatment = "included_in_price";
             tax_regime_reference = "not_defined".

        3. Противоречие в режиме НДС.
           В одном пункте "в том числе НДС 20%", в другом —
           "НДС не облагается".
           → presence = "unclear";
             vat_treatment = "not_defined";
             vat_treatment_display = "Не удалось определить".

        4. Самозанятый подрядчик.
           "Подрядчик является плательщиком налога на профессиональный
           доход. НДС не облагается."
           → presence = "present";
             vat_treatment = "no_vat";
             tax_regime_reference = "self_employed";
             tax_clause_details отражает обе формулировки.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для vat_and_tax_allocation_presence используй только: "present", "missing", "unclear".
        - Для vat_treatment используй только: "included_in_price", "excluded_from_price", "no_vat", "not_defined".
        - Для tax_regime_reference используй только: "usn", "self_employed", "general", "not_defined".
        - Fallback при отсутствии данных:
          * vat_treatment_display → "Режим НДС в предоставленном контексте не установлен.";
          * tax_regime_reference_display → "Налоговый статус стороны в предоставленном контексте не установлен.";
          * tax_clause_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_display → "Не удалось определить";
          * tax_clause_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "vat_and_tax_allocation_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
