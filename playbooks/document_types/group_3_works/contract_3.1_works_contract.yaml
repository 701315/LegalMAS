          required: true
          display_in_grid: true
          display_priority: 1

        - name: "third_party_transfer_prohibited"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Запрещена ли передача исполнения третьим лицам."
          required: true
          display_in_grid: false

        - name: "third_party_transfer_prohibited_display"
          type: "string"
          presentation: "fact"
          label: "Запрет передачи"
