          display_in_grid: false

        - name: "no_interference_rule_display"
          type: "string"
          presentation: "fact"
          label: "Невмешательство"
          description: "Понятное для юриста описание правила о невмешательстве заказчика."
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "inspection_scope"
          type: "string"
          presentation: "fact"
          label: "Предмет проверки"
          description: "Формулировка об объёме или предмете проверки."
          required: true
          display_in_grid: true
          display_priority: 3

      store_payload: true

  - id: hidden_works_documentation
    name: "Скрытые работы: фиксация и промежуточная приёмка"
    description: >
      Фактографическая проверка того, предусмотрена ли фиксация скрытых работ,
      требуется ли промежуточная приёмка / освидетельствование и как именно
      описан порядок документирования таких работ.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "medium"
    severity_if_pass: "pass"
    severity_if_fail: "medium"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "скрытые работы"
        - "акт на скрытые работы"
        - "промежуточная приёмка"
        - "до закрытия"
        - "освидетельствование"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)акт.*на\\s+скрытые\\s+работы"
        - "(?i)промежуточн(ая|ой)\\s+приёмк"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор подряда в части оформления скрытых работ.
        Проверяется только один вопрос: предусмотрены ли фиксация скрытых работ,
        промежуточная приёмка и порядок их документирования.

        Нормативный ориентир:
        - ст. 720 ГК РФ
        - строительные нормы о скрытых работах

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Предусмотрена ли фиксация или актирование скрытых работ.
        2. Предусмотрена ли промежуточная приёмка / освидетельствование
           скрытых работ до их закрытия.
        3. Как именно описан порядок документирования скрытых работ.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если условие не указано прямо — возвращай "not_defined".
        3. Если текстового значения нет — возвращай "Данные не определены".
        4. Не используй "None", "null", "not_defined" или пустые строки.
        5. hidden_works_documentation_present = "yes" только если договор
           прямо предусматривает фиксацию, акт или иной документ по скрытым работам.
        6. intermediate_acceptance_required = "yes" только если договор прямо
           требует промежуточную приёмку, освидетельствование или иную проверку
           до закрытия скрытых работ.
        7. hidden_works_details заполняй только по прямой формулировке договора.
        8. В evidence включай только текст договора.
        9. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — данные определены:
        Фрагмент:
        "Скрытые работы подлежат обязательному освидетельствованию до их закрытия.
        По результатам освидетельствования составляется акт на скрытые работы,
        подписываемый представителями сторон."

        Ответ:
        {
          "hidden_works_documentation_present": "yes",
          "hidden_works_documentation_present_display": "Фиксация скрытых работ предусмотрена.",
          "intermediate_acceptance_required": "yes",
          "intermediate_acceptance_required_display": "Промежуточная приёмка / освидетельствование скрытых работ требуется.",
          "hidden_works_details": "Скрытые работы подлежат обязательному освидетельствованию до их закрытия с составлением акта на скрытые работы.",
          "evidence": [
            {
              "clause_ref": "п. 6.7",
              "quote": "Скрытые работы подлежат обязательному освидетельствованию до их закрытия. По результатам освидетельствования составляется акт на скрытые работы, подписываемый представителями сторон."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Подрядчик выполняет работы в соответствии с проектной документацией."

        Ответ:
        {
          "hidden_works_documentation_present": "not_defined",
          "hidden_works_documentation_present_display": "Фиксация скрытых работ в предоставленном контексте не установлена.",
          "intermediate_acceptance_required": "not_defined",
          "intermediate_acceptance_required_display": "Промежуточная приёмка скрытых работ в предоставленном контексте не установлена.",
          "hidden_works_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о скрытых работах.
        2. Найди прямую цитату об освидетельствовании или промежуточной приёмке.
        3. Найди прямую цитату о составлении акта или ином документировании.
        4. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "hidden_works_documentation_present": "<yes / no / not_defined>",
          "hidden_works_documentation_present_display": "<понятное описание для юриста>",
          "intermediate_acceptance_required": "<yes / no / not_defined>",
          "intermediate_acceptance_required_display": "<понятное описание для юриста>",
          "hidden_works_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 520

    retrieval:
      retrieval_profile: "acceptance_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "скрытые работы акт на скрытые работы промежуточная приемка до закрытия освидетельствование"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
      negative_keywords:
        - "цена"
        - "аванс"
        - "неустойка"
        - "НДС"
        - "гарантия"
        - "подсудность"
      position_bias:
        preferred_range: [0.25, 0.85]
        boost: 0.18
        scope: segment
      context_k: 5
      max_chunks: 6
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
        - "technical_specification"
      excluded_segment_types:
        - "price_list"
      preferred_clause_functions:
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 550

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      presence_signal:
        field: "hidden_works_documentation_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_max_tokens: 400

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора подряда условия
        о фиксации и промежуточной приёмке скрытых работ.
        Не анализируй цену, сроки, гарантию, штрафы или подсудность.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. hidden_works_documentation_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (hidden_works_documentation_present,
              intermediate_acceptance_required) ≠ "not_defined";
           - "missing" — если оба содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - hidden_works_documentation_present = "not_defined";
           - intermediate_acceptance_required = "not_defined";
           - hidden_works_documentation_present_display = "Фиксация скрытых работ в предоставленном контексте не установлена.";
           - intermediate_acceptance_required_display = "Промежуточная приёмка скрытых работ в предоставленном контексте не установлена.";
           - hidden_works_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. hidden_works_documentation_present:
           - "yes" — если договор прямо предусматривает фиксацию, актирование
             или иной документ по скрытым работам;
           - "no" — если договор прямо исключает такое оформление;
           - "not_defined" — если по тексту это не установлено.

        2. hidden_works_documentation_present_display:
           - если "yes": "Фиксация скрытых работ предусмотрена.";
           - если "no": "Фиксация скрытых работ прямо исключена.";
           - если "not_defined": "Фиксация скрытых работ в предоставленном контексте не установлена."

        3. intermediate_acceptance_required:
           - "yes" — если договор прямо требует освидетельствование,
             промежуточную приёмку или проверку скрытых работ до их закрытия;
           - "no" — если договор прямо исключает такую процедуру;
           - "not_defined" — если это прямо не установлено.

        4. intermediate_acceptance_required_display:
           - если "yes": "Промежуточная приёмка / освидетельствование скрытых работ требуется.";
           - если "no": "Промежуточная приёмка скрытых работ прямо исключена.";
           - если "not_defined": "Промежуточная приёмка скрытых работ в предоставленном контексте не установлена."

        5. hidden_works_details:
            Формулировка о порядке оформления скрытых работ по прямому
            тексту договора.
            Если данных нет — "Данные не определены".
            Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни hidden_works_documentation_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все signal-поля = "not_defined", все *_display = соответствующий fallback, hidden_works_details = "Данные не определены".
        - Используй только текст договора. Не подставляй строительные нормы или ГОСТы вместо текста договора.
        - Не определяй наличие скрытых работ на основании общих фраз о приёмке — только по прямому упоминанию "скрытые работы", "освидетельствование" или аналогичных терминов.
        - Если в разных фрагментах указаны противоречивые условия — presence = "unclear", соответствующие поля = "not_defined".
        - Не используй "None", "null" или пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет упоминания скрытых работ, освидетельствования
           или промежуточной приёмки.
           → presence = "missing";
             все signal-поля = "not_defined";
             все *_display = соответствующий fallback;
             hidden_works_details = "Данные не определены".

        2. Только фиксация без освидетельствования.
           "По скрытым работам составляется акт" без требования
           освидетельствования до закрытия.
           → presence = "present";
             hidden_works_documentation_present = "yes";
             intermediate_acceptance_required = "not_defined".

        3. Противоречие в условиях.
           В одном пункте "скрытые работы подлежат освидетельствованию",
           в другом — "освидетельствование скрытых работ не требуется".
           → presence = "unclear";
             intermediate_acceptance_required = "not_defined";
             intermediate_acceptance_required_display = "Не удалось определить".

        4. Полное регулирование.
           Фиксация + освидетельствование до закрытия + порядок
           составления акта.
           → presence = "present";
             hidden_works_documentation_present = "yes";
             intermediate_acceptance_required = "yes";
             hidden_works_details отражает полный порядок.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для hidden_works_documentation_presence используй только: "present", "missing", "unclear".
        - Для hidden_works_documentation_present используй только: "yes", "no", "not_defined".
        - Для intermediate_acceptance_required используй только: "yes", "no", "not_defined".
        - Fallback при отсутствии данных:
          * hidden_works_documentation_present_display → "Фиксация скрытых работ в предоставленном контексте не установлена.";
          * intermediate_acceptance_required_display → "Промежуточная приёмка скрытых работ в предоставленном контексте не установлена.";
          * hidden_works_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_display → "Не удалось определить";
          * hidden_works_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "hidden_works_documentation_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования скрытых работ. Внутреннее агрегатное signal-поле."
          required: true

        - name: "hidden_works_documentation_present"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Предусмотрено ли документирование скрытых работ."
          required: true
          display_in_grid: false

        - name: "hidden_works_documentation_present_display"
          type: "string"
          presentation: "fact"
          label: "Оформление скрытых работ"
          description: "Понятное для юриста описание наличия документирования скрытых работ."
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "intermediate_acceptance_required"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Требуется ли освидетельствование / промежуточная приёмка скрытых работ."
          required: true
          display_in_grid: false

        - name: "intermediate_acceptance_required_display"
          type: "string"
          presentation: "fact"
          label: "Промежуточная приёмка"
          description: "Понятное для юриста описание необходимости промежуточной приёмки скрытых работ."
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "hidden_works_details"
          type: "string"
          presentation: "fact"
          label: "Порядок оформления"
          description: "Формулировка о порядке оформления скрытых работ."
          required: true
          display_in_grid: true
          display_priority: 3

      store_payload: true

  - id: termination_grounds_and_consequences
    name: "Расторжение: основания, последствия, взаиморасчёты (ст. 453, 715, 717 ГК РФ)"
    description: >
      Фактографическая проверка того, определены ли в договоре основания
      расторжения, последствия расторжения и порядок взаиморасчётов
      между сторонами.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "расторжение договора"
        - "отказ от исполнения"
        - "возврат аванса"
        - "оплата фактически выполненного"
        - "взаиморасчёты"
        - "последствия расторжения"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)расторж(ение|ении)\\s+договора"
        - "(?i)возврат.*аванс"
        - "(?i)оплат.*фактически\\s+выполненн"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор подряда в части прекращения и расторжения.
        Проверяется только один вопрос: определены ли основания расторжения,
        последствия расторжения и порядок взаиморасчётов.

        Нормативный ориентир:
        - ст. 453 ГК РФ
        - ст. 715 ГК РФ
        - ст. 717 ГК РФ

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Определены ли основания расторжения или отказа от исполнения.
        2. Определены ли последствия расторжения.
        3. Определён ли порядок взаиморасчётов, включая возврат аванса
           или оплату фактически выполненного.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если условие не указано прямо — возвращай "not_defined".
        3. Если текстового значения нет — возвращай "Данные не определены".
        4. Не используй "None", "null", "not_defined" или пустые строки.
        5. termination_grounds_defined = "yes" только если основания
           расторжения или отказа прямо описаны.
        6. termination_consequences_defined = "yes" только если последствия
           расторжения прямо описаны.
        7. settlement_on_termination_defined = "yes" только если порядок
           взаиморасчётов прямо описан.
        8. settlement_on_termination заполняй только по прямому тексту договора.
        9. В evidence включай только текст договора.
        10. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — данные определены:
        Фрагмент:
        "Каждая из сторон вправе расторгнуть договор в случае существенного
        нарушения обязательств другой стороной. При расторжении договора
        Заказчик оплачивает фактически выполненные работы, а неосвоенный аванс
        подлежит возврату в течение 10 рабочих дней."

        Ответ:
        {
          "termination_grounds_defined": "yes",
          "termination_grounds_defined_display": "Основания расторжения определены.",
          "termination_consequences_defined": "yes",
          "termination_consequences_defined_display": "Последствия расторжения определены.",
          "settlement_on_termination_defined": "yes",
          "settlement_on_termination_defined_display": "Порядок взаиморасчётов при расторжении определён.",
          "settlement_on_termination": "Заказчик оплачивает фактически выполненные работы, а неосвоенный аванс подлежит возврату в течение 10 рабочих дней.",
          "evidence": [
            {
              "clause_ref": "п. 9.2",
              "quote": "Каждая из сторон вправе расторгнуть договор в случае существенного нарушения обязательств другой стороной. При расторжении договора Заказчик оплачивает фактически выполненные работы, а неосвоенный аванс подлежит возврату в течение 10 рабочих дней."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Договор действует до полного исполнения обязательств сторонами."

        Ответ:
        {
          "termination_grounds_defined": "not_defined",
          "termination_grounds_defined_display": "Основания расторжения в предоставленном контексте не установлены.",
          "termination_consequences_defined": "not_defined",
          "termination_consequences_defined_display": "Последствия расторжения в предоставленном контексте не установлены.",
          "settlement_on_termination_defined": "not_defined",
          "settlement_on_termination_defined_display": "Порядок взаиморасчётов при расторжении в предоставленном контексте не установлен.",
          "settlement_on_termination": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату об основаниях расторжения.
        2. Найди прямую цитату о последствиях расторжения.
        3. Найди прямую цитату о взаиморасчётах при расторжении.
        4. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "termination_grounds_defined": "<yes / no / not_defined>",
          "termination_grounds_defined_display": "<понятное описание для юриста>",
          "termination_consequences_defined": "<yes / no / not_defined>",
          "termination_consequences_defined_display": "<понятное описание для юриста>",
          "settlement_on_termination_defined": "<yes / no / not_defined>",
          "settlement_on_termination_defined_display": "<понятное описание для юриста>",
          "settlement_on_termination": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 560

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "расторжение договора отказ от исполнения возврат аванса оплата фактически выполненного взаиморасчеты последствия расторжения"
      retrieval_profile: "termination_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
      negative_keywords:
        - "цена"
        - "НДС"
        - "гарантия"
        - "форс-мажор"
        - "подсудность"
        - "конфиденциальность"
      position_bias:
        preferred_range: [0.50, 1.0]
        boost: 0.18
        scope: segment
      context_k: 5
      max_chunks: 6
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "price_list"
      preferred_clause_functions:
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      presence_signal:
        field: "termination_grounds_and_consequences_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_max_tokens: 500

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора подряда условия
        о расторжении и взаиморасчётах между сторонами.
        Не анализируй цену как самостоятельную тему, гарантию, налоги
        или подсудность.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. termination_grounds_and_consequences_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (termination_grounds_defined, termination_consequences_defined,
              settlement_on_termination_defined) ≠ "not_defined";
           - "missing" — если все три содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - termination_grounds_defined = "not_defined";
           - termination_consequences_defined = "not_defined";
           - settlement_on_termination_defined = "not_defined";
           - все *_display = соответствующий fallback;
           - settlement_on_termination = "Данные не определены";
           - не выполняй остальные шаги.

        1. termination_grounds_defined:
           - "yes" — если основания расторжения или отказа прямо описаны;
           - "no" — если договор прямо указывает на отсутствие специальных
             оснований;
           - "not_defined" — если по тексту это не установлено.

        2. termination_grounds_defined_display:
           - если "yes": "Основания расторжения определены.";
           - если "no": "Специальные основания расторжения прямо не предусмотрены.";
           - если "not_defined": "Основания расторжения в предоставленном контексте не установлены."

        3. termination_consequences_defined:
           - "yes" — если последствия расторжения прямо описаны;
           - "no" — если договор прямо указывает на отсутствие специальных
             последствий;
           - "not_defined" — если по тексту это не установлено.

        4. termination_consequences_defined_display:
           - если "yes": "Последствия расторжения определены.";
           - если "no": "Специальные последствия расторжения прямо не предусмотрены.";
           - если "not_defined": "Последствия расторжения в предоставленном контексте не установлены."

        5. settlement_on_termination_defined:
           - "yes" — если порядок взаиморасчётов прямо описан;
           - "no" — если договор прямо исключает специальные взаиморасчёты;
           - "not_defined" — если по тексту это не установлено.

        6. settlement_on_termination_defined_display:
           - если "yes": "Порядок взаиморасчётов при расторжении определён.";
           - если "no": "Специальный порядок взаиморасчётов при расторжении прямо не предусмотрен.";
           - если "not_defined": "Порядок взаиморасчётов при расторжении в предоставленном контексте не установлен."

        7. settlement_on_termination:
            Формулировка о взаиморасчётах при расторжении по прямому тексту
            договора (возврат аванса, оплата фактически выполненного и т.п.).
            Если данных нет — "Данные не определены".
            Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни termination_grounds_and_consequences_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все signal-поля = "not_defined", все *_display = соответствующий fallback, settlement_on_termination = "Данные не определены".
        - Используй только текст договора. Не подставляй нормы закона вместо текста договора.
        - Общая фраза "Договор может быть расторгнут по основаниям, предусмотренным законодательством РФ" без конкретизации — termination_grounds_defined = "not_defined" (это отсылка к диспозитивным нормам, а не договорное регулирование).
        - Если в разных фрагментах указаны противоречивые условия расторжения — presence = "unclear", соответствующие поля = "not_defined".
        - Не используй "None", "null" или пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни оснований расторжения, ни последствий,
           ни взаиморасчётов (только фраза о сроке действия договора).
           → presence = "missing";
             все signal-поля = "not_defined";
             все *_display = соответствующий fallback;
             settlement_on_termination = "Данные не определены".

        2. Только основания без последствий.
           "Каждая сторона вправе расторгнуть договор при существенном
           нарушении другой стороной" без описания последствий и
           взаиморасчётов.
           → presence = "present";
             termination_grounds_defined = "yes";
             termination_consequences_defined = "not_defined";
             settlement_on_termination_defined = "not_defined".

        3. Противоречие в условиях.
           В одном пункте "при расторжении аванс не возвращается",
           в другом — "неосвоенный аванс подлежит возврату".
           → presence = "unclear";
             settlement_on_termination_defined = "not_defined";
             settlement_on_termination = "Не удалось определить".

        4. Отсылка к ГК РФ без конкретизации.
           "Расторжение договора осуществляется в порядке, предусмотренном
           ст. 450–453 ГК РФ" без конкретных договорных условий.
           → presence = "present";
             termination_grounds_defined = "not_defined" (конкретных оснований нет);
             termination_consequences_defined = "not_defined";
             settlement_on_termination_defined = "not_defined".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для termination_grounds_and_consequences_presence используй только: "present", "missing", "unclear".
        - Для termination_grounds_defined используй только: "yes", "no", "not_defined".
        - Для termination_consequences_defined используй только: "yes", "no", "not_defined".
        - Для settlement_on_termination_defined используй только: "yes", "no", "not_defined".
        - Fallback при отсутствии данных:
          * termination_grounds_defined_display → "Основания расторжения в предоставленном контексте не установлены.";
          * termination_consequences_defined_display → "Последствия расторжения в предоставленном контексте не установлены.";
          * settlement_on_termination_defined_display → "Порядок взаиморасчётов при расторжении в предоставленном контексте не установлен.";
          * settlement_on_termination → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_display → "Не удалось определить";
          * settlement_on_termination → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "termination_grounds_and_consequences_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования расторжения и взаиморасчётов. Внутреннее агрегатное signal-поле."
          required: true

        - name: "termination_grounds_defined"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Определены ли основания расторжения или отказа от исполнения."
          required: true
          display_in_grid: false

        - name: "termination_grounds_defined_display"
          type: "string"
          presentation: "fact"
          label: "Основания расторжения"
          description: "Понятное для юриста описание наличия оснований расторжения."
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "termination_consequences_defined"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Определены ли последствия расторжения."
          required: true
          display_in_grid: false

        - name: "termination_consequences_defined_display"
          type: "string"
          presentation: "fact"
          label: "Последствия расторжения"
          description: "Понятное для юриста описание наличия последствий расторжения."
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "settlement_on_termination_defined"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Определён ли порядок взаиморасчётов при расторжении."
          required: true
          display_in_grid: false

        - name: "settlement_on_termination_defined_display"
          type: "string"
          presentation: "fact"
          label: "Взаиморасчёты"
          description: "Понятное для юриста описание наличия порядка взаиморасчётов при расторжении."
          required: true
          display_in_grid: true
          display_priority: 3

        - name: "settlement_on_termination"
          type: "string"
          presentation: "fact"
          label: "Порядок взаиморасчётов"
          description: "Формулировка о возврате аванса и/или оплате фактически выполненного."
          required: true
          display_in_grid: true
          display_priority: 4

      store_payload: true

  - id: vat_and_tax_allocation
    name: "НДС и налоговые оговорки"
    description: >
      Фактографическая проверка того, как в договоре урегулированы НДС
      и специальные налоговые оговорки: включён ли НДС в цену, применяется ли
      УСН или режим самозанятого.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "medium"
    severity_if_pass: "pass"
    severity_if_fail: "medium"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "НДС"
        - "в том числе НДС"
        - "без НДС"
        - "налог на профессиональный доход"
        - "самозанятый"
        - "УСН"
        - "не является плательщиком НДС"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)\\bНДС\\b"
        - "(?i)налог\\s+на\\s+профессиональный\\s+доход"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор подряда в части НДС и налоговых оговорок.
        Проверяется только один вопрос: как в договоре описан режим НДС
        и есть ли указание на специальный налоговый статус стороны.

        Нормативный ориентир:
        - НК РФ
        - ФЗ-422 о налоге на профессиональный доход

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Как урегулирован НДС по цене договора.
        2. Есть ли указание на специальный налоговый режим или статус
           плательщика.
        3. Как именно сформулирована налоговая оговорка.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если условие не указано прямо — возвращай "not_defined".
        3. Если текстового значения нет — возвращай "Данные не определены".
        4. Не используй "None", "null", "not_defined" или пустые строки.
        5. vat_treatment = "included_in_price" только если договор прямо
           указывает, что цена включает НДС.
        6. vat_treatment = "excluded_from_price" только если договор прямо
           указывает, что НДС начисляется сверх цены.
        7. vat_treatment = "no_vat" только если договор прямо указывает
           "без НДС" или аналогичную формулировку.
        8. tax_regime_reference определяй только по прямому указанию на УСН,
           НПД/самозанятого или общий режим.
        9. tax_clause_details заполняй только по прямому тексту договора.
        10. В evidence включай только текст договора.
        11. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — данные определены:
        Фрагмент:
        "Цена договора составляет 500 000 рублей, НДС не облагается в связи
        с применением Подрядчиком упрощённой системы налогообложения."

        Ответ:
        {
          "vat_treatment": "no_vat",
          "vat_treatment_display": "НДС не облагается.",
          "tax_regime_reference": "usn",
          "tax_regime_reference_display": "Подрядчик применяет УСН.",
          "tax_clause_details": "НДС не облагается в связи с применением Подрядчиком упрощённой системы налогообложения.",
          "evidence": [
            {
              "clause_ref": "п. 4.1",
              "quote": "Цена договора составляет 500 000 рублей, НДС не облагается в связи с применением Подрядчиком упрощённой системы налогообложения."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Цена договора определяется сторонами в приложении."

        Ответ:
        {
          "vat_treatment": "not_defined",
          "vat_treatment_display": "Режим НДС в предоставленном контексте не установлен.",
          "tax_regime_reference": "not_defined",
          "tax_regime_reference_display": "Налоговый статус стороны в предоставленном контексте не установлен.",
          "tax_clause_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о НДС.
        2. Найди прямую цитату о налоговом режиме или статусе стороны.
        3. Найди прямую цитату с налоговой оговоркой.
        4. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "vat_treatment": "<included_in_price / excluded_from_price / no_vat / not_defined>",
          "vat_treatment_display": "<понятное описание для юриста>",
          "tax_regime_reference": "<usn / self_employed / general / not_defined>",
          "tax_regime_reference_display": "<понятное описание для юриста>",
          "tax_clause_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 520

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "НДС в том числе НДС без НДС налог на профессиональный доход самозанятый УСН не является плательщиком НДС"
      retrieval_profile: "tax_check"
      preferred_unit_types:
        - payment_term
        - general_provision
        - obligation
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
      negative_keywords:
        - "гарантия"
        - "неустойка"
        - "форс-мажор"
        - "подсудность"
        - "субподряд"
        - "приёмка"
      position_bias:
        preferred_range: [0.15, 0.70]
        boost: 0.18
        scope: segment
      context_k: 5
      max_chunks: 6
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
