          display_priority: 2

        - name: "customer_type"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["legal_entity", "individual", "ip", "self_employed", "not_defined"]
          description: "Тип Заказчика."
          required: true
          display_in_grid: false

        - name: "customer_signatory"
          type: "string"
          presentation: "fact"
          label: "Подписант Заказчика"
          description: "Лицо, подписывающее договор от имени Заказчика."
          required: true
          display_in_grid: false

        - name: "customer_signatory_basis"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["charter", "poa", "order", "personal", "other", "not_defined"]
          description: "Основание полномочий подписанта Заказчика."
          required: true
          display_in_grid: false

        - name: "corporate_approval_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
