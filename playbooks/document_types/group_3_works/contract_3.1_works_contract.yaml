          "customer_payment_delay_penalty_present": "yes",
          "customer_payment_delay_penalty_present_display": "Санкция за просрочку оплаты заказчиком предусмотрена.",
          "customer_payment_delay_penalty_basis": "percent_per_day",
          "customer_payment_delay_penalty_basis_display": "Процент за каждый день просрочки.",
          "customer_payment_delay_penalty_rate": "0,1% от суммы просроченного платежа за каждый день просрочки.",
          "evidence": [
            {
              "clause_ref": "п. 5.4",
              "quote": "За нарушение срока оплаты Заказчик уплачивает Подрядчику пеню в размере 0,1% от суммы просроченного платежа за каждый день просрочки."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Оплата производится в сроки, предусмотренные договором."

        Ответ:
