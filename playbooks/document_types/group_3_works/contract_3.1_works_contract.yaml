        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все signal-поля = "not_defined", все *_display = соответствующий fallback, hse_responsibility_allocation = "Данные не определены".
        - Используй только текст договора. Не подставляй нормы трудового законодательства вместо текста договора.
        - Не определяй обязанности по ОТиТБ на основании императивных норм закона — только по прямому тексту договора.
        - Если в разных фрагментах указаны противоречивые условия — presence = "unclear", соответствующие поля = "not_defined".
        - Не используй "None", "null" или пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни ОТиТБ, ни штрафов за нарушение безопасности,
           ни распределения ответственности.
           → presence = "missing";
             все signal-поля = "not_defined";
             все *_display = соответствующий fallback;
             hse_responsibility_allocation = "Данные не определены".

        2. Только обязанности без штрафов.
           "Подрядчик обязан соблюдать требования охраны труда и техники
           безопасности на объекте" без указания штрафов.
           → presence = "present";
             hse_compliance_required = "yes";
             hse_penalty_present = "not_defined";
             hse_responsibility_allocation = "Данные не определены".

        3. Противоречие в ответственности.
           В одном пункте "ответственность за безопасность несёт Подрядчик",
           в другом — "Заказчик контролирует соблюдение ОТиТБ на объекте".
           → presence = "unclear";
             hse_compliance_required = "not_defined";
             hse_responsibility_allocation = "Не удалось определить".

        4. Полное регулирование.
           Обязанности + штрафы + распределение ответственности.
           → presence = "present";
             hse_compliance_required = "yes";
             hse_penalty_present = "yes";
             hse_responsibility_allocation отражает формулировку.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для hse_compliance_obligations_presence используй только: "present", "missing", "unclear".
        - Для hse_compliance_required используй только: "yes", "no", "not_defined".
        - Для hse_penalty_present используй только: "yes", "no", "not_defined".
        - Fallback при отсутствии данных:
          * hse_compliance_required_display → "Обязанности по соблюдению ОТиТБ в предоставленном контексте не установлены.";
          * hse_penalty_present_display → "Штрафы за нарушение ОТиТБ в предоставленном контексте не установлены.";
          * hse_responsibility_allocation → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_display → "Не удалось определить";
          * hse_responsibility_allocation → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "hse_compliance_obligations_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования ОТиТБ. Внутреннее агрегатное signal-поле."
          required: true

        - name: "hse_compliance_required"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Предусмотрены ли обязанности по соблюдению ОТиТБ."
          required: true
          display_in_grid: false

        - name: "hse_compliance_required_display"
          type: "string"
          presentation: "fact"
          label: "Обязанности по ОТиТБ"
          description: "Понятное для юриста описание наличия обязанностей по соблюдению ОТиТБ."
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "hse_penalty_present"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Предусмотрены ли штрафы за нарушение ОТиТБ."
          required: true
          display_in_grid: false

        - name: "hse_penalty_present_display"
          type: "string"
          presentation: "fact"
          label: "Штрафы за нарушение ОТиТБ"
          description: "Понятное для юриста описание наличия штрафов за нарушение ОТиТБ."
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "hse_responsibility_allocation"
          type: "string"
          presentation: "fact"
          label: "Распределение ответственности"
          description: "Формулировка о распределении ответственности за безопасность."
          required: true
          display_in_grid: true
          display_priority: 3

      store_payload: true

  - id: contractor_liability_for_damage_check
    name: "Ответственность подрядчика за повреждение имущества заказчика и третьих лиц"
    description: >
      Фактографическая проверка того, предусмотрена ли в договоре
      ответственность подрядчика за повреждение имущества заказчика
      или третьих лиц в процессе выполнения работ, каков объём
      такой ответственности и требуется ли страхование гражданской
      ответственности подрядчика (ст. 1064, 1068 ГК РФ).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "повреждение имущества"
        - "ущерб имуществу"
        - "сохранность имущества"
        - "ответственность за ущерб"
        - "возмещение ущерба"
        - "страхование гражданской ответственности"
        - "страхование ответственности подрядчика"
        - "имуществу заказчика"
        - "третьих лиц"
        - "в процессе выполнения работ"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)поврежден[а-я]*\\s+имуществ"
        - "(?i)ущерб.*имуществ"
        - "(?i)сохранност[а-я]*\\s+имуществ"
        - "(?i)страховани[ея]*\\s+(?:гражданской\\s+)?ответственност"
        - "(?i)возмещ(ение|ает).*ущерб"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор подряда в части ответственности подрядчика
        за повреждение имущества заказчика или третьих лиц в процессе
        выполнения работ.

        Нормативный ориентир:
        - ст. 1064 ГК РФ — общие основания ответственности за причинение вреда.
        - ст. 1068 ГК РФ — ответственность юридического лица или ИП за вред,
          причинённый его работником.
        - ст. 714 ГК РФ — ответственность подрядчика за несохранность
          предоставленного заказчиком имущества.

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Предусмотрена ли ответственность подрядчика за повреждение
           имущества заказчика или третьих лиц.
        2. Каков объём ответственности (только имущество заказчика,
           только третьи лица, оба).
        3. Требуется ли страхование гражданской ответственности подрядчика.
        4. Как сформулирована оговорка об ответственности за ущерб.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined".
        4. Если текстового значения нет — возвращай "Данные не определены".
        5. Не используй "None", "null", "not_defined" или пустые строки.
        6. damage_liability_present = "yes" только если договор прямо
           устанавливает ответственность подрядчика за повреждение имущества.
        7. damage_liability_scope заполняй только по прямому тексту договора.
        8. damage_insurance_required = "yes" только если договор прямо
           требует страхования гражданской ответственности подрядчика.
        9. damage_liability_details заполняй только по прямой формулировке
           договора.
        10. В evidence включай только текст договора.
        11. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — данные определены:
        Фрагмент:
        "Подрядчик несёт полную ответственность за сохранность имущества
        Заказчика, находящегося на объекте, и за ущерб, причинённый
        имуществу Заказчика или третьих лиц в процессе выполнения работ.
        Подрядчик обязан застраховать свою гражданскую ответственность
        на сумму не менее 10 000 000 рублей до начала выполнения работ."

        Ответ:
        {
          "damage_liability_present": "yes",
          "damage_liability_present_display": "Ответственность подрядчика за повреждение имущества предусмотрена.",
          "damage_liability_scope": "Имущество Заказчика и третьих лиц.",
          "damage_insurance_required": "yes",
          "damage_insurance_required_display": "Страхование гражданской ответственности подрядчика требуется.",
          "damage_liability_details": "Подрядчик несёт полную ответственность за сохранность имущества Заказчика и за ущерб имуществу Заказчика или третьих лиц. Обязан застраховать гражданскую ответственность на сумму не менее 10 000 000 рублей.",
          "evidence": [
            {
              "clause_ref": "п. 7.8",
              "quote": "Подрядчик несёт полную ответственность за сохранность имущества Заказчика, находящегося на объекте, и за ущерб, причинённый имуществу Заказчика или третьих лиц в процессе выполнения работ. Подрядчик обязан застраховать свою гражданскую ответственность на сумму не менее 10 000 000 рублей до начала выполнения работ."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Подрядчик выполняет работы в соответствии с проектной документацией."

        Ответ:
        {
          "damage_liability_present": "not_defined",
          "damage_liability_present_display": "Ответственность подрядчика за повреждение имущества в предоставленном контексте не установлена.",
          "damage_liability_scope": "Данные не определены",
          "damage_insurance_required": "not_defined",
          "damage_insurance_required_display": "Страхование гражданской ответственности в предоставленном контексте не установлено.",
          "damage_liability_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату об ответственности за повреждение имущества.
        2. Найди прямую цитату об объёме ответственности (заказчик / третьи лица).
        3. Найди прямую цитату о страховании гражданской ответственности.
        4. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "damage_liability_present": "<yes / no / not_defined>",
          "damage_liability_present_display": "<понятное описание для юриста>",
          "damage_liability_scope": "<текст или 'Данные не определены'>",
          "damage_insurance_required": "<yes / no / not_defined>",
          "damage_insurance_required_display": "<понятное описание для юриста>",
          "damage_liability_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 560

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "повреждение имущества ущерб имуществу сохранность имущества ответственность за ущерб возмещение ущерба страхование гражданской ответственности страхование ответственности подрядчика имуществу заказчика третьих лиц в процессе выполнения работ"
      retrieval_profile: "liability_cap_check"
      preferred_unit_types:
        - obligation
        - liability_provision
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - limitations
        - remedies
      negative_keywords:
        - "цена"
        - "аванс"
        - "НДС"
        - "гарантия качества"
        - "гарантийный срок"
        - "подсудность"
        - "конфиденциальность"
        - "охрана труда"
        - "техника безопасности"
      position_bias:
        preferred_range: [0.25, 0.85]
        boost: 0.18
        scope: segment
      context_k: 5
      max_chunks: 6
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "limitations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      presence_signal:
        field: "contractor_liability_for_damage_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_max_tokens: 500

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора подряда условия
        об ответственности подрядчика за повреждение имущества заказчика
        и третьих лиц в процессе выполнения работ.
        Не анализируй охрану труда, технику безопасности, гарантийные
        обязательства по качеству результата, цену, сроки или налоги.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. contractor_liability_for_damage_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (damage_liability_present, damage_insurance_required)
             ≠ "not_defined";
           - "missing" — если оба содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - damage_liability_present = "not_defined";
           - damage_insurance_required = "not_defined";
           - damage_liability_present_display = "Ответственность подрядчика за повреждение имущества в предоставленном контексте не установлена.";
           - damage_liability_scope = "Данные не определены";
           - damage_insurance_required_display = "Страхование гражданской ответственности в предоставленном контексте не установлено.";
           - damage_liability_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. damage_liability_present:
           - "yes" — если договор прямо устанавливает ответственность
             подрядчика за повреждение имущества заказчика или третьих лиц;
           - "no" — если договор прямо исключает такую ответственность;
           - "not_defined" — если по тексту это не установлено.

        2. damage_liability_present_display:
           - если "yes": "Ответственность подрядчика за повреждение имущества предусмотрена.";
           - если "no": "Ответственность подрядчика за повреждение имущества прямо исключена.";
           - если "not_defined": "Ответственность подрядчика за повреждение имущества в предоставленном контексте не установлена."

        3. damage_liability_scope:
           Объём ответственности по прямому тексту договора:
           - "Имущество Заказчика." — если ответственность только за
             имущество заказчика;
           - "Имущество третьих лиц." — если только за третьих лиц;
           - "Имущество Заказчика и третьих лиц." — если за оба;
           - иная формулировка из текста.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        4. damage_insurance_required:
           - "yes" — если договор прямо требует страхования гражданской
             ответственности подрядчика;
           - "no" — если договор прямо исключает такое требование;
           - "not_defined" — если по тексту это не установлено.

        5. damage_insurance_required_display:
           - если "yes": "Страхование гражданской ответственности подрядчика требуется.";
           - если "no": "Страхование гражданской ответственности прямо не требуется.";
           - если "not_defined": "Страхование гражданской ответственности в предоставленном контексте не установлено."

        6. damage_liability_details:
            Формулировка об ответственности за повреждение имущества
            по прямому тексту договора.
            Если данных нет — "Данные не определены".
            Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни contractor_liability_for_damage_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все signal-поля = "not_defined", все fact-поля = "Данные не определены".
        - Используй только текст договора. Не подставляй нормы ст. 1064, 1068 ГК вместо текста договора.
        - Не определяй ответственность за повреждение имущества на основании императивных норм закона — только по прямому тексту договора.
        - Не путай ответственность за повреждение имущества с:
          * охраной труда и техникой безопасности (hse_compliance_obligations);
          * рисками случайной гибели результата работ (risk_allocation_before_acceptance);
          * гарантийными обязательствами по качеству результата (warranty_period_and_defect_procedure).
        - Если в разных фрагментах указаны противоречивые условия — presence = "unclear", соответствующие поля = "not_defined".
        - Не используй "None", "null" или пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни ответственности за повреждение имущества,
           ни страхования гражданской ответственности.
           → presence = "missing";
             все signal-поля = "not_defined";
             все fact-поля = "Данные не определены".

        2. Только ответственность без страхования.
           "Подрядчик несёт ответственность за ущерб, причинённый
           имуществу Заказчика в процессе выполнения работ" без
           требования страхования.
           → presence = "present";
             damage_liability_present = "yes";
             damage_liability_scope = "Имущество Заказчика.";
             damage_insurance_required = "not_defined".

        3. Противоречие в объёме ответственности.
           В одном пункте "Подрядчик отвечает за ущерб имуществу
           Заказчика", в другом — "Подрядчик не несёт ответственности
           за повреждение имущества, находящегося на объекте".
           → presence = "unclear";
             damage_liability_present = "not_defined";
             damage_liability_details = "Не удалось определить".

        4. Страхование без конкретной ответственности.
           "Подрядчик обязан застраховать свою гражданскую
           ответственность на период выполнения работ" без
           конкретизации объёма ответственности.
           → presence = "present";
             damage_liability_present = "not_defined";
             damage_insurance_required = "yes";
             damage_liability_scope = "Данные не определены".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для contractor_liability_for_damage_check_presence используй только: "present", "missing", "unclear".
        - Для damage_liability_present используй только: "yes", "no", "not_defined".
        - Для damage_insurance_required используй только: "yes", "no", "not_defined".
        - Fallback при отсутствии данных:
          * damage_liability_present_display → "Ответственность подрядчика за повреждение имущества в предоставленном контексте не установлена.";
          * damage_liability_scope → "Данные не определены";
          * damage_insurance_required_display → "Страхование гражданской ответственности в предоставленном контексте не установлено.";
          * damage_liability_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_display → "Не удалось определить";
          * damage_liability_scope → "Не удалось определить";
          * damage_liability_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "contractor_liability_for_damage_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования ответственности за повреждение имущества. Внутреннее агрегатное signal-поле."
          required: true

        - name: "damage_liability_present"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Предусмотрена ли ответственность подрядчика за повреждение имущества."
          required: true
          display_in_grid: false

        - name: "damage_liability_present_display"
          type: "string"
          presentation: "fact"
          label: "Ответственность за ущерб"
          description: "Понятное для юриста описание наличия ответственности подрядчика за повреждение имущества."
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "damage_liability_scope"
          type: "string"
          presentation: "fact"
          label: "Объём ответственности"
          description: "Объём ответственности: имущество заказчика, третьих лиц или оба."
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "damage_insurance_required"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Требуется ли страхование гражданской ответственности подрядчика."
          required: true
          display_in_grid: false

        - name: "damage_insurance_required_display"
          type: "string"
          presentation: "fact"
          label: "Страхование ответственности"
          description: "Понятное для юриста описание наличия требования о страховании гражданской ответственности."
          required: true
          display_in_grid: true
          display_priority: 3

        - name: "damage_liability_details"
          type: "string"
          presentation: "fact"
          label: "Формулировка ответственности"
          description: "Формулировка об ответственности за повреждение имущества."
          required: true
          display_in_grid: true
          display_priority: 4

      store_payload: true

# ════════════════════════════════════════════════════════════════════════════
# БЛОК 5: DD_REQUEST_TEMPLATES
# Читается: DDRequestTemplateLoader
# ════════════════════════════════════════════════════════════════════════════

dd_request_templates:

  parties_identification:
    text: >
      Просим подтвердить полные реквизиты сторон по {doc_names}: наименование/ФИО,
      ИНН, ОГРН/ОГРНИП, адрес регистрации, документы, подтверждающие полномочия
      подписантов (устав, доверенность, приказ).
    addressee: "Обе стороны"

  subject_work_required:
    text: >
      В {doc_names} отсутствует или недостаточно конкретно описан предмет договора.
      Просим предоставить: (а) детальное описание содержания работ; (б) описание
      конкретного овеществлённого результата; (в) техническое задание или спецификацию
      как неотъемлемое приложение к договору.
    addressee: "Заказчик / Подрядчик"

  start_and_end_dates_required:
    text: >
      В {doc_names} не определены начальный и/или конечный сроки выполнения работ
      (ст. 708 ГК РФ). Просим уточнить: (а) дату начала работ; (б) дату завершения
      (конечный срок); (в) промежуточные этапы и их сроки (если применимо).
    addressee: "Обе стороны"

  price_or_estimation_method:
    text: >
      Просим уточнить в {doc_names}: (а) итоговую цену работ цифрами и прописью;
      (б) является ли цена твёрдой или приблизительной; (в) включает ли НДС;
      (г) порядок согласования и оплаты дополнительных работ.
    addressee: "Обе стороны"

  acceptance_procedure:
    text: >
      Просим уточнить в {doc_names} порядок сдачи-приёмки работ: (а) форму акта
      выполненных работ; (б) сроки приёмки после уведомления подрядчика; (в) основания
      для мотивированного отказа; (г) порядок устранения выявленных недостатков.
    addressee: "Обе стороны"

  unilateral_acceptance_mechanism:
    text: >
      Просим добавить в {doc_names} условие об автоматической (односторонней) приёмке:
      если заказчик не направил мотивированный отказ в течение [N] рабочих дней
      после уведомления о готовности — работы считаются принятыми. Основание: ст. 720 ГК РФ.
    addressee: "Юридический советник заказчика"

  suspension_notification_right:
    text: >
      Просим включить в {doc_names} условие о праве подрядчика приостановить работы
      и обязанности немедленно уведомить заказчика при: непригодности материалов,
      неверных указаниях, неоплате аванса. Без уведомления подрядчик теряет право
      ссылаться на эти обстоятельства (ст. 716, 719 ГК РФ).
    addressee: "Юридический советник подрядчика"

  retention_right_before_payment:
    text: >
      Просим включить в {doc_names} право удержания результата работ до полной
      оплаты (ст. 712, 359 ГК РФ): подрядчик не передаёт результат до исполнения
      заказчиком обязательства по оплате.
    addressee: "Юридический советник подрядчика"

  payment_terms_and_schedule:
    text: >
      Просим уточнить в {doc_names}: (а) размер и срок выплаты аванса; (б) момент
      возникновения обязанности по окончательному расчёту (подписание акта);
      (в) конкретный срок оплаты в банковских/рабочих днях; (г) банковские реквизиты
      подрядчика.
    addressee: "Заказчик / Бухгалтерия"

  penalty_for_delay_contractor:
    text: >
      Просим добавить в {doc_names} неустойку за просрочку выполнения работ подрядчиком:
      пеня в размере [X]% от цены договора (или невыполненного этапа) за каждый
      календарный день просрочки (ст. 330, 708 ГК РФ).
    addressee: "Юридический советник заказчика"

  penalty_for_payment_delay_customer:
    text: >
      Просим добавить в {doc_names} неустойку за просрочку оплаты заказчиком:
      пеня в размере [X]% от неоплаченной суммы за каждый день просрочки, но не менее
      ставки ст. 395 ГК РФ.
    addressee: "Юридический советник подрядчика"

  warranty_period_and_defect_procedure:
    text: >
      Просим уточнить в {doc_names}: (а) продолжительность гарантийного срока;
      (б) порядок и срок направления претензии по качеству; (в) срок устранения
      недостатков подрядчиком; (г) последствия неустранения (замена, уменьшение
      цены, возмещение расходов на устранение).
    addressee: "Обе стороны"

  risk_allocation_before_acceptance:
    text: >
      Просим уточнить в {doc_names} распределение рисков случайной гибели/повреждения
      результата и материалов до приёмки (ст. 705 ГК РФ). Особо важно при использовании
      давальческих материалов заказчика.
    addressee: "Юридический советник"

  customer_materials_regime_check:
    text: >
      В {doc_names} предусмотрены давальческие материалы заказчика. Просим уточнить:
      (а) норму расхода материалов; (б) обязанность подрядчика вести и предоставлять
      отчёт об использовании; (в) порядок возврата остатков; (г) ответственность
      за сохранность (ст. 713, 714 ГК РФ).
    addressee: "Заказчик / Подрядчик"

  subcontracting_conditions:
    text: >
      Просим уточнить в {doc_names}: (а) вправе ли подрядчик привлекать субподрядчиков;
      (б) требуется ли письменное согласие заказчика; (в) порядок ответственности
      подрядчика за действия субподрядчиков (ст. 706 ГК РФ).
    addressee: "Обе стороны"

  contractor_performance_personally:
    text: >
      В {doc_names} подрядчик — физическое лицо. Просим закрепить обязанность
      личного выполнения работ без передачи третьим лицам (ст. 706 ГК РФ) во избежание
      риска привлечения ненадёжных исполнителей.
    addressee: "Юридический советник заказчика"

  customer_unilateral_refusal_check:
    text: >
      Просим подтвердить, что в {doc_names} сохраняется право заказчика на односторонний
      отказ от договора до сдачи результата с оплатой фактически выполненного
      (ст. 717 ГК РФ). Если введены штрафные санкции за отказ — просим дать правовое
      обоснование их соответствия ст. 422 ГК РФ.
    addressee: "Юридический советник"

  intermediate_inspection_right:
    text: >
      Просим закрепить в {doc_names} право заказчика контролировать ход и качество работ
      в любое время без вмешательства в деятельность подрядчика (ст. 715 ГК РФ),
      а также порядок фиксации замечаний.
    addressee: "Юридический советник заказчика"

  hidden_works_documentation:
    text: >
      Просим предусмотреть в {doc_names} порядок освидетельствования и актирования
      скрытых работ до их закрытия. Предоставьте: (а) перечень работ, подлежащих
      промежуточной приёмке; (б) форму акта на скрытые работы; (в) последствия
      закрытия работ без актирования.
    addressee: "Обе стороны"

  termination_grounds_and_consequences:
    text: >
      Просим уточнить в {doc_names}: (а) основания расторжения для каждой стороны;
      (б) порядок уведомления; (в) условия возврата аванса и оплаты фактически
      выполненного; (г) сроки взаиморасчётов (ст. 453, 715, 717 ГК РФ).
    addressee: "Юридический советник"

  dispute_resolution_clause:
    text: >
      Просим уточнить в {doc_names}: (а) срок рассмотрения претензии (рекомендуется
      30 календарных дней); (б) подсудность; (в) возможность применения медиации
      или иных альтернативных способов. Претензионный порядок обязателен для
      АПК РФ (ст. 4).
    addressee: "Юридический советник"

  intellectual_property_ownership:
    text: >
      Просим уточнить в {doc_names}: кому принадлежат исключительные права
      на результат работ, содержащий объекты интеллектуальной собственности
      (проект, ПО, дизайн, чертёж). По умолчанию — подрядчику (ст. 1296 ГК РФ).
      Для передачи прав заказчику необходимо явное условие об отчуждении.
    addressee: "Юридический советник"

  vat_and_tax_allocation:
    text: >
      Просим уточнить в {doc_names}: (а) включает ли цена НДС; (б) применяет ли
      подрядчик УСН или является самозанятым (ФЗ-422); (в) кто несёт налоговые
      последствия, если статус подрядчика изменится в ходе договора.
    addressee: "Налоговый консультант / Бухгалтерия"

  force_majeure_clause:
    text: >
      Просим уточнить в {doc_names}: (а) перечень форс-мажорных обстоятельств;
      (б) срок уведомления контрагента; (в) максимальный период приостановки
      обязательств; (г) право расторжения при длительном форс-мажоре (ст. 401 ГК РФ).
    addressee: "Юридический советник"

  confidentiality_clause:
    text: >
      Просим добавить в {doc_names} условие о конфиденциальности: перечень
      конфиденциальных сведений, срок неразглашения после окончания договора,
      исключения, ответственность за нарушение.
    addressee: "Юридический советник"

  labor_requalification_risk:
    text: >
      Внимание: в {doc_names} выявлены признаки, указывающие на возможную
      переквалификацию договора в трудовой (ст. 19.1 ТК РФ). Просим:
      (а) исключить из договора указание на режим работы, рабочее место у заказчика,
      регулярность оплаты вне зависимости от результата; (б) закрепить самостоятельное
      определение подрядчиком способов и условий выполнения; (в) получить правовое
      заключение по ст. 15, 19.1 ТК РФ.
    addressee: "Юридический советник / HR"

  unlicensed_work_prohibition:
    text: >
      Просим подтвердить по {doc_names}: (а) наличие у подрядчика лицензии или
      допуска СРО (при необходимости); (б) предоставить копию лицензии/свидетельства;
      (в) подтвердить, что выполняемые работы не относятся к лицензируемым видам
      деятельности (ФЗ-99, ст. 55.8 ГрК РФ).
    addressee: "Подрядчик / Юридический советник"

  subject_and_result_extraction:
    text: >
      Просим подтвердить по {doc_names}: (а) описание содержания работ;
      (б) конкретный овеществлённый результат (ст. 702, 703 ГК РФ);
      (в) наличие ТЗ/спецификации как приложения; (г) конкретность описания
      (достаточна ли для однозначной приёмки).
    addressee: "Обе стороны"

  deadlines_extraction:
    text: >
      Просим подтвердить по {doc_names}: (а) начальный и конечный сроки (ст. 708 ГК РФ);
      (б) промежуточные этапы (если применимо); (в) порядок продления при задержке
      со стороны заказчика.
    addressee: "Обе стороны"

  price_and_estimate_analysis:
    text: >
      Просим подтвердить по {doc_names}: (а) тип цены — твёрдая или приблизительная
      (ст. 709 ГК РФ); (б) сумму; (в) порядок согласования изменений; (г) при
      приблизительной смете — обязанность уведомления о превышении > 10% (ст. 709 п. 5).
    addressee: "Обе стороны"

  quality_standards_and_conformity_check:
    text: >
      Просим уточнить в {doc_names}: (а) какие стандарты качества применяются
      (ГОСТ, ТУ, ТЗ, образец); (б) критерии приёмки результата; (в) метод
      оценки соответствия (испытания, осмотр, экспертиза); (г) последствия
      несоответствия (ст. 721, 723 ГК РФ).
    addressee: "Обе стороны"

  customer_cooperation_obligations:
    text: >
      Просим включить в {doc_names}: конкретные обязанности заказчика по содействию
      (ст. 718 ГК РФ): предоставление доступа, информации, документов, назначение
      контактного лица, сроки исполнения, последствия нарушения (продление сроков,
      право на приостановку по ст. 719 ГК РФ).
    addressee: "Юридический советник заказчика"

  governing_law:
    text: >
      Просим подтвердить в {doc_names} применимое право (законодательство РФ),
      подсудность, язык договора.
    addressee: "Юридический советник"

  anticorruption_clause:
    text: >
      Просим включить в {doc_names} антикоррупционную оговорку (ФЗ-273):
      заверения сторон, порядок уведомления, последствия нарушения.
    addressee: "Юридический советник"

  approximate_estimate_exceeded_without_notice:
    text: >
      В {doc_names} предусмотрена приблизительная смета. Просим включить:
      (а) обязанность подрядчика немедленно уведомить заказчика при необходимости
      превышения сметы более чем на 10% (ст. 709 п. 5 ГК РФ); (б) право заказчика
      отказаться от договора при неуведомлении; (в) порядок оформления
      дополнительных расходов.
    addressee: "Юридический советник"

  assignment_restriction:
    text: >
      Просим уточнить в {doc_names}: допустимость уступки прав / перевода долга,
      требуется ли согласие другой стороны. Особенно важно: запрет на уступку
      подрядчиком права на оплату без согласия заказчика.
    addressee: "Юридический советник"
    
   # Generic fallback
  _default:
    text: >
      Просим предоставить дополнительную информацию по вопросу «{check_name}»
      применительно к {doc_names}.
    addressee: "Юридический советник"
    
