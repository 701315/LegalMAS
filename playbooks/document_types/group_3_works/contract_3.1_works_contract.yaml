          required: true
          display_in_grid: true
          display_priority: 3
        - name: "rights_clause_details"
          type: "string"
          presentation: "fact"
          label: "Формулировка о правах"
          description: "Формулировка о принадлежности или передаче прав."
          required: true
          display_in_grid: true
          display_priority: 4
      store_payload: true

