      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора подряда условия
        о праве заказчика на односторонний отказ, наличии штрафа и его размере.
        Не анализируй общие основания расторжения, если они не относятся прямо
        к праву заказчика на отказ по ст. 717 ГК РФ.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. refusal_right_status — "preserved" / "restricted" / "excluded" /
          "not_mentioned" / "not_defined".
        2. refusal_right_status_display — понятное описание для юриста.
        3. penalty_for_refusal — "yes" / "no" / "not_defined".
        4. penalty_for_refusal_display — понятное описание для юриста.
        5. penalty_amount_status — "defined" если размер штрафа или неустойки
          прямо указан, иначе "not_defined".
        6. penalty_amount_value — сумма, процент или иная формулировка размера
          санкции.

        Если данные отсутствуют:
        - статус = "not_defined"
        - текст = "Данные не определены"
        </task>

        <context_rules>
        - Используй только текст договора.
        - refusal_right_status:
        - "preserved" — если право заказчика на отказ прямо сохранено без
        штрафных ограничений, кроме оплаты фактически выполненного.
        - "restricted" — если право есть, но сопровождается штрафом,
        неустойкой или дополнительными ограничениями.
        - "excluded" — если договор прямо запрещает такой отказ или
        фактически его исключает.
        - "not_mentioned" — если в договоре есть раздел о расторжении,
        но право заказчика на такой отказ прямо не урегулировано.
        - "not_defined" — если по тексту это нельзя установить.
        - refusal_right_status_display:
        - если refusal_right_status = "preserved":
        "Право заказчика на односторонний отказ сохранено."
        - если refusal_right_status = "restricted":
        "Право заказчика на односторонний отказ ограничено штрафом или санкцией."
        - если refusal_right_status = "excluded":
        "Право заказчика на односторонний отказ исключено."
        - если refusal_right_status = "not_mentioned":
        "Право заказчика на односторонний отказ прямо не урегулировано."
        - если refusal_right_status = "not_defined":
        "Статус права заказчика на односторонний отказ в предоставленном контексте не установлен."
        - penalty_for_refusal:
        - "yes" — если штраф, неустойка или иная санкция за отказ
        прямо установлены.
        - "no" — если прямо указано, что штрафа нет, либо право
        реализуется только с оплатой фактически выполненного без
        отдельной санкции.
        - "not_defined" — если это прямо не установлено.
        - penalty_for_refusal_display:
        - если penalty_for_refusal = "yes":
        "Штраф за односторонний отказ предусмотрен."
        - если penalty_for_refusal = "no":
        "Штраф за односторонний отказ не предусмотрен."
        - если penalty_for_refusal = "not_defined":
        "Условия о штрафе за односторонний отказ не установлены."
        - penalty_amount_status:
        - "defined" — если размер штрафа или неустойки прямо указан.
        - "not_defined" — если размер прямо не указан.
        - penalty_amount_value:
        - извлеки сумму, процент или иную формулировку размера санкции.
        - если размер не указан, верни: "Данные не определены".
        </context_rules>

        <output_expectations>
        - Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        </output_expectations>

        <output_format>
        {
          "refusal_right_status": "preserved | restricted | excluded | not_mentioned | not_defined",
          "refusal_right_status_display": "string",
          "penalty_for_refusal": "yes | no | not_defined",
          "penalty_for_refusal_display": "string",
          "penalty_amount_status": "defined | not_defined",
          "penalty_amount_value": "string"
        }
        </output_format>

      fields:
        - name: "refusal_right_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["preserved", "restricted", "excluded", "not_mentioned", "not_defined"]
          description: "Статус права заказчика на односторонний отказ."
          required: true
          display_in_grid: false

        - name: "refusal_right_status_display"
          type: "string"
          presentation: "fact"
          label: "Право на отказ"
          description: "Понятное для юриста описание статуса права заказчика на односторонний отказ."
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "penalty_for_refusal"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Наличие штрафа или неустойки за отказ."
          required: true
          display_in_grid: false

        - name: "penalty_for_refusal_display"
          type: "string"
          presentation: "fact"
          label: "Штраф за отказ"
          description: "Понятное для юриста описание наличия штрафа за односторонний отказ."
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "penalty_amount_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания размера штрафа за отказ."
          required: true
          display_in_grid: false

        - name: "penalty_amount_value"
          type: "string"
          presentation: "fact"
          label: "Размер штрафа"
          description: "Размер штрафа или неустойки за односторонний отказ."
          required: true
          display_in_grid: true
          display_priority: 3

      store_payload: true

  - id: quality_standards_and_conformity_check
