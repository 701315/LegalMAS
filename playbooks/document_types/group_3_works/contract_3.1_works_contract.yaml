          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о праве приостановить работы.
        2. Найди прямую цитату об обязанности уведомить заказчика.
        3. Найди прямую цитату об основаниях для приостановки.
        4. Если прямой цитаты нет — верни "not_defined".

