    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "качество работ требования к качеству стандарт качества ГОСТ ТУ технические условия соответствие образцу критерии приемки"
      retrieval_profile: "warranties_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
      negative_keywords:
