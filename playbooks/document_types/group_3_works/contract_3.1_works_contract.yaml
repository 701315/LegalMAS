  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 21: Расторжение и взаиморасчёты
  # ──────────────────────────────────────────────────────────────────────────
  - id: termination_grounds_and_consequences
    name: "Расторжение: основания, последствия, взаиморасчёты (ст. 453, 715, 717 ГК РФ)"
    description: >
      Фактографическая проверка того, определены ли в договоре основания
      расторжения, последствия расторжения и порядок взаиморасчётов
      между сторонами.
    triggers: ~
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "расторжение договора"
        - "отказ от исполнения"
        - "возврат аванса"
        - "оплата фактически выполненного"
        - "взаиморасчёты"
        - "последствия расторжения"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)расторж(ение|ении)\\s+договора"
        - "(?i)возврат.*аванс"
        - "(?i)оплат.*фактически\\s+выполненн"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор подряда в части прекращения и расторжения.
        Проверяется только один вопрос: определены ли основания расторжения,
        последствия расторжения и порядок взаиморасчётов.

        Нормативный ориентир:
        - ст. 453 ГК РФ
        - ст. 715 ГК РФ
        - ст. 717 ГК РФ

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Определены ли основания расторжения или отказа от исполнения.
        2. Определены ли последствия расторжения.
        3. Определён ли порядок взаиморасчётов, включая возврат аванса
           или оплату фактически выполненного.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если условие не указано прямо — возвращай "not_defined".
        3. Если текстового значения нет — возвращай "Данные не определены".
        4. Не используй "None", "null", "not_found" или пустые строки.
        5. termination_grounds_defined = "yes" только если основания
           расторжения или отказа прямо описаны.
        6. termination_consequences_defined = "yes" только если последствия
           расторжения прямо описаны.
        7. settlement_on_termination_defined = "yes" только если порядок
           взаиморасчётов прямо описан.
        8. settlement_on_termination заполняй только по прямому тексту договора.
        9. В evidence включай только текст договора.
        10. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — данные определены:
        Фрагмент:
        "Каждая из сторон вправе расторгнуть договор в случае существенного
        нарушения обязательств другой стороной. При расторжении договора
        Заказчик оплачивает фактически выполненные работы, а неосвоенный аванс
        подлежит возврату в течение 10 рабочих дней."

        Ответ:
        {
          "termination_grounds_defined": "yes",
          "termination_consequences_defined": "yes",
          "settlement_on_termination_defined": "yes",
          "settlement_on_termination": "Заказчик оплачивает фактически выполненные работы, а неосвоенный аванс подлежит возврату в течение 10 рабочих дней.",
          "evidence": [
            {
              "clause_ref": "п. 9.2",
              "quote": "Каждая из сторон вправе расторгнуть договор в случае существенного нарушения обязательств другой стороной. При расторжении договора Заказчик оплачивает фактически выполненные работы, а неосвоенный аванс подлежит возврату в течение 10 рабочих дней."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Договор действует до полного исполнения обязательств сторонами."

        Ответ:
        {
          "termination_grounds_defined": "not_defined",
          "termination_consequences_defined": "not_defined",
          "settlement_on_termination_defined": "not_defined",
          "settlement_on_termination": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату об основаниях расторжения.
        2. Найди прямую цитату о последствиях расторжения.
        3. Найди прямую цитату о взаиморасчётах при расторжении.
        4. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "termination_grounds_defined": "<yes / no / not_defined>",
          "termination_consequences_defined": "<yes / no / not_defined>",
          "settlement_on_termination_defined": "<yes / no / not_defined>",
          "settlement_on_termination": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 560

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "расторжение договора отказ от исполнения возврат аванса оплата фактически выполненного взаиморасчеты последствия расторжения"
      retrieval_profile: "termination_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
      negative_keywords:
        - "цена"
        - "НДС"
        - "гарантия"
        - "форс-мажор"
        - "подсудность"
        - "конфиденциальность"
      position_bias:
        preferred_range: [0.50, 1.0]
        boost: 0.18
        scope: segment
      context_k: 5
      max_chunks: 6
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 500

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора подряда условия
        о расторжении и взаиморасчётах между сторонами.
        Не анализируй цену как самостоятельную тему, гарантию, налоги
        или подсудность.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. termination_grounds_defined — "yes" / "no" / "not_defined".
        2. termination_consequences_defined — "yes" / "no" / "not_defined".
        3. settlement_on_termination_defined — "yes" / "no" / "not_defined".
        4. settlement_on_termination — формулировка о взаиморасчётах
           при расторжении.

        Если данные отсутствуют:
        - статус = "not_defined"
        - текст = "Данные не определены"
        </task>

        <rules>
        - Используй только текст договора.
        - termination_grounds_defined:
            - "yes" — если основания расторжения или отказа прямо описаны.
            - "no" — если договор прямо указывает на отсутствие специальных
              оснований.
            - "not_defined" — если по тексту это не установлено.
        - termination_consequences_defined:
            - "yes" — если последствия расторжения прямо описаны.
            - "no" — если договор прямо указывает на отсутствие специальных
              последствий.
            - "not_defined" — если по тексту это не установлено.
        - settlement_on_termination_defined:
            - "yes" — если порядок взаиморасчётов прямо описан.
            - "no" — если договор прямо исключает специальные взаиморасчёты.
            - "not_defined" — если по тексту это не установлено.
        - settlement_on_termination заполняй только по прямой формулировке
          договора.
        - Верни только JSON.
        </rules>
      fields:
        - name: "termination_grounds_defined"
          type: "string"
          presentation: "signal"
          label: "Основания расторжения"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Определены ли основания расторжения или отказа от исполнения."
          required: true
          display_in_grid: true
          display_priority: 1
        - name: "termination_consequences_defined"
          type: "string"
          presentation: "signal"
          label: "Последствия расторжения"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Определены ли последствия расторжения."
          required: true
          display_in_grid: true
          display_priority: 2
        - name: "settlement_on_termination_defined"
          type: "string"
          presentation: "signal"
          label: "Взаиморасчёты"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Определён ли порядок взаиморасчётов при расторжении."
          required: true
          display_in_grid: true
          display_priority: 3
        - name: "settlement_on_termination"
          type: "string"
          presentation: "fact"
          label: "Порядок взаиморасчётов"
          description: "Формулировка о возврате аванса и/или оплате фактически выполненного."
          required: true
          display_in_grid: true
          display_priority: 4
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 22: НДС и налоговые оговорки
  # ──────────────────────────────────────────────────────────────────────────
  - id: vat_and_tax_allocation
    name: "НДС и налоговые оговорки"
    description: >
      Фактографическая проверка того, как в договоре урегулированы НДС
      и специальные налоговые оговорки: включён ли НДС в цену, применяется ли
      УСН или режим самозанятого.
    triggers: ~
    ui_mode: "field_extraction"
    severity: "medium"
    severity_if_pass: "pass"
    severity_if_fail: "medium"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "НДС"
        - "в том числе НДС"
        - "без НДС"
        - "налог на профессиональный доход"
        - "самозанятый"
        - "УСН"
        - "не является плательщиком НДС"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)\\bНДС\\b"
        - "(?i)налог\\s+на\\s+профессиональный\\s+доход"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор подряда в части НДС и налоговых оговорок.
        Проверяется только один вопрос: как в договоре описан режим НДС
        и есть ли указание на специальный налоговый статус стороны.

        Нормативный ориентир:
        - НК РФ
        - ФЗ-422 о налоге на профессиональный доход

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Как урегулирован НДС по цене договора.
        2. Есть ли указание на специальный налоговый режим или статус
           плательщика.
        3. Как именно сформулирована налоговая оговорка.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если условие не указано прямо — возвращай "not_defined".
        3. Если текстового значения нет — возвращай "Данные не определены".
        4. Не используй "None", "null", "not_found" или пустые строки.
        5. vat_treatment = "included_in_price" только если договор прямо
           указывает, что цена включает НДС.
        6. vat_treatment = "excluded_from_price" только если договор прямо
           указывает, что НДС начисляется сверх цены.
        7. vat_treatment = "no_vat" только если договор прямо указывает
           "без НДС" или аналогичную формулировку.
        8. tax_regime_reference определяй только по прямому указанию на УСН,
           НПД/самозанятого или общий режим.
        9. tax_clause_details заполняй только по прямому тексту договора.
        10. В evidence включай только текст договора.
        11. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — данные определены:
        Фрагмент:
        "Цена договора составляет 500 000 рублей, НДС не облагается в связи
        с применением Подрядчиком упрощённой системы налогообложения."

        Ответ:
        {
          "vat_treatment": "no_vat",
          "tax_regime_reference": "usn",
          "tax_clause_details": "НДС не облагается в связи с применением Подрядчиком упрощённой системы налогообложения.",
          "evidence": [
            {
              "clause_ref": "п. 4.1",
              "quote": "Цена договора составляет 500 000 рублей, НДС не облагается в связи с применением Подрядчиком упрощённой системы налогообложения."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Цена договора определяется сторонами в приложении."

        Ответ:
        {
          "vat_treatment": "not_defined",
          "tax_regime_reference": "not_defined",
          "tax_clause_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о НДС.
        2. Найди прямую цитату о налоговом режиме или статусе стороны.
        3. Найди прямую цитату с налоговой оговоркой.
        4. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "vat_treatment": "<included_in_price / excluded_from_price / no_vat / not_defined>",
          "tax_regime_reference": "<usn / self_employed / general / not_defined>",
          "tax_clause_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 520

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "НДС в том числе НДС без НДС налог на профессиональный доход самозанятый УСН не является плательщиком НДС"
      retrieval_profile: "tax_check"
      preferred_unit_types:
        - payment_term
        - general_provision
        - obligation
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - obligations
      negative_keywords:
        - "гарантия"
        - "неустойка"
        - "форс-мажор"
        - "подсудность"
        - "субподряд"
        - "приёмка"
      position_bias:
        preferred_range: [0.15, 0.70]
        boost: 0.18
        scope: segment
      context_k: 5
      max_chunks: 6
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 550

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 400

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора подряда условия
        о НДС и налоговом статусе стороны.
        Не анализируй цену как самостоятельную тему, сроки, гарантию,
        штрафы или подсудность.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. vat_treatment — "included_in_price" / "excluded_from_price" /
           "no_vat" / "not_defined".
        2. tax_regime_reference — "usn" / "self_employed" / "general" /
           "not_defined".
        3. tax_clause_details — формулировка о НДС или налоговом режиме.

        Если данные отсутствуют:
        - статус = "not_defined"
        - текст = "Данные не определены"
        </task>

        <rules>
        - Используй только текст договора.
        - vat_treatment:
            - "included_in_price" — если цена прямо указана как включающая НДС.
            - "excluded_from_price" — если НДС прямо указано начислять сверх цены.
            - "no_vat" — если договор прямо указывает "без НДС", "НДС не облагается"
              или аналогичную формулировку.
            - "not_defined" — если по тексту режим НДС не установлен.
        - tax_regime_reference:
            - "usn" — если прямо указана упрощённая система налогообложения.
            - "self_employed" — если прямо указан самозанятый, НПД или аналогичный статус.
            - "general" — если прямо указан общий налоговый режим или статус плательщика НДС.
            - "not_defined" — если по тексту это не установлено.
        - tax_clause_details заполняй только по прямому тексту договора.
        - Верни только JSON.
        </rules>
      fields:
