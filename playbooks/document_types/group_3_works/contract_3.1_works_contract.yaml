        невозможность исполнения, обязана уведомить другую сторону в течение
        3 рабочих дней. Срок исполнения обязательств продлевается на период
        действия форс-мажора. Если форс-мажор длится более 60 дней,
        каждая из сторон вправе расторгнуть договор."

        Ответ:
