# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 3: SHARED PATTERNS
#  Читается: DocTypeCheckLoader через _resolve_yaml_templates()
# ════════════════════════════════════════════════════════════════════════════

shared_patterns:
  money_amount: "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|тыс|млн|млрд)"
  date_pattern: "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"
  date_period: "(?i)(не\\s+позднее|в\\s+течение)\\s+\\d+\\s*(календарн|рабоч|дн)"
  inn_pattern: "(?i)\\bИНН\\s*:?\\s*\\d{10,12}\\b"
  percent_pattern: "(?i)\\b\\d+([,.]\\d+)?\\s*%\\s*(в\\s+(день|месяц|год))?"

compliance_rules: []

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: CHECKS_V8 — LLM/hybrid проверки
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  - id: subject_and_result_extraction
    name: "Предмет: содержание работ и результат работ (ст. 702, 703 ГК РФ)"
    description: >
      Извлекает описание содержания работ, конкретного результата работ,
      ссылку на ТЗ, спецификацию или иной документ, раскрывающий предмет,
      а также степень определённости результата.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "подрядчик обязуется"
        - "выполнить работы"
        - "результат работ"
        - "сдать результат"
        - "техническое задание"
        - "спецификация"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)подряд(чик)?\\s+обязуется\\s+выполнить"
        - "(?i)результат\\s+работ.*передать\\s+заказчику"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор подряда по §1 Главы 37 ГК РФ.

        Проверяется один вопрос: насколько определён предмет договора через
        содержание работ и результат, который должен быть достигнут подрядчиком,
        а также раскрывается ли предмет через техническое задание, спецификацию
        или иной отдельный документ.

        Нормативный ориентир:
        - ст. 702 ГК РФ
        - ст. 703 ГК РФ
        - ст. 432 ГК РФ

        Важно:
        - Твоя задача — установить только то, что прямо следует из текста договора.
        - Не подставляй содержание условий из норм закона.
        - Не оценивай серьёзность риска.
        - Не делай вывод об отсутствии условия только потому, что оно не попало
          в предоставленный контекст.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]

        Найди в предоставленном контексте:

        1. Описано ли содержание работ, которые обязан выполнить подрядчик.

        2. Указан ли конкретный результат работ.

          Под результатом работ понимается конкретный результат деятельности
          подрядчика, выражающийся, например, в созданной, изготовленной,
          переработанной, отремонтированной, смонтированной или иной изменённой
          вещи, объекте или ином конкретно идентифицируемом результате работ.

          Не признавай конкретным результатом только общее описание процесса
          или действий без возможности установить, что именно должно быть
          создано, изменено, отремонтировано, изготовлено, смонтировано или
          сдано заказчику.

        3. Есть ли прямая ссылка на техническое задание, спецификацию, приложение,
           ведомость работ или иной отдельный документ, который раскрывает
           содержание работ или предмет договора.

        4. Насколько конкретно определён результат работ.

        [ПРАВИЛА]

        1. Используй только текст предоставленного документа и контекста.

        2. Не подставляй нормы закона вместо содержания договора.

        3. Не придумывай отсутствующие условия, документы, приложения,
           характеристики или результаты.

        4. Значение "not_defined" допускается только в полях, для которых
           оно предусмотрено схемой ответа.

        5. Не используй "None", "null" или пустые строки.

        6. Если текстовое значение отсутствует, возвращай:
           "Данные не определены".

        7. В evidence включай только точные фрагменты текста договора.

        8. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        9. work_description_status = "defined" только если из текста прямо
           понятно, какие работы обязан выполнить подрядчик.

        10. material_result_status = "defined" только если из текста прямо
            можно установить конкретный результат работ.

            Результатом может быть, в частности:
            - изготовленная вещь или изделие;
            - созданный объект;
            - смонтированная конструкция;
            - отремонтированный объект;
            - переработанная или изменённая вещь;
            - иной конкретно идентифицируемый результат выполненных работ.

            Простое указание на выполнение действий или процесса без возможности
            установить конкретный результат не является достаточным основанием
            для значения "defined".

        11. technical_task_referenced = "yes" только при наличии прямой ссылки
            в предоставленном тексте на ТЗ, спецификацию, приложение, ведомость
            работ или иной отдельный документ, раскрывающий предмет.

        12. Не возвращай technical_task_referenced = "no" только потому, что
            ссылка на ТЗ или иной документ не найдена в предоставленном контексте.

            Если наличие или отсутствие такой ссылки невозможно надёжно установить
            по предоставленному контексту, возвращай "not_defined".

        13. result_definiteness = "specific" только если из текста понятно,
            какой именно результат должен быть достигнут или сдан заказчику.

        14. result_definiteness = "vague" только если результат прямо упомянут,
            но описан слишком общими словами и не позволяет достаточно конкретно
            установить, что именно должно быть получено в результате работ.

        15. result_definiteness = "not_defined", если конкретное описание
            результата в предоставленном контексте не найдено.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — данные определены:

        Фрагмент:

        "Подрядчик обязуется выполнить работы по изготовлению и монтажу
        металлического ограждения на объекте Заказчика. Результатом работ
        является изготовленное и смонтированное металлическое ограждение
        согласно Спецификации № 1, являющейся приложением к договору."

        Ответ:

        {
          "work_description_status": "defined",
          "work_description_value": "Изготовление и монтаж металлического ограждения на объекте Заказчика.",
          "material_result_status": "defined",
          "material_result_value": "Изготовленное и смонтированное металлическое ограждение.",
          "technical_task_referenced": "yes",
          "technical_task_reference_display": "Предмет работ раскрывается в Спецификации № 1.",
          "result_definiteness": "specific",
          "result_definiteness_display": "Результат работ определён конкретно.",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "Подрядчик обязуется выполнить работы по изготовлению и монтажу металлического ограждения на объекте Заказчика. Результатом работ является изготовленное и смонтированное металлическое ограждение согласно Спецификации № 1."
            }
          ]
        }

        Пример 2 — содержание работ указано, но результат недостаточно определён:

        Фрагмент:

        "Подрядчик обязуется выполнить ремонтные работы на объекте Заказчика.
        Конкретный перечень работ, технические характеристики и результат
        работ определяются Заказчиком дополнительно."

        Ответ:

        {
          "work_description_status": "defined",
          "work_description_value": "Выполнение ремонтных работ на объекте Заказчика.",
          "material_result_status": "not_defined",
          "material_result_value": "Данные не определены",
          "technical_task_referenced": "not_defined",
          "technical_task_reference_display": "Отдельный документ, раскрывающий предмет работ, в предоставленном контексте не установлен.",
          "result_definiteness": "not_defined",
          "result_definiteness_display": "Конкретный результат работ в предоставленном контексте не определён.",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "Подрядчик обязуется выполнить ремонтные работы на объекте Заказчика. Конкретный перечень работ, технические характеристики и результат работ определяются Заказчиком дополнительно."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]

        1. Найди прямую цитату о содержании работ.

        2. Найди прямую цитату о конкретном результате работ.

        3. Найди прямую цитату о ТЗ, спецификации, приложении или ином документе,
          если такая ссылка прямо присутствует в контексте.

        4. Проверь, позволяет ли текст конкретно установить результат работ.

        5. Не делай вывод об отсутствии ТЗ, спецификации или приложения только
          на основании того, что ссылка не найдена в предоставленном контексте.

        6. Если прямого текстового основания для вывода нет — используй значение,
          предусмотренное схемой для неопределённости.

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]

        {
          "work_description_status": "<defined / not_defined>",
          "work_description_value": "<текст или 'Данные не определены'>",
          "material_result_status": "<defined / not_defined>",
          "material_result_value": "<текст или 'Данные не определены'>",
          "technical_task_referenced": "<yes / no / not_defined>",
          "technical_task_reference_display": "<понятное описание для юриста>",
          "result_definiteness": "<specific / vague / not_defined>",
          "result_definiteness_display": "<понятное описание для юриста>",
          "evidence": [
            {
              "clause_ref": "<пункт>",
              "quote": "<точная цитата>"
            }
          ]
        }

      context_k: 6
      temperature: 0.0
      max_tokens: 750

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: >
        подрядчик обязуется выполнить работы предмет договора результат работ
        сдать результат техническое задание спецификация перечень работ
        описание работ результат выполненных работ
      retrieval_profile: "scope_of_work_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - definitions
        - obligations
      negative_keywords:
        - "цена"
        - "стоимость"
        - "срок оплаты"
        - "неустойка"
        - "штраф"
        - "НДС"
        - "форс-мажор"
      position_bias:
        preferred_range: [0.0, 0.30]
        boost: 0.20
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
        - "technical_specification"
      excluded_segment_types:
        - "price_list"
      preferred_clause_functions:
        - "definitions"
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 50
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      presence_signal:
        field: "subject_and_result_extraction_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_max_tokens: 800

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист.

        Извлеки из предоставленного контекста договора подряда:

        - содержание работ;
        - конкретный результат работ;
        - наличие прямой ссылки на ТЗ, спецификацию, приложение, ведомость работ
          или иной документ, раскрывающий предмет;
        - степень определённости результата.

        Не анализируй цену, сроки, приёмку, оплату, ответственность или гарантию.
        Не оценивай серьёзность юридического риска.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. subject_and_result_extraction_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (work_description_status, material_result_status,
              result_definiteness) ≠ "not_defined";
           - "missing" — если все три содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - work_description_status = "not_defined";
           - material_result_status = "not_defined";
           - technical_task_referenced = "not_defined";
           - result_definiteness = "not_defined";
           - work_description_value = "Данные не определены";
           - material_result_value = "Данные не определены";
           - technical_task_reference_display = "Отдельный документ, раскрывающий предмет работ, в предоставленном контексте не установлен.";
           - result_definiteness_display = "Конкретный результат работ в предоставленном контексте не определён.";
           - не выполняй остальные шаги.

        1. work_description_status:
           - "defined" — если из текста прямо понятно, какие работы обязан
             выполнить подрядчик;
           - "not_defined" — если содержание работ прямо не раскрыто.

        2. work_description_value:
           Краткое содержание работ. Не пересказывай документ полностью.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        3. material_result_status:
           - "defined" — если из текста прямо можно установить конкретный
             результат работ (изготовленная вещь, смонтированная конструкция,
             отремонтированный объект и т.п.);
           - "not_defined" — если конкретный результат прямо не указан либо
             текст описывает только процесс без возможности установить,
             что именно должно быть создано или сдано заказчику.

        4. material_result_value:
           Краткое описание конкретного результата работ.
           Если данных нет — "Данные не определены".

        5. technical_task_referenced:
           - "yes" — если в контексте есть прямая ссылка на ТЗ, спецификацию,
             приложение, ведомость работ или иной документ, раскрывающий предмет;
           - "no" — только если текст прямо позволяет установить, что отдельный
             документ для раскрытия предмета не предусмотрен;
           - "not_defined" — если наличие или отсутствие такого документа
             нельзя надёжно установить по контексту.
           Не возвращай "no" только потому, что ссылка не найдена в контексте.

        6. technical_task_reference_display:
           - если "yes": "Предмет работ раскрывается в <название документа>.";
           - если "no": "Отдельный документ, раскрывающий предмет работ, прямо не предусмотрен.";
           - если "not_defined": "Отдельный документ, раскрывающий предмет работ, в предоставленном контексте не установлен."

        7. result_definiteness:
           - "specific" — если результат индивидуализирован достаточно конкретно;
           - "vague" — если результат упомянут, но описан общими словами;
           - "not_defined" — если описание результата не найдено.

        8. result_definiteness_display:
           - если "specific": "Результат работ определён конкретно.";
           - если "vague": "Описание результата работ недостаточно конкретно.";
           - если "not_defined": "Конкретный результат работ в предоставленном контексте не определён."
        </task>

        <context_rules>
        - Перед остальными полями заполни subject_and_result_extraction_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", technical_task_referenced = "not_defined", result_definiteness = "not_defined", все *_value/*_display = соответствующий fallback.
        - Используй только текст предоставленного контекста. Не придумывай отсутствующие условия, документы, приложения или результаты.
        - Не подставляй нормы закона вместо содержания договора.
        - Не делай вывод об отсутствии ТЗ, спецификации или приложения только на основании того, что ссылка не найдена в контексте.
        - Простое указание на выполнение действий или процесса без возможности установить конкретный результат не является достаточным основанием для material_result_status = "defined".
        - Если в разных фрагментах указаны противоречивые описания результата — status → "not_defined", value → "Не удалось определить".
        - Не используй "None", "null" или пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни описания работ, ни результата, ни ссылки на ТЗ
           (только общая преамбула или реквизиты сторон).
           → presence = "missing";
             все *_status = "not_defined";
             technical_task_referenced = "not_defined";
             result_definiteness = "not_defined";
             все *_value/*_display = соответствующий fallback.

        2. Содержание работ указано, но результат не определён.
           "Подрядчик обязуется выполнить ремонтные работы" без указания
           конкретного результата и без ссылки на ТЗ.
           → presence = "present";
             work_description_status = "defined";
             material_result_status = "not_defined";
             result_definiteness = "not_defined" или "vague";
             technical_task_referenced = "not_defined".

        3. Противоречие между фрагментами.
           В одном пункте результат — "изготовление мебели", в другом —
           "монтаж оборудования".
           → presence = "unclear";
             material_result_status = "not_defined";
             material_result_value = "Не удалось определить";
             result_definiteness = "not_defined".

        4. Отсылка на ТЗ/спецификацию без конкретизации в основном тексте.
           "Работы выполняются согласно Техническому заданию (Приложение №1)"
           без описания содержания в основном тексте договора.
           → presence = "present";
             technical_task_referenced = "yes";
             work_description_status = "defined" (если хотя бы общее описание есть);
             material_result_status зависит от содержания ТЗ в контексте.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для subject_and_result_extraction_presence используй только: "present", "missing", "unclear".
        - Для *_status используй только: "defined", "not_defined".
        - Для technical_task_referenced используй только: "yes", "no", "not_defined".
        - Для result_definiteness используй только: "specific", "vague", "not_defined".
        - Fallback при отсутствии данных:
          * work_description_value → "Данные не определены";
          * material_result_value → "Данные не определены";
          * technical_task_reference_display → "Отдельный документ, раскрывающий предмет работ, в предоставленном контексте не установлен.";
          * result_definiteness_display → "Конкретный результат работ в предоставленном контексте не определён.".
        - Fallback при противоречии или неоднозначности:
          * все *_value → "Не удалось определить";
          * result_definiteness_display → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "subject_and_result_extraction_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие определения предмета и результата работ. Внутреннее агрегатное signal-поле."
          required: true

        - name: "work_description_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения содержания работ."
          required: true
          display_in_grid: false

        - name: "work_description_value"
          type: "string"
          presentation: "fact"
          label: "Содержание работ"
          description: "Описание содержания работ по договору подряда."
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "material_result_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения конкретного результата работ."
          required: true
          display_in_grid: false

        - name: "material_result_value"
          type: "string"
          presentation: "fact"
          label: "Результат работ"
          description: "Описание конкретного результата работ."
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "technical_task_referenced"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["yes", "no", "not_defined"]
          description: >
            Есть ли прямая ссылка на ТЗ, спецификацию, приложение или иной
            документ, раскрывающий предмет.
          required: true
          display_in_grid: false

        - name: "technical_task_reference_display"
          type: "string"
          presentation: "fact"
          label: "Документ, раскрывающий предмет"
          description: >
            Понятное для юриста описание наличия и роли ТЗ, спецификации,
            приложения или иного документа.
          required: true
          display_in_grid: true
          display_priority: 3

        - name: "result_definiteness"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["specific", "vague", "not_defined"]
          description: "Степень определённости описания результата."
          required: true
          display_in_grid: false

        - name: "result_definiteness_display"
          type: "string"
          presentation: "fact"
          label: "Определённость результата"
          description: >
            Понятное для юриста описание степени конкретизации результата работ.
          required: true
          display_in_grid: true
          display_priority: 4

      store_payload: true

  - id: deadlines_extraction
    name: "Сроки выполнения работ: начальный и конечный (ст. 708 ГК РФ)"
    description: >
      Извлекает начальный и конечный сроки выполнения работ, а также сведения
      о промежуточных сроках или этапах выполнения работ.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "начало работ"
        - "начальный срок"
        - "конечный срок"
        - "срок выполнения"
        - "срок завершения"
        - "приступает к выполнению"
        - "завершить работы"
        - "не позднее"
        - "в течение"
        - "этап"
        - "график выполнения работ"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"
        - "(?i)(не\\s+позднее|в\\s+течение)\\s+\\d+\\s*(календарн|рабоч|дн)"
        - "(?i)(срок\\s+выполнения|начальный\\s+срок|конечный\\s+срок|начало\\s+работ|окончание\\s+работ)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]

        Ты — российский юрист по договорной работе.
        Анализируется договор подряда с учётом положений ст. 708 ГК РФ.

        Проверяется один вопрос: как в договоре определены сроки выполнения работ,
        включая начальный срок, конечный срок и промежуточные сроки или этапы.

        Нормативный ориентир:
        - ст. 708 ГК РФ
        - ст. 190 ГК РФ
        - ст. 432 ГК РФ

        Важно:

        - Твоя задача — установить только то, что прямо следует из текста договора.
        - Не подставляй содержание условий из норм закона.
        - Не оценивай серьёзность юридического риска.
        - Не делай вывод об отсутствии срока только потому, что соответствующее
          условие не попало в предоставленный контекст.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]

        Найди в предоставленном контексте:

        1. Как определён начальный срок выполнения работ.

        2. Как определён конечный срок выполнения работ.

        3. Есть ли промежуточные сроки, отдельные этапы, контрольные даты,
           график выполнения работ или иные прямо установленные временные вехи.

        [ЧТО МОЖЕТ СЧИТАТЬСЯ ОПРЕДЕЛЕНИЕМ СРОКА]

        Срок может быть выражен, в частности:

        - конкретной календарной датой;
        - периодом времени;
        - определённым моментом;
        - событием, наступление которого позволяет объективно определить
          начало или окончание выполнения работ.

        Извлекай формулировку срока в том виде, в котором она определена
        договором. Не преобразуй самостоятельно период в календарную дату,
        если для такого расчёта в контексте недостаточно данных.

        [ПРАВИЛА]

        1. Используй только текст предоставленного документа и контекста.

        2. Не придумывай даты, сроки, периоды, события или этапы.

        3. Не подставляй нормы закона вместо содержания договора.

        4. Значение "not_defined" допускается только в полях, для которых
           оно предусмотрено схемой ответа.

        5. Не используй "None", "null" или пустые строки.

        6. Если текстовое значение отсутствует, возвращай:
           "Данные не определены".

        7. В evidence включай только точные фрагменты текста договора.

        8. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        9. start_date_status = "defined" только если в предоставленном контексте
           прямо определён момент начала выполнения работ либо срок, с которым
           начало работ прямо связано.

        10. end_date_status = "defined" только если в предоставленном контексте
            прямо определён момент окончания работ либо срок, к которому или
            в пределах которого работы должны быть завершены.

        11. intermediate_deadlines = "yes" только если в предоставленном контексте
            прямо указаны:

            - отдельные этапы выполнения;
            - промежуточные сроки;
            - контрольные даты;
            - график выполнения работ;
            - иные отдельные временные вехи.

        12. Не возвращай intermediate_deadlines = "no" только потому, что
            промежуточные сроки не были найдены в предоставленном контексте.

            Если наличие или отсутствие промежуточных сроков невозможно надёжно
            установить по предоставленному контексту, возвращай "not_defined".

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — начальный и конечный сроки определены, есть этапы:

        Фрагмент:

        "Подрядчик приступает к выполнению работ 01.07.2025.
        Работы должны быть завершены не позднее 31.08.2025.
        Этап 1 выполняется до 15.07.2025, Этап 2 — до 31.08.2025."

        Ответ:

        {
          "start_date_status": "defined",
          "start_date_value": "01.07.2025",
          "end_date_status": "defined",
          "end_date_value": "Не позднее 31.08.2025",
          "intermediate_deadlines": "yes",
          "intermediate_deadlines_display": "Установлены промежуточные сроки выполнения этапов: Этап 1 — до 15.07.2025, Этап 2 — до 31.08.2025.",
          "evidence": [
            {
              "clause_ref": "п. 3.1",
              "quote": "Подрядчик приступает к выполнению работ 01.07.2025. Работы должны быть завершены не позднее 31.08.2025. Этап 1 выполняется до 15.07.2025, Этап 2 — до 31.08.2025."
            }
          ]
        }

        Пример 2 — сроки определены через период:

        Фрагмент:

        "Подрядчик обязан приступить к выполнению работ в течение 5 рабочих дней
        с даты подписания договора. Срок выполнения работ составляет 60 календарных
        дней с даты начала работ."

        Ответ:

        {
          "start_date_status": "defined",
          "start_date_value": "В течение 5 рабочих дней с даты подписания договора.",
          "end_date_status": "defined",
          "end_date_value": "В течение 60 календарных дней с даты начала работ.",
          "intermediate_deadlines": "not_defined",
          "intermediate_deadlines_display": "Промежуточные сроки или отдельные этапы в предоставленном контексте не установлены.",
          "evidence": [
            {
              "clause_ref": "п. 3.1",
              "quote": "Подрядчик обязан приступить к выполнению работ в течение 5 рабочих дней с даты подписания договора. Срок выполнения работ составляет 60 календарных дней с даты начала работ."
            }
          ]
        }

        Пример 3 — начальный срок не установлен:

        Фрагмент:

        "Подрядчик обязуется выполнить работы не позднее 31.12.2025."

        Ответ:

        {
          "start_date_status": "not_defined",
          "start_date_value": "Данные не определены",
          "end_date_status": "defined",
          "end_date_value": "Не позднее 31.12.2025",
          "intermediate_deadlines": "not_defined",
          "intermediate_deadlines_display": "Промежуточные сроки или отдельные этапы в предоставленном контексте не установлены.",
          "evidence": [
            {
              "clause_ref": "п. 3.1",
              "quote": "Подрядчик обязуется выполнить работы не позднее 31.12.2025."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]

        1. Найди прямую цитату, определяющую начало выполнения работ.

        2. Найди прямую цитату, определяющую окончание работ или срок,
           в пределах которого работы должны быть завершены.

        3. Найди прямую цитату о промежуточных этапах, сроках или контрольных
           датах, если они прямо присутствуют.

        4. Проверь, не перепутаны ли:

           - срок выполнения работ;
           - срок оплаты;
           - срок поставки;
           - срок приёмки;
           - гарантийный срок.

        5. Не делай вывод об отсутствии промежуточных сроков только потому,
           что они не найдены в предоставленном контексте.

        6. Если прямого текстового основания для вывода нет — используй значение,
           предусмотренное схемой для неопределённости.

        Не выводи шаги проверки.
        Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]

        {
          "start_date_status": "<defined / not_defined>",
          "start_date_value": "<срок или 'Данные не определены'>",
          "end_date_status": "<defined / not_defined>",
          "end_date_value": "<срок или 'Данные не определены'>",
          "intermediate_deadlines": "<yes / no / not_defined>",
          "intermediate_deadlines_display": "<понятное описание для юриста>",
          "evidence": [
            {
              "clause_ref": "<пункт>",
              "quote": "<точная цитата>"
            }
          ]
        }

      context_k: 5
      temperature: 0.0
      max_tokens: 700

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: >
        начало работ начальный срок конечный срок срок выполнения работ
        срок завершения окончание работ приступить к выполнению завершить работы
        не позднее в течение срок выполнения этап работ промежуточный срок
        график выполнения работ контрольный срок
      retrieval_profile: "completion_deadline_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - definitions
      negative_keywords:
        - "цена"
        - "стоимость"
        - "аванс"
        - "неустойка"
        - "штраф"
        - "НДС"
        - "форс-мажор"
      position_bias:
        preferred_range: [0.0, 0.45]
        boost: 0.18
        scope: segment
      context_k: 5
      max_chunks: 6
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
        - "technical_specification"
      excluded_segment_types:
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "definitions"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 500

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      presence_signal:
        field: "deadlines_extraction_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_max_tokens: 750

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист.

        Извлеки из предоставленного контекста договора подряда сведения:

        - о начальном сроке выполнения работ;
        - о конечном сроке выполнения работ;
        - о промежуточных сроках, этапах или иных временных вехах.

        Не анализируй цену, оплату, приёмку, ответственность, гарантию
        или иные сроки, не относящиеся к выполнению работ.

        Не оценивай серьёзность юридического риска.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. deadlines_extraction_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (start_date_status, end_date_status) ≠ "not_defined";
           - "missing" — если оба содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - start_date_status = "not_defined";
           - end_date_status = "not_defined";
           - intermediate_deadlines = "not_defined";
           - start_date_value = "Данные не определены";
           - end_date_value = "Данные не определены";
           - intermediate_deadlines_display = "Промежуточные сроки или отдельные этапы в предоставленном контексте не установлены.";
           - не выполняй остальные шаги.

        1. start_date_status:
           - "defined" — если текст прямо определяет дату, момент, период
             или событие, с которым связано начало работ;
           - "not_defined" — если начальный срок прямо не установлен.

        2. start_date_value:
           Формулировка начального срока в том виде, как она определена
           договором. Не рассчитывай календарную дату самостоятельно.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        3. end_date_status:
           - "defined" — если текст прямо определяет дату, момент, период
             или событие, с которым связано окончание работ;
           - "not_defined" — если конечный срок прямо не установлен.

        4. end_date_value:
           Формулировка конечного срока. Не рассчитывай календарную дату
           самостоятельно.
           Если данных нет — "Данные не определены".

        5. intermediate_deadlines:
           - "yes" — если прямо указаны промежуточные сроки, этапы,
             контрольные даты, график выполнения;
           - "no" — только если текст прямо позволяет установить, что
             промежуточные сроки не предусмотрены;
           - "not_defined" — если наличие или отсутствие нельзя надёжно
             установить по контексту.
           Не возвращай "no" только потому, что сроки не найдены в контексте.

        6. intermediate_deadlines_display:
           - если "yes": краткое описание установленных сроков/этапов;
           - если "no": "Промежуточные сроки или отдельные этапы прямо не предусмотрены.";
           - если "not_defined": "Промежуточные сроки или отдельные этапы в предоставленном контексте не установлены."
        </task>

        <context_rules>
        - Перед остальными полями заполни deadlines_extraction_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", intermediate_deadlines = "not_defined", все *_value/*_display = соответствующий fallback.
        - Используй только текст предоставленного контекста. Не придумывай даты, периоды, сроки, события или этапы.
        - Не подставляй нормы закона вместо содержания договора.
        - Не путай сроки выполнения работ со сроками оплаты, поставки, приёмки, гарантийными сроками или сроками устранения недостатков.
        - Не рассчитывай календарную дату самостоятельно — извлекай формулировку в том виде, как она определена договором.
        - Не делай вывод об отсутствии промежуточных сроков только потому, что они не найдены в контексте.
        - Если в разных фрагментах указаны противоречивые сроки — статус → "not_defined", текстовое поле → "Не удалось определить".
        - Не используй "None", "null" или пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни начального, ни конечного срока, ни этапов
           (только общая преамбула или реквизиты сторон).
           → presence = "missing";
             все *_status = "not_defined";
             intermediate_deadlines = "not_defined";
             все *_value/*_display = соответствующий fallback.

        2. Только конечный срок без начального.
           "Подрядчик обязуется выполнить работы не позднее 31.12.2025"
           без указания даты начала.
           → presence = "present";
             start_date_status = "not_defined";
             end_date_status = "defined";
             intermediate_deadlines = "not_defined".

        3. Противоречие в сроках.
           В одном пункте "срок выполнения — 60 дней", в другом —
           "работы должны быть завершены до 01.09.2025" (что не совпадает
           с 60 днями от даты начала).
           → presence = "unclear";
             end_date_status = "not_defined";
             end_date_value = "Не удалось определить".

        4. Сроки определены через событие.
           "Подрядчик приступает к работам в течение 5 рабочих дней с момента
           получения аванса. Работы завершаются через 90 календарных дней
           с даты начала."
           → presence = "present";
             start_date_status = "defined";
             start_date_value = "В течение 5 рабочих дней с момента получения аванса";
             end_date_status = "defined";
             end_date_value = "Через 90 календарных дней с даты начала работ".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для deadlines_extraction_presence используй только: "present", "missing", "unclear".
        - Для *_status используй только: "defined", "not_defined".
        - Для intermediate_deadlines используй только: "yes", "no", "not_defined".
        - Fallback при отсутствии данных:
          * start_date_value → "Данные не определены";
          * end_date_value → "Данные не определены";
          * intermediate_deadlines_display → "Промежуточные сроки или отдельные этапы в предоставленном контексте не установлены.".
        - Fallback при противоречии или неоднозначности:
          * все *_value → "Не удалось определить";
          * intermediate_deadlines_display → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "deadlines_extraction_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие определения сроков выполнения работ. Внутреннее агрегатное signal-поле."
          required: true

        - name: "start_date_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения начального срока выполнения работ."
          required: true
          display_in_grid: false

        - name: "start_date_value"
          type: "string"
          presentation: "fact"
          label: "Начальный срок"
          description: >
            Формулировка начального срока выполнения работ, включая дату,
            период или иной прямо определённый способ установления срока.
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "end_date_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения конечного срока выполнения работ."
          required: true
          display_in_grid: false

        - name: "end_date_value"
          type: "string"
          presentation: "fact"
          label: "Конечный срок"
          description: >
            Формулировка конечного срока выполнения работ, включая дату,
            период или иной прямо определённый способ установления срока.
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "intermediate_deadlines"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Статус наличия промежуточных сроков или этапов."
          required: true
          display_in_grid: false

        - name: "intermediate_deadlines_display"
          type: "string"
          presentation: "fact"
          label: "Промежуточные сроки и этапы"
          description: >
            Понятное для юриста описание наличия и содержания промежуточных
            сроков, этапов или иных временных вех.
          required: true
          display_in_grid: true
          display_priority: 3

      store_payload: true

  - id: price_and_estimate_analysis
    name: "Цена и смета: тип цены, сумма, изменение и дополнительные работы (ст. 709 ГК РФ)"
    description: >
      Извлекает сведения о том, как договор определяет тип цены или сметы,
      сумму цены, порядок изменения цены или сметы, а также условия
      согласования дополнительных работ или расходов.
    triggers:
      any: ["commercial_parties", "fixed_price", "approximate_price"]
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "твёрдая цена"
        - "твердая цена"
        - "твёрдая смета"
        - "твердая смета"
        - "приблизительная цена"
        - "приблизительная смета"
        - "цена работ"
        - "стоимость работ"
        - "стоимость договора"
        - "смета"
        - "изменение цены"
        - "изменение сметы"
        - "дополнительные работы"
        - "дополнительные расходы"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)цен[аеуой]\\s+.*?\\d"
        - "(?i)стоимост[ьи]\\s+.*?\\d"
        - "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|тыс|млн)"
        - "(?i)(твёрд(ая|ой)|тверд(ая|ой))\\s+(?:цен[аеуой]|смет)"
        - "(?i)приблизительн(ая|ой)\\s+(?:цен[аеуой]|смет)"
        - "(?i)(дополнительн(ые|ая)\\s+(?:работы|расходы)|изменени[ея]\\s+(?:цен[ыа]|смет[ыа]))"

    llm:
      prompt_template: |
        [КОНТЕКСТ]

        Ты — российский юрист по договорной работе.
        Анализируется договор подряда.

        Проверяется один связанный блок условий:

        - как определена цена или смета;
        - указан ли прямо тип цены;
        - указана ли сумма цены;
        - описан ли порядок изменения цены или сметы;
        - предусмотрено ли согласование дополнительных работ или расходов.

        Нормативный ориентир:
        - ст. 709 ГК РФ
        - ст. 743 ГК РФ
        - ст. 432 ГК РФ

        Важно:

        - Твоя задача — установить только то, что прямо следует из текста договора.
        - Не подставляй содержание условий из норм закона.
        - Не делай юридический вывод о том, какой режим применяется по умолчанию,
          если это прямо не указано в договоре.
        - Не оценивай серьёзность юридического риска.
        - Не делай вывод об отсутствии условия только потому, что соответствующий
          фрагмент не попал в предоставленный контекст.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]

        Найди в предоставленном контексте:

        1. Указана ли цена, стоимость работ или смета.

        2. Указан ли прямо тип цены:

           - твёрдая;
           - приблизительная;
           - либо цена прямо указана, но её тип не назван.

        3. Указана ли конкретная сумма цены.

        4. Описан ли порядок изменения:

           - цены;
           - сметы;
           - стоимости работ.

        5. Требуется ли согласование заказчика для:

           - дополнительных работ;
           - дополнительных расходов;
           - увеличения стоимости работ.

        [ПРАВИЛА]

        1. Используй только текст предоставленного документа и контекста.

        2. Не придумывай сумму цены, тип цены, порядок изменения цены
           или условия дополнительных работ.

        3. Не подставляй положения закона вместо содержания договора.

        4. Значение "not_defined" допускается только в полях,
           для которых оно предусмотрено схемой ответа.

        5. Не используй "None", "null" или пустые строки.

        6. Если текстовое значение отсутствует, возвращай:
           "Данные не определены".

        7. В evidence включай только точные фрагменты текста договора.

        8. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        9. price_type_code = "fixed" только если договор прямо использует
           формулировку:

           - твёрдая цена;
           - твердая цена;
           - твёрдая смета;
           - твердая смета;

           либо иной равнозначный прямой термин, однозначно определяющий
           цену как твёрдую.

        10. price_type_code = "approximate" только если договор прямо
            использует формулировку:

            - приблизительная цена;
            - приблизительная смета;

            либо иной равнозначный прямой термин.

        11. price_type_code = "not_specified" только если цена, стоимость
            или смета прямо упомянуты в предоставленном контексте, но тип
            цены прямо не назван.

        12. price_type_code = "not_defined" только если из предоставленного
            контекста нельзя установить наличие договорного условия о цене
            или смете.

        13. Не определяй тип цены самостоятельно на основании нормы закона.

        14. price_change_procedure = "described" только если договор прямо
            устанавливает порядок или условия изменения цены, сметы или стоимости.

        15. Не возвращай price_change_procedure = "not_described" только потому,
            что порядок изменения цены не найден в предоставленном контексте.

            Если наличие или отсутствие такого порядка нельзя надёжно установить
            по предоставленному контексту, возвращай "not_defined".

        16. additional_works_consent = "required" только если договор прямо
            требует согласования заказчика для дополнительных работ, расходов
            или увеличения стоимости.

        17. additional_works_consent = "not_required" только если договор прямо
            допускает выполнение дополнительных работ, дополнительные расходы
            или увеличение стоимости без предварительного отдельного согласования
            заказчика.

        18. Не возвращай additional_works_consent = "not_required" только потому,
            что требование о согласовании не найдено в предоставленном контексте.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — цена и порядок изменения определены:

        Фрагмент:

        "Цена работ составляет 1 500 000 рублей и является твёрдой.
        Изменение цены допускается только по письменному соглашению сторон.
        Выполнение дополнительных работ возможно только после письменного
        согласования с Заказчиком."

        Ответ:

        {
          "price_type_status": "defined",
          "price_type_code": "fixed",
          "price_type_display": "Твёрдая цена.",
          "price_amount_status": "defined",
          "price_amount_value": "1 500 000 рублей",
          "price_change_procedure": "described",
          "price_change_procedure_display": "Изменение цены допускается только по письменному соглашению сторон.",
          "additional_works_consent": "required",
          "additional_works_consent_display": "Дополнительные работы требуют письменного согласования Заказчика.",
          "evidence": [
            {
              "clause_ref": "п. 4.1",
              "quote": "Цена работ составляет 1 500 000 рублей и является твёрдой. Изменение цены допускается только по письменному соглашению сторон. Выполнение дополнительных работ возможно только после письменного согласования с Заказчиком."
            }
          ]
        }

        Пример 2 — сумма указана, но тип цены прямо не назван:

        Фрагмент:

        "Стоимость работ по настоящему договору составляет 850 000 рублей."

        Ответ:

        {
          "price_type_status": "defined",
          "price_type_code": "not_specified",
          "price_type_display": "Тип цены прямо не указан.",
          "price_amount_status": "defined",
          "price_amount_value": "850 000 рублей",
          "price_change_procedure": "not_defined",
          "price_change_procedure_display": "Порядок изменения цены в предоставленном контексте не установлен.",
          "additional_works_consent": "not_defined",
          "additional_works_consent_display": "Условия согласования дополнительных работ в предоставленном контексте не установлены.",
          "evidence": [
            {
              "clause_ref": "п. 4.1",
              "quote": "Стоимость работ по настоящему договору составляет 850 000 рублей."
            }
          ]
        }

        Пример 3 — приблизительная смета:

        Фрагмент:

        "Стоимость работ определяется на основании приблизительной сметы.
        При необходимости превышения сметы Подрядчик обязан предварительно
        уведомить Заказчика и получить его письменное согласие."

        Ответ:

        {
          "price_type_status": "defined",
          "price_type_code": "approximate",
          "price_type_display": "Приблизительная смета.",
          "price_amount_status": "not_defined",
          "price_amount_value": "Данные не определены",
          "price_change_procedure": "described",
          "price_change_procedure_display": "Превышение сметы допускается после предварительного уведомления и письменного согласия Заказчика.",
          "additional_works_consent": "required",
          "additional_works_consent_display": "Дополнительные расходы, связанные с превышением сметы, требуют согласования Заказчика.",
          "evidence": [
            {
              "clause_ref": "п. 4.2",
              "quote": "Стоимость работ определяется на основании приблизительной сметы. При необходимости превышения сметы Подрядчик обязан предварительно уведомить Заказчика и получить его письменное согласие."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]

        1. Найди прямую цитату о цене, стоимости работ или смете.

        2. Найди прямую цитату о типе цены, если он прямо указан.

        3. Найди прямую цитату о сумме цены.

        4. Найди прямую цитату о порядке изменения цены или сметы.

        5. Найди прямую цитату о дополнительных работах, расходах или
           согласовании их стоимости.

        6. Не путай цену работ с:

           - суммой аванса;
           - отдельным платежом;
           - неустойкой;
           - штрафом;
           - размером НДС;
           - стоимостью отдельной поставки, если она не является ценой работ.

        7. Не делай вывод об отсутствии порядка изменения цены или согласования
           дополнительных работ только потому, что соответствующий фрагмент
           не найден в предоставленном контексте.

        8. Если прямого текстового основания для вывода нет — используй значение,
           предусмотренное схемой для неопределённости.

        Не выводи шаги проверки.
        Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]

        {
          "price_type_status": "<defined / not_defined>",
          "price_type_code": "<fixed / approximate / not_specified / not_defined>",
          "price_type_display": "<понятное описание для юриста>",
          "price_amount_status": "<defined / not_defined>",
          "price_amount_value": "<сумма или 'Данные не определены'>",
          "price_change_procedure": "<described / not_described / not_defined>",
          "price_change_procedure_display": "<понятное описание для юриста>",
          "additional_works_consent": "<required / not_required / not_defined>",
          "additional_works_consent_display": "<понятное описание для юриста>",
          "evidence": [
            {
              "clause_ref": "<пункт>",
              "quote": "<точная цитата>"
            }
          ]
        }

      context_k: 5
      temperature: 0.0
      max_tokens: 850

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"

      retrieval_query: >
        цена работ стоимость работ стоимость договора смета твёрдая цена
        твердая цена твёрдая смета твердая смета приблизительная цена
        приблизительная смета сумма договора изменение цены изменение сметы
        изменение стоимости согласование дополнительных работ дополнительные
        расходы увеличение стоимости согласование заказчика превышение сметы
        порядок согласования дополнительных работ дополнительные работы
        согласование дополнительных расходов

      retrieval_profile: "payment_terms_check"

      preferred_unit_types:
        - obligation
        - general_provision
        - payment_term

      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment

      preferred_clause_functions:
        - obligations

      negative_keywords:
        - "гарантия"
        - "форс-мажор"
        - "подсудность"
        - "конфиденциальность"
        - "скрытые недостатки"

      position_bias:
        preferred_range: [0.10, 0.55]
        boost: 0.20
        scope: segment

      context_k: 9
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
        - "technical_specification"

      excluded_segment_types:
        - "price_list"

      preferred_clause_functions:
        - "obligations"

      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      presence_signal:
        field: "price_and_estimate_analysis_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_max_tokens: 850

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист.

        Извлеки из предоставленного контекста договора подряда сведения:

        - о типе цены или сметы;
        - о сумме цены;
        - о порядке изменения цены или сметы;
        - о согласовании дополнительных работ или расходов.

        Не анализируй сроки, приёмку, гарантию, штрафы, налоги или порядок оплаты,
        если они не помогают прямо установить цену работ или порядок её изменения.
        Не оценивай юридический риск.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. price_and_estimate_analysis_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (price_type_status, price_amount_status,
              price_change_procedure, additional_works_consent)
             ≠ "not_defined";
           - "missing" — если все четыре содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - price_type_status = "not_defined";
           - price_type_code = "not_defined";
           - price_amount_status = "not_defined";
           - price_change_procedure = "not_defined";
           - additional_works_consent = "not_defined";
           - price_type_display = "Условие о типе цены в предоставленном контексте не установлено.";
           - price_amount_value = "Данные не определены";
           - price_change_procedure_display = "Порядок изменения цены или сметы в предоставленном контексте не установлен.";
           - additional_works_consent_display = "Условия согласования дополнительных работ в предоставленном контексте не установлены.";
           - не выполняй остальные шаги.

        1. price_type_status:
           - "defined" — если в тексте прямо установлено, что цена/смета
             является твёрдой или приблизительной, либо цена/стоимость/смета
             прямо упомянуты, но тип специально не назван;
           - "not_defined" — если из контекста нельзя установить наличие
             условия о цене или смете.

        2. price_type_code:
           - "fixed" — прямо указана твёрдая цена/смета;
           - "approximate" — прямо указана приблизительная цена/смета;
           - "not_specified" — цена/стоимость/смета упомянуты, но тип не назван;
           - "not_defined" — наличие условия о цене нельзя установить.

        3. price_type_display:
           - если "fixed": "Твёрдая цена.";
           - если "approximate": "Приблизительная цена или смета.";
           - если "not_specified": "Тип цены прямо не указан.";
           - если "not_defined": "Условие о типе цены в предоставленном контексте не установлено."

        4. price_amount_status:
           - "defined" — если конкретная сумма цены прямо указана;
           - "not_defined" — если сумма не указана.

        5. price_amount_value:
           Сумма цены работ. Не рассчитывай цену самостоятельно,
           не складывай отдельные платежи.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        6. price_change_procedure:
           - "described" — если договор прямо устанавливает порядок/условия
             изменения цены, стоимости или сметы;
           - "not_described" — только если текст прямо позволяет установить,
             что порядок изменения не предусмотрен;
           - "not_defined" — если наличие или отсутствие нельзя надёжно
             установить по контексту.

        7. price_change_procedure_display:
           - если "described": краткое описание установленного порядка;
           - если "not_described": "Специальный порядок изменения цены или сметы прямо не предусмотрен.";
           - если "not_defined": "Порядок изменения цены или сметы в предоставленном контексте не установлен."

        8. additional_works_consent:
           - "required" — если договор прямо требует согласования заказчика
             для дополнительных работ, расходов, увеличения стоимости,
             превышения сметы;
           - "not_required" — только если договор прямо допускает такие
             действия без согласования;
           - "not_defined" — если наличие или отсутствие требования нельзя
             надёжно установить по контексту.

        9. additional_works_consent_display:
           - если "required": краткое описание требования;
           - если "not_required": "Дополнительные работы или расходы прямо допускаются без отдельного согласования Заказчика.";
           - если "not_defined": "Условия согласования дополнительных работ в предоставленном контексте не установлены."
        </task>

        <context_rules>
        - Перед остальными полями заполни price_and_estimate_analysis_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", price_type_code = "not_defined", все *_value/*_display = соответствующий fallback.
        - Используй только текст предоставленного контекста. Не придумывай сумму цены, тип цены, смету, порядок изменения или согласование дополнительных работ.
        - Не определяй тип цены самостоятельно на основании норм закона.
        - Не возвращай price_change_procedure = "not_described" только потому, что порядок изменения не найден в контексте.
        - Не возвращай additional_works_consent = "not_required" только потому, что требование не найдено в контексте.
        - Не путай цену работ с суммой аванса, неустойкой, штрафом, НДС, стоимостью отдельной поставки.
        - Если в разных фрагментах указаны противоречивые суммы или типы цены — статус → "not_defined", текстовое поле → "Не удалось определить".
        - Не используй "None", "null" или пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни цены, ни сметы, ни порядка изменения,
           ни упоминания дополнительных работ.
           → presence = "missing";
             все *_status = "not_defined";
             price_type_code = "not_defined";
             все *_value/*_display = соответствующий fallback.

        2. Сумма указана, но тип цены не назван.
           "Стоимость работ составляет 500 000 рублей" без указания
           "твёрдая" или "приблизительная".
           → presence = "present";
             price_type_status = "defined";
             price_type_code = "not_specified";
             price_amount_status = "defined";
             price_change_procedure = "not_defined";
             additional_works_consent = "not_defined".

        3. Противоречие в сумме цены.
           В одном пункте "цена работ — 1 000 000 рублей", в другом —
           "общая стоимость договора — 1 200 000 рублей" без разграничения.
           → presence = "unclear";
             price_amount_status = "not_defined";
             price_amount_value = "Не удалось определить".

        4. Приблизительная смета без суммы.
           "Стоимость работ определяется на основании приблизительной сметы
           (Приложение №1)" без указания конкретной суммы в основном тексте.
           → presence = "present";
             price_type_status = "defined";
             price_type_code = "approximate";
             price_amount_status = "not_defined";
             price_amount_value = "Данные не определены" (сумма в приложении).
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для price_and_estimate_analysis_presence используй только: "present", "missing", "unclear".
        - Для *_status используй только: "defined", "not_defined".
        - Для price_type_code используй только: "fixed", "approximate", "not_specified", "not_defined".
        - Для price_change_procedure используй только: "described", "not_described", "not_defined".
        - Для additional_works_consent используй только: "required", "not_required", "not_defined".
        - Fallback при отсутствии данных:
          * price_type_display → "Условие о типе цены в предоставленном контексте не установлено.";
          * price_amount_value → "Данные не определены";
          * price_change_procedure_display → "Порядок изменения цены или сметы в предоставленном контексте не установлен.";
          * additional_works_consent_display → "Условия согласования дополнительных работ в предоставленном контексте не установлены.".
        - Fallback при противоречии или неоднозначности:
          * все *_value/*_display → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "price_and_estimate_analysis_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования цены и сметы. Внутреннее агрегатное signal-поле."
          required: true

        - name: "price_type_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения условия о типе цены."
          required: true
          display_in_grid: false

        - name: "price_type_code"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values:
            - "fixed"
            - "approximate"
            - "not_specified"
            - "not_defined"
          description: "Технический код типа цены или сметы."
          required: true
          display_in_grid: false

        - name: "price_type_display"
          type: "string"
          presentation: "fact"
          label: "Тип цены"
          description: "Понятное для юриста описание типа цены или сметы."
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "price_amount_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания конкретной суммы цены."
          required: true
          display_in_grid: false

        - name: "price_amount_value"
          type: "string"
          presentation: "fact"
          label: "Цена работ"
          description: "Конкретная сумма цены работ по договору."
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "price_change_procedure"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values:
            - "described"
            - "not_described"
            - "not_defined"
          description: "Технический статус порядка изменения цены или сметы."
          required: true
          display_in_grid: false

        - name: "price_change_procedure_display"
          type: "string"
          presentation: "fact"
          label: "Изменение цены"
          description: >
            Понятное для юриста описание порядка изменения цены, стоимости
            работ или сметы.
          required: true
          display_in_grid: true
          display_priority: 3

        - name: "additional_works_consent"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values:
            - "required"
            - "not_required"
            - "not_defined"
          description: >
            Технический статус требования о согласовании дополнительных работ
            или расходов.
          required: true
          display_in_grid: false

        - name: "additional_works_consent_display"
          type: "string"
          presentation: "fact"
          label: "Дополнительные работы"
          description: >
            Понятное для юриста описание требований к согласованию дополнительных
            работ, расходов или увеличения стоимости.
          required: true
          display_in_grid: true
          display_priority: 4

      store_payload: true

  - id: customer_materials_regime_check
    name: "Давальческие материалы: отчётность, норма расхода, возврат остатков (ст. 713, 714 ГК РФ)"
    description: >
      Фактографическая проверка режима использования материалов заказчика:
      отчётность подрядчика, норма расхода, возврат остатков и условия
      сохранности / ответственности.
    triggers:
      any: ["customer_supplied_materials"]
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "давальческие материалы"
        - "материалы заказчика"
        - "норма расхода"
        - "отчёт об использовании"
        - "возврат остатков"
        - "ответственность за сохранность"
        - "давальческое сырьё"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)материал(ы|ов)?\\s+заказчик"
        - "(?i)отчёт\\s+об\\s+использовании.*материал"
        - "(?i)возврат\\s+остатк"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор подряда с материалами заказчика по ст. 713, 714 ГК РФ.
        Проверяется только один вопрос: как урегулирован режим использования
        материалов заказчика.

        Нормативный ориентир:
        - ст. 713 ГК РФ
        - ст. 714 ГК РФ

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Обязан ли подрядчик отчитываться об использовании материалов заказчика.
        2. Указана ли норма расхода материалов.
        3. Обязан ли подрядчик вернуть остатки материалов заказчику.
        4. Урегулированы ли сохранность или ответственность за материалы заказчика.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если условие не указано прямо — возвращай "not_defined".
        3. Если текстового значения нет — возвращай "Данные не определены".
        4. Не используй "None", "null", "not_defined" или пустые строки.
        5. В evidence включай только текст договора.
        6. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        7. Не подставляй обязанности из закона, если они не отражены
           в тексте договора.
        8. materials_liability = "specified" только если есть прямая
           формулировка о сохранности, хранении или ответственности.
        9. consumption_norm = "specified" только если норма расхода прямо
           указана или отнесена к приложению.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — данные определены:
        Фрагмент:
        "Подрядчик обязан вести учет использования материалов Заказчика и
        представить отчет по окончании работ. Норма расхода материалов
        определяется Спецификацией № 2. Остатки материалов подлежат возврату
        Заказчику. Подрядчик несет ответственность за сохранность переданных
        материалов."

        Ответ:
        {
          "materials_reporting": "required",
          "materials_reporting_display": "Подрядчик обязан отчитываться об использовании материалов.",
          "consumption_norm": "specified",
          "consumption_norm_display": "Норма расхода материалов определена.",
          "leftover_return": "required",
          "leftover_return_display": "Остатки материалов подлежат возврату Заказчику.",
          "materials_liability": "specified",
          "materials_liability_display": "Подрядчик несет ответственность за сохранность материалов.",
          "evidence": [
            {
              "clause_ref": "п. 5.2",
              "quote": "Подрядчик обязан вести учет использования материалов Заказчика и представить отчет по окончании работ. Норма расхода материалов определяется Спецификацией № 2. Остатки материалов подлежат возврату Заказчику. Подрядчик несет ответственность за сохранность переданных материалов."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Материалы для выполнения работ предоставляет Заказчик."

        Ответ:
        {
          "materials_reporting": "not_mentioned",
          "materials_reporting_display": "Обязанность отчётности по материалам прямо не установлена.",
          "consumption_norm": "not_specified",
          "consumption_norm_display": "Норма расхода материалов прямо не определена.",
          "leftover_return": "not_defined",
          "leftover_return_display": "Условия возврата остатков материалов не установлены.",
          "materials_liability": "not_specified",
          "materials_liability_display": "Режим сохранности материалов прямо не урегулирован.",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату об отчётности по материалам.
        2. Найди прямую цитату о норме расхода.
        3. Найди прямую цитату о возврате остатков.
        4. Найди прямую цитату о сохранности или ответственности за материалы.
        5. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "materials_reporting": "<required / not_mentioned / not_defined>",
          "materials_reporting_display": "<понятное описание для юриста>",
          "consumption_norm": "<specified / not_specified / not_defined>",
          "consumption_norm_display": "<понятное описание для юриста>",
          "leftover_return": "<required / not_required / not_defined>",
          "leftover_return_display": "<понятное описание для юриста>",
          "materials_liability": "<specified / not_specified / not_defined>",
          "materials_liability_display": "<понятное описание для юриста>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 620

    retrieval:
      retrieval_profile: "scope_of_work_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "давальческие материалы материалы заказчика норма расхода отчет об использовании возврат остатков сохранность материалов ответственность за материалы"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - definitions
      negative_keywords:
        - "цена"
        - "срок оплаты"
        - "неустойка"
        - "НДС"
        - "форс-мажор"
        - "подсудность"
        - "конфиденциальность"
      position_bias:
        preferred_range: [0.10, 0.70]
        boost: 0.18
        scope: segment
      context_k: 5
      max_chunks: 6
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
        - "technical_specification"
      excluded_segment_types:
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "definitions"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      presence_signal:
        field: "customer_materials_regime_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_max_tokens: 450

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора подряда условия
        использования материалов заказчика.
        Не анализируй цену, сроки, приёмку, гарантию, штрафы или налоги.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. customer_materials_regime_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (materials_reporting, consumption_norm, leftover_return,
              materials_liability) ≠ "not_defined";
           - "missing" — если все четыре содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - materials_reporting = "not_defined";
           - consumption_norm = "not_defined";
           - leftover_return = "not_defined";
           - materials_liability = "not_defined";
           - materials_reporting_display = "Режим отчётности по материалам в предоставленном контексте не установлен.";
           - consumption_norm_display = "Норма расхода материалов в предоставленном контексте не установлена.";
           - leftover_return_display = "Условия возврата остатков материалов в предоставленном контексте не установлены.";
           - materials_liability_display = "Режим сохранности материалов в предоставленном контексте не установлен.";
           - не выполняй остальные шаги.

        1. materials_reporting:
           - "required" — если подрядчик прямо обязан отчитываться, вести учёт
             или представлять отчёт об использовании материалов;
           - "not_mentioned" — если материалы заказчика упомянуты, но
             обязанность отчётности прямо не установлена;
           - "not_defined" — если по тексту нельзя установить режим материалов.

        2. materials_reporting_display:
           - если "required": "Подрядчик обязан отчитываться об использовании материалов.";
           - если "not_mentioned": "Обязанность отчётности по материалам прямо не установлена.";
           - если "not_defined": "Режим отчётности по материалам в предоставленном контексте не установлен."

        3. consumption_norm:
           - "specified" — если норма расхода прямо указана или вынесена
             в приложение;
           - "not_specified" — если материалы упомянуты, но норма расхода
             прямо не определена;
           - "not_defined" — если по тексту нельзя установить режим материалов.

        4. consumption_norm_display:
           - если "specified": "Норма расхода материалов определена.";
           - если "not_specified": "Норма расхода материалов прямо не определена.";
           - если "not_defined": "Норма расхода материалов в предоставленном контексте не установлена."

        5. leftover_return:
           - "required" — если остатки должны быть возвращены заказчику;
           - "not_required" — если договор прямо исключает возврат остатков
             либо предусматривает иное распоряжение ими;
           - "not_defined" — если это прямо не установлено.

        6. leftover_return_display:
           - если "required": "Остатки материалов подлежат возврату Заказчику.";
           - если "not_required": "Возврат остатков материалов прямо не предусмотрен.";
           - если "not_defined": "Условия возврата остатков материалов в предоставленном контексте не установлены."

        7. materials_liability:
           - "specified" — если сохранность, хранение или ответственность
             за материалы прямо урегулированы;
           - "not_specified" — если материалы упомянуты, но соответствующий
             режим не урегулирован;
           - "not_defined" — если по тексту нельзя установить режим материалов.

        8. materials_liability_display:
           - если "specified": "Подрядчик несет ответственность за сохранность материалов.";
           - если "not_specified": "Режим сохранности материалов прямо не урегулирован.";
           - если "not_defined": "Режим сохранности материалов в предоставленном контексте не установлен."
        </task>

        <context_rules>
        - Перед остальными полями заполни customer_materials_regime_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все signal-поля = "not_defined", все *_display = соответствующий fallback.
        - Используй только текст договора. Не подставляй обязанности из закона, если они не отражены в тексте договора.
        - materials_liability = "specified" только при прямой формулировке о сохранности, хранении или ответственности.
        - consumption_norm = "specified" только если норма расхода прямо указана или отнесена к приложению.
        - Если в разных фрагментах указаны противоречивые условия — статус → "not_defined", display → "Не удалось определить".
        - Не используй "None", "null" или пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет упоминания материалов заказчика (все материалы
           предоставляет подрядчик).
           → presence = "missing";
             все signal-поля = "not_defined";
             все *_display = соответствующий fallback.

        2. Материалы упомянуты, но режим не раскрыт.
           "Материалы для выполнения работ предоставляет Заказчик" без
           условий об отчётности, норме, возврате и ответственности.
           → presence = "present";
             materials_reporting = "not_mentioned";
             consumption_norm = "not_specified";
             leftover_return = "not_defined";
             materials_liability = "not_specified".

        3. Противоречие в условиях возврата остатков.
           В одном пункте "остатки возвращаются Заказчику", в другом —
           "остатки материалов переходят в собственность Подрядчика".
           → presence = "unclear";
             leftover_return = "not_defined";
             leftover_return_display = "Не удалось определить".

        4. Отсылка на спецификацию.
           "Норма расхода и порядок учёта материалов определяются
           Спецификацией № 2 (Приложение к договору)."
           → presence = "present";
             consumption_norm = "specified";
             consumption_norm_display отражает отсылку к приложению;
             materials_reporting может быть "required" или "not_mentioned"
             в зависимости от других пунктов.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для customer_materials_regime_check_presence используй только: "present", "missing", "unclear".
        - Для materials_reporting используй только: "required", "not_mentioned", "not_defined".
        - Для consumption_norm используй только: "specified", "not_specified", "not_defined".
        - Для leftover_return используй только: "required", "not_required", "not_defined".
        - Для materials_liability используй только: "specified", "not_specified", "not_defined".
        - Fallback при отсутствии данных:
          * materials_reporting_display → "Режим отчётности по материалам в предоставленном контексте не установлен.";
          * consumption_norm_display → "Норма расхода материалов в предоставленном контексте не установлена.";
          * leftover_return_display → "Условия возврата остатков материалов в предоставленном контексте не установлены.";
          * materials_liability_display → "Режим сохранности материалов в предоставленном контексте не установлен.".
        - Fallback при противоречии или неоднозначности:
          * все *_display → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "customer_materials_regime_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования материалов заказчика. Внутреннее агрегатное signal-поле."
          required: true

        - name: "materials_reporting"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["required", "not_mentioned", "not_defined"]
          description: "Обязанность подрядчика отчитываться о расходовании материалов."
          required: true
          display_in_grid: false

        - name: "materials_reporting_display"
          type: "string"
          presentation: "fact"
          label: "Отчёт по материалам"
          description: "Понятное для юриста описание обязанности отчётности по материалам."
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "consumption_norm"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["specified", "not_specified", "not_defined"]
          description: "Определена ли норма расхода материалов заказчика."
          required: true
          display_in_grid: false

        - name: "consumption_norm_display"
          type: "string"
          presentation: "fact"
          label: "Норма расхода"
          description: "Понятное для юриста описание нормы расхода материалов."
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "leftover_return"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["required", "not_required", "not_defined"]
          description: "Обязанность вернуть остатки материалов заказчику."
          required: true
          display_in_grid: false

        - name: "leftover_return_display"
          type: "string"
          presentation: "fact"
          label: "Возврат остатков"
          description: "Понятное для юриста описание условий возврата остатков материалов."
          required: true
          display_in_grid: true
          display_priority: 3

        - name: "materials_liability"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["specified", "not_specified", "not_defined"]
          description: "Урегулированы ли сохранность или ответственность за материалы."
          required: true
          display_in_grid: false

        - name: "materials_liability_display"
          type: "string"
          presentation: "fact"
          label: "Сохранность материалов"
          description: "Понятное для юриста описание режима сохранности материалов."
          required: true
          display_in_grid: true
          display_priority: 4

      store_payload: true

  - id: customer_unilateral_refusal_check
    name: "Право заказчика на односторонний отказ (ст. 717 ГК РФ): сохранено или ограничено"
    description: >
      Фактографическая проверка того, как договор регулирует право заказчика
      на односторонний отказ: сохранено ли право, ограничено ли оно,
      установлен ли штраф и каков его размер.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "право отказаться от исполнения"
        - "в любое время до сдачи"
        - "оплатив фактически выполненное"
        - "уплатив часть цены"
        - "запрет на отказ"
        - "штраф за расторжение"
        - "неустойка за отказ"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)заказчик.*вправе.*отказаться.*в\\s+любое\\s+время"
        - "(?i)ст\\.?\\s*717\\s+ГК\\s+РФ"
        - "(?i)штраф.*за\\s+(расторжение|отказ).*договор"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор подряда по ст. 717 ГК РФ.
        Проверяется только один вопрос: как договор регулирует право заказчика
        на односторонний отказ до сдачи результата работ.

        Нормативный ориентир:
        - ст. 717 ГК РФ
        - ст. 422 ГК РФ

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Сохранено, ограничено, исключено или не упомянуто право заказчика
           на односторонний отказ.
        2. Установлен ли штраф или неустойка за такой отказ.
        3. Указан ли размер штрафа или неустойки.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined".
        4. Если текстового значения нет — возвращай "Данные не определены".
        5. Не используй "None", "null", "not_defined" или пустые строки.
        6. В evidence включай только текст договора.
        7. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        8. refusal_right_status = "preserved" только если право на отказ
           прямо сохранено без штрафных или запретительных ограничений,
           кроме оплаты фактически выполненного.
        9. refusal_right_status = "restricted" если право формально есть,
           но связано со штрафом, санкцией или дополнительными барьерами.
        10. refusal_right_status = "excluded" только если договор прямо
            запрещает отказ или фактически исключает его.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — данные определены:
        Фрагмент:
        "Заказчик вправе отказаться от исполнения договора в любое время
        до сдачи результата работ, оплатив Подрядчику фактически выполненные
        работы. В случае такого отказа штраф не взимается."

        Ответ:
        {
          "refusal_right_status": "preserved",
          "refusal_right_status_display": "Право заказчика на односторонний отказ сохранено.",
          "penalty_for_refusal": "no",
          "penalty_for_refusal_display": "Штраф за односторонний отказ не предусмотрен.",
          "penalty_amount_status": "not_defined",
          "penalty_amount_value": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 8.3",
              "quote": "Заказчик вправе отказаться от исполнения договора в любое время до сдачи результата работ, оплатив Подрядчику фактически выполненные работы. В случае такого отказа штраф не взимается."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Договор может быть расторгнут по соглашению сторон."

        Ответ:
        {
          "refusal_right_status": "not_mentioned",
          "refusal_right_status_display": "Право заказчика на односторонний отказ прямо не урегулировано.",
          "penalty_for_refusal": "not_defined",
          "penalty_for_refusal_display": "Условия о штрафе за односторонний отказ не установлены.",
          "penalty_amount_status": "not_defined",
          "penalty_amount_value": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о праве заказчика на односторонний отказ.
        2. Найди прямую цитату о штрафе или неустойке за отказ.
        3. Найди прямую цитату о размере штрафа или неустойки.
        4. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "refusal_right_status": "<preserved / restricted / excluded / not_mentioned / not_defined>",
          "refusal_right_status_display": "<понятное описание для юриста>",
          "penalty_for_refusal": "<yes / no / not_defined>",
          "penalty_for_refusal_display": "<понятное описание для юриста>",
          "penalty_amount_status": "<defined / not_defined>",
          "penalty_amount_value": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 620

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "право отказаться от исполнения в любое время до сдачи оплатив фактически выполненное штраф за расторжение неустойка за отказ ст 717"
      retrieval_profile: "termination_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
      negative_keywords:
        - "цена"
        - "НДС"
        - "гарантия"
        - "форс-мажор"
        - "подсудность"
        - "конфиденциальность"
        - "субподряд"
      position_bias:
        preferred_range: [0.45, 1.0]
        boost: 0.18
        scope: segment
      context_k: 5
      max_chunks: 6
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      presence_signal:
        field: "customer_unilateral_refusal_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_max_tokens: 500

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора подряда условия
        о праве заказчика на односторонний отказ, наличии штрафа и его размере.
        Не анализируй общие основания расторжения, если они не относятся прямо
        к праву заказчика на отказ по ст. 717 ГК РФ.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. customer_unilateral_refusal_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (refusal_right_status, penalty_for_refusal,
              penalty_amount_status) ≠ "not_defined";
           - "missing" — если все три содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - refusal_right_status = "not_defined";
           - penalty_for_refusal = "not_defined";
           - penalty_amount_status = "not_defined";
           - refusal_right_status_display = "Статус права заказчика на односторонний отказ в предоставленном контексте не установлен.";
           - penalty_for_refusal_display = "Условия о штрафе за односторонний отказ не установлены.";
           - penalty_amount_value = "Данные не определены";
           - не выполняй остальные шаги.

        1. refusal_right_status:
           - "preserved" — если право на отказ прямо сохранено без штрафных
             ограничений, кроме оплаты фактически выполненного;
           - "restricted" — если право есть, но сопровождается штрафом,
             неустойкой или дополнительными ограничениями;
           - "excluded" — если договор прямо запрещает такой отказ;
           - "not_mentioned" — если в договоре есть раздел о расторжении,
             но право заказчика на такой отказ прямо не урегулировано;
           - "not_defined" — если по тексту это нельзя установить.

        2. refusal_right_status_display:
           - если "preserved": "Право заказчика на односторонний отказ сохранено.";
           - если "restricted": "Право заказчика на односторонний отказ ограничено штрафом или санкцией.";
           - если "excluded": "Право заказчика на односторонний отказ исключено.";
           - если "not_mentioned": "Право заказчика на односторонний отказ прямо не урегулировано.";
           - если "not_defined": "Статус права заказчика на односторонний отказ в предоставленном контексте не установлен."

        3. penalty_for_refusal:
           - "yes" — если штраф, неустойка или иная санкция за отказ
             прямо установлены;
           - "no" — если прямо указано, что штрафа нет, либо право
             реализуется только с оплатой фактически выполненного без
             отдельной санкции;
           - "not_defined" — если это прямо не установлено.

        4. penalty_for_refusal_display:
           - если "yes": "Штраф за односторонний отказ предусмотрен.";
           - если "no": "Штраф за односторонний отказ не предусмотрен.";
           - если "not_defined": "Условия о штрафе за односторонний отказ не установлены."

        5. penalty_amount_status:
           - "defined" — если размер штрафа или неустойки прямо указан;
           - "not_defined" — если размер прямо не указан.

        6. penalty_amount_value:
           Сумма, процент или иная формулировка размера санкции.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни customer_unilateral_refusal_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все signal-поля = "not_defined", все *_display/*_value = соответствующий fallback.
        - Используй только текст договора. Не подставляй нормы закона вместо текста договора.
        - Не определяй статус права на отказ на основании диспозитивных норм ГК — только по прямому тексту договора.
        - Если в разных фрагментах указаны противоречивые условия (например, в одном пункте право сохранено, в другом — штраф) — presence = "unclear", refusal_right_status = "restricted" (если штраф подтверждён).
        - Не используй "None", "null" или пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни права на односторонний отказ, ни штрафа,
           ни неустойки за отказ (только общее расторжение по соглашению).
           → presence = "missing";
             все signal-поля = "not_defined";
             все *_display/*_value = соответствующий fallback.

        2. Право сохранено без штрафа.
           "Заказчик вправе отказаться в любое время до сдачи результата,
           оплатив фактически выполненное. Штраф не взимается."
           → presence = "present";
             refusal_right_status = "preserved";
             penalty_for_refusal = "no";
             penalty_amount_status = "not_defined".

        3. Право ограничено штрафом.
           "Заказчик вправе отказаться от договора, уплатив Подрядчику
           неустойку в размере 10% от цены договора."
           → presence = "present";
             refusal_right_status = "restricted";
             penalty_for_refusal = "yes";
             penalty_amount_status = "defined";
             penalty_amount_value = "10% от цены договора".

        4. Право исключено.
           "Заказчик не вправе в одностороннем порядке отказаться от
           исполнения настоящего договора до завершения всех работ."
           → presence = "present";
             refusal_right_status = "excluded";
             penalty_for_refusal = "not_defined";
             penalty_amount_status = "not_defined".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для customer_unilateral_refusal_check_presence используй только: "present", "missing", "unclear".
        - Для refusal_right_status используй только: "preserved", "restricted", "excluded", "not_mentioned", "not_defined".
        - Для penalty_for_refusal используй только: "yes", "no", "not_defined".
        - Для penalty_amount_status используй только: "defined", "not_defined".
        - Fallback при отсутствии данных:
          * refusal_right_status_display → "Статус права заказчика на односторонний отказ в предоставленном контексте не установлен.";
          * penalty_for_refusal_display → "Условия о штрафе за односторонний отказ не установлены.";
          * penalty_amount_value → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * penalty_amount_value → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "customer_unilateral_refusal_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования права заказчика на односторонний отказ. Внутреннее агрегатное signal-поле."
          required: true

        - name: "refusal_right_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["preserved", "restricted", "excluded", "not_mentioned", "not_defined"]
          description: "Статус права заказчика на односторонний отказ."
          required: true
          display_in_grid: false

        - name: "refusal_right_status_display"
          type: "string"
          presentation: "fact"
          label: "Право на отказ"
          description: "Понятное для юриста описание статуса права заказчика на односторонний отказ."
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "penalty_for_refusal"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Наличие штрафа или неустойки за отказ."
          required: true
          display_in_grid: false

        - name: "penalty_for_refusal_display"
          type: "string"
          presentation: "fact"
          label: "Штраф за отказ"
          description: "Понятное для юриста описание наличия штрафа за односторонний отказ."
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "penalty_amount_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания размера штрафа за отказ."
          required: true
          display_in_grid: false

        - name: "penalty_amount_value"
          type: "string"
          presentation: "fact"
          label: "Размер штрафа"
          description: "Размер штрафа или неустойки за односторонний отказ."
          required: true
          display_in_grid: true
          display_priority: 3

      store_payload: true

  - id: quality_standards_and_conformity_check
    name: "Стандарты качества и критерии соответствия результата (ст. 721 ГК РФ)"
    description: >
      Фактографическая проверка стандартов качества результата, типа стандарта,
      критериев приёмки и способа оценки соответствия результата.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "качество работ"
        - "требования к качеству"
        - "стандарт качества"
        - "ГОСТ"
        - "ТУ"
        - "технические условия"
        - "соответствие образцу"
        - "критерии приёмки"
        - "обычно предъявляемые требования"
        - "профессиональный стандарт"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)качеств(о|у|а)\\s+работ.*соответств"
        - "(?i)\\bГОСТ\\s+\\d"
        - "(?i)ст\\.?\\s*721\\s+ГК\\s+РФ"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор подряда по ст. 721 ГК РФ.
        Проверяется только один вопрос: определены ли стандарты качества
        результата и способ проверки соответствия.

        Нормативный ориентир:
        - ст. 721 ГК РФ

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли ссылка на стандарты качества.
        2. Какой тип стандарта качества указан.
        3. Определены ли критерии приёмки или соответствия результата.
        4. Как установлен способ проверки соответствия результата.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined".
        4. Если текстового значения нет — возвращай "Данные не определены".
        5. Не используй "None", "null", "not_defined" или пустые строки.
        6. В evidence включай только текст договора.
        7. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        8. standards_type выбирай только по прямому тексту договора.
        9. conformity_assessment_method = "not_defined" если критерии качества
           есть, но способ проверки прямо не назван.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — данные определены:
        Фрагмент:
        "Качество работ должно соответствовать ГОСТ 23118-2012 и Техническому
        заданию (Приложение № 1). Приемка осуществляется путем визуального
        осмотра и контрольных измерений. Результат считается соответствующим
        при соблюдении параметров, указанных в Приложении № 1."

        Ответ:
        {
          "quality_standards_referenced": "yes",
          "quality_standards_referenced_display": "Ссылка на стандарты качества присутствует.",
          "standards_type": "gost",
          "standards_type_display": "ГОСТ.",
          "acceptance_criteria_defined": "yes",
          "acceptance_criteria_defined_display": "Критерии приёмки определены.",
          "conformity_assessment_method": "inspection",
          "conformity_assessment_method_display": "Визуальный осмотр и контрольные измерения.",
          "evidence": [
            {
              "clause_ref": "п. 2.4",
              "quote": "Качество работ должно соответствовать ГОСТ 23118-2012 и Техническому заданию (Приложение № 1). Приемка осуществляется путем визуального осмотра и контрольных измерений."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Подрядчик обязуется выполнить работы качественно и в срок."

        Ответ:
        {
          "quality_standards_referenced": "no",
          "quality_standards_referenced_display": "Конкретный стандарт качества не указан.",
          "standards_type": "not_defined",
          "standards_type_display": "Тип стандарта качества не установлен.",
          "acceptance_criteria_defined": "no",
          "acceptance_criteria_defined_display": "Критерии приёмки прямо не определены.",
          "conformity_assessment_method": "not_defined",
          "conformity_assessment_method_display": "Способ проверки соответствия не установлен.",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о стандарте качества, ТЗ, образце или ином ориентире.
        2. Найди прямую цитату о критериях соответствия результата.
        3. Найди прямую цитату о способе проверки соответствия.
        4. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "quality_standards_referenced": "<yes / no / not_defined>",
          "quality_standards_referenced_display": "<понятное описание для юриста>",
          "standards_type": "<gost / tu / contract_specific / sample_based / general / not_defined>",
          "standards_type_display": "<понятное описание для юриста>",
          "acceptance_criteria_defined": "<yes / no / not_defined>",
          "acceptance_criteria_defined_display": "<понятное описание для юриста>",
          "conformity_assessment_method": "<testing / inspection / certification / not_specified / not_defined>",
          "conformity_assessment_method_display": "<понятное описание для юриста>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 620

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "качество работ требования к качеству стандарт качества ГОСТ ТУ технические условия соответствие образцу критерии приемки"
      retrieval_profile: "warranties_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
      negative_keywords:
        - "цена"
        - "аванс"
        - "неустойка"
        - "штраф"
        - "НДС"
        - "форс-мажор"
        - "подсудность"
      position_bias:
        preferred_range: [0.10, 0.75]
        boost: 0.18
        scope: segment
      context_k: 5
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
        - "technical_specification"
      excluded_segment_types:
        - "price_list"
      preferred_clause_functions:
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      presence_signal:
        field: "quality_standards_and_conformity_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_max_tokens: 450

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора подряда сведения
        о стандартах качества, критериях приёмки и способе проверки соответствия.
        Не анализируй гарантию, штрафы, сроки, оплату или налоги.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. quality_standards_and_conformity_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (quality_standards_referenced, acceptance_criteria_defined,
              conformity_assessment_method) ≠ "not_defined";
           - "missing" — если все три содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - quality_standards_referenced = "not_defined";
           - standards_type = "not_defined";
           - acceptance_criteria_defined = "not_defined";
           - conformity_assessment_method = "not_defined";
           - все *_display = соответствующий fallback;
           - не выполняй остальные шаги.

        1. quality_standards_referenced:
           - "yes" — если есть прямая ссылка на ГОСТ, ТУ, ТЗ, образец,
             спецификацию или иной стандарт качества;
           - "no" — если качество упомянуто, но конкретный ориентир не задан;
           - "not_defined" — если по тексту это нельзя установить.

        2. quality_standards_referenced_display:
           - если "yes": "Ссылка на стандарты качества присутствует.";
           - если "no": "Конкретный стандарт качества не указан.";
           - если "not_defined": "Наличие ссылки на стандарты качества в предоставленном контексте не установлено."

        3. standards_type:
           - "gost" — прямо указан ГОСТ;
           - "tu" — прямо указаны технические условия;
           - "contract_specific" — критерии раскрыты в ТЗ, спецификации, приложении;
           - "sample_based" — качество определяется утвержденным образцом;
           - "general" — общая ссылка на обычно предъявляемые требования;
           - "not_defined" — тип стандарта не установлен.

        4. standards_type_display:
           - если "gost": "ГОСТ.";
           - если "tu": "Технические условия (ТУ).";
           - если "contract_specific": "Договорные критерии (ТЗ, спецификация, приложение).";
           - если "sample_based": "Соответствие утвержденному образцу.";
           - если "general": "Общие требования к качеству.";
           - если "not_defined": "Тип стандарта качества не установлен."

        5. acceptance_criteria_defined:
           - "yes" — если критерии соответствия или приёмки результата
             прямо определены;
           - "no" — если качество упомянуто, но критерии приёмки
             прямо не определены;
           - "not_defined" — если это нельзя установить.

        6. acceptance_criteria_defined_display:
           - если "yes": "Критерии приёмки определены.";
           - если "no": "Критерии приёмки прямо не определены.";
           - если "not_defined": "Наличие критериев приёмки в предоставленном контексте не установлено."

        7. conformity_assessment_method:
           - "testing" — испытания, тесты;
           - "inspection" — осмотр, измерения, сверка параметров;
           - "certification" — подтверждение сертификатом, протоколом;
           - "not_specified" — критерии есть, но способ проверки не назван;
           - "not_defined" — по тексту это нельзя установить.

        8. conformity_assessment_method_display:
           - если "testing": "Испытания или тестирование.";
           - если "inspection": "Визуальный осмотр и контрольные измерения.";
           - если "certification": "Подтверждение сертификатом или протоколом.";
           - если "not_specified": "Способ проверки прямо не назван.";
           - если "not_defined": "Способ проверки соответствия не установлен."
        </task>

        <context_rules>
        - Перед остальными полями заполни quality_standards_and_conformity_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все signal-поля = "not_defined", все *_display = соответствующий fallback.
        - Используй только текст договора. Не подставляй нормы закона вместо текста договора.
        - standards_type выбирай только по прямому тексту договора.
        - conformity_assessment_method = "not_defined" если критерии качества есть, но способ проверки прямо не назван.
        - Общая фраза "Подрядчик обязуется выполнить работы качественно" без конкретного стандарта — quality_standards_referenced = "no", standards_type = "not_defined".
        - Если в разных фрагментах указаны противоречивые стандарты — presence = "unclear", соответствующие поля = "not_defined".
        - Не используй "None", "null" или пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни стандартов качества, ни критериев приёмки,
           ни способа проверки (только общая фраза о качестве).
           → presence = "missing";
             все signal-поля = "not_defined";
             все *_display = соответствующий fallback.

        2. Стандарт указан, но критерии не определены.
           "Качество работ должно соответствовать ГОСТ 23118-2012"
           без указания критериев приёмки и способа проверки.
           → presence = "present";
             quality_standards_referenced = "yes";
             standards_type = "gost";
             acceptance_criteria_defined = "no";
             conformity_assessment_method = "not_defined".

        3. Противоречие в стандартах.
           В одном пункте "соответствие ГОСТ 23118-2012", в другом —
           "соответствие ТУ 5284-001-12345678".
           → presence = "unclear";
             standards_type = "not_defined";
             standards_type_display = "Не удалось определить".

        4. Отсылка на ТЗ/приложение.
           "Качество работ определяется в соответствии с Техническим
           заданием (Приложение №1)" без раскрытия в основном тексте.
           → presence = "present";
             quality_standards_referenced = "yes";
             standards_type = "contract_specific";
             acceptance_criteria_defined зависит от содержания ТЗ в контексте.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для quality_standards_and_conformity_check_presence используй только: "present", "missing", "unclear".
        - Для quality_standards_referenced используй только: "yes", "no", "not_defined".
        - Для standards_type используй только: "gost", "tu", "contract_specific", "sample_based", "general", "not_defined".
        - Для acceptance_criteria_defined используй только: "yes", "no", "not_defined".
        - Для conformity_assessment_method используй только: "testing", "inspection", "certification", "not_specified", "not_defined".
        - Fallback при отсутствии данных:
          * quality_standards_referenced_display → "Наличие ссылки на стандарты качества в предоставленном контексте не установлено.";
          * standards_type_display → "Тип стандарта качества не установлен.";
          * acceptance_criteria_defined_display → "Наличие критериев приёмки в предоставленном контексте не установлено.";
          * conformity_assessment_method_display → "Способ проверки соответствия не установлен.".
        - Fallback при противоречии или неоднозначности:
          * все *_display → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "quality_standards_and_conformity_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования стандартов качества. Внутреннее агрегатное signal-поле."
          required: true

        - name: "quality_standards_referenced"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Есть ли ссылка на стандарты качества."
          required: true
          display_in_grid: false

        - name: "quality_standards_referenced_display"
          type: "string"
          presentation: "fact"
          label: "Стандарты качества"
          description: "Понятное для юриста описание наличия ссылки на стандарты качества."
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "standards_type"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["gost", "tu", "contract_specific", "sample_based", "general", "not_defined"]
          description: "Тип стандарта качества."
          required: true
          display_in_grid: false

        - name: "standards_type_display"
          type: "string"
          presentation: "fact"
          label: "Тип стандарта"
          description: "Понятное для юриста описание типа стандарта качества."
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "acceptance_criteria_defined"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Определены ли критерии приёмки или соответствия результата."
          required: true
          display_in_grid: false

        - name: "acceptance_criteria_defined_display"
          type: "string"
          presentation: "fact"
          label: "Критерии приёмки"
          description: "Понятное для юриста описание наличия критериев приёмки."
          required: true
          display_in_grid: true
          display_priority: 3

        - name: "conformity_assessment_method"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["testing", "inspection", "certification", "not_specified", "not_defined"]
          description: "Способ оценки соответствия результата."
          required: true
          display_in_grid: false

        - name: "conformity_assessment_method_display"
          type: "string"
          presentation: "fact"
          label: "Способ проверки"
          description: "Понятное для юриста описание способа проверки соответствия результата."
          required: true
          display_in_grid: true
          display_priority: 4

      store_payload: true

  - id: parties_identification
    name: "Стороны договора: идентификация подрядчика и заказчика (ст. 432 ГК РФ)"
    description: >
      Фактографическая проверка идентификации подрядчика и заказчика,
      реквизитов сторон, подписантов, оснований полномочий и корпоративного
      одобрения сделки для юридических лиц.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "подрядчик"
        - "заказчик"
        - "именуем"
        - "в лице"
        - "действующего на основании"
        - "крупная сделка"
        - "сделка с заинтересованностью"
        - "одобрение общего собрания"
        - "одобрение совета директоров"
        - "решение единственного участника"
        - "одобрение не требуется"
        - "корпоративное одобрение"
        - "устав"
        - "доверенность"
        - "паспорт"
        - "гражданин"
        - "физическое лицо"
        - "ИНН"
        - "ОГРН"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(подрядчик|заказчик).*именуем"
        - "(?i)крупн(ая|ой)\\s+сделк"
        - "(?i)заинтересованност"
        - "(?i)одобрен(ие|а)"
        - "(?i)действующ[а-яё]+\\s+на\\s+основании"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор подряда по ст. 432 ГК РФ, ст. 182 ГК РФ,
        а также по правилам о корпоративном одобрении для юридических лиц.
        Проверяется только один вопрос: идентификация подрядчика и заказчика,
        подписанты, основания полномочий и корпоративное одобрение.

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Наименование и реквизиты Подрядчика.
        2. Тип Подрядчика.
        3. Кто подписывает от имени Подрядчика и на каком основании.
        4. Наименование и реквизиты Заказчика.
        5. Тип Заказчика.
        6. Кто подписывает от имени Заказчика и на каком основании.
        7. Есть ли указание на корпоративное одобрение сделки или заверение
           о том, что одобрение не требуется.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined".
        4. Если текстового значения нет — возвращай "Данные не определены".
        5. Не используй "None", "null", "not_defined" или пустые строки.
        6. Для физлица, подписывающего лично, используй basis = "personal".
        7. Не выводи корпоративные выводы по умолчанию, если одобрение
           не отражено в тексте договора.
        8. Тип стороны определяй только по прямым идентификационным
           формулировкам договора.
        9. В evidence включай только текст договора.
        10. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — данные определены:
        Фрагмент:
        "Общество с ограниченной ответственностью «Строй-Инвест»,
        ИНН 7700000001, ОГРН 1027700000001, именуемое в дальнейшем
        «Подрядчик», в лице Генерального директора Иванова А.А.,
        действующего на основании Устава, с одной стороны, и гражданин
        Петров Б.Б., паспорт серия 45 00 № 123456, именуемый в дальнейшем
        «Заказчик», с другой стороны, заключили настоящий договор.
        Сделка одобрена решением единственного участника Подрядчика
        от 01.03.2026."

        Ответ:
        {
          "contractor_details_status": "defined",
          "contractor_details_value": "ООО «Строй-Инвест», ИНН 7700000001, ОГРН 1027700000001",
          "contractor_type": "legal_entity",
          "contractor_signatory": "Генеральный директор Иванов А.А.",
          "contractor_signatory_basis": "charter",
          "customer_details_status": "defined",
          "customer_details_value": "Петров Б.Б., паспорт серия 45 00 № 123456",
          "customer_type": "individual",
          "customer_signatory": "Петров Б.Б.",
          "customer_signatory_basis": "personal",
          "corporate_approval_status": "defined",
          "corporate_approval_details": "Сделка одобрена решением единственного участника Подрядчика от 01.03.2026.",
          "evidence": [
            {
              "clause_ref": "преамбула",
              "quote": "Общество с ограниченной ответственностью «Строй-Инвест», ИНН 7700000001, ОГРН 1027700000001, именуемое в дальнейшем «Подрядчик», в лице Генерального директора Иванова А.А., действующего на основании Устава..."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Подрядчик и Заказчик заключили настоящий договор."

        Ответ:
        {
          "contractor_details_status": "not_defined",
          "contractor_details_value": "Данные не определены",
          "contractor_type": "not_defined",
          "contractor_signatory": "Данные не определены",
          "contractor_signatory_basis": "not_defined",
          "customer_details_status": "not_defined",
          "customer_details_value": "Данные не определены",
          "customer_type": "not_defined",
          "customer_signatory": "Данные не определены",
          "customer_signatory_basis": "not_defined",
          "corporate_approval_status": "not_defined",
          "corporate_approval_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о реквизитах Подрядчика.
        2. Найди прямую цитату о подписанте Подрядчика и основании его полномочий.
        3. Найди прямую цитату о реквизитах Заказчика.
        4. Найди прямую цитату о подписанте Заказчика и основании его полномочий.
        5. Найди прямую цитату о корпоративном одобрении или указании,
           что оно не требуется.
        6. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "contractor_details_status": "<defined / not_defined>",
          "contractor_details_value": "<реквизиты или 'Данные не определены'>",
          "contractor_type": "<legal_entity / individual / ip / self_employed / not_defined>",
          "contractor_signatory": "<текст или 'Данные не определены'>",
          "contractor_signatory_basis": "<charter / poa / order / personal / other / not_defined>",
          "customer_details_status": "<defined / not_defined>",
          "customer_details_value": "<реквизиты или 'Данные не определены'>",
          "customer_type": "<legal_entity / individual / ip / self_employed / not_defined>",
          "customer_signatory": "<текст или 'Данные не определены'>",
          "customer_signatory_basis": "<charter / poa / order / personal / other / not_defined>",
          "corporate_approval_status": "<defined / not_defined>",
          "corporate_approval_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 760

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "подрядчик заказчик именуем в лице действующего на основании ИНН ОГРН устав доверенность паспорт гражданин физическое лицо крупная сделка сделка с заинтересованностью одобрение общего собрания совета директоров корпоративное одобрение"
      retrieval_profile: "party_identification_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - representations
        - boilerplate
      negative_keywords:
        - "цена"
        - "срок выполнения"
        - "неустойка"
        - "гарантия"
        - "НДС"
        - "форс-мажор"
        - "предмет договора"
        - "акт приёмки"
        - "спецификация"
        - "техническое задание"
      position_bias:
        preferred_range: [0.0, 0.20]
        boost: 0.30
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "representations"
        - "boilerplate"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.15

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      presence_signal:
        field: "parties_identification_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_max_tokens: 1300

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора подряда сведения
        о подрядчике и заказчике: реквизиты, тип стороны, подписанта,
        основание полномочий и корпоративное одобрение сделки.
        Не анализируй предмет договора, цену, расчёты, сроки, гарантию
        или иные вопросы вне идентификации сторон и полномочий.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. parties_identification_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (contractor_details_status, customer_details_status,
              contractor_signatory_basis, customer_signatory_basis)
             ≠ "not_defined";
           - "missing" — если все четыре содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - все 11 signal-полей = "not_defined";
           - все *_value/*_details = "Данные не определены";
           - все signatory/*_signatory = "Данные не определены";
           - не выполняй остальные шаги.

        1. contractor_details_status:
           - "defined" — если реквизиты Подрядчика прямо указаны;
           - "not_defined" — если не указаны.

        2. contractor_details_value:
           Наименование / ФИО и реквизиты Подрядчика.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        3. contractor_type:
           - "legal_entity" — ООО, АО, компания, учреждение;
           - "individual" — гражданин, физическое лицо;
           - "ip" — индивидуальный предприниматель;
           - "self_employed" — самозанятый, плательщик НПД;
           - "not_defined" — тип прямо не установлен.

        4. contractor_signatory:
           ФИО и должность подписанта Подрядчика.
           Если данных нет — "Данные не определены".

        5. contractor_signatory_basis:
           - "charter" — устав;
           - "poa" — доверенность;
           - "order" — приказ;
           - "personal" — физлицо/ИП/самозанятый подписывает лично;
           - "other" — иное основание;
           - "not_defined" — основание не установлено.

        6. customer_details_status:
           По тем же правилам, что и для Подрядчика.

        7. customer_details_value:
           По тем же правилам, что и для Подрядчика.

        8. customer_type:
           По тем же правилам, что и для Подрядчика.

        9. customer_signatory:
           По тем же правилам, что и для Подрядчика.

        10. customer_signatory_basis:
            По тем же правилам, что и для Подрядчика.

        11. corporate_approval_status:
            - "defined" — если прямо указано корпоративное одобрение сделки
              или заверение, что оно не требуется;
            - "not_defined" — если ни того, ни другого прямо нет.

        12. corporate_approval_details:
            Текст корпоративного одобрения или указания, что оно не требуется.
            Если данных нет — "Данные не определены".
        </task>

        <context_rules>
        - Перед остальными полями заполни parties_identification_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все signal-поля = "not_defined", все *_value/*_details = "Данные не определены".
        - Используй только текст договора. Не подставляй нормы закона вместо текста договора.
        - Не смешивай сведения о Подрядчике и Заказчике.
        - Не подставляй корпоративные требования, если они не отражены в тексте договора.
        - Тип стороны определяй только по прямым идентификационным формулировкам.
        - Если физлицо/ИП/самозанятый подписывает договор лично и это прямо видно из текста — basis = "personal".
        - Если в разных фрагментах указаны разные реквизиты для одной стороны — status → "not_defined", value → "Не удалось определить".
        - Если указаны только обозначения "Подрядчик"/"Заказчик" без реквизитов — status = "not_defined".
        - Не используй "None", "null" или пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни реквизитов, ни подписантов, ни корпоративного
           одобрения.
           → presence = "missing";
             все signal-поля = "not_defined";
             все *_value/*_details = "Данные не определены".

        2. Только роли без идентификации.
           "Подрядчик и Заказчик заключили настоящий договор" без указания
           реквизитов, ФИО и подписантов.
           → presence = "present";
             все *_status = "not_defined";
             все *_value = "Данные не определены".

        3. Противоречие в реквизитах.
           В одном месте "ООО «Альфа», ИНН 7700000001", в другом —
           "ООО «Альфа», ИНН 7800000002".
           → presence = "unclear";
             contractor_details_status = "not_defined";
             contractor_details_value = "Не удалось определить".

        4. Физлицо или ИП подписывает лично.
           "Петров Б.Б., паспорт 45 00 № 123456, именуемый Заказчик"
           без указания представителя.
           → presence = "present";
             customer_type = "individual" (или "ip" для ИП);
             customer_signatory = "Петров Б.Б.";
             customer_signatory_basis = "personal".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для parties_identification_presence используй только: "present", "missing", "unclear".
        - Для *_status используй только: "defined", "not_defined".
        - Для *_type используй только: "legal_entity", "individual", "ip", "self_employed", "not_defined".
        - Для *_signatory_basis используй только: "charter", "poa", "order", "personal", "other", "not_defined".
        - Fallback при отсутствии данных:
          * все *_value → "Данные не определены";
          * все signatory/*_signatory → "Данные не определены";
          * corporate_approval_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_value → "Не удалось определить";
          * corporate_approval_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "parties_identification_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие идентификации сторон / полномочий. Внутреннее агрегатное signal-поле."
          required: true

        - name: "contractor_details_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения реквизитов Подрядчика."
          required: true
          display_in_grid: false

        - name: "contractor_details_value"
