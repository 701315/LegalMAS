      store_payload: true

  - id: penalty_for_payment_delay_customer
    name: "Неустойка за просрочку оплаты заказчиком (ст. 395 ГК РФ)"
    description: >
      Фактографическая проверка наличия договорной санкции за просрочку оплаты
      заказчиком, её вида и формулировки размера.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "неустойка за просрочку оплаты"
        - "пени за задержку оплаты"
        - "проценты по ст. 395"
        - "штраф за неоплату"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)за\\s+нарушение\\s+сроков.*оплат.*заказчик.*уплачивает"
        - "(?i)ст\\.?\\s*395\\s+ГК\\s+РФ"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор подряда по ст. 395 ГК РФ.
        Проверяется только один вопрос: есть ли в договоре санкция
        за просрочку оплаты заказчиком и как она сформулирована.

        Нормативный ориентир:
        - ст. 395 ГК РФ
        - ст. 330 ГК РФ
        - ст. 711 ГК РФ

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Предусмотрена ли санкция за просрочку оплаты заказчиком.
        2. Какой вид расчёта санкции указан.
        3. Как сформулирован размер санкции.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined".
        4. Если текстового значения нет — возвращай "Данные не определены".
        5. Не используй "None", "null", "not_defined" или пустые строки.
        6. customer_payment_delay_penalty_present = "yes" только если санкция
           за просрочку оплаты прямо установлена договором.
        7. customer_payment_delay_penalty_basis определяй только по прямой
           формулировке способа расчёта.
        8. customer_payment_delay_penalty_rate заполняй только по прямому тексту
           о размере или формуле санкции.
        9. В evidence включай только текст договора.
        10. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — данные определены:
        Фрагмент:
        "За нарушение срока оплаты Заказчик уплачивает Подрядчику пеню
        в размере 0,1% от суммы просроченного платежа за каждый день
        просрочки."

        Ответ:
        {
          "customer_payment_delay_penalty_present": "yes",
          "customer_payment_delay_penalty_present_display": "Санкция за просрочку оплаты заказчиком предусмотрена.",
          "customer_payment_delay_penalty_basis": "percent_per_day",
          "customer_payment_delay_penalty_basis_display": "Процент за каждый день просрочки.",
          "customer_payment_delay_penalty_rate": "0,1% от суммы просроченного платежа за каждый день просрочки.",
          "evidence": [
            {
              "clause_ref": "п. 5.4",
              "quote": "За нарушение срока оплаты Заказчик уплачивает Подрядчику пеню в размере 0,1% от суммы просроченного платежа за каждый день просрочки."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Оплата производится в сроки, предусмотренные договором."

        Ответ:
        {
          "customer_payment_delay_penalty_present": "not_defined",
          "customer_payment_delay_penalty_present_display": "Санкция за просрочку оплаты заказчиком в предоставленном контексте не установлена.",
          "customer_payment_delay_penalty_basis": "not_defined",
          "customer_payment_delay_penalty_basis_display": "Способ расчёта санкции не установлен.",
          "customer_payment_delay_penalty_rate": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о санкции за просрочку оплаты.
        2. Найди прямую цитату о способе расчёта санкции.
        3. Найди прямую цитату о размере санкции.
        4. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "customer_payment_delay_penalty_present": "<yes / no / not_defined>",
          "customer_payment_delay_penalty_present_display": "<понятное описание для юриста>",
          "customer_payment_delay_penalty_basis": "<percent_per_day / fixed_amount / article_395_reference / mixed / other / not_defined>",
          "customer_payment_delay_penalty_basis_display": "<понятное описание для юриста>",
          "customer_payment_delay_penalty_rate": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 540

    retrieval:
      retrieval_profile: "liability_cap_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "неустойка за просрочку оплаты пени за задержку оплаты проценты по ст 395 штраф за неоплату заказчик"
      preferred_unit_types:
        - payment_term
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
      negative_keywords:
        - "срок выполнения работ"
        - "неустойка подрядчика"
        - "гарантия"
        - "НДС"
        - "форс-мажор"
        - "подсудность"
      position_bias:
        preferred_range: [0.20, 0.90]
        boost: 0.18
        scope: segment
      context_k: 5
      max_chunks: 6
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "price_list"
      preferred_clause_functions:
        - obligations
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 550

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      presence_signal:
        field: "penalty_for_payment_delay_customer_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_max_tokens: 400

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора подряда условия
        о санкции за просрочку оплаты заказчиком.
        Не анализируй санкции за просрочку подрядчика, гарантию, налоги
        или подсудность.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. penalty_for_payment_delay_customer_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (customer_payment_delay_penalty_present,
              customer_payment_delay_penalty_basis) ≠ "not_defined";
           - "missing" — если оба содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - customer_payment_delay_penalty_present = "not_defined";
           - customer_payment_delay_penalty_basis = "not_defined";
           - customer_payment_delay_penalty_present_display = "Санкция за просрочку оплаты заказчиком в предоставленном контексте не установлена.";
           - customer_payment_delay_penalty_basis_display = "Способ расчёта санкции не установлен.";
           - customer_payment_delay_penalty_rate = "Данные не определены";
           - не выполняй остальные шаги.

        1. customer_payment_delay_penalty_present:
           - "yes" — если санкция за просрочку оплаты заказчиком прямо установлена;
           - "no" — если договор прямо исключает такую санкцию;
           - "not_defined" — если по тексту это нельзя установить.

        2. customer_payment_delay_penalty_present_display:
           - если "yes": "Санкция за просрочку оплаты заказчиком предусмотрена.";
           - если "no": "Санкция за просрочку оплаты заказчиком прямо исключена.";
           - если "not_defined": "Санкция за просрочку оплаты заказчиком в предоставленном контексте не установлена."

        3. customer_payment_delay_penalty_basis:
           - "percent_per_day" — процент за день или иной период просрочки;
           - "fixed_amount" — фиксированная сумма;
           - "article_395_reference" — прямая отсылка к процентам по ст. 395 ГК РФ;
           - "mixed" — сочетание нескольких формул;
           - "other" — иной способ расчёта;
           - "not_defined" — способ расчёта не установлен.

        4. customer_payment_delay_penalty_basis_display:
           - если "percent_per_day": "Процент за каждый день просрочки.";
           - если "fixed_amount": "Фиксированная сумма.";
           - если "article_395_reference": "Проценты по ст. 395 ГК РФ.";
           - если "mixed": "Смешанный расчёт (несколько формул).";
           - если "other": "Иной способ расчёта.";
           - если "not_defined": "Способ расчёта санкции не установлен."

        5. customer_payment_delay_penalty_rate:
            Формулировка размера или формулы санкции по прямому тексту
            договора.
            Если данных нет — "Данные не определены".
            Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни penalty_for_payment_delay_customer_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все signal-поля = "not_defined", все *_display = соответствующий fallback, customer_payment_delay_penalty_rate = "Данные не определены".
        - Используй только текст договора. Не подставляй нормы закона вместо текста договора.
        - Если договор отсылает к ст. 395 ГК РФ без конкретной ставки — customer_payment_delay_penalty_basis = "article_395_reference", customer_payment_delay_penalty_rate отражает отсылку.
        - Общая фраза "Стороны несут ответственность в соответствии с законодательством РФ" без конкретной санкции — customer_payment_delay_penalty_present = "not_defined".
        - Если в разных фрагментах указаны противоречивые размеры — presence = "unclear", customer_payment_delay_penalty_present = "not_defined".
        - Не используй "None", "null" или пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни неустойки за просрочку оплаты, ни пени,
           ни процентов по ст. 395 (только общая фраза об ответственности).
           → presence = "missing";
             все signal-поля = "not_defined";
             все *_display = соответствующий fallback;
             customer_payment_delay_penalty_rate = "Данные не определены".

        2. Отсылка к ст. 395 без конкретной ставки.
           "За просрочку оплаты Заказчик уплачивает проценты
           в соответствии со ст. 395 ГК РФ."
           → presence = "present";
             customer_payment_delay_penalty_present = "yes";
             customer_payment_delay_penalty_basis = "article_395_reference";
             customer_payment_delay_penalty_rate = "Проценты по ст. 395 ГК РФ".

        3. Противоречие в размере.
           В одном пункте "пеня 0,1% в день", в другом —
           "пеня 0,05% в день".
           → presence = "unclear";
             customer_payment_delay_penalty_present = "not_defined";
             customer_payment_delay_penalty_rate = "Не удалось определить".

        4. Фиксированная сумма.
           "За каждый день просрочки оплаты Заказчик уплачивает
           штраф в размере 10 000 рублей."
           → presence = "present";
             customer_payment_delay_penalty_present = "yes";
             customer_payment_delay_penalty_basis = "fixed_amount";
             customer_payment_delay_penalty_rate = "10 000 рублей за каждый день просрочки".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для penalty_for_payment_delay_customer_presence используй только: "present", "missing", "unclear".
        - Для customer_payment_delay_penalty_present используй только: "yes", "no", "not_defined".
        - Для customer_payment_delay_penalty_basis используй только: "percent_per_day", "fixed_amount", "article_395_reference", "mixed", "other", "not_defined".
        - Fallback при отсутствии данных:
          * customer_payment_delay_penalty_present_display → "Санкция за просрочку оплаты заказчиком в предоставленном контексте не установлена.";
          * customer_payment_delay_penalty_basis_display → "Способ расчёта санкции не установлен.";
          * customer_payment_delay_penalty_rate → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_display → "Не удалось определить";
          * customer_payment_delay_penalty_rate → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "penalty_for_payment_delay_customer_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие санкции за просрочку оплаты заказчиком. Внутреннее агрегатное signal-поле."
          required: true

        - name: "customer_payment_delay_penalty_present"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Есть ли договорная санкция за просрочку оплаты заказчиком."
          required: true
          display_in_grid: false

        - name: "customer_payment_delay_penalty_present_display"
          type: "string"
          presentation: "fact"
          label: "Неустойка за оплату"
          description: "Понятное для юриста описание наличия санкции за просрочку оплаты заказчиком."
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "customer_payment_delay_penalty_basis"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["percent_per_day", "fixed_amount", "article_395_reference", "mixed", "other", "not_defined"]
          description: "Способ расчёта санкции за просрочку оплаты."
          required: true
          display_in_grid: false

        - name: "customer_payment_delay_penalty_basis_display"
          type: "string"
          presentation: "fact"
          label: "Тип расчёта"
          description: "Понятное для юриста описание способа расчёта санкции за просрочку оплаты."
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "customer_payment_delay_penalty_rate"
          type: "string"
          presentation: "fact"
          label: "Размер санкции"
          description: "Формулировка размера или формулы санкции за просрочку оплаты."
          required: true
          display_in_grid: true
          display_priority: 3

      store_payload: true

  - id: risk_allocation_before_acceptance
    name: "Распределение рисков случайной гибели материалов и результата (ст. 705 ГК РФ)"
    description: >
      Фактографическая проверка того, на какой стороне договором возложен
      риск случайной гибели результата работ до приёмки, как урегулирован
      риск по материалам заказчика и предусмотрено ли страхование рисков.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "риск случайной гибели"
        - "несёт подрядчик"
        - "несёт заказчик"
        - "до момента приёмки"
        - "страхование рисков"
        - "случайное повреждение"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)риск.*случайной.*гибели.*(результата|материалов).*до.*приёмки"
        - "(?i)(несёт|несет)\\s+(подрядчик|заказчик)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор подряда по ст. 705 ГК РФ.
        Проверяется только один вопрос: как договор распределяет риски
        случайной гибели результата работ и материалов до приёмки.

        Нормативный ориентир:
        - ст. 705 ГК РФ

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. На какой стороне лежит риск случайной гибели результата работ
           до приёмки.
        2. На какой стороне лежит риск по материалам заказчика, если это
           прямо урегулировано.
        3. Есть ли условие о страховании рисков.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined".
        4. Если текстового значения нет — возвращай "Данные не определены".
        5. Не используй "None", "null", "not_defined" или пустые строки.
        6. risk_bearer_before_acceptance определяй только по прямому тексту
           о распределении риска.
        7. customer_materials_risk_bearer определяй только по прямому тексту
           о риске в отношении материалов заказчика.
        8. insurance_obligation = "yes" только если в договоре прямо
           предусмотрено страхование риска.
        9. В evidence включай только текст договора.
        10. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — данные определены:
        Фрагмент:
        "Риск случайной гибели результата работ до его приёмки Заказчиком
        несёт Подрядчик. Риск случайной гибели материалов Заказчика,
        переданных Подрядчику, несёт Заказчик. Подрядчик обязан застраховать
        риск случайного повреждения результата работ до его передачи."

        Ответ:
        {
          "risk_bearer_before_acceptance": "contractor",
          "risk_bearer_before_acceptance_display": "Риск случайной гибели результата работ до приёмки несёт Подрядчик.",
          "customer_materials_risk_bearer": "customer",
          "customer_materials_risk_bearer_display": "Риск случайной гибели материалов Заказчика несёт Заказчик.",
          "insurance_obligation": "yes",
          "insurance_obligation_display": "Страхование рисков предусмотрено.",
          "evidence": [
            {
              "clause_ref": "п. 7.2",
              "quote": "Риск случайной гибели результата работ до его приёмки Заказчиком несёт Подрядчик. Риск случайной гибели материалов Заказчика, переданных Подрядчику, несёт Заказчик. Подрядчик обязан застраховать риск случайного повреждения результата работ до его передачи."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Стороны обязуются исполнять договор добросовестно."

        Ответ:
        {
          "risk_bearer_before_acceptance": "not_defined",
          "risk_bearer_before_acceptance_display": "Распределение риска случайной гибели результата работ в предоставленном контексте не установлено.",
          "customer_materials_risk_bearer": "not_defined",
          "customer_materials_risk_bearer_display": "Распределение риска по материалам заказчика в предоставленном контексте не установлено.",
          "insurance_obligation": "not_defined",
          "insurance_obligation_display": "Условие о страховании рисков в предоставленном контексте не установлено.",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о риске случайной гибели результата.
        2. Найди прямую цитату о риске по материалам заказчика.
        3. Найди прямую цитату о страховании риска.
        4. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "risk_bearer_before_acceptance": "<contractor / customer / shared / not_defined>",
          "risk_bearer_before_acceptance_display": "<понятное описание для юриста>",
          "customer_materials_risk_bearer": "<customer / contractor / shared / not_defined>",
          "customer_materials_risk_bearer_display": "<понятное описание для юриста>",
          "insurance_obligation": "<yes / no / not_defined>",
          "insurance_obligation_display": "<понятное описание для юриста>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 560

    retrieval:
      retrieval_profile: "acceptance_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "риск случайной гибели несет подрядчик несет заказчик до момента приемки страхование рисков случайное повреждение материалы заказчика"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
      negative_keywords:
        - "цена"
        - "аванс"
        - "неустойка"
        - "гарантия"
        - "НДС"
        - "подсудность"
      position_bias:
        preferred_range: [0.35, 0.95]
        boost: 0.18
        scope: segment
      context_k: 5
      max_chunks: 6
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "price_list"
      preferred_clause_functions:
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      presence_signal:
        field: "risk_allocation_before_acceptance_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_max_tokens: 400

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора подряда условия
        о распределении рисков случайной гибели результата работ и материалов.
        Не анализируй цену, оплату, гарантию, штрафы или налоги.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. risk_allocation_before_acceptance_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (risk_bearer_before_acceptance, customer_materials_risk_bearer,
              insurance_obligation) ≠ "not_defined";
           - "missing" — если все три содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - risk_bearer_before_acceptance = "not_defined";
           - customer_materials_risk_bearer = "not_defined";
           - insurance_obligation = "not_defined";
           - все *_display = соответствующий fallback;
           - не выполняй остальные шаги.

        1. risk_bearer_before_acceptance:
           - "contractor" — если риск случайной гибели результата до приёмки
             прямо возложен на подрядчика;
           - "customer" — если риск прямо возложен на заказчика;
           - "shared" — если риск распределён между сторонами;
           - "not_defined" — если по тексту это нельзя установить.

        2. risk_bearer_before_acceptance_display:
           - если "contractor": "Риск случайной гибели результата работ до приёмки несёт Подрядчик.";
           - если "customer": "Риск случайной гибели результата работ до приёмки несёт Заказчик.";
           - если "shared": "Риск случайной гибели результата работ до приёмки распределён между сторонами.";
           - если "not_defined": "Распределение риска случайной гибели результата работ в предоставленном контексте не установлено."

        3. customer_materials_risk_bearer:
           - "customer" — если риск по материалам заказчика прямо возложен
             на заказчика;
           - "contractor" — если риск прямо возложен на подрядчика;
           - "shared" — если риск распределён между сторонами;
           - "not_defined" — если по тексту это нельзя установить.

        4. customer_materials_risk_bearer_display:
           - если "customer": "Риск случайной гибели материалов Заказчика несёт Заказчик.";
           - если "contractor": "Риск случайной гибели материалов Заказчика несёт Подрядчик.";
           - если "shared": "Риск случайной гибели материалов Заказчика распределён между сторонами.";
           - если "not_defined": "Распределение риска по материалам заказчика в предоставленном контексте не установлено."

        5. insurance_obligation:
           - "yes" — если страхование риска прямо предусмотрено;
           - "no" — если договор прямо исключает страхование;
           - "not_defined" — если это прямо не установлено.

        6. insurance_obligation_display:
           - если "yes": "Страхование рисков предусмотрено.";
           - если "no": "Страхование рисков прямо исключено.";
           - если "not_defined": "Условие о страховании рисков в предоставленном контексте не установлено."
        </task>

        <context_rules>
        - Перед остальными полями заполни risk_allocation_before_acceptance_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все signal-поля = "not_defined", все *_display = соответствующий fallback.
        - Используй только текст договора. Не подставляй нормы закона вместо текста договора.
        - Не определяй распределение рисков на основании диспозитивных норм ст. 705 ГК — только по прямому тексту договора.
        - Если в разных фрагментах указаны противоречивые условия распределения рисков — presence = "unclear", соответствующие поля = "not_defined".
        - Не используй "None", "null" или пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни распределения рисков, ни страхования
           (только общие фразы о добросовестном исполнении).
           → presence = "missing";
             все signal-поля = "not_defined";
             все *_display = соответствующий fallback.

        2. Риск результата на подрядчике, материалы не урегулированы.
           "Риск случайной гибели результата работ до приёмки несёт
           Подрядчик" без упоминания материалов и страхования.
           → presence = "present";
             risk_bearer_before_acceptance = "contractor";
             customer_materials_risk_bearer = "not_defined";
             insurance_obligation = "not_defined".

        3. Противоречие в распределении.
           В одном пункте "риск несёт Подрядчик", в другом —
           "риск переходит к Заказчику с момента начала работ".
           → presence = "unclear";
             risk_bearer_before_acceptance = "not_defined";
             risk_bearer_before_acceptance_display = "Не удалось определить".

        4. Полное регулирование + страхование.
           Риск результата — на подрядчике, риск материалов — на заказчике,
           страхование обязательно.
           → presence = "present";
             risk_bearer_before_acceptance = "contractor";
             customer_materials_risk_bearer = "customer";
             insurance_obligation = "yes".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для risk_allocation_before_acceptance_presence используй только: "present", "missing", "unclear".
        - Для risk_bearer_before_acceptance используй только: "contractor", "customer", "shared", "not_defined".
        - Для customer_materials_risk_bearer используй только: "customer", "contractor", "shared", "not_defined".
        - Для insurance_obligation используй только: "yes", "no", "not_defined".
        - Fallback при отсутствии данных:
          * risk_bearer_before_acceptance_display → "Распределение риска случайной гибели результата работ в предоставленном контексте не установлено.";
          * customer_materials_risk_bearer_display → "Распределение риска по материалам заказчика в предоставленном контексте не установлено.";
          * insurance_obligation_display → "Условие о страховании рисков в предоставленном контексте не установлено.".
        - Fallback при противоречии или неоднозначности:
          * все *_display → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "risk_allocation_before_acceptance_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования распределения рисков. Внутреннее агрегатное signal-поле."
          required: true

        - name: "risk_bearer_before_acceptance"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["contractor", "customer", "shared", "not_defined"]
          description: "На какой стороне риск случайной гибели результата работ до приёмки."
          required: true
          display_in_grid: false

        - name: "risk_bearer_before_acceptance_display"
          type: "string"
          presentation: "fact"
          label: "Риск до приёмки"
          description: "Понятное для юриста описание распределения риска случайной гибели результата работ до приёмки."
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "customer_materials_risk_bearer"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["customer", "contractor", "shared", "not_defined"]
          description: "На какой стороне риск по материалам заказчика."
          required: true
          display_in_grid: false

        - name: "customer_materials_risk_bearer_display"
          type: "string"
          presentation: "fact"
          label: "Риск по материалам"
          description: "Понятное для юриста описание распределения риска по материалам заказчика."
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "insurance_obligation"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Предусмотрено ли страхование соответствующих рисков."
          required: true
          display_in_grid: false

        - name: "insurance_obligation_display"
          type: "string"
          presentation: "fact"
          label: "Страхование рисков"
          description: "Понятное для юриста описание наличия условия о страховании рисков."
          required: true
          display_in_grid: true
          display_priority: 3

      store_payload: true

  - id: subcontracting_conditions
    name: "Условия привлечения субподрядчиков (ст. 706 ГК РФ)"
    description: >
      Фактографическая проверка того, допускается ли привлечение
      субподрядчиков, требуется ли согласие заказчика и закреплена ли
      ответственность подрядчика за действия субподрядчиков.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "medium"
    severity_if_pass: "pass"
    severity_if_fail: "medium"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "субподрядчик"
        - "только с согласия заказчика"
        - "запрещено привлекать"
        - "ответственность за субподрядчика"
        - "генеральный подрядчик"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)привлечение\\s+субподрядчик.*только.*письменного.*согласия"
        - "(?i)подрядчик.*несёт.*ответственность.*за.*субподрядчик"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор подряда по ст. 706 ГК РФ.
        Проверяется только один вопрос: как договор регулирует привлечение
        субподрядчиков.

        Нормативный ориентир:
        - ст. 706 ГК РФ

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Допускается ли привлечение субподрядчиков.
        2. Требуется ли согласие заказчика на привлечение субподрядчиков.
        3. Закреплена ли ответственность подрядчика за действия субподрядчиков.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined".
        4. Если текстового значения нет — возвращай "Данные не определены".
        5. Не используй "None", "null", "not_defined" или пустые строки.
        6. subcontracting_mode = "allowed_with_consent" только если договор
           прямо требует согласия заказчика.
        7. subcontracting_mode = "prohibited" только если договор прямо
           запрещает привлечение субподрядчиков.
        8. subcontracting_mode = "allowed" только если договор прямо допускает
           привлечение субподрядчиков без дополнительного согласия.
        9. contractor_liability_for_subcontractor = "yes" только если такая
           ответственность прямо закреплена.
        10. В evidence включай только текст договора.
        11. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — данные определены:
        Фрагмент:
        "Подрядчик вправе привлекать субподрядчиков только с предварительного
        письменного согласия Заказчика. Подрядчик несет ответственность
        за действия привлеченных субподрядчиков как за свои собственные."

        Ответ:
        {
          "subcontracting_mode": "allowed_with_consent",
          "subcontracting_mode_display": "Привлечение субподрядчиков допускается с согласия заказчика.",
          "contractor_liability_for_subcontractor": "yes",
          "contractor_liability_for_subcontractor_display": "Ответственность подрядчика за субподрядчиков закреплена.",
          "subcontracting_details": "Привлечение субподрядчиков допускается только с предварительного письменного согласия Заказчика.",
          "evidence": [
            {
              "clause_ref": "п. 5.6",
              "quote": "Подрядчик вправе привлекать субподрядчиков только с предварительного письменного согласия Заказчика. Подрядчик несет ответственность за действия привлеченных субподрядчиков как за свои собственные."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Подрядчик выполняет работы своими силами и средствами."

        Ответ:
        {
          "subcontracting_mode": "not_defined",
