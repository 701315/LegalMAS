        Фрагмент:
        "Подрядчик вправе привлекать субподрядчиков только с предварительного
        письменного согласия Заказчика. Подрядчик несет ответственность
        за действия привлеченных субподрядчиков как за свои собственные."

        Ответ:
        {
          "subcontracting_mode": "allowed_with_consent",
          "subcontracting_mode_display": "Привлечение субподрядчиков допускается с согласия заказчика.",
          "contractor_liability_for_subcontractor": "yes",
          "contractor_liability_for_subcontractor_display": "Ответственность подрядчика за субподрядчиков закреплена.",
          "subcontracting_details": "Привлечение субподрядчиков допускается только с предварительного письменного согласия Заказчика.",
          "evidence": [
            {
              "clause_ref": "п. 5.6",
              "quote": "Подрядчик вправе привлекать субподрядчиков только с предварительного письменного согласия Заказчика. Подрядчик несет ответственность за действия привлеченных субподрядчиков как за свои собственные."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Подрядчик выполняет работы своими силами и средствами."

        Ответ:
        {
          "subcontracting_mode": "not_defined",
          "subcontracting_mode_display": "Режим привлечения субподрядчиков в предоставленном контексте не установлен.",
          "contractor_liability_for_subcontractor": "not_defined",
          "contractor_liability_for_subcontractor_display": "Ответственность подрядчика за субподрядчиков в предоставленном контексте не установлена.",
          "subcontracting_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о допустимости или запрете субподряда.
        2. Найди прямую цитату о согласии заказчика.
        3. Найди прямую цитату об ответственности подрядчика за субподрядчиков.
        4. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

