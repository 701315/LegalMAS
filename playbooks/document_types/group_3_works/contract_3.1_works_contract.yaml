  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 7: Стороны договора, подписанты и корпоративное одобрение
  # ──────────────────────────────────────────────────────────────────────────
  - id: parties_identification
    name: "Стороны договора: идентификация подрядчика и заказчика (ст. 432 ГК РФ)"
    description: >
      Фактографическая проверка идентификации подрядчика и заказчика,
      реквизитов сторон, подписантов, оснований полномочий и корпоративного
      одобрения сделки для юридических лиц.
    triggers: ~
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "подрядчик"
        - "заказчик"
        - "именуем"
        - "в лице"
        - "действующего на основании"
        - "крупная сделка"
        - "сделка с заинтересованностью"
        - "одобрение общего собрания"
        - "одобрение совета директоров"
