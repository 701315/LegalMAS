            {
              "clause_ref": "п. 8.3",
              "quote": "Заказчик вправе отказаться от исполнения договора в любое время до сдачи результата работ, оплатив Подрядчику фактически выполненные работы. В случае такого отказа штраф не взимается."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Договор может быть расторгнут по соглашению сторон."

        Ответ:
        {
          "refusal_right_status": "not_mentioned",
          "refusal_right_status_display": "Право заказчика на односторонний отказ прямо не урегулировано.",
          "penalty_for_refusal": "not_defined",
          "penalty_for_refusal_display": "Условия о штрафе за односторонний отказ не установлены.",
          "penalty_amount_status": "not_defined",
          "penalty_amount_value": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о праве заказчика на односторонний отказ.
        2. Найди прямую цитату о штрафе или неустойке за отказ.
        3. Найди прямую цитату о размере штрафа или неустойки.
        4. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "refusal_right_status": "<preserved / restricted / excluded / not_mentioned / not_defined>",
          "refusal_right_status_display": "<понятное описание для юриста>",
          "penalty_for_refusal": "<yes / no / not_defined>",
          "penalty_for_refusal_display": "<понятное описание для юриста>",
          "penalty_amount_status": "<defined / not_defined>",
          "penalty_amount_value": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
