      store_payload: true

  - id: intermediate_inspection_right
    name: "Право заказчика проверять ход работ (ст. 715 ГК РФ)"
    description: >
      Фактографическая проверка того, предусмотрено ли право заказчика
      проверять ход и качество работ, а также есть ли ограничение
      на вмешательство в деятельность подрядчика.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "medium"
    severity_if_pass: "pass"
    severity_if_fail: "medium"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "проверять ход работ"
        - "контроль качества"
        - "проверка хода выполнения"
        - "вправе проверить"
        - "промежуточная инспекция"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)заказчик.*вправе.*провер(ять|ить)\\s+(ход|качество)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор подряда по ст. 715 ГК РФ.
        Проверяется только один вопрос: предусмотрено ли право заказчика
        проверять ход и качество работ и ограничено ли такое право
        запретом вмешательства в деятельность подрядчика.

        Нормативный ориентир:
        - ст. 715 ГК РФ

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли у заказчика право проверять ход или качество работ.
        2. Есть ли прямое указание, что заказчик не вправе вмешиваться
           в деятельность подрядчика.
        3. Как сформулирован объём или предмет такой проверки.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined".
        4. Если текстового значения нет — возвращай "Данные не определены".
        5. Не используй "None", "null", "not_defined" или пустые строки.
        6. inspection_right_present = "yes" только если право проверки
           прямо предусмотрено договором.
        7. no_interference_rule = "yes" только если договор прямо содержит
           правило о невмешательстве в деятельность подрядчика.
        8. inspection_scope заполняй только по прямому тексту договора.
        9. В evidence включай только текст договора.
        10. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — данные определены:
        Фрагмент:
        "Заказчик вправе в любое время проверять ход и качество выполняемых
        работ, не вмешиваясь в оперативно-хозяйственную деятельность
        Подрядчика."

        Ответ:
        {
          "inspection_right_present": "yes",
          "inspection_right_present_display": "Право заказчика проверять ход и качество работ предусмотрено.",
          "no_interference_rule": "yes",
          "no_interference_rule_display": "Заказчик не вправе вмешиваться в деятельность подрядчика.",
          "inspection_scope": "Заказчик вправе проверять ход и качество выполняемых работ.",
          "evidence": [
            {
              "clause_ref": "п. 3.5",
              "quote": "Заказчик вправе в любое время проверять ход и качество выполняемых работ, не вмешиваясь в оперативно-хозяйственную деятельность Подрядчика."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Подрядчик выполняет работы по согласованному графику."

        Ответ:
        {
          "inspection_right_present": "not_defined",
          "inspection_right_present_display": "Право заказчика проверять ход работ в предоставленном контексте не установлено.",
          "no_interference_rule": "not_defined",
          "no_interference_rule_display": "Правило о невмешательстве в предоставленном контексте не установлено.",
          "inspection_scope": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о праве заказчика проверять ход или качество работ.
        2. Найди прямую цитату о невмешательстве в деятельность подрядчика.
        3. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "inspection_right_present": "<yes / no / not_defined>",
          "inspection_right_present_display": "<понятное описание для юриста>",
          "no_interference_rule": "<yes / no / not_defined>",
          "no_interference_rule_display": "<понятное описание для юриста>",
          "inspection_scope": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 520

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "проверять ход работ контроль качества проверка хода выполнения вправе проверить промежуточная инспекция не вмешиваясь"
      retrieval_profile: "acceptance_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
      negative_keywords:
        - "цена"
        - "аванс"
        - "неустойка"
        - "гарантия"
        - "НДС"
        - "подсудность"
      position_bias:
        preferred_range: [0.20, 0.80]
        boost: 0.18
        scope: segment
      context_k: 5
      max_chunks: 6
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "price_list"
      preferred_clause_functions:
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 550

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      presence_signal:
        field: "intermediate_inspection_right_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_max_tokens: 400

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора подряда условия
        о праве заказчика проверять ход и качество работ.
        Не анализируй цену, сроки, гарантию, штрафы или подсудность.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. intermediate_inspection_right_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (inspection_right_present, no_interference_rule)
             ≠ "not_defined";
           - "missing" — если оба содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - inspection_right_present = "not_defined";
           - no_interference_rule = "not_defined";
           - inspection_right_present_display = "Право заказчика проверять ход работ в предоставленном контексте не установлено.";
           - no_interference_rule_display = "Правило о невмешательстве в предоставленном контексте не установлено.";
           - inspection_scope = "Данные не определены";
           - не выполняй остальные шаги.

        1. inspection_right_present:
           - "yes" — если право заказчика проверять ход или качество работ
             прямо предусмотрено;
           - "no" — если договор прямо исключает такое право;
           - "not_defined" — если это прямо не установлено.

        2. inspection_right_present_display:
           - если "yes": "Право заказчика проверять ход и качество работ предусмотрено.";
           - если "no": "Право заказчика проверять ход работ прямо исключено.";
           - если "not_defined": "Право заказчика проверять ход работ в предоставленном контексте не установлено."

        3. no_interference_rule:
           - "yes" — если прямо указано, что заказчик не вмешивается
             в деятельность подрядчика;
           - "no" — если договор прямо допускает вмешательство;
           - "not_defined" — если это прямо не установлено.

        4. no_interference_rule_display:
           - если "yes": "Заказчик не вправе вмешиваться в деятельность подрядчика.";
           - если "no": "Ограничение на вмешательство заказчика прямо не установлено.";
           - если "not_defined": "Правило о невмешательстве в предоставленном контексте не установлено."

        5. inspection_scope:
            Формулировка об объёме или предмете проверки по прямому тексту
            договора.
            Если данных нет — "Данные не определены".
            Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни intermediate_inspection_right_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все signal-поля = "not_defined", все *_display = соответствующий fallback, inspection_scope = "Данные не определены".
        - Используй только текст договора. Не подставляй нормы закона вместо текста договора.
        - Не определяй право проверки на основании диспозитивных норм ст. 715 ГК — только по прямому тексту договора.
        - Если в разных фрагментах указаны противоречивые условия — presence = "unclear", соответствующие поля = "not_defined".
        - Не используй "None", "null" или пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни права проверки, ни правила о невмешательстве.
           → presence = "missing";
             все signal-поля = "not_defined";
             все *_display = соответствующий fallback;
             inspection_scope = "Данные не определены".

        2. Право проверки без ограничения вмешательства.
           "Заказчик вправе в любое время проверять ход и качество работ"
           без упоминания невмешательства.
           → presence = "present";
             inspection_right_present = "yes";
             no_interference_rule = "not_defined";
             inspection_scope отражает формулировку.

        3. Противоречие в условиях.
           В одном пункте "Заказчик вправе проверять ход работ",
           в другом — "Заказчик не вправе контролировать процесс
           выполнения работ".
           → presence = "unclear";
             inspection_right_present = "not_defined";
             inspection_right_present_display = "Не удалось определить".

        4. Полное регулирование.
           Право проверки + невмешательство + конкретный объём проверки
           (ход и качество).
           → presence = "present";
             inspection_right_present = "yes";
             no_interference_rule = "yes";
             inspection_scope = "Заказчик вправе проверять ход и качество выполняемых работ".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для intermediate_inspection_right_presence используй только: "present", "missing", "unclear".
        - Для inspection_right_present используй только: "yes", "no", "not_defined".
        - Для no_interference_rule используй только: "yes", "no", "not_defined".
        - Fallback при отсутствии данных:
          * inspection_right_present_display → "Право заказчика проверять ход работ в предоставленном контексте не установлено.";
          * no_interference_rule_display → "Правило о невмешательстве в предоставленном контексте не установлено.";
          * inspection_scope → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_display → "Не удалось определить";
          * inspection_scope → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "intermediate_inspection_right_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования права проверки хода работ. Внутреннее агрегатное signal-поле."
          required: true

        - name: "inspection_right_present"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Есть ли у заказчика право проверять ход или качество работ."
          required: true
          display_in_grid: false

        - name: "inspection_right_present_display"
          type: "string"
          presentation: "fact"
          label: "Право проверки"
          description: "Понятное для юриста описание права заказчика проверять ход и качество работ."
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "no_interference_rule"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Есть ли правило о невмешательстве заказчика в деятельность подрядчика."
