      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора подряда условия
        о привлечении субподрядчиков.
        Не анализируй цену, сроки, гарантию, штрафы или подсудность.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. subcontracting_conditions_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (subcontracting_mode, contractor_liability_for_subcontractor)
             ≠ "not_defined";
           - "missing" — если оба содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - subcontracting_mode = "not_defined";
           - contractor_liability_for_subcontractor = "not_defined";
           - subcontracting_mode_display = "Режим привлечения субподрядчиков в предоставленном контексте не установлен.";
           - contractor_liability_for_subcontractor_display = "Ответственность подрядчика за субподрядчиков в предоставленном контексте не установлена.";
           - subcontracting_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. subcontracting_mode:
           - "allowed" — если привлечение субподрядчиков прямо допускается
             без дополнительных ограничений;
           - "allowed_with_consent" — если требуется согласие заказчика;
           - "prohibited" — если привлечение прямо запрещено;
           - "not_defined" — если по тексту режим не установлен.

        2. subcontracting_mode_display:
           - если "allowed": "Привлечение субподрядчиков допускается без ограничений.";
           - если "allowed_with_consent": "Привлечение субподрядчиков допускается с согласия заказчика.";
           - если "prohibited": "Привлечение субподрядчиков прямо запрещено.";
           - если "not_defined": "Режим привлечения субподрядчиков в предоставленном контексте не установлен."

        3. contractor_liability_for_subcontractor:
           - "yes" — если ответственность подрядчика за действия
             субподрядчиков прямо закреплена;
           - "no" — если договор прямо исключает такую ответственность;
           - "not_defined" — если это прямо не установлено.

        4. contractor_liability_for_subcontractor_display:
           - если "yes": "Ответственность подрядчика за субподрядчиков закреплена.";
           - если "no": "Ответственность подрядчика за субподрядчиков прямо исключена.";
           - если "not_defined": "Ответственность подрядчика за субподрядчиков в предоставленном контексте не установлена."

        5. subcontracting_details:
            Формулировка о порядке привлечения субподрядчиков по прямому
            тексту договора.
            Если данных нет — "Данные не определены".
            Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни subcontracting_conditions_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все signal-поля = "not_defined", все *_display = соответствующий fallback, subcontracting_details = "Данные не определены".
        - Используй только текст договора. Не подставляй нормы закона вместо текста договора.
        - Не определяй режим субподряда на основании диспозитивных норм ст. 706 ГК — только по прямому тексту договора.
        - Фраза "Подрядчик выполняет работы своими силами и средствами" без прямого запрета субподряда — subcontracting_mode = "not_defined" (это описание факта, а не запрет).
        - Если в разных фрагментах указаны противоречивые условия — presence = "unclear", subcontracting_mode = "not_defined".
        - Не используй "None", "null" или пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

