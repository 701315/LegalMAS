        - "ip" — если Заказчик прямо указан как индивидуальный предприниматель.
        - "self_employed" — если Заказчик прямо указан как самозанятый
        или плательщик НПД.
        - "not_defined" — если тип Заказчика прямо не установлен.
        customer_signatory_basis:
        - "charter" — если подписант действует на основании устава.
        - "poa" — если подписант действует на основании доверенности.
        - "order" — если подписант действует на основании приказа
