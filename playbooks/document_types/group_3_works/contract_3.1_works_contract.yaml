              ИП или самозанятый.
            - "other" — если указано иное основание полномочий.
            - "not_defined" — если основание прямо не установлено.
        - Не подставляй корпоративные требования, если они не отражены
          в тексте договора.
        - Верни только JSON.
        </rules>
      fields:
        - name: "contractor_details_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения реквизитов Подрядчика."
          required: true
        - name: "contractor_details_value"
          type: "string"
