        - "personal" — если сторона подписывает договор лично как физлицо,
        ИП или самозанятый.
        - "other" — если указано иное основание полномочий.
        - "not_defined" — если основание прямо не установлено.
        contractor_details_value:
        - извлеки наименование / ФИО и реквизиты Подрядчика;
        - если не установлены, верни: "Данные не определены".
        contractor_signatory:
        - извлеки ФИО и должность подписанта Подрядчика;
        - если не установлены, верни: "Данные не определены".
        customer_details_value:
        - извлеки наименование / ФИО и реквизиты Заказчика;
        - если не установлены, верни: "Данные не определены".
