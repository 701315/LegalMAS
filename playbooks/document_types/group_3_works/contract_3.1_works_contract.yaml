          display_priority: 3

      store_payload: true

  - id: acceptance_procedure
    name: "Порядок сдачи-приёмки работ и односторонняя приёмка (ст. 720 ГК РФ)"
    description: >
      Фактографическая проверка срока приёмки работ заказчиком,
      автоматической приёмки при молчании, права подрядчика составить
      односторонний акт при уклонении заказчика и срока для мотивированного
      отказа.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "акт выполненных работ"
        - "акт сдачи-приёмки"
        - "подписание акта"
        - "порядок приёмки"
        - "сдача результата"
        - "приёмка заказчиком"
        - "работы считаются принятыми"
        - "односторонний акт"
        - "при отсутствии мотивированного отказа"
        - "уклонение от приёмки"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)акт\\s+(сдачи|выполненных|приёмки)"
        - "(?i)(сдать|сдача)\\s+результат"
        - "(?i)если.*заказчик.*не.*направил.*отказ.*в\\s+течение.*\\d+.*дней.*работы.*считаются.*принятыми"
        - "(?i)при.*уклонении.*от\\s+приёмки.*подрядчик.*вправе.*составить.*акт.*односторонне"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор подряда по ст. 720 ГК РФ.
        Проверяется только один вопрос: как урегулированы порядок
        сдачи-приёмки работ, срок приёмки, автоматическая приёмка при
        молчании и право подрядчика составить односторонний акт при
        уклонении заказчика.

        Нормативный ориентир:
        - ст. 720 ГК РФ

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Указан ли срок для приёмки работ заказчиком.
        2. Сколько дней отведено на приёмку, если срок прямо указан в днях.
        3. Есть ли автоматическая приёмка при отсутствии мотивированного отказа.
        4. Предусмотрено ли право подрядчика составить односторонний акт
           при уклонении заказчика.
        5. Как сформулирован срок для направления мотивированного отказа.
        6. Как в целом сформулирован порядок приёмки.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined".
        4. Для текстовых полей при отсутствии данных возвращай
           "Данные не определены".
        5. Не используй "None", "null", "not_defined" или пустые строки.
        6. review_period_days_status = "defined" только если срок приёмки
           прямо указан и может быть выражен числом дней.
        7. review_period_days_value = 0 если срок не определён числом дней.
        8. auto_acceptance = "yes" только если договор прямо устанавливает,
           что работы считаются принятыми при молчании или отсутствии
           мотивированного отказа.
        9. unilateral_act_allowed = "yes" только если подрядчик прямо вправе
           составить односторонний акт при уклонении заказчика.
        10. motivated_refusal_deadline заполняй только если срок
            мотивированного отказа прямо указан.
        11. В evidence включай только текст договора.
        12. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — данные определены:
        Фрагмент:
        "Заказчик обязан в течение 5 рабочих дней с даты получения акта
        рассмотреть результат работ и подписать акт сдачи-приёмки либо
        направить мотивированный отказ. При отсутствии такого отказа
        работы считаются принятыми. При уклонении Заказчика от приёмки
        Подрядчик вправе составить односторонний акт сдачи-приёмки."

        Ответ:
        {
          "review_period_days_status": "defined",
          "review_period_days_value": 5,
          "auto_acceptance": "yes",
          "auto_acceptance_display": "Автоматическая приёмка предусмотрена.",
          "unilateral_act_allowed": "yes",
          "unilateral_act_allowed_display": "Подрядчик вправе составить односторонний акт.",
          "motivated_refusal_deadline": "5 рабочих дней с даты получения акта.",
          "acceptance_procedure_details": "Заказчик обязан в течение 5 рабочих дней рассмотреть результат работ и подписать акт либо направить мотивированный отказ.",
          "evidence": [
            {
              "clause_ref": "п. 6.2",
              "quote": "Заказчик обязан в течение 5 рабочих дней с даты получения акта рассмотреть результат работ и подписать акт сдачи-приёмки либо направить мотивированный отказ. При отсутствии такого отказа работы считаются принятыми. При уклонении Заказчика от приёмки Подрядчик вправе составить односторонний акт сдачи-приёмки."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Результат работ передаётся Заказчику по акту."

        Ответ:
        {
          "review_period_days_status": "not_defined",
          "review_period_days_value": 0,
          "auto_acceptance": "not_defined",
          "auto_acceptance_display": "Автоматическая приёмка в предоставленном контексте не установлена.",
          "unilateral_act_allowed": "not_defined",
          "unilateral_act_allowed_display": "Право на односторонний акт в предоставленном контексте не установлено.",
          "motivated_refusal_deadline": "Данные не определены",
          "acceptance_procedure_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о сроке приёмки.
        2. Найди прямую цитату об автоматической приёмке при молчании.
        3. Найди прямую цитату о праве на односторонний акт.
        4. Найди прямую цитату о сроке мотивированного отказа.
        5. Если прямой цитаты нет — верни "not_defined" и 0 для числового поля.

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "review_period_days_status": "<defined / not_defined>",
          "review_period_days_value": "<число дней или 0>",
          "auto_acceptance": "<yes / no / not_defined>",
          "auto_acceptance_display": "<понятное описание для юриста>",
          "unilateral_act_allowed": "<yes / no / not_defined>",
          "unilateral_act_allowed_display": "<понятное описание для юриста>",
          "motivated_refusal_deadline": "<текст или 'Данные не определены'>",
          "acceptance_procedure_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 680

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "акт выполненных работ акт сдачи приемки подписание акта порядок приемки сдача результата мотивированный отказ считаются принятыми уклонение от приемки односторонний акт"
      retrieval_profile: "acceptance_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - boilerplate
      negative_keywords:
        - "цена"
        - "аванс"
        - "НДС"
        - "гарантия"
        - "неустойка"
        - "форс-мажор"
        - "уступка"
        - "субподряд"
      position_bias:
        preferred_range: [0.25, 0.85]
        boost: 0.18
        scope: segment
      context_k: 5
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "boilerplate"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      presence_signal:
        field: "acceptance_procedure_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_max_tokens: 700

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора подряда условия
        о порядке сдачи-приёмки работ: срок приёмки, автоматическая приёмка,
        право на односторонний акт и срок мотивированного отказа.
        Не анализируй цену, сроки выполнения работ, гарантию, штрафы
        или подсудность.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. acceptance_procedure_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (review_period_days_status, auto_acceptance,
              unilateral_act_allowed) ≠ "not_defined";
           - "missing" — если все три содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - review_period_days_status = "not_defined";
           - review_period_days_value = "0";
           - auto_acceptance = "not_defined";
           - unilateral_act_allowed = "not_defined";
           - auto_acceptance_display = "Автоматическая приёмка в предоставленном контексте не установлена.";
           - unilateral_act_allowed_display = "Право на односторонний акт в предоставленном контексте не установлено.";
           - motivated_refusal_deadline = "Данные не определены";
           - acceptance_procedure_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. review_period_days_status:
           - "defined" — если срок приёмки прямо указан числом дней;
           - "not_defined" — если срок не указан числом дней.

        2. review_period_days_value:
           Количество дней для приёмки работ (только число без слов).
           Если срок не определён числом — "0".

        3. auto_acceptance:
           - "yes" — если договор прямо устанавливает, что при молчании или
             отсутствии мотивированного отказа работы считаются принятыми;
           - "no" — если договор прямо исключает автоматическую приёмку;
           - "not_defined" — если это прямо не установлено.

        4. auto_acceptance_display:
           - если "yes": "Автоматическая приёмка предусмотрена.";
           - если "no": "Автоматическая приёмка прямо исключена.";
           - если "not_defined": "Автоматическая приёмка в предоставленном контексте не установлена."

        5. unilateral_act_allowed:
           - "yes" — если подрядчик прямо вправе составить односторонний
             акт при уклонении заказчика;
           - "no" — если договор прямо исключает такое право;
           - "not_defined" — если это прямо не установлено.

        6. unilateral_act_allowed_display:
           - если "yes": "Подрядчик вправе составить односторонний акт.";
           - если "no": "Право на односторонний акт прямо исключено.";
           - если "not_defined": "Право на односторонний акт в предоставленном контексте не установлено."

        7. motivated_refusal_deadline:
           Формулировка срока для направления мотивированного отказа
           по прямому тексту договора.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        8. acceptance_procedure_details:
           Общая формулировка порядка приёмки из прямого текста договора.
           Если данных нет — "Данные не определены".
        </task>

        <context_rules>
        - Перед остальными полями заполни acceptance_procedure_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все signal-поля = "not_defined", review_period_days_value = "0", все *_display/*_details = соответствующий fallback.
        - Используй только текст договора. Не подставляй нормы закона вместо текста договора.
        - Не делай выводов об автоприёмке или одностороннем акте на основании диспозитивных норм ГК — только по прямому тексту договора.
        - Если в разных фрагментах указаны противоречивые сроки или условия — presence = "unclear", соответствующие поля = "not_defined".
        - Не используй "None", "null" или пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни срока приёмки, ни упоминания акта, ни правил
           автоприёмки.
           → presence = "missing";
             все signal-поля = "not_defined";
             review_period_days_value = "0";
             все *_display/*_details = соответствующий fallback.

        2. Только упоминание акта без деталей.
           "Результат работ передаётся Заказчику по акту" без указания срока,
           автоприёмки и права на односторонний акт.
           → presence = "present";
             review_period_days_status = "not_defined";
             auto_acceptance = "not_defined";
             unilateral_act_allowed = "not_defined".

        3. Противоречие в сроках.
           В одном пункте "срок приёмки — 5 рабочих дней", в другом —
           "в течение 10 календарных дней с момента получения акта".
           → presence = "unclear";
             review_period_days_status = "not_defined";
             review_period_days_value = "0";
             motivated_refusal_deadline = "Не удалось определить".

        4. Полностью урегулированная процедура.
           Срок приёмки + автоприёмка при молчании + право на односторонний
           акт при уклонении — все три прямо установлены.
           → presence = "present";
             review_period_days_status = "defined";
             auto_acceptance = "yes";
             unilateral_act_allowed = "yes";
             все *_display отражают конкретные условия.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для acceptance_procedure_presence используй только: "present", "missing", "unclear".
        - Для review_period_days_status используй только: "defined", "not_defined".
        - Для auto_acceptance используй только: "yes", "no", "not_defined".
        - Для unilateral_act_allowed используй только: "yes", "no", "not_defined".
        - review_period_days_value — только число без слов, или "0" если срок не указан числом.
        - Fallback при отсутствии данных:
          * auto_acceptance_display → "Автоматическая приёмка в предоставленном контексте не установлена.";
          * unilateral_act_allowed_display → "Право на односторонний акт в предоставленном контексте не установлено.";
          * motivated_refusal_deadline → "Данные не определены";
          * acceptance_procedure_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * motivated_refusal_deadline → "Не удалось определить";
          * acceptance_procedure_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "acceptance_procedure_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования порядка сдачи-приёмки. Внутреннее агрегатное signal-поле."
          required: true

        - name: "review_period_days_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения срока приёмки в днях."
          required: true
          display_in_grid: false

        - name: "review_period_days_value"
          type: "string"
          presentation: "fact"
          label: "Срок приёмки (дней)"
          description: "Количество дней, отведённых на приёмку работ."
          required: true
          display_in_grid: true
          display_priority: 1
          unit: "days"

        - name: "auto_acceptance"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Есть ли автоматическая приёмка при молчании заказчика."
          required: true
          display_in_grid: false

        - name: "auto_acceptance_display"
          type: "string"
          presentation: "fact"
          label: "Автоприёмка"
          description: "Понятное для юриста описание наличия автоматической приёмки."
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "unilateral_act_allowed"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Вправе ли подрядчик составить односторонний акт."
          required: true
          display_in_grid: false

        - name: "unilateral_act_allowed_display"
          type: "string"
          presentation: "fact"
          label: "Односторонний акт"
          description: "Понятное для юриста описание права на односторонний акт."
          required: true
          display_in_grid: true
          display_priority: 3

        - name: "motivated_refusal_deadline"
          type: "string"
          presentation: "fact"
          label: "Срок для отказа"
          description: "Срок для направления мотивированного отказа заказчиком."
          required: true
          display_in_grid: true
          display_priority: 4

        - name: "acceptance_procedure_details"
          type: "string"
          presentation: "fact"
          label: "Порядок приёмки"
          description: "Общая формулировка порядка сдачи-приёмки из договора."
          required: true
          display_in_grid: false

      store_payload: true

  - id: payment_terms_and_schedule
    name: "Порядок и сроки оплаты, аванс, окончательный расчёт (ст. 711 ГК РФ)"
    description: >
      Фактографическая проверка способа расчётов и наличия аванса
      по договору подряда.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "срок оплаты"
        - "после подписания акта"
        - "банковских дней"
        - "рабочих дней"
        - "банковские реквизиты"
        - "в течение"
        - "аванс"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)оплат(а|у).*в\\s+течение.*\\d+.*(дней|рабоч)"
        - "(?i)после.*подписания.*акта.*в\\s+течение"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор подряда по ст. 711 ГК РФ.
        Проверяется только один вопрос: какой способ оплаты предусмотрен
        договором и есть ли условие об авансе.

        Нормативный ориентир:
        - ст. 711 ГК РФ
        - ст. 314 ГК РФ

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Какой способ расчётов прямо предусмотрен договором.
        2. Есть ли условие об авансе, предоплате или авансовом платеже.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined".
        4. Не используй "None", "null", "not_defined" или пустые строки.
        5. payment_method определяй только по прямой формулировке способа оплаты.
        6. advance_present = "yes" только если аванс, предоплата или авансовый
           платёж прямо упомянуты.
        7. advance_present = "no" только если договор прямо исключает аванс
           или прямо указывает оплату только после выполнения работ
           без предварительного платежа.
        8. В evidence включай только текст договора.
        9. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — данные определены:
        Фрагмент:
        "Оплата по договору производится путем безналичного перечисления
        денежных средств на расчетный счет Подрядчика. Заказчик уплачивает
        аванс в размере 30% от цены договора в течение 5 банковских дней
        с даты подписания договора."

        Ответ:
        {
          "payment_method": "cashless_transfer",
          "payment_method_display": "Безналичный расчёт.",
          "advance_present": "yes",
          "advance_present_display": "Аванс предусмотрен.",
          "evidence": [
            {
              "clause_ref": "п. 4.2",
              "quote": "Оплата по договору производится путем безналичного перечисления денежных средств на расчетный счет Подрядчика. Заказчик уплачивает аванс в размере 30% от цены договора..."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Расчёты между сторонами осуществляются в порядке, предусмотренном
        настоящим договором."

        Ответ:
        {
          "payment_method": "not_defined",
          "payment_method_display": "Способ оплаты прямо не определён.",
          "advance_present": "not_defined",
          "advance_present_display": "Условие об авансе не установлено.",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о способе оплаты.
        2. Найди прямую цитату об авансе или предоплате.
        3. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "payment_method": "<cashless_transfer / cash / mixed / other / not_defined>",
          "payment_method_display": "<понятное описание для юриста>",
          "advance_present": "<yes / no / not_defined>",
          "advance_present_display": "<понятное описание для юриста>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 420

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "срок оплаты после подписания акта банковских дней рабочих дней банковские реквизиты аванс предоплата авансовый платеж безналичный расчет наличными"
      retrieval_profile: "payment_terms_check"
      preferred_unit_types:
        - payment_term
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
      negative_keywords:
        - "гарантия"
        - "неустойка"
        - "форс-мажор"
        - "подсудность"
        - "конфиденциальность"
        - "уступка"
      position_bias:
        preferred_range: [0.20, 0.70]
        boost: 0.20
        scope: segment
      context_k: 5
      max_chunks: 6
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 550

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      presence_signal:
        field: "payment_terms_and_schedule_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_max_tokens: 320

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора подряда способ оплаты
        и наличие условия об авансе.
        Не анализируй сумму цены, сроки выполнения работ, гарантию,
        штрафы или налоги.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. payment_terms_and_schedule_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (payment_method, advance_present) ≠ "not_defined";
           - "missing" — если оба содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - payment_method = "not_defined";
           - advance_present = "not_defined";
           - payment_method_display = "Способ оплаты прямо не определён.";
           - advance_present_display = "Условие об авансе не установлено.";
           - не выполняй остальные шаги.

        1. payment_method:
           - "cashless_transfer" — безналичный расчёт, банковский перевод,
             перечисление на расчётный счёт;
           - "cash" — оплата наличными;
           - "mixed" — и безналичный, и наличный расчёт;
           - "other" — иной конкретный способ оплаты;
           - "not_defined" — способ оплаты прямо не определён.

        2. payment_method_display:
           - если "cashless_transfer": "Безналичный расчёт.";
           - если "cash": "Оплата наличными.";
           - если "mixed": "Смешанный расчёт (безналичный и наличный).";
           - если "other": "Иной способ оплаты.";
           - если "not_defined": "Способ оплаты прямо не определён."

        3. advance_present:
           - "yes" — если прямо указан аванс, предоплата или авансовый платёж;
           - "no" — если договор прямо исключает аванс или указывает оплату
             только после выполнения работ без предварительного платежа;
           - "not_defined" — если это прямо не установлено.

        4. advance_present_display:
           - если "yes": "Аванс предусмотрен.";
           - если "no": "Аванс прямо исключён.";
           - если "not_defined": "Условие об авансе не установлено."
        </task>

        <context_rules>
        - Перед остальными полями заполни payment_terms_and_schedule_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все signal-поля = "not_defined", все *_display = соответствующий fallback.
        - Используй только текст договора. Не подставляй нормы закона вместо текста договора.
        - payment_method определяй только по прямой формулировке способа оплаты.
        - Не возвращай advance_present = "no" только потому, что аванс не упомянут. "no" — только при прямом исключении.
        - Если в разных фрагментах указаны противоречивые способы оплаты — presence = "unclear", payment_method = "not_defined".
        - Не используй "None", "null" или пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни способа оплаты, ни аванса (только общая фраза
           о расчётах по договору).
           → presence = "missing";
             payment_method = "not_defined";
             advance_present = "not_defined";
             все *_display = соответствующий fallback.

        2. Только способ оплаты без аванса.
           "Оплата производится безналичным перечислением на расчётный счёт
           Подрядчика" без упоминания аванса.
           → presence = "present";
             payment_method = "cashless_transfer";
             advance_present = "not_defined".

        3. Противоречие в способе оплаты.
           В одном пункте "безналичный расчёт", в другом — "оплата наличными
           в кассе Подрядчика".
           → presence = "unclear";
             payment_method = "not_defined";
             payment_method_display = "Не удалось определить".

        4. Аванс без указания способа.
           "Заказчик уплачивает аванс 30% в течение 5 дней" без указания
           способа расчётов.
           → presence = "present";
             payment_method = "not_defined";
             advance_present = "yes".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для payment_terms_and_schedule_presence используй только: "present", "missing", "unclear".
        - Для payment_method используй только: "cashless_transfer", "cash", "mixed", "other", "not_defined".
        - Для advance_present используй только: "yes", "no", "not_defined".
        - Fallback при отсутствии данных:
          * payment_method_display → "Способ оплаты прямо не определён.";
          * advance_present_display → "Условие об авансе не установлено.".
        - Fallback при противоречии или неоднозначности:
          * все *_display → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "payment_terms_and_schedule_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования способа оплаты и аванса. Внутреннее агрегатное signal-поле."
          required: true

        - name: "payment_method"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["cashless_transfer", "cash", "mixed", "other", "not_defined"]
          description: "Способ расчётов по договору."
          required: true
          display_in_grid: false

        - name: "payment_method_display"
          type: "string"
          presentation: "fact"
          label: "Способ оплаты"
          description: "Понятное для юриста описание способа расчётов."
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "advance_present"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Есть ли условие об авансе или предоплате."
          required: true
          display_in_grid: false

        - name: "advance_present_display"
          type: "string"
          presentation: "fact"
          label: "Аванс"
          description: "Понятное для юриста описание наличия аванса."
          required: true
          display_in_grid: true
          display_priority: 1

      store_payload: true

  - id: warranty_period_and_defect_procedure
    name: "Гарантийный срок и порядок предъявления претензий по качеству (ст. 722, 724 ГК РФ)"
    description: >
      Фактографическая проверка продолжительности гарантийного срока
      и срока устранения недостатков подрядчиком.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "гарантийный срок"
        - "гарантия качества"
        - "устранение недостатков"
        - "безвозмездное исправление"
        - "скрытые недостатки"
        - "претензия по качеству"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)гарантийный\\s+срок\\s+составляет\\s+\\d+"
        - "(?i)недостатки.*устраняются.*в\\s+течение\\s+\\d+\\s+дней"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор подряда по ст. 722, 724 ГК РФ.
        Проверяется только один вопрос: указан ли договорный гарантийный срок
        и указан ли срок устранения недостатков.

        Нормативный ориентир:
        - ст. 722 ГК РФ
        - ст. 724 ГК РФ
        - ст. 721 ГК РФ

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Какой гарантийный срок прямо указан в договоре.
        2. Какой срок устранения недостатков прямо указан в договоре.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если текстового значения нет — возвращай строго "Данные не определены".
        4. Не используй "None", "null", "not_defined" или пустые строки.
        5. Не выводи законный срок по умолчанию, если договорный срок
           прямо не установлен.
        6. В evidence включай только текст договора.
        7. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        8. defect_remedy_period заполняй только если срок устранения
           недостатков прямо указан в тексте договора.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — данные определены:
        Фрагмент:
        "Гарантийный срок на результат работ составляет 24 месяца с даты
        подписания акта сдачи-приемки. Подрядчик обязан устранить выявленные
        недостатки в течение 10 рабочих дней с даты получения претензии."

        Ответ:
        {
          "warranty_duration": "24 месяца с даты подписания акта сдачи-приемки",
          "defect_remedy_period": "10 рабочих дней с даты получения претензии",
          "evidence": [
            {
              "clause_ref": "п. 7.1",
              "quote": "Гарантийный срок на результат работ составляет 24 месяца с даты подписания акта сдачи-приемки. Подрядчик обязан устранить выявленные недостатки в течение 10 рабочих дней с даты получения претензии."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Подрядчик обязан выполнять работы надлежащего качества."

        Ответ:
        {
          "warranty_duration": "Данные не определены",
          "defect_remedy_period": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о гарантийном сроке.
        2. Найди прямую цитату о сроке устранения недостатков.
        3. Если прямой цитаты нет — верни "Данные не определены".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "warranty_duration": "<текст или 'Данные не определены'>",
          "defect_remedy_period": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 480

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "гарантийный срок гарантия качества устранение недостатков безвозмездное исправление скрытые недостатки претензия по качеству"
      retrieval_profile: "warranties_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
      negative_keywords:
        - "цена"
        - "аванс"
        - "неустойка"
        - "НДС"
        - "форс-мажор"
        - "подсудность"
        - "уступка"
      position_bias:
        preferred_range: [0.35, 0.95]
        boost: 0.18
        scope: segment
      context_k: 5
      max_chunks: 6
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 550

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      presence_signal:
        field: "warranty_period_and_defect_procedure_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_max_tokens: 350

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора подряда гарантийный
        срок и срок устранения недостатков.
        Не анализируй законные сроки по умолчанию, цену, сроки выполнения работ,
        штрафы или налоги.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. warranty_period_and_defect_procedure_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (warranty_duration, defect_remedy_period)
             ≠ "Данные не определены";
           - "missing" — если оба содержательных поля = "Данные не определены";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - warranty_duration = "Данные не определены";
           - defect_remedy_period = "Данные не определены";
           - не выполняй остальные шаги.

        1. warranty_duration:
           Договорный гарантийный срок в том виде, как он указан в тексте
           (например, "24 месяца с даты подписания акта сдачи-приёмки").
           Не выводи срок из закона по умолчанию.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        2. defect_remedy_period:
           Срок устранения недостатков в том виде, как он указан в тексте
           (например, "10 рабочих дней с даты получения претензии").
           Не выводи срок из закона по умолчанию.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни warranty_period_and_defect_procedure_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — оба поля = "Данные не определены".
        - Используй только текст договора. Не подставляй нормы закона вместо текста договора.
        - Не выводи законный гарантийный срок по умолчанию, если договорный срок прямо не установлен.
        - Общая фраза "Подрядчик обязан выполнять работы надлежащего качества" без конкретного гарантийного срока — warranty_duration = "Данные не определены".
        - Если в разных фрагментах указаны противоречивые сроки — presence = "unclear", оба поля = "Не удалось определить".
        - Не используй "None", "null" или пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни гарантийного срока, ни срока устранения
           недостатков (только общая фраза о качестве).
           → presence = "missing";
             warranty_duration = "Данные не определены";
             defect_remedy_period = "Данные не определены".

        2. Только гарантийный срок без срока устранения.
           "Гарантийный срок составляет 12 месяцев" без указания срока
           устранения недостатков.
           → presence = "present";
             warranty_duration = "12 месяцев";
             defect_remedy_period = "Данные не определены".

        3. Противоречие в сроках.
           В одном пункте "гарантийный срок — 24 месяца", в другом —
           "гарантия действует 12 месяцев".
           → presence = "unclear";
             warranty_duration = "Не удалось определить".

        4. Отсылка на закон без конкретного срока.
           "Гарантийный срок определяется в соответствии со ст. 724 ГК РФ"
           без указания конкретного периода.
           → presence = "present";
             warranty_duration = "Определён в соответствии со ст. 724 ГК РФ"
             (если это прямая цитата из договора);
             defect_remedy_period = "Данные не определены" (если не указан).
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для warranty_period_and_defect_procedure_presence используй только: "present", "missing", "unclear".
        - Fallback при отсутствии данных:
          * warranty_duration → "Данные не определены";
          * defect_remedy_period → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * warranty_duration → "Не удалось определить";
          * defect_remedy_period → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "warranty_period_and_defect_procedure_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие гарантийного срока и срока устранения недостатков. Внутреннее агрегатное signal-поле."
          required: true

        - name: "warranty_duration"
          type: "string"
          presentation: "fact"
          label: "Гарантийный срок"
          description: "Продолжительность гарантийного срока по договору."
          required: true
          display_in_grid: true
          display_priority: 1
          keyword_hints: ["гарантийный срок составляет", "в течение", "месяцев", "лет"]

        - name: "defect_remedy_period"
          type: "string"
          presentation: "fact"
          label: "Срок устранения недостатков"
          description: "Срок, отведённый подрядчику на устранение недостатков."
          required: true
          display_in_grid: true
          display_priority: 2
          keyword_hints: ["устранить недостатки", "в течение", "дней"]

      store_payload: true

  - id: suspension_notification_right
    name: "Право на приостановку и обязанность уведомления (ст. 716, 719 ГК РФ)"
    description: >
      Фактографическая проверка права подрядчика приостановить работы,
      обязанности немедленно уведомить заказчика и описания оснований
      для такой приостановки.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "право приостановить"
        - "обязан уведомить"
        - "немедленно предупредить"
        - "непригодность материалов"
        - "неверные указания"
        - "неисполнение заказчиком"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)подрядчик.*обязан.*немедленно.*(уведомить|предупредить).*заказчика"
        - "(?i)при.*получении.*неверных.*указаний.*приостановить"
        - "(?i)в\\s+случае.*неоплаты\\s+аванса.*подрядчик.*вправе.*приостановить"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор подряда по ст. 716, 719 ГК РФ.
        Проверяется только один вопрос: предусмотрены ли право подрядчика
        приостановить работы и обязанность уведомить заказчика.

        Нормативный ориентир:
        - ст. 716 ГК РФ
        - ст. 719 ГК РФ

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Предусмотрено ли право подрядчика приостановить работы.
        2. Предусмотрена ли обязанность подрядчика уведомить заказчика.
        3. Как описаны основания для приостановки или уведомления.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined".
        4. Если текстового значения нет — возвращай "Данные не определены".
        5. Не используй "None", "null", "not_defined" или пустые строки.
        6. suspension_right_present = "yes" только если право на приостановку
           прямо указано в договоре.
        7. immediate_notification_duty = "yes" только если обязанность
           уведомить или предупредить заказчика прямо указана в договоре.
        8. suspension_grounds заполняй только по прямому тексту договора.
        9. В evidence включай только текст договора.
        10. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — данные определены:
        Фрагмент:
        "При выявлении непригодности материалов Заказчика либо неверных
        указаний Заказчика Подрядчик обязан немедленно уведомить Заказчика
        и вправе приостановить выполнение работ до получения дальнейших
        указаний."

        Ответ:
        {
          "suspension_right_present": "yes",
          "suspension_right_present_display": "Право на приостановку работ предусмотрено.",
          "immediate_notification_duty": "yes",
          "immediate_notification_duty_display": "Обязанность немедленно уведомить заказчика предусмотрена.",
          "suspension_grounds": "Непригодность материалов Заказчика либо неверные указания Заказчика.",
          "evidence": [
            {
              "clause_ref": "п. 5.3",
