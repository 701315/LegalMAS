          display_in_grid: true
          display_priority: 3

      store_payload: true

  - id: intellectual_property_ownership
    name: "Принадлежность результата интеллектуальной деятельности (ст. 1296 ГК РФ)"
    description: >
      Фактографическая проверка того, кому принадлежат исключительные права
      на результат работ, предусмотрен ли механизм передачи прав и как
      это сформулировано в договоре.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "исключительное право"
        - "права на результат"
        - "интеллектуальная собственность"
        - "переходят к заказчику"
        - "отчуждение прав"
        - "проект"
        - "чертёж"
        - "программный код"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)исключительн(ое|ых)\\s+прав(о|а)"
        - "(?i)права.*результат.*переход(ят|ит).*заказчик"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор подряда в части прав на результат
        интеллектуальной деятельности.
        Проверяется только один вопрос: кому принадлежат права на результат
        работ и предусмотрен ли механизм их передачи.

        Нормативный ориентир:
        - ст. 1296 ГК РФ
        - ст. 1297 ГК РФ

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Урегулирована ли принадлежность исключительных прав на результат работ.
        2. Кому по договору принадлежат исключительные права.
        3. Предусмотрен ли механизм передачи прав.
        4. Как именно сформулирована оговорка о правах.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если условие не указано прямо — возвращай "not_defined".
        3. Если текстового значения нет — возвращай "Данные не определены".
        4. Не используй "None", "null", "not_defined" или пустые строки.
        5. ip_rights_clause_present = "yes" только если договор прямо
           регулирует права на результат интеллектуальной деятельности.
        6. exclusive_rights_holder = "customer" только если договор прямо
           указывает на принадлежность прав заказчику.
        7. exclusive_rights_holder = "contractor" только если договор прямо
           указывает на принадлежность прав подрядчику.
        8. exclusive_rights_holder = "shared" только если договор прямо
           устанавливает совместный или разделённый режим прав.
        9. rights_transfer_mechanism определяй только по прямому тексту
           о механизме передачи прав.
        10. rights_clause_details заполняй только по прямой формулировке договора.
        11. В evidence включай только текст договора.
        12. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — данные определены:
        Фрагмент:
        "Исключительные права на созданную в рамках настоящего договора
        проектную документацию переходят к Заказчику с момента полной оплаты.
        Передача прав осуществляется в порядке отчуждения исключительного права."

        Ответ:
        {
          "ip_rights_clause_present": "yes",
          "ip_rights_clause_present_display": "Оговорка о правах на результат предусмотрена.",
          "exclusive_rights_holder": "customer",
          "exclusive_rights_holder_display": "Исключительные права принадлежат Заказчику.",
          "rights_transfer_mechanism": "assignment",
          "rights_transfer_mechanism_display": "Права передаются в порядке отчуждения.",
          "rights_clause_details": "Исключительные права на проектную документацию переходят к Заказчику с момента полной оплаты.",
          "evidence": [
            {
              "clause_ref": "п. 8.1",
              "quote": "Исключительные права на созданную в рамках настоящего договора проектную документацию переходят к Заказчику с момента полной оплаты. Передача прав осуществляется в порядке отчуждения исключительного права."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Подрядчик передает Заказчику результат работ по акту."

        Ответ:
        {
          "ip_rights_clause_present": "not_defined",
          "ip_rights_clause_present_display": "Оговорка о правах на результат в предоставленном контексте не установлена.",
          "exclusive_rights_holder": "not_defined",
          "exclusive_rights_holder_display": "Правообладатель в предоставленном контексте не установлен.",
          "rights_transfer_mechanism": "not_defined",
          "rights_transfer_mechanism_display": "Механизм передачи прав в предоставленном контексте не установлен.",
          "rights_clause_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о принадлежности исключительных прав.
        2. Найди прямую цитату о переходе или передаче прав.
        3. Найди прямую цитату о механизме передачи прав.
        4. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "ip_rights_clause_present": "<yes / no / not_defined>",
          "ip_rights_clause_present_display": "<понятное описание для юриста>",
          "exclusive_rights_holder": "<customer / contractor / shared / not_defined>",
          "exclusive_rights_holder_display": "<понятное описание для юриста>",
          "rights_transfer_mechanism": "<assignment / license / mixed / not_defined>",
          "rights_transfer_mechanism_display": "<понятное описание для юриста>",
          "rights_clause_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 560

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "исключительное право права на результат интеллектуальная собственность переходят к заказчику отчуждение прав проект чертеж программный код"
      retrieval_profile: "ip_ownership_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - definitions
      negative_keywords:
        - "цена"
        - "аванс"
        - "неустойка"
        - "НДС"
        - "гарантия"
        - "подсудность"
      position_bias:
        preferred_range: [0.30, 0.95]
        boost: 0.18
        scope: segment
      context_k: 5
      max_chunks: 6
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
        - "technical_specification"
      excluded_segment_types:
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "definitions"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      presence_signal:
        field: "intellectual_property_ownership_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_max_tokens: 500

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора подряда условия
        о правах на результат интеллектуальной деятельности.
        Не анализируй цену, сроки, гарантию, штрафы или подсудность.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. intellectual_property_ownership_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (ip_rights_clause_present, exclusive_rights_holder,
              rights_transfer_mechanism) ≠ "not_defined";
           - "missing" — если все три содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - ip_rights_clause_present = "not_defined";
           - exclusive_rights_holder = "not_defined";
           - rights_transfer_mechanism = "not_defined";
           - все *_display = соответствующий fallback;
           - rights_clause_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. ip_rights_clause_present:
           - "yes" — если договор прямо регулирует права на результат
             интеллектуальной деятельности;
           - "no" — если договор прямо указывает на отсутствие таких условий;
           - "not_defined" — если по тексту это не установлено.

        2. ip_rights_clause_present_display:
           - если "yes": "Оговорка о правах на результат предусмотрена.";
           - если "no": "Оговорка о правах на результат прямо исключена.";
           - если "not_defined": "Оговорка о правах на результат в предоставленном контексте не установлена."

        3. exclusive_rights_holder:
           - "customer" — права принадлежат заказчику или переходят к нему;
           - "contractor" — права принадлежат подрядчику или сохраняются за ним;
           - "shared" — совместный или разделённый режим прав;
           - "not_defined" — если по тексту это не установлено.

        4. exclusive_rights_holder_display:
           - если "customer": "Исключительные права принадлежат Заказчику.";
           - если "contractor": "Исключительные права принадлежат Подрядчику.";
           - если "shared": "Исключительные права принадлежат сторонам совместно.";
           - если "not_defined": "Правообладатель в предоставленном контексте не установлен."

        5. rights_transfer_mechanism:
           - "assignment" — отчуждение исключительного права;
           - "license" — предоставление лицензии;
           - "mixed" — сочетание отчуждения и лицензии;
           - "not_defined" — если механизм не установлен.

        6. rights_transfer_mechanism_display:
           - если "assignment": "Права передаются в порядке отчуждения.";
           - если "license": "Права передаются по лицензии.";
           - если "mixed": "Предусмотрен смешанный механизм передачи прав.";
           - если "not_defined": "Механизм передачи прав в предоставленном контексте не установлен."

        7. rights_clause_details:
            Формулировка о принадлежности или передаче прав по прямому
            тексту договора.
            Если данных нет — "Данные не определены".
            Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни intellectual_property_ownership_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все signal-поля = "not_defined", все *_display = соответствующий fallback, rights_clause_details = "Данные не определены".
        - Используй только текст договора. Не подставляй нормы ГК РФ (ст. 1296, 1297) вместо текста договора.
        - Фраза "Подрядчик передаёт Заказчику результат работ по акту" без упоминания исключительных прав — ip_rights_clause_present = "not_defined" (передача вещи ≠ передача прав).
        - Если в разных фрагментах указаны противоречивые условия — presence = "unclear", соответствующие поля = "not_defined".
        - Не используй "None", "null" или пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни исключительных прав, ни передачи прав,
           ни оговорки об интеллектуальной собственности.
           → presence = "missing";
             все signal-поля = "not_defined";
             все *_display = соответствующий fallback;
             rights_clause_details = "Данные не определены".

        2. Оговорка есть, но правообладатель не конкретизирован.
           "Стороны урегулируют права на результат интеллектуальной
           деятельности в отдельном соглашении."
           → presence = "present";
             ip_rights_clause_present = "yes";
             exclusive_rights_holder = "not_defined";
             rights_transfer_mechanism = "not_defined".

        3. Противоречие в принадлежности прав.
           В одном пункте "права переходят к Заказчику", в другом —
           "исключительные права сохраняются за Подрядчиком".
           → presence = "unclear";
             exclusive_rights_holder = "not_defined";
             exclusive_rights_holder_display = "Не удалось определить".

        4. Лицензия вместо отчуждения.
           "Подрядчик предоставляет Заказчику неисключительную лицензию
           на использование результата работ на весь срок действия
           исключительного права."
           → presence = "present";
             ip_rights_clause_present = "yes";
             exclusive_rights_holder = "contractor";
             rights_transfer_mechanism = "license";
             rights_clause_details отражает формулировку лицензии.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для intellectual_property_ownership_presence используй только: "present", "missing", "unclear".
        - Для ip_rights_clause_present используй только: "yes", "no", "not_defined".
        - Для exclusive_rights_holder используй только: "customer", "contractor", "shared", "not_defined".
        - Для rights_transfer_mechanism используй только: "assignment", "license", "mixed", "not_defined".
        - Fallback при отсутствии данных:
          * ip_rights_clause_present_display → "Оговорка о правах на результат в предоставленном контексте не установлена.";
          * exclusive_rights_holder_display → "Правообладатель в предоставленном контексте не установлен.";
          * rights_transfer_mechanism_display → "Механизм передачи прав в предоставленном контексте не установлен.";
          * rights_clause_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_display → "Не удалось определить";
          * rights_clause_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "intellectual_property_ownership_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования прав на результат интеллектуальной деятельности. Внутреннее агрегатное signal-поле."
          required: true

        - name: "ip_rights_clause_present"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Есть ли в договоре специальная оговорка о правах на результат."
          required: true
          display_in_grid: false

        - name: "ip_rights_clause_present_display"
          type: "string"
          presentation: "fact"
          label: "Оговорка о правах"
          description: "Понятное для юриста описание наличия оговорки о правах на результат."
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "exclusive_rights_holder"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["customer", "contractor", "shared", "not_defined"]
          description: "Кому принадлежат исключительные права по договору."
          required: true
          display_in_grid: false

        - name: "exclusive_rights_holder_display"
          type: "string"
          presentation: "fact"
          label: "Правообладатель"
          description: "Понятное для юриста описание принадлежности исключительных прав."
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "rights_transfer_mechanism"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["assignment", "license", "mixed", "not_defined"]
          description: "Какой механизм передачи прав предусмотрен."
          required: true
          display_in_grid: false

        - name: "rights_transfer_mechanism_display"
          type: "string"
          presentation: "fact"
          label: "Механизм передачи"
          description: "Понятное для юриста описание механизма передачи прав."
          required: true
          display_in_grid: true
          display_priority: 3

        - name: "rights_clause_details"
          type: "string"
          presentation: "fact"
          label: "Формулировка о правах"
          description: "Формулировка о принадлежности или передаче прав."
          required: true
          display_in_grid: true
          display_priority: 4

      store_payload: true

  - id: customer_cooperation_obligations
    name: "Обязанности заказчика по содействию (ст. 718 ГК РФ)"
    description: >
      Фактографическая проверка того, закреплены ли обязанности заказчика
      по содействию подрядчику, включая предоставление доступа, информации
      и документов, а также последствия несодействия.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "заказчик обязан содействовать"
        - "предоставить доступ"
        - "предоставить информацию"
        - "предоставить документы"
        - "содействие заказчика"
        - "контактное лицо"
        - "непредоставление информации"
        - "задержка по вине заказчика"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)заказчик\\s+обяз(ан|уется)\\s+(содействовать|предоставить)"
        - "(?i)ст\\.?\\s*718\\s+ГК\\s+РФ"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор подряда по ст. 718 ГК РФ.
        Проверяется только один вопрос: какие обязанности по содействию
        возложены на заказчика и какие последствия предусмотрены
        на случай их неисполнения.

        Нормативный ориентир:
        - ст. 718 ГК РФ
        - ст. 719 ГК РФ

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Закреплены ли обязанности заказчика по содействию.
        2. Обязан ли заказчик предоставить доступ, информацию или документы.
        3. Предусмотрены ли последствия несодействия для сроков или права
           подрядчика приостановить работы.
        4. Как именно сформулированы обязанности заказчика.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если условие не указано прямо — возвращай "not_defined".
        3. Если текстового значения нет — возвращай "Данные не определены".
        4. Не используй "None", "null", "not_defined" или пустые строки.
        5. cooperation_obligations_present = "yes" только если договор прямо
           закрепляет обязанности заказчика по содействию.
        6. access_or_information_duty = "yes" только если договор прямо
           требует предоставить доступ, информацию, документы или иное содействие.
        7. delay_consequences_defined = "yes" только если договор прямо
           предусматривает последствия несодействия.
        8. cooperation_details заполняй только по прямой формулировке договора.
        9. В evidence включай только текст договора.
        10. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — данные определены:
        Фрагмент:
        "Заказчик обязан предоставить Подрядчику доступ на объект,
        необходимую техническую документацию и исходные данные.
        В случае непредоставления указанных материалов срок выполнения работ
        подлежит соразмерному продлению, а Подрядчик вправе приостановить работы."

        Ответ:
        {
          "cooperation_obligations_present": "yes",
          "cooperation_obligations_present_display": "Обязанности заказчика по содействию закреплены.",
          "access_or_information_duty": "yes",
          "access_or_information_duty_display": "Заказчик обязан предоставить доступ, информацию и документы.",
          "delay_consequences_defined": "yes",
          "delay_consequences_defined_display": "Последствия несодействия предусмотрены.",
          "cooperation_details": "Заказчик обязан предоставить Подрядчику доступ на объект, необходимую техническую документацию и исходные данные.",
          "evidence": [
            {
              "clause_ref": "п. 3.4",
              "quote": "Заказчик обязан предоставить Подрядчику доступ на объект, необходимую техническую документацию и исходные данные. В случае непредоставления указанных материалов срок выполнения работ подлежит соразмерному продлению, а Подрядчик вправе приостановить работы."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Подрядчик выполняет работы по заданию Заказчика."

        Ответ:
        {
          "cooperation_obligations_present": "not_defined",
          "cooperation_obligations_present_display": "Обязанности заказчика по содействию в предоставленном контексте не установлены.",
          "access_or_information_duty": "not_defined",
          "access_or_information_duty_display": "Обязанность предоставить доступ, информацию или документы в предоставленном контексте не установлена.",
          "delay_consequences_defined": "not_defined",
          "delay_consequences_defined_display": "Последствия несодействия в предоставленном контексте не установлены.",
          "cooperation_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату об обязанностях заказчика по содействию.
        2. Найди прямую цитату о предоставлении доступа, информации или документов.
        3. Найди прямую цитату о последствиях несодействия.
        4. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "cooperation_obligations_present": "<yes / no / not_defined>",
          "cooperation_obligations_present_display": "<понятное описание для юриста>",
          "access_or_information_duty": "<yes / no / not_defined>",
          "access_or_information_duty_display": "<понятное описание для юриста>",
          "delay_consequences_defined": "<yes / no / not_defined>",
          "delay_consequences_defined_display": "<понятное описание для юриста>",
          "cooperation_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 560

    retrieval:
      retrieval_profile: "scope_of_work_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "заказчик обязан содействовать предоставить доступ предоставить информацию предоставить документы содействие заказчика непредоставление информации задержка по вине заказчика"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
      negative_keywords:
        - "цена"
        - "аванс"
        - "неустойка"
        - "НДС"
        - "гарантия"
        - "подсудность"
      position_bias:
        preferred_range: [0.20, 0.80]
        boost: 0.18
        scope: segment
      context_k: 5
      max_chunks: 6
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "price_list"
      preferred_clause_functions:
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      presence_signal:
        field: "customer_cooperation_obligations_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_max_tokens: 500

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора подряда условия
        об обязанностях заказчика по содействию подрядчику.
        Не анализируй цену, сроки выполнения как отдельную тему, гарантию,
        штрафы или подсудность.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. customer_cooperation_obligations_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (cooperation_obligations_present, access_or_information_duty,
              delay_consequences_defined) ≠ "not_defined";
           - "missing" — если все три содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - cooperation_obligations_present = "not_defined";
           - access_or_information_duty = "not_defined";
           - delay_consequences_defined = "not_defined";
           - все *_display = соответствующий fallback;
           - cooperation_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. cooperation_obligations_present:
           - "yes" — если договор прямо закрепляет обязанности заказчика
             по содействию подрядчику;
           - "no" — если договор прямо указывает на отсутствие таких обязанностей;
           - "not_defined" — если по тексту это не установлено.

        2. cooperation_obligations_present_display:
           - если "yes": "Обязанности заказчика по содействию закреплены.";
           - если "no": "Обязанности заказчика по содействию прямо не предусмотрены.";
           - если "not_defined": "Обязанности заказчика по содействию в предоставленном контексте не установлены."

        3. access_or_information_duty:
           - "yes" — если заказчик прямо обязан предоставить доступ,
             информацию, документы или иные необходимые материалы;
           - "no" — если договор прямо исключает такую обязанность;
           - "not_defined" — если это прямо не установлено.

        4. access_or_information_duty_display:
           - если "yes": "Заказчик обязан предоставить доступ, информацию и документы.";
           - если "no": "Обязанность предоставить доступ, информацию или документы прямо исключена.";
           - если "not_defined": "Обязанность предоставить доступ, информацию или документы в предоставленном контексте не установлена."

        5. delay_consequences_defined:
           - "yes" — если прямо предусмотрены последствия несодействия:
             продление сроков, приостановка работ или аналогичные меры;
           - "no" — если договор прямо исключает специальные последствия;
           - "not_defined" — если это прямо не установлено.

        6. delay_consequences_defined_display:
           - если "yes": "Последствия несодействия предусмотрены.";
           - если "no": "Специальные последствия несодействия прямо не предусмотрены.";
           - если "not_defined": "Последствия несодействия в предоставленном контексте не установлены."

        7. cooperation_details:
            Формулировка об обязанностях заказчика по прямому тексту договора.
            Если данных нет — "Данные не определены".
            Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни customer_cooperation_obligations_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все signal-поля = "not_defined", все *_display = соответствующий fallback, cooperation_details = "Данные не определены".
        - Используй только текст договора. Не подставляй нормы ст. 718 ГК вместо текста договора.
        - Фраза "Подрядчик выполняет работы по заданию Заказчика" без конкретных обязанностей по содействию — все *_status = "not_defined".
        - Если в разных фрагментах указаны противоречивые условия — presence = "unclear", соответствующие поля = "not_defined".
        - Не используй "None", "null" или пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни обязанностей по содействию, ни доступа,
           ни последствий несодействия.
           → presence = "missing";
             все signal-поля = "not_defined";
             все *_display = соответствующий fallback;
             cooperation_details = "Данные не определены".

        2. Только содействие без последствий.
           "Заказчик обязан предоставить доступ на объект и техническую
           документацию" без указания последствий несодействия.
           → presence = "present";
             cooperation_obligations_present = "yes";
             access_or_information_duty = "yes";
             delay_consequences_defined = "not_defined".

        3. Противоречие в последствиях.
           В одном пункте "срок продлевается соразмерно", в другом —
           "срок выполнения работ не подлежит изменению".
           → presence = "unclear";
             delay_consequences_defined = "not_defined";
             delay_consequences_defined_display = "Не удалось определить".

        4. Полное регулирование.
           Содействие + доступ/документы + последствия (продление сроков,
           приостановка работ).
           → presence = "present";
             все три signal-поля = "yes";
             cooperation_details отражает полный перечень обязанностей.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для customer_cooperation_obligations_presence используй только: "present", "missing", "unclear".
        - Для cooperation_obligations_present используй только: "yes", "no", "not_defined".
        - Для access_or_information_duty используй только: "yes", "no", "not_defined".
        - Для delay_consequences_defined используй только: "yes", "no", "not_defined".
        - Fallback при отсутствии данных:
          * cooperation_obligations_present_display → "Обязанности заказчика по содействию в предоставленном контексте не установлены.";
          * access_or_information_duty_display → "Обязанность предоставить доступ, информацию или документы в предоставленном контексте не установлена.";
          * delay_consequences_defined_display → "Последствия несодействия в предоставленном контексте не установлены.";
          * cooperation_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_display → "Не удалось определить";
          * cooperation_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "customer_cooperation_obligations_presence"
