        3. Найди прямую цитату о влиянии форс-мажора на сроки.
        4. Найди прямую цитату о праве на расторжение.
        5. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "force_majeure_definition_present": "<yes / no / not_defined>",
          "notification_duty_present": "<yes / no / not_defined>",
          "deadline_suspension_present": "<yes / no / not_defined>",
          "termination_right_after_force_majeure": "<yes / no / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
