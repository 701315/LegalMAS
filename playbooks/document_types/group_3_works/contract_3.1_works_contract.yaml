        Анализируется договор подряда по ст. 716, 719 ГК РФ.
        Проверяется только один вопрос: предусмотрены ли право подрядчика
        приостановить работы и обязанность уведомить заказчика.

        Нормативный ориентир:
        - ст. 716 ГК РФ
        - ст. 719 ГК РФ

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Предусмотрено ли право подрядчика приостановить работы.
        2. Предусмотрена ли обязанность подрядчика уведомить заказчика.
        3. Как описаны основания для приостановки или уведомления.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined".
        4. Если текстового значения нет — возвращай "Данные не определены".
        5. Не используй "None", "null", "not_found" или пустые строки.
        6. suspension_right_present = "yes" только если право на приостановку
           прямо указано в договоре.
        7. immediate_notification_duty = "yes" только если обязанность
           уведомить или предупредить заказчика прямо указана в договоре.
        8. suspension_grounds заполняй только по прямому тексту договора.
        9. В evidence включай только текст договора.
        10. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — данные определены:
        Фрагмент:
        "При выявлении непригодности материалов Заказчика либо неверных
