           - "not_defined" — если по тексту это нельзя установить.

        2. retention_right_present_display:
           - если "yes": "Право удержания результата работ предусмотрено.";
           - если "no": "Право удержания результата работ прямо исключено.";
           - если "not_defined": "Право удержания результата работ в предоставленном контексте не установлено."

        3. retention_object:
           Что именно подрядчик вправе удерживать (например, "результат работ",
           "оборудование и материалы", "изготовленное изделие").
           Заполняй только по прямой формулировке из текста.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        4. retention_condition:
           При каком условии возникает право удержания (например,
           "до полной оплаты выполненных работ", "до погашения задолженности").
           Заполняй только по прямой формулировке из текста.
           Если данных нет — "Данные не определены".
        </task>

        <context_rules>
        - Перед остальными полями заполни retention_right_before_payment_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — retention_right_present = "not_defined", все fact-поля = "Данные не определены".
        - Используй только текст договора. Не подставляй нормы закона вместо текста договора.
        - Не определяй право удержания на основании диспозитивных норм ГК (ст. 712, 359) — только по прямому тексту договора.
        - Если в разных фрагментах указаны противоречивые условия — presence = "unclear", retention_right_present = "not_defined".
        - Не используй "None", "null" или пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни права удержания, ни объекта, ни условия
           (только общая фраза о передаче результата по акту).
           → presence = "missing";
             retention_right_present = "not_defined";
             retention_object = "Данные не определены";
             retention_condition = "Данные не определены".

        2. Право есть, но объект/условие не конкретизированы.
           "Подрядчик вправе удерживать результат работ" без указания
           конкретного объекта и условия.
           → presence = "present";
             retention_right_present = "yes";
             retention_object = "Данные не определены";
             retention_condition = "Данные не определены".

        3. Противоречие в условиях.
           В одном пункте "Подрядчик вправе удерживать результат до оплаты",
           в другом — "Подрядчик обязан передать результат независимо
           от наличия задолженности".
           → presence = "unclear";
             retention_right_present = "not_defined";
             retention_right_present_display = "Не удалось определить".

        4. Право прямо исключено.
           "Подрядчик не вправе удерживать результат работ и обязан
           передать его Заказчику по акту сдачи-приёмки независимо
           от наличия задолженности по оплате."
           → presence = "present";
             retention_right_present = "no";
             retention_object = "Данные не определены";
             retention_condition = "Данные не определены".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для retention_right_before_payment_presence используй только: "present", "missing", "unclear".
        - Для retention_right_present используй только: "yes", "no", "not_defined".
        - Fallback при отсутствии данных:
          * retention_right_present_display → "Право удержания результата работ в предоставленном контексте не установлено.";
          * retention_object → "Данные не определены";
          * retention_condition → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * retention_right_present_display → "Не удалось определить";
          * retention_object → "Не удалось определить";
          * retention_condition → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "retention_right_before_payment_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования права удержания результата. Внутреннее агрегатное signal-поле."
          required: true

        - name: "retention_right_present"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Предусмотрено ли право удержания результата работ."
          required: true
          display_in_grid: false

        - name: "retention_right_present_display"
          type: "string"
          presentation: "fact"
          label: "Право удержания"
          description: "Понятное для юриста описание наличия права удержания результата работ."
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "retention_object"
          type: "string"
