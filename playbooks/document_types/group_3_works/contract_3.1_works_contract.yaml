  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 3: Цена, смета и допработы
  # ──────────────────────────────────────────────────────────────────────────
  - id: price_and_estimate_analysis
    name: "Цена: твёрдая/приблизительная смета, порядок согласования изменений (ст. 709 ГК РФ)"
    description: >
      Фактографическая проверка типа цены (твёрдая / приблизительная /
      тип не определён), суммы цены, порядка изменения сметы и условия
      согласования дополнительных работ.
    triggers:
      any: ["commercial_parties", "fixed_price", "approximate_price"]
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "твёрдая цена"
        - "твёрдая смета"
        - "приблизительная смета"
        - "цена работ"
        - "стоимость работ"
        - "смета"
        - "изменение цены"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)цен[аеуой]\\s+.*?\\d"
        - "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|тыс|млн)"
        - "(?i)(твёрд(ая|ой)|приблизительн(ая|ой))\\s+цен[аеуой]"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор подряда по ст. 709 ГК РФ.
        Проверяется только один вопрос: как в договоре определены цена,
        тип цены, порядок её изменения и согласование дополнительных работ.

        Нормативный ориентир:
        - ст. 709 ГК РФ
        - ст. 743 ГК РФ
        - ст. 432 ГК РФ

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Указан ли тип цены (твёрдая / приблизительная / тип не определён).
        2. Указана ли сумма цены работ.
        3. Описан ли порядок изменения цены или сметы.
        4. Требуется ли согласие заказчика на дополнительные работы
           или дополнительные расходы.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если условие не указано прямо — возвращай "not_defined".
        3. Если текстового значения нет — возвращай "Данные не определены".
        4. Не используй "None", "null", "not_found" или пустые строки.
        5. В evidence включай только текст договора.
        6. Верни только один JSON-объект.
        7. price_type_code = "fixed" только при прямом указании на твёрдую цену
           или твёрдую смету.
        8. price_type_code = "approximate" только при прямом указании на
           приблизительную цену или приблизительную смету.
        9. price_type_code = "not_specified" только если цена или стоимость
           прямо указаны, но тип цены не назван.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — данные определены:
        Фрагмент:
        "Цена работ составляет 1 500 000 рублей и является твердой.
        Изменение цены допускается только по письменному соглашению сторон.
        Выполнение дополнительных работ возможно только после письменного
        согласования с Заказчиком."

        Ответ:
        {
          "price_type_status": "defined",
          "price_type_code": "fixed",
          "price_amount_status": "defined",
          "price_amount_value": "1 500 000 рублей",
          "price_change_procedure": "described",
          "additional_works_consent": "required",
          "evidence": [
            {
              "clause_ref": "п. 4.1",
              "quote": "Цена работ составляет 1 500 000 рублей и является твердой. Изменение цены допускается только по письменному соглашению сторон. Выполнение дополнительных работ возможно только после письменного согласования с Заказчиком."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Объём и порядок выполнения работ определяются сторонами дополнительно."

        Ответ:
        {
          "price_type_status": "not_defined",
          "price_type_code": "not_defined",
          "price_amount_status": "not_defined",
          "price_amount_value": "Данные не определены",
          "price_change_procedure": "not_defined",
          "additional_works_consent": "not_defined",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о цене или стоимости работ.
        2. Найди прямую цитату о типе цены.
        3. Найди прямую цитату о порядке изменения цены или сметы.
        4. Найди прямую цитату о согласовании дополнительных работ.
        5. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "price_type_status": "<defined / not_defined>",
          "price_type_code": "<fixed / approximate / not_specified / not_defined>",
          "price_amount_status": "<defined / not_defined>",
          "price_amount_value": "<текст или 'Данные не определены'>",
          "price_change_procedure": "<described / not_described / not_defined>",
          "additional_works_consent": "<required / not_required / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 650

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "твёрдая цена твёрдая смета приблизительная смета цена работ стоимость работ смета изменение цены дополнительные работы согласие заказчика"
      retrieval_profile: "payment_terms_check"
      preferred_unit_types:
        - obligation
        - general_provision
        - payment_term
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - obligations
      negative_keywords:
        - "гарантия"
        - "форс-мажор"
        - "подсудность"
        - "конфиденциальность"
        - "акт приёмки"
        - "скрытые недостатки"
        - "НДС"
      position_bias:
        preferred_range: [0.10, 0.55]
        boost: 0.20
        scope: segment
      context_k: 5
      max_chunks: 6
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
        - "technical_specification"
      excluded_segment_types:
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 650

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора подряда тип цены,
        сумму цены, порядок изменения сметы и условие согласования
        дополнительных работ.
        Не анализируй сроки, приёмку, гарантию, штрафы или налоги.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. price_type_status — "defined" если из текста прямо можно установить
           тип цены или то, что тип цены не назван, иначе "not_defined".
        2. price_type_code — "fixed" / "approximate" / "not_specified" /
           "not_defined".
        3. price_amount_status — "defined" если сумма цены прямо указана,
           иначе "not_defined".
        4. price_amount_value — сумма цены работ.
        5. price_change_procedure — "described" / "not_described" /
           "not_defined".
        6. additional_works_consent — "required" / "not_required" /
           "not_defined".

        Если данные отсутствуют:
        - статус = "not_defined"
        - текст = "Данные не определены"
        </task>

        <rules>
        - Используй только текст договора.
        - price_type_status:
            - "defined" — если договор прямо указывает на твёрдую /
              приблизительную цену либо позволяет установить, что цена есть,
              но тип не назван.
            - "not_defined" — если по тексту нельзя установить даже наличие
              договорной цены или типа цены.
        - price_type_code:
            - "fixed" — если прямо указана твёрдая цена или твёрдая смета.
            - "approximate" — если прямо указана приблизительная цена
              или приблизительная смета.
            - "not_specified" — если цена или стоимость прямо указаны,
              но тип цены не назван.
            - "not_defined" — если тип цены по тексту не определяется.
        - price_amount_status:
            - "defined" — если сумма цены прямо указана.
            - "not_defined" — если сумма цены прямо не указана.
        - price_change_procedure:
            - "described" — если порядок изменения цены или сметы прямо описан.
            - "not_described" — если цена упомянута, но порядок изменения
              прямо не описан.
            - "not_defined" — если по тексту не установлено наличие условий
              о цене.
        - additional_works_consent:
            - "required" — если дополнительные работы или расходы требуют
              согласия заказчика.
            - "not_required" — если договор прямо допускает их без отдельного
              согласия заказчика.
            - "not_defined" — если это прямо не установлено.
        - Верни только JSON.
        </rules>
      fields:
        - name: "price_type_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения типа цены."
          required: true
        - name: "price_type_code"
          type: "string"
          presentation: "signal"
          label: "Тип цены"
          allowed_values: ["fixed", "approximate", "not_specified", "not_defined"]
          description: "Тип цены или сметы по договору."
          required: true
          display_in_grid: true
          display_priority: 1
        - name: "price_amount_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания суммы цены."
          required: true
        - name: "price_amount_value"
          type: "string"
          presentation: "fact"
          label: "Цена работ"
          description: "Сумма цены работ по договору."
          required: true
          display_in_grid: true
          display_priority: 2
        - name: "price_change_procedure"
          type: "string"
          presentation: "signal"
          label: "Изменение цены"
          allowed_values: ["described", "not_described", "not_defined"]
          description: "Описан ли порядок изменения цены или сметы."
          required: true
          display_in_grid: true
          display_priority: 3
        - name: "additional_works_consent"
          type: "string"
          presentation: "signal"
          label: "Согласование допработ"
          allowed_values: ["required", "not_required", "not_defined"]
          description: "Требуется ли согласие заказчика на дополнительные работы."
          required: true
          display_in_grid: true
          display_priority: 4
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 4: Материалы заказчика
  # ──────────────────────────────────────────────────────────────────────────
  - id: customer_materials_regime_check
    name: "Давальческие материалы: отчётность, норма расхода, возврат остатков (ст. 713, 714 ГК РФ)"
    description: >
      Фактографическая проверка режима использования материалов заказчика:
      отчётность подрядчика, норма расхода, возврат остатков и условия
      сохранности / ответственности.
    triggers:
      any: ["customer_supplied_materials"]
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "давальческие материалы"
        - "материалы заказчика"
        - "норма расхода"
        - "отчёт об использовании"
        - "возврат остатков"
        - "ответственность за сохранность"
        - "давальческое сырьё"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)материал(ы|ов)?\\s+заказчик"
        - "(?i)отчёт\\s+об\\s+использовании.*материал"
        - "(?i)возврат\\s+остатк"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор подряда с материалами заказчика по ст. 713, 714 ГК РФ.
        Проверяется только один вопрос: как урегулирован режим использования
        материалов заказчика.

        Нормативный ориентир:
        - ст. 713 ГК РФ
        - ст. 714 ГК РФ

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Обязан ли подрядчик отчитываться об использовании материалов заказчика.
        2. Указана ли норма расхода материалов.
        3. Обязан ли подрядчик вернуть остатки материалов заказчику.
        4. Урегулированы ли сохранность или ответственность за материалы заказчика.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если условие не указано прямо — возвращай "not_defined".
        3. Если текстового значения нет — возвращай "Данные не определены".
        4. Не используй "None", "null", "not_found" или пустые строки.
        5. В evidence включай только текст договора.
        6. Верни только один JSON-объект.
        7. Не подставляй обязанности из закона, если они не отражены
           в тексте договора.
        8. materials_liability = "specified" только если есть прямая
           формулировка о сохранности, хранении или ответственности.
        9. consumption_norm = "specified" только если норма расхода прямо
           указана или отнесена к приложению.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — данные определены:
        Фрагмент:
        "Подрядчик обязан вести учет использования материалов Заказчика и
        представить отчет по окончании работ. Норма расхода материалов
        определяется Спецификацией № 2. Остатки материалов подлежат возврату
        Заказчику. Подрядчик несет ответственность за сохранность переданных
        материалов."

        Ответ:
        {
          "materials_reporting": "required",
          "consumption_norm": "specified",
          "leftover_return": "required",
          "materials_liability": "specified",
          "evidence": [
            {
              "clause_ref": "п. 5.2",
              "quote": "Подрядчик обязан вести учет использования материалов Заказчика и представить отчет по окончании работ. Норма расхода материалов определяется Спецификацией № 2. Остатки материалов подлежат возврату Заказчику. Подрядчик несет ответственность за сохранность переданных материалов."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Материалы для выполнения работ предоставляет Заказчик."

        Ответ:
        {
          "materials_reporting": "not_mentioned",
          "consumption_norm": "not_specified",
          "leftover_return": "not_defined",
          "materials_liability": "not_specified",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату об отчётности по материалам.
        2. Найди прямую цитату о норме расхода.
        3. Найди прямую цитату о возврате остатков.
        4. Найди прямую цитату о сохранности или ответственности за материалы.
        5. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
