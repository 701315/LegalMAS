      llm_max_tokens: 450

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора подряда сведения
        о стандартах качества, критериях приёмки и способе проверки соответствия.
        Не анализируй гарантию, штрафы, сроки, оплату или налоги.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. quality_standards_referenced — "yes" / "no" / "not_defined".
        2. quality_standards_referenced_display — понятное описание для юриста.
        3. standards_type — "gost" / "tu" / "contract_specific" /
          "sample_based" / "general" / "not_defined".
        4. standards_type_display — понятное описание для юриста.
        5. acceptance_criteria_defined — "yes" / "no" / "not_defined".
        6. acceptance_criteria_defined_display — понятное описание для юриста.
        7. conformity_assessment_method — "testing" / "inspection" /
          "certification" / "not_specified" / "not_defined".
        8. conformity_assessment_method_display — понятное описание для юриста.

        Если данные отсутствуют:
        - статус = "not_defined"
        - текст = "Данные не определены"
        </task>

        <context_rules>
        - Используй только текст договора.
        - quality_standards_referenced:
        - "yes" — если есть прямая ссылка на ГОСТ, ТУ, ТЗ, образец,
        спецификацию или иной стандарт качества.
        - "no" — если качество упомянуто, но конкретный ориентир
        не задан.
        - "not_defined" — если по тексту это нельзя установить.
        - quality_standards_referenced_display:
        - если quality_standards_referenced = "yes":
        "Ссылка на стандарты качества присутствует."
        - если quality_standards_referenced = "no":
        "Конкретный стандарт качества не указан."
        - если quality_standards_referenced = "not_defined":
        "Наличие ссылки на стандарты качества в предоставленном контексте не установлено."
        - standards_type:
        - "gost" — если прямо указан ГОСТ.
        - "tu" — если прямо указаны технические условия.
        - "contract_specific" — если критерии раскрыты в ТЗ,
        спецификации или приложении.
        - "sample_based" — если качество определяется утвержденным образцом.
        - "general" — если есть только общая ссылка на обычно предъявляемые
        требования или аналогичная общая формулировка.
        - "not_defined" — если тип стандарта не установлен.
        - standards_type_display:
        - если standards_type = "gost":
        "ГОСТ."
        - если standards_type = "tu":
        "Технические условия (ТУ)."
        - если standards_type = "contract_specific":
        "Договорные критерии (ТЗ, спецификация, приложение)."
        - если standards_type = "sample_based":
        "Соответствие утвержденному образцу."
        - если standards_type = "general":
        "Общие требования к качеству."
        - если standards_type = "not_defined":
        "Тип стандарта качества не установлен."
        - acceptance_criteria_defined:
        - "yes" — если критерии соответствия или приёмки результата
        прямо определены.
        - "no" — если качество упомянуто, но критерии приёмки
        прямо не определены.
        - "not_defined" — если это нельзя установить.
        - acceptance_criteria_defined_display:
        - если acceptance_criteria_defined = "yes":
        "Критерии приёмки определены."
        - если acceptance_criteria_defined = "no":
        "Критерии приёмки прямо не определены."
        - если acceptance_criteria_defined = "not_defined":
        "Наличие критериев приёмки в предоставленном контексте не установлено."
        - conformity_assessment_method:
        - "testing" — если предусмотрены испытания, тесты или проверка
        через тестирование.
        - "inspection" — если предусмотрены осмотр, измерения, сверка
        параметров или аналогичная инспекция.
        - "certification" — если предусмотрено подтверждение сертификатом,
        протоколом или аналогичным документом.
        - "not_specified" — если критерии качества есть, но способ
        проверки прямо не назван.
        - "not_defined" — если по тексту это нельзя установить.
        - conformity_assessment_method_display:
        - если conformity_assessment_method = "testing":
        "Испытания или тестирование."
        - если conformity_assessment_method = "inspection":
        "Визуальный осмотр и контрольные измерения."
        - если conformity_assessment_method = "certification":
        "Подтверждение сертификатом или протоколом."
        - если conformity_assessment_method = "not_specified":
        "Способ проверки прямо не назван."
        - если conformity_assessment_method = "not_defined":
        "Способ проверки соответствия не установлен."
        </context_rules>

        <output_expectations>
        - Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        </output_expectations>

        <output_format>
        {
          "quality_standards_referenced": "yes | no | not_defined",
          "quality_standards_referenced_display": "string",
          "standards_type": "gost | tu | contract_specific | sample_based | general | not_defined",
          "standards_type_display": "string",
          "acceptance_criteria_defined": "yes | no | not_defined",
          "acceptance_criteria_defined_display": "string",
          "conformity_assessment_method": "testing | inspection | certification | not_specified | not_defined",
          "conformity_assessment_method_display": "string"
        }
        </output_format>

      fields:
        - name: "quality_standards_referenced"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Есть ли ссылка на стандарты качества."
          required: true
          display_in_grid: false

        - name: "quality_standards_referenced_display"
