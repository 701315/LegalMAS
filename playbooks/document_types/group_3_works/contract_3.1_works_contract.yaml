      llm_max_tokens: 500

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора подряда условия
        о расторжении и взаиморасчётах между сторонами.
        Не анализируй цену как самостоятельную тему, гарантию, налоги
        или подсудность.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. termination_grounds_defined — "yes" / "no" / "not_defined".
        2. termination_grounds_defined_display — понятное описание для юриста.
        3. termination_consequences_defined — "yes" / "no" / "not_defined".
        4. termination_consequences_defined_display — понятное описание для юриста.
        5. settlement_on_termination_defined — "yes" / "no" / "not_defined".
        6. settlement_on_termination_defined_display — понятное описание для юриста.
        7. settlement_on_termination — формулировка о взаиморасчётах
          при расторжении.

        Если данные отсутствуют:
        - статус = "not_defined"
        - текст = "Данные не определены"

        Не используй "None", "null" или пустые строки.
        </task>

        <context_rules>
        Используй только текст договора.
        termination_grounds_defined:
        - "yes" — если основания расторжения или отказа прямо описаны.
        - "no" — если договор прямо указывает на отсутствие специальных
        оснований.
        - "not_defined" — если по тексту это не установлено.
        termination_grounds_defined_display:
        - если termination_grounds_defined = "yes":
        "Основания расторжения определены."
        - если termination_grounds_defined = "no":
        "Специальные основания расторжения прямо не предусмотрены."
        - если termination_grounds_defined = "not_defined":
        "Основания расторжения в предоставленном контексте не установлены."
        termination_consequences_defined:
        - "yes" — если последствия расторжения прямо описаны.
        - "no" — если договор прямо указывает на отсутствие специальных
        последствий.
        - "not_defined" — если по тексту это не установлено.
        termination_consequences_defined_display:
        - если termination_consequences_defined = "yes":
        "Последствия расторжения определены."
        - если termination_consequences_defined = "no":
        "Специальные последствия расторжения прямо не предусмотрены."
        - если termination_consequences_defined = "not_defined":
        "Последствия расторжения в предоставленном контексте не установлены."
        settlement_on_termination_defined:
        - "yes" — если порядок взаиморасчётов прямо описан.
        - "no" — если договор прямо исключает специальные взаиморасчёты.
        - "not_defined" — если по тексту это не установлено.
        settlement_on_termination_defined_display:
        - если settlement_on_termination_defined = "yes":
        "Порядок взаиморасчётов при расторжении определён."
        - если settlement_on_termination_defined = "no":
        "Специальный порядок взаиморасчётов при расторжении прямо не предусмотрен."
        - если settlement_on_termination_defined = "not_defined":
        "Порядок взаиморасчётов при расторжении в предоставленном контексте не установлен."
        settlement_on_termination:
        - заполняй только по прямой формулировке договора.
        - если порядок не указан, верни: "Данные не определены".
        </context_rules>

        <output_expectations>
        Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        Верни все 7 ключей, даже если значение = "not_defined"
        или "Данные не определены".
        Не используй "None", "null" или пустые строки.
        </output_expectations>

        <output_format>
        {
          "termination_grounds_defined": "yes | no | not_defined",
          "termination_grounds_defined_display": "string",
          "termination_consequences_defined": "yes | no | not_defined",
          "termination_consequences_defined_display": "string",
          "settlement_on_termination_defined": "yes | no | not_defined",
          "settlement_on_termination_defined_display": "string",
          "settlement_on_termination": "string"
        }
        </output_format>

      fields:
        - name: "termination_grounds_defined"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Определены ли основания расторжения или отказа от исполнения."
          required: true
          display_in_grid: false

        - name: "termination_grounds_defined_display"
          type: "string"
          presentation: "fact"
          label: "Основания расторжения"
          description: "Понятное для юриста описание наличия оснований расторжения."
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "termination_consequences_defined"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Определены ли последствия расторжения."
          required: true
          display_in_grid: false

        - name: "termination_consequences_defined_display"
          type: "string"
          presentation: "fact"
          label: "Последствия расторжения"
          description: "Понятное для юриста описание наличия последствий расторжения."
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "settlement_on_termination_defined"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Определён ли порядок взаиморасчётов при расторжении."
          required: true
          display_in_grid: false

        - name: "settlement_on_termination_defined_display"
          type: "string"
          presentation: "fact"
          label: "Взаиморасчёты"
          description: "Понятное для юриста описание наличия порядка взаиморасчётов при расторжении."
          required: true
          display_in_grid: true
          display_priority: 3

        - name: "settlement_on_termination"
          type: "string"
          presentation: "fact"
          label: "Порядок взаиморасчётов"
          description: "Формулировка о возврате аванса и/или оплате фактически выполненного."
          required: true
          display_in_grid: true
          display_priority: 4

      store_payload: true

  - id: vat_and_tax_allocation
    name: "НДС и налоговые оговорки"
    description: >
