           в другом — "Подрядчик не вправе приостанавливать работы
           ни при каких обстоятельствах".
           → presence = "unclear";
             suspension_right_present = "not_defined";
             suspension_right_present_display = "Не удалось определить".

        4. Полное регулирование.
           Право приостановки + обязанность уведомления + конкретные
           основания (непригодность материалов, неверные указания,
           неоплата аванса) — всё прямо установлено.
           → presence = "present";
             suspension_right_present = "yes";
             immediate_notification_duty = "yes";
             suspension_grounds содержит все перечисленные основания.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для suspension_notification_right_presence используй только: "present", "missing", "unclear".
        - Для suspension_right_present используй только: "yes", "no", "not_defined".
        - Для immediate_notification_duty используй только: "yes", "no", "not_defined".
        - Fallback при отсутствии данных:
          * suspension_right_present_display → "Право на приостановку работ в предоставленном контексте не установлено.";
          * immediate_notification_duty_display → "Обязанность уведомления в предоставленном контексте не установлена.";
          * suspension_grounds → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_display → "Не удалось определить";
          * suspension_grounds → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "suspension_notification_right_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
