          "contractor_details_value": "string",
          "contractor_type": "legal_entity | individual | ip | self_employed | not_defined",
          "contractor_signatory": "string",
          "contractor_signatory_basis": "charter | poa | order | personal | other | not_defined",
          "customer_details_status": "defined | not_defined",
          "customer_details_value": "string",
