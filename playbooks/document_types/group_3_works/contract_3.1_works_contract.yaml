        - "генеральный подрядчик"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)привлечение\\s+субподрядчик.*только.*письменного.*согласия"
        - "(?i)подрядчик.*несёт.*ответственность.*за.*субподрядчик"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор подряда по ст. 706 ГК РФ.
        Проверяется только один вопрос: как договор регулирует привлечение
        субподрядчиков.

        Нормативный ориентир:
        - ст. 706 ГК РФ

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Допускается ли привлечение субподрядчиков.
        2. Требуется ли согласие заказчика на привлечение субподрядчиков.
        3. Закреплена ли ответственность подрядчика за действия субподрядчиков.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined".
        4. Если текстового значения нет — возвращай "Данные не определены".
        5. Не используй "None", "null", "not_defined" или пустые строки.
        6. subcontracting_mode = "allowed_with_consent" только если договор
          прямо требует согласия заказчика.
        7. subcontracting_mode = "prohibited" только если договор прямо
          запрещает привлечение субподрядчиков.
        8. subcontracting_mode = "allowed" только если договор прямо допускает
          привлечение субподрядчиков без дополнительного согласия.
        9. contractor_liability_for_subcontractor = "yes" только если такая
          ответственность прямо закреплена.
        10. В evidence включай только текст договора.
        11. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

