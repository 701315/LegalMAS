        1. На какой стороне лежит риск случайной гибели результата работ
           до приёмки.
        2. На какой стороне лежит риск по материалам заказчика, если это
           прямо урегулировано.
        3. Есть ли условие о страховании рисков.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined".
        4. Если текстового значения нет — возвращай "Данные не определены".
        5. Не используй "None", "null", "not_found" или пустые строки.
        6. risk_bearer_before_acceptance определяй только по прямому тексту
           о распределении риска.
        7. customer_materials_risk_bearer определяй только по прямому тексту
           о риске в отношении материалов заказчика.
        8. insurance_obligation = "yes" только если в договоре прямо
           предусмотрено страхование риска.
        9. В evidence включай только текст договора.
        10. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

