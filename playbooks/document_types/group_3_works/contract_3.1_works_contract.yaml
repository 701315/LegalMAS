          required: true
          display_in_grid: true
          display_priority: 1

        - name: "contractor_liability_for_subcontractor"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Есть ли прямая ответственность подрядчика за субподрядчиков."
          required: true
          display_in_grid: false

        - name: "contractor_liability_for_subcontractor_display"
          type: "string"
