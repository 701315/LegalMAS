      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора условия о банковских гарантиях 
        и финансовом обеспечении исполнения обязательств (независимая гарантия по ст. 368 ГК РФ, 
        гарантия возврата аванса).
        Не анализируй смету, сроки, гарантию качества, страхование или экологию.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. financial_security_and_guarantees_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (performance_bond_required, advance_payment_guarantee_required,
              guarantee_terms_defined) ≠ "not_defined";
           - "missing" — если все три содержательных поля = "not_defined" (или "no");
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - performance_bond_required = "not_defined";
           - advance_payment_guarantee_required = "not_defined";
           - guarantee_terms_defined = "not_defined";
           - financial_security_details = "Данные не определены";
           - financial_security_summary = "Не установлено";
           - не выполняй остальные шаги.

        1. performance_bond_required:
           "yes" / "no" / "not_defined".

        2. advance_payment_guarantee_required:
           "yes" / "no" / "not_defined".

        3. guarantee_terms_defined:
           "yes" / "no" / "not_defined".

        4. financial_security_summary:
           Краткая сводка (какие гарантии требуются, размер, сроки).
           Примеры: "Требуется гарантия исполнения (5%) в течение 5 дней с даты подписания и гарантия возврата аванса (30%) до его перечисления." / "Не установлено".

        5. financial_security_details:
           Подробная формулировка условий финансового обеспечения, или "Данные не определены".
        </task>

        <context_rules>
        - Перед остальными полями заполни financial_security_and_guarantees_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все содержательные сигнальные поля = "not_defined", financial_security_details = "Данные не определены", financial_security_summary = "Не установлено".
        - Используй только текст договора из <context>.
        - Не подставляй данные из нормативных актов или общих знаний.
        - performance_bond_required:
          - "yes" — если договор прямо требует банковскую / независимую гарантию исполнения договора (обеспечение исполнения контракта).
          - "no" — если договор прямо указывает, что гарантия исполнения не требуется.
          - "not_defined" — если вопрос не урегулирован.
        - advance_payment_guarantee_required:
          - "yes" — если договор прямо требует гарантию возврата аванса.
          - "no" — если договор прямо указывает, что гарантия возврата аванса не требуется.
          - "not_defined" — если вопрос не урегулирован.
        - guarantee_terms_defined:
          - "yes" — если прямо указаны сроки предоставления гарантий, их размер (% от цены) или срок действия.
          - "no" — если сроки/размер не определены.
          - "not_defined" — если вопрос не урегулирован.
        - Запрещено использовать null, None, "N/A" или пустые строки.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В договоре нет ни условий о банковских гарантиях, ни требований о финансовом обеспечении аванса.
           → presence = "missing"; все содержательные статусы = "not_defined"; все текстовые поля = "Данные не определены".

        2. Прямой отказ от предоставления банковских гарантий.
           "Предоставление независимых банковских гарантий исполнения обязательств и возврата аванса настоящим Договором не предусмотрено".
           → presence = "present"; performance_bond_required = "no"; advance_payment_guarantee_required = "no"; financial_security_summary = "Банковские гарантии не требуются".

        3. Противоречие между фрагментами.
           В разделе 6 размер гарантии исполнения составляет 5%, а в приложении к конкурсу — "10% от цены договора".
           → presence = "unclear"; guarantee_terms_defined = "not_defined"; financial_security_details = "Не удалось определить".

        4. Обеспечительный платёж вместо банковской гарантии.
           В качестве обеспечения исполнения Подрядчик перечисляет обеспечительный платёж на депозитный счёт Заказчика.
           → presence = "present"; performance_bond_required = "no"; financial_security_summary = "Предусмотрен обеспечительный платёж вместо независимой гарантии".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для financial_security_and_guarantees_presence используй только: "present", "missing", "unclear".
        - Для статусных полей используй только значения из allowed_values.
        - Fallback при отсутствии данных: все текстовые значения → "Данные не определены".
        - Fallback при противоречии или неоднозначности: все текстовые значения → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "financial_security_and_guarantees_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
