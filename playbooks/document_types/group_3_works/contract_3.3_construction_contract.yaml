  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 12: Форс-мажор в длительном строительстве
  # ──────────────────────────────────────────────────────────────────────────
  - id: force_majeure_long_term_construction
    name: "Форс-мажор: уведомление, продление сроков, дополнительные расходы (ст. 401 ГК РФ)"
    description: >
      Фактографическая проверка определения форс-мажора, обязанности уведомления,
      продления сроков, регулирования дополнительных расходов, требования
      справки ТПП и права на расторжение при длительном форс-мажоре.
    triggers: ~
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "форс-мажор"
        - "обстоятельства непреодолимой силы"
        - "продление сроков при форс-мажоре"
        - "уведомление о форс-мажоре"
        - "справка ТПП"
        - "погодные условия, препятствующие работам"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)форс.мажор"
        - "(?i)непреодолимой\\s+силы"
        - "(?i)срок.*продлевается.*пропорционально.*времени.*действия"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор строительного подряда по ст. 401, 416, 417 ГК РФ.
        Проверяется только один вопрос: как договор регулирует форс-мажор
        в условиях длительного строительства.

        Нормативный ориентир:
        - ст. 401 ГК РФ
        - ст. 416 ГК РФ
        - ст. 417 ГК РФ

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли определение форс-мажора / обстоятельств непреодолимой силы.
        2. Есть ли обязанность уведомления о наступлении форс-мажора.
        3. Предусмотрено ли продление сроков.
        4. Урегулированы ли дополнительные расходы, возникающие из-за форс-мажора.
        5. Требуется ли подтверждение ТПП или аналогичный документ.
        6. Есть ли право на расторжение при длительном форс-мажоре.
        7. Как в целом сформулирован режим форс-мажора.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined".
        4. Если текстового значения нет — возвращай "Данные не определены".
        5. Не используй "None", "null", "not_found" или пустые строки.
        6. force_majeure_definition_present = "yes" только если договор
           прямо содержит определение форс-мажора или перечень соответствующих событий.
        7. notification_duty_present = "yes" только если обязанность уведомления
           прямо закреплена.
        8. deadline_extension_present = "yes" только если прямо предусмотрены
           продление, перенос или приостановление сроков.
        9. additional_costs_regulated = "yes" только если договор прямо
           регулирует распределение дополнительных расходов.
        10. tpp_certificate_required = "yes" только если прямо требуется
            справка ТПП или аналогичное подтверждение.
        11. termination_after_long_force_majeure = "yes" только если договор
            прямо предусматривает право на расторжение при длительном форс-мажоре.
        12. force_majeure_details заполняй только по прямому тексту договора.
        13. В evidence включай только текст договора.
        14. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — данные определены:
        Фрагмент:
        "Под обстоятельствами непреодолимой силы стороны понимают форс-мажорные
        события, препятствующие исполнению договора. Сторона обязана уведомить
        другую сторону в течение 3 рабочих дней. Срок исполнения обязательств
        продлевается на период действия форс-мажора. Дополнительные расходы,
        вызванные форс-мажором, стороны несут самостоятельно. Факт форс-мажора
        подтверждается справкой ТПП. Если форс-мажор длится более 90 дней,
        любая из сторон вправе расторгнуть договор."

        Ответ:
        {
          "force_majeure_definition_present": "yes",
          "notification_duty_present": "yes",
          "deadline_extension_present": "yes",
          "additional_costs_regulated": "yes",
          "tpp_certificate_required": "yes",
          "termination_after_long_force_majeure": "yes",
          "force_majeure_details": "Срок исполнения обязательств продлевается на период действия форс-мажора, дополнительные расходы стороны несут самостоятельно.",
          "evidence": [
            {
              "clause_ref": "п. 11.1",
              "quote": "Под обстоятельствами непреодолимой силы стороны понимают форс-мажорные события... Срок исполнения обязательств продлевается на период действия форс-мажора. Дополнительные расходы, вызванные форс-мажором, стороны несут самостоятельно. Факт форс-мажора подтверждается справкой ТПП..."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Стороны освобождаются от ответственности в случаях,
        предусмотренных законодательством."

        Ответ:
        {
          "force_majeure_definition_present": "not_defined",
          "notification_duty_present": "not_defined",
          "deadline_extension_present": "not_defined",
          "additional_costs_regulated": "not_defined",
          "tpp_certificate_required": "not_defined",
          "termination_after_long_force_majeure": "not_defined",
          "force_majeure_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о форс-мажоре.
        2. Найди прямую цитату об уведомлении.
        3. Найди прямую цитату о продлении сроков.
        4. Найди прямую цитату о дополнительных расходах.
        5. Найди прямую цитату о справке ТПП.
        6. Найди прямую цитату о праве на расторжение.
        7. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "force_majeure_definition_present": "<yes / no / not_defined>",
          "notification_duty_present": "<yes / no / not_defined>",
          "deadline_extension_present": "<yes / no / not_defined>",
          "additional_costs_regulated": "<yes / no / not_defined>",
          "tpp_certificate_required": "<yes / no / not_defined>",
          "termination_after_long_force_majeure": "<yes / no / not_defined>",
          "force_majeure_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 760

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "форс-мажор обстоятельства непреодолимой силы продление сроков при форс-мажоре уведомление о форс-мажоре справка ТПП погодные условия дополнительные расходы"
      retrieval_profile: "force_majeure_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - boilerplate
      negative_keywords:
        - "КС-2"
        - "КС-3"
        - "гарантийный срок"
        - "неустойка"
        - "НДС"
        - "СРО"
      position_bias:
        preferred_range: [0.55, 1.0]
        boost: 0.18
        scope: segment
      context_k: 5
      max_chunks: 6
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "boilerplate"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.14

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 750

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора строительного подряда
        условия о форс-мажоре, уведомлении, продлении сроков и дополнительных расходах.
        Не анализируй смету, гарантию, технадзор, экологию или СРО.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. force_majeure_definition_present — "yes" / "no" / "not_defined".
        2. notification_duty_present — "yes" / "no" / "not_defined".
        3. deadline_extension_present — "yes" / "no" / "not_defined".
        4. additional_costs_regulated — "yes" / "no" / "not_defined".
        5. tpp_certificate_required — "yes" / "no" / "not_defined".
        6. termination_after_long_force_majeure — "yes" / "no" / "not_defined".
        7. force_majeure_details — формулировка о форс-мажоре и его последствиях.

        Если данные отсутствуют:
        - статус = "not_defined"
        - текст = "Данные не определены"
        </task>

        <rules>
        - Используй только текст договора.
        - force_majeure_definition_present:
            - "yes" — если есть определение форс-мажора или перечень событий.
            - "no" — если договор прямо указывает на отсутствие такого раздела.
            - "not_defined" — если по тексту это не установлено.
        - notification_duty_present:
            - "yes" — если обязанность уведомления прямо закреплена.
            - "no" — если договор прямо исключает такую обязанность.
            - "not_defined" — если по тексту это не установлено.
        - deadline_extension_present:
            - "yes" — если прямо предусмотрены продление, перенос
              или приостановление сроков.
            - "no" — если договор прямо исключает такое последствие.
            - "not_defined" — если по тексту это не установлено.
        - additional_costs_regulated:
            - "yes" — если договор прямо регулирует дополнительные расходы
              из-за форс-мажора.
            - "no" — если договор прямо исключает специальное регулирование.
            - "not_defined" — если по тексту это не установлено.
        - tpp_certificate_required:
            - "yes" — если прямо требуется справка ТПП или аналогичный документ.
            - "no" — если договор прямо исключает такое подтверждение.
            - "not_defined" — если по тексту это не установлено.
        - termination_after_long_force_majeure:
            - "yes" — если при длительном форс-мажоре допускается расторжение.
            - "no" — если договор прямо исключает такое право.
            - "not_defined" — если по тексту это не установлено.
        - force_majeure_details заполняй только по прямому тексту договора.
        - Верни только JSON.
        </rules>
      fields:
        - name: "force_majeure_definition_present"
          type: "string"
          presentation: "signal"
          label: "Форс-мажор"
          allowed_values: ["yes", "no", "not_defined"]
