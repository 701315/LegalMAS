      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора строительного подряда
        условия о консервации строительства при приостановке работ: процедура
        оформления, распределение расходов, оплата выполненных работ и охрана
        законсервированного объекта (ст. 752 ГК РФ).
        Не анализируй смету, сроки, гарантию, страхование или экологию.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. construction_conservation_procedure_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (conservation_procedure_defined, conservation_costs_allocation,
              conservation_payment_terms, conservation_guard_duty) ≠ "not_defined";
           - "missing" — если все содержательные поля = "not_defined" (или "no");
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - conservation_procedure_defined = "not_defined";
           - conservation_costs_allocation = "not_defined";
           - conservation_payment_terms = "not_defined";
           - conservation_guard_duty = "not_defined";
           - conservation_details = "Данные не определены";
           - conservation_summary = "Не установлено";
           - не выполняй остальные шаги.

        1. conservation_procedure_defined:
           "yes" / "no" / "not_defined".

        2. conservation_costs_allocation:
           "customer" / "contractor" / "shared" / "not_defined".

        3. conservation_payment_terms:
           "full" / "partial" / "not_defined".

        4. conservation_guard_duty:
           "customer" / "contractor" / "shared" / "not_defined".

        5. conservation_summary:
           Краткая сводка по консервации.
           Примеры: "Консервация при приостановке > 6 месяцев; расходы и охрана на Заказчике; оплата выполненных работ в течение 30 дней." / "Не установлено".

        6. conservation_details:
           Подробная формулировка условий консервации, или "Данные не определены".
        </task>

        <context_rules>
        - Перед остальными полями заполни construction_conservation_procedure_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все содержательные сигнальные поля = "not_defined", conservation_details = "Данные не определены", conservation_summary = "Не установлено".
        - Используй только текст договора из <context>.
        - Не подставляй данные из нормативных актов или общих знаний.
        - conservation_procedure_defined:
          - "yes" — если договор прямо предусматривает порядок консервации (акт, сроки, оформление).
          - "no" — если договор прямо исключает консервацию.
          - "not_defined" — вопрос не урегулирован.
        - conservation_costs_allocation:
          - "customer" — если расходы на консервацию несёт Заказчик (по умолчанию ст. 752 ГК РФ).
          - "contractor" — если расходы возложены на Подрядчика.
          - "shared" — если расходы распределены.
          - "not_defined" — вопрос не урегулирован.
        - conservation_payment_terms:
          - "full" — если Заказчик оплачивает все фактически выполненные работы + расходы на консервацию.
          - "partial" — если оплачиваются только прямые затраты.
          - "not_defined" — вопрос не урегулирован.
        - conservation_guard_duty:
          - "customer" — если охрану законсервированного объекта обеспечивает Заказчик.
          - "contractor" — если охрану обеспечивает Подрядчик.
          - "shared" — если обязанности распределены.
          - "not_defined" — вопрос не урегулирован.
        - Запрещено использовать null, None, "N/A" или пустые строки.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В договоре нет ни условий о консервации, ни упоминания приостановки строительства с оформлением акта.
           → presence = "missing"; все содержательные статусы = "not_defined"; все текстовые поля = "Данные не определены".

        2. Сезонная приостановка без консервации.
           Договор предусматривает технологический перерыв на зимний период без оформления консервации.
           → presence = "present"; conservation_procedure_defined = "no"; conservation_summary = "Предусмотрен зимний перерыв без оформления консервации".

        3. Противоречие между фрагментами.
           В разделе 13 расходы на консервацию несёт Заказчик, а в приложении: "Подрядчик обеспечивает консервацию за свой счёт".
           → presence = "unclear"; conservation_costs_allocation = "not_defined"; conservation_details = "Не удалось определить".

        4. Консервация по инициативе Заказчика с особыми условиями.
           Заказчик вправе объявить консервацию при недостатке финансирования; Подрядчик обязан законсервировать объект в течение 10 дней, расходы компенсируются по факту.
           → presence = "present"; conservation_procedure_defined = "yes"; conservation_costs_allocation = "customer"; conservation_payment_terms = "full".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для construction_conservation_procedure_presence используй только: "present", "missing", "unclear".
        - Для статусных полей используй только значения из allowed_values.
        - Fallback при отсутствии данных: все текстовые значения → "Данные не определены".
        - Fallback при противоречии или неоднозначности: все текстовые значения → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "construction_conservation_procedure_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования консервации строительства в договоре. Внутреннее агрегатное signal-поле."
