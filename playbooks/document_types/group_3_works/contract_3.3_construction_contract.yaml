        - "приостановить работу до получения указаний"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)предупред.*заказчик|уведом.*заказчик.*о.*непригод"
        - "(?i)непригодн.*материал|недоброкачественн"
        - "(?i)ст\\.?\\s*716\\s+ГК\\s+РФ"
        - "(?i)потер.*прав.*ссылать"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор строительного подряда по ст. 716, 743 ГК РФ.
        Проверяется только один вопрос: как в договоре урегулирована обязанность 
        Подрядчика предупредить Заказчика о непригодности материалов, оборудования, 
        технической документации или ошибочных указаниях, и какие последствия 
        предусмотрены за несообщение.

        Нормативный ориентир:
        - ст. 716 ГК РФ (обязанность Подрядчика предупредить Заказчика)
        - ст. 743 ГК РФ (обязанность Подрядчика при обнаружении ошибок в ПД)

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не оценивай риск, фиксируй условия буквально.
        - По ст. 716 ГК РФ Подрядчик обязан немедленно предупредить Заказчика и до 
          получения указаний приостановить работу. Если Подрядчик не предупредил — 
          он теряет право ссылаться на эти обстоятельства.
        - Это один из самых частых источников споров в строительном подряде.

        [ЗАДАЧА]
        1. Закреплена ли обязанность Подрядчика предупредить Заказчика о непригодности.
        2. На что распространяется обязанность предупреждения (материалы, ПД, указания).
        3. Какова процедура предупреждения (письменно, немедленно, в какой срок).
        4. Какие последствия предусмотрены за несообщение (потеря права ссылаться, 
           ответственность Подрядчика).
        5. Сформируй краткую сводку.
        6. Извлеки подробную формулировку.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона вместо текста договора.
        2. Если условие не указано прямо — возвращай "not_defined" для статусов и "Данные не определены" для текста.
        3. Не используй "None", "null", "N/A" или пустые строки.
        4. warning_obligation_defined = "yes" только если договор прямо закрепляет 
           обязанность Подрядчика предупредить Заказчика.
        5. В сводке пиши кратко, на русском языке.
        6. В evidence включай только точные цитаты из текста договора.
        7. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — данные определены:
        Фрагмент:
        "Подрядчик обязан немедленно в письменной форме предупредить Заказчика 
        о непригодности или недоброкачественности предоставленных материалов, 
        оборудования или технической документации, а также о том, что указания 
        Заказчика могут привести к нарушению строительных норм. При несообщении 
        Подрядчик теряет право ссылаться на указанные обстоятельства."

        Ответ:
        {
          "warning_obligation_defined": "yes",
          "warning_scope": "all",
          "warning_procedure": "written",
          "consequence_of_failure_to_warn": "loss_of_claims",
          "warning_summary": "Подрядчик обязан немедленно письменно предупредить Заказчика о непригодности материалов, ПД и ошибочных указаниях; при несообщении теряет право ссылаться.",
          "warning_details": "Подрядчик обязан немедленно в письменной форме предупредить Заказчика о непригодности или недоброкачественности материалов, оборудования или технической документации, а также о том, что указания Заказчика могут привести к нарушению строительных норм. При несообщении Подрядчик теряет право ссылаться на указанные обстоятельства.",
          "evidence": [
            {
              "clause_ref": "п. 5.3",
              "quote": "Подрядчик обязан немедленно в письменной форме предупредить Заказчика о непригодности или недоброкачественности предоставленных материалов, оборудования или технической документации..."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Подрядчик выполняет работы в соответствии с проектом."

        Ответ:
        {
          "warning_obligation_defined": "not_defined",
          "warning_scope": "not_defined",
          "warning_procedure": "not_defined",
          "consequence_of_failure_to_warn": "not_defined",
          "warning_summary": "Не установлено",
          "warning_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату об обязанности предупредить Заказчика.
        2. Найди прямую цитату о предмете предупреждения (материалы, ПД, указания).
        3. Найди прямую цитату о процедуре (письменно, немедленно).
        4. Найди прямую цитату о последствиях несообщения.
        5. Если прямой цитаты нет — верни "not_defined" / "Данные не определены".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "warning_obligation_defined": "<yes / no / not_defined>",
          "warning_scope": "<materials / docs / instructions / all / not_defined>",
          "warning_procedure": "<written / immediate / not_defined>",
