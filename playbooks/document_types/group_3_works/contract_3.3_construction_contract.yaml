           → presence = "missing"; все содержательные статусы = "not_defined"; все текстовые поля = "Данные не определены".

        2. Только предупреждение о материалах.
           Подрядчик обязан сообщить о некачественных материалах Заказчика, но о недостатках ПД и указаниях не упомянуто.
           → presence = "present"; warning_obligation_defined = "yes"; warning_scope = "materials"; warning_summary = "Предупреждение только о непригодности материалов; ПД и указания не охвачены".

        3. Противоречие между фрагментами.
