  - id: hidden_works_certification
    name: "Освидетельствование скрытых работ (ст. 753, 754 ГК РФ, СП 48.13330, РД-11-02-2006)"
    description: >
      Фактографическая проверка порядка освидетельствования скрытых работ 
      и ответственных конструкций: обязательность составления актов АОСР, 
      запрет закрытия последующими работами без вызова Заказчика, сроки 
      предварительного уведомления, ведение журнала работ и обязанность 
      Подрядчика вскрыть конструкции за свой счет при нарушении процедуры.
    triggers:
      any: ["hidden_works_present"]
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "акт освидетельствования скрытых работ"
        - "АОСР"
        - "скрытые работы"
        - "до начала последующих работ"
        - "журнал производства работ"
        - "освидетельствование"
        - "вскрытие за счет подрядчика"
        - "уведомление заказчика"
        - "вызов заказчика на освидетельствование"
        - "РД-11-02-2006"
        - "СП 48.13330"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)скрытые.*работы.*подлежат.*освидетельствованию"
        - "(?i)акт.*освидетельствования.*скрытых.*работ"
        - "(?i)вскрыти.*за\\s+счет\\s+подрядчик"
        - "(?i)уведомит.*заказчик.*за\\s+\\d+\\s+(день|часа|рабочих)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор строительного подряда по ст. 753, 754 ГК РФ, СП 48.13330 и РД-11-02-2006.
        Проверяется только один вопрос: как в договоре урегулированы освидетельствование скрытых работ, 
        сроки уведомления Заказчика и санкция за закрытие без проверки.

        Нормативный ориентир:
        - ст. 753 ГК РФ (сдача и приёмка работ)
        - ст. 754 ГК РФ (ответственность за ненадлежащее качество строительных работ)
        - СП 48.13330.2011 (организация строительства)
        - РД-11-02-2006 (требования к составу и порядку ведения исполнительной документации)

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не оценивай риск, фиксируй условия буквально.
        - Ключевые маркеры для РФ-практики: (1) срок предварительного вызова Заказчика 
          (обычно 24–48 часов или 2–3 рабочих дня), (2) обязанность Подрядчика вскрыть 
          скрытые работы за свой счет при закрытии без АОСР/без вызова Заказчика.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Предусмотрено ли освидетельствование скрытых работ (АОСР).
        2. Требуется ли освидетельствование до закрытия последующими работами.
        3. Требуется ли отдельный акт освидетельствования скрытых работ.
        4. Есть ли указание на журнал производства работ.
        5. Указан ли срок предварительного уведомления / вызова Заказчика.
        6. Предусмотрена ли обязанность Подрядчика вскрыть скрытые работы за свой счет 
           при закрытии без освидетельствования.
        7. Сформируй краткую сводку по порядку освидетельствования скрытых работ.
        8. Извлеки подробную формулировку условий.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона вместо текста договора.
        2. Если условие не указано прямо — возвращай "not_defined" для статусов и "Данные не определены" для текста.
        3. Не используй "None", "null", "not_defined" или пустые строки в JSON.
        4. hidden_works_certification_present = "yes" только если договор прямо предусматривает освидетельствование.
        5. В сводке (summary) пиши кратко, на русском языке, фиксируя срок уведомления и санкцию за вскрытие.
        6. В evidence включай только точные цитаты из текста договора.
        7. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        со всеми 8 ключами.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — данные определены:
        Фрагмент:
        "Скрытые работы подлежат обязательному освидетельствованию до начала последующих работ. 
        Подрядчик обязан уведомить Заказчика за 2 рабочих дня до даты освидетельствования. 
        По результатам составляется акт освидетельствования скрытых работ (АОСР). 
        Сведения отражаются в журнале производства работ. При закрытии скрытых работ без 
        вызова Заказчика Подрядчик обязан по требованию вскрыть конструкции за свой счет."

        Ответ:
        {
          "hidden_works_certification_present": "yes",
          "certification_before_covering": "yes",
          "hidden_works_act_required": "yes",
          "work_log_reference": "yes",
          "advance_notice_period_defined": "yes",
          "uncovering_at_contractor_expense": "yes",
          "hidden_works_summary": "АОСР обязателен до закрытия; уведомление Заказчика за 2 рабочих дня; при закрытии без вызова — вскрытие за счет Подрядчика.",
          "hidden_works_procedure_details": "Скрытые работы подлежат обязательному освидетельствованию до начала последующих работ с составлением АОСР; Подрядчик уведомляет Заказчика за 2 рабочих дня; сведения отражаются в журнале; при закрытии без вызова — вскрытие за счет Подрядчика.",
          "evidence": [
            {
              "clause_ref": "п. 7.3",
              "quote": "Скрытые работы подлежат обязательному освидетельствованию до начала последующих работ. Подрядчик обязан уведомить Заказчика за 2 рабочих дня до даты освидетельствования..."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Подрядчик выполняет работы по устройству фундамента в соответствии с проектной документацией."

        Ответ:
        {
          "hidden_works_certification_present": "not_defined",
          "certification_before_covering": "not_defined",
          "hidden_works_act_required": "not_defined",
          "work_log_reference": "not_defined",
          "advance_notice_period_defined": "not_defined",
          "uncovering_at_contractor_expense": "not_defined",
          "hidden_works_summary": "Не установлено",
          "hidden_works_procedure_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату об освидетельствовании скрытых работ.
        2. Найди прямую цитату о проведении до закрытия последующими работами.
        3. Найди прямую цитату об отдельном акте (АОСР).
        4. Найди прямую цитату о журнале работ.
        5. Найди прямую цитату о сроке уведомления Заказчика.
        6. Найди прямую цитату об обязанности вскрытия за счет Подрядчика.
        7. Если прямой цитаты нет — верни "not_defined" / "Данные не определены".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "hidden_works_certification_present": "<yes / no / not_defined>",
          "certification_before_covering": "<yes / no / not_defined>",
          "hidden_works_act_required": "<yes / no / not_defined>",
          "work_log_reference": "<yes / no / not_defined>",
          "advance_notice_period_defined": "<yes / no / not_defined>",
          "uncovering_at_contractor_expense": "<yes / no / not_defined>",
          "hidden_works_summary": "<краткая сводка>",
          "hidden_works_procedure_details": "<подробный текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 950

