          - "docs" — удержание распространяется только на документацию.
          - "both" — удержание распространяется на объект и документацию.
          - "not_defined" — не урегулировано.
        - Запрещено использовать null, None, "N/A" или пустые строки.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В договоре нет ни упоминания права удержания, ни условий о передаче объекта независимо от оплаты.
           → presence = "missing"; все содержательные статусы = "not_defined"; все текстовые поля = "Данные не определены".

        2. Передача документации при удержании объекта.
           Подрядчик вправе удерживать объект до оплаты, но обязан передать исполнительную документацию в любом случае.
           → presence = "present"; retention_right_defined = "yes"; retention_right_waived = "no"; retention_scope = "object".

        3. Противоречие между фрагментами.
           В разделе 8: "Подрядчик вправе удерживать объект до полной оплаты", а в разделе 12: "Передача объекта осуществляется независимо от расчётов".
           → presence = "unclear"; retention_right_waived = "not_defined"; retention_details = "Не удалось определить".

        4. Прямое подтверждение права удержания.
           "Подрядчик сохраняет право удержания результата работ в соответствии со ст. 712 ГК РФ до полного расчёта".
           → presence = "present"; retention_right_defined = "yes"; retention_right_waived = "no"; retention_scope = "both".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для contractor_retention_right_presence используй только: "present", "missing", "unclear".
        - Для статусных полей используй только значения из allowed_values.
        - Fallback при отсутствии данных: все текстовые значения → "Данные не определены".
        - Fallback при противоречии или неоднозначности: все текстовые значения → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "contractor_retention_right_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования права удержания результата в договоре. Внутреннее агрегатное signal-поле."
          required: true

        - name: "retention_right_defined"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Закреплено ли право Подрядчика на удержание результата работ. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "retention_right_waived"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Отказался ли Подрядчик от права удержания. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "retention_scope"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["object", "docs", "both", "not_defined"]
          description: "На что распространяется удержание (объект, документация, оба). Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "retention_summary"
          type: "string"
          presentation: "fact"
          label: "Удержание результата"
          description: >
            Сводка: право Подрядчика на удержание результата работ до оплаты, отказ от удержания (ст. 712 ГК РФ). Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "retention_details"
          label: "Право удержания результата работ"
          type: "string"
          presentation: "fact"
          description: >
            Подробная формулировка о праве удержания. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: false

      store_payload: true

  - id: result_transfer_and_ownership
    name: "Передача результата работ и переход права собственности (ст. 703, 720, 219 ГК РФ)"
    description: >
      Фактографическая проверка порядка передачи результата выполненных работ  Заказчику, момента перехода права собственности на объект строительства,  условий передачи исполнительной документации и оборудования, а также  наличия оговорок о сохранении права собственности за Подрядчиком  до полной оплаты (ст. 703, 720, 219, 491 ГК РФ).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "medium"
    severity_if_pass: "pass"
    severity_if_fail: "medium"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "передача результата"
        - "переход права собственности"
        - "право собственности на объект"
        - "передача объекта заказчику"
        - "акт передачи"
        - "сохранение права собственности"
        - "до полной оплаты"
        - "передача исполнительной документации"
        - "передача оборудования"
        - "момент перехода"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)переход.*прав.*собственност"
        - "(?i)передач.*результат|передач.*объект.*заказчик"
        - "(?i)сохранен.*прав.*собственност|прав.*собственност.*до.*оплат"
        - "(?i)ст\\.?\\s*(219|703|720)\\s+ГК\\s+РФ"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор строительного подряда по ст. 703, 720, 219 ГК РФ.
        Проверяется только один вопрос: как урегулирована передача результата 
        работ Заказчику, когда переходит право собственности на объект и есть ли 
        оговорка о сохранении права собственности за Подрядчиком до полной оплаты.

        Нормативный ориентир:
        - ст. 703 ГК РФ (предмет договора подряда — изготовление и передача результата)
        - ст. 720 ГК РФ (приёмка работ заказчиком)
        - ст. 219 ГК РФ (возникновение права собственности на вновь создаваемое недвижимое имущество)
        - ст. 491 ГК РФ (сохранение права собственности за продавцом до оплаты)

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не оценивай риск, фиксируй условия буквально.
        - В большинстве случаев строительства на земле Заказчика право собственности 
          возникает у Заказчика по мере создания объекта (ст. 219 ГК РФ). 
          Оговорка о сохранении права за Подрядчиком до оплаты — редкость, но встречается.
        - Различай «передачу объекта по акту» (фактическая передача) и «переход 
          права собственности» (юридический факт).

        [ЗАДАЧА]
        1. Определён ли порядок передачи результата работ Заказчику.
        2. Определён ли момент перехода права собственности на объект.
        3. Есть ли оговорка о сохранении права собственности за Подрядчиком до оплаты.
        4. Определён ли порядок передачи исполнительной документации и оборудования.
        5. Сформируй краткую сводку.
        6. Извлеки подробную формулировку.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона вместо текста договора.
        2. Если условие не указано прямо — возвращай "not_defined" для статусов и "Данные не определены" для текста.
        3. Не используй "None", "null", "N/A" или пустые строки.
        4. В evidence включай только точные цитаты из текста договора.
        5. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — данные определены:
        Фрагмент:
        "Подрядчик передаёт Заказчику результат выполненных работ по акту 
        сдачи-приёмки. Право собственности на объект строительства переходит 
        к Заказчику с момента государственной регистрации. Исполнительная 
        документация передаётся одновременно с актом. Право собственности 
        на результат работ сохраняется за Подрядчиком до полной оплаты."

        Ответ:
        {
          "result_transfer_procedure_defined": "yes",
          "ownership_transfer_moment": "registration",
          "ownership_retention_clause": "yes",
          "docs_and_equipment_transfer_defined": "yes",
          "result_transfer_summary": "Передача по акту; право собственности — с момента госрегистрации; оговорка о сохранении права за Подрядчиком до оплаты; документация передаётся с актом.",
          "result_transfer_details": "Подрядчик передаёт результат по акту сдачи-приёмки. Право собственности переходит с момента госрегистрации. Исполнительная документация передаётся одновременно с актом. Право собственности сохраняется за Подрядчиком до полной оплаты.",
          "evidence": [
            {
              "clause_ref": "п. 9.1",
              "quote": "Подрядчик передаёт Заказчику результат выполненных работ по акту сдачи-приёмки. Право собственности на объект строительства переходит к Заказчику с момента государственной регистрации."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Подрядчик обязуется выполнить работы и сдать их Заказчику."

        Ответ:
        {
          "result_transfer_procedure_defined": "not_defined",
          "ownership_transfer_moment": "not_defined",
          "ownership_retention_clause": "not_defined",
          "docs_and_equipment_transfer_defined": "not_defined",
          "result_transfer_summary": "Не установлено",
          "result_transfer_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о передаче результата работ.
        2. Найди прямую цитату о моменте перехода права собственности.
        3. Найди прямую цитату о сохранении права собственности до оплаты.
        4. Найди прямую цитату о передаче документации и оборудования.
        5. Если прямой цитаты нет — верни "not_defined" / "Данные не определены".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "result_transfer_procedure_defined": "<yes / no / not_defined>",
          "ownership_transfer_moment": "<acceptance / registration / completion / not_defined>",
          "ownership_retention_clause": "<yes / no / not_defined>",
          "docs_and_equipment_transfer_defined": "<yes / no / not_defined>",
          "result_transfer_summary": "<краткая сводка>",
          "result_transfer_details": "<подробный текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 950

    retrieval:
      retrieval_profile: "ip_ownership_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "передача результата переход права собственности право собственности на объект передача объекта заказчику акт передачи сохранение права собственности до полной оплаты передача исполнительной документации"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
      negative_keywords:
        - "КС-2"
        - "КС-3"
        - "гарантийный срок"
        - "НДС"
        - "аванс"
        - "страхование"
      position_bias:
        preferred_range: [0.40, 0.95]
        boost: 0.18
        scope: segment
      context_k: 5
      max_chunks: 6
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "price_list"
      preferred_clause_functions:
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.14

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"

      compact_output: false

      presence_signal:
        field: "result_transfer_and_ownership_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_max_tokens: 1100

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора строительного подряда
        условия о передаче результата работ Заказчику, моменте перехода права
        собственности на объект, оговорке о сохранении права за Подрядчиком
        до оплаты и передаче исполнительной документации (ст. 703, 720, 219 ГК РФ).
        Не анализируй смету, сроки, гарантию, страхование или экологию.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. result_transfer_and_ownership_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (result_transfer_procedure_defined, ownership_transfer_moment,
              ownership_retention_clause, docs_and_equipment_transfer_defined) ≠ "not_defined";
           - "missing" — если все содержательные поля = "not_defined" (или "no");
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - result_transfer_procedure_defined = "not_defined";
           - ownership_transfer_moment = "not_defined";
           - ownership_retention_clause = "not_defined";
           - docs_and_equipment_transfer_defined = "not_defined";
           - result_transfer_details = "Данные не определены";
           - result_transfer_summary = "Не установлено";
           - не выполняй остальные шаги.

        1. result_transfer_procedure_defined:
           "yes" / "no" / "not_defined".

        2. ownership_transfer_moment:
           "acceptance" / "registration" / "completion" / "not_defined".

        3. ownership_retention_clause:
           "yes" / "no" / "not_defined".

        4. docs_and_equipment_transfer_defined:
           "yes" / "no" / "not_defined".

        5. result_transfer_summary:
           Краткая user-facing сводка.
           Примеры: "Передача по акту; право собственности — с момента госрегистрации; оговорка о сохранении права за Подрядчиком до оплаты." / "Не установлено".

        6. result_transfer_details:
           Подробная формулировка, или "Данные не определены".
        </task>

        <context_rules>
        - Перед остальными полями заполни result_transfer_and_ownership_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все содержательные сигнальные поля = "not_defined", result_transfer_details = "Данные не определены", result_transfer_summary = "Не установлено".
        - Используй только текст договора из <context>.
        - Не подставляй данные из нормативных актов или общих знаний.
        - result_transfer_procedure_defined:
          - "yes" — если порядок передачи результата работ Заказчику прямо определён (акт, сроки, условия).
          - "no" — если передача прямо исключена.
          - "not_defined" — вопрос не урегулирован.
        - ownership_transfer_moment:
          - "acceptance" — право собственности переходит в момент подписания акта приёмки.
          - "registration" — право собственности переходит с момента государственной регистрации.
          - "completion" — право собственности переходит по завершении строительства (факт создания).
          - "not_defined" — момент не определён.
        - ownership_retention_clause:
          - "yes" — если прямо предусмотрена оговорка о сохранении права собственности за Подрядчиком до полной оплаты.
          - "no" — если такая оговорка прямо исключена или право переходит без условий.
          - "not_defined" — вопрос не урегулирован.
        - docs_and_equipment_transfer_defined:
          - "yes" — если прямо определён порядок передачи исполнительной документации и/или оборудования.
          - "no" — если передача прямо исключена.
          - "not_defined" — вопрос не урегулирован.
        - Запрещено использовать null, None, "N/A" или пустые строки.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В договоре нет условий о переходе права собственности, порядке передачи результата или оговорке о сохранении права.
           → presence = "missing"; все содержательные статусы = "not_defined"; все текстовые поля = "Данные не определены".

        2. Только передача по акту без перехода права.
           Договор определяет порядок передачи объекта по акту сдачи-приёмки, но момент перехода права собственности не раскрыт.
           → presence = "present"; result_transfer_procedure_defined = "yes"; ownership_transfer_moment = "not_defined"; result_transfer_summary = "Передача объекта по акту; момент перехода права собственности не определён".

        3. Противоречие между фрагментами.
           В разделе 9: "Право собственности переходит с момента подписания акта", а в разделе 12: "Право собственности возникает у Заказчика после государственной регистрации".
           → presence = "unclear"; ownership_transfer_moment = "not_defined"; result_transfer_details = "Не удалось определить".

        4. Строительство на земле Подрядчика с последующей продажей.
           Подрядчик строит на своём участке и передаёт объект Заказчику после полной оплаты с регистрацией перехода права.
           → presence = "present"; ownership_transfer_moment = "registration"; ownership_retention_clause = "yes"; result_transfer_summary = "Объект строится на земле Подрядчика; право переходит после оплаты и госрегистрации".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для result_transfer_and_ownership_presence используй только: "present", "missing", "unclear".
        - Для статусных полей используй только значения из allowed_values.
        - Fallback при отсутствии данных: все текстовые значения → "Данные не определены".
        - Fallback при противоречии или неоднозначности: все текстовые значения → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "result_transfer_and_ownership_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования передачи результата и перехода права собственности в договоре. Внутреннее агрегатное signal-поле."
          required: true

        - name: "result_transfer_procedure_defined"
          type: "string"
