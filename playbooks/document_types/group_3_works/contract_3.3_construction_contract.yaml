        - "демонтаж временных сооружений"
        - "ограждение площадки"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)временн.*здани|сооружени"
        - "(?i)подготовк.*площад"
        - "(?i)демонтаж.*временн"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист. Анализируется договор строительного подряда.
