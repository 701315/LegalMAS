           Примеры: "Получение ЗОС и разрешения на ввод организует Заказчик; Подрядчик передает исполнительную документацию." / "Не установлено".

        6. commissioning_details:
           Формулировка о вводе объекта в эксплуатацию и обязанностях сторон, или "Данные не определены".
        </task>

        <context_rules>
        - Перед остальными полями заполни commissioning_and_operating_permit_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все содержательные сигнальные поля = "not_defined", commissioning_details = "Данные не определены", commissioning_summary = "Не установлено".
        - Используй только текст договора из <context>.
        - Не подставляй данные из нормативных актов или общих знаний.
        - commissioning_permit_mentioned:
          - "yes" — если разрешение на ввод прямо упомянуто.
          - "no" — если в тексте прямо исключена необходимость получения разрешения.
          - "not_defined" — условие отсутствует в тексте.
        - responsible_party_for_commissioning:
          - "contractor" — если получение разрешения на ввод или ЗОС возложено на Подрядчика/Генподрядчика.
          - "customer" — если получение ЗОС и разрешения организует Заказчик (Застройщик).
          - "joint" — обязанности распределены между сторонами.
          - "not_defined" — сторона прямо не определена.
        - commissioning_docs_transfer_defined:
          - "yes" — если прямо предусмотрена обязанность Подрядчика передать исполнительную, техническую документацию или сертификаты для ввода.
          - "no" — если обязанность прямо исключена.
          - "not_defined" — обязанность не упомянута.
        - commissioning_costs_allocated:
          - "yes" — если договор прямо распределяет расходы по вводу (испытания, пошлины).
          - "no" — если распределение расходов отсутствует.
          - "not_defined" — вопрос не урегулирован.
        - Запрещено использовать null, None, "N/A" или пустые строки.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В договоре нет положений о вводе в эксплуатацию, ЗОС или исполнительной документации для ввода.
           → presence = "missing"; все содержательные статусы = "not_defined"; все текстовые поля = "Данные не определены".

        2. Строительство «под ключ».
           "Генподрядчик обязуется сдать готовый к эксплуатации объект, включая получение ЗОС и разрешения на ввод в эксплуатацию".
           → presence = "present"; commissioning_permit_mentioned = "yes"; responsible_party_for_commissioning = "contractor"; commissioning_summary = "Ввод в эксплуатацию 'под ключ' обеспечивает Генподрядчик".

        3. Противоречие между фрагментами.
           В п. 7 сказано: "ЗОС получает Заказчик", а в п. 12: "Обязанность получения ЗОС возложена на Подрядчика".
           → presence = "unclear"; responsible_party_for_commissioning = "not_defined"; commissioning_details = "Не удалось определить".

        4. Ограничение только передачей исполнительной документации.
           Подрядчик передает исполнительную документацию, но само оформление разрешения на ввод текстом договора не затрагивается.
           → presence = "present"; commissioning_docs_transfer_defined = "yes"; commissioning_permit_mentioned = "not_defined".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для commissioning_and_operating_permit_presence используй только: "present", "missing", "unclear".
        - Для статусных полей используй только значения из allowed_values.
        - Fallback при отсутствии данных: все текстовые значения → "Данные не определены".
        - Fallback при противоречии или неоднозначности: все текстовые значения → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "commissioning_and_operating_permit_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования ввода в эксплуатацию в договоре. Внутреннее агрегатное signal-поле."
          required: true

        - name: "commissioning_permit_mentioned"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Есть ли прямое упоминание разрешения на ввод в эксплуатацию. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "responsible_party_for_commissioning"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["contractor", "customer", "joint", "not_defined"]
          description: "Какая сторона отвечает за получение разрешения или организацию ввода. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "commissioning_docs_transfer_defined"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Определена ли передача Подрядчиком документов для ввода объекта. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "commissioning_costs_allocated"
          type: "string"
          presentation: "signal"
          risk_weight: "low"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Распределены ли расходы / обязанности по вводу объекта. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "commissioning_summary"
          type: "string"
          presentation: "fact"
          label: "Ввод в эксплуатацию"
          description: >
            Сводка: кто отвечает за ввод, предоставление исполнительной документации и сопутствующие расходы (ст. 55 ГрК РФ). Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "commissioning_details"
          label: "Сведения о вводе объекта в эксплуатацию"
          type: "string"
