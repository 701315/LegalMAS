  - id: construction_site_safety
    name: "Охрана труда и безопасность на строительной площадке (ТК РФ, СП 12-136-2002)"
    description: >
      Фактографическая проверка распределения обязанностей по охране труда 
      и безопасности работ на строительной площадке, ответственной стороны, 
      уведомления о несчастных случаях, требований к СИЗ (средствам 
      индивидуальной защиты), инструктажу, акту-допуску и пропускному режиму 
      (ТК РФ, СП 12-136-2002, Приказ Минтруда № 772н).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "охрана труда"
        - "безопасность на строительной площадке"
        - "несчастный случай"
        - "ответственность за безопасность"
        - "инструктаж"
        - "средства защиты"
        - "СИЗ"
        - "акт-допуск"
        - "пропускной режим"
        - "ответственный производитель работ"
        - "допуск на площадку"
        - "техника безопасности"
        - "пожарная безопасность"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)подрядчик.*обеспечивает.*безопасность.*работ"
        - "(?i)охрана.*труда.*на\\s+объекте"
        - "(?i)несчастн.*случа"
        - "(?i)акт.*допуск.*на.*производств"
        - "(?i)пропускн.*режим"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор строительного подряда в части охраны труда и безопасности на площадке.
        Проверяется только один вопрос: как распределены обязанности по безопасности работ, 
        уведомлению о происшествиях, обеспечению СИЗ, инструктажу, акту-допуску и пропускному режиму.

        Нормативный ориентир:
        - ст. 212–214 Трудового кодекса РФ (обязанности работодателя по охране труда)
        - СП 12-136-2002 (организация производства и контроль при строительстве)
        - Приказ Минтруда РФ № 772н (требования к средствам индивидуальной защиты)
        - Приказ Ростехнадзора (акт-допуск на производство работ)

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не оценивай риск, фиксируй условия буквально.
        - Ключевые маркеры для РФ-практики: (1) ответственная сторона за безопасность на площадке 
          (обычно Подрядчик), (2) обязанность обеспечивать работников СИЗ за свой счет (ст. 212 ТК РФ), 
          (3) инструктаж по охране труда (вводный, первичный, повторный), (4) акт-допуск на производство работ 
          (особенно при работе на действующем предприятии), (5) пропускной режим на площадку, 
          (6) уведомление о несчастных случаях и инцидентах.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Закреплены ли обязанности по охране труда и безопасности работ.
        2. Какая сторона отвечает за безопасность на площадке.
        3. Есть ли обязанность уведомлять о несчастных случаях, инцидентах или нарушениях безопасности.
        4. Есть ли требования о средствах защиты (СИЗ), инструктаже или аналогичных мерах безопасности.
        5. Есть ли упоминание акта-допуска, пропускного режима или допуска на площадку.
        6. Сформируй краткую сводку по режиму безопасности на площадке.
        7. Извлеки подробную формулировку условий.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона вместо текста договора.
        2. Если условие не указано прямо — возвращай "not_defined" для статусов и "Данные не определены" для текста.
        3. Не используй "None", "null", "not_defined" или пустые строки в JSON.
        4. safety_obligations_defined = "yes" только если договор прямо закрепляет обязанности по охране труда или безопасности.
        5. responsible_party_for_safety: "contractor" (Подрядчик), "customer" (Заказчик), "both" (распределены), "not_defined" (не указано).
        6. В сводке (summary) пиши кратко, на русском языке, фиксируя ключевые procedural mechanics (СИЗ, инструктаж, акт-допуск, пропускной режим).
        7. В evidence включай только точные цитаты из текста договора.
        8. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        со всеми 8 ключами.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — данные определены:
        Фрагмент:
        "Подрядчик обеспечивает охрану труда и безопасность работ на строительной площадке, 
        проводит инструктаж персонала и обеспечивает работников средствами индивидуальной защиты 
        (каска, жилет, спецобувь) за свой счет. О каждом несчастном случае Подрядчик обязан 
        незамедлительно уведомить Заказчика. Допуск на площадку осуществляется по пропускам, 
        оформленным Заказчиком."

        Ответ:
        {
          "safety_obligations_defined": "yes",
          "responsible_party_for_safety": "contractor",
          "incident_notification_duty": "yes",
          "ppe_and_instruction_requirements": "yes",
          "access_control_defined": "yes",
          "site_safety_summary": "Подрядчик отвечает за охрану труда и безопасность; обеспечивает СИЗ и инструктаж; уведомляет о несчастных случаях; допуск на площадку по пропускам Заказчика.",
          "site_safety_details": "Подрядчик обеспечивает охрану труда и безопасность работ, проводит инструктаж и обеспечивает работников СИЗ за свой счет; уведомляет о несчастных случаях; допуск на площадку осуществляется по пропускам, оформленным Заказчиком.",
          "evidence": [
            {
              "clause_ref": "п. 8.1",
              "quote": "Подрядчик обеспечивает охрану труда и безопасность работ на строительной площадке, проводит инструктаж персонала и обеспечивает работников средствами индивидуальной защиты (каска, жилет, спецобувь) за свой счет. О каждом несчастном случае Подрядчик обязан незамедлительно уведомить Заказчика..."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Подрядчик выполняет работы в соответствии с графиком."

        Ответ:
        {
          "safety_obligations_defined": "not_defined",
          "responsible_party_for_safety": "not_defined",
          "incident_notification_duty": "not_defined",
          "ppe_and_instruction_requirements": "not_defined",
          "access_control_defined": "not_defined",
          "site_safety_summary": "Не установлено",
          "site_safety_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату об охране труда или безопасности.
        2. Найди прямую цитату об ответственной стороне.
        3. Найди прямую цитату об уведомлении об инцидентах.
        4. Найди прямую цитату о средствах защиты (СИЗ) или инструктаже.
        5. Найди прямую цитату об акте-допуске или пропускном режиме.
        6. Если прямой цитаты нет — верни "not_defined" / "Данные не определены".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "safety_obligations_defined": "<yes / no / not_defined>",
          "responsible_party_for_safety": "<contractor / customer / both / not_defined>",
          "incident_notification_duty": "<yes / no / not_defined>",
          "ppe_and_instruction_requirements": "<yes / no / not_defined>",
          "access_control_defined": "<yes / no / not_defined>",
          "site_safety_summary": "<краткая сводка>",
          "site_safety_details": "<подробный текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 950

    retrieval:
      corpus_scope: "primary_segment"
      levels:
