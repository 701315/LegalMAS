          required: true
          display_in_grid: false
        - name: "contractor_signatory_basis"
          type: "string"
          presentation: "signal"
          allowed_values: ["charter", "poa", "order", "personal", "other", "not_defined"]
          description: "Основание полномочий подписанта Подрядчика."
          required: true
          display_in_grid: false
        - name: "customer_details_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения реквизитов Заказчика."
          required: true
          display_in_grid: false
        - name: "customer_details_value"
          type: "string"
          presentation: "fact"
          label: "Заказчик"
          description: "Наименование / ФИО и реквизиты Заказчика."
          required: true
          display_in_grid: true
          display_priority: 2
        - name: "customer_type"
          type: "string"
          presentation: "signal"
          allowed_values: ["legal_entity", "state_entity", "individual", "ip", "self_employed", "not_defined"]
          description: "Тип Заказчика."
          required: true
          display_in_grid: false
        - name: "customer_signatory"
          type: "string"
          presentation: "fact"
          label: "Подписант Заказчика"
          description: "Лицо, подписывающее договор от имени Заказчика."
          required: true
          display_in_grid: false
        - name: "customer_signatory_basis"
          type: "string"
          presentation: "signal"
          allowed_values: ["charter", "poa", "order", "personal", "other", "not_defined"]
          description: "Основание полномочий подписанта Заказчика."
          required: true
          display_in_grid: false
      store_payload: true

  - id: construction_object_and_design_docs_extraction
    name: "Объект строительства, проектная документация, экспертиза и разрешение на строительство"
    description: >
      Фактографическая проверка описания объекта строительства (наименование,
      адрес, кадастровый номер), ссылок на проектную / рабочую документацию,
      её утверждения, прохождения экспертизы проектной документации,
      наличия разрешения на строительство или уведомления о начале
      строительства (ФЗ-340).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "объект капитального строительства"
        - "проектная документация"
        - "рабочая документация"
        - "наименование объекта"
        - "адрес объекта"
        - "техническое задание"
        - "кадастровый номер"
        - "разрешение на строительство"
        - "уведомление о начале строительства"
        - "уведомление о планируемом строительстве"
        - "положительное заключение экспертизы"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)объект.*капитального.*строительства"
        - "(?i)(проектн|рабоч).*документаци"
        - "(?i)\\d{2}:\\d{2}:\\d{6,7}:\\d+"
        - "(?i)разрешени.*на.*строительств"
        - "(?i)уведомлени.*о.*начал.*строительств"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор строительного подряда по ст. 740, 743, 748 ГК РФ
        и положениям Градостроительного кодекса РФ.
        Проверяется только один вопрос: как в договоре идентифицирован объект
        строительства и как урегулированы проектная документация, экспертиза
        и разрешительная документация.

        Нормативный ориентир:
        - ст. 740 ГК РФ (договор строительного подряда)
        - ст. 743 ГК РФ (техническая документация)
        - ст. 748 ГК РФ (участие Заказчика)
        - ст. 48, 49, 51 Градостроительного кодекса РФ
        - ФЗ-340 от 03.08.2018 (уведомительный порядок для отдельных объектов)

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Наименование объекта строительства.
        2. Адрес или местоположение объекта.
        3. Кадастровый номер (земельного участка или объекта капитального
           строительства).
        4. Есть ли ссылка на проектную или рабочую документацию.
        5. Есть ли указание на утверждение проектной документации.
        6. Есть ли указание на прохождение экспертизы проектной документации.
        7. Есть ли упоминание разрешения на строительство или уведомления
           о начале / о планируемом строительстве.
        8. Сформируй краткую сводку по статусу ПД, экспертизы и разрешения.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined" для статусов
           и "Данные не определены" для текстовых полей.
        4. Не используй "None", "null", "N/A" или пустые строки.
        5. design_docs_referenced = "yes" только если проектная / рабочая
           документация прямо указана как приложение, часть договора
           или отдельный комплект документов.
        6. design_docs_referenced = "partial" только если есть общая ссылка
           на документацию без достаточной определённости её состава / статуса.
        7. design_docs_approval = "approved" только если в договоре прямо
           указано, что документация утверждена.
        8. design_docs_approval = "not_specified" если документация упомянута,
           но факт её утверждения прямо не раскрыт.
        9. expertise_passed = "yes" только если в договоре прямо указано
           прохождение экспертизы или положительное заключение экспертизы.
        10. construction_permit_mentioned = "yes" если разрешение на
            строительство прямо упомянуто ИЛИ если упомянуто уведомление
            о начале строительства / уведомление о планируемом строительстве
            (уведомительный порядок по ФЗ-340).
        11. Кадастровый номер может относиться к земельному участку или
            к объекту капитального строительства — принимай любой вариант.
        12. В evidence включай только точные цитаты из текста договора.
        13. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        со всеми 11 ключами.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — данные определены:
        Фрагмент:
        "Подрядчик обязуется выполнить работы по строительству объекта
        капитального строительства «Многофункциональный жилой комплекс».
        Объект расположен по адресу: г. Москва, ул. Строителей, д. 10.
        Кадастровый номер земельного участка 77:01:0001234:567.
        Проектная и рабочая документация передаются Подрядчику по Приложению № 2.
        Проектная документация утверждена Заказчиком и имеет положительное
        заключение государственной экспертизы. Разрешение на строительство
        выдано уполномоченным органом."

        Ответ:
        {
          "object_name_status": "defined",
          "object_name_value": "Многофункциональный жилой комплекс",
          "object_address_status": "defined",
          "object_address_value": "г. Москва, ул. Строителей, д. 10",
          "cadastral_number_status": "defined",
          "cadastral_number_value": "77:01:0001234:567",
          "design_docs_referenced": "yes",
          "design_docs_approval": "approved",
          "expertise_passed": "yes",
          "construction_permit_mentioned": "yes",
          "permit_and_docs_summary": "ПД в Приложении №2, утверждена Заказчиком; экспертиза пройдена (положительное заключение); разрешение на строительство получено.",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "Подрядчик обязуется выполнить работы по строительству объекта капитального строительства «Многофункциональный жилой комплекс». Объект расположен по адресу: г. Москва, ул. Строителей, д. 10. Кадастровый номер земельного участка 77:01:0001234:567."
            },
            {
              "clause_ref": "п. 1.3",
              "quote": "Проектная и рабочая документация передаются Подрядчику по Приложению № 2. Проектная документация утверждена Заказчиком и имеет положительное заключение государственной экспертизы. Разрешение на строительство выдано уполномоченным органом."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Подрядчик выполняет строительные работы на объекте Заказчика."

        Ответ:
        {
          "object_name_status": "not_defined",
          "object_name_value": "Данные не определены",
          "object_address_status": "not_defined",
          "object_address_value": "Данные не определены",
          "cadastral_number_status": "not_defined",
          "cadastral_number_value": "Данные не определены",
          "design_docs_referenced": "not_defined",
          "design_docs_approval": "not_defined",
          "expertise_passed": "not_defined",
          "construction_permit_mentioned": "not_defined",
          "permit_and_docs_summary": "Не установлено",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о наименовании объекта.
        2. Найди прямую цитату об адресе или местоположении объекта.
        3. Найди прямую цитату о кадастровом номере.
        4. Найди прямую цитату о проектной / рабочей документации.
        5. Найди прямую цитату об экспертизе и разрешении на строительство
           или уведомлении о начале строительства.
        6. Если прямой цитаты нет — верни "not_defined" / "Данные не определены".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "object_name_status": "<defined / not_defined>",
          "object_name_value": "<текст или 'Данные не определены'>",
          "object_address_status": "<defined / not_defined>",
          "object_address_value": "<текст или 'Данные не определены'>",
          "cadastral_number_status": "<defined / not_defined>",
          "cadastral_number_value": "<текст или 'Данные не определены'>",
          "design_docs_referenced": "<yes / partial / no / not_defined>",
          "design_docs_approval": "<approved / not_specified / not_defined>",
          "expertise_passed": "<yes / no / not_mentioned / not_defined>",
          "construction_permit_mentioned": "<yes / no / not_defined>",
          "permit_and_docs_summary": "<краткая сводка или 'Не установлено'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 7
      temperature: 0.0
      max_tokens: 900

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "объект капитального строительства проектная документация рабочая документация наименование объекта адрес объекта кадастровый номер техническое задание разрешение на строительство уведомление о начале строительства экспертиза"
      retrieval_profile: "technical_documentation_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - definitions
        - obligations
      negative_keywords:
        - "неустойка"
        - "пеня"
        - "аванс"
        - "КС-2"
        - "КС-3"
        - "гарантийный срок"
        - "скрытые недостатки"
      position_bias:
        preferred_range: [0.0, 0.35]
        boost: 0.24
        scope: segment
      context_k: 7
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
        - "technical_specification"
      excluded_segment_types:
        - "price_list"
      preferred_clause_functions:
        - "definitions"
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.14

    evidence:
      required: true
      min_snippet_length: 50
      max_snippet_length: 700

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 1200

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора строительного подряда
        сведения об объекте строительства (наименование, адрес, кадастровый
        номер), о проектной / рабочей документации, её утверждении,
        прохождении экспертизы и наличии разрешения на строительство
        или уведомления о начале строительства.
        Не анализируй цену, сроки, приёмку, гарантию или ответственность.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 11 полей:

        1. object_name_status — "defined" если наименование объекта прямо
           указано, иначе "not_defined".
        2. object_name_value — наименование объекта строительства,
           или "Данные не определены".
        3. object_address_status — "defined" если адрес / местоположение
           объекта прямо указаны, иначе "not_defined".
        4. object_address_value — адрес или местоположение объекта,
           или "Данные не определены".
        5. cadastral_number_status — "defined" если кадастровый номер прямо
           указан, иначе "not_defined".
        6. cadastral_number_value — кадастровый номер земельного участка
           или объекта капитального строительства, или "Данные не определены".
        7. design_docs_referenced — "yes" / "partial" / "no" / "not_defined".
        8. design_docs_approval — "approved" / "not_specified" / "not_defined".
        9. expertise_passed — "yes" / "no" / "not_mentioned" / "not_defined".
        10. construction_permit_mentioned — "yes" / "no" / "not_defined".
        11. permit_and_docs_summary — краткая user-facing сводка одним
            предложением по статусу ПД, экспертизы и разрешения.
            Примеры: "ПД в Приложении №2, утверждена; экспертиза пройдена;
            разрешение получено." / "ПД не упомянута, разрешение не указано." /
            "Уведомление о начале строительства подано." /
            "Не установлено".
        </task>

        <context_rules>
        - Используй только текст договора из <context>.
        - Не подставляй данные из нормативных актов, ЕГРН или общих знаний.
        - Если в переданном контексте нет разделов об объекте строительства
        или разрешительной документации — верни все статусы как "not_defined",
        все текстовые поля как "Данные не определены",
        permit_and_docs_summary как "Не установлено".
        - design_docs_referenced:
        - "yes" — проектная или рабочая документация прямо указана
        как приложение, часть договора или отдельный комплект документов.
        - "partial" — есть общая ссылка на документацию без достаточной
        определённости её состава или статуса.
        - "no" — договор прямо указывает на отсутствие такой документации.
        - "not_defined" — вопрос прямо не урегулирован.
        - design_docs_approval:
        - "approved" — прямо указано, что документация утверждена
        (Заказчиком, уполномоченным органом и т.д.).
        - "not_specified" — документация упомянута, но факт её утверждения
        прямо не раскрыт в тексте.
        - "not_defined" — документация не упомянута или вопрос
        не урегулирован.
        - expertise_passed:
        - "yes" — прямо указано прохождение экспертизы или наличие
        положительного заключения экспертизы (государственной
        или негосударственной).
        - "no" — прямо указано отсутствие экспертизы или отрицательное
        заключение.
        - "not_mentioned" — проектная документация упомянута, но вопрос
        экспертизы прямо не раскрыт.
        - "not_defined" — по тексту нельзя установить.
        - construction_permit_mentioned:
        - "yes" — разрешение на строительство прямо упомянуто,
        ИЛИ упомянуто уведомление о начале строительства /
        уведомление о планируемом строительстве
        (уведомительный порядок по ФЗ-340).
        - "no" — прямо указано отсутствие разрешения / уведомления.
        - "not_defined" — по тексту нельзя установить.
        - permit_and_docs_summary:
        - Формируй одним предложением на русском языке.
        - Включи только факты, прямо подтверждённые текстом договора.
        - Если ни один из параметров (ПД, экспертиза, разрешение)
        не установлен — верни "Не установлено".
        - Не используй аббревиатуры, кроме общепринятых (ПД, ФЗ).
        Формат и полнота ответа:
        - Верни строго один JSON-объект с ровно 11 ключами, перечисленными
        в <task>. Не добавляй и не пропускай ключи.
        - Запрещено использовать null, None, "N/A", "—" или пустые строки ""
        в качестве значений.
        - Для статусов используй только "defined" или "not_defined".
        - Для текстовых полей при отсутствии данных используй
        "Данные не определены".
        - В evidence включай только точные цитаты из текста договора
        с указанием пункта.
        </context_rules>

        <output_expectations>
        - Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        - Не используй markdown fences.
        - Не добавляй пояснения до или после JSON.
        - Верни все ключи, перечисленные в task, без пропусков.
        - Не используй null, None или пустые строки.
        - Для статусных полей используй только значения из allowed_values или "not_defined".
        - Для текстовых полей при отсутствии данных используй "Данные не определены" / "Не удалось определить" / "Не применимо" — согласно правилам выше.
        </output_expectations>

        <output_expectations>
        {
          "object_name_status": "defined | not_defined",
          "object_name_value": "string",
          "object_address_status": "defined | not_defined",
          "object_address_value": "string",
          "cadastral_number_status": "defined | not_defined",
          "cadastral_number_value": "string",
          "design_docs_referenced": "yes | partial | no | not_defined",
          "design_docs_approval": "approved | not_specified | not_defined",
          "expertise_passed": "yes | no | not_mentioned | not_defined",
          "construction_permit_mentioned": "yes | no | not_defined",
          "permit_and_docs_summary": "string",
          "evidence": [{"clause_ref": "string", "quote": "string"}]
        }
        </output_expectations>

      fields:
        - name: "object_name_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания наименования объекта."
          required: true
          display_in_grid: false
        - name: "object_name_value"
          type: "string"
          presentation: "fact"
          label: "Объект"
          description: "Наименование объекта строительства."
          required: true
          display_in_grid: true
          display_priority: 1
        - name: "object_address_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания адреса объекта."
          required: true
          display_in_grid: false
        - name: "object_address_value"
          type: "string"
          presentation: "fact"
          label: "Адрес объекта"
          description: "Адрес или местоположение объекта строительства."
          required: true
          display_in_grid: true
          display_priority: 2
        - name: "cadastral_number_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания кадастрового номера."
          required: true
          display_in_grid: false
        - name: "cadastral_number_value"
          type: "string"
          presentation: "fact"
          label: "Кадастровый номер"
          description: "Кадастровый номер земельного участка или объекта капитального строительства."
          required: true
          display_in_grid: true
          display_priority: 3
        - name: "design_docs_referenced"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "partial", "no", "not_defined"]
          description: "Есть ли прямая ссылка на проектную / рабочую документацию."
          required: true
          display_in_grid: false
        - name: "design_docs_approval"
          type: "string"
          presentation: "signal"
          allowed_values: ["approved", "not_specified", "not_defined"]
          description: "Статус утверждения проектной документации."
          required: true
          display_in_grid: false
        - name: "expertise_passed"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no", "not_mentioned", "not_defined"]
          description: "Статус прохождения экспертизы проектной документации."
          required: true
          display_in_grid: false
        - name: "construction_permit_mentioned"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Наличие разрешения на строительство или уведомления о начале строительства."
          required: true
          display_in_grid: false
        - name: "permit_and_docs_summary"
          type: "string"
          presentation: "fact"
          label: "ПД, экспертиза, разрешение"
          description: "Краткая сводка по статусу проектной документации, экспертизы и разрешения на строительство."
          required: true
          display_in_grid: true
          display_priority: 4
      store_payload: true

  - id: construction_timeline_and_penalty_risk
    name: "Сроки строительства, календарный план и санкции за просрочку"
    description: >
      Фактографическая проверка начального и конечного сроков строительства
      (включая событийные сроки), календарного плана / графика производства
      работ, промежуточных вех (ст. 708 ГК РФ) и договорной санкции за
      просрочку выполнения работ.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "срок начала работ"
        - "срок окончания работ"
        - "календарный план"
        - "график производства работ"
        - "не позднее"
        - "в течение"
        - "этапы строительства"
        - "промежуточный срок"
        - "неустойка за просрочку"
        - "пеня за каждый день задержки"
        - "рабочие дни"
        - "календарные дни"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"
        - "(?i)(не\\s+позднее|в\\s+течение)\\s+\\d+\\s*(календарн|рабоч|дн)"
        - "(?i)календарн.*план|график.*работ"
        - "(?i)пеня.*за.*каждый.*день.*просрочки"
        - "(?i)с\\s+даты\\s+(передачи|получения|подписания)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор строительного подряда по ст. 708, 740 ГК РФ.
        Проверяется только один вопрос: как в договоре определены сроки
        строительства, календарный план, промежуточные вехи и санкции
        за просрочку.

        Нормативный ориентир:
        - ст. 708 ГК РФ (сроки выполнения работ, промежуточные сроки)
        - ст. 740 ГК РФ (договор строительного подряда)
        - ст. 330 ГК РФ (неустойка)

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Начальный срок строительства (дата или событийная формулировка).
        2. Конечный срок строительства (дата или событийная формулировка).
        3. Есть ли календарный план / график производства работ.
        4. Есть ли промежуточные вехи или этапы (ст. 708 ГК РФ).
        5. Являются ли сроки конкретными или размытыми.
        6. Есть ли санкция за просрочку выполнения работ.
        7. Как сформулирован размер санкции за просрочку.
        8. Сформируй краткую сводку по календарному плану и вехам.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined" для статусов
           и "Данные не определены" для текстовых полей.
        4. Не используй "None", "null", "N/A" или пустые строки.
        5. Событийные сроки (например, "в течение 30 рабочих дней с даты
           передачи площадки", "с даты получения разрешения на строительство")
           считаются конкретными (deadlines_specific = "yes"), если событие
           и период определены однозначно.
        6. Фиксируй, указаны ли сроки в рабочих или календарных днях.
        7. deadlines_specific = "vague" только если сроки описаны общо,
           без достаточной определённости (например, "в разумный срок",
           "по согласованию сторон").
        8. calendar_plan_attached = "yes" только если календарный план
           прямо приложен к договору как приложение.
        9. calendar_plan_attached = "referenced" только если на него есть
           ссылка, но он не описан как приложенный.
        10. penalty_for_delay_present = "yes" только если санкция за просрочку
            подрядчика прямо установлена.
        11. penalty_rate заполняй только по прямому тексту о размере
            или формуле санкции.
        12. Если установлены промежуточные сроки (ст. 708 п. 2 ГК РФ) с
            привязкой к неустойке — отрази это в evidence.
        13. В evidence включай только точные цитаты из текста договора.
        14. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        со всеми 10 ключами.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — данные определены:
        Фрагмент:
        "Подрядчик приступает к работам 01.07.2026. Работы должны быть
        завершены не позднее 31.12.2026. Календарный план является
        Приложением № 3 к договору. Этап 1 выполняется до 01.09.2026.
        За нарушение срока сдачи объекта Подрядчик уплачивает пеню
        в размере 0,1% от цены договора за каждый день просрочки."

        Ответ:
        {
          "start_date_status": "defined",
          "start_date_value": "01.07.2026",
          "end_date_status": "defined",
          "end_date_value": "31.12.2026",
          "calendar_plan_attached": "yes",
          "intermediate_milestones": "yes",
          "deadlines_specific": "yes",
          "penalty_for_delay_present": "yes",
          "penalty_rate": "0,1% от цены договора за каждый день просрочки",
          "timeline_summary": "Календарный план в Приложении №3; есть промежуточные этапы (Этап 1 до 01.09.2026).",
          "evidence": [
            {
              "clause_ref": "п. 3.1",
              "quote": "Подрядчик приступает к работам 01.07.2026. Работы должны быть завершены не позднее 31.12.2026. Календарный план является Приложением № 3 к договору. Этап 1 выполняется до 01.09.2026."
            },
            {
              "clause_ref": "п. 7.2",
              "quote": "За нарушение срока сдачи объекта Подрядчик уплачивает пеню в размере 0,1% от цены договора за каждый день просрочки."
            }
          ]
        }

        Пример 2 — событийные сроки:
        Фрагмент:
        "Работы начинаются в течение 10 рабочих дней с даты передачи
        строительной площадки по акту. Срок завершения работ — 180
        календарных дней с даты начала работ. Промежуточные сроки
        не установлены."

        Ответ:
        {
          "start_date_status": "defined",
          "start_date_value": "в течение 10 рабочих дней с даты передачи строительной площадки по акту",
          "end_date_status": "defined",
          "end_date_value": "180 календарных дней с даты начала работ",
          "calendar_plan_attached": "no",
          "intermediate_milestones": "no",
          "deadlines_specific": "yes",
          "penalty_for_delay_present": "not_defined",
          "penalty_rate": "Данные не определены",
          "timeline_summary": "Событийные сроки: начало в течение 10 раб. дней с передачи площадки, завершение — 180 кал. дней. Промежуточные вехи не установлены.",
          "evidence": [
            {
              "clause_ref": "п. 3.1",
              "quote": "Работы начинаются в течение 10 рабочих дней с даты передачи строительной площадки по акту. Срок завершения работ — 180 календарных дней с даты начала работ."
            }
          ]
        }

        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Работы выполняются в сроки, согласованные сторонами дополнительно."

        Ответ:
        {
          "start_date_status": "not_defined",
          "start_date_value": "Данные не определены",
          "end_date_status": "not_defined",
          "end_date_value": "Данные не определены",
          "calendar_plan_attached": "not_defined",
          "intermediate_milestones": "not_defined",
          "deadlines_specific": "vague",
          "penalty_for_delay_present": "not_defined",
          "penalty_rate": "Данные не определены",
          "timeline_summary": "Не установлено",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о начале работ (дата или событие).
        2. Найди прямую цитату об окончании работ (дата или событие).
        3. Найди прямую цитату о календарном плане и этапах.
        4. Найди прямую цитату о санкции за просрочку.
        5. Если прямой цитаты нет — верни "not_defined" / "Данные не определены".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "start_date_status": "<defined / not_defined>",
          "start_date_value": "<текст или 'Данные не определены'>",
          "end_date_status": "<defined / not_defined>",
          "end_date_value": "<текст или 'Данные не определены'>",
          "calendar_plan_attached": "<yes / referenced / no / not_defined>",
          "intermediate_milestones": "<yes / no / not_defined>",
          "deadlines_specific": "<yes / vague / not_defined>",
          "penalty_for_delay_present": "<yes / no / not_defined>",
          "penalty_rate": "<текст или 'Данные не определены'>",
          "timeline_summary": "<краткая сводка или 'Не установлено'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 900

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "срок начала работ срок окончания работ календарный план график производства работ не позднее этапы строительства промежуточный срок неустойка за просрочку пеня за каждый день задержки рабочие дни календарные дни"
      retrieval_profile: "completion_deadline_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
      negative_keywords:
        - "гарантийный срок"
        - "НДС"
        - "субподряд"
        - "экология"
        - "СРО"
        - "кадастровый номер"
      position_bias:
        preferred_range: [0.10, 0.60]
        boost: 0.22
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
        - "technical_specification"
      excluded_segment_types:
        - "price_list"
      preferred_clause_functions:
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.14

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 1200

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора строительного подряда
        сведения о сроках строительства (начало, окончание), календарном плане,
        промежуточных вехах (ст. 708 ГК РФ) и санкции за просрочку выполнения
        работ.
        Не анализируй предмет договора, смету, НДС, гарантию или страхование.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 10 полей:

        1. start_date_status — "defined" если начальный срок прямо указан
           (датой или событийной формулировкой), иначе "not_defined".
        2. start_date_value — дата или событийная формулировка начала работ,
           или "Данные не определены".
        3. end_date_status — "defined" если конечный срок прямо указан
           (датой или событийной формулировкой), иначе "not_defined".
        4. end_date_value — дата или событийная формулировка окончания работ,
           или "Данные не определены".
        5. calendar_plan_attached — "yes" / "referenced" / "no" / "not_defined".
        6. intermediate_milestones — "yes" / "no" / "not_defined".
        7. deadlines_specific — "yes" / "vague" / "not_defined".
        8. penalty_for_delay_present — "yes" / "no" / "not_defined".
        9. penalty_rate — формулировка ставки или формулы санкции за просрочку,
           или "Данные не определены".
        10. timeline_summary — краткая user-facing сводка одним предложением
            по календарному плану, вехам и промежуточным срокам.
            Примеры: "Календарный план в Приложении №3; есть промежуточные
            этапы." / "Событийные сроки: начало с передачи площадки,
            завершение — 180 кал. дней. Промежуточные вехи не установлены." /
            "Не установлено".
        </task>

        <context_rules>
        - Используй только текст договора из <context>.
        - Не подставляй данные из нормативных актов или общих знаний.
        - Если в переданном контексте нет разделов о сроках или ответственности —
        верни все статусы как "not_defined", все текстовые поля как
        "Данные не определены", timeline_summary как "Не установлено".
        - calendar_plan_attached:
        - "yes" — календарный план / график прямо указан как приложение.
        - "referenced" — есть ссылка на план / график без явного статуса
        приложения.
        - "no" — договор прямо указывает на отсутствие плана.
        - "not_defined" — вопрос прямо не урегулирован.
        - intermediate_milestones:
        - "yes" — промежуточные этапы или вехи прямо перечислены
        (с датами или событийными привязками).
        - "no" — сроки указаны, но этапы прямо не выделены.
        - "not_defined" — вопрос прямо не урегулирован.
        - deadlines_specific:
        - "yes" — сроки определены конкретными датами ИЛИ однозначными
        событийными формулировками (например, "в течение 30 рабочих дней
        с даты передачи площадки", "с даты получения разрешения").
        - "vague" — сроки сформулированы расплывчато ("в разумный срок",
        "по согласованию сторон", "в сроки, определяемые дополнительно").
        - "not_defined" — сроки отсутствуют.
        - penalty_for_delay_present:
        - "yes" — санкция за просрочку подрядчика прямо установлена.
        - "no" — договор прямо исключает такую санкцию.
        - "not_defined" — вопрос прямо не урегулирован.
        - penalty_rate:
        - Заполняй только по прямой формулировке о размере или формуле
        санкции (например, "0,1% от цены договора за каждый день просрочки").
        - Если санкция не установлена — верни "Данные не определены".
        - timeline_summary:
        - Формируй одним предложением на русском языке.
        - Включи только факты, прямо подтверждённые текстом договора.
        - Отрази наличие календарного плана, промежуточных вех и тип сроков
        (датный или событийный).
        - Если ни один из параметров не установлен — верни "Не установлено".
        - Не используй аббревиатуры, кроме общепринятых (ст., ГК РФ).
        Формат и полнота ответа:
        - Верни строго один JSON-объект с ровно 10 ключами, перечисленными
        в <task>. Не добавляй и не пропускай ключи.
        - Запрещено использовать null, None, "N/A", "—" или пустые строки ""
        в качестве значений.
        - Для статусов используй только "defined" или "not_defined".
        - Для текстовых полей при отсутствии данных используй
        "Данные не определены".
        - В evidence включай только точные цитаты из текста договора
        с указанием пункта.
        </context_rules>

        <output_expectations>
        - Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        - Не используй markdown fences.
        - Не добавляй пояснения до или после JSON.
        - Верни все ключи, перечисленные в task, без пропусков.
        - Не используй null, None или пустые строки.
        - Для статусных полей используй только значения из allowed_values или "not_defined".
        - Для текстовых полей при отсутствии данных используй "Данные не определены" / "Не удалось определить" / "Не применимо" — согласно правилам выше.
        </output_expectations>

        <output_expectations>
        {
          "start_date_status": "defined | not_defined",
          "start_date_value": "string",
          "end_date_status": "defined | not_defined",
          "end_date_value": "string",
          "calendar_plan_attached": "yes | referenced | no | not_defined",
          "intermediate_milestones": "yes | no | not_defined",
          "deadlines_specific": "yes | vague | not_defined",
          "penalty_for_delay_present": "yes | no | not_defined",
          "penalty_rate": "string",
          "timeline_summary": "string",
          "evidence": [{"clause_ref": "string", "quote": "string"}]
        }
        </output_expectations>

      fields:
        - name: "start_date_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания начального срока."
          required: true
          display_in_grid: false
        - name: "start_date_value"
          type: "string"
          presentation: "fact"
          label: "Начало работ"
          description: "Начальный срок выполнения строительных работ (дата или событийная формулировка)."
          required: true
          display_in_grid: true
          display_priority: 1
        - name: "end_date_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания конечного срока."
          required: true
          display_in_grid: false
        - name: "end_date_value"
          type: "string"
          presentation: "fact"
          label: "Окончание работ"
          description: "Конечный срок выполнения строительных работ (дата или событийная формулировка)."
          required: true
          display_in_grid: true
          display_priority: 2
        - name: "calendar_plan_attached"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "referenced", "no", "not_defined"]
          description: "Есть ли календарный план или график производства работ."
          required: true
          display_in_grid: false
        - name: "intermediate_milestones"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Есть ли промежуточные этапы или вехи (ст. 708 ГК РФ)."
          required: true
          display_in_grid: false
        - name: "deadlines_specific"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "vague", "not_defined"]
          description: "Являются ли сроки конкретными (включая событийные сроки)."
          required: true
          display_in_grid: false
        - name: "penalty_for_delay_present"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Есть ли договорная санкция за просрочку выполнения работ."
          required: true
          display_in_grid: false
        - name: "penalty_rate"
          type: "string"
          presentation: "fact"
          label: "Неустойка за просрочку"
          description: "Формулировка размера или формулы неустойки за просрочку выполнения работ."
          required: true
          display_in_grid: true
          display_priority: 3
        - name: "timeline_summary"
          type: "string"
          presentation: "fact"
          label: "План и вехи"
          description: "Краткая сводка по календарному плану, промежуточным вехам и типу сроков."
          required: true
          display_in_grid: true
          display_priority: 4
      store_payload: true

  - id: estimate_type_and_change_order_analysis
    name: "Смета, цена договора, дополнительные работы, порядок оплаты и индексация"
    description: >
      Фактографическая проверка типа сметы (твёрдая/приблизительная),
      общей цены договора, статуса НДС (включая УСН/НПД), порядка оформления
      дополнительных работ (ст. 743 ГК РФ), основания промежуточной оплаты
      (КС-2/КС-3), наличия аванса и механизма индексации цены.
    triggers:
      any: ["estimate_present"]
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "смета"
        - "твёрдая смета"
        - "приблизительная смета"
        - "твёрдая цена"
        - "сметная стоимость"
        - "дополнительные работы"
        - "изменение проектной документации"
        - "дополнительное соглашение"
        - "авансовый платёж"
        - "предоплата"
        - "КС-2"
        - "КС-3"
        - "индексация цены"
        - "корректировка стоимости"
        - "УСН"
        - "без НДС"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(твёрд(ая|ой)|приблизительн(ая|ой))\\s+(смет|цен)"
        - "(?i)смет[аы].*является.*(?:твёрдой|приблизительной)"
        - "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|тыс|млн|млрд)"
        - "(?i)индексаци.*цен|корректировк.*стоимост"
        - "(?i)оплата.*на\\s+основании.*КС-2|КС-3"
        - "(?i)без\\s+ндс|ндс\\s+не\\s+облагается"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор строительного подряда по ст. 709, 743, 744, 746 ГК РФ.
        Проверяется только один вопрос: как в договоре урегулированы смета,
        цена, НДС, дополнительные работы, основания оплаты и индексация цены.

        Нормативный ориентир:
        - ст. 709 ГК РФ (цена работы, твёрдая и приблизительная смета)
        - ст. 743 ГК РФ (дополнительные работы)
        - ст. 744 ГК РФ (изменение сметы)
        - ст. 746 ГК РФ (оплата работы)

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.
        - Различай «твёрдую цену» и «твёрдую смету» — это разные правовые
          режимы по ст. 709 ГК РФ.
        - «Без НДС» может означать УСН, НПД или иную систему налогообложения —
          фиксируй формулировку договора.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Какой тип сметы установлен (твёрдая/приблизительная/не указан).
        2. Какова общая цена договора.
        3. Как урегулирован НДС (включая «без НДС» / УСН / НПД).
        4. Как описан порядок оформления дополнительных работ.
        5. Как авторизуются дополнительные работы.
        6. На каком основании производятся промежуточные платежи.
        7. Есть ли аванс и каков его размер.
        8. Есть ли механизм индексации или корректировки цены.
        9. Сформируй три краткие сводки: (а) цена и НДС, (б) оплата и аванс,
           (в) допработы и индексация.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined" для статусов
           и "Данные не определены" для текстовых полей.
        4. Не используй "None", "null", "N/A" или пустые строки.
        5. estimate_type = "firm" только если договор прямо указывает
           на твёрдую смету или твёрдую цену.
        6. estimate_type = "approximate" только если договор прямо указывает
           на приблизительную смету или приблизительную цену.
        7. estimate_type = "not_specified" если смета / цена есть,
           но тип прямо не назван.
        8. change_order_procedure = "described" только если порядок оформления
           изменений или дополнительных работ описан содержательно.
        9. additional_works_authorization = "written_approval" только если
           требуется письменное согласование / допсоглашение (ст. 743 ГК РФ).
        10. price_includes_vat = "no" также если указано «без НДС», «УСН»,
            «НПД» или аналогичная формулировка.
        11. price_indexation_present = "yes" только если договор прямо
            содержит механизм индексации, корректировки или актуализации цены.
        12. Фиксируй различие между «твёрдой ценой» и «твёрдой сметой»,
            если оно прямо указано в договоре.
        13. В evidence включай только точные цитаты из текста договора.
        14. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        со всеми 14 ключами.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — данные определены:
        Фрагмент:
        "Смета является твердой. Цена договора составляет 120 000 000 рублей,
        включая НДС 20%. Дополнительные работы выполняются только после
        подписания сторонами дополнительного соглашения. Оплата производится
        ежемесячно на основании актов КС-2 и справок КС-3. Заказчик уплачивает
        аванс в размере 20% цены договора. При изменении индекса стоимости
        строительных ресурсов цена подлежит корректировке по согласованной
        формуле."

        Ответ:
        {
          "estimate_type": "firm",
          "contract_price_status": "defined",
          "contract_price_value": "120 000 000 рублей",
          "price_includes_vat": "yes",
          "change_order_procedure": "described",
          "additional_works_authorization": "written_approval",
          "payment_basis": "ks2_ks3_acts",
          "advance_present": "yes",
          "advance_rate": "20% цены договора",
          "price_indexation_present": "yes",
          "price_indexation_details": "Цена подлежит корректировке по согласованной формуле при изменении индекса стоимости строительных ресурсов",
          "price_and_vat_summary": "Твёрдая смета, цена 120 000 000 рублей включая НДС 20%.",
          "payment_and_advance_summary": "Оплата ежемесячно по КС-2/КС-3; аванс 20% цены договора.",
          "changes_and_indexation_summary": "Допработы по допсоглашению; индексация по формуле при изменении индекса стоимости ресурсов.",
          "evidence": [
            {
              "clause_ref": "п. 4.1",
              "quote": "Смета является твердой. Цена договора составляет 120 000 000 рублей, включая НДС 20%."
            },
            {
              "clause_ref": "п. 4.5",
              "quote": "Дополнительные работы выполняются только после подписания сторонами дополнительного соглашения."
            },
            {
              "clause_ref": "п. 4.8",
              "quote": "Оплата производится ежемесячно на основании актов КС-2 и справок КС-3. Заказчик уплачивает аванс в размере 20% цены договора."
            },
            {
              "clause_ref": "п. 4.10",
              "quote": "При изменении индекса стоимости строительных ресурсов цена подлежит корректировке по согласованной формуле."
            }
          ]
        }

        Пример 2 — УСН подрядчика:
        Фрагмент:
        "Цена договора составляет 50 000 000 рублей. НДС не облагается в связи
        с применением Подрядчиком упрощённой системы налогообложения (УСН).
        Оплата производится по факту завершения работ по акту приёмки.
        Аванс не предусмотрен. Индексация цены не применяется."

        Ответ:
        {
          "estimate_type": "not_specified",
          "contract_price_status": "defined",
          "contract_price_value": "50 000 000 рублей",
          "price_includes_vat": "no",
          "change_order_procedure": "not_defined",
          "additional_works_authorization": "not_defined",
          "payment_basis": "completion_certificate",
          "advance_present": "no",
          "advance_rate": "Данные не определены",
          "price_indexation_present": "no",
          "price_indexation_details": "Индексация цены не применяется",
          "price_and_vat_summary": "Цена 50 000 000 рублей, без НДС (УСН). Тип сметы не указан.",
          "payment_and_advance_summary": "Оплата по факту завершения по акту приёмки; аванс не предусмотрен.",
          "changes_and_indexation_summary": "Порядок допработ не урегулирован; индексация не применяется.",
          "evidence": [
            {
              "clause_ref": "п. 3.1",
              "quote": "Цена договора составляет 50 000 000 рублей. НДС не облагается в связи с применением Подрядчиком упрощённой системы налогообложения (УСН)."
            },
            {
              "clause_ref": "п. 3.4",
              "quote": "Оплата производится по факту завершения работ по акту приёмки. Аванс не предусмотрен."
            },
            {
              "clause_ref": "п. 3.6",
              "quote": "Индексация цены не применяется."
            }
          ]
        }

        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Стоимость работ определяется сторонами дополнительно."

        Ответ:
        {
          "estimate_type": "not_defined",
          "contract_price_status": "not_defined",
          "contract_price_value": "Данные не определены",
          "price_includes_vat": "not_defined",
          "change_order_procedure": "not_defined",
          "additional_works_authorization": "not_defined",
          "payment_basis": "not_defined",
          "advance_present": "not_defined",
          "advance_rate": "Данные не определены",
          "price_indexation_present": "not_defined",
          "price_indexation_details": "Данные не определены",
          "price_and_vat_summary": "Не установлено",
          "payment_and_advance_summary": "Не установлено",
          "changes_and_indexation_summary": "Не установлено",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о типе сметы и цене договора.
        2. Найди прямую цитату о НДС (включая «без НДС» / УСН / НПД).
        3. Найди прямую цитату о дополнительных работах.
        4. Найди прямую цитату об основании оплаты и авансе.
        5. Найди прямую цитату об индексации или корректировке цены.
        6. Если прямой цитаты нет — верни "not_defined" / "Данные не определены".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "estimate_type": "<firm / approximate / not_specified / not_defined>",
          "contract_price_status": "<defined / not_defined>",
          "contract_price_value": "<текст или 'Данные не определены'>",
          "price_includes_vat": "<yes / no / not_applicable / not_defined>",
          "change_order_procedure": "<described / referenced / absent / not_defined>",
          "additional_works_authorization": "<written_approval / notification / unclear / not_defined>",
          "payment_basis": "<ks2_ks3_acts / completion_certificate / schedule / other / not_defined>",
          "advance_present": "<yes / no / not_defined>",
          "advance_rate": "<текст или 'Данные не определены'>",
          "price_indexation_present": "<yes / no / not_defined>",
          "price_indexation_details": "<текст или 'Данные не определены'>",
          "price_and_vat_summary": "<краткая сводка или 'Не установлено'>",
          "payment_and_advance_summary": "<краткая сводка или 'Не установлено'>",
          "changes_and_indexation_summary": "<краткая сводка или 'Не установлено'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 1100

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "смета твердая смета приблизительная смета твёрдая цена сметная стоимость дополнительные работы изменение проектной документации дополнительное соглашение авансовый платеж предоплата КС-2 КС-3 индексация цены корректировка стоимости УСН без НДС"
      retrieval_profile: "payment_terms_check"
      preferred_unit_types:
        - payment_term
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "гарантийный срок"
        - "скрытые недостатки"
        - "кадастровый номер"
        - "СРО"
        - "форс-мажор"
        - "охрана труда"
      position_bias:
        preferred_range: [0.15, 0.70]
        boost: 0.22
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
        - "price_list"
      excluded_segment_types:
        - "technical_specification"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.14

    evidence:
      required: true
      min_snippet_length: 50
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 1400

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора строительного подряда
        сведения о смете, цене договора, статусе НДС (включая УСН/НПД),
        дополнительных работах, основании оплаты, авансе и индексации цены.
        Не анализируй объект строительства, сроки, приёмку, гарантию,
        страхование или экологические обязательства.
        Различай «твёрдую цену» и «твёрдую смету» — это разные правовые режимы.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 14 полей:

        1. estimate_type — "firm" / "approximate" / "not_specified" / "not_defined".
        2. contract_price_status — "defined" если цена договора прямо указана,
           иначе "not_defined".
        3. contract_price_value — общая цена договора, или "Данные не определены".
        4. price_includes_vat — "yes" / "no" / "not_applicable" / "not_defined".
        5. change_order_procedure — "described" / "referenced" / "absent" / "not_defined".
        6. additional_works_authorization — "written_approval" / "notification" /
           "unclear" / "not_defined".
        7. payment_basis — "ks2_ks3_acts" / "completion_certificate" /
           "schedule" / "other" / "not_defined".
        8. advance_present — "yes" / "no" / "not_defined".
        9. advance_rate — размер аванса, или "Данные не определены".
        10. price_indexation_present — "yes" / "no" / "not_defined".
        11. price_indexation_details — формулировка об индексации или
            корректировке цены, или "Данные не определены".
        12. price_and_vat_summary — краткая user-facing сводка по типу сметы,
            цене и статусу НДС. Примеры: "Твёрдая смета, 120 млн руб. включая
            НДС 20%." / "Цена 50 млн руб., без НДС (УСН). Тип сметы не указан." /
            "Не установлено".
        13. payment_and_advance_summary — краткая user-facing сводка по основанию
            оплаты и авансу. Примеры: "Оплата ежемесячно по КС-2/КС-3; аванс 20%." /
            "Оплата по акту приёмки; аванс не предусмотрен." / "Не установлено".
        14. changes_and_indexation_summary — краткая user-facing сводка по
            допработам и индексации. Примеры: "Допработы по допсоглашению;
            индексация по формуле." / "Порядок допработ не урегулирован;
            индексация не применяется." / "Не установлено".
        </task>

        <context_rules>
        - Используй только текст договора из <context>.
        - Не подставляй данные из нормативных актов или общих знаний.
        - Если в переданном контексте нет разделов о цене, оплате или
        дополнительных работах — верни все статусы как "not_defined",
        все текстовые поля как "Данные не определены", все summary как
        "Не установлено".
        - estimate_type:
        - "firm" — прямо указана твёрдая смета или твёрдая цена.
        - "approximate" — прямо указана приблизительная смета или
        приблизительная цена.
        - "not_specified" — смета / цена есть, но тип прямо не назван.
        - "not_defined" — смета / цена не указаны или вопрос не урегулирован.
        - contract_price_status:
        - "defined" — цена договора прямо указана (сумма, формула).
        - "not_defined" — цена прямо не указана.
        - price_includes_vat:
        - "yes" — прямо указано, что цена включает НДС (например, «включая НДС 20%»).
        - "no" — НДС начисляется сверх цены ИЛИ прямо указано «без НДС»,
        «НДС не облагается», «УСН», «НПД» или аналогичная формулировка.
        - "not_applicable" — сторона освобождена от НДС по закону
        (например, госорган).
        - "not_defined" — вопрос прямо не урегулирован.
        - change_order_procedure:
        - "described" — порядок оформления изменений / дополнительных работ
        описан содержательно (требования к оформлению, сроки, подписанты).
        - "referenced" — есть только краткая ссылка на порядок без деталей.
        - "absent" — прямо указано, что специального порядка нет.
        - "not_defined" — вопрос прямо не урегулирован.
        - additional_works_authorization:
        - "written_approval" — требуется письменное согласование или
        дополнительное соглашение (ст. 743 ГК РФ).
        - "notification" — достаточно уведомления Заказчика.
        - "unclear" — тема есть, но порядок авторизации неясен.
        - "not_defined" — вопрос прямо не урегулирован.
        - payment_basis:
        - "ks2_ks3_acts" — оплата основана на актах КС-2 и справках КС-3.
        - "completion_certificate" — оплата основана на акте приёмки /
        завершения работ.
        - "schedule" — оплата основана на графике платежей.
        - "other" — указан иной механизм.
        - "not_defined" — вопрос прямо не урегулирован.
        - advance_present:
        - "yes" — аванс или предоплата прямо указаны.
        - "no" — договор прямо исключает аванс.
        - "not_defined" — вопрос прямо не урегулирован.
        - price_indexation_present:
        - "yes" — предусмотрены индексация, корректировка или актуализация цены.
        - "no" — договор прямо исключает такие механизмы.
        - "not_defined" — вопрос прямо не урегулирован.
        - advance_rate и price_indexation_details:
        - Заполняй только по прямой формулировке из текста договора.
        - При отсутствии данных верни "Данные не определены".
        - price_and_vat_summary, payment_and_advance_summary, changes_and_indexation_summary:
        - Формируй одним предложением на русском языке.
        - Включи только факты, прямо подтверждённые текстом договора.
        - Если ни один из параметров не установлен — верни "Не установлено".
        - Не используй аббревиатуры, кроме общепринятых (НДС, УСН, НПД, КС-2, КС-3).
        Формат и полнота ответа:
        - Верни строго один JSON-объект с ровно 14 ключами, перечисленными
        в <task>. Не добавляй и не пропускай ключи.
        - Запрещено использовать null, None, "N/A", "—" или пустые строки ""
        в качестве значений.
        - Для статусов используй только "defined" или "not_defined".
        - Для текстовых полей при отсутствии данных используй
        "Данные не определены".
        - В evidence включай только точные цитаты из текста договора
        с указанием пункта.
        </context_rules>

        <output_expectations>
        - Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        - Не используй markdown fences.
        - Не добавляй пояснения до или после JSON.
        - Верни все ключи, перечисленные в task, без пропусков.
        - Не используй null, None или пустые строки.
        - Для статусных полей используй только значения из allowed_values или "not_defined".
        - Для текстовых полей при отсутствии данных используй "Данные не определены" / "Не удалось определить" / "Не применимо" — согласно правилам выше.
        </output_expectations>

        <output_expectations>
        {
          "estimate_type": "firm | approximate | not_specified | not_defined",
          "contract_price_status": "defined | not_defined",
          "contract_price_value": "string",
          "price_includes_vat": "yes | no | not_applicable | not_defined",
          "change_order_procedure": "described | referenced | absent | not_defined",
          "additional_works_authorization": "written_approval | notification | unclear | not_defined",
          "payment_basis": "ks2_ks3_acts | completion_certificate | schedule | other | not_defined",
          "advance_present": "yes | no | not_defined",
          "advance_rate": "string",
          "price_indexation_present": "yes | no | not_defined",
          "price_indexation_details": "string",
          "price_and_vat_summary": "string",
          "payment_and_advance_summary": "string",
          "changes_and_indexation_summary": "string",
          "evidence": [{"clause_ref": "string", "quote": "string"}]
        }
        </output_expectations>

      fields:
        - name: "estimate_type"
          type: "string"
          presentation: "signal"
          allowed_values: ["firm", "approximate", "not_specified", "not_defined"]
          description: "Тип сметы или цены по договору (твёрдая/приблизительная)."
          required: true
          display_in_grid: false
        - name: "contract_price_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания общей цены договора."
          required: true
          display_in_grid: false
        - name: "contract_price_value"
          type: "string"
          presentation: "fact"
          label: "Цена договора"
          description: "Общая цена договора строительного подряда."
          required: true
          display_in_grid: true
          display_priority: 1
        - name: "price_includes_vat"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no", "not_applicable", "not_defined"]
          description: "Как договор регулирует НДС в цене (включая УСН/НПД)."
          required: true
          display_in_grid: false
        - name: "change_order_procedure"
          type: "string"
          presentation: "signal"
          allowed_values: ["described", "referenced", "absent", "not_defined"]
          description: "Описан ли порядок оформления дополнительных работ и изменений."
          required: true
          display_in_grid: false
        - name: "additional_works_authorization"
          type: "string"
          presentation: "signal"
          allowed_values: ["written_approval", "notification", "unclear", "not_defined"]
          description: "Как авторизуются дополнительные работы (ст. 743 ГК РФ)."
          required: true
          display_in_grid: false
        - name: "payment_basis"
          type: "string"
          presentation: "signal"
          allowed_values: ["ks2_ks3_acts", "completion_certificate", "schedule", "other", "not_defined"]
          description: "Основание промежуточных или этапных платежей."
          required: true
          display_in_grid: false
        - name: "advance_present"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Есть ли условие об авансе."
          required: true
          display_in_grid: false
        - name: "advance_rate"
          type: "string"
          presentation: "fact"
          description: "Размер аванса в процентах или сумме."
          required: true
          display_in_grid: false
        - name: "price_indexation_present"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Есть ли механизм индексации или корректировки цены."
          required: true
          display_in_grid: false
        - name: "price_indexation_details"
          type: "string"
          presentation: "fact"
          description: "Формулировка об индексации или корректировке цены."
          required: true
          display_in_grid: false
        - name: "price_and_vat_summary"
          type: "string"
          presentation: "fact"
          label: "Цена и НДС"
          description: "Краткая сводка по типу сметы, цене договора и статусу НДС."
          required: true
          display_in_grid: true
          display_priority: 2
        - name: "payment_and_advance_summary"
          type: "string"
          presentation: "fact"
          label: "Оплата и аванс"
          description: "Краткая сводка по основанию оплаты и наличию/размеру аванса."
          required: true
          display_in_grid: true
          display_priority: 3
        - name: "changes_and_indexation_summary"
          type: "string"
          presentation: "fact"
          label: "Допработы и индексация"
          description: "Краткая сводка по порядку допработ и механизму индексации цены."
          required: true
          display_in_grid: true
          display_priority: 4
      store_payload: true

  - id: customer_site_and_permits_obligations
    name: "Обязанности Заказчика: участок, разрешения, финансирование и последствия нарушения"
    description: >
      Фактографическая проверка обязанностей Заказчика по предоставлению
      участка / строительной площадки или обеспечению доступа (ст. 747 ГК РФ),
      предоставлению разрешений и исходно-разрешительной документации (ИРД),
      обеспечению финансирования, а также последствий нарушения этих
      обязанностей для сроков и права Подрядчика приостановить работы
      (ст. 719, 328 ГК РФ).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "предоставление земельного участка"
        - "строительная площадка"
        - "доступ на объект"
        - "акт допуска"
        - "разрешение на строительство"
        - "технические условия"
        - "исходно-разрешительная документация"
        - "ИРД"
        - "права на землю"
        - "график финансирования"
        - "обеспечение условий"
        - "приостановление работ"
        - "простой по вине заказчика"
        - "продление срока при нарушении заказчиком"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)заказчик.*предоставляет.*(участок|площадку|разрешение|доступ)"
        - "(?i)право.*пользования.*земельным.*участком"
        - "(?i)при.*нарушении.*заказчиком.*срок.*исполнения.*продлевается"
        - "(?i)подрядчик.*вправе.*приостановить.*работы"
        - "(?i)акт.*допуска.*на.*объект"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор строительного подряда по ст. 747, 719, 328 ГК РФ.
        Проверяется только один вопрос: какие обязанности по подготовке
        строительства и финансированию возложены на Заказчика и какие
        последствия предусмотрены на случай их нарушения.

        Нормативный ориентир:
        - ст. 747 ГК РФ (обязанности Заказчика)
        - ст. 719 ГК РФ (приостановление работ)
        - ст. 328 ГК РФ (встречное исполнение обязательств)

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.
        - Различай «предоставление участка» и «обеспечение доступа» —
          это разные обязательства по российской практике.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Обязан ли Заказчик предоставить участок / строительную площадку
           или обеспечить доступ к объекту (включая акт допуска).
        2. Обязан ли Заказчик предоставить разрешения, технические условия,
           исходно-разрешительную документацию (ИРД), исходные данные
           или иные исходные документы.
        3. Определена ли обязанность Заказчика по финансированию / оплате
           как условие продолжения работ.
        4. Описаны ли последствия нарушения этих обязанностей Заказчиком
           (продление сроков, компенсация простоя, возмещение расходов).
        5. Предусмотрено ли право Подрядчика приостановить работы из-за
           нарушения обязательств Заказчиком.
        6. Сформируй две краткие сводки: (а) обязанности Заказчика,
           (б) последствия нарушения.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined" для статусов
           и "Данные не определены" для текстовых полей.
        4. Не используй "None", "null", "N/A" или пустые строки.
        5. site_provision_obligation = "yes" только если обязанность
           предоставить участок, площадку, доступ или оформить акт допуска
           прямо закреплена за Заказчиком.
        6. permits_and_source_docs_obligation = "yes" только если Заказчик
           прямо обязан предоставить разрешения, техусловия, ИРД, документы
           на землю, исходные данные или иные исходные материалы.
        7. financing_obligation_defined = "yes" только если в тексте прямо
           отражена обязанность Заказчика обеспечить финансирование или оплату
           как часть его строительных обязанностей.
        8. customer_breach_consequences_defined = "yes" только если договор
           прямо предусматривает продление сроков, простой, компенсацию,
           возмещение расходов или иные последствия нарушения Заказчиком.
        9. contractor_suspension_right_due_customer_breach = "yes" только если
           Подрядчик прямо вправе приостановить работы при нарушении
           обязанностей Заказчиком.
        10. «Акт допуска на объект» принимай как эквивалент предоставления
            площадки.
        11. «ИРД» (исходно-разрешительная документация) — общепринятый
            термин в строительной практике, включает техусловия, ТУ на
            подключение, градостроительный план и т.д.
        12. В evidence включай только точные цитаты из текста договора.
        13. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.с 8 ключами.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — данные определены:
        Фрагмент:
        "Заказчик обязуется предоставить Подрядчику строительную площадку
        по акту допуска, документы, подтверждающие право пользования
        земельным участком, разрешение на строительство, технические
        условия и прочую исходно-разрешительную документацию. Заказчик
        также обеспечивает своевременное финансирование работ. В случае
        просрочки предоставления указанных документов срок выполнения
        работ подлежит продлению на период задержки, а Подрядчик вправе
        приостановить работы до устранения нарушения. Расходы Подрядчика,
        связанные с простоем, подлежат возмещению Заказчиком."

        Ответ:
        {
          "site_provision_obligation": "yes",
          "permits_and_source_docs_obligation": "yes",
          "financing_obligation_defined": "yes",
          "customer_breach_consequences_defined": "yes",
          "contractor_suspension_right_due_customer_breach": "yes",
          "customer_obligations_details": "Заказчик обязуется предоставить строительную площадку по акту допуска, документы на земельный участок, разрешение на строительство, технические условия и прочую ИРД, а также обеспечить своевременное финансирование работ.",
          "customer_obligations_summary": "Заказчик предоставляет площадку по акту допуска, разрешение на строительство, ТУ и ИРД; обеспечивает финансирование.",
          "breach_consequences_summary": "При просрочке: продление срока на период задержки; Подрядчик вправе приостановить работы; расходы простоя возмещаются Заказчиком.",
          "evidence": [
            {
              "clause_ref": "п. 2.3",
              "quote": "Заказчик обязуется предоставить Подрядчику строительную площадку по акту допуска, документы, подтверждающие право пользования земельным участком, разрешение на строительство, технические условия и прочую исходно-разрешительную документацию. Заказчик также обеспечивает своевременное финансирование работ."
            },
            {
              "clause_ref": "п. 7.4",
              "quote": "В случае просрочки предоставления указанных документов срок выполнения работ подлежит продлению на период задержки, а Подрядчик вправе приостановить работы до устранения нарушения. Расходы Подрядчика, связанные с простоем, подлежат возмещению Заказчиком."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Заказчик поручает, а Подрядчик принимает на себя обязательство
        выполнить строительные работы."

        Ответ:
        {
          "site_provision_obligation": "not_defined",
          "permits_and_source_docs_obligation": "not_defined",
          "financing_obligation_defined": "not_defined",
          "customer_breach_consequences_defined": "not_defined",
          "contractor_suspension_right_due_customer_breach": "not_defined",
          "customer_obligations_details": "Данные не определены",
          "customer_obligations_summary": "Не установлено",
          "breach_consequences_summary": "Не установлено",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о предоставлении участка, площадки или акта допуска.
        2. Найди прямую цитату о разрешениях, ТУ, ИРД или исходных документах.
        3. Найди прямую цитату о финансировании.
        4. Найди прямую цитату о последствиях нарушения Заказчиком.
        5. Найди прямую цитату о праве Подрядчика приостановить работы.
        6. Если прямой цитаты нет — верни "not_defined" / "Данные не определены".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "site_provision_obligation": "<yes / no / not_defined>",
          "permits_and_source_docs_obligation": "<yes / no / not_defined>",
          "financing_obligation_defined": "<yes / no / not_defined>",
          "customer_breach_consequences_defined": "<yes / no / not_defined>",
          "contractor_suspension_right_due_customer_breach": "<yes / no / not_defined>",
          "customer_obligations_details": "<текст или 'Данные не определены'>",
          "customer_obligations_summary": "<краткая сводка или 'Не установлено'>",
          "breach_consequences_summary": "<краткая сводка или 'Не установлено'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 900

    retrieval:
      retrieval_profile: "scope_of_work_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "предоставление земельного участка строительная площадка доступ на объект акт допуска разрешение на строительство технические условия исходно-разрешительная документация ИРД права на землю график финансирования приостановление работ простой по вине заказчика продление срока"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
      negative_keywords:
        - "КС-2"
        - "КС-3"
        - "гарантийный срок"
        - "скрытые недостатки"
        - "субподряд"
        - "СРО"
      position_bias:
        preferred_range: [0.10, 0.55]
        boost: 0.22
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "price_list"
      preferred_clause_functions:
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.14

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 900

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора строительного подряда
        обязанности Заказчика по предоставлению площадки (или обеспечению
        доступа), разрешений, исходно-разрешительной документации (ИРД)
        и финансированию, а также последствия их нарушения.
        Не анализируй предмет договора, смету, сроки как самостоятельную тему,
        гарантию, страхование или экологические обязательства.
        Различай «предоставление участка» и «обеспечение доступа» —
        это разные обязательства.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 8 полей:

        1. site_provision_obligation — "yes" / "no" / "not_defined".
        2. permits_and_source_docs_obligation — "yes" / "no" / "not_defined".
        3. financing_obligation_defined — "yes" / "no" / "not_defined".
        4. customer_breach_consequences_defined — "yes" / "no" / "not_defined".
        5. contractor_suspension_right_due_customer_breach — "yes" / "no" / "not_defined".
        6. customer_obligations_details — формулировка обязанностей Заказчика,
           или "Данные не определены".
        7. customer_obligations_summary — краткая user-facing сводка по
           обязанностям Заказчика (участок/доступ, разрешения/ИРД, финансирование).
           Примеры: "Заказчик предоставляет площадку по акту допуска, разрешение,
           ТУ и ИРД; обеспечивает финансирование." / "Не установлено".
        8. breach_consequences_summary — краткая user-facing сводка по последствиям
           нарушения обязанностей Заказчиком. Примеры: "При просрочке: продление
           срока; Подрядчик вправе приостановить работы; расходы простоя
           возмещаются." / "Не установлено".
        </task>

        <context_rules>
        - Используй только текст договора из <context>.
        - Не подставляй данные из нормативных актов или общих знаний.
        - Если в переданном контексте нет разделов об обязанностях Заказчика —
        верни все статусы как "not_defined", customer_obligations_details как
        "Данные не определены", оба summary как "Не установлено".
        - site_provision_obligation:
        - "yes" — Заказчик прямо обязан предоставить участок, площадку,
        доступ на объект или оформить акт допуска.
        - "no" — договор прямо исключает такую обязанность.
        - "not_defined" — вопрос прямо не урегулирован.
        - permits_and_source_docs_obligation:
        - "yes" — Заказчик прямо обязан предоставить разрешения, технические
        условия, исходно-разрешительную документацию (ИРД), документы
        на землю, исходные данные или иные исходные документы.
        - "no" — договор прямо исключает такую обязанность.
        - "not_defined" — вопрос прямо не урегулирован.
        - financing_obligation_defined:
        - "yes" — прямо отражена обязанность Заказчика обеспечить
        финансирование или своевременную оплату как часть его
        строительных обязанностей (не просто общий порядок оплаты,
        а именно обязанность обеспечения финансирования).
        - "no" — договор прямо исключает такую обязанность.
        - "not_defined" — вопрос прямо не урегулирован.
        - customer_breach_consequences_defined:
        - "yes" — прямо предусмотрены последствия нарушения обязанностей
        Заказчиком: продление сроков, простой, возмещение расходов,
        компенсация или аналогичные меры.
        - "no" — договор прямо указывает на отсутствие специальных последствий.
        - "not_defined" — вопрос прямо не урегулирован.
        - contractor_suspension_right_due_customer_breach:
        - "yes" — Подрядчик прямо вправе приостановить работы при нарушении
        обязанностей Заказчиком.
        - "no" — договор прямо исключает такое право.
        - "not_defined" — вопрос прямо не урегулирован.
        - customer_obligations_details:
        - Заполняй только по прямому тексту договора.
        - При отсутствии данных верни "Данные не определены".
        - customer_obligations_summary, breach_consequences_summary:
        - Формируй одним предложением на русском языке.
        - Включи только факты, прямо подтверждённые текстом договора.
        - Если ни один из параметров не установлен — верни "Не установлено".
        - Не используй аббревиатуры, кроме общепринятых (ИРД, ТУ).
        - «Акт допуска на объект» = предоставление площадки.
        Формат и полнота ответа:
        - Верни строго один JSON-объект с ровно 8 ключами, перечисленными
        в <task>. Не добавляй и не пропускай ключи.
        - Запрещено использовать null, None, "N/A", "—" или пустые строки ""
        в качестве значений.
        - Для статусов используй только значения из allowed_values.
        - Для текстовых полей при отсутствии данных используй
        "Данные не определены" или "Не установлено" (для summary).
        - В evidence включай только точные цитаты из текста договора
        с указанием пункта.
        </context_rules>

        <output_expectations>
        - Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        - Не используй markdown fences.
        - Не добавляй пояснения до или после JSON.
        - Верни все ключи, перечисленные в task, без пропусков.
        - Не используй null, None или пустые строки.
        - Для статусных полей используй только значения из allowed_values или "not_defined".
        - Для текстовых полей при отсутствии данных используй "Данные не определены" / "Не удалось определить" / "Не применимо" — согласно правилам выше.
        </output_expectations>

        <output_expectations>
        {
          "site_provision_obligation": "yes | no | not_defined",
          "permits_and_source_docs_obligation": "yes | no | not_defined",
          "financing_obligation_defined": "yes | no | not_defined",
          "customer_breach_consequences_defined": "yes | no | not_defined",
          "contractor_suspension_right_due_customer_breach": "yes | no | not_defined",
          "customer_obligations_details": "string",
          "customer_obligations_summary": "string",
          "breach_consequences_summary": "string",
          "evidence": [{"clause_ref": "string", "quote": "string"}]
        }
        </output_expectations>

      fields:
        - name: "site_provision_obligation"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Обязан ли Заказчик предоставить участок, строительную площадку или обеспечить доступ."
          required: true
          display_in_grid: false
        - name: "permits_and_source_docs_obligation"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Обязан ли Заказчик предоставить разрешения, техусловия, ИРД и исходные документы."
          required: true
          display_in_grid: false
        - name: "financing_obligation_defined"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Определена ли обязанность Заказчика по финансированию как условие продолжения работ."
          required: true
          display_in_grid: false
        - name: "customer_breach_consequences_defined"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Предусмотрены ли последствия нарушения обязанностей Заказчиком."
          required: true
          display_in_grid: false
        - name: "contractor_suspension_right_due_customer_breach"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Есть ли у Подрядчика право приостановить работы из-за нарушения Заказчиком."
          required: true
          display_in_grid: false
        - name: "customer_obligations_details"
          type: "string"
          presentation: "fact"
          description: "Формулировка обязанностей Заказчика и связанных условий."
          required: true
          display_in_grid: false
        - name: "customer_obligations_summary"
          type: "string"
          presentation: "fact"
          label: "Обязанности Заказчика"
          description: "Краткая сводка по обязанностям Заказчика: участок/доступ, разрешения/ИРД, финансирование."
          required: true
          display_in_grid: true
          display_priority: 1
        - name: "breach_consequences_summary"
          type: "string"
          presentation: "fact"
          label: "Нарушение обязанностей Заказчика"
          description: "Краткая сводка по последствиям нарушения обязанностей Заказчиком."
          required: true
          display_in_grid: true
          display_priority: 2
      store_payload: true

  - id: technical_supervision_rights_check
    name: "Права Заказчика на технический надзор и контроль (ст. 748 ГК РФ)"
    description: >
      Фактографическая проверка объёма прав Заказчика на технический надзор
      и строительный контроль (ст. 748 ГК РФ, ст. 53 ГрК РФ), включая доступ
      на площадку, проверку материалов, упоминание технического инспектора
      или представителя Заказчика, а также правило о невмешательстве в
      оперативно-хозяйственную деятельность Подрядчика.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "право осуществлять контроль"
        - "технический надзор"
        - "авторский надзор"
        - "строительный контроль"
        - "доступ на строительную площадку"
        - "проверка соответствия проекту"
        - "представитель заказчика на объекте"
        - "технический инспектор"
        - "журнал строительного контроля"
        - "невмешательство"
        - "оперативно-хозяйственная деятельность"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)заказчик.*вправе.*осуществлять.*контроль.*и.*надзор"
        - "(?i)технический.*надзор.*осуществляется"
        - "(?i)ст\\.?\\s*748\\s+ГК\\s+РФ"
        - "(?i)невмешательств.*в.*деятельность.*подрядчика"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор строительного подряда по ст. 748 ГК РФ.
        Проверяется только один вопрос: каков объём прав Заказчика
        на технический надзор и контроль за строительством.

        Нормативный ориентир:
        - ст. 748 ГК РФ (контроль и надзор Заказчика)
        - ст. 53 ГрК РФ (строительный контроль)

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.
        - Различай технический надзор Заказчика (ст. 748 ГК РФ) и авторский 
          надзор проектировщика (ст. 53 ГрК РФ). В данном чек-листе 
          фокусируемся на правах Заказчика.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Закреплено ли право Заказчика на технический надзор / контроль.
        2. Есть ли право доступа на строительную площадку для контроля.
        3. Есть ли право на проверку материалов, отбор образцов или иную
           аналогичную контрольную функцию.
        4. Упомянут ли технический заказчик, инженер, представитель Заказчика
           или технический инспектор.
        5. Есть ли правило о том, что надзор не должен вмешиваться
           в оперативно-хозяйственную деятельность Подрядчика.
        6. Сформируй краткую сводку по объёму надзорных прав Заказчика.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined" для статусов
           и "Данные не определены" для текстовых полей.
        4. Не используй "None", "null", "N/A" или пустые строки.
        5. supervision_right_present = "yes" только если технический надзор
           или строительный контроль прямо закреплены за Заказчиком.
        6. supervision_right_present = "partial" если предоставлены только
           отдельные фрагментарные полномочия (например, только доступ).
        7. site_access_right = "yes" только если Заказчик, его представитель
           или инспектор прямо вправе находиться на площадке или посещать объект.
        8. material_sampling_right = "yes" только если прямо допускается
           проверка, отбор или испытание материалов и конструкций.
        9. supervision_non_interference = "yes" только если прямо указано,
           что надзор не вмешивается в оперативно-хозяйственную деятельность
           Подрядчика.
        10. Строительный контроль (СК) в российской практике часто 
            используется как синоним технического надзора Заказчика.
        11. В evidence включай только точные цитаты из текста договора.
        12. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        со всеми 7 ключами.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — данные определены:
        Фрагмент:
        "Заказчик вправе осуществлять технический надзор и строительный контроль
        за ходом и качеством работ, посещать строительную площадку, проверять
        применяемые материалы и требовать представления результатов испытаний.
        Технический надзор осуществляется представителем Заказчика и не должен
        вмешиваться в оперативно-хозяйственную деятельность Подрядчика."

        Ответ:
        {
          "supervision_right_present": "yes",
          "site_access_right": "yes",
          "material_sampling_right": "yes",
          "technical_inspector_mentioned": "yes",
          "supervision_non_interference": "yes",
          "supervision_details": "Заказчик вправе осуществлять технический надзор и строительный контроль, посещать строительную площадку и проверять применяемые материалы.",
          "supervision_summary": "Технадзор и СК закреплены; право доступа на площадку и проверки материалов есть; закреплено правило о невмешательстве.",
          "evidence": [
            {
              "clause_ref": "п. 5.4",
              "quote": "Заказчик вправе осуществлять технический надзор и строительный контроль за ходом и качеством работ, посещать строительную площадку, проверять применяемые материалы... Технический надзор осуществляется представителем Заказчика и не должен вмешиваться в оперативно-хозяйственную деятельность Подрядчика."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Заказчик принимает выполненные работы в порядке, предусмотренном договором."

        Ответ:
        {
          "supervision_right_present": "not_defined",
          "site_access_right": "not_defined",
          "material_sampling_right": "not_defined",
          "technical_inspector_mentioned": "not_defined",
          "supervision_non_interference": "not_defined",
          "supervision_details": "Данные не определены",
          "supervision_summary": "Не установлено",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о техническом надзоре или контроле Заказчика.
        2. Найди прямую цитату о доступе на площадку.
        3. Найди прямую цитату о проверке материалов или испытаниях.
        4. Найди прямую цитату о представителе Заказчика или инспекторе.
        5. Найди прямую цитату о невмешательстве.
        6. Если прямой цитаты нет — верни "not_defined" / "Данные не определены".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "supervision_right_present": "<yes / partial / no / not_defined>",
          "site_access_right": "<yes / no / not_defined>",
          "material_sampling_right": "<yes / no / not_defined>",
          "technical_inspector_mentioned": "<yes / no / not_defined>",
          "supervision_non_interference": "<yes / no / not_defined>",
          "supervision_details": "<текст или 'Данные не определены'>",
          "supervision_summary": "<краткая сводка или 'Не установлено'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 850

    retrieval:
      retrieval_profile: "technical_documentation_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "право осуществлять контроль технический надзор доступ на строительную площадку проверка соответствия проекту представитель заказчика строительный контроль журнал строительного контроля невмешательство"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
      negative_keywords:
        - "КС-2"
        - "КС-3"
        - "гарантийный срок"
        - "неустойка"
        - "аванс"
        - "экология"
      position_bias:
        preferred_range: [0.20, 0.80]
        boost: 0.20
        scope: segment
      context_k: 5
      max_chunks: 6
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "price_list"
      preferred_clause_functions:
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.14

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 550

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 1000

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора строительного подряда
        сведения о правах Заказчика на технический надзор и строительный контроль.
        Не анализируй объект строительства, смету, сроки, гарантию или страхование.
        Различай технадзор Заказчика и авторский надзор проектировщика.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 7 полей:

        1. supervision_right_present — "yes" / "partial" / "no" / "not_defined".
        2. site_access_right — "yes" / "no" / "not_defined".
        3. material_sampling_right — "yes" / "no" / "not_defined".
        4. technical_inspector_mentioned — "yes" / "no" / "not_defined".
        5. supervision_non_interference — "yes" / "no" / "not_defined".
        6. supervision_details — формулировка об объёме надзорных прав,
           или "Данные не определены".
        7. supervision_summary — краткая user-facing сводка одним предложением.
           Примеры: "Технадзор и СК закреплены; доступ на площадку и проверка 
           материалов разрешены; правило о невмешательстве есть." / 
           "Права на надзор прямо не раскрыты, доступ не упомянут." / 
           "Не установлено".
        </task>

        <context_rules>
        - Используй только текст договора из <context>.
        - Не подставляй данные из нормативных актов или общих знаний.
        - Если в переданном контексте нет разделов о технадзоре или правах
        Заказчика — верни все статусы как "not_defined", supervision_details как
        "Данные не определены", supervision_summary как "Не установлено".
        - supervision_right_present:
        - "yes" — если технический надзор или строительный контроль
        прямо закреплены за Заказчиком.
        - "partial" — предоставлены отдельные фрагментарные полномочия
        (например, только доступ), но комплексный надзор не описан.
        - "no" — договор прямо исключает такие полномочия.
        - "not_defined" — вопрос прямо не урегулирован.
        - site_access_right:
        - "yes" — Заказчик, его представитель или инспектор вправе
        посещать объект / площадку для целей контроля.
        - "no" — договор прямо исключает такое право.
        - "not_defined" — вопрос прямо не урегулирован.
        - material_sampling_right:
        - "yes" — прямо допускаются проверка, отбор, испытание материалов,
        конструкций или результатов работ.
        - "no" — договор прямо исключает такие действия.
        - "not_defined" — вопрос прямо не урегулирован.
        - technical_inspector_mentioned:
        - "yes" — упомянут технический заказчик, инженер, представитель
        Заказчика на объекте или инспектор.
        - "no" — договор прямо указывает на отсутствие такого лица.
        - "not_defined" — вопрос прямо не урегулирован.
        - supervision_non_interference:
        - "yes" — прямо указано правило о невмешательстве в оперативно-
        хозяйственную деятельность Подрядчика.
        - "no" — договор прямо допускает вмешательство или дает Заказчику
        право давать обязательные указания по управлению персоналом/техникой.
        - "not_defined" — вопрос прямо не урегулирован.
        - supervision_summary:
        - Формируй одним предложением на русском языке.
        - Включи только факты, прямо подтверждённые текстом договора.
        - Если ни один из параметров не установлен — верни "Не установлено".
        - Строительный контроль (СК) = технадзор Заказчика.
        Формат и полнота ответа:
        - Верни строго один JSON-объект с ровно 7 ключами, перечисленными
        в <task>. Не добавляй и не пропускай ключи.
        - Запрещено использовать null, None, "N/A", "—" или пустые строки ""
        в качестве значений.
        - Для статусов используй только значения из allowed_values.
        - Для текстовых полей при отсутствии данных используй
        "Данные не определены" или "Не установлено".
        - В evidence включай только точные цитаты из текста договора.
        </context_rules>

        <output_expectations>
        - Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        - Не используй markdown fences.
        - Не добавляй пояснения до или после JSON.
        - Верни все ключи, перечисленные в task, без пропусков.
        - Не используй null, None или пустые строки.
        - Для статусных полей используй только значения из allowed_values или "not_defined".
        - Для текстовых полей при отсутствии данных используй "Данные не определены" / "Не удалось определить" / "Не применимо" — согласно правилам выше.
        </output_expectations>

        <output_expectations>
        {
          "supervision_right_present": "yes | partial | no | not_defined",
          "site_access_right": "yes | no | not_defined",
          "material_sampling_right": "yes | no | not_defined",
          "technical_inspector_mentioned": "yes | no | not_defined",
          "supervision_non_interference": "yes | no | not_defined",
          "supervision_details": "string",
          "supervision_summary": "string",
          "evidence": [{"clause_ref": "string", "quote": "string"}]
        }
        </output_expectations>

      fields:
        - name: "supervision_right_present"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "partial", "no", "not_defined"]
          description: "Закреплено ли право Заказчика на технический надзор / контроль."
          required: true
          display_in_grid: false
        - name: "site_access_right"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Есть ли право доступа на строительную площадку."
          required: true
          display_in_grid: false
        - name: "material_sampling_right"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Есть ли право проверять материалы, конструкции или результаты испытаний."
          required: true
          display_in_grid: false
        - name: "technical_inspector_mentioned"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Упомянут ли технический инспектор, инженер или представитель Заказчика."
          required: true
          display_in_grid: false
        - name: "supervision_non_interference"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Есть ли правило о невмешательстве в деятельность Подрядчика."
          required: true
          display_in_grid: false
        - name: "supervision_details"
          type: "string"
          presentation: "fact"
          description: "Формулировка об объёме прав технического надзора."
          required: true
          display_in_grid: false
        - name: "supervision_summary"
          type: "string"
          presentation: "fact"
          label: "Технический надзор"
          description: "Краткая сводка по объёму прав Заказчика на надзор, доступ на площадку и проверку материалов."
          required: true
          display_in_grid: true
          display_priority: 1
      store_payload: true

  - id: warranty_and_hidden_defects_analysis
    name: "Гарантийные обязательства, скрытые недостатки и гарантийное удержание"
    description: >
      Фактографическая проверка гарантийного срока на объект и инженерные сети,
      соответствия минимальному пятилетнему сроку (ст. 756 ГК РФ), порядка работы
      со скрытыми недостатками, срока их устранения и наличия финансового обеспечения
      (гарантийное удержание / депозит).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "гарантийный срок"
        - "скрытые недостатки"
        - "гарантийные обязательства"
        - "ответственность за дефекты"
        - "устранение недостатков"
        - "5 лет"
        - "пять лет"
        - "гарантийный депозит"
        - "гарантийное удержание"
        - "удержание гарантийной суммы"
        - "резервирование средств"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)гарантийный\\s+срок.*(?:5\\s+лет|пять\\s+лет)"
        - "(?i)ст\\.?\\s*(724|756|757)\\s+ГК\\s+РФ"
        - "(?i)скрыт(ые|ых)\\s+недостат"
        - "(?i)гарантийн.*удержани|гарантийн.*депозит"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор строительного подряда по ст. 724, 756, 757 ГК РФ.
        Проверяется только один вопрос: как в договоре урегулированы гарантия,
        скрытые недостатки и гарантийное удержание.

        Нормативный ориентир:
        - ст. 724 ГК РФ (сроки обнаружения недостатков)
        - ст. 756 ГК РФ (предельный срок обнаружения недостатков в строительстве — 5 лет)
        - ст. 757 ГК РФ (ответственность подрядчика за качество)

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не оценивай серьёзность риска, но фиксируй сроки точно.
        - Обрати внимание: гарантийное удержание часто находится в разделе "Цена" или "Порядок расчетов", а сроки гарантии — в разделе "Гарантии качества".

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Какой гарантийный срок установлен на объект в целом.
        2. Какой гарантийный срок установлен на инженерные сети (если выделен).
        3. Соответствует ли общий гарантийный срок пятилетнему ориентиру (ст. 756 ГК РФ).
        4. Описан ли порядок предъявления требований по скрытым недостаткам.
        5. Указан ли срок устранения недостатков.
        6. Есть ли гарантийное удержание / депозит и каков его размер.
        7. Сформируй две сводки: (а) по срокам гарантии, (б) по недостаткам и деньгам.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона вместо текста договора.
