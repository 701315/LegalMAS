          ]
        }

        Пример 2 — УСН подрядчика:
        Фрагмент:
        "Цена договора составляет 50 000 000 рублей. НДС не облагается в связи
        с применением Подрядчиком упрощённой системы налогообложения (УСН).
        Оплата производится по факту завершения работ по акту приёмки.
        Аванс не предусмотрен. Индексация цены не применяется."

        Ответ:
        {
          "estimate_type": "not_specified",
          "contract_price_status": "defined",
          "contract_price_value": "50 000 000 рублей",
          "price_includes_vat": "no",
          "change_order_procedure": "not_defined",
          "additional_works_authorization": "not_defined",
          "payment_basis": "completion_certificate",
          "advance_present": "no",
          "advance_rate": "Данные не определены",
          "price_indexation_present": "no",
          "price_indexation_details": "Индексация цены не применяется",
          "price_and_vat_summary": "Цена 50 000 000 рублей, без НДС (УСН). Тип сметы не указан.",
          "payment_and_advance_summary": "Оплата по факту завершения по акту приёмки; аванс не предусмотрен.",
          "changes_and_indexation_summary": "Порядок допработ не урегулирован; индексация не применяется.",
          "evidence": [
            {
              "clause_ref": "п. 3.1",
              "quote": "Цена договора составляет 50 000 000 рублей. НДС не облагается в связи с применением Подрядчиком упрощённой системы налогообложения (УСН)."
            },
            {
              "clause_ref": "п. 3.4",
              "quote": "Оплата производится по факту завершения работ по акту приёмки. Аванс не предусмотрен."
            },
            {
              "clause_ref": "п. 3.6",
              "quote": "Индексация цены не применяется."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о типе сметы и цене договора.
        2. Найди прямую цитату о НДС (включая «без НДС» / УСН / НПД).
        3. Найди прямую цитату о дополнительных работах.
        4. Найди прямую цитату об основании оплаты и авансе.
        5. Найди прямую цитату об индексации или корректировке цены.
        6. Если прямой цитаты нет — верни "not_defined" / "Данные не определены".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "estimate_type": "<firm / approximate / not_specified / not_defined>",
          "contract_price_status": "<defined / not_defined>",
          "contract_price_value": "<текст или 'Данные не определены'>",
          "price_includes_vat": "<yes / no / not_applicable / not_defined>",
          "change_order_procedure": "<described / referenced / absent / not_defined>",
          "additional_works_authorization": "<written_approval / notification / unclear / not_defined>",
          "payment_basis": "<ks2_ks3_acts / completion_certificate / schedule / other / not_defined>",
          "advance_present": "<yes / no / not_defined>",
          "advance_rate": "<текст или 'Данные не определены'>",
          "price_indexation_present": "<yes / no / not_defined>",
          "price_indexation_details": "<текст или 'Данные не определены'>",
          "price_and_vat_summary": "<краткая сводка или 'Не установлено'>",
          "payment_and_advance_summary": "<краткая сводка или 'Не установлено'>",
          "changes_and_indexation_summary": "<краткая сводка или 'Не установлено'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 1100

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "смета твердая смета приблизительная смета твёрдая цена сметная стоимость дополнительные работы изменение проектной документации дополнительное соглашение авансовый платеж предоплата КС-2 КС-3 индексация цены корректировка стоимости УСН без НДС"
      retrieval_profile: "payment_terms_check"
      preferred_unit_types:
        - payment_term
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "гарантийный срок"
        - "скрытые недостатки"
        - "кадастровый номер"
        - "СРО"
        - "форс-мажор"
        - "охрана труда"
      position_bias:
        preferred_range: [0.15, 0.70]
        boost: 0.22
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
        - "price_list"
      excluded_segment_types:
        - "technical_specification"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.14

    evidence:
      required: true
      min_snippet_length: 50
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"

      compact_output: false

      presence_signal:
        field: "estimate_type_and_change_order_analysis_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_max_tokens: 1400

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора строительного подряда
        сведения о смете, цене договора, статусе НДС (включая УСН/НПД),
        дополнительных работах, основании оплаты, авансе и индексации цены.
        Не анализируй объект строительства, сроки, приёмку, гарантию,
        страхование или экологические обязательства.
        Различай «твёрдую цену» и «твёрдую смету» — это разные правовые режимы.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. estimate_type_and_change_order_analysis_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (contract_price_status, payment_basis, advance_present, estimate_type,
              price_includes_vat, change_order_procedure, additional_works_authorization,
              price_indexation_present) ≠ "not_defined";
           - "missing" — если все содержательные поля = "not_defined" (или "no");
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - estimate_type = "not_defined";
           - contract_price_status = "not_defined";
           - price_includes_vat = "not_defined";
           - change_order_procedure = "not_defined";
           - additional_works_authorization = "not_defined";
           - payment_basis = "not_defined";
           - advance_present = "not_defined";
           - price_indexation_present = "not_defined";
           - contract_price_value, advance_rate, price_indexation_details = "Данные не определены";
           - price_and_vat_summary, payment_and_advance_summary, changes_and_indexation_summary = "Не установлено";
           - не выполняй остальные шаги.

        1. estimate_type:
           "firm" / "approximate" / "not_specified" / "not_defined".

        2. contract_price_status:
           - "defined" — если цена договора прямо указана, иначе "not_defined".

        3. contract_price_value:
           Общая цена договора, или "Данные не определены".

        4. price_includes_vat:
           "yes" / "no" / "not_applicable" / "not_defined".

        5. change_order_procedure:
           "described" / "referenced" / "absent" / "not_defined".

        6. additional_works_authorization:
           "written_approval" / "notification" / "unclear" / "not_defined".

        7. payment_basis:
           "ks2_ks3_acts" / "completion_certificate" / "schedule" / "other" / "not_defined".

        8. advance_present:
           "yes" / "no" / "not_defined".

        9. advance_rate:
           Размер аванса, или "Данные не определены".

        10. price_indexation_present:
            "yes" / "no" / "not_defined".

        11. price_indexation_details:
            Формулировка об индексации или корректировке цены, или "Данные не определены".

        12. price_and_vat_summary:
            Краткая сводка по типу сметы, цене и статусу НДС.
            Примеры: "Твёрдая смета, 120 млн руб. включая НДС 20%." / "Не установлено".

        13. payment_and_advance_summary:
            Краткая сводка по основанию оплаты и авансу.
            Примеры: "Оплата ежемесячно по КС-2/КС-3; аванс 20%." / "Не установлено".

        14. changes_and_indexation_summary:
            Краткая сводка по допработам и индексации.
            Примеры: "Допработы по допсоглашению; индексация по формуле." / "Не установлено".
        </task>

        <context_rules>
        - Перед остальными полями заполни estimate_type_and_change_order_analysis_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все содержательные сигнальные поля = "not_defined", текстовые поля = "Данные не определены", сводные поля (summary) = "Не установлено".
        - Используй только текст договора из <context>.
        - Не подставляй данные из нормативных актов или общих знаний.
        - estimate_type:
          - "firm" — прямо указана твёрдая смета или твёрдая цена.
          - "approximate" — прямо указана приблизительная смета или приблизительная цена.
          - "not_specified" — смета/цена есть, но тип не назван.
          - "not_defined" — смета/цена не указаны.
        - price_includes_vat:
          - "yes" — цена включает НДС.
          - "no" — НДС сверх цены ИЛИ указано «без НДС», «УСН», «НПД».
          - "not_applicable" — сторона освобождена от НДС.
          - "not_defined" — не урегулировано.
        - Запрещено использовать null, None, "N/A" или пустые строки.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет цен, смет, упоминаний НДС или правил оплаты.
           → presence = "missing"; все содержательные статусы = "not_defined"; все текстовые поля = "Данные не определены".

        2. Отсылка на спецификацию/приложение.
           "Стоимость и тип сметы определяются Спецификацией №1, являющейся неотъемлемой частью Договора".
           → presence = "present"; contract_price_status = "defined"; contract_price_value = "Определяется согласно Спецификации №1".

        3. Противоречие между фрагментами.
           В одном пункте аванс равен 10%, в другом — "авансирование не предусмотрено".
           → presence = "unclear"; advance_present = "not_defined"; advance_rate = "Не удалось определить".

        4. Прямое исключение индексации.
           "Индексация, корректировка или изменение цены в процессе выполнения работ не допускаются".
           → presence = "present"; price_indexation_present = "no"; price_indexation_details = "Исключено договором".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для estimate_type_and_change_order_analysis_presence используй только: "present", "missing", "unclear".
        - Для статусных полей используй только: "defined", "not_defined".
        - Fallback при отсутствии данных: все текстовые значения → "Данные не определены".
        - Fallback при противоречии или неоднозначности: все текстовые значения → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "estimate_type_and_change_order_analysis_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по смете / цене / расчетам в договоре. Внутреннее агрегатное signal-поле."
          required: true

        - name: "estimate_type"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["firm", "approximate", "not_specified", "not_defined"]
          description: "Тип сметы или цены по договору (твёрдая/приблизительная). Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "contract_price_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания общей цены договора. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "contract_price_value"
          type: "string"
          presentation: "fact"
          label: "Цена договора"
          description: >
            Общая цена договора строительного подряда. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "price_includes_vat"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["yes", "no", "not_applicable", "not_defined"]
          description: "Как договор регулирует НДС в цене (включая УСН/НПД). Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "change_order_procedure"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["described", "referenced", "absent", "not_defined"]
          description: "Описан ли порядок оформления дополнительных работ и изменений. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "additional_works_authorization"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["written_approval", "notification", "unclear", "not_defined"]
          description: "Как авторизуются дополнительные работы (ст. 743 ГК РФ). Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "payment_basis"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["ks2_ks3_acts", "completion_certificate", "schedule", "other", "not_defined"]
          description: "Основание промежуточных или этапных платежей. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "advance_present"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Есть ли условие об авансе. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "advance_rate"
          label: "Размер аванса"
          type: "string"
          presentation: "fact"
          description: >
            Размер аванса в процентах или сумме. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: false

        - name: "price_indexation_present"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Есть ли механизм индексации или корректировки цены. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "price_indexation_details"
          label: "Условия индексации цены"
          type: "string"
          presentation: "fact"
          description: >
            Формулировка об индексации или корректировке цены. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: false

        - name: "price_and_vat_summary"
          type: "string"
          presentation: "fact"
          label: "Цена и НДС"
          description: >
            Краткая сводка по типу сметы, цене договора и статусу НДС. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "payment_and_advance_summary"
          type: "string"
          presentation: "fact"
          label: "Оплата и аванс"
          description: >
            Краткая сводка по основанию оплаты и наличию/размеру аванса. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 3

        - name: "changes_and_indexation_summary"
          type: "string"
          presentation: "fact"
          label: "Допработы и индексация"
          description: >
            Краткая сводка по порядку допработ и механизму индексации цены. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 4

      store_payload: true

  - id: customer_site_and_permits_obligations
    name: "Обязанности Заказчика: участок, разрешения, финансирование и последствия нарушения"
    description: >
      Фактографическая проверка обязанностей Заказчика по предоставлению
      участка / строительной площадки или обеспечению доступа (ст. 747 ГК РФ),
      предоставлению разрешений и исходно-разрешительной документации (ИРД),
      обеспечению финансирования, а также последствий нарушения этих
      обязанностей для сроков и права Подрядчика приостановить работы
      (ст. 719, 328 ГК РФ).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "предоставление земельного участка"
        - "строительная площадка"
        - "доступ на объект"
        - "акт допуска"
        - "разрешение на строительство"
        - "технические условия"
        - "исходно-разрешительная документация"
        - "ИРД"
        - "права на землю"
        - "график финансирования"
        - "обеспечение условий"
        - "приостановление работ"
        - "простой по вине заказчика"
        - "продление срока при нарушении заказчиком"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)заказчик.*предоставляет.*(участок|площадку|разрешение|доступ)"
        - "(?i)право.*пользования.*земельным.*участком"
        - "(?i)при.*нарушении.*заказчиком.*срок.*исполнения.*продлевается"
        - "(?i)подрядчик.*вправе.*приостановить.*работы"
        - "(?i)акт.*допуска.*на.*объект"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор строительного подряда по ст. 747, 719, 328 ГК РФ.
        Проверяется только один вопрос: какие обязанности по подготовке
        строительства и финансированию возложены на Заказчика и какие
        последствия предусмотрены на случай их нарушения.

        Нормативный ориентир:
        - ст. 747 ГК РФ (обязанности Заказчика)
        - ст. 719 ГК РФ (приостановление работ)
        - ст. 328 ГК РФ (встречное исполнение обязательств)

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.
        - Различай «предоставление участка» и «обеспечение доступа» —
          это разные обязательства по российской практике.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Обязан ли Заказчик предоставить участок / строительную площадку
           или обеспечить доступ к объекту (включая акт допуска).
        2. Обязан ли Заказчик предоставить разрешения, технические условия,
           исходно-разрешительную документацию (ИРД), исходные данные
           или иные исходные документы.
        3. Определена ли обязанность Заказчика по финансированию / оплате
           как условие продолжения работ.
        4. Описаны ли последствия нарушения этих обязанностей Заказчиком
           (продление сроков, компенсация простоя, возмещение расходов).
        5. Предусмотрено ли право Подрядчика приостановить работы из-за
           нарушения обязательств Заказчиком.
        6. Сформируй две краткие сводки: (а) обязанности Заказчика,
           (б) последствия нарушения.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined" для статусов
           и "Данные не определены" для текстовых полей.
        4. Не используй "None", "null", "N/A" или пустые строки.
        5. site_provision_obligation = "yes" только если обязанность
           предоставить участок, площадку, доступ или оформить акт допуска
           прямо закреплена за Заказчиком.
        6. permits_and_source_docs_obligation = "yes" только если Заказчик
           прямо обязан предоставить разрешения, техусловия, ИРД, документы
           на землю, исходные данные или иные исходные материалы.
        7. financing_obligation_defined = "yes" только если в тексте прямо
           отражена обязанность Заказчика обеспечить финансирование или оплату
           как часть его строительных обязанностей.
        8. customer_breach_consequences_defined = "yes" только если договор
           прямо предусматривает продление сроков, простой, компенсацию,
           возмещение расходов или иные последствия нарушения Заказчиком.
        9. contractor_suspension_right_due_customer_breach = "yes" только если
           Подрядчик прямо вправе приостановить работы при нарушении
           обязанностей Заказчиком.
        10. «Акт допуска на объект» принимай как эквивалент предоставления
            площадки.
        11. «ИРД» (исходно-разрешительная документация) — общепринятый
            термин в строительной практике, включает техусловия, ТУ на
            подключение, градостроительный план и т.д.
        12. В evidence включай только точные цитаты из текста договора.
        13. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.с 8 ключами.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — данные определены:
        Фрагмент:
        "Заказчик обязуется предоставить Подрядчику строительную площадку
        по акту допуска, документы, подтверждающие право пользования
        земельным участком, разрешение на строительство, технические
        условия и прочую исходно-разрешительную документацию. Заказчик
        также обеспечивает своевременное финансирование работ. В случае
        просрочки предоставления указанных документов срок выполнения
        работ подлежит продлению на период задержки, а Подрядчик вправе
        приостановить работы до устранения нарушения. Расходы Подрядчика,
        связанные с простоем, подлежат возмещению Заказчиком."

        Ответ:
        {
          "site_provision_obligation": "yes",
          "permits_and_source_docs_obligation": "yes",
          "financing_obligation_defined": "yes",
          "customer_breach_consequences_defined": "yes",
          "contractor_suspension_right_due_customer_breach": "yes",
          "customer_obligations_details": "Заказчик обязуется предоставить строительную площадку по акту допуска, документы на земельный участок, разрешение на строительство, технические условия и прочую ИРД, а также обеспечить своевременное финансирование работ.",
          "customer_obligations_summary": "Заказчик предоставляет площадку по акту допуска, разрешение на строительство, ТУ и ИРД; обеспечивает финансирование.",
          "breach_consequences_summary": "При просрочке: продление срока на период задержки; Подрядчик вправе приостановить работы; расходы простоя возмещаются Заказчиком.",
          "evidence": [
            {
              "clause_ref": "п. 2.3",
              "quote": "Заказчик обязуется предоставить Подрядчику строительную площадку по акту допуска, документы, подтверждающие право пользования земельным участком, разрешение на строительство, технические условия и прочую исходно-разрешительную документацию. Заказчик также обеспечивает своевременное финансирование работ."
            },
            {
              "clause_ref": "п. 7.4",
              "quote": "В случае просрочки предоставления указанных документов срок выполнения работ подлежит продлению на период задержки, а Подрядчик вправе приостановить работы до устранения нарушения. Расходы Подрядчика, связанные с простоем, подлежат возмещению Заказчиком."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Заказчик поручает, а Подрядчик принимает на себя обязательство
        выполнить строительные работы."

        Ответ:
        {
          "site_provision_obligation": "not_defined",
          "permits_and_source_docs_obligation": "not_defined",
          "financing_obligation_defined": "not_defined",
          "customer_breach_consequences_defined": "not_defined",
          "contractor_suspension_right_due_customer_breach": "not_defined",
          "customer_obligations_details": "Данные не определены",
          "customer_obligations_summary": "Не установлено",
          "breach_consequences_summary": "Не установлено",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о предоставлении участка, площадки или акта допуска.
        2. Найди прямую цитату о разрешениях, ТУ, ИРД или исходных документах.
        3. Найди прямую цитату о финансировании.
        4. Найди прямую цитату о последствиях нарушения Заказчиком.
        5. Найди прямую цитату о праве Подрядчика приостановить работы.
        6. Если прямой цитаты нет — верни "not_defined" / "Данные не определены".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "site_provision_obligation": "<yes / no / not_defined>",
          "permits_and_source_docs_obligation": "<yes / no / not_defined>",
          "financing_obligation_defined": "<yes / no / not_defined>",
          "customer_breach_consequences_defined": "<yes / no / not_defined>",
          "contractor_suspension_right_due_customer_breach": "<yes / no / not_defined>",
          "customer_obligations_details": "<текст или 'Данные не определены'>",
          "customer_obligations_summary": "<краткая сводка или 'Не установлено'>",
          "breach_consequences_summary": "<краткая сводка или 'Не установлено'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 900

    retrieval:
      retrieval_profile: "scope_of_work_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "предоставление земельного участка строительная площадка доступ на объект акт допуска разрешение на строительство технические условия исходно-разрешительная документация ИРД права на землю график финансирования приостановление работ простой по вине заказчика продление срока"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
      negative_keywords:
        - "КС-2"
        - "КС-3"
        - "гарантийный срок"
        - "скрытые недостатки"
        - "субподряд"
        - "СРО"
      position_bias:
        preferred_range: [0.10, 0.55]
        boost: 0.22
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "price_list"
      preferred_clause_functions:
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.14

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"

      compact_output: false

      presence_signal:
        field: "customer_site_and_permits_obligations_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_max_tokens: 900

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора строительного подряда
        обязанности Заказчика по предоставлению площадки (или обеспечению
        доступа), разрешений, исходно-разрешительной документации (ИРД)
        и финансированию, а также последствия их нарушения.
        Не анализируй предмет договора, смету, сроки как самостоятельную тему,
        гарантию, страхование или экологические обязательства.
        Различай «предоставление участка» и «обеспечение доступа» —
        это разные обязательства.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. customer_site_and_permits_obligations_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (site_provision_obligation, contractor_suspension_right_due_customer_breach,
              permits_and_source_docs_obligation, financing_obligation_defined,
              customer_breach_consequences_defined) ≠ "not_defined";
           - "missing" — если все содержательные поля = "not_defined" (или "no");
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - site_provision_obligation = "not_defined";
           - permits_and_source_docs_obligation = "not_defined";
           - financing_obligation_defined = "not_defined";
           - customer_breach_consequences_defined = "not_defined";
           - contractor_suspension_right_due_customer_breach = "not_defined";
           - customer_obligations_details = "Данные не определены";
           - customer_obligations_summary, breach_consequences_summary = "Не установлено";
           - не выполняй остальные шаги.

        1. site_provision_obligation:
           "yes" / "no" / "not_defined".

        2. permits_and_source_docs_obligation:
           "yes" / "no" / "not_defined".

        3. financing_obligation_defined:
           "yes" / "no" / "not_defined".

        4. customer_breach_consequences_defined:
           "yes" / "no" / "not_defined".

        5. contractor_suspension_right_due_customer_breach:
           "yes" / "no" / "not_defined".

        6. customer_obligations_details:
           Формулировка обязанностей Заказчика, или "Данные не определены".

        7. customer_obligations_summary:
           Краткая сводка по обязанностям Заказчика (участок/доступ, разрешения/ИРД, финансирование).
           Примеры: "Заказчик предоставляет площадку по акту допуска, разрешение, ТУ и ИРД; обеспечивает финансирование." / "Не установлено".

        8. breach_consequences_summary:
           Краткая сводка по последствиям нарушения обязанностей Заказчиком.
           Примеры: "При просрочке: продление срока; Подрядчик вправе приостановить работы; расходы простоя возмещаются." / "Не установлено".
        </task>

        <context_rules>
        - Перед остальными полями заполни customer_site_and_permits_obligations_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все содержательные сигнальные поля = "not_defined", customer_obligations_details = "Данные не определены", сводные поля (summary) = "Не установлено".
        - Используй только текст договора из <context>.
        - Не подставляй данные из нормативных актов или общих знаний.
        - site_provision_obligation:
          - "yes" — Заказчик обязан предоставить участок, площадку, доступ на объект или оформить акт допуска.
          - "no" — договор прямо исключает такую обязанность.
          - "not_defined" — вопрос не урегулирован.
        - «Акт допуска на объект» = предоставление площадки.
        - Запрещено использовать null, None, "N/A" или пустые строки.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни слова об обязанностях Заказчика по площадке, ИРД, ТУ или финансированию.
           → presence = "missing"; все содержательные статусы = "not_defined"; все текстовые поля = "Данные не определены".

        2. Отсылка к внешнему регламенту.
           "Порядок и условия допуска на строительную площадку определяются Регламентом промышленной безопасности (Приложение №5)".
           → presence = "present"; site_provision_obligation = "yes"; customer_obligations_details = "Допуск на площадку — согласно Регламенту (Приложение №5)".

        3. Противоречие между фрагментами.
           В разделе 3 написано: "Заказчик своими силами получает ТУ", а в разделе 5: "ТУ получает Подрядчик за свой счет".
           → presence = "unclear"; permits_and_source_docs_obligation = "not_defined"; customer_obligations_details = "Не удалось определить".

        4. Неполное раскрытие.
           Заказчик предоставляет доступ к объекту, но не обязан сдавать по акту площадку под капитальное строительство.
           → presence = "present"; site_provision_obligation = "yes"; customer_obligations_summary = "Предусмотрено обеспечение доступа к объекту без полноценной передачи площадки".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для customer_site_and_permits_obligations_presence используй только: "present", "missing", "unclear".
        - Для статусных полей используй только: "yes", "no", "not_defined".
        - Fallback при отсутствии данных: все текстовые значения → "Данные не определены".
        - Fallback при противоречии или неоднозначности: все текстовые значения → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "customer_site_and_permits_obligations_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по подготовке строительства Заказчиком. Внутреннее агрегатное signal-поле."
          required: true

        - name: "site_provision_obligation"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Обязан ли Заказчик предоставить участок, строительную площадку или обеспечить доступ. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "permits_and_source_docs_obligation"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Обязан ли Заказчик предоставить разрешения, техусловия, ИРД и исходные документы. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "financing_obligation_defined"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Определена ли обязанность Заказчика по финансированию как условие продолжения работ. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "customer_breach_consequences_defined"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Предусмотрены ли последствия нарушения обязанностей Заказчиком. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "contractor_suspension_right_due_customer_breach"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Есть ли у Подрядчика право приостановить работы из-за нарушения Заказчиком. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "customer_obligations_details"
          label: "Обязанности заказчика по предоставлению площадки"
          type: "string"
          presentation: "fact"
          description: >
            Формулировка обязанностей Заказчика и связанных условий. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: false

        - name: "customer_obligations_summary"
          type: "string"
          presentation: "fact"
          label: "Обязанности Заказчика"
          description: >
            Краткая сводка по обязанностям Заказчика: участок/доступ, разрешения/ИРД, финансирование. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "breach_consequences_summary"
          type: "string"
          presentation: "fact"
          label: "Нарушение обязанностей Заказчика"
          description: >
            Краткая сводка по последствиям нарушения обязанностей Заказчиком. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 2

      store_payload: true

  - id: technical_supervision_rights_check
    name: "Права Заказчика на технический надзор и контроль (ст. 748 ГК РФ)"
    description: >
      Фактографическая проверка объёма прав Заказчика на технический надзор
      и строительный контроль (ст. 748 ГК РФ, ст. 53 ГрК РФ), включая доступ
      на площадку, проверку материалов, упоминание технического инспектора
      или представителя Заказчика, а также правило о невмешательстве в
      оперативно-хозяйственную деятельность Подрядчика.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "право осуществлять контроль"
        - "технический надзор"
        - "авторский надзор"
        - "строительный контроль"
        - "доступ на строительную площадку"
        - "проверка соответствия проекту"
        - "представитель заказчика на объекте"
        - "технический инспектор"
        - "журнал строительного контроля"
        - "невмешательство"
        - "оперативно-хозяйственная деятельность"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)заказчик.*вправе.*осуществлять.*контроль.*и.*надзор"
        - "(?i)технический.*надзор.*осуществляется"
        - "(?i)ст\\.?\\s*748\\s+ГК\\s+РФ"
        - "(?i)невмешательств.*в.*деятельность.*подрядчика"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор строительного подряда по ст. 748 ГК РФ.
        Проверяется только один вопрос: каков объём прав Заказчика
        на технический надзор и контроль за строительством.

        Нормативный ориентир:
        - ст. 748 ГК РФ (контроль и надзор Заказчика)
        - ст. 53 ГрК РФ (строительный контроль)

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.
        - Различай технический надзор Заказчика (ст. 748 ГК РФ) и авторский 
          надзор проектировщика (ст. 53 ГрК РФ). В данном чек-листе 
          фокусируемся на правах Заказчика.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Закреплено ли право Заказчика на технический надзор / контроль.
        2. Есть ли право доступа на строительную площадку для контроля.
        3. Есть ли право на проверку материалов, отбор образцов или иную
           аналогичную контрольную функцию.
        4. Упомянут ли технический заказчик, инженер, представитель Заказчика
           или технический инспектор.
        5. Есть ли правило о том, что надзор не должен вмешиваться
           в оперативно-хозяйственную деятельность Подрядчика.
        6. Сформируй краткую сводку по объёму надзорных прав Заказчика.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined" для статусов
           и "Данные не определены" для текстовых полей.
        4. Не используй "None", "null", "N/A" или пустые строки.
        5. supervision_right_present = "yes" только если технический надзор
           или строительный контроль прямо закреплены за Заказчиком.
        6. supervision_right_present = "partial" если предоставлены только
           отдельные фрагментарные полномочия (например, только доступ).
        7. site_access_right = "yes" только если Заказчик, его представитель
           или инспектор прямо вправе находиться на площадке или посещать объект.
        8. material_sampling_right = "yes" только если прямо допускается
           проверка, отбор или испытание материалов и конструкций.
        9. supervision_non_interference = "yes" только если прямо указано,
           что надзор не вмешивается в оперативно-хозяйственную деятельность
           Подрядчика.
        10. Строительный контроль (СК) в российской практике часто 
            используется как синоним технического надзора Заказчика.
        11. В evidence включай только точные цитаты из текста договора.
        12. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        со всеми 7 ключами.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — данные определены:
        Фрагмент:
        "Заказчик вправе осуществлять технический надзор и строительный контроль
        за ходом и качеством работ, посещать строительную площадку, проверять
        применяемые материалы и требовать представления результатов испытаний.
        Технический надзор осуществляется представителем Заказчика и не должен
        вмешиваться в оперативно-хозяйственную деятельность Подрядчика."

        Ответ:
        {
          "supervision_right_present": "yes",
          "site_access_right": "yes",
          "material_sampling_right": "yes",
          "technical_inspector_mentioned": "yes",
          "supervision_non_interference": "yes",
          "supervision_details": "Заказчик вправе осуществлять технический надзор и строительный контроль, посещать строительную площадку и проверять применяемые материалы.",
          "supervision_summary": "Технадзор и СК закреплены; право доступа на площадку и проверки материалов есть; закреплено правило о невмешательстве.",
          "evidence": [
            {
              "clause_ref": "п. 5.4",
              "quote": "Заказчик вправе осуществлять технический надзор и строительный контроль за ходом и качеством работ, посещать строительную площадку, проверять применяемые материалы... Технический надзор осуществляется представителем Заказчика и не должен вмешиваться в оперативно-хозяйственную деятельность Подрядчика."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Заказчик принимает выполненные работы в порядке, предусмотренном договором."

        Ответ:
        {
          "supervision_right_present": "not_defined",
          "site_access_right": "not_defined",
          "material_sampling_right": "not_defined",
          "technical_inspector_mentioned": "not_defined",
          "supervision_non_interference": "not_defined",
          "supervision_details": "Данные не определены",
          "supervision_summary": "Не установлено",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о техническом надзоре или контроле Заказчика.
        2. Найди прямую цитату о доступе на площадку.
        3. Найди прямую цитату о проверке материалов или испытаниях.
        4. Найди прямую цитату о представителе Заказчика или инспекторе.
        5. Найди прямую цитату о невмешательстве.
        6. Если прямой цитаты нет — верни "not_defined" / "Данные не определены".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "supervision_right_present": "<yes / partial / no / not_defined>",
          "site_access_right": "<yes / no / not_defined>",
          "material_sampling_right": "<yes / no / not_defined>",
          "technical_inspector_mentioned": "<yes / no / not_defined>",
          "supervision_non_interference": "<yes / no / not_defined>",
          "supervision_details": "<текст или 'Данные не определены'>",
          "supervision_summary": "<краткая сводка или 'Не установлено'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 850

    retrieval:
      retrieval_profile: "technical_documentation_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "право осуществлять контроль технический надзор доступ на строительную площадку проверка соответствия проекту представитель заказчика строительный контроль журнал строительного контроля невмешательство"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
      negative_keywords:
        - "КС-2"
        - "КС-3"
        - "гарантийный срок"
        - "неустойка"
        - "аванс"
        - "экология"
      position_bias:
        preferred_range: [0.20, 0.80]
        boost: 0.20
        scope: segment
      context_k: 5
      max_chunks: 6
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "price_list"
      preferred_clause_functions:
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.14

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 550

    extraction:
      enabled: true
      mode: "hybrid"

      compact_output: false

      presence_signal:
        field: "technical_supervision_rights_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_max_tokens: 1000

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора строительного подряда
        сведения о правах Заказчика на технический надзор и строительный контроль.
        Не анализируй объект строительства, смету, сроки, гарантию или страхование.
        Различай технадзор Заказчика и авторский надзор проектировщика.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. technical_supervision_rights_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (supervision_right_present, site_access_right, material_sampling_right,
              technical_inspector_mentioned, supervision_non_interference) ≠ "not_defined";
           - "missing" — если все содержательные поля = "not_defined" (или "no");
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - supervision_right_present = "not_defined";
           - site_access_right = "not_defined";
           - material_sampling_right = "not_defined";
           - technical_inspector_mentioned = "not_defined";
           - supervision_non_interference = "not_defined";
           - supervision_details = "Данные не определены";
           - supervision_summary = "Не установлено";
           - не выполняй остальные шаги.

        1. supervision_right_present:
           "yes" / "partial" / "no" / "not_defined".

        2. site_access_right:
           "yes" / "no" / "not_defined".

        3. material_sampling_right:
           "yes" / "no" / "not_defined".

        4. technical_inspector_mentioned:
           "yes" / "no" / "not_defined".

        5. supervision_non_interference:
           "yes" / "no" / "not_defined".

        6. supervision_details:
           Формулировка об объёме надзорных прав, или "Данные не определены".

        7. supervision_summary:
           Краткая сводка по технадзору.
           Примеры: "Технадзор и СК закреплены; доступ на площадку и проверка материалов разрешены; правило о невмешательстве есть." / "Не установлено".
        </task>

        <context_rules>
        - Перед остальными полями заполни technical_supervision_rights_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все содержательные сигнальные поля = "not_defined", supervision_details = "Данные не определены", supervision_summary = "Не установлено".
        - Используй только текст договора из <context>.
        - Не подставляй данные из нормативных актов или общих знаний.
        - supervision_right_present:
          - "yes" — комплексный СК или технический надзор Заказчика прямо закреплён за ним.
          - "partial" — предоставлены только отдельные разовые/выборочные полномочия (например, только доступ).
          - "no" — договор прямо исключает полномочия надзора.
          - "not_defined" — не урегулировано.
        - Запрещено использовать null, None, "N/A" или пустые строки.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В договоре нет ни упоминания технадзора, ни СК, ни прав доступа на площадку для проверки.
           → presence = "missing"; все содержательные статусы = "not_defined"; все текстовые поля = "Данные не определены".

        2. Минимальный контроль.
           "Заказчик вправе в любое время посещать стройку без вмешательства в деятельность Подрядчика" без упоминания строительного контроля/технадзора.
           → presence = "present"; supervision_right_present = "partial"; site_access_right = "yes".

        3. Противоречие между фрагментами.
           В п. 5 написано: "Представитель Заказчика вправе давать обязательные указания Подрядчику", а в п. 9: "Надзор не вправе вмешиваться в оперативно-хозяйственную деятельность Подрядчика".
           → presence = "unclear"; supervision_non_interference = "not_defined"; supervision_details = "Не удалось определить".

        4. Авторский надзор проектировщика.
           В тексте подробно расписан авторский надзор проектировщика за соблюдением ПД, но права строительного контроля самого Заказчика опущены.
           → presence = "present"; supervision_right_present = "not_defined"; supervision_summary = "Предусмотрен только авторский надзор проектировщика; технадзор Заказчика прямо не урегулирован".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для technical_supervision_rights_presence используй только: "present", "missing", "unclear".
        - Для статусных полей используй только значения из allowed_values.
        - Fallback при отсутствии данных: все текстовые значения → "Данные не определены".
        - Fallback при противоречии или неоднозначности: все текстовые значения → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "technical_supervision_rights_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по техническому надзору / СК в договоре. Внутреннее агрегатное signal-поле."
          required: true

        - name: "supervision_right_present"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "partial", "no", "not_defined"]
          description: "Закреплено ли право Заказчика на технический надзор / контроль. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "site_access_right"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Есть ли право доступа на строительную площадку. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "material_sampling_right"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Есть ли право проверять материалы, конструкции или результаты испытаний. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "technical_inspector_mentioned"
          type: "string"
          presentation: "signal"
          risk_weight: "low"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Упомянут ли технический инспектор, инженер или представитель Заказчика. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "supervision_non_interference"
          type: "string"
          presentation: "signal"
          risk_weight: "low"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Есть ли правило о невмешательстве в деятельность Подрядчика. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "supervision_details"
          label: "Сведения о строительном контроле и технадзоре"
          type: "string"
          presentation: "fact"
          description: >
            Формулировка об объёме прав технического надзора. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: false

        - name: "supervision_summary"
          type: "string"
          presentation: "fact"
          label: "Технический надзор"
          description: >
            Краткая сводка по объёму прав Заказчика на надзор, доступ на площадку и проверку материалов. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 1

      store_payload: true

  - id: warranty_and_hidden_defects_analysis
    name: "Гарантийные обязательства, скрытые недостатки и гарантийное удержание"
    description: >
      Фактографическая проверка гарантийного срока на объект и инженерные сети,
      соответствия минимальному пятилетнему сроку (ст. 756 ГК РФ), порядка работы
      со скрытыми недостатками, срока их устранения и наличия финансового обеспечения
      (гарантийное удержание / депозит).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "гарантийный срок"
        - "скрытые недостатки"
        - "гарантийные обязательства"
        - "ответственность за дефекты"
        - "устранение недостатков"
        - "5 лет"
        - "пять лет"
        - "гарантийный депозит"
        - "гарантийное удержание"
        - "удержание гарантийной суммы"
        - "резервирование средств"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)гарантийный\\s+срок.*(?:5\\s+лет|пять\\s+лет)"
        - "(?i)ст\\.?\\s*(724|756|757)\\s+ГК\\s+РФ"
        - "(?i)скрыт(ые|ых)\\s+недостат"
        - "(?i)гарантийн.*удержани|гарантийн.*депозит"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор строительного подряда по ст. 724, 756, 757 ГК РФ.
        Проверяется только один вопрос: как в договоре урегулированы гарантия,
        скрытые недостатки и гарантийное удержание.

        Нормативный ориентир:
        - ст. 724 ГК РФ (сроки обнаружения недостатков)
        - ст. 756 ГК РФ (предельный срок обнаружения недостатков в строительстве — 5 лет)
        - ст. 757 ГК РФ (ответственность подрядчика за качество)

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не оценивай серьёзность риска, но фиксируй сроки точно.
        - Обрати внимание: гарантийное удержание часто находится в разделе "Цена" или "Порядок расчетов", а сроки гарантии — в разделе "Гарантии качества".

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Какой гарантийный срок установлен на объект в целом.
        2. Какой гарантийный срок установлен на инженерные сети (если выделен).
        3. Соответствует ли общий гарантийный срок пятилетнему ориентиру (ст. 756 ГК РФ).
        4. Описан ли порядок предъявления требований по скрытым недостаткам.
        5. Указан ли срок устранения недостатков.
        6. Есть ли гарантийное удержание / депозит и каков его размер.
        7. Сформируй две сводки: (а) по срокам гарантии, (б) по недостаткам и деньгам.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона вместо текста договора.
        2. Если условие не указано прямо — возвращай "not_defined" для статусов и "Данные не определены" для текстовых полей.
        3. Не используй "None", "null", "N/A" или пустые строки.
        4. warranty_complies_5yr_rule = "yes", если срок составляет 5 лет и более. "no", если срок менее 5 лет (что является риском по ст. 756 ГК РФ).
        5. retention_money_present = "yes", если договор прямо предусматривает удержание части оплаты или депозит до истечения гарантии.
        6. В сводках пиши кратко, фактографично, на русском языке.
        7. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        со всеми 12 ключами.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — все условия раскрыты:
        Фрагмент:
        "Гарантийный срок на объект — 5 лет с даты подписания итогового акта.
        Гарантийный срок на инженерные сети — 3 года. Подрядчик устраняет
        недостатки в течение 30 дней с момента получения уведомления.
        Гарантийное удержание — 5% от цены договора, удерживается до истечения
        гарантийного срока."

        Ответ:
        {
          "warranty_period_general_status": "defined",
          "warranty_period_general_value": "5 лет с даты подписания итогового акта",
          "warranty_period_engineering_status": "defined",
          "warranty_period_engineering_value": "3 года",
          "warranty_complies_5yr_rule": "yes",
          "hidden_defects_procedure": "described",
          "defect_remedy_deadline_status": "defined",
          "defect_remedy_deadline_value": "30 дней с момента получения уведомления",
          "retention_money_present": "yes",
          "retention_amount": "5% от цены договора",
          "warranty_periods_summary": "Объект — 5 лет; инженерные сети — 3 года; 5-летний ориентир соблюдён.",
          "defects_and_retention_summary": "Удержание 5% до истечения гарантии; срок устранения — 30 дней.",
          "evidence": [
            {
              "clause_ref": "п. 11.2",
              "quote": "Гарантийный срок на объект — 5 лет с даты подписания итогового акта."
            }
          ]
        }

        Пример 2 — гарантийные условия не раскрыты:
        Фрагмент:
        "Подрядчик обязуется выполнить работы в срок и сдать их Заказчику."

        Ответ:
        {
          "warranty_period_general_status": "not_defined",
          "warranty_period_general_value": "Данные не определены",
          "warranty_period_engineering_status": "not_defined",
          "warranty_period_engineering_value": "Данные не определены",
          "warranty_complies_5yr_rule": "not_defined",
          "hidden_defects_procedure": "not_defined",
          "defect_remedy_deadline_status": "not_defined",
          "defect_remedy_deadline_value": "Данные не определены",
          "retention_money_present": "not_defined",
          "retention_amount": "Данные не определены",
          "warranty_periods_summary": "Не установлено",
          "defects_and_retention_summary": "Не установлено",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о гарантийном сроке на объект.
        2. Найди прямую цитату о гарантийном сроке на инженерные сети.
        3. Проверь, соответствует ли общий срок пятилетнему ориентиру (ст. 756 ГК РФ).
        4. Найди прямую цитату о порядке предъявления требований по скрытым недостаткам.
        5. Найди прямую цитату о гарантийном удержании и его размере.
        6. Если прямой цитаты нет — верни "not_defined" / "Данные не определены".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "warranty_period_general_status": "<defined / not_defined>",
          "warranty_period_general_value": "<текст или 'Данные не определены'>",
          "warranty_period_engineering_status": "<defined / not_defined>",
          "warranty_period_engineering_value": "<текст или 'Данные не определены'>",
          "warranty_complies_5yr_rule": "<yes / no / not_defined>",
          "hidden_defects_procedure": "<described / implied / absent / not_defined>",
          "defect_remedy_deadline_status": "<defined / not_defined>",
          "defect_remedy_deadline_value": "<текст или 'Данные не определены'>",
          "retention_money_present": "<yes / no / not_defined>",
          "retention_amount": "<текст или 'Данные не определены'>",
          "warranty_periods_summary": "<сводка по срокам>",
          "defects_and_retention_summary": "<сводка по удержанию и дефектам>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 10
      temperature: 0.0
      max_tokens: 1000

    retrieval:
      preferred_clause_functions:
        - obligations
        - procedures
      retrieval_profile: "warranties_check"
      corpus_scope: "primary_segment"
      levels: ["legal_unit", "section"]
      required_kind: "legal_unit"
      retrieval_query: "гарантийный срок на объект и инженерные сети скрытые недостатки устранение дефектов гарантийное удержание 5 лет гарантийный депозит резервирование средств оплата после окончания гарантии"
      boost_keywords:
        - "гарантийное удержание"
        - "гарантийный депозит"
        - "скрытые недостатки"
        - "5 лет"
      preferred_unit_types: ["obligation", "payment_term"]
      excluded_unit_types: ["definition", "technical_fragment"]
      negative_keywords: ["субподряд", "НДС", "СРО", "форс-мажор"]
      position_bias:
        preferred_range: [0.35, 1.0]
        boost: 0.25
        scope: segment
      context_k: 10
      max_chunks: 12
      rerank: true

    enrichment_hints:
      preferred_segment_types: ["contract", "amendment"]
      preferred_clause_functions:
        - "obligations"
        - procedures
      confidence_bonus_on_match: 0.12

    evidence:
      required: true
      min_snippet_length: 50
      max_snippet_length: 700

    extraction:
      enabled: true
      mode: "hybrid"

      compact_output: false

      presence_signal:
        field: "warranty_and_hidden_defects_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_max_tokens: 1400

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки сведения о гарантийных обязательствах, скрытых недостатках и гарантийном удержании.
        Не анализируй общие сроки выполнения работ, страховку или технадзор Заказчика.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. warranty_and_hidden_defects_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (warranty_period_general_status, warranty_period_engineering_status,
              retention_money_present, defect_remedy_deadline_status) ≠ "not_defined";
           - "missing" — если все содержательные поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - warranty_period_general_status = "not_defined";
           - warranty_period_engineering_status = "not_defined";
           - warranty_complies_5yr_rule = "not_defined";
           - hidden_defects_procedure = "not_defined";
           - defect_remedy_deadline_status = "not_defined";
           - retention_money_present = "not_defined";
           - warranty_period_general_value, warranty_period_engineering_value, defect_remedy_deadline_value, retention_amount = "Данные не определены";
           - warranty_periods_summary, defects_and_retention_summary = "Не установлено";
           - не выполняй остальные шаги.

        1. warranty_period_general_status:
           - "defined" — если общий срок прямо указан, иначе "not_defined".

        2. warranty_period_general_value:
           Гарантийный срок на объект в целом, или "Данные не определены".

        3. warranty_period_engineering_status:
           - "defined" — если срок на сети прямо выделен, иначе "not_defined".

        4. warranty_period_engineering_value:
           Гарантийный срок на инженерные сети, или "Данные не определены".

        5. warranty_complies_5yr_rule:
           - "yes" (если срок составляет 5 лет и более);
           - "no" (если срок менее 5 лет);
           - "not_defined" (если срок не указан).

        6. hidden_defects_procedure:
           "described" / "implied" / "absent" / "not_defined".

        7. defect_remedy_deadline_status:
           - "defined" — если срок ремонта прямо указан, иначе "not_defined".

        8. defect_remedy_deadline_value:
           Срок устранения дефектов, или "Данные не определены".

        9. retention_money_present:
           - "yes" (если удержание / депозит предусмотрено), иначе "no" или "not_defined".

        10. retention_amount:
            Размер удержания (например, "5% от цены договора"), или "Данные не определены".

        11. warranty_periods_summary:
            Краткая сводка по всем гарантийным срокам и ст. 756 ГК РФ.
            Примеры: "Объект — 5 лет; инженерные сети — 3 года; 5-летний ориентир соблюдён." / "Не установлено".

        12. defects_and_retention_summary:
            Краткая сводка по дефектам и финансовому удержанию.
            Примеры: "Удержание 5% до истечения гарантии; срок устранения — 30 дней." / "Не установлено".
        </task>

        <context_rules>
        - Перед остальными полями заполни warranty_and_hidden_defects_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все содержательные сигнальные поля = "not_defined", текстовые поля = "Данные не определены", сводные поля (summary) = "Не установлено".
        - Используй только текст договора из <context>.
        - Не подставляй данные из нормативных актов или общих знаний.
        - Гарантийное удержание ищи в финансовых разделах подряда, а сроки гарантии — в разделах о качестве.
        - Запрещено использовать null, None, "N/A" или пустые строки.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни условий гарантии качества, ни удержания обеспечения, ни сроков устранения дефектов.
           → presence = "missing"; все содержательные статусы = "not_defined"; все текстовые поля = "Данные не определены".

        2. Дефекты без явных сроков ремонта.
           Описан порядок уведомления о недостатках, но точный срок их устранения Подрядчиком не определен ("в разумный срок").
           → presence = "present"; defect_remedy_deadline_status = "not_defined"; defect_remedy_deadline_value = "Данные не определены".

        3. Противоречие между фрагментами.
           В одном месте гарантия — 24 месяца, в другом — "5 лет с момента ввода в эксплуатацию".
           → presence = "unclear"; warranty_period_general_status = "not_defined"; warranty_period_general_value = "Не удалось определить".

        4. Прямое исключение гарантийного удержания.
           В договоре прямо указано: "Никакие гарантийные удержания или резервирования денежных средств Заказчиком не производятся".
           → presence = "present"; retention_money_present = "no"; retention_amount = "Исключено договором".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для warranty_and_hidden_defects_presence используй только: "present", "missing", "unclear".
        - Для статусных полей используй только: "defined", "not_defined".
        - Fallback при отсутствии данных: все текстовые значения → "Данные не определены".
        - Fallback при противоречии или неоднозначности: все текстовые значения → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "warranty_and_hidden_defects_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по гарантии и удержаниям в договоре. Внутреннее агрегатное signal-поле."
          required: true

        - name: "warranty_period_general_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          required: true

          description: Внутреннее enum-поле.
        - name: "warranty_period_general_value"
          label: "Общий гарантийный срок"
          type: "string"
          presentation: "fact"
          description: >
            Гарантийный срок на объект в целом. Fallback: "Не установлено" / "Не удалось определить".
          display_in_grid: false
          required: true

        - name: "warranty_period_engineering_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          required: true

          description: Внутреннее enum-поле.
        - name: "warranty_period_engineering_value"
          label: "Гарантийный срок на инженерные системы"
          type: "string"
          presentation: "fact"
          description: >
            Гарантийный срок на инженерные сети. Fallback: "Не установлено" / "Не удалось определить".
          display_in_grid: false
          required: true

        - name: "warranty_complies_5yr_rule"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["yes", "no", "not_defined"]
          display_in_grid: false
          required: true

          description: Внутреннее enum-поле.
        - name: "hidden_defects_procedure"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["described", "implied", "absent", "not_defined"]
          display_in_grid: false
          required: true

          description: Внутреннее enum-поле.
        - name: "defect_remedy_deadline_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          required: true

          description: Внутреннее enum-поле.
        - name: "defect_remedy_deadline_value"
          label: "Срок устранения дефектов"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          required: true

          description: >
            Fallback: "Не установлено" / "Не удалось определить".
        - name: "retention_money_present"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          display_in_grid: false
          required: true

          description: Внутреннее enum-поле.
        - name: "retention_amount"
          label: "Размер гарантийного удержания"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          required: true

          description: >
            Fallback: "Не установлено" / "Не удалось определить".
        - name: "warranty_periods_summary"
          type: "string"
          presentation: "fact"
          label: "Сроки гарантии"
          description: >
            Сводка по гарантийным срокам на объект и сети (ст. 756 ГК РФ). Fallback: "Не установлено" / "Не удалось определить".
          display_in_grid: true
          display_priority: 1
          required: true

        - name: "defects_and_retention_summary"
          type: "string"
          presentation: "fact"
          label: "Скрытые недостатки и удержание"
          description: >
            Сводка по порядку устранения дефектов и финансовому удержанию (резерву). Fallback: "Не установлено" / "Не удалось определить".
          display_in_grid: true
          display_priority: 2
          required: true

      store_payload: true

  - id: insurance_construction_risks
    name: "Страхование строительных рисков и распределение рисков случайной гибели"
    description: >
      Фактографическая проверка условий страхования строительно-монтажных рисков (СМР/CAR/EAR),  ответственной за страхование стороны, охвата полиса, а также распределения  риска случайной гибели объекта до итоговой приёмки и влияния промежуточных  актов (КС-2) на переход рисков (ст. 741, 742, 753 ГК РФ).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "страхование строительных рисков"
        - "страхование СМР"
        - "CAR"
        - "EAR"
        - "гражданская ответственность"
        - "страхование объекта строительства"
        - "полис страхования"
        - "страхование от несчастных случаев"
        - "риск случайной гибели"
        - "переход рисков"
        - "до подписания акта"
        - "после приёмки объекта"
        - "акт КС-2"
        - "промежуточная приёмка"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)подрядчик.*обязан.*застраховать"
        - "(?i)страхование.*строительных.*рисков"
        - "(?i)риск.*случайной.*гибели.*переходит.*к.*заказчику"
        - "(?i)ст\\.?\\s*(741|742|753)\\s+ГК\\s+РФ"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе. Анализируется договор строительного подряда (ст. 741, 742, 753 ГК РФ).
        Проверяется: страхование строительных рисков и распределение риска случайной гибели объекта.

        Нормативный ориентир:
        - ст. 741 ГК РФ (распределение рисков между сторонами)
        - ст. 742 ГК РФ (страхование объекта строительства)
        - ст. 753 ГК РФ (сдача и приемка работ; важно: переход риска по промежуточным актам)

        Важно:
        - Установи только то, что прямо есть в тексте. Не используй общие знания, если в тексте нет конкретики.
        - Различай риск случайной гибели (кто несет убытки при пожаре/обрушении) и страхование (кто платит за полис).
        - По ст. 753 ГК РФ подписание промежуточных актов (КС-2) не переносит риск на заказчика, если иное прямо не указано.

        [ЗАДАЧА]
        1. Предусмотрено ли страхование строительных рисков.
        2. Какая сторона обязана застраховать (Подрядчик, Заказчик, обе).
        3. Что страхуется (только объект, только ответственность, всё вместе).
        4. На ком лежит риск случайной гибели до итоговой приёмки объекта.
        5. Переходит ли риск случайной гибели по промежуточным актам (КС-2) или этапам.
        6. Сформируй две сводки: по условиям страхования и по распределению рисков.

        [ПРАВИЛА]
        1. Используй только текст документа. Если условия нет — возвращай "not_defined" для статусов и "Данные не определены" для текста.
        2. Не используй "None", "null", "N/A" или пустые строки.
        3. insurance_responsible_party: если сторона прямо не названа, но обязанность есть — "not_specified".
        4. risk_transfer_on_interim_acts: "yes", только если риск ПРЯМО переходит к Заказчику после КС-2/этапа. Если прямо указано, что не переходит — "no".
        5. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        со всеми 8 ключами.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — страхование и распределение рисков раскрыты:
        Фрагмент:
        "Подрядчик обязан застраховать объект строительства и ответственность
        за причинение вреда третьим лицам на весь период работ. Риск случайной
        гибели объекта до подписания итогового акта приёмки несёт Подрядчик.
        Подписание промежуточных актов КС-2 не переносит риск на Заказчика."

        Ответ:
        {
          "insurance_present": "yes",
          "insurance_responsible_party": "contractor",
          "insurance_scope": "mixed",
          "risk_bearer_before_acceptance": "contractor",
          "risk_transfer_on_interim_acts": "no",
          "insurance_summary": "Страхование объекта и ответственности — на Подрядчике.",
          "risk_allocation_summary": "Риск случайной гибели до итоговой приёмки — на Подрядчике; КС-2 риск не переносит.",
          "insurance_and_risk_details": "Подрядчик страхует объект и ответственность; риск гибели до итогового акта — на Подрядчике; промежуточные акты риск не переносят.",
          "evidence": [
            {
              "clause_ref": "п. 7.4",
              "quote": "Подрядчик обязан застраховать объект строительства и ответственность за причинение вреда третьим лицам на весь период работ."
            }
          ]
        }

        Пример 2 — страхование и риски не урегулированы:
        Фрагмент:
        "Стороны приступают к исполнению договора с даты его подписания."

        Ответ:
        {
          "insurance_present": "not_defined",
          "insurance_responsible_party": "not_defined",
          "insurance_scope": "not_defined",
          "risk_bearer_before_acceptance": "not_defined",
          "risk_transfer_on_interim_acts": "not_defined",
          "insurance_summary": "Не установлено",
          "risk_allocation_summary": "Не установлено",
          "insurance_and_risk_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о страховании строительных рисков.
        2. Определи сторону, обязанную застраховать, — прямо или через формулировку.
        3. Найди прямую цитату о распределении риска случайной гибели.
        4. Проверь, переходит ли риск по промежуточным актам КС-2 — прямо.
        5. Если прямого условия нет — верни "not_defined" / "Данные не определены".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "insurance_present": "<yes / partial / no / not_defined>",
          "insurance_responsible_party": "<contractor / customer / both / not_specified / not_defined>",
          "insurance_scope": "<object_only / liability_only / accidents_only / mixed / not_defined>",
          "risk_bearer_before_acceptance": "<contractor / customer / shared / not_defined>",
          "risk_transfer_on_interim_acts": "<yes / no / not_defined>",
          "insurance_summary": "<краткая сводка: кто страхует и охват>",
          "risk_allocation_summary": "<краткая сводка: риск до приемки и КС-2>",
          "insurance_and_risk_details": "<детальный текст>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 1000

    retrieval:
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      corpus_scope: "primary_segment"
      levels: ["legal_unit", "section"]
      required_kind: "legal_unit"
      retrieval_query: "страхование строительных рисков СМР страхование гражданской ответственности риск случайной гибели объекта переход рисков до приемки акт КС-2 промежуточная приемка"
      retrieval_profile: "insurance_check"
      preferred_unit_types: ["obligation", "general_provision"]
      negative_keywords: ["гарантийный срок", "смета", "индексация", "СРО"]
      position_bias:
        preferred_range: [0.30, 0.95]
        boost: 0.20
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types: ["contract", "amendment"]
      preferred_clause_functions: ["obligations"]
      confidence_bonus_on_match: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"

      compact_output: false

      presence_signal:
        field: "insurance_construction_risks_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_max_tokens: 1100

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки данные о страховании строительных рисков и распределении риска случайной гибели объекта.
        Не анализируй объект строительства, смету, сроки выполнения работ, гарантию или технадзор Заказчика.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. insurance_construction_risks_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (insurance_present, risk_bearer_before_acceptance, risk_transfer_on_interim_acts) ≠ "not_defined";
           - "missing" — если все содержательные поля = "not_defined" (или "no");
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - insurance_present = "not_defined";
           - insurance_responsible_party = "not_defined";
           - insurance_scope = "not_defined";
           - risk_bearer_before_acceptance = "not_defined";
           - risk_transfer_on_interim_acts = "not_defined";
           - insurance_and_risk_details = "Данные не определены";
           - insurance_summary, risk_allocation_summary = "Не установлено";
           - не выполняй остальные шаги.

        1. insurance_present:
           "yes" / "partial" / "no" / "not_defined".

        2. insurance_responsible_party:
           "contractor" / "customer" / "both" / "not_specified" / "not_defined".

        3. insurance_scope:
           "object_only" / "liability_only" / "accidents_only" / "mixed" / "not_defined".

        4. risk_bearer_before_acceptance:
           "contractor" / "customer" / "shared" / "not_defined".

        5. risk_transfer_on_interim_acts:
           "yes" / "no" / "not_defined".

        6. insurance_summary:
           Краткая сводка (кто и что страхует).
           Примеры: "Подрядчик страхует объект и ГО." / "Не установлено".

        7. risk_allocation_summary:
           Краткая сводка (на ком риски и переход по КС-2).
           Примеры: "Риск на Подрядчике до итоговой приемки; по КС-2 не переходит." / "Не установлено".

        8. insurance_and_risk_details:
           Полный текст условий страхования и рисков, или "Данные не определены".
        </task>

        <context_rules>
        - Перед остальными полями заполни insurance_construction_risks_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все содержательные сигнальные поля = "not_defined", insurance_and_risk_details = "Данные не определены", сводные поля (summary) = "Не установлено".
        - Используй только текст договора из <context>.
        - Не подставляй данные из нормативных актов или общих знаний.
        - Если в тексте прямо не указано, что риск переходит к Заказчику по промежуточным актам — ставь "no" (согласно ст. 753 ГК РФ риск не переходит по умолчанию).
        - Запрещено использовать null, None, "N/A" или пустые строки.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни условий страхования строительных рисков, ни положений о риске случайной гибели.
           → presence = "missing"; все содержательные статусы = "not_defined"; все текстовые поля = "Данные не определены".

        2. Промежуточная приёмка этапов.
           "Заказчик несёт риск гибели в отношении принятых им отдельных этапов работ по Договору".
           → presence = "present"; risk_transfer_on_interim_acts = "yes"; risk_allocation_summary = "Риск переходит в отношении принятых этапов работ".

        3. Противоречие между фрагментами.
           В одном месте риск гибели на Подрядчике до полной приёмки, в другом — "риск случайного повреждения лежит на стороне, осуществляющей охрану объекта".
           → presence = "unclear"; risk_bearer_before_acceptance = "not_defined"; insurance_and_risk_details = "Не удалось определить".

        4. Страхование только ГО.
           Договор обязывает Подрядчика застраховать только свою гражданскую ответственность перед третьими лицами, без СМР-рисков самого объекта.
           → presence = "present"; insurance_scope = "liability_only"; insurance_summary = "Страхуется только гражданская ответственность Подрядчика".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для insurance_construction_risks_presence используй только: "present", "missing", "unclear".
        - Для статусных полей используй только значения из allowed_values.
        - Fallback при отсутствии данных: все текстовые значения → "Данные не определены".
        - Fallback при противоречии или неоднозначности: все текстовые значения → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "insurance_construction_risks_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по страхованию / переходу рисков в договоре. Внутреннее агрегатное signal-поле."
          required: true

        - name: "insurance_present"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "partial", "no", "not_defined"]
          display_in_grid: false
          required: true

          description: Внутреннее enum-поле.
        - name: "insurance_responsible_party"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["contractor", "customer", "both", "not_specified", "not_defined"]
          display_in_grid: false
          required: true

          description: Внутреннее enum-поле.
        - name: "insurance_scope"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["object_only", "liability_only", "accidents_only", "mixed", "not_defined"]
          display_in_grid: false
          required: true

          description: Внутреннее enum-поле.
        - name: "risk_bearer_before_acceptance"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["contractor", "customer", "shared", "not_defined"]
          display_in_grid: false
          required: true

          description: Внутреннее enum-поле.
        - name: "risk_transfer_on_interim_acts"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          display_in_grid: false
          required: true

          description: Внутреннее enum-поле.
        - name: "insurance_summary"
          type: "string"
          presentation: "fact"
          label: "Страхование"
          description: >
            Сводка: ответственная сторона и охват страхового полиса. Fallback: "Не установлено" / "Не удалось определить".
          display_in_grid: true
          display_priority: 1
          required: true

        - name: "risk_allocation_summary"
          type: "string"
          presentation: "fact"
          label: "Распределение рисков"
          description: >
            Сводка: на ком риск до приёмки и переход рисков по промежуточным актам (КС-2). Fallback: "Не установлено" / "Не удалось определить".
          display_in_grid: true
          display_priority: 2
          required: true

        - name: "insurance_and_risk_details"
          label: "Условия страхования строительных рисков"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          required: true

          description: >
            Fallback: "Не установлено" / "Не удалось определить".
      store_payload: true

  - id: acceptance_procedure_ks2_ks3
    name: "Порядок приёмки работ: КС-2, КС-3, механизм одностороннего подписания (ст. 753 ГК РФ)"
    description: >
      Фактографическая проверка порядка приёмки результата работ: использование форм КС-2 / КС-3  или УПД, срок для мотивированного отказа, наличие условий об автоматической  приёмке при молчании и права на одностороннее подписание акта (ст. 753 ГК РФ).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "акт выполненных работ"
        - "КС-2"
        - "КС-3"
        - "УПД"
        - "универсальный передаточный документ"
        - "акт сдачи-приёмки"
        - "мотивированный отказ"
        - "одностороннее подписание"
        - "уклонение от приёмки"
        - "считаются принятыми"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)КС-2|форма.*КС-2|акт.*о.*приёмке.*выполненных.*работ"
        - "(?i)КС-3|справк.*о.*стоимости.*выполненных.*работ"
        - "(?i)УПД|универсальный.*передаточный.*документ"
        - "(?i)при.*уклонении.*от.*подписания.*акта"
        - "(?i)мотивированн.*отказ.*в\\s+течение"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор строительного подряда по ст. 753 и 720 ГК РФ.
        Проверяется только один вопрос: порядок документальной приёмки работ, использование форм КС-2 / КС-3 / УПД, сроки отказа и право на односторонний акт.

        Нормативный ориентир:
        - ст. 753 ГК РФ (сдача и приёмка работ, односторонний акт)
        - ст. 720 ГК РФ (приёмка работ заказчиком)

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Юрист будет использовать результат в сравнительной таблице.
        - Учитывай, что в современной практике вместо КС-2/КС-3 может использоваться УПД (Универсальный передаточный документ).

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Используется ли форма КС-2 или УПД для актирования работ.
        2. Используется ли форма КС-3 для подтверждения стоимости.
        3. Срок для направления мотивированного отказа от приёмки.
        4. Наличие условия об автоматической приёмке ("молчание = согласие").
        5. Наличие права на одностороннее подписание акта Подрядчиком (ст. 753 ГК РФ).
        6. Сформируй краткую сводку по порядку приёмки.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если условие не указано прямо — возвращай "not_defined" для статусов и "Данные не определены" для текста.
        3. Не используй "None", "null", "not_defined" или пустые строки в JSON.
        4. auto_acceptance = "yes" только если в тексте прямо сказано: если Заказчик не направил отказ в срок, работы считаются принятыми в полном объеме.
        5. unilateral_signing_allowed = "yes" только если в тексте прямо упомянуто право на односторонний акт при уклонении/отказе другой стороны.
        6. В evidence включай только точные цитаты.
        7. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        со всеми 8 ключами.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — процедура приёмки раскрыта:
        Фрагмент:
        "Приёмка работ оформляется по формам КС-2 и КС-3. Заказчик обязан
        в течение 5 рабочих дней направить мотивированный отказ; при отсутствии
        отказа работы считаются принятыми в полном объёме. При уклонении
        Заказчика Подрядчик вправе подписать акт в одностороннем порядке."

        Ответ:
        {
          "ks2_used": "yes",
          "ks3_used": "yes",
          "motivated_refusal_deadline_status": "defined",
          "motivated_refusal_deadline_value": "5 рабочих дней",
          "auto_acceptance": "yes",
          "unilateral_signing_allowed": "yes",
          "acceptance_summary": "КС-2 и КС-3; отказ — 5 рабочих дней; молчание = приёмка; односторонний акт допускается.",
          "acceptance_docs_details": "Используются КС-2 и КС-3; срок отказа — 5 рабочих дней; при уклонении — односторонний акт.",
          "evidence": [
            {
              "clause_ref": "п. 6.3",
              "quote": "Заказчик обязан в течение 5 рабочих дней направить мотивированный отказ; при отсутствии отказа работы считаются принятыми в полном объёме."
            }
          ]
        }

        Пример 2 — приёмка урегулирована общо:
        Фрагмент:
        "Приёмка выполненных работ осуществляется в порядке, установленном
        действующим законодательством."

        Ответ:
        {
          "ks2_used": "not_defined",
          "ks3_used": "not_defined",
          "motivated_refusal_deadline_status": "not_defined",
          "motivated_refusal_deadline_value": "Данные не определены",
          "auto_acceptance": "not_defined",
          "unilateral_signing_allowed": "not_defined",
          "acceptance_summary": "Не установлено",
          "acceptance_docs_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату об используемых формах КС-2 / КС-3 / УПД.
        2. Найди прямую цитату о сроке направления мотивированного отказа.
        3. Проверь, есть ли условие об автоматической приёмке при молчании Заказчика.
        4. Проверь, есть ли право на одностороннее подписание акта Подрядчиком.
        5. Если прямой цитаты нет — верни "not_defined" / "Данные не определены".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "ks2_used": "<yes / no / not_defined>",
          "ks3_used": "<yes / no / not_defined>",
          "motivated_refusal_deadline_status": "<defined / not_defined>",
          "motivated_refusal_deadline_value": "<текст или 'Данные не определены'>",
          "auto_acceptance": "<yes / no / not_defined>",
          "unilateral_signing_allowed": "<yes / no / not_defined>",
          "acceptance_summary": "<сводка: формы документов, сроки и последствия молчания>",
          "acceptance_docs_details": "<детальный текст>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 850

    retrieval:
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      retrieval_profile: "acceptance_check"
      corpus_scope: "primary_segment"
      levels: ["legal_unit", "section"]
      required_kind: "legal_unit"
      retrieval_query: "акт выполненных работ КС-2 КС-3 УПД акт сдачи приемки мотивированный отказ одностороннее подписание уклонение от приемки в течение рабочих дней"
      preferred_unit_types: ["obligation", "general_provision"]
      negative_keywords: ["гарантийный срок", "скрытые работы", "неустойка", "аванс", "страхование"]
      position_bias:
        preferred_range: [0.30, 0.85]
        boost: 0.20
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types: ["contract", "amendment"]
      preferred_clause_functions: ["obligations", "boilerplate"]
      confidence_bonus_on_match: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"

      compact_output: false

      presence_signal:
        field: "acceptance_procedure_ks2_ks3_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_max_tokens: 1100

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки данные о порядке приёмки строительных работ (КС-2/3, УПД, сроки отказа, односторонние акты).
        Не анализируй объект строительства, смету, гарантийные сроки, страховку или технадзор Заказчика.
        Учитывай УПД как валидную форму приёмки.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. acceptance_procedure_ks2_ks3_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (motivated_refusal_deadline_status, auto_acceptance, unilateral_signing_allowed, ks2_used) ≠ "not_defined";
           - "missing" — если все содержательные поля = "not_defined" (или "no");
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - ks2_used = "not_defined";
           - ks3_used = "not_defined";
           - motivated_refusal_deadline_status = "not_defined";
           - auto_acceptance = "not_defined";
           - unilateral_signing_allowed = "not_defined";
           - motivated_refusal_deadline_value, acceptance_docs_details = "Данные не определены";
           - acceptance_summary = "Не установлено";
           - не выполняй остальные шаги.

        1. ks2_used:
           "yes" (если КС-2 или УПД прямо указаны), "no", "not_defined".

        2. ks3_used:
           "yes" (если КС-3 прямо указана), "no", "not_defined".

        3. motivated_refusal_deadline_status:
           - "defined" — если срок прямо указан, иначе "not_defined".

        4. motivated_refusal_deadline_value:
           Срок направления мотивированного отказа от приёмки, или "Данные не определены".

        5. auto_acceptance:
           "yes" / "no" / "not_defined".

        6. unilateral_signing_allowed:
           "yes" / "no" / "not_defined".

        7. acceptance_summary:
           Краткая сводка по порядку приёмки.
           Примеры: "КС-2 и КС-3; отказ — 5 рабочих дней; молчание = приёмка; односторонний акт допускается." / "Не установлено".

        8. acceptance_docs_details:
           Полный текст условий приёмки, или "Данные не определены".
        </task>

        <context_rules>
        - Перед остальными полями заполни acceptance_procedure_ks2_ks3_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все содержательные сигнальные поля = "not_defined", текстовые поля = "Данные не определены", сводные поля (summary) = "Не установлено".
        - Используй только текст договора из <context>.
        - Не подставляй данные из нормативных актов или общих знаний.
        - Для auto_acceptance ищи фразы "считаются принятыми", "признаются выполненными" при отсутствии возражений в срок.
        - Запрещено использовать null, None, "N/A" или пустые строки.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В договоре нет ни упоминания актов приёмки, ни УПД, ни сроков направления возражений.
           → presence = "missing"; все содержательные статусы = "not_defined"; все текстовые поля = "Данные не определены".

        2. Использование только УПД.
           "Приемка выполненных работ оформляется путем подписания Универсального передаточного документа (УПД)".
           → presence = "present"; ks2_used = "yes"; ks3_used = "no"; acceptance_summary = "Приёмка оформляется только по УПД".

        3. Противоречие между фрагментами.
           В п. 6.1 срок направления возражений — 5 дней, в п. 8.4 — "Заказчик обязан подписать акт или выдать отказ в течение 10 календарных дней".
           → presence = "unclear"; motivated_refusal_deadline_status = "not_defined"; motivated_refusal_deadline_value = "Не удалось определить".

        4. Неполная процедура приёмки.
           Указана обязанность Заказчика принять работы по факту уведомления без раскрытия сроков на отказ и односторонних актов.
           → presence = "present"; motivated_refusal_deadline_status = "not_defined"; unilateral_signing_allowed = "not_defined".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для acceptance_procedure_ks2_ks3_presence используй только: "present", "missing", "unclear".
        - Для статусных полей используй только значения из allowed_values.
        - Fallback при отсутствии данных: все текстовые значения → "Данные не определены".
        - Fallback при противоречии или неоднозначности: все текстовые значения → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "acceptance_procedure_ks2_ks3_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования порядка приёмки работ в договоре. Внутреннее агрегатное signal-поле."
          required: true

        - name: "ks2_used"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["yes", "no", "not_defined"]
          display_in_grid: false
