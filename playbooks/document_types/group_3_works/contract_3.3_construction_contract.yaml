        Пример 1 — данные определены:
        Фрагмент:
        "Заказчик обязан за свой счет выполнить планировку площадки и обеспечить временное подключение электроэнергии. 
        Подрядчик за счет сметы создает временные здания и сооружения (бытовки, ограждение) и обязуется демонтировать их 
