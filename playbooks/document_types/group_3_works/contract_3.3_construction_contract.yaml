  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 9: Порядок приёмки работ, КС-2/КС-3 и одностороннее подписание
  # ──────────────────────────────────────────────────────────────────────────
  - id: acceptance_procedure_ks2_ks3
    name: "Порядок приёмки работ: КС-2, КС-3, механизм одностороннего подписания (ст. 753 ГК РФ)"
    description: >
      Фактографическая проверка использования форм КС-2 / КС-3, порядка
      приёмки результата, срока для мотивированного отказа, автоматической
      приёмки при молчании и права на одностороннее подписание акта.
    triggers: ~
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "акт выполненных работ"
        - "КС-2"
        - "КС-3"
        - "акт сдачи-приёмки"
        - "мотивированный отказ"
        - "одностороннее подписание"
        - "уклонение от приёмки"
