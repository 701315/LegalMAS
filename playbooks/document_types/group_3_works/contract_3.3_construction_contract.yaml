  - id: contractor_warning_obligation
    name: "Обязанность Подрядчика предупредить о непригодности материалов и указаний (ст. 716 ГК РФ)"
    description: >
      Фактографическая проверка обязанности Подрядчика немедленно предупредить  Заказчика о непригодности или недоброкачественности материалов, оборудования  или технической документации, а также о том, что указания Заказчика могут  привести к нарушению обязательных требований, и последствий несообщения  (ст. 716, 743 ГК РФ).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "предупредить заказчика"
        - "непригодность материалов"
        - "недоброкачественность"
        - "непригодность технической документации"
        - "указания заказчика"
        - "немедленное уведомление"
        - "обязанность предупредить"
