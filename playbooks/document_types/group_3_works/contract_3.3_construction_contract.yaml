        5. Если прямой цитаты нет — верни "not_defined" / "Данные не определены" / "Не установлено".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "site_prep_responsibility": "<contractor / customer / not_defined>",
          "temporary_facilities_responsibility": "<contractor / customer / not_defined>",
          "temporary_utilities_responsibility": "<contractor / customer / not_defined>",
          "dismantling_obligation": "<yes / no / not_defined>",
          "site_prep_summary": "<краткая сводка или 'Не установлено'>",
          "site_prep_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
