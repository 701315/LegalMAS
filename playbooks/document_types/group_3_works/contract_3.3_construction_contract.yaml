  - id: contractor_retention_right
    name: "Право Подрядчика на удержание результата работ (ст. 712 ГК РФ)"
    description: >
      Фактографическая проверка наличия у Подрядчика права удерживать результат  работ (объект, документацию) до полной оплаты, а также условий отказа  от этого права или его ограничения (ст. 712 ГК РФ).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "удержание результата"
        - "право удержания"
        - "удерживать объект"
        - "удержание до оплаты"
        - "отказ от права удержания"
        - "передача объекта независимо от оплаты"
        - "ст. 712"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)удержани.*результат|удержани.*объект"
        - "(?i)прав.*удержан"
        - "(?i)отказ.*от.*удержан"
        - "(?i)ст\\.?\\s*712\\s+ГК\\s+РФ"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор строительного подряда по ст. 712 ГК РФ.
        Проверяется только один вопрос: есть ли у Подрядчика право удерживать 
        результат работ до полной оплаты и не отказался ли он от этого права.

        Нормативный ориентир:
        - ст. 712 ГК РФ (право Подрядчика на удержание)

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не оценивай риск, фиксируй условия буквально.
        - По ст. 712 ГК РФ Подрядчик вправе удерживать результат работ до оплаты. 
          В практике часто встречается условие, что Подрядчик обязан передать объект 
          независимо от оплаты — это фактический отказ от права удержания.

        [ЗАДАЧА]
        1. Закреплено ли право Подрядчика на удержание результата работ.
        2. Отказался ли Подрядчик от права удержания (прямо или косвенно).
        3. На что распространяется удержание (объект, документация, оба).
        4. Сформируй краткую сводку.
        5. Извлеки подробную формулировку.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона вместо текста договора.
        2. Если условие не указано прямо — возвращай "not_defined" для статусов и "Данные не определены" для текста.
        3. Не используй "None", "null", "N/A" или пустые строки.
        4. retention_right_waived = "yes" если договор содержит условие о передаче объекта 
           независимо от оплаты или прямой отказ от удержания.
        5. В evidence включай только точные цитаты из текста договора.
        6. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — право удержания сохранено:
        Фрагмент:
        "Подрядчик вправе удерживать результат выполненных работ, включая объект 
        и исполнительную документацию, до момента полной оплаты Заказчиком."

        Ответ:
        {
          "retention_right_defined": "yes",
          "retention_right_waived": "no",
          "retention_scope": "both",
          "retention_summary": "Подрядчик вправе удерживать объект и документацию до полной оплаты.",
          "retention_details": "Подрядчик вправе удерживать результат выполненных работ, включая объект и исполнительную документацию, до момента полной оплаты Заказчиком.",
          "evidence": [
            {
              "clause_ref": "п. 8.7",
              "quote": "Подрядчик вправе удерживать результат выполненных работ, включая объект и исполнительную документацию, до момента полной оплаты Заказчиком."
            }
          ]
        }

        Пример 2 — отказ от удержания:
        Фрагмент:
        "Подрядчик обязан передать объект Заказчику по акту приёмки независимо 
        от наличия задолженности по оплате."

        Ответ:
        {
          "retention_right_defined": "yes",
          "retention_right_waived": "yes",
          "retention_scope": "object",
          "retention_summary": "Подрядчик обязан передать объект независимо от оплаты (фактический отказ от права удержания).",
          "retention_details": "Подрядчик обязан передать объект Заказчику по акту приёмки независимо от наличия задолженности по оплате.",
          "evidence": [
            {
              "clause_ref": "п. 6.5",
              "quote": "Подрядчик обязан передать объект Заказчику по акту приёмки независимо от наличия задолженности по оплате."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о праве удержания.
        2. Найди прямую цитату об отказе от удержания или передаче независимо от оплаты.
        3. Найди прямую цитату о предмете удержания.
        4. Если прямой цитаты нет — верни "not_defined" / "Данные не определены".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "retention_right_defined": "<yes / no / not_defined>",
          "retention_right_waived": "<yes / no / not_defined>",
          "retention_scope": "<object / docs / both / not_defined>",
          "retention_summary": "<краткая сводка>",
          "retention_details": "<подробный текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 850

