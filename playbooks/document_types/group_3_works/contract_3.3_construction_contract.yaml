          "expertise_cost_allocation_defined": "not_defined",
          "dispute_resolution_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о претензионном порядке.
        2. Найди прямую цитату о совместном обследовании.
        3. Найди прямую цитату об экспертизе.
