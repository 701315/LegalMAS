        - pattern: "(?i)акт\\s+(приёмки|приема)\\s+выполненных\\s+работ"
          weight: 0.80
          distinctiveness: high
          context: any
          description: "Акт приёмки — специфичен для подряда, в т.ч. строительного"

        - pattern: "(?i)реконструкци[яи]\\s+.{0,60}(нежилого|нежилой|производственн|административн)"
          weight: 0.85
          distinctiveness: high
          context: any
          description: "Реконструкция нежилого здания — строго строительный контекст"

      medium:
