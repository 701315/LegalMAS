          required: true
          display_in_grid: true
          display_priority: 5

      store_payload: true

  - id: commissioning_and_operating_permit
    name: "Ввод объекта в эксплуатацию и разрешение на ввод (ст. 55 ГрадК РФ)"
    description: >
      Фактографическая проверка порядка ввода объекта в эксплуатацию:  обязанность Подрядчика передать исполнительную документацию,  определение ответственной стороны за получение ЗОС и разрешения на ввод,  а также распределение сопутствующих расходов (ст. 55 ГрК РФ).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "разрешение на ввод в эксплуатацию"
        - "ввод объекта в эксплуатацию"
        - "акт ввода в эксплуатацию"
        - "получение разрешения на ввод"
        - "ЗОС"
        - "заключение о соответствии"
        - "исполнительная документация"
        - "передача объекта"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)разрешени.*на.*ввод.*в\\s+эксплуатацию"
        - "(?i)ст\\.?\\s*55\\s+Градостроительного\\s+кодекса"
        - "(?i)заключени.*о.*соответствии"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор строительного подряда в части административного ввода объекта в эксплуатацию.
        Проверяется только один вопрос: кто отвечает за получение разрешения на ввод, передачу исполнительной документации, ЗОС и связанные с этим обязанности.

        Нормативный ориентир:
        - ст. 55 Градостроительного кодекса РФ (разрешение на ввод объекта в эксплуатацию)
        - ст. 54 Градостроительного кодекса РФ (ЗОС — заключение о соответствии)
        - ст. 753 ГК РФ (сдача и приёмка объекта)

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не оценивай риск, фиксируй условия буквально.
        - Различай ЗОС (заключение госстройнадзора) и разрешение на ввод (выдается уполномоченным органом власти).
        - Обязанность по подготовке исполнительной документации для ввода почти всегда лежит на Подрядчике.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Упомянуто ли разрешение на ввод в эксплуатацию.
        2. Какая сторона отвечает за получение разрешения на ввод (или организацию ввода).
        3. Определена ли передача Подрядчиком исполнительной / технической документации, необходимой для ввода.
        4. Определено ли распределение расходов или обязанностей по обеспечению ввода (например, госпошлины, испытания).
        5. Сформируй краткую сводку по порядку ввода объекта в эксплуатацию.
        6. Извлеки подробную формулировку условий ввода.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона вместо текста договора.
        2. Если условие не указано прямо — возвращай "not_defined" для statuses и "Данные не определены" для текстовых полей.
        3. Не используй "None", "null", "not_defined" или пустые строки в JSON.
        4. commissioning_permit_mentioned = "yes" только если разрешение на ввод прямо упомянуто.
        5. responsible_party_for_commissioning: "contractor" (Подрядчик получает разрешение/ЗОС), "customer" (Заказчик/Застройщик организует ввод), "joint" (обязанности разделены), "not_defined" (не указано).
        6. В сводке (summary) пиши кратко, на русском языке, фиксируя роли сторон и необходимость исполнительной документации.
        7. В evidence включай только точные цитаты из текста договора.
        8. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        со всеми 7 ключами.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — данные определены:
        Фрагмент:
        "Подрядчик подготавливает комплект исполнительной документации и передаёт его Заказчику для получения разрешения на ввод объекта в эксплуатацию. Заказчик организует получение ЗОС и разрешения на ввод. Расходы, связанные с оформлением ввода, несёт Заказчик."

        Ответ:
        {
          "commissioning_permit_mentioned": "yes",
          "responsible_party_for_commissioning": "customer",
          "commissioning_docs_transfer_defined": "yes",
          "commissioning_costs_allocated": "yes",
          "commissioning_summary": "Получение ЗОС и разрешения на ввод организует Заказчик; Подрядчик передает исполнительную документацию; расходы несет Заказчик.",
          "commissioning_details": "Подрядчик передаёт комплект исполнительной документации Заказчику для получения разрешения на ввод; Заказчик организует получение ЗОС и разрешения; расходы несёт Заказчик.",
          "evidence": [
            {
              "clause_ref": "п. 10.4",
              "quote": "Подрядчик подготавливает комплект исполнительной документации и передаёт его Заказчику для получения разрешения на ввод объекта в эксплуатацию. Заказчик организует получение ЗОС и разрешения на ввод. Расходы, связанные с оформлением ввода, несёт Заказчик."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Подрядчик завершает строительные работы и передаёт объект Заказчику по двухстороннему акту."

        Ответ:
        {
          "commissioning_permit_mentioned": "not_defined",
          "responsible_party_for_commissioning": "not_defined",
          "commissioning_docs_transfer_defined": "not_defined",
          "commissioning_costs_allocated": "not_defined",
          "commissioning_summary": "Не установлено",
          "commissioning_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о разрешении на ввод.
        2. Найди прямую цитату о стороне, ответственной за ввод (ЗОС/разрешение).
        3. Найди прямую цитату о передаче исполнительной документации.
        4. Найди прямую цитату о расходах по вводу.
        5. Если прямой цитаты нет — верни "not_defined" / "Данные не определены".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "commissioning_permit_mentioned": "<yes / no / not_defined>",
          "responsible_party_for_commissioning": "<contractor / customer / joint / not_defined>",
          "commissioning_docs_transfer_defined": "<yes / no / not_defined>",
          "commissioning_costs_allocated": "<yes / no / not_defined>",
          "commissioning_summary": "<краткая сводка>",
          "commissioning_details": "<подробный текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 850

