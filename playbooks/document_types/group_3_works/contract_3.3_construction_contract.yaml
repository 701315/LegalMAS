  # ──────────────────────────────────────────────────────────────────────────
  - id: commissioning_and_operating_permit
    name: "Ввод объекта в эксплуатацию и разрешение на ввод (ст. 55 ГрадК РФ)"
    description: >
      Фактографическая проверка упоминания разрешения на ввод в эксплуатацию,
      ответственной стороны, передачи документов для ввода и распределения
      расходов / обязанностей, связанных с вводом объекта.
    triggers: ~
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "разрешение на ввод в эксплуатацию"
        - "ввод объекта в эксплуатацию"
        - "акт ввода в эксплуатацию"
        - "получение разрешения на ввод"
        - "передача объекта"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)разрешени.*на.*ввод.*в\\s+эксплуатацию"
