      llm_max_tokens: 1150

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора строительного подряда
        сведения о смете, цене, НДС, дополнительных работах, основании оплаты,
        авансе и индексации цены.
        Не анализируй объект строительства, сроки, приёмку, гарантию,
        страхование или экологические обязательства.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. estimate_type — "firm" / "approximate" / "not_specified" /
           "not_defined".
        2. contract_price_status — "defined" если цена договора прямо указана,
           иначе "not_defined".
        3. contract_price_value — общая цена договора.
        4. price_includes_vat — "yes" / "no" / "not_applicable" / "not_defined".
        5. change_order_procedure — "described" / "referenced" / "absent" /
           "not_defined".
        6. additional_works_authorization — "written_approval" /
           "notification" / "unclear" / "not_defined".
        7. payment_basis — "ks2_ks3_acts" / "completion_certificate" /
           "schedule" / "other" / "not_defined".
        8. advance_present — "yes" / "no" / "not_defined".
        9. advance_rate — размер аванса.
        10. price_indexation_present — "yes" / "no" / "not_defined".
        11. price_indexation_details — формулировка об индексации
            или корректировке цены.

        Если данные отсутствуют:
        - статус = "not_defined"
        - текст = "Данные не определены"
        </task>

        <rules>
        - Используй только текст договора.
        - estimate_type:
            - "firm" — если прямо указана твёрдая смета или твёрдая цена.
            - "approximate" — если прямо указана приблизительная смета
              или приблизительная цена.
            - "not_specified" — если смета / цена есть, но тип не назван.
            - "not_defined" — если по тексту это не установлено.
        - contract_price_status:
            - "defined" — если цена договора прямо указана.
            - "not_defined" — если цена прямо не указана.
        - price_includes_vat:
            - "yes" — если прямо указано, что цена включает НДС.
            - "no" — если НДС начисляется сверх цены.
            - "not_applicable" — если прямо указано "без НДС" или эквивалентная формулировка.
            - "not_defined" — если по тексту это не установлено.
        - change_order_procedure:
            - "described" — если порядок оформления изменений / дополнительных работ
              описан содержательно.
            - "referenced" — если есть только краткая ссылка на порядок.
            - "absent" — если прямо указано, что специального порядка нет.
            - "not_defined" — если по тексту это не установлено.
        - additional_works_authorization:
            - "written_approval" — если требуется письменное согласование
              или дополнительное соглашение.
            - "notification" — если достаточно уведомления.
            - "unclear" — если тема есть, но порядок авторизации неясен.
            - "not_defined" — если по тексту это не установлено.
        - payment_basis:
            - "ks2_ks3_acts" — если оплата основана на КС-2 / КС-3.
            - "completion_certificate" — если оплата основана на акте приёмки /
              завершения.
            - "schedule" — если оплата основана на графике платежей.
            - "other" — если указан иной механизм.
            - "not_defined" — если это по тексту не установлено.
        - advance_present:
            - "yes" — если аванс или предоплата прямо указаны.
            - "no" — если договор прямо исключает аванс.
            - "not_defined" — если по тексту это не установлено.
        - price_indexation_present:
            - "yes" — если предусмотрены индексация, корректировка или актуализация цены.
            - "no" — если договор прямо исключает такие механизмы.
            - "not_defined" — если по тексту это не установлено.
        - advance_rate и price_indexation_details заполняй только по прямому тексту договора.
        - Верни только JSON.
        </rules>
      fields:
        - name: "estimate_type"
          type: "string"
          presentation: "signal"
          label: "Тип сметы"
          allowed_values: ["firm", "approximate", "not_specified", "not_defined"]
          description: "Тип сметы или цены по договору."
          required: true
          display_in_grid: true
          display_priority: 1
        - name: "contract_price_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания общей цены договора."
          required: true
        - name: "contract_price_value"
          type: "string"
          presentation: "fact"
          label: "Цена договора"
          description: "Общая цена договора строительного подряда."
          required: true
          display_in_grid: true
          display_priority: 2
        - name: "price_includes_vat"
          type: "string"
          presentation: "signal"
          label: "НДС"
          allowed_values: ["yes", "no", "not_applicable", "not_defined"]
          description: "Как договор регулирует НДС в цене."
          required: true
          display_in_grid: true
          display_priority: 3
        - name: "change_order_procedure"
          type: "string"
          presentation: "signal"
          label: "Порядок допработ"
          allowed_values: ["described", "referenced", "absent", "not_defined"]
          description: "Описан ли порядок оформления дополнительных работ и изменений."
          required: true
          display_in_grid: true
          display_priority: 4
        - name: "additional_works_authorization"
          type: "string"
          presentation: "signal"
          label: "Авторизация допработ"
          allowed_values: ["written_approval", "notification", "unclear", "not_defined"]
          description: "Как авторизуются дополнительные работы."
          required: true
          display_in_grid: true
          display_priority: 5
        - name: "payment_basis"
          type: "string"
          presentation: "signal"
          label: "Основание оплаты"
          allowed_values: ["ks2_ks3_acts", "completion_certificate", "schedule", "other", "not_defined"]
          description: "Основание промежуточных или этапных платежей."
          required: true
          display_in_grid: true
          display_priority: 6
        - name: "advance_present"
          type: "string"
          presentation: "signal"
          label: "Аванс"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Есть ли условие об авансе."
          required: true
          display_in_grid: true
          display_priority: 7
        - name: "advance_rate"
          type: "string"
          presentation: "fact"
          label: "Размер аванса"
          description: "Размер аванса в процентах или сумме."
          required: true
          display_in_grid: true
          display_priority: 8
        - name: "price_indexation_present"
          type: "string"
          presentation: "signal"
          label: "Индексация цены"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Есть ли механизм индексации или корректировки цены."
          required: true
          display_in_grid: true
          display_priority: 9
        - name: "price_indexation_details"
          type: "string"
          presentation: "fact"
          label: "Механизм индексации"
          description: "Формулировка об индексации или корректировке цены."
          required: true
          display_in_grid: true
          display_priority: 10
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 5: Обязанности Заказчика — участок, разрешения, финансирование и последствия нарушения
  # ──────────────────────────────────────────────────────────────────────────
  - id: customer_site_and_permits_obligations
    name: "Обязанности Заказчика: участок, разрешения, финансирование и последствия нарушения (ст. 747, 719, 328 ГК РФ)"
    description: >
      Фактографическая проверка обязанностей Заказчика по предоставлению
      участка / площадки, разрешений и исходных документов, обеспечению
      финансирования, а также последствий нарушения этих обязанностей
      для сроков и права Подрядчика приостановить работы.
    triggers: ~
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "предоставление земельного участка"
        - "строительная площадка"
        - "разрешение на строительство"
        - "технические условия"
        - "права на землю"
        - "график финансирования"
        - "обеспечение условий"
        - "приостановление работ"
        - "простой по вине заказчика"
        - "продление срока при нарушении заказчиком"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)заказчик.*предоставляет.*(участок|площадку|разрешение)"
        - "(?i)право.*пользования.*земельным.*участком"
        - "(?i)при.*нарушении.*заказчиком.*срок.*исполнения.*продлевается"
        - "(?i)подрядчик.*вправе.*приостановить.*работы.*при.*неоплате"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор строительного подряда по ст. 747, 719, 328 ГК РФ.
        Проверяется только один вопрос: какие обязанности по подготовке
        строительства и финансированию возложены на Заказчика и какие
        последствия предусмотрены на случай их нарушения.

        Нормативный ориентир:
        - ст. 747 ГК РФ
        - ст. 719 ГК РФ
        - ст. 328 ГК РФ

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Обязан ли Заказчик предоставить участок / строительную площадку.
        2. Обязан ли Заказчик предоставить разрешения, технические условия,
           исходные данные или иные исходные документы.
        3. Определена ли обязанность Заказчика по финансированию / оплате
           как условие продолжения работ.
        4. Описаны ли последствия нарушения этих обязанностей Заказчиком.
        5. Предусмотрено ли право Подрядчика приостановить работы из-за
           нарушения обязательств Заказчиком.
        6. Как именно сформулированы обязанности Заказчика.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined".
        4. Если текстового значения нет — возвращай "Данные не определены".
        5. Не используй "None", "null", "not_found" или пустые строки.
        6. site_provision_obligation = "yes" только если обязанность
           предоставить участок, площадку или доступ прямо закреплена.
        7. permits_and_source_docs_obligation = "yes" только если Заказчик
           прямо обязан предоставить разрешения, техусловия, документы,
           исходные данные или иные исходные материалы.
        8. financing_obligation_defined = "yes" только если в тексте прямо
           отражена обязанность Заказчика обеспечить финансирование или оплату
           как часть его строительных обязанностей.
        9. customer_breach_consequences_defined = "yes" только если договор
           прямо предусматривает продление сроков, простой, компенсацию,
           приостановку или иные последствия нарушения Заказчиком.
        10. contractor_suspension_right_due_customer_breach = "yes" только если
            Подрядчик прямо вправе приостановить работы при нарушении
            обязанностей Заказчиком.
        11. В evidence включай только текст договора.
        12. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — данные определены:
        Фрагмент:
        "Заказчик обязуется предоставить Подрядчику строительную площадку,
        документы, подтверждающие право пользования земельным участком,
        разрешение на строительство и технические условия. Заказчик также
        обеспечивает своевременное финансирование работ. В случае просрочки
        предоставления указанных документов срок выполнения работ подлежит
        продлению, а Подрядчик вправе приостановить работы до устранения
        нарушения."

        Ответ:
        {
          "site_provision_obligation": "yes",
          "permits_and_source_docs_obligation": "yes",
          "financing_obligation_defined": "yes",
          "customer_breach_consequences_defined": "yes",
          "contractor_suspension_right_due_customer_breach": "yes",
          "customer_obligations_details": "Заказчик обязуется предоставить строительную площадку, документы на земельный участок, разрешение на строительство и технические условия, а также обеспечить своевременное финансирование работ.",
          "evidence": [
            {
              "clause_ref": "п. 2.3",
              "quote": "Заказчик обязуется предоставить Подрядчику строительную площадку, документы, подтверждающие право пользования земельным участком, разрешение на строительство и технические условия. Заказчик также обеспечивает своевременное финансирование работ. В случае просрочки предоставления указанных документов срок выполнения работ подлежит продлению, а Подрядчик вправе приостановить работы..."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Заказчик поручает, а Подрядчик принимает на себя обязательство
        выполнить строительные работы."

        Ответ:
        {
          "site_provision_obligation": "not_defined",
          "permits_and_source_docs_obligation": "not_defined",
          "financing_obligation_defined": "not_defined",
          "customer_breach_consequences_defined": "not_defined",
          "contractor_suspension_right_due_customer_breach": "not_defined",
          "customer_obligations_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
