        - "(?i)претензионный\\s+порядок"
        - "(?i)строительно.техническ.*экспертиз"
        - "(?i)совместное\\s+обследование"
        - "(?i)односторонн.*акт.*осмотр"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор строительного подряда в части досудебного урегулирования споров 
        и строительно-технической экспертизы.
        Проверяется только один вопрос: предусмотрены ли претензионный порядок, 
        совместное обследование, техническая экспертиза и распределение расходов на неё.

        Нормативный ориентир:
        - ст. 720 ГК РФ (немедленное уведомление о недостатках и совместное обследование)
        - ст. 755 ГК РФ (строительно-техническая экспертиза при разногласиях)
        - АПК РФ, ГПК РФ (досудебный порядок)

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не оценивай риск, фиксируй условия буквально.
        - Ключевые маркеры для РФ-практики: (1) немедленное письменное уведомление Заказчиком о недостатках, 
          (2) совместное обследование (Подрядчик обязан явиться в указанный срок, иначе составляется односторонний акт), 
          (3) строительно-техническая экспертиза при разногласиях, (4) распределение расходов на экспертизу.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли обязательный претензионный / досудебный порядок.
        2. Есть ли требование о совместном обследовании объекта / результата работ при обнаружении недостатков.
        3. Есть ли упоминание независимой или строительно-технической экспертизы.
        4. Определено ли распределение расходов на экспертизу.
        5. Сформируй краткую сводку по процедурам досудебного урегулирования.
        6. Извлеки подробную формулировку условий.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона вместо текста договора.
        2. Если условие не указано прямо — возвращай "not_defined" для статусов и "Данные не определены" для текста.
        3. Не используй "None", "null", "not_defined" или пустые строки в JSON.
        4. pretrial_claim_required = "yes" только если договор прямо устанавливает обязательный претензионный или досудебный порядок.
        5. joint_inspection_required = "yes" только если прямо предусмотрено совместное обследование, осмотр или совместная фиксация недостатков.
        6. technical_expertise_procedure_defined = "yes" только если прямо урегулированы экспертиза, её назначение или проведение.
        7. expertise_cost_allocation_defined = "yes" только если прямо распределены расходы на экспертизу (например, несет сторона, чьи требования не подтвердились).
        8. В сводке (summary) пиши кратко, на русском языке, фиксируя ключевые procedural mechanics.
        9. В evidence включай только точные цитаты из текста договора.
        10. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        со всеми 7 ключами.

