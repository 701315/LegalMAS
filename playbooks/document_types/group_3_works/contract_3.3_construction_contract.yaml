        - ст. 753 ГК РФ
        - строительные нормы о скрытых работах

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Предусмотрено ли освидетельствование скрытых работ.
        2. Требуется ли такое освидетельствование до закрытия последующими работами.
        3. Требуется ли отдельный акт освидетельствования скрытых работ.
        4. Есть ли указание на журнал производства работ или аналогичную фиксацию.
        5. Как в целом описан порядок оформления скрытых работ.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined".
        4. Если текстового значения нет — возвращай "Данные не определены".
        5. Не используй "None", "null", "not_found" или пустые строки.
        6. hidden_works_certification_present = "yes" только если договор
           прямо предусматривает освидетельствование скрытых работ.
        7. certification_before_covering = "yes" только если договор прямо
           требует проводить освидетельствование до закрытия последующими работами.
        8. hidden_works_act_required = "yes" только если прямо предусмотрен
           отдельный акт освидетельствования скрытых работ.
        9. work_log_reference = "yes" только если журнал работ или аналогичный
           реестр прямо упомянут как часть фиксации.
        10. hidden_works_procedure_details заполняй только по прямому тексту договора.
        11. В evidence включай только текст договора.
        12. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — данные определены:
