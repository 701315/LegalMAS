          "site_prep_details": "Заказчик обязан за свой счет выполнить планировку площадки и обеспечить временное подключение электроэнергии. Подрядчик за счет сметы создает временные здания и сооружения и обязуется демонтировать их и вывезти мусор по окончании работ.",
          "evidence": [
            {
              "clause_ref": "п. 2.4",
              "quote": "Заказчик обязан за свой счет выполнить планировку площадки и обеспечить временное подключение электроэнергии. Подрядчик за счет сметы создает временные здания и сооружения (бытовки, ограждение) и обязуется демонтировать их и вывезти мусор по окончании работ."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Подрядчик обязуется выполнить работы по устройству фундамента в соответствии с проектной документацией."

        Ответ:
        {
          "site_prep_responsibility": "not_defined",
          "temporary_facilities_responsibility": "not_defined",
          "temporary_utilities_responsibility": "not_defined",
          "dismantling_obligation": "not_defined",
          "site_prep_summary": "Не установлено",
          "site_prep_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о подготовке площадки (ограждение, планировка).
        2. Найди прямую цитату о создании ВТиС (бытовки, штабы, дороги).
