  - id: dispute_resolution_technical_expertise
    name: "Досудебный порядок и строительно-техническая экспертиза (ст. 720, 755 ГК РФ)"
    description: >
      Фактографическая проверка наличия обязательного претензионного порядка, 
      совместного обследования при выявлении недостатков (ст. 720 ГК РФ), 
      порядка назначения строительно-технической экспертизы (в т.ч. СРО экспертиз) 
      и распределения расходов на её проведение (ст. 755 ГК РФ).
