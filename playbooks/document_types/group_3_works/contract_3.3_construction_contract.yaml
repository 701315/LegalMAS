  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 6: Технический надзор и строительный контроль
  # ──────────────────────────────────────────────────────────────────────────
  - id: technical_supervision_rights_check
    name: "Права Заказчика на технический надзор и контроль (ст. 748 ГК РФ)"
    description: >
      Фактографическая проверка объёма прав Заказчика на технический надзор,
      доступа на площадку, отбора материалов / образцов, упоминания
      технического инспектора и правила о невмешательстве в деятельность Подрядчика.
    triggers: ~
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "право осуществлять контроль"
        - "технический надзор"
        - "доступ на строительную площадку"
        - "проверка соответствия проекту"
        - "представитель заказчика на объекте"
        - "строительный контроль"
        - "журнал строительного контроля"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)заказчик.*вправе.*осуществлять.*контроль.*и.*надзор"
        - "(?i)технический.*надзор.*осуществляется"
        - "(?i)ст\\.?\\s*748\\s+ГК\\s+РФ"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор строительного подряда по ст. 748 ГК РФ.
        Проверяется только один вопрос: каков объём прав Заказчика
        на технический надзор и контроль за строительством.

        Нормативный ориентир:
        - ст. 748 ГК РФ

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Закреплено ли право Заказчика на технический надзор / контроль.
        2. Есть ли право доступа на строительную площадку.
        3. Есть ли право на проверку материалов, отбор образцов или иную
           аналогичную контрольную функцию.
        4. Упомянут ли технический заказчик, инженер, представитель Заказчика
           или технический инспектор.
        5. Есть ли правило о том, что надзор не должен вмешиваться
           в оперативно-хозяйственную деятельность Подрядчика.
        6. Как в целом описан объём надзорных прав.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined".
        4. Если текстового значения нет — возвращай "Данные не определены".
        5. Не используй "None", "null", "not_found" или пустые строки.
        6. supervision_right_present = "yes" только если технический надзор
           или строительный контроль прямо закреплены.
        7. supervision_right_present = "partial" только если Заказчику
           предоставлены отдельные контрольные полномочия, но объём
           надзора явно ограничен или описан фрагментарно.
        8. site_access_right = "yes" только если Заказчик, его представитель
           или технический инспектор прямо вправе находиться на площадке
           или посещать объект.
        9. material_sampling_right = "yes" только если договор прямо допускает
           проверку, отбор, испытание материалов, конструкций или работ.
        10. supervision_non_interference = "yes" только если прямо указано,
            что надзор не вмешивается в оперативно-хозяйственную деятельность
            Подрядчика.
        11. supervision_details заполняй только по прямому тексту договора.
        12. В evidence включай только текст договора.
        13. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — данные определены:
        Фрагмент:
        "Заказчик вправе осуществлять технический надзор и строительный контроль
        за ходом и качеством работ, посещать строительную площадку, проверять
        применяемые материалы и требовать представления результатов испытаний.
        Технический надзор осуществляется представителем Заказчика и не должен
        вмешиваться в оперативно-хозяйственную деятельность Подрядчика."

        Ответ:
        {
          "supervision_right_present": "yes",
          "site_access_right": "yes",
          "material_sampling_right": "yes",
          "technical_inspector_mentioned": "yes",
          "supervision_non_interference": "yes",
          "supervision_details": "Заказчик вправе осуществлять технический надзор и строительный контроль, посещать строительную площадку и проверять применяемые материалы.",
          "evidence": [
            {
              "clause_ref": "п. 5.4",
              "quote": "Заказчик вправе осуществлять технический надзор и строительный контроль за ходом и качеством работ, посещать строительную площадку, проверять применяемые материалы... Технический надзор осуществляется представителем Заказчика и не должен вмешиваться в оперативно-хозяйственную деятельность Подрядчика."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Заказчик принимает выполненные работы в порядке, предусмотренном договором."

        Ответ:
        {
          "supervision_right_present": "not_defined",
          "site_access_right": "not_defined",
          "material_sampling_right": "not_defined",
          "technical_inspector_mentioned": "not_defined",
          "supervision_non_interference": "not_defined",
          "supervision_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о техническом надзоре или контроле.
        2. Найди прямую цитату о доступе на площадку.
        3. Найди прямую цитату о проверке материалов или испытаниях.
        4. Найди прямую цитату о представителе Заказчика или инспекторе.
        5. Найди прямую цитату о невмешательстве.
        6. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "supervision_right_present": "<yes / partial / no / not_defined>",
          "site_access_right": "<yes / no / not_defined>",
          "material_sampling_right": "<yes / no / not_defined>",
          "technical_inspector_mentioned": "<yes / no / not_defined>",
          "supervision_non_interference": "<yes / no / not_defined>",
          "supervision_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
