    extraction:
      enabled: true
      mode: "hybrid"

      compact_output: false

      presence_signal:
        field: "construction_site_safety_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_max_tokens: 1200

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора строительного подряда
        условия об охране труда и безопасности на строительной площадке: ответственная сторона, 
        СИЗ (средства индивидуальной защиты), инструктаж, уведомление о несчастных случаях, 
        акт-допуск и пропускной режим.
        Не анализируй смету, сроки, гарантию, страхование или экологию.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. construction_site_safety_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (safety_obligations_defined, responsible_party_for_safety,
              incident_notification_duty, ppe_and_instruction_requirements,
              access_control_defined) ≠ "not_defined";
           - "missing" — если все содержательные поля = "not_defined" (или "no");
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - safety_obligations_defined = "not_defined";
           - responsible_party_for_safety = "not_defined";
           - incident_notification_duty = "not_defined";
           - ppe_and_instruction_requirements = "not_defined";
           - access_control_defined = "not_defined";
           - site_safety_details = "Данные не определены";
           - site_safety_summary = "Не установлено";
           - не выполняй остальные шаги.

        1. safety_obligations_defined:
           "yes" / "no" / "not_defined".

        2. responsible_party_for_safety:
           "contractor" / "customer" / "both" / "not_defined".

        3. incident_notification_duty:
           "yes" / "no" / "not_defined".

        4. ppe_and_instruction_requirements:
           "yes" / "no" / "not_defined".

        5. access_control_defined:
           "yes" / "no" / "not_defined".

        6. site_safety_summary:
           Краткая user-facing сводка по режиму безопасности.
           Примеры: "Подрядчик отвечает за охрану труда; обеспечивает СИЗ и инструктаж; уведомляет о несчастных случаях; допуск на площадку по пропускам Заказчика." / "Не установлено".

        7. site_safety_details:
           Подробная формулировка об охране труда и безопасности, или "Данные не определены".
        </task>

        <context_rules>
        - Перед остальными полями заполни construction_site_safety_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все содержательные сигнальные поля = "not_defined", site_safety_details = "Данные не определены", site_safety_summary = "Не установлено".
        - Используй только текст договора из <context>.
        - Не подставляй данные из нормативных актов или общих знаний.
        - safety_obligations_defined:
          - "yes" — если договор прямо закрепляет обязанности по охране труда или безопасности работ.
          - "no" — если договор прямо исключает специальные положения.
          - "not_defined" — условие отсутствует в тексте.
        - responsible_party_for_safety:
          - "contractor" — если безопасность прямо возложена на Подрядчика.
          - "customer" — если безопасность прямо возложена на Заказчика.
          - "both" — если обязанности распределены между сторонами.
          - "not_defined" — сторона прямо не определена.
        - incident_notification_duty:
          - "yes" — если прямо предусмотрено уведомление о несчастных случаях, авариях или инцидентах.
          - "no" — если договор прямо исключает такое уведомление.
          - "not_defined" — вопрос не урегулирован.
        - ppe_and_instruction_requirements:
          - "yes" — если прямо предусмотрены СИЗ, инструктаж, допуски или аналогичные меры безопасности.
          - "no" — если договор прямо исключает такие специальные требования.
          - "not_defined" — вопрос не урегулирован.
        - access_control_defined:
          - "yes" — если прямо упомянуты акт-допуск на производство работ, пропускной режим, допуск по пропускам.
          - "no" — если договор прямо исключает такие процедуры.
          - "not_defined" — вопрос не урегулирован.
        - site_safety_summary:
          - Отрази наличие СИЗ, инструктажа, уведомления о несчастных случаях и пропускного режима (ТК РФ, СП 12-136-2002).
        - Запрещено использовать null, None, "N/A" или пустые строки.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В договоре нет положений об охране труда, СИЗ, инструктаже или пропускном режиме.
           → presence = "missing"; все содержательные статусы = "not_defined"; все текстовые поля = "Данные не определены".

        2. Раздельная ответственность на действующем объекте.
           Заказчик отвечает за общий допуск и пропускной режим на предприятии, Подрядчик — за СИЗ и безопасность своих рабочих в зоне работ.
           → presence = "present"; responsible_party_for_safety = "both"; access_control_defined = "yes"; site_safety_summary = "Раздельная ответственность: Заказчик обеспечивает пропускной режим, Подрядчик — СИЗ и безопасность в рабочей зоне".

        3. Противоречие между фрагментами.
           В разделе 8 сказано: "Подрядчик несет полную ответственность за безопасность всех лиц на площадке", а в приложении: "Заказчик самостоятельно обеспечивает безопасность своих представителей и инспекторов".
           → presence = "unclear"; responsible_party_for_safety = "not_defined"; site_safety_details = "Не удалось определить".

        4. Только общая декларация о соблюдении правил.
           "Подрядчик обязуется соблюдать правила техники безопасности" без раскрытия СИЗ, инструктажей и уведомлений о несчастных случаях.
           → presence = "present"; safety_obligations_defined = "yes"; ppe_and_instruction_requirements = "not_defined"; incident_notification_duty = "not_defined".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для construction_site_safety_presence используй только: "present", "missing", "unclear".
        - Для статусных полей используй только значения из allowed_values.
        - Fallback при отсутствии данных: все текстовые значения → "Данные не определены".
        - Fallback при противоречии или неоднозначности: все текстовые значения → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
