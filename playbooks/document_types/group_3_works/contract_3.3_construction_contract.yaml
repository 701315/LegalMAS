        Важно: ВТиС — это значительные расходы. Фиксируй, заложены ли они в обязанности Подрядчика или Заказчик обязан предоставить готовую площадку.

        [ЗАДАЧА]
        1. Кто обязан выполнить подготовку площадки (ограждение, планировка).
        2. Кто создает ВТиС (бытовки, штабы, временные дороги).
        3. Кто обеспечивает временное подключение к инженерным сетям (вода, электричество).
        4. Есть ли обязанность по демонтажу ВТиС и вывозу мусора после работ.
        5. Сформируй сводку по ВТиС и подготовке.

