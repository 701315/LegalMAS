          display_in_grid: true
          display_priority: 3
        - name: "docs_format_specified"
          type: "string"
          presentation: "signal"
          label: "Формат документов"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Указан ли формат передаваемой документации."
          required: true
          display_in_grid: true
          display_priority: 4
        - name: "ip_docs_details"
          type: "string"
          presentation: "fact"
          label: "Документация и права"
          description: "Формулировка о документации, BIM и правах на них."
          required: true
          display_in_grid: true
          display_priority: 5
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 17: Членство в СРО и допуски
  # ──────────────────────────────────────────────────────────────────────────
  - id: sro_membership_requirement
    name: "Членство в СРО и допуски к строительным работам (ст. 55.8 ГрадК РФ)"
    description: >
      Фактографическая проверка того, упомянуто ли членство в СРО,
      есть ли ссылка на выписку / подтверждающий документ, определён ли
      допуск к видам работ и как в целом сформулирован SRO-статус Подрядчика.
    triggers: ~
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "СРО"
        - "саморегулируемая организация"
        - "свидетельство о допуске"
        - "допуск к строительным работам"
        - "членство в СРО"
        - "выписка из реестра СРО"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(СРО|саморегулируемая\\s+организация)"
        - "(?i)свидетельство.*о.*допуске"
        - "(?i)выписк.*из.*реестр.*СРО"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор строительного подряда в части членства в СРО
        и допуска к строительным работам.
        Проверяется только один вопрос: как договор подтверждает SRO-статус
        Подрядчика и наличие допуска к соответствующим видам работ.

        Нормативный ориентир:
        - ст. 55.8 Градостроительного кодекса РФ
        - 315-ФЗ

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Упомянуто ли членство в СРО.
        2. Есть ли ссылка на выписку из реестра СРО, свидетельство
           или иной подтверждающий документ.
        3. Определены ли виды работ / допуски, на которые распространяется членство.
        4. Как в целом сформулирован SRO-статус Подрядчика.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined".
        4. Если текстового значения нет — возвращай "Данные не определены".
        5. Не используй "None", "null", "not_found" или пустые строки.
        6. sro_membership_mentioned = "yes" только если членство в СРО
           прямо упомянуто.
        7. sro_proof_document_referenced = "yes" только если прямо указана
           выписка, свидетельство или аналогичный подтверждающий документ.
        8. work_admission_scope_defined = "yes" только если прямо раскрыты
           виды работ / допуски / сфера допуска.
        9. sro_details заполняй только по прямому тексту договора.
        10. В evidence включай только текст договора.
        11. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — данные определены:
        Фрагмент:
        "Подрядчик подтверждает, что является членом саморегулируемой
        организации в области строительства. Подтверждением является
        выписка из реестра членов СРО. Допуск распространяется на работы
        по строительству и реконструкции объектов капитального строительства."

        Ответ:
        {
          "sro_membership_mentioned": "yes",
          "sro_proof_document_referenced": "yes",
          "work_admission_scope_defined": "yes",
          "sro_details": "Подрядчик является членом СРО в области строительства; подтверждением служит выписка из реестра; допуск распространяется на строительство и реконструкцию объектов капитального строительства.",
          "evidence": [
            {
              "clause_ref": "п. 1.5",
              "quote": "Подрядчик подтверждает, что является членом саморегулируемой организации в области строительства. Подтверждением является выписка из реестра членов СРО. Допуск распространяется на работы по строительству и реконструкции объектов капитального строительства."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Подрядчик выполняет строительные работы в соответствии с договором."

        Ответ:
        {
          "sro_membership_mentioned": "not_defined",
          "sro_proof_document_referenced": "not_defined",
          "work_admission_scope_defined": "not_defined",
          "sro_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о членстве в СРО.
        2. Найди прямую цитату о подтверждающем документе.
        3. Найди прямую цитату о видах работ или допусках.
        4. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "sro_membership_mentioned": "<yes / no / not_defined>",
          "sro_proof_document_referenced": "<yes / no / not_defined>",
          "work_admission_scope_defined": "<yes / no / not_defined>",
          "sro_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 620

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "СРО саморегулируемая организация свидетельство о допуске допуск к строительным работам членство в СРО выписка из реестра СРО"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - representations
        - obligations
      negative_keywords:
        - "КС-2"
        - "КС-3"
        - "гарантийный срок"
        - "неустойка"
        - "аванс"
        - "НДС"
      position_bias:
        preferred_range: [0.0, 0.35]
        boost: 0.18
        scope: segment
      context_k: 5
      max_chunks: 6
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "price_list"
      preferred_clause_functions:
        - "representations"
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.14

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 500

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора строительного подряда
        сведения о членстве Подрядчика в СРО и допуске к видам работ.
        Не анализируй смету, сроки, гарантию, страхование или экологию.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. sro_membership_mentioned — "yes" / "no" / "not_defined".
        2. sro_proof_document_referenced — "yes" / "no" / "not_defined".
        3. work_admission_scope_defined — "yes" / "no" / "not_defined".
        4. sro_details — формулировка о членстве в СРО и допуске.

        Если данные отсутствуют:
        - статус = "not_defined"
        - текст = "Данные не определены"
        </task>

        <rules>
        - Используй только текст договора.
        - sro_membership_mentioned:
            - "yes" — если членство в СРО прямо указано.
            - "no" — если договор прямо указывает на отсутствие такого членства.
            - "not_defined" — если по тексту это не установлено.
        - sro_proof_document_referenced:
            - "yes" — если прямо указаны выписка, свидетельство или иной документ.
            - "no" — если договор прямо указывает на отсутствие такого документа.
            - "not_defined" — если по тексту это не установлено.
        - work_admission_scope_defined:
            - "yes" — если прямо раскрыты виды работ, на которые распространяется допуск.
            - "no" — если договор прямо указывает, что такая детализация отсутствует.
            - "not_defined" — если по тексту это не установлено.
        - sro_details заполняй только по прямому тексту договора.
        - Верни только JSON.
        </rules>
      fields:
        - name: "sro_membership_mentioned"
          type: "string"
          presentation: "signal"
          label: "Членство в СРО"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Упомянуто ли членство Подрядчика в СРО."
          required: true
          display_in_grid: true
          display_priority: 1
        - name: "sro_proof_document_referenced"
          type: "string"
          presentation: "signal"
          label: "Подтверждающий документ"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Есть ли ссылка на выписку, свидетельство или иной документ."
          required: true
          display_in_grid: true
          display_priority: 2
        - name: "work_admission_scope_defined"
          type: "string"
          presentation: "signal"
          label: "Объём допуска"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Определены ли виды работ, на которые распространяется допуск."
          required: true
          display_in_grid: true
          display_priority: 3
        - name: "sro_details"
          type: "string"
          presentation: "fact"
          label: "SRO-статус"
          description: "Формулировка о членстве в СРО и допуске."
          required: true
          display_in_grid: true
          display_priority: 4
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 18: Досудебный порядок и техническая экспертиза
  # ──────────────────────────────────────────────────────────────────────────
  - id: dispute_resolution_technical_expertise
    name: "Досудебный порядок и строительно-техническая экспертиза (АПК РФ, ГПК РФ)"
    description: >
      Фактографическая проверка наличия претензионного порядка,
      совместного обследования, независимой / строительно-технической
      экспертизы и распределения расходов на её проведение.
    triggers: ~
    ui_mode: "field_extraction"
    severity: "medium"
    severity_if_pass: "pass"
    severity_if_fail: "medium"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "досудебный порядок"
        - "претензионный порядок"
        - "строительно-техническая экспертиза"
        - "совместное обследование"
        - "независимая экспертиза"
        - "расходы на экспертизу"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)претензионный\\s+порядок"
        - "(?i)строительно.техническ.*экспертиз"
        - "(?i)совместное\\s+обследование"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор строительного подряда в части досудебного
        урегулирования споров и строительно-технической экспертизы.
        Проверяется только один вопрос: предусмотрены ли претензионный порядок,
        совместное обследование, техническая экспертиза и распределение
        расходов на неё.

        Нормативный ориентир:
        - АПК РФ
        - ГПК РФ

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли претензионный / досудебный порядок.
        2. Есть ли требование о совместном обследовании объекта / результата работ.
        3. Есть ли упоминание независимой или строительно-технической экспертизы.
        4. Определено ли распределение расходов на экспертизу.
        5. Как в целом сформулирован порядок досудебного урегулирования.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined".
        4. Если текстового значения нет — возвращай "Данные не определены".
        5. Не используй "None", "null", "not_found" или пустые строки.
        6. pretrial_claim_required = "yes" только если договор прямо
           устанавливает обязательный претензионный или досудебный порядок.
        7. joint_inspection_required = "yes" только если прямо предусмотрено
           совместное обследование, осмотр или совместная фиксация.
        8. technical_expertise_procedure_defined = "yes" только если прямо
           урегулированы экспертиза, её назначение или проведение.
        9. expertise_cost_allocation_defined = "yes" только если прямо
           распределены расходы на экспертизу.
        10. dispute_resolution_details заполняй только по прямому тексту договора.
        11. В evidence включай только текст договора.
        12. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — данные определены:
        Фрагмент:
        "До обращения в суд сторона обязана направить письменную претензию.
        При возникновении спора стороны проводят совместное обследование
        объекта. В случае разногласий назначается независимая
        строительно-техническая экспертиза, расходы на которую несёт
        сторона, требования которой не подтвердились."

        Ответ:
        {
          "pretrial_claim_required": "yes",
          "joint_inspection_required": "yes",
          "technical_expertise_procedure_defined": "yes",
          "expertise_cost_allocation_defined": "yes",
          "dispute_resolution_details": "До обращения в суд стороны соблюдают претензионный порядок, проводят совместное обследование и при необходимости назначают независимую строительно-техническую экспертизу.",
          "evidence": [
            {
              "clause_ref": "п. 12.2",
              "quote": "До обращения в суд сторона обязана направить письменную претензию. При возникновении спора стороны проводят совместное обследование объекта. В случае разногласий назначается независимая строительно-техническая экспертиза, расходы на которую несёт сторона, требования которой не подтвердились."
            }
          ]
