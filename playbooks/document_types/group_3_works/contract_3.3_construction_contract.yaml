      llm_max_tokens: 1200

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора условия о приостановке работ 
        и одностороннем отказе от договора строительного подряда (ст. 717, 719 ГК РФ).
        Не анализируй смету, сроки, гарантию, страхование или экологию.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. suspension_and_termination_specifics_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (suspension_right_restricted, termination_payment_terms, unearned_profit_compensation) ≠ "not_defined";
           - "missing" — если все содержательные поля = "not_defined" (или "no");
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - suspension_right_restricted = "not_defined";
           - termination_payment_terms = "not_defined";
           - unearned_profit_compensation = "not_defined";
           - termination_specifics_details = "Данные не определены";
           - termination_specifics_summary = "Не установлено";
           - не выполняй остальные шаги.

        1. suspension_right_restricted:
           "yes" / "no" / "not_defined".

        2. termination_payment_terms:
           "full_payment" / "partial_payment" / "not_defined".

        3. unearned_profit_compensation:
           "yes" / "no" / "not_defined".

        4. termination_specifics_summary:
           Краткая сводка по приостановке и отказу.
