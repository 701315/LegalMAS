          "hidden_works_act_required": "yes",
          "work_log_reference": "yes",
          "hidden_works_procedure_details": "Скрытые работы подлежат обязательному освидетельствованию до начала последующих работ с составлением отдельного акта и отражением сведений в журнале производства работ.",
          "evidence": [
            {
              "clause_ref": "п. 7.3",
              "quote": "Скрытые работы подлежат обязательному освидетельствованию до начала последующих работ. По результатам освидетельствования составляется акт освидетельствования скрытых работ. Сведения о скрытых работах также отражаются в журнале производства работ."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Подрядчик выполняет работы по устройству фундамента в соответствии
