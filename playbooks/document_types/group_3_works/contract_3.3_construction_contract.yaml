          weight: 0.7
          distinctiveness: medium
          context: any
          description: "Общий термин строительства, встречается и вне подрядных договоров"

        - pattern: "(?i)general\\s+contractor|contractor.{0,20}customer"
          weight: 0.70
          distinctiveness: high
          context: any
          description: "EN-форма: general contractor / contractor+customer — признак EN-версии строительного договора"

        - pattern: "(?i)construction\\s+(work|site|project|agreement)"
          weight: 0.65
          distinctiveness: high
          context: any
          description: "EN-форма строительного контракта"

        - pattern: "(?i)реконструкци[яи]"
