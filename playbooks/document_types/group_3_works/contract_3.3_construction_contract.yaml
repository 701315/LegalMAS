          description: >
            Подробная формулировка о вводе объекта в эксплуатацию. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: false

      store_payload: true

  - id: hidden_works_certification
    name: "Освидетельствование скрытых работ (ст. 753, 754 ГК РФ, СП 48.13330, РД-11-02-2006)"
    description: >
      Фактографическая проверка порядка освидетельствования скрытых работ  и ответственных конструкций: обязательность составления актов АОСР,  запрет закрытия последующими работами без вызова Заказчика, сроки  предварительного уведомления, ведение журнала работ и обязанность  Подрядчика вскрыть конструкции за свой счет при нарушении процедуры.
    triggers:
      any: ["hidden_works_present"]
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "акт освидетельствования скрытых работ"
        - "АОСР"
        - "скрытые работы"
        - "до начала последующих работ"
        - "журнал производства работ"
        - "освидетельствование"
        - "вскрытие за счет подрядчика"
        - "уведомление заказчика"
        - "вызов заказчика на освидетельствование"
        - "РД-11-02-2006"
        - "СП 48.13330"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)скрытые.*работы.*подлежат.*освидетельствованию"
        - "(?i)акт.*освидетельствования.*скрытых.*работ"
        - "(?i)вскрыти.*за\\s+счет\\s+подрядчик"
        - "(?i)уведомит.*заказчик.*за\\s+\\d+\\s+(день|часа|рабочих)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор строительного подряда по ст. 753, 754 ГК РФ, СП 48.13330 и РД-11-02-2006.
        Проверяется только один вопрос: как в договоре урегулированы освидетельствование скрытых работ, 
        сроки уведомления Заказчика и санкция за закрытие без проверки.

        Нормативный ориентир:
        - ст. 753 ГК РФ (сдача и приёмка работ)
        - ст. 754 ГК РФ (ответственность за ненадлежащее качество строительных работ)
        - СП 48.13330.2011 (организация строительства)
        - РД-11-02-2006 (требования к составу и порядку ведения исполнительной документации)

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не оценивай риск, фиксируй условия буквально.
        - Ключевые маркеры для РФ-практики: (1) срок предварительного вызова Заказчика 
          (обычно 24–48 часов или 2–3 рабочих дня), (2) обязанность Подрядчика вскрыть 
          скрытые работы за свой счет при закрытии без АОСР/без вызова Заказчика.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Предусмотрено ли освидетельствование скрытых работ (АОСР).
        2. Требуется ли освидетельствование до закрытия последующими работами.
        3. Требуется ли отдельный акт освидетельствования скрытых работ.
        4. Есть ли указание на журнал производства работ.
        5. Указан ли срок предварительного уведомления / вызова Заказчика.
        6. Предусмотрена ли обязанность Подрядчика вскрыть скрытые работы за свой счет 
           при закрытии без освидетельствования.
        7. Сформируй краткую сводку по порядку освидетельствования скрытых работ.
        8. Извлеки подробную формулировку условий.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона вместо текста договора.
        2. Если условие не указано прямо — возвращай "not_defined" для статусов и "Данные не определены" для текста.
        3. Не используй "None", "null", "not_defined" или пустые строки в JSON.
        4. hidden_works_certification_present = "yes" только если договор прямо предусматривает освидетельствование.
        5. В сводке (summary) пиши кратко, на русском языке, фиксируя срок уведомления и санкцию за вскрытие.
        6. В evidence включай только точные цитаты из текста договора.
        7. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        со всеми 8 ключами.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — данные определены:
        Фрагмент:
        "Скрытые работы подлежат обязательному освидетельствованию до начала последующих работ. 
        Подрядчик обязан уведомить Заказчика за 2 рабочих дня до даты освидетельствования. 
        По результатам составляется акт освидетельствования скрытых работ (АОСР). 
        Сведения отражаются в журнале производства работ. При закрытии скрытых работ без 
        вызова Заказчика Подрядчик обязан по требованию вскрыть конструкции за свой счет."

        Ответ:
        {
          "hidden_works_certification_present": "yes",
          "certification_before_covering": "yes",
          "hidden_works_act_required": "yes",
          "work_log_reference": "yes",
          "advance_notice_period_defined": "yes",
          "uncovering_at_contractor_expense": "yes",
          "hidden_works_summary": "АОСР обязателен до закрытия; уведомление Заказчика за 2 рабочих дня; при закрытии без вызова — вскрытие за счет Подрядчика.",
          "hidden_works_procedure_details": "Скрытые работы подлежат обязательному освидетельствованию до начала последующих работ с составлением АОСР; Подрядчик уведомляет Заказчика за 2 рабочих дня; сведения отражаются в журнале; при закрытии без вызова — вскрытие за счет Подрядчика.",
          "evidence": [
            {
              "clause_ref": "п. 7.3",
              "quote": "Скрытые работы подлежат обязательному освидетельствованию до начала последующих работ. Подрядчик обязан уведомить Заказчика за 2 рабочих дня до даты освидетельствования..."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Подрядчик выполняет работы по устройству фундамента в соответствии с проектной документацией."

        Ответ:
        {
          "hidden_works_certification_present": "not_defined",
          "certification_before_covering": "not_defined",
          "hidden_works_act_required": "not_defined",
          "work_log_reference": "not_defined",
          "advance_notice_period_defined": "not_defined",
          "uncovering_at_contractor_expense": "not_defined",
          "hidden_works_summary": "Не установлено",
          "hidden_works_procedure_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату об освидетельствовании скрытых работ.
        2. Найди прямую цитату о проведении до закрытия последующими работами.
        3. Найди прямую цитату об отдельном акте (АОСР).
        4. Найди прямую цитату о журнале работ.
        5. Найди прямую цитату о сроке уведомления Заказчика.
        6. Найди прямую цитату об обязанности вскрытия за счет Подрядчика.
        7. Если прямой цитаты нет — верни "not_defined" / "Данные не определены".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "hidden_works_certification_present": "<yes / no / not_defined>",
          "certification_before_covering": "<yes / no / not_defined>",
          "hidden_works_act_required": "<yes / no / not_defined>",
          "work_log_reference": "<yes / no / not_defined>",
          "advance_notice_period_defined": "<yes / no / not_defined>",
          "uncovering_at_contractor_expense": "<yes / no / not_defined>",
          "hidden_works_summary": "<краткая сводка>",
          "hidden_works_procedure_details": "<подробный текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 950

    retrieval:
      retrieval_profile: "acceptance_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "акт освидетельствования скрытых работ АОСР скрытые работы до начала последующих работ журнал производства работ освидетельствование уведомление заказчика вскрытие за счет подрядчика РД-11-02-2006"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
      negative_keywords:
        - "КС-2"
        - "КС-3"
        - "неустойка"
        - "аванс"
        - "гарантийный срок"
        - "НДС"
      position_bias:
        preferred_range: [0.30, 0.85]
        boost: 0.18
        scope: segment
      context_k: 5
      max_chunks: 6
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
        - "technical_specification"
      excluded_segment_types:
        - "price_list"
      preferred_clause_functions:
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.14

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"

      compact_output: false

      presence_signal:
        field: "hidden_works_certification_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_max_tokens: 1200

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора строительного подряда
        условия об освидетельствовании скрытых работ (АОСР), сроке уведомления Заказчика
        и обязанности Подрядчика вскрыть конструкции за свой счет при нарушении процедуры.
        Не анализируй смету, сроки, гарантию, страхование или экологию.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. hidden_works_certification_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (hidden_works_certification_present, certification_before_covering,
              hidden_works_act_required, work_log_reference, advance_notice_period_defined,
              uncovering_at_contractor_expense) ≠ "not_defined";
           - "missing" — если все содержательные поля = "not_defined" (или "no");
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - hidden_works_certification_present = "not_defined";
           - certification_before_covering = "not_defined";
           - hidden_works_act_required = "not_defined";
           - work_log_reference = "not_defined";
           - advance_notice_period_defined = "not_defined";
           - uncovering_at_contractor_expense = "not_defined";
           - hidden_works_procedure_details = "Данные не определены";
           - hidden_works_summary = "Не установлено";
           - не выполняй остальные шаги.

        1. hidden_works_certification_present:
           "yes" / "no" / "not_defined".

        2. certification_before_covering:
           "yes" / "no" / "not_defined".

        3. hidden_works_act_required:
           "yes" / "no" / "not_defined".

        4. work_log_reference:
           "yes" / "no" / "not_defined".

        5. advance_notice_period_defined:
           "yes" / "no" / "not_defined".

        6. uncovering_at_contractor_expense:
           "yes" / "no" / "not_defined".

        7. hidden_works_summary:
           Краткая user-facing сводка по процедуре скрытых работ.
           Примеры: "АОСР обязателен до закрытия; уведомление Заказчика за 2 рабочих дня; при закрытии без вызова — вскрытие за счет Подрядчика." / "Не установлено".

        8. hidden_works_procedure_details:
           Подробная формулировка условий освидетельствования, или "Данные не определены".
        </task>

        <context_rules>
        - Перед остальными полями заполни hidden_works_certification_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все содержательные сигнальные поля = "not_defined", hidden_works_procedure_details = "Данные не определены", hidden_works_summary = "Не установлено".
        - Используй только текст договора из <context>.
        - Не подставляй данные из нормативных актов или общих знаний.
        - hidden_works_certification_present:
          - "yes" — если договор прямо предусматривает освидетельствование скрытых работ.
          - "no" — если договор прямо исключает такую процедуру.
          - "not_defined" — условие отсутствует в тексте.
        - certification_before_covering:
          - "yes" — если освидетельствование должно быть проведено до закрытия последующими работами.
          - "no" — если договор прямо допускает иное.
          - "not_defined" — вопрос не урегулирован.
        - hidden_works_act_required:
          - "yes" — если прямо предусмотрен отдельный акт освидетельствования (АОСР).
          - "no" — если акт прямо исключен.
          - "not_defined" — вопрос не урегулирован.
        - work_log_reference:
          - "yes" — если журнал производства работ или аналогичная фиксация прямо упомянуты.
          - "no" — если журнал прямо исключен.
          - "not_defined" — вопрос не урегулирован.
        - advance_notice_period_defined:
          - "yes" — если прямо указан срок предварительного уведомления / вызова Заказчика (например, за 24 часа, 2 рабочих дня).
          - "no" — если срок прямо исключен.
          - "not_defined" — вопрос не урегулирован.
        - uncovering_at_contractor_expense:
          - "yes" — если Подрядчик обязан вскрыть скрытые работы за свой счет при закрытии без освидетельствования / вызова Заказчика.
          - "no" — если обязанность прямо исключена.
          - "not_defined" — вопрос не урегулирован.
        - Запрещено использовать null, None, "N/A" или пустые строки.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В договоре нет ни условий об освидетельствовании скрытых работ, ни упоминания актов АОСР.
           → presence = "missing"; все содержательные статусы = "not_defined"; все текстовые поля = "Данные не определены".

        2. Фиксация только в общем журнале работ.
           Скрытые работы фиксируются записью в общем журнале работ без оформления отдельного акта АОСР.
           → presence = "present"; hidden_works_certification_present = "yes"; hidden_works_act_required = "no"; work_log_reference = "yes".

        3. Противоречие между фрагментами.
           В разделе 7 срок уведомления Заказчика — 24 часа, а в приложении к регламенту контроля — "не менее чем за 3 рабочих дня".
           → presence = "unclear"; advance_notice_period_defined = "not_defined"; hidden_works_procedure_details = "Не удалось определить".

        4. Освидетельствование без права вскрытия.
           Процедура вызова и подписания АОСР подробно описана, но право требования Заказчика о вскрытии конструкций за счёт Подрядчика опущено.
           → presence = "present"; hidden_works_certification_present = "yes"; uncovering_at_contractor_expense = "not_defined".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для hidden_works_certification_presence используй только: "present", "missing", "unclear".
        - Для статусных полей используй только значения из allowed_values.
        - Fallback при отсутствии данных: все текстовые значения → "Данные не определены".
        - Fallback при противоречии или неоднозначности: все текстовые значения → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "hidden_works_certification_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования освидетельствования скрытых работ. Внутреннее агрегатное signal-поле."
          required: true

        - name: "hidden_works_certification_present"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Предусмотрено ли освидетельствование скрытых работ. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "certification_before_covering"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Должно ли освидетельствование проводиться до закрытия последующими работами. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "hidden_works_act_required"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Требуется ли отдельный акт освидетельствования скрытых работ (АОСР). Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "work_log_reference"
          type: "string"
          presentation: "signal"
          risk_weight: "low"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Упомянут ли журнал производства работ или аналогичная фиксация. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "advance_notice_period_defined"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Указан ли срок предварительного уведомления / вызова Заказчика. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "uncovering_at_contractor_expense"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Обязан ли Подрядчик вскрыть скрытые работы за свой счет при нарушении процедуры. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "hidden_works_summary"
          type: "string"
          presentation: "fact"
          label: "Скрытые работы"
          description: >
            Сводка: обязательность АОСР, срок уведомления Заказчика, обязанность вскрытия за счет Подрядчика (ст. 753, 754 ГК РФ, РД-11-02-2006). Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "hidden_works_procedure_details"
          label: "Порядок освидетельствования скрытых работ"
          type: "string"
          presentation: "fact"
          description: >
            Подробная формулировка о порядке освидетельствования скрытых работ. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: false

      store_payload: true

  - id: environmental_obligations_check
    name: "Экологические обязательства: отходы, рекультивация, ОВОС (ФЗ-89, ФЗ-7)"
    description: >
      Фактографическая проверка условий об обращении со строительными отходами  (вывоз, утилизация, лицензии), распределении ответственности за отходы,  рекультивации земель, восстановлении территории и ссылках на экологические  разрешения или требования (ОВОС, ПДВ, СЗЗ).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "строительные отходы"
        - "утилизация отходов"
        - "рекультивация"
        - "экологические требования"
        - "охрана окружающей среды"
        - "ОВОС"
        - "вывоз строительного мусора"
        - "загрязнение территории"
        - "восстановление нарушенных земель"
        - "паспорт отходов"
        - "лицензия на обращение с отходами"
        - "ордер на вывоз грунта"
        - "талоны на утилизацию"
        - "класс опасности отходов"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)утилизац(ия|ии)\\s+отход"
        - "(?i)рекультивац(ия|ии)"
        - "(?i)экологическ(ие|их)\\s+(требован|норм|обязательств)"
        - "(?i)вывоз.*грунт|вывоз.*мусор"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор строительного подряда в части экологических обязательств сторон.
        Проверяется только один вопрос: как договор регулирует обращение с отходами, 
        восстановление территории и экологические разрешения.

        Нормативный ориентир:
        - ФЗ-89 «Об отходах производства и потребления» (лицензирование, паспорта отходов)
        - ФЗ-7 «Об охране окружающей среды» (ОВОС, нормативы воздействия)
        - Земельный кодекс РФ (рекультивация земель)

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не оценивай риск, фиксируй условия буквально.
        - В российской практике критичны: (1) лицензия Подрядчика на обращение с отходами, 
          (2) ордер на вывоз грунта / талоны на утилизацию, (3) рекультивация земель после строительства.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Урегулировано ли обращение со строительными отходами (вывоз, утилизация).
        2. Какая сторона отвечает за вывоз / утилизацию отходов.
        3. Есть ли обязанность восстановить участок, территорию или нарушенные земли (рекультивация).
        4. Есть ли ссылки на экологические разрешения, ОВОС или иные природоохранные требования.
        5. Сформируй краткую сводку по экологическим обязательствам.
        6. Извлеки подробную формулировку условий.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона вместо текста договора.
        2. Если условие не указано прямо — возвращай "not_defined" для статусов и "Данные не определены" для текста.
        3. Не используй "None", "null", "not_defined" или пустые строки в JSON.
        4. waste_management_defined = "yes" только если договор прямо регулирует отходы, их вывоз, утилизацию.
        5. waste_responsibility: "contractor" (Подрядчик), "customer" (Заказчик), "not_specified" (упомянуто, но сторона не названа), "not_defined" (не урегулировано).
        6. В сводке (summary) пиши кратко, на русском языке, фиксируя роль сторон и ключевые эко-требования.
        7. В evidence включай только точные цитаты из текста договора.
        8. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        со всеми 7 ключами.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — данные определены:
        Фрагмент:
        "Подрядчик обязан обеспечить сбор, вывоз и утилизацию строительных отходов в соответствии 
        с экологическими требованиями. По завершении работ Подрядчик обязан восстановить нарушенную 
        территорию. При необходимости стороны обеспечивают соблюдение требований ОВОС и иных 
        природоохранных документов."

        Ответ:
        {
          "waste_management_defined": "yes",
          "waste_responsibility": "contractor",
          "site_restoration_obligation": "yes",
          "environmental_permits_referenced": "yes",
          "environmental_summary": "Отходы вывозит и утилизирует Подрядчик; территория подлежит восстановлению; соблюдаются требования ОВОС.",
          "environmental_details": "Подрядчик обеспечивает сбор, вывоз и утилизацию строительных отходов и восстанавливает нарушенную территорию; соблюдаются требования ОВОС и иных природоохранных документов.",
          "evidence": [
            {
              "clause_ref": "п. 8.5",
              "quote": "Подрядчик обязан обеспечить сбор, вывоз и утилизацию строительных отходов в соответствии с экологическими требованиями. По завершении работ Подрядчик обязан восстановить нарушенную территорию..."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Подрядчик выполняет работы на строительной площадке Заказчика."

        Ответ:
        {
          "waste_management_defined": "not_defined",
          "waste_responsibility": "not_defined",
          "site_restoration_obligation": "not_defined",
          "environmental_permits_referenced": "not_defined",
          "environmental_summary": "Не установлено",
          "environmental_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату об отходах (вывоз, утилизация).
        2. Найди прямую цитату о стороне, отвечающей за отходы.
        3. Найди прямую цитату о восстановлении территории / рекультивации.
        4. Найди прямую цитату об экологических разрешениях или ОВОС.
        5. Если прямой цитаты нет — верни "not_defined" / "Данные не определены".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "waste_management_defined": "<yes / no / not_defined>",
          "waste_responsibility": "<contractor / customer / not_specified / not_defined>",
          "site_restoration_obligation": "<yes / no / not_defined>",
          "environmental_permits_referenced": "<yes / no / not_defined>",
          "environmental_summary": "<краткая сводка>",
          "environmental_details": "<подробный текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 850

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "строительные отходы утилизация отходов рекультивация экологические требования охрана окружающей среды ОВОС вывоз строительного мусора загрязнение территории паспорт отходов лицензия на отходы"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
      negative_keywords:
        - "КС-2"
        - "КС-3"
        - "гарантийный срок"
        - "неустойка"
        - "аванс"
        - "страхование"
      position_bias:
        preferred_range: [0.30, 0.90]
        boost: 0.18
        scope: segment
      context_k: 5
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "price_list"
      preferred_clause_functions:
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.14

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"

      compact_output: false

      presence_signal:
        field: "environmental_obligations_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_max_tokens: 1100

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора строительного подряда
        сведения об экологических обязательствах: обращение со строительными отходами 
        (вывоз, утилизация, лицензии), рекультивация земель, восстановление территории, 
        экологические разрешения (ОВОС, ПДВ, СЗЗ).
        Не анализируй смету, сроки, гарантию, страхование или технадзор.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. environmental_obligations_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (waste_management_defined, waste_responsibility,
              site_restoration_obligation, environmental_permits_referenced) ≠ "not_defined";
           - "missing" — если все содержательные поля = "not_defined" (или "no");
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - waste_management_defined = "not_defined";
           - waste_responsibility = "not_defined";
           - site_restoration_obligation = "not_defined";
           - environmental_permits_referenced = "not_defined";
           - environmental_details = "Данные не определены";
           - environmental_summary = "Не установлено";
           - не выполняй остальные шаги.

        1. waste_management_defined:
           "yes" / "no" / "not_defined".

        2. waste_responsibility:
           "contractor" / "customer" / "not_specified" / "not_defined".

        3. site_restoration_obligation:
           "yes" / "no" / "not_defined".

        4. environmental_permits_referenced:
           "yes" / "no" / "not_defined".

        5. environmental_summary:
           Краткая user-facing сводка по экологическим обязательствам.
           Примеры: "Отходы вывозит и утилизирует Подрядчик; территория подлежит рекультивации." / "Не установлено".

        6. environmental_details:
           Подробная формулировка условий об экологии, или "Данные не определены".
        </task>

        <context_rules>
        - Перед остальными полями заполни environmental_obligations_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все содержательные сигнальные поля = "not_defined", environmental_details = "Данные не определены", environmental_summary = "Не установлено".
        - Используй только текст договора из <context>.
        - Не подставляй данные из нормативных актов или общих знаний.
        - waste_management_defined:
          - "yes" — если договор прямо регулирует отходы, их вывоз, утилизацию или обращение с ними.
          - "no" — если договор прямо исключает специальное регулирование.
          - "not_defined" — условие отсутствует в тексте.
        - waste_responsibility:
          - "contractor" — если ответственность за отходы возложена на Подрядчика.
          - "customer" — если ответственность возложена на Заказчика.
          - "not_specified" — отходы упомянуты, но сторона прямо не определена.
          - "not_defined" — условие отсутствует в тексте.
        - site_restoration_obligation:
          - "yes" — если прямо предусмотрены восстановление территории, рекультивация, уборка или аналогичные действия.
          - "no" — если договор прямо исключает такое обязательство.
          - "not_defined" — вопрос не урегулирован.
        - environmental_permits_referenced:
          - "yes" — если прямо упомянуты ОВОС, разрешения, ПДВ, СЗЗ или иные природоохранные документы.
          - "no" — если договор прямо исключает специальную отсылку.
          - "not_defined" — вопрос не урегулирован.
        - Запрещено использовать null, None, "N/A" или пустые строки.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В договоре нет ни условий об отходах, ни требований о рекультивации, ни ссылок на экологические разрешения.
           → presence = "missing"; все содержательные статусы = "not_defined"; все текстовые поля = "Данные не определены".

        2. Рекультивация земель без упоминания отходов.
           В договоре закреплена обязанность Подрядчика восстановить плодородный слой почвы, но вывоз мусора не упомянут.
           → presence = "present"; site_restoration_obligation = "yes"; waste_management_defined = "not_defined"; environmental_summary = "Предусмотрено восстановление и рекультивация территории".

        3. Противоречие между фрагментами.
           В п. 8 сказано: "Вывоз отходов производит Подрядчик", а в п. 14: "Заказчик обеспечивает талоны и полигон утилизации".
           → presence = "unclear"; waste_responsibility = "not_defined"; environmental_details = "Не удалось определить".

        4. Только вывоз бытового мусора.
           Упомянут только вывоз бытового мусора строителей без требований к промышленным/строительным отходам и паспортизации.
           → presence = "present"; waste_management_defined = "yes"; environmental_summary = "Урегулирован только вывоз бытового мусора".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для environmental_obligations_presence используй только: "present", "missing", "unclear".
        - Для статусных полей используй только значения из allowed_values.
        - Fallback при отсутствии данных: все текстовые значения → "Данные не определены".
        - Fallback при противоречии или неоднозначности: все текстовые значения → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "environmental_obligations_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования экологических обязательств в договоре. Внутреннее агрегатное signal-поле."
          required: true

        - name: "waste_management_defined"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Есть ли условия об обращении со строительными отходами. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "waste_responsibility"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["contractor", "customer", "not_specified", "not_defined"]
          description: "Какая сторона отвечает за вывоз / утилизацию отходов. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "site_restoration_obligation"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Есть ли обязанность восстановить территорию / рекультивировать участок. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "environmental_permits_referenced"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Есть ли ссылки на экологические разрешения, ОВОС или аналогичные требования. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "environmental_summary"
          type: "string"
          presentation: "fact"
          label: "Экологические обязательства"
          description: >
            Сводка: кто отвечает за отходы, рекультивация территории, экологические разрешения (ФЗ-89, ФЗ-7). Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "environmental_details"
          label: "Экологические требования и обращение с отходами"
          type: "string"
          presentation: "fact"
          description: >
            Подробная формулировка об экологических обязательствах сторон. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: false

      store_payload: true

  - id: ip_rights_construction_documentation
    name: "Права на документацию, созданную при строительстве (ст. 1296 ГК РФ)"
    description: >
      Фактографическая проверка передачи исполнительной документации (as-built,  исполнительные чертежи, акты скрытых работ), перехода исключительных прав  на документацию и BIM-модели, форматов передачи файлов (IFC, RVT, DWG, PDF)  и условий перехода прав (обычно после полной оплаты).
    triggers:
      any: ["bim_technology"]
    ui_mode: "field_extraction"
    severity: "medium"
    severity_if_pass: "pass"
    severity_if_fail: "medium"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "исполнительная документация"
        - "as-built"
        - "фактическое исполнение"
        - "исключительные права"
        - "передача документации"
        - "BIM модель"
        - "информационная модель"
        - "авторские права"
        - "исполнительные чертежи"
        - "акты скрытых работ"
        - "РД-11-02-2006"
        - "формат IFC"
        - "формат RVT"
        - "переход прав после оплаты"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)исполнительн(ая|ой)\\s+документаци"
        - "(?i)исключительн(ые|ых)\\s+прав.*документаци"
        - "(?i)BIM|информационн.*модел"
        - "(?i)переход.*прав.*после.*оплат"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор строительного подряда в части прав на исполнительную документацию, 
        BIM-модели и иные созданные при строительстве материалы.
        Проверяется только один вопрос: передаются ли документы Заказчику, кому принадлежат права 
        на них, в каком формате они передаются и есть ли условие о переходе прав после оплаты.

        Нормативный ориентир:
        - ст. 1296 ГК РФ (права на документацию, созданную по заказу)
        - РД-11-02-2006 (состав и порядок ведения исполнительной документации)
        - Постановление Правительства РФ № 331 (применение BIM для госзаказчиков)

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не оценивай риск, фиксируй условия буквально.
        - Ключевые маркеры для РФ-практики: (1) состав исполнительной документации по РД-11-02-2006, 
          (2) BIM-форматы (IFC, RVT, DWG), (3) условие перехода прав после полной оплаты работ.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Передаётся ли исполнительная документация Заказчику (as-built, исполнительные чертежи).
        2. Кому принадлежат исключительные права на документацию / BIM-модель.
        3. Передаётся ли BIM-модель / информационная модель, если она используется.
        4. Указан ли формат передаваемой документации / модели (IFC, RVT, DWG, PDF и т.п.).
        5. Есть ли условие о переходе прав после полной оплаты работ.
        6. Сформируй краткую сводку по документации и правам на неё.
        7. Извлеки подробную формулировку условий.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона вместо текста договора.
        2. Если условие не указано прямо — возвращай "not_defined" для статусов и "Данные не определены" для текста.
        3. Не используй "None", "null", "not_defined" или пустые строки в JSON.
        4. executive_docs_transfer = "yes" только если исполнительная документация прямо подлежит передаче Заказчику.
        5. ip_rights_on_docs: "transferred" (переходят Заказчику), "retained_by_contractor" (сохраняются у Подрядчика), 
           "not_specified" (документация передаётся, но права прямо не урегулированы), "not_defined" (не урегулировано).
        6. В сводке (summary) пиши кратко, на русском языке, фиксируя состав документации, BIM, форматы и условие перехода прав.
        7. В evidence включай только точные цитаты из текста договора.
        8. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        со всеми 8 ключами.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — данные определены:
        Фрагмент:
        "Подрядчик передаёт Заказчику исполнительную документацию в электронном и бумажном виде. 
        Исключительные права на созданную BIM-модель переходят к Заказчику после полной оплаты работ. 
        BIM-модель передаётся в формате IFC и RVT."

        Ответ:
        {
          "executive_docs_transfer": "yes",
          "ip_rights_on_docs": "transferred",
          "bim_model_transfer": "yes",
          "docs_format_specified": "yes",
          "rights_transfer_after_payment": "yes",
          "documentation_and_ip_summary": "Исполнительная документация передаётся в электронном и бумажном виде; BIM-модель в форматах IFC/RVT; права переходят к Заказчику после полной оплаты.",
          "ip_docs_details": "Подрядчик передаёт Заказчику исполнительную документацию в электронном и бумажном виде; исключительные права на BIM-модель переходят к Заказчику после полной оплаты работ; BIM-модель передаётся в формате IFC и RVT.",
          "evidence": [
            {
              "clause_ref": "п. 9.6",
              "quote": "Подрядчик передаёт Заказчику исполнительную документацию в электронном и бумажном виде. Исключительные права на созданную BIM-модель переходят к Заказчику после полной оплаты работ. BIM-модель передаётся в формате IFC и RVT."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Подрядчик обязан представить документацию по завершении работ."

        Ответ:
        {
          "executive_docs_transfer": "not_defined",
          "ip_rights_on_docs": "not_defined",
          "bim_model_transfer": "not_defined",
          "docs_format_specified": "not_defined",
          "rights_transfer_after_payment": "not_defined",
          "documentation_and_ip_summary": "Не установлено",
          "ip_docs_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о передаче исполнительной документации.
        2. Найди прямую цитату о правах на документацию / BIM-модель.
        3. Найди прямую цитату о BIM-модели.
        4. Найди прямую цитату о формате передачи.
        5. Найди прямую цитату об условии перехода прав после оплаты.
        6. Если прямой цитаты нет — верни "not_defined" / "Данные не определены".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "executive_docs_transfer": "<yes / no / not_defined>",
          "ip_rights_on_docs": "<transferred / retained_by_contractor / not_specified / not_defined>",
          "bim_model_transfer": "<yes / no / not_applicable / not_defined>",
          "docs_format_specified": "<yes / no / not_defined>",
          "rights_transfer_after_payment": "<yes / no / not_defined>",
          "documentation_and_ip_summary": "<краткая сводка>",
          "ip_docs_details": "<подробный текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 950

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "исполнительная документация as-built фактическое исполнение исключительные права передача документации BIM модель информационная модель авторские права формат IFC RVT переход прав после оплаты РД-11-02-2006"
      retrieval_profile: "ip_ownership_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - definitions
      negative_keywords:
        - "КС-2"
        - "КС-3"
        - "гарантийный срок"
        - "неустойка"
        - "НДС"
        - "СРО"
      position_bias:
        preferred_range: [0.30, 0.95]
        boost: 0.18
        scope: segment
      context_k: 5
      max_chunks: 6
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
        - "technical_specification"
      excluded_segment_types:
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "definitions"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.14

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"

      compact_output: false

      presence_signal:
        field: "ip_rights_construction_documentation_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_max_tokens: 1200

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора строительного подряда
        условия о передаче исполнительной документации (as-built, исполнительные чертежи),
        BIM-моделей, форматах файлов (IFC, RVT, DWG) и переходе исключительных прав
        на документацию (в т.ч. условие о переходе прав после полной оплаты).
        Не анализируй смету, сроки, гарантию, страхование или экологию.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. ip_rights_construction_documentation_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (executive_docs_transfer, ip_rights_on_docs, bim_model_transfer,
              docs_format_specified, rights_transfer_after_payment) ≠ "not_defined";
           - "missing" — если все содержательные поля = "not_defined" (или "no");
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - executive_docs_transfer = "not_defined";
           - ip_rights_on_docs = "not_defined";
           - bim_model_transfer = "not_defined";
           - docs_format_specified = "not_defined";
           - rights_transfer_after_payment = "not_defined";
           - ip_docs_details = "Данные не определены";
           - documentation_and_ip_summary = "Не установлено";
           - не выполняй остальные шаги.

        1. executive_docs_transfer:
           "yes" / "no" / "not_defined".

        2. ip_rights_on_docs:
           "transferred" / "retained_by_contractor" / "not_specified" / "not_defined".

        3. bim_model_transfer:
           "yes" / "no" / "not_applicable" / "not_defined".

        4. docs_format_specified:
           "yes" / "no" / "not_defined".

        5. rights_transfer_after_payment:
           "yes" / "no" / "not_defined".

        6. documentation_and_ip_summary:
           Краткая user-facing сводка по документации и правам.
           Примеры: "Исполнительная документация передаётся в электронном и бумажном виде; BIM-модель в форматах IFC/RVT; права переходят к Заказчику после полной оплаты." / "Не установлено".

        7. ip_docs_details:
           Подробная формулировка условий о документации и правах, или "Данные не определены".
        </task>

        <context_rules>
        - Перед остальными полями заполни ip_rights_construction_documentation_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все содержательные сигнальные поля = "not_defined", ip_docs_details = "Данные не определены", documentation_and_ip_summary = "Не установлено".
        - Используй только текст договора из <context>.
        - Не подставляй данные из нормативных актов или общих знаний.
        - executive_docs_transfer:
          - "yes" — если исполнительная документация (as-built, чертежи, акты скрытых работ) подлежит передаче Заказчику.
          - "no" — если договор прямо исключает передачу.
          - "not_defined" — условие отсутствует в тексте.
        - ip_rights_on_docs:
          - "transferred" — если права на документацию / BIM-модель прямо переходят Заказчику.
          - "retained_by_contractor" — если права сохраняются за Подрядчиком.
          - "not_specified" — документация передаётся, но права прямо не урегулированы.
          - "not_defined" — условие отсутствует в тексте.
        - bim_model_transfer:
          - "yes" — если BIM-модель подлежит передаче.
          - "no" — если передача прямо исключена.
          - "not_applicable" — если BIM-технологии прямо не применяются по договору.
          - "not_defined" — вопрос не урегулирован.
        - docs_format_specified:
          - "yes" — если указан формат передачи файлов (IFC, RVT, DWG, PDF).
          - "no" — если прямо указано на отсутствие специальных требований к формату.
          - "not_defined" — вопрос не урегулирован.
        - rights_transfer_after_payment:
          - "yes" — если переход прав обусловлен полной оплатой работ.
          - "no" — если договор прямо исключает такое условие.
          - "not_defined" — вопрос не урегулирован.
        - Запрещено использовать null, None, "N/A" или пустые строки.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В договоре нет ни условий о передаче исполнительной документации, ни положений об интеллектуальных правах или BIM.
           → presence = "missing"; все содержательные статусы = "not_defined"; все текстовые поля = "Данные не определены".

        2. Передача документации без передачи исключительных прав.
           Подрядчик передает исполнительную документацию на бумаге, но передача исключительных прав в тексте не оговорена.
           → presence = "present"; executive_docs_transfer = "yes"; ip_rights_on_docs = "not_specified"; documentation_and_ip_summary = "Исполнительная документация передаётся Заказчику; статус исключительных прав прямо не урегулирован".

        3. Противоречие между фрагментами.
           В разделе 9 указано: "Исключительные права переходят в момент передачи чертежей", а в разделе 12: "Права переходят исключительно после 100% оплаты".
           → presence = "unclear"; rights_transfer_after_payment = "not_defined"; ip_docs_details = "Не удалось определить".

        4. Прямое неприменение BIM-технологий.
           В договоре прямо указано, что информационное моделирование (BIM) не осуществляется, передаются только 2D-чертежи.
           → presence = "present"; bim_model_transfer = "not_applicable"; executive_docs_transfer = "yes".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для ip_rights_construction_documentation_presence используй только: "present", "missing", "unclear".
        - Для статусных полей используй только значения из allowed_values.
        - Fallback при отсутствии данных: все текстовые значения → "Данные не определены".
        - Fallback при противоречии или неоднозначности: все текстовые значения → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "ip_rights_construction_documentation_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования прав на исполнительную документацию / BIM в договоре. Внутреннее агрегатное signal-поле."
          required: true

        - name: "executive_docs_transfer"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Передаётся ли исполнительная документация Заказчику. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "ip_rights_on_docs"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["transferred", "retained_by_contractor", "not_specified", "not_defined"]
          description: "Как урегулированы исключительные права на документацию / BIM-модель. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "bim_model_transfer"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["yes", "no", "not_applicable", "not_defined"]
          description: "Передаётся ли BIM / информационная модель. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "docs_format_specified"
          type: "string"
          presentation: "signal"
          risk_weight: "low"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Указан ли формат передаваемой документации / модели (IFC, RVT, DWG, PDF). Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "rights_transfer_after_payment"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Обусловлен ли переход прав полной оплатой работ. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "documentation_and_ip_summary"
          type: "string"
          presentation: "fact"
          label: "Документация и права"
          description: >
            Сводка: передача исполнительной документации, BIM, форматы файлов, условие перехода прав после оплаты (ст. 1296 ГК РФ, РД-11-02-2006). Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "ip_docs_details"
          label: "Права на проектно-сметную документацию"
          type: "string"
          presentation: "fact"
          description: >
            Подробная формулировка о документации, BIM и правах на них. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: false

      store_payload: true

  - id: sro_membership_requirement
    name: "Членство в СРО и допуски к строительным работам (ст. 52, 55.8 ГрК РФ)"
    description: >
      Фактографическая проверка членства Подрядчика в строительной СРО, наличия выписки  из реестра членов СРО (372-ФЗ), соответствия уровней ответственности по  компенсационным фондам (КФ ВВ, КФ ОДО) и учета порога неприменимости  (до 10 млн руб. по ст. 52 ГрК РФ).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "СРО"
        - "саморегулируемая организация"
        - "выписка из реестра членов СРО"
        - "допуск к строительным работам"
        - "членство в СРО"
        - "свидетельство о допуске"
        - "уровень ответственности"
        - "компенсационный фонд"
        - "КФ ВВ"
        - "КФ ОДО"
        - "10 млн рублей"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(СРО$|СРО[^А-Яа-я]|саморегулируемая\\s+организация)"
        - "(?i)выписк.*из.*реестр.*членов.*СРО"
        - "(?i)свидетельство.*о.*допуске"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор строительного подряда в части членства в СРО и допуска к работам.
        Проверяется только один вопрос: как договор подтверждает SRO-статус Подрядчика 
        и наличие допуска к соответствующим видам работ.

        Нормативный ориентир:
        - ст. 52 Градостроительного кодекса РФ (порог 10 млн руб. для обязательного членства в СРО)
        - ст. 55.8 Градостроительного кодекса РФ (условия членства в СРО)
        - ст. 55.16 Градостроительного кодекса РФ (уровни ответственности: КФ ВВ, КФ ОДО)
        - 372-ФЗ (отмена свидетельств о допуске с 01.07.2017)

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не оценивай риск, фиксируй условия буквально.
        - С 01.07.2017 (372-ФЗ) «свидетельства о допуске СРО» отменены. 
          Единственный документ — выписка из реестра членов СРО (срок действия 1 месяц).
        - Если размер обязательств по договору не превышает 10 млн руб., членство в СРО 
          не требуется (п. 2.1 ст. 52 ГрК РФ в ред. 124-ФЗ). Для договоров свыше 10 млн руб. 
          уровень ответственности Подрядчика по КФ ОДО должен покрывать цену договора.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Упомянуто ли членство в СРО.
        2. Есть ли ссылка на выписку из реестра членов СРО или иной подтверждающий документ.
        3. Определены ли виды работ / допуски или уровень ответственности, на которые распространяется членство.
        4. Сформируй краткую сводку по SRO-статусу Подрядчика.
        5. Извлеки подробную формулировку условий.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона вместо текста договора.
        2. Если условие не указано прямо — возвращай "not_defined" для статусов и "Данные не определены" для текста.
        3. Не используй "None", "null", "not_defined" или пустые строки в JSON.
        4. sro_membership_mentioned = "yes" только если членство в СРО прямо упомянуто.
        5. В сводке (summary) пиши кратко, на русском языке, фиксируя статус, подтверждающий документ 
           и применимость порога 10 млн руб.
        6. В evidence включай только точные цитаты из текста договора.
        7. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        со всеми 6 ключами.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — данные определены:
        Фрагмент:
        "Подрядчик подтверждает, что является членом саморегулируемой организации 
        в области строительства. Подтверждением служит выписка из реестра членов СРО. 
        Допуск распространяется на работы по строительству и реконструкции объектов 
        капитального строительства."

        Ответ:
        {
          "sro_membership_mentioned": "yes",
          "sro_proof_document_referenced": "yes",
          "work_admission_scope_defined": "yes",
          "sro_status_summary": "Является членом СРО; подтверждение — выписка из реестра; допуск на строительство и реконструкцию ОКС. (Членство обязательно при цене работ > 10 млн руб.).",
          "sro_details": "Подрядчик является членом СРО в области строительства; подтверждением служит выписка из реестра; допуск распространяется на строительство и реконструкцию ОКС.",
          "evidence": [
            {
              "clause_ref": "п. 1.5",
              "quote": "Подрядчик подтверждает, что является членом саморегулируемой организации в области строительства. Подтверждением служит выписка из реестра членов СРО..."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Подрядчик выполняет строительные работы в соответствии с договором."

        Ответ:
        {
          "sro_membership_mentioned": "not_defined",
          "sro_proof_document_referenced": "not_defined",
          "work_admission_scope_defined": "not_defined",
          "sro_status_summary": "Не установлено",
          "sro_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о членстве в СРО.
        2. Найди прямую цитату о подтверждающем документе (выписка / свидетельство).
        3. Найди прямую цитату о видах работ, допусках или уровне ответственности.
        4. Если прямой цитаты нет — верни "not_defined" / "Данные не определены".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "sro_membership_mentioned": "<yes / no / not_defined>",
          "sro_proof_document_referenced": "<yes / no / not_defined>",
          "work_admission_scope_defined": "<yes / no / not_defined>",
          "sro_status_summary": "<краткая сводка>",
          "sro_details": "<подробный текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 850

    retrieval:
      retrieval_profile: "registration_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "СРО саморегулируемая организация выписка из реестра членов СРО свидетельство о допуске допуск к строительным работам членство в СРО уровень ответственности компенсационный фонд КФ ВВ КФ ОДО 10 млн рублей"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - representations
        - obligations
      negative_keywords:
        - "КС-2"
        - "КС-3"
        - "гарантийный срок"
        - "неустойка"
        - "аванс"
        - "НДС"
      position_bias:
        preferred_range: [0.0, 0.35]
        boost: 0.18
        scope: segment
      context_k: 5
      max_chunks: 6
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "price_list"
      preferred_clause_functions:
        - "representations"
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.14

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"

      compact_output: false

      presence_signal:
        field: "sro_membership_requirement_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_max_tokens: 1000

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора строительного подряда
        сведения о членстве Подрядчика в СРО и допуске к видам работ.
        Не анализируй смету, сроки, гарантию, страхование или экологию.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. sro_membership_requirement_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (sro_membership_mentioned, sro_proof_document_referenced,
              work_admission_scope_defined) ≠ "not_defined";
           - "missing" — если все три содержательных поля = "not_defined" (или "no");
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - sro_membership_mentioned = "not_defined";
           - sro_proof_document_referenced = "not_defined";
           - work_admission_scope_defined = "not_defined";
           - sro_details = "Данные не определены";
           - sro_status_summary = "Не установлено";
           - не выполняй остальные шаги.

        1. sro_membership_mentioned:
           "yes" / "no" / "not_defined".

        2. sro_proof_document_referenced:
           "yes" / "no" / "not_defined".

        3. work_admission_scope_defined:
           "yes" / "no" / "not_defined".

        4. sro_status_summary:
           Краткая user-facing сводка по SRO-статусу.
           Примеры: "Является членом СРО; подтверждение — выписка из реестра; допуск на строительство ОКС. (Членство обязательно при цене работ > 10 млн руб.)." / "Не установлено".

        5. sro_details:
           Подробная формулировка о членстве в СРО и допуске, или "Данные не определены".
        </task>

        <context_rules>
        - Перед остальными полями заполни sro_membership_requirement_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все содержательные сигнальные поля = "not_defined", sro_details = "Данные не определены", sro_status_summary = "Не установлено".
        - Используй только текст договора из <context>.
        - Не подставляй данные из нормативных актов или общих знаний.
        - sro_membership_mentioned:
          - "yes" — если членство в СРО прямо указано.
          - "no" — если договор прямо указывает на отсутствие такого членства или его ненужность (например, цена ≤ 10 млн руб.).
          - "not_defined" — условие отсутствует в тексте.
        - sro_proof_document_referenced:
          - "yes" — если прямо указаны выписка из реестра членов СРО или (в старых договорах) свидетельство о допуске.
          - "no" — если договор прямо указывает на отсутствие такого документа.
          - "not_defined" — вопрос не урегулирован.
        - work_admission_scope_defined:
          - "yes" — если прямо раскрыты виды работ, уровень ответственности (КФ ВВ / КФ ОДО) или сфера допуска.
          - "no" — если договор прямо указывает, что такая детализация отсутствует.
          - "not_defined" — вопрос не урегулирован.
        - sro_status_summary:
          - Обязательно отрази подтверждающий документ (выписка из реестра) и порог 10 млн руб. (ст. 52 ГрК РФ).
        - Запрещено использовать null, None, "N/A" или пустые строки.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В договоре нет ни упоминания СРО, ни выписки из реестра, ни компенсационных фондов.
           → presence = "missing"; все содержательные статусы = "not_defined"; все текстовые поля = "Данные не определены".

        2. Цена договора до 10 млн руб.
           В тексте прямо оговорено, что членство в СРО не требуется, так как цена работ по ст. 52 ГрК РФ не превышает 10 млн руб.
           → presence = "present"; sro_membership_mentioned = "no"; sro_status_summary = "Членство в СРО не требуется (цена договора до 10 млн руб.)".

        3. Противоречие между фрагментами.
           В разделе 1 указано: "Подрядчик является членом СРО", а в реквизитах: "Сведения о членстве в СРО не представлены".
           → presence = "unclear"; sro_membership_mentioned = "not_defined"; sro_details = "Не удалось определить".

        4. Ссылка на свидетельство о допуске старого образца.
           Договор ссылается на «свидетельство о допуске СРО» (отменено 372-ФЗ с 2017 года) вместо выписки из реестра.
           → presence = "present"; sro_proof_document_referenced = "yes"; sro_status_summary = "Указано свидетельство о допуске (по 372-ФЗ действует выписка из реестра членов СРО)".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для sro_membership_requirement_presence используй только: "present", "missing", "unclear".
        - Для статусных полей используй только значения из allowed_values.
        - Fallback при отсутствии данных: все текстовые значения → "Данные не определены".
        - Fallback при противоречии или неоднозначности: все текстовые значения → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "sro_membership_requirement_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования членства в СРО / допусков к работам в договоре. Внутреннее агрегатное signal-поле."
          required: true

        - name: "sro_membership_mentioned"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Упомянуто ли членство Подрядчика в СРО. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "sro_proof_document_referenced"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Есть ли ссылка на выписку из реестра СРО или свидетельство. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "work_admission_scope_defined"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Определены ли виды работ, допуски или уровень ответственности (КФ ВВ / КФ ОДО). Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "sro_status_summary"
          type: "string"
          presentation: "fact"
          label: "Членство в СРО"
          description: >
            Сводка: членство в СРО, наличие выписки, уровень ответственности, применимость порога 10 млн руб. (ст. 52, 55.8 ГрК РФ). Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "sro_details"
          label: "Требования к членству в СРО"
          type: "string"
          presentation: "fact"
          description: >
            Подробная формулировка о членстве в СРО и допуске. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: false

      store_payload: true

  - id: dispute_resolution_technical_expertise
    name: "Досудебный порядок и строительно-техническая экспертиза (ст. 720, 755 ГК РФ)"
    description: >
      Фактографическая проверка наличия обязательного претензионного порядка,  совместного обследования при выявлении недостатков (ст. 720 ГК РФ),  порядка назначения строительно-технической экспертизы (в т.ч. СРО экспертиз)  и распределения расходов на её проведение (ст. 755 ГК РФ).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "medium"
    severity_if_pass: "pass"
    severity_if_fail: "medium"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "досудебный порядок"
        - "претензионный порядок"
        - "строительно-техническая экспертиза"
        - "совместное обследование"
        - "независимая экспертиза"
        - "расходы на экспертизу"
        - "немедленное уведомление"
        - "односторонний акт осмотра"
        - "СРО экспертиз"
        - "срок явки на обследование"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)претензионный\\s+порядок"
        - "(?i)строительно.техническ.*экспертиз"
        - "(?i)совместное\\s+обследование"
        - "(?i)односторонн.*акт.*осмотр"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор строительного подряда в части досудебного урегулирования споров 
        и строительно-технической экспертизы.
        Проверяется только один вопрос: предусмотрены ли претензионный порядок, 
        совместное обследование, техническая экспертиза и распределение расходов на неё.

        Нормативный ориентир:
        - ст. 720 ГК РФ (немедленное уведомление о недостатках и совместное обследование)
        - ст. 755 ГК РФ (строительно-техническая экспертиза при разногласиях)
        - АПК РФ, ГПК РФ (досудебный порядок)

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не оценивай риск, фиксируй условия буквально.
        - Ключевые маркеры для РФ-практики: (1) немедленное письменное уведомление Заказчиком о недостатках, 
          (2) совместное обследование (Подрядчик обязан явиться в указанный срок, иначе составляется односторонний акт), 
          (3) строительно-техническая экспертиза при разногласиях, (4) распределение расходов на экспертизу.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли обязательный претензионный / досудебный порядок.
        2. Есть ли требование о совместном обследовании объекта / результата работ при обнаружении недостатков.
        3. Есть ли упоминание независимой или строительно-технической экспертизы.
        4. Определено ли распределение расходов на экспертизу.
        5. Сформируй краткую сводку по процедурам досудебного урегулирования.
        6. Извлеки подробную формулировку условий.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона вместо текста договора.
        2. Если условие не указано прямо — возвращай "not_defined" для статусов и "Данные не определены" для текста.
        3. Не используй "None", "null", "not_defined" или пустые строки в JSON.
        4. pretrial_claim_required = "yes" только если договор прямо устанавливает обязательный претензионный или досудебный порядок.
        5. joint_inspection_required = "yes" только если прямо предусмотрено совместное обследование, осмотр или совместная фиксация недостатков.
        6. technical_expertise_procedure_defined = "yes" только если прямо урегулированы экспертиза, её назначение или проведение.
        7. expertise_cost_allocation_defined = "yes" только если прямо распределены расходы на экспертизу (например, несет сторона, чьи требования не подтвердились).
        8. В сводке (summary) пиши кратко, на русском языке, фиксируя ключевые procedural mechanics.
        9. В evidence включай только точные цитаты из текста договора.
        10. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        со всеми 7 ключами.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — данные определены:
        Фрагмент:
        "До обращения в суд сторона обязана направить письменную претензию. При возникновении спора 
        стороны проводят совместное обследование объекта. В случае разногласий назначается 
        независимая строительно-техническая экспертиза, расходы на которую несёт сторона, 
        требования которой не подтвердились."

        Ответ:
        {
          "pretrial_claim_required": "yes",
          "joint_inspection_required": "yes",
          "technical_expertise_procedure_defined": "yes",
          "expertise_cost_allocation_defined": "yes",
          "dispute_resolution_summary": "Обязателен претензионный порядок; при споре — совместное обследование; при разногласиях — строительно-техническая экспертиза за счет проигравшей стороны.",
          "dispute_resolution_details": "До обращения в суд стороны соблюдают претензионный порядок, проводят совместное обследование и при необходимости назначают независимую строительно-техническую экспертизу; расходы несет сторона, требования которой не подтвердились.",
          "evidence": [
            {
              "clause_ref": "п. 12.2",
              "quote": "До обращения в суд сторона обязана направить письменную претензию. При возникновении спора стороны проводят совместное обследование объекта..."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Споры разрешаются в соответствии с действующим законодательством."

        Ответ:
        {
          "pretrial_claim_required": "not_defined",
          "joint_inspection_required": "not_defined",
          "technical_expertise_procedure_defined": "not_defined",
          "expertise_cost_allocation_defined": "not_defined",
          "dispute_resolution_summary": "Не установлено",
          "dispute_resolution_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о претензионном порядке.
        2. Найди прямую цитату о совместном обследовании.
        3. Найди прямую цитату об экспертизе.
        4. Найди прямую цитату о расходах на экспертизу.
        5. Если прямой цитаты нет — верни "not_defined" / "Данные не определены".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "pretrial_claim_required": "<yes / no / not_defined>",
          "joint_inspection_required": "<yes / no / not_defined>",
          "technical_expertise_procedure_defined": "<yes / no / not_defined>",
          "expertise_cost_allocation_defined": "<yes / no / not_defined>",
          "dispute_resolution_summary": "<краткая сводка>",
          "dispute_resolution_details": "<подробный текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 900

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "досудебный порядок претензионный порядок строительно-техническая экспертиза совместное обследование независимая экспертиза расходы на экспертизу немедленное уведомление односторонний акт осмотра СРО экспертиз"
      preferred_unit_types:
        - general_provision
        - obligation
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - boilerplate
        - obligations
      negative_keywords:
        - "КС-2"
        - "КС-3"
        - "гарантийный срок"
        - "НДС"
        - "аванс"
        - "страхование"
      position_bias:
        preferred_range: [0.60, 1.0]
        boost: 0.18
        scope: segment
      context_k: 5
      max_chunks: 6
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "price_list"
      preferred_clause_functions:
        - "boilerplate"
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.14

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"

      compact_output: false

      presence_signal:
        field: "dispute_resolution_technical_expertise_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_max_tokens: 1100

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора строительного подряда
        условия о досудебном урегулировании споров, совместном обследовании 
        и строительно-технической экспертизе.
        Не анализируй смету, сроки, гарантию, страхование или экологию.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. dispute_resolution_technical_expertise_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (pretrial_claim_required, joint_inspection_required,
              technical_expertise_procedure_defined, expertise_cost_allocation_defined) ≠ "not_defined";
           - "missing" — если все содержательные поля = "not_defined" (или "no");
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - pretrial_claim_required = "not_defined";
           - joint_inspection_required = "not_defined";
           - technical_expertise_procedure_defined = "not_defined";
           - expertise_cost_allocation_defined = "not_defined";
           - dispute_resolution_details = "Данные не определены";
           - dispute_resolution_summary = "Не установлено";
           - не выполняй остальные шаги.

        1. pretrial_claim_required:
           "yes" / "no" / "not_defined".

        2. joint_inspection_required:
           "yes" / "no" / "not_defined".

        3. technical_expertise_procedure_defined:
           "yes" / "no" / "not_defined".

        4. expertise_cost_allocation_defined:
           "yes" / "no" / "not_defined".

        5. dispute_resolution_summary:
           Краткая user-facing сводка по процедурам.
           Примеры: "Обязателен претензионный порядок; при споре — совместное обследование; при разногласиях — строительно-техническая экспертиза за счет проигравшей стороны." / "Не установлено".

        6. dispute_resolution_details:
           Подробная формулировка о досудебном порядке и экспертизе, или "Данные не определены".
        </task>

        <context_rules>
        - Перед остальными полями заполни dispute_resolution_technical_expertise_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все содержательные сигнальные поля = "not_defined", dispute_resolution_details = "Данные не определены", dispute_resolution_summary = "Не установлено".
        - Используй только текст договора из <context>.
        - Не подставляй данные из нормативных актов или общих знаний.
        - pretrial_claim_required:
          - "yes" — если установлен обязательный претензионный или досудебный порядок.
          - "no" — если договор прямо исключает такой порядок.
          - "not_defined" — условие отсутствует в тексте.
        - joint_inspection_required:
          - "yes" — если прямо предусмотрено совместное обследование, осмотр или совместная фиксация недостатков.
          - "no" — если договор прямо исключает такую процедуру.
          - "not_defined" — вопрос не урегулирован.
        - technical_expertise_procedure_defined:
          - "yes" — если прямо урегулирована независимая или строительно-техническая экспертиза.
          - "no" — если договор прямо исключает такую процедуру.
          - "not_defined" — вопрос не урегулирован.
        - expertise_cost_allocation_defined:
          - "yes" — если расходы на экспертизу прямо распределены (например, несет проигравшая сторона).
          - "no" — если договор прямо указывает на отсутствие специального распределения.
          - "not_defined" — вопрос не урегулирован.
        - dispute_resolution_summary:
          - Обязательно отрази наличие совместного обследования и экспертизы (ст. 720, 755 ГК РФ).
        - Запрещено использовать null, None, "N/A" или пустые строки.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В договоре нет ни положений о претензиях, ни совместного осмотра дефектов, ни экспертизы.
           → presence = "missing"; все содержательные статусы = "not_defined"; все текстовые поля = "Данные не определены".

        2. Стандартный претензионный порядок без экспертизы.
           Установлен 30-дневный срок ответа на претензию, но техническая экспертиза и совместное обследование не регламентированы.
           → presence = "present"; pretrial_claim_required = "yes"; joint_inspection_required = "not_defined"; dispute_resolution_summary = "Претензионный порядок установлен; строительно-техническая экспертиза не регламентирована".

        3. Противоречие между фрагментами.
           В разделе 12 срок ответа на претензию — 10 дней, а в разделе 15 — "в течение 30 календарных дней".
           → presence = "unclear"; pretrial_claim_required = "not_defined"; dispute_resolution_details = "Не удалось определить".

        4. Односторонний акт при неявке на обследование.
           Договор требует вызова Подрядчика на осмотр дефектов за 3 дня с правом Заказчика составить односторонний акт при неявке.
           → presence = "present"; joint_inspection_required = "yes"; dispute_resolution_summary = "Совместное обследование с правом составления одностороннего акта при неявке".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для dispute_resolution_technical_expertise_presence используй только: "present", "missing", "unclear".
        - Для статусных полей используй только значения из allowed_values.
        - Fallback при отсутствии данных: все текстовые значения → "Данные не определены".
        - Fallback при противоречии или неоднозначности: все текстовые значения → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "dispute_resolution_technical_expertise_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования досудебного порядка и экспертизы в договоре. Внутреннее агрегатное signal-поле."
          required: true

        - name: "pretrial_claim_required"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Установлен ли обязательный досудебный порядок. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "joint_inspection_required"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Требуется ли совместное обследование объекта / результата работ. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "technical_expertise_procedure_defined"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Определён ли порядок независимой / строительно-технической экспертизы. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "expertise_cost_allocation_defined"
          type: "string"
          presentation: "signal"
          risk_weight: "low"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Распределены ли расходы на проведение экспертизы. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "dispute_resolution_summary"
          type: "string"
          presentation: "fact"
          label: "Претензии и экспертиза"
          description: >
            Сводка: претензионный порядок, совместное обследование, строительно-техническая экспертиза, распределение расходов (ст. 720, 755 ГК РФ). Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "dispute_resolution_details"
          label: "Досудебная техническая экспертиза споров"
          type: "string"
          presentation: "fact"
          description: >
            Подробная формулировка о претензионном порядке и экспертизе. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: false

      store_payload: true

  - id: construction_site_safety
    name: "Охрана труда и безопасность на строительной площадке (ТК РФ, СП 12-136-2002)"
    description: >
      Фактографическая проверка распределения обязанностей по охране труда  и безопасности работ на строительной площадке, ответственной стороны,  уведомления о несчастных случаях, требований к СИЗ (средствам  индивидуальной защиты), инструктажу, акту-допуску и пропускному режиму  (ТК РФ, СП 12-136-2002, Приказ Минтруда № 772н).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "охрана труда"
        - "безопасность на строительной площадке"
        - "несчастный случай"
        - "ответственность за безопасность"
        - "инструктаж"
        - "средства защиты"
        - "СИЗ"
        - "акт-допуск"
        - "пропускной режим"
        - "ответственный производитель работ"
        - "допуск на площадку"
        - "техника безопасности"
        - "пожарная безопасность"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)подрядчик.*обеспечивает.*безопасность.*работ"
        - "(?i)охрана.*труда.*на\\s+объекте"
        - "(?i)несчастн.*случа"
        - "(?i)акт.*допуск.*на.*производств"
        - "(?i)пропускн.*режим"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор строительного подряда в части охраны труда и безопасности на площадке.
        Проверяется только один вопрос: как распределены обязанности по безопасности работ, 
        уведомлению о происшествиях, обеспечению СИЗ, инструктажу, акту-допуску и пропускному режиму.

        Нормативный ориентир:
        - ст. 212–214 Трудового кодекса РФ (обязанности работодателя по охране труда)
        - СП 12-136-2002 (организация производства и контроль при строительстве)
        - Приказ Минтруда РФ № 772н (требования к средствам индивидуальной защиты)
        - Приказ Ростехнадзора (акт-допуск на производство работ)

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не оценивай риск, фиксируй условия буквально.
        - Ключевые маркеры для РФ-практики: (1) ответственная сторона за безопасность на площадке 
          (обычно Подрядчик), (2) обязанность обеспечивать работников СИЗ за свой счет (ст. 212 ТК РФ), 
          (3) инструктаж по охране труда (вводный, первичный, повторный), (4) акт-допуск на производство работ 
          (особенно при работе на действующем предприятии), (5) пропускной режим на площадку, 
          (6) уведомление о несчастных случаях и инцидентах.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Закреплены ли обязанности по охране труда и безопасности работ.
        2. Какая сторона отвечает за безопасность на площадке.
        3. Есть ли обязанность уведомлять о несчастных случаях, инцидентах или нарушениях безопасности.
        4. Есть ли требования о средствах защиты (СИЗ), инструктаже или аналогичных мерах безопасности.
        5. Есть ли упоминание акта-допуска, пропускного режима или допуска на площадку.
        6. Сформируй краткую сводку по режиму безопасности на площадке.
        7. Извлеки подробную формулировку условий.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона вместо текста договора.
        2. Если условие не указано прямо — возвращай "not_defined" для статусов и "Данные не определены" для текста.
        3. Не используй "None", "null", "not_defined" или пустые строки в JSON.
        4. safety_obligations_defined = "yes" только если договор прямо закрепляет обязанности по охране труда или безопасности.
        5. responsible_party_for_safety: "contractor" (Подрядчик), "customer" (Заказчик), "both" (распределены), "not_defined" (не указано).
        6. В сводке (summary) пиши кратко, на русском языке, фиксируя ключевые procedural mechanics (СИЗ, инструктаж, акт-допуск, пропускной режим).
        7. В evidence включай только точные цитаты из текста договора.
        8. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        со всеми 8 ключами.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — данные определены:
        Фрагмент:
        "Подрядчик обеспечивает охрану труда и безопасность работ на строительной площадке, 
        проводит инструктаж персонала и обеспечивает работников средствами индивидуальной защиты 
        (каска, жилет, спецобувь) за свой счет. О каждом несчастном случае Подрядчик обязан 
        незамедлительно уведомить Заказчика. Допуск на площадку осуществляется по пропускам, 
        оформленным Заказчиком."

        Ответ:
        {
          "safety_obligations_defined": "yes",
          "responsible_party_for_safety": "contractor",
          "incident_notification_duty": "yes",
          "ppe_and_instruction_requirements": "yes",
          "access_control_defined": "yes",
          "site_safety_summary": "Подрядчик отвечает за охрану труда и безопасность; обеспечивает СИЗ и инструктаж; уведомляет о несчастных случаях; допуск на площадку по пропускам Заказчика.",
          "site_safety_details": "Подрядчик обеспечивает охрану труда и безопасность работ, проводит инструктаж и обеспечивает работников СИЗ за свой счет; уведомляет о несчастных случаях; допуск на площадку осуществляется по пропускам, оформленным Заказчиком.",
          "evidence": [
            {
              "clause_ref": "п. 8.1",
              "quote": "Подрядчик обеспечивает охрану труда и безопасность работ на строительной площадке, проводит инструктаж персонала и обеспечивает работников средствами индивидуальной защиты (каска, жилет, спецобувь) за свой счет. О каждом несчастном случае Подрядчик обязан незамедлительно уведомить Заказчика..."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Подрядчик выполняет работы в соответствии с графиком."

        Ответ:
        {
          "safety_obligations_defined": "not_defined",
          "responsible_party_for_safety": "not_defined",
          "incident_notification_duty": "not_defined",
          "ppe_and_instruction_requirements": "not_defined",
          "access_control_defined": "not_defined",
          "site_safety_summary": "Не установлено",
          "site_safety_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату об охране труда или безопасности.
        2. Найди прямую цитату об ответственной стороне.
        3. Найди прямую цитату об уведомлении об инцидентах.
        4. Найди прямую цитату о средствах защиты (СИЗ) или инструктаже.
        5. Найди прямую цитату об акте-допуске или пропускном режиме.
        6. Если прямой цитаты нет — верни "not_defined" / "Данные не определены".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "safety_obligations_defined": "<yes / no / not_defined>",
          "responsible_party_for_safety": "<contractor / customer / both / not_defined>",
          "incident_notification_duty": "<yes / no / not_defined>",
          "ppe_and_instruction_requirements": "<yes / no / not_defined>",
          "access_control_defined": "<yes / no / not_defined>",
          "site_safety_summary": "<краткая сводка>",
          "site_safety_details": "<подробный текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 950

