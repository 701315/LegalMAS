  - id: sro_membership_requirement
    name: "Членство в СРО и допуски к строительным работам (ст. 52, 55.8 ГрК РФ)"
    description: >
      Фактографическая проверка членства Подрядчика в строительной СРО, наличия выписки 
      из реестра членов СРО (372-ФЗ), соответствия уровней ответственности по 
      компенсационным фондам (КФ ВВ, КФ ОДО) и учета порога неприменимости 
      (до 10 млн руб. по ст. 52 ГрК РФ>).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: hybrid

    rules:
      keywords:
        - "СРО"
        - "саморегулируемая организация"
        - "выписка из реестра членов СРО"
        - "допуск к строительным работам"
        - "членство в СРО"
        - "свидетельство о допуске"
        - "уровень ответственности"
        - "компенсационный фонд"
        - "КФ ВВ"
        - "КФ ОДО"
        - "10 млн рублей"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(СРО$|СРО[^А-Яа-я]|саморегулируемая\\s+организация)"
        - "(?i)выписк.*из.*реестр.*членов.*СРО"
        - "(?i)свидетельство.*о.*допуске"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор строительного подряда в части членства в СРО и допуска к работам.
        Проверяется только один вопрос: как договор подтверждает SRO-статус Подрядчика 
        и наличие допуска к соответствBующим видам работ.

        Нормативный ориентир:
        - ст. 52 Градостроительного кодекса РФ (порог 10 млн руб. для обязательного членства в СРО)
        - ст. 55.8 Градостроительного кодекса РФ (условия членства в СРО)
        - ст. 55.16 Градостроительного кодекса РФ (уровни ответственности: КФ ВВ, КФ ОДО)
        - 372-ФЗ (отмена свидетельств о допуске с 01.07.2017)

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не оценивай риск, фиксируй условия буквально.
        - С 01.07.2017 (372-ФЗ) «свидетельства о допуске СРО» отменены. 
          Единственный документ — выписка из реестра членов СРО (срок действия 1 месяц).
        - Если размер обязательств по договору не превышает 10 млн руб., членство в СРО 
          не требуется (п. 2.1 ст. 52 ГрК РФ в ред. 124-ФЗ). Для договоров свыше 10 млн руб. 
          уровень ответственности Подрядчика по КФ ОДО должен покрывать цену договора.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Упомянуто ли членство в СРО.
        2. Есть ли ссылка на выписку из реестра членов СРО или иной подтверждающий документ.
        3. Определены ли виды работ / допуски или уровень ответственности, на которые распространяется членство.
        4. Сформируй краткую сводку по SRO-статусу Подрядчика.
        5. Извлеки подробную формулировку условий.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона вместо текста договора.
        2. Если условие не указано прямо — возвращай "not_defined" для статусов и "Данные не определены" для текста.
        3. Не используй "None", "null", "not_defined" или пустые строки в JSON.
        4. sro_membership_mentioned = "yes" только если членство в СРО прямо упомянуто.
        5. В сводке (summary) пиши кратко, на русском языке, фиксируя статус, подтверждающий документ 
           и применимость порога 10 млн руб.
        6. В evidence включай только точные цитаты из текста договора.
        7. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        со всеми 6 ключами.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — данные определены:
        Фрагмент:
        "Подрядчик подтверждает, что является членом саморегулируемой организации 
        в области строительства. Подтверждением служит выписка из реестра членов СРО. 
        Допуск распространяется на работы по строительству и реконструкции объектов 
        капитального строительства."

        Ответ:
        {
          "sro_membership_mentioned": "yes",
          "sro_proof_document_referenced": "yes",
          "work_admission_scope_defined": "yes",
          "sro_status_summary": "Является членом СРО; подтверждение — выписка из реестра; допуск на строительство и реконструкцию ОКС. (Членство обязательно при цене работ > 10 млн руб.).",
          "sro_details": "Подрядчик является членом СРО в области строительства; подтверждением служит выписка из реестра; допуск распространяется на строительство и реконструкцию ОКС.",
          "evidence": [
            {
              "clause_ref": "п. 1.5",
              "quote": "Подрядчик подтверждает, что является членом саморегулируемой организации в области строительства. Подтверждением служит выписка из реестра членов СРО..."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Подрядчик выполняет строительные работы в соответствии с договором."

        Ответ:
        {
          "sro_membership_mentioned": "not_defined",
          "sro_proof_document_referenced": "not_defined",
          "work_admission_scope_defined": "not_defined",
          "sro_status_summary": "Не установлено",
          "sro_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о членстве в СРО.
        2. Найди прямую цитату о подтверждающем документе (выписка / свидетельство).
        3. Найди прямую цитату о видах работ, допусках или уровне ответственности.
        4. Если прямой цитаты нет — верни "not_defined" / "Данные не определены".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "sro_membership_mentioned": "<yes / no / not_defined>",
          "sro_proof_document_referenced": "<yes / no / not_defined>",
          "work_admission_scope_defined": "<yes / no / not_defined>",
          "sro_status_summary": "<краткая сводка>",
          "sro_details": "<подробный текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 850

    retrieval:
      retrieval_profile: "registration_check"
      corpus_scope: "primary_segment"
      levels:
