        - name: "supervision_non_interference"
          type: "string"
          presentation: "signal"
          label: "Невмешательство"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Есть ли правило о невмешательстве в деятельность Подрядчика."
          required: true
          display_in_grid: true
          display_priority: 5
        - name: "supervision_details"
          type: "string"
          presentation: "fact"
          label: "Объём надзора"
          description: "Формулировка об объёме прав технического надзора."
          required: true
          display_in_grid: true
          display_priority: 6
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 7: Гарантия, скрытые недостатки и гарантийное удержание
  # ──────────────────────────────────────────────────────────────────────────
  - id: warranty_and_hidden_defects_analysis
    name: "Гарантийные обязательства, скрытые недостатки и гарантийное удержание (ст. 724, 756, 757 ГК РФ)"
    description: >
      Фактографическая проверка гарантийного срока на объект и инженерные сети,
      соответствия минимальному пятилетнему ориентиру, порядка работы
      со скрытыми недостатками, срока их устранения и наличия гарантийного удержания.
    triggers: ~
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "гарантийный срок"
        - "скрытые недостатки"
        - "гарантийные обязательства"
        - "ответственность за дефекты"
        - "устранение недостатков"
        - "5 лет"
        - "гарантийный депозит"
        - "удержание гарантийной суммы"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)гарантийный\\s+срок.*(?:5\\s+лет|пять\\s+лет)"
        - "(?i)ст\\.?\\s*(724|756|757)\\s+ГК\\s+РФ"
        - "(?i)скрыт(ые|ых)\\s+недостат"
        - "(?i)гарантийн.*удержани|гарантийн.*депозит"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор строительного подряда по ст. 724, 756, 757 ГК РФ.
        Проверяется только один вопрос: как в договоре урегулированы гарантия,
        скрытые недостатки и гарантийное удержание.

        Нормативный ориентир:
        - ст. 724 ГК РФ
        - ст. 756 ГК РФ
        - ст. 757 ГК РФ

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Какой гарантийный срок установлен на объект в целом.
        2. Какой гарантийный срок установлен на инженерные сети,
           если он выделен отдельно.
        3. Соответствует ли общий гарантийный срок пятилетнему ориентиру.
        4. Описан ли порядок предъявления требований по скрытым недостаткам.
        5. Указан ли срок устранения недостатков.
        6. Есть ли гарантийное удержание / депозит.
        7. Каков размер такого удержания, если он указан.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined".
        4. Если текстового значения нет — возвращай "Данные не определены".
        5. Не используй "None", "null", "not_found" или пустые строки.
        6. warranty_period_general_status = "defined" только если гарантийный
           срок на объект прямо указан.
        7. warranty_period_engineering_status = "defined" только если отдельно
           указан срок по инженерным сетям.
        8. warranty_complies_5yr_rule = "yes" только если общий гарантийный срок
           прямо составляет не менее 5 лет либо эквивалентно этому.
        9. hidden_defects_procedure = "described" только если порядок уведомления,
           осмотра, фиксации или устранения скрытых недостатков описан содержательно.
        10. defect_remedy_deadline_status = "defined" только если срок устранения
            недостатков прямо указан.
        11. retention_money_present = "yes" только если договор прямо
            предусматривает гарантийный депозит, резерв или удержание
            части оплаты на гарантийный период.
        12. retention_amount заполняй только по прямому тексту договора.
        13. В evidence включай только текст договора.
        14. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — данные определены:
        Фрагмент:
        "Гарантийный срок на объект составляет 5 лет с даты подписания акта
        ввода в эксплуатацию. На инженерные сети гарантийный срок составляет
        2 года. При обнаружении скрытых недостатков Заказчик направляет
        письменное уведомление, после чего стороны составляют акт осмотра.
        Подрядчик обязан устранить недостатки в течение 15 рабочих дней.
        Заказчик удерживает 5% цены договора в качестве гарантийного удержания
        до истечения гарантийного срока."

        Ответ:
        {
          "warranty_period_general_status": "defined",
          "warranty_period_general_value": "5 лет с даты подписания акта ввода в эксплуатацию.",
          "warranty_period_engineering_status": "defined",
          "warranty_period_engineering_value": "2 года.",
          "warranty_complies_5yr_rule": "yes",
          "hidden_defects_procedure": "described",
          "defect_remedy_deadline_status": "defined",
          "defect_remedy_deadline_value": "15 рабочих дней.",
          "retention_money_present": "yes",
          "retention_amount": "5% цены договора.",
          "evidence": [
            {
              "clause_ref": "п. 9.1",
              "quote": "Гарантийный срок на объект составляет 5 лет с даты подписания акта ввода в эксплуатацию. На инженерные сети гарантийный срок составляет 2 года. При обнаружении скрытых недостатков Заказчик направляет письменное уведомление... Подрядчик обязан устранить недостатки в течение 15 рабочих дней. Заказчик удерживает 5% цены договора..."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Подрядчик отвечает за качество выполненных работ."

        Ответ:
        {
          "warranty_period_general_status": "not_defined",
          "warranty_period_general_value": "Данные не определены",
          "warranty_period_engineering_status": "not_defined",
          "warranty_period_engineering_value": "Данные не определены",
          "warranty_complies_5yr_rule": "not_defined",
          "hidden_defects_procedure": "not_defined",
          "defect_remedy_deadline_status": "not_defined",
          "defect_remedy_deadline_value": "Данные не определены",
          "retention_money_present": "not_defined",
          "retention_amount": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о гарантийном сроке на объект.
        2. Найди прямую цитату о гарантийном сроке на инженерные сети.
        3. Найди прямую цитату о скрытых недостатках и порядке действий.
        4. Найди прямую цитату о сроке устранения недостатков.
        5. Найди прямую цитату о гарантийном удержании.
        6. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "warranty_period_general_status": "<defined / not_defined>",
          "warranty_period_general_value": "<текст или 'Данные не определены'>",
          "warranty_period_engineering_status": "<defined / not_defined>",
          "warranty_period_engineering_value": "<текст или 'Данные не определены'>",
          "warranty_complies_5yr_rule": "<yes / no / not_defined>",
          "hidden_defects_procedure": "<described / implied / absent / not_defined>",
          "defect_remedy_deadline_status": "<defined / not_defined>",
          "defect_remedy_deadline_value": "<текст или 'Данные не определены'>",
          "retention_money_present": "<yes / no / not_defined>",
          "retention_amount": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 820

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "гарантийный срок скрытые недостатки гарантийные обязательства ответственность за дефекты устранение недостатков 5 лет гарантийный депозит удержание гарантийной суммы"
      retrieval_profile: "warranties_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
      negative_keywords:
        - "субподряд"
        - "аванс"
        - "КС-2"
        - "КС-3"
        - "НДС"
        - "СРО"
      position_bias:
        preferred_range: [0.45, 1.0]
        boost: 0.20
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "price_list"
      preferred_clause_functions:
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.14

    evidence:
      required: true
      min_snippet_length: 50
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 1100

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора строительного подряда
        сведения о гарантийном сроке, скрытых недостатках и гарантийном удержании.
        Не анализируй объект строительства, смету, сроки, страхование или экологию.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. warranty_period_general_status — "defined" / "not_defined".
        2. warranty_period_general_value — гарантийный срок на объект в целом.
        3. warranty_period_engineering_status — "defined" / "not_defined".
        4. warranty_period_engineering_value — гарантийный срок на инженерные сети.
        5. warranty_complies_5yr_rule — "yes" / "no" / "not_defined".
        6. hidden_defects_procedure — "described" / "implied" / "absent" / "not_defined".
        7. defect_remedy_deadline_status — "defined" / "not_defined".
        8. defect_remedy_deadline_value — срок устранения недостатков.
        9. retention_money_present — "yes" / "no" / "not_defined".
        10. retention_amount — размер гарантийного удержания / депозита.

        Если данные отсутствуют:
        - статус = "not_defined"
        - текст = "Данные не определены"
        </task>

        <rules>
        - Используй только текст договора.
        - warranty_complies_5yr_rule:
            - "yes" — если общий гарантийный срок прямо составляет
              не менее 5 лет.
            - "no" — если общий гарантийный срок прямо меньше 5 лет.
            - "not_defined" — если общий гарантийный срок не установлен.
        - hidden_defects_procedure:
            - "described" — если порядок уведомления, осмотра, акта,
              устранения или аналогичных действий описан содержательно.
            - "implied" — если скрытые недостатки упомянуты, но порядок
              раскрыт фрагментарно.
            - "absent" — если договор прямо исключает специальный порядок.
            - "not_defined" — если по тексту это не установлено.
        - retention_money_present:
            - "yes" — если прямо предусмотрены гарантийный депозит, гарантийный резерв
              или удержание части оплаты на гарантийный срок.
            - "no" — если договор прямо исключает такие механизмы.
            - "not_defined" — если по тексту это не установлено.
        - retention_amount заполняй только по прямому тексту договора.
        - Верни только JSON.
        </rules>
      fields:
        - name: "warranty_period_general_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания гарантийного срока на объект."
          required: true
        - name: "warranty_period_general_value"
          type: "string"
          presentation: "fact"
          label: "Гарантия на объект"
          description: "Гарантийный срок на объект в целом."
          required: true
          display_in_grid: true
          display_priority: 1
        - name: "warranty_period_engineering_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания гарантийного срока на инженерные сети."
          required: true
        - name: "warranty_period_engineering_value"
          type: "string"
          presentation: "fact"
          label: "Гарантия на сети"
          description: "Гарантийный срок на инженерные сети."
          required: true
          display_in_grid: true
          display_priority: 2
        - name: "warranty_complies_5yr_rule"
          type: "string"
          presentation: "signal"
          label: "Соответствие 5 годам"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Соответствует ли гарантия пятилетнему ориентиру."
          required: true
          display_in_grid: true
          display_priority: 3
        - name: "hidden_defects_procedure"
          type: "string"
          presentation: "signal"
          label: "Скрытые недостатки"
          allowed_values: ["described", "implied", "absent", "not_defined"]
          description: "Описан ли порядок работы со скрытыми недостатками."
          required: true
          display_in_grid: true
          display_priority: 4
        - name: "defect_remedy_deadline_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания срока устранения недостатков."
          required: true
        - name: "defect_remedy_deadline_value"
          type: "string"
          presentation: "fact"
          label: "Срок устранения"
          description: "Срок устранения недостатков подрядчиком."
          required: true
          display_in_grid: true
          display_priority: 5
        - name: "retention_money_present"
          type: "string"
          presentation: "signal"
          label: "Гарантийное удержание"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Есть ли гарантийный депозит или удержание части оплаты."
          required: true
          display_in_grid: true
          display_priority: 6
        - name: "retention_amount"
          type: "string"
          presentation: "fact"
          label: "Размер удержания"
          description: "Размер гарантийного удержания или депозита."
          required: true
          display_in_grid: true
          display_priority: 7
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 8: Страхование строительных рисков и распределение рисков
  # ──────────────────────────────────────────────────────────────────────────
  - id: insurance_construction_risks
    name: "Страхование строительных рисков и распределение рисков случайной гибели (ст. 741, 742 ГК РФ)"
    description: >
      Фактографическая проверка наличия страхования строительных рисков,
      ответственной стороны, охвата страхования, распределения риска
      случайной гибели до приёмки и перехода рисков по промежуточным актам.
    triggers: ~
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "страхование строительных рисков"
        - "страхование гражданской ответственности"
        - "страхование объекта строительства"
        - "полис страхования"
        - "страхование от несчастных случаев"
        - "риск случайной гибели"
        - "переход рисков"
        - "до подписания акта"
        - "после приёмки объекта"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)подрядчик.*обязан.*застраховать"
        - "(?i)страхование.*строительных.*рисков"
        - "(?i)риск.*случайной.*гибели.*переходит.*к.*заказчику.*с.*момента"
        - "(?i)ст\\.?\\s*(741|742)\\s+ГК\\s+РФ"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор строительного подряда по ст. 741, 742 ГК РФ.
        Проверяется только один вопрос: как в договоре урегулированы
        страхование строительных рисков и распределение риска случайной гибели.

        Нормативный ориентир:
        - ст. 741 ГК РФ
        - ст. 742 ГК РФ
        - ст. 753 ГК РФ

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Предусмотрено ли страхование строительных рисков.
        2. Какая сторона обязана обеспечить страхование.
        3. Какой риск или объект охватывает страхование.
        4. На какой стороне риск случайной гибели объекта до приёмки.
        5. Урегулирован ли переход рисков по промежуточным актам или этапам.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined".
        4. Если текстового значения нет — возвращай "Данные не определены".
        5. Не используй "None", "null", "not_found" или пустые строки.
        6. insurance_present = "yes" только если договор прямо предусматривает
           страхование как обязательство или условие.
        7. insurance_present = "partial" только если застрахованы не все,
           а лишь отдельные риски или отдельные элементы.
        8. insurance_scope определяй только по прямому тексту о том,
           что именно страхуется.
        9. risk_bearer_before_acceptance определяй только по прямому тексту
           о распределении риска случайной гибели до приёмки.
        10. risk_transfer_on_interim_acts = "yes" только если договор прямо
            регулирует переход рисков по промежуточным актам, этапам
            или частичной приёмке.
        11. insurance_and_risk_details заполняй только по прямому тексту договора.
        12. В evidence включай только текст договора.
        13. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — данные определены:
        Фрагмент:
        "Подрядчик обязан застраховать объект строительства и гражданскую
        ответственность за причинение вреда третьим лицам. До подписания
        итогового акта приёмки риск случайной гибели объекта несёт Подрядчик.
        По промежуточным актам этапов риск не переходит к Заказчику."

        Ответ:
        {
          "insurance_present": "yes",
