          display_in_grid: true
          display_priority: 1
        - name: "contractor_type"
          type: "string"
          presentation: "signal"
          allowed_values: ["legal_entity", "state_entity", "individual", "ip", "self_employed", "not_defined"]
          description: "Тип Подрядчика."
          required: true
          display_in_grid: false
        - name: "contractor_signatory"
          type: "string"
          presentation: "fact"
          label: "Подписант Подрядчика"
