          description: "Какая сторона отвечает за безопасность на площадке."
          required: true
          display_in_grid: false
        - name: "incident_notification_duty"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Есть ли обязанность уведомлять о несчастных случаях и инцидентах."
          required: true
          display_in_grid: false
        - name: "ppe_and_instruction_requirements"
          type: "string"
