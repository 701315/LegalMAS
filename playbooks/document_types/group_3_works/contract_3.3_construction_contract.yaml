          display_in_grid: true
          display_priority: 1
        - name: "notification_duty_present"
          type: "string"
          presentation: "signal"
          label: "Уведомление"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Есть ли обязанность уведомления о форс-мажоре."
          required: true
          display_in_grid: true
          display_priority: 2
        - name: "deadline_extension_present"
          type: "string"
          presentation: "signal"
          label: "Продление сроков"
          allowed_values: ["yes", "no", "not_defined"]
