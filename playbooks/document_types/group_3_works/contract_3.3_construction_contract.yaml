          description: "Статус указания срока мотивированного отказа."
          required: true
        - name: "motivated_refusal_deadline_value"
          type: "string"
          presentation: "fact"
          label: "Срок для отказа"
          description: "Срок для направления мотивированного отказа."
          required: true
          display_in_grid: true
          display_priority: 3
        - name: "auto_acceptance"
          type: "string"
          presentation: "signal"
          label: "Автоприёмка"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Есть ли автоматическая приёмка при молчании."
          required: true
          display_in_grid: true
          display_priority: 4
        - name: "unilateral_signing_allowed"
          type: "string"
          presentation: "signal"
          label: "Одностороннее подписание"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Допускается ли одностороннее подписание акта."
          required: true
          display_in_grid: true
          display_priority: 5
        - name: "acceptance_docs_details"
          type: "string"
          presentation: "fact"
          label: "Порядок оформления"
          description: "Формулировка о документах и порядке приёмки."
          required: true
          display_in_grid: true
          display_priority: 6
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 10: Материалы, оборудование и входной контроль качества
  # ──────────────────────────────────────────────────────────────────────────
  - id: materials_supply_responsibility
    name: "Обеспечение строительства материалами и оборудованием, риск качества и входной контроль (ст. 745 ГК РФ)"
    description: >
      Фактографическая проверка того, какая сторона обеспечивает строительство
      материалами и оборудованием, на ком лежит риск качества поставляемых
      материалов и предусмотрен ли входной контроль качества.
    triggers: ~
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "материалы обеспечивает подрядчик"
        - "материалы предоставляет заказчик"
        - "давальческие материалы"
        - "оборудование заказчика"
        - "ответственность за качество материалов"
        - "приёмка материалов"
        - "входной контроль"
        - "контроль качества поступающих материалов"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(материал|оборудование).*(обеспечивает|предоставляет).*(подрядчик|заказчик)"
        - "(?i)входн.*контрол"
        - "(?i)ст\\.?\\s*745\\s+ГК\\s+РФ"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор строительного подряда по ст. 745 ГК РФ.
        Проверяется только один вопрос: кто обеспечивает стройку материалами
        и оборудованием, кто несёт риск качества и предусмотрен ли входной
        контроль качества.

        Нормативный ориентир:
        - ст. 745 ГК РФ

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Какая сторона обеспечивает строительство материалами.
        2. Какая сторона обеспечивает строительство оборудованием.
        3. На какой стороне лежит риск качества предоставленных материалов.
        4. Есть ли процедура входного контроля качества материалов.
        5. Как в целом сформулированы обязанности по обеспечению материалами
           и оборудованием.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined".
        4. Если текстового значения нет — возвращай "Данные не определены".
        5. Не используй "None", "null", "not_found" или пустые строки.
        6. materials_provider определяй только по прямому тексту о том,
           кто предоставляет материалы.
        7. equipment_provider определяй только по прямому тексту о том,
           кто предоставляет оборудование.
        8. materials_quality_risk_bearer определяй только по прямому тексту
           о риске качества или ответственности за качество материалов.
        9. incoming_quality_control_defined = "yes" только если договор прямо
           предусматривает входной контроль, приёмку, проверку сертификатов
           или аналогичную процедуру проверки материалов.
        10. materials_supply_details заполняй только по прямому тексту договора.
        11. В evidence включай только текст договора.
        12. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — данные определены:
        Фрагмент:
        "Подрядчик обеспечивает строительство материалами и оборудованием,
        если иное не предусмотрено отдельными приложениями. За качество
        поставляемых материалов отвечает сторона, предоставившая такие материалы.
        Подрядчик осуществляет входной контроль качества материалов и проверку
        сопроводительных сертификатов."

        Ответ:
        {
          "materials_provider": "contractor",
          "equipment_provider": "contractor",
          "materials_quality_risk_bearer": "provider_side",
          "incoming_quality_control_defined": "yes",
          "materials_supply_details": "Подрядчик обеспечивает строительство материалами и оборудованием; входной контроль качества материалов осуществляется Подрядчиком.",
          "evidence": [
            {
              "clause_ref": "п. 4.1",
              "quote": "Подрядчик обеспечивает строительство материалами и оборудованием... За качество поставляемых материалов отвечает сторона, предоставившая такие материалы. Подрядчик осуществляет входной контроль качества материалов и проверку сопроводительных сертификатов."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Подрядчик выполняет работы в соответствии с проектной документацией."

        Ответ:
        {
          "materials_provider": "not_defined",
          "equipment_provider": "not_defined",
          "materials_quality_risk_bearer": "not_defined",
          "incoming_quality_control_defined": "not_defined",
          "materials_supply_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о предоставлении материалов.
        2. Найди прямую цитату о предоставлении оборудования.
        3. Найди прямую цитату о риске качества материалов.
        4. Найди прямую цитату о входном контроле качества.
        5. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "materials_provider": "<contractor / customer / mixed / not_specified / not_defined>",
          "equipment_provider": "<contractor / customer / mixed / not_specified / not_defined>",
          "materials_quality_risk_bearer": "<contractor / customer / provider_side / shared / not_defined>",
          "incoming_quality_control_defined": "<yes / no / not_defined>",
          "materials_supply_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 700

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "материалы обеспечивает подрядчик материалы предоставляет заказчик давальческие материалы оборудование заказчика ответственность за качество материалов приемка материалов входной контроль качества"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
      negative_keywords:
        - "гарантийный срок"
        - "КС-2"
        - "КС-3"
        - "неустойка"
        - "НДС"
        - "СРО"
      position_bias:
        preferred_range: [0.15, 0.75]
        boost: 0.20
        scope: segment
      context_k: 5
      max_chunks: 6
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
        - "technical_specification"
      excluded_segment_types:
        - "price_list"
      preferred_clause_functions:
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.14

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 600

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора строительного подряда
        сведения о предоставлении материалов и оборудования, риске качества
        и входном контроле материалов.
        Не анализируй смету, сроки, гарантию, страхование или экологию.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. materials_provider — "contractor" / "customer" / "mixed" /
           "not_specified" / "not_defined".
        2. equipment_provider — "contractor" / "customer" / "mixed" /
           "not_specified" / "not_defined".
        3. materials_quality_risk_bearer — "contractor" / "customer" /
           "provider_side" / "shared" / "not_defined".
        4. incoming_quality_control_defined — "yes" / "no" / "not_defined".
        5. materials_supply_details — формулировка о материалах и оборудовании.

        Если данные отсутствуют:
        - статус = "not_defined"
        - текст = "Данные не определены"
        </task>

        <rules>
        - Используй только текст договора.
        - materials_provider:
            - "contractor" — если материалы предоставляет Подрядчик.
            - "customer" — если материалы предоставляет Заказчик.
            - "mixed" — если обеспечение материалами распределено.
            - "not_specified" — если материалы упомянуты, но сторона не определена.
            - "not_defined" — если по тексту это не установлено.
        - equipment_provider:
            - "contractor" — если оборудование предоставляет Подрядчик.
            - "customer" — если оборудование предоставляет Заказчик.
            - "mixed" — если обеспечение оборудованием распределено.
            - "not_specified" — если оборудование упомянуто, но сторона не определена.
            - "not_defined" — если по тексту это не установлено.
        - materials_quality_risk_bearer:
            - "contractor" — если риск качества прямо возложен на Подрядчика.
            - "customer" — если риск качества прямо возложен на Заказчика.
            - "provider_side" — если риск качества несёт сторона,
              предоставившая материалы.
            - "shared" — если риск распределён.
            - "not_defined" — если по тексту это не установлено.
        - incoming_quality_control_defined:
            - "yes" — если прямо предусмотрены входной контроль, проверка,
              испытания, сертификаты или приёмка материалов.
            - "no" — если договор прямо исключает специальную процедуру.
            - "not_defined" — если по тексту это не установлено.
        - materials_supply_details заполняй только по прямому тексту договора.
        - Верни только JSON.
        </rules>
      fields:
        - name: "materials_provider"
          type: "string"
          presentation: "signal"
          label: "Материалы"
          allowed_values: ["contractor", "customer", "mixed", "not_specified", "not_defined"]
          description: "Какая сторона обеспечивает строительство материалами."
          required: true
          display_in_grid: true
          display_priority: 1
        - name: "equipment_provider"
          type: "string"
          presentation: "signal"
          label: "Оборудование"
          allowed_values: ["contractor", "customer", "mixed", "not_specified", "not_defined"]
          description: "Какая сторона обеспечивает строительство оборудованием."
          required: true
          display_in_grid: true
          display_priority: 2
        - name: "materials_quality_risk_bearer"
          type: "string"
          presentation: "signal"
          label: "Риск качества"
          allowed_values: ["contractor", "customer", "provider_side", "shared", "not_defined"]
          description: "На какой стороне риск качества предоставляемых материалов."
          required: true
          display_in_grid: true
          display_priority: 3
        - name: "incoming_quality_control_defined"
          type: "string"
          presentation: "signal"
          label: "Входной контроль"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Есть ли процедура входного контроля качества материалов."
          required: true
          display_in_grid: true
          display_priority: 4
        - name: "materials_supply_details"
          type: "string"
          presentation: "fact"
          label: "Материалы и оборудование"
          description: "Формулировка о предоставлении материалов и оборудования."
          required: true
          display_in_grid: true
          display_priority: 5
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 11: Субподрядчики и ответственность генподрядчика
  # ──────────────────────────────────────────────────────────────────────────
  - id: subcontracting_rights_and_responsibility
    name: "Право привлечения субподрядчиков и ответственность генподрядчика (ст. 706 ГК РФ)"
    description: >
      Фактографическая проверка допустимости привлечения субподрядчиков,
      необходимости их согласования, ответственности генподрядчика
      и требований к перечню субподрядчиков.
    triggers: ~
    ui_mode: "field_extraction"
    severity: "medium"
    severity_if_pass: "pass"
    severity_if_fail: "medium"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "субподрядчик"
        - "право привлекать субподрядчиков"
        - "согласование субподрядчиков"
        - "генподрядчик отвечает"
        - "регрессные требования"
        - "перечень субподрядчиков"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)подрядчик.*вправе.*привлекать.*субподрядчик"
        - "(?i)ст\\.?\\s*706\\s+ГК\\s+РФ"
        - "(?i)согласовани.*субподрядчик"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор строительного подряда по ст. 706 ГК РФ.
        Проверяется только один вопрос: как договор регулирует привлечение
        субподрядчиков и ответственность генподрядчика.

        Нормативный ориентир:
        - ст. 706 ГК РФ

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Допускается ли привлечение субподрядчиков.
        2. Требуется ли согласие Заказчика на привлечение субподрядчиков.
        3. Закреплена ли ответственность генподрядчика / Подрядчика
           за действия субподрядчиков.
        4. Требуется ли перечень субподрядчиков или его согласование.
        5. Как в целом сформулированы условия субподряда.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined".
        4. Если текстового значения нет — возвращай "Данные не определены".
        5. Не используй "None", "null", "not_found" или пустые строки.
        6. subcontracting_mode = "allowed" только если субподряд прямо
           допускается без дополнительных ограничений.
        7. subcontracting_mode = "allowed_with_consent" только если требуется
           согласие или предварительное согласование.
        8. subcontracting_mode = "prohibited" только если субподряд прямо запрещён.
        9. general_contractor_liability = "yes" только если договор прямо
           закрепляет ответственность Подрядчика / генподрядчика
           за действия субподрядчиков.
        10. subcontractor_list_required = "yes" только если договор прямо
            требует перечень субподрядчиков или его согласование.
        11. subcontracting_details заполняй только по прямому тексту договора.
        12. В evidence включай только текст договора.
        13. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — данные определены:
        Фрагмент:
        "Подрядчик вправе привлекать субподрядчиков только с предварительного
        письменного согласия Заказчика. Подрядчик несёт ответственность
        за действия субподрядчиков как за свои собственные. Перечень
        субподрядчиков подлежит согласованию с Заказчиком."

        Ответ:
        {
          "subcontracting_mode": "allowed_with_consent",
          "subcontractor_approval_required": "yes",
          "general_contractor_liability": "yes",
          "subcontractor_list_required": "yes",
          "subcontracting_details": "Привлечение субподрядчиков допускается только с предварительного письменного согласия Заказчика, при этом Подрядчик несёт ответственность за их действия.",
          "evidence": [
            {
              "clause_ref": "п. 5.7",
              "quote": "Подрядчик вправе привлекать субподрядчиков только с предварительного письменного согласия Заказчика. Подрядчик несёт ответственность за действия субподрядчиков как за свои собственные. Перечень субподрядчиков подлежит согласованию с Заказчиком."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Подрядчик выполняет строительные работы в установленный срок."

        Ответ:
        {
          "subcontracting_mode": "not_defined",
          "subcontractor_approval_required": "not_defined",
          "general_contractor_liability": "not_defined",
          "subcontractor_list_required": "not_defined",
          "subcontracting_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о допустимости или запрете субподряда.
        2. Найди прямую цитату о согласовании субподрядчиков.
        3. Найди прямую цитату об ответственности Подрядчика за субподрядчиков.
        4. Найди прямую цитату о перечне субподрядчиков.
        5. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "subcontracting_mode": "<allowed / allowed_with_consent / prohibited / not_defined>",
          "subcontractor_approval_required": "<yes / no / not_defined>",
          "general_contractor_liability": "<yes / no / not_defined>",
          "subcontractor_list_required": "<yes / no / not_defined>",
          "subcontracting_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 680

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
