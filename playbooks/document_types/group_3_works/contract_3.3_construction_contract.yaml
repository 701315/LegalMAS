  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 19: Охрана труда и безопасность на площадке
  # ──────────────────────────────────────────────────────────────────────────
  - id: construction_site_safety
    name: "Охрана труда и безопасность на строительной площадке (ТК РФ)"
    description: >
      Фактографическая проверка того, закреплены ли обязанности по охране труда
      и безопасности работ, какая сторона отвечает за безопасность на площадке,
      предусмотрены ли уведомления о несчастных случаях и требования
      к средствам защиты / инструктажу.
    triggers: ~
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "охрана труда"
        - "безопасность на строительной площадке"
        - "несчастный случай"
        - "ответственность за безопасность"
        - "инструктаж"
        - "средства защиты"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)подрядчик.*обеспечивает.*безопасность.*работ"
        - "(?i)охрана.*труда.*на\\s+объекте"
        - "(?i)несчастн.*случа"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор строительного подряда в части охраны труда
        и безопасности на площадке.
        Проверяется только один вопрос: как распределены обязанности
        по безопасности работ, уведомлению о происшествиях и обеспечению
        средств защиты / инструктажа.

        Нормативный ориентир:
        - Трудовой кодекс РФ
        - правила охраны труда в строительстве

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Закреплены ли обязанности по охране труда и безопасности работ.
        2. Какая сторона отвечает за безопасность на площадке.
        3. Есть ли обязанность уведомлять о несчастных случаях, инцидентах
           или нарушениях безопасности.
        4. Есть ли требования о средствах защиты, инструктаже или аналогичных
           мерах безопасности.
        5. Как в целом сформулирован режим безопасности на площадке.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined".
        4. Если текстового значения нет — возвращай "Данные не определены".
        5. Не используй "None", "null", "not_found" или пустые строки.
        6. safety_obligations_defined = "yes" только если договор прямо
           закрепляет обязанности по охране труда или безопасности.
        7. responsible_party_for_safety определяй только по прямому тексту
           о том, какая сторона отвечает за безопасность.
        8. incident_notification_duty = "yes" только если прямо предусмотрено
           уведомление о несчастных случаях, авариях или инцидентах.
        9. ppe_and_instruction_requirements = "yes" только если прямо
           предусмотрены средства индивидуальной защиты, инструктаж,
           допуски или аналогичные меры.
        10. site_safety_details заполняй только по прямому тексту договора.
        11. В evidence включай только текст договора.
        12. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — данные определены:
        Фрагмент:
        "Подрядчик обеспечивает охрану труда и безопасность работ
        на строительной площадке, проводит инструктаж персонала
        и обеспечивает работников средствами индивидуальной защиты.
        О каждом несчастном случае Подрядчик обязан незамедлительно
        уведомить Заказчика."

        Ответ:
        {
          "safety_obligations_defined": "yes",
          "responsible_party_for_safety": "contractor",
          "incident_notification_duty": "yes",
          "ppe_and_instruction_requirements": "yes",
          "site_safety_details": "Подрядчик обеспечивает охрану труда и безопасность работ, проводит инструктаж и обеспечивает работников средствами индивидуальной защиты.",
          "evidence": [
            {
              "clause_ref": "п. 8.1",
              "quote": "Подрядчик обеспечивает охрану труда и безопасность работ на строительной площадке, проводит инструктаж персонала и обеспечивает работников средствами индивидуальной защиты. О каждом несчастном случае Подрядчик обязан незамедлительно уведомить Заказчика."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Подрядчик выполняет работы в соответствии с графиком."

        Ответ:
        {
          "safety_obligations_defined": "not_defined",
          "responsible_party_for_safety": "not_defined",
          "incident_notification_duty": "not_defined",
          "ppe_and_instruction_requirements": "not_defined",
          "site_safety_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату об охране труда или безопасности.
        2. Найди прямую цитату об ответственной стороне.
        3. Найди прямую цитату об уведомлении об инцидентах.
        4. Найди прямую цитату о средствах защиты или инструктаже.
        5. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "safety_obligations_defined": "<yes / no / not_defined>",
          "responsible_party_for_safety": "<contractor / customer / both / not_defined>",
          "incident_notification_duty": "<yes / no / not_defined>",
          "ppe_and_instruction_requirements": "<yes / no / not_defined>",
          "site_safety_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 660

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "охрана труда безопасность на строительной площадке несчастный случай ответственность за безопасность инструктаж средства защиты"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
      negative_keywords:
        - "КС-2"
        - "КС-3"
        - "гарантийный срок"
        - "неустойка"
        - "аванс"
        - "НДС"
      position_bias:
        preferred_range: [0.20, 0.85]
        boost: 0.18
        scope: segment
      context_k: 5
      max_chunks: 6
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "price_list"
      preferred_clause_functions:
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.14

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 600

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора строительного подряда
        условия об охране труда и безопасности на строительной площадке.
        Не анализируй смету, сроки, гарантию, страхование или экологию.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. safety_obligations_defined — "yes" / "no" / "not_defined".
        2. responsible_party_for_safety — "contractor" / "customer" /
           "both" / "not_defined".
        3. incident_notification_duty — "yes" / "no" / "not_defined".
        4. ppe_and_instruction_requirements — "yes" / "no" / "not_defined".
        5. site_safety_details — формулировка об охране труда и безопасности.

        Если данные отсутствуют:
        - статус = "not_defined"
        - текст = "Данные не определены"
        </task>

        <rules>
        - Используй только текст договора.
        - safety_obligations_defined:
            - "yes" — если договор прямо закрепляет обязанности по охране труда
              или безопасности работ.
            - "no" — если договор прямо исключает специальные положения.
            - "not_defined" — если по тексту это не установлено.
        - responsible_party_for_safety:
            - "contractor" — если безопасность прямо возложена на Подрядчика.
            - "customer" — если безопасность прямо возложена на Заказчика.
            - "both" — если обязанности распределены между сторонами.
            - "not_defined" — если по тексту это не установлено.
        - incident_notification_duty:
            - "yes" — если прямо предусмотрено уведомление о происшествиях.
            - "no" — если договор прямо исключает такое уведомление.
            - "not_defined" — если по тексту это не установлено.
        - ppe_and_instruction_requirements:
            - "yes" — если прямо предусмотрены СИЗ, инструктаж,
              допуски или аналогичные меры.
            - "no" — если договор прямо исключает такие специальные требования.
            - "not_defined" — если по тексту это не установлено.
        - site_safety_details заполняй только по прямому тексту договора.
        - Верни только JSON.
        </rules>
      fields:
        - name: "safety_obligations_defined"
          type: "string"
          presentation: "signal"
          label: "Охрана труда"
