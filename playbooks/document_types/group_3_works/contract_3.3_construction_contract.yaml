          label: "Срок отказа"
          description: >
            Срок для направления мотивированного отказа от приёмки. Fallback: "Не установлено" / "Не удалось определить".
          display_in_grid: true
          display_priority: 1
          required: true

        - name: "auto_acceptance"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          display_in_grid: false
          required: true

          description: Внутреннее enum-поле.
        - name: "unilateral_signing_allowed"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          display_in_grid: false
          required: true

          description: Внутреннее enum-поле.
        - name: "acceptance_summary"
          type: "string"
          presentation: "fact"
          label: "Порядок приёмки"
          description: >
            Сводка: формы документов, наличие автоматической приёмки и право на односторонний акт. Fallback: "Не установлено" / "Не удалось определить".
          display_in_grid: true
          display_priority: 2
          required: true

        - name: "acceptance_docs_details"
          label: "Перечень приемочных документов (КС-2, КС-3)"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          required: true

          description: >
            Fallback: "Не установлено" / "Не удалось определить".
      store_payload: true

  - id: materials_supply_responsibility
    name: "Обеспечение строительства материалами и оборудованием, риск качества и входной контроль"
    description: >
      Фактографическая проверка того, какая сторона обеспечивает строительство
      материалами и оборудованием (включая давальческую схему), на ком лежит риск
      качества поставляемых материалов и предусмотрена ли процедура входного
      контроля качества поступающих на объект ресурсов (ст. 745 ГК РФ, СП 48.13330).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "материалы обеспечивает подрядчик"
        - "материалы предоставляет заказчик"
        - "давальческие материалы"
        - "давальческое сырье"
        - "оборудование заказчика"
        - "ответственность за качество материалов"
        - "приёмка материалов"
        - "входной контроль"
        - "контроль качества поступающих материалов"
        - "сертификаты соответствия"
        - "паспорта качества"
        - "накладная М-15"
        - "отчет об израсходовании материалов"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(материал|оборудование).*(обеспечивает|предоставляет).*(подрядчик|заказчик)"
        - "(?i)давальческ(ие|их|ого)\\s+материал"
        - "(?i)входн.*контрол"
        - "(?i)ст\\.?\\s*745\\s+ГК\\s+РФ"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор строительного подряда по ст. 745 ГК РФ и СП 48.13330 (организация строительства).
        Проверяется только один вопрос: кто обеспечивает стройку материалами и оборудованием, кто несёт риск их качества и предусмотрен ли входной контроль на объекте.

        Нормативный ориентир:
        - ст. 745 ГК РФ (обязанность поставки материалов и оборудования)
        - СП 48.13330 / ГОСТ 24297-2013 (входной контроль материалов и конструкций)

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Юрист будет использовать результат в сравнительной таблице.
        - Учитывай давальческую схему: материалы Заказчика передаются Подрядчику по накладной, Подрядчик предоставляет отчет об их использовании и отвечает за сохранность.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Какая сторона обеспечивает строительство материалами (Подрядчик, Заказчик, смешанный порядок).
        2. Какая сторона обеспечивает строительство оборудованием (монтируемым / технологическим).
        3. На какой стороне лежит риск качества и недостатков предоставленных материалов.
        4. Предусмотрена ли процедура входного контроля качества материалов Подрядчиком.
        5. Сформируй две сводки: (а) по поставке материалов и оборудования, (б) по входному контролю и распределению рисков качества.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона вместо текста договора.
        2. Если условие не указано прямо — возвращай "not_defined" для статусов и "Данные не определены" для текста.
        3. Не используй "None", "null", "not_defined" или пустые строки в JSON-значениях.
        4. materials_provider / equipment_provider: "contractor" (Подрядчик), "customer" (Заказчик / давальческие), "mixed" (часть Заказчик, часть Подрядчик), "not_specified" (упомянуто, но сторона не названа).
        5. incoming_quality_control_defined = "yes" только если в тексте прямо упомянут входной контроль, проверка сертификатов/паспортов качества или испытание поступающих материалов.
        6. В evidence включай только точные цитаты из текста договора.
        7. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        со всеми 7 ключами.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — данные определены:
        Фрагмент:
        "Подрядчик обеспечивает строительство материалами и оборудованием, за исключением технологического оборудования, поставляемого Заказчиком по накладной. За качество материалов отвечает сторона, их предоставившая. Подрядчик обязан осуществлять входной контроль всех поступающих материалов и проверку паспортов качества."

        Ответ:
        {
          "materials_provider": "contractor",
          "equipment_provider": "mixed",
          "materials_quality_risk_bearer": "provider_side",
          "incoming_quality_control_defined": "yes",
          "materials_supply_summary": "Материалы поставляет Подрядчик; технологическое оборудование — Заказчик (смешанный порядок).",
          "incoming_control_and_risk_summary": "Входной контроль Подрядчиком обязателен; риск качества несёт сторона-поставщик.",
          "materials_supply_details": "Подрядчик обеспечивает строительство материалами и оборудованием, кроме технологического оборудования Заказчика; входной контроль осуществляет Подрядчик.",
          "evidence": [
            {
              "clause_ref": "п. 4.1",
              "quote": "Подрядчик обеспечивает строительство материалами и оборудованием, за исключением технологического оборудования, поставляемого Заказчиком по накладной. За качество материалов отвечает сторона, их предоставившая. Подрядчик обязан осуществлять входной контроль всех поступающих материалов..."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Подрядчик выполняет работы в соответствии с проектной документацией."

        Ответ:
        {
          "materials_provider": "not_defined",
          "equipment_provider": "not_defined",
          "materials_quality_risk_bearer": "not_defined",
          "incoming_quality_control_defined": "not_defined",
          "materials_supply_summary": "Не установлено",
          "incoming_control_and_risk_summary": "Не установлено",
          "materials_supply_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о предоставлении материалов.
        2. Найди прямую цитату о предоставлении оборудования.
        3. Найди прямую цитату о риске качества материалов.
        4. Найди прямую цитату о входном контроле.
        5. Если прямой цитаты нет — верни "not_defined" / "Данные не определены".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "materials_provider": "<contractor / customer / mixed / not_specified / not_defined>",
          "equipment_provider": "<contractor / customer / mixed / not_specified / not_defined>",
          "materials_quality_risk_bearer": "<contractor / customer / provider_side / shared / not_defined>",
          "incoming_quality_control_defined": "<yes / no / not_defined>",
          "materials_supply_summary": "<краткая сводка: кто поставляет материалы и оборудование>",
          "incoming_control_and_risk_summary": "<краткая сводка: входной контроль и риски брака>",
          "materials_supply_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 850

    retrieval:
      retrieval_profile: "scope_of_work_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "материалы обеспечивает подрядчик материалы предоставляет заказчик давальческие материалы оборудование заказчика ответственность за качество материалов приемка материалов входной контроль качества СП 48.13330"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
      negative_keywords:
        - "гарантийный срок"
        - "КС-2"
        - "КС-3"
        - "неустойка"
        - "НДС"
        - "СРО"
      position_bias:
        preferred_range: [0.15, 0.75]
        boost: 0.20
        scope: segment
      context_k: 5
      max_chunks: 6
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
        - "technical_specification"
      excluded_segment_types:
        - "price_list"
      preferred_clause_functions:
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.14

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"

      compact_output: false

      presence_signal:
        field: "materials_supply_responsibility_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_max_tokens: 1100

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора строительного подряда
        сведения о поставке материалов и оборудования, давальческом сырье,
        риске качества и процедуре входного контроля на объекте.
        Не анализируй смету, сроки, гарантию, страхование или экологию.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. materials_supply_responsibility_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (materials_provider, equipment_provider, materials_quality_risk_bearer,
              incoming_quality_control_defined) ≠ "not_defined";
           - "missing" — если все содержательные поля = "not_defined" (или "no");
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - materials_provider = "not_defined";
           - equipment_provider = "not_defined";
           - materials_quality_risk_bearer = "not_defined";
           - incoming_quality_control_defined = "not_defined";
           - materials_supply_details = "Данные не определены";
           - materials_supply_summary, incoming_control_and_risk_summary = "Не установлено";
           - не выполняй остальные шаги.

        1. materials_provider:
           "contractor" / "customer" / "mixed" / "not_specified" / "not_defined".

        2. equipment_provider:
           "contractor" / "customer" / "mixed" / "not_specified" / "not_defined".

        3. materials_quality_risk_bearer:
           "contractor" / "customer" / "provider_side" / "shared" / "not_defined".

        4. incoming_quality_control_defined:
           "yes" / "no" / "not_defined".

        5. materials_supply_summary:
           Краткая user-facing сводка по поставке материалов и оборудования.
           Примеры: "Материалы и оборудование поставляет Подрядчик." / 
           "Материалы Заказчика (давальческие), оборудование Подрядчика." / "Не установлено".

        6. incoming_control_and_risk_summary:
           Краткая user-facing сводка по входному контролю и рискам.
           Примеры: "Входной контроль Подрядчиком обязателен; риск брака на стороне-поставщике." / "Не установлено".

        7. materials_supply_details:
           Подробная формулировка условий поставки и контроля, или "Данные не определены".
        </task>

        <context_rules>
        - Перед остальными полями заполни materials_supply_responsibility_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все содержательные сигнальные поля = "not_defined", текстовые поля = "Данные не определены", сводные поля (summary) = "Не установлено".
        - Используй только текст договора из <context>.
        - Не подставляй данные из нормативных актов или общих знаний.
        - materials_provider:
          - "contractor" — если материалы полностью предоставляет Подрядчик.
          - "customer" — если материалы предоставляет Заказчик (давальческая схема).
          - "mixed" — если обеспечение разделено между сторонами.
          - "not_specified" — поставка упомянута, но сторона не названа.
          - "not_defined" — условие отсутствует в тексте.
        - equipment_provider:
          - "contractor" — если оборудование поставляет Подрядчик.
          - "customer" — если технологическое/инженерное оборудование поставляет Заказчик.
          - "mixed" — раздельная поставка оборудования.
          - "not_specified" — оборудование упомянуто, но поставщик не назван.
          - "not_defined" — условие отсутствует в тексте.
        - materials_quality_risk_bearer:
          - "provider_side" — если за качество отвечает сторона, предоставившая материал.
          - "contractor" — если Подрядчик отвечает за любые материалы независимо от поставщика.
          - "customer" — если риск брака на Заказчике.
          - "shared" — риск распределен.
          - "not_defined" — вопрос не урегулирован.
        - incoming_quality_control_defined:
          - "yes" — если предусмотрена проверка сертификатов, входной контроль качества по СП 48.13330 или освидетельствование поступающих ресурсов.
          - "no" — если входной контроль прямо исключен.
          - "not_defined" — процедура прямо не упомянута.
        - Запрещено использовать null, None, "N/A" или пустые строки.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В договоре нет положений о предоставлении материалов, давальческом сырье или входном контроле.
           → presence = "missing"; все содержательные статусы = "not_defined"; все текстовые поля = "Данные не определены".

        2. Полностью давальческие материалы.
           "Строительство осуществляется исключительно из материалов и оборудования, предоставленных Заказчиком".
           → presence = "present"; materials_provider = "customer"; equipment_provider = "customer"; materials_supply_summary = "Материалы и оборудование предоставляет Заказчик (давальческая схема)".

        3. Противоречие между фрагментами.
           В разделе 4 сказано: "Подрядчик выполняет работы из своих материалов", а в приложении: "Материалы поставляет Заказчик".
           → presence = "unclear"; materials_provider = "not_defined"; materials_supply_details = "Не удалось определить".

        4. Отсутствие регулирования входного контроля при наличии поставки.
           Материалы закупает Подрядчик, но процедура проверки паспортов/сертификатов на объекте не описана.
           → presence = "present"; incoming_quality_control_defined = "not_defined"; incoming_control_and_risk_summary = "Входной контроль Подрядчиком прямо не регламентирован".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для materials_supply_responsibility_presence используй только: "present", "missing", "unclear".
        - Для статусных полей используй только значения из allowed_values.
        - Fallback при отсутствии данных: все текстовые значения → "Данные не определены".
        - Fallback при противоречии или неоднозначности: все текстовые значения → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "materials_supply_responsibility_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по обеспечению материалами и контролю качества. Внутреннее агрегатное signal-поле."
          required: true

        - name: "materials_provider"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["contractor", "customer", "mixed", "not_specified", "not_defined"]
          description: "Какая сторона обеспечивает строительство материалами. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "equipment_provider"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["contractor", "customer", "mixed", "not_specified", "not_defined"]
          description: "Какая сторона обеспечивает строительство оборудованием. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "materials_quality_risk_bearer"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["contractor", "customer", "provider_side", "shared", "not_defined"]
          description: "На какой стороне риск качества предоставляемых материалов. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "incoming_quality_control_defined"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Есть ли процедура входного контроля качества материалов. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "materials_supply_summary"
          type: "string"
          presentation: "fact"
          label: "Материалы и оборудование"
          description: >
            Сводка: кто обеспечивает стройку материалами и оборудованием (включая давальческую схему). Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "incoming_control_and_risk_summary"
          type: "string"
          presentation: "fact"
          label: "Входной контроль и риски"
          description: >
            Сводка: процедура входного контроля Подрядчиком и распределение риска некачественных материалов. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "materials_supply_details"
          label: "Обязанности по поставке материалов и оборудования"
          type: "string"
          presentation: "fact"
          description: >
            Формулировка о предоставлении материалов и оборудования. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: false

      store_payload: true

  - id: subcontracting_rights_and_responsibility
    name: "Право привлечения субподрядчиков и ответственность генподрядчика (ст. 706 ГК РФ)"
    description: >
      Фактографическая проверка допустимости привлечения субподрядчиков,
      необходимости их согласования, ответственности генподрядчика
      и требований к перечню субподрядчиков.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "medium"
    severity_if_pass: "pass"
    severity_if_fail: "medium"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "субподрядчик"
        - "право привлекать субподрядчиков"
        - "согласование субподрядчиков"
        - "генподрядчик отвечает"
        - "регрессные требования"
        - "перечень субподрядчиков"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)подрядчик.*вправе.*привлекать.*субподрядчик"
        - "(?i)ст\\.?\\s*706\\s+ГК\\s+РФ"
        - "(?i)согласовани.*субподрядчик"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор строительного подряда по ст. 706 ГК РФ.
        Проверяется только один вопрос: как договор регулирует привлечение
        субподрядчиков и ответственность генподрядчика.

        Нормативный ориентир:
        - ст. 706 ГК РФ

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Допускается ли привлечение субподрядчиков.
        2. Требуется ли согласие Заказчика на привлечение субподрядчиков.
        3. Закреплена ли ответственность генподрядчика / Подрядчика
           за действия субподрядчиков.
        4. Требуется ли перечень субподрядчиков или его согласование.
        5. Как в целом сформулированы условия субподряда.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined".
        4. Если текстового значения нет — возвращай "Данные не определены".
        5. Не используй "None", "null", "not_defined" или пустые строки.
        6. subcontracting_mode = "allowed" только если субподряд прямо
           допускается без дополнительных ограничений.
        7. subcontracting_mode = "allowed_with_consent" только если требуется
           согласие или предварительное согласование.
        8. subcontracting_mode = "prohibited" только если субподряд прямо запрещён.
        9. general_contractor_liability = "yes" только если договор прямо
           закрепляет ответственность Подрядчика / генподрядчика
           за действия субподрядчиков.
        10. subcontractor_list_required = "yes" только если договор прямо
            требует перечень субподрядчиков или его согласование.
        11. subcontracting_details заполняй только по прямому тексту договора.
        12. В evidence включай только текст договора.
        13. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — данные определены:
        Фрагмент:
        "Подрядчик вправе привлекать субподрядчиков только с предварительного
        письменного согласия Заказчика. Подрядчик несёт ответственность
        за действия субподрядчиков как за свои собственные. Перечень
        субподрядчиков подлежит согласованию с Заказчиком."

        Ответ:
        {
          "subcontracting_mode": "allowed_with_consent",
          "subcontractor_approval_required": "yes",
          "general_contractor_liability": "yes",
          "subcontractor_list_required": "yes",
          "subcontracting_details": "Привлечение субподрядчиков допускается только с предварительного письменного согласия Заказчика, при этом Подрядчик несёт ответственность за их действия.",
          "evidence": [
            {
              "clause_ref": "п. 5.7",
              "quote": "Подрядчик вправе привлекать субподрядчиков только с предварительного письменного согласия Заказчика. Подрядчик несёт ответственность за действия субподрядчиков как за свои собственные. Перечень субподрядчиков подлежит согласованию с Заказчиком."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Подрядчик выполняет строительные работы в установленный срок."

        Ответ:
        {
          "subcontracting_mode": "not_defined",
          "subcontractor_approval_required": "not_defined",
          "general_contractor_liability": "not_defined",
          "subcontractor_list_required": "not_defined",
          "subcontracting_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о допустимости или запрете субподряда.
        2. Найди прямую цитату о согласовании субподрядчиков.
        3. Найди прямую цитату об ответственности Подрядчика за субподрядчиков.
        4. Найди прямую цитату о перечне субподрядчиков.
        5. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "subcontracting_mode": "<allowed / allowed_with_consent / prohibited / not_defined>",
          "subcontractor_approval_required": "<yes / no / not_defined>",
          "general_contractor_liability": "<yes / no / not_defined>",
          "subcontractor_list_required": "<yes / no / not_defined>",
          "subcontracting_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 680

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "субподрядчик право привлекать субподрядчиков согласование субподрядчиков генподрядчик отвечает перечень субподрядчиков"
      retrieval_profile: "subcontracting_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
      negative_keywords:
        - "КС-2"
        - "КС-3"
        - "гарантийный срок"
        - "неустойка"
