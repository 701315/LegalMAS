      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора строительного подряда
        условия об освидетельствовании скрытых работ (АОСР), сроке уведомления Заказчика
        и обязанности Подрядчика вскрыть конструкции за свой счет при нарушении процедуры.
        Не анализируй смету, сроки, гарантию, страхование или экологию.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 8 полей:

        1. hidden_works_certification_present — "yes" / "no" / "not_defined".
        2. certification_before_covering — "yes" / "no" / "not_defined".
        3. hidden_works_act_required — "yes" / "no" / "not_defined".
        4. work_log_reference — "yes" / "no" / "not_defined".
        5. advance_notice_period_defined — "yes" / "no" / "not_defined".
        6. uncovering_at_contractor_expense — "yes" / "no" / "not_defined".
        7. hidden_works_summary — краткая user-facing сводка по процедуре скрытых работ.
           Примеры: "АОСР обязателен до закрытия; уведомление Заказчика за 2 рабочих дня; 
           при закрытии без вызова — вскрытие за счет Подрядчика." / 
           "Освидетельствование скрытых работ не урегулировано." / "Не установлено".
        8. hidden_works_procedure_details — подробная формулировка условий освидетельствования.
        </task>

        <context_rules>
        - Используй только текст договора из <context>.
        - Если раздела о скрытых работах нет в контексте — верни все статусы как "not_defined",
        hidden_works_summary как "Не установлено", hidden_works_procedure_details как "Данные не определены".
        - hidden_works_certification_present:
        - "yes" — если договор прямо предусматривает освидетельствование скрытых работ.
        - "no" — если договор прямо исключает такую процедуру.
        - "not_defined" — условие отсутствует в тексте.
        - certification_before_covering:
        - "yes" — если освидетельствование должно быть проведено до закрытия последующими работами.
        - "no" — если договор прямо допускает иное.
        - "not_defined" — вопрос не урегулирован.
        - hidden_works_act_required:
        - "yes" — если прямо предусмотрен отдельный акт освидетельствования (АОСР).
        - "no" — если акт прямо исключен.
        - "not_defined" — вопрос не урегулирован.
        - work_log_reference:
        - "yes" — если журнал производства работ или аналогичная фиксация прямо упомянуты.
        - "no" — если журнал прямо исключен.
        - "not_defined" — вопрос не урегулирован.
        - advance_notice_period_defined:
        - "yes" — если прямо указан срок предварительного уведомления / вызова Заказчика
        (например, за 24 часа, 48 часов, 2 рабочих дня).
        - "no" — если срок прямо исключен.
        - "not_defined" — вопрос не урегулирован.
        - uncovering_at_contractor_expense:
        - "yes" — если Подрядчик обязан вскрыть скрытые работы за свой счет при закрытии
        без освидетельствования / без вызова Заказчика.
        - "no" — если обязанность прямо исключена.
        - "not_defined" — вопрос не урегулирован.
        - Верни строго JSON со всеми 8 ключами. Запрещены null, None, "N/A" или пустые строки.
        </context_rules>

        <output_expectations>
        - Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        - Не используй markdown fences.
        - Не добавляй пояснения до или после JSON.
        - Верни все ключи, перечисленные в task, без пропусков.
        - Не используй null, None или пустые строки.
        - Для статусных полей используй только значения из allowed_values или "not_defined".
        - Для текстовых полей при отсутствии данных используй "Данные не определены" / "Не удалось определить" / "Не применимо" — согласно правилам выше.
        </output_expectations>

        <output_expectations>
        {
          "hidden_works_certification_present": "yes | no | not_defined",
          "certification_before_covering": "yes | no | not_defined",
          "hidden_works_act_required": "yes | no | not_defined",
          "work_log_reference": "yes | no | not_defined",
          "advance_notice_period_defined": "yes | no | not_defined",
          "uncovering_at_contractor_expense": "yes | no | not_defined",
          "hidden_works_summary": "string",
          "hidden_works_procedure_details": "string",
          "evidence": [{"clause_ref": "string", "quote": "string"}]
        }
        </output_expectations>

      fields:
        - name: "hidden_works_certification_present"
