  - id: site_security_and_preservation
    name: "Охрана площадки и сохранность работ, материалов и оборудования"
    description: >
      Фактографическая проверка распределения обязанностей по организации охраны 
      строительной площадки, пропускного режима, а также риска хищения, утраты 
      или порчи материалов, оборудования и уже выполненных работ до момента их приёмки.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "охрана площадки"
        - "сторожевая охрана"
        - "пропускной режим"
        - "хищение материалов"
        - "сохранность работ"
        - "риск утраты"
        - "порча оборудования"
        - "видеонаблюдение"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)охран.*строй.*площад"
        - "(?i)риск.*хищени|утрат|порч"
        - "(?i)сохранност.*материал|работ|оборудован"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор строительного подряда.
        Проверяется: кто организует охрану площадки и на ком лежит риск хищения/утраты материалов и выполненных работ до приёмки.
        
        Важно: Различай "случайную гибель" (пожар, ураган — это другой чек) и "хищение/порчу" (кража, вандализм — это данный чек).

        [ЗАДАЧА]
        1. Обязана ли какая-то сторона организовать охрану площадки/периметра.
        2. На ком лежит риск хищения, утраты или порчи материалов и оборудования на площадке.
        3. Есть ли обязанность Подрядчика обеспечить сохранность уже выполненных работ до приёмки.
        4. Сформируй краткую сводку по охране и сохранности.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона.
        2. Если условие не указано прямо — возвращай "not_defined" для статусов и "Данные не определены" для текста.
        3. Если данных по охране нет вообще — для summary возвращай строго "Не установлено".
        4. Не используй "None", "null", "N/A" или пустые строки.
        5. В evidence включай только точные цитаты из текста договора.
        6. Верни строго один JSON-объект ровно с 5 ключами. Не добавляй и не пропускай ключи.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — данные определены:
        Фрагмент:
        "Подрядчик за свой счет организует круглосуточную сторожевую охрану площадки и видеонаблюдение. 
        Риск хищения и порчи материалов, доставленных на площадку, до момента их монтажа несет Подрядчик."

        Ответ:
        {
          "security_obligation_defined": "yes",
          "theft_risk_bearer": "contractor",
          "preservation_obligation_defined": "yes",
          "site_security_summary": "Подрядчик организует круглосуточную охрану и видеонаблюдение; риск хищения материалов до монтажа несет Подрядчик.",
          "site_security_details": "Подрядчик за свой счет организует круглосуточную сторожевую охрану площадки и видеонаблюдение. Риск хищения и порчи материалов до момента их монтажа несет Подрядчик.",
          "evidence": [
            {
              "clause_ref": "п. 9.1",
              "quote": "Подрядчик за свой счет организует круглосуточную сторожевую охрану площадки и видеонаблюдение. Риск хищения и порчи материалов, доставленных на площадку, до момента их монтажа несет Подрядчик."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Подрядчик обязуется выполнить работы по устройству фундамента."

        Ответ:
        {
          "security_obligation_defined": "not_defined",
          "theft_risk_bearer": "not_defined",
          "preservation_obligation_defined": "not_defined",
          "site_security_summary": "Не установлено",
          "site_security_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату об организации охраны площадки.
        2. Найди прямую цитату о стороне, несущей риск хищения/порчи.
        3. Найди прямую цитату о сохранности выполненных работ.
        4. Если прямой цитаты нет — верни "not_defined" / "Данные не определены" / "Не установлено".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "security_obligation_defined": "<yes / no / not_defined>",
          "theft_risk_bearer": "<contractor / customer / not_defined>",
          "preservation_obligation_defined": "<yes / no / not_defined>",
          "site_security_summary": "<краткая сводка или 'Не установлено'>",
          "site_security_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 900

    retrieval:
      preferred_clause_functions:
        - obligations
        - procedures
      retrieval_profile: "security_check"
      corpus_scope: "primary_segment"
      levels: ["legal_unit", "section"]
      required_kind: "legal_unit"
      retrieval_query: "охрана площадки сторожевая охрана пропускной режим хищение материалов сохранность работ риск утраты порча оборудования видеонаблюдение"
      preferred_unit_types: ["obligation", "general_provision"]
      excluded_unit_types: ["definition", "technical_fragment"]
      negative_keywords: ["КС-2", "КС-3", "гарантийный срок", "неустойка", "НДС"]
      position_bias: { preferred_range: [0.20, 0.80], boost: 0.18, scope: segment }
      context_k: 5
      max_chunks: 6
      rerank: true

    enrichment_hints:
      preferred_segment_types: ["contract", "amendment"]
      excluded_segment_types: ["price_list"]
      preferred_clause_functions: ["obligations"]
      confidence_bonus_on_match: 0.10

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 1100
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора условия об охране строительной площадки, 
        пропускном режиме и распределении рисков хищения, утраты или порчи материалов и выполненных работ.
        Не анализируй смету, сроки, гарантию, страхование или экологию.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 5 полей:
        1. security_obligation_defined — "yes" / "no" / "not_defined".
        2. theft_risk_bearer — "contractor" / "customer" / "not_defined".
        3. preservation_obligation_defined — "yes" / "no" / "not_defined".
        4. site_security_summary — краткая user-facing сводка (кто охраняет, кто несет риск хищения).
        5. site_security_details — подробная формулировка условий.
        </task>

        <context_rules>
        - Используй только текст договора из <context>.
        - Если раздела об охране нет в контексте — верни статусы как "not_defined",
        site_security_summary как "Не установлено", site_security_details как "Данные не определены".
        - theft_risk_bearer:
        - "contractor" — если Подрядчик отвечает за кражу/порчу.
        - "customer" — если Заказчик несет риск.
        - "not_defined" — если не указано.
        - Верни строго один JSON-объект ровно с 5 ключами. Не добавляй и не пропускай ключи.
        - Запрещены null, None, "N/A" или пустые строки.
        </context_rules>

        <output_expectations>
        - Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        - Не используй markdown fences.
        - Не добавляй пояснения до или после JSON.
        - Верни все ключи, перечисленные в task, без пропусков.
        - Не используй null, None или пустые строки.
        - Для статусных полей используй только значения из allowed_values или "not_defined".
        - Для текстовых полей при отсутствии данных используй "Данные не определены" / "Не удалось определить" / "Не применимо" — согласно правилам выше.
        </output_expectations>

        <output_expectations>
        {
          "security_obligation_defined": "yes | no | not_defined",
          "theft_risk_bearer": "contractor | customer | not_defined",
          "preservation_obligation_defined": "yes | no | not_defined",
          "site_security_summary": "string",
          "site_security_details": "string",
          "evidence": [{"clause_ref": "string", "quote": "string"}]
        }
        </output_expectations>

      fields:
        - name: "security_obligation_defined"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Закреплена ли обязанность организации охраны площадки."
          required: true
          display_in_grid: false
        - name: "theft_risk_bearer"
          type: "string"
          presentation: "signal"
          allowed_values: ["contractor", "customer", "not_defined"]
          description: "На ком лежит риск хищения, утраты или порчи материалов и оборудования."
          required: true
          display_in_grid: false
        - name: "preservation_obligation_defined"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Есть ли обязанность обеспечить сохранность выполненных работ до приёмки."
          required: true
          display_in_grid: false
        - name: "site_security_summary"
          type: "string"
          presentation: "fact"
          label: "Охрана и сохранность"
          description: "Сводка: организация охраны площадки, риск хищения материалов и сохранность выполненных работ."
          required: true
          display_in_grid: true
          display_priority: 1
        - name: "site_security_details"
          type: "string"
          presentation: "fact"
          description: "Подробная формулировка об охране и рисках утраты."
          required: true
          display_in_grid: false
      store_payload: true

  - id: temporary_facilities_and_site_prep
    name: "Временные здания и сооружения (ВТиС) и подготовка площадки"
