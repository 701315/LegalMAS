        - "contractor" — если Подрядчик создает ВТиС (бытовки, штабы, временные дороги).
        - "customer" — если Заказчик обеспечивает ВТиС.
        - "not_defined" — если не указано.
        - temporary_utilities_responsibility:
        - "contractor" — если Подрядчик обеспечивает временное подключение к сетям.
        - "customer" — если Заказчик обеспечивает временное подключение.
        - "not_defined" — если не указано.
        - dismantling_obligation:
        - "yes" — если прямо предусмотрена обязанность демонтажа ВТиС после завершения работ.
        - "no" — если договор прямо исключает такую обязанность.
        - "not_defined" — если не указано.
        - Верни строго один JSON-объект ровно с 6 ключами. Не добавляй и не пропускай ключи.
        - Запрещены null, None, "N/A" или пустые строки.
        </context_rules>

        <output_expectations>
        - Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        - Не используй markdown fences.
        - Не добавляй пояснения до или после JSON.
        - Верни все ключи, перечисленные в task, без пропусков.
        - Не используй null, None или пустые строки.
        - Для статусных полей используй только значения из allowed_values или "not_defined".
        - Для текстовых полей при отсутствии данных используй "Данные не определены" / "Не удалось определить" / "Не применимо" — согласно правилам выше.
        </output_expectations>

        <output_expectations>
        {
          "site_prep_responsibility": "contractor | customer | not_defined",
          "temporary_facilities_responsibility": "contractor | customer | not_defined",
          "temporary_utilities_responsibility": "contractor | customer | not_defined",
          "dismantling_obligation": "yes | no | not_defined",
          "site_prep_summary": "string",
          "site_prep_details": "string",
          "evidence": [{"clause_ref": "string", "quote": "string"}]
        }
        </output_expectations>

      fields:
        - name: "site_prep_responsibility"
          type: "string"
          presentation: "signal"
          allowed_values: ["contractor", "customer", "not_defined"]
          description: "Кто выполняет подготовку площадки (ограждение, планировка)."
