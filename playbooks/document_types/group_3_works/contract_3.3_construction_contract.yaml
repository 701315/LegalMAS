        Важно: ВТиС — это значительные расходы. Фиксируй, заложены ли они в обязанности Подрядчика или Заказчик обязан предоставить готовую площадку.

        [ЗАДАЧА]
        1. Кто обязан выполнить подготовку площадки (ограждение, планировка).
        2. Кто создает ВТиС (бытовки, штабы, временные дороги).
        3. Кто обеспечивает временное подключение к инженерным сетям (вода, электричество).
        4. Есть ли обязанность по демонтажу ВТиС и вывозу мусора после работ.
        5. Сформируй сводку по ВТиС и подготовке.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона.
        2. Если условие не указано прямо — возвращай "not_defined" для статусов и "Данные не определены" для текста.
        3. Если данных по ВТиС нет вообще — для summary возвращай строго "Не установлено".
        4. Не используй "None", "null", "N/A" или пустые строки.
        5. В evidence включай только точные цитаты из текста договора.
        6. Верни строго один JSON-объект ровно со всеми ключами. Не добавляй и не пропускай ключи.

        [П ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — данные определены:
        Фрагмент:
        "Заказчик обязан за свой счет выполнить планировку площадки и обеспечить временное подключение электроэнергии. 
        Подрядчик за счет сметы создает временные здания и сооружения (бытовки, ограждение) и обязуется демонтировать их 
