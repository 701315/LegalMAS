            Лицо, подписывающее договор от имени Заказчика. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: false

        - name: "customer_signatory_basis"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["charter", "poa", "order", "personal", "other", "not_defined"]
