        условия о праве Подрядчика на удержание результата работ до полной оплаты
        (ст. 712 ГК РФ), а также об отказе от этого права.
        Не анализируй смету, сроки, гарантию, страхование или экологию.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. contractor_retention_right_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (retention_right_defined, retention_right_waived, retention_scope) ≠ "not_defined";
           - "missing" — если все содержательные поля = "not_defined" (или "no");
