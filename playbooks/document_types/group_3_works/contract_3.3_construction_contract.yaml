             вывод невозможен.

           Если presence = "missing":
           - warning_obligation_defined = "not_defined";
           - warning_scope = "not_defined";
           - warning_procedure = "not_defined";
           - consequence_of_failure_to_warn = "not_defined";
           - warning_details = "Данные не определены";
           - warning_summary = "Не установлено";
           - не выполняй остальные шаги.

        1. warning_obligation_defined:
           "yes" / "no" / "not_defined".

        2. warning_scope:
           "materials" / "docs" / "instructions" / "all" / "not_defined".

        3. warning_procedure:
           "written" / "immediate" / "not_defined".

        4. consequence_of_failure_to_warn:
           "loss_of_claims" / "contractor_liability" / "not_defined".

        5. warning_summary:
           Краткая сводка.
           Примеры: "Подрядчик обязан немедленно письменно предупредить Заказчика о непригодности материалов, ПД и ошибочных указаниях; при несообщении теряет право ссылаться." / "Не установлено".

        6. warning_details:
           Подробная формулировка, или "Данные не определены".
        </task>

        <context_rules>
        - Перед остальными полями заполни contractor_warning_obligation_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все содержательные сигнальные поля = "not_defined", warning_details = "Данные не определены", warning_summary = "Не установлено".
        - Используй только текст договора из <context>.
        - Не подставляй данные из нормативных актов или общих знаний.
        - warning_obligation_defined:
          - "yes" — если договор прямо закрепляет обязанность Подрядчика предупредить Заказчика.
          - "no" — если договор прямо исключает такую обязанность.
          - "not_defined" — вопрос не урегулирован.
        - warning_scope:
          - "materials" — только материалы и оборудование.
          - "docs" — только техническая документация и ПД.
          - "instructions" — только указания Заказчика.
          - "all" — все перечисленные категории.
          - "not_defined" — не урегулировано.
        - warning_procedure:
          - "written" — требуется письменное уведомление.
          - "immediate" — требуется немедленное уведомление (без уточнения формы).
          - "not_defined" — не урегулировано.
        - consequence_of_failure_to_warn:
          - "loss_of_claims" — Подрядчик теряет право ссылаться на обстоятельства, о которых не предупредил.
          - "contractor_liability" — Подрядчик несёт ответственность за последствия.
          - "not_defined" — не урегулировано.
        - Запрещено использовать null, None, "N/A" или пустые строки.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
