        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о КС-2.
        2. Найди прямую цитату о КС-3.
        3. Найди прямую цитату о сроке мотивированного отказа.
        4. Найди прямую цитату об автоматической приёмке.
        5. Найди прямую цитату об одностороннем подписании акта.
        6. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни только JSON.

