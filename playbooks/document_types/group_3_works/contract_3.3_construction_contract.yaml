           → presence = "unclear"; consequence_of_failure_to_warn = "not_defined"; warning_details = "Не удалось определить".

        4. Обязанность с приостановкой работ.
           Подрядчик обязан немедленно приостановить работу и уведомить Заказчика письменно при обнаружении ошибок в ПД.
           → presence = "present"; warning_obligation_defined = "yes"; warning_procedure = "written"; warning_scope = "docs".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для contractor_warning_obligation_presence используй только: "present", "missing", "unclear".
        - Для статусных полей используй только значения из allowed_values.
        - Fallback при отсутствии данных: все текстовые значения → "Данные не определены".
        - Fallback при противоречии или неоднозначности: все текстовые значения → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

