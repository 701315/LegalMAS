  - id: environmental_obligations_check
    name: "Экологические обязательства: отходы, рекультивация, ОВОС (ФЗ-89, ФЗ-7)"
    description: >
      Фактографическая проверка условий об обращении со строительными отходами 
      (вывоз, утилизация, лицензии), распределении ответственности за отходы, 
      рекультивации земель, восстановлении территории и ссылках на экологические 
      разрешения или требования (ОВОС, ПДВ, СЗЗ).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "строительные отходы"
        - "утилизация отходов"
        - "рекультивация"
        - "экологические требования"
        - "охрана окружающей среды"
        - "ОВОС"
        - "вывоз строительного мусора"
        - "загрязнение территории"
        - "восстановление нарушенных земель"
        - "паспорт отходов"
        - "лицензия на обращение с отходами"
        - "ордер на вывоз грунта"
        - "талоны на утилизацию"
        - "класс опасности отходов"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)утилизац(ия|ии)\\s+отход"
        - "(?i)рекультивац(ия|ии)"
        - "(?i)экологическ(ие|их)\\s+(требован|норм|обязательств)"
        - "(?i)вывоз.*грунт|вывоз.*мусор"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор строительного подряда в части экологических обязательств сторон.
        Проверяется только один вопрос: как договор регулирует обращение с отходами, 
        восстановление территории и экологические разрешения.

        Нормативный ориентир:
        - ФЗ-89 «Об отходах производства и потребления» (лицензирование, паспорта отходов)
        - ФЗ-7 «Об охране окружающей среды» (ОВОС, нормативы воздействия)
        - Земельный кодекс РФ (рекультивация земель)

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не оценивай риск, фиксируй условия буквально.
        - В российской практике критичны: (1) лицензия Подрядчика на обращение с отходами, 
          (2) ордер на вывоз грунта / талоны на утилизацию, (3) рекультивация земель после строительства.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Урегулировано ли обращение со строительными отходами (вывоз, утилизация).
        2. Какая сторона отвечает за вывоз / утилизацию отходов.
        3. Есть ли обязанность восстановить участок, территорию или нарушенные земли (рекультивация).
        4. Есть ли ссылки на экологические разрешения, ОВОС или иные природоохранные требования.
        5. Сформируй краткую сводку по экологическим обязательствам.
        6. Извлеки подробную формулировку условий.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона вместо текста договора.
        2. Если условие не указано прямо — возвращай "not_defined" для статусов и "Данные не определены" для текста.
        3. Не используй "None", "null", "not_defined" или пустые строки в JSON.
        4. waste_management_defined = "yes" только если договор прямо регулирует отходы, их вывоз, утилизацию.
        5. waste_responsibility: "contractor" (Подрядчик), "customer" (Заказчик), "not_specified" (упомянуто, но сторона не названа), "not_defined" (не урегулировано).
        6. В сводке (summary) пиши кратко, на русском языке, фиксируя роль сторон и ключевые эко-требования.
        7. В evidence включай только точные цитаты из текста договора.
        8. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        со всеми 7 ключами.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — данные определены:
        Фрагмент:
        "Подрядчик обязан обеспечить сбор, вывоз и утилизацию строительных отходов в соответствии 
        с экологическими требованиями. По завершении работ Подрядчик обязан восстановить нарушенную 
        территорию. При необходимости стороны обеспечивают соблюдение требований ОВОС и иных 
        природоохранных документов."

        Ответ:
        {
          "waste_management_defined": "yes",
          "waste_responsibility": "contractor",
          "site_restoration_obligation": "yes",
          "environmental_permits_referenced": "yes",
          "environmental_summary": "Отходы вывозит и утилизирует Подрядчик; территория подлежит восстановлению; соблюдаются требования ОВОС.",
          "environmental_details": "Подрядчик обеспечивает сбор, вывоз и утилизацию строительных отходов и восстанавливает нарушенную территорию; соблюдаются требования ОВОС и иных природоохранных документов.",
          "evidence": [
            {
              "clause_ref": "п. 8.5",
              "quote": "Подрядчик обязан обеспечить сбор, вывоз и утилизацию строительных отходов в соответствии с экологическими требованиями. По завершении работ Подрядчик обязан восстановить нарушенную территорию..."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Подрядчик выполняет работы на строительной площадке Заказчика."

        Ответ:
        {
          "waste_management_defined": "not_defined",
          "waste_responsibility": "not_defined",
          "site_restoration_obligation": "not_defined",
          "environmental_permits_referenced": "not_defined",
          "environmental_summary": "Не установлено",
          "environmental_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату об отходах (вывоз, утилизация).
        2. Найди прямую цитату о стороне, отвечающей за отходы.
        3. Найди прямую цитату о восстановлении территории / рекультивации.
        4. Найди прямую цитату об экологических разрешениях или ОВОС.
        5. Если прямой цитаты нет — верни "not_defined" / "Данные не определены".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "waste_management_defined": "<yes / no / not_defined>",
          "waste_responsibility": "<contractor / customer / not_specified / not_defined>",
          "site_restoration_obligation": "<yes / no / not_defined>",
          "environmental_permits_referenced": "<yes / no / not_defined>",
          "environmental_summary": "<краткая сводка>",
          "environmental_details": "<подробный текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 850

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "строительные отходы утилизация отходов рекультивация экологические требования охрана окружающей среды ОВОС вывоз строительного мусора загрязнение территории паспорт отходов лицензия на отходы"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
      negative_keywords:
        - "КС-2"
        - "КС-3"
        - "гарантийный срок"
        - "неустойка"
        - "аванс"
        - "страхование"
      position_bias:
        preferred_range: [0.30, 0.90]
        boost: 0.18
        scope: segment
      context_k: 5
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "price_list"
      preferred_clause_functions:
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.14

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 1100

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора строительного подряда
        сведения об экологических обязательствах: обращение со строительными отходами 
        (вывоз, утилизация, лицензии), рекультивация земель, восстановление территории, 
        экологические разрешения (ОВОС, ПДВ, СЗЗ).
        Не анализируй смету, сроки, гарантию, страхование или технадзор.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 7 полей:

        1. waste_management_defined — "yes" / "no" / "not_defined".
        2. waste_responsibility — "contractor" / "customer" / "not_specified" / "not_defined".
        3. site_restoration_obligation — "yes" / "no" / "not_defined".
        4. environmental_permits_referenced — "yes" / "no" / "not_defined".
        5. environmental_summary — краткая user-facing сводка по экологическим обязательствам.
           Примеры: "Отходы вывозит и утилизирует Подрядчик; территория подлежит рекультивации." /
           "Экологические обязательства не урегулированы." / "Не установлено".
        6. environmental_details — подробная формулировка условий об экологии.
        7. evidence — массив цитат из текста договора.
        </task>

        <context_rules>
        - Используй только текст договора из <context>.
        - Если раздела об экологии нет в контексте — верни все статусы как "not_defined",
        environmental_summary как "Не установлено", environmental_details как "Данные не определены".
        - waste_management_defined:
        - "yes" — если договор прямо регулирует отходы, их вывоз, утилизацию или обращение с ними.
        - "no" — если договор прямо исключает специальное регулирование.
        - "not_defined" — условие отсутствует в тексте.
        - waste_responsibility:
        - "contractor" — если ответственность за отходы возложена на Подрядчика.
        - "customer" — если ответственность возложена на Заказчика.
        - "not_specified" — отходы упомянуты, но сторона прямо не определена.
        - "not_defined" — условие отсутствует в тексте.
        - site_restoration_obligation:
        - "yes" — если прямо предусмотрены восстановление территории, рекультивация, уборка или аналогичные действия.
        - "no" — если договор прямо исключает такое обязательство.
        - "not_defined" — вопрос не урегулирован.
        - environmental_permits_referenced:
        - "yes" — если прямо упомянуты ОВОС, разрешения, ПДВ, СЗЗ или иные природоохранные документы / требования.
        - "no" — если договор прямо исключает специальную отсылку.
        - "not_defined" — вопрос не урегулирован.
        - Верни строго JSON со всеми 7 ключами. Запрещены null, None, "N/A" или пустые строки.
        </context_rules>

        <output_expectations>
        - Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        - Не используй markdown fences.
        - Не добавляй пояснения до или после JSON.
        - Верни все ключи, перечисленные в task, без пропусков.
        - Не используй null, None или пустые строки.
        - Для статусных полей используй только значения из allowed_values или "not_defined".
        - Для текстовых полей при отсутствии данных используй "Данные не определены" / "Не удалось определить" / "Не применимо" — согласно правилам выше.
        </output_expectations>

        <output_expectations>
        {
          "waste_management_defined": "yes | no | not_defined",
          "waste_responsibility": "contractor | customer | not_specified | not_defined",
          "site_restoration_obligation": "yes | no | not_defined",
          "environmental_permits_referenced": "yes | no | not_defined",
          "environmental_summary": "string",
          "environmental_details": "string",
          "evidence": [{"clause_ref": "string", "quote": "string"}]
        }
        </output_expectations>

      fields:
        - name: "waste_management_defined"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Есть ли условия об обращении со строительными отходами."
          required: true
          display_in_grid: false
        - name: "waste_responsibility"
          type: "string"
          presentation: "signal"
          allowed_values: ["contractor", "customer", "not_specified", "not_defined"]
          description: "Какая сторона отвечает за вывоз / утилизацию отходов."
          required: true
          display_in_grid: false
        - name: "site_restoration_obligation"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Есть ли обязанность восстановить территорию / рекультивировать участок."
          required: true
          display_in_grid: false
        - name: "environmental_permits_referenced"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Есть ли ссылки на экологические разрешения, ОВОС или аналогичные требования."
          required: true
          display_in_grid: false
        - name: "environmental_summary"
          type: "string"
          presentation: "fact"
          label: "Экологические обязательства"
          description: "Сводка: кто отвечает за отходы, рекультивация территории, экологические разрешения (ФЗ-89, ФЗ-7)."
          required: true
          display_in_grid: true
          display_priority: 1
        - name: "environmental_details"
          type: "string"
          presentation: "fact"
          description: "Подробная формулировка об экологических обязательствах сторон."
          required: true
          display_in_grid: false
      store_payload: true

  - id: ip_rights_construction_documentation
    name: "Права на документацию, созданную при строительстве (ст. 1296 ГК РФ)"
    description: >
      Фактографическая проверка передачи исполнительной документации (as-built, 
      исполнительные чертежи, акты скрытых работ), перехода исключительных прав 
      на документацию и BIM-модели, форматов передачи файлов (IFC, RVT, DWG, PDF) 
      и условий перехода прав (обычно после полной оплаты).
    triggers:
      any: ["bim_technology"]
    ui_mode: "field_extraction"
    severity: "medium"
    severity_if_pass: "pass"
    severity_if_fail: "medium"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "исполнительная документация"
        - "as-built"
        - "фактическое исполнение"
        - "исключительные права"
        - "передача документации"
        - "BIM модель"
        - "информационная модель"
        - "авторские права"
        - "исполнительные чертежи"
        - "акты скрытых работ"
        - "РД-11-02-2006"
        - "формат IFC"
        - "формат RVT"
        - "переход прав после оплаты"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)исполнительн(ая|ой)\\s+документаци"
        - "(?i)исключительн(ые|ых)\\s+прав.*документаци"
        - "(?i)BIM|информационн.*модел"
        - "(?i)переход.*прав.*после.*оплат"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор строительного подряда в части прав на исполнительную документацию, 
        BIM-модели и иные созданные при строительстве материалы.
        Проверяется только один вопрос: передаются ли документы Заказчику, кому принадлежат права 
        на них, в каком формате они передаются и есть ли условие о переходе прав после оплаты.

        Нормативный ориентир:
        - ст. 1296 ГК РФ (права на документацию, созданную по заказу)
        - РД-11-02-2006 (состав и порядок ведения исполнительной документации)
        - Постановление Правительства РФ № 331 (применение BIM для госзаказчиков)

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не оценивай риск, фиксируй условия буквально.
        - Ключевые маркеры для РФ-практики: (1) состав исполнительной документации по РД-11-02-2006, 
          (2) BIM-форматы (IFC, RVT, DWG), (3) условие перехода прав после полной оплаты работ.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Передаётся ли исполнительная документация Заказчику (as-built, исполнительные чертежи).
        2. Кому принадлежат исключительные права на документацию / BIM-модель.
        3. Передаётся ли BIM-модель / информационная модель, если она используется.
        4. Указан ли формат передаваемой документации / модели (IFC, RVT, DWG, PDF и т.п.).
        5. Есть ли условие о переходе прав после полной оплаты работ.
        6. Сформируй краткую сводку по документации и правам на неё.
        7. Извлеки подробную формулировку условий.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона вместо текста договора.
        2. Если условие не указано прямо — возвращай "not_defined" для статусов и "Данные не определены" для текста.
        3. Не используй "None", "null", "not_defined" или пустые строки в JSON.
        4. executive_docs_transfer = "yes" только если исполнительная документация прямо подлежит передаче Заказчику.
        5. ip_rights_on_docs: "transferred" (переходят Заказчику), "retained_by_contractor" (сохраняются у Подрядчика), 
           "not_specified" (документация передаётся, но права прямо не урегулированы), "not_defined" (не урегулировано).
        6. В сводке (summary) пиши кратко, на русском языке, фиксируя состав документации, BIM, форматы и условие перехода прав.
        7. В evidence включай только точные цитаты из текста договора.
        8. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        со всеми 8 ключами.

