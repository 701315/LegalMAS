            - "no" — если договор прямо исключает такой порядок.
            - "not_defined" — если по тексту это не установлено.
        - joint_inspection_required:
            - "yes" — если прямо предусмотрено совместное обследование или осмотр.
            - "no" — если договор прямо исключает такую процедуру.
            - "not_defined" — если по тексту это не установлено.
        - technical_expertise_procedure_defined:
            - "yes" — если прямо урегулирована независимая или строительно-техническая экспертиза.
            - "no" — если договор прямо исключает такую процедуру.
            - "not_defined" — если по тексту это не установлено.
        - expertise_cost_allocation_defined:
            - "yes" — если расходы на экспертизу прямо распределены.
            - "no" — если договор прямо указывает на отсутствие специального распределения.
            - "not_defined" — если по тексту это не установлено.
        - dispute_resolution_details заполняй только по прямому тексту договора.
        - Верни только JSON.
        </rules>
      fields:
