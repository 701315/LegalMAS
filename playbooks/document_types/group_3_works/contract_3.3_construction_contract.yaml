  - id: suspension_and_termination_specifics
    name: "Специфика приостановки работ и одностороннего отказа (ст. 717, 719 ГК РФ)"
    description: >
      Фактографическая проверка наличия ограничений права Подрядчика на приостановку 
      работ при нарушении Заказчиком (ст. 719 ГК РФ), условий оплаты выполненных работ 
      при одностороннем отказе Заказчика от договора (ст. 717 ГК РФ) и права на 
      компенсацию накладных расходов/упущенной выгоды.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "приостановка работ"
        - "право на приостановку"
        - "односторонний отказ"
        - "расторжение в одностороннем порядке"
        - "оплата при отказе"
        - "упущенная выгода"
        - "накладные расходы при расторжении"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)приостанов.*работ"
        - "(?i)односторонн.*отказ|расторж"
        - "(?i)ст\\.?\\s*(717|719)\\s+ГК\\s+РФ"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист. Анализируется договор строительного подряда.
        Проверяется: есть ли запрет для Подрядчика приостанавливать работы при неоплате (ст. 719 ГК РФ) 
        и как оплачиваются работы при одностороннем отказе Заказчика (ст. 717 ГК РФ).
        
        Важно: По закону Подрядчик вправе приостановить работы при нарушении Заказчиком. 
        Если договор запрещает это — это критичный риск для Подрядчика.

        [ЗАДАЧА]
        1. Ограничено ли право Подрядчика на приостановку работ.
        2. Как оплачиваются работы при одностороннем отказе Заказчика.
        3. Компенсируется ли упущенная выгода/накладные расходы при досрочном прекращении.
        4. Сформируй сводку по приостановке и отказу.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона.
        2. Если условие не указано прямо — возвращай "not_defined" для статусов и "Данные не определены" для текста.
        3. Если данных по приостановке и отказу нет вообще — для summary возвращай строго "Не установлено".
        4. Не используй "None", "null", "N/A" или пустые строки.
        5. В evidence включай только точные цитаты из текста договора.
        6. Верни строго один JSON-объект ровно с 5 ключами. Не добавляй и не пропускай ключи.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — данные определены:
        Фрагмент:
        "Подрядчик не вправе приостанавливать производство работ в случае задержки Заказчиком оплаты. 
        В случае одностороннего отказа Заказчика от договора, Заказчик оплачивает только фактически 
        понесенные Подрядчиком прямые затраты, упущенная выгода не возмещается."

        Ответ:
        {
          "suspension_right_restricted": "yes",
          "termination_payment_terms": "partial_payment",
          "unearned_profit_compensation": "no",
          "termination_specifics_summary": "Подрядчику запрещено приостанавливать работы при неоплате; при отказе Заказчика возмещаются только прямые затраты, упущенная выгода исключена.",
          "termination_specifics_details": "Подрядчик не вправе приостанавливать производство работ в случае задержки оплаты. При одностороннем отказе Заказчика оплачиваются только фактически понесенные прямые затраты, упущенная выгода не возмещается.",
          "evidence": [
            {
              "clause_ref": "п. 11.2",
              "quote": "Подрядчик не вправе приостанавливать производство работ в случае задержки Заказчиком оплаты. В случае одностороннего отказа Заказчика от договора, Заказчик оплачивает только фактически понесенные Подрядчиком прямые затраты, упущенная выгода не возмещается."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Подрядчик обязуется выполнить работы в соответствии с проектной документацией."

        Ответ:
        {
          "suspension_right_restricted": "not_defined",
          "termination_payment_terms": "not_defined",
          "unearned_profit_compensation": "not_defined",
          "termination_specifics_summary": "Не установлено",
          "termination_specifics_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о приостановке работ или ограничении права на приостановку.
        2. Найди прямую цитату об одностороннем отказе и условиях оплаты.
        3. Найди прямую цитату о компенсации упущенной выгоды или накладных расходов.
        4. Если прямой цитаты нет — верни "not_defined" / "Данные не определены" / "Не установлено".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "suspension_right_restricted": "<yes / no / not_defined>",
          "termination_payment_terms": "<full_payment / partial_payment / not_defined>",
          "unearned_profit_compensation": "<yes / no / not_defined>",
          "termination_specifics_summary": "<краткая сводка или 'Не установлено'>",
          "termination_specifics_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 950

    retrieval:
      preferred_clause_functions:
        - obligations
        - procedures
      retrieval_profile: "termination_check"
      corpus_scope: "primary_segment"
      levels: ["legal_unit", "section"]
      required_kind: "legal_unit"
      retrieval_query: "приостановка работ право на приостановку односторонний отказ расторжение в одностороннем порядке оплата при отказе упущенная выгода накладные расходы при расторжении ст 717 719 ГК РФ"
      preferred_unit_types: ["obligation", "general_provision"]
      excluded_unit_types: ["definition", "technical_fragment"]
      negative_keywords: ["КС-2", "КС-3", "гарантийный срок", "неустойка", "НДС"]
      position_bias: { preferred_range: [0.60, 1.0], boost: 0.18, scope: segment }
      context_k: 5
      max_chunks: 6
      rerank: true

    enrichment_hints:
      preferred_segment_types: ["contract", "amendment"]
      excluded_segment_types: ["price_list"]
      preferred_clause_functions: ["obligations"]
      confidence_bonus_on_match: 0.10

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 1200
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора условия о приостановке работ 
        и одностороннем отказе от договора строительного подряда (ст. 717, 719 ГК РФ).
        Не анализируй смету, сроки, гарантию, страхование или экологию.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 5 полей:
        1. suspension_right_restricted — "yes" (запрещено/ограничено) / "no" (разрешено) / "not_defined".
        2. termination_payment_terms — "full_payment" (все работы) / "partial_payment" (только прямые затраты) / "not_defined".
        3. unearned_profit_compensation — "yes" / "no" / "not_defined".
        4. termination_specifics_summary — краткая user-facing сводка.
        5. termination_specifics_details — подробная формулировка.
        </task>

        <context_rules>
        - Используй только текст договора из <context>.
        - Если раздела о приостановке и одностороннем отказе нет в контексте — верни статусы как "not_defined",
        termination_specifics_summary как "Не установлено", termination_specifics_details как "Данные не определены".
        - suspension_right_restricted:
        - "yes" — если договор ЗАПРЕЩАЕТ или ограничивает право Подрядчика приостанавливать работы при неоплате/нарушении Заказчиком.
        - "no" — если договор прямо подтверждает право Подрядчика на приостановку.
        - "not_defined" — если вопрос не урегулирован.
        - termination_payment_terms:
        - "full_payment" — если при одностороннем отказе Заказчика оплачиваются все выполненные работы (включая накладные расходы).
        - "partial_payment" — если оплачиваются только фактически понесенные прямые затраты.
        - "not_defined" — если условия оплаты при отказе не урегулированы.
        - unearned_profit_compensation:
        - "yes" — если прямо предусмотрена компенсация упущенной выгоды или накладных расходов при досрочном прекращении.
        - "no" — если договор прямо исключает компенсацию упущенной выгоды.
        - "not_defined" — если вопрос не урегулирован.
        - Верни строго один JSON-объект ровно с 5 ключами. Не добавляй и не пропускай ключи.
        - Запрещены null, None, "N/A" или пустые строки.
        </context_rules>

        <output_expectations>
        - Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        - Не используй markdown fences.
        - Не добавляй пояснения до или после JSON.
        - Верни все ключи, перечисленные в task, без пропусков.
        - Не используй null, None или пустые строки.
        - Для статусных полей используй только значения из allowed_values или "not_defined".
        - Для текстовых полей при отсутствии данных используй "Данные не определены" / "Не удалось определить" / "Не применимо" — согласно правилам выше.
        </output_expectations>

        <output_expectations>
        {
          "suspension_right_restricted": "yes | no | not_defined",
          "termination_payment_terms": "full_payment | partial_payment | not_defined",
          "unearned_profit_compensation": "yes | no | not_defined",
          "termination_specifics_summary": "string",
          "termination_specifics_details": "string",
          "evidence": [{"clause_ref": "string", "quote": "string"}]
        }
        </output_expectations>

      fields:
        - name: "suspension_right_restricted"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Ограничено ли право Подрядчика на приостановку работ при нарушении Заказчиком."
          required: true
          display_in_grid: false
        - name: "termination_payment_terms"
          type: "string"
          presentation: "signal"
          allowed_values: ["full_payment", "partial_payment", "not_defined"]
          description: "Условия оплаты работ при одностороннем отказе Заказчика."
          required: true
          display_in_grid: false
        - name: "unearned_profit_compensation"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Компенсируется ли упущенная выгода/накладные расходы при досрочном прекращении."
          required: true
          display_in_grid: false
        - name: "termination_specifics_summary"
          type: "string"
          presentation: "fact"
          label: "Приостановка и отказ"
          description: "Сводка: право на приостановку при неоплате, оплата при одностороннем отказе, компенсация упущенной выгоды."
          required: true
          display_in_grid: true
          display_priority: 1
        - name: "termination_specifics_details"
          type: "string"
          presentation: "fact"
          description: "Подробная формулировка о приостановке и одностороннем отказе."
          required: true
          display_in_grid: false
      store_payload: true

  - id: engineering_surveys_and_connections
    name: "Инженерные изыскания и точки подключения к инженерным сетям"
    description: >
      Фактографическая проверка обязанности Заказчика предоставить результаты 
      инженерных изысканий (геология, геодезия), распределения риска их недостоверности 
      (ст. 744 ГК РФ) и обязанности по предоставлению точек подключения к 
      инженерным сетям (границы врезки).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "инженерные изыскания"
        - "геологические изыскания"
        - "геодезия"
        - "точки подключения"
        - "границы врезки"
        - "риск недостоверности"
        - "технические условия"
        - "места подключения"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)инженерн.*изыскан"
        - "(?i)точк.*подключени|границ.*врезк"
        - "(?i)риск.*недостоверност"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист. Анализируется договор строительного подряда.
        Проверяется: кто предоставляет инженерные изыскания, на ком риск их недостоверности 
        и кто предоставляет точки подключения к сетям.
        
        Важно: По ст. 744 ГК РФ риск недостоверности изысканий, предоставленных Заказчиком, 
        лежит на Заказчике. Фиксируй, не перекладывается ли этот риск на Подрядчика.

        [ЗАДАЧА]
        1. Обязан ли Заказчик предоставить результаты инженерных изысканий.
        2. На ком лежит риск недостоверности этих изысканий.
        3. Обязан ли Заказчик предоставить точки подключения к инженерным сетям.
        4. Сформируй сводку по изысканиям и подключениям.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона.
        2. Если условие не указано прямо — возвращай "not_defined" для статусов и "Данные не определены" для текста.
        3. Если данных по изысканиям и подключениям нет вообще — для summary возвращай строго "Не установлено".
        4. Не используй "None", "null", "N/A" или пустые строки.
        5. В evidence включай только точные цитаты из текста договора.
        6. Верни строго один JSON-объект ровно с 5 ключами. Не добавляй и не пропускай ключи.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — данные определены:
        Фрагмент:
        "Заказчик передает Подрядчику результаты инженерно-геологических изысканий. 
        Подрядчик подтверждает, что самостоятельно проверил достоверность изысканий 
        и несет риск последствий ошибок в них. Заказчик обеспечивает точки подключения 
        к сетям водоснабжения согласно Техническим условиям."

        Ответ:
        {
          "surveys_provided": "yes",
          "surveys_risk_bearer": "contractor",
