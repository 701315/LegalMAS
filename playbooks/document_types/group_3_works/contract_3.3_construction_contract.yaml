  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 15: Экологические обязательства
  # ──────────────────────────────────────────────────────────────────────────
  - id: environmental_obligations_check
    name: "Экологические обязательства: отходы, рекультивация, ОВОС (ФЗ-89, ФЗ-7)"
    description: >
      Фактографическая проверка условий об обращении со строительными отходами,
      распределении ответственности за их вывоз / утилизацию, восстановлении
      территории и ссылках на экологические разрешения или требования.
    triggers: ~
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "строительные отходы"
        - "утилизация отходов"
        - "рекультивация"
        - "экологические требования"
        - "охрана окружающей среды"
        - "ОВОС"
        - "вывоз строительного мусора"
        - "загрязнение территории"
        - "восстановление нарушенных земель"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)утилизац(ия|ии)\\s+отход"
        - "(?i)рекультивац(ия|ии)"
        - "(?i)экологическ(ие|их)\\s+(требован|норм|обязательств)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор строительного подряда в части экологических
        обязательств сторон.
        Проверяется только один вопрос: как договор регулирует обращение
        с отходами, восстановление территории и экологические разрешения.

        Нормативный ориентир:
        - ФЗ-89 «Об отходах производства и потребления»
        - ФЗ-7 «Об охране окружающей среды»

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Урегулировано ли обращение со строительными отходами.
        2. Какая сторона отвечает за вывоз / утилизацию отходов.
        3. Есть ли обязанность восстановить участок, территорию
           или нарушенные земли.
        4. Есть ли ссылки на экологические разрешения, ОВОС
           или иные экологические требования.
        5. Как в целом описаны экологические обязательства.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined".
        4. Если текстового значения нет — возвращай "Данные не определены".
        5. Не используй "None", "null", "not_found" или пустые строки.
        6. waste_management_defined = "yes" только если договор прямо
           регулирует обращение с отходами.
        7. waste_responsibility определяй только по прямому тексту
           о том, кто отвечает за вывоз, утилизацию или обращение с отходами.
        8. site_restoration_obligation = "yes" только если договор прямо
           требует рекультивацию, уборку, восстановление территории
           или аналогичное действие.
        9. environmental_permits_referenced = "yes" только если прямо
           упомянуты экологические разрешения, ОВОС или аналогичные документы.
        10. environmental_details заполняй только по прямому тексту договора.
        11. В evidence включай только текст договора.
        12. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — данные определены:
        Фрагмент:
        "Подрядчик обязан обеспечить сбор, вывоз и утилизацию строительных
        отходов в соответствии с экологическими требованиями. По завершении
        работ Подрядчик обязан восстановить нарушенную территорию. При
        необходимости стороны обеспечивают соблюдение требований ОВОС
        и иных природоохранных документов."

        Ответ:
        {
          "waste_management_defined": "yes",
          "waste_responsibility": "contractor",
          "site_restoration_obligation": "yes",
          "environmental_permits_referenced": "yes",
          "environmental_details": "Подрядчик обеспечивает сбор, вывоз и утилизацию строительных отходов и восстанавливает нарушенную территорию; соблюдаются требования ОВОС и иных природоохранных документов.",
          "evidence": [
            {
              "clause_ref": "п. 8.5",
              "quote": "Подрядчик обязан обеспечить сбор, вывоз и утилизацию строительных отходов в соответствии с экологическими требованиями. По завершении работ Подрядчик обязан восстановить нарушенную территорию. При необходимости стороны обеспечивают соблюдение требований ОВОС..."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Подрядчик выполняет работы на строительной площадке Заказчика."

        Ответ:
        {
          "waste_management_defined": "not_defined",
          "waste_responsibility": "not_defined",
          "site_restoration_obligation": "not_defined",
          "environmental_permits_referenced": "not_defined",
          "environmental_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату об отходах.
        2. Найди прямую цитату о стороне, отвечающей за отходы.
        3. Найди прямую цитату о восстановлении территории.
        4. Найди прямую цитату об экологических разрешениях или ОВОС.
        5. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "waste_management_defined": "<yes / no / not_defined>",
          "waste_responsibility": "<contractor / customer / not_specified / not_defined>",
          "site_restoration_obligation": "<yes / no / not_defined>",
          "environmental_permits_referenced": "<yes / no / not_defined>",
          "environmental_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 680

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "строительные отходы утилизация отходов рекультивация экологические требования охрана окружающей среды ОВОС вывоз строительного мусора загрязнение территории"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
      negative_keywords:
        - "КС-2"
        - "КС-3"
        - "гарантийный срок"
        - "неустойка"
        - "аванс"
        - "страхование"
      position_bias:
        preferred_range: [0.30, 0.90]
        boost: 0.18
        scope: segment
      context_k: 5
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "price_list"
      preferred_clause_functions:
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.14

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 600

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора строительного подряда
        сведения об экологических обязательствах сторон.
        Не анализируй смету, сроки, гарантию, страхование или технадзор.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. waste_management_defined — "yes" / "no" / "not_defined".
        2. waste_responsibility — "contractor" / "customer" /
           "not_specified" / "not_defined".
        3. site_restoration_obligation — "yes" / "no" / "not_defined".
        4. environmental_permits_referenced — "yes" / "no" / "not_defined".
        5. environmental_details — формулировка об экологических обязательствах.

        Если данные отсутствуют:
        - статус = "not_defined"
        - текст = "Данные не определены"
        </task>

        <rules>
        - Используй только текст договора.
        - waste_management_defined:
            - "yes" — если договор прямо регулирует отходы, их вывоз,
              утилизацию или обращение с ними.
            - "no" — если договор прямо исключает специальное регулирование.
            - "not_defined" — если по тексту это не установлено.
        - waste_responsibility:
            - "contractor" — если ответственность за отходы возложена на Подрядчика.
            - "customer" — если ответственность возложена на Заказчика.
            - "not_specified" — если отходы упомянуты, но сторона не определена.
            - "not_defined" — если по тексту это не установлено.
        - site_restoration_obligation:
            - "yes" — если прямо предусмотрены восстановление территории,
              рекультивация, уборка или аналогичные действия.
            - "no" — если договор прямо исключает такое обязательство.
            - "not_defined" — если по тексту это не установлено.
        - environmental_permits_referenced:
            - "yes" — если прямо упомянуты ОВОС, разрешения или иные
              природоохранные документы / требования.
            - "no" — если договор прямо исключает специальную отсылку.
            - "not_defined" — если по тексту это не установлено.
        - environmental_details заполняй только по прямому тексту договора.
        - Верни только JSON.
        </rules>
      fields:
        - name: "waste_management_defined"
          type: "string"
          presentation: "signal"
          label: "Отходы"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Есть ли условия об обращении со строительными отходами."
          required: true
          display_in_grid: true
          display_priority: 1
        - name: "waste_responsibility"
          type: "string"
          presentation: "signal"
          label: "Кто отвечает за отходы"
          allowed_values: ["contractor", "customer", "not_specified", "not_defined"]
          description: "Какая сторона отвечает за вывоз / утилизацию отходов."
          required: true
          display_in_grid: true
          display_priority: 2
        - name: "site_restoration_obligation"
          type: "string"
          presentation: "signal"
          label: "Восстановление территории"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Есть ли обязанность восстановить территорию / рекультивировать участок."
          required: true
          display_in_grid: true
          display_priority: 3
        - name: "environmental_permits_referenced"
          type: "string"
          presentation: "signal"
          label: "Эко-документы"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Есть ли ссылки на экологические разрешения, ОВОС или аналогичные требования."
          required: true
          display_in_grid: true
          display_priority: 4
        - name: "environmental_details"
          type: "string"
          presentation: "fact"
          label: "Экологические условия"
          description: "Формулировка об экологических обязательствах сторон."
          required: true
          display_in_grid: true
          display_priority: 5
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 16: Права на документацию, BIM и исполнительные материалы
  # ──────────────────────────────────────────────────────────────────────────
  - id: ip_rights_construction_documentation
    name: "Права на документацию, созданную при строительстве (ст. 1296 ГК РФ)"
    description: >
      Фактографическая проверка передачи исполнительной документации,
      статуса прав на документы, передачи BIM-моделей и указания
      требуемого формата передаваемых материалов.
    triggers:
      any: ["bim_technology"]
    ui_mode: "field_extraction"
    severity: "medium"
    severity_if_pass: "pass"
    severity_if_fail: "medium"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "исполнительная документация"
        - "as-built"
        - "фактическое исполнение"
        - "исключительные права"
        - "передача документации"
        - "BIM модель"
        - "информационная модель"
        - "авторские права"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)исполнительн(ая|ой)\\s+документаци"
        - "(?i)исключительн(ые|ых)\\s+прав.*документаци"
        - "(?i)BIM|информационн.*модел"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор строительного подряда в части прав на
        исполнительную документацию, BIM-модели и иные созданные
        при строительстве материалы.
        Проверяется только один вопрос: передаются ли документы Заказчику,
        кому принадлежат права на них и в каком формате они передаются.

        Нормативный ориентир:
        - ст. 1296 ГК РФ

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Передаётся ли исполнительная документация Заказчику.
        2. Кому принадлежат права на такую документацию.
        3. Передаётся ли BIM-модель / информационная модель, если она используется.
        4. Указан ли формат передаваемой документации.
        5. Как в целом сформулированы условия о документации и правах на неё.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined".
        4. Если текстового значения нет — возвращай "Данные не определены".
        5. Не используй "None", "null", "not_found" или пустые строки.
        6. executive_docs_transfer = "yes" только если исполнительная
           документация прямо подлежит передаче Заказчику.
        7. ip_rights_on_docs = "transferred" только если права на документацию
           прямо переходят Заказчику.
        8. ip_rights_on_docs = "retained_by_contractor" только если права
           прямо сохраняются за Подрядчиком.
        9. bim_model_transfer = "not_applicable" только если из текста следует,
           что BIM / информационная модель не является применимой темой.
        10. docs_format_specified = "yes" только если прямо указан формат
            передаваемой документации (бумажный, электронный, цифровой и т.п.).
        11. ip_docs_details заполняй только по прямому тексту договора.
        12. В evidence включай только текст договора.
        13. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — данные определены:
        Фрагмент:
        "Подрядчик передаёт Заказчику исполнительную документацию
        в электронном и бумажном виде. Исключительные права на созданную
        BIM-модель переходят к Заказчику после полной оплаты работ.
        BIM-модель передаётся в формате IFC и RVT."

        Ответ:
        {
          "executive_docs_transfer": "yes",
          "ip_rights_on_docs": "transferred",
          "bim_model_transfer": "yes",
          "docs_format_specified": "yes",
          "ip_docs_details": "Исполнительная документация передаётся Заказчику в электронном и бумажном виде; исключительные права на BIM-модель переходят к Заказчику после полной оплаты.",
          "evidence": [
            {
              "clause_ref": "п. 9.6",
              "quote": "Подрядчик передаёт Заказчику исполнительную документацию в электронном и бумажном виде. Исключительные права на созданную BIM-модель переходят к Заказчику после полной оплаты работ. BIM-модель передаётся в формате IFC и RVT."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Подрядчик обязан представить документацию по завершении работ."

        Ответ:
        {
          "executive_docs_transfer": "not_defined",
          "ip_rights_on_docs": "not_defined",
          "bim_model_transfer": "not_defined",
          "docs_format_specified": "not_defined",
          "ip_docs_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о передаче исполнительной документации.
        2. Найди прямую цитату о правах на документацию.
        3. Найди прямую цитату о BIM-модели.
        4. Найди прямую цитату о формате передачи.
        5. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "executive_docs_transfer": "<yes / no / not_defined>",
          "ip_rights_on_docs": "<transferred / retained_by_contractor / not_specified / not_defined>",
          "bim_model_transfer": "<yes / no / not_applicable / not_defined>",
          "docs_format_specified": "<yes / no / not_defined>",
          "ip_docs_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 660

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "исполнительная документация as-built фактическое исполнение исключительные права передача документации BIM модель информационная модель авторские права"
      retrieval_profile: "ip_ownership_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - definitions
      negative_keywords:
        - "КС-2"
        - "КС-3"
        - "гарантийный срок"
        - "неустойка"
        - "НДС"
        - "СРО"
      position_bias:
        preferred_range: [0.30, 0.95]
        boost: 0.18
        scope: segment
      context_k: 5
      max_chunks: 6
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
        - "technical_specification"
      excluded_segment_types:
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "definitions"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.14

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 600

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора строительного подряда
        условия о передаче исполнительной документации, BIM-моделей и правах на них.
        Не анализируй смету, сроки, гарантию, страхование или экологию.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. executive_docs_transfer — "yes" / "no" / "not_defined".
        2. ip_rights_on_docs — "transferred" / "retained_by_contractor" /
           "not_specified" / "not_defined".
        3. bim_model_transfer — "yes" / "no" / "not_applicable" / "not_defined".
        4. docs_format_specified — "yes" / "no" / "not_defined".
        5. ip_docs_details — формулировка о документации и правах на неё.

        Если данные отсутствуют:
        - статус = "not_defined"
        - текст = "Данные не определены"
        </task>

        <rules>
        - Используй только текст договора.
        - executive_docs_transfer:
            - "yes" — если исполнительная документация прямо передаётся Заказчику.
            - "no" — если договор прямо исключает такую передачу.
            - "not_defined" — если по тексту это не установлено.
        - ip_rights_on_docs:
            - "transferred" — если права на документацию / модель переходят Заказчику.
            - "retained_by_contractor" — если права сохраняются за Подрядчиком.
            - "not_specified" — если документация передаётся, но права прямо не урегулированы.
            - "not_defined" — если по тексту это не установлено.
        - bim_model_transfer:
            - "yes" — если BIM / информационная модель подлежит передаче.
            - "no" — если договор прямо исключает передачу.
            - "not_applicable" — если из текста прямо следует, что BIM-тема не применяется.
            - "not_defined" — если по тексту это не установлено.
        - docs_format_specified:
            - "yes" — если указан формат передачи документов / модели.
            - "no" — если договор прямо указывает на отсутствие специальных требований к формату.
            - "not_defined" — если по тексту это не установлено.
        - ip_docs_details заполняй только по прямому тексту договора.
        - Верни только JSON.
        </rules>
      fields:
        - name: "executive_docs_transfer"
          type: "string"
          presentation: "signal"
          label: "Передача документации"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Передаётся ли исполнительная документация Заказчику."
