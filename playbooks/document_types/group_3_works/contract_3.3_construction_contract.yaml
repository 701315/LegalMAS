    ui_mode: "field_extraction"
    severity: "medium"
    severity_if_pass: "pass"
    severity_if_fail: "medium"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "досудебный порядок"
        - "претензионный порядок"
        - "строительно-техническая экспертиза"
        - "совместное обследование"
        - "независимая экспертиза"
        - "расходы на экспертизу"
        - "немедленное уведомление"
        - "односторонний акт осмотра"
        - "СРО экспертиз"
        - "срок явки на обследование"
