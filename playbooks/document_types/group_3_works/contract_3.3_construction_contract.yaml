          description: "Упомянут ли акт-допуск, пропускной режим или допуск на площадку."
          required: true
          display_in_grid: false
        - name: "site_safety_summary"
          type: "string"
          presentation: "fact"
          label: "Охрана труда и безопасность"
          description: "Сводка: ответственная сторона, СИЗ, инструктаж, уведомление о несчастных случаях, акт-допуск, пропускной режим (ТК РФ, СП 12-136-2002)."
          required: true
          display_in_grid: true
          display_priority: 1
        - name: "site_safety_details"
          type: "string"
          presentation: "fact"
          description: "Подробная формулировка об охране труда и безопасности работ."
          required: true
