  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 2: Объект строительства, ПД, экспертиза и разрешение
  # ──────────────────────────────────────────────────────────────────────────
  - id: construction_object_and_design_docs_extraction
    name: "Объект строительства, проектная документация, экспертиза и разрешение"
    description: >
      Фактографическая проверка описания объекта строительства, адреса,
      кадастрового номера, ссылок на проектную / рабочую документацию,
      упоминания её утверждения, экспертизы и разрешения на строительство.
    triggers: ~
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "объект капитального строительства"
        - "проектная документация"
        - "рабочая документация"
        - "наименование объекта"
        - "адрес объекта"
        - "техническое задание"
        - "кадастровый номер"
        - "разрешение на строительство"
        - "положительное заключение экспертизы"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)объект.*капитального.*строительства"
        - "(?i)(проектн|рабоч).*документаци"
        - "(?i)\\d{2}:\\d{2}:\\d{6,7}:\\d+"
        - "(?i)разрешени.*на.*строительств"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор строительного подряда по ст. 740, 743, 748 ГК РФ
        и положениям Градостроительного кодекса РФ.
        Проверяется только один вопрос: как в договоре идентифицирован объект
        строительства и как урегулированы проектная документация, экспертиза
        и разрешение на строительство.

        Нормативный ориентир:
        - ст. 740 ГК РФ
        - ст. 743 ГК РФ
        - ст. 748 ГК РФ
        - ст. 48, 49, 51 Градостроительного кодекса РФ

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Наименование объекта строительства.
        2. Адрес или местоположение объекта.
        3. Кадастровый номер, если он указан.
        4. Есть ли ссылка на проектную или рабочую документацию.
        5. Есть ли указание на утверждение проектной документации.
        6. Есть ли указание на прохождение экспертизы проектной документации.
        7. Есть ли упоминание разрешения на строительство.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined".
        4. Если текстового значения нет — возвращай "Данные не определены".
        5. Не используй "None", "null", "not_found" или пустые строки.
        6. design_docs_referenced = "yes" только если проектная / рабочая
           документация прямо указана как приложение, часть договора
           или отдельный комплект документов.
        7. design_docs_referenced = "partial" только если есть общая ссылка
           на документацию без достаточной определённости её состава / статуса.
        8. design_docs_approval = "approved" только если в договоре прямо
           указано, что документация утверждена.
        9. expertise_passed = "yes" только если в договоре прямо указано
           прохождение экспертизы или положительное заключение экспертизы.
        10. construction_permit_mentioned = "yes" только если разрешение
            на строительство прямо упомянуто.
        11. В evidence включай только текст договора.
        12. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — данные определены:
        Фрагмент:
        "Подрядчик обязуется выполнить работы по строительству объекта
        капитального строительства «Многофункциональный жилой комплекс».
        Объект расположен по адресу: г. Москва, ул. Строителей, д. 10.
        Кадастровый номер земельного участка 77:01:0001234:567.
        Проектная и рабочая документация передаются Подрядчику по Приложению № 2.
        Проектная документация утверждена Заказчиком и имеет положительное
        заключение государственной экспертизы. Разрешение на строительство
        выдано уполномоченным органом."

        Ответ:
        {
          "object_name_status": "defined",
          "object_name_value": "Многофункциональный жилой комплекс.",
          "object_address_status": "defined",
          "object_address_value": "г. Москва, ул. Строителей, д. 10.",
          "cadastral_number_status": "defined",
          "cadastral_number_value": "77:01:0001234:567",
          "design_docs_referenced": "yes",
          "design_docs_approval": "approved",
          "expertise_passed": "yes",
          "construction_permit_mentioned": "yes",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "Подрядчик обязуется выполнить работы по строительству объекта капитального строительства «Многофункциональный жилой комплекс»... Проектная и рабочая документация передаются Подрядчику по Приложению № 2. Проектная документация утверждена Заказчиком и имеет положительное заключение государственной экспертизы. Разрешение на строительство выдано уполномоченным органом."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Подрядчик выполняет строительные работы на объекте Заказчика."

        Ответ:
        {
          "object_name_status": "not_defined",
          "oobject_name_value": "Данные не определены",
          "object_address_status": "not_defined",
          "object_address_value": "Данные не определены",
          "cadastral_number_status": "not_defined",
          "cadastral_number_value": "Данные не определены",
          "design_docs_referenced": "not_defined",
          "design_docs_approval": "not_defined",
          "expertise_passed": "not_defined",
          "construction_permit_mentioned": "not_defined",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о наименовании объекта.
        2. Найди прямую цитату об адресе или местоположении объекта.
        3. Найди прямую цитату о кадастровом номере.
        4. Найди прямую цитату о проектной / рабочей документации.
        5. Найди прямую цитату об экспертизе и разрешении на строительство.
        6. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "object_name_status": "<defined / not_defined>",
          "object_name_value": "<текст или 'Данные не определены'>",
          "object_address_status": "<defined / not_defined>",
          "object_address_value": "<текст или 'Данные не определены'>",
          "cadastral_number_status": "<defined / not_defined>",
          "cadastral_number_value": "<текст или 'Данные не определены'>",
          "design_docs_referenced": "<yes / partial / no / not_defined>",
          "design_docs_approval": "<approved / not_specified / not_defined>",
          "expertise_passed": "<yes / no / not_mentioned / not_defined>",
          "construction_permit_mentioned": "<yes / no / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 7
      temperature: 0.0
      max_tokens: 820

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "объект капитального строительства проектная документация рабочая документация наименование объекта адрес объекта кадастровый номер техническое задание разрешение на строительство экспертиза"
      retrieval_profile: "technical_documentation_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - definitions
        - obligations
      negative_keywords:
        - "неустойка"
        - "пеня"
        - "аванс"
        - "КС-2"
        - "КС-3"
        - "гарантийный срок"
        - "скрытые недостатки"
      position_bias:
        preferred_range: [0.0, 0.35]
        boost: 0.24
        scope: segment
      context_k: 7
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
        - "technical_specification"
      excluded_segment_types:
        - "price_list"
      preferred_clause_functions:
        - "definitions"
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.14

    evidence:
      required: true
      min_snippet_length: 50
      max_snippet_length: 700

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 1050

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора строительного подряда
        сведения об объекте строительства, проектной / рабочей документации,
        экспертизе и разрешении на строительство.
        Не анализируй цену, сроки, приёмку, гарантию или ответственность.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. object_name_status — "defined" если наименование объекта прямо указано,
           иначе "not_defined".
        2. object_name_value — наименование объекта строительства.
        3. object_address_status — "defined" если адрес / местоположение объекта
           прямо указаны, иначе "not_defined".
        4. object_address_value — адрес или местоположение объекта.
        5. cadastral_number_status — "defined" если кадастровый номер прямо указан,
           иначе "not_defined".
        6. cadastral_number_value — кадастровый номер.
        7. design_docs_referenced — "yes" / "partial" / "no" / "not_defined".
        8. design_docs_approval — "approved" / "not_specified" / "not_defined".
        9. expertise_passed — "yes" / "no" / "not_mentioned" / "not_defined".
        10. construction_permit_mentioned — "yes" / "no" / "not_defined".

        Если данные отсутствуют:
        - статус = "not_defined"
        - текст = "Данные не определены"
        </task>

        <rules>
        - Используй только текст договора.
        - design_docs_referenced:
            - "yes" — если проектная или рабочая документация прямо указана
              как приложение, часть договора или отдельный комплект документов.
            - "partial" — если есть общая ссылка на документацию без достаточной
              определённости её состава или статуса.
            - "no" — если договор прямо указывает на отсутствие такой документации.
            - "not_defined" — если это прямо не установлено.
        - design_docs_approval:
            - "approved" — если прямо указано, что документация утверждена.
            - "not_specified" — если документация упомянута, но её утверждение
              прямо не раскрыто.
            - "not_defined" — если по тексту это нельзя установить.
        - expertise_passed:
            - "yes" — если прямо указано прохождение экспертизы или наличие
              положительного заключения экспертизы.
            - "no" — если прямо указано отсутствие экспертизы или отрицательный статус.
            - "not_mentioned" — если проектная документация упомянута, но вопрос
              экспертизы прямо не раскрыт.
            - "not_defined" — если по тексту это нельзя установить.
        - construction_permit_mentioned:
            - "yes" — если разрешение на строительство прямо упомянуто.
            - "no" — если прямо указано отсутствие разрешения.
            - "not_defined" — если по тексту это нельзя установить.
        - Верни только JSON.
        </rules>
      fields:
        - name: "object_name_status"
