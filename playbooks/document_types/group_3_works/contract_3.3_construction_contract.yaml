          display_in_grid: true
          display_priority: 1
        - name: "ip_rights_on_docs"
          type: "string"
          presentation: "signal"
          label: "Права на документацию"
          allowed_values: ["transferred", "retained_by_contractor", "not_specified", "not_defined"]
          description: "Как урегулированы права на документацию."
          required: true
          display_in_grid: true
          display_priority: 2
        - name: "bim_model_transfer"
          type: "string"
          presentation: "signal"
          label: "Передача BIM"
          allowed_values: ["yes", "no", "not_applicable", "not_defined"]
          description: "Передаётся ли BIM / информационная модель."
