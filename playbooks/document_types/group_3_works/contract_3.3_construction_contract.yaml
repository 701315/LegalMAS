        5. termination_specifics_details:
           Подробная формулировка о приостановке и одностороннем отказе, или "Данные не определены".
        </task>

        <context_rules>
        - Перед остальными полями заполни suspension_and_termination_specifics_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все содержательные сигнальные поля = "not_defined", termination_specifics_details = "Данные не определены", termination_specifics_summary = "Не установлено".
        - Используй только текст договора из <context>.
