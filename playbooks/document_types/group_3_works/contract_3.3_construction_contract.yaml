# ════════════════════════════════════════════════════════════════════════════

shared_patterns:

  money_amount: "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|тыс|млн|млрд)"
  date_pattern: "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"
  date_period: "(?i)(не\\s+позднее|в\\s+течение)\\s+\\d+\\s*(календарн|рабоч|дн)"
  percent_pattern: "(?i)\\b\\d+([,.]\\d+)?\\s*%\\s*(в\\s+(день|месяц|год|квартал))?"
  ks2_ks3_pattern: "(?i)(КС-2|форма.*КС-2|акт.*о.*при[её]мк[ееи].*выполненн[ыо]х.*работ)"
  sro_pattern: "(?i)(СРО|саморегулируемая\\s+организация|свидетельств[оа].*о.*допуске)"
  cadastral_pattern: "(?i)(кадастров[а-яё]+\\s+номер|\\b\\d{2}:\\d{2}:\\d{6,7}:\\d+\\b)"

compliance_rules: []

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: CHECKS_V8 — LLM/hybrid проверки
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 1: Стороны, подписанты и корпоративное одобрение
  # ──────────────────────────────────────────────────────────────────────────
  - id: parties_identification
    name: "Стороны договора: идентификация заказчика и подрядчика, подписанты и корпоративное одобрение"
    description: >
      Фактографическая проверка идентификации Заказчика и Подрядчика,
      их реквизитов, типа стороны, подписантов, оснований полномочий
      и корпоративного одобрения сделки для юридических лиц.
    triggers: ~
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "заказчик"
        - "подрядчик"
        - "генподрядчик"
        - "именуем"
        - "в лице"
        - "действующего на основании"
        - "устав"
        - "доверенность"
        - "приказ"
        - "ИНН"
        - "ОГРН"
        - "паспорт"
        - "гражданин"
        - "физическое лицо"
        - "крупная сделка"
        - "сделка с заинтересованностью"
        - "одобрение общего собрания"
        - "одобрение совета директоров"
        - "решение единственного участника"
        - "одобрение не требуется"
        - "корпоративное одобрение"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(заказчик|подрядчик|генподрядчик).*именуем"
        - "(?i)действующ[а-яё]+\\s+на\\s+основании"
        - "(?i)крупн(ая|ой)\\s+сделк"
        - "(?i)заинтересованност"
        - "(?i)одобрен(ие|а)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор строительного подряда по ст. 432, 740 ГК РФ,
        ст. 182 ГК РФ, а также по правилам о корпоративном одобрении
        для юридических лиц.
        Проверяется только один вопрос: идентификация Заказчика и Подрядчика,
        их реквизиты, подписанты, основания полномочий и корпоративное одобрение.

        Нормативный ориентир:
        - ст. 432 ГК РФ
        - ст. 740 ГК РФ
        - ст. 182 ГК РФ
        - ФЗ-14 «Об ООО»
        - ФЗ-208 «Об АО»

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Наименование / ФИО и реквизиты Подрядчика.
        2. Тип Подрядчика.
        3. Кто подписывает договор от имени Подрядчика.
        4. На каком основании действует подписант Подрядчика.
        5. Наименование / ФИО и реквизиты Заказчика.
        6. Тип Заказчика.
        7. Кто подписывает договор от имени Заказчика.
        8. На каком основании действует подписант Заказчика.
        9. Есть ли в тексте указание на корпоративное одобрение сделки
           или на то, что такое одобрение не требуется.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined".
        4. Если текстового значения нет — возвращай "Данные не определены".
        5. Не используй "None", "null", "not_found" или пустые строки.
        6. Для физлица, ИП или самозанятого, подписывающего договор лично,
           используй basis = "personal".
        7. Не выводи корпоративные выводы по умолчанию, если одобрение
           не отражено в тексте договора.
        8. Тип стороны определяй только по прямым идентификационным
           формулировкам договора.
        9. В evidence включай только текст договора.
        10. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — данные определены:
        Фрагмент:
        "Общество с ограниченной ответственностью «Строй-Инвест»,
        ИНН 7700000001, ОГРН 1027700000001, именуемое в дальнейшем
        «Подрядчик», в лице Генерального директора Иванова А.А.,
        действующего на основании Устава, с одной стороны, и Акционерное
        общество «Девелопмент-Проект», ИНН 7700000002, ОГРН 1027700000002,
        именуемое в дальнейшем «Заказчик», в лице Генерального директора
        Петрова Б.Б., действующего на основании Устава, с другой стороны,
        заключили настоящий договор. Сделка одобрена решением совета
        директоров Заказчика от 01.03.2026."

        Ответ:
        {
          "contractor_details_status": "defined",
          "contractor_details_value": "ООО «Строй-Инвест», ИНН 7700000001, ОГРН 1027700000001",
          "contractor_type": "legal_entity",
          "contractor_signatory": "Генеральный директор Иванов А.А.",
          "contractor_signatory_basis": "charter",
          "customer_details_status": "defined",
          "customer_details_value": "АО «Девелопмент-Проект», ИНН 7700000002, ОГРН 1027700000002",
          "customer_type": "legal_entity",
          "customer_signatory": "Генеральный директор Петров Б.Б.",
          "customer_signatory_basis": "charter",
          "corporate_approval_status": "defined",
          "corporate_approval_details": "Сделка одобрена решением совета директоров Заказчика от 01.03.2026.",
          "evidence": [
            {
              "clause_ref": "преамбула",
              "quote": "Общество с ограниченной ответственностью «Строй-Инвест», ИНН 7700000001, ОГРН 1027700000001, именуемое в дальнейшем «Подрядчик», в лице Генерального директора Иванова А.А., действующего на основании Устава..."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Подрядчик и Заказчик заключили настоящий договор."

        Ответ:
        {
          "contractor_details_status": "not_defined",
          "contractor_details_value": "Данные не определены",
          "contractor_type": "not_defined",
          "contractor_signatory": "Данные не определены",
          "contractor_signatory_basis": "not_defined",
          "customer_details_status": "not_defined",
          "customer_details_value": "Данные не определены",
          "customer_type": "not_defined",
          "customer_signatory": "Данные не определены",
          "customer_signatory_basis": "not_defined",
          "corporate_approval_status": "not_defined",
          "corporate_approval_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о реквизитах Подрядчика.
        2. Найди прямую цитату о подписанте Подрядчика и основании его полномочий.
        3. Найди прямую цитату о реквизитах Заказчика.
        4. Найди прямую цитату о подписанте Заказчика и основании его полномочий.
        5. Найди прямую цитату о корпоративном одобрении или указании,
           что оно не требуется.
        6. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "contractor_details_status": "<defined / not_defined>",
          "contractor_details_value": "<реквизиты или 'Данные не определены'>",
          "contractor_type": "<legal_entity / state_entity / individual / ip / self_employed / not_defined>",
          "contractor_signatory": "<текст или 'Данные не определены'>",
          "contractor_signatory_basis": "<charter / poa / order / personal / other / not_defined>",
          "customer_details_status": "<defined / not_defined>",
          "customer_details_value": "<реквизиты или 'Данные не определены'>",
          "customer_type": "<legal_entity / state_entity / individual / ip / self_employed / not_defined>",
          "customer_signatory": "<текст или 'Данные не определены'>",
          "customer_signatory_basis": "<charter / poa / order / personal / other / not_defined>",
          "corporate_approval_status": "<defined / not_defined>",
          "corporate_approval_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 760

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "заказчик подрядчик генподрядчик именуем в лице действующего на основании ИНН ОГРН устав доверенность приказ паспорт гражданин физическое лицо крупная сделка сделка с заинтересованностью одобрение общего собрания совета директоров корпоративное одобрение"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - representations
        - boilerplate
      negative_keywords:
        - "смета"
        - "цена"
        - "КС-2"
        - "КС-3"
        - "гарантийный срок"
        - "неустойка"
        - "форс-мажор"
        - "скрытые работы"
      position_bias:
        preferred_range: [0.0, 0.20]
        boost: 0.30
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "representations"
        - "boilerplate"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.15

    evidence:
