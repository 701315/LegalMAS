      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора строительного подряда
        условия об охране труда и безопасности на строительной площадке: ответственная сторона, 
        СИЗ (средства индивидуальной защиты), инструктаж, уведомление о несчастных случаях, 
        акт-допуск и пропускной режим.
        Не анализируй смету, сроки, гарантию, страхование или экологию.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 8 полей:

        1. safety_obligations_defined — "yes" / "no" / "not_defined".
        2. responsible_party_for_safety — "contractor" / "customer" / "both" / "not_defined".
        3. incident_notification_duty — "yes" / "no" / "not_defined".
        4. ppe_and_instruction_requirements — "yes" / "no" / "not_defined".
        5. access_control_defined — "yes" / "no" / "not_defined".
        6. site_safety_summary — краткая user-facing сводка по режиму безопасности.
           Примеры: "Подрядчик отвечает за охрану труда; обеспечивает СИЗ и инструктаж; 
           уведомляет о несчастных случаях; допуск на площадку по пропускам Заказчика." /
           "Охрана труда не урегулирована." / "Не установлено".
        7. site_safety_details — подробная формулировка об охране труда и безопасности.
        8. evidence — массив цитат из текста договора.
        </task>

        <context_rules>
        - Используй только текст договора из <context>.
        - Если раздела об охране труда нет в контексте — верни все статусы как "not_defined",
        site_safety_summary как "Не установлено", site_safety_details как "Данные не определены".
        - safety_obligations_defined:
        - "yes" — если договор прямо закрепляет обязанности по охране труда или безопасности работ.
        - "no" — если договор прямо исключает специальные положения.
        - "not_defined" — условие отсутствует в тексте.
        - responsible_party_for_safety:
        - "contractor" — если безопасность прямо возложена на Подрядчика.
        - "customer" — если безопасность прямо возложена на Заказчика.
        - "both" — если обязанности распределены между сторонами.
        - "not_defined" — сторона прямо не определена.
        - incident_notification_duty:
        - "yes" — если прямо предусмотрено уведомление о несчастных случаях, авариях или инцидентах.
        - "no" — если договор прямо исключает такое уведомление.
        - "not_defined" — вопрос не урегулирован.
        - ppe_and_instruction_requirements:
        - "yes" — если прямо предусмотрены СИЗ (каска, жилет, спецобувь), инструктаж (вводный, первичный, повторный),
        допуски или аналогичные меры безопасности.
        - "no" — если договор прямо исключает такие специальные требования.
        - "not_defined" — вопрос не урегулирован.
        - access_control_defined:
        - "yes" — если прямо упомянуты акт-допуск на производство работ, пропускной режим, допуск на площадку по пропускам.
        - "no" — если договор прямо исключает такие процедуры.
        - "not_defined" — вопрос не урегулирован.
        - site_safety_summary:
        - Обязательно отрази наличие СИЗ, инструктажа, уведомления о несчастных случаях и пропускного режима,
        так как это критичные procedural mechanics в строительстве (ТК РФ, СП 12-136-2002).
        - Верни строго JSON со всеми 8 ключами. Запрещены null, None, "N/A" или пустые строки.
        </context_rules>

        <output_expectations>
        - Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        - Не используй markdown fences.
        - Не добавляй пояснения до или после JSON.
        - Верни все ключи, перечисленные в task, без пропусков.
        - Не используй null, None или пустые строки.
        - Для статусных полей используй только значения из allowed_values или "not_defined".
        - Для текстовых полей при отсутствии данных используй "Данные не определены" / "Не удалось определить" / "Не применимо" — согласно правилам выше.
        </output_expectations>

        <output_expectations>
        {
          "safety_obligations_defined": "yes | no | not_defined",
          "responsible_party_for_safety": "contractor | customer | both | not_defined",
          "incident_notification_duty": "yes | no | not_defined",
          "ppe_and_instruction_requirements": "yes | no | not_defined",
          "access_control_defined": "yes | no | not_defined",
          "site_safety_summary": "string",
          "site_safety_details": "string",
          "evidence": [{"clause_ref": "string", "quote": "string"}]
        }
        </output_expectations>

      fields:
        - name: "safety_obligations_defined"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Есть ли специальные обязанности по охране труда и безопасности."
