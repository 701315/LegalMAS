      store_payload: true

  - id: customer_termination_for_cause
    name: "Расторжение договора по инициативе Заказчика при нарушении Подрядчика (ст. 715 ГК РФ)"
    description: >
      Фактографическая проверка оснований и порядка расторжения договора  строительного подряда по инициативе Заказчика при нарушении Подрядчиком  своих обязательств: некачественное выполнение работ, нарушение сроков,  непредоставление доступа, а также порядка уведомления, срока для устранения  нарушений и финансовых последствий расторжения (ст. 715 ГК РФ).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "расторжение по инициативе заказчика"
        - "отказ заказчика от договора"
        - "нарушение подрядчиком"
        - "некачественное выполнение"
        - "нарушение сроков"
        - "срок для устранения"
        - "уведомление о расторжении"
        - "последствия расторжения"
        - "ст. 715"
        - "право заказчика расторгнуть"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)расторж.*по.*инициатив.*заказчик"
        - "(?i)заказчик.*вправ.*расторг|заказчик.*вправ.*отказ"
        - "(?i)нарушен.*подрядчик.*срок|нарушен.*качеств"
        - "(?i)ст\\.?\\s*715\\s+ГК\\s+РФ"
        - "(?i)срок.*устранен.*нарушен"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор строительного подряда по ст. 715 ГК РФ.
        Проверяется только один вопрос: при каких нарушениях Подрядчика Заказчик 
        вправе расторгнуть договор, какой порядок уведомления и устранения нарушений, 
        и каковы финансовые последствия такого расторжения.

        Нормативный ориентир:
        - ст. 715 ГК РФ (права Заказчика при нарушении договора Подрядчиком)
        - ст. 450 ГК РФ (основания изменения и расторжения договора)
        - ст. 452 ГК РФ (порядок расторжения договора)

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не оценивай риск, фиксируй условия буквально.
        - По ст. 715 ГК РФ Заказчик вправе отказаться от договора, если Подрядчик:
          (1) не приступает к работе своевременно;
          (2) выполняет работу настолько медленно, что окончание в срок невозможно;
          (3) не устраняет нарушения в разумный срок.
        - Различай ст. 715 (расторжение при нарушении Подрядчика) и ст. 717 
          (односторонний отказ Заказчика без нарушения — другой чек).

        [ЗАДАЧА]
        1. Перечислены ли основания для расторжения по инициативе Заказчика.
        2. Предусмотрен ли срок для устранения нарушений Подрядчиком (cure period).
        3. Каков порядок уведомления о расторжении.
        4. Каковы финансовые последствия расторжения для Подрядчика.
        5. Сформируй краткую сводку.
        6. Извлеки подробную формулировку.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона вместо текста договора.
        2. Если условие не указано прямо — возвращай "not_defined" для статусов и "Данные не определены" для текста.
        3. Не используй "None", "null", "N/A" или пустые строки.
        4. В evidence включай только точные цитаты из текста договора.
        5. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — данные определены:
        Фрагмент:
        "Заказчик вправе расторгнуть настоящий договор в одностороннем порядке 
        в случае: (а) нарушения Подрядчиком сроков выполнения работ более чем 
        на 30 календарных дней; (б) выявления существенных недостатков качества, 
        не устранённых в течение 15 рабочих дней с момента получения письменного 
        уведомления. При расторжении Подрядчик обязан возместить Заказчику все 
        убытки, включая стоимость привлечения нового подрядчика."

        Ответ:
        {
          "termination_grounds_defined": "yes",
          "cure_period_defined": "yes",
          "termination_notice_procedure": "written",
          "termination_financial_consequences": "contractor_liability",
          "customer_termination_summary": "Расторжение при просрочке > 30 дней или неустранении дефектов за 15 рабочих дней; Подрядчик возмещает все убытки.",
          "customer_termination_details": "Заказчик вправе расторгнуть договор при нарушении сроков более чем на 30 дней или неустранении существенных недостатков в течение 15 рабочих дней после письменного уведомления. Подрядчик возмещает все убытки, включая стоимость привлечения нового подрядчика.",
          "evidence": [
            {
              "clause_ref": "п. 14.2",
              "quote": "Заказчик вправе расторгнуть настоящий договор в одностороннем порядке в случае: (а) нарушения Подрядчиком сроков выполнения работ более чем на 30 календарных дней; (б) выявления существенных недостатков качества, не устранённых в течение 15 рабочих дней с момента получения письменного уведомления."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Договор может быть расторгнут по соглашению сторон."

        Ответ:
        {
          "termination_grounds_defined": "not_defined",
          "cure_period_defined": "not_defined",
          "termination_notice_procedure": "not_defined",
          "termination_financial_consequences": "not_defined",
          "customer_termination_summary": "Не установлено",
          "customer_termination_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату об основаниях расторжения по инициативе Заказчика.
        2. Найди прямую цитату о сроке для устранения нарушений.
        3. Найди прямую цитату о порядке уведомления.
        4. Найди прямую цитату о финансовых последствиях расторжения.
        5. Если прямой цитаты нет — верни "not_defined" / "Данные не определены".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "termination_grounds_defined": "<yes / no / not_defined>",
          "cure_period_defined": "<yes / no / not_defined>",
          "termination_notice_procedure": "<written / oral / not_defined>",
          "termination_financial_consequences": "<contractor_liability / partial_payment / no_compensation / not_defined>",
          "customer_termination_summary": "<краткая сводка>",
          "customer_termination_details": "<подробный текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 950

    retrieval:
      retrieval_profile: "termination_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "расторжение по инициативе заказчика отказ заказчика от договора нарушение подрядчиком некачественное выполнение нарушение сроков срок для устранения уведомление о расторжении последствия расторжения"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "КС-2"
        - "КС-3"
        - "гарантийный срок"
        - "НДС"
        - "аванс"
        - "страхование"
      position_bias:
        preferred_range: [0.55, 1.0]
        boost: 0.18
        scope: segment
      context_k: 5
      max_chunks: 6
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "price_list"
      preferred_clause_functions:
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.14

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"

      compact_output: false

      presence_signal:
        field: "customer_termination_for_cause_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_max_tokens: 1100

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора строительного подряда
        условия о расторжении договора по инициативе Заказчика при нарушении
        Подрядчиком своих обязательств: основания, срок устранения, порядок
        уведомления и финансовые последствия (ст. 715 ГК РФ).
        Не анализируй смету, сроки как самостоятельную тему, гарантию, страхование или экологию.
        Не путай со ст. 717 (односторонний отказ Заказчика без нарушения — другой чек).
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. customer_termination_for_cause_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (termination_grounds_defined, cure_period_defined,
              termination_notice_procedure, termination_financial_consequences) ≠ "not_defined";
           - "missing" — если все содержательные поля = "not_defined" (или "no");
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - termination_grounds_defined = "not_defined";
           - cure_period_defined = "not_defined";
           - termination_notice_procedure = "not_defined";
           - termination_financial_consequences = "not_defined";
           - customer_termination_details = "Данные не определены";
           - customer_termination_summary = "Не установлено";
           - не выполняй остальные шаги.

        1. termination_grounds_defined:
           "yes" / "no" / "not_defined".

        2. cure_period_defined:
           "yes" / "no" / "not_defined".

        3. termination_notice_procedure:
           "written" / "oral" / "not_defined".

        4. termination_financial_consequences:
           "contractor_liability" / "partial_payment" / "no_compensation" / "not_defined".

        5. customer_termination_summary:
           Краткая user-facing сводка.
           Примеры: "Расторжение при просрочке > 30 дней или неустранении дефектов за 15 рабочих дней; Подрядчик возмещает все убытки." / "Не установлено".

        6. customer_termination_details:
           Подробная формулировка, или "Данные не определены".
        </task>

        <context_rules>
        - Перед остальными полями заполни customer_termination_for_cause_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все содержательные сигнальные поля = "not_defined", customer_termination_details = "Данные не определены", customer_termination_summary = "Не установлено".
        - Используй только текст договора из <context>.
        - Не подставляй данные из нормативных актов или общих знаний.
        - termination_grounds_defined:
          - "yes" — если договор прямо перечисляет основания для расторжения по инициативе Заказчика (просрочка, качество, неустранение нарушений).
          - "no" — если договор прямо исключает одностороннее расторжение Заказчиком.
          - "not_defined" — вопрос не урегулирован.
        - cure_period_defined:
          - "yes" — если прямо указан срок для устранения нарушений Подрядчиком до расторжения.
          - "no" — если договор прямо исключает срок устранения (немедленное расторжение).
          - "not_defined" — вопрос не урегулирован.
        - termination_notice_procedure:
          - "written" — если требуется письменное уведомление о расторжении.
          - "oral" — если допускается устное уведомление.
          - "not_defined" — вопрос не урегулирован.
        - termination_financial_consequences:
          - "contractor_liability" — если Подрядчик обязан возместить убытки Заказчика при расторжении (включая стоимость привлечения нового подрядчика).
          - "partial_payment" — если Заказчик оплачивает только фактически выполненные работы.
          - "no_compensation" — если Подрядчик не получает никакой оплаты при расторжении.
          - "not_defined" — вопрос не урегулирован.
        - Запрещено использовать null, None, "N/A" или пустые строки.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В договоре нет условий о расторжении по инициативе Заказчика при нарушении Подрядчика.
           → presence = "missing"; все содержательные статусы = "not_defined"; все текстовые поля = "Данные не определены".

        2. Только общие основания без деталей.
           "Заказчик вправе расторгнуть договор при существенном нарушении Подрядчиком своих обязательств" без раскрытия сроков и процедур.
           → presence = "present"; termination_grounds_defined = "yes"; cure_period_defined = "not_defined"; customer_termination_summary = "Общие основания расторжения без детализации процедуры".

        3. Противоречие между фрагментами.
           В разделе 14: "Срок устранения нарушений — 10 рабочих дней", а в приложении: "Подрядчику предоставляется 30 календарных дней для устранения".
           → presence = "unclear"; cure_period_defined = "not_defined"; customer_termination_details = "Не удалось определить".

        4. Немедленное расторжение без cure period.
           "Заказчик вправе немедленно расторгнуть договор при обнаружении факта использования Подрядчиком контрафактных материалов".
           → presence = "present"; termination_grounds_defined = "yes"; cure_period_defined = "no"; termination_financial_consequences = "contractor_liability".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для customer_termination_for_cause_presence используй только: "present", "missing", "unclear".
        - Для статусных полей используй только значения из allowed_values.
        - Fallback при отсутствии данных: все текстовые значения → "Данные не определены".
        - Fallback при противоречии или неоднозначности: все текстовые значения → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "customer_termination_for_cause_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования расторжения по инициативе Заказчика при нарушении Подрядчика. Внутреннее агрегатное signal-поле."
          required: true

        - name: "termination_grounds_defined"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Перечислены ли основания для расторжения по инициативе Заказчика. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "cure_period_defined"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Предусмотрен ли срок для устранения нарушений Подрядчиком до расторжения. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "termination_notice_procedure"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["written", "oral", "not_defined"]
          description: "Порядок уведомления о расторжении (письменно, устно). Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "termination_financial_consequences"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["contractor_liability", "partial_payment", "no_compensation", "not_defined"]
          description: "Финансовые последствия расторжения для Подрядчика. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "customer_termination_summary"
          type: "string"
          presentation: "fact"
          label: "Расторжение при нарушении Подрядчика"
          description: >
            Сводка: основания, срок устранения, порядок уведомления, финансовые последствия расторжения по инициативе Заказчика (ст. 715 ГК РФ). Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "customer_termination_details"
          label: "Порядок расторжения договора Заказчиком"
          type: "string"
          presentation: "fact"
          description: >
            Подробная формулировка о расторжении по инициативе Заказчика при нарушении Подрядчика. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: false

      store_payload: true

  - id: third_party_liability
    name: "Ответственность за вред третьим лицам при строительстве (ст. 759, 1064 ГК РФ)"
    description: >
      Фактографическая проверка распределения ответственности за причинение вреда  жизни, здоровью или имуществу третьих лиц в ходе строительства, обязанности  страхования гражданской ответственности перед третьими лицами и порядка  возмещения ущерба (ст. 759, 1064–1094 ГК РФ).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "вред третьим лицам"
        - "ущерб третьим лицам"
        - "ответственность перед третьими лицами"
        - "гражданская ответственность"
        - "возмещение вреда"
        - "страхование ответственности"
        - "причинение вреда"
        - "повреждение имущества третьих лиц"
        - "вред жизни и здоровью"
        - "регрессное требование"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)вред.*треть|ущерб.*треть"
        - "(?i)ответственност.*перед.*треть"
        - "(?i)страховани.*гражданск.*ответственност"
        - "(?i)ст\\.?\\s*759\\s+ГК\\s+РФ"
        - "(?i)возмещен.*вред.*причинён"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор строительного подряда по ст. 759, 1064 ГК РФ.
        Проверяется только один вопрос: как распределена ответственность за вред 
        третьим лицам в ходе строительства и требуется ли страхование гражданской 
        ответственности.

        Нормативный ориентир:
        - ст. 759 ГК РФ (ответственность за вред, причинённый при строительстве)
        - ст. 1064 ГК РФ (общие основания деликтной ответственности)
        - ст. 1079 ГК РФ (ответственность за деятельность, создающую повышенную опасность)

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не оценивай риск, фиксируй условия буквально.
        - Различай страхование объекта (СМР/CAR — другой чек) и страхование 
          гражданской ответственности перед третьими лицами (это данный чек).
        - В российской практике строительство — источник повышенной опасности 
          (ст. 1079 ГК РФ), поэтому вопрос ответственности перед третьими лицами критичен.

        [ЗАДАЧА]
        1. Определена ли ответственность за вред третьим лицам.
        2. Кто несёт ответственность (Подрядчик, Заказчик, обе стороны).
        3. Требуется ли страхование гражданской ответственности перед третьими лицами.
        4. Сформируй краткую сводку.
        5. Извлеки подробную формулировку.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона вместо текста договора.
        2. Если условие не указано прямо — возвращай "not_defined" для статусов и "Данные не определены" для текста.
        3. Не используй "None", "null", "N/A" или пустые строки.
        4. В evidence включай только точные цитаты из текста договора.
        5. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — данные определены:
        Фрагмент:
        "Подрядчик несёт полную ответственность за вред, причинённый жизни, здоровью 
        или имуществу третьих лиц в ходе выполнения работ. Подрядчик обязан застраховать 
        свою гражданскую ответственность перед третьими лицами на сумму не менее 
        50 млн рублей на весь период строительства."

        Ответ:
        {
          "third_party_liability_defined": "yes",
          "third_party_liability_bearer": "contractor",
          "third_party_insurance_required": "yes",
          "third_party_liability_summary": "Подрядчик несёт полную ответственность за вред третьим лицам; обязательно страхование ГО на 50 млн руб.",
          "third_party_liability_details": "Подрядчик несёт полную ответственность за вред, причинённый жизни, здоровью или имуществу третьих лиц в ходе выполнения работ. Подрядчик обязан застраховать свою гражданскую ответственность перед третьими лицами на сумму не менее 50 млн рублей на весь период строительства.",
          "evidence": [
            {
              "clause_ref": "п. 10.3",
              "quote": "Подрядчик несёт полную ответственность за вред, причинённый жизни, здоровью или имуществу третьих лиц в ходе выполнения работ. Подрядчик обязан застраховать свою гражданскую ответственность перед третьими лицами на сумму не менее 50 млн рублей."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Подрядчик выполняет работы в соответствии с договором."

        Ответ:
        {
          "third_party_liability_defined": "not_defined",
          "third_party_liability_bearer": "not_defined",
          "third_party_insurance_required": "not_defined",
          "third_party_liability_summary": "Не установлено",
          "third_party_liability_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату об ответственности за вред третьим лицам.
        2. Найди прямую цитату о стороне, несущей ответственность.
        3. Найди прямую цитату о страховании гражданской ответственности.
        4. Если прямой цитаты нет — верни "not_defined" / "Данные не определены".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "third_party_liability_defined": "<yes / no / not_defined>",
          "third_party_liability_bearer": "<contractor / customer / both / not_defined>",
          "third_party_insurance_required": "<yes / no / not_defined>",
          "third_party_liability_summary": "<краткая сводка>",
          "third_party_liability_details": "<подробный текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 850

    retrieval:
      retrieval_profile: "insurance_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "вред третьим лицам ущерб третьим лицам ответственность перед третьими лицами гражданская ответственность возмещение вреда страхование ответственности повреждение имущества третьих лиц регресс"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
      negative_keywords:
        - "КС-2"
        - "КС-3"
        - "гарантийный срок"
        - "НДС"
        - "аванс"
        - "СМР"
      position_bias:
        preferred_range: [0.30, 0.90]
        boost: 0.18
        scope: segment
      context_k: 5
      max_chunks: 6
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "price_list"
      preferred_clause_functions:
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.14

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"

      compact_output: false

      presence_signal:
        field: "third_party_liability_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_max_tokens: 1000

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора строительного подряда
        условия об ответственности за вред третьим лицам при строительстве
        и страховании гражданской ответственности (ст. 759, 1064 ГК РФ).
        Не анализируй смету, сроки, гарантию, экологию или страхование объекта (СМР/CAR).
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. third_party_liability_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (third_party_liability_defined, third_party_liability_bearer,
              third_party_insurance_required) ≠ "not_defined";
           - "missing" — если все содержательные поля = "not_defined" (или "no");
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - third_party_liability_defined = "not_defined";
           - third_party_liability_bearer = "not_defined";
           - third_party_insurance_required = "not_defined";
           - third_party_liability_details = "Данные не определены";
           - third_party_liability_summary = "Не установлено";
           - не выполняй остальные шаги.

        1. third_party_liability_defined:
           "yes" / "no" / "not_defined".

        2. third_party_liability_bearer:
           "contractor" / "customer" / "both" / "not_defined".

        3. third_party_insurance_required:
           "yes" / "no" / "not_defined".

        4. third_party_liability_summary:
           Краткая user-facing сводка.
           Примеры: "Подрядчик несёт полную ответственность за вред третьим лицам; обязательно страхование ГО на 50 млн руб." / "Не установлено".

        5. third_party_liability_details:
           Подробная формулировка, или "Данные не определены".
        </task>

        <context_rules>
        - Перед остальными полями заполни third_party_liability_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все содержательные сигнальные поля = "not_defined", third_party_liability_details = "Данные не определены", third_party_liability_summary = "Не установлено".
        - Используй только текст договора из <context>.
        - Не подставляй данные из нормативных актов или общих знаний.
        - third_party_liability_defined:
          - "yes" — если договор прямо распределяет ответственность за вред третьим лицам.
          - "no" — если договор прямо исключает специальную ответственность.
          - "not_defined" — вопрос не урегулирован.
        - third_party_liability_bearer:
          - "contractor" — если ответственность возложена на Подрядчика.
          - "customer" — если ответственность возложена на Заказчика.
          - "both" — если ответственность распределена между сторонами (например, по зонам).
          - "not_defined" — не урегулировано.
        - third_party_insurance_required:
          - "yes" — если прямо требуется страхование гражданской ответственности перед третьими лицами.
          - "no" — если страхование прямо исключено.
          - "not_defined" — не урегулировано.
        - Запрещено использовать null, None, "N/A" или пустые строки.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В договоре нет положений об ответственности за вред третьим лицам или страховании ГО.
           → presence = "missing"; все содержательные статусы = "not_defined"; все текстовые поля = "Данные не определены".

        2. Только страхование без распределения ответственности.
           Подрядчик обязан застраховать ГО перед третьими лицами, но распределение самой ответственности не раскрыто.
           → presence = "present"; third_party_insurance_required = "yes"; third_party_liability_bearer = "not_defined"; third_party_liability_summary = "Требуется страхование ГО; распределение ответственности не раскрыто".

        3. Противоречие между фрагментами.
           В разделе 10: "Подрядчик несёт полную ответственность за вред третьим лицам", а в разделе 15: "Заказчик компенсирует ущерб, причинённый третьим лицам в зоне его ответственности".
           → presence = "unclear"; third_party_liability_bearer = "not_defined"; third_party_liability_details = "Не удалось определить".

        4. Разграничение по зонам ответственности.
           Подрядчик отвечает за вред в зоне производства СМР, Заказчик — за вред в зоне действующего предприятия.
           → presence = "present"; third_party_liability_bearer = "both"; third_party_liability_summary = "Разграничение по зонам: Подрядчик — в зоне СМР, Заказчик — в зоне предприятия".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для third_party_liability_presence используй только: "present", "missing", "unclear".
        - Для статусных полей используй только значения из allowed_values.
        - Fallback при отсутствии данных: все текстовые значения → "Данные не определены".
        - Fallback при противоречии или неоднозначности: все текстовые значения → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "third_party_liability_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования ответственности перед третьими лицами в договоре. Внутреннее агрегатное signal-поле."
          required: true

        - name: "third_party_liability_defined"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Определена ли ответственность за вред третьим лицам. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "third_party_liability_bearer"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["contractor", "customer", "both", "not_defined"]
          description: "Кто несёт ответственность за вред третьим лицам. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "third_party_insurance_required"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Требуется ли страхование гражданской ответственности перед третьими лицами. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "third_party_liability_summary"
          type: "string"
          presentation: "fact"
          label: "Ответственность перед третьими лицами"
          description: >
            Сводка: распределение ответственности за вред третьим лицам, страхование ГО (ст. 759, 1064 ГК РФ). Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "third_party_liability_details"
          label: "Условия ответственности перед третьими лицами"
          type: "string"
          presentation: "fact"
          description: >
            Подробная формулировка об ответственности за вред третьим лицам. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: false

      store_payload: true

# ════════════════════════════════════════════════════════════════════════════
# БЛОК 5: DD_REQUEST_TEMPLATES
# Читается: DDRequestTemplateLoader
# ════════════════════════════════════════════════════════════════════════════

dd_request_templates:

  construction_object_description:
    text: >
      Просим подтвердить по {doc_names}: (а) полное наименование объекта строительства;
      (б) адрес/местоположение; (в) кадастровый номер земельного участка;
      (г) основные технико-экономические показатели (площадь, этажность, назначение)
      (ст. 743 ГК РФ, ст. 48 ГрадК РФ). Без чёткого описания — риск признания договора
      незаключённым.
    addressee: "Обе стороны"

  design_documentation_integration:
    text: >
      Просим уточнить в {doc_names}: (а) статус проектной документации — приложение к
      договору или ссылка с реквизитами; (б) прошла ли ПД государственную экспертизу
      (ст. 49 ГрадК РФ) — номер и дата заключения; (в) наличие разрешения на
      строительство (ст. 51 ГрадК РФ). Без утверждённой ПД невозможен ввод объекта.
    addressee: "Заказчик"

  contract_price_and_estimate:
    text: >
      Просим уточнить в {doc_names}: (а) итоговую цену договора цифрами и прописью;
      (б) тип сметы — твёрдая или приблизительная; (в) включает ли цена НДС;
      (г) смета как приложение (ст. 746, 709 ГК РФ).
    addressee: "Обе стороны"

  construction_start_and_end_dates:
    text: >
      Просим указать в {doc_names} конкретные даты начала и окончания работ (ст. 708, 740
      ГК РФ). Размытые формулировки («в течение разумного срока», «по готовности проекта»)
      существенно осложняют взыскание неустойки при просрочке.
    addressee: "Обе стороны"

  calendar_plan_and_milestones:
    text: >
      Просим предоставить/приложить к {doc_names} календарный план (график производства
      работ) с промежуточными вехами и датами завершения этапов (ст. 708 ГК РФ).
      Особенно критично при этапном строительстве, пусковых комплексах и очередях.
    addressee: "Подрядчик"

  customer_site_and_permits_obligations:
    text: >
      Просим подтвердить по {doc_names}: (а) наличие и статус прав на земельный участок
      (собственность/аренда); (б) кто получает разрешение на строительство и в какие сроки;
      (в) технические условия подключения к инженерным сетям (ст. 747 ГК РФ).
      Отсутствие прав на землю — основание для немедленной приостановки работ.
    addressee: "Заказчик"

  technical_supervision_right:
    text: >
      Просим уточнить в {doc_names}: (а) объём права на технический надзор и строительный
      контроль; (б) доступ представителя заказчика на площадку; (в) право отбора проб и
      образцов; (г) ведение журнала строительного контроля (ст. 748 ГК РФ).
      Условие о невмешательстве в хоздеятельность подрядчика (ст. 748 п. 3).
    addressee: "Заказчик"

  acceptance_procedure_ks2_ks3:
    text: >
      Просим уточнить в {doc_names}: (а) форматы актов — КС-2 и КС-3 или эквивалентные;
      (б) срок для подписания акта или предъявления мотивированного отказа;
      (в) механизм одностороннего подписания при уклонении (ст. 753 ГК РФ);
      (г) порядок рассмотрения возражений. Одностороннее подписание — ключевой инструмент
      подрядчика для взыскания оплаты.
    addressee: "Обе стороны"

  hidden_works_certification:
    text: >
      Просим предусмотреть в {doc_names}: (а) перечень работ, подлежащих освидетельствованию
      как скрытые; (б) срок вызова представителя заказчика для освидетельствования;
      (в) последствия неявки — право подписать акт односторонне; (г) ссылку на СП
      48.13330.2019. Без актов освидетельствования — риск дорогостоящего вскрытия.
    addressee: "Подрядчик"

  subcontracting_rights_and_responsibility:
    text: >
      Просим уточнить в {doc_names}: (а) право привлечения субподрядчиков и нужно ли
      согласование заказчика; (б) перечень ключевых субподрядчиков как приложение;
      (в) ответственность генподрядчика за работу субподрядчиков (ст. 706 ГК РФ);
      (г) право заказчика отклонить субподрядчика при наличии разумных оснований.
    addressee: "Подрядчик"

  sro_membership_requirement:
    text: >
      Просим подтвердить по {doc_names}: (а) членство подрядчика в СРО в области
      строительства; (б) наличие допуска к соответствующим видам работ; (в) срок действия
      свидетельства (ст. 55.8 ГрадК РФ; 315-ФЗ). Работы без допуска — административная
      ответственность и риск приостановки строительства.
    addressee: "Подрядчик"

  insurance_construction_risks:
    text: >
      Просим уточнить в {doc_names}: (а) кто и в какой срок оформляет страхование
      строительных рисков; (б) страховые суммы (объект, ГО, несчастные случаи);
      (в) выгодоприобретатель; (г) порядок предоставления полиса заказчику (ст. 742
      ГК РФ). Отсутствие страхования — катастрофические риски при гибели объекта или
      несчастном случае.
    addressee: "Подрядчик"

  warranty_period_and_defect_procedure:
    text: >
      Просим уточнить в {doc_names}: (а) гарантийный срок на объект (не менее 5 лет по
      ст. 756 ГК РФ) и на инженерные сети (не менее 2 лет); (б) порядок предъявления
      претензий по гарантийным случаям; (в) срок устранения недостатков; (г) последствия
      неустранения (право заказчика на независимый ремонт с возмещением расходов).
    addressee: "Обе стороны"

  retention_money_guarantee_deposit:
    text: >
      Рекомендуем предусмотреть в {doc_names} гарантийный депозит (удержание 3-10% от цены)
      до истечения гарантийного срока. Это реальный инструмент стимулирования к устранению
      дефектов: просим согласовать размер удержания, порядок и сроки возврата по истечении
      гарантийного срока (ст. 746 ГК РФ).
    addressee: "Заказчик"

  advance_and_staged_payments:
    text: >
      Просим уточнить в {doc_names}: (а) размер аванса (% от цены); (б) порядок погашения
      аванса из промежуточных платежей; (в) периодичность оплаты по КС-2/КС-3;
      (г) срок оплаты счёта после подписания актов; (д) порядок удержания при авансовой
      гарантии (ст. 711, 746 ГК РФ).
    addressee: "Обе стороны"

  customer_obligations_breach_consequences:
    text: >
      Просим включить в {doc_names}: (а) право подрядчика приостановить работы при
      задержке финансирования или непредоставлении площадки/разрешений (ст. 719 ГК РФ);
      (б) автоматическое продление сроков на период просрочки заказчика; (в) компенсацию
      прямых расходов на простой (аренда техники, оплата рабочих).
    addressee: "Юридический советник подрядчика"

  liquidated_damages_delay_contractor:
    text: >
      Просим уточнить в {doc_names}: (а) ставку неустойки за просрочку сдачи объекта
      (рекомендуется 0.01-0.1% от цены/стоимости этапа за каждый день); (б) максимальный
      размер (cap) неустойки; (в) условие о зачёте неустойки в счёт убытков (ст. 330, 394
      ГК РФ). Срыв сроков влечёт каскадные убытки заказчика.
    addressee: "Обе стороны"

  price_firmness_change_orders:
    text: >
      Просим предусмотреть в {doc_names} обязательный порядок оформления дополнительных
      работ: (а) уведомление заказчика о необходимости (ст. 743 п. 3 ГК РФ); (б) срок
      ответа заказчика; (в) дополнительное соглашение как единственное основание для
      оплаты; (г) право подрядчика на приостановку при неполучении ответа в срок.
    addressee: "Юридический советник"

  risk_distribution_construction:
    text: >
      Просим уточнить в {doc_names}: (а) момент перехода риска случайной гибели к заказчику
      (подписание итогового акта или каждого этапного акта) (ст. 741, 753 ГК РФ);
      (б) страхование рисков гибели объекта в период строительства; (в) режим риска при
      повреждении в период приёмки (промежуток между уведомлением и подписанием акта).
    addressee: "Юридический советник"

  force_majeure_long_term_construction:
    text: >
      Просим уточнить в {doc_names}: (а) перечень форс-мажорных обстоятельств (включая
      погодные условия, санкции, перебои в цепочках поставок); (б) порядок и срок
      уведомления (справка ТПП); (в) последствия — продление сроков пропорционально
      периоду действия; (г) максимальный период действия форс-мажора, после которого
      возникает право на расторжение; (д) компенсация дополнительных расходов подрядчика
      (ст. 401, 416, 417 ГК РФ).
    addressee: "Юридический советник"

  construction_object_and_design_docs_extraction:
    text: >
      Просим подтвердить по {doc_names}: (а) полное наименование и адрес объекта;
      (б) кадастровый номер земельного участка; (в) реквизиты проектной документации
      и заключения экспертизы; (г) номер и дату разрешения на строительство.
    addressee: "Заказчик"

  construction_timeline_and_penalty_risk:
    text: >
      Просим подтвердить по {doc_names}: (а) конкретные даты начала и окончания работ;
      (б) наличие календарного плана с промежуточными вехами; (в) ставку и cap
      неустойки за просрочку; (г) оценку каскадных рисков при срыве сроков.
    addressee: "Обе стороны"

  estimate_type_and_change_order_analysis:
    text: >
      Просим подтвердить по {doc_names}: (а) тип сметы (твёрдая/приблизительная);
      (б) порядок согласования дополнительных работ (ст. 743 ГК РФ);
      (в) механизм пересмотра цены при превышении 10% (ст. 744 ГК РФ);
      (г) форму дополнительного соглашения.
    addressee: "Юридический советник"

  technical_supervision_rights_check:
    text: >
      Просим подтвердить по {doc_names}: (а) объём права заказчика на технический
      надзор (ст. 748 ГК РФ); (б) доступ на площадку; (в) право отбора проб;
      (г) кто осуществляет строительный контроль (заказчик / технический заказчик);
      (д) ведение журнала строительного контроля.
    addressee: "Заказчик"

  warranty_and_hidden_defects_analysis:
    text: >
      Просим подтвердить по {doc_names}: (а) гарантийный срок ≥ 5 лет на объект,
      ≥ 2 лет на инженерные сети (ст. 756 ГК РФ); (б) порядок уведомления
      о скрытых дефектах; (в) срок устранения; (г) размер и порядок возврата
      гарантийного удержания; (д) право заказчика на независимый ремонт с возмещением.
    addressee: "Обе стороны"

  environmental_obligations_check:
    text: >
      Просим включить в {doc_names}: (а) обязанность подрядчика по утилизации
      строительных отходов (лицензированная организация); (б) рекультивацию
      территории после завершения; (в) соблюдение экологических нормативов;
      (г) ответственность за загрязнение (ФЗ-89, ФЗ-7).
    addressee: "Юридический советник"

  ip_rights_construction_documentation:
    text: >
      Просим уточнить в {doc_names}: (а) кому принадлежат права на исполнительную
      документацию и as-built чертежи; (б) передаётся ли BIM-модель и в каком
      формате; (в) вправе ли заказчик использовать документацию для реконструкции
      и расширения без дополнительного согласия подрядчика.
    addressee: "Юридический советник"

  construction_without_permit:
    text: >
      Просим подтвердить по {doc_names}: (а) наличие разрешения на строительство
      (ст. 51 ГрК РФ) — номер, дата, орган выдачи; (б) условие о начале работ
      только после получения разрешения; (в) последствия отсутствия разрешения
      (самовольная постройка — ст. 222 ГК РФ, штрафы по ст. 9.5 КоАП).
    addressee: "Заказчик"

  parties_identification:
    text: >
      Просим подтвердить полные реквизиты сторон по {doc_names}: наименование/ФИО,
      ИНН, ОГРН, адрес, документы уполномоченных лиц, подтверждение полномочий.
    addressee: "Обе стороны"

  confidentiality_nda:
    text: >
      Просим включить в {doc_names}: перечень конфиденциальных сведений,
      срок неразглашения, исключения, ответственность за нарушение.
    addressee: "Юридический советник"

  assignment_restriction:
    text: >
      Просим уточнить в {doc_names}: допустимость уступки прав / перевода долга,
      требуется ли согласие другой стороны.
    addressee: "Юридический советник"

  anticorruption_clause:
    text: >
      Просим включить в {doc_names} антикоррупционную оговорку (ФЗ-273):
      заверения сторон, порядок уведомления, последствия нарушения.
    addressee: "Юридический советник"

  governing_law:
    text: >
      Просим подтвердить в {doc_names} применимое право (законодательство РФ),
      подсудность, язык договора.
    addressee: "Юридический советник"

  incoming_materials_quality_control:
    text: >
      Просим включить в {doc_names}: (а) процедуру входного контроля материалов
      и оборудования; (б) требования к сертификатам/паспортам качества;
      (в) порядок отбраковки и замены; (г) согласование замены материалов
      на аналоги (ст. 745 ГК РФ).
    addressee: "Подрядчик"

  consumer_household_construction_warning:
    text: >
      ВНИМАНИЕ: в {doc_names} заказчиком является гражданин. К договору дополнительно
      применяются правила § 2 Главы 37 ГК РФ (бытовой подряд) и Закон о ЗПП
      (ст. 740 п. 3 ГК РФ). Просим проверить: (а) отсутствие ничтожных условий
      (ст. 16 ЗоЗПП); (б) информирование о свойствах работ; (в) право потребителя
      на отказ в любое время (ст. 717, 731 ГК РФ); (г) подсудность по выбору
      потребителя (ст. 17 ЗоЗПП).
    addressee: "Юридический советник"

  # Generic fallback
  _default:
    text: >
      Просим предоставить дополнительную информацию по вопросу «{check_name}»
      применительно к {doc_names}.
    addressee: "Юридический советник"
