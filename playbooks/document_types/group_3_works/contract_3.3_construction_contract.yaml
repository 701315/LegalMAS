      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора строительного подряда
        условия о передаче исполнительной документации (as-built, исполнительные чертежи),
        BIM-моделей, форматах файлов (IFC, RVT, DWG) и переходе исключительных прав
        на документацию (в т.ч. условие о переходе прав после полной оплаты).
        Не анализируй смету, сроки, гарантию, страхование или экологию.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 8 полей:

        1. executive_docs_transfer — "yes" / "no" / "not_defined".
        2. ip_rights_on_docs — "transferred" / "retained_by_contractor" / "not_specified" / "not_defined".
        3. bim_model_transfer — "yes" / "no" / "not_applicable" / "not_defined".
        4. docs_format_specified — "yes" / "no" / "not_defined".
        5. rights_transfer_after_payment — "yes" / "no" / "not_defined".
        6. documentation_and_ip_summary — краткая user-facing сводка по документации и правам.
           Примеры: "Исполнительная документация передаётся в электронном и бумажном виде; 
           BIM-модель в форматах IFC/RVT; права переходят к Заказчику после полной оплаты." /
           "Документация передаётся, но права не урегулированы." / "Не установлено".
        7. ip_docs_details — подробная формулировка условий о документации и правах.
        8. evidence — массив цитат из текста договора.
        </task>

        <context_rules>
        - Используй только текст договора из <context>.
        - Если раздела о документации нет в контексте — верни все статусы как "not_defined",
        documentation_and_ip_summary как "Не установлено", ip_docs_details как "Данные не определены".
        - executive_docs_transfer:
        - "yes" — если исполнительная документация (as-built, исполнительные чертежи, акты скрытых работ)
        прямо подлежит передаче Заказчику.
        - "no" — если договор прямо исключает такую передачу.
        - "not_defined" — условие отсутствует в тексте.
        - ip_rights_on_docs:
        - "transferred" — если исключительные права на документацию / BIM-модель прямо переходят Заказчику.
        - "retained_by_contractor" — если права прямо сохраняются за Подрядчиком.
        - "not_specified" — документация передаётся, но права прямо не урегулированы.
        - "not_defined" — условие отсутствует в тексте.
        - bim_model_transfer:
        - "yes" — если BIM / информационная модель подлежит передаче.
        - "no" — если договор прямо исключает передачу.
        - "not_applicable" — если из текста прямо следует, что BIM-тема не применяется.
        - "not_defined" — вопрос не урегулирован.
        - docs_format_specified:
        - "yes" — если указан формат передачи документов / модели (IFC, RVT, DWG, PDF и т.п.).
        - "no" — если договор прямо указывает на отсутствие специальных требований к формату.
        - "not_defined" — вопрос не урегулирован.
        - rights_transfer_after_payment:
        - "yes" — если переход прав прямо обусловлен полной оплатой работ.
        - "no" — если договор прямо исключает такое условие.
        - "not_defined" — вопрос не урегулирован.
        - Верни строго JSON со всеми 8 ключами. Запрещены null, None, "N/A" или пустые строки.
        </context_rules>

        <output_expectations>
        - Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        - Не используй markdown fences.
        - Не добавляй пояснения до или после JSON.
        - Верни все ключи, перечисленные в task, без пропусков.
        - Не используй null, None или пустые строки.
        - Для статусных полей используй только значения из allowed_values или "not_defined".
        - Для текстовых полей при отсутствии данных используй "Данные не определены" / "Не удалось определить" / "Не применимо" — согласно правилам выше.
        </output_expectations>

        <output_expectations>
        {
          "executive_docs_transfer": "yes | no | not_defined",
          "ip_rights_on_docs": "transferred | retained_by_contractor | not_specified | not_defined",
          "bim_model_transfer": "yes | no | not_applicable | not_defined",
          "docs_format_specified": "yes | no | not_defined",
          "rights_transfer_after_payment": "yes | no | not_defined",
          "documentation_and_ip_summary": "string",
          "ip_docs_details": "string",
          "evidence": [{"clause_ref": "string", "quote": "string"}]
        }
        </output_expectations>

      fields:
        - name: "executive_docs_transfer"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Передаётся ли исполнительная документация Заказчику."
