      llm_max_tokens: 800

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора строительного подряда
        условия о привлечении субподрядчиков и ответственности генподрядчика.
        Не анализируй смету, сроки, гарантию, страхование или экологию.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. subcontracting_rights_and_responsibility_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (subcontracting_mode, subcontractor_approval_required,
              general_contractor_liability, subcontractor_list_required) ≠ "not_defined";
           - "missing" — если все содержательные поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - subcontracting_mode = "not_defined";
           - subcontractor_approval_required = "not_defined";
           - general_contractor_liability = "not_defined";
           - subcontractor_list_required = "not_defined";
           - subcontracting_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. subcontracting_mode:
           "allowed" / "allowed_with_consent" / "prohibited" / "not_defined".

        2. subcontractor_approval_required:
           "yes" / "no" / "not_defined".

        3. general_contractor_liability:
           "yes" / "no" / "not_defined".

        4. subcontractor_list_required:
           "yes" / "no" / "not_defined".

        5. subcontracting_details:
           Формулировка о порядке субподряда, или "Данные не определены".
        </task>

        <context_rules>
        - Перед остальными полями заполни subcontracting_rights_and_responsibility_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все содержательные сигнальные поля = "not_defined", subcontracting_details = "Данные не определены".
        - Используй только текст договора из <context>.
        - Не подставляй данные из нормативных актов или общих знаний.
        - subcontracting_mode:
          - "allowed" — если привлечение субподрядчиков прямо допускается без ограничений.
          - "allowed_with_consent" — если требуется согласие Заказчика или предварительное согласование.
          - "prohibited" — если привлечение субподрядчиков прямо запрещено.
          - "not_defined" — условие отсутствует в тексте.
        - subcontractor_approval_required:
          - "yes" — если требуется согласие или предварительное согласование.
          - "no" — если договор прямо допускает субподряд без согласования.
          - "not_defined" — если по тексту это не установлено.
        - general_contractor_liability:
          - "yes" — если Подрядчик / генподрядчик прямо отвечает за действия субподрядчиков.
          - "no" — если договор прямо исключает такую ответственность.
          - "not_defined" — если по тексту это не установлено.
        - subcontractor_list_required:
          - "yes" — если договор требует перечень субподрядчиков или его согласование.
          - "no" — если договор прямо исключает такое требование.
          - "not_defined" — если по тексту это не установлено.
        - Запрещено использовать null, None, "N/A" или пустые строки.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В договоре нет ни упоминания субподрядчиков, ни прав их привлечения.
           → presence = "missing"; все содержательные статусы = "not_defined"; subcontracting_details = "Данные не определены".

        2. Прямой запрет субподряда.
           "Подрядчик обязан выполнить все предусмотренные настоящим Договором работы лично, без привлечения третьих лиц (субподрядчиков)".
           → presence = "present"; subcontracting_mode = "prohibited"; subcontractor_approval_required = "no"; subcontracting_details = "Субподряд прямо запрещен (личное исполнение)".

        3. Противоречие между фрагментами.
           В п. 3 сказано: "Подрядчик вправе свободно привлекать третьих лиц", а в п. 9: "Любые субподрядчики письменно согласуются с Заказчиком".
           → presence = "unclear"; subcontracting_mode = "not_defined"; subcontracting_details = "Не удалось определить".

        4. Привлечение только из закрытого списка.
           Субподрядчики выбираются строго из согласованного перечня (Приложение №4).
           → presence = "present"; subcontracting_mode = "allowed_with_consent"; subcontractor_list_required = "yes".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для subcontracting_rights_and_responsibility_presence используй только: "present", "missing", "unclear".
        - Для статусных полей используй только значения из allowed_values.
        - Fallback при отсутствии данных: все текстовые значения → "Данные не определены".
        - Fallback при противоречии или неоднозначности: все текстовые значения → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "subcontracting_rights_and_responsibility_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
