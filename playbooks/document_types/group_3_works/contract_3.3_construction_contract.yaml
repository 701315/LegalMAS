#  БЛОК 3: SHARED PATTERNS
#  Читается: DocTypeCheckLoader через _resolve_yaml_templates()
# ════════════════════════════════════════════════════════════════════════════

shared_patterns:

  money_amount: "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|тыс|млн|млрд)"
  date_pattern: "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"
  date_period: "(?i)(не\\s+позднее|в\\s+течение)\\s+\\d+\\s*(календарн|рабоч|дн)"
  percent_pattern: "(?i)\\b\\d+([,.]\\d+)?\\s*%\\s*(в\\s+(день|месяц|год|квартал))?"
  ks2_ks3_pattern: "(?i)(КС-2|форма.*КС-2|акт.*о.*при[её]мк[ееи].*выполненн[ыо]х.*работ)"
  sro_pattern: "(?i)(СРО|саморегулируемая\\s+организация|свидетельств[оа].*о.*допуске)"
  cadastral_pattern: "(?i)(кадастров[а-яё]+\\s+номер|\\b\\d{2}:\\d{2}:\\d{6,7}:\\d+\\b)"

compliance_rules: []

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: CHECKS_V8 — LLM/hybrid проверки
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  - id: parties_identification
    name: "Стороны договора: идентификация заказчика и подрядчика, подписанты и полномочия"
    description: >
      Фактографическая проверка идентификации Заказчика и Подрядчика
      (включая Генподрядчика), их реквизитов, типа стороны, подписантов
      и оснований полномочий. Корпоративное одобрение сделки проверяется
      отдельно в global check corporate_approvals_and_transaction_qualification.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "заказчик"
        - "подрядчик"
        - "генподрядчик"
        - "именуем"
        - "в лице"
        - "действующего на основании"
        - "устав"
        - "доверенность"
        - "приказ"
        - "ИНН"
        - "ОГРН"
        - "паспорт"
        - "гражданин"
        - "физическое лицо"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(заказчик|подрядчик|генподрядчик).*именуем"
        - "(?i)действующ[а-яё]+\\s+на\\s+основании"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор строительного подряда по ст. 432, 740 ГК РФ
        и ст. 182 ГК РФ (представительство).
        Проверяется только один вопрос: идентификация Заказчика и Подрядчика,
        их реквизиты, подписанты и основания полномочий.

        Нормативный ориентир:
        - ст. 432 ГК РФ (существенные условия)
        - ст. 740 ГК РФ (договор строительного подряда)
        - ст. 182 ГК РФ (представительство)

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.
        - Если в договоре сторона именуется «Генподрядчик», это тождественно
          Подрядчику для целей данного анализа.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Наименование / ФИО и реквизиты Подрядчика (включая Генподрядчика).
        2. Тип Подрядчика.
        3. Кто подписывает договор от имени Подрядчика.
        4. На каком основании действует подписант Подрядчика.
        5. Наименование / ФИО и реквизиты Заказчика.
        6. Тип Заказчика.
        7. Кто подписывает договор от имени Заказчика.
        8. На каком основании действует подписант Заказчика.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined" для статусов
           и "Данные не определены" для текстовых полей.
        4. Не используй "None", "null", "N/A" или пустые строки.
        5. Для физлица, ИП или самозанятого, подписывающего договор лично,
           используй basis = "personal".
        6. Тип стороны определяй только по прямым идентификационным
           формулировкам договора (ООО, АО, ИП, гражданин и т.д.).
        7. В evidence включай только точные цитаты из текста договора.
        8. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        со всеми 10 ключами.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — данные определены:
        Фрагмент:
        "Общество с ограниченной ответственностью «Строй-Инвест»,
        ИНН 7700000001, ОГРН 1027700000001, именуемое в дальнейшем
        «Подрядчик», в лице Генерального директора Иванова А.А.,
        действующего на основании Устава, с одной стороны, и Акционерное
        общество «Девелопмент-Проект», ИНН 7700000002, ОГРН 1027700000002,
        именуемое в дальнейшем «Заказчик», в лице Генерального директора
        Петрова Б.Б., действующего на основании Устава, с другой стороны,
        заключили настоящий договор."

        Ответ:
        {
          "contractor_details_status": "defined",
          "contractor_details_value": "ООО «Строй-Инвест», ИНН 7700000001, ОГРН 1027700000001",
          "contractor_type": "legal_entity",
          "contractor_signatory": "Генеральный директор Иванов А.А.",
          "contractor_signatory_basis": "charter",
          "customer_details_status": "defined",
          "customer_details_value": "АО «Девелопмент-Проект», ИНН 7700000002, ОГРН 1027700000002",
          "customer_type": "legal_entity",
          "customer_signatory": "Генеральный директор Петров Б.Б.",
          "customer_signatory_basis": "charter",
          "evidence": [
            {
              "clause_ref": "преамбула",
              "quote": "Общество с ограниченной ответственностью «Строй-Инвест», ИНН 7700000001, ОГРН 1027700000001, именуемое в дальнейшем «Подрядчик», в лице Генерального директора Иванова А.А., действующего на основании Устава..."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Подрядчик и Заказчик заключили настоящий договор."

        Ответ:
        {
          "contractor_details_status": "not_defined",
          "contractor_details_value": "Данные не определены",
          "contractor_type": "not_defined",
          "contractor_signatory": "Данные не определены",
          "contractor_signatory_basis": "not_defined",
          "customer_details_status": "not_defined",
          "customer_details_value": "Данные не определены",
          "customer_type": "not_defined",
          "customer_signatory": "Данные не определены",
          "customer_signatory_basis": "not_defined",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о реквизитах Подрядчика.
        2. Найди прямую цитату о подписанте Подрядчика и основании его полномочий.
        3. Найди прямую цитату о реквизитах Заказчика.
        4. Найди прямую цитату о подписанте Заказчика и основании его полномочий.
        5. Если прямой цитаты нет — верни "not_defined" / "Данные не определены".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "contractor_details_status": "<defined / not_defined>",
          "contractor_details_value": "<реквизиты или 'Данные не определены'>",
          "contractor_type": "<legal_entity / state_entity / individual / ip / self_employed / not_defined>",
          "contractor_signatory": "<текст или 'Данные не определены'>",
          "contractor_signatory_basis": "<charter / poa / order / personal / other / not_defined>",
          "customer_details_status": "<defined / not_defined>",
          "customer_details_value": "<реквизиты или 'Данные не определены'>",
          "customer_type": "<legal_entity / state_entity / individual / ip / self_employed / not_defined>",
          "customer_signatory": "<текст или 'Данные не определены'>",
          "customer_signatory_basis": "<charter / poa / order / personal / other / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 760

    retrieval:
      retrieval_profile: "party_identification_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "заказчик подрядчик генподрядчик именуем в лице действующего на основании ИНН ОГРН устав доверенность приказ паспорт гражданин физическое лицо"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - representations
        - boilerplate
      negative_keywords:
        - "смета"
        - "цена"
        - "КС-2"
        - "КС-3"
        - "гарантийный срок"
        - "неустойка"
        - "форс-мажор"
        - "скрытые работы"
      position_bias:
        preferred_range: [0.0, 0.20]
        boost: 0.30
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "representations"
        - "boilerplate"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.15

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"

      compact_output: false

      presence_signal:
        field: "parties_identification_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_max_tokens: 1300

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора строительного подряда
        сведения о Заказчике и Подрядчике: реквизиты, тип стороны, подписанта
        и основание полномочий.
        Не анализируй предмет договора, цену, расчёты, сроки, гарантию,
        корпоративное одобрение или иные вопросы вне идентификации сторон
        и полномочий подписантов.
        Если в договоре сторона именуется «Генподрядчик», считай это
        Подрядчиком для целей данного анализа.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. parties_identification_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (contractor_details_status, customer_details_status,
              contractor_type, customer_type, contractor_signatory_basis, customer_signatory_basis)
             ≠ "not_defined";
           - "missing" — если все шесть содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - contractor_details_status = "not_defined";
           - customer_details_status = "not_defined";
           - contractor_type = "not_defined";
           - customer_type = "not_defined";
           - contractor_signatory_basis = "not_defined";
           - customer_signatory_basis = "not_defined";
           - contractor_details_value, customer_details_value = "Данные не определены";
           - contractor_signatory, customer_signatory = "Данные не определены";
           - не выполняй остальные шаги.

        1. contractor_details_status:
           - "defined" — если реквизиты Подрядчика прямо указаны в тексте;
           - "not_defined" — если не указаны.

        2. contractor_details_value:
           Наименование / ФИО и реквизиты Подрядчика (ИНН, ОГРН и т.д.), или "Данные не определены".

        3. contractor_type:
           Тип Подрядчика: "legal_entity" / "state_entity" / "individual" / "ip" / "self_employed" / "not_defined".

        4. contractor_signatory:
           Кто подписывает от имени Подрядчика, или "Данные не определены".

        5. contractor_signatory_basis:
           Основание полномочий подписанта Подрядчика: "charter" / "poa" / "order" / "personal" / "other" / "not_defined".

        6. customer_details_status:
           - "defined" — если реквизиты Заказчика прямо указаны в тексте;
           - "not_defined" — если не указаны.

        7. customer_details_value:
           Наименование / ФИО и реквизиты Заказчика (ИНН, ОГРН и т.д.), или "Данные не определены".

        8. customer_type:
           Тип Заказчика: "legal_entity" / "state_entity" / "individual" / "ip" / "self_employed" / "not_defined".

        9. customer_signatory:
           Кто подписывает от имени Заказчика, или "Данные не определены".

        10. customer_signatory_basis:
            Основание полномочий подписанта Заказчика: "charter" / "poa" / "order" / "personal" / "other" / "not_defined".
        </task>

        <context_rules>
        - Перед остальными полями заполни parties_identification_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все содержательные *_status и *_basis поля = "not_defined", все остальные поля = "Данные не определены".
        - Используй только текст договора из <context>.
        - Не подставляй данные из нормативных актов, ЕГРЮЛ или общих знаний.
        - contractor_type / customer_type:
          - "legal_entity" — ООО, АО, ПАО, НАО, компания или иное юридическое лицо.
          - "state_entity" — государственное, муниципальное, бюджетное, казённое учреждение.
          - "individual" — гражданин или физическое лицо (не ИП, не самозанятый).
          - "ip" — индивидуальный предприниматель.
          - "self_employed" — самозанятый или плательщик НПД.
          - "not_defined" — тип стороны прямо не установлен.
        - contractor_signatory_basis / customer_signatory_basis:
          - "charter" — на основании устава.
          - "poa" — на основании доверенности.
          - "order" — на основании приказа.
          - "personal" — подписывает лично как физлицо, ИП или самозанятый.
          - "other" — иное основание.
          - "not_defined" — основание прямо не установлено.
        - Запрещено использовать null, None, "N/A" или пустые строки в качестве значений.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни наименований сторон, ни реквизитов, ни подписантов.
           → presence = "missing"; все содержательные статусы = "not_defined"; все текстовые поля = "Данные не определены".

        2. Только роли без идентификации.
           Упомянуты только понятия "Заказчик" и "Подрядчик", реквизиты и ФИО отсутствуют.
           → presence = "present"; все содержательные статусы = "not_defined"; все текстовые поля = "Данные не определены".

        3. Противоречие между фрагментами.
           В разных частях преамбулы или реквизитов указаны противоречащие наименования или ИНН одной стороны.
           → presence = "unclear"; соответствующие статусы = "not_defined"; соответствующие текстовые поля = "Не удалось определить".

        4. Подписание лично индивидуальным предпринимателем или физлицом.
           ИП или физлицо подписывает договор лично от своего имени без доверенности.
           → presence = "present"; signatory_basis = "personal".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для parties_identification_presence используй только: "present", "missing", "unclear".
        - Для статусных полей используй только: "defined", "not_defined".
        - Для полей типа стороны используй только: "legal_entity", "state_entity", "individual", "ip", "self_employed", "not_defined".
        - Для полей основания полномочий используй только: "charter", "poa", "order", "personal", "other", "not_defined".
        - Fallback при отсутствии данных: все текстовые значения → "Данные не определены".
        - Fallback при противоречии или неоднозначности: все текстовые значения → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "parties_identification_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие идентификации сторон / полномочий в договоре. Внутреннее агрегатное signal-поле."
