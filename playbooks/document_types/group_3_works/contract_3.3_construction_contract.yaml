           "prohibited" / "not_defined".
        2. subcontractor_approval_required — "yes" / "no" / "not_defined".
        3. general_contractor_liability — "yes" / "no" / "not_defined".
        4. subcontractor_list_required — "yes" / "no" / "not_defined".
