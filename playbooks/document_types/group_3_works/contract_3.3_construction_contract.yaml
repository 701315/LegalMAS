           В договоре нет ни условий о досрочном прекращении по ст. 717 ГК РФ, ни запрета на приостановку работ.
           → presence = "missing"; все содержательные статусы = "not_defined"; все текстовые поля = "Данные не определены".

        2. Ссылки на нормы ГК РФ без расшифровки.
           "Расторжение и приостановление работ регулируются действующим законодательством РФ (ст. 717, 719 ГК РФ)".
           → presence = "present"; suspension_right_restricted = "no"; termination_payment_terms = "not_defined"; termination_specifics_summary = "Регулирование приостановки и отказа осуществляется по нормам ГК РФ".

        3. Противоречие между фрагментами.
           В п. 11.1 написано: "Упущенная выгода компенсируется в полном объеме", а в п. 15.4: "Заказчик не компенсирует упущенную выгоду ни при каких обстоятельствах".
           → presence = "unclear"; unearned_profit_compensation = "not_defined"; termination_specifics_details = "Не удалось определить".

        4. Прямое исключение упущенной выгоды.
           "При одностороннем отказе от договора Заказчик возмещает Подрядчику фактические затраты. Убытки в форме упущенной выгоды компенсации не подлежат".
           → presence = "present"; unearned_profit_compensation = "no"; termination_specifics_summary = "Возмещаются только фактические затраты; компенсация упущенной выгоды прямо исключена".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для suspension_and_termination_specifics_presence используй только: "present", "missing", "unclear".
        - Для статусных полей используй только значения из allowed_values.
        - Fallback при отсутствии данных: все текстовые значения → "Данные не определены".
        - Fallback при противоречии или неоднозначности: все текстовые значения → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "suspension_and_termination_specifics_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по приостановке / расторжению в договоре. Внутреннее агрегатное signal-поле."
          required: true

        - name: "suspension_right_restricted"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Ограничено ли право Подрядчика на приостановку работ при нарушении Заказчиком. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "termination_payment_terms"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["full_payment", "partial_payment", "not_defined"]
          description: "Условия оплаты работ при одностороннем отказе Заказчика. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "unearned_profit_compensation"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Компенсируется ли упущенная выгода/накладные расходы при досрочном прекращении. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "termination_specifics_summary"
          type: "string"
          presentation: "fact"
          label: "Приостановка и отказ"
          description: >
            Сводка: право на приостановку при неоплате, оплата при одностороннем отказе, компенсация упущенной выгоды. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "termination_specifics_details"
          label: "Последствия расторжения договора и консервации"
          type: "string"
          presentation: "fact"
          description: >
            Подробная формулировка о приостановке и одностороннем отказе. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: false

      store_payload: true

  - id: engineering_surveys_and_connections
    name: "Инженерные изыскания и точки подключения к инженерным сетям"
    description: >
      Фактографическая проверка обязанности Заказчика предоставить результаты  инженерных изысканий (геология, геодезия), распределения риска их недостоверности  (ст. 744 ГК РФ) и обязанности по предоставлению точек подключения к  инженерным сетям (границы врезки).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "инженерные изыскания"
        - "геологические изыскания"
        - "геодезия"
        - "точки подключения"
        - "границы врезки"
        - "риск недостоверности"
        - "технические условия"
        - "места подключения"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)инженерн.*изыскан"
        - "(?i)точк.*подключени|границ.*врезк"
        - "(?i)риск.*недостоверност"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист. Анализируется договор строительного подряда.
        Проверяется: кто предоставляет инженерные изыскания, на ком риск их недостоверности 
        и кто предоставляет точки подключения к сетям.

        Важно: По ст. 744 ГК РФ риск недостоверности изысканий, предоставленных Заказчиком, 
        лежит на Заказчике. Фиксируй, не перекладывается ли этот риск на Подрядчика.

        [ЗАДАЧА]
        1. Обязан ли Заказчик предоставить результаты инженерных изысканий.
        2. На ком лежит риск недостоверности этих изысканий.
        3. Обязан ли Заказчик предоставить точки подключения к инженерным сетям.
        4. Сформируй сводку по изысканиям и подключениям.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона.
        2. Если условие не указано прямо — возвращай "not_defined" для статусов и "Данные не определены" для текста.
        3. Если данных по изысканиям и подключениям нет вообще — для summary возвращай строго "Не установлено".
        4. Не используй "None", "null", "N/A" или пустые строки.
        5. В evidence включай только точные цитаты из текста договора.
        6. Верни строго один JSON-объект ровно со всеми ключами. Не добавляй и не пропускай ключи.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — данные определены:
        Фрагмент:
        "Заказчик передает Подрядчику результаты инженерно-геологических изысканий. 
        Подрядчик подтверждает, что самостоятельно проверил достоверность изысканий 
        и несет риск последствий ошибок в них. Заказчик обеспечивает точки подключения 
        к сетям водоснабжения согласно Техническим условиям."

        Ответ:
        {
          "surveys_provided": "yes",
          "surveys_risk_bearer": "contractor",
          "connection_points_provided": "yes",
          "surveys_and_connections_summary": "Заказчик предоставляет изыскания и точки подключения; однако риск недостоверности изысканий договором переложен на Подрядчика.",
          "surveys_and_connections_details": "Заказчик передает результаты инженерно-геологических изысканий. Подрядчик подтверждает, что самостоятельно проверил достоверность изысканий и несет риск последствий ошибок. Заказчик обеспечивает точки подключения к сетям водоснабжения.",
          "evidence": [
            {
              "clause_ref": "п. 3.2",
              "quote": "Заказчик передает Подрядчику результаты инженерно-геологических изысканий. Подрядчик подтверждает, что самостоятельно проверил достоверность изысканий и несет риск последствий ошибок в них. Заказчик обеспечивает точки подключения к сетям водоснабжения согласно Техническим условиям."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Подрядчик обязуется выполнить работы по устройству фундамента в соответствии с проектной документацией."

        Ответ:
        {
          "surveys_provided": "not_defined",
          "surveys_risk_bearer": "not_defined",
          "connection_points_provided": "not_defined",
          "surveys_and_connections_summary": "Не установлено",
          "surveys_and_connections_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о предоставлении инженерных изысканий.
        2. Найди прямую цитату о риске недостоверности изысканий.
        3. Найди прямую цитату о точках подключения к инженерным сетям.
        4. Если прямой цитаты нет — верни "not_defined" / "Данные не определены" / "Не установлено".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "surveys_provided": "<yes / no / not_defined>",
          "surveys_risk_bearer": "<customer / contractor / not_defined>",
          "connection_points_provided": "<yes / no / not_defined>",
          "surveys_and_connections_summary": "<краткая сводка или 'Не установлено'>",
          "surveys_and_connections_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 900

    retrieval:
      preferred_clause_functions:
        - obligations
        - procedures
      corpus_scope: "primary_segment"
      levels: ["legal_unit", "section"]
      required_kind: "legal_unit"
      retrieval_query: "инженерные изыскания геологические изыскания геодезия точки подключения границы врезки риск недостоверности технические условия места подключения"
      preferred_unit_types: ["obligation", "general_provision"]
      excluded_unit_types: ["definition", "technical_fragment"]
      negative_keywords: ["КС-2", "КС-3", "гарантийный срок", "неустойка", "НДС"]
      position_bias: {preferred_range: [0.10, 0.60], boost: 0.18, scope: segment}
      context_k: 5
      max_chunks: 6
      rerank: true

    enrichment_hints:
      preferred_segment_types: ["contract", "amendment"]
      excluded_segment_types: ["price_list"]
      preferred_clause_functions: ["obligations"]
      confidence_bonus_on_match: 0.10

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"

      compact_output: false

      presence_signal:
        field: "engineering_surveys_and_connections_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_max_tokens: 1100

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора условия об инженерных изысканиях 
        и точках подключения к инженерным сетям.
        Не анализируй смету, сроки, гарантию, страхование или экологию.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. engineering_surveys_and_connections_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (surveys_provided, surveys_risk_bearer, connection_points_provided) ≠ "not_defined";
           - "missing" — если все три содержательных поля = "not_defined" (или "no");
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - surveys_provided = "not_defined";
           - surveys_risk_bearer = "not_defined";
           - connection_points_provided = "not_defined";
           - surveys_and_connections_details = "Данные не определены";
           - surveys_and_connections_summary = "Не установлено";
           - не выполняй остальные шаги.

        1. surveys_provided:
           "yes" / "no" / "not_defined".

        2. surveys_risk_bearer:
           "customer" (Заказчик) / "contractor" (Подрядчик) / "not_defined".

        3. connection_points_provided:
           "yes" / "no" / "not_defined".

        4. surveys_and_connections_summary:
           Краткая user-facing сводка по изысканиям и точкам подключения.
           Примеры: "Заказчик предоставляет изыскания и точки подключения; риск недостоверности на Подрядчике." / "Не установлено".

        5. surveys_and_connections_details:
           Подробная формулировка условий, или "Данные не определены".
        </task>

        <context_rules>
        - Перед остальными полями заполни engineering_surveys_and_connections_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все содержательные сигнальные поля = "not_defined", surveys_and_connections_details = "Данные не определены", surveys_and_connections_summary = "Не установлено".
        - Используй только текст договора из <context>.
        - Не подставляй данные из нормативных актов или общих знаний.
        - surveys_provided:
          - "yes" — если Заказчик обязан предоставить результаты инженерных изысканий (геология, геодезия).
          - "no" — если обязанность прямо исключена.
          - "not_defined" — вопрос не урегулирован.
        - surveys_risk_bearer:
          - "customer" — если риск недостоверности изысканий лежит на Заказчике.
          - "contractor" — если Подрядчик обязан самостоятельно проверить изыскания и несёт риск последствий ошибок.
          - "not_defined" — вопрос не урегулирован.
        - connection_points_provided:
          - "yes" — если Заказчик обязан предоставить точки подключения к сетям (границы врезки).
          - "no" — если обязанность прямо исключена.
          - "not_defined" — вопрос не урегулирован.
        - Запрещено использовать null, None, "N/A" или пустые строки.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет положений о геологии, геодезии, результатах изысканий или точках подключения к коммуникациям.
           → presence = "missing"; все содержательные статусы = "not_defined"; все текстовые поля = "Данные не определены".

        2. Точки подключения по ТУ без упоминания изысканий.
           Заказчик обеспечивает точки врезки к сетям водоснабжения по ТУ, но предоставление геологических изысканий не раскрыто.
           → presence = "present"; connection_points_provided = "yes"; surveys_provided = "not_defined"; surveys_and_connections_summary = "Предоставляются точки подключения к сетям; изыскания не упомянуты".

        3. Противоречие между фрагментами.
           В разделе 3 указано: "Риск ошибок в геологии несёт Заказчик", а в особых условиях: "Подрядчик несёт полную ответственность за достоверность исходных изысканий".
           → presence = "unclear"; surveys_risk_bearer = "not_defined"; surveys_and_connections_details = "Не удалось определить".

        4. Обязанность проведения изысканий возложена на Подрядчика.
           Подрядчик обязан самостоятельно выполнить комплекс инженерно-геологических изысканий до начала строительства.
           → presence = "present"; surveys_provided = "no"; surveys_risk_bearer = "contractor"; surveys_and_connections_summary = "Проведение изысканий и риски возложены на Подрядчика".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для engineering_surveys_and_connections_presence используй только: "present", "missing", "unclear".
        - Для статусных полей используй только значения из allowed_values.
        - Fallback при отсутствии данных: все текстовые значения → "Данные не определены".
        - Fallback при противоречии или неоднозначности: все текстовые значения → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "engineering_surveys_and_connections_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по изысканиям и подключениям в договоре. Внутреннее агрегатное signal-поле."
          required: true

        - name: "surveys_provided"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Обязан ли Заказчик предоставить результаты инженерных изысканий. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "surveys_risk_bearer"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["customer", "contractor", "not_defined"]
          description: "На ком лежит риск недостоверности инженерных изысканий. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "connection_points_provided"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Обязан ли Заказчик предоставить точки подключения к инженерным сетям. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "surveys_and_connections_summary"
          type: "string"
          presentation: "fact"
          label: "Изыскания и подключения"
          description: >
            Сводка: предоставление изысканий, риск их недостоверности, точки подключения к сетям. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "surveys_and_connections_details"
          label: "Инженерные изыскания и точки подключения"
          type: "string"
          presentation: "fact"
          description: >
            Подробная формулировка об изысканиях и подключениях. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: false

      store_payload: true

  - id: financial_security_and_guarantees
    name: "Финансовое обеспечение исполнения (банковские гарантии)"
    description: >
      Фактографическая проверка наличия требований о предоставлении банковской  гарантии исполнения договора, гарантии возврата аванса, а также сроков  и условий их предоставления (ст. 368 ГК РФ, независимая гарантия).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "medium"
    severity_if_pass: "pass"
    severity_if_fail: "medium"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "банковская гарантия"
        - "гарантия исполнения"
        - "гарантия возврата аванса"
        - "обеспечительная гарантия"
        - "независимая гарантия"
        - "срок предоставления гарантии"
        - "обеспечение исполнения"
        - "обеспечение возврата аванса"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)банковск.*гаранти"
        - "(?i)гаранти.*исполнени|возврат.*аванс"
        - "(?i)независим.*гаранти"
        - "(?i)обеспеч.*исполнени|обеспеч.*аванс"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист. Анализируется договор строительного подряда.
        Проверяется: требуется ли банковская гарантия исполнения и гарантия возврата аванса.

        Важно: В крупных контрактах (особенно с госучастием — 44-ФЗ, 223-ФЗ) это стандарт. 
        Фиксируй, какие именно гарантии требуются, их размер (% от цены) и в какие сроки 
        они должны быть предоставлены. Независимая гарантия регулируется ст. 368 ГК РФ.

        [ЗАДАЧА]
        1. Требуется ли банковская (независимая) гарантия исполнения договора.
        2. Требуется ли гарантия возврата аванса.
        3. Определены ли сроки и условия предоставления гарантий (размер, срок действия).
        4. Сформируй сводку по финансовому обеспечению.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона.
        2. Если условие не указано прямо — возвращай "not_defined" для статусов и "Данные не определены" для текста.
        3. Если данных по банковским гарантиям нет вообще — для summary возвращай строго "Не установлено".
        4. Не используй "None", "null", "N/A" или пустые строки.
        5. В evidence включай только точные цитаты из текста договора.
        6. Верни строго один JSON-объект ровно со всеми ключами. Не добавляй и не пропускай ключи.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — данные определены:
        Фрагмент:
        "Подрядчик обязан предоставить независимую гарантию исполнения договора в размере 5% 
        от цены договора в течение 5 дней с даты подписания. Гарантия возврата аванса в размере 30% 
        предоставляется до перечисления авансового платежа."

        Ответ:
        {
          "performance_bond_required": "yes",
          "advance_payment_guarantee_required": "yes",
          "guarantee_terms_defined": "yes",
          "financial_security_summary": "Требуется гарантия исполнения (5%) в течение 5 дней с даты подписания и гарантия возврата аванса (30%) до его перечисления.",
          "financial_security_details": "Подрядчик обязан предоставить независимую гарантию исполнения договора в размере 5% от цены договора в течение 5 дней с даты подписания. Гарантия возврата аванса в размере 30% предоставляется до перечисления авансового платежа.",
          "evidence": [
            {
              "clause_ref": "п. 6.1",
              "quote": "Подрядчик обязан предоставить независимую гарантию исполнения договора в размере 5% от цены договора в течение 5 дней с даты подписания. Гарантия возврата аванса в размере 30% предоставляется до перечисления авансового платежа."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Оплата работ производится в порядке и размерах, установленных договором."

        Ответ:
        {
          "performance_bond_required": "not_defined",
          "advance_payment_guarantee_required": "not_defined",
          "guarantee_terms_defined": "not_defined",
          "financial_security_summary": "Не установлено",
          "financial_security_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о банковской гарантии исполнения договора.
        2. Найди прямую цитату о гарантии возврата аванса.
        3. Найди прямую цитату о сроках или условиях предоставления гарантий.
        4. Если прямой цитаты нет — верни "not_defined" / "Данные не определены" / "Не установлено".

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "performance_bond_required": "<yes / no / not_defined>",
          "advance_payment_guarantee_required": "<yes / no / not_defined>",
          "guarantee_terms_defined": "<yes / no / not_defined>",
          "financial_security_summary": "<краткая сводка или 'Не установлено'>",
          "financial_security_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
