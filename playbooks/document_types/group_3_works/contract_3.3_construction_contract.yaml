        Фрагмент:
        "До обращения в суд сторона обязана направить письменную претензию. При возникновении спора 
        стороны проводят совместное обследование объекта. В случае разногласий назначается 
        независимая строительно-техническая экспертиза, расходы на которую несёт сторона, 
        требования которой не подтвердились."

        Ответ:
        {
          "pretrial_claim_required": "yes",
          "joint_inspection_required": "yes",
          "technical_expertise_procedure_defined": "yes",
          "expertise_cost_allocation_defined": "yes",
          "dispute_resolution_summary": "Обязателен претензионный порядок; при споре — совместное обследование; при разногласиях — строительно-техническая экспертиза за счет проигравшей стороны.",
          "dispute_resolution_details": "До обращения в суд стороны соблюдают претензионный порядок, проводят совместное обследование и при необходимости назначают независимую строительно-техническую экспертизу; расходы несет сторона, требования которой не подтвердились.",
          "evidence": [
            {
              "clause_ref": "п. 12.2",
              "quote": "До обращения в суд сторона обязана направить письменную претензию. При возникновении спора стороны проводят совместное обследование объекта..."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Споры разрешаются в соответствии с действующим законодательством."

        Ответ:
        {
          "pretrial_claim_required": "not_defined",
          "joint_inspection_required": "not_defined",
          "technical_expertise_procedure_defined": "not_defined",
          "expertise_cost_allocation_defined": "not_defined",
          "dispute_resolution_summary": "Не установлено",
          "dispute_resolution_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о претензионном порядке.
        2. Найди прямую цитату о совместном обследовании.
