        - "(?i)при.*уклонении.*от.*подписания.*акта"
        - "(?i)мотивированн.*отказ.*в\\s+течение"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор строительного подряда по ст. 753 и 720 ГК РФ.
        Проверяется только один вопрос: как в договоре урегулированы формы
        КС-2 / КС-3, порядок приёмки, мотивированный отказ, автоматическая
        приёмка и одностороннее подписание акта.

        Нормативный ориентир:
        - ст. 753 ГК РФ
        - ст. 720 ГК РФ

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Используется ли форма КС-2.
        2. Используется ли форма КС-3.
        3. Есть ли срок для направления мотивированного отказа.
        4. Есть ли автоматическая приёмка при отсутствии отказа.
        5. Есть ли право на одностороннее подписание акта.
        6. Как в целом описан порядок документального оформления приёмки.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined".
        4. Если текстового значения нет — возвращай "Данные не определены".
        5. Не используй "None", "null", "not_found" или пустые строки.
        6. ks2_used = "yes" только если КС-2 прямо указана в тексте.
        7. ks3_used = "yes" только если КС-3 прямо указана в тексте.
        8. auto_acceptance = "yes" только если договор прямо устанавливает,
           что при отсутствии мотивированного отказа результат считается
           принятым.
        9. unilateral_signing_allowed = "yes" только если договор прямо
           допускает одностороннее подписание акта одной стороной.
        10. motivated_refusal_deadline_status = "defined" только если срок
            мотивированного отказа прямо указан.
        11. acceptance_docs_details заполняй только по прямому тексту договора.
        12. В evidence включай только текст договора.
        13. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — данные определены:
        Фрагмент:
        "Сдача выполненных работ оформляется актом по форме КС-2 и справкой
        по форме КС-3. Заказчик обязан в течение 5 рабочих дней либо подписать
        документы, либо направить мотивированный отказ. При отсутствии
        мотивированного отказа работы считаются принятыми. При уклонении
        от подписания акта Подрядчик вправе подписать его в одностороннем порядке."

        Ответ:
        {
          "ks2_used": "yes",
          "ks3_used": "yes",
          "motivated_refusal_deadline_status": "defined",
          "motivated_refusal_deadline_value": "5 рабочих дней.",
          "auto_acceptance": "yes",
          "unilateral_signing_allowed": "yes",
          "acceptance_docs_details": "Сдача выполненных работ оформляется актом по форме КС-2 и справкой по форме КС-3; Заказчик обязан подписать документы либо направить мотивированный отказ.",
          "evidence": [
            {
              "clause_ref": "п. 6.3",
              "quote": "Сдача выполненных работ оформляется актом по форме КС-2 и справкой по форме КС-3. Заказчик обязан в течение 5 рабочих дней либо подписать документы, либо направить мотивированный отказ. При отсутствии мотивированного отказа работы считаются принятыми. При уклонении от подписания акта Подрядчик вправе подписать его в одностороннем порядке."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Результат работ передаётся Заказчику после завершения строительства."

        Ответ:
