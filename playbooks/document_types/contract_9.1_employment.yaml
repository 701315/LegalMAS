  protective_clauses:
    buyer_protection:
      - clause_id: "written_form_and_copy_for_employee"
        name: "Письменная форма и обязательный экземпляр для работника"
        risk_if_missing: |
          Трудовой договор обязателен в письменной форме в двух экземплярах (ст. 67 ТК РФ).
          Без экземпляра у работника он лишён доказательства условий труда, размера зарплаты,
          должности. При споре работодатель может отрицать договорённости. Получение экземпляра
          подтверждается подписью работника на экземпляре работодателя.
        legal_base: "ст. 67 ТК РФ"
        severity: "critical"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "в двух экземплярах"
            - "экземпляр для работника"
            - "получение экземпляра подтверждается"
            - "подпись работника на экземпляре работодателя"
          context_patterns:
            - '(?i)договор\s+составлен\s+в\s+двух\s+экземплярах'
            - '(?i)один\s+экземпляр.*передаётся\s+работнику'
        extraction_hints: {}
      - clause_id: "clear_and_full_payment_structure"
        name: "Прозрачная и полная структура оплаты труда"
        risk_if_missing: |
          Работник рискует получать необоснованно низкую "серую" зарплату или сталкиваться с задержками выплат.
          Без четкого указания всех составляющих (оклад, премии, их условия) работодатель может произвольно
          снижать выплаты, особенно переменную часть. Отсутствие графика выплаты зарплаты нарушает права работника.
        legal_base: "ст. 57, 136 ТК РФ"
        severity: "critical"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "размер оклада (тарифной ставки)"
            - "выплата заработной платы два раза в месяц"
            - "даты выплаты заработной платы"
            - "условия выплаты премии"
            - "порядок индексации заработной платы"
            - "расчетный листок"
          context_patterns:
            - '(?i)заработная\s+плата\s+состоит\s+из\s+оклада\s+в\s+размере'
            - '(?i)заработная\s+плата\s+выплачивается\s+\d+-го\s+и\s+\d+-го\s+числа'
        extraction_hints: {}
      - clause_id: "annual_leave_and_rest_guarantees"
        name: "Гарантии ежегодного оплачиваемого отпуска и времени отдыха"
        risk_if_missing: |
          Работник может быть лишен законного права на отдых, ему могут не предоставлять ежегодный оплачиваемый отпуск,
          вынуждать работать в выходные без правильной компенсации. Без указания продолжительности основного и
          дополнительного отпуска права работника размыты и трудно защищаемы.
        legal_base: "ст. 114, 115, 116, 152, 153 ТК РФ"
        severity: "high"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "ежегодный основной оплачиваемый отпуск продолжительностью"
            - "дополнительный отпуск за работу во вредных условиях"
            - "порядок предоставления отпуска"
            - "компенсация за работу в выходные и нерабочие праздничные дни"
            - "перерывы для отдыха и питания"
          context_patterns:
            - '(?i)работнику\s+предоставляется\s+ежегодный\s+отпуск\s+продолжительностью\s+\d+\s+календарных\s+дней'
            - '(?i)работа\s+в\s+выходные\s+и\s+праздничные\s+дни\s+оплачивается\s+не\s+менее\s+чем\s+в\s+двойном\s+размере'
        extraction_hints: {}
      - clause_id: "protection_from_arbitrary_dismissal"
        name: "Положения, защищающие от произвольного увольнения"
        risk_if_missing: |
          Работник может быть уволен по надуманным основаниям или с нарушением сложной процедуры, предусмотренной ТК РФ.
          Без ссылки в договоре на необходимость соблюдения всех процессуальных требований (предупреждение, предложение
          вакансий, учет мнения профсоюза) работодателю проще осуществить незаконное увольнение.
        legal_base: "ст. 81, 82, 180, 261 ТК РФ"
        severity: "critical"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "увольнение производится в строгом соответствии с основаниями, предусмотренными ТК РФ"
            - "гарантии при увольнении по инициативе работодателя"
            - "выходное пособие"
            - "соблюдение процедуры увольнения"
            - "запрет увольнения в период временной нетрудоспособности и отпуска"
          context_patterns:
            - '(?i)расторжение\s+договора\s+по\s+инициативе\s+работодателя\s+допускается\s+только\s+по\s+основаниям\s+ст.\s+81\s+тк\s+рф'
            - '(?i)при\s+увольнении\s+вследствие\s+ликвидации\s+организации\s+работнику\s+выплачивается\s+выходное\s+пособие'
        extraction_hints: {}
      - clause_id: "probation_period_limits_and_conditions"
        name: "Ограничения и четкие условия испытательного срока"
        risk_if_missing: |
          Испытательный срок — не более 3 месяцев (для руководителей/главбухов — 6 месяцев). Для некоторых категорий
          (беременные, несовершеннолетние, выпускники) испытание запрещено (ст. 70 ТК РФ). Условие об испытании
          должно быть в договоре; его отсутствие означает приём без испытания. Без четких критериев оценки работника
          могут уволить по итогам испытания без реальных оснований.
        legal_base: "ст. 70, 71 ТК РФ"
        severity: "high"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "испытательный срок"
            - "испытание"
            - "срок испытания"
            - "не более 3 месяцев"
            - "без испытания"
            - "критерии успешного прохождения испытания"
          context_patterns:
            - '(?i)испытательный\s+срок\s+составляет'
            - '(?i)работник\s+принимается.*с\s+испытанием'
        extraction_hints: {}
    seller_protection:
      - clause_id: "detailed_job_description_and_duties"
        name: "Детальная должностная инструкция и круг обязанностей"
        risk_if_missing: |
          Без чёткого описания обязанностей (в договоре или должностной инструкции) работодатель не сможет
          требовать выполнения конкретных задач и применять дисциплинарные взыскания за невыполнение.
          Споры о круге обязанностей — распространённая проблема. Работник может отказаться выполнять работу,
          ссылаясь на её неопределенность.
        legal_base: "ст. 57, 60 ТК РФ"
        severity: "high"
        affected_party: "seller"
        detection:
          positive_keywords:
            - "должностная инструкция"
            - "обязанности работника"
            - "трудовые обязанности"
            - "ознакомлен с должностной инструкцией"
            - "приложение к договору"
            - "конкретный вид поручаемой работы"
          context_patterns:
            - '(?i)обязанности\s+работника\s+определяются\s+должностной\s+инструкцией'
            - '(?i)работник\s+ознакомлен\s+с\s+должностной\s+инструкцией'
        extraction_hints: {}
      - clause_id: "confidentiality_and_trade_secrets_protection"
        name: "Защита конфиденциальной информации и коммерческой тайны"
        risk_if_missing: |
          Если работник получает доступ к коммерческой тайне, персональным данным, в договоре должно быть
          условие о неразглашении (ст. 57 ТК РФ). Без него работодатель не сможет привлечь работника к
          ответственности за разглашение и взыскать убытки.
        legal_base: "ст. 57 ТК РФ, ФЗ-98 «О коммерческой тайне»"
        severity: "high"
        affected_party: "seller"
        detection:
          positive_keywords:
            - "неразглашение"
            - "коммерческая тайна"
            - "конфиденциальная информация"
            - "служебная тайна"
            - "персональные данные"
            - "ответственность за разглашение"
          context_patterns:
            - '(?i)работник\s+обязуется\s+не\s+разглашать'
            - '(?i)условие\s+о\s+неразглашении.*тайны'
        extraction_hints: {}
      - clause_id: "material_liability_of_the_employee"
        name: "Условия о полной материальной ответственности работника"
        risk_if_missing: |
          При причинении ущерба имуществу работодателя (хищение, порча) работник будет нести только ограниченную
          материальную ответственность (в размере среднего месячного заработка). Без отдельного письменного договора
          о полной материальной ответственности (для определенных должностей) или без включения соответствующих
          условий в трудовой договор взыскать полную стоимость ущерба будет невозможно.
        legal_base: "ст. 242, 243, 244 ТК РФ"
        severity: "high"
        affected_party: "seller"
        detection:
          positive_keywords:
            - "материальная ответственность"
            - "полная материальная ответственность"
            - "порядок возмещения ущерба"
            - "договор о полной материальной ответственности"
            - "перечень ценностей, вверенных работнику"
          context_patterns:
            - '(?i)работник\s+несет\s+полную\s+материальную\s+ответственность\s+за\s+недостачу\s+вверенного\s+ему\s+имущества'
        extraction_hints: {}
      - clause_id: "disciplinary_procedures_and_grounds"
        name: "Основания и порядок применения дисциплинарных взысканий"
        risk_if_missing: |
          Дисциплинарные взыскания (замечание, выговор, увольнение) применяются только за нарушение трудовых
          обязанностей с соблюдением процедуры (ст. 192–195 ТК РФ). Работодатель должен знать порядок: объяснение
          работника, сроки, приказ. Договор/ПВТР должны фиксировать обязанности для возможности взыскания.
        legal_base: "ст. 192–195 ТК РФ"
        severity: "high"
        affected_party: "seller"
        detection:
          positive_keywords:
            - "дисциплинарное взыскание"
            - "замечание"
            - "выговор"
            - "нарушение трудовой дисциплины"
            - "объяснение работника"
            - "приказ о взыскании"
            - "правила внутреннего трудового распорядка"
          context_patterns:
            - '(?i)за\s+нарушение\s+трудовой\s+дисциплины.*применяются\s+взыскания'
        extraction_hints: {}

  additional_protective_clauses:
    both_protection:
      - clause_id: "clear_anti_requalification_measures"
        name: "Ясные меры против переквалификации ГПХ в трудовой договор"
        risk_if_missing: |
          ГИТ и суды переквалифицируют ГПХ в трудовой при наличии признаков: подчинение, рабочее место,
          график, регулярная оплата за процесс (не результат). Трудовой договор должен чётко содержать
          все признаки трудовых отношений, чтобы избежать споров о характере отношений. Для работодателя —
          риск доначислений, для работника — риск отсутствия гарантий.
        legal_base: "ст. 15, 19.1 ТК РФ"
        severity: "critical"
        affected_party: "both"
        detection:
          positive_keywords:
            - "трудовые отношения"
            - "подчинение работодателю"
            - "выполнение трудовой функции"
            - "рабочее место"
            - "режим труда"
            - "не является гражданско-правовым"
            - "личное выполнение работы"
          context_patterns:
            - '(?i)отношения\s+сторон\s+являются\s+трудовыми'
            - '(?i)работник\s+подчиняется\s+правилам\s+внутреннего\s+трудового\s+распорядка'
        extraction_hints: {}
      - clause_id: "detailed_procedure_for_changing_contract_terms"
        name: "Детальная процедура изменения условий трудового договора"
        risk_if_missing: |
          При необходимости изменить условия труда (зарплату, график, должность) возникает неопределенность.
          Работодатель может нарушить процедуру согласования (ст. 74 ТК РФ), что делает изменения недействительными.
          Работник не понимает своих прав при отказе от изменений. Четкий порядок защищает обе стороны.
        legal_base: "ст. 72, 74 ТК РФ"
        severity: "high"
        affected_party: "both"
        detection:
          positive_keywords:
            - "изменение условий трудового договора"
            - "письменное согласие работника"
            - "уведомление об изменении условий за 2 месяца"
            - "предложение вакантных должностей"
            - "последствия отказа от продолжения работы в новых условиях"
          context_patterns:
            - '(?i)изменение\s+условий\s+трудового\s+договора\s+допускается\s+только\s+по\s+соглашению\s+сторон'
            - '(?i)при\s+отказе\s+работника\s+от\s+продолжения\s+работы\s+в\s+новых\s+условиях\s+трудовой\s+договор\s+прекращается'
        extraction_hints: {}
      - clause_id: "dispute_resolution_procedure"
        name: "Процедура досудебного разрешения индивидуальных трудовых споров"
        risk_if_missing: |
          Любой конфликт (о зарплате, дисциплине, увольнении) сразу переходит в стадию официального разбирательства
          в комиссии по трудовым спорам (КТС) или суде. Это увеличивает сроки, издержки и накаляет отношения.
          Наличие обязательного этапа переговоров или медиации способствует сохранению рабочих отношений.
        legal_base: "ст. 381, 382 ТК РФ, Глава 60 ТК РФ"
        severity: "medium"
        affected_party: "both"
        detection:
          positive_keywords:
            - "досудебный порядок урегулирования споров"
            - "переговоры"
            - "обращение к непосредственному руководителю"
            - "рассмотрение спора в комиссии по трудовым спорам (КТС)"
            - "медиация"
          context_patterns:
            - '(?i)все\s+споры\s+и\s+разногласия\s+стороны\s+стремятся\s+разрешить\s+путем\s+переговоров'
            - '(?i)претензионный\s+порядок\s+разрешения\s+спора\s+является\s+обязательным'
        extraction_hints: {}
    buyer_protection:
      - clause_id: "working_hours_limits_and_overtime_compensation"
        name: "Ограничения рабочего времени и компенсация за переработки"
        risk_if_missing: |
          Нормальная продолжительность рабочего времени — не более 40 часов в неделю (ст. 91 ТК РФ).
          Сверхурочная работа — с согласия работника, оплачивается повышенно (ст. 99, 152 ТК РФ).
          Без чёткого режима работодатель может требовать переработок без компенсации.
        legal_base: "ст. 91, 99, 152 ТК РФ"
        severity: "high"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "продолжительность рабочего времени"
            - "40 часов в неделю"
            - "сверхурочная работа"
            - "работа в выходные"
            - "ночная работа"
            - "повышенная оплата"
          context_patterns:
            - '(?i)продолжительность\s+рабочего\s+времени.*часов\s+в\s+неделю'
            - '(?i)сверхурочная\s+работа.*оплачивается.*в\s+повышенном\s+размере'
        extraction_hints: {}
      - clause_id: "workplace_safety_and_hazard_guarantees"
        name: "Гарантии охраны труда и безопасных условий работы"
        risk_if_missing: |
          Работодатель обязан обеспечить безопасные условия труда (ст. 212 ТК РФ). Работник вправе отказаться
          от работы, угрожающей жизни и здоровью (ст. 379 ТК РФ). Без указания на условия труда и проведённую
          СОУТ работник может не знать о рисках и гарантиях.
        legal_base: "ст. 212–231 ТК РФ, ФЗ-426"
        severity: "high"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "охрана труда"
            - "безопасные условия"
            - "СОУТ"
            - "специальная оценка условий труда"
            - "средства защиты"
            - "инструктаж по охране труда"
          context_patterns:
            - '(?i)работодатель\s+обязан\s+обеспечить\s+безопасные\s+условия\s+труда'
            - '(?i)условия\s+труда.*соответствуют.*требованиям\s+охраны\s+труда'
        extraction_hints: {}
    seller_protection: []

