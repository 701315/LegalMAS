validation_engine_v3_2:
  rules_enhanced:
    phrases:
      high:
        - "Работник обязуется лично выполнять трудовую функцию в соответствии с должностной инструкцией"
        - "Работодатель обязуется обеспечивать условия труда и выплачивать заработную плату"
        - "Работник подчиняется правилам внутреннего трудового распорядка Работодателя"
        - "Заработная плата выплачивается не реже чем каждые полмесяца"
        - "Работник имеет право на ежегодный оплачиваемый отпуск"
        - "Место работы — [конкретный адрес или структурное подразделение]"
      medium:
        - "Работник обязан соблюдать трудовую дисциплину и требования охраны труда"
        - "Оплата труда состоит из должностного оклада (тарифной ставки) и [надбавок, премий]"
        - "Работа выполняется в условиях [нормального/ненормированного] рабочего дня"
        - "На работника распространяются гарантии и компенсации, предусмотренные ТК РФ"
        - "Испытательный срок составляет [не более 3 месяцев]"
    patterns:
      required:
        - "(?i)(трудов\\w+\\s+договор\\w*|работник\\w*|работодател\\w+|трудов\\w+\\s+функци\\w+|подчинени\\w+\\s+правилам)"
      optional:
        - "(?i)(заработн\\w+\\s+плат\\w+|оплат\\w+\\s+труд\\w+|ежегодн\\w+\\s+отпуск|больничн\\w+\\s+лист)"
        - "(?i)(должностн\\w+\\s+инструкци\\w+|срочн\\w+\\s+трудов\\w+\\s+договор|испытательн\\w+\\s+срок)"
    exclusion_logic:
      - condition: "result_oriented AND independent_performer AND no_subordination"
        target: "rejection"
        confidence: 0.85
        description: "Если акцент на разовый результат, самостоятельность исполнителя и отсутствие подчинения — это ГПХ-договор"
      - condition: "voluntary_keywords AND no_remuneration"
        target: "rejection"
        confidence: 0.90
        description: "Если деятельность добровольческая и без вознаграждения — это не трудовой договор"
    weights:
      keyword_high: 3.0
      keyword_medium: 1.5
      keyword_low: 0.5
      phrase_high: 2.5
      phrase_medium: 1.0
      pattern_required: 4.0
      pattern_optional: 1.0
    classification:
      min_confidence: 0.75
      max_matches: 3

    party_roles:
      - "Работодатель (юридическое лицо, индивидуальный предприниматель или физическое лицо)"
      - "Работник (физическое лицо, достигшее возраста для заключения трудового договора)"
    essential_terms:
