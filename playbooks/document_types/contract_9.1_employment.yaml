  # ──────────────────────────────────────────────────────────
  # ESSENTIAL ELEMENTS
  # ──────────────────────────────────────────────────────────
  
  essential_elements:
    - element: "labor_function"
      required: true
      legal_base: "ст. 15, 57 ТК РФ"
      validation_rules:
        - "labor_function_specified"
        - "reference_to_job_description_or_detailed_list"
      extraction_hints: {}
      conditional_checks:
        - trigger: "labor_contract_keywords"
          keywords: ["трудовая функция", "работа по должности", "профессия", "специальность"]
          rule: "labor_function_mandatory"
          legal_base: "ст. 57 ТК РФ"
          severity: "critical"
          risk_msg: "Трудовая функция — существенное условие трудового договора. Ее отсутствие может повлечь признание договора незаключенным по этому условию."
          validation_rules: []
      description: "Конкретный вид поручаемой работы (трудовая функция) — работа по должности/профессии/специальности с указанием квалификации или конкретный вид поручаемой работы."
    
    - element: "place_of_work"
      name: "place_of_work"
      required: true
      legal_base: "ст. 57 ТК РФ"
      description: "Место работы с указанием обособленного структурного подразделения и его адреса (если работа в филиале/представительстве). При дистанционной работе — указание на характер работы."
      validation_rules:
        - "place_of_work_specified"
        - "address_or_structural_unit_mentioned"
      conditional_checks:
        - trigger: "remote_work"
          keywords: ["дистанционная работа", "удалённая работа", "вне места нахождения работодателя"]
          rule: "remote_work_terms_required"
          legal_base: "ст. 312.1–312.9 ТК РФ"
          severity: "high"
          validation_rules:
            - "remote_work_conditions_specified"
            - "communication_procedure_specified"
      extraction_hints: {}
    - element: "start_date_and_term"
      name: "start_date_and_term"
      required: true
      legal_base: "ст. 57, 58, 59, 61 ТК РФ"
      description: "Дата начала работы. Если договор срочный — также срок его действия и обстоятельство (причина), послужившее основанием для заключения срочного договора из перечня ст. 59 ТК РФ."
      validation_rules:
        - "start_date_specified"
      conditional_checks:
        - trigger: "fixed_term_contract"
          keywords: ["срочный трудовой договор", "заключен на срок", "до", "на период"]
          rule: "fixed_term_must_have_basis"
          legal_base: "ст. 58, 59 ТК РФ"
          severity: "critical"
          risk_msg: "Срочный трудовой договор без указания срока и законного основания (ст. 59 ТК РФ) может быть признан заключенным на неопределенный срок."
          validation_rules: []
      extraction_hints: {}
    - element: "payment_terms"
      name: "payment_terms"
      required: true
      legal_base: "ст. 57, 133, 136 ТК РФ"
      description: "Условия оплаты труда: размер тарифной ставки или оклада, доплаты, надбавки, поощрительные выплаты. Указание на выплату заработной платы не реже чем каждые полмесяца."
      validation_rules:
        - "payment_amount_specified"
        - "payment_frequency_mentioned"
      conditional_checks:
        - trigger: "payment_below_mrot"
          keywords: []
          rule: "salary_not_below_mrot"
          legal_base: "ст. 133 ТК РФ"
          severity: "critical"
          risk_msg: "Заработная плата не может быть ниже установленного федеральным законом МРОТ при условии выполнения норм труда."
          validation_rules: []
      extraction_hints: {}
    - element: "harmful_conditions_guarantees"
      name: "harmful_conditions_guarantees"
      required: true
      legal_base: "ст. 57, 219, 224 ТК РФ"
      description: "Гарантии и компенсации за работу с вредными и (или) опасными условиями труда (если работа связана с такими условиями)."
      validation_rules:
        - "check_if_harmful_conditions_present"
      conditional_checks:
        - trigger: "harmful_work_keywords"
          keywords: ["вредные условия", "опасные условия", "спецоценка условий труда", "СОУТ"]
          rule: "guarantees_for_harmful_work_mandatory"
          legal_base: "ст. 219 ТК РФ"
          severity: "high"
          risk_msg: "При работе во вредных/опасных условиях в договоре должны быть указаны полагающиеся гарантии и компенсации (доп. отпуск, сокращенный день, доплата)."
          validation_rules: []
      extraction_hints: {}

