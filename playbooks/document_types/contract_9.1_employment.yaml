type: contract_9.1_employment
name: "Трудовой договор"

description: |
  Соглашение между работодателем (юридическим или физическим лицом, ИП) и работником (физическим лицом),
  по которому работник обязуется лично выполнять трудовую функцию (работу по определенной должности,
  профессии, специальности) с подчинением правилам внутреннего трудового распорядка, а работодатель
  обязуется предоставлять работу, обеспечивать условия труда, своевременно и в полном размере выплачивать
  заработную плату и соблюдать права работника, предусмотренные трудовым законодательством.
  Регулируется императивными нормами Трудового кодекса РФ (ТК РФ), предоставляющими работнику широкий
  спектр социальных гарантий (оплачиваемый отпуск, больничный, минимальная зарплата, защита от
  необоснованного увольнения). Характеризуется отношениями власти и подчинения (работник подконтролен
  работодателю). Условия договора не могут ухудшать положение работника по сравнению с ТК РФ.
  Высокий риск переквалификации гражданско-правовых договоров (подряда, услуг) в трудовые со стороны
  контролирующих органов (ГИТ, ФНС, суд) при наличии признаков трудовых отношений.

version: 2.0
parent: class_9_special_imperative

metadata:
  category: contract
  subcategory: employment
  complexity: high
  risk_level: high
  jurisdiction: RU
  language: ru
