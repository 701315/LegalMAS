  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 10: ВОЗВРАТ ПРЕДМЕТА ЛИЗИНГА
  # ──────────────────────────────────────────────────────────────────────────
  - id: leasing_return_check
    name: "Возврат предмета лизинга: состояние, транспортировка, штрафы за невозврат"
    description: >
      Фактографическая проверка порядка и условий возврата предмета лизинга
      по окончании срока или при расторжении договора: акт возврата, допустимое
      состояние, нормальный износ, кто несёт расходы на транспортировку,
      место возврата и штрафы за невозврат / просрочку.
      Результат предназначен для табличного сравнения нескольких документов.
    triggers: ~
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "возврат предмета лизинга"
        - "возвратить предмет"
        - "акт возврата"
        - "состояние предмета"
        - "нормальный износ"
        - "естественный износ"
        - "транспортировка"
        - "демонтаж"
        - "штраф за невозврат"
        - "удержание за просрочку"
        - "место возврата"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)возвра(т|тить)\\s+предмет.*лизинг"
        - "(?i)акт\\s+возврат"
        - "(?i)нормальн(ый|ого)\\s+износ"
        - "(?i)штраф.*невозврат"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор лизинга по ФЗ-164 и §6 Главы 34 ГК РФ.
        Проверяется только один вопрос: порядок и условия возврата предмета лизинга.

        Нормативный ориентир:
        - ст. 622 ГК РФ (субсидиарно) — возврат арендованного имущества
        - Пленум ВАС РФ от 14.03.2014 №17 — оценка предмета при возврате

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли порядок возврата предмета лизинга.
        2. Есть ли акт возврата.
        3. Описан ли допустимый стандарт состояния при возврате.
        4. Исключён ли нормальный износ из ответственности.
        5. Кто несёт расходы на транспортировку / демонтаж.
        6. Указано ли место возврата.
        7. Есть ли штрафы за невозврат или просрочку возврата.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если данные не указаны прямо — возвращай "Данные не определены" или "not_defined".
        4. Не используй "None", "null", "not_specified" или пустые строки.
        5. В evidence включай только текст договора.
        6. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "По окончании срока лизинга Лизингополучатель обязан вернуть предмет по акту
        возврата в исправном состоянии с учётом нормального износа. Расходы на
        транспортировку несёт Лизингополучатель. Место возврата — г. Москва,
        ул. Складская, 10. За каждый день просрочки возврата — пени 3 000 рублей."

        Ответ:
        {
          "return_procedure_status": "defined",
          "return_procedure_details": "вернуть предмет по акту возврата в исправном состоянии",
          "return_act_status": "defined",
          "return_act_details": "акт возврата",
          "condition_standard_status": "defined",
          "condition_standard_details": "в исправном состоянии с учётом нормального износа",
          "normal_wear_excluded_status": "defined",
          "normal_wear_excluded_details": "с учётом нормального износа",
          "transport_costs_status": "defined",
          "transport_costs_details": "расходы на транспортировку несёт Лизингополучатель",
          "return_location_status": "defined",
          "return_location_details": "г. Москва, ул. Складская, 10",
          "late_return_penalty_status": "defined",
          "late_return_penalty_details": "пени 3 000 рублей за каждый день просрочки",
          "evidence": [
            {
              "clause_ref": "п. 9.1",
              "quote": "По окончании срока лизинга Лизингополучатель обязан вернуть предмет по акту возврата в исправном состоянии с учётом нормального износа."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Лизингополучатель возвращает предмет лизинга."

        Ответ:
        {
          "return_procedure_status": "not_defined",
          "return_procedure_details": "Данные не определены",
          "return_act_status": "not_defined",
          "return_act_details": "Данные не определены",
          "condition_standard_status": "not_defined",
          "condition_standard_details": "Данные не определены",
          "normal_wear_excluded_status": "not_defined",
          "normal_wear_excluded_details": "Данные не определены",
          "transport_costs_status": "not_defined",
          "transport_costs_details": "Данные не определены",
          "return_location_status": "not_defined",
          "return_location_details": "Данные не определены",
          "late_return_penalty_status": "not_defined",
          "late_return_penalty_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о порядке возврата.
        2. Найди прямую цитату об акте возврата.
        3. Найди прямую цитату о допустимом состоянии.
        4. Найди прямую цитату о нормальном износе.
        5. Найди прямую цитату о расходах на транспортировку.
        6. Найди прямую цитату о месте возврата.
        7. Найди прямую цитату о штрафах за невозврат.
        8. Если прямой цитаты нет — верни "not_defined". Не додумывай условия.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "return_procedure_status": "<defined / not_defined>",
          "return_procedure_details": "<текст или 'Данные не определены'>",
          "return_act_status": "<defined / not_defined>",
          "return_act_details": "<текст или 'Данные не определены'>",
          "condition_standard_status": "<defined / not_defined>",
          "condition_standard_details": "<текст или 'Данные не определены'>",
          "normal_wear_excluded_status": "<defined / not_defined>",
          "normal_wear_excluded_details": "<текст или 'Данные не определены'>",
          "transport_costs_status": "<defined / not_defined>",
          "transport_costs_details": "<текст или 'Данные не определены'>",
          "return_location_status": "<defined / not_defined>",
          "return_location_details": "<текст или 'Данные не определены'>",
          "late_return_penalty_status": "<defined / not_defined>",
          "late_return_penalty_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 800

    retrieval:
      retrieval_profile: "acceptance_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "возврат предмета лизинга возвратить предмет акт возврата состояние предмета нормальный износ естественный износ транспортировка демонтаж штраф за невозврат место возврата"
      preferred_unit_types:
        - obligation
        - liability_provision
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - procedures
        - obligations
        - remedies
      negative_keywords:
        - "лизинговые платежи"
        - "выкупная цена"
        - "страхование"
        - "ремонт и содержание"
        - "приёмка"
        - "бесспорное списание"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.55, 0.95]
        boost: 0.18
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "procedures"
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 700

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 1500

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора лизинга условия возврата
        предмета: акт, допустимое состояние, нормальный износ, транспортировка,
        место возврата и штрафы за просрочку.
        Не анализируй лизинговые платежи, страхование, ремонт или сальдо.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. return_procedure_status — "defined" если порядок возврата прямо описан,
           иначе "not_defined".
        2. return_procedure_details — формулировка о порядке возврата.
        3. return_act_status — "defined" если акт возврата прямо предусмотрен,
           иначе "not_defined".
        4. return_act_details — формулировка об акте возврата.
        5. condition_standard_status — "defined" если допустимое состояние прямо
           описано, иначе "not_defined".
        6. condition_standard_details — формулировка о стандарте состояния.
        7. normal_wear_excluded_status — "defined" если нормальный износ прямо
           исключён из ответственности, иначе "not_defined".
        8. normal_wear_excluded_details — формулировка о нормальном износе.
        9. transport_costs_status — "defined" если расходы на транспортировку
           прямо распределены, иначе "not_defined".
        10. transport_costs_details — формулировка о расходах.
        11. return_location_status — "defined" если место возврата прямо указано,
            иначе "not_defined".
        12. return_location_details — формулировка о месте возврата.
        13. late_return_penalty_status — "defined" если штраф за невозврат /
            просрочку прямо указан, иначе "not_defined".
        14. late_return_penalty_details — формулировка и размер штрафа.

        Если данные отсутствуют:
        - статус = "not_defined"
        - текст = "Данные не определены"
        </task>

        <rules>
        - Используй только текст договора.
        - normal_wear_excluded_status = "defined" только если нормальный /
          естественный износ прямо исключён из ответственности лизингополучателя.
        - Верни только JSON.
        </rules>
      fields:
        - name: "return_procedure_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус порядка возврата предмета."
          required: true
        - name: "return_procedure_details"
          type: "string"
          presentation: "fact"
          label: "Порядок возврата"
          description: "Формулировка о порядке возврата предмета лизинга."
          required: false
          display_in_grid: true
          display_priority: 1
        - name: "return_act_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус акта возврата."
          required: false
        - name: "return_act_details"
          type: "string"
          presentation: "fact"
          label: "Акт возврата"
          description: "Формулировка об акте возврата."
          required: false
          display_in_grid: false
        - name: "condition_standard_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус стандарта состояния при возврате."
          required: false
        - name: "condition_standard_details"
          type: "string"
          presentation: "fact"
          label: "Стандарт состояния"
          description: "Формулировка о допустимом состоянии при возврате."
          required: false
          display_in_grid: false
        - name: "normal_wear_excluded_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус исключения нормального износа."
          required: false
        - name: "normal_wear_excluded_details"
          type: "string"
          presentation: "fact"
          label: "Нормальный износ"
          description: "Формулировка об исключении нормального износа."
          required: false
          display_in_grid: true
          display_priority: 2
        - name: "transport_costs_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус распределения расходов на транспортировку."
          required: false
        - name: "transport_costs_details"
          type: "string"
          presentation: "fact"
          label: "Расходы на транспортировку"
          description: "Формулировка о расходах на транспортировку и демонтаж."
          required: false
          display_in_grid: false
        - name: "return_location_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания места возврата."
          required: false
        - name: "return_location_details"
          type: "string"
          presentation: "fact"
          label: "Место возврата"
          description: "Место возврата предмета лизинга."
          required: false
          display_in_grid: false
        - name: "late_return_penalty_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус штрафа за невозврат / просрочку."
          required: false
        - name: "late_return_penalty_details"
          type: "string"
          presentation: "fact"
          label: "Штраф за невозврат"
          description: "Формулировка и размер штрафа за просрочку возврата."
          required: false
          display_in_grid: true
          display_priority: 3
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 11: БАЛАНСОДЕРЖАТЕЛЬ, АМОРТИЗАЦИЯ И НАЛОГИ
  # ──────────────────────────────────────────────────────────────────────────
  - id: leasing_balance_and_tax
    name: "Балансодержатель, ускоренная амортизация и налоговые последствия лизинга"
    description: >
      Фактографическая проверка наличия в тексте договора условий о балансовом
      учёте предмета лизинга, ускоренной амортизации, НДС-оговорки
      и налоговых последствий лизинговых платежей.
      Результат предназначен для табличного сравнения нескольких документов.
    triggers: ~
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "балансодержатель"
        - "на балансе лизингополучателя"
        - "на балансе лизингодателя"
        - "ускоренная амортизация"
        - "коэффициент ускорения"
        - "НДС"
        - "вычет НДС"
        - "лизинговые платежи относятся на расходы"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)балансодержател"
        - "(?i)ускоренн(ая|ой)\\s+амортизац"
        - "(?i)\\bНДС\\b"
        - "(?i)коэффициент\\s+ускорен"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор лизинга по ФЗ-164 и §6 Главы 34 ГК РФ.
        Проверяется только один вопрос: балансовый учёт предмета лизинга,
        ускоренная амортизация и налоговые оговорки.

        Нормативный ориентир:
        - ФЗ-164 — балансодержатель по соглашению сторон
        - НК РФ — ускоренная амортизация с коэффициентом до 3
        - НК РФ, гл. 21 — НДС в лизинговых платежах

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Кто указан балансодержателем предмета лизинга.
        2. Есть ли условие об ускоренной амортизации.
        3. Указан ли коэффициент ускорения амортизации.
        4. Есть ли НДС-оговорка в лизинговых платежах.
        5. Есть ли указание на налоговый режим платежей.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если данные не указаны прямо — возвращай "Данные не определены" или "not_defined".
        4. Не используй "None", "null", "not_specified" или пустые строки.
        5. В evidence включай только текст договора.
        6. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Предмет лизинга учитывается на балансе Лизингополучателя. Амортизация
        начисляется Лизингополучателем с применением коэффициента ускорения 3.
        В состав лизинговых платежей включён НДС по ставке 20%."

        Ответ:
        {
          "balance_holder_status": "defined",
          "balance_holder_code": "lessee",
          "balance_holder_details": "предмет лизинга учитывается на балансе Лизингополучателя",
          "accelerated_depreciation_status": "defined",
          "accelerated_depreciation_details": "с применением коэффициента ускорения 3",
          "acceleration_coefficient_status": "defined",
          "acceleration_coefficient_details": "коэффициент ускорения 3",
          "vat_clause_status": "defined",
          "vat_clause_details": "НДС по ставке 20% включён в состав лизинговых платежей",
          "tax_regime_status": "not_defined",
          "tax_regime_details": "Данные не определены",
          "evidence": [
