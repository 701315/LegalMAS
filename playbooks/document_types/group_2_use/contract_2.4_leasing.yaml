        severity: hard
        weight: -1.0
        description: "Аренда без приобретения предмета в собственность — обычная аренда, не лизинг (contract_2.1_lease)"

      - pattern: "(?i)земельн[а-яё]+\\s+участ[оа]к\\s+как\\s+предмет\\s+лизинг[аа]"
        severity: hard
        weight: -1.0
        description: "Земельные участки не могут быть предметом лизинга по 164-ФЗ"

      - pattern: "(?i)природн[ыо]й\\s+объект\\s+как\\s+предмет\\s+лизинг[аа]"
        severity: hard
        weight: -1.0
        description: "Природные объекты не могут быть предметом лизинга по 164-ФЗ"

      # ── Soft exclusions

      - pattern: "(?i)договор\\s+аренд[ыыу]\\s+без\\s+упоминани[яя]\\s+лизинг[аа]"
        severity: soft
        weight: -0.35
        description: "Чистая аренда без лизинговой терминологии тянет к другим арендным типам"

      - pattern: "(?i)договор\\s+аренд[ыыу]\\s+транспортн[огоого\\s]*средств[ао]"
        severity: soft
        weight: -0.3
        description: "Аренда ТС без элементов vendor leg/lease leg тянет к contract_2.3_vehicle_lease"

      - pattern: "(?i)договор\\s+аренд[ыыу]\\s+нежил[а-я\\s]*помещен[ияи]"
        severity: soft
        weight: -0.3
        description: "Аренда нежилого помещения без лизинговых элементов тянет к contract_2.1_lease"

