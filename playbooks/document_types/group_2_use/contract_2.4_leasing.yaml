          weight: 0.3
          distinctiveness: low
          context: any
          description: "Изъятие предмета — типичный remedy лизингодателя"

        - pattern: "(?i)регистраци[яи]\\s+ТС"
          weight: 0.3
          distinctiveness: low
          context: any
          description: "Регистрация ТС — важный, но не уникальный признак"

        - pattern: "(?i)лизингов[а-яё]+\\s+компани[яи]"
          weight: 0.3
          distinctiveness: low
          context: any
          description: "Упоминание лизинговой компании"

        - pattern: "(?i)сч[её]т-?фактур[аы]"
          weight: 0.25
          distinctiveness: low
          context: any
          description: "Счёт-фактура — общий бухгалтерский термин"

        - pattern: "(?i)амортизационн[а-яё]+\\s+преми[яи]"
          weight: 0.25
          distinctiveness: low
