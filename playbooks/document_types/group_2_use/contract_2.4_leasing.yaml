trigger_definitions:

  lease_finance_structure:
    any_keywords:
      - "(?i)лизингодатель\\s+обязуетс[яьа]\\s+приобрести"
      - "(?i)приобрести\\s+в\\s+собственност[ьи]\\s+у\\s+продавц[аа]"
      - "(?i)финансов[а-яё]+\\s+аренд[аы]"
      - "(?i)\\bлизингополучател[ьяи]\\b"
      - "(?i)лизингов[ыо]е\\s+платеж[ии]"

  vendor_selected_by_lessee:
    any_keywords:
      - "(?i)продав[её]ц\\s+выбран\\s+лизингополучател[еям]"
      - "(?i)по\\s+выбору\\s+лизингополучател[яя]"
      - "(?i)лизингополучатель\\s+указал\\s+продавц[аа]"
      - "(?i)самостоятельно\\s+выбрал\\s+продавц[аа]"

  vendor_selected_by_lessor:
    any_keywords:
      - "(?i)продав[её]ц\\s+выбран\\s+лизингодател[еям]"
      - "(?i)по\\s+выбору\\s+лизингодател[яя]"
      - "(?i)партн[её]р\\s+лизингодател[яя]"
      - "(?i)продав[её]ц\\s+рекомендован\\s+лизингодател[еям]"

  purchase_option_present:
