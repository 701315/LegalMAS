  - id: leasing_risk_and_insurance
    name: "Переход риска случайной гибели и страхование предмета лизинга"
    description: >
      Фактографическая проверка момента перехода риска случайной гибели,
      обязанности страхования, выгодоприобретателя, последствий гибели
      предмета лизинга для обязанности по платежам.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "риск случайной гибели"
        - "несет лизингополучатель"
        - "страхование"
        - "КАСКО"
        - "выгодоприобретатель"
        - "не освобождает от платежей"
        - "страховая сумма"
        - "страховой полис"
        - "с момента передачи"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)риск\\s+случайн(ой|ого)\\s+гибел"
        - "(?i)КАСКО|страхов(ание|ой\\s+полис)"
        - "(?i)выгодоприобретател"
        - "(?i)не\\s+освобожда(ет|ют)\\s+от\\s+платеж"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор лизинга по ФЗ-164 и §6 Главы 34 ГК РФ.
        Проверяется только один вопрос: переход риска случайной гибели
        и страхование предмета лизинга.

        Нормативный ориентир:
        - ст. 669 ГК РФ — риск случайной гибели переходит к лизингополучателю
        - ст. 21 ФЗ-164 — страхование предмета лизинга

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Указан ли момент перехода риска случайной гибели.
        2. Кто обязан застраховать предмет лизинга.
        3. Кто является выгодоприобретателем по договору страхования.
        4. Сохраняется ли обязанность по уплате платежей при полной гибели предмета лизинга.
        5. Указана ли минимальная страховая сумма (страховое покрытие).

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона вместо текста договора.
        2. Не выводи момент перехода риска из ст. 669 ГК РФ — фиксируй только то, что прямо написано в договоре.
        3. Не выдумывай наименования страховых компаний, суммы покрытия, проценты или выгодоприобретателей, которых нет в тексте.
        4. Разграничение значений для отсутствующих данных:
           - для полей *_status и insurance_obligor возвращай технический код "not_defined";
           - для текстовых полей *_details возвращай строку "Данные не определены".
        5. Не используй "None", "null", пустые строки ни в одном поле.
        6. В evidence включай только текст договора.
        7. Учитывай, что в практике РФ выгодоприобретателем при полной гибели часто указывается Лизингодатель
           (в пределах невыплаченных платежей), а Лизингополучатель — в остальной части. Отражай такую структуру детально.
        8. Учитывай, что условие о сохранении платежей при гибели имущества («не освобождает от уплаты»)
           является критически важным. Тщательно ищи его формулировку.
        9. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Риск случайной гибели переходит к Лизингополучателю с момента подписания
        акта приёма-передачи. Лизингополучатель обязан застраховать предмет лизинга
        (КАСКО) на полную стоимость. Выгодоприобретатель — Лизингодатель.
        Гибель предмета не освобождает от обязанности по лизинговым платежам."

        Ответ:
        {
          "risk_transfer_status": "defined",
          "risk_transfer_details": "с момента подписания акта приёма-передачи",
          "insurance_obligation_status": "defined",
          "insurance_obligor": "lessee",
          "insurance_obligation_details": "застраховать предмет лизинга (КАСКО) на полную стоимость",
          "beneficiary_status": "defined",
          "beneficiary_details": "Лизингодатель",
          "total_loss_payment_obligation_status": "defined",
          "total_loss_payment_obligation_details": "гибель не освобождает от обязанности по лизинговым платежам",
          "minimum_coverage_status": "defined",
          "minimum_coverage_details": "на полную стоимость",
          "evidence": [
            {
              "clause_ref": "п. 5.1",
              "quote": "Риск случайной гибели переходит к Лизингополучателю с момента подписания акта приёма-передачи."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Стороны самостоятельно решают вопросы страхования."

        Ответ:
        {
          "risk_transfer_status": "not_defined",
          "risk_transfer_details": "Данные не определены",
          "insurance_obligation_status": "not_defined",
          "insurance_obligor": "not_defined",
          "insurance_obligation_details": "Данные не определены",
          "beneficiary_status": "not_defined",
          "beneficiary_details": "Данные не определены",
          "total_loss_payment_obligation_status": "not_defined",
          "total_loss_payment_obligation_details": "Данные не определены",
          "minimum_coverage_status": "not_defined",
          "minimum_coverage_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о моменте перехода риска.
        2. Найди прямую цитату об обязанности страхования.
        3. Найди прямую цитату о выгодоприобретателе по полису.
        4. Найди прямую цитату о сохранении обязанности платить при гибели предмета лизинга.
        5. Найди прямую цитату о минимальной страховой сумме.
        6. Если прямой цитаты нет — верни "not_defined" в status/obligor и "Данные не определены" в details.
        7. Проверь, что в ответе присутствуют все ключи, объявленные в fields.

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "risk_transfer_status": "<defined / not_defined>",
          "risk_transfer_details": "<текст или 'Данные не определены'>",
          "insurance_obligation_status": "<defined / not_defined>",
          "insurance_obligor": "<lessee / lessor / both / not_defined>",
          "insurance_obligation_details": "<текст или 'Данные не определены'>",
          "beneficiary_status": "<defined / not_defined>",
          "beneficiary_details": "<текст или 'Данные не определены'>",
          "total_loss_payment_obligation_status": "<defined / not_defined>",
          "total_loss_payment_obligation_details": "<текст или 'Данные не определены'>",
          "minimum_coverage_status": "<defined / not_defined>",
          "minimum_coverage_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 10
      temperature: 0.0
      max_tokens: 850

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "риск случайной гибели лизингополучателя гибель не освобождает от платежей страхование КАСКО выгодоприобретатель страховая сумма переход риска момент передачи"
      retrieval_profile: "insurance_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "выкупная цена"
        - "предмет лизинга"
        - "ремонт"
        - "возврат"
        - "сальдо"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.20, 0.65]
        boost: 0.15
        scope: segment
      context_k: 10
      max_chunks: 12
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 700

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1500

      compact_output: false

      presence_signal:
        field: "leasing_risk_and_insurance_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора лизинга момент перехода
        риска, обязанность страхования, выгодоприобретателя, последствия гибели
        и минимальную страховую сумму.
        Не анализируй лизинговые платежи (кроме уплаты при гибели), предмет лизинга, ремонт или возврат.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. leasing_risk_and_insurance_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (risk_transfer_status, insurance_obligation_status, insurance_obligor,
              beneficiary_status, total_loss_payment_obligation_status,
              minimum_coverage_status) ≠ "not_defined";
           - "missing" — если все шесть содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - все *_status = "not_defined";
           - insurance_obligor = "not_defined";
           - все *_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. risk_transfer_status — "defined" если момент перехода риска случайной
           гибели прямо указан в тексте, иначе "not_defined".
        2. risk_transfer_details — формулировка о моменте перехода риска.
        3. insurance_obligation_status — "defined" если обязанность застраховать
           прямо возложена на одну из сторон, иначе "not_defined".
        4. insurance_obligor — "lessee" / "lessor" / "both" / "not_defined".
        5. insurance_obligation_details — формулировка об обязанности страхования.
        6. beneficiary_status — "defined" если выгодоприобретатель прямо указан,
           иначе "not_defined".
        7. beneficiary_details — формулировка о выгодоприобретателе по договору страхования.
        8. total_loss_payment_obligation_status — "defined" если прямо указано, что
           гибель или утрата предмета не освобождает от обязанности по платежам, иначе "not_defined".
        9. total_loss_payment_obligation_details — формулировка о сохранении обязанности по уплате платежей при гибели.
        10. minimum_coverage_status — "defined" если минимальная страховая сумма
            прямо указана, иначе "not_defined".
        11. minimum_coverage_details — формулировка о минимальной страховой сумме.

        Разграничение значений для отсутствующих данных:
        - для полей *_status и insurance_obligor возвращай технический код "not_defined";
        - для текстовых полей *_details возвращай строку "Данные не определены".
        </task>

        <context_rules>
        - Перед остальными полями заполни leasing_risk_and_insurance_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", insurance_obligor = "not_defined", все *_details = "Данные не определены".
        - Используй только текст договора. Не подставляй нормы закона.
        - Не выдумывай наименования страховых компаний, суммы покрытия, проценты или выгодоприобретателей, которых нет в тексте.
        - Не используй null, None, пустые строки ни в одном поле.
        - insurance_obligor: "lessee" — страхует лизингополучатель; "lessor" — страхует лизингодатель; "both" — обе стороны обязаны застраховать свои риски; "not_defined" — сторона не определена в тексте.
        - Если в тексте есть противоречивые условия (например, в разных пунктах указаны разные выгодоприобретатели или условия перехода рисков), используй условия из основного текста договора и приводи оба фрагмента в evidence.
        - Не смешивай моменты перехода риска, обязанность страхования и последствия гибели — это разные поля.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни момента перехода риска, ни страхования, ни выгодоприобретателя,
           ни последствий гибели, ни страховой суммы.
           → presence = "missing";
             все *_status = "not_defined";
             insurance_obligor = "not_defined";
             все *_details = "Данные не определены".

        2. Указана только обязанность страхования без деталей.
           «Лизингополучатель обязан застраховать предмет лизинга» без выгодоприобретателя
           и без страховой суммы.
           → presence = "present";
             insurance_obligation_status = "defined";
             beneficiary_status / minimum_coverage_status = "not_defined";
             соответствующие *_details = "Данные не определены".

        3. Противоречие между фрагментами.
           В разных пунктах указаны разные выгодоприобретатели или разные моменты перехода риска.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             соответствующий *_details = "Не удалось определить".

        4. Прямое указание на сохранение платежей при гибели.
           В договоре прямо есть формулировка «гибель предмета лизинга не освобождает
           лизингополучателя от обязанности по уплате лизинговых платежей».
           → presence = "present";
             total_loss_payment_obligation_status = "defined";
             total_loss_payment_obligation_details содержит дословную формулировку.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для leasing_risk_and_insurance_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined" или "not_defined".
        - Для insurance_obligor используй только: "lessee", "lessor", "both", "not_defined".
        - Fallback при отсутствии данных: все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности: соответствующие *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "leasing_risk_and_insurance_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по переходу риска и страхованию. Внутреннее агрегатное signal-поле."
