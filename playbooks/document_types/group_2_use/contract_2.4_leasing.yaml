          description: "Формулировка о порядке претензий по качеству."
          required: false
          display_in_grid: false
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 7: Default remedies
  # ──────────────────────────────────────────────────────────────────────────
  - id: leasing_default_and_saldo
    name: "Default remedies, сальдо при расторжении и изъятие предмета (Пленум ВАС №17)"
    description: >
      Фактографическая проверка санкций при default: бесспорное списание,
      исполнительная надпись, изъятие предмета, досрочное расторжение,
      методика расчёта сальдо встречных обязательств и оценка
      возвращённого предмета.
    triggers: ~
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "бесспорное списание"
        - "без акцепта"
        - "исполнительная надпись нотариуса"
        - "изъятие предмета лизинга"
        - "досрочное взыскание"
        - "одностороннее расторжение"
        - "сальдо встречных обязательств"
        - "завершающая обязанность"
        - "стоимость возвращённого предмета"
        - "рыночная стоимость"
        - "просрочка более"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)бесспорн(ое|ого)\\s+списан"
        - "(?i)исполнительн(ая|ой)\\s+надпис"
        - "(?i)изъят(ие|ия)\\s+предмета\\s+лизинг"
        - "(?i)сальдо\\s+встречн"
        - "(?i)завершающ(ая|ей)\\s+обязанност"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор лизинга по ФЗ-164 и §6 Главы 34 ГК РФ.
        Проверяется только один вопрос: механизмы защиты лизингодателя при default
        (бесспорное взыскание, изъятие, расторжение) и методика расчёта сальдо
        встречных обязательств при досрочном расторжении.

        Нормативный ориентир:
        - ст. 13 ФЗ-164 — бесспорное взыскание и право изъятия предмета
        - Пленум ВАС РФ от 14.03.2014 №17 — сальдо встречных обязательств

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли механизм бесспорного списания.
        2. Есть ли исполнительная надпись нотариуса.
        3. Есть ли право изъятия предмета лизинга.
        4. Есть ли условие о досрочном расторжении при default.
        5. Есть ли методика расчёта сальдо встречных обязательств.
        6. Есть ли метод оценки возвращённого предмета.
        7. Есть ли условие о возврате излишка лизингополучателю.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Не применяй методику Пленума ВАС №17 автоматически — фиксируй только то,
           что прямо написано о сальдо в тексте договора.
        4. Если условие не указано прямо — возвращай "not_defined".
        5. Если текстового значения нет — возвращай строго "Данные не определены".
        6. Не используй "None", "null", "not_specified" или пустые строки.
        7. В evidence включай только текст договора.
        8. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "При просрочке более 2 месяцев подряд Лизингодатель вправе в одностороннем
        порядке расторгнуть договор и изъять предмет лизинга. Задолженность
        взыскивается на основании исполнительной надписи нотариуса. При расторжении
        рассчитывается сальдо встречных обязательств. Стоимость возвращённого
        предмета определяется по рыночной оценке. Если сальдо в пользу
        Лизингополучателя — разница возвращается."

        Ответ:
        {
          "uncontested_recovery_status": "not_defined",
          "uncontested_recovery_details": "Данные не определены",
          "notarial_enforcement_status": "defined",
          "notarial_enforcement_details": "на основании исполнительной надписи нотариуса",
          "repossession_status": "defined",
          "repossession_details": "вправе изъять предмет лизинга",
          "default_termination_status": "defined",
          "default_termination_details": "при просрочке более 2 месяцев вправе расторгнуть",
          "saldo_methodology_status": "defined",
          "saldo_methodology_details": "рассчитывается сальдо встречных обязательств",
          "returned_asset_valuation_status": "defined",
          "returned_asset_valuation_details": "по рыночной оценке",
          "excess_return_status": "defined",
          "excess_return_details": "разница возвращается Лизингополучателю",
          "evidence": [
            {
              "clause_ref": "п. 8.1",
              "quote": "При просрочке более 2 месяцев подряд Лизингодатель вправе в одностороннем порядке расторгнуть договор и изъять предмет лизинга."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Ответственность сторон определяется законодательством."

        Ответ:
        {
          "uncontested_recovery_status": "not_defined",
          "uncontested_recovery_details": "Данные не определены",
          "notarial_enforcement_status": "not_defined",
          "notarial_enforcement_details": "Данные не определены",
          "repossession_status": "not_defined",
          "repossession_details": "Данные не определены",
          "default_termination_status": "not_defined",
          "default_termination_details": "Данные не определены",
          "saldo_methodology_status": "not_defined",
          "saldo_methodology_details": "Данные не определены",
          "returned_asset_valuation_status": "not_defined",
          "returned_asset_valuation_details": "Данные не определены",
          "excess_return_status": "not_defined",
          "excess_return_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о бесспорном списании.
        2. Найди прямую цитату об исполнительной надписи.
        3. Найди прямую цитату об изъятии предмета.
        4. Найди прямую цитату о расторжении при default.
        5. Найди прямую цитату о сальдо.
        6. Найди прямую цитату об оценке возвращённого предмета.
        7. Найди прямую цитату о возврате излишка.
        8. Если нет — "not_defined".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "uncontested_recovery_status": "<defined / not_defined>",
          "uncontested_recovery_details": "<текст или 'Данные не определены'>",
          "notarial_enforcement_status": "<defined / not_defined>",
          "notarial_enforcement_details": "<текст или 'Данные не определены'>",
          "repossession_status": "<defined / not_defined>",
          "repossession_details": "<текст или 'Данные не определены'>",
          "default_termination_status": "<defined / not_defined>",
          "default_termination_details": "<текст или 'Данные не определены'>",
          "saldo_methodology_status": "<defined / not_defined>",
          "saldo_methodology_details": "<текст или 'Данные не определены'>",
          "returned_asset_valuation_status": "<defined / not_defined>",
          "returned_asset_valuation_details": "<текст или 'Данные не определены'>",
          "excess_return_status": "<defined / not_defined>",
          "excess_return_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 7
      temperature: 0.0
      max_tokens: 850

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "бесспорное списание без акцепта исполнительная надпись нотариуса изъятие предмета лизинга одностороннее расторжение сальдо встречных обязательств завершающая обязанность стоимость возвращённого предмета рыночная стоимость просрочка"
      retrieval_profile: "event_of_default_check"
      preferred_unit_types:
        - termination_provision
        - liability_provision
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - remedies
        - procedures
        - obligations
      negative_keywords:
        - "лизинговые платежи"
        - "выкупная цена"
        - "предмет лизинга"
        - "страхование"
        - "приёмка"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.45, 0.95]
        boost: 0.18
        scope: segment
      context_k: 7
      max_chunks: 9
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "remedies"
        - "procedures"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 750

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 1500

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора лизинга default
        remedies: бесспорное списание, надпись нотариуса, изъятие, расторжение,
        сальдо, оценку возвращённого предмета и возврат излишка.
        Не анализируй платежи, страхование, приёмку или предмет.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. uncontested_recovery_status — "defined" если бесспорное списание (без акцепта)
           прямо предусмотрено, иначе "not_defined".
        2. uncontested_recovery_details — формулировка о бесспорном списании.
        3. notarial_enforcement_status — "defined" если исполнительная надпись нотариуса
           прямо указана как механизм взыскания, иначе "not_defined".
        4. notarial_enforcement_details — формулировка об исполнительной надписи.
        5. repossession_status — "defined" если право изъятия предмета лизинга при
           нарушении прямо предусмотрено, иначе "not_defined".
        6. repossession_details — формулировка об изъятии.
        7. default_termination_status — "defined" если основания одностороннего
           расторжения при default прямо указаны, иначе "not_defined".
        8. default_termination_details — формулировка о расторжении.
        9. saldo_methodology_status — "defined" если методика расчёта сальдо встречных
           обязательств при расторжении прямо описана, иначе "not_defined".
        10. saldo_methodology_details — формулировка о методике сальдо.
        11. returned_asset_valuation_status — "defined" если метод оценки возвращённого
            предмета прямо указан, иначе "not_defined".
        12. returned_asset_valuation_details — формулировка об оценке предмета.
        13. excess_return_status — "defined" если прямо указано, что при положительном
            сальдо в пользу лизингополучателя разница ему возвращается, иначе "not_defined".
        14. excess_return_details — формулировка о возврате излишка.

        Если данные отсутствуют:
        - статус = "not_defined"
        - текст = "Данные не определены"
        </task>

        <rules>
        - Используй только текст договора.
        - Верни только JSON.
        </rules>
      fields:
        - name: "uncontested_recovery_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус бесспорного списания."
          required: false
        - name: "uncontested_recovery_details"
          type: "string"
          presentation: "fact"
          label: "Бесспорное списание"
          description: "Формулировка о бесспорном списании."
          required: false
          display_in_grid: false
        - name: "notarial_enforcement_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус исполнительной надписи."
          required: false
        - name: "notarial_enforcement_details"
          type: "string"
          presentation: "fact"
          label: "Исполнительная надпись"
          description: "Формулировка об исполнительной надписи нотариуса."
          required: false
          display_in_grid: false
        - name: "repossession_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус права изъятия предмета."
          required: true
        - name: "repossession_details"
          type: "string"
          presentation: "fact"
          label: "Изъятие предмета"
          description: "Формулировка об изъятии предмета лизинга."
          required: false
          display_in_grid: true
          display_priority: 1
        - name: "default_termination_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус расторжения при default."
          required: true
        - name: "default_termination_details"
          type: "string"
          presentation: "fact"
          label: "Расторжение при default"
          description: "Формулировка о расторжении при default."
          required: false
          display_in_grid: true
          display_priority: 2
        - name: "saldo_methodology_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус методики расчёта сальдо."
          required: true
        - name: "saldo_methodology_details"
          type: "string"
          presentation: "fact"
          label: "Сальдо при расторжении"
          description: "Формулировка о расчёте сальдо встречных обязательств."
          required: false
          display_in_grid: true
          display_priority: 3
        - name: "returned_asset_valuation_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус метода оценки возвращённого предмета."
          required: false
        - name: "returned_asset_valuation_details"
          type: "string"
          presentation: "fact"
          label: "Оценка возвращённого предмета"
          description: "Формулировка о методе оценки возвращённого предмета."
          required: false
          display_in_grid: false
        - name: "excess_return_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус возврата излишка лизингополучателю."
          required: false
        - name: "excess_return_details"
          type: "string"
          presentation: "fact"
          label: "Возврат излишка"
          description: "Формулировка о возврате излишка лизингополучателю."
          required: false
          display_in_grid: false
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 8: СОДЕРЖАНИЕ, РЕМОНТ И ТЕХОБСЛУЖИВАНИЕ
  # ──────────────────────────────────────────────────────────────────────────
  - id: leasing_maintenance_check
    name: "Содержание предмета лизинга: ремонт, техобслуживание и расходы"
    description: >
      Фактографическая проверка наличия в тексте договора лизинга условий
      о содержании предмета лизинга: текущий и капитальный ремонт,
      техническое обслуживание, распределение эксплуатационных расходов.
      Результат предназначен для табличного сравнения нескольких документов.
    triggers: ~
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "техническое обслуживание"
        - "текущий ремонт"
        - "капитальный ремонт"
        - "содержание предмета лизинга"
        - "расходы на эксплуатацию"
        - "ТО"
        - "сервисное обслуживание"
        - "поддерживать в исправном состоянии"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)техническ(ое|ого)\\s+обслуживан"
        - "(?i)текущ(ий|его)\\s+ремонт"
        - "(?i)содержан.*предмет.*лизинг"
        - "(?i)капитальн(ый|ого)\\s+ремонт"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор лизинга по ФЗ-164 и §6 Главы 34 ГК РФ.
        Проверяется только один вопрос: распределение обязанностей по содержанию,
        ремонту и техническому обслуживанию предмета лизинга.

        Нормативный ориентир:
        - ст. 17 ФЗ-164 — содержание предмета лизинга
        - ст. 616 ГК РФ (субсидиарно) — ремонт арендованного имущества

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. На кого возложено текущее техническое обслуживание.
        2. На кого возложен текущий ремонт.
        3. На кого возложен капитальный ремонт.
        4. Есть ли указание на распределение эксплуатационных расходов.
        5. Предусмотрено ли full-service обслуживание лизингодателем.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Не делай вывод о распределении обязанностей по умолчанию из закона.
        4. Если данные не указаны прямо — возвращай "Данные не определены" или "not_defined".
        5. Не используй "None", "null", "not_specified" или пустые строки.
        6. В evidence включай только текст договора.
        7. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Лизингополучатель обязан за свой счёт осуществлять техническое обслуживание
        и текущий ремонт предмета лизинга. Капитальный ремонт — обязанность
        Лизингодателя. Расходы на эксплуатацию несёт Лизингополучатель."

        Ответ:
        {
          "maintenance_status": "defined",
          "maintenance_allocation": "lessee",
          "maintenance_details": "техническое обслуживание за счёт Лизингополучателя",
          "current_repair_status": "defined",
          "current_repair_allocation": "lessee",
          "current_repair_details": "текущий ремонт — обязанность Лизингополучателя",
          "capital_repair_status": "defined",
          "capital_repair_allocation": "lessor",
          "capital_repair_details": "капитальный ремонт — обязанность Лизингодателя",
          "operational_costs_status": "defined",
          "operational_costs_details": "расходы на эксплуатацию несёт Лизингополучатель",
          "full_service_status": "not_defined",
          "full_service_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 4.3",
              "quote": "Лизингополучатель обязан за свой счёт осуществлять техническое обслуживание и текущий ремонт предмета лизинга."
            }
