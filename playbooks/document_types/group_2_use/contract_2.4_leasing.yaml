  - id: leasing_title_and_encumbrances
    name: "Гарантия чистоты титула лизингодателя и отсутствие обременений на предмет лизинга"
    description: >
      Фактографическая проверка наличия в тексте подтверждения права
      собственности лизингодателя на предмет лизинга, заверений
      об отсутствии залога, ареста и прав третьих лиц.
      Результат предназначен для табличного сравнения нескольких документов.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "гарантирует отсутствие обременений"
        - "свободен от прав третьих лиц"
        - "не заложен"
        - "не находится под арестом"
        - "право собственности лизингодателя"
        - "чистота права"
        - "принадлежит на праве собственности"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)лизингодател.*гарантирует.*отсутствие"
        - "(?i)(не\\s+обременен|свободен\\s+от.*прав)"
        - "(?i)принадлеж(ит|ат)\\s+на\\s+праве"
        - "(?i)не\\s+заложен|не\\s+под\\s+арестом"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор лизинга по ФЗ-164 и §6 Главы 34 ГК РФ.
        Проверяется только один вопрос: подтверждение титула лизингодателя
        на предмет лизинга и отсутствие обременений.

        Нормативный ориентир:
        - ст. 665, 667 ГК РФ — право лизингодателя на передачу в лизинг
        - ст. 608 ГК РФ — право сдачи имущества в аренду принадлежит собственнику

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли подтверждение права собственности лизингодателя.
        2. Есть ли заверение об отсутствии залога на предмет лизинга.
        3. Есть ли заверение об отсутствии ареста.
        4. Есть ли заверение об отсутствии прав третьих лиц.
        5. Есть ли иные заверения о чистоте титула или ссылки на подтверждающие документы.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона вместо текста договора.
        2. Не выдумывай заверения о чистоте титула, обременениях или подтверждающих документах, которых нет в тексте.
        3. Разграничение значений для отсутствующих данных:
           - для полей *_status возвращай технический код "not_defined";
           - для текстовых полей *_details возвращай строку "Данные не определены".
        4. Не используй "None", "null", пустые строки ни в одном поле.
        5. В evidence включай только текст договора.
        6. Если в тексте есть противоречивые заверения (например, в одном пункте предмет
           назван свободным от обременений, а в другом указан залог в пользу банка),
           используй формулировки из раздела заверений и гарантий и укажи оба фрагмента в evidence.
        7. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Лизингодатель гарантирует, что предмет лизинга принадлежит ему
        на праве собственности, свободен от залога, ареста и прав третьих лиц.
        Чистота титула подтверждена выпиской из реестра от 01.03.2024."

        Ответ:
        {
          "title_confirmation_status": "defined",
          "title_confirmation_details": "предмет лизинга принадлежит на праве собственности",
          "no_pledge_status": "defined",
          "no_pledge_details": "свободен от залога",
          "no_arrest_status": "defined",
          "no_arrest_details": "свободен от ареста",
          "no_third_party_rights_status": "defined",
          "no_third_party_rights_details": "свободен от прав третьих лиц",
          "title_documentation_status": "defined",
          "title_documentation_details": "выписка из реестра от 01.03.2024",
          "evidence": [
            {
              "clause_ref": "п. 2.5",
              "quote": "Лизингодатель гарантирует, что предмет лизинга принадлежит ему на праве собственности, свободен от залога, ареста и прав третьих лиц."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Стороны заключили договор лизинга."

        Ответ:
        {
          "title_confirmation_status": "not_defined",
          "title_confirmation_details": "Данные не определены",
          "no_pledge_status": "not_defined",
          "no_pledge_details": "Данные не определены",
          "no_arrest_status": "not_defined",
          "no_arrest_details": "Данные не определены",
          "no_third_party_rights_status": "not_defined",
          "no_third_party_rights_details": "Данные не определены",
          "title_documentation_status": "not_defined",
          "title_documentation_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о праве собственности лизингодателя.
        2. Найди прямую цитату об отсутствии залога.
        3. Найди прямую цитату об отсутствии ареста.
        4. Найди прямую цитату об отсутствии прав третьих лиц.
        5. Найди прямую цитату о документе, подтверждающем титул.
        6. Если прямой цитаты нет — верни "not_defined" в status и "Данные не определены" в details.
           Не выводи заверения из закона.
        7. Проверь, что в ответе присутствуют все ключи, объявленные в fields.

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "title_confirmation_status": "<defined / not_defined>",
          "title_confirmation_details": "<текст или 'Данные не определены'>",
          "no_pledge_status": "<defined / not_defined>",
          "no_pledge_details": "<текст или 'Данные не определены'>",
          "no_arrest_status": "<defined / not_defined>",
          "no_arrest_details": "<текст или 'Данные не определены'>",
          "no_third_party_rights_status": "<defined / not_defined>",
          "no_third_party_rights_details": "<текст или 'Данные не определены'>",
          "title_documentation_status": "<defined / not_defined>",
          "title_documentation_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 7
      temperature: 0.0
      max_tokens: 750

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "гарантирует отсутствие обременений свободен от прав третьих лиц не заложен не под арестом право собственности лизингодателя чистота права принадлежит на праве собственности"
      retrieval_profile: "title_transfer_check"
      preferred_unit_types:
        - warranty
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - representations
        - definitions
      negative_keywords:
        - "лизинговые платежи"
        - "выкупная цена"
        - "страхование"
        - "ремонт"
        - "возврат"
        - "сальдо"
        - "приёмка"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 0.35]
        boost: 0.20
        scope: segment
      context_k: 7
      max_chunks: 9
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "representations"
        - "definitions"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1200

      compact_output: false

      presence_signal:
        field: "leasing_title_and_encumbrances_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора лизинга подтверждение
        титула лизингодателя и заверения об отсутствии залога, ареста,
        прав третьих лиц и наличии документа о чистоте права.
        Не анализируй лизинговые платежи, страхование, ремонт или возврат.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. leasing_title_and_encumbrances_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (title_confirmation_status, no_pledge_status, no_arrest_status,
              no_third_party_rights_status, title_documentation_status)
             ≠ "not_defined";
           - "missing" — если все пять содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - все *_status = "not_defined";
           - все *_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. title_confirmation_status — "defined" если право собственности
           лизингодателя прямо подтверждено в тексте, иначе "not_defined".
        2. title_confirmation_details — формулировка о праве собственности.
        3. no_pledge_status — "defined" если отсутствие залога на предмет лизинга
           прямо указано, иначе "not_defined".
        4. no_pledge_details — формулировка об отсутствии залога.
        5. no_arrest_status — "defined" если отсутствие ареста прямо указано,
           иначе "not_defined".
        6. no_arrest_details — формулировка об отсутствии ареста.
        7. no_third_party_rights_status — "defined" если отсутствие прав
           третьих лиц прямо указано, иначе "not_defined".
        8. no_third_party_rights_details — формулировка об отсутствии прав третьих лиц.
        9. title_documentation_status — "defined" если документ, подтверждающий
           титул, прямо упомянут (выписка из ЕГРН, реестр уведомлений о залоге и т.п.),
           иначе "not_defined".
        10. title_documentation_details — формулировка о подтверждающем документе.

        Разграничение значений для отсутствующих данных:
        - для полей *_status возвращай технический код "not_defined";
        - для текстовых полей *_details возвращай строку "Данные не определены".
        </task>

        <context_rules>
        - Перед остальными полями заполни leasing_title_and_encumbrances_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Данные не определены".
        - Используй только текст договора. Не подставляй нормы закона.
        - Не выдумывай заверения о чистоте титула, обременениях или подтверждающих документах, которых нет в тексте.
        - title_confirmation_status = "defined" только если право собственности прямо подтверждено формулировкой в тексте; не выводи из факта заключения договора лизинга.
        - Не используй null, None, пустые строки ни в одном поле.
        - Если в тексте есть противоречивые заверения (например, в одном пункте предмет назван свободным от обременений, а в другом указан залог в пользу банка), используй формулировки из раздела заверений и гарантий и приводи оба фрагмента в evidence.
        - Различай: титул, отсутствие залога, отсутствие ареста, отсутствие прав третьих лиц и подтверждающий документ — это пять разных полей.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни подтверждения титула лизингодателя,
           ни заверений об отсутствии залога, ареста и прав третьих лиц,
           ни ссылки на подтверждающий документ.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        2. Подтверждён только титул без заверений об обременениях.
           Указано, что предмет принадлежит лизингодателю на праве собственности,
           но нет заверений об отсутствии залога / ареста / прав третьих лиц.
           → presence = "present";
             title_confirmation_status = "defined";
             no_pledge_status / no_arrest_status / no_third_party_rights_status = "not_defined";
             соответствующие *_details = "Данные не определены".

        3. Противоречие между фрагментами.
           В одном пункте предмет назван свободным от обременений,
           в другом указан залог в пользу банка или иное обременение.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             соответствующий *_details = "Не удалось определить".

        4. Общая ссылка на закон без заверения.
           В тексте есть ссылка на закон (например, ст. 608 ГК РФ) или общая фраза
           о правомерности владения, но нет прямого заверения об отсутствии обременений.
           → presence = "present" (если хотя бы одно поле ≠ "not_defined");
             no_pledge_status / no_arrest_status / no_third_party_rights_status = "not_defined";
             соответствующие *_details = "Данные не определены".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для leasing_title_and_encumbrances_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined" или "not_defined".
        - Fallback при отсутствии данных: все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности: соответствующие *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "leasing_title_and_encumbrances_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие заверений о титуле и отсутствии обременений. Внутреннее агрегатное signal-поле."
          required: true

        - name: "title_confirmation_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус подтверждения права собственности лизингодателя."
          required: true
          display_in_grid: false
        - name: "title_confirmation_details"
          type: "string"
          presentation: "fact"
          label: "Титул лизингодателя"
          description: "Формулировка о праве собственности лизингодателя на предмет лизинга."
          required: false
          display_in_grid: true
          display_priority: 1
        - name: "no_pledge_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус заверения об отсутствии залога."
          required: true
          display_in_grid: false
        - name: "no_pledge_details"
          type: "string"
          presentation: "fact"
          label: "Отсутствие залога"
          description: >
            Заверение об отсутствии залога на предмет лизинга.
            В РФ предмет лизинга часто заложен банку-кредитору лизингодателя —
            наличие такого залога является ключевым DD-риском.
          required: false
          display_in_grid: true
          display_priority: 2
        - name: "no_arrest_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус заверения об отсутствии ареста."
          required: true
          display_in_grid: false
        - name: "no_arrest_details"
          type: "string"
          presentation: "fact"
          label: "Отсутствие ареста"
          description: "Формулировка об отсутствии ареста на предмет лизинга."
          required: false
          display_in_grid: false
        - name: "no_third_party_rights_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус заверения об отсутствии прав третьих лиц."
          required: true
          display_in_grid: false
        - name: "no_third_party_rights_details"
          type: "string"
          presentation: "fact"
          label: "Отсутствие прав третьих лиц"
          description: "Формулировка об отсутствии прав третьих лиц на предмет лизинга."
          required: false
          display_in_grid: true
          display_priority: 3
        - name: "title_documentation_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус ссылки на документ о чистоте права."
          required: true
          display_in_grid: false
        - name: "title_documentation_details"
          type: "string"
          presentation: "fact"
          label: "Документ о титуле"
          description: "Документ, подтверждающий чистоту права (выписка из ЕГРН, реестр уведомлений о залоге и т.п.)."
          required: false
          display_in_grid: false
      store_payload: true

  - id: leasing_return_check
    name: "Возврат предмета лизинга: состояние, транспортировка, штрафы за невозврат"
    description: >
      Фактографическая проверка порядка и условий возврата предмета лизинга
      по окончании срока или при расторжении договора: акт возврата, допустимое
      состояние, нормальный износ, кто несёт расходы на транспортировку,
      место возврата и штрафы за невозврат / просрочку.
      Результат предназначен для табличного сравнения нескольких документов.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "возврат предмета лизинга"
        - "возвратить предмет"
        - "акт возврата"
        - "состояние предмета"
        - "нормальный износ"
        - "естественный износ"
        - "транспортировка"
        - "демонтаж"
        - "штраф за невозврат"
        - "удержание за просрочку"
        - "место возврата"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)возвра(т|тить)\\s+предмет.*лизинг"
        - "(?i)акт\\s+возврат"
        - "(?i)нормальн(ый|ого)\\s+износ"
        - "(?i)штраф.*невозврат"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор лизинга по ФЗ-164 и §6 Главы 34 ГК РФ.
        Проверяется только один вопрос: порядок и условия возврата предмета лизинга.

        Нормативный ориентир:
        - ст. 622 ГК РФ (субсидиарно) — возврат арендованного имущества
        - Постановление Пленума ВАС РФ от 14.03.2014 № 17 — оценка предмета при возврате

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли порядок возврата предмета лизинга.
        2. Есть ли акт возврата.
        3. Описан ли допустимый стандарт состояния при возврате.
        4. Исключён ли нормальный (естественный) износ из ответственности лизингополучателя.
        5. Кто несёт расходы на транспортировку / демонтаж.
        6. Указано ли место возврата.
        7. Есть ли штрафы / пени за невозврат или просрочку возврата.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона вместо текста договора.
        2. Не выдумывай условия возврата, штрафы, адреса или стандарты состояния, которых нет в тексте.
        3. Разграничение значений для отсутствующих данных:
           - для полей *_status возвращай технический код "not_defined";
           - для текстовых полей *_details возвращай строку "Данные не определены".
        4. Не используй "None", "null", пустые строки ни в одном поле.
        5. В evidence включай только текст договора.
        6. Если в тексте есть противоречивые условия о возврате (например, в одном пункте
           нормальный износ исключён, а в другом — лизингополучатель обязан вернуть предмет
           «в состоянии не худшем, чем при передаче»), используй формулировки из раздела
           о возврате предмета и укажи оба фрагмента в evidence.
        7. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "По окончании срока лизинга Лизингополучатель обязан вернуть предмет по акту
        возврата в исправном состоянии с учётом нормального износа. Расходы на
        транспортировку несёт Лизингополучатель. Место возврата — г. Москва,
        ул. Складская, 10. За каждый день просрочки возврата — пени 3 000 рублей."

        Ответ:
        {
          "return_procedure_status": "defined",
          "return_procedure_details": "вернуть предмет по акту возврата в исправном состоянии",
          "return_act_status": "defined",
          "return_act_details": "акт возврата",
          "condition_standard_status": "defined",
          "condition_standard_details": "в исправном состоянии с учётом нормального износа",
          "normal_wear_excluded_status": "defined",
          "normal_wear_excluded_details": "с учётом нормального износа",
          "transport_costs_status": "defined",
          "transport_costs_details": "расходы на транспортировку несёт Лизингополучатель",
          "return_location_status": "defined",
          "return_location_details": "г. Москва, ул. Складская, 10",
          "late_return_penalty_status": "defined",
          "late_return_penalty_details": "пени 3 000 рублей за каждый день просрочки",
          "evidence": [
            {
              "clause_ref": "п. 9.1",
              "quote": "По окончании срока лизинга Лизингополучатель обязан вернуть предмет по акту возврата в исправном состоянии с учётом нормального износа."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Лизингополучатель возвращает предмет лизинга."

        Ответ:
        {
          "return_procedure_status": "not_defined",
          "return_procedure_details": "Данные не определены",
          "return_act_status": "not_defined",
          "return_act_details": "Данные не определены",
          "condition_standard_status": "not_defined",
          "condition_standard_details": "Данные не определены",
          "normal_wear_excluded_status": "not_defined",
          "normal_wear_excluded_details": "Данные не определены",
          "transport_costs_status": "not_defined",
          "transport_costs_details": "Данные не определены",
          "return_location_status": "not_defined",
          "return_location_details": "Данные не определены",
          "late_return_penalty_status": "not_defined",
          "late_return_penalty_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о порядке возврата.
        2. Найди прямую цитату об акте возврата.
        3. Найди прямую цитату о допустимом состоянии при возврате.
        4. Найди прямую цитату о нормальном / естественном износе.
        5. Найди прямую цитату о расходах на транспортировку / демонтаж.
        6. Найди прямую цитату о месте возврата.
        7. Найди прямую цитату о штрафах / пенях за невозврат или просрочку.
        8. Если прямой цитаты нет — верни "not_defined" в status и "Данные не определены" в details.
           Не додумывай условия.
        9. Проверь, что в ответе присутствуют все ключи, объявленные в fields.

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "return_procedure_status": "<defined / not_defined>",
          "return_procedure_details": "<текст или 'Данные не определены'>",
          "return_act_status": "<defined / not_defined>",
          "return_act_details": "<текст или 'Данные не определены'>",
          "condition_standard_status": "<defined / not_defined>",
          "condition_standard_details": "<текст или 'Данные не определены'>",
          "normal_wear_excluded_status": "<defined / not_defined>",
          "normal_wear_excluded_details": "<текст или 'Данные не определены'>",
          "transport_costs_status": "<defined / not_defined>",
          "transport_costs_details": "<текст или 'Данные не определены'>",
          "return_location_status": "<defined / not_defined>",
          "return_location_details": "<текст или 'Данные не определены'>",
          "late_return_penalty_status": "<defined / not_defined>",
          "late_return_penalty_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 850

    retrieval:
      retrieval_profile: "acceptance_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "возврат предмета лизинга возвратить предмет акт возврата состояние предмета нормальный износ естественный износ транспортировка демонтаж штраф за невозврат место возврата"
      preferred_unit_types:
        - obligation
        - liability_provision
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - procedures
        - obligations
        - remedies
      negative_keywords:
        - "лизинговые платежи"
        - "выкупная цена"
        - "страхование"
        - "ремонт и содержание"
        - "приёмка"
        - "бесспорное списание"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.55, 0.95]
        boost: 0.18
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "procedures"
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 700

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1500

      compact_output: false

      presence_signal:
        field: "leasing_return_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора лизинга условия возврата
        предмета: акт, допустимое состояние, нормальный износ, транспортировка,
        место возврата и штрафы за просрочку.
        Не анализируй лизинговые платежи, страхование, текущий ремонт или сальдо.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. leasing_return_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (return_procedure_status, return_act_status, condition_standard_status,
              normal_wear_excluded_status, transport_costs_status,
              return_location_status, late_return_penalty_status)
             ≠ "not_defined";
           - "missing" — если все семь содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - все *_status = "not_defined";
           - все *_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. return_procedure_status — "defined" если порядок возврата прямо описан,
           иначе "not_defined".
        2. return_procedure_details — формулировка о порядке возврата.
        3. return_act_status — "defined" если акт возврата прямо предусмотрен,
           иначе "not_defined".
        4. return_act_details — формулировка об акте возврата.
        5. condition_standard_status — "defined" если допустимое состояние при возврате
           прямо описано, иначе "not_defined".
        6. condition_standard_details — формулировка о стандарте допустимого состояния.
        7. normal_wear_excluded_status — "defined" если нормальный / естественный износ
           прямо исключён из ответственности лизингополучателя, иначе "not_defined".
        8. normal_wear_excluded_details — формулировка о нормальном износе.
        9. transport_costs_status — "defined" если расходы на транспортировку / демонтаж
           прямо распределены, иначе "not_defined".
        10. transport_costs_details — формулировка о расходах на транспортировку.
        11. return_location_status — "defined" если место возврата прямо указано,
            иначе "not_defined".
        12. return_location_details — формулировка о месте возврата.
        13. late_return_penalty_status — "defined" если штраф / пеня за невозврат
            или просрочку возврата прямо указан(а), иначе "not_defined".
        14. late_return_penalty_details — формулировка и размер штрафа / пени.

        Разграничение значений для отсутствующих данных:
        - для полей *_status возвращай технический код "not_defined";
        - для текстовых полей *_details возвращай строку "Данные не определены".
        </task>

        <context_rules>
        - Перед остальными полями заполни leasing_return_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Данные не определены".
        - Используй только текст договора. Не подставляй нормы закона.
        - Не выдумывай условия возврата, штрафы, адреса или стандарты состояния, которых нет в тексте.
        - Не используй null, None, пустые строки ни в одном поле.
        - normal_wear_excluded_status = "defined" только если нормальный / естественный износ прямо исключён из ответственности лизингополучателя формулировкой в тексте. Не выводи это из ст. 622 ГК РФ автоматически.
        - Если в тексте есть противоречивые условия о возврате (например, в одном пункте нормальный износ исключён, а в другом — лизингополучатель обязан вернуть предмет «в состоянии не худшем, чем при передаче»), используй формулировки из раздела о возврате предмета и приводи оба фрагмента в evidence.
        - Различай: порядок возврата, акт возврата, стандарт состояния, нормальный износ, транспортировка, место возврата и штраф — это семь разных полей.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни порядка возврата, ни акта возврата, ни состояния,
           ни износа, ни транспортировки, ни места, ни штрафов.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        2. Указан только порядок возврата без деталей.
           Есть обязанность вернуть предмет, но не раскрыты состояние, износ,
           транспортировка, место, штрафы.
           → presence = "present";
             return_procedure_status = "defined";
             остальные *_status = "not_defined";
             соответствующие *_details = "Данные не определены".

        3. Противоречие между фрагментами.
           В одном пункте нормальный износ исключён, в другом требуется состояние
           «не худшее, чем при передаче»; или разные места / штрафы возврата.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             соответствующий *_details = "Не удалось определить".

        4. Жёсткий стандарт состояния / отсутствие исключения износа.
           В тексте прямо указано, что предмет возвращается «в состоянии не худшем,
           чем при передаче», либо нормальный износ не упомянут вовсе.
           → presence = "present";
             condition_standard_status = "defined";
             condition_standard_details содержит дословную формулировку;
             normal_wear_excluded_status = "not_defined" (если износ не исключён).
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для leasing_return_check_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined" или "not_defined".
        - Fallback при отсутствии данных: все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности: соответствующие *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "leasing_return_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по возврату предмета лизинга. Внутреннее агрегатное signal-поле."
          required: true

        - name: "return_procedure_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус порядка возврата предмета."
          required: true
          display_in_grid: false
        - name: "return_procedure_details"
          type: "string"
          presentation: "fact"
          label: "Порядок возврата"
          description: "Формулировка о порядке возврата предмета лизинга."
          required: false
          display_in_grid: true
          display_priority: 1
        - name: "return_act_status"
          type: "string"
