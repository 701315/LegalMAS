  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 2: Предмет лизинга
  # ──────────────────────────────────────────────────────────────────────────
  - id: leasing_subject_and_identification
    name: "Предмет лизинга: описание, идентификация, тип и допустимость объекта"
    description: >
      Фактографическая проверка описания предмета лизинга, его типа,
      индивидуализирующих признаков и отсутствия недопустимых объектов
      (земельные участки, природные объекты).
    triggers: ~
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "предмет лизинга"
        - "оборудование"
        - "автомобиль"
        - "недвижимость"
        - "земельный участок"
        - "серийный номер"
        - "VIN"
        - "кадастровый номер"
        - "марка"
        - "модель"
        - "стоимость предмета"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)\\b[A-HJ-NPR-Z0-9]{17}\\b"
        - "(?i)\\b\\d{2}:\\d{2}:\\d{6,7}:\\d+\\b"
        - "(?i)серийн(ый|ого)\\s+номер"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор лизинга по ФЗ-164 и §6 Главы 34 ГК РФ.
        Проверяется только один вопрос: предмет лизинга, его идентификация
        и допустимость.

        Нормативный ориентир:
        - ст. 666 ГК РФ — предмет лизинга
        - ст. 3 ФЗ-164 — не могут быть предметом: земельные участки
          и природные объекты

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Как описан предмет лизинга.
        2. Какой тип предмета.
        3. Есть ли индивидуализирующие признаки (VIN, серийный номер, кадастр).
        4. Указана ли стоимость предмета.
        5. Есть ли указание на земельный участок или природный объект.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined".
        4. Если текстового значения нет — возвращай строго "Данные не определены".
        5. Не используй "None", "null", "not_specified" или пустые строки.
        6. В evidence включай только текст договора.
        7. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Предмет лизинга — станок токарный ЧПУ модель XYZ-500, серийный номер
        SN2024001, стоимость 5 000 000 рублей."

        Ответ:
        {
          "subject_description_status": "defined",
          "subject_description_value": "станок токарный ЧПУ модель XYZ-500",
          "subject_type": "equipment",
          "identifying_features_status": "defined",
          "identifying_features_value": "серийный номер SN2024001",
          "subject_value_status": "defined",
          "subject_value_value": "5 000 000 рублей",
          "prohibited_subject_status": "not_defined",
          "prohibited_subject_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "Предмет лизинга — станок токарный ЧПУ модель XYZ-500, серийный номер SN2024001."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Стороны заключили договор лизинга."

        Ответ:
        {
          "subject_description_status": "not_defined",
          "subject_description_value": "Данные не определены",
          "subject_type": "not_defined",
          "identifying_features_status": "not_defined",
          "identifying_features_value": "Данные не определены",
          "subject_value_status": "not_defined",
          "subject_value_value": "Данные не определены",
          "prohibited_subject_status": "not_defined",
          "prohibited_subject_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату с описанием предмета.
        2. Найди прямую цитату с идентификаторами.
        3. Найди прямую цитату о стоимости.
        4. Найди указание на землю / природный объект.
        5. Если нет — "not_defined".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "subject_description_status": "<defined / not_defined>",
          "subject_description_value": "<текст или 'Данные не определены'>",
          "subject_type": "<equipment / vehicle / real_estate / other / not_defined>",
          "identifying_features_status": "<defined / not_defined>",
          "identifying_features_value": "<текст или 'Данные не определены'>",
          "subject_value_status": "<defined / not_defined>",
          "subject_value_value": "<текст или 'Данные не определены'>",
          "prohibited_subject_status": "<defined / not_defined>",
          "prohibited_subject_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 700

    retrieval:
      retrieval_profile: "registration_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "предмет лизинга оборудование автомобиль недвижимость земельный участок серийный номер VIN кадастровый номер марка модель стоимость предмета"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - definitions
        - obligations
      negative_keywords:
        - "лизинговые платежи"
        - "выкупная цена"
        - "страхование"
        - "ремонт"
        - "возврат"
        - "сальдо"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 0.35]
        boost: 0.20
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "definitions"
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 1000

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора лизинга описание
        предмета, тип, идентификаторы, стоимость и наличие недопустимых объектов.
        Не анализируй платежи, страхование, ремонт или возврат.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. subject_description_status — "defined" если предмет лизинга прямо описан
           (указана марка, модель, наименование или иное описание), иначе "not_defined".
        2. subject_description_value — описание предмета лизинга.
        3. subject_type — "equipment" / "vehicle" / "real_estate" / "other" /
           "not_defined".
        4. identifying_features_status — "defined" если индивидуализирующие признаки
           прямо указаны (VIN, серийный номер, кадастровый номер), иначе "not_defined".
        5. identifying_features_value — VIN, серийный номер, кадастровый номер.
        6. subject_value_status — "defined" если стоимость предмета лизинга прямо
           указана, иначе "not_defined".
        7. subject_value_value — стоимость предмета лизинга.
        8. prohibited_subject_status — "defined" если в тексте есть прямое указание
           на земельный участок или природный объект как предмет лизинга,
           иначе "not_defined".
        9. prohibited_subject_details — формулировка об указании на запрещённый предмет.

        Если данные отсутствуют:
        - статус = "not_defined"
        - текст = "Данные не определены"
        </task>

        <rules>
        - Используй только текст договора.
        - subject_type:
            - "equipment" — оборудование, станки, техника.
            - "vehicle" — транспортное средство.
            - "real_estate" — здание, помещение (кроме земли).
            - "other" — иной объект.
            - "not_defined" — не определён.
        - prohibited_subject_status = "defined" только если земля или природный
          объект прямо указаны как предмет лизинга.
        - Верни только JSON.
        </rules>
      fields:
        - name: "subject_description_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус описания предмета лизинга."
          required: true
        - name: "subject_description_value"
          type: "string"
          presentation: "fact"
          label: "Предмет лизинга"
          description: "Описание предмета лизинга."
          required: true
          display_in_grid: true
          display_priority: 1
        - name: "subject_type"
          type: "string"
          presentation: "signal"
          allowed_values: ["equipment", "vehicle", "real_estate", "other", "not_defined"]
          description: "Тип предмета лизинга."
          required: false
        - name: "identifying_features_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус идентифицирующих признаков."
          required: false
        - name: "identifying_features_value"
          type: "string"
          presentation: "fact"
          label: "Идентификаторы"
          description: "VIN, серийный номер, кадастровый номер."
          required: false
          display_in_grid: true
          display_priority: 2
        - name: "subject_value_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус стоимости предмета."
          required: false
        - name: "subject_value_value"
          type: "string"
          presentation: "fact"
          label: "Стоимость предмета"
          description: "Стоимость предмета лизинга."
          required: false
          display_in_grid: true
          display_priority: 3
        - name: "prohibited_subject_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус наличия недопустимого предмета."
          required: false
        - name: "prohibited_subject_details"
          type: "string"
          presentation: "fact"
          label: "Недопустимый предмет"
          description: "Указание на земельный участок или природный объект."
          required: false
          display_in_grid: false
      store_payload: true

