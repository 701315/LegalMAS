# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 3: SHARED PATTERNS
#  Читается: DocTypeCheckLoader через _resolve_yaml_templates()
# ════════════════════════════════════════════════════════════════════════════

shared_patterns:

  money_amount: "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|тыс|млн|млрд|usd|eur)\\b"
  date_pattern: "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"
  percentage: "(?i)\\b\\d+[,.]?\\d*\\s*%\\b"
  cadastral_number: "(?i)\\b\\d{2}:\\d{2}:\\d{6,7}:\\d+\\b"
  vin_number: "(?i)\\b[A-HJ-NPR-Z0-9]{17}\\b"
  inn_ogrn: "(?i)\\b(?:ИНН|ОГРН|ОГРНИП|КПП)\\s*:?\\s*\\d{9,15}\\b"

compliance_rules: []

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: CHECKS_V8 — LLM/hybrid проверки
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  - id: leasing_parties_and_vendor
    name: "Стороны лизинга: лизингодатель, лизингополучатель, продавец и выбор продавца"
    description: >
      Фактографическая проверка идентификации сторон договора лизинга,
      продавца, реквизитов, подписантов и указания на то, кто выбрал продавца.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "лизингодатель"
        - "лизингополучатель"
        - "продавец"
        - "в лице"
        - "действующего на основании"
        - "ИНН"
        - "ОГРН"
        - "выбор продавца"
        - "по выбору лизингополучателя"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(лизингодатель|лизингополучатель|продавец).*именуем"
        - "(?i)\\b(?:ИНН|ОГРН|ОГРНИП|КПП)\\s*:?\\s*\\d{9,15}\\b"
        - "(?i)по\\s+выбору\\s+(лизингополучател|лизингодател)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор лизинга по ФЗ-164 и §6 Главы 34 ГК РФ.
        Проверяется только один вопрос: идентификация сторон, продавца
        и указание на выбор продавца.

        Нормативный ориентир:
        - ст. 665 ГК РФ — существенные условия лизинга
        - ст. 670 ГК РФ — солидарная ответственность при выборе продавца лизингодателем

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Кто указан как Лизингодатель.
        2. Кто указан как Лизингополучатель.
        3. Кто указан как Продавец.
        4. Кто подписывает от каждой стороны и на каком основании.
        5. Указано ли, кто выбрал продавца.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона вместо текста договора.
        2. Не выдумывай наименования, ИНН, ОГРН, ФИО, которых нет в тексте.
        3. Разграничение значений для отсутствующих данных:
           - для полей *_status возвращай технический код "not_defined";
           - для текстовых полей *_value / *_details возвращай строку "Данные не определены";
           - для полей *_basis возвращай "not_defined".
        4. Не используй "None", "null", пустые строки ни в одном поле.
        5. В evidence включай только текст договора.
        6. Если в тексте есть противоречивые сведения о сторонах (например, в преамбуле
           и в блоке реквизитов), используй данные из преамбулы и укажи оба фрагмента
           в evidence.
        7. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "ООО «ЛизингПро» (ИНН 7700000001), именуемое «Лизингодатель», в лице
        директора Иванова И.И., действующего на основании Устава, ООО «Завод»
        (ИНН 7700000002), именуемое «Лизингополучатель», в лице Петрова П.П.,
        действующего на основании доверенности. Продавец — ООО «Поставщик»
        (ИНН 7700000003), выбранный Лизингополучателем."

        Ответ:
        {
          "lessor_details_status": "defined",
          "lessor_details_value": "ООО «ЛизингПро», ИНН 7700000001",
          "lessor_signatory_status": "defined",
          "lessor_signatory_value": "директор Иванов И.И.",
          "lessor_signatory_basis": "charter",
          "lessee_details_status": "defined",
          "lessee_details_value": "ООО «Завод», ИНН 7700000002",
          "lessee_signatory_status": "defined",
          "lessee_signatory_value": "Петров П.П.",
          "lessee_signatory_basis": "poa",
          "vendor_details_status": "defined",
          "vendor_details_value": "ООО «Поставщик», ИНН 7700000003",
          "vendor_selection_status": "defined",
          "vendor_selection_details": "выбранный Лизингополучателем",
          "evidence": [
            {
              "clause_ref": "Преамбула",
              "quote": "ООО «ЛизингПро» (ИНН 7700000001), именуемое «Лизингодатель»."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Стороны заключили договор лизинга."

        Ответ:
        {
          "lessor_details_status": "not_defined",
          "lessor_details_value": "Данные не определены",
          "lessor_signatory_status": "not_defined",
          "lessor_signatory_value": "Данные не определены",
          "lessor_signatory_basis": "not_defined",
          "lessee_details_status": "not_defined",
          "lessee_details_value": "Данные не определены",
          "lessee_signatory_status": "not_defined",
          "lessee_signatory_value": "Данные не определены",
          "lessee_signatory_basis": "not_defined",
          "vendor_details_status": "not_defined",
          "vendor_details_value": "Данные не определены",
          "vendor_selection_status": "not_defined",
          "vendor_selection_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату с Лизингодателем.
        2. Найди прямую цитату с Лизингополучателем.
        3. Найди прямую цитату с Продавцом.
        4. Найди прямую цитату о выборе продавца.
        5. Если прямой цитаты нет — верни "not_defined" в status и "Данные не определены" в value.
        6. Проверь, что в ответе присутствуют все ключи, объявленные в fields.

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "lessor_details_status": "<defined / not_defined>",
          "lessor_details_value": "<текст или 'Данные не определены'>",
          "lessor_signatory_status": "<defined / not_defined>",
          "lessor_signatory_value": "<текст или 'Данные не определены'>",
          "lessor_signatory_basis": "<charter / poa / order / other / not_defined>",
          "lessee_details_status": "<defined / not_defined>",
          "lessee_details_value": "<текст или 'Данные не определены'>",
          "lessee_signatory_status": "<defined / not_defined>",
          "lessee_signatory_value": "<текст или 'Данные не определены'>",
          "lessee_signatory_basis": "<charter / poa / order / other / not_defined>",
          "vendor_details_status": "<defined / not_defined>",
          "vendor_details_value": "<текст или 'Данные не определены'>",
          "vendor_selection_status": "<defined / not_defined>",
          "vendor_selection_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 800

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "лизингодатель лизингополучатель продавец в лице действующего на основании ИНН ОГРН выбор продавца по выбору лизингополучателя"
      retrieval_profile: "party_identification_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - definitions
        - boilerplate
      negative_keywords:
        - "предмет лизинга"
        - "лизинговые платежи"
        - "выкупная цена"
        - "страхование"
        - "ремонт"
        - "возврат"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 0.20]
        boost: 0.25
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "definitions"
        - "boilerplate"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.15

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1500

      compact_output: false

      presence_signal:
        field: "leasing_parties_and_vendor_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора лизинга сведения
        о Лизингодателе, Лизингополучателе, Продавце, подписантах и выборе продавца.
        Не анализируй предмет лизинга, платежи, страхование или ремонт.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. leasing_parties_and_vendor_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (lessor_details_status, lessor_signatory_status, lessor_signatory_basis,
              lessee_details_status, lessee_signatory_status, lessee_signatory_basis,
              vendor_details_status, vendor_selection_status)
             ≠ "not_defined";
           - "missing" — если все восемь содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - все *_status = "not_defined";
           - все *_basis = "not_defined";
           - все *_value / *_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. lessor_details_status — "defined" если Лизингодатель прямо идентифицирован
           (указано наименование, ИНН или иные реквизиты), иначе "not_defined".
        2. lessor_details_value — наименование/ФИО и реквизиты Лизингодателя.
        3. lessor_signatory_status — "defined" если подписант Лизингодателя прямо
           указан, иначе "not_defined".
        4. lessor_signatory_value — подписант Лизингодателя.
        5. lessor_signatory_basis — "charter" / "poa" / "order" / "other" /
           "not_defined".
        6. lessee_details_status — "defined" если Лизингополучатель прямо
           идентифицирован, иначе "not_defined".
        7. lessee_details_value — наименование/ФИО и реквизиты Лизингополучателя.
        8. lessee_signatory_status — "defined" если подписант Лизингополучателя
           прямо указан, иначе "not_defined".
        9. lessee_signatory_value — подписант Лизингополучателя.
        10. lessee_signatory_basis — "charter" / "poa" / "order" / "other" /
            "not_defined".
        11. vendor_details_status — "defined" если Продавец прямо идентифицирован,
            иначе "not_defined".
        12. vendor_details_value — наименование/ФИО и реквизиты Продавца.
        13. vendor_selection_status — "defined" если прямо указано, кто выбрал
            продавца (лизингодатель или лизингополучатель), иначе "not_defined".
        14. vendor_selection_details — формулировка о выборе продавца из текста
            договора (например: "выбран Лизингополучателем", "выбор продавца
            осуществлён Лизингодателем").

        Разграничение значений для отсутствующих данных:
        - для полей *_status возвращай "not_defined";
        - для текстовых полей *_value и *_details возвращай "Данные не определены";
        - для полей *_basis возвращай "not_defined".
        </task>

        <context_rules>
        - Перед остальными полями заполни leasing_parties_and_vendor_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_basis = "not_defined", все *_value / *_details = "Данные не определены".
        - Используй только текст договора. Не подставляй нормы закона.
        - Не выдумывай наименования, ИНН, ОГРН, ФИО, которых нет в тексте.
        - Не используй null, None, пустые строки ни в одном поле.
        - Значения полей *_basis: "charter" — устав; "poa" — доверенность; "order" — приказ; "other" — иное основание, прямо названное в договоре; "not_defined" — основание не указано.
        - Если в тексте есть противоречивые сведения о сторонах (например, в преамбуле и в блоке реквизитов), используй данные из преамбулы и приведи оба фрагмента в evidence.
        - Не смешивай сведения о Лизингодателе, Лизингополучателе и Продавце.
        - Если указаны только роли без реквизитов — соответствующий *_status = "not_defined".
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни упоминания сторон лизинга, ни их реквизитов,
           ни продавца, ни подписантов.
           → presence = "missing";
             все *_status = "not_defined";
             все *_basis = "not_defined";
             все *_value / *_details = "Данные не определены".

        2. Только роли без идентификации.
           Упомянуты «Лизингодатель», «Лизингополучатель», «Продавец»,
           но без реквизитов, ФИО и подписантов.
           → presence = "present";
             соответствующие *_status = "not_defined";
             соответствующие *_value = "Данные не определены".

        3. Противоречие между фрагментами.
           В преамбуле и в блоке реквизитов указаны разные наименования/ИНН одной стороны.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             соответствующий *_value = "Не удалось определить".

        4. Продавец не назван или не указан выбор продавца.
           Стороны лизинга идентифицированы, но vendor leg не раскрыт.
           → presence = "present" (если хотя бы одно содержательное поле ≠ "not_defined");
             vendor_details_status и/или vendor_selection_status = "not_defined";
             соответствующие *_value = "Данные не определены".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для leasing_parties_and_vendor_presence используй только: "present", "missing", "unclear".
        - Для enum-полей *_status используй только: "defined", "not_defined".
        - Для enum-полей *_basis используй только: "charter", "poa", "order", "other", "not_defined".
        - Fallback при отсутствии данных: все *_value / *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности: соответствующие *_value / *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "leasing_parties_and_vendor_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие идентификации сторон лизинга и выбора продавца. Внутреннее агрегатное signal-поле."
          required: true

        - name: "lessor_details_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус идентификации Лизингодателя."
          required: true
          display_in_grid: false
        - name: "lessor_details_value"
