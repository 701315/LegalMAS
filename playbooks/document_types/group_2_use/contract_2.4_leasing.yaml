  - id: leasing_registration_check
    name: "Регистрация предмета лизинга: ГИБДД, Гостехнадзор, Федресурс и расходы"
    description: >
      Фактографическая проверка наличия в тексте условий о государственной
      регистрации предмета лизинга: орган регистрации (ГИБДД, Гостехнадзор, Росреестр),
      ответственная сторона, срок регистрации, расходы и обязанность по публикации
      обременения лизингом в Федресурсе.
      Результат предназначен для табличного сравнения нескольких документов.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "регистрация в ГИБДД"
        - "временный учет"
        - "ПТС"
        - "Росреестр"
        - "ЕГРН"
        - "обременение"
        - "расходы на регистрацию"
        - "госпошлина"
        - "Гостехнадзор"
        - "самоходн"
        - "Федресурс"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)ГИБДД|ПТС|СТС|Гостехнадзор"
        - "(?i)Росреестр|ЕГРН"
        - "(?i)обременени|Федресурс"
        - "(?i)госпошлин"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор лизинга по ФЗ-164 и §6 Главы 34 ГК РФ.
        Проверяется только один вопрос: регистрация предмета лизинга в уполномоченном органе
        (ГИБДД, Гостехнадзор, Росреестр) и отражение обременений (включая публикацию в Федресурсе).

        Нормативный ориентир:
        - Регламент МВД — регистрация ТС в ГИБДД
        - Регламент Гостехнадзора — регистрация самоходных машин и спецтехники
        - ФЗ-218 (Росреестр) — регистрация прав на недвижимость
        - ст. 5 ФЗ-164 — обязательная публикация сведений о лизинге в Федресурсе

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Предусмотрено ли условие о государственной регистрации предмета лизинга.
        2. В каком уполномоченном органе регистрируется (ГИБДД / Гостехнадзор / Росреестр / иной).
        3. Кто обязан обеспечить регистрацию предмета лизинга.
        4. Предусмотрен ли конкретный срок для осуществления регистрации.
        5. Кто несёт расходы на государственную регистрацию и госпошлину.
        6. Есть ли указание на отметку об обременении в пользу лизингодателя и/или обязанность публикации сведений о лизинге в Федресурсе.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона вместо текста договора.
        2. Не выдумывай сроки регистрации, пошлины, органы регистрации или правила Федресурса, которых нет в тексте.
        3. Разграничение значений для отсутствующих данных:
           - для полей *_status и registration_authority_code возвращай технический код "not_defined";
           - для текстовых полей *_details возвращай строку "Данные не определены".
        4. Не используй "None", "null", пустые строки ни в одном поле.
        5. В evidence включай только текст договора.
        6. Учитывай, что в РФ спецтехника (экскаваторы, погрузчики, тракторы) регистрируется в Гостехнадзоре,
           а автотранспорт — в ГИБДД. Тщательно фиксируй этот орган.
        7. Сведения об обременении в лизинге часто включают в себя обязанность публикации в Федресурсе (ст. 5 ФЗ-164).
           Обязательно извлекай эти положения и заноси в encumbrance_details.
        8. Если в тексте есть противоречивые условия о регистрации (например, в одном пункте регистрирует Лизингодатель,
           а в другом — Лизингополучатель), используй формулировки из раздела о регистрации предмета
           и укажи оба фрагмента в evidence.
        9. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Транспортное средство регистрируется в ГИБДД на Лизингополучателя
        с отметкой об обременении в пользу Лизингодателя. Регистрацию
        обеспечивает Лизингополучатель в течение 10 рабочих дней.
        Расходы на регистрацию и госпошлину несёт Лизингополучатель.
        Публикацию в Федресурсе осуществляет Лизингодатель."

        Ответ:
        {
          "registration_required_status": "defined",
          "registration_authority_code": "gibdd",
          "registration_authority_details": "ГИБДД",
          "who_registers_status": "defined",
          "who_registers_details": "Лизингополучатель",
          "registration_deadline_status": "defined",
          "registration_deadline_details": "в течение 10 рабочих дней",
          "registration_costs_status": "defined",
          "registration_costs_details": "расходы на регистрацию и госпошлину несёт Лизингополучатель",
          "encumbrance_status": "defined",
          "encumbrance_details": "с отметкой об обременении в пользу Лизингодателя. Публикацию в Федресурсе осуществляет Лизингодатель",
          "evidence": [
            {
              "clause_ref": "п. 7.1",
              "quote": "Транспортное средство регистрируется в ГИБДД на Лизингополучателя с отметкой об обременении в пользу Лизингодателя."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Стороны обязуются соблюдать действующее законодательство РФ."

        Ответ:
        {
          "registration_required_status": "not_defined",
          "registration_authority_code": "not_defined",
          "registration_authority_details": "Данные не определены",
          "who_registers_status": "not_defined",
          "who_registers_details": "Данные не определены",
          "registration_deadline_status": "not_defined",
          "registration_deadline_details": "Данные не определены",
          "registration_costs_status": "not_defined",
          "registration_costs_details": "Данные не определены",
          "encumbrance_status": "not_defined",
          "encumbrance_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату об обязанности государственной регистрации.
        2. Найди орган регистрации (ГИБДД, Гостехнадзор, Росреестр).
        3. Найди, кто именно обязан зарегистрировать предмет.
        4. Найди срок, в течение которого нужно осуществить регистрацию.
        5. Найди расходы на регистрацию и госпошлину.
        6. Найди указания на отметку об обременении и публикацию в Федресурсе.
        7. Если прямой цитаты нет — верни "not_defined" в status/code и "Данные не определены" в details.
           Не додумывай условия за рамками текста.
        8. Проверь, что в ответе присутствуют все ключи, объявленные в fields.

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "registration_required_status": "<defined / not_defined>",
          "registration_authority_code": "<gibdd / rosreestr / other / not_defined>",
          "registration_authority_details": "<текст или 'Данные не определены'>",
          "who_registers_status": "<defined / not_defined>",
          "who_registers_details": "<текст или 'Данные не определены'>",
          "registration_deadline_status": "<defined / not_defined>",
          "registration_deadline_details": "<текст или 'Данные не определены'>",
          "registration_costs_status": "<defined / not_defined>",
          "registration_costs_details": "<текст или 'Данные не определены'>",
          "encumbrance_status": "<defined / not_defined>",
          "encumbrance_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 800

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "регистрация в ГИБДД Гостехнадзор самоходные машины Росреестр ЕГРН обременение расходы на регистрацию госпошлина Федресурс временный учёт"
      retrieval_profile: "registration_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - procedures
        - obligations
      negative_keywords:
        - "лизинговые платежи"
        - "выкупная цена"
        - "страхование"
        - "ремонт"
        - "возврат предмета"
        - "сальдо"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.20, 0.70]
        boost: 0.15
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "procedures"
        - "obligations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1500

      compact_output: false

      presence_signal:
        field: "leasing_registration_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора лизинга условия
        о государственной регистрации предмета: уполномоченный орган (ГИБДД, Гостехнадзор, Росреестр),
        ответственная сторона, сроки, расходы и обременение в пользу лизингодателя (включая публикации в Федресурсе).
        Не анализируй график лизинговых платежей, страхование, ремонт или возврат предмета.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. leasing_registration_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (registration_required_status, registration_authority_code,
              who_registers_status, registration_deadline_status,
              registration_costs_status, encumbrance_status)
             ≠ "not_defined";
           - "missing" — если все шесть содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - все *_status = "not_defined";
           - registration_authority_code = "not_defined";
           - все *_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. registration_required_status — "defined" если регистрация прямо предусмотрена, иначе "not_defined".
        2. registration_authority_code — "gibdd" / "rosreestr" / "other" / "not_defined".
        3. registration_authority_details — формулировка об органе регистрации (например: ГИБДД, Гостехнадзор, Росреестр).
        4. who_registers_status — "defined" если ответственная сторона за регистрацию прямо указана, иначе "not_defined".
        5. who_registers_details — формулировка о том, кто регистрирует (Лизингодатель или Лизингополучатель).
        6. registration_deadline_status — "defined" если срок осуществления регистрации прямо указан, иначе "not_defined".
        7. registration_deadline_details — формулировка о сроке регистрации.
        8. registration_costs_status — "defined" если расходы на регистрацию и пошлины прямо распределены, иначе "not_defined".
        9. registration_costs_details — формулировка о расходах на регистрацию и госпошлину.
        10. encumbrance_status — "defined" если обременение в пользу лизингодателя или обязанность по внесению сведений в Федресурс прямо предусмотрены, иначе "not_defined".
        11. encumbrance_details — формулировка об обременении предмета лизингом и обязанности публикации в Федресурсе.

        Разграничение значений для отсутствующих данных:
        - для полей *_status и registration_authority_code возвращай технический код "not_defined";
        - для текстовых полей *_details возвращай строку "Данные не определены".
        </task>

        <context_rules>
        - Перед остальными полями заполни leasing_registration_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", registration_authority_code = "not_defined", все *_details = "Данные не определены".
        - Используй только текст договора. Не подставляй нормы закона.
        - registration_authority_code: "gibdd" — регистрация ТС в ГИБДД; "rosreestr" — регистрация прав в Росреестре (недвижимость); "other" — регистрация в Гостехнадзоре (для спецтехники и самоходных машин) или ином органе, прямо названном в тексте; "not_defined" — орган регистрации прямо не указан.
        - Не выдумывай сроки регистрации, пошлины, органы регистрации или правила публикации, которых нет в тексте.
        - Не выводи необходимость регистрации и сроки из диспозитивных норм закона — фиксируй только то, что прямо написано в договоре.
        - Не используй null, None, пустые строки ни в одном поле.
        - Если в тексте есть противоречивые положения о регистрации, используй положения из специального раздела о регистрации предмета и приводи оба фрагмента в evidence.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни условия о регистрации, ни органа, ни ответственной стороны,
           ни срока, ни расходов, ни обременения / Федресурса.
           → presence = "missing";
             все *_status = "not_defined";
             registration_authority_code = "not_defined";
             все *_details = "Данные не определены".

        2. Указана только обязанность регистрации без деталей.
           Есть указание, что предмет подлежит регистрации, но без органа,
           срока, ответственной стороны и расходов.
           → presence = "present";
             registration_required_status = "defined";
             остальные *_status = "not_defined";
             соответствующие *_details = "Данные не определены".

        3. Противоречие между фрагментами.
           В одном пункте регистрирует Лизингодатель, в другом — Лизингополучатель;
           или указаны разные органы регистрации.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             соответствующий *_details = "Не удалось определить".

        4. Специфика темы — регистрация в Гостехнадзоре или оговорка про Федресурс.
           В договоре прямо указана регистрация самоходной машины в Гостехнадзоре
           (кодируется как "other") либо обязанность публикации сведений о лизинге
           в Федресурсе.
           → presence = "present";
             registration_authority_code = "other" (для Гостехнадзора);
             encumbrance_status = "defined";
             encumbrance_details содержит дословную формулировку.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для leasing_registration_check_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined" или "not_defined".
        - Для registration_authority_code используй только: "gibdd", "rosreestr", "other", "not_defined".
        - Fallback при отсутствии данных: все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности: соответствующие *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "leasing_registration_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
