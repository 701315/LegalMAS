  - id: leasing_vendor_direct_claims
    name: "Право прямого иска лизингополучателя к продавцу (ст. 670 ГК РФ)"
    description: >
      Фактографическая проверка наличия в тексте права лизингополучателя
      предъявлять требования к продавцу, солидарной ответственности
      при выборе продавца лизингодателем и порядка рекламаций по качеству.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "требования к продавцу"
        - "претензии к продавцу"
        - "право предъявлять требования"
        - "солидарная ответственность"
        - "качество предмета"
        - "недостатки предмета лизинга"
        - "ст. 670"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)требовани(я|й).*к.*продавц"
        - "(?i)солидарн(ая|ой)\\s+ответственност"
        - "(?i)ст(?:атья|\\.)?\\s*670"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор лизинга по ФЗ-164 и §6 Главы 34 ГК РФ.
        Проверяется только один вопрос: право лизингополучателя на прямые
        требования к продавцу по качеству и комплектности предмета лизинга.

        Нормативный ориентир:
        - ст. 670 ГК РФ — лизингополучатель вправе предъявлять требования к продавцу
          напрямую; при выборе продавца лизингодателем — солидарная ответственность

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли упоминание права прямого предъявления требований (иска) к продавцу.
        2. Есть ли прямая ссылка на ст. 670 ГК РФ.
        3. Есть ли указание на солидарную ответственность Лизингодателя и Продавца.
        4. Есть ли порядок предъявления претензий/рекламаций по качеству и комплектности.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона вместо текста договора.
        2. Не выводи право прямого иска и солидарную ответственность автоматически из ст. 670 ГК РФ —
           фиксируй только то, что прямо написано в договоре.
        3. Не выдумывай условия рекламаций, ссылки на статьи или формулировки об ответственности, которых нет в тексте.
        4. Разграничение значений для отсутствующих данных:
           - для полей *_status возвращай технический код "not_defined";
           - для текстовых полей *_details возвращай строку "Данные не определены".
        5. Не используй "None", "null", пустые строки ни в одном поле.
        6. В evidence включай только текст договора.
        7. Если в тексте есть противоречивые условия (например, в одном пункте право иска предоставлено,
           а в другом исключена ответственность Лизингодателя), используй формулировки из основного текста
           и укажи оба фрагмента в evidence.
        8. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "В соответствии со ст. 670 ГК РФ Лизингополучатель вправе предъявлять
        требования к Продавцу о качестве и комплектности предмета лизинга.
        Поскольку Продавец выбран Лизингодателем, Лизингодатель и Продавец
        отвечают солидарно."

        Ответ:
        {
          "direct_claim_right_status": "defined",
          "direct_claim_right_details": "Лизингополучатель вправе предъявлять требования к Продавцу о качестве и комплектности",
          "st670_reference_status": "defined",
          "st670_reference_details": "ст. 670 ГК РФ",
          "solidarity_status": "defined",
          "solidarity_details": "Лизингодатель и Продавец отвечают солидарно",
          "quality_claim_procedure_status": "not_defined",
          "quality_claim_procedure_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 6.1",
              "quote": "В соответствии со ст. 670 ГК РФ Лизингополучатель вправе предъявлять требования к Продавцу."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Стороны решают вопросы качества самостоятельно."

        Ответ:
        {
          "direct_claim_right_status": "not_defined",
          "direct_claim_right_details": "Данные не определены",
          "st670_reference_status": "not_defined",
          "st670_reference_details": "Данные не определены",
          "solidarity_status": "not_defined",
          "solidarity_details": "Данные не определены",
          "quality_claim_procedure_status": "not_defined",
          "quality_claim_procedure_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о праве требований к продавцу.
        2. Найди прямую ссылку на ст. 670 ГК РФ.
        3. Найди прямую цитату о солидарной ответственности лизингодателя и продавца.
        4. Найди прямую цитату о порядке направления претензий по качеству.
        5. Если прямой цитаты нет — верни "not_defined" в status и "Данные не определены" в details.
        6. Проверь, что в ответе присутствуют все ключи, объявленные в fields.

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "direct_claim_right_status": "<defined / not_defined>",
          "direct_claim_right_details": "<текст или 'Данные не определены'>",
          "st670_reference_status": "<defined / not_defined>",
          "st670_reference_details": "<текст или 'Данные не определены'>",
          "solidarity_status": "<defined / not_defined>",
          "solidarity_details": "<текст или 'Данные не определены'>",
          "quality_claim_procedure_status": "<defined / not_defined>",
          "quality_claim_procedure_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 7
      temperature: 0.0
      max_tokens: 700

    retrieval:
      retrieval_profile: "warranties_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "требования к продавцу претензии к продавцу ст. 670 солидарная ответственность качество предмета недостатки предмета лизинга рекламация"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - remedies
      negative_keywords:
        - "лизинговые платежи"
        - "выкупная цена"
        - "страхование"
        - "возврат"
        - "сальдо"
        - "бесспорное списание"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.25, 0.70]
        boost: 0.15
        scope: segment
      context_k: 7
      max_chunks: 9
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "remedies"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1100

      compact_output: false

      presence_signal:
        field: "leasing_vendor_direct_claims_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора лизинга право прямого
        иска к продавцу, ссылку на ст. 670, солидарную ответственность
        и порядок претензий по качеству.
        Не анализируй лизинговые платежи, страхование, ремонт или возврат.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. leasing_vendor_direct_claims_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (direct_claim_right_status, st670_reference_status,
              solidarity_status, quality_claim_procedure_status)
             ≠ "not_defined";
           - "missing" — если все четыре содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - все *_status = "not_defined";
           - все *_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. direct_claim_right_status — "defined" если право лизингополучателя предъявлять
           требования непосредственно к продавцу прямо указано в тексте, иначе "not_defined".
        2. direct_claim_right_details — формулировка о праве прямого иска/требования к продавцу.
        3. st670_reference_status — "defined" если прямая ссылка на ст. 670 ГК РФ
           присутствует в тексте, иначе "not_defined".
        4. st670_reference_details — формулировка со ссылкой на ст. 670 ГК РФ.
        5. solidarity_status — "defined" если солидарная ответственность лизингодателя
           и продавца прямо указана в тексте договора, иначе "not_defined".
        6. solidarity_details — формулировка о солидарной ответственности.
        7. quality_claim_procedure_status — "defined" если порядок предъявления претензий
           по качеству и комплектности прямо описан, иначе "not_defined".
        8. quality_claim_procedure_details — формулировка о порядке претензий.

        Разграничение значений для отсутствующих данных:
        - для полей *_status возвращай технический код "not_defined";
        - для текстовых полей *_details возвращай строку "Данные не определены".
        </task>

        <context_rules>
        - Перед остальными полями заполни leasing_vendor_direct_claims_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Данные не определены".
        - Используй только текст договора. Не подставляй нормы закона.
        - Не выводи право прямого иска и солидарную ответственность автоматически из ст. 670 ГК РФ — фиксируй только то, что прямо написано в договоре.
        - Не выдумывай условия рекламаций, ссылки на статьи или формулировки об ответственности, которых нет в тексте.
        - Не используй null, None, пустые строки ни в одном поле.
        - Если в тексте есть противоречивые положения о правах к продавцу, используй положения из раздела о гарантии/правах сторон и приводи оба фрагмента в evidence.
        - Различай: право иска к продавцу, ссылку на ст. 670, солидарную ответственность и процедуру претензий — это четыре разных поля.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни права иска к продавцу, ни ссылки на ст. 670,
           ни солидарной ответственности, ни процедуры претензий по качеству.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        2. Только ссылка на закон без права иска.
           В тексте есть упоминание ст. 670 ГК РФ, но право иска к продавцу
           и солидарная ответственность прямо не сформулированы.
           → presence = "present";
             st670_reference_status = "defined";
             direct_claim_right_status / solidarity_status = "not_defined";
             соответствующие *_details = "Данные не определены".

        3. Противоречие между фрагментами.
           В одном пункте право иска к продавцу предоставлено,
           в другом — исключена ответственность Лизингодателя.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             соответствующий *_details = "Не удалось определить".

        4. Солидарная ответственность при выборе продавца лизингодателем.
           В тексте прямо указано, что Продавец выбран Лизингодателем,
           и Лизингодатель и Продавец отвечают солидарно.
           → presence = "present";
             solidarity_status = "defined";
             solidarity_details содержит дословную формулировку.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для leasing_vendor_direct_claims_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined" или "not_defined".
        - Fallback при отсутствии данных: все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности: соответствующие *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "leasing_vendor_direct_claims_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по прямым требованиям к продавцу. Внутреннее агрегатное signal-поле."
          required: true

        - name: "direct_claim_right_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус права прямого иска к продавцу."
          required: true
          display_in_grid: false
        - name: "direct_claim_right_details"
          type: "string"
          presentation: "fact"
          label: "Право иска к продавцу"
          description: "Формулировка о праве прямого иска к продавцу по качеству/комплектности (ст. 670 ГК РФ)."
          required: false
          display_in_grid: true
          display_priority: 1
        - name: "st670_reference_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус ссылки на ст. 670 ГК РФ."
          required: true
          display_in_grid: false
        - name: "st670_reference_details"
          type: "string"
          presentation: "fact"
          label: "Ссылка на ст. 670"
          description: "Ссылка на ст. 670 ГК РФ в тексте договора."
          required: false
          display_in_grid: false
        - name: "solidarity_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус солидарной ответственности."
          required: true
          display_in_grid: false
        - name: "solidarity_details"
          type: "string"
          presentation: "fact"
          label: "Солидарная ответственность"
          description: "Формулировка о солидарной ответственности лизингодателя и продавца."
          required: false
          display_in_grid: true
          display_priority: 2
        - name: "quality_claim_procedure_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус порядка претензий по качеству."
          required: true
          display_in_grid: false
        - name: "quality_claim_procedure_details"
          type: "string"
          presentation: "fact"
          label: "Претензии по качеству"
          description: "Формулировка о порядке предъявления претензий по качеству и комплектности."
          required: false
          display_in_grid: false
      store_payload: true

  - id: leasing_default_and_saldo
    name: "Default remedies, сальдо при расторжении и изъятие предмета (Пленум ВАС №17)"
    description: >
      Фактографическая проверка санкций при default: бесспорное списание,
      исполнительная надпись, изъятие предмета, досрочное расторжение,
      методика расчёта сальдо встречных обязательств и оценка
      возвращённого предмета.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "бесспорное списание"
        - "без акцепта"
        - "исполнительная надпись нотариуса"
        - "изъятие предмета лизинга"
        - "досрочное взыскание"
        - "одностороннее расторжение"
        - "сальдо встречных обязательств"
        - "завершающая обязанность"
        - "стоимость возвращённого предмета"
        - "рыночная стоимость"
        - "просрочка более"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)бесспорн(ое|ого)\\s+списан"
        - "(?i)исполнительн(ая|ой)\\s+надпис"
        - "(?i)изъят(ие|ия)\\s+предмета\\s+лизинг"
        - "(?i)сальдо\\s+встречн"
        - "(?i)завершающ(ая|ей)\\s+обязанност"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор лизинга по ФЗ-164 и §6 Главы 34 ГК РФ.
        Проверяется только один вопрос: механизмы защиты лизингодателя при default
        (бесспорное взыскание, исполнительная надпись, изъятие, расторжение) и методика расчёта сальдо
        встречных обязательств при досрочном расторжении.

        Нормативный ориентир:
        - ст. 13 ФЗ-164 — бесспорное взыскание и право изъятия предмета лизинга
        - ст. 90-92 Основ законодательства РФ о нотариате — исполнительная надпись
        - Постановление Пленума ВАС РФ от 14.03.2014 № 17 — сальдо встречных обязательств

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли механизм бесспорного (безакцептного) списания средств.
        2. Есть ли условие о взыскании задолженности по исполнительной надписи нотариуса.
        3. Есть ли право внесудебного или судебного изъятия предмета лизинга.
        4. Есть ли основания и порядок досрочного расторжения/отказа от договора при default.
        5. Есть ли методика расчёта сальдо встречных обязательств (завершающей обязанности).
        6. Есть ли метод оценки возвращённого/изъятого предмета лизинга.
        7. Есть ли прямое условие о возврате излишка (положительного сальдо) лизингополучателю.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона вместо текста договора.
        2. Не применяй методику Пленума ВАС № 17 автоматически — фиксируй только то,
           что прямо написано о расчёте сальдо в договоре.
        3. Не выдумывай основания расторжения, сроки просрочки, формулы или методы оценки, которых нет в тексте.
        4. Разграничение значений для отсутствующих данных:
           - для полей *_status возвращай технический код "not_defined";
           - для текстовых полей *_details возвращай строку "Данные не определены".
        5. Не используй "None", "null", пустые строки ни в одном поле.
        6. В evidence включай только текст договора.
        7. Если методика сальдо или правила изъятия содержатся в Общих правилах лизинга (Приложении к договору),
           на которые есть прямая ссылка в тексте, это НЕ считается отсутствием данных. В таком случае:
           - соответствующий статус устанавливай как "defined";
           - соответствующее поле *_details заполняй как "Определяется согласно [название приложения/правил]".
        8. Если в тексте есть противоречивые условия об ответственности и расторжении, отдавай приоритет
           специальному разделу о расторжении/дефолте и приводи оба фрагмента в evidence.
        9. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "При просрочке более 2 месяцев подряд Лизингодатель вправе в одностороннем
        порядке расторгнуть договор и изъять предмет лизинга. Задолженность
        взыскивается на основании исполнительной надписи нотариуса. При расторжении
        рассчитывается сальдо встречных обязательств. Стоимость возвращённого
        предмета определяется по рыночной оценке независимого оценщика. Если сальдо
        в пользу Лизингополучателя — разница возвращается."

        Ответ:
        {
          "uncontested_recovery_status": "not_defined",
          "uncontested_recovery_details": "Данные не определены",
          "notarial_enforcement_status": "defined",
          "notarial_enforcement_details": "на основании исполнительной надписи нотариуса",
          "repossession_status": "defined",
          "repossession_details": "вправе изъять предмет лизинга при просрочке более 2 месяцев",
          "default_termination_status": "defined",
          "default_termination_details": "вправе в одностороннем порядке расторгнуть при просрочке более 2 месяцев подряд",
          "saldo_methodology_status": "defined",
          "saldo_methodology_details": "рассчитывается сальдо встречных обязательств",
          "returned_asset_valuation_status": "defined",
          "returned_asset_valuation_details": "по рыночной оценке независимого оценщика",
          "excess_return_status": "defined",
          "excess_return_details": "разница возвращается Лизингополучателю",
          "evidence": [
            {
              "clause_ref": "п. 8.1",
              "quote": "При просрочке более 2 месяцев подряд Лизингодатель вправе в одностороннем порядке расторгнуть договор и изъять предмет лизинга."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Ответственность сторон определяется законодательством РФ."

        Ответ:
        {
          "uncontested_recovery_status": "not_defined",
          "uncontested_recovery_details": "Данные не определены",
          "notarial_enforcement_status": "not_defined",
          "notarial_enforcement_details": "Данные не определены",
          "repossession_status": "not_defined",
          "repossession_details": "Данные не определены",
          "default_termination_status": "not_defined",
          "default_termination_details": "Данные не определены",
          "saldo_methodology_status": "not_defined",
          "saldo_methodology_details": "Данные не определены",
          "returned_asset_valuation_status": "not_defined",
          "returned_asset_valuation_details": "Данные не определены",
          "excess_return_status": "not_defined",
          "excess_return_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о бесспорном/безакцептном списании со счёта.
        2. Найди прямую цитату об исполнительной надписи нотариуса.
        3. Найди прямую цитату о праве изъятия предмета лизинга.
        4. Найди прямую цитату об основаниях одностороннего расторжения/отказа при default.
        5. Найди прямую цитату о методике расчёта сальдо встречных обязательств.
        6. Найди прямую цитату о порядке оценки возвращённого/изъятого имущества.
        7. Найди прямую цитату о возврате положительного сальдо (излишка) Лизингополучателю.
        8. Если прямой цитаты нет — верни "not_defined" в status и "Данные не определены" в details.
        9. Проверь, что в ответе присутствуют все ключи, объявленные в fields.

        Не выводи шаги проверки. Верни РОВНО один JSON-объект без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ФОРМАТ ОТВЕТА]
        {
          "uncontested_recovery_status": "<defined / not_defined>",
          "uncontested_recovery_details": "<текст или 'Данные не определены'>",
          "notarial_enforcement_status": "<defined / not_defined>",
          "notarial_enforcement_details": "<текст или 'Данные не определены'>",
          "repossession_status": "<defined / not_defined>",
          "repossession_details": "<текст или 'Данные не определены'>",
          "default_termination_status": "<defined / not_defined>",
          "default_termination_details": "<текст или 'Данные не определены'>",
          "saldo_methodology_status": "<defined / not_defined>",
          "saldo_methodology_details": "<текст или 'Данные не определены'>",
          "returned_asset_valuation_status": "<defined / not_defined>",
          "returned_asset_valuation_details": "<текст или 'Данные не определены'>",
          "excess_return_status": "<defined / not_defined>",
          "excess_return_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 10
      temperature: 0.0
      max_tokens: 850

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "бесспорное списание безакцептное исполнительная надпись нотариуса изъятие предмета лизинга одностороннее расторжение сальдо встречных обязательств завершающая обязанность стоимость возвращённого предмета оценка излишек"
      retrieval_profile: "event_of_default_check"
      preferred_unit_types:
        - termination_provision
        - liability_provision
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - remedies
        - procedures
        - obligations
      negative_keywords:
        - "лизинговые платежи"
        - "выкупная цена"
        - "предмет лизинга"
        - "страхование"
        - "приёмка"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.45, 0.95]
        boost: 0.18
        scope: segment
      context_k: 10
      max_chunks: 12
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "remedies"
        - "procedures"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 750

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1500

      compact_output: false

      presence_signal:
        field: "leasing_default_and_saldo_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора лизинга default
        remedies: бесспорное списание, исполнительную надпись нотариуса, изъятие,
        досрочное расторжение, сальдо встречных обязательств, оценку возвращённого предмета и возврат излишка.
        Не анализируй график регулярных платежей, условия страхования или порядок первоначальной приёмки.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. leasing_default_and_saldo_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (uncontested_recovery_status, notarial_enforcement_status,
              repossession_status, default_termination_status,
              saldo_methodology_status, returned_asset_valuation_status,
              excess_return_status) ≠ "not_defined";
           - "missing" — если все семь содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - все *_status = "not_defined";
           - все *_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. uncontested_recovery_status — "defined" если бесспорное (безакцептное) списание
           со счетов прямо предусмотрено, иначе "not_defined".
        2. uncontested_recovery_details — формулировка о бесспорном списании.
        3. notarial_enforcement_status — "defined" если исполнительная надпись нотариуса
           прямо указана как механизм взыскания задолженности, иначе "not_defined".
        4. notarial_enforcement_details — формулировка об исполнительной надписи нотариуса.
        5. repossession_status — "defined" если право изъятия предмета лизинга при
           нарушении обязательств прямо предусмотрено, иначе "not_defined".
        6. repossession_details — формулировка о праве и порядке изъятия.
        7. default_termination_status — "defined" если основания одностороннего
           расторжения/отказа от договора при default прямо указаны, иначе "not_defined".
        8. default_termination_details — формулировка об основаниях расторжения при нарушении.
        9. saldo_methodology_status — "defined" если методика расчёта сальдо встречных
           обязательств при расторжении прямо описана (или дана ссылка на правила), иначе "not_defined".
        10. saldo_methodology_details — формулировка о методике расчёта сальдо.
        11. returned_asset_valuation_status — "defined" если метод оценки возвращённого/изъятого
            предмета прямо указан (рыночная, ликвидационная, оценщик и т.п.), иначе "not_defined".
        12. returned_asset_valuation_details — формулировка о методе оценки предмета.
        13. excess_return_status — "defined" если прямо указано, что при положительном
            сальдо в пользу лизингополучателя излишек (разница) ему возвращается, иначе "not_defined".
        14. excess_return_details — формулировка о возврате излишка.

        Разграничение значений для отсутствующих данных:
        - для полей *_status возвращай технический код "not_defined";
        - для текстовых полей *_details возвращай строку "Данные не определены".
        </task>

        <context_rules>
        - Перед остальными полями заполни leasing_default_and_saldo_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Данные не определены".
        - Используй только текст договора. Не подставляй нормы закона.
        - Не выдумывай формулы сальдо, основания расторжения, сроки или оговорки о нотариусе, которых нет в тексте.
        - Не используй null, None, пустые строки ни в одном поле.
        - Если методика сальдо или процедура изъятия определяются согласно Общим условиям / Правилам лизинга, ставь статус "defined", а в деталях пиши "Определяется согласно [название документа]".
        - Если в тексте есть противоречивые условия об ответственности и расторжении, используй положения из специального раздела о дефолте/расторжении и приводи оба фрагмента в evidence.
        - Различай: бесспорное списание, исполнительная надпись, изъятие, расторжение, сальдо, оценка предмета и возврат излишка — это разные поля.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни бесспорного списания, ни исполнительной надписи, ни изъятия,
           ни расторжения при default, ни сальдо, ни методов оценки, ни возврата излишка.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены".

        2. Указана только часть механизмов.
           Например, есть право изъятия и расторжения, но нет методики расчёта сальдо.
           → presence = "present";
             раскрытые *_status = "defined";
             нераскрытые *_status = "not_defined";
             нераскрытые *_details = "Данные не определены".

        3. Противоречие между фрагментами.
           В разных пунктах указаны разные основания расторжения, разные сроки просрочки
           или разные методики расчёта сальдо.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             соответствующий *_details = "Не удалось определить".

        4. Отсылка на Общие правила лизинга / Приложение.
           Методика расчёта сальдо или правила изъятия определяются согласно Общим правилам лизинга
           или иному Приложению, на которое есть прямая ссылка.
           → presence = "present";
             соответствующий *_status = "defined";
             *_details содержит формулировку вида "Определяется согласно [название документа]".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для leasing_default_and_saldo_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined" или "not_defined".
        - Fallback при отсутствии данных: все *_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности: соответствующие *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "leasing_default_and_saldo_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по default remedies и сальдо. Внутреннее агрегатное signal-поле."
          required: true

        - name: "uncontested_recovery_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус бесспорного списания."
          required: true
          display_in_grid: false
        - name: "uncontested_recovery_details"
          type: "string"
          presentation: "fact"
          label: "Бесспорное списание"
          description: "Формулировка о безакцептном/бесспорном списании средств."
          required: false
          display_in_grid: false
