        - buyout_model_code:
            - "included_in_payments" — выкупная стоимость входит в лизинговые платежи.
            - "separate_price" — выкупная стоимость уплачивается отдельно.
            - "not_defined" — модель не определена.
        - Верни только JSON.
        </rules>
