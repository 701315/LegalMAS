          allowed_values: ["defined", "not_defined"]
          description: "Статус обязанности страхования."
          required: true
        - name: "insurance_obligor"
          type: "string"
          presentation: "signal"
          allowed_values: ["lessee", "lessor", "both", "not_defined"]
          description: "Кто обязан застраховать."
          required: false
        - name: "insurance_obligation_details"
          type: "string"
