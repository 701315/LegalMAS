        - pattern: "(?i)лизингов[ыеых]\\s+платеж[ией]"
          weight: 0.9
          distinctiveness: high
          context: any
          description: "Лизинговые платежи — ключевой финансовый элемент договора"

        - pattern: "(?i)график\\s+лизингов[ыхых]\\s+платеж[ейи]"
          weight: 0.9
          distinctiveness: high
          context: any
          description: "График лизинговых платежей"

        - pattern: "(?i)выкупн[аяое]\\s+цен[ауы]"
          weight: 0.9
          distinctiveness: high
          context: any
