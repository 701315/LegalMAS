# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 3: SHARED PATTERNS
#  Читается: DocTypeCheckLoader через _resolve_yaml_templates()
# ════════════════════════════════════════════════════════════════════════════

shared_patterns:

  money_amount: "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|тыс|млн|млрд|usd|eur)\\b"
  date_pattern: "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"
  percentage: "(?i)\\b\\d+[,.]?\\d*\\s*%\\b"
  cadastral_number: "(?i)\\b\\d{2}:\\d{2}:\\d{6,7}:\\d+\\b"
  vin_number: "(?i)\\b[A-HJ-NPR-Z0-9]{17}\\b"
  inn_ogrn: "(?i)\\b(?:ИНН|ОГРН|ОГРНИП|КПП)\\s*:?\\s*\\d{9,15}\\b"

compliance_rules: []

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: CHECKS_V8 — LLM/hybrid проверки
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 1: Стороны лизинга
  # ──────────────────────────────────────────────────────────────────────────
  - id: leasing_parties_and_vendor
    name: "Стороны лизинга: лизингодатель, лизингополучатель, продавец и выбор продавца"
    description: >
      Фактографическая проверка идентификации сторон договора лизинга,
      продавца, реквизитов, подписантов и указания на то, кто выбрал продавца.
    triggers: ~
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "лизингодатель"
        - "лизингополучатель"
        - "продавец"
        - "в лице"
        - "действующего на основании"
        - "ИНН"
        - "ОГРН"
        - "выбор продавца"
        - "по выбору лизингополучателя"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(лизингодатель|лизингополучатель|продавец).*именуем"
        - "(?i)\\b(?:ИНН|ОГРН|ОГРНИП|КПП)\\s*:?\\s*\\d{9,15}\\b"
        - "(?i)по\\s+выбору\\s+(лизингополучател|лизингодател)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор лизинга по ФЗ-164 и §6 Главы 34 ГК РФ.
        Проверяется только один вопрос: идентификация сторон, продавца
        и указание на выбор продавца.

        Нормативный ориентир:
        - ст. 665 ГК РФ — существенные условия лизинга
        - ст. 670 ГК РФ — солидарная ответственность при выборе продавца лизингодателем

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Кто указан как Лизингодатель.
        2. Кто указан как Лизингополучатель.
        3. Кто указан как Продавец.
        4. Кто подписывает от каждой стороны и на каком основании.
        5. Указано ли, кто выбрал продавца.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если данные не указаны прямо — возвращай "Данные не определены" или "not_defined".
        4. Не используй "None", "null", "not_specified" или пустые строки.
        5. В evidence включай только текст договора.
        6. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "ООО «ЛизингПро» (ИНН 7700000001), именуемое «Лизингодатель», в лице
        директора Иванова И.И., действующего на основании Устава, ООО «Завод»
        (ИНН 7700000002), именуемое «Лизингополучатель», в лице Петрова П.П.,
        действующего на основании доверенности. Продавец — ООО «Поставщик»
        (ИНН 7700000003), выбранный Лизингополучателем."

        Ответ:
        {
          "lessor_details_status": "defined",
          "lessor_details_value": "ООО «ЛизингПро», ИНН 7700000001",
          "lessor_signatory_status": "defined",
          "lessor_signatory_value": "директор Иванов И.И.",
          "lessor_signatory_basis": "charter",
          "lessee_details_status": "defined",
          "lessee_details_value": "ООО «Завод», ИНН 7700000002",
          "lessee_signatory_status": "defined",
          "lessee_signatory_value": "Петров П.П.",
          "lessee_signatory_basis": "poa",
          "vendor_details_status": "defined",
          "vendor_details_value": "ООО «Поставщик», ИНН 7700000003",
          "vendor_selection_status": "defined",
          "vendor_selection_details": "выбранный Лизингополучателем",
          "evidence": [
            {
              "clause_ref": "Преамбула",
              "quote": "ООО «ЛизингПро» (ИНН 7700000001), именуемое «Лизингодатель»."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Стороны заключили договор лизинга."

        Ответ:
        {
          "lessor_details_status": "not_defined",
          "lessor_details_value": "Данные не определены",
          "lessor_signatory_status": "not_defined",
          "lessor_signatory_value": "Данные не определены",
          "lessor_signatory_basis": "not_defined",
          "lessee_details_status": "not_defined",
          "lessee_details_value": "Данные не определены",
          "lessee_signatory_status": "not_defined",
          "lessee_signatory_value": "Данные не определены",
          "lessee_signatory_basis": "not_defined",
          "vendor_details_status": "not_defined",
          "vendor_details_value": "Данные не определены",
          "vendor_selection_status": "not_defined",
          "vendor_selection_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату с Лизингодателем.
        2. Найди прямую цитату с Лизингополучателем.
        3. Найди прямую цитату с Продавцом.
        4. Найди прямую цитату о выборе продавца.
        5. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "lessor_details_status": "<defined / not_defined>",
          "lessor_details_value": "<текст или 'Данные не определены'>",
          "lessor_signatory_status": "<defined / not_defined>",
          "lessor_signatory_value": "<текст или 'Данные не определены'>",
          "lessor_signatory_basis": "<charter / poa / order / other / not_defined>",
          "lessee_details_status": "<defined / not_defined>",
          "lessee_details_value": "<текст или 'Данные не определены'>",
          "lessee_signatory_status": "<defined / not_defined>",
          "lessee_signatory_value": "<текст или 'Данные не определены'>",
          "lessee_signatory_basis": "<charter / poa / order / other / not_defined>",
          "vendor_details_status": "<defined / not_defined>",
          "vendor_details_value": "<текст или 'Данные не определены'>",
          "vendor_selection_status": "<defined / not_defined>",
          "vendor_selection_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 800

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "лизингодатель лизингополучатель продавец в лице действующего на основании ИНН ОГРН выбор продавца по выбору лизингополучателя"
      retrieval_profile: "party_identification_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - definitions
        - boilerplate
      negative_keywords:
        - "предмет лизинга"
        - "лизинговые платежи"
        - "выкупная цена"
        - "страхование"
        - "ремонт"
        - "возврат"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 0.20]
        boost: 0.25
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "definitions"
        - "boilerplate"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.15

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 1500

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора лизинга сведения
        о Лизингодателе, Лизингополучателе, Продавце, подписантах и выборе продавца.
        Не анализируй предмет лизинга, платежи, страхование или ремонт.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. lessor_details_status — "defined" если Лизингодатель прямо идентифицирован
           (указано наименование, ИНН или иные реквизиты), иначе "not_defined".
        2. lessor_details_value — наименование/ФИО и реквизиты Лизингодателя.
        3. lessor_signatory_status — "defined" если подписант Лизингодателя прямо
           указан, иначе "not_defined".
        4. lessor_signatory_value — подписант Лизингодателя.
        5. lessor_signatory_basis — "charter" / "poa" / "order" / "other" /
           "not_defined".
        6. lessee_details_status — "defined" если Лизингополучатель прямо
           идентифицирован, иначе "not_defined".
        7. lessee_details_value — наименование/ФИО и реквизиты Лизингополучателя.
        8. lessee_signatory_status — "defined" если подписант Лизингополучателя
           прямо указан, иначе "not_defined".
        9. lessee_signatory_value — подписант Лизингополучателя.
        10. lessee_signatory_basis — "charter" / "poa" / "order" / "other" /
            "not_defined".
        11. vendor_details_status — "defined" если Продавец прямо идентифицирован,
            иначе "not_defined".
        12. vendor_details_value — наименование/ФИО и реквизиты Продавца.
        13. vendor_selection_status — "defined" если указано, кто выбрал продавца
            (лизингодатель или лизингополучатель), иначе "not_defined".
        14. vendor_selection_details — формулировка о выборе продавца.

        Если данные отсутствуют:
        - статус = "not_defined"
        - текст = "Данные не определены"
        </task>

        <rules>
        - Используй только текст договора.
        - lessor_signatory_basis / lessee_signatory_basis:
            - "charter" — устав.
            - "poa" — доверенность.
            - "order" — приказ.
            - "other" — иное.
            - "not_defined" — не указано.
        - Верни только JSON.
        </rules>
      fields:
        - name: "lessor_details_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус идентификации Лизингодателя."
          required: true
        - name: "lessor_details_value"
          type: "string"
          presentation: "fact"
          label: "Лизингодатель"
          description: "Реквизиты Лизингодателя."
          required: true
          display_in_grid: true
          display_priority: 1
        - name: "lessor_signatory_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус подписанта Лизингодателя."
          required: false
        - name: "lessor_signatory_value"
          type: "string"
          presentation: "fact"
          label: "Лизингодатель: подписант"
          description: "Подписант от Лизингодателя."
          required: false
          display_in_grid: false
        - name: "lessor_signatory_basis"
          type: "string"
          presentation: "signal"
          allowed_values: ["charter", "poa", "order", "other", "not_defined"]
          description: "Основание полномочий подписанта Лизингодателя."
          required: false
        - name: "lessee_details_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус идентификации Лизингополучателя."
          required: true
        - name: "lessee_details_value"
          type: "string"
          presentation: "fact"
          label: "Лизингополучатель"
          description: "Реквизиты Лизингополучателя."
