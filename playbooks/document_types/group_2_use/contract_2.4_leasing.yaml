          label: "Выбор продавца"
          description: >
            Формулировка о том, кто выбрал продавца. Определяет режим ответственности
            по ст. 670 ГК РФ: при выборе продавца лизингодателем — солидарная
            ответственность лизингодателя и продавца перед лизингополучателем.
